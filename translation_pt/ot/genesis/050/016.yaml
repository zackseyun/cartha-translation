lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: mandaram dizer
  rationale: Embora צוה normalmente signifique “ordenar”, neste contexto introduz a transmissão de um recado a José. “Mandaram dizer” é idiomático em português e mantém a ação comunicativa sem sugerir que os irmãos deram uma ordem a José.
- source_word: אֶל יוֹסֵף
  choice: a José
  rationale: Indica José como destinatário do recado; a regência de “mandaram dizer” torna “a José” natural em português.
- source_word: לֵאמֹר
  choice: '[incorporado nos dois-pontos]'
  rationale: O primeiro לֵאמֹר introduz o discurso citado. Em português, os dois-pontos cumprem essa função com maior naturalidade.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Reproduz a forma possessiva de segunda pessoa dirigida a José.
- source_word: צִוָּה
  choice: deu esta ordem
  rationale: Preserva o sentido normal de צוה e introduz naturalmente o conteúdo da ordem que vem no versículo seguinte.
- source_word: לִפְנֵי מוֹתוֹ
  choice: antes de morrer
  rationale: Expressa com clareza o sentido temporal da locução hebraica, em linguagem portuguesa corrente.
- source_word: לֵאמֹר
  choice: dois-pontos finais
  rationale: O segundo לֵאמֹר anuncia as palavras da ordem no versículo seguinte; os dois-pontos preservam essa função discursiva sem a repetição pouco natural de “dizendo”.
