  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: pt
  text: 'Quando os irmãos de José viram que seu pai havia morrido, disseram: “E se José nos guardar rancor e nos fizer pagar por todo o mal que lhe fizemos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ יוֹסֵף
  choice: E se José nos guardar rancor
  rationale: A partícula לוּ introduz aqui uma possibilidade temida, e שׂטם expressa hostilidade ou rancor persistente. A formulação natural em português preserva o temor dos irmãos sem tornar certa a reação de José.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: e nos fizer pagar
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ideia de retribuição. “Fizer pagar” comunica de modo idiomático que José poderia retribuir plenamente o mal recebido.
- source_word: אֵת כָּל הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: por todo o mal que lhe fizemos
  rationale: גמל com רעה denota praticar ou infligir o mal contra alguém. Esta tradução é clara, direta e mantém a totalidade indicada por כָּל.
theological_decisions:
- issue: O temor dos irmãos quanto à intenção de José
  choice: “E se José...”
  alternative: “José certamente...” ou “Talvez José...”
  rationale: O hebraico apresenta uma possibilidade temida, não uma afirmação de que José de fato os odiava ou buscaria vingança. A tradução preserva essa incerteza narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com construção idiomática de ampla compreensão no Brasil e em outros contextos lusófonos. “Guardar rancor” representa a hostilidade duradoura de שׂטם; “fazer pagar” transmite naturalmente a retribuição enfática.
