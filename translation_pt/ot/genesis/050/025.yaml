  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: pt
  text: 'Então José fez os filhos de Israel jurarem, dizendo: “Deus certamente cuidará de vocês; então levem os meus ossos daqui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: fez ... jurarem
  rationale: O hifil expressa que José impôs ou recebeu deles um juramento; esta formulação é natural em português e preserva a força causativa.
- source_word: פָּקֹד יִפְקֹד
  choice: certamente cuidará
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza. Neste contexto, פקד indica a intervenção atenta e favorável de Deus, não uma simples visita física.
- source_word: וְהַעֲלִתֶם
  choice: então levem
  rationale: O hifil de עלה significa fazer subir ou levar para cima. 'Levem' soa natural em português, e 'então' explicita a sequência ligada à futura intervenção divina sem enfraquecer a ordem.
- source_word: עַצְמֹתַי
  choice: os meus ossos
  rationale: Tradução direta que conserva a referência aos restos mortais de José.
- source_word: מִזֶּה
  choice: daqui
  rationale: Equivalente idiomático direto, referindo-se ao Egito como o lugar de onde os ossos seriam retirados.
theological_decisions:
- issue: Sentido da intervenção futura de Deus em פָּקֹד יִפְקֹד
  choice: Deus certamente cuidará de vocês
  alternative: Deus certamente visitará vocês
  rationale: ‘Cuidará’ comunica em português atual a intervenção providencial e favorável esperada, sem sugerir mera presença ou visita física; o contexto posterior define esse cuidado como libertação e condução.
- issue: Força de וְהַעֲלִתֶם após a declaração divina
  choice: então levem os meus ossos daqui
  alternative: e vocês levarão os meus ossos daqui
  rationale: A forma verbal pode ser entendida no fluxo como exigência vinculada ao juramento. O imperativo em português preserva essa força obrigatória, enquanto ‘então’ mantém a ligação temporal com a ação futura de Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita literalismos pouco naturais, mas mantém a solenidade do juramento, a certeza enfática da ação divina e a obrigação de transportar os ossos de José.
