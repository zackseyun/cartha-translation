  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: pt
  text: 'José, porém, lhes disse: “Não tenham medo, pois acaso estou eu no lugar de Deus?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estou eu sob Deus?” A expressão hebraica é idiomática; aqui, o sentido mais provável é “Estou eu no lugar de Deus?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: lhes disse
  rationale: A construção narrativa com אמר e אֶל identifica os destinatários da fala; “lhes disse” é conciso e natural em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico יוֹסֵף em português.
- source_word: אַל תִּירָאוּ
  choice: Não tenham medo
  rationale: A proibição dirigida aos irmãos fica clara e idiomática em português contemporâneo; evita o tom menos corrente de “não temais”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da tranquilização de José e preserva a ligação explicativa com a pergunta retórica.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: acaso estou eu no lugar de Deus?
  rationale: “Acaso” sinaliza naturalmente a pergunta retórica, enquanto “no lugar de Deus” comunica o sentido idiomático mais provável de תַּחַת neste contexto, sem eliminar a alternativa mais literal registrada em nota.
theological_decisions:
- issue: Sentido da pergunta retórica de José sobre a prerrogativa divina
  choice: José nega estar no lugar de Deus para julgar ou executar vingança.
  alternative: José pergunta se está sob a autoridade de Deus.
  rationale: No contexto do medo de retaliação por parte dos irmãos, תַּחַת אֱלֹהִים significa mais provavelmente “no lugar de Deus”. A tradução preserva a distinção entre a função divina e a humana, enquanto a nota mantém visível a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Não tenham medo” evita arcaísmo; “acaso” preserva com naturalidade a força retórica da pergunta. O marcador da nota foi colocado junto à expressão que ela esclarece.
