  source_fidelity: 'A tradução preserva com precisão a estrutura do hebraico: a instrução de transmitir a mensagem a José, os dois pedidos de perdão, a dupla designação da falta ("transgressão" e "pecado"), a motivação de que lhe fizeram mal, a autodesignação como servos do Deus do pai de José e o choro de José ao ouvir a fala. "Pois lhe fizeram mal" expressa adequadamente כִּי רָעָה גְמָלוּךָ sem impor uma nuance interpretativa de retribuição.'
  naturalness: O português é moderno, claro e amplamente compreensível. "Assim vocês dirão", "por favor, perdoe" e "E José chorou" mantêm um registro digno sem arcaísmo. "Quando eles lhe disseram isso" é uma explicitação natural do ato de lhe falar e não altera o sentido.
