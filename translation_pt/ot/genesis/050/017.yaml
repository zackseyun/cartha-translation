  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: pt
  text: 'Assim vocês dirão a José: “Por favor, perdoe a transgressão de seus irmãos e o pecado deles, pois lhe fizeram mal. Agora, por favor, perdoe a transgressão dos servos do Deus de seu pai”. E José chorou quando eles lhe disseram isso.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: por favor, perdoe
  rationale: O verbo significa literalmente ‘levantar/carregar’, mas, com ‘transgressão’ como objeto, expressa idiomaticamente o ato de perdoar; נָא acrescenta súplica cortês.
- source_word: פֶּשַׁע ... וְחַטָּאתָם
  choice: a transgressão ... e o pecado deles
  rationale: Mantém os dois termos hebraicos e sua distinção lexical, sem os reduzir a uma única expressão.
- source_word: כִּי רָעָה גְמָלוּךָ
  choice: pois lhe fizeram mal
  rationale: Reproduz naturalmente a ideia de terem tratado José com maldade, sem impor o sentido mais específico de retribuição.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: os servos do Deus de seu pai
  rationale: Preserva a autodescrição religiosa dos irmãos e a forma singular ‘seu pai’.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: quando eles lhe disseram isso
  rationale: Expressa em português corrente a construção temporal hebraica e deixa claro que se trata da mensagem citada.
theological_decisions:
- issue: Relação entre a fraternidade e o serviço ao Deus do pai de José
  choice: Preservar ambas as designações no pedido, sem fundi-las
  alternative: Reformular como se o serviço a Deus fosse a razão explícita e exclusiva para o perdão
  rationale: O hebraico apresenta dois pedidos relacionados, mas não explicita uma construção teológica mais desenvolvida entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. ‘José’ segue a forma portuguesa tradicional do nome. A repetição de ‘por favor, perdoe’ preserva a insistência suplicante do hebraico.
