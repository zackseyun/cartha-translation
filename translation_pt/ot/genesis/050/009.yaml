  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: pt
  text: Também subiram com ele carros de guerra e cavaleiros, e a comitiva era muito grande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o acampamento era muito pesado”, isto é, muito grande, numeroso ou imponente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: Preserva o sentido básico de עלה, “subir”, adequado ao deslocamento narrado e concordando naturalmente com o sujeito composto posposto.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Tradução direta da preposição com sufixo pronominal, que no contexto se refere a José.
- source_word: גַּם ... גַּם
  choice: também ... e
  rationale: Expressa a adição enfática e une os dois contingentes em português natural, sem fazer dos cavaleiros um acréscimo desconexo.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: O singular hebraico é coletivo e designa aqui uma força de carros; o plural natural em português comunica isso com clareza.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: Designa homens montados; “cavaleiros” é claro, corrente e menos tecnicamente moderno que “cavalaria”.
- source_word: הַמַּחֲנֶה
  choice: o cortejo
  rationale: Neste contexto funerário e itinerante, refere-se ao grupo que viajava, não necessariamente a um acampamento estacionário. “Cortejo” comunica naturalmente a comitiva fúnebre.
- source_word: כָּבֵד מְאֹד
  choice: era muito numeroso
  rationale: Literalmente, “era muito pesado”; aplicado ao grupo, o idioma indica grande vulto, tamanho ou imponência. “Muito numeroso” torna claro o sentido contextual sem sugerir uma mudança de estado ausente do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Carros de guerra” evita a possível leitura de veículos comuns; “cortejo” mantém o cenário funerário e itinerante. A única nota preserva a imagem literal e a amplitude semântica de כָּבֵד.
