  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: pt
  text: e toda a casa de José[a], seus irmãos e a casa de seu pai; deixaram na terra de Gósen apenas seus filhos pequenos[b], seus rebanhos de ovelhas e cabras[c] e seus rebanhos de gado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “casa” significa a família ou o grupo doméstico, não apenas uma construção.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as crianças pequenas.
    reason: lexical_clarification
  - marker: c
    text: O termo hebraico se refere coletivamente ao gado miúdo, especialmente ovelhas e cabras.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל
  choice: e toda
  rationale: A conjunção liga este elemento à enumeração do versículo anterior, e כֹּל expressa totalidade.
- source_word: בֵּית יוֹסֵף
  choice: a casa de José
  rationale: Aqui, בַּיִת designa a família ou o conjunto de pessoas pertencentes à casa de José; a formulação conserva a imagem hebraica, esclarecida em nota.
- source_word: וְאֶחָיו
  choice: seus irmãos
  rationale: O plural de אָח refere-se aos irmãos homens de José no contexto narrativo.
- source_word: וּבֵית אָבִיו
  choice: e a casa de seu pai
  rationale: Mantém o paralelo lexical com 'casa de José' e denota a família ou o grupo doméstico ligado a seu pai.
- source_word: רַק
  choice: apenas
  rationale: 'Marca a limitação: esses foram os únicos integrantes e bens deixados em Gósen.'
- source_word: טַפָּם
  choice: seus filhos pequenos
  rationale: טַף se refere especialmente às crianças pequenas, não a todos os descendentes indistintamente.
- source_word: וְצֹאנָם
  choice: seus rebanhos de ovelhas e cabras
  rationale: צֹאן é um coletivo para o gado miúdo, sobretudo ovelhas e cabras; a explicitação evita a ambiguidade de 'rebanhos' isoladamente.
- source_word: וּבְקָרָם
  choice: seus rebanhos de gado
  rationale: בָּקָר indica bovinos ou gado de grande porte e contrasta com o gado miúdo da expressão anterior.
- source_word: עָזְבוּ
  choice: Deixaram
  rationale: O verbo indica que os deixaram ficar em Gósen, sem a conotação indevida de abandono.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Preserva explicitamente אֶרֶץ e a referência geográfica do hebraico.
