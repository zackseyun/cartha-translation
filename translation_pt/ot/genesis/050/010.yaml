  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: pt
  text: Quando chegaram à eira de Atade[a], que fica além do Jordão[b], fizeram ali um lamento muito grande e intenso[c]. E ele guardou luto por seu pai durante sete dias[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Atade” pode estar relacionado a uma palavra que significa “espinheiro” ou “sarça”, mas aqui funciona como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “do outro lado do Jordão” ou “além-Jordão”; a expressão hebraica, por si só, não especifica aqui qual margem está em vista.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “um lamento grande e muito pesado”; é uma expressão que comunica um luto extremamente intenso.
    reason: cultural_note
  - marker: d
    text: 'O verbo hebraico está no singular: “ele guardou luto”, provavelmente com referência específica a José. Algumas traduções empregam o plural: “eles guardaram luto”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: eira
  rationale: “Eira” é o termo português tradicional e preciso para o espaço onde se debulhavam e joeiravam cereais.
- source_word: הָאָטָד
  choice: Atade
  rationale: No contexto, o termo integra um topônimo. A transliteração portuguesa “Atade” preserva sua função de nome próprio; o possível sentido lexical é indicado em nota.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Preserva a expressão espacial hebraica e sua perspectiva geográfica não totalmente especificada, sem decidir qual margem está em vista.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: fizeram ... uma lamentação
  rationale: A construção hebraica combina verbo e substantivo da mesma raiz para intensificar o pranto fúnebre. A formulação portuguesa mantém o caráter público e solene sem uma repetição artificial.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: muito grande e profunda
  rationale: “Profunda” comunica naturalmente em português a intensidade e o peso emocional de כָבֵד neste contexto, enquanto “muito grande” preserva a forte intensificação.
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: guardou luto
  rationale: A expressão idiomática portuguesa transmite adequadamente o sentido de realizar ou observar um período formal de luto.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição explicita de modo natural em português a duração indicada pela expressão hebraica.
theological_decisions:
- issue: Sujeito do verbo singular וַיַּעַשׂ depois dos verbos no plural
  choice: 'Manter o singular: “ele guardou luto”, provavelmente referindo-se a José.'
  alternative: 'Traduzir coletivamente: “eles guardaram luto”.'
  rationale: O texto massorético passa explicitamente do plural (“chegaram”, “fizeram”) ao singular (“ele fez/guardou”). Manter essa mudança preserva a forma e a possível ênfase do original sem inserir o nome de José no corpo do texto.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. “Eira” conserva o vocabulário histórico concreto; “guardou luto” é idiomático e digno. As notas preservam a ambiguidade geográfica, a imagem hebraica de peso e a mudança deliberada do plural para o singular.
