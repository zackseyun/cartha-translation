base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: pt
  text: 'Quando os habitantes da terra, os cananeus, viram o luto na eira de Atade, disseram: “Este é um luto profundo dos egípcios”. Por isso, aquele lugar recebeu o nome de Abel-Mizraim[a], que fica do outro lado do Jordão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abel-Mizraim” soa em hebraico como “luto do Egito” e retoma a descrição feita pelos cananeus.
    reason: lexical_alternative
  - marker: b
    text: Ou “além do Jordão”; a expressão depende do ponto de vista geográfico de quem fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: os habitantes da terra, os cananeus
  rationale: O particípio singular tem sentido coletivo, e הַכְּנַעֲנִי identifica em aposição os moradores como cananeus. A formulação preserva essa estrutura sem perder naturalidade em português.
- source_word: הָאֵבֶל
  choice: o luto
  rationale: אֵבֶל designa o luto, especialmente as manifestações e cerimônias ligadas à morte; “luto” é direto e adequado ao contexto funerário.
- source_word: בְּגֹרֶן הָאָטָד
  choice: na eira de Atade
  rationale: גֹּרֶן é a área onde se debulhavam cereais, tradicionalmente chamada “eira” em português. Atade é transliterado como nome próprio.
- source_word: אֵבֶל כָּבֵד
  choice: um luto profundo
  rationale: כָּבֵד significa literalmente “pesado” e, neste contexto, intensifica o luto. “Profundo” comunica de modo natural sua grande intensidade, sem sugerir que o ritual em si fosse rigoroso ou severo.
- source_word: לְמִצְרָיִם
  choice: dos egípcios
  rationale: Embora מִצְרָיִם seja o topônimo “Egito”, o contexto associa o luto ao grupo egípcio presente. “Dos egípcios” expressa essa relação naturalmente.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressão inferencial que introduz a explicação do nome; “Por isso” é clara e corrente.
- source_word: קָרָא שְׁמָהּ
  choice: aquele lugar recebeu o nome
  rationale: A fórmula hebraica de nomeação tem sujeito não especificado. A construção portuguesa evita introduzir um agente e torna explícito que o nome pertence ao local, conforme o contexto.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel-Mizraim
  rationale: O topônimo é transliterado no texto; a nota registra o jogo sonoro com אֵבֶל, “luto”, e seu sentido provável.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão indica o lado oposto do Jordão em relação ao ponto de vista pressuposto. Esta tradução é natural, mas a referência geográfica depende da perspectiva, o que é indicado em nota.
theological_decisions: []
translation_notes:
