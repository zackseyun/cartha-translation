base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: pt
  text: “E agora, não tenham medo. Eu mesmo sustentarei vocês e seus pequeninos.” Assim, José os consolou e falou ao coração deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falou-lhes com bondade” ou “falou-lhes de modo tranquilizador”; literalmente, “falou ao coração deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Preserva tanto a ligação conclusiva quanto o valor temporal da expressão hebraica, em português natural.
- source_word: אַל תִּירָאוּ
  choice: não tenham medo
  rationale: Expressa de modo corrente a proibição e a tranquilização dirigidas ao grupo.
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: Representa a ênfase do pronome independente, destacando o compromisso pessoal de José.
- source_word: אֲכַלְכֵּל
  choice: sustentarei
  rationale: O verbo indica prover sustento material, especialmente alimento; “sustentarei” mantém essa amplitude sem exigir complemento adicional.
- source_word: טַפְּכֶם
  choice: seus pequeninos
  rationale: Conserva a referência aos filhos pequenos e o tom familiar e afetuoso do termo.
- source_word: וַיְנַחֵם אֹתָם
  choice: Assim, José os consolou
  rationale: “Consolou” traduz naturalmente o piel de נחם neste contexto; explicitar José evita uma sequência pronominal menos clara em português.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: falou ao coração deles
  rationale: Preserva a imagem do idioma hebraico, que comunica uma fala terna, bondosa e tranquilizadora.
