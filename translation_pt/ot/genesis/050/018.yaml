  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your slaves.”
translation:
  language: pt
  text: 'Então os irmãos dele também foram, prostraram-se diante dele e disseram: “Aqui estamos como seus escravos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo hebraico עֲבָדִים pode designar servos ou escravos; aqui, “escravos” preserva a forte expressão de submissão dos irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram até lá
  rationale: הלך significa literalmente “ir/andar”. O contexto mostra movimento dos irmãos em direção a José; “foram até lá” mantém a perspectiva narrativa do hebraico e soa natural em português.
- source_word: גַּם אֶחָיו
  choice: os irmãos dele também
  rationale: 'גם marca adição: além da mensagem anteriormente enviada, os próprios irmãos comparecem. “Dele” é claro e natural no contexto.'
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: prostraram-se diante dele
  rationale: A construção נפל + לפני descreve cair diante de alguém em atitude de submissão. “Prostraram-se” comunica de modo conciso tanto o gesto físico quanto a deferência.
- source_word: וַיֹּאמְרוּ
  choice: e disseram
  rationale: Forma narrativa padrão que introduz o discurso direto.
- source_word: הִנֶּנּוּ
  choice: Aqui estamos
  rationale: Fórmula de apresentação pessoal que, neste contexto, expressa disponibilidade e submissão sem recorrer ao arcaísmo “eis-nos”.
- source_word: לְךָ לַעֲבָדִים
  choice: como seus escravos
  rationale: A construção expressa a condição em que eles se apresentam a José. “Como seus escravos” é idiomático em português e preserva a intensidade da submissão oferecida.
- source_word: עֲבָדִים
  choice: escravos
  rationale: עבד pode designar tanto servo quanto escravo. Neste contexto de submissão total, “escravos” preserva a força da declaração, enquanto a alternativa legítima é registrada em nota.
theological_decisions:
- issue: Sentido de עֲבָדִים numa declaração de autossubmissão
  choice: escravos
  alternative: servos
  rationale: O termo hebraico admite ambos os sentidos. A postura dos irmãos e sua oferta de sujeição a José favorecem aqui a opção mais forte, “escravos”, sem negar a ambiguidade lexical, que é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prostraram-se” evita uma formulação física pouco natural, e “Aqui estamos” mantém a vivacidade da fala. O marcador [a] aparece imediatamente após o termo ao qual se refere.
