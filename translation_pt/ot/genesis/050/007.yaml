  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: pt
  text: Então José subiu para sepultar seu pai,[a] e com ele subiram todos os servos do faraó, os anciãos da casa do faraó e todos os anciãos da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “subiu” reflete o modo tradicional de descrever uma viagem do Egito para Canaã.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido básico de עָלָה e o modo hebraico tradicional de descrever a viagem do Egito para Canaã.
- source_word: לִקְבֹּר
  choice: para sepultar
  rationale: Expressa com naturalidade a finalidade indicada pelo infinitivo de קָבַר; “sepultar” mantém um registro digno e corrente.
- source_word: אָבִיו
  choice: seu pai
  rationale: Reproduz diretamente o substantivo com sufixo possessivo, sem acrescentar ênfase ausente no hebraico.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: com ele subiram
  rationale: Mantém a repetição de עָלָה e o ritmo narrativo do original, em ordem natural no português.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: todos os servos do faraó
  rationale: עֶבֶד pode designar servo, escravo ou oficial. “Servos” preserva a amplitude lexical sem especificar indevidamente a posição dessas pessoas na corte.
- source_word: זִקְנֵי בֵיתוֹ
  choice: os anciãos da casa do faraó
  rationale: “Anciãos” traduz זִקְנֵי, enquanto “casa” preserva בֵיתוֹ. A explicitação de “do faraó” evita que o possessivo seja atribuído a José e comunica aqui a casa real ou corte.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: e todos os anciãos da terra do Egito
  rationale: Preserva tanto זִקְנֵי, “anciãos”, quanto אֶרֶץ, “terra”, distinguindo a liderança mais ampla do país daquela ligada à casa do faraó.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “subiu/subiram” e a expressão “terra do Egito” foram mantidas para conservar o relevo e o ritmo do hebraico; “faraó” aparece em minúscula por funcionar como título.
