  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: pt
  text: Então José ordenou a seus servos, os médicos, que embalsamassem seu pai; e os médicos embalsamaram Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel, isto é, Jacó.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma determinação dada com autoridade; «ordenou» preserva essa força de modo natural em português.
- source_word: עֲבָדָיו אֶת־הָרֹפְאִים
  choice: aos médicos que estavam a seu serviço
  rationale: A construção identifica os servos de José mais precisamente como médicos. Esta formulação evita sugerir que ele deu a ordem a todos os servos e, depois, separadamente aos médicos; também preserva, sem enfatizar em excesso, a relação de serviço expressa por עבד.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: que embalsamassem / embalsamaram
  rationale: Neste contexto egípcio, חנט designa a preservação do cadáver por embalsamamento. A repetição da mesma raiz é mantida em português.
- source_word: אָבִיו
  choice: seu pai
  rationale: Equivalente direto e natural da forma possessiva hebraica.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O texto hebraico chama o pai de José de Israel neste ponto; a tradução conserva essa escolha nominal em vez de substituí-la por Jacó.
theological_decisions:
- issue: Sentido social de עֲבָדָיו no ambiente da corte egípcia
  choice: que estavam a seu serviço
  alternative: seus escravos
  rationale: עבד pode designar tanto servo quanto escravo. O contexto destaca a função dos médicos ligados à casa de José, não sua condição jurídica; a redação escolhida preserva a relação de subordinação sem decidir além do que o contexto exige.
- issue: Alternância entre «seu pai» e «Israel»
  choice: preservar ambos como no hebraico
  alternative: usar «Jacó» nas duas ocorrências ou esclarecer «Israel, isto é, Jacó» no corpo do texto
  rationale: A alternância é deliberada no texto-fonte e deve permanecer visível, sem harmonização interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação explicita naturalmente que os médicos pertenciam ao pessoal a serviço de José, mantendo a ambiguidade social de עבד em nota.
