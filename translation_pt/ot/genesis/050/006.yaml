  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: pt
  text: 'Então o faraó disse: “Suba e sepulte seu pai, conforme seu pai fez você jurar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência em português sem acrescentar uma relação causal.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Título tradicional e amplamente reconhecido em português para o governante egípcio.
- source_word: עֲלֵה
  choice: Suba
  rationale: Preserva o sentido direcional de עלה, pois a viagem é do Egito para Canaã; “Vá” apagaria essa nuance.
- source_word: וּקְבֹר
  choice: e sepulte
  rationale: Traduz diretamente קבר em registro atual e digno; “enterre” seria possível, mas “sepulte” combina naturalidade com o contexto funerário.
- source_word: אֶת אָבִיךָ
  choice: seu pai
  rationale: Representa de modo direto o substantivo com sufixo de segunda pessoa masculina singular; o marcador de objeto אֶת não recebe tradução independente.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa comparação ou conformidade de modo natural, ligando a permissão do faraó ao juramento anteriormente exigido.
- source_word: הִשְׁבִּיעֶךָ
  choice: ele fez você jurar
  rationale: 'Mantém a força causativa do hifil de שׁבע: o pai levou José a prestar o juramento, em vez de José simplesmente jurar por iniciativa própria.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A forma de tratamento é mantida no singular pela construção com “você”, evitando arcaísmo; “Suba” conserva a direção geográfica e narrativa do hebraico.
