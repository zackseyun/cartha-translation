  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: pt
  text: Assim, José morreu aos cento e dez anos de idade.[a] Eles o embalsamaram[b] e o colocaram num caixão[c] no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E José morreu aos cento e dez anos de idade”. A conjunção inicial também pode ser traduzida simplesmente por “E”; “Assim” reflete o caráter conclusivo do fluxo narrativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mumificaram”. O verbo hebraico se refere ao embalsamamento, especialmente neste contexto egípcio.'
    reason: cultural_note
  - marker: c
    text: A palavra hebraica também é usada em outros contextos com o sentido de “arca” ou “cofre”; aqui, no contexto funerário, significa “caixão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O verbo מות denota diretamente a morte; “morreu” é claro, natural e evita eufemismo.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: aos cento e dez anos de idade
  rationale: A expressão hebraica usa literalmente “filho de” para indicar idade. A formulação escolhida reproduz o sentido em português corrente.
- source_word: וַיַּחַנְטוּ
  choice: embalsamaram
  rationale: O verbo חנט se refere ao tratamento de um corpo para preservá-lo, particularmente adequado ao contexto egípcio; “embalsamaram” é preciso sem especificar além do hebraico.
- source_word: וַיִּישֶׂם
  choice: colocaram
  rationale: שׂים significa pôr ou colocar. “Colocaram” mantém um tom narrativo digno e natural.
- source_word: בָּאָרוֹן
  choice: num caixão
  rationale: אָרוֹן pode significar arca, cofre ou caixão. Neste contexto funerário, depois do embalsamamento, “caixão” é o equivalente contextual mais claro. O artigo hebraico não exige que o recipiente já tenha sido mencionado em português.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: É a forma portuguesa padrão do topônimo e expressa naturalmente a localização.
- source_word: וַ
  choice: Assim
  rationale: O waw narrativo dá continuidade ao relato e, no encerramento de Gênesis, também pode ter valor conclusivo. “Assim” comunica essa progressão; “E” permanece uma alternativa possível.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o tom solene e conclusivo do versículo sem arcaísmos. Os marcadores foram posicionados junto aos termos a que cada nota efetivamente se refere.
