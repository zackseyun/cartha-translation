base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: pt
  text: 'Então José voltou para o Egito, juntamente com seus irmãos e todos os que tinham subido com ele[a] para sepultar seu pai, depois que José sepultou seu pai.[b]


    [a] Na linguagem bíblica, “subir” é a expressão comum para a viagem do Egito a Canaã.


    [b] Literalmente, “depois de ter sepultado seu pai”. A construção singular se refere mais naturalmente a José, embora todo o grupo tenha participado da viagem para o sepultamento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na linguagem bíblica, “subir” é a expressão comum para a viagem do Egito a Canaã.
    reason: Explica o idioma geográfico preservado na tradução.
  - marker: b
    text: Literalmente, “depois de ter sepultado seu pai”. A construção singular se refere mais naturalmente a José, embora todo o grupo tenha participado da viagem para o sepultamento.
    reason: Registra a construção hebraica e esclarece, sem dogmatizar, o referente mais provável do singular.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב descreve o retorno de José ao lugar de onde havia partido; “voltou” é natural e conciso em português.
- source_word: מִצְרַיְמָה
  choice: para o Egito
  rationale: O ה direcional indica movimento em direção ao Egito, expresso idiomaticamente por “para o Egito”.
- source_word: הוּא וְאֶחָיו
  choice: ele, seus irmãos
  rationale: Preserva o pronome enfático e a aposição do hebraico, mantendo José como sujeito principal sem apagar a inclusão de seus irmãos.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: e todos os que tinham subido com ele
  rationale: O particípio tem valor retrospectivo no contexto. “Tinham subido” preserva tanto a anterioridade quanto o idioma geográfico bíblico de subir do Egito a Canaã.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: para sepultar seu pai
  rationale: O infinitivo com ל expressa a finalidade da viagem. “Sepultar” oferece registro digno e corrente.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: depois que José sepultou seu pai
  rationale: אַחֲרֵי introduz a ação anterior ao retorno. Explicitar “José” evita uma referência pronominal ambígua em português, enquanto a nota registra a forma mais literal.
theological_decisions:
- issue: Agente do sepultamento na oração final
  choice: José
  alternative: José e todos os acompanhantes
  rationale: O sufixo masculino singular em קָבְרוֹ aponta gramaticalmente para José. A tradução não amplia o sujeito para o grupo, mas a nota reconhece o contexto coletivo da viagem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a ordem narrativa e o idioma de “subir”, explicando-o em nota. A repetição de “seu pai” acompanha a repetição enfática do hebraico.
