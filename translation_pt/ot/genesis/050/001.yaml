  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: pt
  text: Então José caiu sobre o rosto de seu pai, chorou sobre ele e o beijou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: se lançou
  rationale: O wayyiqtol de נפל descreve uma ação passada concluída. Neste contexto, “se lançou” comunica naturalmente o movimento físico de José sobre o corpo do pai, sem sugerir um desmaio involuntário.
- source_word: עַל פְּנֵי אָבִיו
  choice: sobre o rosto de seu pai
  rationale: Preserva a imagem concreta do hebraico, literalmente “sobre o rosto de seu pai”, e mantém o gesto físico vívido sem reduzi-lo a uma expressão apenas emocional.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: chorou sobre ele
  rationale: בכה significa chorar ou prantear. “Chorou” é corrente e digno; “sobre ele” conserva a construção espacial e o sentido contextual de luto junto ao corpo.
- source_word: וַיִּשַּׁק לוֹ
  choice: o beijou
  rationale: נשק no qal significa normalmente “beijar”; o pronome átono produz uma formulação portuguesa natural e fiel.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
