base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: pt
  text: 'José disse a seus irmãos: “Eu estou morrendo, mas Deus certamente cuidará[a] de vocês e os fará subir desta terra para a terra que jurou dar a Abraão, a Isaque e a Jacó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente visitará vocês”. A expressão hebraica pode indicar que Deus dirige sua atenção ao seu povo e intervém decisivamente em favor dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: O masculino plural, no contexto de Gênesis, refere-se especificamente aos irmãos homens de José.
- source_word: אָנֹכִי מֵת
  choice: Eu estou morrendo
  rationale: A construção participial indica a morte iminente de José e é expressa de modo natural em português.
- source_word: פָּקֹד יִפְקֹד
  choice: certamente cuidará de vocês
  rationale: O infinitivo absoluto seguido do imperfeito dá ênfase e certeza à ação. Neste contexto da aliança, o verbo indica a atenção efetiva de Deus, acompanhada de intervenção em favor do povo; “cuidará” preserva essa amplitude, enquanto a nota registra a alternativa mais literal.
- source_word: וֵאלֹהִים
  choice: mas Deus
  rationale: Embora a conjunção seja formalmente aditiva, o contexto estabelece um contraste natural entre a morte de José e a futura ação de Deus.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: e os fará subir
  rationale: Preserva a forma causativa e a imagem direcional do hebraico, que descreve a saída do Egito em direção à terra prometida.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: desta terra
  rationale: Tradução direta e natural; da perspectiva de José, refere-se ao Egito.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: para a terra que jurou dar
  rationale: O verbo “dar” está elíptico no hebraico, mas é exigido para uma formulação clara e natural em português e é estabelecido pelo contexto das promessas patriarcais.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Mantém a relação expressa pelas preposições hebraicas e a cadência solene da fórmula patriarcal.
theological_decisions:
- issue: Natureza da ação prometida de Deus em פָּקֹד יִפְקֹד
  choice: Deus certamente cuidará de vocês
  alternative: Deus certamente visitará vocês
  rationale: A construção afirma com ênfase que Deus voltará sua atenção para o povo e agirá em seu favor. A tradução principal evita reduzir a expressão a uma visita física, sem especificar além do texto como ocorrerá a intervenção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Fará subir” conserva a imagem espacial do hebraico; “jurou dar” explicita apenas o complemento elíptico requerido pelo contexto e pela naturalidade da língua.
