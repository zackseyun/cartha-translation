  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: pt
  text: José viu os filhos de Efraim até a terceira geração[a]. Também os filhos de Maquir, filho de Manassés, nasceram nos joelhos de José[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “José viveu para ver os filhos de Efraim até a terceira geração”. O hebraico diz literalmente “José viu”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “nasceram nos joelhos de José” pode indicar reconhecimento familiar, acolhimento ou aceitação especial dessas crianças.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Traduz literalmente o verbo ראה e permanece natural no contexto; a ideia contextual de que José viveu o suficiente para ver esses descendentes é indicada em nota, sem substituir a formulação hebraica.
- source_word: לְאֶפְרַיִם
  choice: de Efraim
  rationale: O ל na fórmula de descendência expressa relação genealógica; em português, “os filhos de Efraim” comunica isso com naturalidade.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: filhos ... até a terceira geração
  rationale: Preserva o alcance genealógico da expressão hebraica sem determinar além do texto o parentesco exato de cada geração.
- source_word: גַּם
  choice: Também
  rationale: Marca de modo simples e natural a adição paralela da segunda afirmação.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: os filhos de Maquir, filho de Manassés
  rationale: “Filhos” mantém a formulação genealógica de בְּנֵי, enquanto a aposição identifica Maquir como filho de Manassés.
- source_word: יֻלְּדוּ
  choice: nasceram
  rationale: Equivalente português direto e natural da forma passiva de ילד.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: sobre os joelhos de José
  rationale: Mantém a imagem concreta e a ambiguidade cultural do hebraico, em vez de impor no texto principal uma interpretação específica como adoção ou reconhecimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe conserva de perto as duas afirmações do hebraico, e as notas preservam tanto a literalidade de “viu” quanto a possível dimensão cultural de “sobre os joelhos”.
