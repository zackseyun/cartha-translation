  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: pt
  text: Completaram-se para ele quarenta dias, pois é assim que se completam os dias do embalsamamento[a]. E o Egito[b] chorou por ele durante setenta dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se completam os dias do embalsamamento”.'
    reason: alternative_reading
  - marker: b
    text: “Egito” é usado coletivamente para se referir aos egípcios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Completaram-se para ele quarenta dias
  rationale: Preserva o foco hebraico no término do período estabelecido e mantém o referente masculino, Jacó, sem introduzir explicitamente agentes não mencionados.
- source_word: כִּי כֵּן
  choice: pois assim
  rationale: Expressa de maneira concisa e natural o valor explicativo da locução hebraica.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: se completa o período do embalsamamento
  rationale: Comunica o tempo requerido pelo processo de embalsamar no contexto imediato, evitando uma reprodução obscura da forma participial hebraica.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: chorou por ele
  rationale: Mantém o sentido concreto de בכה, 'chorar', sem ampliá-lo para ritos formais de luto.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: Conserva o nome geográfico do hebraico, empregado coletivamente para os habitantes do país.
- source_word: שִׁבְעִים יוֹם
  choice: durante setenta dias
  rationale: A preposição acrescentada em português torna idiomática a expressão de duração sem alterar seu conteúdo.
