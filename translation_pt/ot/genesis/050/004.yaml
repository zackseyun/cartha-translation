base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: pt
  text: 'Quando passaram os dias de pranto por ele[a], José falou à corte de Faraó, dizendo: “Se encontrei favor aos olhos de vocês, por favor, falem a Faraó[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “os dias de seu pranto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “aos ouvidos de Faraó”, expressão que significa falar de modo que Faraó ouça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: terminaram
  rationale: O verbo עבר descreve aqui o transcurso e o fim de um período. “Terminaram” expressa com naturalidade que os dias de pranto haviam chegado ao fim antes de José falar.
- source_word: יְמֵי בְכִיתוֹ
  choice: os dias de seu pranto
  rationale: בכי denota literalmente choro ou pranto. A formulação mantém a expressão temporal do hebraico e não elimina a possível ambiguidade do sufixo.
- source_word: וַיְדַבֵּר יוֹסֵף אֶל בֵּית פַּרְעֹה
  choice: José falou à casa de Faraó
  rationale: בית designa coletivamente a casa real, isto é, os servidores ou cortesãos de Faraó. “Casa de Faraó” conserva a imagem hebraica e permanece compreensível em português.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Se achei favor aos olhos de vocês
  rationale: A tradução preserva o conhecido idioma hebraico de obter favor. A cortesia indicada por נָא é expressa naturalmente no pedido seguinte.
- source_word: דַּבְּרוּ נָא
  choice: por favor, falem
  rationale: O imperativo plural corresponde aos membros da casa real, e “por favor” comunica a força cortês da partícula נָא.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: a Faraó
  rationale: A expressão literal “aos ouvidos de Faraó” é um idioma para falar de modo que ele ouça. A tradução principal usa a forma portuguesa mais natural, registrando a imagem literal em nota.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a mensagem a ser transmitida, a qual continua no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com a cortesia do pedido preservada. A expressão “casa de Faraó” mantém a imagem social e institucional do hebraico; as notas registram tanto a ambiguidade de בְכִיתוֹ quanto o idioma corporal de בְּאָזְנֵי.
