  text: So his sons did for him as he had commanded them.
translation:
  language: pt
  text: Assim, os filhos de Jacó fizeram por ele conforme lhes havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: O verbo עשה é amplo, com o sentido de “fazer” ou “realizar”. Aqui, “fizeram” expressa naturalmente o cumprimento das instruções funerárias.
- source_word: בָנָיו
  choice: os filhos de Jacó
  rationale: O hebraico diz especificamente “seus filhos”. A explicitação de Jacó evita uma possível ambiguidade do possessivo em português e preserva o referente contextual.
- source_word: לוֹ
  choice: por ele
  rationale: A preposição ל indica que a ação foi realizada em favor de Jacó; “por ele” é idiomático e adequado ao contexto.
- source_word: כֵּן
  choice: Assim
  rationale: כֵּן indica o modo ou resultado correspondente às instruções anteriores. “Assim” mantém essa ligação de forma concisa e digna.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: A partícula comparativa indica que os filhos agiram em conformidade com a ordem recebida. “Conforme” é natural em português e preserva essa relação.
- source_word: צִוָּם
  choice: lhes havia ordenado
  rationale: צוה significa “ordenar” ou “mandar”. O mais-que-perfeito composto esclarece que a ordem precedeu seu cumprimento, como está implícito na sequência narrativa.
