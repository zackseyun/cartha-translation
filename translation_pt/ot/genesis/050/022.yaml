  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: pt
  text: José permaneceu no Egito[a], ele e a família de seu pai. José viveu 110 anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “habitou no Egito, ele e a casa de seu pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permaneceu
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar ou permanecer. Neste resumo narrativo, “permaneceu” expressa a continuidade da residência de José no Egito depois da morte de Jacó e evita repetir “viveu”, usado em seguida para sua longevidade.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Tradução locativa direta e natural em português.
- source_word: הוּא וּבֵית אָבִיו
  choice: ele e a família de seu pai
  rationale: בֵּית אָבִיו designa a casa paterna como unidade familiar ou doméstica, não apenas um edifício. “Família” é claro e natural para leitores atuais, embora “casa” preserve mais literalmente a expressão hebraica.
- source_word: וַיְחִי
  choice: viveu
  rationale: O verbo חיה introduz aqui a duração total da vida de José; “viveu” é a formulação portuguesa natural para uma declaração de longevidade.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 anos
  rationale: Preserva exatamente a idade indicada pelo hebraico, com algarismos para leitura imediata.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Permaneceu” distingue a residência continuada do posterior “viveu”, que indica longevidade. A divisão em duas frases reduz uma coordenação pesada sem alterar as relações do texto hebraico.
