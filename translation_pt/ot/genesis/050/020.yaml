  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: pt
  text: Quanto a vocês, planejaram o mal contra mim, mas Deus o planejou para o bem, a fim de produzir o que hoje se vê[a] — para manter muitas pessoas vivas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “realizar como neste dia”. A expressão hebraica aponta para o resultado presente, agora visível.
    reason: alternativa lexical para a expressão idiomática כַּיּוֹם הַזֶּה
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Quanto a vocês
  rationale: Preserva a construção enfática que põe a intenção dos irmãos em contraste com a de Deus.
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: planejaram / planejou
  rationale: O verbo חשב expressa aqui intenção deliberada. Repetir o mesmo verbo em português mantém o paralelismo intencional do hebraico entre o propósito humano e o propósito divino.
- source_word: עָלַי
  choice: contra mim
  rationale: Com חשב em um contexto hostil, a preposição על tem sentido adversativo.
- source_word: רָעָה
  choice: o mal
  rationale: Mantém a dimensão moral da ação culpável dos irmãos, sem reduzi-la a mero dano ou infortúnio.
- source_word: לְטֹבָה
  choice: para o bem
  rationale: Reproduz de modo claro e natural o contraste direto entre רָעָה e טֹבָה.
- source_word: לְמַעַן עֲשֹׂה
  choice: a fim de produzir
  rationale: לְמַעַן introduz propósito, e עשה descreve aqui a realização de um resultado histórico perceptível.
- source_word: כַּיּוֹם הַזֶּה
  choice: o que hoje se vê
  rationale: A expressão idiomática aponta para o resultado presente e visível; esta formulação comunica sua força dêitica em português corrente.
- source_word: לְהַחֲיֹת עַם רָב
  choice: manter muita gente viva
  rationale: O hifil de חיה significa preservar a vida. עַם רָב indica aqui um grande número de pessoas, expresso naturalmente por 'muita gente'.
theological_decisions:
- issue: Providência divina e mal humano nos usos paralelos de חשב
  choice: Empregar o mesmo verbo, 'planejar', para os irmãos e para Deus
  alternative: Usar verbos distintos, como 'planejar' para os irmãos e 'transformar' para Deus
  rationale: 'O hebraico contrapõe deliberadamente duas intenções relativas ao mesmo acontecimento. A repetição preserva a tensão: os irmãos planejaram o mal, enquanto Deus planejou o acontecimento para o bem, sem equiparar moralmente os agentes.'
- issue: Sentido moral de רָעָה
  choice: Traduzir por 'o mal'
  alternative: Traduzir por 'o dano'
  rationale: O contexto envolve uma ação humana culpável, não apenas uma consequência prejudicial; 'o mal' conserva esse peso moral.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A formulação evita arcaísmos e mantém o paralelismo teológico central do hebraico.
