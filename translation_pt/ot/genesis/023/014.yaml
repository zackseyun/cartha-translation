lexical_decisions:
- source_word: וַיַּעַן
  choice: respondeu
  rationale: O wayyiqtol de ענה introduz uma resposta no diálogo narrativo; “respondeu” é direto, natural e mantém a sequência do hebraico.
- source_word: עֶפְרוֹן
  choice: Efrom
  rationale: Forma tradicional e amplamente reconhecível em português para o nome hebraico עֶפְרוֹן.
- source_word: אֶת אַבְרָהָם
  choice: a Abraão
  rationale: אֶת marca o objeto direto e não recebe tradução própria; em português, “responder a alguém” pede normalmente a preposição “a”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala seguinte; “dizendo” preserva de modo natural a estrutura hebraica.
- source_word: לוֹ
  choice: -lhe
  rationale: O pronome retoma Abraão; o pronome dativo enclítico reproduz com concisão o sentido de “a ele”.
