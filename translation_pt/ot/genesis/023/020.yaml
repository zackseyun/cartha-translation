  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: pt
  text: Assim, o campo e a caverna que nele havia foram legalmente transferidos pelos filhos de Hete a Abraão, como propriedade destinada a sepultamento.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os hititas”, em vez de “os filhos de Hete”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficaram estabelecidos como propriedade de Abraão destinada a sepultamento”. O verbo hebraico pode ser traduzido mais formalmente dessa maneira; neste contexto, refere-se ao reconhecimento legal da propriedade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: foram legalmente transferidos
  rationale: No contexto da compra, קום indica que os bens passaram a constituir propriedade legalmente reconhecida de Abraão; a formulação explicita essa força jurídica sem recorrer ao sentido literal inadequado de 'levantar-se'.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: Equivalente direto e natural para a parcela adquirida.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: e a caverna que nele havia
  rationale: Preserva a oração relativa e faz o pronome retomar claramente 'o campo', em português corrente.
- source_word: לְאַבְרָהָם
  choice: a Abraão
  rationale: Identifica Abraão como destinatário e novo proprietário na transferência legal.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: como propriedade para sepultamento
  rationale: Mantém tanto a ideia jurídica de posse de אֲחֻזָּה quanto a finalidade funerária de קָבֶר.
- source_word: מֵאֵת
  choice: pelos
  rationale: No contexto passivo da transferência, expressa com naturalidade que os filhos de Hete eram a parte de quem procedia a propriedade.
- source_word: בְּנֵי חֵת
  choice: os filhos de Hete
  rationale: Reproduz de modo transparente a forma hebraica do etnônimo; 'os hititas' continua sendo uma alternativa contextual válida.
