translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A redação conserva a estrutura do hebraico, mas explicita a força jurídica de וַיָּקָם. Evitou-se uma terceira nota sobre a oração relativa, pois a tradução principal já a preserva sem perda ou ambiguidade relevante.
