  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: pt
  text: Efrom estava sentado entre os filhos de Hete[a], e Efrom, o hitita, respondeu a Abraão na presença dos filhos de Hete, diante de todos os que entravam pelo portão da cidade dele, dizendo:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os hititas”, aqui e na ocorrência seguinte; em hebraico, literalmente, “os filhos de Hete”.
    reason: lexical_alternative
  - marker: b
    text: O portão da cidade era o espaço público onde assuntos jurídicos e comerciais eram tratados diante de testemunhas.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: estava sentado
  rationale: O particípio descreve a posição ou o estado presente de Efrom na cena; a construção progressiva preserva essa nuance.
- source_word: בְּתוֹךְ
  choice: entre
  rationale: No contexto da assembleia, indica a presença de Efrom no meio do grupo de modo natural em português.
- source_word: בְּנֵי חֵת
  choice: os filhos de Hete
  rationale: Mantém a forma mais literal do hebraico e a distingue da designação étnica singular posterior; uma alternativa corrente é indicada em nota.
- source_word: וַיַּעַן
  choice: respondeu
  rationale: Equivalente direto e natural para o verbo em contexto de diálogo.
- source_word: הַחִתִּי
  choice: o hitita
  rationale: Preserva o artigo definido e a identificação étnica de Efrom.
- source_word: בְּאָזְנֵי
  choice: ao alcance dos ouvidos de
  rationale: Expressa a publicidade audível da resposta e conserva a imagem concreta da expressão hebraica sem soar excessivamente literal.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: e de todos os que entravam pelo portão da cidade dele
  rationale: Liga esses participantes ao alcance público da fala e representa o particípio como atividade costumeira ou em curso, sem pressupor que todos estivessem entrando naquele exato instante.
- source_word: שַׁעַר עִירוֹ
  choice: o portão da cidade dele
  rationale: Em português moderno, “portão” comunica com clareza a entrada urbana; a nota explica sua função pública e jurídica.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz de modo convencional a fala direta que continua no versículo seguinte.
