revisions:
- from: Efrom estava sentado entre os filhos de Hete[a]. Então Efrom, o hitita, respondeu a Abraão, ao alcance dos ouvidos dos filhos de Hete e de todos os que entravam pelo portão da cidade dele, dizendo:[b]
  to: Efrom estava sentado entre os filhos de Hete[a], e Efrom, o hitita, respondeu a Abraão na presença dos filhos de Hete, diante de todos os que entravam pelo portão da cidade dele, dizendo:[b]
  rationale: 'A revisão conserva todos os referentes e a publicidade da cena, mas separa corretamente os dois complementos preposicionais do hebraico: a resposta é dada na presença dos filhos de Hete e diante de todos os que entravam pelo portão da cidade. Também substitui uma expressão auditiva pouco idiomática por uma formulação portuguesa natural e remove o “Então” não explicitado na fonte.'
