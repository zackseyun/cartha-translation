    text: Ou “os hititas”, aqui e na ocorrência seguinte; em hebraico, literalmente, “os filhos de Hete”.
    reason: lexical_alternative
  - marker: b
    text: O portão da cidade era o espaço público onde assuntos jurídicos e comerciais eram tratados diante de testemunhas.
    reason: cultural_note
  revision_rationale: 'A revisão conserva todos os referentes e a publicidade da cena, mas separa corretamente os dois complementos preposicionais do hebraico: a resposta é dada na presença dos filhos de Hete e diante de todos os que entravam pelo portão da cidade. Também substitui uma expressão auditiva pouco idiomática por uma formulação portuguesa natural e remove o “Então” não explicitado na fonte.'
