  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: pt
  text: Então Abraão se curvou diante do povo da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrou-se diante do povo da terra”.'
    reason: Alternativa lexical que explicita um gesto corporal possivelmente mais profundo, sem alterar seu sentido de deferência social.
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou
  rationale: O verbo descreve um gesto físico de reverência ou deferência. Neste contexto de negociação com os hititas, “se curvou” comunica respeito sem sugerir culto; “prostrou-se” permanece uma alternativa possível, porém mais específica.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão significa “perante” ou “na presença de”. “Diante de” é natural em português e preserva o caráter público e relacional do gesto.
- source_word: עַם
  choice: povo
  rationale: Refere-se à população local como corpo social que presencia a negociação; “povo” é a equivalência mais direta e natural.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: Na expressão עַם הָאָרֶץ, “da terra” mantém a formulação hebraica e se refere aos habitantes da região.
- source_word: וַ
  choice: Então
  rationale: O waw com o wayyiqtol faz a narrativa avançar. “Então” expressa com naturalidade a sequência da ação em português moderno.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a expressão hebraica “povo da terra” e evita interpretar o gesto como adoração.
