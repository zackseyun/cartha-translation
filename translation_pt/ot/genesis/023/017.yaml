  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: pt
  text: Assim, o campo de Efrom em Macpela, que ficava diante de Manre — o campo, a caverna que nele havia e todas as árvores do campo, em toda a extensão de seus limites ao redor — foi confirmado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi estabelecido” ou “foi transferido”. Neste contexto de venda, o verbo hebraico provavelmente tem sentido jurídico, indicando a confirmação formal da propriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ficou confirmado
  rationale: 'Neste contexto de compra, o verbo קום tem sentido jurídico: a propriedade descrita foi formalmente confirmada como objeto da transação. A formulação também preserva a ligação sintática com o versículo seguinte.'
- source_word: שְׂדֵה עֶפְרוֹן
  choice: o campo de Efrom
  rationale: Traduz naturalmente a cadeia construta hebraica e identifica o então proprietário do campo.
- source_word: בַּמַּכְפֵּלָה
  choice: em Macpela
  rationale: Macpela é mantido como nome próprio do lugar; a preposição “em” expressa sua localização sem acrescentar precisão não presente no hebraico.
- source_word: לִפְנֵי מַמְרֵא
  choice: diante de Manre
  rationale: Conserva o sentido espacial básico de לִפְנֵי sem decidir se a expressão significa especificamente “a leste de”, “perto de” ou “em frente a”.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: o campo, a caverna que nele havia
  rationale: Preserva a enumeração formal dos componentes da propriedade e a repetição de “campo”, característica da descrição jurídica hebraica.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: e todas as árvores do campo
  rationale: O substantivo singular coletivo com כָל é expresso naturalmente em português pelo plural abrangente.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: dentro de todos os seus limites ao redor
  rationale: Mantém a abrangência territorial da fórmula, indicando tudo o que se encontrava no perímetro completo do campo.
