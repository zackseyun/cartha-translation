  verdict: revise
  source_fidelity: A tradução preserva bem a negociação cortês, a quantia e a pergunta retórica. Contudo, “Sepulte a sua morta” é uma reprodução pouco natural e potencialmente enganosa do hebraico מֵתְךָ, cujo masculino é uma designação idiomática de “teu morto” e, no contexto, refere-se a Sara. Em português, “sua falecida” comunica naturalmente o referente sem tratar “morta” como substantivo usual.
  naturalness: “Meu senhor, escute-me”, “um terreno no valor de quatrocentos siclos de prata” e “entre mim e você” são claros e adequados ao português moderno de ampla compreensão. “Sua morta”, porém, é marcadamente pouco idiomático e soa depreciativo ou objetificante.
  terminology: “Meu senhor” conserva a deferência social; “siclos de prata” é a unidade histórica apropriada; “terreno” é adequado ao lote negociado. “Falecida” é a forma portuguesa natural para a pessoa morta neste contexto.
