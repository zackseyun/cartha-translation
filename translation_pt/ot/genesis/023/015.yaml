base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: pt
  text: 'Meu senhor[a], escute-me: um terreno no valor de quatrocentos siclos de prata — o que é isso entre mim e você? Sepulte sua falecida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “uma terra — quatrocentos siclos de prata — o que é isso entre mim e você?” O hebraico é elíptico e retórico, minimizando o preço no curso da negociação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: Forma respeitosa de tratamento dirigida a Efrom, sem sentido divino; preserva a deferência social e o interlocutor singular.
- source_word: שְׁמָעֵנִי
  choice: escute-me
  rationale: Imperativo usado como apelo cortês; é natural em português moderno e mantém a solicitação direta.
- source_word: אֶרֶץ
  choice: um terreno
  rationale: No contexto da negociação, designa a propriedade ou porção de terra em questão, e não a terra em sentido abstrato.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: no valor de quatrocentos siclos de prata
  rationale: Explicita de modo idiomático o valor implícito na construção hebraica elíptica, sem alterar a quantia ou seu referente.
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre mim e você
  rationale: Preserva as formas explícitas de primeira e segunda pessoas do singular e o tom pessoal da negociação.
- source_word: מַה הִוא
  choice: o que é isso
  rationale: Mantém a pergunta retórica que minimiza a importância da quantia entre as duas partes.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Sepulte a sua morta
  rationale: O referente no contexto é Sara; o feminino torna isso claro em português. O imperativo direto preserva a concisão do hebraico, enquanto o waw pode funcionar como simples progressão discursiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Meu senhor” conserva a cortesia antiga sem sugerir título divino; “siclos” mantém a unidade histórica. A construção elíptica sobre o preço foi levemente explicitada para soar natural em português, preservando a força retórica da negociação.
