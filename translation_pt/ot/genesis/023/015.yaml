  - severity: low
    issue: A nota que documenta a elipse retórica do hebraico não foi preservada no rascunho português.
    rationale: A construção “terra — quatrocentos siclos de prata — que é isso entre mim e você?” é elíptica. Uma nota ancorada em “Meu senhor” permite registrar a alternativa mais formal e a função retórica sem sobrecarregar o texto.
