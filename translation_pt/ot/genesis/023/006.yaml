base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: pt
  text: '— Escute-nos, meu senhor: o senhor é um príncipe de Deus no nosso meio.[a] Sepulte a pessoa que morreu em um dos melhores túmulos que temos. Nenhum de nós lhe recusará o próprio túmulo, impedindo-o de sepultar a pessoa que morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um príncipe poderoso no nosso meio”. A expressão hebraica “príncipe de Deus” também pode funcionar como uma forma intensiva, indicando um príncipe de grande importância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Escute-nos
  rationale: Traduz diretamente o imperativo com sufixo da primeira pessoa do plural e soa natural como apelo respeitoso em português atual.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Conserva a forma respeitosa de tratamento dirigida a Abraão, sem transformá-la em título divino.
- source_word: נְשִׂיא אֱלֹהִים
  choice: um príncipe de Deus
  rationale: Preserva a construção hebraica e sua ambiguidade entre uma associação com Deus e um uso idiomático intensificador.
- source_word: בְּתוֹכֵנוּ
  choice: no nosso meio
  rationale: Expressa de modo natural a presença e a posição de Abraão dentro daquela comunidade.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: no melhor dos nossos túmulos
  rationale: מִבְחַר indica aquilo que é selecionado ou de melhor qualidade; a formulação mantém a oferta de livre escolha entre os melhores locais disponíveis.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Sepulte a pessoa que morreu
  rationale: Evita o pouco natural «sepulte seu morto» e não explicita no corpo do versículo o sexo da pessoa falecida, que o hebraico desta expressão não marca.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Nenhum de nós
  rationale: Na construção negativa, a expressão distributiva significa que nem uma só pessoa do grupo recusaria o pedido.
- source_word: אֶת־קִבְרוֹ
  choice: seu próprio túmulo
  rationale: 'O possessivo é distributivo: cada integrante se dispõe a ceder o túmulo que lhe pertence. «Próprio» torna essa relação clara em português.'
- source_word: לֹא יִכְלֶה מִמְּךָ מִקְּבֹר מֵתֶךָ
  choice: não lhe recusará seu próprio túmulo para que sepulte a pessoa que morreu
  rationale: Comunica naturalmente a ideia de não impedir Abraão de realizar o sepultamento, sem reproduzir uma sequência preposicional rígida e ambígua em português.
theological_decisions:
- issue: Sentido de נְשִׂיא אֱלֹהִים
  choice: Manter «príncipe de Deus» no texto
  alternative: «príncipe poderoso» ou «grande príncipe»
  rationale: A construção pode indicar alguém especialmente relacionado ou favorecido por Deus, mas também pode funcionar idiomaticamente como superlativo. O texto principal conserva a tensão, e a nota registra a leitura idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém a cortesia formal da negociação. Evitou-se «o senhor» na primeira frase como vocativo para não perder o valor mais pessoal de אֲדֹנִי, mas ele foi empregado como pronome respeitoso na frase seguinte. A repetição final reflete a repetição do hebraico, embora com formulação portuguesa natural.
