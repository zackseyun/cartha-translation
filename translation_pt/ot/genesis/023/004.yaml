  naturalness: “Estrangeiro e residente temporário” é claro, embora “residente” seja mais conciso e não explicite como temporal uma nuance que o hebraico deixa mais aberta. “Entre vocês” é natural nas duas ocorrências; “no meio de vocês” cria uma variação sem necessidade. A formulação revista mantém um registro digno e moderno.
  terminology: “Propriedade para sepultamento” transmite adequadamente a noção de posse/holding de אֲחֻזָּה. “Minha morta” preserva a referência contextual a Sara e a linguagem não eufemística do hebraico, sem precisar repetir seu nome.
