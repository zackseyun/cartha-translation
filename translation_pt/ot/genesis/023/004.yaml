base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: pt
  text: “Sou estrangeiro e residente entre vocês. Deem-me, entre vocês, uma propriedade para sepultamento[a], para que eu sepulte a minha morta e a tire de diante de mim[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um lugar de sepultamento”. A expressão hebraica inclui a ideia de propriedade ou posse, e não apenas de um lugar onde abrir uma sepultura.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: estrangeiro
  rationale: Expressa de modo atual a condição de quem vive fora de sua terra e de seu grupo de parentesco, sem plena condição fundiária local.
- source_word: וְתוֹשָׁב
  choice: residente temporário
  rationale: Complementa “estrangeiro” ao destacar residência entre o povo sem posse plena nem condição de nativo; é mais claro no português moderno do que “peregrino” neste contexto social e jurídico.
- source_word: עִמָּכֶם
  choice: entre vocês / no meio de vocês
  rationale: A preposição significa literalmente “com vocês”, mas aqui indica presença e inserção limitada na comunidade; as duas formulações naturais preservam a repetição hebraica.
- source_word: תְּנוּ לִי
  choice: Deem-me
  rationale: Reproduz diretamente o imperativo de נתן sem tornar explícita uma modalidade jurídica específica de aquisição.
- source_word: אֲחֻזַּת קֶבֶר
  choice: uma propriedade para sepultamento
  rationale: Preserva a noção de posse ou propriedade fundiária presente em אֲחֻזָּה, importante para o capítulo, e não apenas a ideia de um ponto onde abrir uma sepultura.
- source_word: וְאֶקְבְּרָה
  choice: para que eu sepulte
  rationale: O coortativo ligado ao pedido expressa finalidade ou resultado pretendido.
- source_word: מֵתִי
  choice: a minha falecida
  rationale: No contexto, refere-se a Sara. A formulação é natural e respeitosa em português, sem repetir seu nome, embora o substantivo hebraico em si seja a expressão idiomática “minha morta”.
- source_word: מִלְּפָנַי
  choice: longe dos meus olhos
  rationale: Comunica naturalmente a imagem de retirar a falecida de diante de Abraão; a forma mais literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Residente temporário” evita o sentido predominantemente devocional que “peregrino” pode adquirir, enquanto “propriedade para sepultamento” mantém a dimensão fundiária central à narrativa.
