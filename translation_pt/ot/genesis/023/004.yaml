    rationale: A expressão significa literalmente “de diante de mim” e, no contexto, comunica a retirada do corpo da presença imediata de Abraão. “Tirá-la de diante de mim” expressa isso naturalmente.
  - severity: low
    issue: A alternância entre “entre vocês” e “no meio de vocês” não reflete uma diferença no hebraico.
    rationale: A mesma expressão עִמָּכֶם ocorre nas duas posições; a repetição de “entre vocês” é mais consistente.
