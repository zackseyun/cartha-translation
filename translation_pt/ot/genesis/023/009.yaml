  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: pt
  text: e que ele me dê a caverna de Macpela, que lhe pertence e fica na extremidade do campo dele. Que ele a dê a mim, entre vocês, pelo preço integral em prata, como propriedade para sepultura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como posse de sepultura”. A expressão enfatiza a propriedade legal do local, não apenas o direito de usá-lo para sepultamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: e que ele me dê
  rationale: O imperfeito tem força volitiva no contexto do pedido de Abraão; a construção portuguesa preserva o tom de solicitação.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: a caverna de Macpela
  rationale: Reproduz a cadeia construta com o nome próprio em transliteração tradicional e clara em português.
- source_word: אֲשֶׁר לוֹ
  choice: que lhe pertence
  rationale: Expressa naturalmente a posse e mantém a nuance jurídica da negociação.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: e fica na extremidade do seu campo
  rationale: קָצֶה pode indicar ponta, limite ou extremidade; a escolha preserva a amplitude espacial sem definir se é a borda lateral ou o fundo do campo.
- source_word: בְּכֶסֶף מָלֵא
  choice: pelo preço integral em prata
  rationale: Torna claro o idiomatismo hebraico de pagamento completo, preservando a menção explícita à prata.
- source_word: יִתְּנֶנָּה
  choice: Que ele a dê a mim
  rationale: Mantém o verbo נתן, “dar”, embora o contexto e o preço indiquem uma transferência mediante pagamento.
- source_word: בְּתוֹכְכֶם
  choice: diante de vocês
  rationale: No contexto da negociação pública, comunica que a transferência ocorre na presença da comunidade e sob seu reconhecimento.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: como propriedade para sepultamento
  rationale: אֲחֻזָּה designa posse ou propriedade legal, não apenas autorização temporária de uso.
