translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “dê” preserva a estrutura enfática do hebraico; “diante de vocês” explicita naturalmente o caráter público da transação sem transformar o verbo “dar” em “vender”.
