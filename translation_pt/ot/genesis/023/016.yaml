base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: pt
  text: 'Assim, Abraão deu ouvidos a Efrom e pesou para ele a prata que Efrom havia declarado na presença dos filhos de Hete[a]: quatrocentos siclos de prata, segundo o padrão aceito pelos mercadores[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os hititas”; literalmente, “os filhos de Hete”.
    reason: lexical_alternative
  - marker: b
    text: Ou “corrente entre os mercadores” ou “aceita pelo mercador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: Abraão deu ouvidos a Efrom
  rationale: A expressão שׁמע אל significa ouvir ou atender alguém. “Deu ouvidos” comunica naturalmente que Abraão acolheu o valor proposto, sem tornar explícita uma ideia de acordo além do que o verbo afirma.
- source_word: וַיִּשְׁקֹל
  choice: pesou
  rationale: O verbo descreve literalmente a pesagem da prata usada como pagamento antes da cunhagem de moedas; a tradução preserva a ação comercial concreta.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף designa literalmente prata e, neste contexto, prata usada como meio de pagamento. A escolha mantém a especificidade material e histórica.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que havia mencionado
  rationale: Embora דבר signifique literalmente “falou”, aqui se refere ao valor que Efrom acabara de declarar. “Havia mencionado” permanece próximo do hebraico e funciona de modo natural no contexto.
- source_word: בְּאָזְנֵי
  choice: na presença de
  rationale: A expressão é literalmente “aos ouvidos de” e assinala que o valor foi declarado publicamente diante de testemunhas. “Na presença de” transmite esse aspecto em português corrente.
- source_word: בְנֵי חֵת
  choice: os filhos de Hete
  rationale: A tradução literal conserva a forma genealógica característica de Gênesis; a equivalência étnica mais familiar é registrada em nota.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: quatrocentos siclos de prata
  rationale: A formulação preserva tanto a antiga unidade de peso quanto o material empregado no pagamento.
- source_word: עֹבֵר לַסֹּחֵר
  choice: segundo o padrão aceito pelos mercadores
  rationale: A expressão comercial provavelmente indica prata válida ou de peso reconhecido no comércio. A formulação torna o sentido inteligível sem apagar a incerteza idiomática, cujas alternativas são registradas em nota.
