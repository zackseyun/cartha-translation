translation_notes:
  register: Português moderno, digno e acessível. A estrutura mantém o caráter de fórmula pública de transferência, sem tornar a frase artificial. “Cidade dele” conserva a ambiguidade referencial do hebraico, em vez de identificar silenciosamente o possuidor da cidade.
