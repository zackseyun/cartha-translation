  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: pt
  text: a Abraão como propriedade, diante dos olhos dos filhos de Hete[a] e diante de todos os que entravam pelo portão da cidade dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os hititas”, em vez de “os filhos de Hete”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: a Abraão
  rationale: O לְ marca Abraão como o destinatário da transferência legal; “a Abraão” preserva essa relação.
- source_word: לְמִקְנָה
  choice: como propriedade
  rationale: מִקְנָה designa um bem adquirido; no contexto jurídico, “como propriedade” comunica o resultado permanente da compra.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Mantém a imagem do idioma hebraico e indica que a transferência ocorreu publicamente, perante testemunhas.
- source_word: בְנֵי חֵת
  choice: os filhos de Hete
  rationale: Reproduz a designação genealógica literal e recorrente no episódio; “os hititas” permanece uma alternativa contextual válida.
- source_word: בְּכֹל בָּאֵי
  choice: diante de todos os que entravam
  rationale: A formulação expressa a presença do conjunto de testemunhas, e o particípio sugere as pessoas que habitualmente entravam naquele espaço público.
- source_word: שַׁעַר עִירוֹ
  choice: pelo portão da cidade dele
  rationale: “Portão” comunica melhor que “porta” a entrada pública da cidade, lugar associado a negócios cívicos e jurídicos; “dele” preserva a referência ambígua do sufixo masculino.
