  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: pt
  text: Sara morreu em Quiriate-Arba (isto é, Hebrom)[a], na terra de Canaã, e Abraão veio para lamentar Sara e chorar por ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quiriate-Arba é identificada aqui com Hebrom.
    reason: cross_reference
  - marker: b
    text: 'Ou: “prantear Sara e chorar por ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: morreu
  rationale: Traduz diretamente o verbo מות, sem suavizar sua afirmação objetiva.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: em Quiriate-Arba
  rationale: Translitera o topônimo hebraico em forma corrente e reconhecível em português.
- source_word: הִוא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: Expressa com naturalidade a identificação explicativa entre Quiriate-Arba e Hebrom.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Preserva o substantivo אֶרֶץ, explicitamente presente no hebraico.
- source_word: וַיָּבֹא
  choice: foi
  rationale: בוא pode significar vir ou ir conforme o ponto de vista; aqui, 'foi' soa natural na perspectiva narrativa sem especificar um movimento não expresso.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: lamentar Sara
  rationale: ספד designa o lamento fúnebre; a construção direta é idiomática em português e conserva seu sentido.
- source_word: וְלִבְכֹּתָהּ
  choice: e chorar por ela
  rationale: בכה indica chorar; o sufixo pronominal feminino é explicitado por 'ela', e 'por' expressa naturalmente o motivo pessoal do pranto.
