  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: pt
  text: 'Os filhos de Hete[a] responderam a Abraão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os hititas”. Hebraico: “os filhos de Hete”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: O qal wayyiqtol de ענה introduz a resposta do grupo no diálogo; “responderam” é natural e preserva a função narrativa.
- source_word: בְנֵי חֵת
  choice: os filhos de Hete
  rationale: Mantém literalmente a expressão hebraica de descendência e o nome próprio Hete; “os hititas” é uma equivalência contextual possível, registrada em nota.
- source_word: אֶת אַבְרָהָם
  choice: a Abraão
  rationale: אֶת marca Abraão como objeto definido; em português, o verbo “responder” rege naturalmente a preposição “a” para indicar o interlocutor.
- source_word: לֵאמֹר לוֹ
  choice: ':'
  rationale: A construção hebraica “dizendo-lhe” introduz a fala direta. Em português atual, os dois-pontos expressam essa função com maior naturalidade e evitam a redundância “responderam... dizendo-lhe”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a designação hebraica do grupo, enquanto a pontuação introduz naturalmente a fala que segue no versículo seguinte.
