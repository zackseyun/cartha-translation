  source_fidelity: A tradução transmite corretamente a negociação pública, a oferta de prata e o propósito de sepultamento. Contudo, “todo” acrescenta uma totalidade ausente do hebraico, e “a minha morta” muda para o feminino uma expressão hebraica formalmente masculina (מֵתִי), além de soar pouco natural em português.
  naturalness: O registro é em geral claro e adequado. “Na presença do povo da terra” é uma forma idiomática de expressar o caráter público da fala. “Meu morto” é a expressão portuguesa mais natural e preserva a formulação concisa do original.
  terminology: “Efrom”, “prata”, “campo” e “povo da terra” são escolhas adequadas. A nota deve estar ancorada em “Dou”, pois explica especificamente a forma verbal hebraica traduzida por esse presente performativo.
  issues:
