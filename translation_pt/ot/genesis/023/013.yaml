base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: pt
  text: 'E falou a Efrom, na presença do povo da terra, dizendo: “Se ao menos você me escutasse: dou[a] a prata pelo campo; aceite-a de mim, para que eu sepulte ali o meu morto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Eu dei a prata pelo campo”. O perfeito pode expressar aqui uma oferta formal feita no próprio ato da negociação. Outra tradução possível é: “Darei a prata pelo campo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E falou
  rationale: Mantém o verbo formal de fala e a sequência narrativa hebraica, com fluência natural em português.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: diante de todo o povo da terra
  rationale: Expressa idiomaticamente que a negociação ocorreu publicamente, ao alcance dos ouvidos da comunidade local; “povo da terra” preserva a formulação social e jurídica do hebraico.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Se você ao menos me ouvir!
  rationale: Reproduz a súplica enfática e cortês da expressão hebraica elíptica sem tentar completar de modo excessivamente interpretativo sua sintaxe.
- source_word: נָתַתִּי
  choice: Dou
  rationale: 'O perfeito hebraico tem provável força performativa: Abraão formaliza a oferta no próprio ato de falar. O presente português comunica essa função com naturalidade, enquanto a forma verbal literal é registrada em nota.'
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: a prata pelo campo
  rationale: “Prata” conserva a concretude econômica do hebraico, e “pelo campo” apresenta naturalmente a relação de pagamento.
- source_word: קַח מִמֶּנִּי
  choice: aceite-a de mim
  rationale: No contexto de uma negociação, “aceite” comunica naturalmente o ato de receber a prata oferecida; o pronome feminino retoma “a prata”, objeto implícito no hebraico.
- source_word: וְאֶקְבְּרָה
  choice: para que eu sepulte
  rationale: Traduz a nuance volitiva e final do coortativo, ligando a aceitação do pagamento ao propósito de realizar o sepultamento.
- source_word: מֵתִי
  choice: a minha morta
  rationale: Preserva a expressão hebraica “minha morta” e, em português, o gênero feminino corresponde à falecida mencionada no contexto, sem substituir a expressão pelo nome Sara.
- source_word: שָׁמָּה
  choice: ali
  rationale: Equivalente locativo natural que remete diretamente ao campo em questão.
theological_decisions: []
