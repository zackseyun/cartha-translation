base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: pt
  text: Depois disso, Abraão sepultou sua mulher Sara na caverna do campo de Macpela, diante de Manre[a] (isto é, Hebrom), na terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente a Manre”. A expressão hebraica indica um lugar diante de Manre ou em frente a ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal e preserva a sequência narrativa do hebraico.
- source_word: קָבַר
  choice: sepultou
  rationale: Equivalente claro e digno para o verbo hebraico que significa enterrar ou sepultar.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: sua mulher Sara
  rationale: É uma formulação natural em português e conserva a identificação explícita de Sara como mulher de Abraão.
- source_word: אֶל מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: na caverna do campo de Macpela
  rationale: Com o verbo 'sepultar', 'na' comunica de modo idiomático o destino e local do sepultamento; a cadeia nominal mantém a relação entre a caverna, o campo e Macpela.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: diante de Manre
  rationale: Preserva a expressão espacial sem impor uma direção geográfica mais específica do que o hebraico.
- source_word: הִוא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: Apresenta com naturalidade a identificação geográfica feita pelo texto hebraico.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém a expressão geográfica formal e explícita do original.
