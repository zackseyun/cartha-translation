    rationale: O hebraico usa o substantivo comum e direto מֵת, não um eufemismo equivalente a «falecido». Como a referência contextual é Sara, «a sua morta» preserva a referência feminina e a concretude da formulação.
  - severity: low
    issue: «a caverna que nele fica» é menos natural do que necessário.
    rationale: «Que há nele» comunica com maior naturalidade que a caverna se encontra dentro do campo, sem alterar o sentido espacial do hebraico.
