review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a recusa cortês, o tratamento respeitoso, a natureza performativa de «dou», a localização da caverna no campo e o caráter público da concessão. Contudo, «falecida» é um eufemismo que atenua o termo hebraico direto מֵתֶךָ («teu morto»); o contexto identifica a pessoa como Sara, mas o versículo emprega a expressão direta «seu/sua morto(a)».
  naturalness: O texto é fluente e de registro apropriado. «A caverna que nele fica» é compreensível, mas «a caverna que há nele» é mais idiomático e neutro em português internacional. «Sepulte a sua morta» mantém um tom sóbrio e direto, mais próximo do original que «sua falecida».
  terminology: «Meu senhor», «campo», «caverna», «na presença» e «sepulte» são escolhas adequadas. A nota explica bem o idiomatismo público de «diante dos olhos dos filhos do meu povo».
  issues:
