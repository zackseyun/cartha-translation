  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: pt
  text: '“Não, meu senhor, escute-me: eu lhe dou o campo e lhe dou a caverna que há nele. Na presença do meu povo[a], eu a dou a você. Sepulte a sua morta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante dos olhos dos filhos do meu povo”; isto é, publicamente e na presença de testemunhas da comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: Não
  rationale: Neste diálogo, a negação introduz uma recusa ou correção cortês à proposta de Abraão. “Não” é natural em português e mantém a força direta do hebraico.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Forma respeitosa de tratamento que preserva a deferência social presente na negociação, sem sugerir necessariamente uma relação de servidão.
- source_word: שְׁמָעֵנִי
  choice: escute-me
  rationale: Traduz de modo claro e atual o imperativo de שׁמע, aqui usado como apelo para que Abraão preste atenção à contraproposta.
- source_word: הַשָּׂדֶה נָתַתִּי לָךְ
  choice: eu lhe dou o campo
  rationale: 'O perfeito נָתַתִּי tem força performativa: a declaração realiza ou formaliza a oferta no momento da fala. Por isso, o presente “dou” é mais adequado do que um passado.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: a caverna que nele fica
  rationale: Expressa naturalmente a localização da caverna dentro do campo, mantendo explícita a relação espacial do hebraico.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Na presença do meu povo
  rationale: A expressão literal “aos olhos dos filhos do meu povo” indica que a concessão é feita publicamente, diante de testemunhas da comunidade.
- source_word: נְתַתִּיהָ לָּךְ
  choice: eu a dou a você
  rationale: O pronome feminino retoma “a caverna”, e o presente mantém a força performativa da declaração. A repetição preserva a ênfase pública da fala de Efrom.
- source_word: קְבֹר מֵתֶךָ
  choice: Sepulte a sua falecida
  rationale: O imperativo é direto, e a expressão se refere, no contexto, a Sara. “Sua falecida” é digna e natural em português, sem inserir o nome que não aparece no versículo.
