  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: pt
  text: Então Abraão se levantou e se curvou diante do povo da terra, diante dos filhos de Hete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os hititas”. Hebraico: “os filhos de Hete”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então Abraão se levantou
  rationale: O wayyiqtol de קום expressa a ação narrativa seguinte, levantar-se; “Então” comunica naturalmente a sequência em português.
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou diante de
  rationale: A forma verbal de שׁחה descreve uma reverência física. “Curvou-se diante de” preserva o gesto respeitoso sem exigir a ideia mais forte de prostração completa.
- source_word: לְעַם הָאָרֶץ
  choice: diante do povo daquela terra
  rationale: A preposição ל marca o destinatário da reverência; com “curvar-se”, “diante de” é idiomático. “Daquela terra” indica os habitantes locais no contexto.
- source_word: לִבְנֵי חֵת
  choice: isto é, dos filhos de Hete
  rationale: A expressão identifica o povo da terra como os “filhos de Hete”. A explicitação “isto é” torna clara a aposição sem mudar o referente, e mantém a forma genealógica do hebraico.
- source_word: חֵת
  choice: Hete
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico חֵת.
