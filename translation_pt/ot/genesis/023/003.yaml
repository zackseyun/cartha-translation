  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: pt
  text: 'Então Abraão se levantou de junto de sua falecida esposa e falou aos filhos de Hete[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos hititas”; em hebraico, “aos filhos de Hete”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Então Abraão se levantou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência, e “se levantou” preserva a ação de קום.
- source_word: מֵעַל פְּנֵי
  choice: de junto de
  rationale: A expressão indica que Abraão se afastou da presença imediata do corpo. “De junto de” é natural em português e mantém a relação espacial sem sugerir que ele estava literalmente por cima dele.
- source_word: מֵתוֹ
  choice: sua falecida
  rationale: O hebraico diz literalmente “sua morta”, e o contexto identifica Sara. “Sua falecida” conserva a forma substantivada e evita repetir “esposa”, que não aparece neste versículo, sem a aspereza pouco natural de “sua morta” em português.
- source_word: וַיְדַבֵּר אֶל
  choice: e falou aos
  rationale: דבר com אֶל significa falar a alguém. “Falou aos” é corrente e preserva o ato de dirigir a palavra aos destinatários.
- source_word: בְּנֵי חֵת
  choice: filhos de Hete
  rationale: Mantém a forma literal do hebraico e o nome próprio, deixando em nota a identificação étnica convencional.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala que vem no versículo seguinte. Em português, os dois-pontos representam naturalmente essa função e evitam a construção menos idiomática “falou..., dizendo” na divisão entre versículos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém a concisão do hebraico, mas usa “falecida” para indicar naturalmente uma mulher morta sem acrescentar explicitamente “esposa”. O marcador [a] aparece no texto principal.
