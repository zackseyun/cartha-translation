base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: pt
  text: 'E falou com eles: “Se é da vontade de vocês que eu sepulte a minha morta, tirando-a de diante dos meus olhos, escutem-me e intercedam por mim junto a Efrom, filho de Zoar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: E falou com eles
  rationale: Traduz naturalmente a construção narrativa e preserva o valor de falar com os interlocutores; em português, os dois-pontos introduzem a fala direta sem precisar reproduzir mecanicamente לֵאמֹר.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Se é da vontade de vocês
  rationale: A expressão idiomática com נֶפֶשׁ comunica desejo ou disposição. A formulação escolhida é clara e conserva o caráter volitivo.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: que eu sepulte a minha morta
  rationale: O contexto fornece Abraão como sujeito do infinitivo. O substantivo com sufixo significa literalmente 'minha morta'; o feminino é legítimo em português e evita inserir 'esposa' no texto.
- source_word: מִלְּפָנַי
  choice: tirando-a de diante dos meus olhos
  rationale: Preserva a imagem hebraica de remover a falecida de diante de Abraão, deixando explícita em português a relação com o sepultamento.
- source_word: שְׁמָעוּנִי
  choice: escutem-me
  rationale: Imperativo atual, claro e digno, que expressa um pedido de atenção e acolhimento da solicitação.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: e intercedam por mim junto a Efrom
  rationale: Neste contexto de negociação, פגע com ב e o dativo לִי indica dirigir uma solicitação a Efrom em favor de Abraão. 'Intercedam por mim junto a' comunica essa nuance sem especificar mais do que o contexto permite.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Efrom, filho de Zoar
  rationale: Translitera os nomes segundo formas portuguesas reconhecíveis e traduz בֶּן de modo transparente.
