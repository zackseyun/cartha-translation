  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: pt
  text: 'Ele ouviu as palavras dos filhos de Labão, que diziam: “Jacó tomou tudo o que pertencia ao nosso pai e, a partir do que pertencia ao nosso pai, adquiriu toda esta riqueza[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda esta glória”. A palavra hebraica pode indicar honra, esplendor ou riqueza material; aqui se refere à prosperidade visível de Jacó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Ele ouviu
  rationale: O wayyiqtol dá continuidade à narrativa. O sujeito, Jacó, é recuperável do contexto; o pronome mantém a fluidez sem acrescentar um marcador temporal inexistente.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: o que os filhos de Labão diziam
  rationale: A formulação natural em português comunica que Jacó ouviu a fala deles; os dois-pontos introduzem diretamente o conteúdo citado.
- source_word: לָקַח
  choice: tomou
  rationale: Preserva o teor acusatório sem intensificá-lo com verbos como “roubou” ou “se apoderou”.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: tudo o que pertencia ao nosso pai
  rationale: A construção com ל indica posse, expressa de modo claro e idiomático.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: e, com o que pertencia ao nosso pai
  rationale: מִן indica a fonte da prosperidade atribuída a Jacó. “Com” soa natural em português neste contexto, e a repetição de “pertencia ao nosso pai” conserva a ênfase do hebraico.
- source_word: עָשָׂה
  choice: adquiriu
  rationale: Embora o sentido básico seja “fez”, com “riqueza” como objeto o verbo descreve a obtenção ou formação da prosperidade de Jacó.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: toda esta riqueza
  rationale: כָּבוֹד pode designar glória, honra ou esplendor, mas aqui se refere à prosperidade material visível de Jacó; a alternativa literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A acusação dos filhos de Labão é preservada sem torná-la mais explícita ou grave do que o hebraico.
