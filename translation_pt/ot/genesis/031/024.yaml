base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: pt
  text: 'Mas Deus veio a Labão, o arameu, num sonho durante a noite e lhe disse: “Cuidado para não falar com Jacó, nem para o bem nem para o mal[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do bem ao mal”, expressão que abrange tudo o que Labão pudesse dizer, fosse favorável ou desfavorável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O verbo בוא na forma narrativa indica naturalmente que Deus veio a Labão; evita-se “apareceu”, que acrescentaria uma ideia não expressa pelo verbo.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O verbo no singular e o contexto narrativo identificam o Deus único, não deuses ou um ser divino indefinido.
- source_word: לָבָן הָאֲרַמִּי
  choice: Labão, o arameu
  rationale: אֲרַמִּי é o gentílico “arameu”; “sírio” pertence a uma tradição geográfica posterior e é menos preciso em relação ao hebraico.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: num sonho durante a noite
  rationale: Expressa com clareza tanto o meio, um sonho, quanto o período noturno, em português atual e natural.
- source_word: הִשָּׁמֶר לְךָ
  choice: Cuidado!
  rationale: A fórmula idiomática de advertência pede cautela enfática; a forma breve é natural e preserva a força do imperativo hebraico.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: Não diga nada a Jacó
  rationale: פֶּן introduz a ação contra a qual Labão é advertido. Em conjunto com a expressão polar seguinte, o sentido contextual é não dizer coisa alguma a Jacó.
- source_word: מִטּוֹב עַד רָע
  choice: nem de bom nem de mau
  rationale: A expressão literal “do bom até o mau” abrange os dois extremos e, no contexto, funciona como um merismo que proíbe qualquer declaração, favorável ou hostil.
theological_decisions:
- issue: Identidade de אֱלֹהִים
  choice: Deus
  alternative: um ser divino ou deuses
  rationale: As formas verbais no singular e o contexto imediato apontam para o Deus único; a tradução segue os dados gramaticais sem ampliação doutrinária.
- issue: Alcance da advertência a Labão
  choice: não dizer nada a Jacó, nem de bom nem de mau
  alternative: não ameaçar Jacó ou não tentar persuadi-lo
  rationale: O merismo hebraico abrange todo tipo de fala. A tradução não restringe a ordem apenas a palavras hostis nem a uma forma específica de persuasão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arameu” conserva a precisão histórica do gentílico hebraico. A fala divina usa uma advertência direta e natural; a nota preserva a forma e a amplitude do idioma original.
