  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do hebraico: a condição relativa, a declaração de que a pessoa não viverá, a inspeção diante dos «irmãos» e a observação de que Jacó desconhecia o roubo cometido por Raquel. Contudo, «leve-o com você» acrescenta a ideia de transportar consigo, enquanto וְקַח לָךְ significa mais precisamente «tome-o para você».'
  naturalness: O português é claro e de registro apropriado. «Não viverá» é mais direto, solene e idiomático do que «não ficará vivo», sem determinar indevidamente o modo da morte.
  terminology: «Deuses», «irmãos», «Jacó» e «Raquel» estão corretos e conservam a terminologia do texto. A nota sobre «irmãos» esclarece legitimamente a possível amplitude de אַחֵינוּ. A nota contextual sobre os deuses domésticos é compatível com o contexto, desde que não substitua «deuses» no texto principal.
