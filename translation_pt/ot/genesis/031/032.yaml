base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: pt
  text: “Aquele com quem você encontrar os seus deuses não viverá.[a] Na presença de nossos irmãos,[b] identifique o que é seu e está comigo, e tome-o para você.” Jacó não sabia que Raquel os havia roubado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “aquele com quem você encontrar os seus deuses”.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” pode designar aqui o grupo mais amplo de parentes ou homens do clã presentes, e não somente irmãos biológicos.
    reason: cultural_note
  - marker: c
    text: Isto é, Raquel havia roubado os deuses domésticos de Labão.
    reason: contextual_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Aquele com quem você encontrar
  rationale: Mantém a construção ativa e a referência direta a Labão presentes no hebraico, com formulação natural em português.
- source_word: אֱלֹהֶיךָ
  choice: os seus deuses
  rationale: Traduz diretamente o plural hebraico sem substituir o termo por uma interpretação contextual como “ídolos domésticos”.
- source_word: לֹא יִחְיֶה
  choice: não ficará vivo
  rationale: Preserva a força solene da declaração de morte sem decidir se se trata formalmente de sentença, maldição ou previsão.
- source_word: נֶגֶד אַחֵינוּ
  choice: Na presença de nossos irmãos
  rationale: Reproduz de perto o hebraico; “irmãos” pode abranger parentes ou homens do grupo.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: examine o que é seu e está comigo
  rationale: O verbo pede reconhecimento mediante inspeção; a formulação explicita apenas o pertencimento subentendido pelo contexto.
- source_word: וְקַח לָךְ
  choice: e leve-o com você
  rationale: Expressa naturalmente que Labão deve tomar para si qualquer objeto que reconheça como seu.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Jacó não sabia
  rationale: Traduz de forma direta a observação explicativa do narrador.
- source_word: גְּנָבָתַם
  choice: os havia roubado
  rationale: O pronome plural retoma os deuses, e o mais-que-perfeito deixa claro que o roubo antecedeu a fala de Jacó.
theological_decisions:
- issue: Natureza da declaração “não ficará vivo”
  choice: Manter a formulação aberta quanto a ser sentença, maldição ou declaração enfática
  alternative: Traduzir explicitamente como “será morto”
  rationale: O hebraico diz literalmente que a pessoa “não viverá” e não especifica o mecanismo ou estatuto da morte.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por “você”. A tradução conserva “deuses” e “irmãos”, refletindo o léxico hebraico, enquanto as notas esclarecem o contexto sem inseri-lo indevidamente no texto principal.
