  text: לָ֤/מָּה נַחְבֵּ֨אתָ֙ לִ/בְרֹ֔חַ וַ/תִּגְנֹ֖ב אֹתִ֑/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י וָֽ/אֲשַׁלֵּחֲ/ךָ֛ בְּ/שִׂמְחָ֥ה וּ/בְ/שִׁרִ֖ים בְּ/תֹ֥ף וּ/בְ/כִנּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: pt
  text: Por que você se escondeu para fugir e se afastou de mim às escondidas, sem me avisar? Eu poderia ter despedido você com alegria e cânticos, com tamborim e lira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Interrogativo causal direto e natural em português moderno.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: você fugiu às escondidas
  rationale: Expressa de modo natural tanto o ato de ocultar-se quanto a finalidade de fugir, preservando o tom acusatório sem produzir uma formulação artificial.
- source_word: וַתִּגְנֹב אֹתִי
  choice: escapou de mim
  rationale: A expressão, literalmente 'roubou-me', é idiomática neste contexto e indica afastar-se de alguém furtivamente. 'Escapou de mim' comunica o sentido sem sugerir que Labão foi literalmente roubado.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: sem me avisar
  rationale: Equivalente português corrente para 'e não me contou/avisou', adequado ao contexto de uma partida não anunciada.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Eu poderia ter despedido você
  rationale: 'Retrata a consequência irrealizada alegada por Labão: se tivesse sido avisado, teria dado uma despedida a Jacó.'
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: com alegria e cânticos
  rationale: '''Alegria'' é direto; ''cânticos'' representa o plural שִׁרִים e se ajusta à celebração acompanhada por instrumentos.'
- source_word: בְּתֹף
  choice: ao som de tamborim
  rationale: '''Tamborim'' é um equivalente moderno e reconhecível para o instrumento de percussão תֹף; ''ao som de'' torna natural a coordenação dos instrumentos.'
- source_word: וּבְכִנּוֹר
  choice: e lira
  rationale: כִּנּוֹר designa um instrumento de cordas do tipo lira; 'lira' é mais preciso que 'harpa'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção foi reorganizada em duas perguntas/orações para evitar uma cadeia sintática pesada, mantendo a acusação de Labão e a natureza contrafactual de sua alegação.
