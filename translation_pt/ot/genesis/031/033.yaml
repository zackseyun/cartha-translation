base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: pt
  text: Labão entrou na tenda de Jacó, na tenda de Lia e na tenda das duas servas, mas não os encontrou[a]. Depois, saiu da tenda de Lia e entrou na tenda de Raquel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não encontrou”; o objeto não é expresso neste versículo, mas, pelo contexto, refere-se aos deuses domésticos que Labão procurava.'
    reason: O português explicita por meio do pronome o objeto que permanece implícito no texto hebraico.
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: entrou na tenda
  rationale: O verbo בוא com a preposição בְּ indica movimento para dentro de um lugar. “Entrou” expressa isso de modo natural e conciso em português.
- source_word: אֹהֶל
  choice: tenda
  rationale: Mantém o sentido concreto e comum do termo hebraico, apropriado ao contexto patriarcal.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: as duas servas
  rationale: אָמָה designa uma mulher em condição de servidão. “Servas” é claro, atual e adequado ao contexto doméstico, sem recorrer ao arcaísmo “criadas” nem definir além do necessário a condição jurídica delas.
- source_word: וְלֹא מָצָא
  choice: mas não os encontrou
  rationale: O objeto não está expresso em hebraico, mas o contexto aponta para os deuses domésticos que Labão procurava. O pronome masculino plural torna a frase natural em português, enquanto a nota registra a forma elíptica do original.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Depois, saiu da tenda de Lia
  rationale: יצא indica sair. “Depois” comunica naturalmente a progressão narrativa marcada pelo waw consecutivo.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: e entrou na tenda de Raquel
  rationale: Repete-se “entrou” para refletir a repetição do mesmo verbo hebraico e a sequência da busca.
