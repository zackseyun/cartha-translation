source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: pt
  text: 'Agora, pois, venha: façamos uma aliança[a], eu e você, e que isso sirva de testemunha entre mim e você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cortemos uma aliança”. Em hebraico, essa expressão significa fazer ou estabelecer uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Introduz, com naturalidade em português, o passo seguinte da fala, preservando tanto a ideia temporal quanto a ligação lógica expressa pela conjunção.
- source_word: לְכָה
  choice: venha
  rationale: Embora derive do verbo “ir/andar”, aqui o imperativo funciona idiomaticamente como convite ou convocação.
- source_word: נִכְרְתָה בְרִית
  choice: façamos uma aliança
  rationale: A expressão hebraica diz literalmente “cortemos uma aliança”, mas é o idioma convencional para estabelecer ou firmar uma aliança. A forma “façamos” preserva o valor exortativo do coortativo.
- source_word: בְרִית
  choice: aliança
  rationale: Mantém o caráter formal e relacional do termo hebraico, sem reduzi-lo a um simples acordo.
- source_word: אֲנִי וָאָתָּה
  choice: eu e você
  rationale: Conserva a menção explícita às duas partes e a ordem do hebraico, em formulação clara para leitores modernos.
- source_word: וְהָיָה לְעֵד
  choice: e que isso sirva de testemunha
  rationale: A construção indica que algo decorrente da aliança deve exercer a função de testemunha. “Que ... sirva” preserva o sentido volitivo, e “isso” evita impor um referente gramatical mais específico do que o hebraico permite.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Reproduz a formulação pessoal e bilateral do hebraico sem condensá-la em “entre nós”.
theological_decisions:
- issue: Referente de וְהָיָה (“e que ele/isso seja”)
  choice: isso
  alternative: ela, isto é, a aliança
  rationale: O verbo hebraico está no masculino, embora בְרִית (“aliança”) seja normalmente feminino. O pronome neutro “isso” preserva a possível referência geral ao ato ou arranjo da aliança sem resolver silenciosamente a tensão gramatical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para a segunda pessoa singular. A pontuação destaca o convite inicial e mantém o fluxo direto da fala.
