base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: pt
  text: E agora, você de fato foi embora, porque ansiava tanto pela casa de seu pai. Por que roubou os meus deuses?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os meus deuses domésticos”. O hebraico diz simplesmente “os meus deuses”, mas, neste contexto, a expressão se refere aos ídolos domésticos de Labão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a força conectiva de וְ quanto o valor temporal e discursivo de עַתָּה, introduzindo o novo ponto da acusação de Labão.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: você de fato foi embora
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação; “de fato” comunica a ênfase em português natural.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão que Labão reconhece para a partida de Jacó.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: sentia grande saudade
  rationale: A repetição intensiva expressa um anseio forte. “Sentia grande saudade” comunica de modo natural tanto o afeto quanto a intensidade, sem acrescentar explicitamente a ideia de voltar.
- source_word: לְבֵית אָבִיךָ
  choice: da casa de seu pai
  rationale: Mantém a imagem hebraica da casa paterna e permite seu sentido familiar e doméstico sem substituí-la por uma explicação como “lar ancestral”.
- source_word: לָמָּה
  choice: por que
  rationale: Forma interrogativa direta e corrente em português.
- source_word: גָנַבְתָּ
  choice: roubou
  rationale: O pretérito perfeito traduz naturalmente a ação concluída mencionada na acusação direta.
- source_word: אֶת אֱלֹהָי
  choice: os meus deuses
  rationale: Reproduz diretamente o plural hebraico com sufixo de primeira pessoa. A identificação contextual como deuses domésticos fica na nota, pois não é expressa por um substantivo específico neste versículo.
theological_decisions:
- issue: Tradução de אֱלֹהָי na fala de Labão
  choice: os meus deuses
  alternative: os meus deuses domésticos
  rationale: O hebraico diz literalmente “meus deuses”. Embora o contexto indique os ídolos domésticos de Labão, o texto principal preserva a forma lexical e deixa a explicação contextual para a nota, sem suavizar nem reinterpretar sua fala.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” mantém a fala direta e natural; “de fato” e “grande saudade” refletem as duas construções intensivas hebraicas sem produzir uma formulação artificial.
