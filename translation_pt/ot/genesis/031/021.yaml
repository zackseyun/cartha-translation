base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: pt
  text: Assim, ele fugiu com tudo o que lhe pertencia, levantou-se, atravessou o Rio[a] e tomou o rumo da região montanhosa de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atravessou o Eufrates”; o hebraico diz simplesmente “o Rio”, provavelmente referindo-se ao Eufrates.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: fugiu
  rationale: ברח expressa fugir ou escapar; “fugiu” é conciso e preserva a saída sob pressão sem acrescentar interpretação.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: com tudo o que lhe pertencia
  rationale: A expressão abrange tudo o que era de Jacó, sem restringir o sentido apenas a bens materiais.
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: קום marca uma nova ação na sequência narrativa; a formulação preserva esse passo explícito do hebraico.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: atravessou o Rio
  rationale: עבר significa atravessar ou passar para o outro lado. “O Rio” mantém a designação geográfica do hebraico, provavelmente referente ao Eufrates.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: tomou o rumo de
  rationale: O idioma literal “pôs o rosto” indica orientação deliberada. “Tomou o rumo de” comunica naturalmente essa intenção em português atual.
- source_word: הַר הַגִּלְעָד
  choice: região montanhosa de Gileade
  rationale: הַר pode designar uma montanha ou uma área montanhosa; neste contexto geográfico, o sentido regional é o mais adequado.
theological_decisions: []
