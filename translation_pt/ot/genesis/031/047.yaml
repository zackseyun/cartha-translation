  language: pt
  text: Labão lhe deu o nome de Jegar-Saaduta[a], mas Jacó lhe deu o nome de Galeede[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jegar-Saaduta é uma expressão aramaica que significa «monte de testemunho» ou «montão de testemunho».
