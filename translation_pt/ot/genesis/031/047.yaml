lexical_decisions:
- source_word: וַיִּקְרָא לּוֹ
  choice: lhe deu o nome de
  rationale: Em contexto de nomeação, קרא com ל significa chamar ou dar nome. A formulação portuguesa é natural e mantém como referente o monte de pedras mencionado no contexto.
- source_word: לָבָן
  choice: Labão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Jegar-Saaduta
  rationale: Translitera a expressão aramaica como nome, preservando o contraste linguístico; seu significado é explicado em nota.
- source_word: וְיַעֲקֹב
  choice: mas Jacó
  rationale: Embora ו normalmente signifique «e», aqui há contraste entre o nome aramaico dado por Labão e o nome hebraico dado por Jacó; «mas» explicita naturalmente essa relação.
- source_word: קָרָא לּוֹ
  choice: lhe deu o nome de
  rationale: Repete em português a mesma construção de nomeação usada na primeira oração.
- source_word: גַּלְעֵד
  choice: Galeede
  rationale: Translitera o nome hebraico, mantendo o ato de nomear e o paralelo com a designação aramaica; o significado aparece em nota.
