base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: pt
  text: Este montão é testemunha, e esta coluna é testemunha de que eu não atravessarei este montão em direção a você e de que você não atravessará este montão e esta coluna em direção a mim com intenção de causar dano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «com intenção de causar dano» indica atravessar o limite com propósito hostil ou prejudicial; não proíbe necessariamente qualquer passagem física.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: é testemunha
  rationale: Mantém o paralelismo pelo qual tanto o montão quanto a coluna servem de testemunhas do acordo.
- source_word: גַּל
  choice: montão
  rationale: Designa o montão de pedras erguido no contexto como marco de limite; «montão» preserva a imagem concreta sem acrescentar explicação ao texto.
- source_word: מַצֵּבָה
  choice: coluna
  rationale: Refere-se a uma pedra colocada de pé como marco ou monumento; «coluna» é uma forma clara e tradicional em português.
- source_word: אִם
  choice: de que
  rationale: Neste contexto solene, introduz o conteúdo da estipulação atestada pelos marcos, e não uma condição comum; a repetição de «de que» deixa claras as duas obrigações paralelas.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: atravessarei / atravessará
  rationale: Expressa cruzar o limite assinalado pelo montão e pela coluna.
- source_word: אֵלֶיךָ / אֵלַי
  choice: em direção a você / em direção a mim
  rationale: Preserva o sentido direcional da preposição sem introduzir por antecipação a ideia de hostilidade.
- source_word: לְרָעָה
  choice: para fazer o mal
  rationale: Conserva tanto a noção de finalidade hostil quanto a formulação moral ampla do hebraico.
theological_decisions:
- issue: Alcance de לְרָעָה nas duas proibições de atravessar
  choice: A expressão final é mantida no fim da frase, como no hebraico, permitindo que qualifique reciprocamente a travessia das duas partes.
  alternative: Repetir «para fazer o mal» depois de cada proibição.
  rationale: A posição final reproduz a estrutura do original sem resolver de modo artificial o alcance sintático, enquanto o contexto indica que o acordo proíbe incursões hostis, não toda passagem física.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de «é testemunha» e «de que» foi preservada para refletir o paralelismo e a solenidade do acordo.
