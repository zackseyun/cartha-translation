  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: pt
  text: 'Então Yahweh disse a Jacó: “Volte para a terra de seus pais e para a sua parentela[a], e eu estarei com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua terra natal”. O termo hebraico pode se referir aos parentes de alguém ou ao seu lugar de origem, isto é, seu local de nascimento ou sua terra natal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa sequência com naturalidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שׁוּב
  choice: Volte
  rationale: Traduz diretamente o imperativo com o sentido de retornar, em linguagem atual e digna.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: para a terra de seus pais
  rationale: Preserva de perto a construção hebraica e sua referência familiar masculina.
- source_word: מוֹלַדְתֶּךָ
  choice: para a sua parentela
  rationale: O substantivo pode designar o grupo de parentesco ou o lugar de origem. “Parentela” preserva a leitura relacional mais provável no contexto, enquanto a nota registra a ambiguidade geográfica.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: e eu estarei com você
  rationale: Expressa de maneira direta e natural a promessa futura da presença divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de מוֹלַדְתֶּךָ
  choice: sua parentela
  alternative: sua terra natal
  rationale: O termo admite tanto uma referência ao grupo familiar quanto ao lugar de origem. O texto principal adota a leitura relacional, mas a nota mantém aberta a alternativa geográfica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “você” na fala dirigida a Jacó e mantém “Yahweh” como nome divino.
