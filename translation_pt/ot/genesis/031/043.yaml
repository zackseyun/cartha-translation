base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: pt
  text: 'Então Labão respondeu a Jacó: “As filhas são minhas filhas, os filhos são meus filhos, o rebanho é meu rebanho, e tudo o que você vê é meu. Mas o que posso fazer hoje por estas minhas filhas ou pelos filhos que elas deram à luz?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelas crianças [ou pelos descendentes] que elas deram à luz”. O termo hebraico pode referir-se especificamente a filhos homens ou, em sentido mais amplo, aos filhos/descendentes.
    reason: Alternativa lexical para בְּנֵיהֶן; o hebraico masculino plural pode ser entendido de modo estrito ou genérico no contexto.
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Então Labão respondeu a Jacó
  rationale: Em português, “respondeu a Jacó” expressa naturalmente a fórmula narrativa hebraica “respondeu e disse a Jacó”, evitando uma duplicação pouco idiomática sem perder a função discursiva.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: As filhas são minhas filhas
  rationale: Mantém a repetição enfática e a reivindicação familiar de Labão.
- source_word: וְהַבָּנִים בָּנַי
  choice: os filhos são meus filhos
  rationale: Preserva o masculino plural e o paralelismo enfático com “filhas”.
- source_word: וְהַצֹּאן צֹאנִי
  choice: o rebanho é meu rebanho
  rationale: “Rebanho” traduz naturalmente o substantivo coletivo צֹאן e conserva a repetição do hebraico.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: e tudo o que você vê é meu
  rationale: Reproduz de forma direta e corrente a enfática reivindicação de posse.
- source_word: מָה אֶעֱשֶׂה הַיּוֹם
  choice: o que posso fazer hoje
  rationale: O imperfeito tem aqui força de possibilidade prática numa pergunta retórica; “hoje” é a forma moderna e direta de הַיּוֹם.
- source_word: לִבְנֹתַי ... אוֹ לִבְנֵיהֶן
  choice: por estas minhas filhas ou pelos filhos
  rationale: A preposição “por” comunica adequadamente o valor benefactivo de לְ. Em בְּנֵיהֶן, “filhos” conserva a forma lexical e a possível referência mais ampla é registrada em nota.
- source_word: אֲשֶׁר יָלָדוּ
  choice: que elas deram à luz
  rationale: Expressa com clareza e naturalidade que as filhas são o sujeito do parto, preservando a ênfase materna.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição enfática das reivindicações de Labão foi preservada, enquanto a fórmula hebraica “respondeu e disse” foi vertida de modo mais natural como “respondeu”.
