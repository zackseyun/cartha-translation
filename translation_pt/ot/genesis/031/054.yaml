base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: pt
  text: Então Jacó ofereceu um sacrifício no monte e chamou seus irmãos para comerem pão[a]. Eles comeram pão e passaram a noite no monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus parentes» ou «seus familiares»; neste contexto, a palavra hebraica traduzida por «irmãos» pode designar de forma mais ampla parentes do sexo masculino ou companheiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח יַעֲקֹב זֶבַח
  choice: Jacó ofereceu um sacrifício
  rationale: A construção cognata hebraica enfatiza o ato sacrificial. Em português, «ofereceu um sacrifício» preserva o sentido cultual com mais naturalidade do que «sacrificou um sacrifício».
- source_word: בָּהָר
  choice: no monte
  rationale: הַר pode indicar monte, montanha ou região montanhosa. «No monte» é natural no contexto narrativo e mantém a referência definida e repetida ao lugar.
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Mantém o sentido direto de קרא; no contexto, o chamado funciona como convite, sem ser necessário explicitar essa interpretação.
- source_word: לְאֶחָיו
  choice: seus irmãos
  rationale: אָח pode designar irmãos literais ou, de modo mais amplo, parentes e membros do grupo. A tradução conserva o termo familiar do hebraico, e a nota registra a amplitude possível.
- source_word: לֶאֱכָל לָחֶם
  choice: para comerem pão
  rationale: Preserva a expressão hebraica, que literalmente fala em comer pão e idiomaticamente pode referir-se a tomar uma refeição.
- source_word: וַיֹּאכְלוּ לֶחֶם
  choice: Eles comeram pão
  rationale: Mantém a repetição intencional da expressão hebraica e sua possível conotação de refeição compartilhada.
- source_word: וַיָּלִינוּ
  choice: passaram a noite
  rationale: Expressão corrente e precisa para o sentido de לון, permanecer ou alojar-se durante a noite.
theological_decisions:
- issue: Sentido de «seus irmãos» no contexto da aliança
  choice: seus irmãos
  alternative: seus parentes; seus familiares
  rationale: O substantivo hebraico pode abranger parentes ou associados do sexo masculino, mas o texto emprega o termo familiar «irmãos». Preservá-lo evita resolver no corpo do texto uma amplitude lexical genuína; a nota apresenta as alternativas contextuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a repetição de «pão» e de «monte», bem como a designação familiar «irmãos», preservando a textura e a ambiguidade do hebraico sem sacrificar a naturalidade.
