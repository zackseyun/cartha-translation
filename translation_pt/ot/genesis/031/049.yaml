  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: pt
  text: 'E Mispá[a], pois ele disse: “Que Yahweh vigie entre mim e você quando estivermos escondidos um do outro.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mispá soa como a palavra hebraica para “torre de vigia” ou “posto de observação”, ligando o nome do lugar ao pedido para que Yahweh “vigie”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando estivermos fora da vista um do outro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: E Mispá
  rationale: O termo funciona aqui como nome de lugar. A transliteração portuguesa “Mispá” preserva o nome e sua relação sonora com a raiz hebraica צפה, “vigiar”, explicada em nota.
- source_word: אֲשֶׁר אָמַר
  choice: pois ele disse
  rationale: A expressão introduz a explicação do nome. “Pois ele disse” traduz o nexo explicativo sem acrescentar “ele lhe deu esse nome”, ausente do texto hebraico.
- source_word: יִצֶף
  choice: vigie
  rationale: O verbo צפה significa “vigiar, observar”. O subjuntivo volitivo em “Que ... vigie” comunica naturalmente o valor jussivo e mantém o jogo de palavras com Mispá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Preserva a ordem do hebraico e usa uma forma clara e corrente, especialmente legível no português brasileiro.
- source_word: כִּי
  choice: quando
  rationale: Neste contexto, a conjunção introduz a circunstância em que a vigilância divina se faz necessária, não uma causa.
- source_word: נִסָּתֵר
  choice: estivermos escondidos
  rationale: Traduz de perto o nifal de סתר, “estar escondido, oculto”, sem eliminar a imagem do texto.
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: um do outro
  rationale: A construção distributiva, literalmente “um homem de seu companheiro”, tem sentido recíproco e é expressa naturalmente em português por “um do outro”.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Função da vigilância divina na fala de Labão
  choice: Que Yahweh vigie entre mim e você
  alternative: Que Yahweh seja testemunha entre mim e você
  rationale: Embora o contexto da aliança possa sugerir a função de testemunha ou juiz, o verbo hebraico significa “vigiar”. A tradução mantém essa formulação e não explicita uma função teológica apenas implícita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita a mistura regional de paradigmas e comunica com clareza o singular masculino do hebraico. A formulação mantém a concisão e a leve estranheza da expressão hebraica “escondidos um do outro”, esclarecida por nota.
