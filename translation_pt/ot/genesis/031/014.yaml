base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: pt
  text: 'Então Raquel e Lia responderam e lhe disseram: “Ainda temos alguma parte[a] ou herança na casa de nosso pai[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porção”.
    reason: lexical_alternative
  - marker: b
    text: “Casa de nosso pai” pode indicar não apenas a residência ou unidade doméstica, mas também os bens e o patrimônio da família.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: Então ... responderam
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência e o caráter de resposta.
- source_word: רָחֵל וְלֵאָה
  choice: Raquel e Lia
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: e lhe disseram
  rationale: Mantém tanto o verbo de fala quanto o objeto indireto explícito, indicando que as palavras foram dirigidas a Jacó.
- source_word: הַעוֹד
  choice: ainda
  rationale: Preserva a nuance temporal da pergunta sobre a permanência de algum direito ou posse.
- source_word: לָנוּ
  choice: temos
  rationale: A construção possessiva portuguesa com “ter” traduz de modo natural o dativo hebraico “para nós”.
- source_word: חֵלֶק
  choice: parte
  rationale: No contexto patrimonial, indica a parcela ou quota que caberia às filhas; “parte” é corrente e clara em português.
- source_word: וְנַחֲלָה
  choice: ou herança
  rationale: “Herança” comunica a propriedade ou posse hereditária. Embora o hebraico use a conjunção normalmente traduzida por “e”, em uma pergunta negativa os dois substantivos podem formar uma enumeração com valor idiomático de “nem... nem”; “ou” reproduz naturalmente essa força sem apagar a distinção lexical.
- source_word: בְּבֵית אָבִינוּ
  choice: na casa de nosso pai
  rationale: Tradução formalmente próxima e idiomática; “casa” pode abranger a família, os bens domésticos e o patrimônio paterno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue as expressões a que cada nota se refere. A duplicação hebraica “responderam e disseram” foi preservada de modo natural como “responderam e lhe disseram”.
