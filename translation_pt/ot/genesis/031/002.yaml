  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: pt
  text: Jacó observou o rosto de Labão e eis que a atitude dele para com Jacó já não era como antes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e eis que ele não estava com ele como ontem e anteontem”. A expressão indica que a disposição de Labão para com Jacó havia mudado.
    reason: literal_idiom
lexical_decisions:
- source_word: וַיַּרְא
  choice: observou
  rationale: O Qal narrativo de ראה significa literalmente “viu”; neste contexto, “observou” expressa naturalmente que Jacó reparou no semblante de Labão, sem transformar a percepção em mera inferência.
- source_word: פְּנֵי לָבָן
  choice: o rosto de Labão
  rationale: Mantém a imagem concreta do hebraico, na qual o rosto revela a disposição ou atitude da pessoa.
- source_word: וְהִנֵּה
  choice: e percebeu que
  rationale: הִנֵּה chama a atenção para a constatação seguinte. Em português narrativo atual, “percebeu que” transmite essa função de maneira natural, embora seja menos formalmente explícito que “e eis que”.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: ele já não o tratava
  rationale: A expressão literalmente diz que ele “não estava com ele”, mas, ligada ao rosto de Labão e esclarecida pelo paralelo do versículo 5, comunica uma mudança na disposição de Labão para com Jacó. A formulação evita pronomes ambíguos e torna inteligível a relação implícita.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: como antes
  rationale: A expressão idiomática, literalmente “como ontem e anteontem”, significa “como anteriormente” ou “como antes”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a imagem hebraica do rosto, mas explicita na oração seguinte a mudança de atitude para evitar a forte ambiguidade dos pronomes em uma reprodução estritamente literal.
