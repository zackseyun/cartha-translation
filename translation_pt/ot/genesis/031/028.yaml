  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: pt
  text: E você não me deixou beijar meus filhos e minhas filhas[a]. Agora você agiu insensatamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não me deixaste beijar meus filhos e minhas filhas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: não me deixou
  rationale: Embora נטשׁ tenha normalmente o sentido de “deixar, abandonar”, nesta construção com o infinitivo לְנַשֵּׁק expressa não dar oportunidade ou permissão. “Não me deixou” é natural em português e preserva a força da queixa.
- source_word: לְנַשֵּׁק
  choice: beijar
  rationale: O infinitivo significa “beijar”. O contexto sugere uma despedida, mas o hebraico não explicita essa ideia, por isso ela não foi acrescentada ao texto principal.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: meus filhos e minhas filhas
  rationale: O hebraico menciona explicitamente filhos e filhas; a tradução conserva ambos, em vez de generalizar como “meus filhos” ou “meus filhos e filhas” sem os possessivos correspondentes.
- source_word: עַתָּה
  choice: Agora
  rationale: Mantém o marcador temporal e discursivo que introduz a avaliação de Labão sobre a conduta de Jacó.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: você agiu como um insensato
  rationale: A construção hebraica expressa conduta insensata. Esta formulação é clara, idiomática e digna em português moderno, sem reduzir a censura a uma mera falta de prudência.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A fala preserva o tom direto de censura de Labão. “Você” oferece clareza contemporânea; “insensato” mantém um registro digno e acessível.
