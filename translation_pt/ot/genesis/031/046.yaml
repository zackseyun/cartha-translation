base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: pt
  text: 'Então Jacó disse a seus irmãos[a]: “Juntem pedras.” Eles pegaram pedras, fizeram um monte e comeram ali junto ao monte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode referir-se de modo mais amplo aos parentes ou companheiros de Jacó, e não apenas a irmãos no sentido literal.
    reason: cultural_note
  - marker: b
    text: Ou “comeram ali sobre o monte”. A preposição hebraica também pode ser entendida literalmente como “sobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: aos seus irmãos
  rationale: אָח significa normalmente “irmão”, mas também pode designar parentes ou companheiros próximos. A tradução mantém o termo mais próximo do hebraico e registra no rodapé a amplitude possível no contexto.
- source_word: לִקְטוּ אֲבָנִים
  choice: Juntem pedras
  rationale: O imperativo de לקט pede que se recolham ou juntem objetos. “Juntem pedras” é claro, natural e fiel ao contexto.
- source_word: וַיִּקְחוּ אֲבָנִים
  choice: Eles pegaram pedras
  rationale: לקח tem o sentido comum de tomar ou pegar. “Pegaram” é corrente em português e mantém a sequência simples da narrativa hebraica.
- source_word: וַיַּעֲשׂוּ גָל
  choice: fizeram um monte
  rationale: גַּל designa aqui um monte de pedras. “Monte” é acessível e natural, sem recorrer a um termo técnico como “moledro”.
- source_word: עַל הַגָּל
  choice: junto ao monte
  rationale: עַל pode significar literalmente “sobre”, mas também assumir sentido espacial de proximidade. “Junto ao monte” exprime de modo idiomático a cena provável, enquanto a leitura mais literal é preservada em nota.
theological_decisions: []
translation_notes:
