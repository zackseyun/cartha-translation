base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: pt
  text: Estou em sua casa há vinte anos. Servi o senhor durante catorze anos por suas duas filhas e durante seis anos pelo seu rebanho; e o senhor mudou o meu salário dez vezes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Estes vinte anos
  rationale: A expressão idiomática introduz a duração que Jacó acaba de resumir. A formulação conserva a força dêitica de זֶה e soa natural em português como expressão temporal anteposta.
- source_word: בְּבֵיתֶךָ
  choice: em sua casa
  rationale: Mantém o sentido concreto de בַּיִת, que aqui também pode abranger a casa como unidade doméstica, sem recorrer à interpretação mais ampla «com o senhor».
- source_word: עֲבַדְתִּיךָ
  choice: Servi o senhor
  rationale: עבד descreve o serviço e trabalho prestados por Jacó a Labão. «Servi» preserva tanto a dimensão laboral quanto a relacional.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: durante catorze anos por suas duas filhas
  rationale: A preposição בְּ indica aqui aquilo em troca do qual o serviço foi prestado. «Por suas duas filhas» é conciso e remete naturalmente ao acordo matrimonial.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: e durante seis anos pelo seu rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; «rebanho» conserva essa amplitude.
- source_word: וַתַּחֲלֵף
  choice: e o senhor mudou
  rationale: O hifil de חלף significa mudar ou substituir. O verbo simples, associado a «dez vezes», comunica adequadamente a repetição.
- source_word: מַשְׂכֻּרְתִּי
  choice: o meu salário
  rationale: O substantivo indica pagamento ou remuneração pelo trabalho. «Salário» é claro e corrente no contexto.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: dez vezes
  rationale: Trata-se de uma expressão idiomática para mudanças repetidas. A tradução literal por «dez contagens» seria obscura em português.
