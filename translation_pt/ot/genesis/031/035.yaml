  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: pt
  text: 'E ela disse a seu pai: “Que o meu senhor não fique irado comigo por eu não poder me levantar na sua presença, pois estou com o que é comum às mulheres.”[a] Ele procurou, mas não encontrou os ídolos domésticos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eufemismo hebraico para indicar que ela estava menstruada.
    reason: clarificação_cultural
  - marker: b
    text: 'Hebraico: “os terafins”, imagens ou objetos de culto doméstico.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: E ela disse a seu pai
  rationale: Mantém o avanço narrativo do wayyiqtol e traduz diretamente a identificação do destinatário.
- source_word: אַל־יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Que o meu senhor não fique irado comigo
  rationale: Expressa em português natural o pedido deferente de Raquel. חרה comunica ira, enquanto בְּעֵינֵי integra uma expressão idiomática de desagrado; uma reprodução mecânica como “aos olhos” seria pouco natural neste contexto.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: por eu não poder me levantar na sua presença
  rationale: Preserva tanto o sentido físico de קום como a nuance de estar diante ou na presença do interlocutor.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: estou com o que é comum às mulheres
  rationale: Conserva o eufemismo discreto do hebraico para a menstruação, mas de modo compreensível em português atual.
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: Ele procurou, mas não encontrou
  rationale: Torna explícito o sujeito recuperado do contexto e usa “mas” para comunicar naturalmente o resultado frustrado da busca.
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: Comunica de forma acessível que os terafins eram objetos de culto ligados ao ambiente doméstico, sem deixar o termo técnico sem explicação.
theological_decisions:
- issue: Identificação dos תְּרָפִים
  choice: ídolos domésticos
  alternative: terafins; deuses domésticos
  rationale: “Ídolos domésticos” preserva o caráter cultual e o contexto familiar dos objetos. “Deuses domésticos” poderia sugerir que o narrador reconhece sua divindade, enquanto a simples transliteração seria menos clara para o leitor comum.
- issue: Eufemismo relativo à menstruação
  choice: o que é comum às mulheres
  alternative: estou menstruada; o costume das mulheres está sobre mim
  rationale: A formulação mantém a reserva e o caráter eufemístico do original, sem transformar a expressão em linguagem clínica nem conservar um literalismo obscuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva a deferência de Raquel por meio de “meu senhor”, sem sugerir um título divino. Evitaram-se tanto o literalismo pouco natural de “aos olhos do meu senhor” como uma paráfrase clínica do eufemismo menstrual.
