  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: pt
  text: Se o Deus de meu pai, o Deus de Abraão e o Temor de Isaque[a] não tivesse estado comigo, certamente agora você me teria mandado embora de mãos vazias. Deus viu a minha aflição e o trabalho das minhas mãos e, na noite passada, decidiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele a quem Isaque teme”. Em hebraico, literalmente, “o Temor de Isaque”, um título singular dado a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי ... הָיָה לִי
  choice: Se ... não estivesse comigo
  rationale: Expressa em português natural a condição contrária aos fatos e entende הָיָה לִי, no contexto, como presença e auxílio divinos.
- source_word: אֱלֹהֵי אָבִי
  choice: o Deus de meu pai
  rationale: Reproduz com clareza a relação construtiva e a referência de Jacó ao Deus ancestral.
- source_word: וּפַחַד יִצְחָק
  choice: e o Temor de Isaque
  rationale: Conserva o título divino incomum e a força literal de פַחַד, sem dissolver sua ambiguidade numa paráfrase.
- source_word: כִּי עַתָּה רֵיקָם שִׁלַּחְתָּנִי
  choice: certamente agora você me teria mandado embora de mãos vazias
  rationale: A forma condicional composta explicita a consequência irreal; 'de mãos vazias' é o equivalente idiomático de רֵיקָם.
- source_word: עָנְיִי
  choice: a minha aflição
  rationale: Abrange sofrimento, humilhação e maus-tratos, sem restringir o sentido à pobreza material.
- source_word: יְגִיעַ כַּפַּי
  choice: o trabalho das minhas mãos
  rationale: Mantém a imagem hebraica e comunica de modo claro o trabalho árduo de Jacó.
- source_word: וַיּוֹכַח
  choice: julgou a causa
  rationale: Preserva a nuance forense de decidir ou arbitrar uma disputa sem inserir um objeto pronominal ausente no hebraico; o contexto permite entender a intervenção divina contra Labão.
- source_word: אָֽמֶשׁ
  choice: na noite passada
  rationale: Equivalente temporal natural e preciso no contexto da advertência recebida por Labão em sonho.
theological_decisions:
- issue: O título divino וּפַחַד יִצְחָק
  choice: o Temor de Isaque
  alternative: aquele a quem Isaque teme; o Pavor de Isaque
  rationale: A formulação literal conserva a expressão teologicamente singular do hebraico. A nota esclarece a leitura relacional possível sem torná-la obrigatória no texto.
- issue: O sentido de וַיּוֹכַח
  choice: julgou a causa
  alternative: repreendeu; decidiu; decidiu entre nós
  rationale: O verbo admite matizes de julgamento, decisão e repreensão. 'Julgou a causa' preserva a dimensão judicial e se ajusta à intervenção divina da noite anterior, sem acrescentar 'você' ou 'entre nós' ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção condicional é natural; o título incomum é preservado no texto e explicado em nota. Evitou-se vírgula entre o sujeito composto e o verbo.
