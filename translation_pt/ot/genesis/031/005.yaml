base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: pt
  text: 'Então ele lhes disse: “Vejo que o rosto do pai de vocês não está voltado para mim como antes[a], mas o Deus de meu pai tem estado comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como ontem e anteontem”, expressão hebraica que significa “como antes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Então ele lhes disse
  rationale: O wayyiqtol dá sequência à narrativa; “lhes” representa naturalmente em português as duas mulheres a quem Jacó se dirige.
- source_word: רֹאֶה אָנֹכִי
  choice: Vejo
  rationale: O particípio com o pronome independente expressa percepção presente; o presente simples é natural e preciso em português.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: o rosto do pai de vocês
  rationale: Mantém a imagem concreta do hebraico, na qual “rosto” comunica a disposição ou atitude de Labão.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: já não é o mesmo para comigo
  rationale: Em ligação com “rosto”, comunica a mudança da disposição de Labão sem explicitar além do texto; “já” assinala naturalmente o contraste temporal.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: como antes
  rationale: É o equivalente idiomático natural da expressão hebraica para a situação anterior; a forma mais literal é registrada em nota.
- source_word: וֵאלֹהֵי אָבִי
  choice: mas o Deus de meu pai
  rationale: “Mas” explicita o contraste contextual entre a mudança de atitude de Labão e a presença sustentadora de Deus, enquanto “o Deus de meu pai” preserva de perto a construção hebraica.
- source_word: הָיָה עִמָּדִי
  choice: tem estado comigo
  rationale: O pretérito perfeito composto apresenta a presença de Deus como contínua até o momento da fala.
theological_decisions:
- issue: Tradução da referência divina אֱלֹהֵי אָבִי
  choice: o Deus de meu pai
  alternative: o Deus do meu pai
  rationale: A forma escolhida acompanha de perto o construto hebraico e preserva o tom familiar e pactual sem acrescentar interpretação doutrinária.
- issue: Valor da conjunção וְ antes de אֱלֹהֵי אָבִי
  choice: mas
  alternative: e
  rationale: O valor adversativo surge do contraste contextual entre a atitude desfavorável de Labão e a presença de Deus; a tradução não altera a identidade nem a função da referência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “pai de vocês” deixa claro que Jacó fala a Raquel e Lia; “para comigo” conserva a metáfora relacional ligada ao rosto, embora com leve formalidade adequada ao registro bíblico.
