  text: וְ/אַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּ/כָל כֹּחִ֔/י עָבַ֖דְתִּי אֶת אֲבִי/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: pt
  text: E vocês mesmas sabem que servi ao pai de vocês com toda a minha força.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalhei para o pai de vocês”. O verbo hebraico pode significar “servir” ou “trabalhar”, e ambos os sentidos se aplicam aos anos de trabalho de Jacó sob Labão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: E vocês mesmas
  rationale: A conjunção funciona como ligação simples, e o pronome feminino plural independente dá ênfase às duas interlocutoras, Raquel e Lia; “vocês mesmas” preserva essa marca.
- source_word: יְדַעְתֶּן
  choice: sabem
  rationale: O perfeito qal de ידע pode indicar um estado presente decorrente de conhecimento adquirido; em português corrente, “sabem” expressa isso naturalmente.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que elas sabem.
- source_word: בְּ/כָל כֹּחִי
  choice: com toda a minha força
  rationale: כֹּחַ designa força, poder ou capacidade; no contexto do trabalho de Jacó, a expressão comunica dedicação e esforço totais.
- source_word: עָבַדְתִּי
  choice: servi
  rationale: עבד pode significar tanto servir como trabalhar. Diante de um objeto pessoal, “servi ao pai de vocês” preserva o sentido relacional sem excluir o labor realizado.
- source_word: אֶת אֲבִיכֶן
  choice: ao pai de vocês
  rationale: Com o verbo português “servir” neste sentido, a regência com “a” é natural e expressa a relação de serviço a Labão.
theological_decisions: []
