  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: pt
  text: Eu sou o Deus de Betel[a], onde você ungiu uma coluna de pedra e fez um voto a mim. Agora levante-se, saia desta terra e volte para a sua terra natal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel significa “casa de Deus”; aqui, porém, é o nome do lugar.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: o Deus de Betel
  rationale: O artigo em הָאֵל e a fala divina identificam o Deus que se revelou a Jacó; בֵּית אֵל funciona aqui como nome de lugar.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: onde você ungiu uma coluna de pedra
  rationale: Preserva a ação concreta de ungir e explicita naturalmente que מַצֵּבָה é uma pedra erguida, sem acrescentar finalidade cultual.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: fez um voto a mim
  rationale: A construção cognata hebraica intensifica a ideia de voto; em português corrente, 'fez um voto' comunica o sentido sem a formulação pouco natural 'votou um voto'.
- source_word: קוּם צֵא
  choice: levante-se, saia
  rationale: Os dois imperativos são mantidos separadamente, com linguagem moderna e digna.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: אֶרֶץ designa aqui a região em que Jacó vivia, não o planeta inteiro.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: e volte para a sua terra natal
  rationale: '''Terra natal'' expressa de modo natural a terra de origem indicada por אֶרֶץ מוֹלַדְתֶּךָ, sem restringir o sentido apenas à parentela.'
theological_decisions:
- issue: Autoidentificação do falante como הָאֵל בֵּית אֵל
  choice: Eu sou o Deus de Betel
  alternative: Eu sou Deus em Betel
  rationale: A formulação liga o falante ao encontro anterior de Jacó em Betel. Mantém a construção do hebraico sem sugerir um deus local entre outros nem acrescentar uma explicação ausente do texto.
translation_notes:
  register: 'Português atual, claro e digno, com ampla legibilidade brasileira. A repetição de שָׁם (''ali'') não foi reproduzida duas vezes, pois as orações com ''onde'' preservam naturalmente a referência ao lugar. Corrigiu-se a associação equivocada das notas na camada inglesa: a nota em Betel explica o topônimo; não há necessidade de nota para a construção cognata do voto, já expressa idiomaticamente no texto.'
