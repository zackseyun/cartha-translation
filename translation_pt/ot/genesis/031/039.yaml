  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: pt
  text: Eu não trazia a você nenhum animal dilacerado por feras[a]; eu mesmo arcava com o prejuízo.[b] Você cobrava de mim tanto o que era roubado de dia como o que era roubado de noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “algo dilacerado”; neste contexto, um animal do rebanho morto por predadores.
    reason: lexical_clarification
  - marker: b
    text: 'Ou: “eu mesmo o indenizava” ou “eu mesmo reparava a perda”. O verbo hebraico indica aqui assumir a responsabilidade pelo animal perdido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרֵפָה
  choice: animal dilacerado por feras
  rationale: No contexto pastoril, o termo designa um animal atacado e despedaçado por predadores. A formulação explicita o referente implícito sem perder a imagem concreta.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: trazia a você
  rationale: O imperfeito habitual em português comunica adequadamente a conduta recorrente de Jacó durante seu serviço, enquanto בוא com אֶל indica levar ou trazer algo a alguém.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: eu mesmo arcava com o prejuízo
  rationale: O pronome independente אָנֹכִי dá ênfase a Jacó. Aqui, o Piel de חטא exprime assumir a responsabilidade ou reparar a perda, não cometer pecado.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: Você cobrava de mim
  rationale: A expressão idiomática significa exigir de alguém a prestação ou reposição da perda. A tradução natural em português conserva a ideia de responsabilidade pessoal.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: tanto o que era roubado de dia como o que era roubado de noite
  rationale: A construção apresenta de forma aditiva as perdas por roubo ocorridas de dia e de noite. 'Tanto... como...' preserva essa abrangência sem introduzir uma alternativa disjuntiva.
