base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: pt
  text: 'Ele disse: “Levante os olhos, por favor, e veja: todos os bodes que estão cobrindo o rebanho[a] são listrados[b], salpicados e malhados, pois vi tudo o que Labão está lhe fazendo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “montando o rebanho”. A expressão hebraica é uma forma idiomática de falar da reprodução animal.
    reason: lexical_alternative
  - marker: b
    text: Traduções tradicionais também empregam expressões como “com faixas” ou “com listras em forma de anel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Levante os olhos, por favor
  rationale: Preserva a expressão hebraica de erguer os olhos e representa נָא como partícula cortês, em português atual e natural.
- source_word: וּרְאֵה
  choice: e veja
  rationale: Traduz diretamente o imperativo de ראה e mantém a ênfase visual da cena.
- source_word: הָעַתֻּדִים
  choice: os bodes
  rationale: עַתּוּד designa aqui os machos caprinos; “bodes” é preciso, corrente e evita a possível confusão de “carneiros” com machos ovinos.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: que estão cobrindo o rebanho
  rationale: Em contexto de reprodução animal, a expressão é um eufemismo para a monta. “Cobrir” é um termo português corrente nesse contexto e conserva o aspecto progressivo do particípio.
- source_word: עֲקֻדִּים
  choice: listrados
  rationale: O adjetivo indica animais marcados por faixas ou listras. “Listrados” é claro para leitores modernos, enquanto a nota registra a tradução tradicional mais literal.
- source_word: נְקֻדִּים
  choice: salpicados
  rationale: Expressa pequenas pintas ou pontos e ajuda a distingui-los dos padrões maiores indicados pelo termo seguinte.
- source_word: וּבְרֻדִּים
  choice: malhados
  rationale: Comunica um padrão variegado ou de manchas, mantendo tanto quanto possível a distinção em relação a נְקֻדִּים.
- source_word: כִּי רָאִיתִי
  choice: pois vi
  rationale: Mantém a força causal de כִּי e traduz o perfeito de ראה de maneira direta, sem excluir sua relevância presente.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: tudo o que Labão está fazendo com você
  rationale: A forma progressiva representa o particípio עֹשֶׂה como ação em curso; “com você” transmite naturalmente que Jacó é a pessoa afetada, sem acrescentar explicitamente uma intenção hostil.
theological_decisions:
- issue: Sentido de לָּךְ na descrição das ações de Labão
  choice: com você
  alternative: por você
  rationale: O contexto indica Jacó como pessoa afetada pelo tratamento de Labão, não como beneficiário. A formulação escolhida preserva isso sem intensificar o texto para “contra você”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cobrir” é usado no sentido técnico corrente de acasalamento animal; a sequência “listrados, salpicados e malhados” procura conservar as três categorias distintas de pelagem do hebraico.
