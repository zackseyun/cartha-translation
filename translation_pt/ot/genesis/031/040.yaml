  text: הָיִ֧יתִי בַ/יּ֛וֹם אֲכָלַ֥/נִי חֹ֖רֶב וְ/קֶ֣רַח בַּ/לָּ֑יְלָה וַ/תִּדַּ֥ד שְׁנָתִ֖/י מֵֽ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: pt
  text: De dia, o calor me consumia, e, de noite, a geada; o sono fugia dos meus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu estava assim: de dia, o calor me consumia, e, de noite, a geada; o sono fugia dos meus olhos.” O hebraico começa com “Eu estava”, expressão incorporada à estrutura da frase principal para maior naturalidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[incorporado à estrutura da frase]'
  rationale: O verbo “eu estava” introduz a condição vivida por Jacó. Em português natural, seu valor é comunicado pela descrição “De dia...”, sem necessidade de uma cópula explícita.
- source_word: בַיּוֹם
  choice: De dia
  rationale: Expressão temporal corrente que mantém o contraste equilibrado com “de noite”.
- source_word: אֲכָלַנִי
  choice: me consumia
  rationale: Preserva a metáfora do verbo אכל, literalmente “comer”, e exprime de modo natural o desgaste causado pela exposição.
- source_word: חֹרֶב
  choice: o calor
  rationale: No contraste com a geada noturna, designa o calor seco e intenso do dia. “O calor” é claro e não acrescenta intensidade além da explicitada pelo contexto.
- source_word: וְקֶרַח
  choice: e... a geada
  rationale: קֶרַח pode indicar gelo ou geada; neste contexto de exposição noturna, “geada” comunica com precisão o frio congelante.
- source_word: בַּלָּיְלָה
  choice: de noite
  rationale: Contraparte temporal natural de “de dia”, preservando o paralelismo hebraico.
- source_word: וַתִּדַּד
  choice: fugia
  rationale: O verbo raro comunica afastamento ou fuga. Com “sono” como sujeito, “fugia” conserva a personificação e soa natural em português.
- source_word: שְׁנָתִי
  choice: o sono
  rationale: Refere-se ao sono de Jacó; o possessivo fica semanticamente claro pela expressão seguinte, “dos meus olhos”, evitando a formulação pouco natural “meu sono fugia dos meus olhos”.
- source_word: מֵעֵינָי
  choice: dos meus olhos
  rationale: Mantém a imagem hebraica tradicional e inteligível para expressar a perda do sono.
