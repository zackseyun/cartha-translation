  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: pt
  text: 'Então o anjo de Deus me disse no sonho[a]: “Jacó!” E eu disse: “Aqui estou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num sonho”. O hebraico traz “no sonho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אֵלַי
  choice: me disse
  rationale: A construção portuguesa com pronome oblíquo comunica de modo natural o hebraico “disse a mim”.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: o anjo de Deus
  rationale: מַלְאָךְ pode significar mensageiro ou anjo; neste contexto, “anjo” é a designação portuguesa mais clara, sem definir além do texto a identidade da figura.
- source_word: בַּחֲלוֹם
  choice: no sonho
  rationale: Reproduz o artigo definido presente no hebraico, embora “num sonho” também seja possível em português.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וָאֹמַר
  choice: E eu respondi
  rationale: Embora o verbo seja literalmente “disse”, “respondi” expressa naturalmente em português a fala que segue ao chamado, sem alterar seu conteúdo.
- source_word: הִנֵּנִי
  choice: Aqui estou
  rationale: Equivalente português natural da fórmula hebraica de prontidão e apresentação pessoal.
theological_decisions:
- issue: A identidade do מַלְאַךְ הָאֱלֹהִים em um contexto que pode sugerir relação particular com o divino
  choice: o anjo de Deus
  alternative: o mensageiro de Deus
  rationale: A tradução mantém a designação do próprio versículo e não resolve questões teológicas mais amplas sobre a identidade do anjo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação distingue claramente o chamado e a resposta; o artigo definido do hebraico é preservado no texto principal.
