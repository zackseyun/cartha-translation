  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: pt
  text: 'Tenho poder para fazer mal a vocês, mas o Deus do pai de vocês me disse ontem à noite: “Tenha cuidado para não falar com Jacó nem bem nem mal.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do bem até o mal”, expressão que abrange tudo o que se poderia dizer, fosse favorável ou desfavorável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: Tenho poder
  rationale: Expressa naturalmente em português a capacidade ou o poder indicado pela expressão idiomática hebraica, sem reproduzir de modo artificial a imagem literal da mão.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: para fazer mal a vocês
  rationale: Neste contexto, רָע designa ação prejudicial dirigida aos ouvintes; “fazer mal” mantém tanto a naturalidade quanto a tonalidade moral potencial do termo.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: mas o Deus do pai de vocês
  rationale: “Mas” explicita o contraste contextual entre o poder alegado por Labão e a intervenção divina. O plural “vocês” preserva a forma do sufixo hebraico, provavelmente abrangendo Jacó e seu grupo, enquanto “pai” permanece singular no texto fonte.
- source_word: אֶמֶשׁ
  choice: ontem à noite
  rationale: É a forma corrente e precisa de indicar a noite anterior em português.
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: Transmite com naturalidade a advertência enfática da construção hebraica.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: para não dizer a Jacó
  rationale: A construção com הִשָּׁמֶר e מִן tem força proibitiva. “Dizer a Jacó” combina naturalmente com a expressão polar que especifica o conteúdo da fala.
- source_word: מִטּוֹב עַד רָע
  choice: nem bem nem mal
  rationale: Preserva os dois polos da expressão hebraica e sua ambiguidade formal, enquanto a nota esclarece o valor idiomático abrangente.
theological_decisions:
- issue: Referência de אֱלֹהִים na expressão וֵאלֹהֵי אֲבִיכֶם
  choice: o Deus do pai de vocês
  alternative: o Deus de seus pais
  rationale: O substantivo “pai” está no singular, ao passo que o sufixo pronominal está no plural. A tradução conserva ambos os números e evita reduzir o plural a uma referência exclusiva a Jacó ou alterar “pai” para o plural.
- issue: Alcance da proibição divina מִטּוֹב עַד רָע
  choice: não dizer a Jacó nem bem nem mal
  alternative: não dizer absolutamente nada a Jacó
  rationale: A tradução principal mantém a polaridade concreta do hebraico, sem resolver silenciosamente se a proibição recai sobre toda fala ou sobre qualquer tentativa favorável ou hostil; a nota informa o sentido idiomático provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural hebraico e mantém a fala divina em registro direto. O marcador [a] aparece imediatamente após a citação à qual se refere.
