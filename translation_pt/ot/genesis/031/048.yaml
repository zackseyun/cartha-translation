  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: pt
  text: 'E Labão disse: “Este monte de pedras é hoje testemunha entre mim e você.” Por isso, ele o chamou de Galeede[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Galeede significa, em hebraico, “monte de testemunho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva a sequência de modo natural em português.
- source_word: לָבָן
  choice: Labão
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הַגַּל הַזֶּה
  choice: Este monte de pedras
  rationale: גַּל designa aqui um amontoado de pedras. A explicitação “de pedras” evita que “monte” seja entendido como elevação geográfica e corresponde ao contexto imediato.
- source_word: עֵד
  choice: testemunha
  rationale: O monte de pedras funciona como sinal testemunhal do acordo entre as partes; “testemunha” preserva a personificação e o sentido jurídico-relacional.
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre mim e você
  rationale: Mantém a referência explícita às duas partes e usa linguagem moderna, clara e amplamente compreensível.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente direto e natural do advérbio temporal hebraico.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de maneira clara e idiomática a explicação causal do nome.
- source_word: קָרָא שְׁמוֹ
  choice: ele o chamou de
  rationale: Expressa naturalmente em português a fórmula hebraica de nomeação, mantendo Labão como o sujeito masculino singular do verbo.
- source_word: גַּלְעֵד
  choice: Galeede
  rationale: Transliteração tradicional em português do nome hebraico, cujo jogo de palavras é explicado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem da frase foi ajustada para que “hoje” se ligue naturalmente à função testemunhal do monte. O jogo etimológico do nome foi preservado em nota, sem traduzir o nome próprio no texto principal.
