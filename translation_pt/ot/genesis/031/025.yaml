base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: pt
  text: Labão alcançou Jacó[a]. Jacó havia armado a sua tenda na região montanhosa[c], e Labão acampou com seus parentes[b] na região montanhosa de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alcançou Jacó durante a perseguição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus irmãos”; aqui, provavelmente, seus parentes ou membros do seu clã.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no monte”; a expressão também pode ser entendida em relação a Gileade como “no monte Gileade” ou “nas montanhas de Gileade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: alcançou
  rationale: O verbo נשׂג, no contexto de uma perseguição, indica que Labão alcançou Jacó. A escolha mantém essa ideia sem sugerir que Jacó foi capturado.
- source_word: תָּקַע אֶת אָהֳלוֹ
  choice: havia armado a sua tenda
  rationale: A combinação de תקע com אהל é uma expressão para armar uma tenda. O mais-que-perfeito deixa claro, de modo natural em português, que Jacó já estava acampado quando Labão o alcançou.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: הַר pode designar um monte específico ou uma área de montanhas. Neste contexto geográfico, a expressão regional é natural e preserva a amplitude possível do termo.
- source_word: תָּקַע אֶת אֶחָיו
  choice: acampou com seus parentes
  rationale: A construção hebraica é elíptica e retoma a ação de armar acampamento da oração anterior. Em português, “acampou com” transmite o sentido sem acrescentar explicitamente tendas que o texto não menciona nesta segunda oração.
- source_word: אֶחָיו
  choice: seus parentes
  rationale: Embora a forma signifique literalmente “seus irmãos”, אח pode incluir membros mais amplos do grupo familiar ou clã; “parentes” se ajusta ao grupo que acompanhava Labão.
- source_word: בְּהַר הַגִּלְעָד
  choice: na região montanhosa de Gileade
  rationale: A expressão pode referir-se ao monte, às montanhas ou à região elevada de Gileade. A tradução adotada é clara no contexto, enquanto a nota preserva as alternativas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Região montanhosa” evita regionalismos e comunica o sentido geográfico; “acampou” resolve naturalmente a elipse hebraica sem inserir tendas no texto principal.
