- from: Ele conduziu todos os seus rebanhos e todos os bens que havia adquirido — os rebanhos que havia adquirido em Padã-Arã — e partiu para junto de seu pai Isaque, na terra de Canaã.[a]
  to: Ele conduziu todos os seus rebanhos e todos os bens que havia adquirido — os rebanhos que havia adquirido em Padã-Arã — para ir ao encontro de seu pai Isaque, à terra de Canaã.[a]
  rationale: A revisão mantém as escolhas lexicais adequadas do rascunho, mas restaura a relação de finalidade do infinitivo hebraico e torna explícito no texto principal que Canaã é o destino do movimento. A nota foi ajustada para explicar a forma direcional sem oferecer uma alternativa que já não corresponde ao texto principal.
