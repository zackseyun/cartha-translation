base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: pt
  text: Ele conduziu todos os seus rebanhos e todos os bens que havia adquirido — os rebanhos que havia adquirido em Padã-Arã — para ir ao encontro de seu pai Isaque, à terra de Canaã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em direção a Canaã”. O hebraico emprega uma forma direcional que indica movimento rumo a Canaã.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: conduziu
  rationale: O verbo נהג descreve fazer animais avançarem. “Conduziu” é natural em português e abrange o deslocamento dos rebanhos sem sugerir que Jacó os levava pessoalmente sozinho.
- source_word: מִקְנֵהוּ
  choice: seus rebanhos
  rationale: מִקְנֶה designa coletivamente os animais de criação. “Rebanhos” é claro e corrente, sem restringir o sentido a gado bovino.
- source_word: רְכֻשׁוֹ
  choice: os bens
  rationale: רְכוּשׁ refere-se a propriedade ou bens, sobretudo posses transportáveis. “Bens” preserva a amplitude do termo em português natural.
- source_word: רָכָשׁ
  choice: havia adquirido
  rationale: O verbo expressa obtenção ou aquisição de propriedade. A repetição de “havia adquirido” reproduz a repetição enfática do hebraico.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: os rebanhos que havia adquirido
  rationale: A construção é redundante e enfática no hebraico. Esta formulação mantém a ênfase de modo compreensível, evitando a expressão artificial “rebanhos de sua aquisição”.
- source_word: בְּפַדַּן אֲרָם
  choice: em Padã-Arã
  rationale: O topônimo é transliterado segundo uma forma portuguesa reconhecível, com acentos que orientam a pronúncia.
- source_word: לָבוֹא
  choice: e partiu para junto de
  rationale: O infinitivo indica o propósito ou destino do deslocamento. Em português, “e partiu para junto de” torna natural a progressão narrativa sem perder a ideia de ir ao encontro de Isaque.
- source_word: אַרְצָה כְּנָעַן
  choice: na terra de Canaã
  rationale: A forma direcional indica movimento rumo a Canaã. Ligada a Isaque, “na terra de Canaã” identifica naturalmente onde ele se encontrava; a nuance direcional é explicitada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “havia adquirido” preserva a ênfase do original, enquanto os travessões delimitam a explicação sobre os rebanhos. O marcador [a] aparece no texto principal.
