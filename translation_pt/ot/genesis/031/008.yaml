base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: pt
  text: 'Se ele dizia: “Os salpicados serão o seu salário”, todo o rebanho dava crias salpicadas; e, se dizia: “Os listrados serão o seu salário”, todo o rebanho dava crias listradas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: salpicados
  rationale: Indica animais marcados com pequenos pontos ou manchas; “salpicados” é natural em português e distingue este padrão do termo seguinte.
- source_word: עֲקֻדִּים
  choice: listrados
  rationale: Designa animais com marcas em faixas ou listras; “listrados” comunica claramente o contraste com “salpicados”.
- source_word: שְׂכָרֶךָ
  choice: o seu salário
  rationale: Mantém o sentido direto de remuneração ou pagamento devido a Jacó.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: todo o rebanho dava crias
  rationale: Expressa idiomaticamente o ato de os animais parirem, sem sugerir que cada animal individual necessariamente deu à luz.
