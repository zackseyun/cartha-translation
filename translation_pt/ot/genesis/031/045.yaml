base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: pt
  text: Então Jacó tomou uma pedra e a ergueu como coluna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra erguida” ou “pedra memorial”. O termo hebraico מַצֵּבָה designa uma pedra levantada como marco ou coluna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O wayyiqtol qal de לקח significa normalmente “tomar” ou “pegar”. “Pegou” é natural na narrativa e descreve com clareza Jacó tomando a pedra.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma consagrada do nome hebraico em português.
- source_word: אָבֶן
  choice: uma pedra
  rationale: O substantivo singular designa uma pedra; o artigo indefinido é natural em português neste contexto.
- source_word: וַיְרִימֶהָ
  choice: a levantou
  rationale: A forma verbal, com sufixo feminino singular que retoma “pedra”, expressa o ato de erguê-la. “A levantou” preserva de modo natural a imagem concreta do hebraico.
- source_word: מַצֵּבָה
  choice: como coluna
  rationale: O termo designa uma pedra erguida, usada como marco ou coluna. “Como coluna” mantém a função predicativa do substantivo sem especificar uma finalidade que o versículo não declara.
theological_decisions:
- issue: Tradução de מַצֵּבָה num contexto em que pedras erguidas podem ter função memorial ou cultual
  choice: coluna
  alternative: pedra erguida; pedra memorial
  rationale: O versículo relata o ato físico sem definir explicitamente a função religiosa ou memorial da pedra. “Coluna” preserva o sentido lexical e evita impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva a concisão narrativa do hebraico e mantém aberta a possível função da pedra.
