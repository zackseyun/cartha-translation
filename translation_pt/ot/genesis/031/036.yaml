review_pass:
  verdict: revise
  source_fidelity: A sequência narrativa e o paralelismo de «transgressão» e «pecado» são bem preservados. Contudo, «para que você me persiga» introduz finalidade e usa presente do subjuntivo, enquanto o perfeito hebraico se refere à perseguição já realizada por Labão. A formulação deve expressar essa relação sem sugerir propósito.
  naturalness: O texto é claro e de registro bíblico moderno. «Que você me perseguiu com tanto ardor?» é uma construção interrogativa natural que evita a finalidade indevida de «para que ... persiga».
  terminology: «Jacó», «Labão», «transgressão» e «pecado» são adequados e consistentes. «Com tanto ardor» comunica de modo aceitável a intensidade evocada por דלק; a nota deve apresentar como alternativa a tradução menos marcada, e não uma paráfrase pouco idiomática.
  issues:
  - severity: medium
    issue: «para que você me persiga» altera a relação sintática e o tempo verbal.
    rationale: A expressão portuguesa normalmente indica finalidade e o subjuntivo presente não corresponde à ação passada expressa por דָלַקְתָּ. No contexto, Jacó questiona a falta que justificaria Labão tê-lo perseguido.
  - severity: medium
    issue: A nota propõe «para que você tenha vindo em minha perseguição?».
    rationale: Essa paráfrase não é uma alternativa lexical natural para o hebraico, introduz «ter vindo» sem base explícita e não esclarece adequadamente a alternativa mais simples de «perseguiu».
