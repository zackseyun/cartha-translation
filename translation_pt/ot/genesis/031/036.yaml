base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: pt
  text: 'Então Jacó ficou irado e discutiu com Labão. Jacó respondeu e disse a Labão: “Qual é a minha transgressão? Qual é o meu pecado, que você me perseguiu com tanto ardor?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que você me perseguiu”. O verbo hebraico pode transmitir a ideia de perseguir com ardor ou intensidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Então Jacó ficou irado
  rationale: A construção idiomática חרה + ל indica que a ira se acendeu em Jacó. “Ficou irado” é natural, digna e conserva o caráter ingressivo da sequência narrativa.
- source_word: וַיָּרֶב בְּלָבָן
  choice: e discutiu com Labão
  rationale: ריב expressa disputa ou contenda. “Discutiu com” comunica o confronto verbal em português corrente sem sugerir necessariamente violência física.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Jacó respondeu e disse
  rationale: Mantém os dois verbos da fórmula narrativa hebraica, ainda compreensível e natural em registro bíblico moderno.
- source_word: מַה פִּשְׁעִי
  choice: Qual é a minha transgressão?
  rationale: פשע possui matiz moral e jurídico de violação ou rebeldia. “Transgressão” conserva esse peso e o paralelismo retórico.
- source_word: מַה חַטָּאתִי
  choice: Qual é o meu pecado?
  rationale: חטאת designa pecado ou falta. “Pecado” é a correspondência direta e preserva a distinção relativa em relação a “transgressão”.
- source_word: כִּי
  choice: para que
  rationale: Neste contexto, כִּי liga as perguntas à perseguição de Labão. “Para que” produz uma pergunta idiomática em português sem afirmar que a perseguição teve propósito legítimo.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: você me persiga com tanto ardor
  rationale: דלק pode evocar ardor e, por extensão, perseguição intensa. A formulação conserva a vivacidade da imagem hebraica; a nota registra a opção mais simples.
