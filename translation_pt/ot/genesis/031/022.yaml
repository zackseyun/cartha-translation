  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: pt
  text: No terceiro dia, Labão foi informado de que Jacó havia fugido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: foi informado
  rationale: O hofal de נגד expressa que a informação foi comunicada a Labão. “Foi informado” preserva a voz passiva e soa natural em português, sem acrescentar quem levou a notícia.
- source_word: לְלָבָן
  choice: Labão
  rationale: A preposição לְ marca o destinatário da informação; na construção portuguesa, o nome funciona naturalmente como sujeito de “foi informado”.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: Reproduz diretamente a expressão temporal hebraica, sem acrescentar “depois disso”, que não está explícito no texto.
- source_word: כִּי
  choice: de que
  rationale: Neste contexto, כִּי introduz o conteúdo da informação. Após “foi informado”, a regência natural em português é “de que”.
- source_word: בָרַח
  choice: havia fugido
  rationale: ברח significa fugir. O mais-que-perfeito composto deixa claro, de modo natural na narrativa portuguesa, que a fuga ocorreu antes de Labão receber a notícia.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
