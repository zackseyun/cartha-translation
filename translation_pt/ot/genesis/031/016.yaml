  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: pt
  text: Pois toda a riqueza que Deus tirou[a] de nosso pai pertence a nós e a nossos filhos. Agora, faça tudo o que Deus lhe disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resgatou” ou “livrou”. O verbo hebraico muitas vezes expressa libertação, mas aqui se refere a Deus retirar a riqueza de Labão e destiná-la à família de Jacó.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a justificativa das irmãs para concordarem com Jacó, preservando a ligação explicativa com o contexto anterior.
- source_word: כָל הָעֹשֶׁר
  choice: toda a riqueza
  rationale: עֹשֶׁר designa riqueza ou bens; a expressão é natural e suficientemente ampla para abranger os rebanhos e demais recursos materiais do relato.
- source_word: הִצִּיל
  choice: tirou
  rationale: Embora o verbo frequentemente signifique resgatar ou livrar, aqui seu objeto é a riqueza removida do poder de Labão e destinada à casa de Jacó. 'Tirou de' comunica essa transferência sem sugerir necessariamente uma apreensão violenta.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Equivalente normal quando אֱלֹהִים se refere ao Deus verdadeiro neste relato.
- source_word: מֵאָבִינוּ
  choice: de nosso pai
  rationale: A preposição מן indica a origem ou posse da qual a riqueza foi retirada.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: pertence a nós e a nossos filhos
  rationale: Explicita de modo idiomático o sentido hebraico de posse ou direito, sem acrescentar uma distribuição não indicada pelo texto.
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: Marca a transição da justificativa para a exortação e torna perceptível a relação inferencial.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: tudo o que Deus lhe disse
  rationale: Preserva a totalidade de כֹּל אֲשֶׁר em português natural; 'lhe' se refere singularmente a Jacó.
- source_word: עֲשֵׂה
  choice: faça
  rationale: Imperativo singular direto e conciso; o objeto é fornecido pela oração precedente.
theological_decisions:
- issue: A ação divina em relação à riqueza de Labão
  choice: tirou
  alternative: resgatou / livrou
  rationale: O contexto destaca a remoção da riqueza antes vinculada a Labão e sua atribuição à família de Jacó. A opção não caracteriza o ato divino como roubo nem elimina o sentido frequente de libertação do verbo, registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão do hebraico são preservadas sem produzir uma formulação artificial. O marcador da nota foi colocado junto ao verbo a que se refere.
