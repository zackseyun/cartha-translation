base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: pt
  text: Então, ele levou consigo seus parentes[a], perseguiu Jacó durante sete dias de viagem e o alcançou na região montanhosa de Gileade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus irmãos”; o termo hebraico pode designar irmãos em sentido estrito ou, mais amplamente, parentes e membros do clã.
    reason: lexical_alternative
  - marker: b
    text: Ou “no monte Gileade”; o hebraico pode referir-se a um monte específico ou à região montanhosa de Gileade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: os seus parentes
  rationale: Embora אָח possa significar mais especificamente “irmão”, neste contexto designa naturalmente os membros do clã que Labão reuniu; “parentes” evita restringir o grupo a irmãos biológicos.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: perseguiu Jacó
  rationale: Em português atual, “perseguiu” já incorpora a ideia expressa pela construção hebraica רדף אחרי; explicitar “Jacó” torna clara a referência do pronome sem alterar o sentido.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: por uma distância de sete dias de viagem
  rationale: דֶּרֶךְ indica aqui a extensão do percurso. A formulação preserva a noção de distância medida em dias de viagem, em vez de sugerir apenas a duração cronológica da perseguição.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: o alcançou
  rationale: Neste contexto de perseguição, דבק descreve chegar até a pessoa perseguida. “Alcançou” é natural, claro e não exige que Labão tenha ultrapassado Jacó.
- source_word: בְּהַר הַגִּלְעָד
  choice: na região montanhosa de Gileade
  rationale: הַר pode designar um monte específico ou uma zona montanhosa; o contexto geográfico favorece a leitura regional, sem eliminar a alternativa lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação hebraica foi suavizada para uma narrativa natural. O nome “Jacó” explicita o referente masculino potencialmente ambíguo em português. A expressão relativa à viagem conserva a ideia antiga de distância medida pelo número de dias necessários para percorrê-la.
