  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: pt
  text: Que o Deus de Abraão e o deus de Naor[a], o deus do pai deles[c], julguem entre nós. E Jacó jurou pelo Temor de seu pai Isaque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o Deus de Abraão e o Deus de Naor, o Deus do pai deles, julgue entre nós”. O hebraico pode ser entendido como referência à mesma divindade em toda a frase; a tradução principal preserva a ambiguidade.'
    reason: alternative_reading
  - marker: b
    text: “O Temor de seu pai Isaque” é um título incomum para Deus; literalmente, o texto emprega o substantivo “temor” ou “pavor” como designação divina.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, tomando a expressão como um comentário parentético: “— o deus do pai deles —”.'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: o Deus de Abraão
  rationale: Embora אֱלֹהֵי tenha forma morfológica plural, com Abraão como referência pessoal funciona idiomaticamente como “Deus de”. A inicial maiúscula indica o Deus associado a Abraão.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: e o deus de Naor
  rationale: A inicial minúscula evita identificar de antemão o deus de Naor, na fala de Labão, com a confissão pactual de Jacó, preservando a tensão do texto.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: o deus do pai deles
  rationale: A expressão pode ser apositiva ou explicativa em relação à invocação anterior. A inicial minúscula mantém aberta a questão de se tratar de uma única divindade ancestral ou de uma formulação religiosa familiar mais ampla.
- source_word: יִשְׁפְּטוּ
  choice: julguem
  rationale: 'O imperfeito na invocação tem força volitiva: “que ... julguem”. O plural hebraico é reproduzido naturalmente em português porque o sujeito é composto.'
- source_word: בֵינֵינוּ
  choice: entre nós
  rationale: Tradução direta e idiomática da expressão recíproca no contexto da aliança.
- source_word: וַיִּשָּׁבַע
  choice: E ... jurou
  rationale: O waw consecutivo narrativo é vertido pelo passado simples, com ligação coordenativa natural.
- source_word: בְּפַחַד
  choice: pelo Temor de
  rationale: פַּחַד significa literalmente “temor” ou “pavor”, mas aqui funciona como designação divina na fórmula de juramento. A maiúscula conserva o título incomum sem explicá-lo por paráfrase.
- source_word: אָבִיו יִצְחָק
  choice: seu pai Isaque
  rationale: A aposição identifica o pai de Jacó e é expressa de modo natural em português.
theological_decisions:
- issue: Se as divindades invocadas por Labão devem ser identificadas uniformemente como o mesmo Deus
  choice: Empregar “o Deus de Abraão”, mas “o deus de Naor, o deus do pai deles”
  alternative: 'Empregar maiúscula em todas as ocorrências: “o Deus de Abraão e o Deus de Naor, o Deus do pai deles”'
  rationale: O hebraico repete אֱלֹהֵי, usa verbo no plural e apresenta uma invocação familiar mais ampla na fala de Labão, enquanto Jacó jura especificamente pelo “Temor de seu pai Isaque”. A diferença de capitalização preserva essa tensão sem impor uma identificação inequívoca.
- issue: Como traduzir a fórmula de juramento בְּפַחַד אָבִיו יִצְחָק
  choice: pelo Temor de seu pai Isaque
  alternative: pelo Deus a quem seu pai Isaque temia
  rationale: O hebraico emprega o substantivo incomum פַּחַד como título divino. Manter “Temor” conserva a formulação distintiva e evita uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a capitalização contrastante para sinalizar, sem resolver, a ambiguidade religiosa da fala de Labão; “Temor” foi mantido como título deliberadamente incomum.
