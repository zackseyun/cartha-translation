base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: pt
  text: Nestes vinte anos em que estive com você, suas ovelhas e suas cabras não perderam suas crias[a], e eu não comi os carneiros do seu rebanho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não abortaram”. O verbo hebraico pode indicar a perda das crias; neste contexto pastoril, pode se referir a aborto ou à perda dos filhotes.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Nestes vinte anos
  rationale: Expressa de modo natural em português a duração destacada pelo demonstrativo hebraico.
- source_word: אָנֹכִי עִמָּךְ
  choice: em que estive com você
  rationale: A cláusula nominal hebraica resume o período de vinte anos passado junto de Labão; o pretérito perfeito soa natural no discurso retrospectivo.
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: suas ovelhas e suas cabras
  rationale: No contexto reprodutivo, os termos hebraicos designam especificamente as fêmeas; em português, os nomes comuns 'ovelhas' e 'cabras' já comunicam isso com naturalidade.
- source_word: לֹא שִׁכֵּלוּ
  choice: não perderam suas crias
  rationale: Preserva a amplitude do verbo hebraico, que pode indicar aborto ou perda dos filhotes, sem restringi-lo indevidamente a um único momento da gestação.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: os carneiros do seu rebanho
  rationale: Mantém a especificidade de אֵילִים como carneiros adultos e a relação com o rebanho de Labão.
- source_word: לֹא אָכָלְתִּי
  choice: eu não comi
  rationale: O pretérito perfeito português apresenta com clareza a conduta de Jacó durante o período já resumido.
