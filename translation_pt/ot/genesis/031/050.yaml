  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: pt
  text: 'Se você maltratar minhas filhas ou tomar outras mulheres por esposas além de minhas filhas — embora não haja nenhum homem conosco[a] —, veja: Deus é testemunha entre mim e você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há ninguém conosco”; isto é, nenhuma testemunha humana está presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: maltratar
  rationale: O piel de ענה, neste contexto matrimonial, indica causar sofrimento ou tratar de modo cruel. “Maltratar” é natural, claro e evita sentidos inadequados de “humilhar”.
- source_word: בְּנֹתַי
  choice: minhas filhas / delas
  rationale: O possessivo plural é traduzido diretamente na primeira ocorrência; na segunda, o pronome “delas” evita repetição pesada sem perder o referente.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: tomar outras mulheres por esposas além delas
  rationale: A expressão significa acrescentar esposas às filhas de Labão, não substituí-las. “Por esposas” explicita em português o sentido matrimonial de נָשִׁים neste contexto.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: embora não haja nenhum homem conosco
  rationale: 'Mantém a referência masculina explícita de אִישׁ e expressa a força concessiva contextual: mesmo sem testemunha humana presente, Deus testemunha o compromisso.'
- source_word: רְאֵה
  choice: veja
  rationale: Preserva a forma imperativa e a solenidade do apelo direto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No contexto da aliança, o termo designa a divindade singular invocada como testemunha.
- source_word: עֵד
  choice: testemunha
  rationale: Conserva a fórmula jurídica e pactual em que Deus é apresentado como testemunha entre as partes.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Tradução direta da relação de responsabilidade entre Labão e Jacó, em português corrente.
theological_decisions:
- issue: Sentido de אִישׁ na declaração sobre a ausência de testemunhas
  choice: nenhum homem conosco
  alternative: ninguém conosco
  rationale: A tradução mantém o valor lexical masculino de אִישׁ, enquanto a nota esclarece que o ponto contextual é a ausência de uma testemunha humana.
- issue: Relação lógica de אֵין אִישׁ עִמָּנוּ com o apelo a Deus
  choice: embora não haja nenhum homem conosco
  alternative: não há nenhum homem conosco
  rationale: 'A construção concessiva torna explícita a relação contextual provável, sem alterar o conteúdo: não existe testemunha humana presente, mas Deus é invocado como testemunha.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação “tomar outras mulheres por esposas” preserva o contexto antigo sem recorrer a linguagem excessivamente arcaica; “veja” mantém a solenidade direta do hebraico.
