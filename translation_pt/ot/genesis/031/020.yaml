  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: pt
  text: Jacó enganou Labão, o arameu, não lhe contando que estava fugindo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Jacó roubou o coração de Labão, o arameu”, expressão idiomática hebraica que significa que ele o enganou ou o pegou de surpresa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: enganou
  rationale: A expressão hebraica literalmente diz “roubou o coração”, mas aqui é uma expressão idiomática para agir às escondidas, enganando alguém ou pegando-o de surpresa. “Enganou” comunica o sentido sem sugerir afeto romântico.
- source_word: הָאֲרַמִּי
  choice: o arameu
  rationale: Reproduz diretamente a designação étnico-geográfica hebraica e é mais precisa que a forma tradicional “o sírio”.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: não lhe contando
  rationale: Expressa de modo natural o meio pelo qual Jacó enganou Labão, preservando a força circunstancial/instrumental da construção.
- source_word: כִּי בֹרֵחַ הוּא
  choice: que estava fugindo
  rationale: O particípio hebraico apresenta a fuga como ação em curso ou circunstância imediata; “estava fugindo” preserva esse aspecto.
