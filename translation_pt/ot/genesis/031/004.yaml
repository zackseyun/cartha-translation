lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou
  rationale: O verbo שׁלח indica que Jacó enviou alguém; combinado com וַיִּקְרָא, a expressão portuguesa natural é “mandou chamar”.
- source_word: וַיִּקְרָא
  choice: chamar
  rationale: קרא com לְ diante das pessoas significa chamá-las ou convocá-las; “chamar” mantém o estilo narrativo simples.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: Raquel e Lia
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: הַשָּׂדֶה
  choice: ao campo
  rationale: שׂדה designa campo ou área aberta; a forma direcional הַשָּׂדֶה é expressa naturalmente por “ao campo”.
- source_word: אֶל צֹאנוֹ
  choice: onde estava o seu rebanho
  rationale: A frase especifica mais provavelmente o lugar no campo para o qual elas foram chamadas. A tradução torna essa relação locativa clara sem sugerir que o rebanho foi chamado.
