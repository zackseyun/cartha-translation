  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: pt
  text: Então Jacó mandou chamar Raquel e Lia ao campo, onde estava o seu rebanho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao campo, junto ao seu rebanho”; literalmente, “ao campo, ao seu rebanho”.'
