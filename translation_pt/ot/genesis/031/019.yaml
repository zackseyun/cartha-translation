source:
  edition: WLC
  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: pt
  text: Labão tinha ido tosquiar o seu rebanho, e Raquel roubou os ídolos domésticos[a] que pertenciam ao pai dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: terafins; também traduzido como “deuses domésticos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: tinha ido
  rationale: 'O qatal fornece a circunstância anterior à ação principal: Labão já estava ausente quando Raquel agiu. O mais-que-perfeito composto expressa isso com naturalidade em português moderno.'
- source_word: לִגְזֹז
  choice: tosquiar
  rationale: O infinitivo se refere especificamente à retirada da lã dos animais do rebanho; “tosquiar” é o termo português preciso e corrente.
- source_word: צֹאנוֹ
  choice: o seu rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” é natural e mantém essa abrangência.
- source_word: וַתִּגְנֹב
  choice: roubou
  rationale: O verbo גנב significa diretamente “roubar”; a tradução preserva o sentido moral e jurídico, sem suavizá-lo.
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: תְּרָפִים designa objetos de culto ligados à casa ou à família. “Ídolos domésticos” comunica de modo claro tanto o contexto doméstico quanto a função religiosa.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: que pertenciam ao pai dela
  rationale: A expressão indica posse. “Ao pai dela” evita uma possível ambiguidade do possessivo português “seu”.
- source_word: וְ
  choice: e
  rationale: A conjunção hebraica conecta a informação de fundo à ação seguinte. A coordenação com “e” reflete essa ligação sem acrescentar um marcador temporal inexistente.
theological_decisions:
- issue: Tradução de תְּרָפִים no contexto de objetos de culto doméstico
  choice: ídolos domésticos
  alternative: terafins; deuses domésticos
  rationale: O termo hebraico se refere a imagens ou objetos cultuais da casa. “Ídolos domésticos” torna clara sua natureza religiosa sem adotar uma interpretação denominacional; as alternativas lexicais são registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O mais-que-perfeito composto é preferido ao simples por ser mais corrente; “ao pai dela” esclarece a referência sem alterar o sentido.
