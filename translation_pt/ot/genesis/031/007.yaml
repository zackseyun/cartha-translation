  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: pt
  text: Mas o pai de vocês me enganou[a] e mudou o meu salário dez vezes[b]; Deus, porém, não permitiu que ele me fizesse mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “zombou de mim” ou “me tratou com falsidade”. O verbo hebraico pode descrever tratamento enganoso ou zombeteiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dez vezes”. A expressão pode indicar mudanças repetidas, sem necessariamente representar uma contagem exata.'
    reason: cultural_note
  - marker: c
    text: 'Literalmente: “Deus não lhe deu fazer mal a mim”, isto é, Deus não permitiu que ele me causasse dano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: enganou
  rationale: No hifil, o verbo pode indicar tratamento enganoso ou zombeteiro. No contexto da alteração reiterada do salário, “enganou” expressa com naturalidade a conduta desonesta de Labão, sem excluir a ideia de que Jacó foi tratado com desprezo.
- source_word: וְהֶחֱלִיף
  choice: mudou
  rationale: O hifil de חלף descreve aqui a alteração da remuneração previamente combinada; “mudou” é claro e corrente em português.
- source_word: מַשְׂכֻּרְתִּי
  choice: o meu salário
  rationale: O substantivo designa remuneração por trabalho. “Salário” é a forma moderna mais direta no contexto da relação de trabalho entre Jacó e Labão.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: dez vezes
  rationale: Reproduz a expressão hebraica tradicional, que pode funcionar como modo idiomático de indicar repetição, sem exigir uma contagem rigorosamente exata.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: Deus, porém, não permitiu que ele
  rationale: A formulação hebraica, literalmente “Deus não lhe deu”, comunica que Deus não concedeu a Labão ocasião ou permissão para concretizar o dano. A tradução explicita o sentido do idioma.
- source_word: לְהָרַע עִמָּדִי
  choice: me fizesse mal
  rationale: O infinitivo de רעע com עִם significa agir mal contra alguém ou causar-lhe dano. “Fazer mal” é natural, digno e fiel ao sentido.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: No discurso de Jacó, אֱלֹהִים se refere a Deus e recebe adequadamente a forma “Deus”.
theological_decisions:
- issue: A restrição divina expressa pelo idioma “Deus não lhe deu”
  choice: Deus não permitiu que Labão fizesse mal a Jacó
  alternative: Deus não entregou Jacó nas mãos de Labão; ou Deus não deixou Labão ter êxito em prejudicá-lo
  rationale: “Não permitiu” preserva a apresentação de Deus como aquele que restringiu a ação de Labão, sem especificar além do texto o modo dessa intervenção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada no último segmento para soar natural, preservando o contraste marcado por וְ. Todos os marcadores aparecem no texto junto às expressões que explicam.
