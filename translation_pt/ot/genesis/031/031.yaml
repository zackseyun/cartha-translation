  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: pt
  text: 'Então Jacó respondeu a Labão: “Eu estava com medo, pois pensei: ‘Você poderia arrancar de mim as suas filhas.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: Em português, “respondeu” introduz naturalmente a fala e representa a fórmula hebraica sem a redundância pouco idiomática “respondeu e disse”.
- source_word: כִּי יָרֵאתִי
  choice: Eu tive medo
  rationale: O primeiro כִּי introduz a razão da partida secreta; em português, a resposta fica natural sem reproduzir mecanicamente “porque” no início.
- source_word: כִּי אָמַרְתִּי
  choice: pois pensei
  rationale: Embora אָמַרְתִּי signifique literalmente “disse”, aqui descreve a deliberação interior de Jacó. “Pensei” torna explícito esse uso contextual sem alterar o sentido.
- source_word: פֶּן
  choice: Você poderia
  rationale: Expressa a possibilidade temida introduzida por פֶּן de modo atual e natural, evitando o mais elevado “para que não” ou uma construção truncada.
- source_word: תִּגְזֹל
  choice: tomar à força
  rationale: Preserva a ideia forte de apreender ou arrancar injustamente, própria de גזל, sem tratar as filhas como simples objetos furtados.
- source_word: אֶת בְּנוֹתֶיךָ מֵעִמִּי
  choice: as suas filhas e tirá-las de mim
  rationale: A formulação comunica claramente a separação da companhia de Jacó e evita a combinação pouco natural “tomar de mim as suas filhas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula narrativa hebraica foi condensada idiomaticamente, enquanto a força coerciva de גזל foi mantida no texto principal.
