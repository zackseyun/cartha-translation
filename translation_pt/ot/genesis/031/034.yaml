base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: pt
  text: Raquel havia pegado os ídolos domésticos[a], colocado-os na almofada da sela do camelo[b] e sentara-se sobre eles. Labão apalpou toda a tenda, mas não os encontrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os terafins” ou “os deuses domésticos”. O termo hebraico se refere a objetos de culto ligados à casa.
    reason: lexical_alternative
  - marker: b
    text: Ou “na sela do camelo” ou “no equipamento acolchoado da sela do camelo”. O hebraico provavelmente designa uma parte acolchoada do equipamento de montaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: os ídolos domésticos
  rationale: O termo תְּרָפִים designa objetos de culto ou divindades ligados à casa. “Ídolos domésticos” comunica o referente provável em português claro, sem recorrer apenas à transliteração pouco conhecida.
- source_word: בְּכַר הַגָּמָל
  choice: na almofada da sela do camelo
  rationale: כַּר indica uma almofada ou peça acolchoada; neste contexto, provavelmente uma parte acolchoada do equipamento de montaria do camelo.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: e se sentado sobre eles
  rationale: Em combinação com “havia pegado”, a sequência é apresentada como ação anterior à busca de Labão. “Sentado sobre eles” preserva o meio físico usado para ocultar os objetos.
- source_word: וַיְמַשֵּׁשׁ
  choice: apalpou
  rationale: מששׁ descreve uma procura feita pelo tato. “Apalpou” preserva essa nuance, mais específica que o genérico “procurou”.
- source_word: כָּל הָאֹהֶל
  choice: toda a tenda
  rationale: Tradução idiomática e direta da construção definida com כָּל.
- source_word: וְלֹא מָצָא
  choice: mas não os encontrou
  rationale: O objeto está implícito no hebraico e é explicitado em português como referência aos ídolos; “mas” expressa naturalmente o contraste narrativo.
