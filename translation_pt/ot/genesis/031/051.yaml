base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: pt
  text: 'Então Labão disse a Jacó: “Veja este monte de pedras[a] e veja a coluna[b] que ergui entre mim e você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta pilha de pedras”. O termo hebraico designa aqui as pedras amontoadas como testemunho entre Labão e Jacó.
    reason: lexical_alternative
  - marker: b
    text: Ou “a pedra erguida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: A forma narrativa faz a ação avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: Veja ... e veja
  rationale: A repetição preserva o paralelismo enfático e chama a atenção de Jacó para os dois marcos visíveis.
- source_word: הַגַּל הַזֶּה
  choice: este monte de pedras
  rationale: גַּל designa aqui o amontoado de pedras levantado como testemunho. A explicitação “de pedras” comunica o referente com clareza no contexto.
- source_word: הַמַּצֵּבָה
  choice: a coluna
  rationale: מַצֵּבָה é uma pedra erguida verticalmente como marco; “coluna” é conciso, corrente e digno.
- source_word: יָרִיתִי
  choice: ergui
  rationale: No contexto da coluna de pedra, o verbo indica sua colocação ou ereção. “Ergui” conserva a ação concreta sem recorrer ao literalismo obscuro “lancei”.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre mim e você
  rationale: Reproduz com naturalidade a relação espacial e pactuai expressa no hebraico.
