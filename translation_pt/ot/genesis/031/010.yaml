  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: pt
  text: E aconteceu que, na época em que o rebanho entrava no cio, levantei os olhos e vi em sonho, e eis que os bodes que cobriam as fêmeas do rebanho eram listrados[a], salpicados e malhados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com marcas em faixas». O termo hebraico descreve animais cuja pelagem apresentava faixas ou listras.
    reason: lexical_alternative
  - marker: b
    text: Ou «mosqueados». Os três termos hebraicos provavelmente descrevem padrões distintos de pelagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva o encadeamento narrativo do hebraico sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בְּעֵת יַחֵם הַצֹּאן
  choice: na época em que o rebanho estava acasalando
  rationale: Exprime de modo claro o período de cio e reprodução indicado por יחם, sem confundi-lo com a concepção já consumada.
- source_word: וָאֶשָּׂא עֵינַי
  choice: levantei os olhos
  rationale: Mantém a imagem do idioma hebraico em português natural e compreensível.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: vi em sonho
  rationale: Indica o sonho como meio da percepção, sem impor uma definitude ausente em português.
- source_word: וְהִנֵּה
  choice: que
  rationale: A construção visual foi integrada naturalmente à oração em português; a surpresa e vividez permanecem no relato do que apareceu no sonho.
- source_word: הָעַתֻּדִים
  choice: os bodes
  rationale: Designa de maneira corrente e específica os caprinos machos usados para reprodução.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: que cobriam as fêmeas do rebanho
  rationale: «Cobrir» é um termo português corrente para a monta animal; «as fêmeas» explicita o referente coletivo exigido pelo contexto sem alterar a ação.
- source_word: עֲקֻדִּים
  choice: listrados
  rationale: Comunica de modo acessível as marcas em faixas ou listras; a alternativa mais literal é registrada em nota.
- source_word: נְקֻדִּים
  choice: salpicados
  rationale: Expressa pequenas manchas ou pintas e mantém distinção em relação ao termo seguinte.
- source_word: וּבְרֻדִּים
  choice: malhados
  rationale: Indica coloração variegada ou irregular e preserva, tanto quanto possível, a distinção entre os três padrões de pelagem.
