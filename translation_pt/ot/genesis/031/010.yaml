  to: E aconteceu que, na época em que o rebanho entrava no cio, levantei os olhos e vi em sonho, e eis que os bodes que cobriam as fêmeas do rebanho eram listrados[a], salpicados e malhados[b].
  rationale: A revisão restaura a força apresentativa de וְהִנֵּה com «e eis que» e ajusta a expressão de יחם para «entrava no cio». O restante foi preservado, inclusive os termos para os padrões de pelagem e as respectivas notas.
