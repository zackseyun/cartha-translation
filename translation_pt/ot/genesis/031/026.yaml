translation_notes:
  register: Português contemporâneo, claro e digno, com “você” para a fala direta. A pontuação divide a pergunta inicial da acusação seguinte, refletindo com naturalidade a força do discurso hebraico. Expressões hebraicas potencialmente enganosas em tradução literal foram vertidas pelo sentido no texto e preservadas nas notas.
