base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: pt
  text: 'Então Labão disse a Jacó: “O que você fez? Você me enganou[a] e levou minhas filhas embora como prisioneiras de guerra[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “roubou meu coração”; aqui, a expressão significa agir às escondidas ou enganar.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “como cativas da espada”, isto é, como mulheres capturadas em guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: O que você fez?
  rationale: Interrogação acusatória direta e natural em português, referente a uma ação já concluída.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Você me enganou
  rationale: O hebraico diz literalmente “roubou meu coração”, mas, neste contexto, a expressão indica agir às escondidas ou enganar. Em português, “roubar o coração” sugere sobretudo conquista amorosa e poderia distorcer a acusação de Labão; a imagem literal é preservada em nota.
- source_word: לְבָבִי
  choice: me
  rationale: O sufixo de primeira pessoa é incorporado ao equivalente idiomático “me enganou”; o substantivo “coração” aparece na nota com a tradução literal da expressão.
- source_word: וַתְּנַהֵג
  choice: levou ... embora
  rationale: Expressa de modo natural o ato de conduzir para longe. A comparação seguinte fornece o tom coercivo, sem exigir o menos idiomático “tocou” ou “conduziu à força”.
- source_word: בְּנֹתַי
  choice: minhas filhas
  rationale: Tradução direta do substantivo plural com sufixo possessivo, preservando a reivindicação familiar de Labão.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: como prisioneiras de guerra
  rationale: Comunica claramente o sentido da expressão hebraica, isto é, mulheres capturadas em guerra, enquanto a formulação literal “cativas da espada” é registrada em nota.
