  text: וַ/יָּ֖קָם יַעֲקֹ֑ב וַ/יִּשָּׂ֛א אֶת בָּנָ֥י/ו וְ/אֶת נָשָׁ֖י/ו עַל הַ/גְּמַלִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: pt
  text: Então Jacó se levantou e colocou seus filhos e suas esposas sobre os camelos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos camelos”. A preposição hebraica pode indicar tanto posição quanto movimento para uma posição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O verbo קום no wayyiqtol dá sequência à narrativa e indica que Jacó se levantou para agir; a formulação é natural no português atual.
- source_word: וַיִּשָּׂא
  choice: pôs
  rationale: Embora נשׂא possa significar literalmente “erguer” ou “carregar”, com עַל הַגְּמַלִּים expressa aqui a ação de colocar pessoas sobre os camelos.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O masculino plural בנים é mantido com precisão, sem ampliá-lo para “crianças”.
- source_word: נָשָׁיו
  choice: suas mulheres
  rationale: O plural de אִשָּׁה com Jacó como possuidor designa suas esposas; “suas mulheres” é uma forma bíblica natural e clara em português, preservando a distinção lexical em relação a termos jurídicos modernos.
- source_word: עַל הַגְּמַלִּים
  choice: sobre os camelos
  rationale: A preposição עַל indica posição ou movimento para cima de algo neste contexto; “sobre” preserva essa amplitude, enquanto o verbo “pôs” comunica o movimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve cadência narrativa bíblica. “Então” marca a progressão do wayyiqtol; “se levantou” evita o arcaísmo de “levantou-se” sem perder solenidade. O marcador [a] aparece no texto principal.
