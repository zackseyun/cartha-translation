revisions:
- from: Já que você apalpou todos os meus pertences, o que encontrou que pertença à sua casa? Coloque-o aqui, diante dos meus irmãos e dos seus irmãos, e que eles julguem entre nós dois.
  to: Já que você revistou todos os meus bens, o que encontrou dentre todos os bens da sua casa? Coloque-o aqui, diante dos meus irmãos e dos seus irmãos, e que eles julguem entre nós dois.
