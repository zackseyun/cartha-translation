  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: pt
  text: Já que você revistou todos os meus bens, o que encontrou dentre todos os bens da sua casa? Coloque-o aqui, diante dos meus irmãos e dos seus irmãos, e que eles julguem entre nós dois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: apalpou
  rationale: O verbo descreve literalmente procurar pelo tato. “Apalpou” preserva a concretude da busca minuciosa de Labão sem excluir o sentido contextual de revista.
- source_word: כָּל כֵּלַי
  choice: todos os meus pertences
  rationale: כְּלִי abrange objetos e bens móveis; “pertences” é natural, amplo e adequado ao contexto doméstico.
- source_word: מַה מָּצָאתָ מִכֹּל כְּלֵי בֵיתֶךָ
  choice: o que encontrou que pertença à sua casa?
  rationale: 'A formulação comunica naturalmente o valor partitivo de מִן: Jacob pergunta qual objeto pertencente à casa de Labão foi encontrado entre seus bens.'
- source_word: שִׂים כֹּה
  choice: Coloque-o aqui
  rationale: O imperativo exige que qualquer objeto supostamente encontrado seja apresentado publicamente; o pronome retoma de modo natural o que quer que tenha sido encontrado.
- source_word: נֶגֶד
  choice: diante de
  rationale: Expressa apresentação à vista e na presença das testemunhas.
- source_word: אַחַי וְאַחֶיךָ
  choice: meus irmãos e seus irmãos
  rationale: Mantém o termo familiar do hebraico, que no contexto também pode abranger parentes ou membros dos respectivos grupos familiares.
- source_word: וְיוֹכִיחוּ
  choice: que eles julguem
  rationale: O hifil de יכח tem aqui sentido forense de decidir ou arbitrar uma controvérsia; “julguem” conserva esse teor sem resolver além do texto.
- source_word: בֵּין שְׁנֵינוּ
  choice: entre nós dois
  rationale: Preserva a referência explícita às duas partes da disputa.
