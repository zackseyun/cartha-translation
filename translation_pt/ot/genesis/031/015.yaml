  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: pt
  text: Não somos consideradas por ele estrangeiras? Pois ele nos vendeu e consumiu por completo o nosso dinheiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devorou inteiramente a nossa prata”. O hebraico emprega uma expressão de “comer”, reforçada por um infinitivo absoluto, para indicar consumo total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Não somos... ?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; esta construção é natural em português e preserva sua força.
- source_word: נָכְרִיּוֹת
  choice: estrangeiras
  rationale: O termo feminino indica pessoas tratadas como alheias à família; “estrangeiras” preserva tanto o gênero quanto a queixa das filhas.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: somos consideradas por ele
  rationale: Mantém o sentido passivo do nifal de חשב e expressa de modo claro a avaliação feita pelo pai.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a pergunta retórica.
- source_word: מְכָרָנוּ
  choice: ele nos vendeu
  rationale: Traduz diretamente a ação concluída e conserva a contundência da acusação.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: e consumiu por completo
  rationale: A forma finita acompanhada do infinitivo absoluto intensifica a ação; “por completo” comunica essa ênfase, enquanto “consumiu” preserva de modo natural a imagem aplicada ao dinheiro.
- source_word: אֶת כַּסְפֵּנוּ
  choice: o nosso dinheiro
  rationale: כֶּסֶף pode significar prata ou dinheiro; o contexto econômico favorece “dinheiro”, sem excluir a alternativa literal indicada em nota.
