source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: pt
  text: Assim, Deus tirou os rebanhos do pai de vocês e os deu a mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrancou” ou “livrou”. O verbo hebraico pode expressar a retirada de algo do poder de uma parte e sua transferência para outra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: tirou
  rationale: O hifil de נצל pode significar arrancar, livrar ou retirar de alguém. Neste contexto, descreve a retirada dos animais de Labão e sua transferência para Jacó; “tirou” preserva esse movimento sem sugerir necessariamente resgate de perigo ou ação abrupta.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a designação comum de Deus e aqui identifica diretamente o agente da transferência.
- source_word: מִקְנֵה
  choice: rebanhos
  rationale: O substantivo designa bens adquiridos, especialmente animais domésticos. No contexto pastoril imediato, “rebanhos” é natural, concreto e inclui os animais de Labão sem restringi-los a gado bovino.
- source_word: אֲבִיכֶם
  choice: do pai de vocês
  rationale: 'O substantivo é singular, com sufixo de segunda pessoa do plural: Jacó fala a Raquel e Lia acerca do pai comum delas, Labão.'
- source_word: וַיִּתֶּן לִי
  choice: os deu a mim
  rationale: נתן expressa a transferência para Jacó. O pronome plural retoma naturalmente “rebanhos” em português, embora o hebraico deixe o objeto recuperável do contexto.
theological_decisions:
- issue: Agência divina na prosperidade de Jacó
  choice: Atribuir diretamente a Deus a retirada dos rebanhos de Labão e sua entrega a Jacó.
  alternative: Suavizar a declaração como mera bênção providencial, sem linguagem de transferência.
  rationale: Os verbos וַיַּצֵּל e וַיִּתֶּן atribuem explicitamente a Deus tanto a retirada quanto a entrega; a tradução mantém essa forte agência divina sem acrescentar uma avaliação moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Do pai de vocês” comunica sem ambiguidade o singular hebraico dirigido a duas mulheres; “rebanhos” evita o sentido excessivamente amplo de “bens” e o sentido estreito de “gado”.
