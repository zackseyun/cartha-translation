base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: pt
  text: 'E Jacó chamou o lugar de Peniel[a], pois: “Vi Deus[b] face a face, e minha vida foi poupada[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Peniel soa como “face de Deus”, em correspondência com a explicação de Jacó: “Vi Deus face a face”.'
    reason: cultural_note
  - marker: b
    text: “Deus” também pode ser entendido, em sentido mais amplo, como “um ser divino”, mas o contexto favorece “Deus”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “minha alma foi livrada”; aqui, “alma” significa a vida ou a própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב שֵׁם הַמָּקוֹם
  choice: Jacó chamou aquele lugar de
  rationale: Em português atual, esta construção comunica naturalmente o ato de dar nome ao lugar, sem reproduzir de modo artificial o hebraísmo literal “chamou o nome do lugar”.
- source_word: פְּנִיאֵל
  choice: Peniel
  rationale: A transliteração acompanha a forma hebraica deste versículo e preserva o jogo de palavras com “face” e “Deus”.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira natural a explicação causal dada por Jacó para o nome do lugar.
- source_word: רָאִיתִי אֱלֹהִים
  choice: Vi Deus
  rationale: O contexto favorece “Deus”; o pretérito perfeito é a forma idiomática em português para relatar a experiência concluída.
- source_word: פָּנִים אֶל פָּנִים
  choice: face a face
  rationale: É a expressão portuguesa consagrada para um encontro direto e mantém o vínculo verbal com Peniel.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: a minha vida foi poupada
  rationale: נֶפֶשׁ designa aqui a vida ou a própria pessoa de Jacó, e o passivo de נצל indica que ele sobreviveu ou foi preservado do perigo.
theological_decisions:
- issue: Sentido de אֱלֹהִים na declaração de Jacó
  choice: Deus
  alternative: um ser divino
  rationale: A explicação do nome Peniel e o contexto imediato favorecem uma referência direta a Deus, embora a amplitude lexical de אֱלֹהִים seja registrada em nota.
- issue: Sobrevivência após ver Deus face a face
  choice: a minha vida foi poupada
  alternative: a minha alma foi livrada
  rationale: A tradução conserva a tensão narrativa de Jacó afirmar que viu Deus diretamente e, mesmo assim, sobreviveu, sem explicar ou harmonizar essa afirmação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A fórmula hebraica de nomeação foi levemente naturalizada. A inserção “disse” explicita a mudança para a fala direta, mas não acrescenta conteúdo interpretativo à declaração.
