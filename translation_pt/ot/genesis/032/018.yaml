  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: pt
  text: 'E ordenou ao primeiro: “Quando meu irmão Esaú encontrar você e lhe perguntar: ‘De quem você é? Para onde vai? E de quem são estes à sua frente?’...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: o primeiro
  rationale: Refere-se ao primeiro dos servos ou grupos enviados à frente; mantém a formulação concisa e a referência contextual do hebraico.
- source_word: כִּי יִפְגָּשְׁךָ
  choice: Quando ... encontrar você
  rationale: Neste contexto, כִּי introduz a situação prevista, com sentido temporal; a forma mantém naturalidade em português.
- source_word: לְמִי אַתָּה
  choice: De quem você é?
  rationale: Preserva a pergunta hebraica sobre pertencimento ou serviço sem explicitar mais do que o texto diz.
- source_word: וְאָנָה תֵלֵךְ
  choice: Para onde vai?
  rationale: Tradução direta e corrente da pergunta acerca do destino.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: E de quem são estes que vão à sua frente?
  rationale: Torna explícito, de modo natural, o movimento inferido pelo contexto, preservando a pergunta sobre a propriedade dos animais ou grupos adiante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição hebraica de לֵאמֹר após ‘perguntar’ não foi reproduzida, por ser redundante em português. As reticências preservam o caráter sintaticamente incompleto do versículo, cuja instrução continua no versículo seguinte.
