base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: pt
  text: Naquela noite, ele se levantou, tomou suas duas esposas, suas duas servas[a] e seus onze filhos, e atravessou o vau do Jaboque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas duas escravas”. O hebraico שִׁפְחֹתָיו se refere a mulheres de condição subordinada dentro da casa e pode indicar mulheres escravizadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ele se levantou
  rationale: O qal narrativo de קום indica levantar-se; a formulação é natural e mantém o movimento da narrativa.
- source_word: בַּלַּיְלָה הוּא
  choice: Naquela noite
  rationale: Reproduz de modo idiomático o valor temporal e a ênfase contextual da expressão hebraica.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: לקח significa tomar; o contexto sugere que Jacó reuniu e conduziu sua família, sem exigir que isso seja explicitado.
- source_word: שְׁתֵּי נָשָׁיו
  choice: suas duas esposas
  rationale: Neste contexto, נָשִׁים designa especificamente as esposas de Jacó.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: suas duas servas
  rationale: שִׁפְחָה designa uma mulher de condição doméstica subordinada, possivelmente escravizada. “Servas” é claro e digno no texto principal; a alternativa socialmente mais explícita fica preservada em nota.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: seus onze filhos
  rationale: יְלָדִים significa filhos ou descendentes. Em português, “filhos” é a forma natural para os filhos de uma pessoa e não força a redação pouco idiomática “onze crianças”; a tradução não acrescenta “homens” ou “rapazes”.
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: Neste contexto de deslocamento, עבר significa atravessar ou passar para o outro lado.
- source_word: מַעֲבַר יַבֹּק
  choice: o vau do Jaboque
  rationale: מַעֲבַר é um lugar de travessia, especialmente um vau; “Jaboque” é a forma portuguesa corrente do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Vau” preserva a precisão geográfica do hebraico; “servas” evita arcaísmo, enquanto a nota registra explicitamente a possível condição de escravidão.
