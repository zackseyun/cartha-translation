base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: pt
  text: Labão levantou-se cedo pela manhã, beijou seus filhos e suas filhas[a] e os abençoou. Depois, Labão partiu e voltou para o seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus filhos e suas filhas”. Pelo contexto, a expressão provavelmente se refere aos descendentes de Labão, isto é, a seus netos e suas netas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: levantou-se de madrugada
  rationale: A combinação do verbo שׁכם, que indica levantar-se ou começar cedo, com בַּבֹּקֶר é expressa de modo natural e conciso em português, preservando a ênfase temporal.
- source_word: וַיְנַשֵּׁק
  choice: beijou
  rationale: O verbo descreve diretamente o beijo familiar de despedida; “beijou” é claro e suficiente.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: seus filhos e suas filhas
  rationale: Mantém os dois termos de parentesco específicos do hebraico, sem substituí-los no texto principal por “filhos” em sentido coletivo nem por “netos”.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: e os abençoou
  rationale: Preserva o sentido direto de ברך. O contexto sugere uma bênção de despedida, mas não exige explicitar isso.
- source_word: וַיֵּלֶךְ
  choice: partiu
  rationale: Distingue naturalmente este primeiro verbo de movimento do verbo seguinte, “voltou”, e conserva a sequência narrativa.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: Expressa o sentido usual de שׁוב, retornar ao ponto de origem.
- source_word: לִמְקֹמוֹ
  choice: para o seu lugar
  rationale: Segue de perto o hebraico מָקוֹם e evita especificar “casa” ou “terra”, ideias possíveis no contexto, mas não expressas pelo termo.
theological_decisions:
- issue: Termos de parentesco específicos quanto ao gênero e à geração
  choice: seus filhos e suas filhas
  alternative: seus filhos; seus netos e suas netas; seus descendentes
  rationale: O hebraico emprega explicitamente os termos masculino e feminino. A tradução os preserva, enquanto a nota informa que, pelo contexto, a expressão provavelmente inclui os descendentes de Labão, especialmente seus netos, sem eliminar a forma ou a amplitude do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De madrugada” comunica de modo idiomático que Labão se levantou bem cedo; “para o seu lugar” conserva a formulação deliberadamente geral do hebraico.
