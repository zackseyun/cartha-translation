  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: cabras
  rationale: No contexto do inventário, o substantivo se refere às fêmeas caprinas, em contraste com תְיָשִׁים. Em português corrente, “cabras” expressa naturalmente essa distinção.
- source_word: מָאתַיִם
  choice: duzentas
  rationale: Número cardinal direto, com concordância feminina com “cabras” e “ovelhas”.
- source_word: תְיָשִׁים
  choice: bodes
  rationale: Designa machos caprinos. “Bodes” é o termo português comum, claro e específico.
- source_word: עֶשְׂרִים
  choice: vinte
  rationale: Número cardinal direto, invariável em português.
- source_word: רְחֵלִים
  choice: ovelhas
  rationale: Designa ovelhas fêmeas, contrastadas com os carneiros. Em português, “ovelhas” é natural e preserva a distinção de sexo no par.
- source_word: אֵילִים
  choice: carneiros
  rationale: Designa ovinos machos. “Carneiros” é o equivalente português padrão e mantém a estrutura de pares reprodutivos.
