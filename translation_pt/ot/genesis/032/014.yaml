  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: pt
  text: 'Então Jacó passou ali aquela noite e, do que tinha à mão[a], tomou um presente para seu irmão Esaú:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «do que veio à sua mão»; isto é, do que tinha consigo ou estava disponível.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: passou ... a noite
  rationale: O verbo לון indica permanecer ou pernoitar. A expressão «passou ... a noite» é natural em português atual e mantém o sentido temporal.
- source_word: שָׁם
  choice: ali
  rationale: Equivalente locativo natural no contexto narrativo, referindo-se ao lugar em que Jacó se encontrava.
- source_word: בַּלַּיְלָה הַהוּא
  choice: aquela noite
  rationale: A construção hebraica significa literalmente «naquela noite»; com «passou», o português idiomático pede «passou ... aquela noite».
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido básico de לקח sem explicitar além do texto se Jacó selecionou, separou ou reuniu os animais.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: do que tinha à mão
  rationale: Expressa de modo claro o idioma hebraico, que se refere ao que estava disponível ou em posse de Jacó. A forma mais literal é registrada em nota.
- source_word: מִנְחָה
  choice: um presente
  rationale: Neste contexto interpessoal, מִנְחָה designa algo oferecido para honrar ou apaziguar Esaú, não uma oferta cultual. «Presente» é claro e não exagera a ideia de tributo político.
- source_word: לְעֵשָׂו אָחִיו
  choice: para seu irmão Esaú
  rationale: A preposição לְ marca o destinatário, e esta ordem é mais natural em português sem omitir a relação familiar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. O nome «Jacó» foi explicitado para evitar ambiguidade pronominal em um versículo isolado. O dois-pontos foi mantido porque o versículo introduz a lista do presente nos versículos seguintes.
