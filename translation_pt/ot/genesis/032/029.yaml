id: GEN.32.29
reference: Genesis 32:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: pt
  text: 'Então ele disse: “Seu nome não será mais Jacó, mas Israel, porque você lutou com Deus[a] e com homens[b] e prevaleceu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seres divinos”. Em certos contextos, o hebraico אֱלֹהִים pode referir-se a Deus, a deuses ou a seres celestiais. Aqui, “Deus” foi adotado por causa do contexto narrativo.
    reason: alternative_reading
  - marker: b
    text: Ou “com pessoas” ou “com seres humanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: será
  rationale: Na fórmula hebraica de nomeação, o passivo de אמר significa que alguém será chamado por determinado nome. Em português, “seu nome não será mais...” comunica essa declaração de modo natural e fiel.
- source_word: עוֹד
  choice: não será mais
  rationale: Neste contexto de mudança de nome, עוֹד indica que a designação anterior deixará de vigorar.
- source_word: כִּי אִם
  choice: mas
  rationale: 'A locução estabelece o contraste entre o nome anterior e o novo: não Jacó, mas Israel.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: O nome próprio é transliterado segundo a forma portuguesa consagrada; o jogo de palavras é sugerido pela explicação verbal que segue.
- source_word: שָׂרִיתָ
  choice: lutou
  rationale: O verbo שרה denota lutar, contender ou empenhar-se em combate e participa do jogo de palavras com Israel. “Lutou” é claro, vigoroso e apropriado ao confronto narrado.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O contexto narrativo favorece o referente singular “Deus”, embora o substantivo possa ter outros sentidos em contextos diferentes; essa possibilidade é preservada em nota.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O plural masculino de אִישׁ cria o contraste retórico “com Deus e com homens”. Alternativas mais abrangentes são registradas em nota.
- source_word: וַתּוּכָל
  choice: prevaleceu
  rationale: Aqui יכל indica êxito ou capacidade demonstrada no confronto. “Prevaleceu” preserva o resultado favorável sem afirmar uma vitória absoluta sobre Deus.
theological_decisions:
- issue: Referente de אֱלֹהִים na explicação do nome
  choice: Deus
  alternative: ser divino ou seres divinos
  rationale: O encontro é apresentado no contexto imediato como um encontro misterioso com Deus. A tradução principal mantém essa força teológica, enquanto a nota conserva a amplitude lexical e a tensão sobre a identidade da figura.
- issue: Abrangência de אֲנָשִׁים
  choice: homens
  alternative: pessoas ou seres humanos
  rationale: A forma hebraica é masculina plural e estabelece um paralelo contrastivo com Deus. A nota reconhece que o termo também pode ser entendido de maneira mais abrangente.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. O discurso direto conserva a concisão solene da declaração de mudança de nome.
