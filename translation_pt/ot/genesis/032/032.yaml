  text: וַ/יִּֽזְרַֽח ל֣/וֹ הַ/שֶּׁ֔מֶשׁ כַּ/אֲשֶׁ֥ר עָבַ֖ר אֶת פְּנוּאֵ֑ל וְ/ה֥וּא צֹלֵ֖עַ עַל יְרֵכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: pt
  text: O sol nasceu sobre ele quando passou por Penuel[a], e ele mancava por causa da coxa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste versículo, o nome do lugar aparece em hebraico como Penuel; em outros trechos, também aparece como Peniel.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “sobre a coxa”. O termo hebraico também pode designar a parte superior da perna ou a região do quadril.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: O sol nasceu sobre ele
  rationale: Mantém a perspectiva do hebraico, em que o sol nasce sobre Jacó, com formulação clara e digna em português.
- source_word: כַּאֲשֶׁר עָבַר
  choice: quando passou
  rationale: כַּאֲשֶׁר introduz aqui a circunstância temporal; “quando” é natural em português e não especifica indevidamente que houve uma travessia.
- source_word: אֶת פְּנוּאֵל
  choice: por Penuel
  rationale: O verbo עָבַר com o nome do lugar indica passar pelo local. Preserva-se a forma Penuel atestada neste versículo.
- source_word: וְהוּא צֹלֵעַ
  choice: e ele mancava
  rationale: O particípio descreve uma condição ou ação em curso; o imperfeito português expressa naturalmente esse estado simultâneo.
- source_word: עַל יְרֵכוֹ
  choice: por causa da coxa
  rationale: עַל pode ter sentido causal no contexto. “Por causa da coxa” evita a formulação pouco natural “mancava sobre a coxa”, sem substituir יָרֵךְ pela especificidade anatômica “quadril”.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação preserva a imagem de o sol nascer “sobre ele”, mantém Penuel conforme a forma hebraica deste versículo e traduz a construção final de modo natural, registrando a literalidade e a amplitude anatômica em nota.
