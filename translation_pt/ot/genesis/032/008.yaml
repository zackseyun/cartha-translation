base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: pt
  text: Jacó sentiu muito medo e ficou angustiado. Então, dividiu em dois acampamentos[a] as pessoas que estavam com ele, os rebanhos, o gado e os camelos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dois grupos”. A palavra hebraica pode se referir tanto a um acampamento quanto a um grupo organizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא יַעֲקֹב מְאֹד
  choice: Jacó ficou com muito medo
  rationale: Expressa de modo natural o verbo ירא, intensificado por מְאֹד, preservando a grande intensidade do medo.
- source_word: וַיֵּצֶר לוֹ
  choice: e angustiado
  rationale: O idioma hebraico descreve a aflição interior de Jacó; “angustiado” comunica essa perturbação com clareza e concisão em português atual.
- source_word: וַיַּחַץ
  choice: dividiu
  rationale: חצה indica dividir ou separar, aqui como ação deliberada diante do perigo percebido.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: as pessoas que estavam com ele
  rationale: Neste contexto, עָם designa o conjunto de pessoas que acompanhava Jacó, e não um povo ou uma nação em sentido étnico.
- source_word: הַצֹּאן
  choice: os rebanhos
  rationale: צֹאן é um coletivo referente sobretudo a ovelhas e cabras; “rebanhos” mantém o sentido amplo e é natural no contexto.
- source_word: הַבָּקָר
  choice: o gado
  rationale: בָּקָר designa coletivamente os bovinos; “gado” é a equivalência portuguesa mais clara.
- source_word: הַגְּמַלִּים
  choice: os camelos
  rationale: Equivalência lexical direta de גְּמַלִּים.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: em dois acampamentos
  rationale: מַחֲנוֹת pode designar acampamentos ou grupos organizados. “Acampamentos” preserva o termo concreto e a continuidade narrativa.
