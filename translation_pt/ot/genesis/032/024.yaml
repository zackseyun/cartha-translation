base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: pt
  text: Ele os tomou e os fez atravessar o curso de água[a]; depois fez passar para o outro lado tudo o que lhe pertencia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ribeiro”, “o uádi” ou “a ravina”. O termo hebraico נחל pode indicar uma corrente de água, uma ravina ou um leito sazonal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o que era para ele”, isto é, aquilo que lhe pertencia ou seus bens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Ele os tomou
  rationale: Traduz diretamente o verbo לקח e mantém como objeto as pessoas mencionadas no contexto anterior, sem acrescentar a ideia não expressa de que Jacó foi junto com elas.
- source_word: וַיַּעֲבִרֵם
  choice: os fez atravessar
  rationale: A forma hifil de עבר é causativa. Esta formulação natural em português preserva a ideia de que Jacó providenciou ou realizou a travessia deles.
- source_word: הַנָּחַל
  choice: o curso de água
  rationale: נחל pode designar tanto uma corrente de água como seu leito ou vale sazonal. “Curso de água” é claro e suficientemente amplo; a nota conserva as alternativas topográficas.
- source_word: וַיַּעֲבֵר
  choice: fez passar para o outro lado
  rationale: Preserva o valor causativo do hifil de עבר e soa natural quando o objeto são os bens de Jacó.
- source_word: אֲשֶׁר לוֹ
  choice: tudo o que lhe pertencia
  rationale: Expressa idiomaticamente a construção hebraica, literalmente “o que era para ele”, no sentido contextual de seus bens, sem reduzi-la a uma categoria mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa direta. “Curso de água” evita o tom regional ou antigo de algumas alternativas, enquanto as notas preservam a amplitude semântica do hebraico. Os marcadores foram colocados junto às expressões que explicam.
