  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: pt
  text: Tenho bois e jumentos, rebanhos, servos e servas[a]. Mandei avisar meu senhor, para encontrar favor aos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escravos e escravas”. Os termos hebraicos podem designar servos domésticos em condição de escravidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Tenho
  rationale: A construção היה + ל expressa posse; o presente comunica naturalmente os bens que Jacó possui naquele momento.
- source_word: שׁוֹר וַחֲמוֹר
  choice: bois e jumentos
  rationale: Os substantivos singulares têm sentido coletivo nesta enumeração. “Bois” e “jumentos” são termos correntes e específicos em português.
- source_word: צֹאן
  choice: rebanhos
  rationale: O termo coletivo abrange animais de pequeno porte, sobretudo ovelhas e cabras, sem exigir que se especifiquem espécies.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: servos e servas
  rationale: A tradução preserva a distinção de gênero e é natural em português; uma nota registra que os termos também podem designar escravos e escravas no âmbito doméstico.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: Mandei avisar
  rationale: A expressão idiomática transmite de modo claro que Jacó enviou mensageiros para comunicar essas informações.
- source_word: לַאדֹנִי
  choice: meu senhor
  rationale: É uma forma de tratamento deferente dirigida a Esaú, e não um título divino.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: para encontrar favor aos seus olhos
  rationale: Mantém a metáfora hebraica de obter uma consideração favorável, em formulação compreensível em português.
theological_decisions:
- issue: Sentido social de עֶבֶד e שִׁפְחָה numa lista de posses domésticas
  choice: servos e servas
  alternative: escravos e escravas
  rationale: O contexto de inventário sugere dependentes domésticos sob autoridade de Jacó e pode incluir condição servil. O texto principal usa a formulação tradicional e legível, enquanto a nota preserva explicitamente a alternativa lexical mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da enumeração e a metáfora final do hebraico foram preservadas; “mandei avisar” evita uma construção excessivamente literal.
