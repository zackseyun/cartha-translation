  source_fidelity: A tradução comunica fielmente a enumeração possessiva de Jacó, o envio de uma comunicação deferente a Esaú e o propósito de obter favor. “Mandei avisar” reproduz de modo idiomático o efeito de וָאֶשְׁלְחָה לְהַגִּיד, sem exigir a explicitação de “mensageiros”, que o hebraico neste versículo também não repete. “Favor aos seus olhos” preserva adequadamente o idiomatismo hebraico.
