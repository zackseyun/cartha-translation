  source_fidelity: A tradução transmite bem a humildade de Jacó, o par חסד/אמת como «amor leal e fidelidade», o demonstrativo em «este Jordão» e a imagem de «dois acampamentos». Contudo, «apenas» acrescenta uma restrição que não está expressa no hebraico; o contexto pode sugeri-la, mas ela não deve entrar no texto principal.
  naturalness: O português é claro, moderno e apropriado ao registro de uma oração. «Agora me tornei dois acampamentos» preserva deliberadamente a imagem algo incomum do hebraico e é compreensível no contexto narrativo.
  terminology: «Amor leal e fidelidade» distingue adequadamente חסדים de אמת e evita tanto a repetição quanto uma leitura de אמת como mera verdade abstrata. «Servo» é adequado para עבד neste contexto.
