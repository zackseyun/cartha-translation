base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: pt
  text: Não sou digno de todo o amor leal e de toda a fidelidade que demonstraste ao teu servo,[a] pois atravessei este Jordão com o meu cajado, e agora me tornei dois acampamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou menor do que todo o amor leal e toda a fidelidade”. O hebraico diz literalmente “Sou pequeno demais para todo...”, uma expressão de humildade diante da generosidade de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Não sou digno
  rationale: Embora o verbo signifique literalmente “sou pequeno” ou “tornei-me pequeno”, neste contexto expressa humildade diante da generosidade divina. “Não sou digno” comunica naturalmente o sentido do idioma em português.
- source_word: הַחֲסָדִים
  choice: todo o amor leal
  rationale: חסד designa bondade constante e leal, frequentemente em contexto de compromisso relacional. O plural pode apontar para suas muitas manifestações, enquanto “todo o amor leal” mantém uma formulação natural e próxima do hebraico.
- source_word: הָאֱמֶת
  choice: toda a fidelidade
  rationale: Na associação com חסד, אמת denota confiabilidade ou fidelidade, não apenas verdade abstrata.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: que demonstraste ao teu servo
  rationale: A expressão é literalmente “que fizeste com/ao teu servo”. “Demonstraste ao teu servo” é idiomático em português com os objetos “amor leal” e “fidelidade”.
- source_word: בְמַקְלִי
  choice: apenas com o meu cajado
  rationale: 'A forma hebraica é literalmente “com o meu cajado”. “Apenas” explicita a força contextual da declaração: Jacó atravessou sem os bens e o numeroso grupo que agora possuía.'
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: atravessei este Jordão
  rationale: Preserva tanto a ação simples quanto o demonstrativo הַזֶּה, que dá vivacidade e proximidade à referência de Jacó.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: me tornei dois acampamentos
  rationale: A construção significa que a casa de Jacó passou a constituir dois acampamentos. A tradução conserva a imagem concreta e sua ligação com o contexto narrativo.
theological_decisions:
- issue: Tradução do par חסד e אמת na descrição da ação de Deus
  choice: amor leal e fidelidade
  alternative: misericórdia e verdade
  rationale: '“Amor leal e fidelidade” mantém distintos os dois termos hebraicos e comunica seu caráter relacional: bondade constante e confiabilidade. Evita reduzir אמת à verdade abstrata ou importar uma formulação doutrinária específica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a oração dirigida a Deus. “Amor leal” preserva a dimensão relacional de חסד sem recorrer a terminologia denominacional. O marcador [a] aparece no texto principal.
