base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: pt
  text: Assim, o presente foi adiante dele[a], mas ele mesmo passou aquela noite no acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a dádiva”. O hebraico מִנְחָה pode designar presente, tributo ou oferta; aqui se refere ao presente que Jacó enviou adiante para Esaú.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: passou adiante
  rationale: O wayyiqtol de עבר descreve aqui o avanço do presente na sequência narrativa. “Passou adiante” comunica movimento para a frente sem sugerir necessariamente a travessia de um limite ou curso de água.
- source_word: הַמִּנְחָה
  choice: o presente
  rationale: Neste contexto, מִנְחָה é o presente que Jacó enviou a Esaú, não uma oferta de culto. “Presente” é claro em português e evita a possível leitura de “dom” como capacidade concedida.
- source_word: עַל־פָּנָיו
  choice: adiante dele
  rationale: A expressão, literalmente “diante de seu rosto”, indica que o presente seguia à frente de Jacó.
- source_word: וְהוּא
  choice: mas ele mesmo
  rationale: O pronome expresso põe Jacó em contraste com o presente que seguiu adiante; “mas ele mesmo” torna esse contraste natural em português.
- source_word: לָן
  choice: passou aquela noite
  rationale: O verbo לון/לין significa pernoitar ou permanecer durante a noite. A formulação escolhida é corrente e evita a repetição menos elegante de “ficou naquela noite”.
- source_word: בַּלַּיְלָה הַהוּא
  choice: aquela noite
  rationale: Equivalente temporal natural e direto em português.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: מַחֲנֶה designa um acampamento; esta é a equivalência moderna e clara no contexto.
