  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele lhe disse
  rationale: A forma narrativa com waw consecutivo faz o relato avançar. “Então” expressa essa progressão com naturalidade, e “disse” mantém o sentido básico de אמר.
- source_word: אֵלָיו
  choice: lhe
  rationale: A preposição אֶל com sufixo masculino singular indica que a fala é dirigida a ele; o pronome “lhe” é conciso e natural em português.
- source_word: מַה שְּׁמֶךָ
  choice: Qual é o seu nome?
  rationale: Embora a construção hebraica seja literalmente “que [é] o teu nome?”, esta é a formulação interrogativa corrente e clara em português moderno.
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: O verbo é literalmente “disse”, mas, nesta segunda ocorrência, introduz diretamente a resposta à pergunta. “Respondeu” comunica a função contextual sem acrescentar conteúdo.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
