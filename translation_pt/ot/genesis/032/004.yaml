  text: וַ/יִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְ/פָנָ֔י/ו אֶל עֵשָׂ֖ו אָחִ֑י/ו אַ֥רְצָ/ה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: pt
  text: Jacó enviou mensageiros adiante de si ao seu irmão Esaú, à terra de Seir, região de Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “campo de Edom”; provavelmente uma designação regional. Também pode ser traduzido como “território de Edom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo narrativo de שלח indica uma ação passada simples; “enviou” é a forma natural e direta em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Embora o termo também possa designar anjos, aqui se refere a representantes humanos enviados por Jacó a Esaú.
- source_word: לְפָנָיו
  choice: à sua frente
  rationale: Expressa de modo natural que os mensageiros foram enviados adiante de Jacó, preservando a imagem espacial do hebraico.
- source_word: עֵשָׂו אָחִיו
  choice: seu irmão Esaú
  rationale: Mantém tanto o nome próprio quanto a relação de parentesco em uma ordem idiomática no português.
- source_word: אַרְצָה שֵׂעִיר
  choice: à terra de Seir
  rationale: A terminação direcional de אַרְצָה indica movimento para esse lugar, e “terra” preserva o substantivo explícito do hebraico.
- source_word: שְׂדֵה אֱדֹם
  choice: na região de Edom
  rationale: Literalmente “campo de Edom”, a expressão funciona neste contexto como designação territorial. “Região” comunica esse sentido de modo claro e natural, enquanto a nota preserva a formulação concreta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de destinos do hebraico foi mantida, mas a última expressão recebeu “na” para indicar naturalmente que a região de Edom identifica a área de Seir.
