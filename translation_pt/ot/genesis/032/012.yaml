  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: pt
  text: Livra-me, por favor, das mãos de meu irmão, das mãos de Esaú, pois temo que ele venha e me ataque, atingindo mãe e filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mãe sobre filhos”, expressão que descreve o ataque a uma mãe juntamente com seus filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Livra-me, por favor
  rationale: O imperativo hifil de נצל pede libertação ou resgate, e נָא suaviza o pedido. A formulação preserva o tom urgente e suplicante da oração em português atual.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: das mãos de meu irmão, das mãos de Esaú
  rationale: Mantém a repetição enfática e a imagem hebraica da mão como poder ou domínio, além de conservar a tensão causada por o agressor temido ser irmão de Jacó.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: pois tenho medo dele
  rationale: Expressa de modo natural o estado presente e explicitamente declarado de medo de Jacó.
- source_word: פֶּן יָבוֹא וְהִכַּנִי
  choice: Não permitas que ele venha e ataque a mim
  rationale: פֶּן introduz o acontecimento temido. A construção negativa com pedido implícito é natural em português; 'ataque' preserva a amplitude de נכה neste contexto sem determinar indevidamente que o resultado seria necessariamente a morte.
- source_word: אֵם עַל בָּנִים
  choice: às mães e aos filhos
  rationale: A expressão hebraica, literalmente singular, é idiomática e descreve um ataque indiscriminado contra mães juntamente com seus filhos. O plural genérico torna clara em português a extensão do ataque temido, enquanto a nota conserva a forma da imagem hebraica.
theological_decisions:
- issue: Alcance e sentido da expressão violenta אֵם עַל בָּנִים
  choice: a mim, às mães e aos filhos
  alternative: a mim, mãe com filhos
  rationale: A tradução comunica que Jacó teme um ataque contra si e contra as famílias de seu grupo, sem transformar נכה especificamente em 'matar'. A alternativa mais literal preserva o singular, mas é sintaticamente obscura em português e pode fazer 'mãe com filhos' parecer uma identificação de Jacó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência apropriada a uma súplica. Conserva-se a imagem bíblica “das mãos de” por ser transparente no contexto; a expressão idiomática final é esclarecida no texto e documentada em nota.
