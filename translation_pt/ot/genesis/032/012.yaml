review_pass:
  verdict: revise
  source_fidelity: A súplica, a repetição enfática de “das mãos de”, a identificação de Esaú e o temor de Jacó estão bem transmitidos. Contudo, “às mães e aos filhos” pluraliza e explicita como objetos coordenados uma expressão hebraica singular e idiomática. A formulação também transforma a estrutura “ataque-me, mãe sobre filhos” em uma enumeração mais interpretativa. Uma redação que mantenha “mãe e filhos” como expressão genérica e ligada ao ataque preserva melhor o alcance do hebraico sem afirmar que נכה significa necessariamente matar.
  naturalness: O português é claro e atual. “Não permitas que” é compreensível, mas acrescenta a noção de permissão divina onde o hebraico expressa diretamente o evento temido introduzido por פֶּן. “Temo que ele venha e me ataque” é mais direto e natural. A oração final revisada evita a leitura de que Jacó seja identificado com “mãe com filhos”.
  terminology: “Livra-me, por favor”, “das mãos de”, “Esaú” e “tenho medo/temo” são adequados ao registro. “Ataque” mantém de modo prudente a amplitude de נכה. A nota deve conservar o literal “mãe sobre filhos” e explicar o valor idiomático sem impor uma leitura de morte.
  issues:
  - severity: medium
    issue: “às mães e aos filhos” altera a forma e a relação sintática da expressão אֵם עַל־בָּנִים.
    rationale: O hebraico traz “mãe” no singular em uma expressão idiomática. O plural genérico pode ser defensável como explicitação, mas a coordenação “a mim, às mães e aos filhos” apresenta os termos como objetos independentes e enfraquece a imagem de mãe juntamente com filhos.
  - severity: low
    issue: “Não permitas que” explicita uma noção não expressa literalmente por פֶּן.
    rationale: פֶּן introduz o acontecimento que Jacó teme. “Temo que ele venha...” comunica essa relação de modo mais direto em português.
  revised_text: Livra-me, por favor, das mãos de meu irmão, das mãos de Esaú, pois temo que ele venha e me ataque, atingindo mãe e filhos.[a]
