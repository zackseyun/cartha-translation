revisions:
- from: Livra-me, por favor, das mãos de meu irmão, das mãos de Esaú, pois tenho medo dele. Não permitas que ele venha e ataque a mim, às mães e aos filhos.[a]
  to: Livra-me, por favor, das mãos de meu irmão, das mãos de Esaú, pois temo que ele venha e me ataque, atingindo mãe e filhos.[a]
  rationale: A revisão substitui a construção permissiva por uma expressão direta do temor introduzido por פֶּן e reformula a expressão final para manter o singular genérico e a ligação entre mãe e filhos, sem tornar “mães” e “filhos” meros objetos coordenados nem especificar morte. A nota continua a documentar a imagem literal hebraica.
