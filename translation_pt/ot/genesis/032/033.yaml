id: GEN.32.33
reference: Genesis 32:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: pt
  text: Por isso, até hoje os filhos de Israel[a] não comem o tendão do quadril[b], que fica sobre o encaixe da coxa, porque ele tocou no encaixe da coxa de Jacó, no tendão do quadril.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; em hebraico, literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica tradicionalmente designa um tendão ou nervo específico na região do quadril e da coxa; alguns a identificam mais precisamente com o nervo ciático ou com um tendão associado a ele.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a relação causal e consecutiva que introduz a explicação do costume.
- source_word: לֹא יֹאכְלוּ
  choice: não comem
  rationale: O imperfeito hebraico negado descreve aqui uma prática costumeira que continua vigente; o presente transmite isso naturalmente em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar do hebraico e sua ligação narrativa com Jacó, chamado Israel; a alternativa idiomática é indicada em nota.
- source_word: גִּיד הַנָּשֶׁה
  choice: o tendão do quadril
  rationale: “Tendão” representa de forma acessível e não excessivamente técnica o tecido em forma de cordão designado por גִּיד. A identificação anatômica exata de הַנָּשֶׁה é incerta, por isso a tradução mantém uma referência ampla à região do quadril e registra alternativas em nota.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: que fica sobre a articulação da coxa
  rationale: כַּף designa aqui a concavidade ou região de encaixe, e יָרֵךְ a área da coxa ou do quadril. “Articulação da coxa” é compreensível sem impor precisão anatômica ausente no hebraico.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente idiomático direto da fórmula temporal hebraica que assinala a continuidade do costume.
- source_word: כִּי נָגַע
  choice: porque ele tocou
  rationale: Mantém o sentido comum de נגע, “tocar”, sem ampliar para “golpear”, embora o toque tenha efeito incapacitante no contexto.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: na articulação da coxa de Jacó
  rationale: Repete de maneira coerente a tradução dos mesmos termos anatômicos usados anteriormente no versículo.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: junto ao tendão do quadril
  rationale: A preposição בְ é entendida em sentido locativo, indicando o ponto do contato; a expressão anatômica é traduzida de modo coerente com sua primeira ocorrência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação conserva a repetição anatômica do hebraico e evita transformar uma identificação tradicional possível, como “nervo ciático”, em certeza textual.
