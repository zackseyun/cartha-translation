review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a relação causal, o costume contínuo, «filhos de Israel» e a repetição da expressão anatômica. Contudo, «junto ao» enfraquece a referência locativa de בְ no final; «no tendão» reproduz mais diretamente o ponto atingido. «Articulação da coxa» também é menos idiomático e menos claro do que «encaixe da coxa» para כַּף הַיָּרֵךְ.
  naturalness: O texto é compreensível e de registro adequado. «Encaixe da coxa» soa mais natural e concreto em português do que «articulação da coxa», sem exigir uma identificação anatômica técnica.
  terminology: «Tendão do quadril» é uma opção funcional para גִּיד הַנָּשֶׁה, cuja identificação precisa é incerta; a nota corretamente mantém essa incerteza e não a resolve dogmaticamente como «nervo ciático».
  issues:
  - severity: medium
    issue: «articulação da coxa»
    rationale: A coxa não é normalmente descrita em português como tendo uma «articulação» própria; o hebraico כַּף indica a cavidade, palma/encaixe ou região de articulação. «Encaixe da coxa» comunica melhor a imagem sem especificação anatômica excessiva.
  - severity: low
    issue: «junto ao tendão do quadril»
    rationale: No membro final, בְ marca mais diretamente a região ou o ponto do contato. «No tendão do quadril» conserva melhor essa relação locativa e a repetição deliberada do hebraico.
  revised_text: Por isso, até hoje os filhos de Israel[a] não comem o tendão do quadril[b], que fica sobre o encaixe da coxa, porque ele tocou no encaixe da coxa de Jacó, no tendão do quadril.
