  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: pt
  text: 'Ele confiou cada rebanho separadamente aos seus servos[a] e lhes disse: “Vão à minha frente e deixem um espaço entre um rebanho e outro[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pôs na mão de seus servos”, expressão que significa entregar aos cuidados ou ao controle de alguém.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “deixem um intervalo entre os rebanhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: confiou ... aos seus servos
  rationale: A expressão literal “pôs/deu na mão de seus servos” é uma construção idiomática que indica entregar algo ao controle ou cuidado de alguém. “Confiou ... aos” comunica esse sentido com naturalidade em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Embora עבד também possa designar escravos, neste contexto refere-se aos integrantes da casa encarregados de conduzir os animais; “servos” é adequado sem definir além do necessário sua condição social.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: cada rebanho separadamente
  rationale: A repetição de עֵדֶר tem valor distributivo, e לְבַדּוֹ indica separação. A formulação expressa que os grupos foram organizados um a um, cada qual à parte.
- source_word: עִבְרוּ לְפָנַי
  choice: Passem adiante de mim
  rationale: עבר denota passar, atravessar ou seguir; neste contexto, a ordem é que os servos avancem à frente de Jacó, sem necessariamente indicar uma travessia específica.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: deixem um espaço
  rationale: רֶוַח significa espaço ou intervalo. Em português, “deixar um espaço” é uma maneira natural de expressar a separação intencional entre os grupos.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: entre um rebanho e outro
  rationale: A construção hebraica repetida enfatiza a separação sucessiva dos rebanhos; a expressão portuguesa conserva claramente esse valor distributivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução prioriza a naturalidade sem perder o valor distributivo das repetições hebraicas nem especificar uma travessia não exigida pelo contexto.
