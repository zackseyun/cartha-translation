source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: pt
  text: 'E Jacó disse: “Ó Deus de meu pai Abraão e Deus de meu pai Isaque, ó Yahweh, que me disseste: ‘Volta para a tua terra e para a tua parentela[a], e eu te farei bem[b]’,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o teu lugar de origem”. O termo hebraico pode indicar a parentela ou a terra natal.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Também se pode traduzir: “eu te tratarei bem” ou “agirei bondosamente contigo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: E Jacó disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E Jacó disse” preserva esse fluxo sem tornar a sequência mais enfática do que o hebraico.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Ó Deus de meu pai Abraão e Deus de meu pai Isaque
  rationale: As construções nominais são vertidas diretamente, e “Ó” torna explícita, de modo natural, a função vocativa da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָאֹמֵר אֵלַי
  choice: que me disseste
  rationale: O particípio definido descreve Yahweh como aquele que falou a Jacó; em português, a oração relativa é natural e mantém o discurso dirigido diretamente a Deus.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Volta para a tua terra
  rationale: “Volta” comunica de modo direto o imperativo geográfico de שׁוב; “terra” preserva a formulação e as ressonâncias territoriais do relato patriarcal.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: e para a tua parentela
  rationale: “Parentela” conserva o sentido coletivo de origem familiar, sem restringir o termo apenas ao lugar de nascimento.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: e eu te farei bem
  rationale: Expressa em português natural a ação benéfica indicada pelo hifil de יטב com עִם, sem a leitura enganosa de realizar boas ações juntamente com Jacó.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título; “Yahweh” preserva essa distinção.
- issue: Natureza da promessa וְאֵיטִיבָה עִמָּךְ
  choice: eu te farei bem
  alternative: tratarei bem de ti; agirei bondosamente contigo
  rationale: A tradução mantém a promessa de ação benéfica sem especificar além do texto a forma concreta que esse favor assumirá.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento em segunda pessoa do singular (“tu”) por coerência no discurso direto dirigido a Deus e na fala divina citada. “Parentela” é ligeiramente formal, mas claro no contexto e útil para preservar a amplitude do hebraico.
