base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: pt
  text: 'Então você dirá: “É um presente[a] do seu servo Jacó, enviado ao meu senhor Esaú; e veja, ele também está atrás de nós[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dádiva” ou “tributo”. O hebraico minḥah designa aqui um presente conciliatório enviado a Esaú.
    reason: lexical_alternative
  - marker: b
    text: Ou “vem depois de nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָֽמַרְתָּ
  choice: Então você dirá
  rationale: O waw seguido do perfeito dá continuidade às instruções de Jacó. “Então” expressa a sequência com naturalidade, e o futuro mantém a força instrutiva.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: do seu servo Jacó
  rationale: A expressão identifica Jacó por uma fórmula deferente. A construção com “do” liga naturalmente o presente a Jacó e preserva sua autodesignação humilde diante de Esaú.
- source_word: מִנְחָה
  choice: presente
  rationale: Neste contexto narrativo, o termo designa um presente conciliatório enviado a Esaú, não uma oferta de culto. “Presente” é claro e corrente.
- source_word: שְׁלוּחָה
  choice: enviado
  rationale: O particípio passivo descreve o presente como algo remetido. A forma “enviado” conserva o sentido passivo e concorda com “presente”.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: ao meu senhor, a Esaú
  rationale: “Senhor” preserva o título social respeitoso usado por Jacó. A repetição da preposição e a vírgula mantêm Esaú em aposição explicativa, como no hebraico.
- source_word: וְהִנֵּה
  choice: e veja
  rationale: O marcador chama a atenção para a informação seguinte. “Veja” é atual e compreensível, sem o tom arcaico de “eis”.
- source_word: גַם הוּא
  choice: ele também
  rationale: 'Mantém a ênfase aditiva: além do presente e dos servos, o próprio Jacó segue atrás.'
- source_word: אַחֲרֵינוּ
  choice: está atrás de nós
  rationale: É uma tradução direta da posição de Jacó em relação aos grupos enviados adiante, preservando a possibilidade de entender tanto localização quanto movimento subsequente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva as fórmulas de deferência de Jacó sem soar excessivamente arcaica. A tradução mantém a aposição “ao meu senhor, a Esaú” e não resolve além do necessário a nuance espacial ou dinâmica de אַחֲרֵינוּ.
