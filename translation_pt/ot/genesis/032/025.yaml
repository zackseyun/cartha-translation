    rationale: O verbo descreve luta corporal de agarramento; “lutou corpo a corpo” explicita esse valor sem acrescentar interpretação teológica.
  - severity: low
    issue: A explicação literal da nota a, “até a subida da aurora”, soa pouco idiomática em português.
    rationale: “Até a aurora subir” reproduz de modo mais claro a construção verbal hebraica e permanece adequado para uma nota lexical.
