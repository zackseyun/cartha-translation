  source_fidelity: A redação preserva adequadamente a apresentação indefinida de אִישׁ como “um homem” e a duração da luta até a aurora. Contudo, “ficou sozinho” atenua a voz passiva de וַיִּוָּתֵר (“foi deixado”), e “lutou” não comunica por si só o sentido específico de luta de agarramento expresso por וַיֵּאָבֵק.
  naturalness: “Foi deixado sozinho” e “lutou corpo a corpo” são formulações naturais, claras e de registro narrativo digno em português moderno. “Até o romper da aurora” mantém uma imagem idiomática e poética sem artificialidade.
  terminology: “Um homem” preserva corretamente a tensão narrativa e não antecipa uma identificação angélica ou divina. A nota b é apropriada. A nota a deve tornar mais inteligível a formulação literal, usando uma oração em vez de “a subida da aurora”.
