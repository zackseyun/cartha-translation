base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: pt
  text: Jacó foi deixado sozinho, e um homem[b] lutou corpo a corpo com ele até o romper da aurora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o amanhecer”; literalmente, “até a aurora subir”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “um homem”; o contexto posterior e Oseias 12:4 contribuem para uma identificação mais completa dessa figura.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: ficou
  rationale: O nifal de יתר pode ser entendido passivamente como “foi deixado”, mas, neste contexto, “ficou” comunica com naturalidade que Jacó permaneceu só depois da travessia, sem excluir a nuance contextual de ter sido deixado para trás.
- source_word: לְבַדּוֹ
  choice: sozinho
  rationale: Equivalente português direto e natural, que preserva a ênfase narrativa no isolamento de Jacó.
- source_word: וַיֵּאָבֵק
  choice: lutou
  rationale: O verbo raro descreve uma luta corporal, um confronto em que os participantes se agarram. “Lutou” é claro em português amplo; o contexto imediato indica a natureza física do combate.
- source_word: אִישׁ
  choice: um homem
  rationale: O hebraico apresenta a figura inicialmente apenas como “um homem”. A tradução conserva essa identificação narrativa sem antecipar sua interpretação posterior.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a relação expressa pela preposição hebraica.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: até o romper da aurora
  rationale: Expressão portuguesa natural e digna que preserva a imagem do surgimento da aurora; a nota registra uma alternativa e o sentido mais literal.
theological_decisions:
- issue: Identidade de אִישׁ na cena da luta
  choice: um homem
  alternative: um anjo; Deus ou o SENHOR aparecendo como homem
  rationale: Este versículo chama a figura somente de “um homem”. O contexto posterior e Oseias 12:4 contribuem para sua identificação mais ampla, mas a tradução deve preservar a tensão e o desenvolvimento da narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Romper da aurora” mantém a imagem poética do hebraico sem soar excessivamente literal; “um homem” preserva deliberadamente o mistério narrativo.
