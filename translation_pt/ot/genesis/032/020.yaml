  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: pt
  text: 'Ele ordenou também ao segundo, também ao terceiro e a todos os que iam atrás dos rebanhos, dizendo: “Desta maneira[a] vocês falarão a Esaú quando o encontrarem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Conforme esta palavra falarão a Esaú quando o encontrarem.”'
    reason: A expressão hebraica pode ser traduzida mais literalmente como “conforme esta palavra”; no contexto, “desta maneira” expressa naturalmente a instrução de repetir a mensagem prescrita.
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O piel de צוה expressa uma ordem ou instrução com força diretiva; “ordenou” preserva essa força.
- source_word: גַּם אֶת הַשֵּׁנִי גַּם אֶת הַשְּׁלִישִׁי
  choice: também ao segundo, ao terceiro
  rationale: Os ordinais estão substantivados no hebraico. A formulação evita acrescentar “servo”, que não aparece explicitamente neste versículo, e usa o segundo “também” de modo implícito para maior naturalidade em português.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: todos os que seguiam atrás dos rebanhos
  rationale: O particípio abrange o grupo inteiro que seguia os agrupamentos de animais. “Rebanhos” é claro e corrente em português, enquanto “seguiam atrás” mantém a relação espacial.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da ordem; em português atual, os dois-pontos cumprem essa função naturalmente sem exigir o mais pesado “dizendo”.
- source_word: כַּדָּבָר הַזֶּה
  choice: estas mesmas palavras
  rationale: A expressão significa literalmente “conforme esta palavra/coisa” e, no contexto, remete à mensagem prescrita. “Estas mesmas palavras” preserva a ideia de conformidade com o enunciado anterior em português natural.
- source_word: תְּדַבְּרוּן
  choice: vocês falarão
  rationale: O plural de דבר tem força diretiva. “Vocês falarão” mantém tanto o sentido básico de “falar” quanto o tom de ordem, com legibilidade brasileira.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: quando o encontrarem
  rationale: A construção temporal com o infinitivo de מצא é adequadamente representada por “quando”; “encontrarem” conserva o sentido lexical sem interpretar a ocorrência apenas como um encontro combinado.
