base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: pt
  text: 'Então Jacó perguntou: “Por favor, diga-me o seu nome.” Ele respondeu: “Por que é que você pergunta o meu nome?” E ali o abençoou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Então Jacó perguntou
  rationale: A sequência hebraica literalmente diz que Jacó “perguntou e disse”, fórmula narrativa que em português corrente é expressa naturalmente por “perguntou” antes da fala direta, sem perda de sentido.
- source_word: הַגִּידָה נָּא
  choice: Por favor, diga-me
  rationale: O imperativo hifil de נגד significa “dizer, declarar, dar a conhecer”; נָא suaviza o pedido. A formulação escolhida conserva tanto o conteúdo quanto o tom cortês.
- source_word: שְׁמֶךָ
  choice: o seu nome
  rationale: Tradução direta; embora o nome possa envolver identidade no contexto, não se explicita essa implicação no texto principal.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Por que você pergunta o meu nome?
  rationale: A expressão לָמָּה זֶּה introduz uma pergunta enfática. Em português moderno, a forma escolhida comunica com naturalidade o sentido do idioma hebraico, sem um decalque estranho.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: E ali o abençoou
  rationale: Preserva o verbo “abençoar”, o objeto pronominal e a ênfase locativa de שָׁם. O sujeito continua implícito, como no hebraico.
theological_decisions:
- issue: Identidade daquele que se recusa a revelar o nome
  choice: Manter o sujeito implícito em “Ele respondeu” e “o abençoou”, sem identificá-lo nominalmente.
  alternative: Explicitar “o homem”, “Deus” ou “o anjo”.
  rationale: Neste versículo, o hebraico não nomeia o interlocutor. Embora o contexto mais amplo favoreça interpretações teológicas, a tradução não deve resolver aqui uma identificação que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea; evita tanto arcaísmos quanto coloquialismo excessivo. Não são necessárias notas de rodapé neste versículo.
