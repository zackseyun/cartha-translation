base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: pt
  text: 'E ele disse[a]: “Deixe-me ir, pois a aurora despontou[b].” Mas ele disse[c]: “Não deixarei você ir, a menos que me abençoe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Solte-me” ou “Mande-me embora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois o dia está amanhecendo”; literalmente, “pois a aurora subiu”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico não identifica explicitamente os falantes neste versículo; suas identidades são inferidas do contexto narrativo.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Deixe-me ir
  rationale: O imperativo de שׁלח com sufixo de primeira pessoa significa literalmente “solte-me/envie-me”. No contexto da luta, “Deixe-me ir” é natural e preserva o sentido de libertar alguém que está sendo retido.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: pois a aurora já despontou
  rationale: כִּי mantém o valor causal (“pois”), enquanto עָלָה הַשָּׁחַר descreve a aurora surgindo. “Já despontou” comunica com naturalidade que o amanhecer chegou, sem perder a imagem hebraica.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Não deixarei você ir
  rationale: A forma imperfeita negada expressa recusa firme. A repetição de “deixar ... ir” preserva a correspondência verbal com a primeira fala.
- source_word: כִּי אִם
  choice: a menos que
  rationale: A combinação introduz a condição excepcional sob a qual o interlocutor será solto; “a menos que” é clara e idiomática em português.
- source_word: בֵּרַכְתָּנִי
  choice: me abençoe
  rationale: Embora a forma hebraica seja perfeita, depois da condição כִּי אִם ela aponta para a bênção exigida antes da soltura. O presente do subjuntivo português expressa naturalmente essa condição futura.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: E ele disse ... Mas o outro disse
  rationale: O hebraico repete “e disse” sem nomear os sujeitos. “Mas” torna clara a resposta contrastante, e “o outro” distingue os interlocutores sem lhes atribuir identidades não expressas neste versículo.
theological_decisions:
- issue: Identidade dos interlocutores
  choice: Não identificar os falantes como Jacó, homem, anjo ou Deus; usar “ele” e “o outro”.
  alternative: Identificar explicitamente o primeiro falante como o homem/anjo e o segundo como Jacó.
  rationale: O hebraico contém apenas formas verbais masculinas na terceira pessoa e não nomeia os falantes neste versículo. A formulação escolhida permite acompanhar a troca de falas sem resolver a tensão narrativa e teológica por meio de informação importada do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aurora” conserva a imagem poética sem soar arcaica; “você” evita rigidez e mantém naturalidade. A pontuação organiza o diálogo, e os marcadores [a], [b] e [c] aparecem no texto principal.
