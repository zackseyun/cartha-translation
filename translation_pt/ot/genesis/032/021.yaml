base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: pt
  text: 'E também digam: “Eis que o seu servo Jacó vem atrás de nós”, pois ele pensou: “Vou apaziguá-lo[a] com o presente que segue à minha frente; depois verei o seu rosto. Talvez ele me receba bem[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “apaziguarei o rosto dele”. O verbo está relacionado à linguagem de expiação, mas aqui se refere a aplacar Esaú com um presente.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “ele levantará o meu rosto”, expressão que significa receber alguém favoravelmente ou mostrar-lhe favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: E digam também
  rationale: O verbo está no plural e dá continuidade às instruções de Jacó aos servos. O imperativo natural em português comunica a ordem sem o peso arcaizante de uma forma excessivamente literal.
- source_word: הִנֵּה
  choice: Vejam
  rationale: A partícula chama a atenção dos ouvintes. “Vejam” concorda com o destinatário plural e soa corrente e imediato em português.
- source_word: עַבְדְּךָ
  choice: o seu servo
  rationale: Neste discurso diplomático, Jacó se apresenta com deferência e auto-humilhação diante de Esaú. “Servo” preserva esse registro melhor que “escravo”.
- source_word: אַחֲרֵינוּ
  choice: vem atrás de nós
  rationale: Indica que Jacó seguia os mensageiros. O verbo “vem” torna explícito o movimento já pressuposto no contexto e produz uma frase natural.
- source_word: אֲכַפְּרָה פָנָיו
  choice: Vou apaziguá-lo
  rationale: 'A raiz כפר aparece aqui num contexto interpessoal, não ritual: Jacó pretende aplacar Esaú por meio de um presente. A nota registra a formulação hebraica ligada ao rosto e à linguagem de expiação.'
- source_word: מִנְחָה
  choice: presente
  rationale: No contexto, trata-se do presente conciliatório enviado a Esaú. “Oferta” poderia sugerir indevidamente um ato cultual, enquanto “tributo” acentuaria demais uma relação política.
- source_word: הַהֹלֶכֶת לְפָנָי
  choice: que segue à minha frente
  rationale: Preserva a ação em curso e a posição do presente adiante de Jacó, em português claro e idiomático.
- source_word: אֶרְאֶה פָנָיו
  choice: verei o seu rosto
  rationale: Mantém a imagem explícita do hebraico e parte da repetição literária de פָנִים, sem deixar de ser compreensível em português.
- source_word: יִשָּׂא פָנָי
  choice: ele me receba bem
  rationale: A expressão idiomática hebraica, literalmente “levantar o meu rosto”, indica acolhimento favorável ou aceitação. A tradução comunica o sentido; a nota preserva a imagem original.
- source_word: אוּלַי
  choice: Talvez
  rationale: Expressa corretamente a esperança incerta de Jacó diante do encontro com Esaú.
theological_decisions:
- issue: Sentido de כפר em contexto interpessoal
  choice: Vou apaziguá-lo
  alternative: Farei expiação diante dele
  rationale: Embora a raiz possa pertencer à linguagem de expiação, aqui o objeto é o “rosto” de Esaú e o meio é um presente conciliatório. A tradução evita introduzir um rito sacrificial no texto, sem ocultar a relação lexical, explicada em nota.
- issue: Expressão idiomática יִשָּׂא פָנָי
  choice: ele me receba bem
  alternative: ele levante o meu rosto
  rationale: A forma literal preservaria o jogo de palavras, mas seria opaca em português e poderia sugerir outra ação. “Receba bem” expressa a expectativa de acolhimento favorável, enquanto a nota conserva a imagem hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso direto usa formas naturais no plural (“digam”, “vejam”). A tradução mantém “verei o seu rosto” para conservar parte do motivo literário repetido, mas verte os dois idiomatismos mais opacos por equivalentes claros, documentando a forma hebraica nas notas.
