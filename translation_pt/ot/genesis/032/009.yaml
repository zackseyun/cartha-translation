base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: pt
  text: 'Ele disse: “Se Esaú vier a um dos acampamentos e o atacar, o acampamento que restar escapará[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará a salvo”; literalmente, “será para escape”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele disse
  rationale: O wayyiqtol de אמר introduz a fala na sequência narrativa; em português, o pretérito perfeito expressa isso naturalmente sem exigir a reprodução de וַ־ por «e».
- source_word: אִם
  choice: Se
  rationale: Mantém o valor condicional do raciocínio de Jacó, sem convertê-lo em certeza temporal.
- source_word: יָבוֹא
  choice: vier
  rationale: Preserva o sentido básico de בוא, «vir»; a ação hostil é expressa pelo verbo seguinte.
- source_word: אֶל הַמַּחֲנֶה הָאַחַת
  choice: a um dos acampamentos
  rationale: Expressa de modo natural que Esaú poderia dirigir-se a um dos dois acampamentos anteriormente formados, sem acrescentar a ideia de que fosse o «primeiro».
- source_word: וְהִכָּהוּ
  choice: e o atacar
  rationale: נכה significa literalmente «golpear», mas, aplicado por Esaú a todo um acampamento, «atacar» comunica com clareza a ação hostil; o pronome retoma «acampamento».
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: o acampamento que restar
  rationale: Reproduz o sentido resultativo de נשאר e soa natural no contexto da condição futura.
- source_word: לִפְלֵיטָה
  choice: escapará
  rationale: A construção nominal indica que o outro acampamento ficará em condição de escape ou sobrevivência; a forma verbal é idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A formulação mantém a contingência do plano de Jacó e evita sugerir que um acampamento específico fosse necessariamente o primeiro alvo.
