  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: pt
  text: trinta camelas que amamentavam, com suas crias, quarenta vacas e dez touros, vinte jumentas e dez jumentinhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez jumentos machos”. O termo hebraico pode designar um jumento jovem ou um jumento macho; nesta lista de animais, talvez se refira a machos correspondentes às jumentas.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: camelas que amamentavam
  rationale: O particípio feminino indica camelas que davam de mamar; a formulação é clara e natural em português.
- source_word: וּבְנֵיהֶם
  choice: com suas crias
  rationale: Literalmente, 'e seus filhos'; no contexto de animais, 'suas crias' é o equivalente idiomático.
- source_word: פָּרוֹת
  choice: vacas
  rationale: Designa bovinos do sexo feminino; 'vacas' preserva de modo natural a distinção em relação aos touros.
- source_word: וּפָרִים
  choice: e dez touros
  rationale: Designa bovinos machos, aqui contrastados com as vacas.
- source_word: אֲתֹנֹת
  choice: jumentas
  rationale: O substantivo especifica jumentos do sexo feminino.
- source_word: וַעְיָרִם
  choice: e dez jumentinhos
  rationale: עַיִר pode designar um jumento jovem ou um jumento macho. 'Jumentinhos' expressa bem o sentido juvenil provável, enquanto a nota preserva a alternativa contextual.
