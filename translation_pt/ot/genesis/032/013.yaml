  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: pt
  text: 'Mas tu disseste: “Certamente te farei bem[a] e farei a tua descendência[b] como a areia do mar, que não pode ser contada[c] por ser tão abundante.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico combina o infinitivo absoluto com o verbo conjugado para dar ênfase: “com toda a certeza te farei bem”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “os teus descendentes”. O termo hebraico זֶרַע é um singular coletivo que designa a descendência como um grupo.
    reason: lexical_alternative
  - marker: c
    text: Ou “não pode ser numerada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas tu
  rationale: A conjunção com o pronome independente dá ênfase ao contraste entre o perigo presente e aquilo que Deus havia prometido; “Mas tu” reproduz naturalmente esse valor adversativo.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Certamente te farei bem
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. “Certamente” conserva essa ênfase, e “te farei bem” expressa de modo natural a ação benéfica indicada pelo verbo com עִם.
- source_word: וְשַׂמְתִּי
  choice: e tornarei
  rationale: Neste contexto, שׂים significa fazer com que algo assuma determinada condição. “Tornarei” comunica isso com clareza sem recorrer ao literalismo inadequado de “porei”.
- source_word: זַרְעֲךָ
  choice: a tua descendência
  rationale: זֶרַע é um singular coletivo. “Descendência” preserva tanto a forma coletiva quanto a referência ao conjunto dos descendentes.
- source_word: כְּחוֹל הַיָּם
  choice: como a areia do mar
  rationale: Mantém diretamente a conhecida comparação hebraica e soa natural em português bíblico contemporâneo.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: que não pode ser contada por ser tão abundante
  rationale: O Nifal expressa a impossibilidade prática de contar, enquanto מֵרֹב apresenta a grande quantidade como causa. A formulação conserva ambos os elementos em português claro.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com o pronome “tu” adequado à oração dirigida diretamente a Deus. A construção mantém a ênfase da promessa e a imagem concreta da areia sem acrescentar uma interpretação denominacional.
