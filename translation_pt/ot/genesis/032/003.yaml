base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: pt
  text: 'Quando Jacó os viu, disse: “Este é o acampamento de Deus”. Por isso, deu àquele lugar o nome de Maanaim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O nome Maanaim pode significar “dois acampamentos” ou “acampamento duplo”, fazendo eco às palavras de Jacó: “Este é o acampamento de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; não se acrescenta um destinatário nem uma ideia como “disse consigo mesmo”, ausentes do hebraico.
- source_word: כַּאֲשֶׁר רָאָם
  choice: Quando Jacó os viu
  rationale: כַּאֲשֶׁר tem valor temporal no contexto, e o sufixo masculino plural de רָאָם retoma os anjos de Deus mencionados no versículo anterior.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: o acampamento de Deus
  rationale: A construção indica um acampamento pertencente a Deus ou associado a ele. “Acampamento” preserva a ligação lexical com o nome Maanaim.
- source_word: זֶה
  choice: Este é
  rationale: O demonstrativo funciona como predicado nominal; em português, a cópula expressa naturalmente a declaração.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: deu àquele lugar o nome de
  rationale: Expressa de modo natural em português o idiomatismo hebraico “chamou o nome daquele lugar”, sem alterar o sentido.
- source_word: מַחֲנָיִם
  choice: Maanaim
  rationale: O topônimo é transliterado no texto principal. Sua possível associação com a forma dual de מַחֲנֶה é explicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O pronome “os” mantém a referência contextual aos anjos do versículo anterior. O possível jogo de palavras no topônimo é preservado por nota, sem apresentar como certa uma etimologia que admite nuance.
