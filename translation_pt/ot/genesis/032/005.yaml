base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: pt
  text: 'E ele lhes ordenou: “Assim vocês dirão a meu senhor Esaú: ‘Assim diz seu servo Jacó: Tenho vivido como estrangeiro com Labão e permanecido até agora.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: Preserva a força diretiva de צוה; no contexto, Jacó dá aos mensageiros uma ordem específica.
- source_word: לֵאמֹר
  choice: introduzido por dois-pontos
  rationale: A fórmula hebraica de introdução da fala é representada naturalmente em português pela pontuação, evitando o redundante “ordenou, dizendo”.
- source_word: כֹּה תֹאמְרוּן
  choice: Assim vocês dirão
  rationale: Mantém a fórmula de mensagem e o valor diretivo da forma verbal, em português moderno e amplamente compreensível.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: a meu senhor Esaú
  rationale: Conserva o tratamento deferente de Jacó e entende “Esaú” como aposição natural, sem conotação divina.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz a fórmula convencional usada para transmitir uma mensagem em nome de outra pessoa.
- source_word: עַבְדְּךָ
  choice: seu servo
  rationale: No contexto diplomático, é uma autodesignação respeitosa, não necessariamente uma declaração de escravidão literal.
- source_word: גַּרְתִּי
  choice: Tenho vivido como estrangeiro
  rationale: 'Expressa a nuance de גור: residir fora da própria terra como forasteiro, nuance que “tenho morado” não deixaria explícita.'
- source_word: וָאֵחַר
  choice: e permanecido lá
  rationale: No contexto, indica a continuação da estadia até o presente; “lá” torna explícito em português o local recuperado da expressão anterior.
- source_word: עַד עָתָּה
  choice: até agora
  rationale: Equivalente temporal natural e exato em português moderno.
theological_decisions:
- issue: Sentido de “seu servo”
  choice: Tratamento deferente na fala de Jacó a Esaú
  alternative: Condição literal de servo ou escravo
  rationale: O contexto de mensagem diplomática favorece uma fórmula de humildade social, sem exigir subordinação jurídica literal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e uso de “vocês”. A estrutura de fala dentro da fala foi preservada com dois-pontos e aspas de modo claro, sem excesso de fórmulas semíticas artificiais.
