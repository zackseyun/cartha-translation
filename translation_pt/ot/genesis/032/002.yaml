  text: וְ/יַעֲקֹ֖ב הָלַ֣ךְ לְ/דַרְכּ֑/וֹ וַ/יִּפְגְּעוּ ב֖/וֹ מַלְאֲכֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: pt
  text: Jacó seguiu o seu caminho, e os anjos de Deus o encontraram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram ao encontro dele” ou “depararam-se com ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: Jacó
  rationale: O וְ dá continuidade simples à narrativa; em português, essa ligação não precisa ser expressa antes do sujeito, pois a coordenação seguinte mantém o fluxo natural.
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: seguiu o seu caminho
  rationale: A expressão hebraica indica que Jacó continuou sua jornada. Esta formulação é natural em português e preserva a ideia de prosseguimento.
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: foram ao encontro dele
  rationale: פגע com ב pode indicar encontrar, deparar-se com ou ir ao encontro de alguém. A escolha conserva o movimento narrativo sem sugerir hostilidade.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: os anjos de Deus
  rationale: Embora מַלְאָךְ também possa significar mensageiro humano, o contexto imediato, especialmente a referência ao acampamento de Deus no versículo seguinte, favorece seres celestiais. A construção hebraica é preservada de modo transparente.
theological_decisions:
- issue: Referente de מַלְאֲכֵי אֱלֹהִים
  choice: anjos celestiais
  alternative: mensageiros de Deus
  rationale: O substantivo admite ambos os sentidos, mas o contexto sobrenatural e a designação do lugar como acampamento de Deus no versículo seguinte sustentam 'anjos' no texto principal.
- issue: Nuance de וַיִּפְגְּעוּ בוֹ
  choice: foram ao encontro dele
  alternative: encontraram-no / depararam com ele
  rationale: A expressão não determina claramente se o encontro foi deliberado ou inesperado. A nota registra alternativas para não eliminar essa amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita literalismo rígido em לְדַרְכּוֹ e conserva na nota a amplitude de פגע.
