id: GEN.32.26
reference: Genesis 32:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: pt
  text: Quando viu que não conseguia vencê-lo[a], tocou na articulação do quadril dele[b][c], e a articulação do quadril de Jacó se deslocou enquanto lutava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dominá-lo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na concavidade da coxa dele”; tradicionalmente, “na cavidade da coxa dele”.'
    reason: lexical_alternative
  - marker: c
    text: Os pronomes hebraicos permanecem ambíguos; o versículo não torna a identificar explicitamente o adversário de Jacó.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quando viu
  rationale: O wayyiqtol dá continuidade à narrativa, e aqui a construção temporal em português expressa naturalmente que a percepção precedeu o toque.
- source_word: לֹא יָכֹל לוֹ
  choice: não conseguia vencê-lo
  rationale: יכל com ל indica incapacidade diante do oponente. “Vencê-lo” é natural no contexto de luta e não transforma a expressão numa afirmação de incapacidade absoluta.
- source_word: וַיִּגַּע
  choice: tocou
  rationale: נגע significa normalmente “tocar”. Embora o efeito seja forte, convém preservar o contraste produzido pelo verbo mais leve, sem traduzi-lo como “golpeou”.
- source_word: בְּכַף יְרֵכוֹ
  choice: na articulação do quadril dele
  rationale: A expressão designa a região côncava da junção entre coxa e quadril. “Articulação do quadril” comunica o referente anatômico com clareza em português moderno; “dele” preserva, tanto quanto possível, a referência pronominal do hebraico.
- source_word: וַתֵּקַע
  choice: se deslocou
  rationale: Neste contexto, o verbo indica que a articulação saiu de sua posição. A forma pronominal descreve claramente o resultado sem acrescentar a maneira exata da lesão.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: a articulação do quadril de Jacó
  rationale: Mantém coerência lexical com a ocorrência anterior e conserva a menção explícita de Jacó no hebraico.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: enquanto lutava com ele
  rationale: A construção infinitiva marca ação simultânea. A formulação é idiomática e deixa sem explicitar qual dos dois referentes é o sujeito de “lutava”, como no hebraico.
theological_decisions:
- issue: Referência dos pronomes na cena da luta
  choice: Conservar os pronomes sem identificar explicitamente o adversário de Jacó.
  alternative: Explicitar que o homem, o anjo ou o próprio Deus tocou Jacó.
  rationale: O versículo hebraico não volta a nomear o sujeito e desenvolve progressivamente a identidade e o significado do adversário. A tradução não deve resolver aqui uma tensão que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Articulação do quadril” evita uma tradução anatômica excessivamente literal e obscura, enquanto a nota registra a forma hebraica. A sequência pronominal foi mantida sem inserir “o homem”, “o anjo” ou “Deus” no texto principal.
