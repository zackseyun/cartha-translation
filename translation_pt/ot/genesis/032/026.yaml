  source_fidelity: O texto traduz adequadamente a progressão narrativa de וַיַּרְא como “Quando viu”, preserva a relação de incapacidade em לֹא יָכֹל לוֹ com “não conseguia vencê-lo” e mantém o verbo relativamente não específico “tocou” para וַיִּגַּע. “Articulação do quadril” comunica com clareza o referente anatômico de בְּכַף יְרֵכוֹ, e “se deslocou” expressa satisfatoriamente o resultado de וַתֵּקַע. A menção explícita de Jacó na segunda oração foi conservada, bem como a simultaneidade de בְּהֵאָבְקוֹ עִמּוֹ.
  naturalness: A redação é fluente, moderna e adequada ao português internacional com boa legibilidade brasileira. A repetição de “articulação do quadril” é justificável, pois espelha a repetição lexical hebraica e a nomeação explícita de Jacó.
  terminology: “Vencê-lo” é idiomático no contexto de luta sem exceder o sentido de “prevalecer contra”. “Articulação do quadril” é uma solução anatômica clara; a nota oferece as alternativas mais literais ligadas a “coxa”. Os pronomes não identificam indevidamente o oponente.
