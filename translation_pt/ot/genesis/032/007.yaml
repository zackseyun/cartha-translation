  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: pt
  text: 'Os mensageiros voltaram a Jacó[a] e disseram: “Fomos até seu irmão, até Esaú. Ele também está vindo ao seu encontro, acompanhado de quatrocentos homens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente neste contexto, “os anjos voltaram a Jacó”. A palavra hebraica מַלְאָכִים pode significar “mensageiros” ou “anjos”, mas aqui se refere aos enviados que Jacó mandou a Esaú.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: O wayyiqtol de שׁוב relata uma ação passada concluída; “voltaram” é natural e adequado ao retorno dos enviados.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: מַלְאָכִים pode designar mensageiros ou anjos, mas o contexto imediato identifica esses personagens como os enviados humanos de Jacó.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: Embora literalmente introduza a fala com “dizendo”, a coordenação verbal é mais natural em português e preserva a função discursiva.
- source_word: בָּאנוּ
  choice: fomos
  rationale: בוא significa literalmente “vir/entrar”, mas, ao relatarem a Jacó a missão feita até Esaú, “fomos até” expressa naturalmente em português o movimento para o destino.
- source_word: אֶל אָחִיךָ אֶל עֵשָׂו
  choice: até seu irmão, até Esaú
  rationale: Mantém a aposição enfática do hebraico, que primeiro menciona o vínculo familiar e depois identifica o irmão pelo nome.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Ele também está vindo ao seu encontro
  rationale: Preserva a força aditiva de גַּם, o aspecto em curso do particípio הֹלֵךְ e a ideia de movimento em direção a Jacó.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: acompanhado de quatrocentos homens
  rationale: Expressa de modo idiomático que os quatrocentos homens estão com Esaú, sem acrescentar que sejam soldados, algo que o texto não declara explicitamente.
theological_decisions:
- issue: Identidade dos מַלְאָכִים
  choice: mensageiros humanos no texto principal
  alternative: anjos
  rationale: A palavra hebraica admite ambos os sentidos, mas aqui retoma os enviados que Jacó mandou a Esaú; a alternativa lexical é registrada em nota para conservar a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Seu irmão” evita rigidez excessiva; “ao seu encontro” mantém neutralidade quanto às intenções de Esaú. A repetição “até seu irmão, até Esaú” conserva a ênfase e a aposição do hebraico.
