base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: pt
  text: Harã morreu diante de seu pai Terá[a], na terra onde havia nascido, em Ur dos caldeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antes de seu pai Terá”, isto é, enquanto seu pai ainda vivia. A expressão hebraica diz literalmente “sobre a face de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות relata diretamente um acontecimento passado; “morreu” é a forma narrativa natural em português.
- source_word: עַל־פְּנֵי
  choice: diante de
  rationale: A expressão hebraica, literalmente “sobre a face de”, pode indicar presença ou anterioridade temporal. “Diante de” preserva sua concretude sem excluir a possibilidade de que Harã tenha morrido enquanto o pai ainda vivia.
- source_word: תֶּרַח אָבִיו
  choice: seu pai Terá
  rationale: Identifica Terá como pai de Harã e emprega uma ordem natural em português.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: na terra onde havia nascido
  rationale: מוֹלֶדֶת designa a terra de nascimento ou de origem. A formulação é clara e natural, mantendo a referência ao nascimento.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: em Ur dos caldeus
  rationale: Mantém o topônimo Ur e traduz o gentílico כַּשְׂדִּים pela forma portuguesa consagrada “caldeus”.
theological_decisions: []
