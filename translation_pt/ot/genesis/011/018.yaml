  yaml_path: translation/ot/genesis/011/018.yaml
  text: Peleg lived thirty years and fathered Reu.
translation:
  language: pt
  text: Pelegue viveu trinta anos e gerou Reú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: No contexto da fórmula genealógica, חיה indica o período de vida transcorrido antes do nascimento do descendente mencionado; “viveu” é natural e fiel em português.
- source_word: פֶלֶג
  choice: Pelegue
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico, com forma legível para o público brasileiro.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trinta anos
  rationale: A expressão hebraica funciona adverbialmente para indicar a idade de Pelegue quando ocorreu o evento seguinte.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Na genealogia, ילד na forma causativa denota a geração de um descendente por parte do pai; “gerou” preserva o sentido masculino genealógico sem recorrer ao arcaico “engendrou”.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Partícula hebraica que marca o objeto direto definido e não possui equivalente lexical necessário em português.
- source_word: רְעוּ
  choice: Reú
  rationale: Transliteração portuguesa tradicional e transparente do nome pessoal hebraico, com acento para indicar a pronúncia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a concisão e o paralelismo próprios da fórmula genealógica. A redação evita explicitar “de idade”, pois isso já está implícito no hebraico e é compreensível em português.
