base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: pt
  text: Terá viveu setenta anos e gerou Abrão[a], Naor e Harã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi pai de”. O verbo hebraico usado nas genealogias não exige que os filhos tenham nascido na ordem exata em que são citados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O wayyiqtol de חיה, nesta fórmula genealógica, indica que Terá chegou à idade mencionada. “Viveu” mantém de modo natural a forma e a progressão narrativa do hebraico.
- source_word: שִׁבְעִים שָׁנָה
  choice: setenta anos
  rationale: Reproduz diretamente a expressão hebraica; em português, no contexto, fica claro que se trata da idade alcançada.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Em genealogias, ילד no causativo indica tornar-se pai ou gerar descendência. “Gerou” é conciso, corrente em registros genealógicos bíblicos e não sugere que Terá tenha dado à luz.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Abrão, Naor e Harã
  rationale: A lista portuguesa com vírgulas e a conjunção final representa naturalmente os três objetos individualmente marcados no hebraico.
- source_word: אַבְרָם
  choice: Abrão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: נָחוֹר
  choice: Naor
  rationale: Forma portuguesa amplamente usada para o nome hebraico.
- source_word: הָרָן
  choice: Harã
  rationale: Forma portuguesa tradicional do nome; o elemento inicial pertence à grafia do nome no hebraico e não é traduzido como artigo.
theological_decisions:
- issue: Sequência genealógica e implicação cronológica da idade
  choice: Aos setenta anos, Terá é apresentado como aquele que gerou Abrão, Naor e Harã, sem afirmar que a ordem da lista seja necessariamente a ordem de nascimento.
  alternative: Entender a lista como ordem cronológica estrita, ou entender que Terá começou a gerar filhos aos setenta e que os três nomes resumem seus principais descendentes.
  rationale: O hebraico associa a idade de setenta anos à notícia genealógica, mas não resolve por si só se os três nasceram então, se eram trigêmeos ou se aparecem em ordem de nascimento. A tradução mantém essa tensão sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com terminologia genealógica bíblica reconhecível. “Gerou” preserva a concisão do hebraico; a nota esclarece sua extensão sem resolver indevidamente a cronologia.
