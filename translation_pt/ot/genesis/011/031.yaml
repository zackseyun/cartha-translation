base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: pt
  text: Terá levou consigo Abrão, seu filho, Ló, filho de Harã e neto de Terá[a], e Sarai, sua nora, mulher de Abrão, seu filho. Eles partiram juntos de Ur dos caldeus para ir à terra de Canaã[b]. Chegaram até Harã e estabeleceram-se ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Ló, filho de Harã, filho de seu filho”; isto é, Ló era neto de Terá.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “eles saíram com eles”. A referência dos dois plurais é difícil; “partiram juntos” traduz o sentido da partida do grupo sem resolver essa dificuldade.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Mantém o sentido básico de לקח e a simplicidade da narrativa; o contexto indica que Terá levou consigo os familiares mencionados.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Ló, filho de Harã, filho de seu filho
  rationale: Preserva a formulação hebraica incomum e a cadeia de parentesco sem substituir no texto a expressão por uma interpretação explicativa.
- source_word: כַּלָּתוֹ
  choice: sua nora
  rationale: Equivalente português natural e preciso para a relação de Sarai com Terá.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: eles saíram com eles
  rationale: Reproduz tanto o verbo plural quanto o pronome plural do texto massorético, preservando a referência difícil em vez de resolvê-la silenciosamente.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: de Ur dos caldeus
  rationale: Forma corrente em português para o topônimo e o gentílico.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: para ir à terra de Canaã
  rationale: Expressa de modo natural a finalidade e o destino indicados pelo infinitivo e pela terminação direcional.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: Chegaram até Harã
  rationale: Conserva o valor de עַד, que apresenta Harã como o ponto até o qual chegaram.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: se estabeleceram ali
  rationale: No contexto migratório, ישב indica residência ou estabelecimento, não apenas uma parada breve.
theological_decisions:
- issue: Referência de וַיֵּצְאוּ אִתָּם ('eles saíram com eles')
  choice: Preservar no texto a construção plural potencialmente sobreposta
  alternative: eles partiram juntos
  rationale: A construção do texto massorético é difícil, mas uma paráfrase como 'juntos' eliminaria a tensão textual. A nota informa a alternativa idiomática sem escolher uma reconstrução textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto a sequência hebraica; as duas construções incomuns são mantidas no texto e esclarecidas em notas, sem introduzir o contraste ausente de um adversativo como “mas”.
