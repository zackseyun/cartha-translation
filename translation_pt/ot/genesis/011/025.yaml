  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: pt
  text: Depois que gerou Terá, Naor viveu cento e dezenove anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica a continuação da vida após o nascimento do descendente mencionado; “viveu” é natural e fiel em português.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Depois que gerou
  rationale: A construção assinala o período posterior ao nascimento de Terá e mantém o sentido ativo de ילד sem recorrer ao arcaísmo “gerou a” ou a uma perífrase mais longa.
- source_word: תֶּרַח
  choice: Terá
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: cento e dezenove anos
  rationale: O hebraico apresenta dezenove mais cem; a ordem portuguesa convencional põe a centena primeiro.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Preserva a repetição lexical de ילד na fórmula genealógica e expressa de modo conciso a paternidade biológica.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a referência explícita do hebraico a descendentes de ambos os sexos, em vez de generalizar como “filhos” ou “crianças”.
