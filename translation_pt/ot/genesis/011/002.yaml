  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: pt
  text: Ao partirem do leste[a], encontraram uma planície na terra de Sinar e se estabeleceram ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao seguirem para o leste». A expressão hebraica מִקֶּדֶם pode indicar tanto a procedência («do leste») quanto a direção («para o leste»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Ao partirem
  rationale: A construção introduz a circunstância temporal da ação seguinte. Em português atual, «ao partirem» comunica naturalmente o deslocamento indicado por נסע sem reproduzir de modo rígido a fórmula וַיְהִי.
- source_word: מִקֶּדֶם
  choice: do leste
  rationale: A preposição מִן favorece a ideia de origem, «do leste», embora a expressão também possa indicar direção, «para o leste»; essa ambiguidade é preservada em nota.
- source_word: וַיִּמְצְאוּ
  choice: encontraram
  rationale: Tradução direta e natural de מצא neste contexto.
- source_word: בִקְעָה
  choice: uma planície
  rationale: O termo designa uma extensão baixa e ampla, uma planície ou vale largo; «planície» se ajusta bem ao contexto geográfico.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: na terra de Sinar
  rationale: Mantém אֶרֶץ como designação geográfica e translitera o topônimo שִׁנְעָר na forma portuguesa tradicional.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: e se estabeleceram ali
  rationale: No contexto de deslocamento, ישב comunica não apenas habitar, mas fixar residência; «se estabeleceram» expressa esse sentido com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe temporal foi simplificada naturalmente, e a ambiguidade geográfica do hebraico foi mantida por meio de nota.
