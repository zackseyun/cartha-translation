  text: וַ/יֵּ֣רֶד יְהוָ֔ה לִ/רְאֹ֥ת אֶת הָ/עִ֖יר וְ/אֶת הַ/מִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: pt
  text: Então Yahweh desceu para ver a cidade e a torre que os seres humanos haviam construído[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos do homem”. A expressão hebraica se refere coletivamente aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Então ... desceu
  rationale: Preserva o sentido concreto de ירד e a progressão narrativa do waw consecutivo, sem suavizar o antropomorfismo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לִרְאֹת
  choice: para ver
  rationale: Tradução direta que preserva a simplicidade e a ironia narrativa; 'inspecionar' acrescentaria interpretação.
- source_word: הָעִיר
  choice: a cidade
  rationale: Equivalente português direto e corrente de עִיר.
- source_word: הַמִּגְדָּל
  choice: a torre
  rationale: Equivalente português padrão de מִגְדָּל.
- source_word: אֲשֶׁר בָּנוּ
  choice: que ... haviam construído
  rationale: A oração relativa é natural em português, e o mais-que-perfeito composto situa a construção antes da descida narrada.
- source_word: בְּנֵי הָאָדָם
  choice: os filhos do ser humano
  rationale: Conserva a forma metafórica e masculina do hebraico, ao mesmo tempo que 'ser humano' comunica melhor o valor coletivo de אָדָם no português moderno.
theological_decisions:
- issue: Descrição antropomórfica de Yahweh descendo
  choice: Manter 'Yahweh desceu' em sentido concreto.
  alternative: Yahweh olhou lá de cima / voltou sua atenção
  rationale: O hebraico apresenta deliberadamente a descida em linguagem antropomórfica; a tradução não deve eliminar essa tensão literária e teológica.
- issue: Sentido coletivo de בְּנֵי הָאָדָם
  choice: Usar 'os filhos do ser humano' no texto principal.
  alternative: os seres humanos / a humanidade / as pessoas
  rationale: A opção principal preserva a expressão hebraica, enquanto a nota esclarece que ela abrange coletivamente os seres humanos, sem restringi-la apenas aos homens.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A formulação conserva o nome divino, o antropomorfismo e a expressão hebraica incomum, esclarecida em nota.
