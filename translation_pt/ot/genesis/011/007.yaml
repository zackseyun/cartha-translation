  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: pt
  text: Vamos! Desçamos e confundamos ali a língua deles, para que um não entenda a língua do outro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Venham!
  rationale: Convite/exortação idiomática que introduz uma ação conjunta; o plural em português concorda naturalmente com os verbos seguintes.
- source_word: נֵרְדָה
  choice: Desçamos
  rationale: Preserva a forma coortativa na primeira pessoa do plural e o sentido espacial de descer.
- source_word: וְנָבְלָה
  choice: e confundamos
  rationale: Expressa o coortativo e o sentido contextual de tornar a fala incompreensível.
- source_word: שְׂפָתָם
  choice: a língua deles
  rationale: Embora שָׂפָה signifique literalmente 'lábio', aqui designa idioma ou fala; 'língua' mantém a imagem lexical e é natural em português.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: ninguém entenda a língua do seu próximo
  rationale: A construção distributiva literal 'um homem... de seu próximo' é vertida idiomaticamente como 'ninguém... do seu próximo', sem restringir o referente ao sexo masculino.
theological_decisions:
- issue: Plural divino em נֵרְדָה וְנָבְלָה
  choice: Desçamos e confundamos
  alternative: Eu descerei e confundirei
  rationale: Mantém o plural explícito do hebraico e sua tensão interpretativa, sem determinar se se trata de plural deliberativo, conselho celestial ou outra leitura teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A exclamação em 'Venham!' comunica a força exortativa de הָבָה; 'próximo' preserva a relação interpessoal de רֵעַ sem o possível estreitamento de 'vizinho'.
