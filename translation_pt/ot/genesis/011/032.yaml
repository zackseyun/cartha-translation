- source_word: תֶרַח
  choice: Terá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: duzentos e cinco anos
  rationale: Reordena o numeral segundo o uso natural do português e uniformiza 'ano' no plural.
- source_word: וַיָּמָת
  choice: morreu
  rationale: Traduz diretamente o verbo מות, sem introduzir um eufemismo ausente do hebraico.
- source_word: בְּחָרָן
  choice: em Harã
  rationale: A preposição בְּ indica naturalmente o lugar onde ocorreu a morte; 'Harã' é a forma portuguesa tradicional do topônimo.
