base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Pelegue, Éber viveu mais quatrocentos e trinta anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu mais
  rationale: Na fórmula genealógica, חיה indica a duração da vida. O advérbio «mais» expressa naturalmente em português que esse período ocorreu depois do nascimento de Pelegue, sem alterar a duração indicada.
- source_word: עֵבֶר
  choice: Éber
  rationale: Transliteração portuguesa clara do nome hebraico, com acento gráfico para preservar a pronúncia da sílaba tônica.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: Depois de gerar Pelegue
  rationale: A construção temporal é antecipada para produzir uma frase natural em português. «Gerar» preserva o sentido paterno de הוליד no contexto genealógico.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatrocentos e trinta anos
  rationale: A ordem numérica foi ajustada ao uso corrente do português, mantendo exatamente o total de 430 anos.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Mantém o sentido genealógico explícito do verbo ילד e a ligação lexical com a primeira ocorrência do mesmo radical no versículo.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Reproduz a menção explícita, no hebraico, tanto aos descendentes do sexo masculino quanto aos do sexo feminino.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe temporal natural. A anteposição de «Depois de gerar Pelegue» evita ambiguidade estrutural, e «viveu mais» deixa claro que os 430 anos se seguem ao nascimento mencionado.
