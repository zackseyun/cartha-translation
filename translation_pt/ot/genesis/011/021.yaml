  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Serug, Reú viveu mais duzentos e sete anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu mais
  rationale: Na fórmula genealógica, חיה indica que Reú continuou vivendo após o nascimento mencionado; “viveu mais” expressa isso com naturalidade em português.
- source_word: רְעוּ
  choice: Reú
  rationale: Forma portuguesa corrente do nome hebraico, com acento gráfico para indicar a pronúncia.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Depois de gerar
  rationale: A construção significa “depois de ele gerar”; “gerar” preserva o sentido genealógico masculino de ילד no hifil e é corrente em português bíblico moderno.
- source_word: אֶת שְׂרוּג
  choice: Serug
  rationale: A partícula de objeto direto אֶת não é traduzida; o nome é transliterado como “Serug”.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: duzentos e sete anos
  rationale: A ordem numérica é ajustada ao uso natural do português, sem alterar o valor do hebraico.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Com sujeito masculino nesta genealogia, ילד no hifil significa gerar ou tornar-se pai; “gerou” mantém a precisão e a concisão da fórmula.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: O hebraico nomeia explicitamente descendentes dos dois sexos, distinção preservada na tradução.
