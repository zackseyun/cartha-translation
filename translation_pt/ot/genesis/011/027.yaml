  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: pt
  text: 'Estas são as gerações de Terá: Terá gerou Abrão, Naor e Harã; e Harã gerou Ló.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: Introduz uma nova seção genealógica. A conjunção hebraica pode funcionar como ligação discursiva e não precisa ser representada por um “e” inicial em português.
- source_word: תּוֹלְדֹת
  choice: as gerações de
  rationale: Preserva a fórmula estrutural recorrente de Gênesis e sua amplitude, sem restringi-la apenas a descendentes nem convertê-la interpretativamente em “história”.
- source_word: תֶּרַח
  choice: Terá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הוֹלִיד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד expressa a geração ou paternidade. “Gerou” é conciso, corrente em genealogias bíblicas e mantém a repetição do verbo hebraico.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Abrão, Naor e Harã
  rationale: Os marcadores de objeto direto não são lexicalizados em português; os nomes seguem formas portuguesas bíblicas reconhecíveis.
- source_word: וְהָרָן
  choice: e Harã
  rationale: Traduz diretamente a coordenação entre as duas declarações genealógicas, sem acrescentar um marcador temporal ou discursivo inexistente.
- source_word: הוֹלִיד אֶת לוֹט
  choice: gerou Ló
  rationale: Mantém a mesma tradução do verbo genealógico e emprega a forma portuguesa tradicional do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula genealógica tradicional “as gerações de”. A repetição de “Terá” e “Harã” foi preservada por refletir a estrutura enfática e encadeada do hebraico.
