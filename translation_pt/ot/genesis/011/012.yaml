lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: E Arfaxade
  rationale: A conjunção וְ foi preservada como «E» para manter a sequência genealógica. «Arfaxade» é a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: חַי
  choice: viveu
  rationale: Na fórmula genealógica, חיה indica ter vivido até a idade mencionada; «viveu» é natural e exato em português.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: trinta e cinco anos
  rationale: Embora a ordem literal hebraica seja «cinco e trinta anos», a ordem numérica corrente em português comunica o mesmo sentido com clareza.
- source_word: וַ/יּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, a forma causativa de ילד significa gerar ou tornar-se pai de alguém. «Gerou» é conciso, digno e tradicional sem ser arcaico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: אֶת é o marcador hebraico do objeto direto definido e não requer equivalente lexical em português.
- source_word: שָׁלַח
  choice: Selá
  rationale: «Selá» representa em português a forma hebraica שָׁלַח. A nota registra a variante tradicional «Salá» encontrada em outras tradições.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. Conserva-se a ligação narrativa por meio de «E» e empregam-se as formas onomásticas portuguesas reconhecidas. Não se incluiu nota sobre a ordem literal do numeral nem sobre alternativas para «gerou», pois essas informações não são necessárias para compreender o hebraico e poderiam sobrecarregar um versículo simples.
