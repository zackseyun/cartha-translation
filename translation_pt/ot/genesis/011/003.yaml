base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: pt
  text: 'E disseram uns aos outros: “Vamos fazer tijolos e queimá-los bem.” O tijolo lhes serviu de pedra, e o betume[a], de argamassa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O betume é uma substância semelhante ao asfalto natural, usada na construção.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: uns aos outros
  rationale: A expressão distributiva significa literalmente algo como “cada um ao seu companheiro”; “uns aos outros” comunica esse sentido de modo natural e inclusivo em português.
- source_word: הָבָה
  choice: Vamos
  rationale: A partícula introduz uma exortação coletiva. “Vamos” é corrente e se integra naturalmente aos coortativos seguintes.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: fazer tijolos
  rationale: O verbo denominativo indica a fabricação de tijolos; esta formulação é clara e idiomática.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: e queimá-los bem
  rationale: A construção com termo cognato intensifica a ação. “Bem” transmite que os tijolos deveriam ser completamente cozidos ou queimados, sem tornar a frase técnica demais.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: O tijolo lhes serviu de pedra
  rationale: 'A construção היה + ל expressa substituição funcional: o tijolo ocupava o lugar da pedra como material de construção.'
- source_word: הַחֵמָר
  choice: betume
  rationale: O termo designa betume ou uma substância semelhante ao asfalto natural, usada como ligante e impermeabilizante na construção.
- source_word: לַחֹמֶר
  choice: de argamassa
  rationale: Neste contexto de construção, חֹמֶר designa a função de material ligante; “argamassa” comunica essa função com precisão.
