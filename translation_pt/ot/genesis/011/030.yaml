  text: וַ/תְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖/הּ וָלָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: pt
  text: Sarai era estéril[a]; não tinha filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E Sarai era estéril; não tinha descendência».'
    reason: Alternativa lexical e possibilidade de explicitar a conjunção hebraica.
lexical_decisions:
- source_word: וַתְּהִי
  choice: era
  rationale: O wayyiqtol de היה introduz ou prossegue esta informação circunstancial; em português, o imperfeito «era» expressa naturalmente o estado contínuo, sem acrescentar um marcador temporal ausente do hebraico.
- source_word: שָׂרַי
  choice: Sarai
  rationale: O nome pessoal é transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: עֲקָרָה
  choice: estéril
  rationale: O adjetivo indica incapacidade de gerar filhos. «Estéril» é conciso, corrente e distinto da oração explicativa seguinte.
- source_word: אֵין לָהּ
  choice: não tinha
  rationale: A construção existencial negativa com ל e sufixo pronominal expressa posse negativa e se verte idiomaticamente como «não tinha».
- source_word: וָלָד
  choice: filhos
  rationale: O substantivo singular coletivo ou genérico designa aquilo que nasce, isto é, descendência. Em português, «não tinha filhos» é a formulação natural; a nota registra a alternativa mais formal «descendência».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Estéril» preserva o sentido direto do hebraico, enquanto «não tinha filhos» evita uma formulação artificial. O conectivo וַ não foi explicitado no texto principal porque a ligação narrativa já é natural no contexto.
