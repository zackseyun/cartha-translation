  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Éber, Selá viveu 403 anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica a duração da vida; “viveu” é natural e fiel em português.
- source_word: שֶׁלַח
  choice: Selá
  rationale: Forma tradicional em português que representa adequadamente o nome hebraico שֶׁלַח.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: depois de gerar
  rationale: O hifil de ילד, com sujeito masculino em contexto genealógico, expressa a geração ou paternidade; “gerar” preserva esse sentido de modo conciso.
- source_word: אֶת עֵבֶר
  choice: Éber
  rationale: A partícula de objeto direto não é traduzida; “Éber” reproduz o nome hebraico עֵבֶר em forma corrente em português.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 anos
  rationale: A expressão numérica hebraica significa quatrocentos e três anos; os algarismos comunicam o valor com clareza e acompanham o estilo genealógico.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Com sujeito masculino na fórmula genealógica, ילד significa gerar descendentes; a repetição de “gerar” mantém precisão lexical e fluidez.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a referência explícita do hebraico a descendentes de ambos os sexos.
