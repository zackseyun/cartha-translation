  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: pt
  text: Assim, Yahweh os dispersou dali por toda a face da terra[a], e eles pararam de construir a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por toda a terra” ou “por toda a extensão da terra”; literalmente, “sobre a face de toda a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: dispersou
  rationale: O verbo פוץ, em forma causativa neste contexto, indica fazer com que pessoas se espalhem. “Dispersou” é natural e preserva o sentido de juízo do episódio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִשָּׁם
  choice: dali
  rationale: Expressão locativa direta e idiomática em português, retomando o lugar da construção.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: por toda a face da terra
  rationale: Mantém a imagem hebraica de “face” e expressa de modo compreensível a extensão da dispersão.
- source_word: וַיַּחְדְּלוּ
  choice: pararam
  rationale: חדל significa cessar ou parar; “pararam” é corrente e combina naturalmente com o infinitivo seguinte.
- source_word: לִבְנֹת
  choice: de construir
  rationale: A construção portuguesa “parar de + infinitivo” transmite de modo idiomático o infinitivo hebraico.
- source_word: הָעִיר
  choice: a cidade
  rationale: O substantivo definido se refere à cidade que vinha sendo construída no contexto imediato.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a forma “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Assim” liga naturalmente o versículo ao anterior; a expressão “face da terra” conserva a imagem do hebraico sem comprometer a compreensão.
