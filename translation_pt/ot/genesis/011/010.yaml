  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: pt
  text: Estas são as gerações de Sem. Sem tinha cem anos de idade quando gerou Arpachshad[a], dois anos depois do dilúvio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, esse nome também é escrito Arfaxade em traduções portuguesas, forma influenciada pela tradição grega, e não uma transliteração direta do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: Estas são as gerações de Sem
  rationale: Mantém no plural a fórmula estrutural recorrente de Gênesis e preserva seu sentido genealógico sem recorrer a uma paráfrase interpretativa.
- source_word: שֵׁם בֶּן מְאַת שָׁנָה
  choice: Sem tinha cem anos de idade
  rationale: Traduz de modo natural em português o idiomatismo hebraico que, literalmente, diz 'filho de cem anos'.
- source_word: וַיּוֹלֶד
  choice: quando gerou
  rationale: O hifil de ילד, em contexto genealógico, indica que Sem se tornou pai de Arpachshad. 'Gerou' é conciso, digno e corrente no registro bíblico português; a construção com 'quando' expressa naturalmente a relação entre idade e nascimento.
- source_word: אַרְפַּכְשָׁד
  choice: Arpachshad
  rationale: Translitera diretamente o nome hebraico, sem adotar a forma tradicional derivada do grego.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: dois anos depois do dilúvio
  rationale: Reproduz com clareza a indicação temporal; 'dilúvio' é a designação natural e amplamente reconhecida em português para o acontecimento narrado anteriormente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a fórmula genealógica tradicional 'Estas são as gerações', enquanto a sintaxe da idade é apresentada de maneira idiomática. O marcador [a] aparece imediatamente após o nome a que se refere.
