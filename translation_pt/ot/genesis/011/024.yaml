  text: Naor viveu vinte e nove anos e gerou Terá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o wayyiqtol de חיה indica o período de vida transcorrido antes do acontecimento seguinte; “viveu” é natural e fiel em português.
- source_word: נָחוֹר
  choice: Naor
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: vinte e nove anos
  rationale: A ordem numérica hebraica, literalmente “nove e vinte”, é reorganizada segundo o uso natural do português; o singular hebraico שָׁנָה após o numeral composto corresponde naturalmente ao plural “anos”.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No hifil de ילד e em contexto genealógico, o verbo significa que o homem se tornou pai de alguém. “Gerou” é conciso, digno e tradicional sem ser obscuro.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: A partícula marca o objeto direto definido e não possui equivalente lexical independente em português.
- source_word: תָּרַח
  choice: Terá
  rationale: Forma portuguesa corrente do nome pessoal hebraico.
