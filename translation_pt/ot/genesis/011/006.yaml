  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: pt
  text: 'E Yahweh disse: “Eis que eles são um só povo, e todos têm uma só língua. Isto é o que começaram a fazer. Agora, nada do que planejarem fazer lhes será impossível[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nada do que planejarem fazer lhes será vedado”.'
    reason: Alternativa lexical para לֹא יִבָּצֵר מֵהֶם, que pode indicar tanto não ser impossível quanto não ser vedado, retido ou impedido.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o de títulos como “Senhor” e preservando sua função no texto hebraico.
- source_word: הֵן
  choice: Vejam
  rationale: Reproduz de modo atual e digno a partícula que chama atenção para a observação divina.
- source_word: עַם אֶחָד
  choice: um só povo
  rationale: Mantém o sentido de um grupo humano unificado, sem sugerir necessariamente uma nação política.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: todos têm uma só língua
  rationale: Traduz idiomaticamente שָׂפָה, literalmente “lábio”, como “língua”, preservando a ênfase coletiva.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Isto é apenas o começo do que farão
  rationale: Expressa o valor incoativo de חלל e a projeção para empreendimentos futuros implícita na sequência narrativa.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: nada ... lhes será impossível
  rationale: Verte idiomaticamente o nifal de בצר como impossibilidade ou inacessibilidade, adequado ao contexto da capacidade coletiva.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: nada do que planejarem fazer
  rationale: יזם indica conceber, intentar ou planejar; “planejarem” é natural e preserva o caráter intencional.
theological_decisions:
- issue: Alcance da afirmação sobre a capacidade humana unificada
  choice: A declaração se refere, no contexto narrativo, aos projetos que a humanidade unificada planejar, sem atribuir-lhe onipotência nem aprovar sua obra.
  alternative: Entender que nada lhes será impedido ou retido.
  rationale: O hebraico admite tanto a ideia de impossibilidade quanto a de impedimento. O texto principal preserva a forte afirmação contextual, e a nota registra a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vejam” conserva a força deíctica sem o arcaísmo de “Eis”. A formulação evita explicar além do hebraico e mantém sua tensão sobre o alcance da capacidade humana.
