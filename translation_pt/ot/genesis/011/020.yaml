lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o wayyiqtol de חיה indica que Reú chegou à idade declarada antes de gerar o descendente; “viveu” preserva a formulação hebraica com naturalidade em português.
- source_word: רְעוּ
  choice: Reú
  rationale: Transliteração portuguesa corrente do nome hebraico, com acento gráfico para indicar a tonicidade e evitar leitura como ditongo.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: trinta e dois anos
  rationale: O hebraico diz literalmente “dois e trinta anos”; a ordem foi ajustada ao uso natural do português, preservando exatamente o valor numérico.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, o hifil de ילד exprime a geração paterna. “Gerou” é conciso, digno e tradicional sem ser arcaico.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto definido, representado pela sintaxe portuguesa sem equivalente lexical independente.
- source_word: שְׂרוּג
  choice: Serugue
  rationale: Forma aportuguesada que representa o nome hebraico e usa “-gue” para conservar o som final /g/ diante de leitura portuguesa.
