  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: pt
  text: Depois de gerar Arfaxade, Sem viveu quinhentos anos e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: No contexto genealógico, o verbo חיה indica a continuação da vida durante o período especificado; «viveu» é a formulação portuguesa natural e exata.
- source_word: שֵׁם
  choice: Sem
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַחֲרֵי
  choice: Depois de
  rationale: A preposição temporal assinala o período posterior ao nascimento de Arfaxade; esta construção permite uma frase clara em português.
- source_word: הוֹלִידוֹ
  choice: gerar
  rationale: O hifil de ילד, com sujeito masculino nas genealogias, expressa a geração de um descendente. «Gerar» preserva esse sentido e é corrente no registro bíblico digno.
- source_word: אַרְפַּכְשָׁד
  choice: Arfaxade
  rationale: Emprega-se a forma portuguesa tradicional e reconhecível do nome.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: quinhentos anos
  rationale: Tradução direta e idiomática da expressão numérica de duração.
- source_word: וַיּוֹלֶד
  choice: e gerou
  rationale: Mantém o sentido genealógico de ילד e a correspondência lexical com הוֹלִידוֹ, sem recorrer ao arcaísmo «engendrou».
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: O hebraico menciona explicitamente descendentes dos dois sexos; a tradução conserva essa especificidade.
theological_decisions: []
