  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem inicial «Depois de gerar Arfaxade» reproduz naturalmente a relação temporal do hebraico e evita uma construção pesada. Não são necessárias notas textuais ou explicativas.
