base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: pt
  text: Abrão e Naor tomaram esposas para si.[a] O nome da esposa de Abrão era Sarai, e o nome da esposa de Naor era Milca, filha de Harã, pai de Milca e de Iscá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Abrão e Naor se casaram”. O hebraico diz literalmente: “tomaram esposas para si”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... לָהֶם נָשִׁים
  choice: tomaram para si mulheres por esposas
  rationale: Preserva o idiomatismo hebraico de “tomar” e o valor reflexivo de לָהֶם, ao mesmo tempo que “por esposas” esclarece em português atual a relação matrimonial.
- source_word: שֵׁם אֵשֶׁת
  choice: o nome da mulher de
  rationale: Mantém a construção nominal repetida do hebraico; em português, “mulher de” designa naturalmente a esposa sem tornar a frase excessivamente pesada.
- source_word: שָׂרָי
  choice: Sarai
  rationale: Transliteração tradicional e amplamente reconhecida em português.
- source_word: מִלְכָּה
  choice: Milca
  rationale: Forma tradicional do nome nas traduções bíblicas em português.
- source_word: בַּת הָרָן
  choice: filha de Harã
  rationale: Tradução direta do termo filial e forma tradicional portuguesa do nome próprio.
- source_word: אֲבִי מִלְכָּה וַאֲבִי יִסְכָּה
  choice: pai de Milca e de Iscá
  rationale: Reproduz a identificação genealógica e conserva o paralelismo por meio da repetição de “de”.
- source_word: יִסְכָּה
  choice: Iscá
  rationale: Transliteração portuguesa clara e próxima da forma hebraica.
