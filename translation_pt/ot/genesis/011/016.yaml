  text: Éber viveu trinta e quatro anos e gerou Pelegue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o wayyiqtol de חיה indica o período vivido antes do nascimento do descendente mencionado; “viveu” é natural e exato em português.
- source_word: עֵבֶר
  choice: Éber
  rationale: Transliteração corrente do nome hebraico, com acento gráfico para orientar a pronúncia em português.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: trinta e quatro anos
  rationale: A ordem hebraica é literalmente “quatro e trinta”, mas a ordem natural em português preserva o valor numérico exato.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, a forma causativa de ילד, com sujeito masculino, significa gerar um descendente; “gerou” é conciso, digno e corrente na linguagem bíblica em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, representado pela sintaxe normal do português.
- source_word: פָּלֶג
  choice: Pelegue
  rationale: Forma portuguesa legível que representa o nome hebraico e evita que o g final seja pronunciado de modo estranho à fonologia do português.
