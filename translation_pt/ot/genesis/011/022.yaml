lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Do verbo חיה no wayyiqtol, introduz a idade na fórmula genealógica; “viveu” preserva de modo natural e conciso a construção hebraica.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Nome pessoal transliterado em forma corrente e reconhecível em português.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trinta anos
  rationale: Expressão idiomática hebraica de idade; em português, “viveu trinta anos” comunica naturalmente que Serug chegou aos trinta anos antes do nascimento mencionado.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: O hifil de ילד é fórmula característica das genealogias. “Gerou” é corrente no registro bíblico português, conciso e preserva a relação de descendência sem a expansão interpretativa de “tornou-se pai de”.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, representado pela sintaxe portuguesa em “gerou Naor”.
- source_word: נָחוֹר
  choice: Naor
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal hebraico.
