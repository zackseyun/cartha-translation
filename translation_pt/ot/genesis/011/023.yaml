lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, חיה indica a duração da vida; «viveu» é a correspondência natural e digna em português.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אַחֲרֵי
  choice: depois de
  rationale: Expressa de modo natural a relação temporal de posterioridade.
- source_word: הוֹלִידוֹ
  choice: gerar Naor
  rationale: O hifil de ילד, em genealogias, apresenta o homem como progenitor. «Gerar» é conciso, preciso e apropriado ao registro bíblico.
- source_word: נָחוֹר
  choice: Naor
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: מָאתַיִם שָׁנָה
  choice: duzentos anos
  rationale: Reproduz a duração numérica em português idiomático.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Mantém a correspondência com o mesmo verbo genealógico usado anteriormente, sem recorrer a linguagem arcaica.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Preserva a menção explícita dos descendentes de ambos os sexos.
