  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: pt
  text: Arpaxade viveu 403 anos depois de gerar Selá e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, חיה indica a continuação da vida após o nascimento do descendente mencionado; “viveu” é claro e natural em português.
- source_word: אַרְפַּכְשַׁד
  choice: Arpaxade
  rationale: Transliteração portuguesa próxima da forma hebraica, com “x” representando o som de שׁ e terminação adaptada à leitura natural em português.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: depois de gerar
  rationale: A construção situa os anos seguintes ao nascimento de Selá. “Gerar” preserva o sentido procriativo masculino do hifil de ילד e é idiomático em genealogias.
- source_word: אֶת שֶׁלַח
  choice: Selá
  rationale: O marcador de objeto direto não é traduzido; o nome é transliterado de modo legível em português, com acento para indicar a sílaba tônica final.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 anos
  rationale: A ordem numérica hebraica corresponde exatamente a quatrocentos e três anos; algarismos favorecem a leitura sem alterar o valor.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: No contexto genealógico, ילד com sujeito masculino se refere à procriação. “Gerou” é preciso, corrente e mais específico que “teve”.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a referência explícita do hebraico tanto aos descendentes masculinos quanto aos femininos.
