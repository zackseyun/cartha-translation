lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Selá
  rationale: Transliteração portuguesa corrente do nome hebraico שֶׁלַח, adequada ao contexto genealógico.
- source_word: חַי
  choice: viveu
  rationale: O qal perfeito de חיה, nesta fórmula genealógica, indica o período vivido até o acontecimento seguinte; “viveu” é natural e fiel.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trinta anos
  rationale: Reproduz de modo natural a expressão hebraica de duração ou idade, sem expansão desnecessária.
- source_word: וַ/יּוֹלֶד
  choice: gerou
  rationale: O hifil de ילד em genealogias indica a paternidade; “gerou” é conciso, digno e tradicional sem ser obscuro.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Partícula que marca o objeto direto definido e não requer equivalente independente em português.
- source_word: עֵבֶר
  choice: Éber
  rationale: Transliteração direta e corrente em português do hebraico עֵבֶר, com acento gráfico para indicar a pronúncia.
