  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: pt
  text: 'E disseram: “Vamos! Construamos para nós uma cidade e uma torre com o topo nos céus[a], e façamos para nós um nome, para que não sejamos espalhados pela face de toda a terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo topo alcance os céus”. Literalmente, o hebraico diz: “e seu topo nos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que não sejamos dispersos pela face de toda a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Venham
  rationale: Interjeição exortativa que convida o grupo à ação conjunta; “Venham” é corrente e preserva a força do hebraico.
- source_word: נִבְנֶה לָּנוּ
  choice: vamos construir para nós
  rationale: A forma volitiva na primeira pessoa do plural expressa exortação conjunta, enquanto לָּנוּ indica que a construção se destina ao próprio grupo.
- source_word: עִיר
  choice: cidade
  rationale: Equivalente comum para um assentamento urbano e apropriado à escala da narrativa.
- source_word: מִגְדָּל
  choice: torre
  rationale: Traduz o sentido básico sem acrescentar uma função militar que o contexto não especifica.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: cujo topo esteja nos céus
  rationale: Preserva a imagem literal de localização no hebraico e a forma plural de שָּׁמַיִם, sem inserir explicitamente a ideia de “alcançar”.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: Façamos também um nome para nós mesmos
  rationale: Mantém a expressão figurada hebraica “fazer um nome”, compreensível em português como adquirir fama ou renome, sem reduzir sua força literária a “reputação”.
- source_word: פֶּן
  choice: para que não
  rationale: Expressa de modo natural em português a finalidade negativa ou o resultado temido introduzido por פֶּן.
- source_word: נָפוּץ
  choice: sejamos espalhados
  rationale: A construção passiva comunica adequadamente o receio de serem dispersos, mantendo a ligação temática com o restante da narrativa.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: pela face de toda a terra
  rationale: Conserva a imagem idiomática hebraica e, no contexto primevo, entende הָאָרֶץ como a terra habitada em sua totalidade.
theological_decisions:
- issue: Alcance de הָאָרֶץ na narrativa de Babel
  choice: terra
  alternative: território
  rationale: O contexto primevo de Gênesis 11 trata da dispersão da humanidade pelo mundo habitado, não apenas por uma região local.
- issue: Sentido da expressão sobre o topo da torre
  choice: cujo topo esteja nos céus
  alternative: cujo topo alcance os céus
  rationale: O hebraico afirma literalmente que o topo está “nos céus”, sem verbo explícito de alcançar; a tradução preserva essa imagem e deixa aberta sua dimensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Venham, vamos construir” reproduz naturalmente a sequência exortativa; “face de toda a terra” mantém a imagem literária do hebraico. Todos os marcadores de nota aparecem no texto.
