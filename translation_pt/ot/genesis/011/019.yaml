  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: pt
  text: E Peleg viveu duzentos e nove anos depois de gerar Reú, e gerou filhos e filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: Na fórmula genealógica, o verbo חיה indica o período de vida transcorrido depois do nascimento do descendente mencionado.
- source_word: אַחֲרֵי
  choice: depois de
  rationale: Expressa de modo natural em português a relação temporal posterior ao nascimento de Reú.
- source_word: הוֹלִידוֹ
  choice: gerar
  rationale: O hifil de ילד, com Peleg como sujeito masculino, denota a geração do descendente; “gerar” preserva o sentido genealógico e é corrente em português.
- source_word: אֶת רְעוּ
  choice: Reú
  rationale: O marcador de objeto direto introduz o nome próprio, transliterado na forma portuguesa tradicional e com acento para indicar a pronúncia.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: duzentos e nove anos
  rationale: A ordem numérica é ajustada ao uso natural do português, sem alterar o valor de 209 anos.
- source_word: וַיּוֹלֶד
  choice: gerou
  rationale: Mantém a correspondência com a ocorrência anterior de ילד e preserva o papel paterno expresso pela forma verbal.
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Reproduz explicitamente os descendentes masculinos e femininos mencionados no hebraico, em vez de generalizá-los como “filhos” ou “crianças”.
