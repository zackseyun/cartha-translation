  text: The whole earth had one language and the same words[a].
translation:
  language: pt
  text: Toda a terra tinha uma só língua e as mesmas palavras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e um mesmo conjunto de palavras»; ou: «e a mesma maneira de falar». Literalmente: «e palavras as mesmas/umas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: tinha
  rationale: A forma narrativa de היה introduz a situação de fundo; em português corrente, o imperfeito comunica naturalmente o estado existente, sem recorrer ao arcaizante «e aconteceu que».
- source_word: כָל הָאָרֶץ
  choice: Toda a terra
  rationale: Neste contexto, אֶרֶץ tem alcance amplo, referente ao mundo humano, e כָל expressa a totalidade.
- source_word: שָׂפָה אֶחָת
  choice: uma só língua
  rationale: Embora שָׂפָה signifique literalmente «lábio», aqui é uma expressão idiomática para língua ou linguagem; «uma só língua» preserva com clareza a unidade indicada por אֶחָת.
- source_word: וּדְבָרִים אֲחָדִים
  choice: e as mesmas palavras
  rationale: A tradução mantém o sentido lexical usual de דְּבָרִים, «palavras», e expressa a uniformidade de אֲחָדִים sem fundir a frase com a referência anterior à língua.
