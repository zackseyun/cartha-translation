translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto para leitores brasileiros quanto para um público lusófono amplo. O marcador narrativo hebraico foi integrado ao verbo no imperfeito, sem acrescentar um advérbio temporal ausente do original.
