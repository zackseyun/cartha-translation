id: GEN.11.9
reference: Genesis 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: pt
  text: Por isso, a cidade recebeu o nome de Babel[a], porque ali Yahweh confundiu a língua de toda a terra; e dali Yahweh os espalhou por toda a face da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Babel tem som semelhante ao do verbo hebraico balal, que significa “confundir” ou “misturar”; esse jogo de palavras explica o nome neste versículo.
    reason: O jogo sonoro entre בָּבֶל e בָּלַל não pode ser reproduzido plenamente em português.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação de causa e conclusão introduzida pela expressão hebraica.
- source_word: קָרָא שְׁמָהּ
  choice: a cidade recebeu o nome
  rationale: O hebraico diz literalmente 'chamou o nome dela'. A formulação passiva evita acrescentar um sujeito não expresso; 'a cidade' explicita o referente feminino já estabelecido pelo contexto.
- source_word: בָּבֶל
  choice: Babel
  rationale: Mantém a transliteração tradicional do nome próprio e permite explicar em nota o jogo sonoro com o verbo hebraico balal.
- source_word: כִּי שָׁם
  choice: porque ali
  rationale: Preserva a função explicativa e a referência enfática ao lugar.
- source_word: בָּלַל
  choice: confundiu
  rationale: No contexto, o verbo descreve a desorganização da comunicação humana; 'confundiu' é claro e também sustenta a explicação do nome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: a língua de toda a terra
  rationale: שָׂפָה significa literalmente 'lábio', mas aqui é uma expressão idiomática para língua ou fala. A tradução conserva o singular coletivo e a abrangência do hebraico.
- source_word: וּמִשָּׁם
  choice: e dali
  rationale: Mantém a ligação narrativa e espacial com Babel.
- source_word: הֱפִיצָם
  choice: os espalhou
  rationale: Traduz o sentido causativo do verbo, que descreve a dispersão geográfica das pessoas.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: por toda a face da terra
  rationale: Preserva a imagem concreta da expressão hebraica e a repetição de 'toda a terra', com formulação compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal divino sem substituí-lo por um título ou adotar a forma híbrida tradicional 'Jeová'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a repetição intencional de 'toda a terra' e conserva 'face da terra' para refletir a imagem hebraica.
