  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: pt
  text: Quando Labão ouviu as notícias sobre Jacó, filho de sua irmã[a], correu ao encontro dele, abraçou-o, beijou-o e o levou para sua casa. Então Jacó contou a Labão todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «filho de sua irmã», isto é, seu sobrinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A preposição כ com o infinitivo construto introduz uma oração temporal. «Quando ... ouviu» é natural e não acentua uma imediaticidade além da expressa no hebraico.
- source_word: שֵׁמַע יַעֲקֹב
  choice: as notícias sobre Jacó
  rationale: שֵׁמַע designa aqui notícias ou um relato a respeito de Jacó; esta formulação é clara e idiomática em português.
- source_word: בֶּן אֲחֹתוֹ
  choice: filho de sua irmã
  rationale: Mantém a formulação explícita de parentesco do hebraico, em vez de substituí-la por «sobrinho».
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: correu ao encontro dele
  rationale: לִקְרָאתוֹ indica movimento para encontrar alguém; a expressão escolhida preserva esse sentido e o registro narrativo.
- source_word: וַיְחַבֶּק לוֹ
  choice: abraçou-o
  rationale: חבק significa abraçar; a colocação pronominal é natural no registro escrito e digno.
- source_word: וַיְנַשֶּׁק לוֹ
  choice: beijou-o
  rationale: נשׁק significa beijar e, no contexto, descreve uma saudação familiar.
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  choice: o levou para sua casa
  rationale: O hifil de בוא significa fazer vir ou trazer. Em português narrativo, «levou-o para sua casa» expressa naturalmente o deslocamento até a casa de Labão.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Então Jacó contou a Labão
  rationale: O sujeito não está expresso no verbo hebraico, mas o contexto indica uma mudança de sujeito para Jacó. Nomeá-lo evita ambiguidade momentânea.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: tudo o que havia acontecido
  rationale: דְּבָרִים pode designar palavras, assuntos ou acontecimentos. Neste contexto, a expressão portuguesa comunica naturalmente os fatos que Jacó relatou.
