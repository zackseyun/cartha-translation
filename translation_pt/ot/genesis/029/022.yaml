  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: pt
  text: Então Labão reuniu todos os homens daquele lugar e deu um banquete[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as pessoas daquele lugar”. O hebraico diz mais literalmente “todos os homens daquele lugar” e provavelmente se refere aos homens da localidade convidados para a celebração do casamento.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido como “banquete” é usado com frequência para uma refeição festiva e pode incluir a ideia de beber durante a celebração.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: O verbo אסף, neste contexto narrativo, descreve a ação de ajuntar pessoas; “reuniu” é natural em português e preserva esse sentido concreto.
- source_word: לָבָן
  choice: Labão
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: todos os homens daquele lugar
  rationale: אַנְשֵׁי é a forma construta masculina plural de אִישׁ, literalmente “homens de”. A formulação mantém a referência masculina do hebraico, provavelmente aos homens da localidade convidados para a celebração.
- source_word: וַיַּעַשׂ
  choice: deu
  rationale: Embora עשה signifique amplamente “fazer”, em português a combinação idiomática natural é “dar um banquete”; isso expressa a realização do evento sem acrescentar conteúdo ao hebraico.
- source_word: מִשְׁתֶּה
  choice: um banquete
  rationale: מִשְׁתֶּה designa uma refeição festiva, muitas vezes acompanhada de bebida. “Banquete” é claro, digno e natural no contexto de uma celebração de casamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Deu um banquete” evita o pouco idiomático “fez um banquete”, enquanto as notas preservam tanto a forma masculina do hebraico quanto a conotação cultural de מִשְׁתֶּה.
