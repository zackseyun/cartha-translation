base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: pt
  text: 'Então Labão disse a Jacó[a]: “Só porque você é meu parente, deveria trabalhar para mim de graça? Diga-me qual deve ser o seu salário.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “meu irmão”; aqui, o termo é usado no sentido mais amplo de parente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Só porque
  rationale: 'Expressa de modo natural a base retórica da pergunta: o parentesco não deve ser motivo para Jacó trabalhar sem remuneração.'
- source_word: אָחִי
  choice: meu parente
  rationale: Embora o sentido literal comum seja “meu irmão”, aqui o termo designa parentesco mais amplo; Jacó era sobrinho de Labão.
- source_word: וַעֲבַדְתַּנִי
  choice: deveria trabalhar para mim
  rationale: O verbo se refere ao trabalho prestado a Labão, e a formulação modal preserva a força retórica da oração.
- source_word: חִנָּם
  choice: de graça
  rationale: Equivalente corrente e claro para trabalho sem remuneração, em contraste com o salário mencionado em seguida.
- source_word: הַגִּידָה לִּי
  choice: Diga-me
  rationale: Reproduz diretamente o imperativo hebraico com seu objeto indireto.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: qual deve ser o seu salário
  rationale: “Salário” comunica a remuneração pelo trabalho, e “deve ser” se ajusta ao contexto em que as condições ainda serão estabelecidas.
