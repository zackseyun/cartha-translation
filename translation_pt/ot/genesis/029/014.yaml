base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: pt
  text: 'Então Labão lhe disse: “De fato, você é meu osso e minha carne”[a]. E ele ficou com Labão durante um mês[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão idiomática hebraica: “meu osso e minha carne”, isto é, parente próximo ou consanguíneo.'
    reason: cultural_note
  - marker: b
    text: Literalmente, “um mês de dias”; a expressão pode indicar um mês completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אַךְ
  choice: De fato
  rationale: Neste contexto, a partícula tem valor enfático ou asseverativo, confirmando o parentesco, e não valor restritivo.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: meu osso e minha carne
  rationale: A formulação literal preserva a imagem hebraica e suas ressonâncias bíblicas, enquanto a nota esclarece que se trata de uma expressão de parentesco.
- source_word: וַיֵּשֶׁב
  choice: E ele ficou
  rationale: Aqui, o verbo indica permanecer ou hospedar-se por um período limitado; “ficou” é natural e atual em português.
- source_word: עִמּוֹ
  choice: com Labão
  rationale: O referente pronominal é explicitado para evitar a sequência pouco clara “ele ficou com ele”, sem alterar o sentido contextual.
- source_word: חֹדֶשׁ יָמִים
  choice: durante um mês
  rationale: A expressão hebraica significa um mês completo; a tradução idiomática comunica com clareza a duração em português.
