  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: pt
  text: 'Eles responderam: “Não podemos fazer isso até que todos os rebanhos estejam reunidos e a pedra seja rolada de sobre a boca do poço; então damos água ao rebanho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוּכַל
  choice: não podemos fazer isso
  rationale: O verbo יכל expressa incapacidade. O complemento “fazer isso” torna natural em português a formulação elíptica do hebraico sem especificar além do contexto.
- source_word: יֵאָסְפוּ כָּל הָעֲדָרִים
  choice: todos os rebanhos estejam reunidos
  rationale: O nifal de אסף indica que os rebanhos são reunidos; a formulação preserva o valor temporal de עַד אֲשֶׁר.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: e rolem a pedra
  rationale: Mantém o sentido concreto de גלל, “rolar”, e conserva o sujeito plural não expresso do hebraico, sem acrescentar “os pastores” ao texto.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: de cima da boca do poço
  rationale: Preserva a imagem hebraica de פִּי, literalmente “boca”, em uma expressão compreensível e corrente em português.
- source_word: וְהִשְׁקִינוּ הַצֹּאן
  choice: então damos água ao rebanho
  rationale: O hifil de שקה significa dar de beber ou fornecer água. “Rebanho” preserva o caráter coletivo de צאן sem restringi-lo exclusivamente a ovelhas.
