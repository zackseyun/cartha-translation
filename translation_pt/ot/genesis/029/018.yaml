base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: pt
  text: 'Jacó amou Raquel[a] e disse: “Trabalharei para você durante sete anos por Raquel, sua filha mais nova.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E Jacó amou Raquel”. A conjunção inicial apenas dá continuidade à narrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: amava
  rationale: O verbo אָהַב indica diretamente amor. O imperfeito português apresenta esse amor como estado já existente no contexto, sem acrescentar a nuance mais específica de “estava apaixonado”.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Tradução direta e natural de אמר ao introduzir discurso direto.
- source_word: אֶעֱבָדְךָ
  choice: Trabalharei para o senhor
  rationale: עבד designa aqui o serviço ou trabalho prestado a Labão. “Trabalharei” é claro no português atual, enquanto “para o senhor” preserva o destinatário masculino singular e evita a possível ambiguidade reverencial de “servirei ao senhor”.
- source_word: שֶׁבַע שָׁנִים
  choice: durante sete anos
  rationale: Expressa de modo natural a duração indicada pela construção hebraica.
- source_word: בְּרָחֵל
  choice: por Raquel
  rationale: A preposição בְּ marca aqui a base da prestação acordada; “por Raquel” conserva a concisão e não explicita além do texto a ideia de troca.
- source_word: בִּתְּךָ
  choice: sua filha
  rationale: Corresponde diretamente ao substantivo em estado construto com sufixo masculino singular.
- source_word: הַקְּטַנָּה
  choice: mais nova
  rationale: Embora o adjetivo possa significar literalmente “pequena”, no contraste familiar com Lia indica naturalmente a filha de menor idade.
- source_word: וַ
  choice: e
  rationale: A conjunção dá continuidade à narrativa; “e” preserva essa ligação sem introduzir uma mudança discursiva mais forte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega-se “o senhor” como forma respeitosa de tratamento humano a Labão, e “trabalharei” para comunicar com clareza o serviço laboral no acordo matrimonial.
