base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: pt
  text: 'Labão disse: “Aqui entre nós não se costuma dar a mais nova antes da primogênita.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר; “disse” é a equivalência natural e direta em português.
- source_word: לָבָן
  choice: Labão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: não se costuma
  rationale: A construção impessoal expressa uma prática social estabelecida, não mera impossibilidade; esta formulação comunica naturalmente o sentido costumeiro.
- source_word: בִּמְקוֹמֵנוּ
  choice: aqui entre nós
  rationale: Reproduz o caráter local de “em nosso lugar” em português corrente, sem ampliar indevidamente para país ou território.
- source_word: לָתֵת
  choice: dar
  rationale: Mantém o verbo simples do hebraico; o contexto deixa implícito que se trata de dar em casamento.
- source_word: הַצְּעִירָה
  choice: a mais nova
  rationale: O adjetivo feminino substantivado se refere à filha mais jovem; “a mais nova” é natural e preserva a referência feminina implícita.
- source_word: לִפְנֵי
  choice: antes de
  rationale: Indica precedência na ordem, adequadamente expressa por “antes de”.
- source_word: הַבְּכִירָה
  choice: a primogênita
  rationale: Preserva a ênfase lexical do hebraico na condição de primeira filha nascida, em contraste com uma tradução apenas comparativa como “a mais velha”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação impessoal “não se costuma” torna explícito o valor de costume já presente na sintaxe hebraica, enquanto “dar” conserva a elipse do casamento. Nenhuma nota é necessária para a compreensão do versículo.
