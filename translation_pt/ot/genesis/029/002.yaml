  text: וַ/יַּ֞רְא וְ/הִנֵּ֧ה בְאֵ֣ר בַּ/שָּׂדֶ֗ה וְ/הִנֵּה שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי צֹאן֙ רֹבְצִ֣ים עָלֶ֔י/הָ כִּ֚י מִן הַ/בְּאֵ֣ר הַ/הִ֔וא יַשְׁק֖וּ הָ/עֲדָרִ֑ים וְ/הָ/אֶ֥בֶן גְּדֹלָ֖ה עַל פִּ֥י הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: pt
  text: Ele olhou[a], e eis que havia um poço no campo; e eis que[b] três rebanhos de ovelhas estavam deitados junto dele[c], pois daquele poço davam de beber aos rebanhos[d]. E a pedra sobre a boca do poço[e] era grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viu”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico repete “eis que” para dar vivacidade à cena.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “perto dele”; literalmente, “sobre ele”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “costumavam dar de beber aos rebanhos”. O sujeito não é especificado no hebraico.'
    reason: lexical_alternative
  - marker: e
    text: Isto é, sobre a abertura do poço.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ele olhou
  rationale: O wayyiqtol de ראה dá prosseguimento à narrativa. “Olhou” introduz naturalmente a cena que ele percebe; “viu” também é possível.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: e eis que ... e eis que
  rationale: A repetição mantém a vivacidade e a força de chamar a atenção próprias de הִנֵּה, sem apagar a estrutura enfática do hebraico.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: um poço no campo
  rationale: Tradução direta e natural dos substantivos comuns בְּאֵר e שָׂדֶה neste cenário pastoril.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: três rebanhos de ovelhas
  rationale: עֵדֶר designa rebanho, e צֹאן indica animais de pequeno porte, sobretudo ovelhas e cabras; “ovelhas” é claro e adequado ao contexto.
- source_word: רֹבְצִים
  choice: estavam deitados
  rationale: O particípio de רבץ descreve animais deitados ou em repouso; a opção conserva a imagem concreta.
- source_word: עָלֶיהָ
  choice: junto dele
  rationale: Embora a preposição seja literalmente “sobre ele”, em relação ao poço ela expressa aqui proximidade espacial. O pronome retoma “poço” com naturalidade em português.
- source_word: כִּי מִן הַבְּאֵר הַהִוא יַשְׁקוּ הָעֲדָרִים
  choice: pois daquele poço davam de beber aos rebanhos
  rationale: כִּי introduz a explicação da presença dos rebanhos. O Hifil de שׁקה significa dar de beber; a terceira pessoa do plural tem sujeito humano não especificado.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: E a pedra sobre a boca do poço era grande
  rationale: A oração descritiva e a metáfora hebraica “boca do poço” são preservadas, preparando a ação do versículo seguinte.
theological_decisions: []
