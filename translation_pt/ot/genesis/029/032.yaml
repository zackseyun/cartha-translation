  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: pt
  text: 'Lea ficou grávida e deu à luz um filho[a]. Ela lhe deu o nome de Rúben, pois disse: “Yahweh viu a minha aflição; agora meu marido me amará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O nome Rúben soa, em hebraico, como “veja, um filho” e é relacionado aqui às palavras de Lea: “Yahweh viu a minha aflição”.'
    reason: Explicar o jogo de palavras hebraico associado a רְאוּבֵן e רָאָה, que não pode ser reproduzido diretamente em português.
lexical_decisions:
- source_word: וַתַּהַר
  choice: ficou grávida
  rationale: Expressa de modo natural e claro o sentido de הרה, isto é, conceber ou engravidar.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: É a formulação corrente em português para o idioma hebraico de nascimento, mantendo explícito que nasceu um filho.
- source_word: וַתִּקְרָא שְׁמוֹ רְאוּבֵן
  choice: Ela lhe deu o nome de Rúben
  rationale: Reproduz naturalmente a fórmula hebraica de nomeação e conserva o nome pessoal em sua forma portuguesa tradicional.
- source_word: כִּי אָמְרָה
  choice: pois disse
  rationale: O primeiro כִּי introduz a explicação dada por Lea para a escolha do nome.
- source_word: כִּי רָאָה יְהוָה בְּעָנְיִי
  choice: Yahweh viu a minha aflição
  rationale: O perfeito רָאָה é apresentado como fato consumado com relevância presente. 'Aflição' comunica a dor e a condição humilhante expressas por עֳנִי.
- source_word: כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי
  choice: agora meu marido me amará
  rationale: Mantém a expectativa de Lea no futuro e traduz אִישִׁי segundo o contexto conjugal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não um título. A transliteração 'Yahweh' preserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preferiu-se 'ficou grávida' a 'concebeu' por naturalidade, e 'deu à luz' preserva o tom narrativo bíblico sem arcaísmo.
