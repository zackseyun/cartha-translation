  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: pt
  text: Ao anoitecer, Labão tomou Lia, sua filha, e a levou até Jacó. Então Jacó teve relações com ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “foi a ela”, um eufemismo convencional para relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Ao anoitecer
  rationale: Expressa de modo natural em português a progressão narrativa e a indicação temporal do hebraico, sem a fórmula arcaica “e aconteceu que”.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: Labão pegou sua filha Lia
  rationale: “Pegou” preserva o sentido simples de לקח no contexto. O sujeito Labão e o nome Jacó são explicitados em português para evitar a ambiguidade pronominal criada pela sequência de sujeitos masculinos, sem acrescentar informação externa ao contexto imediato.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: e a levou até Jacó
  rationale: O hifil de בוא significa fazer vir ou levar. “Levou até” é idiomático e comunica diretamente o movimento em direção a Jacó.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: e ele se uniu a ela
  rationale: A expressão hebraica é um eufemismo convencional para relações sexuais. “Uniu-se a ela” mantém dignidade e alguma reserva, sendo mais compreensível no português atual do que o calque “entrou a ela”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Os nomes próprios substituem pronomes em pontos estratégicos para impedir confusão entre Labão e Jacó. A nota preserva a forma eufemística literal do hebraico.
