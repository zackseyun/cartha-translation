base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: pt
  text: 'Ela engravidou novamente e deu à luz um filho. Então disse: “Desta vez louvarei a Yahweh.” Por isso, deu-lhe o nome de Judá.[a] Depois, parou de ter filhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico Judá (Yehudá) está relacionado ao verbo que significa “louvar” ou “dar graças”.
    reason: Explicar o jogo de palavras hebraico entre אוֹדֶה e יְהוּדָה, que não é perceptível em português.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: engravidou novamente
  rationale: Expressa com naturalidade em português atual a repetição indicada por עוֹד e o sentido de הרה, ‘ficar grávida/conceber’.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: É a forma corrente e digna de traduzir o idiomatismo hebraico para o nascimento de um menino.
- source_word: הַפַּעַם
  choice: Desta vez
  rationale: Mantém o contraste desta ocasião com os nascimentos anteriores, sem acrescentar uma emoção que o hebraico não explicita.
- source_word: אוֹדֶה
  choice: louvarei
  rationale: O hifil de ידה pode exprimir louvor ou agradecimento; ‘louvarei’ preserva bem a declaração de Lia e a associação sonora e etimológica com Judá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ
  choice: Por isso, deu-lhe o nome de
  rationale: Comunica de modo idiomático tanto a relação causal quanto a fórmula hebraica de nomeação.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Usa a forma portuguesa consagrada do nome e remete em nota ao jogo de palavras hebraico.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Depois, parou de ter filhos
  rationale: Reproduz em português natural o sentido de cessar temporariamente a atividade de dar à luz, sem afirmar esterilidade permanente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto apresenta o Tetragrama como nome próprio. ‘Yahweh’ o conserva explicitamente, sem substituí-lo pelo título ‘SENHOR’.
- issue: Sentido de אוֹדֶה na declaração de Lia
  choice: louvarei
  alternative: darei graças
  rationale: Ambos os sentidos pertencem ao campo semântico de ידה. ‘Louvarei’ sustenta com clareza a explicação do nome Judá, enquanto a nota reconhece a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural e legibilidade brasileira. A divisão em frases evita uma sequência excessiva de conjunções sem perder o encadeamento do hebraico. O marcador [a] aparece junto de “Judá”, termo ao qual a nota se refere.
