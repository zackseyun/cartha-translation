base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: pt
  text: Quando Jacó viu Raquel, filha de Labão, irmão da mãe de Jacó,[a] e o rebanho de Labão, irmão da mãe de Jacó, Jacó se aproximou, rolou a pedra de sobre a boca do poço e deu de beber ao rebanho de Labão, irmão da mãe de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete três vezes neste versículo a expressão «irmão da mãe de Jacó», destacando o vínculo familiar de Jacó com Labão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A construção introduz o acontecimento seguinte com valor temporal. Em português narrativo, «Quando» comunica esse valor naturalmente sem reproduzir de modo rígido a fórmula «e aconteceu que».
- source_word: רָאָה
  choice: viu
  rationale: O verbo indica percepção visual direta; «viu» é a tradução mais simples e precisa.
- source_word: בַּת
  choice: filha de
  rationale: A expressão identifica Raquel por sua relação familiar com Labão e soa natural como aposto em português.
- source_word: אֲחִי אִמּוֹ
  choice: irmão de sua mãe
  rationale: Preserva a formulação explícita e a repetição hebraica melhor que «tio materno», sem perder clareza.
- source_word: צֹאן
  choice: rebanho
  rationale: O termo hebraico designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras. «Rebanho» mantém o sentido coletivo sem especificar indevidamente a espécie.
- source_word: וַיִּגַּשׁ
  choice: aproximou-se
  rationale: Expressa o movimento de Jacó em direção ao poço e à ação, em linguagem corrente e digna.
- source_word: וַיָּגֶל
  choice: rolou
  rationale: O verbo descreve concretamente o ato de fazer a pedra rolar, não apenas de removê-la.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: da boca do poço
  rationale: Mantém a metáfora hebraica «boca do poço», compreensível e tradicional em português, enquanto «da» comunica que a pedra foi retirada de sobre a abertura.
- source_word: וַיַּשְׁקְ
  choice: deu de beber
  rationale: O hifil de שׁקה significa dar água. «Deu de beber ao rebanho» é idiomático em português e evita a possível leitura agrícola de «regou».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a repetição enfática do parentesco e a imagem concreta da «boca do poço». O sujeito «Jacó» não é repetido antes de «aproximou-se», pois a continuidade do sujeito é inequívoca em português.
