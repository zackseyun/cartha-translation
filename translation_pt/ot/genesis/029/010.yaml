review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência narrativa, o rebanho coletivo, a ação concreta de rolar a pedra e o ato de dar água ao rebanho. Contudo, o possessivo «sua mãe» pode ter antecedente ambíguo em português, enquanto o hebraico identifica inequivocamente Labão como irmão da mãe de Jacó em cada uma das três ocorrências. A revisão explicita esse referente e conserva a repetição.
  naturalness: O texto é geralmente claro e de registro apropriado. «De sobre a boca do poço» é um pouco mais formal, mas é natural em registro bíblico moderno e exprime com maior precisão que a pedra estava sobre a abertura.
  terminology: «Jacó», «Raquel», «Labão», «rebanho», «boca do poço» e «deu de beber» são escolhas adequadas. A repetição de «irmão da mãe de Jacó» mantém a formulação familiar explícita do hebraico sem recorrer ao termo interpretativo «tio materno».
  issues:
  - severity: medium
    issue: Ambiguidade do possessivo «sua mãe» nas três expressões de parentesco.
    rationale: Em português, «sua» pode referir-se a mais de um antecedente no enunciado, sobretudo a Labão ou Raquel. O hebraico usa um sufixo que, no contexto, se refere a Jacó. «Da mãe de Jacó» elimina a ambiguidade sem alterar o sentido.
  - severity: low
    issue: A âncora da nota aparece apenas no fim do versículo.
    rationale: A nota explica a expressão repetida; posicioná-la na primeira ocorrência torna mais claro o seu referente, sem sugerir que a repetição final seja a única relevante.
  revised_text: Quando Jacó viu Raquel, filha de Labão, irmão da mãe de Jacó,[a] e o rebanho de Labão, irmão da mãe de Jacó, Jacó se aproximou, rolou a pedra de sobre a boca do poço e deu de beber ao rebanho de Labão, irmão da mãe de Jacó.
  revised_footnotes:
