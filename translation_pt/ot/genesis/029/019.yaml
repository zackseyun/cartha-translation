base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: pt
  text: 'Labão disse[a]: “É melhor que eu a dê a você do que dá-la a outro homem. Fique comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “É bom que eu a dê a você, em vez de dá-la a outro homem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר que introduz discurso direto; “disse” é o equivalente natural em português.
- source_word: טוֹב
  choice: é melhor
  rationale: Na construção comparativa com מִן e infinitivo, “é melhor... do que...” comunica naturalmente o sentido contextual.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: que eu a dê a você
  rationale: O infinitivo construto com sufixo de primeira pessoa tem valor verbal; a oração finita mantém o sentido com clareza em português.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: do que a outro homem
  rationale: A formulação evita repetir desnecessariamente “que eu a dê”, sem perder o segundo termo da comparação.
- source_word: אִישׁ אַחֵר
  choice: outro homem
  rationale: Preserva a expressão hebraica sem acrescentar a interpretação mais específica “outro marido”.
- source_word: שְׁבָה
  choice: Fique
  rationale: O imperativo de ישׁב, neste contexto, pede que Jacó permaneça com Labão; “fique” é claro e atual.
- source_word: עִמָּדִי
  choice: comigo
  rationale: Equivalente direto da expressão preposicional que indica permanência junto de Labão.
