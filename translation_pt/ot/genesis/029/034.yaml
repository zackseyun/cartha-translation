  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: pt
  text: 'Ela engravidou novamente e deu à luz um filho. Então disse: “Agora, desta vez, meu marido se unirá[a] a mim, pois já lhe dei três filhos”. Por isso, ele foi chamado Levi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará ligado a mim”. Em hebraico, o verbo soa de modo semelhante ao nome Levi.'
    reason: Preservar a alternativa lexical e explicar o jogo de palavras hebraico que não pode ser reproduzido diretamente em português.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Ela engravidou novamente
  rationale: A expressão indica que ela tornou a ficar grávida; esta formulação é natural no português atual e preserva o sentido de repetição de עוֹד.
- source_word: וַתֵּלֶד בֵּן
  choice: e deu à luz um filho
  rationale: Equivalente português natural da fórmula hebraica para o nascimento de um filho.
- source_word: עַתָּה הַפַּעַם
  choice: Agora, desta vez
  rationale: Preserva os dois elementos enfáticos do hebraico sem acrescentar a ideia não explícita de “finalmente”.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: meu marido se unirá a mim
  rationale: O nifal de לוה expressa a esperança de que o marido se una ou fique ligado a Lia. “Se unirá a mim” é claro, relacional e próximo da imagem hebraica.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: pois já lhe dei três filhos
  rationale: “Pois” introduz a razão, “lhe” representa לוֹ e “já” comunica a relevância presente dos três nascimentos concluídos de modo idiomático em português.
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: Por isso, ele foi chamado Levi
  rationale: A construção passiva em português evita identificar o responsável pelo nome, já que o verbo hebraico está no masculino singular, mas não traz sujeito expresso. Mantém também a fórmula explicativa do nome.
theological_decisions:
- issue: Jogo de palavras entre יִלָּוֶה e לֵוִי
  choice: Traduzir o verbo como “se unirá” e explicar em nota sua semelhança sonora com Levi
  alternative: ficará ligado a mim
  rationale: Nenhuma escolha portuguesa reproduz simultaneamente o sentido e o som do hebraico. O texto principal conserva o sentido relacional, e a nota torna explícita a ligação literária com o nome.
- issue: Sujeito não expresso de קָרָא
  choice: Usar a forma passiva “ele foi chamado”
  alternative: ele lhe deu o nome de Levi
  rationale: Embora o verbo hebraico seja masculino singular, o sujeito não é nomeado. A forma passiva evita atribuir explicitamente o ato de nomear a Jacó ou a outra pessoa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Engravidou” e “deu à luz” são correntes e respeitosos; “se unirá” preserva o tom relacional sem impor uma interpretação denominacional.
