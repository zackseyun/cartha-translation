  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: pt
  text: Complete a semana nupcial desta mulher[a], e também lhe daremos esta outra[b], em troca do trabalho que você fará para mim[c] por mais sete anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Complete a semana desta”; no contexto, trata-se da semana costumeira das celebrações do casamento de Lia.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “e esta outra também lhe será dada”. A forma hebraica é, literalmente, a terceira pessoa do singular feminino, mas, no contexto, expressa a promessa de Labão de dar também Raquel.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “servirá a mim”. O verbo hebraico pode significar “trabalhar” ou “servir”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Complete
  rationale: O imperativo de מלא pede que Jacó leve até o fim o período determinado; “complete” é claro, natural e preserva a força da ordem.
- source_word: שְׁבֻעַ זֹאת
  choice: a semana nupcial desta mulher
  rationale: שְׁבֻעַ designa aqui uma semana, isto é, o período nupcial de sete dias; o demonstrativo feminino refere-se a Lia. A formulação explicita o contexto cultural sem ocultar a expressão hebraica literal, registrada em nota.
- source_word: וְנִתְּנָה לְךָ
  choice: e lhe daremos
  rationale: 'Embora a forma hebraica seja formalmente terceira pessoa feminina singular, seu sentido contextual é passivo ou impessoal: a outra filha será dada a Jacó. Em português, a promessa de Labão é expressa naturalmente na primeira pessoa do plural.'
- source_word: גַּם אֶת זֹאת
  choice: também ... esta outra
  rationale: O segundo demonstrativo feminino aponta para Raquel. “Esta outra” distingue com clareza as duas irmãs e conserva a força demonstrativa.
- source_word: בַּעֲבֹדָה
  choice: em troca do trabalho
  rationale: A preposição com o substantivo apresenta o trabalho como condição ou contrapartida do acordo.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: que você fará para mim
  rationale: עבד pode significar trabalhar ou servir. Neste contrato de trabalho, “fará para mim” transmite com naturalidade que Jacó trabalhará para Labão; a alternativa “servirá” é preservada em nota.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: por mais sete anos
  rationale: Formulação portuguesa natural que preserva o valor adicional de עוֹד e o novo período de sete anos.
