base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: pt
  text: 'Quando amanheceu, eis que era Lia! Então Jacó disse a Labão: “O que você fez comigo? Não foi por Raquel que trabalhei para você? Por que, então, você me enganou?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Quando amanheceu
  rationale: Expressa naturalmente a indicação temporal hebraica, literalmente ‘e aconteceu pela manhã’, sem reproduzir um hebraísmo desnecessário.
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: eis que era Lia!
  rationale: Preserva הִנֵּה como marcador de descoberta súbita e surpresa narrativa; a exclamação comunica essa força em português atual.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: trabalhei para você
  rationale: Neste contexto, עבד עם descreve o serviço prestado a Labão em troca de Raquel; ‘para você’ é natural e contextualmente preciso.
- source_word: רִמִּיתָנִי
  choice: você me enganou
  rationale: O verbo רמה denota enganar ou ludibriar; ‘enganou’ conserva a acusação direta sem acrescentar especificidade ausente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O nome ‘Jacó’ foi explicitado como sujeito da fala para evitar ambiguidade em português, embora o hebraico use apenas ‘ele’; o contexto imediato identifica inequivocamente o falante.
