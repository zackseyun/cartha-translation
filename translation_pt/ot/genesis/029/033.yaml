base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: pt
  text: 'Ela engravidou novamente e deu à luz um filho. E disse: “Porque Yahweh ouviu que sou odiada[a], ele me deu também este filho.” E deu-lhe o nome de Simeão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não sou amada” ou “sou menos amada”. A palavra hebraica significa literalmente “odiada”, mas, neste contexto, pode indicar rejeição ou ser comparativamente menos amada.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, Simeão soa de modo semelhante à palavra que significa “ouviu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Ela engravidou novamente
  rationale: עוֹד indica repetição, e a forma narrativa faz a sequência avançar. “Engravidou novamente” é natural em português atual.
- source_word: וַתֵּלֶד בֵּן
  choice: e deu à luz um filho
  rationale: Reproduz com clareza a fórmula hebraica de nascimento em português corrente.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Porque Yahweh ouviu
  rationale: כִּי introduz a explicação de Lia; o perfeito שָׁמַע descreve a ação já realizada. O nome divino é transliterado, em vez de substituído por um título.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: que sou odiada
  rationale: Preserva o sentido lexical forte do particípio passivo שְׂנוּאָה sem acrescentar explicitamente Jacó nem suavizar no texto principal a tensão narrativa.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: ele me deu também este filho
  rationale: Mantém a ideia de dádiva adicional expressa por גַּם. “Filho” explicita em português o referente imediato de זֶה, evitando a formulação pouco natural “este” isolado.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: deu-lhe o nome de
  rationale: Equivalente português natural da fórmula hebraica literalmente traduzida por “chamou o nome dele”.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida do nome em português; a nota preserva o jogo sonoro com o verbo hebraico “ouvir”.
theological_decisions:
- issue: Descrição da condição de Lia em relação a Jacó
  choice: sou odiada
  alternative: não sou amada / sou menos amada
  rationale: O hebraico emprega o termo forte שְׂנוּאָה. Embora o contexto possa indicar rejeição ou amor comparativamente menor, o texto principal conserva a força lexical e deixa a possível nuance para a nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé / SENHOR
  rationale: A transliteração mantém o nome pessoal presente no texto hebraico, sem o substituir por um título.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e ampla inteligibilidade internacional. Preserva-se “odiada” no texto principal para não apagar a força e a ambiguidade contextual do hebraico.
