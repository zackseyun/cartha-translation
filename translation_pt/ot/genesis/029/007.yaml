base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: pt
  text: 'Então ele disse: “Vejam, ainda falta muito para o dia acabar; não é hora de recolher os rebanhos. Deem água ao rebanho e vão pastoreá-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição dêitica que chama a atenção dos pastores; “Vejam” é natural em português moderno e preserva a força discursiva.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: ainda falta muito para o dia acabar
  rationale: 'Expressa de modo natural o sentido do idioma hebraico: ainda resta uma parte considerável do dia.'
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: não é hora de recolher os rebanhos
  rationale: Preserva a ideia do tempo apropriado e o sentido passivo de reunir/recolher o conjunto dos animais, usando uma formulação idiomática em português.
- source_word: הַשְׁקוּ
  choice: Deem água
  rationale: O hifil imperativo de שׁקה significa fazer beber ou dar água; a escolha é clara, corrente e mantém a força da ordem.
- source_word: הַצֹּאן
  choice: às ovelhas e às cabras
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; a explicitação comunica a extensão do termo ao leitor comum.
- source_word: וּלְכוּ רְעוּ
  choice: e voltem a levá-las para pastar
  rationale: 'No contexto, os animais haviam sido trazidos ao poço; a formulação transmite a sequência proposta por Jacó: dar água e retornar ao pastoreio.'
