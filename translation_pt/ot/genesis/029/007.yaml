  rationale: A revisão elimina a especificação não exigida de espécies e a ideia acrescentada de retorno, mantendo uma formulação portuguesa corrente. “Rebanhos” para o coletivo amplo מִקְנֶה e “rebanho” para צֹאן preservam de modo legível a distinção do hebraico.
