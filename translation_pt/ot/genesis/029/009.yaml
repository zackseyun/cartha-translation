base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: pt
  text: Enquanto ele ainda falava com eles, Raquel chegou com o rebanho de seu pai, pois ela era pastora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois ela cuidava do rebanho”. O hebraico emprega uma forma feminina que apresenta Raquel como quem pastoreava o rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: enquanto ele ainda falava
  rationale: A construção com o particípio expressa uma ação em andamento simultânea à chegada de Raquel. Esta formulação é natural em português e preserva a sobreposição temporal.
- source_word: עִמָּם
  choice: com eles
  rationale: Tradução direta da preposição com o sufixo masculino plural, referindo-se aos homens com quem Jacó conversava.
- source_word: וְרָחֵל בָּאָה
  choice: Raquel chegou
  rationale: O verbo בוא faz a narrativa avançar e, neste contexto, 'chegou' soa mais natural em português do que a tradução mais formal 'veio'.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: com o rebanho de seu pai
  rationale: A expressão relativa hebraica indica que o rebanho pertencia ao pai de Raquel. A construção possessiva é clara, concisa e natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação de por que Raquel vinha acompanhando o rebanho, mantendo o tom narrativo.
- source_word: רֹעָה הִוא
  choice: ela era pastora
  rationale: O particípio feminino identifica a função habitual de Raquel como responsável pelo pastoreio. 'Pastora' preserva naturalmente em português tanto a função quanto o gênero gramatical do hebraico.
