  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: pt
  text: 'Jacó lhes disse: “Meus irmãos[a], de onde vocês são?” Eles disseram: “Somos de Harã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meus irmãos” é aqui uma forma cortês e fraterna de tratamento, não necessariamente uma afirmação de parentesco literal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: lhes perguntou
  rationale: Embora אמר seja o verbo comum de fala, o conteúdo é uma pergunta direta; em português, “perguntou-lhes” ou “lhes perguntou” expressa naturalmente o ato de fala sem alterar seu sentido.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אַחַי
  choice: Meus irmãos
  rationale: Mantém o substantivo masculino plural e o possessivo do hebraico; no contexto, funciona como tratamento fraterno e cortês, não necessariamente como afirmação de parentesco literal.
- source_word: מֵאַיִן אַתֶּם
  choice: de onde vocês são?
  rationale: A preposição מ־ com o interrogativo אַיִן indica procedência. Esta é a formulação idiomática e clara em português moderno.
- source_word: וַיֹּאמְרוּ
  choice: Eles responderam
  rationale: O hebraico usa o verbo comum אמר, literalmente “disseram”; no diálogo, “responderam” torna natural a relação entre pergunta e resposta sem mudar o conteúdo.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Somos de Harã
  rationale: A preposição מ־ marca origem, e o pronome independente אֲנָחְנוּ sustenta a resposta. O português requer naturalmente a cópula “somos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para a segunda pessoa do plural e ordem natural no diálogo. A nota cultural preserva o valor literal de אַחַי sem induzir parentesco biológico.
