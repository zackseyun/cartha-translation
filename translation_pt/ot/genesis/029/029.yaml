  text: וַ/יִּתֵּ֤ן לָבָן֙ לְ/רָחֵ֣ל בִּתּ֔/וֹ אֶת בִּלְהָ֖ה שִׁפְחָת֑/וֹ לָ֖/הּ לְ/שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: pt
  text: E Labão deu Bila[a], sua serva, a Raquel, sua filha, para ser serva dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escrava”, nas duas ocorrências do hebraico שִׁפְחָה.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן, nesta forma narrativa, descreve diretamente uma ação passada; “deu” é natural e mantém a concisão do hebraico.
- source_word: לָבָן
  choice: Labão
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְרָחֵל
  choice: a Raquel
  rationale: A preposição ל marca Raquel como destinatária; “a Raquel” expressa isso de modo claro e idiomático.
- source_word: בִּתּוֹ
  choice: sua filha
  rationale: O substantivo com sufixo de terceira pessoa masculina singular identifica Raquel como filha de Labão.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: O marcador hebraico de objeto direto não tem equivalente lexical necessário em português; sua função é indicada pela sintaxe.
- source_word: בִּלְהָה
  choice: Bila
  rationale: Forma tradicional e amplamente inteligível do nome em português.
- source_word: שִׁפְחָתוֹ
  choice: sua serva
  rationale: שִׁפְחָה designa uma serva ou escrava. “Serva” preserva o gênero e o papel doméstico sem especificar uma idade inexistente no texto.
- source_word: לָהּ לְשִׁפְחָה
  choice: para ser serva dela
  rationale: A construção indica a função que Bila passaria a exercer em relação a Raquel; esta formulação é natural em português e preserva a repetição de “serva”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem “a Raquel, sua filha” evita a possível leitura equivocada de que Bila fosse filha de Labão. A nota preserva a amplitude social de שִׁפְחָה, que pode designar serva ou escrava.
