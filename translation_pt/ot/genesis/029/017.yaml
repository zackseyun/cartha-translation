  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: pt
  text: Os olhos de Lia eram delicados[a], mas Raquel era bela de figura e de aparência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ternos”, “suaves” ou “fracos”. O adjetivo hebraico pode indicar suavidade ou delicadeza; o sentido exato aqui é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: olhos
  rationale: O plural construto se refere diretamente aos olhos de Lia, não ao seu olhar ou à sua aparência geral.
- source_word: רַכּוֹת
  choice: suaves
  rationale: O adjetivo pode expressar suavidade, ternura, delicadeza ou fraqueza. “Suaves” conserva o sentido básico sem impor uma avaliação negativa; a incerteza é registrada em nota.
- source_word: יְפַת תֹּאַר
  choice: bela de corpo
  rationale: A expressão descreve a forma ou figura física. “Bela de corpo” é clara e natural em português e mantém essa dimensão distinta da aparência visível.
- source_word: וִיפַת מַרְאֶה
  choice: e de aparência
  rationale: מַרְאֶה designa a aparência visível. A coordenação com “bela de corpo” preserva a descrição dupla do hebraico sem repetição desnecessária de “bela”.
- source_word: וְ
  choice: mas
  rationale: Embora a conjunção seja formalmente “e”, aqui ela estabelece contraste entre as descrições de Lia e Raquel; “mas” comunica essa função naturalmente.
