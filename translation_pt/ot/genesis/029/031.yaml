  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: pt
  text: Quando o SENHOR viu que Lia era odiada, abriu o seu ventre; Raquel, porém, era estéril.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Representa o nome divino YHWH segundo a convenção bíblica portuguesa amplamente reconhecida, em versaletes.
- source_word: שְׂנוּאָה
  choice: odiada
  rationale: Mantém o sentido forte e direto do particípio hebraico, sem atenuá-lo para «não amada» ou «menos amada».
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: abriu o seu ventre
  rationale: Preserva a imagem idiomática hebraica referente à concessão da capacidade de conceber.
- source_word: עֲקָרָה
  choice: estéril
  rationale: Equivalente natural e preciso para a condição de Raquel no contexto narrativo.
theological_decisions:
- issue: Intensidade da descrição da condição de Lia
  choice: odiada
  alternative: não amada / menos amada
  rationale: O hebraico emprega שְׂנוּאָה, «odiada». Embora o contexto possa envolver preferência comparativa, a tradução mantém a formulação forte do texto sem resolver essa tensão.
- issue: Ação divina sobre a fecundidade
  choice: abriu o seu ventre
  alternative: tornou-a fértil / permitiu que concebesse
  rationale: A expressão concreta do original atribui diretamente ao SENHOR a abertura do ventre; a tradução conserva essa linguagem teológica e corporal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção adversativa com «porém» preserva o contraste entre Lia e Raquel; o ponto e vírgula evita repetição desnecessária sem enfraquecer a relação entre as orações.
