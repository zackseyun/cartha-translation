  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: pt
  text: E Labão deu a Lia, sua filha, sua serva Zilpa, para que fosse serva dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como serva”. O termo hebraico designa uma serva de condição dependente, provavelmente escravizada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן indica aqui o ato de dar; “deu” é a forma narrativa mais direta e natural, sem acrescentar uma interpretação específica sobre a transação.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: a Lia, sua filha
  rationale: O pronome “a ela” é retomado e explicitado pelo próprio texto como “a Lia, sua filha”. A formulação portuguesa evita redundância e conserva Lia como destinatária.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico זִלְפָּה.
- source_word: שִׁפְחָתוֹ
  choice: sua serva
  rationale: שִׁפְחָה designa uma serva de condição dependente, provavelmente escravizada. “Serva” preserva gênero e condição social em linguagem digna e corrente; a nota esclarece a amplitude histórica do termo.
- source_word: שִׁפְחָה
  choice: para que fosse serva dela
  rationale: O substantivo final indica a função na qual Zilpa foi dada. Esta construção expressa naturalmente em português a relação pretendida, tornando explícito pelo contexto que ela serviria a Lia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para evitar a sequência ambígua de possessivos e tornar natural a identificação de Lia como destinatária e de Zilpa como serva de Labão. A repetição hebraica de שִׁפְחָה foi preservada semanticamente, sem repetição portuguesa excessivamente rígida.
