  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: pt
  text: Jacó também se uniu a Raquel[a]. Ele amou Raquel mais do que Lia e trabalhou para Labão por mais sete anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jacó também teve relações com Raquel”. A expressão hebraica é um eufemismo para a consumação da união.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: Jacó também se uniu a Raquel
  rationale: A construção בוא אֶל, neste contexto matrimonial, é um eufemismo convencional que indica a consumação da união. “Uniu-se a” comunica o sentido sexual com dignidade e naturalidade, enquanto “também” preserva גַּם e a ligação com Lia.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: Ele amava Raquel
  rationale: אָהַב é o verbo comum para “amar”; não há no verbo um intensificador que justifique “amava profundamente”.
- source_word: מִלֵּאָה
  choice: mais do que Lia
  rationale: Após um verbo de afeição, מִן tem aqui valor comparativo. “Mais do que Lia” é a leitura mais natural no contexto, embora a formulação hebraica também possa ser entendida como “em vez de Lia”.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: trabalhou para Labão
  rationale: עבד pode significar “servir” ou “trabalhar”. Embora o hebraico diga literalmente “trabalhou com ele”, o contexto descreve trabalho prestado a Labão; explicitar o nome evita um pronome ambíguo em português.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: por mais sete anos
  rationale: A combinação de עוֹד com o numeral e אֲחֵרוֹת indica um período adicional; “por mais sete anos” é corrente e exato em português.
theological_decisions: []
