base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: pt
  text: 'Labão tinha duas filhas[a]: o nome da mais velha era Lia, e o nome da mais nova era Raquel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, «e para Labão [havia] duas filhas», expressão idiomática que significa «Labão tinha duas filhas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: Labão tinha
  rationale: A construção hebraica de posse, literalmente «e para Labão [havia]», corresponde naturalmente em português a «Labão tinha». O waw não exige aqui um marcador temporal como «ora».
- source_word: שְׁתֵּי בָנוֹת
  choice: duas filhas
  rationale: Tradução direta e natural da expressão formada pelo numeral e pelo substantivo.
- source_word: שֵׁם
  choice: o nome da
  rationale: Mantém a fórmula identificadora e o paralelismo repetido do hebraico, sem a reduzir a «chamava-se».
- source_word: הַגְּדֹלָה
  choice: mais velha
  rationale: No contraste entre duas irmãs, o adjetivo indica idade relativa, não tamanho físico.
- source_word: לֵאָה
  choice: Lia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְשֵׁם
  choice: e o nome da
  rationale: Preserva a repetição e o paralelismo da formulação hebraica.
- source_word: הַקְּטַנָּה
  choice: mais nova
  rationale: No contexto das duas irmãs, exprime a menor idade relativa de modo corrente em português.
- source_word: רָחֵל
  choice: Raquel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
