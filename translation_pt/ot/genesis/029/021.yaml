  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: pt
  text: 'Então Jacó disse a Labão: “Dê-me minha esposa, pois o meu tempo se cumpriu, para que eu me una a ela[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vá a ela”, um eufemismo habitual para consumar o casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Dê-me
  rationale: A fórmula de pedido é dirigida a Labão; o pronome explicita em português o destinatário implícito da entrega, sem alterar a força do hebraico.
- source_word: אֶת אִשְׁתִּי
  choice: minha mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. “Minha mulher” conserva o sentido conjugal no contexto e soa natural no português moderno.
- source_word: כִּי מָלְאוּ יָמָי
  choice: pois o meu tempo já se cumpriu
  rationale: A expressão hebraica diz literalmente que “meus dias se completaram” e se refere ao término do período de serviço combinado. “Meu tempo já se cumpriu” comunica esse sentido com naturalidade.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: para que eu me una a ela
  rationale: בוא אל é um eufemismo hebraico para a consumação sexual do casamento. “Eu me una a ela” mantém o registro discreto e digno, enquanto a nota preserva a imagem literal.
