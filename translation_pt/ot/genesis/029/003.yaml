base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: pt
  text: Todos os rebanhos se reuniam ali. Então os pastores rolavam a pedra para longe da abertura do poço[a], davam água ao rebanho e depois recolocavam a pedra em seu lugar, sobre a abertura do poço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “boca do poço”, expressão que se refere à abertura do poço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: se reuniam
  rationale: O imperfeito nifal descreve uma ação costumeira no cenário narrativo; o pretérito imperfeito português expressa naturalmente essa repetição passada.
- source_word: כָל הָעֲדָרִים
  choice: Todos os rebanhos
  rationale: עֲדָרִים designa grupos de animais de criação, especialmente pequenos animais neste contexto pastoril; “rebanhos” é claro e natural em português.
- source_word: וְגָלֲלוּ
  choice: os pastores rolavam ... para longe
  rationale: Preserva a ação concreta de fazer a pedra rolar e explicita, com base no contexto imediato, os agentes humanos que o hebraico deixa implícitos, evitando que “rebanhos” pareça ser o sujeito.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: para longe da abertura do poço
  rationale: פִּי significa literalmente “boca de”, mas funciona aqui como expressão para a abertura; a formulação comunica tanto a remoção quanto o local de onde a pedra era retirada.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: davam água ao rebanho
  rationale: O hifil de שׁקה significa fazer beber ou dar água. צֹאן é um coletivo singular para os animais do rebanho.
- source_word: וְהֵשִׁיבוּ
  choice: recolocavam
  rationale: O hifil de שוב indica fazer voltar; “recolocavam” é idiomático para devolver um objeto ao lugar anterior.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: em seu lugar, sobre a abertura do poço
  rationale: Mantém tanto a ideia de restauração ao lugar próprio quanto a posição da pedra cobrindo a abertura.
theological_decisions: []
