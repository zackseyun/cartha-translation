  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: pt
  text: 'Ele lhes perguntou: “Ele está bem?”[a] Eles responderam: “Está bem. Vejam: Raquel, filha dele, está vindo com o rebanho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo vai bem com ele?” O hebraico usa shalom no sentido de bem-estar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Ele está bem?
  rationale: Aqui, שָׁלוֹם se refere ao bem-estar de Labão. A formulação é natural em português moderno e mantém a pergunta interpessoal.
- source_word: שָׁלוֹם
  choice: Está bem
  rationale: A resposta ecoa de modo conciso a pergunta e confirma o bem-estar de Labão, como no hebraico.
- source_word: וְהִנֵּה
  choice: Veja
  rationale: A expressão chama a atenção para alguém que está visível e se aproxima; “Veja” preserva essa força dêitica em linguagem atual.
- source_word: רָחֵל
  choice: Raquel
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בִּתּוֹ
  choice: a filha dele
  rationale: O sufixo se refere a Labão. “Dele” evita que o possessivo “sua” pareça se referir ao interlocutor.
- source_word: בָּאָה
  choice: vem vindo
  rationale: 'A forma retrata a ação em curso na cena: Raquel está se aproximando naquele momento.'
- source_word: עִם הַצֹּאן
  choice: com o rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, em especial ovelhas e cabras; “rebanho” mantém essa abrangência.
