  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: pt
  text: Então Jacó beijou Raquel[a], levantou a voz e chorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprimentou Raquel com um beijo”. O verbo hebraico normalmente significa “beijou”, mas, neste contexto, o beijo também pode ter sido uma saudação familiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: beijou
  rationale: O qal de נשׁק significa normalmente “beijar”. Aqui, o sentido direto é um beijo, que no contexto também pode funcionar como saudação familiar.
- source_word: לְרָחֵל
  choice: Raquel
  rationale: A preposição ל introduz a pessoa beijada; em português natural, o verbo “beijar” rege objeto direto.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: levantou a voz
  rationale: A expressão hebraica indica manifestação vocal intensa. “Levantou a voz” preserva a imagem e permanece natural em português, ligada aqui ao choro.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: בכה significa “chorar” ou “prantear”. “Chorou” é claro, digno e idiomático no português moderno.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz avançar a sequência narrativa; “Então” expressa essa progressão com naturalidade.
