lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: Então Jacó partiu
  rationale: A expressão idiomática hebraica significa literalmente que Jacó “levantou os pés”, indicando que retomou ou iniciou a viagem. “Partiu” comunica o sentido natural em português sem reproduzir uma imagem que soaria estranha.
- source_word: בְּנֵי קֶדֶם
  choice: povos do Oriente
  rationale: Literalmente, “filhos do Oriente”. Neste contexto, בְּנֵי funciona como designação coletiva dos habitantes ou povos da região oriental; a formulação evita sugerir filhos biológicos e preserva a referência geográfica.
