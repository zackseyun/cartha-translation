  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: pt
  text: Jacó fez assim e completou esta semana[a]. Então Labão lhe deu Raquel, sua filha, como esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta semana nupcial”. O hebraico se refere literalmente a um período de sete; neste contexto, provavelmente à semana de festividades do casamento de Lia.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Jacó fez assim
  rationale: Reproduz de modo natural a referência à instrução de Labão no versículo anterior, sem explicitar além do hebraico o que Jacó fez.
- source_word: וַיְמַלֵּא
  choice: completou
  rationale: O piel de מלא indica completar ou cumprir um período; “completou” é claro e adequado ao objeto temporal.
- source_word: שְׁבֻעַ זֹאת
  choice: aquela semana
  rationale: שְׁבֻעַ designa um período de sete, que no contexto é a semana de celebração do casamento de Lia. “Aquela semana” soa natural em português e mantém no texto a referência contextual, enquanto a nota preserva a expressão hebraica incomum.
- source_word: וַיִּתֶּן לוֹ
  choice: Então Labão lhe deu
  rationale: O sujeito implícito é Labão, retomado do contexto. Nomeá-lo evita ambiguidade em português, e “então” expressa a sequência narrativa.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: sua filha Raquel
  rationale: Expressa naturalmente em português o objeto direto e a relação familiar indicada pelo aposto hebraico.
- source_word: לוֹ לְאִשָּׁה
  choice: como esposa
  rationale: Tradução idiomática da construção que descreve dar uma mulher em casamento, sem linguagem arcaica.
