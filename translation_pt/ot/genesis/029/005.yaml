  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: pt
  text: 'Ele lhes perguntou: “Vocês conhecem Labão, filho de Naor?” Eles responderam: “Conhecemos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Ele lhes perguntou
  rationale: Embora o verbo seja literalmente “disse”, ele introduz uma pergunta direta; “perguntou” expressa naturalmente a função da fala em português, e “lhes” preserva o destinatário.
- source_word: הֲיְדַעְתֶּם
  choice: Vocês conhecem
  rationale: A forma interrogativa de יָדַע pergunta se os interlocutores conhecem pessoalmente Labão. O presente é a forma idiomática em português.
- source_word: לָבָן
  choice: Labão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בֶּן נָחוֹר
  choice: filho de Naor
  rationale: Mantém o sentido direto de בֶּן e a identificação genealógica sem transformar a expressão em “descendente”.
- source_word: וַיֹּאמְרוּ
  choice: Eles responderam
  rationale: O verbo significa literalmente “disseram”, mas aqui introduz uma resposta; “responderam” é natural e preserva a relação discursiva.
- source_word: יָדָעְנוּ
  choice: Conhecemos
  rationale: Repete em português o verbo usado na pergunta. O objeto “o” está naturalmente implícito na resposta curta, assim como no hebraico.
