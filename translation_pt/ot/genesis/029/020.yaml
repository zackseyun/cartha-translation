  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: pt
  text: Assim, Jacó serviu sete anos por Raquel, e esses anos lhe pareceram apenas poucos dias[a], por causa do amor que sentia por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e foram aos seus olhos como poucos dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: serviu
  rationale: O verbo עבד pode significar “servir” ou “trabalhar”. “Serviu” preserva tanto a ideia do trabalho prestado quanto o caráter relacional e pactuado do serviço de Jacó.
- source_word: בְּרָחֵל
  choice: por Raquel
  rationale: Neste contexto, a preposição ב indica que o serviço foi prestado em vista de Raquel. “Por Raquel” mantém a concisão do hebraico sem explicitar além do texto a finalidade matrimonial.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: esses anos lhe pareceram
  rationale: A expressão literal “foram aos seus olhos” descreve a percepção subjetiva de Jacó. A formulação escolhida comunica naturalmente esse sentido e explicita que o referente são os sete anos.
- source_word: כְּיָמִים אֲחָדִים
  choice: apenas poucos dias
  rationale: A expressão compara os sete anos a um número reduzido de dias. “Apenas” transmite de modo natural a brevidade percebida, implícita no contexto.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: por causa do amor que sentia por ela
  rationale: O בְּ introduz aqui a causa ou circunstância da percepção de Jacó. A tradução preserva o sentido causal e torna natural em português a construção nominal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva “serviu” e “por Raquel” para refletir a concisão e o caráter contratual do hebraico, enquanto verte de modo idiomático a expressão “aos seus olhos”.
