  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: pt
  text: Jacó contou a Raquel que era parente do pai dela[a] e filho de Rebeca. Então ela correu para contar isso ao pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “irmão do pai dela”. Nesse contexto, “irmão” é usado em sentido amplo para um parente próximo do sexo masculino; Jacó era, especificamente, sobrinho de Labão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O hifil de נגד significa aqui comunicar ou dar a conhecer; “contou” é natural no fluxo narrativo e funciona nas duas ocorrências do verbo.
- source_word: כִּי
  choice: que
  rationale: Nas duas ocorrências, introduz o conteúdo comunicado por Jacó.
- source_word: אֲחִי אָבִיהָ
  choice: parente do pai dela
  rationale: Embora a expressão seja literalmente “irmão do pai dela”, אָח pode designar um parente masculino. Jacó era sobrinho de Labão, por isso a tradução comunica a relação familiar pretendida sem sugerir que fossem irmãos literais.
- source_word: בֶן רִבְקָה
  choice: filho de Rebeca
  rationale: Tradução direta e idiomática da relação filial.
- source_word: וַתָּרָץ
  choice: ela correu
  rationale: Preserva o sentido concreto e o movimento vívido de רוץ.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: para contar isso ao pai
  rationale: Expressa naturalmente em português a ação subsequente e torna explícito, sem acrescentar conteúdo novo, que ela comunicou ao pai o que acabara de saber.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pai dela” evita a possível ambiguidade de “seu pai”; a nota preserva a forma concreta e a amplitude semântica do hebraico.
