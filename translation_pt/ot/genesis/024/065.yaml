  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: pt
  text: 'Então ela perguntou ao servo: “Quem é aquele homem que vem pelo campo ao nosso encontro?” O servo respondeu: “É o meu senhor.” Então ela pegou o véu e se cobriu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cobriu-se com ele”; o verbo hebraico tem sentido reflexivo e retoma o véu mencionado antes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo; neste contexto, “servo” expressa naturalmente sua função como agente da casa de Abraão sem tornar sua condição social o foco do versículo.
- source_word: הַלָּזֶה
  choice: aquele
  rationale: O demonstrativo aponta para um homem visível a certa distância; em português, “aquele homem” é a forma dêitica mais natural neste contexto.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: que vem pelo campo ao nosso encontro
  rationale: Embora הֹלֵךְ indique literalmente andar/ir, a direção é definida por לִקְרָאתֵנוּ. “Vem ... ao nosso encontro” transmite de modo natural o movimento observado por Rebeca, enquanto “pelo campo” preserva a localização ou percurso.
- source_word: הוּא אֲדֹנִי
  choice: É o meu senhor
  rationale: אֲדֹנִי significa “meu senhor” ou “meu amo”. “Meu senhor” preserva a forma respeitosa usada pelo servo para seu senhor humano, sem que o contexto sugira um título divino.
- source_word: הַצָּעִיף
  choice: o véu
  rationale: צָעִיף designa uma cobertura feminina; “véu” é claro, tradicional e adequado à cena.
- source_word: וַתִּתְכָּס
  choice: se cobriu
  rationale: A forma reflexiva indica que Rebeca cobriu a si mesma com o véu recém-mencionado.
theological_decisions:
- issue: Sentido de אֲדֹנִי
  choice: meu senhor
  alternative: meu amo
  rationale: O termo descreve a relação humana entre o servo e Isaque. A escolha mantém o respeito expresso no hebraico sem tratar “Senhor” como título divino; por isso, usa-se inicial minúscula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aquele homem” e “vem ... ao nosso encontro” refletem a perspectiva natural de quem observa alguém aproximando-se. A ordem narrativa e a repetição de “servo” foram preservadas.
