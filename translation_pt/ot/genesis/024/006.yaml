  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: pt
  text: 'Abraão lhe disse: “Tenha cuidado para não levar meu filho de volta para lá[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faça meu filho voltar para lá”. O verbo hebraico está na forma causativa: “fazer voltar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol de אמר é a forma narrativa comum; o pretérito perfeito simples é natural em português.
- source_word: אֵלָיו
  choice: lhe
  rationale: A preposição com sufixo masculino singular indica o destinatário da fala; “lhe disse” é claro e idiomático.
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: O imperativo nifal de שׁמר com dativo reflexivo expressa uma advertência enfática; esta formulação comunica o sentido em português atual.
- source_word: פֶּן
  choice: para não
  rationale: Introduz uma advertência negativa. “Para não” preserva a força preventiva sem recorrer a uma construção arcaica.
- source_word: תָּשִׁיב
  choice: levar ... de volta
  rationale: O hifil de שוב é causativo, “fazer voltar”. No contexto de deslocamento para um lugar distante do falante, “levar de volta” é a expressão mais natural, embora a forma hebraica permita tradução mais literal.
- source_word: אֶת־בְּנִי
  choice: meu filho
  rationale: A partícula marca o objeto direto, e o substantivo traz o sufixo de primeira pessoa singular.
- source_word: שָׁמָּה
  choice: para lá
  rationale: O advérbio direcional indica movimento rumo àquele lugar; “para lá” explicita naturalmente essa direção em português.
