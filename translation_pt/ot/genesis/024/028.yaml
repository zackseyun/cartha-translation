  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: pt
  text: Então, a jovem correu e contou aos da casa de sua mãe o que havia acontecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à casa de sua mãe”. A expressão hebraica pode referir-se à residência ou às pessoas pertencentes à casa de sua mãe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: correu
  rationale: O verbo רוץ indica movimento rápido; “correu” é a equivalência narrativa direta e natural.
- source_word: הַנַּעֲרָ
  choice: a jovem
  rationale: נַעֲרָה designa uma pessoa jovem do sexo feminino. “A jovem” é atual, claro e apropriado para Rebeca no contexto.
- source_word: וַתַּגֵּד
  choice: contou
  rationale: A forma hifil de נגד significa tornar conhecido, contar ou relatar; “contou” soa natural na sequência narrativa.
- source_word: לְבֵית אִמָּהּ
  choice: à casa de sua mãe
  rationale: בַּיִת pode indicar tanto a residência física quanto as pessoas da casa. A tradução formal preserva essa amplitude sem decidir entre os dois sentidos.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: essas coisas
  rationale: דְּבָרִים pode significar palavras, assuntos ou coisas. Aqui se refere ao conteúdo do que acabara de acontecer; “essas coisas” é natural e mantém a referência ampla.
