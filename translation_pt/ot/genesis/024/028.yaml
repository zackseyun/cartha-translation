  terminology: “A jovem” é adequado para נַעֲרָה e evita tanto um tom infantilizante quanto o arcaísmo de “donzela”. “Casa” é preservada na expressão e na nota, sem impor a noção mais restrita de residência nem uma leitura familiar excessivamente específica.
