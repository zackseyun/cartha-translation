  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: pt
  text: Então o homem se inclinou e adorou Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prostrou-se diante de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o homem”, referindo-se ao servo de Abraão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: se inclinou
  rationale: O verbo קָדַד descreve o ato físico de curvar-se ou inclinar-se profundamente. “Se inclinou” é natural em português e mantém esse gesto distinto do verbo seguinte.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O hebraico diz literalmente “o homem”. Embora o contexto identifique esse homem como o servo de Abraão, a tradução preserva o substantivo empregado neste versículo.
- source_word: וַיִּשְׁתַּחוּ
  choice: adorou
  rationale: A forma verbal expressa curvar-se ou prostrar-se em reverência. Como o ato é dirigido a Yahweh, “adorou” comunica claramente sua dimensão religiosa, enquanto o verbo anterior preserva o gesto corporal.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome divino no texto.
- issue: 'Sentido de וַיִּשְׁתַּחוּ: prostração corporal ou adoração'
  choice: adorou
  alternative: prostrou-se diante de
  rationale: O verbo pode destacar o gesto físico de prostração, mas, por ser dirigido a Yahweh, também expressa adoração. A tradução principal comunica essa função religiosa sem apagar a dimensão física, já indicada por “se inclinou”; a alternativa formal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção breve conserva a sequência dos dois verbos hebraicos e evita identificar interpretativamente “o homem” como “o servo” no texto principal.
