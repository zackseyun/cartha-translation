source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: pt
  text: 'Que a jovem a quem eu disser: “Por favor, abaixe o seu cântaro para que eu beba”, e que responder: “Beba, e também darei de beber aos seus camelos”, seja aquela que designaste para o teu servo Isaque.[a] Por meio dela[b] saberei que demonstraste amor leal ao meu senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o teu servo, para Isaque”. O hebraico também pode ser entendido como dois complementos distintos, sendo o primeiro uma referência ao homem que está orando.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Por isso” ou “Nisso”. Literalmente, o hebraico diz “por meio dela” ou “nela”, com um pronome feminino que pode apontar para a jovem como o sinal ou, de modo mais amplo, para o que ela fizer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Que ... seja
  rationale: A construção volitiva da oração é integrada em uma única frase natural em português, sem perder o caráter de pedido.
- source_word: הַנַּעֲרָ
  choice: a jovem
  rationale: Indica uma pessoa do sexo feminino ainda jovem, aqui em idade de se casar; “jovem” é atual e evita tanto o arcaísmo de “donzela” quanto a possível conotação infantil de “menina”.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Por favor, abaixe o seu cântaro
  rationale: הטה expressa inclinar ou baixar; “abaixe” comunica naturalmente o gesto de oferecer água, נָא é representado por “por favor”, e “cântaro” identifica um recipiente de água sem linguagem excessivamente técnica.
- source_word: וְאֶשְׁתֶּה
  choice: para que eu beba
  rationale: Expressa com naturalidade o valor volitivo da forma hebraica em dependência do pedido anterior.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: e também darei de beber aos seus camelos
  rationale: Preserva o sentido causativo de שׁקה e a inclusão marcada por גַּם.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: seja aquela que designaste
  rationale: Neste contexto, o hifil de יכח indica a mulher determinada ou assinalada por Deus; “designaste” transmite esse sentido sem sugerir uma nomeação institucional.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: para o teu servo Isaque
  rationale: A repetição da preposição לְ admite naturalmente uma relação apositiva, identificando Isaque como o servo de Deus. A leitura com dois dativos é preservada em nota.
- source_word: וּבָהּ אֵדַע
  choice: Por meio dela saberei
  rationale: O sufixo feminino singular retoma de modo mais direto a jovem como o meio ou sinal pelo qual o servo reconhecerá a resposta; a referência mais ampla à situação é registrada em nota.
- source_word: כִּי עָשִׂיתָ חֶסֶד
  choice: que demonstraste amor leal
  rationale: “Amor leal” conserva as dimensões de bondade, compromisso e fidelidade relacional de חֶסֶד sem impor aqui uma fórmula técnica de aliança.
- source_word: עִם אֲדֹנִי
  choice: ao meu senhor
  rationale: Embora עִם tenha o sentido básico de “com”, “demonstrar amor leal a alguém” é a construção idiomática em português.
theological_decisions:
- issue: Relação entre “teu servo” e “Isaque” em לְעַבְדְּךָ לְיִצְחָק
  choice: 'Leitura apositiva: “para o teu servo Isaque”.'
  alternative: 'Leitura com dois dativos: “para o teu servo, para Isaque”, na qual “teu servo” poderia referir-se ao homem que está orando.'
  rationale: O objetivo da oração é identificar a mulher destinada a Isaque, e a repetição da preposição pode introduzir uma aposição em hebraico. Como a estrutura também permite formalmente a leitura com dois dativos, essa alternativa não é eliminada, mas indicada em nota.
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: bondade; amor fiel; fidelidade de aliança
  rationale: A escolha mantém a riqueza relacional do termo sem reduzi-lo a mera cortesia nem especificar além do texto uma formulação técnica de aliança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas brasileiras naturais como “seu” no discurso dirigido à jovem e “teu” na oração dirigida a Deus. A sintaxe foi suavizada para evitar uma retomada redundante do pedido, preservando o valor volitivo do hebraico.
