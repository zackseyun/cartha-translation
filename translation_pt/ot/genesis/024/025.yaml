base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: pt
  text: 'Então ela lhe disse: “Temos muita palha e muita forragem, e também lugar para passar a noite.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Então ela lhe disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” preserva a sequência com fluidez, e “lhe disse” traduz naturalmente a fala dirigida a ele.
- source_word: גַּם ... גַּם ... גַּם
  choice: muita ... muita ... e também
  rationale: A repetição de גַּם acumula e enfatiza os itens. Em português, a formulação mantém o efeito cumulativo sem soar artificial.
- source_word: תֶּבֶן
  choice: palha
  rationale: No contexto de provisões para animais, “palha” é a tradução corrente e clara.
- source_word: מִסְפּוֹא
  choice: forragem
  rationale: Designa alimento para animais; “forragem” é preciso, atual e adequado ao contexto.
- source_word: רַב עִמָּנוּ
  choice: Temos muita
  rationale: Literalmente, a expressão indica que há grande quantidade “conosco”. A construção possessiva “Temos muita” comunica isso de modo natural em português.
- source_word: מָקוֹם לָלוּן
  choice: lugar para passar a noite
  rationale: Preserva a generalidade de מָקוֹם e traduz o infinitivo לון com uma expressão portuguesa natural ligada à hospedagem noturna.
