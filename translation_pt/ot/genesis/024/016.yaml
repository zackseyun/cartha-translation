base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: pt
  text: A jovem era muito bonita, uma virgem; nenhum homem a havia conhecido.[a] Ela desceu até a fonte[b], encheu o seu jarro e tornou a subir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum homem havia tido relações sexuais com ela”. O hebraico diz literalmente: “nenhum homem a havia conhecido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “até a fonte”. Algumas traduções trazem “até o poço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: a jovem
  rationale: נַעֲרָה designa uma pessoa jovem do sexo feminino, aqui em idade de casar. “A jovem” é atual, natural e mais amplamente compreensível do que “donzela” ou “moça”.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: era muito bonita
  rationale: A expressão descreve a grande beleza da aparência. Em português, “era muito bonita” comunica naturalmente esse sentido sem a rigidez de “boa de aparência”.
- source_word: בְּתוּלָה
  choice: uma virgem
  rationale: בְּתוּלָה normalmente designa uma virgem neste tipo de narrativa; a tradução direta também prepara o sentido da oração seguinte.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: nenhum homem a havia conhecido
  rationale: יָדַע, “conhecer”, funciona aqui como eufemismo hebraico para relações sexuais. A formulação preserva a linguagem discreta e literária do original, com esclarecimento em nota.
- source_word: הָעַיְנָה
  choice: até a fonte
  rationale: עַיִן designa uma nascente ou fonte de água. “Fonte” é mais preciso do que “poço”, que normalmente traduz outro termo hebraico.
- source_word: כַדָּהּ
  choice: o seu jarro
  rationale: כַּד é um recipiente usado para buscar água. “Jarro” é claro e corrente, além de preservar a ideia de um recipiente portátil.
- source_word: וַתָּעַל
  choice: e tornou a subir
  rationale: עָלָה expressa o movimento de subida, em contraste com a descida até a fonte. “Tornou a subir” torna essa relação espacial explícita e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. Preserva-se o eufemismo hebraico “conhecer”, esclarecido em nota, e a oposição espacial entre descer e subir.
