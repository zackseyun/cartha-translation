base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: pt
  text: 'Então ele disse: “De quem você é filha? Por favor, diga-me. Há lugar na casa de seu pai para passarmos a noite[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para nos hospedarmos”.'
    reason: Alternativa lexical para לָלִין, preservando seu sentido de alojar-se ou permanecer durante a noite.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa essa progressão com naturalidade, enquanto “disse” preserva o verbo hebraico sem substituí-lo por “perguntou”.
- source_word: בַּת מִי אַתְּ
  choice: De quem você é filha?
  rationale: Formulação portuguesa natural que mantém o foco hebraico na identidade familiar da jovem.
- source_word: הַגִּידִי נָא לִי
  choice: Por favor, diga-me
  rationale: A partícula נָא atenua o imperativo e o apresenta como pedido cortês; “por favor” reproduz essa força.
- source_word: הֲיֵשׁ
  choice: Há
  rationale: Equivalente existencial direto e corrente em português para a pergunta introduzida por הֲיֵשׁ.
- source_word: בֵּית אָבִיךְ
  choice: na casa de seu pai
  rationale: Preserva a referência concreta à casa e, no contexto antigo, ao domicílio familiar sob a autoridade do pai.
- source_word: מָקוֹם
  choice: lugar
  rationale: “Lugar” mantém o sentido amplo do substantivo hebraico e soa natural no contexto de disponibilidade para hospedagem.
- source_word: לָנוּ
  choice: para passarmos
  rationale: A flexão na primeira pessoa do plural conserva a referência ao servo e aos que o acompanhavam.
- source_word: לָלִין
  choice: passarmos a noite
  rationale: Expressão moderna e clara para o infinitivo de לון/לין, que neste contexto significa permanecer hospedado durante a noite.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e mantém “casa de seu pai” para conservar o cenário familiar e social do texto hebraico.
