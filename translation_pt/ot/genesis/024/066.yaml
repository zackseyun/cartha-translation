  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: pt
  text: E o servo[b] contou a Isaque tudo[a] o que havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os acontecimentos”, “todos os assuntos” ou “todas as palavras”; o hebraico דְּבָרִים pode referir-se a palavras, assuntos ou acontecimentos, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o escravo”; o hebraico עֶבֶד pode significar “servo” ou “escravo”, mas aqui a narrativa enfatiza sua função, não sua condição jurídica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: contou
  rationale: O piel narrativo de ספר indica que o servo relatou os acontecimentos; “contou” é natural, claro e adequado ao contexto.
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, o foco recai sobre a função desempenhada na casa de Abraão, por isso “servo” é a opção contextual mais natural.
- source_word: לְיִצְחָק
  choice: a Isaque
  rationale: O nome próprio é apresentado em sua forma portuguesa tradicional e amplamente reconhecida.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tudo
  rationale: דְּבָרִים pode referir-se a palavras, assuntos ou acontecimentos. Aqui abrange o conjunto dos atos e acontecimentos da missão; “tudo” comunica esse sentido de modo idiomático.
- source_word: אֲשֶׁר עָשָׂה
  choice: o que havia feito
  rationale: A locução “havia feito” deixa clara a anterioridade das ações do servo em relação ao momento em que ele as relatou.
