source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: pt
  text: 'Yahweh, o Deus dos céus, que me tirou da casa de meu pai e da terra onde nasci, que falou comigo e me fez um juramento, dizendo: “À sua descendência darei esta terra” — ele enviará o seu anjo[a] à sua frente, e você tomará de lá uma esposa para meu filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. A palavra hebraica מַלְאָךְ pode significar tanto “mensageiro” como “anjo”; neste contexto, um mensageiro celestial é o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: o Deus dos céus
  rationale: Expressão natural em português que conserva a construção hebraica e o plural formal de שָׁמַיִם.
- source_word: לְקָחַנִי
  choice: me tirou
  rationale: No contexto, לקח descreve Deus retirando Abraão de seu antigo lar; “me tirou” expressa isso com clareza e naturalidade.
- source_word: מִבֵּית אָבִי
  choice: da casa de meu pai
  rationale: Preserva a expressão familiar e doméstica do hebraico sem ampliá-la para uma interpretação sobre todo o clã.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: e da terra onde nasci
  rationale: Comunica naturalmente o sentido de terra natal ou terra de nascimento, sem definir מוֹלֶדֶת exclusivamente como parentela.
- source_word: דִּבֶּר לִי
  choice: falou comigo
  rationale: Mantém o sentido básico do verbo e não o funde interpretativamente com a promessa ou o juramento que seguem.
- source_word: נִשְׁבַּע לִי
  choice: me jurou
  rationale: Forma direta e idiomática para o verbo de juramento no nifal.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: “Descendência” pode funcionar coletivamente e preserva melhor a abrangência de זֶרַע do que uma formulação estritamente plural.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: darei esta terra
  rationale: Reproduz de modo conciso a fórmula de promessa e mantém “terra”, termo apropriado ao contexto.
- source_word: הוּא
  choice: ele
  rationale: O pronome expresso recebe destaque pela retomada após o travessão, sem ser expandido para “ele mesmo”.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: enviará o seu anjo à sua frente
  rationale: “Anjo” é o sentido mais provável para מַלְאָךְ neste contexto de direção divina; “à sua frente” conserva de perto לְפָנֶיךָ.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: e você tomará de lá uma esposa para meu filho
  rationale: Preserva o tom de incumbência e a relação sintática com “de lá”, usando “esposa” para tornar claro o propósito matrimonial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. A transliteração preserva esse nome em vez de substituí-lo por um título; “Jeová” reflete uma forma tradicional secundária.
- issue: Sentido de מַלְאָכוֹ neste contexto
  choice: o seu anjo
  alternative: o seu mensageiro
  rationale: O termo hebraico pode designar um mensageiro humano ou celestial. A referência à ação providencial de Deus favorece um mensageiro celestial, mas a ambiguidade lexical genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “que” conserva a estrutura solene da fala sem torná-la excessivamente rígida. O travessão destaca a retomada enfática por “ele”. O marcador [a] foi colocado junto de “anjo”, termo ao qual a nota efetivamente se refere.
