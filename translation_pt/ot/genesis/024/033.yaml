base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: pt
  text: 'Foi posta comida diante dele, para que comesse, mas ele disse: “Não comerei até que tenha dito o que tenho a dizer[a].” E ele disse: “Fale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “até que eu tenha falado as minhas palavras”.
    reason: A expressão hebraica é literalmente “falado as minhas palavras”; o texto emprega uma formulação idiomática portuguesa para o conteúdo da fala.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: puseram
  rationale: O verbo significa “pôr, colocar”. Embora a forma hebraica seja singular, o sujeito não é expresso e a versão plural indeterminada soa natural em português, sem identificar indevidamente quem serviu a comida.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente corrente e digno para a expressão hebraica que significa literalmente “diante de sua face/presença”.
- source_word: לֶאֱכֹל
  choice: para que comesse
  rationale: O infinitivo com ל indica finalidade. A oração final explicita naturalmente em português que a comida foi posta para ele comer.
- source_word: לֹא אֹכַל
  choice: Não comerei
  rationale: O imperfeito expressa aqui decisão firme orientada ao futuro; o futuro simples conserva a concisão e a determinação do hebraico.
- source_word: עַד אִם
  choice: enquanto não
  rationale: Nesta construção, marca o limite anterior ao cumprimento da condição. “Enquanto não tiver dito” é uma formulação portuguesa natural equivalente a “até que eu tenha dito”.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: tiver dito o que tenho a dizer
  rationale: A expressão literal é “tiver falado minhas palavras”, mas funciona idiomaticamente como referência à mensagem ou ao assunto que o servo precisa expor. A tradução comunica esse sentido sem alterar o conteúdo.
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo singular de דבר é reproduzido de modo direto, conciso e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e a firmeza do diálogo foram preservadas; a expressão idiomática “o que tenho a dizer” evita o artificial “minhas palavras” sem resolver qualquer questão teológica.
