  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: pt
  text: 'Antes que eu terminasse de falar em meu coração[a], eis que Rebeca saiu com o seu cântaro sobre o ombro, desceu à fonte e tirou água. Então eu lhe disse: “Por favor, dê-me de beber.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “falar ao meu coração”, expressão que indica fala interior ou oração silenciosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Antes que eu terminasse
  rationale: Expressa naturalmente em português uma ação ainda não concluída no momento em que o evento seguinte ocorreu.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: de falar em meu coração
  rationale: Preserva de modo compreensível o idioma hebraico, que indica fala interior e, no contexto, pode envolver oração silenciosa.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a apresentação súbita e vívida marcada pela partícula hebraica, em registro narrativo digno.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יֹצֵאת
  choice: saiu
  rationale: O particípio após וְהִנֵּה apresenta vividamente a ação; o pretérito perfeito é natural na narrativa portuguesa.
- source_word: כַדָּהּ
  choice: seu cântaro
  rationale: כַּד designa um recipiente usado para buscar água; “cântaro” é preciso, conhecido e adequado ao contexto.
- source_word: עַל־שִׁכְמָהּ
  choice: sobre o ombro
  rationale: Reproduz diretamente a localização indicada pelo hebraico.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: desceu à fonte
  rationale: עַיִן aqui designa uma nascente ou fonte, e não o termo hebraico mais comum para poço; “fonte” preserva essa distinção.
- source_word: וַתִּשְׁאָב
  choice: tirou água
  rationale: O verbo se refere a retirar água; explicitar “água” produz uma expressão natural em português.
- source_word: הַשְׁקִינִי נָא
  choice: Por favor, dê-me de beber
  rationale: Representa tanto o imperativo causativo “dar de beber” quanto a partícula cortês נָא.
theological_decisions:
- issue: Natureza da fala interior de Eliezer
  choice: Manter “falar em meu coração” sem defini-la explicitamente como oração
  alternative: Traduzir “orar em silêncio” ou “falar comigo mesmo”
  rationale: O idioma hebraico denota fala interior; o contexto sugere oração, mas a tradução não deve eliminar a abertura semântica do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Eis que” conserva a vivacidade narrativa do hebraico; “cântaro” e “fonte” mantêm precisão contextual sem tornar a frase excessivamente arcaica.
