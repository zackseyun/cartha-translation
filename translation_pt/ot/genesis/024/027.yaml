  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: pt
  text: 'E ele disse: “Bendito seja Yahweh, o Deus de meu senhor Abraão, que não retirou de meu senhor o seu amor leal e a sua fidelidade[a]. Quanto a mim, Yahweh me guiou pelo caminho até a casa dos irmãos[b] de meu senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua bondade e sua verdade”. O par hebraico costuma transmitir a ideia de amor leal e confiabilidade.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “irmãos”; aqui, o termo se refere aos parentes masculinos ou à linhagem familiar de Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Mantém a fórmula de louvor e bênção dirigida a Deus, em português natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: o Deus de meu senhor Abraão
  rationale: Reproduz com clareza a cadeia construta e a maneira respeitosa como o servo se refere a Abraão.
- source_word: לֹא עָזַב חַסְדּוֹ וַאֲמִתּוֹ מֵעִם אֲדֹנִי
  choice: não deixou de mostrar seu amor leal e sua fidelidade para com meu senhor
  rationale: Expressa idiomaticamente que Yahweh não retirou de Abraão sua lealdade amorosa e confiabilidade. A formulação evita o português pouco natural de uma reprodução rígida de עזב...מעם.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: Comunica tanto a bondade amorosa quanto a constância relacional de חֶסֶד, sem limitar o termo a uma formulação denominacional.
- source_word: וַאֲמִתּוֹ
  choice: e sua fidelidade
  rationale: No par com חֶסֶד, אֱמֶת ressalta confiabilidade e constância, mais do que apenas verdade em sentido abstrato.
- source_word: אָנֹכִי
  choice: Quanto a mim
  rationale: Preserva a ênfase do pronome independente anteposto.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: me guiou pelo caminho
  rationale: Traduz de modo natural a orientação providencial recebida durante a viagem.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: até a casa dos irmãos de meu senhor
  rationale: Conserva o termo masculino plural 'irmãos' e entende בֵּית como o destino da orientação, a casa ou família dos parentes masculinos de Abraão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; sua transliteração preserva a distinção entre nome e título.
- issue: Sentido do par חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  alternative: bondade e verdade; misericórdia e verdade
  rationale: A escolha conserva a tensão entre afeto, lealdade e confiabilidade presente no par hebraico, sem acrescentar explicitamente 'aliança', palavra que não aparece no versículo.
- issue: Alcance de אֲחֵי
  choice: irmãos, com esclarecimento em nota
  alternative: parentes; familiares
  rationale: O texto principal mantém a forma masculina do hebraico, enquanto a nota informa que, no contexto, ela designa os parentes ou a linhagem familiar masculina de Abraão.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das frases preserva a ênfase do hebraico sem produzir construções artificiais; os marcadores de nota foram colocados junto às expressões que explicam.
