  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: pt
  text: 'E eu disse ao meu senhor: “Talvez a mulher não me acompanhe[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não vá atrás de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: E eu disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa no passado; “E eu disse” preserva sua força sequencial simples.
- source_word: אֶל אֲדֹנִי
  choice: ao meu senhor
  rationale: אָדוֹן com sufixo de primeira pessoa refere-se aqui a Abraão como superior humano do servo. “Meu senhor” preserva a forma respeitosa sem tratá-la como título divino.
- source_word: אֻלַי
  choice: Talvez
  rationale: A partícula expressa possibilidade ou incerteza, adequadamente representada por “talvez”.
- source_word: לֹא תֵלֵךְ הָאִשָּׁה אַחֲרָי
  choice: a mulher não me acompanhe
  rationale: Embora הלך com אַחֲרַי seja literalmente “ir atrás de mim”, no contexto indica acompanhar o servo em sua viagem. O presente do subjuntivo após “talvez” é a forma natural em português para a possibilidade expressa pelo imperfeito hebraico.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: O substantivo significa simplesmente “a mulher”; não se introduz antecipadamente a ideia mais específica de “esposa” ou “noiva”.
