id: GEN.24.35
reference: Genesis 24:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: pt
  text: Yahweh abençoou muito o meu senhor, e ele se tornou grande. Yahweh lhe deu rebanhos e gado, prata e ouro, servos e servas[a], camelos e jumentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escravos e escravas». Os termos hebraicos podem designar servos domésticos ou pessoas escravizadas, conforme o contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בֵּרַךְ ... מְאֹד
  choice: abençoou muito
  rationale: Expressa de modo natural a ação de abençoar e a forte intensidade indicada por מְאֹד.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Refere-se ao superior humano do servo, Abraão; «senhor» preserva o tratamento respeitoso sem sugerir aqui um título divino.
- source_word: וַיִּגְדָּל
  choice: ele se tornou grande
  rationale: Preserva o sentido amplo de crescimento em riqueza, posição e importância, sem reduzi-lo apenas à prosperidade material.
- source_word: וַיִּתֶּן לוֹ
  choice: Yahweh lhe deu
  rationale: Explicita o sujeito retomado pelo contexto e mantém Abraão como objeto indireto, evitando ambiguidade indevida em português.
- source_word: צֹאן וּבָקָר
  choice: rebanhos e gado
  rationale: Representa os animais de pequeno porte criados em rebanhos e o gado bovino por meio de uma combinação corrente em português.
- source_word: כֶסֶף וְזָהָב
  choice: prata e ouro
  rationale: Mantém os metais preciosos concretamente mencionados no hebraico.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: servos e servas
  rationale: Conserva a distinção de gênero e usa termos que podem abranger serviço doméstico, enquanto a nota registra a possibilidade de condição escrava.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: camelos e jumentos
  rationale: Equivalentes diretos e correntes dos dois animais mencionados.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome próprio divino; sua transliteração preserva essa distinção em relação a títulos como אֲדֹנָי.
- issue: Condição social indicada por עֲבָדִים e שְׁפָחֹת
  choice: servos e servas
  alternative: escravos e escravas
  rationale: Os termos hebraicos podem designar servos domésticos ou pessoas escravizadas. Como o versículo não define com precisão sua condição jurídica, o texto principal mantém a formulação mais abrangente e a nota preserva a alternativa mais forte.
- issue: Amplitude de וַיִּגְדָּל
  choice: ele se tornou grande
  alternative: ele ficou muito rico; ele prosperou
  rationale: A enumeração destaca riqueza, mas o verbo pode incluir também posição e importância; a tradução mantém essa amplitude.
translation_notes:
  register: Português atual, claro e digno, com sintaxe acessível. A repetição de «Yahweh» esclarece a mudança de sujeito depois de «ele se tornou grande». «Jumentos» foi preferido a «asnos» por sua ampla legibilidade brasileira, sem caráter coloquial.
