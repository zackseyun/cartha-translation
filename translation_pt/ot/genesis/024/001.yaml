  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: pt
  text: Abraão era velho, avançado em idade[a], e Yahweh havia abençoado Abraão em tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «chegado em dias», um idioma hebraico que indica idade avançada.
    reason: Explica o idioma בָּא בַּיָּמִים e sua forma literal.
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraão
  rationale: O waw introduz a nova unidade narrativa; em português, a ligação pode ficar implícita sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: זָקֵן
  choice: já era velho
  rationale: Expressa diretamente a velhice de Abraão; «já» comunica de modo natural o estado alcançado no contexto narrativo, sem alterar o conteúdo.
- source_word: בָּא בַּ/יָּמִים
  choice: avançado em idade
  rationale: Traduz naturalmente o idioma hebraico, literalmente «entrado nos dias», preservando seu sentido de idade avançada.
- source_word: וַֽ/יהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, distinguindo-o do título «Senhor».
- source_word: בֵּרַךְ
  choice: havia abençoado
  rationale: O mais-que-perfeito apresenta a bênção como realidade anterior e vigente, servindo de pano de fundo para a narrativa.
- source_word: בַּ/כֹּל
  choice: em tudo
  rationale: Comunica de forma concisa e abrangente que a bênção alcançava todos os aspectos, sem restringi-la a bens materiais.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; «Yahweh» preserva o nome próprio e evita confundi-lo com um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo entre «velho» e «avançado em idade» e conserva a repetição de «Abraão» presente no hebraico.
