  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: pt
  text: e farei você jurar por Yahweh, o Deus dos céus e o Deus da terra, que não tomará para meu filho uma esposa dentre as filhas dos cananeus, no meio dos quais habito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: e farei você jurar
  rationale: 'O hifil de שׁבע é causativo: fazer alguém jurar. A formulação conserva essa força e é clara em português atual.'
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: A preposição indica aquele por quem se presta o juramento; o nome divino é transliterado como Yahweh.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: o Deus dos céus e o Deus da terra
  rationale: Mantém a repetição hebraica de 'Deus de' e o alcance cósmico do par céus-terra. O plural português 'céus' é a forma bíblica natural para הַשָּׁמַיִם.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: que não tomará
  rationale: Introduz o conteúdo do juramento e preserva seu tom solene; 'tomar' mantém a expressão matrimonial do texto hebraico.
- source_word: אִשָּׁה לִבְנִי
  choice: para meu filho uma esposa
  rationale: No contexto matrimonial, אִשָּׁה significa 'esposa', não apenas 'mulher'.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: dentre as filhas dos cananeus
  rationale: Preserva a imagem idiomática 'filhas de' e explicita naturalmente a pertença ao povo cananeu.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: no meio dos quais habito
  rationale: Expressa residência entre esse povo e preserva o sentido de בְּקִרְבּוֹ em registro digno e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a construção causativa do juramento, a repetição 'o Deus... e o Deus...' e a imagem 'filhas dos cananeus'.
