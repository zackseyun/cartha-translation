  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: pt
  text: Sara, mulher do meu senhor, deu à luz um filho ao meu senhor depois de já ter envelhecido; e ele lhe deu tudo o que possuía.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: deu à luz
  rationale: O qal narrativo de ילד descreve o nascimento; «deu à luz» é a expressão natural e digna em português.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: mulher do meu senhor
  rationale: Reproduz a relação do construto hebraico e preserva o modo respeitoso como o servo se refere a Abraão.
- source_word: בֵן לַאדֹנִי
  choice: um filho ao meu senhor
  rationale: «Um filho» corresponde ao substantivo sem artigo, e «ao meu senhor» conserva a relação expressa por ל sem tornar a frase artificial em português.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: depois de já ter envelhecido
  rationale: Comunica naturalmente o sentido temporal da expressão hebraica, literalmente «depois de sua velhice», mantendo a ênfase na idade avançada de Sara.
- source_word: וַיִּתֶּן לוֹ
  choice: e ele lhe deu
  rationale: Mantém a sequência narrativa no passado e preserva a forma pronominal do hebraico; pelo contexto, «ele» se refere a Abraão e «lhe» ao filho.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: tudo o que possuía
  rationale: Expressa com clareza e naturalidade a totalidade dos bens que pertenciam a Abraão.
