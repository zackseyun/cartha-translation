review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: a mulher age prontamente, baixa o cântaro, convida o servo a beber e oferece água também aos camelos; em seguida, o servo bebe e ela dá água aos camelos. Contudo, “de sobre si” é um decalque pouco idiomático em português. No contexto imediato mais amplo, o cântaro está sobre o ombro (Gn 24:15, 45), e “do ombro” comunica naturalmente o referente idiomático, com nota que conserva a literalidade e registra que a parte do corpo não é dita neste versículo.'
  naturalness: A revisão torna a frase fluente em português moderno. “Ela se apressou e baixou o cântaro do ombro” evita a construção artificial “baixou o cântaro de sobre si”. Também se ajusta a pontuação da fala direta.
  terminology: “Cântaro”, “dar água” e “camelos” são escolhas adequadas, claras e consistentes com o registro narrativo. “Beba” e “seus camelos” mantêm tratamento respeitoso e natural.
  issues:
