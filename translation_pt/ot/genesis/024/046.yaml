base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: pt
  text: 'Ela se apressou e baixou o cântaro do ombro[a], e disse: “Beba, e também darei água aos seus camelos.” Então bebi, e ela também deu água aos camelos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de sobre ela”. O contexto mais amplo sugere que o cântaro era carregado no ombro, mas esta parte do corpo não é explicitada aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Ela se apressou
  rationale: O verbo מהר expressa pressa ou prontidão. A forma verbal preserva de modo natural a ênfase narrativa na rapidez da ação.
- source_word: וַתּוֹרֶד
  choice: baixou
  rationale: O hifil de ירד indica fazer descer. “Baixou” descreve com clareza o movimento do cântaro sem acrescentar um ponto anatômico ausente do hebraico.
- source_word: כַּדָּהּ
  choice: o cântaro
  rationale: כד designa um recipiente usado para buscar e transportar água. “Cântaro” é claro, digno e adequado ao contexto.
- source_word: מֵעָלֶיהָ
  choice: de sobre si
  rationale: A expressão significa literalmente “de sobre ela”. “De sobre si” conserva a imprecisão do original quanto à parte do corpo, embora o contexto sugira o ombro.
- source_word: שְׁתֵה
  choice: Beba
  rationale: O imperativo direto reproduz a fala breve do hebraico e soa natural em português.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: e também darei água aos seus camelos
  rationale: O hifil de שקה significa dar de beber ou fornecer água. Esta formulação é corrente e mantém explícito o objeto fornecido.
- source_word: וָאֵשְׁתְּ
  choice: Então bebi
  rationale: A sequência narrativa apresenta a bebida como resposta à oferta; “Então” expressa naturalmente essa progressão.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: e ela também deu água aos camelos
  rationale: A tradução mantém a correspondência lexical com a fala anterior e comunica claramente a ação completada.
