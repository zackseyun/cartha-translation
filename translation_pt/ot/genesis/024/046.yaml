    issue: “de sobre si” é pouco natural e pode soar opaco em português contemporâneo.
    rationale: Embora reproduza formalmente a expressão hebraica, não constitui formulação idiomática em português. O contexto narrativo identifica o ombro como o local de onde o cântaro é baixado; a nota preserva a precisão textual de que este versículo não nomeia a parte do corpo.
  - severity: low
    issue: A pontuação da fala direta precisa de ajuste.
    rationale: A declaração completa de Rebeca deve terminar com ponto antes do fechamento das aspas.
