base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: pt
  text: 'O servo correu ao encontro dela e disse[a]: “Por favor, deixe-me beber um pouco de água do seu cântaro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dê-me de beber um pouco de água do seu cântaro.” O imperativo hebraico pode ser expresso tanto por “deixe-me beber” como por “dê-me de beber”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: correu
  rationale: O verbo רוץ, na forma narrativa wayyiqtol, indica diretamente o ato de correr e preserva a rapidez da ação.
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, trata-se do agente de confiança da casa de Abraão; “servo” comunica naturalmente sua função sem tornar sua condição jurídica o foco do versículo.
- source_word: לִקְרָאתָהּ
  choice: ao encontro dela
  rationale: A construção לִקְרַאת com sufixo indica movimento em direção a alguém para encontrá-lo; “ao encontro dela” é idiomático e fiel.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: É a fórmula narrativa comum de introdução da fala direta; o sujeito permanece claro em português.
- source_word: הַגְמִיאִינִי
  choice: deixe-me beber
  rationale: O imperativo hifil de גמא com sufixo de primeira pessoa pode significar “dê-me de beber” ou “deixe-me beber”. A escolha preserva de perto a estrutura do hebraico e soa como pedido cortês.
- source_word: נָא
  choice: por favor
  rationale: נָא assinala súplica ou cortesia; “por favor” é o equivalente moderno e natural.
- source_word: מְעַט מַיִם
  choice: um pouco de água
  rationale: A expressão indica uma pequena quantidade de água e preserva a modéstia do pedido.
- source_word: מִכַּדֵּךְ
  choice: do seu cântaro
  rationale: כַּד designa um recipiente usado para buscar e transportar água. “Cântaro” é claro no contexto bíblico e o possessivo preserva o sufixo feminino singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cântaro” mantém a ambientação antiga sem prejudicar a compreensão; a colocação “ao encontro dela” é natural e preserva o movimento intencional do hebraico.
