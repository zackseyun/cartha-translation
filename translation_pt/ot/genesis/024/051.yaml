base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: pt
  text: Aqui está Rebeca diante de você. Tome-a e vá, e que ela seja[a] a esposa do filho do seu senhor, conforme Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ela se torne esposa do filho do seu senhor”. O jussivo hebraico pode indicar tanto que ela seja a esposa quanto que venha a sê-lo.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: הִנֵּה
  choice: Aqui está
  rationale: A partícula dêitica chama a atenção para Rebeca, presente e disponível diante do interlocutor. “Aqui está” é corrente e vívido em português.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Preserva a imagem espacial do hebraico e, no contexto, comunica presença e disponibilidade.
- source_word: קַח וָלֵךְ
  choice: Tome-a e vá
  rationale: Reproduz os dois imperativos sucessivos; o pronome “a”, implícito no hebraico pelo contexto, identifica Rebeca como objeto.
- source_word: וּתְהִי אִשָּׁה
  choice: e que ela seja esposa
  rationale: O jussivo expressa consentimento ou desejo. “Que ela seja” preserva essa modalidade sem transformá-la em simples declaração; “esposa” comunica com clareza o sentido matrimonial de אִשָּׁה neste contexto.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: do filho do seu senhor
  rationale: Expressa naturalmente em português a relação matrimonial indicada por לְ, mantendo “senhor” para אֲדֹן no contexto da relação entre servo e senhor.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... falou
  rationale: “Conforme” expressa correspondência com a palavra divina; o pretérito perfeito traduz de modo direto a ação concluída do perfeito hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em forma transliterada, sem substituí-lo por um título.
- issue: Força modal de וּתְהִי
  choice: que ela seja
  alternative: que ela se torne; ela será
  rationale: A forma jussiva admite a ideia de permissão ou desejo. A tradução escolhida mantém essa força modal e não a converte numa previsão categórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” evita regionalismo excessivo; “Tome-a” e “conforme” mantêm um tom narrativo respeitoso sem arcaísmo.
