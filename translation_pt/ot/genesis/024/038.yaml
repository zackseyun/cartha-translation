  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: pt
  text: Mas você irá à casa de meu pai e à minha parentela[a] e tomará uma esposa para meu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha família” ou “meus parentes”. O termo hebraico indica um grupo familiar ampliado, não apenas a família imediata.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Mas
  rationale: Neste contexto de juramento, a expressão introduz a alternativa exigida em contraste com a proibição anterior. “Mas” comunica esse contraste naturalmente, sem tratá-la como uma condição independente.
- source_word: בֵּית אָבִי
  choice: à casa de meu pai
  rationale: Preserva de modo natural a construção hebraica e permite tanto a referência ao lar paterno quanto ao grupo doméstico ligado ao pai.
- source_word: תֵּלֵךְ
  choice: você irá
  rationale: O imperfeito tem força diretiva no encargo dado ao servo. O futuro em português expressa adequadamente a obrigação no contexto do juramento.
- source_word: מִשְׁפַּחְתִּי
  choice: minha parentela
  rationale: O termo designa um grupo familiar ampliado. “Parentela” evita o sentido moderno possivelmente restrito de “família” e é mais claro para leitores gerais do que “clã” neste contexto.
- source_word: וְלָקַחְתָּ
  choice: e tomará
  rationale: Mantém o verbo comum para tomar ou obter alguém como esposa, com a força diretiva do encargo.
- source_word: אִשָּׁה
  choice: uma esposa
  rationale: Embora o substantivo também possa significar “mulher”, o contexto matrimonial requer “esposa”.
- source_word: לִבְנִי
  choice: para meu filho
  rationale: A preposição indica finalidade ou benefício no arranjo matrimonial; “para meu filho” é natural e precisa.
