  source_fidelity: A tradução capta corretamente a isenção da obrigação juramentada e a repetição enfática. Contudo, “que lhe impus” explicita uma relação de imposição que não está formulada no hebraico, que diz literalmente “minha maldição/juramento”; e o pronome “a” torna explícito um objeto feminino que o hebraico deixa implícito.
  naturalness: O português é moderno, claro e de registro adequado. “Não lhe derem” é uma elipse natural em português e preserva a indeterminação formal do objeto, recuperável pelo contexto.
  terminology: “Juramento” é uma boa tradução principal de אָלָה neste contexto. A nota preserva adequadamente a alternativa “maldição”, mas deve acompanhar a formulação possessiva do texto (“meu juramento”), sem acrescentar “que lhe impus”.
