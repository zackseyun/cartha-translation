  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: pt
  text: Então você ficará livre do meu juramento[a] quando chegar à minha família; e, se eles não lhe derem, ficará livre do meu juramento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da minha maldição”. O termo hebraico pode indicar um juramento acompanhado de maldição ou sanção.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: ficará livre
  rationale: Neste contexto jurídico, as formas de נקה indicam isenção da obrigação e da responsabilidade decorrentes do juramento, não inocência moral abstrata. A mesma expressão foi mantida nas duas ocorrências.
- source_word: מֵאָלָתִי
  choice: do juramento que lhe impus
  rationale: אָלָה pode designar um juramento acompanhado de maldição ou sanção. A formulação escolhida comunica naturalmente que Abraão vinculou o servo por esse juramento, sem dar a entender que se trata apenas de um juramento feito pelo próprio Abraão.
- source_word: כִּי
  choice: quando
  rationale: Aqui a partícula introduz a circunstância temporal em que a obrigação poderá cessar; “quando” preserva bem esse valor no contexto.
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: chegar à minha família
  rationale: מִשְׁפָּחָה se refere à família extensa ou ao clã. “Família” é claro e natural em português moderno; “chegar” expressa idiomaticamente o movimento até essas pessoas.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: e, se eles não a entregarem a você
  rationale: 'O objeto feminino está implícito no hebraico e é recuperado do contexto: a mulher que seria esposa de Isaque. “Entregarem” comunica de modo natural o consentimento familiar para o casamento, sem transformar a frase em linguagem de propriedade.'
theological_decisions:
- issue: Sentido de אָלָה no contexto do juramento
  choice: juramento
  alternative: maldição
  rationale: A narrativa enfatiza a obrigação juramentada imposta ao servo. Contudo, como אָלָה também pode incluir a maldição ou sanção associada ao juramento, essa nuance legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “você” para ampla legibilidade brasileira. A repetição final foi preservada por corresponder à estrutura enfática do hebraico. O objeto feminino implícito foi expresso pelo pronome “a” para clareza em português.
