  rationale: A revisão mantém “ficará livre”, “quando” e “família”, que representam bem o hebraico em português moderno. Substitui as expansões interpretativas por “meu juramento” e pela elipse “não lhe derem”, preservando tanto a posse expressa no hebraico quanto a ausência formal do objeto direto. A nota foi ajustada para refletir a mesma construção possessiva.
