  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: pt
  text: mas você irá à minha terra e aos meus parentes[a] e tomará uma esposa para meu filho Isaque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao meu lugar de origem”. O termo hebraico pode referir-se tanto ao lugar de origem como ao grupo de parentesco; aqui, o contexto favorece o parentesco.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para meu filho, para Isaque”.'
    reason: source_form
lexical_decisions:
- source_word: כִּי
  choice: mas
  rationale: No contexto, a partícula introduz contraste com a proibição do versículo anterior; “mas” expressa naturalmente essa força adversativa.
- source_word: אֶל אַרְצִי
  choice: à minha terra
  rationale: Preserva o sentido geográfico de אֶרֶץ sem sugerir um Estado-nação moderno.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: e aos meus parentes
  rationale: מוֹלֶדֶת pode indicar o grupo de parentesco ou o lugar de origem. Como o propósito é obter uma esposa dentre o povo de Abraão, “meus parentes” é a formulação mais clara, sem eliminar a alternativa lexical.
- source_word: תֵּלֵךְ
  choice: você irá
  rationale: O imperfeito tem aqui força diretiva; no contexto do juramento, o futuro em português comunica uma obrigação solene de modo natural.
- source_word: וְלָקַחְתָּ
  choice: e tomará
  rationale: Traduz diretamente לקח e mantém a força diretiva; o objeto deixa claro que se trata de conseguir uma esposa.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: Embora אִשָּׁה também possa significar “esposa”, com “para meu filho” o português comunica naturalmente que ela será tomada como esposa, evitando a construção pouco idiomática “tomar uma esposa para”.
- source_word: לִבְנִי לְיִצְחָק
  choice: para meu filho Isaque
  rationale: Expressa de modo idiomático a relação de benefício e a aposição, enquanto a nota preserva a repetição das preposições no hebraico.
