  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: pt
  text: Rebeca tinha um irmão, cujo nome era Labão. Labão correu para fora, até o homem, junto à fonte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְרִבְקָה אָח
  choice: Rebeca tinha um irmão
  rationale: A construção hebraica com לְ expressa posse ou existência; em português corrente, “tinha um irmão” comunica naturalmente esse sentido.
- source_word: וּשְׁמוֹ לָבָן
  choice: cujo nome era Labão
  rationale: Reproduz a fórmula hebraica de nomeação com fluidez e dignidade em português.
- source_word: וַיָּרָץ ... הַחוּצָה
  choice: correu para fora
  rationale: Mantém tanto o sentido básico de רוץ, “correr”, quanto a direção para o exterior indicada por הַחוּצָה.
- source_word: אֶל־הָאִישׁ
  choice: até o homem
  rationale: Preserva o substantivo genérico usado no hebraico e expressa o movimento em direção a ele, sem identificá-lo explicitamente como o servo de Abraão.
- source_word: אֶל־הָעָיִן
  choice: junto à fonte
  rationale: עַיִן designa propriamente uma nascente ou fonte, não um poço. A formulação locativa comunica de modo natural que o encontro ocorreu nesse ponto, embora o hebraico use literalmente uma segunda expressão direcional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do nome “Labão” foi mantida entre as frases para acompanhar o foco narrativo do hebraico. A pontuação conserva certa abertura quanto à ligação de “junto à fonte”, sem introduzir identificação ou explicação ausente do texto.
