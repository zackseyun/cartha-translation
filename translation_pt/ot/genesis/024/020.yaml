base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: pt
  text: Ela se apressou, despejou a água do seu cântaro no bebedouro[a] e correu novamente ao poço para tirar água; e tirou água para todos os camelos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «esvaziou seu cântaro no cocho».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Ela se apressou
  rationale: O verbo expressa ação rápida e diligente; a forma verbal é natural em português e preserva a progressão narrativa.
- source_word: וַתְּעַר כַּדָּהּ
  choice: despejou a água do seu cântaro
  rationale: ערה indica esvaziar ou despejar. Explicitar «a água» torna a ação idiomática em português sem acrescentar conteúdo estranho ao contexto.
- source_word: כַּדָּהּ
  choice: seu cântaro
  rationale: כַּד designa um recipiente usado para buscar e transportar água; «cântaro» é claro, digno e adequado ao cenário.
- source_word: הַשֹּׁקֶת
  choice: o bebedouro
  rationale: O substantivo indica um recipiente ou cocho com água para animais. «Bebedouro» comunica naturalmente sua função no contexto dos camelos.
- source_word: וַתָּרָץ עוֹד
  choice: correu novamente
  rationale: עוֹד acrescenta repetição ou continuação à ação de correr; «novamente» preserva esse valor.
- source_word: הַבְּאֵר
  choice: o poço
  rationale: בְּאֵר denota normalmente um poço, que é o sentido esperado nesta narrativa.
- source_word: לִשְׁאֹב
  choice: para tirar água
  rationale: O infinitivo significa retirar ou puxar água de um poço; «tirar água» é corrente e explícito em português.
- source_word: וַתִּשְׁאַב
  choice: tirou água
  rationale: A repetição do verbo mantém a sequência do hebraico; o contexto e a expressão «todos os camelos» sugerem a ação reiterada.
- source_word: לְכָל גְּמַלָּיו
  choice: para todos os camelos dele
  rationale: Preserva a totalidade de כָּל e torna explícito, sem ambiguidade estilística indevida, que o possuidor é o homem mencionado no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. «Cântaro» conserva a ambientação antiga sem ser obscuro; «bebedouro» é funcional e acessível. O ponto e vírgula ajuda a marcar a passagem da ida ao poço para a ação de tirar água para todos os camelos.
