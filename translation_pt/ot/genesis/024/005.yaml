  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: pt
  text: 'E o servo lhe disse: “Talvez a mulher não queira me seguir[a] até esta terra. Devo então levar seu filho de volta[b] à terra de onde o senhor saiu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ir atrás de mim”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico reforça o verbo “levar de volta” por meio da repetição de sua raiz verbal; também se pode traduzir: “Será que devo mesmo levar seu filho de volta?”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, “servo” expressa com naturalidade a posição subordinada do homem na casa de Abraão sem tornar sua condição jurídica mais específica do que o versículo exige.
- source_word: אוּלַי
  choice: Talvez
  rationale: Introduz uma possibilidade incerta e mantém um registro narrativo digno e corrente.
- source_word: לֹא תֹאבֶה
  choice: não queira
  rationale: אָבָה expressa disposição ou consentimento. “Não queira” transmite de modo natural a possível falta de disposição da mulher.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: O hebraico diz simplesmente “a mulher”; não se acrescenta aqui “jovem” nem “futura esposa”.
- source_word: לָלֶכֶת אַחֲרַי
  choice: me seguir
  rationale: A expressão significa literalmente “ir atrás de mim”. “Me seguir” é natural em português e conserva a relação direcional.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: até esta terra
  rationale: אֶרֶץ é adequadamente traduzido por “terra”; “até” comunica com clareza o destino do percurso.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Devo então levar ... de volta
  rationale: A construção com infinitivo absoluto e verbo finito dá ênfase ao ato de fazer retornar. No contexto interrogativo e deliberativo, “Devo então levar ... de volta” preserva a pergunta sem transformá-la em obrigação já estabelecida.
- source_word: אֶת בִּנְךָ
  choice: seu filho
  rationale: Correspondência direta e inequívoca.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: à terra de onde o senhor saiu
  rationale: Mantém a imagem verbal de יָצָא, “sair”, e torna explícito, pelo tratamento respeitoso em minúscula, que o servo se dirige a Abraão.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega-se “o senhor” em minúscula como tratamento respeitoso dirigido a Abraão. A formulação conserva o caráter deliberativo da pergunta e a ênfase hebraica sem exagerar a ideia de necessidade.
