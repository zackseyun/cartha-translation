base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: pt
  text: Quando os camelos acabaram de beber, o homem pegou uma argola de ouro[a], que pesava um beca[b], e duas pulseiras para os pulsos dela, que pesavam dez siclos de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “uma argola de ouro para o nariz”; o termo hebraico pode designar uma argola usada no nariz ou na orelha.
    reason: lexical_alternative
  - marker: b
    text: O beca era uma unidade de peso equivalente a meio siclo.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Quando os camelos acabaram de beber
  rationale: A construção temporal introduz a ação seguinte depois de concluída a bebida dos camelos. A formulação é natural em português e preserva a sequência narrativa.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O hebraico diz literalmente “o homem”. Embora o contexto o identifique como servo de Abraão, o versículo não emprega aqui o termo “servo”.
- source_word: נֶזֶם זָהָב
  choice: uma argola de ouro
  rationale: נֶזֶם pode designar uma joia em forma de argola usada no nariz ou na orelha. “Argola” conserva essa amplitude lexical; a possível localização é explicada em nota.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: que pesava um beca
  rationale: בֶּקַע é uma antiga unidade de peso. Mantê-la transliterada preserva a medida do texto, enquanto a equivalência é dada em nota.
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: e duas pulseiras para os pulsos dela
  rationale: O hebraico menciona explicitamente duas pulseiras e diz, de modo idiomático, “sobre/para as mãos dela”. Em português atual, “para os pulsos” comunica naturalmente onde essas joias seriam usadas.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: que pesavam dez siclos de ouro
  rationale: O hebraico informa o peso conjunto das pulseiras; “siclos” é a unidade subentendida e precisa ser explicitada para que a expressão seja compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A ordem narrativa e a designação genérica “o homem” foram preservadas; unidades e costumes antigos receberam notas concisas.
