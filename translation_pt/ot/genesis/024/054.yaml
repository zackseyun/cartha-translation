  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: pt
  text: 'Então ele e os homens que estavam com ele comeram e beberam, e passaram a noite ali. Quando se levantaram pela manhã, ele disse: “Enviem-me de volta ao meu senhor.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao meu amo”. O termo hebraico אָדוֹן pode designar um senhor ou amo humano; aqui se refere a Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: comeram e beberam
  rationale: Preserva a sequência verbal simples e concisa da narrativa hebraica.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: ele e os homens que estavam com ele
  rationale: Mantém o pronome explícito e identifica naturalmente todo o grupo em português.
- source_word: וַיָּלִינוּ
  choice: passaram a noite ali
  rationale: Expressa de modo corrente o sentido de permanecer durante a noite; “ali” explicita naturalmente o local implícito no contexto.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: quando se levantaram pela manhã
  rationale: Reproduz a ação narrativa seguinte com fluência e tom digno.
- source_word: שַׁלְּחֻנִי
  choice: Deixem-me partir
  rationale: No contexto, o imperativo pede autorização para partir, e esta formulação é mais idiomática em português do que uma tradução mecânica como “enviem-me”.
- source_word: לַאדֹנִי
  choice: para o meu senhor
  rationale: “Senhor” preserva a amplitude lexical de אָדוֹן como forma de referência a um superior humano; o contexto identifica Abraão.
theological_decisions:
- issue: Tradução de אָדוֹן com referência a Abraão
  choice: meu senhor
  alternative: meu amo
  rationale: “Meu senhor” conserva a deferência social do hebraico sem transformar o termo em título divino; “meu amo” explicita mais diretamente a relação servo-amo, mas é menos amplo e menos natural neste discurso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha a progressão narrativa hebraica sem rigidez, e a fala do servo soa natural no contexto de um pedido de partida.
