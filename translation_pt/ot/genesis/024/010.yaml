base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: pt
  text: Então o servo tomou dez dos camelos de seu senhor e partiu, levando consigo toda espécie de bens valiosos de seu senhor. Levantou-se e foi para Arã-Naaraim,[a] para a cidade de Naor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Arã-Naaraim”; tradicionalmente, “Mesopotâmia” ou “Arã dos Dois Rios”. A expressão anterior, literalmente “e todo bem de seu senhor em sua mão”, pode indicar posse, controle ou responsabilidade e provavelmente se refere aos bens valiosos que ele levava como presentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto doméstico, “servo” é natural e não especifica além do que o relato exige a condição jurídica do homem.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: dez dos camelos de seu senhor
  rationale: 'A construção com מִן é partitiva: ele selecionou dez dentre os camelos pertencentes a seu senhor. A formulação evita a repetição pouco natural de “camelos” em português.'
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: No contexto de uma casa patriarcal, “senhor” expressa a relação de autoridade indicada por אָדוֹן sem sugerir aqui um título divino.
- source_word: וַיֵּלֶךְ
  choice: partiu
  rationale: O verbo הלך significa basicamente ir; neste contexto de viagem, “partiu” comunica naturalmente o início do deslocamento, sem eliminar a sequência verbal posterior.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: todos os bens de seu senhor estavam em suas mãos
  rationale: טוּב refere-se aqui ao que é bom ou valioso, provavelmente bens destinados à missão. A expressão בְּיָדוֹ pode indicar tanto posse quanto controle; “em suas mãos” conserva a imagem e a amplitude do idioma hebraico.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Ele se levantou e foi
  rationale: A tradução mantém os dois verbos e o ritmo sequencial do hebraico, embora haja repetição da ideia de partida no versículo.
- source_word: אֲרַם נַהֲרַיִם
  choice: Arã-Naaraim
  rationale: O topônimo é transliterado em vez de ser substituído pela identificação tradicional “Mesopotâmia”; a nota informa as formas interpretativas conhecidas.
- source_word: עִיר נָחוֹר
  choice: a cidade de Naor
  rationale: A cadeia construta indica a cidade associada a Naor, sem precisar se ele a fundou, possuía ou apenas lhe deu nome.
theological_decisions: []
translation_notes:
  register: 'Português atual, digno e de leitura ampla, com formas reconhecíveis no Brasil. A repetição “partiu... levantou-se e foi” foi mantida por corresponder à sequência verbal do texto massorético. Os topônimos seguem transliteração portuguesa: Arã-Naaraim e Naor.'
