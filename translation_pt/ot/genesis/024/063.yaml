base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: pt
  text: 'Isaque saiu para meditar no campo ao entardecer.[a] Ergueu os olhos e viu: eis que camelos se aproximavam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para caminhar”, “para refletir”, “para conversar” ou, possivelmente, “para orar” no campo. O verbo hebraico é raro, e seu sentido exato aqui é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O qal narrativo de יצא indica movimento para fora; “saiu” é direto e natural em português.
- source_word: יִצְחָק
  choice: Isaque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לָשׂוּחַ
  choice: para meditar
  rationale: O verbo שׂוח é raro e seu sentido exato neste contexto é discutido. “Meditar” expressa uma atividade reflexiva sem especificar indevidamente que se tratava de oração; a incerteza lexical é preservada em nota.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שׂדה designa campo ou região aberta; “no campo” é conciso e idiomático.
- source_word: לִפְנוֹת עָרֶב
  choice: ao cair da tarde
  rationale: A expressão indica a aproximação da noite. “Ao cair da tarde” é uma formulação portuguesa natural e digna para esse momento do dia.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: levantou os olhos e viu
  rationale: Preserva a imagem do idioma hebraico e a sequência dos dois verbos, em formulação clara e corrente.
- source_word: וְהִנֵּה
  choice: viu que
  rationale: Neste contexto, a construção portuguesa “viu que” comunica a descoberta repentina marcada por הִנֵּה sem recorrer ao arcaizante “eis”.
- source_word: גְמַלִּים בָּאִים
  choice: vinham chegando camelos
  rationale: O particípio indica aproximação em curso; “vinham chegando” torna perceptível o movimento dos camelos no momento em que Isaque os avista.
