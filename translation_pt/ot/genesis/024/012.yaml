base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: pt
  text: 'E ele disse: “Ó Yahweh, Deus do meu senhor Abraão, faz, por favor, que isso aconteça diante de mim hoje[a] e demonstra amor leal[b] para com meu senhor Abraão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz que ocorra diante de mim hoje”. O verbo hebraico pede que Deus faça ocorrer providencialmente a situação desejada.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico ḥésed também pode transmitir as ideias de bondade leal e fidelidade constante.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino, preservando o nome pessoal presente no texto hebraico.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Deus do meu senhor Abraão
  rationale: Mantém a cadeia construta e a relação do servo com Abraão; “senhor”, em minúscula, indica seu amo humano.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: concede-me, por favor, êxito hoje
  rationale: Expressa de modo natural em português a petição causativa para que Deus faça ocorrer uma circunstância favorável naquele dia. A nota preserva a formulação mais literal e sua abertura semântica.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: e demonstra amor leal
  rationale: “Amor leal” comunica a bondade firme e relacional de חֶסֶד sem reduzir o termo a mera gentileza nem impor uma especificação teológica excessiva.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: para com meu senhor Abraão
  rationale: “Para com” é idiomático com “demonstrar amor leal” e conserva a relação expressa por עִם.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O hebraico emprega explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Amplitude semântica de חֶסֶד
  choice: amor leal
  alternative: bondade; fidelidade à aliança
  rationale: A escolha mantém as dimensões de amor, lealdade e constância, sem restringir o termo no texto principal a uma única formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Concede-me êxito” mantém o tom de oração sem soar coloquial; “meu senhor” distingue o amo humano do nome divino.
