base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: pt
  text: '“Eis que estou de pé junto à fonte de água. Que a jovem[a] que sair para tirar água e a quem eu disser: ‘Por favor, dê-me de beber um pouco de água do seu cântaro’[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “moça”. O hebraico עַלְמָה refere-se a uma mulher jovem em idade de casar e, por si só, não significa explicitamente “virgem”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Por favor, deixe-me beber um pouco de água do seu cântaro”.'
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי
  choice: Eis que estou
  rationale: “Eis que” introduz a cena com vivacidade e dignidade, enquanto a forma verbal portuguesa já expressa naturalmente o pronome explícito אָנֹכִי.
- source_word: נִצָּב
  choice: estou
  rationale: O particípio indica uma posição presente e contínua; em português, “estou junto à fonte” comunica isso naturalmente sem a formulação mais pesada “estou de pé”.
- source_word: עַל עֵין הַמָּיִם
  choice: junto à fonte de água
  rationale: עֵין designa uma nascente ou fonte natural, não necessariamente um poço. “Junto à” expressa adequadamente a localização.
- source_word: וְהָיָה
  choice: Que
  rationale: Neste contexto de oração e sinal solicitado, introduz de modo natural a situação desejada, preservando a nuance volitiva.
- source_word: הָעַלְמָה
  choice: a jovem
  rationale: O termo designa uma mulher jovem, em idade de casar, sem afirmar por si só a virgindade.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: que sair para tirar água
  rationale: A construção prospectiva descreve a jovem que vier à fonte com a finalidade de retirar água; explicitar “água” evita ambiguidade em português.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: e a quem eu disser
  rationale: A oração relativa produz sintaxe portuguesa fluente e mantém a sequência da situação imaginada.
- source_word: הַשְׁקִינִי נָא
  choice: Por favor, dê-me de beber
  rationale: O causativo de שׁקה significa dar de beber; a expressão portuguesa é idiomática e mantém נָא como fórmula cortês.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: um pouco de água do seu cântaro
  rationale: “Cântaro” representa uma vasilha usada para buscar e servir água, enquanto “um pouco de água” reproduz diretamente a quantidade solicitada.
theological_decisions:
- issue: Sentido de עַלְמָה
  choice: jovem
  alternative: moça; virgem
  rationale: O hebraico indica uma mulher jovem em idade de casar, mas não exige lexicalmente o sentido específico de “virgem”. A tradução evita introduzir no relato uma afirmação mais forte que o termo, registrando a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva a apresentação vívida do hebraico; “cântaro” mantém o cenário antigo sem soar excessivamente técnico. A frase permanece aberta ao versículo seguinte, como no texto-fonte.
