  terminology: “Labão”, “Betuel”, “Yahweh” e “assunto” são escolhas adequadas. A conservação de “mal nem bem” respeita a ambiguidade e a ordem conceitual do hebraico, enquanto a nota oferece a implicação contextual como esclarecimento, não como tradução doutrinariamente fechada.
