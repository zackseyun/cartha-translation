  text: וַ/יַּ֨עַן לָבָ֤ן וּ/בְתוּאֵל֙ וַ/יֹּ֣אמְר֔וּ מֵ/יְהוָ֖ה יָצָ֣א הַ/דָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖י/ךָ רַ֥ע אוֹ טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: pt
  text: 'Então Labão e Betuel responderam: “Este assunto vem de Yahweh; não podemos dizer a você nem mal nem bem[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “falar a você mal ou bem”. A expressão indica que eles não podiam se opor ao assunto nem alterá-lo.
    reason: esclarecimento de idioma hebraico
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: responderam
  rationale: A fórmula hebraica combina literalmente ‘responder’ e ‘dizer’. Em português atual, ‘responderam’ comunica naturalmente a introdução da fala sem a redundância pouco idiomática de ‘responderam e disseram’.
- source_word: מֵיְהוָה
  choice: vem de Yahweh
  rationale: A preposição מִן indica origem, e o nome divino יְהוָה é transliterado como ‘Yahweh’.
- source_word: יָצָא הַדָּבָר
  choice: Este assunto vem
  rationale: דָּבָר designa aqui o assunto em negociação, e יָצָא, com a expressão de origem, indica que ele procede de Yahweh. ‘Vem’ mantém essa ideia em português natural.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: não podemos dizer a você
  rationale: יכל expressa capacidade ou possibilidade, enquanto דַּבֵּר אֵלֶיךָ indica fala dirigida ao servo. ‘Dizer a você’ é idiomático em português neste contexto.
- source_word: רַע אוֹ טוֹב
  choice: nem mal nem bem
  rationale: Mantém a ordem e a polaridade da expressão hebraica, sem substituir no texto sua ambiguidade idiomática por uma interpretação única.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; ‘Yahweh’ preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido da expressão ‘mal ou bem’
  choice: Manter a polaridade idiomática no texto
  alternative: ‘não podemos nos opor nem mudar isso’
  rationale: A expressão provavelmente indica que Labão e Betuel não podem contestar ou modificar o que procede de Yahweh, mas a tradução mantém a forma e a tensão do hebraico, esclarecendo o provável sentido em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula narrativa hebraica foi tornada natural em português, enquanto a expressão polar ‘mal nem bem’ foi preservada e explicada em nota.
