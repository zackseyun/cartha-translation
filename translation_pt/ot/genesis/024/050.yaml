  source_fidelity: 'O texto preserva adequadamente os elementos essenciais do hebraico: Labão e Betuel respondem; o assunto procede de Yahweh; e eles declaram não poder dizer “mal nem bem” ao interlocutor. “Este assunto vem de Yahweh” comunica de modo natural a origem expressa por מֵיְהוָה יָצָא הַדָּבָר. A omissão de “e disseram” evita redundância pouco natural em português sem perda semântica relevante.'
