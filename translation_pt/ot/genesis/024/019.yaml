base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: pt
  text: 'Quando terminou de lhe dar de beber, ela disse: “Também vou tirar água para os seus camelos, até que acabem de beber.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Quando terminou de lhe dar de beber
  rationale: A forma de כלה seguida do infinitivo marca a conclusão da ação anterior; a construção portuguesa expressa naturalmente essa sequência. O hifil de שקה com sufixo masculino singular significa dar de beber a ele.
- source_word: וַתֹּאמֶר
  choice: ela disse
  rationale: Tradução corrente do verbo אמר; a sequência narrativa permanece clara sem reproduzir mecanicamente o waw por “e”.
- source_word: גַּם
  choice: Também
  rationale: 'Preserva a força aditiva: além de dar de beber ao homem, ela se oferece para atender aos camelos.'
- source_word: לִגְמַלֶּיךָ
  choice: para os seus camelos
  rationale: A preposição indica os beneficiários, e o sufixo de segunda pessoa masculina singular é preservado pelo possessivo “seus”.
- source_word: אֶשְׁאָב
  choice: vou tirar água
  rationale: שאב denota tirar água de uma fonte ou poço. “Vou tirar água” é natural em português e torna explícito o objeto implícito no hebraico.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: até que acabem de beber
  rationale: עַד אִם introduz aqui o limite da ação, e כלה com o infinitivo significa terminar ou acabar de beber. O subjuntivo é idiomático em português após “até que” para um evento futuro.
