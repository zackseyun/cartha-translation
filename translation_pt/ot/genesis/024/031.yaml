  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: pt
  text: 'E ele disse: “Entre, abençoado por Yahweh.[a] Por que você está parado do lado de fora? Eu preparei a casa e um lugar para os camelos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bendito de Yahweh” ou “ó abençoado de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o avanço narrativo do wayyiqtol de forma natural em português.
- source_word: בּוֹא
  choice: Entre
  rationale: O imperativo de בוא, neste contexto de hospitalidade, convida o visitante a entrar.
- source_word: בְּרוּךְ יְהוָה
  choice: abençoado por Yahweh
  rationale: O particípio passivo funciona como forma de tratamento; esta tradução preserva a possibilidade de entender Yahweh como agente da bênção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Por que você está aí fora?
  rationale: Expressa naturalmente em português a pergunta sobre permanecer do lado de fora; “aí” reforça a localização sem alterar o sentido.
- source_word: וְאָנֹכִי פִּנִּיתִי הַבַּיִת
  choice: Eu já preparei a casa
  rationale: פנה no piel indica desocupar ou abrir espaço; “preparei” comunica o resultado no contexto da hospitalidade, e “já” torna perceptível o contraste enfático do pronome explícito.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: e um lugar para os camelos
  rationale: Tradução direta que não especifica além do hebraico como o espaço seria usado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Relação expressa por בְּרוּךְ יְהוָה
  choice: abençoado por Yahweh
  alternative: bendito de Yahweh; ó abençoado de Yahweh
  rationale: A construção é uma forma de tratamento e pode indicar que a pessoa é abençoada por Yahweh ou pertence à esfera de sua bênção. O texto principal usa a formulação portuguesa mais natural, enquanto a nota preserva a alternativa formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto mantém a hospitalidade enfática da cena; “você” é adequado ao singular do hebraico e evita solenidade artificial.
