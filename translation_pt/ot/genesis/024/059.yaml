  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: pt
  text: Então enviaram Rebeca, irmã deles, a ama de Rebeca[a], o servo de Abraão e os homens dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais especificamente, “ama de leite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: deixaram partir
  rationale: O piel de שׁלח indica aqui que fizeram Rebeca e os demais partir. “Deixaram partir” expressa naturalmente tanto a autorização quanto o envio para a viagem, sem sugerir uma dispensa hostil.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲחֹתָם
  choice: sua irmã
  rationale: אָחוֹת significa literalmente “irmã”, e o contexto familiar imediato sustenta esse sentido direto.
- source_word: מֵנִקְתָּהּ
  choice: a ama dela
  rationale: O termo designa a mulher que havia amamentado Rebeca. “Ama” é uma forma natural no corpo do texto; a acepção mais específica é explicitada em nota.
- source_word: עֶבֶד אַבְרָהָם
  choice: o servo de Abraão
  rationale: A construção hebraica indica pertencimento ou vínculo. “Servo” preserva o papel narrativo sem definir além do necessário sua condição jurídica.
- source_word: אֲנָשָׁיו
  choice: os homens que o acompanhavam
  rationale: O sufixo remete ao servo de Abraão. Esta formulação reproduz naturalmente a referência e evita a ambiguidade que “seus homens” poderia criar em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição hebraica de וְאֶת foi condensada numa enumeração natural, sem omitir nenhum participante. O marcador da nota foi colocado junto de “ama”, termo ao qual a alternativa lexical se refere.
