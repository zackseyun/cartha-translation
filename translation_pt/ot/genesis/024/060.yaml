  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: pt
  text: 'E abençoaram Rebeca e lhe disseram: “Nossa irmã, que você se torne milhares de miríades[a], e que a sua descendência tome posse da porta dos que a odeiam[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milhares de dezenas de milhares” ou “multidões incontáveis”. A expressão hebraica combina “milhares” com “dezena de milhares”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a porta dos seus inimigos”. No hebraico, literalmente, “a porta dos que o odeiam”, com pronome singular referente ao substantivo coletivo “descendência”. A porta representa a força e o controle de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: abençoaram
  rationale: Traduz diretamente o piel de ברך, que neste contexto indica pronunciar uma bênção sobre Rebeca.
- source_word: רִבְקָה
  choice: Rebeca
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲחֹתֵנוּ
  choice: Nossa irmã
  rationale: Preserva de modo natural o vocativo familiar do hebraico.
- source_word: הֲיִי
  choice: que você se torne
  rationale: Expressa o valor de desejo próprio da fórmula de bênção, sem transformar as palavras em uma ordem direta.
- source_word: לְאַלְפֵי רְבָבָה
  choice: milhares de miríades
  rationale: Mantém a combinação numérica hiperbólica do hebraico. “Miríades” conserva a ideia de dezenas de milhares e, no uso corrente, de uma multidão incontável.
- source_word: וְיִירַשׁ
  choice: tome posse
  rationale: Neste contexto de domínio sobre a porta adversária, ירש indica adquirir ou exercer posse, mais do que receber passivamente uma herança.
- source_word: זַרְעֵךְ
  choice: a sua descendência
  rationale: Conserva o caráter coletivo singular de זֶרַע em português natural, evitando tanto o arcaísmo de “semente” quanto uma pluralização desnecessária.
- source_word: שַׁעַר
  choice: a porta
  rationale: Preserva a imagem concreta da entrada fortificada da cidade, que por extensão representa sua força e seu controle.
- source_word: שֹׂנְאָיו
  choice: dos que a odeiam
  rationale: Traduz transparentemente o particípio “os que odeiam”. O pronome feminino concorda em português com “descendência”, enquanto o hebraico emprega o masculino singular por concordância com זֶרַע.
theological_decisions:
- issue: Linguagem coletiva singular referente à descendência
  choice: a sua descendência ... dos que a odeiam
  alternative: os seus descendentes ... dos que os odeiam
  rationale: O hebraico usa זֶרַע como substantivo coletivo singular e retoma esse referente com sufixo singular. “Descendência” preserva essa estrutura e a ressonância da linguagem das promessas patriarcais sem restringi-la a um único descendente nem convertê-la silenciosamente em plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva o paralelismo e a hipérbole solene da bênção, bem como a imagem antiga da porta da cidade. Os marcadores de nota foram colocados junto às expressões que explicam.
