revisions:
- from: E aconteceu que, antes de ele terminar de falar, eis que Rebeca vinha saindo. Ela havia nascido a Betuel, filho de Milca, mulher de Naor, irmão de Abraão, e trazia o cântaro sobre o ombro.
  to: E aconteceu que, antes que ele terminasse de falar, eis que Rebeca vinha saindo, ela que nascera de Betuel, filho de Milca, esposa de Naor, irmão de Abraão, com o seu cântaro sobre o ombro.
  rationale: A revisão substitui uma construção de filiação pouco natural por «nascera de Betuel» e reintegra a identificação genealógica e o cântaro à apresentação de Rebeca, tal como no hebraico. Não há necessidade de nota, pois não se introduz nem se resolve nenhuma ambiguidade textual disputada.
