  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: pt
  text: E aconteceu que, antes que ele terminasse de falar, eis que Rebeca vinha saindo, ela que nascera de Betuel, filho de Milca, esposa de Naor, irmão de Abraão, com o seu cântaro sobre o ombro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica de modo atual e digno, sem recorrer ao arcaísmo «e sucedeu».
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: antes de ele terminar de falar
  rationale: טֶרֶם indica anterioridade, e כִּלָּה com infinitivo expressa a conclusão da ação.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar a atenção para o aparecimento imediato e significativo de Rebeca.
- source_word: יֹצֵאת
  choice: vinha saindo
  rationale: O particípio feminino apresenta a ação em andamento no momento narrado; «vinha saindo» comunica essa progressão naturalmente em português.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: Ela havia nascido a Betuel
  rationale: Mantém o sentido passivo e genealógico da forma de ילד e situa o nascimento antes da cena narrada.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: filho de Milca, mulher de Naor, irmão de Abraão
  rationale: 'Preserva integralmente a sequência genealógica e as aposições do hebraico: Betuel é filho de Milca; Milca é mulher de Naor; Naor é irmão de Abraão.'
- source_word: כַּד
  choice: cântaro
  rationale: Designa de forma clara e tradicional, ainda compreensível, o recipiente usado para buscar e transportar água, sem acrescentar «água», que está apenas implícita no contexto.
- source_word: עַל שִׁכְמָהּ
  choice: sobre o ombro
  rationale: Tradução direta da expressão locativa, preservando a imagem concreta do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eis que» preserva deliberadamente a vivacidade discursiva do hebraico; a genealogia foi mantida sem simplificação, e o versículo foi dividido em duas frases para evitar uma construção excessivamente pesada.
