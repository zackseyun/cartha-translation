  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: pt
  text: 'Então disseram: “Vamos chamar a jovem e perguntar a ela mesma[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “perguntar à boca dela”, isto é, ouvir diretamente sua própria resposta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então disseram
  rationale: O wayyiqtol dá continuidade à narrativa; “Então disseram” expressa naturalmente a resposta subsequente no contexto.
- source_word: נִקְרָא
  choice: Vamos chamar
  rationale: A forma volitiva plural propõe uma ação conjunta. “Vamos chamar” é corrente e preserva essa força.
- source_word: לַנַּעֲרָ
  choice: a jovem
  rationale: נַעֲרָה designa aqui Rebeca como mulher jovem em idade de casar; “a jovem” é natural, digna e não sugere necessariamente uma criança.
- source_word: וְנִשְׁאֲלָה
  choice: e perguntar
  rationale: A segunda forma volitiva continua a proposta; o complemento pessoal fica claro em português com “perguntar a ela”.
- source_word: אֶת־פִּיהָ
  choice: a ela mesma
  rationale: Literalmente, “a boca dela”; o idioma enfatiza obter diretamente da própria Rebeca sua resposta. “A ela mesma” conserva essa ênfase sem reproduzir uma expressão obscura em português.
