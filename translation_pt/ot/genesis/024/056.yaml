  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Não me façam demorar, pois Yahweh fez prosperar o meu caminho[a]. Deixem-me partir, para que eu vá ao meu senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “meu caminho”; neste contexto, a expressão pode se referir à viagem ou à missão do servo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Mas ele lhes disse
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “mas” expressa naturalmente o contraste com a proposta anterior da família. אֲלֵהֶם é representado pelo pronome indireto “lhes”.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Não me façam demorar
  rationale: A construção proibitiva com אַל e o Hifil de אחר pede que não causem atraso ao servo. A formulação é clara e idiomática em português, sem ampliar o sentido para um impedimento absoluto.
- source_word: וַיהוָה
  choice: pois Yahweh
  rationale: A conjunção introduz a razão do pedido, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio do texto hebraico.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: fez prosperar o meu caminho
  rationale: O Hifil de צלח conserva a causação divina; דֶּרֶךְ significa literalmente “caminho” e, no contexto, abrange a viagem e a missão do servo.
- source_word: שַׁלְּחוּנִי
  choice: Deixem-me partir
  rationale: O imperativo Piel de שלח com sufixo de primeira pessoa solicita que a família o libere para partir. A expressão comunica esse sentido com naturalidade em português.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: para que eu vá ao meu senhor
  rationale: O coortativo expressa a ação pretendida após sua liberação. אֲדֹנִי refere-se ao superior humano do servo, Abraão, por isso “meu senhor” aparece em minúscula.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio e evita substituí-lo por um título, sem confundi-lo com o “senhor” humano mencionado no fim do versículo.
- issue: Agente do êxito da missão
  choice: Yahweh fez prosperar o meu caminho
  alternative: meu caminho prosperou
  rationale: A forma Hifil הִצְלִיחַ atribui explicitamente a Yahweh a causação do êxito; a tradução preserva essa afirmação sem desenvolver suas implicações teológicas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Não me façam demorar” evita uma formulação excessivamente literal; “meu caminho” mantém a imagem hebraica e a nota esclarece sua extensão contextual.
