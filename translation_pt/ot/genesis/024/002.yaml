base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: pt
  text: 'Abraão disse ao seu servo, o mais velho de sua casa, que governava tudo o que pertencia a Abraão[b]: “Por favor, ponha a mão debaixo da minha coxa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pôr a mão debaixo da coxa era um antigo gesto associado a um juramento, provavelmente indicando um compromisso solene.
    reason: cultural_note
  - marker: b
    text: 'Ou, de maneira mais idiomática: “que estava encarregado de tudo o que Abraão possuía”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O perfeito consecutivo dá continuidade à narrativa; em português, o pretérito perfeito expressa naturalmente a ação, sem necessidade de reproduzir mecanicamente o וַ inicial.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, a ênfase recai sobre um oficial doméstico de confiança; “servo” preserva a amplitude do termo sem definir além do texto sua condição jurídica.
- source_word: זְקַן בֵּיתוֹ
  choice: o mais velho de sua casa
  rationale: A expressão identifica o servo por sua idade ou senioridade dentro da casa. A tradução mantém essa possível dupla nuance sem acrescentar um cargo específico.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: que governava tudo o que lhe pertencia
  rationale: “Governava” conserva a força de מֹשֵׁל, exercer domínio ou autoridade, enquanto “tudo o que lhe pertencia” comunica naturalmente a construção possessiva hebraica.
- source_word: שִׂים נָא
  choice: Por favor, ponha
  rationale: O imperativo com נָא exprime um pedido cortês ou insistente. “Por favor, ponha” reproduz esse tom em português corrente e digno.
- source_word: יָדְךָ
  choice: a mão
  rationale: O possessivo hebraico é naturalmente recuperado pelo contexto e pela forma verbal dirigida ao servo; em português, “ponha a mão” evita uma possessividade desnecessariamente marcada.
- source_word: תַּחַת יְרֵכִי
  choice: debaixo da minha coxa
  rationale: Tradução direta da expressão corporal ligada a um gesto cultural específico. A explicação do gesto fica na nota, sem substituir o hebraico por uma interpretação.
