base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: pt
  text: Isaque a levou para a tenda de Sara, sua mãe,[a] tomou Rebeca, e ela se tornou sua mulher. Ele a amou. Assim, Isaque foi consolado depois da morte de sua mãe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a tenda de sua mãe Sara”. A ordem das palavras em hebraico permite as duas formulações, com o mesmo sentido básico.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “depois de sua mãe”. Pelo contexto, o sentido é depois da perda ou morte de sua mãe, embora a palavra “morte” não apareça nesta frase hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: a levou
  rationale: O hifil de בוא com sufixo feminino singular expressa fazer com que ela entre ou venha; “a levou” comunica de modo natural a ação de Isaque, enquanto a expressão seguinte indica o destino.
- source_word: הָאֹהֱלָה
  choice: para a tenda
  rationale: O hê direcional indica movimento em direção à tenda e, no contexto, entrada nela. Em português, “levou para a tenda” expressa naturalmente esse movimento.
- source_word: שָׂרָה אִמּוֹ
  choice: de Sara, sua mãe
  rationale: A construção identifica Sara como mãe de Isaque e associa a tenda a ela, preservando a ordem hebraica sem prejudicar a clareza.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: tomou Rebeca
  rationale: לקח significa literalmente “tomar”. A tradução mantém esta ação distinta da oração seguinte, que declara explicitamente que Rebeca se tornou sua mulher.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ela se tornou sua mulher
  rationale: A construção היה + ל + אשה assinala a nova condição matrimonial. “Tornou-se sua mulher” preserva a progressão narrativa e é idiomático em português.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Ele a amou
  rationale: אהב é o verbo comum para “amar”; a formulação direta conserva a força simples da declaração hebraica.
- source_word: וַיִּנָּחֵם
  choice: foi consolado
  rationale: O nifal de נחם, neste contexto, expressa receber consolo, não arrependimento. “Foi consolado” representa com precisão a forma passiva/reflexiva do hebraico.
- source_word: אַחֲרֵי אִמּוֹ
  choice: depois da morte de sua mãe
  rationale: Literalmente, a expressão diz “depois de sua mãe”, mas o contexto de Gênesis 23 mostra que se refere ao período posterior à morte dela. A explicitação evita uma construção obscura em português, e a nota registra a forma literal.
theological_decisions:
- issue: A morte da mãe é pressuposta, mas não declarada no sintagma final.
  choice: Explicitar “morte” no texto principal e registrar a formulação literal em nota.
  alternative: Traduzir literalmente “depois de sua mãe”.
  rationale: A alternativa literal seria pouco natural e ambígua em português. O contexto imediato mais amplo identifica inequivocamente a perda de Sara, sem exigir uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a sequência narrativa do hebraico e evita fundir “tomou Rebeca” com “ela se tornou sua mulher”. O pronome em “sua mãe” refere-se a Isaque, como explicita o contexto.
