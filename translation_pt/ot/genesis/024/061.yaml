  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: pt
  text: Então Rebeca e suas moças[a] se levantaram, montaram nos camelos e seguiram o homem. E o servo levou Rebeca consigo e partiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas jovens acompanhantes” ou “suas criadas”. O termo hebraico designa jovens mulheres e, neste contexto, provavelmente se refere às acompanhantes de Rebeca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: se levantaram
  rationale: O verbo קום indica levantar-se. Embora a forma hebraica esteja no singular e concorde inicialmente com Rebeca, o português pede o plural porque o sujeito expresso inclui Rebeca e suas moças.
- source_word: נַעֲרֹתֶיהָ
  choice: suas moças
  rationale: נַעֲרָה designa primariamente uma jovem. No contexto, trata-se das jovens que acompanhavam Rebeca, mas o termo hebraico não explicita por si só a condição servil; por isso, “moças” preserva melhor sua amplitude.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: montaram nos camelos
  rationale: רכב com עַל descreve aqui o ato de montar nos camelos para iniciar ou continuar a viagem.
- source_word: אַחֲרֵי הָאִישׁ
  choice: seguiram o homem
  rationale: אַחֲרֵי exprime movimento atrás de alguém. “Seguiram o homem” é natural em português e mantém הָאִישׁ como “o homem”, sem substituí-lo interpretativamente por “o servo”.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: o servo levou Rebeca consigo
  rationale: לקח significa “tomar” ou “levar”. Neste contexto de viagem, “levou Rebeca consigo” comunica naturalmente que o servo a tomou sob sua condução, evitando o possível sentido matrimonial de “tomou Rebeca” em português.
- source_word: וַיֵּלַךְ
  choice: partiu
  rationale: הלך significa ir. Depois da referência explícita à condução de Rebeca, “partiu” expressa de modo conciso e idiomático a continuação da viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva “o homem” do hebraico, enquanto emprega construções idiomáticas no relato da viagem.
