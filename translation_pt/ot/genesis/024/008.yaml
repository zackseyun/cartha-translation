base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: pt
  text: Mas, se a mulher não quiser ir com você[a], você ficará livre deste meu juramento[b]. Só não leve meu filho de volta para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ir atrás de você” ou “seguir você”; literalmente, “ir atrás de você”.
    reason: lexical_alternative
  - marker: b
    text: Ou “você estará desobrigado deste meu juramento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a instrução anterior; esta formulação é natural em português.
- source_word: לֹא תֹאבֶה
  choice: não quiser
  rationale: Preserva a ideia volitiva de não estar disposta ou não consentir, sem sugerir necessariamente uma recusa desafiadora.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Ela ainda é uma possível noiva não identificada; chamá-la de esposa seria prematuro.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: ir com você
  rationale: No contexto de viagem, exprime naturalmente a ação pretendida; a imagem hebraica literal, 'ir atrás de você', é registrada em nota.
- source_word: וְנִקִּיתָ
  choice: você ficará livre
  rationale: O nifal de נקה indica estar isento ou desobrigado de uma obrigação.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: deste juramento que me fez
  rationale: Em português, esclarece naturalmente que se trata do juramento exigido por Abraão, preservando o demonstrativo e a relação pessoal expressa no hebraico.
- source_word: רַק
  choice: Apenas
  rationale: Marca a forte ressalva que limita a liberação do juramento.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: não leve meu filho de volta para lá
  rationale: Preserva o sentido causativo do hifil de שוב e a proibição enfática no contexto.
