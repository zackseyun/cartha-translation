  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: pt
  text: Então o servo pôs a mão debaixo da coxa de Abraão, seu senhor, e lhe jurou a respeito desse assunto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Debaixo da coxa” traduz literalmente a expressão hebraica que descreve um gesto solene de juramento; alguns entendem que o gesto estava simbolicamente ligado aos lombos ou à descendência ligada à aliança.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, destaca-se sua função de confiança na casa de Abraão; “servo” preserva a hierarquia social sem tornar a condição jurídica o foco do versículo.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: pôs a mão
  rationale: שׂוּם significa pôr, colocar ou estabelecer. “Pôs a mão” é natural em português e mantém a concretude da ação.
- source_word: תַּחַת יֶרֶךְ
  choice: debaixo da coxa
  rationale: יָרֵךְ significa literalmente “coxa”. A tradução conserva a expressão concreta e deixa possíveis sentidos simbólicos para a nota.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Abraão, seu senhor
  rationale: אֲדוֹן, aplicado a uma autoridade humana, pode ser traduzido por “senhor”. Aqui, “seu senhor” expressa a relação hierárquica doméstica e soa natural em português; a vírgula esclarece que o senhor do servo é Abraão.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: e lhe jurou
  rationale: No nifal, שׁבע significa jurar ou prestar juramento. “Lhe jurou” é conciso e preserva o destinatário indicado por לוֹ.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: a respeito desse assunto
  rationale: דָּבָר pode significar palavra, coisa ou assunto. Aqui retoma a incumbência apresentada por Abraão, de modo que “assunto” comunica adequadamente o referente contextual.
theological_decisions:
- issue: Tradução literal do gesto de juramento ou interpretação de seu simbolismo
  choice: Manter no texto “debaixo da coxa” e explicar em nota que se trata de um gesto solene de juramento.
  alternative: Traduzir de modo interpretativo como referência aos lombos, aos órgãos genitais ou à descendência da aliança.
  rationale: O hebraico descreve o gesto físico, mas não explica seu simbolismo. A formulação literal preserva a ambiguidade e evita inserir no texto uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do hebraico sem soar artificial; “Então” expressa a continuidade narrativa do wayyiqtol.
