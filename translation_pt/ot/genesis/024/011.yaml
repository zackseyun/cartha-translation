  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: pt
  text: Ele fez os camelos se ajoelharem fora da cidade, junto ao poço, ao entardecer, quando as mulheres saíam para tirar água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ הַגְּמַלִּים
  choice: fez os camelos se ajoelharem
  rationale: O hifil de ברך tem sentido causativo neste contexto. A formulação comunica de modo natural e concreto que ele fez os animais se ajoelharem.
- source_word: מִחוּץ לָעִיר
  choice: fora da cidade
  rationale: Tradução direta e corrente; עִיר pode designar cidade ou povoado, mas “cidade” é adequado e tradicional no contexto.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: junto ao poço
  rationale: Embora אֶל indique direção, a frase descreve aqui o lugar em que os camelos ficaram. “Junto ao poço” expressa naturalmente o resultado do movimento; “de água” é dispensável em português.
- source_word: לְעֵת עֶרֶב
  choice: ao entardecer
  rationale: Expressão portuguesa natural e digna para o período do fim do dia, sem a redundância de “na hora da tarde”.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: quando as mulheres saíam para tirar água
  rationale: O particípio substantivado é feminino plural e identifica mulheres. A formulação explicita de maneira idiomática sua atividade de tirar água e apresenta a ação como costumeira naquele horário.
