  rationale: A revisão conserva a não identificação do agente, sem acrescentar um nome ausente do versículo, e torna mais nítida a distribuição de palha, forragem e água. Também explicita «os pés», em conformidade com a repetição do hebraico, e ajusta a nota para apresentar a questão de agência como inferência contextual, não como informação expressa pelo texto.
