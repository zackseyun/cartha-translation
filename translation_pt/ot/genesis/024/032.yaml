  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: pt
  text: Então o homem entrou na casa. Os camelos foram soltos[a], e foram-lhes dadas palha e forragem, bem como água para lavar os pés dele e os pés dos homens que estavam com ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «abriu os camelos», expressão que, neste contexto, pode referir-se a soltá-los, retirar-lhes os arreios ou aliviá-los da carga.
    reason: lexical_alternative
  - marker: b
    text: 'No hebraico, os verbos correspondentes a «soltou» e «deu» estão no masculino singular: «ele soltou» e «ele deu». O sujeito não é nomeado neste versículo. Pela sequência gramatical, pode retomar o homem mencionado no início; pelo contexto de hospitalidade, alguns o entendem como Labão.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: Então o homem entrou na casa
  rationale: בוא com o he direcional em הַבַּיְתָה indica movimento para dentro da casa. “O homem” preserva a designação explícita do hebraico, sem substituí-la por “o servo”.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: Os camelos foram descarregados
  rationale: פתח significa literalmente “abrir”, mas aqui é um uso contextual referente a soltar os animais de sua carga ou equipamento após a viagem. A voz passiva preserva o acontecimento sem decidir indevidamente quem executou a ação.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: palha e forragem
  rationale: תֶּבֶן designa palha ou restolho, e מִסְפּוֹא, alimento para animais. “Forragem” é claro, atual e distingue o segundo termo da palha.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: Também foi dada água para ele lavar os pés
  rationale: O infinitivo לִרְחֹץ expressa a finalidade da água. “Ele” retoma naturalmente o homem que entrou na casa, sem identificar como anfitrião aquele que recebeu a água.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: e para os homens que estavam com ele lavarem os seus
  rationale: A formulação conserva o plural “homens” e a oração relativa “que estavam com ele”, evitando a repetição pouco natural de “pés” em português.
theological_decisions:
- issue: Identidade do agente que descarregou os camelos e forneceu alimento e água
  choice: Não identificar o agente no texto principal, usando construções passivas
  alternative: Fazer do homem/servo o agente gramatical, ou inserir explicitamente “Labão”
  rationale: Os verbos hebraicos estão no masculino singular sem sujeito expresso. A sequência gramatical pode apontar para “o homem”, mas o contexto de hospitalidade permite uma mudança implícita para Labão. Inserir “Labão” iria além do texto; fazer do visitante o agente eliminaria a tensão contextual. A voz passiva comunica os acontecimentos e preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário cotidiano. As construções passivas são deliberadas para não resolver uma ambiguidade de agência presente entre a sintaxe e o contexto hebraicos.
