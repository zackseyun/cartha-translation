  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: pt
  text: 'E meu senhor me fez jurar, dizendo: “Não tome uma esposa para meu filho dentre as filhas dos cananeus, em cuja terra eu habito.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “entre os quais habito”. Em hebraico, a expressão é literalmente “o cananeu, em cuja terra eu habito”, com “cananeu” no singular coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: me fez jurar
  rationale: O hifil de שׁבע expressa fazer alguém jurar ou colocá-lo sob juramento. A formulação é natural em português e preserva a força do compromisso solene.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: O servo se refere a Abraão, seu superior humano. “Meu senhor” preserva a forma respeitosa do hebraico sem sugerir referência a Deus.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma narrativa corrente para introduzir discurso direto, correspondente ao infinitivo hebraico.
- source_word: לֹא תִקַּח
  choice: Não tome
  rationale: O imperfeito na instrução juramentada tem força proibitiva. “Não tome” é direto, solene e natural em português.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: Embora o contexto seja a escolha de uma esposa, a construção portuguesa “tomar uma mulher para meu filho” mantém a expressão concreta do hebraico; a finalidade matrimonial fica clara pelo contexto.
- source_word: לִבְנִי
  choice: para meu filho
  rationale: Reproduz o texto sem acrescentar o nome de Isaque, que não aparece neste versículo.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: dentre as filhas dos cananeus
  rationale: Preserva a expressão familiar e étnica do hebraico. O singular coletivo הַכְּנַעֲנִי é vertido naturalmente pelo plural português “cananeus”.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: em cuja terra eu habito
  rationale: Mantém a referência explícita à terra e o sentido durativo do particípio יֹשֵׁב. “Habito” oferece registro digno e corrente.
