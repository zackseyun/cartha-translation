base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: pt
  text: 'Ela disse: “Beba, meu senhor[a]”. Então, sem demora, baixou o seu cântaro sobre a sua mão e deu-lhe de beber.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”. O hebraico diz literalmente “meu senhor”, aqui usado como forma respeitosa de se dirigir a um homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Beba
  rationale: Imperativo masculino singular de שׁתה. “Beba” preserva de modo direto e natural o convite formulado no hebraico.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Forma respeitosa de tratamento dirigida aqui a um homem, não um título divino. “Meu senhor” mantém o sentido literal e a deferência social; a nota oferece “senhor” como alternativa idiomática.
- source_word: וַתְמַהֵר
  choice: sem demora
  rationale: O verbo expressa prontidão ou pressa. A locução adverbial liga naturalmente essa ideia à ação seguinte sem perder a ênfase narrativa.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: baixou o cântaro
  rationale: O verbo ירד descreve o movimento descendente do recipiente que ela carregava. “Baixou” é claro e idiomático em português.
- source_word: עַל יָדָהּ
  choice: sobre a mão
  rationale: Reproduz concretamente a expressão hebraica sem acrescentar “ombro”, informação inferida do contexto, mas não expressa neste versículo.
- source_word: וַתַּשְׁקֵהוּ
  choice: lhe deu de beber
  rationale: O hifil de שׁקה significa fazer alguém beber ou dar-lhe de beber. Esta formulação é natural em português e preserva o valor causativo.
