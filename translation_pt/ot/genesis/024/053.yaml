  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: pt
  text: Então o servo tirou objetos de prata, objetos de ouro e roupas e os deu a Rebeca. Também deu presentes preciosos[a] ao irmão e à mãe dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presentes seletos”; o termo hebraico pode indicar presentes especialmente finos ou valiosos e, em alguns contextos, iguarias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: tirou
  rationale: O hifil de יצא indica fazer sair ou trazer para fora; “tirou” expressa de modo natural a ação concreta no contexto.
- source_word: הָעֶבֶד
  choice: o servo
  rationale: עֶבֶד pode designar servo ou escravo; neste contexto narrativo, “servo” é natural e adequado à função exercida pelo personagem.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: objetos de prata, objetos de ouro
  rationale: כְּלִי é um termo amplo para objeto, utensílio, recipiente ou artigo. “Objetos” mantém essa abrangência sem sugerir especificamente vasos.
- source_word: וּבְגָדִים
  choice: e roupas
  rationale: בְּגָדִים significa peças de vestuário; “roupas” é corrente, claro e digno em português moderno.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: e os deu a Rebeca
  rationale: O pronome “os” retoma naturalmente os objetos e as roupas mencionados, sem alterar o sentido do hebraico.
- source_word: וּמִגְדָּנֹת
  choice: Também deu presentes preciosos
  rationale: מִגְדָּנֹת denota coisas seletas ou preciosas oferecidas como presentes e, em certos contextos, pode referir-se a iguarias. “Presentes preciosos” se ajusta ao contexto matrimonial sem restringir o referente a alimentos.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: ao irmão e à mãe dela
  rationale: A formulação deixa claro que ambos são parentes de Rebeca e reproduz com naturalidade os dois complementos hebraicos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativamente digno, com ampla legibilidade brasileira. A repetição de “objetos” preserva o paralelismo hebraico; “dela” evita a ambiguidade que “sua” poderia criar.
