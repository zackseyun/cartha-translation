base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: pt
  text: 'Então chamaram Rebeca e lhe disseram: “Você irá com este homem?” Ela respondeu: “Irei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: chamaram Rebeca
  rationale: קרא com לְ indica chamar alguém para participar da conversa. “Chamaram” é natural e não acrescenta a força de “convocaram”.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: lhe disseram
  rationale: Preserva o verbo hebraico comum אמר, “dizer”, e a indicação de destinatária, em português corrente e digno.
- source_word: הֲתֵלְכִי
  choice: Você irá
  rationale: A forma interrogativa feminina de הלך pergunta diretamente se Rebeca irá; a formulação evita acrescentar explicitamente uma ideia de disposição que não está lexicalizada.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: com este homem
  rationale: Traduz אִישׁ de modo transparente como “homem”; embora o referente seja o servo de Abraão, o hebraico não usa aqui “servo”.
- source_word: וַתֹּאמֶר
  choice: Ela respondeu
  rationale: Embora אמר seja literalmente “disse”, “respondeu” expressa naturalmente em português a função do verbo neste diálogo sem alterar o conteúdo.
- source_word: אֵלֵךְ
  choice: Irei
  rationale: A forma de primeira pessoa de הלך é uma declaração direta e enfática no contexto; “Irei” conserva sua concisão.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O uso de “você” torna explícito o tratamento singular já marcado no hebraico e mantém naturalidade contemporânea; “este homem” e a resposta breve “Irei” preservam a formulação direta do original.
