  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: pt
  text: 'e me disser: “Beba você também, e tirarei água também para os seus camelos”, essa é a mulher que Yahweh designou[a] para o filho do meu senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: determinou; decidiu.'
    reason: O hifil de יכח admite, neste contexto, as nuances de designar, determinar ou decidir.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: e me disser
  rationale: O perfeito hebraico aparece dentro da formulação condicional do sinal pedido pelo servo; em português, o futuro do subjuntivo expressa naturalmente essa condição sem transformar a fala em simples narração passada.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Beba você também
  rationale: Preserva o imperativo שְׁתֵה e a ênfase inclusiva de גַּם אַתָּה.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: e tirarei água também para os seus camelos
  rationale: שׁאב significa tirar água; a explicitação de “água” é exigida pelo uso natural em português e pelo contexto. “Também” preserva וְגַם.
- source_word: הִוא הָאִשָּׁה
  choice: essa é a mulher
  rationale: Mantém a frase identificadora indicativa do hebraico. “Essa” retoma naturalmente, em português, a mulher que responder segundo o sinal.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: que ... designou
  rationale: Neste contexto, o hifil de יכח comunica determinação ou escolha divina; “designou” preserva esse sentido sem especificar além do texto o modo da escolha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְבֶן אֲדֹנִי
  choice: para o filho do meu senhor
  rationale: Reproduz a relação indicada por לְ e a referência respeitosa do servo ao seu amo, com formulação clara em português.
theological_decisions:
- issue: Forma da oração identificadora הִוא הָאִשָּׁה
  choice: essa é a mulher
  alternative: que seja ela a mulher
  rationale: Embora o contexto seja o relato de uma oração e permita entender a frase como pedido, a construção hebraica é uma oração nominal indicativa. A tradução mantém essa forma e não introduz explicitamente um jussivo ausente.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino; a transliteração preserva essa distinção em relação ao título אֲדֹנִי, traduzido no mesmo versículo como “meu senhor”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro do subjuntivo em “disser” acompanha a condição implícita no contexto; “tirarei água” conserva o tom narrativo sem soar arcaico. A repetição de “também” reflete a repetição hebraica de גַּם.
