lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Então ele disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade em português a sequência do discurso, sem acrescentar uma relação causal.
- source_word: עֶבֶד
  choice: servo
  rationale: עֶבֶד pode significar “servo” ou “escravo”. Neste contexto, o homem se apresenta respeitosamente como membro subordinado da casa de Abraão; “servo” é natural e adequado, enquanto a alternativa mais forte é preservada em nota.
- source_word: אַבְרָהָם
  choice: Abraão
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: אָנֹכִי
  choice: Sou
  rationale: O pronome independente marca a autoidentificação explícita. Em português, a forma verbal “Sou” comunica essa identificação de maneira natural, sem exigir o pronome “eu”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A colocação do marcador após “Abraão” vincula a nota à expressão completa “servo de Abraão”.
