revisions:
- from: 'Hoje cheguei à fonte[a] e disse: “Ó Yahweh, Deus do meu senhor Abraão, se de fato estás fazendo prosperar o meu caminho pelo qual estou seguindo—”'
  to: 'Hoje cheguei à fonte[a] e disse: “Ó Yahweh, Deus do meu senhor Abraão, se agora estás fazendo prosperar o meu caminho pelo qual sigo—”'
  rationale: A revisão substitui uma ênfase interpretativa («de fato») por «agora», mais próxima da nuance contextual de נָא e da decisão lexical de referência, e ajusta a expressão relativa final para um português natural sem apagar o possessivo de דַּרְכִּי nem o aspecto em curso da jornada. Mantêm-se a pontuação suspensiva e a nota lexical.
