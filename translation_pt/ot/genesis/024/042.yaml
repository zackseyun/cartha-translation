  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: pt
  text: 'Hoje cheguei à fonte[a] e disse: “Ó Yahweh, Deus do meu senhor Abraão, se agora estás fazendo prosperar o meu caminho pelo qual sigo—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao poço”. O termo hebraico designa mais especificamente uma nascente ou fonte de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Hoje cheguei
  rationale: O waw consecutivo narra uma ação passada, e הַיּוֹם funciona adverbialmente. A ordem escolhida preserva a ênfase temporal com naturalidade em português.
- source_word: הָעָיִן
  choice: a fonte
  rationale: עַיִן designa especificamente uma nascente ou fonte de água. “Fonte” mantém essa precisão, embora “poço” seja tradicional no contexto mais amplo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Deus do meu senhor Abraão
  rationale: אֲדֹנִי indica aqui a relação humana entre o servo e Abraão. “Senhor” é digno e natural, e não funciona neste contexto como título divino.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: se de fato estás fazendo prosperar
  rationale: A construção é elíptica e preserva uma condição ainda em aberto; נָא acrescenta uma nuance de súplica ou ênfase, enquanto o particípio causativo de צלח apresenta a ação divina de dar êxito.
- source_word: דַּרְכִּי
  choice: o meu caminho
  rationale: Mantém o sentido concreto e figurado de דֶּרֶךְ, bem como o possessivo explícito, sem reduzir antecipadamente a referência a uma simples viagem.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: pelo qual estou seguindo
  rationale: Reproduz de modo inteligível a expressão hebraica literalmente associada a andar ou ir sobre um caminho, preservando o aspecto em curso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Força da oração condicional אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: se de fato estás fazendo prosperar
  alternative: se te dignares a fazer prosperar; se agora estás fazendo prosperar
  rationale: A formulação mantém a construção incompleta que se prolonga ao versículo seguinte e não resolve indevidamente se a frase é pedido, busca de confirmação ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase permanece suspensa no fim, como no hebraico, continuando no versículo seguinte. Mantiveram-se o nome divino Yahweh, o possessivo em “meu caminho” e a ambiguidade da construção condicional.
