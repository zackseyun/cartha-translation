  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: pt
  text: 'Ele me disse: “Yahweh, diante de quem tenho andado, enviará seu anjo com você, fará com que sua viagem seja bem-sucedida[a], e você tomará uma esposa para meu filho do meu clã[b] e da casa de meu pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará prosperar o seu caminho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da minha família”; o termo hebraico pode indicar um grupo de parentesco mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: diante de quem tenho andado
  rationale: Preserva a metáfora hebraica de conduzir a vida diante de Deus, sem explicitar além do texto a ideia de fidelidade.
- source_word: מַלְאָכוֹ
  choice: seu anjo
  rationale: Neste contexto, designa o mensageiro celestial enviado por Yahweh para acompanhar a missão.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: fará com que sua viagem seja bem-sucedida
  rationale: Expressa com clareza o sentido causativo do verbo e entende “caminho” como a viagem ou missão do servo.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: você tomará para meu filho uma esposa
  rationale: Mantém o idioma matrimonial do hebraico em linguagem bíblica inteligível, sem acrescentar a ideia de escolha ou conquista.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: do meu clã
  rationale: Comunica um grupo de parentesco mais amplo que a família imediata.
- source_word: וּמִבֵּית אָבִי
  choice: e da casa de meu pai
  rationale: Conserva a expressão hebraica para a casa ou linhagem paterna, ainda compreensível em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Mantém o nome pessoal da aliança mediante transliteração e evita substituí-lo por um título.
- issue: Sentido de “andar diante de” Deus
  choice: preservar a metáfora da conduta de vida diante de Deus
  alternative: diante de quem tenho vivido fielmente
  rationale: A formulação preserva a dimensão relacional e ética da expressão sem inserir explicitamente “fielmente”, que é uma interpretação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se os idiomas bíblicos “andar diante de” e “casa de meu pai”, enquanto a expressão sobre o êxito da viagem é apresentada de modo natural.
