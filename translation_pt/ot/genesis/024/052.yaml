base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: pt
  text: Quando o servo de Abraão ouviu o que eles disseram, prostrou-se por terra diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inclinou-se até o chão perante Yahweh”. O verbo hebraico também pode indicar um gesto de adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz o acontecimento seguinte. Em português, “Quando” transmite com naturalidade a relação temporal sem reproduzir de modo rígido o idiomatismo hebraico.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O verbo indica diretamente a percepção do que foi dito; “ouviu” é claro e natural no contexto.
- source_word: עֶבֶד אַבְרָהָם
  choice: o servo de Abraão
  rationale: A construção hebraica identifica o representante doméstico de Abraão. “Servo” preserva o sentido contextual sem fazer de sua condição jurídica o foco do versículo.
- source_word: דִּבְרֵיהֶם
  choice: o que eles disseram
  rationale: Equivalente idiomático em português para “as palavras deles”, mantendo a referência ao pronunciamento precedente.
- source_word: וַיִּשְׁתַּחוּ
  choice: prostrou-se
  rationale: O verbo descreve inclinação profunda ou prostração, frequentemente reverencial. A escolha preserva a ação corporal sem substituí-la diretamente por “adorou”.
- source_word: אַרְצָה
  choice: por terra
  rationale: A forma direcional indica movimento em direção ao chão. “Prostrou-se por terra” é uma expressão portuguesa natural e vívida.
- source_word: לַיהוָה
  choice: diante de Yahweh
  rationale: Com o verbo de prostração, a preposição marca aquele a quem se dirige o gesto reverencial. “Diante de” soa natural em português; “Yahweh” representa diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Se וַיִּשְׁתַּחוּ deve ser explicitado como adoração
  choice: prostrou-se por terra diante de Yahweh
  alternative: adorou Yahweh
  rationale: Embora o gesto seja reverencial e possa ter força cultual, o hebraico destaca a postura física por meio de אַרְצָה. A tradução mantém essa tensão sem reduzir o verbo à ideia abstrata de adoração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita literalismo áspero, preserva a ação corporal do hebraico e mantém o nome divino como Yahweh.
