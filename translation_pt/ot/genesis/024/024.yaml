  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: pt
  text: 'Ela lhe respondeu: “Sou filha de Betuel, filho de Milca, que Milca deu à luz para Naor[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que Milca deu à luz a Naor”. Na fórmula hebraica de nascimento, “deu à luz para/a Naor” identifica Naor como o pai de Betuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Ela lhe respondeu
  rationale: No contexto de diálogo, וַתֹּאמֶר introduz a resposta à pergunta anterior; “lhe” representa naturalmente אֵלָיו em português.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Sou filha de Betuel
  rationale: Reproduz com clareza a oração nominal hebraica e o pronome explícito אָנֹכִי, sem exigir artigo antes de “filha” em português.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן מִלְכָּה
  choice: filho de Milca
  rationale: A relação de construto identifica Betuel como filho de Milca.
- source_word: אֲשֶׁר יָלְדָה
  choice: que ela deu à luz
  rationale: A forma verbal feminina tem Milca como sujeito e Betuel como referente do pronome relativo; a formulação é natural e mantém explícita a maternidade.
- source_word: לְנָחוֹר
  choice: a Naor
  rationale: Na fórmula hebraica de nascimento, לְ identifica o pai; “deu à luz a Naor” preserva essa relação de modo conciso, embora em português possa soar menos usual.
- source_word: מִלְכָּה / נָחוֹר
  choice: Milca / Naor
  rationale: Formas tradicionais e amplamente reconhecíveis em português para os nomes próprios.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no contexto narrativo. “Respondeu” explicita a função discursiva do verbo sem alterar seu conteúdo. A fórmula genealógica final foi mantida próxima ao hebraico; não se acrescentou vírgula antes de “filho de Milca” para conservar a cadeia de parentesco compacta.
