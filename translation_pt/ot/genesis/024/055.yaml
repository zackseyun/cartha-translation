base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: pt
  text: 'Mas o irmão e a mãe dela disseram: “Que a jovem fique conosco alguns dias ou dez dias; depois ela poderá ir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ... disseram
  rationale: O verbo hebraico está formalmente no singular, embora o sujeito composto seja “o irmão e a mãe dela”. Em português natural, emprega-se o plural. “Mas” expressa o contraste com a urgência do servo no versículo anterior.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: o irmão e a mãe dela
  rationale: Mantém a ordem dos elementos hebraicos e o singular “irmão”, referindo-se especificamente ao irmão de Rebeca.
- source_word: תֵּשֵׁב
  choice: Que ... fique
  rationale: Neste contexto, ישב indica permanecer por algum tempo antes da partida; “que fique” transmite naturalmente o valor volitivo.
- source_word: הַנַּעֲרָ
  choice: a jovem
  rationale: נַעֲרָה designa uma mulher jovem. “A jovem” é atual, digno e adequado ao contexto.
- source_word: אִתָּנוּ
  choice: conosco
  rationale: Equivalente direto e natural da expressão de companhia ou permanência.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: alguns dias, talvez dez
  rationale: A expressão hebraica é literalmente “dias ou dez”. “Alguns dias, talvez dez” preserva a imprecisão e comunica em português natural que dez dias são apresentados como possível extensão ou especificação.
- source_word: אַחַר
  choice: depois
  rationale: Marca naturalmente a ação posterior.
- source_word: תֵּלֵךְ
  choice: ela poderá ir
  rationale: O contexto identifica a jovem como sujeito. “Poderá ir” comunica a permissão ou anuência proposta para depois da espera, sem impor uma simples previsão futura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A ambiguidade idiomática de יָמִים אוֹ עָשׂוֹר foi mantida no corpo por meio de “alguns dias, talvez dez”, dispensando nota.
