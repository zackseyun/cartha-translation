base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: pt
  text: 'E aconteceu que, ao ver a argola no nariz e os braceletes nos braços de sua irmã e ao ouvir as palavras de sua irmã Rebeca: “Foi assim que o homem falou comigo”, ele foi até o homem. E eis que ele estava junto aos camelos, perto da fonte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a função sequencial da fórmula narrativa hebraica sem recorrer à expressão arcaica “e sucedeu que”.
- source_word: כִּרְאֹת
  choice: quando ele viu
  rationale: A construção com infinitivo e כְּ exprime circunstância temporal; esta é uma formulação natural e fiel em português.
- source_word: הַנֶּזֶם
  choice: a argola no nariz
  rationale: Embora נֶזֶם possa designar uma argola de modo geral, Gênesis 24:47 especifica que o objeto foi colocado no nariz de Rebeca.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: os braceletes nos braços de sua irmã
  rationale: צְמִדִים designa adornos usados nos pulsos ou braços. “Nos braços” comunica naturalmente o sentido neste contexto e evita a imagem estranha de braceletes sobre as mãos.
- source_word: וּכְשָׁמְעוֹ
  choice: e ouviu
  rationale: Reproduz a segunda circunstância temporal paralela, sem repetir “quando” de modo desnecessário em português.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: as palavras de sua irmã Rebeca, que dizia
  rationale: Conserva a referência explícita às “palavras” e representa לֵאמֹר como introdução do discurso direto em português natural.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Foi assim que o homem falou comigo
  rationale: Preserva a força demonstrativa de כֹּה, isto é, “assim/deste modo”, com expressão corrente.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: foi até o homem
  rationale: בוא com אֶל indica movimento em direção ao homem; “foi até” se ajusta ao ponto de vista narrativo de Labão.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a apresentação vívida e deítica do hebraico, em registro bíblico digno ainda inteligível.
- source_word: עֹמֵד עַל הַגְּמַלִּים
  choice: estava junto aos camelos
  rationale: O particípio indica estado contínuo, e עַל aqui expressa proximidade, não posição em cima dos animais.
- source_word: עַל הָעָיִן
  choice: perto da fonte
  rationale: עַיִן designa aqui uma nascente ou fonte de água; a preposição indica localização próxima.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe longa do hebraico foi preservada sem se tornar excessivamente pesada. “E eis que” conserva a vivacidade narrativa; “argola no nariz”, “braceletes nos braços” e “fonte” explicitam o sentido contextual sem acrescentar conteúdo teológico.
