  text: וַ/תִּשָּׂ֤א רִבְקָה֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא אֶת יִצְחָ֑ק וַ/תִּפֹּ֖ל מֵ/עַ֥ל הַ/גָּמָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: pt
  text: Rebeca levantou os olhos e viu Isaque; então desceu do camelo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “caiu de cima do camelo”. Aqui, o hebraico provavelmente usa “cair” de modo idiomático no sentido de desmontar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: levantou os olhos
  rationale: Preserva a expressão idiomática hebraica de modo natural e compreensível em português; “olhou para cima” poderia sugerir indevidamente uma direção física específica.
- source_word: וַתֵּרֶא
  choice: viu
  rationale: Traduz diretamente o sentido básico de ראה e mantém a sequência narrativa.
- source_word: אֶת יִצְחָק
  choice: Isaque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: desceu do camelo
  rationale: Comunica a provável força idiomática da expressão no contexto. A tradução estritamente literal, “caiu de cima do camelo”, poderia dar a impressão enganosa de um acidente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “levantou os olhos” conserva o estilo narrativo hebraico, enquanto “desceu do camelo” evita uma interpretação acidental não exigida pelo contexto.
