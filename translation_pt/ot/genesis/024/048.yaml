  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: pt
  text: Então me inclinei e adorei Yahweh, e bendisse Yahweh, o Deus de meu senhor Abraão, que me guiou pelo caminho verdadeiro[a], para tomar a filha do irmão de meu senhor para o filho dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “pelo caminho da verdade”. A expressão também pode significar “por um caminho fiel e seguro”, ressaltando que a orientação de Yahweh é digna de confiança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: me inclinei
  rationale: Expressa o ato físico de curvar-se profundamente sem especificar que o servo se ajoelhou.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: adorei Yahweh
  rationale: O verbo indica prostração reverente e, quando dirigido a Deus, é traduzido naturalmente por “adorar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: bendisse Yahweh
  rationale: Mantém o sentido básico de ברך e o modo bíblico de falar bem de Deus ou louvá-lo.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: o Deus de meu senhor Abraão
  rationale: Aqui אֲדֹנִי designa Abraão como superior humano do servo; “meu senhor” conserva essa relação e o tom respeitoso.
- source_word: הִנְחַנִי
  choice: me guiou
  rationale: O hifil de נחה denota conduzir ou guiar; “me guiou” é claro e natural no relato retrospectivo.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: pelo caminho verdadeiro
  rationale: Preserva a referência explícita de אֱמֶת à verdade, sem eliminar a possível nuance de fidelidade e confiabilidade da orientação divina.
- source_word: לָקַחַת
  choice: para tomar
  rationale: Reproduz de modo direto o infinitivo de propósito sem explicitar além do texto a finalidade matrimonial já indicada pelo contexto.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: a filha do irmão de meu senhor
  rationale: Mantém a relação familiar expressa pela cadeia construta hebraica.
- source_word: לִבְנוֹ
  choice: para o filho dele
  rationale: O pronome retoma o senhor do servo, Abraão; “dele” evita que “seu” tenha referente ambíguo em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido de בְּדֶרֶךְ אֱמֶת
  choice: pelo caminho verdadeiro
  alternative: por um caminho seguro; pelo caminho certo; pelo caminho da verdade
  rationale: A tradução conserva a tensão semântica entre verdade, fidelidade e confiabilidade, em vez de reduzir a expressão apenas à ideia de direção correta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe próxima do hebraico. “Meu senhor” preserva o tratamento respeitoso dirigido a Abraão, enquanto “o filho dele” reduz a ambiguidade pronominal comum em português.
