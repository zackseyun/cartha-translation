  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: pt
  text: Isaque tinha vindo de Beer-Laai-Roi[b][a], e ele morava na terra do Neguebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isaque veio de Beer-Laai-Roi.” A construção hebraica também pode ser traduzida de modo mais simples com o pretérito perfeito, em vez do mais-que-perfeito.'
    reason: lexical_alternative
  - marker: b
    text: Beer-Laai-Roi é um topônimo anteriormente associado a Agar (ver Gênesis 16:14).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: tinha vindo
  rationale: O perfeito qal indica um movimento concluído. Neste ponto da narrativa, o mais-que-perfeito situa a chegada antes da cena seguinte, embora o pretérito perfeito também seja possível.
- source_word: מִבּוֹא
  choice: de
  rationale: A construção comprimida com מִן e o infinitivo de בוא indica aqui, de modo mais natural, a procedência do movimento.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Laai-Roi
  rationale: O topônimo é transliterado, não traduzido; a forma hifenizada preserva seu caráter composto e segue um padrão reconhecível em português.
- source_word: יוֹשֵׁב
  choice: morava
  rationale: O particípio expressa estado contínuo ou residência habitual. “Morava” comunica esse valor durativo em português natural.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: na terra do Neguebe
  rationale: “Neguebe” funciona como designação geográfica, enquanto “terra” preserva o substantivo explícito אֶרֶץ.
- source_word: וְהוּא
  choice: e
  rationale: A coordenação hebraica liga a informação sobre a residência de Isaque à oração anterior. Em português, o sujeito pode ficar implícito sem perda de referência nem necessidade de acrescentar um marcador temporal ausente no original.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita acrescentar um marcador como “ora” ou “então”, que não tem correspondente explícito no hebraico, e usa “morava” para exprimir naturalmente a continuidade do particípio.
