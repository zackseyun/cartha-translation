base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: pt
  text: Eis que estou em pé junto à fonte, e as jovens da cidade[a] estão saindo para tirar água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as filhas dos homens da cidade”, expressão que se refere às jovens da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Partícula dêitica que chama a atenção para a cena imediata; “Eis que” preserva a vivacidade e mantém um registro bíblico digno, ainda compreensível.
- source_word: אָנֹכִי נִצָּב
  choice: estou
  rationale: O pronome independente e o particípio descrevem a presença e posição atual do servo. Em português, “estou” diante da indicação de lugar comunica isso naturalmente, sem a rigidez de “estou postado” nem a redundância de “estou em pé”.
- source_word: עַל עֵין הַמָּיִם
  choice: junto à fonte
  rationale: עַל indica proximidade neste contexto, e עֵין הַמָּיִם designa uma nascente ou fonte de água, não o termo hebraico habitual para poço. “Junto à fonte” é exato e idiomático.
- source_word: בְנוֹת אַנְשֵׁי הָעִיר
  choice: as jovens da cidade
  rationale: Literalmente, “as filhas dos homens da cidade”; trata-se de uma expressão social/familiar para as moças da comunidade. A tradução no texto comunica o referente em português natural, preservando a forma literal em nota.
- source_word: יֹצְאֹת
  choice: estão saindo
  rationale: O particípio feminino plural apresenta a ação em curso ou iminente, vista da posição do servo junto à fonte.
- source_word: לִשְׁאֹב מָיִם
  choice: para tirar água
  rationale: Expressão portuguesa corrente para recolher água de uma fonte ou poço; evita o possível sentido moderno de “desenhar” associado a “extrair” em certos contextos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Eis que” conserva a força dêitica do hebraico; a construção social hebraica mais literal é registrada em nota para não tornar o texto principal artificial.
