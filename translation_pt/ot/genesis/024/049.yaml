  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: pt
  text: Agora, se vocês estão dispostos a agir com bondade e fidelidade para com o meu senhor[a], digam-me; mas, se não, digam-me também, para que eu me volte para a direita ou para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amor leal e fidelidade”. Esse par de palavras hebraicas muitas vezes expressa bondade constante, leal e digna de confiança nas relações de compromisso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a conclusão prática e imediata do discurso do servo; a conjunção hebraica não precisa ser reproduzida separadamente em português.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: se vocês estão dispostos a agir
  rationale: A construção com יֵשׁ e particípio aponta, neste contexto, para a disposição ou intenção dos familiares de agir. A formulação evita tanto uma tradução excessivamente literal quanto a redução a um simples futuro.
- source_word: חֶסֶד וֶאֱמֶת
  choice: bondade e fidelidade
  rationale: 'Preserva os dois aspectos do par hebraico: benevolência leal expressa em ação e confiabilidade. A nota registra uma alternativa que ressalta mais explicitamente a constância.'
- source_word: אֶת אֲדֹנִי
  choice: para com o meu senhor
  rationale: Expressa naturalmente em português a pessoa em favor de quem se demonstra bondade e fidelidade.
- source_word: הַגִּידוּ לִי
  choice: digam-me
  rationale: Imperativo direto, natural e adequado à fala do servo diante da família.
- source_word: וְאִם לֹא
  choice: mas, se não
  rationale: Torna explícito o contraste entre uma resposta favorável e uma recusa.
- source_word: וְאֶפְנֶה
  choice: para que eu me volte
  rationale: O coortativo comunica a ação que o servo pretende tomar como consequência da resposta; a construção com 'para que' mantém essa nuance de propósito ou resultado.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: para a direita ou para a esquerda
  rationale: Mantém a imagem direcional hebraica, compreensível em português como a busca de outro rumo ou alternativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com plural explícito em “vocês” para refletir o destinatário coletivo. “Meu senhor” preserva a relação entre o servo e Abraão sem sugerir um título divino. “Também” na segunda ordem é uma explicitação discursiva natural, indicando que ele deseja uma resposta em qualquer dos casos.
