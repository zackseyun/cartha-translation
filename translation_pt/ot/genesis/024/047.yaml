base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: pt
  text: 'Então lhe perguntei: “De quem você é filha?” Ela respondeu: “Sou filha de Betuel, o filho que Milca deu à luz a Naor.” Então pus a argola[a] no nariz dela e os braceletes nas mãos[b] dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a argola para o nariz”. O termo hebraico pode designar uma argola em geral; a frase seguinte especifica que ela foi colocada no nariz.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nas mãos dela”; neste contexto, a expressão pode referir-se mais especificamente aos pulsos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Então lhe perguntei
  rationale: A sequência verbal hebraica literalmente combina ‘perguntei’ e ‘disse’; em português atual, ‘perguntei’ expressa naturalmente o ato de falar sem pleonasmo, enquanto ‘então’ marca o avanço narrativo.
- source_word: בַּת מִי אַתְּ
  choice: De quem você é filha?
  rationale: Formulação idiomática e clara em português que conserva tanto a relação filial quanto o interrogativo hebraico.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Sou filha de Betuel, filho de Naor
  rationale: Mantém a estrutura genealógica do hebraico e acrescenta ‘Sou’ para produzir uma resposta oral natural em português.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: que Milca deu à luz a Naor
  rationale: Conserva a identificação materna e torna explícito em português que Betuel foi o filho que Milca deu à luz a Naor, evitando ambiguidade de referente criada pela proximidade dos nomes.
- source_word: וָאָשִׂם
  choice: Então pus
  rationale: Verbo simples e corrente que preserva a continuação sequencial da narrativa.
- source_word: הַנֶּזֶם
  choice: a argola
  rationale: נֶזֶם designa uma argola ou joia anular; a expressão seguinte determina que, neste caso, era usada no nariz.
- source_word: עַל אַפָּהּ
  choice: no nariz dela
  rationale: Traduz diretamente o sentido concreto de אַף neste contexto e identifica sem eufemismo o lugar da joia.
- source_word: וְהַצְּמִידִים
  choice: e os braceletes
  rationale: ‘Braceletes’ é um termo moderno e claro para os adornos indicados por צְמִידִים.
- source_word: עַל יָדֶיהָ
  choice: nas mãos dela
  rationale: Mantém a expressão formal do hebraico, embora o contexto permita entender mais especificamente os pulsos.
