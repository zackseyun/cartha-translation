  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: pt
  text: O homem a observava em silêncio[a], para saber se Yahweh havia dado êxito à sua viagem ou não.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O homem a contemplava, admirado e em silêncio”.'
    reason: O raro particípio מִשְׁתָּאֵה pode indicar não apenas observação atenta, mas também admiração ou espanto; o texto principal preserva a formulação menos interpretativa.
lexical_decisions:
- source_word: הָאִישׁ
  choice: O homem
  rationale: Traduz diretamente o substantivo comum אִישׁ. Embora o contexto o identifique como servo de Abraão, o hebraico deste versículo diz literalmente “o homem”.
- source_word: מִשְׁתָּאֵה
  choice: observava
  rationale: O particípio indica uma observação contínua e atenta, possivelmente acompanhada de admiração ou espanto. “Observava” é natural em português e evita tornar explícita uma emoção que o termo apenas pode sugerir.
- source_word: לָהּ
  choice: a
  rationale: A preposição com sufixo feminino marca a mulher como objeto da atenção do homem; o pronome átono produz uma formulação idiomática em português.
- source_word: מַחֲרִישׁ
  choice: em silêncio
  rationale: O particípio de חרשׁ descreve o homem mantendo-se calado. A locução “em silêncio” preserva esse valor circunstancial com clareza.
- source_word: לָדַעַת
  choice: para saber
  rationale: 'O infinitivo com לְ expressa a finalidade da observação: saber ou descobrir o resultado.'
- source_word: הַהִצְלִיחַ
  choice: havia dado êxito
  rationale: A forma hifil de צלח tem sentido causativo, “fazer prosperar” ou “fazer ter sucesso”. “Dar êxito” comunica esse valor de modo natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דַּרְכּוֹ
  choice: à sua viagem
  rationale: Embora דֶּרֶךְ signifique literalmente “caminho”, neste contexto designa a viagem ou missão empreendida pelo homem. “Viagem” expressa naturalmente o referente narrativo.
- source_word: אִם לֹא
  choice: ou não
  rationale: A expressão completa a pergunta indireta iniciada por “se”, formando em português a construção idiomática “se... ou não”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” o apresenta como nome pessoal e não o substitui pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem soar artificial; “dar êxito à viagem” preserva o sentido causativo e “observava” mantém aberta a possível nuance de admiração registrada na nota.
