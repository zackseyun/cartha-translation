  text: וַ/יּוֹשֵׁ֣ב יוֹסֵף֮ אֶת אָבִ֣י/ו וְ/אֶת אֶחָי/ו֒ וַ/יִּתֵּ֨ן לָ/הֶ֤ם אֲחֻזָּה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/מֵיטַ֥ב הָ/אָ֖רֶץ בְּ/אֶ֣רֶץ רַעְמְסֵ֑ס כַּ/אֲשֶׁ֖ר צִוָּ֥ה פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: pt
  text: Assim, José instalou seu pai e seus irmãos e lhes deu uma propriedade na terra do Egito, na melhor parte da terra[a], na terra de Ramessés, conforme o faraó havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na parte mais excelente da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: instalou
  rationale: 'O hifil de ישׁב tem sentido causativo: José fez com que seu pai e seus irmãos passassem a residir ali. “Instalou” expressa isso de modo natural em português.'
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: seu pai e seus irmãos
  rationale: Mantém os termos de parentesco explicitamente empregados no hebraico, sem ampliá-los para “família”.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: lhes deu uma propriedade
  rationale: אֲחֻזָּה designa uma posse ou propriedade territorial. “Propriedade” preserva o sentido concreto sem introduzir indevidamente a noção teológica de herança.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva a repetição de אֶרֶץ (“terra”), importante para a estrutura literária do versículo.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: na melhor parte da terra
  rationale: מֵיטַב indica a porção melhor ou mais excelente. A formulação escolhida é clara e natural em português, sem especificar em que consistia essa superioridade.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: na terra de Ramessés
  rationale: Mantém tanto o nome próprio quanto a repetição de “terra”; aqui a expressão pode indicar o território ou a região de Ramessés.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: conforme o faraó havia ordenado
  rationale: A frase indica conformidade com uma ordem anterior do faraó; o mais-que-perfeito composto explicita naturalmente a sequência narrativa em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e a repetição de “terra” acompanham de perto o hebraico, enquanto “instalou” e “propriedade” comunicam naturalmente os sentidos causativo e territorial. O marcador da nota foi colocado junto à expressão a que a alternativa lexical efetivamente se refere.
