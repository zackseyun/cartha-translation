base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: pt
  text: A única terra que José não comprou foi a dos sacerdotes, pois os sacerdotes tinham do faraó uma porção fixa[a] e comiam a porção que o faraó lhes dava. Por isso, não venderam sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma provisão determinada”, “uma cota” ou “uma ração”. O termo hebraico חֹק, neste contexto, refere-se a uma provisão atribuída oficialmente, e não principalmente a um estatuto legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Introduz a exceção à compra das terras egípcias e conserva a força restritiva do hebraico.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: a terra dos sacerdotes
  rationale: Representa naturalmente a construção hebraica que designa a propriedade fundiária pertencente aos sacerdotes.
- source_word: קָנָה
  choice: comprou
  rationale: No contexto econômico da fome, o verbo indica a compra da terra, e não uma aquisição de natureza indeterminada.
- source_word: חֹק / חֻקָּם
  choice: provisão determinada / provisão
  rationale: Neste contexto, o termo designa o sustento oficialmente concedido pelo faraó, não principalmente uma lei ou estatuto. A primeira ocorrência explicita seu caráter determinado; a segunda mantém a coesão lexical sem tornar a frase pesada.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: e se alimentavam da provisão
  rationale: Expressa em português natural o sentido concreto de comer e, no contexto, viver do sustento recebido.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca de modo claro e corrente a consequência da provisão concedida aos sacerdotes.
- source_word: מָכְרוּ
  choice: venderam
  rationale: Equivalente comercial direto e adequado ao contexto narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O nome “José” foi explicitado para evitar a ambiguidade pronominal em português, pois ele é o agente da compra no contexto imediato. A formulação preserva a relação causal e a repetição semítica de “provisão”, mas torna idiomática a expressão literal “comeram sua porção”.
