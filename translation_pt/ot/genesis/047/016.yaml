base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: pt
  text: 'E José disse: “Entreguem o gado de vocês, e eu lhes darei alimento[a] em troca do gado de vocês, se o dinheiro acabou[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: «e eu lhes darei por/em troca do gado de vocês». O objeto «alimento» é suprido pelo contexto imediato da fome.'
    reason: Objeto implícito no hebraico, explicitado contextualmente.
  - marker: b
    text: 'Ou: «já que o dinheiro acabou». Embora normalmente signifique «se», a partícula hebraica pode ter sentido causal neste contexto.'
    reason: Alternativa lexical e nuance contextual de אִם.
lexical_decisions:
- source_word: הָבוּ
  choice: Entreguem
  rationale: O imperativo plural pede que os egípcios deem ou apresentem seus animais a José. “Entreguem” expressa com naturalidade a transferência exigida no contexto administrativo.
- source_word: מִקְנֵיכֶם
  choice: o gado de vocês
  rationale: מִקְנֶה abrange os animais domésticos possuídos como rebanho. “Gado” é uma forma corrente e suficientemente ampla em português neste contexto, sem restringir o sentido apenas a bovinos.
- source_word: וְאֶתְּנָה לָכֶם
  choice: e eu lhes darei alimento
  rationale: O objeto do verbo não está expresso no hebraico, mas é recuperado do contexto imediato da fome e da compra de alimento. Supri-lo evita uma construção truncada em português, deixando a explicitação transparente por meio da nota [a].
- source_word: בְּמִקְנֵיכֶם
  choice: em troca do seu gado
  rationale: A preposição בְּ marca aqui o meio ou a contraprestação da transação; “em troca de” comunica claramente essa relação.
- source_word: אִם
  choice: já que
  rationale: 'Embora אִם normalmente introduza uma condição, aqui pode assumir valor causal diante da situação já declarada: o dinheiro se esgotou. A nota [b] conserva a alternativa formal “se”.'
- source_word: אָפֵס כָּסֶף
  choice: o dinheiro acabou
  rationale: אָפֵס indica que algo se esgotou ou deixou de existir. “O dinheiro acabou” é conciso, natural e fiel ao contexto.
