  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a repetição de “dinheiro acabou”, o concreto “pão” e a expressão relacional “diante de você”, enquanto as notas registram as principais alternativas lexicais e o hebraísmo coletivo.
