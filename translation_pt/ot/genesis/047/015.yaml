  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: pt
  text: 'Quando acabou o dinheiro da terra do Egito e da terra de Canaã[a], todos os egípcios[b] foram até José e disseram: “Dê-nos pão[c]. Por que haveríamos de morrer diante de você? Pois o dinheiro acabou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a prata da terra do Egito e da terra de Canaã se esgotou”. A palavra hebraica pode significar “prata” ou “dinheiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “todo o Egito”.'
    reason: lexical_alternative
  - marker: c
    text: Neste contexto de fome, “pão” pode designar alimento de modo mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: acabou
  rationale: O verbo תמם indica que algo chegou ao fim ou se esgotou; “acabou” é claro, natural e mantém a repetição com a frase final.
- source_word: הַכֶּסֶף
  choice: o dinheiro
  rationale: Embora כֶּסֶף também possa significar “prata”, neste contexto de compra de mantimentos designa o meio de pagamento.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: da terra do Egito e da terra de Canaã
  rationale: Reproduz a construção com מִן e preserva a referência paralela às duas terras, sem tornar a frase pouco natural em português.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: todos os egípcios foram até José
  rationale: O hebraico diz literalmente “todo o Egito”, usando o nome do país coletivamente para seus habitantes. A formulação explicita o referente humano e “foram até” expressa naturalmente o movimento em direção a José.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: Em narrativa portuguesa, a coordenação direta transmite com naturalidade a função do infinitivo hebraico que introduz a fala.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Dê-nos pão
  rationale: Preserva o pedido direto e o substantivo concreto לֶחֶם, que neste contexto pode representar alimento em sentido mais amplo.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Por que haveríamos de morrer diante de você?
  rationale: A pergunta retórica exprime apelo urgente. “Diante de você” preserva a noção espacial de נֶגֶד sem acrescentar “aos seus olhos”, expressão não explícita no hebraico.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Pois o dinheiro acabou
  rationale: אָפֵס indica cessação ou inexistência; a tradução é concisa e conserva a repetição lexical do início do versículo.
theological_decisions: []
