base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: pt
  text: Não havia alimento em toda a terra[a], pois a fome era muito severa; e a terra do Egito e a terra de Canaã definharam[b] por causa da fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão”; aqui, provavelmente, o termo se refere de modo mais amplo a alimento em geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficaram exaustas” ou “desfaleceram”. O verbo hebraico é figurado e descreve o efeito debilitante da fome sobre o Egito e Canaã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido literal seja “pão”, neste contexto de fome o termo funciona de modo metonímico para alimento em geral. “Alimento” preserva o sentido amplo em português natural.
- source_word: אֵין
  choice: não havia
  rationale: A negação existencial é expressa naturalmente no passado, de acordo com o contexto narrativo.
- source_word: בְּכָל הָאָרֶץ
  choice: em toda a terra
  rationale: Mantém o termo geográfico hebraico sem sugerir necessariamente o planeta inteiro; o contexto delimita a região afetada.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: pois a fome era muito severa
  rationale: כָבֵד, literalmente “pesada”, descreve aqui a gravidade da fome; מְאֹד fornece a intensificação. “Muito severa” é idiomático e claro.
- source_word: וַתֵּלַהּ
  choice: definhavam
  rationale: O verbo raro descreve figuradamente o esgotamento debilitante causado pela fome. “Definhavam” conserva a imagem e concorda semanticamente com as duas terras mencionadas.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: a terra do Egito e a terra de Canaã
  rationale: Preserva a repetição e a ênfase geográfica da construção hebraica.
- source_word: מִפְּנֵי הָרָעָב
  choice: por causa da fome
  rationale: Tradução causal natural da locução prepositiva hebraica.
