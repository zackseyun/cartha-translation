  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: pt
  text: Quanto ao povo[a], ele o transferiu para as cidades, de uma extremidade do território do Egito à outra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ele o deslocou para as cidades». Algumas traduções, seguindo outra compreensão textual, dizem que José tornou o povo servo; o hebraico aqui fala mais diretamente de sua transferência ou realocação.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: o povo
  rationale: O substantivo coletivo designa a população egípcia afetada pela política de José; «o povo» é natural, claro e preserva o singular coletivo hebraico.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: ele o transferiu
  rationale: O hifil de עבר expressa fazer passar, deslocar ou transferir. «Transferiu» comunica a realocação e permite conservar em português o pronome singular que retoma o coletivo «povo».
- source_word: לֶעָרִים
  choice: para as cidades
  rationale: A preposição ל indica aqui destino. «Para as cidades» preserva a formulação do texto massorético sem especificar indevidamente se a entrada nos centros urbanos está em foco.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: de uma extremidade do território do Egito à outra
  rationale: A expressão indica toda a extensão da terra. «Território» representa גְבוּל sem sugerir apenas uma linha fronteiriça, e a construção de uma extremidade à outra reproduz naturalmente o merismo.
theological_decisions:
- issue: Natureza da ação de José para com a população egípcia
  choice: ele o transferiu para as cidades
  alternative: ele o reduziu à servidão; ele o deslocou de cidade em cidade
  rationale: O texto massorético descreve mais diretamente a transferência ou realocação do povo. A ideia de servidão depende de outra compreensão textual e não deve ser introduzida no corpo do versículo; «de cidade em cidade» também não é exigido pela construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se «o povo» como coletivo singular e evita-se resolver além do texto a natureza exata da transferência.
