  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: pt
  text: Dentre seus irmãos, José tomou cinco homens e os apresentou diante do faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da extremidade de seus irmãos” ou “dentre os melhores de seus irmãos”. A expressão hebraica contém literalmente “da extremidade/ponta de”, mas aqui provavelmente indica que José escolheu cinco dentre seus irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Dentre
  rationale: 'A expressão literalmente envolve a ideia de “extremidade” ou “ponta”, mas, neste contexto, מִן com קָצֶה provavelmente tem sentido partitivo: José tomou cinco do grupo de seus irmãos.'
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: O substantivo אָח no plural com sufixo de terceira pessoa masculina singular refere-se diretamente aos irmãos de José no contexto imediato.
- source_word: לָקַח
  choice: tomou
  rationale: Preserva o sentido comum do verbo לָקַח e, com “dentre”, comunica naturalmente que José escolheu cinco irmãos.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: cinco homens
  rationale: Reproduz de modo direto a construção hebraica de numeral mais substantivo; os homens são identificados pelo contexto como irmãos de José.
- source_word: וַיַּצִּגֵם
  choice: os apresentou
  rationale: O hifil de יָצַג significa colocar ou apresentar alguém diante de outra pessoa; “apresentou” é natural no contexto da corte.
- source_word: לִפְנֵי פַרְעֹה
  choice: diante do faraó
  rationale: Expressa com clareza o sentido de estar perante ou na presença do faraó.
