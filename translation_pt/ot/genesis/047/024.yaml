base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: pt
  text: 'Quando chegar a colheita, vocês darão a quinta parte ao faraó, e os outros quatro quintos[a] serão de vocês: para semear o campo, para o alimento de vocês, para os que vivem em suas casas e para alimentar suas crianças.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “quatro mãos”, expressão que significa as quatro partes restantes, isto é, quatro quintos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Quando houver colheita
  rationale: תְּבוּאָה designa a produção ou colheita; com בְּ neste contexto administrativo, a formulação temporal comunica naturalmente o momento em que a produção é recolhida.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: vocês darão a quinta parte ao faraó
  rationale: חֲמִישִׁית indica uma parte de cinco. O artigo em português torna clara a quota estipulada.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: e as outras quatro partes
  rationale: A expressão hebraica literalmente fala em 'quatro mãos', isto é, quatro porções. 'As outras quatro partes' preserva a imagem de repartição e, após 'a quinta parte', deixa claro que se trata dos quatro quintos restantes.
- source_word: יִהְיֶה לָכֶם
  choice: serão de vocês
  rationale: Expressa de modo direto a posse ou destinação da parte restante.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: para semear o campo
  rationale: O לְ é de finalidade e זֶרַע se refere aqui à semente reservada para o plantio; a forma verbal é mais natural em português.
- source_word: וּלְאָכְלְכֶם
  choice: para o alimento de vocês
  rationale: A construção derivada de אכל indica aquilo que lhes servirá de alimento e integra a lista de finalidades da produção retida.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: para os que vivem em suas casas
  rationale: A expressão relativa aponta para as pessoas que compõem as casas, e não para os bens nelas contidos; esta formulação evita ambiguidade pouco natural em português.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: e para alimentar suas crianças
  rationale: טַף refere-se normalmente às crianças pequenas ou dependentes. 'Crianças' mantém o sentido familiar sem recorrer a linguagem técnica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sintaxe foi ajustada para fluidez, sem alterar a divisão da colheita nem as finalidades enumeradas.
