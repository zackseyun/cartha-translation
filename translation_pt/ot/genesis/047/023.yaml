  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” por clareza na fala dirigida ao povo e mantém “faraó” em minúscula como título. Não se incluiu nota lexical, pois “comprei” expressa adequadamente o sentido contextual de קנה sem eliminar a noção mais ampla de aquisição.
