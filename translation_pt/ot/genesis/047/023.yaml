base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: pt
  text: 'Então José disse ao povo: “Vejam, hoje comprei vocês e as suas terras para o faraó. Aqui está a semente para vocês; semeiem a terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então José disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הָעָם
  choice: ao povo
  rationale: O termo designa coletivamente a população egípcia a quem José se dirige.
- source_word: הֵן
  choice: Vejam
  rationale: A partícula introduz uma declaração enfática e chama a atenção dos ouvintes; o plural concorda com o destinatário coletivo.
- source_word: קָנִיתִי
  choice: comprei
  rationale: Neste contexto econômico e jurídico, קנה indica compra ou aquisição, e “comprei” comunica diretamente a transferência descrita nos versículos anteriores.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: O pronome tem o próprio povo como objeto direto, indicando sua transferência ao serviço do faraó.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Preserva de modo direto a referência temporal da transação.
- source_word: אַדְמַתְכֶם
  choice: as suas terras
  rationale: Refere-se às propriedades agrícolas das pessoas; o plural distributivo soa natural em português ao falar das terras pertencentes ao povo.
- source_word: לְפַרְעֹה
  choice: para o faraó
  rationale: A preposição indica que José realizou a compra em favor do faraó.
- source_word: הֵא
  choice: Aqui está
  rationale: Reproduz a força dêitica da apresentação imediata da semente.
- source_word: זֶרַע
  choice: a semente
  rationale: Designa a semente destinada ao plantio, sentido confirmado pelo verbo seguinte.
- source_word: וּזְרַעְתֶּם
  choice: semeiem
  rationale: No contexto, a forma verbal após a entrega da semente funciona como instrução; o imperativo plural é claro e natural em português.
- source_word: הָאֲדָמָה
  choice: a terra
  rationale: Refere-se ao solo agricultável a ser semeado e mantém a ligação lexical com as terras mencionadas antes.
