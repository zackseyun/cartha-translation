  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: pt
  text: Assim, José comprou para o faraó toda a terra do Egito[a], pois cada egípcio vendeu o seu campo, porque a fome pesava sobre eles[b]; e a terra passou a pertencer ao faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adquiriu para o faraó toda a terra do Egito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a fome era forte sobre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: comprou
  rationale: O Qal de קנה, no contexto explícito da venda dos campos, indica aquisição comercial; “comprou” é direto e natural.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: toda a terra do Egito
  rationale: אַדְמָה designa aqui terras como propriedade agrícola, e não apenas solo ou chão.
- source_word: לְפַרְעֹה
  choice: para o faraó
  rationale: A preposição לְ apresenta o faraó como beneficiário e destinatário da aquisição feita por José.
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: cada egípcio vendeu o seu campo
  rationale: A construção combina o coletivo “egípcios” com אִישׁ distributivo; a formulação portuguesa preserva o sentido de cada proprietário individual.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: a fome pesava sobre eles
  rationale: חזק significa literalmente ser forte ou prevalecer. Com עַל e uma calamidade, “pesava sobre eles” conserva a imagem da pressão exercida pela fome e soa natural em português.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: a terra passou a pertencer ao faraó
  rationale: 'A expressão comunica o resultado jurídico da transação: a terra tornou-se propriedade do faraó.'
