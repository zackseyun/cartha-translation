  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: pt
  text: Assim, Israel se estabeleceu na terra do Egito, na terra de Gósen; eles adquiriram propriedades[a] ali, foram fecundos e se multiplicaram muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabeleceram-se ali” ou “tomaram posse dela”. O verbo hebraico pode indicar a obtenção de posses ou o estabelecimento seguro na terra.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: O verbo ישׁב pode significar sentar-se, habitar ou estabelecer-se. Neste contexto, “se estabeleceu” comunica residência consolidada, não mera permanência temporária.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome empregado no hebraico e preserva a passagem do sujeito singular, Israel/Jacó, para os verbos plurais referentes à sua família.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Preserva o substantivo אֶרֶץ e a ênfase territorial da narrativa.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Reproduz a construção paralela do hebraico e apresenta Gósen como região definida dentro do Egito.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: eles adquiriram propriedades ali
  rationale: O nifal de אחז pode indicar a obtenção de posses ou o estabelecimento firme numa terra. A formulação escolhida expressa o provável sentido contextual sem sugerir conquista militar; a nota registra a amplitude lexical.
- source_word: וַיִּפְרוּ
  choice: foram fecundos
  rationale: Preserva o tema recorrente da fecundidade em Gênesis e mantém uma formulação digna e compreensível.
- source_word: וַיִּרְבּוּ
  choice: se multiplicaram
  rationale: Conserva a conhecida associação entre fecundidade e multiplicação no vocabulário das bênçãos de Gênesis.
- source_word: מְאֹד
  choice: muito
  rationale: Transmite de modo natural e direto a força intensificadora do advérbio hebraico.
theological_decisions:
- issue: Sentido representativo de “Israel”
  choice: Manter “Israel” no singular e deixar que os verbos seguintes no plural se refiram à sua família.
  alternative: Traduzir como “os israelitas” ou substituir “Israel” por “Jacó”.
  rationale: O hebraico começa com “Israel” e um verbo singular, mas passa a verbos plurais. A tradução conserva essa mudança e o modo como o patriarca representa a família da aliança.
- issue: Amplitude de וַיֵּאָחֲזוּ בָהּ
  choice: Usar “adquiriram propriedades ali” no texto e registrar em nota o possível sentido de estabelecimento firme.
  alternative: Traduzir diretamente como “estabeleceram-se ali” ou, mais literalmente, “foram fixados ali”.
  rationale: O contexto favorece a obtenção de posses ou direitos sobre a terra, mas a forma hebraica também admite a ideia de se tornar firmemente estabelecido; a nota evita eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O ponto e vírgula ajuda a conservar a unidade do versículo e, ao mesmo tempo, torna natural a mudança do sujeito singular “Israel” para o plural referente à sua família.
