base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: pt
  text: 'Assim, José estabeleceu isso como estatuto, vigente até hoje, para a terra do Egito: a quinta parte pertence ao Faraó.[a] Apenas a terra dos sacerdotes — e somente ela — não passou a pertencer ao Faraó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um quinto (vinte por cento) da colheita, conforme o acordo do versículo anterior.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: estabeleceu isso como estatuto
  rationale: No contexto jurídico-administrativo, שׂוּם com לְחֹק significa estabelecer uma norma. “Isso” retoma a política descrita no versículo anterior.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: vigente até o dia de hoje
  rationale: A expressão indica que o estatuto continuava em vigor no tempo do narrador; “vigente” explicita naturalmente essa relação sem alterar seu alcance temporal.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: para as terras do Egito
  rationale: A preposição עַל indica aqui o âmbito de aplicação do estatuto. O plural natural em português representa o singular coletivo hebraico referente às terras agrícolas egípcias.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: a quinta parte pertence ao faraó
  rationale: A frase hebraica condensada define a parcela destinada ao faraó. “A quinta parte” preserva a forma definida e comunica com clareza a proporção.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: Apenas as terras dos sacerdotes, e só elas
  rationale: “Apenas” traduz רַק, enquanto “e só elas” preserva a ênfase adicional de לְבַדָּם sem produzir uma repetição pouco natural.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: não passaram a pertencer ao faraó
  rationale: No contexto da transferência das terras para o faraó, היה + ל descreve o estado resultante; a formulação indica que as terras sacerdotais foram a exceção à transferência.
