  naturalness: A formulação atual é compreensível, mas “para as terras do Egito” e “vigente até o dia de hoje” soam menos naturais do que “para a terra do Egito” e “vigente até hoje”. A redação revisada também torna a exceção enfática mais fluida.
  terminology: “Estatuto” é apropriado para חֹק; “um quinto”/“a quinta parte” expressa adequadamente לַחֹמֶשׁ. “Faraó”, com maiúscula, segue o uso bíblico português para o título referente ao governante egípcio nesta narrativa.
