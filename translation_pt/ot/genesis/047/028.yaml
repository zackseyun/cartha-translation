base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: pt
  text: Jacó viveu na terra do Egito dezessete anos, e os dias de Jacó, os anos de sua vida,[a] foram cento e quarenta e sete anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “os dias de Jacó, os anos de sua vida” refere-se à duração total de sua vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: viveu
  rationale: O wayyiqtol de חיה indica que Jacó continuou vivo durante o período mencionado; “viveu” é a forma direta e natural em português.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva o substantivo אֶרֶץ (“terra”), presente explicitamente no hebraico, em formulação clara e tradicional.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: dezessete anos
  rationale: Equivalente numérico padrão e natural em português.
- source_word: וַיְהִי
  choice: foram
  rationale: Neste resumo da duração total da vida, “foram” expressa naturalmente o valor do hebraico sem introduzir sentido adicional.
- source_word: יְמֵי יַעֲקֹב
  choice: os dias de Jacó
  rationale: Preserva a imagem e o modo de expressão hebraico, em vez de reduzi-lo simplesmente a “a vida de Jacó”.
- source_word: שְׁנֵי חַיָּיו
  choice: os anos de sua vida
  rationale: Mantém a expressão apositiva que esclarece “os dias de Jacó” e reproduz a estrutura do texto-fonte de modo compreensível.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: cento e quarenta e sete anos
  rationale: Reordena a sequência numérica hebraica conforme o uso normal do português, preservando exatamente o total.
