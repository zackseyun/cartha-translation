source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: pt
  text: 'E Jacó disse ao faraó: “Os dias dos anos da minha permanência como estrangeiro[a] são cento e trinta anos. Poucos e difíceis têm sido os dias dos anos da minha vida[b], e não alcançaram os dias dos anos de vida de meus antepassados, nos dias em que eles viveram como estrangeiros.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha peregrinação”. O termo hebraico se refere à vida de quem reside temporariamente como estrangeiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “Os dias dos anos da minha vida têm sido poucos e maus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: minha permanência como estrangeiro / viveram como estrangeiros
  rationale: O termo designa residência temporária, especialmente a condição de estrangeiro residente. A formulação preserva o tema patriarcal sem introduzir a ideia mais interpretativa de peregrinação.
- source_word: יְמֵי שְׁנֵי
  choice: os dias dos anos de
  rationale: Mantém a repetição solene do hebraico, embora incomum em português, em vez de reduzi-la simplesmente a “os anos” ou “o tempo de vida”.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cento e trinta anos
  rationale: Forma numérica natural e exata em português contemporâneo.
- source_word: מְעַט וְרָעִים
  choice: poucos e difíceis
  rationale: “Poucos” preserva a comparação da duração da vida; neste contexto, רָעִים caracteriza dias marcados por adversidade, de modo que “difíceis” evita sugerir maldade moral dos dias.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: minha vida / a vida de meus pais
  rationale: Expressa naturalmente o período de vida. O singular coletivo “a vida de meus pais” é idiomático em português e corresponde às existências comparadas.
- source_word: הִשִּׂיגוּ
  choice: não chegaram a
  rationale: O verbo pode significar alcançar, atingir ou chegar a. Aqui indica que a duração da vida de Jacó não igualou a de seus antepassados.
- source_word: אֲבֹתַי
  choice: meus pais
  rationale: Traduz diretamente o termo hebraico e, no contexto, refere-se aos antepassados patriarcais de Jacó.
theological_decisions:
- issue: Autodescrição patriarcal como estrangeiro residente
  choice: permanência como estrangeiro
  alternative: peregrinação
  rationale: O hebraico salienta a condição histórica dos patriarcas como residentes temporários e estrangeiros, sem explicitar uma leitura espiritual de peregrinação.
- issue: Sentido de רָעִים aplicado aos dias da vida
  choice: difíceis
  alternative: maus
  rationale: O contexto fala das adversidades vividas por Jacó, não de culpa moral. “Difíceis” comunica esse sentido sem apagar a avaliação negativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se deliberadamente a repetição hebraica “dias dos anos”, enquanto “permanência como estrangeiro” torna inteligível uma ideia para a qual o português não possui equivalente nominal corrente tão conciso quanto o hebraico.
