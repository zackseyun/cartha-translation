  text: וַ/יֹּ֗אמֶר הִשָּֽׁבְעָ/ה֙ לִ֔/י וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַ/מִּטָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: pt
  text: 'Ele disse: “Jure-me.” E José lhe jurou. Então Israel curvou-se sobre a cabeceira da cama.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre a ponta do cajado”. As consoantes hebraicas também podem ser lidas desse modo; esse é o sentido refletido na Septuaginta e em Hebreus 11:21.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Jure-me isso
  rationale: Expressa de modo natural e direto em português a ordem para que José confirme sob juramento o pedido anterior; “isso” explicita apenas o referente já presente no contexto.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: E José lhe jurou
  rationale: Mantém a repetição do verbo de juramento. O sujeito José, embora implícito no hebraico, é explicitado em português para evitar ambiguidade.
- source_word: וַיִּשְׁתַּחוּ
  choice: se curvou
  rationale: Preserva o gesto corporal sem determinar que o verbo signifique aqui explicitamente “adorou” ou sem exigir a prostração completa sugerida por “se prostrou”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Conserva a designação pessoal usada no texto hebraico, sem harmonizá-la com “Jacó”.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: junto à cabeceira da cama
  rationale: Traduz idiomaticamente a localização indicada pela frase hebraica, entendendo רֹאשׁ como a parte superior ou cabeceira e הַמִּטָּה conforme a vocalização massorética, “a cama”.
theological_decisions:
- issue: A vocalização massorética lê הַמִּטָּה como “a cama”, enquanto as mesmas consoantes permitem a leitura “o cajado”, refletida na Septuaginta e em Hebreus 11:21.
  choice: cama
  alternative: cajado
  rationale: O texto principal segue a vocalização da WLC e o sentido contextual imediato. A leitura alternativa, textualmente possível e canonicamente relevante, é preservada em nota sem eliminar a tensão entre as testemunhas.
- issue: O verbo וַיִּשְׁתַּחוּ pode indicar tanto um gesto de inclinação quanto adoração.
  choice: se curvou
  alternative: adorou
  rationale: Como o complemento não identifica explicitamente Deus como objeto, a tradução principal conserva o gesto observável e não resolve além do hebraico sua possível dimensão religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “Jure-me isso” mantém a concisão do diálogo; “junto à cabeceira da cama” evita a formulação pouco natural “sobre a cabeça da cama”.
