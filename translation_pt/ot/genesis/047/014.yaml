  text: וַ/יְלַקֵּ֣ט יוֹסֵ֗ף אֶת כָּל הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֤א בְ/אֶֽרֶץ מִצְרַ֨יִם֙ וּ/בְ/אֶ֣רֶץ כְּנַ֔עַן בַּ/שֶּׁ֖בֶר אֲשֶׁר הֵ֣ם שֹׁבְרִ֑ים וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת הַ/כֶּ֖סֶף בֵּ֥יתָ/ה פַרְעֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: pt
  text: José recolheu toda a prata[a] que havia na terra do Egito e na terra de Canaã, em pagamento pelo cereal que compravam, e levou a prata para a casa do faraó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o dinheiro”. O hebraico diz literalmente “toda a prata”, mencionando o metal usado como meio de pagamento.
    reason: lexical_alternative
  - marker: b
    text: “Casa do faraó” pode indicar não apenas a residência real, mas também, em sentido mais amplo, a administração doméstica ou o tesouro do faraó.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: recolheu
  rationale: O verbo לקט indica reunir ou coletar. “Recolheu” comunica de modo natural a acumulação da prata recebida nas diversas transações.
- source_word: כָּל הַכֶּסֶף
  choice: toda a prata
  rationale: כֶּסֶף designa literalmente “prata” e, por extensão, dinheiro. O texto principal mantém a imagem concreta do metal usado como meio de pagamento.
- source_word: הַנִּמְצָא
  choice: que havia
  rationale: O particípio de מצא descreve a prata que se encontrava ou estava disponível nesses territórios. “Que havia” é idiomático em português e conserva esse sentido.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: na terra do Egito e na terra de Canaã
  rationale: Mantém a formulação geográfica explícita e repetida do hebraico.
- source_word: בַּשֶּׁבֶר
  choice: em pagamento pelo cereal
  rationale: שֶׁבֶר, neste contexto da fome, refere-se ao cereal comercializado. A preposição indica que a prata era recebida em troca dele.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: que compravam
  rationale: O verbo שבר é o termo contextual para comprar cereal, e o particípio indica uma atividade em curso ou repetida.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: levou a prata para a casa do faraó
  rationale: A terminação direcional em בֵּיתָה indica movimento para a casa de faraó. “Casa” preserva a amplitude do termo, que pode abranger residência, domicílio real ou tesouro.
theological_decisions: []
