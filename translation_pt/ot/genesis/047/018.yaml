base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: pt
  text: 'Quando aquele ano terminou, eles vieram a José no segundo ano e lhe disseram: “Não esconderemos de meu senhor que o dinheiro[a] acabou e o gado pertence a meu senhor. Nada nos resta diante de meu senhor, a não ser nossos corpos[b] e nossas terras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a prata”. Em hebraico, “prata” é frequentemente usada no sentido de dinheiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossas pessoas”. O hebraico diz literalmente “nossos corpos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Quando aquele ano terminou
  rationale: תמם indica chegar ao fim ou completar-se; a formulação é natural em português e preserva a referência explícita a “aquele ano”.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: no segundo ano
  rationale: Mantém a formulação do hebraico, sem explicitar como “ano seguinte” uma relação temporal que o contexto apenas sugere.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Não esconderemos de meu senhor
  rationale: כחד no piel significa esconder ou ocultar. A primeira pessoa singular de “meu senhor”, embora dita por um grupo, reproduz a forma deferente do hebraico.
- source_word: תַּם הַכֶּסֶף
  choice: o dinheiro acabou
  rationale: Embora כֶּסֶף designe literalmente “prata”, neste contexto funciona como meio de pagamento; “o dinheiro acabou” expressa com clareza o esgotamento dos recursos.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: e os rebanhos já pertencem a meu senhor
  rationale: מִקְנֵה הַבְּהֵמָה refere-se às posses em animais. A construção אֶל אֲדֹנִי indica que elas passaram ao domínio de José; “já pertencem” torna essa relação idiomática em português.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Nada nos resta diante de meu senhor
  rationale: נשאר exprime aquilo que permanece ou resta. “Diante de meu senhor” conserva a imagem relacional de לִפְנֵי, enquanto “nos” deixa claro quem já não possui outros recursos.
- source_word: בִּלְתִּי אִם
  choice: a não ser
  rationale: A combinação introduz uma exceção e é expressa naturalmente em português por “a não ser”.
- source_word: גְּוִיָּתֵנוּ
  choice: nossos corpos
  rationale: גְּוִיָּה pode indicar corpo ou pessoa física. “Corpos” preserva a concretude do hebraico e o contraste econômico com as terras.
- source_word: אַדְמָתֵנוּ
  choice: nossas terras
  rationale: אֲדָמָה designa o solo ou a terra possuída e cultivada; o plural idiomático “terras” comunica aqui a propriedade fundiária das famílias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservou-se o tratamento deferente singular “meu senhor” e a expressão “no segundo ano”, evitando resolver além do texto a relação cronológica. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
