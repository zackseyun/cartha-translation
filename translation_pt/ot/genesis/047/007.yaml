  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: pt
  text: Então José trouxe seu pai Jacó e o apresentou diante do faraó; e Jacó abençoou o faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abençoou” pode incluir uma bênção formal pronunciada, e não apenas uma saudação cortês.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: trouxe
  rationale: 'O hifil de בוא tem força causativa: José fez Jacó entrar na presença do faraó. Em português, “trouxe” expressa isso com naturalidade no contexto.'
- source_word: אָבִיו
  choice: seu pai
  rationale: Designação filial direta; o sufixo de terceira pessoa masculina singular se refere a José.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: o apresentou diante de
  rationale: Literalmente, o hifil de עמד significa “fez ficar de pé”. No contexto de uma audiência real, “apresentou diante de” preserva o caráter formal da cena sem produzir uma formulação rígida.
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: ברך tem como sentido normal “abençoar”. A tradução mantém a ação de Jacó em seu sentido pleno, sem reduzi-la a uma saudação cortês.
- source_word: פַרְעֹה
  choice: faraó
  rationale: Forma tradicional e amplamente compreendida em português para o título real egípcio.
theological_decisions:
- issue: Sentido da ação de Jacó para com o faraó
  choice: Jacó abençoou de fato o faraó
  alternative: Jacó apenas saudou cortesmente o faraó
  rationale: O sentido comum de ברך é “abençoar”. A formulação conserva a tensão do patriarca pronunciando uma bênção sobre o poderoso rei, sem enfraquecer o verbo para “saudar”.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Diante do faraó” mantém o ambiente formal da corte. O ponto e vírgula evita uma sequência pesada de coordenações. A alternativa literal de “o fez ficar de pé diante do faraó” não foi incluída em nota por não alterar substancialmente o sentido no contexto.
