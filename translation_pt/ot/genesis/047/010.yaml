lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: abençoou
  rationale: O verbo ברך normalmente significa “abençoar”. No contexto de uma audiência real, pode também abranger uma saudação formal ou uma despedida cortês; contudo, o sentido lexical usual é preferível e mantém a correspondência com a ocorrência do versículo 7.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico יעקב.
- source_word: אֶת
  choice: '[marca de objeto direto, não traduzida]'
  rationale: A marca hebraica de objeto direto definido não possui equivalente explícito necessário em português.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa convencional do título real; o artigo definido é natural em português.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: יצא expressa concretamente o ato de sair; “saiu” é conciso, natural e apropriado ao encerramento da audiência.
- source_word: מִלִּפְנֵי
  choice: da presença dele
  rationale: O hebraico significa literalmente “de diante de”. A formulação escolhida comunica com naturalidade que Jacó deixou a presença do faraó, evitando repetir o título na mesma frase.
