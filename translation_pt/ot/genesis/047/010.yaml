  language: pt
  text: Então Jacó abençoou o faraó e saiu da presença dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saudou o faraó” / “despediu-se do faraó”. O verbo hebraico geralmente significa “abençoou”, mas, no contexto de uma audiência real, também pode abranger uma saudação formal ou uma despedida.
