    rationale: A expressão לְפִי הַטָּף, literalmente “segundo a boca das crianças”, aponta primariamente para uma medida conforme o número dos pequenos. Necessidades ou consumo podem estar implicados, mas não devem substituir sem ressalva a referência quantitativa.
  - severity: low
