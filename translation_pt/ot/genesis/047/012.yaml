base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: pt
  text: José sustentou seu pai, seus irmãos e todos os membros da casa de seu pai com alimento, conforme o número das crianças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo a boca das crianças”; isto é, conforme o número delas, possivelmente levando em conta o que necessitavam para comer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: sustentou
  rationale: O piel de כלכל indica sustentar ou prover materialmente. “Sustentou” expressa com naturalidade o cuidado contínuo de José durante a fome, enquanto “fornecendo-lhes alimento” explicita o meio desse sustento.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, neste contexto de abastecimento durante a fome designa alimento ou provisões em sentido amplo.
- source_word: כָּל בֵּית אָבִיו
  choice: toda a família de seu pai
  rationale: בֵּית, “casa”, refere-se aqui ao grupo familiar, não ao edifício. “Família” é claro e corrente em português, sem sugerir apenas a residência.
- source_word: לְפִי הַטָּף
  choice: de acordo com as necessidades das crianças
  rationale: A expressão significa literalmente “segundo a boca das crianças”. O sentido provável é que a provisão era ajustada ao consumo ou às necessidades dos pequenos; esta formulação preserva melhor essa nuance do que tornar explícito apenas o número deles.
- source_word: הַטָּף
  choice: as crianças
  rationale: טַף designa as crianças pequenas ou os pequenos dependentes das famílias. “As crianças” é natural e suficientemente preciso no português atual.
- source_word: אָבִיו ... אֶחָיו
  choice: seu pai, seus irmãos
  rationale: Os termos de parentesco são diretos, e “irmãos” corresponde aos filhos homens de Jacó presentes no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita a repetição pouco natural de “prover ... com alimento” e mantém a ideia de sustento material contínuo. A nota preserva a imagem hebraica e a ambiguidade entre número e necessidade.
