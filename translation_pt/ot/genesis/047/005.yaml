  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה אֶל יוֹסֵ֖ף לֵ/אמֹ֑ר אָבִ֥י/ךָ וְ/אַחֶ֖י/ךָ בָּ֥אוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/005.yaml
  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: pt
  text: 'Então o faraó disse a José[a]: “Seu pai e seus irmãos vieram até você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “E o faraó disse a José, dizendo: ‘Seu pai e seus irmãos vieram até você.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então ... disse” comunica naturalmente a sequência em português moderno.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa consagrada para o título do rei do Egito; o artigo é natural neste contexto narrativo.
- source_word: אֶל
  choice: a
  rationale: Marca o destinatário da fala; em “disse a José”, esta é a regência natural em português.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma portuguesa tradicional do nome hebraico יוֹסֵף.
- source_word: לֵאמֹר
  choice: não explicitado no texto principal
  rationale: Depois de “disse”, a fórmula hebraica de introdução do discurso seria redundante em português natural; sua forma mais literal é registrada na nota.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Reproduz diretamente o possessivo de segunda pessoa dirigido a José.
- source_word: וְאַחֶיךָ
  choice: e seus irmãos
  rationale: Mantém o termo masculino específico “irmãos”, sem generalizá-lo como “família”.
- source_word: בָּאוּ
  choice: vieram
  rationale: O perfeito hebraico apresenta a chegada como concluída. O pretérito perfeito é idiomático e preserva o valor básico; “chegaram” também seria possível no contexto.
- source_word: אֵלֶיךָ
  choice: até você
  rationale: Expressa movimento em direção a José de modo claro e corrente, sem acrescentar a ideia de “aqui”, ausente do hebraico.
theological_decisions: []
