  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be slaves to Pharaoh.”
translation:
  language: pt
  text: 'E eles disseram: “O senhor nos manteve vivos. Que encontremos favor aos olhos do meu senhor, e seremos escravos do faraó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E eles disseram
  rationale: O waw consecutivo dá continuidade à narrativa; a formulação preserva esse fluxo de modo natural em português.
- source_word: הֶחֱיִתָנוּ
  choice: O senhor nos manteve vivos
  rationale: O hifil de חיה tem sentido causativo, ‘fazer viver, conservar com vida’. A tradução evita ampliar o verbo para uma noção espiritual ou militar de salvação. O tratamento ‘o senhor’ torna explícito em português o sujeito de segunda pessoa e mantém a deferência ao interlocutor.
- source_word: נִמְצָא חֵן
  choice: Que encontremos favor
  rationale: O yiqtol de primeira pessoa do plural funciona aqui como pedido volitivo. ‘Que encontremos favor’ conserva esse valor sem o transformar em afirmação de favor já recebido.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: aos olhos do meu senhor
  rationale: Mantém de forma inteligível o idioma hebraico de obter favor e preserva o sufixo singular de tratamento deferente, dirigido provavelmente a José.
- source_word: וְהָיִינוּ
  choice: e seremos
  rationale: Nesse contexto, o perfeito com conjunção exprime o compromisso resultante assumido pelos falantes; o futuro é natural em português.
- source_word: עֲבָדִים
  choice: escravos
  rationale: No contexto da entrega dos egípcios ao domínio do faraó em troca de sobrevivência, o vínculo compulsório é saliente. ‘Escravos’ expressa melhor essa condição do que o termo mais amplo ‘servos’.
- source_word: לְפַרְעֹה
  choice: do faraó
  rationale: Com ‘escravos’, a construção possessiva é idiomática em português e comunica a relação de submissão ou pertença marcada por לְ.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Emprega ‘faraó’ em minúscula como título e mantém a expressão semítica transparente ‘aos olhos do meu senhor’. A coexistência de ‘o senhor’ e ‘meu senhor’ reproduz a referência pessoal e a deferência do hebraico, embora possa soar repetitiva em português.
