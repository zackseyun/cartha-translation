    issue: «no lugar onde eles foram sepultados» não traduz diretamente o substantivo «seu local de sepultamento».
    rationale: O hebraico בִּקְבֻרָתָם designa o local/sepultura deles. A redação atual é compreensível, mas desloca o foco para o fato de os antepassados terem sido sepultados ali. Uma expressão nominal preserva melhor a construção e a relação possessiva.
  - severity: low
    issue: «Ele respondeu» é mais interpretativo que «Ele disse».
    rationale: וַיֹּאמֶר é simplesmente «e ele disse». Embora a fala seja uma resposta no contexto, «Ele disse» conserva melhor o fluxo narrativo hebraico.
  - severity: low
