  naturalness: O português é claro, moderno e de registro apropriado. «Antepassados», «para fora do Egito» e «sepulte-me» soam naturais. «No local de sepultamento dos meus antepassados» é igualmente claro e mais próximo do hebraico.
  terminology: «Antepassados» comunica adequadamente אֲבֹתַי neste contexto. A nota sobre a expressão idiomática é equilibrada e não lhe impõe um sentido teológico. «Local de sepultamento» mantém a abrangência de קְבֻרָה, sem especificar indevidamente «túmulo» ou «sepultura».
  issues:
