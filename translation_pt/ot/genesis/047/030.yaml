base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: pt
  text: '“Quando eu me deitar com os meus antepassados[a], leve-me para fora do Egito e sepulte-me no local de sepultamento dos meus antepassados[b].” Ele disse: “Farei como você disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “deitar-se com os antepassados” é uma forma tradicional associada à morte e ao sepultamento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na sepultura deles” ou “no túmulo deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Quando eu me deitar
  rationale: Mantém a imagem hebraica de ‘deitar-se’, usada aqui no contexto da morte e do sepultamento, enquanto ‘quando’ expressa naturalmente em português o valor temporal da conjunção.
- source_word: עִם אֲבֹתַי
  choice: com os meus antepassados
  rationale: אֲבֹתַי refere-se aos antepassados de Jacó. ‘Antepassados’ evita que ‘pais’ seja entendido apenas como pai e mãe, sem perder o sentido familiar.
- source_word: וּנְשָׂאתַנִי
  choice: leve-me
  rationale: Neste contexto funerário, נשׂא indica transportar o corpo. ‘Leve-me’ é natural em português e, com ‘para fora do Egito’, comunica claramente esse movimento.
- source_word: מִמִּצְרַיִם
  choice: para fora do Egito
  rationale: Expressa a retirada do corpo da terra do Egito, conforme o sentido contextual da preposição מן.
- source_word: וּקְבַרְתַּנִי
  choice: sepulte-me
  rationale: קבר significa diretamente ‘sepultar’; a escolha mantém um registro digno e corrente.
- source_word: בִּקְבֻרָתָם
  choice: no lugar onde eles foram sepultados
  rationale: Reproduz o sentido de lugar de sepultamento sem determinar indevidamente se era cova, sepultura ou túmulo.
- source_word: וַיֹּאמַר
  choice: Ele respondeu
  rationale: Embora literalmente seja ‘e ele disse’, ‘respondeu’ representa com naturalidade a função da fala de José no diálogo.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Farei
  rationale: A forma verbal na primeira pessoa já identifica e pode realçar o sujeito em português; a promessa firme é preservada sem uma ênfase artificial.
- source_word: כִדְבָרֶךָ
  choice: como você pediu
  rationale: Literalmente, ‘conforme a sua palavra’. No contexto, trata-se do pedido de Jacó; esta formulação é natural e preserva a ideia de compromisso em cumpri-lo.
theological_decisions:
- issue: A expressão deitar-se com os antepassados
  choice: Conservar a imagem de ‘deitar-se’ no texto
  alternative: Traduzir diretamente por ‘morrer’ ou ‘descansar’
  rationale: O hebraico associa morte e sepultamento sem reduzir explicitamente a expressão a uma definição teológica; conservar a imagem mantém sua abertura e seu caráter idiomático.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. ‘Antepassados’ é preferido a ‘pais’ para evitar ambiguidade familiar moderna; a imagem funerária do hebraico é mantida e explicada em nota.
