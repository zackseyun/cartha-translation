- from: '“Quando eu me deitar com os meus antepassados[a], leve-me para fora do Egito e sepulte-me no lugar onde eles foram sepultados[b].” Ele respondeu: “Farei como você pediu.”'
  to: '“Quando eu me deitar com os meus antepassados[a], leve-me para fora do Egito e sepulte-me no local de sepultamento dos meus antepassados[b].” Ele disse: “Farei como você disse.”'
