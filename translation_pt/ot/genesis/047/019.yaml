base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be slaves to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: pt
  text: Por que haveríamos de morrer diante dos seus olhos[a], tanto nós quanto a nossa terra? Compre a nós e a nossa terra em troca de pão[b], e nós e a nossa terra seremos escravos[c] do faraó. Dê-nos sementes, para que vivamos e não morramos, e a terra não fique desolada[d].[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua vista”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em troca de alimento”; literalmente, “por pão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “servos”. O termo hebraico pode indicar diferentes formas de servidão; aqui, destaca-se a sujeição econômica.
    reason: lexical_alternative
  - marker: d
    text: Ou “seja devastada”.
    reason: lexical_alternative
  - marker: e
    text: 'Também se pode traduzir: “para que vivamos e não morramos, e para que a terra não fique desolada”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Por que haveríamos de morrer
  rationale: Reproduz a força de apelo da pergunta retórica e o valor modal do imperfeito nesse contexto.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus olhos
  rationale: Preserva a imagem concreta do idioma hebraico e comunica que isso ocorreria na presença de José.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: tanto nós quanto a nossa terra
  rationale: Expressa de modo natural em português a correlação enfática entre o povo e sua terra.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Compre a nós e a nossa terra
  rationale: Mantém sem atenuação a linguagem comercial extrema provocada pela fome.
- source_word: בַּלָּחֶם
  choice: em troca de pão
  rationale: Explicita o valor de troca da preposição e conserva o substantivo concreto 'pão'.
- source_word: עֲבָדִים
  choice: escravos
  rationale: O contexto econômico-jurídico envolve sujeição e perda de liberdade; 'escravos' comunica isso melhor que o termo mais brando 'servos'.
- source_word: וְנִהְיֶה
  choice: seremos
  rationale: O imperfeito ligado à proposta expressa o resultado previsto da compra.
- source_word: לְפַרְעֹה
  choice: do faraó
  rationale: Em português, a construção possessiva exprime naturalmente a sujeição indicada pela preposição hebraica.
- source_word: וְתֶן זֶרַע
  choice: Dê-nos sementes
  rationale: O pronome indireto está implícito no contexto, e o plural português representa naturalmente o coletivo agrícola hebraico.
- source_word: תֵשָׁם
  choice: fique desolada
  rationale: Comunica a ideia de a terra tornar-se improdutiva e abandonada sem restringir indevidamente o alcance do verbo.
theological_decisions:
- issue: Natureza da sujeição ao faraó
  choice: escravos
  alternative: servos
  rationale: A tradução mantém o peso social e econômico do texto, sem suavizar a condição proposta nem definir além do que o contexto permite sua forma jurídica exata.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a imagem vívida de 'diante dos seus olhos', a dureza de 'compre a nós' e a coordenação incomum entre o povo e a terra, sem eliminar a tensão do original.
