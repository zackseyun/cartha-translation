base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: pt
  text: 'Faraó perguntou aos irmãos dele: “Qual é a ocupação de vocês?[a]” Eles responderam a Faraó: “Os teus servos são pastores de rebanhos[b], tanto nós como os nossos pais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Qual é o trabalho de vocês?”
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pastores de rebanhos”; isto é, homens que cuidam de ovelhas e cabras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Qual é a ocupação de vocês?
  rationale: מַעֲשֶׂה pode indicar trabalho, atividade ou ocupação. No contexto da corte, Faraó pergunta pela profissão deles; “ocupação” conserva esse sentido vocacional em português atual.
- source_word: רֹעֵה צֹאן
  choice: pastores de rebanhos
  rationale: A expressão participial identifica homens que cuidam de צֹאן, isto é, rebanhos de animais de pequeno porte, especialmente ovelhas e cabras. A formulação conserva os dois elementos do hebraico sem restringir o rebanho apenas a ovelhas.
- source_word: עֲבָדֶיךָ
  choice: Os teus servos
  rationale: Embora עֶבֶד possa designar servo ou escravo, aqui funciona como autodesignação respeitosa diante de Faraó; “servos” reproduz adequadamente a linguagem de deferência.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: tanto nós como os nossos pais
  rationale: A construção repetida גַּם...גַּם ressalta a continuidade entre gerações. “Tanto... como...” preserva o paralelismo e soa natural em português.
- source_word: אֶל אֶחָיו
  choice: aos irmãos dele
  rationale: Mantém a referência pronominal do hebraico, cujo antecedente contextual é José, sem substituir o pronome pelo nome no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com tratamento plural brasileiro (“vocês”) na pergunta e a fórmula cortesã tradicional “os teus servos” na resposta. A ordem e o paralelismo do hebraico foram preservados sem produzir uma construção excessivamente rígida.
