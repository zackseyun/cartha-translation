base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: pt
  text: 'Então José foi à presença do faraó e lhe informou: “Meu pai e meus irmãos chegaram da terra de Canaã com seus rebanhos, seu gado e tudo o que possuem; e agora[a] estão na terra de Gósen.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “e eis que estão”, expressão que chama a atenção para a presença deles naquele lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi à presença
  rationale: בוא pode significar vir, ir ou entrar. No contexto da audiência com o faraó, “foi à presença” expressa com naturalidade o movimento de José até o governante, sem exigir que o leitor adote a perspectiva espacial do narrador.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: 'lhe informou:'
  rationale: A sequência hebraica usa dois verbos, literalmente “informou ao faraó e disse”. Em português, um único verbo seguido da fala direta evita redundância sem perder a função comunicativa da fórmula narrativa.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: com seus rebanhos, seu gado
  rationale: צאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras, enquanto בקר se refere ao gado bovino. “Rebanhos” e “gado” mantêm a distinção de forma clara e corrente.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: e tudo o que possuem
  rationale: A expressão abrange todos os bens pertencentes a eles. “Tudo o que possuem” é natural em português e conserva o sentido abrangente.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: chegaram da terra de Canaã
  rationale: O perfeito hebraico apresenta a chegada como concluída e relevante para a situação presente. O pretérito perfeito português comunica isso naturalmente; “chegaram” também explicita o resultado contextual de בוא.
- source_word: וְהִנָּם
  choice: e agora estão
  rationale: הנה com sufixo pronominal chama a atenção para a presença atual deles. “Agora estão” transmite essa força dêitica em português moderno; a forma mais literal é registrada em nota.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Mantém o substantivo geográfico explícito אֶרֶץ e emprega a forma portuguesa consagrada “Gósen”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. A construção “foi à presença do faraó” adequa o verbo de movimento ao cenário de corte; “lhe informou” evita reproduzir de modo artificial a duplicação idiomática hebraica “informou... e disse”. O marcador de nota [a] aparece no texto principal.
