base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: pt
  text: 'Quando se aproximaram os dias da morte de Israel, ele chamou seu filho José e lhe disse: “Se encontrei favor a seus olhos, por favor, ponha a mão debaixo da minha coxa[a] e trate-me com amor leal e fidelidade[b]. Por favor, não me sepulte no Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ponha a mão debaixo da minha coxa” refere-se a um gesto usado ao prestar um juramento solene nas narrativas patriarcais; compare Gênesis 24:2.
    reason: cultural_note
  - marker: b
    text: 'Ou: “bondade e verdade” ou “lealdade e fidelidade”. O par hebraico חֶסֶד וֶאֱמֶת expressa bondade leal e confiável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Quando se aproximaram os dias de Israel morrer
  rationale: Preserva a imagem hebraica dos dias que se aproximam e mantém Israel, o nome empregado no texto, sem perder a compreensão em português.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: seu filho José
  rationale: José é a forma portuguesa tradicional, clara e amplamente reconhecida do nome hebraico יוֹסֵף.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Se achei favor aos seus olhos
  rationale: Reproduz de modo inteligível a fórmula hebraica de cortesia e conserva sua imagem idiomática.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: por favor, ponha a mão debaixo da minha coxa
  rationale: Mantém o gesto concreto do juramento patriarcal; a nota esclarece seu valor cultural.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: trate-me com amor leal e fidelidade
  rationale: O verbo com עִם descreve a maneira de agir para com alguém. A combinação escolhida comunica a bondade comprometida de חֶסֶד e a confiabilidade de אֱמֶת sem acrescentar explicitamente 'aliança', termo ausente da frase.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Por favor, não me sepulte no Egito
  rationale: Expressa naturalmente em português o pedido negativo e o tom suplicante de נָא.
theological_decisions:
- issue: Sentido de חֶסֶד וֶאֱמֶת no pedido solene
  choice: amor leal e fidelidade
  alternative: bondade e verdade; lealdade e fidelidade
  rationale: A tradução conserva tanto o afeto comprometido quanto a confiabilidade prática do par hebraico, sem restringi-lo a uma formulação doutrinária única.
- issue: Gesto de pôr a mão debaixo da coxa
  choice: manter literalmente no texto e explicar em nota
  alternative: parafrasear como “jure-me”
  rationale: A forma concreta integra a narrativa e pode ser preservada sem resolver além do texto a natureza exata ou o simbolismo do gesto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de tratamento brasileiras amplamente compreensíveis. Conserva-se a imagem hebraica dos dias que se aproximam e o gesto culturalmente marcado; notas breves esclarecem sem substituir o texto.
