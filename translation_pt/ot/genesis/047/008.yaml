  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: pt
  text: 'E o faraó disse a Jacó: “Quantos são os dias dos anos da sua vida?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão formal do hebraico; em português corrente, o sentido é: “Qual é a sua idade?”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... perguntou
  rationale: A forma narrativa faz a cena avançar. Embora o verbo seja literalmente “disse”, em português “perguntou” expressa naturalmente a função da fala interrogativa sem alterar seu conteúdo.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: אֶל יַעֲקֹב
  choice: a Jacó
  rationale: A preposição indica o destinatário da fala; “a Jacó” é uma formulação natural e fiel em português.
- source_word: כַּמָּה
  choice: Quantos são
  rationale: Introduz uma pergunta quantitativa ligada aos dias e anos contáveis.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: os dias dos anos da sua vida
  rationale: Preserva a expressão hebraica formal e sua estrutura em camadas, em vez de reduzi-la no texto principal a uma simples pergunta pela idade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação incomum da pergunta foi mantida para refletir o idioma hebraico, enquanto a nota oferece o equivalente corrente. O tratamento respeitoso “o senhor” aparece apenas na paráfrase da nota, adequado à situação entre o faraó e o idoso Jacó.
