  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: pt
  text: Então eles levaram seus animais a José, e José lhes deu pão em troca dos cavalos, dos rebanhos de ovelhas e cabras, das manadas de gado e dos jumentos. Naquele ano, ele os sustentou[a] com pão em troca de todos os seus animais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “os conduziu com pão”. O verbo hebraico pode significar “conduzir”, “guiar” ou “administrar”; neste contexto, provavelmente se refere a sustentar ou abastecer o povo durante a fome.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: seus animais / todos os seus animais
  rationale: O substantivo abrange os animais domésticos possuídos pelo povo, e não somente o gado bovino. “Animais” é amplo, claro e natural no contexto, enquanto a enumeração seguinte especifica as categorias.
- source_word: לֶחֶם
  choice: pão
  rationale: Embora o termo possa designar alimento em sentido mais amplo, “pão” preserva a repetição lexical e comunica a provisão básica de sustento durante a fome.
- source_word: בַּסּוּסִים
  choice: em troca dos cavalos
  rationale: A preposição ב marca aqui o bem entregue como pagamento. Tornar explícita a troca evita uma leitura instrumental ou locativa.
- source_word: מִקְנֵה הַצֹּאן
  choice: rebanhos de ovelhas e cabras
  rationale: צֹאן é um coletivo que pode incluir tanto ovelhas como cabras. A formulação explicita essa abrangência sem reduzi-la apenas a ovelhas.
- source_word: מִקְנֵה הַבָּקָר
  choice: manadas de gado
  rationale: A expressão designa coletivamente os animais de criação de maior porte, sobretudo bovinos. “Manadas de gado” distingue essa categoria dos rebanhos de ovelhas e cabras.
- source_word: חֲמֹרִים
  choice: jumentos
  rationale: “Jumentos” é um equivalente moderno, claro e amplamente compreensível.
- source_word: וַיְנַהֲלֵם
  choice: ele os sustentou
  rationale: O verbo נהל pode significar conduzir, guiar ou administrar. Neste contexto econômico e com “pão” como meio, “sustentou” expressa naturalmente que José manteve o povo abastecido durante aquele ano, preservando a alternativa literal em nota.
- source_word: בַּלֶּחֶם
  choice: com pão
  rationale: A preposição indica o meio pelo qual José os sustentou, e a tradução mantém a repetição do substantivo hebraico.
- source_word: בְּכָל מִקְנֵהֶם
  choice: em troca de todos os seus animais
  rationale: A frase resume a transação de escambo. A explicitação “em troca de” evita a possível impressão de que o pão se destinava aos animais.
- source_word: בַּשָּׁנָה הַהִוא
  choice: naquele ano
  rationale: É uma expressão temporal direta e natural, que situa a duração do arranjo.
