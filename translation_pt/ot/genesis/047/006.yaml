review_pass:
  verdict: revise
  source_fidelity: O texto transmite corretamente a concessão do faraó, a escolha da melhor parte da terra, Gósen, a condição relativa a homens qualificados e a nomeação para supervisionar os animais do faraó. Os marcadores das notas estão corretamente associados aos elementos anotados.
  naturalness: «Estabeleça seu pai e seus irmãos» é compreensível, mas «estabelecer» com pessoas como objeto direto soa menos idiomático no português atual. «Instale seu pai e seus irmãos» preserva adequadamente o sentido causativo do hifil e é mais natural neste contexto. «Supervisores» exprime de modo mais direto a função de שָׂרֵי do que «responsáveis».
  terminology: «Gósen» é a forma tradicional adequada. «Homens competentes» representa bem אַנְשֵׁי־חַיִל no contexto administrativo. «Gado» é possível, mas «rebanhos» evita restringir מִקְנֶה a bovinos e conserva o sentido abrangente de animais de criação.
  issues:
  - severity: low
    issue: 'Construção pouco idiomática: «Estabeleça seu pai e seus irmãos».'
    rationale: Embora semanticamente defensável, o verbo «estabelecer» é menos natural com pessoas como objeto direto. «Instale» comunica com clareza que José deve providenciar sua residência.
  - severity: low
    issue: «Responsáveis pelo gado» atenua a ideia de função oficial de supervisão.
    rationale: שָׂרֵי designa chefes, oficiais ou supervisores. «Supervisores dos rebanhos» é mais preciso e permanece natural.
  - severity: low
    issue: A alternativa de nota «homens de reconhecida aptidão» introduz a noção de reconhecimento, que não está expressa no hebraico.
    rationale: A nota deve limitar-se a alternativas lexicais que preservem capacidade, força ou aptidão, sem acrescentar uma qualificação social.
