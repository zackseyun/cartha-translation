base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: pt
  text: A terra do Egito está diante de você[a]. Instale seu pai e seus irmãos na melhor parte da terra; que eles morem na terra de Gósen. E, se você sabe que há entre eles homens competentes[b], nomeie-os supervisores dos rebanhos que me pertencem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica «está diante de você» pode indicar que a terra estava disponível para José escolher onde instalar sua família.
    reason: cultural_note
  - marker: b
    text: Ou «homens capazes», «homens de habilidade»; mais literalmente, «homens de força/capacidade». Aqui, a expressão não implica necessariamente valor militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: A terra do Egito está diante de você
  rationale: Conserva a imagem do hebraico לְפָנֶיךָ, ao passo que a nota esclarece seu sentido contextual de disponibilidade e liberdade de escolha.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: na melhor parte da terra
  rationale: מֵיטַב indica a porção melhor ou mais excelente; acrescentar «parte» torna a expressão natural e explícita em português.
- source_word: הוֹשֵׁב
  choice: Estabeleça
  rationale: 'O imperativo hifil de ישׁב tem sentido causativo: José deve fazer com que sua família passe a residir ali. «Estabeleça» expressa isso com naturalidade.'
- source_word: יֵשְׁבוּ
  choice: que eles vivam
  rationale: O qal de ישׁב se refere aqui à residência; «vivam» é corrente e claro em português moderno.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: na terra de Gósen
  rationale: Mantém o substantivo explícito אֶרֶץ e a designação geográfica tradicional em português.
- source_word: וְאִם יָדַעְתָּ וְיֶשׁ בָּם
  choice: E, se você sabe que há entre eles
  rationale: Reproduz a condição baseada no conhecimento de José sem eliminar a construção existencial do hebraico.
- source_word: אַנְשֵׁי חַיִל
  choice: homens competentes
  rationale: Neste contexto administrativo e pastoril, חַיִל indica capacidade ou aptidão comprovada, não necessariamente valentia militar.
- source_word: וְשַׂמְתָּם
  choice: nomeie-os
  rationale: Embora שׂים signifique literalmente pôr ou colocar, aqui se trata da atribuição de uma função, para a qual «nomeie» é idiomático.
- source_word: שָׂרֵי מִקְנֶה
  choice: responsáveis pelo gado
  rationale: שָׂרֵי designa pessoas investidas de supervisão, e מִקְנֶה designa os animais possuídos; a formulação comunica claramente a função.
- source_word: עַל אֲשֶׁר לִי
  choice: pelo gado que me pertence
  rationale: Explicita que o objeto sob a responsabilidade deles é o rebanho pertencente ao faraó, referente implícito no hebraico contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construções de ampla compreensão e boa legibilidade brasileira. Preservou-se a imagem idiomática hebraica «está diante de você», esclarecida em nota. Os marcadores foram alinhados ao conteúdo correto das notas, corrigindo a inversão aparente na camada inglesa de consulta.
