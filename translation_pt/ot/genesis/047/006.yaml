revisions:
- from: A terra do Egito está diante de você[a]. Estabeleça seu pai e seus irmãos na melhor parte da terra; que eles vivam na terra de Gósen. E, se você sabe que há entre eles homens competentes[b], nomeie-os responsáveis pelo gado que me pertence.
  to: A terra do Egito está diante de você[a]. Instale seu pai e seus irmãos na melhor parte da terra; que eles morem na terra de Gósen. E, se você sabe que há entre eles homens competentes[b], nomeie-os supervisores dos rebanhos que me pertencem.
  rationale: A revisão melhora a naturalidade e torna mais explícita a nuance administrativa sem alterar o sentido do hebraico. «Instale» mantém o valor causativo de הוֹשֵׁב; «supervisores dos rebanhos» reflete melhor שָׂרֵי מִקְנֶה; e a nota lexical foi ajustada para não acrescentar a ideia de aptidão oficialmente reconhecida.
