base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: pt
  text: 'Eles disseram ao faraó: “Viemos viver como estrangeiros na terra[a], porque não há pasto para os rebanhos dos teus servos, pois a fome é severa na terra de Canaã. Agora, por favor, permite que os teus servos habitem na terra de Gósen.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morar temporariamente na terra”.'
    reason: Alternativa lexical que explicita o caráter provisório frequentemente associado a גור, enquanto o texto principal ressalta a condição de estrangeiros.
lexical_decisions:
- source_word: לָגוּר
  choice: residir como estrangeiros
  rationale: O verbo גור descreve a residência de quem vive fora de sua terra, geralmente sem a ideia de estabelecimento permanente. A formulação preserva tanto a condição de estrangeiros quanto a possível temporariedade.
- source_word: בָּאָרֶץ
  choice: nesta terra
  rationale: אֶרֶץ refere-se aqui ao território do Egito. O demonstrativo implícito pelo contexto torna a expressão natural em português sem alterar o referente.
- source_word: מִרְעֶה
  choice: pasto
  rationale: O substantivo designa pastagem ou lugar de apascentamento; “pasto” é claro, corrente e adequado ao contexto pecuário.
- source_word: לַצֹּאן
  choice: para os rebanhos
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanhos” conserva o sentido coletivo sem limitar a espécie.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: dos teus servos
  rationale: A construção expressa posse. A forma concisa é idiomática em português e mantém a autodesignação deferente diante do faraó.
- source_word: כָבֵד הָרָעָב
  choice: a fome é severa
  rationale: כָבֵד significa literalmente “pesada”, mas, aplicado à fome, indica grande intensidade. “Severa” comunica naturalmente esse valor idiomático.
- source_word: יֵשְׁבוּ נָא
  choice: por favor, permite que ... habitem
  rationale: O jussivo com נָא formula um pedido cortês. “Por favor, permite que” reproduz a petição, enquanto “habitem” não impõe a ideia de assentamento definitivo.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Neste discurso perante o faraó, עבד funciona como autodesignação de deferência; “servos” é mais apropriado ao contexto do que “escravos”.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: a terra de Gósen
  rationale: A tradução mantém explícita a construção geográfica hebraica e usa a forma portuguesa tradicional do topônimo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “tu” aparece apenas nas formas possessivas e verbais dirigidas ao faraó, preservando a deferência do discurso sem recorrer a linguagem excessivamente arcaica.
