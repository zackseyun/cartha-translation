  rationale: No contexto genealógico, indica a geração de descendentes; «gerou» é corrente, conciso e preserva a força genealógica.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Marcador hebraico de objeto direto, cuja função é expressa pela sintaxe portuguesa.
- source_word: אַלְמוֹדָד
  choice: Almodá
  rationale: Transliteração adaptada à tradição e à pronúncia bíblica em português.
- source_word: שָׁלֶף
