  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: חֲצַרְמָוֶת
  choice: Hazar-Mavé
  rationale: Forma portuguesa legível que representa o nome hebraico composto sem o anglicismo «Hazarmaveth».
- source_word: יָרַח
  choice: Jerá
  rationale: Forma tradicional em português, com J para o yod inicial e acento para orientar a pronúncia.
