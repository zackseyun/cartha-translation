  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: pt
  text: E Mizraim gerou Ludim[a], Anamim, Lehabim[b] e Naftuhim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi pai de”; o verbo hebraico é o termo genealógico usual para produzir descendentes.
    reason: lexical_alternative
  - marker: b
    text: Estes nomes são transliterações de nomes de povos, e não traduções como nomes de lugares nem identificações étnicas posteriores.
