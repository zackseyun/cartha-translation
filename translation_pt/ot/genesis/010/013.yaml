lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Mantém o nome próprio por transliteração no contexto da Tabela das Nações; embora associado ao Egito, aqui designa o ancestral epônimo.
- source_word: יָלַד
  choice: gerou
  rationale: É o verbo genealógico comum para produzir descendência. “Gerou” é direto, natural no registro bíblico português e não exige que cada grupo seja entendido como filho individual imediato.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico de objeto direto e não possui equivalente lexical independente em português.
- source_word: לוּדִים
  choice: os ludins
  rationale: Translitera o etnônimo plural, com adaptação gráfica e flexional ao português para indicar naturalmente um povo.
- source_word: עֲנָמִים
  choice: os anamins
  rationale: Translitera o nome do grupo e emprega a forma plural portuguesa, preservando seu caráter etnonímico.
- source_word: לְהָבִים
  choice: os leabins
  rationale: Translitera de perto o hebraico sem impor uma identificação étnica posterior incerta; o h hebraico não é representado por uma consoante autônoma nessa forma portuguesa.
- source_word: נַפְתֻּחִים
  choice: os naftuins
  rationale: Translitera o etnônimo plural em forma legível em português, preservando o nome hebraico em vez de adotar uma identificação conjectural.
- source_word: וְ
  choice: e
  rationale: Conjunção coordenativa normal; em português, aparece antes do último item da enumeração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa própria de uma genealogia. Os etnônimos foram grafados em minúscula, conforme o uso português para nomes de povos, e adaptados ao plural português, sem substituir as formas hebraicas por identificações históricas incertas.
