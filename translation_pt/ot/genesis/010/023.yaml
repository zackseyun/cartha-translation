lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן, com a conjunção וּ, introduz uma fórmula genealógica. “Os filhos de” é a tradução direta e natural; a conjunção inicial não precisa ser explicitada em português neste novo item da lista.
- source_word: אֲרָם
  choice: Arã
  rationale: Nome próprio transliterado segundo a forma bíblica consolidada e natural em português.
- source_word: עוּץ
  choice: Uz
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: חוּל
  choice: Hul
  rationale: Transliteração direta do nome próprio, preservando a forma reconhecível em português.
- source_word: גֶתֶר
  choice: Géter
  rationale: Transliteração adaptada à ortografia portuguesa, com acento para indicar a pronúncia.
- source_word: מַשׁ
  choice: Más
  rationale: O Texto Massorético de Gênesis 10:23 traz מַשׁ; a forma “Más” a translitera e usa acento para orientar a pronúncia em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula genealógica tradicional. Os nomes foram transliterados em formas adequadas à leitura brasileira. O marcador foi colocado após “Más”, pois é esse nome que difere da forma encontrada em 1 Crônicas 1:17.
