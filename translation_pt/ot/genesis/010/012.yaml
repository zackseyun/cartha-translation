  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: pt
  text: e Resém, entre Nínive e Calá[a]; essa é a grande cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamada “Kalhu”, conforme a forma assíria do nome tradicionalmente vertido como “Calá”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “essa é a grande cidade” pode referir-se especificamente a Resém ou à região urbana mais ampla entre Nínive e Calá.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: e
  rationale: A conjunção seguida do marcador de objeto introduz mais um item na sequência de cidades; em português, o marcador de objeto não é expresso.
- source_word: רֶסֶן
  choice: Resém
  rationale: Transliteração portuguesa do topônimo hebraico, com acento gráfico para indicar a pronúncia final tônica.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: Forma portuguesa natural e exata da construção preposicional correlativa que situa Resém em relação às duas cidades.
- source_word: נִינְוֵה
  choice: Nínive
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: כָּלַח
  choice: Calá
  rationale: Forma bíblica tradicional em português, correspondente ao topônimo hebraico; a forma assíria alternativa é registrada em nota.
- source_word: הִוא
  choice: essa é
  rationale: O pronome independente feminino tem função resumptiva e copulativa; a formulação mantém a referência aberta sem acrescentar uma identificação interpretativa.
- source_word: הָעִיר הַגְּדֹלָה
  choice: a grande cidade
  rationale: Reproduz a definitude dos dois termos e preserva o alcance semântico de גָּדוֹל, que pode envolver tamanho e importância.
theological_decisions:
- issue: Referente de “essa é a grande cidade”
  choice: A oração é mantida sem explicitar seu referente.
  alternative: Entender a expressão especificamente como referência a Resém, ou como referência à região urbana mais ampla entre Nínive e Calá.
  rationale: A sintaxe hebraica não resolve de modo inequívoco se a expressão final identifica Resém ou um conjunto urbano mais amplo; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais reconhecíveis dos topônimos. O ponto e vírgula preserva a ligação formal entre a localização e a oração explicativa, sem resolver sua referência ambígua.
