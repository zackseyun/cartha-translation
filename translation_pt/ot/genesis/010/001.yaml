  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: pt
  text: 'Estas são as gerações dos filhos de Noé: Sem[a], Cam e Jafé. E, depois do dilúvio, nasceram-lhes filhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estes são os descendentes dos filhos de Noé”. O termo hebraico traduzido por “gerações” pode se referir de modo amplo à linhagem ou àquilo que procede de uma pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: Introduz uma nova seção narrativa. Em português, a formulação sem um marcador temporal acrescentado é natural e preserva o valor apresentativo.
- source_word: תּוֹלְדֹת
  choice: as gerações de
  rationale: Preserva a fórmula estrutural recorrente de Gênesis e sua amplitude semântica, que pode abranger linhagem, descendência e aquilo que procede de alguém.
- source_word: בְּנֵי נֹחַ
  choice: os filhos de Noé
  rationale: Reproduz diretamente a cadeia construta hebraica em registro adequado a um cabeçalho genealógico.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Cam e Jafé
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes bíblicos.
- source_word: וַיִּוָּלְדוּ
  choice: nasceram
  rationale: O nifal de ילד expressa aqui nascimento, sem introduzir o sentido ativo de gerar.
- source_word: לָהֶם
  choice: lhes
  rationale: O pronome dativo conserva de modo idiomático a relação expressa por ל no português.
- source_word: בָּנִים
  choice: filhos
  rationale: Mantém o substantivo masculino plural explícito no hebraico, apropriado ao contexto genealógico.
- source_word: אַחַר הַמַּבּוּל
  choice: depois do dilúvio
  rationale: Expressa com clareza a localização temporal; “dilúvio” é a designação portuguesa consagrada para מַבּוּל em Gênesis.
theological_decisions:
- issue: Tradução da fórmula תּוֹלְדֹת em Gênesis
  choice: as gerações de
  alternative: os descendentes de
  rationale: A opção escolhida preserva a ligação literária entre as seções de Gênesis e não reduz a fórmula exclusivamente à descendência.
- issue: Termo masculino בָּנִים
  choice: filhos
  alternative: crianças
  rationale: O hebraico emprega um termo masculino, e o contexto da genealogia trata de descendentes homens; “filhos” mantém essa característica.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas dos nomes consolidadas no uso lusófono. A ordem “depois do dilúvio” foi antecipada na segunda frase para maior naturalidade, sem alterar sua relação temporal.
