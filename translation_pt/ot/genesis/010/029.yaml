  text: Ofir, Havilá e Jobabe. Todos esses foram filhos[a] de Joctã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «descendentes de Joctã». Em genealogias, o hebraico traduzido por «filhos de» às vezes pode ter sentido mais amplo, mas aqui se refere mais naturalmente aos filhos mencionados na lista.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: '[marcador de objeto direto omitido; coordenação expressa por vírgulas e «e»]'
  rationale: A repetição de אֵת marca cada nome como objeto direto na continuação da lista genealógica do versículo anterior. O português não possui equivalente natural, por isso o marcador é omitido, preservando-se a coordenação da lista.
- source_word: אוֹפִר
  choice: Ofir
  rationale: Nome próprio transliterado segundo a forma bíblica consagrada em português.
- source_word: חֲוִילָה
  choice: Havilá
  rationale: Nome próprio transliterado segundo o uso bíblico corrente em português.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Nome próprio transliterado segundo a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: כָּל אֵלֶּה
  choice: Todos esses
  rationale: Equivalência direta e idiomática da expressão resumitiva hebraica, retomando todos os nomes da lista.
- source_word: בְּנֵי
  choice: filhos de
  rationale: Embora o termo possa designar descendentes em genealogias, o contexto imediato apresenta uma lista de filhos homens atribuídos diretamente a Joctã.
- source_word: יָקְטָן
  choice: Joctã
  rationale: Nome próprio na forma bíblica consagrada em português.
