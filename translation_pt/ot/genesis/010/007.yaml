  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: pt
  text: 'E os filhos[a] de Cuxe: Sebá, Havilá, Sabtá, Raamá e Sabtecá[b]. E os filhos de Raamá: Sabá e Dedã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias hebraicas, “filhos” pode indicar descendentes ou a origem de clãs e povos, e não apenas filhos biológicos imediatos.
    reason: cultural_note
  - marker: b
    text: Vários nomes deste versículo podem designar povos, regiões ou ancestrais que deram nome a esses grupos, e não apenas indivíduos.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos
  rationale: Reproduz diretamente a forma genealógica hebraica e a conjunção prefixada. Em genealogias, “filhos” pode abranger descendentes e grupos originados de um ancestral, sentido esclarecido em nota.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico.
- source_word: סְבָא
  choice: Sebá
  rationale: Transliteração portuguesa que distingue este nome de שְׁבָא, vertido como Sabá no fim do versículo.
- source_word: חֲוִילָה
  choice: Havilá
  rationale: Transliteração consagrada em português, com acentuação adequada à leitura.
- source_word: סַבְתָּה
  choice: Sabtá
  rationale: Transliteração direta e legível da forma hebraica.
- source_word: רַעְמָה
  choice: Raamá
  rationale: Transliteração que preserva de modo legível a estrutura vocálica do nome hebraico.
- source_word: סַבְתְּכָא
  choice: Sabtecá
  rationale: Forma portuguesa clara, próxima da pronúncia representada pelo texto massorético.
- source_word: וּבְנֵי רַעְמָה
  choice: E os filhos de Raamá
  rationale: Mantém a fórmula genealógica repetida e a estrutura coordenada do hebraico.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma tradicional em português para este nome, mantendo-o distinto de Sebá.
- source_word: דְדָן
  choice: Dedã
  rationale: Forma tradicional e natural em português para o nome próprio hebraico.
