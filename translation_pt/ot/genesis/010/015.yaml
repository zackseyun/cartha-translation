lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: E Canaã
  rationale: A conjunção ו preserva a sequência genealógica; כנען é vertido pela forma portuguesa consagrada “Canaã”.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico, ילד indica gerar descendência. “Gerou” é direto, digno e corrente em genealogias bíblicas, sem o arcaísmo de “engendrou”.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: O marcador de objeto direto não possui equivalente lexical necessário em português.
- source_word: צִידֹן
  choice: Sidom
  rationale: Usa-se a forma portuguesa tradicional e amplamente reconhecida do nome צידון.
- source_word: בְּכֹר/וֹ
  choice: seu primogênito
  rationale: O substantivo com sufixo masculino singular identifica Sidom como o primogênito de Canaã; a formulação mantém de modo conciso essa relação.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção introduz o segundo objeto, enquanto o marcador de objeto direto não precisa ser expresso em português.
- source_word: חֵת
  choice: Hete
  rationale: Mantém-se o nome pessoal na forma portuguesa consagrada, sem inserir no texto principal a identificação explicativa com os hititas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe genealógica concisa. A vírgula antes do marcador de nota encerra o aposto “seu primogênito”; a explicação sobre Hete permanece apenas na nota para não ampliar o hebraico no texto principal.
