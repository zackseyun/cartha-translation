  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: pt
  text: E Canaã gerou Sidom, seu primogênito, e Hete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hete é o ancestral associado aos hititas na genealogia circundante.
