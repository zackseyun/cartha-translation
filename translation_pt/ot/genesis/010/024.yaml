  text: Arpaxade gerou Shelá[a], e Shelá gerou Éber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arfaxade” e “Selá” são formas tradicionais em português, influenciadas por formas transmitidas pelas tradições grega e latina. O texto usa “Arpaxade” e “Shelá”, mais próximas das formas hebraicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arfaxade
  rationale: Nome próprio vertido na forma portuguesa corrente e reconhecível, correspondente ao hebraico אַרְפַּכְשַׁד; a nota registra uma transliteração mais direta do hebraico.
- source_word: יָלַד
  choice: gerou
  rationale: Em genealogias, com sujeito masculino, o verbo יָלַד indica que alguém gerou ou se tornou pai de outro. “Gerou” é conciso, natural no registro bíblico português e não exige explicitar além do hebraico o grau exato de descendência.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Partícula que marca o objeto direto definido no hebraico, representada em português pela estrutura sintática.
- source_word: שָׁלַח / שֶׁלַח
  choice: Selá
  rationale: Forma portuguesa inteligível do nome hebraico, com acento indicado para orientar a pronúncia e manter consistência nas duas ocorrências.
- source_word: וְ/שֶׁלַח
  choice: e Selá
  rationale: A conjunção וְ é traduzida por “e”, e o nome repetido mantém a mesma forma portuguesa.
- source_word: עֵבֶר
  choice: Éber
  rationale: Transliteração portuguesa do hebraico עֵבֶר, com acento gráfico para indicar a tonicidade.
