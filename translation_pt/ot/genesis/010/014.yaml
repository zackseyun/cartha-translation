base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: pt
  text: e os patrusitas, os casluítas (de lá saíram os filisteus[a]) e os caftoritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica diz literalmente “de lá saíram os filisteus”. No contexto, “de lá” pode ligar a origem dos filisteus aos casluítas, mencionados imediatamente antes.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: patrusitas
  rationale: Etnônimo derivado de Patros; a forma portuguesa com o sufixo de povo “-itas” translitera o nome sem lhe atribuir significado incerto.
- source_word: כַּסְלֻחִים
  choice: casluítas
  rationale: Etnônimo de identificação extrabíblica incerta; a transliteração preserva a forma hebraica, com adaptação natural ao português.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: de lá saíram
  rationale: Mantém o sentido adverbial de מִשָּׁם (“de lá”) e o movimento expresso por יָצְאוּ (“saíram”), sem converter implicitamente a frase em uma afirmação mais específica de descendência.
- source_word: פְּלִשְׁתִּים
  choice: filisteus
  rationale: Forma tradicional e amplamente reconhecida em português para esse etnônimo.
- source_word: כַּפְתֹּרִים
  choice: caftoritas
  rationale: Etnônimo relacionado a Caftor; a forma com “-itas” identifica naturalmente um grupo humano em português.
- source_word: וְאֶת
  choice: e
  rationale: Na lista genealógica, a conjunção é representada por “e”, enquanto o marcador hebraico de objeto direto não requer tradução explícita.
theological_decisions:
- issue: Referente da oração sobre a origem dos filisteus
  choice: Preservar a expressão adverbial “de lá” no texto principal.
  alternative: “dos quais saíram os filisteus”, ligando explicitamente a oração aos casluítas.
  rationale: Embora o grupo mencionado imediatamente antes seja o antecedente mais natural no fluxo da genealogia, o hebraico diz literalmente “de lá” e não “deles”. A redação escolhida preserva essa abertura, e a nota informa a ligação sintática provável sem torná-la obrigatória.
translation_notes:
  register: Português moderno, claro e digno, com formas aportuguesadas dos etnônimos. Os parênteses distinguem a observação sobre os filisteus da sequência principal da lista genealógica.
