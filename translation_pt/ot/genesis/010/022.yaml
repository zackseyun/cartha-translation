  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: pt
  text: 'Os filhos de Sem: Elão, Assur, Arpaxade[a], Lude e Arã[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico Arpaxade; a forma tradicional Arfaxade reflete influência da forma grega.
    reason: lexical_alternative
  - marker: b
    text: Os nomes hebraicos Assur e Arã são frequentemente associados às regiões e aos povos mais tarde conhecidos como Assíria e Síria.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן significa literalmente “filhos de”. Em uma genealogia, essa formulação preserva o enquadramento masculino e genealógico do hebraico sem ampliá-lo para “descendentes”.
- source_word: שֵׁם
  choice: Sem
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma portuguesa consagrada do nome próprio/topônimo hebraico, empregado aqui como nome genealógico.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Mantém o nome próprio hebraico na lista genealógica, em vez de substituí-lo pelo nome posterior da região, “Assíria”.
- source_word: אַרְפַּכְשַׁד
  choice: Arpaxade
  rationale: Transliteração portuguesa orientada pela forma hebraica, preservando o p presente no texto massorético; “Arfaxade”, embora tradicional, reflete influência da forma grega.
- source_word: לוּד
  choice: Lude
  rationale: Forma portuguesa do nome singular לוּד; evita “Ludim”, que seria uma forma diferente e não corresponde à leitura deste versículo.
- source_word: אֲרָם
  choice: Arã
  rationale: Forma portuguesa reconhecida do nome hebraico, mais precisa nesta genealogia do que o equivalente geográfico posterior “Síria”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas onomásticas reconhecíveis. A construção nominal do hebraico foi preservada por meio dos dois-pontos, sem acrescentar um verbo. O marcador [a] foi colocado junto de Arpaxade, o nome ao qual a nota lexical efetivamente se refere.
