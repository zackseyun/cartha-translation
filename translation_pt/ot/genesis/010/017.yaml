lexical_decisions:
- source_word: וְאֶת
  choice: e
  rationale: Na sequência genealógica, וְ liga mais um item à lista, enquanto אֶת é apenas o marcador hebraico de objeto direto e não requer equivalente explícito em português.
- source_word: הַחִוִּי
  choice: os heveus
  rationale: O gentílico singular com artigo tem sentido coletivo. A forma tradicional portuguesa no plural expressa naturalmente esse povo e mantém a estrutura da lista.
- source_word: הָעַרְקִי
  choice: os arqueus
  rationale: O gentílico designa coletivamente os habitantes ou descendentes associados a Arca. “Arqueus” preserva o caráter de nome étnico e se harmoniza com os demais itens da genealogia.
- source_word: הַסִּינִי
  choice: os sineus
  rationale: O gentílico singular designa coletivamente um grupo cananeu. “Sineus” conserva o caráter étnico do termo e segue o padrão da enumeração.
