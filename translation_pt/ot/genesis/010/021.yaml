source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: pt
  text: A Sem, pai de todos os filhos de Éber e irmão mais velho[a] de Jafé, também nasceram filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “irmão de Jafé, o mais velho”. O adjetivo hebraico traduzido por “mais velho” pode se referir tanto a Sem quanto a Jafé.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/לְ/שֵׁם
  choice: Também a Sem
  rationale: A conjunção e a preposição introduzem Sem como mais um membro da genealogia; a formulação inicial preserva o fluxo e o sentido aditivo.
- source_word: יֻלַּד
  choice: nasceram filhos
  rationale: O passivo singular de ילד pode introduzir de modo idiomático a descendência de alguém. Em português, explicitar «filhos» no plural comunica naturalmente o sentido genealógico.
- source_word: גַּם הוּא
  choice: Também
  rationale: A expressão enfatiza que Sem igualmente teve descendentes; em português, «Também» no início transmite essa ênfase sem exigir um pronome explícito.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: pai de todos os filhos de Éber
  rationale: Mantém a linguagem genealógica direta de אָב e בְּנֵי, sem substituir o nome Éber por uma identificação interpretativa como «hebreus».
- source_word: אֲחִי יֶפֶת
  choice: irmão mais velho de Jafé
  rationale: אֲחִי יֶפֶת significa «irmão de Jafé»; no texto principal, הַגָּדוֹל é entendido como qualificando Sem, o que em português se expressa naturalmente por «irmão mais velho de Jafé».
- source_word: הַגָּדוֹל
  choice: mais velho
  rationale: No contexto de parentesco, o adjetivo provavelmente indica senioridade etária. Como sua ligação sintática é ambígua, a leitura alternativa é preservada em nota.
theological_decisions:
- issue: Ligação sintática de הַגָּדוֹל a Sem ou a Jafé
  choice: 'Entendido como qualificando Sem: «irmão mais velho de Jafé».'
  alternative: 'Entendido como qualificando Jafé: «irmão de Jafé, o mais velho».'
  rationale: O hebraico permite ambas as ligações. O texto principal adota uma leitura plausível, enquanto a nota preserva a ambiguidade genealógica sem apresentar certeza indevida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem foi ajustada para soar natural sem perder o foco aditivo do hebraico nem a linguagem genealógica.
