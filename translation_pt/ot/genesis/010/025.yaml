id: GEN.10.25
reference: Genesis 10:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: pt
  text: 'E a Éber nasceram dois filhos: o nome de um era Pelegue, pois em seus dias a terra foi dividida[a]; e o nome de seu irmão era Joctã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o território foi dividido”. A palavra hebraica pode significar tanto “terra” em sentido amplo como “terra, região ou território”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר
  choice: E a Éber
  rationale: Preserva a conjunção e a construção hebraica com a preposição, de modo natural em português.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: nasceram dois filhos
  rationale: Reproduz o passivo de ילד e a concordância plural, sem convertê-lo no ativo 'gerou'.
- source_word: שֵׁם הָאֶחָד
  choice: o nome de um era
  rationale: Mantém o contraste hebraico entre um dos filhos e seu irmão, sem introduzir a ideia não explícita de 'primeiro'.
- source_word: פֶּלֶג
  choice: Pelegue
  rationale: Transliteração portuguesa corrente do nome hebraico, cuja forma também mantém perceptível a associação sonora com o verbo 'dividir' no original.
- source_word: כִּי בְיָמָיו
  choice: pois em seus dias
  rationale: Expressa a explicação do nome e conserva o modo temporal conciso do hebraico.
- source_word: נִפְלְגָה
  choice: foi dividida
  rationale: Tradução direta do nifal de פלג, preservando a ligação verbal com o nome Pelegue sem especificar o mecanismo da divisão.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Em português, 'a terra' preserva de forma natural a amplitude semântica do hebraico אֶרֶץ, que pode designar tanto a terra em sentido amplo quanto uma região ou território.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: e o nome de seu irmão era Joctã
  rationale: Segue de perto a estrutura possessiva hebraica em ordem natural no português e translitera o nome conforme o uso bíblico português.
theological_decisions:
- issue: Alcance de הָאָרֶץ na explicação do nome de Pelegue
  choice: a terra
  alternative: o território / a região
  rationale: O contexto da genealogia das nações favorece um sentido amplo, mas o termo hebraico não determina por si só se a referência é ao mundo habitado ou a uma terra específica. A tradução mantém 'a terra' e registra a alternativa lexical em nota, sem definir o acontecimento histórico em questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a estrutura genealógica do hebraico e sua ambiguidade lexical, sem tornar a frase excessivamente literal.
