  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: pt
  text: e os jebuseus[a], os amorreus e os girgaseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega formas gentílicas no singular (“o jebuseu”, “o amorreu”, “o girgaseu”), mas, nesta genealogia, elas designam coletivamente esses povos; por isso, foram traduzidas no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: Embora o hebraico empregue um gentílico singular com artigo, neste contexto genealógico ele designa coletivamente um povo; o plural é a forma natural em português.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O gentílico singular hebraico tem sentido coletivo na lista dos povos. O plural português comunica naturalmente essa referência étnica.
- source_word: הַגִּרְגָּשִׁי
  choice: os girgaseus
  rationale: O singular gentílico hebraico representa coletivamente esse povo; por isso, usa-se o plural em português.
- source_word: וְאֶת / וְאֵת
  choice: e / sem representação explícita
  rationale: A conjunção ו liga os nomes à lista iniciada no versículo anterior, enquanto אֵת é um marcador de objeto direto e não recebe tradução própria em português. A primeira conjunção é preservada; nas demais ocorrências, a enumeração portuguesa natural dispensa a repetição de “e”, exceto antes do último item.
