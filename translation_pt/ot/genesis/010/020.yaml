    issue: “em suas nações” para בְּגוֹיֵהֶם
    rationale: A preposição בְּ pode ser vertida formalmente por “em”, mas, nesta fórmula de classificação étnico-genealógica, a última expressão funciona melhor como “segundo suas nações”, em paralelo funcional com “segundo seus clãs” e “segundo suas línguas” e em consonância com a trilha de auditoria inglesa (“by their nations”).
  revised_text: Estes são os filhos de Cam[a], segundo seus clãs, segundo suas línguas, em suas terras, segundo suas nações.
  revised_footnotes:
