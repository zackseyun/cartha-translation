base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: pt
  text: Estes são os filhos de Cam[a], segundo seus clãs, segundo suas línguas, em suas terras, segundo suas nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto genealógico, “filhos” também pode incluir descendentes e os povos procedentes deles.
    reason: semantic_scope
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo introduz uma fórmula de resumo e identificação; “Estes são” preserva essa função em português natural.
- source_word: בְנֵי חָם
  choice: os filhos de Cam
  rationale: Mantém a expressão genealógica formal do hebraico. Neste contexto, “filhos” pode abranger os descendentes e povos procedentes de Cam, esclarecimento dado em nota.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo seus clãs
  rationale: A preposição לְ marca aqui classificação ou distribuição. “Clãs” comunica grupos de parentesco mais amplos que famílias nucleares.
- source_word: לִלְשֹׁנֹתָם
  choice: segundo suas línguas
  rationale: לָשׁוֹן significa literalmente “língua”, mas neste contexto designa idioma; a expressão portuguesa preserva ambos os valores de modo natural.
- source_word: בְּאַרְצֹתָם
  choice: em suas terras
  rationale: A preposição בְּ tem sentido locativo, e “terras” evita a conotação moderna de Estados nacionais presente em “países”.
- source_word: בְּגוֹיֵהֶם
  choice: em suas nações
  rationale: Preserva a construção com בְּ e distingue as comunidades étnico-políticas dos clãs, línguas e territórios já mencionados.
theological_decisions:
- issue: Alcance genealógico de בְנֵי (“filhos”)
  choice: Manter “filhos” no texto e indicar em nota que o termo pode abranger descendentes e povos.
  alternative: Traduzir diretamente como “descendentes”.
  rationale: A opção mantém a forma genealógica hebraica sem restringir indevidamente seu alcance contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “segundo” conserva a classificação por clãs e línguas; “em” preserva a formulação locativa das duas expressões finais. A conjunção antes do último elemento dá fluidez ao período sem apagar a estrutura enumerativa.
