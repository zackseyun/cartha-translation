lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן que introduz uma genealogia; a tradução direta preserva o enquadramento de filiação masculina do hebraico.
- source_word: יֶפֶת
  choice: Jafé
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: גֹּמֶר
  choice: Gômer
  rationale: Nome próprio transliterado em forma natural para leitores de português.
- source_word: מָגוֹג
  choice: Magogue
  rationale: Nome próprio; preserva-se sua função genealógica, usando a forma portuguesa consagrada.
- source_word: מָדַי
  choice: Madai
  rationale: Embora possa designar os medos em outros usos, aqui funciona como nome próprio na genealogia; mantém-se a transliteração.
- source_word: יָוָן
  choice: Javã
  rationale: Embora possa designar a Jônia ou os gregos, aqui é apresentado como nome genealógico; usa-se a forma portuguesa tradicional.
- source_word: תֻבָל
  choice: Tubal
  rationale: Nome próprio transliterado conforme a forma corrente em português.
- source_word: מֶשֶׁךְ
  choice: Meseque
  rationale: Nome próprio apresentado na forma portuguesa tradicional e legível.
- source_word: תִירָס
  choice: Tiras
  rationale: Nome próprio transliterado sem interpretação étnica adicional.
