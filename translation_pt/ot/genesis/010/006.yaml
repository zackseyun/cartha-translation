base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: pt
  text: 'E os filhos de Cam: Cuxe, Mizraim[a], Pute[b] e Canaã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico “Mizraim”; muitas traduções vertem o nome como “Egito”. Nesta genealogia, a forma hebraica é tratada como nome pessoal ou ancestral.
    reason: alternative_reading
  - marker: b
    text: “Pute” também aparece tradicionalmente como “Fute” em algumas traduções portuguesas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: Mantém a conjunção que dá continuidade à genealogia e traduz literalmente a construção hebraica; neste contexto, “filhos” também pode abranger linhagens descendentes.
- source_word: חָם
  choice: Cam
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Transliteração bíblica corrente em português, adequada ao nome ancestral e geográfico.
- source_word: וּ/מִצְרַיִם
  choice: Mizraim
  rationale: Conserva o nome pessoal/ancestral na genealogia, em vez de substituí-lo diretamente pelo nome do país, Egito.
- source_word: וּ/פוּט
  choice: Pute
  rationale: Forma tradicional em português, próxima do hebraico e mais natural na fonologia portuguesa do que “Put”.
- source_word: וּ/כְנָעַן
  choice: e Canaã
  rationale: Emprega a forma portuguesa estabelecida do nome e mantém a coordenação do último item da lista.
