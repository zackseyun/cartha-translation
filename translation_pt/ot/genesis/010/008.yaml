  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: pt
  text: E Cuxe gerou Ninrode; ele começou a ser um homem poderoso[a][b] na terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começou a tornar-se um homem poderoso”.'
    reason: alternativa sintática para o valor incoativo de הֵחֵל לִהְיוֹת
  - marker: b
    text: “Homem poderoso” também pode ser traduzido como “poderoso”, “herói” ou “guerreiro”, conforme o alcance atribuído ao hebraico גִּבּוֹר neste contexto.
    reason: alternativas lexicais
  - marker: c
    text: 'Ou: “no país” ou “naquela terra”. O hebraico אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou região.'
    reason: ambiguidade lexical e de alcance
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: E Cuxe
  rationale: A conjunção dá continuidade à genealogia. “Cuxe” segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: יָלַד
  choice: gerou
  rationale: No contexto genealógico, o verbo indica que Cuxe foi o progenitor de Ninrode. “Gerou” é conciso, natural no registro bíblico moderno e preserva o sentido masculino da genealogia.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico do objeto direto definido e não possui equivalente lexical independente em português.
- source_word: נִמְרֹד
  choice: Ninrode
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הוּא
  choice: ele
  rationale: O pronome independente retoma Ninrode como sujeito e recebe expressão explícita e natural em português.
- source_word: הֵחֵל לִהְיוֹת
  choice: começou a ser
  rationale: Reproduz diretamente o valor incoativo da construção hebraica sem acrescentar a ideia interpretativa de que Ninrode teria sido necessariamente o primeiro de todos.
- source_word: גִּבּוֹר
  choice: um homem poderoso
  rationale: Expressa força, poder ou valentia sem restringir prematuramente o termo ao sentido exclusivamente militar de “guerreiro”.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: É uma formulação portuguesa natural que permite o sentido amplo de “terra” sem eliminar a possibilidade lexical de “país” ou “região”.
theological_decisions:
- issue: Força de הֵחֵל לִהְיוֹת
  choice: começou a ser
  alternative: foi o primeiro a tornar-se
  rationale: A construção hebraica afirma com segurança o início de uma condição, mas não exige por si só uma declaração de prioridade histórica. A tradução preserva essa distinção.
- issue: Alcance de אֶרֶץ
  choice: terra, em sentido amplo
  alternative: país ou região
  rationale: O contexto da lista das nações favorece o alcance amplo, mas o substantivo hebraico permanece lexicalmente capaz de designar uma terra ou região específica; essa possibilidade é registrada em nota.
- issue: Sentido de גִּבּוֹר
  choice: homem poderoso
  alternative: poderoso, herói ou guerreiro
  rationale: O termo pode incluir força, destaque, valentia ou capacidade militar. A redação principal mantém a amplitude sem transformar Ninrode explicitamente em guerreiro.
translation_notes:
  register: Português moderno, digno e acessível, com cadência adequada a uma genealogia. “Gerou” conserva o registro bíblico sem recorrer ao arcaísmo “engendrou”. A expressão “começou a ser” evita introduzir a noção não explícita de prioridade, e as notas preservam as ambiguidades de גִּבּוֹר e אֶרֶץ.
