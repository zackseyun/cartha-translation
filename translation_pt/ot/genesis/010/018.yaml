base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: pt
  text: e os arvadeus, os zemareus e os hamateus. Depois, os clãs dos cananeus[a] se dispersaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do cananeu”. O hebraico emprega um gentílico singular com sentido coletivo para se referir a esse povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: os arvadeus
  rationale: O gentílico singular hebraico tem sentido coletivo nesta lista de povos; o plural em português expressa esse sentido com naturalidade.
- source_word: הַצְּמָרִי
  choice: os zemareus
  rationale: Como os gentílicos ao redor, designa coletivamente o povo ligado a Zemar; o plural é a forma idiomática em português.
- source_word: הַחֲמָתִי
  choice: os hamateus
  rationale: O singular gentílico hebraico representa um grupo étnico; o plural português preserva a função coletiva.
- source_word: וְאַחַר
  choice: Depois disso
  rationale: Marca a sequência temporal após a enumeração anterior e soa natural no português atual.
- source_word: נָפֹצוּ
  choice: se dispersaram
  rationale: O nifal indica dispersão; a construção pronominal conserva o sentido intransitivo/resultativo sem especificar um agente.
- source_word: מִשְׁפְּחוֹת
  choice: os clãs
  rationale: No contexto genealógico e etnográfico, refere-se a grupos de parentesco mais amplos que famílias nucleares.
- source_word: הַכְּנַעֲנִי
  choice: dos cananeus
  rationale: Embora esteja morfologicamente no singular, o gentílico é coletivo e se refere ao povo cananeu como um todo.
