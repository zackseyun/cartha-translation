base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: pt
  text: E a região onde habitavam se estendia desde Mesa, na direção de Sefar, a montanha do Oriente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E sua habitação era desde Mesa, ao ir em direção a Sefar, a montanha do Oriente”. “Montanha” também pode referir-se a uma região montanhosa.'
    reason: Preserva a alternativa mais literal para a construção direcional בֹּאֲכָה e registra a possível extensão geográfica de הַר, sem mudar o singular no texto principal.
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... ia
  rationale: O wayyiqtol de היה liga a descrição ao contexto narrativo; com a expressão de limites, “ia desde... até...” comunica naturalmente em português a extensão territorial sem acrescentar uma ideia estranha ao hebraico.
- source_word: מוֹשָׁבָם
  choice: a região onde habitavam
  rationale: מוֹשָׁבָם designa o lugar ou território de residência do grupo. Esta formulação é clara para leitores atuais e se ajusta à descrição geográfica da Tabela das Nações.
- source_word: מִמֵּשָׁא
  choice: desde Messa
  rationale: O nome geográfico é transliterado como “Messa”; a preposição מִן marca o ponto inicial da extensão territorial.
- source_word: בֹּאֲכָה
  choice: até
  rationale: A expressão direcional derivada de בוא indica o rumo ou a aproximação de Sefar. No contexto dos limites territoriais, “até” produz uma formulação portuguesa natural; a tradução mais literal é preservada na nota.
- source_word: סְפָרָה
  choice: Sefar
  rationale: O topônimo é transliterado “Sefar”; o ה direcional é representado pelo movimento expresso em “até”.
- source_word: הַר
  choice: nas montanhas
  rationale: הַר pode indicar uma montanha ou uma região montanhosa. Aqui o contexto geográfico favorece o sentido regional, expresso naturalmente pelo plural português.
- source_word: הַקֶּדֶם
  choice: do Oriente
  rationale: קֶדֶם indica o leste ou a região oriental. “Oriente” conserva o caráter geográfico e o registro digno do texto.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A expressão “a região onde habitavam” evita o sentido moderno de um assentamento recém-fundado, enquanto “ia desde... até...” apresenta com naturalidade a extensão geográfica. O marcador [a] aparece no texto principal.
