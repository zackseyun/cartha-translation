  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: pt
  text: 'E os filhos de Javã: Elisá, Társis, Quitim e Dodanim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e 1 Crônicas 1:7 trazem “Rodanim” em vez de “Dodanim”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E os filhos de
  rationale: Mantém a forma genealógica direta do hebraico. Embora “descendentes” seja possível em listas genealógicas, “filhos” preserva melhor a expressão do texto-fonte.
- source_word: יָוָן
  choice: Javã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio יָוָן.
- source_word: אֱלִישָׁה
  choice: Elisá
  rationale: Transliteração portuguesa clara do nome próprio, com acentuação que favorece a pronúncia natural.
- source_word: וְ/תַרְשִׁישׁ
  choice: Társis
  rationale: Forma tradicional em português para o nome próprio ou topônimo תַרְשִׁישׁ.
- source_word: כִּתִּים
  choice: Quitim
  rationale: Forma portuguesa tradicional e legível do etnônimo ou topônimo hebraico, adaptando o som inicial /k/ à ortografia portuguesa.
- source_word: וְ/דֹדָנִים
  choice: Dodanim
  rationale: Segue a leitura do Texto Massorético apresentada no WLC. A variante “Rodanim” é preservada em nota textual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e reconhecíveis dos nomes próprios. O verbo “foram” foi acrescentado para tornar a enumeração natural em português, sem alterar o sentido genealógico. A nota foi colocada após “Dodanim”, termo ao qual a variante textual se refere.
