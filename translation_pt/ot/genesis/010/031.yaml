base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: pt
  text: Estes são os filhos de Sem, segundo os seus clãs, segundo as suas línguas, em suas terras, segundo as suas nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: Introduz de modo dêitico a declaração resumitiva; o português explicita naturalmente o verbo de ligação ausente na oração nominal hebraica.
- source_word: בְנֵי שֵׁם
  choice: os filhos de Sem
  rationale: Preserva a formulação genealógica formal e o enquadramento da linhagem masculina do hebraico, sem ampliar explicitamente o sentido para “descendentes”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui agrupamentos genealógico-tribais; “clãs” é mais preciso que “famílias”, e “segundo” expressa o valor classificatório da preposição לְ.
- source_word: לִלְשֹׁנֹתָם
  choice: segundo as suas línguas
  rationale: Embora לָשׁוֹן possa significar literalmente “língua” como órgão, neste contexto refere-se aos idiomas ou grupos linguísticos; “línguas” conserva a formulação tradicional e é claro em português.
- source_word: בְּאַרְצֹתָם
  choice: em suas terras
  rationale: O plural de אֶרֶץ indica as terras ou territórios ocupados pelos grupos; “terras” evita a conotação moderna mais forte de Estados nacionais presente em “países”.
- source_word: לְגוֹיֵהֶם
  choice: segundo as suas nações
  rationale: גּוֹי designa povos ou nações, e “segundo” mantém o paralelismo classificatório marcado pelas preposições לְ repetidas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “segundo” foi mantida para representar a cadência classificatória do hebraico; “em suas terras” preserva a mudança para a preposição locativa בְּ.
