lexical_decisions:
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção וְ é traduzida por “e”. A partícula אֶת marca o objeto direto definido em hebraico, mas não tem equivalente natural em português neste contexto; sua repetição não precisa ser representada separadamente.
- source_word: עוֹבָל
  choice: Obal
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Nome próprio transliterado, sem traduzir seus possíveis elementos internos.
- source_word: שְׁבָא
  choice: Sabá
  rationale: Forma tradicional em português para este nome hebraico neste contexto genealógico; distingue-se de Sebá, que representa outro nome e outra grafia hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A repetição de “e” preserva o ritmo enumerativo do hebraico e a ligação sintática com o versículo anterior.
