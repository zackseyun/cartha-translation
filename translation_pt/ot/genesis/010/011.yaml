  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: pt
  text: Daquela terra saiu Assur e construiu Nínive[a], Reobote-Ir e Calá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Daquela terra ele foi para a Assíria e construiu Nínive, Reobote-Ir e Calá”, entendendo que o sujeito é Ninrode, mencionado no versículo anterior, e que אַשּׁוּר designa a Assíria, não a pessoa Assur.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: Daquela terra
  rationale: מִן indica origem ou ponto de partida, e אֶרֶץ se refere aqui a uma região territorial. “Daquela terra” é natural e preserva o sentido geográfico.
- source_word: יָצָא
  choice: saiu
  rationale: יצא significa comumente “sair”. “Saiu” expressa de modo direto o movimento a partir da terra mencionada.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: O nome pode designar tanto a pessoa Assur como a região da Assíria. No texto principal, é tomado como sujeito explícito do verbo; a leitura geográfica alternativa é preservada em nota.
- source_word: וַיִּבֶן
  choice: construiu
  rationale: בנה é o verbo comum para “construir”. A tradução evita “fundou”, que seria mais interpretativa e específica.
- source_word: נִינְוֵה
  choice: Nínive
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: רְחֹבֹת עִיר
  choice: Reobote-Ir
  rationale: A expressão é entendida como topônimo na lista de cidades. A transliteração conserva o nome próprio sem impor a alternativa lexical “praças da cidade”.
- source_word: כָּלַח
  choice: Calá
  rationale: Forma portuguesa tradicional do topônimo hebraico.
theological_decisions:
- issue: Sujeito e referente de אַשּׁוּר
  choice: 'Assur é o sujeito: “saiu Assur”'
  alternative: “Dessa terra ele foi para a Assíria”, entendendo Ninrode como sujeito implícito retomado do versículo anterior e אַשּׁוּר como a região da Assíria.
  rationale: O texto hebraico permite ambas as leituras, pois אַשּׁוּר pode nomear a pessoa Assur ou a região da Assíria. A sintaxe imediata admite naturalmente Assur como sujeito expresso após o verbo. A alternativa histórica e linguisticamente possível é mantida em nota para preservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com formas de topônimos reconhecíveis para leitores brasileiros e internacionais. A ordem “saiu Assur” mantém naturalidade narrativa e torna explícita a leitura adotada sem eliminar a alternativa em nota.
