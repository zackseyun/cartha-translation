  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: pt
  text: 'Ele foi um poderoso caçador diante de Yahweh; por isso se diz[a]: “Como Ninrode, um poderoso caçador diante de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “em desafio a Yahweh”, caso a expressão seja entendida em sentido hostil à luz do contexto mais amplo.'
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר
  choice: poderoso
  rationale: Em combinação com צַיִד, descreve a excepcional habilidade ou projeção de Ninrode na caça. “Poderoso” preserva a força do termo sem transformá-lo numa expressão nominal separada.
- source_word: צַיִד
  choice: caçador
  rationale: Embora o substantivo possa designar “caça” ou “animal caçado”, na expressão גִבֹּר צַיִד caracteriza uma pessoa notável por caçar; “caçador” é a formulação portuguesa mais natural.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva o sentido básico de estar perante ou na presença de alguém e mantém aberta a possível conotação negativa, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Introduz de maneira natural a explicação para o dito proverbial que vem em seguida.
- source_word: יֵאָמַר
  choice: se diz
  rationale: Reproduz de modo idiomático em português a forma passiva impessoal hebraica que introduz um provérbio.
- source_word: כְּנִמְרֹד
  choice: Como Ninrode
  rationale: A preposição כְּ marca comparação; “Como Ninrode” é uma introdução clara e natural ao dito.
theological_decisions:
- issue: Força interpretativa de לִפְנֵי יְהוָה em relação a Ninrode
  choice: diante de Yahweh
  alternative: em desafio a Yahweh
  rationale: O sentido lexical mais direto é “diante de”, mas o contexto pode permitir uma leitura hostil. O texto principal conserva a formulação menos interpretativa, e a nota registra a alternativa sem eliminar a tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição proverbial do hebraico foi preservada.
