  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: pt
  text: A fronteira dos cananeus estendia-se desde Sidom, na direção de Gerar, até Gaza; e, na direção de Sodoma, Gomorra, Admá e Zeboim, até Lasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Lesa”.
    reason: Variante de transliteração do topônimo hebraico לָשַׁע.
lexical_decisions:
- source_word: וַיְהִי
  choice: estendia-se
  rationale: No contexto da descrição geográfica, a forma narrativa de היה introduz a extensão da fronteira. “Estendia-se” expressa em português natural o valor copulativo e espacial sem recorrer ao literalismo pouco idiomático “e aconteceu que era”.
- source_word: גְּבוּל
  choice: fronteira
  rationale: O substantivo designa aqui o limite territorial dos cananeus. “Fronteira” é claro, corrente e apropriado à sequência de indicações geográficas.
- source_word: הַכְּנַעֲנִי
  choice: dos cananeus
  rationale: Embora o gentílico esteja morfologicamente no singular, ele tem sentido coletivo no contexto; o plural em português comunica naturalmente a referência ao povo.
- source_word: מִצִּידֹן
  choice: desde Sidom
  rationale: A preposição marca o ponto inicial da fronteira. “Desde” combina naturalmente com “até” e Sidom é a forma tradicional corrente do topônimo em português.
- source_word: בֹּאֲכָה
  choice: na direção de
  rationale: A expressão idiomática das descrições de fronteira indica orientação ou percurso rumo a determinado lugar. “Na direção de” preserva esse sentido sem introduzir um sujeito indefinido como em “quando se vai”.
- source_word: גְרָרָה
  choice: Gerar
  rationale: Forma tradicional e corrente do topônimo em português; o ה direcional é expresso pela locução “na direção de”.
- source_word: עַד
  choice: até
  rationale: Na fórmula geográfica, indica o limite alcançado pela fronteira; “até” é a correspondência portuguesa direta e natural.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forma consagrada do topônimo em português.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodoma, Gomorra, Admá e Zeboim
  rationale: Empregam-se as formas portuguesas correntes dos topônimos. A enumeração com vírgulas e um “e” final é idiomática em português e preserva a sequência geográfica.
- source_word: לָשַׁע
  choice: Lasa
  rationale: “Lasa” transpõe para a ortografia portuguesa a vocalização massorética do topônimo; a variante “Lesa” é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de topônimos reconhecíveis para leitores brasileiros e amplamente compreensíveis no espaço lusófono. A construção mantém as duas orientações geográficas do hebraico e evita tornar mais preciso do que o texto o traçado exato da fronteira.
