  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: pt
  text: Destes, as terras costeiras das nações[a] foram separadas em seus territórios, cada qual segundo a sua língua,[b] segundo os seus clãs, em suas nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ilhas das nações”. O termo hebraico pode indicar ilhas ou regiões costeiras e marítimas.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “cada homem segundo a sua língua”; trata-se de uma expressão distributiva com o sentido de “cada qual segundo a sua língua”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Destes
  rationale: 'A preposição מִן com o demonstrativo indica origem: os grupos ou territórios mencionados procedem dos descendentes anteriormente listados.'
- source_word: נִפְרְדוּ
  choice: se separaram
  rationale: O nifal de פרד expressa separação ou divisão. A forma pronominal portuguesa preserva a possibilidade de separação ou distribuição sem especificar um agente.
- source_word: אִיֵּי הַגּוֹיִם
  choice: as terras costeiras das nações
  rationale: אִיִּים pode designar ilhas ou regiões costeiras e marítimas. Esta formulação mantém a relação de construção do hebraico sem transformar explicitamente os territórios em povos.
- source_word: בְּאַרְצֹתָם
  choice: em seus territórios
  rationale: אֶרֶץ refere-se aqui às áreas territoriais ocupadas pelos grupos; 'territórios' distingue naturalmente esta expressão das terras costeiras mencionadas antes.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: cada qual segundo a sua língua
  rationale: אִישׁ tem valor distributivo nesta construção. 'Cada qual' é inclusivo e natural, e 'segundo a sua língua' conserva a força classificatória de לְ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה, neste contexto genealógico e étnico, indica grupos de parentesco mais amplos do que a família nuclear.
- source_word: בְּגוֹיֵהֶם
  choice: em suas nações
  rationale: A expressão mantém a preposição hebraica e o sentido de גּוֹי como povo ou nação, encerrando a série de agrupamentos territoriais, linguísticos e familiares.
theological_decisions:
- issue: Referente de אִיֵּי הַגּוֹיִם e sujeito de נִפְרְדוּ
  choice: Manter 'as terras costeiras das nações se separaram'
  alternative: Interpretar como 'os povos das terras costeiras se espalharam'
  rationale: O hebraico nomeia literalmente as ilhas ou terras costeiras das nações. Embora o contexto permita entender os povos que as habitavam, explicitar 'povos' resolveria uma metonímia que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a sequência classificatória do hebraico. 'Terras costeiras' preserva a ambiguidade geográfica essencial, enquanto a nota registra a alternativa literal 'ilhas'.
