base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: pt
  text: Estas são as famílias dos filhos de Noé[a], segundo suas linhagens, em suas nações; e, a partir delas, as nações se separaram pela terra depois do dilúvio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clãs”.
    reason: lexical_alternative
  - marker: b
    text: Ou “se espalharam” ou “foram divididas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: Designa agrupamentos de parentesco; “famílias” é natural e claro, enquanto “clãs” permanece uma alternativa válida.
- source_word: לְתוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No resumo genealógico, תּוֹלְדוֹת aponta para gerações, descendência ou linhas genealógicas; “linhagens” expressa essa organização sem sugerir apenas gerações cronológicas.
- source_word: בְּגוֹיֵהֶם
  choice: em suas nações
  rationale: Mantém o valor associativo da preposição ב e apresenta as linhagens como organizadas em seus respectivos povos nacionais.
- source_word: וּמֵאֵלֶּה
  choice: e delas
  rationale: Retoma naturalmente, em português, as famílias ou linhagens mencionadas, conservando a ideia de origem expressa por מִן.
- source_word: נִפְרְדוּ
  choice: se espalharam
  rationale: O nifal de פרד indica separação ou dispersão. No contexto da distribuição geográfica dos povos, “se espalharam” comunica naturalmente o resultado sem excluir a ideia de separação.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos distintos povos nacionais descendentes dos filhos de Noé; “nações” é a equivalência contextual direta.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: A construção expressa a distribuição dos povos na terra; “pela terra” é idiomático em português e preserva o alcance amplo do resumo.
- source_word: אַחַר הַמַּבּוּל
  choice: depois do dilúvio
  rationale: Tradução temporal direta e natural, com referência ao dilúvio narrado anteriormente.
theological_decisions:
- issue: Alcance de אֶרֶץ no resumo da dispersão pós-dilúvio
  choice: terra em sentido amplo
  alternative: uma terra ou região local
  rationale: Gênesis 10 resume a distribuição dos povos descendentes de Noé, favorecendo o alcance universal de “terra” sem restringi-lo a um território específico.
- issue: Nuance de נִפְרְדוּ
  choice: se espalharam
  alternative: se separaram / foram divididas
  rationale: A forma hebraica comporta separação e dispersão. O texto principal usa uma formulação portuguesa natural para a distribuição geográfica, e a nota preserva explicitamente as alternativas mais formais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva a estrutura de resumo do hebraico, e as notas registram alternativas lexicais genuínas sem sobrecarregar o texto.
