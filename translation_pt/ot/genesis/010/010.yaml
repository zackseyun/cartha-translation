base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: pt
  text: O início do seu reino foi Babel[a], Ereque, Acade e Calné[b], na terra de Sinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Babilônia”.
    reason: lexical_alternative
  - marker: b
    text: Ereque é geralmente identificada com a antiga Uruk; Acade é geralmente identificada com Akkad.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: foi
  rationale: A forma narrativa de היה funciona aqui como cópula no passado; “foi” é natural em português e introduz adequadamente a descrição.
- source_word: רֵאשִׁית
  choice: O princípio de
  rationale: Preserva o sentido de começo ou primeira parte do domínio de Ninrode sem especificar indevidamente “capital” ou “cidade principal”.
- source_word: מַמְלַכְתּוֹ
  choice: seu reino
  rationale: Como a oração enumera cidades do domínio de Ninrode, “reino” comunica com clareza o sentido de domínio régio.
- source_word: בָּבֶל
  choice: Babel
  rationale: Mantém a forma hebraica tradicional e a ligação literária com Gênesis 11; “Babilônia” permanece como alternativa em nota.
- source_word: אֶרֶךְ
  choice: Ereque
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas da forma hebraica, sem substituir o nome textual pela identificação histórica Uruk.
- source_word: אַכַּד
  choice: Acade
  rationale: Forma portuguesa consagrada para o topônimo correspondente ao hebraico אַכַּד.
- source_word: כַלְנֵה
  choice: Calné
  rationale: Representa em português a forma do Texto Massorético neste versículo, sem harmonizá-la com topônimos semelhantes de outras passagens.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: na terra de Sinar
  rationale: Preserva tanto o substantivo geográfico אֶרֶץ quanto o topônimo Sinar em formulação natural e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de topônimos legíveis para o público brasileiro e amplamente reconhecíveis no mundo lusófono. A construção “O princípio do seu reino” conserva a possível ideia de início ou primeira extensão do reino, sem resolver a expressão como referência inequívoca a uma capital.
