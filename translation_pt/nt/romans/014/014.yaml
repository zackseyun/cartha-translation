id: ROM.14.14
reference: Romans 14:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: pt
  text: Sei e estou convencido, no Senhor Jesus, de que nada é impuro em si mesmo, a não ser que alguém considere alguma coisa impura; para essa pessoa, ela é impura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: Sei
  rationale: Equivalente cognitivo direto, natural e digno em português.
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: O perfeito expressa uma convicção firme e estabelecida; esta formulação é corrente e preserva esse valor.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  rationale: Mantém a preposição e evita definir além do texto se a convicção vem por autoridade, comunhão ou esfera de relação com o Senhor.
- source_word: κοινόν
  choice: impuro
  rationale: No contexto de alimentos e pureza, indica algo tido por profano ou ritualmente contaminado, não apenas comum. A alternativa mais literal é registrada em nota.
- source_word: δι’ ἑαυτοῦ
  choice: em si mesmo
  rationale: Expressa de modo idiomático que a impureza não pertence intrinsecamente à coisa.
- source_word: τῷ λογιζομένῳ
  choice: para quem considera
  rationale: Comunica o ato de julgar ou ter algo por impuro sem reduzir o termo a uma opinião passageira.
- source_word: τι
  choice: alguma coisa
  rationale: Forma natural para o objeto indefinido desta afirmação geral.
- source_word: ἐκείνῳ κοινόν
  choice: para essa pessoa ela é impura
  rationale: Preserva a aplicação individual marcada pelo dativo e evita restringir desnecessariamente o referente ao masculino.
theological_decisions:
- issue: Sentido de κοινός em relação a alimentos e pureza
  choice: impuro
  alternative: comum; profano
  rationale: Paulo nega que algo seja intrinsecamente contaminante, mas afirma que, para quem o considera impuro, isso é impuro. A tradução comunica o contexto de pureza sem transformar a percepção da consciência em impureza objetiva universal.
- issue: Relação expressa por ἐν κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  alternative: pelo Senhor Jesus; em união com o Senhor Jesus
  rationale: A formulação preserva a amplitude da expressão grega e não decide silenciosamente entre fonte, autoridade e esfera de união.
- issue: Força de εἰ μή
  choice: mas
  alternative: exceto que; a não ser que
  rationale: Aqui a expressão introduz uma ressalva ou contraste quanto à pessoa que julga algo impuro, não uma exceção que torne a coisa intrinsecamente impura. “Mas” transmite essa tensão com clareza em português.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é digna e acessível; “no Senhor Jesus” preserva a ambiguidade relacional do original, e a repetição de “impuro” mantém a força argumentativa do versículo.
