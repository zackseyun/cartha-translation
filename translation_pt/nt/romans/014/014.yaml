revisions:
- from: Sei e estou convencido no Senhor Jesus de que nada é impuro em si mesmo; mas, para quem considera alguma coisa impura[a], para essa pessoa ela é impura.
  to: Sei e estou convencido, no Senhor Jesus, de que nada é impuro em si mesmo, a não ser que alguém considere alguma coisa impura; para essa pessoa, ela é impura.
  rationale: Substituiu-se “mas” por “a não ser que” para representar de modo mais direto εἰ μή como ressalva. Ajustaram-se vírgulas e “para essa pessoa, ela é impura” para maior legibilidade, preservando a repetição, a aplicação individual do dativo e a ambiguidade relacional de “no Senhor Jesus”. A âncora da nota foi mantida em “impura”.
  reviewer_model: gpt-5.6-terra
