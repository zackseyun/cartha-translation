review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem οἶδα, πέπεισμαι, ἐν κυρίῳ Ἰησοῦ, κοινόν e δι’ ἑαυτοῦ. Contudo, “mas” para εἰ μή enfraquece a ressalva explícita do grego; uma formulação como “a não ser que” a reproduz de modo mais fiel sem sugerir impureza intrínseca.
  naturalness: O português é claro e natural. A repetição de “impuro” é justificadamente paulina. “Para essa pessoa ela é impura” é compreensível, mas a estrutura pode ser ligeiramente mais fluida sem perda de precisão.
  terminology: “Impuro” comunica adequadamente κοινός neste contexto de pureza. A nota “Ou ‘comum’” preserva a alternativa lexical relevante; “ritualmente impuro ou profano” explica o uso contextual sem impor leitura doutrinária.
  issues:
  - severity: medium
    issue: A ressalva εἰ μή é traduzida por “mas”.
    rationale: Embora “mas” indique contraste, εἰ μή significa mais precisamente “a não ser que/excepto que” e introduz a qualificação pessoal da afirmação anterior. Traduzir a ressalva explicitamente mantém melhor a estrutura e a lógica do original.
  revised_text: Sei e estou convencido, no Senhor Jesus, de que nada é impuro em si mesmo, a não ser que alguém considere alguma coisa impura; para essa pessoa, ela é impura.
  revised_footnotes:
  - marker: a
    text: Ou “comum”. O termo grego aqui costuma se referir a algo considerado ritualmente impuro ou profano.
    reason: lexical_alternative
