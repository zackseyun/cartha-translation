  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: pt
  text: Acolham quem é fraco na fé,[a] não para discussões sobre opiniões.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebam quem é fraco na fé”. O verbo grego pode significar receber alguém em sua companhia ou comunhão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não para julgar raciocínios” ou “não para contendas acerca de raciocínios”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: quem é fraco
  rationale: O particípio presente substantivado descreve a pessoa sem acrescentar “na consciência”, ideia possível no contexto, mas ausente da expressão grega.
- source_word: τῇ πίστει
  choice: na fé
  rationale: O dativo indica o aspecto em que a pessoa é fraca. “Na fé” mantém πίστις sem transformá-la explicitamente em um corpo objetivo de doutrina.
- source_word: προσλαμβάνεσθε
  choice: acolham
  rationale: O imperativo médio significa receber alguém junto de si, em convivência ou comunhão. “Acolham” expressa isso de maneira natural e calorosa em português moderno.
- source_word: μὴ εἰς
  choice: mas não para
  rationale: A construção aponta para uma finalidade que deve ser evitada. O acréscimo de “mas” torna claro, em português, o contraste entre acolher e fazê-lo com uma finalidade indevida.
- source_word: διακρίσεις
  choice: discutir
  rationale: Neste contexto, o substantivo envolve avaliações ou controvérsias sobre pensamentos. A forma verbal produz uma frase natural sem reduzir a ideia a distinções neutras.
- source_word: διαλογισμῶν
  choice: opiniões
  rationale: O termo pode indicar pensamentos, raciocínios ou opiniões. “Opiniões” comunica com clareza os pontos controversos em vista, enquanto a nota preserva alternativas.
- source_word: δὲ
  choice: mas
  rationale: A partícula introduz a exortação com leve valor de transição ou contraste. Em português, “mas” foi colocado antes da proibição, onde o contraste é mais natural, sem inserir um marcador temporal inexistente.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto trata da fraqueza do crente quanto a convicções sobre práticas discutíveis. “Fé” preserva o termo teológico amplo e não especifica além do texto.
- issue: Natureza de διακρίσεις διαλογισμῶν
  choice: discutir opiniões
  alternative: julgar pensamentos controversos; brigar por causa de raciocínios
  rationale: A construção grega admite mais de uma relação entre os substantivos. A tradução principal expressa a leitura contextual mais provável, e a nota conserva a ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acolham” é idiomático no contexto comunitário; “quem é fraco” evita a rigidez de “aquele que é fraco”. A ambiguidade da expressão final é preservada em nota.
