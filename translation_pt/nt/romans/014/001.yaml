    rationale: διακρίσεις διαλογισμῶν abrange mais especificamente disputas, distinções/julgamentos ou controvérsias relativas a raciocínios/opiniões. A formulação nominal “discussões sobre opiniões” e alternativas na nota exprimem melhor esse alcance.
