  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: pt
  text: 'Pois foi para isto que o Messias morreu e voltou a viver[a]: para governar tanto os mortos como os vivos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “viveu”; mais explicitamente, “ressuscitou”. O grego diz literalmente “morreu e viveu”, e o contexto indica vida após a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: Pois foi para isto que
  rationale: Expressa de modo natural em português tanto a função explicativa de γάρ como a finalidade indicada por εἰς τοῦτο.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título Χριστός pelo seu sentido, com o artigo exigido pelo uso natural em português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Correspondência direta e natural para o aoristo de ἀποθνῄσκω.
- source_word: ἔζησεν
  choice: voltou a viver
  rationale: A sequência 'morreu e viveu' aponta, no contexto, para vida após a morte; esta formulação comunica essa implicação sem substituir o verbo por um termo mais específico para ressurreição.
- source_word: ἵνα
  choice: para
  rationale: Introduz claramente a finalidade e evita uma construção portuguesa pesada com 'para que pudesse'.
- source_word: κυριεύσῃ
  choice: ser Senhor
  rationale: Preserva a ideia verbal de exercer senhorio e sua ligação lexical com κύριος, sem reduzir o sentido apenas a governar.
- source_word: νεκρῶν καὶ ζώντων
  choice: tanto dos mortos como dos vivos
  rationale: Mantém o paralelismo substantivado e o alcance inclusivo da construção grega.
theological_decisions:
- issue: Sentido de ἔζησεν após ἀπέθανεν
  choice: voltou a viver
  alternative: viveu; ressuscitou
  rationale: O contexto indica vida após a morte, mas o grego emprega o verbo geral 'viver', não o verbo específico 'ressuscitar'. A tradução explicita apenas o valor contextual mínimo e registra alternativas em nota.
- issue: Força cristológica de κυριεύσῃ
  choice: ser Senhor tanto dos mortos como dos vivos
  alternative: governar sobre os mortos e os vivos; dominar os mortos e os vivos
  rationale: A opção conserva a relação lexical com 'Senhor' e a afirmação de senhorio do Messias, sem acrescentar uma formulação doutrinária externa ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o encadeamento argumentativo de Paulo e a tensão lexical do verbo ἔζησεν.
