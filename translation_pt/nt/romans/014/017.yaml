id: ROM.14.17
reference: Romans 14:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: pt
  text: Pois o Reino de Deus não consiste em comer e beber, mas em justiça[a], paz e alegria no Espírito Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: Reino
  rationale: É a tradução consagrada e natural em português para βασιλεία neste contexto, preservando a amplitude do conceito sem restringi-lo apenas ao ato de reinar.
- source_word: βρῶσις καὶ πόσις
  choice: comer e beber
  rationale: Os dois substantivos de ação são traduzidos simetricamente por infinitivos, de modo natural em português e coerente com o contexto das práticas alimentares discutidas.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, “justiça” abrange tanto a retidão quanto aquilo que é justo e é o equivalente corrente de δικαιοσύνη; a alternativa “retidão” explicita sua dimensão moral.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente direto e natural, adequado à harmonia relacional e comunitária em vista.
- source_word: χαρά
  choice: alegria
  rationale: Equivalente idiomático que preserva o sentido afetivo e teológico do termo.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: Preserva a preposição ἐν e sua possível nuance de esfera ou meio; o uso paulino favorece a referência ao Espírito Santo.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior de forma natural e digna em português.
theological_decisions:
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o equivalente português mais estabelecido e pode incluir conduta reta e relações justas. Como “retidão” pode destacar melhor o aspecto moral em certos contextos, essa alternativa é preservada em nota.
- issue: Referente de πνεύματι ἁγίῳ
  choice: Espírito Santo
  alternative: espírito santo
  rationale: Embora o grego não tenha artigo, o uso paulino e a construção favorecem a referência ao Espírito Santo; a tradução não reduz a preposição a uma nuance exclusivamente instrumental.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não consiste em” expressa naturalmente a predicação grega οὐ… ἐστιν, evitando a formulação menos idiomática “não é comer e beber”. O marcador [a] aparece imediatamente após o termo ao qual se refere.
