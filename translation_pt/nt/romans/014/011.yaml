source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: pt
  text: 'Pois está escrito:


    “‘Tão certo como eu vivo’, diz o Senhor, ‘todo joelho se dobrará diante de mim, e toda língua confessará[a] a Deus.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhecerá” ou “louvará a Deus”. O verbo grego pode expressar confissão, reconhecimento ou louvor, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada e natural em português para introduzir uma citação das Escrituras; preserva o estado resultante do perfeito passivo.
- source_word: Ζῶ ἐγώ
  choice: Tão certo como eu vivo
  rationale: Expressa em português atual a força solene e semelhante a juramento da fórmula divina, sem reduzi-la à afirmação simples “eu vivo”.
- source_word: κύριος
  choice: Senhor
  rationale: Equivalente normal de κύριος; mantém a forma do texto grego sem substituí-la tipograficamente pelo nome divino hebraico.
- source_word: ἐμοὶ
  choice: diante de mim
  rationale: Com o ato de dobrar o joelho, esta formulação é natural em português e comunica submissão dirigida à pessoa divina, embora o dativo também possa ser vertido literalmente por “a mim”.
- source_word: κάμψει πᾶν γόνυ
  choice: todo joelho se dobrará
  rationale: Preserva a imagem corporal e a ordem abrangente da expressão grega em linguagem bíblica clara e corrente.
- source_word: πᾶσα γλῶσσα
  choice: toda língua
  rationale: Mantém a metáfora corporal e sua ressonância escriturística, sem a achatar em “toda pessoa”.
- source_word: ἐξομολογήσεται
  choice: confessará
  rationale: Retém a amplitude lexical do verbo, que pode indicar confissão pública, reconhecimento ou louvor; as nuances alternativas são registradas em nota.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Representa explicitamente o dativo e conserva a mudança textual entre “diante de mim” e “a Deus”.
theological_decisions:
- issue: Relação entre “Senhor”, “mim” e “Deus” na citação
  choice: Conservar “diz o Senhor ... diante de mim ... confessará a Deus” sem harmonizar os referentes.
  alternative: Mudar o final para “me confessará” ou explicitar na tradução uma identificação cristológica entre o Senhor e Deus.
  rationale: O texto grego preserva uma tensão entre a fala divina na primeira pessoa e a referência final a Deus. A tradução deve manter essa forma e permitir suas implicações teológicas, sem impor uma resolução interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A disposição em linhas evidencia o caráter de citação sem alterar seu conteúdo. O marcador da nota foi colocado após “confessará”, termo ao qual a alternativa lexical efetivamente se refere.
