  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: pt
  text: Pois, se o seu irmão[d] se entristece por causa de comida[a], você já não anda de acordo com o amor. Não destrua[b], por causa da sua comida, aquele por quem o Messias[c] morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do que você come”. O grego se refere à comida em geral, não apenas à carne.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não arruíne” ou “não faça perecer”. O verbo grego é forte e pode indicar grave dano espiritual; o versículo não especifica a implicação doutrinária exata.'
    reason: alternative_reading
  - marker: c
    text: 'Grego: “Cristo”; aqui traduzido como “o Messias” porque Χριστός funciona como título.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “irmão ou irmã”. O grego usa “irmão” no masculino singular, que pode referir-se de modo representativo a outro membro da comunidade de fé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: comida / com a sua comida
  rationale: 'O termo designa comida em geral, não especificamente carne. A construção com o dativo é expressa como meio ou ocasião: “com a sua comida”.'
- source_word: ἀδελφός
  choice: irmão
  rationale: Mantém o masculino singular do grego; o possível uso representativo na comunidade é explicado em nota.
- source_word: λυπεῖται
  choice: fica entristecido
  rationale: Comunica tristeza ou aflição causada pela conduta alheia, sem definir além do texto a natureza do dano.
- source_word: κατὰ ἀγάπην
  choice: de acordo com o amor
  rationale: Reflete de perto a preposição κατά e apresenta o amor como padrão ético da conduta.
- source_word: περιπατεῖς
  choice: anda
  rationale: Preserva a metáfora ética paulina de andar, natural e reconhecível em português.
- source_word: ἀπόλλυε
  choice: não destrua
  rationale: Conserva a força da advertência sem decidir se se trata de ruína espiritual temporal ou perdição final.
- source_word: ὑπὲρ οὗ
  choice: por quem
  rationale: Forma natural em português que preserva o sentido de agir ou morrer em favor de alguém.
- source_word: Χριστός
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός, tornando seu significado transparente.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e natural do aoristo.
- source_word: ἐκεῖνον
  choice: aquele
  rationale: Preserva a ênfase demonstrativa no indivíduo afetado.
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Mantém tanto a ligação explicativa com o argumento anterior quanto a forma condicional.
theological_decisions:
- issue: Força de ἀπόλλυε em relação ao irmão mais fraco
  choice: não destrua
  alternative: não arruíne; não faça perecer
  rationale: A formulação mantém a severidade do verbo, mas não resolve debates sobre dano espiritual, apostasia ou perdição final.
- issue: Referente de ἀδελφός
  choice: irmão no texto principal
  alternative: irmão ou irmã; outro crente
  rationale: A forma grega é masculina singular, embora possa representar qualquer membro da comunidade cristã.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, o termo tem valor titular; “Messias” comunica seu significado em vez de apenas transliterá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora paulina de “andar” foi preservada, e a ordem da segunda frase foi ajustada com vírgulas para evitar ambiguidade sem perder a ênfase do original.
