  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: pt
  text: Quem come não despreze quem não come; e quem não come não julgue quem come, pois Deus o acolheu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o aceitou” ou “o recebeu”. O verbo também pode transmitir o sentido de acolhê-lo na comunhão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: quem come
  rationale: O particípio presente substantivado designa a pessoa caracterizada por comer; “quem come” é natural em português e conserva a formulação genérica.
- source_word: τὸν μὴ ἐσθίοντα
  choice: quem não come
  rationale: Preserva o contraste direto do grego sem especificar vegetarianismo, abstinência ritual ou determinados alimentos.
- source_word: ἐξουθενείτω
  choice: não despreze
  rationale: “Desprezar” expressa de modo conciso a ideia de considerar alguém sem valor ou tratá-lo com desdém.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: e quem não come
  rationale: O paralelismo já evidencia o contraste marcado por δέ; “e” produz uma coordenação natural em português sem eliminar a oposição.
- source_word: κρινέτω
  choice: não julgue
  rationale: Mantém a amplitude de κρίνω no contexto; “condenar” restringiria indevidamente o sentido.
- source_word: γὰρ
  choice: pois
  rationale: Introduz com naturalidade a razão para as duas proibições.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome objeto singular preserva a forma do grego e deixa em aberto a extensão retórica do referente.
- source_word: προσελάβετο
  choice: acolheu
  rationale: “Acolher” comunica recepção relacional e inclusão na comunhão, em harmonia com o uso do verbo no contexto de Romanos 14–15.
theological_decisions:
- issue: Alcance do contraste entre comer e não comer
  choice: Manter a formulação genérica “quem come” e “quem não come”.
  alternative: Explicitar “quem come de tudo” e “quem se abstém de certos alimentos”.
  rationale: Embora o contexto trate de práticas alimentares, o versículo formula o contraste simplesmente como comer e não comer; a tradução não acrescenta uma interpretação contextual ao texto.
- issue: Referente de αὐτόν em “Deus o acolheu”
  choice: Conservar o pronome singular sem explicitar seu referente.
  alternative: Traduzir “Deus acolheu essa pessoa” ou identificar especificamente aquele que come.
  rationale: O antecedente imediato é quem come, mas o argumento recíproco pode alcançar qualquer dos envolvidos. O pronome preserva a ambiguidade e a força retórica do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela foi preservada. O marcador [a] aparece no texto principal e esclarece a nuance relacional de προσελάβετο.
