  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: pt
  text: É bom não comer carne, nem beber vinho, nem fazer nada que leve seu irmão a tropeçar, a ser levado a tropeçar ou a se enfraquecer[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais inclusivo neste contexto, “seu irmão ou sua irmã”, isto é, outra pessoa que crê.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos não trazem “a ser levado a tropeçar ou a se enfraquecer”.
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: É bom
  rationale: Expressa a avaliação moral de uma conduta como boa, apropriada e digna de aprovação, em linguagem portuguesa natural.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: não comer carne
  rationale: Preserva de modo direto a construção infinitiva e entende κρέα, neste contexto alimentar, como carne.
- source_word: μηδὲ πιεῖν οἶνον
  choice: nem beber vinho
  rationale: Mantém a coordenação cumulativa de μηδέ e traduz οἶνος pelo equivalente comum e preciso, vinho.
- source_word: μηδὲ ἐν ᾧ
  choice: nem fazer qualquer outra coisa que leve
  rationale: 'O grego deixa elíptica a ação final. A expressão portuguesa explicita apenas o necessário: qualquer conduta que se torne ocasião de dano ao irmão.'
- source_word: ὁ ἀδελφός σου
  choice: seu irmão
  rationale: Mantém o masculino singular do texto grego; no contexto, o termo pode representar qualquer pessoa da comunidade de fé, esclarecimento preservado em nota.
- source_word: προσκόπτει
  choice: a tropeçar
  rationale: Conserva a metáfora paulina de encontrar um obstáculo e sofrer prejuízo moral ou espiritual.
- source_word: σκανδαλίζεται
  choice: a cair em pecado
  rationale: Comunica o sentido passivo e figurado de ser levado à queda ou ao pecado, evitando o possível sentido moderno meramente emocional de 'escandalizar-se'.
- source_word: ἀσθενεῖ
  choice: a se enfraquecer
  rationale: Preserva a ideia contextual de enfraquecimento da consciência ou da fé sem especificar além do texto.
theological_decisions:
- issue: Sentido representativo de ἀδελφός
  choice: seu irmão
  alternative: seu irmão ou sua irmã; outro irmão na fé
  rationale: A tradução principal conserva o masculino singular do grego, enquanto a nota esclarece que, no contexto comunitário, a referência pode incluir tanto homens quanto mulheres.
- issue: Natureza da queda expressa por σκανδαλίζεται
  choice: cair em pecado
  alternative: escandalizar-se; ser levado a tropeçar
  rationale: O contexto trata de uma conduta que prejudica espiritualmente outro crente. A formulação explicita esse valor ético sem reduzir o verbo a sentir ofensa nem confundi-lo inteiramente com προσκόπτει.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. A repetição de “nem” preserva a progressão retórica do grego; “qualquer outra coisa” torna natural em português a elipse da última oração.
