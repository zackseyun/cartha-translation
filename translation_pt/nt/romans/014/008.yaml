id: ROM.14.8
reference: Romans 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: pt
  text: Pois, se vivemos, vivemos para o Senhor[a]; e, se morremos, morremos para o Senhor. Portanto, quer vivamos, quer morramos, somos do Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao Senhor”, nas expressões repetidas “vivemos para o Senhor” e “morremos para o Senhor”. O dativo grego pode indicar relação, orientação ou benefício; “para o Senhor” mantém amplo esse conjunto de sentidos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pertencemos ao Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Pois, se
  rationale: Mantém γάρ como explicação ligada ao argumento anterior e introduz com naturalidade em português o primeiro membro do par condicional.
- source_word: ζῶμεν / ζῶμεν
  choice: vivemos / vivemos
  rationale: Traduz ζάω de modo uniforme; o português, como o inglês, expressa naturalmente com a mesma forma o subjuntivo e o indicativo presentes neste contexto.
- source_word: τῷ κυρίῳ
  choice: para o Senhor
  rationale: O dativo expressa relação, orientação ou benefício. “Para o Senhor” é natural em português, mantém a repetição e evita restringir o sentido apenas a serviço ou autoridade.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título teologicamente significativo sem explicitar além do texto grego o seu referente.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: morremos / morremos
  rationale: Traduz diretamente o evento genérico de morrer, sem impor sentido progressivo.
- source_word: οὖν
  choice: Portanto
  rationale: Marca claramente a inferência resultante das duas orações anteriores.
- source_word: τοῦ κυρίου ἐσμέν
  choice: somos do Senhor
  rationale: Reproduz de forma concisa e idiomática o genitivo de posse, preservando a forte ideia de pertencimento.
theological_decisions:
- issue: Referente e força de κύριος
  choice: Manter “Senhor” sem especificar o referente no corpo do texto.
  alternative: “Mestre” ou uma identificação explícita como “Senhor Jesus”.
  rationale: Romanos 14:9 aponta contextualmente para Cristo, mas o versículo emprega apenas κύριος. “Senhor” conserva tanto a referência cristológica contextual quanto a ressonância teológica mais ampla.
- issue: Nuance relacional de viver e morrer τῷ κυρίῳ
  choice: “para o Senhor”, preservando orientação, relação e possível benefício.
  alternative: “ao Senhor”, “pelo Senhor” ou uma paráfrase como “sob a autoridade do Senhor”.
  rationale: O dativo admite mais de uma nuance, e a conclusão “somos do Senhor” enfatiza pertencimento. A tradução não deve reduzir o sentido somente a serviço, causa ou autoridade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção paralela e a repetição do original foram preservadas sem produzir sintaxe artificial.
