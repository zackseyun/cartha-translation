id: ROM.14.5
reference: Romans 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: pt
  text: Uma pessoa considera um dia superior a outro[a], enquanto outra considera iguais todos os dias[b]. Cada um esteja plenamente convencido em sua própria mente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “julga um dia mais importante que outro”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todo dia”; no contexto, o sentido é “todos os dias como iguais” ou “todos os dias da mesma maneira”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “esteja plenamente seguro” ou “esteja plenamente persuadido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: considera
  rationale: Neste contexto, o verbo expressa uma avaliação ou distinção, não uma condenação. “Considera” comunica isso com naturalidade em português e permite manter o mesmo verbo nas duas orações.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: um dia superior a outro
  rationale: A construção com παρά estabelece uma comparação entre dias. A formulação preserva essa distinção sem especificar sábado, festa ou dia de jejum.
- source_word: πᾶσαν ἡμέραν
  choice: iguais todos os dias
  rationale: Literalmente, a expressão diz “todo dia”; a noção de igualdade entre os dias está implícita no contraste com a oração anterior e precisa ser explicitada para que o sentido seja natural em português.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém o caráter singular e distributivo do grego, com valor representativo e inclusivo no contexto.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: em sua própria mente
  rationale: Traduz diretamente a ideia de entendimento ou faculdade de pensar e preserva a ênfase reflexiva de ἰδίῳ.
- source_word: πληροφορείσθω
  choice: esteja plenamente convencido
  rationale: O imperativo presente exprime plena convicção ou certeza pessoal. A formulação é clara e corrente sem acrescentar a ideia de infalibilidade.
theological_decisions:
- issue: Natureza dos “dias” mencionados
  choice: Manter a referência geral a dias, sem identificá-los.
  alternative: Especificá-los como sábados, festas judaicas, dias de jejum ou dias devocionais.
  rationale: O versículo não identifica quais dias estão em vista; especificá-los resolveria indevidamente uma questão interpretativa.
- issue: Valor de πᾶσαν ἡμέραν no contraste
  choice: Explicitar que a outra pessoa considera iguais todos os dias.
  alternative: Traduzir apenas “considera todo dia”.
  rationale: A igualdade não aparece como palavra isolada no grego, mas é comunicada pela estrutura contrastiva; explicitá-la torna o sentido inteligível sem definir a prática em questão.
- issue: Forma singular masculina de ἕκαστος
  choice: Usar “cada um” com sentido representativo.
  alternative: Usar uma formulação plural ou impessoal.
  rationale: A opção preserva o número singular e a forma do original, sem excluir mulheres do alcance contextual da exortação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Considera” evita que “julga” seja entendido principalmente como condenação, enquanto “superior” conserva a comparação. Não se especifica a natureza dos dias. Todos os marcadores de nota aparecem junto ao trecho correspondente.
