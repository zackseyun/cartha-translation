  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: pt
  text: Uma pessoa crê que pode comer de tudo[a], mas a pessoa fraca[b] come legumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está convencida de que pode comer todas as coisas”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “fraca” se refere à fraqueza na fé ou na consciência quanto às práticas alimentares; veja Romanos 14:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Uma pessoa
  rationale: Introduz naturalmente o primeiro elemento do contraste, preservando o singular representativo sem sugerir que se trate apenas de um homem.
- source_word: πιστεύει
  choice: crê
  rationale: Com o infinitivo, expressa aqui uma convicção pessoal sobre o que se pode comer. “Crê” mantém a ligação lexical com o campo da fé, enquanto a construção completa esclarece o sentido contextual.
- source_word: φαγεῖν πάντα
  choice: que pode comer de tudo
  rationale: A formulação é idiomática em português e comunica uma alimentação sem restrições. “Pode” explicita a permissibilidade implícita no contexto, sem transformar a frase em uma autorização objetiva do narrador.
- source_word: ὁ δὲ
  choice: mas a que
  rationale: Marca o segundo elemento contrastante e retoma “pessoa”; o feminino gramatical concorda com esse substantivo sem atribuir sexo à pessoa referida.
- source_word: ἀσθενῶν
  choice: é fraca
  rationale: O particípio substantivado caracteriza a pessoa como fraca. A tradução não acrescenta “na fé” ao texto principal, pois essa especificação vem do contexto imediato, sobretudo de Romanos 14:1.
- source_word: λάχανα
  choice: legumes
  rationale: Designa produtos cultivados de horta, isto é, vegetais. “Legumes” é uma opção corrente e clara em português, mais ampla e adequada aqui do que “ervas”.
- source_word: ἐσθίει
  choice: come
  rationale: Traduz diretamente o verbo. Não se acrescenta “somente”, pois a exclusividade é sugerida pelo contraste, mas não está expressa no grego.
theological_decisions:
- issue: Natureza da fraqueza em ἀσθενῶν
  choice: “a que é fraca”, sem especificar “na fé” no texto principal
  alternative: “a que é fraca na fé”
  rationale: Romanos 14:1 enquadra a fraqueza no âmbito da fé ou da consciência quanto às práticas alimentares, mas o versículo 2 diz apenas “a que é fraca”. A formulação preserva a concisão e a tensão do texto.
- issue: Sentido de πιστεύει com φαγεῖν πάντα
  choice: convicção pessoal de que se pode comer de tudo
  alternative: declaração de fé salvadora ou autorização absoluta dada pelo narrador
  rationale: A construção grega apresenta o conteúdo da convicção da pessoa no contexto de práticas alimentares disputadas; não define a natureza da fé salvadora nem resolve por si só toda a questão ética.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “pessoa” é evitada na segunda oração por retomada pronominal. Os marcadores seguem a ordem em que aparecem no texto.
