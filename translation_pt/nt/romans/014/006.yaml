  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: pt
  text: Quem dá importância ao dia[a] faz isso para o Senhor. E quem come, come para o Senhor, pois dá graças a Deus; e quem não come, não come para o Senhor e dá graças a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quem considera o dia” ou “quem observa o dia”; o verbo grego pode indicar dirigir a atenção a algo ou dar-lhe importância. Aqui, provavelmente se refere a considerar o dia de modo especial.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: dá importância / faz isso
  rationale: φρονέω, neste contexto, indica considerar ou tratar um dia como significativo. “Dá importância ao dia” comunica essa consideração prática sem especificar que tipo de observância está em vista; na segunda ocorrência, “faz isso” evita uma repetição pouco natural em português, preservando o sentido.
- source_word: τὴν ἡμέραν
  choice: ao dia
  rationale: Mantém a referência definida do grego ao dia em discussão, sem identificá-lo como sábado, festa ou dia de jejum.
- source_word: κυρίῳ
  choice: para o Senhor
  rationale: 'O dativo expressa orientação ou propósito: a prática é realizada em referência ao Senhor e por causa dele. “Para o Senhor” é natural e preserva essa relação.'
- source_word: ὁ ἐσθίων / ἐσθίει
  choice: quem come / come
  rationale: O presente exprime uma prática geral no debate sobre alimentos. A forma simples mantém o paralelismo e soa natural em português.
- source_word: εὐχαριστεῖ
  choice: dá graças
  rationale: Traduz explicitamente o ato de agradecer e se combina naturalmente com o complemento “a Deus”.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Expressa com clareza o destinatário da ação de graças.
- source_word: ὁ μὴ ἐσθίων / οὐκ ἐσθίει
  choice: quem não come / deixa de comer
  rationale: Mantém o contraste com quem come. “Deixa de comer” explicita no segundo membro que se trata de abstenção deliberada, sem acrescentar qual alimento está em questão.
theological_decisions:
- issue: Sentido de dar importância ao “dia”
  choice: Referência geral a considerar ou observar o dia em discussão em Romanos 14
  alternative: Referência específica ao sábado, a festas judaicas ou a dias de jejum
  rationale: A formulação de Paulo não identifica o dia. A tradução preserva essa generalidade e evita impor uma interpretação histórica ou denominacional específica.
- issue: Referente de κύριος
  choice: o Senhor
  alternative: Deus
  rationale: A tradução conserva o título κύριος como “Senhor”, sem fundi-lo com a referência explícita a Deus na ação de graças.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo do versículo, preserva a indefinição quanto à identidade do dia e evita terminologia denominacional.
