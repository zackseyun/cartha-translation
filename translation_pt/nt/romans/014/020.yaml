  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: pt
  text: Não destrua, por causa de comida, a obra de Deus. De fato, todas as coisas são puras[a], mas é mau para a pessoa comer de modo que leve alguém a tropeçar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De fato, tudo é puro”. Como o contexto trata de comida, também se pode traduzir: “De fato, todos os alimentos são puros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “mas é mau para a pessoa que come por meio de tropeço”. A expressão grega pode indicar comer de modo que outra pessoa tropece; também pode ser entendida como comer apesar de um obstáculo de consciência.'
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: por causa de comida
  rationale: Expressa naturalmente a causa ou o motivo indicado por ἕνεκεν com o genitivo, mantendo o contraste entre a comida e o dano causado à obra de Deus.
- source_word: κατάλυε
  choice: não destrua
  rationale: O imperativo presente com μή proíbe a ação; “destruir” preserva a força da metáfora de desfazer ou demolir aquilo que Deus realiza.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: a obra de Deus
  rationale: Tradução direta que conserva a amplitude da expressão, sem restringi-la indevidamente ao indivíduo ou à comunidade.
- source_word: πάντα μὲν καθαρά
  choice: De fato, todas as coisas são puras
  rationale: Mantém a formulação ampla de πάντα e a linguagem de pureza de καθαρά; o contexto deixa claro que a discussão diz respeito à comida.
- source_word: κακὸν
  choice: é mau
  rationale: Conserva a avaliação moral forte de κακόν e soa natural em português nesta construção impessoal.
- source_word: τῷ ἀνθρώπῳ
  choice: para a pessoa
  rationale: ἄνθρωπος tem aqui sentido humano representativo; “pessoa” comunica naturalmente essa referência genérica em português sem acrescentar distinção de sexo inexistente no sentido contextual.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: comer de modo que leve alguém a tropeçar
  rationale: 'Preserva a imagem de πρόσκομμα e expressa de modo claro a leitura causal ou resultativa mais provável: o modo de comer se torna ocasião de tropeço para outra pessoa.'
theological_decisions:
- issue: Alcance de “todas as coisas são puras” no contexto das normas alimentares e da liberdade cristã
  choice: Manter “todas as coisas” e “puras”, deixando o contexto alimentar delimitar a afirmação.
  alternative: Explicitar “todos os alimentos são puros” ou interpretar como “todas as coisas são permitidas”.
  rationale: O grego usa πάντα, sem substantivo expresso, e καθαρά, vocabulário de pureza. A tradução conserva tanto a amplitude formal quanto a ligação contextual com os alimentos, sem transformar a afirmação em paráfrase doutrinária.
- issue: Sentido de διὰ προσκόμματος
  choice: Entender a expressão como comer de modo que leve outra pessoa a tropeçar.
  alternative: Entender como a própria pessoa comer apesar de um escrúpulo ou obstáculo de consciência.
  rationale: A construção admite alguma tensão quanto a quem tropeça. O contexto imediato favorece a preocupação com o dano causado ao irmão, mas a nota registra uma formulação mais literal para não apagar a ambiguidade.
- issue: Referência genérica de τῷ ἀνθρώπῳ
  choice: Traduzir por “para a pessoa”.
  alternative: Traduzir por “para o homem”.
  rationale: Embora a forma grega seja masculina singular, ἄνθρωπος é representativo neste contexto. “Pessoa” preserva o referente humano genérico com maior naturalidade no português contemporâneo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Leve alguém a tropeçar” mantém a imagem paulina e esclarece seu sentido ético sem recorrer a jargão eclesiástico.
