id: ROM.14.22
reference: Romans 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: pt
  text: A fé que você tem[a], guarde-a para si diante de Deus. Feliz é aquele que não condena a si mesmo por aquilo que aprova.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A convicção que você tem”. Aqui, “fé” pode se referir à convicção pessoal sobre questões discutíveis.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não julga a si mesmo por aquilo que aprova”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: fé
  rationale: Mantém a tradução usual de πίστις e, neste contexto de questões discutíveis, permite o sentido contextual de convicção pessoal diante de Deus; a alternativa é registrada em nota.
- source_word: κατὰ σεαυτὸν
  choice: para si
  rationale: Expressa de modo natural a orientação de conservar essa fé ou convicção no âmbito pessoal, sem impô-la aos outros.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Preserva a ideia de presença e responsabilidade perante Deus, mantendo-a distinta de κατὰ σεαυτόν.
- source_word: μακάριος
  choice: Feliz
  rationale: Em português corrente, comunica de modo natural a condição favorável da pessoa descrita, sem reduzir a expressão a uma emoção passageira.
- source_word: κρίνων ἑαυτὸν
  choice: condena a si mesmo
  rationale: Embora κρίνω possa significar julgar, o contexto aponta para um veredito adverso da consciência; 'condena' torna esse sentido claro, enquanto a alternativa mais formal fica em nota.
- source_word: ἐν ᾧ δοκιμάζει
  choice: por aquilo que aprova
  rationale: δοκιμάζω indica avaliar e aprovar; 'por' comunica naturalmente o valor instrumental ou causal de ἐν neste contexto.
theological_decisions:
- issue: Sentido de πίστις no contexto de práticas discutíveis
  choice: fé entendida contextualmente como convicção pessoal diante de Deus sobre a questão em pauta
  alternative: fé como confiança geral em Deus ou fidelidade
  rationale: O contexto imediato trata de práticas discutíveis e consciência. O texto principal mantém o termo teológico usual 'fé', enquanto a nota explicita o possível sentido contextual de 'convicção'.
- issue: Força de κρίνων ἑαυτόν
  choice: condenar a si mesmo
  alternative: julgar a si mesmo
  rationale: O contraste com μακάριος e a ação de aprovar algo favorecem a ideia de incorrer em autocondenação; a nota preserva a tradução lexicalmente mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A construção preserva separadamente “para si” e “diante de Deus”. Todos os marcadores de nota aparecem no texto principal.
