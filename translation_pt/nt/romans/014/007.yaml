  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: pt
  text: Pois nenhum de nós vive para si mesmo[a], e nenhum morre para si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a si mesmo». O dativo reflexivo grego pode ser traduzido mais literalmente assim, mas aqui provavelmente indica viver ou morrer tendo a si próprio como fim último.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: nenhum
  rationale: Como sujeito das duas orações, preserva a negação universal e permite a estrutura paralela natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Expressa a relação explicativa com a afirmação anterior sem tornar a conexão mais causal do que o grego exige.
- source_word: ἡμῶν
  choice: de nós
  rationale: Reproduz naturalmente o genitivo partitivo na expressão «nenhum de nós».
- source_word: ἑαυτῷ
  choice: para si mesmo
  rationale: Comunica que a própria pessoa não é o fim ou ponto de referência último do viver e do morrer, preservando também a possível nuance mais literal explicada na nota.
- source_word: ζῇ
  choice: vive
  rationale: O presente simples expressa adequadamente a verdade geral e mantém a concisão.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação direta e o paralelismo das duas orações.
- source_word: ἀποθνῄσκει
  choice: morre
  rationale: O presente simples representa a declaração geral e corresponde paralelamente a «vive».
theological_decisions:
- issue: Sentido do dativo reflexivo ἑαυτῷ nas duas orações
  choice: para si mesmo
  alternative: a si mesmo; em função de si mesmo
  rationale: No contexto, a vida e a morte não têm a própria pessoa como referência ou fim último, em contraste com a orientação para o Senhor explicitada no versículo seguinte. «Para si mesmo» preserva esse sentido sem acrescentar formulação doutrinária.
- issue: Forma singular masculina do reflexivo
  choice: si mesmo
  alternative: si própria; si mesmos
  rationale: A forma mantém o singular genérico do grego e é idiomática em português; não transforma a afirmação singular em plural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no uso brasileiro e ampla inteligibilidade internacional. O paralelismo e a concisão do grego foram preservados.
