  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: pt
  text: Pois quem serve a Cristo dessa maneira agrada a Deus e é aprovado pelas pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... δουλεύων
  choice: quem serve
  rationale: Expressa naturalmente em português o particípio substantivado grego, sem perder seu sentido geral.
- source_word: ἐν τούτῳ
  choice: dessa maneira
  rationale: Preserva a referência ao modo de vida descrito no contexto, em vez de restringi-la indevidamente a um único elemento.
- source_word: τῷ Χριστῷ
  choice: a Cristo
  rationale: Tradução direta e consagrada do título Χριστός no português bíblico.
- source_word: εὐάρεστος τῷ θεῷ
  choice: agrada a Deus
  rationale: Formulação idiomática que comunica com precisão ser agradável ou aceitável a Deus.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: é aprovado pelas pessoas
  rationale: δόκιμος indica alguém reconhecido como aprovado após avaliação; ἄνθρωποι é genérico neste contexto e é expresso naturalmente por 'pessoas'.
theological_decisions:
- issue: Alcance de ἐν τούτῳ
  choice: dessa maneira
  alternative: nisso
  rationale: A formulação mantém aberta a referência contextual ao serviço caracterizado pela justiça, paz e alegria, sem definir mais precisamente do que o grego.
- issue: Sentido da aprovação humana
  choice: é aprovado pelas pessoas
  alternative: é respeitado pelas pessoas
  rationale: '''Aprovado'' preserva o valor avaliativo de δόκιμος e não transforma a declaração em mera estima social.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A construção é concisa e acompanha de perto a lógica do grego.
