  source_fidelity: O texto traduz com precisão o grego do SBLGNT. «Mas você» preserva adequadamente δέ e a ênfase de σύ; as duas perguntas retóricas, «julga» para κρίνεις e «despreza» para ἐξουθενεῖς, mantêm a distinção lexical do original. «Todos nós compareceremos diante do tribunal de Deus» comunica corretamente πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ, inclusive a imagem forense e a inclusão de Paulo entre os destinatários.
