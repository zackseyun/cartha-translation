  terminology: «Irmão», «julga», «despreza», «tribunal» e «Deus» são escolhas terminologicamente sólidas. A nota lexical sobre «irmão ou irmã» é adequadamente apresentada como alternativa, sem alterar o masculino singular do texto grego. A nota textual está corretamente ancorada em «Deus» e registra a variante «de Cristo»; isso corrige, na apresentação portuguesa, a inversão de âncoras presente no trilho de auditoria inglês.
