id: ROM.14.10
reference: Romans 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: pt
  text: Mas você, por que julga seu irmão[a]? Ou você também, por que despreza seu irmão? Pois todos nós compareceremos diante do tribunal de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu irmão ou sua irmã”; em grego, “seu irmão”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “o tribunal de Cristo”.
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mas você
  rationale: Preserva a força adversativa de δέ e a ênfase do pronome anteposto σύ em português natural.
- source_word: τί κρίνεις
  choice: por que julga
  rationale: Na pergunta retórica, τί tem sentido idiomático de “por que”. “Julga” conserva o alcance de κρίνω sem restringi-lo indevidamente a “condena”.
- source_word: τὸν ἀδελφόν σου
  choice: seu irmão
  rationale: Mantém o masculino singular do grego ἀδελφός; a possível referência inclusiva à irmã na comunidade é indicada em nota.
- source_word: ἢ καὶ σὺ
  choice: Ou você também
  rationale: Conserva a alternativa introduzida por ἤ, a força aditiva de καί e a ênfase no segundo σύ.
- source_word: τί ἐξουθενεῖς
  choice: por que despreza
  rationale: “Despreza” comunica de modo conciso a ideia de tratar alguém como sem valor ou indigno de consideração.
- source_word: πάντες γὰρ
  choice: Pois todos nós
  rationale: “Pois” expressa a função explicativa de γάρ, enquanto “todos nós” explicita corretamente que πάντες inclui Paulo e seus leitores.
- source_word: παραστησόμεθα
  choice: compareceremos diante de
  rationale: No contexto judicial, a forma futura de παρίστημι descreve a apresentação ou comparecimento perante um tribunal.
- source_word: τῷ βήματι
  choice: diante do tribunal
  rationale: βῆμα designa aqui o assento judicial e, por extensão, o tribunal perante o qual alguém comparece; “tribunal” é claro e corrente em português.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Traduz diretamente o genitivo da leitura adotada pelo SBLGNT.
theological_decisions:
- issue: Identidade daquele perante cujo tribunal todos comparecerão
  choice: de Deus
  alternative: de Cristo
  rationale: O texto grego fornecido traz τοῦ θεοῦ. A variante “de Cristo” é registrada em nota, sem harmonizar o texto principal com 2 Coríntios 5:10.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “você” preserva a ênfase retórica do grego; “compareceremos diante do tribunal” mantém a imagem judicial sem recorrer a linguagem excessivamente arcaica.
