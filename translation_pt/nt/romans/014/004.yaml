  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household slave? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: pt
  text: Quem é você para julgar o escravo doméstico[a] de outra pessoa? É diante do seu próprio senhor que ele permanece em pé ou cai. Mas ele será mantido em pé[b], pois o Senhor tem poder para mantê-lo em pé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o servo doméstico de outra pessoa». O termo grego pode designar tanto um servo quanto um escravo pertencente ao pessoal de uma casa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «ele ficará em pé». A forma grega é passiva e, no contexto, indica que o Senhor o sustenta.'
    reason: translation_nuance
  - marker: c
    text: Alguns entendem «o Senhor» como o senhor do escravo dentro da analogia; mais provavelmente, Paulo passa a falar do Senhor em sentido teológico.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Quem é você para julgar
  rationale: Reproduz de modo natural a pergunta retórica enfática e a repreensão direta, sem ampliar o sentido do particípio.
- source_word: ἀλλότριον οἰκέτην
  choice: o escravo doméstico de outra pessoa
  rationale: οἰκέτης designa alguém ligado ao serviço de uma casa e pode denotar servo ou escravo; a escolha preserva tanto o âmbito doméstico quanto a condição social de dependência.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: diante do seu próprio senhor
  rationale: O dativo indica a pessoa perante a qual o escravo é avaliado. «Senhor» preserva a repetição de κύριος e a passagem da analogia para sua aplicação teológica.
- source_word: στήκει ἢ πίπτει
  choice: permanece em pé ou cai
  rationale: Mantém o contraste metafórico e traduz στήκω com sua nuance de continuar firme.
- source_word: σταθήσεται
  choice: será mantido em pé
  rationale: Preserva a forma passiva e a ação de um agente, explicitado na oração seguinte, com português mais natural do que «será feito ficar em pé».
- source_word: δυνατεῖ γὰρ ὁ κύριος
  choice: pois o Senhor tem poder
  rationale: γάρ introduz a razão da afirmação anterior, e δυνατέω comunica capacidade ou poder efetivo.
- source_word: στῆσαι αὐτόν
  choice: para mantê-lo em pé
  rationale: Conserva a ligação verbal com σταθήσεται e a imagem de alguém sustentado para permanecer de pé.
theological_decisions:
- issue: Referente de ὁ κύριος na oração final
  choice: «o Senhor», provavelmente em sentido teológico
  alternative: «seu senhor», continuando apenas a analogia doméstica
  rationale: O artigo e o uso paulino favorecem uma referência ao Senhor, cuja capacidade fundamenta a permanência do crente. A tradução conserva, porém, a continuidade verbal com «seu próprio senhor», sem especificar além do texto se a referência teológica é a Deus ou a Cristo.
- issue: Sentido de permanecer em pé ou cair
  choice: preservar a metáfora sem explicá-la como aprovação, condenação, fidelidade ou salvação
  alternative: explicitar uma dessas interpretações
  rationale: O contexto envolve avaliação e acolhimento pelo Senhor, mas a formulação metafórica admite tensão suficiente para não ser reduzida a uma única categoria teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «em pé» é intencional para conservar a cadeia στήκει/σταθήσεται/στῆσαι; «senhor/Senhor» mantém a conexão de κύριος e sinaliza, sem eliminar a ambiguidade, a provável transição para o referente teológico.
