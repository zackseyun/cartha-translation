  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: pt
  text: Assim, cada um de nós prestará contas de si mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito de si mesmo”; também pode ser entendido de modo idiomático como “por si mesmo”. O grego diz literalmente “acerca de si mesmo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Assim
  rationale: Marca a conclusão decorrente do argumento anterior e soa natural no português contemporâneo.
- source_word: ἕκαστος ἡμῶν
  choice: cada um de nós
  rationale: Preserva a força distributiva de ἕκαστος e o sentido partitivo de ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: de si mesmo
  rationale: Em ligação com a expressão portuguesa “prestar contas”, comunica naturalmente que cada pessoa responderá a respeito de si própria, mantendo a referência reflexiva singular.
- source_word: λόγον δώσει
  choice: prestará contas
  rationale: A locução grega significa dar ou prestar contas em contexto de avaliação ou juízo; esta é a formulação idiomática mais natural em português.
theological_decisions:
- issue: Reflexivo singular em uma declaração de aplicação geral
  choice: de si mesmo
  alternative: de si próprio; por si mesmo
  rationale: O texto apresenta cada pessoa distributivamente no singular. A formulação mantém essa individualidade sem restringir a aplicação do versículo aos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Prestará contas” reproduz de maneira natural a expressão grega de caráter avaliativo ou judicial.
