id: ROM.14.19
reference: Romans 14:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: pt
  text: Portanto, busquemos o que promove a paz e o que contribui para a edificação mútua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Portanto, empenhemo-nos nas coisas da paz e nas coisas da edificação de uns para com os outros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão baseada no argumento anterior. “Portanto” transmite com naturalidade e dignidade essa força inferencial em português.
- source_word: τὰ τῆς εἰρήνης
  choice: o que promove a paz
  rationale: A construção neutra plural com genitivo refere-se às coisas relacionadas à paz. “O que promove a paz” expressa de modo claro seu sentido prático, sem reproduzir literalmente uma construção pouco natural em português.
- source_word: διώκωμεν
  choice: busquemos
  rationale: O subjuntivo presente tem valor exortativo e convoca a comunidade a uma ação contínua. “Busquemos” é corrente e mantém a ideia de empenho intencional; a nota registra a alternativa mais enérgica “empenhemo-nos em”.
- source_word: τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους
  choice: o que contribui para a edificação mútua
  rationale: οἰκοδομή é uma metáfora de construção aplicada ao fortalecimento da comunidade, e εἰς ἀλλήλους indica reciprocidade. A formulação preserva a metáfora tradicional de “edificação” e explicita sua dimensão mútua em português natural.
theological_decisions:
- issue: Âmbito da edificação comunitária
  choice: A exortação convoca os crentes, coletivamente, a promover a paz e a edificação recíproca.
  alternative: Entender a frase apenas como aprimoramento moral individual.
  rationale: A primeira pessoa do plural e o pronome recíproco ἀλλήλους apontam para a vida compartilhada da comunidade no contexto das divergências de consciência de Romanos 14.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é exortativo e digno; “edificação” conserva a metáfora paulina, enquanto “mútua” comunica com clareza a reciprocidade de ἀλλήλους.
