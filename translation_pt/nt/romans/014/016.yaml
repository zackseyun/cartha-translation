id: ROM.14.16
reference: Romans 14:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: pt
  text: Portanto, não deixem que falem mal do bem de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja insultado”, “seja alvo de calúnia” ou, mais literalmente, “seja blasfemado”. O verbo grego pode indicar fala abusiva, injuriosa ou difamatória. “Seja blasfemado” seria mais literal, mas em português pode parecer referir-se especificamente a uma ofensa contra Deus, o que não é exigido neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: não deixem que … seja difamado
  rationale: A construção com μή e o imperativo presente passivo expressa uma proibição. Esta formulação preserva a voz passiva e soa natural em português, enquanto “difamado” comunica fala abusiva ou depreciativa sem sugerir necessariamente blasfêmia contra Deus.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão ou inferência decorrente do argumento anterior e mantém clara a ligação lógica.
- source_word: ὑμῶν
  choice: de vocês
  rationale: O genitivo plural associa o bem aos destinatários. “De vocês” é claro, atual e amplamente compreensível.
- source_word: τὸ ἀγαθόν
  choice: o bem
  rationale: O adjetivo neutro substantivado significa literalmente “o bem” ou “aquilo que é bom”. A expressão compacta conserva a amplitude do referente sem especificá-lo como liberdade, privilégio ou benefício.
theological_decisions:
- issue: Referente de τὸ ἀγαθόν (“o bem de vocês”)
  choice: Manter a expressão ampla “o bem de vocês”.
  alternative: Explicitar como “a liberdade de vocês”, “o privilégio de vocês” ou “aquilo que é bom para vocês”.
  rationale: O texto grego não identifica de modo explícito esse bem. A formulação ampla preserva a possível referência à convicção, à liberdade ou ao benefício dos cristãos nas questões discutidas, sem resolver indevidamente a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O plural “vocês” torna explícito que a exortação se dirige à comunidade. A frase preserva a concisão e a ambiguidade do original.
