source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: pt
  text: Mas quem tem dúvidas, se comer[a], é condenado, pois não o faz por fé; e tudo o que não é por fé é pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque não o faz por convicção”. A expressão grega diz literalmente “de fé” e pode incluir o sentido de agir com convicção firme diante de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: quem tem dúvidas
  rationale: No contexto das dúvidas quanto ao comer, o particípio indica hesitação interior, não discussão com outras pessoas. A formulação é natural e preserva a relação com a consciência.
- source_word: ἐὰν φάγῃ
  choice: se comer
  rationale: O subjuntivo aoristo com ἐάν expressa uma condição; “se comer” é a forma portuguesa natural e fiel.
- source_word: κατακέκριται
  choice: é condenado
  rationale: O perfeito passivo descreve um estado de condenação resultante, sem identificar explicitamente quem condena.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro a razão da condenação.
- source_word: ἐκ πίστεως
  choice: a partir da fé / procede da fé
  rationale: Mantém πίστις como “fé” e conserva a imagem de uma ação cuja origem ou fundamento é a fé, sem reduzi-la apenas à convicção subjetiva.
- source_word: πᾶν ... ὃ
  choice: tudo o que
  rationale: Representa naturalmente em português a construção neutra singular e seu sentido abrangente.
- source_word: ἁμαρτία ἐστίν
  choice: é pecado
  rationale: Preserva a força categórica da construção nominal grega.
theological_decisions:
- issue: Sentido de πίστις neste contexto moral paulino
  choice: fé
  alternative: convicção; confiança; fidelidade
  rationale: O contexto inclui a convicção pessoal diante de Deus, mas “fé” preserva o vocabulário paulino mais amplo e evita limitar o termo a uma preferência subjetiva. A nota registra a nuance contextual.
- issue: Agente e alcance da condenação em κατακέκριται
  choice: é condenado
  alternative: condena a si mesmo; fica condenado diante de Deus
  rationale: O passivo grego não especifica o agente. A tradução mantém essa abertura, sem decidir se o destaque recai sobre o juízo de Deus, a consciência ou ambos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem tem dúvidas” é idiomático; “a partir da fé” e “procede da fé” preservam a metáfora de origem expressa por ἐκ sem tornar a frase excessivamente literal.
