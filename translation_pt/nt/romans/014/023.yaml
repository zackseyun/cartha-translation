revisions:
- from: Mas quem tem dúvidas é condenado se comer[a], porque não age a partir da fé; e tudo o que não procede da fé é pecado.
  to: Mas quem tem dúvidas, se comer[a], é condenado, pois não o faz por fé; e tudo o que não é por fé é pecado.
  rationale: A revisão preserva a ambiguidade do passivo “é condenado”, conserva “fé” como termo principal para πίστις e substitui uma paráfrase mais explícita por uma formulação portuguesa idiomática e mais próxima da elipse grega. A nota foi ajustada para distinguir adequadamente a expressão grega da sua explicação contextual.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:25:43Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução capta corretamente a hesitação interior (διακρινόμενος), a condição de comer, a condenação em voz passiva e a afirmação final. Contudo, “não age a partir da fé” explicita um verbo pessoal que não está no grego e torna a frase mais interpretativa do que necessário. A formulação idiomática “não o faz por fé” mantém o referente contextual (comer) e expressa melhor ἐκ πίστεως.
  naturalness: “Mas quem tem dúvidas, se comer, é condenado” é claro, atual e mantém a sequência condicional do grego. “Por fé” é mais natural em português do que “a partir da fé” neste contexto e também preserva a concisão paulina.
  terminology: “Fé” para πίστις e “é pecado” para ἁμαρτία ἐστίν são apropriados. A nota deve apresentar “convicção” como alternativa contextual sem afirmar de modo impreciso que “a partir da fé” seja a formulação literalmente grega.
  issues:
  - severity: low
    issue: “não age a partir da fé” introduz uma explicitação desnecessária.
    rationale: O grego traz elipticamente οὐκ ἐκ πίστεως (“não de/por fé”), sem o verbo “agir”. Embora o sentido contextual seja claro, “não o faz por fé” é mais direto, natural e próximo da construção original.
  - severity: low
    issue: A nota descreve “a partir da fé” como expressão literalmente grega.
    rationale: ἐκ πίστεως corresponde mais estritamente a “de fé” ou, em português idiomático contextual, “por fé”; “a partir da fé” é uma interpretação possível da relação de origem, não uma equivalência literal.
  revised_text: Mas quem tem dúvidas, se comer[a], é condenado, pois não o faz por fé; e tudo o que não é por fé é pecado.
  revised_footnotes:
