source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: pt
  text: 'Portanto, não julguemos mais uns aos outros; em vez disso, decidam isto: não colocar no caminho de um irmão[a] uma pedra de tropeço ou uma armadilha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no caminho de um irmão ou irmã». O grego traz «irmão» no singular, usado aqui para se referir a outro crente.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «uma causa de queda» ou «uma ocasião de pecado». Aqui, «armadilha» é algo que leva outra pessoa a cair em pecado, não apenas algo que fere seus sentimentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Portanto, não ... mais
  rationale: Preserva tanto a inferência marcada por οὖν quanto a ideia de cessar uma prática expressa por Μηκέτι, em português natural.
- source_word: ἀλλήλους κρίνωμεν
  choice: julguemos ... uns aos outros
  rationale: O subjuntivo exortativo é reproduzido por «julguemos», e «uns aos outros» expressa a reciprocidade de ἀλλήλους.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Em vez disso, tomem esta decisão
  rationale: O imperativo plural «tomem» mantém a mudança do subjuntivo inclusivo para uma exortação direta. «Decisão» comunica o segundo sentido contextual de κρίνω sem sugerir julgamento de outra pessoa; «em vez disso» representa ἀλλὰ ... μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: não pôr
  rationale: Expressa de modo conciso o conteúdo da decisão indicado pelo infinitivo articular.
- source_word: πρόσκομμα
  choice: tropeço
  rationale: Mantém a imagem concreta de algo que faz alguém tropeçar e funciona naturalmente no contexto ético e espiritual.
- source_word: τῷ ἀδελφῷ
  choice: diante de um irmão
  rationale: Conserva o singular masculino do grego e retrata algo colocado no caminho do irmão; uma nota esclarece o uso representativo.
- source_word: ἢ σκάνδαλον
  choice: nem armadilha
  rationale: Depois da negação, «nem» é a coordenação idiomática em português para o grego ἢ. «Armadilha» retém a imagem de σκάνδαλον como algo que apanha ou leva à queda, evitando o sentido moderno de mero melindre associado a «ofensa».
theological_decisions:
- issue: Sentido representativo de ἀδελφῷ
  choice: irmão
  alternative: irmão ou irmã; outro cristão
  rationale: O texto principal conserva o masculino singular da fonte, enquanto a nota informa que, no contexto, se refere de modo representativo a outro crente.
- issue: Força ética de σκάνδαλον
  choice: armadilha
  alternative: causa de queda; ocasião de pecado; ofensa
  rationale: «Armadilha» preserva a metáfora e indica algo que leva outro a cair, não simplesmente algo que fere seus sentimentos. A nota explicita a força moral e espiritual sem resolver em excesso a relação entre os dois termos próximos.
- issue: Repetição de κρίνω / κρίνατε
  choice: julguemos / tomem esta decisão
  alternative: julguemos / julguem isto
  rationale: A tradução deixa clara a virada retórica entre julgar pessoas e decidir sobre a própria conduta. Repetir «julgar» seria mais formal, mas menos natural e poderia obscurecer o contraste pretendido.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. A pontuação em duas frases torna clara a mudança da proibição para a decisão positiva. Os marcadores foram colocados após a frase a que cada nota se aplica.
