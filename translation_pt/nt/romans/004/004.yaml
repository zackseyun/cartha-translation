source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: pt
  text: Àquele que trabalha, o salário não é creditado como favor, mas como algo devido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: ao que trabalha
  rationale: O particípio presente substantivado descreve genericamente a pessoa que trabalha; a formulação é direta e natural em português.
- source_word: μισθὸς
  choice: o salário
  rationale: No contexto de trabalho e pagamento, “salário” expressa com precisão a remuneração obtida pelo trabalho.
- source_word: λογίζεται
  choice: é creditado
  rationale: Preserva a metáfora contábil de λογίζομαι e se ajusta naturalmente ao singular “salário”.
- source_word: κατὰ χάριν
  choice: como favor
  rationale: No contraste com pagamento devido, “como favor” comunica algo concedido sem obrigação e mantém o vínculo lexical com χάρις sem tornar a frase abstrata.
- source_word: ὀφείλημα
  choice: dívida
  rationale: O termo designa aquilo que é devido; “dívida” preserva de modo conciso a força da antítese entre favor e pagamento devido.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca a progressão ou contraste no argumento, já perceptível na construção contextual; inserir “agora” sugeriria temporalidade ausente do grego, e “mas” no início seria pesado antes do contraste interno.
theological_decisions:
- issue: Sentido de χάρις no contraste entre trabalho e pagamento
  choice: como favor
  alternative: segundo a graça
  rationale: A formulação torna claro que o salário não é concedido gratuitamente, sem apagar o sentido de favor presente em χάρις. Evita também impor uma elaboração doutrinária além da comparação econômica do versículo.
- issue: Força de ὀφείλημα
  choice: como dívida
  alternative: como obrigação; como aquilo que é devido
  rationale: “Dívida” retém a imagem forte de algo que se deve ao trabalhador. As alternativas são semanticamente possíveis, mas atenuam ou expandem a expressão grega.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial. Não foram necessárias notas de rodapé, pois as principais nuances cabem no texto.
