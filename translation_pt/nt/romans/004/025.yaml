source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: pt
  text: o qual foi entregue por causa das nossas transgressões e foi ressuscitado para a nossa justificação[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por causa da nossa justificação».'
    reason: alternative_reading
  - marker: b
    text: «Justificação» também pode ser expressa como «absolvição» ou «ser declarado justo».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: foi entregue
  rationale: Preserva a forma passiva do grego e sua provável força de passivo divino, em linguagem portuguesa natural e digna.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: por causa das nossas transgressões
  rationale: διά com acusativo tem aqui sentido causal; a expressão explicita com clareza que nossas transgressões motivaram sua entrega.
- source_word: παραπτώματα
  choice: transgressões
  rationale: Expressa atos de violação moral com maior precisão que o termo mais amplo «pecados» e é corrente no registro bíblico moderno.
- source_word: ἠγέρθη
  choice: ressuscitou
  rationale: É a forma mais natural em português para a passiva grega no contexto da ressurreição, sem negar que Deus o ressuscitou.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: para a nossa justificação
  rationale: Mantém no texto principal o sentido prospectivo, de finalidade ou resultado, sem eliminar o sentido causal gramaticalmente possível, registrado em nota.
- source_word: δικαίωσιν
  choice: justificação
  rationale: Preserva o sentido jurídico e soteriológico do termo paulino; a nota oferece formulações mais transparentes ao leitor comum.
theological_decisions:
- issue: Se διὰ τὴν δικαίωσιν ἡμῶν indica finalidade/resultado ou causa.
  choice: para a nossa justificação
  alternative: por causa da nossa justificação
  rationale: A leitura prospectiva apresenta a ressurreição em relação à realização da justificação dos fiéis e se ajusta ao paralelismo salvífico do versículo. Como διά com acusativo também pode ser causal, essa possibilidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém tom digno e conciso. «Ressuscitou» foi preferido a «foi ressuscitado» por ser idiomático em português, enquanto «foi entregue» conserva a passiva significativa da primeira oração.
