lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Mantém o vínculo argumentativo de γάρ com o que precede e traduz diretamente a condição introduzida por εἰ.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐξ ἔργων
  choice: pelas obras
  rationale: Expressa de modo conciso e idiomático as obras como base ou meio alegado da justificação.
- source_word: ἐδικαιώθη
  choice: foi justificado
  rationale: Preserva a forma passiva e o vocabulário paulino tradicional, sem decidir no corpo do texto entre as nuances de justificar e declarar justo.
- source_word: ἔχει καύχημα
  choice: ele tem do que se gloriar
  rationale: Comunica naturalmente em português que Abraão teria fundamento ou motivo para gloriar-se, conservando a força de καύχημα.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: mas não diante de Deus
  rationale: É uma formulação natural que preserva o contraste com a avaliação ou presença de Deus sem explicá-lo além do texto.
theological_decisions:
- issue: Se a condição deve ser apresentada como real ou meramente hipotética
  choice: Pois, se Abraão foi justificado pelas obras
  alternative: Pois, se Abraão tivesse sido justificado pelas obras
  rationale: A formulação direta preserva a construção condicional grega e a tensão do argumento, sem antecipar na tradução a conclusão desenvolvida por Paulo.
- issue: Sentido forense ou transformativo de ἐδικαιώθη
  choice: foi justificado
  alternative: foi declarado justo
  rationale: O texto principal mantém o termo paulino tradicional e sua amplitude semântica; a alternativa forense legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase acompanha o raciocínio compacto de Paulo; o travessão realça o contraste final sem acrescentar conteúdo interpretativo.
