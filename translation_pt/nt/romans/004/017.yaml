source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: pt
  text: 'como está escrito: “Eu fiz de você pai de muitas nações”[a] — diante daquele Deus em quem ele creu, que dá vida aos mortos e chama as coisas que não existem como se existissem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “nações” também pode ser traduzido por “gentios”; na citação de Gênesis, porém, o sentido mais amplo é mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais interpretativo: “chama à existência as coisas que não existem”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula consagrada de citação das Escrituras; o presente português comunica adequadamente o resultado permanente do perfeito passivo grego.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: pai de muitas nações
  rationale: No contexto da citação de Gênesis, ἐθνῶν designa de modo amplo nações ou povos, e não especificamente gentios em contraste com judeus.
- source_word: τέθεικά σε
  choice: Eu fiz de você
  rationale: Expressa de modo natural o perfeito grego e a validade contínua da declaração divina, sem restringir o verbo ao sentido de mera nomeação.
- source_word: κατέναντι
  choice: diante de
  rationale: Preserva o sentido relacional de estar perante Deus e soa natural no português atual.
- source_word: οὗ ἐπίστευσεν
  choice: em quem ele creu
  rationale: A construção portuguesa com «crer em» comunica que a fé de Abraão estava dirigida a Deus, mantendo a referência pronominal do grego.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: que dá vida aos mortos
  rationale: Formulação clara e digna que conserva a caracterização de Deus como aquele que vivifica os mortos.
- source_word: καλοῦντος
  choice: chama
  rationale: Mantém o verbo básico do grego sem incorporar ao texto principal a interpretação mais explícita «chama à existência».
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: as coisas que não existem como se existissem
  rationale: Permanece próxima da expressão grega, embora em português natural, e preserva sua abertura interpretativa em vez de explicitar criação a partir do nada.
theological_decisions:
- issue: Se a cláusula final deve ser apresentada explicitamente como criação do que não existe ou permanecer mais próxima da formulação condensada do grego.
  choice: chama as coisas que não existem como se existissem
  alternative: chama à existência as coisas que não existem
  rationale: A linguagem pode apontar para o poder criador de Deus, mas o grego não inclui expressamente «à existência». O texto principal conserva a tensão, e a nota oferece a interpretação mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, mas a estrutura da citação e a formulação teologicamente aberta da cláusula final foram preservadas. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
