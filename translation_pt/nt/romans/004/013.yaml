source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: pt
  text: Pois a promessa feita a Abraão ou à sua descendência[a] — de que ele seria herdeiro do mundo — não foi por meio da lei, mas por meio da justiça da fé[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “semente”. A palavra grega está no singular, mas pode ter sentido coletivo: “descendência” ou “descendentes”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio da justiça que vem pela fé” ou “por meio da justiça mediante a fé”.
    reason: alternative_reading
  - marker: c
    text: A palavra traduzida como “justiça” também pode ser traduzida como “retidão”, conforme o contexto.
    reason: lexical_alternative
  - marker: d
    text: A palavra traduzida como “fé” também pode significar “fidelidade” ou “confiança”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: promessa
  rationale: É o equivalente natural no uso paulino e preserva a força de uma promessa divina.
- source_word: σπέρματι
  choice: descendência
  rationale: O substantivo grego está no singular, mas pode ter sentido coletivo; “descendência” preserva essa característica com naturalidade em português.
- source_word: κληρονόμον ... κόσμου
  choice: herdeiro do mundo
  rationale: Mantém explícita a linguagem de herança e não restringe o alcance amplo de κόσμος.
- source_word: διὰ νόμου
  choice: por meio da lei
  rationale: Expressa com clareza a ideia de meio ou instrumento; no argumento paulino, a referência é naturalmente entendida como a lei.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é o equivalente português tradicional e semanticamente amplo para δικαιοσύνη, embora “retidão” também possa expressar aspectos do termo.
- source_word: πίστεως
  choice: fé
  rationale: É o sentido mais natural no contraste paulino entre lei e fé, sem excluir em nota as possibilidades lexicais “fidelidade” e “confiança”.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: por meio da justiça da fé
  rationale: Preserva a construção genitiva compacta do grego e evita definir de modo excessivo a relação exata entre justiça e fé.
theological_decisions:
- issue: Relação expressa em δικαιοσύνης πίστεως
  choice: justiça da fé
  alternative: justiça que vem pela fé; justiça mediante a fé
  rationale: A formulação compacta conserva a ambiguidade da relação genitiva e o contraste entre lei e fé, sem impor uma explicação doutrinária mais específica que o texto.
- issue: Referente implícito de αὐτόν em “ser herdeiro”
  choice: Abraão como referente gramatical principal, com sua descendência incluída na promessa
  alternative: Abraão ou sua descendência, tomados distributivamente, seriam herdeiros
  rationale: O pronome grego está no masculino singular e remete mais diretamente a Abraão, embora a promessa seja dirigida a Abraão ou à sua descendência; a tradução mantém o singular sem tentar eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. “Descendência” conserva o singular coletivo; “por meio de” torna explícita a relação instrumental; a expressão “justiça da fé” mantém deliberadamente a concisão e a tensão teológica do grego.
