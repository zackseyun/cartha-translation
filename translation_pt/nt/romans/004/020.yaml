  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: pt
  text: Mas, quanto à promessa de Deus, não vacilou em incredulidade; pelo contrário, foi fortalecido na fé,[a] dando glória a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi fortalecido pela fé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Mas, diante da promessa de Deus
  rationale: εἰς com o acusativo tem aqui sentido referencial, e δέ introduz contraste. “Diante da” é natural em português e expressa a postura de Abraão em relação à promessa, sem sugerir movimento.
- source_word: οὐ διεκρίθη
  choice: não vacilou
  rationale: No contexto, διακρίνω descreve hesitação ou divisão interior. “Não vacilou” preserva esse alcance melhor que uma formulação limitada à dúvida intelectual.
- source_word: τῇ ἀπιστίᾳ
  choice: em incredulidade
  rationale: O dativo pode indicar esfera ou modo. “Em incredulidade” mantém o paralelismo antitético com “na fé” e evita definir de modo excessivo a função do dativo.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Marca oposição enfática entre não vacilar e ser fortalecido; a locução é clara e idiomática em português moderno.
- source_word: ἐνεδυναμώθη
  choice: foi fortalecido
  rationale: Preserva a voz passiva do verbo e não explicita um agente que o texto não nomeia.
- source_word: τῇ πίστει
  choice: na fé
  rationale: Preserva o paralelismo com “em incredulidade”. Como o dativo também pode ser instrumental, a alternativa “pela fé” é registrada em nota.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: dando glória a Deus
  rationale: A construção participial conserva a relação fluida com a ação anterior e apresenta o dar glória como ação concomitante, sem impor uma conexão mais específica.
theological_decisions:
- issue: Se a resposta de Abraão deve ser descrita como mera dúvida intelectual ou como vacilação mais ampla
  choice: não vacilou em incredulidade
  alternative: não duvidou por causa da incredulidade
  rationale: “Vacilou” reflete melhor a ideia contextual de hesitação ou divisão interior e mantém a tensão retórica com “foi fortalecido na fé”, sem reduzir a questão a incerteza intelectual.
- issue: Função do dativo τῇ πίστει
  choice: na fé
  alternative: pela fé
  rationale: A leitura locativa ou de esfera destaca o estado em que Abraão foi fortalecido e preserva o paralelo com τῇ ἀπιστίᾳ; a leitura instrumental continua possível e é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vacilou” é corrente e preserva a amplitude semântica do grego; “pelo contrário” torna explícito o contraste de ἀλλά. A pontuação mantém o fluxo do período e o marcador [a] aparece imediatamente após a expressão a que se refere.
