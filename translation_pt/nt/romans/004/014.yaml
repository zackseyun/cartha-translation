id: ROM.4.14
reference: Romans 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: pt
  text: Pois, se os que são da Lei[a] são herdeiros, a fé foi esvaziada[b], e a promessa foi anulada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que se baseiam na Lei” ou “os que vivem segundo a Lei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a fé ficou vazia” ou “foi tornada sem valor”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a promessa ficou sem efeito” ou “foi invalidada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: os que são da Lei
  rationale: Preserva a expressão paulina compacta e define essas pessoas por sua relação com a Lei, sem explicá-la de modo excessivo como mera observância ou dependência.
- source_word: κληρονόμοι
  choice: herdeiros
  rationale: É a forma portuguesa natural e consagrada no contexto de promessa e herança.
- source_word: κεκένωται
  choice: foi esvaziada
  rationale: Mantém a metáfora de tornar a fé vazia de conteúdo ou eficácia e expressa o estado resultante do perfeito grego.
- source_word: πίστις
  choice: a fé
  rationale: No argumento de Romanos 4, preserva com clareza o contraste de Paulo entre fé e Lei, sem excluir o sentido de confiança.
- source_word: κατήργηται
  choice: foi anulada
  rationale: Comunica que a promessa perdeu sua validade ou efeito, sem sugerir necessariamente destruição ou desaparecimento.
- source_word: ἐπαγγελία
  choice: a promessa
  rationale: Tradução direta e natural; o artigo definido remete à promessa específica discutida no contexto.
theological_decisions:
- issue: Sentido de πίστις no contraste paulino com νόμος
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto contrapõe a herança mediante a Lei à herança mediante a fé. “Fé” preserva a terminologia e a tensão do argumento sem restringir o termo à fidelidade humana ou divina.
- issue: Identidade de οἱ ἐκ νόμου
  choice: os que são da Lei
  alternative: os que se baseiam na Lei; os que vivem segundo a Lei
  rationale: A formulação escolhida conserva a ambiguidade relacional da expressão grega e evita decidir se Paulo enfatiza identidade, procedência, dependência ou prática da Lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lei” recebe inicial maiúscula para indicar a Lei mosaica no contexto. A repetição de “foi” preserva o paralelismo dos dois verbos no perfeito e seus estados resultantes.
