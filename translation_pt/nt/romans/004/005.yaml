  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: pt
  text: Ao que não trabalha, mas crê[a] naquele que justifica[b] o ímpio, sua fé lhe é creditada[c] como justiça[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “declara justo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “é contada” ou “é computada”.
    reason: lexical_alternative
  - marker: d
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: para quem não trabalha
  rationale: Reproduz o particípio substantivado com μή em português natural e mantém o contraste imediato com crer, sem ampliar a afirmação para uma condenação geral de todo trabalho.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: porém crê naquele
  rationale: “Crê naquele” é uma formulação corrente para πιστεύω ἐπί e conserva tanto o campo lexical da fé quanto a ideia de confiança dirigida a Deus.
- source_word: τὸν δικαιοῦντα
  choice: aquele que justifica
  rationale: Mantém o termo paulino central e sua ligação lexical e teológica com δικαιοσύνη, sem decidir por uma explicação confessional específica.
- source_word: τὸν ἀσεβῆ
  choice: o ímpio
  rationale: “Ímpio” expressa de modo conciso a falta de reverência ou oposição a Deus indicada por ἀσεβής e é natural no registro bíblico português.
- source_word: λογίζεται
  choice: é contada
  rationale: Preserva a linguagem de consideração ou atribuição de λογίζομαι de forma clara, deixando “creditada” e “computada” como alternativas possíveis.
- source_word: ἡ πίστις αὐτοῦ
  choice: sua fé
  rationale: O contexto contrasta não trabalhar com crer, favorecendo “fé” como atitude de crença e confiança, em vez de “fidelidade”.
- source_word: εἰς δικαιοσύνην
  choice: como justiça
  rationale: A construção λογίζεται ... εἰς indica que a fé é considerada como justiça; “como” comunica essa relação com clareza e sem explicação excessiva.
theological_decisions:
- issue: Sentido de δικαιόω no argumento paulino
  choice: justifica
  alternative: declara justo
  rationale: “Justifica” preserva o termo teológico tradicional e a tensão sem restringir o verbo apenas a uma declaração forense; a alternativa explicativa é registrada em nota.
- issue: Relação entre πίστις e πιστεύω
  choice: fé / crê
  alternative: confiança / confia
  rationale: A escolha mantém a continuidade do grupo lexical da fé. O contexto também contém a noção de confiança, preservada em nota sem substituir o termo principal.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” conserva a amplitude do termo grego e sua ligação com “justifica”; “retidão” expressa uma dimensão possível, mas pode orientar a leitura mais diretamente para uma qualidade moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Porém” evita a repetição pesada de “mas” e conserva o segundo contraste δέ. Os termos paulinos “fé”, “justifica” e “justiça” foram mantidos por continuidade lexical e para não resolver silenciosamente tensões teológicas.
