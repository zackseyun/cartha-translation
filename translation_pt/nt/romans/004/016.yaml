source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: pt
  text: Por isso, é pela fé[a], para que seja segundo a graça, a fim de que a promessa seja garantida a toda a descendência[b] — não somente aos que são da Lei, mas também aos que são da fé de Abraão[c], que é pai de todos nós,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fé” também pode ser entendida como “confiança”; “fidelidade” é menos provável neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “semente”; aqui o termo é coletivo e se refere à descendência de Abraão.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aos que compartilham a fé de Abraão”. O grego traz uma expressão compacta, literalmente próxima de “ao que é da fé de Abraão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e direto a conclusão ou inferência introduzida pela locução grega.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: A preposição ἐκ indica aqui base ou meio; “pela fé” é idiomático em português e mantém o contraste implícito com a Lei.
- source_word: ἵνα κατὰ χάριν
  choice: para que seja segundo a graça
  rationale: Mantém explícita a oração de finalidade e preserva a formulação paulina sem acrescentar um referente que o grego deixa implícito.
- source_word: βεβαίαν
  choice: garantida
  rationale: Comunica que a promessa é firme e segura para os seus destinatários; soa mais natural neste contexto do que “certa”, que poderia ser entendida apenas como verdadeira.
- source_word: ἐπαγγελίαν
  choice: promessa
  rationale: É o equivalente corrente e adequado para a linguagem pactual de Paulo.
- source_word: σπέρματι
  choice: descendência
  rationale: O substantivo grego significa literalmente “semente”, mas aqui é coletivo e designa os descendentes de Abraão.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: não somente à que procede da Lei
  rationale: Conserva o singular coletivo do grego, retomando “descendência”, e representa ἐκ sem transformar a expressão em uma paráfrase doutrinária.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: à que procede da fé de Abraão
  rationale: Preserva a construção compacta e a expressão “fé de Abraão”, sem inserir no texto a explicação interpretativa “que compartilha”.
- source_word: πατὴρ πάντων ἡμῶν
  choice: pai de todos nós
  rationale: Segue de perto o grego e mantém com naturalidade a linguagem familiar e pactual.
theological_decisions:
- issue: O referente implícito em ἐκ πίστεως e em ἵνα κατὰ χάριν
  choice: 'Manter a formulação elíptica: “é pela fé, para que seja segundo a graça”'
  alternative: 'Explicitar: “a promessa vem pela fé, para que dependa da graça”'
  rationale: O grego omite o sujeito ou referente imediato. A tradução mantém essa concisão e evita decidir silenciosamente se Paulo fala especificamente da promessa, da herança ou do modo de recebê-la.
- issue: O sentido de τῷ ἐκ πίστεως Ἀβραάμ
  choice: “à que procede da fé de Abraão”
  alternative: “àqueles que compartilham a fé de Abraão”
  rationale: A alternativa explicita corretamente uma compreensão provável, mas a escolha conserva melhor a construção e a tensão do original, deixando que o contexto identifique as pessoas caracterizadas pela fé de Abraão.
- issue: O valor de πίστις
  choice: “fé”
  alternative: “confiança”
  rationale: “Fé” é natural no argumento de Romanos e preserva a terminologia paulina; “confiança” continua sendo uma possibilidade semântica, enquanto “fidelidade” é menos provável neste contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui a Lei mosaica. O travessão organiza o contraste sem alterar a sintaxe. A vírgula final foi preservada porque a frase continua no versículo seguinte.
