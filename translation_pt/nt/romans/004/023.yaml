  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: pt
  text: Mas não foi somente por causa dele que se escreveu que isso lhe foi creditado,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «isso lhe foi considerado» ou «isso lhe foi levado em conta».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: foi escrito
  rationale: Preserva o passivo e a referência ao registro escrito das Escrituras; na construção portuguesa, «que se escreveu» soa natural.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação ao caso de Abraão e conduz à aplicação feita nos versículos seguintes.
- source_word: δι’ αὐτὸν μόνον
  choice: somente por causa dele
  rationale: Expressa διά com acusativo e conserva a ênfase de que a declaração não foi registrada tendo apenas Abraão em vista.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo do que foi escrito.
- source_word: ἐλογίσθη
  choice: foi atribuído
  rationale: Mantém o sentido contábil de considerar ou lançar algo em favor de alguém, sem explicitar além do texto o referente elíptico.
- source_word: αὐτῷ
  choice: lhe
  rationale: Representa naturalmente em português o dativo «a ele».
theological_decisions:
- issue: Sentido de λογίζομαι no contexto paulino da justificação
  choice: foi atribuído
  alternative: foi considerado; foi creditado
  rationale: «Atribuído» conserva a dimensão de imputação ou lançamento em conta sem definir por si só todo o mecanismo teológico. O pronome «isso» mantém a dependência do contexto anterior, no qual se menciona a justiça.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para evitar rigidez, preservando o contraste de δέ, a exclusividade de μόνον e a passividade de ἐλογίσθη.
