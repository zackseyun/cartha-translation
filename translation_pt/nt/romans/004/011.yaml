id: ROM.4.11
reference: Romans 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: pt
  text: E recebeu o sinal da circuncisão como selo da justiça que vem da fé que ele tinha quando ainda era incircunciso,[a] para que fosse o pai de todos os que creem enquanto incircuncisos,[b] a fim de que a justiça também lhes fosse atribuída.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na incircuncisão”; isto é, quando ainda não havia sido circuncidado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por meio da incircuncisão”; aqui, a expressão indica a condição de estarem incircuncisos.
    reason: lexical_alternative
  - marker: c
    text: Ou “creditada” ou “considerada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: Tradução natural e transparente que preserva a circuncisão como indicador exterior.
- source_word: περιτομή
  choice: circuncisão
  rationale: Termo padrão e preciso para o rito no argumento paulino.
- source_word: σφραγίς
  choice: selo
  rationale: Preserva a metáfora de autenticação ou confirmação sem a explicar em excesso.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, “justiça” é a correspondência lexical natural de δικαιοσύνη e, no contexto, designa a condição justa associada à fé.
- source_word: πίστις
  choice: fé
  rationale: Mantém o termo central do argumento de Paulo; a construção relaciona a justiça com a fé.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: quando ainda era incircunciso
  rationale: Expressa com clareza o estado de Abraão quando tinha essa fé, preservando a força temporal e circunstancial.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: o pai de todos os que creem
  rationale: Formulação idiomática que preserva a linguagem representativa de Paulo.
- source_word: δι’ ἀκροβυστίας
  choice: sem serem circuncidados
  rationale: Comunica a condição na qual essas pessoas creem, evitando a leitura instrumental pouco natural de “por meio da incircuncisão”.
- source_word: λογισθῆναι
  choice: fosse atribuída
  rationale: Preserva a ideia de lançar algo à conta de alguém em português atual; a nota registra alternativas próximas.
- source_word: καί
  choice: também
  rationale: Explicita que a justiça é atribuída igualmente aos crentes incircuncisos.
theological_decisions:
- issue: Relação entre circuncisão e justiça
  choice: A circuncisão é apresentada como sinal e selo da justiça associada à fé que Abraão já tinha quando incircunciso.
  alternative: Uma formulação poderia sugerir que a circuncisão produz ou confere essa justiça.
  rationale: A sequência grega apresenta a circuncisão como atestação posterior, não como o meio pelo qual Abraão obteve justiça.
- issue: Sentido de δικαιοσύνη
  choice: “Justiça” é mantida sem definir no próprio versículo se o termo indica condição justa, declaração favorável ou conduta reta.
  alternative: “Condição de justo” ou “justificação” explicitariam uma interpretação específica.
  rationale: A formulação conserva a amplitude e a tensão do vocabulário paulino, sem importar uma definição confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Incircunciso” é mantido por precisão bíblica, enquanto as construções ao redor são formuladas de modo natural. Todos os marcadores de nota aparecem no texto principal.
