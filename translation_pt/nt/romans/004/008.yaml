  source_fidelity: 'A tradução reproduz todos os elementos essenciais do grego: μακάριος como «Feliz», o singular masculino representativo de ἀνήρ como «homem», a relação pessoal de οὗ/λογίζομαι por «a quem ... atribuirá», a negação enfática οὐ μή por «jamais», κύριος por «Senhor» e ἁμαρτίαν pelo singular categorial «pecado». «Jamais atribuirá» transmite adequadamente a força enfática e prospectiva do subjuntivo aoristo após οὐ μή.'
