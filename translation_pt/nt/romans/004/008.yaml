  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: pt
  text: Feliz o homem a quem o Senhor jamais atribuirá pecado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Feliz a pessoa”; aqui, “homem” tem sentido representativo, não exclusivamente masculino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “certamente não lhe atribuirá pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Expressa de modo natural a condição favorecida por Deus na linguagem das bem-aventuranças; aqui não descreve mera emoção subjetiva.
- source_word: ἀνήρ
  choice: homem
  rationale: Preserva o masculino singular representativo do grego; no contexto, o sentido é genérico, não exclusivamente masculino.
- source_word: οὗ
  choice: a quem
  rationale: Reproduz com naturalidade em português a relação expressa pelo genitivo relativo na construção com λογίζομαι.
- source_word: οὐ μὴ
  choice: jamais
  rationale: Comunica a negação enfática formada por οὐ μή com o subjuntivo.
- source_word: λογίσηται
  choice: atribuirá
  rationale: Mantém a ideia de lançar algo na conta de alguém e se integra ao vocabulário contábil de Romanos 4 sem recorrer ao termo técnico 'imputar'.
- source_word: κύριος
  choice: Senhor
  rationale: É a tradução consagrada e adequada ao contexto de citação das Escrituras.
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: Mantém o singular sem artigo como termo categorial, de modo natural em português.
theological_decisions:
- issue: Linguagem masculina representativa
  choice: Manter 'homem' no texto principal com sentido genérico.
  alternative: Traduzir por 'pessoa'.
  rationale: ἀνήρ é masculino singular, mas neste enunciado funciona representativamente; a nota esclarece que a bem-aventurança não se restringe aos homens.
- issue: Força da negação οὐ μή
  choice: Traduzir por 'jamais atribuirá'.
  alternative: Traduzir por 'certamente não atribuirá'.
  rationale: Ambas preservam a negação enfática; 'jamais' é conciso e natural, enquanto a alternativa explicita a certeza sem enfatizar necessariamente duração temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo solene da citação e a metáfora contábil do contexto.
