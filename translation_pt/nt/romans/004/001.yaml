  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: pt
  text: O que diremos, então, que Abraão, nosso antepassado segundo a carne[a], encontrou?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em linguagem mais direta, “nosso antepassado por descendência física”. A expressão “segundo a carne” também pode estar ligada a “encontrou”: “o que Abraão encontrou segundo a carne”, isto é, por meios humanos ou de um ponto de vista meramente humano.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Então, que diremos
  rationale: Preserva a transição retórica e o tom deliberativo de Paulo em português natural e digno.
- source_word: εὑρηκέναι
  choice: encontrou
  rationale: O pretérito perfeito é a forma idiomática em português para apresentar o resultado a que Abraão chegou; “descobriu” seria possível, mas um pouco mais interpretativo.
- source_word: προπάτορα
  choice: antepassado
  rationale: Expressa com clareza o sentido ancestral de προπάτωρ e mantém a referência singular masculina a Abraão.
- source_word: ἡμῶν
  choice: nosso
  rationale: Mantém explicitamente a identificação compartilhada de Paulo e seus interlocutores com Abraão.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Conserva a expressão paulina e sua ambiguidade genuína, enquanto a nota explica tanto o sentido genealógico quanto a possível ligação com o verbo.
theological_decisions:
- issue: Escopo de κατὰ σάρκα
  choice: No texto principal, qualifica Abraão como “nosso antepassado segundo a carne”, referindo-se à descendência física.
  alternative: 'Pode ligar-se a “encontrou”: “o que Abraão encontrou segundo a carne”, isto é, por meios humanos ou do ponto de vista meramente humano.'
  rationale: A leitura genealógica se ajusta naturalmente à aposição “Abraão, nosso antepassado”, mas a sintaxe grega permite uma ligação alternativa com o verbo; a nota preserva essa tensão sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o registro retórico de Paulo e a expressão teologicamente carregada “segundo a carne”, esclarecendo na nota sua leitura idiomática e a ambiguidade sintática.
