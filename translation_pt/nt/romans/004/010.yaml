  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: pt
  text: Em que condição, então, isso lhe foi atribuído[a]? Quando ele estava circuncidado ou incircunciso? Não quando estava circuncidado, mas quando estava incircunciso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “creditado”, “contado” ou “considerado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Como
  rationale: Mantém o advérbio interrogativo e introduz naturalmente a pergunta sobre a circunstância em que ocorreu a atribuição; o contraste seguinte esclarece o sentido.
- source_word: οὖν
  choice: então
  rationale: Expressa a força inferencial e retomadora do argumento de Paulo em português corrente.
- source_word: ἐλογίσθη
  choice: lhe foi atribuído
  rationale: O passivo de λογίζομαι indica que algo foi posto na conta de Abraão. “Atribuído” é claro, preserva a metáfora contábil sem a tornar excessivamente financeira e o pronome explicita o destinatário implícito no contexto.
- source_word: ἐν περιτομῇ ὄντι
  choice: Ele já era circuncidado
  rationale: Traduz de modo idiomático o estado indicado pelo substantivo com o particípio; “já” explicita o contraste temporal pressuposto pela pergunta sem alterar sua lógica.
- source_word: ἐν ἀκροβυστίᾳ
  choice: ainda era incircunciso
  rationale: Neste contexto, o substantivo designa a condição de não circuncidado. A formulação adjetival é natural em português, e “ainda” ressalta que se trata da situação anterior à circuncisão.
- source_word: οὐκ ... ἀλλ’
  choice: Não ... mas ...
  rationale: Reproduz diretamente a construção contrastiva enfática do grego.
theological_decisions:
- issue: Referente do sujeito implícito de ἐλογίσθη
  choice: isso
  alternative: a justiça
  rationale: O grego não repete aqui o substantivo do contexto anterior. “Isso” conserva a referência anafórica sem inserir explicitamente uma identificação que o versículo deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência “já... ainda...” torna natural o contraste temporal entre a condição posterior e a anterior de Abraão, enquanto “incircunciso” preserva o paralelismo retórico com “circuncidado”.
