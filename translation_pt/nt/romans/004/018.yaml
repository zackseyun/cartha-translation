source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: pt
  text: 'Contra a esperança[a], ele creu em esperança, para tornar-se pai de muitas nações, conforme o que havia sido dito: “Assim será a sua descendência[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além da esperança” ou “contrariando a esperança”.
    reason: lexical_alternative
  - marker: b
    text: Citação de Gênesis 15:5; compare Gênesis 17:5. O grego diz literalmente “a sua semente”, empregando uma palavra singular com sentido coletivo.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: contra toda esperança
  rationale: A expressão comunica que Abraão creu contrariando a expectativa humana normal. O acréscimo idiomático de “toda” torna o paradoxo natural em português sem alterar seu sentido.
- source_word: ἐπ’ ἐλπίδι
  choice: com esperança
  rationale: Expressa a esfera ou disposição esperançosa em que Abraão creu e mantém o contraste retórico com “contra toda esperança” em português corrente.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: Mantém a correspondência direta com a linguagem paulina de crer, sem acrescentar uma interpretação ao verbo.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: para se tornar
  rationale: Preserva a abertura da construção grega a propósito ou resultado, com formulação concisa e natural.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: pai de muitas nações
  rationale: “Nações” reproduz o horizonte da promessa abraâmica melhor que “gentios”, e o português dispensa artigo nesta construção predicativa.
- source_word: κατὰ τὸ εἰρημένον
  choice: conforme o que havia sido dito
  rationale: Reflete a fala anterior ainda válida indicada pelo particípio perfeito passivo, em registro digno e compreensível.
- source_word: Οὕτως ἔσται
  choice: Assim será
  rationale: Reproduz de modo natural e solene a fórmula da citação bíblica, sem recorrer a linguagem arcaica.
- source_word: τὸ σπέρμα σου
  choice: a sua descendência
  rationale: “Descendência” comunica naturalmente em português o sentido coletivo de σπέρμα e preserva sua forma gramatical singular melhor que “descendentes”.
theological_decisions:
- issue: Referência de πολλῶν ἐθνῶν na promessa a Abraão
  choice: “muitas nações”
  alternative: “muitos gentios” ou “muitos povos”
  rationale: O contexto evoca a promessa de Gênesis sobre Abraão como pai de nações. “Gentios” anteciparia e estreitaria indevidamente o contraste posterior entre judeus e não judeus.
- issue: Relação entre a fé de Abraão e ele se tornar pai de muitas nações
  choice: “para se tornar”
  alternative: “de modo que se tornou”
  rationale: A construção εἰς τό com infinitivo pode indicar propósito ou resultado. A tradução mantém a orientação prospectiva sem reduzir a construção a resultado consumado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva o paradoxo entre esperança humanamente impossível e esperança confiante. Os marcadores aparecem em ordem de leitura, e a nota final reúne a referência veterotestamentária e a imagem coletiva de “semente”.
