base_translation:
  language: en
  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: pt
  text: Por isso, lhe foi atribuído[a] como justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “creditado” ou “computado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior e mantém clara a ligação lógica.
- source_word: ἐλογίσθη
  choice: foi atribuído
  rationale: Preserva a voz passiva e comunica a ideia de lançar algo à conta de alguém, sem acrescentar uma formulação doutrinária que não esteja explícita no grego.
- source_word: αὐτῷ
  choice: lhe
  rationale: Representa naturalmente o dativo pessoal e mantém a referência a Abraão.
- source_word: εἰς
  choice: como
  rationale: Na construção com λογίζομαι, indica a condição ou o valor em que algo é considerado; “como” é idiomático em português.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: É o equivalente português mais amplo e tradicional no uso paulino, preservando as dimensões forense, relacional e ética do termo sem reduzi-lo a apenas uma delas.
theological_decisions:
- issue: Como verter a linguagem contábil/declarativa de Paulo sem impor uma teoria específica da imputação
  choice: isso lhe foi atribuído como justiça
  alternative: isso lhe foi creditado como justiça; isso lhe foi computado como justiça
  rationale: A formulação mantém a metáfora de atribuição e a passividade do texto, mas não explica além do que o grego declara. O pronome “isso” conserva a referência contextual à fé de Abraão sem inseri-la explicitamente no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “Por isso, isso” é aceitável, embora marcada, e conserva tanto a conexão inferencial quanto o sujeito implícito retomado do contexto.
