base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: pt
  text: E, sem enfraquecer na fé, ele considerou seu próprio corpo como já sem vida — pois tinha cerca de cem anos — e também o estado de morte do ventre de Sara.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradição textual traz: “ele não levou em conta seu próprio corpo, que já estava sem vida”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “a esterilidade do ventre de Sara”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: sem enfraquecer
  rationale: Reproduz a força verbal do particípio aoristo e indica que Abraão não perdeu a firmeza da fé, em português natural.
- source_word: πίστει
  choice: na fé
  rationale: Neste contexto, refere-se à confiança de Abraão na promessa de Deus; “fé” preserva o termo teológico corrente sem resolver além do necessário.
- source_word: κατενόησεν
  choice: considerou
  rationale: Expressa atenção consciente e ponderada aos fatos, sem sugerir que Abraão os ignorou.
- source_word: νενεκρωμένον
  choice: como já sem vida
  rationale: O particípio perfeito descreve um estado efetivo de incapacidade para gerar, não a morte física literal. A expressão conserva a imagem de morte e permanece compreensível.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: pois tinha cerca de cem anos
  rationale: “Cerca de” representa o valor aproximativo de πού, e “pois” apresenta naturalmente a idade como explicação da condição corporal.
- source_word: νέκρωσιν
  choice: falta de vida
  rationale: Mantém a imagem de morte ligada ao termo anterior, evitando substituir a figura paulina diretamente por “esterilidade”.
- source_word: μήτρας Σάρρας
  choice: ventre de Sara
  rationale: “Ventre” é uma forma concreta, digna e amplamente compreensível de traduzir μήτρα neste contexto reprodutivo.
theological_decisions:
- issue: Se a imagem reprodutiva de morte deve ser suavizada para “esterilidade”
  choice: Manter a linguagem de ausência de vida nas duas referências corporais
  alternative: Traduzir por “corpo incapaz de gerar” e “esterilidade do ventre de Sara”
  rationale: Paulo emprega termos relacionados à morte para pôr em paralelo o corpo de Abraão e o ventre de Sara, ressaltando a impossibilidade humana diante da promessa divina.
- issue: Variante textual quanto à presença de μή antes de κατενόησεν
  choice: Texto principal com “ele considerou”, conforme a leitura do texto SBLGNT fornecido
  alternative: “Ele não levou em conta seu próprio corpo, já sem vida”
  rationale: A variante altera a negação e, portanto, a relação sintática e retórica. Ela é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a imagem paulina de morte sem sugerir morte física literal. Os marcadores seguem a ordem de ocorrência natural no texto português.
