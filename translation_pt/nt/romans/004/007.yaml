  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: pt
  text: Felizes aqueles cujas transgressões da lei foram perdoadas[a] e cujos pecados foram cobertos.
  philosophy: optimal-equivalence
  footnotes:
