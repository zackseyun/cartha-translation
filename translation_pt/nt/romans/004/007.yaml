lexical_decisions:
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em uma bem-aventurança, «felizes» expressa de modo natural e digno a condição favorável declarada por Deus, sem reduzi-la a uma emoção passageira.
- source_word: ἀφέθησαν
  choice: foram perdoadas
  rationale: O passivo de ἀφίημι denota remissão ou perdão; o pretérito perfeito simples é a forma mais natural em português para o aoristo neste contexto.
- source_word: ἀνομίαι
  choice: transgressões da lei
  rationale: Torna transparente a ideia de violação da lei presente em ἀνομία e a distingue de «pecados», embora «iniquidades» permaneça uma alternativa tradicional.
- source_word: ἐπεκαλύφθησαν
  choice: foram cobertos
  rationale: Preserva a metáfora do verbo na citação do Salmo 32, sem convertê-la em uma explicação interpretativa.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: É o equivalente português corrente, claro e consolidado para ἁμαρτίαι.
theological_decisions:
- issue: Relação entre ἀνομίαι e ἁμαρτίαι
  choice: Manter «transgressões da lei» e «pecados» como expressões distintas
  alternative: Traduzir ambos por «pecados» ou outro termo genérico
  rationale: A formulação conserva o paralelismo poético e a diferença lexical do texto, sem impor uma distinção teológica mais rígida do que o versículo estabelece.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva o paralelismo da citação e a metáfora de pecados «cobertos».
