source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: pt
  text: e pai dos circuncidados[a] que não apenas são circuncidados, mas também seguem os passos da fé que nosso pai Abraão tinha quando ainda não era circuncidado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pai da circuncisão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: pai dos circuncidados
  rationale: O genitivo pode ser vertido literalmente como “pai da circuncisão”, mas, no contexto, designa Abraão como pai das pessoas circuncidadas. A formulação escolhida é natural em português e evita sugerir que ele seja pai do rito em si.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: que não têm apenas a circuncisão
  rationale: A expressão grega é literalmente “não somente da circuncisão”. A tradução comunica de modo idiomático que a circuncisão exterior, por si só, não caracteriza o grupo em questão.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: seguem os passos
  rationale: στοιχέω indica andar de modo ordenado ou seguir uma linha, e ἴχνη são pegadas ou rastros. “Seguem os passos” preserva a imagem de imitação e soa natural em português.
- source_word: πίστεως
  choice: fé
  rationale: Neste contexto, πίστις se refere à resposta de confiança de Abraão; “fé” mantém o termo central da argumentação de Paulo sem o reduzir a mera fidelidade humana.
- source_word: ἐν ἀκροβυστίᾳ
  choice: quando ainda não era circuncidado
  rationale: A expressão indica o estado de Abraão quando exerceu fé, antes de receber a circuncisão. A formulação temporal é clara e idiomática.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: que nosso pai Abraão tinha
  rationale: O genitivo é explicitado em português para ligar claramente a fé a Abraão, preservando a importante designação comunitária “nosso pai Abraão”.
theological_decisions:
- issue: Se Abraão é apresentado como pai de todos os circuncidados sem distinção ou apenas dos que unem a circuncisão à fé semelhante à dele
  choice: A oração relativa restringe a referência aos circuncidados que, além de terem a circuncisão, seguem os passos da fé de Abraão.
  alternative: Entender Abraão como pai de todos os circuncidados, sem qualificação.
  rationale: A construção “não... apenas, mas também” qualifica o grupo ligado à circuncisão. A tradução mantém essa restrição sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Seguem os passos” conserva a metáfora sem soar arcaico; “quando ainda não era circuncidado” torna explícito o valor contextual de ἐν ἀκροβυστίᾳ.
