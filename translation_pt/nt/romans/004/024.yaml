id: ROM.4.24
reference: Romans 4:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: pt
  text: mas também por nós, a quem isso será creditado[a] — a nós que cremos[b] naquele que ressuscitou Jesus, nosso Senhor, dentre os mortos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será contado” ou “será atribuído”.
    reason: lexical_alternative
  - marker: b
    text: Ou “confiamos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: mas também
  rationale: Preserva a força adversativa e aditiva, ligando o versículo ao argumento anterior e estendendo-o aos que creem.
- source_word: δι’ ἡμᾶς
  choice: por nós
  rationale: Expressa de modo conciso que o que foi escrito tinha os crentes em vista, mantendo a ligação com o contexto anterior.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: a quem isso será creditado
  rationale: Mantém a orientação futura de μέλλει e a metáfora contábil de λογίζεσθαι. O pronome 'isso' supre em português o objeto implícito retomado do contexto sem inserir explicitamente 'justiça' no versículo.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: a nós que cremos naquele
  rationale: A repetição de 'a nós' esclarece que o particípio identifica os destinatários; 'crer naquele' comunica fé dirigida a uma pessoa de forma natural.
- source_word: τὸν ἐγείραντα
  choice: naquele que ressuscitou
  rationale: Reproduz o particípio substantivado, identificando Deus por sua ação.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jesus, nosso Senhor
  rationale: Usa a forma portuguesa convencional do nome e verte κύριος pelo título tradicional e contextual 'Senhor'.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressão corrente e precisa para a linguagem de ressurreição, preservando a ideia de saída do meio dos mortos.
theological_decisions:
- issue: Explicitação do objeto implícito de λογίζεσθαι
  choice: a quem isso será creditado
  alternative: a quem a justiça será creditada
  rationale: O grego deixa o objeto implícito, retomando o contexto precedente. 'Isso' torna a frase natural em português sem resolver a elipse mediante a inserção explícita de 'justiça'.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada para soar natural, sem eliminar a metáfora contábil nem a elipse contextual do grego.
