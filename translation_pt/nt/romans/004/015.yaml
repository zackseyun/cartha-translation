id: ROM.4.15
reference: Romans 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: pt
  text: Pois a lei[a] produz ira, mas, onde não há lei, também não há transgressão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Lei”.'
    reason: Leitura alternativa quanto ao alcance de νόμος.
  - marker: b
    text: 'Ou: “violação”.'
    reason: Alternativa lexical para παράβασις.
lexical_decisions:
- source_word: νόμος
  choice: lei
  rationale: Mantém a amplitude do termo paulino sem restringi-lo explicitamente à Lei de Moisés; em português, o artigo definido é natural nesta construção.
- source_word: ὀργή
  choice: ira
  rationale: Preserva o peso judicial e teológico que o termo frequentemente possui em Paulo, sendo mais forte e solene que simples irritação ou raiva.
- source_word: κατεργάζεται
  choice: produz
  rationale: Expressa com clareza atual o sentido causativo de realizar ou ocasionar um resultado.
- source_word: οὗ δὲ
  choice: mas, onde
  rationale: Reproduz a construção locativa e a força levemente contrastiva de δέ.
- source_word: παράβασις
  choice: transgressão
  rationale: Indica a violação de um limite ou mandamento estabelecido, relação central para o argumento do versículo.
theological_decisions:
- issue: Alcance de νόμος no argumento de Paulo
  choice: a lei
  alternative: a Lei
  rationale: A forma em minúscula preserva o princípio geral formulado por Paulo sem decidir antecipadamente que a referência seja exclusivamente à Lei mosaica, embora esse pano de fundo continue possível.
- issue: Referente implícito de ὀργή
  choice: ira, sem explicitar de quem
  alternative: ira de Deus
  rationale: O grego não acrescenta um possuidor. A tradução mantém essa concisão e não resolve no texto principal uma inferência teológica contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “lei” foi mantida para conservar a estrutura e a lógica do grego.
