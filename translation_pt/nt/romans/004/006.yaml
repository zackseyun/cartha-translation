source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: pt
  text: 'Assim como Davi também fala da felicidade[a] do homem[b] a quem Deus credita justiça[c] independentemente de obras:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bem-aventurança».
    reason: lexical_alternative
  - marker: b
    text: Ou «da pessoa»; o grego diz «do homem», aqui em sentido representativo.
    reason: lexical_alternative
  - marker: c
    text: Ou «atribui» ou «considera como justiça».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Assim
  rationale: Introduz naturalmente a comparação com o argumento anterior, preservando a ligação lógica.
- source_word: καὶ
  choice: também
  rationale: 'Expressa a força aditiva: Davi é apresentado como testemunha adicional.'
- source_word: λέγει
  choice: fala
  rationale: Mantém o presente da fórmula de citação e combina de modo natural com «da felicidade».
- source_word: μακαρισμόν
  choice: felicidade
  rationale: Comunica em português corrente o estado de quem é declarado feliz ou bem-aventurado; a alternativa mais tradicional é indicada em nota.
- source_word: ἀνθρώπου
  choice: homem
  rationale: Preserva o singular masculino representativo do grego, sem limitar o sentido aos homens do sexo masculino.
- source_word: λογίζεται
  choice: atribui
  rationale: Expressa de forma clara a ideia de considerar ou lançar à conta de alguém, sem recorrer a jargão teológico.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: É o equivalente português natural de δικαιοσύνη e, no contexto paulino, pode designar a condição de justo atribuída por Deus.
- source_word: χωρὶς ἔργων
  choice: independentemente de obras
  rationale: Preserva o contraste entre a atribuição divina e as obras como base, em linguagem portuguesa clara.
theological_decisions:
- issue: Masculino representativo em ἀνθρώπου
  choice: homem
  alternative: pessoa
  rationale: A forma masculina singular do texto é mantida, mas seu alcance representativo é explicitado em nota.
- issue: Sentido de λογίζεται
  choice: atribui
  alternative: considera ou credita
  rationale: «Atribui» preserva a metáfora de contabilização e a dimensão declarativa sem fixar uma formulação confessional técnica.
- issue: δικαιοσύνη no uso paulino
  choice: justiça
  alternative: condição de justo
  rationale: «Justiça» mantém a correspondência lexical e a tensão semântica; a nota esclarece o sentido possível no contexto sem o reduzir a uma única teoria teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mantendo a estrutura comparativa, o presente da fórmula de citação e a ambiguidade teológica dos termos centrais.
