  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: pt
  text: e plenamente convencido[a] de que ele[b] também é capaz[c] de realizar aquilo que prometeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plenamente certo” ou “com plena certeza”.
    reason: lexical_alternative
  - marker: b
    text: Pelo contexto, “ele” se refere a Deus.
    reason: cross_reference
  - marker: c
    text: Literalmente, “é capaz”; o presente destaca uma capacidade que não se limita ao momento passado.
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: plenamente convencido
  rationale: O particípio expressa certeza completa. “Plenamente convencido” é claro, atual e mantém a intensidade do grego.
- source_word: ὅτι
  choice: de que
  rationale: Introduz naturalmente, em português, o conteúdo da convicção de Abraão.
- source_word: ὃ
  choice: aquilo que
  rationale: Traduz o pronome relativo substantivado de modo natural e claro, sem acrescentar especificidade ao objeto da promessa.
- source_word: ἐπήγγελται
  choice: prometeu
  rationale: O perfeito grego apresenta a promessa como feita e ainda válida. No contexto de uma promessa específica, o pretérito perfeito português transmite isso com naturalidade; “tem prometido” sugeriria repetição.
- source_word: δυνατός ἐστιν
  choice: é capaz
  rationale: Preserva o presente do grego e expressa a capacidade permanente de quem fez a promessa.
- source_word: καὶ
  choice: também
  rationale: Assinala que aquele que prometeu possui igualmente a capacidade de cumprir a promessa.
- source_word: ποιῆσαι
  choice: realizar
  rationale: No contexto de uma promessa, “realizar” comunica naturalmente o sentido de fazer efetivamente o que foi prometido, sem explicitação teológica adicional.
theological_decisions:
- issue: Sujeito implícito da promessa e da capacidade
  choice: Manter “ele” no texto e explicar em nota que se refere a Deus
  alternative: Explicitar “Deus” no texto principal
  rationale: O contexto identifica Deus como referente, mas o versículo não o nomeia. O pronome preserva a forma do texto e continua claro em contexto.
- issue: Valor temporal de δυνατός ἐστιν
  choice: “é capaz”, preservando o presente
  alternative: “era capaz”, ajustando ao contexto narrativo passado
  rationale: O presente grego pode expressar uma capacidade permanente. O presente também é natural em português dentro do discurso indireto e evita reduzir a afirmação ao passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência natural, mantendo a ligação entre a promessa e a capacidade de realizá-la. O início com “e” conserva a continuidade sintática com o versículo anterior.
