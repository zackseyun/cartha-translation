  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: pt
  text: Pois o que diz a Escritura? “Abraão creu em Deus, e isso lhe foi considerado como justiça.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso lhe foi atribuído como justiça” ou “isso lhe foi creditado como justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: a Escritura
  rationale: Com o artigo e no uso paulino, refere-se ao texto sagrado citado; “a Escritura” é natural e preciso em português.
- source_word: Ἐπίστευσεν
  choice: creu
  rationale: Preserva de modo direto o sentido do aoristo de πιστεύω e o tom da citação, sem acrescentar uma explicação interpretativa.
- source_word: τῷ θεῷ
  choice: em Deus
  rationale: Embora o dativo possa destacar que Abraão tomou Deus por verdadeiro, “crer em Deus” é a regência natural e estabelecida em português; a formulação não precisa ser entendida como mera crença na existência de Deus.
- source_word: ἐλογίσθη αὐτῷ
  choice: isso lhe foi considerado
  rationale: Mantém a voz passiva e exprime λογίζομαι em português atual. O pronome “isso” retoma naturalmente o fato de Abraão ter crido, sem explicitar além do grego o sujeito gramatical implícito.
- source_word: εἰς δικαιοσύνην
  choice: justiça
  rationale: “Justiça” é a correspondência portuguesa natural de δικαιοσύνη e preserva sua amplitude moral, relacional e declarativa no argumento paulino.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto paulino da justificação
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva melhor a amplitude do termo grego e evita reduzir a expressão apenas a qualidade moral pessoal. “Retidão” é possível, mas mais estreita neste contexto.
- issue: Referente implícito do passivo ἐλογίσθη
  choice: isso lhe foi considerado
  alternative: a fé lhe foi considerada
  rationale: O grego não contém o substantivo “fé”; “isso” preserva a referência anafórica à ação de crer sem tornar explícita uma identificação que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta introdutória foi mantida de forma direta, e a citação recebeu aspas para sinalizar seu caráter escritural.
