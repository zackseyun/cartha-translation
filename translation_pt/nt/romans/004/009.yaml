id: ROM.4.9
reference: Romans 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: pt
  text: 'Então, essa bem-aventurança[a] se aplica aos circuncidados ou também aos incircuncisos? Pois dizemos: “A fé foi atribuída a Abraão como justiça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “declaração de felicidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: bem-aventurança
  rationale: Retoma naturalmente a declaração de felicidade dos versículos 6–8 e preserva a ideia de uma condição declarada feliz, sem reduzi-la apenas a um benefício recebido.
- source_word: περιτομή
  choice: os circuncidados
  rationale: O substantivo grego funciona aqui metonimicamente para as pessoas marcadas pela circuncisão; a forma pessoal é clara e idiomática em português.
- source_word: ἀκροβυστία
  choice: os incircuncisos
  rationale: Assim como περιτομή, designa metonimicamente um grupo de pessoas e mantém com precisão o contraste de Paulo.
- source_word: πίστις
  choice: fé
  rationale: É a correspondência corrente e adequada no contexto da citação de Gênesis, sem ampliar o sentido para fidelidade ou reduzi-lo a mera opinião.
- source_word: ἐλογίσθη
  choice: foi atribuída
  rationale: Comunica de modo natural a ideia de considerar ou lançar à conta de alguém, preservando a linguagem de imputação sem recorrer ao menos corrente 'imputada'.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, 'justiça' é a correspondência lexical tradicional e natural para δικαιοσύνη, podendo indicar aqui a condição de estar em relação correta diante de Deus.
- source_word: εἰς δικαιοσύνην
  choice: como justiça
  rationale: Preserva a construção relacional da expressão e a tensão do argumento paulino, sem explicar além do que o texto afirma.
theological_decisions:
- issue: Relação entre a fé de Abraão e a justiça
  choice: A fé foi atribuída a Abraão como justiça.
  alternative: A fé foi creditada a Abraão para justiça.
  rationale: A formulação mantém a linguagem contábil de λογίζομαι e não desenvolve uma teoria doutrinária além da afirmação citada por Paulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Bem-aventurança' preserva a ligação com Romanos 4:6–8; 'se aplica a' torna idiomática a construção elíptica grega sem alterar seu alcance.
