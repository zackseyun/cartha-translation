lexical_decisions:
- source_word: εἴ πως
  choice: se, de algum modo
  rationale: Preserva a esperança ou finalidade apresentada de modo não categórico, em português atual e natural.
- source_word: παραζηλώσω
  choice: eu provocar ciúme
  rationale: Mantém a ideia de despertar ciúme e a ligação lexical com o tema do ciúme de Israel no contexto.
- source_word: μου τὴν σάρκα
  choice: minha própria carne
  rationale: Conserva a metáfora concreta do grego para o parentesco étnico de Paulo, sem substituí-la silenciosamente por uma explicação.
- source_word: σώσω
  choice: salvar
  rationale: É a tradução corrente e preserva o peso soteriológico do verbo no contexto paulino.
- source_word: τινὰς ἐξ αὐτῶν
  choice: alguns deles
  rationale: Expressa naturalmente em português que se trata de uma parte do grupo anteriormente referido.
theological_decisions:
- issue: Sentido de σάρξ na referência de Paulo ao seu grupo étnico
  choice: carne, em sentido de parentesco étnico
  alternative: meu próprio povo; meus compatriotas judeus
  rationale: Neste contexto, σάρξ indica os parentes naturais de Paulo, e não uma natureza pecaminosa. O texto principal preserva a expressão grega, enquanto a nota esclarece seu referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a metáfora de parentesco do original e sua incerteza retórica.
