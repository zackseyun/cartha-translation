  - severity: medium
    issue: «diante de Baal» para τῇ Βάαλ
    rationale: O dativo marca aquele a quem não dobraram o joelho («a Baal»). «Diante de» pode ser uma explicitação interpretativa legítima em alguns contextos, mas não é necessária e reduz a equivalência formal.
  - severity: low
    issue: Plural «os joelhos» para γόνυ
    rationale: O grego emprega «joelho» no singular. O singular é inteiramente natural em português nesta expressão e preserva melhor a imagem textual.
  - severity: low
    issue: «Reservei» para Κατέλιπον
    rationale: «Reservei» pode sugerir separação para uso futuro. «Conservei» reproduz mais diretamente o sentido contextual de manter/preservar para si, em consonância com a função do remanescente na citação.
