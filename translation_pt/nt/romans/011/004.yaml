  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: pt
  text: Mas o que lhe diz a resposta divina[a]? “Conservei para mim sete mil homens[b], os quais não dobraram o joelho a Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a resposta de Deus” ou “o oráculo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Deixei para mim” ou “Reservei para mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: a resposta divina
  rationale: No contexto, designa a resposta autorizada de Deus a Elias. A expressão é clara em português e identifica a origem divina sem recorrer ao termo menos comum “oráculo”.
- source_word: Κατέλιπον
  choice: Reservei
  rationale: O aoristo indica o ato de deixar ou conservar um remanescente. “Reservei” expressa naturalmente que Deus os separou e conservou para si, sem exigir que se explicite no verbo o resultado presente.
- source_word: ἐμαυτῷ
  choice: para mim
  rationale: Preserva diretamente o dativo reflexivo e indica que Deus reservou esse remanescente para si mesmo.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: sete mil homens
  rationale: Mantém o substantivo grego especificamente masculino ἄνδρας e o número expresso no texto.
- source_word: οἵτινες
  choice: os quais
  rationale: Introduz com clareza a descrição que caracteriza os sete mil; “os quais” mantém a ligação explícita com “homens” em registro digno.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: não dobraram os joelhos
  rationale: Conserva a imagem corporal do gesto de submissão e culto. O plural “os joelhos” é idiomático em português, embora o grego use o singular coletivo.
- source_word: τῇ Βάαλ
  choice: diante de Baal
  rationale: Em português, “dobrar os joelhos diante de” comunica de modo natural a submissão cultual indicada pela construção grega, sem artigo antes do nome próprio.
theological_decisions:
- issue: Explicitar que a resposta citada vem de Deus
  choice: “a resposta divina”, mantendo em seguida a fala na primeira pessoa
  alternative: “a resposta” ou “o oráculo”
  rationale: O contexto e a fonte veterotestamentária identificam Deus como aquele que responde a Elias. A formulação torna explícito o sentido contextual de χρηματισμός sem acrescentar uma conclusão doutrinária externa.
- issue: Gênero de ἄνδρας
  choice: homens
  alternative: pessoas
  rationale: O texto-fonte emprega um termo especificamente masculino; a tradução preserva essa especificidade em vez de neutralizá-la.
- issue: Sentido cultual de dobrar os joelhos
  choice: “diante de Baal”
  alternative: “a Baal”
  rationale: A expressão portuguesa deixa claro que se trata de submissão ou adoração, preservando a imagem sem substituir o gesto por uma interpretação como “adoraram”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Resposta divina” evita arcaísmo, enquanto “reservei para mim” e “dobraram os joelhos diante de Baal” preservam tanto a força da citação quanto sua imagem concreta.
