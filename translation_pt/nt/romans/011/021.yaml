  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: pt
  text: Pois, se Deus não poupou os ramos naturais[a], também não poupará você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os ramos segundo a natureza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Preserva a relação explicativa de γάρ e a condição introduzida por εἰ, com ordem natural em português.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente normal de θεός; o artigo grego marca o sujeito de modo habitual e não precisa ser reproduzido.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: os ramos naturais
  rationale: Expressa de modo claro e conciso a ideia literal de ramos que pertencem segundo a natureza, preservando a metáfora da oliveira sem explicitar seu referente.
- source_word: οὐκ ἐφείσατο
  choice: não poupou
  rationale: Mantém o sentido usual de φείδομαι e o paralelismo verbal com a oração seguinte.
- source_word: οὐδὲ σοῦ φείσεται
  choice: também não poupará você
  rationale: οὐδέ dá continuidade à negação, e o futuro φείσεται é preservado. “Você” conserva o singular de σοῦ e oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Referente dos “ramos naturais” na metáfora da oliveira
  choice: A metáfora foi mantida sem identificar seu referente no texto principal.
  alternative: Explicitar “Israel” na tradução.
  rationale: Embora o contexto indique Israel, Paulo emprega aqui a linguagem metafórica; explicá-la no texto traduzido iria além da formulação grega.
- issue: Alcance da advertência dirigida a “você”
  choice: A advertência direta e o singular foram preservados sem qualificações doutrinárias.
  alternative: Interpretar a advertência como exclusivamente coletiva ou individual, ou enquadrá-la numa doutrina específica de perseverança ou apostasia.
  rationale: O grego apresenta uma advertência real a um interlocutor singular representativo, mas não resolve por si só os debates sistemáticos associados.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. “Pois, se” preserva o encadeamento argumentativo; “ramos naturais” mantém a metáfora paulina. O pronome “você” comunica claramente o singular grego, sem transformar a advertência em plural.
