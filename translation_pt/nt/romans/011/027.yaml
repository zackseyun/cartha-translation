  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: pt
  text: E esta será a minha aliança com eles[a], quando eu tirar os seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a aliança da minha parte para com eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: aliança
  rationale: No contexto paulino e da citação profética, designa o compromisso soberano de Deus, e não um testamento ou mero acordo.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: a minha aliança
  rationale: A expressão é literalmente «a aliança da minha parte/procedente de mim»; «a minha aliança» comunica isso de modo natural, enquanto a nota preserva a forma mais literal.
- source_word: αὐτοῖς
  choice: com eles
  rationale: Embora o dativo possa ser formalmente «a/para eles», em português se faz uma aliança «com» alguém.
- source_word: ὅταν
  choice: quando
  rationale: Introduz o momento de realização da promessa profética, não uma série indefinida de ocasiões.
- source_word: ἀφέλωμαι
  choice: eu tirar
  rationale: Expressa de forma natural e biblicamente reconhecível a remoção dos pecados, sem explicar além do texto.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: os seus pecados
  rationale: Mantém o plural e o sentido moral e teológico direto do original.
- source_word: καὶ αὕτη
  choice: E esta será
  rationale: O grego omite a cópula; «será» completa naturalmente a frase em português e corresponde ao horizonte futuro da promessa citada.
theological_decisions:
- issue: Natureza de διαθήκη na citação paulina da promessa profética
  choice: aliança
  alternative: testamento
  rationale: «Aliança» preserva o quadro intertextual das promessas redentoras de Deus, sem introduzir o sentido de última vontade.
- issue: Força temporal de ὅταν ἀφέλωμαι
  choice: quando eu tirar os seus pecados
  alternative: sempre que eu tirar os seus pecados
  rationale: O contexto apresenta uma promessa profética de realização, não uma condição geral repetida; «quando» mantém essa força sem determinar uma cronologia além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Tirar os pecados» conserva o idioma bíblico e permanece natural; a nota registra a construção grega incomum sem sobrecarregar o texto principal.
