  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: pt
  text: Quanto ao evangelho[a], eles são inimigos por causa de vocês; mas, quanto à eleição, são amados por causa dos pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No que diz respeito ao evangelho, são inimigos por causa de vocês; mas, no que diz respeito à eleição, são amados por causa dos pais”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, os antepassados de Israel, especialmente Abraão, Isaque e Jacó.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Quanto ao evangelho
  rationale: κατά com acusativo estabelece aqui o aspecto sob o qual Israel é considerado; a construção «quanto a... mas, quanto a...» reproduz com naturalidade o contraste μέν...δέ.
- source_word: ἐχθροὶ
  choice: inimigos
  rationale: O adjetivo substantivado tem força predicativa e relacional. «Inimigos» preserva a afirmação forte sem transformá-la em «odiados», leitura que especificaria indevidamente a atitude de Deus.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: διά com acusativo pode indicar causa ou motivo. A formulação conserva essa amplitude e é clara em português internacional com boa legibilidade brasileira.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: mas, quanto à eleição
  rationale: Mantém o paralelismo contrastivo e traduz ἐκλογή pelo termo teológico estabelecido, sem expandi-lo interpretativamente para «escolha de Deus».
- source_word: ἀγαπητοὶ
  choice: amados
  rationale: Expressa de modo natural o estado de serem objeto de amor, preservando a tensão com «inimigos». «Amados» é mais corrente no português moderno do que «queridos» e menos marcado estilisticamente do que «bem-amados».
- source_word: διὰ τοὺς πατέρας
  choice: por causa dos patriarcas
  rationale: No contexto de Romanos 9–11, οἱ πατέρες designa os antepassados patriarcais de Israel. «Patriarcas» comunica esse referente com clareza; a nota explicita os nomes principais.
theological_decisions:
- issue: Referente implícito do plural
  choice: «eles» remete corporativamente a Israel no argumento de Romanos 9–11
  alternative: Restringir a expressão apenas aos judeus descrentes contemporâneos de Paulo
  rationale: O contexto trata de Israel como povo, embora a situação histórica em vista envolva incredulidade. A tradução conserva o pronome sem acrescentar uma delimitação ausente do grego.
- issue: Sentido de «inimigos»
  choice: Conservar a designação relacional forte em contraste com «amados»
  alternative: Interpretar como «odiados por Deus» ou enfraquecer para «opostos»
  rationale: O próprio versículo mantém juntas as categorias «inimigos» e «amados». A tradução não resolve a tensão nem define além do texto em que sentido ou perante quem são inimigos.
- issue: Sentido de «eleição»
  choice: Manter o termo «eleição» sem explicitar seu alcance nesta frase
  alternative: Expandir para «a escolha de Deus» ou especificar uma doutrina de eleição individual ou coletiva
  rationale: ἐκλογή remete ao propósito eletivo divino no contexto, mas o versículo não explicita aqui todas as suas dimensões. O termo tradicional preserva essa concisão e a tensão do argumento.
- issue: Identidade dos «pais»
  choice: Traduzir pelo referente contextual «patriarcas» e identificá-los na nota
  alternative: Manter literalmente «pais» ou entender antepassados israelitas em sentido genérico
  rationale: Em Romanos 9–11, a expressão evoca especialmente Abraão, Isaque e Jacó e as promessas ligadas a eles. «Patriarcas» evita que o leitor moderno entenda pais imediatos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural ὑμᾶς. O paralelismo «quanto ao... mas, quanto à...» conserva a estrutura retórica grega. «Amados» é natural e mantém o peso teológico sem arcaísmo. Todos os marcadores de nota aparecem no texto principal.
