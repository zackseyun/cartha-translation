lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz de modo conciso a próxima pergunta retórica da sequência.
- source_word: τίς
  choice: quem
  rationale: Equivalente natural do pronome interrogativo pessoal.
- source_word: προέδωκεν
  choice: primeiro lhe deu alguma coisa
  rationale: Preserva a ideia de dar antes ou tomar a iniciativa de dar; «alguma coisa» torna natural em português o uso transitivo sem especificar o objeto.
- source_word: αὐτῷ
  choice: lhe
  rationale: Mantém o pronome dativo do grego, cujo referente contextual é Deus.
- source_word: καὶ
  choice: para que
  rationale: 'Neste contexto retórico, explicita naturalmente a consequência pretendida: uma dádiva anterior que pudesse exigir retribuição, sem alterar a lógica da coordenação grega.'
- source_word: ἀνταποδοθήσεται
  choice: seja retribuída
  rationale: Expressa o futuro passivo de retribuir ou pagar de volta; a construção portuguesa liga a retribuição à coisa supostamente dada.
- source_word: αὐτῷ
  choice: lhe
  rationale: Preserva o pronome e o paralelismo, referindo-se à pessoa que supostamente teria dado primeiro.
theological_decisions:
- issue: Referente do primeiro pronome αὐτῷ
  choice: Mantido como «lhe», referindo-se a Deus pelo contexto.
  alternative: Explicitar «a Deus».
  rationale: O grego emprega pronome, e o referente permanece claro no contexto; não é necessário substituir o pronome por um substantivo.
- issue: Prioridade expressa por προέδωκεν e dívida divina
  choice: «primeiro lhe deu» conserva a prioridade da dádiva.
  alternative: «lhe deu» sem «primeiro» ou «lhe deu de antemão».
  rationale: A pergunta nega que alguém tenha dado primeiro a Deus de modo a colocá-lo sob obrigação de retribuir, sem transformar essa implicação em afirmação explícita no corpo do versículo.
- issue: Relação entre καὶ e a segunda oração
  choice: Vertida idiomaticamente como «para que» para expressar a consequência lógica da pergunta.
  alternative: 'Tradução formal: «e lhe será retribuído».'
  rationale: A coordenação grega pode soar pouco natural em português; a formulação escolhida preserva a força retórica, enquanto a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe interrogativa é natural, e as notas preservam tanto a alternativa lexical quanto a coordenação mais literal do grego.
