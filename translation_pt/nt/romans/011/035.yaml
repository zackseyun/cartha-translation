  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: pt
  text: Ou quem lhe deu primeiro, e lhe será retribuído?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quem lhe deu de antemão».'
    reason: lexical_alternative
  - marker: b
    text: A pergunta pressupõe que ninguém deu primeiro a Deus de modo que Deus ficasse obrigado a retribuir.
