id: ROM.11.2
reference: Romans 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: pt
  text: Deus não rejeitou o seu povo, a quem conheceu de antemão.[a] Ou vocês não sabem o que a Escritura diz na passagem sobre Elias, como ele apela a Deus contra Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pré-conheceu”. Alguns entendem o verbo em sentido mais forte, como “amou de antemão” ou “escolheu de antemão”, mas o grego permite que essa tensão interpretativa seja preservada.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “como ele suplica a Deus contra Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: rejeitou
  rationale: O aoristo médio de ἀπωθέομαι, neste contexto, significa rejeitar ou repudiar. “Rejeitou” é claro e natural em português e preserva a negação de que Deus tenha abandonado o seu povo.
- source_word: λαὸν αὐτοῦ
  choice: o seu povo
  rationale: λαός designa o povo, especialmente o povo da aliança. A formulação preserva esse sentido sem acrescentar “Israel” à primeira oração, pois o nome aparece explicitamente depois.
- source_word: προέγνω
  choice: conheceu de antemão
  rationale: A tradução reproduz o sentido lexical básico de conhecimento anterior sem inserir no texto principal interpretações mais fortes, como “escolheu de antemão” ou “amou de antemão”.
- source_word: ἢ οὐκ οἴδατε
  choice: Ou vocês não sabem
  rationale: Introduz naturalmente a pergunta retórica de Paulo. “Vocês” oferece legibilidade ampla, especialmente brasileira, sem perder dignidade.
- source_word: ἐν Ἠλίᾳ
  choice: na passagem sobre Elias
  rationale: A expressão idiomática grega aponta para a seção das Escrituras que trata de Elias, e não para uma localização literal “em Elias”.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: No uso paulino, o singular γραφή se refere à Escritura sagrada; a forma consagrada em português é clara e adequada.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: como ele apela a Deus
  rationale: ἐντυγχάνω pode indicar apelar, suplicar ou interceder. Como o complemento é “contra Israel”, “apela a Deus” evita a conotação normalmente favorável de “intercede”.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: contra Israel
  rationale: κατά com genitivo tem aqui sentido adversativo. Mantém-se “Israel” como nome próprio do povo.
theological_decisions:
- issue: Sentido de προέγνω em relação à eleição divina
  choice: conheceu de antemão
  alternative: pré-conheceu; amou de antemão; escolheu de antemão
  rationale: O verbo participa de uma discussão teológica mais ampla, mas o dado lexical não exige que a tradução resolva a tensão em favor de conhecimento prévio, amor eletivo ou escolha prévia. A redação principal mantém o sentido básico e a nota registra a alternativa formal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A ordem das notas foi ajustada para que cada marcador apareça no ponto correspondente do texto. A expressão idiomática ἐν Ἠλίᾳ foi explicitada no corpo do versículo, dispensando nota própria.
