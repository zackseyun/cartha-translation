  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: pt
  text: Que dizer, então? Israel não alcançou o que busca, mas os escolhidos[a] o alcançaram; os demais, porém, foram endurecidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a eleição” ou “a escolha”. O termo grego é literalmente abstrato, mas aqui provavelmente se refere às pessoas escolhidas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficaram insensíveis”. O verbo grego pode descrever endurecimento ou perda de sensibilidade espiritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Então, o que se conclui?
  rationale: Reproduz a fórmula retórico-inferencial de Paulo em português natural, ligando a pergunta ao argumento anterior.
- source_word: ὃ ἐπιζητεῖ
  choice: o que busca
  rationale: Expressa de modo corrente o objeto da busca contínua de Israel, sem acrescentar qual seja esse objeto.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Mantém o nome próprio e seu sentido coletivo no contexto.
- source_word: τοῦτο οὐκ ἐπέτυχεν / ἐπέτυχεν
  choice: não alcançou / o alcançaram
  rationale: Repete o mesmo verbo português para preservar o contraste retórico do grego; 'alcançar' é natural para aquilo que se busca.
- source_word: ἡ δὲ ἐκλογὴ
  choice: os escolhidos
  rationale: Interpreta o substantivo abstrato metonimicamente como o grupo de pessoas escolhido, em contraste com 'os demais', sem recorrer ao termo técnico menos transparente 'eleição' no corpo do texto.
- source_word: οἱ δὲ λοιποὶ
  choice: os demais, porém
  rationale: Designa naturalmente o restante do grupo e conserva a oposição marcada por δέ.
- source_word: ἐπωρώθησαν
  choice: foram endurecidos
  rationale: Preserva a metáfora e a voz passiva, sem identificar um agente que o grego não explicita.
theological_decisions:
- issue: Sentido de ἡ ἐκλογή
  choice: os escolhidos
  alternative: a eleição / a escolha
  rationale: O contraste com 'os demais' favorece a referência às pessoas escolhidas. A nota registra a forma mais literal e mantém visível a questão lexical.
- issue: Agência no endurecimento
  choice: foram endurecidos
  alternative: Deus os endureceu / eles se endureceram
  rationale: A forma passiva grega não declara o agente; a tradução conserva essa tensão teológica e não atribui explicitamente a ação a Deus nem às próprias pessoas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação usa ponto e vírgula para destacar o contraste entre os escolhidos e os demais. A nota reúne as duas alternativas lexicais necessárias sem resolver além do que o texto permite.
