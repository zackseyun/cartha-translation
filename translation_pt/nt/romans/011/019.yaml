reference: Romans 11:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: pt
  text: 'Você dirá, então: “Ramos foram quebrados para que eu fosse enxertado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: Você dirá
  rationale: Futuro do indicativo ativo, segunda pessoa do singular, de λέγω. Mantém a interpelação direta ao interlocutor imaginado no estilo de diatribe de Paulo.
- source_word: οὖν
  choice: então
  rationale: Conectivo inferencial que dá continuidade natural ao argumento, sem a formalidade maior de “portanto”.
- source_word: Ἐξεκλάσθησαν
  choice: foram quebrados
  rationale: Aoristo passivo de ἐκκλάω. Preserva a imagem de ramos removidos por quebra no contexto da oliveira.
- source_word: κλάδοι
  choice: Alguns ramos
  rationale: κλάδοι é plural indefinido, sem artigo. Em português, “alguns ramos” expressa naturalmente essa indefinição e evita sugerir que todos os ramos foram quebrados.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado alegado pelo interlocutor e é uma formulação natural em português.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito tem valor enfático no grego; sua presença em português conserva o contraste entre os ramos quebrados e o interlocutor enxertado.
- source_word: ἐγκεντρισθῶ
  choice: fosse enxertado
  rationale: Aoristo passivo do subjuntivo de ἐγκεντρίζω. “Fosse enxertado” preserva tanto a passiva quanto a metáfora horticultural, sem acrescentar um complemento ausente no versículo.
theological_decisions:
- issue: Explicitar que quem fala é um interlocutor imaginado no argumento de Paulo
  choice: 'Manter a segunda pessoa direta: “Você dirá”'
  alternative: “Alguém dirá” ou “Você poderia dizer”
  rationale: O estilo de diatribe emerge do contexto, mas o texto diz literalmente que “você dirá”. Não se acrescenta uma identificação explicativa do falante.
- issue: Tratar a oração de finalidade como afirmação teológica endossada por Paulo
  choice: 'Apresentá-la apenas como a inferência do interlocutor: “para que eu fosse enxertado”'
  alternative: Reformular como explicação explícita da intenção divina
  rationale: O versículo registra a alegação do interlocutor; a tradução não deve antecipar a resposta de Paulo nem declarar que ele endossa essa formulação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem “Você dirá, então” acompanha de perto a progressão discursiva grega. “Alguns ramos” torna idiomática a indefinição do plural grego sem artigo.
