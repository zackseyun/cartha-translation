id: ROM.11.10
reference: Romans 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: pt
  text: Escureçam-se os olhos deles, para que não vejam[a], e curva-lhes as costas continuamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que não vejam”. A construção grega pode indicar propósito ou resultado.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Ou: “sempre”. A expressão grega indica duração contínua ou constante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Escureçam-se
  rationale: Preserva a imagem de escuridão do verbo grego e exprime naturalmente, em português, a força passiva e imprecatória do imperativo de terceira pessoa.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: os olhos deles
  rationale: Mantém de modo direto a expressão possessiva e a imagem corporal central.
- source_word: τοῦ μὴ βλέπειν
  choice: para que não vejam
  rationale: Representa a construção com infinitivo articular sem decidir rigidamente entre propósito e resultado.
- source_word: τὸν νῶτον αὐτῶν
  choice: as costas
  rationale: Embora o grego empregue o singular, 'as costas' é a forma idiomática corrente em português para cada indivíduo do grupo.
- source_word: διὰ παντός
  choice: continuamente
  rationale: Comunica duração constante ou persistente sem impor a ideia mais forte de eternidade.
- source_word: σύγκαμψον
  choice: curva-lhes
  rationale: Preserva o imperativo ativo dirigido a Deus e a metáfora física de fazer as costas se dobrarem; o pronome enclítico expressa naturalmente a posse.
theological_decisions:
- issue: Citação imprecatória e agência divina
  choice: 'Manter a força de súplica ou ordem: ''Escureçam-se... e curva-lhes...'''
  alternative: Transformar em previsão ('os olhos deles ficarão escurecidos') ou em consequência impessoal
  rationale: 'A forma grega conserva a severidade da imprecação: o primeiro verbo é um imperativo passivo de terceira pessoa e o segundo, um imperativo ativo dirigido a Deus. A tradução não deve suavizá-los em mera previsão.'
- issue: Relação de propósito ou resultado em τοῦ μὴ βλέπειν
  choice: para que não vejam
  alternative: de modo que não vejam; impedindo-os de ver
  rationale: A formulação portuguesa mantém aberta a tensão entre propósito e resultado, sem explicá-la além do que a construção grega permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A inversão 'Escureçam-se os olhos deles' conserva o tom solene da citação sem soar arcaica; 'curva-lhes as costas' mantém o discurso direto a Deus e evita uma formulação excessivamente coloquial.
