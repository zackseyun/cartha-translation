  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: pt
  text: Não se vanglorie contra os ramos.[a] Mas, se você se vangloria, não é você que sustenta a raiz, e sim a raiz que sustenta você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não se vanglorie sobre os ramos».
    reason: lexical_alternative
  - marker: b
    text: Ou «não é você que carrega a raiz, mas a raiz que carrega você».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: orgulhar-se diante de / orgulhar-se
  rationale: O verbo expressa vanglória em relação a alguém, com ideia de superioridade hostil. «Orgulhar-se diante dos ramos» é natural e mantém essa relação sem tornar explícito demais se o sentido é «sobre» ou «contra»; a nota registra alternativas próximas.
- source_word: κλάδων
  choice: os ramos
  rationale: O artigo definido é preservado porque se trata dos ramos específicos da metáfora da oliveira desenvolvida no contexto.
- source_word: ῥίζαν / ῥίζα
  choice: a raiz
  rationale: A mesma tradução nas duas ocorrências preserva com clareza a metáfora e o contraste retórico.
- source_word: βαστάζεις
  choice: sustenta
  rationale: No contexto da árvore, o verbo comunica tanto suporte quanto manutenção. «Sustenta» conserva a imagem e expressa naturalmente a dependência.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: não é você que sustenta a raiz, e sim a raiz que sustenta você
  rationale: A construção mantém a ênfase contrastiva do grego entre «você» e «a raiz», além de preservar a inversão da dependência.
- source_word: μὴ
  choice: não
  rationale: Com o imperativo presente, forma uma proibição direta. A formulação não tenta determinar se a ação já estava em andamento.
theological_decisions:
- issue: Força metafórica da raiz e dos ramos na imagem da oliveira
  choice: Manter a metáfora sem identificar no texto quem ou o que são a raiz e os ramos.
  alternative: Explicitar a raiz como os patriarcas, Abraão ou as promessas da aliança.
  rationale: O grego apresenta a metáfora sem fazer essa identificação neste versículo. Explicá-la na tradução importaria uma interpretação e reduziria a abertura teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você» corresponde ao destinatário singular personificado no grego. «E sim» expressa de modo natural o contraste enfático οὐ ... ἀλλά.
