  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: pt
  text: Mas digo a vocês, gentios[a]. Pois, na medida em que sou apóstolo dos gentios, glorifico o meu ministério[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nações”; a mesma alternativa se aplica à segunda ocorrência de “gentios”.
    reason: lexical_alternative
  - marker: b
    text: Ou “honro o meu ministério” ou “engradeço o meu ministério”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Mas digo a vocês, os gentios
  rationale: A construção reúne o pronome dativo e a identificação dos destinatários. “Mas” representa a transição levemente contrastiva de δέ no contexto, e “digo a vocês” é natural em português.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: visto que
  rationale: No contexto, a expressão introduz a base para a afirmação de Paulo. A forma concisa evita reproduzir mecanicamente todas as partículas, cujo efeito é sobretudo discursivo.
- source_word: ἐθνῶν ἀπόστολος
  choice: apóstolo dos gentios
  rationale: O genitivo descreve o âmbito da missão apostólica de Paulo. “Dos gentios” é idiomático e mantém a relação formal sem excluir o sentido de missão dirigida a eles.
- source_word: τὴν διακονίαν μου
  choice: o meu ministério
  rationale: Aqui διακονία designa o serviço ou encargo apostólico de Paulo; “ministério” é claro, corrente e contextualmente preciso.
- source_word: δοξάζω
  choice: honro
  rationale: O verbo indica atribuir honra, valor ou glória. “Honro” comunica que Paulo trata seu ministério como digno de alta estima, sem sugerir engrandecimento pessoal.
theological_decisions:
- issue: Sentido da valorização do ministério de Paulo
  choice: Paulo honra e valoriza seu ministério, não a si mesmo.
  alternative: “glorifico” ou “engrandeço” o meu ministério
  rationale: O objeto de δοξάζω é o ministério. “Honro” preserva a força positiva do verbo e evita insinuar vanglória pessoal, sem negar as alternativas lexicais mais fortes.
- issue: Referente de ἔθνη / ἐθνῶν
  choice: gentios
  alternative: nações
  rationale: Em Romanos 9–11, o termo se refere aos povos não judeus em contraste com Israel. “Gentios” torna essa relação contextual explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva a continuidade sintática do versículo com o contexto seguinte. “Vocês” explicita o plural de ὑμῖν; o aposto “os gentios” identifica diretamente os destinatários.
