source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: pt
  text: Mas, se alguns dos ramos foram quebrados[a], e você, embora fosse uma oliveira brava, foi enxertado entre eles e se tornou participante, com eles, da raiz e da riqueza da oliveira[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram cortados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornou-se participante, com eles, da rica raiz da oliveira”; tradicionalmente, “da raiz e da gordura da oliveira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Mas, se
  rationale: Mantém tanto a condição introduzida por εἰ quanto o contraste ou a retomada marcada por δέ.
- source_word: τινες τῶν κλάδων
  choice: alguns dos ramos
  rationale: Expressa o indefinido τινες e o sentido partitivo do genitivo τῶν κλάδων.
- source_word: ἐξεκλάσθησαν
  choice: foram quebrados
  rationale: Preserva a voz passiva e a imagem própria de ramos retirados de uma árvore.
- source_word: ἀγριέλαιος ὢν
  choice: embora fosse uma oliveira brava
  rationale: Traduz o particípio com valor concessivo e conserva literalmente a metáfora da oliveira, sem substituí-la por uma identificação interpretativa.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: foi enxertado entre eles
  rationale: Emprega o termo horticultural natural em português e entende αὐτοῖς como referência aos ramos que permanecem.
- source_word: συγκοινωνὸς
  choice: passou a ter parte com eles
  rationale: Comunica participação conjunta de modo natural, preservando o elemento de comunhão indicado pelo prefixo συν-.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: na raiz, na riqueza da oliveira
  rationale: Conserva a sequência compacta e parcialmente ambígua dos genitivos, sem reduzi-la silenciosamente a uma única expressão adjetiva.
- source_word: ἐγένου
  choice: passou a
  rationale: Indica a entrada em uma nova condição, sentido contextual do aoristo de γίνομαι.
theological_decisions:
- issue: Identidade metafórica de ἀγριέλαιος
  choice: oliveira brava
  alternative: ramo de oliveira brava; gentio
  rationale: A tradução mantém a imagem agrícola de Paulo e não resolve a metáfora por meio de uma identificação teológica explícita.
- issue: Relação entre raiz, riqueza e oliveira
  choice: na raiz, na riqueza da oliveira
  alternative: na rica raiz da oliveira; da raiz e da riqueza da oliveira
  rationale: A construção grega acumula genitivos e permite mais de uma análise sintática. A formulação escolhida retém essa tensão em português razoavelmente claro, sem inserir uma conjunção ausente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular “você” torna explícito o destinatário singular de σύ sem recorrer a uma forma verbal regionalmente marcada. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
