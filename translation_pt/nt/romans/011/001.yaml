id: ROM.11.1
reference: Romans 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: pt
  text: 'Então pergunto: será que Deus rejeitou o seu povo?[a] De modo nenhum![b] Pois eu mesmo sou israelita, descendente de Abraão[c], da tribo de Benjamim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: afastou de si o seu povo.'
    reason: lexical_alternative
  - marker: b
    text: O grego usa uma forte expressão de repúdio, também traduzida por “Que isso nunca aconteça!”
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: da semente de Abraão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Então pergunto
  rationale: O verbo introduz aqui uma pergunta retórica, enquanto οὖν a liga por inferência ao argumento anterior. A formulação é natural em português e mantém essa conexão.
- source_word: μὴ ἀπώσατο
  choice: será que ... rejeitou
  rationale: Na pergunta, μή sinaliza a expectativa de resposta negativa, e ἀπωθέομαι expressa rejeição ou repúdio. A construção portuguesa conserva o caráter retórico sem acrescentar ideias como rejeição definitiva ou completa.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente português corrente e direto de θεός.
- source_word: τὸν λαὸν αὐτοῦ
  choice: o seu povo
  rationale: Preserva tanto o sentido coletivo de λαός quanto a relação indicada pelo possessivo, sem explicitar além do texto a extensão ou identidade desse povo.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressão enfática e idiomática de repúdio em português, mais forte que uma simples resposta negativa.
- source_word: καὶ γὰρ ἐγὼ
  choice: Pois eu mesmo
  rationale: γάρ apresenta a razão, e o pronome enfático ἐγώ é refletido por “eu mesmo”. O valor de καί se integra naturalmente à ênfase contextual.
- source_word: Ἰσραηλίτης
  choice: israelita
  rationale: Equivalente natural do identificador étnico e pactual empregado por Paulo.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: descendente de Abraão
  rationale: Comunica em português atual a ascendência expressa literalmente por “da semente de Abraão”, sem perder o vínculo genealógico.
- source_word: φυλῆς Βενιαμίν
  choice: da tribo de Benjamim
  rationale: Tradução direta, convencional e clara da identificação tribal.
theological_decisions:
- issue: Se a pergunta implica a rejeição total ou definitiva de Israel
  choice: Deus rejeitou o seu povo?
  alternative: Deus rejeitou completamente o seu povo? / Deus rejeitou para sempre o seu povo?
  rationale: O grego não contém advérbios equivalentes a “completamente” ou “para sempre”. A tradução mantém a tensão da pergunta e deixa que o contexto determine seu alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi formulada de modo natural, e a resposta mantém a forte rejeição paulina sem soar arcaica. Os marcadores de todas as notas aparecem junto às expressões pertinentes no texto.
