source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: pt
  text: 'Então pergunto: será que eles tropeçaram para cair?[a] De modo nenhum! Pelo contrário, por meio da transgressão deles[b], a salvação chegou aos gentios[c], para provocá-los ao ciúme.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pergunta espera a resposta “não”. O grego distingue “tropeçar” de “cair” e não diz aqui “cair definitivamente” ou “cair sem possibilidade de recuperação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa do passo em falso deles” ou “por meio da ofensa deles”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “às nações”; neste contexto, refere-se aos povos não judeus.
    reason: lexical_alternative
  - marker: d
    text: Ou “para despertar neles o ciúme”. A expressão também pode sugerir que sejam estimulados a desejar a mesma salvação.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Então pergunto
  rationale: No contexto discursivo, λέγω introduz uma pergunta retórica, e οὖν estabelece a ligação inferencial com o argumento anterior. “Então pergunto” é natural em português e explicita a função sem alterar o sentido.
- source_word: μὴ ἔπταισαν
  choice: será que eles tropeçaram
  rationale: A pergunta com μή espera resposta negativa. A construção “será que” comunica naturalmente essa pergunta retórica em português, enquanto “tropeçaram” preserva a imagem de πταίω.
- source_word: ἵνα πέσωσιν
  choice: para cair
  rationale: A expressão preserva a relação de propósito ou resultado possível em ἵνα com o subjuntivo e mantém distinta a imagem de “tropeçar” e “cair”, sem acrescentar no texto principal ideias como queda definitiva ou irrecuperável.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressão portuguesa corrente e enfática que transmite a forte rejeição da fórmula paulina, sem a artificialidade de uma reprodução literal do optativo.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: por meio da transgressão deles
  rationale: O dativo tem valor instrumental. “Transgressão” expressa com clareza o desvio ou delito moral de παράπτωμα; a nota preserva uma alternativa mais imagética.
- source_word: ἡ σωτηρία τοῖς ἔθνεσιν
  choice: a salvação chegou aos gentios
  rationale: A oração grega é elíptica, sem verbo expresso; “chegou” produz uma frase natural em português. “Gentios” comunica o sentido contextual de povos não judeus em Romanos 9–11.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: para provocá-los ao ciúme
  rationale: A construção com εἰς e infinitivo indica propósito ou resultado. “Provocar ao ciúme” conserva a linguagem forte de παραζηλόω sem decidir se o ciúme resultará em mera inveja ou em desejo de participar da mesma salvação.
theological_decisions:
- issue: Se o tropeço de Israel é apresentado como uma queda final ou irreversível
  choice: O texto nega que o tropeço tenha ocorrido para resultar simplesmente em queda, mantendo distintos os verbos “tropeçar” e “cair”.
  alternative: Entender “cair” especificamente como ruína definitiva, ou entender a negação como referente apenas a um colapso imediato.
  rationale: O grego contrasta πταίω e πίπτω, mas não inclui um advérbio como “definitivamente” ou “irremediavelmente”. A tradução conserva a tensão e deixa o contexto desenvolver as implicações.
- issue: Sentido do ciúme no propósito histórico da salvação
  choice: A chegada da salvação aos gentios tem o propósito ou resultado de provocar Israel ao ciúme.
  alternative: Entender o termo apenas como inveja negativa ou, mais positivamente, como estímulo para buscar a mesma bênção.
  rationale: παραζηλόω admite a ideia de provocar ciúme e pode, no contexto, incluir emulação. O texto principal mantém a formulação aberta, e a nota registra essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos e preserva tanto o contraste metafórico entre tropeçar e cair quanto a ambiguidade entre ciúme negativo e emulação positiva.
