  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: pt
  text: Mas, se é pela graça, já não é com base em obras; caso contrário, a graça já não se torna graça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: pela graça
  rationale: Expressa o dativo de meio ou fundamento de modo natural em português, preservando a graça como base determinante.
- source_word: ἐξ ἔργων
  choice: com base em obras
  rationale: Representa ἐκ como origem ou fundamento, evitando sugerir apenas o meio pelo qual algo ocorre.
- source_word: γίνεται
  choice: se torna
  rationale: Mantém o sentido verbal explícito de γίνομαι e a formulação deliberadamente incisiva do texto grego, sem reduzi-la simplesmente a «é».
theological_decisions:
- issue: Contraste entre graça e obras
  choice: 'Preservar a exclusão lógica: se é pela graça, não é com base em obras.'
  alternative: Parafrasear «obras» como «mérito humano» ou «obras da lei».
  rationale: O grego diz apenas ἔργων; especificar mérito ou lei resolveria indevidamente o alcance do termo.
- issue: Formulação «a graça já não se torna graça»
  choice: Manter a tensão e a aparente estranheza do predicado verbal.
  alternative: Traduzir «a graça já não seria graça».
  rationale: A alternativa é idiomática, mas apaga o γίνομαι presente no texto crítico e suaviza sua força retórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção «com base em obras» explicita naturalmente a relação de fundamento indicada por ἐξ; «se torna graça» conserva a formulação marcada do original.
