id: ROM.11.5
reference: Romans 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: pt
  text: Assim, também no tempo presente, veio a existir um remanescente segundo a eleição da graça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «segundo uma eleição graciosa»; ou: «segundo a eleição pela graça».'
    reason: Alternativas lexicais que explicitam de modos diferentes a relação entre «eleição» e «graça» no grego.
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Assim, também
  rationale: οὕτως οὖν introduz uma conclusão baseada no exemplo de Elias, enquanto καὶ assinala o paralelo com o tempo presente. Em português, «Assim, também» transmite essa inferência sem tornar a frase pesada.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: no tempo presente
  rationale: καιρός indica aqui o período ou momento atual em contraste com os dias de Elias; «no tempo presente» é claro, natural e preserva esse contraste.
- source_word: λεῖμμα
  choice: um remanescente
  rationale: «Remanescente» é o termo bíblico estabelecido para a parcela que permanece e corresponde bem ao contexto veterotestamentário e paulino.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: segundo a eleição da graça
  rationale: A formulação conserva tanto ἐκλογή, «eleição», quanto χάρις, «graça», e mantém aberta a relação compacta expressa pelo genitivo, sem reduzi-la a uma única interpretação.
- source_word: γέγονεν
  choice: veio a existir
  rationale: O perfeito de γίνομαι descreve uma realidade presente resultante de algo que ocorreu; «veio a existir» preserva esse valor verbal melhor que o simples «existe».
theological_decisions:
- issue: Tradução de ἐκλογή em um contexto paulino doutrinariamente disputado
  choice: eleição
  alternative: escolha
  rationale: «Eleição» preserva o peso e o vocabulário característicos da discussão paulina sem impor um sistema denominacional específico.
- issue: Relação entre graça e eleição em κατ’ ἐκλογὴν χάριτος
  choice: eleição da graça
  alternative: eleição pela graça; eleição graciosa
  rationale: «Da graça» conserva a relação genitiva e sua ambiguidade legítima quanto a origem, fundamento ou caráter, em vez de escolher silenciosamente uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo o vocabulário teológico do original e sua ambiguidade genuína.
