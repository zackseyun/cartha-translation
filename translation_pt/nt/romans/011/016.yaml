id: ROM.11.16
reference: Romans 11:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: pt
  text: Se as primícias são santas, toda a massa de pão[a] também é santa; e, se a raiz é santa, os ramos também são santos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda a massa». O grego φύραμα designa uma massa ou mistura de farinha preparada para fazer pão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: as primícias
  rationale: Mantém a linguagem bíblica e cultual da primeira porção oferecida a Deus. O plural lexicalizado «primícias» é a forma natural em português, embora o substantivo grego esteja no singular.
- source_word: ἁγία
  choice: santa/santos
  rationale: «Santo» preserva a categoria bíblica sem definir se a santidade aqui é cultual, pactual, representativa ou salvífica. A flexão varia conforme os substantivos portugueses.
- source_word: φύραμα
  choice: toda a massa de pão
  rationale: Explicita de modo natural que se trata de uma massa preparada, preservando a imagem concreta e a relação entre a primeira porção e o conjunto.
- source_word: ῥίζα
  choice: raiz
  rationale: Equivalente botânico direto e natural, adequado à metáfora da oliveira no contexto.
- source_word: κλάδοι
  choice: ramos
  rationale: Termo corrente e preciso para a imagem botânica desenvolvida no contexto de Romanos 11.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Se ... também ...; e, se ... também ...
  rationale: Reproduz a estrutura condicional e o paralelismo conciso. Em português, a repetição de «santa/santos» torna explícitos os predicados elípticos do grego sem acrescentar interpretação.
theological_decisions:
- issue: Natureza da santidade nas metáforas das primícias e da raiz
  choice: Manter «santa/santos» sem explicar o modo dessa santidade
  alternative: Traduzir como «consagrada» ou especificar uma santidade pactual ou salvífica
  rationale: O versículo afirma uma relação derivada entre primícias e massa, e entre raiz e ramos, mas não define por si só se essa santidade é cultual, pactual, representativa ou salvífica. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Primícias» conserva a ressonância bíblica; «massa de pão» esclarece a imagem para leitores atuais. O δέ foi integrado pela progressão condicional, sem acrescentar um marcador temporal inexistente.
