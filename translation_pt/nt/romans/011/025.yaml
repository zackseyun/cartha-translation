id: ROM.11.25
reference: Romans 11:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: pt
  text: 'Pois não quero que vocês desconheçam, irmãos[a], este mistério, para que não sejam sábios aos seus próprios olhos: um endurecimento parcial sobreveio a Israel, até que entre a plenitude dos gentios[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego diz «irmãos» e pode dirigir-se a um grupo misto.
    reason: lexical_alternative
  - marker: b
    text: Ou «o número completo dos gentios».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: desconheçam
  rationale: Na fórmula paulina οὐ θέλω ὑμᾶς ἀγνοεῖν, comunica naturalmente a ideia de não estar informado, sem o tom pejorativo que «sejam ignorantes» poderia ter.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva o vocativo masculino plural do grego e funciona naturalmente como forma de tratamento comunitária; a possível referência a um grupo misto é indicada em nota.
- source_word: μυστήριον
  choice: mistério
  rationale: Mantém o registro teológico paulino de um propósito divino antes oculto e agora revelado, sem reduzi-lo a mero «segredo».
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: para que não sejam sábios aos seus próprios olhos
  rationale: Expressa a finalidade da revelação do mistério e reproduz de modo idiomático a advertência contra a presunção.
- source_word: πώρωσις
  choice: endurecimento
  rationale: Equivalente claro e consagrado para a insensibilidade espiritual descrita no contexto.
- source_word: ἀπὸ μέρους
  choice: parcial
  rationale: Indica primariamente a extensão limitada do endurecimento, sem afirmar que a expressão descreva apenas sua duração.
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: sobreveio a Israel
  rationale: «Sobreveio» transmite a ocorrência de uma condição que passou a afetar Israel; o perfeito grego apresenta essa condição como vigente.
- source_word: πλήρωμα
  choice: plenitude
  rationale: Preserva a amplitude semântica do termo, que pode apontar para totalidade, número completo ou plena inclusão, sem decidir a questão interpretativa.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: Neste contraste com Israel, designa de modo preciso os não judeus.
- source_word: εἰσέλθῃ
  choice: tenha entrado
  rationale: Com «até que», o subjuntivo composto português apresenta a entrada como o marco que delimita a situação descrita, preservando a abertura quanto ao referente implícito da entrada.
theological_decisions:
- issue: Sentido de «a plenitude dos gentios»
  choice: Mantida a formulação «a plenitude dos gentios» no texto principal.
  alternative: «o número completo dos gentios» ou «a plena inclusão dos gentios»
  rationale: A expressão é teologicamente debatida. «Plenitude» conserva a ambiguidade genuína entre número completo, inclusão plena e consumação escatológica.
- issue: Alcance de «irmãos»
  choice: Mantido «irmãos» no texto principal.
  alternative: «irmãos e irmãs»
  rationale: O grego emprega um vocativo masculino plural, embora possa dirigir-se a uma comunidade mista; a nota explicita esse alcance sem substituir a forma do texto-fonte.
- issue: Extensão do endurecimento de Israel
  choice: Traduzido como «um endurecimento parcial».
  alternative: «um endurecimento, em parte»
  rationale: A redação indica limitação de alcance sem especificar quais indivíduos estão incluídos nem transformar a expressão numa afirmação exclusivamente temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção mantém o encadeamento argumentativo de Paulo e conserva deliberadamente as ambiguidades de «plenitude» e do alcance de «endurecimento parcial».
