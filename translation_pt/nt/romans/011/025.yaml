    issue: Forma verbal após «até que»
    rationale: «Até que tenha entrado» é possível, mas o perfeito do subjuntivo introduz uma nuance de ação já completada que não é necessária para εἰσέλθῃ. «Até que entre» é a formulação portuguesa mais idiomática para o evento que estabelece o termo da situação e conserva melhor a abertura do grego.
