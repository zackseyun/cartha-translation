  to: 'Pois não quero que vocês desconheçam, irmãos[a], este mistério, para que não sejam sábios aos seus próprios olhos: um endurecimento parcial sobreveio a Israel, até que entre a plenitude dos gentios[b].'
  rationale: A única revisão troca «tenha entrado» por «entre», tornando a oração temporal mais natural em português contemporâneo e evitando uma nuance aspectual desnecessariamente forte, sem alterar o sentido ou resolver a ambiguidade teológica de «plenitude».
