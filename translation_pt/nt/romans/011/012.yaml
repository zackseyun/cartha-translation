id: ROM.11.12
reference: Romans 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: pt
  text: Mas, se a transgressão deles é riqueza para o mundo, e a perda deles[a] é riqueza para os gentios, quanto mais a plenitude deles[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a derrota deles” ou “a diminuição deles”, em vez de “a perda deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o número completo deles” ou “a plena inclusão deles”, em vez de “a plenitude deles”.
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: transgressão
  rationale: Expressa o sentido moral de um passo em falso ou ofensa, sem reduzir o termo a mero fracasso.
- source_word: πλοῦτος
  choice: riqueza
  rationale: Mantém a metáfora paulina da abundância das bênçãos recebidas.
- source_word: κόσμου
  choice: mundo
  rationale: Preserva a abrangência de κόσμος e seu contraste contextual com Israel.
- source_word: ἥττημα
  choice: perda
  rationale: É suficientemente amplo para não decidir entre derrota, diminuição numérica ou fracasso; as principais nuances são registradas em nota.
- source_word: ἐθνῶν
  choice: gentios
  rationale: Torna claro o contraste entre Israel e os povos não judeus característico deste contexto em Romanos.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: Equivalente português natural da expressão comparativa que introduz o argumento do menor para o maior.
- source_word: πλήρωμα
  choice: plenitude
  rationale: Conserva a amplitude do grego, que pode sugerir plena medida, número completo ou plena inclusão, sem resolver a ambiguidade no texto principal.
theological_decisions:
- issue: Referente e nuance de «a plenitude deles» (τὸ πλήρωμα αὐτῶν)
  choice: a plenitude deles
  alternative: o número completo deles; a plena inclusão deles; sua restauração plena
  rationale: A formulação grega é concisa e aberta. «Plenitude» preserva as dimensões quantitativa e qualitativa possíveis sem impor uma interpretação escatológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção elíptica e exclamativa no final acompanha a concisão do grego. «Mas» representa o valor conectivo e contrastivo de δέ, sem acrescentar um marcador temporal inexistente.
