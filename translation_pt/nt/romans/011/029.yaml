  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: pt
  text: Pois os dons e o chamado de Deus são irrevogáveis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não são motivo de arrependimento” ou “não são retirados”. Traduções antigas às vezes dizem “sem arrependimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: são irrevogáveis
  rationale: O adjetivo indica aquilo de que não se arrepende ou que não é retirado. Em português atual, “são irrevogáveis” expressa com naturalidade que Deus não revoga seus dons nem seu chamado, sem ampliar o sentido para uma imutabilidade absoluta.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva de modo conciso a ligação argumentativa.
- source_word: τὰ χαρίσματα
  choice: os dons
  rationale: Preserva o plural e comunica naturalmente a ideia de dádivas concedidas pela graça, sem acrescentar interpretação ao contexto.
- source_word: ἡ κλῆσις
  choice: o chamado
  rationale: É a forma mais corrente e clara em português para a ação divina de chamar, mantendo o peso teológico paulino sem explicá-lo em excesso.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a amplitude do genitivo grego, que pode apresentar Deus como fonte e também como aquele a quem pertencem os dons e o chamado.
theological_decisions:
- issue: Alcance de “os dons e o chamado de Deus” no contexto
  choice: Manter a formulação sem especificar seu objeto.
  alternative: Explicitar Israel e seus privilégios e chamado pactuais, ou apresentar a frase como princípio geral sobre todos os dons e chamados divinos.
  rationale: Romanos 9–11 trata diretamente de Israel, mas este versículo não torna a mencionar de forma explícita o objeto dos dons e do chamado. A tradução conserva a formulação de Paulo e sua tensão contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém o vínculo lógico; “irrevogáveis” é preciso e idiomático. O marcador [a] aparece no texto principal.
