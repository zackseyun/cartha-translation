id: ROM.11.24
reference: Romans 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: pt
  text: Pois, se você foi cortado de uma oliveira brava por natureza e, contra a natureza, foi enxertado numa oliveira cultivada, quanto mais estes, os ramos naturais[a], serão enxertados na sua própria oliveira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estes, os que são por natureza”. O grego diz literalmente “estes, os segundo a natureza”; “ramos” é fornecido a partir da metáfora da oliveira no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “serão enxertados de volta na sua própria oliveira”. A ideia de retorno está implícita no contexto, embora “de volta” não apareça explicitamente no verbo grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: foi cortado de
  rationale: Preserva o sentido específico de ἐκκόπτω, “cortar, remover por corte”, e a construção com ἐκ, sem assimilá-lo ao “quebrar” usado em outras partes da metáfora.
- source_word: ἀγριελαίου
  choice: uma oliveira brava
  rationale: Designa a oliveira não cultivada. “Oliveira brava” é expressão corrente e clara em português, em contraste com a oliveira cultivada.
- source_word: παρὰ φύσιν
  choice: contra a natureza
  rationale: Reproduz de modo natural o contraste retórico com κατὰ φύσιν, “por natureza”.
- source_word: ἐνεκεντρίσθης
  choice: foi enxertado numa
  rationale: Emprega o verbo técnico da horticultura e expressa naturalmente em português a inserção indicada por εἰς.
- source_word: καλλιέλαιον
  choice: uma oliveira cultivada
  rationale: Comunica a oliveira domesticada e produtiva em oposição à brava, evitando o matiz avaliativo de “boa oliveira”.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: É a formulação idiomática portuguesa para o argumento a fortiori.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: estes, os ramos naturais
  rationale: “Ramos” está implícito na metáfora e no contexto imediato; sua inclusão torna a frase clara sem explicitar além do grego a identidade étnica dos referentes.
- source_word: ἐγκεντρισθήσονται
  choice: serão enxertados
  rationale: Mantém o futuro passivo e não acrescenta “de volta” ao verbo, pois a ideia de retorno decorre do contexto, não do léxico isolado.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: na sua própria oliveira
  rationale: “Na” é a regência portuguesa natural de “enxertar” neste contexto; “própria” preserva a ênfase de ἰδίᾳ no pertencimento.
theological_decisions:
- issue: Explicitar se “estes” se refere a judeus ou israelitas
  choice: Manter o referente implícito como “estes, os ramos naturais”.
  alternative: Traduzir “estes judeus” ou “estes israelitas”.
  rationale: O contexto identifica Israel, mas o versículo usa um demonstrativo e a linguagem da metáfora, não um nome étnico explícito. A tradução preserva essa forma e sua tensão.
- issue: Acrescentar “ramos”, ausente como substantivo explícito no grego
  choice: Fornecer “ramos” no texto principal.
  alternative: Traduzir literalmente “estes, os que são por natureza”.
  rationale: A metáfora da oliveira e o contexto imediato tornam o substantivo inequívoco; fornecê-lo produz português compreensível com mínima explicitação.
- issue: Expressar retorno no segundo enxerto
  choice: Não inserir “de volta” no texto principal.
  alternative: Traduzir “serão enxertados de volta”.
  rationale: O retorno é fortemente sugerido pelo contexto, mas não está expresso no verbo ἐγκεντρισθήσονται; a nota registra essa leitura sem incorporá-la ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O singular “você” corresponde ao σύ retórico dirigido ao gentio individualizado. A ordem e os contrastes “por natureza/contra a natureza” foram preservados tanto quanto permite a fluência.
