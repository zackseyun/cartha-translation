lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de γάρ quanto a comparação introduzida por ὥσπερ, em português natural.
- source_word: ὑμεῖς
  choice: vocês
  rationale: Representa com clareza a segunda pessoa do plural, sem acrescentar explicitamente “gentios”, informação obtida do contexto.
- source_word: ποτε
  choice: antes
  rationale: Expressa de modo corrente o tempo passado em contraste direto com νῦν, “agora”.
- source_word: ἠπειθήσατε
  choice: desobedeceram
  rationale: Mantém o sentido moral e relacional de ἀπειθέω e a ligação lexical com ἀπείθεια no fim do versículo, sem excluir sua possível nuance de incredulidade.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: É a forma portuguesa natural de expressar o complemento de ἀπειθέω.
- source_word: νῦν δὲ
  choice: mas agora
  rationale: Preserva o forte contraste entre a situação anterior e o recebimento presente de misericórdia.
- source_word: ἠλεήθητε
  choice: receberam misericórdia
  rationale: Expressa naturalmente o passivo grego e mantém o foco na misericórdia concedida aos destinatários.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: por causa da desobediência deles
  rationale: Apresenta o dativo como causal, leitura adequada ao contexto, e traduz τούτων pelo pronome natural “deles”, cujo referente é dado pelo contexto.
theological_decisions:
- issue: Sentido de ἀπειθέω / ἀπείθεια no contexto paulino
  choice: desobedecer / desobediência
  alternative: não crer / incredulidade
  rationale: “Desobediência” preserva a correspondência entre o verbo e o substantivo e não reduz o sentido a uma categoria meramente intelectual. A nota registra a sobreposição semântica com incredulidade.
- issue: Valor do dativo τῇ τούτων ἀπειθείᾳ
  choice: 'causal: “por causa da desobediência deles”'
  alternative: 'instrumental: “por meio da desobediência deles”'
  rationale: A formulação causal é clara e adequada à progressão do argumento, sem definir de modo excessivamente rígido o mecanismo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A vírgula final foi mantida porque o versículo continua sintaticamente em Romanos 11:31.
