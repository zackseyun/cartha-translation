  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: pt
  text: 'Está certo[a]: eles foram quebrados por causa da incredulidade, mas você permanece firme pela fé[b]. Não seja arrogante[c], mas tema[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Muito bem” ou “É verdade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mediante a fé” ou “pela confiança”.
    reason: alternative_reading
  - marker: c
    text: Ou “não pense com orgulho” ou “não seja soberbo”.
    reason: lexical_alternative
  - marker: d
    text: Isto é, tema com humilde reverência e cautela diante de Deus, sem presunção arrogante.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Está certo
  rationale: Funciona como resposta afirmativa à declaração do interlocutor no versículo anterior. “Está certo” é natural em português e preserva a força de aprovação.
- source_word: ἀπιστίᾳ
  choice: por causa da incredulidade
  rationale: O dativo tem sentido causal ou instrumental no contexto. A formulação explicita que os ramos foram quebrados em razão da incredulidade e mantém o contraste com πίστις.
- source_word: ἐξεκλάσθησαν
  choice: foram quebrados
  rationale: Preserva a imagem concreta dos ramos da oliveira no contexto. “Quebrados” comunica o sentido de terem sido arrancados ou separados da árvore sem substituir a metáfora por linguagem abstrata.
- source_word: πίστει
  choice: pela fé
  rationale: O dativo indica meio ou base. “Fé” mantém a terminologia paulina tradicional e contrasta diretamente com “incredulidade”.
- source_word: ἕστηκας
  choice: você permanece firme
  rationale: O perfeito expressa um estado presente resultante. “Permanece firme” comunica em português natural a situação contínua indicada pelo verbo, sem perder a imagem de sustentação.
- source_word: ὑψηλὰ φρόνει
  choice: seja arrogante
  rationale: A expressão idiomática adverte contra pensar de modo elevado a respeito de si mesmo. “Ser arrogante” transmite esse sentido com clareza em português atual.
- source_word: φοβοῦ
  choice: tema
  rationale: O imperativo preserva a advertência breve e incisiva do grego. A tradução não reduz o termo a mero respeito nem o intensifica necessariamente como pânico.
theological_decisions:
- issue: Sentido de πίστις em contraste com ἀπιστία
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contraste explícito com “incredulidade” favorece aqui a resposta humana de fé ou confiança. “Fé” preserva a formulação teológica sem excluir a nuance de confiança; “fidelidade” é possível lexicalmente, mas menos provável neste contexto.
- issue: Força de φοβοῦ
  choice: tema
  alternative: tenha medo; tenha temor reverente
  rationale: O contexto adverte contra a presunção diante da severidade e da bondade de Deus. “Tema” preserva a tensão entre reverência, cautela e medo, sem resolver o termo apenas como respeito nem como terror.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O singular σὺ é vertido por “você”. A redação mantém a metáfora dos ramos, o contraste entre incredulidade e fé e a força direta do imperativo final.
