  naturalness: O português é moderno, claro e de registro apropriado. “Assim também estes agora foram desobedientes” mantém uma cadência levemente formal, mas continua natural e compreensível no contexto de uma tradução bíblica de equivalência equilibrada. A repetição de “agora” é justificada pela repetição no grego.
  terminology: “Misericórdia”, “desobedientes” e “recebam misericórdia” são escolhas terminologicamente estáveis e teologicamente não tendenciosas. “Vocês” atende bem ao alvo de português internacional com legibilidade brasileira.
