id: ROM.11.31
reference: Romans 11:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: pt
  text: Assim também estes agora foram desobedientes, para que, pela misericórdia mostrada a vocês,[a] eles também agora recebam misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da misericórdia de vocês”. A expressão grega pode ser entendida mais literalmente dessa maneira, mas, no contexto, provavelmente se refere à misericórdia que Deus mostrou a vocês.'
    reason: Leitura alternativa da expressão dativa grega e preservação de sua ambiguidade.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Introduz a correspondência com a afirmação anterior e preserva de modo natural a força comparativa e inferencial.
- source_word: οὗτοι
  choice: estes
  rationale: Mantém a força demonstrativa, referindo-se a Israel no contexto, sem substituí-la por um pronome menos explícito.
- source_word: νῦν
  choice: agora
  rationale: Preserva, nas duas ocorrências, a ênfase temporal de Paulo no estágio presente de sua argumentação.
- source_word: ἠπείθησαν
  choice: foram desobedientes
  rationale: ἀπειθέω pode envolver tanto incredulidade quanto desobediência; esta formulação conserva o sentido amplo sem reduzi-lo a mera falta de convicção intelectual.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: pela misericórdia mostrada a vocês
  rationale: 'Explicita de forma idiomática a leitura contextual mais provável: a misericórdia de Deus concedida aos destinatários gentios, preservando em nota a construção mais literal.'
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a relação de propósito ou resultado do grego.
- source_word: καὶ αὐτοὶ
  choice: eles também
  rationale: Conserva a inclusão enfática de Israel no recebimento da misericórdia, sem tornar a frase artificial.
- source_word: ἐλεηθῶσιν
  choice: recebam misericórdia
  rationale: Comunica com clareza o passivo, no qual a misericórdia é concedida, e evita uma construção excessivamente rígida.
theological_decisions:
- issue: Se «τῷ ὑμετέρῳ ἐλέει» designa a misericórdia exercida pelos cristãos gentios ou a misericórdia de Deus concedida a eles
  choice: pela misericórdia mostrada a vocês
  alternative: por meio da misericórdia de vocês
  rationale: O desenvolvimento de Romanos 11:30–32 contrasta a desobediência dos dois grupos com a misericórdia divina recebida por eles. A leitura escolhida favorece esse fluxo sem ocultar a ambiguidade gramatical, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “agora” e o demonstrativo “estes” foram mantidos por refletirem ênfases reais do texto grego.
