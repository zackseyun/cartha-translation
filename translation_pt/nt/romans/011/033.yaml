id: ROM.11.33
reference: Romans 11:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: pt
  text: Ó profundidade da riqueza, da sabedoria e do conhecimento de Deus![a] Como são insondáveis os seus juízos e impossíveis de rastrear[b] os seus caminhos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ó profundidade da riqueza tanto da sabedoria como do conhecimento de Deus!» A sintaxe grega permite ligar «riqueza» mais estreitamente aos dois termos seguintes; o texto principal entende os três substantivos como qualidades pertencentes a Deus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «inescrutáveis». A expressão grega descreve aquilo cujos rastros não podem ser seguidos, nuance distinta de «insondáveis».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Ó
  rationale: Partícula exclamativa que introduz admiração e louvor; «Ó» preserva sua força e continua natural no registro bíblico e solene em português.
- source_word: βάθος
  choice: profundidade
  rationale: Mantém a metáfora da profundidade imensurável das qualidades divinas.
- source_word: πλούτου
  choice: riqueza
  rationale: Reproduz o substantivo singular grego e preserva a ideia paulina de abundância, sem restringi-la a bens materiais.
- source_word: σοφίας
  choice: sabedoria
  rationale: Equivalente direto e natural, distinto de «conhecimento».
- source_word: γνώσεως
  choice: conhecimento
  rationale: Equivalente corrente que conserva sua distinção em relação à sabedoria.
- source_word: θεοῦ
  choice: de Deus
  rationale: Preserva a construção genitiva e permite que a expressão se relacione naturalmente com a série anterior.
- source_word: ἀνεξεραύνητα
  choice: insondáveis
  rationale: Comunica que os juízos de Deus não podem ser plenamente investigados ou compreendidos.
- source_word: κρίματα
  choice: juízos
  rationale: Preserva a amplitude do termo, que pode abranger avaliações, decisões e determinações divinas.
- source_word: ἀνεξιχνίαστοι
  choice: impossíveis de rastrear
  rationale: Expressa a imagem de algo cujos rastros não podem ser seguidos e mantém uma diferença perceptível em relação a «insondáveis».
- source_word: ὁδοὶ
  choice: caminhos
  rationale: Conserva a metáfora bíblica referente às maneiras de Deus agir.
theological_decisions:
- issue: Relação de «de Deus» com «riqueza, sabedoria e conhecimento»
  choice: 'Entender «de Deus» como relacionado aos três substantivos coordenados: sua riqueza, sua sabedoria e seu conhecimento.'
  alternative: Entender a riqueza como a riqueza constituída pela sabedoria e pelo conhecimento de Deus.
  rationale: A primeira leitura é natural no contexto e preserva a acumulação doxológica, enquanto a nota registra a conexão sintática mais estreita também permitida pelo grego.
- issue: Distinção entre ἀνεξεραύνητα e ἀνεξιχνίαστοι
  choice: Traduzir por «insondáveis» e «impossíveis de rastrear».
  alternative: Usar termos mais próximos entre si, como «insondáveis» e «inescrutáveis».
  rationale: As escolhas mantêm o paralelismo sem apagar a imagem específica do segundo adjetivo, ligada a seguir rastros.
translation_notes:
  register: Português moderno, claro e digno, com cadência doxológica. O singular «riqueza» segue o grego; «impossíveis de rastrear» favorece a transparência sem eliminar a metáfora original.
