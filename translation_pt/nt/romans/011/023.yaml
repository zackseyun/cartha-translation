id: ROM.11.23
reference: Romans 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: pt
  text: E também eles, se não continuarem na incredulidade, serão enxertados; pois Deus é capaz de enxertá-los novamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: E também eles
  rationale: Expressa a força aditiva de καί, incorporada em κἀκεῖνοι, e mantém δέ como progressão levemente contrastiva, sem tornar a oposição mais forte do que no grego.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: se não continuarem
  rationale: A construção condicional com o presente do subjuntivo indica uma condição futura e preserva a ideia durativa de permanecer ou persistir num estado.
- source_word: τῇ ἀπιστίᾳ
  choice: na incredulidade
  rationale: Neste contexto de Romanos 11, ἀπιστία contrasta diretamente com a fé e designa sobretudo a recusa em crer; 'incredulidade' é a formulação portuguesa natural e precisa.
- source_word: ἐγκεντρισθήσονται
  choice: serão enxertados
  rationale: Mantém a voz passiva futura e a metáfora da oliveira. Não antecipa aqui a ideia de retorno, pois πάλιν aparece explicitamente apenas na oração seguinte.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: pois Deus é capaz
  rationale: Reproduz a explicação introduzida por γάρ e expressa com clareza a capacidade divina indicada pelo adjetivo δυνατός.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: de enxertá-los novamente
  rationale: Mantém a repetição do verbo da metáfora e traduz explicitamente πάλιν como 'novamente', indicando restauração.
theological_decisions:
- issue: Sentido de ἀπιστία no contexto
  choice: incredulidade
  alternative: infidelidade
  rationale: Embora ἀπιστία possa, em certos contextos, significar infidelidade, a oposição entre fé e incredulidade em Romanos 11 favorece o sentido de recusa em crer. A tradução não amplia o termo para uma categoria teológica além do argumento imediato.
- issue: Localização explícita da ideia de restauração
  choice: A primeira ocorrência é 'serão enxertados'; 'novamente' aparece somente na segunda oração.
  alternative: serão enxertados de volta
  rationale: O grego coloca πάλιν somente junto ao segundo uso de ἐγκεντρίζω. Esta redação preserva essa distribuição, sem perder o sentido restaurador do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Enxertados' conserva a metáfora agrícola do contexto; a ordem das orações acompanha de perto o grego sem produzir construção artificial.
