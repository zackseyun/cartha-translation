  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: pt
  text: 'E Davi diz: “Que a mesa deles se torne uma armadilha e um laço[a], uma pedra de tropeço e uma retribuição para eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma armadilha e uma armadilha de caça”; os dois termos são próximos e descrevem meios de captura.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ λέγει
  choice: Davi diz
  rationale: Mantém o presente literário grego na introdução da citação e usa a forma tradicional portuguesa do nome.
- source_word: Γενηθήτω
  choice: Que ... se torne
  rationale: Expressa com naturalidade em português a força jussiva do imperativo, sem transformá-lo em simples previsão.
- source_word: ἡ τράπεζα αὐτῶν
  choice: a mesa deles
  rationale: Preserva a imagem concreta da mesa, sem explicitar no texto principal possíveis associações com alimento, provisão ou banquete.
- source_word: παγίδα
  choice: armadilha
  rationale: Termo corrente que comunica captura e permite distingui-lo do termo seguinte.
- source_word: θήραν
  choice: rede de caça
  rationale: Reflete a associação lexical com caça ou captura e evita a repetição pouco informativa de dois termos idênticos em português.
- source_word: σκάνδαλον
  choice: pedra de tropeço
  rationale: Preserva a metáfora de algo que provoca queda, em formulação bíblica ainda clara ao leitor moderno.
- source_word: ἀνταπόδομα αὐτοῖς
  choice: uma retribuição para eles
  rationale: Comunica a ideia de paga ou retorno devido no contexto punitivo, sem especificar além do substantivo grego.
theological_decisions:
- issue: Força imprecatória da citação do Salmo 69:22
  choice: Que a mesa deles se torne...
  alternative: A mesa deles se tornará...
  rationale: A formulação mantém a força jussiva do imperativo grego e não suaviza a imprecação em mera predição.
- issue: Sentido de ἀνταπόδομα
  choice: retribuição
  alternative: pagamento; recompensa; paga
  rationale: “Retribuição” conserva a noção de retorno correspondente e se ajusta ao contexto de juízo, sem introduzir uma explicação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação acumulativa do grego foi preservada, mas sem repetir a conjunção antes de cada elemento, o que soaria pesado em português.
