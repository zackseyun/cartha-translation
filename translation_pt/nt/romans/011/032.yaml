  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: pt
  text: Pois Deus encerrou[a] todos[c] na desobediência[b], a fim de ter misericórdia de todos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confinou todos” ou “manteve todos encerrados”.'
    reason: lexical_alternative
  - marker: b
    text: “Desobediência” também pode ser traduzida por “incredulidade” em certos contextos; aqui, porém, é provável o sentido mais amplo de recusa em obedecer.
    reason: lexical_alternative
  - marker: c
    text: A repetição de “todos” preserva a formulação de Paulo e não deve ser restringida de antemão; no contexto, ele trata conjuntamente de judeus e gentios.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: encerrou
  rationale: O aoristo de συγκλείω comunica a ação de fechar ou confinar em conjunto. “Encerrou” preserva a metáfora concreta sem acrescentar explicitamente a ideia penal de prisão.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do argumento anterior e mantém de forma concisa o encadeamento de Paulo.
- source_word: τοὺς πάντας
  choice: a todos / todos
  rationale: A repetição preserva a amplitude e a simetria retórica do grego, sem restringir no texto os referentes a judeus e gentios nem resolver antecipadamente a questão do alcance.
- source_word: εἰς ἀπείθειαν
  choice: na desobediência
  rationale: “Desobediência” conserva o sentido amplo de recusa em obedecer; a construção portuguesa natural com “encerrar na” expressa a condição ou esfera resultante indicada por εἰς.
- source_word: ἵνα
  choice: a fim de
  rationale: Expressa com clareza a força de propósito da oração grega.
- source_word: ἐλεήσῃ
  choice: usar de misericórdia para com
  rationale: Traduz o ato de exercer misericórdia de maneira digna e inteligível, sem fazer o subjuntivo grego soar como incerteza quanto à ação divina.
theological_decisions:
- issue: Alcance de “todos” nas duas orações
  choice: Manter “todos” nas duas ocorrências, sem qualificação.
  alternative: Explicitar “todos os seres humanos” ou “tanto judeus como gentios”.
  rationale: O grego repete a mesma expressão abrangente. O contexto inclui judeus e gentios, mas a tradução deve preservar a simetria e a tensão teológica do texto, sem decidir por meio de expansão interpretativa o debate sobre seu alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue a ocorrência e a relação imediata com as expressões comentadas.
