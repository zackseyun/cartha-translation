  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: pt
  text: Pois dele, por meio dele e para ele são todas as coisas. A ele seja a glória para sempre[a]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para as eras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou o fundamento da doxologia anterior, preservando a força causal em português natural.
- source_word: ἐξ αὐτοῦ
  choice: dele
  rationale: ἐκ/ἐξ com genitivo indica fonte ou origem; “dele” expressa de modo conciso que todas as coisas procedem de Deus.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com genitivo indica meio ou agência; “por meio dele” explicita essa relação sem alterar o sentido.
- source_word: εἰς αὐτὸν
  choice: para ele
  rationale: Preserva a ideia de direção, finalidade ou meta presente em εἰς, sem reduzi-la a uma única nuance.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém a abrangência cósmica do neutro plural substantivado e o tom elevado da declaração.
- source_word: αὐτῷ ἡ δόξα
  choice: A ele seja a glória
  rationale: Supre naturalmente o verbo ausente na oração grega e conserva sua força doxológica.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Traduz de modo idiomático a expressão literalmente temporal “pelos séculos”, que comunica duração sem fim.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a forma litúrgica tradicional e plenamente corrente em português.
theological_decisions:
- issue: Referente dos pronomes repetidos αὐτοῦ/αὐτὸν/αὐτῷ
  choice: Manter os pronomes “dele”, “ele” e “A ele”, tendo Deus como referente contextual.
  alternative: Substituir os pronomes por “Deus”.
  rationale: Romanos 11:33–35 identifica o referente pelo contexto. Preservar os pronomes mantém a estrutura retórica do grego sem estreitar ou expandir explicitamente a referência.
- issue: Sentido de εἰς αὐτόν
  choice: “para ele”, preservando direção, meta e possível finalidade.
  alternative: “com vistas a ele” ou “para a glória dele”.
  rationale: A formulação escolhida conserva a tensão e a amplitude sem acrescentar uma finalidade específica que o texto não explicita.
- issue: Forma da atribuição αὐτῷ ἡ δόξα
  choice: “A ele seja a glória”.
  alternative: “A ele pertence a glória”.
  rationale: A forma optativa comunica naturalmente a doxologia, enquanto a alternativa poderia soar como mera afirmação de posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tríade “dele, por meio dele e para ele” preserva o paralelismo do grego; “todas as coisas” mantém o alcance solene e abrangente. O marcador [a] aparece no texto principal.
