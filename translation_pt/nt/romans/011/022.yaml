  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: pt
  text: 'Considere, portanto, a bondade[a] e a severidade de Deus: severidade para com os que caíram, mas bondade de Deus para com você, se você permanecer nessa bondade; caso contrário, você também será cortado[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “benignidade”. O termo grego pode indicar bondade, benignidade ou benevolência.
    reason: lexical_alternative
  - marker: b
    text: Ou “será quebrado”. “Será cortado” traduz mais diretamente o verbo grego; “será quebrado” é uma alternativa contextual, em vista da imagem da oliveira no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: Considere
  rationale: O imperativo convoca o leitor a observar e refletir atentamente; “Considere” expressa essa força exortativa em português atual.
- source_word: χρηστότητα / χρηστότης
  choice: bondade
  rationale: O termo indica a disposição benévola e generosa de Deus. “Bondade” é natural e digna em português, mantendo o contraste com “severidade”; “benignidade” também é possível, mas menos corrente.
- source_word: ἀποτομίαν / ἀποτομία
  choice: severidade
  rationale: O substantivo comunica rigor e ação decisiva no juízo, sem exigir uma intensificação além do texto.
- source_word: ἐπὶ μὲν τοὺς πεσόντας / ἐπὶ δὲ σὲ
  choice: para com os que caíram / para com você
  rationale: “Para com” preserva a direção relacional das duas expressões paralelas com ἐπί e mantém o contraste distributivo.
- source_word: πεσόντας
  choice: os que caíram
  rationale: O particípio substantivado identifica aqueles que caíram no contexto da metáfora da oliveira, sem acrescentar uma interpretação teológica específica.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: se você permanecer nessa bondade
  rationale: “Permanecer” expressa a continuidade requerida, e “nessa” retoma claramente a bondade de Deus já mencionada sem inserir um possessivo ausente do grego.
- source_word: ἐπεὶ
  choice: caso contrário
  rationale: No contexto, introduz a consequência negativa de não se cumprir a condição; “caso contrário” comunica essa lógica de modo idiomático.
- source_word: ἐκκοπήσῃ
  choice: será cortado
  rationale: O futuro passivo de ἐκκόπτω significa literalmente “ser cortado”. A formulação também se ajusta à imagem da oliveira, embora “ser arrancado” seja uma alternativa contextual.
theological_decisions:
- issue: Advertência condicional relacionada à bondade e à severidade de Deus
  choice: 'Manter a condição e a advertência em seu sentido direto: a bondade de Deus é dirigida ao destinatário se ele permanecer nela; caso contrário, ele também será cortado.'
  alternative: Tratar a advertência como apenas hipotética ou explicá-la segundo uma doutrina específica de perseverança, apostasia ou eleição coletiva.
  rationale: O grego apresenta uma condição e uma advertência reais, mas o versículo, por si só, não resolve as discussões posteriores sobre perseverança, apostasia nem aplicação individual ou coletiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular “você” representa o pronome grego singular e preserva a interpelação direta. A repetição de “bondade” e “severidade” mantém o paralelismo enfático do original.
