reference: Romans 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: pt
  text: “Senhor, eles mataram os teus profetas, derrubaram os teus altares, e só eu fiquei; procuram tirar a minha vida[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “procuram a minha vida”. A expressão grega significa que procuram matar-me.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος em discurso direto dirigido a Deus; “Senhor” é a forma natural e tradicional no Novo Testamento, sem recorrer a “SENHOR” nem ao menos adequado “Mestre”.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Equivalente direto e natural do aoristo de ἀποκτείνω; evita acrescentar a qualificação jurídica ou moral de “assassinaram”.
- source_word: τὰ θυσιαστήριά σου
  choice: os teus altares
  rationale: θυσιαστήριον designa um altar, especialmente sacrificial. “Altares” é claro no contexto e não requer explicitação adicional.
- source_word: κατέσκαψαν
  choice: derrubaram
  rationale: Comunica de modo concreto e idiomático a ideia de arrasar ou demolir os altares.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: e só eu fiquei
  rationale: Preserva a alegação de exclusividade expressa por μόνος e comunica naturalmente em português o resultado do passivo ὑπελείφθην.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: procuram tirar a minha vida
  rationale: Expressa naturalmente a fórmula idiomática grega, cujo sentido contextual é buscar matar Elias, e mantém o aspecto presente de ζητοῦσιν sem sugerir uma busca pela alma imaterial.
theological_decisions:
- issue: Sentido de ψυχή na fórmula de ameaça
  choice: a minha vida
  alternative: a minha alma
  rationale: Neste contexto, ψυχή se refere à vida de Elias sob ameaça, não à alma como componente imaterial. A tradução evita introduzir uma questão antropológica estranha à passagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “só eu fiquei” é mais natural do que “eu sozinho fui deixado”, sem perder a ênfase numérica de μόνος. O ponto e vírgula organiza a sequência da citação, e “agora” torna explícita em português a continuidade presente da ameaça, sem alterar seu conteúdo.
