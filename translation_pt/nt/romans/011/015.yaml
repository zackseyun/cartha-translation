id: ROM.11.15
reference: Romans 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: pt
  text: Pois, se a rejeição deles é a reconciliação do mundo, o que será o acolhimento deles[a], senão vida dentre os mortos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recepção”. O termo grego contrasta com “rejeição” e pode indicar que eles são recebidos de volta ou aceitos.
    reason: lexical_alternative
  - marker: b
    text: “Vida dentre os mortos” pode referir-se figuradamente a uma extraordinária renovação espiritual ou, mais especificamente, à ressurreição; Paulo mantém a expressão concisa e evocativa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: rejeição
  rationale: Expressa com naturalidade o ato de pôr de lado ou rejeitar e mantém o contraste relacional com πρόσλημψις.
- source_word: καταλλαγὴ
  choice: reconciliação
  rationale: Preserva o sentido paulino habitual de restauração de relacionamento e é expressão clara no português contemporâneo.
- source_word: κόσμου
  choice: do mundo
  rationale: Mantém a formulação ampla de Paulo sem restringi-la explicitamente aos gentios.
- source_word: πρόσλημψις
  choice: acolhimento
  rationale: Forma um contraste natural com “rejeição” e comunica que eles são recebidos ou aceitos, sem explicitar além do texto quem os acolhe.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: vida dentre os mortos
  rationale: Reproduz a imagem concisa do grego e preserva sua possível dimensão tanto figurada quanto escatológica.
- source_word: εἰ μὴ
  choice: senão
  rationale: Em uma pergunta retórica, “senão” introduz de modo idiomático a resposta enfática esperada.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa do versículo com o argumento anterior.
theological_decisions:
- issue: Sentido de “vida dentre os mortos”
  choice: Manter a expressão aberta, sem definir se indica renovação espiritual extraordinária, ressurreição ou ambas.
  alternative: Traduzir explicitamente como “ressurreição” ou como “grande renovação espiritual”.
  rationale: A formulação grega é breve e evocativa; especificar uma dessas leituras resolveria uma tensão interpretativa que Paulo deixa aberta.
- issue: Agente e sentido do “acolhimento deles”
  choice: Preservar a construção nominal e relacional, entendendo “deles” como objeto do acolhimento sem nomear o agente.
  alternative: Explicitar “quando Deus os aceitar novamente”.
  rationale: O contexto favorece que Israel seja recebido, mas o grego não declara aqui o agente; a tradução evita acrescentá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Pois” conserva a progressão argumentativa; “acolhimento” evita a possível leitura de “aceitação deles” como o ato de eles aceitarem algo; “vida dentre os mortos” mantém a imagem e a ambiguidade do original.
