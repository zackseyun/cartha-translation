  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: pt
  text: Pois quem conheceu a mente do Senhor? Ou quem se tornou seu conselheiro?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo faz eco a Isaías 40:13, onde o texto grego também pergunta quem conheceu a mente do Senhor ou se tornou seu conselheiro.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; «quem» é direto, natural e preserva a força da citação.
- source_word: γὰρ
  choice: Pois
  rationale: Conjunção explicativa que fundamenta a afirmação anterior; «Pois» conserva a ligação argumentativa sem especificar excessivamente a nuance.
- source_word: ἔγνω
  choice: conheceu
  rationale: O aoristo de γινώσκω, na pergunta retórica que ecoa Isaías 40:13, é expresso naturalmente pelo pretérito perfeito; «conheceu» permanece próximo do grego e evita o mais interpretativo «compreendeu».
- source_word: νοῦν
  choice: mente
  rationale: Neste contexto, νοῦς denota mente, pensamento ou entendimento; «mente» é a correspondência mais direta e mantém a formulação reconhecível da alusão a Isaías.
- source_word: κυρίου
  choice: do Senhor
  rationale: κύριος é traduzido por «Senhor». A contração «do» é a forma idiomática exigida em português na expressão «a mente do Senhor».
- source_word: ἢ
  choice: Ou
  rationale: Conjunção disjuntiva que liga as duas perguntas retóricas paralelas e preserva a estrutura grega.
- source_word: σύμβουλος
  choice: conselheiro
  rationale: O substantivo designa alguém que dá conselho; «conselheiro» é um equivalente direto, claro e de registro dignificado.
- source_word: αὐτοῦ
  choice: seu
  rationale: Pronome possessivo natural em português. O referente é o Senhor, claramente indicado pela frase anterior.
- source_word: ἐγένετο
  choice: se tornou
  rationale: γίνομαι significa aqui «tornar-se» ou «vir a ser». «Se tornou» preserva a ideia de passar a ocupar a posição de conselheiro, sem acrescentar a expressão interpretativa «alguma vez».
theological_decisions:
- issue: Referente de «Senhor» na citação derivada de Isaías
  choice: Traduzir como «Senhor», sem restringir o referente além do texto; no contexto, refere-se a Deus e ressalta sua sabedoria insondável.
  alternative: Empregar uma forma explicitamente ligada ao nome divino no texto de Isaías, como «SENHOR».
  rationale: O texto grego de Romanos traz κυρίου. A tradução preserva a formulação neotestamentária e a alusão à tradição grega de Isaías 40:13, sem importar para o texto principal uma distinção tipográfica ausente do grego.
translation_notes:
  register: Português moderno, claro e dignificado, com cadência adequada a uma citação bíblica. «Pois» mantém o vínculo argumentativo, enquanto «mente» e «conselheiro» preservam a formulação concisa e elevada do original.
