id: ROM.11.26
reference: Romans 11:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: pt
  text: 'E assim todo o Israel será salvo[a], como está escrito: “De Sião virá o Libertador; ele afastará de Jacó as impiedades.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E desta maneira todo o Israel será salvo”. A palavra grega traduzida por “assim” pode indicar o modo pelo qual isso acontecerá. A expressão “todo o Israel” é muito discutida; a tradução mantém as palavras do grego sem decidir se se refere a Israel étnico em sua totalidade, ao remanescente fiel ou à totalidade do povo de Deus.'
    reason: lexical_alternative
  - marker: b
    text: A citação que se estende pelos versículos 26–27 combina linguagem de Isaías 59:20 e 27:9. Em Isaías 59:20, no texto hebraico, o redentor vem “a Sião”, enquanto a forma citada por Paulo diz “de Sião”.
    reason: source_text
lexical_decisions:
- source_word: οὕτως
  choice: assim
  rationale: “Assim” é natural em português e preserva tanto o valor modal (“desta maneira”) quanto a possível leitura consecutiva (“desse modo”), sem decidir além do grego.
- source_word: πᾶς Ἰσραήλ
  choice: todo o Israel
  rationale: Reproduz de modo natural a expressão grega e mantém em aberto seu referente preciso.
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo de σῴζω tem aqui claro peso salvífico; “será salvo” preserva essa força.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente e digna para introduzir uma citação das Escrituras.
- source_word: Ἥξει ἐκ Σιὼν
  choice: De Sião virá
  rationale: Mantém a origem expressa por ἐκ e produz uma ordem natural e solene em português.
- source_word: ὁ ῥυόμενος
  choice: o Libertador
  rationale: Traduz o particípio substantivado como designação titular, preservando seu peso no contexto da citação.
- source_word: ἀποστρέψει
  choice: afastará
  rationale: Conserva a imagem de fazer desviar ou retirar, sem explicitar indevidamente o mecanismo da ação.
- source_word: ἀσεβείας
  choice: as impiedades
  rationale: O plural corresponde ao grego e expressa atos ou manifestações de irreverência contra Deus.
- source_word: ἀπὸ Ἰακώβ
  choice: de Jacó
  rationale: Preserva o nome e a formulação poética da citação, sem harmonizá-lo com “Israel”.
theological_decisions:
- issue: Referente de “todo o Israel”
  choice: A expressão foi mantida sem explicação interpretativa no corpo do texto.
  alternative: “a totalidade do Israel étnico”, “o remanescente fiel de Israel” ou “todo o povo de Deus”
  rationale: O grego não resolve por si só a disputa; a tradução deve preservar essa tensão teológica.
- issue: Identidade de ὁ ῥυόμενος
  choice: “Libertador” com inicial maiúscula
  alternative: “libertador” ou “aquele que liberta”
  rationale: No uso paulino desta citação, a expressão tem força de título messiânico; a maiúscula sinaliza isso sem acrescentar um nome ao texto.
- issue: Relação indicada por οὕτως
  choice: “E assim”
  alternative: “E desta maneira” ou “E desse modo”
  rationale: “Assim” conserva a possível referência ao modo anteriormente descrito, mas não exclui completamente a nuance conclusiva do advérbio.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem “De Sião virá” mantém o tom profético sem soar arcaica. “Impiedades” conserva o plural do original e o registro religioso da citação.
