id: ROM.11.8
reference: Romans 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: pt
  text: 'assim como está escrito: “Deus lhes deu um espírito de torpor[a], olhos para não ver e ouvidos para não ouvir, até o dia de hoje.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito de sono profundo”. A expressão ecoa Isaías 29:10, embora o termo grego usado aqui indique torpor, entorpecimento ou insensibilidade.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: assim como está escrito
  rationale: Reproduz a fórmula de citação das Escrituras e expressa naturalmente o valor de καθώς.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Deus lhes deu
  rationale: Mantém Deus como sujeito explícito e traduz o aoristo por um passado simples, sem atenuar a agência divina.
- source_word: πνεῦμα κατανύξεως
  choice: um espírito de torpor
  rationale: “Torpor” comunica o estado de insensibilidade ou entorpecimento indicado por κατάνυξις, preservando em nota a alternativa ligada ao eco de Isaías 29:10.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: olhos para não ver
  rationale: A construção compacta com “para não” representa de modo natural a estrutura τοῦ μή com infinitivo, sem decidir rigidamente entre propósito e resultado.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: ouvidos para não ouvir
  rationale: Mantém o paralelismo com a expressão anterior e o sentido básico de ἀκούω.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural e solene que conserva a referência enfática ao presente do autor.
theological_decisions:
- issue: Agência divina no endurecimento ou na insensibilidade judicial
  choice: “Deus lhes deu um espírito de torpor”
  alternative: “Deus permitiu que tivessem um espírito de torpor”
  rationale: O grego apresenta Deus diretamente como sujeito de ἔδωκεν. A tradução preserva essa afirmação e sua tensão teológica, sem transformá-la em mera permissão nem desenvolver um sistema doutrinário além do texto.
- issue: Valor de τοῦ μὴ com os infinitivos βλέπειν e ἀκούειν
  choice: “para não ver” e “para não ouvir”
  alternative: “sem que vissem” e “sem que ouvissem”
  rationale: “Para não” conserva a formulação teleológica ou consecutiva possível no grego e evita eliminar sua ambiguidade ao especificar exclusivamente propósito ou resultado.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A cadência paralela da citação foi preservada, e o marcador [a] aparece junto à expressão a que se refere.
