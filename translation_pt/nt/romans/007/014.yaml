  terminology: «Lei», «espiritual», «carnal» e «pecado» são terminologia estável e adequada no contexto de Romanos. As notas distinguem devidamente a alternativa mais literal para σάρκινος e a dimensão de escravidão e domínio implicada em «vendido sob o pecado», sem fechar questões doutrinárias sobre a identidade do «eu».
