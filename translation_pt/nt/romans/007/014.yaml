  source_fidelity: 'A tradução reproduz com precisão a estrutura e os termos centrais do grego: οἴδαμεν («sabemos»), ὁ νόμος πνευματικός («a lei é espiritual»), σάρκινός («carnal») e πεπραμένος ὑπὸ τὴν ἁμαρτίαν («vendido sob o pecado»). «Carnal» conserva adequadamente o contraste paulino com «espiritual», sem introduzir a formulação interpretativa «natureza pecaminosa».'
