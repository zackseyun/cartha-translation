id: ROM.7.14
reference: Romans 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: pt
  text: Pois sabemos que a lei é espiritual, mas eu sou carnal[a], vendido sob o pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “feito de carne”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, vendido como escravo e colocado sob o domínio do pecado.
    reason: metaphor_clarification
lexical_decisions:
- source_word: Οἴδαμεν
  choice: sabemos
  rationale: Expressa conhecimento reconhecido e compartilhado por Paulo e seus leitores, de modo direto e natural.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o argumento anterior sem tornar a relação excessivamente causal.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Preserva a forma grega sem especificar no próprio texto se a referência é, em sentido estrito, à Lei mosaica.
- source_word: πνευματικός
  choice: espiritual
  rationale: É o equivalente mais transparente e conserva o contraste deliberado com σάρκινος.
- source_word: σάρκινός
  choice: carnal
  rationale: Conserva a linguagem paulina da carne e o contraste lexical com “espiritual”, sem introduzir a interpretação mais específica “de natureza pecaminosa”.
- source_word: πεπραμένος
  choice: vendido
  rationale: O particípio perfeito passivo descreve o estado resultante de ter sido vendido; a formulação mantém a metáfora, enquanto a nota explicita sua dimensão de escravidão.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: sob o pecado
  rationale: Reproduz a expressão compacta de sujeição e evita transformar no texto principal “pecado” em uma paráfrase interpretativa como “poder do pecado”.
theological_decisions:
- issue: Sentido da linguagem paulina da carne
  choice: “carnal”, com a alternativa literal “feito de carne” em nota
  alternative: “pecaminoso” ou “de natureza pecaminosa”
  rationale: A tradução preserva a tensão entre a lei “espiritual” e o eu “carnal” sem converter a antropologia de Paulo em uma fórmula doutrinária posterior.
- issue: Natureza da sujeição ao pecado
  choice: Manter a metáfora “vendido sob o pecado”
  alternative: “vendido como escravo ao poder do pecado”
  rationale: A imagem implica escravidão e domínio, mas o texto principal conserva a concisão e a ambiguidade retórica do grego; a explicação fica na nota.
- issue: Identidade e condição do “eu”
  choice: Não definir no versículo se Paulo descreve sua experiência presente, passada ou uma voz representativa
  alternative: Explicitar que se trata necessariamente do Paulo regenerado ou não regenerado
  rationale: O versículo isolado não resolve essa questão interpretativa; acrescentar tal identificação importaria uma conclusão teológica contestada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Carnal” é mantido por sua correspondência lexical e por preservar o contraste com “espiritual”; a nota evita que o termo seja entendido apenas no sentido moderno de sensualidade. A construção deliberadamente compacta “sob o pecado” conserva a imagem de sujeição do original.
