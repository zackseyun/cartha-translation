  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: pt
  text: 'Mas, se faço o que não quero, concordo com a lei: ela é boa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Preserva a força condicional de εἰ e o valor levemente contrastivo e continuativo de δέ em português natural.
- source_word: ὃ … τοῦτο
  choice: aquilo que
  rationale: Expressa naturalmente a construção correlativa grega, mantendo a referência enfática ao que é feito contra o próprio querer.
- source_word: θέλω
  choice: quero
  rationale: É o equivalente moderno mais direto para o desejo interior contrastado com a ação.
- source_word: ποιῶ
  choice: faço
  rationale: Reproduz de modo simples e direto o presente grego.
- source_word: σύμφημι
  choice: concordo com
  rationale: Comunica assentimento ao juízo da lei e acomoda naturalmente o dativo τῷ νόμῳ.
- source_word: νόμῳ
  choice: a lei
  rationale: Mantém a expressão definida do grego sem transformar o termo em título estilizado ou acrescentar uma identificação ausente do versículo.
- source_word: καλός
  choice: boa
  rationale: É a tradução direta da avaliação moral positiva da lei, com a concordância de gênero exigida em português.
theological_decisions:
- issue: Se a declaração de Paulo implica uma avaliação positiva da própria lei
  choice: concordo com a lei que ela é boa
  alternative: reconheço que a lei é boa
  rationale: A formulação mantém explícitos tanto o assentimento de Paulo à lei quanto a afirmação de que ela é boa, sem eliminar a tensão do contexto nem reduzir σύμφημι a mero reconhecimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição simples de “faço” e “quero” acompanha a concisão argumentativa do grego; “aquilo que” evita rigidez excessiva sem perder a correlação do original.
