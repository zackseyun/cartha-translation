  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: pt
  text: Pois sei que nenhum bem habita em mim, isto é, na minha carne. Pois o querer está ao meu alcance, mas realizar o bem, não.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outros manuscritos trazem uma leitura mais longa: “mas não encontro realizar o bem”.'
    reason: variante_textual
lexical_decisions:
- source_word: οἶδα
  choice: sei
  rationale: O perfeito grego tem sentido presente; “sei” é a correspondência natural e direta em português.
- source_word: οἰκεῖ
  choice: habita
  rationale: Preserva a metáfora paulina de residência interior e mantém um registro digno e corrente.
- source_word: ἀγαθόν
  choice: bem algum
  rationale: Com a negação οὐκ, a expressão portuguesa “não habita bem algum” comunica naturalmente que nada de bom habita ali.
- source_word: σάρξ
  choice: carne
  rationale: Mantém a formulação de Paulo e sua tensão teológica, sem interpretar antecipadamente o termo como “natureza pecaminosa”.
- source_word: θέλειν
  choice: o querer
  rationale: Reproduz o infinitivo substantivado e preserva o paralelismo com “o realizar”.
- source_word: παράκειταί μοι
  choice: está presente em mim
  rationale: Expressa a proximidade ou disponibilidade do querer e conserva a referência pessoal do dativo μοι.
- source_word: κατεργάζεσθαι
  choice: o realizar
  rationale: Reflete o infinitivo substantivado e comunica a ideia de efetuar ou levar a cabo, em paralelo com “o querer”.
- source_word: τὸ καλόν
  choice: o bem
  rationale: Preserva de modo conciso a categoria moral expressa pelo adjetivo substantivado.
- source_word: οὔ
  choice: não
  rationale: Mantém a elipse abrupta do grego; em português, a vírgula permite compreender “não está presente” sem completar excessivamente a frase.
theological_decisions:
- issue: Sentido de σάρξ em um contexto paulino moralmente carregado
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” preserva o vocabulário e a ambiguidade teológica do texto-fonte, enquanto “natureza pecaminosa” explicita uma interpretação possível, porém mais restritiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura conserva o paralelismo entre “o querer” e “o realizar”, bem como a concisão elíptica da oração final. A nota registra a variante textual relevante no fim do versículo; não se apresenta “natureza pecaminosa” como tradução equivalente na nota, pois isso resolveria interpretativamente o termo σάρξ.
