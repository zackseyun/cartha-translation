revisions:
- from: Pois sei que em mim, isto é, na minha carne, não habita bem algum; porque o querer está presente em mim, mas o realizar o bem, não.[a]
  to: Pois sei que nenhum bem habita em mim, isto é, na minha carne. Pois o querer está ao meu alcance, mas realizar o bem, não.[a]
  rationale: A revisão torna mais natural a primeira oração, representa παράκειταί μοι como proximidade ou disponibilidade («ao meu alcance») e preserva a elipse enfática do término. A nota foi ajustada para não desenvolver além do necessário a leitura textual mais longa, sem alterar a leitura curta adotada pelo SBLGNT.
