id: ROM.7.20
reference: Romans 7:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: pt
  text: Mas, se faço aquilo que não quero, já não sou eu quem o realiza[a], mas o pecado que habita em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não sou eu que o faço”.'
    reason: Registra uma alternativa mais literal e idiomática para κατεργάζομαι αὐτό, embora ela não preserve a distinção verbal em relação a ποιῶ na primeira oração.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Mantém a condição e o leve contraste que dão continuidade ao argumento de Paulo, em português natural.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: faço aquilo que não quero
  rationale: Expressa com clareza a estrutura correlativa do grego e conserva θέλω como vontade ou desejo, sem explicação teológica adicional.
- source_word: οὐκέτι ἐγὼ
  choice: já não sou eu
  rationale: Preserva tanto o sentido de οὐκέτι quanto a ênfase do pronome explícito ἐγώ.
- source_word: κατεργάζομαι αὐτό
  choice: quem o realiza
  rationale: ‘Realiza’ comunica a ideia de efetuar ou produzir e evita achatar completamente a distinção lexical entre ποιῶ (‘faço’) e κατεργάζομαι.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: o pecado que habita em mim
  rationale: Conserva a personificação do pecado e o sentido duradouro de οἰκέω, sem substituir ‘pecado’ por uma interpretação como ‘natureza pecaminosa’.
theological_decisions:
- issue: A distinção retórica entre o ‘eu’ e o pecado que nele habita pode ser entendida como diminuição da responsabilidade pessoal.
  choice: 'Traduzir diretamente a tensão: ‘já não sou eu quem o realiza, mas o pecado que habita em mim’.'
  alternative: Parafrasear a frase para explicar a relação entre responsabilidade humana e pecado interior.
  rationale: O texto grego mantém lado a lado a ação do ‘eu’ e a atuação personificada do pecado; a tradução não deve resolver uma questão teológica que Paulo deixa em tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. ‘Aquilo que’ soa natural sem perder a referência definida do grego; ‘habita’ preserva a imagem paulina com registro bíblico corrente. O marcador foi colocado na expressão à qual a alternativa da nota efetivamente corresponde.
