  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: pt
  text: Graças a Deus, por meio de Jesus, o Messias, nosso Senhor! Assim, pois, eu mesmo sirvo à lei de Deus com a mente, mas à lei do pecado com a carne[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «natureza pecaminosa», em vez de «carne».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «princípio do pecado», em vez de «lei do pecado».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Graças a Deus
  rationale: A construção exclamativa com o dativo expressa agradecimento; a formulação portuguesa é idiomática e preserva a concisão do grego.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: διά com genitivo indica mediação. «Messias» mantém Χριστός como título, e as vírgulas produzem uma aposição natural em português.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: Forma portuguesa direta e digna para o título κύριος e o genitivo ἡμῶν.
- source_word: Ἄρα οὖν
  choice: Assim, pois
  rationale: A combinação assinala uma conclusão resumida; «Assim, pois» conserva tanto a transição quanto a força inferencial.
- source_word: αὐτὸς ἐγώ
  choice: eu mesmo
  rationale: Preserva a ênfase explícita dada à pessoa do falante.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: com a mente ... mas, com a carne
  rationale: Mantém o contraste entre as duas esferas ou faculdades sem explicar além do que o texto declara.
- source_word: δουλεύω
  choice: sirvo
  rationale: «Sirvo» é natural no contexto e conserva a ideia de sujeição, embora o verbo também possa evocar serviço escravo.
- source_word: νόμῳ θεοῦ
  choice: à lei de Deus
  rationale: Mantém νόμος como «lei», importante para a argumentação de Romanos 7.
- source_word: σαρκὶ
  choice: carne
  rationale: Preserva a linguagem paulina e sua tensão antropológica, sem substituir o termo por uma interpretação como «natureza pecaminosa».
- source_word: νόμῳ ἁμαρτίας
  choice: à lei do pecado
  rationale: Conserva a repetição deliberada de νόμος e o paralelo com «lei de Deus».
theological_decisions:
- issue: Sentido de σάρξ no contraste paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: O contexto é moralmente carregado, mas σάρξ não equivale de modo explícito a uma expressão abstrata como «natureza pecaminosa». «Carne» preserva a tensão sem impor uma sistematização doutrinária.
- issue: Valor de νόμος em «lei do pecado»
  choice: lei do pecado
  alternative: princípio do pecado
  rationale: «Lei» mantém o paralelismo lexical com a lei de Deus e deixa em aberto se Paulo usa o termo em sentido estrito ou estendido.
- issue: Χριστός como título
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita o valor titular de Χριστός neste contexto sem acrescentar conteúdo confessional alheio ao texto.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A ordem foi ajustada para tornar natural a dupla construção instrumental em português, preservando a ênfase em «eu mesmo» e o paralelismo entre as duas leis. Os marcadores foram colocados após a frase pertinente, sem interromper o contraste.
