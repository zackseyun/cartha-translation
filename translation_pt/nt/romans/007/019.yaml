id: ROM.7.19
reference: Romans 7:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: pt
  text: Pois não faço o bem que quero[a], mas o mal que não quero — isso é o que pratico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realizo” em vez de “faço” (ποιῶ); mais adiante, o grego emprega outro verbo.
    reason: lexical_alternative
  - marker: b
    text: Ou “faço” em vez de “pratico” (πράσσω). A tradução distingue os dois verbos gregos, embora seus sentidos se sobreponham consideravelmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: quero
  rationale: Expressa de modo natural e direto a vontade ou intenção no português moderno, sem impor um tom excessivamente filosófico.
- source_word: ποιῶ
  choice: faço
  rationale: É a correspondência mais simples e natural para o verbo, preservando a distinção possível em relação a πράσσω.
- source_word: ἀγαθόν
  choice: o bem
  rationale: Mantém a categoria moral substantivada e forma um paralelo claro com “o mal”.
- source_word: κακὸν
  choice: o mal
  rationale: Preserva a força moral do contraste com ἀγαθόν, sem reduzi-lo ao meramente inconveniente ou errado.
- source_word: πράσσω
  choice: pratico
  rationale: Distingue o verbo de ποιῶ e comunica conduta efetivamente realizada, sem negar a considerável sobreposição semântica entre os dois verbos.
- source_word: τοῦτο
  choice: isso é o que
  rationale: Retém explicitamente o demonstrativo enfático e produz uma construção natural em português.
- source_word: οὐ γὰρ
  choice: Pois não
  rationale: “Pois” conserva a função explicativa de γάρ e liga o versículo ao argumento precedente.
theological_decisions:
- issue: Se o contraste moral de Paulo deve ser suavizado
  choice: Manter “o bem” e “o mal” como categorias morais diretas.
  alternative: “aquilo que é certo” e “aquilo que é errado”
  rationale: Os termos gregos têm peso moral claro; suavizá-los reduziria a tensão ética do texto.
- issue: Se πράσσω indica necessariamente uma prática habitual
  choice: Traduzir por “pratico”, sem explicitar frequência ou hábito.
  alternative: “faço” ou “continuo fazendo”
  rationale: “Pratico” permite distinguir os verbos gregos, mas o texto não deve ser ampliado com uma ideia explícita de continuidade que a forma verbal, por si só, não exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla internacional. A ordem foi levemente ajustada para fluência, mantendo o paralelismo, a ênfase demonstrativa e a conexão explicativa do original.
