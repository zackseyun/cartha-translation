  source_fidelity: A tradução preserva com precisão a estrutura contrastiva e explicativa de οὐ γὰρ ... ἀλλὰ, bem como as categorias morais substantivadas “o bem” e “o mal”. “Pois não faço o bem que quero” corresponde naturalmente a οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν. Na segunda cláusula, “mas o mal que não quero — isso é o que pratico” retém tanto o contraste quanto o demonstrativo enfático τοῦτο, sem acrescentar uma afirmação explícita de habitualidade.
  naturalness: O texto é claro, moderno e idiomático em português amplamente compreensível, com boa legibilidade brasileira. A construção “isso é o que pratico” é um modo natural de manter a ênfase demonstrativa que uma simples repetição de “faço” poderia enfraquecer.
  terminology: “Quero”, “faço”, “o bem”, “o mal” e “pratico” são escolhas adequadas. A distinção entre ποιῶ e πράσσω é apresentada com prudência nas notas, que também reconhecem a sobreposição semântica dos verbos. “O bem” e “o mal” preservam o peso moral do contraste grego.
