lexical_decisions:
- source_word: συνήδομαι
  choice: tenho prazer em
  rationale: Expressa aprovação alegre e satisfação, não mero assentimento intelectual; a formulação é natural e preserva a força afetiva do verbo.
- source_word: νόμῳ τοῦ θεοῦ
  choice: na lei de Deus
  rationale: Preserva o uso paulino consolidado de νόμος e traduz diretamente o genitivo τοῦ θεοῦ.
- source_word: κατὰ
  choice: segundo
  rationale: Reflete de perto a relação marcada por κατά, sem reduzi-la de modo definitivo a simples localização interior.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: o ser humano interior
  rationale: Mantém a imagem antropológica paulina e evita que «homem interior» seja entendido como referência exclusiva ao sexo masculino; o possessivo «meu» não é acrescentado ao texto principal.
theological_decisions:
- issue: Nuance antropológica de τὸν ἔσω ἄνθρωπον
  choice: o ser humano interior
  alternative: o homem interior; meu íntimo; meu ser interior
  rationale: A tradução conserva a expressão metafórica de Paulo sem impor um modelo técnico da composição humana. «Segundo» também preserva a possível nuance de perspectiva ou conformidade em κατὰ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «segundo o ser humano interior» é deliberadamente mais formal para conservar a estrutura e a ambiguidade do grego.
