id: ROM.7.17
reference: Romans 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: pt
  text: Mas agora já não sou eu quem faz isso,[a] mas o pecado que habita em mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «já não sou eu que o pratico, mas o pecado que habita em mim».'
    reason: Alternativa lexical e sintática que representa κατεργάζομαι αὐτό de modo um pouco mais formal e conserva a estrutura contrastiva do grego.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Expressa de modo natural tanto a transição quanto o contraste com o argumento anterior.
- source_word: οὐκέτι
  choice: já não
  rationale: Equivalente corrente em português para a ideia de cessação ou dissociação presente no contexto.
- source_word: ἐγὼ
  choice: sou eu quem
  rationale: A construção clivada preserva a ênfase do pronome grego explícito e soa natural em português.
- source_word: κατεργάζομαι
  choice: faz
  rationale: No contexto, refere-se à prática do ato já mencionado; «faz» é claro e evita uma formulação desnecessariamente pesada.
- source_word: αὐτὸ
  choice: isso
  rationale: Retoma naturalmente, em português, o ato mencionado nos versículos anteriores.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: o pecado que habita em mim
  rationale: Preserva a personificação vívida do pecado e o sentido de residência contínua expresso pelo particípio.
- source_word: οἰκοῦσα
  choice: habita
  rationale: Mantém a metáfora de moradia e o tom mais denso do grego, com linguagem corrente e digna.
theological_decisions:
- issue: A distinção entre «eu» e «o pecado que habita em mim» pode parecer uma negação de responsabilidade pessoal.
  choice: Manter sem atenuação a distinção enfática formulada pelo texto.
  alternative: Parafrasear como mero conflito interior ou acrescentar uma explicação sobre a responsabilidade humana.
  rationale: O grego apresenta deliberadamente essa tensão de modo incisivo; a tradução não deve resolvê-la nem introduzir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Mas agora» e «já não» são correntes; «habita» preserva a metáfora paulina com dignidade. A vírgula antes do marcador mantém a pontuação da oração, e o marcador [a] aparece no texto principal.
