  source_fidelity: A estrutura temporal e a personificação são preservadas, mas “ganhou vida novamente” torna explícita uma nuance de retorno que é melhor expressa pelo verbo mais direto e tradicional “reviveu”, mantendo a alternativa de “ganhou vida” na nota. “No passado” também é pouco idiomático nesta posição para ποτέ.
  naturalness: “Eu vivia, no passado” soa marcado e redundante em português moderno. “Eu vivia antes” é mais fluente e conserva o sentido retrospectivo. A pontuação final aberta deve ser mantida, pois o enunciado continua no versículo seguinte.
  terminology: “Lei”, “mandamento” e “pecado” são apropriados ao contexto paulino. A inicial maiúscula em “Lei” é uma convenção clara para a provável referência à Lei mosaica, sem resolver questões interpretativas mais amplas.
