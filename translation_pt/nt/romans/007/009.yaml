  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: pt
  text: Eu vivia antes sem a Lei; mas, quando veio o mandamento, o pecado reviveu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pecado ganhou vida”.'
    reason: Alternativa lexical para ἀνέζησεν; o verbo pode ser entendido como “reviveu” ou “ganhou vida” no quadro da personificação do pecado.
lexical_decisions:
- source_word: ἔζων
  choice: vivia
  rationale: O imperfeito é expresso naturalmente por “vivia”; em conjunto com ἀνέζησεν e o contexto imediato, mantém o contraste entre vida e morte sem tornar a frase artificial em português.
- source_word: χωρὶς νόμου
  choice: sem a lei
  rationale: Preserva a ideia de separação ou ausência expressa por χωρίς e emprega o artigo de modo natural, em provável referência à Lei mosaica.
- source_word: ποτέ
  choice: no passado
  rationale: Expressa com clareza a referência a um tempo anterior; evita a possível leitura de “uma vez” como contagem numérica.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: quando veio o mandamento
  rationale: Converte o genitivo absoluto em uma oração temporal natural, preservando o caráter de acontecimento da construção.
- source_word: ἐντολῆς
  choice: o mandamento
  rationale: Mantém a dicção bíblica e a relação conceitual com νόμος no contexto.
- source_word: ἁμαρτία
  choice: o pecado
  rationale: Conserva o singular personificado empregado por Paulo.
- source_word: ἀνέζησεν
  choice: ganhou vida novamente
  rationale: Reproduz o valor de ἀνά- e a imagem do pecado personificado passando ou voltando à vida; a nota registra a alternativa lexical mais compacta.
theological_decisions:
- issue: Se a afirmação de Paulo deve ser entendida explicitamente como autobiográfica, representativa ou histórico-salvífica
  choice: Manter a primeira pessoa simples, sem explicação interpretativa
  alternative: Explicitar que Paulo fala exclusivamente de sua experiência pessoal, ou que representa Israel ou a humanidade sob a lei
  rationale: O grego deste versículo, isoladamente, não decide entre essas leituras; a tradução preserva a ambiguidade e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada levemente para soar natural; a personificação do pecado e a vírgula final, que liga o versículo ao seguinte, foram preservadas.
