lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Expressa com naturalidade a conclusão inferida do argumento anterior.
- source_word: νόμος
  choice: lei
  rationale: Preserva a formulação paulina sem explicitar além do texto que se trata da Lei de Moisés.
- source_word: ἅγιος / ἁγία
  choice: santa / santo
  rationale: Mantém o sentido de santidade, incluindo pureza moral e consagração, com a concordância exigida em português.
- source_word: ἐντολή
  choice: mandamento
  rationale: Indica adequadamente uma ordem específica dentro da lei e conserva o teor moral e formal do termo.
- source_word: δικαία
  choice: justo
  rationale: É a forma corrente e natural em português para afirmar a retidão moral do mandamento.
- source_word: ἀγαθή
  choice: bom
  rationale: Preserva de modo simples tanto a bondade moral quanto o caráter benéfico do mandamento.
- source_word: μὲν
  choice: implícito, sem tradução separada
  rationale: A leve ênfase discursiva não requer uma palavra específica em português, especialmente porque não há aqui uma oração contrastante introduzida por δέ.
