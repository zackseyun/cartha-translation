id: ROM.7.15
reference: Romans 7:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: pt
  text: Pois não entendo o que faço, porque não pratico o que quero; pelo contrário, faço justamente o que odeio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: faço
  rationale: Expressa de modo natural o que o sujeito realiza ou produz; a variação posterior com ποιῶ não exige em português uma distinção lexical artificial.
- source_word: οὐ γινώσκω
  choice: não entendo
  rationale: No contexto, γινώσκω indica não compreender ou não conseguir explicar a própria conduta, mais que simples desconhecimento factual.
- source_word: πράσσω
  choice: pratico
  rationale: Preserva a ideia de pôr em prática ou executar aquilo que se quer.
- source_word: ἀλλά
  choice: pelo contrário
  rationale: Marca claramente o forte contraste entre o que o sujeito quer praticar e o que de fato faz.
- source_word: τοῦτο ποιῶ
  choice: faço justamente
  rationale: 'O advérbio ''justamente'' transmite a ênfase do pronome demonstrativo repetido: é precisamente aquilo que odeia que ele faz.'
theological_decisions:
- issue: Identidade e condição espiritual do eu que fala
  choice: Manter a primeira pessoa sem identificar explicitamente sua condição espiritual.
  alternative: Explicitar que Paulo fala como regenerado, não regenerado, ou como representante de Israel/humanidade.
  rationale: O versículo não resolve por si só essa questão interpretativa; a tradução deve preservar essa tensão.
- issue: Relação lógica introduzida pelo segundo γάρ
  choice: Traduzir como 'porque'.
  alternative: Repetir 'pois'.
  rationale: 'Aqui γάρ explica a afirmação de que o sujeito não entende o que faz: sua prática contradiz sua vontade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o contraste enfático e evita esclarecer além do que o grego afirma.
