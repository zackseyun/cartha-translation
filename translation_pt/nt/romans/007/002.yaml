id: ROM.7.2
reference: Romans 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: pt
  text: Pois a mulher casada está ligada por lei ao marido enquanto ele vive; mas, se o marido morrer, ela fica livre da lei do marido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ela fica livre da lei relativa ao marido». O grego provavelmente se refere ao vínculo legal que a ligava ao marido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: a mulher casada
  rationale: Expressa de modo natural a mulher sob o vínculo matrimonial, preservando o sentido jurídico e conjugal da expressão.
- source_word: τῷ ζῶντι ἀνδρί
  choice: ao marido enquanto ele vive
  rationale: Torna explícita em português a duração do vínculo indicada pelo particípio ζῶντι, sem sugerir apenas uma qualidade atributiva.
- source_word: δέδεται
  choice: está ligada
  rationale: O perfeito passivo descreve um estado vigente resultante do vínculo estabelecido; «está ligada» comunica esse estado contínuo.
- source_word: νόμῳ
  choice: por lei
  rationale: A forma sem artigo tem aqui sentido geral ou qualitativo, apontando para o princípio jurídico que rege o casamento.
- source_word: κατήργηται
  choice: fica livre
  rationale: No contexto, o verbo indica que a obrigação legal deixa de ter efeito sobre a mulher; esta formulação é clara e natural sem traduzir mecanicamente por «é abolida».
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: da lei do marido
  rationale: Preserva a construção genitiva compacta e sua ambiguidade genuína, enquanto a nota esclarece que se trata provavelmente do vínculo legal relativo ao marido.
theological_decisions:
- issue: Se νόμῳ / τοῦ νόμου designa especificamente a Lei mosaica ou o vínculo jurídico geral do casamento
  choice: lei ou princípio jurídico do casamento
  alternative: a Lei mosaica aplicada ao casamento
  rationale: O contexto matrimonial imediato e o uso sem artigo em νόμῳ favorecem o sentido de vínculo jurídico conjugal, embora a redação mantenha o termo geral «lei» e não exclua ressonâncias da discussão mais ampla de Paulo sobre a Lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pois» mantém a ligação explicativa com o versículo anterior; «enquanto ele vive» soa mais natural do que «ao marido vivo»; a formulação conserva a linguagem jurídica e a ambiguidade do genitivo final.
