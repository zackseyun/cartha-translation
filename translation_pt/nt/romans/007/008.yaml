id: ROM.7.8
reference: Romans 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: pt
  text: Mas o pecado, aproveitando a oportunidade[a] por meio do mandamento, produziu em mim todo tipo de cobiça[b]. Pois, sem a lei, o pecado está morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomando ocasião”.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo tipo de desejo”; neste contexto, o sentido é especificamente o de cobiçar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμὴν … λαβοῦσα
  choice: aproveitando a oportunidade
  rationale: A expressão traduz de modo natural a ideia de tomar ou agarrar uma ocasião propícia, preservando a personificação ativa do pecado.
- source_word: ἡ ἁμαρτία
  choice: o pecado
  rationale: Mantém o pecado como sujeito personificado, conforme a construção grega.
- source_word: διὰ τῆς ἐντολῆς
  choice: por meio do mandamento
  rationale: Expressa o mandamento como o meio de que o pecado se vale; o singular corresponde ao mandamento citado no contexto imediato.
- source_word: κατειργάσατο
  choice: produziu
  rationale: Comunica diretamente que o pecado efetuou ou causou esse resultado.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: todo tipo de cobiça
  rationale: No contexto do mandamento contra cobiçar, “cobiça” explicita o sentido local de ἐπιθυμία, enquanto “todo tipo de” representa πᾶσαν de modo idiomático.
- source_word: χωρὶς γὰρ νόμου
  choice: Pois, sem a lei
  rationale: Formulação clara e natural que conserva a explicação introduzida por γάρ e a referência contextual à lei.
- source_word: νεκρά
  choice: morto
  rationale: Preserva a metáfora forte do original sem interpretá-la como simples inatividade.
theological_decisions:
- issue: Personificação do pecado e sentido metafórico de “morto”
  choice: Manter o pecado como agente que aproveita uma oportunidade e afirmar que ele “está morto”.
  alternative: Tratar o pecado de modo abstrato e traduzir νεκρά como “inativo”.
  rationale: O grego apresenta o pecado como um poder atuante e emprega deliberadamente a imagem de morte; a tradução preserva essa tensão sem explicá-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Aproveitando a oportunidade” evita um literalismo pouco idiomático, e “por meio do mandamento” mantém a relação instrumental do grego.
