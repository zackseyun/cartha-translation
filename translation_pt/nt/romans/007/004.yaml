id: ROM.7.4
reference: Romans 7:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: pt
  text: Portanto, meus irmãos[a], vocês também foram mortos para a lei por meio do corpo do Messias[b], a fim de pertencerem a outro, àquele que foi ressuscitado dentre os mortos, para que produzamos fruto para Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “meus irmãos”; o termo no plural também pode incluir mulheres quando se dirige a um grupo misto.
    reason: lexical_alternative
  - marker: b
    text: Grego Christós, isto é, “Ungido”. Também pode ser traduzido por “Cristo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Expressa de modo natural a conclusão inferida da analogia anterior.
- source_word: ἀδελφοί μου
  choice: meus irmãos e minhas irmãs
  rationale: Embora o grego use o masculino plural, o vocativo pode dirigir-se a um grupo misto; a formulação explicita esse alcance em português atual.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: vocês também foram mortos para a lei
  rationale: Mantém a voz passiva do verbo e a relação dativa incomum com 'a lei', sem substituí-la pela interpretação mais explícita 'libertos da lei'.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: por meio do corpo do Messias
  rationale: Representa o valor instrumental de διά com genitivo e traduz Χριστός como título.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: a fim de pertencerem a outro
  rationale: Comunica a transferência relacional e preserva a analogia matrimonial do contexto sem recorrer ao português pouco natural 'tornarem-se de outro'.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: àquele que foi ressuscitado dentre os mortos
  rationale: Mantém a formulação passiva e representa ἐκ νεκρῶν com a expressão portuguesa tradicional e precisa 'dentre os mortos'.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: para que produzamos fruto para Deus
  rationale: Preserva a metáfora do fruto, a finalidade introduzida por ἵνα e a mudança textual da segunda pessoa ('vocês') para a primeira do plural ('produzamos').
theological_decisions:
- issue: Sentido de Χριστοῦ no discurso paulino
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός conserva valor titular; 'Messias' torna explícito o sentido de 'Ungido', enquanto a alternativa tradicional 'Cristo' permanece possível.
- issue: Relação dos fiéis com a lei em ἐθανατώθητε τῷ νόμῳ
  choice: foram mortos para a lei
  alternative: morreram para a lei
  rationale: A tradução escolhida preserva o passivo grego e evita decidir além do texto quem é o agente implícito ou reduzir a expressão a uma experiência meramente intransitiva.
- issue: Metáfora relacional em γενέσθαι ὑμᾶς ἑτέρῳ
  choice: pertencerem a outro
  alternative: unirem-se a outro
  rationale: A escolha mantém a ideia de passar a ser de outro dentro da analogia matrimonial, sem acrescentar explicitamente uma união que o verbo não enuncia por si só.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural de segunda pessoa, explicita a inclusão de homens e mulheres no vocativo e conserva tanto a passiva 'foram mortos' quanto a mudança para 'produzamos', evitando harmonizar as pessoas gramaticais.
