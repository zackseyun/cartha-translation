id: ROM.7.6
reference: Romans 7:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: pt
  text: Mas agora fomos libertados da lei, tendo morrido para aquilo que nos mantinha presos[a], a fim de servirmos de maneira nova, no Espírito[b], e não da maneira antiga, na letra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo morrido para aquilo pelo qual estávamos presos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no espírito”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “no código escrito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν
  choice: fomos libertados
  rationale: Com ἀπὸ τοῦ νόμου, o passivo indica que fomos liberados da reivindicação vinculante da lei, não que a lei deixou de existir. “Fomos libertados” expressa isso com clareza em português.
- source_word: νόμου
  choice: da lei
  rationale: No contexto, refere-se à lei mosaica. A inicial minúscula mantém a leitura natural sem alterar o referente.
- source_word: ἀποθανόντες
  choice: tendo morrido
  rationale: Preserva o particípio aoristo e deixa claro que “nós” morremos em relação ao que nos prendia; não afirma que a lei morreu.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: para aquilo que nos mantinha presos
  rationale: Comunica de modo natural a construção grega e conserva a ideia de sujeição anterior expressa por κατέχω.
- source_word: δουλεύειν
  choice: servirmos
  rationale: Embora o verbo possa evocar escravidão, aqui descreve o serviço prestado sob uma nova condição. “Servirmos” é claro e adequado ao contraste da frase.
- source_word: καινότητι
  choice: de maneira nova
  rationale: Transmite o valor do substantivo abstrato καινότης em português corrente e mantém o paralelo com “da maneira antiga”.
- source_word: πνεύματος
  choice: no Espírito
  rationale: O contraste paulino entre Espírito e letra favorece a referência ao Espírito Santo. A possibilidade de “espírito” é mantida em nota.
- source_word: παλαιότητι
  choice: da maneira antiga
  rationale: Expressa παλαιότης com naturalidade e conserva a oposição retórica entre o novo e o antigo.
- source_word: γράμματος
  choice: na letra
  rationale: Mantém a expressão paulina concisa e seu contraste com o Espírito. A interpretação mais explícita, “código escrito”, aparece em nota.
theological_decisions:
- issue: Se Paulo afirma que a lei morreu ou que os crentes morreram em relação ao que os prendia
  choice: 'Os crentes são os que morreram: “tendo morrido para aquilo que nos mantinha presos”.'
  alternative: A lei morreu em relação a nós.
  rationale: O particípio ἀποθανόντες está no nominativo plural e concorda com o sujeito implícito “nós”. A tradução preserva essa relação gramatical.
- issue: Se πνεύματος se refere ao Espírito Santo ou ao espírito humano
  choice: “no Espírito”
  alternative: “no espírito”
  rationale: O contraste paulino entre Espírito e letra, no contexto da nova aliança, favorece a referência ao Espírito Santo; a ambiguidade possível é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação “de maneira nova... da maneira antiga” evita os pouco naturais “novidade... antiguidade” sem eliminar o contraste formal do grego. As notas preservam alternativas lexicais e a ambiguidade de πνεύματος.
