  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: pt
  text: Mas eu morri, e descobri que este mandamento, destinado à vida, resultou, para mim, em morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e o mandamento que era para a vida revelou-se, para mim, como morte».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: eu morri
  rationale: O aoristo ativo indica diretamente um acontecimento passado, sem apresentar o morrer como processo ou estado contínuo.
- source_word: εὑρέθη μοι
  choice: revelou-se, para mim
  rationale: A construção passiva com o dativo μοι comunica descoberta experiencial; esta formulação é natural em português e evita a rigidez de «foi encontrado por mim».
- source_word: ἐντολή
  choice: o mandamento
  rationale: Mantém o substantivo singular e a terminologia jurídica e paulina habitual, sem acrescentar «da Lei», ausente do texto grego.
- source_word: ἡ εἰς ζωὴν
  choice: que era para a vida
  rationale: Preserva de modo conciso a direção ou o resultado expresso por εἰς, sem definir se o mandamento se destinava a dar vida ou conduzia a ela.
- source_word: αὕτη
  choice: o mandamento que era para a vida
  rationale: O referente demonstrativo é retomado pela oração inteira de maneira natural em português; sua possível força enfática é indicada na nota.
- source_word: εἰς θάνατον
  choice: para a morte
  rationale: Conserva o paralelismo retórico exato entre «para a vida» e «para a morte», sem explicitar uma causalidade maior do que a presente no grego.
theological_decisions:
- issue: Se o texto deve afirmar explicitamente que o mandamento causou a morte
  choice: revelou-se, para mim, para a morte
  alternative: trouxe-me a morte
  rationale: A tradução mantém a tensão entre a finalidade vital do mandamento e o desfecho mortal experimentado por Paulo, sem explicar além do texto como se deu essa relação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição «para a vida ... para a morte» foi preservada por sua importância retórica. A nota registra tanto a ênfase possível de αὕτη («esse mesmo») quanto uma formulação idiomática alternativa de εὑρέθη μοι.
