  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: pt
  text: Portanto, enquanto o marido estiver vivo, ela será chamada adúltera se se casar com outro homem.[a] Mas, se o marido morrer, ela está livre da lei,[b] de modo que não é adúltera ao se casar com outro homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui e no fim do versículo, também se pode traduzir: “se passar a ser de outro homem” ou “se se unir a outro homem”.'
    reason: lexical_alternative
  - marker: b
    text: “A lei” refere-se aqui, de modo imediato, à norma que vinculava a mulher ao marido no casamento.
    reason: contextual_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão baseada no que foi dito antes. “Portanto” transmite essa força inferencial de maneira clara e natural em português.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: enquanto o marido estiver vivo
  rationale: O genitivo absoluto indica uma circunstância simultânea. A formulação temporal comunica isso naturalmente, sem acrescentar conteúdo.
- source_word: μοιχαλὶς
  choice: adúltera
  rationale: O substantivo designa especificamente uma mulher que comete adultério; “adúltera” é a correspondência direta e corrente em português.
- source_word: χρηματίσει
  choice: será chamada
  rationale: Neste contexto, o verbo significa receber uma designação ou ser reconhecida por determinado nome. A forma mantém o valor futuro do grego.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: se se unir a outro homem
  rationale: A construção com γίνομαι e dativo indica que ela passa a ter uma relação conjugal com outro homem. “Unir-se” preserva o caráter relacional sem inserir explicitamente o termo “esposa”, ausente do grego; a mesma tradução é repetida nas duas ocorrências.
- source_word: ἐλευθέρα ἐστίν
  choice: ela está livre
  rationale: A expressão declara que a mulher já não está sujeita à obrigação em questão. “Está livre” mantém o valor predicativo e presente do original.
- source_word: ἀπὸ τοῦ νόμου
  choice: da lei
  rationale: A tradução conserva a formulação ampla do grego, enquanto o contexto imediato esclarece que se trata da lei que a vinculava ao marido.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: de modo que não é adúltera
  rationale: O infinitivo articular expressa a consequência de ela estar livre da lei. “De modo que” torna clara essa relação lógica em português.
theological_decisions:
- issue: Alcance de νόμος na analogia
  choice: “da lei” no texto principal, entendida imediatamente como a norma que rege o vínculo matrimonial
  alternative: “da lei do casamento” ou uma referência geral à Lei mosaica
  rationale: O contexto imediato trata da condição legal da mulher enquanto o marido vive e depois da morte dele. Manter “a lei” preserva a formulação paulina e evita transformar a tradução em uma interpretação doutrinária mais abrangente.
- issue: Natureza da relação com “outro homem”
  choice: “se se unir a outro homem”
  alternative: “se se tornar esposa de outro homem” ou “se passar a pertencer a outro homem”
  rationale: A expressão ocorre numa analogia matrimonial, mas o grego não emprega aqui o substantivo “esposa”. A opção escolhida comunica a união conjugal sem sobre-especificar a forma lexical nem sugerir mera posse.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição da expressão final foi preservada por corresponder à repetição do original. Evitou-se tanto a linguagem jurídica excessivamente técnica quanto a explicitação denominacional.
