id: ROM.7.7
reference: Romans 7:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: pt
  text: 'Que diremos, então? A lei é pecado? De modo nenhum! Pelo contrário, eu não teria conhecido o pecado senão por meio da lei. Pois eu não teria conhecido a cobiça[a] se a lei não dissesse: “Não cobiçarás.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desejo”; a citação imediata do mandamento favorece aqui o sentido mais específico de “cobiça”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que diremos, então?
  rationale: Reproduz a fórmula retórica de transição de Paulo em português natural e digno.
- source_word: ὁ νόμος
  choice: a lei
  rationale: O artigo e o contexto apontam para a lei mosaica, justificando a forma definida.
- source_word: ἁμαρτία
  choice: pecado
  rationale: Mantém o substantivo predicativo e a formulação teologicamente incisiva, sem suavizá-la para “pecaminosa”.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressa com força e naturalidade a rejeição enfática da hipótese.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca a correção enfática que sucede à negação de Paulo.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: eu não teria conhecido o pecado senão por meio da lei
  rationale: A construção contrafactual é transmitida naturalmente pelo condicional composto; “conhecido” preserva a proximidade lexical com o grego.
- source_word: ἐπιθυμίαν
  choice: cobiça
  rationale: Embora o substantivo possa designar desejo em sentido mais amplo, a citação imediata do mandamento favorece aqui o sentido específico de cobiça.
- source_word: οὐκ ᾔδειν
  choice: eu não teria conhecido
  rationale: Mantém o paralelismo semântico com a oração anterior, embora o texto grego empregue outro verbo.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Não cobiçarás
  rationale: Preserva a forma proibitiva da citação do mandamento e a ligação lexical com “cobiça”.
theological_decisions:
- issue: Relação entre a lei e o pecado
  choice: A lei é pecado? De modo nenhum!
  alternative: A lei é pecaminosa?
  rationale: O predicativo nominal grego pergunta se a lei deve ser identificada com o pecado, e não apenas se ela possui uma qualidade pecaminosa; a tradução conserva a tensão da formulação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva-se a formulação tradicional “Não cobiçarás” por se tratar de citação direta do mandamento e por ela refletir adequadamente a força proibitiva do grego.
