id: ROM.7.1
reference: Romans 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: pt
  text: Ou vocês não sabem, irmãos[a] — pois falo a pessoas que conhecem a lei — que a lei tem autoridade sobre uma pessoa enquanto ela vive?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o plural masculino adelphoi; neste contexto, provavelmente inclui também as mulheres entre os destinatários de Paulo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “exerce domínio sobre uma pessoa enquanto ela vive”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ou
  rationale: Mantém a transição argumentativa de Paulo em relação ao que precede.
- source_word: ἀγνοεῖτε
  choice: vocês não sabem
  rationale: Expressa naturalmente a pergunta retórica e o apelo a um conhecimento compartilhado.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego; uma nota esclarece seu provável alcance inclusivo neste contexto.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: pois falo a pessoas que conhecem a lei
  rationale: Conserva a explicação introduzida por γάρ e verte o particípio de modo claro e natural.
- source_word: νόμον / ὁ νόμος
  choice: a lei
  rationale: Mantém a referência sem restringi-la explicitamente à Lei mosaica nem transformá-la apenas em um princípio jurídico geral.
- source_word: κυριεύει
  choice: exerce domínio sobre
  rationale: Comunica o sentido de domínio ou autoridade de κυριεύω e preserva a força da metáfora de senhorio.
- source_word: τοῦ ἀνθρώπου
  choice: uma pessoa
  rationale: O substantivo é genérico aqui, não especificamente masculino.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: enquanto ela vive
  rationale: Reproduz de maneira idiomática a duração expressa no grego e concorda com o substantivo português 'pessoa'.
theological_decisions:
- issue: Alcance de νόμος na afirmação de Paulo
  choice: Traduzir simplesmente por “a lei”
  alternative: “a Lei mosaica” ou “a lei” como princípio jurídico geral
  rationale: O contexto aponta especialmente para a Lei mosaica, mas a formulação grega permanece suficientemente ampla; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. Os travessões demarcam a explicação parentética sem tornar a frase excessivamente pesada.
