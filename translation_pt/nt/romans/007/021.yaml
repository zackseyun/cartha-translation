  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: pt
  text: 'Assim, descubro esta lei[a]: quando quero fazer o bem, o mal está bem perto de mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este princípio” ou “esta regra”.'
    reason: Preserva a possibilidade contextual de νόμος designar um princípio ou padrão atuante, embora o texto principal mantenha “lei”.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: descubro
  rationale: O presente expressa uma constatação atual e recorrente; “descubro” comunica naturalmente o reconhecimento resultante do argumento.
- source_word: ἄρα
  choice: Assim
  rationale: Marca a inferência a partir do argumento anterior em português corrente e digno.
- source_word: νόμον
  choice: lei
  rationale: Mantém o termo grego e sua ressonância no contexto, sem decidir se aqui se trata especificamente da Lei mosaica ou de um princípio atuante.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: quando quero fazer o bem
  rationale: Traduz com clareza a construção dativa difícil, preservando tanto a vontade quanto a ação pretendida.
- source_word: τὸ καλὸν
  choice: o bem
  rationale: Forma substantivada natural em português, fiel ao contraste explícito com “o mal”.
- source_word: τὸ κακὸν
  choice: o mal
  rationale: Preserva a forma substantivada e o paralelismo com “o bem”.
- source_word: παράκειται
  choice: está bem junto de mim
  rationale: Expressa a ideia de algo presente e próximo, preservando a imagem espacial do verbo sem recorrer a uma formulação pouco natural.
theological_decisions:
- issue: Se νόμον se refere à Lei mosaica ou a uma lei no sentido de princípio ou regra atuante
  choice: “lei” no texto principal
  alternative: “princípio” ou “regra”
  rationale: A tradução mantém a escolha lexical de Paulo e a tensão com os demais usos de νόμος no capítulo, sem restringir indevidamente o sentido à Lei mosaica nem resolver a expressão como mero princípio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assim” articula a conclusão; “está bem junto de mim” mantém a proximidade expressa por παράκειται. O marcador [a] aparece após a oração completa para indicar a alternativa referente a “lei” sem interromper a leitura.
