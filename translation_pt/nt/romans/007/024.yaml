  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: pt
  text: Que homem miserável sou eu! Quem me livrará deste corpo de morte?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «do corpo desta morte».
    reason: lexical_alternative
  - marker: b
    text: Ou «resgatará».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: miserável
  rationale: Expressa profunda aflição e desventura em português atual, preservando a força emocional da exclamação de Paulo.
- source_word: ἐγὼ ἄνθρωπος
  choice: Como sou
  rationale: A construção exclamativa natural em português comunica que o próprio Paulo se identifica como alguém profundamente miserável; evita a forma pouco idiomática «miserável homem que sou» sem perder o referente pessoal.
- source_word: τίς
  choice: Quem
  rationale: O interrogativo é pessoal e procura aquele que efetuará o livramento.
- source_word: ῥύσεται
  choice: livrará
  rationale: Traduz o sentido de retirar alguém de perigo ou sujeição. «Livrar» é corrente, digno e mantém a ressonância bíblica sem restringir o verbo a uma modalidade específica de resgate.
- source_word: ἐκ
  choice: de
  rationale: Expressa naturalmente em português a separação ou libertação daquilo que prende.
- source_word: σώματος
  choice: corpo
  rationale: Preserva a imagem concreta do texto grego, sem a substituir por uma interpretação abstrata.
- source_word: τοῦ θανάτου τούτου
  choice: de morte
  rationale: Na expressão principal, «deste corpo de morte» é natural e conserva a associação entre corpo e morte; uma nota registra a relação mais literal do demonstrativo com «esta morte».
theological_decisions:
- issue: Relação do demonstrativo τούτου na expressão final
  choice: deste corpo de morte
  alternative: do corpo desta morte
  rationale: A formulação escolhida é idiomática em português e preserva a imagem e a tensão do grego. A alternativa formalmente mais próxima é mantida em nota para não ocultar a ambiguidade sintática.
- issue: Amplitude semântica de ῥύσεται
  choice: livrará
  alternative: resgatará
  rationale: «Livrará» comunica libertação sem definir o modo pelo qual ela ocorre; «resgatará» é possível, mas pode sugerir com maior destaque uma operação de resgate. A alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A exclamação foi formulada idiomaticamente, e as notas preservam tanto a construção grega mais literal quanto a alternativa lexical de ῥύσεται.
