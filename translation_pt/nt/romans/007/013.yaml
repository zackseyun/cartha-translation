id: ROM.7.13
reference: Romans 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: pt
  text: Então, aquilo que é bom se tornou morte para mim? De modo nenhum! Pelo contrário, foi o pecado que, para que se revelasse como pecado, produziu em mim a morte por meio daquilo que é bom, a fim de que, por meio do mandamento, o pecado se tornasse pecaminoso além de toda medida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: aquilo que é bom
  rationale: Preserva o adjetivo neutro substantivado e retoma naturalmente, no contexto, a bondade do mandamento.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: se tornou morte para mim
  rationale: Mantém a construção predicativa de γίνομαι e o dativo de referência pessoal sem substituir a formulação forte de Paulo por uma explicação causal.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressa a rejeição enfática paulina em português atual, claro e digno.
- source_word: ἀλλὰ ἡ ἁμαρτία
  choice: Pelo contrário, foi o pecado
  rationale: Torna explícita em português a elipse verbal do grego, preservando o contraste que atribui ao pecado, e não ao que é bom, a produção da morte.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: para que se mostrasse como pecado
  rationale: Conserva a força da oração final e a repetição enfática da ideia de pecado, sem explicar além do texto.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: por meio daquilo que é bom
  rationale: Reproduz o valor instrumental de διά e mantém a ligação lexical com Τὸ ... ἀγαθὸν no início do versículo.
- source_word: μοι κατεργαζομένη θάνατον
  choice: ao produzir em mim a morte
  rationale: Representa o particípio e o sentido eficaz de κατεργάζομαι, com o pecado como agente.
- source_word: ἵνα γένηται
  choice: a fim de que ... se tornasse
  rationale: Mantém distinta a segunda oração final e a força de γίνομαι.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: pecaminoso além de toda medida
  rationale: Preserva tanto o adjetivo predicativo quanto a intensificação excepcional da expressão adverbial.
- source_word: διὰ τῆς ἐντολῆς
  choice: por meio do mandamento
  rationale: Mantém o sentido instrumental e a terminologia paulina do contexto imediato.
theological_decisions:
- issue: A defesa retórica da bondade do mandamento
  choice: Negar que aquilo que é bom tenha se tornado morte e atribuir ao pecado a produção da morte por meio do que é bom.
  alternative: Formular a frase de modo que o próprio mandamento pareça ser o agente moralmente responsável pela morte.
  rationale: O contraste introduzido por ἀλλά transfere o foco causal e culpável para o pecado, ao mesmo tempo que conserva a tensão de ele operar por meio do mandamento bom.
- issue: A finalidade expressa pelas duas orações com ἵνα
  choice: 'Preservar as duas orações finais: o pecado é mostrado como pecado e se torna pecaminoso além de toda medida por meio do mandamento.'
  alternative: Tratá-las apenas como resultados ou fundi-las numa única explicação.
  rationale: A repetição de ἵνα estrutura o argumento grego e deve permanecer perceptível, sem resolver indevidamente a possível sobreposição entre propósito e resultado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém a densidade argumentativa e a personificação do pecado, mas explicita apenas a elipse verbal exigida pela clareza em português. Não foram incluídas notas, pois as alternativas lexicais não são necessárias para representar uma ambiguidade textual relevante neste versículo.
