revisions:
- from: Então, aquilo que é bom se tornou morte para mim? De modo nenhum! Pelo contrário, foi o pecado, para que se mostrasse como pecado ao produzir em mim a morte por meio daquilo que é bom, a fim de que, por meio do mandamento, o pecado se tornasse pecaminoso além de toda medida.
  to: Então, aquilo que é bom se tornou morte para mim? De modo nenhum! Pelo contrário, foi o pecado que, para que se revelasse como pecado, produziu em mim a morte por meio daquilo que é bom, a fim de que, por meio do mandamento, o pecado se tornasse pecaminoso além de toda medida.
  rationale: A revisão corrige a ligação sintática entre o sujeito «o pecado» e a ação de produzir morte, preservando a personificação do pecado, o caráter instrumental de «por meio daquilo que é bom» e as duas finalidades introduzidas por ἵνα. Não é necessária nota, pois não há ambiguidade textual ou alternativa lexical que exija ser assinalada ao leitor.
