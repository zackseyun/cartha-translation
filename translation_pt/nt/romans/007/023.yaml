id: ROM.7.23
reference: Romans 7:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: pt
  text: Mas vejo outra lei[a] nos membros do meu corpo, guerreando contra a lei da minha mente e fazendo-me prisioneiro da lei do pecado[b] que está nos membros do meu corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “princípio” ou “poder”. O mesmo termo grego é traduzido por “lei” nas ocorrências deste versículo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fazendo-me prisioneiro na lei do pecado”; a expressão do texto comunica sujeição ao poder dessa lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: vejo
  rationale: Mantém o presente vívido e a percepção pessoal expressa pelo verbo grego.
- source_word: ἕτερον νόμον
  choice: outra lei
  rationale: Preserva o contraste com a lei mencionada anteriormente sem explicar em excesso a natureza dessa diferença.
- source_word: νόμον / νόμῳ (ocorrências repetidas)
  choice: lei
  rationale: Conserva a repetição retórica de νόμος e a tensão entre a lei da mente e a lei do pecado; uma nota registra as alternativas interpretativas.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: nos membros do meu corpo
  rationale: Preserva a metáfora anatômica de μέλη e acrescenta 'do meu corpo' para evitar a possível leitura moderna de 'membros' como integrantes de um grupo.
- source_word: ἀντιστρατευόμενον
  choice: guerreando contra
  rationale: Mantém de modo claro e vigoroso a imagem militar do verbo.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: contra a lei da minha mente
  rationale: Traduz diretamente νοῦς por 'mente' e preserva a relação de oposição indicada pelo verbo composto.
- source_word: αἰχμαλωτίζοντά με
  choice: fazendo-me prisioneiro
  rationale: Expressa naturalmente em português o ato de levar alguém ao cativeiro e mantém a continuidade da imagem bélica.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: da lei do pecado
  rationale: Com 'fazer prisioneiro', a construção portuguesa idiomática emprega 'de'; a nota conserva a forma mais literal com ἐν e explicita a ideia de sujeição.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: É o equivalente português direto e consagrado neste contexto.
theological_decisions:
- issue: Se νόμος deve ser traduzido como 'lei' ou interpretado como 'princípio' ou 'poder'.
  choice: Manter 'lei' em todas as ocorrências.
  alternative: Empregar 'princípio' ou 'poder' em uma ou mais ocorrências.
  rationale: A repetição de νόμος é deliberada e sustenta a tensão entre a lei da mente e a força operante do pecado. Mantê-la evita resolver no texto uma questão interpretativa.
- issue: O referente autobiográfico e a condição espiritual do eu que fala.
  choice: Não identificar nem explicar o estado espiritual do falante no texto.
  alternative: Acrescentar linguagem que o caracterize explicitamente como regenerado, não regenerado ou representativo de outro grupo.
  rationale: O versículo descreve o conflito em primeira pessoa, mas não resolve sozinho essas identificações teológicas; a tradução deve preservar essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão 'membros do meu corpo' retém a concretude paulina sem a ambiguidade social de 'membros' isolado; 'guerreando' e 'prisioneiro' preservam o campo semântico militar.
