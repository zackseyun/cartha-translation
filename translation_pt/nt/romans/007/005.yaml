id: ROM.7.5
reference: Romans 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: pt
  text: Pois, quando estávamos na carne[a], as paixões pecaminosas[b], que vinham por meio da lei, atuavam nos membros do nosso corpo[c], a fim de darem fruto para a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob o domínio da natureza pecaminosa” ou “em nossa condição humana caída”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “as paixões dos pecados”.
    reason: lexical_alternative
  - marker: c
    text: “Membros” refere-se aqui às partes ou faculdades do corpo como instrumentos de ação.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: carne
  rationale: Preserva o termo paulino e a tensão de sua linguagem, sem reduzi-lo no texto principal a uma fórmula antropológica específica.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: paixões pecaminosas
  rationale: Expressa naturalmente em português o genitivo qualitativo, segundo o qual o pecado caracteriza essas paixões; a forma mais literal é registrada em nota.
- source_word: διὰ τοῦ νόμου
  choice: despertadas por meio da lei
  rationale: No contexto, a expressão qualifica as paixões e indica que sua atuação ocorre mediante a lei. 'Despertadas' torna explícita a relação sugerida pelo argumento de Romanos 7, sem afirmar que a lei seja a origem moral do pecado.
- source_word: ἐνηργεῖτο
  choice: atuavam
  rationale: O imperfeito comunica atividade contínua no passado; 'atuavam' é claro e idiomático.
- source_word: μέλεσιν
  choice: membros do nosso corpo
  rationale: Torna compreensível o uso paulino de 'membros' como partes ou faculdades corporais empregadas na ação, evitando a possível leitura moderna de membros de um grupo.
- source_word: καρποφορῆσαι
  choice: produzir fruto
  rationale: Mantém a metáfora orgânica e soa natural em português no encaixe sintático da frase.
- source_word: τῷ θανάτῳ
  choice: para a morte
  rationale: Preserva a direção ou resultado do fruto produzido, bem como o contraste incisivo de Paulo.
theological_decisions:
- issue: Sentido de ἐν τῇ σαρκί
  choice: na carne
  alternative: sob o domínio da natureza pecaminosa / em nossa condição humana caída
  rationale: A tradução transparente preserva a terminologia e a tensão da contraposição paulina entre carne e Espírito; a nota esclarece sentidos possíveis sem impor uma única formulação doutrinária.
- issue: Relação entre as paixões pecaminosas e a lei
  choice: despertadas por meio da lei
  alternative: que vinham por meio da lei / que operavam mediante a lei
  rationale: O contexto imediato (especialmente Romanos 7:7–13) favorece a ideia de que a lei suscita ou ativa essas paixões, não de que seja moralmente pecaminosa ou sua causa última. A redação mantém a lei como meio, não como fonte do mal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, mantendo o vocabulário paulino central e assinalando alternativas relevantes em notas.
