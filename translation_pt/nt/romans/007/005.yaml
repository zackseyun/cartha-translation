  source_fidelity: 'A redação principal preserva adequadamente a estrutura e os termos centrais do grego: ζωή anterior «na carne», paixões caracterizadas pelo pecado, atividade contínua nos membros e fruto orientado para a morte. Contudo, «despertadas por meio da lei» vai além de τὰ διὰ τοῦ νόμου. Embora o contexto de Romanos 7 permita falar de paixões suscitadas pela lei, o particípio «despertadas» introduz explicitamente uma noção causal que este versículo não enuncia.'
  naturalness: O português é moderno, claro e de registro apropriado. «Nos membros do nosso corpo» é uma explicitação idiomática útil para evitar a acepção contemporânea de membros de um grupo. «Dar fruto» é uma expressão um pouco mais estabelecida do que «produzir fruto» e mantém a metáfora paulina.
  terminology: «Carne», «paixões pecaminosas», «lei», «membros» e «morte» são escolhas consistentes e teologicamente não impositivas. A nota sobre «carne» preserva as possibilidades interpretativas sem substituir o termo paulino no texto. A nota b registra apropriadamente a construção mais literal.
