- from: Pois, quando estávamos na carne[a], as paixões pecaminosas[b], despertadas por meio da lei, atuavam nos membros do nosso corpo[c], a fim de produzir fruto para a morte.
  to: Pois, quando estávamos na carne[a], as paixões pecaminosas[b], que vinham por meio da lei, atuavam nos membros do nosso corpo[c], a fim de darem fruto para a morte.
  rationale: Substituí «despertadas por meio da lei» por «que vinham por meio da lei», formulação natural em português que mantém a relação mediadora expressa por διὰ τοῦ νόμου sem antecipar a explicação contextual de que o pecado é suscitado pela lei. Também ajustei «produzir fruto» para «darem fruto», preservando de modo mais direto a metáfora orgânica e o sujeito plural («as paixões»).
