  source_fidelity: A tradução preserva adequadamente a estrutura explicativa de γάρ, a personificação de ἁμαρτία como sujeito ativo e a sequência participial seguida dos dois verbos principais. “Aproveitando a oportunidade” comunica de modo idiomático a exploração de uma ocasião expressa por ἀφορμὴν λαβοῦσα, e “por meio do mandamento/dele” mantém a instrumentalidade de διά e a retomada de ἐντολή.
