id: ROM.7.11
reference: Romans 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: pt
  text: Pois o pecado, aproveitando a oportunidade por meio do mandamento, enganou-me e, por meio dele, matou-me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dele” refere-se ao mandamento.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Preserva de modo natural o valor explicativo que liga o versículo à afirmação anterior.
- source_word: ἡ ἁμαρτία
  choice: o pecado
  rationale: Mantém o uso paulino e a personificação gramatical do pecado como agente das ações.
- source_word: ἀφορμὴν λαβοῦσα
  choice: aproveitando a oportunidade
  rationale: Expressa naturalmente a ideia de tomar ou explorar uma ocasião, sem enfraquecer a atuação agressiva atribuída ao pecado.
- source_word: διὰ τῆς ἐντολῆς
  choice: por meio do mandamento
  rationale: Comunica com clareza o sentido instrumental de διά e preserva o singular.
- source_word: ἐξηπάτησέν με
  choice: enganou-me
  rationale: Tradução clara e direta; evita exagerar lexicalmente a possível nuance intensiva do verbo.
- source_word: δι’ αὐτῆς
  choice: por meio dele
  rationale: O pronome grego retoma ἐντολή; em português, o masculino concorda com “mandamento” e conserva o sentido instrumental.
- source_word: ἀπέκτεινεν
  choice: matou-me
  rationale: Equivalente moderno e direto que mantém a força letal da ação atribuída ao pecado.
theological_decisions:
- issue: Grau de personificação do pecado na argumentação de Paulo
  choice: Apresentar o pecado como agente ativo que aproveita, engana e mata, sem acréscimos interpretativos.
  alternative: Atenuar a agência, tratando o pecado apenas como conceito abstrato ou efeito impessoal.
  rationale: O pecado é o sujeito gramatical das ações no grego. A tradução preserva essa personificação e sua tensão teológica sem explicá-la ou resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aproveitando a oportunidade” soa mais natural do que o decalque “tomando uma oportunidade”. A colocação pronominal em “enganou-me” e “matou-me” mantém um registro bíblico digno sem ser arcaico.
