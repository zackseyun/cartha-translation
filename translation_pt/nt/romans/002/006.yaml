  text: who will repay each one according to his works[a][b].
translation:
  language: pt
  text: que retribuirá a cada um segundo as suas obras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus atos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: que
  rationale: Pronome relativo natural em português, retomando Deus no contexto anterior.
- source_word: ἀποδώσει
  choice: retribuirá
  rationale: Preserva a ideia de dar a alguém o que lhe corresponde, especialmente em contexto judicial, sem limitar o resultado a recompensa positiva ou castigo.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Mantém a força distributiva do singular e destaca a responsabilidade individual.
- source_word: κατὰ
  choice: segundo
  rationale: Expressa de modo claro e idiomático o padrão ou critério da retribuição.
- source_word: τὰ ἔργα
  choice: as suas obras
  rationale: “Obras” é o equivalente direto, preserva a terminologia paulina e, com o possessivo, comunica naturalmente a relação expressa por αὐτοῦ.
- source_word: αὐτοῦ
  choice: suas
  rationale: Em “a cada um segundo as suas obras”, o possessivo retoma distributivamente cada pessoa; a formulação é natural e evita que o masculino gramatical grego seja confundido com exclusão das mulheres.
theological_decisions:
- issue: Julgamento segundo as obras
  choice: Manter “retribuirá ... segundo as suas obras” sem atenuar a afirmação.
  alternative: Empregar “tratará” ou restringir o sentido a “recompensará”.
  rationale: O texto apresenta retribuição conforme as obras. A tradução preserva essa tensão teológica, sem harmonizá-la interpretativamente com outras passagens paulinas sobre justificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Retribuirá” conserva o caráter judicial e bilateral de ἀποδώσει; “obras” mantém a consistência lexical paulina. O possessivo plural em português já transmite naturalmente o valor representativo e distributivo do grego, dispensando nota cultural específica.
