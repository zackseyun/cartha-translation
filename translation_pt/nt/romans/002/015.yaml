source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: pt
  text: Eles mostram que a obra da lei[a] está escrita no coração deles, enquanto a consciência deles também dá testemunho, e os pensamentos deles, entre si, os acusam ou até os defendem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as exigências da lei” ou “o que a lei exige”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega inclui um termo recíproco, “uns aos outros”; a relação exata entre os pensamentos que acusam ou defendem é sintaticamente condensada.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: mostram
  rationale: “Mostram” é natural e preserva a força evidencial do verbo sem intensificá-la para “provam”.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: a obra da lei
  rationale: Mantém a expressão grega no singular e evita transformar implicitamente “obra” em “exigências”; a interpretação comum é registrada em nota.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: escrita no coração deles
  rationale: Reproduz de modo idiomático a metáfora de uma inscrição interior. O singular coletivo “coração” é corrente em português e não altera o sentido distributivo do plural grego.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: a consciência deles também dá testemunho
  rationale: Expressa com clareza a construção absoluta e conserva tanto a ideia de testemunho corroborante quanto o valor de καί.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: os pensamentos deles, entre si
  rationale: Preserva a difícil noção recíproca de ἀλλήλων sem decidir de maneira excessiva se os pensamentos interagem uns com os outros ou funcionam interiormente em relação às pessoas.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: os acusam ou até os defendem
  rationale: “Defendem” representa mais diretamente ἀπολογουμένων do que “desculpam”, e “até” comunica a ênfase de καί depois de ἤ. Os pronomes retomam as pessoas em questão, leitura sintaticamente plausível, sem fazer dos pensamentos o objeto da acusação e da defesa.
theological_decisions:
- issue: Se Paulo fala genericamente de percepção moral interior ou, de modo mais específico, das exigências da lei.
  choice: Manter “a obra da lei” no texto principal.
  alternative: “as exigências da lei” ou “o que a lei exige”
  rationale: A formulação grega é compacta e menos interpretativa. A tradução principal conserva essa tensão teológica, enquanto a nota oferece as explicitações usuais.
- issue: A relação de “entre si/uns com os outros” com os pensamentos que acusam ou defendem.
  choice: Preservar “entre si” junto de “os pensamentos deles”, usando as pessoas como objeto de “acusam” e “defendem”.
  alternative: “seus pensamentos acusam ou até defendem uns aos outros” ou omitir a expressão recíproca no texto principal
  rationale: A sintaxe grega é comprimida. A redação conserva o elemento recíproco sem sugerir de modo improvável que os pensamentos propriamente se defendem uns aos outros; a nota reconhece a dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha o encadeamento do grego sem sacrificar a naturalidade. “Coração” é usado no singular coletivo, e “consciência” mantém o sentido moral interior sem explicitação doutrinária adicional.
