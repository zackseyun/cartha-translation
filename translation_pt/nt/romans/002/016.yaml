id: ROM.2.16
reference: Romans 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: pt
  text: no dia em que Deus julgará os segredos das pessoas por meio do Messias Jesus[a], de acordo com o meu evangelho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Cristo Jesus».'
    reason: Forma tradicional alternativa para Χριστοῦ Ἰησοῦ.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: no dia em que
  rationale: Reproduz naturalmente a construção temporal e mantém a referência explícita ao dia do juízo.
- source_word: κρίνει
  choice: julgará
  rationale: Embora o grego use o presente do indicativo, o contexto é escatológico; em português, o futuro expressa com clareza a referência ao juízo vindouro.
- source_word: τὰ κρυπτὰ
  choice: os segredos
  rationale: Expressa de modo natural aquilo que está oculto, sem restringir indevidamente o sentido a pensamentos ou atos.
- source_word: τῶν ἀνθρώπων
  choice: das pessoas
  rationale: O termo grego é genérico e se refere aos seres humanos, não apenas aos homens do sexo masculino.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: por meio do Messias Jesus
  rationale: διά com genitivo indica mediação ou agência; aqui Χριστός conserva força de título, vertido como «Messias».
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: de acordo com o meu evangelho
  rationale: Mantém o possessivo de Paulo e a relação normativa ou declarativa indicada por κατά, em formulação clara e digna.
theological_decisions:
- issue: Χριστοῦ como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto, Χριστός pode conservar sua força titular. A tradução principal explicita esse sentido, enquanto a forma tradicional é preservada em nota.
- issue: Relação de «de acordo com o meu evangelho» com a oração
  choice: Mantida ao fim, sem explicitação adicional
  alternative: «como declara o evangelho que anuncio»
  rationale: A formulação grega pode indicar que o juízo anunciado ocorrerá conforme o evangelho de Paulo; a tradução não resolve além do texto a exata relação sintática ou teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Julgará» evita uma construção temporal pouco idiomática com presente em português; «por meio de» deixa clara a agência mediadora. O marcador [a] aparece imediatamente após a expressão a que se refere.
