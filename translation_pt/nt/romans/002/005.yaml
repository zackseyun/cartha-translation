id: ROM.2.5
reference: Romans 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: pt
  text: Mas, por causa da sua dureza e do seu coração que não se arrepende, você acumula ira para si mesmo no dia da ira e da revelação do justo julgamento de Deus,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do julgamento justo de Deus”.'
    reason: Alternativa lexical e sintática para δικαιοκρισίας τοῦ θεοῦ.
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Mas, por causa de
  rationale: O δέ introduz um contraste leve, enquanto κατά com acusativo expressa aqui a condição que fundamenta a consequência; “por causa de” comunica naturalmente essa força em português.
- source_word: σκληρότης
  choice: dureza
  rationale: Preserva a metáfora grega de insensibilidade moral e mantém uma formulação bíblica clara e corrente.
- source_word: ἀμετανόητον καρδίαν
  choice: coração que não se arrepende
  rationale: Mantém a imagem do coração e expressa em linguagem atual a falta persistente de arrependimento, evitando o termo menos acessível “impenitente”.
- source_word: θησαυρίζεις
  choice: acumula
  rationale: Comunica claramente a ideia de ajuntar progressivamente; “entesoura” preservaria mais diretamente a metáfora, mas poderia soar artificial ou sugerir algo positivo.
- source_word: σεαυτῷ
  choice: para si mesmo
  rationale: Preserva o dativo reflexivo e enfatiza que a consequência recai sobre a própria pessoa.
- source_word: ὀργή
  choice: ira
  rationale: “Ira” conserva a gravidade e a dimensão judicial da indignação divina neste contexto paulino.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: no dia da ira e da revelação
  rationale: “No dia” é a forma temporal idiomática de traduzir ἐν ἡμέρᾳ em português, e os substantivos coordenados do grego são preservados sem convertê-los numa oração verbal.
- source_word: δικαιοκρισία
  choice: justo julgamento
  rationale: Traduz o composto raro como um julgamento caracterizado pela justiça, em linguagem natural e transparente.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a referência explícita a Deus e acompanha de perto a estrutura genitiva grega.
theological_decisions:
- issue: Se a expressão nominal deve ser explicitada como uma oração temporal, por exemplo, “quando o justo julgamento de Deus será revelado”.
  choice: 'Preservar a estrutura nominal: “no dia da ira e da revelação do justo julgamento de Deus”.'
  alternative: “no dia da ira, quando o justo julgamento de Deus será revelado”.
  rationale: Embora a alternativa seja contextualmente plausível, o grego coordena “ira” e “revelação” sem verbo explícito. A tradução escolhida conserva essa forma e evita resolver além do necessário a relação sintática.
- issue: Relação de τοῦ θεοῦ com δικαιοκρισίας.
  choice: “do justo julgamento de Deus”.
  alternative: “do julgamento justo da parte de Deus”.
  rationale: O genitivo identifica o julgamento com Deus sem exigir que se especifique se a ênfase recai em posse, origem ou execução; a formulação preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no singular porque o grego se dirige diretamente a uma pessoa representativa. A vírgula final segue o trecho fornecido, que continua no contexto.
