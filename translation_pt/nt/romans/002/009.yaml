    rationale: Os genitivos «Ἰουδαίου ... Ἕλληνος» qualificam a pessoa/alma mencionada; «do judeu primeiro e também do grego» preserva melhor essa relação em português.
  revised_text: Haverá aflição e angústia sobre toda alma humana[a] que faz o mal, do judeu primeiro e também do grego[b].
