source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: pt
  text: Haverá aflição e angústia sobre toda alma humana[a] que faz o mal, do judeu primeiro e também do grego[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda pessoa” ou “todo ser humano”.
    reason: lexical_alternative
  - marker: b
    text: No contraste entre judeu e grego, “grego” refere-se a quem não é judeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: aflição
  rationale: Expressa sofrimento ou pressão severa em português atual e mantém distinção em relação a στενοχωρία.
- source_word: στενοχωρία
  choice: angústia
  rationale: Preserva a imagem de aperto e aflição interior e forma um par natural, sem ser redundante, com “aflição”.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: sobre toda alma humana
  rationale: Conserva a imagem concreta e solene de ψυχή, enquanto “humana” deixa claro o sentido genérico de ἀνθρώπου.
- source_word: τοῦ κατεργαζομένου
  choice: que pratica
  rationale: Representa o particípio substantivado com naturalidade e sugere a ação efetiva de realizar o mal, sem acrescentar a ideia obrigatória de hábito contínuo.
- source_word: τὸ κακόν
  choice: o mal
  rationale: O neutro substantivado tem sentido genérico; “o mal” é sua expressão idiomática e direta em português.
- source_word: Ἰουδαίου
  choice: judeu
  rationale: No contraste desta passagem, designa o integrante do povo judeu, não apenas um habitante da Judeia.
- source_word: Ἕλληνος
  choice: grego
  rationale: Mantém a formulação explícita de Paulo e o contraste recorrente entre judeu e grego; “não judeu” seria explicativo.
- source_word: πρῶτον
  choice: primeiro
  rationale: Preserva de modo direto a prioridade ou ordem indicada pelo texto, sem definir além dele a natureza dessa prioridade.
theological_decisions:
- issue: Explicitação do predicado implícito na frase grega compacta
  choice: Haverá aflição e angústia
  alternative: Aflição e angústia sobre toda alma humana
  rationale: O português corrente pede uma construção verbal completa. “Haverá” torna a afirmação natural e corresponde ao contexto de juízo, sem acrescentar conteúdo doutrinário.
- issue: Sentido de “grego” no contraste judeu/grego
  choice: grego no texto, com explicação em nota
  alternative: não judeu ou gentio no texto
  rationale: A tradução preserva o termo lexical de Paulo e deixa na nota sua função abrangente neste contraste, evitando substituir a formulação do original por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas “Haverá” completa naturalmente a construção em português. “Alma humana” preserva a imagem do original; a nota oferece equivalentes idiomáticos.
