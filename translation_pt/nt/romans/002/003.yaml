id: ROM.2.3
reference: Romans 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: pt
  text: Mas será que você supõe, ó homem[a] — você que julga os que praticam tais coisas e faz essas coisas —, que escapará do juízo de Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ó ser humano”. O grego usa o singular masculino e se dirige a uma pessoa representativa.'
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: você pensa
  rationale: Expressa a avaliação ou suposição mental posta em questão pela pergunta retórica, de maneira natural em português.
- source_word: ἄνθρωπε
  choice: ó homem
  rationale: Preserva o vocativo masculino singular e o estilo direto da diatribe, enquanto a nota esclarece seu caráter representativo.
- source_word: κρίνων
  choice: julga
  rationale: É o equivalente direto no contexto de avaliação moral; 'condena' seria mais forte do que o termo exige.
- source_word: πράσσοντας
  choice: praticam
  rationale: Comunica conduta reiterada e ajuda a preservar a variação verbal em relação a ποιῶν.
- source_word: ποιῶν αὐτά
  choice: faz as mesmas coisas
  rationale: Mantém a variação em relação a 'praticam' e torna explícita a referência de αὐτά às ações anteriormente mencionadas, sem acrescentar conteúdo teológico.
- source_word: ἐκφεύξῃ
  choice: escapará
  rationale: Transmite com precisão a ideia de escapar ou evadir o juízo futuro, preservando a força retórica.
- source_word: κρίμα
  choice: juízo
  rationale: Abrange aqui o ato ou resultado judicial de Deus sem restringi-lo apenas a 'sentença' ou 'veredito'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para reproduzir a interpelação direta. O vocativo “ó homem” conserva o tom retórico do original; os travessões organizam a oração participial sem eliminar sua tensão acusatória.
