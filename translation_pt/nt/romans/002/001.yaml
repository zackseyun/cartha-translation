id: ROM.2.1
reference: Romans 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: pt
  text: Portanto, você não tem desculpa, ó homem[a], você que julga, seja quem for. Pois, ao julgar outra pessoa, você condena a si mesmo, pois você que julga pratica as mesmas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ó ser humano» ou «ó pessoa». O grego emprega o substantivo masculino singular «homem», aqui com sentido representativo.
    reason: Alternativa lexical e esclarecimento do alcance genérico do vocativo.
lexical_decisions:
- source_word: Διὸ
  choice: Portanto
  rationale: Expressa naturalmente a inferência tirada do argumento anterior.
- source_word: ἀναπολόγητος
  choice: não tem desculpa
  rationale: Formulação clara e corrente que mantém a ideia judicial de não haver defesa válida.
- source_word: ὦ ἄνθρωπε
  choice: ó homem[a]
  rationale: Preserva o vocativo masculino singular e sua força retórica; a nota esclarece seu alcance representativo.
- source_word: πᾶς ὁ κρίνων
  choice: quem quer que seja você que julga
  rationale: Comunica a força universal de πᾶς e identifica diretamente o interlocutor, sem restringi-lo a um indivíduo específico.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: ao julgar o outro
  rationale: O infinitivo introduzido por «ao» conserva de modo natural tanto o aspecto temporal quanto o instrumental da construção compacta grega.
- source_word: κατακρίνεις
  choice: você condena
  rationale: Distingue o sentido condenatório e judicial do verbo em relação ao simples ato de julgar.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: pratica as mesmas coisas
  rationale: «Pratica» sugere conduta efetiva ou habitual e reflete adequadamente o presente de πράσσεις.
- source_word: ὁ κρίνων
  choice: você, que julga
  rationale: Mantém a identificação participial enfática do destinatário em português natural.
theological_decisions:
- issue: Vocativo masculino representativo na repreensão de Paulo
  choice: Manter «ó homem» no texto principal e esclarecer em nota seu alcance representativo.
  alternative: «ó ser humano» ou «ó pessoa»
  rationale: A forma principal conserva o gênero e a retórica do grego, enquanto a nota evita que o leitor entenda a repreensão como dirigida exclusivamente aos homens.
- issue: Alcance da acusação contra quem julga
  choice: Conservar a afirmação de que quem julga pratica «as mesmas coisas».
  alternative: Atenuar para pecados semelhantes ou para uma culpa genérica
  rationale: O texto grego faz a acusação sem qualificá-la; a tradução não deve resolver ou suavizar a tensão retórica e teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de «você» para manter a interpelação direta. «Ó homem» preserva deliberadamente a solenidade retórica do vocativo grego; a nota esclarece o sentido inclusivo.
