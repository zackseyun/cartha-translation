  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: pt
  text: Você, que se gloria na lei, desonra a Deus pela transgressão da lei[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao transgredir a lei”.'
    reason: Alternativa idiomática que verte verbalmente a construção nominal grega.
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: na lei
  rationale: Preserva a construção de Paulo e o sentido definido de νόμος no contexto judaico, sem reduzi-la a mero assunto de orgulho.
- source_word: καυχᾶσαι
  choice: se gloria
  rationale: Mantém o tom crítico e a ideia de vangloriar-se ou depositar orgulho na lei; é natural e digno em português.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: por meio da transgressão da lei
  rationale: Reflete a preposição διά e conserva a forma nominal παράβασις, tornando explícita a relação entre a transgressão e a lei.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: O artigo grego marca o referente definido, enquanto o português normalmente usa o nome próprio 'Deus' sem artigo nesta construção.
- source_word: ἀτιμάζεις
  choice: desonra
  rationale: Reproduz diretamente a ideia de retirar honra e preserva o contraste retórico entre gloriar-se na lei e desonrar a Deus.
theological_decisions:
- issue: Sentido de νόμος na retórica paulina
  choice: lei
  alternative: Lei, com inicial maiúscula, como título técnico da Lei de Moisés
  rationale: O contexto aponta para a lei judaica, mas a inicial minúscula evita introduzir uma convenção gráfica ausente do grego; o referente permanece claro.
- issue: Força da pergunta retórica
  choice: manter a forma interrogativa acusatória
  alternative: 'verter como declaração: ''você desonra a Deus'''
  rationale: O sinal interrogativo preserva a forma e a tensão retórica do texto grego, sem transformar a pergunta em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com 'você' para o singular de segunda pessoa, favorecendo ampla legibilidade brasileira. A formulação mantém o paralelismo e a acusação incisiva de Paulo.
