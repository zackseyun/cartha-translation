  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: pt
  text: 'Você, que diz: “Não cometa adultério”, comete adultério? Você, que abomina os ídolos, rouba templos[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo, “comete sacrilégio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Você, que diz
  rationale: O artigo com o particípio presente funciona de modo substantivado e dirige a acusação a uma pessoa representativa. A formulação mantém a interpelação retórica direta de Paulo em português natural.
- source_word: μὴ μοιχεύειν
  choice: “Não cometa adultério”
  rationale: μή com o infinitivo expressa o conteúdo da proibição. A forma citada no imperativo é idiomática em português e conserva com precisão a referência ao adultério.
- source_word: μοιχεύεις
  choice: comete adultério?
  rationale: O presente do indicativo integra uma pergunta retórica de sentido geral e acusatório; o presente simples reproduz naturalmente essa força.
- source_word: ὁ βδελυσσόμενος
  choice: Você, que abomina
  rationale: βδελύσσομαι indica forte repulsa. “Abomina” preserva essa intensidade, é corrente no registro bíblico moderno e evita uma formulação excessivamente coloquial.
- source_word: τὰ εἴδωλα
  choice: os ídolos
  rationale: No contexto, εἴδωλα designa imagens ou objetos de culto idolátrico. “Ídolos” é a equivalência clara e convencional.
- source_word: ἱεροσυλεῖς
  choice: rouba templos
  rationale: ἱεροσυλέω pode designar concretamente roubar templos ou seus bens. Esta opção preserva a imagem histórica e a ironia ligada à menção dos ídolos; o sentido mais amplo é registrado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento singular por “você” para preservar a interpelação direta. O paralelismo das duas perguntas retóricas foi mantido. O marcador da nota foi colocado junto de “rouba templos”, expressão à qual a alternativa lexical efetivamente se refere.
