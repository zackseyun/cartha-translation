  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: pt
  text: Pois não é judeu quem o é exteriormente[a], nem é circuncisão a realizada exteriormente na carne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visivelmente” / “no que é exterior”.'
    reason: lexical_alternative
  - marker: b
    text: “Na carne” refere-se aqui à circuncisão física, realizada no corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: judeu
  rationale: No contexto de Romanos, designa a identidade do povo da aliança, e não apenas a origem geográfica na Judeia.
- source_word: ἐν τῷ φανερῷ
  choice: exteriormente
  rationale: Expressa aquilo que é visível ou externo e prepara o contraste com o interior no versículo seguinte.
- source_word: περιτομή
  choice: circuncisão
  rationale: É o termo português padrão e preciso para o sinal da aliança em discussão.
- source_word: ἐν σαρκί
  choice: na carne
  rationale: Preserva a formulação concreta do grego e indica aqui a circuncisão física.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa com o argumento anterior de forma natural e digna em português.
theological_decisions:
- issue: Identidade da aliança em “judeu” e “circuncisão”
  choice: A formulação nega que a condição meramente exterior, por si só, constitua a identidade e a circuncisão em seu sentido pleno.
  alternative: Entender que Paulo nega a própria identidade judaica ou a substitui sem ressalvas por uma categoria puramente espiritual.
  rationale: O texto estabelece um contraste entre o exterior e o interior, desenvolvido no versículo 29, sem abolir explicitamente a identidade judaica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “quem o é” evita a afirmação pouco natural “um judeu não é exteriormente judeu”, enquanto a segunda oração conserva a elipse e a tensão do grego sem explicar além do texto.
