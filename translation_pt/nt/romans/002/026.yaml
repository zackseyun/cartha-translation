id: ROM.2.26
reference: Romans 2:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: pt
  text: Portanto, se o incircunciso[a] cumpre as exigências da lei, não será a sua incircuncisão considerada circuncisão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “se a incircuncisão cumpre... não será a incircuncisão dele considerada circuncisão?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: o incircunciso / a sua incircuncisão
  rationale: O substantivo significa literalmente “incircuncisão”, mas na primeira ocorrência refere-se por metonímia à pessoa não circuncidada, como confirma αὐτοῦ (“sua”). A tradução pessoal no início torna o português natural, enquanto a segunda ocorrência preserva o substantivo e o contraste retórico.
- source_word: δικαιώματα
  choice: exigências
  rationale: No plural, designa aquilo que a lei requer. “Exigências” é claro e atual, sem acrescentar a qualificação “justas”, embora essa nuance lexical possa estar presente.
- source_word: νόμου
  choice: da lei
  rationale: O genitivo é expresso naturalmente por “da lei”; a minúscula convém à referência à lei mosaica no argumento de Paulo.
- source_word: φυλάσσῃ
  choice: cumpre
  rationale: No contexto de mandamentos, indica observar ou obedecer. “Cumpre” combina naturalmente com “exigências” e comunica ação obediente.
- source_word: λογισθήσεται
  choice: será ... considerada
  rationale: Preserva a ideia de atribuir ou computar determinada condição, em formulação portuguesa clara. O feminino concorda com “incircuncisão”.
- source_word: εἰς περιτομήν
  choice: considerada circuncisão
  rationale: εἰς indica aqui a condição ou categoria na qual a incircuncisão é computada; a construção comunica esse resultado sem sugerir transformação física.
- source_word: οὐχ
  choice: não será ...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa, estrutura preservada diretamente em português.
theological_decisions:
- issue: Natureza da equiparação entre incircuncisão e circuncisão
  choice: Manter a linguagem de consideração ou imputação, sem explicar além do texto
  alternative: Explicitar que o gentio passa a ser tratado como membro do povo da aliança
  rationale: O versículo afirma que a incircuncisão será considerada circuncisão, mas não define aqui todas as implicações teológicas dessa afirmação. A tradução preserva a tensão sem importar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Incircunciso” mantém o contraste técnico necessário no contexto, e a nota registra a personificação presente na forma grega literal.
