lexical_decisions:
- source_word: πέποιθάς
  choice: está convencido
  rationale: O perfeito expressa um estado estabelecido de convicção ou confiança; «está convencido» preserva o tom de segurança pessoal no contexto.
- source_word: τε
  choice: e
  rationale: A partícula liga esta afirmação às anteriores; «e» mantém a continuidade sem tornar a conexão mais enfática que o grego.
- source_word: σεαυτόν
  choice: você mesmo
  rationale: A expressão explicita o valor reflexivo e enfático, destacando a avaliação que o interlocutor faz de si próprio.
- source_word: ὁδηγόν
  choice: guia
  rationale: «Guia» reproduz de modo natural e preciso a imagem de quem conduz outros.
- source_word: τυφλῶν
  choice: dos cegos
  rationale: O genitivo é expresso naturalmente em português como «guia dos cegos», preservando o caráter representativo da expressão.
- source_word: φῶς
  choice: luz
  rationale: O substantivo mantém diretamente a metáfora de orientação e iluminação; em português não requer artigo indefinido.
- source_word: τῶν ἐν σκότει
  choice: os que estão nas trevas
  rationale: A formulação pessoal e idiomática conserva a metáfora do grego e sua ressonância bíblica sem explicá-la.
