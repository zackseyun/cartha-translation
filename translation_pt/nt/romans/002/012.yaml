id: ROM.2.12
reference: Romans 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: pt
  text: Pois todos os que pecaram sem a lei também perecerão sem a lei[a]; e todos os que pecaram sob a lei[b] serão julgados por meio da lei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte da lei” / “sem ter lei”, nas duas ocorrências de ἀνόμως.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “na lei”; “sob a lei” ressalta a ideia de estar dentro da esfera ou jurisdição da lei.
    reason: lexical_alternative
  - marker: c
    text: Ou “pela lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: sem a lei
  rationale: Expressa a ausência da lei mosaica como referência pactual e mantém o contraste com os que pecaram sob a lei, sem reduzir o termo ao sentido meramente moral de “ilegalmente”.
- source_word: ἥμαρτον
  choice: pecaram
  rationale: Tradução direta e natural do aoristo, sem acrescentar uma interpretação aspectual indevida.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Preserva o resultado futuro indicado pelo verbo sem definir aqui se o perecimento significa aniquilação, condenação eterna ou algum modo específico de destruição.
- source_word: ἐν νόμῳ
  choice: sob a lei
  rationale: Comunica de modo idiomático a condição de estar na esfera ou sob a jurisdição da lei, em contraste com estar sem ela.
- source_word: διὰ νόμου
  choice: por meio da lei
  rationale: Mantém a força instrumental de διά e distingue essa expressão de ἐν νόμῳ, apresentando a lei como meio ou critério no julgamento.
- source_word: κριθήσονται
  choice: serão julgados
  rationale: Conserva o sentido judicial de forma neutra, sem substituir o verbo por “serão condenados” e antecipar o resultado da avaliação.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: todos os que ... e todos os que
  rationale: Reproduz a força distributiva e o paralelismo das duas categorias.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o argumento anterior.
theological_decisions:
- issue: Referência de νόμος
  choice: “a lei”, entendida no contexto sobretudo como a lei mosaica
  alternative: lei em sentido moral mais geral
  rationale: O contraste entre os que estão sem a lei e os que vivem sob sua jurisdição, no argumento de Romanos 2, aponta especialmente para a distinção entre gentios e judeus. A tradução não acrescenta “de Moisés” ao texto, preservando a formulação de Paulo.
- issue: Sentido de ἀπολοῦνται e sua relação com a condenação final
  choice: “perecerão”, sem especificar a natureza ou o modo desse destino
  alternative: “serão destruídos” ou “serão condenados”
  rationale: O versículo anuncia um resultado judicial, mas não define por si só seus mecanismos. A tradução mantém essa tensão teológica.
- issue: Alcance de κριθήσονται
  choice: “serão julgados”
  alternative: “serão condenados”
  rationale: O verbo designa julgamento ou avaliação judicial; traduzir diretamente como condenação resolveria uma questão que a forma lexical não explicita por si só.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe paralela próxima à do grego. “Sem a lei” e “sob a lei” são naturais para leitores brasileiros e amplamente compreensíveis no português internacional. O ponto e vírgula preserva a estrutura contrastiva das duas orações.
