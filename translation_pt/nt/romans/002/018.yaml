source:
  edition: SBLGNT
  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: pt
  text: e conheces a vontade de Deus[a] e aprovas o que é excelente[b], sendo instruído pela Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “a vontade”; Deus é o referente implícito no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “as coisas que diferem”. Mais literalmente, “pões à prova as coisas que diferem”.
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: conhece
  rationale: O presente do indicativo expressa conhecimento efetivo; “conhece” é a equivalência portuguesa mais direta e natural.
- source_word: τὸ θέλημα
  choice: a vontade de Deus
  rationale: O grego diz literalmente “a vontade”, sem possessivo expresso; no contexto, porém, Deus é o referente implícito. A nota preserva essa particularidade formal.
- source_word: δοκιμάζεις
  choice: sabe discernir
  rationale: Aqui o verbo envolve examinar e reconhecer o que merece preferência. “Sabe discernir” comunica tanto a avaliação quanto seu resultado, sem sugerir mera aprovação passiva.
- source_word: τὰ διαφέροντα
  choice: o que é melhor
  rationale: A expressão pode designar literalmente “as coisas que diferem” ou, idiomaticamente, “as coisas superiores/excelentes”. No contexto de discernimento moral, “o que é melhor” exprime com naturalidade o sentido provavelmente pretendido, enquanto a nota conserva a alternativa mais literal.
- source_word: κατηχούμενος
  choice: por ser instruído
  rationale: O particípio passivo descreve a instrução recebida e provavelmente tem força causal neste contexto. A formulação portuguesa conserva o valor participial e a relação explicativa.
- source_word: ἐκ τοῦ νόμου
  choice: pela Lei
  rationale: Embora ἐκ indique literalmente origem ou fonte (“a partir da Lei”), em português “instruído pela Lei” comunica naturalmente que a Lei é a fonte da instrução. A inicial maiúscula identifica a Lei judaica no contexto.
theological_decisions:
- issue: Referente de τὸ θέλημα
  choice: Explicitar Deus no texto e registrar em nota que o possessivo não aparece no grego.
  alternative: Traduzir literalmente “a vontade”.
  rationale: O contexto imediato torna Deus o referente inequívoco, mas a nota evita apresentar a explicitação como se fosse lexicalmente expressa no original.
- issue: Sentido de τὰ διαφέροντα
  choice: Adotar o sentido comparativo “o que é melhor”, com a leitura formal em nota.
  alternative: “as coisas que diferem”
  rationale: A construção admite ambos os sentidos. O contexto favorece a capacidade de reconhecer o que é superior, sem eliminar a ambiguidade textual, que fica documentada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lei” recebe inicial maiúscula por se referir à Lei judaica. A frase permanece ligada sintaticamente ao contexto iniciado no versículo anterior.
