id: ROM.2.25
reference: Romans 2:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: pt
  text: Pois a circuncisão, de fato, tem valor se você pratica a lei[a]; mas, se você é transgressor da lei[b], sua circuncisão se tornou incircuncisão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumpre a lei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alguém que viola a lei”.'
    reason: lexical_alternative
  - marker: c
    text: 'Isto é, ao transgredir a lei, a pessoa perde o valor associado à circuncisão como sinal da aliança; Paulo mantém a formulação forte: “sua circuncisão se tornou incircuncisão”.'
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: circuncisão
  rationale: Mantém o substantivo concreto e a categoria da aliança, além do paralelismo direto com ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: Pois ... de fato
  rationale: Reproduz tanto a ligação explicativa de γάρ quanto a afirmação inicial marcada por μέν, preparando o contraste introduzido por δέ.
- source_word: ὠφελεῖ
  choice: tem valor
  rationale: Expressa benefício ou utilidade real em português natural, sem sugerir lucro financeiro.
- source_word: ἐὰν νόμον πράσσῃς
  choice: se você pratica a lei
  rationale: Preserva o sentido verbal de fazer ou praticar, sem reduzir a expressão a mero conhecimento ou assentimento.
- source_word: παραβάτης νόμου
  choice: transgressor da lei
  rationale: Conserva a formulação forense e a relação explícita com a lei, em vez de condensá-la em uma paráfrase.
- source_word: ἡ περιτομή σου
  choice: sua circuncisão
  rationale: Mantém a interpelação direta e a força retórica do possessivo.
- source_word: ἀκροβυστία
  choice: incircuncisão
  rationale: No contexto, designa o oposto da circuncisão como condição ou categoria ligada à aliança; a escolha preserva o contraste terminológico de Paulo.
- source_word: γέγονεν
  choice: se tornou
  rationale: O perfeito grego apresenta uma mudança com estado resultante; “se tornou” mantém a formulação forte e direta.
theological_decisions:
- issue: Se a cláusula final deve ser explicada como avaliação da condição da pessoa ou mantida como reversão retórica
  choice: sua circuncisão se tornou incircuncisão
  alternative: sua circuncisão passa a ser considerada incircuncisão
  rationale: A redação principal conserva a afirmação enfática de Paulo e não resolve a metáfora em linguagem meramente avaliativa. A nota esclarece o sentido contextual sem enfraquecer o texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Incircuncisão” é menos frequente na linguagem cotidiana, mas foi preservado por sua precisão no contraste paulino com “circuncisão”.
