id: ROM.2.10
reference: Romans 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: pt
  text: mas glória, honra e paz a todo aquele que pratica o bem[a], primeiro ao judeu e também ao grego.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aquilo que é bom».
    reason: lexical_alternative
  - marker: b
    text: Aqui, «grego» provavelmente designa, de modo mais amplo, quem não é judeu, isto é, o gentio.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: glória
  rationale: Equivalente português consagrado que preserva o peso honorífico e a dimensão de recompensa no contexto.
- source_word: τιμή
  choice: honra
  rationale: Tradução natural no par com «glória» e adequada à linguagem de recompensa.
- source_word: εἰρήνη
  choice: paz
  rationale: Preserva a amplitude do termo bíblico sem restringi-lo a bem-estar interior, social ou pactual.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: a todo aquele que pratica
  rationale: Expressa de modo natural o sentido característico e contínuo do particípio, evitando a rigidez de «trabalha».
- source_word: τὸ ἀγαθόν
  choice: o bem
  rationale: Reproduz de maneira idiomática o adjetivo substantivado grego; «aquilo que é bom» permanece uma alternativa possível.
- source_word: Ἰουδαίῳ
  choice: ao judeu
  rationale: Equivalente direto e corrente; o singular tem valor representativo, como no grego.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém a concisão e a ordem expressa no texto, sem explicar além do que o versículo declara.
- source_word: Ἕλληνι
  choice: ao grego
  rationale: Conserva a formulação literal do contraste paulino «judeu e grego»; a abrangência provável de não judeu é esclarecida em nota.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste com a ira e a angústia mencionadas no versículo anterior.
theological_decisions:
- issue: Sentido de Ἕλληνι no contraste entre judeu e grego
  choice: «ao grego» no texto principal, com nota explicando o sentido mais amplo provável
  alternative: «ao gentio»
  rationale: «Grego» preserva a expressão da fonte, enquanto a nota comunica que, neste contraste, o termo provavelmente abrange os não judeus em geral, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem retórica e o contraste do grego foram preservados; as notas mantêm alternativas lexicais e a abrangência cultural sem sobrecarregar o texto principal.
