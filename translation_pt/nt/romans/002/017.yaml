id: ROM.2.17
reference: Romans 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: pt
  text: Mas, se você se chama judeu[a], apoia-se na Lei[b] e se gloria em Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leva o nome de judeu” ou “é chamado judeu”.
    reason: lexical_alternative
  - marker: b
    text: Ou “descansa na Lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Mas, se
  rationale: Preserva a força condicional de εἰ e o valor levemente contrastivo e continuativo de δέ no argumento de Paulo.
- source_word: Ἰουδαῖος
  choice: judeu
  rationale: Em Romanos, o termo é sobretudo uma designação étnico-religiosa, não meramente geográfica.
- source_word: ἐπονομάζῃ
  choice: se chama
  rationale: 'A forma média admite sentido reflexivo: a pessoa reivindica ou assume para si essa designação. A expressão é natural em português e mantém a força retórica.'
- source_word: ἐπαναπαύῃ
  choice: apoia-se
  rationale: Expressa confiança depositada na Lei, e não descanso físico, em linguagem portuguesa clara e atual.
- source_word: νόμῳ
  choice: na Lei
  rationale: A maiúscula explicita a referência provável à Lei mosaica como categoria reconhecida no argumento, sem acrescentar conteúdo ao substantivo grego anartro.
- source_word: καυχᾶσαι
  choice: se gloria
  rationale: Mantém o vocabulário paulino de orgulho ou exultação, deixando que o contexto determine sua avaliação moral.
- source_word: ἐν θεῷ
  choice: em Deus
  rationale: Reproduz diretamente a construção com ἐν e preserva a formulação teologicamente carregada de Paulo.
theological_decisions:
- issue: Valor de καυχᾶσαι ἐν θεῷ
  choice: se gloria em Deus
  alternative: orgulha-se de Deus
  rationale: A tradução preserva a ambiguidade contextual entre uma alegação legítima de relação com Deus e uma confiança presunçosa; o versículo não deve resolvê-la antecipadamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece incompleta porque o grego introduz uma condição cuja continuação aparece nos versículos seguintes. Os marcadores foram colocados imediatamente após as expressões a que se referem.
source_grounding:
  english_pob_role: consult_only
