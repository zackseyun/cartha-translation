source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: pt
  text: Pois, por causa de vocês, o nome de Deus é blasfemado entre os gentios[a], como está escrito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre as nações”.'
    reason: lexical_alternative
  - marker: b
    text: Paulo faz eco às Escrituras, especialmente a Isaías 52:5, e a temas também presentes em Ezequiel 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a repreensão anterior e preserva de modo natural a ligação argumentativa.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: o nome de Deus
  rationale: Mantém a formulação direta do grego; embora “nome” também envolva reputação neste contexto, não é necessário explicitar isso por paráfrase.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: διά com acusativo expressa causa neste contexto. A formulação comunica com clareza que a conduta dos destinatários ocasiona a blasfêmia.
- source_word: βλασφημεῖται
  choice: é blasfemado
  rationale: Preserva a voz passiva e o sentido forte de falar de modo irreverente ou injurioso contra Deus.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: No contraste judaico-gentílico de Romanos, ἔθνη designa mais naturalmente os não judeus; “entre as nações” continua sendo uma alternativa lexical legítima e aparece em nota.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Expressão portuguesa consagrada e natural para a fórmula que introduz ou identifica uma citação das Escrituras.
theological_decisions:
- issue: A responsabilidade expressa por δι’ ὑμᾶς
  choice: por causa de vocês
  alternative: por meio de vocês
  rationale: A tradução causal preserva a acusação de Paulo sem afirmar que os destinatários sejam os agentes diretos da blasfêmia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Vocês” evita regionalismo excessivo; “gentios” preserva o contraste histórico e teológico do contexto paulino.
