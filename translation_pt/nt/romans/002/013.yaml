id: ROM.2.13
reference: Romans 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: pt
  text: Pois não são os que ouvem a lei que são justos diante de Deus, mas os que praticam a lei serão justificados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «serão declarados justos»; alternativamente, «serão vindicados».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: os que ouvem
  rationale: Expressa naturalmente em português o substantivo grego e mantém o contraste direto com «os que praticam».
- source_word: νόμου
  choice: a lei
  rationale: Embora o substantivo esteja sem artigo no grego, o contexto paulino aponta para a lei já em discussão; o artigo é natural e claro em português.
- source_word: δίκαιοι
  choice: justos
  rationale: É o equivalente português corrente e preserva a relação lexical e teológica com «justificados».
- source_word: παρὰ τῷ θεῷ
  choice: diante de Deus
  rationale: Comunica de modo conciso a posição das pessoas perante a avaliação ou o juízo de Deus.
- source_word: ποιηταὶ
  choice: os que praticam
  rationale: Soa mais natural que «fazedores» e comunica que se trata de cumprir a lei, preservando a antítese entre ouvir e agir.
- source_word: δικαιωθήσονται
  choice: serão justificados
  rationale: Preserva o futuro passivo e a continuidade do vocabulário paulino de δικαιόω sem restringir seu sentido a uma única explicação.
theological_decisions:
- issue: Sentido forense e teológico de δικαιωθήσονται
  choice: serão justificados
  alternative: serão declarados justos; será reconhecido que são justos
  rationale: A formulação principal mantém a terminologia característica de Romanos e a tensão do argumento. As alternativas esclarecem sentidos possíveis sem os impor ao texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Os que ouvem» e «os que praticam» evitam substantivos artificiais e mantêm o paralelismo retórico do grego.
