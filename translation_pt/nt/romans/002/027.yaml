  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: pt
  text: E a pessoa incircuncisa por natureza[a], se cumprir a lei, julgará você, que, com a letra e a circuncisão[b], é transgressor da lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a incircuncisão»; isto é, uma pessoa incircuncisa.
    reason: lexical_alternative
  - marker: b
    text: '«A letra» também pode ser traduzida como «o código escrito». Outra tradução possível da frase é: «por meio da letra e da circuncisão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: a pessoa incircuncisa
  rationale: O substantivo significa literalmente «incircuncisão», mas aqui funciona metonimicamente para uma pessoa não circuncidada. A formulação mantém a referência pessoal sem introduzir o termo étnico mais amplo «gentio».
- source_word: ἐκ φύσεως
  choice: por natureza
  rationale: Preserva de modo natural a expressão grega e o contraste entre a condição incircuncisa natural e a posse da circuncisão.
- source_word: τελοῦσα
  choice: se cumprir
  rationale: O particípio descreve o cumprimento efetivo da lei e, no contexto, admite valor condicional. Esta formulação produz português claro sem afirmar além do texto.
- source_word: νόμον
  choice: a lei
  rationale: O contexto aponta para a lei mosaica como referente conhecido; a forma definida conserva essa especificidade.
- source_word: διὰ γράμματος καὶ περιτομῆς
  choice: mesmo tendo a letra e a circuncisão
  rationale: διά neste contexto caracteriza os meios ou privilégios de que o interlocutor dispõe. «Mesmo tendo» comunica naturalmente o contraste condenatório, enquanto a nota preserva uma alternativa mais formal para γράμμα.
- source_word: παραβάτην νόμου
  choice: transgressor da lei
  rationale: Mantém explícita a relação com νόμος e reproduz a força jurídica e moral de παραβάτης.
theological_decisions:
- issue: Se ἀκροβυστία deve ser explicitada como uma designação étnica
  choice: a pessoa incircuncisa
  alternative: o gentio
  rationale: Embora o argumento mais amplo contraste judeus e gentios, este versículo exprime especificamente o contraste entre circuncisão e incircuncisão. A tradução não resolve a expressão em um rótulo étnico ausente do termo grego.
- issue: Valor circunstancial do particípio τελοῦσα
  choice: se cumprir a lei
  alternative: cumprindo a lei
  rationale: O valor condicional se ajusta ao argumento contextual, mas não implica que Paulo esteja afirmando sem qualificação que toda pessoa incircuncisa cumpre a lei.
- issue: Força de διὰ γράμματος καὶ περιτομῆς
  choice: mesmo tendo a letra e a circuncisão
  alternative: por meio da letra e da circuncisão
  rationale: A construção identifica os privilégios ou recursos em cuja posse ocorre a transgressão. A tradução evita sugerir de forma excessivamente rígida que a letra e a circuncisão sejam causas da transgressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» para o singular enfático σέ e conserva «lei», «circuncisão» e «transgressor» como vocabulário bíblico corrente.
