  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: pt
  text: vida eterna aos que, perseverando em fazer o bem, buscam glória, honra e incorruptibilidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: perseverando em fazer o bem
  rationale: Expressa de modo natural a constância indicada por ὑπομονή e entende ἔργου ἀγαθοῦ como a prática do bem, sem a rigidez pouco idiomática de “obra boa”.
- source_word: ἀφθαρσίαν
  choice: incorruptibilidade
  rationale: Preserva o sentido de condição não sujeita à corrupção ou deterioração e mantém a distinção lexical em relação a “vida eterna”.
- source_word: ζωὴν αἰώνιον
  choice: vida eterna
  rationale: Equivalente português consagrado e semanticamente direto para a expressão grega.
theological_decisions:
- issue: Relação entre perseverança em fazer o bem e vida eterna
  choice: Manter a formulação condicional/distributiva do texto sem explicação doutrinária adicional
  alternative: Reformular para explicitar recompensa, mérito ou evidência da fé
  rationale: O versículo, isoladamente, afirma que Deus dará vida eterna a esse grupo; a tradução deve preservar essa tensão no contexto do argumento de Paulo, sem impor um sistema teológico.
- issue: 'Objeto da busca: ἀφθαρσία'
  choice: incorruptibilidade
  alternative: imortalidade
  rationale: “Incorruptibilidade” reproduz mais precisamente ἀφθαρσία e evita confundi-la com ἀθανασία, embora “imortalidade” seja uma tradução contextual possível.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A ordem foi ajustada naturalmente, conservando a estrutura fragmentária do versículo em continuidade com Romanos 2:6.
