  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: pt
  text: Ou você despreza a riqueza da bondade, da tolerância[a] e da paciência de Deus, sem saber que a bondade de Deus está levando você ao arrependimento?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “tolerância” é a contenção ou o adiamento do juízo, não a aprovação do mal. “Benignidade” também pode traduzir “bondade” nas duas ocorrências.
    reason: Esclarecimento lexical sobre ἀνοχή e alternativa legítima para χρηστότης / τὸ χρηστόν.
lexical_decisions:
- source_word: πλούτου
  choice: riqueza
  rationale: Preserva a metáfora paulina de abundância e a construção genitiva, sem aplaná-la como simples quantidade.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: bondade
  rationale: “Bondade” é natural e digna em português, cobre o caráter benevolente e generoso de Deus neste contexto e permite consistência nas duas ocorrências; “benignidade” é possível, mas menos corrente.
- source_word: ἀνοχῆς
  choice: tolerância
  rationale: Expressa o adiamento ou a contenção do juízo. No contexto, não sugere aprovação moral do pecado, mas o fato de Deus suportá-lo por um tempo.
- source_word: μακροθυμίας
  choice: paciência
  rationale: É a forma moderna e clara de comunicar a disposição prolongada de Deus em não executar imediatamente o juízo.
- source_word: καταφρονεῖς
  choice: despreza
  rationale: Mantém a força repreensiva do verbo grego de tratar algo como indigno ou de pouco valor.
- source_word: ἀγνοῶν
  choice: sem reconhecer
  rationale: Reproduz naturalmente a circunstância expressa pelo particípio, sem afirmar de modo indevido que se trata de ignorância inocente ou de recusa deliberada.
- source_word: εἰς μετάνοιάν
  choice: ao arrependimento
  rationale: “Arrependimento” é o equivalente português estabelecido que comunica a mudança moral e espiritual pretendida, preservando a direção indicada por εἰς.
- source_word: ἄγει
  choice: está levando
  rationale: Representa naturalmente o presente grego e destaca a ação contínua da bondade divina em conduzir o destinatário.
theological_decisions:
- issue: Sentido de χρηστότης / χρηστόν como qualidade da ação de Deus
  choice: bondade nas duas ocorrências
  alternative: benignidade ou generosidade
  rationale: A repetição lexical foi preservada. “Bondade” mantém a amplitude sem eliminar o tom relacional e benevolente do contexto.
- issue: Relação entre a bondade de Deus e o arrependimento
  choice: “está levando você ao arrependimento”
  alternative: “leva você ao arrependimento” ou “destina-se a levar você ao arrependimento”
  rationale: A formulação preserva a ação expressa por ἄγει sem resolver além do texto questões sobre a resposta efetiva do destinatário ou a irresistibilidade dessa condução.
- issue: Natureza da ἀνοχή divina
  choice: tolerância, esclarecida em nota como contenção temporária do juízo
  alternative: indulgência ou clemência
  rationale: Evita interpretar a tolerância como aprovação do mal e conserva sua distinção em relação à paciência.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A ordem foi ajustada para evitar a sequência pesada de possessivos, explicitando “de Deus” sem alterar o referente. O tom permanece direto, repreensivo e digno.
