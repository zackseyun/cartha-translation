id: ROM.2.20
reference: Romans 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: pt
  text: instrutor dos insensatos, professor de crianças pequenas, tendo na lei a forma[a] do conhecimento e da verdade—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a expressão do conhecimento e da verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: instrutor
  rationale: Expressa quem educa e orienta, adequando-se à série de pretensões didáticas sem enfatizar excessivamente a ideia de punição.
- source_word: ἀφρόνων
  choice: insensatos
  rationale: Preserva o sentido de pessoas sem entendimento ou juízo e o tom depreciativo da caracterização.
- source_word: διδάσκαλον
  choice: mestre
  rationale: É uma tradução natural de διδάσκαλος e evita a repetição sonora pouco elegante de “instrutor... professor”.
- source_word: νηπίων
  choice: crianças
  rationale: νήπιος pode designar bebês ou crianças muito pequenas e, figuradamente, pessoas imaturas; “crianças” mantém a imagem sem sugerir exclusivamente recém-nascidos.
- source_word: ἔχοντα
  choice: tendo
  rationale: Mantém o particípio e sua ligação sintática com as descrições anteriores, que continuam a construção iniciada nos versículos precedentes.
- source_word: μόρφωσιν
  choice: expressão
  rationale: μόρφωσις pode indicar forma, configuração ou manifestação concreta. “Expressão” comunica que conhecimento e verdade encontram forma na lei, sem resolver totalmente se Paulo afirma substância plena ou forma exterior.
- source_word: γνώσεως
  choice: conhecimento
  rationale: Equivalente direto e natural, preservando sua associação com “verdade”.
- source_word: ἀληθείας
  choice: verdade
  rationale: Equivalente direto e corrente, adequado ao vocabulário paulino.
- source_word: ἐν τῷ νόμῳ
  choice: na lei
  rationale: Preserva a força da preposição e identifica a lei como o âmbito em que se encontra a alegada expressão do conhecimento e da verdade.
theological_decisions:
- issue: Sentido de μόρφωσις em relação à lei
  choice: expressão
  alternative: forma; corporificação
  rationale: “Expressão” conserva a amplitude lexical entre uma forma configurada e uma manifestação concreta, evitando afirmar de modo excessivo que a lei seja a plena corporificação do conhecimento e da verdade ou, no extremo oposto, apenas uma aparência vazia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão final foi preservado porque o versículo continua a estrutura retórica e sintática do contexto. “Lei” permanece em minúscula, como no tratamento editorial da camada de consulta.
