id: ROM.2.8
reference: Romans 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: pt
  text: 'Mas, para os que agem por ambição egoísta e desobedecem à verdade, mas obedecem à injustiça[a]: ira e furor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à iniquidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: agem por ambição egoísta
  rationale: A construção ἐξ indica a motivação ou fonte da conduta; “por ambição egoísta” comunica o interesse próprio e o espírito faccioso sem tornar a frase artificial em português.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: desobedecem à verdade
  rationale: Preserva a força moral e volitiva de ἀπειθέω, mais forte que simples incredulidade, e mantém o paralelismo com “obedecem”.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: e obedecem à injustiça
  rationale: O segundo particípio contrasta a recusa da verdade com a submissão à ἀδικία. Em português, “e” dá continuidade natural à caracterização adversa já introduzida por “Mas”, sem eliminar a oposição semântica entre os verbos.
- source_word: ἀδικίᾳ
  choice: injustiça
  rationale: “Injustiça” é uma tradução natural e ampla do termo em português, capaz de abranger tanto a oposição moral à verdade quanto a falta de retidão; “iniquidade” é preservada em nota como alternativa de registro bíblico.
- source_word: ὀργὴ
  choice: ira
  rationale: “Ira” conserva o tom solene e judicial do contexto de julgamento divino.
- source_word: θυμός
  choice: indignação
  rationale: Ao lado de ὀργή, “indignação” mantém a intensificação retórica sem recorrer ao tom potencialmente descontrolado de “fúria”.
- source_word: implicit verbal ellipsis
  choice: dois-pontos antes de “ira e indignação”
  rationale: O grego apresenta uma expressão nominal sem verbo explícito. Os dois-pontos preservam a concisão e evitam acrescentar “haverá”, embora esse sentido esteja implícito no período maior.
theological_decisions:
- issue: Sentido de ἀδικία no contexto do juízo divino
  choice: injustiça
  alternative: iniquidade
  rationale: “Injustiça” preserva a ligação com o campo de justiça/retidão e é clara ao leitor moderno; “iniquidade” explicita melhor, para alguns leitores, a dimensão moral e teológica, mas tem registro mais tradicional. A alternativa é mantida em nota sem restringir indevidamente o termo.
- issue: Caráter da ira mencionada
  choice: manter “ira e indignação” sem explicitação do possuidor ou verbo
  alternative: “haverá ira e indignação” ou “a ira e a indignação de Deus”
  rationale: O contexto identifica o juízo como divino, mas o versículo grego conserva uma elipse verbal e não repete “de Deus”. A tradução não acrescenta essa explicitação, preservando a forma concisa e a tensão retórica do original.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e o paralelismo do grego foram preservados tanto quanto permite a naturalidade: desobedecer à verdade versus obedecer à injustiça. A elipse final foi mantida por meio dos dois-pontos.'
