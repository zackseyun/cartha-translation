  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: pt
  text: 'Você, portanto, que ensina outro, não ensina a si mesmo? Você que proclama: “Não roube”, rouba?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: portanto
  rationale: Mantém a força inferencial que liga a pergunta retórica ao argumento anterior.
- source_word: ὁ διδάσκων ἕτερον
  choice: você, ... que ensina outra pessoa
  rationale: Expressa naturalmente em português o particípio substantivado e preserva o objeto singular ἕτερον sem restringir seu gênero.
- source_word: σεαυτὸν οὐ διδάσκεις;
  choice: não ensina a si mesmo?
  rationale: Preserva o contraste reflexivo e a forma interrogativa de repreensão.
- source_word: ὁ κηρύσσων
  choice: você, que proclama
  rationale: Comunica anúncio público sem limitar o termo ao contexto eclesiástico que 'prega' pode sugerir.
- source_word: μὴ κλέπτειν
  choice: “Não roube”
  rationale: Apresenta de modo idiomático o conteúdo proclamado como proibição direta, mantendo sua força.
- source_word: κλέπτεις;
  choice: rouba?
  rationale: Conserva a pergunta retórica direta e incisiva do presente grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de 'você' conserva o paralelismo acusatório; 'outra pessoa' evita o caráter potencialmente marcado de 'outro' e mantém o singular do grego.
