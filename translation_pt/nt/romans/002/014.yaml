id: ROM.2.14
reference: Romans 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: pt
  text: Pois, sempre que gentios[a], que não têm a lei, fazem por natureza[b] as coisas da lei[c], eles, embora não tenham a lei, são lei para si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “povos não judeus”; literalmente, “nações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “instintivamente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “fazem o que a lei exige”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: gentios
  rationale: Neste contexto paulino, o contraste é com os judeus e com a lei mosaica; “gentios” comunica com clareza esse sentido étnico-religioso. A alternativa mais ampla, “nações”, é preservada em nota.
- source_word: νόμον / νόμου / νόμος
  choice: a lei / lei
  rationale: “A lei” indica a referência contextual à lei mosaica, enquanto “são lei para si mesmos” conserva o uso predicativo e metafórico de νόμος, bem como a repetição retórica do termo.
- source_word: φύσει
  choice: por natureza
  rationale: É uma tradução transparente que preserva a abertura interpretativa do grego, sem restringir o sentido a “instintivamente” ou a uma teoria específica sobre a origem do conhecimento moral.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: fazem as coisas da lei
  rationale: Mantém visível a formulação grega e sua relação verbal com as demais ocorrências de “lei”; a alternativa idiomática “fazem o que a lei exige” aparece em nota.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: são lei para si mesmos
  rationale: Expressa naturalmente o dativo ἑαυτοῖς e preserva a formulação metafórica, sem sugerir mais fortemente que o grego uma legislação moral autônoma.
theological_decisions:
- issue: Como interpretar φύσει em relação ao conhecimento moral e à consciência
  choice: Manter “por natureza” sem explicar no texto principal o mecanismo pelo qual os gentios praticam as coisas da lei.
  alternative: Traduzir de modo mais interpretativo como “instintivamente” ou “por seu senso natural”.
  rationale: φύσει, isoladamente, não determina se Paulo se refere a consciência moral inata, prática habitual ou condição natural. A tradução mantém essa tensão para que o argumento mais amplo determine o sentido.
- issue: O sentido de “são lei para si mesmos”
  choice: Conservar a metáfora paulina sem expandi-la.
  alternative: Parafrasear como “servem de lei para si mesmos” ou explicar que possuem internamente uma norma moral.
  rationale: Uma expansão poderia resolver indevidamente se os gentios funcionam como norma para si, evidenciam a ação da lei ou possuem conhecimento moral interior. A formulação concisa preserva a ambiguidade controlada do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sempre que” representa o valor iterativo de ὅταν; a repetição de “lei” preserva a continuidade lexical e a força retórica do grego.
