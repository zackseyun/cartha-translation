  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: pt
  text: Pois não há parcialidade da parte de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “favoritismo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão que fundamenta a afirmação anterior e preserva de modo natural, em português, a força explicativa da conjunção.
- source_word: προσωπολημψία
  choice: parcialidade
  rationale: Designa favorecimento baseado em condição social ou fatores externos. “Parcialidade” é atual, precisa e adequada ao contexto moral e judicial.
- source_word: παρὰ τῷ θεῷ
  choice: diante de Deus
  rationale: Neste contexto, παρά com o dativo descreve o que se verifica na presença ou no juízo de Deus. “Diante de Deus” comunica essa relação de modo idiomático sem transformar a construção em uma ação verbal.
- source_word: οὐ ... ἐστιν
  choice: não há
  rationale: Mantém a construção existencial grega de forma clara e natural em português.
theological_decisions:
- issue: Expressão da imparcialidade divina
  choice: “diante de Deus não há parcialidade”
  alternative: “Deus não age com parcialidade”
  rationale: A formulação escolhida conserva a estrutura existencial do grego e apresenta a imparcialidade como realidade própria da presença e do juízo de Deus, sem acrescentar uma ação verbal não explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Pois diante de Deus não há...” é natural e evita a formulação menos idiomática “não há parcialidade com Deus”.
