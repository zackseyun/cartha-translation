id: ROM.2.29
reference: Romans 2:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: pt
  text: Mas judeu é quem o é no íntimo, e a circuncisão é a do coração — pelo Espírito[a], não pela letra —; seu louvor não vem de seres humanos, mas de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em espírito», isto é, na realidade espiritual interior, e não segundo a letra escrita.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: no íntimo
  rationale: Expressa de modo natural a realidade interior ou oculta, em contraste com o que é exterior, sem sugerir apenas segredo.
- source_word: Ἰουδαῖος
  choice: judeu
  rationale: No contexto de Romanos 2, o termo tem sentido religioso e pactual, não meramente geográfico.
- source_word: περιτομὴ καρδίας
  choice: circuncisão é a do coração
  rationale: Preserva a metáfora paulina e deixa claro que se trata de circuncisão interior, não apenas física.
- source_word: ἐν πνεύματι
  choice: pelo Espírito
  rationale: A oposição paulina entre Espírito e letra favorece a referência ao Espírito Santo; a preposição 'por' comunica naturalmente o meio ou a agência.
- source_word: οὐ γράμματι
  choice: não pela letra
  rationale: Mantém o termo 'letra' e a conhecida tensão paulina entre Espírito e código escrito, sem expandir o texto.
- source_word: οὗ ὁ ἔπαινος
  choice: o louvor dessa pessoa
  rationale: Retoma com clareza e naturalidade a pessoa que é judeu no íntimo, evitando a possível rigidez ou ambiguidade de 'cujo louvor'.
- source_word: ἐξ ἀνθρώπων
  choice: de seres humanos
  rationale: Representa o plural genérico sem restringi-lo ao sexo masculino.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Deus
  rationale: Tradução direta e natural, sem expansão interpretativa.
theological_decisions:
- issue: Se πνεύματι se refere ao Espírito Santo ou ao espírito humano/realidade espiritual interior
  choice: Espírito Santo, traduzido como 'pelo Espírito'
  alternative: em espírito, isto é, na realidade espiritual interior
  rationale: A contraposição entre Espírito e letra no uso paulino favorece o Espírito Santo. A leitura alternativa permanece possível, mas não é necessário inserir nota porque a distinção pode ser reconhecida no próprio contexto e não há marcador exigido no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'No íntimo' comunica o contraste interior/exterior; 'dessa pessoa' esclarece o antecedente de οὗ sem linguagem excessivamente literal.
