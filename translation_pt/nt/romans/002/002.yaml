id: ROM.2.2
reference: Romans 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: pt
  text: Sabemos, porém, que o julgamento de Deus contra os que praticam tais coisas está de acordo com a verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a verdade”; isto é, o julgamento de Deus corresponde ao que é verdadeiro.
    reason: alternativa lexical
lexical_decisions:
- source_word: οἴδαμεν
  choice: sabemos
  rationale: O perfeito οἶδα tem sentido presente; “sabemos” é a tradução direta e natural.
- source_word: δέ
  choice: porém
  rationale: A partícula dá continuidade ao argumento com uma leve nuance de contraste; “porém”, em posição pós-verbal, conserva essa função sem torná-la excessivamente forte.
- source_word: κρίμα
  choice: julgamento
  rationale: O termo designa aqui o juízo judicial de Deus. “Julgamento” mantém o sentido amplo sem restringi-lo ao resultado condenatório ou apenas ao veredito.
- source_word: κατὰ ἀλήθειαν
  choice: de acordo com a verdade
  rationale: A expressão indica conformidade com a verdade ou com a realidade. Esta formulação é natural em português e preserva explicitamente o elemento “verdade”, sem reduzi-lo ao advérbio interpretativo “justamente”.
- source_word: ἐπὶ
  choice: contra
  rationale: No contexto de julgamento adverso dirigido a pessoas, “contra” expressa de modo idiomático a direção judicial.
- source_word: τὰ τοιαῦτα
  choice: tais coisas
  rationale: Equivalente conciso e natural para a expressão neutra plural que retoma as condutas mencionadas no contexto.
- source_word: πράσσοντας
  choice: os que praticam
  rationale: O particípio presente sugere conduta contínua ou característica; “praticam” comunica melhor essa ideia do que o simples “fazem”.
theological_decisions:
- issue: Se κατὰ ἀλήθειαν deve ser traduzido de modo interpretativo como “justamente” ou de forma mais transparente, preservando a referência explícita à verdade.
  choice: de acordo com a verdade
  alternative: justamente; segundo a verdade
  rationale: A formulação escolhida conserva a afirmação de que o julgamento divino corresponde à verdade ou à realidade, sem resolver a expressão em um mero advérbio de avaliação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi levemente ajustada para evitar uma construção pouco natural em português, sem alterar as relações sintáticas do grego.
