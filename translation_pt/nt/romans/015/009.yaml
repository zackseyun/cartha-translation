id: ROM.15.9
reference: Romans 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: pt
  text: 'e para que os gentios glorifiquem a Deus por sua misericórdia[a], como está escrito: “Por isso eu te louvarei entre os gentios e cantarei louvores ao teu nome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nações [...] entre as nações” (nas duas ocorrências de ἔθνη/ἔθνεσι). O argumento de Paulo aplica a citação especificamente aos gentios, mas a citação subjacente também tem o sentido mais amplo de “nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: gentios
  rationale: Em Romanos, o termo frequentemente designa os povos não judeus em contraste com os judeus; “gentios” comunica com clareza a aplicação do argumento de Paulo.
- source_word: ὑπὲρ ἐλέους
  choice: por sua misericórdia
  rationale: A preposição com o genitivo expressa aqui a razão ou base do louvor. O possessivo explicita naturalmente em português que a misericórdia é de Deus.
- source_word: δοξάσαι
  choice: para que ... glorifiquem
  rationale: O infinitivo depende sintaticamente do versículo anterior e tem força de propósito ou resultado; esta construção preserva a continuidade e soa natural em português.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente e digna para introduzir uma citação das Escrituras.
- source_word: ἐξομολογήσομαί
  choice: eu te louvarei
  rationale: Neste contexto, o verbo denota reconhecimento público, louvor ou ação de graças, não confissão de pecado; “louvarei” também corresponde ao paralelismo poético.
- source_word: ἐν ἔθνεσι
  choice: entre os gentios
  rationale: A preposição tem sentido locativo, “entre”. “Gentios” preserva a aplicação que Paulo faz da citação, embora “nações” reflita o alcance mais amplo do texto citado.
- source_word: ψαλῶ
  choice: cantarei louvores
  rationale: O verbo indica cantar em louvor a Deus; a formulação é natural e não restringe o sentido ao canto de salmos canônicos.
- source_word: τῷ ὀνόματί σου
  choice: ao teu nome
  rationale: Preserva o dativo e a expressão bíblica que associa o nome de Deus à sua identidade revelada.
theological_decisions:
- issue: Relação sintática e força da oração inicial
  choice: 'Traduzir como continuação do argumento do versículo anterior: “e para que os gentios glorifiquem...”'
  alternative: 'Uma tradução fragmentária mais formal: “e os gentios glorificarem a Deus por misericórdia”'
  rationale: O infinitivo grego depende do contexto anterior. A construção final em português torna essa dependência inteligível sem acrescentar uma conclusão doutrinária não expressa no texto.
- issue: Sentido de ἔθνη na afirmação e na citação
  choice: “gentios” nas duas ocorrências
  alternative: “nações” nas duas ocorrências, ou “gentios” na afirmação e “nações” na citação
  rationale: “Gentios” evidencia o contraste étnico-redentivo no argumento de Paulo. A nota preserva a amplitude lexical de “nações”, especialmente pertinente ao contexto original da citação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação “para que ... glorifiquem” mantém a ligação sintática com Romanos 15:8; “teu” conserva o tom direto e poético da citação.
