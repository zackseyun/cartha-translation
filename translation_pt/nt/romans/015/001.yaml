source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: pt
  text: Nós, os fortes, devemos suportar as fraquezas dos fracos[a] e não agradar a nós mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as limitações dos fracos” ou “as falhas dos fracos”. O termo grego pode indicar fraquezas, limitações ou falhas; neste contexto, provavelmente se refere aos escrúpulos ou às limitações de consciência tratados no capítulo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: devemos
  rationale: Expressa de modo natural a obrigação moral indicada pelo verbo, sem transformar a forma exortativa em uma ordem abrupta.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição leve; em português, o fluxo do contexto permite deixá-la implícita sem acrescentar um marcador temporal inexistente.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: Nós, que somos fortes
  rationale: Conserva a ênfase do pronome e identifica o grupo em contraste com os que não são fortes.
- source_word: τὰ ἀσθενήματα
  choice: as fraquezas
  rationale: Mantém a amplitude do termo, que pode abranger limitações, escrúpulos ou falhas, sem impor uma condenação moral.
- source_word: τῶν ἀδυνάτων
  choice: dos que não são fortes
  rationale: Reproduz a distinção lexical entre δυνατοί e ἀδύνατοι e evita sugerir necessariamente debilidade física ou inferioridade pessoal.
- source_word: βαστάζειν
  choice: carregar
  rationale: Preserva a imagem de levar um peso alheio, indo além da mera tolerância.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: e não agradar a nós mesmos
  rationale: Traduz diretamente o sentido reflexivo e mantém o contraste ético com carregar as fraquezas alheias.
theological_decisions:
- issue: Sentido dos “fortes” e dos “que não são fortes”
  choice: Referência principal a cristãos com diferentes graus de liberdade ou firmeza de consciência
  alternative: Pessoas social ou fisicamente fortes em contraste com pessoas fracas
  rationale: O contexto imediato de Romanos 14–15 trata de alimentos, dias e escrúpulos de consciência; a formulação, porém, não insere essa explicação interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Carregar” preserva a metáfora do original. A expressão “dos que não são fortes” é menos convencional que “dos fracos”, mas reflete com precisão o adjetivo grego privativo e evita rotular as pessoas além do contraste contextual.
