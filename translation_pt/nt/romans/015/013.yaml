  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: pt
  text: Que o Deus da esperança os encha de toda alegria e paz no crer, para que vocês transbordem de esperança pelo poder do Espírito Santo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Que o Deus da esperança
  rationale: A partícula δέ faz uma ligação leve com o contexto e não exige um marcador explícito em português. O genitivo descreve Deus em relação à esperança, preservado pela expressão natural e tradicional “Deus da esperança”.
- source_word: πληρώσαι ὑμᾶς
  choice: os encha
  rationale: O optativo aoristo expressa um desejo ou bênção; “Que ... os encha” reproduz naturalmente essa força e mantém a metáfora de plenitude.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: de toda alegria e paz
  rationale: Os genitivos indicam aquilo de que os destinatários são enchidos. “Toda” preserva o alcance abrangente de πάσης sem sugerir tipos enumeráveis de alegria.
- source_word: ἐν τῷ πιστεύειν
  choice: no crer
  rationale: A construção ἐν com infinitivo articular indica esfera ou circunstância. “No crer” conserva a forma verbal e a possível nuance de condição ou experiência, sem substituí-la pelo substantivo “fé”.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: para que vocês transbordem
  rationale: A construção εἰς τό com infinitivo pode indicar propósito ou resultado; “para que” mantém essa relação sem resolver rigidamente a distinção. “Transbordem” comunica de modo vivo e natural a abundância de περισσεύω.
- source_word: ἐν τῇ ἐλπίδι
  choice: de esperança
  rationale: Com “transbordar”, o português idiomático pede “de”. A escolha preserva a esperança como o conteúdo abundante e mantém a ligação lexical com “Deus da esperança”.
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: pelo poder do Espírito Santo
  rationale: Aqui ἐν pode ter força instrumental; “pelo poder” expressa claramente o meio pelo qual ocorre o transbordar. “Espírito Santo” é a forma corrente em português para o referente pessoal divino no contexto paulino.
theological_decisions:
- issue: Referente de πνεύματος ἁγίου
  choice: Espírito Santo
  alternative: espírito santo
  rationale: No contexto paulino, a expressão designa o Espírito divino. A capitalização identifica esse referente sem acrescentar uma formulação doutrinária que não esteja no versículo.
- issue: Relação expressa por εἰς τὸ περισσεύειν
  choice: para que vocês transbordem
  alternative: de modo que vocês transbordem
  rationale: A construção admite propósito ou resultado. “Para que” se ajusta à forma de bênção e conserva a orientação intencional, sem excluir que o transbordar seja também o resultado do enchimento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural ὑμᾶς e o clítico “os” como objeto direto, evitando regionalismos marcados. A repetição de “esperança” preserva deliberadamente o elo lexical do grego.
