id: ROM.15.30
reference: Romans 15:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: pt
  text: Eu lhes peço, irmãos[b], por nosso Senhor Jesus, o Messias[a], e pelo amor do Espírito[c], que lutem junto comigo em orações a Deus por mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo”. O grego Christós é um título que significa “Ungido” ou “Messias”.
    reason: alternative_reading
  - marker: b
    text: “Irmãos” está no masculino em grego, mas pode dirigir-se a toda a comunidade de fiéis, isto é, a irmãos e irmãs.
    reason: lexical_alternative
  - marker: c
    text: Também pode significar “o amor que vem do Espírito” ou “o amor produzido pelo Espírito”; o genitivo grego admite mais de uma interpretação.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Eu lhes peço
  rationale: Expressa um apelo sério e insistente em português corrente, sem o tom excessivamente autoritário que “ordeno” poderia sugerir.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como transição leve. Em português, o fluxo discursivo pode ser preservado sem introduzir “mas”, que sugeriria contraste mais forte, nem “agora”, que poderia parecer temporal.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego; uma nota esclarece que o termo pode abranger toda a comunidade de fiéis.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: por nosso Senhor Jesus, o Messias
  rationale: “Por” comunica a base ou mediação do apelo e mantém a repetição de διά de modo natural. Χριστός é vertido como o título “Messias”.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: amor do Espírito
  rationale: 'Mantém a construção genitiva e sua ambiguidade: pode ser o amor pertencente ao Espírito ou o amor produzido por ele.'
- source_word: συναγωνίσασθαί μοι
  choice: que lutem junto comigo
  rationale: Conserva tanto a ideia de esforço intenso quanto o sentido de participação conjunta expresso pelo prefixo συν-.
- source_word: ἐν ταῖς προσευχαῖς
  choice: em orações
  rationale: Preserva o plural e evita acrescentar um possessivo ausente do grego.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: a Deus por mim
  rationale: Apresenta com clareza tanto a direção das orações a Deus quanto a intercessão em favor de Paulo.
theological_decisions:
- issue: Referência de “Espírito” em “amor do Espírito”
  choice: Espírito Santo
  alternative: espírito humano ou espírito em sentido impessoal
  rationale: No uso paulino, a referência mais provável é ao Espírito Santo; a inicial maiúscula sinaliza essa leitura sem resolver a ambiguidade do genitivo.
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título de Jesus. “Messias” explicita seu sentido, enquanto a forma tradicional “Cristo” é preservada em nota.
- issue: Alcance de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal preserva o gênero gramatical da forma grega, e a nota informa seu provável alcance comunitário inclusivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada apenas o necessário para soar natural, preservando a repetição de “por”, o vigor de συναγωνίζομαι e a ambiguidade de “amor do Espírito”.
