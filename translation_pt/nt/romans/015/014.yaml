id: ROM.15.14
reference: Romans 15:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: pt
  text: Eu mesmo, meus irmãos[a], estou convencido a respeito de vocês de que vocês mesmos também estão cheios de bondade, repletos de todo o conhecimento e são capazes de instruir uns aos outros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o grego adelphoi, que pode ser usado para se dirigir coletivamente aos demais fiéis, incluindo tanto mulheres quanto homens.
    reason: lexical_alternative
  - marker: b
    text: Ou “admoestar uns aos outros” ou “advertir uns aos outros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: estou convencido
  rationale: O perfeito expressa um estado presente resultante de persuasão anterior; a formulação comunica a confiança firme de Paulo em português natural.
- source_word: δέ
  choice: não traduzido isoladamente
  rationale: Aqui a partícula marca uma transição leve. A continuidade é transmitida naturalmente pela abertura da frase, sem impor contraste forte com “mas” nem uma ligação artificial com “e”.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Mantém a forma masculina plural do vocativo grego e soa natural em português; uma nota esclarece que o tratamento coletivo pode abranger mulheres e homens.
- source_word: καὶ αὐτὸς ἐγώ
  choice: eu mesmo
  rationale: Preserva a ênfase pessoal da combinação pronominal sem sobrecarregar a frase.
- source_word: περὶ ὑμῶν
  choice: a respeito de vocês
  rationale: Equivalente claro e corrente de περί com genitivo, com ampla legibilidade internacional e brasileira.
- source_word: καὶ αὐτοί
  choice: vocês também
  rationale: “Também” conserva a força aditiva de καί, enquanto o pronome explícito contribui para a ênfase em que os próprios destinatários possuem essas qualidades.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: estão cheios de bondade
  rationale: Reproduz diretamente a imagem de plenitude e o sentido moral positivo de ἀγαθωσύνη.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: repletos de todo o conhecimento
  rationale: O particípio perfeito descreve um estado presente de plenitude; “todo o conhecimento” preserva o alcance amplo de πάσης γνώσεως sem o restringir interpretativamente.
- source_word: δυνάμενοι
  choice: são capazes
  rationale: Expressa de modo idiomático a capacidade decorrente das qualidades anteriormente mencionadas.
- source_word: ἀλλήλους νουθετεῖν
  choice: instruir uns aos outros
  rationale: “Instruir” comunica o aspecto formativo do verbo no contexto de elogio, enquanto a nota preserva suas possíveis nuances corretivas de admoestação e advertência.
theological_decisions:
- issue: Tratamento coletivo ἀδελφοί em uma comunidade mista
  choice: meus irmãos
  alternative: meus irmãos e minhas irmãs
  rationale: A tradução conserva a forma gramatical do grego, sem negar sua referência coletiva potencialmente inclusiva; essa amplitude é explicitada em nota.
- issue: Nuance de νουθετεῖν
  choice: instruir uns aos outros
  alternative: admoestar uns aos outros; advertir uns aos outros
  rationale: O verbo abrange instrução que pode ter caráter corretivo. No contexto elogioso, “instruir” funciona bem no texto principal, enquanto a nota evita apagar as nuances mais incisivas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural de segunda pessoa. A ordem inicial “Eu mesmo, meus irmãos” conserva a ênfase paulina sem tornar a sintaxe rígida. “Repletos” evita a repetição imediata de “cheios”, mantendo a imagem paralela de plenitude.
