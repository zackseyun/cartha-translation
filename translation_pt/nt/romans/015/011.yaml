id: ROM.15.11
reference: Romans 15:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: pt
  text: 'E novamente: “Louvem o Senhor[a], todas as nações[b], e todos os povos o louvem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o SENHOR”, refletindo a fonte hebraica da citação, na qual o nome divino é representado no grego por κύριος (“Senhor”).
    reason: alternative_reading
  - marker: b
    text: Ou “todos os gentios”. A palavra grega ἔθνη pode significar “nações” ou “gentios”; aqui, a citação tem sentido universal e também se harmoniza com o argumento de Paulo a respeito dos gentios.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: E novamente
  rationale: Introduz outra citação das Escrituras na sequência de Paulo e preserva tanto καί quanto πάλιν de modo natural em português.
- source_word: Αἰνεῖτε
  choice: Louvem
  rationale: Imperativo presente na segunda pessoa do plural; “Louvem” é direto, corrente e apropriado ao contexto de adoração.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: ἔθνη pode significar “nações” ou “gentios”. Aqui, “nações” preserva melhor o alcance universal da citação, sem eliminar a relação com o argumento de Paulo sobre os gentios.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz diretamente κύριος no texto grego. A forma “SENHOR”, correspondente ao nome divino na fonte hebraica da citação, é registrada em nota.
- source_word: ἐπαινεσάτωσαν
  choice: louvem
  rationale: O imperativo aoristo na terceira pessoa do plural é expresso naturalmente em português pelo presente do subjuntivo com valor exortativo.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma “o Senhor”; o pronome oblíquo evita repetição desnecessária e mantém a referência clara.
- source_word: πάντες οἱ λαοί
  choice: todos os povos
  rationale: Preserva a distinção lexical entre λαοί, “povos”, e ἔθνη, “nações”, bem como o paralelismo da citação.
theological_decisions:
- issue: Tradução de κύριος em uma citação do Antigo Testamento que se refere ao Deus de Israel
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego de Romanos traz κύριος, traduzido diretamente por “Senhor”. Como a fonte hebraica traz o nome divino, “SENHOR” é uma alternativa relevante e foi preservada em nota, sem substituir silenciosamente a forma do texto grego.
- issue: Tradução de ἔθνη no contexto do argumento de Paulo sobre judeus e gentios
  choice: todas as nações
  alternative: todos os gentios
  rationale: A citação convoca universalmente as nações ao louvor, e “nações” conserva esse sentido coletivo amplo. “Gentios” continua possível no contexto imediato de Romanos 15 e, por isso, aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Louvem” foi usado nas duas orações para manter a clareza e o paralelismo, enquanto “nações” e “povos” preservam a variação lexical do grego.
