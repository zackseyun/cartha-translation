base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: pt
  text: para que, pela vontade de Deus, eu chegue até vocês com alegria e descanse junto com vocês[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja revigorado juntamente com vocês” ou “encontre descanso junto com vocês”. O verbo grego transmite a ideia de descanso ou renovação compartilhados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a oração de propósito ligada ao pedido precedente, preservando a força final.
- source_word: ἐν χαρᾷ
  choice: com alegria
  rationale: Expressa de modo idiomático a circunstância ou maneira da chegada e mantém o substantivo 'alegria'.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: eu chegue até vocês
  rationale: Integra o particípio aoristo à oração de propósito de forma natural, sem perder a referência à chegada de Paulo aos destinatários.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Construção corrente e digna que representa διά com genitivo como meio ou conformidade com o querer divino.
- source_word: συναναπαύσωμαι
  choice: descanse junto com vocês
  rationale: Preserva a ideia de repouso ou alívio compartilhado indicada pelo prefixo συν-, com linguagem clara e natural.
theological_decisions:
- issue: Mutualidade da comunhão esperada por Paulo com os cristãos de Roma
  choice: descanse junto com vocês
  alternative: seja revigorado juntamente com vocês
  rationale: A tradução conserva a dimensão compartilhada do verbo sem transformar a reciprocidade lexical em uma afirmação teológica mais específica do que o texto permite.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência: o elemento ''pela vontade de Deus'' antecede a chegada, sem alterar seu vínculo semântico. ''Vocês'' oferece leitura natural e internacionalmente compreensível.'
