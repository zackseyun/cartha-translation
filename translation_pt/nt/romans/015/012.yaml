id: ROM.15.12
reference: Romans 15:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: pt
  text: 'E novamente Isaías diz: “Haverá a raiz de Jessé, e aquele que se levanta para governar as nações; nele as nações colocarão sua esperança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται
  choice: Haverá
  rationale: Reproduz o valor futuro e existencial de ἔσται sem acrescentar a ideia explícita de ‘vir’, ausente do texto grego.
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: a raiz de Jessé
  rationale: Mantém a metáfora profética e o nome tradicionalmente reconhecido em português.
- source_word: ὁ ἀνιστάμενος
  choice: aquele que se levanta
  rationale: Preserva a imagem participial de alguém que se ergue, sem restringi-la indevidamente à ressurreição ou ao mero aparecimento.
- source_word: ἄρχειν
  choice: para governar
  rationale: Expressa de modo natural o infinitivo de finalidade ligado à autoridade exercida sobre as nações.
- source_word: ἐθνῶν / ἔθνη
  choice: as nações
  rationale: O contexto da citação de Isaías favorece ‘nações’; evita a possível conotação religiosa ou pejorativa de ‘gentios’ e conserva a repetição grega.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: nele ... colocarão sua esperança
  rationale: Forma idiomática em português que mantém a pessoa como fundamento ou objeto da esperança futura.
theological_decisions:
- issue: Relação entre ‘a raiz de Jessé’ e ‘aquele que se levanta’
  choice: Tratá-los como duas expressões em aposição, separadas por vírgula
  alternative: 'Manter a coordenação estrita: ‘e aquele que se levanta’'
  rationale: No contexto, ambas as expressões descrevem a mesma figura messiânica. A aposição produz português natural sem inserir ‘isto é’ ou eliminar a tensão sintática da citação.
- issue: Possível sentido de ressurreição em ὁ ἀνιστάμενος
  choice: ‘aquele que se levanta’
  alternative: ‘aquele que ressuscita’
  rationale: Embora o verbo possa ser usado em contextos de ressurreição, aqui o infinitivo ‘para governar’ favorece a imagem de levantar-se ou surgir para exercer domínio; a tradução não deve impor uma leitura mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e preservação da metáfora profética. ‘Nações’ foi repetido, como no grego, e não foram necessários marcadores ou notas de rodapé.
