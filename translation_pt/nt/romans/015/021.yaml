id: ROM.15.21
reference: Romans 15:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: pt
  text: 'mas, como está escrito: “Aqueles a quem nada foi anunciado a respeito dele verão[a], e os que não ouviram entenderão”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo cita Isaías 52:15. No contexto de Isaías, o pronome “dele” se refere à figura do servo; aqui, Paulo aplica a passagem à sua proclamação do evangelho.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste com a declaração anterior de Paulo sobre seu propósito ministerial; “mas” é o adversativo natural em português.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente de citação bíblica; expressa de modo idiomático o perfeito passivo grego.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Aqueles a quem nada foi anunciado a respeito dele
  rationale: Mantém o dativo relativo e a estrutura passiva da citação, incluindo a possível amplitude de “nada foi anunciado”, sem substituir o pronome por uma identificação interpretativa.
- source_word: ὄψονται
  choice: verão
  rationale: Preserva o sentido direto do futuro de ὁράω e o paralelismo com “entenderão”, sem antecipar a interpretação cognitiva do verbo.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: os que não ouviram
  rationale: Forma natural em português para o perfeito grego, descrevendo os que permanecem sem ter ouvido a mensagem.
- source_word: συνήσουσιν
  choice: entenderão
  rationale: Equivalente claro e direto do futuro de συνίημι, preservando a promessa profética.
theological_decisions:
- issue: Referente de αὐτοῦ na citação de Isaías
  choice: Manter “dele” no texto principal.
  alternative: Explicitar “do Messias” ou “de Cristo”.
  rationale: O grego traz um pronome, não um título. Mantê-lo conserva a textura da citação e evita introduzir no texto principal uma identificação interpretativa, embora o contexto de Romanos o relacione à proclamação do evangelho.
translation_notes:
  register: Português moderno, claro e digno, com formulação amplamente compreensível no Brasil e em outros contextos lusófonos. A ordem da citação foi mantida próxima do grego sem sacrificar a naturalidade.
