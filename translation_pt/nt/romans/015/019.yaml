id: ROM.15.19
reference: Romans 15:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: pt
  text: pelo poder de sinais e prodígios, pelo poder do Espírito, de modo que, desde Jerusalém e arredores até a Ilíria, tenho anunciado plenamente o evangelho do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho levado a proclamação do evangelho do Messias à sua plena realização”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: pelo poder de
  rationale: A expressão repetida indica meio ou agência; “pelo poder de” é natural em português e mantém a ênfase na atuação eficaz.
- source_word: σημείων καὶ τεράτων
  choice: sinais e prodígios
  rationale: Preserva a dupla bíblica convencional para atos extraordinários que atestam a ação divina.
- source_word: πνεύματος
  choice: do Espírito
  rationale: O contexto paulino aponta naturalmente para o Espírito Santo; a forma breve não acrescenta “Santo”, ausente no texto grego.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: desde Jerusalém e por toda a região ao redor
  rationale: κύκλῳ tem valor adverbial e descreve amplamente as regiões circundantes; a formulação evita sugerir apenas um trajeto circular.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: até a Ilíria
  rationale: μέχρι marca o limite geográfico. “Ilíria” é a forma portuguesa corrente para a região chamada Illyricum em latim.
- source_word: πεπληρωκέναι
  choice: proclamei plenamente
  rationale: No contexto missionário, o perfeito de πληρόω com “evangelho” indica levar sua proclamação à plena extensão na área mencionada; esta opção é mais idiomática que “cumpri o evangelho” e conserva a noção de plenitude.
- source_word: τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: o evangelho do Messias
  rationale: “Evangelho” é conciso e reconhecível; Χριστός conserva aqui força titular e, por isso, é traduzido como “Messias”.
theological_decisions:
- issue: Referente de πνεύματος
  choice: o Espírito, entendido como o Espírito Santo
  alternative: espírito em sentido geral; ou “Espírito Santo” explicitamente
  rationale: Os sinais, prodígios e a capacitação do ministério apostólico favorecem fortemente a referência ao Espírito Santo, mas a tradução não acrescenta o adjetivo ausente no grego.
- issue: Sentido de πεπληρωκέναι τὸ εὐαγγέλιον
  choice: proclamei plenamente o evangelho
  alternative: levei o evangelho a toda parte; cumpri o evangelho
  rationale: A construção expressa que Paulo levou a proclamação do evangelho à sua plena extensão na faixa geográfica indicada. “Proclamei plenamente” comunica esse sentido sem dar a entender que ele esgotou todo o conteúdo ou alcançou cada indivíduo.
- issue: Valor do genitivo τοῦ Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: O genitivo pode indicar o evangelho acerca do Messias e/ou pertencente a ele; a formulação portuguesa preserva essa amplitude sem explicá-la em excesso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem geográfica foi pontuada para clareza, e a ambiguidade do genitivo “do Messias” foi preservada.
