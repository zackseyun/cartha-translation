revisions:
- from: Pois afirmo que o Messias se tornou servo dos circuncidados em favor da verdade de Deus[a], a fim de confirmar as promessas feitas aos patriarcas,
  to: Pois digo que o Messias se tornou servo a serviço dos circuncidados em favor da verdade de Deus[a], a fim de confirmar as promessas feitas aos patriarcas,
  rationale: A revisão substitui “afirmo” por “digo” para refletir λέγω com menor carga interpretativa e reformula a relação de διάκονον περιτομῆς como “servo a serviço dos circuncidados”, que evita uma ambiguidade de posse em português e conserva o referente coletivo de περιτομή. Mantêm-se as demais escolhas, inclusive a nota, por refletirem de modo equilibrado as possibilidades de ἀλήθεια θεοῦ.
