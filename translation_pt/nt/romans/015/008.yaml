    rationale: Embora próximo da forma genitiva, em português pode ser entendido como servo pertencente aos circuncidados. No contexto, διάκονον περιτομῆς indica serviço em relação ao povo circuncidado; “a serviço dos circuncidados” é mais clara e fiel ao sentido.
