  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: pt
  text: Pois digo que o Messias se tornou servo a serviço dos circuncidados em favor da verdade de Deus[a], a fim de confirmar as promessas feitas aos patriarcas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor da veracidade de Deus”, destacando a fidelidade de Deus em cumprir as promessas de sua aliança.
    reason: Alternativa lexical para ἀλήθεια θεοῦ; no contexto, “veracidade” pode salientar a fidelidade de Deus às promessas, sem eliminar o sentido mais amplo de “verdade” no texto principal.
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Pois afirmo
  rationale: γάρ introduz uma explicação ligada ao contexto anterior; “Pois” conserva essa relação. “Afirmo” expressa λέγω com naturalidade e dignidade no discurso argumentativo de Paulo.
- source_word: Χριστόν
  choice: o Messias
  rationale: Aqui Χριστός funciona como título, especialmente no argumento sobre Israel, a circuncisão e as promessas patriarcais.
- source_word: διάκονον
  choice: servo
  rationale: Designa alguém que serve, sem indicar necessariamente o ofício eclesiástico posterior de diácono.
- source_word: γεγενῆσθαι
  choice: se tornou
  rationale: O infinitivo perfeito de γίνομαι apresenta um estado resultante; “se tornou” é a forma mais natural em português neste contexto.
- source_word: περιτομῆς
  choice: dos circuncidados
  rationale: O genitivo designa coletivamente o povo circuncidado, isto é, os judeus. A construção com “servo dos” preserva a relação genitiva e é idiomática em português.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: em favor da verdade de Deus
  rationale: ὑπέρ indica benefício ou propósito. “Verdade de Deus” mantém a amplitude de ἀλήθεια θεοῦ, enquanto a nota registra a nuance contextual de veracidade e fidelidade.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: a fim de confirmar
  rationale: A construção indica finalidade, e βεβαιόω significa tornar firme ou confirmar.
- source_word: τὰς ἐπαγγελίας
  choice: as promessas
  rationale: Equivalente direto e corrente para ἐπαγγελίαι no contexto das promessas da aliança.
- source_word: τῶν πατέρων
  choice: feitas aos patriarcas
  rationale: O genitivo indica as promessas associadas aos antepassados de Israel; “feitas aos patriarcas” explicita naturalmente em português o sentido contextual sem ampliar a referência a todos os antepassados.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O termo tem força titular neste contexto histórico-salvífico, centrado em Israel, na circuncisão e nas promessas aos patriarcas.
- issue: Nuance de ἀλήθεια θεοῦ
  choice: a verdade de Deus
  alternative: a veracidade de Deus / a fidelidade de Deus
  rationale: A expressão pode indicar a verdade de Deus de modo amplo ou sua veracidade e fidelidade no cumprimento das promessas. O texto principal preserva a formulação ampla, e a nota mantém a nuance da fidelidade à aliança.
- issue: Referente de περιτομῆς
  choice: os circuncidados
  alternative: a circuncisão
  rationale: A expressão refere-se coletivamente ao povo judeu, não meramente ao rito; a tradução torna o referente humano claro sem substituir diretamente o termo por “judeus”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Pois afirmo” mantém o nexo argumentativo; “servo dos circuncidados” evita tanto linguagem excessivamente eclesiástica quanto uma paráfrase denominacional. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
