id: ROM.15.3
reference: Romans 15:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: pt
  text: 'Pois nem mesmo o Messias agradou a si próprio[a]; pelo contrário, como está escrito: “Os insultos dos que te insultam caíram sobre mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois nem mesmo
  rationale: “Pois” mantém a ligação explicativa com a exortação anterior, e “nem mesmo” dá ênfase ao Messias como o exemplo maior no contexto da oração negativa.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: O artigo e a função exemplar favorecem a leitura de Χριστός como título. “Messias” comunica esse valor em português; “Cristo” permanece como alternativa tradicional em nota.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: não agradou a si próprio
  rationale: Mantém de perto o verbo “agradar” e o pronome reflexivo, sem ampliar a expressão para “não buscou o próprio prazer” ou “não viveu para agradar a si mesmo”.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: pelo contrário, como está escrito
  rationale: “Pelo contrário” expressa naturalmente o contraste forte introduzido por ἀλλά, enquanto “como está escrito” preserva a fórmula usual de citação das Escrituras.
- source_word: ὀνειδισμοί
  choice: insultos
  rationale: No contexto do salmo citado, o termo designa afrontas verbais que também trazem desonra. “Insultos” é claro e atual, sem perder a força do original.
- source_word: τῶν ὀνειδιζόντων σε
  choice: dos que te insultavam
  rationale: A construção participial torna-se natural em português e preserva a repetição cognata entre o substantivo e o verbo.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: caíram sobre mim
  rationale: É uma correspondência direta e idiomática para a imagem do aoristo ἐπέπεσαν com ἐπί.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Aqui Χριστός funciona plausivelmente como título na apresentação de Jesus como exemplo representativo. A alternativa tradicional é indicada sem resolver além do necessário a relação entre título e designação consolidada.
- issue: Identidade da voz na citação bíblica
  choice: A citação é mantida na primeira pessoa, sem identificar explicitamente o “mim” dentro do texto citado.
  alternative: Explicitar que o “mim” se refere ao Messias
  rationale: Paulo aplica a passagem ao Messias, mas a forma da citação não nomeia seu falante. Preservar sua redação mantém a tensão e evita inserir interpretação explicativa no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A si próprio” evita ambiguidade e mantém a construção compacta; “insultos” é mais corrente do que “opróbrios” ou “vitupérios”. O paralelismo lexical da citação foi preservado com “insultos... insultavam”.
