id: ROM.15.33
reference: Romans 15:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: pt
  text: Que o Deus da paz esteja com todos vocês. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ tem força conectiva ou transicional leve. Em português, a bênção conclusiva flui naturalmente sem um marcador explícito; “agora” acrescentaria uma ideia temporal ausente do termo grego.
- source_word: θεὸς τῆς εἰρήνης
  choice: o Deus da paz
  rationale: Preserva de modo direto o título paulino e a construção genitiva do grego.
- source_word: εἰρήνης
  choice: paz
  rationale: É o equivalente natural de εἰρήνη e mantém sua amplitude de paz, integridade e bem-estar reconciliado sem explicitação indevida.
- source_word: μετὰ πάντων ὑμῶν
  choice: esteja com todos vocês
  rationale: A forma verbal “esteja” é suprida para exprimir em português a função beneditória da oração sem verbo explícito; “todos vocês” conserva a abrangência de πάντων ὑμῶν.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a conclusão litúrgica tradicional, natural e solene em português.
theological_decisions:
- issue: Se a oração sem verbo deve ser entendida como afirmação indicativa ou como desejo beneditório
  choice: Que o Deus da paz esteja com todos vocês.
  alternative: O Deus da paz está com todos vocês.
  rationale: Embora o grego não tenha verbo expresso, a fórmula no encerramento epistolar funciona naturalmente como oração-desejo ou bênção. A construção portuguesa com “Que ... esteja” comunica essa função sem transformar o texto em uma afirmação indicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação é concisa e preserva o caráter solene de uma bênção final.
