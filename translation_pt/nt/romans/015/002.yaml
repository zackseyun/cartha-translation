  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: pt
  text: Cada um de nós agrade ao próximo para o bem dele, a fim de edificá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o que é bom, com vistas à edificação”. “Edificar” traduz uma metáfora que significa fortalecer ou fazer crescer outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: Cada um de nós
  rationale: Reproduz naturalmente o singular distributivo com o genitivo partitivo e mantém a exortação individual dirigida a toda a comunidade.
- source_word: τῷ πλησίον
  choice: ao próximo
  rationale: Expressa o sentido ético de πλησίον como a outra pessoa com quem se tem relação e corresponde ao uso bíblico corrente em português.
- source_word: ἀρεσκέτω
  choice: agrade
  rationale: O presente imperativo na terceira pessoa é vertido por uma forma exortativa direta; no português atual, o contexto e as expressões de finalidade deixam claro que não se trata de bajulação.
- source_word: εἰς τὸ ἀγαθὸν
  choice: para o bem dele
  rationale: Torna explícita a finalidade benéfica da ação sem reduzir τὸ ἀγαθόν a mera satisfação pessoal.
- source_word: πρὸς οἰκοδομήν
  choice: a fim de edificá-lo
  rationale: Preserva a metáfora de construção aplicada ao fortalecimento da pessoa, em formulação natural e dignificada em português.
theological_decisions:
- issue: Alcance ético de agradar ao próximo
  choice: A ordem é qualificada pelo bem do próximo e por sua edificação.
  alternative: Entender a frase como acomodação irrestrita aos desejos alheios.
  rationale: As duas expressões de finalidade no grego restringem o sentido de ἀρέσκω ao que beneficia e fortalece o próximo, sem transformar a busca de aprovação em valor absoluto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o imperativo, a finalidade benéfica e a metáfora de edificação, evitando tanto linguagem excessivamente eclesiástica quanto uma paráfrase que elimine a concisão do original.
