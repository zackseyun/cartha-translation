reference: Romans 15:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: pt
  text: Portanto, acolham uns aos outros, assim como o Messias[a] também acolheu vocês, para a glória de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Portanto
  rationale: Marca a conclusão decorrente da argumentação anterior e preserva claramente a ligação lógica.
- source_word: προσλαμβάνεσθε
  choice: acolham
  rationale: O imperativo exprime recepção mútua e relacional; “acolham” comunica mais naturalmente esse sentido comunitário do que uma aceitação meramente mental.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Forma recíproca natural em português, preservando a mutualidade.
- source_word: καθὼς καὶ
  choice: assim como também
  rationale: Mantém tanto a comparação introduzida por καθὼς quanto a força aditiva de καί.
- source_word: ὁ Χριστὸς
  choice: o Messias
  rationale: O artigo favorece aqui o valor titular de Χριστός; “Messias” torna explícito esse título em português.
- source_word: προσελάβετο
  choice: acolheu
  rationale: Repete o mesmo verbo empregado na ordem inicial, preservando o paralelo deliberado entre a ação dos fiéis e a do Messias.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa de modo claro e amplamente inteligível o objeto plural de segunda pessoa.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: para a glória de Deus
  rationale: “Para” preserva a possível ideia de finalidade ou resultado de εἰς sem decidir de forma indevida entre essas nuances.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, o termo tem força titular. “Messias” conserva seu conteúdo judaico e não acrescenta uma interpretação cristológica sectária.
- issue: Nuance comunitária de προσλαμβάνομαι
  choice: acolham uns aos outros
  alternative: aceitem uns aos outros / recebam uns aos outros
  rationale: “Acolham” expressa recepção ativa na comunidade, sem reduzir a ordem a mera tolerância nem importar uma doutrina específica.
- issue: Relação de εἰς δόξαν τοῦ θεοῦ com a oração
  choice: para a glória de Deus
  alternative: resultando na glória de Deus
  rationale: A formulação portuguesa conserva a abertura entre finalidade e resultado presente na construção grega.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. A repetição de “acolham/acolheu” reproduz o vínculo retórico do grego. O pronome “vocês” torna explícito o plural de ὑμᾶς.
