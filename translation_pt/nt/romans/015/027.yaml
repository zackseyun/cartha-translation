id: ROM.15.27
reference: Romans 15:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: pt
  text: Pois tiveram prazer em fazer isso, e são devedores para com eles. Porque, se os gentios[a] participaram das coisas espirituais deles[b], também têm a obrigação de servi-los com bens materiais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nações”. Aqui, o termo se refere aos não judeus.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos bens espirituais deles” ou “das bênçãos espirituais deles”. O grego diz literalmente “das coisas espirituais deles”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “nas coisas carnais”; aqui, a expressão indica sustento material ou corporal, em contraste com as coisas espirituais.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: tiveram prazer em fazer isso
  rationale: Expressa a aprovação voluntária e a satisfação indicadas pelo aoristo de εὐδοκέω; “fazer isso” retoma naturalmente a contribuição mencionada no versículo anterior.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: são devedores a eles
  rationale: Preserva a imagem explícita de dívida e a obrigação moral afirmada por Paulo, em português claro.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Neste contexto paulino, designa os não judeus em contraste com os judeus, especialmente os fiéis de Jerusalém.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: das coisas espirituais deles
  rationale: Mantém o adjetivo substantivado e a amplitude do grego, sem acrescentar explicitamente “bênçãos” ou “bens”.
- source_word: ἐκοινώνησαν
  choice: participaram
  rationale: Comunica participação e comunhão em algo recebido, adequando-se à construção com o dativo.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: com bens materiais
  rationale: Traduz contextualmente a referência ao sustento físico e econômico, em contraste com as coisas espirituais, evitando a possível leitura ética de “carnais”.
- source_word: λειτουργῆσαι
  choice: servi-los
  rationale: Conserva a ideia de prestar serviço em favor de outros; no contexto, esse serviço se concretiza na ajuda material, sem sugerir que se trate de uma função clerical.
theological_decisions:
- issue: Sentido de σαρκικοῖς em contraste com πνευματικοῖς
  choice: bens materiais
  alternative: coisas carnais
  rationale: A coleta para os santos de Jerusalém determina o sentido material ou corporal do termo, e não o sentido moral de pecaminosidade.
- issue: Referente de αὐτῶν / αὐτοῖς
  choice: os fiéis judeus de Jerusalém mencionados no contexto imediato
  alternative: Israel em sentido mais amplo
  rationale: Romanos 15:25–26 trata diretamente dos santos de Jerusalém. O argumento tem um horizonte histórico ligado a Israel, mas os pronomes apontam mais imediatamente para os destinatários da coleta.
- issue: Natureza da obrigação expressa por ὀφείλουσιν
  choice: obrigação moral de prestar ajuda material
  alternative: mera reciprocidade voluntária sem obrigação
  rationale: A linguagem de dívida e dever é explícita no texto, embora o mesmo ato também seja descrito como realizado de bom grado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém tanto a disposição voluntária (“tiveram prazer”) quanto a obrigação moral (“são devedores”; “têm a obrigação”), sem dissolver essa tensão. Os marcadores de todas as notas aparecem junto aos termos correspondentes no texto.
