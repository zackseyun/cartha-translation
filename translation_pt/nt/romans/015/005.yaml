    issue: 'Construção pouco natural: «conceda a vocês terem».'
    rationale: Embora compreensível, a sequência com dativo explícito seguido de infinitivo flexionado é pesada no português contemporâneo. Uma oração completiva com «conceda-lhes que tenham» preserva plenamente a força do desejo-oracão e melhora a legibilidade.
  - severity: low
    issue: «A mesma maneira de pensar uns para com os outros» é excessivamente longa.
    rationale: «O mesmo modo de pensar entre si» é mais idiomático e mantém tanto a ideia de mentalidade comum quanto sua esfera recíproca.
