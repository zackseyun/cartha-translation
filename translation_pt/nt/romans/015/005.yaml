id: ROM.15.5
reference: Romans 15:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: pt
  text: Que o Deus da perseverança e do encorajamento lhes conceda que tenham o mesmo modo de pensar entre si[a], de acordo com o Messias Jesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tenham a mesma mente» ou «sejam concordes entre si».
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «segundo o Messias Jesus». A expressão apresenta o Messias Jesus como padrão ou norma.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Que o Deus
  rationale: A construção com δῴη é uma oração-desejo, expressa naturalmente em português por «Que ... conceda». O δέ tem leve força conectiva no contexto e não exige uma conjunção explícita neste versículo.
- source_word: τῆς ὑπομονῆς
  choice: da perseverança
  rationale: ὑπομονή denota constância resistente sob pressão. «Perseverança» é natural em português e comunica mais claramente esse sentido do que a simples paciência.
- source_word: τῆς παρακλήσεως
  choice: do encorajamento
  rationale: παράκλησις pode significar encorajamento, consolo ou exortação. No contexto imediato, descreve o fortalecimento recebido por meio das Escrituras, e «encorajamento» preserva bem essa amplitude.
- source_word: δῴη
  choice: conceda
  rationale: O optativo aoristo de δίδωμι integra uma fórmula de oração ou desejo; «Que ... conceda» preserva essa força e mantém um registro digno e atual.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: terem a mesma maneira de pensar
  rationale: A expressão se refere a mentalidade, perspectiva ou disposição compartilhada. Esta formulação é clara e relativamente próxima do grego sem impor uniformidade absoluta em todos os assuntos.
- source_word: ἐν ἀλλήλοις
  choice: uns para com os outros
  rationale: A expressão indica a dimensão relacional e recíproca dessa mentalidade. «Uns para com os outros» preserva a possível orientação mútua, embora «entre vocês» também seja possível.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: de acordo com o Messias Jesus
  rationale: κατά apresenta o Messias Jesus como padrão ou norma. «De acordo com» conserva essa relação, e «Messias» traduz o valor titular de Χριστός.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Χριστός conserva aqui seu sentido de título, «Messias». Traduzir o título torna seu significado acessível sem tratá-lo como mero sobrenome.
- issue: Sentido de τὸ αὐτὸ φρονεῖν
  choice: terem a mesma maneira de pensar
  alternative: serem concordes; terem a mesma mente
  rationale: A tradução mantém a ideia de uma mentalidade comum sem resolver a expressão como exigência de identidade de opinião em toda questão.
- issue: Relação expressa por κατὰ Χριστὸν Ἰησοῦν
  choice: de acordo com o Messias Jesus
  alternative: segundo o Messias Jesus
  rationale: A formulação preserva a possibilidade de Jesus ser o padrão dessa disposição comum, sem explicitar além do que o texto diz se a referência é ao exemplo, ao ensino ou à vontade dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A oração-desejo é preservada por «Que ... conceda»; evitou-se inserir um marcador temporal inexistente no grego. A vírgula final acompanha a continuidade sintática com o versículo seguinte.
