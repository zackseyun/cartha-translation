  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: pt
  text: Mas agora, não tendo mais espaço nestas regiões[a], mas desejando há muitos anos ir até vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “campo” ou “oportunidade nestas regiões”. A expressão grega pode indicar que já não restava ali campo de atuação para seu trabalho, e não simplesmente que faltava um lugar físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Expressa de modo natural a transição marcada pelo advérbio temporal νυνί e pela conjunção δέ.
- source_word: μηκέτι
  choice: não tendo mais
  rationale: A construção indica que uma situação anterior deixou de existir; em português, “não... mais” comunica essa cessação com clareza.
- source_word: τόπον ἔχων
  choice: tendo ... espaço
  rationale: “Espaço” conserva a imagem de τόπος e permite o sentido contextual de campo ou oportunidade restante para o trabalho de Paulo, sem reduzi-lo a uma localização física.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: nestas regiões
  rationale: κλίμασι designa áreas geográficas; “regiões” é atual, claro e adequado ao contexto.
- source_word: ἐπιποθίαν ... ἔχων
  choice: desejando
  rationale: O verbo em português comunica de forma natural o forte desejo expresso pelo substantivo ἐπιποθία, sem tornar a frase excessivamente pesada.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: ir até vocês
  rationale: Traduz diretamente o conteúdo do desejo. “Ir até vocês” é natural da perspectiva do remetente e não acrescenta a ideia específica de visita.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: há muitos anos
  rationale: É a expressão idiomática portuguesa para uma situação iniciada muitos anos antes e ainda vigente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo é uma oração sintaticamente incompleta que continua no contexto seguinte. A repetição de “mas” preserva os dois usos de δέ e o contraste entre a ausência de espaço restante e o desejo persistente de ir aos destinatários.
