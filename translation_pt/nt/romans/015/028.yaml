id: ROM.15.28
reference: Romans 15:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: pt
  text: Portanto, depois de concluir essa tarefa e entregar-lhes com segurança esse fruto,[a][b] partirei para a Espanha, passando por vocês.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “selar-lhes esse fruto”. A expressão pode indicar que Paulo entregaria formalmente e com segurança a contribuição aos destinatários, ou que certificaria sua entrega.
    reason: lexical_alternative
  - marker: b
    text: “Esse fruto” é a contribuição financeira recolhida entre os cristãos gentios para os santos em Jerusalém.
    reason: cultural_note
  - marker: c
    text: Ou “por meio de vocês”. Paulo provavelmente quer dizer que planeja passar por Roma a caminho da Espanha, possivelmente contando também com o auxílio dos cristãos romanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: essa tarefa
  rationale: O demonstrativo retoma a tarefa anteriormente mencionada de levar a contribuição a Jerusalém; explicitar “tarefa” torna a referência natural sem acrescentar conteúdo estranho ao contexto.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a conexão lógica e a transição decorrente da explicação anterior.
- source_word: ἐπιτελέσας
  choice: depois de concluir
  rationale: O particípio aoristo indica uma ação concluída antes do verbo principal futuro; a construção temporal portuguesa expressa claramente essa anterioridade.
- source_word: σφραγισάμενος
  choice: entregar-lhes com segurança
  rationale: Embora o sentido básico seja “selar”, neste contexto a expressão provavelmente descreve a entrega formalmente assegurada da contribuição aos destinatários. A nota registra a imagem literal e sua possível nuance de certificação.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: O pronome dativo se refere aos santos de Jerusalém, destinatários da contribuição.
- source_word: τὸν καρπὸν τοῦτον
  choice: esse fruto
  rationale: Mantém a metáfora paulina para o resultado concreto da generosidade dos cristãos gentios.
- source_word: ἀπελεύσομαι
  choice: partirei
  rationale: Expressa de modo natural o futuro movimento de Paulo rumo ao destino seguinte.
- source_word: δι’ ὑμῶν
  choice: passando por vocês
  rationale: διά com genitivo indica aqui o trajeto por Roma; esta formulação preserva o sentido espacial sem afirmar mais do que o texto.
- source_word: εἰς Σπανίαν
  choice: para a Espanha
  rationale: Tradução portuguesa idiomática da expressão direcional que indica o destino.
theological_decisions:
- issue: Sentido de σφραγισάμενος no contexto da contribuição para Jerusalém
  choice: entregar-lhes com segurança
  alternative: selar-lhes esse fruto; certificar-lhes esse fruto
  rationale: O verbo conserva uma imagem de selar ou certificar, mas seu uso neste contexto parece indicar que Paulo concluiria a entrega formal e segura da oferta. A tradução principal comunica a ação provável, enquanto a nota preserva a metáfora e a ambiguidade lexical.
- issue: Referência de “esse fruto”
  choice: manter a metáfora no texto
  alternative: essa contribuição; essa oferta
  rationale: “Fruto” representa o resultado concreto da generosidade dos gentios e preserva a linguagem figurada de Paulo; a nota identifica o referente contextual sem substituir a metáfora.
- issue: Alcance de δι’ ὑμῶν
  choice: passando por vocês
  alternative: por meio de vocês
  rationale: O contexto favorece o itinerário por Roma, embora a preposição possa também sugerir alguma participação ou auxílio dos destinatários. A formulação principal não exclui essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações foi ajustada ao uso natural do português. A tradução comunica no texto o provável valor contextual de σφραγίζω, mas preserva em nota sua imagem literal e a incerteza interpretativa; mantém “fruto” para conservar a metáfora paulina.
