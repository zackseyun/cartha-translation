  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: pt
  text: quando eu for à Espanha[a] — pois espero, ao passar por aí, vê-los e ser ajudado por vocês a seguir viagem até lá[b], se antes eu puder desfrutar, em parte, da companhia de vocês[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sempre que eu for à Espanha”. A construção grega se refere a uma ocasião futura ainda indefinida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ser encaminhado por vocês até lá”. O verbo pode incluir auxílio, provisões ou acompanhamento na continuação da viagem.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ser cheio, em parte, de vocês”. A expressão provavelmente se refere a desfrutar da convivência com eles por um tempo limitado, embora o grego não especifique exatamente em que sentido seria “em parte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: quando eu for
  rationale: A construção com ἄν e o subjuntivo aponta para uma ocasião futura ainda indefinida. “Quando eu for” é natural em português e conserva a orientação futura sem sugerir viagens repetidas.
- source_word: Σπανίαν
  choice: Espanha
  rationale: É a forma geográfica consagrada em português.
- source_word: ἐλπίζω γὰρ
  choice: pois espero
  rationale: “Pois” conserva o valor explicativo de γάρ, e “espero” expressa a expectativa acompanhada de desejo indicada por ἐλπίζω.
- source_word: διαπορευόμενος
  choice: ao passar por aí
  rationale: O particípio descreve a passagem por Roma a caminho de outro destino. “Por aí” torna explícita, de modo idiomático, a referência ao lugar dos destinatários.
- source_word: θεάσασθαι ὑμᾶς
  choice: vê-los
  rationale: Expressa naturalmente o encontro pessoal pretendido no contexto da viagem, sem a formalidade de “contemplá-los” nem a explicitação interpretativa de “visitá-los”.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: ser encaminhado por vocês até lá
  rationale: προπέμπω pode envolver ajuda prática, provisões ou acompanhamento para a etapa seguinte. “Ser encaminhado” preserva a ideia geral de receber apoio para prosseguir, sem especificar sua forma.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: se ... eu puder desfrutar
  rationale: “Se” mantém a condição futura de ἐάν com o subjuntivo. “Puder desfrutar” comunica com naturalidade a satisfação relacional sugerida pela metáfora de ser cheio, cuja forma literal é registrada em nota.
- source_word: πρῶτον
  choice: antes
  rationale: No contexto, πρῶτον marca a prioridade temporal da convivência com os romanos antes da continuação da viagem.
- source_word: ἀπὸ μέρους
  choice: em parte
  rationale: Mantém de perto a expressão grega e deixa em aberto se a limitação diz respeito à duração da visita ou ao grau de satisfação possível.
- source_word: ὑμῶν
  choice: da companhia de vocês
  rationale: O genitivo ligado a ἐμπλησθῶ tem sentido relacional. “Da companhia de vocês” explicita esse sentido de modo idiomático, adequado ao encontro pessoal previsto.
theological_decisions:
- issue: Natureza do apoio esperado dos cristãos de Roma
  choice: ser encaminhado por vocês até lá
  alternative: ser ajudado por vocês a prosseguir viagem até lá; ser acompanhado por vocês até lá
  rationale: O verbo pode abranger acompanhamento ou auxílio material, mas o texto não define a forma de apoio. A tradução conserva a generalidade e não impõe um modelo específico de sustento missionário.
- issue: Sentido da satisfação esperada na convivência com os romanos
  choice: desfrutar, em parte, da companhia de vocês
  alternative: ser satisfeito, em parte, por vocês; ficar, em parte, saciado da companhia de vocês
  rationale: O contexto indica satisfação ou prazer relacional, mas não determina se ἀπὸ μέρους limita a duração da convivência ou a plenitude da satisfação. O texto principal busca naturalidade, enquanto a nota preserva a metáfora e a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” para o plural dos destinatários. A ordem da frase acompanha a progressão do grego, e os travessões preservam o caráter parentético e a continuidade sintática com o contexto. Evitou-se tanto o literalismo pouco natural de “ser cheio de vocês” quanto uma especificação indevida da ajuda prestada na viagem.
