id: ROM.15.22
reference: Romans 15:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: pt
  text: Por isso, também fui muitas vezes impedido de ir até vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “frequentemente” ou “repetidas vezes”; a expressão grega τὰ πολλὰ indica repetição frequente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do argumento anterior e preserva a ligação lógica.
- source_word: καὶ
  choice: também
  rationale: Mantém a força aditiva, ligando a situação pessoal de Paulo ao que acaba de dizer.
- source_word: ἐνεκοπτόμην
  choice: fui muitas vezes impedido
  rationale: O imperfeito indica impedimento repetido no passado; a forma passiva evita especificar um agente que o grego não identifica.
- source_word: τὰ πολλὰ
  choice: muitas vezes
  rationale: A expressão funciona adverbialmente e, neste contexto, comunica repetição frequente; esta formulação é clara e próxima da estrutura grega.
- source_word: τοῦ ἐλθεῖν
  choice: de ir
  rationale: Depois de um verbo de impedimento, o infinitivo articulado indica a ação impedida. Em português, 'impedido de ir' é natural; 'ir' também se ajusta à perspectiva de Paulo em relação aos destinatários.
- source_word: πρὸς ὑμᾶς
  choice: até vocês
  rationale: Indica movimento em direção aos cristãos de Roma; 'até vocês' é corrente e evita a repetição menos natural de 'ir a vocês'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a conexão argumentativa, a repetição expressa pelo imperfeito e pelo idioma grego, e não identifica a causa ou o agente do impedimento.
