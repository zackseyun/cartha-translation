id: ROM.15.6
reference: Romans 15:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: pt
  text: para que, em plena harmonia e com uma só boca[a], vocês glorifiquem o Deus e Pai de nosso Senhor Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «a uma só voz». O grego diz literalmente «com uma só boca», ressaltando a unidade do louvor.
    reason: lexical_alternative
  - marker: b
    text: 'Forma tradicional: «Jesus Cristo». O título grego Χριστός significa «Messias».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado da exortação anterior e mantém de modo natural a força télica do grego.
- source_word: ὁμοθυμαδόν
  choice: em plena harmonia
  rationale: Expressa unidade de disposição e propósito sem repetir a imagem de fala unificada presente na expressão seguinte.
- source_word: ἐν ἑνὶ στόματι
  choice: com uma só boca
  rationale: Preserva a metáfora corporal vívida do grego; a alternativa idiomática «a uma só voz» é registrada em nota.
- source_word: δοξάζητε
  choice: vocês glorifiquem
  rationale: O presente do subjuntivo dependente de ἵνα é representado naturalmente pelo presente do subjuntivo português, com sujeito plural explícito para clareza.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: o Deus e Pai
  rationale: Mantém a estreita ligação entre os dois substantivos sob um único artigo, sem resolver excessivamente a relação sintática.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: Conserva o título κύριος e o possessivo plural de forma direta e corrente.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa a aposição idiomática em português, em vez de tratar «Messias» como sobrenome.
theological_decisions:
- issue: Tradução de Χριστοῦ na sequência Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός conserva aqui seu conteúdo titular, identificando Jesus como o Messias. A forma tradicional «Cristo» permanece indicada em nota, sem apagar o sentido do título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» torna explícito o sujeito plural; «em plena harmonia» comunica a unidade de disposição, enquanto «com uma só boca» preserva a imagem concreta do original.
