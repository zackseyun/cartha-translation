id: ROM.15.10
reference: Romans 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: pt
  text: 'E novamente diz: “Alegrem-se, gentios[a], com o seu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nações”.
    reason: Alternativa lexical para ἔθνη, preservando seu sentido mais amplo e a formulação possível da citação veterotestamentária.
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Em uma fórmula de citação, indica a introdução de outra passagem das Escrituras; “novamente” é natural e mantém a conexão com as citações anteriores.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente da fórmula de citação e não explicita o sujeito, que também está implícito no grego.
- source_word: Εὐφράνθητε
  choice: Alegrem-se
  rationale: Expressa de modo claro e atual a força imperativa do verbo, sem perder o tom digno da exortação.
- source_word: ἔθνη
  choice: gentios
  rationale: No argumento de Romanos 15, refere-se especialmente aos povos não judeus que se unem ao povo de Deus em louvor; a alternativa lexical “nações” é preservada em nota.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: com o seu povo
  rationale: Traduz diretamente a ideia de associação expressa por μετά com o genitivo e preserva a referência pactual de λαός sem acrescentar “Israel” ao texto.
theological_decisions:
- issue: Sentido de ἔθνη na citação sobre a união entre judeus e não judeus
  choice: gentios
  alternative: nações
  rationale: “Gentios” comunica com mais precisão o ponto contextual de Paulo sobre a participação dos não judeus no louvor ao lado do povo de Deus. “Nações” continua sendo uma tradução possível, especialmente à luz da fonte veterotestamentária, e por isso aparece em nota.
- issue: Identidade de “seu povo”
  choice: manter “o seu povo” sem explicitação
  alternative: “o povo de Israel”
  rationale: Embora o referente contextual e veterotestamentário seja Israel, o grego diz apenas “seu povo”. Explicitar Israel no texto principal resolveria interpretativamente algo que a formulação original deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “E diz novamente” conserva a fórmula breve de citação e o sujeito implícito do grego; “Alegrem-se” evita tanto arcaísmo quanto coloquialismo excessivo.
