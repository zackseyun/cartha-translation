  source_fidelity: 'O texto representa adequadamente os dois propósitos coordenados por ἵνα: o livramento de Paulo dos ἀπειθοῦντες na Judeia e a recepção favorável de seu serviço relacionado a Jerusalém. «Seja livrado», «desobedientes», «bem recebido» e «pelos santos» refletem de modo fiel as construções e os termos gregos, sem acrescentar interpretação doutrinária.'
  naturalness: A redação é clara, idiomática e de registro digno em português moderno. A repetição de «para que» deixa explícita a coordenação dos dois objetivos. «Bem recebido pelos santos» é particularmente natural para εὐπρόσδεκτος τοῖς ἁγίοις. A vírgula final é apropriada, pois o enunciado continua no versículo seguinte.
  terminology: «Santos» conserva de forma consistente a designação paulina τοῖς ἁγίοις. «Desobedientes» preserva a amplitude de ἀπειθούντων, e a nota registra de modo útil a alternativa contextual ligada à incredulidade. «Serviço em favor de Jerusalém» é uma formulação idiomática que comunica a orientação do serviço sem indevidamente o institucionalizar.
