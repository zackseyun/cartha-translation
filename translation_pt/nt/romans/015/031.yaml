id: ROM.15.31
reference: Romans 15:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: pt
  text: para que eu seja livrado dos desobedientes na Judeia[a] e para que o meu serviço em favor de Jerusalém seja bem recebido pelos santos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos que não creem na Judeia». O particípio grego pode indicar os que se recusam a crer e, assim, desobedecem.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que ... e para que
  rationale: Introduz os dois objetivos coordenados do pedido de oração de Paulo; a repetição torna a relação sintática clara e natural em português.
- source_word: ῥυσθῶ
  choice: eu seja livrado
  rationale: O aoristo passivo do subjuntivo de ῥύομαι expressa ser retirado de perigo. «Seja livrado» é corrente, digno e preserva a voz passiva.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: dos desobedientes
  rationale: ἀπειθέω pode indicar desobediência, recusa em crer ou resistência à persuasão. A escolha principal preserva a dimensão volitiva, enquanto a alternativa contextual é registrada em nota.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: na Judeia
  rationale: Forma geográfica padrão e amplamente compreensível em português.
- source_word: διακονία
  choice: serviço
  rationale: Mantém o sentido amplo de serviço prestado, aqui relacionado à missão prática de Paulo em benefício de Jerusalém, sem institucionalizar o termo como «ministério» nem explicitar demais como «ajuda».
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: em favor de Jerusalém
  rationale: Expressa de modo idiomático a direção e o benefício do serviço. Evita que «serviço a Jerusalém» soe como serviço dirigido à cidade em si.
- source_word: εὐπρόσδεκτος
  choice: bem recebido
  rationale: Comunica naturalmente a ideia de recepção favorável ou acolhimento, adequada ao contexto da contribuição levada por Paulo.
- source_word: τοῖς ἁγίοις
  choice: pelos santos
  rationale: Preserva a designação paulina tradicional para os fiéis e corresponde ao dativo que indica por quem o serviço seria recebido.
- source_word: γένηται
  choice: seja bem recebido
  rationale: Embora γίνομαι possa salientar o vir a ser, nesta combinação com εὐπρόσδεκτος o português idiomático expressa melhor o resultado esperado com «seja bem recebido».
theological_decisions:
- issue: Sentido de ἀπειθούντων aplicado aos opositores de Paulo na Judeia
  choice: desobedientes
  alternative: os que não creem
  rationale: O particípio pode reunir as ideias de não crer e desobedecer. O texto principal mantém a dimensão de recusa/desobediência sem restringi-la a uma condição meramente intelectual; a nota conserva a leitura contextual comum ligada à incredulidade.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. «Bem recebido» é mais natural que «aceitável» neste contexto concreto; «santos» conserva a terminologia paulina. A vírgula final foi mantida porque o versículo integra a frase iniciada no versículo anterior e concluída no seguinte.
