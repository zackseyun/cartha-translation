  source_fidelity: A tradução reproduz com precisão a abrangência de ὅσα («tudo o que»), a anterioridade de προεγράφη («foi escrito anteriormente»), a repetição enfática de «foi escrito», a finalidade de ἵνα e o subjuntivo de ἔχωμεν. «Por meio da perseverança e do encorajamento das Escrituras» mantém os dois meios introduzidos por διά e não resolve indevidamente o alcance interpretativo do genitivo «das Escrituras».
