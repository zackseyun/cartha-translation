id: ROM.15.4
reference: Romans 15:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: pt
  text: Pois tudo o que foi escrito anteriormente foi escrito para a nossa instrução, a fim de que, por meio da perseverança e do encorajamento das Escrituras[a], tenhamos esperança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do consolo das Escrituras”; παράκλησις pode significar encorajamento, consolo ou exortação.
    reason: lexical_alternative
  - marker: b
    text: Ou “possamos ter esperança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: tudo o que
  rationale: Expressa de modo natural e abrangente o relativo neutro plural, preservando seu alcance geral.
- source_word: προεγράφη
  choice: foi escrito anteriormente
  rationale: Mantém o sentido temporal do prefixo προ- e evita outros sentidos possíveis do verbo, como exposição pública.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: para a nossa instrução
  rationale: Comunica a finalidade formativa da escrita anterior; “instrução” é natural e adequado a διδασκαλία no contexto.
- source_word: ἐγράφη
  choice: foi escrito
  rationale: Preserva a repetição retórica do verbo presente no grego.
- source_word: ἵνα
  choice: a fim de que
  rationale: Marca claramente a relação de finalidade sem tornar a frase artificial.
- source_word: διὰ τῆς ὑπομονῆς
  choice: por meio da perseverança
  rationale: “Perseverança” comunica constância paciente diante de dificuldades e se combina naturalmente com a esperança.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: do encorajamento das Escrituras
  rationale: “Encorajamento” conserva a ideia de fortalecimento presente em παράκλησις sem restringi-la apenas a consolo ou exortação; a relação genitiva com as Escrituras é mantida.
- source_word: τῶν γραφῶν
  choice: das Escrituras
  rationale: No uso paulino e neste contexto, refere-se aos escritos sagrados; a inicial maiúscula sinaliza esse referente reconhecido.
- source_word: τὴν ἐλπίδα
  choice: esperança
  rationale: A omissão do artigo é idiomática em português com o substantivo abstrato e não elimina o conteúdo do grego.
- source_word: ἔχωμεν
  choice: tenhamos
  rationale: O presente do subjuntivo depois de ἵνα é reproduzido naturalmente pela construção portuguesa “a fim de que... tenhamos”.
theological_decisions:
- issue: Relação entre perseverança, encorajamento e as Escrituras na produção da esperança
  choice: Manter “das Escrituras” ligado diretamente a “encorajamento”, seguindo a sequência sintática grega, sem explicar além do texto como a perseverança se relaciona com elas.
  alternative: Traduzir de modo interpretativo como “pela perseverança e pelo encorajamento que as Escrituras proporcionam”, fazendo as Escrituras regerem ambos os substantivos.
  rationale: O grego liga explicitamente o genitivo τῶν γραφῶν a παρακλήσεως, embora o contexto permita entender que a leitura das Escrituras também sustenta a perseverança. A redação escolhida preserva essa abertura interpretativa.
- issue: Força do subjuntivo ἔχωμεν após ἵνα
  choice: 'Traduzir como finalidade: “a fim de que... tenhamos esperança”.'
  alternative: “Para que possamos ter esperança”, ressaltando possibilidade ou capacidade.
  rationale: A construção grega expressa finalidade sem exigir uma nuance adicional de mera possibilidade; a forma escolhida evita introduzir incerteza teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Tudo o que” evita rigidez; “anteriormente” preserva a referência temporal; “perseverança” e “encorajamento” mantêm o paralelismo e o tom pastoral. Os marcadores aparecem no texto na ordem [a], [b].
