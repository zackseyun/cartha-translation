id: ROM.15.18
reference: Romans 15:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: pt
  text: Pois não ousarei falar de coisa alguma, a não ser daquilo que o Messias realizou por meu intermédio, para levar os gentios[a] à obediência, por palavra e ação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as nações”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem “falar de coisa alguma”.
    reason: textual_variant
lexical_decisions:
- source_word: τολμήσω
  choice: ousarei
  rationale: O futuro do indicativo com οὐ expressa a determinação de Paulo de não se atrever a ultrapassar esse limite; “não ousarei” preserva tanto o tempo verbal quanto a ideia de ousadia.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: falar de coisa alguma, a não ser daquilo que
  rationale: 'A formulação explicita em português o valor restritivo da construção: Paulo só falará do que o Messias realizou por meio dele.'
- source_word: κατειργάσατο
  choice: realizou
  rationale: O verbo indica produzir efetivamente ou levar algo a efeito. “Realizou” é natural e mantém o Messias como agente principal.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Neste contexto, Χριστός pode ser entendido como título. “O Messias” comunica esse sentido de modo claro e natural em português.
- source_word: δι’ ἐμοῦ
  choice: por meu intermédio
  rationale: 'διά com o genitivo marca mediação ou instrumentalidade: o Messias é quem age, e Paulo é o instrumento.'
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: para levar os gentios à obediência
  rationale: A formulação dinâmica torna clara a finalidade ou o resultado visado sem definir mais precisamente a natureza dessa obediência. “Gentios” se ajusta ao contraste paulino entre judeus e não judeus em Romanos.
- source_word: λόγῳ καὶ ἔργῳ
  choice: por palavra e ação
  rationale: Os dativos provavelmente indicam os meios pelos quais a obra foi realizada; a expressão preserva o contraste entre proclamação e atos.
theological_decisions:
- issue: Sentido de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A tradução principal conserva o valor titular de Χριστός, sem negar que “Cristo” também seja uma tradução tradicional e possível.
- issue: Sentido de ἐθνῶν
  choice: gentios
  alternative: nações
  rationale: No argumento de Romanos, o termo normalmente designa os povos não judeus. A alternativa “nações” preserva seu sentido lexical mais amplo.
- issue: Agente da missão de Paulo
  choice: o Messias realizou por meu intermédio
  alternative: o Messias realizou através de mim
  rationale: 'A redação mantém a tensão teológica do texto: a atividade pertence ao Messias, embora seja efetuada mediante Paulo.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem foi ajustada com vírgulas para tornar clara a relação entre a obra do Messias, a obediência dos gentios e os meios empregados.
