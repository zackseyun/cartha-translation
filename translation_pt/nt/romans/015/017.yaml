id: ROM.15.17
reference: Romans 15:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: pt
  text: Portanto, tenho motivo para me gloriar[a] no Messias Jesus[b] nas coisas que dizem respeito a Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tenho do que me gloriar” ou “tenho fundamento para me gloriar”.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “em Cristo Jesus”; aqui, Χριστός é traduzido como o título “Messias”. Forma tradicional: “em Cristo Jesus”.'
    reason: alternative_reading
  - marker: c
    text: Ou “nos assuntos relacionados com Deus” ou “quanto às coisas de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: tenho
  rationale: O presente do indicativo na primeira pessoa é vertido diretamente, preservando a afirmação pessoal de Paulo.
- source_word: οὖν
  choice: Portanto
  rationale: Assinala a inferência em relação ao argumento anterior e mantém clara a conexão lógica.
- source_word: καύχησιν
  choice: motivo para me gloriar
  rationale: O substantivo pode indicar tanto o ato de gloriar-se quanto a razão ou fundamento para isso. A formulação escolhida expressa de modo idiomático o sentido provável no contexto sem converter a declaração em orgulho autônomo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém ἐν como expressão de esfera ou união, não meramente de instrumento, e traduz Χριστός como o título “Messias” junto ao nome Jesus.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nas coisas que dizem respeito a Deus
  rationale: Preserva a amplitude do idioma grego, que pode abranger assuntos, serviço ou ministério relacionados com Deus, sem restringi-lo a uma única categoria.
- source_word: θεόν
  choice: Deus
  rationale: Equivalente padrão e adequado neste contexto.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός permanece semanticamente ativo como título. “Messias” traduz o título, enquanto “Cristo” é mantido em nota como forma tradicional.
- issue: Sentido da καύχησις de Paulo
  choice: Uma razão legítima para gloriar-se, delimitada pela união com o Messias Jesus e pelas coisas referentes a Deus
  alternative: Confiança pessoal genérica ou simples júbilo subjetivo
  rationale: As expressões “no Messias Jesus” e “nas coisas que dizem respeito a Deus” limitam a declaração, mas a tradução preserva a linguagem de gloriar-se em vez de eliminar sua tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção mantém a lógica de “Portanto”, conserva a linguagem paulina de gloriar-se e evita estreitar τὰ πρὸς τὸν θεόν exclusivamente ao culto ou ao ministério sacerdotal.
