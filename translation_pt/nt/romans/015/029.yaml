  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: pt
  text: E sei que, quando eu estiver com vocês, irei na plenitude da bênção do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da bênção de Cristo”.'
    reason: Tradução alternativa de Χριστοῦ.
lexical_decisions:
- source_word: οἶδα
  choice: sei
  rationale: Expressa diretamente o conhecimento e a certeza de Paulo, sem enfraquecer sua afirmação.
- source_word: δὲ
  choice: E
  rationale: Funciona aqui como conectivo leve que dá continuidade ao discurso, sem exigir contraste forte.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: quando eu for até vocês
  rationale: Explicita de modo natural em português o valor temporal do particípio em relação ao verbo futuro.
- source_word: ἐλεύσομαι
  choice: irei
  rationale: Traduz diretamente o futuro de ἔρχομαι e evita uma construção portuguesa excessivamente pesada, embora preserve a repetição conceitual do movimento até os destinatários.
- source_word: ἐν πληρώματι
  choice: na plenitude
  rationale: Mantém a imagem de totalidade ou abundância expressa por πλήρωμα e o valor circunstancial de ἐν.
- source_word: εὐλογίας
  choice: da bênção
  rationale: Apresenta a bênção como aquilo de que há plenitude, em formulação natural e fiel ao genitivo grego.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título, preservando seu sentido messiânico neste contexto.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: A opção principal torna explícito o valor titular de Χριστός; a forma tradicional «Cristo» permanece registrada em nota por ser lexicalmente possível e amplamente reconhecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Vocês» evita regionalismos mais marcados; «na plenitude da bênção» conserva a metáfora e a densidade teológica do grego.
