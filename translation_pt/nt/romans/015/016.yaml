  terminology: «Cristo Jesus», «gentios», «evangelho de Deus», «oferta», «aceitável», «santificada» e «Espírito Santo» são escolhas consistentes e inteligíveis. A formulação revista mantém a metáfora sacerdotal sem sugerir um ofício eclesiástico posterior.
