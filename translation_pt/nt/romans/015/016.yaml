  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: pt
  text: para eu ser ministro de Cristo Jesus para os gentios[a], ministrando sacerdotalmente o evangelho de Deus[b], a fim de que a oferta dos gentios[c] se torne aceitável, santificada pelo Espírito Santo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “servindo como sacerdote” ou “desempenhando serviço sacerdotal”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, provavelmente os próprios gentios apresentados a Deus como oferta; outra possibilidade é “a oferta feita pelos gentios”.
    reason: alternative_reading
  - marker: d
    text: Ou “no Espírito Santo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: ministro
  rationale: O termo designa alguém que presta serviço público ou religioso. “Ministro” preserva a ideia de serviço e se harmoniza com a metáfora sacerdotal explícita no restante da frase.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Cristo Jesus
  rationale: Em português, “Cristo” é a forma corrente e inteligível do título grego Χριστός, equivalente a “Messias”; a ordem do texto grego foi preservada.
- source_word: εἰς τὰ ἔθνη
  choice: entre os gentios
  rationale: No contexto da missão de Paulo, ἔθνη se refere aos povos não judeus. “Entre os gentios” expressa naturalmente o campo de seu ministério, enquanto “às nações” permanece como alternativa em nota.
- source_word: ἱερουργοῦντα
  choice: exercendo serviço sacerdotal
  rationale: O verbo contém imagem especificamente cultual e sacerdotal. Esta formulação preserva a metáfora sem atribuir a Paulo, além do que o texto diz, um cargo sacerdotal formal.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: no evangelho de Deus
  rationale: “Evangelho de Deus” conserva a expressão paulina e seu registro teológico habitual. A preposição “no” liga esse serviço sacerdotal à esfera e atividade do evangelho sem acrescentar um objeto sacrificial distinto.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: a oferta dos gentios
  rationale: A formulação mantém a estrutura genitiva e a ambiguidade do grego. No contexto, provavelmente os próprios gentios constituem a oferta, mas também é gramaticalmente possível entender uma oferta apresentada por eles.
- source_word: εὐπρόσδεκτος
  choice: aceitável
  rationale: É uma forma natural em português para uma oferta favoravelmente recebida por Deus e preserva o contexto sacrificial.
- source_word: ἡγιασμένη
  choice: santificada
  rationale: O particípio perfeito passivo indica uma oferta que se encontra em estado de santidade como resultado da ação santificadora. “Santificada” mantém o vínculo lexical com a linguagem de santidade.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: pelo Espírito Santo
  rationale: A construção ἐν pode indicar aqui o meio ou agente da santificação. A leitura alternativa, “no Espírito Santo”, é preservada em nota.
theological_decisions:
- issue: A autodescrição de Paulo em linguagem sacerdotal
  choice: Paulo descreve metaforicamente seu ministério apostólico entre os gentios como serviço sacerdotal ligado ao evangelho.
  alternative: Entender a frase como afirmação de um ofício sacerdotal formal, ou eliminar a imagem cultual e traduzi-la apenas como serviço geral.
  rationale: A combinação de λειτουργός, ἱερουργέω e προσφορά exige que a imagem sacerdotal seja mantida. Ao mesmo tempo, o texto apresenta o ministério do evangelho e os gentios como oferta, sem descrever um sacrifício expiatório realizado por Paulo nem definir estruturas eclesiásticas posteriores.
- issue: O referente de “a oferta dos gentios”
  choice: A expressão provavelmente apresenta os próprios gentios como a oferta a Deus resultante do ministério de Paulo.
  alternative: Uma oferta feita ou apresentada pelos gentios.
  rationale: A missão de Paulo e a sequência da metáfora sacerdotal favorecem a primeira interpretação, mas o genitivo grego admite ambas; por isso, a tradução principal conserva a ambiguidade e a nota explica as possibilidades.
- issue: O sentido de ἐν na santificação pelo Espírito Santo
  choice: 'Entender ἐν em sentido instrumental: a oferta é santificada pelo Espírito Santo.'
  alternative: 'Entender ἐν em sentido locativo ou esférico: a oferta é santificada no Espírito Santo.'
  rationale: O sentido instrumental se ajusta naturalmente à ação santificadora, mas a construção grega não exclui o sentido de esfera; a alternativa é registrada sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva a cadeia de imagens cultuais do grego — ministro, serviço sacerdotal, oferta, aceitável e santificada — sem se tornar excessivamente técnica. “Gentios” mantém o contraste histórico entre judeus e não judeus; “nações” aparece em nota. A estrutura foi mantida como fragmento finalístico (“para que eu fosse”), de acordo com a sintaxe do versículo fornecido e sua ligação com o contexto anterior.
