  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: pt
  text: Mas escrevi a vocês com mais ousadia, em parte[a], como quem lhes relembra, por causa da graça que me foi dada por Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escrevi a vocês com maior ousadia sobre alguns pontos”. A expressão pode indicar que Paulo escreveu com mais ousadia ou que escreveu ousadamente a respeito de certos assuntos.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “a graça que me foi dada por Deus” refere-se à missão e à capacitação que Deus concedeu a Paulo para seu ministério, e não apenas à graça em sentido geral.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: com um pouco mais de ousadia
  rationale: O comparativo adverbial indica maior ousadia; a formulação é natural em português e mantém a nuance comparativa sem tornar o tom excessivamente forte.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao elogio anterior.
- source_word: ἔγραψα
  choice: escrevi
  rationale: O aoristo epistolar refere-se ao ato de escrever a carta; o pretérito perfeito é claro e idiomático em português.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa naturalmente o objeto indireto e oferece ampla legibilidade, especialmente brasileira.
- source_word: ἀπὸ μέρους
  choice: em parte
  rationale: Preserva a formulação concisa e a ambiguidade entre o grau ou alcance da escrita e determinados assuntos tratados.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: como quem os faz lembrar novamente
  rationale: A construção mantém o valor explicativo do particípio e representa o elemento reiterativo do verbo composto ἐπαναμιμνῄσκω.
- source_word: διὰ τὴν χάριν
  choice: por causa da graça
  rationale: διά com acusativo indica causa ou fundamento; “graça” conserva o vocabulário paulino sem restringir no texto seu sentido contextual.
- source_word: τὴν δοθεῖσάν μοι
  choice: que me foi dada
  rationale: Reproduz com clareza o particípio aoristo passivo que modifica “graça”.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: ὑπό com genitivo identifica Deus como agente da dádiva.
theological_decisions:
- issue: Sentido de χάρις no contexto
  choice: Manter “graça” no texto, entendendo-a contextualmente como a graça que inclui a comissão e capacitação ministerial de Paulo.
  alternative: Traduzir de modo explícito como “missão” ou “encargo”.
  rationale: Os versículos 15–16 associam a graça recebida ao ministério de Paulo entre os gentios, mas o termo grego continua sendo amplo; preservá-lo evita reduzir a riqueza teológica da expressão.
- issue: Valor reiterativo de ἐπαναμιμνῄσκω
  choice: “faz lembrar novamente”
  alternative: “faz lembrar”
  rationale: Embora em português o ato de lembrar já possa implicar informação conhecida, o composto grego comporta valor reiterativo; explicitá-lo conserva essa nuance sem alterar o sentido central.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A vocês” evita regionalismo excessivo; “como quem os faz lembrar novamente” conserva a nuance do grego, embora permaneça um pouco mais formal. As vírgulas acompanham a estrutura argumentativa sem obscurecer a ambiguidade de ἀπὸ μέρους.
