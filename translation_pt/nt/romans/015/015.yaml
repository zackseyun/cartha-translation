  naturalness: “Como quem os faz lembrar novamente” é compreensível, mas soa mais pesado e menos idiomático do que “como quem lhes relembra”. A revisão mantém um português moderno, claro e de leitura ampla.
  terminology: “Graça” deve permanecer no texto, pois conserva o termo paulino χάρις sem reduzir seu sentido a “missão” ou “encargo”. A nota pode explicar sua relação contextual com o ministério de Paulo, sem fazer dessa explicação uma substituição textual.
