id: ROM.15.25
reference: Romans 15:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: pt
  text: Mas agora vou a Jerusalém para servir aos santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para prestar serviço aos santos” ou “levando ajuda aos santos”. O contexto indica que Paulo se refere à entrega da coleta destinada aos cristãos necessitados de Jerusalém (ver 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: νυνί destaca o tempo presente, enquanto δέ introduz uma transição levemente contrastiva; “Mas agora” expressa ambos com naturalidade.
- source_word: πορεύομαι
  choice: vou
  rationale: O presente indica o deslocamento pretendido ou já em curso. “Vou” é direto e idiomático em português.
- source_word: εἰς Ἰερουσαλὴμ
  choice: a Jerusalém
  rationale: εἰς indica destino. A construção “ir a Jerusalém” é natural e mantém a ideia de movimento em direção à cidade.
- source_word: διακονῶν
  choice: para servir
  rationale: O particípio expressa aqui a finalidade ou circunstância da viagem. “Para servir” comunica claramente a finalidade sem atribuir ao verbo um sentido de cargo eclesiástico; no contexto, o serviço envolve levar ajuda material.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Na linguagem paulina, a expressão designa os que pertencem a Deus, isto é, os cristãos. “Santos” preserva de modo conciso o termo do texto grego.
theological_decisions:
- issue: Referente de “os santos”
  choice: Manter “os santos” no texto, entendendo-os no contexto como os cristãos de Jerusalém, especialmente os necessitados.
  alternative: Explicitar no texto “o povo de Deus em Jerusalém” ou “os cristãos de Jerusalém”.
  rationale: A formulação preserva o termo paulino e não introduz na frase informação que só o contexto imediato torna explícita.
- issue: Natureza do serviço de Paulo
  choice: Traduzir de forma ampla como “servir”, esclarecendo em nota que provavelmente se trata de levar a coleta.
  alternative: Traduzir diretamente “levar ajuda”.
  rationale: διακονῶν tem sentido mais amplo que a entrega de auxílio, embora Romanos 15:26 mostre que essa é a aplicação concreta neste contexto. A tradução conserva a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Santos” conserva a terminologia paulina; “servir” evita o possível tom institucional de “ministrar” e mantém o sentido prático do verbo.
