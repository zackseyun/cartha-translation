id: ROM.15.20
reference: Romans 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: pt
  text: E assim faço questão de anunciar as boas-novas, não onde o Messias já havia sido anunciado[a], para não construir sobre o alicerce de outra pessoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nomeado”. Aqui, a expressão indica que o Messias já havia sido dado a conhecer ou proclamado naquele lugar.
    reason: literal_rendering
  - marker: b
    text: Literalmente, “sobre alicerce alheio”; trata-se de uma metáfora para o trabalho ministerial iniciado por outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: E assim
  rationale: Mantém a conexão com a descrição anterior do ministério de Paulo; δέ tem aqui força conectiva leve, e οὕτως aponta para a maneira ou estratégia mencionada.
- source_word: φιλοτιμούμενον
  choice: faço questão
  rationale: Expressa aspiração empenhada e propósito pessoal em português corrente, sem transformar a estratégia de Paulo em mandamento universal.
- source_word: εὐαγγελίζεσθαι
  choice: anunciar as boas-novas
  rationale: Preserva o sentido verbal de proclamar a mensagem, em linguagem acessível e digna.
- source_word: οὐχ ὅπου
  choice: não onde
  rationale: Reproduz de modo conciso a negação locativa do grego.
- source_word: ὠνομάσθη
  choice: já havia sido anunciado
  rationale: No contexto missionário, o ato de o Messias ser 'nomeado' indica que ele já fora dado a conhecer ou proclamado naquele lugar. A formulação portuguesa comunica esse sentido sem sugerir mera atribuição de nome.
- source_word: Χριστός
  choice: o Messias
  rationale: O termo funciona aqui como título daquele que é anunciado, por isso 'Messias' torna explícito o valor titular.
- source_word: ἵνα μὴ
  choice: para não
  rationale: Expressa naturalmente a finalidade negativa, sem perda relevante da relação de propósito.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: sobre o alicerce de outra pessoa
  rationale: Conserva a metáfora de construção e indica que o alicerce pertence ao trabalho anterior de outro, sem acrescentar gênero não expresso no grego.
- source_word: οἰκοδομῶ
  choice: construir
  rationale: Mantém diretamente a imagem arquitetônica criada por 'alicerce'.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός funciona como título daquele que ainda não fora proclamado em certos lugares. 'Messias' preserva claramente esse valor, embora 'Cristo' seja a forma tradicional possível.
- issue: Natureza do princípio ministerial de Paulo
  choice: Objetivo missionário pessoal de Paulo
  alternative: Proibição universal de atuar onde Cristo já é conhecido
  rationale: A expressão de aspiração na primeira pessoa descreve a estratégia de Paulo; a tradução não a amplia para uma norma dirigida a todos.
- issue: Sentido contextual de ὠνομάσθη
  choice: já havia sido anunciado
  alternative: já havia sido nomeado
  rationale: O contexto trata de evangelização em territórios ainda não alcançados. 'Anunciado' comunica a ideia de o Messias ter sido publicamente dado a conhecer, enquanto a tradução literal 'nomeado' seria ambígua ou pouco natural em português.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível. 'Faço questão' comunica empenho pessoal; 'alicerce de outra pessoa' evita o masculino não explícito no original e conserva a metáfora apostólica.
