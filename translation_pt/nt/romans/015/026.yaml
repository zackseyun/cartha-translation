source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: pt
  text: Pois a Macedônia e a Acaia tiveram prazer em fazer uma contribuição para os pobres dentre os santos que estão em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazer uma partilha”; a expressão grega ressalta a comunhão que se manifesta por meio do auxílio material.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: tiveram prazer
  rationale: Expressa tanto a disposição favorável quanto o caráter voluntário do aoristo de εὐδοκέω, sem reduzi-lo a uma simples decisão.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz de modo conciso a explicação ou fundamento da afirmação anterior.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: a Macedônia e a Acaia
  rationale: Mantém os nomes das regiões como sujeitos metonímicos, conforme o grego, sem acrescentar explicitamente “igrejas” ou “crentes”.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: fazer uma contribuição
  rationale: No contexto da coleta, a expressão denota partilha concretizada em auxílio material. “Contribuição” comunica esse sentido com naturalidade; o artigo indefinido preserva a indefinição de τινά sem sugerir uma contribuição específica já identificada.
- source_word: εἰς τοὺς πτωχοὺς
  choice: para os pobres
  rationale: A preposição εἰς indica aqui os beneficiários ou a finalidade da contribuição.
- source_word: τῶν ἁγίων
  choice: dentre os santos
  rationale: Explicita que os pobres pertencem ao grupo dos santos, preservando ao mesmo tempo o termo paulino ἅγιοι.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: que estão em Jerusalém
  rationale: Reproduz claramente a construção atributiva que localiza os santos em Jerusalém.
theological_decisions:
- issue: Tradução de ἅγιοι no uso paulino
  choice: santos
  alternative: santos de Deus / povo santo de Deus
  rationale: “Santos” preserva a designação paulina coletiva dos fiéis e seu registro teológico, sem introduzir uma ideia de canonização posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém os topônimos como sujeitos, conserva o vocabulário paulino “santos” e esclarece na nota a nuance relacional de κοινωνία.
