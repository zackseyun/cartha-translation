source:
  edition: SBLGNT
  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: pt
  text: No empenho, não sejam preguiçosos; sejam fervorosos de espírito[a]; sirvam ao Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fervorosos no Espírito”, caso πνεύματι se refira ao Espírito Santo, e não ao espírito ou à disposição interior da pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: empenho
  rationale: O substantivo expressa zelo, dedicação e diligência. “Empenho” comunica de modo natural o esforço dedicado e forma um contraste claro com “preguiçosos”.
- source_word: ὀκνηροί
  choice: preguiçosos
  rationale: O termo descreve quem é lento, relutante ou indolente. “Preguiçosos” é claro, atual e preserva a força prática da exortação.
- source_word: πνεύματι
  choice: no espírito
  rationale: A forma grega sem artigo pode referir-se ao espírito humano, entendido como disposição interior, ou ao Espírito Santo. A tradução mantém “espírito” no texto e registra a outra leitura em nota.
- source_word: ζέοντες
  choice: sejam fervorosos
  rationale: O particípio significa literalmente “estar fervendo” e, em sentido figurado, indica ardor e intensidade. “Sejam fervorosos” preserva essa imagem em português idiomático e digno.
- source_word: κυρίῳ
  choice: ao Senhor
  rationale: Em Paulo, κύριος neste contexto provavelmente se refere ao Senhor Jesus. O título tradicional “Senhor” preserva a formulação sem explicitar além do grego.
- source_word: δουλεύοντες
  choice: sirvam
  rationale: Embora δουλεύω possa evocar serviço escravo, com o objeto dativo nesta exortação “sirvam” comunica naturalmente devoção e obediência, sem tornar a frase artificial.
theological_decisions:
- issue: Referente de πνεύματι em τῷ πνεύματι ζέοντες
  choice: espírito humano ou disposição interior
  alternative: o Espírito Santo
  rationale: O contexto apresenta uma sequência de exortações éticas, e a referência ao espírito da pessoa se encaixa naturalmente nesse fluxo. Como o grego não identifica expressamente o referente e permite a leitura referente ao Espírito Santo, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Empenho” evita a combinação pouco natural “preguiçosos no zelo” sem perder a ideia de dedicação zelosa. O marcador da nota foi colocado imediatamente após “espírito”, termo ao qual a alternativa se refere.
