  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: pt
  text: assim também nós, embora muitos, somos um só corpo no Messias[a] e, individualmente, membros uns dos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em Cristo». O título grego Χριστός pode ser traduzido das duas maneiras; aqui se usa «Messias» para preservar seu sentido de título.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: assim também
  rationale: Retoma e aplica a comparação do corpo apresentada no versículo anterior, preservando sua força comparativa e inferencial em português natural.
- source_word: οἱ πολλοὶ
  choice: nós, embora muitos
  rationale: O contexto identifica inclusivamente os muitos com Paulo e seus leitores; «embora muitos» expressa com clareza o contraste entre pluralidade e unidade.
- source_word: ἓν σῶμά
  choice: um só corpo
  rationale: Mantém a metáfora corporal e realça a unidade indicada pelo numeral ἕν.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva tanto a expressão paulina de união quanto o sentido titular de Χριστός; a forma tradicional «em Cristo» é registrada em nota.
- source_word: τὸ δὲ καθ’ εἷς
  choice: e, individualmente
  rationale: Transmite de modo conciso o valor distributivo da expressão grega, isto é, com respeito a cada pessoa.
- source_word: ἀλλήλων
  choice: uns dos outros
  rationale: Expressa naturalmente em português a relação recíproca entre os membros.
- source_word: μέλη
  choice: membros
  rationale: Conserva a imagem das partes do corpo e, ao mesmo tempo, sua aplicação comunitária.
theological_decisions:
- issue: Tradução de Χριστῷ em ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: Χριστός mantém valor titular, e «Messias» torna esse sentido explícito sem desfazer a linguagem paulina de união. Como «Cristo» é a forma tradicional e lexicalmente legítima, ela é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «membros uns dos outros» conserva deliberadamente a forte reciprocidade do grego, sem reduzi-la a simples pertencimento ao mesmo grupo.
