id: ROM.12.18
reference: Romans 12:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: pt
  text: Se possível[a], no que depender de vocês, vivam em paz com todas as pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se for possível, da parte de vocês, vivam em paz com todas as pessoas.”'
    reason: Alternativa que reúne de modo mais direto as duas expressões qualificadoras do grego.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Se possível
  rationale: A expressão condicional introduz uma qualificação realista, não uma ordem absoluta. “Se possível” é natural em português e preserva a contingência do grego.
- source_word: τὸ ἐξ ὑμῶν
  choice: no que depender de vocês
  rationale: A construção idiomática indica aquilo que está ao alcance ou sob a responsabilidade dos leitores. Esta formulação corrente preserva o limite explícito da exortação.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: com todas as pessoas
  rationale: ἄνθρωποι tem sentido genérico, abrangendo seres humanos sem restrição de sexo. “Todas as pessoas” comunica claramente esse alcance universal.
- source_word: εἰρηνεύοντες
  choice: vivam em paz
  rationale: O particípio presente tem força exortativa no contexto e sugere uma conduta contínua. “Vivam em paz” expressa naturalmente esse modo de vida.
theological_decisions:
- issue: Alcance e limitação da exortação
  choice: A exortação convoca os fiéis a viver em paz com todas as pessoas, mas limita sua responsabilidade ao que de fato depende deles.
  alternative: Entender a paz como uma obrigação sem qualificação ou como um resultado sempre garantido quando os fiéis agem corretamente.
  rationale: As duas qualificações, εἰ δυνατόν e τὸ ἐξ ὑμῶν, impedem que a frase seja lida como garantia absoluta de paz. A tradução conserva tanto o alcance universal quanto a limitação realista.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural “vocês” explicita o referente plural de ὑμῶν sem recorrer ao regionalismo “vós”.
