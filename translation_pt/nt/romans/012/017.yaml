source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: pt
  text: Não retribuam a ninguém mal por mal. Procurem fazer o que é bom[a] diante de todas as pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é honroso” ou “o que é nobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: a ninguém
  rationale: O dativo singular funciona como objeto indireto de ἀποδιδόντες. “A ninguém” preserva de modo natural o alcance universal.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: o mal com o mal
  rationale: A expressão indica reciprocidade retaliatória, isto é, devolver o mal recebido. “O mal com o mal” é idiomático em português e conserva a força moral de κακόν.
- source_word: ἀποδιδόντες
  choice: Não retribuam
  rationale: O particípio presente tem força exortativa no contexto. “Retribuir” comunica dar em retorno, especialmente como retaliação, sem o tom excessivamente coloquial de “pagar na mesma moeda”.
- source_word: προνοούμενοι
  choice: Procurem fazer
  rationale: O verbo envolve consideração cuidadosa e antecipada. No contexto de καλά, a formulação natural “procurem fazer” comunica intenção deliberada sem restringir o sentido a provisão material.
- source_word: καλὰ
  choice: o que é bom
  rationale: καλά pode significar aquilo que é bom, belo, nobre ou honroso. “O que é bom” mantém a amplitude ética; as nuances de honra e nobreza são registradas em nota.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: diante de todas as pessoas
  rationale: A expressão conserva a ideia de visibilidade pública e consideração social. “Todas as pessoas” traduz o sentido humano genérico de ἀνθρώπων.
theological_decisions:
- issue: Nuance ética e pública de καλά
  choice: o que é bom
  alternative: o que é honroso; o que é nobre
  rationale: A frase pode abranger tanto a bondade moral quanto uma conduta reconhecidamente honrosa em público. O texto principal mantém o sentido mais amplo, e a nota preserva as nuances legítimas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O plural exortativo torna explícita a força contextual dos particípios gregos.
