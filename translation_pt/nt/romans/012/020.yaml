id: ROM.12.20
reference: Romans 12:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: pt
  text: Mas, se o seu inimigo estiver com fome, dê-lhe de comer; se estiver com sede, dê-lhe de beber; pois, fazendo isso, você amontoará brasas ardentes sobre a cabeça dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “brasas de fogo”. A imagem pode sugerir vergonha que leve ao arrependimento, dolorosa convicção moral ou juízo iminente; a metáfora grega foi mantida no texto.
    reason: Alternativa lexical e preservação de uma metáfora teologicamente ambígua.
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Mas, se
  rationale: ἀλλά estabelece contraste com a proibição anterior de vingança, e ἐάν introduz uma condição. “Mas, se” preserva ambos os valores com naturalidade.
- source_word: πεινᾷ
  choice: estiver com fome
  rationale: O presente do subjuntivo ocorre numa oração condicional; esta formulação é corrente e idiomática em português.
- source_word: ὁ ἐχθρός σου
  choice: o seu inimigo
  rationale: Mantém o substantivo definido, o possessivo e o singular do grego em linguagem natural.
- source_word: ψώμιζε
  choice: dê-lhe de comer
  rationale: O imperativo de ψωμίζω ordena que se forneça alimento. A expressão é clara, concreta e corrente.
- source_word: διψᾷ
  choice: estiver com sede
  rationale: Corresponde de modo idiomático ao verbo grego na segunda oração condicional.
- source_word: πότιζε
  choice: dê-lhe de beber
  rationale: ποτίζω significa dar bebida a alguém. A tradução não restringe indevidamente a bebida a água.
- source_word: τοῦτο γὰρ ποιῶν
  choice: pois, fazendo isso
  rationale: Preserva a função explicativa de γάρ e expressa naturalmente a circunstância do particípio ποιῶν, sem determinar além do texto se a relação é instrumental ou resultativa.
- source_word: ἄνθρακας πυρὸς
  choice: brasas ardentes
  rationale: A expressão literal é “brasas de fogo”. “Brasas ardentes” é natural em português e mantém intacta a imagem concreta.
- source_word: σωρεύσεις
  choice: você amontoará
  rationale: Mantém o futuro do indicativo e a ideia de acumular ou empilhar expressa pelo verbo σωρεύω.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sobre a cabeça dele
  rationale: Reproduz diretamente a imagem espacial do grego em português atual e inequívoco.
theological_decisions:
- issue: Sentido da metáfora de amontoar brasas ardentes sobre a cabeça do inimigo
  choice: Manter a metáfora sem interpretá-la no texto principal.
  alternative: Explicá-la como vergonha que conduz ao arrependimento, dolorosa convicção moral ou juízo iminente.
  rationale: O sentido exato da imagem é discutido. Explicá-la no corpo do versículo eliminaria uma ambiguidade genuína e favoreceria indevidamente uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” de modo coerente com o singular do grego e usa construções correntes (“com fome”, “dê-lhe de comer”) sem perder a força concreta da exortação. O marcador da nota foi colocado junto à metáfora a que de fato se refere.
