reference: Romans 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: pt
  text: E não se amoldem a esta era[a], mas sejam transformados pela renovação da mente, para que possam discernir[b] qual é a vontade de Deus — o que é bom, agradável[c] e perfeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a este mundo”. O grego αἰών significa mais precisamente “era” e aqui se refere à ordem ou época presente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pôr à prova e reconhecer como aprovada”. O verbo grego pode abranger tanto o exame quanto o reconhecimento daquilo que é aprovado.'
    reason: lexical_alternative
  - marker: c
    text: “Agradável” pode significar “agradável a Deus”; também se pode traduzir por “aceitável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: se amoldem
  rationale: Expressa a ideia de assumir um padrão externo e mantém, em português natural, o contraste com a transformação profunda indicada por μεταμορφοῦσθε.
- source_word: αἰῶνι τούτῳ
  choice: a esta era
  rationale: αἰών designa mais precisamente a era ou ordem presente, não o mundo criado em si; “era” preserva o contraste temporal e ético.
- source_word: μεταμορφοῦσθε
  choice: sejam transformados
  rationale: Conserva a força passiva do imperativo e a ideia de mudança profunda de forma ou condição.
- source_word: τῇ ἀνακαινώσει
  choice: pela renovação
  rationale: Entende o dativo como instrumental, indicando o meio pelo qual ocorre a transformação, e preserva o sentido de renovação em processo.
- source_word: τοῦ νοός
  choice: da mente
  rationale: Traduz νοῦς como a faculdade de compreensão e discernimento moral e espiritual, sem acrescentar um possessivo ausente no grego.
- source_word: εἰς τὸ δοκιμάζειν
  choice: para que possam discernir
  rationale: A construção indica propósito ou resultado; “discernir” comunica de modo claro o processo de avaliar e reconhecer o que é aprovado, sem sugerir que a vontade de Deus esteja sujeita ao julgamento humano.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: qual é a vontade de Deus
  rationale: Reproduz naturalmente em português a pergunta indireta introduzida por τί e mantém explícita a relação genitiva.
- source_word: ἀγαθὸν
  choice: bom
  rationale: É o equivalente direto e natural no trio que caracteriza a vontade de Deus.
- source_word: εὐάρεστον
  choice: agradável
  rationale: Preserva a ideia do que agrada, deixando em aberto no texto principal a quem isso é agradável.
- source_word: τέλειον
  choice: perfeito
  rationale: No contexto da vontade de Deus, “perfeito” é o equivalente mais natural e preserva a força do termo, embora “completo” também pertença ao seu campo semântico.
theological_decisions:
- issue: Sentido de αἰών no contraste ético
  choice: esta era
  alternative: este mundo; esta ordem presente
  rationale: “Era” evita transformar o contraste ético-temporal de Paulo em rejeição do mundo criado e conserva a referência à ordem presente.
- issue: Força de δοκιμάζειν em relação à vontade de Deus
  choice: discernir
  alternative: pôr à prova; examinar e aprovar
  rationale: “Discernir” indica que a mente renovada reconhece e acolhe o que é aprovado, sem eliminar da nota a dimensão de exame presente no verbo.
- issue: Referente implícito de εὐάρεστον
  choice: agradável
  alternative: aceitável; agradável a Deus
  rationale: O texto grego não explicita o referente. A tradução mantém a formulação aberta, enquanto a nota registra que o sentido pode ser aquilo que agrada a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Se amoldem” evita o sentido corrente de mera aquiescência que “conformar-se com” poderia sugerir. A construção final preserva a aposição grega e sua leve ambiguidade, sem explicitar além do texto a relação dos três adjetivos com a vontade de Deus.
