id: ROM.12.9
reference: Romans 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: pt
  text: Que o amor seja sem hipocrisia.[a] Detestem o mal; apeguem-se ao bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Que o amor seja sincero». Literalmente, o grego diz: «O amor sem hipocrisia».'
    reason: Alternativa lexical e esclarecimento da construção grega sem verbo.
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: É o equivalente moderno e natural de ἀγάπη, preservando sua força ética sem conotações arcaicas.
- source_word: ἀνυπόκριτος
  choice: sem hipocrisia
  rationale: Preserva de forma transparente o sentido concreto de algo não fingido ou não encenado, em vez de reduzi-lo à formulação mais interpretativa «sincero».
- source_word: ἀποστυγοῦντες
  choice: detestem
  rationale: Comunica a forte aversão expressa pelo particípio e é corrente em português; o valor imperativo decorre do contexto exortativo.
- source_word: τὸ πονηρόν
  choice: o mal
  rationale: O adjetivo neutro substantivado designa de modo amplo aquilo que é mau; «o mal» mantém essa categoria moral e forma um paralelo natural com «o bem».
- source_word: κολλώμενοι
  choice: apeguem-se
  rationale: Expressa adesão firme e próxima em português natural, preservando a intensidade relacional do verbo; recebe valor imperativo no contexto.
- source_word: τῷ ἀγαθῷ
  choice: ao bem
  rationale: O adjetivo neutro substantivado é traduzido como uma categoria moral ampla e em paralelo direto com «o mal».
theological_decisions:
- issue: Força da oração sem verbo e dos particípios no contexto exortativo
  choice: 'Traduzir o versículo como uma série de exortações: «Que o amor seja... Detestem... apeguem-se...»'
  alternative: 'Uma formulação mais estruturalmente literal: «O amor sem hipocrisia, detestando o mal, apegando-se ao bem»'
  rationale: Embora o grego comece com uma expressão nominal sem verbo e continue com particípios, Romanos 12 apresenta uma sequência de exortações. A forma escolhida comunica essa função sem apagar a construção grega, que é indicada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural exortativo «detestem/apeguem-se» é natural no contexto comunitário. «Sem hipocrisia» mantém o caráter concreto do grego, e a nota registra tanto a opção idiomática quanto a forma literal.
