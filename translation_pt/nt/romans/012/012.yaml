  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: pt
  text: alegres na esperança, perseverantes na aflição[a], dedicados à oração[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na tribulação”; o termo pode indicar forte pressão, angústia ou sofrimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “perseverantes na oração”; o verbo enfatiza constância e dedicação contínua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: na esperança
  rationale: O dativo com artigo indica a esfera ou o fundamento da alegria. Em português, “na esperança” é idiomático e preserva a formulação concisa.
- source_word: χαίροντες
  choice: alegres
  rationale: O particípio presente descreve uma disposição contínua e integra uma série exortativa. “Alegres” soa natural em português e mantém o paralelismo adjetival.
- source_word: θλίψει
  choice: na aflição
  rationale: θλῖψις denota pressão, sofrimento ou angústia. “Aflição” conserva a gravidade do termo sem restringi-lo a uma forma específica de sofrimento.
- source_word: ὑπομένοντες
  choice: perseverantes
  rationale: ὑπομένω comunica firmeza e constância sob dificuldade. “Perseverantes” preserva esse sentido e combina naturalmente com a estrutura paralela.
- source_word: προσευχῇ
  choice: à oração
  rationale: O dativo designa aquilo a que se aplica a constância. Com “dedicados”, a regência natural em português é “à oração”.
- source_word: προσκαρτεροῦντες
  choice: dedicados
  rationale: προσκαρτερέω expressa persistência constante e devoção continuada. “Dedicados” comunica essa constância em português corrente; a alternativa “perseverantes” também é possível, mas repetiria a escolha usada para ὑπομένοντες.
theological_decisions: []
