id: ROM.12.19
reference: Romans 12:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: pt
  text: 'Não se vinguem, amados, mas deem lugar à ira[a], pois está escrito: “A vingança é minha; eu retribuirei”, diz o Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixem espaço para a ira”, provavelmente a ira de Deus, à luz da citação que vem em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Não se vinguem
  rationale: Expressa naturalmente em português a proibição contextual e preserva a força reflexiva de ἑαυτούς.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Mantém o vocativo afetuoso e sua dignidade teológica, sem recorrer a uma forma excessivamente coloquial.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: mas deem lugar à ira
  rationale: Preserva a metáfora e a concisão do grego, sem explicitar no texto principal de quem é a ira.
- source_word: γέγραπται γάρ
  choice: pois está escrito
  rationale: É a fórmula portuguesa natural e tradicional para introduzir uma citação das Escrituras.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: A vingança é minha
  rationale: Reproduz de modo direto a construção possessiva e mantém uma formulação clara, conhecida e solene.
- source_word: ἐγὼ ἀνταποδώσω
  choice: eu retribuirei
  rationale: Comunica a ideia judicial de dar a cada um a devida paga, preservando a ênfase do pronome grego.
- source_word: λέγει κύριος
  choice: diz o Senhor
  rationale: Segue a forma idiomática portuguesa da fórmula de citação e traduz κύριος por “Senhor”.
theological_decisions:
- issue: Referente de τῇ ὀργῇ (“à ira”)
  choice: Manter a expressão concisa “à ira”, entendida provavelmente como a ira de Deus à luz da citação seguinte.
  alternative: Explicitar “à ira de Deus” ou entender a expressão como referência à ira humana em geral.
  rationale: A citação de Deuteronômio 32:35 aponta fortemente para o juízo divino, mas o grego não inclui a palavra “Deus”. A tradução conserva essa tensão e esclarece o sentido contextual provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Deem lugar à ira” conserva deliberadamente a metáfora e a ambiguidade do original; “eu retribuirei” mantém o tom judicial da citação.
