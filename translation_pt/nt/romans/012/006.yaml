  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: pt
  text: 'Temos, porém, dons diferentes, segundo a graça que nos foi dada: se é profecia, que seja exercida na proporção da fé.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na proporção da própria fé”; alternativamente: “em conformidade com a fé”. A expressão grega pode se referir tanto à medida de fé concedida a quem profetiza quanto à conformidade com o conteúdo da fé cristã.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Temos, porém
  rationale: O particípio retoma o fluxo da exortação anterior. Em português, a forma finita evita uma construção suspensa e expressa naturalmente a transição leve marcada por δέ.
- source_word: χαρίσματα ... διάφορα
  choice: dons diferentes
  rationale: É a formulação corrente e clara para a diversidade dos χαρίσματα; a relação desses dons com a graça aparece explicitamente na oração seguinte.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: segundo a graça que nos foi dada
  rationale: Preserva a ideia de correspondência expressa por κατά e apresenta χάρις como a graça concedida, sem acrescentar uma definição teológica não explicitada.
- source_word: εἴτε προφητείαν
  choice: se é profecia
  rationale: Explicita de modo mínimo a construção elíptica grega e introduz naturalmente o primeiro item da lista.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: na proporção da fé
  rationale: Mantém a formulação ampla do grego e não decide se πίστις é a fé do profeta ou o conteúdo da fé cristã.
theological_decisions:
- issue: Sentido de κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: na proporção da fé
  alternative: na proporção da própria fé; em conformidade com a fé
  rationale: A expressão grega admite tanto referência à medida de fé do profeta quanto concordância com o conteúdo da fé cristã. O texto principal preserva essa tensão, e a nota registra as interpretações principais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção finita “Temos, porém” dá naturalidade ao fragmento participial, e “que seja exercida” completa a elipse sem definir a natureza da profecia.
