  text: se o seu dom é o serviço[a], dedique-se ao serviço; quem ensina, dedique-se ao ensino[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se o seu dom é o ministério, dedique-se ao ministério”. O grego διακονία pode significar “serviço” ou “ministério”, conforme o contexto.'
