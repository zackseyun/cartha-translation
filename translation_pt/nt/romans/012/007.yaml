lexical_decisions:
- source_word: εἴτε
  choice: se é
  rationale: No contexto da lista elíptica de dons e funções, introduz cada caso de modo condicional. “Se é” mantém o paralelismo e liga naturalmente o versículo à frase anterior.
- source_word: διακονίαν
  choice: serviço
  rationale: O termo pode indicar serviço, assistência prática ou ministério. “Serviço” preserva sua amplitude sem sugerir necessariamente um cargo eclesiástico formal.
- source_word: ἐν τῇ διακονίᾳ
  choice: que se dedique ao serviço
  rationale: A expressão grega é concisa e elíptica, indicando atuação concentrada nessa esfera. A explicitação verbal produz português natural e mantém a repetição de “serviço”.
- source_word: ὁ διδάσκων
  choice: quem ensina
  rationale: O particípio substantivado destaca a pessoa que exerce a atividade de ensinar, sem transformá-la necessariamente em detentora de um ofício institucional.
- source_word: διδασκαλίᾳ
  choice: ensino
  rationale: Neste contexto, designa a atividade ou o conteúdo de ensinar. “Ensino” é direto, corrente e menos técnico que “doutrina”.
theological_decisions:
- issue: Se διακονία deve receber terminologia eclesiástica formal
  choice: serviço
  alternative: ministério
  rationale: A passagem enumera dons ou funções concedidos pela graça. “Serviço” evita restringir indevidamente o termo a um ministério formal, embora essa possibilidade lexical seja registrada em nota.
- issue: Se ὁ διδάσκων deve ser vertido como título de ofício
  choice: quem ensina
  alternative: o mestre / aquele que ensina
  rationale: A forma participial grega enfatiza a pessoa em sua atividade, não declara por si só a existência de um cargo eclesiástico.
- issue: Como representar a elipse de ἐν τῇ διακονίᾳ e ἐν τῇ διδασκαλίᾳ
  choice: explicitar “que se dedique”
  alternative: manter literalmente “no serviço” e “no ensino”
  rationale: O verbo não está expresso, mas a construção exortativa é recuperada do contexto. A explicitação torna a frase inteligível em português sem determinar a natureza institucional dos dons.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A construção repete os termos-chave do grego, mas explicita a exortação elíptica com “que se dedique”. Os pontos e vírgulas preservam o caráter de continuação da lista iniciada no versículo anterior.
