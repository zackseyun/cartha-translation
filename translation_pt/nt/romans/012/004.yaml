id: ROM.12.4
reference: Romans 12:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: pt
  text: Pois, assim como em um só corpo temos muitos membros[a], mas nem todos os membros têm a mesma função[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitas partes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a mesma atividade”. O termo grego pode indicar atividade ou função; aqui, “função” se ajusta à metáfora do corpo e ao contexto de diferentes atribuições.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Pois, assim como
  rationale: “Pois” preserva a ligação explicativa de γάρ com a exortação anterior, e “assim como” introduz naturalmente a comparação que será completada no versículo seguinte.
- source_word: ἐν ἑνὶ σώματι
  choice: em um só corpo
  rationale: Mantém a imagem corporal e realça a unidade expressa por ἑνί, sem explicitar prematuramente seu referente eclesiológico.
- source_word: πολλὰ μέλη
  choice: muitos membros
  rationale: “Membros” preserva tanto a imagem anatômica quanto sua aplicação coletiva em Paulo; “partes” continua sendo uma alternativa possível em linguagem comum.
- source_word: ἔχομεν
  choice: temos
  rationale: Tradução direta e natural do presente indicativo na primeira pessoa do plural.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: mas nem todos os membros
  rationale: 'Esta formulação portuguesa expressa claramente o contraste de δέ e o alcance da negação: a afirmação não é que nenhum membro tenha a mesma função, mas que não são todos que a têm.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: têm a mesma função
  rationale: No contexto da metáfora do corpo e da diversidade de dons, “função” comunica naturalmente o sentido de πρᾶξις, ao mesmo tempo que “atividade” permanece lexicalmente possível.
theological_decisions:
- issue: Força eclesiológica da metáfora do corpo
  choice: Manter a comparação como “um só corpo” e “muitos membros”, sem acrescentar “a igreja”.
  alternative: Explicitar como “um só corpo, a igreja”.
  rationale: Embora o versículo seguinte aplique a figura à comunidade, este versículo apresenta primeiro a analogia. A redação conserva essa progressão e evita inserir uma identificação que o versículo ainda não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Em um só corpo” soa natural e comunica a unidade sem rigidez excessiva; “nem todos os membros” esclarece de modo idiomático o alcance da negação grega.
