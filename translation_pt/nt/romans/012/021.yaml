id: ROM.12.21
reference: Romans 12:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: pt
  text: Não se deixe vencer pelo mal[a], mas vença o mal com o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não permita que aquilo que é mau vença você, mas vença aquilo que é mau por meio daquilo que é bom». No grego, os adjetivos neutros com artigo podem ser traduzidos de modo abstrato («o mal», «o bem») ou como «aquilo que é mau» e «aquilo que é bom».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Não se deixe vencer
  rationale: O presente imperativo passivo com μή expressa uma proibição dirigida à segunda pessoa do singular. Em português, «não se deixe vencer» comunica naturalmente a voz passiva e a exortação, sem a rigidez de «não seja conquistado».
- source_word: ὑπὸ τοῦ κακοῦ
  choice: pelo mal
  rationale: Ὑπό com genitivo indica o agente da ação passiva. O adjetivo neutro substantivado pode designar abstratamente «o mal» ou, de modo mais explícito, «aquilo que é mau»; «pelo mal» é conciso e natural.
- source_word: ἀλλὰ νίκα
  choice: mas vença
  rationale: Ἀλλά marca forte contraste, e νίκα é presente imperativo ativo na segunda pessoa do singular. «Vença» mantém a imagem de vitória e a correspondência lexical com «vencer» na primeira oração.
- source_word: ἐν τῷ ἀγαθῷ
  choice: com o bem
  rationale: Ἐν com dativo tem aqui valor instrumental ou de meio. «Com o bem» é a formulação portuguesa corrente e expressa o meio pelo qual o mal deve ser vencido.
- source_word: τὸ κακόν
  choice: o mal
  rationale: O neutro substantivado funciona genericamente como categoria moral. «O mal» preserva a concisão e reforça a antítese retórica com «o bem».
theological_decisions:
- issue: Se κακός e ἀγαθός devem ser entendidos como categorias morais ou se κακός deve ser personalizado como «o Maligno»
  choice: 'Categorias morais: «o mal» e «o bem»'
  alternative: Personalizar a expressão como referência a «o Maligno»
  rationale: As formas neutras substantivadas e o contexto ético de Romanos 12 favorecem categorias morais gerais. A tradução não introduz um referente pessoal que a sintaxe não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento na terceira pessoa («se deixe», «vença») evita regionalismo excessivo e conserva a força direta dos imperativos no singular.
