  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: pt
  text: Abençoem os que perseguem vocês[a]; abençoem e não amaldiçoem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que vão atrás de vocês”. O verbo grego pode significar “ir atrás de, perseguir”, mas aqui provavelmente se refere à perseguição hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Abençoem
  rationale: Imperativo plural de εὐλογέω. “Abençoem” é a equivalência portuguesa natural e concisa, preservando o sentido de desejar ou invocar o bem. A repetição foi mantida para reproduzir a ênfase de Paulo.
- source_word: τοὺς διώκοντας
  choice: os que perseguem vocês
  rationale: 'O particípio com artigo funciona como substantivo: “os que perseguem”. Neste contexto ético, διώκω indica perseguição hostil. “Vocês” explicita de modo idiomático o objeto implícito no contexto da exortação.'
- source_word: καὶ
  choice: e
  rationale: Conjunção simples que liga a repetição da ordem positiva à proibição; “e” preserva a estrutura direta do grego.
- source_word: μὴ καταρᾶσθε
  choice: não amaldiçoem
  rationale: A construção imperativa com μή expressa proibição. “Não amaldiçoem” é clara, atual e mantém o contraste lexical e ético com “abençoem”.
theological_decisions:
- issue: Alcance de διώκω no contexto
  choice: Entendido como perseguição hostil
  alternative: os que vão atrás de vocês / os que perseguem no sentido de seguir
  rationale: Embora διώκω também possa significar “ir atrás de” ou “perseguir” em sentido amplo, no uso paulino e neste contexto de conduta diante de adversários, o sentido de perseguição hostil é o mais provável. A nota preserva a amplitude lexical sem enfraquecer a leitura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “vocês” para tornar explícito o objeto plural implícito e evitar formas regionais ou excessivamente formais. A repetição de “abençoem” e a coordenação simples reproduzem a ênfase e a concisão do original.
