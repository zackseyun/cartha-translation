base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: pt
  text: quem exorta[a], dedique-se à exortação; quem compartilha[b], faça-o com generosidade[c]; quem lidera[d], com dedicação[e]; quem exerce misericórdia, com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem encoraja, que se dedique ao encorajamento”. O verbo e o substantivo gregos podem expressar exortação, encorajamento ou consolo.'
    reason: lexical_alternative
  - marker: b
    text: Ou “quem dá” ou “quem contribui”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com sinceridade” ou “com simplicidade”. O termo grego pode indicar singeleza de intenção ou generosidade, conforme o contexto.
    reason: lexical_alternative
  - marker: d
    text: Ou “quem dirige”, “quem governa” ou “quem preside”.
    reason: lexical_alternative
  - marker: e
    text: Ou “com diligência” ou “com zelo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: se é
  rationale: Dá continuidade à série elíptica do contexto anterior e introduz de modo natural, em português, a atividade ou dom mencionado.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: exortar / à exortação
  rationale: Preserva a relação lexical entre o particípio e o substantivo cognato. O campo semântico também abrange encorajar e consolar, alternativa registrada em nota.
- source_word: ὁ μεταδιδοὺς
  choice: quem compartilha
  rationale: Expressa o ato de repartir com outros os próprios recursos sem restringir o referente a uma forma específica de contribuição.
- source_word: ἐν ἁπλότητι
  choice: com generosidade
  rationale: No contexto de compartilhar recursos, a ideia de liberalidade ou generosidade é a leitura contextual mais provável, embora o termo também possa indicar sinceridade ou simplicidade.
- source_word: ὁ προϊστάμενος
  choice: quem lidera
  rationale: É uma formulação ampla e atual para o exercício de liderança ou direção, sem transformar o particípio em título eclesiástico técnico.
- source_word: ἐν σπουδῇ
  choice: com dedicação
  rationale: Comunica empenho diligente e zeloso em português natural; zelo e diligência são alternativas possíveis.
- source_word: ὁ ἐλεῶν
  choice: quem exerce misericórdia
  rationale: Mantém o caráter ativo do particípio, referindo-se à prática concreta da misericórdia.
- source_word: ἐν ἱλαρότητι
  choice: com alegria
  rationale: Traduz de forma corrente a disposição alegre e voluntária indicada pelo substantivo grego.
theological_decisions:
- issue: Alcance de ὁ προϊστάμενος
  choice: quem lidera
  alternative: quem governa, dirige ou preside
  rationale: A forma participial integra uma lista ampla de dons e atividades, sem identificar explicitamente um cargo eclesiástico; a tradução evita impor uma estrutura denominacional.
- issue: Sentido de ἁπλότης no ato de compartilhar
  choice: generosidade
  alternative: sinceridade ou simplicidade
  rationale: A associação imediata com o compartilhamento de recursos favorece o sentido de liberalidade, enquanto a nota conserva a amplitude lexical genuína.
- issue: Elementos verbais subentendidos na construção elíptica
  choice: dedique-se / faça-o, supridos em português
  alternative: manter apenas as frases preposicionais nominais
  rationale: O grego depende da exortação iniciada nos versículos anteriores. Os verbos supridos tornam a relação sintática compreensível sem alterar a força exortativa do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo conciso da lista, mas explicita os verbos exigidos pela elipse grega. “Exercer misericórdia” mantém um tom bíblico natural sem soar arcaico.
