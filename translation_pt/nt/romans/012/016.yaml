id: ROM.12.16
reference: Romans 12:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: pt
  text: Tenham a mesma atitude uns para com os outros; não ponham a mente nas coisas elevadas, mas deixem-se levar pelas coisas humildes[a]. Não se tornem sábios aos seus próprios olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mas convivam com os humildes”. O grego pode referir-se tanto a pessoas de condição humilde como a coisas ou tarefas humildes.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Tenham a mesma atitude uns para com os outros
  rationale: A expressão idiomática exorta à harmonia e a uma disposição mútua comum, não necessariamente à identidade absoluta de opiniões. “Atitude” comunica esse sentido relacional em português natural.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: não ponham a mente nas coisas elevadas
  rationale: Mantém a imagem do grego e preserva a amplitude entre pensamentos orgulhosos, aspirações elevadas e orientação para o que tem alto status.
- source_word: τοῖς ταπεινοῖς
  choice: pelas humildes
  rationale: O adjetivo substantivado pode referir-se a pessoas humildes ou de condição modesta, ou a coisas e ocupações humildes. O feminino plural concorda por sentido com “coisas”, implícito no paralelismo, sem eliminar em nota a leitura pessoal.
- source_word: συναπαγόμενοι
  choice: deixem-se levar
  rationale: Reproduz a voz e a imagem dinâmica do verbo, literalmente ser levado junto, sem reduzi-lo apenas ao sentido social de associar-se.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: Não se tornem sábios aos seus próprios olhos
  rationale: “Tornem-se” preserva o aspecto processual de γίνεσθε, e “aos seus próprios olhos” expressa de modo idiomático o juízo presunçoso sobre si mesmo.
theological_decisions:
- issue: Sentido social ou atitudinal de τὰ ὑψηλά e τοῖς ταπεινοῖς
  choice: 'Manter uma formulação ampla: “coisas elevadas” e “humildes”, com esclarecimento em nota'
  alternative: “Não sejam arrogantes, mas convivam com os humildes” ou “não aspirem a coisas elevadas, mas dediquem-se às humildes”
  rationale: O grego admite tanto uma exortação contra a soberba e a busca de status quanto uma convocação à identificação com pessoas ou tarefas humildes. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e o imperativo na terceira pessoa do plural mantêm naturalidade sem coloquialismo excessivo.
