  source_fidelity: A primeira e a última exortações são fiéis ao grego. «Não ponham a mente nas coisas elevadas» preserva adequadamente a amplitude de μὴ τὰ ὑψηλὰ φρονοῦντες. Na cláusula central, porém, «pelas humildes» deixa o adjetivo feminino plural sem substantivo expresso e não constitui português claro; além disso, a formulação não permite identificar de modo seguro o referente pretendido.
  naturalness: «Tenham a mesma atitude uns para com os outros» e «Não se tornem sábios aos seus próprios olhos» são naturais e adequadas ao registro. A correção de «pelas humildes» para «pelas coisas humildes» torna a oração gramatical e inteligível.
  terminology: «Atitude», «coisas elevadas», «coisas humildes» e «sábios aos seus próprios olhos» mantêm registro moderno e não introduzem interpretação confessional. A nota conserva a alternativa pessoal para τοῖς ταπεινοῖς.
