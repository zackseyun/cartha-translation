  source_fidelity: A tradução preserva adequadamente a sequência argumentativa de οὖν («Portanto»), a força exortativa de Παρακαλῶ («exorto»), o plural de «misericórdias», a concretude de «corpos» e a imagem paradoxal de «sacrifício vivo». «Pelas misericórdias de Deus» expressa de modo legítimo a base/motivação do apelo introduzida por διά com genitivo. A aposição final («o culto racional de vocês») representa adequadamente τὴν λογικὴν λατρείαν.
