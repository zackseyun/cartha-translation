id: ROM.12.1
reference: Romans 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: pt
  text: Portanto, irmãos[a], exorto vocês, pelas misericórdias de Deus, a apresentarem seus corpos como sacrifício vivo, santo e agradável a Deus — o culto racional[b] de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs». O grego diz literalmente «irmãos», forma masculina plural que, neste contexto, pode incluir também as mulheres da comunidade.
    reason: alternative_reading
  - marker: b
    text: Ou «culto espiritual» ou «serviço racional». A expressão grega pode indicar um culto ou serviço racional, consciente, apropriado ou espiritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: exorto
  rationale: Expressa uma convocação apostólica séria e enfática, sem o tom arcaico de «rogo» nem a menor intensidade de um simples pedido.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a inferência que liga a exortação ao argumento desenvolvido em Romanos 1–11.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina plural do grego; em português, «irmãos» também pode designar coletivamente homens e mulheres, possibilidade explicitada em nota.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: pelas misericórdias de Deus
  rationale: Preserva o plural concreto «misericórdias» e comunica que elas são a base do apelo de Paulo, sem excluir por completo a nuance instrumental de διά.
- source_word: παραστῆσαι
  choice: a apresentarem
  rationale: «Apresentar» conserva a nuance formal e sacrificial de colocar algo diante de Deus; o infinitivo flexionado é natural em português após «vocês».
- source_word: τὰ σώματα ὑμῶν
  choice: seus corpos
  rationale: Mantém o substantivo concreto e plural σώματα, em vez de generalizá-lo como «vocês mesmos».
- source_word: θυσίαν ζῶσαν
  choice: como sacrifício vivo
  rationale: Reproduz a construção apositiva e o paradoxo da imagem sacrificial de Paulo.
- source_word: ἁγίαν
  choice: santo
  rationale: É a tradução corrente de ἅγιος e descreve o sacrifício como consagrado e separado para Deus.
- source_word: εὐάρεστον τῷ θεῷ
  choice: agradável a Deus
  rationale: Comunica de modo atual que o sacrifício é bem recebido e causa agrado a Deus, evitando que «aceitável» sugira mera suficiência mínima.
- source_word: λογικὴν
  choice: racional
  rationale: Mantém a ligação lexical de λογικός com razão e reflexão sem decidir silenciosamente pela interpretação «espiritual»; a amplitude semântica é registrada em nota.
- source_word: λατρείαν
  choice: culto
  rationale: No contexto de sacrifício oferecido a Deus, «culto» preserva a dimensão religiosa e litúrgica de λατρεία, embora o termo também possa significar serviço prestado a Deus.
theological_decisions:
- issue: O alcance de ἀδελφοί numa comunidade composta por homens e mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural do texto grego. A nota esclarece que, no uso antigo e no contexto da carta, ela pode abranger toda a comunidade, inclusive as mulheres.
- issue: O sentido de λογικὴν λατρείαν
  choice: o culto racional de vocês
  alternative: o culto espiritual de vocês; o serviço racional de vocês
  rationale: A expressão grega admite nuances de culto racional, consciente, apropriado ou espiritual. A redação principal permanece próxima da forma lexical, enquanto a nota preserva as alternativas sem resolver indevidamente a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» e o infinitivo flexionado «apresentarem» para naturalidade, preservando ao mesmo tempo o plural «corpos», o singular coletivo «sacrifício» e a imagem cultual do original.
