  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: pt
  text: compartilhando das necessidades dos santos[a] e buscando com empenho a hospitalidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contribuindo para suprir as necessidades dos santos”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere especialmente ao acolhimento de pessoas desconhecidas ou estrangeiras.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: necessidades
  rationale: Designa necessidades práticas ou recursos necessários; “necessidades” é claro, natural e adequado ao contexto de auxílio concreto.
- source_word: ἁγίων
  choice: santos
  rationale: Em Paulo, refere-se aos fiéis como povo santo de Deus. “Santos” preserva o termo paulino sem introduzir a ideia posterior de uma categoria restrita de pessoas canonizadas.
- source_word: κοινωνοῦντες
  choice: compartilhando das
  rationale: Preserva a ideia de participação ativa nas necessidades alheias e a ligação lexical com comunhão; no contexto, inclui contribuir para suprir essas necessidades, sem restringir o sentido apenas a dinheiro.
- source_word: φιλοξενίαν
  choice: hospitalidade
  rationale: É o equivalente português corrente para o acolhimento generoso, embora o termo grego destaque especialmente o acolhimento de pessoas desconhecidas ou estrangeiras.
- source_word: διώκοντες
  choice: buscando com empenho
  rationale: Comunica a força de perseguir, procurar ativamente ou esforçar-se por algo, evitando o sentido mais fraco de apenas “praticar”.
theological_decisions:
- issue: Referente de “os santos”
  choice: os fiéis / o povo santo de Deus
  alternative: santos canonizados em sentido eclesiástico posterior
  rationale: No uso paulino, o termo designa os cristãos de modo coletivo, não uma classe posterior e restrita. A tradução conserva a forma tradicional “santos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo dos dois particípios foi mantido; “buscando com empenho” conserva a intensidade de διώκοντες. Todos os marcadores de notas aparecem no texto principal.
