    rationale: Em português, «pensar de si mesmo além do que deve pensar» é sintaticamente pesada e pouco natural. «Pensar de si mesmo mais do que convém» comunica com clareza o limite expresso por παρ’ ὃ δεῖ φρονεῖν, sem acrescentar interpretação.
  - severity: low
    issue: Ordem da oração final pode obscurecer o agente da distribuição
    rationale: «Conforme a medida de fé que Deus repartiu a cada um» é compreensível, mas a ordem mais próxima da construção grega e mais clara em português é «conforme Deus repartiu a cada um uma medida de fé».
