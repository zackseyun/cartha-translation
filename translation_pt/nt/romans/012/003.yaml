review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a exortação fundada na graça recebida, a advertência contra a autoavaliação excessiva, o chamado à sensatez e a distribuição divina de uma medida de fé. Contudo, «não pense de si mesmo além do que deve pensar» é uma reprodução demasiado literal de παρ’ ὃ δεῖ φρονεῖν e não soa idiomática em português.
  naturalness: «Não pense de si mesmo mais do que convém» é mais natural em português moderno, preserva o sentido comparativo e mantém a repetição de pensar. A ordem «conforme Deus repartiu a cada um uma medida de fé» torna mais transparente que Deus é quem distribui a medida a cada pessoa.
  terminology: «Graça», «sensatez» e «fé» são escolhas adequadas. «Uma medida de fé» reflete naturalmente o anartro μέτρον e não resolve indevidamente o alcance de πίστεως.
  issues:
