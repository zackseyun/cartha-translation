- from: Pois, pela graça que me foi dada, digo a cada um de vocês que não pense de si mesmo além do que deve pensar, mas pense com sensatez,[a] conforme a medida de fé que Deus repartiu a cada um.[b]
  to: Pois, pela graça que me foi dada, digo a cada um de vocês que não pense de si mesmo mais do que convém, mas pense com sensatez,[a] conforme Deus repartiu a cada um uma medida de fé.[b]
  rationale: A revisão elimina um calque pouco natural, preservando a comparação e o jogo de «pensar» do grego, e reorganiza a oração final para explicitar de modo mais fluente a distribuição divina. As notas mantêm as alternativas lexicais e a ambiguidade interpretativa de μέτρον πίστεως.
