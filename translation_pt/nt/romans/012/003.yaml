id: ROM.12.3
reference: Romans 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: pt
  text: Pois, pela graça que me foi dada, digo a cada um de vocês que não pense de si mesmo mais do que convém, mas pense com sensatez,[a] conforme Deus repartiu a cada um uma medida de fé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas pense de modo a ter uma avaliação sóbria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conforme a medida de fé que Deus repartiu a cada um”. A expressão grega também pode ser entendida como “a medida da fé” ou, possivelmente, como uma medida de confiança ou fidelidade; ela não especifica com precisão a nuance.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: pela graça que me foi dada
  rationale: διά com o genitivo expressa aqui o meio ou fundamento da exortação; a formulação também sugere, sem explicitar além do grego, a comissão concedida a Paulo.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: a cada um de vocês
  rationale: Expressa naturalmente em português a força distributiva de παντί dentro da comunidade destinatária.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: que não pense de si mesmo além do que deve pensar
  rationale: Preserva a ideia de uma avaliação própria que ultrapassa o limite adequado e mantém, tanto quanto possível, a repetição cognitiva de φρονέω.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: mas pense com sensatez
  rationale: Comunica de modo natural o juízo sóbrio, equilibrado e autocontrolado de σωφρονεῖν, embora o jogo verbal grego não possa ser reproduzido integralmente.
- source_word: ἐμέρισεν
  choice: repartiu
  rationale: μερίζω indica distribuir ou atribuir porções; 'repartiu' é corrente e conserva a imagem distributiva.
- source_word: μέτρον πίστεως
  choice: a medida de fé
  rationale: A construção portuguesa permite manter aberta a relação exata entre 'medida' e 'fé'. O artigo definido corresponde naturalmente à estrutura relativa em português, sem decidir que exista uma única medida normativa para todos.
- source_word: πίστεως
  choice: fé
  rationale: '''Fé'' é o equivalente lexical principal e preserva melhor a amplitude semântica do termo neste contexto.'
theological_decisions:
- issue: Sentido de μέτρον πίστεως
  choice: Manter a expressão ampla 'a medida de fé' sem identificar a fé especificamente como fé salvadora, capacidade ministerial ou padrão doutrinário.
  alternative: “uma medida de fé”, “a medida da fé” entendida como norma, ou “uma medida de confiança/fidelidade”
  rationale: O contexto dos diferentes dons pode apontar para uma distribuição relacionada ao serviço, mas a expressão grega não determina uma interpretação teológica única.
- issue: Função de ὡς antes de ὁ θεὸς ἐμέρισεν
  choice: Traduzir por 'conforme', ligando o pensar sensato à distribuição feita por Deus.
  alternative: “assim como Deus repartiu”
  rationale: A relação pode ser modal ou normativa; 'conforme' preserva ambas de modo conciso sem explicar em excesso.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição de 'pense/pensar' conserva parte do jogo lexical grego; 'sensatez' evita uma formulação excessivamente técnica. Os marcadores [a] e [b] aparecem no texto principal.
