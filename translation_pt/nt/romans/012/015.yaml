  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: pt
  text: Alegrem-se com os que se alegram; chorem com os que choram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Alegrem-se
  rationale: O infinitivo presente tem força exortativa neste contexto. O imperativo português comunica naturalmente essa função, e «alegrar-se» preserva o sentido afetivo e verbal.
- source_word: μετὰ
  choice: com
  rationale: Com o genitivo, μετά expressa associação ou companhia; «com» é o equivalente português natural e preciso.
- source_word: χαιρόντων
  choice: os que se alegram
  rationale: O particípio presente substantivado indica, de modo genérico, as pessoas que se alegram. A formulação é idiomática e mantém a repetição do verbo grego.
- source_word: κλαίειν
  choice: chorem
  rationale: O infinitivo tem força exortativa paralela a χαίρειν. «Chorar» corresponde diretamente a κλαίω e conserva a concisão e a solenidade sem ampliar o sentido para todo tipo de luto.
- source_word: κλαιόντων
  choice: os que choram
  rationale: O particípio presente substantivado designa as pessoas que choram. A tradução preserva o paralelismo com «os que se alegram».
theological_decisions:
- issue: Força imperativa dos infinitivos em uma sequência de exortações
  choice: 'Traduzir os dois infinitivos como imperativos: «Alegrem-se...; chorem...»'
  alternative: «Alegrar-se com os que se alegram; chorar com os que choram»
  rationale: Embora o grego empregue infinitivos, eles funcionam como exortações no contexto de Romanos 12:9–21. Os imperativos reproduzem essa função discursiva em português natural, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «alegrar-se» e «chorar» conserva o paralelismo enfático do grego. Não se acrescentou nota, pois a tradução direta expressa tanto o sentido lexical quanto a força exortativa.
