  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: pt
  text: No amor fraternal, sejam ternamente afetuosos uns com os outros; na honra, tomem a dianteira em honrar uns aos outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: amor fraternal
  rationale: Expressa o afeto próprio de irmãos e irmãs na comunidade, sem restringir a exortação aos homens.
- source_word: φιλόστοργοι
  choice: ternamente afetuosos
  rationale: Conserva a ideia de afeição calorosa e dedicada, característica dos vínculos familiares, e evita a mera repetição de “amor”.
- source_word: τιμῇ
  choice: em honrar
  rationale: Apresenta τιμή como a honra demonstrada ativamente aos outros, em paralelo natural com a exortação anterior.
- source_word: προηγούμενοι
  choice: tomem a dianteira
  rationale: O particípio pode indicar ir à frente, liderar ou superar. “Tomem a dianteira” preserva essa imagem e a força da exortação sem transformar a honra em competição por prestígio.
theological_decisions:
- issue: Alcance de φιλαδελφία
  choice: amor fraternal entendido como afeição familiar mútua de toda a comunidade
  alternative: amor limitado literalmente entre irmãos do sexo masculino
  rationale: No uso cristão do termo, a linguagem familiar abrange os membros da comunidade em geral; a formulação portuguesa tradicional continua compreensível nesse sentido inclusivo.
- issue: Sentido de προηγούμενοι na prática da honra
  choice: ser os primeiros a honrar os outros
  alternative: preferir os outros ou superá-los competitivamente em honra
  rationale: “Tomem a dianteira” mantém a amplitude lexical do verbo e comunica iniciativa mútua sem resolver indevidamente a tensão entre precedência, preferência e superação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a reciprocidade de ἀλλήλους foram preservadas; “ternamente afetuosos” recupera o tom familiar de φιλόστοργοι.
