id: ROM.8.11
reference: Romans 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: pt
  text: E, se o Espírito daquele que ressuscitou Jesus dentre os mortos habita em vocês, aquele que ressuscitou Cristo Jesus dentre os mortos também dará vida aos corpos mortais de vocês por causa do seu Espírito, que habita em vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio do seu Espírito, que habita em vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Espírito
  rationale: A maiúscula explicita o referente, o Espírito Santo, conforme o argumento de Paulo, sem tratar πνεῦμα como espírito humano ou força impessoal.
- source_word: ἐγείραντος / ἐγείρας
  choice: ressuscitou
  rationale: No contexto de ἐκ νεκρῶν, “ressuscitou” é a forma portuguesa natural e precisa para a ação de levantar da morte.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Preserva de modo idiomático a ideia de ressurreição a partir do domínio ou conjunto dos mortos.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: habita / que habita
  rationale: “Habitar” mantém a continuidade lexical e a noção de presença interior permanente em português atual e digno.
- source_word: Χριστὸν Ἰησοῦν
  choice: Cristo Jesus
  rationale: “Cristo” é a forma portuguesa tradicional do título grego Χριστός e continua reconhecível como título messiânico, sem funcionar necessariamente como sobrenome.
- source_word: ζῳοποιήσει
  choice: dará vida
  rationale: Expressa claramente a ação futura de vivificar e mantém sua relação com a ressurreição corporal.
- source_word: τὰ θνητὰ σώματα ὑμῶν
  choice: ao corpo mortal de vocês
  rationale: O singular coletivo é natural em português e conserva tanto a corporeidade concreta quanto a condição mortal; “de vocês” representa o plural ὑμῶν.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: por causa do seu Espírito, que habita em vocês
  rationale: O texto impresso traz διά com acusativo, cuja leitura gramatical mais direta é causal; a oração relativa evita uma construção pesada em português.
theological_decisions:
- issue: Valor de διά com acusativo na cláusula final
  choice: por causa do seu Espírito, que habita em vocês
  alternative: por meio do seu Espírito, que habita em vocês
  rationale: A tradução principal segue a forma do SBLGNT, διά com acusativo, preservando seu sentido causal mais direto. A leitura instrumental, difundida por uma variante textual e pela tradição de tradução, é registrada em nota sem substituir o texto-base.
- issue: Força titular de Χριστός
  choice: Cristo Jesus
  alternative: Messias Jesus
  rationale: Em português, “Cristo” é a forma lexical estabelecida do título e permanece teologicamente transparente no contexto; “Messias Jesus” seria menos natural e não é necessário para impedir que o título seja lido como mero sobrenome.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno. Emprega “vocês” para o plural e “habita” para preservar a imagem paulina da presença interior do Espírito. A repetição de “dentre os mortos” acompanha deliberadamente a estrutura enfática do grego.
