id: ROM.8.32
reference: Romans 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: pt
  text: Aquele que não poupou nem mesmo o seu próprio Filho, mas o entregou por todos nós[a], como não nos dará também, graciosamente, com ele, todas as coisas[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor de todos nós”.
    reason: alternative_reading
  - marker: b
    text: Ou “nos concederá gratuitamente, com ele, todas as coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Aquele que ... nem mesmo
  rationale: A construção retoma Deus no contexto anterior. “Aquele que” mantém a ligação sintática, e “nem mesmo” comunica naturalmente a força enfática de γε junto ao objeto focalizado.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: o seu próprio Filho
  rationale: “Próprio” preserva a ênfase de ἴδιος na relação singular; a inicial maiúscula identifica o referente, Jesus, sem acrescentar conteúdo ao grego.
- source_word: οὐκ ἐφείσατο
  choice: não poupou
  rationale: É a equivalência portuguesa direta e idiomática de φείδομαι neste contexto de entrega à morte, mantendo também a ressonância sacrificial das Escrituras.
- source_word: ἀλλά
  choice: mas
  rationale: Expressa de modo simples e natural o contraste adversativo.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: por todos nós
  rationale: A formulação portuguesa é natural e conserva a ideia de ação em benefício ou em favor de todos nós sem transformá-la numa fórmula técnica mais específica.
- source_word: παρέδωκεν αὐτόν
  choice: o entregou
  rationale: “Entregou” mantém o sentido de παραδίδωμι como entrega ao sofrimento e à morte e é mais direto em português do que uma paráfrase suavizada.
- source_word: πῶς οὐχὶ καί
  choice: como não ... também
  rationale: Preserva a pergunta retórica e a inferência do dom maior para os demais dons.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Equivalência direta de σύν, mantendo a associação dos demais dons com o Filho.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Preserva a amplitude da expressão paulina sem especificar indevidamente quais dons estão em vista.
- source_word: ἡμῖν
  choice: nos
  rationale: O pronome oblíquo expressa de forma natural em português o destinatário indicado pelo dativo.
- source_word: χαρίσεται
  choice: dará ... graciosamente
  rationale: A redação conserva tanto a ideia de dar quanto a nuance de favor ou graça presente em χαρίζομαι; a posição parentética evita uma sequência pouco natural.
theological_decisions:
- issue: Se ὑπὲρ ἡμῶν πάντων deve especificar substituição ou conservar o sentido benefactivo mais amplo
  choice: por todos nós
  alternative: em favor de todos nós
  rationale: O texto afirma que a entrega ocorreu em nosso benefício e admite implicações sacrificiais, mas não exige que a tradução imponha aqui uma formulação técnica de expiação substitutiva.
- issue: O alcance de τὰ πάντα
  choice: todas as coisas
  alternative: tudo
  rationale: A expressão ampla é mantida sem explicá-la como prosperidade material nem restringi-la explicitamente aos bens da salvação; o contexto deve orientar sua compreensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe retórica preservada. “Nem mesmo” torna perceptível a ênfase de γε de modo mais idiomático do que “de fato”. “Graciosamente” mantém a nuance de χαρίσεται, e as notas registram alternativas relevantes sem sobrecarregar o texto.
