id: ROM.8.38
reference: Romans 8:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: pt
  text: Pois estou convencido de que nem a morte nem a vida, nem anjos nem autoridades[a], nem o presente nem o futuro, nem poderes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “principados”; talvez se refira a autoridades cósmicas ou espirituais.
    reason: Alternativa lexical que registra o possível sentido técnico de ἀρχαί sem restringir o texto principal.
lexical_decisions:
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: O perfeito grego expressa uma convicção estabelecida que permanece no presente; a formulação é clara e natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa, ligando o versículo ao argumento anterior sem explicitação excessiva.
- source_word: οὔτε ... οὔτε
  choice: nem ... nem
  rationale: Reproduz a estrutura correlativa repetida e preserva a cadência retórica da enumeração.
- source_word: θάνατος
  choice: morte
  rationale: Equivalente direto e usual, em contraste com “vida”.
- source_word: ζωή
  choice: vida
  rationale: Equivalente direto e usual, formando o par antitético “morte... vida”.
- source_word: ἄγγελοι
  choice: anjos
  rationale: Embora o termo possa significar “mensageiros”, o contexto de realidades cósmicas ou supra-humanas favorece “anjos”.
- source_word: ἀρχαὶ
  choice: autoridades
  rationale: O termo pode designar governantes, domínios ou poderes cósmicos. “Autoridades” é moderno e legível, mantendo uma referência mais ampla sem impor uma classificação teológica técnica.
- source_word: ἐνεστῶτα
  choice: o presente
  rationale: O particípio substantivado refere-se às realidades presentes; “o presente” é conciso, natural e mantém o paralelismo temporal.
- source_word: μέλλοντα
  choice: o futuro
  rationale: O particípio substantivado aponta para o que está por vir; “o futuro” forma um par claro e natural com “o presente”.
- source_word: δυνάμεις
  choice: poderes
  rationale: Preserva a ambiguidade entre seres ou autoridades espirituais e forças poderosas impessoais.
theological_decisions:
- issue: Se ἀρχαὶ e δυνάμεις devem ser traduzidos como designações técnicas de seres espirituais
  choice: autoridades e poderes
  alternative: principados e potestades
  rationale: A enumeração provavelmente abrange poderes cósmicos ou espirituais, mas os termos gregos permitem um sentido mais amplo. A tradução mantém essa amplitude e evita impor um sistema teológico específico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “nem” conserva o ritmo cumulativo do grego. A vírgula final foi mantida porque o versículo continua sintaticamente em Romanos 8:39.
