  source_fidelity: 'A estrutura central e os termos principais são bem preservados: a incapacidade da lei, a mediação da carne, o envio do próprio Filho, a semelhança de carne pecaminosa, a condenação judicial do pecado e a concisão de «na carne». Contudo, «por causa do pecado» tende a apresentar περὶ ἁμαρτίας como causa do envio/da condenação; a expressão grega funciona mais naturalmente aqui como «pelo pecado» e pode ter o sentido sacrificial indicado em nota. «Por ser fraca por causa da carne» também reproduz mais diretamente o estado expresso por ἠσθένει do que «por estar enfraquecida».'
  naturalness: A redação é clara e adequada ao português moderno. A revisão torna a relação entre as ações de Deus mais fluida e evita que «enfraquecida» sugira uma alteração sofrida pela lei, em vez de sua incapacidade no âmbito da carne.
  terminology: «Lei», «carne», «o seu próprio Filho», «semelhança de carne pecaminosa», «condenou o pecado» e «na carne» são escolhas consistentes e não impõem uma leitura denominacional. «Pelo pecado» conserva melhor a amplitude de περὶ ἁμαρτίας; a nota registra apropriadamente a alternativa sacrificial.
