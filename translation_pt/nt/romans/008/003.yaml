revisions:
- from: 'Pois aquilo que a lei não podia fazer[a], por estar enfraquecida por causa da carne[b], Deus fez: ao enviar o seu próprio Filho em semelhança de carne pecaminosa[d] e por causa do pecado[c], condenou o pecado na carne.'
  to: 'Pois aquilo que a lei não podia fazer[a], por ser fraca por causa da carne[b], Deus fez: enviando o seu próprio Filho em semelhança de carne pecaminosa[d] e pelo pecado[c], condenou o pecado na carne.'
  rationale: A revisão substitui a construção causal mais restritiva «por causa do pecado» por «pelo pecado», preservando a ambiguidade lexical e a possível ressonância sacrificial de περὶ ἁμαρτίας. Também ajusta a descrição da fraqueza da lei para refletir mais diretamente ἠσθένει. As demais escolhas são mantidas, inclusive «carne» nas duas ocorrências e «na carne» sem pronome possessivo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:25:42Z'
