id: ROM.8.3
reference: Romans 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: pt
  text: 'Pois aquilo que a lei não podia fazer[a], por ser fraca por causa da carne[b], Deus fez: enviando o seu próprio Filho em semelhança de carne pecaminosa[d] e pelo pecado[c], condenou o pecado na carne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a incapacidade da lei”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “carne” provavelmente se refere à humanidade em sua fraqueza marcada pelo pecado. Algumas traduções usam, de modo mais interpretativo, “natureza pecaminosa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “como oferta pelo pecado”. A expressão grega também pode ter sentido sacrificial.
    reason: alternative_reading
  - marker: d
    text: A expressão “em semelhança de carne pecaminosa” afirma a humanidade real do Filho e, ao mesmo tempo, o distingue do pecado.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: aquilo que a lei não podia fazer
  rationale: Expressa de modo natural a construção neutra, que indica a incapacidade da lei, sem transformar essa incapacidade numa impossibilidade absoluta e abstrata.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: por estar enfraquecida por causa da carne
  rationale: Apresenta a carne como a razão pela qual a lei não conseguia realizar o que era necessário. A formulação preserva a distinção entre a fraqueza funcional da lei e a origem dessa fraqueza na condição humana.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: o seu próprio Filho
  rationale: Mantém a ênfase de ἑαυτοῦ na relação pessoal e singular entre Deus e o Filho.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: em semelhança de carne pecaminosa
  rationale: 'Conserva a formulação cuidadosamente qualificada do grego: o Filho veio verdadeiramente em condição humana, semelhante à carne afetada pelo pecado, sem que o texto o identifique pessoalmente com o pecado.'
- source_word: περὶ ἁμαρτίας
  choice: por causa do pecado
  rationale: Mantém no texto principal o sentido amplo e formalmente próximo da expressão grega, sem impor sua possível nuance sacrificial; essa nuance é registrada em nota.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: condenou o pecado
  rationale: Preserva de maneira direta a força judicial do verbo κατέκρινε.
- source_word: ἐν τῇ σαρκί
  choice: na carne
  rationale: Mantém a concisão e a ambiguidade do grego, que não traz pronome possessivo e pode apontar para a esfera da encarnação, mais especificamente para a carne do Filho.
theological_decisions:
- issue: Sentido de σάρξ no versículo
  choice: Traduzir por “carne”, sem substituir por “natureza pecaminosa”.
  alternative: natureza pecaminosa; humanidade fraca
  rationale: “Carne” preserva a ligação entre a fraqueza humana, a encarnação do Filho e a esfera em que o pecado foi condenado, sem reduzir o termo a uma definição doutrinária única.
- issue: Sentido de περὶ ἁμαρτίας
  choice: “por causa do pecado” no texto principal, com a leitura sacrificial em nota.
  alternative: como oferta pelo pecado
  rationale: A expressão pode ter valor sacrificial no uso bíblico grego, mas também admite um sentido mais geral. A tradução mantém essa tensão em vez de decidir silenciosamente por apenas uma leitura.
- issue: Força cristológica de ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: Conservar tanto “semelhança” quanto “carne pecaminosa”.
  alternative: em carne humana; com uma natureza pecaminosa
  rationale: A redação preserva simultaneamente a humanidade real do Filho e a distinção entre ele e o pecado, sem explicar além do que o próprio grego afirma.
- issue: Referência de ἐν τῇ σαρκί
  choice: “na carne”, sem acrescentar pronome.
  alternative: na carne dele; na carne humana
  rationale: O grego não explicita o referente. Acrescentar “dele” tornaria definida uma relação provável, mas não formalmente expressa.
translation_notes:
  register: 'Português moderno, claro e solene, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. A construção “Deus fez: ao enviar... condenou” explicita o contraste exigido pelo contexto sem apagar a estrutura do grego. Termos teologicamente densos, sobretudo “carne”, foram mantidos em vez de substituídos por paráfrases denominacionais.'
