  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. “Para outra vez viverem com medo” é uma formulação um pouco mais explicativa do que o grego, mas transmite naturalmente o resultado/retorno ao medo e não altera o sentido. “Clamamos” mantém o tom intenso e solene de κράζομεν.
