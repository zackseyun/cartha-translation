id: ROM.8.15
reference: Romans 8:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: pt
  text: 'Pois vocês não receberam um espírito de escravidão para outra vez viverem com medo, mas receberam o Espírito de adoção como filhos[a], no qual clamamos[b]: “Aba! Pai!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito de adoção como filhos”. A ausência do artigo e o paralelismo com “um espírito de escravidão” permitem essa tradução, embora o contexto aponte para o Espírito Santo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “por meio do qual clamamos”. Literalmente, “no qual”; a expressão também pode ter sentido instrumental.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: um espírito de escravidão
  rationale: Preserva a ausência do artigo, o sentido forte de sujeição em δουλεία e o contraste deliberado com o segundo πνεῦμα.
- source_word: πάλιν εἰς φόβον
  choice: para outra vez viverem com medo
  rationale: Expressa em português natural a ideia de retorno a uma condição de medo, preservando πάλιν e a direção ou resultado indicado por εἰς sem sugerir que o medo seja mero propósito.
- source_word: πνεῦμα υἱοθεσίας
  choice: o Espírito de adoção como filhos
  rationale: O contexto de Romanos 8 favorece a referência ao Espírito Santo, enquanto “adoção como filhos” conserva a dimensão jurídica, filial e sucessória de υἱοθεσία.
- source_word: ἐν ᾧ
  choice: no qual
  rationale: Mantém de modo formal a preposição ἐν e o pronome relativo neutro, sem decidir se a relação deve ser entendida estritamente como esfera ou como meio; em português, “no qual” pode retomar “Espírito”.
- source_word: κράζομεν
  choice: clamamos
  rationale: Comunica o caráter intenso e espontâneo do verbo, em registro digno e corrente.
- source_word: Αββα ὁ πατήρ
  choice: Aba! Pai!
  rationale: Translitera a forma aramaica e traduz a aposição grega, conservando a invocação enfática.
theological_decisions:
- issue: Se πνεῦμα υἱοθεσίας designa explicitamente o Espírito Santo ou uma disposição/condição filial
  choice: o Espírito de adoção como filhos
  alternative: um espírito de adoção como filhos
  rationale: O contexto imediato, sobretudo Romanos 8:14 e 8:16, aponta fortemente para o Espírito Santo. A nota preserva a possibilidade formal decorrente da ausência do artigo e do paralelismo com “um espírito de escravidão”.
- issue: Como representar a filiação masculina em υἱοθεσία
  choice: adoção como filhos
  alternative: adoção
  rationale: A formulação conserva a condição jurídica de filho e sua ligação com a herança no argumento paulino; trata-se do status concedido a todos os adotados, não de uma restrição aos homens.
- issue: Se ἐν ᾧ deve ser interpretado instrumentalmente ou como esfera
  choice: no qual
  alternative: por meio do qual
  rationale: A tradução principal preserva a construção grega e sua possível ambiguidade; a alternativa instrumental é indicada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” evita a marca regional de “vós”; “Aba” segue a transliteração portuguesa usual. A formulação mantém tanto a intensidade de κράζομεν quanto as ambiguidades sintáticas e referenciais relevantes.
