  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: pt
  text: Portanto, agora não há condenação para os que estão no Messias[b] Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos posteriores acrescentam: “que não andam segundo a carne”. Os testemunhos gregos mais antigos apoiam aqui a leitura mais curta.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “Cristo Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: não há
  rationale: Em combinação com κατάκριμα, forma em português a expressão natural “não há condenação”, preservando a negação enfática do grego.
- source_word: ἄρα
  choice: Portanto
  rationale: Expressa a inferência que Paulo extrai da argumentação precedente.
- source_word: νῦν
  choice: agora
  rationale: Mantém explicitamente a realidade presente assinalada por Paulo.
- source_word: κατάκριμα
  choice: condenação
  rationale: Comunica de modo claro o sentido judicial de veredito condenatório, não apenas um sentimento subjetivo de culpa.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: para os que estão no Messias Jesus
  rationale: A formulação é natural em português e conserva a linguagem paulina de participação ou união, sem reduzi-la a uma paráfrase causal.
- source_word: Χριστῷ
  choice: Messias
  rationale: Traduz o título grego Χριστός, preservando seu conteúdo messiânico ativo.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome pessoal.
theological_decisions:
- issue: Sentido da expressão “no Messias Jesus”
  choice: Expressão de participação ou união que identifica os que pertencem ao Messias Jesus e estão incorporados nele.
  alternative: Um sentido mais frouxo, como “por causa do Messias Jesus”.
  rationale: A preposição ἐν deve ser preservada como “em/no” para manter a riqueza e a tensão teológica da formulação paulina, sem restringi-la a uma única explicação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “Portanto, agora” acompanha de perto a progressão grega. “Messias Jesus” traduz o título Χριστός; a alternativa tradicional “Cristo Jesus” é registrada em nota.
