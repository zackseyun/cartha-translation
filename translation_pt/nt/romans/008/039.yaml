  terminology: «Messias Jesus» segue coerentemente a decisão de traduzir Χριστός como título, enquanto a nota registra de modo apropriado a forma tradicional «Cristo Jesus». «Senhor», «amor de Deus», «altura» e «profundidade» são escolhas estabelecidas e adequadas. A formulação «amor de Deus» preserva a abertura formal do genitivo, sem impor uma leitura doutrinária.
