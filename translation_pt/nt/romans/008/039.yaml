id: ROM.8.39
reference: Romans 8:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: pt
  text: nem a altura, nem a profundidade, nem qualquer outra coisa criada poderá nos separar do amor de Deus que está no Messias Jesus, nosso Senhor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “qualquer outra criatura” ou “qualquer outra coisa na criação”.
    reason: lexical_alternative
  - marker: b
    text: “Messias Jesus” é tradicionalmente traduzido como “Cristo Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕψωμα
  choice: altura
  rationale: Em contraste com βάθος, o sentido espacial é o mais natural; “altura” preserva de modo claro e direto o paralelismo retórico.
- source_word: βάθος
  choice: profundidade
  rationale: Forma com ὕψωμα um par de extremos; “profundidade” é a correspondência natural e digna em português.
- source_word: κτίσις ἑτέρα
  choice: qualquer outra coisa criada
  rationale: κτίσις pode indicar criação ou criatura; neste contexto, “coisa criada” abrange toda a ordem criada, enquanto “outra” traduz ἑτέρα e “qualquer” comunica a força indefinida de τις.
- source_word: δυνήσεται
  choice: poderá
  rationale: O futuro expressa capacidade futura; “poderá” conserva com naturalidade tanto o tempo quanto o sentido.
- source_word: χωρίσαι
  choice: separar
  rationale: É a tradução direta e contextual, retomando a certeza de que nada pode romper a relação dos fiéis com o amor divino.
- source_word: ἀγάπης
  choice: amor
  rationale: É a tradução corrente, transparente e apropriada de ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a forma genitiva do grego sem eliminar sua possível ambiguidade, embora o contexto favoreça o amor de Deus por nós.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Χριστός funciona como título e é traduzido como “Messias”; a contração “no” expressa naturalmente ἐν em português.
- source_word: κυρίῳ
  choice: Senhor
  rationale: É a tradução estabelecida e contextualmente adequada de κύριος no uso cristológico paulino.
theological_decisions:
- issue: Sentido do genitivo em “amor de Deus”
  choice: Preservar “amor de Deus” no texto, entendendo contextualmente sobretudo o amor de Deus por nós
  alternative: O amor dos fiéis por Deus, ou um genitivo amplo que comporte ambos os sentidos
  rationale: Romanos 8:31–39 enfatiza a ação e a fidelidade de Deus para com seu povo. Ainda assim, a forma portuguesa preserva a construção do grego e não fecha no texto principal uma ambiguidade gramatical real.
- issue: Relação de “que está” com “amor de Deus”
  choice: Manter “que está no Messias Jesus”
  alternative: Explicitar “que Deus nos mostrou” ou “que recebemos” no Messias Jesus
  rationale: A construção relativa reproduz a qualificação grega τῆς ἐν Χριστῷ Ἰησοῦ sem acrescentar uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência repetitiva “nem... nem... nem...” preserva a cadência enfática do grego. “Poderá nos separar” soa natural no português brasileiro sem perder o valor futuro de δυνήσεται.
