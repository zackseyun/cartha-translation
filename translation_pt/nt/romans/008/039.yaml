  source_fidelity: 'O texto traduz com fidelidade todos os elementos do grego: a tripla negação enfática, o par «altura/profundidade», «qualquer outra coisa criada», a capacidade futura («poderá»), «separar», e a localização do amor de Deus no Messias Jesus, nosso Senhor. «Qualquer outra coisa criada» comunica adequadamente κτίσις ἑτέρα sem restringir indevidamente o referente a uma criatura individual.'
