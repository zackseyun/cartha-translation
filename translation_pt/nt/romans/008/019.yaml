  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: pt
  text: Pois a criação aguarda com grande expectativa a revelação dos filhos de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «filhos», termo que, neste contexto, pode ter referência coletiva a filhos e filhas de Deus e também pode enfatizar a condição filial e a herança.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Preserva de modo natural a ligação explicativa com a afirmação anterior.
- source_word: ἀποκαραδοκία
  choice: com grande expectativa
  rationale: Expressa a expectativa intensa e voltada para o futuro; a construção adverbial com «aguarda» é natural em português.
- source_word: κτίσεως
  choice: a criação
  rationale: O uso coletivo corresponde ao alcance cósmico do contexto, em vez de indicar uma criatura individual.
- source_word: ἀποκάλυψιν
  choice: a revelação
  rationale: Mantém o substantivo grego e comunica a manifestação futura daquilo que agora está oculto.
- source_word: υἱῶν
  choice: filhos
  rationale: Preserva o termo masculino do grego e sua possível ressonância de condição filial e herança; em português, o plural também pode abranger homens e mulheres conforme o contexto.
- source_word: θεοῦ
  choice: de Deus
  rationale: Tradução direta do genitivo de relação.
- source_word: ἀπεκδέχεται
  choice: aguarda
  rationale: Comunica espera orientada para o futuro; a intensidade já é expressa por «com grande expectativa».
theological_decisions:
- issue: Se υἱῶν θεοῦ deve ser traduzido de forma inclusiva como «filhos e filhas de Deus» ou mantendo a forma masculina «filhos de Deus».
  choice: filhos de Deus
  alternative: filhos e filhas de Deus; crianças de Deus
  rationale: O grego emprega o plural masculino «filhos», que pode ressaltar condição filial e herança no argumento paulino. A forma portuguesa «filhos» preserva essa expressão e pode ter referência coletiva inclusiva; a nota explicita isso sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Grande expectativa» evita uma formulação excessivamente rebuscada, enquanto «revelação» conserva o vocabulário teológico corrente sem perder clareza.
