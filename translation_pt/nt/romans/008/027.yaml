reference: Romans 8:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: pt
  text: E aquele que sonda os corações sabe qual é a intenção do Espírito, porque ele intercede pelos santos segundo Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com a vontade de Deus”.'
    reason: Alternativa interpretativa para κατὰ θεόν, que literalmente não inclui a palavra “vontade”.
lexical_decisions:
- source_word: ἐραυνῶν
  choice: sonda
  rationale: “Sondar” expressa a investigação profunda e ativa indicada por ἐραυνάω, além de combinar naturalmente com “os corações” em português bíblico atual.
- source_word: καρδίας
  choice: os corações
  rationale: Preserva a metáfora antropológica do texto grego sem a substituir por uma explicação como “o íntimo” ou “a mente”.
- source_word: τί τὸ φρόνημα
  choice: qual é a intenção
  rationale: Neste contexto de intercessão, φρόνημα aponta para a orientação ou intenção do Espírito. “Intenção” é mais natural em português do que “mentalidade” e evita reduzir o termo ao intelecto apenas.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: O contexto imediato de Romanos 8 identifica o referente como o Espírito Santo; a inicial maiúscula torna isso claro.
- source_word: ἐντυγχάνει
  choice: intercede
  rationale: Traduz diretamente o sentido de petição em favor de outros e mantém a ligação com a atuação do Espírito no versículo anterior.
- source_word: ὑπὲρ ἁγίων
  choice: pelos santos
  rationale: É a forma portuguesa natural de expressar intercessão em favor dos ἅγιοι e preserva a terminologia paulina tradicional.
- source_word: κατὰ θεὸν
  choice: de acordo com Deus
  rationale: Mantém a formulação concisa e incomum do grego sem acrescentar “vontade”, palavra não expressa no original.
theological_decisions:
- issue: Se κατὰ θεὸν deve ser explicitado como referência à vontade de Deus
  choice: de acordo com Deus
  alternative: de acordo com a vontade de Deus
  rationale: Embora a expressão provavelmente indique conformidade com a vontade divina, o substantivo “vontade” não aparece no grego. A tradução principal preserva essa concisão e a nota oferece a explicitação interpretativa comum.
- issue: Referente de πνεῦμα
  choice: Espírito Santo, indicado por “Espírito”
  alternative: espírito humano
  rationale: A ação de interceder pelos santos e o contexto imediato de Romanos 8:26 favorecem claramente o Espírito Santo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Sonda os corações” conserva a imagem bíblica em expressão natural; “intenção do Espírito” comunica φρόνημα no contexto sem o tecnicismo pouco idiomático de “mentalidade”.
