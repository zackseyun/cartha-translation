source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: pt
  text: E sabemos que todas as coisas cooperam[a] para o bem dos que amam a Deus, dos que são chamados segundo o propósito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Deus faz todas as coisas cooperarem para o bem”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “segundo o propósito dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: sabemos
  rationale: O presente grego expressa conhecimento firme e atual; “sabemos” é natural e direto em português.
- source_word: δὲ
  choice: E
  rationale: Funciona como conectivo leve na progressão do argumento, sem exigir contraste forte.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: para os que amam a Deus
  rationale: “Para” comunica naturalmente o dativo e preserva a identificação do grupo beneficiado.
- source_word: πάντα
  choice: todas as coisas
  rationale: Mantém explicitamente a amplitude do neutro plural grego, sem restringir sua referência.
- source_word: συνεργεῖ
  choice: cooperam
  rationale: Com “todas as coisas” como sujeito expresso em português, o plural é gramaticalmente necessário. A formulação evita inserir “Deus” como sujeito no texto principal.
- source_word: εἰς ἀγαθόν
  choice: para o bem
  rationale: Expressa de modo idiomático a direção ou o resultado positivo indicado pela construção grega.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: para os que são chamados segundo o propósito
  rationale: Preserva a segunda descrição do grupo e não acrescenta um possessivo ausente no texto grego.
- source_word: πρόθεσιν
  choice: propósito
  rationale: Neste contexto, designa intenção ou plano deliberado; “propósito” é claro e mantém a concisão.
- source_word: κλητοῖς
  choice: chamados
  rationale: É o termo paulino estabelecido e contextualmente adequado, sem explicar além do que o texto afirma.
theological_decisions:
- issue: Sujeito implícito de συνεργεῖ
  choice: O texto principal diz que “todas as coisas cooperam para o bem”.
  alternative: “Deus faz com que todas as coisas cooperem para o bem.”
  rationale: O texto da SBLGNT fornecido não traz θεός como sujeito explícito nesta oração. A leitura que explicita Deus é preservada em nota por apoio manuscrito, sem resolver a variante no texto principal.
- issue: Possessivo em κατὰ πρόθεσιν
  choice: “segundo o propósito”, sem possessivo acrescentado
  alternative: “segundo o propósito dele” ou “segundo o seu propósito”
  rationale: O contexto aponta para o propósito de Deus, mas a frase grega não contém possessivo explícito; a tradução principal conserva essa forma, e a alternativa idiomática é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a repetição de “para os que”, refletindo a retomada do mesmo grupo no grego. “Cooperam” é corrente no registro bíblico sem ser arcaico.
