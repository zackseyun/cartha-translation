id: ROM.8.5
reference: Romans 8:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: pt
  text: Pois os que vivem segundo a carne pensam nas coisas da carne, mas os que vivem segundo o Espírito, nas coisas do Espírito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... κατὰ σάρκα ὄντες
  choice: os que vivem segundo a carne
  rationale: Embora ὄντες signifique literalmente “sendo”, a expressão descreve pessoas cuja existência se orienta segundo a carne; “vivem segundo” comunica isso com naturalidade sem reduzir σάρξ ao corpo físico.
- source_word: φρονοῦσιν
  choice: voltam a mente para
  rationale: O verbo envolve disposição mental, interesse e orientação, não apenas pensamento pontual. A expressão preserva esse sentido ativo e contínuo em português claro.
- source_word: σάρξ
  choice: carne
  rationale: Mantém o termo paulino e sua amplitude contextual, evitando substituí-lo por uma interpretação como “natureza pecaminosa”.
- source_word: πνεῦμα
  choice: Espírito
  rationale: A maiúscula identifica a referência contextual ao Espírito de Deus, em continuidade com Romanos 8, sem acrescentar palavras ausentes do grego.
theological_decisions:
- issue: Sentido de κατὰ σάρκα e κατὰ πνεῦμα
  choice: segundo a carne / segundo o Espírito
  alternative: dominados pela natureza pecaminosa / guiados pelo Espírito
  rationale: A formulação escolhida conserva o paralelismo e a tensão teológica do original sem transformar as expressões em explicações doutrinárias mais específicas.
- issue: Elipse verbal na segunda oração
  choice: mas os que vivem segundo o Espírito, para as coisas do Espírito
  alternative: mas os que vivem segundo o Espírito voltam a mente para as coisas do Espírito
  rationale: A elipse reproduz com clareza o paralelismo conciso do grego; o verbo da primeira oração é naturalmente subentendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva o paralelismo paulino e o vocabulário teológico tradicional sem linguagem denominacional.
