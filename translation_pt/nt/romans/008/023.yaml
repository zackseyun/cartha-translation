source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: pt
  text: E não somente ela, mas também nós mesmos, que temos as primícias do Espírito[a], gememos interiormente, enquanto aguardamos com grande expectativa a adoção como filhos[b] — a redenção do nosso corpo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o Espírito como primícias”.
    reason: alternative_reading
  - marker: b
    text: Ou simplesmente, “adoção”. O termo grego inclui mais literalmente a ideia de filiação como filho e herdeiro.
    reason: lexical_alternative
  - marker: c
    text: 'O grego traz “do nosso corpo”, no singular, que pode ter sentido distributivo: “dos nossos corpos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: E não somente ela, mas também
  rationale: Retoma naturalmente a criação mencionada no contexto anterior e preserva a estrutura contrastiva enfática de Paulo.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: também nós mesmos
  rationale: Comunica em português a ênfase reiterada do grego sem produzir uma repetição excessivamente artificial.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: as primícias do Espírito
  rationale: 'Mantém a imagem cultual de ἀπαρχή e deixa aberta a relação do genitivo: dádiva proveniente do Espírito ou o próprio Espírito como primícias.'
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: gememos interiormente
  rationale: Preserva o elo verbal com o gemido da criação no contexto e expressa de modo natural sua dimensão interior.
- source_word: υἱοθεσίαν
  choice: a adoção como filhos
  rationale: Conserva o componente de filiação contido no termo grego e a imagem paulina de condição jurídica e herança, sem limitar os beneficiários aos homens.
- source_word: ἀπεκδεχόμενοι
  choice: enquanto aguardamos com grande expectativa
  rationale: Expressa a espera intensa e expectante indicada pelo verbo composto, em linguagem portuguesa corrente.
- source_word: τὴν ἀπολύτρωσιν
  choice: a redenção
  rationale: Preserva o vocabulário teológico de Paulo e o peso escatológico da libertação final.
- source_word: τοῦ σώματος ἡμῶν
  choice: do nosso corpo
  rationale: Segue o singular grego, que funciona coletivamente ou distributivamente, e continua natural em português.
theological_decisions:
- issue: Como traduzir υἱοθεσίαν preservando a imagem de filiação e herança sem excluir as mulheres
  choice: adoção como filhos
  alternative: adoção
  rationale: O termo grego contém explicitamente a noção de colocação na condição de filho/herdeiro. A formulação preserva essa imagem histórico-jurídica; o referente inclui todos os que têm o Espírito.
- issue: Se τὴν ἀπαρχὴν τοῦ πνεύματος indica algo dado pelo Espírito ou o próprio Espírito como primícias
  choice: as primícias do Espírito
  alternative: o Espírito como primícias
  rationale: A construção genitiva admite mais de uma nuance. O texto principal conserva a formulação aberta, e a nota registra explicitamente a leitura apositiva.
- issue: Relação entre adoção e redenção do corpo
  choice: isto é, a redenção do nosso corpo
  alternative: a adoção, a redenção do nosso corpo
  rationale: A aposição grega identifica a consumação futura da adoção com a redenção corporal. “Isto é” torna essa relação clara sem sugerir dois objetos independentes da espera.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente ajustada para fluidez, mas foram preservados o gemido compartilhado com a criação, a expectativa escatológica e as ambiguidades relevantes do genitivo ligado ao Espírito.
