base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: pt
  text: Os que estão na carne não podem agradar a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na natureza pecaminosa”. O grego diz “na carne”, termo-chave de Paulo neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: Os que estão
  rationale: O artigo com o particípio tem função substantiva e designa uma classe de pessoas; “os que estão” é natural em português e preserva a ideia de condição presente.
- source_word: δὲ
  choice: —
  rationale: A partícula estabelece continuação ou contraste com o contexto anterior, mas não precisa ser explicitada em português; a relação permanece clara no encadeamento do texto.
- source_word: ἐν σαρκὶ
  choice: na carne
  rationale: Mantém o termo paulino teologicamente significativo σάρξ e sua ligação conceitual com o contexto de Romanos 8, sem resolver a metáfora por meio de uma paráfrase interpretativa.
- source_word: ἀρέσαι
  choice: agradar
  rationale: Com δύνανται, o infinitivo expressa capacidade; “podem agradar” é a formulação idiomática e direta em português.
- source_word: θεῷ
  choice: a Deus
  rationale: A regência portuguesa de “agradar” pede objeto indireto introduzido por “a”, correspondendo adequadamente ao dativo grego.
- source_word: οὐ δύνανται
  choice: não podem
  rationale: É a equivalência mais concisa e natural para a incapacidade expressa pelo verbo negado.
theological_decisions:
- issue: Tradução de σάρξ em um contexto paulino controvertido
  choice: na carne
  alternative: na natureza pecaminosa
  rationale: A tradução principal conserva o termo concreto e recorrente de Paulo, preservando sua amplitude e tensão teológica. A alternativa interpretativa é apresentada em nota, em vez de ser incorporada silenciosamente ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A formulação preserva a concisão do grego e mantém “carne” como termo paulino central.
