source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: pt
  text: Pois foi em esperança que fomos salvos[a]. Mas a esperança que se vê não é esperança[b], pois quem espera por aquilo que vê?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pela esperança fomos salvos».'
    reason: alternative_reading
  - marker: b
    text: Isto é, a esperança diz respeito ao que ainda não se vê.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: Pois foi em esperança
  rationale: 'O dativo é entendido como esfera ou modo: a salvação é uma realidade presente, mas ainda vivida na esperança, e não na visão. A construção com «foi» dá naturalidade à frase em português sem transformar a esperança na causa eficiente da salvação.'
- source_word: ἐσώθημεν
  choice: fomos salvos
  rationale: Preserva o aoristo passivo de modo claro e natural, sem acrescentar uma nuance aspectual ausente da forma grega.
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: Mas a esperança que se vê
  rationale: A forma participial é expressa por uma oração relativa natural em português, mantendo o contraste entre esperança e visão.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: não é esperança
  rationale: Reproduz diretamente a afirmação qualitativa do grego e soa natural em português moderno.
- source_word: ὃ γὰρ βλέπει
  choice: por aquilo que vê
  rationale: «Aquilo que» representa com clareza o pronome relativo neutro ὃ e evita sugerir que o referente seja uma pessoa.
- source_word: τίς ἐλπίζει
  choice: quem espera
  rationale: Mantém a pergunta retórica genérica e o presente simples, sem explicitar indevidamente duração ou continuidade.
theological_decisions:
- issue: Relação entre salvação e esperança em τῇ ἐλπίδι ἐσώθημεν
  choice: «em esperança ... fomos salvos», preservando a tensão entre a realidade presente da salvação e sua consumação ainda não visível
  alternative: «pela esperança fomos salvos», entendendo o dativo de maneira mais instrumental
  rationale: O contexto trata da tensão entre o que já foi recebido e o que ainda se aguarda. «Em esperança» evita apresentar a esperança como causa eficiente da salvação e conserva a ambiguidade legítima do dativo por meio de nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «esperança» e «vê» foi preservada para manter o argumento conciso e antitético de Paulo.
