id: ROM.8.2
reference: Romans 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: pt
  text: Pois a lei do Espírito da vida, no Messias Jesus, libertou você da lei do pecado e da morte.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “princípio”: “o princípio do Espírito da vida”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “me” em vez de “você”.
    reason: textual_variant
  - marker: c
    text: 'Tradução tradicional: “em Cristo Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: lei
  rationale: Mantém o mesmo substantivo nas duas ocorrências, preservando a repetição e a tensão da metáfora paulina; “princípio” é uma alternativa interpretativa possível.
- source_word: πνεύματος
  choice: Espírito
  rationale: A inicial maiúscula indica referência ao Espírito Santo, leitura favorecida pelo contexto de Romanos 8 e pela função vivificadora aqui atribuída ao Espírito.
- source_word: ζωῆς
  choice: vida
  rationale: Tradução direta que preserva a expressão compacta “Espírito da vida” sem explicá-la além do texto.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como o título “Messias” e conserva a preposição, sem desfazer a linguagem paulina de participação ou união.
- source_word: ἠλευθέρωσέν
  choice: libertou
  rationale: O pretérito perfeito simples expressa de modo natural em português a ação concluída; o próprio verbo comunica a libertação resultante.
- source_word: σε
  choice: você
  rationale: Segue a leitura de segunda pessoa singular impressa no SBLGNT, em linguagem moderna e amplamente compreensível; a variante “me” é registrada em nota.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: Tradução usual no singular, permitindo tanto o sentido abstrato quanto a personificação do pecado como poder escravizador.
- source_word: θανάτου
  choice: morte
  rationale: Tradução direta, mantida em coordenação compacta com “pecado”.
theological_decisions:
- issue: Se πνεύματος se refere ao Espírito Santo, ao espírito humano ou a um princípio espiritual
  choice: Espírito Santo (“Espírito” com inicial maiúscula)
  alternative: espírito humano ou princípio espiritual
  rationale: O contraste desenvolvido em Romanos 8 entre carne, pecado, morte e o Espírito divino que dá vida favorece a referência ao Espírito Santo, sem transformar νόμος em um termo meramente impessoal.
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: “no Messias Jesus”, preservando a linguagem de participação/união
  alternative: “por meio do Messias Jesus”
  rationale: A preposição ἐν admite nuances contextuais, mas a tradução com “em/no” evita resolver silenciosamente a formulação paulina como simples instrumentalidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” comunica naturalmente o singular de σε; “no Messias Jesus” evita a contração pouco natural “em Messias Jesus” e mantém o título messiânico. A ordem da frase acompanha de perto o grego sem prejudicar a fluência.
