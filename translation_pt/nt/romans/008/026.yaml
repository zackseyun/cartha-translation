source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: pt
  text: Do mesmo modo, também o Espírito vem em auxílio da nossa fraqueza. Pois não sabemos o que devemos pedir em oração como convém; mas o próprio Espírito intercede com gemidos inexprimíveis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com gemidos que não podem ser expressos em palavras” ou “com gemidos sem palavras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Do mesmo modo, também
  rationale: Retoma a relação com o contexto anterior e conserva a força aditiva de καί em português natural.
- source_word: συναντιλαμβάνεται
  choice: vem em auxílio de
  rationale: 'Expressa mais que uma ajuda genérica: o Espírito toma parte no peso da fraqueza humana, sem recorrer a uma formulação artificial.'
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: da nossa fraqueza
  rationale: Mantém o singular coletivo e não restringe a fraqueza a uma dimensão física ou espiritual específica.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: Pois não sabemos o que devemos pedir em oração, nem como convém
  rationale: Torna explícitas em português as dimensões de conteúdo e adequação da oração presentes na construção grega, evitando o pouco natural 'orar o que'.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: o próprio Espírito
  rationale: Preserva a ênfase reflexiva de αὐτό sem impor em português um pronome marcado por gênero que não consta da forma grega.
- source_word: ὑπερεντυγχάνει
  choice: intercede
  rationale: Equivalente conciso e corrente para a ação de apelar em favor de alguém.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: com gemidos inexprimíveis
  rationale: Preserva a possível ideia de gemidos que não podem ser postos em palavras ou expressos verbalmente, sem decidir além do que o adjetivo permite.
theological_decisions:
- issue: Agência pessoal do Espírito e gênero gramatical neutro de πνεῦμα
  choice: o próprio Espírito
  alternative: o Espírito mesmo / o próprio Espírito, ele mesmo
  rationale: A ação de ajudar e interceder apresenta agência pessoal. A formulação escolhida conserva essa agência e a ênfase do grego sem transformar o gênero gramatical em argumento teológico.
- issue: Referente dos gemidos
  choice: manter a ligação sintática com a intercessão do Espírito
  alternative: explicitar que os gemidos são dos fiéis ou do Espírito
  rationale: O texto associa os gemidos ao verbo 'intercede', mas não explica sua natureza nem resolve todas as questões sobre sua origem; a tradução não acrescenta essa definição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão “vem em auxílio” conserva a força do verbo composto; “pedir em oração” evita uma construção pouco idiomática. O marcador [a] aparece imediatamente após a expressão a que se refere.
