revisions:
- from: Do mesmo modo, também o Espírito vem em auxílio da nossa fraqueza. Pois não sabemos o que devemos pedir em oração, nem como convém; mas o próprio Espírito intercede com gemidos inexprimíveis[a].
  to: Do mesmo modo, também o Espírito vem em auxílio da nossa fraqueza. Pois não sabemos o que devemos pedir em oração como convém; mas o próprio Espírito intercede com gemidos inexprimíveis[a].
  rationale: Apenas se suprimiu «nem» para que «como convém» permaneça ligado àquilo que se deve pedir em oração, como no grego. A revisão preserva a abertura semântica de καθὸ δεῖ, sem restringi-la a uma questão distinta de método ou forma de orar.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:26:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'A redação é em geral fiel: «vem em auxílio» comunica adequadamente a força de συναντιλαμβάνεται, «o próprio Espírito» preserva a ênfase de αὐτὸ τὸ πνεῦμα, e «gemidos inexprimíveis» é uma boa tradução de στεναγμοῖς ἀλαλήτοις. Contudo, «nem como convém» introduz uma coordenação entre conteúdo e modo que não está expressa no grego. καθὸ δεῖ qualifica a oração sobre aquilo que se deve pedir e deve permanecer integrado a essa construção.'
  naturalness: O português é moderno, claro e de registro apropriado. A pequena revisão elimina a pausa e a oposição artificial criadas por «nem», mantendo uma frase natural.
  terminology: «Espírito», «intercede», «fraqueza» e «gemidos inexprimíveis» são terminologia adequada e não impõem uma interpretação confessional além do texto. A nota oferece alternativas lexicais úteis e está ancorada corretamente.
  issues:
  - severity: medium
    issue: «nem como convém» separa indevidamente a oração em duas perguntas coordenadas.
    rationale: 'τὸ τί προσευξώμεθα καθὸ δεῖ é uma única construção: os leitores não sabem o que devem pedir em oração conforme é necessário/adequado. O grego não contém um segundo elemento interrogativo equivalente a «como», nem uma negação coordenada equivalente a «nem». A redação pode sugerir, de modo mais definido, que Paulo contrasta conteúdo e maneira da oração.'
  revised_text: Do mesmo modo, também o Espírito vem em auxílio da nossa fraqueza. Pois não sabemos o que devemos pedir em oração como convém; mas o próprio Espírito intercede com gemidos inexprimíveis[a].
