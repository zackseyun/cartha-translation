id: ROM.8.35
reference: Romans 8:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: pt
  text: Quem nos separará do amor do Messias? Será a aflição, ou a angústia, ou a perseguição, ou a fome, ou a nudez, ou o perigo, ou a espada?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do nosso amor pelo Messias”. O genitivo grego pode ser entendido dessa maneira, embora o contexto favoreça “do amor que o Messias tem por nós”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: O pronome interrogativo pessoal é traduzido naturalmente por “Quem”, preservando a forma da pergunta retórica.
- source_word: χωρίσει
  choice: separará
  rationale: O futuro ativo indica uma separação futura ou possível; “separará” é direto e idiomático.
- source_word: ἀγάπης
  choice: amor
  rationale: É o equivalente português comum e adequado para ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título; “Messias” torna esse valor explícito. A construção com “de” preserva naturalmente a relação genitiva e sua possível ambiguidade.
- source_word: θλῖψις
  choice: aflição
  rationale: Expressa sofrimento e pressão de modo amplo, corrente e digno.
- source_word: στενοχωρία
  choice: angústia
  rationale: Comunica a ideia de aperto e extrema aflição e distingue o termo de θλῖψις.
- source_word: διωγμός
  choice: perseguição
  rationale: É o equivalente preciso e consagrado no contexto.
- source_word: λιμός
  choice: fome
  rationale: Em português, “fome” pode designar tanto grave escassez de alimento quanto sua experiência pessoal e soa mais natural aqui do que “fome coletiva” ou “carestia”.
- source_word: γυμνότης
  choice: nudez
  rationale: É o equivalente direto e preserva a imagem de privação de vestuário.
- source_word: κίνδυνος
  choice: perigo
  rationale: É a tradução contemporânea mais natural e exata.
- source_word: μάχαιρα
  choice: espada
  rationale: Preserva a imagem concreta e a ameaça de violência letal.
theological_decisions:
- issue: Valor do genitivo em τοῦ Χριστοῦ
  choice: o amor do Messias, entendido no contexto como o amor que o Messias tem por nós
  alternative: nosso amor pelo Messias
  rationale: A construção grega admite, em princípio, leitura subjetiva ou objetiva. Romanos 8:31–39 favorece fortemente o amor do Messias pelos fiéis; a alternativa genuína é mantida em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; a sequência retórica e a repetição de “ou” foram preservadas.
