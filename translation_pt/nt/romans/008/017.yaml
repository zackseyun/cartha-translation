  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: pt
  text: 'E, se somos filhos, então também somos herdeiros: herdeiros de Deus e coerdeiros com o Messias, se de fato sofremos com ele, para que também sejamos glorificados com ele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: No contexto familiar e sucessório, designa os que têm condição filial, sem distinção de sexo. Em português, “filhos” é a forma coletiva natural; “crianças” indicaria idade, não condição filial.
- source_word: κληρονόμοι
  choice: herdeiros
  rationale: É o termo jurídico-familiar corrente para quem recebe uma herança e conserva com precisão a imagem empregada por Paulo.
- source_word: θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente o genitivo grego sem decidir além do texto se ele indica sobretudo posse, origem ou aquele cuja herança é recebida.
- source_word: συγκληρονόμοι
  choice: coerdeiros
  rationale: O prefixo συν- expressa participação conjunta; “coerdeiros” é conciso, claro e preserva a relação compartilhada com o Messias.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός e torna explícita a figura ungida e régia com quem os fiéis compartilham a herança.
- source_word: εἴπερ
  choice: se de fato
  rationale: Mantém a força condicional e a ênfase retórica da expressão, sem enfraquecê-la para “visto que” nem sugerir mera dúvida.
- source_word: συμπάσχομεν
  choice: sofremos com ele
  rationale: Explicita naturalmente o valor associativo do prefixo συν-; o referente contextual é o Messias.
- source_word: ἵνα
  choice: para que
  rationale: Preserva de modo natural a relação de propósito ou resultado, sem escolher rigidamente entre essas nuances possíveis.
- source_word: συνδοξασθῶμεν
  choice: sejamos glorificados com ele
  rationale: A voz passiva indica que a glória é recebida, e o prefixo συν- assinala participação conjunta com o Messias.
theological_decisions:
- issue: Se εἴπερ συμπάσχομεν apresenta o sofrimento como condição meritória ou como padrão de participação com o Messias
  choice: “se de fato sofremos com ele”, mantendo uma condição real sem afirmar que o sofrimento conquista ou merece a glorificação
  alternative: “visto que sofremos com ele” ou uma formulação que faça do sofrimento a base meritória da herança
  rationale: O grego conserva força condicional, enquanto o contexto descreve participação conjunta com o Messias. A tradução preserva essa tensão sem convertê-la em mérito nem eliminar a condição.
- issue: Sentido do plural τέκνα em relação ao sexo dos participantes
  choice: “filhos” em sentido coletivo e inclusivo
  alternative: “filhos e filhas” ou “crianças”
  rationale: O neutro plural grego não especifica sexo. “Filhos e filhas” explicitaria corretamente a inclusão, mas ampliaria a forma; “crianças” introduziria indevidamente uma noção de idade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse grega foi completada com “somos” para produzir uma frase natural. O travessão destaca a explicação sobre os herdeiros; “coerdeiros” conserva a concisão da composição grega. Não se reproduziu a nota inglesa fornecida porque seu conteúdo (“Ou: coerdeiros com Cristo”) não corresponde ao marcador colocado após “children” e não representa uma leitura alternativa de τέκνα.'
