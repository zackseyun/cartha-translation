  naturalness: O português é moderno e claro. Contudo, a sequência “—, se” é pontuação inadequada após o travessão de inciso e interrompe desnecessariamente o fluxo. Dois-pontos introduzem de maneira mais natural a explicação de “herdeiros”.
  terminology: “Filhos”, “herdeiros”, “Deus”, “coerdeiros”, “Messias”, “sofrermos” e “glorificados” são escolhas adequadas. A formulação revista também alinha o texto à decisão lexical declarada para συγκληρονόμοι.
