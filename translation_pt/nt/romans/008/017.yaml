revisions:
- from: E, se somos filhos, somos também herdeiros — herdeiros de Deus e coerdeiros com o Messias —, se de fato sofremos com ele, para que também sejamos glorificados com ele.
  to: 'E, se somos filhos, então também somos herdeiros: herdeiros de Deus e coerdeiros com o Messias, se de fato sofremos com ele, para que também sejamos glorificados com ele.'
  rationale: A revisão é exclusivamente estilística e de pontuação. “Então” torna explícita, em português natural, a consequência já indicada por καί, e os dois-pontos introduzem a aposição explicativa sem alterar o sentido. Mantêm-se a condição real de εἴπερ, a associação com o Messias expressa pelos compostos com συν-, e a voz passiva de “sejamos glorificados”.
