  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: pt
  text: Mas em todas essas coisas somos mais que vencedores por meio daquele que nos amou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente Cristo no contexto imediato.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca o forte contraste com as adversidades e a aparente derrota mencionadas no contexto anterior, em português natural.
- source_word: ἐν τούτοις πᾶσιν
  choice: em todas essas coisas
  rationale: Mantém de perto a formulação grega e sua ligação com as aflições enumeradas no versículo anterior.
- source_word: ὑπερνικῶμεν
  choice: vencemos de forma extraordinária
  rationale: Preserva a forma verbal e procura comunicar a força intensificadora de ὑπέρ- sobre νικάω, isto é, uma vitória que excede o simples vencer.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, expressa naturalmente o meio ou a agência pela qual essa vitória acontece.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: daquele que nos amou
  rationale: Reproduz o particípio aoristo substantivado sem inserir explicitamente um referente que o grego não nomeia.
theological_decisions:
- issue: Identidade de «aquele que nos amou»
  choice: Mantida sem nome explícito no texto principal.
  alternative: Entender a expressão como referência a Cristo, ou mais amplamente a Deus em Cristo.
  rationale: O contexto imediato favorece fortemente Cristo, mas o grego deste versículo não explicita o nome; a tradução preserva essa forma e registra a identificação contextual em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Vencemos de forma extraordinária» evita transformar o verbo grego em uma construção nominal e conserva sua intensidade sem recorrer a uma expressão excessivamente coloquial.
