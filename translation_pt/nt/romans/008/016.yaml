id: ROM.8.16
reference: Romans 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: pt
  text: O próprio Espírito testemunha com o nosso espírito que somos filhos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testemunha ao nosso espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: O próprio Espírito
  rationale: A construção com αὐτό é enfática. Em português, “o próprio Espírito” preserva essa ênfase de modo natural e evita a necessidade de introduzir um pronome com gênero não expresso no grego.
- source_word: συμμαρτυρεῖ
  choice: testemunha com
  rationale: O verbo composto indica testemunhar juntamente com ou ao lado de alguém. “Testemunha com” é claro, atual e conserva a ideia de testemunho conjunto.
- source_word: τῷ πνεύματι ἡμῶν
  choice: com o nosso espírito
  rationale: 'O dativo é entendido como associação ou acompanhamento com συμμαρτυρεῖ: o Espírito testemunha juntamente com o nosso espírito. A nota registra a leitura alternativa possível.'
- source_word: ὅτι ἐσμὲν
  choice: que somos
  rationale: Expressa naturalmente em português a oração declarativa introduzida por ὅτι, sem acrescentar ênfase ausente do texto.
- source_word: τέκνα θεοῦ
  choice: filhos de Deus
  rationale: Em português, “filhos” pode designar coletivamente os filhos e as filhas e é a formulação bíblica corrente; traduz τέκνα sem restringir o referente a descendentes masculinos.
theological_decisions:
- issue: Relação entre o testemunho do Espírito e o nosso espírito
  choice: testemunha com o nosso espírito
  alternative: testemunha ao nosso espírito
  rationale: O elemento συν- em συμμαρτυρεῖ favorece a noção de testemunho conjunto, e o dativo pode indicar associação. Como a construção também é entendida por alguns como testemunho dirigido ao espírito humano, essa possibilidade é preservada em nota.
- issue: Caráter pessoal do Espírito
  choice: O próprio Espírito
  alternative: o Espírito mesmo
  rationale: A tradução mantém a agência pessoal e a ênfase do original sem basear a escolha no gênero gramatical português de “Espírito” nem acrescentar uma especificação doutrinária ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. “O próprio Espírito” preserva a ênfase grega; “filhos de Deus” mantém uma expressão familiar e inclusiva no uso coletivo português.
