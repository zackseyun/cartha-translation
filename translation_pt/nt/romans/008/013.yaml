id: ROM.8.13
reference: Romans 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: pt
  text: Pois, se vocês vivem segundo a carne[a], estão para morrer; mas, se pelo Espírito fazem morrer as práticas do corpo, viverão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “carne” não significa apenas o corpo físico; refere-se à vida humana orientada em oposição a Deus. Também pode ser traduzido como “natureza pecaminosa”.
    reason: Esclarece o sentido metafórico de σάρξ e registra uma alternativa interpretativa comum sem inseri-la no texto principal.
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa que liga o versículo ao argumento anterior, em português natural e digno.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Preserva a metáfora paulina e a formulação de κατά sem reduzir σάρξ à mera corporalidade nem resolver a expressão como “natureza pecaminosa” no texto principal.
- source_word: ζῆτε
  choice: vocês vivem
  rationale: O presente expressa uma maneira contínua de viver e é reproduzido diretamente na condição.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: estão para morrer
  rationale: Representa μέλλω com infinitivo de modo mais explícito que um simples futuro, preservando a expectativa iminente ou certa sem acrescentar a ideia de destino decretado.
- source_word: πνεύματι
  choice: pelo Espírito
  rationale: Interpreta o dativo como instrumental; o contexto de Romanos 8 favorece o Espírito Santo como agente capacitador.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: as práticas do corpo
  rationale: “Práticas” comunica ações características ou habituais e mantém explícita a relação genitiva com o corpo.
- source_word: θανατοῦτε
  choice: fazem morrer
  rationale: Expressa de maneira atual e clara a ação causativa de θανατόω, sem recorrer ao arcaísmo “mortificam”.
- source_word: ζήσεσθε
  choice: viverão
  rationale: Reproduz naturalmente o futuro grego e conserva o contraste direto com morrer.
theological_decisions:
- issue: Sentido ético-teológico de σάρξ
  choice: carne, com esclarecimento em nota
  alternative: natureza pecaminosa
  rationale: “Carne” conserva a amplitude e a tensão da metáfora paulina; “natureza pecaminosa” explicitaria uma interpretação possível, mas estreitaria o termo no texto principal.
- issue: Referente de πνεύματι
  choice: o Espírito Santo
  alternative: o espírito humano ou uma ambiguidade deliberada
  rationale: As referências repetidas ao Espírito no contexto imediato de Romanos 8 favorecem claramente o Espírito Santo, embora a forma grega isolada não traga artigo.
- issue: Relação entre ação humana e atuação do Espírito
  choice: “pelo Espírito fazem morrer”
  alternative: atribuir a ação exclusivamente ao ser humano ou exclusivamente ao Espírito
  rationale: A formulação mantém simultaneamente o agente humano expresso pelo verbo e o meio ou poder do Espírito expresso pelo dativo, sem dissolver a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” torna explícito o plural grego. A repetição de “corpo” e “carne” foi mantida para não apagar a distinção lexical do original.
