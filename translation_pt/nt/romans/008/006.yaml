  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: pt
  text: Pois a mentalidade da carne é morte, mas a mentalidade do Espírito[a] é vida e paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito”.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga o versículo ao argumento anterior, com formulação natural e digna.
- source_word: φρόνημα
  choice: mentalidade
  rationale: Expressa uma orientação ou disposição consolidada, e não apenas a atividade intelectual; a repetição conserva o paralelismo grego.
- source_word: σάρξ
  choice: carne
  rationale: Mantém o termo-chave de Paulo e sua tensão teológica, evitando substituí-lo por uma interpretação como “natureza pecaminosa”.
- source_word: θάνατος
  choice: morte
  rationale: É a equivalência direta e preserva a força literal e teológica da antítese.
- source_word: πνεῦμα
  choice: Espírito
  rationale: O contexto de Romanos 8 favorece uma referência ao Espírito Santo; a maiúscula comunica essa leitura, enquanto a nota preserva a alternativa genuína.
- source_word: ζωή
  choice: vida
  rationale: Tradução direta que conserva a antítese concisa com “morte”.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalência natural e abrangente, em paralelo com “vida”.
theological_decisions:
- issue: Se πνεῦμα se refere ao Espírito Santo ou ao espírito humano
  choice: Espírito Santo
  alternative: espírito humano, ou espírito em sentido mais geral
  rationale: O contexto imediato de Romanos 8 apresenta repetidamente o Espírito como agente divino de vida, embora a forma grega isolada não imponha capitalização; por isso, a alternativa é registrada em nota.
- issue: Como representar σάρξ no contraste paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” preserva a terminologia e a amplitude metafórica de Paulo sem reduzir o sentido a uma formulação teológica interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura compacta e o paralelismo do original foram preservados. Não se acrescentou nota para “natureza pecaminosa”, pois ela é uma paráfrase interpretativa, não uma equivalência lexical capaz de substituir “carne” sem estreitar o sentido.
