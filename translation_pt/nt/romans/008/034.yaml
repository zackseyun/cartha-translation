  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: pt
  text: Quem é que condena? O Messias[a] é aquele que morreu — mais do que isso, foi ressuscitado[b] — e também está à direita de Deus[c] e intercede por nós[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “que ressuscitou”. O verbo grego está na voz passiva: “que foi ressuscitado”.'
    reason: alternative_reading
  - marker: c
    text: “À direita de Deus” é uma expressão bíblica que indica a posição de maior honra e autoridade.
    reason: cultural_note
  - marker: d
    text: Ou “intercede em nosso favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: condena
  rationale: O particípio presente substantivado é expresso naturalmente na pergunta retórica como “Quem é que condena?”, preservando a ação verbal sem acrescentar a ideia de condenação efetiva.
- source_word: Χριστός
  choice: o Messias
  rationale: O termo funciona aqui como título. “Messias” torna explícito seu sentido, enquanto “Cristo” é mantido em nota como alternativa tradicional.
- source_word: ἀποθανών
  choice: aquele que morreu
  rationale: O particípio aoristo é vertido por uma oração relativa no passado, clara e natural em português.
- source_word: μᾶλλον δὲ
  choice: mais do que isso
  rationale: A expressão introduz uma progressão enfática da morte para a ressurreição, sem tratar a segunda afirmação como correção da primeira.
- source_word: ἐγερθείς
  choice: que foi ressuscitado
  rationale: A forma passiva do grego é preservada, apresentando a ressurreição como ação realizada sobre o Messias.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: à direita de Deus
  rationale: Mantém a expressão bíblica convencional, compreensível em português e associada a honra e autoridade supremas.
- source_word: ἐντυγχάνει
  choice: intercede
  rationale: “Intercede” comunica a atuação em favor de outros e conserva o peso teológico do verbo sem paráfrase excessiva.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: É a formulação portuguesa mais concisa e natural para a ação representativa realizada em nosso favor.
theological_decisions:
- issue: Sentido titular de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O título é traduzido por seu sentido, sem transformá-lo apenas em nome próprio; a forma eclesiástica tradicional permanece disponível em nota.
- issue: Voz de ἐγερθείς
  choice: que foi ressuscitado
  alternative: que ressuscitou
  rationale: A tradução conserva a voz passiva do texto grego e evita apagar a apresentação da ressurreição como ação realizada sobre o Messias.
- issue: Referente implícito da ressurreição
  choice: passiva sem agente expresso
  alternative: que Deus ressuscitou
  rationale: Embora o contexto paulino possa pressupor Deus como agente, o versículo não o explicita nessa oração; a tradução preserva essa concisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta inicial mantém a força retórica; os travessões destacam a progressão enfática entre morte e ressurreição. Não se acrescentou “Jesus”, pois esse nome não aparece no texto grego fornecido.
