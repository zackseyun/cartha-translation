    issue: «para participar da liberdade» acrescenta «participar de».
    rationale: εἰς τὴν ἐλευθερίαν indica a passagem da criação para a liberdade, mas não contém o verbo ou conceito explícito de participação. «Para a liberdade» é direto, idiomático neste registro e mais fiel.
  - severity: low
    issue: A nota apresenta como «mais literalmente» uma redação que coincide, na substância, com a tradução principal após a correção.
    rationale: A nota deve registrar uma alternativa real; a opção idiomática «liberdade gloriosa» cumpre essa função sem redundância.
