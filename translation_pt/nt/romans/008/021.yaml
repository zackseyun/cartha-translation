id: ROM.8.21
reference: Romans 8:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: pt
  text: porque a própria criação também será libertada da escravidão da deterioração para a liberdade da glória dos filhos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a liberdade gloriosa dos filhos de Deus”.'
    reason: Registra uma tradução portuguesa mais idiomática de «a liberdade da glória dos filhos de Deus», sem resolver de modo excessivo a relação dos genitivos.
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: O valor causal explica a esperança mencionada no contexto anterior.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: a própria criação também
  rationale: “Também” preserva a força aditiva de καί, e “a própria” mantém a ênfase de αὐτή sobre a criação.
- source_word: ἐλευθερωθήσεται
  choice: será libertada
  rationale: Mantém tanto o futuro quanto a voz passiva, indicando uma libertação futura realizada sobre a criação.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: da escravidão à deterioração
  rationale: “Escravidão” conserva a força da metáfora; neste contexto, φθορά aponta sobretudo para deterioração, decomposição e perecibilidade, e não primariamente para corrupção moral.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: para participar da liberdade
  rationale: Expressa em português natural o movimento para uma nova condição indicado por εἰς, sem sugerir que a criação se torne os filhos de Deus.
- source_word: τῆς δόξης
  choice: da glória
  rationale: Preserva formalmente o genitivo e evita decidir se a glória caracteriza a liberdade ou pertence aos filhos de Deus.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: dos filhos de Deus
  rationale: “Filhos de Deus” é uma expressão bíblica corrente e, em português, pode abranger coletivamente todos os descendentes ou membros da família de Deus.
theological_decisions:
- issue: Relação dos genitivos em τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: a liberdade da glória dos filhos de Deus
  alternative: a liberdade gloriosa dos filhos de Deus
  rationale: A formulação principal conserva a cadeia de genitivos e sua tensão interpretativa, sem reduzir δόξα a mero adjetivo. A alternativa mais idiomática é registrada em nota.
- issue: Força de εἰς antes de “liberdade”
  choice: para participar da liberdade
  alternative: para a liberdade / na liberdade
  rationale: A expansão mínima torna claro o ingresso da criação na liberdade associada à glória dos filhos de Deus, sem afirmar identidade entre a criação e esses filhos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário claro. A construção principal prioriza a ambiguidade genuína do grego, enquanto a pequena explicitação “participar de” evita uma sequência pouco natural em português. O marcador [a] aparece no texto principal.
