  source_fidelity: A tradução reproduz adequadamente οἴδαμεν γὰρ como “Pois sabemos”, o sentido coletivo de πᾶσα ἡ κτίσις como “toda a criação” e a continuidade temporal de ἄχρι τοῦ νῦν como “até agora”. “Geme em conjunto” e “em conjunto, sofre dores de parto” conservam explicitamente os dois prefixos συν- e mantêm a imagem obstétrica específica de συνωδίνει.
  naturalness: O texto é claro, gramatical e apropriado ao português moderno. A repetição de “em conjunto” é um pouco marcada, mas é justificável e funcionalmente fiel, pois torna visível a repetição do elemento συν- nos dois verbos gregos.
