id: ROM.8.22
reference: Romans 8:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: pt
  text: Pois sabemos que toda a criação geme em conjunto e, em conjunto, sofre dores de parto até agora.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a criação inteira”; alternativamente, “cada coisa criada”, embora o sentido cósmico mais amplo seja mais provável aqui.
    reason: lexical_alternative
  - marker: b
    text: A expressão “sofre dores de parto” evoca o parto, sugerindo não apenas sofrimento, mas sofrimento que avança em direção a uma nova vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Embora οἶδα tenha forma historicamente perfeita, é usado com sentido presente e expressa aqui um conhecimento compartilhado e estabelecido.
- source_word: γὰρ
  choice: Pois
  rationale: Conserva a função explicativa da conjunção, ligando o versículo ao argumento anterior.
- source_word: πᾶσα ἡ κτίσις
  choice: toda a criação
  rationale: A construção com artigo favorece o sentido coletivo da criação inteira; no contexto de Romanos 8, é mais provável a referência abrangente à ordem criada do que a cada criatura individual.
- source_word: συστενάζει
  choice: geme em conjunto
  rationale: Preserva tanto a ideia de gemer quanto a dimensão compartilhada indicada pelo prefixo συν-.
- source_word: συνωδίνει
  choice: em conjunto, sofre dores de parto
  rationale: Mantém a imagem específica das dores de parto e também a noção de experiência conjunta expressa pelo prefixo συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: até agora
  rationale: Expressão portuguesa natural que conserva a ideia de uma condição contínua que chega ao presente.
theological_decisions:
- issue: Se κτίσις deve ser traduzido como “criação” ou como “criatura/coisa criada”.
  choice: criação
  alternative: cada criatura / todas as coisas criadas
  rationale: Em Romanos 8:19–23, Paulo personifica em termos cósmicos a ordem criada, sujeita à frustração e à espera de libertação. “Criação” preserva melhor essa amplitude sem limitar indevidamente o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “em conjunto” é deliberada para representar os dois verbos gregos com o prefixo συν-, sem eliminar a imagem das dores de parto.
