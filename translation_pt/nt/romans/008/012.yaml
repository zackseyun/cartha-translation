source:
  edition: SBLGNT
  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: pt
  text: Portanto, irmãos[a], somos devedores — não para com a carne, para vivermos segundo a carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego traz “irmãos” como forma de se dirigir à comunidade dos crentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Assim, pois
  rationale: A combinação das partículas introduz uma conclusão decorrente do argumento anterior; “Assim, pois” preserva tanto a transição quanto a força inferencial em português natural e digno.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego. No contexto, Paulo se dirige à comunidade crente inteira, sentido inclusivo explicitado em nota.
- source_word: ὀφειλέται ἐσμέν
  choice: somos devedores
  rationale: Preserva a metáfora lexical de obrigação expressa por ὀφειλέται. Aqui não se trata necessariamente de dívida financeira, mas de obrigação, sem que o texto complete neste versículo a quem os crentes devem algo.
- source_word: τῇ σαρκί
  choice: à carne
  rationale: Conserva o vocabulário paulino e sua contraposição entre carne e Espírito, sem resolver no texto principal o termo em uma paráfrase interpretativa.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: para vivermos segundo a carne
  rationale: Reproduz de modo natural a construção infinitiva que especifica a vida segundo a carne como a obrigação negada. “Segundo a carne” mantém a expressão recorrente no contexto imediato.
theological_decisions:
- issue: Sentido metafórico de σάρξ no contraste paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” preserva a terminologia, a amplitude semântica e a tensão teológica de Paulo. “Natureza pecaminosa” esclarece uma dimensão contextual, mas interpreta o termo de modo mais restrito e, por isso, fica na nota.
- issue: Abrangência comunitária de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma gramatical masculina do grego, enquanto a nota esclarece que o vocativo se dirige à comunidade dos crentes, incluindo homens e mulheres.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém um tom digno e conciso. “Assim, pois” é inferencial sem soar excessivamente técnico; “somos devedores” conserva a metáfora do original; e “carne” mantém a coerência terminológica com Romanos 8.
