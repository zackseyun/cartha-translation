  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: pt
  text: Mas, se esperamos o que não vemos, aguardamos[b] isso com perseverança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com paciência perseverante”.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode enfatizar uma espera expectante ou ansiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Preserva a força condicional de εἰ e o valor levemente contrastivo e continuativo de δέ, de modo natural em português.
- source_word: ὃ οὐ βλέπομεν
  choice: o que não vemos
  rationale: Traduz idiomaticamente o relativo neutro ὃ e conserva o sentido direto e presente de βλέπομεν, sem acrescentar incapacidade ou especificar o referente.
- source_word: ἐλπίζομεν
  choice: esperamos
  rationale: Em português, esperar pode expressar aqui a esperança voltada para uma realidade futura; o objeto explícito evita a necessidade de uma expansão interpretativa como “pomos a esperança”.
- source_word: δι’ ὑπομονῆς
  choice: com perseverança
  rationale: ὑπομονή denota constância paciente diante da demora ou dificuldade; “perseverança” comunica essa firmeza de forma clara e digna.
- source_word: ἀπεκδεχόμεθα
  choice: aguardamos isso
  rationale: Mantém a ideia de espera expectante e evita a repetição de “esperamos”; “isso” retoma com clareza “o que não vemos”.
theological_decisions:
- issue: A esperança cristã em relação ao cumprimento futuro ainda não visto
  choice: Manter o objeto como “o que não vemos”, sem explicá-lo.
  alternative: Explicitar o objeto como salvação, redenção ou ressurreição.
  rationale: Embora o contexto imediato informe o referente, o próprio versículo o deixa na forma de uma oração relativa. A tradução preserva essa contenção e a tensão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é simples e digno. “Aguardamos” distingue a espera expectante de ἀπεκδεχόμεθα da esperança expressa por ἐλπίζομεν; as notas preservam as nuances lexicais sem sobrecarregar o texto.
