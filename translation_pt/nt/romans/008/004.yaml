id: ROM.8.4
reference: Romans 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: pt
  text: para que a justa exigência[a] da Lei se cumprisse em nós, que não andamos segundo a carne[b], mas segundo o Espírito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a exigência da Lei”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “carne” se refere à natureza humana caída ou à vida orientada para longe de Deus; alguns traduzem por “natureza pecaminosa”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “espírito”; neste contexto, provavelmente se refere ao Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a força de propósito ou resultado da conjunção grega e exige o subjuntivo em português.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: a justa exigência da Lei
  rationale: δικαίωμα, neste contexto, aponta para aquilo que a Lei exige como justo; a formulação conserva tanto a dimensão jurídica quanto a moral.
- source_word: πληρωθῇ
  choice: se cumprisse
  rationale: Preserva a voz passiva e, no contexto da oração final ligada ao que Deus fez no versículo anterior, o imperfeito do subjuntivo é natural em português.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: É a correspondência mais direta e evita transformar a expressão em “por nós”, o que atribuiria explicitamente uma agência que o grego não afirma.
- source_word: περιπατοῦσιν
  choice: andamos
  rationale: Mantém a metáfora paulina do caminhar como modo de vida, em linguagem conhecida e compreensível.
- source_word: σάρξ
  choice: carne
  rationale: Conserva o termo metafórico paulino sem reduzi-lo interpretativamente a “natureza pecaminosa”; seu sentido contextual é esclarecido em nota.
- source_word: πνεῦμα
  choice: Espírito
  rationale: O contexto de Romanos 8 favorece a referência ao Espírito Santo; a possível leitura “espírito” é preservada em nota.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: segundo a carne ... segundo o Espírito
  rationale: “Segundo” representa com transparência κατά e conserva o paralelismo ético do texto grego.
theological_decisions:
- issue: Se πνεῦμα se refere ao espírito humano ou ao Espírito Santo
  choice: Espírito
  alternative: espírito
  rationale: O contexto imediato de Romanos 8 destaca repetidamente o Espírito Santo, embora a forma grega, isoladamente, não resolva a referência pela capitalização.
- issue: Se ἐν ἡμῖν indica cumprimento em nós ou por nós
  choice: em nós
  alternative: por nós; entre nós
  rationale: A tradução direta preserva a formulação de Paulo sem afirmar de modo indevido que os seres humanos são os agentes do cumprimento.
- issue: Sentido de δικαίωμα no contexto
  choice: justa exigência
  alternative: exigência; preceito justo
  rationale: A expressão aponta para a exigência justa da Lei, sem limitar o sentido a uma única ordenança nem resolver além do texto como esse cumprimento ocorre.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva as metáforas paulinas “andar” e “carne”, emprega “Lei” como designação contextual da Lei e mantém a ambiguidade relevante de πνεῦμα em nota.
