id: ROM.8.29
reference: Romans 8:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: pt
  text: Pois aqueles que ele conheceu de antemão[a], também os predestinou para serem conformes à imagem de seu Filho, para ele ser o primogênito entre muitos irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conheceu previamente”; alguns entendem aqui esse conhecimento em sentido relacional, isto é, que Deus voltou de antemão sua atenção para essas pessoas.
    reason: alternative_reading
  - marker: b
    text: “Irmãos” está no masculino gramatical; a referência pode incluir tanto homens como mulheres na família de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação do que precede e preserva de modo natural o valor causal-explicativo da conjunção.
- source_word: προέγνω
  choice: conheceu de antemão
  rationale: Expressa diretamente a anterioridade indicada pelo prefixo grego sem definir se o conhecimento é apenas cognitivo ou também relacional.
- source_word: προώρισεν
  choice: predestinou
  rationale: É a correspondência portuguesa tradicional e precisa para a determinação prévia expressa pelo verbo.
- source_word: συμμόρφους
  choice: para serem conformes
  rationale: Preserva a ideia de compartilhar a mesma forma ou semelhança, com construção idiomática em português.
- source_word: τῆς εἰκόνος
  choice: à imagem
  rationale: Mantém o termo bíblico e sua ressonância criacional e cristológica.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: de seu Filho
  rationale: Conserva explicitamente o título filial e sua importância cristológica.
- source_word: εἰς τὸ εἶναι
  choice: a fim de que ele seja
  rationale: Representa o valor de finalidade da construção com infinitivo articulado, sem excluir por completo uma nuance de resultado.
- source_word: πρωτότοκον
  choice: primogênito
  rationale: Mantém a metáfora lexical e suas conotações de prioridade e preeminência sem substituí-la por interpretação.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: entre muitos irmãos
  rationale: Traduz naturalmente a expressão e conserva no texto principal o plural masculino gramatical do grego.
theological_decisions:
- issue: Se προέγνω deve ser traduzido de modo a resolver o debate sobre presciência, eleição ou conhecimento relacional.
  choice: conheceu de antemão
  alternative: pré-conheceu; voltou de antemão sua atenção para
  rationale: A formulação preserva o sentido lexical básico e a densidade teológica do verbo, sem impor uma interpretação denominacional sobre a natureza desse conhecimento.
- issue: Se προώρισεν deve ser enfraquecido por uma paráfrase menos técnica.
  choice: predestinou
  alternative: determinou de antemão; designou previamente
  rationale: O termo português corresponde de perto ao verbo grego e deixa que o contexto, e não uma paráfrase, delimite sua força teológica.
- issue: Se ἀδελφοῖς deve ser tornado explicitamente inclusivo no texto principal.
  choice: irmãos, com nota sobre possível referência a homens e mulheres
  alternative: irmãos e irmãs; membros da família
  rationale: O masculino plural do grego é representado no texto, enquanto sua provável abrangência familiar inclusiva é esclarecida sem apagar a forma original.
- issue: Como representar εἰς τὸ εἶναι entre finalidade e resultado.
  choice: a fim de que ele seja
  alternative: para ele ser; de modo que ele seja
  rationale: A opção comunica claramente a finalidade predominante, mantendo a relação lógica sem ampliar o texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a progressão do grego, mas evita rigidez excessiva. Os termos teologicamente densos são mantidos sem explicações confessionais no corpo do versículo.
