  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: pt
  text: Quem apresentará uma acusação contra os escolhidos de Deus?[a][b] É Deus quem os declara justos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os eleitos de Deus».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Quem acusará os escolhidos de Deus?»'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «É Deus quem os justifica». Aqui, «declarar justos» tem sentido jurídico: Deus é quem profere o veredito favorável.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: Introduz diretamente a pergunta retórica, com naturalidade em português.
- source_word: ἐγκαλέσει
  choice: apresentará acusação
  rationale: Preserva o sentido jurídico de formular uma acusação, sem tornar a frase excessivamente técnica.
- source_word: κατὰ
  choice: contra
  rationale: Com um verbo de acusação, expressa naturalmente a parte contra a qual a acusação é apresentada.
- source_word: ἐκλεκτῶν θεοῦ
  choice: os escolhidos de Deus
  rationale: Traduz o adjetivo substantivado de modo transparente e acessível, evitando depender do termo teológico mais técnico «eleitos».
- source_word: θεὸς ὁ δικαιῶν
  choice: É Deus quem os declara justos
  rationale: Reproduz a ênfase da construção grega e explicita, em português natural, o sentido forense de δικαιόω. O pronome «os» retoma os escolhidos sem alterar o referente.
theological_decisions:
- issue: Tradução de ἐκλεκτῶν sem impor sistemas doutrinários posteriores
  choice: os escolhidos de Deus
  alternative: os eleitos de Deus
  rationale: «Escolhidos» comunica diretamente a ideia do texto grego e mantém seu peso teológico sem recorrer necessariamente a um rótulo técnico.
- issue: Sentido de δικαιῶν
  choice: os declara justos
  alternative: os justifica
  rationale: No contexto judicial da passagem, o verbo indica o veredito favorável de Deus. «Declara justos» torna esse valor forense acessível, enquanto a nota preserva a tradução tradicional.
- issue: Pontuação e relação entre a pergunta e a resposta
  choice: Pergunta seguida da afirmação enfática «É Deus quem...»
  alternative: Ler «Deus, que os declara justos?» como parte de uma sequência de perguntas
  rationale: 'A pontuação não consta dos manuscritos mais antigos, mas a leitura afirmativa é sintaticamente natural e ressalta o contraste: nenhuma acusação prevalece porque Deus profere o veredito favorável.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a imagem de tribunal e a ênfase do grego, evitando linguagem arcaica e terminologia denominacional.
