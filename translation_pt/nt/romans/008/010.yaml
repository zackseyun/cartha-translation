id: ROM.8.10
reference: Romans 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: pt
  text: Mas, se o Messias está em vocês, o corpo está morto[b] por causa do pecado, mas o espírito[a] é vida por causa da justiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Espírito é vida”. O termo grego pode referir-se tanto ao espírito humano vivificado por Deus quanto ao Espírito Santo.
    reason: alternative_reading
  - marker: b
    text: Ou “o corpo está sujeito à morte” ou “o corpo é mortal”.
    reason: lexical_alternative
  - marker: c
    text: Ou “por causa da retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Preserva o valor titular de Χριστός e expressa em português atual seu sentido messiânico.
- source_word: σῶμα
  choice: o corpo
  rationale: Traduz diretamente σῶμα e mantém o contraste concreto com πνεῦμα, sem confundi-lo com σάρξ, “carne”.
- source_word: νεκρὸν
  choice: está morto
  rationale: Mantém a formulação forte e direta do adjetivo grego; a possível nuance de mortalidade fica registrada em nota.
- source_word: διὰ ἁμαρτίαν
  choice: por causa do pecado
  rationale: Expressa de modo natural o valor causal de διά com acusativo.
- source_word: πνεῦμα
  choice: o espírito
  rationale: A inicial minúscula preserva em primeiro plano o contraste entre corpo e espírito humano, sem eliminar a possível referência ao Espírito Santo.
- source_word: ζωὴ
  choice: é vida
  rationale: Conserva o substantivo ζωή e a expressão condensada de Paulo, em vez de transformá-lo no adjetivo “vivo”.
- source_word: διὰ δικαιοσύνην
  choice: por causa da justiça
  rationale: Mantém o valor causal de διά e verte δικαιοσύνη pelo termo português abrangente e tradicional “justiça”; “retidão” é indicada como alternativa lexical.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: o espírito
  alternative: o Espírito
  rationale: O texto pode apontar para o espírito humano vivificado por Deus ou para o Espírito Santo. A tradução principal acompanha o contraste com “corpo”, enquanto a nota preserva a ambiguidade.
- issue: Sentido de νεκρὸν aplicado a σῶμα
  choice: o corpo está morto
  alternative: o corpo está sujeito à morte; o corpo é mortal
  rationale: Embora a afirmação possa descrever a mortalidade do corpo sob o pecado, νεκρόν significa literalmente “morto”. A tradução mantém essa força sem resolver a nuance interpretativa.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude do termo paulino, que pode envolver tanto a ação justa de Deus quanto a condição de retidão, sem impor uma explicação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμῖν. A ordem das orações e a oposição “corpo... mas espírito” seguem de perto o grego, enquanto “por causa de” comunica naturalmente as duas construções causais.
