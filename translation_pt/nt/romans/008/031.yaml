source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: pt
  text: Que diremos, então, diante dessas coisas?[a] Se Deus é por nós,[b] quem será contra nós?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito dessas coisas?”; também pode ter o sentido de “em resposta a essas coisas?”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Visto que Deus é por nós, quem será contra nós?”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que diremos, então
  rationale: Preserva a pergunta retórica deliberativa e a força inferencial de οὖν em português natural.
- source_word: πρὸς ταῦτα
  choice: diante dessas coisas
  rationale: Expressa a ideia de falar em resposta ou com referência ao conjunto do argumento anterior, sem reduzir a locução a um simples assunto.
- source_word: εἰ
  choice: Se
  rationale: Mantém a forma condicional grega e a estrutura retórica, embora o contexto apresente o favor de Deus como realidade assumida.
- source_word: ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Deus é por nós
  rationale: “Por nós” comunica de modo conciso a posição favorável e a atuação de Deus em nosso favor.
- source_word: τίς καθ’ ἡμῶν
  choice: quem será contra nós
  rationale: Supre em português o verbo elíptico da frase grega e conserva o desafio retórico. “Será” evita a formulação pouco natural “quem contra nós?” sem acrescentar a ideia explícita de capacidade.
theological_decisions:
- issue: Força condicional de εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Se Deus é por nós
  alternative: Visto que Deus é por nós
  rationale: O texto principal preserva εἰ como “se”, mantendo a tensão e a forma do argumento. A alternativa explicita que, no contexto, Paulo não manifesta dúvida, mas parte de uma realidade já afirmada.
- issue: Alcance da pergunta τίς καθ’ ἡμῶν
  choice: quem será contra nós?
  alternative: quem pode ser contra nós?
  rationale: A opção escolhida não sugere que não existam adversários, nem introduz diretamente o verbo “poder”, ausente do grego; mantém a pergunta como desafio retórico à eficácia de qualquer oposição.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção tradicional “Deus é por nós” foi mantida por ser concisa e amplamente inteligível; “diante dessas coisas” liga a pergunta ao argumento precedente sem soar excessivamente literal.
