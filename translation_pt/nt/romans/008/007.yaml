  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: pt
  text: porque a mentalidade da carne é inimizade contra Deus[a], pois não se submete à lei de Deus; de fato, nem sequer é capaz disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mentalidade da natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: porque
  rationale: Introduz a razão da afirmação anterior e preserva claramente a relação causal.
- source_word: τὸ φρόνημα
  choice: a mentalidade
  rationale: Expressa a orientação ou disposição da mente, e não apenas a faculdade intelectual.
- source_word: τῆς σαρκὸς
  choice: da carne
  rationale: Mantém o termo paulino e sua metáfora, sem substituir no texto principal por uma interpretação mais específica.
- source_word: ἔχθρα εἰς θεόν
  choice: inimizade contra Deus
  rationale: Preserva a construção nominal enfática e deixa claro que a oposição se dirige contra Deus.
- source_word: τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: pois não se submete à lei de Deus
  rationale: Traduz naturalmente a ideia de sujeição e mantém a referência formal à lei de Deus.
- source_word: οὐδὲ γὰρ δύναται
  choice: de fato, nem sequer é capaz disso
  rationale: Mantém a ênfase de οὐδέ e a afirmação explícita de incapacidade; “disso” torna claro em português que se trata de submeter-se à lei de Deus.
theological_decisions:
- issue: Sentido metafórico de σάρξ
  choice: Manter “carne” no texto principal e registrar “natureza pecaminosa” como alternativa interpretativa.
  alternative: natureza pecaminosa
  rationale: O contexto aponta para a orientação humana rebelde, mas “carne” preserva o vocabulário e a amplitude teológica de Paulo sem impor uma interpretação única.
- issue: Caráter da afirmação final sobre δύναται
  choice: 'Preservar uma declaração direta de incapacidade: “nem sequer é capaz disso”.'
  alternative: não quer submeter-se
  rationale: O verbo grego expressa capacidade, não apenas disposição. A tradução conserva essa tensão sem desenvolver um sistema doutrinário além do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção nominal “é inimizade” foi mantida por corresponder de perto ao grego e conservar sua força retórica; o ponto e vírgula organiza as duas explicações causais sem alterar sua relação lógica.
