id: ROM.8.30
reference: Romans 8:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: pt
  text: E aos que predestinou[a], também chamou; e aos que chamou, também justificou; e aos que justificou, também glorificou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “determinou de antemão”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “glorificou”; alguns entendem aqui o passado como referência a uma glória futura tão certa que é descrita como já realizada.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: predestinou
  rationale: O verbo indica decidir ou determinar de antemão. “Predestinou” é o equivalente português mais compacto e estabelecido, sem acrescentar uma explicação que resolva debates teológicos posteriores.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: “Chamou” é a correspondência natural de καλέω neste contexto e mantém a sequência verbal concisa de Paulo sem especificar indevidamente a natureza do chamado.
- source_word: ἐδικαίωσεν
  choice: justificou
  rationale: No uso paulino, δικαιόω frequentemente tem sentido forense. “Justificou” é conciso, tradicional e natural em português; “declarou justos” seria uma paráfrase explicativa possível.
- source_word: ἐδόξασεν
  choice: glorificou
  rationale: A forma grega é aoristo indicativo. O passado “glorificou” preserva a forma e a força retórica da sequência, embora a glória possa ser entendida como futura e apresentada como certa.
- source_word: οὓς ... τούτους
  choice: aos que ... também
  rationale: A construção correlativa identifica repetidamente o mesmo grupo em cada etapa. Em português natural, o demonstrativo explícito é dispensável, mas a cadeia é preservada pela repetição de “aos que”.
- source_word: καὶ
  choice: também
  rationale: Aqui καί tem força aditiva em cada oração, marcando a progressão entre predestinar, chamar, justificar e glorificar.
- source_word: δὲ
  choice: e
  rationale: δέ atua como conectivo leve, sem contraste forte; “e” integra naturalmente este versículo ao argumento anterior.
theological_decisions:
- issue: Se προώρισεν deve ser suavizado para evitar implicações denominacionais
  choice: predestinou
  alternative: determinou de antemão
  rationale: O texto grego afirma uma determinação prévia. A tradução preserva essa afirmação, mas não acrescenta quem ou o que condiciona essa determinação nem adota um sistema doutrinário específico.
- issue: Se ἐδόξασεν deve ser vertido no passado ou no futuro
  choice: glorificou
  alternative: glorificará
  rationale: O grego emprega o aoristo indicativo, portanto o texto principal mantém o passado. A possível referência a uma glória futura, apresentada como certa, é registrada em nota sem substituir a forma verbal do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição deliberada dos verbos e de “aos que” conserva a estrutura encadeada e enfática do grego.
