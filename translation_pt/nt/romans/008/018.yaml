source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: pt
  text: Pois considero que os sofrimentos do tempo presente não são dignos de comparação com a glória futura que será revelada a nós[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revelada em nós”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: considero
  rationale: Expressa uma avaliação ponderada ou conclusão racional, não mero sentimento, em português atual e natural.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga esta afirmação ao contexto anterior.
- source_word: οὐκ ἄξια ... πρὸς
  choice: não são dignos de comparação com
  rationale: Torna explícita, de modo idiomático, a desproporção comparativa expressa por ἄξια com πρὸς.
- source_word: τὰ παθήματα
  choice: os sofrimentos
  rationale: Equivalente corrente que designa sofrimentos experimentados, adequado ao contexto paulino.
- source_word: τοῦ νῦν καιροῦ
  choice: do tempo presente
  rationale: Traduz καιρός como o período atual sem acrescentar a noção mais específica de era.
- source_word: τὴν μέλλουσαν δόξαν
  choice: a glória futura
  rationale: Preserva de maneira concisa e natural a orientação futura do particípio μέλλουσαν.
- source_word: ἀποκαλυφθῆναι
  choice: que será revelada
  rationale: Conserva a voz passiva e a perspectiva futura do infinitivo, ligado a 'glória'.
- source_word: εἰς ἡμᾶς
  choice: a nós
  rationale: Representa naturalmente a glória sendo revelada aos crentes, enquanto a possível nuance participativa é mantida em nota.
theological_decisions:
- issue: Sentido de εἰς ἡμᾶς na revelação da glória
  choice: a nós
  alternative: em nós
  rationale: A preposição pode indicar revelação dirigida a nós ou realizada em nós. O texto principal adota a formulação mais direta em português, sem eliminar a leitura participativa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção mantém o encadeamento argumentativo e preserva a ambiguidade interpretativa relevante de εἰς ἡμᾶς.
