lexical_decisions:
- source_word: καθὼς
  choice: Como
  rationale: Introduz a citação bíblica com valor comparativo e liga naturalmente o texto ao argumento anterior.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada e natural em português para o perfeito passivo, preservando a validade contínua do que foi escrito.
- source_word: Ἕνεκεν σοῦ
  choice: Por tua causa
  rationale: Expressa a causa e mantém a referência direta a Deus sem acrescentar interpretação.
- source_word: θανατούμεθα
  choice: somos entregues à morte
  rationale: Preserva a voz passiva e o sentido de ação letal contínua, com linguagem digna e idiomática.
- source_word: ὅλην τὴν ἡμέραν
  choice: o dia inteiro
  rationale: Equivalente português natural para a expressão de duração, comunicando exposição contínua.
- source_word: ἐλογίσθημεν
  choice: fomos considerados
  rationale: Comunica de modo claro o sentido passivo de ser avaliado ou tido como algo, sem sugerir mera contagem numérica.
- source_word: ὡς
  choice: como
  rationale: Introduz diretamente a comparação presente no grego.
- source_word: πρόβατα σφαγῆς
  choice: ovelhas destinadas ao abate
  rationale: Torna explícita de forma mínima a relação do genitivo e preserva a imagem de animais destinados à matança.
theological_decisions:
- issue: Citação do Salmo 44:22 em um contexto de sofrimento
  choice: Manter o sentido coletivo e contínuo de pessoas tratadas como destinadas à morte.
  alternative: Restringir a declaração especificamente ao martírio.
  rationale: A citação apresenta o lamento sem limitar sua aplicação a uma categoria específica de sofrimento; a tradução preserva essa tensão sem explicação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o tom solene da citação bíblica sem recorrer a construções arcaicas.
