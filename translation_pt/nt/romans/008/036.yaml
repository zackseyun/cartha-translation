review_pass:
  verdict: revise
  source_fidelity: A fórmula introdutória e a citação são, em geral, fiéis ao grego. Porém, «somos entregues à morte» desloca θανατούμεθα para a ideia de ser entregue, que o verbo grego não exprime; o sentido é que se está sendo morto ou levado à morte.
  naturalness: A redação é clara, solene e natural. «Somos mortos o dia inteiro» comunica de modo direto a duração contínua e preserva boa legibilidade em português moderno.
  terminology: «Por tua causa», «está escrito», «considerados como» e «ovelhas ... ao abate» preservam adequadamente o registro da citação e sua imagem. «Destinadas» é interpretativamente aceitável, mas «para o abate» reflete de forma mais direta πρόβατα σφαγῆς.
  issues:
