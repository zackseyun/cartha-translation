    issue: «Somos entregues à morte» para θανατούμεθα
    rationale: «Entregues» introduz uma ação de entregar que não está no verbo θανατόω, cujo sentido passivo é «ser morto» ou «ser levado à morte». A revisão mantém a passividade e o aspecto contínuo sem acrescentar esse elemento.
  - severity: low
    issue: Posicionamento e formulação da nota lexical
    rationale: A alternativa deve abranger a locução «considerados como», para que «fomos tidos como» seja uma substituição gramaticalmente completa.
