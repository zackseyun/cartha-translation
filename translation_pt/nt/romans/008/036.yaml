  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: pt
  text: 'Como está escrito: “Por tua causa, somos mortos o dia inteiro; fomos considerados como[a] ovelhas para o abate.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
