id: ROM.8.9
reference: Romans 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: pt
  text: Vocês, porém, não estão na carne,[a] mas no Espírito, se de fato o Espírito de Deus habita em vocês. Mas, se alguém não tem o Espírito do Messias,[b] essa pessoa não pertence a ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na natureza pecaminosa». Grego: «na carne».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Espírito de Cristo».'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: «não é dele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: carne
  rationale: Mantém o termo característico de Paulo e sua linguagem de esfera ou condição de existência, sem reduzi-lo ao corpo físico nem substituí-lo pela interpretação mais estreita «natureza pecaminosa».
- source_word: πνεῦμα
  choice: Espírito
  rationale: A referência imediata ao «Espírito de Deus» e ao «Espírito do Messias» indica o Espírito Santo; por isso, usa-se inicial maiúscula.
- source_word: οἰκεῖ
  choice: habita
  rationale: Expressa residência contínua ou permanente e é natural no registro bíblico contemporâneo.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz Χριστός como título, preservando seu sentido de Ungido; «de Cristo» permanece registrado como alternativa tradicional.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: não pertence a ele
  rationale: Transmite de modo natural em português o idioma grego de posse, sem explicitar além do texto o referente do pronome.
- source_word: εἴπερ
  choice: se de fato
  rationale: Preserva a forma condicional e, ao mesmo tempo, a força retórica que pressupõe a realidade da habitação do Espírito entre os destinatários.
- source_word: Ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito e enfático é preservado; «vocês» oferece ampla legibilidade no português moderno, especialmente no Brasil.
- source_word: οὗτος
  choice: essa pessoa
  rationale: Comunica naturalmente a força representativa do demonstrativo masculino singular grego sem restringir a afirmação a pessoas do sexo masculino.
theological_decisions:
- issue: O contraste paulino entre estar «na carne» e estar «no Espírito»
  choice: Manter «carne» e «Espírito» como linguagem de esfera ou condição de existência ligada à habitação do Espírito Santo.
  alternative: Parafrasear como «natureza pecaminosa» e vida controlada pelo Espírito.
  rationale: A formulação conserva as categorias e a tensão teológica de Paulo sem impor uma explicação psicológica ou sistemática mais estreita.
- issue: O referente de «ele» em «não pertence a ele»
  choice: Conservar o pronome sem explicitar seu referente; gramaticalmente, o Messias é o antecedente mais próximo.
  alternative: Substituir «ele» por «o Messias» ou por «Deus».
  rationale: O grego usa apenas o pronome. Mantê-lo evita eliminar a possível ligação contextual mais ampla entre o Espírito de Deus e o Espírito do Messias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» evita formas regionais de conjugação; «essa pessoa» torna natural o referente genérico de οὗτος. Os termos paulinos «carne» e «Espírito» foram preservados, e as alternativas interpretativas ou tradicionais foram remetidas às notas.
