  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: pt
  text: Pois a criação foi submetida à futilidade[a], não por sua própria vontade, mas por causa daquele que a submeteu[b], na esperança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à frustração», «à vaidade» ou «ao vazio».
    reason: lexical_alternative
  - marker: b
    text: O grego não identifica explicitamente quem é «aquele que a submeteu».
    reason: alternative_reading
  - marker: c
    text: Ou «com esperança».
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: inutilidade
  rationale: Expressa a condição frustrada e incapaz de alcançar seu devido fim, sem sugerir necessariamente mal moral. Em português atual, «inutilidade» preserva de modo claro a ideia de falta de resultado ou propósito efetivo.
- source_word: κτίσις
  choice: criação
  rationale: No contexto de Romanos 8:19–22, refere-se coletivamente à ordem criada, e não a uma criatura individual.
- source_word: ὑπετάγη
  choice: foi sujeita
  rationale: Mantém a voz passiva e comunica que a criação sofreu uma sujeição imposta.
- source_word: οὐχ ἑκοῦσα
  choice: não por sua própria vontade
  rationale: Torna explícita em português natural a ausência de iniciativa ou consentimento da criação.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: por causa daquele que a sujeitou
  rationale: Interpreta διά com acusativo em sentido causal e preserva a referência pessoal sem identificar quem realizou a sujeição.
- source_word: ἐφ’ ἑλπίδι
  choice: em esperança
  rationale: Reproduz a expressão compacta e sua orientação futura, deixando sua ligação sintática tão aberta quanto possível em português.
theological_decisions:
- issue: Identidade daquele que sujeitou a criação
  choice: 'A expressão permanece genérica: «daquele que a sujeitou».'
  alternative: Deus pode ser entendido como quem sujeitou a criação em juízo e com propósito redentor; a queda de Adão pode ser vista como a ocasião dessa sujeição; alguns propõem Satanás, embora isso seja menos provável no contexto.
  rationale: O grego não identifica explicitamente o agente, por isso a tradução não deve resolver no texto principal uma questão interpretativa.
- issue: Relação de ἐφ’ ἑλπίδι com a oração
  choice: «em esperança» foi mantido no fim da frase.
  alternative: Pode-se traduzir «com esperança» e entender a expressão mais diretamente ligada ao ato daquele que sujeitou a criação.
  rationale: A posição e a construção gregas permitem alguma tensão quanto à ligação exata da expressão; a redação escolhida preserva sua concisão e relativa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o encadeamento paulino e evita identificar além do texto o agente da sujeição. Todos os marcadores aparecem no texto principal e seguem a ordem de ocorrência.
