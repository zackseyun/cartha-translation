id: ROM.8.14
reference: Romans 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: pt
  text: Pois todos os que são guiados pelo Espírito de Deus, esses são filhos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «filhos e filhas de Deus». O grego diz «filhos»; no contexto de adoção e herança, a expressão abrange homens e mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa de modo natural em português a construção correlativa plural e preserva o sentido de totalidade da classe mencionada.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa que liga a afirmação ao argumento anterior.
- source_word: πνεύματι θεοῦ
  choice: pelo Espírito de Deus
  rationale: Entende o dativo como instrumental com ἄγονται e conserva a formulação paulina «Espírito de Deus».
- source_word: ἄγονται
  choice: são guiados
  rationale: Reproduz o presente passivo de forma idiomática, permitindo o sentido contínuo sem explicitar além do texto.
- source_word: οὗτοι
  choice: são
  rationale: Em português, a retomada por «todos os que» torna desnecessário traduzir literalmente o demonstrativo; a identificação enfática permanece clara na estrutura da frase.
- source_word: υἱοί
  choice: filhos
  rationale: Preserva o substantivo masculino plural do grego e sua relação contextual com adoção e herança; no plural português, também pode abranger coletivamente homens e mulheres.
- source_word: θεοῦ
  choice: de Deus
  rationale: Tradução direta do genitivo, preservando sua repetição nas duas expressões do versículo.
theological_decisions:
- issue: Como traduzir υἱοί θεοῦ mantendo tanto a forma masculina quanto a abrangência contextual.
  choice: filhos de Deus
  alternative: filhos e filhas de Deus; crianças de Deus
  rationale: «Filhos» corresponde ao masculino plural grego e preserva a linguagem de filiação ligada, no contexto, à adoção e à herança. Em português, o plural pode incluir ambos os sexos; a nota esclarece essa abrangência sem expandir silenciosamente o texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pois» mantém a conexão argumentativa; «são guiados» é mais natural no uso corrente do que «são conduzidos», sem alterar a voz passiva.
