id: ROM.6.5
reference: Romans 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: pt
  text: Pois, se nos tornamos unidos a ele[a] na semelhança da sua morte, certamente também seremos unidos a ele na semelhança da sua ressurreição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «crescidos juntamente com ele».'
    reason: lexical_alternative
  - marker: b
    text: 'Em grego: «também seremos da ressurreição»; as palavras «unidos a ele na semelhança» são retomadas da primeira oração.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: unidos a ele
  rationale: O adjetivo expressa união orgânica ou participação compartilhada. «Unidos a ele» comunica essa força relacional com clareza, sem impor uma explicação sacramental, mística ou meramente metafórica.
- source_word: γεγόναμεν
  choice: nos tornamos
  rationale: O perfeito grego aponta para algo que ocorreu e permanece válido; «nos tornamos» é natural em português e mantém a ideia de uma condição adquirida.
- source_word: τῷ ὁμοιώματι
  choice: na semelhança
  rationale: A expressão conserva o substantivo paulino e deixa aberta a nuance exata do dativo, que pode indicar relação ou esfera.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: da sua morte
  rationale: Reproduz diretamente a construção genitiva e identifica a morte como a de Cristo pelo contexto.
- source_word: ἀλλὰ καὶ
  choice: certamente também
  rationale: Comunica a força enfática e ascendente da ligação entre a morte e a ressurreição, de modo corrente em português.
- source_word: τῆς ἀναστάσεως
  choice: na semelhança da sua ressurreição
  rationale: A formulação retoma a estrutura paralela da primeira oração. «Sua» e «na semelhança» são recuperados do contexto, sem eliminar a elipse presente no grego.
- source_word: ἐσόμεθα
  choice: seremos unidos a ele
  rationale: O verbo significa literalmente «seremos», mas o predicativo da primeira oração precisa ser retomado em português para que a frase seja clara.
theological_decisions:
- issue: Natureza da união e participação na morte e na ressurreição de Cristo
  choice: Manter «unidos a ele na semelhança»
  alternative: «Crescidos juntamente com ele», «unidos ao padrão» ou uma formulação explicitamente sacramental
  rationale: O texto afirma participação real em Cristo e, ao mesmo tempo, emprega «semelhança». A tradução preserva essa tensão sem definir o modo dessa participação.
- issue: Expansão da elipse na segunda oração
  choice: Repetir «unidos a ele na semelhança da sua» no texto
  alternative: Traduzir literalmente «também seremos da ressurreição»
  rationale: A repetição torna a construção compreensível em português, enquanto a nota registra a forma mais elíptica do grego.
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural tanto para leitores brasileiros quanto para um público lusófono amplo. A ordem das orações e o paralelismo paulino foram preservados, com explicitação apenas da elipse necessária à clareza.
