- from: Ou vocês não sabem que todos nós que fomos batizados para dentro do Messias Jesus fomos batizados para dentro da sua morte?[a]
  to: Ou vocês não sabem que todos nós que fomos batizados em Messias Jesus fomos batizados em sua morte?[a]
