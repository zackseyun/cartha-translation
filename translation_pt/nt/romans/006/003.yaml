id: ROM.6.3
reference: Romans 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: pt
  text: Ou vocês não sabem que todos nós que fomos batizados em Messias Jesus fomos batizados em sua morte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”.
    reason: Alternativa lexical para Χριστὸν Ἰησοῦν.
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Preserva a transição argumentativa e a leve repreensão de Paulo, ligando a pergunta ao argumento anterior.
- source_word: ἀγνοεῖτε
  choice: vocês não sabem
  rationale: Expressa de modo natural em português a pergunta retórica no presente e o apelo de Paulo a um conhecimento compartilhado.
- source_word: ὅσοι
  choice: todos nós que
  rationale: Reflete o alcance inclusivo da expressão grega e concorda com a primeira pessoa do plural do verbo.
- source_word: ἐβαπτίσθημεν
  choice: fomos batizados
  rationale: Representa diretamente o aoristo passivo, sem acrescentar uma explicação denominacional sobre o batismo.
- source_word: εἰς
  choice: para dentro de
  rationale: Conserva a imagem forte de ingresso ou incorporação presente nas duas ocorrências, sem definir o mecanismo teológico.
- source_word: Χριστὸν Ἰησοῦν
  choice: Messias Jesus
  rationale: Traduz Χριστός como o título 'Messias', mantendo visível seu sentido titular nesta construção.
- source_word: θάνατον
  choice: morte
  rationale: Equivalente direto e suficiente de θάνατος.
- source_word: αὐτοῦ
  choice: sua
  rationale: Traduz naturalmente o genitivo possessivo, cujo referente é o Messias Jesus.
theological_decisions:
- issue: Se εἰς na linguagem batismal deve favorecer eficácia sacramental, identificação simbólica ou união pactual.
  choice: As duas ocorrências foram traduzidas como 'para dentro de/da'.
  alternative: '''em relação a'' ou ''em união com'''
  rationale: A formulação preserva a ideia grega de ingresso ou incorporação no Messias Jesus e na morte dele, sem impor uma explicação denominacional específica do batismo.
- issue: Se Χριστός deve ser vertido como título ou mantido na forma tradicional de nome.
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός permanece inteligível como título; 'Messias' torna esse valor explícito, enquanto a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. A repetição de 'fomos batizados' e de 'para dentro' foi mantida para preservar o paralelismo e a força incorporativa do grego, ainda que a construção seja mais marcada do que o português coloquial.
