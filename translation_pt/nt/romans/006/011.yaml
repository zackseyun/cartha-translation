source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: pt
  text: Assim também vocês, considerem-se mortos para o pecado, mas vivos para Deus no Messias Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”. “Messias” traduz o título grego Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Mantém a ligação inferencial com o argumento anterior e soa natural em português.
- source_word: λογίζεσθε
  choice: considerem-se
  rationale: Expressa o ato de reconhecer ou ter por verdadeiro, preservando a força reflexiva de ἑαυτούς em português corrente.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: mortos para o pecado
  rationale: Reproduz de modo idiomático a relação expressa pelo dativo e prepara o contraste marcado por μέν...δέ.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: mas vivos para Deus
  rationale: A forma adjetival 'vivos' estabelece naturalmente o contraste com 'mortos'; 'para Deus' conserva a relação do dativo sem explicá-la em excesso.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Preserva ἐν e a linguagem paulina de esfera ou união, enquanto traduz Χριστός como o título 'Messias'.
theological_decisions:
- issue: Valor de Χριστῷ como título ou forma semelhante a nome próprio
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva sentido titular significativo; 'Messias' torna esse valor transparente sem acrescentar uma interpretação denominacional.
- issue: Força de ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: por meio do Messias Jesus
  rationale: A tradução mantém a preposição ἐν e não reduz a relação à instrumentalidade ou causalidade, preservando a amplitude da formulação paulina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. O imperativo plural é expresso por “vocês, considerem-se”; o contraste sintético entre “mortos” e “vivos” acompanha a estrutura grega.
