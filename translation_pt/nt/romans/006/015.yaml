  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: pt
  text: E então? Devemos pecar porque não estamos debaixo de lei, mas debaixo da graça? De modo nenhum![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Havemos de pecar?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Que isso nunca aconteça!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: E então?
  rationale: Expressa de modo conciso e natural a transição inferencial no argumento de Paulo, sem acrescentar conteúdo ausente no grego.
- source_word: ἁμαρτήσωμεν
  choice: Devemos pecar
  rationale: O subjuntivo aoristo na primeira pessoa do plural tem valor deliberativo; esta formulação comunica claramente a proposta retórica.
- source_word: ὅτι
  choice: porque
  rationale: 'Introduz a razão alegada para a proposta: pecar pelo fato de não se estar debaixo de lei, mas da graça.'
- source_word: ὑπὸ νόμον
  choice: debaixo de lei
  rationale: Preserva a expressão anartrosa e a amplitude do contraste jurídico-teológico, sem especificar no texto principal 'a Lei' ou 'a Lei de Moisés'.
- source_word: ὑπὸ χάριν
  choice: debaixo da graça
  rationale: '''Graça'' é a tradução consagrada e semanticamente adequada de χάρις; o artigo em português torna a expressão natural sem necessariamente restringir seu sentido.'
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Transmite a rejeição enfática da expressão idiomática grega em português atual, digno e amplamente compreensível.
theological_decisions:
- issue: Alcance de νόμος no contraste paulino
  choice: Traduzir de modo genérico como 'lei', sem maiúscula e sem especificação.
  alternative: '''a Lei'' ou ''a Lei de Moisés'''
  rationale: A ausência de artigo no grego e o caráter condensado da expressão recomendam não estreitar interpretativamente sua referência; a formulação preserva a tensão teológica para o contexto e a exegese.
translation_notes:
  register: Português moderno, digno e de leitura natural sobretudo para brasileiros, mas amplamente inteligível em âmbito internacional. A construção 'debaixo de lei' mantém o paralelismo paulino com 'debaixo da graça'; as notas registram alternativas genuínas sem sobrecarregar o texto principal.
