  source_fidelity: 'A tradução acompanha de perto a estrutura e os termos do grego: «fomos sepultados com ele», a instrumentalidade de «por meio do batismo», a ressurreição «dentre os mortos», «por meio da glória do Pai» e a finalidade expressa por «para que ... andemos». Contudo, «na morte» atenua o movimento/resultado de εἰς τὸν θάνατον e, na sequência portuguesa «batismo na morte», pode ainda modificar «batismo». «Para a morte» preserva melhor a direção da expressão grega.'
