id: ROM.6.4
reference: Romans 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: pt
  text: Portanto, fomos sepultados com ele por meio do batismo para a morte, para que, assim como o Messias[a] foi ressuscitado dentre os mortos por meio da glória do Pai, também nós andemos em novidade de vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: Cristo.'
    reason: Tradução alternativa de Χριστός.
lexical_decisions:
- source_word: συνετάφημεν
  choice: fomos sepultados com ele
  rationale: O aoristo passivo indica uma ação passada, e o prefixo συν- é expresso naturalmente por “com ele”.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a inferência lógica a partir do argumento anterior.
- source_word: διὰ τοῦ βαπτίσματος
  choice: por meio do batismo
  rationale: Expressa o valor instrumental de διά com o genitivo sem impor uma interpretação sacramental específica.
- source_word: εἰς τὸν θάνατον
  choice: na morte
  rationale: Em português corrente, “na morte” comunica de modo natural a entrada ou incorporação na morte mencionada, evitando o pouco idiomático “para dentro da morte”.
- source_word: ἵνα
  choice: para que
  rationale: Preserva claramente a finalidade introduzida pela conjunção.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός, com a alternativa tradicional indicada em nota.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa a ideia de ser levantado do meio dos mortos e permanece idiomático em português bíblico atual.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: por meio da glória do Pai
  rationale: Conserva tanto a força instrumental de διά quanto o sentido amplo de δόξα.
- source_word: περιπατήσωμεν
  choice: andemos
  rationale: Preserva a metáfora paulina de caminhar como modo de viver e o subjuntivo exigido pela oração de finalidade.
- source_word: ἐν καινότητι ζωῆς
  choice: em novidade de vida
  rationale: Mantém a formulação abstrata e teologicamente densa do grego sem reduzi-la simplesmente a “uma vida nova”.
theological_decisions:
- issue: Se διὰ τοῦ βαπτίσματος deve ser traduzido de modo a implicar uma doutrina sacramental específica
  choice: por meio do batismo
  alternative: pelo batismo
  rationale: A formulação conserva a instrumentalidade gramatical sem decidir como o batismo se relaciona com a união com o Messias.
- issue: Valor de Χριστός neste contexto
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita o título, enquanto a nota preserva a forma tradicional amplamente usada como nome ou título em português.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe acompanha de perto a progressão do grego, mas evita construções artificiais; “andemos em novidade de vida” conserva deliberadamente a metáfora e a densidade paulinas.
