id: ROM.6.14
reference: Romans 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: pt
  text: Pois o pecado não dominará vocês[a], porque vocês não estão sob a lei[b], mas sob a graça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não terá domínio sobre vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sob lei”; expressão que indica estar sob a autoridade ou o regime da lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: pecado
  rationale: Emprega o equivalente paulino consagrado em português. A minúscula evita acrescentar uma personificação tipográfica não exigida pelo grego, enquanto o verbo mantém a imagem do pecado como poder dominador.
- source_word: κυριεύσει
  choice: dominará
  rationale: Expressa de modo natural e direto o exercício de senhorio ou domínio indicado pelo verbo, preservando a personificação sem linguagem arcaica.
- source_word: ὑπὸ νόμον
  choice: sob a lei
  rationale: Reproduz a metáfora de estar sob a autoridade ou o regime da lei. Embora νόμον não tenha artigo no grego, o português idiomático pede o artigo neste contexto.
- source_word: χάριν
  choice: graça
  rationale: É o equivalente consagrado e contextualmente adequado para o contraste paulino entre lei e graça; “favor” seria possível, mas não comunicaria tão bem a força do termo aqui.
- source_word: γὰρ
  choice: pois / porque
  rationale: O primeiro γὰρ é vertido por “Pois”, mantendo a ligação explicativa com o contexto anterior; o segundo, por “porque”, introduzindo naturalmente a razão apresentada.
theological_decisions:
- issue: Se a personificação do pecado deve ser explicitada por maiúscula ou por uma metáfora mais forte
  choice: Manter “pecado” em minúscula e traduzir κυριεύσει por “dominará”.
  alternative: “O Pecado não terá domínio sobre vocês” ou “o pecado não será senhor de vocês”.
  rationale: O texto apresenta o pecado como poder que exerce domínio, mas não exige maiúscula nem uma identificação ontológica mais específica. A formulação preserva a imagem e a tensão teológica sem ampliá-las.
- issue: Sentido de estar “sob a lei”
  choice: Conservar a expressão “sob a lei”, sem explicar no corpo do versículo qual aspecto da lei está em vista.
  alternative: “sob a autoridade da lei” ou “sob o regime da lei”.
  rationale: A formulação paulina pode envolver autoridade, regime e condição pactual. Manter a expressão no texto evita reduzir sua amplitude; a nota esclarece o valor idiomático.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμῶν sem marcar gênero. A repetição de “sob” preserva o paralelismo enfático entre lei e graça.
