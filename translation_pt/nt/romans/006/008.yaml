id: ROM.6.8
reference: Romans 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: pt
  text: Mas, se morremos com o Messias[a], cremos que também viveremos com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Cristo”. Grego: Χριστῷ (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: εἰ introduz a condição, e δέ marca a progressão ou leve contraste com o argumento anterior. “Mas, se” preserva ambas as funções com naturalidade em português.
- source_word: ἀπεθάνομεν
  choice: morremos
  rationale: O aoristo indicativo aponta para a morte com o Messias já apresentada no contexto; o pretérito perfeito simples é direto e natural.
- source_word: σὺν Χριστῷ
  choice: com o Messias
  rationale: σύν expressa associação, traduzida por “com”; Χριστός é mantido como título messiânico, com o artigo exigido pelo uso idiomático em português.
- source_word: πιστεύομεν
  choice: cremos
  rationale: Traduz diretamente o sentido declarativo de πιστεύομεν e preserva a linguagem de fé sem paráfrase.
- source_word: ὅτι
  choice: que
  rationale: Introduz explicitamente o conteúdo daquilo que se crê.
- source_word: καὶ
  choice: também
  rationale: Assinala a realidade futura correspondente à morte com o Messias.
- source_word: συζήσομεν αὐτῷ
  choice: viveremos com ele
  rationale: O verbo composto e o dativo expressam vida compartilhada com ele; a formulação portuguesa é clara sem acrescentar “de novo” nem limitar a afirmação a um mecanismo específico.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: o Messias
  alternative: Cristo
  rationale: O termo funciona como título no argumento sobre união com Jesus. A tradução principal torna esse valor titular transparente, enquanto a alternativa tradicional é registrada em nota.
- issue: Natureza da vida futura em συζήσομεν αὐτῷ
  choice: viveremos com ele
  alternative: viveremos novamente com ele / compartilharemos com ele a vida da ressurreição
  rationale: A redação preserva a amplitude da afirmação grega sobre vida futura compartilhada, sem introduzir “novamente” nem especificar além do texto o modo dessa vida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Cremos” mantém concisão bíblica sem soar arcaico; “Mas, se” representa o δέ do texto grego, mesmo que a camada inglesa auditada o tenha deixado implícito.
