  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: pt
  text: E, tendo sido libertados do pecado, vocês foram escravizados à justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: tendo sido libertados
  rationale: O particípio aoristo passivo indica uma ação recebida e vista como completa; a formulação preserva tanto o valor participial quanto a voz passiva.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ funciona como conectivo leve na continuação do argumento; “E” é natural em português e não introduz um contraste mais forte do que o grego exige.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: O singular com artigo, no contexto paulino, permite perceber o pecado também como poder dominador, sem deixar de conservar seu sentido abstrato.
- source_word: ἐδουλώθητε
  choice: vocês foram escravizados
  rationale: A voz passiva e a metáfora de escravidão são centrais ao argumento; esta tradução mantém sua força, evitando suavizações como “tornaram-se servos”.
- source_word: δικαιοσύνῃ
  choice: à justiça
  rationale: δικαιοσύνη pode abranger retidão moral e justiça, com possíveis ressonâncias forenses e relacionais. Neste contexto de nova obediência e senhorio, “justiça” é natural, amplo e preserva a tensão sem expansão interpretativa.
theological_decisions:
- issue: Tradução da metáfora de δουλόω
  choice: vocês foram escravizados à justiça
  alternative: vocês se tornaram servos da justiça
  rationale: A formulação escolhida preserva a metáfora contundente da transferência de domínio e mantém a passividade gramatical, sem amenizar o vínculo de escravidão expresso pelo verbo.
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” conserva de modo mais amplo as dimensões moral, relacional e forense possíveis no termo grego; “retidão” é registrada como alternativa legítima, sem decidir no corpo do texto uma nuance que o original não isola.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para a segunda pessoa plural. A estrutura mantém o paralelismo passivo do grego e a força deliberadamente áspera da metáfora de escravidão.
