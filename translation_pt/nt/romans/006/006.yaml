  source_fidelity: 'A tradução preserva bem os principais elementos: a co-crucificação, «o corpo do pecado» e a força de incapacidade/ineficácia em καταργηθῇ. Contudo, a sequência «não mais fôssemos escravos» tende a situar no passado o resultado que o grego apresenta como finalidade contínua («não mais sermos escravos»).'
  naturalness: '«Sabemos isto: que» é aceitável e clara em português moderno. A revisão torna a oração final mais idiomática e evita uma leitura temporalmente restrita ao passado.'
  terminology: «Nosso velho ser humano» conserva, de modo inclusivo e relativamente próximo, o sentido antropológico de ὁ παλαιὸς ἡμῶν ἄνθρωπος. «Corpo do pecado», «crucificado com ele» e «escravos do pecado» são adequados. «Reduzido à impotência» comunica com precisão prudente o valor de καταργηθῇ.
  issues:
