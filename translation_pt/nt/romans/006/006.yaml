id: ROM.6.6
reference: Romans 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: pt
  text: 'Sabemos isto: que o nosso velho ser humano foi crucificado com ele, para que o corpo do pecado fosse reduzido à impotência[a], a fim de não sermos mais escravos do pecado.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fosse anulado” ou “fosse tornado inoperante”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não mais servíssemos ao pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Sabemos isto
  rationale: Expressa naturalmente em português o particípio circunstancial ligado ao contexto anterior, sem fixar de modo indevido uma relação estritamente causal.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: o nosso velho ser humano
  rationale: Preserva a referência antropológica abrangente de ἄνθρωπος e o contraste paulino entre a antiga e a nova humanidade, evitando que “velho homem” seja entendido como referência exclusiva ao sexo masculino.
- source_word: συνεσταυρώθη
  choice: foi crucificado com ele
  rationale: Torna explícito o valor associativo do prefixo συν- e mantém a formulação natural em português.
- source_word: καταργηθῇ
  choice: fosse reduzido à impotência
  rationale: Comunica a ideia de tornar inoperante ou sem eficácia, sem impor a noção mais forte de aniquilação.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: o corpo do pecado
  rationale: Mantém a construção genitiva compacta e sua ambiguidade, sem decidir se se trata do corpo dominado pelo pecado, caracterizado pelo pecado ou relacionado a ele de outro modo.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: a fim de que não mais fôssemos escravos do pecado
  rationale: Preserva a imagem forte de escravidão contida em δουλεύω e expressa com clareza a finalidade do acontecimento anterior.
theological_decisions:
- issue: Sentido antropológico de ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: o nosso velho ser humano
  alternative: o nosso velho homem; o nosso velho eu
  rationale: “Velho ser humano” conserva a dimensão corporativa e antropológica da expressão sem restringi-la aos homens nem reduzi-la necessariamente a uma interioridade individual.
- issue: Força de καταργηθῇ em relação ao corpo do pecado
  choice: fosse reduzido à impotência
  alternative: fosse anulado; fosse abolido
  rationale: A tradução apresenta a perda de eficácia ou domínio sem afirmar inequivocamente a destruição ontológica do corpo ou do pecado.
- issue: Relação de finalidade nas duas construções com ἵνα e τοῦ
  choice: para que ... a fim de que
  alternative: para que ... de modo que
  rationale: 'A redação mantém a progressão de finalidade do grego: a neutralização do corpo do pecado visa que já não vivamos sob sua escravidão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Velho ser humano” é deliberadamente mais antropológico que “velho eu”, enquanto “reduzido à impotência” preserva a força funcional de καταργέω. Todos os marcadores de nota aparecem no texto principal.
