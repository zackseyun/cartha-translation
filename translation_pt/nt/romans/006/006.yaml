    issue: Tempo e aspecto da finalidade final
    rationale: «A fim de que não mais fôssemos escravos» usa imperfeito do subjuntivo e pode sugerir que a não escravidão pertence apenas a uma situação passada. O infinitivo presente δουλεύειν, negado por μηκέτι, expressa a finalidade de não continuarmos a servir como escravos do pecado. «A fim de não sermos mais escravos» preserva melhor essa força.
