id: ROM.6.9
reference: Romans 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: pt
  text: sabendo que o Messias[a], tendo sido ressuscitado dentre os mortos, já não morre; a morte já não exerce domínio sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sabendo
  rationale: Preserva a forma participial e liga o versículo ao argumento anterior sem explicitar além do necessário uma relação causal.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o sentido titular de Χριστός neste contexto paulino, em vez de tratá-lo apenas como parte de um nome próprio.
- source_word: ἐγερθεὶς
  choice: tendo sido ressuscitado
  rationale: Representa tanto a voz passiva quanto a anterioridade do particípio aoristo em relação à afirmação de que ele já não morre.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa naturalmente a ideia de ser levantado do meio dos mortos, preservando a construção grega.
- source_word: οὐκέτι
  choice: já não
  rationale: Formulação natural em português que mantém, nas duas ocorrências, a ideia de que a situação anterior cessou definitivamente.
- source_word: ἀποθνῄσκει
  choice: morre
  rationale: O presente simples comunica adequadamente a realidade contínua de que o Messias não está mais sujeito à morte.
- source_word: θάνατος
  choice: a morte
  rationale: Mantém diretamente o substantivo e sua personificação como sujeito da oração.
- source_word: κυριεύει
  choice: exerce domínio sobre
  rationale: Comunica governo, senhorio ou poder efetivo, preservando a imagem paulina sem recorrer a uma formulação arcaica.
theological_decisions:
- issue: Tradução de Χριστός no discurso paulino
  choice: o Messias
  alternative: o Cristo
  rationale: Neste enunciado, o termo pode ser ouvido como título significativo. “O Messias” torna esse valor explícito, enquanto a nota preserva a tradução tradicional “o Cristo”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial e a personificação da morte foram preservadas; “exerce domínio” mantém a força de κυριεύει sem soar excessivamente arcaico.
