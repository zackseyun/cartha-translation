  terminology: «Carne», «escravos», «impureza», «justiça» e «santificação» são escolhas defensáveis e consistentes com o uso paulino. «Transgressão da lei» explicita legitimamente o campo semântico de ἀνομία, embora seja uma formulação mais analítica que «iniquidade» ou «maldade». A nota sobre «natureza pecaminosa» preserva corretamente seu caráter interpretativo; «retidão» é alternativa válida para «justiça» neste contexto ético.
