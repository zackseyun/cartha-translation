id: ROM.6.19
reference: Romans 6:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as slaves to impurity and to lawlessness, leading to lawlessness, so now present your members as slaves to righteousness[b], leading to sanctification.
translation:
  language: pt
  text: Falo em termos humanos por causa da fraqueza da carne de vocês.[a] Pois, assim como vocês apresentaram os membros do corpo de vocês como escravos da impureza e da transgressão da lei, levando à transgressão da lei, assim agora apresentem os membros do corpo de vocês como escravos da justiça,[b] levando à santificação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “da natureza pecaminosa de vocês”; o grego “carne” tem sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Falo em termos humanos
  rationale: Reproduz o modo idiomático pelo qual Paulo indica que se expressa de maneira adaptada à compreensão humana, sem especificar além do grego que se trata de uma analogia.
- source_word: ἀσθένειαν
  choice: fraqueza
  rationale: Mantém o sentido amplo de limitação ou fragilidade, sem o restringir ao aspecto físico ou moral.
- source_word: σαρκὸς
  choice: carne
  rationale: Preserva a amplitude e a tensão teológica de σάρξ; “natureza pecaminosa” seria uma interpretação mais estreita.
- source_word: παρεστήσατε / παραστήσατε
  choice: apresentaram / apresentem
  rationale: Conserva a repetição verbal e o contraste entre a conduta passada e a exortação presente.
- source_word: τὰ μέλη ὑμῶν
  choice: os membros do seu corpo / esses membros
  rationale: “Membros do corpo” torna natural e claro o emprego paulino de μέλη como partes e capacidades corporais; “esses membros” evita repetição pesada na segunda ocorrência.
- source_word: δοῦλα
  choice: escravos
  rationale: Mantém a força da metáfora de escravidão e domínio que estrutura Romanos 6, ao contrário de “servos”, que a atenuaria.
- source_word: ἀκαθαρσίᾳ
  choice: impureza
  rationale: Expressa com clareza atual a impureza moral indicada no contexto.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: transgressão da lei / transgressão da lei
  rationale: Explicita a relação de ἀνομία com a lei e preserva a repetição retórica; “iniquidade” seria menos transparente para muitos leitores atuais.
- source_word: εἰς τὴν ἀνομίαν
  choice: levando a mais transgressão da lei
  rationale: Comunica a direção ou o resultado expresso por εἰς e evidencia a progressão implícita da transgressão para transgressão adicional.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: “Justiça” é a correspondência portuguesa mais direta e natural para δικαιοσύνη, embora “retidão” destaque melhor o aspecto ético neste contraste.
- source_word: εἰς ἁγιασμόν
  choice: levando à santificação
  rationale: Expressa a direção ou o resultado de εἰς e mantém o caráter processual ou resultativo de ἁγιασμός.
theological_decisions:
- issue: Sentido de σάρξ em “fraqueza da carne de vocês”
  choice: carne
  alternative: natureza pecaminosa
  rationale: O contexto admite uma dimensão moral ligada à condição humana caída, mas o grego permanece mais amplo. A tradução principal evita resolver essa tensão; a alternativa interpretativa aparece em nota.
- issue: Sentido de δικαιοσύνη no contraste ético paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a correspondência lexical ampla de δικαιοσύνη, enquanto “retidão” é uma alternativa legítima que torna mais explícito o aspecto da conduta moral neste contexto.
- issue: Força da metáfora de δοῦλος
  choice: escravos
  alternative: servos
  rationale: A argumentação do capítulo depende da ideia de domínio e pertencimento. “Servos” enfraqueceria essa metáfora central.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A expressão “membros do seu corpo” esclarece um uso paulino que, traduzido apenas como “membros”, poderia soar institucional. A repetição de “transgressão da lei” preserva o efeito retórico do original, e “mais” comunica a progressão sem alterar o núcleo lexical.
