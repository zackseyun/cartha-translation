id: ROM.6.12
reference: Romans 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: pt
  text: Portanto, não deixem que o pecado reine no corpo mortal de vocês, levando-os a obedecer aos desejos do corpo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “aos desejos do pecado”.
    reason: Leitura alternativa para o referente de αὐτοῦ; embora a gramática favoreça “corpo”, o contexto permite uma ligação conceitual com “pecado”.
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Expressa com clareza a conclusão que Paulo tira do argumento anterior.
- source_word: βασιλευέτω
  choice: não deixem que ... reine
  rationale: Mantém a força da proibição contínua e preserva a metáfora régia que personifica o pecado.
- source_word: ἁμαρτία
  choice: pecado
  rationale: Equivalente direto que, com o verbo “reine”, conserva a apresentação do pecado como poder dominador.
- source_word: θνητῷ ὑμῶν σώματι
  choice: no corpo mortal de vocês
  rationale: Formulação natural e atual que preserva tanto a referência ao corpo quanto sua condição sujeita à morte.
- source_word: εἰς τὸ ὑπακούειν
  choice: levando-os a obedecer
  rationale: Comunica de modo idiomático o resultado ou propósito do reinado do pecado sem decidir rigidamente entre essas duas nuances.
- source_word: ἐπιθυμίαις
  choice: desejos
  rationale: Mantém a amplitude do termo grego, sem restringi-lo indevidamente a desejos sexuais.
- source_word: αὐτοῦ
  choice: do corpo
  rationale: Explicita no texto principal o antecedente gramatical mais natural, o substantivo neutro singular σώματι, enquanto a possível ligação conceitual com o pecado é registrada em nota.
theological_decisions:
- issue: O pecado é apresentado como atos isolados ou como poder governante
  choice: Preservar a personificação do pecado por meio de “o pecado reine”.
  alternative: Explicitar como comportamento pecaminoso que assume o controle.
  rationale: A metáfora régia pertence à formulação de Paulo e deve permanecer sem acréscimo de uma explicação doutrinária.
- issue: Antecedente de αὐτοῦ
  choice: Entender os desejos como pertencentes ao corpo mortal.
  alternative: Entender a expressão como referência aos desejos do pecado.
  rationale: A concordância gramatical favorece σώματι, neutro singular, e não ἁμαρτία, feminino; contudo, a ligação conceitual com o pecado é possível no contexto e merece nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. O plural “vocês” torna explícito o destinatário plural do grego; “não deixem que ... reine” conserva a imagem sem soar excessivamente literal.
