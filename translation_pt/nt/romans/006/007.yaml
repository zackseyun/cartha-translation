  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: pt
  text: Pois quem morreu foi absolvido do pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi justificado do pecado”; pelo contexto, também pode ter o sentido de “foi libertado do pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: quem morreu
  rationale: O artigo com o particípio aoristo tem função substantivada. “Quem morreu” é natural em português, não especifica gênero e preserva o caráter geral da expressão.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a razão ou explicação da afirmação anterior; “pois” mantém de modo conciso essa ligação argumentativa.
- source_word: δεδικαίωται
  choice: foi absolvido
  rationale: O perfeito passivo de δικαιόω tem forte valor forense. “Foi absolvido” comunica esse valor jurídico e, com “do pecado”, também sugere o fim da reivindicação ou domínio do pecado, sem reduzir o verbo simplesmente a “libertar”.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: do pecado
  rationale: A construção com ἀπό indica separação ou desligamento. Em português, “absolvido do pecado” é idiomático e preserva a referência ao pecado, que no contexto pode ser entendido também como poder personificado.
theological_decisions:
- issue: Se δικαιόω deve ser entendido aqui em sentido estritamente forense (“justificado/absolvido”) ou emancipatório (“libertado”).
  choice: foi absolvido do pecado
  alternative: foi justificado do pecado; foi libertado do pecado
  rationale: Romanos 6 enfatiza a libertação do domínio do pecado, mas Paulo emprega δικαιόω, verbo de caráter normalmente forense. “Absolvido” mantém a nuance judicial e continua adequado ao contexto de desligamento da reivindicação do pecado. A nota conserva as alternativas e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa acompanha a estrutura argumentativa do grego sem especificar gênero.
