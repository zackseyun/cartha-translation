lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que diremos, então?
  rationale: Conserva a transição inferencial e a pergunta retórica deliberativa de Paulo em português natural e digno.
- source_word: ἐπιμένωμεν
  choice: Devemos continuar
  rationale: O subjuntivo presente deliberativo propõe um curso contínuo de ação; “devemos continuar” comunica com clareza a força moral da pergunta sem transformá-la em ordem.
- source_word: τῇ ἁμαρτίᾳ
  choice: no pecado
  rationale: O dativo ligado a ἐπιμένω expressa permanência no âmbito ou na prática do pecado; “no pecado” é idiomático em português.
- source_word: ἵνα
  choice: para que
  rationale: Mantém explícita a finalidade ou o resultado pretendido apresentado pela formulação retórica.
- source_word: ἡ χάρις
  choice: a graça
  rationale: É a tradução estabelecida e adequada de χάρις neste contexto, em referência ao favor gracioso de Deus no argumento paulino.
- source_word: πλεονάσῃ
  choice: aumente
  rationale: Expressa de modo claro o crescimento em medida ou extensão; “se multiplique” preserva uma nuance lexical possível e aparece em nota.
theological_decisions:
- issue: Se a pergunta de Paulo deve ser formulada como permissão, obrigação ou simples previsão
  choice: 'Pergunta moral deliberativa: “Devemos continuar no pecado”'
  alternative: “Continuaremos no pecado?” / “Havemos de permanecer no pecado?”
  rationale: O subjuntivo grego apresenta retoricamente uma conduta proposta. “Devemos” evidencia o caráter deliberativo sem antecipar a rejeição de Paulo nem acrescentar uma conclusão doutrinária.
