id: ROM.6.23
reference: Romans 6:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: pt
  text: Pois o salário do pecado é a morte, mas o dom[a] de Deus é a vida eterna no Messias Jesus, nosso Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dádiva da graça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: salário
  rationale: Expressa aquilo que se recebe como pagamento e mantém, em português corrente, o contraste entre o que o pecado paga e aquilo que Deus dá.
- source_word: τῆς ἁμαρτίας
  choice: do pecado
  rationale: Preserva de modo compacto o genitivo grego, permitindo entender o salário como pertencente ao pecado ou pago por ele.
- source_word: θάνατος
  choice: morte
  rationale: Tradução direta que conserva a amplitude literal e teológica do termo sem especificar indevidamente o tipo de morte.
- source_word: χάρισμα
  choice: dom
  rationale: Mantém a ideia de uma dádiva procedente da graça e forma um contraste claro e natural com “salário”.
- source_word: ζωὴ αἰώνιος
  choice: vida eterna
  rationale: Equivalente consagrado e exato, que comunica tanto a duração quanto o peso teológico da expressão.
- source_word: ἐν
  choice: 'no'
  rationale: A contração portuguesa de “em o” conserva a linguagem paulina de esfera ou união, sem reduzi-la a mero meio ou instrumento.
- source_word: Χριστῷ
  choice: Messias
  rationale: Traduz Χριστός como título e torna explícito seu sentido messiânico, em vez de apenas transliterá-lo.
- source_word: κυρίῳ
  choice: Senhor
  rationale: Preserva o uso confessional cristão primitivo e a força teológica do título.
theological_decisions:
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: “no Messias Jesus”
  alternative: “por meio do Messias Jesus”
  rationale: A preposição exprime mais naturalmente esfera ou união. A tradução com “em” preserva essa tensão paulina e não restringe a frase à instrumentalidade.
- issue: Alcance de θάνατος
  choice: “morte”, sem qualificação
  alternative: “morte espiritual” ou “morte eterna”
  rationale: O texto grego não acrescenta uma qualificação; mantê-lo amplo evita resolver no texto traduzido uma questão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Salário” e “dom” ressaltam o contraste central entre recompensa merecida e dádiva divina; “Messias Jesus” preserva o caráter titular de Χριστός.
