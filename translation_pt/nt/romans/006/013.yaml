reference: Romans 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: pt
  text: E não ofereçam os membros do corpo ao pecado como armas da injustiça[a]; pelo contrário, ofereçam-se a Deus como vivos dentre os mortos, e ofereçam os membros do corpo a Deus como armas da justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrumentos da injustiça”; de modo correspondente, “instrumentos da justiça” no fim do versículo. “Retidão” também pode traduzir “justiça” neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: ofereçam / ofereçam-se
  rationale: “Oferecer” expressa naturalmente em português a ideia de colocar o corpo e a própria pessoa à disposição de alguém, preservando a repetição verbal e o contraste entre pecado e Deus.
- source_word: μέλη
  choice: membros do corpo
  rationale: A explicitação “do corpo” torna o sentido corporal inequívoco para leitores atuais, sem reduzir o termo apenas a braços e pernas.
- source_word: ὅπλα
  choice: armas
  rationale: “Armas” preserva a imagem de conflito sugerida pelo termo grego; “instrumentos” continua possível, mas enfraquece essa imagem.
- source_word: ἀδικίας
  choice: injustiça
  rationale: “Injustiça” é natural e digna em português, mantém o contraste lexical com “justiça” e abrange tanto a conduta errada quanto a oposição ao que é justo.
- source_word: ἁμαρτίᾳ
  choice: pecado
  rationale: A tradução direta permite que a personificação do pecado como poder atuante permaneça perceptível no contexto, sem acrescentar uma interpretação.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: como quem passou da morte para a vida
  rationale: Esta formulação comunica de modo natural a condição de pessoas vivas dentre os mortos, preservando a comparação e a tensão entre morte e vida sem afirmar explicitamente um agente não expresso.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” forma um par claro com “injustiça” e é uma tradução corrente de δικαιοσύνη; a alternativa teológica tradicional “retidão” é registrada em nota.
theological_decisions:
- issue: O contraste entre o pecado e Deus como destinatários rivais da entrega humana
  choice: Manter “ao pecado” e “a Deus” sem ampliar para “a serviço de”
  alternative: “ao serviço do pecado ... ao serviço de Deus”
  rationale: Os dativos gregos já indicam direção, disponibilidade e lealdade. A formulação direta conserva essa força sem inserir uma explicação interpretativa.
- issue: A linguagem de passagem da morte para a vida
  choice: “como quem passou da morte para a vida”
  alternative: “como vivos dentre os mortos”
  rationale: A escolha conserva a imagem de morte e vida e sua ressonância com a união com Cristo no contexto, mas evita determinar se a expressão descreve ressurreição literal, espiritual ou ambas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Membros do corpo” evita o sentido associativo moderno de “membros”, e “ofereçam-se” é mais idiomático do que “apresentem-se” para a ideia de colocar-se à disposição. O ponto e vírgula destaca o contraste imperativo.
