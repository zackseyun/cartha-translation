id: ROM.6.10
reference: Romans 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: pt
  text: Pois, a morte que ele morreu, morreu de uma vez por todas para o pecado[a]; mas a vida que vive, vive para Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «morreu pelo pecado» ou «morreu com respeito ao pecado».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: quanto à morte que ele morreu
  rationale: O pronome relativo neutro, ligado ao verbo repetido, aponta idiomaticamente para o fato ou aspecto de sua morte. A formulação preserva a ênfase e o paralelismo gregos em português compreensível.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém clara a ligação lógica.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo indica aqui o ato histórico consumado, expresso naturalmente pelo pretérito perfeito.
- source_word: τῇ ἁμαρτίᾳ
  choice: para o pecado
  rationale: O dativo expressa mais naturalmente relação ou orientação. Esta escolha preserva o contraste paulino com «para Deus» sem explicar além do texto.
- source_word: ἐφάπαξ
  choice: de uma vez por todas
  rationale: Comunica um ato único, irrepetível e de validade permanente.
- source_word: ὃ δὲ ζῇ
  choice: mas, quanto à vida que vive
  rationale: Espelha a primeira oração e preserva o paralelismo entre morte e vida sem recorrer a uma construção portuguesa excessivamente literal.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste entre sua morte e sua vida.
- source_word: τῷ θεῷ
  choice: para Deus
  rationale: Mantém o equilíbrio formal com «para o pecado» e exprime relação ou orientação para Deus.
theological_decisions:
- issue: Se τῇ ἁμαρτίᾳ deve ser traduzido de modo que possa sugerir pecado pessoal em Cristo.
  choice: para o pecado
  alternative: pelo pecado; com respeito ao pecado
  rationale: A expressão trata da morte de Cristo em relação ao pecado, não atribui pecado pessoal a ele. «Para o pecado» conserva a antítese com «para Deus» e mantém a tensão do texto; as outras possibilidades são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «quanto à morte que ele morreu» é deliberadamente marcada para conservar o paralelismo e a ênfase do grego; a repetição de «morreu» e «vive» reproduz a estrutura retórica do versículo.
