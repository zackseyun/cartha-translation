id: ROM.6.17
reference: Romans 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were slaves of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: pt
  text: Mas graças a Deus porque, embora vocês fossem escravos do pecado, obedeceram de coração ao padrão de ensino[a] ao qual foram entregues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forma de ensino” ou “modelo de ensino”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para o qual foram entregues”.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Mas graças a Deus
  rationale: A construção idiomática expressa gratidão dirigida a Deus; “graças a Deus” é natural em português e preserva o tom enfático de Paulo.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: escravos do pecado
  rationale: “Escravos” preserva a metáfora de domínio e pertencimento que estrutura Romanos 6; “do pecado” reproduz de modo claro a relação expressa pelo genitivo.
- source_word: ὑπηκούσατε
  choice: obedeceram
  rationale: O verbo indica obediência efetiva, não apenas ouvir ou acolher intelectualmente.
- source_word: ἐκ καρδίας
  choice: de coração
  rationale: Expressão portuguesa corrente que mantém a metáfora de καρδία e comunica obediência interior e sincera.
- source_word: τύπον διδαχῆς
  choice: padrão de ensino
  rationale: τύπος pode designar padrão, forma ou molde, enquanto διδαχή significa ensino; a formulação é clara e conserva a imagem normativa sem recorrer a vocabulário confessional.
- source_word: παρεδόθητε
  choice: foram entregues
  rationale: Mantém a voz passiva e a imagem marcante de que os próprios fiéis foram entregues ao ensino, em vez de inverter a relação e dizer que o ensino lhes foi transmitido.
- source_word: εἰς ὃν
  choice: ao qual
  rationale: Com “foram entregues”, “ao qual” expressa naturalmente em português a direção indicada por εἰς, enquanto a alternativa mais espacial é registrada em nota.
theological_decisions:
- issue: Se δοῦλοι deve ser suavizado como “servos” ou traduzido como “escravos”
  choice: escravos do pecado
  alternative: servos do pecado
  rationale: O argumento de Romanos 6 depende da metáfora de escravidão, posse e domínio. “Escravos” preserva essa força e o contraste posterior com a justiça.
- issue: Se a frase passiva deve ser reestruturada para dizer que o ensino foi entregue aos fiéis
  choice: o padrão de ensino ao qual foram entregues
  alternative: o ensino que lhes foi transmitido
  rationale: A sintaxe grega apresenta os fiéis como aqueles que foram entregues ao padrão de ensino. Conservar essa direção evita apagar uma imagem deliberadamente incomum.
- issue: Relação entre a antiga escravidão ao pecado e a obediência
  choice: embora vocês fossem escravos do pecado, obedeceram
  alternative: vocês eram escravos do pecado, mas obedeceram
  rationale: A formulação concessiva torna claro que a gratidão não é pela antiga escravidão, mas pela mudança manifestada na obediência, sem eliminar a tensão do enunciado grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O pronome “vocês” explicita o plural do verbo grego. A construção passiva e a metáfora forte de escravidão foram preservadas.
