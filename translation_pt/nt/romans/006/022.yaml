id: ROM.6.22
reference: Romans 6:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: pt
  text: Mas agora, tendo sido libertados do pecado e feitos escravos de Deus, vocês têm o seu fruto, que leva à santificação[a], e o fim[b] é a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que resulta em santidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o resultado final”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Mas agora
  rationale: Mantém o contraste enfático com a condição anterior e soa natural em português.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: tendo sido libertados do pecado
  rationale: Preserva o particípio aoristo passivo como uma ação já recebida pelos destinatários e mantém o singular “pecado” como poder ou domínio.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: e feitos escravos de Deus
  rationale: Conserva a força da metáfora de escravidão que estrutura o argumento de Romanos 6, sem suavizá-la para mera prestação de serviço.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: vocês têm o seu fruto
  rationale: Mantém tanto o verbo ἔχω quanto a metáfora agrícola de καρπός e o possessivo do texto grego.
- source_word: εἰς ἁγιασμόν
  choice: que leva à santificação
  rationale: Expressa de modo claro o movimento para um resultado indicado por εἰς, preservando o termo teológico ἁγιασμός.
- source_word: τὸ δὲ τέλος
  choice: e o fim é
  rationale: Mantém a correspondência lexical direta com τέλος e torna explícita, em português natural, a relação predicativa com “vida eterna”.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a formulação portuguesa tradicional, clara e semanticamente precisa.
theological_decisions:
- issue: Metáfora de escravidão em relação a Deus
  choice: feitos escravos de Deus
  alternative: postos a serviço de Deus
  rationale: O contexto contrapõe deliberadamente a escravidão ao pecado à escravidão a Deus; uma formulação mais branda reduziria a tensão retórica e teológica de Paulo.
- issue: Sentido de ἁγιασμός
  choice: santificação
  alternative: santidade
  rationale: “Santificação” preserva a possível dimensão de processo ou resultado no contexto, enquanto “santidade” continua sendo uma alternativa lexical legítima e aparece em nota.
- issue: Sentido de τέλος
  choice: fim
  alternative: resultado final
  rationale: “Fim” preserva a formulação concisa e a amplitude do grego, que pode indicar tanto o desfecho quanto o resultado culminante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A redação preserva as metáforas do fruto e da escravidão, ao mesmo tempo que explicita apenas o necessário para uma sintaxe portuguesa natural.
