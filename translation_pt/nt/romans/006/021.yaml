id: ROM.6.21
reference: Romans 6:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: pt
  text: Que fruto vocês tinham então das coisas de que agora se envergonham? Pois o fim dessas coisas é a morte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resultado”, em vez de “fim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: que
  rationale: Introduz de modo natural a pergunta retórica sobre qual fruto ou resultado eles obtinham em sua vida anterior.
- source_word: καρπὸν
  choice: fruto
  rationale: Preserva a metáfora paulina do que uma conduta produz, sem reduzi-la a “benefício” ou “resultado”.
- source_word: εἴχετε
  choice: vocês tinham
  rationale: Reproduz o sentido do imperfeito referente à condição anterior; em português, o imperfeito também expressa naturalmente essa continuidade passada.
- source_word: τότε
  choice: então
  rationale: Mantém de forma concisa o contraste temporal com “agora”.
- source_word: ἐφ’ οἷς
  choice: das coisas das quais
  rationale: Expressa a relação entre o fruto e as antigas práticas, tornando explícito o antecedente implícito sem interpretar além do necessário.
- source_word: νῦν
  choice: agora
  rationale: Preserva o contraste enfático entre a antiga vida e a perspectiva presente.
- source_word: ἐπαισχύνεσθε
  choice: se envergonham
  rationale: Comunica diretamente a força moral do verbo, mais intensa do que mero constrangimento.
- source_word: τέλος
  choice: fim
  rationale: Preserva tanto a ideia de término quanto a de consequência final, sem decidir entre essas nuances.
- source_word: ἐκείνων
  choice: dessas coisas
  rationale: Retoma com clareza e naturalidade as práticas recém-mencionadas; o demonstrativo português ajusta a referência discursiva sem alterar o sentido.
- source_word: θάνατος
  choice: morte
  rationale: É a correspondência direta e tradicional, preservando o peso teológico da afirmação.
theological_decisions:
- issue: Se τέλος deve ser traduzido como “fim” ou interpretado como “resultado”
  choice: fim
  alternative: resultado
  rationale: “Fim” mantém juntas as ideias possíveis de término e consequência, preservando a tensão sem especificar indevidamente apenas uma delas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para clareza internacional e boa legibilidade brasileira. A estrutura retórica e a metáfora do fruto foram preservadas.
