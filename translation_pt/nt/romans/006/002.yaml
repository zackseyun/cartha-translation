base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: pt
  text: De modo nenhum! Nós que morremos para o pecado, como ainda viveremos nele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que isso nunca aconteça!”; expressão enfática de rejeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressa de maneira natural e enfática a forte rejeição paulina, sem recorrer a formulação arcaica.
- source_word: οἵτινες
  choice: Nós, que
  rationale: Mantém a primeira pessoa inclusiva e identifica os próprios crentes mencionados por Paulo.
- source_word: ἀπεθάνομεν
  choice: morremos
  rationale: O aoristo aponta para uma ruptura apresentada como acontecimento definido; o pretérito perfeito simples é direto e natural em português.
- source_word: τῇ ἁμαρτίᾳ
  choice: para o pecado
  rationale: O dativo indica relação com o pecado. A expressão preserva a metáfora paulina sem explicá-la excessivamente.
- source_word: πῶς ἔτι
  choice: como ainda
  rationale: Conserva tanto a força da pergunta retórica quanto a ideia temporal de continuar na condição anterior.
- source_word: ζήσομεν
  choice: viveremos
  rationale: Mantém o futuro indicativo do grego e funciona naturalmente na pergunta retórica em português.
- source_word: ἐν αὐτῇ
  choice: nele
  rationale: Retoma 'pecado' como esfera ou domínio e preserva a coesão pronominal do original.
theological_decisions:
- issue: Se a afirmação descreve melhoria moral ou uma ruptura decisiva com o domínio do pecado
  choice: Preservar a formulação metafórica 'morremos para o pecado' como ruptura relacional decisiva, sem a explicar no corpo do versículo.
  alternative: Ficamos insensíveis ao pecado; abandonamos o pecado.
  rationale: O grego enuncia diretamente a metáfora. Mantê-la conserva a tensão teológica de Paulo e evita impor uma interpretação específica sobre o processo de santificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a concisão, a pergunta retórica e a metáfora do texto grego.
