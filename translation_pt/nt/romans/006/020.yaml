source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were slaves of sin[b][a], you were free in regard to righteousness.
translation:
  language: pt
  text: Pois, quando vocês eram escravos do pecado, eram livres em relação à justiça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “livres no que dizia respeito à justiça”; também se pode entender: “livres da justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva a força de sujeição e pertencimento no contraste de Romanos 6 entre duas escravidões rivais; “servos” enfraqueceria essa imagem.
- source_word: ἁμαρτίας
  choice: do pecado
  rationale: Reproduz naturalmente o genitivo, apresentando o pecado como senhor ou domínio ao qual os escravos pertenciam.
- source_word: ἐλεύθεροι
  choice: livres
  rationale: 'Mantém a ironia incisiva de Paulo: enquanto escravizados ao pecado, eles não estavam sujeitos à justiça.'
- source_word: τῇ δικαιοσύνῃ
  choice: em relação à justiça
  rationale: Entende o dativo como dativo de referência e preserva a tensão da expressão sem sugerir de modo inequívoco que a justiça fosse um poder opressor.
- source_word: γὰρ
  choice: Pois
  rationale: Conserva a ligação explicativa com o argumento anterior e soa natural no registro bíblico moderno.
theological_decisions:
- issue: Como expressar a relação dos antigos escravos do pecado com a justiça
  choice: eram livres em relação à justiça
  alternative: eram livres da justiça
  rationale: A formulação principal preserva a ambiguidade e a tensão retórica do dativo grego, sem transformar explicitamente a justiça em algo opressor nem parafrasear além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o referente plural de ἦτε. “Justiça” é a correspondência portuguesa natural de δικαιοσύνη e, neste contexto paulino, abrange a ideia de retidão sem precisar impor uma glosa denominacional.
