id: ROM.6.16
reference: Romans 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as slaves for obedience[a], you are slaves of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: pt
  text: Vocês não sabem que, quando se apresentam como escravos para obedecer, são escravos daquele a quem obedecem — seja do pecado, que leva à morte, seja da obediência, que leva à justiça[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: retidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: se apresentam
  rationale: Preserva a ideia de colocar-se à disposição de outro, com formulação natural em português moderno.
- source_word: δούλους / δοῦλοί
  choice: escravos
  rationale: Expressa a condição de sujeição que estrutura o contraste de Paulo; “servos” enfraqueceria essa imagem.
- source_word: εἰς ὑπακοήν
  choice: para obedecer
  rationale: Comunica com clareza a finalidade expressa por εἰς, embora transforme o substantivo grego em verbo para maior naturalidade em português.
- source_word: ᾧ ὑπακούετε
  choice: daquele a quem obedecem
  rationale: Mantém a personificação própria da imagem de escravidão sem acrescentar explicitamente a palavra “senhor”.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: Conserva o termo direto do grego e permite que a imagem contextual de escravidão transmita sua personificação.
- source_word: εἰς θάνατον
  choice: que leva à morte
  rationale: Expressa de modo natural a força direcional ou resultativa de εἰς.
- source_word: ὑπακοῆς
  choice: obediência
  rationale: Preserva o substantivo abstrato e o contraste retórico com “pecado”.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: É a correspondência tradicional e semanticamente ampla de δικαιοσύνη em português; “retidão” explicita melhor o aspecto moral e é registrada em nota.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contraste paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude teológica e relacional do termo grego no uso paulino, sem restringi-lo à justiça social ou apenas à conduta moral; “retidão” continua sendo uma alternativa contextual válida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “escravos” e “obediência/obedecer” foi mantida para conservar a estrutura argumentativa e a força da metáfora paulina.
