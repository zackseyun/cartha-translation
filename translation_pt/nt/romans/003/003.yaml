id: ROM.3.3
reference: Romans 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: pt
  text: E então? Se alguns foram infiéis[a], será que a infidelidade deles anulará a fidelidade de Deus[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não creram”.'
    reason: Registra a alternativa lexical de ἠπίστησάν.
  - marker: b
    text: Literalmente, “a fé de Deus”. Neste contexto, provavelmente se refere à fidelidade ou confiabilidade de Deus.
    reason: Registra a forma literal e a alternativa interpretativa de πίστις τοῦ θεοῦ.
lexical_decisions:
- source_word: τί γάρ
  choice: E então?
  rationale: Funciona como uma breve transição retórica que introduz a objeção ou inferência seguinte; a formulação é natural em português e preserva o movimento argumentativo.
- source_word: ἠπίστησάν
  choice: foram infiéis
  rationale: Embora o verbo possa significar que não creram, o paralelismo com ἀπιστία e o contraste com a πίστις de Deus favorecem aqui a ideia de infidelidade.
- source_word: τινες
  choice: alguns
  rationale: Reproduz naturalmente o pronome indefinido plural, sem sugerir um grupo tecnicamente delimitado.
- source_word: ἀπιστία
  choice: infidelidade
  rationale: Mantém a correspondência lexical com 'foram infiéis' e o contraste retórico com a fidelidade divina; 'incredulidade' continua sendo uma possibilidade contextual.
- source_word: πίστιν τοῦ θεοῦ
  choice: a fidelidade de Deus
  rationale: O genitivo grego é literalmente 'a fé de Deus', mas, no contraste com a infidelidade humana, πίστις denota mais provavelmente a fidelidade ou confiabilidade de Deus.
- source_word: καταργήσει
  choice: anulará
  rationale: Comunica de maneira clara e idiomática a ideia de tornar sem efeito ou invalidar.
theological_decisions:
- issue: Sentido de πίστιν τοῦ θεοῦ numa expressão paulina discutida
  choice: a fidelidade de Deus
  alternative: a fé de Deus
  rationale: O contraste entre a ἀπιστία humana e a πίστις divina favorece 'fidelidade', sem ocultar a forma mais literal e possível, registrada em nota.
- issue: Sentido de ἀπιστέω e ἀπιστία
  choice: foram infiéis / infidelidade
  alternative: não creram / incredulidade
  rationale: A tradução escolhida preserva a simetria retórica com a fidelidade de Deus, enquanto a nota reconhece a nuance possível de incredulidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'E então?' expressa a transição argumentativa; a pergunta com 'será que' soa natural sem alterar a expectativa retórica de resposta negativa.
