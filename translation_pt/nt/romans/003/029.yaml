id: ROM.3.29
reference: Romans 3:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: pt
  text: Ou Deus é apenas o Deus dos judeus? Não é também o Deus dos gentios[a]? Sim, também dos gentios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das nações”.
    reason: Alternativa lexical mais literal para ἐθνῶν; no contexto, o termo se refere aos povos não judeus.
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz uma nova alternativa retórica no desenvolvimento do argumento de Paulo.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: Expressa naturalmente em português o genitivo ligado a θεός e mantém a referência coletiva.
- source_word: ὁ θεὸς
  choice: Deus é Deus
  rationale: A repetição explicita em português a relação predicativa do grego — Deus como Deus de determinado povo — sem mudar o argumento.
- source_word: μόνον
  choice: apenas
  rationale: Comunica de modo claro e atual a exclusividade questionada por Paulo.
- source_word: οὐχὶ καὶ
  choice: Não é também
  rationale: Preserva a forma interrogativa e indica que a pergunta espera resposta afirmativa.
- source_word: ἐθνῶν
  choice: dos gentios
  rationale: No contraste explícito com os judeus, designa os povos não judeus; “gentios” mantém essa distinção de modo conciso.
- source_word: ναὶ
  choice: Sim
  rationale: Reproduz a resposta afirmativa breve e enfática.
- source_word: καὶ
  choice: também
  rationale: Inclui os gentios ao lado dos judeus e preserva a ênfase inclusiva.
theological_decisions:
- issue: Se ἐθνῶν deve ser traduzido por “gentios” ou “nações”
  choice: gentios
  alternative: nações
  rationale: O contraste com Ἰουδαίων mostra que estão em vista os não judeus, e não Estados ou nações em sentido geopolítico. A alternativa mais literal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica direta. “Gentios” é um termo bíblico corrente e preciso neste contraste; a repetição “Deus é Deus” preserva a força da pergunta grega e continua compreensível em português.
