id: ROM.3.19
reference: Romans 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: pt
  text: Sabemos, porém, que tudo o que a lei diz, ela o diz aos que estão sob a lei[a], para que toda boca seja calada[b] e o mundo inteiro fique sujeito a prestar contas a Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “aos que estão na lei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que toda boca se feche”.
    reason: lexical_alternative
  - marker: c
    text: Ou “se torne responsável perante Deus”, “fique sujeito ao julgamento de Deus” ou “seja considerado culpado diante de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Sabemos, porém
  rationale: “Sabemos” expressa conhecimento compartilhado no presente. “Porém” representa o valor conectivo de δέ sem introduzir uma ideia temporal ausente do grego.
- source_word: ὅσα ὁ νόμος λέγει
  choice: tudo o que a lei diz
  rationale: Mantém a abrangência de ὅσα e a referência definida à lei como autoridade reconhecida no argumento de Paulo.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: aos que estão sob a lei
  rationale: A expressão grega é literalmente “aos que estão na lei”, mas “sob a lei” comunica de modo natural a ideia de estar dentro de sua jurisdição.
- source_word: λαλεῖ
  choice: ela o diz
  rationale: O pronome retoma “tudo o que” e produz uma frase natural em português. Embora não preserve a distinção verbal entre λέγει e λαλεῖ, conserva claramente o sentido de a lei dirigir sua fala a determinado grupo.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a finalidade ou resultado pretendido da fala da lei.
- source_word: πᾶν στόμα φραγῇ
  choice: toda boca seja calada
  rationale: Preserva a metáfora concreta e a voz passiva do grego, com sua imagem judicial de impedir qualquer defesa ou contestação.
- source_word: ὑπόδικος γένηται
  choice: fique sujeito a prestar contas
  rationale: Comunica de forma idiomática o ingresso numa condição de responsabilidade judicial. Evita tornar explícito um veredito de culpa que, embora possível no contexto, é mais forte que o adjetivo isoladamente.
- source_word: πᾶς ὁ κόσμος
  choice: o mundo inteiro
  rationale: Preserva o alcance universal da expressão, que abrange toda a humanidade.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: A construção com “prestar contas” permite representar naturalmente o dativo grego e identifica Deus como aquele diante de quem o mundo responde.
theological_decisions:
- issue: Força jurídica de ὑπόδικος diante do juízo divino
  choice: o mundo inteiro fique sujeito a prestar contas a Deus
  alternative: o mundo inteiro seja considerado culpado diante de Deus; o mundo inteiro fique sujeito ao julgamento de Deus
  rationale: A tradução mantém a imagem forense e a responsabilidade universal perante Deus sem resolver a expressão exclusivamente como um veredito já pronunciado de culpa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a metáfora judicial e a tensão entre responsabilidade, sujeição ao julgamento e culpa, sem impor uma leitura denominacional.
