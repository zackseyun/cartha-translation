  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: pt
  text: Muita, sob todos os aspectos. Pois, em primeiro lugar, foram-lhes confiadas as palavras[a] de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os oráculos”.
    reason: Preserva a alternativa formal para λόγια, termo que designa declarações ou revelações divinas.
lexical_decisions:
- source_word: πολὺ
  choice: Muita
  rationale: Retoma de forma elíptica a “vantagem” mencionada no versículo anterior; a concordância feminina torna a resposta natural em português sem acrescentar conteúdo.
- source_word: κατὰ πάντα τρόπον
  choice: em todos os sentidos
  rationale: Expressa a abrangência da afirmação de Paulo em português corrente e preserva a ideia de que a vantagem existe sob todos os aspectos.
- source_word: πρῶτον μὲν γὰρ
  choice: Pois, em primeiro lugar
  rationale: “Pois” representa γὰρ e liga a explicação à afirmação anterior; “em primeiro lugar” comunica a função discursiva de πρῶτον μὲν, embora não apareça de imediato um segundo item.
- source_word: ἐπιστεύθησαν
  choice: a eles foram confiadas
  rationale: O passivo de πιστεύω aqui significa receber algo em confiança. A formulação portuguesa preserva tanto o sentido de incumbência quanto a referência implícita aos judeus no contexto.
- source_word: τὰ λόγια
  choice: as palavras
  rationale: Refere-se a declarações ou revelações divinas. “Palavras” é claro e natural para leitores modernos; a alternativa mais técnica, “oráculos”, fica registrada em nota.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz de modo direto o genitivo, que pode comunicar pertencimento e origem sem exigir que se escolha apenas uma dessas nuances.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse inicial depende da pergunta do versículo anterior, como no grego; “a eles” preserva a referência contextual sem repetir explicitamente “os judeus”.
