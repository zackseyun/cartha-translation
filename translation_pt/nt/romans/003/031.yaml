id: ROM.3.31
reference: Romans 3:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: pt
  text: Então, anulamos a lei por meio da fé? De modo nenhum! Pelo contrário, sustentamos a lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabelecemos a lei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: a lei
  rationale: Embora não tenha artigo no grego, no argumento de Romanos refere-se à lei já em foco, entendida como a Lei/Torá; o artigo definido é natural e claro em português.
- source_word: οὖν
  choice: então
  rationale: Introduz a inferência retórica decorrente do argumento anterior e mantém a pergunta natural em português moderno.
- source_word: καταργοῦμεν
  choice: anulamos
  rationale: Expressa tornar sem efeito ou invalidar, sem sugerir necessariamente uma revogação legislativa, e forma um contraste claro com ἱστάνομεν.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Preserva de modo explícito o valor instrumental de διά com o genitivo e traduz πίστις pelo termo corrente «fé».
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Reproduz a rejeição enfática da expressão grega em linguagem atual, digna e idiomática.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca com clareza a forte correção contrastiva introduzida por Paulo.
- source_word: ἱστάνομεν
  choice: sustentamos
  rationale: No contexto, comunica manter firme ou validar a lei, em oposição a anulá-la, sem sugerir que a lei esteja sendo criada pela primeira vez.
theological_decisions:
- issue: Relação entre a fé e a lei
  choice: sustentamos a lei
  alternative: estabelecemos a lei; confirmamos a lei
  rationale: O grego admite «estabelecemos», mas essa formulação pode sugerir em português que a lei passa a existir. «Sustentamos» preserva o contraste com «anulamos» e a ideia de manter a lei firme, sem impor um esquema denominacional específico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil; tom digno e retórico. A repetição de «a lei» conserva a coesão do grego, e a formulação mantém a tensão paulina entre fé e lei sem explicá-la além do texto.
