  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: pt
  text: Qual é, então, a vantagem do judeu?[b] Ou qual é o benefício da circuncisão?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual é o valor da circuncisão?”'
    reason: Alternativa lexical para ὠφέλεια, que pode indicar benefício, utilidade ou valor.
  - marker: b
    text: “O judeu” está no singular representativo e se refere ao judeu como categoria.
    reason: Nota linguística para esclarecer o uso genérico do singular com artigo.
lexical_decisions:
- source_word: Τί οὖν
  choice: Qual é, então
  rationale: Preserva a transição inferencial e a forma de pergunta retórica de Paulo em português natural.
- source_word: τὸ περισσὸν
  choice: a vantagem
  rationale: Neste contexto, o termo indica aquilo que constitui uma condição vantajosa ou distintiva, sem afirmar superioridade étnica.
- source_word: τοῦ Ἰουδαίου
  choice: do judeu
  rationale: Mantém o singular representativo com artigo empregado no grego, em vez de reformulá-lo no plural.
- source_word: ἢ τίς
  choice: Ou qual é
  rationale: Conserva o paralelismo entre as duas perguntas retóricas.
- source_word: ἡ ὠφέλεια
  choice: o benefício
  rationale: Expressa com clareza a ideia de proveito ou utilidade e mantém uma leve distinção em relação a “vantagem”.
- source_word: τῆς περιτομῆς
  choice: da circuncisão
  rationale: Traduz diretamente o rito mencionado, que no contexto funciona como sinal da identidade da aliança.
theological_decisions:
- issue: Se Ἰουδαίου deve ser traduzido como singular genérico ou por uma paráfrase inclusiva
  choice: do judeu
  alternative: da pessoa judia; dos judeus
  rationale: Paulo emprega um masculino singular representativo. Mantê-lo preserva sua forma retórica sem transformar o texto em uma abstração ou plural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo das duas perguntas gregas foram preservados; os marcadores foram colocados junto às expressões que explicam.
