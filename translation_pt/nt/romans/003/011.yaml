  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: pt
  text: Não há quem entenda; não há quem busque a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procure diligentemente a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: entenda
  rationale: O particípio substantivado indica quem compreende ou tem discernimento. “Quem entenda” é natural em português e preserva o sentido sem acrescentar um objeto que o grego não explicita.
- source_word: ἐκζητῶν
  choice: busque
  rationale: O verbo composto pode sugerir procura intensa ou diligente, mas “busque a Deus” comunica o sentido com clareza e naturalidade. A possível nuance intensiva é mantida em nota.
- source_word: οὐκ ἔστιν
  choice: Não há quem
  rationale: Esta construção idiomática em português preserva a negação categórica e introduz naturalmente os particípios substantivados.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: quem entenda / quem busque
  rationale: As orações com “quem” representam naturalmente em português os particípios substantivados gregos e mantêm o paralelismo.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: “Buscar a Deus” é uma construção portuguesa corrente e digna, com o referente plenamente preservado.
theological_decisions:
- issue: Alcance da negação na série de citações de Paulo
  choice: Manter a formulação absoluta “Não há quem...” nas duas orações.
  alternative: “Ninguém realmente entende; ninguém busca Deus de verdade.”
  rationale: O grego emprega negação categórica, sem qualificadores. Acrescentar “realmente” ou “de verdade” interpretaria e atenuaria indevidamente a formulação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O paralelismo e a força categórica do original foram preservados; a nota registra a possível intensidade de ἐκζητέω.
