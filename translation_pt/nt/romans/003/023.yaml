id: ROM.3.23
reference: Romans 3:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: pt
  text: pois todos pecaram e carecem da glória de Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficam aquém da glória de Deus” ou “não têm a glória de Deus”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “a glória de Deus” pode se referir à própria glória de Deus, à glória que os seres humanos deveriam refletir ou à glória concedida por Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: Mantém de forma concisa o alcance humano abrangente no contexto, sem acrescentar um substantivo ausente do grego.
- source_word: γὰρ
  choice: pois
  rationale: Expressa naturalmente a função explicativa de γάρ e liga o versículo ao argumento anterior de Paulo.
- source_word: ἥμαρτον
  choice: pecaram
  rationale: O aoristo resume o fato do pecado de todos; o pretérito perfeito simples é a forma natural em português e evita impor ao aspecto grego uma nuance verbal adicional.
- source_word: ὑστεροῦνται
  choice: carecem
  rationale: Comunica a condição presente de falta ou deficiência indicada pelo presente grego. É uma formulação natural e digna, sem sugerir necessariamente uma meta quantitativa.
- source_word: δόξης
  choice: glória
  rationale: É o equivalente consagrado e semanticamente apropriado para δόξα, preservando sua amplitude teológica.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente o genitivo e não decide se a glória pertence a Deus, é concedida por ele ou deveria ser refletida pelos seres humanos.
theological_decisions:
- issue: Sentido de “a glória de Deus”
  choice: Manter a expressão aberta “a glória de Deus”.
  alternative: “a glória que vem de Deus”, “o padrão glorioso de Deus” ou “participar da glória de Deus”
  rationale: A expressão grega é compacta e admite mais de uma relação semântica. A tradução não deve encerrar a tensão interpretativa no texto principal.
- issue: Nuance de ὑστεροῦνται
  choice: Traduzir por “carecem”.
  alternative: “ficam aquém de” ou “não alcançam”
  rationale: “Carecem” preserva a ideia de falta contínua e permite tanto a noção de não alcançar quanto a de estar privado, sem definir indevidamente a natureza da glória.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Pois” mantém a ligação argumentativa; “carecem” é corrente em registro bíblico acessível, embora ligeiramente mais formal que “não têm”.
