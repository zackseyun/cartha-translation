id: ROM.3.4
reference: Romans 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: pt
  text: 'De modo nenhum! Pelo contrário, seja Deus verdadeiro, e todo ser humano, mentiroso, como está escrito: “Para que sejas justificado[a] em tuas palavras e prevaleças quando fores julgado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejas reconhecido como justo” ou “sejas vindicado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quando julgares”; essa alternativa reflete mais diretamente a formulação hebraica de Salmo 51:4, enquanto o grego de Romanos é lido mais naturalmente como “quando fores julgado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Expressa com força e naturalidade a enfática rejeição idiomática de Paulo, sem enfraquecê-la.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: seja Deus verdadeiro
  rationale: Mantém a força imperativa e o contraste direto entre Deus como verdadeiro e todo ser humano como mentiroso.
- source_word: πᾶς ... ἄνθρωπος
  choice: todo ser humano
  rationale: Comunica a referência humana genérica de ἄνθρωπος e preserva o valor distributivo de πᾶς em linguagem moderna e inclusiva.
- source_word: ψεύστης
  choice: mentiroso
  rationale: É o equivalente substantivo mais direto e natural, preservando a antítese com “verdadeiro”.
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Reproduz de modo conciso e tradicional a fórmula de citação das Escrituras.
- source_word: δικαιωθῇς
  choice: sejas justificado
  rationale: Preserva o registro forense do verbo e sua forma passiva; neste contexto, significa que Deus é reconhecido ou demonstrado como estando com a razão, não que passe a ser justo.
- source_word: λόγοις
  choice: palavras
  rationale: Equivalente direto que se ajusta tanto ao grego de Romanos quanto ao contexto da citação do Salmo.
- source_word: νικήσεις
  choice: prevaleças
  rationale: Comunica vitória no contexto judicial sem introduzir uma imagem excessivamente militar.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: quando fores julgado
  rationale: Representa a leitura passiva mais natural da forma grega presente em Romanos, mantendo em nota a alternativa ligada ao texto hebraico do Salmo.
theological_decisions:
- issue: Sentido forense de δικαιωθῇς quando aplicado a Deus
  choice: “sejas justificado”, no sentido de ser reconhecido como estando com a razão
  alternative: “sejas reconhecido como justo” ou “sejas vindicado”
  rationale: O contexto contrapõe a veracidade de Deus à falsidade humana. Não se afirma que Deus se torne justo, mas que sua justiça e razão sejam demonstradas.
- issue: Voz de κρίνεσθαί na citação do Salmo
  choice: 'Leitura passiva: “quando fores julgado”'
  alternative: 'Leitura ativa conforme a formulação hebraica de Salmo 51:4: “quando julgares”'
  rationale: A forma grega de Romanos é naturalmente entendida como passiva, embora a diferença em relação ao hebraico do Salmo seja relevante e deva permanecer visível em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação preserva o paralelismo incisivo, o registro judicial da citação e a ambiguidade textual relevante entre Romanos e o Salmo.
