base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: pt
  text: sendo justificados[a] gratuitamente por sua graça, por meio da redenção que está no Messias Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sendo declarados justos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “Cristo Jesus”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: sendo justificados
  rationale: Mantém a forma participial passiva e a ligação sintática com o versículo anterior, além de preservar o termo paulino consagrado; a alternativa explicativa aparece em nota.
- source_word: δωρεὰν
  choice: gratuitamente
  rationale: Expressa de modo claro e conciso que a justificação é concedida como dádiva, sem mérito ou pagamento humano.
- source_word: τῇ αὐτοῦ χάριτι
  choice: por sua graça
  rationale: Conserva a linguagem paulina tradicional e atribui explicitamente a graça a Deus, como no grego.
- source_word: διὰ τῆς ἀπολυτρώσεως
  choice: por meio da redenção
  rationale: Representa o valor instrumental de διά e preserva em 'redenção' a ideia de libertação mediante resgate.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: que há no Messias Jesus
  rationale: Liga a expressão preposicional a 'redenção' e mantém Χριστός como título messiânico, sem tornar a relação mais específica do que o grego.
theological_decisions:
- issue: Linguagem paulina da justificação
  choice: sendo justificados
  alternative: sendo declarados justos
  rationale: A formulação principal conserva o termo teológico e a concisão do particípio grego, enquanto a nota registra a legítima explicitação forense.
- issue: Valor de Χριστός em Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Traduz Χριστός como título, preservando seu conteúdo messiânico; a forma tradicional portuguesa é fornecida em nota.
- issue: Relação expressa por ἐν
  choice: que há no Messias Jesus
  alternative: encontrada no Messias Jesus
  rationale: A redação preserva a amplitude da expressão grega, sem decidir se ἐν deve ser entendido estritamente como localização, esfera, união ou agência.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem conserva a progressão do grego e a continuidade com Romanos 3:23; usa terminologia paulina reconhecível sem resolver ambiguidades legítimas.
