source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: pt
  text: E então? Somos melhores? De modo nenhum[a], pois já acusamos tanto judeus como gregos de estarem todos sob o pecado[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Temos alguma vantagem?”'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sob o poder do pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: E então?
  rationale: Mantém de forma concisa a transição inferencial de οὖν e o tom argumentativo da pergunta, sem acrescentar conteúdo.
- source_word: προεχόμεθα
  choice: Somos melhores?
  rationale: Expressa naturalmente a possível superioridade comparativa em discussão. Como a forma média admite a ideia de possuir vantagem, essa leitura é preservada em nota.
- source_word: οὐ πάντως
  choice: De modo nenhum
  rationale: Comunica a negação enfática do grego em português atual e digno.
- source_word: προῃτιασάμεθα
  choice: já acusamos
  rationale: Preserva o sentido forense de apresentar previamente uma acusação, adequado ao argumento desenvolvido por Paulo.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: tanto judeus como gregos
  rationale: Reproduz com naturalidade a construção correlativa τε καὶ e mantém a designação explícita 'gregos' do texto-fonte.
- source_word: πάντας
  choice: todos
  rationale: Mantém a abrangência total dos dois grupos mencionados.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: estarem todos debaixo do pecado
  rationale: Conserva a metáfora paulina compacta de sujeição ao pecado, sem explicitar no corpo do texto uma interpretação não expressa diretamente.
theological_decisions:
- issue: Sentido da primeira pessoa do plural em προεχόμεθα
  choice: 'A pergunta é vertida como possível superioridade comparativa: “Somos melhores?”'
  alternative: “Temos alguma vantagem?”
  rationale: O contexto trata do privilégio e da responsabilidade dos judeus. A tradução principal comunica a negação de superioridade moral, enquanto a nota preserva a leitura lexical plausível referente a vantagem.
- issue: Força de ὑφ’ ἁμαρτίαν
  choice: “debaixo do pecado”
  alternative: “sob o poder do pecado”
  rationale: A formulação principal conserva a imagem aberta e teologicamente densa do grego; a nota oferece a explicitação legítima da ideia de domínio sem impô-la ao texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto; “de modo nenhum” mantém a ênfase retórica, e “debaixo do pecado” preserva a metáfora paulina. Todos os marcadores de nota aparecem no texto principal.
