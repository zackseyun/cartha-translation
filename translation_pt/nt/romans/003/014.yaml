lexical_decisions:
- source_word: ὧν
  choice: deles
  rationale: O pronome relativo genitivo retoma as pessoas descritas no contexto anterior. Em português, “deles” produz uma construção coletiva natural sem alterar a referência.
- source_word: τὸ στόμα
  choice: a boca
  rationale: Mantém o substantivo no singular coletivo, como no grego, em uma expressão clara e idiomática em português.
- source_word: ἀρᾶς
  choice: maldição
  rationale: Traduz diretamente o substantivo que denota maldição ou fala que invoca o mal; no contexto de “a boca está cheia”, “maldição” é natural e preserva a força moral do termo.
- source_word: πικρίας
  choice: amargura
  rationale: Equivalente transparente que conserva tanto a imagem quanto o caráter moral da fala descrita.
- source_word: γέμει
  choice: está cheia
  rationale: Reproduz o presente e a ideia de estar repleto de algo, com formulação corrente em português.
