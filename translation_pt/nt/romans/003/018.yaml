  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: pt
  text: Não há temor de Deus diante dos olhos deles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há reverência por Deus diante dos olhos deles.”'
    reason: lexical_alternative
  - marker: b
    text: Citação do Salmo 36:1 (35:2 na Septuaginta).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Não há
  rationale: Emprega a construção existencial negativa mais natural em português e preserva a força do presente grego.
- source_word: φόβος
  choice: temor
  rationale: “Temor” conserva o sentido básico de medo e, no contexto da relação com Deus, também permite a nuance de reverência sem reduzi-lo a uma só interpretação.
- source_word: θεοῦ
  choice: de Deus
  rationale: Reproduz naturalmente o genitivo grego na expressão bíblica estabelecida, mantendo Deus como objeto do temor.
- source_word: ἀπέναντι
  choice: diante de
  rationale: Preserva a imagem espacial e metafórica do que está perante a vista ou consciência de alguém.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: dos olhos deles
  rationale: Mantém a imagem concreta dos “olhos” e evita substituir o idioma bíblico por uma abstração como “na consciência deles”.
theological_decisions:
- issue: Amplitude semântica de φόβος aplicado a Deus
  choice: temor
  alternative: reverência
  rationale: “Temor” preserva a tensão entre medo, respeito profundo e reverência presente no termo grego e no idioma bíblico; “reverência” explicitaria apenas uma de suas nuances.
translation_notes:
  register: Português moderno, claro e digno, com redação natural tanto no Brasil quanto em outros contextos lusófonos. A formulação conserva a imagem bíblica concreta e acompanha de perto a estrutura do grego.
