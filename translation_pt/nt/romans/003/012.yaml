  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: pt
  text: Todos se desviaram; juntos se tornaram inúteis[a]. Não há quem faça o bem[b]; não há nem um sequer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem valor” ou “corrompidos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pratique a bondade”; χρηστότητα também pode ter o sentido de “benignidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Todos
  rationale: Mantém o alcance universal do plural grego sem acrescentar um substantivo ausente no texto.
- source_word: ἐξέκλιναν
  choice: se desviaram
  rationale: Expressa de modo natural o afastamento moral e preserva o aspecto pontual do aoristo.
- source_word: ἅμα
  choice: juntos
  rationale: 'Comunica a força coletiva: todos compartilham a mesma condição.'
- source_word: ἠχρεώθησαν
  choice: se tornaram inúteis
  rationale: Preserva a ideia passiva/resultativa do verbo e seu sentido básico de perder a utilidade ou o valor.
- source_word: ποιῶν
  choice: faça
  rationale: Transforma naturalmente o particípio em oração relativa, sem perder o sentido geral de praticar ou realizar.
- source_word: χρηστότητα
  choice: o bem
  rationale: É uma formulação portuguesa clara para a qualidade moral indicada, embora o termo também possa significar bondade ou benignidade.
- source_word: οὐκ ἔστιν
  choice: Não há quem
  rationale: Reproduz em português corrente a construção existencial negativa com sujeito implícito.
- source_word: ἕως ἑνός
  choice: nem um sequer
  rationale: 'Transmite idiomaticamente a conclusão enfática: nenhuma exceção, nem mesmo uma pessoa.'
