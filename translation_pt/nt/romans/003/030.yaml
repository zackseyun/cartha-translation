  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: pt
  text: visto que Deus é um só[a], e ele justificará os circuncidados com base na fé e os incircuncisos por meio da fé[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se de fato Deus é um só”.'
    reason: alternative_reading
  - marker: b
    text: O grego traz literalmente “circuncisão” e “incircuncisão”, referindo-se, respectivamente, aos circuncidados e aos incircuncisos.
    reason: cultural_note
  - marker: c
    text: Paulo emprega duas expressões diferentes, aqui traduzidas como “com base na fé” e “por meio da fé”; a diferença pode ser apenas estilística, sem indicar um contraste preciso.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: visto que
  rationale: No argumento, a expressão introduz uma razão baseada na convicção monoteísta compartilhada, sem sugerir verdadeira incerteza; a leitura condicional permanece registrada em nota.
- source_word: εἷς ὁ θεός
  choice: Deus é um só
  rationale: Preserva a afirmação monoteísta enfática e soa natural em português moderno.
- source_word: δικαιώσει
  choice: justificará
  rationale: Mantém o futuro e o termo paulino tradicional e preciso para δικαιόω.
- source_word: περιτομήν
  choice: os circuncidados
  rationale: O substantivo abstrato funciona metonimicamente para designar pessoas circuncidadas, sem explicitar no texto principal uma identificação étnica.
- source_word: ἐκ πίστεως
  choice: com base na fé
  rationale: Expressa de modo claro o possível sentido de base ou fundamento de ἐκ, ao mesmo tempo que o distingue da construção seguinte com διά.
- source_word: ἀκροβυστίαν
  choice: os incircuncisos
  rationale: Representa a metonímia grega para pessoas não circuncidadas sem substituí-la interpretativamente por “gentios”.
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Preserva a preposição διά e sua possível nuance instrumental, sem transformar a diferença de expressão em contraste doutrinário definido.
- source_word: πίστεως
  choice: fé
  rationale: É a equivalência corrente e adequada de πίστις neste contexto; não há aqui construção genitiva controvertida que exija outra formulação.
theological_decisions:
- issue: Se Paulo pretende uma distinção teológica entre ἐκ πίστεως e διὰ τῆς πίστεως
  choice: Preservar a diferença como “com base na fé” e “por meio da fé”, sem afirmar um contraste doutrinário rígido.
  alternative: Traduzir ambas as expressões simplesmente como “pela fé”, tratando a variação como estilística.
  rationale: As preposições gregas são diferentes e convém tornar essa diferença visível, mas o contexto não permite definir com segurança uma distinção teológica entre elas.
- issue: Valor de εἴπερ
  choice: 'Entender a expressão como causal: “visto que”.'
  alternative: 'Entendê-la condicionalmente: “se de fato”.'
  rationale: O fluxo do argumento apela à unicidade de Deus como convicção compartilhada, embora a forma grega também admita uma tradução condicional, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Incircuncisos” preserva o par conceitual com “circuncidados”; as formulações distintas para ἐκ e διά mantêm a tensão lexical do original.
