source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: pt
  text: Onde está, então, a vanglória? Foi excluída. Por meio de que lei? A das obras? Não, mas por meio da lei da fé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: vanglória
  rationale: Expressa o ato ou fundamento de gloriar-se com conotação negativa neste contexto, em linguagem bíblica corrente e compreensível.
- source_word: ἐξεκλείσθη
  choice: foi excluída
  rationale: Preserva a forma passiva e a ideia enfática de que a vanglória ficou inteiramente sem lugar.
- source_word: νόμος
  choice: lei
  rationale: Mantém deliberadamente a repetição e a tensão retórica do grego, sem substituir o termo por princípio ou sistema.
- source_word: πίστεως
  choice: da fé
  rationale: Reproduz o genitivo grego de modo natural, preservando sua concisão e sem explicitar além do texto a relação precisa entre lei e fé.
- source_word: διὰ
  choice: por meio de
  rationale: Representa o valor instrumental da preposição com genitivo nas duas ocorrências e mantém o paralelismo.
theological_decisions:
- issue: Sentido de “lei da fé”
  choice: lei da fé
  alternative: princípio da fé
  rationale: A tradução retém νόμος como “lei” e preserva o paradoxo e a ambiguidade teológica do argumento paulino, em vez de interpretá-lo antecipadamente como mero princípio.
- issue: Agente da exclusão da vanglória
  choice: Foi excluída
  alternative: Deus a excluiu
  rationale: Mantém a voz passiva do original e não fornece um agente que o versículo não identifica explicitamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sequência de perguntas breves conserva a força dialógica do original. “A das obras?” elide naturalmente “lei” em português, como no grego, sem perder clareza.
