- source_word: εἰρήνης
  choice: paz
  rationale: É o equivalente corrente e claro; caracteriza o caminho como orientado para a paz ou marcado por ela.
- source_word: οὐκ ἔγνωσαν
  choice: não conheceram
  rationale: O pretérito perfeito simples traduz naturalmente o aoristo grego e expressa que essas pessoas não chegaram a conhecer nem reconhecer esse caminho.
