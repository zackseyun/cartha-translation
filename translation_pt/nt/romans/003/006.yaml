  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: pt
  text: De modo nenhum![a] Do contrário, como Deus julgará o mundo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que isso nunca aconteça!”'
    reason: Registra uma tradução mais formal da expressão grega μὴ γένοιτο.
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: A expressão é uma fórmula enfática de repúdio. “De modo nenhum!” comunica sua força em português atual e digno, sem reproduzir de maneira artificial a forma optativa grega.
- source_word: ἐπεὶ
  choice: Do contrário
  rationale: Neste contexto argumentativo, a conjunção introduz a consequência lógica da hipótese que acaba de ser rejeitada. “Do contrário” torna essa relação clara e natural.
- source_word: κρινεῖ
  choice: julgará
  rationale: Preserva diretamente o futuro do indicativo grego e evita acrescentar uma nuance modal como “poderia julgar”.
- source_word: κόσμον
  choice: o mundo
  rationale: É o equivalente português mais natural e abrangente para o objeto do julgamento divino neste contexto.
theological_decisions:
- issue: Força da fórmula paulina μὴ γένοιτο
  choice: 'Repúdio enfático da conclusão anterior: “De modo nenhum!”'
  alternative: 'Tradução mais formal da construção: “Que isso nunca aconteça!”'
  rationale: A opção principal preserva a força retórica da expressão convencional de Paulo sem transformá-la em desejo literal nem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão e a força da pergunta retórica do original.
