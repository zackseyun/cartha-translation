  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: pt
  text: Pois concluímos que a pessoa é justificada pela fé, independentemente das obras da lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é declarada justa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: concluímos
  rationale: O verbo expressa aqui uma avaliação racional que chega a uma conclusão no desenvolvimento do argumento de Paulo. “Concluímos” é natural e preciso em português.
- source_word: γάρ
  choice: pois
  rationale: A conjunção introduz a fundamentação do argumento anterior. “Pois” preserva de modo conciso essa relação explicativa.
- source_word: δικαιοῦσθαι
  choice: é justificada
  rationale: A forma passiva é vertida pela expressão paulina consagrada “é justificada”, que mantém a precisão e a continuidade teológica; a alternativa explicativa consta em nota.
- source_word: πίστει
  choice: pela fé
  rationale: “Pela fé” é uma formulação portuguesa idiomática e preserva o valor instrumental da construção sem especificá-lo além do que o grego permite.
- source_word: ἄνθρωπον
  choice: a pessoa
  rationale: Embora o substantivo grego seja gramaticalmente masculino, seu sentido neste contexto é genérico. “A pessoa” comunica esse alcance representativo com clareza.
- source_word: χωρὶς
  choice: independentemente de
  rationale: A expressão indica exclusão ou separação. “Independentemente das” comunica naturalmente que a justificação não depende das obras da lei.
- source_word: ἔργων νόμου
  choice: obras da lei
  rationale: A formulação preserva a reconhecida expressão paulina e a ligação explícita com νόμος, sem reduzi-la a boas ações em geral nem definir antecipadamente seu alcance.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπον
  choice: a pessoa
  alternative: o ser humano; o homem
  rationale: O masculino grego tem referência genérica neste contexto. A tradução comunica o sentido representativo sem sugerir que Paulo fale apenas de homens.
- issue: Nuance de δικαιοῦσθαι no uso paulino
  choice: é justificada
  alternative: é declarada justa
  rationale: O texto principal mantém o termo teológico tradicional e preciso, enquanto a nota explicita sua possível nuance declarativa sem resolver indevidamente toda a tensão semântica.
- issue: Relação entre fé e obras da lei
  choice: pela fé, independentemente das obras da lei
  alternative: pela fé, sem as obras da lei
  rationale: A redação preserva o contraste expresso pelo grego, sem acrescentar qualificações sobre a natureza da fé ou restringir o significado de “obras da lei”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a estrutura argumentativa de Paulo e a terminologia paulina reconhecível, evitando formulações confessionais adicionais.
