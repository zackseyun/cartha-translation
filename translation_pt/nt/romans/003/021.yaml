id: ROM.3.21
reference: Romans 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: pt
  text: Mas agora, à parte da Lei, a justiça de Deus[a] foi revelada, atestada pela Lei e pelos Profetas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a justiça que vem de Deus”. A expressão grega também pode se referir à justiça própria de Deus e à sua ação justa.
    reason: alternative_reading
  - marker: b
    text: “A Lei e os Profetas” é uma forma de se referir às Escrituras de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Mas agora
  rationale: Preserva tanto o contraste com o argumento anterior quanto a dimensão temporal da transição de Paulo.
- source_word: χωρὶς νόμου
  choice: à parte da Lei
  rationale: Comunica separação, e não simples ausência. A maiúscula sinaliza a provável referência à Lei mosaica no contexto.
- source_word: δικαιοσύνη θεοῦ
  choice: a justiça de Deus
  rationale: “Justiça” é a correspondência portuguesa natural para δικαιοσύνη neste contexto. A construção “de Deus” mantém aberta a relação expressa pelo genitivo grego, sem decidir se indica principalmente atributo, ação ou origem.
- source_word: πεφανέρωται
  choice: foi revelada
  rationale: Expressa de modo claro a manifestação já ocorrida e atualmente válida indicada pelo perfeito grego.
- source_word: μαρτυρουμένη
  choice: atestada
  rationale: Reproduz de maneira concisa o particípio passivo e seu sentido de testemunho confirmador, sem tornar a frase pesada.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: pela Lei e pelos Profetas
  rationale: Mantém a fórmula que designa o testemunho das Escrituras de Israel, com capitalização para sinalizar esse uso.
theological_decisions:
- issue: Sentido do genitivo em δικαιοσύνη θεοῦ
  choice: a justiça de Deus
  alternative: a justiça que vem de Deus
  rationale: A formulação principal preserva a ambiguidade teologicamente significativa entre a justiça própria de Deus, sua ação justa e salvadora e a justiça procedente dele; a alternativa de origem é registrada em nota, sem ser imposta ao texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “À parte da Lei” mantém a concisão do grego; “atestada” preserva a relação participial sem recorrer à construção pouco natural “sendo testemunhada”.
source_grounding:
  english_pob_role: consult_only
