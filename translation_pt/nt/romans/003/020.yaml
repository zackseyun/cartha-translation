  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: pt
  text: pois, por obras da lei, ninguém será justificado diante dele, porque por meio da lei vem o conhecimento do pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: por obras da lei
  rationale: Preserva a formulação paulina e a relação de meio ou fundamento expressa por ἐξ, sem acrescentar artigo onde o grego permite amplitude.
- source_word: οὐ δικαιωθήσεται πᾶσα σὰρξ
  choice: ninguém será justificado
  rationale: Embora literalmente πᾶσα σὰρξ seja «toda carne», a expressão semítica significa universalmente nenhum ser humano neste contexto; «ninguém» comunica isso com naturalidade em português.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Equivalente direto e natural, mantendo a referência pronominal a Deus no contexto.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: pleno conhecimento do pecado
  rationale: ἐπίγνωσις denota conhecimento ou reconhecimento definido; «pleno conhecimento» distingue o termo de simples informação sem resolver além do texto a natureza desse conhecimento.
theological_decisions:
- issue: Função da lei em relação à justificação
  choice: por obras da lei ninguém será justificado; a lei traz conhecimento do pecado
  alternative: a observância da lei não torna ninguém justo, pois a lei apenas conscientiza do pecado
  rationale: A tradução mantém as categorias forenses e a tensão do grego, sem inserir «apenas» nem transformar δικαιόω em linguagem moral de tornar justo.
- issue: Alcance de πᾶσα σὰρξ
  choice: ninguém
  alternative: nenhuma carne
  rationale: O sentido inclui todo ser humano, mas «nenhuma carne» seria pouco natural e potencialmente obscuro no português atual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez, preservando as duas afirmações causais introduzidas por διότι e γάρ.
