reference: Romans 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: pt
  text: 'E por que não dizer — como somos caluniados e como alguns afirmam que dizemos —: “Façamos o mal para que venha o bem”? A condenação deles é justa.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “E não — como somos caluniosamente acusados e como alguns dizem que dizemos —: ‘Façamos o mal para que venha o bem’?”'
    reason: lexical_alternative
  - marker: b
    text: “A condenação deles” refere-se aos que fazem ou endossam essa acusação e esse raciocínio.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: somos caluniados
  rationale: Neste contexto, o verbo indica a difamação ou deturpação hostil do ensino de Paulo, não propriamente blasfêmia contra Deus.
- source_word: φασίν τινες
  choice: alguns afirmam
  rationale: Expressa naturalmente a alegação feita por certas pessoas, mantendo o tom de acusação presente no contexto.
- source_word: λέγειν
  choice: que dizemos
  rationale: Representa diretamente o infinitivo grego sem ampliá-lo para 'ensinamos'.
- source_word: Ποιήσωμεν
  choice: Façamos
  rationale: O subjuntivo aoristo na primeira pessoa do plural tem força exortativa, bem expressa pelo subjuntivo português.
- source_word: τὰ κακὰ
  choice: o mal
  rationale: A construção com artigo e adjetivo substantivado é traduzida de modo idiomático e conciso em português.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: para que venha o bem
  rationale: Preserva a força de finalidade ou resultado de ἵνα e o paralelismo entre 'o mal' e 'o bem'.
- source_word: κρίμα
  choice: condenação
  rationale: No contexto, refere-se a um juízo judicial adverso, sentido mais específico que o termo geral 'julgamento'.
- source_word: ἔνδικον
  choice: justa
  rationale: Mantém o sentido forense e moral de um veredito correto e merecido.
- source_word: καὶ μὴ
  choice: E por que não dizer
  rationale: A expressão é elíptica e continua o raciocínio do versículo anterior; esta formulação explicita em português a pergunta implícita sem alterar seu argumento.
theological_decisions:
- issue: Referente de ὧν em 'ὧν τὸ κρίμα'
  choice: '''deles'' refere-se primariamente aos que fazem ou sustentam a acusação e o raciocínio citado'
  alternative: Pode ser entendido de modo mais amplo como referente aos que adotam a máxima 'Façamos o mal para que venha o bem'
  rationale: O pronome relativo plural retoma naturalmente as pessoas mencionadas na acusação, mas a formulação grega permite associar a condenação também à lógica moral que elas atribuem a Paulo; a nota preserva essa questão referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção elíptica inicial foi explicitada para fluência, enquanto os travessões preservam a interrupção parentética do grego. Os marcadores de nota aparecem no texto principal.
