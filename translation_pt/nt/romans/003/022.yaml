id: ROM.3.22
reference: Romans 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: pt
  text: E a justiça de Deus, mediante a fé em Jesus, o Messias[a], é para todos os que creem; pois não há distinção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mediante a fidelidade de Jesus, o Messias».'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português corrente e bíblico, «justiça» abrange tanto a qualidade e ação justa de Deus quanto, conforme o contexto paulino, a condição justa concedida por ele; evita o termo menos natural «retidão» nesta construção.
- source_word: θεοῦ
  choice: de Deus
  rationale: Mantém o genitivo grego de modo transparente, sem restringi-lo interpretativamente a «proveniente de Deus».
- source_word: διὰ πίστεως
  choice: mediante a fé
  rationale: Expressa naturalmente o meio indicado por διά com genitivo; «fé» preserva o termo paulino e permite registrar em nota a leitura alternativa «fidelidade».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa uma formulação portuguesa idiomática que deixa clara essa função.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: é para todos os que creem
  rationale: A cópula suprida torna a frase natural em português e «todos os que creem» preserva o alcance inclusivo e a força do particípio.
- source_word: διαστολή
  choice: distinção
  rationale: Equivale diretamente ao sentido contextual de ausência de diferenciação, mantendo registro digno e claro.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: fé em Jesus, o Messias
  alternative: fidelidade de Jesus, o Messias
  rationale: O genitivo é genuinamente ambíguo entre uma leitura objetiva e uma subjetiva. O texto principal adota a leitura objetiva mais comum, enquanto a nota preserva a alternativa sem eliminar a tensão exegética.
- issue: δικαιοσύνη θεοῦ
  choice: justiça de Deus
  alternative: justiça que vem de Deus
  rationale: A formulação genitiva preserva a amplitude do grego, que pode envolver o caráter e a ação justos de Deus e/ou a condição concedida por ele, sem escolher antecipadamente «que vem de Deus».
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação e a cópula «é» explicitam a estrutura elíptica grega sem alterar seu sentido. «Mas» representa o valor discursivo de δέ no contexto imediato.
