  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: pt
  text: A garganta deles é um túmulo aberto; com a língua, eles enganam[a]; o veneno[b] de víboras[c] está debaixo dos seus lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com a língua, viviam enganando”, explicitando o sentido contínuo do imperfeito grego.'
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “peçonha”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “áspides”; o termo grego designa uma serpente venenosa e também pode ser traduzido de modo mais geral por “serpentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: túmulo
  rationale: “Túmulo” é natural no português atual e preserva a imagem de morte e corrupção; “sepultura” também seria possível.
- source_word: ἀνεῳγμένος
  choice: aberto
  rationale: O particípio perfeito passivo indica algo que foi aberto e permanece assim; a expressão idiomática “túmulo aberto” comunica esse estado resultante.
- source_word: λάρυγξ
  choice: garganta
  rationale: É o equivalente português claro e usual, preservando a imagem corporal do texto.
- source_word: ἐδολιοῦσαν
  choice: eles enganam
  rationale: O imperfeito retrata a prática contínua do engano. O presente proverbial soa natural em português e mantém a acusação geral, enquanto a nota registra uma tradução que explicita a continuidade.
- source_word: ἰὸς
  choice: veneno
  rationale: No contexto de serpentes, “veneno” é a forma corrente e precisa em português.
- source_word: ἀσπίδων
  choice: víboras
  rationale: “Víboras” é compreensível ao leitor moderno e preserva a referência a serpentes venenosas; “áspides” é uma alternativa mais tradicional e formal.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: debaixo dos seus lábios
  rationale: Tradução direta que conserva a vívida imagem corporal e soa natural em português.
