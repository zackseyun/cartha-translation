  source_fidelity: A formulação «a fidelidade de Deus à verdade» acrescenta uma relação («à verdade») que não está no grego e desloca ἀλήθεια para a ideia de fidelidade. Além disso, «se tornou ainda mais evidente» interpreta ἐπερίσσευσεν como manifestação, quando o verbo expressa abundância ou superabundância. A revisão restitui ambos os sentidos sem resolver indevidamente a nuance de ἀλήθεια.
  naturalness: «A veracidade de Deus abundou» mantém um registro argumentativo e bíblico natural em português contemporâneo. «Por meio da minha mentira», «para a glória dele» e a pergunta final são claros e idiomáticos.
  terminology: «Veracidade» expressa adequadamente o sentido moral-relacional de ἀλήθεια no contraste com ψεύσματι, sem acrescentar a noção de fidelidade a uma verdade externa. A nota preserva «a verdade de Deus» como alternativa lexical mais ampla.
