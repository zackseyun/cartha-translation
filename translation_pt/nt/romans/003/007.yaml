base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: pt
  text: Mas, se a veracidade de Deus[a] abundou por meio da minha mentira[b], para a glória dele[c], por que ainda sou julgado como pecador?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a verdade de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio da minha falsidade”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “para a glória dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: a fidelidade de Deus à verdade
  rationale: No contexto de Romanos 3:4–7, a expressão contrasta o caráter verdadeiro e confiável de Deus com a falsidade humana. Esta formulação comunica o sentido moral de “veracidade” em português corrente, sem reduzir a expressão à verdade abstrata; a nota preserva a alternativa mais formal.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: por meio da minha mentira
  rationale: 'ἐν tem aqui valor instrumental: a mentira humana é apresentada como o meio ou a ocasião pela qual a veracidade de Deus se evidencia.'
- source_word: ἐπερίσσευσεν
  choice: se tornou ainda mais evidente
  rationale: O aoristo de περισσεύω expressa aumento ou superabundância. No argumento retórico, a formulação natural em português explicita que a verdade de Deus sobressai em contraste com a mentira humana, sem atribuir à falsidade um aumento ontológico da verdade divina.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: para a glória dele
  rationale: Preserva o movimento de εἰς para um resultado ou finalidade e emprega uma expressão idiomática em português.
- source_word: τί ἔτι κἀγὼ
  choice: por que ainda sou
  rationale: “Ainda” conserva a força de ἔτι. O valor aditivo de κἀγώ fica implícito no contraste retórico e não exige um “também” potencialmente artificial.
- source_word: κρίνομαι
  choice: sou julgado
  rationale: Mantém o presente passivo e evita restringir κρίνομαι prematuramente ao sentido mais específico de condenação.
- source_word: ὡς ἁμαρτωλὸς
  choice: como pecador
  rationale: Correspondência direta e natural para a expressão predicativa grega.
theological_decisions:
- issue: 'Sentido de ἀλήθεια τοῦ θεοῦ: verdade em sentido abstrato ou veracidade/fidelidade moral de Deus.'
  choice: a fidelidade de Deus à verdade
  alternative: a verdade de Deus / a veracidade de Deus
  rationale: O contraste imediato com a mentira humana favorece uma referência ao caráter verdadeiro e confiável de Deus. A redação escolhida torna isso inteligível sem identificar a expressão com uma doutrina denominacional específica, enquanto a nota conserva a formulação formalmente mais aberta.
- issue: Natureza da fala em primeira pessoa.
  choice: preservar a pergunta retórica sem identificar dogmaticamente o interlocutor
  alternative: marcar explicitamente a frase como objeção de um oponente
  rationale: O versículo pode representar a objeção retórica que Paulo está formulando, mas o texto isolado não exige inserir uma identificação do falante que não aparece expressamente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o caráter argumentativo da pergunta e evita vocabulário excessivamente técnico. Todos os marcadores de nota estão inseridos imediatamente após as expressões pertinentes.
