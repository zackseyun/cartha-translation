id: ROM.3.5
reference: Romans 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: pt
  text: Mas, se a nossa injustiça evidencia a justiça de Deus[a], que diremos? Acaso Deus é injusto ao trazer a ira? (Falo em termos humanos.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nossa falta de retidão evidencia a retidão de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: injustiça
  rationale: Mantém o contraste lexical e moral direto com δικαιοσύνη e soa natural em português neste argumento.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: No contraste com ἀδικία e na pergunta sobre Deus ser injusto, “justiça” preserva com clareza a dimensão judicial e moral do termo.
- source_word: συνίστησιν
  choice: evidencia
  rationale: Expressa que a injustiça humana torna manifesta a justiça de Deus, sem sugerir que ela a produz.
- source_word: μὴ ἄδικος
  choice: Acaso Deus é injusto
  rationale: “Acaso” sinaliza de modo natural a pergunta retórica que espera resposta negativa, sem transformar a frase em uma afirmação.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: ao trazer a ira
  rationale: Conserva a formulação do grego e evita explicitar além do texto o modo como a ira é aplicada.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Falo em termos humanos
  rationale: Tradução idiomática e digna da ressalva de Paulo, indicando que ele formula uma objeção segundo o raciocínio humano.
theological_decisions:
- issue: A força retórica da pergunta sobre a justiça de Deus
  choice: Acaso Deus é injusto ao trazer a ira?
  alternative: Deus não é injusto ao trazer a ira, é?
  rationale: A partícula μή orienta para uma resposta negativa, mas a forma interrogativa é preservada sem converter a objeção em declaração explícita.
- issue: Relação lexical entre ἀδικία e δικαιοσύνη
  choice: injustiça / justiça
  alternative: injustiça / retidão; falta de retidão / retidão
  rationale: O par “injustiça / justiça” reproduz o contraste verbal e se ajusta à questão subsequente sobre Deus ser injusto, sem excluir as dimensões moral e relacional dos termos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “Acaso” conserva a expectativa negativa da pergunta retórica; a ressalva final permanece parentética.
