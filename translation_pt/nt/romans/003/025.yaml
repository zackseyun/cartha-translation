  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: pt
  text: a quem Deus apresentou como sacrifício de expiação[a], mediante a fé em seu sangue[b], para demonstrar sua justiça[c], por causa de haver passado por alto os pecados anteriormente cometidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “propiciação”; ou “propiciatório”, isto é, a tampa de ouro da arca sobre a qual se aspergia o sangue da expiação.
    reason: lexical_alternative
  - marker: b
    text: Ou “mediante a fé, por meio de seu sangue”; a frase grega também pode ser entendida dessa maneira.
    reason: alternative_reading
  - marker: c
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: apresentou
  rationale: No contexto, comunica de modo natural que Deus expôs ou ofereceu Cristo publicamente, sem restringir o verbo ao sentido de mero propósito prévio.
- source_word: ἱλαστήριον
  choice: sacrifício de expiação
  rationale: Expressão acessível que preserva a função sacrificial e expiatória do termo sem decidir exclusivamente entre propiciação e a referência ao propiciatório.
- source_word: διὰ πίστεως
  choice: mediante a fé
  rationale: Mantém o valor instrumental de διά e a tradução usual de πίστις, em português corrente e digno.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: em seu sangue
  rationale: Conserva formalmente a preposição grega e permite a leitura adotada, 'fé em seu sangue', sem ocultar a possibilidade de ligação instrumental.
- source_word: εἰς ἔνδειξιν
  choice: para demonstrar
  rationale: Exprime com naturalidade a força de finalidade ou resultado da construção grega.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Em português, 'justiça' abrange aqui tanto a qualidade justa de Deus quanto sua ação judicial; a alternativa 'retidão' é registrada para preservar outra nuance possível.
- source_word: πάρεσιν
  choice: ter deixado impunes
  rationale: Comunica a ideia contextual de não punir ou passar por alto temporariamente, sem confundir o termo com perdão pleno.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: os pecados anteriormente cometidos
  rationale: Preserva com clareza a anterioridade temporal e a força participial da expressão.
theological_decisions:
- issue: Sentido do termo contestado ἱλαστήριον
  choice: sacrifício de expiação
  alternative: propiciação; propiciatório
  rationale: A formulação principal mantém a linguagem sacrificial e o tratamento do pecado sem impor apenas a ênfase voltada para a ira divina nem apenas a alusão cultual ao propiciatório; as duas leituras relevantes ficam visíveis na nota.
- issue: Relação sintática de διὰ πίστεως com ἐν τῷ αὐτοῦ αἵματι
  choice: mediante a fé em seu sangue
  alternative: mediante a fé, por meio de seu sangue
  rationale: A leitura principal entende o sangue de Cristo como objeto da fé, mas a posição da frase grega também permite entendê-lo instrumentalmente; a nota preserva essa ambiguidade.
- issue: Nuance de δικαιοσύνη no contexto paulino
  choice: justiça
  alternative: retidão
  rationale: '''Justiça'' é natural em português e conserva a dimensão judicial evidente no contexto, enquanto ''retidão'' explicita a qualidade justa de Deus sem ser imposta ao texto principal.'
- issue: Força de πάρεσις em relação aos pecados anteriores
  choice: ter deixado impunes
  alternative: ter passado por alto
  rationale: A tradução evita equiparar πάρεσις diretamente a perdão e conserva a tensão entre a tolerância anterior de Deus e a demonstração presente de sua justiça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção inicia com minúscula porque o versículo continua sintaticamente a frase anterior. Evitou-se jargão técnico no texto principal, mantendo as alternativas teologicamente relevantes em notas.
