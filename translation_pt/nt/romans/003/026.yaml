id: ROM.3.26
reference: Romans 3:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: pt
  text: na tolerância de Deus, para demonstrar a sua justiça[a] no tempo presente, a fim de que ele seja justo e justifique[c] aquele que tem fé em Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão».
    reason: lexical_alternative
  - marker: b
    text: Ou «aquele que se baseia na fidelidade de Jesus».
    reason: alternative_reading
  - marker: c
    text: Ou «declare justo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: tolerância
  rationale: Expressa a decisão de Deus de conter ou adiar o juízo, sem reduzir o termo à ideia mais geral de paciência.
- source_word: ἔνδειξιν
  choice: demonstrar
  rationale: A construção verbal é natural em português e conserva a ideia de manifestação ou comprovação pública presente no substantivo grego.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Mantém o sentido moral e forense adequado ao argumento de Paulo e permite preservar a relação lexical com «justo» e «justifique».
- source_word: νῦν καιρῷ
  choice: no tempo presente
  rationale: Formulação idiomática que mantém tanto a ênfase em «agora» quanto o sentido de ocasião ou período de καιρός.
- source_word: δίκαιον
  choice: justo
  rationale: É natural no contexto judicial e conserva a ligação verbal com «justifique».
- source_word: δικαιοῦντα
  choice: justifique
  rationale: O verbo português preserva o sentido forense e, ao lado de «justo», reproduz melhor do que uma paráfrase o jogo lexical de δίκαιον e δικαιοῦντα.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: aquele que tem fé em Jesus
  rationale: Adota no texto principal a leitura objetiva, corrente e clara em português, sem eliminar a leitura subjetiva possível do genitivo, registrada em nota.
theological_decisions:
- issue: Sentido de δικαιοσύνη no argumento
  choice: justiça
  alternative: retidão
  rationale: «Justiça» comunica melhor a dimensão forense do contexto; «retidão» continua sendo uma nuance lexical legítima e é preservada em nota.
- issue: Força de δικαιόω
  choice: justifique
  alternative: declare justo
  rationale: «Justificar» conserva a família de palavras e a concisão do grego; a nota explicita a possível formulação forense «declarar justo».
- issue: Sentido de ἐκ πίστεως Ἰησοῦ
  choice: aquele que tem fé em Jesus
  alternative: aquele que se baseia na fidelidade de Jesus
  rationale: A construção genitiva é genuinamente discutida. O texto principal segue a leitura objetiva mais habitual, enquanto a nota preserva a leitura que entende πίστις Ἰησοῦ como a fidelidade de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe que acompanha o caráter argumentativo da frase grega. «Tolerância de Deus» evita uma expressão excessivamente técnica; «a fim de que» conserva a finalidade; e a sequência «justo e justifique» mantém a relação lexical central do original.
