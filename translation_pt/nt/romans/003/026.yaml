  source_fidelity: 'O texto conserva adequadamente a sequência e a função da oração grega: «na tolerância de Deus», «para demonstrar a sua justiça no tempo presente» e a finalidade «a fim de que ele seja justo e justifique aquele que tem fé em Jesus». «Tolerância» comunica de modo aceitável a ἀνοχή divina como contenção do juízo; «justo e justifique» preserva o vínculo lexical entre δίκαιον e δικαιοῦντα.'
  naturalness: A redação é clara, moderna e apropriada ao registro argumentativo de Romanos. «A fim de que» exprime naturalmente a finalidade de εἰς τὸ εἶναι, e a formulação verbal «para demonstrar» é uma transposição idiomática legítima de πρὸς τὴν ἔνδειξιν.
  terminology: «Justiça», «justo» e «justifique» mantêm o campo semântico forense e a coesão lexical relevante. A nota sobre «retidão» oferece uma alternativa válida para δικαιοσύνη; a nota sobre «declare justo» esclarece, sem substituir, a força forense de δικαιόω. A nota final preserva de forma suficiente a leitura alternativa ligada à fidelidade de Jesus, sem a impor ao texto principal.
