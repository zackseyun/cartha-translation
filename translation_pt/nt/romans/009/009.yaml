id: ROM.9.9
reference: Romans 9:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: pt
  text: 'Pois esta é a palavra da promessa: “Neste tempo virei[a], e Sara terá um filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voltarei”. O grego aqui diz “virei”, embora algumas traduções reflitam a formulação do contexto de Gênesis com “voltarei”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: da promessa
  rationale: O genitivo modifica λόγος e é expresso naturalmente como “palavra da promessa”, preservando a ênfase de Paulo na promessa divina.
- source_word: λόγος
  choice: palavra
  rationale: Refere-se à declaração citada; “palavra” é conciso, digno e evita ampliar o sentido para “mensagem”.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém claramente a conexão lógica.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Neste tempo
  rationale: Indica o tempo determinado para o cumprimento da promessa e reproduz de modo natural a formulação grega sem acrescentar explicitamente “determinado”.
- source_word: ἐλεύσομαι
  choice: virei
  rationale: Traduz diretamente o futuro de ἔρχομαι, “vir”, dando prioridade ao texto grego de Romanos.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sara terá um filho
  rationale: A construção dativa de posse, literalmente “haverá para Sara um filho”, é expressa de modo natural em português com o verbo “ter”.
- source_word: Σάρρᾳ
  choice: Sara
  rationale: Emprega a forma tradicional e corrente do nome em português.
- source_word: υἱός
  choice: filho
  rationale: O substantivo designa especificamente um filho do sexo masculino, elemento pertinente à promessa feita a Abraão e Sara.
theological_decisions:
- issue: Citação da promessa a Abraão e ação divina
  choice: Apresentar a promessa diretamente como fala divina e traduzir ἐλεύσομαι por “virei”.
  alternative: “Voltarei”, conforme a formulação do contexto de Gênesis em algumas tradições de tradução.
  rationale: O argumento de Paulo se apoia na palavra da promessa divina. “Virei” preserva a redação grega efetivamente citada em Romanos, enquanto a nota registra a possível influência do contexto de Gênesis sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão e a estrutura lógica do grego, usando equivalência ótima na expressão idiomática de posse.
