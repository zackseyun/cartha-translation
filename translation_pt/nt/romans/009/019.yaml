  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: pt
  text: 'Então você me dirá: “Por que, então, ele ainda repreende? Pois quem resistiu ao seu propósito[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua vontade”. A palavra grega βούλημα pode significar vontade, intenção ou propósito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: você me dirá
  rationale: O futuro do indicativo introduz a objeção que Paulo prevê. “Dirá” preserva a forma futura e o sentido de λέγω.
- source_word: μοι
  choice: me
  rationale: Representa de modo natural em português o objeto indireto expresso pelo dativo grego.
- source_word: οὖν
  choice: então
  rationale: A partícula inferencial aparece duas vezes no grego; as duas ocorrências são mantidas para reproduzir a progressão enfática do argumento.
- source_word: Τί οὖν ἔτι
  choice: Por que, então, ele ainda
  rationale: Neste contexto, τί tem valor causal e é traduzido naturalmente por “por que”; ἔτι conserva a ideia de “ainda”.
- source_word: μέμφεται
  choice: culpa
  rationale: O verbo significa censurar ou atribuir culpa. A construção sem objeto explícito preserva a formulação concisa e aberta do grego, sem acrescentar “nos” ou “as pessoas”.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: ao seu propósito
  rationale: βούλημα pode indicar vontade, intenção ou propósito deliberado. “Propósito” comunica uma intenção definida sem impor terminologia doutrinária mais específica.
- source_word: τίς ἀνθέστηκεν
  choice: quem resistiu
  rationale: “Resistiu” traduz de modo idiomático ἀνθίστημι, enquanto o pretérito perfeito português expressa adequadamente a ação passada relevante para a pergunta retórica.
theological_decisions:
- issue: Sentido de βούλημα no contexto da soberania divina e da responsabilidade humana
  choice: seu propósito
  alternative: sua vontade; sua intenção
  rationale: “Propósito” representa a intenção deliberada expressa pelo termo grego e mantém intacta a tensão do argumento, sem resolver a questão segundo um sistema teológico específico.
- issue: Objeto não expresso de μέμφεται
  choice: ele ainda culpa
  alternative: ele ainda nos culpa; ele ainda culpa as pessoas
  rationale: O grego não declara quem é culpado. Embora a objeção diga respeito aos seres humanos, não se acrescenta um objeto para evitar tornar explícito o que o texto deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “então” reproduz a dupla ocorrência de οὖν. A concisão incomum de “ele ainda culpa” foi mantida para não inserir um objeto ausente no texto grego.
