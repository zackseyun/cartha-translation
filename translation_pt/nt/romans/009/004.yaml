id: ROM.9.4
reference: Romans 9:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: pt
  text: os quais são israelitas, a quem pertencem a adoção como filhos[c], a glória[b], as alianças, a entrega da Lei, o culto[d] e as promessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “A glória” provavelmente se refere à presença manifesta de Deus entre Israel.
    reason: cross_reference
  - marker: c
    text: Ou “a adoção” ou “a condição de filhos”.
    reason: lexical_alternative
  - marker: d
    text: Isto é, o culto ou serviço prestado a Deus por Israel no âmbito da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: os quais são israelitas
  rationale: Introduz uma descrição explicativa dos parentes de Paulo mencionados no versículo anterior. A formulação conserva a identificação explícita do grego e mantém um registro digno.
- source_word: ὧν
  choice: a quem pertencem
  rationale: O pronome relativo genitivo expressa posse; esta formulação é clara e natural em português.
- source_word: υἱοθεσία
  choice: a adoção como filhos
  rationale: Expressa a concessão da condição filial e, neste contexto, a condição pactual de Israel como povo, sem importar indevidamente todas as nuances soteriológicas de outros contextos paulinos.
- source_word: δόξα
  choice: a glória
  rationale: Mantém a concisão e a densidade do grego, sem inserir no texto principal uma identificação interpretativa mais específica.
- source_word: διαθῆκαι
  choice: as alianças
  rationale: Preserva o plural do texto grego e emprega o termo bíblico corrente para os vínculos pactuais de Deus com Israel.
- source_word: νομοθεσία
  choice: a entrega da Lei
  rationale: Indica o ato de dar ou promulgar a Lei, e não apenas a Lei como conteúdo; a inicial maiúscula identifica naturalmente a Lei mosaica.
- source_word: λατρεία
  choice: o culto
  rationale: Comunica o serviço cultual ordenado a Israel sem restringi-lo indevidamente apenas ao templo ou ao sacerdócio.
- source_word: ἐπαγγελίαι
  choice: as promessas
  rationale: Preserva o plural e se refere de modo claro às promessas divinas concedidas a Israel.
theological_decisions:
- issue: Sentido de υἱοθεσία em relação a Israel
  choice: adoção como filhos
  alternative: adoção; condição de filhos
  rationale: O contexto enumera privilégios históricos de Israel como povo. A expressão torna explícita a metáfora filial inerente ao termo grego, sem a reduzir à adoção individual.
- issue: Referente de ἡ δόξα
  choice: glória
  alternative: glória divina; presença gloriosa
  rationale: Provavelmente se refere à presença manifesta de Deus entre Israel, mas o grego diz apenas “a glória”; o texto principal conserva essa abertura.
- issue: Alcance de λατρεία
  choice: culto
  alternative: serviço sagrado; serviço no templo
  rationale: “Culto” mantém o sentido de serviço religioso prestado a Deus dentro da aliança, sem especificar mais do que o termo grego exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A enumeração reproduz a estrutura solene do grego, e os termos interpretativamente densos são mantidos no texto ou esclarecidos em notas.
