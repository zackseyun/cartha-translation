reference: Romans 9:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: pt
  text: 'Pelo contrário, ó ser humano, quem é você para contestar a Deus? Acaso aquilo que foi moldado dirá a quem o moldou: “Por que você me fez assim?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Por que me fizeste desse modo?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Mas
  rationale: Marca de forma natural a correção enfática e a virada adversativa em relação ao argumento anterior, sem sobrecarregar a frase.
- source_word: ὦ ἄνθρωπε
  choice: ó ser humano
  rationale: Mantém o vocativo singular e sua força retórica, ao mesmo tempo que expressa claramente o sentido representativo de ἄνθρωπος, dirigido a qualquer pessoa diante de Deus.
- source_word: σὺ τίς εἶ
  choice: quem é você
  rationale: Equivalente idiomático em português para o desafio retórico, com ênfase natural no interlocutor.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: para contestar a Deus
  rationale: O verbo indica resposta em oposição, não uma simples réplica; “contestar” preserva a censura e soa natural em português.
- source_word: μὴ ἐρεῖ
  choice: Acaso ... dirá
  rationale: “Acaso” sinaliza que a pergunta retórica espera resposta negativa, como indica μή com o futuro do indicativo.
- source_word: τὸ πλάσμα
  choice: aquilo que foi moldado
  rationale: Preserva a imagem de algo modelado e prepara a ligação verbal com o particípio seguinte.
- source_word: τῷ πλάσαντι
  choice: a quem o moldou
  rationale: Mantém a relação explícita entre a coisa moldada e quem a moldou, reproduzindo o jogo lexical grego.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Por que você me fez assim?
  rationale: Tradução direta, atual e idiomática de τί ... οὕτως, sem explicar além do que o texto afirma.
theological_decisions:
- issue: Força representativa de ἄνθρωπε
  choice: “ó ser humano” como vocativo singular representativo
  alternative: “ó homem”
  rationale: O contexto contrapõe a criatura humana a Deus, não um indivíduo masculino às mulheres. “Ser humano” conserva o singular e torna inequívoca a abrangência representativa.
- issue: Força da repreensão paulina
  choice: “contestar a Deus”
  alternative: “responder a Deus”
  rationale: A escolha preserva a oposição imprópria sugerida por ἀνταποκρίνομαι e a assimetria entre criatura e Criador, sem transformar o verbo em uma proibição de toda resposta dirigida a Deus.
- issue: Expectativa negativa da pergunta retórica
  choice: Expressa por “Acaso”
  alternative: 'Pergunta sem partícula: “Aquilo que foi moldado dirá...?”'
  rationale: A formulação deixa perceptível ao leitor moderno que a resposta esperada é “não”, preservando a função de μή.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó ser humano” conserva a solenidade e a contundência do grego; “você” evita arcaísmo no discurso direto. A repetição “moldado/moldou” reproduz deliberadamente a ligação entre πλάσμα e πλάσαντι.
