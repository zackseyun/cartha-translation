id: ROM.9.11
reference: Romans 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: pt
  text: Pois, antes que os filhos tivessem nascido ou feito alguma coisa boa ou má[a], para que o propósito de Deus segundo a eleição permanecesse[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguma coisa boa ou ruim”. O termo grego pode indicar aquilo que é mau, inferior ou sem valor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o propósito eletivo de Deus” ou “o propósito de Deus baseado na eleição”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se mantivesse firme”. O verbo grego significa “permanecer” ou “continuar” e, neste contexto, pode incluir a ideia de manter-se firme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: Pois, antes que os filhos tivessem nascido
  rationale: A construção temporal com o particípio em genitivo é expressa naturalmente em português por «antes que ... tivessem nascido»; «pois» preserva a ligação explicativa de γάρ. O sujeito «os filhos» é recuperado do contexto imediato para evitar uma construção obscura.
- source_word: μηδὲ πραξάντων
  choice: ou feito
  rationale: Depois de «antes que», «ou feito» coordena de modo natural a segunda ação sob o mesmo valor negativo, sem precisar repetir o auxiliar.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: alguma coisa boa ou má
  rationale: Mantém o contraste direto entre ἀγαθόν e φαῦλον em linguagem corrente. «Má» é idiomático e não força a intensidade moral mais específica de «maligna».
- source_word: ἵνα
  choice: para que
  rationale: Conserva o valor final mais natural da oração, sem excluir nuances contextuais de resultado.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: o propósito de Deus segundo a eleição
  rationale: Preserva visível a estrutura preposicional κατ’ ἐκλογήν e evita transformá-la numa paráfrase teológica mais interpretativa.
- source_word: μένῃ
  choice: permanecesse
  rationale: Representa diretamente o sentido comum de μένω, «permanecer» ou «continuar», e concorda com a sequência verbal introduzida por «antes que».
theological_decisions:
- issue: Valor de ἵνα num contexto ligado à predestinação
  choice: para que o propósito de Deus segundo a eleição permanecesse
  alternative: de modo que o propósito de Deus segundo a eleição permanecesse
  rationale: A tradução mantém a oração de propósito sugerida pela sintaxe, sem desenvolver conclusões de qualquer sistema teológico sobre eleição e liberdade humana.
- issue: Tradução de ἐκλογή
  choice: eleição
  alternative: escolha
  rationale: «Eleição» conserva o termo paulino tradicional e seu peso contextual, sem definir na própria tradução a natureza ou o alcance dessa eleição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A vírgula final indica que a frase continua no versículo seguinte. Os marcadores seguem a ordem de ocorrência no texto principal.
