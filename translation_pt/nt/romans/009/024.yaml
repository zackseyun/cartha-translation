  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: pt
  text: a nós[a], a quem ele também chamou, não somente dentre os judeus, mas também dentre os gentios[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os quais ele também chamou, a nós”. Paulo identifica “nós” com os objetos de misericórdia mencionados no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “nações”; neste contexto, o termo designa os povos não judeus, em contraste com os judeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: a nós, a quem
  rationale: O pronome relativo οὓς retoma os objetos de misericórdia do versículo anterior, e ἡμᾶς os identifica com “nós”. A formulação portuguesa antecipa “a nós” para conservar a ênfase e manter a ligação relativa de modo natural.
- source_word: καὶ ἐκάλεσεν
  choice: também chamou
  rationale: καί tem força aditiva, e καλέω é vertido por “chamar”, termo corrente e teologicamente significativo no uso paulino, sem acrescentar uma interpretação doutrinária específica.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Preserva com clareza a estrutura correlativa e o equilíbrio retórico do grego.
- source_word: ἐξ Ἰουδαίων
  choice: dentre os judeus
  rationale: ἐξ indica procedência a partir de um grupo. “Dentre” comunica que os chamados procedem do meio dos judeus, sem sugerir que o grupo inteiro esteja em vista.
- source_word: ἐξ ἐθνῶν
  choice: dentre os gentios
  rationale: No contraste explícito com os judeus, ἔθνη designa os povos não judeus. “Gentios” torna essa oposição histórica transparente em português.
theological_decisions:
- issue: Ligação com os objetos de misericórdia mencionados no versículo anterior
  choice: a nós, a quem ele também chamou
  alternative: os quais ele também chamou, a nós
  rationale: A redação mantém a dependência sintática do versículo anterior e a identificação enfática com “nós”, mas evita resolver além do texto questões teológicas sobre eleição e chamado.
- issue: Sentido de ἐθνῶν no contraste histórico-salvífico
  choice: gentios
  alternative: nações
  rationale: A oposição imediata a “judeus” mostra que se trata dos não judeus, e não simplesmente de entidades nacionais; “gentios” preserva essa distinção sem impor um sistema doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Dentre” preserva a ideia de procedência de ambos os grupos, e o travessão mantém a continuidade sintática e retórica com a citação que segue.
