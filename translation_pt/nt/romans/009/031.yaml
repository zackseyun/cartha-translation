id: ROM.9.31
reference: Romans 9:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: pt
  text: Mas Israel, buscando uma lei de justiça[a], não alcançou essa lei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma lei de retidão”. A expressão também pode ser entendida como “uma lei que conduzisse à justiça”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não chegou a ela” ou “não chegou à lei”. A expressão grega é condensada e de interpretação difícil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio; no argumento de Paulo, refere-se a Israel como povo.
- source_word: δέ
  choice: Mas
  rationale: Expressa o contraste com os gentios mencionados no versículo anterior.
- source_word: διώκων
  choice: buscando
  rationale: Comunica a ideia de empenho ativo em perseguir um objetivo, sem tornar explícito um valor concessivo que o particípio grego não marca por si só.
- source_word: νόμον δικαιοσύνης
  choice: uma lei de justiça
  rationale: Mantém o substantivo νόμον sem artigo e preserva a relação genitiva compacta, sem decidir se se trata de uma lei caracterizada pela justiça ou destinada a produzi-la.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: É o equivalente português corrente de δικαιοσύνη e funciona naturalmente no contexto paulino; “retidão” continua possível como alternativa lexical.
- source_word: εἰς νόμον
  choice: essa lei
  rationale: Entende a segunda ocorrência de νόμον como retomada da lei que Israel buscava, preservando a formulação incomum sem introduzir a interpretação “objetivo da lei”.
- source_word: οὐκ ἔφθασεν
  choice: não alcançou
  rationale: Expressa o fracasso em chegar ao objetivo buscado e combina de modo idiomático com “essa lei”, embora a construção grega seja condensada.
theological_decisions:
- issue: Sentido de δικαιοσύνη no argumento paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o equivalente amplo e tradicional em português e não limita o termo exclusivamente a conduta moral nem exclusivamente a uma condição forense diante de Deus.
- issue: Relação entre a lei e a justiça
  choice: uma lei de justiça
  alternative: uma lei que conduzisse à justiça
  rationale: A tradução principal conserva a ambiguidade do genitivo grego e evita afirmar que a lei produz ou conduz à justiça, interpretação possível, mas não explicitada pela sintaxe.
translation_notes:
  register: Português moderno, digno e acessível. “Buscando” evita uma explicitação concessiva; “não alcançou essa lei” mantém a repetição e a tensão da construção grega, com alternativas registradas em nota.
