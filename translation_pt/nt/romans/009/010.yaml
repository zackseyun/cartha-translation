base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: pt
  text: E não somente isso, mas também Rebeca, que concebeu de um só homem[a], Isaque, nosso pai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo leito de um só”; expressão idiomática que, neste contexto, se refere a ter concebido de um único homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: E não somente isso, mas também
  rationale: Reproduz de modo natural a construção correlativa e mantém o caráter cumulativo do argumento de Paulo.
- source_word: Ῥεβέκκα
  choice: Rebeca
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐξ ἑνός
  choice: de um só homem
  rationale: O masculino singular indica aqui uma única pessoa do sexo masculino; explicitar “homem” torna natural em português o contraste relativo à mesma paternidade.
- source_word: κοίτην ἔχουσα
  choice: ao conceber
  rationale: A expressão baseada em “leito/relação sexual” aponta, no contexto, para a concepção. A oração temporal-participial conserva a ligação sintática com a continuação do argumento.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: Isaque, nosso pai
  rationale: Mantém a identificação de Isaque como ancestral comum e segue a aposição do grego.
theological_decisions:
- issue: Grau de explicitação da expressão referente à união sexual e à concepção no argumento sobre a eleição
  choice: Traduzir idiomaticamente como “ao conceber de um só homem”
  alternative: Traduzir mais literalmente como “tendo leito de um só” ou de modo menos explícito como “ao conceber de um só”
  rationale: A formulação comunica que os filhos de Rebeca tinham o mesmo pai, ponto relevante para o argumento, sem inserir “filhos” no texto principal nem resolver além do necessário a continuação teológica do período.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final preserva o fato de que a frase continua no versículo seguinte.
