- from: Assim, pois, ele tem misericórdia de quem quer[a] e endurece quem quer.[b]
  to: Portanto, ele tem misericórdia de quem ele quer[a] e endurece quem ele quer.[b]
  rationale: A revisão substitui uma ligação inferencial pouco idiomática por “Portanto” e explicita o sujeito de “quer” nas duas ocorrências. Isso impede que o leitor atribua o querer à pessoa que recebe misericórdia ou é endurecida, preservando o paralelismo e a afirmação direta do grego. As notas mantêm a alternativa lexical e a observação necessária sobre a voz ativa.
