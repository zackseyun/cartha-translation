  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: pt
  text: Portanto, ele tem misericórdia de quem ele quer[a] e endurece quem ele quer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mostra misericórdia a quem ele quer”.'
    reason: lexical_alternative
  - marker: b
    text: “Endurece” também pode ser traduzido por “torna obstinado” ou “torna teimoso”; o grego emprega um verbo ativo e não deve ser suavizado para indicar mera permissão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Assim, pois
  rationale: As duas partículas introduzem uma conclusão enfática a partir do argumento anterior. “Assim, pois” preserva a força inferencial e mantém um registro natural e digno em português.
- source_word: ὃν θέλει
  choice: de quem quer
  rationale: A formulação é idiomática em português e conserva tanto a vontade direta do sujeito quanto o paralelismo deliberado entre as duas orações.
- source_word: ἐλεεῖ
  choice: tem misericórdia
  rationale: Expressa de modo claro e tradicional o ato de conceder misericórdia, sem acrescentar explicações ausentes do grego.
- source_word: ὃν δὲ θέλει
  choice: e ... quem quer
  rationale: O contexto torna nítido o contraste marcado por δέ, enquanto “e” mantém em português a estrutura paralela e fluente da frase.
- source_word: σκληρύνει
  choice: endurece
  rationale: Reproduz o verbo ativo grego, preserva a ligação com o relato do faraó e não suaviza a ação como mera permissão.
theological_decisions:
- issue: Vontade divina em θέλει
  choice: Manter a afirmação direta de que Deus age conforme quer.
  alternative: Parafrasear “quer” como simples permissão ou formular a frase para reduzir a força da vontade divina.
  rationale: O grego afirma diretamente a vontade do sujeito nas duas orações. A tradução conserva a tensão entre soberania divina e responsabilidade humana sem impor uma solução doutrinária.
- issue: Agência em σκληρύνει
  choice: 'Traduzir ativamente: “endurece”.'
  alternative: “Permite que fique endurecido” ou “deixa entregue ao endurecimento”.
  rationale: A forma grega é ativa e atribui diretamente a ação ao sujeito; convertê-la em mera permissão ultrapassaria o texto-fonte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição de “quem quer” conserva a simetria enfática do grego; “Assim, pois” mantém a conclusão argumentativa sem excesso de formalidade.
