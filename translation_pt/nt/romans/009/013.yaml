lexical_decisions:
- source_word: καθὼς
  choice: como
  rationale: Introduz de modo natural e conciso a citação das Escrituras.
- source_word: γέγραπται
  choice: está escrito
  rationale: O perfeito passivo funciona como fórmula de citação; a expressão indica que o texto escrito permanece vigente.
- source_word: Τὸν Ἰακὼβ ἠγάπησα
  choice: Amei Jacó
  rationale: Preserva o verbo ἀγαπάω e traduz o aoristo por pretérito perfeito, de modo idiomático em português.
- source_word: τὸν δὲ Ἠσαῦ
  choice: mas ... Esaú
  rationale: A conjunção δέ marca aqui o contraste entre o tratamento de Jacó e o de Esaú.
- source_word: ἐμίσησα
  choice: odiei
  rationale: Mantém o sentido lexical direto e forte de μισέω, sem resolver no texto principal a possível nuance comparativa ou de rejeição ligada à aliança.
theological_decisions:
- issue: Se a expressão «odiei Esaú» deve ser suavizada por causa dos debates sobre eleição divina e uso idiomático semítico
  choice: Manter «odiei» no texto principal
  alternative: «rejeitei» ou «amei menos»
  rationale: O texto grego da citação emprega μισέω. A tradução preserva a força e a tensão teológica do original, enquanto registra em nota interpretações contextuais possíveis.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. A formulação direta conserva o paralelismo e o contraste da citação. Os marcadores foram posicionados junto à citação e ao termo que requer esclarecimento.
