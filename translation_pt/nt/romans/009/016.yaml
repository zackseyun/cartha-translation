id: ROM.9.16
reference: Romans 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: pt
  text: Portanto[a], isso não depende de quem quer nem de quem corre[b], mas de Deus, que demonstra misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Portanto, não é de quem quer nem de quem corre, mas de Deus, que demonstra misericórdia”. O grego é elíptico; o que está implícito deve ser entendido à luz do contexto, que trata do propósito e da misericórdia de Deus.'
    reason: lexical_alternative
  - marker: b
    text: “Corre” provavelmente funciona como imagem do esforço ou empenho humano, mas o verbo grego significa literalmente “correr”.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas apresentam uma conclusão enfática com base no argumento anterior. “Portanto” comunica naturalmente essa força inferencial em português atual.
- source_word: οὐ ... οὐδὲ
  choice: não ... nem
  rationale: A construção correlativa portuguesa reproduz de modo claro a negação dos dois elementos coordenados.
- source_word: τοῦ θέλοντος
  choice: de quem quer
  rationale: O particípio substantivado designa a pessoa que exerce a vontade. “Quem quer” mantém a nuance volitiva sem acrescentar um objeto ausente no grego.
- source_word: τοῦ τρέχοντος
  choice: de quem corre
  rationale: Mantém a imagem concreta do verbo τρέχω; o provável sentido metafórico de esforço é explicado em nota, sem substituir a formulação grega no texto.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa diretamente o forte contraste entre a vontade ou o esforço humano e a ação misericordiosa de Deus.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: de Deus, que demonstra misericórdia
  rationale: Preserva Deus como agente e o particípio como ação verbal. “Demonstra misericórdia” é corrente e dignificado, sem reduzir a expressão a uma qualidade meramente adjetiva.
- source_word: predicado elíptico
  choice: isso não depende de
  rationale: O grego omite o elemento regente. A formulação portuguesa torna a oração compreensível sem identificar de maneira restritiva “isso” com salvação, eleição ou escolha.
theological_decisions:
- issue: Referente da construção elíptica e alcance da dependência
  choice: Usar “isso não depende de” sem nomear explicitamente salvação, eleição ou escolha divina.
  alternative: “Isso não é de quem quer”; “a salvação não depende de quem quer”; “a escolha de Deus não depende de quem quer”.
  rationale: O contexto trata do propósito e da misericórdia de Deus, mas a frase grega permanece elíptica. O demonstrativo neutro permite que o contexto forneça o referente e evita resolver indevidamente a tensão teológica.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A sintaxe explicita apenas o necessário para tornar inteligível a elipse grega, e as notas preservam tanto a forma mais literal quanto a imagem de “correr”.
