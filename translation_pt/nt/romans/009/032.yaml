id: ROM.9.32
reference: Romans 9:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: pt
  text: Por quê? Porque não foi com base na fé[a], mas como se fosse com base em obras[b]. Eles tropeçaram na pedra de tropeço[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não pela fé” ou “não a partir da fé”. O grego diz literalmente “não da fé”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mas como se viesse de obras”. A expressão preserva a nuance de “como se”.
    reason: lexical_alternative
  - marker: c
    text: Alusão a Isaías 8:14; compare também Isaías 28:16 no versículo seguinte.
    reason: cross_reference
  - marker: d
    text: Ou “pedra de escândalo” ou “pedra que causa tropeço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Por quê?
  rationale: Forma interrogativa natural e concisa em português, preservando a força retórica da pergunta de Paulo.
- source_word: ὅτι
  choice: Porque
  rationale: Introduz de modo natural a explicação causal da pergunta anterior.
- source_word: οὐκ ἐκ πίστεως
  choice: não foi com base na fé
  rationale: “Com base na” comunica o valor de ἐκ como fundamento ou origem, sem reduzir a expressão simplesmente a um meio instrumental.
- source_word: πίστεως
  choice: fé
  rationale: É o equivalente corrente de πίστις e preserva o contraste paulino com as obras, sem impor aqui o sentido mais específico de “fidelidade”.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: mas como se fosse com base em obras
  rationale: Mantém a nuance de ὡς, “como se”, e torna explícito em português o paralelismo com a base indicada na oração anterior.
- source_word: ἔργων
  choice: obras
  rationale: Termo tradicional e ainda compreensível que mantém a coerência do contraste paulino entre fé e obras em Romanos.
- source_word: προσέκοψαν
  choice: Eles tropeçaram
  rationale: Preserva a imagem concreta do verbo προσκόπτω e concorda com o sujeito plural entendido pelo contexto.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: na pedra de tropeço
  rationale: Reproduz de modo compacto a imagem da pedra que faz tropeçar e mantém a ligação lexical com “tropeçaram”.
theological_decisions:
- issue: Sentido de πίστις no contraste entre fé e obras
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto contrapõe duas bases para a busca da justiça. “Fé” preserva a categoria paulina sem decidir por uma nuance mais restrita que o texto não exige.
- issue: Força de ὡς diante de ἐξ ἔργων
  choice: como se fosse com base em obras
  alternative: com base em obras
  rationale: A tradução conserva a qualificação introduzida por ὡς e evita transformar a frase numa afirmação mais categórica do que o grego.
- issue: Imagem de λίθος τοῦ προσκόμματος
  choice: pedra de tropeço
  alternative: pedra de escândalo
  rationale: “Pedra de tropeço” mantém a metáfora concreta e sua relação verbal com “tropeçaram”; a alternativa conserva a possível dimensão de ofensa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação mantém a elipse do grego por meio de “não foi”, dependente do contexto anterior, e preserva tanto o contraste fé–obras quanto a imagem concreta do tropeço.
