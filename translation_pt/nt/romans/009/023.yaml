  source_fidelity: 'O texto traduz com precisão a construção final καὶ ἵνα γνωρίσῃ como fragmento ligado ao contexto anterior: “e para tornar conhecida”. “A riqueza da sua glória” preserva o singular de πλοῦτον e o genitivo. “Sobre vasos de misericórdia” mantém a imagem de σκεύη e a formulação de ἐπί, em consonância com o audit trail inglês (“upon”). “Preparou de antemão para a glória” representa adequadamente o aoristo ativo προητοίμασεν e εἰς δόξαν.'
