  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: pt
  text: e para tornar conhecida a riqueza da sua glória sobre vasos de misericórdia, os quais ele preparou de antemão para a glória,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: tornar conhecida
  rationale: Expressa o sentido causativo de dar a conhecer, preservando por meio do infinitivo a ligação sintática deste fragmento com o contexto anterior.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: a riqueza da sua glória
  rationale: Mantém o singular de πλοῦτον e a relação genitiva sem expandir a imagem.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: sobre vasos de misericórdia
  rationale: Preserva a força espacial/metafórica de ἐπί e a imagem de σκεύη, tradicional e ainda inteligível em português.
- source_word: προητοίμασεν
  choice: preparou de antemão
  rationale: Representa explicitamente o valor anterior do prefixo προ-.
- source_word: εἰς δόξαν
  choice: para a glória
  rationale: Conserva a orientação ou finalidade expressa por εἰς sem especificar além do texto.
theological_decisions:
- issue: Agente de προητοίμασεν
  choice: ele preparou de antemão
  alternative: foram preparados de antemão
  rationale: O grego emprega verbo ativo na terceira pessoa do singular; o pronome retoma naturalmente Deus no contexto e evita transformar a construção em passiva.
- issue: Relação de ἐπί com os vasos de misericórdia
  choice: sobre vasos de misericórdia
  alternative: para vasos de misericórdia
  rationale: “Sobre” preserva a formulação metafórica e a possível nuance de a glória ser manifestada sobre ou em relação a esses vasos, sem reduzir ἐπί apenas a benefício ou destinatário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vasos” mantido como metáfora bíblica. A pontuação final conserva o caráter de fragmento sintaticamente ligado aos versículos anteriores.
