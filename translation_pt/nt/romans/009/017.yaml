id: ROM.9.17
reference: Romans 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: pt
  text: 'Pois a Escritura diz ao faraó: “Foi precisamente para isto que eu levantei você[a]: para mostrar em você o meu poder e para que o meu nome[b] seja proclamado em toda a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preservei você” ou “fiz você permanecer”. O verbo pode ter esses sentidos mais amplos no contexto da citação de Êxodo.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “nome” se refere ao renome e à reputação revelada de Deus, não apenas a uma designação falada.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: Pois a Escritura diz ao faraó
  rationale: Mantém γάρ como ligação explicativa, o presente λέγει e a personificação da Escritura. A forma «faraó» segue o uso corrente em português.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Foi precisamente para isto
  rationale: Expressa com naturalidade tanto a finalidade como a ênfase da locução grega.
- source_word: ἐξήγειρά σε
  choice: eu levantei você
  rationale: Preserva a amplitude do verbo, que pode indicar levantar, fazer surgir ou manter em posição, sem definir além do texto como Deus colocou o faraó nesse papel.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: para mostrar em você o meu poder
  rationale: Conserva a força final de ὅπως e traduz ἐν σοὶ de modo próximo ao grego, evitando substituí-lo interpretativamente por «por meio de você» ou «contra você».
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: e para que o meu nome seja proclamado
  rationale: A formulação passiva comunica a proclamação pública e ampla indicada por διαγγελῇ.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: em toda a terra
  rationale: Mantém o alcance universal mais provável no contexto paulino, sem restringir γῆ a uma região.
theological_decisions:
- issue: Sentido de ἐξήγειρά σε em relação ao faraó e à soberania divina
  choice: eu levantei você
  alternative: eu preservei você; fiz você permanecer; fiz você surgir
  rationale: A redação mantém a afirmação da ação soberana de Deus, mas não decide se o verbo aponta especificamente para a ascensão do faraó, sua preservação ou sua manutenção nessa posição. Assim, preserva-se a tensão entre soberania divina e responsabilidade humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» evita a artificialidade de «te» junto a formas verbais de terceira pessoa e mantém a fala direta clara. A ordem das orações conserva o paralelismo de propósito do grego.
