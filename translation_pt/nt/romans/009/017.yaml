  terminology: «Escritura», «faraó», «poder», «nome» e «proclamado» são escolhas terminologicamente apropriadas. A nota sobre «nome» explica seu valor de renome/reputação revelada sem substituir o termo no texto. A nota lexical de «levantei» preserva alternativas contextualmente relevantes e não força uma leitura doutrinária.
