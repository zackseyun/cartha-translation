  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do grego: γάρ é expresso por «Pois»; «a Escritura diz ao faraó» mantém o presente literário e a personificação; «Foi precisamente para isto» transmite a ênfase final de εἰς αὐτὸ τοῦτο; e as duas orações de propósito, incluindo a voz passiva em «seja proclamado», são fielmente representadas. «Em você» conserva prudentemente ἐν σοί, sem introduzir a interpretação «por meio de você». «Em toda a terra» preserva o alcance universal de ἐν πάσῃ τῇ γῇ.'
