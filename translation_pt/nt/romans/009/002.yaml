lexical_decisions:
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo da afirmação solene iniciada no versículo anterior; em português, «que» mantém naturalmente essa continuação declarativa.
- source_word: λύπη
  choice: tristeza
  rationale: Expressa tristeza profunda; é uma opção clara e natural em português, enquanto «pesar» permanece uma alternativa válida.
- source_word: μοί ἐστιν
  choice: tenho
  rationale: A construção com dativo e εἰμί expressa aquilo que Paulo possui ou experimenta; «tenho» reproduz o sentido de modo idiomático.
- source_word: μεγάλη
  choice: grande
  rationale: Preserva diretamente a intensidade do adjetivo e forma a expressão portuguesa natural «grande tristeza».
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre as duas expressões de sofrimento.
- source_word: ἀδιάλειπτος
  choice: incessante
  rationale: Comunica duração contínua, sem cessar, e conserva a força da expressão grega.
- source_word: ὀδύνη
  choice: dor
  rationale: Designa sofrimento interior intenso; «dor» é direta e permite que o contexto emocional determine seu sentido, sem explicitação excessiva.
- source_word: τῇ καρδίᾳ μου
  choice: no coração
  rationale: Conserva a imagem bíblica concreta do coração como centro da vida interior, usando a forma idiomática natural em português.
