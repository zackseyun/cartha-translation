source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: pt
  text: 'Como está escrito: “Eis que ponho em Sião uma pedra de tropeço e uma rocha que faz cair,[a] e quem crê nele[b] não será envergonhado”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo reúne aqui palavras de Isaías 8:14 e 28:16.
    reason: cross_reference
  - marker: b
    text: O grego diz literalmente “sobre ele”. Também pode ser entendido como referência à pedra, e não a uma pessoa; no contexto, Paulo aplica a imagem ao Messias.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “não ficará decepcionado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Como está escrito
  rationale: Fórmula corrente e natural em português para introduzir uma citação das Escrituras, preservando o sentido do perfeito grego.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém a força de chamada de atenção sem recorrer a uma expressão excessivamente arcaica.
- source_word: τίθημι
  choice: ponho
  rationale: Preserva o presente da citação e comunica de modo natural o ato de colocar a pedra.
- source_word: ἐν Σιὼν
  choice: em Sião
  rationale: Representa diretamente o valor locativo de ἐν e corresponde ao uso consolidado do nome Sião em português.
- source_word: λίθον προσκόμματος
  choice: uma pedra de tropeço
  rationale: Conserva a construção metafórica e a ideia de uma pedra que leva alguém a tropeçar.
- source_word: πέτραν σκανδάλου
  choice: uma rocha que faz cair
  rationale: Expressa em linguagem clara a ideia de causa de queda contida em σκάνδαλον, evitando o sentido moderno potencialmente enganoso de 'escândalo'.
- source_word: ὁ πιστεύων
  choice: quem crê
  rationale: Reproduz naturalmente o particípio substantivado com alcance genérico, sem acrescentar marca de gênero.
- source_word: ἐπ’ αὐτῷ
  choice: nele
  rationale: Em português, 'crer nele' comunica de modo idiomático a confiança dirigida à pessoa representada pela pedra; uma nota preserva a forma mais literal e a possível leitura não pessoal.
- source_word: οὐ καταισχυνθήσεται
  choice: não será envergonhado
  rationale: Mantém o futuro passivo e a dimensão pública de vergonha do verbo, sem reduzi-lo apenas à ideia de decepção.
theological_decisions:
- issue: Referente de αὐτῷ na citação profética composta
  choice: nele, em leitura pessoal aplicada ao Messias
  alternative: nela, em referência à pedra; ou, de modo mais literal quanto à preposição, sobre ele
  rationale: O pronome grego é masculino, e o contexto de Romanos 9:32–33 aplica pessoalmente a imagem da pedra ao Messias. A nota conserva tanto a forma literal da preposição quanto a possível leitura da imagem como coisa, sem apagar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. “Eis que” preserva o tom solene da citação; “rocha que faz cair” evita a possível opacidade de “rocha de escândalo”. Todos os marcadores de nota aparecem no texto.
