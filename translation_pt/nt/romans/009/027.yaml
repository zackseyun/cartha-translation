id: ROM.9.27
reference: Romans 9:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: pt
  text: 'Mas Isaías clama a respeito de Israel: “Ainda que o número dos filhos de Israel[a] seja como a areia do mar[b], o remanescente será salvo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Israel” ou “dos israelitas”. O grego diz literalmente “dos filhos de Israel”, designação coletiva tradicional.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Se o número dos filhos de Israel for como a areia do mar”. A construção grega é condicional, mas neste contexto pode ter força concessiva.'
    reason: alternative_reading
  - marker: c
    text: Ou “será liberto”. A expressão retoma a profecia de Isaías sobre um remanescente sobrevivente.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação ao argumento anterior e mantém a força retórica da passagem.
- source_word: κράζει
  choice: clama
  rationale: Preserva o presente vívido e a ideia de uma declaração feita em voz forte, com registro digno e natural.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: a respeito de Israel
  rationale: No contexto da citação profética, ὑπέρ indica mais naturalmente o assunto da declaração do que uma ação em favor de Israel.
- source_word: Ἐὰν ᾖ
  choice: Ainda que ... seja
  rationale: Expressa a força concessiva que a condição assume no contexto, sem ocultar em nota a possibilidade de uma tradução formalmente condicional.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Mantém a formulação tradicional e pactual da citação grega, sem reduzi-la silenciosamente a uma paráfrase.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: como a areia do mar
  rationale: Reproduz de modo claro e reconhecível a comparação bíblica.
- source_word: τὸ ὑπόλειμμα
  choice: o remanescente
  rationale: É o termo consagrado e preciso para o grupo restante ou sobrevivente referido pela profecia.
- source_word: σωθήσεται
  choice: será salvo
  rationale: Preserva o peso soteriológico do uso paulino e, ao mesmo tempo, permite registrar em nota a nuance profética possível de livramento.
theological_decisions:
- issue: Força da oração condicional Ἐὰν ᾖ na citação profética
  choice: 'Leitura concessiva: “Ainda que ... seja”'
  alternative: 'Leitura condicional mais literal: “Se ... for”'
  rationale: O contraste recai sobre a grande quantidade de israelitas e a salvação do remanescente. A formulação concessiva comunica esse movimento sem eliminar a forma condicional do grego, preservada em nota.
- issue: Sentido de σωθήσεται
  choice: “será salvo”
  alternative: “será liberto”
  rationale: “Será salvo” corresponde melhor ao contexto de Romanos 9–11 e mantém a gravidade teológica do verbo, sem excluir a nuance de livramento presente no pano de fundo profético.
- issue: Alcance de τὸ ὑπόλειμμα
  choice: “o remanescente”, sem acrescentar “somente”
  alternative: “somente o remanescente”
  rationale: O substantivo definido identifica o grupo restante, mas o grego não contém um advérbio explícito equivalente a “somente”; a tradução evita tornar a exclusividade mais explícita do que o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A redação conserva a imagem profética tradicional, a designação “filhos de Israel” e a tensão entre condição, concessão, salvação e livramento.
