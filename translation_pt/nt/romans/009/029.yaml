reference: Romans 9:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: pt
  text: 'E, como Isaías[c] já havia dito: “Se o Senhor dos Exércitos[a] não nos tivesse deixado descendência[b], teríamos nos tornado como Sodoma e teríamos sido feitos semelhantes a Gomorra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor Sabaote”. O grego Σαβαώθ translitera o termo hebraico frequentemente traduzido como “dos Exércitos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “semente”; aqui, refere-se à descendência sobrevivente.
    reason: lexical_alternative
  - marker: c
    text: Citação de Isaías 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: E, como
  rationale: Mantém a ligação com o contexto anterior e introduz naturalmente a correspondência com outra citação bíblica.
- source_word: προείρηκεν
  choice: já havia dito
  rationale: Expressa uma declaração anterior de Isaías sem transformar o verbo em predição; o mais-que-perfeito soa natural antes da citação.
- source_word: κύριος Σαβαὼθ
  choice: Senhor dos Exércitos
  rationale: Traduz o título divino hebraico transliterado no grego, usando uma forma reconhecível e semanticamente clara em português.
- source_word: ἐγκατέλιπεν
  choice: tivesse deixado
  rationale: Preserva o sentido básico de deixar para trás dentro da condição contrária aos fatos.
- source_word: σπέρμα
  choice: descendência
  rationale: Comunica o sentido coletivo de posteridade sobrevivente sem inserir no texto o termo teológico interpretativo 'remanescente'.
- source_word: ἂν ἐγενήθημεν
  choice: teríamos nos tornado
  rationale: Reproduz o resultado contrário aos fatos e preserva a ideia de vir a ser própria de γίνομαι.
- source_word: ἂν ὡμοιώθημεν
  choice: teríamos sido feitos semelhantes
  rationale: Conserva a voz passiva e distingue este verbo do anterior, evitando achatar o paralelismo verbal.
theological_decisions:
- issue: Tradução do título divino κύριος Σαβαώθ na citação de Isaías
  choice: Senhor dos Exércitos
  alternative: Senhor Sabaote; SENHOR dos Exércitos
  rationale: Paulo apresenta κύριος seguido da transliteração grega do título hebraico. Traduzir o título comunica seu sentido, enquanto 'Senhor' acompanha diretamente o texto grego sem introduzir no corpo principal a convenção tipográfica referente ao tetragrama hebraico.
- issue: Sentido de σπέρμα no contexto do remanescente
  choice: descendência
  alternative: semente; remanescente
  rationale: O substantivo significa literalmente 'semente' e, neste contexto, descendência sobrevivente. 'Descendência' preserva o referente sem substituir a palavra pela interpretação contextual 'remanescente'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a condição contrária aos fatos, a diferença entre os dois verbos finais e o teor veterotestamentário do título divino.
