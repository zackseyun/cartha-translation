id: ROM.9.21
reference: Romans 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: pt
  text: Ou será que o oleiro não tem autoridade sobre o barro[d], para fazer da mesma massa[b] um vaso para honra e outro para desonra?[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tem o direito sobre o barro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do mesmo bloco” ou “da mesma porção de barro”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um vaso para uso honroso e outro para uso comum”.'
    reason: alternative_reading
  - marker: d
    text: A imagem remete a passagens do Antigo Testamento sobre o oleiro e o barro, como Isaías 29:16; 45:9 e Jeremias 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou será que
  rationale: Introduz naturalmente, em português, a nova pergunta retórica no fluxo do argumento, sem acrescentar uma conclusão ausente do grego.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: não tem autoridade
  rationale: Expressa prerrogativa legítima, não apenas capacidade; preserva o sentido de ἐξουσία e a tensão do argumento.
- source_word: ὁ κεραμεὺς
  choice: o oleiro
  rationale: Equivalente preciso e corrente para o artesão que molda o barro, preservando também a imagem profética.
- source_word: τοῦ πηλοῦ
  choice: sobre o barro
  rationale: A construção idiomática portuguesa com 'autoridade sobre' comunica adequadamente a relação expressa pelo genitivo grego.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: da mesma massa
  rationale: φύραμα designa uma porção ou massa misturada; 'massa' é natural em português e adequada ao contexto do barro.
- source_word: ποιῆσαι
  choice: para fazer
  rationale: Verbo simples e direto, correspondente ao infinitivo grego, sem elevar desnecessariamente o registro.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: um ... e outro
  rationale: Reproduz com clareza a correlação contrastiva μέν...δέ em português natural.
- source_word: εἰς τιμὴν
  choice: para honra
  rationale: Mantém diretamente a linguagem de honra do grego sem restringi-la a uma função doméstica específica.
- source_word: σκεῦος
  choice: vaso
  rationale: É o equivalente mais natural dentro da imagem do oleiro e permanece compreensível no português moderno.
- source_word: εἰς ἀτιμίαν
  choice: para desonra
  rationale: Preserva o contraste lexical direto com τιμή e evita interpretar antecipadamente a expressão como mero uso comum.
theological_decisions:
- issue: Se ἐξουσία deve ser traduzida como autoridade, direito ou poder em um texto associado aos debates sobre soberania divina e responsabilidade humana
  choice: autoridade
  alternative: direito; poder
  rationale: '''Autoridade'' comunica prerrogativa legítima sem reduzir o termo à mera capacidade nem inserir uma formulação doutrinária mais desenvolvida; assim, conserva-se a tensão teológica do argumento.'
- issue: Se εἰς τιμὴν / εἰς ἀτιμίαν deve ser explicitado como categorias funcionais
  choice: para honra ... para desonra
  alternative: para uso honroso ... para uso comum
  rationale: O grego emprega diretamente categorias de honra e desonra. A tradução escolhida mantém aberta a extensão da metáfora e evita limitá-la ao uso doméstico dos vasos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a pergunta retórica, a metáfora do oleiro e o contraste conciso entre honra e desonra. Os marcadores foram posicionados junto às expressões a que se referem.
