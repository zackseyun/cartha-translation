source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: pt
  text: Que diremos, então? Que os gentios[b], que não buscavam a justiça[a], alcançaram a justiça — a justiça que vem da fé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão»; o termo grego δικαιοσύνη, aqui e nas repetições do versículo, pode abranger retidão moral ou jurídica e justiça no âmbito da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou «as nações».
    reason: lexical_alternative
  - marker: c
    text: Ou «a justiça que procede da fé»; menos provavelmente aqui, «a justiça que procede da fidelidade».
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que diremos, então?
  rationale: Mantém a fórmula deliberativa paulina e o valor futuro de ἐροῦμεν em português natural.
- source_word: ἔθνη
  choice: os gentios
  rationale: No contraste contextual com Israel, designa os povos não judeus; «gentios» comunica isso com mais clareza do que o literal «nações».
- source_word: τὰ μὴ διώκοντα
  choice: que não buscavam
  rationale: Expressa a ação contínua ou postura característica do particípio presente, sem recorrer a uma formulação artificial.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: «Justiça» é a correspondência portuguesa natural de δικαιοσύνη e conserva sua amplitude moral, jurídica e relacional, sem restringi-la a uma formulação doutrinária posterior.
- source_word: κατέλαβεν
  choice: alcançaram
  rationale: Neste contexto, o verbo indica chegar a obter aquilo que não se buscava; a concordância plural é exigida pelo português com «os gentios».
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: mas a justiça que vem da fé
  rationale: A repetição especifica a espécie de justiça alcançada. «Mas» conserva δέ e realça a correção ou delimitação, enquanto «que vem da fé» traduz ἐκ πίστεως sem acrescentar uma fórmula confessional.
- source_word: πίστεως
  choice: fé
  rationale: «Fé» preserva o sentido mais provável de πίστις nesta construção e mantém aberta sua dimensão de confiança.
theological_decisions:
- issue: Amplitude de δικαιοσύνη no argumento paulino
  choice: Traduzir por «justiça» sem defini-la apenas como justiça imputada.
  alternative: Retidão; condição de aceitação diante de Deus; condição de membro da aliança.
  rationale: O versículo não explica por completo o mecanismo doutrinário. A formulação ampla evita impor ao texto uma leitura confessional mais estreita.
- issue: Sentido de ἐκ πίστεως
  choice: «que vem da fé»
  alternative: «mediante a fé»; «que procede da fidelidade».
  rationale: A tradução conserva a ideia de origem expressa por ἐκ e não acrescenta «somente» nem especifica de quem seria a fidelidade.
- issue: Função de δέ na frase final
  choice: «mas», como partícula que delimita e especifica a justiça mencionada.
  alternative: «isto é»; omitir a conjunção e usar apenas uma aposição.
  rationale: δέ pode ter aqui força de esclarecimento com contraste implícito. «Mas» mantém a tensão sintática do grego sem transformar a frase numa explicação mais explícita do que o original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A frase conserva a pergunta retórica paulina, a repetição enfática de «justiça» e a tensão entre busca e alcance. O travessão marca a retomada especificadora sem eliminar a conjunção adversativa.
