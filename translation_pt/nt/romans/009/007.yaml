  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: pt
  text: 'Nem por serem descendência de Abraão são todos filhos. Mas: “Em Isaque será chamada a tua descendência”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em Isaque será chamada a tua semente”. “Descendência” traduz uma palavra grega no singular que pode ter sentido coletivo. “Será chamada” também pode significar “será designada” ou “será reconhecida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Nem por serem
  rationale: Expressa a negação adicional ligada ao argumento anterior e introduz, de modo natural em português, a condição que não basta para a conclusão.
- source_word: σπέρμα Ἀβραάμ
  choice: descendência de Abraão
  rationale: “Descendência” comunica o sentido coletivo de σπέρμα em português atual, sem restringi-lo a indivíduos masculinos.
- source_word: πάντες τέκνα
  choice: são todos filhos
  rationale: “Filhos” é a forma portuguesa natural e inclusiva neste contexto de vínculo familiar; o verbo é explicitado conforme exige a fluência.
- source_word: ἀλλ’
  choice: Pelo contrário
  rationale: Marca com clareza a correção enfática introduzida pela citação.
- source_word: Ἐν Ἰσαὰκ
  choice: Em Isaque
  rationale: Mantém de perto a forma da citação grega e sua ressonância com Gênesis 21:12, sem resolver interpretativamente a relação como “por meio de”.
- source_word: κληθήσεταί
  choice: será chamada
  rationale: Preserva o sentido lexical de καλέω e a ambiguidade entre receber um nome e ser designada ou reconhecida.
- source_word: σοι σπέρμα
  choice: a sua descendência
  rationale: O dativo σοι é expresso idiomaticamente como possessivo, mantendo σπέρμα como substantivo coletivo.
theological_decisions:
- issue: Relação entre descendência física e condição de filhos
  choice: A redação distingue a descendência abraâmica da condição de filhos sem explicitar aqui o mecanismo dessa distinção.
  alternative: Inserir “filhos da promessa”, “filhos de Deus” ou “filhos da aliança”.
  rationale: O versículo diz apenas “filhos”; especificar a categoria importaria a explicação do contexto para dentro da frase e reduziria sua tensão.
- issue: Força da citação de Gênesis
  choice: “Em Isaque será chamada a sua descendência”
  alternative: “Por meio de Isaque será constituída/reconhecida a sua descendência”.
  rationale: A forma escolhida conserva a construção e a ambiguidade do texto citado, deixando ao contexto a interpretação de “chamada”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a concisão argumentativa de Paulo e a linguagem formal da citação. O marcador foi colocado imediatamente após a citação a que a nota se refere.
