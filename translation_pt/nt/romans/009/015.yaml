base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: pt
  text: 'Pois ele diz a Moisés: “Terei misericórdia de quem eu tiver misericórdia[a] e terei compaixão de quem eu tiver compaixão.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mostrarei misericórdia a quem eu mostrar misericórdia e mostrarei compaixão a quem eu mostrar compaixão.”'
    reason: lexical_alternative
  - marker: b
    text: Citação de Êxodo 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: a Moisés
  rationale: O dativo funciona como objeto indireto de λέγει; “a Moisés” é a forma natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a afirmação anterior de Paulo sem tornar a relação mais causal do que o grego exige.
- source_word: λέγει
  choice: ele diz
  rationale: Preserva o presente da fórmula de citação. O pronome pessoal remete a Deus, que fala diretamente a Moisés no contexto de Êxodo 33:19.
- source_word: Ἐλεήσω ... ἐλεῶ
  choice: Terei misericórdia ... tiver misericórdia
  rationale: “Ter misericórdia de” é idiomático e digno em português. A repetição conserva o paralelismo enfático, enquanto o futuro do subjuntivo português expressa naturalmente a referência indefinida de ὃν ἂν.
- source_word: ὃν ἂν
  choice: de quem
  rationale: Com “ter misericórdia de” e “ter compaixão de”, “de quem” introduz naturalmente o objeto humano indefinido, sem acrescentar ideias como escolha ou merecimento.
- source_word: οἰκτιρήσω ... οἰκτίρω
  choice: terei compaixão ... tiver compaixão
  rationale: Mantém a distinção lexical em relação a ἐλεέω e evita o possível tom condescendente de “ter pena”. A repetição preserva a estrutura enfática do original.
theological_decisions:
- issue: Identificação do sujeito na fórmula de citação
  choice: “ele diz”, tendo Deus como referente contextual
  alternative: “a Escritura diz a Moisés” ou uma formulação impessoal
  rationale: O verbo grego não explicita o sujeito, mas a fala citada em Êxodo 33:19 é de Deus. A tradução pessoal acompanha esse contexto sem inserir uma identificação dentro do próprio versículo.
- issue: Liberdade divina na misericórdia e na compaixão
  choice: Preservar a formulação repetitiva, sem explicá-la
  alternative: Parafrasear como “terei misericórdia de quem eu escolher”
  rationale: O grego não contém um verbo equivalente a “escolher”. A repetição deve permanecer para conservar a força e a tensão teológica do texto sem resolver debates interpretativos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém o encadeamento argumentativo; “misericórdia” e “compaixão” preservam a distinção lexical e o paralelismo do grego. A repetição deliberada foi mantida, sem paráfrase doutrinária.
