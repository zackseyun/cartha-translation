  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: pt
  text: Mas não é como se a palavra de Deus tivesse falhado. Pois nem todos os que descendem de Israel[a] são Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que procedem de Israel». A expressão grega indica origem ou descendência.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, a segunda ocorrência de «Israel» é usada em sentido mais restrito que a primeira. Paulo distingue a descendência física de «Israel»; o versículo não define por completo o alcance dessa distinção.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Mas não é como se
  rationale: Expressão idiomática que corrige uma possível conclusão decorrente do lamento anterior de Paulo. A formulação portuguesa comunica com naturalidade que ele rejeita essa inferência.
- source_word: ἐκπέπτωκεν
  choice: tivesse falhado
  rationale: O perfeito grego descreve um resultado vigente. Em relação à palavra de Deus, «falhar» expressa de modo idiomático a ideia de não se cumprir ou perder a eficácia, sem recorrer ao literal pouco natural «ter caído».
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a amplitude de λόγος, que pode se referir à palavra declarada ou promissória de Deus. Traduzir por «promessa» tornaria explícita uma interpretação que o grego não especifica.
- source_word: οὐ γὰρ πάντες
  choice: Pois nem todos
  rationale: «Pois» preserva a função explicativa de γάρ, e «nem todos» é a negação distributiva natural em português.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: os que descendem de Israel
  rationale: ἐξ indica origem ou procedência; no contexto, a formulação natural «descendem de Israel» comunica a linhagem sem decidir por si só o alcance teológico da distinção seguinte.
- source_word: οὗτοι Ἰσραήλ
  choice: são Israel
  rationale: Completa naturalmente a oração nominal elíptica e preserva a formulação incisiva de Paulo, sem substituir «Israel» por uma paráfrase interpretativa.
theological_decisions:
- issue: Sentido da segunda ocorrência de «Israel»
  choice: Manter «Israel» sem explicação interpretativa no texto principal, deixando que o contexto indique um sentido mais restrito do que mera descendência física.
  alternative: Explicitar «o verdadeiro Israel», «o Israel eleito» ou «o povo de Deus».
  rationale: Essas paráfrases resolveriam uma tensão que Paulo deixa aberta neste versículo. A tradução conserva a distinção entre descendência de Israel e o sentido mais restrito de «Israel», sem impor uma definição denominacional de seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Mas não é como se» e «tivesse falhado» formam uma construção idiomática natural; a repetição deliberada de «Israel» preserva a força e a tensão do original.
