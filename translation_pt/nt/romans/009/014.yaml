  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: pt
  text: Que diremos, então? Há injustiça da parte de Deus?[a] De modo nenhum![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falta de justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Que isso não aconteça!” Expressão grega de negação enfática; também pode ser traduzida por “De maneira nenhuma!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que diremos, então?
  rationale: Reproduz de modo natural a fórmula paulina de transição e preserva a força deliberativa do futuro ἐροῦμεν.
- source_word: μὴ
  choice: Há ...?
  rationale: A partícula introduz uma pergunta retórica que espera resposta negativa; em português, essa expectativa fica clara pelo contexto e pela negação enfática seguinte.
- source_word: ἀδικία
  choice: injustiça
  rationale: Expressa com clareza o sentido moral e judicial pertinente ao contexto; “falta de justiça” seria possível, mas menos conciso.
- source_word: παρὰ τῷ θεῷ
  choice: da parte de Deus
  rationale: Transmite idiomaticamente que a suposta injustiça seria atribuível à atuação de Deus, sem reduzir a frase à caracterização direta “Deus é injusto”.
- source_word: μὴ γένοιτο
  choice: De modo nenhum!
  rationale: Equivalente português corrente e enfático para a forte rejeição grega, sem a estranheza de uma reprodução literal.
theological_decisions:
- issue: Preservar a objeção retórica sem acrescentar uma explicação doutrinária sobre a ação de Deus em Romanos 9.
  choice: Há injustiça da parte de Deus? De modo nenhum!
  alternative: Deus é injusto? Claro que não!
  rationale: A opção escolhida mantém a formulação abstrata ἀδικία e a relação expressa por παρὰ τῷ θεῷ, evitando converter a pergunta em uma afirmação interpretativa sobre o caráter de Deus ou ampliar o texto com categorias teológicas não explicitadas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Que diremos, então?” conserva a cadência retórica paulina; “da parte de Deus” é mais natural e semanticamente preciso do que o decalque “com Deus”.
