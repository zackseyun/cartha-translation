  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: pt
  text: Deles são os patriarcas, e deles provém o Messias segundo a carne, aquele que está sobre todos, Deus bendito para sempre. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες
  choice: os pais
  rationale: Preserva de perto a linguagem histórico-aliançal de Paulo para os antepassados reverenciados de Israel; “os patriarcas” seria possível, mas mais estreito e interpretativo.
- source_word: ἐξ ὧν
  choice: deles procede
  rationale: Retoma os israelitas mencionados no contexto e expressa em português natural a origem humana do Messias.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona como título ligado às prerrogativas e à história de Israel, não meramente como forma semelhante a nome próprio.
- source_word: τὸ κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém a formulação paulina e, no contexto, indica linhagem ou descendência humana, sem sugerir natureza pecaminosa.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: o qual está acima de todos
  rationale: O particípio articular continua naturalmente a descrição do Messias; a formulação conserva a referência pessoal e a supremacia expressa pelo grego.
- source_word: θεὸς εὐλογητὸς
  choice: Deus bendito
  rationale: Reproduz de modo digno e conciso a construção grega, entendida no texto principal como aposição cristológica.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português corrente e natural da expressão doxológica grega.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a transliteração litúrgica consagrada em português.
theological_decisions:
- issue: Se a oração ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας descreve o Messias ou inicia uma doxologia separada a Deus
  choice: 'O texto principal entende a oração como continuação da descrição do Messias: “o qual está acima de todos, Deus bendito para sempre”.'
  alternative: 'Pontuar como doxologia separada: “Deus, que está acima de todos, seja bendito para sempre. Amém.”'
  rationale: A sequência sintática favorece tomar o particípio articular ὁ ὢν como aposição a ὁ χριστός. Como os manuscritos mais antigos não fornecem pontuação decisiva e a interpretação é historicamente discutida, a leitura doxológica alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “segundo a carne” no texto por sua importância na linguagem paulina. A pontuação principal segue a leitura cristológica, sem ocultar em nota a alternativa doxológica.
