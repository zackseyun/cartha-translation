revisions:
- from: Deles são os pais, e deles procede o Messias, segundo a carne, o qual está acima de todos, Deus bendito para sempre.[a] Amém.
  to: Deles são os patriarcas, e deles provém o Messias segundo a carne, aquele que está sobre todos, Deus bendito para sempre. Amém.
  rationale: A revisão substitui «os pais» por «os patriarcas», para eliminar uma ambiguidade moderna e identificar o referente histórico de οἱ πατέρες. Também ajusta a construção relativa para uma leitura portuguesa mais fluente, preservando a sintaxe cristológica adotada no texto principal. A nota mantém a possibilidade, historicamente debatida, de entender a cláusula final como doxologia separada.
