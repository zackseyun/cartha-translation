review_pass:
  verdict: revise
  source_fidelity: O sentido central e a leitura cristológica do período são bem preservados. Contudo, «os pais» em português moderno normalmente designa pai e mãe, não os antepassados reverenciados de Israel; «os patriarcas» identifica adequadamente o referente de οἱ πατέρες neste contexto. «Provém» exprime com naturalidade a origem/descendência indicada por ἐξ ὧν, sem acrescentar conteúdo.
  naturalness: A redação proposta melhora a clareza para leitores lusófonos atuais. «Aquele que está sobre todos» reproduz de modo direto o particípio articular e evita uma relativa algo pesada depois de «segundo a carne».
  terminology: «Patriarcas» é o termo histórico-teológico corrente para os antepassados de Israel neste contexto, e «Messias», «segundo a carne», «Deus bendito para sempre» e «Amém» mantêm terminologia bíblica estabelecida. A nota continua a registrar, sem decidir dogmaticamente, a alternativa de pontuação doxológica.
  issues:
  - severity: medium
    issue: «os pais» é ambíguo no português moderno.
    rationale: Em uso corrente, «pais» significa os progenitores imediatos; não comunica de forma suficientemente clara οἱ πατέρες como os antepassados/patriarcas de Israel.
  - severity: low
    issue: A construção «o Messias, segundo a carne, o qual» é sintaticamente pesada.
    rationale: A sequência de incisos antes da oração relativa reduz a fluência, embora não altere o sentido.
  revised_text: Deles são os patriarcas, e deles provém o Messias segundo a carne, aquele que está sobre todos, Deus bendito para sempre. Amém.
  revised_footnotes:
