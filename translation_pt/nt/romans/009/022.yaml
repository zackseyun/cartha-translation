id: ROM.9.22
reference: Romans 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: pt
  text: Mas, e se Deus[a], querendo demonstrar sua ira e dar a conhecer seu poder[b], suportou com muita paciência vasos de ira preparados para a destruição[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas se Deus”. O grego inicia uma frase condicional retórica que continua no versículo seguinte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua força”. A expressão grega se refere literalmente ao que é poderoso ou possível para Deus e, aqui, indica seu poder.'
    reason: lexical_alternative
  - marker: c
    text: A forma passiva “preparados para a destruição” não declara quem preparou esses vasos. Há diferentes interpretações sobre se Paulo sugere ação divina, endurecimento da própria pessoa ou simplesmente um estado de prontidão para o juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, e se
  rationale: Preserva a abertura condicional retórica e deixa a construção em suspenso para continuar no versículo seguinte.
- source_word: θέλων
  choice: querendo
  rationale: Mantém de modo natural o valor participial, sem decidir se a relação é causal ou concessiva.
- source_word: ἐνδείξασθαι
  choice: demonstrar
  rationale: Expressa a manifestação intencional e perceptível da ira divina em português corrente e digno.
- source_word: τὴν ὀργήν
  choice: sua ira
  rationale: “Ira” preserva a dimensão judicial do termo no contexto paulino; o possessivo explicita naturalmente a referência a Deus.
- source_word: γνωρίσαι
  choice: dar a conhecer
  rationale: Reproduz o sentido causativo de tornar algo conhecido, com formulação clara e formalmente adequada.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: seu poder
  rationale: É a equivalência idiomática mais clara no contexto, embora a expressão grega diga literalmente “o que é poderoso/possível para ele”.
- source_word: ἤνεγκεν
  choice: suportou
  rationale: No contexto, com a expressão de muita paciência, indica tolerar ou aguentar pessoas retratadas como vasos.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: com muita paciência
  rationale: Comunica de modo acessível a ideia de longa tolerância ou demora em irar-se.
- source_word: σκεύη
  choice: vasos
  rationale: Conserva a metáfora da olaria no contexto imediato de Romanos 9.
- source_word: σκεύη ὀργῆς
  choice: vasos de ira
  rationale: Mantém a expressão genitiva compacta sem decidir se indica objetos da ira, caracterização ou destino.
- source_word: κατηρτισμένα
  choice: preparados
  rationale: Preserva o particípio perfeito passivo e, crucialmente, não identifica o agente da preparação.
- source_word: εἰς ἀπώλειαν
  choice: para a destruição
  rationale: Expressa de maneira direta o destino ou resultado indicado pela preposição εἰς.
theological_decisions:
- issue: Agente implícito em κατηρτισμένα (“preparados”)
  choice: Manter a forma passiva “preparados” sem identificar quem os preparou.
  alternative: “preparados por Deus”, “aptos para a destruição” ou “que se prepararam para a destruição”
  rationale: O grego descreve o estado dos vasos, mas não nomeia o agente. A tradução preserva essa tensão interpretativa.
- issue: Força da condição iniciada por εἰ δὲ
  choice: Traduzir “Mas, e se” e conservar a frase incompleta neste versículo.
  alternative: “Mas se” ou transformar a oração em afirmação independente
  rationale: A construção retórica prossegue no versículo 23; completá-la aqui ou torná-la assertiva iria além da sintaxe grega.
- issue: Relação do particípio θέλων com o verbo principal
  choice: Traduzir simplesmente “querendo”, sem acrescentar conjunção explicativa.
  alternative: “porque queria” ou “embora quisesse”
  rationale: O particípio pode ser relacionado ao verbo principal de mais de uma forma; a tradução não impõe valor causal ou concessivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a metáfora dos vasos, a condição retórica suspensa e a ambiguidade do agente na forma passiva. A vírgula final sinaliza que a frase continua em Romanos 9:23.
