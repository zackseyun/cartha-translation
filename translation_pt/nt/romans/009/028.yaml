  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: pt
  text: Pois o Senhor cumprirá a sua palavra[a] sobre a terra[c], levando-a a termo e abreviando-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Senhor executará a decisão/sentença sobre a terra”.'
    reason: lexical_alternative
  - marker: b
    text: “Abreviando-a” também pode ser entendido como “encurtando-a” ou, por implicação, “executando-a rapidamente”.
    reason: lexical_alternative
  - marker: c
    text: Alguns traduzem ἐπὶ τῆς γῆς por “na terra”, no sentido de “no país” ou “na terra de Israel”, refletindo o contexto original de Isaías; a forma grega de Romanos permite o sentido mais amplo “sobre a terra”.
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: a sua palavra
  rationale: No contexto da citação, λόγος designa aquilo que o Senhor declarou e realizará. “Palavra” preserva o caráter verbal e declarativo do termo; “sua” explicita naturalmente a relação com “o Senhor”, sem alterar o referente.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e mantém de forma concisa o encadeamento argumentativo de Paulo.
- source_word: συντελῶν
  choice: levando-a a termo
  rationale: Expressa a ação de conduzir algo à sua plena conclusão. A formulação é natural e digna, além de manter a relação circunstancial do particípio com a ação do Senhor.
- source_word: καὶ συντέμνων
  choice: e abreviando-a
  rationale: συντέμνω pode indicar abreviar, encurtar ou cortar curto. “Abreviando-a” preserva a imagem de redução sem impor a inferência contextual de rapidez; outras possibilidades são registradas em nota.
- source_word: ποιήσει
  choice: cumprirá
  rationale: Com λόγον como objeto, ποιέω comunica que o Senhor realizará o que declarou. “Cumprirá a sua palavra” é português corrente e preserva a ideia de execução efetiva, evitando o literalismo pouco natural de “fará a palavra”.
- source_word: κύριος
  choice: o Senhor
  rationale: É a designação tradicional e contextualmente adequada para Deus na citação bíblica.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Representa diretamente a formulação grega de Romanos e mantém seu alcance mais amplo. “Na terra” também seria idiomático, mas poderia ser confundido com a leitura mais restrita “na terra de Israel”.
theological_decisions:
- issue: Natureza da ação divina na citação de Isaías
  choice: O Senhor leva decisivamente ao cumprimento aquilo que declarou, com possíveis conotações judiciais mantidas sem explicitação dogmática.
  alternative: O Senhor executará rapidamente uma sentença judicial; ou concluirá e abreviará sua obra salvadora e julgadora.
  rationale: Os particípios e o substantivo λόγος permitem entender a passagem em termos de palavra, decisão ou sentença e podem sugerir rapidez e juízo. O texto principal conserva essa tensão sem vinculá-la a um esquema doutrinário específico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Cumprirá a sua palavra” é idiomático sem apagar as alternativas judicial e decretal; “levando-a a termo” evita uma formulação mecânica, e “abreviando-a” conserva a estranheza significativa do segundo particípio.
