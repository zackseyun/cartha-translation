id: ROM.9.26
reference: Romans 9:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: pt
  text: 'E acontecerá que, no mesmo lugar onde lhes foi dito: “Vocês não são meu povo”, ali serão chamados filhos do Deus vivo.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filhos e filhas do Deus vivo”. O grego diz literalmente “filhos”, termo que pode abranger todos os que são reconhecidos como povo de Deus e também conserva a ideia bíblica de filiação e herança.'
    reason: lexical_alternative
  - marker: b
    text: Citação ou alusão a Oseias 1:10 (2:1 na Septuaginta), em linguagem de restauração da aliança.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: E acontecerá que
  rationale: Expressa naturalmente em português o futuro introdutório da citação, preservando o conectivo καί e sem acrescentar força inferencial.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: no mesmo lugar onde
  rationale: “Lugar” traduz τόπος; “mesmo” explicita com naturalidade a correspondência enfática entre o lugar da rejeição e o da restauração, reforçada por ἐκεῖ.
- source_word: ἐρρέθη αὐτοῖς
  choice: lhes foi dito
  rationale: Mantém a construção passiva e não explicita o agente, que permanece implícito no grego.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Vocês não são meu povo
  rationale: Reordena a frase para o português corrente, preservando a fórmula pactual “meu povo”.
- source_word: ἐκεῖ
  choice: ali
  rationale: Marca de modo conciso a reversão ocorrida precisamente naquele lugar.
- source_word: κληθήσονται
  choice: serão chamados
  rationale: Preserva o futuro passivo e deixa sem explicitar a agência divina implícita.
- source_word: υἱοὶ
  choice: filhos
  rationale: Corresponde ao masculino plural grego e conserva possíveis ressonâncias de filiação e herança; em português, “filhos” também pode funcionar como plural representativo.
- source_word: θεοῦ ζῶντος
  choice: do Deus vivo
  rationale: É a formulação bíblica natural e consagrada em português, preservando o contraste teológico com deuses sem vida.
theological_decisions:
- issue: Sentido representativo de υἱοὶ
  choice: filhos
  alternative: filhos e filhas; crianças de Deus
  rationale: O texto grego emprega υἱοὶ, não τέκνα. “Filhos” mantém a forma lexical e as possíveis ressonâncias de filiação e herança, sem excluir as mulheres entre os que passam a pertencer ao povo de Deus; a abrangência é esclarecida em nota.
- issue: Identidade pactual em λαός μου
  choice: meu povo
  alternative: meu próprio povo
  rationale: “Meu povo” preserva sem expansão a fórmula de aliança evocada pela citação de Oseias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” na fala direta por ser natural e internacionalmente inteligível. A ordem das notas segue a ordem em que suas informações são mais naturalmente associadas ao texto; todos os marcadores aparecem no versículo.
