id: ROM.9.1
reference: Romans 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: pt
  text: Digo a verdade no Messias[a]; não estou mentindo, e minha consciência dá testemunho comigo no Espírito Santo[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, conforme o uso tradicional, como “Cristo”; aqui foi vertido como título.
    reason: lexical_alternative
  - marker: b
    text: Ou “com minha consciência dando testemunho” ou “minha consciência testemunhando comigo”.
    reason: lexical_alternative
  - marker: c
    text: Ou, possivelmente, “num espírito santo”, embora em Paulo a expressão seja mais naturalmente entendida como referência ao Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Digo a verdade
  rationale: A expressão idiomática com ἀλήθειαν e λέγω significa falar com verdade; a formulação portuguesa é direta, solene e natural.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Preserva o valor titular de Χριστός e mantém a preposição ἐν sem reduzir a expressão a uma mera fórmula adverbial.
- source_word: οὐ ψεύδομαι
  choice: não estou mentindo
  rationale: Reproduz de modo contemporâneo a negação enfática no presente.
- source_word: συμμαρτυρούσης
  choice: dá testemunho comigo
  rationale: Mantém o sentido associativo do prefixo συν- e apresenta com naturalidade a circunstância expressa pelo particípio genitivo.
- source_word: τῆς συνειδήσεώς μου
  choice: minha consciência
  rationale: Equivalente corrente e preciso de συνείδησις no uso paulino.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: No contexto paulino, a expressão é mais naturalmente uma referência ao Espírito Santo; a tradução conserva a preposição ἐν.
theological_decisions:
- issue: Valor de Χριστός em ἐν Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: A tradução explicita o título de ungido, embora em português o termo também possa funcionar de modo consolidado como “Cristo”; a alternativa é registrada para preservar a nuance lexical.
- issue: Referente de πνεύματι ἁγίῳ
  choice: Espírito Santo
  alternative: um espírito santo
  rationale: O uso paulino e o caráter solene da afirmação favorecem a referência ao Espírito Santo, sem esconder a possibilidade gramatical menos provável da leitura indefinida.
- issue: Relação expressa por συμμαρτυρούσης
  choice: a consciência dá testemunho comigo
  alternative: com minha consciência dando testemunho
  rationale: A construção escolhida preserva a ideia de testemunho conjunto sem decidir além do necessário a relação sintática do genitivo absoluto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A coordenação com “e” evita uma ligação causal indevida e conserva o fluxo enfático da afirmação paulina.
