  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: pt
  text: 'como também diz em Oseias: “Chamarei de ‘meu povo’ aquele que não é meu povo e de ‘amada’ aquela que não é amada”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citação de Oseias 2:23 (2:25 na Septuaginta). A primeira expressão também pode ser traduzida no plural: “Chamarei de ‘meu povo’ os que não são meu povo”.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: como também
  rationale: Introduz a citação bíblica como confirmação do argumento e preserva de modo natural a força comparativa e aditiva.
- source_word: ἐν τῷ Ὡσηὲ
  choice: em Oseias
  rationale: Reproduz a fórmula de citação, que pode indicar o livro de Oseias, sem expandi-la desnecessariamente.
- source_word: λέγει
  choice: diz
  rationale: Mantém a forma pessoal da fala; no contexto, o sujeito implícito é Deus.
- source_word: Καλέσω
  choice: Chamarei
  rationale: Preserva diretamente o futuro de καλέω e sua ideia de designação relacional ou pactual.
- source_word: τὸν οὐ λαόν μου
  choice: aquele que não era meu povo
  rationale: Conserva o singular formal do grego, embora λαός tenha sentido coletivo; a inserção de 'era' produz português natural.
- source_word: λαόν μου
  choice: meu povo
  rationale: Mantém a expressão bíblica e pactual de forma clara e concisa.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: aquela que não era amada
  rationale: Preserva tanto o feminino singular do texto quanto a noção passiva do particípio.
- source_word: ἠγαπημένην
  choice: amada
  rationale: Expressa naturalmente o particípio passivo e conserva a repetição da mesma família verbal da expressão anterior.
theological_decisions:
- issue: Força coletiva ou individual da primeira expressão
  choice: Manter a forma singular 'aquele que não era meu povo', entendendo 'povo' coletivamente.
  alternative: 'Traduzir no plural: ''os que não eram meu povo''.'
  rationale: O singular do grego pode ser preservado de maneira idiomática em português, enquanto o substantivo 'povo' deixa visível a dimensão coletiva da citação.
- issue: Identidade do sujeito de λέγει
  choice: Deixar o sujeito implícito em 'diz', como no fluxo do contexto português.
  alternative: Explicitar 'Deus diz' ou usar a forma impessoal 'está escrito'.
  rationale: O contexto identifica Deus como quem fala, mas o grego não explicita o substantivo; evitar acrescentá-lo preserva a concisão e a abertura formal do original.
- issue: Forma feminina na segunda cláusula
  choice: Preservar 'aquela... amada'.
  alternative: Neutralizar como 'quem não era amado' ou coletivizar no plural.
  rationale: O feminino singular remete de modo significativo à formulação de Oseias e não deve ser apagado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e ampla compreensão internacional. A ordem das aspas torna explícitos os novos nomes dados por Deus, sem eliminar o paralelismo nem o feminino singular da segunda cláusula.
