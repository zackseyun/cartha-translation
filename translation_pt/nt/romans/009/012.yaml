id: ROM.9.12
reference: Romans 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: pt
  text: 'não por obras, mas por aquele que chama[a] — foi dito a ela: “O mais velho servirá ao mais novo.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não com base em obras, mas com base naquele que chama”.'
    reason: lexical_alternative
  - marker: b
    text: Citação de Gênesis 25:23.
    reason: cross_reference
  - marker: c
    text: 'Ou: “O maior servirá ao menor”; “mais velho/mais novo” reflete o contexto de Jacó e Esaú.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: não por obras
  rationale: A preposição ἐκ com o genitivo indica aqui origem ou fundamento. A formulação concisa preserva o contraste de Paulo e é corrente em português; a nota registra uma explicitação possível.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: mas por aquele que chama
  rationale: O particípio presente substantivado τοῦ καλοῦντος refere-se a Deus sem nomeá-lo explicitamente. “Aquele que chama” conserva tanto a forma substantivada quanto o aspecto presente.
- source_word: ἐρρέθη αὐτῇ
  choice: foi dito a ela
  rationale: A construção passiva impessoal reproduz a fórmula de citação no aoristo e evita introduzir um sujeito expresso que não aparece no grego.
- source_word: ὅτι
  choice: dois-pontos e aspas
  rationale: ὅτι introduz discurso direto; a pontuação portuguesa transmite essa função com naturalidade.
- source_word: Ὁ μείζων
  choice: O mais velho
  rationale: No contexto de Jacó e Esaú, o comparativo aponta para a precedência de idade. “Mais velho” comunica isso com clareza, enquanto “maior” preserva uma ambiguidade lexical registrada em nota.
- source_word: δουλεύσει
  choice: servirá
  rationale: O futuro de δουλεύω expressa serviço ou sujeição. “Servirá” preserva a força do verbo sem especificar além do texto uma condição jurídica de escravidão.
- source_word: τῷ ἐλάσσονι
  choice: ao mais novo
  rationale: Em contraste com ὁ μείζων e à luz de Gênesis 25:23, refere-se ao irmão mais novo. A alternativa mais formal “ao menor” é indicada em nota.
theological_decisions:
- issue: Se o contraste entre obras e aquele que chama deve ser ampliado para formular explicitamente uma doutrina da eleição incondicional
  choice: 'Manter o contraste compacto: “não por obras, mas por aquele que chama”.'
  alternative: “não por causa das obras, mas por causa de Deus, que chama”
  rationale: O texto contrasta obras com o chamado divino, mas não convém inserir neste versículo isolado conclusões doutrinárias desenvolvidas a partir do contexto mais amplo. A redação mantém a tensão e a estrutura do argumento sem expansão confessional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O início em minúscula preserva o fato de que o versículo continua a construção sintática do contexto anterior. O travessão organiza a transição para a fórmula de citação sem acrescentar conteúdo.
