id: ROM.9.3
reference: Romans 9:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: pt
  text: Pois eu poderia desejar ser eu mesmo amaldiçoado e separado do Messias em favor de meus irmãos, meus parentes segundo a carne.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amaldiçoado, longe do Messias” ou “sob maldição, separado do Messias”. A expressão grega reúne a ideia de estar sob maldição e a de separação do Messias.'
    reason: lexical_alternative
  - marker: b
    text: “Segundo a carne” significa aqui por descendência física ou linhagem étnica, e não “segundo a natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: eu poderia desejar
  rationale: O imperfeito de εὔχομαι expressa aqui um desejo hipotético ou potencial, carregado de emoção, e não simplesmente uma ação passada.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com a afirmação anterior e o fluxo do argumento de Paulo.
- source_word: ἀνάθεμα
  choice: amaldiçoado
  rationale: Comunica de modo claro a condição de estar sob maldição, sem recorrer ao menos transparente termo técnico “anátema”.
- source_word: αὐτὸς ἐγώ
  choice: eu mesmo
  rationale: Mantém a forte ênfase pessoal da combinação pronominal grega.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: separado do Messias
  rationale: ἀπό indica separação, e “Messias” preserva aqui a força titular de Χριστός.
- source_word: ὑπὲρ
  choice: em favor de
  rationale: Expressa naturalmente o valor benefactivo e vicário da preposição neste contexto.
- source_word: τῶν ἀδελφῶν μου
  choice: meus irmãos
  rationale: Reproduz a forma masculina plural do grego; o contexto mostra que se trata dos israelitas, o povo de Paulo.
- source_word: τῶν συγγενῶν μου
  choice: meus parentes
  rationale: É uma forma atual e abrangente de expressar o vínculo de parentesco étnico indicado por συγγενῶν.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Preserva a expressão paulina e sua referência, neste contexto, à descendência física ou linhagem étnica.
theological_decisions:
- issue: Se a declaração de Paulo é uma oração efetiva ou um desejo hipotético
  choice: eu poderia desejar
  alternative: eu desejava; eu orava
  rationale: A formulação não afirma que Paulo tenha realmente pedido para ser separado do Messias, mas conserva toda a intensidade de seu desejo impossível ou hipotético.
- issue: Força de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O contexto admite claramente a força de título, que “Messias” torna transparente.
- issue: Relação entre ἀνάθεμα e ἀπὸ τοῦ Χριστοῦ
  choice: amaldiçoado e separado do Messias
  alternative: amaldiçoado da parte do Messias; anátema longe do Messias
  rationale: A tradução entende a expressão como a combinação da condição de maldição com a separação do Messias, sem ocultar em nota a possibilidade de uma ligação sintática mais direta entre os termos.
- issue: Sentido de σάρξ
  choice: descendência física ou linhagem étnica
  alternative: natureza pecaminosa
  rationale: Paulo identifica seus compatriotas israelitas; não está descrevendo uma disposição moral pecaminosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” conserva a conexão argumentativa; “eu mesmo” mantém a ênfase; e “segundo a carne” preserva a formulação paulina, esclarecida em nota.
