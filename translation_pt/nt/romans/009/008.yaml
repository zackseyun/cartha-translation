id: ROM.9.8
reference: Romans 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: pt
  text: 'Isto é: não são os filhos da carne[a] que são filhos de Deus; ao contrário, os filhos da promessa é que são considerados descendência[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «os filhos por descendência natural». Grego: «os filhos da carne».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou «são contados como descendência». Grego: «são considerados como semente». Aqui, «semente» tem o sentido coletivo de descendentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Isto é
  rationale: Introduz de modo conciso e natural a explicação de Paulo sobre a afirmação anterior.
- source_word: τέκνα
  choice: filhos
  rationale: O plural é inclusivo e designa filhos ou descendentes, sem se limitar ao sexo masculino; a mesma escolha preserva o paralelismo das três ocorrências.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: os filhos da carne
  rationale: Mantém a formulação paulina e o contraste direto com «os filhos da promessa». Neste contexto, «carne» se refere à descendência natural, não a uma qualidade moral.
- source_word: τέκνα τοῦ θεοῦ
  choice: filhos de Deus
  rationale: Reproduz claramente a relação expressa pelo genitivo e conserva o contraste retórico do versículo.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: os filhos da promessa
  rationale: 'Preserva a expressão relacional do grego: são filhos definidos pela promessa de Deus, em contraste com a mera linhagem natural.'
- source_word: λογίζεται
  choice: são considerados
  rationale: Expressa de forma natural o sentido passivo de reconhecer, reputar ou contar alguém como pertencente a uma categoria.
- source_word: εἰς σπέρμα
  choice: descendência
  rationale: Neste contexto abraâmico, σπέρμα é um coletivo que designa os descendentes. «Descendência» comunica esse sentido em português corrente sem a possível opacidade de «semente».
theological_decisions:
- issue: O contraste entre descendência física e a linhagem definida pela promessa de Deus
  choice: Manter o contraste entre «filhos da carne» e «filhos da promessa», sem explicitar no texto uma teoria teológica mais ampla.
  alternative: Traduzir de modo a impor uma leitura exclusivamente histórico-corporativa ou explicitamente predestinacionista individual.
  rationale: O grego afirma o contraste, mas não resolve por si só todas as discussões teológicas de Romanos 9. A tradução conserva a tensão e evita inserir um sistema doutrinário específico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação paulina «filhos da carne» foi preservada no texto, e seu sentido genealógico foi esclarecido em nota. A construção enfática «é que» reflete o contraste entre os dois grupos sem acrescentar uma conclusão doutrinária.
