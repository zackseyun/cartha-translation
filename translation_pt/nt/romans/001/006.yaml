  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: pt
  text: entre os quais vocês também estão, chamados para pertencer a Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «chamados por Jesus, o Messias»; mais literalmente: «os chamados de Jesus, o Messias».'
    reason: O genitivo grego é conciso e pode indicar pertencimento ou relação, enquanto também admite uma leitura de agência.
lexical_decisions:
- source_word: ἐν οἷς
  choice: entre os quais
  rationale: O pronome relativo plural retoma os gentios mencionados anteriormente e inclui os destinatários romanos nesse grupo.
- source_word: ἐστε
  choice: estão
  rationale: Representa diretamente o presente do indicativo de εἰμί e concorda com o pronome plural «vocês».
- source_word: καὶ ὑμεῖς
  choice: também estão vocês
  rationale: A posição de «vocês» após o verbo conserva de modo natural em português a ênfase inclusiva do pronome grego expresso.
- source_word: κλητοὶ
  choice: chamados
  rationale: Mantém o sentido de pessoas convocadas ou chamadas sem especificar por si só a natureza ou o agente do chamado.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como o título «Messias» e usa a aposição idiomática portuguesa com artigo.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: chamados para pertencer a Jesus, o Messias
  rationale: Expressa em português natural a provável relação de pertencimento indicada pelo genitivo comprimido, enquanto a nota preserva as demais relações gramaticalmente possíveis.
theological_decisions:
- issue: Relação do genitivo em κλητοὶ Ἰησοῦ Χριστοῦ
  choice: chamados para pertencer a Jesus, o Messias
  alternative: chamados por Jesus, o Messias; mais literalmente, chamados de Jesus, o Messias
  rationale: O grego não explicita se o genitivo indica pertencimento, relação ou agência. A leitura de pertencimento se ajusta bem ao contexto e produz português claro, mas as possibilidades alternativas são preservadas na nota, sem transformar uma delas em afirmação exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para ampla legibilidade brasileira. A inversão moderada em «também estão vocês» preserva a ênfase do pronome sem recorrer a uma formulação arcaica.
