id: ROM.1.14
reference: Romans 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: pt
  text: Sou devedor tanto a gregos como a bárbaros[a], tanto a sábios como a insensatos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiros” ou “não gregos”. Aqui, “bárbaros” reflete o contraste cultural comum com “gregos” e não implica necessariamente selvageria.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: gregos
  rationale: Mantém a categoria étnico-cultural do texto e o primeiro termo do contraste convencional.
- source_word: βαρβάροις
  choice: bárbaros
  rationale: Preserva o rótulo histórico que, no mundo greco-romano, designava os não gregos; a nota evita a conotação moderna indevida de selvageria.
- source_word: σοφοῖς
  choice: sábios
  rationale: Equivalente direto e natural, preservando o contraste conciso com ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: insensatos
  rationale: Expressa a falta de entendimento e forma um contraste natural com 'sábios', sem restringir o sentido a falta de instrução formal.
- source_word: ὀφειλέτης
  choice: devedor
  rationale: Conserva a metáfora nominal forte do grego; no contexto, refere-se a uma obrigação, não necessariamente a uma dívida financeira.
- source_word: τε ... καὶ / τε ... καὶ
  choice: tanto ... como ... / tanto ... como ...
  rationale: Reproduz a estrutura correlativa e o equilíbrio retórico dos dois pares.
theological_decisions:
- issue: Natureza da dívida de Paulo
  choice: Manter a metáfora 'sou devedor'
  alternative: Estou sob obrigação
  rationale: O texto não especifica aqui a origem ou a natureza exata da obrigação. A formulação metafórica preserva essa abertura e evita explicação teológica acrescentada.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e os dois pares retóricos do grego foram preservados. 'Bárbaros' exige nota por ter hoje conotações mais negativas do que no contraste cultural antigo.
