base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: pt
  text: E trocaram a glória do Deus imperecível pela semelhança de uma imagem de ser humano perecível, de aves, de quadrúpedes e de animais rastejantes.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “incorruptível”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “homem perecível” ou “ser humano mortal”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “répteis” ou “seres que rastejam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: trocaram
  rationale: Expressa com naturalidade a substituição deliberada indicada pelo verbo no contexto.
- source_word: δόξαν
  choice: glória
  rationale: É o equivalente consagrado e preserva o contraste entre a majestade de Deus e as imagens criadas.
- source_word: ἀφθάρτου
  choice: incorruptível
  rationale: Mantém o contraste lexical direto com φθαρτοῦ e comunica aquilo que não está sujeito à corrupção ou deterioração.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: pela semelhança de uma imagem
  rationale: Preserva a construção singular e a sobreposição intencional da linguagem de semelhança e imagem, embora com alguma rigidez própria do grego.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: ser humano corruptível
  rationale: Preserva o contraste com Deus incorruptível; 'ser humano' comunica ἄνθρωπος de forma inclusiva e natural sem transformar o singular em plural.
- source_word: πετεινῶν
  choice: aves
  rationale: Equivalente claro, corrente e preciso.
- source_word: τετραπόδων
  choice: quadrúpedes
  rationale: Termo português conciso e compreensível para animais de quatro pés.
- source_word: ἑρπετῶν
  choice: animais rastejantes
  rationale: Evita restringir indevidamente o termo grego à categoria zoológica moderna dos répteis e conserva a ideia de seres que rastejam.
theological_decisions:
- issue: Contraste entre a natureza de Deus e a da criatura
  choice: incorruptível / corruptível
  alternative: imortal / mortal; imperecível / perecível
  rationale: A repetição da raiz em português espelha a oposição ἄφθαρτος/φθαρτός sem reduzir o contraste somente à mortalidade.
- issue: Referência de ἀνθρώπου
  choice: ser humano
  alternative: homem
  rationale: O grego designa o ser humano em contraste com Deus e com as classes de animais; a tradução evita uma leitura exclusivamente masculina sem apagar o singular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva de propósito a densidade de ἐν ὁμοιώματι εἰκόνος e o contraste lexical entre ἀφθάρτου e φθαρτοῦ.
