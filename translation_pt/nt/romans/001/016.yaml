id: ROM.1.16
reference: Romans 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: pt
  text: Pois não me envergonho das boas-novas[a], pois elas são o poder de Deus para a salvação de todo aquele que crê, ao judeu primeiro e também ao grego[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «evangelho».
    reason: lexical_alternative
  - marker: b
    text: Aqui, «grego» pode referir-se de modo mais amplo ao gentio, isto é, a quem não é judeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: não me envergonho
  rationale: Expressa de modo natural a ideia de sentir vergonha ou recuar por causa da desonra, preservando a postura pública e confiante de Paulo.
- source_word: εὐαγγέλιον
  choice: boas-novas
  rationale: Comunica de maneira transparente o sentido lexical de uma notícia boa e salvadora; a alternativa tradicional «evangelho» é registrada em nota.
- source_word: δύναμις
  choice: poder
  rationale: É o equivalente corrente e adequado para a ação eficaz de Deus que conduz à salvação.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Preserva a orientação ou o resultado expresso por εἰς em português moderno e natural.
- source_word: παντὶ τῷ πιστεύοντι
  choice: de todo aquele que crê
  rationale: Mantém tanto o alcance distributivo de παντί quanto a força verbal do particípio πιστεύοντι.
- source_word: Ἰουδαίῳ
  choice: judeu
  rationale: No contraste histórico-religioso com Ἕλληνι, «judeu» é mais apropriado que uma designação meramente geográfica.
- source_word: πρῶτον
  choice: primeiro
  rationale: Conserva de forma concisa a prioridade indicada no texto sem explicar ou reduzir sua tensão histórico-salvífica.
- source_word: Ἕλληνι
  choice: grego
  rationale: Preserva a palavra específica do texto grego, enquanto uma nota esclarece que, neste contexto, ela pode ter alcance mais amplo.
- source_word: τε ... καί
  choice: e também
  rationale: Reflete naturalmente a adição do segundo grupo após a prioridade atribuída ao primeiro.
theological_decisions:
- issue: Sentido de Ἕλληνι em «primeiro do judeu e também do grego»
  choice: «grego» no texto principal, com o sentido possivelmente mais amplo explicado em nota
  alternative: «gentio» no texto principal
  rationale: A opção mantém transparência lexical e a forma histórica do contraste paulino, sem excluir o uso representativo de «grego» para os não judeus em geral.
- issue: Relação sintática de δύναμις θεοῦ com τὸ εὐαγγέλιον
  choice: retomar «boas-novas» com o pronome «elas»
  alternative: usar a construção nominal «pois é poder de Deus»
  rationale: O pronome explicita em português o sujeito subentendido na oração grega sem alterar a afirmação de que as boas-novas são o poder de Deus para a salvação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. «Boas-novas» mantém transparência semântica; «evangelho» aparece como alternativa tradicional. A formulação preserva a repetição causal de γάρ por meio de «pois» e «porque», bem como a prioridade não explicada de «primeiro».
