  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: pt
  text: difamadores, os que odeiam a Deus[a], insolentes, arrogantes, presunçosos, inventores de males, desobedientes aos pais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “odiados por Deus”.'
    reason: Leitura alternativa possível de θεοστυγεῖς.
lexical_decisions:
- source_word: καταλάλους
  choice: difamadores
  rationale: O termo designa pessoas que falam contra outros de modo malicioso e prejudicial à reputação. “Difamadores” é claro, atual e preserva a força ética do grego.
- source_word: θεοστυγεῖς
  choice: os que odeiam a Deus
  rationale: A leitura ativa descreve de maneira direta uma atitude humana e se encaixa naturalmente na lista de vícios. A possível leitura passiva é preservada em nota.
- source_word: ὑβριστάς
  choice: insolentes
  rationale: Expressa uma atitude arrogante, ofensiva e abusiva sem limitar o sentido à violência física.
- source_word: ὑπερηφάνους
  choice: arrogantes
  rationale: Comunica com naturalidade a exaltação indevida de si mesmo e mantém distinção em relação ao termo seguinte.
- source_word: ἀλαζόνας
  choice: presunçosos
  rationale: O termo se refere a pessoas jactanciosas e pretensiosas; “presunçosos” preserva esse sentido e evita repetição com “arrogantes”.
- source_word: ἐφευρετὰς κακῶν
  choice: inventores de males
  rationale: Tradução vívida e próxima do grego para pessoas que concebem novas formas de praticar o mal.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: desobedientes aos pais
  rationale: Representa de forma direta e idiomática o adjetivo com dativo, preservando o foco relacional da expressão.
theological_decisions:
- issue: Sentido de θεοστυγεῖς
  choice: 'Leitura ativa: “os que odeiam a Deus”'
  alternative: 'Leitura passiva: “odiados por Deus”'
  rationale: A leitura ativa harmoniza-se melhor com a sequência de atitudes e condutas humanas. Como a forma grega admite uma interpretação passiva historicamente discutida, essa possibilidade é mantida em nota, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura concisa da lista grega foi mantida, bem como a vírgula final que liga o fragmento ao versículo seguinte.
