id: ROM.1.18
reference: Romans 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: pt
  text: Pois a ira de Deus está sendo revelada do céu contra toda a impiedade e injustiça das pessoas que suprimem a verdade pela injustiça[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é revelada”.'
    reason: lexical_alternative
  - marker: b
    text: “Suprimem” também pode ser traduzido por “reprimem” ou “mantêm contida”, neste contexto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “na injustiça”. A expressão grega pode indicar o meio pelo qual a verdade é suprimida ou a esfera em que isso ocorre.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: está sendo revelada
  rationale: Reproduz o presente passivo e torna perceptível o aspecto em curso, sem excluir a possibilidade de um presente mais geral.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do conector no argumento de Paulo de maneira natural e digna em português.
- source_word: ὀργὴ θεοῦ
  choice: a ira de Deus
  rationale: Preserva a construção genitiva e a força pessoal e judicial de ὀργή, sem suavizá-la para uma consequência impessoal.
- source_word: ἀπ’ οὐρανοῦ
  choice: do céu
  rationale: Expressa de modo direto a origem celeste indicada pela preposição.
- source_word: πᾶσαν ἀσέβειαν
  choice: toda a impiedade
  rationale: Impiedade comunica irreverência e oposição a Deus e é uma equivalência estabelecida e compreensível para ἀσέβεια.
- source_word: ἀδικίαν
  choice: injustiça
  rationale: Conserva a dimensão moral e relacional de ἀδικία em linguagem corrente; o termo é repetido para refletir a repetição grega.
- source_word: ἀνθρώπων
  choice: das pessoas
  rationale: O substantivo é genérico e se refere a seres humanos, não especificamente a homens do sexo masculino.
- source_word: τῶν ... κατεχόντων
  choice: que suprimem
  rationale: No contexto, κατέχω descreve conter ou impedir a atuação da verdade; “suprimem” comunica esse sentido com clareza.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: Tradução direta, sem restringir indevidamente o alcance do termo.
- source_word: ἐν ἀδικίᾳ
  choice: pela injustiça
  rationale: 'Interpreta ἐν como meio ou modo: a injustiça é o meio pelo qual a verdade é suprimida. A leitura locativa ou esférica continua registrada em nota.'
theological_decisions:
- issue: Se ὀργὴ θεοῦ deve ser suavizada como consequência moral impessoal
  choice: “a ira de Deus”, como resposta do próprio Deus
  alternative: uma consequência impessoal do mal
  rationale: A construção grega e o desenvolvimento do argumento paulino favorecem uma resposta divina pessoal e judicial; a tradução mantém esse peso sem acrescentar uma explicação doutrinária ao versículo.
- issue: A função de ἐν em ἐν ἀδικίᾳ
  choice: 'meio ou modo: “pela injustiça”'
  alternative: 'esfera ou condição: “na injustiça”'
  rationale: O uso instrumental é natural no contexto, mas a forma grega admite a leitura de esfera; a alternativa é preservada em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição de “injustiça” presente no grego, apesar de sua aspereza retórica, e evita linguagem marcada por uma tradição denominacional específica.
