id: ROM.1.27
reference: Romans 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: pt
  text: Da mesma forma, também os machos[a], depois de abandonarem o uso natural da fêmea[b], inflamaram-se de desejo uns pelos outros[c]; machos praticando com machos o que é vergonhoso e recebendo em si mesmos a retribuição devida por seu erro[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os homens”; o grego emprega aqui um termo marcado pelo sexo: “machos”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “as relações naturais com a mulher”. A expressão grega diz literalmente “o uso natural da fêmea” e funciona como referência eufemística às relações sexuais.
    reason: lexical_clarification
  - marker: c
    text: Ou “arderam de desejo uns pelos outros”; também se pode entender “arderam de paixão uns pelos outros”.
    reason: lexical_alternative
  - marker: d
    text: Ou “a pena correspondente por seu desvio”. “Retribuição” indica um retorno ou consequência correspondente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: machos / da fêmea
  rationale: Preserva os termos gregos marcados pelo sexo e sua contraposição deliberada, sem substituí-los silenciosamente pelos termos relacionais mais comuns “homens” e “mulher”.
- source_word: ἀφέντες
  choice: depois de abandonarem
  rationale: Expressa com clareza que a ação do particípio antecede a ação principal e mantém a ideia de deixar para trás.
- source_word: φυσικὴν χρῆσιν
  choice: o uso natural
  rationale: Reflete de perto a formulação eufemística do grego. O contexto indica o sentido sexual, mas a tradução evita explicitação maior que a do texto-fonte.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: inflamaram-se em seu desejo
  rationale: Conserva a imagem verbal de fogo e traduz ὄρεξις como “desejo”, sem intensificá-lo obrigatoriamente para “luxúria”.
- source_word: εἰς ἀλλήλους
  choice: uns pelos outros
  rationale: É uma forma recíproca natural em português e mantém a direção mútua do desejo.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: machos com machos
  rationale: Mantém a repetição enfática e a linguagem sexualmente marcada do original.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: praticando o que é vergonhoso
  rationale: Preserva a avaliação moral expressa pelo substantivo sem acrescentar ao ato um rótulo técnico ausente do grego.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: a retribuição devida
  rationale: Mantém a noção de retorno correspondente e do que era devido ou apropriado, sem restringir o termo apenas à ideia jurídica de pena.
- source_word: τῆς πλάνης αὐτῶν
  choice: por seu erro
  rationale: “Erro” comunica de modo conciso o sentido contextual de πλάνη, que também pode evocar desvio ou extravio.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: recebendo em si mesmos
  rationale: Conserva a força reflexiva da expressão e não especifica além do texto a natureza ou o modo dessa recepção.
theological_decisions:
- issue: Se os termos sexualmente marcados devem ser suavizados para linguagem relacional
  choice: machos ... da fêmea ... machos com machos
  alternative: homens ... da mulher ... homens com homens
  rationale: O grego emprega ἄρσην e θῆλυς, não os substantivos relacionais mais habituais para homem e mulher. A opção principal preserva essa escolha retórica, enquanto a nota registra a alternativa portuguesa mais idiomática.
- issue: Se a avaliação moral deve ser explicitada com uma categoria moderna
  choice: praticando o que é vergonhoso
  alternative: praticando atos homossexuais
  rationale: ἀσχημοσύνη contém avaliação moral, mas não emprega uma categoria moderna de identidade ou uma expressão técnica. A tradução conserva a força moral sem ampliar a formulação.
- issue: Se ἀντιμισθία deve ser traduzido diretamente como pena
  choice: retribuição devida
  alternative: pena correspondente
  rationale: “Retribuição” preserva a ideia de retorno ou consequência correspondente; “devida” representa ἣν ἔδει. A alternativa mais explicitamente punitiva fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção deliberadamente incomum “machos ... fêmea” conserva a marcação sexual do grego; as notas oferecem formas mais idiomáticas sem apagar a escolha lexical do original. O ponto e vírgula organiza a longa frase sem romper sua unidade argumentativa.
