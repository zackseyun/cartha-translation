base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: pt
  text: 'A todos os que estão em Roma, amados por Deus e chamados santos[a]: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor Jesus, o Messias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamados a ser santos”, “santos por chamado” ou “chamados santos”. O grego traz dois adjetivos e não inclui literalmente “a ser”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: A todos os que estão em Roma
  rationale: Reproduz naturalmente o destinatário no dativo, preservando tanto a abrangência de πᾶσιν quanto a localização.
- source_word: ἀγαπητοῖς θεοῦ
  choice: amados por Deus
  rationale: Mantém a força adjetival e relacional da expressão em português claro e corrente.
- source_word: κλητοῖς ἁγίοις
  choice: chamados para serem santos
  rationale: Expressa em português idiomático a relação entre os dois adjetivos gregos; a nota registra a construção mais literal e sua ambiguidade.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Graça e paz a vocês
  rationale: Preserva a fórmula paulina, sua ressonância teológica e o plural de ὑμῖν em linguagem amplamente compreensível.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: da parte de Deus, nosso Pai
  rationale: A locução “da parte de” indica naturalmente a origem da saudação; a vírgula apresenta “nosso Pai” como aposição sem alterar o sentido.
- source_word: κυρίου Ἰησοῦ Χριστοῦ
  choice: do Senhor Jesus, o Messias
  rationale: “Senhor” preserva a força cristológica de κύριος, e “o Messias” traduz o valor titular de Χριστός em português idiomático.
theological_decisions:
- issue: Relação sintática e semântica em κλητοῖς ἁγίοις
  choice: chamados para serem santos
  alternative: chamados santos; santos por chamado
  rationale: O grego emprega dois adjetivos e não contém um infinitivo equivalente a “serem”. Contudo, “chamados para serem santos” comunica com clareza a leitura tradicional e natural em português, enquanto a nota preserva a forma mais estrita e a possível nuance de identidade ou vocação.
- issue: Tradução de Χριστοῦ como título
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός conserva aqui seu valor titular. Traduzir por “o Messias” torna esse sentido transparente, sem negar a forma tradicional indicada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “a vocês” para marcar naturalmente o plural. A pontuação favorece clareza sem enfraquecer a estrutura da saudação paulina. As notas preservam a ambiguidade de κλητοῖς ἁγίοις e a alternativa tradicional para Χριστός.
