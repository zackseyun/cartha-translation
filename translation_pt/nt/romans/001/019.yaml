source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: pt
  text: porque o que se pode conhecer acerca de Deus é evidente entre eles[a], pois Deus lhes tornou isso evidente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «neles» ou «dentro deles».
    reason: Leitura alternativa possível para ἐν αὐτοῖς.
lexical_decisions:
- source_word: διότι
  choice: porque
  rationale: Introduz a razão da afirmação anterior e mantém com clareza a relação causal.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: o que se pode conhecer acerca de Deus
  rationale: O adjetivo neutro substantivado pode expressar aquilo que é conhecível; «acerca de Deus» comunica naturalmente o provável sentido objetivo do genitivo.
- source_word: φανερόν
  choice: evidente
  rationale: Expressa aquilo que está manifesto ou claramente acessível e permite preservar a relação lexical com ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: Adota o sentido coletivo ou público adequado ao contexto, sem excluir em nota a possibilidade de localização interior.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: pois Deus lhes tornou isso evidente
  rationale: Mantém a explicação introduzida por γάρ e reproduz a ligação entre φανερόν e ἐφανέρωσεν em português natural.
theological_decisions:
- issue: Sentido de ἐν αὐτοῖς
  choice: entre eles
  alternative: neles / dentro deles
  rationale: A expressão grega é genuinamente ambígua. O texto principal adota o sentido coletivo ou público, enquanto a nota preserva a possível referência interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de «evidente» preserva deliberadamente a correspondência entre o adjetivo φανερόν e o verbo ἐφανέρωσεν.
