lexical_decisions:
- source_word: ἀσυνέτους
  choice: sem entendimento
  rationale: Expressa a falta de compreensão e discernimento moral indicada pelo adjetivo grego, sem sugerir mera deficiência intelectual.
- source_word: ἀσυνθέτους
  choice: desleais
  rationale: Comunica de modo natural a falta de fidelidade a acordos e compromissos; a alternativa mais explícita é preservada em nota.
- source_word: ἀστόργους
  choice: sem afeição natural
  rationale: Torna explícita a ausência de στοργή, isto é, da afeição própria dos vínculos familiares, sem reduzir o termo à falta genérica de bondade.
- source_word: ἀνελεήμονας
  choice: sem misericórdia
  rationale: Equivale diretamente à ausência de misericórdia ou compaixão e mantém o paralelismo conciso da lista.
