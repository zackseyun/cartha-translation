id: ROM.1.25
reference: Romans 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: pt
  text: Eles trocaram a verdade de Deus pela mentira e reverenciaram e serviram a criação em vez do Criador, que é bendito para sempre. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Eles
  rationale: Retoma naturalmente, em português, as pessoas mencionadas no contexto anterior, sem sobrecarregar a frase com uma oração relativa.
- source_word: μετήλλαξαν
  choice: trocaram
  rationale: Expressa de modo direto a ideia de substituir uma coisa por outra.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: a verdade de Deus
  rationale: 'Preserva a construção genitiva e sua possível amplitude: a verdade acerca de Deus ou a verdade que procede dele.'
- source_word: ἐν τῷ ψεύδει
  choice: pela mentira
  rationale: Traduz idiomaticamente o contraste definido entre a verdade de Deus e a falsidade; o artigo grego é preservado em sentido definido.
- source_word: ἐσεβάσθησαν
  choice: reverenciaram
  rationale: Distingue o ato de prestar reverência religiosa do serviço cultual expresso pelo verbo seguinte.
- source_word: ἐλάτρευσαν
  choice: serviram
  rationale: Mantém o sentido de serviço religioso ou cultual sem fundir este verbo com o anterior.
- source_word: τῇ κτίσει
  choice: a criação
  rationale: Abrange aquilo que foi criado, em contraste explícito com o Criador.
- source_word: παρὰ τὸν κτίσαντα
  choice: em vez do Criador
  rationale: 'No contexto, παρά marca preferência ou substituição: a criação recebe o que pertence ao Criador.'
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: bendito para sempre
  rationale: Formulação portuguesa digna e natural para uma doxologia permanente.
- source_word: ἀμήν
  choice: Amém
  rationale: Transliteração tradicional e amplamente compreendida da confirmação litúrgica.
theological_decisions:
- issue: Distinção entre reverência e serviço cultual
  choice: reverenciaram e serviram
  alternative: adoraram e serviram
  rationale: A tradução mantém distintos os dois verbos gregos, evitando reduzir ambos a um único conceito, ao mesmo tempo que conserva o caráter religioso da ação.
- issue: Sentido de παρά no contraste criação/Criador
  choice: em vez do Criador
  alternative: mais do que o Criador
  rationale: O contexto de troca e idolatria favorece a ideia de substituição, embora a construção também possa ter nuance comparativa.
- issue: Alcance do genitivo em 'verdade de Deus'
  choice: preservar 'de Deus'
  alternative: a verdade sobre Deus
  rationale: A formulação literal conserva a ambiguidade genuína entre verdade acerca de Deus e verdade pertencente ou procedente de Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva o paralelismo e o contraste retórico do grego, sem acrescentar explicações confessionais.
