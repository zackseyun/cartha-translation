id: ROM.1.24
reference: Romans 1:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: pt
  text: Por isso, Deus os entregou, nos desejos de seus corações, à impureza, para a desonra de seus corpos entre si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre eles”; possivelmente, “neles mesmos”.
    reason: A expressão grega ἐν αὐτοῖς é compacta e pode ser entendida em sentido recíproco, coletivo ou reflexivo.
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Expressa a inferência decorrente do argumento anterior em português natural.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Preserva a ideia forte de entregar alguém a um poder ou condição, sem acrescentar uma explicação doutrinária como “abandonou”.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: nos desejos do coração deles
  rationale: Mantém a preposição e apresenta os desejos interiores como a esfera em que ocorre a entrega divina, sem reduzir antecipadamente ἐπιθυμίαις a desejos exclusivamente sexuais.
- source_word: ἀκαθαρσίαν
  choice: impureza
  rationale: Termo atual e digno que comunica impureza moral sem tom arcaico.
- source_word: τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν
  choice: para a desonra de seus corpos
  rationale: A construção nominal conserva de perto o infinitivo passivo grego e evita determinar rigidamente se a relação é de propósito ou resultado.
- source_word: ἐν αὐτοῖς
  choice: entre si
  rationale: Representa de modo conciso a provável dimensão recíproca ou social da expressão, enquanto a nota registra outras possibilidades.
theological_decisions:
- issue: Se παρέδωκεν deve ser ampliado para uma formulação como “Deus os abandonou judicialmente”
  choice: Deus os entregou
  alternative: Deus os abandonou; Deus os julgou entregando-os
  rationale: A tradução mantém o peso da ação divina no texto sem introduzir uma formulação sistemática que o grego não explicita.
- issue: Se τοῦ ἀτιμάζεσθαι deve ser definido exclusivamente como propósito ou como resultado
  choice: para a desonra de seus corpos
  alternative: para que seus corpos fossem desonrados; de modo que seus corpos fossem desonrados
  rationale: A formulação nominal preserva a tensão semântica da construção infinitiva e não resolve indevidamente a relação como apenas propósito ou apenas consequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Coração” preserva a linguagem antropológica bíblica; “entre si” mantém concisão e a nota explicita a ambiguidade genuína.
