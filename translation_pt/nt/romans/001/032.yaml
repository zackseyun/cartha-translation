id: ROM.1.32
reference: Romans 1:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: pt
  text: Eles, embora conheçam o justo decreto[a] de Deus — que os que praticam tais coisas merecem a morte —, não somente as fazem, mas também aprovam os que as praticam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justa ordenança”, “justa exigência” ou “justo juízo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Eles
  rationale: Retoma naturalmente, em português, as pessoas descritas no contexto anterior. Evita a construção isolada e pouco fluente com “os quais”, sem perder a ligação relativa com o antecedente.
- source_word: δικαίωμα
  choice: justo decreto
  rationale: Expressa tanto o caráter justo quanto a força jurídica e moral da determinação de Deus, esclarecida pela oração seguinte sobre merecer a morte.
- source_word: ἐπιγνόντες
  choice: embora conheçam
  rationale: 'A forma concessiva explicita a relação contextual: eles agem assim apesar de conhecerem o decreto de Deus. “Conheçam” comunica reconhecimento consciente sem exagerar o valor lexical.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: os que praticam tais coisas
  rationale: “Praticam” comunica conduta reiterada ou característica e mantém a formulação abrangente de “tais coisas”.
- source_word: ἄξιοι θανάτου
  choice: merecem a morte
  rationale: É uma expressão portuguesa direta e natural que preserva a força judicial da afirmação grega.
- source_word: ποιοῦσιν
  choice: as fazem
  rationale: Retoma de modo claro “tais coisas” e preserva a distinção verbal entre ποιέω e πράσσω.
- source_word: συνευδοκοῦσιν
  choice: aprovam
  rationale: Comunica consentimento e endosso, não apenas concordância passiva ou participação.
- source_word: τοῖς πράσσουσιν
  choice: os que as praticam
  rationale: Mantém o sentido de conduta praticada e o paralelismo com a expressão anterior.
theological_decisions:
- issue: Sentido de “merecem a morte”
  choice: Apresentar a expressão como veredito judicial divino sem definir além do que o versículo declara.
  alternative: Entendê-la especificamente como pena de morte civil ou ampliá-la explicitamente para a morte escatológica.
  rationale: O texto afirma que essas pessoas merecem a morte, mas não delimita aqui toda a extensão dessa morte. A tradução conserva o peso teológico e judicial sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concessiva é natural, os travessões destacam a explicação do decreto, e a repetição de “praticam” preserva o paralelismo do grego.
