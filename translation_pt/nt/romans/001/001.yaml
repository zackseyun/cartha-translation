  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a slave of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: pt
  text: Paulo, escravo[a] do Messias[b] Jesus, apóstolo chamado[c], separado para o evangelho de Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”.
    reason: Alternativa lexical para δοῦλος.
  - marker: b
    text: Ou “Cristo”.
    reason: Alternativa tradicional para Χριστός.
  - marker: c
    text: Ou “chamado como apóstolo”.
    reason: A construção grega κλητὸς ἀπόστολος é compacta; “apóstolo chamado” preserva sua forma predicativa sem explicitar “para ser”.
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a relação de pertença e sujeição expressa pelo termo grego; “servo” é uma alternativa possível, mas pode atenuar essa força.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Mantém a ordem do grego e traduz Χριστός como título messiânico, em vez de apenas transliterá-lo.
- source_word: κλητὸς ἀπόστολος
  choice: chamado para ser apóstolo
  rationale: Expressa em português natural o valor predicativo da construção, embora “para ser” torne explícita uma relação apenas implícita no grego.
- source_word: ἀφωρισμένος
  choice: separado
  rationale: Conserva o sentido passivo participial e a ideia de alguém destinado ou reservado para uma finalidade.
- source_word: εἰς
  choice: para
  rationale: Indica de modo conciso a finalidade ou destinação da separação de Paulo.
- source_word: εὐαγγέλιον θεοῦ
  choice: o evangelho de Deus
  rationale: Reproduz de perto a construção genitiva grega e preserva o termo teológico corrente “evangelho”.
theological_decisions:
- issue: Sentido de δοῦλος na autodesignação de Paulo
  choice: escravo
  alternative: servo
  rationale: “Escravo” comunica com maior nitidez a pertença e submissão implicadas no grego, sem negar que “servo” seja uma tradução tradicional possível.
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo conserva seu valor titular; “Messias” torna esse sentido transparente, enquanto “Cristo” é a forma eclesiástica tradicional.
- issue: Relação sintática em κλητὸς ἀπόστολος
  choice: chamado para ser apóstolo
  alternative: apóstolo chamado; chamado como apóstolo
  rationale: A formulação escolhida é natural e clara em português, mas a nota registra que o grego é mais compacto e não contém literalmente “para ser”.
translation_notes:
  register: Português moderno, digno e acessível, com cadência adequada ao início de uma carta. A opção “Messias Jesus” é deliberadamente menos convencional que “Cristo Jesus”, pois explicita o título presente no grego. A vírgula final foi mantida porque o versículo continua sintaticamente nos versículos seguintes.
