  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: pt
  text: Em primeiro lugar, agradeço ao meu Deus, por meio de Jesus, o Messias, por todos vocês, porque a fé[a] de vocês está sendo anunciada no mundo inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou fidelidade; também possivelmente confiança.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Em primeiro lugar
  rationale: Marca o início do desenvolvimento de Paulo; μὲν funciona como partícula discursiva e é absorvido naturalmente na expressão portuguesa.
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: agradeço ao meu Deus
  rationale: Preserva o sentido direto de ação de graças e o tom devocional pessoal do possessivo.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: διά com genitivo expressa mediação; Χριστός é vertido pelo sentido do título, enquanto as vírgulas tornam clara a aposição em português.
- source_word: περὶ πάντων ὑμῶν
  choice: por todos vocês
  rationale: Neste contexto de agradecimento, περί é expresso idiomaticamente por 'por'.
- source_word: ἡ πίστις ὑμῶν
  choice: a fé que vocês têm
  rationale: Mantém 'fé' como sentido principal de πίστις e evita a possível leitura possessiva segundo a qual a fé pertenceria aos destinatários como propriedade; 'fidelidade' e 'confiança' continuam possíveis e são registradas em nota.
- source_word: καταγγέλλεται
  choice: está sendo anunciada
  rationale: Preserva a voz passiva e o aspecto presente de uma divulgação em curso.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: no mundo inteiro
  rationale: Expressão portuguesa natural para o amplo alcance retórico indicado pelo grego.
theological_decisions:
- issue: Tradução de Χριστοῦ em διὰ Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Traduz o significado do título Χριστός em vez de apenas conservar sua forma tradicional transliterada, sem alterar a referência cristológica.
- issue: Sentido de πίστις em ἡ πίστις ὑμῶν
  choice: fé
  alternative: fidelidade; confiança
  rationale: Neste contexto, 'fé' expressa melhor a resposta crente dos romanos, mas o campo semântico também permite os matizes 'fidelidade' e 'confiança', preservados em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Vocês' reproduz de modo inequívoco o plural ὑμῶν. A construção 'Jesus, o Messias' trata 'o Messias' como título em aposição.
