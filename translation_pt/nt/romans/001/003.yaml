  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: pt
  text: a respeito de seu Filho, que veio da descendência[a] de Davi segundo a carne[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da semente de Davi”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “segundo a carne” se refere à linhagem humana ou descendência terrena, não à natureza pecaminosa.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: a respeito de
  rationale: Introduz o conteúdo do evangelho mencionado no contexto anterior e conserva o tom formal da frase paulina.
- source_word: υἱοῦ
  choice: Filho
  rationale: O referente é o Filho de Deus; a inicial maiúscula esclarece a referência em português sem acrescentar conteúdo lexical.
- source_word: γενομένου
  choice: veio
  rationale: O particípio de γίνομαι expressa aqui origem ou procedência. “Veio” preserva sua força verbal sem reduzir a frase a uma simples fórmula genealógica.
- source_word: σπέρματος
  choice: descendência
  rationale: Embora signifique literalmente “semente”, no contexto indica a linhagem davídica. “Descendência” comunica isso com clareza em português moderno, enquanto a alternativa literal é registrada em nota.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: κατὰ σάρκα
  choice: segundo a carne
  rationale: Mantém a expressão paulina deliberadamente densa e o termo teologicamente relevante σάρξ, sem substituí-lo por uma interpretação explicativa no texto principal.
theological_decisions:
- issue: Relação entre a filiação divina e a descendência davídica
  choice: Manter lado a lado “seu Filho” e “veio da descendência de Davi segundo a carne”.
  alternative: Explicitar “quanto à sua natureza humana” ou reduzir a frase a “era descendente de Davi”.
  rationale: O texto afirma simultaneamente a filiação e a verdadeira origem humana e davídica, sem explicar metafisicamente essa relação. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe compacta adequada à continuidade da frase iniciada nos versículos anteriores. “Segundo a carne” conserva o registro bíblico e a ambiguidade controlada do original.
