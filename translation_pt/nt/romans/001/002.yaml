  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: pt
  text: o qual ele havia prometido de antemão por meio dos seus profetas nas Santas Escrituras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em escritos santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: o qual
  rationale: Pronome relativo neutro singular que retoma “evangelho” em Romanos 1:1; “o qual” mantém claramente a ligação sintática com o antecedente.
- source_word: προεπηγγείλατο
  choice: havia prometido de antemão
  rationale: Preserva tanto a força de promessa do verbo quanto o sentido temporal do prefixo προ-, e o mais-que-perfeito expressa com naturalidade em português a anterioridade em relação à ação principal do contexto.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, indica mediação ou agência; “por meio de” comunica essa relação com clareza.
- source_word: τῶν προφητῶν αὐτοῦ
  choice: dos seus profetas
  rationale: Tradução direta que identifica os profetas como pertencentes a Deus e como os agentes humanos da promessa anterior.
- source_word: ἐν
  choice: nas
  rationale: 'Mantém o sentido locativo: a promessa está registrada nas Escrituras, sem excluir a relação estreita entre a atuação dos profetas e esses escritos.'
- source_word: γραφαῖς ἁγίαις
  choice: Santas Escrituras
  rationale: No contexto paulino, γραφαί normalmente designa escritos reconhecidos como Escritura; a expressão portuguesa consagrada é clara, digna e natural. A alternativa lexical mais literal é preservada em nota.
theological_decisions:
- issue: Se γραφαῖς ἁγίαις deve ser traduzido como “Santas Escrituras” ou “escritos santos”
  choice: Santas Escrituras
  alternative: escritos santos; escritos sagrados
  rationale: O uso paulino de γραφαί favorece a referência às Escrituras reconhecidas, e não a escritos religiosos em geral. A nota conserva a possibilidade de uma tradução lexical mais literal sem enfraquecer o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Havia prometido de antemão” torna explícita a anterioridade presente no verbo grego; “por meio de” evita possível ambiguidade de “por”. O marcador [a] aparece no texto principal imediatamente após a expressão a que se refere.
