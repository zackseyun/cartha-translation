  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: pt
  text: isto é, para que eu seja encorajado junto com vocês, por meio da fé que compartilhamos — a de vocês e a minha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que sejamos encorajados juntos”. O verbo grego expressa encorajamento mútuo; o contexto, porém, favorece Paulo como sujeito explícito da explicação.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: isto é
  rationale: Introduz uma explicação do propósito expresso no contexto anterior, com formulação natural e clara em português.
- source_word: συμπαρακληθῆναι
  choice: para que [...] sejamos encorajados juntos
  rationale: O verbo composto expressa encorajamento compartilhado, não uma ação unilateral. A forma plural torna explícita em português a reciprocidade entre Paulo e os destinatários, embora o infinitivo grego, por si só, não marque número nem pessoa.
- source_word: ἐν ὑμῖν
  choice: estando entre vocês
  rationale: 'Expressa a esfera social em que ocorre o encorajamento: no meio dos cristãos de Roma.'
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: pela fé uns dos outros
  rationale: Preserva tanto a ideia de meio introduzida por διά quanto a reciprocidade de ἐν ἀλλήλοις, sem reduzir a expressão simplesmente a uma fé genérica compartilhada.
- source_word: πίστεως
  choice: fé
  rationale: Neste contexto, refere-se à fé de Paulo e dos cristãos romanos, não primariamente à fidelidade.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: tanto a de vocês como a minha
  rationale: Mantém o equilíbrio enfático entre a fé dos destinatários e a de Paulo.
theological_decisions:
- issue: Se o encorajamento é unilateral ou recíproco
  choice: Encorajamento recíproco entre Paulo e os cristãos romanos
  alternative: Paulo é encorajado entre eles, ainda que o processo envolva a fé de ambas as partes
  rationale: O elemento συν- do verbo e a expressão final “tanto a de vocês como a minha” apontam para participação mútua; a tradução evita apresentar o ministério apostólico como exclusivamente unilateral.
- issue: Sujeito implícito do infinitivo συμπαρακληθῆναι
  choice: 'Plural inclusivo: “sejamos”'
  alternative: 'Singular contextual: “eu seja encorajado junto com vocês”'
  rationale: O infinitivo grego não indica pessoa ou número. O plural inclusivo comunica com naturalidade a ação conjunta, enquanto a leitura singular contextual é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para os destinatários plurais. A ordem foi levemente ajustada para fluência, e o travessão destaca a explicação final sem eliminar a ambiguidade do grego.
