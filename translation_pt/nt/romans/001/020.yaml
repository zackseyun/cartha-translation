id: ROM.1.20
reference: Romans 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: pt
  text: Pois os seus atributos invisíveis[a] — isto é, seu poder eterno e sua divindade[b] — são vistos claramente desde a criação do mundo, sendo compreendidos por meio das coisas criadas, de modo que eles não têm desculpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas invisíveis a respeito dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “natureza divina”. O termo grego aqui é θειότης, não o termo mais forte θεότης.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: os seus atributos invisíveis
  rationale: O neutro plural designa aquilo que não se vê a respeito de Deus. “Atributos” explicita naturalmente essa referência em português, enquanto a nota preserva a formulação mais concreta do grego.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: desde a criação do mundo
  rationale: “Desde” expressa com naturalidade o ponto inicial temporal indicado por ἀπό.
- source_word: τοῖς ποιήμασιν
  choice: por meio das coisas criadas
  rationale: 'O dativo tem sentido instrumental: as obras da criação são o meio pelo qual se compreende o que é invisível em Deus.'
- source_word: νοούμενα
  choice: sendo compreendidos
  rationale: 'Preserva o aspecto mental ou racional da percepção: o invisível é discernido a partir das coisas criadas.'
- source_word: καθορᾶται
  choice: são vistos claramente
  rationale: Traduz o presente passivo e a força intensiva do verbo, indicando uma realidade contínua desde a criação.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: seu poder eterno
  rationale: A expressão explica o conteúdo dos atributos invisíveis; “eterno” traduz de modo claro e digno ἀΐδιος.
- source_word: θειότης
  choice: divindade
  rationale: “Divindade” comunica qualidade ou natureza divina sem apagar a distinção lexical entre θειότης e o termo mais forte θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: de modo que eles não têm desculpa
  rationale: A construção é entendida como resultado. A formulação preserva a força direta de ἀναπολογήτους em português corrente.
theological_decisions:
- issue: Tradução de θειότης sem intensificar indevidamente a afirmação de Paulo
  choice: divindade
  alternative: natureza divina
  rationale: O texto afirma que a criação torna perceptível uma qualidade verdadeiramente divina de Deus. “Divindade” mantém essa afirmação sem equiparar θειότης de maneira automática ao termo mais forte θεότης.
- issue: Valor de εἰς τὸ εἶναι
  choice: 'resultado: “de modo que eles não têm desculpa”'
  alternative: 'propósito: “para que eles não tenham desculpa”'
  rationale: Neste contexto, a construção descreve naturalmente o resultado da revelação de Deus por meio da criação, sem precisar afirmar que deixá-los sem desculpa seja o propósito exclusivo dela.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência, mantendo a relação explicativa entre os atributos invisíveis, o poder eterno e a divindade. Os marcadores [a] e [b] aparecem no texto principal.
