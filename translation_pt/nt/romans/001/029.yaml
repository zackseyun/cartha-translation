lexical_decisions:
- source_word: πεπληρωμένους
  choice: estão cheios
  rationale: Expressa de modo natural o estado resultante indicado pelo particípio perfeito passivo, sem a rigidez de «tendo sido enchidos».
- source_word: πάσῃ
  choice: toda espécie de
  rationale: Com substantivos abstratos no singular, comunica idiomaticamente a abrangência do grego.
- source_word: ἀδικίᾳ
  choice: injustiça
  rationale: Termo corrente que abrange conduta moralmente errada e injusta; a nota registra a alternativa mais ampla «iniquidade».
- source_word: πονηρίᾳ
  choice: maldade
  rationale: Equivalente claro e abrangente para a qualidade moral má.
- source_word: πλεονεξίᾳ
  choice: ganância
  rationale: Comunica em português atual o desejo ávido de possuir cada vez mais.
- source_word: κακίᾳ
  choice: malícia
  rationale: Preserva uma nuance interpessoal e distingue o termo de πονηρία, traduzido como «maldade».
- source_word: μεστοὺς
  choice: repletos de
  rationale: Mantém a variação lexical do grego em relação a πεπληρωμένους e soa natural no registro da lista.
- source_word: φθόνου
  choice: inveja
  rationale: É o equivalente preciso e habitual para o vício de ressentir o bem alheio.
- source_word: φόνου
  choice: homicídio
  rationale: Conserva o peso moral da morte ilícita e é amplamente inteligível.
- source_word: ἔριδος
  choice: discórdia
  rationale: Expressa conflito e contenda de modo conciso e atual.
- source_word: δόλου
  choice: engano
  rationale: Traduz claramente a ideia de fraude ou dolo deliberado sem linguagem arcaica.
- source_word: κακοηθείας
  choice: perversidade
  rationale: Representa uma disposição maliciosa de caráter e evita repetir «malícia», embora os campos semânticos se sobreponham.
- source_word: ψιθυριστάς
  choice: murmuradores
  rationale: Preserva a imagem de falar em voz baixa contra outros; a nota esclarece os sentidos contextuais de fofoca e difamação secreta.
