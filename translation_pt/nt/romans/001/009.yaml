  source_fidelity: 'O texto reproduz com precisão a estrutura e o sentido do grego: γάρ é adequadamente vertido por “Pois”; Deus é apresentado como testemunha; λατρεύω mantém o sentido de serviço religioso em “sirvo”; “em meu espírito” preserva a formulação e a ambiguidade de ἐν τῷ πνεύματί μου; e “faço menção de vocês” representa bem μνείαν ὑμῶν ποιοῦμαι. “Continuamente” comunica adequadamente ἀδιαλείπτως sem impor a noção excessiva de atividade ininterrupta.'
  naturalness: A frase é clara, digna e natural em português moderno de ampla compreensão. A sequência “Pois Deus, a quem sirvo em meu espírito no evangelho de seu Filho, é minha testemunha...” é longa, mas é sintaticamente bem controlada e reflete apropriadamente o período solene de Paulo. O uso de “vocês” atende à legibilidade brasileira sem comprometer a compreensão internacional.
  terminology: “Evangelho”, “Filho”, “testemunha” e “sirvo” são escolhas consistentes, inteligíveis e teologicamente não tendenciosas. “Evangelho de seu Filho” conserva prudentemente a abertura semântica do genitivo grego, sem transformá-lo em “a respeito de” ou “proveniente de”.
