id: ROM.1.9
reference: Romans 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: pt
  text: Pois Deus, a quem sirvo em meu espírito no evangelho de seu Filho, é minha testemunha de que continuamente faço menção de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, faço menção de vocês em minhas orações; a frase continua no versículo 10.
    reason: clarificação_sintática
lexical_decisions:
- source_word: μάρτυς
  choice: testemunha
  rationale: No apelo solene de Paulo, o termo designa quem atesta a veracidade de sua declaração; “testemunha” é a correspondência natural em português.
- source_word: λατρεύω
  choice: sirvo
  rationale: O verbo pode indicar serviço religioso ou culto. “Sirvo” conserva o sentido de dedicação religiosa sem restringi-lo a um ato litúrgico.
- source_word: ἐν τῷ πνεύματί μου
  choice: em meu espírito
  rationale: Mantém de perto a construção grega e preserva a dimensão interior e pessoal do serviço de Paulo, sem decidir se ἐν indica esfera ou modo.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: no evangelho
  rationale: “Evangelho” é corrente e amplamente compreensível em português, além de manter a terminologia característica de Paulo; a expressão pode indicar a esfera em que ele serve.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: de seu Filho
  rationale: Reproduz o genitivo sem explicitar se o Filho é o conteúdo, a origem ou outra relação com o evangelho.
- source_word: ἀδιαλείπτως
  choice: continuamente
  rationale: Expressa a regularidade persistente indicada pelo advérbio sem sugerir necessariamente uma ação literalmente ininterrupta.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: faço menção de vocês
  rationale: Conserva o idioma grego de modo claro e evita interpretar μνεία como simples lembrança mental.
theological_decisions:
- issue: Relação de “seu Filho” com “evangelho”
  choice: evangelho de seu Filho
  alternative: evangelho a respeito de seu Filho
  rationale: A forma com “de” preserva a amplitude do genitivo grego e não determina se o Filho é principalmente o conteúdo ou a origem do evangelho.
- issue: Sentido de ἐν em “em meu espírito”
  choice: em meu espírito
  alternative: com meu espírito
  rationale: A tradução escolhida conserva a ambiguidade entre esfera e modo, evitando resolver a preposição exclusivamente como instrumento.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para o plural de segunda pessoa. A ordem foi mantida próxima do grego sem sacrificar a fluidez. O marcador [a] aparece no texto principal.
