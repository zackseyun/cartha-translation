id: ROM.1.11
reference: Romans 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: pt
  text: Pois desejo muito vê-los, para compartilhar com vocês algum dom espiritual[a], a fim de que vocês sejam fortalecidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algum dom do Espírito”.'
    reason: ambiguity
  - marker: b
    text: 'Ou: “para o fortalecimento de vocês”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: desejo muito
  rationale: Expressa o forte anseio pessoal do verbo grego em português atual, natural e digno.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o contexto anterior sem tornar a frase pesada.
- source_word: ἰδεῖν
  choice: ver
  rationale: Conserva o sentido direto do verbo; a ideia de visitar está implícita no contexto, mas não precisa ser acrescentada.
- source_word: ἵνα
  choice: para
  rationale: Introduz de modo idiomático a finalidade da visita desejada por Paulo.
- source_word: τι
  choice: algum
  rationale: Preserva a indefinição do grego e evita sugerir um dom específico.
- source_word: μεταδῶ
  choice: compartilhar com
  rationale: Comunica a ideia de fazer outros participarem de algo, de maneira mais natural em português do que “transmitir” ou “conferir”.
- source_word: χάρισμα
  choice: dom
  rationale: É a tradução concisa e corrente; o vínculo lexical com graça permanece implícito sem expansão interpretativa.
- source_word: πνευματικὸν
  choice: espiritual
  rationale: Preserva a amplitude do adjetivo grego sem decidir se se trata de um carisma específico, de um benefício espiritual mais amplo ou, de forma explícita, de um dom do Espírito.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: a fim de que vocês sejam fortalecidos
  rationale: Reproduz tanto a finalidade ou resultado pretendido quanto a voz passiva do infinitivo grego, em português claro.
theological_decisions:
- issue: Se “dom espiritual” designa um carisma específico ou um benefício espiritual mais amplo
  choice: algum dom espiritual
  alternative: algum dom do Espírito
  rationale: A expressão grega não exige um sentido técnico ou milagroso, nem identifica explicitamente o Espírito Santo como agente; a formulação escolhida conserva essa abertura interpretativa.
- issue: Quem efetua o fortalecimento
  choice: vocês sejam fortalecidos
  alternative: isso os fortaleça
  rationale: A voz passiva do grego não identifica expressamente o agente. Mantê-la evita afirmar que Paulo, o dom ou Deus é apresentado de modo explícito como aquele que fortalece.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” oferece clareza para o plural; “desejo muito” preserva a intensidade sem soar arcaico. A formulação mantém a indefinição de “algum”, a amplitude de “dom espiritual” e a voz passiva da oração final.
