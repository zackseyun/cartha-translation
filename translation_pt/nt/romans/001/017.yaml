source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: pt
  text: 'Pois nele se revela a justiça de Deus[a], de fé para fé[b], como está escrito: “O justo viverá pela fé.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a retidão de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão grega traduzida como “de fé para fé” é notoriamente difícil. Entre outras possibilidades estão: “da fé para a fé”, “pela fé, do começo ao fim” e “por meio da fé, para a fé”. A tradução principal preserva a repetição e as duas preposições sem resolver a ambiguidade.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “Aquele que é justo pela fé viverá”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou, traduzindo também a partícula grega: “Mas o justo viverá pela fé”.'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, “justiça” é o equivalente natural e tradicional de δικαιοσύνη e pode abranger tanto a qualidade de ser justo quanto a ação justa de Deus, sem impor uma interpretação específica.
- source_word: θεοῦ
  choice: de Deus
  rationale: Mantém transparente o genitivo grego, preservando a ambiguidade entre a justiça própria de Deus e a justiça associada a ele ou procedente dele.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: O pronome grego é neutro e retoma naturalmente “o evangelho” de Romanos 1:16; “nele” faz essa ligação de modo idiomático em português.
- source_word: ἀποκαλύπτεται
  choice: se revela
  rationale: Reproduz de maneira natural o presente passivo, sem definir excessivamente seu aspecto.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: de fé para fé
  rationale: Preserva as duas preposições e a repetição retórica do grego, mantendo aberta uma expressão reconhecidamente difícil e ambígua.
- source_word: δίκαιος
  choice: o justo
  rationale: Traduz naturalmente o adjetivo substantivado singular e conserva o caráter representativo da expressão.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: É uma formulação portuguesa natural para o valor modal ou instrumental da expressão, embora a ligação sintática permaneça discutível.
- source_word: ζήσεται
  choice: viverá
  rationale: Conserva com clareza o valor futuro e se ajusta ao registro digno da citação bíblica.
theological_decisions:
- issue: Sentido de δικαιοσύνη θεοῦ
  choice: a justiça de Deus
  alternative: a justiça que vem de Deus
  rationale: A construção genitiva é teologicamente densa e admite mais de uma relação. A tradução principal conserva sua forma sem decidir se se trata da justiça própria de Deus, de sua ação justa ou da justiça concedida por ele.
- issue: Sentido de ἐκ πίστεως εἰς πίστιν
  choice: de fé para fé
  alternative: pela fé, do começo ao fim
  rationale: A formulação principal mantém as preposições, a repetição e a tensão interpretativa do original, em vez de escolher entre leituras como progressão da fé, fidelidade de Deus para fé humana ou fé do início ao fim.
- issue: Ligação de ἐκ πίστεως na citação de Habacuque
  choice: O justo viverá pela fé
  alternative: Aquele que é justo pela fé viverá
  rationale: A ordem escolhida é natural e tradicional em português, mas a nota preserva a possibilidade de ligar “pela fé” a “justo”, em vez de a “viverá”.
- issue: Valor de δὲ na citação
  choice: omissão na tradução principal
  alternative: Mas o justo viverá pela fé
  rationale: Aqui δὲ não precisa expressar contraste forte; omiti-lo evita sugerir oposição indevida ao argumento precedente, enquanto a alternativa formal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e a cadência argumentativa de Paulo. “Justiça de Deus” e “de fé para fé” preservam deliberadamente ambiguidades relevantes do grego; as notas oferecem alternativas sem inserir uma solução doutrinária no texto principal.
