id: ROM.1.10
reference: Romans 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: pt
  text: sempre em minhas orações, pedindo que, de algum modo, finalmente, pela vontade de Deus, eu consiga[a] ir até vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu tenha o caminho favorecido” ou “eu faça uma viagem bem-sucedida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: Mantém de forma direta a ênfase na prática constante de Paulo.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: em minhas orações
  rationale: É a formulação idiomática e natural em português para indicar aquilo que Paulo inclui regularmente em suas orações.
- source_word: δεόμενος
  choice: pedindo
  rationale: Expressa uma súplica dirigida a Deus sem tornar a formulação desnecessariamente intensa; o contexto de oração deixa claro o caráter da petição.
- source_word: εἴ πως
  choice: que, de algum modo
  rationale: Preserva tanto o desejo quanto a incerteza sobre como a visita poderá acontecer.
- source_word: ἤδη ποτὲ
  choice: finalmente
  rationale: Comunica a expectativa antiga de Paulo de que a oportunidade enfim se concretize, sem produzir uma combinação pouco natural em português.
- source_word: εὐοδωθήσομαι
  choice: eu consiga
  rationale: No contexto do infinitivo 'ir', comunica naturalmente a ideia de obter êxito ou ter o caminho favorecido, evitando a possível conotação financeira de 'prosperar'.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: pela vontade de Deus
  rationale: Apresenta a vontade divina como a condição e o meio determinante para a viagem desejada.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: ir até vocês
  rationale: Reproduz claramente o movimento em direção aos destinatários sem acrescentar a noção mais específica de uma visita.
theological_decisions:
- issue: Relação entre o planejamento de Paulo e a vontade de Deus
  choice: pela vontade de Deus
  alternative: dentro da vontade de Deus
  rationale: A tradução conserva a dependência do êxito em relação à vontade divina, sem definir além do texto como essa vontade opera.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A ordem conserva o caráter de continuação sintática do versículo anterior. O marcador foi colocado junto a “consiga”, termo ao qual a alternativa lexical se refere.
