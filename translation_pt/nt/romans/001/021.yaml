id: ROM.1.21
reference: Romans 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: pt
  text: Pois, embora conhecessem a Deus, não o glorificaram como Deus nem lhe deram graças, mas tornaram-se fúteis em seus raciocínios[a], e seu coração insensato foi obscurecido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “pensamentos” ou “especulações”.
    reason: lexical_alternative
  - marker: b
    text: No grego, “coração” está no singular e é usado coletivamente para a interioridade deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Pois
  rationale: Introduz a razão explicativa da afirmação anterior e preserva com naturalidade a ligação lógica no início da frase.
- source_word: γνόντες τὸν θεὸν
  choice: embora conhecessem a Deus
  rationale: 'O particípio aoristo tem força concessiva no contexto: apesar de conhecerem a Deus, não reagiram de modo correspondente. A formulação portuguesa explicita essa relação sem ampliar o sentido do verbo.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: não o glorificaram como Deus
  rationale: Mantém tanto o peso de δοξάζω quanto a ideia de não reconhecerem, em sua resposta, a condição própria de Deus.
- source_word: ἢ ηὐχαρίστησαν
  choice: nem lhe deram graças
  rationale: Expressa de maneira corrente e digna o ato de manifestar gratidão; o pronome explicita em português o objeto entendido no grego.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca claramente o forte contraste com a falta de glorificação e gratidão, adequando a pontuação à fluidez do português.
- source_word: ἐματαιώθησαν
  choice: tornaram-se fúteis
  rationale: Comunica o resultado expresso pelo passivo sem impor um agente ou uma causalidade que o texto não explicita.
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: em seus raciocínios
  rationale: διαλογισμοί pode indicar raciocínios, pensamentos ou especulações. “Raciocínios” preserva o aspecto de atividade mental e deliberativa.
- source_word: ἐσκοτίσθη
  choice: foi obscurecido
  rationale: Conserva a voz passiva e a metáfora de obscurecimento moral e intelectual.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: seu coração insensato
  rationale: “Insensato” comunica a falta de entendimento de ἀσύνετος sem reduzir a expressão a deficiência intelectual. O singular coletivo “coração” representa a interioridade deles.
theological_decisions:
- issue: Força concessiva de γνόντες
  choice: embora conhecessem a Deus
  alternative: tendo conhecido a Deus; quando conheceram a Deus
  rationale: 'O contraste imediato favorece a leitura concessiva: havia conhecimento de Deus, mas ele não foi acompanhado de glorificação nem gratidão. Essa formulação preserva a tensão do texto sem definir além dele a natureza ou a extensão desse conhecimento.'
- issue: Agência no obscurecimento e na futilidade
  choice: manter formulações que não identificam o agente
  alternative: Deus tornou fúteis os seus raciocínios e obscureceu o seu coração
  rationale: As formas gregas são passivas, mas o agente não é expresso neste versículo. A tradução evita acrescentá-lo e deixa aberta a relação entre consequência, juízo e responsabilidade humana.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dar graças”, “glorificar” e “coração” conservam o registro bíblico reconhecível sem arcaísmo excessivo; “pelo contrário” torna explícito o contraste de modo natural.
