lexical_decisions:
- source_word: φάσκοντες
  choice: Afirmando
  rationale: O particípio presente expressa a alegação que fazem a respeito de si mesmos. “Afirmando” é natural em português e conserva a força irônica do texto.
- source_word: εἶναι
  choice: ser
  rationale: O infinitivo introduz o conteúdo da afirmação e é traduzido diretamente por “ser”.
- source_word: σοφοὶ
  choice: sábios
  rationale: Mantém de forma concisa o adjetivo predicativo e prepara o contraste retórico com “tolos”.
- source_word: ἐμωράνθησαν
  choice: tornaram-se tolos
  rationale: Expressa o resultado ingressivo do verbo e preserva o contraste forte e simétrico entre “sábios” e “tolos”, sem explicitar uma causa ou agente que o grego não identifica.
theological_decisions:
- issue: Se ἐμωράνθησαν deve indicar uma qualidade moral ou designar as pessoas de modo mais incisivo
  choice: tornaram-se tolos
  alternative: tornaram-se insensatos
  rationale: 'A formulação nominal conserva a antítese contundente de Paulo: embora afirmassem ser sábios, tornaram-se tolos. Ela não acrescenta uma explicação doutrinária ao texto.'
- issue: Se a forma verbal deve ser entendida como passiva com agente implícito ou como mudança de estado
  choice: tornaram-se
  alternative: foram feitos tolos
  rationale: A tradução escolhida preserva a ambiguidade quanto à causa da mudança e evita introduzir um agente não expresso no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem compacta e o paralelismo entre “sábios” e “tolos” preservam a ironia do original.
