  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: pt
  text: Assim, da minha parte, estou disposto a anunciar as boas-novas também a vocês que estão em Roma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pregar o evangelho também a vocês que estão em Roma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Funciona como conector conclusivo ou inferencial com o contexto anterior; “Assim” é natural e preserva essa ligação.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: da minha parte, estou disposto
  rationale: A expressão grega é elíptica e idiomática. Esta formulação comunica prontidão e vontade pessoal sem reproduzir de modo artificial a estrutura grega.
- source_word: καὶ ὑμῖν
  choice: também a vocês
  rationale: Mantém explícita a inclusão dos destinatários em Roma entre aqueles a quem Paulo deseja anunciar as boas-novas.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: que estão em Roma
  rationale: Identifica naturalmente os destinatários, seguindo o artigo com a expressão preposicional do grego.
- source_word: εὐαγγελίσασθαι
  choice: anunciar as boas-novas
  rationale: Expressa o sentido de comunicar uma boa notícia, especialmente o evangelho, sem restringir a ação à pregação formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A colocação de “também” preserva sua ligação com os destinatários. O marcador foi posto no fim da frase para remeter à alternativa de tradução da expressão verbal.
