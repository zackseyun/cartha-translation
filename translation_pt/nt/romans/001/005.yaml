  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: pt
  text: Por meio de quem recebemos graça e apostolado para a obediência da fé[a] entre todas as nações[b], por causa do nome dele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a obediência que vem da fé” ou “a obediência que consiste na fé”.
    reason: alternative_reading
  - marker: b
    text: Ou “entre todos os gentios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: διά com genitivo indica mediação; a formulação mantém a ligação relativa com Jesus Cristo no contexto anterior.
- source_word: ἐλάβομεν
  choice: recebemos
  rationale: Preserva a primeira pessoa do plural do aoristo grego, sem decidir se o plural é retórico, corporativo ou inclui outros.
- source_word: χάριν καὶ ἀποστολὴν
  choice: graça e apostolado
  rationale: Mantém os dois substantivos coordenados, sem fundi-los em uma única ideia; “apostolado” expressa o encargo e a função de apóstolo.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: para a obediência da fé
  rationale: “Para” expressa finalidade ou objetivo, e a construção formal “obediência da fé” preserva a ambiguidade do genitivo.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: entre todas as nações
  rationale: ἔθνη pode designar nações ou gentios; “nações” conserva o alcance amplo, enquanto a alternativa é registrada em nota.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: por causa do nome dele
  rationale: Expressa motivo e finalidade em português corrente, preservando a ideia bíblica de agir em favor da honra e reputação associadas ao nome de Jesus.
theological_decisions:
- issue: Sentido de ὑπακοὴν πίστεως
  choice: a obediência da fé
  alternative: a obediência que vem da fé; a obediência que consiste na fé
  rationale: O genitivo é sintaticamente condensado e admite mais de uma relação semântica. A tradução principal mantém essa tensão, e a nota apresenta as principais expansões interpretativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue as expressões a que se referem; todos os marcadores são vinculados no texto principal.
