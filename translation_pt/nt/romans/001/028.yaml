source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: pt
  text: E, como não consideraram adequado manter Deus em seu conhecimento[a], Deus os entregou a uma mente inadequada, para fazerem o que não convém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhecer Deus”.
    reason: lexical_alternative
  - marker: b
    text: “Inadequada” traduz uma palavra relacionada a “consideraram adequado” no início do versículo, preservando o jogo de palavras de Paulo; também pode ser traduzida por “reprovada” ou “corrompida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Preserva a comparação expressa por καθὼς e sua ligação com a correspondência entre a recusa humana e o ato judicial de Deus, sem reduzir o termo a uma relação exclusivamente causal.
- source_word: ἐδοκίμασαν
  choice: consideraram apropriado
  rationale: Comunica a ideia de avaliar e aprovar como adequado. Também permite que a nota explicite a relação lexical com ἀδόκιμον.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: reconhecer Deus
  rationale: Expressa em português natural a disposição de manter Deus no âmbito do conhecimento e do reconhecimento consciente. A formulação mais literal é preservada em nota.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Mantém o sentido judicial do verbo repetido no contexto, sem acrescentar uma explicação teológica ao texto.
- source_word: ἀδόκιμον νοῦν
  choice: uma mente reprovada
  rationale: Indica uma mente que não passa na avaliação ou prova e conserva, tanto quanto possível em português, o eco de ἐδοκίμασαν. Evita intensificar o termo para uma formulação doutrinariamente mais carregada como “mente depravada”.
- source_word: ποιεῖν
  choice: para fazerem
  rationale: Representa o infinitivo como propósito ou resultado da entrega, mantendo aberta essa nuance sintática.
- source_word: τὰ μὴ καθήκοντα
  choice: o que não convém
  rationale: Tradução direta e idiomática do que é impróprio ou não adequado, sem especificar atos que o grego deixa gerais.
theological_decisions:
- issue: A força de ἀδόκιμον νοῦν no juízo divino
  choice: uma mente reprovada
  alternative: uma mente corrompida; uma mente depravada
  rationale: “Reprovada” reflete a ideia lexical de não passar na avaliação e preserva a ligação com a recusa anterior, sem importar uma formulação doutrinária mais forte do que o adjetivo exige.
- issue: A relação entre a recusa humana e a entrega por Deus
  choice: assim como
  alternative: visto que; porque
  rationale: A tradução mantém a correspondência formulada por καθὼς. O contexto admite uma implicação causal, mas o texto principal não a torna exclusiva.
- issue: Propósito ou resultado em ποιεῖν
  choice: para fazerem
  alternative: de modo que fizessem
  rationale: A construção portuguesa conserva a possibilidade de propósito ou resultado, sem resolver de maneira rígida a função do infinitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Reconhecer Deus” evita uma construção excessivamente literal e pouco natural, enquanto a nota conserva a imagem do original. “Mente reprovada” é deliberadamente mais formal, mas inteligível e útil para preservar o eco lexical do grego.
