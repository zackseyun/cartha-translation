id: ROM.1.4
reference: Romans 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: pt
  text: e foi declarado Filho de Deus com poder[a], segundo o Espírito de santidade[b], pela ressurreição dentre os mortos — Jesus, o Messias, nosso Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi designado” ou “foi estabelecido Filho de Deus com poder”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo o Espírito Santo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: foi declarado
  rationale: O particípio de ὁρίζω pode significar determinar, designar ou declarar. “Foi declarado” é natural em português e, no contexto, evita afirmar explicitamente que Jesus só então se tornou Filho, sem apagar a força pública da ressurreição. As alternativas principais ficam registradas em nota.
- source_word: υἱοῦ θεοῦ
  choice: Filho de Deus
  rationale: Tradução direta do título cristológico, em formulação consagrada e clara no português atual.
- source_word: ἐν δυνάμει
  choice: com poder
  rationale: “Com poder” é mais idiomático em português do que “em poder” e preserva a ligação ambígua da expressão, que pode caracterizar a condição ou manifestação do Filho.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: segundo o Espírito de santidade
  rationale: Mantém a formulação incomum e a correspondência com “segundo a carne” do versículo anterior, sem decidir de modo indevido se a referência é especificamente ao Espírito Santo ou à esfera espiritual de santidade.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: pela ressurreição dentre os mortos
  rationale: “Pela” expressa de modo natural a base ou o meio associado à declaração; “dentre os mortos” conserva a formulação plural e o sentido de saída do meio dos mortos.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Aqui Χριστός funciona como título ligado a Jesus; “o Messias” comunica seu sentido em português de maneira natural.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente usual de κύριος e preserva sua ressonância cristológica na linguagem paulina.
theological_decisions:
- issue: Se ὁρισθέντος implica que Jesus somente se tornou Filho de Deus na ressurreição
  choice: “foi declarado Filho de Deus com poder”
  alternative: “foi designado” ou “foi estabelecido Filho de Deus com poder”
  rationale: A redação preserva a relação entre filiação, poder e ressurreição sem afirmar que a filiação de Jesus começou naquele momento. A nota conserva as principais possibilidades lexicais.
- issue: Se πνεῦμα ἁγιωσύνης se refere especificamente ao Espírito Santo
  choice: “segundo o Espírito de santidade”
  alternative: “segundo o Espírito Santo” ou “segundo seu espírito santo”
  rationale: A expressão grega é incomum e admite mais de uma compreensão. A tradução formalmente transparente preserva essa abertura, enquanto a nota apresenta a leitura mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas segue sua ocorrência no texto; a pontuação com dois-pontos introduz naturalmente a identificação final de Jesus.
