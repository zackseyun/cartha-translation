  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: pt
  text: Por isso, Deus os entregou a paixões desonrosas, pois até as mulheres entre eles[a] trocaram as relações naturais[b] pelo que é contrário à natureza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “as fêmeas deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “o uso natural”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o que é contra a natureza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Conector causal natural em português, que liga o versículo ao argumento anterior e preserva o sentido de consequência.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Mantém o sentido de entregar alguém a algo, sem explicitar além do texto a natureza ou as consequências desse ato.
- source_word: πάθη ἀτιμίας
  choice: paixões desonrosas
  rationale: Reproduz a avaliação moral de ἀτιμία sem intensificá-la nem suavizá-la; “paixões” preserva a força de πάθη.
- source_word: θήλειαι αὐτῶν
  choice: as mulheres entre eles
  rationale: “Mulheres” é natural para pessoas humanas; “entre eles” expressa αὐτῶν sem sugerir necessariamente que se trate das esposas dos homens mencionados.
- source_word: μετήλλαξαν
  choice: trocaram
  rationale: Expressa de modo claro a substituição deliberada indicada pelo verbo.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: as relações naturais
  rationale: No contexto sexual, “relações” comunica naturalmente o sentido de χρῆσις, enquanto a alternativa literal “uso” é preservada em nota.
- source_word: τὴν παρὰ φύσιν
  choice: o que é contrário à natureza
  rationale: Conserva a construção grega e sua força avaliativa, sem acrescentar categorias modernas não presentes no texto.
theological_decisions:
- issue: Preservação da avaliação moral do texto sem explicação doutrinária adicional
  choice: “paixões desonrosas” e “contrário à natureza”
  alternative: Suavizar para “desejos impróprios” ou ampliar com uma categoria sexual moderna específica
  rationale: O grego contém avaliação explícita, que deve ser mantida; ao mesmo tempo, a tradução não deve definir mais precisamente do que Paulo nem inserir terminologia posterior.
- issue: Sentido de “natural” e “natureza”
  choice: Manter a linguagem de natureza sem explicar seu fundamento
  alternative: Explicar “natureza” como biologia, convenção social, ordem criada ou função corporal
  rationale: O versículo não explicita aqui qual dimensão de φύσις está em primeiro plano; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita que “suas mulheres” seja entendida automaticamente como “suas esposas”, mantém a avaliação do original e registra em notas as alternativas mais literais.
