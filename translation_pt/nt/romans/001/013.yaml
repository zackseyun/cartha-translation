id: ROM.1.13
reference: Romans 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: pt
  text: Não quero, porém, que vocês desconheçam, irmãos,[a] que muitas vezes planejei ir até vocês — mas até agora fui impedido —, a fim de obter algum fruto[b] também entre vocês, assim como entre os demais gentios.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”.
    reason: lexical_alternative
  - marker: b
    text: “Fruto” refere-se aqui aos resultados do ministério de Paulo entre eles.
    reason: cultural_note
  - marker: c
    text: Ou “as demais nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Não quero ... que desconheçam
  rationale: Preserva a formulação negativa de Paulo e a estrutura do grego, usando português atual e claro, sem convertê-la silenciosamente em “quero que saibam”.
- source_word: δὲ
  choice: porém
  rationale: Expressa a leve transição ou contraste introduzido pela partícula, sem acrescentar uma ideia temporal ausente do original.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém no texto a forma masculina plural do vocativo grego; uma nota esclarece que, no uso comunitário, o termo pode abranger irmãos e irmãs.
- source_word: πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς
  choice: muitas vezes planejei ir até vocês
  rationale: Comunica com naturalidade as repetidas intenções anteriores de Paulo, mantendo explicitamente o movimento em direção aos destinatários.
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: até agora fui impedido
  rationale: Mantém a voz passiva e o limite temporal, sem identificar a causa do impedimento, que o texto não declara aqui.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: a fim de obter algum fruto
  rationale: Conserva a metáfora agrícola de καρπός e deixa que o contexto indique os resultados esperados do ministério.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: É a forma idiomática de indicar fruto no meio da comunidade romana, sem sugerir necessariamente uma experiência apenas interior.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: os demais gentios
  rationale: No contexto da missão paulina, ἔθνη designa mais naturalmente os não judeus; “demais” preserva λοιποί e inclui os romanos no campo mais amplo dessa missão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” adequado à legibilidade brasileira. Os travessões marcam a observação parentética sobre o impedimento sem alterar a relação sintática da frase. A metáfora de “fruto” e a ambiguidade lexical de ἔθνη foram preservadas e esclarecidas em notas.
