source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: pt
  text: Por isso, assim como o pecado entrou no mundo por meio de um só homem, e a morte veio por meio do pecado, assim também a morte se estendeu a todas as pessoas, porque[a] todas pecaram—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “em quem todos pecaram”.'
    reason: Registra a leitura representativa ou incorporativa historicamente associada a ἐφ’ ᾧ, preservando uma alternativa teologicamente significativa.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Marca de modo natural e conciso a transição inferencial a partir do argumento anterior.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: por meio de um só homem
  rationale: Preserva o valor mediador de διά com o genitivo e a referência tipológica a Adão como figura masculina representativa.
- source_word: ἡ ἁμαρτία
  choice: o pecado
  rationale: Mantém o termo paulino padrão sem acrescentar uma explicação não expressa no grego.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: entrou no mundo
  rationale: Expressa de maneira idiomática a direção indicada por εἰς.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: e a morte veio por meio do pecado
  rationale: 'Torna explícito em português o verbo elíptico, preservando o paralelo: o pecado entrou por meio de um homem, e a morte veio por meio do pecado.'
- source_word: οὕτως
  choice: assim também
  rationale: Sinaliza a correspondência e a consequência dentro da comparação iniciada por ὥσπερ.
- source_word: εἰς πάντας ἀνθρώπους
  choice: a todas as pessoas
  rationale: Comunica a referência inclusiva à humanidade inteira em português contemporâneo.
- source_word: ὁ θάνατος διῆλθεν
  choice: a morte se estendeu
  rationale: Comunica o movimento e o alcance universal de διέρχομαι sem sugerir apenas uma passagem transitória.
- source_word: ἐφ’ ᾧ
  choice: porque
  rationale: Adota o sentido causal mais natural no contexto, mantendo em nota a leitura representativa tradicional.
- source_word: πάντες ἥμαρτον
  choice: todas pecaram
  rationale: O pretérito perfeito corresponde ao aoristo ἥμαρτον e concorda naturalmente com “todas as pessoas”.
theological_decisions:
- issue: O sentido de ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Leitura causal: “porque todas pecaram”'
  alternative: 'Leitura representativa ou incorporativa: “em quem todas pecaram”'
  rationale: A construção admite debate histórico e teológico. O texto principal apresenta o sentido causal mais provável no contexto, enquanto a nota conserva a leitura tradicional sem impor ao versículo uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Um só homem” preserva a força tipológica de Adão; “todas as pessoas” comunica inclusão genérica. O travessão final mantém a frase sintaticamente aberta, como no texto grego.
