id: ROM.5.18
reference: Romans 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: pt
  text: Portanto, assim como, por uma só transgressão, veio a condenação para todas as pessoas, assim também, por um só ato justo, veio para todas as pessoas a justificação que traz vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «para justificação de vida».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Portanto
  rationale: Expressa de modo natural e digno a força inferencial da combinação grega, sem a redundância pouco idiomática de «portanto, pois».
- source_word: παραπτώματος
  choice: transgressão
  rationale: Designa um ato concreto de violação e mantém o contraste com o único ato justo, sem ampliar o termo para a noção mais geral de pecado.
- source_word: κατάκριμα
  choice: condenação
  rationale: Preserva a força judicial do termo e o paralelo paulino entre a consequência do ato de Adão e a do ato de Cristo.
- source_word: δικαιώματος
  choice: ato justo
  rationale: Neste paralelismo, o singular aponta para um ato decisivo de justiça; «ato justo» é claro e natural em português, sem especificar no texto qual aspecto da obra de Cristo está em vista.
- source_word: δικαίωσιν ζωῆς
  choice: a justificação que traz vida
  rationale: Torna inteligível a relação compacta do genitivo grego, mantendo juntas as dimensões judicial e vivificadora da expressão.
- source_word: πάντας ἀνθρώπους
  choice: todas as pessoas
  rationale: Comunica o alcance humano inclusivo da expressão grega e repete exatamente a mesma formulação nas duas metades do contraste.
theological_decisions:
- issue: Se a segunda ocorrência de «todas as pessoas» deve ser restringida para evitar uma aparente abrangência universal
  choice: Manter «todas as pessoas» nas duas metades, sem limitação interpretativa.
  alternative: «todos os que creem» ou «todos os justificados» na segunda metade
  rationale: O grego repete a mesma expressão em ambos os lados da comparação. Acrescentar uma restrição resolveria na tradução uma tensão teológica que deve ser interpretada à luz do contexto mais amplo, não eliminada do versículo.
- issue: Como entender o genitivo em δικαίωσιν ζωῆς
  choice: «a justificação que traz vida»
  alternative: «justificação de vida»
  rationale: A tradução principal explicita uma relação provável e idiomática entre justificação e vida, enquanto a nota preserva a forma mais literal e a possível abertura semântica do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela «assim como... assim também» foi preservada, e «veio» foi suprido nas duas orações nominais para produzir uma frase natural sem acrescentar um agente não expresso no grego.
