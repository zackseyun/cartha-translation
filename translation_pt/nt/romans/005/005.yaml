  source_fidelity: O texto traduz com fidelidade a estrutura e o sentido do grego. «A esperança não nos deixa envergonhados» preserva adequadamente o campo de vergonha/desonra de καταισχύνει, sem reduzir o verbo à ideia mais ampla de decepção. «Foi derramado» representa de modo aceitável o perfeito ἐκκέχυται em português natural, e «por meio do Espírito Santo» reproduz corretamente o valor mediador de διά com genitivo.
