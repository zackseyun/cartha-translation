id: ROM.5.5
reference: Romans 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: pt
  text: E a esperança não nos deixa envergonhados[a], porque o amor de Deus[b] foi derramado em nossos corações por meio do Espírito Santo, que nos foi dado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não decepciona”.
    reason: lexical_alternative
  - marker: b
    text: Ou, menos provavelmente, “nosso amor por Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: a esperança
  rationale: Tradução direta e natural; o artigo português corresponde adequadamente ao uso genérico do artigo grego.
- source_word: δέ
  choice: E
  rationale: Representa a conexão leve com o contexto sem introduzir um contraste mais forte do que o grego exige.
- source_word: καταισχύνει
  choice: não nos deixa envergonhados
  rationale: Preserva o núcleo semântico de vergonha e honra, tornando explícito em português o objeto humano subentendido; a alternativa idiomática é registrada em nota.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  rationale: Mantém formalmente a construção genitiva e sua tensão interpretativa; no contexto, o sentido mais provável é o amor de Deus por nós.
- source_word: ἐκκέχυται
  choice: foi derramado
  rationale: Expressa de modo natural em português a ação consumada do perfeito grego; o contexto sustenta seu resultado presente.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: em nossos corações
  rationale: Reproduz o plural do grego de maneira clara e idiomática.
- source_word: διὰ πνεύματος ἁγίου
  choice: por meio do Espírito Santo
  rationale: Comunica o valor instrumental de διά com genitivo e identifica naturalmente o referente pessoal divino.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: que nos foi dado
  rationale: A oração relativa retoma o Espírito Santo e preserva a voz passiva e o destinatário do particípio grego.
theological_decisions:
- issue: Sentido do genitivo em ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus, entendido principalmente como o amor de Deus por nós
  alternative: nosso amor por Deus
  rationale: A explicação seguinte — esse amor derramado nos corações por meio do Espírito — favorece o genitivo subjetivo, mas a construção grega admite formalmente a outra leitura, preservada em nota.
- issue: Valor de καταισχύνει
  choice: não nos deixa envergonhados
  alternative: não decepciona
  rationale: A escolha mantém em primeiro plano a dimensão de vergonha pública ou desonra, sem excluir a ideia contextual de que a esperança não fracassa nem decepciona.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a imagem concreta de vergonha, o plural “corações” e a ambiguidade genuína de “amor de Deus”, sem impor uma leitura denominacional.
