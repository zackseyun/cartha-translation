  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: pt
  text: 'Mas Deus demonstra o seu próprio amor por nós[a]: enquanto ainda éramos pecadores, o Messias[b] morreu por nós[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu próprio amor dirigido a nós”.
    reason: lexical_alternative
  - marker: b
    text: Grego Christós; tradicionalmente, “Cristo”. Aqui, o termo é traduzido como o título “Messias”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em nosso favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: demonstra
  rationale: O presente indica uma manifestação ativa e evidente; “demonstra” é claro, atual e preserva a força comprobatória do verbo.
- source_word: δὲ
  choice: Mas
  rationale: Assinala o contraste com o argumento anterior e introduz naturalmente a ação surpreendente de Deus.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: o seu próprio amor
  rationale: “Amor” traduz diretamente ἀγάπη, e “seu próprio” preserva a ênfase do reflexivo ἑαυτοῦ.
- source_word: εἰς ἡμᾶς
  choice: por nós
  rationale: Expressa de modo idiomático o amor de Deus dirigido a nós; a nota registra uma formulação que torna mais explícita essa direção.
- source_word: ὅτι
  choice: pelo fato de que
  rationale: Introduz o fato que manifesta o amor de Deus, preservando a relação explicativa sem reduzi-la apenas a uma causa.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: quando ainda éramos pecadores
  rationale: Converte o genitivo absoluto em uma oração temporal natural e mantém tanto ἔτι (“ainda”) como o substantivo “pecadores”.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Neste contexto paulino, Χριστός funciona como título cristológico; “o Messias” comunica seu sentido em português corrente.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Mantém o sentido amplo de benefício ou representação sem impor à preposição uma formulação específica de expiação.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Equivalente direto e suficiente do aoristo ἀπέθανεν.
theological_decisions:
- issue: Tradução de Χριστός no discurso paulino
  choice: o Messias
  alternative: Cristo
  rationale: O termo tem valor titular neste contexto. “O Messias” explicita seu sentido sem alterar a afirmação cristológica; a forma tradicional é registrada em nota.
- issue: Alcance de ὑπὲρ ἡμῶν
  choice: por nós
  alternative: em nosso favor; em nosso lugar
  rationale: A preposição afirma claramente que a morte do Messias ocorreu em relação benéfica a nós, mas o versículo isolado não exige que a tradução resolva entre nuances representativas, benefativas ou substitutivas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “pelo fato de que” preserva a função explicativa de ὅτι; a repetição de “por nós” reflete as duas expressões gregas distintas, cujas nuances são esclarecidas nas notas.
