  source_fidelity: 'O texto traduz com precisão a estrutura e o sentido central do grego: δὲ é adequadamente marcado por “Mas”; συνίστησιν pelo presente “demonstra”; ἑαυτοῦ recebe a ênfase de “próprio”; e ὑπὲρ ἡμῶν permanece, de modo prudentemente amplo, em “por nós”. A substituição de “quando” por “enquanto” representa melhor o valor temporal durativo/concessivo do genitivo absoluto ἔτι ἁμαρτωλῶν ὄντων ἡμῶν.'
  naturalness: “Pelo fato de que” é inteligível e fiel, mas soa excessivamente pesado em português bíblico moderno. Dois-pontos introduzem naturalmente o conteúdo explicativo de ὅτι sem perda de sentido. “Enquanto ainda éramos pecadores” é mais fluente e mais próximo de “while we were still sinners” do que “quando ainda éramos pecadores”.
  terminology: “O Messias” segue a decisão do projeto para Χριστός quando usado como título. “Amor”, “pecadores” e “por nós” são terminologia clara e teologicamente não sobre-especificada. As notas distinguem adequadamente a direção de εἰς ἡμᾶς e a amplitude de ὑπὲρ ἡμῶν.
