  naturalness: O português é claro e de registro apropriado. «Transbordaram sobre os muitos» é mais idiomático do que «transbordaram para os muitos» e comunica bem a força abundante de ἐπερίσσευσεν.
  terminology: «Transgressão», «dádiva», «graça», «os muitos» e «Messias» são escolhas defensáveis e coerentes com o grego e com o registro pretendido. A nota a deve ficar ancorada na expressão «pela graça», à qual se refere, não no fim do versículo.
