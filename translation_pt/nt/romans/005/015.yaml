id: ROM.5.15
reference: Romans 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: pt
  text: Mas a dádiva não é como a transgressão. Pois, se pela transgressão de um só os muitos morreram, muito mais a graça de Deus e a dádiva concedida pela graça[a] de um só homem, Jesus, o Messias[b], transbordaram sobre os muitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a dádiva na graça” / “a dádiva que veio pela graça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Jesus Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: transgressão
  rationale: Expressa um ato culpável e preserva a força moral do termo no contraste entre Adão e Cristo, sem recorrer a linguagem excessivamente técnica.
- source_word: χάρισμα
  choice: dádiva
  rationale: Mantém o contraste direto com a transgressão e comunica que se trata de algo concedido gratuitamente; a ideia de graça é explicitada na sequência.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: os muitos
  rationale: Preserva os artigos gregos e o contraste representativo entre um só e os muitos, sem resolver o alcance como 'todos'.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: a graça de Deus
  rationale: Reproduz com clareza a estrutura grega e sustenta o paralelismo com a dádiva ligada à graça.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: a dádiva concedida pela graça
  rationale: Entende ἐν em sentido instrumental ou associativo e verte a expressão em português natural. A nota registra uma alternativa mais próxima da forma grega.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: de um só homem
  rationale: Realça a oposição paulina entre um só e os muitos e identifica Jesus como o representante contrastado com Adão.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título messiânico ainda significativo no contraste entre Adão e Cristo; a forma tradicional é indicada em nota.
- source_word: ἐπερίσσευσεν
  choice: transbordaram
  rationale: Comunica vividamente a ideia de abundância excedente reforçada por 'muito mais'. O plural é exigido em português pelo sujeito composto 'a graça... e a dádiva', embora o grego empregue singular.
theological_decisions:
- issue: Alcance de 'os muitos' no paralelismo entre Adão e Cristo
  choice: Manter 'os muitos' nas duas ocorrências.
  alternative: Traduzir por 'todos' para explicitar um alcance representativo mais amplo.
  rationale: A formulação conserva a linguagem deliberada de um/muitos usada por Paulo e não antecipa uma conclusão teológica baseada no contexto mais amplo.
- issue: Relação entre a graça de Deus, a dádiva e a graça do único homem
  choice: Verter ἐν χάριτι instrumentalmente como 'concedida pela graça'.
  alternative: Traduzir mais literalmente como 'a dádiva na graça'.
  rationale: A construção grega admite nuance instrumental ou associativa. A tradução principal oferece português inteligível, enquanto a nota preserva a alternativa formal e a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O artigo em 'os muitos' e a repetição de 'graça' foram mantidos para preservar o paralelismo e a tensão do grego. A concordância verbal no plural segue o uso natural do português diante do sujeito composto.
