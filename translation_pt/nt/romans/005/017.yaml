id: ROM.5.17
reference: Romans 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: pt
  text: Pois, se, pela transgressão de um só, a morte reinou por meio de um só, muito mais os que recebem a abundância da graça e da dádiva da justiça[a] reinarão em vida por meio de um só[b], Jesus, o Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da retidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio de um só, Jesus Cristo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: transgressão
  rationale: Expressa uma violação ou passo em falso e se encaixa naturalmente no contraste entre Adão e Cristo, sem impor terminologia excessivamente técnica.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: reinou / reinarão
  rationale: Preserva a metáfora régia e o paralelismo deliberado entre o reinado da morte e o dos que recebem a graça.
- source_word: περισσείαν
  choice: abundância
  rationale: Comunica a ideia de medida excedente de modo natural e digno em português.
- source_word: χάριτος
  choice: graça
  rationale: É a tradução paulina estabelecida e abrange tanto favor quanto generosidade divina no contexto.
- source_word: δωρεᾶς
  choice: dádiva
  rationale: Distingue lexicalmente δωρεά de χάρις e ressalta o caráter concedido da justiça sem acrescentar ao grego.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Em português, “justiça” abrange a condição de estar em conformidade com o que é justo e evita a forma menos corrente “retidão”; a ambiguidade é preservada em nota.
- source_word: λαμβάνοντες
  choice: os que recebem
  rationale: O particípio caracteriza essas pessoas pelo recebimento contínuo ou definidor, expresso idiomaticamente no presente.
- source_word: ἐν ζωῇ
  choice: em vida
  rationale: Mantém a expressão grega concisa e o contraste direto com a morte.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Mantém o valor titular de Χριστός; com artigo em português, a expressão “Jesus, o Messias” é idiomática e clara.
theological_decisions:
- issue: Sentido de δικαιοσύνης na expressão paulina
  choice: dádiva da justiça
  alternative: dádiva da retidão
  rationale: “Justiça” preserva a amplitude forense e relacional do termo no contexto de Romanos, enquanto a nota registra a nuance de retidão sem decidir além do texto.
- issue: Identificação de τοῦ ἑνός nas duas metades do versículo
  choice: “desse um” na referência a Adão e “um só” na referência a Jesus
  alternative: “um só” em ambas as ocorrências
  rationale: A formulação reduz estranheza em português, mas conserva o contraste estrutural entre as duas figuras individuais sem inserir seus nomes onde o grego não os traz.
- issue: Valor de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A tradução explicita o título messiânico sem transformar a expressão em mera designação nominal; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o paralelismo do grego foram preservados na medida em que permanecem naturais; “muito mais” mantém a força do argumento a fortiori de Paulo.
