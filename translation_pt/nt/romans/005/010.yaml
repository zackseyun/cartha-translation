id: ROM.5.10
reference: Romans 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: pt
  text: Pois, se, quando éramos inimigos, fomos reconciliados com Deus por meio da morte de seu Filho, muito mais, tendo sido reconciliados, seremos salvos pela vida dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na vida dele”.'
    reason: Preserva a possível leitura locativa ou associativa de ἐν, em contraste com a leitura instrumental adotada no texto.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Preserva tanto a ligação argumentativa de γάρ (“pois”) quanto a forma condicional de εἰ (“se”), sem transformar explicitamente a premissa em afirmação causal.
- source_word: ἐχθροὶ ὄντες
  choice: quando éramos inimigos
  rationale: Expressa naturalmente em português o estado anterior indicado pelo particípio ὄντες e mantém o termo relacional forte “inimigos”.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: fomos reconciliados com Deus
  rationale: “Reconciliados” é o equivalente preciso de καταλλάσσω; em português, “com Deus” é a regência natural dessa construção e comunica a restauração da relação sem paráfrase excessiva.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: por meio da morte de seu Filho
  rationale: Representa διά com genitivo como meio e conserva a designação cristológica “seu Filho”.
- source_word: πολλῷ μᾶλλον
  choice: muito mais
  rationale: Mantém de forma concisa a força do argumento de maior razão empregado por Paulo.
- source_word: καταλλαγέντες
  choice: agora que fomos reconciliados
  rationale: Torna clara a anterioridade do particípio aoristo passivo em relação ao futuro σωθησόμεθα, com formulação corrente em português.
- source_word: σωθησόμεθα
  choice: seremos salvos
  rationale: Preserva diretamente o futuro passivo e a dimensão futura da salvação no argumento.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: pela vida dele
  rationale: Entende ἐν em sentido instrumental, coerente com o contraste entre a morte e a vida do Filho. “Dele” evita que o possessivo seja entendido como referência a Deus Pai, embora a alternativa locativa seja mantida em nota.
theological_decisions:
- issue: Sentido de ἐν τῇ ζωῇ αὐτοῦ
  choice: 'Instrumental: “pela vida dele”'
  alternative: 'Locativo ou associativo: “na vida dele”'
  rationale: 'O contraste imediato com “por meio da morte de seu Filho” favorece o sentido instrumental: a reconciliação ocorreu por meio da morte do Filho, e a salvação futura ocorre pela vida dele. A nota preserva a possibilidade locativa sem inserir uma referência explícita à ressurreição, ausente do texto.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “reconciliados” conserva a coesão lexical do grego. “Dele” identifica naturalmente a vida como a do Filho e evita a ambiguidade do possessivo “sua”.
