  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: pt
  text: No entanto, a morte reinou desde Adão até Moisés, até mesmo sobre os que não pecaram à semelhança da transgressão de Adão, que é figura[a] daquele que viria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tipo», «modelo» ou «prefiguração».
    reason: lexical_alternative
  - marker: b
    text: Ou «daquele que estava por vir». No contexto, a expressão se refere a Cristo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: No entanto
  rationale: Expressa o forte contraste com a afirmação anterior de modo natural e digno em português.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: a morte reinou
  rationale: Preserva a imagem de domínio régio e a personificação da morte empregadas por Paulo.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: desde Adão até Moisés
  rationale: Comunica com clareza o intervalo temporal indicado pela construção grega.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: até mesmo sobre os que não pecaram
  rationale: A preposição indica o alcance do reinado da morte, e «até mesmo» ressalta a extensão surpreendente desse domínio.
- source_word: ἐπὶ τῷ ὁμοιώματι
  choice: à semelhança
  rationale: Mantém a comparação do original sem definir de forma excessiva em que consiste precisamente a semelhança.
- source_word: παραβάσεως
  choice: transgressão
  rationale: Expressa adequadamente a ideia de violação de um mandamento ou limite estabelecido.
- source_word: τύπος
  choice: figura
  rationale: Em português bíblico corrente, «figura» comunica uma correspondência representativa e antecipadora sem exigir o tecnicismo «tipo».
- source_word: τοῦ μέλλοντος
  choice: daquele que estava por vir
  rationale: Reproduz o particípio substantivado e sua perspectiva futura em relação a Adão, sem inserir explicitamente o nome de Cristo no texto.
theological_decisions:
- issue: Referente de «daquele que estava por vir»
  choice: Manter a expressão indireta do grego, entendendo-a contextualmente como referência a Cristo.
  alternative: Traduzir explicitamente «Cristo» ou usar «aquele que viria».
  rationale: Romanos 5:12–21 identifica contextualmente Cristo como o correspondente futuro de Adão, mas o versículo emprega uma designação indireta; a tradução preserva essa forma e explica o referente em nota.
- issue: Natureza da correspondência entre Adão e aquele que viria
  choice: Traduzir τύπος por «figura».
  alternative: Usar «tipo», «modelo» ou «prefiguração».
  rationale: «Figura» conserva a relação tipológica sem especificar indevidamente todos os aspectos da correspondência, cuja tensão é desenvolvida nos versículos seguintes.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O período conserva a estrutura argumentativa de Paulo, a personificação da morte e a formulação indireta da referência a Cristo. Os marcadores foram posicionados junto às expressões que cada nota esclarece.
