source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: pt
  text: E não somente isso, mas também nos gloriamos[a] nas aflições[b], sabendo que a aflição produz perseverança[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exultamos” ou “nos alegramos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tribulações” ou “sofrimentos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “constância” ou “firmeza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: nos gloriamos
  rationale: Preserva o sentido básico de expressar confiança ou exultação, sem reduzir o termo apenas à alegria. Neste contexto, a glória está ligada à ação de Deus, não à vanglória pessoal.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Expressa de modo natural a ideia de pressões, angústias e sofrimentos; o plural do grego é mantido nesta oração.
- source_word: θλῖψις
  choice: aflição
  rationale: Mantém o singular grego na declaração geral, distinguindo-o das experiências plurais mencionadas antes.
- source_word: ὑπομονήν
  choice: perseverança
  rationale: Comunica persistência paciente e firme sob pressão em português corrente; 'resistência' também seria possível, mas pode sugerir sobretudo capacidade passiva.
- source_word: κατεργάζεται
  choice: produz
  rationale: Traduz com clareza o sentido causativo de realizar ou gerar um resultado.
- source_word: εἰδότες
  choice: sabendo
  rationale: Mantém a construção participial e não explicita além do texto se a relação é estritamente causal.
theological_decisions:
- issue: Sentido de καυχώμεθα em contexto espiritualmente positivo
  choice: nos gloriamos
  alternative: nos alegramos / exultamos
  rationale: A escolha preserva a tensão lexical entre gloriar-se e exultar. O contexto impede que se entenda necessariamente como orgulho autocentrado, mas a tradução não substitui o termo por uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a transição enfática, a alternância grega entre o plural 'aflições' e o singular genérico 'aflição', e a construção participial 'sabendo'.
