id: ROM.5.4
reference: Romans 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: pt
  text: e a perseverança produz caráter aprovado[a], e o caráter aprovado produz esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caráter comprovado”, “caráter posto à prova” ou “aprovação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: perseverança
  rationale: Expressa de modo natural e atual a constância que suporta as dificuldades, preservando a progressão iniciada no contexto anterior.
- source_word: δοκιμή
  choice: caráter aprovado
  rationale: Comunica uma qualidade pessoal que passou pela prova e se mostrou genuína, em vez de indicar apenas o processo de testar.
- source_word: ἐλπίς
  choice: esperança
  rationale: É o equivalente português direto e natural; no contexto paulino, denota expectativa fundamentada em Deus sem que seja necessário explicitar isso no texto.
- source_word: δὲ
  choice: e
  rationale: Aqui a partícula conecta etapas sucessivas, sem contraste forte; a conjunção mantém a fluidez da cadeia argumentativa.
- source_word: ellipsis of κατεργάζεται
  choice: produz
  rationale: O verbo é retomado por elipse do versículo anterior. Repeti-lo em português torna clara e natural a sequência de resultados.
theological_decisions:
- issue: Sentido de δοκιμή na sequência formada pelas provações
  choice: Uma qualidade de caráter comprovada por ter passado pela prova (“caráter aprovado”)
  alternative: O processo de prova; ou a aprovação resultante
  rationale: Como δοκιμή aparece como resultado da perseverança, a tradução destaca a qualidade que foi testada e se mostrou genuína, sem acrescentar uma formulação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perseverança” é mais idiomático que “resistência” neste contexto moral; “caráter aprovado” preserva o sentido resultativo de δοκιμή. A repetição de “produz” reproduz com clareza a cadeia retórica, embora o grego deixe o verbo subentendido.
