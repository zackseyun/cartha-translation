id: ROM.5.19
reference: Romans 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: pt
  text: Pois, assim como por meio da desobediência de um só homem os muitos foram feitos pecadores[a], assim também por meio da obediência de um só[b] os muitos serão feitos justos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram constituídos pecadores”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “de um só”; “homem” fica subentendido pela primeira parte do versículo.
    reason: source_clarity
  - marker: c
    text: Ou “serão constituídos justos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: desobediência
  rationale: Traduz diretamente a ideia de deixar de obedecer e preserva o contraste explícito com ὑπακοή.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: de um só homem
  rationale: É a forma natural em português de expressar o indivíduo único em contraste representativo com os muitos, apontando no contexto para Adão.
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: O adjetivo tem função predicativa e designa a condição dos muitos; “pecadores” é claro e corrente.
- source_word: κατεστάθησαν
  choice: foram feitos
  rationale: Expressa de modo natural que os muitos foram postos ou constituídos nessa condição, sem introduzir terminologia doutrinária mais estreita.
- source_word: οἱ πολλοί
  choice: os muitos
  rationale: Reproduz o artigo e conserva a formulação paulina, sem interpretar seu alcance como “todos” nem reduzi-la ao indefinido “muitos”.
- source_word: ὑπακοῆς
  choice: obediência
  rationale: É o equivalente natural e mantém o paralelo antitético com “desobediência”.
- source_word: τοῦ ἑνὸς
  choice: de um só
  rationale: Mantém a elipse do grego na segunda oração; “homem” é compreendido a partir da primeira oração e não precisa ser acrescentado no texto português.
- source_word: δίκαιοι
  choice: justos
  rationale: É o equivalente português corrente de δίκαιοι neste contexto e preserva a linguagem do campo semântico de justiça.
- source_word: κατασταθήσονται
  choice: serão feitos
  rationale: Mantém o futuro passivo e o paralelismo com “foram feitos”, sem substituir καθίστημι pelo sentido mais específico de “declarar justo”.
theological_decisions:
- issue: Alcance de οἱ πολλοί
  choice: os muitos
  alternative: todos; muitas pessoas
  rationale: A tradução conserva a expressão grega com artigo e não resolve interpretativamente a questão de seu alcance.
- issue: Sentido de κατασταθήσονται δίκαιοι
  choice: serão feitos justos
  alternative: serão declarados justos; serão constituídos justos
  rationale: O grego emprega καθίστημι, não δικαιόω. A opção escolhida preserva a formulação e deixa aberta a relação entre condição, constituição e dimensão forense.
- issue: Substantivo elíptico em διὰ τῆς ὑπακοῆς τοῦ ἑνός
  choice: por meio da obediência de um só
  alternative: por meio da obediência de um só homem
  rationale: Manter a elipse evita acrescentar ao texto principal um substantivo apenas implícito, sem prejudicar a clareza em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por meio de” explicita naturalmente o valor instrumental de διά; “os muitos” é deliberadamente mais marcado para conservar a forma e a tensão do original.
