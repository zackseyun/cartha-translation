  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: pt
  text: Pois, até a lei, o pecado estava no mundo; mas o pecado não é levado em conta[a] quando não há lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é lançado na conta” ou “é imputado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Pois, antes da lei
  rationale: ἄχρι com νόμου delimita o período anterior à lei. “Antes da lei” expressa esse valor temporal de modo natural em português, sem explicitar no texto que a lei foi “dada”, ideia apenas implícita no contexto.
- source_word: ἁμαρτία
  choice: o pecado
  rationale: Mantém o substantivo singular abstrato de Paulo e sua possível força quase personificada, sem interpretá-lo além do texto.
- source_word: ἦν ἐν κόσμῳ
  choice: já estava no mundo
  rationale: “Estava no mundo” reproduz a presença do pecado no âmbito humano; “já” torna clara em português a relação temporal indicada por ἄχρι, sem alterar o argumento.
- source_word: ἐλλογεῖται
  choice: é levado em conta
  rationale: Expressão portuguesa corrente que conserva o sentido contábil ou judicial do verbo, evitando que um termo técnico como “imputado” determine a interpretação no texto principal.
- source_word: μὴ ὄντος νόμου
  choice: quando não há lei
  rationale: Traduz o genitivo absoluto como a condição ou circunstância em que a lei está ausente. “Quando” se ajusta naturalmente ao caráter temporal do argumento, embora a formulação também possa ter alcance geral.
theological_decisions:
- issue: Referente de νόμος
  choice: “a lei”, com a provável referência à lei mosaica deixada ao contexto
  alternative: “lei”, em sentido inteiramente genérico, ou “a Lei de Moisés” de forma explícita
  rationale: O contexto de Romanos 5, especialmente a menção de Adão a Moisés, aponta para a lei mosaica. A tradução usa o artigo natural em português, mas não acrescenta “de Moisés”, preservando a formulação do grego.
- issue: Força de ἐλλογεῖται
  choice: “é levado em conta” no texto principal
  alternative: “é lançado na conta” ou “é imputado”
  rationale: O verbo possui uma imagem contábil com possíveis implicações judiciais e teológicas. A formulação principal é clara e não técnica; a nota registra alternativas mais literais ou teologicamente marcadas sem resolver a tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A sintaxe preserva o contraste paulino entre a presença do pecado e seu não lançamento em conta na ausência de lei.
