  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: pt
  text: A Lei, porém, entrou como algo acrescentado[a] para que a transgressão[b] aumentasse; mas, onde o pecado aumentou, a graça transbordou muito mais.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entrou” ou “entrou ao lado”; o verbo grego sugere entrar ao lado ou como algo acrescentado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a ofensa” ou “a falta”.
    reason: lexical_alternative
  - marker: c
    text: Ou “superabundou ainda mais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: a Lei
  rationale: O artigo e o contexto paulino apontam mais naturalmente para a Lei mosaica. A inicial maiúscula ajuda a indicar esse referente específico em português.
- source_word: παρεισῆλθεν
  choice: entrou em cena
  rationale: Expressa de modo natural a entrada adicional ou posterior sugerida pelo composto grego, sem recorrer à ideia potencialmente indevida de uma entrada furtiva.
- source_word: ἵνα πλεονάσῃ
  choice: para que ... aumentasse
  rationale: Preserva a construção de finalidade com ἵνα e o subjuntivo, sem eliminar a tensão teológica do enunciado.
- source_word: τὸ παράπτωμα
  choice: a transgressão
  rationale: Termo claro e corrente que comunica uma violação concreta e mantém a ligação com a ofensa de Adão no contexto.
- source_word: οὗ
  choice: onde
  rationale: Equivalente adverbial natural no contraste da segunda oração.
- source_word: ἁμαρτία
  choice: pecado
  rationale: Correspondência paulina padrão e adequada ao contexto.
- source_word: ὑπερεπερίσσευσεν
  choice: transbordou muito mais
  rationale: Conserva a forte intensificação do verbo composto e comunica abundância que ultrapassa o aumento do pecado.
- source_word: ἡ χάρις
  choice: a graça
  rationale: Termo teológico consagrado, claro e diretamente correspondente a χάρις.
theological_decisions:
- issue: Se ἵνα deve ser traduzido como finalidade direta ou suavizado como simples resultado para evitar a impressão de que Deus aprova o pecado.
  choice: para que a transgressão aumentasse
  alternative: de modo que a transgressão aumentou
  rationale: A sintaxe grega apresenta ἵνα com o subjuntivo. A tradução mantém essa força e a tensão do argumento de Paulo, sem acrescentar aprovação moral do pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Entrou em cena” evita uma formulação rígida como “entrou ao lado”, mas a nota conserva a nuance lexical. A pontuação mantém o contraste enfático entre o aumento do pecado e a superabundância da graça.
