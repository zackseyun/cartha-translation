id: ROM.5.21
reference: Romans 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: pt
  text: para que, assim como o pecado reinou na morte, também a graça reine por meio da justiça[a] para a vida eterna, por meio de Jesus, o Messias[b], nosso Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio da retidão».'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «Jesus Cristo». Aqui, «Messias» explicita o sentido do título Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a ideia de propósito ou resultado e rege de modo adequado o subjuntivo «reine».
- source_word: ἐβασίλευσεν
  choice: reinou
  rationale: Preserva no passado a metáfora régia de Paulo e corresponde ao aoristo indicativo.
- source_word: ἐν τῷ θανάτῳ
  choice: na morte
  rationale: Mantém a leitura mais direta de ἐν como esfera, sem explicitar indevidamente uma relação instrumental.
- source_word: ἡ χάρις
  choice: a graça
  rationale: Equivalente corrente e claro, preservando a personificação e o contraste com o pecado.
- source_word: βασιλεύσῃ
  choice: reine
  rationale: O presente do subjuntivo português depois de «para que» expressa com naturalidade o aoristo subjuntivo grego sem sugerir mera incerteza.
- source_word: διὰ δικαιοσύνης
  choice: por meio da justiça
  rationale: «Justiça» é o equivalente português tradicional e semanticamente amplo de δικαιοσύνη; «por meio de» torna explícito o valor de meio de διά com genitivo.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: Preserva a direção ou o resultado indicado por εἰς em português moderno e natural.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa a construção apositiva idiomática em português; a forma tradicional «Cristo» é registrada em nota.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: Tradução direta e corrente, mantendo a relação de pertencimento expressa pelo pronome.
theological_decisions:
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva em português tanto a dimensão relacional e forense quanto a dimensão ética do termo, sem reduzir o sentido a uma única formulação teológica.
- issue: Χριστός como título ou forma semelhante a nome
  choice: o Messias
  alternative: Cristo
  rationale: O contexto permite reconhecer o valor titular de Χριστός; a alternativa tradicional é preservada em nota para transparência lexical.
- issue: Valor de ἐν em ἐν τῷ θανάτῳ
  choice: na morte
  alternative: por meio da morte
  rationale: A formulação principal conserva a provável ideia de esfera e evita decidir em favor de um valor instrumental que o grego não exige.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A repetição de «por meio de» conserva as duas construções gregas com διά, e a personificação régia do pecado e da graça foi mantida.
