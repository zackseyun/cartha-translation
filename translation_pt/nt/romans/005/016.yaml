id: ROM.5.16
reference: Romans 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: pt
  text: E a dádiva não é como aquilo que veio por meio daquele que pecou.[a] Pois o julgamento decorrente de uma só transgressão[b] levou à condenação, mas o dom da graça, decorrente de muitas transgressões, levou à justificação.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de um só homem que pecou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma só ofensa”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um veredito favorável” ou “a absolvição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: a dádiva
  rationale: O substantivo designa algo dado. “Dádiva” é claro e preserva a ideia de presente sem acrescentar explicitamente “gratuita”, já inerente ao conceito.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: por meio daquele que pecou
  rationale: Preserva a referência pessoal, provavelmente a Adão no contexto, e a formulação elíptica do grego sem inserir “homem” no texto principal.
- source_word: κρίμα
  choice: o julgamento
  rationale: Expressa a decisão judicial e mantém a distinção em relação a “condenação” e “justificação”.
- source_word: ἐξ ἑνὸς
  choice: decorrente de uma só transgressão
  rationale: O neutro ἑνός provavelmente se refere a uma transgressão, em contraste com as muitas transgressões mencionadas depois. O substantivo é explicitado para clareza.
- source_word: κατάκριμα
  choice: condenação
  rationale: É o equivalente português direto e natural para a sentença judicial adversa no contraste forense do versículo.
- source_word: χάρισμα
  choice: o dom da graça
  rationale: Torna perceptível a ligação do substantivo com χάρις, distingue-o de δώρημα e evita a formulação menos natural “dom gracioso”.
- source_word: παραπτωμάτων
  choice: transgressões
  rationale: Comunica de modo corrente a ideia de violações morais e se ajusta ao contexto jurídico e teológico.
- source_word: δικαίωμα
  choice: justificação
  rationale: No paralelismo com κατάκριμα, indica o resultado judicial oposto à condenação. “Justificação” preserva esse contraste, embora “veredito favorável” e “absolvição” continuem possíveis.
theological_decisions:
- issue: Força forense de δικαίωμα em contraste com κατάκριμα
  choice: justificação
  alternative: veredito favorável; absolvição
  rationale: A estrutura contrapõe julgamento e condenação ao dom da graça e a δικαίωμα. “Justificação” comunica o resultado judicial oposto sem excluir a nuance mais concreta de um veredito favorável.
- issue: Referente de ἐξ ἑνὸς
  choice: uma só transgressão
  alternative: um só indivíduo
  rationale: O gênero neutro e o contraste explícito com “muitas transgressões” favorecem a referência a uma única transgressão, embora a concisão grega permita que alguns entendam uma referência mais geral ao ato do único pecador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a comparação comprimida do grego, mas usa “aquilo que veio” para que a elipse seja inteligível. O vocabulário judicial é mantido para preservar o contraste entre condenação e justificação.
