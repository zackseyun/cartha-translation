  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: pt
  text: por meio de quem também obtivemos, pela fé, acesso a esta graça na qual estamos firmes; e nos gloriamos[a] na esperança da glória de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos alegramos” ou “exultamos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: acesso
  rationale: “Acesso” expressa de modo natural a entrada concedida à condição de graça diante de Deus; “entrada” também seria possível, mas é menos precisa neste contexto.
- source_word: πίστει
  choice: pela fé
  rationale: O dativo tem sentido instrumental; “pela fé” é conciso, natural em português e preserva o vocabulário paulino.
- source_word: χάριν
  choice: graça
  rationale: “Graça” é a tradução estabelecida e adequada no contexto paulino, referindo-se ao favor imerecido concedido por Deus.
- source_word: ἑστήκαμεν
  choice: estamos firmes
  rationale: O perfeito grego indica uma condição presente resultante de uma ação anterior. “Estamos firmes” comunica essa permanência atual sem tornar explícito além do texto quem causou esse estado.
- source_word: καυχώμεθα
  choice: nos gloriamos
  rationale: Preserva a força retórica e a tensão positiva do verbo no uso paulino, além de manter sua ligação lexical com outras ocorrências próximas; “nos alegramos” seria mais suave.
- source_word: ἐπ’ ἐλπίδι
  choice: na esperança
  rationale: É uma formulação idiomática que mantém a esperança como esfera ou fundamento do gloriar-se.
- source_word: δόξης τοῦ θεοῦ
  choice: da glória de Deus
  rationale: Reproduz com transparência a construção genitiva e conserva o tom solene do grego.
theological_decisions:
- issue: Tradução de καυχώμεθα sem eliminar a tensão teológica de Paulo
  choice: nos gloriamos
  alternative: nos alegramos; exultamos
  rationale: Embora “nos gloriamos” possa soar mais forte, preserva o uso deliberadamente positivo de uma palavra que também pode designar vanglória. As alternativas suavizam essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada com vírgulas em “obtivemos, pela fé, acesso” para evitar ambiguidade, e o ponto e vírgula preserva a progressão da frase. O marcador foi colocado junto a “nos gloriamos”, termo ao qual a alternativa lexical se refere.
