id: ROM.5.6
reference: Romans 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: pt
  text: Pois, quando ainda éramos fracos, o Messias morreu no tempo certo pelos ímpios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em favor dos ímpios”.'
    reason: Registra uma formulação alternativa para ὑπὲρ que salienta o benefício ou a representação sem decidir toda a extensão teológica da preposição.
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título Χριστός de modo transparente, em vez de apenas transliterá-lo; o artigo é acrescentado por naturalidade em português.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: quando ainda éramos fracos
  rationale: Converte o genitivo absoluto em uma oração temporal natural e conserva o sentido amplo de fraqueza ou incapacidade sem especificá-lo além do grego.
- source_word: ἔτι
  choice: ainda
  rationale: Expressa a continuidade da condição humana. Uma ocorrência explícita em português comunica naturalmente a força do advérbio, apesar de sua repetição na forma textual grega.
- source_word: κατὰ καιρὸν
  choice: no tempo certo
  rationale: Comunica um momento apropriado ou determinado sem explicitar além do texto quem o determinou.
- source_word: ὑπὲρ
  choice: por
  rationale: Neste contexto, a contração “pelos” é idiomática e mantém aberta a amplitude de benefício, representação ou substituição presente na preposição.
- source_word: ἀσεβῶν
  choice: os ímpios
  rationale: “Ímpios” preserva o sentido moral e religioso de pessoas sem reverência a Deus e é claro no registro bíblico português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Equivalente direto e natural do aoristo, sem expansão interpretativa.
theological_decisions:
- issue: Força da morte do Messias expressa por ὑπὲρ ἀσεβῶν
  choice: pelos ímpios
  alternative: em favor dos ímpios
  rationale: “Pelos” preserva o peso teológico da afirmação e permite nuances de benefício, representação e substituição sem impor uma formulação doutrinária mais estreita; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. “Messias” torna explícito o valor titular de Χριστός; “ímpios” mantém concisão e registro bíblico corrente.
