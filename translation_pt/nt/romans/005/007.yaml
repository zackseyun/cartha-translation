id: ROM.5.7
reference: Romans 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: pt
  text: Pois dificilmente alguém morrerá por uma pessoa justa[a][b], embora talvez alguém até se atreva a morrer por uma pessoa boa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por um justo”. O grego emprega um adjetivo substantivado no masculino, provavelmente com sentido genérico.'
    reason: lexical_alternative
  - marker: b
    text: O contraste entre “justa” e “boa” pode ser intencional, e não apenas uma variação de estilo.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: dificilmente
  rationale: Expressa que tal ato quase não acontece, preservando a ênfase de Paulo em sua extrema raridade.
- source_word: ὑπὲρ
  choice: por
  rationale: Neste contexto, indica morrer em favor de alguém. “Por” é a forma mais natural e concisa em português, e o contexto comunica o sentido representativo ou substitutivo.
- source_word: δικαίου
  choice: uma pessoa justa
  rationale: O adjetivo substantivado descreve alguém caracterizado pela justiça. “Pessoa justa” preserva essa categoria moral e comunica de modo natural o provável sentido genérico.
- source_word: ἀποθανεῖται
  choice: morrerá
  rationale: Mantém diretamente o futuro do grego dentro da afirmação geral.
- source_word: τοῦ ἀγαθοῦ
  choice: uma pessoa boa
  rationale: Preserva a distinção lexical entre “justa” e “boa” sem determinar de maneira indevida em que consiste exatamente o contraste.
- source_word: τάχα
  choice: talvez
  rationale: Indica possibilidade sem transformá-la em certeza e corresponde ao tom cauteloso do texto.
- source_word: καὶ
  choice: até
  rationale: 'Tem força intensificadora: alguém talvez chegue até mesmo a ousar morrer.'
- source_word: τολμᾷ
  choice: se atreva
  rationale: Verbo idiomático em português que conserva a ideia de coragem ou ousadia diante de uma ação excepcional.
- source_word: ἀποθανεῖν
  choice: morrer
  rationale: Tradução direta do infinitivo, preservando a repetição do tema da morte nas duas orações.
theological_decisions:
- issue: Preservação da distinção entre δικαίου e ἀγαθοῦ
  choice: Traduzir distintamente como “pessoa justa” e “pessoa boa”.
  alternative: Tratar os dois termos como sinônimos e uniformizar a tradução.
  rationale: A diferença pode ser intencional e contribuir para o argumento. Mantê-la evita eliminar uma possível nuance moral ou retórica sem impor uma interpretação específica.
- issue: Valor argumentativo do segundo γάρ
  choice: Usar “embora” para tornar explícita a concessão percebida na relação entre as duas orações.
  alternative: Repetir literalmente “pois” antes da segunda oração.
  rationale: Embora γάρ costume ser explicativo, aqui a progressão afirma que morrer por um justo é extremamente raro e concede que talvez alguém ouse fazê-lo por uma pessoa boa. “Embora” reproduz essa relação de forma clara e natural em português, sem resolver a distinção entre os dois tipos de pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do verbo “morrer” acompanham o movimento do grego; “pessoa” evita restringir a referência ao sexo masculino, enquanto a nota registra a forma gramatical da fonte.
