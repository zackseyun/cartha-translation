id: ROM.5.1
reference: Romans 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: pt
  text: Portanto, tendo sido justificados pela fé[b], temos[a] paz com Deus por meio de nosso Senhor Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “tenhamos paz com Deus”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “com base na fé”.'
    reason: lexical_alternative
  - marker: c
    text: Grego Christos, “Messias”; tradicionalmente, “Cristo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: tendo sido justificados
  rationale: O particípio aoristo passivo indica uma ação recebida e anterior ao resultado expresso na oração principal. “Justificados” preserva o sentido forense paulino sem ampliar o texto para uma formulação doutrinária mais específica.
- source_word: οὖν
  choice: portanto
  rationale: Expressa a conclusão decorrente do argumento anterior e mantém clara a ligação lógica.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: Embora ἐκ tenha o sentido básico de “de” ou “a partir de”, nesta construção “pela fé” é a forma portuguesa natural e concisa. A alternativa “com base na fé” é registrada em nota.
- source_word: εἰρήνην
  choice: paz
  rationale: Traduz diretamente o substantivo grego e preserva a amplitude da relação restaurada com Deus, sem restringi-lo à paz interior nem substituí-lo pela interpretação “reconciliação”.
- source_word: ἔχομεν
  choice: temos
  rationale: Segue a forma indicativa do texto da SBLGNT. A variante subjuntiva, “tenhamos”, é indicada em nota.
- source_word: πρὸς τὸν θεὸν
  choice: com Deus
  rationale: Com o substantivo “paz”, esta é a expressão idiomática portuguesa para a relação de paz entre as pessoas justificadas e Deus.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: por meio de nosso Senhor
  rationale: “Por meio de” comunica naturalmente o valor instrumental de διά com o genitivo, e “Senhor” conserva o título reverencial de κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός é vertido pelo significado do título, “Messias”, em vez de ser tratado apenas como nome próprio. O artigo em português torna a expressão titular natural e clara.
theological_decisions:
- issue: Sentido de δικαιωθέντες na teologia paulina
  choice: tendo sido justificados
  alternative: tendo sido declarados justos; tendo sido feitos justos
  rationale: A tradução conserva o termo teológico tradicional e a voz passiva do grego, sem decidir no próprio texto entre explicações confessionais concorrentes sobre o modo ou a natureza exata da justificação.
- issue: Sentido de “paz com Deus”
  choice: paz com Deus
  alternative: reconciliação com Deus; paz interior dada por Deus
  rationale: A frase aponta para uma relação de paz com Deus, mas o substantivo grego é “paz”. A formulação direta evita reduzi-la à experiência subjetiva ou substituí-la por uma interpretação mais estreita.
- issue: Variante textual em ἔχομεν / ἔχωμεν
  choice: temos, seguindo o indicativo do texto-base
  alternative: tenhamos, conforme a variante subjuntiva
  rationale: A tradução principal segue a edição SBLGNT fornecida, enquanto a nota preserva a variante antiga e sua diferença entre afirmação e exortação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “tendo sido justificados” conserva a relação sintática do particípio grego sem soar excessivamente técnica; “por meio de” explicita com naturalidade a mediação indicada por διά.
