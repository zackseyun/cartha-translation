id: ROM.5.9
reference: Romans 5:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: pt
  text: Portanto, com muito mais razão, agora que fomos justificados pelo sangue dele[a], seremos salvos por meio dele da ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declarados justos por meio do sangue dele”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a ira divina indicada pelo contexto.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Portanto, com muito mais razão
  rationale: Preserva tanto a inferência de οὖν quanto a intensificação comparativa de πολλῷ ... μᾶλλον, em português natural.
- source_word: δικαιωθέντες νῦν
  choice: agora que fomos justificados
  rationale: Expressa a ação passiva já realizada e sua relação lógica e temporal com o futuro «seremos salvos», sem tornar a frase artificial.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: pelo sangue dele
  rationale: Entende ἐν como meio ou base neste contexto; «pelo sangue dele» é idiomático e conserva a imagem sacrificial.
- source_word: σωθησόμεθα
  choice: seremos salvos
  rationale: Mantém claramente o futuro passivo e a dimensão futura da salvação mencionada no versículo.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: Representa a agência ou mediação indicada por διά com o genitivo e evita confusão com a ocorrência anterior de «pelo».
- source_word: ἀπὸ τῆς ὀργῆς
  choice: da ira
  rationale: Conserva o artigo e não acrescenta explicitamente «de Deus», embora o contexto indique ira divina.
theological_decisions:
- issue: Sentido de δικαιωθέντες
  choice: justificados
  alternative: declarados justos
  rationale: «Justificados» mantém a terminologia paulina e a continuidade lexical, sem definir de modo denominacional o funcionamento da justificação.
- issue: Referente de τῆς ὀργῆς
  choice: da ira
  alternative: da ira de Deus
  rationale: O contexto aponta para a ira divina, mas «de Deus» não está expresso no texto grego; a tradução principal preserva essa concisão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção «agora que fomos justificados» comunica naturalmente a relação entre o particípio aoristo e o verbo futuro. Todos os marcadores de nota aparecem no texto principal.
