id: ROM.5.11
reference: Romans 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: pt
  text: E não somente isso, mas também nos gloriamos[a] em Deus, por meio de nosso Senhor Jesus, o Messias[b], por meio de quem agora recebemos a reconciliação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exultamos” ou “nos alegramos”.
    reason: lexical_alternative
  - marker: b
    text: Grego Christós; tradicionalmente, “Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: καυχώμενοι
  choice: nos gloriamos
  rationale: Expressa diretamente a ideia de orgulho ou exultação confiante, sem atribuir o mérito aos próprios falantes, pois Deus é o objeto dessa glória.
- source_word: ἐν τῷ θεῷ
  choice: em Deus
  rationale: Mantém a construção paulina e permite entender Deus tanto como objeto quanto como esfera dessa exultação.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução corrente e adequada de κύριος no uso cristológico do Novo Testamento.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Torna transparente o sentido titular de Χριστός; o artigo foi acrescentado em português por exigência idiomática, não por corresponder a um artigo grego expresso.
- source_word: καταλλαγὴν
  choice: a reconciliação
  rationale: Denota o restabelecimento da relação e conserva o artigo definido, que remete à reconciliação descrita no contexto anterior.
- source_word: ἐλάβομεν
  choice: recebemos
  rationale: Traduz naturalmente o aoristo de λαμβάνω; o advérbio 'agora' explicita que essa reconciliação já foi recebida e constitui uma realidade presente.
theological_decisions:
- issue: Sentido de καυχώμενοι em relação a Deus
  choice: nos gloriamos em Deus
  alternative: nos alegramos em Deus / exultamos em Deus
  rationale: ‘Nos gloriamos’ preserva mais diretamente a linguagem paulina de καυχάομαι e deixa claro, pelo complemento ‘em Deus’, que não se trata de vanglória autônoma.
- issue: Tradução do título Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título de Jesus; ‘Messias’ comunica seu sentido lexical de modo transparente sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por meio de” acompanha a estrutura enfática do grego, e “nos gloriamos” conserva a tensão lexical de καυχάομαι sem a suavizar indevidamente.
