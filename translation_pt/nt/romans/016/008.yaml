  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: pt
  text: Saúdem Amplíato[a], meu amado no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome grego também pode ser representado como “Amplias”; a leitura adotada pelo SBLGNT corresponde a “Amplíato” (latim Ampliatus).
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo aoristo médio na segunda pessoa do plural é uma fórmula epistolar de saudação. “Saúdem” comunica a ordem de modo conciso, natural e corrente em português.
- source_word: Ἀμπλιᾶτον
  choice: Ampliato
  rationale: O nome próprio é transliterado em forma portuguesa e normalizado do acusativo grego para a forma de citação. A leitura do SBLGNT corresponde à forma latina Ampliatus, tradicionalmente aportuguesada como “Ampliato”.
- source_word: ἀγαπητόν μου
  choice: meu amado
  rationale: Preserva a relação afetiva expressa por ἀγαπητός e pelo possessivo μου, mantendo a concisão e a dignidade da expressão grega.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Reproduz a expressão paulina que situa esse vínculo de afeto na esfera da comunhão com o Senhor, sem acrescentar “Jesus”, ausente do texto grego.
theological_decisions:
- issue: Relação sintática e teológica de ἐν κυρίῳ
  choice: “no Senhor” caracteriza Ampliato como alguém amado por Paulo no âmbito da comunhão cristã.
  alternative: Entender a expressão como modificadora do ato de saudar, ou como simples indicação de amizade pessoal sem força teológica.
  rationale: A ordem e a construção gregas ligam mais naturalmente τὸν ἀγαπητόν μου ἐν κυρίῳ a Ampliato. A tradução conserva a formulação paulina sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “Saúdem” em vez de uma fórmula mais longa. “Meu amado” mantém o calor pessoal e o tom cristão do original. O marcador [a] aparece imediatamente após o nome a que se refere.
