id: ROM.16.22
reference: Romans 16:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: pt
  text: Eu, Tércio, que escrevi a carta, saúdo vocês no Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: «Eu, Tércio, que escrevi a carta no Senhor, saúdo vocês.» A expressão grega «no Senhor» pode estar ligada a «escrevi», embora mais naturalmente qualifique a saudação.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: saúdo
  rationale: O verbo significa saudar ou enviar saudações. «Saúdo» é conciso, natural no encerramento epistolar e mantém a primeira pessoa do grego.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Pronome de segunda pessoa do plural. «Vocês» expressa claramente o plural e tem ampla legibilidade brasileira.
- source_word: ἐγὼ Τέρτιος
  choice: Eu, Tércio
  rationale: O pronome explícito seguido do nome distingue o remetente da saudação. A construção portuguesa preserva essa autoidentificação com naturalidade.
- source_word: ὁ γράψας
  choice: que escrevi
  rationale: O particípio aoristo articular identifica Tércio como aquele que escreveu materialmente a carta. A oração relativa é natural em português e não acrescenta uma explicação como «escriba».
- source_word: τὴν ἐπιστολήν
  choice: a carta
  rationale: «Carta» é o equivalente moderno e comum; o artigo definido reproduz o grego sem introduzir o demonstrativo «esta».
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a expressão paulina e seu sentido relacional ou de esfera. Pela posição adotada, modifica principalmente a saudação, sem explicar além do que o texto diz.
theological_decisions:
- issue: Relação sintática de ἐν κυρίῳ
  choice: «no Senhor» ligado à saudação de Tércio
  alternative: «que escrevi a carta no Senhor», com a expressão ligada ao ato de escrever
  rationale: No contexto de saudações epistolares, a ligação com «saúdo» é mais natural. Como a ordem grega permite ligação com «escrevi», a alternativa genuína é registrada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Vocês» deixa explícito o plural de ὑμᾶς; «Tércio» segue a forma tradicional portuguesa do nome. A pontuação mantém «no Senhor» junto de «saúdo vocês», enquanto a nota preserva a alternativa sintática.
