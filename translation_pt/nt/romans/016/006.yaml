base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: pt
  text: Saúdem Maria[a], que trabalhou arduamente por vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “por nós” ou “entre vocês” em vez de “por vocês”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo aoristo médio na segunda pessoa do plural, empregado em contexto epistolar para transmitir saudações. “Saúdem” é conciso, natural e preserva o destinatário plural.
- source_word: Μαριάμ
  choice: Maria
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ἥτις
  choice: que
  rationale: Introduz naturalmente a oração descritiva referente a Maria; a possível nuance qualitativa do pronome não precisa ser explicitada.
- source_word: πολλὰ
  choice: muito
  rationale: Empregado adverbialmente, indica a grande intensidade ou extensão do trabalho.
- source_word: ἐκοπίασεν
  choice: trabalhou
  rationale: O verbo denota trabalho árduo ou fatigante. Em conjunto com “muito”, a tradução comunica essa intensidade em português corrente e digno.
- source_word: εἰς ὑμᾶς
  choice: por vocês
  rationale: No texto adotado, a preposição com o pronome indica orientação em benefício dos destinatários. “Por vocês” é idiomático e claro no português contemporâneo.
theological_decisions:
- issue: Variante textual na expressão final
  choice: por vocês
  alternative: por nós; entre vocês
  rationale: O SBLGNT traz εἰς ὑμᾶς, entendido aqui como trabalho em favor dos destinatários. As leituras εἰς ἡμᾶς e ἐν ὑμῖν são preservadas em nota sem substituir o texto-base adotado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo e explicita o número dos destinatários; “trabalhou muito” mantém naturalidade sem perder a ideia de esforço intenso.
