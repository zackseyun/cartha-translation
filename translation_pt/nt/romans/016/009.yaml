  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: pt
  text: Saúdem Urbano, nosso cooperador no Messias[a], e Estáquis, meu amado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Cristo”.
    reason: Registra a tradução tradicional alternativa de Χριστός.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo plural é expresso de modo natural e direto no português moderno; “saudai” seria excessivamente arcaico para o registro pretendido.
- source_word: Οὐρβανὸν
  choice: Urbano
  rationale: Forma portuguesa tradicional e reconhecível do nome latino representado no texto grego.
- source_word: συνεργὸν ἡμῶν
  choice: nosso cooperador
  rationale: Preserva tanto a ideia de trabalho conjunto em συνεργός quanto a relação indicada por ἡμῶν, com linguagem digna e corrente.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém a força titular de Χριστός e expressa de modo idiomático a esfera ou união indicada por ἐν.
- source_word: Στάχυν
  choice: Estáquis
  rationale: Transliteração portuguesa convencional do nome próprio grego.
- source_word: τὸν ἀγαπητόν μου
  choice: meu amado
  rationale: Conserva o afeto pessoal e a ligação lexical com o campo semântico de ἀγαπάω/ἀγάπη, sem paráfrase desnecessária.
theological_decisions:
- issue: Tradução de Χριστῷ em ἐν Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός continua a funcionar de maneira reconhecível como título. “Messias” preserva esse valor, enquanto a nota registra a tradução tradicional “Cristo” sem eliminar a questão lexical.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal brasileira de ampla compreensão. Evitou-se o imperativo arcaico “saudai”. Os nomes seguem formas portuguesas convencionais.
