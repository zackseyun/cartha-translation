  - marker: b
    text: 'Ou: «em Cristo Jesus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo aoristo médio na segunda pessoa do plural, usado como instrução epistolar para transmitir saudações. «Saúdem» é direto, natural e preserva o plural.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Reproduz a forma do nome presente no texto grego, distinta da forma mais familiar «Priscila», registrada em nota.
- source_word: Ἀκύλαν
  choice: Áquila
  rationale: Forma portuguesa consagrada do nome próprio grego Ἀκύλας, com acentuação necessária em português.
- source_word: συνεργούς μου
  choice: meus cooperadores
  rationale: Expressa pessoas que trabalham juntamente com Paulo numa missão compartilhada; «cooperadores» é corrente, digno e evita conotação empresarial excessiva.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Preserva o valor titular de Χριστός e apresenta a esfera ou união em que ocorre a cooperação. A formulação tradicional «em Cristo Jesus» consta em nota.
theological_decisions:
- issue: Tradução de Χριστῷ na fórmula paulina ἐν Χριστῷ Ἰησοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός conserva força titular e identifica Jesus como o Messias. A alternativa tradicional é mantida em nota para transparência, sem eliminar a possível leitura mais nominal da fórmula.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega «Saúdem» em vez do regional «Saudai» e mantém a ordem e a concisão do grego.
