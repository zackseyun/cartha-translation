  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: pt
  text: Saúdem Prisca e Áquila[a], meus cooperadores no Messias Jesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Prisca é a forma do nome usada aqui; Priscila é a forma mais familiar empregada em outros textos para a mesma pessoa.
