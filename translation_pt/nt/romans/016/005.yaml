  naturalness: “Saúdem também a igreja na casa deles” e “Saúdem Epêneto, meu amado” são claros e naturais. “A primícia da Ásia para o Messias” mantém a metáfora e soa mais estabelecido em português bíblico moderno do que “o primeiro fruto”.
  terminology: “Epêneto”, “Messias”, “Ásia” e “igreja” são apropriados. “Primícia” reproduz melhor a imagem de ἀπαρχή, inclusive sua possível ressonância de dedicação a Deus, sem transformar o texto principal em “primeiro convertido”.
