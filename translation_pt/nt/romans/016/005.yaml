  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: pt
  text: Saúdem também a igreja na casa deles[a]. Saúdem Epêneto, meu amado, que é a primícia da Ásia[b] para o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a igreja que se reúne na casa deles”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a província romana da Ásia, não o continente moderno.
    reason: cultural_note
  - marker: c
    text: 'Ou, em sentido explicativo: “que foi o primeiro convertido na Ásia para o Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: a igreja na casa deles
  rationale: Mantém de perto a construção grega e expressa a assembleia associada à casa deles, sem explicitar no texto principal que ali se reunia; essa interpretação natural aparece em nota.
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: No contexto de uma lista epistolar, o verbo pede uma saudação dirigida a várias pessoas; o imperativo plural é natural em português.
- source_word: Ἐπαίνετον
  choice: Epêneto
  rationale: Emprega a forma portuguesa tradicional e fonologicamente clara do nome grego.
- source_word: ἀγαπητόν μου
  choice: meu amado
  rationale: Preserva de modo conciso o afeto pessoal e o tom digno do original.
- source_word: ἀπαρχὴ
  choice: o primeiro fruto
  rationale: Conserva a metáfora agrícola de Paulo e, ao mesmo tempo, produz concordância natural com Epêneto. A interpretação contextual como primeiro convertido é apresentada em nota.
- source_word: τῆς Ἀσίας
  choice: da Ásia
  rationale: Reproduz naturalmente o genitivo, deixando para a nota a identificação histórica da província romana.
- source_word: εἰς Χριστόν
  choice: para o Messias
  rationale: Preserva a relação ou direção expressa por εἰς sem a resolver excessivamente; traduz Χριστός como título.
theological_decisions:
- issue: Tradução de Χριστόν
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός pode ser ouvido como título. “Messias” torna explícito esse valor sem acrescentar uma interpretação denominacional.
- issue: Sentido de ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: que é o primeiro fruto da Ásia para o Messias
  alternative: que foi o primeiro convertido da Ásia ao Messias
  rationale: O texto principal preserva a metáfora e a construção relacional do grego; a nota oferece o sentido contextual provável sem apagar a imagem original.
translation_notes:
  register: Português moderno, claro e digno, com imperativos plurais naturais. A formulação conserva a metáfora de “primeiro fruto” e a ambiguidade relacional de εἰς, enquanto as notas esclarecem as leituras contextuais mais prováveis.
