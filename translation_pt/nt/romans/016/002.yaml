id: ROM.16.2
reference: Romans 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: pt
  text: para que a recebam no Senhor de maneira digna dos santos e a ajudem[a] em qualquer assunto em que ela precise de vocês, pois ela mesma se tornou benfeitora de muitos[b], inclusive de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem ao lado dela” ou “lhe deem apoio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “patrona”, “protetora” ou “auxiliadora”. O termo grego sugere uma mulher que oferecia apoio, recursos ou proteção a outras pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: recebam
  rationale: No contexto, o verbo indica acolher Febe favoravelmente na comunidade. “Recebam” preserva tanto a ideia de recepção quanto a de aceitação hospitaleira.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a conhecida expressão paulina, que situa o acolhimento na comunhão e no relacionamento cristãos.
- source_word: ἀξίως τῶν ἁγίων
  choice: de maneira digna dos santos
  rationale: Expressa o modo apropriado de recebê-la e preserva “santos” como designação paulina dos que pertencem a Deus.
- source_word: παραστῆτε αὐτῇ
  choice: a ajudem
  rationale: Neste contexto, παρίστημι significa colocar-se ao lado de alguém para lhe prestar auxílio. “Ajudem” comunica isso de modo claro e natural, sem determinar a forma da assistência.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: em qualquer assunto em que ela precise de vocês
  rationale: Preserva a amplitude de πρᾶγμα (“assunto”, “questão”, “negócio”) e a ideia de que Febe poderia necessitar da participação ou ajuda dos destinatários.
- source_word: προστάτις
  choice: benfeitora
  rationale: O termo feminino sugere alguém que oferecia apoio, recursos ou proteção a outros, possivelmente no âmbito do patronato social. “Benfeitora” é natural em português e comunica melhor essa atuação relevante do que o genérico “auxiliadora”.
- source_word: πολλῶν
  choice: de muitos
  rationale: Reproduz a referência pessoal indefinida sem acrescentar uma especificação ausente do grego.
- source_word: ἐγενήθη
  choice: se tornou
  rationale: Representa diretamente o aoristo de γίνομαι, deixando que o contexto indique a relevância contínua da atuação de Febe.
- source_word: ἐμοῦ αὐτοῦ
  choice: inclusive de mim
  rationale: “Inclusive” transmite a força aditiva de καί e destaca que o próprio Paulo estava entre os beneficiados por Febe.
theological_decisions:
- issue: Sentido de προστάτις aplicado a Febe
  choice: benfeitora
  alternative: patrona, protetora ou auxiliadora
  rationale: “Benfeitora” preserva a atuação significativa de Febe no apoio a muitas pessoas sem reduzir o termo a ajuda genérica nem transformá-lo em título eclesiástico. A nota registra “patrona”, que pode refletir mais especificamente o contexto social antigo, mas em português também pode evocar outros sentidos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém a linguagem paulina “no Senhor” e “santos”, enquanto emprega “ajudem” e “benfeitora” para comunicar naturalmente o sentido contextual. Os marcadores de nota aparecem imediatamente após os termos a que se referem.
