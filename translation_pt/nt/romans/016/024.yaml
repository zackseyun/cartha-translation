id: ROM.16.24
reference: Romans 16:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: pt
  text: A graça de nosso Senhor Jesus Cristo esteja com todos vocês.[a] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos incluem este versículo, enquanto outros o omitem; por isso, muitas edições modernas o assinalam como variante textual no encerramento de Romanos.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Preserva o termo paulino tradicional para o favor e dom gracioso de Deus, com naturalidade e peso teológico em português.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução corrente e adequada do título cristológico κύριος, expressando o senhorio de Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus Cristo
  rationale: Em português, “Jesus Cristo” é a forma natural, digna e amplamente compreendida; “Cristo” conserva o título tradicional derivado de Χριστός sem soar artificial como “Jesus Messias” neste contexto.
- source_word: μετὰ πάντων ὑμῶν
  choice: com todos vocês
  rationale: Expressa de modo claro e inclusivo a presença desejada junto à totalidade dos destinatários, em português moderno de ampla compreensão.
- source_word: Ἀμήν
  choice: Amém
  rationale: Mantém a forma litúrgica tradicional e plenamente natural em português.
theological_decisions:
- issue: Tradução de Χριστός em Ἰησοῦ Χριστοῦ
  choice: Cristo
  alternative: Messias
  rationale: Embora Χριστός signifique “Ungido/Messias”, na sequência nominal “Jesus Cristo” a forma tradicional é natural e transparente ao leitor lusófono. A alternativa “Jesus Messias” destacaria mais explicitamente o sentido do título, mas seria menos idiomática aqui.
- issue: Situação textual do versículo
  choice: Incluir o versículo com nota de variante textual
  alternative: Omitir o versículo do texto principal
  rationale: O SBLGNT apresenta a frase entre sinais de variante, e a tradição manuscrita está dividida. A inclusão respeita o texto fornecido, enquanto a nota informa honestamente que diversos manuscritos a omitem.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e mantém a fórmula tradicional “Jesus Cristo”. O marcador da nota textual aparece imediatamente após a bênção a que se refere.
