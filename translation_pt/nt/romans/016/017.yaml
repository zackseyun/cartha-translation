id: ROM.16.17
reference: Romans 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: pt
  text: Peço a vocês, irmãos[a], que fiquem atentos aos que causam divisões e obstáculos que fazem tropeçar, contrários ao ensino que vocês aprenderam; afastem-se deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e provavelmente se dirige a toda a congregação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Peço
  rationale: Expressa um apelo pastoral sério e natural em português; no contexto, tem mais força que um pedido casual, sem a formalidade de “exorto”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego. No uso paulino, provavelmente inclui toda a congregação, o que é esclarecido em nota.
- source_word: σκοπεῖν
  choice: que fiquem atentos
  rationale: Comunica observação cuidadosa acompanhada de cautela, de modo corrente e claro em português.
- source_word: διχοστασίας
  choice: divisões
  rationale: Representa com clareza as rupturas e dissensões causadas na comunidade.
- source_word: σκάνδαλα
  choice: obstáculos
  rationale: Preserva a ideia de algo que leva outros a tropeçar, embora em linguagem mais natural que “pedras de tropeço” neste período.
- source_word: παρὰ τὴν διδαχήν
  choice: contrários ao ensino
  rationale: παρά com acusativo indica desvio ou oposição ao padrão do ensino recebido.
- source_word: διδαχήν
  choice: ensino
  rationale: É uma tradução moderna e acessível para a instrução apostólica, sem a possível carga confessional de “doutrina”.
- source_word: ἐμάθετε
  choice: vocês aprenderam
  rationale: Reproduz diretamente o aoristo e indica o ensino já aprendido pelos destinatários.
- source_word: ποιοῦντας
  choice: que causam
  rationale: No contexto, o particípio descreve pessoas que produzem divisões e obstáculos; a oração relativa é idiomática em português.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: afastem-se deles
  rationale: Mantém a força imperativa e a imagem direcional de se desviar ou manter distância dessas pessoas.
theological_decisions:
- issue: Força representativa de ἀδελφοί ao dirigir-se à congregação romana
  choice: Manter “irmãos” no texto principal e indicar em nota que o termo provavelmente abrange homens e mulheres.
  alternative: Traduzir no texto principal como “irmãos e irmãs”.
  rationale: A forma lexical masculina é preservada, enquanto o provável alcance inclusivo do vocativo paulino é explicitado sem resolver silenciosamente a questão no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Peço a vocês” evita tanto a fraqueza de um pedido casual quanto a formalidade menos corrente de “exorto”. O ponto e vírgula torna clara a passagem do apelo de vigilância para a ordem de afastamento.
