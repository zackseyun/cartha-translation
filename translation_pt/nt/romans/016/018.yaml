id: ROM.16.18
reference: Romans 16:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: pt
  text: Pois essas pessoas não servem ao nosso Senhor Messias[a], mas ao próprio ventre[b]; e, com conversa agradável e bajulação, enganam o coração dos incautos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nosso Senhor Cristo».'
    reason: alternative_reading
  - marker: b
    text: Literalmente, «o próprio ventre», imagem vívida de desejos e interesses egoístas.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «dos inocentes» ou «dos que não têm malícia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: essas pessoas
  rationale: Retoma as pessoas divisivas mencionadas no versículo anterior, em português natural e sem restringir o gênero.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: nosso Senhor Messias
  rationale: Preserva κύριος como «Senhor» e traduz Χριστός como o título «Messias»; não acrescenta «Jesus», ausente do texto grego.
- source_word: δουλεύουσιν
  choice: servem
  rationale: Expressa naturalmente o serviço ou sujeição indicado pelo verbo, mantendo o contraste entre o Senhor e o ventre.
- source_word: κοιλίᾳ
  choice: ventre
  rationale: Conserva a imagem concreta e vívida do grego, que neste contexto sugere desejos e interesses egoístas.
- source_word: χρηστολογίας
  choice: conversa agradável
  rationale: Comunica fala amável, atraente e persuasiva sem tornar explícita demais uma intenção que emerge do contexto.
- source_word: εὐλογίας
  choice: bajulação
  rationale: No contexto de engano, refere-se a palavras elogiosas usadas para lisonjear, não a uma bênção genuína.
- source_word: ἐξαπατῶσι
  choice: enganam
  rationale: Equivalente corrente e claro para o verbo intensivo de enganar.
- source_word: καρδίας
  choice: coração
  rationale: Mantém a imagem antropológica bíblica do centro interior da pessoa; o singular distributivo soa natural em português.
- source_word: ἀκάκων
  choice: incautos
  rationale: No contexto, destaca pessoas sem suspeita e vulneráveis ao engano, preservando na nota as possibilidades «inocentes» e «sem malícia».
theological_decisions:
- issue: Tradução de Χριστός na expressão paulina κυρίῳ ἡμῶν Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo grego é um título e pode ser traduzido semanticamente como «Messias»; a forma tradicional «Cristo» permanece registrada como alternativa.
- issue: Sentido metafórico de κοιλία
  choice: manter «ventre» no texto
  alternative: apetite ou desejos egoístas
  rationale: A formulação conserva a imagem deliberadamente concreta de Paulo sem limitar seu alcance a um tipo específico de indulgência.
- issue: Amplitude semântica de ἀκάκων
  choice: incautos
  alternative: inocentes ou sem malícia
  rationale: «Incautos» se ajusta diretamente ao contexto de vulnerabilidade ao engano, enquanto as alternativas preservam a dimensão possível de inocência ou ausência de maldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura causal e o contraste do grego foram preservados; as imagens de «servir» e «ventre» permanecem visíveis, e as ambiguidades relevantes são registradas em notas.
