reference: Romans 16:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: pt
  text: E o Deus da paz em breve esmagará Satanás debaixo dos pés de vocês. A graça de nosso Senhor Jesus, o Messias,[a] esteja com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, na forma tradicional: “Jesus Cristo”.'
    reason: Registra a tradução tradicional de Χριστοῦ como “Cristo”, em contraste com a tradução titular “o Messias” adotada no texto.
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: E o Deus da paz
  rationale: Mantém o título paulino em sua forma genitiva tradicional e natural em português; δέ funciona aqui como conexão discursiva e é traduzido por “E”.
- source_word: συντρίψει
  choice: esmagará
  rationale: O futuro ativo anuncia uma ação futura definida. “Esmagará” combina naturalmente com a imagem de sujeição sob os pés e preserva sua força.
- source_word: τὸν Σατανᾶν
  choice: Satanás
  rationale: Emprega a forma consagrada do nome próprio em português, sem substituí-la pela glosa interpretativa “o Adversário”.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: debaixo dos pés de vocês
  rationale: Preserva a metáfora convencional de vitória e sujeição. “De vocês” deixa claro que ὑμῶν é plural e que a promessa se dirige coletivamente aos leitores.
- source_word: ἐν τάχει
  choice: em breve
  rationale: Expressa primariamente proximidade temporal no contexto, evitando que “rapidamente” seja entendido apenas como velocidade da ação.
- source_word: ἡ χάρις
  choice: A graça
  rationale: Conserva o termo paulino central e o artigo na fórmula de bênção, sem parafraseá-lo como “favor”.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: Reproduz naturalmente o genitivo da fórmula “a graça de nosso Senhor” e mantém κύριος como “Senhor”.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός segundo seu sentido titular (“Messias”) e usa o artigo e a vírgula para produzir português claro e natural, sem tratar o título como mero sobrenome.
- source_word: μεθ’ ὑμῶν
  choice: esteja com vocês
  rationale: Supre o verbo implícito exigido pela fórmula de bênção em português. “Com vocês” comunica naturalmente a segunda pessoa do plural.
theological_decisions:
- issue: Tradução de Χριστοῦ na bênção final
  choice: Messias
  alternative: Cristo
  rationale: O termo ainda pode ser entendido como título ligado a Jesus; “Messias” torna explícito seu conteúdo semântico. A forma tradicional e mais semelhante a nome, “Cristo”, é preservada em nota para manter a transparência da alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para tornar explícito o plural de ὑμῶν e evita construções excessivamente literais ou arcaicas.
