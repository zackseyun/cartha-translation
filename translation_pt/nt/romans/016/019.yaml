id: ROM.16.19
reference: Romans 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: pt
  text: Pois a obediência de vocês chegou ao conhecimento de todos.[a] Por isso, alegro-me por causa de vocês; mas quero que sejam sábios quanto ao bem e inocentes quanto ao mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “a obediência de vocês chegou a todos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “puros” ou “sem malícia quanto ao mal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: obediência
  rationale: Em Paulo, o termo normalmente indica uma resposta obediente, e não apenas o ato de ouvir.
- source_word: εἰς πάντας ἀφίκετο
  choice: chegou ao conhecimento de todos
  rationale: A expressão grega diz literalmente que a obediência deles 'chegou a todos'; em português, a formulação explicita naturalmente que sua obediência se tornou amplamente conhecida, sem transformar a afirmação retórica em universalidade matemática.
- source_word: ἐφ’ ὑμῖν οὖν χαίρω
  choice: Por isso, alegro-me por causa de vocês
  rationale: Com χαίρω, ἐπί seguido do dativo pode indicar a causa ou ocasião da alegria. Esta construção é clara e natural em português.
- source_word: σοφοὺς εἶναι εἰς τὸ ἀγαθόν
  choice: sejam sábios quanto ao bem
  rationale: Preserva a ideia de discernimento prático direcionado ao que é bom e mantém o paralelismo com a oração seguinte.
- source_word: ἀκεραίους δὲ εἰς τὸ κακόν
  choice: inocentes quanto ao mal
  rationale: ἀκέραιος pode significar puro, sem mistura ou sem malícia. 'Inocentes' comunica aqui uma relação moralmente não contaminada com o mal.
theological_decisions:
- issue: Alcance de πάντας
  choice: todos, em sentido retórico de ampla divulgação
  alternative: todas as pessoas sem exceção; todos nas igrejas
  rationale: A declaração elogia a reputação amplamente difundida dos cristãos romanos. Não se impõe no texto uma delimitação eclesial nem uma universalidade absoluta.
- issue: Contraste entre σοφούς e ἀκεραίους
  choice: sabedoria quanto ao bem e inocência quanto ao mal
  alternative: habilidade para o bem e pureza diante do mal; simplicidade quanto ao mal
  rationale: A tradução conserva a tensão entre discernimento moral ativo e ausência de participação ou corrupção pelo mal, sem sugerir ingenuidade ou ignorância.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com 'vocês' para o plural. A pontuação conserva a relação lógica entre o elogio e a exortação; o paralelismo 'quanto ao bem... quanto ao mal' reflete a estrutura grega.
