source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: pt
  text: Timóteo, meu cooperador, manda saudações a vocês; também Lúcio, Jasom e Sosípatro, meus parentes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus compatriotas” ou “pessoas do meu povo”. O termo grego pode indicar parentes consanguíneos ou um vínculo mais amplo de parentesco e origem étnica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: manda saudações a vocês
  rationale: Em contexto epistolar, ἀσπάζομαι expressa o ato de saudar ou enviar saudações. A formulação é natural em português e deixa claro que os destinatários são plurais.
- source_word: συνεργός
  choice: cooperador
  rationale: Expressa alguém que trabalha junto com Paulo numa tarefa compartilhada, sem acrescentar uma especificação ministerial ausente do texto.
- source_word: Λούκιος
  choice: Lúcio
  rationale: Forma tradicional e corrente do nome em português.
- source_word: Ἰάσων
  choice: Jasom
  rationale: Forma aportuguesada tradicional do nome grego, de leitura clara em português.
- source_word: Σωσίπατρος
  choice: Sosípatro
  rationale: Representa a forma completa presente neste versículo, distinguindo-a da forma abreviada Sópater encontrada em outro contexto.
- source_word: συγγενεῖς
  choice: parentes
  rationale: É o equivalente português mais natural para relações de parentesco, embora o termo grego possa também indicar parentesco mais amplo ou vínculo étnico; essa amplitude é registrada em nota.
theological_decisions:
- issue: Sentido de συγγενεῖς μου no uso paulino
  choice: meus parentes
  alternative: meus compatriotas ou meus irmãos de raça, isto é, outros judeus
  rationale: O grego não determina se Paulo fala de parentes consanguíneos próximos ou de pessoas ligadas por parentesco étnico. O texto principal usa a expressão portuguesa natural, e a nota preserva a alternativa sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Manda saudações” reproduz naturalmente a fórmula epistolar; “assim como” coordena Timóteo com os outros três homens sem repetir o verbo.
