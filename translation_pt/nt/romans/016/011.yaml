  source_fidelity: O texto traduz adequadamente os dois imperativos ἀσπάσασθε como “Saúdem”, preserva o nome Herodião, mantém a amplitude de συγγενής em “meu parente” com alternativa explicativa em nota, e reproduz de modo conciso a associação indeterminada em τοὺς ἐκ τῶν Ναρκίσσου (“os de Narciso”). “Que estão no Senhor” conserva a formulação paulina ἐν κυρίῳ sem paráfrase interpretativa.
