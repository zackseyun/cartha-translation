id: ROM.16.11
reference: Romans 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: pt
  text: Saúdem Herodião, meu parente[a]. Saúdem os de Narciso[b] que estão no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu compatriota judeu”; o termo grego pode designar um parente de sangue ou alguém do mesmo povo de Paulo.
    reason: lexical_alternative
  - marker: b
    text: Provavelmente se refere aos membros da casa ou da propriedade de Narciso que eram fiéis.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo plural, em uma seção de saudações epistolares, pede a forma direta e natural “Saúdem”.
- source_word: Ἡρῳδίωνα
  choice: Herodião
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio grego.
- source_word: συγγενῆ μου
  choice: meu parente
  rationale: “Parente” é a opção mais natural em português, embora o termo grego também possa designar alguém do mesmo povo; essa amplitude é registrada em nota.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: os de Narciso
  rationale: A formulação concisa preserva a associação com Narciso sem acrescentar ao texto principal o substantivo implícito “casa” ou “família”.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: que estão no Senhor
  rationale: Mantém a expressão paulina “no Senhor” e sua ressonância teológica, sem reduzi-la a uma paráfrase como “que são cristãos”.
- source_word: κυρίῳ
  choice: Senhor
  rationale: “Senhor” é a tradução corrente e contextualmente apropriada de κύριος nesta expressão cristã paulina.
theological_decisions:
- issue: Sentido de συγγενής na saudação de Paulo
  choice: meu parente
  alternative: meu compatriota judeu
  rationale: O termo pode indicar parentesco de sangue ou, em uso mais amplo, alguém do mesmo povo de Paulo. Como o contexto não decide a questão, a tradução principal usa a leitura familiar mais natural e registra a alternativa em nota.
- issue: Identidade dos associados a Narciso
  choice: os de Narciso
  alternative: os da casa de Narciso
  rationale: A expressão grega indica pessoas associadas a Narciso, provavelmente integrantes de sua casa ou propriedade, mas não contém explicitamente o substantivo “casa”. A redação preserva essa concisão e deixa a explicitação para a nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural adequados a leitores brasileiros. Conserva-se a expressão paulina “no Senhor” e a concisão ambígua de “os de Narciso”.
