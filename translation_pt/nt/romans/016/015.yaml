id: ROM.16.15
reference: Romans 16:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: pt
  text: Saúdem Filólogo e Júlia[a], Nereu e sua irmã, Olimpas e todos os santos que estão com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Júlias”, se o nome for entendido como masculino; a forma grega é geralmente compreendida como o nome feminino “Júlia”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo aoristo médio, na segunda pessoa do plural, usado como orientação para transmitir saudações; “Saúdem” é a forma concisa e natural em português epistolar.
- source_word: Φιλόλογον
  choice: Filólogo
  rationale: Nome próprio vertido segundo a forma tradicional em português, com acento para indicar a pronúncia.
- source_word: Ἰουλίαν
  choice: Júlia
  rationale: A forma acusativa é mais naturalmente entendida como o nome feminino Júlia; a possibilidade de um nome masculino é registrada em nota.
- source_word: Νηρέα
  choice: Nereu
  rationale: Forma portuguesa tradicional do nome próprio grego.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: sua irmã
  rationale: ἀδελφή significa “irmã”, e αὐτοῦ retoma naturalmente Nereu; a construção possessiva é idiomática em português.
- source_word: Ὀλυμπᾶν
  choice: Olimpas
  rationale: Transliteração portuguesa convencional do nome próprio Ὀλυμπᾶς.
- source_word: τοὺς σὺν αὐτοῖς
  choice: que estão com eles
  rationale: σύν com o dativo expressa associação; a oração relativa explicita naturalmente em português o valor substantivado do artigo grego.
- source_word: πάντας ἁγίους
  choice: todos os santos
  rationale: Em Paulo, ἅγιοι designa habitualmente os fiéis como consagrados a Deus. “Santos” preserva esse uso paulino tradicional sem acrescentar uma explicação ao texto.
theological_decisions:
- issue: Sentido de ἅγιοι numa lista paulina de saudações
  choice: santos
  alternative: santos de Deus; povo santo de Deus
  rationale: O termo identifica os demais fiéis ligados às pessoas citadas. “Santos” conserva a designação paulina estabelecida e não precisa implicar a noção posterior de canonização.
- issue: Gênero do nome Ἰουλίαν
  choice: Júlia
  alternative: Júlias, se entendido como nome masculino
  rationale: A forma é mais provavelmente o nome feminino Júlia. Como houve discussão histórica sobre a possibilidade masculina, a alternativa é preservada em nota sem substituir a leitura mais natural.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém-se a estrutura de saudação do original, usando formas portuguesas tradicionais para os nomes e preservando em nota a ambiguidade discutida de Ἰουλίαν.
