id: ROM.16.16
reference: Romans 16:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: pt
  text: Saúdem uns aos outros com um beijo santo.[b] Todas as igrejas do Messias saúdam vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todas as igrejas de Cristo saúdam vocês.”'
    reason: alternative_rendering
  - marker: b
    text: O “beijo santo” era uma forma de saudação culturalmente reconhecida, que expressava afeto santo e comunhão entre os fiéis.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Saúdem uns aos outros
  rationale: O imperativo de ἀσπάζομαι pede uma saudação, e ἀλλήλους expressa reciprocidade. A formulação é natural, clara e mantém a força imperativa do grego.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: com um beijo santo
  rationale: A preposição ἐν tem aqui sentido instrumental ou associativo; φίλημα significa “beijo”, e ἁγίῳ o caracteriza como santo, próprio da comunhão dos fiéis.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: saúdam vocês
  rationale: A forma verbal presente expressa a saudação enviada pelas igrejas. “Vocês” torna explícito em português corrente que ὑμᾶς é plural.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Todas as igrejas
  rationale: Preserva a abrangência de πᾶσαι e reproduz de modo idiomático a construção grega com artigo.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός conserva aqui seu valor titular, correspondente a “Messias”; o genitivo indica pertencimento ou associação.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: “Messias” explicita o sentido do título grego Χριστός sem transformar a expressão em mero nome próprio. “Cristo” permanece uma tradução tradicional e linguisticamente possível, indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Saúdem” preserva o tom exortativo; “vocês” comunica naturalmente o plural do destinatário. A ordem das notas segue sua ocorrência no texto, embora os marcadores mantenham as letras fornecidas.
