  source_fidelity: O texto traduz com precisão as duas orações do grego. “Saúdem uns aos outros” reproduz adequadamente o imperativo recíproco Ἀσπάσασθε ἀλλήλους; “com um beijo santo” expressa naturalmente ἐν φιλήματι ἁγίῳ; e “Todas as igrejas do Messias saúdam vocês” preserva tanto o alcance de πᾶσαι quanto a relação genitiva em τοῦ Χριστοῦ. A nota alternativa “de Cristo” é legítima.
