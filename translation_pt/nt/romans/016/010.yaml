id: ROM.16.10
reference: Romans 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: pt
  text: Saúdem Apeles, aprovado no Messias.[a] Saúdem os da casa de Aristóbulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, na forma mais tradicional, “em Cristo”.
    reason: Registra a tradução tradicional de ἐν Χριστῷ sem substituir no texto principal o valor titular de Χριστός.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo plural pede que os destinatários transmitam saudações. “Saúdem” é direto, natural e mantém a repetição do texto grego.
- source_word: Ἀπελλῆν
  choice: Apeles
  rationale: Transliteração portuguesa corrente do nome pessoal grego.
- source_word: τὸν δόκιμον
  choice: que foi aprovado
  rationale: δόκιμος descreve alguém provado e considerado genuíno ou aprovado. A oração relativa soa natural em português e conserva o caráter elogioso sem acrescentar uma qualidade específica, como “fidelidade”.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém a preposição e a linguagem paulina de esfera ou união, traduzindo Χριστός como título. A forma tradicional “em Cristo” é registrada em nota.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: os da casa de Aristóbulo
  rationale: A expressão indica pessoas ligadas à casa, família ou propriedade de Aristóbulo, sem necessariamente incluir o próprio Aristóbulo. “Os da casa” é claro e idiomático.
theological_decisions:
- issue: Tradução de Χριστῷ na expressão paulina ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: “Messias” preserva o valor titular de Χριστός, enquanto “no” mantém a expressão paulina sem a parafrasear como mera identidade religiosa. A leitura tradicional permanece disponível em nota.
- issue: Sentido da aprovação de Apeles
  choice: que foi aprovado no Messias
  alternative: comprovadamente fiel no Messias
  rationale: A formulação escolhida conserva a amplitude de δόκιμος e a possível tensão da ligação de ἐν Χριστῷ, evitando especificar que a qualidade comprovada foi necessariamente a fidelidade.
translation_notes:
  register: Português moderno, claro e digno, com formas compreensíveis tanto no Brasil quanto internacionalmente. A repetição de “Saúdem” acompanha a estrutura enfática do grego; “os da casa de Aristóbulo” evita a formulação opaca “os de Aristóbulo”.
