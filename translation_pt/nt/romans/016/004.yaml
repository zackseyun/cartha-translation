id: ROM.16.4
reference: Romans 16:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: pt
  text: os quais arriscaram o próprio pescoço[a] pela minha vida, a quem agradeço não somente eu, mas também todas as igrejas dos gentios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa «pescoço» no singular numa expressão que indica expor-se a perigo mortal.
    reason: explicação_idiomática
  - marker: b
    text: 'Ou: «das nações».'
    reason: alternativa_lexical
lexical_decisions:
- source_word: οἵτινες
  choice: os quais
  rationale: Introduz uma oração relativa descritiva que retoma Priscila e Áquila; a forma é clara e adequada ao registro digno do contexto.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: pela minha vida
  rationale: Neste contexto, ψυχή designa a vida de Paulo, não especificamente a alma imaterial; ὑπέρ indica que o risco foi assumido em favor dela.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: puseram o próprio pescoço em risco
  rationale: Preserva a imagem concreta do pescoço e comunica naturalmente o sentido idiomático de se expor a perigo mortal. O singular coletivo acompanha o grego τράχηλον.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: A eles não somente eu agradeço, mas também
  rationale: Mantém a ênfase de que Paulo não é o único a lhes agradecer e expressa naturalmente o dativo exigido por εὐχαριστῶ.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: todas as igrejas
  rationale: Reproduz o plural definido e a abrangência da expressão grega.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No uso paulino e neste contexto, ἔθνη se refere aos não judeus; 'gentios' preserva essa dimensão étnico-religiosa.
theological_decisions:
- issue: Sentido de ψυχή
  choice: vida
  alternative: alma
  rationale: A referência é ao perigo mortal enfrentado em favor da sobrevivência de Paulo, não a uma definição antropológica da alma.
- issue: Sentido de ἐθνῶν
  choice: gentios
  alternative: nações
  rationale: A expressão designa mais naturalmente as comunidades cristãs formadas entre os não judeus, preservando o contraste entre judeus e gentios relevante em Romanos.
- issue: Imagem de τράχηλον ὑπέθηκαν
  choice: puseram o próprio pescoço em risco
  alternative: arriscaram a própria vida
  rationale: A opção escolhida conserva a metáfora vívida do original sem obscurecer seu sentido de exposição a perigo mortal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem concreta do original foi mantida em formulação idiomática compreensível; 'gentios' conserva o sentido paulino, com a alternativa literal registrada em nota.
