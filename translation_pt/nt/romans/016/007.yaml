source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: pt
  text: Saúdem Andrônico e Júnia[a], meus parentes[b] e companheiros de prisão. Eles são notáveis entre os apóstolos[c] e já estavam no Messias antes de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Júnia: alternativamente, “Júnias”, um nome masculino; a forma feminina é mais provável à luz do grego e do uso histórico.'
    reason: alternative_reading
  - marker: b
    text: Ou “meus compatriotas”; o termo pode indicar parentes ou pessoas do mesmo povo de Paulo.
    reason: lexical_alternative
  - marker: c
    text: Ou “eminentes entre os apóstolos”; a expressão também pode ser entendida como “bem conhecidos pelos apóstolos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo epistolar direto e natural em português, com o sentido de transmitir saudações.
- source_word: Ἀνδρόνικον
  choice: Andrônico
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: Ἰουνίαν
  choice: Júnia
  rationale: A forma grega corresponde mais naturalmente ao nome feminino Júnia, bem documentado no uso antigo; a alternativa masculina é registrada em nota.
- source_word: συγγενεῖς μου
  choice: meus parentes
  rationale: Tradução direta, sem excluir em nota o possível sentido mais amplo de compatriotas ou membros do mesmo povo.
- source_word: συναιχμαλώτους μου
  choice: companheiros de prisão
  rationale: Expressa de modo claro e atual a ideia concreta de pessoas aprisionadas juntamente com Paulo.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: notáveis entre os apóstolos
  rationale: Mantém a leitura sintaticamente mais direta e o sentido de destaque, enquanto a nota preserva a possibilidade de que fossem bem conhecidos pelos apóstolos.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: já estavam no Messias antes de mim
  rationale: O perfeito indica uma condição iniciada anteriormente e ainda relevante; “já estavam” comunica a anterioridade sem transformar explicitamente a expressão em uma fórmula de conversão. “Messias” preserva Χριστός como título.
theological_decisions:
- issue: Identidade e gênero de Ἰουνίαν
  choice: Júnia, nome feminino
  alternative: Júnias, nome masculino
  rationale: A evidência linguística e o uso histórico favorecem o nome feminino, mas a alternativa tradicional é informada por transparência.
- issue: Sentido de ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: notáveis entre os apóstolos
  alternative: bem conhecidos pelos apóstolos
  rationale: A construção pode indicar destaque dentro do grupo apostólico ou reconhecimento por parte dos apóstolos. O texto principal segue a leitura mais direta sem ocultar a alternativa debatida.
- issue: Sentido de συγγενεῖς
  choice: parentes
  alternative: compatriotas ou membros do mesmo povo de Paulo
  rationale: O termo pode indicar parentesco familiar ou solidariedade étnica; a nota conserva essa ambiguidade contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. O plural “Saúdem” evita regionalismo excessivo; “companheiros de prisão” é claro e idiomático. As notas preservam as ambiguidades históricas e teológicas sem sobrecarregar o versículo.
