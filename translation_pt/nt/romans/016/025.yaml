  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: pt
  text: '[a] Àquele, porém, que é capaz de fortalecê-los segundo o meu evangelho e a proclamação de Jesus, o Messias, segundo a revelação do mistério mantido em segredo por longas eras,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 25–27 formam uma doxologia final que aparece em lugares diferentes nos manuscritos antigos. Ela se encontra no fim do capítulo 14 na tradição majoritária bizantina, depois do capítulo 15 no mais antigo papiro sobrevivente e aqui, no fim do capítulo 16, em importantes manuscritos do século IV e na tradição latina. Alguns manuscritos a incluem em mais de um lugar, enquanto uns poucos a omitem por completo. A maioria das traduções modernas a mantém aqui como conclusão da carta de Paulo.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: fortalecê-los
  rationale: Expressa a ação de tornar os fiéis firmes e estáveis, com linguagem natural e clara em português.
- source_word: τὸ κήρυγμα
  choice: a proclamação
  rationale: Comunica o anúncio público da mensagem, preservando o caráter ativo de κήρυγμα.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: Traduz Χριστός como o título 'Messias' e mantém a construção genitiva grega sem decidir se é a proclamação feita por Jesus ou a proclamação a respeito dele.
- source_word: μυστηρίου
  choice: mistério
  rationale: Mantém o termo teológico de revelação divina antes oculta, sem sugerir um enigma insolúvel.
- source_word: σεσιγημένου
  choice: mantido em segredo
  rationale: No contexto de um mistério posteriormente revelado, transmite o sentido de algo que permaneceu não divulgado; o perfeito passivo indica um estado continuado.
- source_word: χρόνοις αἰωνίοις
  choice: por longas eras
  rationale: A expressão temporal aponta para extensos períodos passados; esta formulação é natural em português e evita a impressão inadequada de que o segredo permaneceu oculto por uma eternidade absoluta.
theological_decisions:
- issue: Ambiguidade do genitivo em κήρυγμα Ἰησοῦ Χριστοῦ
  choice: a proclamação de Jesus, o Messias
  alternative: a proclamação a respeito de Jesus, o Messias / a proclamação feita por Jesus, o Messias
  rationale: A forma portuguesa com 'de' preserva a ambiguidade genuína entre genitivo objetivo e subjetivo, sem impor uma interpretação.
- issue: Valor titular de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Representa explicitamente o título real e escatológico do termo grego, em linguagem compreensível, sem tratá-lo apenas como nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a estrutura de doxologia ainda incompleta neste versículo e termina com vírgula para indicar sua continuação nos versículos seguintes.
