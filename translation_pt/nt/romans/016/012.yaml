id: ROM.16.12
reference: Romans 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: pt
  text: Saúdem Trifena e Trifosa, que têm trabalhado arduamente no Senhor.[a] Saúdem Pérside, a amada,[b] que muito trabalhou no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que se esforçam no Senhor” ou “que têm labutado no Senhor”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “a amada”, sem o possessivo “minha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo plural em uma lista epistolar de saudações é expresso de modo natural e conciso por “Saúdem”.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trifena e Trifosa
  rationale: Os nomes próprios são transliterados em formas naturais e reconhecíveis em português.
- source_word: τὰς κοπιώσας
  choice: que têm trabalhado arduamente
  rationale: A expressão descreve as duas mulheres e comunica o esforço intenso de κοπιάω; o presente perfeito português apresenta esse trabalho passado como ainda relevante no elogio.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a fórmula paulina e sua amplitude relacional, sem reduzi-la a “para o Senhor” ou “a serviço do Senhor”.
- source_word: Περσίδα
  choice: Pérside
  rationale: Transliteração portuguesa do nome próprio, com acento para orientar a pronúncia.
- source_word: τὴν ἀγαπητήν
  choice: a amada
  rationale: Reproduz o artigo e o adjetivo gregos sem acrescentar o possessivo “minha”, ausente do texto.
- source_word: ἥτις
  choice: que
  rationale: Introduz naturalmente em português a oração que caracteriza Pérside, sem explicitar em excesso a nuance qualitativa do pronome.
- source_word: πολλὰ ἐκοπίασεν
  choice: muito trabalhou
  rationale: Mantém a ênfase de πολλὰ na grande extensão do esforço e conserva a ligação lexical com o trabalho árduo mencionado antes.
theological_decisions:
- issue: Sentido de ἐν κυρίῳ na fórmula paulina de serviço
  choice: no Senhor
  alternative: para o Senhor; a serviço do Senhor
  rationale: “No Senhor” mantém a textura teológica da expressão e permite a ideia de trabalho realizado na esfera da união e relação com o Senhor, sem restringi-la a finalidade ou benefício.
- issue: Ausência de possessivo em τὴν ἀγαπητήν
  choice: a amada
  alternative: minha amada
  rationale: O grego não contém μου (“minha”); por isso, não se acrescenta uma relação possessiva ou pessoal que o texto não declara.
- issue: Aspecto verbal das duas referências ao trabalho
  choice: “têm trabalhado” para o particípio e “trabalhou” para o aoristo indicativo
  alternative: “trabalham” e “tem trabalhado”
  rationale: 'A tradução distingue naturalmente as formas gregas: o particípio caracteriza o labor reconhecido de Trifena e Trifosa, enquanto o aoristo resume o muito que Pérside realizou. O contexto não exige que se elimine essa diferença.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Trabalhado arduamente” explicita o esforço inerente a κοπιάω sem recorrer ao menos corrente “labutado”; “no Senhor” preserva a formulação paulina. Os marcadores de todas as notas aparecem no texto principal.
