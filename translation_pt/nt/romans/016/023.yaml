  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: pt
  text: Gaio, que me hospeda e hospeda toda a igreja, manda saudações a vocês. Erasto, o tesoureiro da cidade[a], manda saudações a vocês, e Quarto, o irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o administrador da cidade”. O termo grego pode designar de modo mais amplo um encarregado ou administrador público, embora “tesoureiro” corresponda ao provável cargo municipal neste contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀσπάζεται
  choice: manda saudações a vocês
  rationale: No encerramento epistolar, o verbo comunica uma saudação enviada. Esta formulação é natural em português moderno e mantém explícitos tanto o ato de saudar quanto os destinatários.
- source_word: ξένος
  choice: que hospeda
  rationale: Neste contexto, ξένος designa quem acolhe outras pessoas como anfitrião. A construção verbal evita a rigidez de repetir “anfitrião” e expressa claramente que Gaio hospeda Paulo e também membros de toda a igreja.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: toda a igreja
  rationale: ἐκκλησία refere-se aqui à comunidade cristã, e ὅλης ressalta a amplitude da hospitalidade de Gaio. “Toda a igreja” é a forma corrente e direta em português.
- source_word: οἰκονόμος τῆς πόλεως
  choice: o tesoureiro da cidade
  rationale: οἰκονόμος pode indicar um administrador ou encarregado; em contexto municipal, “tesoureiro da cidade” expressa de modo claro o provável cargo público, enquanto uma nota preserva o sentido mais amplo possível.
- source_word: ἀδελφός
  choice: o irmão
  rationale: O grego traz o substantivo masculino singular com artigo, sem possessivo explícito. “O irmão” preserva essa forma e identifica Quarto como membro da fraternidade cristã sem acrescentar “nosso”.
theological_decisions:
- issue: Tradução de ἐκκλησία no contexto da saudação
  choice: igreja
  alternative: assembleia; comunidade
  rationale: No uso paulino, o termo normalmente designa a comunidade cristã. “Igreja” é preciso e reconhecível, sem definir além do texto sua estrutura institucional.
- issue: Termo familiar masculino ἀδελφός
  choice: o irmão
  alternative: nosso irmão; o companheiro na fé
  rationale: O referente é um homem individual, e o texto usa o termo familiar masculino sem possessivo. A tradução conserva tanto o gênero quanto a formulação sucinta do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Manda saudações a vocês” reproduz o tom epistolar sem arcaísmo. A construção “que hospeda a mim e a toda a igreja” comunica naturalmente a dupla relação expressa no grego. O marcador da nota foi colocado junto de “tesoureiro da cidade”, expressão à qual a nota se refere.
