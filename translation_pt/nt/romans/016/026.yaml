  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: pt
  text: mas[a] agora foi revelado e, por meio das Escrituras proféticas, foi dado a conhecer a todas as nações, segundo a ordem do Deus eterno, para a obediência da fé,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo dá continuidade à doxologia final (Romanos 16:25–27). Veja a nota em Romanos 16:25 sobre sua posição e as evidências dos manuscritos.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: foi revelado
  rationale: O particípio retoma o “mistério” do versículo 25 e indica que aquilo que estava oculto foi trazido à luz. A forma verbal finita produz português natural sem romper a continuidade da doxologia.
- source_word: γραφαῖς προφητικαῖς
  choice: Escrituras proféticas
  rationale: Neste contexto, γράφαις designa escritos sagrados, qualificados como proféticos; a maiúscula ajuda a sinalizar esse sentido reconhecido sem acrescentar conteúdo.
- source_word: ἐπιταγήν
  choice: ordem
  rationale: Expressa uma determinação autorizada de Deus. “Ordem” é corrente, clara e preserva a força diretiva do termo grego.
- source_word: ὑπακοὴν πίστεως
  choice: obediência da fé
  rationale: Mantém a relação genitiva deliberadamente aberta — podendo envolver obediência que procede da fé ou obediência que consiste em fé — e preserva a correspondência verbal com Romanos 1:5.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Representa diretamente o alcance universal da expressão grega, sem restringi-la antecipadamente ao sentido técnico de “gentios”.
- source_word: γνωρισθέντος
  choice: foi dado a conhecer
  rationale: Distingue este verbo de φανερωθέντος e comunica a divulgação do mistério a todas as nações.
theological_decisions:
- issue: Sentido de ὑπακοὴ πίστεως
  choice: obediência da fé
  alternative: obediência que vem da fé / obediência que consiste na fé
  rationale: O genitivo grego admite mais de uma relação semântica. A formulação literal e natural preserva a ambiguidade e a tensão teológica, em vez de decidir por uma interpretação.
- issue: Referente implícito dos particípios
  choice: manter o sujeito implícito, retomando “mistério” em Romanos 16:25
  alternative: inserir explicitamente “o mistério”
  rationale: O grego depende sintaticamente do versículo anterior. Não repetir o substantivo conserva a estrutura contínua da doxologia e evita explicitação desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando a dependência sintática do versículo anterior e a vírgula final que conduz ao versículo 27.
