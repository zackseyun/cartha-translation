source:
  edition: SBLGNT
  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: pt
  text: Saúdem Rufo[a], escolhido no Senhor, e sua mãe, que também é mãe para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eleito no Senhor”. O termo grego também pode ter o sentido de “distinto” ou “notável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo plural pede que os destinatários transmitam uma saudação; “Saúdem” é conciso, natural e adequado às saudações finais de Paulo.
- source_word: Ῥοῦφον
  choice: Rufo
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego Ῥοῦφος.
- source_word: τὸν ἐκλεκτὸν
  choice: escolhido
  rationale: Preserva o sentido principal de alguém escolhido, sem recorrer ao termo mais técnico “eleito”; a nota registra a possível nuance de alguém distinto ou notável.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação paulina que indica esfera ou relação com o Senhor, sem decidir se a escolha é especificamente efetuada pelo Senhor.
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: a mãe dele, que tem sido mãe para mim
  rationale: Explicita em português natural a elipse grega, evitando a provável leitura equivocada de que Paulo e Rufo eram irmãos biológicos, ao mesmo tempo que preserva o calor da relação familiar.
theological_decisions:
- issue: Sentido de ἐκλεκτὸν ἐν κυρίῳ
  choice: “escolhido no Senhor”, preservando uma escolha definida em relação ao Senhor sem especificar um sistema doutrinário
  alternative: “notável no Senhor” ou “eleito no Senhor” em sentido soteriológico técnico
  rationale: O adjetivo pode indicar eleição divina ou alguém seleto/distinto. O texto principal conserva a tensão, e a nota registra a alternativa lexical.
- issue: Sentido de “a mãe dele e minha”
  choice: A mãe de Rufo exerceu para Paulo uma relação materna de afeto e cuidado
  alternative: Ela seria literalmente a mãe biológica tanto de Rufo quanto de Paulo
  rationale: O contexto epistolar favorece fortemente a relação figurada; a formulação portuguesa comunica essa relação sem apagar a imagem familiar do original.
translation_notes:
  register: Português moderno, digno e acessível, com a forma brasileira corrente do imperativo plural. “Que tem sido mãe para mim” comunica naturalmente a elipse afetiva do grego; “no Senhor” preserva a formulação e a ambiguidade teológica do original.
