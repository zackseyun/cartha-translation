id: ROM.16.14
reference: Romans 16:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: pt
  text: Saúdem Asíncrito, Flegonte, Hermes, Pátrobas, Hermas e os irmãos que estão com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “os irmãos associados a eles”; provavelmente se refere a outros cristãos ligados a esses homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo aoristo médio, na segunda pessoa do plural, introduz uma saudação direta. “Saúdem” é natural, conciso e adequado ao contexto epistolar.
- source_word: Ἀσύγκριτον
  choice: Asíncrito
  rationale: Forma tradicionalmente adaptada à fonologia e à ortografia do português para este nome pessoal grego.
- source_word: Φλέγοντα
  choice: Flegonte
  rationale: Transliteração adaptada segundo o uso português para este nome pessoal.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Forma portuguesa convencional do nome pessoal; embora coincida com o nome da divindade grega, aqui o contexto indica claramente uma pessoa saudada.
- source_word: Πατροβᾶν
  choice: Pátrobas
  rationale: Transliteração adaptada ao português, com acento para indicar a pronúncia.
- source_word: Ἑρμᾶν
  choice: Hermas
  rationale: Transliteração que preserva a distinção entre Ἑρμᾶν e o nome anterior, Ἑρμῆν (“Hermes”).
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: os irmãos que estão com eles
  rationale: “Irmãos” preserva o plural masculino explícito de ἀδελφούς, usado por Paulo para membros da comunidade cristã. A oração “que estão com eles” expressa com naturalidade a associação indicada por σὺν αὐτοῖς, sem definir sua natureza além do que o grego permite.
theological_decisions:
- issue: Sentido de ἀδελφούς na saudação comunitária
  choice: irmãos
  alternative: irmãos e irmãs; outros irmãos na fé
  rationale: O grego apresenta um plural gramaticalmente masculino. Como o contexto não torna explícita a presença de mulheres, “irmãos” preserva a forma do texto e seu possível uso comunitário sem acrescentar uma especificação de gênero ausente no original.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais consagradas ou naturalmente adaptadas ao português. O plural verbal “Saúdem” é amplamente compreensível no português internacional e especialmente natural para leitores brasileiros.
