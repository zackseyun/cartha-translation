id: ROM.16.1
reference: Romans 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: pt
  text: Recomendo-lhes Febe, nossa irmã, que também é diácona[a] da igreja em Cencreia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serva” ou “ministra” da igreja em Cencreia. O termo grego diáconos pode indicar tanto uma função ministerial reconhecida como, em sentido mais geral, alguém que serve.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Recomendo
  rationale: No contexto epistolar, o verbo apresenta Febe favoravelmente aos destinatários. “Recomendo” é natural em português e comunica com clareza a função de uma carta de recomendação.
- source_word: δὲ
  choice: transição não explicitada
  rationale: Aqui δέ assinala uma transição leve, não um contraste forte. O português moderno pode deixar essa transição sem conjunção, evitando acrescentar um “agora” temporal ausente do grego.
- source_word: Φοίβην
  choice: Febe
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Φοίβη.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: nossa irmã
  rationale: Preserva diretamente a linguagem familiar e comunitária paulina, sem inserir a explicação interpretativa “na fé”.
- source_word: οὖσαν καὶ
  choice: que também é
  rationale: Expressa de maneira idiomática a construção participial e conserva a força aditiva de καί.
- source_word: διάκονον
  choice: diácona
  rationale: A ligação com uma igreja local específica favorece a possibilidade de uma função ministerial reconhecida. A forma feminina concorda naturalmente com Febe; como o termo grego também pode ter sentido geral, as alternativas são registradas em nota.
- source_word: τῆς ἐκκλησίας
  choice: da igreja
  rationale: Em Paulo, ἐκκλησία normalmente designa a congregação cristã; “igreja” é a tradução corrente e clara.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: em Cencreia
  rationale: Emprega a forma portuguesa corrente do topônimo e traduz naturalmente a expressão locativa com ἐν.
theological_decisions:
- issue: Se διάκονον designa serviço em sentido geral ou uma função ministerial reconhecida
  choice: diácona
  alternative: serva; ministra
  rationale: A expressão “da igreja em Cencreia” sugere uma relação identificável com a congregação local e permite entender o termo como função eclesial. “Diácona” preserva essa possibilidade sem definir estruturas denominacionais posteriores; a nota mantém aberta a amplitude lexical do grego.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
