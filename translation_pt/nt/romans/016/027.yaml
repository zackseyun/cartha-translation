source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: pt
  text: ao único Deus sábio, por meio de Jesus, o Messias, a quem seja a glória para sempre. Amém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo conclui a doxologia final (Romanos 16:25–27). Como indicado na nota de Romanos 16:25, a presença e a posição dessa doxologia variam de modo significativo entre os manuscritos antigos; ela é mantida aqui conforme a tradição majoritária bizantina.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: único
  rationale: Em concordância com «Deus sábio», expressa que somente Deus possui sabedoria suprema; «único» é claro e idiomático em português.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, indica mediação; «por meio de Jesus» reproduz esse valor com naturalidade.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz o título grego, em vez de apenas transliterá-lo, e usa o artigo necessário na formulação portuguesa «Jesus, o Messias».
- source_word: ᾧ
  choice: a quem
  rationale: Conserva o pronome relativo dativo e não elimina a possível ambiguidade sintática entre Deus e Jesus, o Messias, como antecedente.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a forma portuguesa natural do idiomatismo grego literalmente relacionado às eras, com sentido de duração perpétua.
theological_decisions:
- issue: Antecedente de ᾧ («a quem»)
  choice: 'Manter a formulação relativa ambígua: «a quem seja a glória»'
  alternative: Explicitar «a Deus seja a glória» ou «a Jesus seja a glória»
  rationale: A construção grega permite tensão quanto ao antecedente imediato; explicitá-lo resolveria interpretativamente o que o texto não torna inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. A abertura em minúscula preserva o fato de que o versículo continua a frase iniciada em Romanos 16:25. «Seja a glória» mantém o caráter doxológico e a elipse verbal do grego sem soar artificial.
