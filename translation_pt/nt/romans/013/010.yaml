  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: pt
  text: O amor não faz mal ao próximo; portanto, o amor é o cumprimento da lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: o amor
  rationale: É o equivalente moderno e natural de ἀγάπη e preserva a repetição enfática do termo nas duas orações.
- source_word: τῷ πλησίον
  choice: ao próximo
  rationale: A expressão portuguesa consagrada comunica de modo natural a pessoa afetada pela ação, com sentido ético geral.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: não faz mal
  rationale: No contexto, a combinação exprime praticar ou causar algo mau contra outra pessoa. “Não faz mal” é clara, idiomática e preserva o sentido sem tornar κακόν excessivamente abstrato.
- source_word: οὖν
  choice: portanto
  rationale: Marca claramente a conclusão inferida da primeira oração.
- source_word: πλήρωμα
  choice: cumprimento
  rationale: Indica aquilo que leva a lei à sua realização ou completude. “Cumprimento” é claro no contexto e preserva a forma nominal da frase grega.
- source_word: νόμου
  choice: da lei
  rationale: O contexto aponta para a lei como categoria reconhecível no argumento de Paulo; o artigo em português torna a expressão natural.
theological_decisions:
- issue: Relação do amor com a lei
  choice: o amor é o cumprimento da lei
  alternative: o amor é a plenitude da lei; o amor cumpre a lei
  rationale: A formulação mantém a oração nominal grega e a afirmação teológica de Paulo, sem transformá-la em imperativo nem explicar além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A repetição de “o amor” foi mantida para refletir a ênfase do original.
