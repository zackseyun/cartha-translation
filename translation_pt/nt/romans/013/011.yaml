id: ROM.13.11
reference: Romans 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: pt
  text: 'E façam isso, conscientes do tempo: já é hora de vocês despertarem do sono[a], pois agora a nossa salvação está mais perto do que quando cremos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem “nós” em vez de “vocês”: “já é hora de despertarmos do sono”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “do que quando cremos pela primeira vez”. O grego diz simplesmente “quando cremos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: E façam isso
  rationale: A expressão retoma as exortações anteriores. O imperativo implícito é explicitado em português para produzir uma ligação discursiva natural, sem acrescentar uma nova ordem.
- source_word: εἰδότες τὸν καιρόν
  choice: conscientes do tempo
  rationale: Preserva a construção participial e o sentido de reconhecimento do momento decisivo, sem reduzir καιρός a mero tempo cronológico.
- source_word: ὅτι ὥρα ἤδη
  choice: já é hora
  rationale: Expressa de modo direto a urgência presente indicada por ἤδη e mantém a força nominal de ὥρα.
- source_word: ὑμᾶς ἐξ ὕπνου ἐγερθῆναι
  choice: de vocês despertarem do sono
  rationale: Representa o pronome plural da leitura do SBLGNT e conserva a metáfora do despertar do sono em linguagem atual e digna.
- source_word: νῦν γὰρ
  choice: pois agora
  rationale: Mantém tanto a função explicativa de γάρ quanto a referência enfática ao momento presente em νῦν.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: a nossa salvação está mais perto
  rationale: É uma formulação portuguesa natural que conserva a aproximação da salvação sem definir além do texto em que sentido ou etapa ela se aproxima.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: do que quando cremos
  rationale: Segue a simplicidade do grego, que não contém palavra correspondente a “pela primeira vez”, e preserva o aoristo como referência ao ato passado de crer.
theological_decisions:
- issue: A salvação é descrita como mais próxima agora do que no momento em que os leitores creram.
  choice: a nossa salvação está mais perto
  alternative: a nossa salvação final está mais perto; a plena realização da nossa salvação está mais perto
  rationale: 'A tradução mantém a tensão escatológica do texto: a salvação já pertence aos que creem e, ao mesmo tempo, ainda se aproxima. Não a restringe a uma etapa doutrinária específica.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural “façam” e “vocês” torna explícito o destinatário coletivo. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
