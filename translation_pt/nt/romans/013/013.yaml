id: ROM.13.13
reference: Romans 13:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: pt
  text: 'Vivamos de modo digno, como em pleno dia: não em festas desenfreadas e bebedeiras, não em imoralidade sexual e libertinagem, não em brigas e ciúmes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inveja”, em vez de “ciúmes”; o termo grego pode ter ambos os sentidos, aqui com valor negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: como em pleno dia
  rationale: Preserva a metáfora de dia/noite do contexto e soa natural em português, evocando uma conduta própria da luz do dia.
- source_word: εὐσχημόνως περιπατήσωμεν
  choice: Vivamos de modo digno
  rationale: Traduz o sentido ético do verbo metafórico περιπατέω e o valor de conduta respeitável de εὐσχημόνως em linguagem atual; a forma exortativa preserva o subjuntivo hortativo.
- source_word: κώμοις
  choice: festas desenfreadas
  rationale: Comunica festejos ruidosos e excessivos, geralmente ligados à bebida, sem o estreitamento sexual que 'orgias' costuma ter no uso moderno.
- source_word: μέθαις
  choice: bebedeiras
  rationale: Expressa episódios ou práticas de embriaguez e combina naturalmente com 'festas desenfreadas'.
- source_word: κοίταις
  choice: imoralidade sexual
  rationale: Embora signifique literalmente 'leitos', neste contexto o plural é uma referência idiomática à conduta sexual ilícita; a tradução pelo sentido evita obscuridade.
- source_word: ἀσελγείαις
  choice: libertinagem
  rationale: Denota conduta desregrada, despudorada e sem freios, muitas vezes de caráter sexual; 'libertinagem' mantém a amplitude sem reduzir o termo à sensualidade interior.
- source_word: ἔριδι
  choice: brigas
  rationale: Forma corrente e clara para discórdia, contenda e rivalidade hostil, adequada a leitores modernos.
- source_word: ζήλῳ
  choice: ciúmes
  rationale: No contexto da lista de vícios, o termo tem sentido negativo. 'Ciúmes' se associa naturalmente a 'brigas', embora 'inveja' também seja possível.
theological_decisions:
- issue: Contraste metafórico entre dia e escuridão na exortação ética
  choice: Manter a imagem em 'como em pleno dia'
  alternative: como se fosse de dia; como no dia
  rationale: A formulação preserva o contraste do contexto imediato sem transformá-lo em uma explicação doutrinária mais ampla que o próprio versículo.
- issue: Sentido idiomático de κοίταις
  choice: imoralidade sexual
  alternative: leitos; promiscuidade sexual
  rationale: O literal 'leitos' seria opaco em português. A tradução explicita a referência sexual evidente sem especificar uma prática não indicada pelo texto.
- issue: Amplitude negativa de ζήλῳ
  choice: ciúmes
  alternative: inveja
  rationale: Ambos os sentidos são lexicalmente possíveis; a lista de vícios exclui o sentido positivo de 'zelo', mas não decide de maneira inequívoca entre ciúme e inveja.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora lexical de 'andar' foi vertida pelo sentido corrente 'viver', enquanto a imagem central do dia foi preservada. A sequência em três pares e a cadência da lista de vícios foram mantidas.
