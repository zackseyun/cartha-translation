source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: pt
  text: 'Deem a todos o que lhes é devido: a quem imposto, imposto; a quem tributo, tributo; a quem temor, temor; a quem honra, honra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Deem
  rationale: Expressa a ideia de entregar ou pagar o que é devido, preservando a força imperativa.
- source_word: ὀφειλάς
  choice: o que lhes é devido
  rationale: Formulação natural em português que conserva o sentido de obrigações ou dívidas de vários tipos.
- source_word: φόρον
  choice: imposto
  rationale: Refere-se tipicamente ao imposto direto ou tributo cobrado pelo poder governante.
- source_word: τέλος
  choice: tributo
  rationale: Distingue esta cobrança de φόρος e pode abranger taxas, direitos ou cobranças indiretas.
- source_word: φόβον
  choice: temor
  rationale: Preserva o sentido lexical forte de φόβος e a tensão do texto, sem reduzi-lo interpretativamente a mero respeito.
- source_word: τιμήν
  choice: honra
  rationale: Equivalente direto e natural, distinto de temor.
theological_decisions:
- issue: Sentido de φόβος diante das autoridades
  choice: temor
  alternative: respeito
  rationale: O grego diz φόβος, e o contexto não exige que sua força seja suavizada. 'Temor' preserva a ambiguidade entre medo e reverência respeitosa.
translation_notes:
  register: Português moderno, digno e conciso, com estrutura elíptica repetitiva que reproduz a ênfase retórica do grego. 'Deem' tem leitura natural no português brasileiro e ampla inteligibilidade internacional.
