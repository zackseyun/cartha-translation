id: ROM.13.2
reference: Romans 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: pt
  text: Portanto, quem resiste à autoridade opôs-se ao que Deus estabeleceu, e os que se opuseram incorrerão em juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Juízo” também pode ser traduzido como “condenação” ou “sentença”, mas o grego não exige aqui o sentido mais forte de condenação final.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão lógica decorrente da afirmação do versículo anterior e soa natural em português atual.
- source_word: ὁ ἀντιτασσόμενος
  choice: quem resiste
  rationale: O particípio presente substantivado tem sentido genérico; esta formulação é concisa e preserva a ideia de resistência ativa.
- source_word: τῇ ἐξουσίᾳ
  choice: à autoridade
  rationale: Mantém o singular do grego e remete à autoridade governante mencionada no contexto imediato, sem acrescentar uma qualificação ausente da expressão.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: à determinação de Deus
  rationale: διαταγή pode indicar disposição, ordenação ou determinação. A escolha comunica aquilo que Deus estabeleceu sem sugerir necessariamente uma lei escrita.
- source_word: ἀνθέστηκεν
  choice: se opõe
  rationale: Expressa a oposição resultante da resistência. O presente idiomático em português comunica uma postura vigente, embora o grego use o perfeito para uma ação estabelecida com relevância presente.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: e os que se opõem
  rationale: Retoma o mesmo campo semântico e apresenta genericamente aqueles que assumiram essa postura. A conjunção δέ funciona aqui como continuação, sem exigir contraste forte.
- source_word: ἑαυτοῖς
  choice: sobre si mesmos
  rationale: Preserva a referência reflexiva e indica que a consequência recai sobre os próprios resistentes.
- source_word: κρίμα
  choice: julgamento
  rationale: Mantém o sentido amplo de decisão ou juízo e evita impor a noção mais forte de condenação final.
- source_word: λήμψονται
  choice: receberão
  rationale: Reproduz diretamente a ideia futura de receber ou incorrer na consequência, com linguagem clara em português.
theological_decisions:
- issue: Alcance de κρίμα
  choice: julgamento
  alternative: condenação ou sentença
  rationale: O termo adverte sobre uma consequência judicial, mas o versículo não especifica condenação eterna; a formulação mais ampla preserva essa abertura.
- issue: Referência de ἐξουσία
  choice: autoridade, entendida no contexto como autoridade governante
  alternative: autoridade em sentido abstrato mais amplo
  rationale: Romanos 13:1 fornece o referente governamental, enquanto o texto traduzido conserva a forma simples e singular do grego.
- issue: Relação entre resistência à autoridade e a determinação divina
  choice: preservar a afirmação direta do texto
  alternative: qualificar no próprio versículo os limites da obediência civil
  rationale: O versículo relaciona diretamente a resistência à autoridade com oposição à determinação divina; quaisquer limites derivados de outros contextos bíblicos não devem ser inseridos nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A repetição de “se opõe” preserva a ligação lexical do grego, e “determinação de Deus” evita tanto linguagem excessivamente técnica quanto uma especificação denominacional.
