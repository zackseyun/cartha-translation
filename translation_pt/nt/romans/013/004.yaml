  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: pt
  text: Pois ela é serva de Deus para o seu bem. Mas, se você fizer o mal, tenha medo, pois ela não porta a espada em vão[a]. Pois ela é serva de Deus, vingadora que traz a ira sobre quem pratica o mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem motivo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vingadora para a ira contra quem pratica o mal”.'
    reason: formal_alternative
lexical_decisions:
- source_word: διάκονος
  choice: serva
  rationale: Expressa uma agente que serve e cumpre uma missão, sem restringir o termo ao sentido eclesiástico de “ministra”. O feminino retoma naturalmente a autoridade governante do contexto.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: para o seu bem
  rationale: Transmite de modo idiomático a ideia de benefício ou finalidade favorável expressa pelo dativo σοὶ e por εἰς τὸ ἀγαθόν.
- source_word: τὸ κακὸν ποιῇς
  choice: fizer o mal
  rationale: Formulação portuguesa natural que preserva o sentido moral de κακόν e o valor condicional do verbo.
- source_word: φοβοῦ
  choice: tenha medo
  rationale: Equivalente corrente e direto do imperativo, adequado à advertência sobre a função punitiva da autoridade.
- source_word: εἰκῇ
  choice: sem motivo
  rationale: Indica que a espada não é portada sem propósito ou razão; é mais natural no contexto do que o possível “em vão”.
- source_word: μάχαιραν φορεῖ
  choice: porta a espada
  rationale: Mantém a imagem concreta da espada e comunica o porte habitual associado à autoridade para punir.
- source_word: ἔκδικος
  choice: vingadora
  rationale: Preserva a força retributiva do termo grego, que designa quem aplica justiça ou vingança, sem reduzi-lo simplesmente a “autoridade”.
- source_word: εἰς ὀργὴν
  choice: que traz a ira
  rationale: Produz uma construção portuguesa natural e mantém “ira” sem explicitar se é diretamente a ira de Deus ou a ação punitiva exercida por sua agente.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: sobre quem pratica o mal
  rationale: O particípio substantivado caracteriza a pessoa por sua conduta; “pratica o mal” conserva melhor esse aspecto do que uma ocorrência isolada.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa entre as afirmações no argumento de Paulo.
theological_decisions:
- issue: Relação entre a função punitiva da autoridade e a ira
  choice: “vingadora que traz a ira” sem acrescentar “de Deus”
  alternative: “agente de justiça para punir” ou “vingadora para a ira”
  rationale: O contexto apresenta a autoridade como serva de Deus, mas εἰς ὀργὴν não repete explicitamente “de Deus”. A tradução preserva essa conexão e sua tensão teológica sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o singular de σοὶ e dos verbos, enquanto “porta a espada” conserva a imagem histórica e judicial. Os marcadores foram colocados junto às expressões às quais suas alternativas se referem.
