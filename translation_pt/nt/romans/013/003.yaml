id: ROM.13.3
reference: Romans 13:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: pt
  text: Pois os governantes não são motivo de temor para a boa conduta[a], mas para a má conduta. Você quer não ter medo da autoridade?[b] Faça o que é bom, e receberá elogio da parte dela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para uma boa obra”. O grego contrasta o que é bom com o que é mau em sentido ético geral.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase também pode ser expressa de modo condicional: “Se você não quer ter medo da autoridade”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, da parte da autoridade governamental.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρχοντες
  choice: os governantes
  rationale: Designa aqueles que governam ou exercem cargo de governo; a escolha é natural e não especifica indevidamente o tipo de cargo.
- source_word: φόβος
  choice: motivo de temor
  rationale: O predicativo indica aquilo que causa ou inspira medo. A expressão preserva o sentido concreto sem soar artificial em português.
- source_word: τῷ ἀγαθῷ ἔργῳ
  choice: para a boa conduta
  rationale: Embora ἔργῳ esteja no singular, a expressão tem valor genérico e ético no contexto; “boa conduta” comunica esse sentido com naturalidade.
- source_word: τῷ κακῷ
  choice: para a má
  rationale: O adjetivo substantivado contrasta diretamente com a boa conduta; “conduta” fica subentendida em português, preservando a concisão do grego.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Você quer não ter medo
  rationale: Mantém a estrutura de pergunta retórica e o escopo da negação no grego, com formulação compreensível em português atual.
- source_word: τὴν ἐξουσίαν
  choice: da autoridade
  rationale: O singular definido aponta para a autoridade governamental como instituição, em continuidade com o contexto.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Faça o que é bom
  rationale: O adjetivo substantivado expressa a categoria moral do bem; a formulação é idiomática e não limita o sentido a um ato isolado.
- source_word: ἕξεις ἔπαινον
  choice: receberá elogio
  rationale: Embora literalmente seja “terá elogio”, “receberá elogio” expressa com maior naturalidade em português a aprovação concedida pela autoridade.
- source_word: ἐξ αὐτῆς
  choice: da parte dela
  rationale: O pronome feminino retoma ἐξουσία; “dela” preserva essa referência e “da parte de” indica claramente a origem do elogio.
theological_decisions:
- issue: Alcance da afirmação de Paulo sobre governantes e elogio
  choice: Traduzir como descrição direta da função normal das autoridades governamentais, sem ampliar a frase para uma aprovação absoluta de toda conduta de todo governante.
  alternative: Entender como afirmação universal e irrestrita de que todos os governantes sempre recompensam o bem, ou introduzir ironia/subversão não marcada no texto.
  rationale: A tradução conserva a afirmação e sua tensão no contexto, sem acrescentar qualificações ao versículo nem transformar sua formulação em doutrina mais abrangente do que o grego diz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pergunta retórica do grego foi preservada; “motivo de temor” evita o pouco natural “um terror”, e “receberá elogio” transmite de forma idiomática a aprovação procedente da autoridade.
