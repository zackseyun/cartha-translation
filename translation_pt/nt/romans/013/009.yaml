  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: pt
  text: 'Pois isto: “Não cometerás adultério, não assassinarás[a], não furtarás, não cobiçarás”; e, se houver algum outro mandamento, tudo se resume nesta palavra[b]: “Amarás o teu próximo como a ti mesmo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não matarás”. “Não assassinarás” expressa mais precisamente o sentido do verbo grego, que se refere a matar ilicitamente.
    reason: lexical_alternative
  - marker: b
    text: Ou “nesta declaração”. Neste contexto, a palavra grega pode significar “palavra”, “declaração” ou “enunciado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Pois os mandamentos
  rationale: O artigo neutro introduz o conteúdo das proibições citadas. A explicitação de “os mandamentos” produz português natural e liga a frase à menção posterior de qualquer outro mandamento.
- source_word: Οὐ μοιχεύσεις
  choice: Não cometerás adultério
  rationale: O futuro do indicativo reproduz a forma solene das proibições do Decálogo e funciona como mandamento.
- source_word: Οὐ φονεύσεις
  choice: não assassinarás
  rationale: φονεύω designa matar de modo ilícito, especialmente assassinar; evita-se o alcance excessivamente amplo de “não matarás”.
- source_word: Οὐ κλέψεις
  choice: não furtarás
  rationale: “Furtar” expressa com precisão a apropriação ilícita e preserva a forma tradicional da citação legal.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: não cobiçarás
  rationale: No contexto do Decálogo, ἐπιθυμέω tem o sentido específico de cobiçar, não o sentido amplo e neutro de desejar.
- source_word: καὶ εἴ τις ἑτέρα ἐντολή
  choice: e qualquer outro mandamento que haja
  rationale: A formulação conserva o caráter indefinido de τις e amplia o alcance para além dos mandamentos enumerados.
- source_word: ἀνακεφαλαιοῦται
  choice: resumem-se
  rationale: O verbo significa reunir ou condensar sob um enunciado principal. A concordância no plural decorre da explicitação natural dos mandamentos como sujeito em português.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: nesta palavra
  rationale: “Palavra” preserva a concisão e a ressonância bíblica de λόγος; aqui se refere ao enunciado que vem a seguir.
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: Amarás o seu próximo como a si mesmo
  rationale: Mantém-se a forma futura da citação de Levítico e a comparação reflexiva concisa do grego.
theological_decisions:
- issue: Forma das proibições do Decálogo
  choice: 'Futuro com valor de mandamento: “não cometerás... não assassinarás...”'
  alternative: 'Imperativo direto: “não cometa... não assassine...”'
  rationale: A forma futura mantém o perfil escritural das citações gregas sem mudar sua força normativa.
- issue: Alcance de φονεύσεις
  choice: “não assassinarás”
  alternative: “não matarás”
  rationale: A escolha conserva a referência à morte ilícita e não transforma o mandamento numa proibição indiscriminada de toda forma de matar.
- issue: Sentido de λόγος
  choice: “palavra”, no sentido de enunciado resumidor
  alternative: “declaração” ou “frase”
  rationale: “Palavra” é fiel à amplitude de λόγος e mantém sua força bíblica, enquanto a nota registra o sentido contextual sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se o futuro de valor imperativo para manter o caráter de citação bíblica; escolhas lexicais menos correntes, como “furtarás” e “cobiçarás”, permanecem transparentes no contexto e preservam a ligação com o Decálogo.
