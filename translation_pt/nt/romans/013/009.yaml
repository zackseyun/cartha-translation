  naturalness: O registro é claro e bíblico. “Amarás o seu próximo como a si mesmo”, porém, cria uma oscilação pouco natural entre a segunda pessoa implícita em “amarás” e os possessivos/reflexivos de terceira pessoa. “O teu próximo como a ti mesmo” preserva a pessoa do grego e soa natural nesse registro.
  terminology: “Adultério”, “assassinarás”, “furtarás”, “cobiçarás”, “mandamento”, “palavra” e “próximo” são escolhas adequadas. As notas distinguem corretamente “assassinarás” de “matarás” e explicam o alcance contextual de λόγος.
