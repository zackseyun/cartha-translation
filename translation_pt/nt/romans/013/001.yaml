id: ROM.13.1
reference: Romans 13:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: pt
  text: Que toda pessoa se sujeite às autoridades governantes[a], pois não há autoridade que não venha de Deus, e as que existem foram estabelecidas[b] por Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às autoridades superiores” ou “às autoridades que estão acima”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram ordenadas por Deus” ou “foram dispostas por Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: toda pessoa
  rationale: Embora a expressão seja literalmente “toda alma”, no grego koiné ela designa idiomaticamente cada pessoa. A tradução preserva a força distributiva sem sugerir uma antropologia técnica.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: às autoridades governantes
  rationale: ἐξουσίαις indica autoridades, e ὑπερεχούσαις descreve sua posição superior ou função governante. A formulação é clara no contexto civil e evita a possível vagueza de “autoridades superiores”.
- source_word: ὑποτασσέσθω
  choice: se sujeite
  rationale: O imperativo presente expressa sujeição contínua a uma ordem de autoridade. “Se sujeite” reproduz bem a forma médio-passiva e soa natural e digna em português.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: pois não há autoridade que não venha de Deus
  rationale: A formulação portuguesa comunica Deus como fonte última da autoridade e mantém a relação expressa por ὑπό sem a tornar mais específica do que o grego.
- source_word: αἱ δὲ οὖσαι
  choice: as que existem
  rationale: O particípio feminino plural retoma “autoridades”. A tradução é concisa e mantém explícita a referência às autoridades existentes.
- source_word: τεταγμέναι
  choice: foram estabelecidas
  rationale: O perfeito passivo de τάσσω descreve uma condição resultante do ato divino de ordenar, dispor ou estabelecer. “Foram estabelecidas” preserva essa ideia sem sugerir necessariamente a nomeação individual de cada governante.
theological_decisions:
- issue: Alcance da afirmação de Paulo sobre as autoridades e Deus
  choice: Afirmar que as autoridades existentes se encontram numa ordem estabelecida por Deus, sem acrescentar que Deus aprova moralmente todos os atos de cada governante.
  alternative: Entender que cada regime e cada ação governamental recebem aprovação positiva de Deus, ou reduzir a declaração a uma autoridade meramente abstrata.
  rationale: O grego se refere concretamente às autoridades existentes e as descreve como τεταγμέναι por Deus. “Estabelecidas” preserva essa afirmação e sua tensão teológica, sem extrapolar para uma aprovação incondicional de toda conduta governamental.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Autoridades governantes” explicita naturalmente o contexto civil; “se sujeite” conserva o tom exortativo sem intensificá-lo; as notas registram alternativas lexicais genuínas.
