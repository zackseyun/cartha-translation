source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: pt
  text: Não devam nada a ninguém, exceto amar uns aos outros; pois quem ama o outro cumpriu a lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Não devam nada a ninguém
  rationale: Reproduz de modo natural em português a proibição abrangente, preservando tanto a ideia de dívida quanto a de obrigação sem especificar apenas dívidas financeiras.
- source_word: εἰ μὴ
  choice: exceto
  rationale: Introduz com clareza a única obrigação que permanece.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: amar uns aos outros
  rationale: A construção infinitiva substantivada nomeia a obrigação contínua; esta forma é natural e mantém a reciprocidade de ἀλλήλους.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: pois quem ama
  rationale: Expressa o particípio substantivado singular de maneira inclusiva, corrente e concisa.
- source_word: τὸν ἕτερον
  choice: o outro
  rationale: Traduz diretamente a expressão grega, sem antecipar 'próximo' do contexto seguinte nem restringi-la indevidamente.
- source_word: νόμον
  choice: a lei
  rationale: No contexto paulino, refere-se à lei conhecida, cuja exigência é resumida nos versículos seguintes.
- source_word: πεπλήρωκεν
  choice: cumpriu
  rationale: O perfeito grego apresenta o cumprimento como realizado e vigente; o pretérito perfeito português comunica o resultado sem tornar a frase pesada.
theological_decisions:
- issue: Alcance da proibição de dever
  choice: Manter a formulação direta, sem explicar se constitui uma proibição absoluta de todo empréstimo.
  alternative: Restringir a frase a dívidas vencidas ou ampliá-la para uma proibição explícita de qualquer empréstimo.
  rationale: O grego fala amplamente de nada dever a ninguém, mas o versículo não resolve sozinho todas as questões éticas relativas a crédito e empréstimos.
- issue: Sentido de τὸν ἕτερον
  choice: Preservar 'o outro'.
  alternative: Traduzir por 'o próximo' ou 'outra pessoa'.
  rationale: '''O outro'' conserva a formulação do texto e sua tensão com o mandamento sobre o próximo citado logo depois.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem 'nada a ninguém' é idiomática, e 'não devam' preserva o imperativo sem recorrer ao mais coloquial 'não fiquem devendo'.
