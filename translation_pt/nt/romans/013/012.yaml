id: ROM.13.12
reference: Romans 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: pt
  text: A noite está bem avançada[a], e o dia já está próximo. Portanto, deixemos de lado as obras das trevas e vistamos a armadura da luz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A noite avançou muito». O verbo grego retrata a noite como tendo avançado, isto é, como já transcorrida em grande parte.'
    reason: alternativa lexical
  - marker: b
    text: 'Ou: «as armas da luz».'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἡ νὺξ
  choice: a noite
  rationale: Mantém literalmente a metáfora temporal, em contraste com «o dia», sem reduzi-la desde logo a uma interpretação moral ou escatológica.
- source_word: προέκοψεν
  choice: está bem avançada
  rationale: Expressa em português corrente que a noite avançou e já transcorreu em grande parte. A nota preserva mais explicitamente a imagem verbal grega de avanço.
- source_word: ἡ ἡμέρα
  choice: o dia
  rationale: Preserva o contraste temporal e simbólico com «a noite».
- source_word: ἤγγικεν
  choice: já está próximo
  rationale: Comunica o estado presente resultante da aproximação, valor próprio do perfeito grego, de modo natural em português.
- source_word: ἀποβαλώμεθα
  choice: deixemos de lado
  rationale: Subjuntivo exortativo que transmite o convite coletivo. A expressão conserva a ideia de remover ou abandonar e se articula naturalmente com a imagem seguinte de vestir.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Mantém um termo paulino recorrente e o sentido de ações ou práticas, sem explicitação interpretativa.
- source_word: τοῦ σκότους
  choice: das trevas
  rationale: Preserva a metáfora ética e escatológica e forma o contraste tradicional e inteligível com «luz».
- source_word: ἐνδυσώμεθα
  choice: vistamos
  rationale: Reproduz o subjuntivo exortativo e conserva a metáfora de vestir, em paralelo com a remoção das obras das trevas.
- source_word: τὰ ὅπλα
  choice: a armadura
  rationale: No contexto de «vistamos», «armadura» comunica naturalmente equipamento de combate que se põe sobre o corpo. O plural grego pode designar coletivamente o conjunto do armamento; a alternativa «armas» é registrada em nota.
- source_word: τοῦ φωτός
  choice: da luz
  rationale: Mantém literalmente o contraste simbólico com «trevas», sem definir de forma excessiva seu conteúdo teológico.
theological_decisions:
- issue: Metáfora escatológica da noite e do dia
  choice: Manter literalmente «a noite» e «o dia»
  alternative: Explicitar como «esta era de trevas» e «o novo dia»
  rationale: As imagens têm força temporal, moral e histórico-salvífica ao mesmo tempo. Mantê-las evita resolver no texto uma tensão que o grego deixa aberta.
- issue: Sentido de ὅπλα τοῦ φωτός
  choice: «a armadura da luz» no texto principal
  alternative: «as armas da luz»
  rationale: O verbo «vestir» favorece a ideia de equipamento defensivo ou armadura, mas ὅπλα também pode designar armas em sentido mais amplo; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Trevas» foi preferido a «escuridão» por sua naturalidade neste contraste ético-simbólico. As exortações na primeira pessoa do plural preservam o tom inclusivo de Paulo.
