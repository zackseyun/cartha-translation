id: ROM.13.5
reference: Romans 13:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: pt
  text: Por isso, é necessário submeter-se[a], não somente por causa da ira[b], mas também por causa da consciência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estar sujeito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa da punição”. O grego diz literalmente “por causa da ira”, o que pode se referir à ação punitiva da autoridade ou, de modo mais amplo, à ira divina atuando por meio da autoridade civil.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Conjunção inferencial que apresenta a conclusão do argumento anterior; a expressão é natural e conserva a ligação lógica.
- source_word: ἀνάγκη
  choice: é necessário
  rationale: Preserva a construção impessoal e a força de necessidade sem acrescentar um sujeito inexistente no grego.
- source_word: ὑποτάσσεσθαι
  choice: submeter-se
  rationale: Expressa de modo claro e atual a postura requerida diante das autoridades, sem ampliar a ideia para obediência absoluta.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Reproduz com clareza a estrutura correlativa e o contraste aditivo do grego.
- source_word: διὰ τὴν ὀργὴν
  choice: por causa da ira
  rationale: διά com acusativo indica motivo; “ira” conserva o valor lexical de ὀργή e não decide se se trata da ação punitiva da autoridade ou, em sentido mais amplo, da ira divina atuando por meio dela.
- source_word: διὰ τὴν συνείδησιν
  choice: por causa da consciência
  rationale: Mantém o paralelismo com a expressão anterior e apresenta a consciência como motivo interior para a submissão.
theological_decisions:
- issue: Referente de ὀργή (“ira”)
  choice: ira
  alternative: punição; ira de Deus; ação punitiva da autoridade
  rationale: O contexto menciona tanto a ordenação divina das autoridades quanto a função punitiva do governante. Como o grego não identifica expressamente o referente, a tradução preserva a ambiguidade.
- issue: Alcance de ὑποτάσσεσθαι
  choice: submeter-se
  alternative: estar sujeito
  rationale: “Submeter-se” comunica a resposta requerida pelo texto sem introduzir a noção mais ampla de obediência irrestrita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a concisão do grego e o paralelismo entre os dois motivos introduzidos por “por causa de”.
