id: ROM.13.14
reference: Romans 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: pt
  text: Mas revistam-se do Senhor Jesus, o Messias, e não façam provisão para a carne, a fim de satisfazer os desejos dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não façam provisão para a natureza pecaminosa, para satisfazer seus desejos”. O grego diz “carne”, termo que Paulo muitas vezes usa para os impulsos humanos caídos, em contraste com a vida dirigida por Deus.'
    reason: Alternativa lexical e esclarecimento do uso paulino de σάρξ.
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: revistam-se de
  rationale: Preserva a metáfora de vestir-se e expressa naturalmente, em português, a adoção de uma identidade e de um modo de vida.
- source_word: κύριον
  choice: Senhor
  rationale: Mantém o título cristológico e seu peso teológico.
- source_word: Χριστόν
  choice: o Messias
  rationale: Neste contexto, funciona como título; “o Messias” comunica seu sentido em português, em vez de tratá-lo como mero sobrenome.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: não façam provisão
  rationale: Reproduz a ideia de não planejar nem preparar antecipadamente meios para aquilo que segue.
- source_word: σαρκὸς
  choice: carne
  rationale: Conserva o vocabulário e a tensão antropológica de Paulo, sem restringi-lo interpretativamente a “natureza pecaminosa”.
- source_word: εἰς ἐπιθυμίας
  choice: a fim de satisfazer os desejos dela
  rationale: Torna clara a relação de finalidade provável entre fazer provisão para a carne e seus desejos, mantendo “dela” como referência à carne.
theological_decisions:
- issue: Sentido de σάρξ em contexto ético paulino
  choice: carne
  alternative: natureza pecaminosa
  rationale: Embora o contexto envolva impulsos humanos desordenados, “natureza pecaminosa” estreitaria a metáfora e poderia sistematizar excessivamente a antropologia paulina. O texto principal preserva “carne”, e a nota esclarece o uso.
- issue: Valor titular de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita o sentido do título grego e evita que o termo seja lido apenas como parte de um nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “revistam-se do Senhor Jesus” preserva a imagem original; “o Messias” mantém Χριστός como título. A nota retém a alternativa interpretativa sem substituir a ambiguidade do texto principal.
