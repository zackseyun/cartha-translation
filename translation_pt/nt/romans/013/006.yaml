id: ROM.13.6
reference: Romans 13:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: pt
  text: É também por isso que vocês pagam impostos, pois as autoridades são servas de Deus e se dedicam precisamente a essa tarefa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: pagam impostos
  rationale: Expressão portuguesa natural e semanticamente direta para o pagamento de tributos; o presente preserva a ação habitual indicada pelo grego.
- source_word: λειτουργοὶ θεοῦ
  choice: servas de Deus
  rationale: No contexto, o referente implícito são as autoridades do versículo anterior. “Servas” comunica serviço oficial sem sugerir necessariamente um cargo religioso.
- source_word: προσκαρτεροῦντες
  choice: se dedicam
  rationale: Transmite a ideia de persistir ou aplicar-se continuamente a uma atividade, de modo claro no português atual.
- source_word: εἰς αὐτὸ τοῦτο
  choice: precisamente a essa tarefa
  rationale: Preserva a ênfase de “a isto mesmo”, retomando de modo natural a função pública ligada à arrecadação e ao governo.
theological_decisions:
- issue: Identidade dos λειτουργοί
  choice: Explicitar “as autoridades” como sujeito contextual
  alternative: Manter apenas “elas” ou “são servas de Deus”
  rationale: O particípio masculino plural remete aos governantes/autoridades de Romanos 13:3–4. A explicitação evita ambiguidade em português sem ampliar o referente.
- issue: Sentido de λειτουργοί
  choice: “servas de Deus”
  alternative: “ministras de Deus”
  rationale: “Servas” preserva a função de serviço público e evita que “ministras” seja entendida exclusivamente como título eclesiástico ou governamental moderno.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez, preservando a dupla fundamentação introduzida por γάρ e a ênfase final do texto grego.
