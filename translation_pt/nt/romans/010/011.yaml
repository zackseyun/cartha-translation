id: ROM.10.11
reference: Romans 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: pt
  text: 'Pois a Escritura diz: “Todo aquele que nele crê não será envergonhado.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficará envergonhado”.'
    reason: Alternativa lexical que expressa mais diretamente o estado experimentado, embora torne menos explícita a forma passiva do grego.
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: O presente grego funciona naturalmente como presente vívido em uma fórmula de citação; “a Escritura diz” é corrente e fiel em português.
- source_word: γὰρ
  choice: Pois
  rationale: A conjunção fundamenta a afirmação anterior e preserva o encadeamento argumentativo de Paulo.
- source_word: ἡ γραφή
  choice: a Escritura
  rationale: Na fórmula paulina de citação, refere-se à Escritura sagrada, não apenas a um escrito qualquer.
- source_word: Πᾶς ὁ πιστεύων
  choice: Todo aquele que ... crê
  rationale: A construção substantivada tem alcance genérico e universal; esta formulação é clara, digna e não restringe a referência ao sexo masculino.
- source_word: πιστεύων
  choice: crê
  rationale: “Crer” traduz diretamente πιστεύω e, com o complemento pessoal, expressa fé ou confiança dirigida a alguém.
- source_word: ἐπ’ αὐτῷ
  choice: nele
  rationale: Com πιστεύω, ἐπί com dativo indica confiança depositada em uma pessoa; “crê nele” é idiomático em português e mantém o pronome do texto.
- source_word: οὐ καταισχυνθήσεται
  choice: não será envergonhado
  rationale: A forma passiva futura é preservada e comunica a ideia de não sofrer vergonha ou desonra, sem reduzi-la apenas a um sentimento interior.
theological_decisions:
- issue: Força genérica do masculino em Πᾶς ὁ πιστεύων
  choice: Todo aquele que ... crê
  alternative: Todo homem que crê
  rationale: O masculino singular grego é representativo e genérico, não especificamente masculino; a tradução preserva o alcance universal.
- issue: Referente de αὐτῷ
  choice: nele
  alternative: em Cristo / no Senhor
  rationale: O contexto identifica o referente, mas manter o pronome preserva a forma da citação e evita inserir uma explicação interpretativa no texto.
- issue: Sentido passivo de καταισχυνθήσεται
  choice: não será envergonhado
  alternative: não ficará decepcionado
  rationale: A opção escolhida conserva a linguagem de vergonha e a forma passiva, bem como a tensão entre experiência de vergonha e desonra pública presente no pano de fundo de Isaías.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão da fórmula de citação foram preservadas; “Pois” mantém a conexão lógica com o contexto anterior.
