id: ROM.10.10
reference: Romans 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: pt
  text: Pois com o coração se crê para a justiça[a], e com a boca se confessa para a salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para a retidão». O termo grego δικαιοσύνη também pode indicar retidão; em Paulo, porém, «justiça» preserva melhor sua amplitude de sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: com o coração
  rationale: O dativo pode indicar instrumento ou referência à pessoa interior. A expressão é natural em português e preserva o contraste entre a fé interior e a confissão exterior.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior sem determinar de modo excessivo a nuance da conexão.
- source_word: πιστεύεται
  choice: se crê
  rationale: A forma verbal passiva/média tem sentido generalizante. A construção impessoal com «se» é idiomática em português e mantém o caráter geral da afirmação.
- source_word: εἰς δικαιοσύνην
  choice: para a justiça
  rationale: εἰς expressa direção, finalidade ou resultado. «Para a justiça» conserva a formulação compacta e evita explicar além do texto a relação teológica entre fé e justiça.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: É a tradução portuguesa tradicional e semanticamente ampla do termo paulino, capaz de comportar suas dimensões forense, relacional e ética sem reduzi-lo a «justificação».
- source_word: στόματι
  choice: com a boca
  rationale: Mantém o dativo instrumental e o paralelismo deliberado com «com o coração».
- source_word: δὲ
  choice: e
  rationale: Aqui a partícula liga duas afirmações complementares, com contraste leve entre o interior e o exterior; «e» evita sugerir oposição.
- source_word: ὁμολογεῖται
  choice: se confessa
  rationale: A construção impessoal corresponde ao paralelismo com πιστεύεται e, no contexto do versículo 9, «confessar» comunica a declaração verbal de que Jesus é Senhor.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Preserva o paralelismo com «para a justiça» e a possível ideia de finalidade ou resultado, sem impor uma explicação causal mais específica.
- source_word: σωτηρίαν
  choice: salvação
  rationale: É o termo corrente no contexto soteriológico paulino e mantém possíveis dimensões presentes e futuras.
theological_decisions:
- issue: Relação entre crer/confessar e justiça/salvação
  choice: 'Manter as duas orações paralelas: crer «para a justiça» e confessar «para a salvação».'
  alternative: Explicar a confissão apenas como evidência da salvação, ou apresentá-la como obra meritória adicional.
  rationale: O grego emprega duas construções paralelas com εἰς. A tradução preserva essa tensão e não define uma ordem mecânica da salvação além do que o versículo afirma.
- issue: Sentido de δικαιοσύνη
  choice: Traduzir por «justiça», preservando a amplitude do termo.
  alternative: Traduzir por «justificação» ou «retidão».
  rationale: «Justificação» estreitaria o termo a uma interpretação forense, enquanto «retidão» destacaria sobretudo a qualidade moral. «Justiça» permite que permaneçam abertas as dimensões forense, relacional e ética.
translation_notes:
  register: Português moderno, claro e digno, com construção impessoal idiomática. O paralelismo «com o coração... com a boca» e «para a justiça... para a salvação» reproduz a estrutura concisa do grego.
