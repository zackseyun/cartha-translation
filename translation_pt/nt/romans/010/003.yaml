id: ROM.10.3
reference: Romans 10:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: pt
  text: Pois, por não conhecerem a justiça de Deus[a] e por procurarem estabelecer a sua própria, não se sujeitaram à justiça de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “justiça de Deus”, nas duas ocorrências, pode referir-se à justiça que pertence a Deus ou à justiça que vem de Deus; o grego permite mais de uma nuance.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém clara a conexão argumentativa.
- source_word: ἀγνοοῦντες
  choice: não conhecendo
  rationale: Expressa de modo natural o particípio presente e a falta de reconhecimento, sem determinar além do grego se essa ignorância era deliberada.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: justiça
  rationale: Em português, “justiça” é o equivalente corrente e abrangente de δικαιοσύνη, podendo incluir o caráter justo de Deus, sua ação salvadora e a condição de retidão que procede dele.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Preserva a concisão e parte da ambiguidade do genitivo grego entre aquilo que pertence a Deus, procede dele ou manifesta sua ação justa.
- source_word: ἰδίαν
  choice: a sua própria
  rationale: O adjetivo é elíptico, retomando “justiça”; a construção portuguesa mantém essa retomada sem repetição desnecessária.
- source_word: ζητοῦντες στῆσαι
  choice: procurando estabelecer
  rationale: Reproduz o aspecto contínuo do particípio e o sentido idiomático do infinitivo στῆσαι, isto é, firmar ou fazer prevalecer.
- source_word: οὐχ ὑπετάγησαν
  choice: não se sujeitaram
  rationale: Verbo passivo com sentido médio neste contexto; a forma pronominal portuguesa comunica naturalmente a ideia de não se colocar sob essa justiça.
theological_decisions:
- issue: Sentido de “a justiça de Deus” no uso paulino
  choice: Mantida a expressão “a justiça de Deus” nas duas ocorrências.
  alternative: “a justiça que vem de Deus”, “a própria justiça de Deus” ou “a ação justa e salvadora de Deus”
  rationale: O genitivo grego admite nuances de posse, origem e atividade divina. A tradução não escolhe exclusivamente uma delas e preserva a tensão teológica do texto.
- issue: Natureza da “sua própria” justiça
  choice: 'Mantida a elipse: “a sua própria”.'
  alternative: “a sua própria justiça”
  rationale: O substantivo está subentendido no grego e é recuperado sem dificuldade em português. A formulação evita especificar um sistema ou mecanismo não declarado neste versículo.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com fluidez brasileira. “Pois” mantém o vínculo explicativo; “não conhecendo” é mais natural que “sendo ignorantes de”; e “não se sujeitaram” preserva o teor volitivo sem exagerá-lo.
