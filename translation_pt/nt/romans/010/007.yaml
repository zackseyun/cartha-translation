  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: pt
  text: 'ou: “Quem descerá ao abismo[a]?” (isto é, para fazer subir o Messias[b] dentre os mortos).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às profundezas”. Paulo ecoa Deuteronômio 30.13, mas aqui emprega “abismo” e aplica essa linguagem a fazer subir o Messias dentre os mortos.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “Cristo”. Aqui o termo é traduzido como “Messias” porque Χριστός funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: ou
  rationale: Introduz de modo contrastivo a segunda pergunta retórica e corresponde diretamente à conjunção grega.
- source_word: Τίς καταβήσεται
  choice: Quem descerá
  rationale: Preserva a pergunta retórica, o tempo futuro e o movimento descendente expresso pelo grego.
- source_word: εἰς τὴν ἄβυσσον
  choice: ao abismo
  rationale: Mantém o termo específico ἄβυσσος e sua imagem de profundidade, sem reduzi-lo interpretativamente à sepultura ou ao domínio dos mortos.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Fórmula explicativa corrente que reproduz com naturalidade a função da expressão grega.
- source_word: Χριστόν
  choice: o Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica seu conteúdo semântico em português.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa que o Messias seria trazido para fora do conjunto dos mortos e preserva a formulação tradicional e natural em português bíblico.
- source_word: ἀναγαγεῖν
  choice: trazer
  rationale: O verbo significa conduzir ou trazer para cima. Em português, “trazer ... dentre os mortos” comunica naturalmente o movimento de saída, enquanto a direção ascendente já está implícita no contraste com “descer ao abismo”.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, o termo tem força titular. “Messias” preserva o sentido de “Ungido” e evita tratá-lo apenas como nome próprio.
- issue: Sentido de ἄβυσσος na explicação de Paulo
  choice: Manter “abismo” sem defini-lo como sepultura ou domínio dos mortos
  alternative: profundezas; domínio dos mortos; Hades
  rationale: Paulo adapta a linguagem de Deuteronômio 30.13 e a relaciona com trazer o Messias dentre os mortos. “Abismo” conserva a imagem e a tensão do texto sem impor uma identificação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. “Dentre os mortos” conserva a precisão da expressão grega, e os dois-pontos após “ou” introduzem naturalmente a segunda pergunta citada.
