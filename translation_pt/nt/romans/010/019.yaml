source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: pt
  text: 'Mas pergunto: será que Israel não entendeu?[a] Primeiro, Moisés diz: “Eu farei vocês sentir ciúmes por meio daquilo que não é nação[b]; por meio de uma nação sem entendimento, provocarei vocês à ira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será que Israel não soube?”. O verbo grego pode significar tanto saber como entender; neste contexto, provavelmente se refere a compreender o significado da mensagem ouvida.
    reason: lexical_alternative
  - marker: b
    text: Citação de Deuteronômio 32:21. “Aquilo que não é nação” pode referir-se a um povo considerado como não sendo uma verdadeira nação; no argumento de Paulo, a expressão aponta para os gentios.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: será que Israel não entendeu?
  rationale: O verbo ἔγνω pode significar “soube” ou “entendeu”. No contexto de ouvir e captar a mensagem, “entendeu” comunica naturalmente a ideia, enquanto a nota preserva a alternativa lexical.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Primeiro, Moisés diz
  rationale: Preserva a força adverbial de πρῶτος, apresentando Moisés como o primeiro testemunho bíblico citado.
- source_word: παραζηλώσω ὑμᾶς
  choice: Farei vocês terem ciúmes
  rationale: Expressa de modo corrente e causativo a ideia de provocar ciúmes, mantendo explícito o plural de ὑμᾶς.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: por meio daquilo que não é nação
  rationale: Mantém a formulação paradoxal e o singular neutro da citação, sem identificar interpretativamente o referente no texto principal.
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: por meio de uma nação sem entendimento
  rationale: Reflete de perto a falta de compreensão expressa por ἀσυνέτῳ e conserva o paralelismo com a expressão anterior.
- source_word: παροργιῶ ὑμᾶς
  choice: provocarei vocês à ira
  rationale: Preserva a nuance causativa do verbo e o paralelismo com “farei vocês terem ciúmes”.
theological_decisions:
- issue: Referente de “aquilo que não é nação” e “uma nação sem entendimento”
  choice: Manter a linguagem da citação sem identificar diretamente o referente no texto principal.
  alternative: Explicitar “os gentios” ou “um povo que Israel não considera uma verdadeira nação”.
  rationale: A formulação de Deuteronômio 32:21 conserva a tensão retórica usada por Paulo; explicitar o referente no corpo do texto resolveria uma questão interpretativa que o grego deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural grego; a construção “por meio de” comunica o valor instrumental de ἐπί com dativo. Os marcadores [a] e [b] aparecem no texto principal.
