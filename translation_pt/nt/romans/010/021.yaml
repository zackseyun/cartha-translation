source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: pt
  text: 'Mas, a respeito de Israel, ele diz[a]: “O dia inteiro estendi as minhas mãos a um povo desobediente[b] e que se opõe[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas a Israel ele diz”. A construção grega pode indicar uma fala dirigida a Israel ou uma declaração a respeito de Israel.'
    reason: alternative_reading
  - marker: b
    text: “Desobediente” também pode ter o sentido de “incrédulo” ou “que se recusa a ser persuadido”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “opositor”, “que contradiz” ou “que fala contra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Mas, a respeito de Israel
  rationale: A construção com πρός e λέγει pode introduzir o referente da fala. Esta formulação é natural em português e preserva, em nota, a possibilidade de discurso dirigido a Israel.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente da fórmula paulina de citação e não explicita como Deus o sujeito que permanece implícito no grego.
- source_word: Ὅλην τὴν ἡμέραν
  choice: O dia inteiro
  rationale: Equivalente português corrente para o acusativo de extensão temporal, preservando a ideia de duração contínua.
- source_word: ἐξεπέτασα
  choice: estendi
  rationale: O pretérito perfeito traduz diretamente o aoristo da citação e combina naturalmente com a imagem de estender as mãos.
- source_word: τὰς χεῖράς μου
  choice: as minhas mãos
  rationale: Preserva literalmente a imagem antropomórfica de apelo, acolhimento ou convite.
- source_word: πρὸς λαὸν
  choice: a um povo
  rationale: Indica a direção do gesto de mãos estendidas de modo idiomático em português.
- source_word: ἀπειθοῦντα
  choice: desobediente
  rationale: Expressa a recusa moral e volitiva, sem eliminar a possível nuance de incredulidade ou recusa em deixar-se persuadir, registrada em nota.
- source_word: ἀντιλέγοντα
  choice: contradizente
  rationale: Retém de modo conciso o componente verbal de ἀντιλέγω — contradizer ou falar contra — e caracteriza resistência ativa; alternativas mais correntes são indicadas em nota.
theological_decisions:
- issue: Caracterização da resposta de Israel a Deus
  choice: “um povo desobediente e contradizente”
  alternative: “um povo incrédulo e resistente” ou “um povo desobediente e opositor”
  rationale: A tradução conserva tanto a recusa quanto a oposição ativa à iniciativa divina, sem transformar a citação em afirmação mais ampla sobre a condição de Israel além do que o versículo declara.
- issue: Referente ou destinatário da declaração
  choice: “a respeito de Israel, ele diz”
  alternative: “a Israel, ele diz”
  rationale: A construção grega permite entender Israel como assunto ou destinatário. O texto principal adota a leitura referencial, enquanto a nota preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha os termos a que se referem. “Contradizente” foi mantido por refletir o aspecto verbal do particípio grego, enquanto a nota oferece equivalentes mais correntes.
