id: ROM.10.9
reference: Romans 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: pt
  text: porque, se você confessar com a sua boca que Jesus é Senhor[a] e crer em seu coração que Deus o ressuscitou dentre os mortos, será salvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confessar Jesus como Senhor”. A expressão grega também pode ser traduzida dessa forma mais compacta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão explicativa da afirmação anterior e preserva o valor causal no contexto.
- source_word: ἐὰν
  choice: se
  rationale: Expressa naturalmente em português a condição formada com os subjuntivos ὁμολογήσῃς e πιστεύσῃς.
- source_word: ὁμολογήσῃς
  choice: confessar
  rationale: Mantém o sentido de declarar ou reconhecer verbalmente uma verdade ou lealdade, além de conservar a linguagem bíblica corrente.
- source_word: ἐν τῷ στόματί σου
  choice: com a sua boca
  rationale: Formulação portuguesa natural que comunica o caráter verbal da confissão.
- source_word: κύριον Ἰησοῦν
  choice: que Jesus é Senhor
  rationale: Explicita de modo natural o conteúdo predicativo da confissão, sem reduzir a expressão a um simples nome titular.
- source_word: πιστεύσῃς
  choice: crer
  rationale: Verbo direto e corrente no contexto de convicção interior, seguido de uma oração que expressa o conteúdo da crença.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: em seu coração
  rationale: Preserva a imagem antropológica bíblica da convicção interior e soa natural em português.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Deus o ressuscitou
  rationale: O aoristo indica o ato passado de Deus; 'ressuscitou' comunica com precisão o sentido contextual de ἐγείρω.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa que Jesus foi ressuscitado do meio dos mortos e conserva uma formulação portuguesa clara e tradicional.
- source_word: σωθήσῃ
  choice: será salvo
  rationale: Reproduz o futuro passivo e o sentido soteriológico do contexto sem acrescentar qualificações ausentes do texto.
theological_decisions:
- issue: Tradução de κύριος na fórmula de confissão
  choice: Senhor
  alternative: Mestre
  rationale: '''Senhor'' preserva tanto a autoridade atribuída a Jesus quanto a forte ressonância escriturística do contexto imediato.'
- issue: Forma da oração κύριον Ἰησοῦν
  choice: que Jesus é Senhor
  alternative: Jesus como Senhor
  rationale: Torna explícito o conteúdo da confissão em português, preservando a leitura predicativa sem transformar a frase apenas em um título fixo.
- issue: Força soteriológica de σωθήσῃ
  choice: será salvo
  alternative: será liberto
  rationale: O contexto trata da salvação; 'salvo' mantém essa força sem especificar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. O pronome 'você' torna explícito o singular da segunda pessoa; a sequência evita repetição excessiva sem perder clareza. A pontuação segue a fluidez do período em português.
