  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: pt
  text: 'Mas a justiça que vem da fé fala assim: “Não diga em seu coração: ‘Quem subirá ao céu?’” — isto é, fazer o Messias descer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Paulo retoma Deuteronômio 30:12 e aplica a pergunta ao Messias. Grego: Χριστός, tradicionalmente traduzido por “Cristo”.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, “justiça” é o equivalente natural que abrange tanto a condição de estar em conformidade com o que é justo quanto o agir justo, preservando a amplitude paulina sem recorrer ao menos corrente “retidão”.
- source_word: ἐκ πίστεως
  choice: que vem da fé
  rationale: Expressa diretamente a ideia de origem marcada por ἐκ e mantém o contraste contextual com a justiça baseada na lei; é mais idiomático em português do que “da fé” isoladamente.
- source_word: οὕτως λέγει
  choice: fala assim
  rationale: Preserva o presente e a personificação de δικαιοσύνη em linguagem portuguesa natural.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Não diga em seu coração
  rationale: Mantém de perto a formulação deuteronômica e o sentido interior de καρδία como centro do pensamento e da intenção.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Quem subirá ao céu?
  rationale: “Subirá” traduz naturalmente ἀναβήσεται, enquanto “ao céu” comunica o movimento expresso por εἰς sem artificialidade.
- source_word: Χριστόν
  choice: o Messias
  rationale: Aqui Χριστός funciona como título no argumento expositivo de Paulo; “Messias” torna explícito o sentido do título para o leitor moderno.
- source_word: καταγαγεῖν
  choice: fazer ... descer
  rationale: 'Reproduz de modo claro o valor causativo do infinitivo: subir ao céu equivaleria a fazer o Messias descer.'
theological_decisions:
- issue: Personificação da justiça que vem da fé
  choice: Mantida em “a justiça que vem da fé fala assim”
  alternative: “É isto que diz a justiça que vem da fé”
  rationale: A justiça é o sujeito gramatical de λέγει; a formulação escolhida preserva diretamente a personificação e o contraste retórico com o versículo anterior.
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: No contexto da aplicação de Deuteronômio à pessoa messiânica, o termo tem força titular; “Messias” preserva esse conteúdo, em vez de tratá-lo como simples nome próprio.
- issue: Função da explicação final
  choice: “isto é, para fazer o Messias descer”
  alternative: “isto é, fazer o Messias descer”
  rationale: A preposição “para” conserva a relação explicativa do infinitivo grego com a pergunta precedente, sem definir além do texto como se daria essa descida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a personificação paulina e a estrutura da citação, evitando formulações excessivamente literais ou confessionais.
