  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: pt
  text: Pois todo aquele que invocar o nome do Senhor será salvo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo cita Joel 2:32. Em Joel, o referente é YHWH (“o SENHOR”); aqui, no contexto, Paulo aplica o texto a Jesus.
    reason: cross_reference
  - marker: b
    text: Ou “clamar pelo nome do Senhor”. A expressão grega significa invocar o Senhor pelo nome ou recorrer a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: todo aquele que
  rationale: A construção grega tem sentido genérico e abrangente. “Todo aquele que” expressa naturalmente essa universalidade em português sem restringi-la aos homens.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a citação bíblica como fundamento ou explicação da afirmação anterior, preservando a conexão argumentativa.
- source_word: ἐπικαλέσηται
  choice: invocar
  rationale: Com “o nome”, o verbo significa chamar pelo Senhor, recorrendo a ele em apelo, oração ou confissão. “Invocar” preserva com concisão o sentido e a ressonância bíblica.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Mantém a expressão bíblica que aponta para a identidade, autoridade e pessoa daquele que é invocado.
- source_word: κυρίου
  choice: do Senhor
  rationale: Traduz diretamente o grego κυρίου, sem acrescentar no texto principal uma identificação interpretativa explícita.
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo comunica claramente, no contexto paulino, a ação salvadora recebida pela pessoa.
theological_decisions:
- issue: Referente de “Senhor” na citação de Joel
  choice: Manter “Senhor” no texto principal e explicar em nota a relação entre YHWH em Joel e Jesus no contexto de Romanos 10.
  alternative: Traduzir “SENHOR” ou explicitar “Senhor Jesus”.
  rationale: O texto grego traz κυρίου. A citação remete a Joel 2:32, onde o referente é YHWH, enquanto o contexto imediato de Romanos aplica a invocação a Jesus. A tradução preserva a formulação da fonte e a nota apresenta a tensão intertextual sem resolvê-la por expansão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém a ligação lógica; “todo aquele que” é uma fórmula inclusiva e natural; “invocar” conserva o caráter bíblico e cultual da expressão.
