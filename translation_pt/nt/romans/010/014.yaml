review_pass:
  verdict: revise
  source_fidelity: A cadeia retórica, a força inferencial de οὖν, a linguagem de crer e a dependência da audição em relação à proclamação estão bem preservadas. Contudo, “naquele que não ouviram” em português apresenta οὗ como objeto direto de “ouvir”, enquanto o genitivo com ἀκούω aqui normalmente indica ouvir a respeito de alguém. A redação precisa tornar essa relação compreensível sem eliminar a concisão do argumento.
  naturalness: A redação é em geral fluente e de registro adequado. “Naquele que não ouviram”, porém, soa incompleta e tende a significar que não ouviram a própria pessoa, não que não receberam notícia ou proclamação a respeito dela.
  terminology: “Invocar”, “crer” e “pregar” são escolhas adequadas, claras e não sectárias. “De quem não ouviram falar” é a forma portuguesa moderna e natural para o valor de ἀκούω + genitivo neste contexto.
  issues:
  - severity: medium
    issue: O trecho “naquele que não ouviram” não expressa adequadamente οὗ οὐκ ἤκουσαν em português.
    rationale: A construção grega com ἀκούω e genitivo tem o sentido de ouvir acerca de alguém. Em português, “ouvir alguém” normalmente denota escutar diretamente essa pessoa; além disso, “naquele que não ouviram” fica sintaticamente pouco natural. “De quem não ouviram falar” comunica o sentido sem introduzir uma interpretação doutrinária.
  revised_text: Como, então, invocarão aquele em quem não creram? E como crerão naquele de quem não ouviram falar?[a] E como ouvirão sem que alguém pregue?
