source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: pt
  text: Como, então, invocarão aquele em quem não creram? E como crerão naquele de quem não ouviram falar?[a] E como ouvirão sem que alguém pregue?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “naquele a respeito de quem não ouviram”.'
    reason: Alternativa de formulação para οὗ οὐκ ἤκουσαν; o genitivo com ἀκούω indica ouvir a respeito de alguém.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Como, então
  rationale: Preserva a força conclusiva de οὖν e a sequência de perguntas retóricas em português natural.
- source_word: ἐπικαλέσωνται
  choice: invocarão
  rationale: Expressa o ato de invocar ou apelar ao Senhor e mantém a ligação com a citação do contexto imediato.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: aquele em quem não creram
  rationale: Mantém a linguagem de crer e a relação lógica entre fé e invocação, em construção idiomática portuguesa.
- source_word: πιστεύσωσιν
  choice: crerão
  rationale: Representa naturalmente o subjuntivo deliberativo na sequência retórica e preserva o vocabulário paulino de fé.
- source_word: οὗ οὐκ ἤκουσαν
  choice: naquele que não ouviram
  rationale: Conserva no texto principal a possibilidade de Cristo ser aquele a quem se ouve, sem transformar explicitamente o objeto em uma mensagem a respeito dele; a leitura alternativa é registrada em nota.
- source_word: ἀκούσωσιν
  choice: ouvirão
  rationale: É o equivalente direto e mantém a repetição lexical que estrutura o argumento.
- source_word: χωρὶς κηρύσσοντος
  choice: sem que alguém pregue
  rationale: Enfatiza a ação de anunciar publicamente, e não um cargo formal, reproduzindo o valor do particípio.
theological_decisions:
- issue: Linguagem de πιστεύω
  choice: crer / creram
  alternative: confiar / ter fé
  rationale: “Crer” preserva a cadeia lexical e argumentativa de Paulo sem acrescentar uma definição específica da natureza da fé.
- issue: Objeto de ouvir em οὗ οὐκ ἤκουσαν
  choice: naquele que não ouviram
  alternative: naquele sobre quem não ouviram falar
  rationale: O genitivo com ἀκούω admite tanto a compreensão de ouvir a própria pessoa quanto a de ouvir a respeito dela. O texto principal mantém a leitura mais direta e a nota conserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “como” e “ouvir” foi mantida por ser estrutural ao argumento. “Pregue” comunica a proclamação pública sem pressupor um ofício eclesiástico.
