  revision_rationale: A revisão restringe-se à segunda pergunta. Substitui uma construção portuguesa que sugere audição direta da pessoa por uma expressão idiomática que reproduz o valor de “ouvir acerca de” do genitivo grego. A sequência de perguntas, os tempos verbais e a ênfase na proclamação permanecem inalterados.
