- from: Como, então, invocarão aquele em quem não creram? E como crerão naquele que não ouviram?[a] E como ouvirão sem que alguém pregue?
  to: Como, então, invocarão aquele em quem não creram? E como crerão naquele de quem não ouviram falar?[a] E como ouvirão sem que alguém pregue?
  rationale: A revisão restringe-se à segunda pergunta. Substitui uma construção portuguesa que sugere audição direta da pessoa por uma expressão idiomática que reproduz o valor de “ouvir acerca de” do genitivo grego. A sequência de perguntas, os tempos verbais e a ênfase na proclamação permanecem inalterados.
