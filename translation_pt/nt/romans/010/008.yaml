id: ROM.10.8
reference: Romans 10:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: pt
  text: Mas o que ela diz? “A palavra está perto de você, em sua boca e em seu coração”[a] — isto é, a palavra da fé[b] que proclamamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo retoma Deuteronômio 30:14 e aplica sua linguagem à mensagem que ele e seus colaboradores proclamam.
    reason: cross_reference
  - marker: b
    text: Ou “mensagem da fé”; “fé” também pode ser traduzida, conforme o contexto, por “confiança” ou “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Expressa naturalmente o contraste com a discussão anterior.
- source_word: τί λέγει
  choice: o que ela diz?
  rationale: Mantém o singular e a personificação do referente implícito, isto é, a passagem das Escrituras, sem acrescentá-lo ao texto.
- source_word: Ἐγγύς σου
  choice: está perto de você
  rationale: Reproduz com clareza a proximidade expressa no texto e conserva o tom da citação.
- source_word: τὸ ῥῆμα
  choice: a palavra
  rationale: Preserva a repetição de ῥῆμα e permite que a explicação de Paulo esclareça seu sentido de mensagem proclamada.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: em sua boca e em seu coração
  rationale: Conserva as imagens corporais e interiores da citação em português natural.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Introduz diretamente a explicação paulina da citação.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: a palavra da fé
  rationale: Mantém o vínculo lexical com a ocorrência anterior de ῥῆμα e preserva a formulação compacta e potencialmente ampla do genitivo τῆς πίστεως.
- source_word: ὃ κηρύσσομεν
  choice: que proclamamos
  rationale: Comunica o anúncio público e autorizado indicado por κηρύσσω, em linguagem atual e digna.
theological_decisions:
- issue: Sentido de πίστις em τὸ ῥῆμα τῆς πίστεως
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” é a tradução mais adequada no contexto paulino e não restringe indevidamente a expressão a uma formulação doutrinária específica; a relação exata do genitivo permanece aberta.
- issue: Relação entre a citação de Deuteronômio 30:14 e a mensagem proclamada
  choice: A explicação “isto é” identifica a palavra citada com a palavra da fé proclamada por Paulo
  alternative: Parafrasear a citação diretamente como “mensagem do evangelho”
  rationale: A formulação escolhida segue a estrutura explícita do grego e preserva o movimento interpretativo de Paulo sem inserir “evangelho” onde o versículo diz ῥῆμα τῆς πίστεως.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A tradução conserva a repetição de “palavra”, as imagens de “boca” e “coração” e a concisão da explicação paulina. O pronome feminino em “ela” retoma naturalmente “a palavra/passagem” implícita no contexto, sem explicitar “a Escritura” no corpo do texto.
