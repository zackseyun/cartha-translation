id: ROM.10.12
reference: Romans 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: pt
  text: Pois não há distinção entre judeu e grego[a], porque o mesmo Senhor é Senhor de todos[b] e é rico para com todos os que o invocam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “grego”; aqui, o par judeu/grego funciona como contraste entre judeu e não judeu. Algumas traduções trazem “gentio”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o mesmo Senhor está sobre todos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: distinção
  rationale: Expressa de modo natural a ausência de diferenciação entre os dois grupos, sem acrescentar juízo de valor.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: judeu ... grego
  rationale: Mantém os termos explícitos do grego; no contexto, o par funciona como contraste entre judeu e não judeu.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: o mesmo Senhor é Senhor de todos
  rationale: A repetição torna explícita em português a predicação da oração nominal grega e preserva πάντων como “de todos”.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título cristológico e sua ressonância bíblica no contexto de Romanos 10.
- source_word: πλουτῶν εἰς πάντας
  choice: é rico para com todos
  rationale: Conserva a metáfora de riqueza e o direcionamento da abundância divina, em formulação portuguesa digna e compreensível.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: os que o invocam
  rationale: “Invocar” expressa com precisão o ato de chamar pelo Senhor em fé e se harmoniza com a citação bíblica no versículo seguinte.
theological_decisions:
- issue: Referente de “Senhor” no contexto
  choice: Manter apenas o título “Senhor”, permitindo que o contexto de Romanos 10:9–13 indique Jesus.
  alternative: Explicitar “Jesus” ou entender a expressão como referência geral a Deus.
  rationale: O contexto associa a confissão de Jesus como Senhor à linguagem bíblica de invocar o Senhor; não se acrescenta ao texto uma identificação explicativa.
- issue: Alcance de “todos”
  choice: Preservar “todos” com a qualificação “os que o invocam”.
  alternative: Entender “todos” como afirmação universal sem qualificação.
  rationale: A construção grega estende a generosidade sem distinção a todos os integrantes do grupo explicitamente qualificado pelo particípio.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Para com” foi mantido por exprimir naturalmente a orientação da riqueza do Senhor sem eliminar a metáfora. Os marcadores [a] e [b] aparecem no texto.
