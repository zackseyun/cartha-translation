  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: pt
  text: 'E como proclamarão, se não forem enviados? Como está escrito: “Como são belos[a] os pés dos que anunciam boas notícias de coisas boas!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como são bem-vindos” ou “Como chegam em boa hora”. O adjetivo grego pode indicar não apenas beleza, mas também a chegada agradável e oportuna do mensageiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “dos que anunciam boas notícias de coisas boas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: proclamarão
  rationale: O verbo κηρύσσω indica anunciar publicamente. “Proclamarão” preserva esse sentido amplo sem restringi-lo à pregação formal.
- source_word: ἀποσταλῶσιν
  choice: forem enviados
  rationale: O passivo de ἀποστέλλω expressa que os mensageiros são enviados por alguém; a formulação mantém essa dependência sem especificar aqui o agente.
- source_word: καθὼς γέγραπται
  choice: Como está escrito
  rationale: Fórmula portuguesa corrente e digna para introduzir uma citação das Escrituras.
- source_word: ὡραῖοι
  choice: belos
  rationale: “Belos” conserva a imagem poética da citação, enquanto uma nota registra as possíveis nuances de chegada agradável, oportuna ou bem-vinda.
- source_word: πόδες
  choice: pés
  rationale: Mantém literalmente a imagem dos pés dos mensageiros, cuja chegada é celebrada.
- source_word: εὐαγγελιζομένων
  choice: dos que anunciam
  rationale: O particípio designa os que comunicam boas notícias; “anunciam” é natural e preserva a ação do mensageiro sem introduzir linguagem eclesiástica mais específica.
- source_word: τὰ ἀγαθά
  choice: boas coisas
  rationale: Representa de modo direto o sintagma grego “as coisas boas”, sem fundi-lo com o sentido verbal de anunciar boas notícias.
theological_decisions:
- issue: Relação entre a citação sobre os mensageiros e a proclamação do evangelho
  choice: Preservar a imagem ampla dos mensageiros enviados cuja chegada é celebrada.
  alternative: Traduzir com linguagem de “pregar o evangelho”, que poderia sugerir especificamente um ministério formal ou ordenado.
  rationale: O encadeamento de Paulo envolve envio e proclamação, mas a citação celebra os que anunciam boas coisas. A tradução não limita os mensageiros a um ofício eclesiástico específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem retórica e a imagem poética do grego foram preservadas. Os marcadores aparecem no texto junto aos elementos que explicam.
