id: ROM.10.1
reference: Romans 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: pt
  text: Irmãos[a], o desejo do meu coração e a minha oração a Deus em favor deles têm por objetivo a salvação deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego emprega a forma masculina plural, que pode dirigir-se a um grupo misto.
    reason: alternativa lexical e esclarecimento do alcance inclusivo possível
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Irmãos
  rationale: Vocativo plural masculino de ἀδελφός. «Irmãos» preserva a forma do texto grego e é uma maneira natural e digna de dirigir-se à comunidade; o possível alcance inclusivo é indicado em nota.
- source_word: εὐδοκία
  choice: desejo
  rationale: Neste contexto, designa aquilo que Paulo deseja sinceramente. «Desejo» é claro e combina naturalmente com «do meu coração».
- source_word: τῆς ἐμῆς καρδίας
  choice: do meu coração
  rationale: Mantém de forma direta a relação genitiva do grego e a expressão corrente em português.
- source_word: δέησις
  choice: oração
  rationale: Refere-se a uma súplica ou pedido dirigido a Deus. «Oração» é natural e legível, enquanto o contexto comunica seu caráter de petição.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: πρός com acusativo indica a direção da oração; «a Deus» é a formulação idiomática em português.
- source_word: ὑπὲρ αὐτῶν
  choice: em favor deles
  rationale: ὑπέρ exprime benefício ou representação. «Em favor deles» distingue claramente este complemento da expressão final sobre a salvação.
- source_word: αὐτῶν
  choice: deles
  rationale: Preserva o pronome grego, cujo referente é recuperado do contexto anterior, sem introduzir explicitamente «Israel» no versículo.
- source_word: εἰς σωτηρίαν
  choice: pela salvação deles
  rationale: εἰς indica o alvo da oração. A formulação explicita naturalmente em português que a salvação desejada é a deles, sem determinar além do necessário se a preposição expressa apenas alvo ou também resultado.
- source_word: μὲν
  choice: não explicitado
  rationale: A partícula tem função discursiva leve e não recebe neste versículo um δέ correlativo explícito. Vertê-la isoladamente deixaria a frase artificial em português.
theological_decisions:
- issue: Alcance de gênero em Ἀδελφοί
  choice: Irmãos
  alternative: Irmãos e irmãs
  rationale: O texto principal preserva o plural masculino da forma grega. Como o vocativo pode dirigir-se a uma comunidade mista, essa possibilidade é registrada em nota sem substituir a forma fonte.
- issue: Relação de εἰς σωτηρίαν com a oração
  choice: pela salvação deles
  alternative: para que sejam salvos
  rationale: A redação escolhida conserva a construção nominal e o alvo da oração, evitando transformar a frase em uma oração final mais interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «deles» evita ambiguidade sobre quem deve receber a salvação, enquanto «em favor deles» impede uma sequência pesada de dois complementos introduzidos por «por».
