id: ROM.10.5
reference: Romans 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: pt
  text: 'Pois Moisés escreve a respeito da justiça[a] que vem da Lei: “O homem[b] que a pratica viverá nela[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: lexical_alternative
  - marker: b
    text: No grego, “o homem” está no masculino singular, mas aqui representa qualquer pessoa que pratique essa justiça.
    reason: cultural_note
  - marker: c
    text: Ou “por ela”. Paulo faz eco a Levítico 18:5.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do argumento anterior de modo natural e conciso em português.
- source_word: γράφει
  choice: escreve
  rationale: Preserva o presente da fórmula de citação das Escrituras.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: É o equivalente português natural para δικαιοσύνη e mantém a ligação com o contraste paulino entre a justiça proveniente da Lei e a proveniente da fé.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: que vem da Lei
  rationale: Expressa a ideia de origem indicada por ἐκ e conserva o contraste entre fontes de justiça.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: O homem que a praticar
  rationale: Reproduz o singular masculino representativo e verte o particípio aoristo como condição geral, de maneira idiomática em português.
- source_word: ζήσεται
  choice: viverá
  rationale: Tradução direta do futuro, preservando o eco de Levítico 18:5.
- source_word: ἐν αὐτῇ
  choice: por ela
  rationale: Mantém o pronome feminino singular, cujo antecedente imediato é a justiça proveniente da Lei, e expressa o valor instrumental possível de ἐν.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contraste paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é a correspondência lexical consolidada em português e preserva as dimensões forense, relacional e ética do termo sem restringi-lo a uma única interpretação.
- issue: Força representativa de ἄνθρωπος
  choice: o homem
  alternative: a pessoa
  rationale: A tradução conserva o masculino singular do grego, enquanto a nota esclarece que ele representa qualquer ser humano.
- issue: Referência de ἐν αὐτῇ
  choice: por ela
  alternative: nela
  rationale: O feminino singular concorda formalmente com “justiça”; “por ela” comunica o possível sentido instrumental, enquanto “nela” preserva mais diretamente a forma preposicional e a ambiguidade do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por se referir à Lei de Moisés. A estrutura mantém o singular do texto grego em vez de introduzir o plural “estas coisas” da formulação de Levítico.
