  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: pt
  text: Assim, a fé vem pelo ouvir, e o ouvir vem pela palavra do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela palavra a respeito do Messias” ou “pela mensagem sobre o Messias”. O genitivo grego pode ser entendido de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Assim
  rationale: Marca a conclusão inferida do argumento anterior e soa natural em português contemporâneo.
- source_word: πίστις
  choice: fé
  rationale: No contexto de Romanos 10:14–16, refere-se à resposta de fé à mensagem proclamada, não principalmente à fidelidade.
- source_word: ἐξ ἀκοῆς
  choice: vem pelo ouvir
  rationale: ἐκ indica fonte ou origem; o verbo “vem”, implícito na oração nominal grega, produz uma frase clara e idiomática.
- source_word: ἀκοή
  choice: ouvir
  rationale: O termo pode indicar tanto o ato de ouvir quanto aquilo que se ouve. “Ouvir” preserva aqui a ligação verbal com a proclamação descrita no contexto.
- source_word: δὲ
  choice: e
  rationale: A partícula liga a segunda oração de modo continuativo, sem exigir contraste forte.
- source_word: διὰ
  choice: pela
  rationale: διά com genitivo expressa meio; “pela” comunica de forma natural “por meio da”.
- source_word: ῥήματος
  choice: palavra
  rationale: ῥῆμα pode designar uma palavra ou declaração pronunciada. “Palavra” preserva a forma lexical e a ressonância tradicional sem deixar de ser compreensível.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título. A construção genitiva é mantida de modo relativamente formal no texto, enquanto a possível leitura objetiva é registrada em nota.
theological_decisions:
- issue: Sentido de πίστις neste contexto paulino
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto imediato trata da resposta humana à mensagem proclamada; “fé” expressa esse sentido sem introduzir uma interpretação mais específica.
- issue: Relação do genitivo Χριστοῦ com ῥήματος
  choice: a palavra do Messias
  alternative: a palavra a respeito do Messias; a mensagem sobre o Messias
  rationale: O genitivo grego admite mais de uma relação semântica. O texto principal conserva a formulação menos interpretativa, e a nota mantém explícita a leitura objetiva possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse de “vem” na segunda oração reproduz o paralelismo conciso do grego sem comprometer a clareza.
