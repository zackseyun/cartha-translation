id: ROM.10.2
reference: Romans 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: pt
  text: Pois dou testemunho a respeito deles de que têm zelo por Deus[a], mas não segundo o conhecimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm zelo de Deus”. O genitivo grego admite uma tradução mais literal, mas aqui provavelmente indica zelo dirigido a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não com pleno conhecimento” ou “não baseado no conhecimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: dou testemunho
  rationale: Preserva a força declarativa e comprobatória do presente do indicativo, em português claro e digno.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior.
- source_word: αὐτοῖς
  choice: a respeito deles
  rationale: Neste contexto, o dativo indica as pessoas acerca das quais Paulo testemunha, e não os destinatários do testemunho.
- source_word: ζῆλον θεοῦ
  choice: zelo por Deus
  rationale: 'Entende o genitivo como objetivo: o zelo é dirigido a Deus. A nota preserva a possibilidade de uma tradução mais literal.'
- source_word: ἔχουσιν
  choice: têm
  rationale: Equivalente natural e direto do presente do indicativo.
- source_word: ἀλλ’
  choice: mas
  rationale: Expressa claramente o contraste entre o zelo reconhecido e a deficiência indicada a seguir.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: não segundo o conhecimento
  rationale: Preserva de modo relativamente formal a construção κατά com acusativo e evita definir silenciosamente o conhecimento como pleno, verdadeiro ou correto.
theological_decisions:
- issue: Natureza do zelo de Israel
  choice: O zelo deles é dirigido a Deus, mas não corresponde ao conhecimento.
  alternative: Eles têm o zelo de Deus, ou têm zelo religioso sem que se especifique seu objeto.
  rationale: 'No contexto, ζῆλον θεοῦ provavelmente contém um genitivo objetivo. A formulação mantém a tensão do texto: reconhece a sinceridade do zelo sem validar sua orientação cognitiva.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o tom argumentativo de Paulo e uma correspondência próxima ao grego sem recorrer a linguagem arcaica.
