id: ROM.10.20
reference: Romans 10:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: pt
  text: 'Mas Isaías se atreve a dizer: “Fui encontrado por aqueles que não me buscavam[a]; tornei-me manifesto àqueles que não perguntavam por mim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fui encontrado entre aqueles que não me buscavam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu me dei a conhecer àqueles que não perguntavam por mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: se atreve a dizer
  rationale: O verbo expressa ousadia ou atrevimento. Em conjunto com καὶ λέγει, esta formulação é natural em português e preserva o caráter audacioso da declaração de Isaías.
- source_word: Εὑρέθην
  choice: Fui encontrado
  rationale: Mantém de forma transparente o aoristo passivo e a autorreferência divina presente na citação de Isaías.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: por aqueles que não me buscavam
  rationale: Embora ἐν signifique formalmente “em” ou “entre”, com o passivo “fui encontrado” a construção indica de modo idiomático as pessoas pelas quais Deus foi encontrado. A alternativa mais formal, “entre aqueles”, é registrada em nota.
- source_word: ζητοῦσιν
  choice: buscavam
  rationale: “Buscar” preserva o sentido e a ressonância bíblica de ζητέω, além de formar um paralelo claro com “perguntavam por mim”.
- source_word: ἐμφανὴς ἐγενόμην
  choice: tornei-me manifesto
  rationale: Reproduz a estrutura predicativa do grego e conserva a ênfase na manifestação, sem explicitar além do texto a ação reflexiva de dar-se a conhecer.
- source_word: ἐπερωτῶσιν
  choice: perguntavam por mim
  rationale: Expressa o sentido de perguntar ou indagar e evita importar o sentido teológico mais específico de “invocar”, não exigido pelo verbo neste contexto.
- source_word: δὲ
  choice: Mas
  rationale: Marca adequadamente o contraste com a argumentação e a citação anteriores.
- source_word: Ἠσαΐας
  choice: Isaías
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: A manifestação divina na citação de Isaías
  choice: tornei-me manifesto àqueles que não perguntavam por mim
  alternative: eu me dei a conhecer àqueles que não perguntavam por mim
  rationale: A formulação escolhida preserva a expressão grega de tornar-se manifesto, sem resolver a tensão mediante uma paráfrase reflexiva. A alternativa idiomática é mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se atreve a dizer” transmite naturalmente a ousadia de Isaías; “manifesto” conserva a precisão formal da citação, enquanto a nota oferece a alternativa mais idiomática.
