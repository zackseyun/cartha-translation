id: ROM.10.16
reference: Romans 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: pt
  text: 'Mas nem todos obedeceram às boas-novas[a]. Pois Isaías diz: “Senhor, quem creu em nossa mensagem[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao evangelho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em nosso relato”; literalmente, “em nosso ouvir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Marca de forma natural e concisa o contraste com o argumento anterior.
- source_word: οὐ πάντες
  choice: nem todos
  rationale: Preserva a negação parcial do grego, sem sugerir rejeição total.
- source_word: ὑπήκουσαν
  choice: obedeceram
  rationale: Mantém o sentido forte de ὑπακούω, que indica obediência, não mera audição.
- source_word: τῷ εὐαγγελίῳ
  choice: às boas-novas
  rationale: Expressa de modo transparente o sentido de εὐαγγέλιον; a forma tradicional “evangelho” consta em nota.
- source_word: Ἠσαΐας
  choice: Isaías
  rationale: Forma portuguesa consagrada do nome do profeta.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a citação bíblica como fundamento da afirmação anterior.
- source_word: λέγει
  choice: diz
  rationale: Conserva o presente do texto grego e a apresentação da Escritura como voz vigente.
- source_word: Κύριε
  choice: Senhor
  rationale: Tradução direta e reverente do vocativo κύριε em português atual.
- source_word: τίς
  choice: quem
  rationale: Equivalente interrogativo direto.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: O pretérito perfeito traduz naturalmente o aoristo na pergunta retórica da citação.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: em nossa mensagem
  rationale: Neste contexto, ἀκοή designa com naturalidade o conteúdo anunciado e ouvido; a ambiguidade lexical é registrada em nota.
theological_decisions:
- issue: Natureza da resposta exigida pelas boas-novas em ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: “obedeceram às boas-novas”
  alternative: “deram ouvidos às boas-novas” ou “acolheram as boas-novas”
  rationale: O verbo grego expressa obediência. A tradução preserva a ligação feita por Paulo entre fé e resposta obediente, sem impor um esquema denominacional sobre a salvação.
- issue: Sentido de ἀκοή na citação de Isaías
  choice: “mensagem”
  alternative: “relato”, “anúncio” ou, literalmente, “audição”
  rationale: O termo pode indicar tanto o ouvir quanto aquilo que é ouvido. Aqui, o conteúdo proclamado é o sentido mais natural, mas a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A colocação “nem todos” preserva a precisão lógica; “boas-novas” torna εὐαγγέλιον transparente, enquanto a forma tradicional aparece em nota.
