  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: pt
  text: Pois o Messias é o fim da Lei, para a justiça de todo aquele que crê.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “o alvo”, “a culminação” ou “o cumprimento”: a palavra grega traduzida como “fim” pode indicar término, objetivo, resultado ou culminação.'
    reason: alternative_reading
  - marker: b
    text: Ou “retidão” para “justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: fim
  rationale: “Fim” preserva a ambiguidade do grego, que pode indicar término, objetivo, resultado ou culminação, sem resolver no texto principal uma questão interpretativa genuína.
- source_word: νόμου
  choice: da Lei
  rationale: Neste contexto paulino, a referência é à Lei mosaica como realidade conhecida; a inicial maiúscula ajuda a sinalizar esse referente em português.
- source_word: Χριστὸς
  choice: o Messias
  rationale: O contexto ressalta o título e a relação de Jesus com a Lei e as esperanças de Israel; “Messias” comunica o sentido de Χριστός em vez de apenas transliterá-lo.
- source_word: εἰς δικαιοσύνην
  choice: para justiça
  rationale: “Para” mantém a força direcional de εἰς e permite que a expressão indique finalidade ou resultado sem especificação excessiva.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Em português, “justiça” é o equivalente lexical natural e amplo de δικαιοσύνη, embora “justificação” possa representar uma leitura contextual mais específica; essa alternativa é registrada em nota.
- source_word: παντὶ τῷ πιστεύοντι
  choice: de todo aquele que crê
  rationale: A construção portuguesa liga naturalmente “justiça” às pessoas que creem, preserva o particípio e evita acrescentar uma formulação confessional não expressa no grego.
- source_word: γὰρ
  choice: Pois
  rationale: “Pois” apresenta o versículo como explicação do argumento precedente e corresponde ao valor discursivo de γάρ.
theological_decisions:
- issue: Sentido de τέλος νόμου em relação à Lei mosaica
  choice: “fim da Lei” no texto principal
  alternative: “alvo da Lei”, “culminação da Lei” ou “cumprimento da Lei”
  rationale: A formulação conserva tanto a possível ideia de término quanto a de alvo ou culminação, deixando explícitas em nota as principais possibilidades sem decidir entre elas.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: A afirmação trata da relação de Jesus com a Lei no âmbito da história e das esperanças de Israel, favorecendo a tradução do título.
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: justificação
  rationale: “Justiça” conserva a amplitude lexical do termo grego; “justificação” explicita uma possível nuance forense, mas estreitaria o sentido no texto principal.
- issue: Relação sintática de εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι
  choice: “para justiça de todo aquele que crê”
  alternative: “para que todo aquele que crê alcance justiça”
  rationale: A versão principal acompanha a concisão e a estrutura comprimida do grego, sem explicitar além do texto como a justiça se relaciona com quem crê.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a concisão enfática do grego e preserva suas ambiguidades centrais por meio de notas.
