  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: pt
  text: 'Mas eu pergunto: será que não ouviram? Claro que sim: “A voz[a] deles se espalhou por toda a terra, e suas palavras chegaram aos confins do mundo habitado[b].”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “som”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou simplesmente: “mundo”. O grego diz “mundo habitado”.'
    reason: lexical_alternative
  - marker: c
    text: Paulo cita o Salmo 19:4 e aplica sua linguagem à difusão da mensagem.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: será que não ouviram?
  rationale: A pergunta retórica com μή οὐκ espera resposta afirmativa. A formulação é natural em português e representa adequadamente o aoristo.
- source_word: μενοῦνγε
  choice: Claro que sim
  rationale: Expressa com naturalidade a resposta enfática afirmativa e explicita o verbo subentendido.
- source_word: φθόγγος
  choice: voz
  rationale: Preserva o paralelismo com “palavras” e comunica uma proclamação audível; “som” continua sendo alternativa lexical possível.
- source_word: ἐξῆλθεν
  choice: se espalhou
  rationale: No contexto da citação poética, comunica de modo idiomático que a voz saiu e alcançou toda a terra, sem impor um referente específico.
- source_word: γῆ
  choice: terra
  rationale: A citação tem alcance universal, não o sentido restrito de um território.
- source_word: πέρατα
  choice: confins
  rationale: “Confins” é a expressão portuguesa corrente e digna para as extremidades do mundo, preservando o tom poético.
- source_word: οἰκουμένης
  choice: mundo habitado
  rationale: Torna explícita a nuance lexical de οἰκουμένη, embora “mundo” isoladamente seja uma opção mais simples.
- source_word: ῥήματα
  choice: palavras
  rationale: É o equivalente direto e mantém o paralelismo poético com “voz”, sem interpretar o termo como “mensagem”.
theological_decisions:
- issue: Referente de “deles” na citação do Salmo aplicada por Paulo
  choice: Manter o pronome sem expansão interpretativa
  alternative: Explicitar “os céus” com base no Salmo 19 ou identificar o referente como os proclamadores do evangelho
  rationale: Paulo reutiliza a linguagem do Salmo em seu argumento. Manter “deles” preserva a ambiguidade intertextual e evita impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Será que” marca naturalmente a pergunta retórica; “Claro que sim” conserva a ênfase de μενοῦνγε. A ordem e o paralelismo da citação foram preservados sem resolver o referente do pronome.
