- from: Então os olhos deles se abriram, e eles o reconheceram; mas ele deixou de ser visto por eles.[a]
  to: Então os olhos deles se abriram, e eles o reconheceram; e ele se tornou invisível para eles.[a]
  rationale: A revisão substitui a adversativa não expressa no grego por coordenação com «e» e adota «tornou-se invisível para eles», formulação mais próxima de ἄφαντος ἐγένετο ἀπ’ αὐτῶν. A nota conserva alternativas legítimas sem impor uma explicação do acontecimento.
