    issue: «Mas» traduz καί.
    rationale: A conjunção καί é aditiva/coordenativa neste ponto. Embora haja uma ironia narrativa entre o reconhecimento e o fato de ele não ser mais visto, o texto grego não a formula por uma adversativa; «mas» introduz uma relação interpretativa não marcada na fonte.
  revised_text: Então os olhos deles se abriram, e eles o reconheceram; e ele se tornou invisível para eles.[a]
