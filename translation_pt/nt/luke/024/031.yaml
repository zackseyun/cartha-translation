source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: pt
  text: Então os olhos deles se abriram, e eles o reconheceram; e ele se tornou invisível para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «deixou de ser visto por eles»; ou: «desapareceu da vista deles».'
    reason: Alternativas lexicais para ἄφαντος ἐγένετο ἀπ’ αὐτῶν, expressão que indica que ele já não era visível para eles sem explicar o mecanismo.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: se abriram
  rationale: O aoristo passivo de διανοίγω indica que a percepção lhes foi aberta, sem apresentar isso como iniciativa própria. Em português, a passiva pronominal é natural e preserva esse valor.
- source_word: οἱ ὀφθαλμοὶ
  choice: os olhos deles
  rationale: Reproduz de modo claro a construção grega com o substantivo como sujeito e o pronome genitivo αὐτῶν, evitando o possível sentido idiomático diferente de «seus olhos».
- source_word: ἐπέγνωσαν
  choice: o reconheceram
  rationale: No contexto de Emaús, ἐπιγινώσκω descreve a identificação de alguém que antes não fora reconhecido; «reconheceram» é mais exato que «conheceram».
- source_word: ἄφαντος ἐγένετο ἀπ’ αὐτῶν
  choice: deixou de ser visto por eles
  rationale: Expressa naturalmente que Jesus já não estava visível para eles, preservando a relação indicada por ἀπ’ αὐτῶν sem especificar o mecanismo do acontecimento.
- source_word: καὶ
  choice: mas
  rationale: 'Neste ponto, a conjunção coordena uma mudança contrastante e imediata: eles o reconhecem, mas já não podem vê-lo. «Mas» torna essa relação natural em português sem alterar o conteúdo.'
theological_decisions:
- issue: Natureza do desaparecimento de Jesus
  choice: deixou de ser visto por eles
  alternative: tornou-se invisível para eles; desapareceu da presença deles
  rationale: A expressão grega afirma que ele se tornou não visível em relação a eles, mas não explica como isso aconteceu. A tradução escolhida conserva o mistério narrativo e evita definir um mecanismo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a progressão narrativa e evita linguagem técnica ou confessional.
