  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: pt
  text: E conversavam entre si sobre tudo o que havia acontecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples, sem acrescentar uma nuance temporal não expressa.
- source_word: αὐτοὶ
  choice: '[incorporado no sujeito oculto de “conversavam”]'
  rationale: O pronome explícito grego identifica os dois viajantes, mas o português dispensa sua expressão sem perda relevante; “eles mesmos” daria ênfase excessiva.
- source_word: ὡμίλουν
  choice: conversavam
  rationale: O imperfeito indica uma conversa em andamento no passado; “conversavam” é natural e mantém o sentido recíproco do verbo.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: Expressa de modo idiomático a reciprocidade da conversa.
- source_word: περὶ
  choice: sobre
  rationale: Introduz diretamente o assunto da conversa em português corrente.
- source_word: πάντων τῶν συμβεβηκότων τούτων
  choice: tudo o que havia acontecido
  rationale: Reproduz o conjunto completo dos acontecimentos e o valor anterior do particípio perfeito em relação à conversa, com formulação clara e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A tradução conserva o aspecto durativo de ὡμίλουν e evita a formulação mais pesada “todos estes acontecimentos”.
