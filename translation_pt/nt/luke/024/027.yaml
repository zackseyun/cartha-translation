  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: pt
  text: E, começando por Moisés e por todos os Profetas[b], explicou-lhes[a], em todas as Escrituras, o que dizia respeito a si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “interpretou” ou “expôs”. O verbo grego pode indicar uma explicação detalhada.
    reason: lexical_alternative
  - marker: b
    text: “Moisés e todos os Profetas” refere-se aos escritos bíblicos associados a Moisés e aos livros proféticos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος
  choice: começando
  rationale: O particípio aoristo introduz a ação principal. “Começando” mantém a ligação participial e soa natural em português atual.
- source_word: ἀπὸ Μωϋσέως
  choice: por Moisés
  rationale: Com ἀρξάμενος, ἀπό indica o ponto de partida da exposição. “Começando por Moisés” é idiomático e, no contexto, aponta para os escritos associados a Moisés.
- source_word: πάντων τῶν προφητῶν
  choice: todos os Profetas
  rationale: A inicial maiúscula sinaliza a seção reconhecida das Escrituras chamada “os Profetas”, em paralelo com “Moisés”, sem excluir a referência aos escritos proféticos.
- source_word: διερμήνευσεν
  choice: explicou-lhes
  rationale: O verbo pode significar interpretar, explicar ou expor em detalhe. “Explicou-lhes” comunica com clareza a ação expositiva no português corrente.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: O pronome dativo é expresso naturalmente pelo pronome oblíquo ligado ao verbo.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: em todas as Escrituras
  rationale: γραφή designa aqui as Escrituras sagradas, e πάσαις preserva a amplitude da exposição sem afirmar que cada passagem individual fala diretamente de Jesus.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: o que dizia respeito a si mesmo
  rationale: A expressão neutra plural abrange assuntos, passagens ou temas relacionados a Jesus. A formulação evita restringi-la apenas a predições explícitas.
theological_decisions:
- issue: Alcance da exposição bíblica feita por Jesus
  choice: A tradução afirma que Jesus explicou, no conjunto das Escrituras, o que dizia respeito a ele, sem definir uma única categoria hermenêutica.
  alternative: Limitar a referência somente a predições messiânicas diretas, ou afirmar que cada passagem das Escrituras se refere individual e diretamente a Jesus.
  rationale: O grego sustenta uma leitura cristológica ampla, mas não especifica que se trate apenas de predições nem exige a ideia de referência direta em cada texto. A formulação preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “Escrituras” e “Profetas” com inicial maiúscula para indicar divisões ou coleções bíblicas reconhecidas. A colocação de “em todas as Escrituras” entre vírgulas conserva a progressão da frase sem tornar a sintaxe excessivamente pesada.
