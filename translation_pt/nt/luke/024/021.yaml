  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: pt
  text: Nós, porém, esperávamos que ele fosse quem havia de redimir Israel[a][b]. Contudo, além de tudo isso, hoje já é o terceiro dia desde que essas coisas aconteceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele era quem iria redimir Israel”. O grego mantém um verbo no presente (“é”) no conteúdo da esperança passada.'
    reason: alternative_reading
  - marker: b
    text: “Redimir Israel” pode referir-se, em sentido amplo, à esperada libertação messiânica; o texto não especifica se os discípulos têm em mente libertação política, salvação espiritual ou ambas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Nós, porém
  rationale: Preserva o pronome enfático ἡμεῖς e o contraste introduzido por δέ, com formulação digna e corrente em português.
- source_word: ἠλπίζομεν
  choice: esperávamos
  rationale: O imperfeito expressa uma esperança contínua no passado, agora marcada pela decepção.
- source_word: ὅτι αὐτός ἐστιν
  choice: que ele é quem
  rationale: Mantém o presente ἐστιν dentro do conteúdo da esperança passada, em vez de normalizá-lo silenciosamente para o pretérito.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: quem está para redimir
  rationale: Expressa a expectativa ou iminência de μέλλων com infinitivo e conserva sua orientação futura.
- source_word: λυτροῦσθαι
  choice: redimir
  rationale: Preserva tanto a ideia de libertação quanto as ressonâncias pactuais e salvíficas do verbo, sem limitar o tipo de libertação pretendido.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Reproduz diretamente a referência ao povo da aliança como um todo.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Contudo, além de tudo isso
  rationale: Comunica o contraste intensificado e acrescenta mais um motivo de desalento em português natural.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: este já é o terceiro dia
  rationale: Traduz de modo idiomático a expressão grega referente ao decurso do tempo, preservando a menção ordinal ao terceiro dia.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: desde que essas coisas aconteceram
  rationale: Expressa claramente o ponto inicial a partir do qual os dias são contados.
theological_decisions:
- issue: Alcance da esperança messiânica em «redimir Israel»
  choice: Manter «redimir Israel» sem especificar a modalidade da redenção.
  alternative: «libertar Israel» em sentido político ou «salvar Israel» em sentido exclusivamente espiritual.
  rationale: O texto pode abranger libertação nacional, salvação espiritual ou ambas; não define de modo restrito a natureza da expectativa.
- issue: Valor temporal de ἐστιν depois de ἠλπίζομεν
  choice: Manter «ele é quem está para redimir».
  alternative: «ele era quem iria redimir».
  rationale: A construção conserva o presente do original dentro do conteúdo da esperança passada, deixando que o contexto comunique a decepção sem resolver a tensão sintática.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe deliberadamente incomum «esperávamos que ele é» conserva a tensão temporal do grego e é esclarecida em nota. Os dois marcadores foram colocados junto à expressão a que suas notas efetivamente se referem.
