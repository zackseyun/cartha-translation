review_pass:
  verdict: revise
  source_fidelity: A tradução conserva adequadamente o contraste de ἡμεῖς δέ, o imperfeito de ἠλπίζομεν, «redimir Israel» e a contagem temporal. Contudo, «esperávamos que ele é quem está para redimir» não é uma construção aceitável no português moderno em discurso indireto. A forma verbal grega presente pode e deve ser documentada em nota, sem criar uma sintaxe portuguesa artificial. «Havia de redimir» representa bem a expectativa futura associada a ὁ μέλλων λυτροῦσθαι, sem definir a natureza da redenção.
  naturalness: «Nós, porém» e «Contudo, além de tudo isso» têm registro natural e apropriado. A substituição por «esperávamos que ele fosse quem havia de redimir» torna a oração idiomática e legível em português brasileiro e internacional. «Hoje já é o terceiro dia» é uma expressão temporal mais clara do que o pronome potencialmente sem referente em «este já é o terceiro dia».
  terminology: «Redimir Israel» deve ser mantido, pois preserva λυτροῦσθαι e sua amplitude messiânica sem impor uma leitura política ou exclusivamente espiritual. «Havia de redimir» expressa expectativa/destinação sem a implicação excessivamente imediata que «está para redimir» pode ter em português.
