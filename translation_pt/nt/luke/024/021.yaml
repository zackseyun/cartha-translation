  to: Nós, porém, esperávamos que ele fosse quem havia de redimir Israel[a][b]. Contudo, além de tudo isso, hoje já é o terceiro dia desde que essas coisas aconteceram.
  rationale: 'A revisão corrige a construção verbal portuguesa sem resolver a tensão temporal presente no grego: a nota informa explicitamente que ἐστιν está no presente dentro do conteúdo de uma esperança passada. «Havia de redimir» é uma forma portuguesa natural para a expectativa expressa por μέλλων com infinitivo e não restringe o alcance de λυτροῦσθαι. Os dois marcadores permanecem ancorados em «Israel», expressão tratada pelas respectivas notas.'
