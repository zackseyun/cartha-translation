base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: pt
  text: 'Então um deles, chamado Cléopas, respondeu: “Você é o único visitante em Jerusalém que não soube das coisas que aconteceram ali nestes dias?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você é o único que está morando em Jerusalém como forasteiro e não soube...?” O verbo grego pode indicar residir como alguém de fora ou permanecer temporariamente em um lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Então ... respondeu
  rationale: O particípio aoristo introduz a fala como resposta, enquanto δέ funciona como conectivo narrativo leve; a formulação é natural em português.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: um deles, chamado Cleopas
  rationale: O contexto identifica esse homem como um dos dois discípulos; ὀνόματι introduz seu nome.
- source_word: εἶπεν πρὸς αὐτόν
  choice: respondeu
  rationale: A ideia de dizer algo a ele é incorporada naturalmente ao verbo de resposta, sem necessidade de repetir 'disse a ele'.
- source_word: Σὺ μόνος
  choice: Você é o único
  rationale: Preserva a ênfase de μόνος na exclusividade e produz uma pergunta idiomática.
- source_word: παροικεῖς Ἰερουσαλήμ
  choice: visitante em Jerusalém
  rationale: παροικέω indica permanecer ou residir como forasteiro. 'Visitante' comunica com clareza a condição de alguém de fora, embora a extensão da permanência fique explicitada em nota.
- source_word: οὐκ ἔγνως
  choice: não soube
  rationale: O aoristo aponta para não ter tomado conhecimento dos acontecimentos recentes; 'não soube' é natural em português e mantém essa perspectiva.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: das coisas que aconteceram ali
  rationale: Traduz o particípio substantivado de γίνομαι e retoma Jerusalém de modo idiomático com 'ali'.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: nestes dias
  rationale: Mantém de perto a expressão temporal grega, referindo-se aos dias imediatamente recentes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento 'você' torna a pergunta direta e natural; 'Cleopas' segue a forma tradicional portuguesa do nome. A nota preserva a amplitude lexical de παροικεῖς.
