  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: pt
  text: E aconteceu que, enquanto os abençoava, ele se afastou deles e foi elevado ao céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem “e foi elevado ao céu”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual e compreensível.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς
  choice: enquanto os abençoava
  rationale: O infinitivo articular com ἐν indica uma ação simultânea e em curso; a formulação portuguesa a expressa com naturalidade.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: ele se afastou deles
  rationale: Comunica a separação física sem acrescentar motivo ou modo não explicitado no grego.
- source_word: ἀνεφέρετο
  choice: foi elevado
  rationale: Mantém a forma passiva e o movimento para cima sem identificar explicitamente o agente.
- source_word: εἰς τὸν οὐρανόν
  choice: ao céu
  rationale: Neste contexto, οὐρανός se refere ao céu como destino, e não apenas ao céu visível; 'ao céu' é idiomático em português.
theological_decisions:
- issue: Cláusula entre colchetes καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Incluída no texto principal, com nota de variante textual
  alternative: 'Omitir a cláusula: “e foi elevado ao céu”'
  rationale: A SBLGNT assinala incerteza textual mediante colchetes. A tradução inclui a cláusula fornecida, mas informa a variante significativa sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é direta e preserva tanto a simultaneidade da bênção quanto a voz passiva da elevação.
