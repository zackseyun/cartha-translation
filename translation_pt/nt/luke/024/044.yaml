  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: pt
  text: 'Então ele lhes disse: “Estas são as minhas palavras que lhes falei enquanto ainda estava com vocês: é necessário que se cumpra tudo o que está escrito[a] a meu respeito[c] na Lei de Moisés, nos Profetas e nos Salmos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as coisas escritas”.'
    reason: lexical_alternative
  - marker: b
    text: “A Lei de Moisés, os Profetas e os Salmos” provavelmente se refere às principais divisões das Escrituras de Israel. “Salmos” pode designar especificamente o Saltério ou, de modo mais amplo, os Escritos.
    reason: cultural_note
  - marker: c
    text: 'Ou: “acerca de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Então ele lhes disse
  rationale: δέ funciona como conexão narrativa leve; “Então” dá continuidade natural. “Lhes disse” expressa de modo idiomático πρὸς αὐτούς após o verbo de fala.
- source_word: Οὗτοι οἱ λόγοι μου οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: Foi isto que eu lhes disse
  rationale: A formulação portuguesa comunica naturalmente a referência de Jesus às palavras anteriormente ditas, sem reproduzir de modo rígido “Estas são as minhas palavras”. O plural λόγοι é compreendido coletivamente no pronome “isto”.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: enquanto ainda estava com vocês
  rationale: A construção participial tem valor temporal. “Ainda” preserva ἔτι, e “com vocês” oferece leitura ampla e natural em português contemporâneo.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: era necessário que se cumprisse
  rationale: Preserva a força de necessidade de δεῖ e o sentido de cumprimento das Escrituras em πληρωθῆναι. O imperfeito “era necessário” integra naturalmente a oração ao conteúdo das palavras anteriormente pronunciadas, sem enfraquecer a necessidade.
- source_word: πάντα τὰ γεγραμμένα
  choice: tudo o que está escrito
  rationale: Mantém a abrangência de πάντα e o estado resultante do perfeito γεγραμμένα. A nota registra a alternativa formal “todas as coisas escritas”.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: na Lei de Moisés, nos Profetas e nos Salmos
  rationale: As maiúsculas sinalizam coleções reconhecidas das Escrituras de Israel. A repetição de “nos” torna clara em português a coordenação dos três termos.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Expressa com precisão a referência indicada por περί com genitivo. É corrente, digna e ligeiramente mais formal que “sobre mim”.
theological_decisions:
- issue: Força da necessidade do cumprimento das Escrituras
  choice: era necessário que se cumprisse
  alternative: devia cumprir-se; tinha de se cumprir
  rationale: A tradução conserva a necessidade expressa por δεῖ sem explicar além do texto o mecanismo, a extensão ou uma teoria específica do cumprimento profético.
- issue: Identificação da Lei de Moisés, dos Profetas e dos Salmos
  choice: Tratar os termos como nomes de coleções escriturísticas, com explicação cautelosa em nota
  alternative: Entender “Salmos” apenas como o livro dos Salmos ou categoricamente como designação de todos os Escritos
  rationale: A expressão provavelmente evoca grandes divisões das Escrituras de Israel, mas permanece ambíguo se “Salmos” nomeia especificamente o Saltério ou representa mais amplamente os Escritos.
- issue: Referente de περὶ ἐμοῦ
  choice: a meu respeito
  alternative: sobre mim; acerca de mim
  rationale: A tradução mantém a afirmação de que os textos se referem a Jesus, sem especificar se cada passagem o faz diretamente, tipologicamente ou de outra maneira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e evita construções excessivamente literais. Todos os marcadores de nota aparecem no texto principal.
