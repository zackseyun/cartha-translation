  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: pt
  text: 'dizendo[a]: “O Senhor realmente foi ressuscitado e apareceu a Simão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Senhor de fato ressuscitou”. O advérbio e o verbo gregos admitem formulações próximas; o texto principal preserva a voz passiva do grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: dizendo
  rationale: Particípio presente acusativo masculino plural, ligado ao contexto da frase anterior; “dizendo” preserva essa ligação sem explicitar além do grego quem fala.
- source_word: ὅτι
  choice: ': “'
  rationale: Introduz o conteúdo da fala; em português, dois-pontos e aspas comunicam naturalmente o discurso direto.
- source_word: ὄντως
  choice: realmente
  rationale: Enfatiza a realidade factual do anúncio. “Realmente” é corrente e mantém a força afirmativa do advérbio.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: Aoristo passivo de ἐγείρω. A formulação preserva a voz passiva do grego e é clara em português moderno.
- source_word: ὁ κύριος
  choice: O Senhor
  rationale: Mantém o título cristológico κύριος com seu peso habitual, sem o enfraquecer para “Mestre”.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga a ressurreição à aparição.
- source_word: ὤφθη
  choice: apareceu
  rationale: A forma passiva de ὁράω é usada idiomaticamente para uma aparição; “apareceu” é a expressão natural em português e evita o pouco idiomático “foi visto por Simão”.
- source_word: Σίμωνι
  choice: a Simão
  rationale: O dativo indica a pessoa a quem o Senhor apareceu. Conserva-se apenas “Simão”, sem acrescentar “Pedro”, que não está no texto.
theological_decisions:
- issue: Voz do verbo da ressurreição
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: O grego emprega a voz passiva. Preservá-la mantém a formulação do texto e evita eliminar a possível implicação da ação divina, sem explicitar o agente.
- issue: Tradução de κύριος
  choice: O Senhor
  alternative: o Mestre
  rationale: Neste contexto, κύριος funciona como título de Jesus; “Senhor” conserva seu peso cristológico e seu uso neotestamentário habitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Realmente” é mais corrente que “verdadeiramente”, e “foi ressuscitado” preserva de modo natural a voz passiva. O início em minúscula reflete a dependência sintática do contexto anterior.
