  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: pt
  text: E eles mesmos contavam o que tinha acontecido no caminho e como ele lhes foi dado a conhecer ao partir o pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como eles o reconheceram ao partir o pão”. O verbo grego está na voz passiva e pode destacar tanto o reconhecimento por parte deles quanto o fato de ele lhes ter sido dado a conhecer.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: Preserva a ênfase do pronome explícito, destacando que os dois discípulos apresentavam agora seu próprio relato.
- source_word: ἐξηγοῦντο
  choice: contavam
  rationale: Expressa de modo natural a narração em andamento indicada pelo imperfeito, sem sugerir uma exposição formal.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: o que tinha acontecido no caminho
  rationale: Torna explícito em português o sentido elíptico da expressão grega e mantém a referência à jornada.
- source_word: ὡς
  choice: como
  rationale: Introduz naturalmente o modo ou circunstância em que Jesus se tornou conhecido.
- source_word: ἐγνώσθη
  choice: ele se dera a conhecer a eles
  rationale: Conserva, em português idiomático, o foco passivo/resultativo do grego e não reduz a cena apenas à percepção humana.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: ao partir o pão
  rationale: É a formulação corrente e clara em português para a circunstância concreta da refeição; o artigo em 'o pão' combina com a cena específica do contexto.
theological_decisions:
- issue: Se ἐγνώσθη deve indicar apenas reconhecimento humano ou preservar a nuance de que Jesus lhes foi dado a conhecer
  choice: ele se dera a conhecer a eles
  alternative: eles o reconheceram
  rationale: A forma passiva grega e o contexto de Lucas 24:31 permitem uma nuance além da simples percepção dos discípulos. A tradução escolhida preserva essa tensão sem afirmar explicitamente o agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “se dera a conhecer” preserva a anterioridade em relação ao relato e a nuance do passivo grego; “ao partir o pão” evita uma nominalização pouco natural.
