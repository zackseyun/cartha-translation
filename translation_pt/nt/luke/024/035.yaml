  rationale: A revisão substitui a construção reflexiva no mais-que-perfeito por uma forma passiva em português que corresponde mais precisamente a ἐγνώσθη e preserva a tensão narrativa e teológica do texto, sem identificar o agente da ação. Os demais elementos do versículo permanecem adequados.
