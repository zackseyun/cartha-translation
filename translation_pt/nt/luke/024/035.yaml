review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a ênfase de αὐτοὶ, o relato no imperfeito, a elipse de τὰ ἐν τῇ ὁδῷ e a circunstância de ἐν τῇ κλάσει τοῦ ἄρτου. Contudo, “ele se dera a conhecer” apresenta Jesus como agente reflexivo da ação e emprega um mais-que-perfeito que não é exigido pelo aoristo passivo ἐγνώσθη. “Foi dado a conhecer” conserva de modo mais direto a voz passiva, sem especificar o agente.
  naturalness: “E eles mesmos contavam o que tinha acontecido no caminho” é claro e natural. “Ele lhes foi dado a conhecer” é uma formulação digna, compreensível e natural no registro bíblico moderno; “lhes” é mais fluente que “a eles”.
  terminology: “Partir o pão” é expressão estabelecida e adequada para κλάσις τοῦ ἄρτου. A nota preserva apropriadamente a alternativa interpretativa “eles o reconheceram”, sem resolver indevidamente a ambiguidade da passiva grega.
  issues:
  - severity: medium
    issue: “ele se dera a conhecer a eles” altera a orientação da voz passiva e introduz anterioridade verbal desnecessária.
    rationale: 'ἐγνώσθη é aoristo passivo: pode ser entendido como “foi reconhecido” ou “foi dado a conhecer”. A construção reflexiva “ele se deu a conhecer” tende a fazer de Jesus o agente explícito, enquanto “se dera” acrescenta um valor de mais-que-perfeito não marcado no grego.'
  revised_text: E eles mesmos contavam o que tinha acontecido no caminho e como ele lhes foi dado a conhecer ao partir o pão.[a]
  revised_footnotes:
