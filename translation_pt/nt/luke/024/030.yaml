id: LUK.24.30
reference: Luke 24:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: pt
  text: E aconteceu que, quando ele se reclinou à mesa com eles[a], tomou o pão, pronunciou uma bênção e, depois de parti-lo, começou a lhes dar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sentou-se à mesa com eles». O grego se refere mais especificamente a reclinar-se à mesa, conforme o costume antigo durante as refeições.
    reason: cultural_note
  - marker: b
    text: Ou «estava lhes dando». O imperfeito grego pode destacar uma ação em andamento; «começou a lhes dar» expressa aqui o início da ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português natural, sem recorrer ao arcaico «sucedeu que».
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: quando ele se reclinou à mesa com eles
  rationale: A construção com infinitivo articular tem sentido temporal, e κατακλίνω, no contexto de uma refeição, descreve o costume antigo de reclinar-se à mesa.
- source_word: λαβὼν τὸν ἄρτον
  choice: tomou o pão
  rationale: Converte o particípio em verbo finito para dar fluidez ao português, mantendo a sequência da ação e o artigo definido.
- source_word: εὐλόγησεν
  choice: pronunciou a bênção
  rationale: No contexto da refeição, indica proferir uma bênção. Esta formulação evita a possível impressão, em «abençoou-o», de que o objeto explícito do verbo seja necessariamente o pão, algo que o grego não declara.
- source_word: κλάσας
  choice: depois de parti-lo
  rationale: Explicita de modo natural que a ação do particípio aoristo precede a distribuição; o pronome retoma o pão.
- source_word: ἐπεδίδου
  choice: começou a dá-lo a eles
  rationale: Expressa uma leitura incoativa plausível do imperfeito, adequada ao início da distribuição, sem ocultar na nota a alternativa durativa.
theological_decisions:
- issue: Possíveis ressonâncias eucarísticas ou sacramentais na sequência das ações
  choice: Empregar linguagem comum de refeição, preservando a sequência «tomou... pronunciou a bênção... partiu... deu»
  alternative: Formular o texto de modo que identifique mais diretamente a ação com a Ceia do Senhor
  rationale: A sequência pode evocar outras cenas de refeição e permitir reflexão teológica, mas este versículo não identifica explicitamente o ato como rito sacramental. A tradução evita acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Reclinou-se à mesa» conserva o dado cultural sem tornar a frase excessivamente técnica; as notas registram alternativas genuínas sem resolver indevidamente a ambiguidade aspectual.
