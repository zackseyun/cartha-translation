  - severity: low
    issue: «Pronunciou a bênção» pode sugerir uma fórmula ou bênção determinada não especificada no grego.
    rationale: εὐλόγησεν ocorre sem objeto expresso. «Pronunciou uma bênção» conserva essa falta de especificação, sem transformar a ação em uma fórmula identificada.
