  source_fidelity: A tradução preserva a sequência narrativa e o sentido temporal de ἐν τῷ + infinitivo. «Reclinou-se à mesa» comunica adequadamente a prática de refeição antiga. A leitura incoativa de ἐπεδίδου em «começou a lhes dar» é possível, e a nota mantém a alternativa durativa. Para εὐλόγησεν, uma formulação indefinida («pronunciou uma bênção») respeita melhor o uso absoluto do verbo grego, que não explicita nem o conteúdo nem um objeto direto.
  naturalness: «Começou a dá-lo a eles» é gramatical, mas soa pouco natural no português moderno de ampla circulação, sobretudo para leitores brasileiros. «Começou a lhes dar» é mais idiomático e mantém o pão como referente recuperável. «Pronunciou uma bênção» também flui melhor sem pressupor uma bênção específica.
  terminology: A terminologia proposta evita identificar a cena como rito sacramental e não introduz formulações confessionais. «Uma bênção» reproduz com sobriedade o ato de εὐλογέω no contexto da refeição.
