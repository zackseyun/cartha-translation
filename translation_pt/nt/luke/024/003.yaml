  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: pt
  text: Mas, quando entraram[a], não encontraram o corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “o corpo do Senhor Jesus”.'
