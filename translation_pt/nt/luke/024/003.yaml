lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: quando entraram
  rationale: O particípio aoristo ativo, no feminino plural, retoma as mulheres e é expresso naturalmente em português como oração temporal.
- source_word: δὲ
  choice: Mas
  rationale: Marca a progressão narrativa com leve contraste entre a entrada no túmulo e o resultado inesperado.
- source_word: οὐχ εὗρον
  choice: não encontraram
  rationale: Reproduz de modo simples e idiomático a negação do aoristo de εὑρίσκω.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: É a equivalência direta de σῶμα e evita tanto a coloração mais crua de 'cadáver' quanto a identificação ampliada ausente no texto-base.
theological_decisions:
- issue: Se deve especificar de quem era o corpo
  choice: o corpo
  alternative: o corpo do Senhor Jesus
  rationale: O texto da SBLGNT fornecido traz apenas τὸ σῶμα. A tradução conserva essa leitura mais curta e registra em nota a variante ampliada.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O pronome sujeito permanece implícito, como é idiomático em português, e o referente feminino plural é recuperado pelo contexto.
