  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: pt
  text: Mas também algumas mulheres do nosso grupo nos deixaram atônitos[a], tendo ido bem cedo[b] ao túmulo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos deixaram perplexos” ou “nos espantaram”. O verbo grego pode indicar forte surpresa ou desorientação.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao amanhecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mas também
  rationale: Preserva tanto o contraste com a decepção relatada antes quanto o acréscimo de um fato surpreendente.
- source_word: γυναῖκές τινες
  choice: algumas mulheres
  rationale: Forma natural e atual de expressar o plural indefinido.
- source_word: ἐξ ἡμῶν
  choice: do nosso grupo
  rationale: Indica com clareza que as mulheres pertenciam ao círculo dos discípulos.
- source_word: ἐξέστησαν ἡμᾶς
  choice: nos deixaram atônitos
  rationale: Comunica forte surpresa e admite certa desorientação, sem definir se os discípulos creram ou não no relato.
- source_word: γενόμεναι
  choice: tendo ido
  rationale: Neste contexto, o particípio com ὀρθριναὶ e a expressão direcional indica que elas foram ao túmulo; a formulação mantém a relação participial com a oração principal.
- source_word: ὀρθριναὶ
  choice: bem cedo
  rationale: Expressão corrente que transmite a ideia de uma hora muito matutina sem fixar mais precisamente o momento.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ao túmulo
  rationale: A preposição com acusativo favorece movimento em direção ao local; “túmulo” é natural no contexto do sepultamento de Jesus.
theological_decisions:
- issue: Sentido de ἐξέστησαν no relato ligado à ressurreição
  choice: nos deixaram atônitos
  alternative: nos deixaram perplexos; nos espantaram
  rationale: A escolha preserva a forte reação dos discípulos sem apresentar essa reação como fé nem como rejeição do testemunho das mulheres.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final preserva a continuidade sintática e narrativa com o versículo seguinte.
