source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: pt
  text: 'E disseram um ao outro: “Não ardia o nosso coração[a] dentro de nós enquanto ele nos falava pelo caminho[b], enquanto nos abria as Escrituras[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os nossos corações”; o grego emprega o singular, literalmente “o nosso coração”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela estrada”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, tornava claro para eles o sentido das Escrituras. O texto grego usa literalmente a imagem de “abrir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: um ao outro
  rationale: Expressão recíproca natural em português, adequada aos dois discípulos e fiel ao diálogo mútuo.
- source_word: Οὐχὶ
  choice: Não ardia...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção negativa preserva essa força.
- source_word: ἡ καρδία ἡμῶν
  choice: o nosso coração
  rationale: Mantém o singular do grego e pode expressar a reação interior compartilhada dos discípulos, sem impedir a leitura distributiva.
- source_word: καιομένη ἦν
  choice: ardia
  rationale: O imperfeito português comunica a ação contínua, e 'ardia' conserva a metáfora sem defini-la como emoção, iluminação ou experiência espiritual específica.
- source_word: ἐν ἡμῖν
  choice: dentro de nós
  rationale: Tradução idiomática que preserva a localização interior da experiência.
- source_word: ἐλάλει ἡμῖν
  choice: nos falava
  rationale: O imperfeito conserva o aspecto durativo da fala durante o percurso.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Expressão corrente em português para uma conversa ocorrida durante o trajeto; preserva tanto o sentido concreto de caminho quanto a fluidez narrativa.
- source_word: ὡς ... ὡς
  choice: enquanto ... enquanto
  rationale: A repetição preserva o paralelismo do texto grego e apresenta as duas ações contínuas associadas ao coração ardente.
- source_word: διήνοιγεν
  choice: abria
  rationale: Conserva a metáfora de 'abrir' e o aspecto contínuo do imperfeito, sem substituir a imagem por uma explicação interpretativa.
- source_word: τὰς γραφάς
  choice: as Escrituras
  rationale: Designação portuguesa estabelecida para os escritos sagrados em vista neste contexto.
theological_decisions:
- issue: Força metafórica do coração ardente
  choice: Não ardia o nosso coração dentro de nós
  alternative: Não ficávamos profundamente comovidos / não sentíamos um fogo dentro de nós
  rationale: O texto não determina se a experiência foi principalmente emocional, cognitiva ou espiritual. Manter a metáfora preserva essa abertura e a tensão teológica.
- issue: Sentido de abrir as Escrituras
  choice: abria as Escrituras
  alternative: explicava as Escrituras
  rationale: A tradução principal conserva a imagem usada pelo texto; a nota esclarece seu sentido contextual sem eliminar a metáfora.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe mantém a pergunta retórica, os imperfeitos e a metáfora central do original; a repetição de “enquanto” reflete o paralelismo grego sem recorrer a linguagem denominacional.
