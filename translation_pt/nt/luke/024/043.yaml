  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: pt
  text: E, pegando-o[a], comeu diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz simplesmente “pegando” e “comeu”; o objeto, entendido pelo versículo anterior, é o pedaço de peixe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que mantém a ligação narrativa com o versículo anterior sem acrescentar uma força temporal ausente do grego.
- source_word: λαβὼν
  choice: pegando-o
  rationale: O particípio aoristo de λαμβάνω apresenta uma ação anterior à do verbo principal. O pronome retoma naturalmente o pedaço de peixe mencionado no versículo anterior.
- source_word: ἐνώπιον αὐτῶν
  choice: diante deles
  rationale: Expressão corrente e digna que indica que a ação ocorreu na presença e à vista deles.
- source_word: ἔφαγεν
  choice: comeu
  rationale: O aoristo de ἐσθίω narra de modo direto a ação concluída; em português, o objeto já retomado em “pegando-o” pode permanecer implícito sem perda de clareza.
theological_decisions:
- issue: Explicitação do objeto omitido no grego
  choice: 'Explicitar o objeto apenas no particípio: “pegando-o, comeu”'
  alternative: “Pegando, comeu diante deles” ou “pegou-o e o comeu diante deles”
  rationale: O grego deixa o objeto implícito, recuperável do versículo anterior. Em português, “pegando-o” identifica claramente o pedaço de peixe, enquanto a omissão depois de “comeu” evita repetição pesada e preserva a concisão do original. A formulação mantém a ação concreta diante dos discípulos sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Diante deles” conserva tanto a proximidade narrativa quanto o sentido de ação realizada à vista dos presentes.
