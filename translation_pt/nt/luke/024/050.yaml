  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: pt
  text: Então ele os levou para fora, até Betânia[a]. E, levantando as mãos, os abençoou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até perto de Betânia” ou “em direção a Betânia”; a expressão grega é um pouco mais extensa, literalmente “até em direção a Betânia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: levou para fora
  rationale: O aoristo de ἐξάγω indica conduzir ou levar para fora. “Levou para fora” é natural em português e conserva a força direcional do prefixo ἐξ-.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá prosseguimento à narrativa, sem marcar contraste forte; “Então” expressa bem essa transição.
- source_word: ἕως πρὸς Βηθανίαν
  choice: até as proximidades de Betânia
  rationale: A combinação ἕως πρός indica movimento até a direção ou vizinhança de Betânia. A formulação conserva essa nuance espacial sem a rigidez de uma tradução estritamente literal.
- source_word: Βηθανίαν
  choice: Betânia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἐπάρας
  choice: levantando
  rationale: O particípio aoristo apresenta o gesto associado e logicamente anterior à bênção; o gerúndio produz uma construção natural em português.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: as mãos
  rationale: O artigo com o pronome possessivo grego é expresso idiomaticamente em português pelo artigo definido, pois o possuidor já está claro pelo sujeito. Mantém-se o plural significativo.
- source_word: εὐλόγησεν
  choice: abençoou
  rationale: εὐλογέω descreve aqui o ato de conferir ou pronunciar bênção sobre os discípulos; “abençoou” é direto, tradicional e suficientemente claro.
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto que retoma os discípulos de modo natural em português.
theological_decisions:
- issue: Natureza do ato de Jesus ao abençoar os discípulos
  choice: os abençoou
  alternative: pronunciou uma bênção sobre eles
  rationale: A expressão simples preserva o ato de bênção realizado por Jesus, sem transformá-lo numa fórmula litúrgica específica nem reduzi-lo a mero desejo de bem-estar.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A pontuação em duas frases favorece a clareza sem alterar a sequência narrativa. O marcador [a] aparece imediatamente após o topônimo ao qual se refere.
