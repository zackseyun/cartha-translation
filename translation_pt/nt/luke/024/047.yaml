  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: pt
  text: e que, em seu nome, fosse proclamado o arrependimento para o perdão dos pecados[a] a todas as nações[b], a partir de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o arrependimento e o perdão dos pecados”; o grego pode ser entendido como apresentando dois elementos coordenados da mensagem proclamada.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a todos os gentios”. O termo grego também pode significar “gentios” em alguns contextos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: fosse proclamado
  rationale: O infinitivo aoristo passivo depende do contexto anterior de cumprimento das Escrituras. “Fosse proclamado” expressa anúncio público sem limitar a ação à pregação formal.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: em seu nome
  rationale: A expressão indica que a proclamação ocorre com base na pessoa e na autoridade de Jesus; “em seu nome” é a formulação portuguesa natural e preserva essa força.
- source_word: μετάνοιαν
  choice: o arrependimento
  rationale: “Arrependimento” é o equivalente português corrente para a mudança interior e o voltar-se implicados por μετάνοια, sendo mais preciso neste contexto do que a mera expressão “mudança de mente”.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: para o perdão dos pecados
  rationale: ἄφεσις designa libertação, remissão ou perdão; no contexto de pecados, “perdão” é claro e preciso. A tradução principal relaciona estreitamente arrependimento e perdão, enquanto a nota preserva a possível coordenação dos dois substantivos.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: a todas as nações
  rationale: A expressão comunica o alcance mundial da proclamação e conserva o sentido lexical de ἔθνη, sem excluir a possibilidade contextual de referência aos gentios, registrada em nota.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: começando por Jerusalém
  rationale: A expressão indica Jerusalém como ponto inicial da missão. “Começando por” é idiomático em português e preserva a nuance de procedência de ἀπό.
theological_decisions:
- issue: Relação entre arrependimento e perdão na proclamação
  choice: “o arrependimento para o perdão dos pecados”
  alternative: “o arrependimento e o perdão dos pecados” como dois elementos coordenados da mensagem
  rationale: A construção grega permite entender os dois substantivos como elementos proclamados, mas também os relaciona de modo estreito. O texto principal mantém essa relação sem formular uma ordem da salvação mais detalhada do que o versículo, e a nota conserva a ambiguidade sintática.
- issue: Sentido de ἔθνη
  choice: “todas as nações”
  alternative: “todos os gentios”
  rationale: O contexto da comissão após a ressurreição favorece o alcance universal. “Nações” preserva a forma lexical e não restringe o referente somente aos não judeus, embora essa alternativa permaneça possível e seja indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem dos termos foi ajustada à sintaxe portuguesa, sem eliminar as ambiguidades relevantes do grego.
