id: LUK.24.26
reference: Luke 24:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: pt
  text: Não era necessário que o Messias sofresse essas coisas e entrasse em sua glória?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. O título grego Χριστός é traduzido aqui por “Messias” para preservar seu sentido no contexto de cumprimento das Escrituras.
    reason: Leitura alternativa do título Χριστός.
lexical_decisions:
- source_word: οὐχὶ
  choice: Não era
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção é natural em português e preserva essa força.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma os sofrimentos mencionados no contexto; “essas coisas” mantém sua referência sem explicitação indevida.
- source_word: ἔδει
  choice: era necessário
  rationale: O imperfeito de δεῖ expressa necessidade no plano divino e no cumprimento das Escrituras, sem reduzi-la a mera obrigação ou inevitabilidade.
- source_word: παθεῖν
  choice: sofresse
  rationale: O infinitivo aoristo de πάσχω é vertido de modo direto e idiomático, subordinado à construção portuguesa “era necessário que”.
- source_word: τὸν χριστὸν
  choice: o Messias
  rationale: Χριστός funciona aqui como título, no contexto de cumprimento das Escrituras; “Messias” comunica seu sentido ao leitor moderno.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples entre sofrer e entrar, sem acrescentar uma sequência temporal mais explícita que a do grego.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: entrasse em sua glória
  rationale: Conserva a ideia de entrada na esfera ou condição de glória e mantém diretamente o pronome possessivo.
- source_word: δόξαν
  choice: glória
  rationale: É a tradução tradicional, clara e contextualmente adequada para δόξα no âmbito da ressurreição e exaltação.
- source_word: αὐτοῦ
  choice: sua
  rationale: Reproduz de forma concisa o genitivo possessivo, sem determinar além do texto se a glória é inerente, recebida ou destinada a ele.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo é um título e, neste contexto de cumprimento das Escrituras, “Messias” torna seu valor semântico mais transparente. A alternativa tradicional é registrada em nota.
- issue: Força de ἔδει
  choice: necessidade expressa por “era necessário”
  alternative: “tinha de” ou simples inevitabilidade
  rationale: A formulação preserva a necessidade ligada ao plano divino e às Escrituras sem inserir essa explicação diretamente no versículo.
- issue: Relação entre sofrimento e glória
  choice: coordenação simples com “e”
  alternative: “e então”
  rationale: O texto apresenta ambos como necessários, mas não explicita com καί uma inferência ou sequência por meio de um advérbio; por isso, evita-se acrescentar “então”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta retórica foi mantida, assim como a concisão do original. “Entrasse em sua glória” evita uma formulação mais pesada sem apagar a preposição nem o possessivo.
