id: LUK.24.46
reference: Luke 24:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: pt
  text: 'E ele lhes disse: “Assim está escrito: o Messias[a] sofreria e ressuscitaria dentre os mortos no terceiro dia,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: O perfeito passivo funciona como fórmula de citação das Escrituras e indica algo que permanece escrito; “está escrito” é a expressão portuguesa natural e tradicional.
- source_word: παθεῖν
  choice: sofreria
  rationale: O infinitivo apresenta o conteúdo do que está escrito. O futuro do pretérito é natural neste discurso e evita acrescentar a ideia explícita de obrigação que “teria de sofrer” poderia introduzir.
- source_word: τὸν χριστόν
  choice: o Messias
  rationale: Com o artigo, Χριστός funciona aqui claramente como título. “O Messias” preserva o contexto judaico e escriturístico do Ungido esperado.
- source_word: ἀναστῆναι
  choice: ressuscitaria
  rationale: O infinitivo ativo tem sentido intransitivo neste contexto. “Ressuscitaria” comunica a volta à vida sem transformar a forma grega em passiva.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: A expressão preserva a força de ἐκ, indicando que ele se levantaria do meio dos mortos, e é idiomática no registro bíblico português.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: O dativo é temporal; esta é a formulação portuguesa natural.
- source_word: οὕτως
  choice: Assim
  rationale: Mantém o tom declarativo e escriturístico e introduz o conteúdo que segue.
- source_word: ὅτι
  choice: ':'
  rationale: Em português, os dois-pontos introduzem naturalmente a explicação do que está escrito, sem exigir a repetição de “que”.
theological_decisions:
- issue: Tradução de Χριστός no resumo da paixão e ressurreição
  choice: o Messias
  alternative: o Cristo
  rationale: O artigo mostra que o termo funciona como título. “Messias” preserva a relação com a expectativa bíblica do Ungido, sem tratar “Cristo” como se fosse nome próprio.
- issue: Voz do verbo de ressurreição ἀναστῆναι
  choice: ressuscitaria dentre os mortos
  alternative: seria ressuscitado dentre os mortos
  rationale: A forma grega é ativa e, aqui, intransitiva. A tradução preserva essa voz sem negar que outras passagens atribuam a ressurreição à ação de Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Está escrito” conserva a fórmula escriturística; “sofreria” e “ressuscitaria” tornam natural em português o conteúdo expresso pelos infinitivos gregos, sem acrescentar necessidade modal nem alterar a voz verbal.
