  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: pt
  text: Vocês são testemunhas destas coisas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, simplesmente, “Vocês são testemunhas disso”. O demonstrativo grego se refere aos acontecimentos dos quais Jesus acabou de falar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês
  rationale: O pronome de segunda pessoa do plural aparece explicitamente no grego e dá ênfase aos discípulos como sujeitos. “Vocês” é natural e amplamente compreensível no português moderno.
- source_word: ἐστε
  choice: são
  rationale: Presente do indicativo do verbo “ser”, traduzido de forma direta.
- source_word: μάρτυρες
  choice: testemunhas
  rationale: Designa pessoas que dão testemunho do que viram e ouviram. “Testemunhas” preserva o sentido comum no contexto de Lucas sem introduzir a conotação posterior e técnica de martírio.
- source_word: τούτων
  choice: destas coisas
  rationale: O demonstrativo no genitivo plural retoma os acontecimentos que Jesus acabou de mencionar. “Destas coisas” torna essa referência clara e mantém a relação expressa pelo genitivo.
theological_decisions:
- issue: Sentido do papel dos discípulos como μάρτυρες
  choice: O versículo identifica os discípulos como testemunhas que darão testemunho dos acontecimentos mencionados.
  alternative: Entender o termo como uma referência também ao martírio posterior.
  rationale: No contexto imediato, Jesus fala de seu sofrimento, ressurreição e da proclamação do arrependimento para perdão dos pecados. A tradução mantém o sentido testemunhal sem importar para o texto a conotação posterior de morte pela fé.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. O pronome “vocês” preserva a segunda pessoa do plural e sua presença explícita no original; a formulação evita tanto arcaísmo quanto explicitação interpretativa excessiva.
