lexical_decisions:
- source_word: οἱ δὲ
  choice: Então eles
  rationale: οἱ é substantivado e retoma os discípulos reunidos; δέ funciona como conectivo leve. “Então eles” expressa com naturalidade a sequência narrativa sem introduzir contraste forte.
- source_word: ἐπέδωκαν
  choice: deram
  rationale: O aoristo ativo de ἐπιδίδωμι significa aqui dar ou entregar. “Deram” é direto, natural e adequado ao contexto.
- source_word: αὐτῷ
  choice: lhe
  rationale: O dativo marca o objeto indireto e é expresso naturalmente em português pelo pronome “lhe”.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: um pedaço de peixe assado
  rationale: 'μέρος é o núcleo (“pedaço” ou “porção”), enquanto ἰχθύος ὀπτοῦ indica de que consistia: peixe preparado pelo calor, provavelmente assado. A formulação é clara e idiomática em português.'
- source_word: ὀπτοῦ
  choice: assado
  rationale: ὀπτός designa alimento preparado ao fogo, assado ou grelhado. “Assado” é uma equivalência ampla, corrente e natural em português, sem sugerir um método culinário moderno excessivamente específico.
theological_decisions:
- issue: Forma textual de Lucas 24:42
  choice: 'Traduzir somente o texto do SBLGNT: “um pedaço de peixe assado”.'
  alternative: Alguns manuscritos posteriores acrescentam “e de um favo de mel”.
  rationale: O texto crítico fornecido termina em μέρος e não contém a leitura mais longa. A tradução segue a evidência textual de base, registrando a variante posterior em nota para transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a progressão narrativa; “peixe assado” evita o regionalismo e a especificidade técnica de alternativas como “peixe grelhado” ou “peixe tostado”.
