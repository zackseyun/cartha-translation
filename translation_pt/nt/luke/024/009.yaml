source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: pt
  text: Elas voltaram do túmulo e relataram todas essas coisas aos onze e a todos os demais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: voltaram
  rationale: O particípio aoristo ativo feminino plural se refere às mulheres. A construção coordenada «voltaram... e relataram» expressa de modo natural em português a ação anterior ligada ao verbo principal.
- source_word: μνημείου
  choice: túmulo
  rationale: No contexto do sepultamento e da ressurreição de Jesus, «túmulo» é o termo corrente e preciso para μνημεῖον.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: O verbo denota transmitir ou comunicar uma informação. «Relataram» preserva esse sentido e combina com o tom narrativo sem sugerir um anúncio público formal.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: A expressão conserva tanto o demonstrativo ταῦτα quanto a abrangência de πάντα, em formulação natural e clara.
- source_word: τοῖς ἕνδεκα
  choice: aos onze
  rationale: Mantém a designação convencional presente no grego sem acrescentar «apóstolos», substantivo que não aparece no texto.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: a todos os demais
  rationale: Expressa o grupo restante em distinção dos onze e preserva a força inclusiva de πᾶσιν.
theological_decisions:
- issue: Referente do particípio feminino plural e do verbo no plural
  choice: Explicitar o sujeito como «Elas», referindo-se às mulheres mencionadas no contexto anterior.
  alternative: Omitir o pronome e deixar o sujeito apenas implícito pela flexão verbal.
  rationale: O grego identifica gramaticalmente um sujeito feminino plural. Como os verbos portugueses no plural não marcam gênero, «Elas» preserva essa informação sem acrescentar uma identificação além do contexto.
- issue: Designação do grupo apostólico
  choice: Traduzir τοῖς ἕνδεκα como «aos onze», sem expansão.
  alternative: «aos onze apóstolos»
  rationale: O texto usa somente a designação «os onze»; acrescentar «apóstolos» esclareceria o referente, mas iria além da formulação grega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação verbal evita uma construção participial pesada, enquanto o pronome «Elas» conserva a referência feminina expressa na morfologia grega.
