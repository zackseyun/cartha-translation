id: LUK.24.5
reference: Luke 24:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: pt
  text: 'Quando elas ficaram apavoradas e inclinaram o rosto para o chão, eles lhes disseram: “Por que vocês procuram entre os mortos aquele que vive?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que vocês procuram, aquele que vive, com os mortos?” No contexto, o sentido é: “Por que vocês procuram entre os mortos aquele que vive?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: quando elas ficaram apavoradas
  rationale: A construção genitiva absoluta apresenta uma circunstância anterior à fala; «ficaram apavoradas» expressa tanto o sentido ingressivo de γενομένων quanto a intensidade de ἔμφοβων.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: inclinaram o rosto para o chão
  rationale: Preserva a imagem física concreta de baixar ou inclinar o rosto, com formulação natural em português; o singular coletivo «o rosto» evita a expressão menos idiomática «os rostos».
- source_word: εἶπαν πρὸς αὐτάς
  choice: eles lhes disseram
  rationale: 'Mantém os referentes pronominais do grego: os homens mencionados no contexto falam às mulheres, sem repetir substantivos ausentes nesta oração.'
- source_word: Τί ζητεῖτε
  choice: Por que vocês procuram
  rationale: Embora τί seja literalmente «que/o que», aqui introduz uma pergunta que contesta a adequação da busca; «por que» comunica naturalmente essa força contextual. O presente é preservado por «procuram».
- source_word: τὸν ζῶντα
  choice: aquele que vive
  rationale: O particípio substantivado é singular e pessoal. «Aquele que vive» conserva esse caráter e soa mais natural em português do que «o vivente» ou «o que está vivo».
- source_word: μετὰ τῶν νεκρῶν
  choice: entre os mortos
  rationale: μετά com genitivo pode significar «com»; neste contexto, «entre os mortos» expressa de modo idiomático o lugar ou a categoria em que elas procuram.
theological_decisions:
- issue: Implicação da ressurreição em τὸν ζῶντα
  choice: aquele que vive
  alternative: o vivente; aquele que está vivo
  rationale: A expressão identifica Jesus como vivo em contraste com os mortos e sustenta a implicação da ressurreição sem acrescentar uma explicação que o texto grego não explicita.
- issue: Força interrogativa de Τί
  choice: Por que vocês procuram
  alternative: O que vocês procuram
  rationale: A leitura «por que» comunica a censura implícita e o sentido contextual, mas a nota preserva a forma mais literal e a ambiguidade lexical do grego.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega «vocês» para o plural e evita construções excessivamente literais que obscureceriam o sentido, preservando em nota a alternativa formal de Τί e μετά.
