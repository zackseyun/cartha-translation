id: LUK.24.6
reference: Luke 24:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: pt
  text: 'Ele não está aqui, mas foi ressuscitado.[a][b] Lembrem-se do que ele lhes disse quando ainda estava na Galileia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ressuscitou”. O verbo grego está na voz passiva (“foi ressuscitado”), embora também possa ser traduzido de modo intransitivo para expressar o acontecimento da ressurreição.'
    reason: alternative_reading
  - marker: b
    text: 'Alguns manuscritos omitem: “Ele não está aqui, mas foi ressuscitado”.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ele não está aqui
  rationale: 'O grego não expressa o sujeito, mas o contexto aponta claramente para Jesus; o pronome torna a frase natural e clara em português. ὧδε tem sentido locativo: “aqui”.'
- source_word: ἀλλὰ
  choice: mas
  rationale: A conjunção introduz o contraste direto entre a ausência de Jesus no túmulo e sua ressurreição.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: Preserva a voz passiva do aoristo de ἐγείρω e sua possível sugestão da ação divina, sem tornar explícito um agente que o texto não nomeia.
- source_word: μνήσθητε
  choice: Lembrem-se
  rationale: O imperativo plural dirige uma exortação direta às mulheres. “Lembrem-se” é corrente, claro e adequado ao registro.
- source_word: ὡς
  choice: de como
  rationale: Neste contexto, introduz a maneira ou o conteúdo geral daquilo que Jesus lhes havia dito; a construção “lembrar-se de como” é natural em português.
- source_word: ἐλάλησεν ὑμῖν
  choice: ele falou a vocês
  rationale: Mantém o sentido geral de λαλέω sem especificar além do texto. “A vocês” oferece ampla legibilidade brasileira e continua compreensível internacionalmente.
- source_word: ἔτι ὢν
  choice: quando ainda estava
  rationale: Transforma naturalmente o particípio em oração temporal e conserva o valor de ἔτι, “ainda”.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galileia
  rationale: Representa diretamente a expressão locativa e usa a forma portuguesa corrente do topônimo.
theological_decisions:
- issue: Forma do verbo da ressurreição (ἠγέρθη)
  choice: foi ressuscitado
  alternative: ressuscitou
  rationale: A forma passiva conserva a voz do grego e deixa perceptível a possível agência divina, sem negar a formulação igualmente legítima do acontecimento como “ressuscitou”. A alternativa é registrada em nota para preservar a amplitude idiomática e teológica.
- issue: Variante textual na primeira declaração
  choice: Incluir “Ele não está aqui, mas foi ressuscitado” no texto principal
  alternative: Omitir a declaração
  rationale: A edição-fonte SBLGNT inclui a frase, mas a sinaliza como unidade com variação textual. Ela é traduzida no texto principal, e a omissão presente em parte da tradição manuscrita é informada em nota, sem ocultar a incerteza textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O plural “vocês” evita regionalismo excessivo; “Galileia” segue a grafia portuguesa corrente. Os dois-pontos finais sinalizam que a fala recordada continua no versículo seguinte.
