id: LUK.24.16
reference: Luke 24:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: pt
  text: Mas os olhos deles estavam impedidos de reconhecê-lo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estavam retidos, para que não o reconhecessem” ou “não podiam reconhecê-lo”. O grego não declara quem ou o que os impedia.
    reason: Alternativas lexicais e preservação do agente não expresso na construção passiva.
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Conjunção conectiva leve que aqui ressalta o contraste entre a presença de Jesus e a incapacidade dos discípulos de reconhecê-lo.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: os olhos deles
  rationale: Preserva a imagem corporal concreta do grego e expressa naturalmente o genitivo possessivo.
- source_word: ἐκρατοῦντο
  choice: eram impedidos
  rationale: Mantém a forma passiva e comunica que o reconhecimento estava sendo obstado, sem identificar o agente, que permanece implícito no grego.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: de reconhecê-lo
  rationale: O infinitivo articular com μή indica aqui impedimento quanto ao resultado; ἐπιγινώσκω significa reconhecer ou identificar no contexto de Emaús.
- source_word: αὐτόν
  choice: -lo
  rationale: Pronome objeto que se refere a Jesus; a forma enclítica é natural após o infinitivo em português.
theological_decisions:
- issue: Se deve ser identificado quem impediu o reconhecimento
  choice: 'Manter a passiva sem agente: “os olhos deles eram impedidos de reconhecê-lo”.'
  alternative: Explicitar agência divina (“Deus impedia que o reconhecessem”) ou tornar a frase meramente impessoal (“eles não conseguiam reconhecê-lo”).
  rationale: O grego não nomeia o agente. A passiva preserva essa ambiguidade e evita atribuir explicitamente a Deus, às circunstâncias ou a outra causa aquilo que o texto não resolve.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a imagem concreta dos olhos e a passiva sem agente do original.
