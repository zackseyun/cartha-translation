  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: pt
  text: Então ele abriu a mente deles para compreenderem as Escrituras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Então ele abriu o entendimento deles, de modo que compreendessem as Escrituras».'
