lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural e conciso a sequência temporal da narrativa.
- source_word: διήνοιξεν
  choice: abriu
  rationale: Preserva a metáfora concreta de διανοίγω sem reduzi-la à paráfrase interpretativa «capacitou».
- source_word: αὐτῶν τὸν νοῦν
  choice: a mente deles
  rationale: Mantém o substantivo singular do grego e expressa naturalmente em português a faculdade de compreensão compartilhada pelos discípulos; «o entendimento deles» também é possível.
- source_word: τοῦ συνιέναι
  choice: para compreenderem
  rationale: O infinitivo articular pode indicar propósito ou resultado. A construção portuguesa é natural e conserva essa relação sem a explicitar em excesso.
- source_word: τὰς γραφάς
  choice: as Escrituras
  rationale: Neste contexto de Lucas, refere-se aos escritos sagrados de Israel; a forma consagrada «as Escrituras» comunica esse referente.
theological_decisions:
- issue: Natureza da ação de Jesus ao abrir a compreensão
  choice: «abriu a mente deles»
  alternative: «capacitou-os a compreender» ou «explicou-lhes as Escrituras»
  rationale: A redação direta preserva a afirmação do texto de que Jesus abriu a mente deles, sem convertê-la em uma explicação doutrinária posterior nem reduzi-la ao simples ato de explicar.
- issue: Relação expressa por τοῦ συνιέναι
  choice: «para compreenderem»
  alternative: «de modo que compreendessem»
  rationale: A construção grega admite nuance de propósito ou resultado; o texto principal usa uma formulação concisa, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a metáfora de «abrir» e evita linguagem confessional especializada.
