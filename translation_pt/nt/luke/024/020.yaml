id: LUK.24.20
reference: Luke 24:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: pt
  text: e como os nossos principais sacerdotes e governantes o entregaram para ser condenado à morte e o crucificaram.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o entregaram para uma sentença de morte” ou “o entregaram para ser sentenciado à morte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mandaram crucificá-lo”, explicitando que os líderes foram responsáveis pela execução, embora as autoridades romanas a tenham realizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: e como
  rationale: ὅπως introduz o conteúdo narrado, enquanto τε dá continuidade ao relato; “e como” preserva naturalmente essa ligação.
- source_word: παρέδωκαν
  choice: entregaram
  rationale: παραδίδωμι aqui descreve a entrega de Jesus às autoridades para o processo que levou à execução; “entregaram” mantém o sentido jurídico sem restringi-lo a “traíram”.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: No contexto judaico do Segundo Templo, o plural designa a liderança sacerdotal superior, não necessariamente vários sumos sacerdotes simultâneos.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: os nossos governantes
  rationale: ἄρχοντες designa autoridades dirigentes; “governantes” preserva o caráter político e judicial, e “nossos” mantém a identificação dos falantes com seu povo.
- source_word: εἰς κρίμα θανάτου
  choice: para ser condenado à morte
  rationale: κρίμα pode indicar julgamento, veredito ou condenação. A formulação portuguesa é natural, mantém o sentido judicial e evita a expressão menos idiomática “a uma sentença de morte” após “entregaram”.
- source_word: ἐσταύρωσαν
  choice: o crucificaram
  rationale: O verbo ativo atribui diretamente a ação e a responsabilidade aos principais sacerdotes e governantes, sem acrescentar no texto principal uma explicação sobre a execução material pelos romanos.
theological_decisions:
- issue: Agência na execução de Jesus
  choice: o crucificaram
  alternative: mandaram crucificá-lo
  rationale: O grego usa um verbo ativo plural cujo sujeito são os principais sacerdotes e governantes. A tradução direta preserva a atribuição retórica e moral de responsabilidade; a alternativa explicita a mediação das autoridades romanas, mas acrescenta uma nuance não expressa formalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Principais sacerdotes” evita a possível impressão de vários sumos sacerdotes em exercício. A ordem “o crucificaram” é corrente e mantém Jesus como objeto explícito dos dois verbos.
