source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: pt
  text: Eles se aproximaram da aldeia para onde iam, e ele fez como se fosse seguir adiante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fingiu que ia mais adiante”; ou: “deu a entender que seguiria adiante”.'
    reason: Alternativas lexicais para προσεποιήσατο, que pode descrever o ato de aparentar ou fingir uma ação.
lexical_decisions:
- source_word: ἤγγισαν
  choice: se aproximaram
  rationale: O aoristo de ἐγγίζω indica que chegaram perto do povoado; “se aproximaram” é natural e conserva a ideia de movimento.
- source_word: κώμην
  choice: aldeia
  rationale: κώμη designa normalmente um povoado menor que uma cidade; “aldeia” preserva essa distinção.
- source_word: οὗ ἐπορεύοντο
  choice: para onde iam
  rationale: O advérbio relativo com o imperfeito de πορεύομαι expressa o destino da viagem em andamento.
- source_word: προσεποιήσατο
  choice: fez como se
  rationale: A expressão comunica que ele deu a impressão de continuar a viagem, sem impor a conotação mais forte de engano que “fingiu” pode sugerir.
- source_word: πορρώτερον
  choice: adiante
  rationale: No contexto de deslocamento, o comparativo indica que ele aparentava prosseguir para um ponto mais distante; “adiante” é idiomático em português.
- source_word: πορεύεσθαι
  choice: fosse seguir
  rationale: O infinitivo completa προσεποιήσατο e descreve a ação aparente de continuar o caminho.
theological_decisions:
- issue: A descrição da ação de Jesus em προσεποιήσατο
  choice: fez como se fosse seguir adiante
  alternative: fingiu que ia mais adiante; deu a entender que seguiria adiante
  rationale: A formulação mantém a tensão narrativa de Jesus aparentar que continuaria a viagem, sem resolver a questão por meio de uma afirmação mais forte sobre intenção de enganar.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Aldeia” conserva a escala do assentamento, e “seguir adiante” comunica de modo idiomático a continuação física da viagem.
