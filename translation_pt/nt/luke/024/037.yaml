id: LUK.24.37
reference: Luke 24:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: pt
  text: Mas eles, assustados e tomados de medo, pensavam estar vendo um espírito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um fantasma”. A palavra grega é πνεῦμα, mais literalmente “espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: assustados
  rationale: Expressa a perturbação súbita indicada pelo particípio aoristo, sem intensificar além da menção explícita do medo.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição contrastiva entre a aparição de Jesus e a reação dos discípulos.
- source_word: ἔμφοβοι γενόμενοι
  choice: tomados de medo
  rationale: Comunica de modo natural a entrada em um estado de medo, preservando o valor ingressivo de γενόμενοι.
- source_word: ἐδόκουν
  choice: pensavam
  rationale: O imperfeito retrata a impressão que eles mantinham naquele momento; o imperfeito português preserva esse aspecto.
- source_word: πνεῦμα
  choice: um espírito
  rationale: É o equivalente lexical mais direto e mantém a interpretação equivocada dos discípulos sem introduzir conotações folclóricas desnecessárias.
- source_word: θεωρεῖν
  choice: estar vendo
  rationale: A construção com infinitivo preserva o aspecto contínuo do infinitivo presente grego e soa natural em português.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto da aparição após a ressurreição
  choice: um espírito
  alternative: um fantasma
  rationale: '“Espírito” é lexicalmente mais próximo do grego e preserva a tensão narrativa: os discípulos interpretam Jesus como um ser incorpóreo, interpretação corrigida nos versículos seguintes.'
translation_notes:
  register: 'Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada para fluência natural, mantendo a sequência da reação: susto, medo e interpretação equivocada.'
