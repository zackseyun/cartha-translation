id: LUK.24.39
reference: Luke 24:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: pt
  text: 'Vejam minhas mãos e meus pés: sou eu mesmo.[a] Toquem em mim[b] e vejam, pois um espírito[c] não tem carne nem ossos, como vocês estão vendo que eu tenho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois sou eu mesmo”. A expressão grega é enfática e também pode ser traduzida por “sou eu, aquele mesmo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Apalpem-me” ou “Examinem-me pelo toque”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um fantasma”. A palavra grega é “espírito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Vejam / vejam
  rationale: O imperativo plural convoca os discípulos a uma verificação visual imediata. “Vejam” é corrente e preserva a repetição do mesmo verbo grego.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: minhas mãos e meus pés
  rationale: Tradução direta dos termos corporais concretos, que servem para confirmar tanto a identidade de Jesus quanto sua presença física.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ': sou eu mesmo'
  rationale: O pronome explícito ἐγώ e o intensivo αὐτός dão forte ênfase à identidade pessoal. Os dois-pontos apresentam naturalmente, em português, aquilo que os discípulos devem reconhecer, sem apagar totalmente a possibilidade de valor causal de ὅτι, registrada em nota.
- source_word: ψηλαφήσατέ με
  choice: Toquem em mim
  rationale: Expressa de modo natural a ordem de verificar Jesus pelo tato. O sentido mais específico de apalpar ou examinar pelo toque é oferecido em nota.
- source_word: πνεῦμα
  choice: um espírito
  rationale: É o equivalente lexical mais direto e mantém aberta a categoria pretendida pelo grego; “fantasma” seria mais interpretativo e pode sugerir associações culturais alheias ao texto.
- source_word: σάρκα καὶ ὀστέα
  choice: carne nem ossos
  rationale: Na construção negativa portuguesa, “não tem carne nem ossos” é a forma natural de preservar os dois elementos corporais concretos do grego.
- source_word: καθὼς ἐμὲ θεωρεῖτε ἔχοντα
  choice: como vocês estão vendo que eu tenho
  rationale: Reformula o particípio grego como oração finita idiomática. “Estão vendo” comunica a observação presente e direta indicada por θεωρεῖτε.
theological_decisions:
- issue: A realidade corporal de Jesus depois da ressurreição
  choice: Manter explicitamente “toquem”, “carne” e “ossos”
  alternative: Suavizar o contraste por meio de linguagem mais abstrata sobre a presença de Jesus
  rationale: O versículo apela diretamente à visão e ao tato e contrasta um espírito com o corpo observável de Jesus. A tradução preserva essa afirmação concreta sem acrescentar uma explicação doutrinária.
- issue: O sentido de ὅτι antes de ἐγώ εἰμι αὐτός
  choice: 'Apresentá-lo como o conteúdo a ser reconhecido: “sou eu mesmo”'
  alternative: 'Entendê-lo causalmente: “pois sou eu mesmo”'
  rationale: A construção pode indicar aquilo que os discípulos devem constatar, embora o valor causal seja possível no contexto. A opção principal é natural em português e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para tornar explícito o plural dos imperativos. A pontuação evita uma oração subordinada pouco natural, enquanto a nota conserva a ambiguidade de ὅτι. A linguagem corporal permanece concreta e sem amplificação confessional.
