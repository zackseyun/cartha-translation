id: LUK.24.25
reference: Luke 24:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: pt
  text: 'E ele lhes disse: “Ó insensatos[a] e lentos de coração[b] para crer em tudo o que os profetas disseram!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem entendimento”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “lentos de coração”; isto é, interiormente lentos para confiar e acolher o que Deus havia dito pelos profetas.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: E ele lhes disse
  rationale: Preserva a ligação narrativa de καί e traduz de modo natural a fórmula de fala, sem acrescentar ênfase indevida a αὐτός.
- source_word: Ὦ
  choice: Ó
  rationale: Mantém a força vocativa e o tom solene da repreensão direta.
- source_word: ἀνόητοι
  choice: insensatos
  rationale: Expressa falta de entendimento e discernimento sem restringir a repreensão a uma deficiência meramente intelectual.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: lentos de coração
  rationale: Conserva a imagem antropológica de καρδία como o íntimo da pessoa, em vez de reduzi-la a 'lentos para entender'.
- source_word: τοῦ πιστεύειν
  choice: para crer
  rationale: É a construção portuguesa natural depois de 'lentos' e preserva o sentido de confiança e acolhimento da mensagem.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: em tudo o que
  rationale: Mantém a preposição associada a πιστεύειν e a abrangência de πᾶσιν.
- source_word: ἐλάλησαν
  choice: disseram
  rationale: Verbo corrente e digno para a fala dos profetas; o aoristo é adequadamente expresso pelo pretérito perfeito simples em português.
- source_word: οἱ προφῆται
  choice: os profetas
  rationale: Equivalente tradicional, claro e contextualmente preciso para a testemunha profética.
theological_decisions:
- issue: Natureza da repreensão de Jesus
  choice: A repreensão envolve tanto falta de entendimento como lentidão interior para confiar em toda a mensagem profética.
  alternative: Entender a fala apenas como condenação moral ou apenas como deficiência intelectual.
  rationale: A combinação de ἀνόητοι, καρδίᾳ e πιστεύειν reúne entendimento e confiança. A tradução mantém essa tensão por meio de 'insensatos', 'coração' e 'crer'.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão bíblica “lentos de coração” foi preservada e esclarecida em nota; “Ó” mantém a força da interpelação sem soar coloquial.
