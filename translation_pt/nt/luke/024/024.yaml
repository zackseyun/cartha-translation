source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: pt
  text: Alguns dos que estavam conosco foram ao túmulo e encontraram tudo tal como as mulheres tinham dito, mas não o viram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: foram
  rationale: O aoristo de ἀπέρχομαι narra o deslocamento até o túmulo. “Foram” é natural e não dá ênfase indevida ao ato de partir.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: alguns dos que estavam conosco
  rationale: Preserva a ideia de que apenas parte do grupo ligado aos falantes foi ao túmulo, em linguagem clara e próxima da estrutura grega.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ao túmulo
  rationale: Neste contexto, μνημεῖον designa o lugar onde Jesus havia sido sepultado. “Túmulo” é preciso e corrente.
- source_word: εὗρον οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: encontraram tudo tal como as mulheres tinham dito
  rationale: A formulação expressa a correspondência entre o que encontraram e o relato anterior das mulheres. “Tudo” torna natural em português o uso de “encontraram” sem especificar além do que o contexto permite; o mais-que-perfeito composto esclarece a sequência narrativa. O valor aditivo de καί fica suficientemente comunicado pela comparação, sem um “também” pouco natural.
- source_word: αὐτὸν δὲ οὐκ εἶδον
  choice: mas não o viram
  rationale: Mantém o contraste introduzido por δέ e traduz ὁράω como “ver”, sem substituí-lo por “encontrar”. O pronome “o” conserva a referência implícita a Jesus.
theological_decisions:
- issue: Formulação do relato da ressurreição
  choice: Os visitantes confirmaram o relato das mulheres quanto ao que havia no túmulo, mas não viram o próprio Jesus.
  alternative: Explicitar ou harmonizar quais detalhes do túmulo foram confirmados e quem exatamente o visitou.
  rationale: A tradução mantém a distinção narrativa do grego entre encontrar a situação conforme relatada e não ver Jesus, sem acrescentar detalhes de relatos paralelos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o contraste do grego foram preservados sem rigidez sintática.
