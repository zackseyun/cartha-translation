  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: pt
  text: 'E ele lhes disse: “Que coisas?” Eles lhe responderam: “As coisas a respeito de Jesus, o Nazareno[a], que era[b] um homem, um profeta poderoso em obras e palavras diante de Deus e de todo o povo,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus de Nazaré”. Em grego: “Jesus, o Nazareno”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que veio a ser um homem, um profeta poderoso”. O verbo grego significa literalmente “veio a ser”, mas, neste contexto, também pode ser traduzido idiomaticamente como “era”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Que coisas?
  rationale: Preserva o plural neutro do interrogativo e retoma naturalmente os acontecimentos mencionados.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: As coisas a respeito de Jesus
  rationale: Reflete de perto a construção substantivada com περί sem acrescentar explicitamente a ideia de acontecimentos.
- source_word: Ναζαρηνοῦ
  choice: o Nazareno
  rationale: Reproduz a designação adjetival grega; a alternativa idiomática «de Nazaré» é registrada em nota.
- source_word: ἐγένετο
  choice: se mostrou
  rationale: No contexto, comunica que Jesus surgiu e foi reconhecido publicamente nessa condição, evitando a sugestão enganosa de que ele passou a ser homem ou profeta naquele momento.
- source_word: ἀνὴρ προφήτης
  choice: um homem, um profeta
  rationale: Mantém os dois substantivos gregos em aposição e não omite a referência explícita a Jesus como homem.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: poderoso em obras e palavras
  rationale: Expressão portuguesa natural e digna que conserva o par grego no singular coletivo/plural idiomático.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: diante de Deus e de todo o povo
  rationale: Expressa presença, avaliação e testemunho públicos sem tornar a frase excessivamente explicativa.
theological_decisions:
- issue: A descrição de Jesus por ἀνὴρ προφήτης
  choice: um homem, um profeta
  alternative: um profeta
  rationale: O texto inclui explicitamente ἀνήρ. Preservá-lo representa a descrição feita pelos discípulos sem resolver ou ampliar as suas implicações cristológicas.
- issue: O valor de ἐγένετο
  choice: se mostrou
  alternative: veio a ser / foi
  rationale: «Se mostrou» conserva uma nuance de manifestação ou reconhecimento no cenário público e evita que «veio a ser um homem» sugira uma mudança ontológica não pretendida pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura narrativa e a aposição incomum do grego; a pontuação final indica que a fala continua no versículo seguinte.
