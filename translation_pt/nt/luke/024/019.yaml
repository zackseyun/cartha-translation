- from: 'E ele lhes perguntou: “Que coisas?” Eles lhe responderam: “As coisas a respeito de Jesus, o Nazareno[a], que se mostrou um homem, um profeta poderoso em obras e palavras diante de Deus e de todo o povo,[b]”'
