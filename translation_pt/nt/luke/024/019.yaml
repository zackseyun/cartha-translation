    rationale: «Se mostrou» pode significar que Jesus aparentou ser ou se apresentou como profeta. O grego γίνομαι, embora literalmente possa ser «veio a ser», funciona aqui idiomaticamente na descrição retrospectiva de Jesus e pode ser vertido por «era» sem acrescentar a noção de manifestação.
  - severity: low
