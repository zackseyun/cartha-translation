id: LUK.24.7
reference: Luke 24:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: pt
  text: 'dizendo: “É necessário que o Filho do Homem seja entregue nas mãos de homens pecadores[a], seja crucificado e ressuscite no terceiro dia.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja entregue ao poder de homens pecadores.”'
    reason: Alternativa idiomática para a expressão grega “nas mãos de”, que denota entrega ao poder de outros.
  - marker: b
    text: 'Ou: “ressurja”; o grego usa a voz ativa, não a passiva (em contraste com “seja ressuscitado”).'
    reason: Esclarece a alternativa lexical para ἀναστῆναι e preserva a observação gramatical do trilho de auditoria.
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio presente e sua ligação com a exortação a recordar as palavras de Jesus no versículo anterior.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva a forma consagrada do título e suas ressonâncias bíblicas sem substituí-lo por uma paráfrase interpretativa.
- source_word: ὅτι δεῖ
  choice: É necessário que
  rationale: Conserva o presente do grego e expressa necessidade, não uma simples previsão; os dois-pontos tornam natural em português a introdução das palavras recordadas.
- source_word: παραδοθῆναι εἰς χεῖρας
  choice: seja entregue às mãos de
  rationale: Reproduz tanto o sentido passivo de ser entregue ao poder de outros quanto a imagem idiomática das mãos, de modo natural em português.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: homens pecadores
  rationale: Reflete o substantivo masculino plural e, no contexto, os agentes humanos envolvidos na prisão e execução de Jesus.
- source_word: σταυρωθῆναι
  choice: seja crucificado
  rationale: É a tradução direta, precisa e corrente do infinitivo passivo referente à crucificação.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: Expressa naturalmente em português o dativo temporal grego, sem acréscimos explicativos.
- source_word: ἀναστῆναι
  choice: ressuscite
  rationale: Mantém a voz ativa do infinitivo grego. Em português, “ressuscitar” comunica de modo claro o retorno à vida sem convertê-lo na forma passiva “seja ressuscitado”.
theological_decisions:
- issue: Força de δεῖ na predição da paixão
  choice: É necessário que
  alternative: acontecerá que / teria de
  rationale: Em Lucas, δεῖ frequentemente aponta para a necessidade do cumprimento do propósito de Deus. A tradução conserva essa força sem explicar além do texto.
- issue: Voz de ἀναστῆναι
  choice: ressuscite
  alternative: seja ressuscitado
  rationale: A forma grega é ativa. A opção escolhida preserva esse dado gramatical, sem negar que outras passagens possam falar da ressurreição de Jesus na voz passiva.
- issue: Referência de ἀνθρώπων ἁμαρτωλῶν
  choice: homens pecadores
  alternative: pessoas pecadoras / pecadores
  rationale: A forma masculina plural e o contexto dos agentes da prisão e crucificação favorecem “homens”, enquanto “pecadores” sozinho apagaria o substantivo ἀνθρώπων.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “seja entregue..., seja crucificado e ressuscite” preserva a sequência dos três infinitivos gregos, e a pontuação apresenta de modo natural a fala recordada.
