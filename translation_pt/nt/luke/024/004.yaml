revisions:
- from: E aconteceu que, enquanto elas estavam perplexas com isso, eis que dois homens se puseram ao lado delas, com vestes deslumbrantes.[a]
  to: E aconteceu que, enquanto estavam perplexas a respeito disso, eis que dois homens puseram-se junto delas, com vestes deslumbrantes.[a]
