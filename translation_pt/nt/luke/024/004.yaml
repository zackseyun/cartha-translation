  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: pt
  text: E aconteceu que, enquanto estavam perplexas a respeito disso, eis que dois homens puseram-se junto delas, com vestes deslumbrantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “em veste reluzente como relâmpago”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa de Lucas em português atual, sem recorrer ao arcaizante “sucedeu”.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: enquanto elas estavam perplexas
  rationale: A construção com infinitivo articular tem valor temporal, e ἀπορέω indica perplexidade ou falta de saber como compreender a situação.
- source_word: περὶ τούτου
  choice: com isso
  rationale: Retoma de modo natural, em português, a situação descrita imediatamente antes.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém o marcador enfático que chama a atenção para um desenvolvimento repentino na narrativa.
- source_word: ἄνδρες δύο
  choice: dois homens
  rationale: Reproduz a apresentação imediata das figuras como homens, sem antecipar sua identificação contextual como mensageiros celestiais.
- source_word: ἐπέστησαν αὐταῖς
  choice: se puseram ao lado delas
  rationale: Conserva a ideia espacial de se fazerem presentes junto às mulheres e sugere a entrada repentina das figuras em cena.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: com vestes deslumbrantes
  rationale: Expressa de maneira natural o brilho intenso da roupa; a imagem mais explícita de relâmpago é preservada em nota.
theological_decisions:
- issue: Identidade das duas figuras
  choice: dois homens
  alternative: dois anjos
  rationale: O versículo os apresenta literalmente como “dois homens”. A tradução não antecipa a identificação que emerge do contexto mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Eis que” preserva a vivacidade marcada do original, enquanto “vestes” mantém um tom narrativo elevado sem ser obscuro.
