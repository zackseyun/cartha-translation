id: LUK.24.23
reference: Luke 24:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: pt
  text: e, não encontrando o corpo dele, vieram dizendo que também[b] tinham visto uma visão de anjos, os quais dizem que ele está vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “vieram dizendo que tinham visto uma visão de anjos e que ele está vivo”, entendendo a oração final como referência às mulheres, e não aos anjos.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “dizendo que tinham visto até mesmo uma visão de anjos”.'
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: não encontrando
  rationale: O particípio aoristo ativo feminino plural se refere às mulheres. A forma participial é natural em português e preserva diretamente a negação μή.
- source_word: τὸ σῶμα αὐτοῦ
  choice: o corpo dele
  rationale: Expressão referencial direta; “corpo” é o sentido comum de σῶμα no contexto do sepultamento e da ressurreição.
- source_word: ἦλθον λέγουσαι
  choice: vieram dizendo
  rationale: Mantém o sentido literal de ἦλθον (“vieram”), sem acrescentar “voltaram”, e representa naturalmente o particípio λέγουσαι.
- source_word: καὶ
  choice: também
  rationale: O segundo καί acrescenta ao relato do corpo ausente a notícia da visão. “Também” expressa essa força aditiva com naturalidade; a possível nuance intensificadora é registrada em nota.
- source_word: ὀπτασίαν ἀγγέλων
  choice: uma visão de anjos
  rationale: ὀπτασία designa uma visão ou aparição sobrenatural. A formulação preserva a concisão e o caráter extraordinário do relato sem explicitação indevida.
- source_word: ἑωρακέναι
  choice: tinham visto
  rationale: O infinitivo perfeito em discurso indireto é expresso naturalmente pelo mais-que-perfeito composto, preservando a anterioridade da visão em relação ao relato.
- source_word: οἳ λέγουσιν
  choice: os quais dizem
  rationale: O presente λέγουσιν é mantido, e o masculino plural οἳ retoma mais naturalmente “anjos”. “Os quais” deixa clara essa ligação sintática.
- source_word: αὐτὸν ζῆν
  choice: que ele está vivo
  rationale: A construção infinitiva é vertida como oração finita idiomática. “Está vivo” comunica naturalmente a afirmação no contexto da ressurreição.
theological_decisions:
- issue: Referente da oração relativa οἳ λέγουσιν
  choice: 'O pronome relativo se refere aos anjos: “uma visão de anjos, os quais dizem que ele está vivo”.'
  alternative: 'O pronome relativo poderia ser entendido como referente às mulheres: “vieram dizendo [...] que elas dizem que ele está vivo”.'
  rationale: O antecedente masculino plural mais próximo e sintaticamente mais natural de οἳ é ἀγγέλων. A alternativa menos provável é preservada em nota, sem transformar a decisão sintática em afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as relações sintáticas do grego foram preservadas onde soam naturais; evitou-se acrescentar “voltaram”, embora isso seja sugerido pelo contexto.
