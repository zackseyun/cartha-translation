id: LUK.24.49
reference: Luke 24:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: pt
  text: 'E vejam: eu envio sobre vocês a promessa de meu Pai. Mas permaneçam na cidade até que sejam revestidos de poder do alto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Mantém o chamado enfático à atenção em linguagem atual e natural, sem o tom arcaico de “eis”.
- source_word: ἐξαποστέλλω
  choice: envio
  rationale: O presente grego pode expressar uma ação iminente ou em curso; “envio” preserva essa forma sem explicitação adicional.
- source_word: ἐπαγγελίαν
  choice: promessa
  rationale: Conserva a referência metonímica àquilo que o Pai prometeu, sem identificar no texto principal o dom de maneira mais específica que o grego.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: permaneçam na cidade
  rationale: Embora καθίζω possa significar literalmente “sentar-se”, neste contexto a ordem é ficar ou permanecer na cidade.
- source_word: ἐνδύσησθε
  choice: sejam revestidos
  rationale: Preserva a metáfora passiva de vestir-se ou ser coberto com poder, comum e inteligível no registro bíblico português.
- source_word: ἐξ ὕψους δύναμιν
  choice: poder do alto
  rationale: Reproduz de forma concisa a origem celestial do poder sem substituir a expressão por uma interpretação explícita.
theological_decisions:
- issue: Identidade da “promessa de meu Pai”
  choice: Manter a formulação “a promessa de meu Pai”
  alternative: Explicitar “o Espírito Santo prometido por meu Pai”
  rationale: O contexto aponta para o Espírito Santo, mas o versículo usa uma expressão metonímica. A tradução preserva a redação e a tensão do original.
- issue: Força temporal de ἐξαποστέλλω
  choice: “eu envio”
  alternative: “eu enviarei” ou “estou prestes a enviar”
  rationale: O presente grego é mantido, permitindo que o contexto comunique a iminência sem resolver em excesso sua nuance aspectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E vejam:” transmite a função discursiva de καὶ ἰδού; “permaneçam” evita o literalismo pouco natural de “sentem-se”; “revestidos de poder do alto” conserva a metáfora e a formulação teológica do original.
