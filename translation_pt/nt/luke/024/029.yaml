  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: pt
  text: 'Mas eles insistiram muito com ele[a], dizendo: “Fique conosco, pois está ficando tarde, e o dia já está chegando ao fim[b].” E ele entrou para ficar com eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pressionaram-no” ou, tradicionalmente, “constrangeram-no”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o dia já declinou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: insistiram muito com ele
  rationale: O verbo médio comunica insistência intensa, não coerção física. A expressão é natural em português atual e conserva a força do pedido.
- source_word: Μεῖνον
  choice: Fique
  rationale: Neste contexto de hospitalidade, o imperativo pede que Jesus permaneça com eles; “Fique” é direto e idiomático.
- source_word: μεθ’ ἡμῶν
  choice: conosco
  rationale: A preposição μετά com genitivo indica companhia; “conosco” expressa isso de modo conciso e natural.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: pois já é quase noite
  rationale: A formulação comunica que o entardecer se aproxima, sem afirmar que a noite já chegou plenamente. É mais corrente em português do que uma tradução rígida como “está em direção à tarde”.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: o dia já está chegando ao fim
  rationale: Reproduz em linguagem atual a imagem do dia que declina, preservando o aspecto de um processo já avançado.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Tradução direta e natural do movimento para dentro do local implícito na narrativa.
- source_word: τοῦ μεῖναι
  choice: para ficar
  rationale: O infinitivo articular indica finalidade ou resultado; “para ficar” mantém a ligação lexical com o pedido anterior.
- source_word: σὺν αὐτοῖς
  choice: com eles
  rationale: σύν expressa companhia ou associação; “com eles” é a correspondência natural.
theological_decisions: []
