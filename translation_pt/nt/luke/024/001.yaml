review_pass:
  verdict: revise
  source_fidelity: A estrutura temporal, a chegada ao túmulo, o sujeito feminino contextual e o particípio «levando» refletem adequadamente o grego. Contudo, «aromas» em português normalmente designa cheiros ou fragrâncias, não as substâncias aromáticas preparadas e levadas para o sepultamento; «especiarias» comunica com precisão ἀρώματα neste contexto.
  naturalness: «Bem cedo, ao amanhecer» é natural e transmite apropriadamente a ênfase de ὄρθρου βαθέως. «Elas foram ao túmulo» é idiomático e o conectivo «Mas» é aceitável para δέ no fluxo narrativo.
  terminology: «Túmulo» é apropriado para μνῆμα. «Especiarias» é o termo português estabelecido e claro para ἀρώματα funerários. A nota deve preservar a forma mais literal da expressão grega sem criar uma construção portuguesa incorreta quanto ao gênero.
  issues:
  - severity: medium
    issue: «Aromas» traduz ἀρώματα de modo impreciso no contexto.
    rationale: Em português moderno, «aromas» costuma referir-se a odores, enquanto o grego se refere às substâncias aromáticas/especiarias que as mulheres levaram. «Especiarias» preserva o referente material e o uso funerário.
  - severity: low
    issue: A formulação literal da nota, «no primeiro dos sábados», não espelha bem a forma feminina μιᾷ.
    rationale: «No primeiro [dia] dos sábados» torna explícito o substantivo temporal subentendido e permite registrar de modo compreensível a expressão literal sem alterar o sentido idiomático do texto.
  revised_text: Mas, no primeiro dia da semana[a], bem cedo, ao amanhecer, elas foram ao túmulo, levando as especiarias que haviam preparado.
