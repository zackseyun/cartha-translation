  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: pt
  text: Mas, no primeiro dia da semana[a], bem cedo, ao amanhecer, elas foram ao túmulo, levando as especiarias que haviam preparado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “no primeiro [dia] dos sábados”, expressão idiomática que significa o primeiro dia da semana.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Mas, no primeiro dia da semana
  rationale: A expressão semítica corrente indica o primeiro dia da semana. Esta forma comunica naturalmente o sentido temporal em português sem sugerir uma cronologia especial que o grego não exige.
- source_word: ὄρθρου βαθέως
  choice: bem cedo, ao amanhecer
  rationale: A expressão intensifica a referência à alvorada. A tradução preserva tanto a ideia do amanhecer quanto a de uma hora muito matutina, em linguagem portuguesa natural.
- source_word: ἐπὶ τὸ μνῆμα
  choice: ao túmulo
  rationale: Com verbo de movimento, ἐπί indica deslocamento em direção ao lugar. “Túmulo” é a designação mais adequada no contexto funerário.
- source_word: ἦλθον
  choice: elas foram
  rationale: Embora ἔρχομαι possa ser traduzido por “vir” ou “ir” conforme a perspectiva narrativa, “foram ao túmulo” é mais natural em português neste relato de deslocamento. O feminino é recuperado do contexto imediato anterior (Lc 23.55–56).
- source_word: φέρουσαι
  choice: levando
  rationale: O particípio feminino plural descreve uma ação simultânea à ida ao túmulo. “Levando” expressa isso de modo claro e idiomático.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: os aromas que haviam preparado
  rationale: ἀρώματα designa substâncias aromáticas usadas no preparo funerário. “Aromas” mantém a ligação lexical com substâncias perfumadas, enquanto o mais-que-perfeito composto indica que o preparo ocorreu anteriormente.
theological_decisions:
- issue: Expressão temporal τῇ μιᾷ τῶν σαββάτων no contexto da ressurreição
  choice: no primeiro dia da semana
  alternative: no primeiro dos sábados
  rationale: A tradução adota o sentido idiomático normal da expressão, sem impor uma interpretação calendárica ou denominacional. A forma mais literal é registrada em nota para transparência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bem cedo, ao amanhecer” evita o pouco natural “na profunda alvorada” sem perder a força de ὄρθρου βαθέως. O pronome “elas” torna explícito o sujeito feminino fornecido pelo contexto, embora não esteja expresso lexicalmente neste versículo.
