source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: pt
  text: Mas Pedro se levantou e correu ao túmulo. Inclinando-se para olhar, vê apenas os lençóis de linho. Então se retirou, admirado com o que havia acontecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos antigos não incluem este versículo.
    reason: A passagem inteira apresenta uma variante textual significativa; o versículo está no SBLGNT, mas sua ausência em algumas testemunhas antigas deve ser informada ao leitor.
lexical_decisions:
- source_word: μνημεῖον
  choice: túmulo
  rationale: Termo natural e preciso no contexto de sepultamento, sem limitar indevidamente o tipo de estrutura funerária.
- source_word: παρακύψας
  choice: inclinando-se para olhar
  rationale: Expressa tanto o movimento de curvar-se quanto a finalidade contextual de olhar para dentro do túmulo.
- source_word: βλέπει
  choice: vê
  rationale: Preserva o presente histórico do grego, que torna a narrativa mais vívida.
- source_word: ὀθόνια
  choice: lençóis de linho
  rationale: Designa os panos de linho usados no sepultamento; evita sugerir uma única mortalha.
- source_word: μόνα
  choice: apenas
  rationale: Mantém a ênfase de que somente os panos estavam visíveis.
- source_word: πρὸς αὑτὸν
  choice: consigo mesmo
  rationale: Preserva a expressão reflexiva e sua ambiguidade, sem decidir se Pedro voltou para casa ou apenas se retirou refletindo.
- source_word: θαυμάζων
  choice: admirado
  rationale: Comunica espanto e assombro, sem implicar necessariamente fé ou compreensão plena.
theological_decisions:
- issue: Reação de Pedro diante do túmulo vazio
  choice: admirado consigo mesmo com o que havia acontecido
  alternative: crendo na ressurreição
  rationale: O texto afirma admiração ou assombro, mas não declara explicitamente que Pedro já tivesse chegado à fé ou à compreensão da ressurreição.
- issue: Presente histórico em βλέπει
  choice: vê
  alternative: viu
  rationale: Mantém a mudança temporal deliberada do texto grego e a vivacidade narrativa, sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação divide o longo período grego em frases naturais. Preservam-se o presente histórico e a ambiguidade de πρὸς αὑτὸν.
