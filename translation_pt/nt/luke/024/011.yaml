id: LUK.24.11
reference: Luke 24:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: pt
  text: Essas palavras lhes pareceram um absurdo[a], e eles não acreditavam nas mulheres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma conversa sem sentido» ou «uma fala delirante». O termo grego λῆρος se refere a uma fala considerada insensata ou absurda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: lhes pareceram
  rationale: A construção expressa a avaliação feita por eles; «lhes pareceram» é natural em português e preserva a perspectiva de ἐνώπιον αὐτῶν.
- source_word: ὡσεὶ λῆρος
  choice: um absurdo
  rationale: Comunica de modo claro e atual que consideraram a fala sem sentido ou inacreditável. O valor comparativo de ὡσεὶ está naturalmente incorporado na construção com «pareceram».
- source_word: τὰ ῥήματα ταῦτα
  choice: essas palavras
  rationale: Tradução direta do demonstrativo e do substantivo, sem substituir a expressão por uma interpretação como «relato».
- source_word: ἠπίστουν
  choice: não acreditavam
  rationale: O imperfeito indica incredulidade continuada no passado. A formulação não acrescenta a ideia mais forte de recusa deliberada.
- source_word: αὐταῖς
  choice: nas mulheres
  rationale: O pronome grego é feminino plural e retoma as mulheres do contexto imediato. Explicitar o referente evita que «nelas» seja entendido como referência às palavras.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A explicitação de «nas mulheres» resolve uma ambiguidade pronominal criada pelo gênero feminino de «palavras» em português.
