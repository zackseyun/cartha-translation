id: LUK.24.38
reference: Luke 24:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês estão perturbados, e por que surgem dúvidas em seus corações?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pensamentos” ou “raciocínios”, em vez de “dúvidas”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Τί
  choice: Por que
  rationale: Neste contexto, τί com o predicativo e o verbo εἰμί pergunta pela causa do estado dos discípulos; “Por que” é a forma natural em português.
- source_word: τεταραγμένοι
  choice: perturbados
  rationale: O particípio perfeito passivo de ταράσσω descreve o estado presente de agitação interior; “perturbados” preserva essa força sem exagerá-la.
- source_word: διαλογισμοὶ
  choice: dúvidas
  rationale: Embora o substantivo possa indicar pensamentos ou raciocínios, o contexto imediato enfatiza a incerteza dos discípulos diante da aparição de Jesus.
- source_word: ἀναβαίνουσιν
  choice: surgem
  rationale: O sentido literal é “sobem”, mas, aplicado à atividade interior, “surgem” comunica naturalmente a imagem em português.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: no coração de vocês
  rationale: Mantém o singular distributivo καρδίᾳ com o pronome plural ὑμῶν e soa natural em português de ampla compreensão.
- source_word: καρδία
  choice: coração
  rationale: “Coração” preserva a concepção bíblica do centro interior da pessoa, que inclui pensamento, disposição e emoção; “mente” estreitaria o sentido.
theological_decisions:
- issue: Sentido antropológico de καρδία
  choice: coração
  alternative: mente; íntimo
  rationale: A formulação conserva a textura da antropologia bíblica, na qual o coração também é sede de pensamentos e avaliações, sem reduzi-lo apenas à emoção ou ao intelecto.
- issue: Força contextual de διαλογισμοί
  choice: dúvidas
  alternative: pensamentos; raciocínios
  rationale: “Dúvidas” expressa a hesitação negativa presente no episódio, enquanto a nota preserva a amplitude lexical e evita ocultar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para clareza e ampla legibilidade brasileira. A ordem e a repetição interrogativa do grego são preservadas de modo natural.
