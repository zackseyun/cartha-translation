  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: pt
  text: 'Ele lhes disse: “Que conversa é essa que vocês estão tendo entre si enquanto caminham?”[a] E eles pararam, com o semblante triste.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que palavras são essas que vocês trocam entre si enquanto caminham?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficaram parados, abatidos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Ele lhes disse
  rationale: Mantém o verbo comum λέγω como “disse”, sem substituí-lo por “perguntou”, embora a fala introduzida seja uma pergunta. O δέ é tratado pelo fluxo natural da narrativa, sem uma conjunção pesada.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Que conversa é essa
  rationale: Neste contexto, λόγοι se refere ao conteúdo da conversa. “Que conversa é essa” comunica isso em português atual; a nota preserva a formulação mais literal, “Que palavras são essas”.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: vocês estão tendo entre si
  rationale: Com “conversa”, essa construção expressa naturalmente a troca recíproca indicada por ἀντιβάλλετε e πρὸς ἀλλήλους, sem sugerir necessariamente uma disputa.
- source_word: περιπατοῦντες
  choice: enquanto caminham
  rationale: Expressa a simultaneidade do particípio presente com a conversa.
- source_word: ἐστάθησαν
  choice: eles pararam
  rationale: 'O aoristo de ἵστημι tem aqui sentido ingressivo/intransitivo: eles interromperam a caminhada e ficaram imóveis.'
- source_word: σκυθρωποί
  choice: com o semblante triste
  rationale: O adjetivo descreve uma aparência facial sombria ou abatida. “Com o semblante triste” conserva essa dimensão visível em registro digno e claro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para ampla legibilidade brasileira. A tradução principal prioriza uma pergunta idiomática, enquanto as notas registram alternativas mais formais e lexicalmente transparentes.
