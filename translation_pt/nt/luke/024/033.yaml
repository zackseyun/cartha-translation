id: LUK.24.33
reference: Luke 24:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: pt
  text: E, levantando-se naquela mesma hora, voltaram para Jerusalém e encontraram reunidos[a] os Onze e os que estavam com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ajuntados». O particípio grego os descreve como já reunidos quando foram encontrados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: levantando-se
  rationale: O particípio aoristo indica uma ação física que antecede e acompanha a ação principal; «levantando-se» preserva essa sequência sem parafrasear.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: naquela mesma hora
  rationale: A expressão dativa remete enfaticamente àquele momento específico, comunicando prontidão sem substituí-la pela interpretação mais ampla «imediatamente».
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: É a forma narrativa corrente para o retorno a um lugar anterior e soa natural em português.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: εὗρον
  choice: encontraram
  rationale: Reproduz o sentido narrativo comum de εὑρίσκω de modo direto e idiomático.
- source_word: ἠθροισμένους
  choice: reunidos
  rationale: O particípio perfeito passivo descreve o estado já existente do grupo quando foi encontrado. A colocação antes dos dois objetos deixa claro que abrange tanto os Onze quanto os demais.
- source_word: τοὺς ἕνδεκα
  choice: os Onze
  rationale: Mantém a designação convencional do grupo sem acrescentar «apóstolos», termo não expresso no grego.
- source_word: τοὺς σὺν αὐτοῖς
  choice: os que estavam com eles
  rationale: Tradução clara e próxima do grego, sem especificar indevidamente a identidade ou a função dessas pessoas.
theological_decisions:
- issue: A designação «os Onze» apesar da ausência de Judas e da possível ausência de Tomé
  choice: Manter «os Onze» como designação do grupo
  alternative: os onze apóstolos; os discípulos restantes
  rationale: O grego emprega diretamente τοὺς ἕνδεκα como designação convencional. Preservá-la evita harmonizar a composição exata dos presentes ou acrescentar uma identificação não declarada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de circulação internacional. A ordem «encontraram reunidos os Onze e os que estavam com eles» evita que «reunidos» pareça modificar apenas o segundo grupo.
