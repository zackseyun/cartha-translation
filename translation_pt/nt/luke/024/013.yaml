  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: pt
  text: E eis que, naquele mesmo dia, dois deles estavam indo para um povoado chamado Emaús, a sessenta estádios[a] de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O estádio era uma antiga unidade de distância; sessenta estádios correspondem a cerca de 11 quilômetros.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador narrativo de Lucas e sua função de chamar a atenção, sem omiti-lo nem reduzi-lo a uma simples transição.
- source_word: δύο ἐξ αὐτῶν
  choice: dois deles
  rationale: Expressa com naturalidade a construção partitiva, sem especificar além do que o contexto afirma.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: naquele mesmo dia
  rationale: Mantém a ênfase da expressão grega e liga claramente o episódio aos acontecimentos do mesmo dia.
- source_word: ἦσαν πορευόμενοι
  choice: estavam indo
  rationale: Reproduz o aspecto durativo da construção perifrástica no imperfeito com uma formulação corrente em português.
- source_word: εἰς κώμην
  choice: para um povoado
  rationale: κώμη indica uma povoação menor; “povoado” é claro e evita sugerir uma cidade de maior porte.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: a sessenta estádios de Jerusalém
  rationale: Conserva no texto a antiga unidade de distância e oferece a equivalência moderna em nota.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: chamado Emaús
  rationale: Traduz naturalmente a identificação nominal explícita do grego, sem alterar seu conteúdo.
