id: LUK.24.10
reference: Luke 24:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: pt
  text: Eram Maria Madalena, Joana, Maria, mãe de Tiago,[a] e as outras mulheres que estavam com elas; elas contavam essas coisas aos apóstolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “Maria de Tiago”. É provável que se refira à mãe de Tiago, embora também possa significar a esposa de Tiago.
    reason: Leitura alternativa decorrente de uma relação familiar elíptica no texto grego.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Eram
  rationale: O imperfeito plural introduz e identifica as mulheres mencionadas no contexto. Em português, a forma verbal dispensa o pronome; δέ funciona como transição narrativa leve e não exige aqui um conectivo explícito.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Maria Madalena
  rationale: Forma tradicional e natural em português para o nome e o gentílico ou epíteto.
- source_word: Ἰωάννα
  choice: Joana
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Maria, mãe de Tiago
  rationale: A expressão grega é elíptica e significa literalmente «Maria de Tiago». A identificação pela maternidade é a interpretação mais provável e idiomática, mas a ambiguidade é preservada em nota.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: as outras mulheres que estavam com elas
  rationale: O artigo e o adjetivo estão no feminino plural; «mulheres» explicita o referente implícito, e a oração relativa produz português natural.
- source_word: ἔλεγον
  choice: contavam
  rationale: O imperfeito expressa uma ação em curso ou reiterada; «contavam» preserva esse aspecto e se ajusta ao relato de acontecimentos.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: aos apóstolos
  rationale: «Apóstolos» é o termo português estabelecido e identifica adequadamente o grupo apostólico de Jesus neste contexto.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o demonstrativo plural, que retoma os acontecimentos e a mensagem relatados anteriormente.
theological_decisions:
- issue: Identificação de Μαρία ἡ Ἰακώβου
  choice: Maria, mãe de Tiago
  alternative: Maria de Tiago; Maria, esposa de Tiago
  rationale: O grego deixa implícita a relação entre Maria e Tiago. A maternidade é a leitura mais provável segundo o uso de identificação presente nos Evangelhos, mas a possibilidade de relação conjugal não pode ser excluída; por isso, a tensão interpretativa é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «elas» na segunda oração evita ambiguidade após a enumeração e reflete a nova oração do grego.
