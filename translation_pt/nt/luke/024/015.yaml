id: LUK.24.15
reference: Luke 24:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: pt
  text: E aconteceu que, enquanto eles conversavam e discutiam[a], o próprio Jesus se aproximou e caminhava com eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «debatiam»; o termo grego pode indicar uma discussão mais intensa.
    reason: lexical_alternative
  - marker: b
    text: Ou «se aproximou e ia com eles».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu que
  rationale: Preserva a fórmula narrativa de transição característica de Lucas em português atual, sem recorrer ao arcaico «sucedeu».
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: enquanto eles conversavam
  rationale: A construção ἐν com infinitivo articular tem valor temporal; «enquanto» expressa naturalmente a simultaneidade, e «conversavam» corresponde ao diálogo comum indicado por ὁμιλέω.
- source_word: συζητεῖν
  choice: discutiam
  rationale: «Discutiam» pode designar tanto o exame conjunto de uma questão quanto uma troca mais intensa, preservando a amplitude de συζητέω sem afirmar necessariamente hostilidade.
- source_word: αὐτὸς Ἰησοῦς
  choice: o próprio Jesus
  rationale: Mantém a ênfase do pronome αὐτός em aposição ao nome de Jesus.
- source_word: ἐγγίσας
  choice: se aproximou
  rationale: Expressa com naturalidade o movimento de Jesus em direção aos dois discípulos.
- source_word: συνεπορεύετο
  choice: passou a caminhar com eles
  rationale: Comunica a ação durativa do imperfeito e o sentido de acompanhá-los no caminho; «passou a» torna natural em português a entrada de Jesus na caminhada já em curso.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... e ...
  rationale: Conserva o encadeamento simples da narrativa, enquanto a construção temporal é vertida idiomaticamente por «enquanto».
theological_decisions:
- issue: Ênfase narrativa na identidade de quem se aproxima
  choice: o próprio Jesus se aproximou
  alternative: Jesus se aproximou
  rationale: O grego enfatiza que foi Jesus em pessoa quem se aproximou. A tradução mantém essa ênfase gramatical sem acrescentar inferência doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Discutiam» é usado no sentido amplo de examinar uma questão em conjunto; a nota preserva a possibilidade de maior intensidade. A locução «passou a caminhar» reproduz de modo natural o acompanhamento contínuo expresso pelo imperfeito grego.
