  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: pt
  text: E eles, depois de o adorarem[a], voltaram para Jerusalém com grande alegria,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem «depois de o adorarem». Ou: «depois de se prostrarem diante dele» ou «depois de lhe prestarem homenagem».'
    reason: textual_variant; lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples do grego sem acrescentar uma nuance temporal específica.
- source_word: αὐτοὶ
  choice: eles
  rationale: Representa o pronome explícito; em português, «eles mesmos» seria enfático demais neste contexto.
- source_word: προσκυνήσαντες αὐτόν
  choice: depois de o adorarem
  rationale: Expressa naturalmente a ação anterior do particípio aoristo em relação ao verbo principal. No contexto pós-ressurreição, «adorarem» comunica adequadamente a provável força de προσκυνέω, sem ocultar alternativas lexicais legítimas.
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: Equivalente direto, natural e conciso do verbo que significa retornar.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: Forma idiomática em português para indicar o destino com nome de cidade.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: com grande alegria
  rationale: Preserva o substantivo χαρά e a intensidade do adjetivo μεγάλη em linguagem corrente e digna.
theological_decisions:
- issue: Sentido de προσκυνέω em referência a Jesus ressuscitado
  choice: adorarem
  alternative: se prostrarem diante dele / lhe prestarem homenagem
  rationale: O contexto posterior à ressurreição e ligado à ascensão favorece «adorar», sem eliminar a amplitude lexical do verbo; por isso, as alternativas são registradas em nota.
- issue: Frase textualmente incerta προσκυνήσαντες αὐτόν
  choice: incluída no texto principal com nota de variante
  alternative: omitir a frase
  rationale: A frase consta do texto fornecido, mas está marcada como incerta na edição crítica; sua inclusão acompanhada de nota preserva tanto a evidência adotada quanto a incerteza textual.
translation_notes:
  register: Português moderno, natural e de ampla compreensão, com legibilidade brasileira. A construção «depois de o adorarem» mantém a relação temporal do particípio e evita uma formulação excessivamente literal.
