  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: pt
  text: Enquanto eles falavam dessas coisas[a], ele mesmo se pôs no meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “E lhes diz: ‘Paz a vocês.’”'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: dessas coisas
  rationale: O demonstrativo neutro plural retoma os acontecimentos que estavam sendo relatados; “dessas coisas” preserva o plural e a ligação com o contexto anterior.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Enquanto eles falavam
  rationale: A construção de genitivo absoluto com particípio presente expressa uma ação em curso e simultânea; “enquanto” comunica naturalmente essa relação temporal em português.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: O pronome explícito tem valor enfático e destaca a presença pessoal daquele de quem falavam.
- source_word: ἔστη
  choice: se pôs
  rationale: O aoristo de ἵστημι indica que ele tomou posição ali. “Se pôs” conserva esse aspecto melhor que “estava”, sem introduzir a ideia interpretativa de que “apareceu”.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Tradução direta e natural da expressão, indicando sua presença no centro do grupo.
theological_decisions:
- issue: 'Inclusão da leitura mais longa: “e lhes disse: ‘Paz seja com vocês’”'
  choice: Omitir da tradução principal, de acordo com o texto fornecido do SBLGNT.
  alternative: 'Incluir: “e lhes disse: ‘Paz seja com vocês.’”'
  rationale: O texto grego fornecido termina em “no meio deles”. A variante, embora conhecida e textualmente relevante, não deve ser incorporada por harmonização ou tradição; é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Falavam dessas coisas” é natural sem perder a referência plural; “se pôs no meio deles” preserva a ação pontual e evita interpretar ἔστη como mera aparição.
