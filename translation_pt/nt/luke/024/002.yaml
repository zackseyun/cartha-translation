  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: pt
  text: E encontraram a pedra rolada para longe do túmulo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: encontraram
  rationale: Aoristo ativo do indicativo, terceira pessoa do plural; o sujeito implícito retoma as mulheres do versículo anterior. “Encontraram” é natural e preserva o sentido básico do verbo.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo narrativo leve, sem contraste forte. “E” dá continuidade natural ao relato.
- source_word: τὸν λίθον
  choice: a pedra
  rationale: No contexto funerário, λίθος designa a pedra que fechava o túmulo. “A pedra” é a formulação corrente e precisa.
- source_word: ἀποκεκυλισμένον
  choice: removida
  rationale: Particípio perfeito passivo que descreve o estado resultante da pedra. “Removida” comunica claramente que ela já não fechava o túmulo, sem exigir que o português especifique o modo físico do deslocamento.
- source_word: ἀπὸ τοῦ μνημείου
  choice: do túmulo
  rationale: μνημεῖον, neste contexto dos Evangelhos, refere-se ao túmulo; ἀπό marca o afastamento em relação a ele. A contração “do” produz português natural.
theological_decisions:
- issue: Sujeito implícito no grego
  choice: E encontraram
  alternative: E elas encontraram
  rationale: A flexão plural do verbo em português permite manter o sujeito implícito, como no grego, enquanto o contexto anterior identifica as mulheres. Isso evita explicitação desnecessária sem criar ambiguidade relevante.
- issue: Modo de deslocamento da pedra
  choice: removida
  alternative: rolada para longe
  rationale: O verbo grego pertence ao campo semântico de rolar, mas o particípio perfeito enfatiza o estado resultante. “Removida” é idiomático e não força uma reconstrução mecânica além do necessário.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém-se a vírgula final porque o versículo continua sintaticamente no contexto imediato.
