  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: pt
  text: E estavam continuamente no templo, bendizendo[a] a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “louvando a Deus”. O verbo grego é “bendizer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Mantém a ligação simples com a narrativa anterior, sem acrescentar uma nuance causal ou conclusiva.
- source_word: ἦσαν
  choice: estavam
  rationale: O imperfeito indica uma situação contínua no passado; “estavam” expressa isso naturalmente em português.
- source_word: διὰ παντός
  choice: continuamente
  rationale: A expressão idiomática comunica constância ou regularidade persistente, não uma permanência física ininterrupta.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo do templo, e “templo” é a forma concisa e usual em português sem restringir o sentido ao santuário interior.
- source_word: εὐλογοῦντες
  choice: bendizendo
  rationale: Preserva o sentido lexical de εὐλογέω quando Deus é o objeto. “Louvando” é idiomático, mas torna mais genérica a expressão.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Deus é o objeto de εὐλογοῦντες; a construção “bendizer a Deus” é natural e dignificada em português.
theological_decisions:
- issue: Linguagem de adoração em εὐλογοῦντες τὸν θεόν
  choice: bendizendo a Deus
  alternative: louvando a Deus
  rationale: “Bendizendo” conserva o verbo específico do texto grego e sua linguagem de bênção dirigida a Deus, enquanto “louvando” continua sendo uma alternativa contextual legítima.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação do marcador junto a “bendizendo” identifica com precisão o termo explicado na nota.
