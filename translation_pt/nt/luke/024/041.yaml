  terminology: «Não acreditavam», «por causa da alegria», «alguma coisa para comer» e «aqui» são escolhas claras e fiéis. «Se maravilhavam» representa melhor θαυμαζόντων do que «estavam admirados», sem intensificar ou resolver a tensão da reação dos discípulos.
