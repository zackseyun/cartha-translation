  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: pt
  text: 'E, enquanto eles ainda não acreditavam por causa da alegria e se maravilhavam[a], ele lhes perguntou: “Vocês têm aqui alguma coisa para comer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam admirados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ
  choice: E, enquanto eles ainda
  rationale: ἔτι indica continuidade (“ainda”), e δέ funciona como conectivo leve; a construção com os particípios fica natural em português com “enquanto”.
- source_word: ἀπιστούντων
  choice: não acreditavam
  rationale: O particípio presente retrata uma reação em curso. “Ainda não acreditavam” preserva a hesitação temporária sem sugerir necessariamente incredulidade arraigada.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: por causa da alegria
  rationale: ἀπό expressa aqui causa ou origem. A formulação mantém o paradoxo de que a própria alegria contribuía para a dificuldade deles em acreditar.
- source_word: θαυμαζόντων
  choice: estavam admirados
  rationale: O particípio presente, coordenado com ἀπιστούντων, descreve assombro contínuo. “Admirados” comunica surpresa acompanhada de maravilhamento.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes perguntou
  rationale: Embora εἶπεν signifique literalmente “disse”, introduz aqui uma pergunta direta; “perguntou” é a forma idiomática e semanticamente exata em português.
- source_word: Ἔχετέ τι
  choice: Vocês têm alguma coisa
  rationale: 'A pergunta no presente é expressa naturalmente por “Vocês têm...?”, e τι, neste contexto interrogativo, tem sentido indefinido: “alguma coisa”.'
- source_word: βρώσιμον
  choice: para comer
  rationale: βρώσιμος significa “comestível” ou “próprio para comer”; a locução “alguma coisa para comer” é clara e idiomática.
- source_word: ἐνθάδε
  choice: aqui
  rationale: O advérbio indica simplesmente o lugar presente, traduzido de modo direto por “aqui”.
theological_decisions:
- issue: Natureza da reação dos discípulos ao Jesus ressuscitado
  choice: A incredulidade momentânea deles é apresentada em conexão causal com a alegria e acompanhada de assombro.
  alternative: Entender a frase apenas como ceticismo, sem destacar o paradoxo de não acreditarem por causa da alegria.
  rationale: A construção ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων reúne dificuldade de acreditar, alegria e assombro. A tradução conserva essa tensão sem transformar a reação em rejeição endurecida nem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para uma fala dirigida a várias pessoas. A ordem foi levemente ajustada para fluência, mantendo explícitos a continuidade, a causa e os dois estados simultâneos.
