base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: pt
  text: 'E, depois de o cobrirem[a], continuavam perguntando: “Profetize! Quem foi que bateu em você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de vendarem os olhos dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: depois de o cobrirem
  rationale: O particípio indica que o cobriram ou velaram. A formulação mantém a amplitude do grego sem explicitar no texto principal que vendaram os olhos, embora o contexto implique que sua visão foi impedida.
- source_word: ἐπηρώτων
  choice: continuavam perguntando
  rationale: O imperfeito sugere ação contínua ou repetida; “continuavam perguntando” preserva esse aspecto.
- source_word: λέγοντες
  choice: 'perguntando:'
  rationale: Em português, o conteúdo introduzido por λέγοντες pode ser integrado naturalmente após “perguntando”, evitando a redundância pouco idiomática de “perguntando, dizendo” sem perder informação.
- source_word: Προφήτευσον
  choice: Profetize!
  rationale: O imperativo direto preserva a ordem zombeteira e a ironia dirigida à identidade profética de Jesus.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Quem foi que bateu em você?
  rationale: A construção idiomática reproduz o particípio substantivado, “aquele que bateu em você”, em português corrente. “Bateu” comunica de modo claro o golpe físico indicado por παίω.
theological_decisions:
- issue: Explicitar ou não que Jesus teve os olhos vendados
  choice: Manter no texto principal a expressão mais ampla “depois de o cobrirem”
  alternative: “depois de vendarem os olhos dele” ou “depois de o vendarem”
  rationale: O contexto pressupõe que impediram Jesus de ver, mas περικαλύπτω significa propriamente cobrir ou velar. A tradução principal evita acrescentar uma especificidade não expressa pelo verbo, registrando a interpretação contextual em nota.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A colocação “depois de o cobrirem” preserva a distinção entre a preposição “de” e o pronome “o”; “continuavam perguntando” expressa o valor iterativo do imperfeito.
