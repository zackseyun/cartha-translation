  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: pt
  text: Mas vocês são os que permaneceram comigo em minhas provações[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em minhas tentações» ou «em meus testes». A palavra grega pode referir-se a tentações, testes ou provações; aqui, provavelmente aponta para as adversidades que Jesus enfrentou.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: vocês
  rationale: O pronome plural em posição inicial é enfático; em português, a estrutura «vocês são os que» conserva essa ênfase e tem ampla legibilidade brasileira.
- source_word: δέ
  choice: Mas
  rationale: Marca o contraste com o contexto imediatamente anterior.
- source_word: οἱ διαμεμενηκότες
  choice: os que têm permanecido
  rationale: O particípio perfeito substantivado identifica um grupo caracterizado por sua perseverança contínua até o presente; o perfeito composto preserva essa continuidade.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Expressa associação ou companhia de modo natural e direto.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: em minhas provações
  rationale: πειρασμός pode significar provação, teste ou tentação. «Provações» se ajusta melhor às adversidades enfrentadas por Jesus no contexto, sem apagar a amplitude lexical do grego, registrada em nota.
theological_decisions:
- issue: Sentido de πειρασμοῖς em referência a Jesus
  choice: provações enfrentadas por Jesus
  alternative: tentações ou testes experimentados por Jesus
  rationale: O contexto destaca que os discípulos permaneceram com Jesus durante adversidades e oposição. «Provações» comunica isso naturalmente, enquanto a nota preserva a possibilidade lexical de «tentações» ou «testes».
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. «Vocês» representa naturalmente a segunda pessoa do plural; «têm permanecido» conserva o valor resultante e continuativo do perfeito grego.
