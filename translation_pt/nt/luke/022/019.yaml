  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: pt
  text: 'E, tomando o pão, deu graças, partiu-o e deu-lhes, dizendo: “Isto é o meu corpo,[c] que é dado por vocês.[a][b] Continuem fazendo isto em memória de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem: “que é dado por vocês. Continuem fazendo isto em memória de mim”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “que está sendo dado por vocês”.'
    reason: lexical_alternative
  - marker: c
    text: “Isto é o meu corpo” é traduzido como está escrito; alguns o interpretam como “Isto significa o meu corpo”, mas o texto grego usa “é”.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: tomando um pão
  rationale: Mantém a ligação participial e traduz ἄρτος de modo direto no contexto da refeição; o artigo indefinido soa natural em português.
- source_word: εὐχαριστήσας
  choice: deu graças
  rationale: Expressa de modo idiomático a ação de agradecer anterior ao partir do pão, sem acrescentar um objeto não explícito no grego.
- source_word: ἔκλασεν
  choice: partiu-o
  rationale: Verbo corrente para partir pão; o pronome retoma claramente o pão.
- source_word: ἔδωκεν αὐτοῖς
  choice: o deu a eles
  rationale: Torna explícito em português o objeto subentendido e preserva o destinatário plural.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Isto é o meu corpo
  rationale: Preserva a afirmação copulativa direta do grego e não decide por paráfrase uma controvérsia sacramental.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: que é dado por vocês
  rationale: A oração relativa é natural em português; 'por vocês' comunica o valor benefactivo de ὑπέρ sem ampliar indevidamente sua interpretação.
- source_word: τοῦτο ποιεῖτε
  choice: Continuem fazendo isto
  rationale: Torna visível a força continuada ou repetida que o imperativo presente pode assumir neste contexto institucional.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: em memória de mim
  rationale: Expressão portuguesa clara para a comemoração ativa pretendida por ἀνάμνησις, sem reduzi-la a mera lembrança mental.
theological_decisions:
- issue: Sentido de “Isto é o meu corpo” no contexto eucarístico
  choice: Manter “Isto é o meu corpo”
  alternative: “Isto representa/significa o meu corpo”
  rationale: O grego usa diretamente ἐστιν, 'é'. A tradução conserva a formulação e a tensão teológica sem impor uma interpretação denominacional.
- issue: Estado textual da continuação de Lucas 22:19
  choice: Incluir a continuação no texto principal e registrar a variante em nota
  alternative: Encerrar o versículo após “Isto é o meu corpo”
  rationale: O SBLGNT fornece a passagem mais longa como texto de trabalho, embora marcada como textualmente discutida; a forma mais curta deve permanecer auditável em nota.
- issue: Aspecto do imperativo ποιεῖτε
  choice: “Continuem fazendo isto”
  alternative: “Façam isto”
  rationale: A formulação escolhida explicita a possível força habitual ou repetida do imperativo presente no contexto, sem definir frequência ou forma litúrgica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Preservou-se a sequência narrativa e evitou-se terminologia litúrgica ou denominacional acrescentada. Todos os marcadores de nota aparecem no texto principal.
