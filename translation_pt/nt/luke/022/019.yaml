revisions:
- from: 'E, tomando um pão, deu graças, partiu-o e o deu a eles, dizendo: “Isto é o meu corpo, que é dado por vocês.[a][b] Continuem fazendo isto em memória de mim.”'
  to: 'E, tomando o pão, deu graças, partiu-o e deu-lhes, dizendo: “Isto é o meu corpo,[c] que é dado por vocês.[a][b] Continuem fazendo isto em memória de mim.”'
  rationale: 'A revisão melhora a naturalidade portuguesa sem mudar o conteúdo: substitui «um pão» por a forma narrativa idiomática «o pão» e «o deu a eles» por «deu-lhes». Mantém-se a tradução direta de ἐστιν e a força continuada adotada para ποιεῖτε. A nota c restaura a transparência interpretativa constante do audit trail inglês, sem endossar uma leitura teológica específica.'
