  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: pt
  text: Então lhe apareceu um anjo do céu[a], fortalecendo-o.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem os versículos 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu
  rationale: O aoristo passivo de ὁράω funciona aqui como fórmula de aparição. “Apareceu” é natural em português e evita a ênfase indevida em observadores que “foi visto” poderia sugerir.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ dá prosseguimento à narrativa. “Então” expressa essa progressão sem introduzir um contraste forte.
- source_word: αὐτῷ
  choice: lhe
  rationale: O dativo indica a pessoa a quem o anjo apareceu. A construção “lhe apareceu” é idiomática e concisa em português.
- source_word: ἄγγελος
  choice: um anjo
  rationale: A origem celestial deixa claro que ἄγγελος significa “anjo”, e não simplesmente “mensageiro”. O substantivo sem artigo é adequadamente expresso com o artigo indefinido.
- source_word: ἀπ’ οὐρανοῦ
  choice: do céu
  rationale: A expressão indica origem celestial. “Do céu” é a formulação portuguesa mais natural e preserva o sentido do grego.
- source_word: ἐνισχύων
  choice: fortalecendo-o
  rationale: O particípio presente descreve uma ação concomitante à aparição. “Fortalecendo-o” preserva o sentido de dar força sem reduzi-lo à ideia mais interpretativa de encorajamento.
- source_word: αὐτόν
  choice: -o
  rationale: O pronome acusativo retoma Jesus como objeto direto de “fortalecendo”.
theological_decisions:
- issue: Status textual de Lucas 22:43
  choice: Incluir o versículo no texto principal, conforme o texto grego fornecido pelo SBLGNT.
  alternative: Alguns manuscritos omitem os versículos 43–44.
  rationale: O texto fornecido inclui o versículo. Como sua presença é discutida na tradição manuscrita, a variante é registrada em nota, sem ser ocultada nem resolvida dogmaticamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a sequência narrativa e a ação concomitante do particípio grego.
