reference: Luke 22:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: pt
  text: 'E vocês dirão ao senhor da casa: “O Mestre lhe diz: ‘Onde está o aposento de hóspedes[a] onde eu possa comer a Páscoa com os meus discípulos?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar de hospedagem”. O termo grego κατάλυμα indica um lugar para alojamento ou um aposento de hóspedes; aqui não significa especificamente “hospedaria”, e “sala no andar de cima” só é mencionada no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: ao senhor da casa
  rationale: Expressa de modo natural a ideia do responsável ou chefe da casa, preservando a nuance de autoridade sem afirmar necessariamente propriedade legal.
- source_word: ὁ διδάσκαλος
  choice: O Mestre
  rationale: Em português, “Mestre” traduz naturalmente o título reconhecido de Jesus como aquele que ensina e evita a expressão menos idiomática “O Professor” neste contexto.
- source_word: κατάλυμα
  choice: aposento de hóspedes
  rationale: Designa um espaço doméstico destinado à hospedagem. Evita “hospedaria”, inadequado ao contexto, e não antecipa “sala no andar de cima”, informação apresentada apenas no versículo seguinte.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Preserva o termo festivo judaico; o verbo “comer” deixa claro que a refeição pascal está em vista.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: com os meus discípulos
  rationale: “Discípulos” mantém o sentido relacional de seguidores que aprendem de um mestre, mais amplo que simples alunos.
- source_word: φάγω
  choice: posso comer
  rationale: O subjuntivo expressa ação contemplada na pergunta sobre o lugar apropriado; “posso comer” comunica essa nuance em português atual sem transformá-la numa afirmação futura categórica.
- source_word: ἐρεῖτε
  choice: vocês dirão
  rationale: Mantém o futuro do grego, que aqui funciona como instrução, e usa uma forma amplamente compreensível no português moderno.
theological_decisions:
- issue: 'Título pelo qual Jesus se identifica: ὁ διδάσκαλος'
  choice: O Mestre
  alternative: O Professor; O mestre
  rationale: “Mestre” é o equivalente contextual e tradicionalmente inteligível para um ensinador seguido por discípulos. A inicial maiúscula sinaliza o uso titular no discurso, sem acrescentar uma afirmação doutrinária ausente do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita uma conjugação regionalmente restrita; “lhe diz” conserva a concisão da fórmula grega. As aspas alternadas tornam os dois níveis de fala explícitos.
