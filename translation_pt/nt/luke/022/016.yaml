source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: pt
  text: Pois eu lhes digo que certamente não a comerei até que ela se cumpra no Reino de Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nunca mais a comerei até que ela se cumpra no Reino de Deus”. O grego nega enfaticamente uma ação futura. Algumas traduções explicitam “mais” com base no contexto, mas essa palavra não aparece no texto grego.'
    reason: lexical_alternative
  - marker: b
    text: O pronome “a” se refere à Páscoa mencionada no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: A fórmula de fala é vertida de modo natural em português, enquanto “pois” preserva a ligação explicativa de γάρ com o versículo anterior.
- source_word: ὅτι
  choice: que
  rationale: Introduz explicitamente o conteúdo da declaração de Jesus, preservando a estrutura do grego.
- source_word: οὐ μὴ φάγω
  choice: certamente não o comerei
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa uma negação enfática referente ao futuro; “certamente não” comunica essa força em português atual.
- source_word: αὐτό
  choice: o
  rationale: O pronome retoma a Páscoa mencionada no versículo anterior. O pronome português preserva a concisão e evita inserir no texto principal uma explicitação ausente do versículo grego.
- source_word: ἕως ὅτου
  choice: até que
  rationale: Expressa naturalmente em português o limite temporal indicado pela locução grega.
- source_word: πληρωθῇ
  choice: se cumpra
  rationale: O verbo πληρόω no passivo pode denotar cumprimento ou plena realização. “Se cumpra” preserva a ressonância histórico-salvífica sem explicar de que modo isso ocorrerá.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no Reino de Deus
  rationale: “Reino de Deus” é a expressão bíblica corrente e conserva as associações de governo e domínio presentes em βασιλεία.
theological_decisions:
- issue: Referente de αὐτό (“o”)
  choice: O pronome retoma a Páscoa mencionada no versículo anterior.
  alternative: O pronome pode abranger de modo mais amplo a celebração ou o acontecimento pascal.
  rationale: O contexto imediato favorece a Páscoa que Jesus desejava comer com os discípulos, mas o uso de um pronome no texto principal evita uma especificação maior do que a do grego.
- issue: Sentido de “se cumpra no Reino de Deus”
  choice: Preservar a linguagem escatológica de cumprimento sem definir seu mecanismo exato.
  alternative: Explicitar o cumprimento como a chegada do Reino de Deus ou como o banquete messiânico.
  rationale: O grego aponta para uma consumação escatológica, mas não identifica expressamente como a Páscoa será cumprida; por isso, a tradução mantém essa abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a ênfase da negação grega e a ambiguidade quanto à forma exata do cumprimento escatológico.
