  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: pt
  text: 'Mas vejam: a mão daquele que está me traindo está comigo à mesa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Marca o contraste enfático com o que precede de modo natural e direto em português.
- source_word: ἰδοὺ
  choice: vejam
  rationale: Preserva o chamado de atenção do imperativo demonstrativo, em linguagem moderna e compreensível.
- source_word: τοῦ παραδιδόντος με
  choice: daquele que está me traindo
  rationale: O particípio presente indica a pessoa envolvida na ação de entregar/trair Jesus; neste contexto, 'trair' comunica naturalmente o sentido sem perder o aspecto em curso.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: está comigo à mesa
  rationale: Expressão portuguesa idiomática que representa a presença conjunta à mesa, evitando a formulação pouco natural 'sobre a mesa' aplicada à mão.
theological_decisions:
- issue: Valor de παραδίδω no contexto da paixão
  choice: traindo
  alternative: entregando
  rationale: '''Entregar'' é o sentido lexical mais amplo, mas aqui a entrega é traiçoeira e ''trair'' expressa com clareza o papel de Judas. O particípio é mantido sem identificar nominalmente o agente.'
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A inversão imagética do grego é suavizada apenas o necessário: mantém-se ''a mão'' como sujeito, enquanto ''à mesa'' transmite idiomaticamente a comunhão de mesa.'
