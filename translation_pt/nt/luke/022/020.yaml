  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: pt
  text: 'Da mesma forma, tomou o cálice depois da ceia e disse: “Este cálice é a nova aliança[a] no meu sangue, que é derramado em favor de vocês[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o novo testamento”.
    reason: alternative_reading
  - marker: b
    text: No grego, “que é derramado em favor de vocês” vem depois de toda a declaração. A referência mais natural no contexto é ao sangue de Jesus, embora a construção também possa ser relacionada gramaticalmente ao cálice.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτήριον
  choice: cálice
  rationale: Em português bíblico corrente, “cálice” designa naturalmente o recipiente para beber e mantém a associação com seu conteúdo, sem exigir uma forma litúrgica específica.
- source_word: ὡσαύτως
  choice: do mesmo modo
  rationale: Retoma com clareza a ação do versículo anterior e soa natural em português.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: depois da ceia
  rationale: Preserva de modo conciso a sequência temporal e o contexto da refeição.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a ligação participial com a ação anterior sem tornar a frase pesada.
- source_word: καινὴ διαθήκη
  choice: nova aliança
  rationale: “Aliança” expressa melhor o contexto bíblico de uma relação pactuada e a evocação do sangue da aliança; “testamento” é mantido em nota como tradução tradicional possível.
- source_word: ἐν τῷ αἵματί μου
  choice: no meu sangue
  rationale: Conserva a preposição grega de maneira formalmente próxima, sem decidir entre nuances instrumentais como “por meio do” ou “estabelecida pelo”.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: que é derramado em favor de vocês
  rationale: “Em favor de vocês” comunica a força benefativa ou representativa de ὑπέρ sem impor uma teoria específica da expiação. A posição da oração relativa mantém perceptível a tensão sintática, enquanto o sentido contextual aponta para o sangue.
theological_decisions:
- issue: Sentido de διαθήκη no contexto da ceia
  choice: nova aliança
  alternative: novo testamento
  rationale: O contexto evoca a linguagem bíblica do sangue que ratifica uma aliança. “Aliança” é lexical e contextualmente preferível no português atual, enquanto “testamento” reflete uma tradição histórica de tradução.
- issue: Referente de τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: A redação sugere que o sangue é derramado, sem deslocar a oração para dentro da expressão anterior.
  alternative: Ligação gramatical mais imediata com “este cálice” ou com a declaração inteira.
  rationale: No grego, tanto ποτήριον quanto αἷμα são neutros, e o particípio aparece depois de toda a declaração. O contexto sacrificial favorece “sangue” como referente sem eliminar completamente a tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse grega foi expressa por “fez o mesmo com o cálice”, retomando a ação do contexto anterior sem acrescentar conteúdo teológico. Empregou-se “vocês” para o plural ὑμῶν.
