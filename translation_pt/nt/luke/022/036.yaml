id: LUK.22.36
reference: Luke 22:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: pt
  text: Mas agora, quem tem uma bolsa de dinheiro, leve-a, e leve também uma bolsa de viagem[a]; e quem não tiver, venda a sua capa e compre uma espada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mochila” ou simplesmente “bolsa”. A palavra grega πήρα designa uma bolsa usada em viagem.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega traduzida por “espada” (μάχαιρα) também pode designar uma lâmina mais curta, como um punhal ou uma espada curta.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Mas agora
  rationale: Preserva o forte contraste com as instruções anteriores e a referência à nova situação temporal.
- source_word: ὁ ἔχων
  choice: quem tem
  rationale: Expressa de modo natural e genérico o particípio substantivado, sem acrescentar marca de gênero.
- source_word: βαλλάντιον
  choice: uma bolsa de dinheiro
  rationale: Indica claramente uma bolsa destinada a guardar e transportar dinheiro.
- source_word: ἀράτω
  choice: leve-a
  rationale: No contexto de preparação para uma viagem, o imperativo significa tomar consigo ou levar.
- source_word: ὁμοίως καὶ πήραν
  choice: e leve também uma bolsa de viagem
  rationale: Comunica naturalmente o paralelismo de ὁμοίως e a função de πήρα como bolsa usada por viajantes.
- source_word: ὁ μὴ ἔχων
  choice: quem não tiver
  rationale: Mantém a elipse do texto grego, sem inserir explicitamente um objeto que o original deixa implícito; a continuação permite ao leitor inferir o sentido.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: venda a sua capa
  rationale: Preserva o imperativo e traduz ἱμάτιον como uma peça exterior importante do vestuário.
- source_word: ἀγορασάτω μάχαιραν
  choice: compre uma espada
  rationale: Reproduz diretamente o imperativo e mantém o termo tradicional e suficientemente amplo para μάχαιρα.
theological_decisions:
- issue: Se a ordem de comprar uma espada deve ser suavizada ou interpretada na própria tradução.
  choice: compre uma espada
  alternative: prepare-se para o perigo; compre uma arma
  rationale: O grego apresenta uma ordem direta e emprega μάχαιρα. A tradução conserva sua força literal e deixa em aberto as questões sobre uso figurado, autodefesa ou violência.
- issue: Identidade do objeto implícito em ὁ μὴ ἔχων.
  choice: quem não tiver
  alternative: quem não tiver uma espada
  rationale: A formulação mantém a concisão e a elipse genuína do grego, embora a ordem seguinte torne a espada a inferência contextual mais provável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “leve” torna explícito o paralelismo verbal exigido pelo português, sem alterar o conteúdo. A elipse em “quem não tiver” preserva uma ambiguidade do original.
