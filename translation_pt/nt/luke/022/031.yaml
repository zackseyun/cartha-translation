  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: pt
  text: 'Simão, Simão, veja: Satanás exigiu ter todos vocês, para peneirá-los como trigo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: veja
  rationale: Mantém a chamada enfática à atenção em linguagem natural e atual.
- source_word: ἐξῃτήσατο
  choice: exigiu ter
  rationale: Expressa o pedido forte ou reivindicação contido no verbo, sem acrescentar explicitamente a quem ele foi dirigido.
- source_word: ὑμᾶς
  choice: todos vocês
  rationale: Torna inequívoco que o pronome grego está no plural, embora Jesus se dirija diretamente a Simão.
- source_word: σινιάσαι
  choice: peneirá-los
  rationale: Preserva a metáfora agrícola de separar ou sacudir o trigo numa peneira.
theological_decisions:
- issue: Destinatários da exigência de Satanás
  choice: todos vocês
  alternative: você
  rationale: ὑμᾶς é plural; a tradução preserva a mudança do vocativo singular dirigido a Simão para o objeto plural que inclui os discípulos.
- issue: Objeto implícito da exigência
  choice: exigiu ter
  alternative: pediu permissão para pôr vocês à prova
  rationale: A formulação conserva a força do verbo e a elipse do original, sem explicitar uma concessão divina nem interpretar a peneiração como simples prova.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição enfática do nome e a metáfora do trigo foram preservadas; “todos vocês” explicita apenas o número plural já presente no grego.
