review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: Jesus se separa dos discípulos, a distância é aproximada e expressa pela imagem de um arremesso de pedra, ele se ajoelha e ora. Contudo, «ficou orando» pode sugerir de modo indevido o início ou a permanência posterior da oração; «orava» traduz mais diretamente o imperfeito προσηύχετο como ação em curso.'
  naturalness: «Cerca de um arremesso de pedra» soa incompleto como complemento de distância em português. «A uma distância de cerca de um arremesso de pedra» é claro e natural. A nota a contém ainda a sequência pouco aceitável «a aproximadamente a distância».
  terminology: «Ajoelhando-se» comunica naturalmente o idiomatismo θεὶς τὰ γόνατα sem interpretação doutrinária. «Arremesso de pedra» mantém a imagem concreta antiga e é compreensível em português internacional.
  issues:
  - severity: medium
    issue: Construção de distância pouco natural no texto
    rationale: «Se afastou deles cerca de um arremesso de pedra» omite uma construção que indique explicitamente a distância. «A uma distância de cerca de um arremesso de pedra» expressa com precisão a relação sintática e o valor aproximativo de ὡσεὶ.
  - severity: medium
    issue: Possível nuance inceptiva em «ficou orando»
    rationale: Embora possa indicar continuidade, «ficou orando» frequentemente sugere que passou a orar ou permaneceu orando. O imperfeito προσηύχετο é adequadamente representado por «orava», sem essa nuance adicional.
  - severity: low
    issue: Redação defeituosa na nota a
    rationale: «A aproximadamente a distância» acumula duas construções alternativas. A nota deve usar uma formulação única e idiomática.
  revised_text: E ele se afastou deles, a uma distância de cerca de um arremesso de pedra, e, ajoelhando-se, orava.
  revised_footnotes:
  - marker: a
    text: 'Ou: “aproximadamente à distância de um arremesso de pedra”.'
    reason: lexical_alternative
  - marker: b
