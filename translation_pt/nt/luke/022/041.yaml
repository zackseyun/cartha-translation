revisions:
- from: E ele se afastou deles cerca de um arremesso de pedra[a] e, pondo-se de joelhos[b], ficou orando.
  to: E ele se afastou deles, a uma distância de cerca de um arremesso de pedra, e, ajoelhando-se, orava.
  rationale: A revisão torna idiomática a expressão de distância, corrige a formulação da nota a e substitui «ficou orando» por «orava», que reflete o aspecto durativo do imperfeito sem acrescentar uma ideia de começo ou permanência. A cena e suas ambiguidades permanecem inalteradas.
