  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: pt
  text: E ele se afastou deles, a uma distância de cerca de um arremesso de pedra, e, ajoelhando-se, orava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: se afastou
  rationale: Embora a forma grega seja passiva, neste contexto descreve idiomaticamente Jesus separando-se dos discípulos. “Se afastou” é natural em português e não introduz a ideia de que outra pessoa o puxou.
- source_word: ὡσεὶ λίθου βολήν
  choice: cerca de um arremesso de pedra
  rationale: Preserva a expressão concreta de distância e a aproximação indicada por ὡσεὶ. É inteligível em português contemporâneo, embora menos idiomática que uma medida moderna, que apagaria a imagem original.
- source_word: θεὶς τὰ γόνατα
  choice: pondo-se de joelhos
  rationale: A expressão significa literalmente “tendo posto os joelhos” e funciona como um modo idiomático de indicar que alguém se ajoelhou. A formulação escolhida conserva a postura corporal com naturalidade.
- source_word: προσηύχετο
  choice: ficou orando
  rationale: O imperfeito apresenta a oração como ação em andamento. “Ficou orando” comunica esse aspecto durativo melhor que o simples “orou”, sem afirmar explicitamente que naquele instante ele começou a orar.
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome grego dá alguma ênfase ao sujeito. O português explicita o pronome “ele”, preservando uma ênfase discreta sem recorrer ao mais marcado “ele mesmo”.
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão narrativa simples do grego sem acrescentar uma relação temporal ou conclusiva mais específica.
theological_decisions:
- issue: Postura de oração e retrato cristológico
  choice: Narrar diretamente que Jesus se afastou, pôs-se de joelhos e permaneceu em oração.
  alternative: Acrescentar linguagem devocional ou uma explicação doutrinária sobre sua postura.
  rationale: O versículo relata ações físicas e oração sem formular uma interpretação doutrinária explícita. A tradução preserva a gravidade da cena sem ampliação confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “arremesso de pedra” conserva a imagem antiga; “pondo-se de joelhos” evita literalismo pouco natural; e “ficou orando” mantém o aspecto contínuo do imperfeito grego.
