id: LUK.22.15
reference: Luke 22:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: pt
  text: 'E ele lhes disse: “Desejei ardentemente[a] comer esta Páscoa[b] com vocês antes de sofrer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Com desejo desejei”; o grego emprega uma construção enfática para intensificar o anseio de Jesus.
    reason: lexical_alternative
  - marker: b
    text: “Esta Páscoa” pode referir-se especificamente à refeição da Páscoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: lhes disse
  rationale: Forma narrativa direta e natural para λέγω com πρός + acusativo; o pronome «lhes» expressa adequadamente os destinatários.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Desejei ardentemente
  rationale: A construção cognata intensifica o desejo. «Desejei ardentemente» preserva essa ênfase em português natural, sem reproduzir de maneira rígida a forma grega.
- source_word: τοῦτο τὸ πάσχα
  choice: esta Páscoa
  rationale: πάσχα pode designar a festa ou a refeição pascal. O contexto de «comer» aponta para a refeição, mas a formulação concisa preserva a amplitude lexical do grego.
- source_word: φαγεῖν
  choice: comer
  rationale: Equivalente direto e corrente do infinitivo de ἐσθίω, sem necessidade de ampliação.
- source_word: μεθ’ ὑμῶν
  choice: com vocês
  rationale: Expressa acompanhamento de modo claro e amplamente compreensível em português moderno.
- source_word: πρὸ τοῦ με παθεῖν
  choice: antes de sofrer
  rationale: A construção com πρό e infinitivo articular indica anterioridade. A forma portuguesa preserva a referência solene ao sofrimento iminente de Jesus sem especificar além do texto.
theological_decisions:
- issue: Sentido de πάσχα no contexto
  choice: Manter «esta Páscoa» no texto principal.
  alternative: «esta refeição da Páscoa»
  rationale: Embora o ato de comer indique que a refeição pascal está em vista, o grego diz literalmente «esta Páscoa». A tradução mantém a formulação e deixa o contexto comunicar a referência à refeição.
- issue: Força de Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Traduzir idiomaticamente como «Desejei ardentemente».
  alternative: «Com desejo desejei»
  rationale: A construção grega exprime forte intensidade. A opção escolhida conserva essa ênfase e o anseio pessoal de Jesus sem introduzir interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «Com vocês» evita formas regionais marcadas; «Páscoa» preserva o termo tradicional e a possível amplitude do original.
