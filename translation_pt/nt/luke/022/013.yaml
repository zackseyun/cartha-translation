source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: pt
  text: Então eles foram e encontraram como ele lhes havia dito e prepararam a Páscoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a refeição da Páscoa” ou “o cordeiro pascal”. O termo grego pode referir-se de modo amplo à celebração da Páscoa ou, mais especificamente, à refeição ou aos seus elementos sacrificiais.
    reason: Registra a amplitude semântica de πάσχα e evita restringir indevidamente o referente no texto principal.
lexical_decisions:
- source_word: ἀπελθόντες
  choice: eles foram
  rationale: O particípio aoristo indica uma ação anterior à de encontrar. A coordenação com verbo finito é natural em português e mantém a progressão narrativa.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ funciona como conectivo narrativo suave, dando continuidade à resposta dos discípulos às instruções de Jesus, sem contraste forte.
- source_word: εὗρον
  choice: encontraram tudo
  rationale: O verbo significa “encontraram”. “Tudo” explicita de modo idiomático a situação implícita descrita anteriormente, sem restringi-la a um único objeto.
- source_word: καθὼς
  choice: como
  rationale: Expressa a correspondência entre o que Jesus havia dito e o que os discípulos encontraram. “Como” é claro e natural; a própria construção comunica a exatidão da correspondência.
- source_word: εἰρήκει αὐτοῖς
  choice: ele lhes havia dito
  rationale: O mais-que-perfeito grego remete ao que Jesus dissera antes. “Havia dito” preserva essa relação temporal, e “lhes” traduz αὐτοῖς de modo natural.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Traduz diretamente a ideia de aprontar ou fazer os preparativos, com concisão e registro digno.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Mantém a amplitude de πάσχα, que pode designar a celebração pascal, a refeição ou seu elemento sacrificial, sem especificar no texto principal mais do que o grego.
theological_decisions:
- issue: Amplitude de πάσχα no contexto
  choice: a Páscoa
  alternative: a refeição da Páscoa; o cordeiro pascal
  rationale: Embora o contexto trate dos preparativos para comer a Páscoa, o termo grego permanece amplo. A tradução principal conserva essa amplitude e a nota registra sentidos contextualmente possíveis sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa é fluente, e o ponto e vírgula distingue as duas ações principais sem romper sua estreita ligação.
