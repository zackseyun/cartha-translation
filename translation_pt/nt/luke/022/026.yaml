id: LUK.22.26
reference: Luke 22:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: pt
  text: Mas entre vocês não deve ser assim.[a] Pelo contrário, o maior entre vocês torne-se como o mais jovem,[b] e quem lidera, como quem serve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas com vocês não é assim”. A expressão grega é elíptica e contrasta enfaticamente os discípulos de Jesus com o padrão de busca por posição descrito anteriormente.'
    reason: alternative_reading
  - marker: b
    text: “O mais jovem” indica aqui a pessoa socialmente menos importante, não apenas alguém de menor idade.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Mas entre vocês não deve ser assim
  rationale: Expressa em português natural o contraste enfático e a instrução implícita da frase grega elíptica, remetendo ao padrão de busca por posição descrito no versículo anterior.
- source_word: ἀλλ’
  choice: Pelo contrário
  rationale: Marca com clareza a forte transição adversativa para a orientação positiva de Jesus.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: o maior entre vocês
  rationale: Preserva o comparativo μείζων e seu sentido contextual de posição ou importância relativa dentro do grupo.
- source_word: γινέσθω
  choice: torne-se
  rationale: Mantém tanto a força imperativa quanto a ideia dinâmica de assumir uma nova postura, em vez de indicar apenas um estado.
- source_word: ὡς ὁ νεώτερος
  choice: como o mais jovem
  rationale: É uma formulação portuguesa idiomática para o comparativo substantivado; a nota esclarece que o ponto inclui a posição social inferior associada ao mais jovem.
- source_word: ὁ ἡγούμενος
  choice: quem lidera
  rationale: Conserva o valor verbal do particípio e evita impor linguagem institucional ou política mais forte do que o contexto exige.
- source_word: ὡς ὁ διακονῶν
  choice: como quem serve
  rationale: Preserva o sentido ativo de prestar serviço, sem transformar o termo em título ou cargo religioso.
theological_decisions:
- issue: Natureza da instrução de Jesus sobre posição e liderança
  choice: Apresentar o versículo como uma inversão ética da posição social entre os discípulos, na qual grandeza e liderança assumem a postura de quem ocupa posição inferior e serve.
  alternative: Empregar linguagem institucional mais forte sobre cargos, governo ou autoridade eclesiástica.
  rationale: O grego contrapõe “o maior” e “quem lidera” ao mais jovem e a quem serve. A tradução mantém o chamado à humildade e ao serviço sem acrescentar estruturas eclesiásticas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Entre vocês” e “quem lidera/serve” soam naturais sem perder a estrutura contrastiva do grego. A pontuação integra os marcadores de nota ao texto e preserva o paralelismo da segunda metade do versículo.
