  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: pt
  text: E diziam muitas outras coisas blasfemas[a] contra ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muitas outras coisas injuriosas» ou «muitas outras coisas ofensivas». O particípio grego também pode indicar, de modo mais amplo, fala injuriosa, embora «coisas blasfemas» preserve melhor toda a sua força aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou «a ele». A preposição grega pode ser traduzida mais literalmente dessa forma, mas, neste contexto, «contra ele» comunica melhor o caráter hostil da fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que liga esta declaração aos maus-tratos descritos anteriormente.
- source_word: ἕτερα πολλὰ
  choice: muitas outras coisas
  rationale: Expressão natural em português que preserva tanto a quantidade quanto a ideia de acréscimo ao que já foi dito ou feito.
- source_word: βλασφημοῦντες
  choice: coisas blasfemas
  rationale: O particípio pode indicar fala injuriosa, difamatória ou blasfema. A construção adjetiva é natural em português e preserva a força do termo sem limitar sua amplitude lexical.
- source_word: ἔλεγον
  choice: diziam
  rationale: O pretérito imperfeito comunica ação contínua ou repetida no passado de modo conciso e natural.
- source_word: εἰς αὐτόν
  choice: contra ele
  rationale: No contexto de fala hostil, «contra ele» expressa melhor a força adversativa da preposição, embora a tradução mais literal «a ele» também seja possível.
theological_decisions:
- issue: Se βλασφημοῦντες deve ser traduzido como injúria geral ou com o peso de «blasfêmia»
  choice: Preservar o sentido forte com «coisas blasfemas»
  alternative: muitas outras coisas insultuosas; muitas outras ofensas
  rationale: «Blasfemar» pertence ao alcance lexical do verbo grego e conserva a gravidade da fala dirigida contra Jesus. A nota registra os sentidos mais gerais possíveis, sem resolver indevidamente a amplitude do termo por uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Diziam» reproduz naturalmente o aspecto contínuo ou repetido do imperfeito; «coisas blasfemas» mantém a gravidade e a ambiguidade lexical relevante.
