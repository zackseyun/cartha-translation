  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: pt
  text: Chegou, então, o dia dos Pães sem Fermento, em que era necessário sacrificar a Páscoa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o cordeiro pascal» ou «o sacrifício pascal». O termo grego pode referir-se à celebração da Páscoa ou, neste contexto, especificamente à vítima sacrificada.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: Chegou
  rationale: O aoristo de ἔρχομαι é usado para a chegada de um dia ou ocasião; «chegou» é natural e preserva a imagem temporal do grego.
- source_word: δὲ
  choice: então
  rationale: Aqui, δέ marca a progressão da narrativa; «então» expressa a sequência sem acrescentar contraste.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: o dia dos Pães sem Fermento
  rationale: Preserva o singular «dia» e identifica de modo claro e corrente a celebração judaica ligada aos pães não fermentados.
- source_word: ᾗ
  choice: em que
  rationale: Retoma «dia» com valor temporal, reproduzindo naturalmente a construção relativa.
- source_word: ἔδει
  choice: era necessário
  rationale: O imperfeito impessoal expressa uma necessidade ou exigência vigente naquele dia, sem especificar além do texto se era ritual, calendárica ou divina.
- source_word: θύεσθαι
  choice: sacrificar
  rationale: No contexto cultual, θύω designa matar como sacrifício; «sacrificar» comunica essa dimensão ritual com clareza.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: πάσχα pode designar a celebração, a refeição ou, por metonímia, a vítima pascal. Manter «a Páscoa» preserva a amplitude lexical, enquanto o verbo e a nota esclarecem o referente concreto provável.
theological_decisions:
- issue: Referente de τὸ πάσχα no contexto sacrificial
  choice: «a Páscoa» no texto principal, deixando que «sacrificar» indique o sentido cultual
  alternative: «o cordeiro pascal» ou «o sacrifício pascal»
  rationale: O substantivo grego é mais amplo que «cordeiro» e pode referir-se metonimicamente à vítima sacrificial. A tradução principal conserva essa amplitude, e a nota apresenta as explicitações contextualmente possíveis sem resolver em silêncio a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Pães sem Fermento» funciona como nome reconhecível da celebração; «era necessário» preserva a noção de necessidade sem impor uma explicação teológica. O marcador [a] aparece no texto principal.
