  source_fidelity: A tradução preserva adequadamente o sentido da pergunta inferencial e, sobretudo, a formulação deliberadamente indireta da resposta de Jesus. Contudo, εἶπαν e ἔφη são ambos verbos de fala; embora “perguntaram” e “respondeu” sejam defensáveis pelo contexto, “disseram” reproduz melhor o paralelismo verbal do grego sem perder a clareza da pergunta.
  naturalness: '“Todos então perguntaram: ‘Então...’” repete “então” em posições muito próximas e soa pesado. A revisão distribui a conjunção inferencial na pergunta e usa uma narrativa mais fluida em português moderno.'
  terminology: “o Filho de Deus” é a forma estabelecida e adequada para ὁ υἱὸς τοῦ θεοῦ. “Vocês mesmos dizem que eu sou” mantém de modo natural a ênfase do pronome Ὑμεῖς, sem transformar a resposta em uma afirmação explicitada.
  issues:
