  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: pt
  text: 'Todos disseram: “Então, você é o Filho de Deus?” E ele lhes disse: “Vocês mesmos dizem que eu sou.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Vocês dizem que sim” ou “É como vocês dizem”. No contexto, as palavras de Jesus funcionam como resposta afirmativa, mas o grego diz mais literalmente: “Vocês mesmos dizem que eu sou”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: O adjetivo substantivado refere-se ao grupo inteiro e preserva a ênfase coletiva.
- source_word: οὖν
  choice: então
  rationale: Na pergunta, introduz a conclusão que o grupo tira da fala anterior; “então” é corrente e mantém essa força inferencial.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva a forma definida e o peso do título cristológico.
- source_word: εἶπαν
  choice: perguntaram
  rationale: Embora o verbo básico seja “dizer”, a fala que ele introduz é uma pergunta direta; “perguntaram” comunica naturalmente sua função no contexto.
- source_word: ἔφη
  choice: respondeu
  rationale: “Respondeu” expressa com naturalidade a função contextual do verbo de fala, pois Jesus reage à pergunta do grupo.
- source_word: Ὑμεῖς
  choice: vocês mesmos
  rationale: O pronome explícito é enfático; “vocês mesmos” conserva a ênfase e devolve aos interlocutores a formulação.
- source_word: λέγετε
  choice: dizem
  rationale: O presente do indicativo é representado diretamente pelo presente português.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que eles dizem, sem converter a resposta em paráfrase explicativa.
- source_word: ἐγώ εἰμι
  choice: eu sou
  rationale: Mantém a formulação breve e potencialmente solene do grego, sem acrescentar um predicativo ausente.
theological_decisions:
- issue: Se a resposta de Jesus deve ser traduzida como afirmação explícita ou como resposta indireta
  choice: Vocês mesmos dizem que eu sou
  alternative: Vocês dizem isso; É como vocês dizem
  rationale: A formulação principal acompanha de perto o grego e conserva sua tensão retórica. A nota esclarece que, no contexto, ela funciona como resposta afirmativa, sem substituir a redação por uma paráfrase mais definida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A ordem “Todos então” evita uma sequência narrativa pesada, enquanto “vocês mesmos” preserva a ênfase do pronome grego.
