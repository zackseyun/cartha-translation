  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: pt
  text: Depois de se levantar da oração, foi até os discípulos e os encontrou dormindo de tristeza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Depois de se levantar da oração
  rationale: O particípio aoristo indica uma ação anterior à ida até os discípulos. A formulação conserva a imagem de levantar-se após a oração sem transformar a expressão simplesmente em “depois de orar”.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: foi até os discípulos
  rationale: O particípio expressa movimento em direção aos discípulos. “Foi até” é natural em português e se ajusta ao ponto de vista narrativo.
- source_word: μαθητὰς
  choice: discípulos
  rationale: É o termo consagrado e contextualmente preciso nos Evangelhos.
- source_word: εὗρεν
  choice: encontrou
  rationale: Equivalente direto e natural de εὑρίσκω neste contexto.
- source_word: κοιμωμένους αὐτούς
  choice: os encontrou dormindo
  rationale: O particípio presente descreve o estado ou a ação em curso em que Jesus os encontrou.
- source_word: ἀπὸ τῆς λύπης
  choice: de tristeza
  rationale: ἀπό com o genitivo exprime aqui causa. “Dormindo de tristeza” conserva de modo conciso a relação causal e traduz λύπη em linguagem corrente e digna.
theological_decisions:
- issue: Causa do sono dos discípulos
  choice: O sono é apresentado como decorrente da tristeza.
  alternative: Eles estavam dormindo enquanto tristes, sem uma relação causal forte.
  rationale: ἀπὸ τῆς λύπης indica mais naturalmente causa. A tradução mantém essa relação sem acrescentar uma explicação psicológica ausente do texto.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A construção é concisa e digna; “da oração” preserva a forma da expressão grega, enquanto “foi até” evita rigidez sintática.
