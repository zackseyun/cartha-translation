  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Judas, é com um beijo que você está traindo o Filho do Homem?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “é com um beijo que você está entregando o Filho do Homem?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: A conjunção é um conectivo leve, mas, no contexto, introduz a reação contrastante de Jesus ao gesto de Judas; “Mas” expressa essa nuance com naturalidade.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Representa explicitamente o pronome dativo αὐτῷ e é uma formulação natural e concisa em português.
- source_word: Ἰούδα
  choice: Judas
  rationale: Vocativo do nome próprio, vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: φιλήματι
  choice: com um beijo
  rationale: O dativo indica meio ou instrumento. “Com um beijo” preserva o gesto concreto e soa natural em português.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação consolidada de Jesus e suas ressonâncias intertextuais, sem substituir o título por uma paráfrase interpretativa.
- source_word: παραδίδως
  choice: você está traindo
  rationale: O presente do indicativo, em pergunta retórica, retrata a ação em curso. No contexto hostil, “traindo” comunica adequadamente o sentido contextual, enquanto a alternativa mais literal é preservada em nota.
theological_decisions:
- issue: Tradução de τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional preserva tanto a estrutura da expressão grega quanto seu peso cristológico e sua provável ressonância em Daniel, sem reduzi-la a uma expressão meramente genérica.
- issue: Sentido contextual de παραδίδως
  choice: você está traindo
  alternative: você está entregando
  rationale: “Traindo” explicita o sentido hostil que o verbo assume na cena, mas a nota conserva a imagem lexical mais básica de entregar, evitando ocultar a amplitude do termo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção marcada “é com um beijo que” preserva a ênfase retórica sobre o meio da traição. O pronome “você” torna explícita e natural a segunda pessoa singular no português brasileiro contemporâneo.
