source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: pt
  text: 'E enviou Pedro e João, dizendo: “Vão e preparem para nós a Páscoa[a], para que a comamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a refeição da Páscoa”; o grego pode referir-se à Páscoa de modo mais amplo, embora aqui o contexto de preparar e comer aponte para a refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Traduz diretamente o aoristo narrativo de ἀποστέλλω, preservando a simplicidade do relato.
- source_word: εἰπών
  choice: dizendo
  rationale: Mantém a ligação participial com o verbo principal e é natural no registro narrativo em português.
- source_word: Πορευθέντες
  choice: Vão
  rationale: Embora formalmente seja um particípio aoristo, no contexto funciona como ordem preliminar associada ao imperativo seguinte.
- source_word: ἑτοιμάσατε
  choice: preparem
  rationale: Expressa claramente a ordem de realizar os preparativos necessários, sem acrescentar detalhes ausentes no texto.
- source_word: ἡμῖν
  choice: para nós
  rationale: Representa o dativo de benefício sem acrescentar a ideia explícita de totalidade.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Preserva a amplitude lexical de πάσχα; o contexto de preparar e comer aponta para a refeição, mas o termo não é estreitado no corpo do texto.
- source_word: ἵνα φάγωμεν
  choice: para que a comamos
  rationale: Expressa a finalidade da construção com ἵνα e subjuntivo; o pronome feminino retoma naturalmente “a Páscoa” em português.
theological_decisions:
- issue: Referente de τὸ πάσχα
  choice: a Páscoa
  alternative: a refeição da Páscoa; o cordeiro pascal
  rationale: O contexto indica fortemente a refeição pascal, mas a expressão grega pode ter alcance mais amplo. A tradução preserva essa abertura, e a nota esclarece a alternativa contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural imperativo “Vão e preparem” reproduz naturalmente as ordens dirigidas a Pedro e João. A construção “para que a comamos” é um pouco mais formal, mas preserva com clareza a finalidade expressa no grego.
