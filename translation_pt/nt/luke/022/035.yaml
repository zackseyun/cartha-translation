  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: pt
  text: 'E ele lhes disse: “Quando enviei vocês sem bolsa de dinheiro, sem bolsa de viagem e sem sandálias, faltou alguma coisa a vocês?” Eles responderam: “Nada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτερ
  choice: sem
  rationale: Expressa de modo natural e direto a ausência dos itens mencionados.
- source_word: βαλλαντίου
  choice: bolsa de dinheiro
  rationale: Designa uma bolsa usada para levar dinheiro; a formulação é clara no português moderno.
- source_word: πήρας
  choice: bolsa de viagem
  rationale: Refere-se a uma bolsa ou saco para provisões levado em viagem; esta opção comunica sua função sem especificidade indevida.
- source_word: ὑποδημάτων
  choice: sandálias
  rationale: É a tradução culturalmente adequada para o tipo de calçado associado às viagens no contexto dos Evangelhos.
- source_word: ἀπέστειλα
  choice: enviei vocês
  rationale: Preserva o sentido de comissionar e enviar; o contexto já deixa claro que se trata de uma missão.
- source_word: μή τινος ὑστερήσατε
  choice: faltou alguma coisa a vocês?
  rationale: Reproduz a pergunta que, no grego, espera resposta negativa, em linguagem corrente e fiel.
- source_word: Οὐθενός
  choice: Nada
  rationale: Mantém a resposta grega breve e enfática em português idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “sem” dá clareza à enumeração. Não se acrescentou nota para πήρα, pois “bolsa de viagem” preserva adequadamente o sentido amplo; “mochila” seria uma alternativa possível, mas mais específica.
