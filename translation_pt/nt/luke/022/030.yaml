id: LUK.22.30
reference: Luke 22:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: pt
  text: para que vocês comam e bebam à minha mesa no meu reino; e vocês se sentarão em tronos, julgando[a] as doze tribos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «governando» ou «regendo».
    reason: 'Alternativa lexical: κρίνω pode designar tanto julgar quanto exercer autoridade governante.'
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado decorrente da promessa anterior e preserva naturalmente a força télica em português.
- source_word: ἔσθητε καὶ πίνητε
  choice: vocês comam e bebam
  rationale: Os subjuntivos regidos por ἵνα são expressos pelo presente do subjuntivo depois de «para que», de modo natural e fiel.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: à minha mesa
  rationale: Expressão idiomática portuguesa para comunhão à mesa, sem o literalismo inadequado de «sobre a minha mesa».
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: no meu reino
  rationale: βασιλεία pode indicar reinado ou reino; o contexto de banquete e tronos favorece aqui o sentido de esfera real, sem excluir a ideia de autoridade régia.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: vocês se sentarão em tronos
  rationale: Preserva de forma direta a imagem futura de entronização e autoridade.
- source_word: κρίνοντες
  choice: julgando
  rationale: É o sentido lexical mais direto do particípio e conserva tanto a dimensão judicial quanto a possível associação com governo, explicitada em nota.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: as doze tribos de Israel
  rationale: Tradução transparente e tradicional que preserva a referência pactual a Israel em suas doze tribos.
theological_decisions:
- issue: Natureza da futura função dos discípulos em relação às doze tribos de Israel
  choice: julgando
  alternative: governando ou regendo
  rationale: κρίνω pode abranger atividade judicial e exercício de governo. O texto principal conserva o sentido lexical direto sem limitar a função à condenação nem reduzi-la à administração; a nota registra a amplitude possível.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para ampla legibilidade brasileira. «À minha mesa» mantém a naturalidade idiomática, e o ponto e vírgula torna clara a passagem da comunhão no reino à promessa de autoridade futura.
