id: LUK.22.22
reference: Luke 22:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: pt
  text: Pois o Filho do Homem vai conforme o que foi determinado, mas ai daquele homem por meio de quem ele é traído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é entregue”. O verbo grego pode significar tanto “trair” como “entregar”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da declaração anterior e mantém com naturalidade o encadeamento do discurso.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva a designação tradicional de Jesus e suas ressonâncias intertextuais.
- source_word: μέν ... πλὴν
  choice: '... mas'
  rationale: O contraste é expresso naturalmente em português pelo adversativo “mas”; não é necessário traduzir μέν separadamente.
- source_word: κατὰ τὸ ὡρισμένον
  choice: que foi determinado
  rationale: Conserva a ideia de determinação prévia e a forma passiva, sem explicitar quem determinou, pois o grego também não o faz.
- source_word: πορεύεται
  choice: segue o caminho
  rationale: Expressa de modo natural o curso que Jesus percorre rumo à morte, sem reduzir o verbo a mero deslocamento físico.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ai daquele homem
  rationale: Mantém a força profética de lamento e condenação, com referência clara ao indivíduo masculino em questão.
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: Preserva o valor de agência ou mediação de διά com genitivo.
- source_word: παραδίδοται
  choice: é traído
  rationale: No contexto imediato da ação de Judas, “traído” comunica claramente a deslealdade; a alternativa lexical “entregue” é preservada em nota.
theological_decisions:
- issue: Relação entre determinação divina e responsabilidade humana
  choice: Manter lado a lado o caminho determinado do Filho do Homem e o ai pronunciado contra o traidor.
  alternative: Atenuar a determinação prévia ou diminuir a responsabilidade do traidor.
  rationale: O texto grego afirma ambas as ideias em contraste direto, sem explicar como se relacionam; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. “Segue o caminho” evita a rigidez de “vai conforme o determinado” e preserva a dimensão figurada de πορεύεται.
