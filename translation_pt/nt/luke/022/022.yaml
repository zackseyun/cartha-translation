  source_fidelity: 'A formulação «segue o caminho que foi determinado» desloca o modificador de κατὰ τὸ ὡρισμένον: o grego diz que o Filho do Homem vai conforme aquilo que foi determinado, não que um «caminho» seja o objeto determinado. «Vai conforme o que foi determinado» preserva a construção, a passiva e a ambiguidade quanto ao agente da determinação.'
  naturalness: O texto é claro e de registro apropriado. «Vai conforme o que foi determinado» é natural em português moderno e mais direto do que a paráfrase «segue o caminho que foi determinado». «Por meio de quem» é compreensível e mantém adequadamente a mediação expressa por διά.
  terminology: «Filho do Homem», «ai daquele homem» e «é traído» são escolhas adequadas. A nota conserva de modo útil a alternativa lexical «é entregue», sem impor uma interpretação teológica do contraste entre determinação e responsabilidade.
