  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês estão dormindo? Levantem-se e orem, para que não entrem em tentação.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: estão dormindo
  rationale: Reproduz naturalmente o presente do indicativo e a pergunta direta de Jesus.
- source_word: ἀναστάντες
  choice: Levantem-se
  rationale: O particípio aoristo tem força circunstancial ligada ao imperativo seguinte; em português, dois imperativos coordenados expressam com clareza a ordem de se levantar e orar.
- source_word: προσεύχεσθε
  choice: orem
  rationale: Equivalente corrente e digno para o imperativo presente de προσεύχομαι.
- source_word: πειρασμόν
  choice: tentação
  rationale: Preserva a tradução tradicional e a amplitude contextual do termo, que pode envolver tentação ou provação, sem resolver além do que o texto permite.
theological_decisions:
- issue: Sentido de εἰσέλθητε εἰς πειρασμόν
  choice: entrem em tentação
  alternative: caiam em tentação; entrem em provação
  rationale: Mantém a imagem verbal de entrar e conserva a tensão semântica de πειρασμός, sem explicar se a referência principal é à sedução ao pecado ou à prova que se aproxima.
translation_notes:
  register: Português moderno, natural e digno, com tratamento plural por “vocês”, amplamente compreensível no Brasil e no português internacional. A sintaxe direta preserva a concisão e a urgência do original.
