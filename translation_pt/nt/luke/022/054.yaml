id: LUK.22.54
reference: Luke 22:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: pt
  text: Depois que o prenderam, levaram-no e o fizeram entrar na casa do sumo sacerdote. Pedro, porém, o seguia à distância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de longe».
    reason: Alternativa lexical para μακρόθεν, preservando sua possível formulação mais tradicional.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Depois que o prenderam
  rationale: O particípio aoristo indica uma ação anterior aos verbos principais. A formulação expressa com clareza essa sequência e preserva o sentido de captura e detenção.
- source_word: ἤγαγον
  choice: levaram-no
  rationale: ἄγω descreve condução ou deslocamento; neste contexto, trata-se de levar Jesus sob custódia.
- source_word: εἰσήγαγον
  choice: o fizeram entrar
  rationale: εἰσάγω inclui movimento para o interior. A escolha preserva a força direcional e evita repetir imediatamente o verbo «levar».
- source_word: οἰκίαν
  choice: casa
  rationale: Aqui οἰκία designa o edifício ou moradia, e «casa» é a tradução mais direta, natural e acessível.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: ἀρχιερεύς é o termo neotestamentário habitual para o principal sacerdote judeu; «sumo sacerdote» é a designação portuguesa consolidada.
- source_word: ἠκολούθει
  choice: seguia
  rationale: O imperfeito apresenta a ação como contínua no passado. Em português, «seguia» comunica naturalmente esse aspecto.
- source_word: μακρόθεν
  choice: à distância
  rationale: O advérbio indica separação espacial. «À distância» é claro e atual, sem acrescentar uma avaliação da atitude de Pedro.
- source_word: δὲ
  choice: porém
  rationale: O segundo δέ introduz um contraste moderado entre Jesus sendo levado para dentro e Pedro acompanhando-o separadamente.
theological_decisions:
- issue: Descrição da relação de Pedro com Jesus durante a prisão
  choice: «Pedro, porém, o seguia à distância»
  alternative: «Pedro continuava a segui-lo de longe»
  rationale: A tradução conserva a ação contínua e a distância física, mas não atribui a Pedro motivos como medo, covardia ou discrição, que o versículo não declara.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação pronominal mantém fluidez literária sem arcaísmo excessivo; «porém» marca o contraste narrativo de modo moderado.
