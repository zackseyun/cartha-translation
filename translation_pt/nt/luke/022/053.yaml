id: LUK.22.53
reference: Luke 22:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: pt
  text: Dia após dia, enquanto eu estava com vocês no templo, vocês não estenderam as mãos contra mim[a]. Mas esta é a hora de vocês e a autoridade das trevas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês não me prenderam”. Literalmente, “não estenderam as mãos contra mim”; no contexto, a expressão se refere a uma ação hostil, especificamente à prisão.
    reason: lexical_alternative
  - marker: b
    text: Ou “o poder das trevas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Dia após dia
  rationale: Expressa de modo natural o valor distributivo da locução grega e ressalta a repetição diária.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: enquanto eu estava com vocês
  rationale: Converte o genitivo absoluto em uma oração temporal corrente em português, preservando a simultaneidade.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo do templo, não apenas o santuário interior; a formulação tradicional é clara e suficientemente abrangente em português.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: vocês não estenderam as mãos contra mim
  rationale: Mantém a imagem e a hostilidade da expressão grega sem reduzir seu sentido apenas ao ato de prender; a nota esclarece o uso idiomático no contexto.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Mas esta é a hora de vocês
  rationale: Preserva a formulação solene e a noção de um momento próprio ou concedido aos interlocutores, sem explicá-la além do texto.
- source_word: ἐξουσία
  choice: autoridade
  rationale: Conserva o sentido de autoridade, direito ou domínio operativo, em vez de limitar o termo à força bruta.
- source_word: τοῦ σκότους
  choice: das trevas
  rationale: A expressão portuguesa preserva a metáfora personificada e sua densidade teológica sem identificar explicitamente seu referente.
theological_decisions:
- issue: Se “a autoridade das trevas” deve ser explicitada como autoridade de Satanás ou domínio do mal
  choice: Manter “a autoridade das trevas” sem expansão interpretativa.
  alternative: “o poder das trevas”, “a autoridade de Satanás” ou “o domínio do mal”
  rationale: O grego fala de “trevas” e não nomeia Satanás diretamente. A formulação preserva a tensão metafórica e espiritual do texto sem impor uma identificação doutrinária explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” corresponde ao plural dos verbos gregos e evita ambiguidade. A ordem e as imagens centrais do original foram preservadas, com esclarecimentos mínimos em notas.
