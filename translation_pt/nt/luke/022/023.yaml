  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: pt
  text: E eles começaram a discutir entre si qual deles, então, seria aquele que estava prestes a fazer isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem, então, dentre eles, estaria prestes a fazer isso”. Pelo contexto, “isso” se refere ao ato de traição anunciado no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: começaram
  rationale: Preserva a força ingressiva do aoristo com infinitivo, indicando o início da ação.
- source_word: συζητεῖν
  choice: discutir
  rationale: Expressa uma conversa conjunta para examinar a questão, sem necessariamente sugerir uma briga.
- source_word: πρὸς ἑαυτούς
  choice: entre si
  rationale: Transmite de modo natural em português a interação recíproca dentro do grupo.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: qual deles seria
  rationale: Reproduz naturalmente a pergunta indireta e deliberativa sobre um integrante de um grupo conhecido; a incerteza é preservada pelo contexto e pelo futuro do pretérito.
- source_word: μέλλων πράσσειν
  choice: estava prestes a fazer
  rationale: Preserva a ideia de iminência de μέλλω com infinitivo, sem convertê-la em mera intenção.
- source_word: τοῦτο
  choice: isso
  rationale: Retoma naturalmente em português o ato mencionado no versículo anterior, sem explicitá-lo além do que este versículo diz.
theological_decisions:
- issue: Explicitar que o ato era a traição
  choice: Manter “fazer isso” no texto principal.
  alternative: “traí-lo”
  rationale: Embora o contexto identifique claramente o ato como traição, o grego deste versículo usa a expressão geral τοῦτο μέλλων πράσσειν. A tradução preserva essa formulação e esclarece o referente em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Entre si” evita peso desnecessário; “estava prestes a” preserva a iminência do original.
