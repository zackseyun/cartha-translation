id: LUK.22.34
reference: Luke 22:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: pt
  text: 'Mas ele disse[a]: “Eu lhe digo, Pedro: hoje o galo não cantará até que você negue três vezes que me conhece.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhe digo, Pedro: hoje o galo não cantará antes que você negue três vezes que me conhece.”'
    reason: Alternativa lexical e sintática para ἕως em uma construção temporal negativa.
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Mas ele disse
  rationale: O δέ marca aqui uma transição levemente contrastiva na conversa; “mas” conserva essa relação de modo natural.
- source_word: Λέγω σοι
  choice: Eu lhe digo
  rationale: Fórmula direta e corrente em português, preservando a força do presente λέγω e o objeto singular σοι.
- source_word: Πέτρε
  choice: Pedro
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal grego Πέτρος.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: hoje o galo não cantará
  rationale: Com ἀλέκτωρ como sujeito, φωνέω designa o canto do galo. O artigo definido é idiomático em português para essa referência genérica e conhecida no contexto, embora o grego seja anartro.
- source_word: ἕως
  choice: até que
  rationale: Mantém a construção temporal ligada ao verbo negado e preserva a sequência apresentada no grego.
- source_word: τρίς
  choice: três vezes
  rationale: Equivalente moderno, claro e direto do advérbio grego.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: você negue três vezes que me conhece
  rationale: Explicita, como no grego, que o conteúdo da negação é conhecer Jesus; evita reduzir a frase à ideia mais ampla de simplesmente negá-lo.
theological_decisions:
- issue: Natureza da negação predita de Pedro
  choice: “negue três vezes que me conhece”
  alternative: “me negue três vezes”
  rationale: O infinitivo εἰδέναι especifica que Pedro negará conhecer Jesus. A tradução conserva essa precisão sem ampliar a afirmação para uma rejeição teológica ou de lealdade mais abrangente.
- issue: Relação temporal entre o canto do galo e as três negações
  choice: “não cantará até que”
  alternative: “não cantará antes que”
  rationale: “Até que” acompanha mais de perto ἕως e preserva a formulação temporal do texto; “antes que” comunica o mesmo limite temporal de forma também possível, por isso é registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para fala direta natural e “lhe” na fórmula introdutória, sem regionalismos marcados. A colocação de “hoje” mantém sua relevância temporal, e “o galo” corresponde ao uso idiomático português.
