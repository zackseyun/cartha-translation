source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: pt
  text: 'Mas Jesus respondeu: “Basta!”[a] E, tocando-lhe a orelha, o curou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como “Deixem, por enquanto” ou “Permitam isto”.
    reason: Preserva a ambiguidade sintática e contextual de Ἐᾶτε ἕως τούτου.
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Basta!
  rationale: No contexto imediato, a expressão funciona naturalmente como uma ordem para interromper a violência. A formulação grega, porém, admite outra leitura, registrada em nota.
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: tocando-lhe a orelha
  rationale: Reproduz com naturalidade a ação expressa pelo particípio aoristo e mantém a referência ao homem ferido sem repetição pesada.
- source_word: ἰάσατο αὐτόν
  choice: o curou
  rationale: Traduz diretamente o verbo de cura e conserva o pronome masculino, cujo referente é o servo mencionado no contexto anterior.
theological_decisions:
- issue: Sentido da ordem Ἐᾶτε ἕως τούτου
  choice: Basta!
  alternative: Deixem, até aqui! / Permitam isto!
  rationale: A leitura principal entende a fala como uma ordem para cessar a resistência violenta, em harmonia com o contexto. Como a construção também pode ser entendida como um pedido para que permitam a ação naquele momento, a ambiguidade genuína é preservada em nota, sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com pontuação de diálogo natural. “Tocando-lhe a orelha” é corrente em registro bíblico contemporâneo sem soar arcaico; a nota evita sobrecarregar o texto principal.
