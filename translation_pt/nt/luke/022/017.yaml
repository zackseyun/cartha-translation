id: LUK.22.17
reference: Luke 22:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: pt
  text: 'E, depois de receber um cálice e dar graças, ele disse: “Peguem isto e repartam entre vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Repartam” também pode ser traduzido como “distribuam” ou “dividam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: depois de receber
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; a formulação explicita naturalmente a sequência em português.
- source_word: ποτήριον
  choice: um cálice
  rationale: O substantivo grego está sem artigo. “Um cálice” preserva essa forma, enquanto “o cálice” pode ser sugerido pelo contexto da refeição.
- source_word: εὐχαριστήσας
  choice: dar graças
  rationale: Expressa o agradecimento feito antes de Jesus falar, sem transformar o verbo em terminologia litúrgica técnica posterior.
- source_word: εἶπεν
  choice: ele disse
  rationale: Mantém a formulação simples do grego, sem acrescentar um objeto indireto não expresso.
- source_word: Λάβετε
  choice: Peguem
  rationale: Imperativo natural em português no contexto de entregar um objeto concreto; “recebam” também seria possível, mas é menos direto nesta cena.
- source_word: τοῦτο
  choice: isto
  rationale: Preserva a concisão do demonstrativo grego sem repetir interpretativamente “este cálice”.
- source_word: διαμερίσατε
  choice: repartam
  rationale: Transmite de modo natural a ideia de dividir ou distribuir algo entre os integrantes do grupo.
- source_word: εἰς ἑαυτούς
  choice: entre vocês
  rationale: Comunica idiomaticamente a distribuição recíproca dentro do grupo.
theological_decisions:
- issue: Emprego de linguagem eucarística ou litúrgica em εὐχαριστήσας e ποτήριον
  choice: 'Usar linguagem narrativa comum: “um cálice” e “dar graças”.'
  alternative: “o cálice” e formulações de caráter litúrgico mais marcado
  rationale: O texto narra uma ação de Jesus à mesa, mas não exige que a tradução importe terminologia e formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Cálice” é natural no contexto de uma refeição bíblica; “peguem” e “entre vocês” evitam rigidez excessiva. A nota registra a amplitude semântica de διαμερίσατε.
