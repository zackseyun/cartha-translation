source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: pt
  text: Quando amanheceu[a], reuniu-se o conselho dos anciãos do povo, incluindo os chefes dos sacerdotes e os escribas, e eles o conduziram ao seu Sinédrio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando se fez dia” ou “ao romper do dia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao conselho deles” ou “perante o conselho deles”. O termo grego συνέδριον pode indicar o próprio conselho, sua sessão formal ou o lugar onde se reunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Quando amanheceu
  rationale: Expressa com naturalidade em português a chegada do dia indicada pela construção grega, sem reduzir necessariamente a referência a um instante preciso.
- source_word: συνήχθη
  choice: reuniu-se
  rationale: Preserva o sentido passivo-coletivo de o grupo se reunir, em formulação idiomática e clara.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: o conselho dos anciãos do povo
  rationale: πρεσβυτέριον designa aqui o corpo constituído por anciãos, e não apenas a condição abstrata de presbítero ou ancião.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: tanto os chefes dos sacerdotes como os escribas
  rationale: A correlação τε καί é refletida por “tanto... como...”; os títulos permanecem transparentes e historicamente apropriados.
- source_word: ἀπήγαγον
  choice: eles o conduziram
  rationale: Comunica a ação de levar alguém a outro lugar no contexto judicial. O pronome explícito “eles” esclarece a mudança do singular coletivo “conselho” para o agente plural do verbo grego.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: ao Sinédrio deles
  rationale: “Sinédrio” é um termo reconhecível em português para o conselho governante referido por συνέδριον; “deles” preserva αὐτῶν, enquanto a nota mantém abertas as possibilidades de conselho, sessão ou lugar de reunião.
theological_decisions:
- issue: Relação entre πρεσβυτέριον e συνέδριον
  choice: Distinguir “conselho dos anciãos” de “Sinédrio”
  alternative: Traduzir ambos por “conselho”, ou entender συνέδριον como a sessão ou a sala do conselho
  rationale: O grego emprega dois termos relacionados, mas não idênticos. A tradução conserva essa variação sem decidir no texto principal se συνέδριον aponta especificamente para o corpo, a sessão formal ou o local.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Chefes dos sacerdotes” evita a possível impressão de haver vários sumos sacerdotes simultâneos; “escribas” conserva o título histórico amplamente conhecido.
