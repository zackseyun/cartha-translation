  source_fidelity: A tradução transmite adequadamente a sequência temporal, a reunião do corpo dirigente, a composição por chefes dos sacerdotes e escribas, e a condução de Jesus ao συνέδριον. “Sinédrio” é historicamente plausível neste contexto, embora seja uma designação institucional mais específica do que o termo grego genérico; a nota preserva as alternativas semânticas relevantes.
  naturalness: A construção “o conselho dos anciãos do povo, tanto os chefes dos sacerdotes como os escribas” é sintaticamente pouco natural em português, pois os grupos finais ficam em aposição mal definida ao “conselho”. “Incluindo” torna explícita e fluente a relação. “Seu Sinédrio” também soa mais idiomático que “Sinédrio deles”.
  terminology: “Conselho dos anciãos”, “chefes dos sacerdotes”, “escribas” e “Sinédrio” são termos claros e adequados ao registro histórico. A diferenciação entre πρεσβυτέριον e συνέδριον é mantida. A nota deve identificar συνέδριον para fundamentar precisamente as alternativas.
