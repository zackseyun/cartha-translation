  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: pt
  text: E, quando chegou a hora, ele se reclinou à mesa, e os apóstolos com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples de Lucas e soa natural no fluxo do relato.
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: quando chegou a hora
  rationale: Reproduz de modo natural a expressão grega, mantendo “a hora” como momento definido, em vez de generalizá-la para “o momento”.
- source_word: ἀνέπεσεν
  choice: se reclinou à mesa
  rationale: Expressa a postura histórica de quem se acomodava reclinado para comer; “à mesa” torna claro ao leitor moderno o contexto da ação.
- source_word: οἱ ἀπόστολοι
  choice: os apóstolos
  rationale: Tradução direta do substantivo com artigo, sem acrescentar o possessivo “seus”, ausente no grego.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Equivalente direto, claro e idiomático da expressão de companhia.
theological_decisions:
- issue: Postura dos participantes durante a refeição
  choice: ele se reclinou à mesa
  alternative: ele se sentou à mesa
  rationale: Mantém a referência cultural específica do verbo grego à postura reclinada durante a refeição, sem convertê-la em uma ação moderna genérica. Trata-se de precisão histórico-lexical, não de interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a concisão e a coordenação do grego. Não foi incluída nota porque “se reclinou à mesa” já comunica no próprio texto a postura de refeição indicada pelo verbo.
