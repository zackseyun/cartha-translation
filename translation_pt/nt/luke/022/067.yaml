  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: pt
  text: 'dizendo: “Se você é o Messias[a], diga-nos.” Mas ele lhes disse: “Se eu lhes disser, vocês certamente não acreditarão;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”.
    reason: Tradução alternativa do título grego ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o particípio presente e sua ligação com a narrativa anterior, de forma concisa e natural em português.
- source_word: Εἰ σὺ εἶ
  choice: Se você é
  rationale: Preserva a forma condicional explícita do grego, em vez de transformá-la numa pergunta direta.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Traduz o título no contexto da expectativa messiânica judaica; a nota registra a alternativa tradicional «o Cristo».
- source_word: εἰπὸν ἡμῖν
  choice: diga-nos
  rationale: Expressa de modo idiomático o imperativo de λέγω com objeto no dativo, preservando a força da exigência.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Mas ele lhes respondeu
  rationale: «Mas» comunica o contraste leve de δέ, e «respondeu» explicita naturalmente que a fala de Jesus reage à exigência anterior.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Se eu lhes disser
  rationale: Preserva de modo natural a condição com subjuntivo aoristo.
- source_word: οὐ μὴ πιστεύσητε
  choice: vocês certamente não acreditarão
  rationale: A locução «certamente não» comunica a negação enfática de οὐ μή sem recorrer a formulação arcaica.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste interrogatório, o termo funciona como título ligado à expectativa messiânica judaica. «Messias» torna esse sentido claro, enquanto a nota conserva a tradução tradicional alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» evita regionalismo excessivo; «lhes» preserva concisão e clareza. A pontuação mantém o versículo sintaticamente aberto, como no texto fornecido.
