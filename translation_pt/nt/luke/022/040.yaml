  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: pt
  text: 'Ao chegar ao lugar, ele lhes disse: “Orem para que não entrem em tentação[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provação” ou “teste”. O termo grego pode se referir tanto à tentação em sentido moral quanto, de modo mais amplo, a uma situação de prova.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Ao chegar ao lugar
  rationale: A construção participial indica a chegada ao local antes da ação principal. “Ao chegar” expressa essa relação temporal com naturalidade, enquanto “ao lugar” conserva a referência ao local conhecido pelo contexto.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Traduz diretamente o verbo de dizer e seu objeto indireto. O pronome “ele” deixa o sujeito claro em português sem acrescentar conteúdo interpretativo.
- source_word: Προσεύχεσθε
  choice: Orem
  rationale: O imperativo presente pede oração como ação efetiva e contínua no contexto. “Orem” é a forma natural e direta em português, sem tornar explícito um aspecto verbal que o idioma receptor normalmente deixa ao contexto.
- source_word: μὴ εἰσελθεῖν
  choice: para que não entrem
  rationale: A construção pode expressar o conteúdo ou propósito da oração. “Para que não entrem” preserva o verbo “entrar” e evita a interpretação adicional de “cair” em tentação.
- source_word: πειρασμόν
  choice: tentação
  rationale: No contexto imediato da vulnerabilidade espiritual dos discípulos, “tentação” é a opção mais natural. Como o termo grego também pode indicar prova ou teste, essa amplitude é preservada em nota.
theological_decisions:
- issue: Sentido de πειρασμός na advertência de Jesus
  choice: tentação
  alternative: provação ou teste
  rationale: A advertência aponta para o risco de fracasso espiritual, favorecendo “tentação”; contudo, o grego também pode designar uma situação mais ampla de prova. A nota mantém essa tensão sem restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação “Ao chegar” evita rigidez excessiva; “para que não entrem” mantém proximidade lexical com o grego e soa natural.
