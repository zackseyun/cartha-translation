id: LUK.22.39
reference: Luke 22:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: pt
  text: Então ele saiu e foi, como de costume, para o Monte das Oliveiras; e os discípulos também o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐξελθὼν
  choice: Então ele saiu
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal. Em português narrativo, uma oração coordenada é mais natural do que uma construção como “tendo saído”; “então” liga o versículo ao contexto sem sugerir contraste.
- source_word: ἐπορεύθη
  choice: foi
  rationale: O verbo comum de deslocamento é expresso com naturalidade e precisão por “foi”.
- source_word: κατὰ τὸ ἔθος
  choice: como de costume
  rationale: A expressão comunica uma prática habitual e permanece próxima do grego sem acrescentar o possessivo “seu”, que não está explícito.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: para o monte das Oliveiras
  rationale: É a forma consagrada e clara do nome geográfico em português.
- source_word: ἠκολούθησαν δὲ αὐτῷ
  choice: e ... o seguiram
  rationale: δέ funciona aqui como continuação narrativa, não como contraste forte; ἀκολουθέω mantém o sentido concreto de seguir alguém.
- source_word: καὶ οἱ μαθηταί
  choice: os discípulos também
  rationale: “Também” preserva a força aditiva de καί, enquanto “os discípulos” traduz o artigo e o substantivo sem acrescentar “seus”.
theological_decisions:
- issue: Explicitar que o costume era de Jesus
  choice: como de costume
  alternative: como era seu costume
  rationale: O contexto identifica Jesus como sujeito, mas o grego não traz possessivo. A formulação escolhida preserva essa concisão sem tornar a frase obscura.
- issue: Nomear Jesus em vez de manter o sujeito pronominal implícito
  choice: ele
  alternative: Jesus
  rationale: O grego depende do contexto anterior para identificar o sujeito. “Ele” mantém essa continuidade e evita acrescentar um nome ausente neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação “saiu e foi” reproduz em linguagem natural a sequência entre o particípio e o verbo principal. O ponto e vírgula separa as duas ações narrativas sem romper sua ligação.
