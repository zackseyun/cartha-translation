  text: οἱ δὲ εἶπαν αὐτῷ· Ποῦ θέλεις ⸀ἑτοιμάσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: pt
  text: 'Eles lhe perguntaram: “Onde quer que preparemos?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Onde quer que façamos os preparativos?” O objeto de “preparemos” fica implícito; pelo contexto anterior, trata-se da refeição da Páscoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Eles
  rationale: O artigo no plural funciona substantivamente e se refere aos discípulos no contexto. A partícula δέ tem aqui valor conectivo leve e pode ser absorvida naturalmente em português.
- source_word: εἶπαν αὐτῷ
  choice: lhe perguntaram
  rationale: Embora εἶπαν signifique literalmente “disseram”, a fala direta é uma pergunta; “lhe perguntaram” expressa com naturalidade em português a função comunicativa da construção.
- source_word: Ποῦ
  choice: Onde
  rationale: O advérbio interrogativo pergunta pelo lugar e corresponde diretamente a “onde”.
- source_word: θέλεις
  choice: o senhor quer
  rationale: θέλω indica vontade ou intenção. No diálogo com Jesus, “o senhor” evita a ambiguidade que “você” poderia criar com o sujeito plural de “façamos”, mantendo um tratamento natural e respeitoso sem usar linguagem arcaica.
- source_word: ἑτοιμάσωμεν
  choice: que façamos os preparativos
  rationale: O subjuntivo aoristo na primeira pessoa do plural, dependente de θέλεις, é expresso naturalmente por “quer que façamos”. “Os preparativos” conserva a ausência de objeto expresso no grego; o contexto anterior esclarece que se trata da Páscoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação principal preserva a ausência de objeto expresso no grego, enquanto a nota registra uma alternativa igualmente natural e explicita apenas o referente contextual.
