id: LUK.22.3
reference: Luke 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: pt
  text: Então Satanás entrou em Judas, chamado Iscariotes, que fazia parte do número dos doze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que era um dos doze”. Literalmente, “que era do número dos doze”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Então ... entrou
  rationale: δέ assinala a progressão narrativa, e o aoristo de εἰσέρχομαι é expresso naturalmente por “entrou”.
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome ou título pessoal.
- source_word: εἰς Ἰούδαν
  choice: em Judas
  rationale: Com “entrou”, a preposição portuguesa “em” expressa de modo natural a entrada em uma pessoa e preserva a força de εἰς sem reduzi-la a mera influência.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: chamado Iscariotes
  rationale: Reproduz com clareza a função identificadora do particípio καλούμενον em português corrente.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: que fazia parte do número dos doze
  rationale: Mantém a referência explícita ao “número” do grupo, mas evita a construção pouco idiomática “era do número”.
theological_decisions:
- issue: Natureza da ação de Satanás em Judas
  choice: “Satanás entrou em Judas”
  alternative: “Satanás influenciou Judas” ou “Satanás tomou conta de Judas”
  rationale: A construção εἰσῆλθεν ... εἰς descreve explicitamente entrada. A tradução conserva essa formulação forte sem definir além do texto a relação entre ação satânica e responsabilidade humana.
- issue: Designação do grupo dos doze
  choice: “os doze” em minúsculas
  alternative: “os Doze” como título formal
  rationale: O grego não marca capitalização. A forma em minúsculas preserva a referência ao grupo reconhecido sem impor tipograficamente que se trate de um título próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a força da entrada de Satanás e a expressão numérica referente aos doze, sem acrescentar explicações doutrinárias.
