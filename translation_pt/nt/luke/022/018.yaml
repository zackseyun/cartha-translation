  source_fidelity: A tradução representa com precisão a ligação explicativa de γάρ (“Pois”), a negação futura enfática οὐ μὴ πίω (“não beberei de modo algum”), o marco temporal ἀπὸ τοῦ νῦν (“de agora em diante”), a expressão não especificada γενήματος τῆς ἀμπέλου (“fruto da videira”) e a cláusula temporal futura “até que venha o reino de Deus”. Não resolve além do texto a natureza da vinda do reino.
  naturalness: O texto é claro, moderno e digno em português de ampla compreensão, inclusive no Brasil. “Pois eu lhes digo” e “de agora em diante” soam naturais no registro bíblico contemporâneo; “não beberei de modo algum” preserva adequadamente a ênfase sem recorrer a formulação arcaica.
  terminology: “Fruto da videira” preserva deliberadamente a expressão grega mais ampla, sem antecipar “vinho” no corpo do texto. “Reino de Deus” é terminologia estabelecida e adequada para βασιλεία τοῦ θεοῦ. A nota lexical está corretamente ancorada e apresenta “vinho” apenas como alternativa contextual.
