reference: Luke 22:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: pt
  text: 'Pois eu lhes digo: de agora em diante, não beberei de modo algum do fruto da videira[a] até que venha o reino de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinho”. O grego diz literalmente “fruto da videira”, expressão mais ampla que provavelmente se refere ao conteúdo do cálice sem empregar a palavra comum para vinho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: A fórmula de discurso direto λέγω ὑμῖν é expressa naturalmente por “eu lhes digo”; “pois” conserva a ligação explicativa de γάρ com o contexto anterior.
- source_word: οὐ μὴ πίω
  choice: não beberei de modo algum
  rationale: A combinação οὐ μή com o subjuntivo aoristo constitui uma negação futura enfática. “De modo algum” preserva essa força sem sugerir uma negação eterna que entraria em tensão com a oração introduzida por “até que”.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: A expressão marca o momento presente como início do período indicado e é idiomática no português atual.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: do fruto da videira
  rationale: γένημα designa aquilo que é produzido, o fruto ou produto. A formulação mantém a expressão mais ampla e solene do grego, sem substituí-la diretamente por “vinho”.
- source_word: ἕως οὗ
  choice: até que
  rationale: Introduz o limite temporal da negação; “até que” é a equivalência portuguesa clara e natural.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o reino de Deus
  rationale: “Reino de Deus” é a formulação estabelecida nos Evangelhos e conserva tanto a dimensão régia quanto a escatológica de βασιλεία.
- source_word: ἔλθῃ
  choice: venha
  rationale: O subjuntivo aoristo depois de ἕως οὗ é adequadamente representado pelo presente do subjuntivo português em uma oração temporal voltada para o futuro.
theological_decisions:
- issue: Se γενήματος τῆς ἀμπέλου deve ser traduzido como “vinho” ou pela expressão mais literal “fruto da videira”
  choice: fruto da videira
  alternative: vinho
  rationale: O grego emprega uma expressão mais ampla e formal que o termo comum para vinho. Preservá-la evita estreitar o sentido e mantém sua ressonância no contexto da refeição.
- issue: A natureza da futura vinda do reino de Deus
  choice: até que venha o reino de Deus
  alternative: até que o reino de Deus tenha vindo plenamente
  rationale: O texto estabelece um limite temporal futuro, mas não explica o modo nem a etapa dessa vinda. A tradução conserva essa abertura e não introduz uma definição escatológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada de modo idiomático sem perder a ênfase da negação nem a relação temporal. Conservou-se “fruto da videira” no texto principal por fidelidade lexical, com a alternativa contextual em nota.
