  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: pt
  text: E ele lhes mostrará uma sala grande no andar de cima, mobiliada[a]; façam ali os preparativos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma sala grande no andar de cima, já preparada” ou “uma sala grande no andar de cima, com os móveis dispostos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: E ele
  rationale: A forma combina καί com ἐκεῖνος e dá continuidade às instruções, retomando o dono da casa já mencionado. “E ele” é natural em português e mantém a referência definida sem a rigidez de “e aquele”.
- source_word: ὑμῖν δείξει
  choice: lhes mostrará
  rationale: O futuro de δείκνυμι com o dativo ὑμῖν é expresso de modo natural e direto por “lhes mostrará”.
- source_word: ἀνάγαιον
  choice: sala ... no andar de cima
  rationale: O termo designa um cômodo situado no piso superior. Esta formulação é clara em português atual e não acrescenta a ideia específica de quarto de hóspedes.
- source_word: μέγα
  choice: grande
  rationale: O adjetivo descreve diretamente o tamanho do cômodo; “grande” é a equivalência comum e adequada.
- source_word: ἐστρωμένον
  choice: mobiliada
  rationale: O particípio perfeito passivo indica que o ambiente já se encontrava arranjado, provavelmente com divãs ou outros elementos dispostos para a refeição. “Mobiliada” comunica esse estado, enquanto a nota preserva as demais possibilidades lexicais.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: façam ali os preparativos
  rationale: O advérbio locativo é preservado por “ali”, e a forma imperativa plural é comunicada naturalmente por “façam ... os preparativos”, isto é, preparem a refeição pascal no local indicado.
