  yaml_path: translation/nt/luke/022/062.yaml
  text: And after going outside, he wept bitterly.
translation:
  language: pt
  text: E, depois de sair para o lado de fora[a], chorou amargamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «E, tendo saído para o lado de fora, chorou amargamente».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples do grego sem acrescentar uma sequência temporal mais forte.
- source_word: ἐξελθὼν
  choice: depois de sair
  rationale: O particípio aoristo de ἐξέρχομαι apresenta a saída como anterior ao verbo principal; esta formulação comunica essa relação com naturalidade em português.
- source_word: ἔξω
  choice: para fora
  rationale: Mantém explícito o sentido espacial do advérbio, ainda que a combinação com «sair» produza uma leve redundância também presente no grego.
- source_word: ἔκλαυσεν
  choice: chorou
  rationale: É o equivalente corrente e solene de κλαίω neste contexto.
- source_word: πικρῶς
  choice: amargamente
  rationale: Reproduz de modo direto o advérbio que caracteriza a intensidade e a dor do choro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A construção «depois de sair para fora» preserva tanto a anterioridade do particípio quanto o advérbio espacial expresso no grego; a nota oferece uma correspondência mais formal à estrutura participial.
