  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: pt
  text: 'Mas Jesus disse aos chefes dos sacerdotes, aos oficiais do templo e aos anciãos que tinham vindo contra ele: “Vocês vieram com espadas e porretes, como se eu fosse um bandido[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salteador”. A palavra grega pode designar um ladrão violento, um bandido ou um fora da lei ligado a uma revolta. Jesus compara a abordagem armada ao modo de prender alguém considerado perigoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste entre a ação da prisão e a resposta de Jesus.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: que tinham vindo contra ele
  rationale: O particípio com ἐπί e acusativo, neste contexto de prisão, indica movimento hostil dirigido contra Jesus.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa coletivamente as principais autoridades sacerdotais; a formulação é clara e evita sugerir vários sumos sacerdotes em exercício simultâneo.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: oficiais do templo
  rationale: Refere-se a responsáveis pela segurança e ordem no templo; esta tradução é natural e suficientemente abrangente.
- source_word: πρεσβυτέρους
  choice: líderes do povo
  rationale: No contexto, refere-se a autoridades judaicas reconhecidas, e não apenas a homens de idade avançada. A expressão explicita a função institucional em linguagem corrente.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: como se eu fosse um bandido
  rationale: Reproduz de modo natural a comparação retórica. λῃστής pode indicar ladrão violento, salteador ou fora da lei de caráter insurgente.
- source_word: ἐξήλθατε
  choice: Vocês vieram
  rationale: Em português, o pretérito perfeito expressa naturalmente a ação recém-realizada de sair ou vir para prender Jesus.
- source_word: μαχαιρῶν
  choice: espadas
  rationale: É o equivalente comum e adequado ao contexto para as armas mencionadas.
- source_word: ξύλων
  choice: porretes
  rationale: Embora ξύλον possa significar madeira ou objeto de madeira, aqui indica bastões usados como armas; “porretes” comunica essa função com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A pergunta foi reestruturada segundo a ordem natural do português, sem perder sua força retórica. “Vocês” torna explícito o sujeito plural de ἐξήλθατε.
