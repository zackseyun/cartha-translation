  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: pt
  text: 'dizendo: “Pai, se queres, afasta de mim este cálice[a][b]. Contudo, não se faça a minha vontade, mas a tua.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retira de mim este cálice”.'
    reason: lexical_alternative
  - marker: b
    text: “Cálice” é uma metáfora bíblica para uma porção destinada a alguém, muitas vezes especialmente sofrimento ou juízo.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio presente que introduz o conteúdo da oração de Jesus e mantém a ligação com o contexto anterior.
- source_word: Πάτερ
  choice: Pai
  rationale: Equivalente natural e digno do vocativo dirigido a Deus, sem acréscimo arcaizante.
- source_word: εἰ βούλει
  choice: se queres
  rationale: Expressa de modo natural a condição ligada à vontade ou disposição do Pai; em português, querer abrange adequadamente a ideia contextual de estar disposto.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: afasta de mim
  rationale: Traduz de modo claro e idiomático o imperativo de retirar ou levar para longe, juntamente com a expressão preposicional ‘de mim’.
- source_word: τοῦτο τὸ ποτήριον
  choice: este cálice
  rationale: Mantém a metáfora bíblica e suas ressonâncias de porção destinada, sofrimento e juízo, sem explicá-la dentro do texto.
- source_word: πλὴν
  choice: Contudo
  rationale: Marca com clareza e solenidade a forte transição concessiva entre o pedido e a submissão.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: não ... a minha vontade, mas a tua
  rationale: Preserva as expressões nominais do grego e a distinção direta entre a vontade de Jesus e a do Pai.
- source_word: γινέσθω
  choice: se faça
  rationale: O imperativo na terceira pessoa pede que a vontade do Pai se realize; ‘se faça’ é natural, preciso e apropriado ao registro de oração.
theological_decisions:
- issue: Relação entre a vontade de Jesus e a vontade do Pai
  choice: não se faça a minha vontade, mas a tua
  alternative: não o que eu quero, mas o que tu queres
  rationale: Mantém explicitamente a distinção e a submissão presentes no texto, sem suavizar a tensão nem acrescentar uma explicação doutrinária posterior.
- issue: Força metafórica de ποτήριον
  choice: cálice
  alternative: sofrimento
  rationale: Conserva a imagem bíblica e sua profundidade intertextual, em vez de restringir antecipadamente seu significado a uma interpretação explicativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Usa ‘tu’ em concordância com ‘Pai’ e com a tradição de tratamento direto a Deus, sem formas arcaicas. A ordem foi ajustada para o português natural, mantendo a estrutura e a tensão do grego.
