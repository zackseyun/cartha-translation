id: LUK.22.5
reference: Luke 22:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐχάρησαν καὶ συνέθεντο αὐτῷ ἀργύριον δοῦναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: pt
  text: E eles se alegraram e concordaram em lhe dar dinheiro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prata”. A palavra grega pode se referir literalmente à prata ou, de modo mais geral, a dinheiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: se alegraram
  rationale: O aoristo de χαίρω expressa a reação de satisfação deles. “Se alegraram” preserva a intensidade e o tom digno do grego, sem recorrer a uma formulação coloquial.
- source_word: συνέθεντο
  choice: concordaram
  rationale: A forma média de συντίθημι significa aqui chegar a um acordo. “Concordaram” é clara, natural e mantém o sentido sem acrescentar a ideia mais específica de promessa.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo funciona como objeto indireto de δοῦναι. “Lhe dar” reproduz esse valor de modo conciso e natural em português.
- source_word: ἀργύριον
  choice: dinheiro
  rationale: Embora o termo designe literalmente prata, em contexto de transação pode significar dinheiro. “Dinheiro” comunica diretamente o sentido contextual, enquanto a alternativa literal é preservada em nota.
- source_word: δοῦναι
  choice: dar
  rationale: O infinitivo apresenta o conteúdo do acordo. “Dar” é o equivalente lexical direto; “pagar” seria possível no contexto, mas introduziria uma interpretação mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A coordenação repetida com “e” preserva a sequência simples do grego.
