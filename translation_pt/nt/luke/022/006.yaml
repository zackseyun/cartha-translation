id: LUK.22.6
reference: Luke 22:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: pt
  text: Ele concordou e começou a procurar uma oportunidade de entregá-lo a eles sem que a multidão estivesse presente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem a multidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: concordou
  rationale: Neste contexto, o verbo expressa o consentimento de Judas à proposta dos chefes dos sacerdotes e dos oficiais (vv. 4–5), não uma confissão pública.
- source_word: ἐζήτει
  choice: começou a procurar
  rationale: O imperfeito descreve uma busca em andamento e pode ter nuance incoativa; a formulação marca naturalmente o desenvolvimento narrativo após o acordo.
- source_word: εὐκαιρίαν
  choice: uma oportunidade
  rationale: Expressa de modo corrente a ideia de uma ocasião favorável ou apropriada.
- source_word: τοῦ παραδοῦναι
  choice: de entregá-lo
  rationale: Mantém o sentido básico de παραδίδωμι, entregar ou passar às mãos de alguém, sem apagar a implicação contextual de traição.
- source_word: ἄτερ ὄχλου
  choice: sem que a multidão estivesse presente
  rationale: Torna explícito em português natural que Judas buscava uma ocasião em que a multidão não estivesse presente, preservando o sentido de ἄτερ.
- source_word: αὐτοῖς
  choice: a eles
  rationale: Indica os destinatários da entrega, isto é, os chefes dos sacerdotes e os oficiais mencionados no contexto imediato.
theological_decisions:
- issue: A dimensão de traição em παραδοῦναι
  choice: entregá-lo
  alternative: traí-lo
  rationale: “Entregá-lo” preserva o valor lexical básico e a continuidade com outros usos do verbo na narrativa da paixão; “traí-lo” é uma interpretação contextual válida, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “sem que a multidão estivesse presente” evita a possível ambiguidade de “sem a multidão” e comunica naturalmente a circunstância procurada por Judas.
