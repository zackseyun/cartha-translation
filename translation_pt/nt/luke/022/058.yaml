  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: pt
  text: 'Pouco depois, outro homem, ao vê-lo, disse: “Você também é um deles.” Mas Pedro respondeu: “Homem, não sou.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Não sou um deles.” O grego diz apenas “não sou”, deixando implícito o complemento mencionado na acusação anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Pouco depois
  rationale: Expressão temporal idiomática que indica um breve intervalo; esta formulação é natural e concisa em português.
- source_word: ἕτερος
  choice: outro homem
  rationale: O adjetivo substantivado significa outra pessoa; o masculino singular e a forma de tratamento posterior sustentam a explicitação natural de “homem”.
- source_word: ἰδὼν αὐτὸν
  choice: o viu
  rationale: O particípio aoristo fornece a circunstância ligada à fala; uma oração coordenada soa mais natural em português e conserva a sequência narrativa.
- source_word: ἔφη
  choice: disse / respondeu
  rationale: φημί funciona como introdutor comum de fala. Na segunda ocorrência, “respondeu” explicita naturalmente a relação com a acusação sem alterar o conteúdo.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Você também é um deles
  rationale: ἐξ αὐτῶν indica aqui pertencimento ou associação ao grupo; “um deles” é a expressão portuguesa idiomática correspondente.
- source_word: Ἄνθρωπε
  choice: Homem
  rationale: Preserva o vocativo direto e o tom abrupto e defensivo de Pedro, sem suavizá-lo para “senhor”.
- source_word: οὐκ εἰμί
  choice: não sou
  rationale: Mantém a resposta elíptica do grego, na qual o complemento é entendido a partir da acusação anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” comunica naturalmente o singular de σύ; a fala de Pedro conserva a concisão e a brusquidão do original.
