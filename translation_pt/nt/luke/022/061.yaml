source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: pt
  text: 'Então o Senhor se virou e olhou para Pedro[a]. E Pedro se lembrou da palavra do Senhor, de como o Senhor lhe havia dito: “Antes que um galo cante hoje, você me negará três vezes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fitou Pedro”; o verbo grego pode indicar um olhar direto ou fixo.'
    reason: alternativa lexical
lexical_decisions:
- source_word: στραφεὶς
  choice: se virou
  rationale: O particípio aoristo indica uma ação anterior ao olhar. “Se virou” preserva a sequência e soa natural em português.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título aplicado a Jesus e sua força cristológica, sem reduzi-lo ao sentido mais estreito de “Mestre”.
- source_word: ἐνέβλεψεν
  choice: olhou para
  rationale: Expressa com clareza o olhar direto dirigido a Pedro; a possível nuance de intensidade é preservada em nota.
- source_word: ὑπεμνήσθη
  choice: se lembrou
  rationale: Embora a forma possa sugerir “foi lembrado”, o contexto destaca a recordação de Pedro; “se lembrou” é natural e fiel ao resultado.
- source_word: λόγου
  choice: palavra
  rationale: Refere-se à declaração específica de Jesus e preserva a expressão neotestamentária natural “palavra do Senhor”.
- source_word: ὡς
  choice: de como
  rationale: Introduz o conteúdo daquilo que Pedro recordou e reproduz naturalmente a construção grega sem reduzi-la a uma simples conjunção declarativa.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Antes que um galo cante
  rationale: πρίν com infinitivo marca anterioridade; o substantivo sem artigo é naturalmente expresso de modo indefinido como “um galo”.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente direto que conserva a imediaticidade temporal da predição.
- source_word: ἀπαρνήσῃ
  choice: você me negará
  rationale: “Negar” é preciso e tradicional neste contexto da paixão; o futuro português corresponde ao valor verbal no enunciado.
- source_word: τρίς
  choice: três vezes
  rationale: Forma corrente, clara e não arcaica em português moderno.
theological_decisions:
- issue: Tradução de κύριος como título de Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva tanto o uso narrativo quanto o peso cristológico do título, sem impor um sentido mais limitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea e mantém “palavra do Senhor” para conservar a formulação e o peso do original.
