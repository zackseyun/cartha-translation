  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: pt
  text: Aproximava-se a Festa dos Pães sem Fermento[a], chamada Páscoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A Páscoa e a Festa dos Pães sem Fermento eram celebrações estreitamente relacionadas; no uso judaico, podiam ser mencionadas em conjunto ou receber nomes sobrepostos.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: Aproximava-se
  rationale: O imperfeito apresenta a festa como estando cada vez mais próxima; a forma pronominal é natural e preserva o aspecto durativo.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui, δέ funciona como transição narrativa leve. Em português, não é necessário acrescentar um marcador explícito, o que evita introduzir contraste ou temporalidade indevidos.
- source_word: ἡ ἑορτὴ
  choice: a Festa
  rationale: ἑορτή designa uma celebração religiosa; «Festa» é claro, digno e tradicional neste nome próprio.
- source_word: τῶν ἀζύμων
  choice: dos Pães sem Fermento
  rationale: A expressão nomeia a festa judaica. «Pães sem Fermento» comunica de modo imediato o sentido de ἄζυμα a leitores atuais.
- source_word: ἡ λεγομένη
  choice: chamada
  rationale: O particípio identifica a festa por outro nome; a forma reduzida é natural em português e mantém a força explicativa.
- source_word: Πάσχα
  choice: Páscoa
  rationale: «Páscoa» é o equivalente português estabelecido para o nome da celebração judaica neste contexto.
theological_decisions:
- issue: Relação entre a Festa dos Pães sem Fermento e a Páscoa
  choice: 'Manter a identificação explicativa de Lucas: «a Festa dos Pães sem Fermento, chamada Páscoa».'
  alternative: Tratar a Páscoa e a Festa dos Pães sem Fermento como celebrações estritamente distintas e explicitar uma diferença cronológica.
  rationale: A formulação de Lucas permite o uso sobreposto dos nomes para o período festivo. A tradução preserva essa formulação sem impor harmonização nem distinção técnica ausente do versículo.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A ordem com o verbo no início soa natural na narrativa e evita inserir um marcador discursivo sem equivalente necessário. A capitalização trata os nomes das festas como designações próprias.
