base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: pt
  text: 'Cerca de uma hora depois, outro homem[a] insistiu: “Com certeza, este homem também estava com ele, pois também é galileu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outra pessoa”; a expressão grega é indefinida, embora o contexto sugira um homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Cerca de uma hora depois
  rationale: Expressa de modo natural o genitivo absoluto temporal e mantém a aproximação indicada por ὡσεὶ.
- source_word: ἄλλος τις
  choice: outro homem
  rationale: A expressão é indefinida (‘outro alguém’); o contexto favorece um falante masculino, sem tornar essa leitura textualmente incontestável.
- source_word: διϊσχυρίζετο
  choice: insistiu
  rationale: Comunica a força enfática da afirmação; no contexto narrativo, o pretérito perfeito é natural em português, embora o imperfeito grego possa sugerir insistência continuada.
- source_word: Ἐπ’ ἀληθείας
  choice: Com certeza
  rationale: Reproduz a forte asseveração de veracidade em português corrente e digno.
- source_word: οὗτος
  choice: este homem
  rationale: Conserva a referência dêitica e potencialmente acusatória a Pedro.
- source_word: μετ’ αὐτοῦ ἦν
  choice: estava com ele
  rationale: Mantém a afirmação direta de associação sem explicitar além do texto.
- source_word: καὶ γὰρ
  choice: pois também
  rationale: Preserva tanto a função explicativa de γάρ quanto o valor aditivo de καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: é galileu
  rationale: Identifica diretamente a origem regional de Pedro, fundamento da inferência do falante.
