  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: pt
  text: E, depois de sair, conversou com os principais sacerdotes e os oficiais[b] sobre como poderia entregá-lo[a] a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «traí-lo». O verbo grego pode significar «entregar», «passar às mãos de alguém» ou, neste contexto, «trair».
    reason: lexical_alternative
  - marker: b
    text: Esses «oficiais» eram provavelmente oficiais ou comandantes ligados à guarda do templo, não soldados romanos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: foi falar
  rationale: O particípio aoristo indica o deslocamento anterior ou concomitante à conversa; em português, a construção idiomática «foi falar» preserva com naturalidade tanto o movimento quanto a sequência.
- source_word: συνελάλησεν
  choice: falar com
  rationale: O verbo denota conversar ou tratar de um assunto em conjunto. No contexto, «foi falar com ... sobre» comunica de modo natural a ideia de conferência deliberativa.
- source_word: ἀρχιερεῦσιν
  choice: chefes dos sacerdotes
  rationale: Refere-se às principais autoridades sacerdotais, não a vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: στρατηγοῖς
  choice: oficiais
  rationale: Neste contexto do templo em Jerusalém, designa autoridades ligadas à guarda do templo; a nota esclarece essa referência sem sobrecarregar o texto.
- source_word: τὸ πῶς
  choice: sobre como
  rationale: A expressão introduz o conteúdo da conversa; «sobre como» é idiomático em português após «falar com».
- source_word: παραδῷ
  choice: poderia entregar
  rationale: παραδίδωμι significa entregar ou passar alguém ao poder de outros e, neste contexto, implica traição. «Entregar» preserva o sentido lexical mais amplo.
- source_word: αὐτοῖς ... αὐτόν
  choice: Jesus a eles
  rationale: O nome «Jesus» explicita o referente do pronome masculino e evita a sequência potencialmente pouco clara «entregá-lo a eles», sem alterar o referente contextual.
theological_decisions:
- issue: Tradução de παραδῷ na ação de Judas
  choice: entregar Jesus a eles
  alternative: traí-lo
  rationale: Embora a ação seja uma traição, o verbo grego tem o sentido mais amplo de entregar alguém. O texto principal mantém esse sentido concreto e a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Então» mantém a ligação narrativa de καί; «foi falar» evita uma construção participial rígida. Todos os marcadores de nota aparecem no texto principal.
