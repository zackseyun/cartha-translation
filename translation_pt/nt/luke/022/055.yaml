  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: pt
  text: Depois de acenderem uma fogueira no meio do pátio e se sentarem juntos, Pedro estava sentado entre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pedro sentou-se no meio deles”. O imperfeito grego também pode ser traduzido de modo mais simples como “sentou-se”, mas “estava sentado” ressalta melhor a cena em andamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: depois de acenderem
  rationale: O particípio aoristo no genitivo indica ação anterior à oração principal; a formulação é natural em português e expressa claramente que eles acenderam o fogo.
- source_word: πῦρ
  choice: uma fogueira
  rationale: Neste contexto, trata-se de um fogo aceso no pátio para aquecimento; “fogueira” é concreto e idiomático em português.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: no meio do pátio
  rationale: Preserva de modo claro a localização espacial indicada pelo grego.
- source_word: συγκαθισάντων
  choice: se sentarem juntos
  rationale: O segundo particípio aoristo é paralelo ao primeiro, e o prefixo σύν indica que as pessoas se sentaram juntas.
- source_word: ἐκάθητο
  choice: estava sentado
  rationale: O imperfeito apresenta Pedro em uma situação contínua no pano de fundo da cena.
- source_word: μέσος αὐτῶν
  choice: entre eles
  rationale: Expressa de maneira natural a posição de Pedro no interior do grupo, sem a rigidez de “no meio deles”.
- source_word: δὲ
  choice: Depois de
  rationale: A leve progressão narrativa de δέ fica suficientemente representada pela construção temporal inicial, evitando um conectivo redundante em português.
