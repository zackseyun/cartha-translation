  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: pt
  text: E eu confiro a vocês um reino, assim como meu Pai o conferiu a mim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E eu estabeleço com vocês uma aliança para lhes dar um reino, assim como meu Pai estabeleceu uma aliança comigo». O verbo grego pode ter sentido pactual ou indicar a disposição e concessão de algo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, preservando mais de perto a estrutura grega: «E eu confiro a vocês, assim como meu Pai conferiu a mim, um reino».'
    reason: previous_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: E eu
  rationale: A crase de καί com ἐγώ preserva tanto a ligação com o contexto anterior quanto a ênfase pessoal de Jesus.
- source_word: διατίθεμαι
  choice: confiro
  rationale: O verbo pode expressar disposição, concessão ou ação pactual. Com «um reino» como objeto, «confiro» comunica de modo natural a atribuição solene sem tornar explícita, no texto principal, uma nuance pactual que permanece possível.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo indica os destinatários. «A vocês» é claro, corrente e amplamente compreensível em português moderno.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz claramente a correspondência entre a ação de Jesus e a ação anterior do Pai.
- source_word: διέθετό
  choice: conferiu
  rationale: Repete a mesma escolha lexical usada para διατίθεμαι, preservando o paralelismo verbal; o aoristo é expresso pelo pretérito perfeito.
- source_word: μοι
  choice: a mim
  rationale: Representa diretamente o dativo do destinatário e mantém a ênfase contrastiva natural em português.
- source_word: ὁ πατήρ μου
  choice: meu Pai
  rationale: Tradução idiomática que preserva a relação filial expressa no grego.
- source_word: βασιλείαν
  choice: um reino
  rationale: O substantivo sem artigo pode ser naturalmente vertido como «um reino». No contexto seguinte, a ideia de domínio régio concedido se ajusta às referências à mesa e aos tronos.
theological_decisions:
- issue: Se διατίθεμαι deve ser traduzido com linguagem explicitamente pactual
  choice: confiro
  alternative: estabeleço uma aliança para lhes dar
  rationale: O verbo admite força pactual, mas a construção com βασιλείαν também sustenta o sentido mais amplo de conferir ou atribuir domínio régio. O texto principal evita impor uma formulação teológica mais específica, enquanto a nota preserva a possibilidade pactual.
- issue: Relação sintática de «um reino» com os dois verbos
  choice: Repetir o objeto por meio do pronome «o» na oração comparativa
  alternative: Colocar «um reino» no fim, como objeto compartilhado pelos dois verbos
  rationale: No grego, βασιλείαν aparece no fim e pode servir de objeto aos dois verbos. A redação principal explicita essa relação de forma natural em português, sem alterar a correspondência entre as duas ações; a estrutura mais próxima da ordem grega é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com «vocês» como plural não marcado para leitores brasileiros e internacionais. «Confiro» mantém a solenidade apropriada e soa mais natural do que «designo a vocês» neste contexto. A ordem sintática foi levemente naturalizada, e as ambiguidades pactual e estrutural foram preservadas nas notas.
