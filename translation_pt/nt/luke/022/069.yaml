reference: Luke 22:69
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: pt
  text: Mas, de agora em diante, o Filho do Homem estará sentado à direita do poder de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressão temporal natural em português que indica o ponto a partir do qual essa realidade passa a vigorar e preserva sua orientação para o futuro.
- source_word: δὲ
  choice: Mas
  rationale: Marca aqui uma transição contrastiva na resposta de Jesus; “Mas” expressa essa nuance adversativa com clareza.
- source_word: ἔσται
  choice: estará
  rationale: O futuro de εἰμί introduz o estado vindouro de exaltação. “Estará” combina naturalmente com “sentado” e evita sugerir que o Filho do Homem passará a existir.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva literalmente a autodesignação estabelecida de Jesus, bem como suas ressonâncias daniélicas e sua ambiguidade.
- source_word: καθήμενος
  choice: sentado
  rationale: Expressa a postura de entronização sem tornar explícita uma interpretação que o particípio, isoladamente, não enuncia.
- source_word: ἐκ δεξιῶν
  choice: à direita
  rationale: É a forma idiomática e digna em português para o lugar de honra e autoridade, preservando a ressonância bíblica da expressão.
- source_word: τῆς δυνάμεως
  choice: do poder
  rationale: Traduz diretamente o substantivo δύναμις. A alternativa “do Poder”, entendida como referência reverencial a Deus, é preservada em nota.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém explícito o genitivo que identifica de quem é o poder, sem substituir a formulação grega por uma paráfrase.
theological_decisions:
- issue: Fórmula de exaltação e reivindicação de autoridade divina
  choice: o Filho do Homem estará sentado à direita do poder de Deus
  alternative: o Filho do Homem estará sentado à direita do Poder
  rationale: A redação preserva a forte afirmação de exaltação e autoridade, bem como as ressonâncias do Salmo 110 e de Daniel 7, sem explicá-las excessivamente. A nota conserva a possibilidade de “Poder” funcionar como maneira reverencial de se referir a Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De agora em diante” é corrente sem ser coloquial; “Filho do Homem” mantém a forma bíblica tradicional; “estará sentado” comunica naturalmente o estado futuro de exaltação.
