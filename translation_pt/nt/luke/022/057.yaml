  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: pt
  text: 'Mas ele negou, dizendo: “Não o conheço, mulher.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: negou
  rationale: O verbo significa negar ou repudiar. Em português, «negou» pode ocorrer naturalmente sem objeto explícito quando o conteúdo da negação vem em seguida, preservando assim a forma não especificada do grego.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz o conteúdo da negação; «dizendo» preserva de modo natural essa ligação.
- source_word: Οὐκ οἶδα
  choice: não conheço
  rationale: No contexto de uma alegação de vínculo pessoal com Jesus, «não conheço» expressa naturalmente a negação de conhecê-lo.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma Jesus sem acrescentar «este homem», expressão ausente do texto grego.
- source_word: γύναι
  choice: Mulher
  rationale: É o vocativo direto dirigido à interlocutora. «Mulher» mantém a forma do grego sem introduzir a atenuação interpretativa de «senhora».
theological_decisions:
- issue: Se deve ser acrescentado um objeto explícito à negação de Pedro
  choice: 'Mantido sem objeto explícito: «ele negou»'
  alternative: «ele negou isso» ou «ele o negou»
  rationale: O grego não explicita o objeto de ἠρνήσατο. A construção portuguesa é compreensível com a fala subsequente e evita decidir se Pedro negou a acusação ou repudiou diretamente Jesus.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e próxima da estrutura grega. A colocação inicial de «Mulher» soa mais idiomática em português do que sua posição final, sem alterar sua função vocativa.
