  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s slave and cut off his right ear[a].
translation:
  language: pt
  text: E um deles golpeou o escravo do sumo sacerdote e cortou-lhe a orelha direita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o servo do sumo sacerdote”. A palavra grega doulos pode designar um servo ou um escravo, conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: golpeou
  rationale: O aoristo de πατάσσω descreve um golpe forte. “Golpeou” é atual, digno e mais preciso que o coloquial “bateu”.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: um deles
  rationale: Reproduz de modo idiomático a expressão indefinida e mantém anônima a pessoa mencionada por Lucas.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: o escravo do sumo sacerdote
  rationale: δοῦλος designa aqui uma pessoa em condição social subordinada e possivelmente juridicamente pertencente à casa do sumo sacerdote; “escravo” preserva essa realidade sem suavizá-la.
- source_word: ἀφεῖλεν
  choice: cortou
  rationale: Embora ἀφαιρέω tenha o sentido geral de retirar ou remover, neste contexto de agressão a formulação natural em português é “cortou-lhe a orelha”, comunicando a amputação.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: a orelha direita
  rationale: Mantém a especificação anatômica e o lado indicado por δεξιόν; o pronome enclítico em “cortou-lhe” identifica naturalmente a pessoa atingida.
theological_decisions:
- issue: Tradução de δοῦλος
  choice: escravo
  alternative: servo
  rationale: O termo é empregado em sentido social literal. “Escravo” explicita a condição de sujeição, enquanto “servo”, alternativa tradicional e semanticamente possível, é registrado em nota para preservar a transparência lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “cortou-lhe” evita repetição e conserva um registro narrativo natural.
