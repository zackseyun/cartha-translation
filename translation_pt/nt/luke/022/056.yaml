  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: pt
  text: 'Então, uma criada, ao vê-lo sentado junto à luz[a], fixou os olhos nele e disse: “Este homem também estava com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na luz”. A expressão grega pode indicar tanto uma posição junto à fonte de luz como a presença na área iluminada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: ao vê-lo
  rationale: O particípio aoristo introduz a percepção que leva à identificação; a construção temporal é natural em português e preserva a relação entre as ações.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ dá continuidade à narrativa, sem marcar contraste forte.
- source_word: παιδίσκη τις
  choice: uma criada
  rationale: παιδίσκη designa uma jovem serva ou escrava. “Criada” é clara e natural no contexto doméstico; o indefinido τις já é adequadamente expresso pelo artigo “uma”, sem a rigidez de “certa criada”.
- source_word: καθήμενον
  choice: sentado
  rationale: Expressa de modo direto a postura de Pedro.
- source_word: πρὸς τὸ φῶς
  choice: junto à luz
  rationale: Preserva a relação espacial indicada por πρός sem decidir se Pedro estava ao lado da fonte de luz ou dentro da área iluminada.
- source_word: ἀτενίσασα αὐτῷ
  choice: fixou os olhos nele
  rationale: Comunica um olhar concentrado e atento em linguagem portuguesa corrente e digna.
- source_word: Καὶ οὗτος
  choice: Este homem também
  rationale: Mantém tanto a força identificadora do demonstrativo quanto o valor inclusivo de καί.
- source_word: σὺν αὐτῷ ἦν
  choice: estava com ele
  rationale: Tradução direta da ideia de companhia ou associação, sem especificar além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala permanece direta e enfática, enquanto a ambiguidade espacial de πρὸς τὸ φῶς é preservada no texto e explicitada na nota.
