  terminology: «Uma criada» é uma forma idiomática e adequadamente indefinida para παιδίσκη τις; embora o termo grego possa trazer a noção de uma jovem serva/escrava, o contexto não exige explicitar condição servil. «Este homem também» conserva o demonstrativo identificador e o valor inclusivo de καί. A nota apresenta de forma clara a alternativa legítima para a expressão espacial.
