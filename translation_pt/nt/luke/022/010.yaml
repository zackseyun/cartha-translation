  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: pt
  text: 'Ele lhes disse: “Vejam: quando vocês entrarem na cidade, um homem carregando um cântaro de água virá ao encontro de vocês. Sigam-no até a casa em que ele entrar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Imperativo de atenção natural no português moderno, preservando a força dêitica sem recorrer ao mais solene e menos corrente “Eis”.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: quando vocês entrarem na cidade
  rationale: Traduz o genitivo absoluto como oração temporal e conserva a relação entre a entrada dos discípulos e o encontro subsequente.
- source_word: συναντήσει ὑμῖν
  choice: virá ao encontro de vocês
  rationale: Expressa de modo natural o futuro do verbo com objeto no dativo e evita sugerir um encontro previamente combinado.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Mantém a referência masculina específica do contexto.
- source_word: κεράμιον ὕδατος
  choice: um cântaro de água
  rationale: “Cântaro” designa com clareza um recipiente desse tipo e combina naturalmente com “de água”; o material de barro, embora possível lexicalmente, não precisa ser explicitado.
- source_word: βαστάζων
  choice: carregando
  rationale: Representa a ação contínua do particípio em linguagem corrente.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Sigam-no
  rationale: Transmite diretamente o imperativo aoristo, com referente masculino explícito no pronome.
- source_word: οἰκίαν
  choice: casa
  rationale: Equivalente concreto e natural neste contexto de movimento.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: em que ele entrar
  rationale: Identifica a casa e preserva o sentido direcional do verbo, usando uma construção idiomática em português.
