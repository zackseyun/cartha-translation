id: LUK.22.24
reference: Luke 22:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: pt
  text: Também surgiu entre eles uma discussão sobre qual deles era considerado maior[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parecia ser maior”. O verbo grego pode significar “parecia” ou “era considerado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: surgiu
  rationale: O verbo introduz o aparecimento de uma situação; “surgiu” é natural em português com “discussão” e preserva o movimento narrativo.
- source_word: δὲ καὶ
  choice: Também
  rationale: “Também” preserva a força aditiva de καί. A relação discursiva leve de δέ fica adequadamente expressa pela progressão natural da frase, sem acrescentar um marcador temporal inexistente no grego.
- source_word: φιλονεικία
  choice: discussão
  rationale: No contexto, indica contenda ou disputa motivada por rivalidade. “Discussão” é clara e natural, sem sugerir necessariamente confronto físico.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: Expressa de modo idiomático que a contenda ocorreu no interior do grupo.
- source_word: τὸ τίς αὐτῶν
  choice: sobre qual deles
  rationale: O artigo substantiva a pergunta indireta e introduz o assunto da discussão; “sobre qual deles” comunica isso naturalmente.
- source_word: δοκεῖ
  choice: era considerado
  rationale: Neste contexto de avaliação de posição dentro do grupo, o verbo pode indicar a consideração ou reputação social. A nota preserva a alternativa lexical “parecia”.
- source_word: εἶναι
  choice: ser
  rationale: Complementa δοκεῖ e é naturalmente representado na locução “era considerado” seguida do predicativo.
- source_word: μείζων
  choice: maior
  rationale: Preserva o comparativo grego, sem intensificá-lo para o superlativo “o maior” nem interpretá-lo diretamente como “mais importante”.
theological_decisions:
- issue: Linguagem de posição entre os discípulos
  choice: maior
  alternative: o maior; mais importante
  rationale: O grego emprega o comparativo μείζων, não um superlativo explícito. “Maior” conserva a forma e a tensão do texto sem explicar antecipadamente em que consiste essa grandeza.
- issue: Sentido de δοκεῖ
  choice: era considerado
  alternative: parecia
  rationale: A leitura principal comunica avaliação social no contexto da disputa, enquanto a nota mantém visível a ambiguidade lexical genuína do verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada ao uso natural do português, mantendo a adição expressa por καί, o comparativo de μείζων e a ambiguidade de δοκεῖ em nota.
