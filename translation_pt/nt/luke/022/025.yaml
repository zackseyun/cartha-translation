id: LUK.22.25
reference: Luke 22:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Os reis dos gentios[a] os dominam, e os que exercem autoridade sobre eles são chamados de benfeitores[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das nações”.
    reason: lexical_alternative
  - marker: b
    text: “Benfeitores” era um título honorífico dado a governantes ou patronos poderosos considerados promotores do bem público.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: reis
  rationale: O substantivo designa especificamente reis, e não apenas governantes em sentido genérico.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: No contexto de Lucas-Atos, ἔθνη frequentemente designa os povos não judeus; “das nações” continua sendo uma possibilidade lexical e é registrada em nota.
- source_word: κυριεύουσιν
  choice: os dominam
  rationale: Expressa de modo natural em português o exercício de domínio sobre outros e preserva a força crítica do contraste feito por Jesus.
- source_word: ἐξουσιάζοντες
  choice: os que exercem autoridade
  rationale: 'A formulação verbal conserva o sentido ativo do particípio: não apenas possuir um cargo, mas exercer autoridade.'
- source_word: εὐεργέται
  choice: benfeitores
  rationale: Equivalente conciso para o título honorífico aplicado no mundo greco-romano a governantes e patronos poderosos considerados promotores do bem público.
- source_word: καλοῦνται
  choice: são chamados de
  rationale: Reproduz naturalmente em português a voz passiva que indica o título atribuído a essas pessoas.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre a resposta de Jesus e a discussão anterior dos discípulos.
theological_decisions:
- issue: Sentido de ἐθνῶν no contexto
  choice: gentios
  alternative: nações
  rationale: “Gentios” reflete o uso frequente do termo para povos não judeus e o contraste com o padrão de liderança dado aos discípulos, sem acrescentar uma afirmação teológica além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Os dominam” evita o arcaísmo de “senhoreiam” e mantém a conotação de domínio. Os marcadores foram colocados junto aos termos a que as notas efetivamente se referem.
