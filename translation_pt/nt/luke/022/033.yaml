id: LUK.22.33
reference: Luke 22:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: pt
  text: 'Mas ele lhe disse: “Senhor, estou pronto para ir contigo tanto para a prisão como para a morte.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: O artigo funciona como pronome e retoma Pedro; δέ marca aqui um contraste leve com as palavras anteriores de Jesus. “Mas ele” preserva esse contraste sem explicitar o nome.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Reproduz de modo natural a ação de falar e o objeto indireto αὐτῷ, sem substituir o pronome por um referente explícito.
- source_word: Κύριε
  choice: Senhor
  rationale: É o equivalente português corrente de κύριε e preserva tanto o respeito da forma de tratamento como sua possível ressonância titular.
- source_word: μετὰ σοῦ
  choice: contigo
  rationale: μετά com genitivo expressa companhia; “contigo” é uma forma natural, clara e concisa em português.
- source_word: ἕτοιμός εἰμι
  choice: estou pronto
  rationale: Expressa prontidão e disposição, preservando a enfática autoconfiança de Pedro.
- source_word: καὶ ... καὶ
  choice: tanto ... como
  rationale: A construção correlativa representa naturalmente em português o par enfático καὶ ... καὶ e mantém os dois destinos em paralelo.
- source_word: εἰς φυλακὴν
  choice: para a prisão
  rationale: φυλακή designa aqui prisão ou encarceramento, e εἰς comunica direção ou destino.
- source_word: εἰς θάνατον
  choice: para a morte
  rationale: Mantém o paralelismo formal com “para a prisão” e comunica a disposição de Pedro de acompanhar Jesus até esse destino.
- source_word: πορεύεσθαι
  choice: ir
  rationale: No contexto, o infinitivo indica acompanhar Jesus em seu percurso ou destino; “ir” é o equivalente português mais natural.
theological_decisions:
- issue: Tradução de κύριος como título dirigido a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a forma direta de tratamento e a ressonância cristológica possível de κύριος, sem definir além do que o contexto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados quando naturais; não são necessárias notas de rodapé neste versículo.
