lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo simples e o fluxo narrativo do grego sem acrescentar uma nuance temporal.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: Traduz o termo genérico ἄνδρες sem especificá-los como guardas ou soldados além do que o texto afirma.
- source_word: οἱ συνέχοντες αὐτόν
  choice: que o mantinham sob custódia
  rationale: Neste contexto, συνέχω descreve os homens que mantinham Jesus detido. A expressão é clara em português e evita sugerir apenas um contato físico momentâneo.
- source_word: ἐνέπαιζον αὐτῷ
  choice: zombavam dele
  rationale: Expressa naturalmente em português a zombaria hostil indicada por ἐμπαίζω e pelo dativo αὐτῷ.
- source_word: δέροντες
  choice: enquanto batiam nele
  rationale: Preserva a ação concomitante e continuada do particípio, sem especificar indevidamente açoites ou uma modalidade particular de agressão.
theological_decisions:
- issue: Identificação dos agressores de Jesus
  choice: os homens que o mantinham sob custódia
  alternative: os guardas que o mantinham sob custódia
  rationale: O grego emprega o termo genérico ἄνδρες. Embora o contexto indique responsáveis pela custódia, chamá-los de “guardas” estreitaria a identificação além da forma lexical explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mantinham sob custódia” comunica a situação contextual sem substituir “homens” por uma função não explicitada; “batiam nele” é corrente e evita a especificidade excessiva de “açoitavam”.
