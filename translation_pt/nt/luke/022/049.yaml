source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: pt
  text: 'Quando os que estavam ao redor dele viram o que estava para acontecer, disseram: “Senhor, devemos golpear com a espada[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma espada”. O termo grego μάχαιρα pode designar uma espada ou uma lâmina mais curta, como um punhal.
    reason: alternativa lexical e possibilidade idiomática do singular
lexical_decisions:
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: O particípio aoristo é expresso como oração temporal, preservando sua relação com o verbo principal em português natural.
- source_word: οἱ περὶ αὐτὸν
  choice: os que estavam ao redor dele
  rationale: Reproduz a referência às pessoas que cercavam Jesus sem especificá-las além do que o grego declara.
- source_word: τὸ ἐσόμενον
  choice: o que estava para acontecer
  rationale: Expressa com clareza a iminência indicada pelo particípio futuro substantivado.
- source_word: εἶπαν
  choice: disseram
  rationale: Mantém o sentido normal de λέγω; a pontuação interrogativa comunica que a fala é uma pergunta.
- source_word: Κύριε
  choice: Senhor
  rationale: Conserva tanto o tratamento respeitoso dirigido a Jesus quanto o peso do título κύριος.
- source_word: εἰ
  choice: devemos
  rationale: Neste contexto, εἰ introduz uma pergunta deliberativa. A formulação com “devemos” comunica naturalmente que os discípulos pedem orientação ou permissão.
- source_word: πατάξομεν
  choice: devemos atacar
  rationale: O futuro indicativo tem valor deliberativo. “Atacar” transmite a ação hostil pretendida sem acrescentar um objeto ausente no grego.
- source_word: ἐν μαχαίρῃ
  choice: com a espada
  rationale: A preposição tem valor instrumental. O artigo definido conserva uma leitura natural do singular grego, embora “com uma espada” também seja possível.
theological_decisions:
- issue: Tradução de κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a força titular e teológica possível de κύριος, sem reduzi-lo a um tratamento meramente social.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe temporal foi naturalizada, e a pergunta deliberativa foi vertida com “devemos” para evitar um futuro pouco idiomático. O marcador da nota foi colocado junto de “espada”, termo ao qual a nota se refere.
