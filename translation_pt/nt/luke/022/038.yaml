reference: Luke 22:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: pt
  text: 'Então eles disseram: “Senhor, veja, aqui estão duas espadas.” Ele lhes disse: “É o bastante.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Basta disso”, possivelmente no sentido de que o assunto deveria ser encerrado, e não de que duas espadas fossem suficientes.'
    reason: Leitura alternativa que explicita outro sentido possível de Ἱκανόν ἐστιν sem resolver a ambiguidade no texto principal.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Então eles disseram
  rationale: δέ é um conectivo narrativo leve. “Então” dá continuidade natural ao diálogo sem introduzir um contraste forte.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” é a forma corrente de tratamento e preserva o uso de κύριος como título dirigido a Jesus.
- source_word: ἰδοὺ
  choice: olha
  rationale: No discurso direto, “olha” comunica de modo natural e atual a força dêitica de ἰδού, chamando atenção para as armas presentes.
- source_word: μάχαιραι
  choice: espadas
  rationale: μάχαιρα designa uma arma de lâmina; “espadas” é a tradução convencional e evita especificar além do texto se eram espadas curtas ou adagas.
- source_word: ὧδε δύο
  choice: aqui estão duas
  rationale: A formulação conserva tanto o sentido locativo de ὧδε quanto o numeral, em ordem natural no português.
- source_word: Ἱκανόν ἐστιν
  choice: É o bastante
  rationale: 'A expressão preserva a concisão e a ambiguidade do grego: pode indicar que duas espadas bastavam ou que Jesus estava encerrando o assunto.'
theological_decisions:
- issue: Ambiguidade interpretativa da resposta de Jesus, Ἱκανόν ἐστιν
  choice: É o bastante
  alternative: Basta disso
  rationale: O grego permite entender a frase como avaliação literal da quantidade de espadas ou como encerramento do diálogo. O texto principal mantém essa tensão, e a nota registra explicitamente a segunda possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O diálogo mantém tom direto e natural; evita-se tanto o arcaísmo “eis” quanto uma especificação excessiva do tipo de arma.
