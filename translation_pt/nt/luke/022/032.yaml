id: LUK.22.32
reference: Luke 22:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: pt
  text: Mas eu orei por você, para que a sua fé não desfaleça[a]. E você, quando tiver voltado[b], fortaleça os seus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para que a sua confiança não falhe» ou «para que a sua fidelidade não cesse». A palavra grega pode reunir esses sentidos.
    reason: alternative_reading
  - marker: b
    text: Ou «quando tiver retornado» ou «depois que você se voltar novamente». A expressão sugere restauração após a queda que Pedro estava prestes a sofrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: orei
  rationale: O aoristo indica a súplica feita por Jesus. Em português, o pretérito perfeito é natural e suficiente; o caráter fervoroso da petição pertence ao verbo grego, mas «orei» evita uma intensificação indevida.
- source_word: περὶ σοῦ
  choice: por você
  rationale: Com verbo de oração, περί com genitivo expressa intercessão. «Por você» é a forma idiomática e clara em português.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: para que ... não desfaleça
  rationale: ἐκλείπω pode indicar falhar, cessar ou perder as forças. «Não desfaleça» conserva a imagem de uma fé ameaçada sob provação sem afirmar necessariamente sua extinção total.
- source_word: πίστις
  choice: fé
  rationale: «Fé» preserva a amplitude semântica de πίστις, que aqui pode incluir confiança e fidelidade perseverante.
- source_word: ποτε
  choice: quando
  rationale: Neste contexto, ποτέ aponta para um momento futuro não especificado. Integrado à construção participial, «quando» produz português natural.
- source_word: ἐπιστρέψας
  choice: quando tiver voltado
  rationale: O particípio aoristo descreve uma volta anterior à ordem de fortalecer os irmãos. «Tiver voltado» preserva tanto a metáfora de retorno como a possibilidade de restauração, sem explicitar «arrependimento» além do texto.
- source_word: στήρισον
  choice: fortaleça
  rationale: O imperativo pede que Pedro torne firmes ou sustente os demais. «Fortaleça» é claro, digno e adequado ao sentido espiritual e relacional.
- source_word: ἀδελφούς
  choice: irmãos
  rationale: O masculino plural corresponde ao grego e, no contexto imediato, refere-se aos outros discípulos de Jesus.
theological_decisions:
- issue: Amplitude de πίστις entre fé, confiança e fidelidade
  choice: fé
  alternative: confiança ou fidelidade
  rationale: «Fé» mantém a amplitude teológica do termo, enquanto a nota registra sentidos sobrepostos relevantes no contexto da provação de Pedro.
- issue: Sentido restaurador de ἐπιστρέψας
  choice: quando tiver voltado
  alternative: quando tiver retornado; depois que você se voltar novamente
  rationale: A formulação conserva a ideia de retorno após a queda vindoura de Pedro, mas não transforma o particípio em um termo técnico explícito para arrependimento ou conversão.
- issue: Referente de ἀδελφούς
  choice: irmãos
  alternative: irmãos e irmãs; outros discípulos
  rationale: No cenário imediato, o referente mais provável é o grupo masculino dos discípulos; a tradução mantém essa precisão contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento «você» acompanha a distinção singular do grego e evita a solenidade regional de «tu»; os imperativos seguem esse tratamento. As notas preservam ambiguidades lexicais e teológicas reais sem sobrecarregar o texto principal.
