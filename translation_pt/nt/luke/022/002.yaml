id: LUK.22.2
reference: Luke 22:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: pt
  text: E os chefes dos sacerdotes e os escribas procuravam um modo de matá-lo[a], pois tinham medo do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «encontrar uma maneira de levá-lo à morte».'
    reason: Alternativa lexical que explicita a construção τὸ πῶς e traduz ἀνέλωσιν de forma mais formal, sem alterar a intenção letal.
lexical_decisions:
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma ação contínua ou repetida no passado; «procuravam» preserva esse aspecto com naturalidade.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal de Jerusalém. A expressão é clara em português e evita sugerir a existência simultânea de vários ocupantes do cargo singular de sumo sacerdote.
- source_word: γραμματεῖς
  choice: escribas
  rationale: É a tradução direta e consagrada no contexto dos Evangelhos, sem acrescentar uma explicação funcional ausente do grego.
- source_word: τὸ πῶς
  choice: um modo de
  rationale: A construção idiomática introduz a busca pelo meio de realizar a ação; «um modo de» soa natural e preserva a ideia deliberativa.
- source_word: ἀνέλωσιν
  choice: matá-lo
  rationale: Neste contexto, ἀναιρέω significa tirar a vida. «Matá-lo» expressa claramente a intenção hostil sem pressupor um procedimento judicial específico.
- source_word: ἐφοβοῦντο
  choice: tinham medo
  rationale: O imperfeito descreve um estado contínuo no passado; «tinham medo» comunica isso em português corrente.
- source_word: τὸν λαόν
  choice: do povo
  rationale: λαός refere-se coletivamente ao povo, não apenas a uma multidão reunida; «o povo» conserva a amplitude da referência.
theological_decisions:
- issue: Força de ἀνέλωσιν na intenção dos líderes
  choice: matá-lo
  alternative: eliminá-lo; levá-lo à morte
  rationale: A tradução mantém explícita a intenção de tirar a vida de Jesus, sem suavizá-la nem especificar prematuramente uma execução formal.
- issue: Referência de λαός
  choice: o povo
  alternative: a multidão
  rationale: «O povo» preserva a referência coletiva e a tensão narrativa da reação pública que os líderes temiam, sem restringi-la a um grupo momentaneamente reunido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Chefes dos sacerdotes» prioriza compreensão ampla; «escribas» conserva o termo histórico tradicional. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade.
