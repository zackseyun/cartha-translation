  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: pt
  text: E, estando em angústia[a], orava com mais intensidade; e seu suor tornou-se como gotas de sangue que caíam no chão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em agonia» ou «em intensa aflição».'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos omitem Lucas 22.43–44; outros os incluem. O SBLGNT imprime esses versículos entre colchetes para indicar essa incerteza textual. O grego diz literalmente «como gotas/coágulos de sangue», mantendo uma comparação, sem afirmar diretamente que o suor era sangue.
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: estando em angústia
  rationale: O particípio introduz o estado em que Jesus se encontrava. «Angústia» comunica luta e aflição intensas em português atual sem sugerir necessariamente dor física.
- source_word: ἐκτενέστερον
  choice: com mais intensidade
  rationale: Preserva claramente a força comparativa do advérbio e descreve o aumento da intensidade da oração sem acrescentar uma interpretação devocional.
- source_word: προσηύχετο
  choice: orava
  rationale: O pretérito imperfeito expressa ação contínua no contexto; «orava» é natural, digno e aspectualmente adequado.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: Mantém a ideia de passagem a um estado resultante, em vez de reduzir o verbo a uma simples cópula.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: como gotas de sangue
  rationale: «Como» preserva a comparação explícita de ὡσεὶ. «Gotas» é idiomático no contexto da queda ao chão, embora θρόμβοι também possa significar coágulos ou gotas espessas.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: que caíam no chão
  rationale: Expressa naturalmente o movimento descendente e conserva a imagem concreta do texto.
theological_decisions:
- issue: Natureza da comparação entre o suor e o sangue
  choice: O suor tornou-se como gotas de sangue.
  alternative: O suor tornou-se sangue ou continha sangue.
  rationale: A partícula ὡσεὶ marca explicitamente uma comparação. A tradução não transforma a semelhança em identidade nem exclui possíveis interpretações fisiológicas; simplesmente preserva o grau de afirmação do grego.
- issue: Incerteza textual de Lucas 22.43–44
  choice: Manter o versículo no texto e registrar a incerteza em nota.
  alternative: Omitir o versículo do texto principal ou apresentá-lo sem nota.
  rationale: O SBLGNT imprime a passagem entre sinais críticos, e a tradição manuscrita está dividida. A nota torna a evidência textual visível sem decidir silenciosamente a questão para o leitor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. «No chão» é mais corrente que «sobre a terra» neste cenário. As notas foram consolidadas em dois marcadores para manter o texto legível, sem perder a alternativa lexical nem a variante textual.
