source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: pt
  text: 'Mas Pedro disse: “Homem, não sei o que você está dizendo”. E imediatamente, enquanto ele ainda falava, um galo cantou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste e a progressão da sequência de acusações e negações, com naturalidade no discurso narrativo em português.
- source_word: Ἄνθρωπε
  choice: Homem
  rationale: Reproduz diretamente o vocativo masculino singular e conserva o tom brusco, sem acrescentar a deferência de “senhor” nem a familiaridade de “amigo”.
- source_word: οὐκ οἶδα
  choice: não sei
  rationale: Expressa de modo direto e idiomático o valor presente de οἶδα negado.
- source_word: ὃ λέγεις
  choice: o que você está dizendo
  rationale: Mantém a referência direta às palavras do interlocutor sem interpretar a frase como “o que você quer dizer” ou “do que está falando”.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Comunica claramente que o acontecimento ocorreu sem demora e preserva o destaque temporal do original.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: enquanto ele ainda falava
  rationale: Reproduz a simultaneidade e a ênfase de ἔτι em português natural.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: um galo cantou
  rationale: “O galo cantou” é a forma idiomática corrente em português para a vocalização dessa ave; o artigo indefinido corresponde à introdução do referente no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O vocativo literal “Homem” foi mantido apesar de sua relativa aspereza, pois essa aspereza pertence ao tom da resposta. A pontuação direta preserva o ritmo rápido da narrativa.
