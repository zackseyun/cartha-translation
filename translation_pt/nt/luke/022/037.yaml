base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: pt
  text: 'Pois eu lhes digo que isto que está escrito deve cumprir-se em mim: “E ele foi contado entre os que vivem sem lei”. Pois o que diz respeito a mim está chegando ao fim.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais tradicional: “E ele foi contado entre os transgressores” (Is 53:12).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o que diz respeito a mim está chegando a seu cumprimento” ou “tem cumprimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: Mantém a conexão explicativa de γάρ e traduz λέγω com dativo de modo natural em português contemporâneo.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: isto que está escrito
  rationale: Preserva o demonstrativo e o particípio perfeito sem introduzir explicitamente o termo “Escritura”, ausente da expressão grega.
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: deve cumprir-se em mim
  rationale: “Deve” conserva a necessidade expressa por δεῖ; “cumprir-se” é apropriado para uma declaração escrita profética, e “em mim” mantém a forma de ἐν ἐμοί.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: E ele foi contado entre os que vivem sem lei
  rationale: “Foi contado entre” comunica naturalmente ἐλογίσθη μετὰ; a expressão “os que vivem sem lei” torna inteligível o sentido de ἄνομοι sem substituí-lo diretamente pelo termo tradicional “transgressores”.
- source_word: τὸ περὶ ἐμοῦ
  choice: o que diz respeito a mim
  rationale: Expressão idiomática e precisa para a construção articular, sem especificar além do texto aquilo que concerne a Jesus.
- source_word: τέλος ἔχει
  choice: está chegando ao seu cumprimento
  rationale: Expressa movimento para uma culminação ou realização, adequado ao contexto, sem reduzir τέλος apenas a término cronológico.
theological_decisions:
- issue: Formulação da citação de Isaías 53:12
  choice: E ele foi contado entre os que vivem sem lei
  alternative: E ele foi contado entre os transgressores
  rationale: A redação principal prioriza o sentido de ἀνόμων, enquanto a nota conserva a formulação tradicional reconhecível e a ligação intertextual com Isaías.
- issue: Sentido de τέλος ἔχει
  choice: está chegando ao seu cumprimento
  alternative: está chegando ao fim / tem cumprimento
  rationale: A expressão pode indicar fim, culminação ou cumprimento. A tradução principal preserva a ideia de processo rumo à realização no contexto da paixão, e a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a solenidade da declaração e a ambiguidade da cláusula final; as notas registram tanto a formulação tradicional da citação quanto as alternativas de τέλος ἔχει.
