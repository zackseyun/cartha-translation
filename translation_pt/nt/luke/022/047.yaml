source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: pt
  text: Enquanto ele ainda falava, eis que chegou uma multidão; e o chamado Judas, um dos Doze, ia à frente deles[a] e aproximou-se de Jesus para beijá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os conduzia” ou “ia adiante deles”.'
    reason: 'Registra alternativas contextualmente possíveis para προήρχετο αὐτούς: liderança do grupo ou movimento à frente dele, sem impor a primeira no texto principal.'
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: Reproduz naturalmente a construção temporal com genitivo absoluto e conserva a ação em andamento expressa por ἔτι e pelo particípio presente.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém o marcador discursivo que chama a atenção para a chegada repentina da multidão, em linguagem narrativa digna e reconhecível em português.
- source_word: ὄχλος
  choice: chegou uma multidão
  rationale: “Multidão” corresponde diretamente a ὄχλος; “chegou” é suprido para formar uma oração natural e explicitar apenas o movimento já indicado pelo contexto.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: O chamado Judas
  rationale: Conserva a forma identificadora do particípio sem acrescentar conotação depreciativa, como poderia ocorrer com “o assim chamado”.
- source_word: εἷς τῶν δώδεκα
  choice: um dos Doze
  rationale: É a formulação portuguesa corrente e preserva a identificação de Judas como integrante do grupo apostólico.
- source_word: προήρχετο αὐτούς
  choice: ia à frente deles
  rationale: Preserva o aspecto contínuo do imperfeito e o sentido básico de avançar diante do grupo, sem afirmar de modo excessivo que Judas exercia liderança formal.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: aproximou-se de Jesus
  rationale: Expressa de modo natural e preciso o movimento de aproximação indicado pelo aoristo de ἐγγίζω.
- source_word: φιλῆσαι αὐτόν
  choice: para beijá-lo
  rationale: Mantém o sentido direto do infinitivo de finalidade, sem inserir no texto principal a explicação de que o beijo funcionava como saudação ou sinal.
theological_decisions:
- issue: Caracterização narrativa da ação de Judas
  choice: Descrever diretamente sua aproximação e intenção de beijar Jesus, sem acrescentar “traí-lo”.
  alternative: “para traí-lo com um beijo”
  rationale: Embora o contexto deixe clara a traição, este versículo descreve a aproximação e o beijo. Não se deve tornar explícita no texto uma interpretação que o grego não verbaliza aqui.
- issue: Papel de Judas diante da multidão
  choice: “ia à frente deles”
  alternative: “os conduzia”
  rationale: O contexto admite que Judas estivesse conduzindo o grupo, mas a expressão grega também pode simplesmente retratá-lo avançando à frente. A redação principal preserva essa amplitude, e a possibilidade de liderança é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva a vivacidade marcada do relato; “Doze” recebe inicial maiúscula por funcionar como designação reconhecível do grupo. A pontuação divide o período longo para facilitar a leitura sem alterar a sequência narrativa.
