- source_word: οὐ μὴ
  choice: de modo nenhum
  rationale: Preserva a forte negação enfática da construção grega sem a enfraquecer a uma simples negação futura.
- source_word: ἀποκριθῆτε
  choice: me responderão
  rationale: O verbo significa responder; «me» torna explícito em português o destinatário da resposta, recuperável do contexto.
