id: LUK.22.27
reference: Luke 22:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: pt
  text: 'Pois quem é maior: quem está reclinado à mesa[a] ou quem serve? Não é quem está reclinado à mesa? Eu, porém, estou entre vocês como quem serve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naquele tempo, era costume que os participantes de um banquete comessem reclinados, enquanto outros os serviam.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Pois quem é maior
  rationale: Mantém a pergunta comparativa e a função explicativa de γάρ em relação ao contexto anterior, sem interpretar μείζων de modo mais específico como “mais importante”.
- source_word: ὁ ἀνακείμενος
  choice: quem está reclinado à mesa
  rationale: No contexto de uma refeição, ἀνάκειμαι descreve o costume antigo de comer reclinado. A explicitação “à mesa” torna a cena compreensível em português atual.
- source_word: ὁ διακονῶν
  choice: quem serve
  rationale: O particípio presente indica a pessoa que está servindo, em contraste com o comensal. A forma verbal evita tanto um título eclesiástico quanto a ideia mais forte de escravidão.
- source_word: οὐχὶ ὁ ἀνακείμενος
  choice: Não é quem está reclinado à mesa?
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e repete o contraste da frase anterior.
- source_word: ἐγὼ δὲ
  choice: Eu, porém
  rationale: Expressa com clareza o contraste entre a expectativa social comum e a conduta de Jesus.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: estou entre vocês
  rationale: Equivalente natural e atual da expressão grega de presença no meio de um grupo, com ampla legibilidade brasileira.
- source_word: ὡς ὁ διακονῶν
  choice: como quem serve
  rationale: Conserva a ideia de maneira ou comparação expressa por ὡς e a forma participial, sem transformar a expressão em um substantivo de condição.
theological_decisions:
- issue: Descrição do serviço de Jesus
  choice: Eu, porém, estou entre vocês como quem serve.
  alternative: Eu, porém, estou entre vocês como servo.
  rationale: O grego emprega o particípio διακονῶν, não um substantivo como δοῦλος. “Como quem serve” preserva a ação no cenário da refeição e a humildade cristológica sem acrescentar uma noção lexical de escravidão.
translation_notes:
  register: Português moderno, digno e direto, com escolha de “vocês” para legibilidade brasileira e compreensão internacional. A repetição de “reclinado à mesa” acompanha a estrutura retórica do grego; a nota explica o costume antigo sem substituir a imagem do texto.
