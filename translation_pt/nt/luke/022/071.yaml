  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: pt
  text: 'Então eles disseram: “Por que ainda precisamos de testemunho? Pois nós mesmos ouvimos isso da própria boca dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Então eles disseram
  rationale: δέ é um conectivo leve que faz a narrativa avançar; “Então” expressa naturalmente a sequência sem impor forte contraste.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Por que ainda precisamos de testemunho?
  rationale: A construção χρείαν ἔχειν significa “precisar”, e τί ἔτι forma aqui uma pergunta retórica que em português corrente se expressa naturalmente por “Por que ainda...?”. μαρτυρία mantém o sentido judicial de “testemunho”.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: Pois nós mesmos ouvimos
  rationale: “Pois” preserva a função explicativa de γάρ, e “nós mesmos” conserva a ênfase de αὐτοί no fato de que eles ouviram pessoalmente.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: da própria boca dele
  rationale: A expressão comunica que ouviram diretamente de Jesus. “Da própria boca dele” é idiomático e reforça essa procedência direta, em consonância com a ênfase contextual.
theological_decisions:
- issue: Explicitar o conteúdo que eles ouviram como uma alegação ou confissão de Jesus
  choice: Manter apenas “ouvimos isso”, sem caracterizar o conteúdo como alegação, confissão ou testemunho
  alternative: “ouvimos o testemunho da boca dele” ou “ouvimos a alegação da própria boca dele”
  rationale: O grego não apresenta objeto expresso de ἠκούσαμεν. O pronome “isso”, exigido pela fluência do português, remete de modo neutro à fala anterior sem definir teologicamente ou juridicamente sua natureza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e a força retórica do grego são preservadas sem literalismo rígido.
