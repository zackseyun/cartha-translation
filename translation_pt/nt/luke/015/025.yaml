source:
  edition: SBLGNT
  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: pt
  text: O seu filho mais velho estava no campo. Quando se aproximava da casa, ouviu música e danças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “música instrumental e grupos de dançarinos”. Os termos gregos podem referir-se mais especificamente à execução musical e a grupos que dançavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: estava
  rationale: δέ marca aqui a transição narrativa; em português, a mudança de foco é natural sem um conectivo explícito, evitando acrescentar um sentido temporal ou adversativo forte.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: o filho mais velho dele
  rationale: πρεσβύτερος é comparativo, “mais velho”, e não exige o superlativo “mais velho de todos”; a formulação mantém o contraste com o filho mais novo.
- source_word: ἐν ἀγρῷ
  choice: no campo
  rationale: ἀγρός designa campo ou terra agrícola; “no campo” é direto e idiomático.
- source_word: ὡς ἐρχόμενος
  choice: quando vinha de volta
  rationale: A construção participial apresenta a circunstância simultânea da aproximação. “Vinha de volta” é natural no contexto do filho que retorna do campo, sem afirmar que já havia chegado.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: se aproximou da casa
  rationale: ἐγγίζω significa chegar perto ou aproximar-se; a expressão portuguesa preserva o movimento em direção à casa.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: O aoristo narrativo é adequadamente expresso pelo pretérito perfeito simples.
- source_word: συμφωνίας
  choice: música
  rationale: συμφωνία pode indicar música ou som musical, possivelmente instrumental; “música” é claro e evita o anacronismo de “sinfonia”.
- source_word: χορῶν
  choice: danças
  rationale: χορός pode indicar dança ou grupo de dançarinos. “Danças” combina naturalmente com “música” e conserva no texto a leitura do evento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases favorece a fluência narrativa. O marcador da nota foi colocado após a expressão cuja ambiguidade lexical explica.
