lexical_decisions:
- source_word: Εἶπεν
  choice: ele disse
  rationale: O aoristo de λέγω introduz a continuação do discurso de Jesus; o pretérito perfeito é a forma narrativa natural em português.
- source_word: δέ
  choice: Então
  rationale: A partícula marca uma continuação ou transição leve; “Então” mantém o fluxo do discurso sem sugerir contraste forte.
- source_word: Ἄνθρωπός τις
  choice: Certo homem
  rationale: “Certo homem” representa naturalmente o indefinido τις e introduz uma personagem não identificada, mas levemente particularizada.
- source_word: εἶχεν
  choice: tinha
  rationale: O imperfeito de ἔχω apresenta a circunstância de fundo da parábola; “tinha” preserva adequadamente esse aspecto.
- source_word: δύο
  choice: dois
  rationale: Correspondência direta do numeral cardinal.
- source_word: υἱούς
  choice: filhos
  rationale: Neste contexto, υἱούς se refere especificamente a descendentes do sexo masculino; “filhos” preserva esse dado central da parábola.
theological_decisions:
- issue: Força genérica ou particularizante de Ἄνθρωπός τις
  choice: Certo homem
  alternative: Um homem
  rationale: A formulação conserva a leve particularização comunicada por τις sem acrescentar simbolismo ou identificação alegórica.
