base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: pt
  text: 'Mas ele lhe disse: “Filho[a], você está sempre comigo, e tudo o que é meu é seu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “Filho” também pode significar “criança” e é aqui uma forma carinhosa de tratamento familiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Filho
  rationale: No vocativo, τέκνον é uma forma afetuosa de tratamento familiar. Em português, “Filho” é natural na fala de um pai a seu filho adulto e preserva a ternura do termo sem recorrer ao pouco idiomático “Criança”.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente direto, claro e natural, que expressa a permanência da convivência.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: μετά com o genitivo indica associação ou companhia; “comigo” reproduz isso de modo conciso e idiomático.
- source_word: πάντα τὰ ἐμὰ
  choice: tudo o que é meu
  rationale: A expressão neutra e abrangente inclui tudo o que pertence ao pai, sem restringi-la explicitamente a bens ou herança.
- source_word: σά ἐστιν
  choice: é seu
  rationale: Mantém a construção ampla do grego e não define além do texto se a afirmação é jurídica, patrimonial ou relacional.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Mas ele lhe disse
  rationale: δέ introduz aqui uma resposta em contraste moderado com a queixa anterior; “Mas” torna essa relação discursiva clara em português.
theological_decisions:
- issue: Forma de tratamento familiar na resposta do pai
  choice: Traduzir τέκνον por “Filho”
  alternative: “Meu filho” ou “Criança”
  rationale: “Filho” comunica naturalmente em português tanto a relação quanto o afeto. “Meu filho” seria idiomático, mas acrescentaria um possessivo ausente no grego; “Criança” preservaria um sentido lexical possível, porém soaria inadequado como tratamento dirigido ao filho adulto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O pronome “você” mantém a fala direta acessível; a formulação evita explicitar no corpo do texto nuances patrimoniais ou teológicas que o grego deixa abertas.
