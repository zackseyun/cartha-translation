  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: pt
  text: 'Mas, caindo em si[a], ele disse: ‘Quantos trabalhadores contratados de meu pai têm pão de sobra[b], enquanto eu aqui estou morrendo de fome[c]!’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltando a si”. A expressão grega diz literalmente “vindo a si mesmo” e também pode ter o sentido de “recobrando o juízo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “têm pão mais que suficiente”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “estou perecendo de fome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: caindo em si
  rationale: Expressão idiomática natural em português que preserva a imagem grega de voltar a si e indica a recuperação da percepção lúcida da própria situação.
- source_word: ἔφη
  choice: ele disse
  rationale: O aoristo narrativo é expresso naturalmente pelo pretérito perfeito em português.
- source_word: μίσθιοι
  choice: trabalhadores contratados
  rationale: Designa trabalhadores assalariados, distinguindo-os dos escravos ou servos pertencentes à casa.
- source_word: περισσεύονται ἄρτων
  choice: têm pão de sobra
  rationale: Transmite de modo claro e natural a abundância ou excedente indicado pelo verbo e pelo genitivo.
- source_word: ἄρτων
  choice: pão
  rationale: Mantém o termo concreto do grego, sem generalizá-lo para 'comida'.
- source_word: λιμῷ
  choice: de fome
  rationale: Neste contexto, o substantivo indica fome ou inanição; a construção causal 'morrer de fome' é idiomática em português.
- source_word: ὧδε
  choice: aqui
  rationale: Marca a situação presente e miserável do filho, em contraste com a fartura dos trabalhadores do pai.
- source_word: ἀπόλλυμαι
  choice: estou morrendo
  rationale: O presente comunica um processo em curso, e 'estou morrendo' expressa naturalmente a gravidade de sua condição sem atenuá-la.
