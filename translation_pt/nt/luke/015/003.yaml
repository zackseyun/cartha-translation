lexical_decisions:
- source_word: εἶπεν
  choice: contou
  rationale: O aoristo de λέγω introduz um discurso; com «parábola» como objeto, «contou» é natural em português e preserva o ato de narrá-la.
- source_word: δὲ
  choice: Então
  rationale: δὲ funciona aqui como conectivo narrativo suave. «Então» liga a resposta de Jesus à murmuração anterior sem criar um contraste forte.
- source_word: πρὸς αὐτοὺς
  choice: lhes
  rationale: πρός com acusativo identifica os destinatários. O pronome indireto «lhes» expressa isso de modo idiomático e claro.
- source_word: τὴν παραβολὴν ταύτην
  choice: esta parábola
  rationale: «Parábola» é o termo estabelecido e contextualmente adequado para παραβολή nos Sinóticos; «esta» reproduz o demonstrativo ταύτην.
- source_word: λέγων
  choice: 'dizendo:'
  rationale: O particípio introduz o conteúdo que vem a seguir. «Dizendo:» mantém a estrutura do grego e prepara naturalmente a fala direta.
