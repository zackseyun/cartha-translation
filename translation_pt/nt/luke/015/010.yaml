id: LUK.15.10
reference: Luke 15:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: pt
  text: 'Assim[a], eu lhes digo: há alegria diante dos anjos de Deus por um só pecador que se arrepende.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Do mesmo modo” ou “Dessa maneira”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “diante dos anjos de Deus” não diz explicitamente que sejam os próprios anjos que se alegram.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Retoma e aplica a comparação da parábola anterior de modo natural e conciso; a nota registra uma alternativa que explicita a relação comparativa.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Fórmula discursiva direta e idiomática em português moderno, preservando o endereço plural.
- source_word: γίνεται χαρά
  choice: há alegria
  rationale: Expressa naturalmente a ocorrência ou existência da alegria, sem reproduzir de modo rígido o valor de γίνομαι.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Preserva a ideia espacial ou relacional de presença sem identificar explicitamente os anjos como agentes da alegria.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: dos anjos de Deus
  rationale: Reproduz com clareza a construção genitiva e mantém uma formulação bíblica natural.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: por um só pecador
  rationale: Indica a pessoa que ocasiona a alegria; “um só” realça o numeral ἑνί sem sugerir que seja o único pecador.
- source_word: μετανοοῦντι
  choice: que se arrepende
  rationale: A oração relativa preserva o valor verbal do particípio presente e emprega o termo bíblico corrente sem ampliar sua definição teológica.
theological_decisions:
- issue: Sentido da linguagem de arrependimento
  choice: que se arrepende
  alternative: que muda de mente; que volta atrás
  rationale: O versículo não define nem desenvolve o arrependimento. A tradução mantém a amplitude do termo bíblico sem reduzi-lo a uma explicação específica.
- issue: Agente ou localização da alegria
  choice: há alegria diante dos anjos de Deus
  alternative: os anjos de Deus se alegram; há alegria entre os anjos de Deus
  rationale: O grego situa a alegria “diante dos anjos de Deus”, mas não declara explicitamente que eles sejam os que se alegram. A redação preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim” evita peso desnecessário; “eu lhes digo” mantém a solenidade conversacional. Os dois marcadores aparecem no texto principal.
