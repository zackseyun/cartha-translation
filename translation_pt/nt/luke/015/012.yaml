id: LUK.15.12
reference: Luke 15:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: pt
  text: 'E o mais novo deles disse ao pai: “Pai, dê-me a parte dos bens que me cabe[a]”. Então ele repartiu entre eles os recursos de que vivia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a porção dos bens que me pertence” ou “a parte que me é devida”.
    reason: lexical_alternative
  - marker: b
    text: O grego usa βίον, literalmente “vida” ou “meios de vida”, referindo-se aqui aos bens ou recursos que sustentavam o pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: o mais novo
  rationale: O comparativo substantivado significa literalmente “o mais novo [deles]”. O contexto deixa claro que se trata de um filho, mas o substantivo não aparece neste versículo.
- source_word: δός μοι
  choice: dê-me
  rationale: Traduz diretamente o imperativo aoristo com o pronome no dativo, em português atual e respeitoso na fala dirigida ao pai.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: a parte ... que me cabe
  rationale: A expressão indica a porção que corresponde ou é devida à pessoa; “que me cabe” conserva essa noção de direito sem excessivo juridicismo.
- source_word: οὐσία
  choice: bens
  rationale: No contexto da herança, refere-se ao patrimônio ou às posses. “Bens” é natural em português e apropriado ao contexto familiar e patrimonial.
- source_word: διεῖλεν
  choice: repartiu
  rationale: Expressa a divisão ou distribuição dos bens; “repartiu” é direto e idiomático neste contexto.
- source_word: αὐτοῖς
  choice: entre eles
  rationale: Embora a forma grega seja dativa plural, o ato é uma divisão destinada aos dois; “entre eles” transmite naturalmente essa relação distributiva.
- source_word: βίον
  choice: os recursos de que vivia
  rationale: βίος pode indicar vida, sustento ou meios de subsistência. Aqui designa aquilo de que o pai vivia, isto é, suas posses ou recursos, preservando a nuance sem sugerir apenas renda.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação preserva a distinção lexical entre οὐσία (“bens”) e βίος (“recursos de que vivia”), bem como o fato de o grego dizer apenas “o mais novo”, sem explicitar novamente “filho”.
