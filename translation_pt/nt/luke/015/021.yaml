id: LUK.15.21
reference: Luke 15:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: pt
  text: 'Mas o filho lhe disse: “Pai, pequei contra o céu[a] e diante de ti. Já não sou digno de ser chamado teu filho.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega “contra o céu” usa “céu” como maneira reverencial de se referir a Deus; algumas traduções vertem de modo interpretativo: “contra Deus”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos prolongam a fala do filho com palavras equivalentes a “Trata-me como um dos teus trabalhadores contratados”, em conformidade com o versículo 19; o texto da SBLGNT encerra a frase em “teu filho”.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: Mas o filho lhe disse
  rationale: δέ é um conectivo leve; “Mas” assinala de modo natural a retomada contrastante da fala do filho após a ação do pai. “Lhe disse” conserva αὐτῷ sem substituir o pronome por uma explicação.
- source_word: Πάτερ
  choice: Pai
  rationale: O vocativo é traduzido diretamente, sem acrescentar o possessivo “meu”, ausente do grego.
- source_word: ἥμαρτον
  choice: pequei
  rationale: O aoristo expressa aqui a confissão direta de uma culpa consumada; o pretérito perfeito é a forma portuguesa natural.
- source_word: εἰς τὸν οὐρανὸν
  choice: contra o céu
  rationale: Preserva a formulação grega e sua ambiguidade reverencial, em vez de explicitar “contra Deus” no texto principal.
- source_word: καὶ ἐνώπιόν σου
  choice: e diante de ti
  rationale: Mantém o sentido básico de ἐνώπιον, “na presença de, diante de”, sem reduzi-lo ao mais interpretativo “contra ti”.
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: Já não sou digno
  rationale: “Já não” traduz οὐκέτι com naturalidade, e “digno” preserva o sentido moral e relacional de ἄξιος.
- source_word: κληθῆναι υἱός σου
  choice: de ser chamado teu filho
  rationale: Reproduz o infinitivo passivo e conserva a relação filial expressa pelo predicativo com possessivo.
theological_decisions:
- issue: Sentido de “céu” na confissão
  choice: Manter “contra o céu” no texto principal como circunlóquio reverencial que alude a Deus.
  alternative: Traduzir interpretativamente como “contra Deus”.
  rationale: O grego diz literalmente “contra o céu”. Preservar a expressão mantém a forma judaica reverencial e evita resolver no texto uma implicação que pode ser esclarecida em nota.
- issue: Extensão da fala do filho
  choice: Encerrar a fala em “teu filho”, conforme o texto da SBLGNT fornecido.
  alternative: Acrescentar “Trata-me como um dos teus trabalhadores contratados”, leitura presente em alguns manuscritos e semelhante a Lucas 15:19.
  rationale: A tradução segue o texto-fonte adotado; a leitura mais longa é relevante, mas deve permanecer na nota textual.
translation_notes:
  register: Português moderno, digno e acessível, com ampla inteligibilidade internacional e leitura natural no Brasil. O uso de “ti/teu” sustenta o tom familiar e solene sem arcaísmo excessivo; a sintaxe permanece simples e oral, adequada à fala direta.
