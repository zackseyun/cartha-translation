id: LUK.15.22
reference: Luke 15:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his slaves[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: pt
  text: 'Mas o pai disse aos seus escravos[a]: “Depressa! Tragam a melhor veste[b] e vistam-no com ela. Ponham-lhe um anel[c] na mão e sandálias nos pés.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O grego doulous designa escravos ou servos vinculados à casa; “escravos” preserva aqui essa realidade social.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “a primeira veste”; no contexto, provavelmente a melhor ou a principal veste.
    reason: lexical_alternative
  - marker: c
    text: O grego diz apenas “um anel”. Alguns o entendem como um anel de sinete, sinal de posição restaurada.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: escravos
  rationale: O termo designa pessoas em condição de escravidão ou servidão vinculada. “Escravos” preserva a realidade social da casa retratada na parábola; a alternativa tradicional “servos” é indicada em nota.
- source_word: Ταχὺ
  choice: Depressa!
  rationale: O advérbio transmite urgência. Como ordem breve e enfática, “Depressa!” é natural e claro em português atual.
- source_word: ἐξενέγκατε
  choice: Tragam
  rationale: No contexto, o verbo manda trazer para fora algo guardado na casa. Em português, “tragam” comunica naturalmente o movimento relevante sem expressão pesada.
- source_word: στολὴν τὴν πρώτην
  choice: a melhor veste
  rationale: Embora πρῶτος possa significar “primeiro”, nesta construção provavelmente indica a veste principal, de maior qualidade ou distinção. “A melhor veste” expressa esse sentido idiomático sem acrescentar simbolismo.
- source_word: ἐνδύσατε αὐτόν
  choice: vistam-no com ela
  rationale: A expressão significa vestir alguém. O pronome “ela” retoma claramente “veste” e mantém concreta a ação ordenada.
- source_word: δακτύλιον
  choice: um anel
  rationale: O substantivo especifica apenas um anel. Não se acrescenta “de sinete”, pois essa identificação, embora possível, não está expressa no grego.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: na mão
  rationale: Com um objeto de adorno, “na mão” é a formulação idiomática em português para o sentido contextual de εἰς.
- source_word: ὑποδήματα
  choice: sandálias
  rationale: O termo se refere a calçados e, no contexto do Mediterrâneo antigo, “sandálias” é uma representação historicamente adequada e compreensível.
- source_word: εἰς τοὺς πόδας
  choice: nos pés
  rationale: A preposição é vertida segundo o uso natural do português para calçados colocados nos pés.
- source_word: δὲ
  choice: Mas
  rationale: Aqui δέ marca a transição contrastante entre a fala do filho e a resposta ativa do pai. “Mas” torna clara essa virada narrativa.
theological_decisions:
- issue: Traduzir δούλους como “escravos” ou “servos”
  choice: escravos
  alternative: servos
  rationale: “Escravos” conserva a condição social implicada pelo termo grego no ambiente doméstico da parábola, sem transformar essa descrição histórica em afirmação doutrinária.
- issue: Entender πρῶτην literalmente como “primeira” ou idiomaticamente como “melhor”
  choice: a melhor veste
  alternative: a primeira veste
  rationale: No contexto, a expressão provavelmente se refere à veste principal ou de maior distinção, e não à primeira em ordem. A nota preserva a forma literal e a ambiguidade lexical.
- issue: Especificar δακτύλιον como anel de sinete
  choice: um anel
  alternative: um anel de sinete
  rationale: O texto pode sugerir restauração de posição, mas não identifica o tipo de anel. A tradução evita incorporar essa interpretação à narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O diálogo usa imperativos naturais no plural e mantém a urgência do pai. “Veste” foi preferido a “roupa” por conservar o caráter de uma peça específica sem soar excessivamente arcaico.
