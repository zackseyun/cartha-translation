source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: pt
  text: 'Ele lhe respondeu: “Seu irmão chegou, e seu pai abateu o bezerro cevado, porque o recebeu de volta são e salvo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com saúde”. O particípio grego ὑγιαίνοντα pode significar “estando saudável” ou, neste contexto, de modo mais amplo, “são e salvo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: chegou
  rationale: O verbo indica que o irmão chegou e agora está presente; “chegou” expressa isso de modo natural no contexto.
- source_word: ἔθυσεν
  choice: abateu
  rationale: No contexto do banquete, refere-se ao abate do animal para a refeição; “abateu” é preciso sem sugerir necessariamente um sacrifício cultual.
- source_word: μόσχον τὸν σιτευτόν
  choice: o bezerro cevado
  rationale: Expressão portuguesa tradicional e ainda clara para o animal especialmente engordado e reservado para uma celebração.
- source_word: ὑγιαίνοντα
  choice: são e salvo
  rationale: O particípio pode indicar boa saúde ou, de modo mais amplo neste contexto, que ele voltou bem e em segurança; “são e salvo” preserva essa amplitude.
- source_word: ἀπέλαβεν
  choice: o recebeu de volta
  rationale: Mantém a ideia de recuperar ou acolher novamente alguém que estava ausente.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'Ele lhe respondeu:'
  rationale: O contexto é uma resposta à pergunta do filho mais velho; os dois-pontos introduzem naturalmente o discurso direto, sem reproduzir de forma rígida o ὅτι.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Bezerro cevado” conserva a imagem cultural do texto, e “são e salvo” comunica naturalmente tanto o bem-estar físico quanto o retorno em segurança.
