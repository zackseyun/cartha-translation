  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: pt
  text: Ou que mulher, tendo dez dracmas[a], se perder uma delas, não acende uma lamparina, varre a casa e procura com cuidado até encontrá-la?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A dracma era uma moeda grega de prata.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Ou
  rationale: Introduz esta ilustração como alternativa paralela à anterior e preserva a ligação do discurso.
- source_word: τίς γυνὴ
  choice: qual é a mulher que
  rationale: Forma idiomática em português para uma pergunta retórica, sem acrescentar «entre vocês», ausente do grego.
- source_word: δραχμὰς ... δραχμὴν μίαν
  choice: dez dracmas ... uma
  rationale: Mantém a especificidade histórica da moeda; na segunda ocorrência, «uma» evita repetição desnecessária sem perder o referente.
- source_word: ἐὰν ἀπολέσῃ
  choice: se perder
  rationale: Expressa naturalmente a condição geral indicada por ἐάν com o subjuntivo aoristo.
- source_word: οὐχὶ
  choice: não
  rationale: Preserva a pergunta retórica que espera resposta afirmativa.
- source_word: ἅπτει λύχνον
  choice: acende uma lamparina
  rationale: «Lamparina» comunica um pequeno utensílio doméstico alimentado por óleo com mais precisão histórica do que a moderna «lâmpada».
- source_word: σαροῖ τὴν οἰκίαν
  choice: varre a casa
  rationale: Tradução direta, concreta e natural da ação doméstica.
- source_word: ζητεῖ ἐπιμελῶς
  choice: procura com cuidado
  rationale: Expressa o sentido de busca cuidadosa ou diligente em linguagem corrente, preservando a nuance sem intensificá-la indevidamente.
- source_word: ἕως οὗ εὕρῃ
  choice: até encontrá-la
  rationale: Indica o ponto final da busca e explicita por meio do pronome o objeto já mencionado.
theological_decisions: []
