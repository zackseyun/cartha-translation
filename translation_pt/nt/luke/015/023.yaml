  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: pt
  text: E tragam o bezerro engordado, matem-no[a], e comamos e celebremos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido como “matem-no” também pode significar “sacrifiquem-no” e, em alguns contextos, traz conotações sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: tragam
  rationale: O imperativo plural é vertido naturalmente por “tragam”; o contexto já indica que o animal deve ser trazido até o pai e seus servos.
- source_word: μόσχον τὸν σιτευτόν
  choice: o bezerro engordado
  rationale: “Bezerro” expressa o bovino jovem, e “engordado” indica que foi alimentado especialmente, preservando sua associação com uma ocasião festiva.
- source_word: θύσατε
  choice: matem-no
  rationale: No contexto da preparação de um banquete, o verbo indica matar o animal. Esta formulação clara evita impor um sentido cultual explícito, embora esse valor seja possível em outros contextos.
- source_word: φαγόντες
  choice: comendo
  rationale: O particípio aoristo está subordinado ao convite expresso pelo subjuntivo seguinte. “Comendo, celebremos” preserva de modo natural a ligação entre a refeição e a celebração sem tornar rígida a sequência temporal.
- source_word: εὐφρανθῶμεν
  choice: celebremos
  rationale: O subjuntivo exortativo na primeira pessoa do plural convida todos a participar da alegria; “celebremos” é atual e se ajusta ao cenário do banquete.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: A repetição de “e” conserva o movimento cumulativo das ordens e do convite final.
theological_decisions:
- issue: Possível nuance sacrificial de θύσατε
  choice: Traduzir como “matem-no”, no sentido imediato de preparar o animal para a refeição.
  alternative: “sacrifiquem-no” ou “abatam-no”
  rationale: Embora θύω possa designar o abate sacrificial, a narrativa focaliza a preparação de uma festa doméstica. “Sacrifiquem-no” introduziria uma conotação cultual não exigida pelo contexto; a nota registra a amplitude lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Matem-no” é mais direto e comum que “abatam-no”; a construção “comendo, celebremos” preserva a forma participial e a relação entre comer e celebrar.
