id: LUK.15.24
reference: Luke 15:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: pt
  text: porque este meu filho estava morto e voltou à vida[a]; estava perdido e foi encontrado[b]. E começaram a celebrar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou a viver”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi achado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz naturalmente, em português moderno, a razão dada pelo pai para a celebração.
- source_word: οὗτος ὁ υἱός μου
  choice: este meu filho
  rationale: Preserva a ênfase demonstrativa de οὗτος e mantém uma formulação portuguesa natural e afetiva.
- source_word: νεκρὸς ἦν
  choice: estava morto
  rationale: Expressa o estado passado indicado pelo imperfeito sem suavizar a forte imagem de morte empregada na parábola.
- source_word: ἀνέζησεν
  choice: voltou à vida
  rationale: Traduz de maneira clara e corrente a ideia de viver novamente, formando contraste direto com “estava morto”.
- source_word: ἦν ἀπολωλὼς
  choice: estava perdido
  rationale: Mantém o motivo de perdido e encontrado que estrutura o capítulo e representa adequadamente o estado anterior.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Preserva a voz passiva e não identifica um agente, mantendo a abertura do texto grego.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: começaram a celebrar
  rationale: Conserva o aspecto ingressivo de ἤρξαντο e comunica naturalmente a alegria festiva do banquete.
theological_decisions:
- issue: Força metafórica de “morto” e “voltou à vida” na parábola
  choice: Manter sem explicação a linguagem direta de morte e retorno à vida.
  alternative: Parafrasear como “era como se estivesse morto e foi restaurado espiritual ou socialmente”.
  rationale: Embora a linguagem funcione metaforicamente no enredo, o texto usa deliberadamente o contraste forte entre morte e vida; explicitá-lo interpretativamente eliminaria uma tensão genuína.
- issue: Agente de εὑρέθη
  choice: Manter a construção passiva “foi encontrado”.
  alternative: Explicitar quem o encontrou, como “nós o encontramos” ou “Deus o encontrou”.
  rationale: O grego não nomeia o agente, e a tradução não deve introduzir uma identificação teológica que o versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Este meu filho” retém a ênfase do demonstrativo; “celebrar” comunica com naturalidade o júbilo festivo do contexto.
