  text: καὶ προσκαλεσάμενος ἕνα τῶν παίδων ἐπυνθάνετο τί ⸀ἂν εἴη ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/026.yaml
  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: pt
  text: Então chamou um dos servos e perguntou o que seria tudo aquilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que tudo aquilo poderia significar”. Mais literalmente, o grego diz: “o que seriam estas coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamou
  rationale: O particípio aoristo médio indica que ele chamou alguém para junto de si antes de perguntar. “Chamou” expressa com naturalidade a sequência da ação em português.
- source_word: παίδων
  choice: servos
  rationale: Embora παῖς também possa significar “criança” ou “filho”, o contexto doméstico e a função de informar sobre a celebração favorecem “servos”.
- source_word: ἐπυνθάνετο
  choice: perguntou
  rationale: O imperfeito de πυνθάνομαι descreve o ato de procurar informação. “Perguntou” é a forma idiomática em português, sem salientar indevidamente o aspecto contínuo.
- source_word: τί ἂν εἴη ταῦτα
  choice: o que seria tudo aquilo
  rationale: A formulação preserva a pergunta indireta, a nuance potencial de ἄν com o optativo e a referência plural de ταῦτα, ao mesmo tempo que soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. “Então” liga a ação ao contexto imediato sem acrescentar conteúdo causal; “tudo aquilo” comunica idiomaticamente o plural demonstrativo grego.
