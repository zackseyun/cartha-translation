  to: 'Mas ele respondeu a seu pai: “Olhe, há tantos anos trabalho como escravo[a] para o senhor e nunca desobedeci a nenhuma ordem sua; mesmo assim, o senhor nunca me deu sequer um cabrito para eu festejar com meus amigos.”'
