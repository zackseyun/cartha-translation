  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: pt
  text: 'Mas ele respondeu a seu pai: “Olhe, há tantos anos trabalho como escravo[a] para o senhor e nunca desobedeci a nenhuma ordem sua; mesmo assim, o senhor nunca me deu sequer um cabrito para eu festejar com meus amigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sirvo o senhor”. O verbo grego δουλεύω pode significar “servir” ou, em sentido mais forte, “trabalhar como escravo”. Aqui, a formulação mais forte reflete o tom amargo do filho mais velho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: respondeu ao pai
  rationale: A expressão grega idiomática é transmitida com naturalidade em português, sem a duplicação desnecessária de “respondendo, disse”.
- source_word: Ἰδοὺ
  choice: Olhe!
  rationale: Marcador enfático de atenção dirigido ao pai; “Olhe!” é atual e preserva a contundência da queixa.
- source_word: τοσαῦτα ἔτη δουλεύω σοι
  choice: Há tantos anos trabalho como escravo para o senhor
  rationale: A construção com “há” expressa duração até o presente. “Trabalho como escravo” conserva a força subordinativa de δουλεύω e o tom amargo do filho, sem afirmar que ele fosse juridicamente escravo.
- source_word: ἐντολήν σου παρῆλθον
  choice: desobedeci a uma ordem sua
  rationale: 'Nesse contexto, παρέρχομαι com ἐντολή significa violar ou deixar de cumprir uma ordem. O indefinido “uma” corresponde ao singular grego em uma declaração abrangente: ele afirma não ter desobedecido a ordem alguma.'
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: o senhor nunca me deu nem sequer um cabrito
  rationale: “Cabrito” designa com clareza um bode novo; “nem sequer” explicita a força minimizadora e contrastiva da reclamação.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: para eu festejar com os meus amigos
  rationale: A oração de finalidade e o sentido festivo de εὐφραίνω são expressos de modo natural e adequado ao contexto de banquete.
theological_decisions:
- issue: Força de δουλεύω na autodescrição do filho mais velho
  choice: trabalho como escravo para o senhor
  alternative: sirvo o senhor
  rationale: O verbo pode significar servir, mas pertence ao campo semântico da escravidão. Na fala ressentida do filho, a formulação mais forte preserva sua percepção amarga de submissão sem transformar a frase em uma afirmação doutrinária ou jurídica sobre sua condição.
- issue: Forma de tratamento do filho ao pai
  choice: o senhor / sua
  alternative: você / seu
  rationale: O grego não codifica essa distinção de tratamento. “O senhor” mantém uma fala portuguesa digna e natural dirigida ao pai e combina com a distância emocional perceptível na queixa, sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A fala é direta e ressentida, mas não coloquial em excesso. O marcador [a] aparece imediatamente após a expressão a que se refere.
