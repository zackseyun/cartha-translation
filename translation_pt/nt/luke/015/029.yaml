  source_fidelity: A tradução transmite adequadamente a resposta ressentida do filho mais velho, a duração expressa por τοσαῦτα ἔτη, a força enfática de Ἰδοὺ e a finalidade festiva. Contudo, «nunca desobedeci a uma ordem sua» pode ser entendido como referência a uma única ordem indefinida, quando a negação abrangente do grego requer «nenhuma ordem sua». O pronome em «seu pai» também deve ser preservado.
  naturalness: O registro é moderno, claro e apropriado. «Olhe» funciona como marcador de atenção; sem exclamação, integra-se mais naturalmente à fala contínua. «Há tantos anos trabalho como escravo para o senhor» preserva a queixa amarga, e a nota explica que não se trata necessariamente de uma declaração de condição jurídica.
  terminology: «Cabrito» é uma boa tradução de ἔριφος. «Trabalho como escravo» é uma opção forte, mas defensável no discurso ressentido do personagem, desde que a alternativa «sirvo o senhor» permaneça disponível em nota. A âncora da nota deve seguir a expressão traduzida de δουλεύω, não a forma de tratamento «o senhor».
  issues:
  - severity: medium
    issue: Escopo inadequadamente expresso em «nunca desobedeci a uma ordem sua».
    rationale: 'A construção portuguesa com «uma» pode sugerir uma ordem qualquer isolada. Οὐδέποτε ... ἐντολήν σου παρῆλθον é uma negativa abrangente: o filho afirma jamais ter violado qualquer ordem do pai. «Nenhuma ordem sua» comunica isso sem ambiguidade.'
  - severity: low
    issue: O possessivo αὐτοῦ não aparece em «respondeu ao pai».
    rationale: «Respondeu a seu pai» preserva explicitamente o referente presente no texto grego e continua natural em português.
  - severity: low
    issue: A âncora [a] está ligada a «o senhor», embora a nota trate de δουλεύω.
    rationale: A âncora deve ficar imediatamente após «trabalho como escravo», a expressão cuja alternativa lexical a nota documenta.
