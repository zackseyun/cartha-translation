source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: pt
  text: E desejava encher o estômago com as vagens de alfarroba que os porcos comiam[a], mas ninguém lhe dava nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vagens”; o termo grego refere-se especificamente às vagens da alfarrobeira, usadas com frequência como alimento para animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: desejava
  rationale: O imperfeito indica um desejo contínuo; “desejava” é natural e preserva a intensidade contextual sem exagerá-la.
- source_word: γεμίσαι
  choice: encher
  rationale: Mantém a imagem concreta do infinitivo grego, em vez de interpretá-lo como “saciar”.
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: o estômago
  rationale: No contexto da fome, κοιλία designa o estômago ou ventre; “estômago” é claro e corrente em português moderno.
- source_word: ἀπὸ τῶν κερατίων
  choice: com as vagens de alfarroba
  rationale: Embora ἀπό seja literalmente “de/a partir de”, “encher ... com” é a construção idiomática em português; κεράτια refere-se especificamente às vagens da alfarrobeira.
- source_word: οἱ χοῖροι
  choice: os porcos
  rationale: Equivalente contemporâneo, direto e amplamente compreensível de χοῖροι.
- source_word: ἤσθιον
  choice: comiam
  rationale: O imperfeito retrata a alimentação dos porcos como ação em curso ou habitual na cena; o imperfeito português preserva esse aspecto.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ninguém lhe dava nada
  rationale: O imperfeito comunica a persistência da falta de ajuda; “nada” explicita de modo idiomático o objeto subentendido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural tanto no Brasil quanto no uso internacional. “Vagens de alfarroba” oferece precisão lexical, enquanto a nota registra a alternativa mais genérica. A conjunção “mas” expressa naturalmente o contraste contextual de καί na oração final.
