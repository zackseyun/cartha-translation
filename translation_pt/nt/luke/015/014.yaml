  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: pt
  text: Mas, depois que ele gastou tudo, houve uma fome severa em toda aquela região, e ele começou a passar necessidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος δὲ αὐτοῦ πάντα
  choice: Mas, depois que ele gastou tudo
  rationale: O genitivo absoluto com particípio aoristo é expresso naturalmente por uma oração temporal. “Gastou” traduz δαπανάω sem acrescentar por si só a avaliação de “esbanjou”; “mas” marca a virada narrativa.
- source_word: ἐγένετο λιμὸς ἰσχυρὰ
  choice: houve uma fome severa
  rationale: Com λιμός, ἐγένετο indica o surgimento da fome. “Fome severa” expressa de modo atual e idiomático a intensidade indicada por ἰσχυρά.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: em toda aquela região
  rationale: κατά com acusativo pode indicar extensão por uma área. “Em toda” preserva essa abrangência, enquanto “região” é uma tradução natural de χώρα neste contexto.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: e ele começou a passar necessidade
  rationale: A construção inceptiva ἤρξατο com infinitivo marca o começo da privação. “Passar necessidade” é corrente em português e comunica ὑστερεῖσθαι sem artificialidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem narrativa e a mudança da abundância para a privação foram preservadas sem intensificação interpretativa.
