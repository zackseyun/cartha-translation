id: LUK.15.6
reference: Luke 15:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: pt
  text: 'E, quando chega em casa[a], reúne os amigos e os vizinhos e lhes diz: “Alegrem-se comigo[b], porque encontrei a minha ovelha que estava perdida[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “quando entra na casa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Comemorem comigo”. O verbo grego indica alegrar-se junto com alguém.
    reason: lexical_alternative
  - marker: c
    text: Ou “a minha ovelha perdida”. O grego diz literalmente “a minha ovelha, a que estava perdida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: quando chega em casa
  rationale: O particípio aoristo expressa uma ação anterior à ação principal e é naturalmente vertido como oração temporal. “Chega em casa” é idiomático em português e mantém a sequência narrativa; a nota registra a forma mais literal.
- source_word: συγκαλεῖ
  choice: reúne
  rationale: O verbo significa chamar pessoas para que se juntem. “Reúne” comunica isso com naturalidade, sem o tom autoritário que “convoca” poderia sugerir neste contexto festivo.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: os amigos e os vizinhos
  rationale: Equivalentes diretos e correntes para os dois grupos mencionados.
- source_word: λέγων αὐτοῖς
  choice: e lhes diz
  rationale: Transformar o particípio presente em verbo coordenado produz uma frase portuguesa fluente e preserva a ligação direta com o discurso seguinte.
- source_word: Συγχάρητέ μοι
  choice: Alegrem-se comigo
  rationale: Mantém tanto a ideia de alegria quanto seu caráter compartilhado, presente no verbo composto συγχαίρω.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão para o convite à alegria.
- source_word: εὗρον
  choice: encontrei
  rationale: O pretérito perfeito traduz naturalmente o aoristo e apresenta a descoberta como ação concluída com relevância no momento da fala.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: a minha ovelha que estava perdida
  rationale: Preserva a construção expansiva “minha ovelha, a que estava perdida” de modo natural e mantém o estado anterior expresso pelo particípio perfeito.
theological_decisions:
- issue: Imagem parabólica da recuperação
  choice: Manter a imagem concreta de “a minha ovelha que estava perdida”.
  alternative: Explicitar no versículo uma referência a pecadores, arrependimento ou salvação.
  rationale: O versículo ainda apresenta a narrativa da parábola; sua aplicação teológica aparece no contexto. A tradução não deve substituir a imagem por sua interpretação.
- issue: Força do convite à alegria compartilhada
  choice: Alegrem-se comigo
  alternative: Comemorem comigo
  rationale: “Alegrem-se comigo” preserva mais diretamente o campo semântico de χαίρω e a participação conjunta na alegria, sem acrescentar necessariamente a ideia de uma celebração organizada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi mantida, enquanto particípios gregos foram convertidos em construções verbais naturais em português. As notas preservam alternativas mais literais ou idiomáticas sem sobrecarregar o texto principal.
