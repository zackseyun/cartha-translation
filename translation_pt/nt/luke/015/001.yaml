  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: pt
  text: Todos os cobradores de impostos e os pecadores estavam se aproximando dele para ouvi-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se aproximavam dele”. A construção grega indica uma ação contínua ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: estavam
  rationale: O imperfeito de εἰμί integra a construção perifrástica de ação contínua no passado. δέ funciona como transição discursiva e não exige aqui um conectivo explícito em português.
- source_word: αὐτῷ ἐγγίζοντες
  choice: se aproximando dele
  rationale: A construção perifrástica ἦσαν + particípio presente sugere ação em curso ou repetida. “Estavam se aproximando” comunica naturalmente esse aspecto em português.
- source_word: πάντες
  choice: todos
  rationale: Preserva a ênfase na abrangência dos integrantes dos dois grupos mencionados.
- source_word: οἱ τελῶναι
  choice: os cobradores de impostos
  rationale: Designa os encarregados da cobrança de impostos e receitas; esta formulação é clara e corrente em português internacional com boa legibilidade brasileira.
- source_word: οἱ ἁμαρτωλοὶ
  choice: os pecadores
  rationale: Mantém a categoria substantivada do texto grego sem acrescentar uma caracterização moral ou social interpretativa.
- source_word: ἀκούειν αὐτοῦ
  choice: para ouvi-lo
  rationale: O infinitivo indica finalidade. “Para ouvi-lo” é conciso, natural e preserva a possibilidade de ouvir atentamente seu ensino sem explicitação adicional.
theological_decisions:
- issue: Força socioreligiosa de “cobradores de impostos e pecadores”
  choice: Manter as duas categorias lado a lado, sem expansão interpretativa.
  alternative: “cobradores de impostos e outros excluídos” ou “cobradores de impostos e pecadores notórios”
  rationale: O grego nomeia dois grupos reconhecíveis no contexto narrativo. Qualificá-los ou fundi-los importaria uma interpretação e reduziria a tensão presente no texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O pronome enclítico em “ouvi-lo” mantém fluidez e registro adequado; a nota preserva a nuance aspectual da construção grega.
