id: LUK.15.19
reference: Luke 15:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: pt
  text: Já não sou digno de ser chamado seu filho. Faça de mim alguém como um dos seus trabalhadores assalariados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “empregados” ou “trabalhadores contratados”. O termo grego se refere a trabalhadores pagos, não a escravos da casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa de modo natural em português a negação temporal e a mudança de condição indicada pelo grego.
- source_word: ἄξιος
  choice: digno
  rationale: Preserva o sentido moral e social de ser merecedor de determinada condição ou honra.
- source_word: κληθῆναι
  choice: ser chamado
  rationale: Mantém a forma passiva e a possibilidade de entender o verbo tanto como receber uma designação quanto como ser reconhecido nessa condição.
- source_word: υἱός
  choice: filho
  rationale: Conserva a referência masculina singular e a relação filial específica da parábola.
- source_word: ποίησόν με
  choice: Faça de mim alguém
  rationale: Reproduz o pedido causativo do imperativo grego em português natural, sem enfraquecê-lo para simplesmente 'trate-me'.
- source_word: ὡς
  choice: como
  rationale: Introduz a comparação pedida pelo filho sem afirmar necessariamente identidade plena de condição.
- source_word: ἕνα τῶν μισθίων σου
  choice: um dos seus trabalhadores contratados
  rationale: Comunica que se trata de trabalhadores remunerados, distinguindo-os dos escravos domésticos, em linguagem moderna e acessível.
theological_decisions:
- issue: Linguagem de condição no reconhecimento do filho
  choice: Manter “digno” e “filho”
  alternative: “Já não mereço ser chamado seu filho” ou “sua criança”
  rationale: A formulação preserva as dimensões relacional e social da declaração, sem reduzir ἄξιος a um mero sentimento subjetivo nem neutralizar a relação filial masculina indicada pelo texto.
- issue: Força do pedido ποίησόν με ὡς
  choice: “Faça de mim alguém como”
  alternative: “Trate-me como”
  rationale: A opção escolhida mantém a força causativa do pedido e a nuance comparativa de ὡς; a alternativa é mais idiomática, mas interpreta o pedido apenas em termos de tratamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Trabalhadores contratados” evita a ambiguidade de “servos” e mantém a distinção econômica do termo grego.
