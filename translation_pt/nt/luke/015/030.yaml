id: LUK.15.30
reference: Luke 15:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: pt
  text: Mas, quando chegou esse seu filho, que devorou o seu patrimônio[a] com prostitutas, o senhor abateu para ele o bezerro engordado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consumiu os seus meios de vida”. O verbo grego é vívido, literalmente “devorou”, e o substantivo pode significar meios de vida, bens ou patrimônio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mas, quando
  rationale: Preserva tanto o valor temporal de ὅτε quanto o contraste introduzido por δέ na queixa do filho mais velho.
- source_word: ὁ υἱός σου οὗτος
  choice: esse seu filho
  rationale: 'Mantém a força demonstrativa e o distanciamento depreciativo: ele evita dizer “meu irmão”.'
- source_word: ὁ καταφαγών σου τὸν βίον
  choice: que devorou o seu patrimônio
  rationale: “Devorou” conserva a imagem forte do verbo grego; “patrimônio” expressa naturalmente, no contexto, os bens ou recursos do pai.
- source_word: μετὰ πορνῶν
  choice: com prostitutas
  rationale: Tradução direta, atual e clara da acusação feita pelo filho mais velho.
- source_word: ἦλθεν
  choice: chegou
  rationale: O grego diz simplesmente que ele veio ou chegou; evita acrescentar explicitamente a ideia de retorno.
- source_word: ἔθυσας
  choice: abateu
  rationale: No contexto de um banquete, refere-se ao abate do animal, sem necessariamente sugerir um sacrifício cultual.
- source_word: τὸν σιτευτὸν μόσχον
  choice: o bezerro engordado
  rationale: Expressa com clareza o animal especialmente alimentado para uma refeição festiva.
- source_word: αὐτῷ
  choice: para ele
  rationale: 'Reproduz o dativo de benefício: o bezerro foi abatido em favor dele ou para homenageá-lo.'
theological_decisions:
- issue: Se a alegação sobre prostitutas deve ser apresentada como fato confirmado ou como acusação
  choice: Manter a acusação diretamente na fala, sem qualificadores
  alternative: “que supostamente devorou o seu patrimônio com prostitutas”
  rationale: O versículo registra a acusação do filho mais velho, não uma confirmação independente do narrador. A tradução direta preserva essa tensão narrativa sem validar nem enfraquecer expressamente a alegação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “O senhor” representa uma forma natural e respeitosa de um filho dirigir-se ao pai; “esse seu filho” preserva o tom emocionalmente distante da queixa.
