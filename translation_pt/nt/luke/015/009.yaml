id: LUK.15.9
reference: Luke 15:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: pt
  text: 'E, quando a encontra, reúne suas amigas e vizinhas e diz: “Alegrem-se comigo, pois encontrei a dracma[a] que eu havia perdido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A dracma era uma moeda grega de prata, equivalente, em muitos contextos, a aproximadamente um dia de salário de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: quando a encontra
  rationale: O particípio aoristo feminino expressa uma ação anterior à convocação; a oração temporal é natural em português. O pronome “a” retoma a dracma mencionada no contexto.
- source_word: συγκαλεῖ
  choice: reúne
  rationale: O presente histórico dá vivacidade à narrativa. “Reúne” transmite de modo corrente a ideia de chamar pessoas para junto de si.
- source_word: φίλας καὶ γείτονας
  choice: suas amigas e vizinhas
  rationale: O feminino de φίλας é preservado, e a coordenação contextual favorece entender também as vizinhas como mulheres. “Suas” explicita naturalmente a relação social sem alterar o sentido.
- source_word: λέγουσα
  choice: e diz
  rationale: A coordenação com verbo finito soa mais natural em português narrativo do que o gerúndio “dizendo”, preservando a introdução da fala direta.
- source_word: Συγχάρητέ μοι
  choice: Alegrem-se comigo
  rationale: Reproduz diretamente o imperativo plural e a noção de compartilhar a alegria.
- source_word: ὅτι
  choice: pois
  rationale: Introduz com clareza a razão do convite à alegria; “porque” também seria possível.
- source_word: εὗρον
  choice: encontrei
  rationale: O aoristo indicativo é adequadamente expresso pelo pretérito perfeito em português.
- source_word: δραχμὴν
  choice: dracma
  rationale: Mantém o nome específico da moeda antiga; uma nota cultural esclarece seu valor aproximado.
- source_word: ἣν ἀπώλεσα
  choice: que eu havia perdido
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a perda antecedeu o reencontro, sem mudar a relação temporal do grego.
