  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: pt
  text: E, quando a encontra[a], põe-na sobre os ombros, cheio de alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a ovelha perdida mencionada no contexto anterior.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: quando a encontra
  rationale: O particípio aoristo ativo indica uma ação anterior ou circunstancial em relação ao verbo principal. A oração temporal é natural em português; o pronome «a» retoma a ovelha perdida do contexto imediato.
- source_word: ἐπιτίθησιν
  choice: põe-na
  rationale: O presente do indicativo dá vivacidade à ação principal. «Põe» expressa de modo corrente o ato de colocar a ovelha sobre os ombros.
- source_word: ἐπὶ τοὺς ὤμους
  choice: sobre os ombros
  rationale: ἐπί com acusativo indica movimento ou colocação sobre algo. «Sobre os ombros» conserva o plural grego e é expressão natural em português.
- source_word: αὐτοῦ
  choice: '[possessivo implícito]'
  rationale: O genitivo refere-se aos ombros do pastor. Em português, o artigo definido em «sobre os ombros» exprime naturalmente a posse ligada a uma parte do corpo, evitando o potencialmente ambíguo «seus».
- source_word: χαίρων
  choice: cheio de alegria
  rationale: O particípio presente descreve a atitude concomitante do pastor. «Cheio de alegria» comunica com naturalidade o estado de regozijo sem reduzir a ideia apenas ao modo da ação.
theological_decisions:
- issue: Objeto direto implícito de εὑρὼν
  choice: Explicitar «a», retomando a ovelha perdida.
  alternative: 'Traduzir sem objeto expresso: «quando encontra».'
  rationale: O grego deixa o objeto subentendido porque o contexto o torna evidente; o português natural favorece o pronome feminino que retoma «ovelha», sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em «põe-na» mantém um registro escrito natural e evita a ambiguidade de «coloca ela». O particípio final foi vertido idiomaticamente, preservando a alegria como circunstância concomitante.
