source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: pt
  text: Então ele foi e se apegou a um dos cidadãos daquela terra[a], e este o mandou para os seus campos alimentar porcos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se ligou a” ou “se agarrou a”; o verbo grego sugere ligar-se estreitamente, até de modo dependente, a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: foi
  rationale: O particípio aoristo funciona de modo adverbial antes do verbo principal; “foi” expressa naturalmente o movimento sem acrescentar uma nuance ausente do grego.
- source_word: ἐκολλήθη
  choice: se apegou a
  rationale: O verbo sugere ligar-se estreitamente a alguém, aqui com provável dependência; “se apegou a” conserva essa força e continua compreensível em português atual.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: a um dos cidadãos
  rationale: πολίτης designa um cidadão ou membro da comunidade política; a tradução direta preserva a dimensão social do relato.
- source_word: τῆς χώρας ἐκείνης
  choice: daquela terra
  rationale: χώρα pode significar país, região ou terra. “Daquela terra” é natural no contexto narrativo e preserva a amplitude sem especificar fronteiras políticas modernas.
- source_word: ἔπεμψεν αὐτόν
  choice: este o mandou
  rationale: “Este” esclarece naturalmente que o sujeito é o cidadão recém-mencionado, enquanto “o mandou” traduz de modo idiomático a ação de enviá-lo para uma tarefa.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: para os seus campos
  rationale: ἀγρός refere-se a campo ou terra cultivada; o plural do original é mantido.
- source_word: βόσκειν
  choice: cuidar de
  rationale: βόσκω pode indicar alimentar, apascentar ou pastorear animais. Com porcos, “cuidar de” é português corrente e abrange a tarefa sem sugerir apenas a entrega de alimento.
- source_word: χοίρους
  choice: porcos
  rationale: É a designação simples e moderna do animal, sem o tom arcaizante de alternativas como “suínos” neste contexto narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem narrativa e a dependência sugerida por ἐκολλήθη foram preservadas; “este” evita ambiguidade pronominal quanto ao cidadão que o enviou.
