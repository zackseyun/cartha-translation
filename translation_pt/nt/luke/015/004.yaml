id: LUK.15.4
reference: Luke 15:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: pt
  text: Qual de vocês, tendo cem ovelhas e perdendo uma delas, não deixa as noventa e nove em campo aberto[a] e vai atrás da que se perdeu até encontrá-la?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no deserto”. O termo grego pode indicar campo aberto, pastagem ou lugar deserto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Qual de vocês
  rationale: Em português, esta formulação introduz com naturalidade a pergunta retórica e preserva sua aplicação representativa. O substantivo ἄνθρωπος não precisa ser explicitado, pois “qual de vocês” já pressupõe uma pessoa entre os ouvintes.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: tendo cem ovelhas
  rationale: Mantém a construção participial e traduz diretamente o número e o substantivo.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: perdendo uma delas
  rationale: Expressa de modo idiomático que uma das cem ovelhas ficou perdida, sem sugerir destruição deliberada.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: não deixa as noventa e nove
  rationale: Preserva a forma negativa da pergunta retórica, que espera resposta afirmativa.
- source_word: ἐν τῇ ἐρήμῳ
  choice: em campo aberto
  rationale: No contexto pastoril, comunica terreno aberto ou pouco habitado sem impor a imagem de um deserto árido; a alternativa lexical é registrada em nota.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: vai atrás da que se perdeu
  rationale: Traduz o movimento dirigido à ovelha em sua condição de perdida, com referente feminino claro em português.
- source_word: ἕως εὕρῃ αὐτό
  choice: até encontrá-la
  rationale: Reproduz claramente o limite temporal da busca e retoma a ovelha de modo natural.
theological_decisions:
- issue: Linguagem masculina representativa na pergunta parabólica
  choice: Qual de vocês
  alternative: Que homem dentre vocês
  rationale: Embora ἄνθρωπος esteja no masculino singular, a construção portuguesa “qual de vocês” mantém a referência a um indivíduo representativo sem acrescentar linguagem inclusiva nem restringir o alcance; é também mais natural no português moderno.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi mantida em uma única frase, e a ambiguidade espacial de ἔρημος foi preservada por meio de nota.
