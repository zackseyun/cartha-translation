id: LUK.15.7
reference: Luke 15:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: pt
  text: Eu lhes digo que, da mesma forma[a], haverá mais alegria no céu por um pecador que se arrepende do que por noventa e nove justos[b] que não precisam de arrependimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assim» ou «desse modo». A expressão liga a alegria no céu ao ponto da parábola anterior.
    reason: lexical_alternative
  - marker: b
    text: O texto diz «justos». No contexto, a palavra pode ser entendida de modo direto ou irônico; a tradução preserva essa tensão sem decidir a interpretação.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Fórmula introdutória direta e natural em português, preservando a afirmação enfática e o destinatário plural.
- source_word: οὕτως
  choice: da mesma forma
  rationale: Liga explicitamente a afirmação à cena e ao ponto da parábola anterior; «assim» também seria possível.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: haverá mais alegria no céu
  rationale: «Haverá alegria no céu» preserva o futuro e o valor locativo. «Mais» explicita em português a comparação introduzida por ἢ, sem identificar quem se alegra.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: por um pecador
  rationale: Com χαρά, ἐπί indica a causa ou ocasião da alegria; «por» é natural em português.
- source_word: μετανοοῦντι
  choice: que se arrepende
  rationale: O particípio presente caracteriza o pecador como alguém que se arrepende. A oração relativa é clara e idiomática, sem reduzir μετάνοια a mera emoção de remorso.
- source_word: ἢ
  choice: do que
  rationale: No contexto comparativo, corresponde naturalmente a «do que»; a inserção de «mais» torna a relação comparativa inequívoca em português.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: noventa e nove justos
  rationale: O adjetivo substantivado pode ser vertido naturalmente como «justos», sem acrescentar que sejam apenas pessoas que se consideram justas.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: que não precisam de arrependimento
  rationale: Expressa de modo atual e claro a construção «não têm necessidade de arrependimento», conservando o substantivo μετανοίας.
theological_decisions:
- issue: Se «justos» designa pessoas realmente justas ou é usado com ironia em referência aos que se consideram justos
  choice: Manter «justos» e registrar a tensão em nota.
  alternative: Parafrasear como «os que se consideram justos» ou marcar a palavra com aspas.
  rationale: O grego diz simplesmente δικαίοις e não assinala explicitamente ironia. A tradução preserva a possibilidade de leitura direta ou irônica, sem decidir a questão.
- issue: Quem experimenta a alegria no céu
  choice: Manter a formulação locativa «alegria no céu».
  alternative: Especificar «alegria diante de Deus» ou «entre os anjos».
  rationale: O versículo indica o âmbito da alegria, mas não nomeia explicitamente seus agentes; especificá-los importaria informação não expressa nesta frase.
- issue: Forma da comparação entre um pecador e noventa e nove justos
  choice: Usar «mais alegria... do que».
  alternative: Traduzir literalmente «alegria... ou por», deixando a comparação implícita.
  rationale: Embora «mais» não apareça como palavra independente no grego, a conjunção ἢ estabelece aqui a comparação. A formulação escolhida comunica essa relação de modo gramatical e natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «lhes» no endereço plural, «se arrepende» como expressão corrente para μετανοεῖν e mantém a concisão proverbial da fala de Jesus.
