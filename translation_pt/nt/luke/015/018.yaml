id: LUK.15.18
reference: Luke 15:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: pt
  text: 'Eu me levantarei, irei até meu pai e lhe direi: ‘Pai, pequei contra o céu[a] e diante de ti[b]’.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra Deus”. Aqui, “céu” provavelmente é uma forma reverente de se referir a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à tua vista”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Eu me levantarei
  rationale: Embora seja um particípio aoristo, introduz a primeira ação do plano decidido pelo filho. Em português, uma forma verbal coordenada no futuro comunica a sequência com naturalidade.
- source_word: πορεύσομαι
  choice: irei
  rationale: O futuro de πορεύομαι indica o deslocamento pretendido. “Irei” é claro e natural, sem acrescentar a nuance específica de “partirei”.
- source_word: πρὸς τὸν πατέρα μου
  choice: até meu pai
  rationale: πρός com acusativo expressa movimento em direção a uma pessoa, com chegada implícita no contexto. “Até meu pai” mantém esse sentido e soa natural em português.
- source_word: ἐρῶ αὐτῷ
  choice: lhe direi
  rationale: O futuro de λέγω com objeto indireto é expresso de modo conciso e idiomático por “lhe direi”.
- source_word: Πάτερ
  choice: Pai
  rationale: Preserva o vocativo direto e pessoal sem acrescentar um possessivo ausente no grego.
- source_word: ἥμαρτον
  choice: pequei
  rationale: O aoristo apresenta o pecado como fato reconhecido. O pretérito perfeito simples é a forma natural da confissão em português e não exige a expansão “tenho pecado”.
- source_word: εἰς τὸν οὐρανὸν
  choice: contra o céu
  rationale: Mantém a expressão concreta do grego, provavelmente uma forma reverente de referência a Deus, sem substituir a formulação original por sua interpretação.
- source_word: ἐνώπιόν σου
  choice: diante de ti
  rationale: ἐνώπιον com genitivo significa “diante de, na presença de, à vista de”. “Diante de ti” preserva a distinção em relação à frase anterior, em vez de uniformizar ambas como “contra”.
theological_decisions:
- issue: Se “céu” deve ser explicitamente substituído por “Deus” no texto principal
  choice: 'Manter “céu”: “pequei contra o céu”'
  alternative: “Pequei contra Deus”
  rationale: Embora “céu” provavelmente funcione como uma forma reverente de referência a Deus, o grego emprega οὐρανός. A manutenção da expressão preserva o idioma e sua tensão interpretativa, enquanto a nota esclarece o sentido provável.
- issue: Se ἐνώπιόν σου deve ser assimilado à ideia de pecado “contra” o pai
  choice: “diante de ti”
  alternative: “contra ti”
  rationale: A expressão grega significa literalmente estar diante ou à vista de alguém. Traduzir “contra ti” tornaria explícita uma relação plausível no contexto, mas apagaria a diferença lexical entre εἰς e ἐνώπιον.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação de verbos no futuro reproduz naturalmente a sequência deliberada do grego. “Ti” preserva o tom pessoal do discurso direto e evita acrescentar formalidade social não indicada pelo original.
