id: LUK.15.28
reference: Luke 15:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: pt
  text: Mas ele ficou com raiva e não queria entrar.[a] Então seu pai saiu e lhe suplicava.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não estava disposto a entrar” ou “recusava-se a entrar”.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “suplicava” também pode ser vertido como “insistia com ele” ou “rogava-lhe”; o tempo imperfeito sugere um apelo contínuo ou repetido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou com raiva
  rationale: O aoristo de ὀργίζομαι pode indicar o surgimento da ira. “Ficou com raiva” expressa isso em português atual sem intensificar para “ficou furioso”.
- source_word: δὲ
  choice: Mas
  rationale: A primeira ocorrência marca contraste com a celebração narrada anteriormente; “Mas” transmite essa força adversativa com naturalidade.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: não queria entrar
  rationale: θέλω com infinitivo expressa vontade ou disposição. A tradução preserva o aspecto volitivo sem afirmar de modo mais categórico um ato formal de recusa.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Então seu pai
  rationale: A segunda ocorrência de δέ introduz a reação do pai. “Então” comunica a progressão narrativa natural, sem criar uma oposição forte.
- source_word: ἐξελθὼν
  choice: saiu
  rationale: O particípio de ἐξέρχομαι indica que o pai se deslocou para fora do lugar onde estava; “saiu” é direto e natural em português.
- source_word: παρεκάλει
  choice: lhe suplicava
  rationale: O imperfeito de παρακαλέω retrata um apelo persistente ou contínuo. “Lhe suplicava” conserva o caráter sério e pessoal do apelo; a nota registra alternativas menos intensas.
- source_word: αὐτόν
  choice: lhe
  rationale: O pronome retoma o filho mais velho e funciona como complemento da súplica; o pronome dativo “lhe” é idiomático nesse contexto.
theological_decisions:
- issue: Tom do apelo do pai na parábola
  choice: lhe suplicava
  alternative: insistia com ele; rogava-lhe
  rationale: A formulação preserva a iniciativa solícita e insistente do pai sem acrescentar uma explicação doutrinária. A duração sugerida pelo imperfeito é mantida, enquanto a nota reconhece a extensão semântica do verbo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficou com raiva” evita tanto o tom arcaizante de “irou-se” quanto a intensidade excessiva de “ficou furioso”. Os marcadores foram colocados junto às expressões a que suas notas se referem.
