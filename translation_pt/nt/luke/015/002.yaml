  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: pt
  text: 'Tanto os fariseus como os escribas murmuravam, dizendo: “Este homem acolhe pecadores e come com eles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: murmuravam
  rationale: O imperfeito indica uma ação contínua ou repetida. “Murmuravam” preserva a ideia de queixa crítica, possivelmente expressa em voz baixa, e é natural em português bíblico moderno.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: Tanto os fariseus como os escribas
  rationale: A construção correlativa τε ... καί é explicitada por “tanto ... como”, mantendo a inclusão enfática dos dois grupos. “Escribas” é o termo tradicional e ainda compreensível no contexto dos Evangelhos.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio expressa uma ação simultânea à murmuração e pode ser reproduzido de modo direto e natural por “dizendo”.
- source_word: Οὗτος
  choice: Este homem
  rationale: A expressão mantém a referência demonstrativa e seu possível tom de distanciamento ou desprezo, sem intensificá-lo indevidamente.
- source_word: ἁμαρτωλοὺς
  choice: pecadores
  rationale: O adjetivo substantivado designa pessoas classificadas social e religiosamente como pecadoras; “pecadores” conserva essa categoria de maneira direta.
- source_word: προσδέχεται
  choice: acolhe
  rationale: “Acolhe” comunica uma recepção favorável e pessoal, evitando tanto a rigidez de “recebe” quanto possíveis conotações psicológicas modernas de “aceita”.
- source_word: συνεσθίει αὐτοῖς
  choice: come com eles
  rationale: A formulação simples preserva o sentido concreto de partilhar a mesa e deixa que o contexto revele sua relevância social e religiosa.
theological_decisions:
- issue: Força social e teológica da associação de Jesus com pecadores
  choice: Expressar diretamente que Jesus acolhe pecadores e come com eles.
  alternative: “Este homem recebe pecadores e come com eles.”
  rationale: A acusação deve conservar o escândalo implícito no acolhimento e na comunhão à mesa, sem acrescentar explicações interpretativas nem suavizar a categoria “pecadores”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a continuidade do imperfeito, a correlação entre os dois grupos e o possível tom depreciativo de “Este homem”, sem inserir linguagem denominacional.
