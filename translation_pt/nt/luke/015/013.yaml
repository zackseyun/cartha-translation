  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: pt
  text: Poucos dias depois[a], o filho mais novo reuniu tudo e partiu para uma terra distante. Ali, esbanjou os seus bens[b], vivendo de modo desregrado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “depois de não muitos dias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu patrimônio”, “suas posses” ou “sua riqueza”.
    reason: lexical_alternative
  - marker: c
    text: Ou “vivendo de modo perdulário” ou “levando uma vida dissoluta”. O texto não especifica aqui pecados particulares, mas descreve um modo de vida dissipador.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Poucos dias depois
  rationale: Expressa em português natural a locução grega literalmente negativa, “depois de não muitos dias”, sem alterar sua referência temporal.
- source_word: συναγαγὼν πάντα
  choice: reuniu tudo
  rationale: Mantém a ideia de juntar tudo antes da partida, sem explicitar além do texto se os bens foram vendidos, convertidos em dinheiro ou apenas reunidos.
- source_word: ὁ νεώτερος υἱός
  choice: o filho mais novo
  rationale: É a forma corrente e inequívoca de expressar o comparativo no contexto dos dois filhos.
- source_word: ἀπεδήμησεν
  choice: partiu
  rationale: Comunica a saída para um lugar distante de modo conciso e natural; o destino subsequente fornece a noção de afastamento.
- source_word: εἰς χώραν μακράν
  choice: para uma terra distante
  rationale: “Terra” preserva a amplitude de χώρα, enquanto “distante” traduz naturalmente μακράν.
- source_word: διεσκόρπισεν
  choice: esbanjou
  rationale: No contexto de bens, o sentido figurado do verbo é dissipar ou desperdiçar recursos, bem expresso por “esbanjou”.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: os seus bens
  rationale: Abrange o patrimônio ou as posses do filho sem restringir a referência a imóveis, dinheiro ou riqueza em sentido abstrato.
- source_word: ζῶν ἀσώτως
  choice: vivendo de maneira irresponsável
  rationale: Descreve uma vida dissipadora e imprudente sem inserir pecados específicos que o versículo não menciona.
theological_decisions:
- issue: Natureza da vida descrita por ἀσώτως
  choice: vivendo de maneira irresponsável
  alternative: vivendo dissolutamente; levando uma vida de devassidão
  rationale: A tradução preserva a censura moral e a ideia de dissipação, mas evita limitar a expressão a imoralidade sexual ou a outros atos específicos não declarados neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a relação entre o esbanjamento e o modo de vida foram preservadas sem tornar explícitos detalhes apenas inferidos.
