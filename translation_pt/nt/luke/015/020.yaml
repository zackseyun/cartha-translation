  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: pt
  text: E ele se levantou e foi até o seu pai. Mas, quando ele ainda estava longe, seu pai o viu e, movido de compaixão, correu, lançou-se ao pescoço dele[a] e o beijou efusivamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «caiu sobre o pescoço dele»; expressão que descreve um abraço impetuoso.
    reason: idiom_explanation
  - marker: b
    text: O verbo grego pode indicar grande intensidade afetiva e talvez beijos repetidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo marca a ação decidida do filho antes de ir ao pai; a formulação preserva a sequência narrativa sem fundir os dois verbos.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: foi até seu pai
  rationale: ἔρχομαι pode ser traduzido como «ir» ou «vir» conforme o ponto de vista. «Foi até seu pai» é natural em português e mantém tanto o movimento quanto o foco relacional.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: quando ainda estava longe
  rationale: A construção em genitivo absoluto expressa uma circunstância simultânea. A tradução é clara e preserva a distância ainda existente entre o filho e o pai.
- source_word: ἐσπλαγχνίσθη
  choice: movido de compaixão
  rationale: O verbo expressa profunda compaixão interior; esta formulação conserva sua força afetiva sem acrescentar interpretação alegórica.
- source_word: δραμὼν
  choice: correu
  rationale: Tradução direta do particípio aoristo de τρέχω, mantendo a rapidez da iniciativa do pai.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: lançou-se ao pescoço dele
  rationale: Preserva a imagem vívida do idioma grego e comunica um abraço impetuoso sem substituir a expressão por uma explicação abstrata.
- source_word: κατεφίλησεν
  choice: o beijou com ternura
  rationale: O verbo composto pode indicar intensidade afetiva e, conforme o contexto, beijos insistentes ou repetidos. A escolha comunica o afeto sem determinar que a ação tenha sido repetida.
theological_decisions:
- issue: Representação da compaixão do pai na parábola
  choice: Manter a resposta do pai emocionalmente vívida, conforme os verbos do texto.
  alternative: Atenuar a emoção ou explicitar que o pai representa Deus.
  rationale: O versículo apresenta a iniciativa compassiva do pai com linguagem narrativa forte, mas não formula aqui a interpretação alegórica. A tradução preserva essa força sem importar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «seu pai» e «dele» para evitar construções excessivamente formais e possíveis ambiguidades pronominais. A pontuação conserva o ritmo rápido das ações do pai.
