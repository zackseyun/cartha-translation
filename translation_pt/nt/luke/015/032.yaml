  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: pt
  text: Mas era necessário celebrar e se alegrar, porque este seu irmão estava morto e voltou a viver[a]; estava perdido e foi encontrado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «viveu»; no contexto, a expressão provavelmente descreve de modo figurado a restauração do filho.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: «foi achado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: celebrar
  rationale: No contexto da festa oferecida pelo pai, «celebrar» expressa naturalmente o sentido festivo do infinitivo, sem recorrer a uma formulação antiquada.
- source_word: χαρῆναι
  choice: se alegrar
  rationale: Preserva a segunda expressão de alegria coordenada com εὐφρανθῆναι e soa natural no português moderno.
- source_word: ἔδει
  choice: era necessário
  rationale: Mantém a força impessoal de necessidade moral ou circunstancial do imperfeito, sem introduzir um sujeito não expresso.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: este seu irmão
  rationale: Conserva tanto o demonstrativo quanto o possessivo e ressalta a lembrança enfática do vínculo familiar feita pelo pai.
- source_word: νεκρὸς ἦν
  choice: estava morto
  rationale: Reproduz diretamente a imagem de morte, sem explicar no corpo do texto seu provável sentido metafórico de afastamento.
- source_word: ἔζησεν
  choice: voltou a viver
  rationale: Expressa de modo idiomático o contraste com «estava morto» e a ideia contextual de recuperação da vida, embora o grego diga literalmente «viveu».
- source_word: ἀπολωλὼς
  choice: estava perdido
  rationale: Representa o estado resultante indicado pelo particípio perfeito e mantém a formulação característica da parábola.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Traduz de maneira direta o aoristo passivo, preservando o paralelismo com «estava perdido».
theological_decisions:
- issue: Se deve tornar explícito o sentido metafórico e restaurador de ἔζησεν
  choice: voltou a viver
  alternative: viveu; tornou a viver
  rationale: A formulação preserva a oposição morte-vida usada pelo pai e comunica restauração em português corrente, sem substituir a imagem por uma explicação teológica nem convertê-la explicitamente em referência à ressurreição corporal.
- issue: Força de ἔδει
  choice: era necessário
  alternative: era apropriado; convinha
  rationale: A tradução conserva a noção mais forte de necessidade, ao mesmo tempo que deixa aberta sua natureza moral ou circunstancial no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição paralela e as imagens de morte, vida, perda e encontro foram preservadas. «Este seu irmão» mantém a ênfase relacional do original.
