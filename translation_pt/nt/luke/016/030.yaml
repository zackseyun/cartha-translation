id: LUK.16.30
reference: Luke 16:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: pt
  text: 'Mas ele disse: “Não, pai Abraão, mas, se alguém for até eles dentre os mortos, eles se arrependerão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: Não
  rationale: Negativa enfática em resposta direta; “Não” é natural em português, e a exclamação comunica a força da contestação.
- source_word: πάτερ Ἀβραάμ
  choice: pai Abraão
  rationale: Mantém o vocativo relacional e o apelo de descendência, sem transformá-lo em título formal.
- source_word: ἀλλ’ ἐάν
  choice: Se
  rationale: 'Após a negativa enfática, o português natural pode expressar a correção pela justaposição: “Não...! Se...”. Isso evita o pouco idiomático “mas se” sem perder o contraste.'
- source_word: τις
  choice: alguém
  rationale: Equivalente indefinido singular, corrente e preciso.
- source_word: ἀπὸ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa de modo conciso a procedência do meio ou domínio dos mortos e preserva a ausência de artigo no grego.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: for até eles
  rationale: Preserva o movimento em direção a eles indicado por πορεύομαι com πρός, em construção condicional natural em português.
- source_word: μετανοήσουσιν
  choice: eles se arrependerão
  rationale: No contexto lucano, o verbo indica arrependimento moral e espiritual, não apenas mudança intelectual de opinião.
theological_decisions:
- issue: Sentido de μετανοήσουσιν
  choice: eles se arrependerão
  alternative: eles mudarão de pensamento
  rationale: “Arrepender-se” conserva o sentido ético-espiritual habitual do verbo em Lucas e não o reduz a uma reconsideração puramente mental.
- issue: Sentido de ἀπὸ νεκρῶν
  choice: dentre os mortos
  alternative: dos mortos
  rationale: “Dentre os mortos” torna explícita a ideia possível de alguém sair do meio dos mortos, sem decidir se a referência é a retorno temporário ou ressurreição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A exclamação após “pai Abraão” transmite a força de Οὐχί e permite formular a condição sem o pouco natural “mas se”. Não há marcadores de nota porque nenhuma nota foi necessária.
