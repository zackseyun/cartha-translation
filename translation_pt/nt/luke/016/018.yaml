  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: pt
  text: Todo aquele que se divorcia de sua esposa e se casa com outra[a] comete adultério; e quem se casa com uma mulher divorciada do marido[b] comete adultério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com outra mulher”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “uma mulher que foi divorciada de um marido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Todo aquele que
  rationale: A construção generalizante expressa alcance universal; esta formulação é natural e digna em português.
- source_word: ἀπολύων
  choice: se divorcia de
  rationale: No contexto conjugal, o verbo significa desfazer legal ou socialmente o casamento, e não apenas mandar embora.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua esposa
  rationale: Embora γυνή também possa significar “mulher”, o contexto de casamento e divórcio exige o sentido de “esposa”.
- source_word: γαμῶν ἑτέραν
  choice: se casa com outra
  rationale: A expressão portuguesa comunica naturalmente que se trata de outra mulher, sem precisar repetir o substantivo.
- source_word: μοιχεύει
  choice: comete adultério
  rationale: Equivalente corrente e preciso do verbo grego neste pronunciamento moral geral.
- source_word: ὁ ἀπολελυμένην ... γαμῶν
  choice: quem se casa com uma mulher divorciada
  rationale: O particípio perfeito passivo indica uma mulher que permanece na condição resultante de ter sido divorciada.
- source_word: ἀπὸ ἀνδρός
  choice: do marido
  rationale: No contexto conjugal, ἀνήρ significa “marido”; “do” preserva de modo conciso a relação expressa por ἀπό sem convertê-la explicitamente em agente.
theological_decisions:
- issue: Alcance e força da declaração de Jesus sobre divórcio e novo casamento
  choice: Traduzir como uma declaração moral universal, sem acrescentar exceções.
  alternative: Inserir ou pressupor no texto uma exceção mencionada em outra passagem, ou restringir a declaração a uma situação jurídica específica.
  rationale: Lucas apresenta aqui uma afirmação concisa e sem qualificação expressa. A tradução deve preservar tanto sua força quanto a tensão com outras passagens, sem harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com leitura natural no Brasil. “Todo aquele que” mantém a solenidade moderada e o alcance geral; “se divorcia de” e “se casa com” são idiomáticos. O ponto e vírgula torna nítido o paralelismo entre as duas afirmações.
