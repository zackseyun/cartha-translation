id: LUK.16.11
reference: Luke 16:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: pt
  text: Portanto, se vocês não foram fiéis no uso das riquezas injustas, quem lhes confiará as verdadeiras riquezas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aquilo que é verdadeiro”. “Riquezas” está implícito no contraste com as riquezas injustas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: injustas
  rationale: Preserva a coloração moral de ἄδικος sem restringir o sentido a bens adquiridos por fraude, como poderia sugerir “desonestas”.
- source_word: μαμωνᾷ
  choice: riquezas
  rationale: Expressa naturalmente a ideia de riqueza ou bens e é mais ampla que “dinheiro”; evita a transliteração pouco corrente “mamom”.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: no uso das riquezas injustas
  rationale: Torna idiomática em português a esfera em que se demonstra fidelidade; “no uso” explicita apenas a relação de administração indicada pelo contexto.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: não foram fiéis
  rationale: Em construção predicativa, γίνομαι pode indicar mostrar-se ou ser; esta formulação é natural e mantém o tema da fidelidade na administração.
- source_word: τὸ ἀληθινὸν
  choice: as verdadeiras riquezas
  rationale: O adjetivo substantivado deixa o nome implícito. “Riquezas” explicita o contraste imediato com μαμωνᾶς e produz português claro, sem transformar a inferência em afirmação doutrinária não contextual.
- source_word: πιστεύσει
  choice: confiará
  rationale: Com objeto pessoal indireto e objeto direto, πιστεύω significa entregar algo aos cuidados de alguém, não simplesmente crer.
theological_decisions:
- issue: Sentido de τὸ ἀληθινὸν em contraste com as riquezas injustas
  choice: as verdadeiras riquezas
  alternative: aquilo que é verdadeiro
  rationale: O grego mantém o substantivo implícito, mas o contraste com μαμωνᾶς favorece fortemente a ideia de riqueza genuína. A nota registra a forma mais literal e preserva a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. “Portanto” representa οὖν, e a ordem da pergunta foi ajustada ao uso natural do português.
