source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: pt
  text: Mas é mais fácil que o céu e a terra passem do que caia um só traço de uma letra da Lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um só pequeno traço da Lei”. Trata-se de um traço mínimo que distingue uma letra de outra.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: mais fácil
  rationale: O comparativo significa “mais fácil” ou “mais prontamente possível”; “mais fácil” é natural em português e preserva a comparação.
- source_word: δέ
  choice: Mas
  rationale: Marca contraste moderado com o contexto anterior; “Mas” comunica adequadamente essa nuance adversativa.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: o céu e a terra
  rationale: Preserva a expressão bíblica que abrange a ordem criada.
- source_word: παρελθεῖν
  choice: passarem
  rationale: Neste contexto, indica que o céu e a terra deixam de existir ou passam; a formulação mantém a imagem sem explicá-la excessivamente.
- source_word: νόμου
  choice: Lei
  rationale: O contexto aponta para a Lei como corpo reconhecido da revelação escriturística; a inicial maiúscula sinaliza esse referente.
- source_word: μίαν κεραίαν
  choice: um só traço de uma letra
  rationale: κεραία designa um pequeno traço ou projeção gráfica; a expressão é clara para leitores modernos e mantém a ênfase no mínimo detalhe escrito.
- source_word: πεσεῖν
  choice: cair
  rationale: Reproduz literalmente a imagem do verbo grego, deixando em aberto suas implicações de desaparecer, falhar ou perder a validade.
theological_decisions:
- issue: Referente de νόμος
  choice: a Lei como Lei escriturística
  alternative: lei em sentido genérico
  rationale: O contexto judaico de Lucas e a referência a um detalhe escrito favorecem a Lei revelada; a tradução evita especificar além disso qual divisão ou alcance está em vista.
- issue: Sentido de κεραία
  choice: um só traço de uma letra
  alternative: um til; um pequeno sinal
  rationale: A tradução comunica a permanência até do menor detalhe gráfico sem recorrer a vocabulário arcaico nem identificar indevidamente um sinal específico.
- issue: Imagem de πεσεῖν
  choice: cair
  alternative: desaparecer; deixar de valer
  rationale: Manter “cair” preserva a metáfora e a tensão do original, em vez de decidir se o sentido principal é perda textual, fracasso ou invalidação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada naturalmente ao português, preservando a comparação enfática e a imagem do original.
