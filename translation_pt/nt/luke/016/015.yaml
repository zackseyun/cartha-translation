  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: pt
  text: 'E ele lhes disse: “Vocês são os que se declaram justos diante das pessoas, mas Deus conhece os corações de vocês. Pois aquilo que é exaltado entre as pessoas[a] é detestável diante de Deus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que é muito valorizado pelas pessoas”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “é uma abominação diante de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: se declaram justos
  rationale: O particípio presente com objeto reflexivo descreve a reivindicação ou apresentação de si mesmos como justos diante de outros. “Declaram-se justos” preserva o sentido forense de δικαιόω e soa mais claro em português atual do que o potencialmente ambíguo “justificam a si mesmos”.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: ἐνώπιον significa “diante de/à vista de”, e ἀνθρώπων é genérico neste contexto. “Pessoas” comunica naturalmente a referência inclusiva em português moderno.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: conhece o coração de vocês
  rationale: Mantém a imagem bíblica do coração como centro interior dos pensamentos, desejos e motivos. O singular distributivo é idiomático em português e evita sugerir que Deus conhece apenas uma realidade coletiva.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: aquilo que é exaltado entre as pessoas
  rationale: O adjetivo neutro substantivado designa o que é elevado ou exaltado na avaliação humana. “Exaltado” conserva a metáfora de altura e a possível conotação de prestígio, sem restringir o sentido a “valorizado”.
- source_word: βδέλυγμα
  choice: detestável
  rationale: Expressa com força algo repugnante ou abominável perante Deus, em linguagem atual e digna. A alternativa nominal mais formal é registrada em nota.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Preserva o paralelismo com “diante das pessoas” e destaca o contraste entre a avaliação humana e a divina.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Vocês são os que...
  rationale: A construção com pronome explícito e artigo mais particípio é enfática. Esta formulação mantém a acusação direta e marcada.
theological_decisions:
- issue: Força de δικαιοῦντες ἑαυτούς
  choice: se declaram justos
  alternative: justificam a si mesmos
  rationale: O contexto trata da apresentação pública dos interlocutores como justos, sem definir aqui toda a doutrina da justificação. A tradução conserva o matiz forense sem sugerir que eles de fato se tornam justos.
- issue: Referência genérica de ἀνθρώπων
  choice: pessoas
  alternative: seres humanos
  rationale: O substantivo grego refere-se genericamente aos humanos em contraste com Deus. “Pessoas” é inclusivo, natural e semanticamente exato em português contemporâneo.
- issue: Sentido de τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: aquilo que é exaltado entre as pessoas
  alternative: aquilo que é muito valorizado pelas pessoas
  rationale: A expressão pode indicar o que recebe elevada posição, honra ou estima social. A tradução principal preserva a metáfora e a ambiguidade legítima; a nota apresenta a leitura valorativa.
- issue: Força de βδέλυγμα
  choice: detestável diante de Deus
  alternative: uma abominação diante de Deus
  rationale: Ambas expressam forte repulsa divina. “Detestável” é corrente e não enfraquece a censura; a forma nominal tradicional permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural e “pessoas” para o uso genérico de ἀνθρώπων. Conserva o paralelismo “diante das pessoas/diante de Deus” e a imagem de algo “exaltado” na sociedade humana.
