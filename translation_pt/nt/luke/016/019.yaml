  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: pt
  text: Havia certo homem rico que costumava vestir-se de púrpura e linho fino e festejava todos os dias com grande luxo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “banqueteava-se suntuosamente todos os dias”. O particípio grego pode indicar prazer festivo ou banquetes, e o advérbio ressalta a magnificência luxuosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: Havia certo homem
  rationale: A construção introduz uma personagem indefinida, enquanto δέ funciona como transição narrativa. “Havia certo homem” é natural em português e não acrescenta um marcador temporal inexistente no grego.
- source_word: πλούσιος
  choice: rico
  rationale: Equivalente direto e corrente para a condição de grande riqueza material.
- source_word: ἐνεδιδύσκετο
  choice: costumava vestir-se
  rationale: O imperfeito expressa ação habitual; a forma média favorece a construção reflexiva natural em português.
- source_word: πορφύραν
  choice: púrpura
  rationale: O substantivo designa, por metonímia, roupa tingida de púrpura, sinal cultural de luxo; o sentido de vestuário fica claro pelo verbo.
- source_word: βύσσον
  choice: linho fino
  rationale: Designa tecido de linho de alta qualidade, e “linho fino” comunica tanto o material quanto seu caráter luxuoso.
- source_word: εὐφραινόμενος
  choice: festejava
  rationale: O particípio pode indicar alegrar-se, celebrar ou banquetear-se. No contexto de ostentação diária, “festejava” preserva a ideia de prazer festivo sem restringi-la exclusivamente a refeições.
- source_word: καθ’ ἡμέραν
  choice: todos os dias
  rationale: Expressão portuguesa clara e natural para a recorrência diária.
- source_word: λαμπρῶς
  choice: com grande luxo
  rationale: Neste contexto, o advérbio caracteriza uma vida festiva magnífica e suntuosa; “com grande luxo” transmite essa força de modo idiomático.
