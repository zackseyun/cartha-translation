id: LUK.16.31
reference: Luke 16:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: pt
  text: 'Mas ele lhe disse: “Se não dão ouvidos a Moisés e aos Profetas[a], nem serão convencidos, mesmo que alguém ressuscite dentre os mortos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não ouvem Moisés e os Profetas”. O verbo grego pode incluir tanto ouvir quanto atender ao que se ouve.
    reason: lexical_alternative
  - marker: b
    text: Ou “se levante dentre os mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Mas ele lhe disse
  rationale: δέ introduz aqui um leve contraste na resposta; a construção com pronome oblíquo é natural e digna em português.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Moisés e os Profetas
  rationale: Preserva a expressão judaica que remete ao testemunho autorizado das Escrituras, sem substituí-la pela paráfrase interpretativa “as Escrituras”.
- source_word: οὐκ ἀκούουσιν
  choice: não ouvem
  rationale: ἀκούω pode abranger tanto ouvir quanto dar atenção. “Não ouvem” preserva essa amplitude em português, inclusive o sentido idiomático de não acolher o testemunho.
- source_word: οὐδ’ ἐάν
  choice: também não ... ainda que
  rationale: A formulação mantém a negação intensificada e expressa naturalmente que nem mesmo a ressurreição de alguém os convenceria.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: ressuscite dentre os mortos
  rationale: “Ressuscite” comunica de modo claro o sentido contextual de ἀνίστημι, enquanto “dentre os mortos” representa explicitamente ἐκ νεκρῶν.
- source_word: πεισθήσονται
  choice: serão convencidos
  rationale: O futuro passivo de πείθω indica ser persuadido ou convencido; a escolha evita restringir o sentido a “crer” em acepção teológica específica.
theological_decisions:
- issue: Sentido de “Moisés e os Profetas”
  choice: Referência ao testemunho autorizado das Escrituras dado a Israel, preservada em sua forma idiomática
  alternative: Parafrasear como “as Escrituras” ou entender apenas como duas figuras representativas
  rationale: No contexto, a expressão funciona metonimicamente, mas traduzi-la literalmente conserva a linguagem do texto e evita explicitação desnecessária.
- issue: Força de πεισθήσονται
  choice: Convencimento ou persuasão em sentido geral
  alternative: “Crerão” ou “se arrependerão”
  rationale: O verbo não especifica por si só fé salvífica nem arrependimento; “serão convencidos” preserva a tensão e a extensão semântica do original.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase foi ajustada à fluência do português sem perder o contraste, a condição nem a força da negação grega. As maiúsculas em “Profetas” sinalizam a designação tradicional de um conjunto das Escrituras.
