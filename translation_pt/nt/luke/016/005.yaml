  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: pt
  text: 'E, depois de chamar cada um dos devedores de seu senhor[a], dizia ao primeiro: “Quanto você deve ao meu senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego κύριος muitas vezes é traduzido por “Senhor”, mas aqui se refere ao superior humano do administrador. Por isso, “senhor” é usado com inicial minúscula.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: chamando
  rationale: O particípio aoristo médio indica uma ação anterior ou concomitante à fala e inclui a ideia de chamar alguém para junto de si. Em português, o gerúndio mantém a sequência narrativa de modo natural.
- source_word: ἕνα ἕκαστον
  choice: cada um
  rationale: A expressão tem força distributiva e destaca os devedores individualmente. “Cada um” é claro e conciso, sem acrescentar a ideia mais explícita de sequência presente em “um por um”.
- source_word: χρεοφειλετῶν
  choice: devedores
  rationale: O substantivo designa pessoas que devem uma dívida e se encaixa diretamente no contexto econômico da parábola.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: do seu senhor
  rationale: κύριος designa aqui o superior humano do administrador, enquanto ἑαυτοῦ remete ao próprio administrador. “Seu senhor” preserva essa relação e funciona naturalmente em português.
- source_word: ἔλεγεν
  choice: perguntou
  rationale: Embora o imperfeito possa ser representado literalmente por “dizia”, neste contexto introduz uma pergunta dirigida ao primeiro devedor. “Perguntou” expressa naturalmente a função discursiva; a distribuição entre os devedores permanece indicada por “cada um”.
- source_word: τῷ πρώτῳ
  choice: ao primeiro
  rationale: Reproduz de forma direta e idiomática o dativo com o ordinal.
- source_word: Πόσον
  choice: Quanto
  rationale: No contexto de dívida, refere-se ao valor ou quantidade devida. “Quanto” é a formulação portuguesa natural.
- source_word: ὀφείλεις
  choice: você deve
  rationale: O presente ativo tem sentido financeiro direto. “Você deve” é claro, atual e amplamente compreensível.
- source_word: τῷ κυρίῳ μου
  choice: ao meu senhor
  rationale: O referente continua sendo o superior humano do administrador. “Meu senhor” preserva tanto o pronome de primeira pessoa quanto a relação social expressa no grego.
theological_decisions:
- issue: Tradução de κύριος em um contexto doméstico e econômico da parábola
  choice: senhor
  alternative: amo; Senhor
  rationale: O termo se refere ao superior humano do administrador, não a um título divino. Em português, “senhor” comunica adequadamente essa autoridade humana; a inicial minúscula e a nota impedem que seja lido como título cristológico. “Amo” seria possível, mas é menos corrente no português internacional moderno.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Emprega “você” na fala direta por clareza contemporânea e “senhor” com inicial minúscula para o superior humano. A formulação evita tanto o arcaísmo de “amo” quanto uma possível leitura divina de “Senhor”.
