id: LUK.16.8
reference: Luke 16:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: pt
  text: E o senhor elogiou o administrador injusto, porque ele havia agido com astúcia. Pois os filhos desta era são, em relação à sua própria geração[a], mais astutos do que os filhos da luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com a sua própria geração»; possivelmente, «ao lidar com os de sua própria espécie». A expressão grega é difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: o senhor
  rationale: No contexto imediato da parábola, designa mais naturalmente o senhor do administrador. Em português, «o senhor», em minúscula, preserva o termo relacional e evita identificá-lo de modo inequívoco com Jesus ou Deus.
- source_word: οἰκονόμον τῆς ἀδικίας
  choice: administrador injusto
  rationale: «Administrador» é atual e claro para o responsável pelos bens domésticos; «injusto» preserva a avaliação moral ampla de ἀδικία sem restringi-la especificamente à desonestidade.
- source_word: φρονίμως / φρονιμώτεροι
  choice: com astúcia / mais astutos
  rationale: A escolha mantém a ligação lexical entre as duas ocorrências e comunica sagacidade prática sem atribuir aprovação moral ao comportamento.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: os filhos desta era
  rationale: Preserva a metáfora semítica e o contraste formal com «os filhos da luz»; «era» representa αἰών com maior precisão do que «mundo».
- source_word: ὑπὲρ τοὺς υἱοὺς τοῦ φωτός
  choice: do que os filhos da luz
  rationale: Com o comparativo, ὑπέρ introduz naturalmente o segundo termo da comparação.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: com a sua própria geração
  rationale: Mantém a ambiguidade da difícil expressão grega sem acrescentar a ideia mais interpretativa de «ao lidar com»; «com» exprime de modo natural uma relação ou esfera de atuação.
theological_decisions:
- issue: Identidade de ὁ κύριος
  choice: o senhor da parábola
  alternative: o Senhor, isto é, Jesus ou Deus
  rationale: O referente narrativo imediato é o homem rico de 16.1. A grafia minúscula comunica essa leitura contextual sem esconder que κύριος também permite a tradução «Senhor».
- issue: Avaliação moral da conduta do administrador
  choice: elogio da astúcia, não da injustiça
  alternative: aprovação moral de sua conduta
  rationale: O texto mantém deliberadamente a tensão entre «injusto» e «com astúcia». A tradução não suaviza a primeira expressão nem moraliza positivamente a segunda.
- issue: Sentido de εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: relação com sua própria geração, sem especificar além do grego
  alternative: ao lidar com os de sua própria espécie ou no trato com seus contemporâneos
  rationale: A sintaxe é difícil e admite mais de uma delimitação semântica; o texto principal conserva essa abertura e a nota apresenta explicações possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se as imagens «filhos desta era» e «filhos da luz». A repetição de «astúcia/astutos» reproduz a conexão lexical do grego. O marcador [a] aparece no texto principal.
