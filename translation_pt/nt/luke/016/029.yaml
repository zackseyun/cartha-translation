reference: Luke 16:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: pt
  text: 'Mas Abraão disse: “Eles têm Moisés e os Profetas[a]; que os escutem[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Moisés e os Profetas” refere-se ao testemunho das Escrituras associado a Moisés e aos livros proféticos.
    reason: cross_reference
  - marker: b
    text: Ou, mais literalmente, “que os ouçam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Mas Abraão disse
  rationale: O presente histórico λέγει é vertido pelo passado, mais natural na narrativa em português. δέ marca aqui uma resposta levemente contrastiva, bem expressa por “Mas”.
- source_word: Ἔχουσι
  choice: Eles têm
  rationale: Preserva de modo direto o presente do indicativo e a ideia de que os irmãos já dispõem desse testemunho.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Moisés e os Profetas
  rationale: Mantém a expressão judaica concisa em que “Moisés” e “os Profetas” designam metonimicamente o testemunho das Escrituras, sem explicitar essa interpretação no corpo do versículo.
- source_word: ἀκουσάτωσαν
  choice: que os escutem
  rationale: Reproduz de modo natural a força do imperativo aoristo na terceira pessoa do plural e sugere atenção obediente, sem transformar a ordem em mera recomendação.
- source_word: αὐτῶν
  choice: os
  rationale: O pronome retoma “Moisés e os Profetas”. Com “escutar”, o pronome objeto direto é idiomático em português e conserva a referência pessoal da formulação grega.
theological_decisions:
- issue: Referente de “Moisés e os Profetas”
  choice: Manter a expressão literal como metonímia do testemunho autorizado das Escrituras já disponível aos irmãos.
  alternative: Explicitar no texto “a Lei de Moisés e os livros dos Profetas” ou entender a expressão somente como referência às pessoas históricas.
  rationale: O uso judaico e lucano favorece a referência às Escrituras, mas a tradução preserva a forma concreta e a tensão do original, deixando a explicação para a nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mas” preserva o contraste discursivo; “que os escutem” soa natural e mantém a força imperativa. A capitalização de “Profetas” assinala o conjunto reconhecido de escritos, sem ampliar a expressão grega.
