source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: pt
  text: Já sei o que vou fazer para que, quando eu for afastado da administração, eles me recebam em suas casas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Já sei
  rationale: O aoristo de γινώσκω expressa aqui a chegada a uma conclusão. “Já sei” comunica naturalmente a percepção súbita e a decisão resultante.
- source_word: τί ποιήσω
  choice: o que vou fazer
  rationale: O subjuntivo deliberativo indica a ação que o administrador acaba de resolver praticar; a formulação é corrente e clara em português.
- source_word: ἵνα ὅταν
  choice: para que, quando
  rationale: Preserva tanto a finalidade introduzida por ἵνα quanto a circunstância futura indicada por ὅταν.
- source_word: μετασταθῶ
  choice: eu for afastado
  rationale: O passivo de μεθίστημι indica ser removido de uma função. “Afastado” mantém essa ideia sem especificar além do texto a forma da destituição.
- source_word: ἐκ τῆς οἰκονομίας
  choice: da administração
  rationale: οἰκονομία designa aqui o encargo ou função de administrar os bens domésticos, não a economia em sentido moderno.
- source_word: δέξωνταί με
  choice: eles me recebam
  rationale: δέχομαι significa receber ou acolher. “Recebam” preserva a referência à hospitalidade sem explicitar um grau de cordialidade não exigido pelo verbo.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: em suas casas
  rationale: No contexto, οἶκος se refere às casas nas quais ele espera ser hospedado. O reflexivo ἑαυτῶν é expresso naturalmente pelo possessivo “suas”.
