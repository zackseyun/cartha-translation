  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: pt
  text: E, no Hades[a], erguendo os olhos, estando em tormentos, ele vê Abraão de longe e Lázaro no seio de Abraão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no mundo dos mortos”. “Hades” traduz o termo grego para o domínio dos mortos e não é o mesmo termo que “Geena”, associado ao juízo final.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nos seus seios”; tradicionalmente, “no seio de Abraão”. A expressão idiomática indica grande proximidade e acolhimento junto a Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: Hades
  rationale: Mantém o termo grego transliterado e sua distinção em relação à Geena, sem identificar indevidamente a cena com o lugar final de juízo.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: erguendo os olhos
  rationale: Reproduz de modo natural em português a imagem participial do texto grego.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: estando em tormentos
  rationale: Preserva a construção circunstancial e o plural grego, comunicando sofrimento intenso sem acrescentar uma explicação temporal.
- source_word: ὁρᾷ
  choice: ele vê
  rationale: Conserva o presente histórico vívido do grego, em vez de normalizá-lo para o passado.
- source_word: ἀπὸ μακρόθεν
  choice: de longe
  rationale: Expressão corrente e precisa que mantém a separação espacial enfatizada na narrativa.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: junto ao seu peito
  rationale: Comunica em português atual a proximidade íntima expressa por κόλπος, sem a estranheza de reproduzir literalmente o plural; a formulação tradicional é registrada em nota.
theological_decisions:
- issue: Sentido de ᾅδης em uma passagem relacionada ao estado dos mortos e ao juízo
  choice: Hades
  alternative: mundo dos mortos; inferno
  rationale: A transliteração preserva a distinção lexical entre Hades e Geena e evita decidir, por meio da tradução, questões doutrinárias que vão além do versículo.
- issue: Imagem de κόλπος associada ao chamado “seio de Abraão”
  choice: junto ao seu peito
  alternative: no seio de Abraão; ao lado dele
  rationale: A redação principal mantém a imagem corporal em linguagem compreensível, enquanto a nota conserva a expressão tradicional e reconhece que a locução pode indicar proximidade honrosa e íntima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se o presente histórico “vê” e a estrutura participial do grego. As notas preservam tanto a precisão lexical de “Hades” quanto a formulação tradicional ligada a Abraão.
