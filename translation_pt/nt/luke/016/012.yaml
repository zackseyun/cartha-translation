id: LUK.16.12
reference: Luke 16:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: pt
  text: E, se vocês não foram fiéis com o que pertence a outra pessoa,[a][c] quem lhes dará o que é de vocês?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os bens de outra pessoa».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o que pertence a vocês».'
    reason: lexical_alternative
  - marker: c
    text: O contraste pode referir-se à fidelidade no uso das riquezas deste mundo agora e ao recebimento de riquezas verdadeiras ou permanentes depois; o próprio versículo não identifica explicitamente os referentes.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: o que pertence a outra pessoa
  rationale: O adjetivo neutro substantivado indica aquilo que pertence a outro. Esta formulação é natural em português e preserva o sentido possessivo sem definir concretamente o referente.
- source_word: πιστοὶ
  choice: fiéis
  rationale: No contexto de administração de bens, πιστός descreve fidelidade e confiabilidade, não o ato de crer.
- source_word: οὐκ ἐγένεσθε
  choice: não foram
  rationale: A forma de γίνομαι expressa aqui ter-se mostrado ou chegado a ser fiel; «não foram fiéis» comunica isso de modo natural e conciso.
- source_word: τὸ ὑμέτερον
  choice: o que é de vocês
  rationale: O neutro substantivado significa aquilo que pertence aos destinatários. A expressão mantém o contraste com o que pertence a outra pessoa.
- source_word: δώσει ὑμῖν
  choice: lhes dará
  rationale: Traduz diretamente δίδωμι sem introduzir a noção interpretativa de «confiar aos cuidados», embora o contexto seja de administração.
- source_word: καὶ εἰ
  choice: E, se
  rationale: Preserva a ligação com o versículo anterior e introduz claramente a condição.
- source_word: τίς
  choice: quem
  rationale: Reproduz de modo direto e idiomático a pergunta retórica.
theological_decisions:
- issue: Identidade dos referentes de «o que pertence a outra pessoa» e «o que é de vocês»
  choice: Manter os referentes implícitos no texto principal.
  alternative: Explicitar o contraste como riqueza deste mundo versus riquezas verdadeiras, administração terrena versus herança futura, ou bens de outro senhor versus administração própria.
  rationale: O versículo apresenta o contraste sem identificar expressamente seus referentes. Mantê-los implícitos preserva a ambiguidade genuína e evita impor uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural ὑμεῖς. A colocação dos marcadores segue os termos aos quais as notas se referem; a nota interpretativa aparece junto ao primeiro elemento do contraste.
