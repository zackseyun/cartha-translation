reference: Luke 16:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: pt
  text: 'Então o administrador[a] disse consigo mesmo: “Que farei, já que o meu senhor está tirando de mim a administração? Não tenho forças para cavar e tenho vergonha de mendigar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mordomo” e “mordomia”, em lugar de “administrador” e “administração”. O grego emprega termos cognatos para a pessoa e para a função que ela exerce.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: administrador / administração
  rationale: Os termos cognatos gregos designam, respectivamente, a pessoa encarregada dos bens ou negócios de outro e a função sob sua responsabilidade. “Administrador” e “administração” formam um par cognato claro e atual em português.
- source_word: ἐν ἑαυτῷ
  choice: consigo mesmo
  rationale: A expressão idiomática introduz uma reflexão ou fala interior; “disse consigo mesmo” é natural em português.
- source_word: Τί ποιήσω
  choice: Que farei
  rationale: O subjuntivo aoristo deliberativo expressa uma pergunta a respeito da ação futura. “Que farei?” preserva essa deliberação de maneira concisa e dignificada.
- source_word: κύριός
  choice: senhor
  rationale: No contexto da parábola, refere-se ao superior humano do administrador. “Senhor”, em minúscula, comunica a relação de autoridade sem tratá-lo como título divino.
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: está tirando de mim
  rationale: Preserva o aspecto presente e a ideia explícita de retirar do personagem a função que ele exercia.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: não tenho forças para cavar
  rationale: No contexto de trabalho braçal, ἰσχύω ressalta força ou capacidade física; a formulação portuguesa transmite essa nuance.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: tenho vergonha de mendigar
  rationale: ἐπαιτεῖν indica pedir esmolas, e αἰσχύνομαι expressa vergonha diante dessa possibilidade. A tradução é direta e idiomática.
theological_decisions:
- issue: Sentido de κύριος em contexto não divino
  choice: senhor
  alternative: dono
  rationale: O referente é o superior humano dentro da parábola. “Senhor”, grafado em minúscula, preserva a relação pessoal de autoridade e evita tanto restringir o sentido à propriedade quanto introduzir indevidamente um título divino.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. “Que farei?” conserva o tom deliberativo sem soar excessivamente coloquial; “não tenho forças” torna explícita a incapacidade física sugerida pelo contexto.
