  terminology: As maiúsculas em “Lei”, “Profetas” e “Reino de Deus” são adequadas para as categorias escriturísticas em questão. “João” é suficiente no contexto. “Boa notícia” comunica bem o componente lexical de εὐαγγελίζεται.
