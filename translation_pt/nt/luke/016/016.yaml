  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: pt
  text: A Lei e os Profetas vigoraram até João; desde então, o Reino de Deus é anunciado como boa notícia, e todos forçam sua entrada nele.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos avançam com empenho para entrar nele”. O verbo grego pode indicar movimento vigoroso ou forçado.'
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem a oração final de modo mais negativo, à luz de uma declaração semelhante em Mateus 11:12. Aqui, porém, o sujeito gramatical é “todos”, não “o Reino”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: A Lei
  rationale: Designa a Lei mosaica como categoria reconhecida das Escrituras; a inicial maiúscula explicita essa referência ao leitor moderno.
- source_word: οἱ προφῆται
  choice: os Profetas
  rationale: Em paralelo com “a Lei”, designa a seção ou categoria profética das Escrituras, e não apenas profetas individuais.
- source_word: μέχρι Ἰωάννου
  choice: até João
  rationale: Marca um limite temporal; o contexto identifica João como João Batista, sem necessidade de explicitação no corpo do versículo.
- source_word: ἀπὸ τότε
  choice: desde então
  rationale: Expressa com naturalidade a transição temporal e a continuidade a partir daquele momento.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Preserva a formulação tradicional e a amplitude semântica de βασιλεία, que pode envolver tanto reino quanto reinado.
- source_word: εὐαγγελίζεται
  choice: é anunciado como boa notícia
  rationale: Reproduz o presente passivo e torna explícito o componente de boa notícia presente no verbo εὐαγγελίζω, sem restringi-lo ao sentido eclesiástico moderno de “pregar”.
- source_word: πᾶς
  choice: todos
  rationale: O singular distributivo grego tem alcance geral; “todos” é a forma coletiva mais natural em português.
- source_word: εἰς αὐτὴν
  choice: sua entrada nele
  rationale: A construção portuguesa incorpora a ideia de movimento para dentro, e “nele” retoma naturalmente “Reino”.
- source_word: βιάζεται
  choice: forçam sua entrada
  rationale: Conserva o sentido de movimento enérgico ou forçado do verbo médio/passivo, concordando com o sujeito πᾶς e evitando tratar o Reino como sujeito da violência.
theological_decisions:
- issue: Sentido de βιάζεται em relação ao Reino de Deus
  choice: A oração descreve todos forçando sua entrada no Reino.
  alternative: Todos avançam ou se empenham para entrar nele; ou, por comparação com Mateus 11:12, o Reino sofre violência.
  rationale: Em Lucas, πᾶς (“todos”) é o sujeito e εἰς αὐτήν indica movimento para dentro do Reino. A tradução mantém a intensidade e registra em nota tanto uma formulação menos violenta quanto a leitura negativa associada ao paralelo de Mateus.
- issue: Limite temporal da Lei e dos Profetas
  choice: “duraram até João”
  alternative: “foram até João” ou “vigoraram até João”
  rationale: O grego omite o verbo e estabelece de modo conciso um limite temporal. “Duraram” produz português natural sem especificar que a Lei perdeu toda validade, enquanto “vigoraram” acrescentaria uma afirmação mais definida sobre autoridade normativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boa notícia” torna transparente o valor de εὐαγγελίζεται; “forçam sua entrada” preserva deliberadamente a aspereza e a tensão do grego. As maiúsculas em “Lei”, “Profetas” e “Reino de Deus” sinalizam categorias bíblicas reconhecidas.
