  to: A Lei e os Profetas vigoraram até João; desde então, o Reino de Deus é anunciado como boa notícia, e todos forçam sua entrada nele.[a][b]
  rationale: Substituiu-se apenas “duraram” por “vigoraram”, para representar com maior precisão o limite temporal da construção grega e evitar uma possível inferência indevida sobre a cessação da Lei e dos Profetas. Mantiveram-se a tradução deliberadamente forte de βιάζεται e as duas notas, que registram a dificuldade lexical e interpretativa sem resolver a ambiguidade por uma leitura doutrinária.
