  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: pt
  text: 'Então ele clamou: “Pai Abraão, tenha misericórdia de mim e mande Lázaro para que mergulhe a ponta do dedo dele em água e refresque a minha língua, pois estou em agonia nesta chama.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois estou sofrendo nesta chama” ou “pois estou sendo atormentado nesta chama”. O verbo grego pode indicar sofrimento intenso ou tormento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: clamou
  rationale: O particípio aoristo introduz um apelo audível e urgente; “clamou” preserva a intensidade com dignidade narrativa.
- source_word: ἐλέησόν με
  choice: tenha misericórdia de mim
  rationale: Expressa diretamente o pedido de compaixão e conserva a formulação bíblica natural em português.
- source_word: πέμψον
  choice: mande
  rationale: Imperativo simples e idiomático no pedido dirigido a Abraão.
- source_word: βάψῃ
  choice: molhar
  rationale: Embora βάπτω denote literalmente mergulhar, neste contexto a finalidade prática é molhar a ponta do dedo; a escolha produz uma imagem natural sem sugerir imersão extensa.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: a ponta do dedo
  rationale: Reproduz com clareza o sentido concreto de ἄκρον como extremidade.
- source_word: ὕδατος
  choice: na água
  rationale: Complemento idiomático em português após “molhar”, preservando a imagem do grego.
- source_word: καταψύξῃ
  choice: refrescar
  rationale: O verbo indica aliviar pelo resfriamento; “refrescar” é natural para a língua ressequida e mantém a ideia de alívio físico.
- source_word: γλῶσσάν μου
  choice: a minha língua
  rationale: Mantém a referência corporal literal e concreta.
- source_word: ὀδυνῶμαι
  choice: estou sofrendo terrivelmente
  rationale: Comunica sofrimento intenso sem introduzir necessariamente a ideia de um agente que inflige tormento; a nota registra alternativas possíveis.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: nesta chama
  rationale: Preserva o substantivo singular φλόξ e sua imagem vívida, em vez do termo mais amplo “fogo”.
- source_word: Πάτερ Ἀβραάμ
  choice: Pai Abraão
  rationale: Conserva diretamente o vocativo e o apelo à relação ancestral.
theological_decisions:
- issue: Descrição do sofrimento do homem rico
  choice: porque estou sofrendo terrivelmente nesta chama
  alternative: porque estou em agonia nesta chama; porque estou sendo atormentado nesta chama
  rationale: ὀδυνῶμαι denota dor ou aflição intensa, mas não especifica necessariamente um agente do sofrimento. A tradução mantém a severidade sem resolver além do grego a natureza do padecimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada de modo natural, sem perder nenhum elemento semântico importante. O marcador de nota aparece após a frase à qual se refere.
