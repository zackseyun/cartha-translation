base_translation:
  language: en
  yaml_path: translation/nt/luke/016/020.yaml
  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: pt
  text: Um pobre chamado Lázaro tinha sido deixado junto ao seu portão[a], coberto de feridas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tinha sido jogado junto ao seu portão». O verbo grego pode transmitir a ideia de lançar ou jogar, ressaltando o desamparo e o abandono de Lázaro.
    reason: lexical_alternative
  - marker: b
    text: Ou «cheio de feridas». O particípio grego indica que Lázaro estava acometido de chagas ou feridas ulcerosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: pobre
  rationale: Expressa diretamente a condição de pobreza ou indigência sem acrescentar a função social mais específica de mendigo.
- source_word: τις
  choice: um
  rationale: Introduz naturalmente em português uma nova personagem indefinida; «um certo» seria possível, mas menos fluente.
- source_word: ὀνόματι Λάζαρος
  choice: chamado Lázaro
  rationale: Reproduz de modo idiomático a construção dativa que indica o nome da pessoa.
- source_word: ἐβέβλητο
  choice: tinha sido deixado
  rationale: O mais-que-perfeito passivo indica que outros o haviam colocado ali e que ele permanecia nesse estado. «Deixado» preserva sua passividade e possível abandono sem impor no texto principal a força mais dura de «jogado».
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: junto ao portão dele
  rationale: Indica a posição de Lázaro junto à entrada da propriedade. «Dele» retém a referência pronominal ao homem rico no contexto.
- source_word: εἱλκωμένος
  choice: coberto de feridas
  rationale: Comunica em português corrente que Lázaro sofria de chagas ou feridas ulcerosas visíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural tanto no Brasil quanto em outros contextos lusófonos. A construção passiva mantém o desamparo de Lázaro; as alternativas mais literais e fortes são preservadas nas notas.
