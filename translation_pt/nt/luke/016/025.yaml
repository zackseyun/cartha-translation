  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: pt
  text: 'Mas Abraão disse: “Filho, lembre-se de que você recebeu[a] as coisas boas durante a sua vida, e Lázaro, do mesmo modo, as coisas ruins. Agora, porém, ele é consolado aqui, enquanto você está sofrendo intensamente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeu por completo”. O verbo grego pode indicar receber aquilo que cabia a alguém ou receber plenamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está sendo atormentado”. O grego pode indicar dor ou aflição intensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Filho
  rationale: Vocativo afetuoso que expressa vínculo e assimetria sem exigir filiação literal; em português, “Filho” é a forma natural de tratamento neste contexto.
- source_word: μνήσθητι
  choice: lembre-se
  rationale: Imperativo direto e idiomático, correspondente ao chamado à recordação.
- source_word: ἀπέλαβες
  choice: recebeu
  rationale: Preserva o sentido básico do verbo sem impor no texto principal a possível nuance de receber por completo ou receber o que cabia; essa nuance fica registrada em nota.
- source_word: τὰ ἀγαθά σου
  choice: as coisas boas
  rationale: Mantém a amplitude da expressão substantivada e evita introduzir o termo teologicamente mais marcado “bênçãos”.
- source_word: ἐν τῇ ζωῇ σου
  choice: durante a sua vida
  rationale: Expressão temporal clara e natural, referente à vida terrena.
- source_word: ὁμοίως
  choice: do mesmo modo
  rationale: Marca de forma natural o paralelo contrastante entre o rico e Lázaro.
- source_word: τὰ κακά
  choice: as coisas ruins
  rationale: Refere-se às experiências adversas de Lázaro, não ao mal moral praticado por ele; a formulação conserva a generalidade do grego.
- source_word: παρακαλεῖται
  choice: é consolado
  rationale: Neste contexto, a forma passiva indica que Lázaro recebe consolo; “consolado” é claro e digno em português.
- source_word: ὧδε
  choice: aqui
  rationale: Reproduz diretamente o advérbio dêitico que indica o local da cena narrativa.
- source_word: ὀδυνᾶσαι
  choice: está sofrendo intensamente
  rationale: Comunica dor ou aflição severa sem impor a formulação mais interpretativamente carregada “está sendo atormentado”.
theological_decisions:
- issue: Linguagem do sofrimento após a morte
  choice: você está sofrendo intensamente
  alternative: você está sendo atormentado
  rationale: A tradução preserva a realidade e a intensidade do sofrimento consciente descrito no versículo, sem ampliar o alcance lexical de ὀδυνᾶσαι nem resolver além do texto questões doutrinárias sobre a natureza desse sofrimento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece digno e narrativo; “Filho” preserva a ternura do vocativo, e o contraste é apresentado com clareza sem acrescentar interpretação denominacional.
