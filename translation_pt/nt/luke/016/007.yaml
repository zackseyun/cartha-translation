id: LUK.16.7
reference: Luke 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: pt
  text: 'Depois, ele disse a outro: “E você, quanto deve?” Ele respondeu: “Cem coros[a] de trigo”. Ele lhe diz: “Pegue seu documento de dívida[b] e escreva oitenta”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O coro era uma grande unidade de medida para produtos secos, usada aqui para o trigo.
    reason: cultural_note
  - marker: b
    text: Ou “seus documentos” ou “seu contrato escrito”. O grego traz literalmente “seus escritos” (τὰ γράμματα), referindo-se aqui ao registro escrito da dívida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Marca a sequência da ação de modo natural e direto, sem acrescentar uma relação temporal mais específica.
- source_word: ἑτέρῳ
  choice: a outro
  rationale: Indica outra pessoa, distinta do devedor anterior, sem acrescentar que era homem, algo que o grego não explicita.
- source_word: Σὺ δὲ
  choice: E você
  rationale: Preserva a ênfase do pronome e expressa a transição leve de δέ em português corrente.
- source_word: πόσον ὀφείλεις
  choice: quanto deve
  rationale: Expressa de maneira clara e idiomática a dívida financeira indicada por ὀφείλω.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Cem coros de trigo
  rationale: Mantém por transliteração a unidade antiga específica κόρος, enquanto traduz σῖτος pelo termo contextual natural “trigo”.
- source_word: λέγει αὐτῷ
  choice: Ele lhe diz
  rationale: Conserva o presente histórico do grego e sua vivacidade narrativa.
- source_word: Δέξαι
  choice: Pegue
  rationale: Imperativo natural em português para receber ou tomar em mãos o documento.
- source_word: σου τὰ γράμματα
  choice: seu documento de dívida
  rationale: Embora γράμματα seja formalmente plural, no contexto designa a documentação escrita da obrigação; o singular funcional é mais natural em português e “de dívida” esclarece sua natureza sem especificar indevidamente se era conta ou contrato.
- source_word: γράψον ὀγδοήκοντα
  choice: escreva oitenta
  rationale: Segue de perto o comando grego para registrar no documento o novo valor, deixando ao contexto a alteração da quantia.
