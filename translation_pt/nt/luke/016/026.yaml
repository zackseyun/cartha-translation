- from: Além de tudo isso[a], entre nós e vocês foi estabelecido um grande abismo, de modo que os que querem passar daqui para vocês não podem, nem os daí podem atravessar até nós.
  to: Além de tudo isso[a], entre nós e vocês está firmemente estabelecido um grande abismo, de modo que os que querem passar daqui para vocês não podem, nem podem atravessar de lá para nós.
  rationale: A revisão preserva a leitura contextual natural de ἐν πᾶσι τούτοις como uma consideração adicional, mas corrige a alternativa da nota para que reflita com precisão a expressão grega. “Está firmemente estabelecido” representa o perfeito passivo como uma condição fixada e vigente. A segunda cláusula foi ajustada para um português mais natural, preservando a elipse do sujeito, o contraste dêitico “daqui/de lá” e a impossibilidade de travessia em ambos os sentidos.
