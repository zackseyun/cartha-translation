id: LUK.16.26
reference: Luke 16:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: pt
  text: Além de tudo isso[a], entre nós e vocês está firmemente estabelecido um grande abismo, de modo que os que querem passar daqui para vocês não podem, nem podem atravessar de lá para nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em tudo isso”. A expressão grega pode introduzir uma consideração adicional de modo mais idiomático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: Além de tudo isso
  rationale: No contexto, a expressão acrescenta uma consideração ao que já foi dito. Esta formulação é natural em português e mantém a possibilidade de uma tradução mais literal em nota.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: entre nós e vocês
  rationale: Expressa diretamente a separação entre os dois grupos e deixa claro o plural de ὑμῶν em português corrente.
- source_word: χάσμα μέγα
  choice: um grande abismo
  rationale: “Abismo” é claro, digno e comunica uma separação ampla e intransponível sem acrescentar uma descrição topográfica.
- source_word: ἐστήρικται
  choice: foi estabelecido
  rationale: O perfeito passivo descreve algo posto em condição firme e duradoura. “Foi estabelecido” preserva o passivo e o caráter estável da separação.
- source_word: ὅπως
  choice: de modo que
  rationale: Introduz naturalmente a consequência ou finalidade da separação, sem decidir de forma rígida entre essas nuances possíveis.
- source_word: οἱ θέλοντες
  choice: os que querem
  rationale: Reproduz de maneira natural o particípio substantivado e preserva a vontade de atravessar.
- source_word: διαβῆναι
  choice: passar
  rationale: No contexto espacial, “passar daqui para vocês” comunica com naturalidade o movimento de um lado ao outro.
- source_word: ἔνθεν
  choice: daqui
  rationale: Mantém a perspectiva dêitica do falante.
- source_word: μὴ δύνωνται
  choice: não podem
  rationale: Expressa incapacidade, não mera proibição.
- source_word: μηδὲ
  choice: nem
  rationale: Coordena de forma concisa e natural a segunda impossibilidade.
- source_word: ἐκεῖθεν
  choice: daí
  rationale: Mantém o contraste de perspectiva com “daqui” e se refere ao lado dos destinatários.
- source_word: διαπερῶσιν
  choice: podem atravessar
  rationale: “Atravessar” exprime a travessia completa sugerida pelo verbo composto e evita uma repetição rígida.
theological_decisions:
- issue: Natureza da separação entre os dois âmbitos na parábola
  choice: Traduzir a separação como estabelecida e intransponível, sem desenvolver uma formulação doutrinária além do que o versículo afirma.
  alternative: Entender o abismo como uma característica topográfica literal do além, ou tratar toda a linguagem como figura sem implicação de separação fixa após a morte.
  rationale: O texto enfatiza a condição firme do abismo e a incapacidade de atravessá-lo. A tradução preserva essa força sem definir a natureza precisa do cenário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para tornar explícito o plural grego. A redação favorece naturalidade sem enfraquecer a permanência e a impossibilidade expressas no original.
