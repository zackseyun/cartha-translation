id: LUK.16.6
reference: Luke 16:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: pt
  text: 'Ele respondeu: “Cem batos[a] de azeite”. Então o administrador lhe disse: “Pegue seu documento de dívida[b], sente-se depressa e escreva cinquenta”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O bato era uma antiga unidade de medida para líquidos. O grego diz literalmente “cem batos de azeite”.
    reason: cultural_note
  - marker: b
    text: Ou “seu contrato escrito” ou “seus documentos”. O grego diz literalmente “seus escritos”; no contexto, trata-se do registro escrito da dívida.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: batos
  rationale: Preserva a unidade líquida antiga específica, em vez de reduzi-la ao sentido genérico de “medidas”; a nota explica o termo ao leitor moderno.
- source_word: ἐλαίου
  choice: azeite
  rationale: Neste contexto, ἔλαιον designa naturalmente azeite de oliva; em português, “azeite” comunica isso com clareza e concisão.
- source_word: Δέξαι
  choice: Pegue
  rationale: O imperativo manda o devedor tomar em mãos o registro; “pegue” é natural e direto em português.
- source_word: τὰ γράμματα
  choice: seu documento de dívida
  rationale: Embora o grego diga literalmente “seus escritos/documentos”, o contexto identifica um registro escrito da dívida. A formulação conserva a natureza documental sem impor a ideia moderna de uma simples fatura.
- source_word: καθίσας
  choice: sente-se
  rationale: O particípio acompanha o imperativo seguinte e é vertido naturalmente como uma ordem coordenada, preservando a sequência das ações.
- source_word: ταχέως
  choice: depressa
  rationale: Expressa diretamente a rapidez exigida e soa natural no comando narrativo.
- source_word: γράψον
  choice: escreva
  rationale: Mantém o verbo concreto do grego sem explicitar além do texto que o valor deveria ser alterado no documento.
- source_word: πεντήκοντα
  choice: cinquenta
  rationale: Equivalente direto do numeral grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Administrador” explicita o referente já estabelecido no contexto e evita a repetição ambígua de “ele”; “documento de dívida” mantém o cenário econômico e a amplitude documental do grego.
