base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: pt
  text: e desejava saciar-se com o que caía da mesa do rico[a]. Mas até os cães vinham e lhe lambiam as chagas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os restos que caíam da mesa do rico”. O grego diz literalmente “do que caía”; “restos” é inferido do contexto da refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: desejava
  rationale: O particípio presente expressa um desejo contínuo e intenso; “desejava” é natural em português e se liga ao contexto narrativo.
- source_word: χορτασθῆναι
  choice: saciar-se
  rationale: O infinitivo passivo indica receber alimento suficiente. “Saciar-se” comunica a ideia de ficar satisfeito pela comida sem acrescentar elementos ausentes do grego.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: com o que caía
  rationale: O particípio substantivado significa literalmente “com/daquilo que caía”. A formulação preserva a continuidade do particípio presente e evita inserir “migalhas” ou “restos” no texto principal.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: da mesa do rico
  rationale: Tradução direta e idiomática; o adjetivo substantivado retoma o homem rico da narrativa.
- source_word: ἀλλὰ καὶ
  choice: Mas até
  rationale: Mantém tanto o contraste introduzido por ἀλλά quanto a ênfase surpreendente de καί.
- source_word: οἱ κύνες
  choice: os cães
  rationale: Equivalente direto, sem suavizar nem especificar indevidamente o tipo de animal.
- source_word: ἐρχόμενοι
  choice: vinham
  rationale: O particípio circunstancial é expresso de modo idiomático como verbo finito; o imperfeito português sugere ocorrência recorrente ou contínua.
- source_word: ἐπέλειχον
  choice: lambiam
  rationale: O imperfeito grego descreve ação contínua ou repetida; “lambiam” preserva esse aspecto.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: suas feridas
  rationale: ἕλκη designa chagas ou lesões ulceradas. “Feridas” é claro e amplamente compreensível, embora menos clínico que “úlceras”.
