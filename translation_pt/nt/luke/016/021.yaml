  - severity: low
    issue: «Feridas» é semanticamente mais amplo que ἕλκη.
    rationale: O termo grego aponta para chagas ou lesões ulceradas. «Chagas» conserva melhor essa especificidade e permanece claro no registro bíblico moderno.
