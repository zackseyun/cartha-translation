review_pass:
  verdict: revise
  source_fidelity: A redação preserva adequadamente o desejo contínuo, o valor imperfectivo de «caía», a referência à mesa do rico e as ações repetidas dos cães. Contudo, «feridas» é mais amplo que ἕλκη, que aqui se refere mais especificamente a chagas/lesões ulceradas. A nota também chama «com o que caía» de formulação literal, embora ἀπό seja, mais estritamente, «de/do que caía».
  naturalness: «Desejava saciar-se com o que caía da mesa do rico» é natural e compreensível em português moderno. «Vinham e lhe lambiam as chagas» mantém o aspecto reiterado e torna inequivocamente claro que as chagas são de Lázaro.
  terminology: «Chagas» traduz ἕλκη com maior precisão que «feridas», sem o tecnicismo excessivo de «úlceras». «Rico» e «cães» são adequados. A alternativa «restos» deve continuar em nota, pois é inferida do cenário de refeição, não explicitada pelo particípio grego.
