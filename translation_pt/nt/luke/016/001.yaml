source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: pt
  text: 'Ele também dizia aos discípulos: “Havia um homem rico que tinha um administrador[a], e esse administrador foi denunciado a ele como alguém que desperdiçava os seus bens[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregado da casa” ou “mordomo”. O termo grego refere-se a alguém a quem se confiava a administração de uma casa, propriedade ou patrimônio.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi acusado perante ele” ou “chegou-lhe uma denúncia contra ele”. O verbo pode indicar uma acusação ou denúncia desfavorável, sem afirmar que a culpa já tivesse sido comprovada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala como parte do desenvolvimento narrativo; em português, “dizia” preserva esse aspecto com naturalidade.
- source_word: δὲ καὶ
  choice: também
  rationale: “Também” representa καί, enquanto a transição marcada por δέ fica naturalmente implícita na fluidez do português.
- source_word: πρὸς τοὺς μαθητάς
  choice: aos discípulos
  rationale: Tradução direta, sem acrescentar o possessivo “seus”, ausente no grego.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Havia um homem rico
  rationale: Forma idiomática em português para introduzir a personagem indefinida da parábola, sem tornar necessário o pouco natural “certo homem”.
- source_word: οἰκονόμον
  choice: administrador
  rationale: Designa alguém encarregado da gestão de uma casa, propriedade ou patrimônio; “administrador” é moderno, claro e adequado ao contexto.
- source_word: οὗτος
  choice: Este
  rationale: Preserva a força referencial do demonstrativo, retomando enfaticamente o administrador.
- source_word: διεβλήθη αὐτῷ
  choice: foi acusado diante dele
  rationale: Mantém a ideia de acusação ou denúncia apresentada ao homem rico e evita a construção pouco idiomática “acusado a ele”.
- source_word: ὡς διασκορπίζων
  choice: de desperdiçar
  rationale: Expressa naturalmente o conteúdo da acusação no contexto de má administração de bens.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: os seus bens
  rationale: Abrange as posses ou propriedades do homem rico, com formulação corrente e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A redação é natural e digna, conserva o aspecto narrativo do imperfeito e não acrescenta o possessivo em “os discípulos”. Os marcadores de nota aparecem junto aos termos a que se referem.
