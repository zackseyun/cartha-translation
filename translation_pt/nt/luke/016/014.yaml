  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: pt
  text: Os fariseus, que amavam o dinheiro, ouviam tudo isso e zombavam dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faziam pouco dele”. O verbo expressa zombaria marcada por desprezo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: ouviam
  rationale: O imperfeito indica ação em curso ou contemporânea à cena; o imperfeito português preserva esse aspecto com naturalidade.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conexão narrativa leve. Em português, a continuidade é natural sem acrescentar um marcador explícito que possa sugerir contraste ou temporalidade mais fortes.
- source_word: ταῦτα πάντα
  choice: tudo isso
  rationale: Retoma de modo idiomático todo o ensino anterior de Jesus.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Designação consagrada e clara para o grupo judaico mencionado nos Evangelhos.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: que amavam o dinheiro
  rationale: Expressa diretamente a característica indicada pelo grego, sem ampliar o sentido para o rótulo mais interpretativo 'gananciosos'.
- source_word: ἐξεμυκτήριζον
  choice: zombavam
  rationale: O imperfeito preserva a ação em curso, e 'zombavam' comunica de modo natural a atitude de escárnio e desprezo.
- source_word: αὐτόν
  choice: dele
  rationale: O pronome retoma Jesus como alvo da zombaria.
theological_decisions:
- issue: Caracterização dos fariseus em φιλάργυροι
  choice: que amavam o dinheiro
  alternative: que eram gananciosos
  rationale: A formulação escolhida mantém a referência explícita ao amor ao dinheiro e sua ligação com o ensino precedente sobre as riquezas, sem substituir a expressão por uma categoria moral mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi ajustada para fluência, preservando a ação contínua dos dois verbos no imperfeito.
