id: LUK.16.13
reference: Luke 16:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: pt
  text: Nenhum servo doméstico pode servir a dois senhores, pois ou odiará um e amará o outro, ou se apegará a um e desprezará o outro. Vocês não podem servir a Deus e a Mamom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às riquezas” ou “ao dinheiro”. O grego usa Mamom, termo que designa as riquezas, aqui tratadas como um senhor rival.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: servo doméstico
  rationale: O termo designa alguém em condição servil dentro de uma casa. “Servo doméstico” preserva o contexto da casa e a relação de sujeição sem reduzir o sentido a um empregado moderno.
- source_word: κυρίοις
  choice: senhores
  rationale: No contexto social da comparação, refere-se àqueles a quem o servo está sujeito. “Senhores” mantém a relação de autoridade e permite o contraste posterior entre Deus e Mamom.
- source_word: δουλεύειν
  choice: servir
  rationale: O verbo expressa serviço em condição de sujeição. “Servir” é natural em português e funciona tanto para os dois senhores da comparação quanto para Deus e Mamom.
- source_word: μισήσει / ἀγαπήσει
  choice: odiará / amará
  rationale: A tradução direta preserva a antítese forte e proverbial do grego, sem abrandá-la para mera preferência.
- source_word: ἀνθέξεται
  choice: se apegará a
  rationale: Expressa a ideia de manter-se firmemente ligado a alguém, com lealdade e compromisso. “Se apegará a” é claro e natural no contraste apresentado.
- source_word: καταφρονήσει
  choice: desprezará
  rationale: Preserva o sentido de tratar com desdém ou pouca consideração e mantém a força do contraste com apegar-se.
- source_word: θεῷ
  choice: Deus
  rationale: É o referente inequívoco do dativo ligado ao verbo “servir”.
- source_word: μαμωνᾷ
  choice: Mamom
  rationale: A transliteração conserva a personificação retórica das riquezas como senhor rival. A nota explica o sentido lexical para leitores que não conhecem o termo.
theological_decisions:
- issue: Tradução de μαμωνᾷ em contraste com θεῷ
  choice: Mamom
  alternative: riquezas; dinheiro
  rationale: O versículo apresenta Deus e Mamom como senhores rivais. Manter “Mamom” preserva essa personificação sem afirmar que se trate literalmente de uma divindade; a nota esclarece que o termo se refere às riquezas ou ao dinheiro.
- issue: Sujeito genérico das formas verbais no singular
  choice: sujeito subentendido retomando “nenhum servo doméstico”
  alternative: repetir “o servo”; empregar uma construção plural
  rationale: As formas verbais portuguesas no singular acompanham o exemplo representativo singular do grego sem exigir um pronome marcado por gênero.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura proverbial e os contrastes fortes do grego foram preservados. O marcador da nota foi colocado imediatamente após “Mamom”, termo ao qual a explicação se refere.
