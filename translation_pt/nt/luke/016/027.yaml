  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: pt
  text: 'Então ele disse: “Peço-te, então, pai, que o envies à casa do meu pai,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Então ele disse
  rationale: δέ é um conectivo leve que faz a narrativa avançar; “então” comunica naturalmente essa progressão em português.
- source_word: Ἐρωτῶ
  choice: Eu te peço
  rationale: ἐρωτάω significa aqui pedir ou solicitar. “Eu te peço” é natural e preserva o sentido básico sem tornar explícita uma súplica mais intensa.
- source_word: σε οὖν
  choice: te ... pois
  rationale: O pronome σε é representado por “te”, e οὖν assinala a continuação ou consequência diante da recusa anterior; “pois” conserva essa ligação argumentativa.
- source_word: πάτερ
  choice: pai
  rationale: É um vocativo dirigido a Abraão como ancestral, não um título divino; por isso, usa-se inicial minúscula.
- source_word: ἵνα πέμψῃς
  choice: que o envies
  rationale: Depois de um verbo de pedido, ἵνα com o subjuntivo introduz o conteúdo solicitado. A construção portuguesa com “que” e subjuntivo preserva essa relação.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome retoma Lázaro no contexto anterior; o pronome objeto masculino é claro e conciso.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: à casa do meu pai
  rationale: A expressão indica o destino e pode referir-se à casa ou ao lar paterno. “À casa do meu pai” é idiomático e mantém a formulação concreta do grego.
theological_decisions:
- issue: Sentido do vocativo πάτερ dentro da parábola
  choice: pai
  alternative: Pai
  rationale: O rico se dirige a Abraão como pai ancestral. A minúscula evita sugerir que ele esteja se dirigindo diretamente a Deus, ideia que o texto não expressa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “Eu te peço” evita rigidez excessiva, enquanto “pois” conserva a ligação inferencial de οὖν. A vírgula final acompanha a continuação sintática da fala no versículo seguinte.
