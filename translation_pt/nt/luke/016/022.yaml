id: LUK.16.22
reference: Luke 16:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: pt
  text: Aconteceu que o pobre morreu e foi levado pelos anjos para o seio de Abraão[a]. O rico também morreu e foi sepultado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para junto de Abraão”. A expressão grega significa literalmente “para o seio de Abraão”, imagem de proximidade, honra e comunhão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Preserva a fórmula narrativa impessoal de Lucas com naturalidade em português. O δέ marca uma transição leve, que não exige aqui um conectivo temporal explícito.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: o pobre morreu
  rationale: Reformula idiomaticamente a construção grega com infinitivo, mantendo πτωχός como “o pobre”, sem acrescentar a ideia mais específica de “mendigo”.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: foi levado pelos anjos
  rationale: Mantém a voz passiva e a agência expressa no grego, em linguagem portuguesa natural.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: para o seio de Abraão
  rationale: Conserva a imagem tradicional e relativamente literal de κόλπος, sem reduzi-la antecipadamente a uma formulação geral sobre o destino após a morte.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: O rico também morreu
  rationale: “Também” representa καί e mantém o paralelo entre a morte dos dois homens; a transição suave de δέ é comunicada pela nova oração, sem conectivo pesado.
- source_word: ἐτάφη
  choice: foi sepultado
  rationale: Tradução direta do passivo de θάπτω, preservando a brevidade da oração.
theological_decisions:
- issue: Sentido de εἰς τὸν κόλπον Ἀβραάμ
  choice: para o seio de Abraão
  alternative: para junto de Abraão
  rationale: A formulação principal preserva a metáfora cultural e teologicamente carregada de proximidade, honra e comunhão. A nota oferece a equivalência idiomática sem resolver além do texto a natureza dessa condição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a expressão tradicional “seio de Abraão”, esclarecida por nota, e evita-se acrescentar um marcador temporal inexistente no texto grego.
