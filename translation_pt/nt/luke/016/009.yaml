language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: pt
  text: 'E eu lhes digo: façam amigos para si mesmos por meio da riqueza injusta[a], para que, quando ela acabar[b], eles os acolham nas moradas eternas.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio do Mamom da injustiça”. “Mamom” é a forma tradicional de transliterar o termo grego que designa riqueza ou dinheiro.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “quando vocês morrerem” ou “quando ela faltar”. O verbo grego admite mais de uma compreensão neste contexto: muitos o relacionam à riqueza que acaba; outros, à morte da pessoa.'
    reason: alternative_reading
  - marker: c
    text: Ou “nas tendas eternas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: façam amigos para si mesmos
  rationale: Mantém o imperativo e o dativo reflexivo, com formulação natural e clara em português.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: por meio da riqueza injusta
  rationale: “Por meio de” expressa o valor instrumental da construção no contexto. “Riqueza injusta” preserva a amplitude de ἀδικία sem restringir a expressão apenas a dinheiro obtido por fraude.
- source_word: μαμωνᾶ
  choice: riqueza
  rationale: Comunica com clareza o sentido de bens ou dinheiro, evitando que o tradicional “Mamom” seja indevidamente entendido como personificação obrigatória neste versículo.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: para que, quando ela acabar
  rationale: O antecedente contextual mais provável é “riqueza”. “Acabar” expressa a transitoriedade dos recursos, enquanto a nota conserva outras possibilidades sintáticas.
- source_word: δέξωνται ὑμᾶς
  choice: eles os acolham
  rationale: “Acolham” comunica recepção hospitaleira no lugar mencionado a seguir. O sujeito plural permanece sem identificação explícita, como no grego.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: nas moradas eternas
  rationale: “Moradas” transmite de modo natural a ideia contextual de lugares de habitação; a imagem literal de tendas é preservada em nota.
theological_decisions:
- issue: Sentido de “riqueza injusta”
  choice: riqueza pertencente à presente ordem marcada pela injustiça, sem limitar a expressão a bens adquiridos fraudulentamente
  alternative: riqueza obtida de modo desonesto; Mamom personificado como senhor rival
  rationale: A expressão grega é ampla. A tradução preserva sua tensão moral sem afirmar que toda a riqueza em vista tenha sido roubada nem impor uma personificação.
- issue: Sujeito de ἐκλίπῃ
  choice: a riqueza acaba
  alternative: vocês falham, isto é, morrem; os recursos simplesmente se esgotam
  rationale: μαμωνᾶ é o referente contextual mais próximo e provável, mas o verbo grego não traz sujeito expresso; por isso, as outras leituras são registradas em nota.
- issue: Identidade dos que acolhem
  choice: não identificada
  alternative: os amigos feitos mediante o uso da riqueza; os pobres ou o povo de Deus; seres celestiais
  rationale: O grego deixa implícito o sujeito de δέξωνται. O pronome “eles” conserva essa indefinição em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A formulação conserva as ambiguidades sobre quem acolhe e, em nota, sobre o sujeito de “acabar”; evita linguagem denominacional e explicações doutrinárias inseridas no texto.
