  source_fidelity: A tradução reproduz adequadamente a ligação explicativa de γάρ («pois»), os «cinco irmãos», as duas orações de finalidade (ὅπως e ἵνα μή), o valor inclusivo de καὶ αὐτοί («eles também») e a descrição τῆς βασάνου como «lugar de tormento». «Os advirta solenemente» expressa de modo apropriado a força contextual de διαμαρτύρηται, sem eliminar sua possível nuance de testemunho.
