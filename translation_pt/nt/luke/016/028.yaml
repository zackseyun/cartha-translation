id: LUK.16.28
reference: Luke 16:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: pt
  text: pois tenho cinco irmãos, para que ele os advirta solenemente[a], a fim de que eles também não venham para este lugar de tormento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dê testemunho solene a eles” ou “os advirta com firmeza”. O verbo grego transmite a ideia de dar testemunho solene ou fazer uma advertência enfática.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: pois tenho
  rationale: γάρ explica o pedido do versículo anterior; “pois” preserva essa ligação, e ἔχω tem o sentido comum de “tenho”.
- source_word: πέντε ἀδελφούς
  choice: cinco irmãos
  rationale: O masculino plural refere-se, neste contexto, a cinco irmãos do sexo masculino.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade do pedido de enviar Lázaro.
- source_word: διαμαρτύρηται
  choice: os advirta solenemente
  rationale: O verbo pode significar testemunhar, advertir ou fazer uma solene declaração. No contexto, a finalidade de evitar o tormento favorece uma advertência urgente, sem apagar a nuance testemunhal.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: a fim de que eles também não venham
  rationale: Expressa finalidade negativa; “também” preserva καί, relacionando o possível destino dos irmãos ao do homem rico.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: para este lugar de tormento
  rationale: “Para” expressa o movimento em direção ao lugar, e “tormento” comunica a intensidade de βάσανος sem acrescentar uma formulação doutrinária além do texto.
theological_decisions:
- issue: Descrição do lugar após a morte na fala do homem rico
  choice: este lugar de tormento
  alternative: este lugar de angústia; este lugar de sofrimento
  rationale: A tradução conserva a descrição experiencial de βάσανος e não amplia o versículo para uma doutrina mais detalhada sobre o além.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A fim de que” evita a repetição imediata de “para que” e preserva a segunda oração de finalidade.
