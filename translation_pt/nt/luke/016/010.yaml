id: LUK.16.10
reference: Luke 16:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: pt
  text: Quem é fiel no pouco também é fiel no muito; e quem é injusto no pouco também é injusto no muito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desonesto”. O termo grego é mais amplo que a desonestidade financeira, embora esse sentido combine com o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: fiel
  rationale: No contexto, descreve alguém confiável ao lidar com o que lhe foi confiado. “Fiel” é natural em português e preserva o paralelismo moral da frase.
- source_word: ἐν ἐλαχίστῳ
  choice: no pouco
  rationale: Expressa a esfera ou circunstância da fidelidade e da injustiça. “No pouco” é idiomático, conciso e mantém o contraste quantitativo com “no muito”.
- source_word: πολλῷ
  choice: no muito
  rationale: O neutro singular indica grande quantidade ou importância em oposição ao que é mínimo. “No muito” reproduz claramente a antítese.
- source_word: ἄδικος
  choice: injusto
  rationale: O termo designa quem age de maneira injusta ou moralmente errada. “Injusto” conserva sua amplitude melhor que “desonesto”, que poderia restringi-lo ao campo financeiro.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: quem é fiel ... quem é injusto
  rationale: Os adjetivos substantivados têm sentido genérico. A construção com “quem” é natural, inclusiva e mantém a força geral da máxima.
- source_word: καὶ
  choice: também; e
  rationale: O primeiro καί de cada afirmação tem valor aditivo, traduzido por “também”; o καί que liga as duas metades é representado por “e”.
theological_decisions:
- issue: Sentido moral de ἄδικος no contexto da administração de bens
  choice: injusto
  alternative: desonesto
  rationale: Embora o contexto imediato envolva bens e dinheiro, a máxima enuncia um princípio moral mais amplo. “Injusto” evita limitar a afirmação à desonestidade financeira.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo compacto. “No pouco/no muito” é amplamente compreensível tanto no Brasil como em outros contextos lusófonos.
