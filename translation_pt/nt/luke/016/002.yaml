  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: pt
  text: 'Então, chamou-o e lhe disse: “Que é isso que ouço a seu respeito? Preste contas da sua administração[a], pois você já não pode administrar[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apresente o relatório da sua gestão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois você já não pode exercer a função de administrador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: chamou-o
  rationale: O particípio aoristo indica uma ação anterior à fala. “Chamou-o” preserva a sequência e soa natural em português, sem especificar além do texto se ele apenas o chamou ou mandou convocá-lo.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Que é isso que ouço a seu respeito?
  rationale: Mantém a forma interrogativa e o tom de censura do grego; “a seu respeito” traduz naturalmente περὶ σοῦ.
- source_word: ἀπόδος τὸν λόγον
  choice: Preste contas
  rationale: No contexto administrativo, λόγος designa a conta ou prestação de contas exigida, e ἀπόδος ordena que ela seja apresentada. A expressão portuguesa “prestar contas” comunica esse sentido de modo claro e idiomático.
- source_word: τῆς οἰκονομίας σου
  choice: da sua administração
  rationale: οἰκονομία refere-se aqui à responsabilidade ou atividade de gerir os bens de outra pessoa. “Administração” é corrente e preserva o sentido funcional sem impor terminologia eclesiástica.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: pois você já não pode administrar
  rationale: 'δύνῃ com o infinitivo expressa capacidade ou possibilidade, enquanto ἔτι negado indica cessação: “já não”. “Administrar” mantém a ligação lexical e conceitual com οἰκονομία.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O tratamento por “você” torna direta a fala do senhor ao administrador; a formulação evita arcaísmos e conserva a linguagem administrativa da parábola.
