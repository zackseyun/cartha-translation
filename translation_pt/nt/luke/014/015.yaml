  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: pt
  text: 'Mas um dos que estavam à mesa com ele, ao ouvir essas coisas, lhe disse: “Feliz aquele que comer pão no Reino de Deus.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado aquele que comer pão no Reino de Deus”. “Comer pão” pode significar compartilhar uma refeição; aqui se preserva a imagem literal.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: ao ouvir
  rationale: O particípio aoristo tem valor temporal e é expresso naturalmente em português, preservando a relação com a fala seguinte.
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição leve e responsiva em relação ao ensino anterior de Jesus.
- source_word: τις τῶν συνανακειμένων
  choice: um dos que estavam à mesa com ele
  rationale: Identifica um convidado não nomeado entre os que compartilhavam a refeição; a formulação natural evita impor à cena a postura antiga de se reclinar.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o demonstrativo plural que retoma as declarações anteriores de Jesus.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Forma narrativa corrente e fiel ao objeto indireto expresso no grego.
- source_word: Μακάριος
  choice: Feliz
  rationale: Em português bíblico contemporâneo, “feliz” comunica a condição favorecida proclamada pela fórmula de bem-aventurança sem sugerir necessariamente mera emoção subjetiva.
- source_word: ὅστις
  choice: aquele que
  rationale: Expressa de modo natural a referência genérica do relativo indefinido neste enunciado proverbial.
- source_word: φάγεται
  choice: comer
  rationale: O infinitivo pessoal dependente de “aquele que” em português traduz naturalmente a referência futura do indicativo futuro grego.
- source_word: ἄρτον
  choice: pão
  rationale: Preserva o substantivo concreto e a imagem literal do grego, embora a expressão possa aludir à participação numa refeição.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no Reino de Deus
  rationale: Tradução direta da locução, sem acrescentar explicitamente a ideia de banquete, que pertence ao contexto e à imagem.
theological_decisions:
- issue: Força de Μακάριος na declaração escatológica
  choice: Feliz aquele que comer pão no Reino de Deus
  alternative: Bem-aventurado aquele que comer pão no Reino de Deus
  rationale: “Feliz” é claro e atual, mas aqui designa uma condição objetiva de favor e privilégio diante de Deus, não apenas um sentimento; a nota registra a alternativa tradicional com maior peso eclesiástico.
- issue: Sentido da refeição no Reino de Deus
  choice: Preservar literalmente “comer pão”
  alternative: participar do banquete no Reino de Deus
  rationale: A cena sugere uma refeição escatológica, mas o texto diz literalmente “comer pão”; a tradução conserva a imagem e deixa a implicação contextual aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Estavam à mesa” comunica naturalmente a refeição sem exigir do leitor conhecimento do costume antigo de comer reclinado; “Reino” recebe inicial maiúscula por convenção editorial.
