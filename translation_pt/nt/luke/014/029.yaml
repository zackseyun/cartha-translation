  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: pt
  text: Caso contrário, depois de lançar um alicerce e não conseguir terminar, todos os que virem poderão começar a zombar dele,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: para que não aconteça que
  rationale: Introduz o resultado indesejado a ser evitado. A formulação conserva a força preventiva e a nuance de possibilidade de μήποτε em português natural.
- source_word: θέντος αὐτοῦ
  choice: depois de lançar
  rationale: O genitivo absoluto indica uma ação anterior à ação principal; «depois de lançar» expressa claramente essa sequência.
- source_word: θεμέλιον
  choice: o alicerce
  rationale: No contexto da construção da torre mencionada no versículo anterior, «alicerce» é corrente e o artigo definido retoma naturalmente o elemento estrutural da obra.
- source_word: μὴ ἰσχύοντος
  choice: não conseguir
  rationale: Aqui ἰσχύω indica capacidade para levar a obra adiante, não apenas força física; «não conseguir» é claro e idiomático.
- source_word: ἐκτελέσαι
  choice: terminar
  rationale: No contexto de uma construção, comunica naturalmente a ideia de levar a obra até o fim.
- source_word: πάντες οἱ θεωροῦντες
  choice: todos os que virem
  rationale: θεωρέω denota ver ou observar. O objeto é deixado implícito, como no grego, e recuperado naturalmente do contexto.
- source_word: ἄρξωνται
  choice: comecem
  rationale: O subjuntivo integra a construção preventiva iniciada por ἵνα μήποτε e preserva o resultado possível.
- source_word: αὐτῷ ἐμπαίζειν
  choice: a zombar dele
  rationale: «Zombar» transmite o sentido de ridicularizar ou escarnecer, em linguagem atual e dignificada.
