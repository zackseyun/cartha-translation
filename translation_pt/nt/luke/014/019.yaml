  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: pt
  text: 'E outro disse: “Comprei cinco juntas de bois[a] e estou indo experimentá-las. Peço que me considere desculpado[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cinco pares de bois” ou “cinco parelhas de bois”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “tenha-me por desculpado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: outro
  rationale: No encadeamento das desculpas dos convidados, designa naturalmente outra pessoa da série.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: cinco juntas de bois
  rationale: ζεῦγος indica um par de animais unidos para o trabalho; “junta de bois” preserva a imagem rural e é expressão corrente em português.
- source_word: ἠγόρασα
  choice: comprei
  rationale: O pretérito perfeito traduz naturalmente o aoristo e apresenta a compra como fato concluído com relevância imediata.
- source_word: πορεύομαι
  choice: estou indo
  rationale: Expressa movimento ou intenção em curso e mantém a urgência da ação.
- source_word: δοκιμάσαι
  choice: experimentá-las
  rationale: No contexto de animais recém-comprados, significa pô-los à prova para avaliar seu desempenho; o pronome feminino retoma “juntas”.
- source_word: ἐρωτῶ σε
  choice: peço que
  rationale: Transmite a solicitação cortês de modo natural em português, sem intensificá-la como súplica.
- source_word: ἔχε με παρῃτημένον
  choice: me considere desculpado
  rationale: Reproduz idiomaticamente a ideia de tratar o falante como já dispensado ou escusado.
