  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: pt
  text: 'E ele lhes disse: “Qual de vocês, se um filho ou um boi cair num poço, não o tirará imediatamente no sábado?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “jumento” em vez de “filho”.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Qual de vocês
  rationale: Forma idiomática e direta de introduzir a pergunta retórica em português.
- source_word: υἱὸς
  choice: um filho
  rationale: Preserva o sentido masculino singular específico do texto grego, sem generalizá-lo para “criança”.
- source_word: βοῦς
  choice: um boi
  rationale: Equivalente corrente e claro para o bovino mencionado no exemplo.
- source_word: φρέαρ
  choice: poço
  rationale: É o sentido mais natural de φρέαρ neste contexto e evita harmonização com passagens que falam de uma cova.
- source_word: πεσεῖται
  choice: cair
  rationale: O futuro grego, dentro da construção hipotética e retórica, é expresso naturalmente em português pelo futuro do subjuntivo após “se”.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Conserva a urgência temporal expressa pelo grego.
- source_word: ἀνασπάσει
  choice: tirará
  rationale: Em combinação com “do poço” implícito pelo contexto, comunica de maneira natural o ato de puxar para fora ou para cima.
- source_word: αὐτὸν
  choice: o
  rationale: Mantém o pronome masculino singular, aplicável gramaticalmente tanto a “filho” quanto a “boi”.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: mesmo em dia de sábado
  rationale: “Em dia de sábado” representa a expressão temporal grega; “mesmo” torna explícita, sem alterar o argumento, a força concessiva da pergunta retórica.
theological_decisions:
- issue: Variação textual no primeiro ser resgatado
  choice: filho ou um boi
  alternative: jumento ou um boi
  rationale: O texto principal segue o SBLGNT fornecido, que lê υἱός (“filho”). A leitura variante é preservada em nota, sem substituir nem harmonizar o texto-base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação de “mesmo” destaca a lógica retórica sem recorrer a linguagem confessional. O marcador de nota aparece após a frase a que se refere.
