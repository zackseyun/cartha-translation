  text: καὶ ἕτερος εἶπεν· Γυναῖκα ἔγημα καὶ διὰ τοῦτο οὐ δύναμαι ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: pt
  text: 'Outro disse: “Casei-me com uma mulher e, por isso, não posso ir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: Outro
  rationale: Introduz mais uma pessoa na sequência de convidados que apresentam desculpas; “Outro” é direto e natural no contexto narrativo.
- source_word: Γυναῖκα
  choice: com uma mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. Como objeto de γαμέω, refere-se à mulher com quem o homem se casou. A construção portuguesa “casar-se com uma mulher” preserva explicitamente o elemento lexical sem recorrer à formulação pouco natural “casei uma esposa”.
- source_word: ἔγημα
  choice: Casei-me
  rationale: O aoristo indica o casamento como fato concluído. O pretérito perfeito português expressa isso de modo natural, sem acrescentar que o casamento foi necessariamente muito recente.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de modo claro e idiomático a relação causal entre o casamento e a alegada impossibilidade de comparecer.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: não posso ir
  rationale: Preserva a alegação de incapacidade. Em português, do ponto de vista de quem foi convidado, “ir” é mais natural que “vir” neste discurso citado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa simples. A tradução mantém explícita a referência à mulher, evita sugerir uma recência não marcada pelo aoristo e emprega “ir” segundo a perspectiva natural do convidado.
