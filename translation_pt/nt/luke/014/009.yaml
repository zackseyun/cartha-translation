source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: pt
  text: 'E aquele que convidou vocês dois virá e lhe dirá: “Dê o seu lugar a este homem”. Então, com vergonha, você começará a ocupar o último lugar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lugar mais baixo”. A expressão grega pode indicar a última posição na ordem e, neste contexto de banquete, o lugar de menor honra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: aquele que convidou vocês dois
  rationale: A construção participial substantivada designa quem fez o convite. “Vocês dois” expressa de modo natural que tanto o ouvinte quanto o outro homem foram convidados.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: virá e lhe dirá
  rationale: O particípio aoristo, ligado ao futuro ἐρεῖ, descreve uma ação anterior ou coordenada; em português corrente, a sequência natural é “virá e lhe dirá”.
- source_word: Δὸς τούτῳ τόπον
  choice: Dê o seu lugar a este homem
  rationale: No contexto do banquete, a ordem exige ceder ao outro convidado o lugar ocupado. “Seu” explicita a relação exigida pelo contexto, e “este homem” traduz naturalmente o demonstrativo masculino.
- source_word: μετὰ αἰσχύνης
  choice: envergonhado
  rationale: A formulação adverbial natural em português preserva a vergonha pública e social expressa por αἰσχύνη, sem reduzi-la a mero constrangimento.
- source_word: ἄρξῃ ... κατέχειν
  choice: você começará a ocupar
  rationale: Mantém o valor incoativo de ἄρξῃ e traduz κατέχειν como ocupar um lugar, sem acrescentar obrigação não explicitamente codificada.
- source_word: τὸν ἔσχατον τόπον
  choice: o último lugar
  rationale: “Último” preserva o sentido básico de ἔσχατος e, no contexto da ordem dos assentos, comunica também a posição de menor honra, mantida em nota como alternativa lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O tratamento alterna corretamente entre o plural inclusivo “vocês dois” e o singular respeitoso “lhe/você”, dirigido ao convidado individual. A pontuação direta favorece a leitura oral.
