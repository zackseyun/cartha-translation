  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: pt
  text: E eis que um certo homem com edema[a] estava diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “hidropisia”. O termo grego refere-se a uma condição de acúmulo anormal de líquido, causando inchaço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples expressa pela conjunção, sem acrescentar uma sequência temporal mais específica.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém a função de chamar a atenção e a vivacidade narrativa; é uma expressão elevada, mas ainda clara e corrente no registro bíblico em português.
- source_word: ἄνθρωπός τις
  choice: certo homem
  rationale: Representa a referência a um indivíduo particular, porém não identificado, expressa por ἄνθρωπος com o indefinido τις.
- source_word: ἦν
  choice: estava
  rationale: Neste contexto, o imperfeito de εἰμί descreve a presença ou posição do homem diante de Jesus; “estava” é a forma natural em português.
- source_word: ὑδρωπικὸς
  choice: que sofria de hidropisia
  rationale: O adjetivo designa uma pessoa afetada por acúmulo anormal de líquido e inchaço. “Sofria de hidropisia” preserva a referência à enfermidade, enquanto a nota esclarece o termo para leitores modernos.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: diante dele
  rationale: Preserva tanto a noção espacial de estar à frente de Jesus quanto o sentido mais amplo de estar em sua presença, sem decidir entre eles.
