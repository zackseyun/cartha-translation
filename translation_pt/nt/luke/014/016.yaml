  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: pt
  text: 'Ele, porém, lhe disse: “Certo homem estava preparando um grande jantar[a] e convidou muita gente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande banquete” ou “uma grande ceia”. O termo grego designa a refeição principal; neste contexto, trata-se de uma refeição formal oferecida por um anfitrião.
