lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ele, porém, lhe disse
  rationale: O pronome retoma Jesus no contexto; δέ marca uma transição ou leve contraste, expresso naturalmente por “porém”, e αὐτῷ por “lhe”.
- source_word: Ἄνθρωπός τις
  choice: Certo homem
  rationale: Preserva o valor indefinido, mas particularizante, de τις e a fórmula narrativa comum da parábola.
- source_word: ἐποίει
  choice: estava preparando
  rationale: O imperfeito apresenta a ação em andamento; no contexto de uma refeição oferecida por um anfitrião, “estava preparando” é natural e evita o literalismo pouco idiomático de “estava fazendo”.
- source_word: δεῖπνον μέγα
  choice: um grande jantar
  rationale: δεῖπνον designa a refeição principal, frequentemente à noite, e μέγα indica sua grandeza ou importância. “Grande jantar” mantém a correspondência lexical sem excluir o caráter de banquete formal.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: e convidou muita gente
  rationale: No contexto de uma refeição, καλέω significa “convidar”. “Muita gente” expressa πολλούς de modo corrente e claro em português.
