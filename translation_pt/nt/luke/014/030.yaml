  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: pt
  text: 'dizendo: “Este homem começou a construir e não conseguiu terminar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Particípio presente ligado ao sujeito implícito do versículo anterior; “dizendo” mantém de modo natural a ligação com a fala de zombaria.
- source_word: ὅτι
  choice: ': “'
  rationale: Aqui introduz o conteúdo direto da fala; em português, dois-pontos e aspas são mais naturais do que uma oração com “que”.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Este homem
  rationale: Reproduz o demonstrativo e o substantivo masculino singular, preservando o tom público e levemente apontado sem acrescentar desprezo.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: começou a construir
  rationale: Expressa de maneira direta e corrente a construção com verbo incoativo e infinitivo, sem inserir um objeto ausente no grego.
- source_word: οὐκ ἴσχυσεν
  choice: não conseguiu
  rationale: No contexto, ἰσχύω indica capacidade efetiva para levar a obra adiante; “não conseguiu” é natural em português e evita restringir o sentido à força física.
- source_word: ἐκτελέσαι
  choice: terminar
  rationale: No contexto de uma construção, significa levar até o fim; “terminar” é claro, corrente e fiel.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão do grego foram preservadas sem produzir uma formulação rígida. Não foi incluída nota para “não teve força suficiente”, pois essa alternativa lexical seria menos adequada ao contexto e não representa uma ambiguidade que precise aparecer na edição.
