  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the slave[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: pt
  text: 'E o senhor disse ao escravo: “Saia pelos caminhos e pelas cercas e obrigue[a] as pessoas a entrar, para que a minha casa fique cheia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insista muito para que entrem”. O verbo grego é forte e pode significar “obrigar” ou “pressionar”, mas, nesta parábola, não implica necessariamente o uso de força física.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: senhor
  rationale: No contexto da parábola, designa o dono da casa. Em português, “senhor” expressa naturalmente essa relação social sem exigir que seja entendido aqui como título divino direto.
- source_word: δοῦλον
  choice: escravo
  rationale: Preserva a condição de sujeição indicada por δοῦλος, sem suavizá-la para “servo” ou “criado”.
- source_word: Ἔξελθε
  choice: Saia
  rationale: O imperativo de ἐξέρχομαι inclui explicitamente o movimento para fora; “Saia” o comunica de modo direto e natural.
- source_word: ὁδοὺς
  choice: caminhos
  rationale: Refere-se às vias fora do núcleo imediato da povoação; “caminhos” combina naturalmente com as cercas e evita a conotação moderna de grandes rodovias.
- source_word: φραγμοὺς
  choice: cercas
  rationale: φραγμός pode indicar cerca, muro ou sebe. “Cercas” é claro em português amplo e evoca os limites das propriedades junto aos caminhos.
- source_word: ἀνάγκασον
  choice: obrigue
  rationale: Mantém a força do imperativo grego, que pode significar compelir, pressionar ou obrigar, sem enfraquecê-lo no texto principal. A nota esclarece que o contexto não exige força física.
- source_word: εἰσελθεῖν
  choice: a entrar
  rationale: Depois de “obrigue”, esta é a construção portuguesa natural e reproduz o movimento para dentro expresso por εἰσέρχομαι.
- source_word: ἵνα γεμισθῇ
  choice: para que ... fique cheia
  rationale: Expressa com naturalidade a finalidade da ordem e preserva a voz passiva do grego.
- source_word: μου ὁ οἶκος
  choice: a minha casa
  rationale: οἶκος indica aqui a casa onde ocorre o banquete; a tradução direta é contextual e idiomática.
theological_decisions:
- issue: Sentido de κύριος na parábola
  choice: senhor
  alternative: Senhor, entendido explicitamente como título divino; ou dono
  rationale: Dentro do mundo narrativo, κύριος é o senhor ou dono da casa. A forma portuguesa “senhor” mantém o papel social e também a possível ressonância teológica da parábola, sem transformá-la em identificação explícita.
- issue: Força de ἀνάγκασον
  choice: obrigue as pessoas a entrar
  alternative: insista para que entrem; pressione-as a entrar
  rationale: O verbo grego é forte e não deve ser silenciosamente suavizado. Ao mesmo tempo, a parábola não especifica violência física; a nota preserva essa tensão e oferece a alternativa contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “As pessoas” explicita o objeto implícito de ἀνάγκασον conforme o contexto, sem restringir sua referência. A colocação “a minha casa” é natural e preserva a ênfase possessiva do grego.
