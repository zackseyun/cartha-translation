source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: pt
  text: 'Pois eu digo a vocês: nenhum daqueles homens que foram convidados provará do meu jantar[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do meu banquete”; tradicionalmente, “da minha ceia”.
    reason: Alternativas lexicais para δεῖπνον.
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu digo a vocês
  rationale: Preserva o valor explicativo de γάρ e a fórmula de discurso direto com ὑμῖν, em português moderno e amplamente compreensível.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: nenhum daqueles homens
  rationale: Mantém a negação enfática e o sentido masculino específico de ἀνδρῶν, além da referência demonstrativa de ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: que foram convidados
  rationale: No contexto de uma refeição, καλέω se refere claramente a receber um convite; esta formulação é mais natural e precisa do que 'chamados'.
- source_word: γεύσεταί
  choice: provará
  rationale: Conserva a imagem literal de γεύομαι, que neste contexto também implica participar da refeição.
- source_word: μου τοῦ δείπνου
  choice: do meu jantar
  rationale: δεῖπνον designa a refeição principal, frequentemente à noite. 'Jantar' é corrente e preserva o possessivo explícito, sem transformar a imagem narrativa em interpretação teológica.
theological_decisions:
- issue: Relação entre a fala do anfitrião e o sentido teológico da parábola
  choice: 'Manter a fala narrativa em primeira pessoa: ''meu jantar''.'
  alternative: Explicitar no texto uma referência ao banquete do Reino.
  rationale: O grego conserva a voz do anfitrião dentro da parábola. A tradução não deve resolver alegoricamente a imagem nem inserir uma identificação teológica ausente do versículo.
- issue: Força de γεύσεταί no contexto da exclusão
  choice: Traduzir literalmente por 'provará'.
  alternative: Traduzir de modo explicativo por 'participará'.
  rationale: '''Provará'' preserva a imagem concreta e sua possível extensão figurada, sem eliminar a tensão entre comer e participar.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. 'A vocês' evita regionalismo excessivo; 'jantar' é atual, enquanto a nota registra as alternativas contextual e tradicional.
