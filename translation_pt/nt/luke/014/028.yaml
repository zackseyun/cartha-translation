  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: pt
  text: Pois qual de vocês, querendo construir uma torre, não se senta primeiro para calcular o custo e ver se tem o necessário para concluí-la?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se tem para a conclusão”, isto é, se dispõe de recursos suficientes para terminar a obra.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Pois qual de vocês
  rationale: A expressão introduz uma pergunta retórica dirigida diretamente aos ouvintes. “Qual de vocês” é natural em português, e “pois” mantém a ligação explicativa de γάρ com o ensino anterior.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: querendo construir uma torre
  rationale: Mantém a forma participial e a imagem concreta do original, com linguagem corrente e clara.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: não se senta primeiro
  rationale: οὐχί dá à pergunta retórica a expectativa de resposta afirmativa, enquanto o particípio καθίσας indica que sentar-se precede o cálculo.
- source_word: ψηφίζει τὴν δαπάνην
  choice: para calcular o custo
  rationale: ψηφίζω designa contar ou calcular; no contexto de uma construção, “calcular o custo” comunica com precisão a estimativa deliberada da despesa.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: e ver se tem o necessário para concluí-la
  rationale: A formulação explicita de modo natural a suficiência de recursos implícita na construção grega e retoma “torre” pelo pronome feminino, sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pergunta retórica e a metáfora da torre foram preservadas; a expressão final foi levemente explicitada para soar natural sem resolver além do que o contexto indica.
