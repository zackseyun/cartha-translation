source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: pt
  text: 'Jesus respondeu aos especialistas na Lei[a] e aos fariseus: “É permitido curar no sábado ou não?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peritos na Lei”. O termo grego se refere a especialistas na Lei judaica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: tomou a palavra e disse
  rationale: A combinação grega introduz uma resposta, embora não haja uma pergunta verbal anterior. A formulação portuguesa conserva a ideia de que Jesus reage à situação e também o verbo de fala, sem recorrer ao pouco natural «respondeu e disse».
- source_word: νομικοὺς
  choice: especialistas na Lei
  rationale: Designa conhecedores da Lei judaica, não advogados no sentido civil moderno. A expressão é clara para leitores atuais e mantém o caráter religioso-jurídico do termo.
- source_word: Φαρισαίους
  choice: fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
- source_word: Ἔξεστιν
  choice: É permitido
  rationale: Expressa aquilo que é lícito ou autorizado. Em português corrente, «é permitido» comunica com clareza a força normativa da pergunta.
- source_word: τῷ σαββάτῳ
  choice: no sábado
  rationale: O dativo tem valor temporal e se refere ao dia de sábado.
- source_word: θεραπεῦσαι
  choice: curar
  rationale: No contexto das curas nos Evangelhos, o verbo indica restaurar a saúde; «curar» é a opção portuguesa direta e habitual.
- source_word: ἢ οὔ
  choice: ou não
  rationale: Reproduz de modo natural e direto o encerramento disjuntivo da pergunta.
theological_decisions:
- issue: Apresentação da questão sobre a Lei do sábado sem antecipar a conclusão de Jesus
  choice: É permitido curar no sábado ou não?
  alternative: É lícito curar no sábado ou não?
  rationale: A tradução mantém a pergunta aberta e sua força normativa, sem acrescentar explicações sobre misericórdia, necessidade ou autoridade que não aparecem neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Especialistas na Lei» evita a associação contemporânea de «advogados» com o direito civil. «Tomou a palavra e disse» transmite naturalmente a construção narrativa grega sem rigidez literal.
