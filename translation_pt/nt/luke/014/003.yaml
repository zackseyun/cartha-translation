revisions:
- from: 'Jesus tomou a palavra e disse aos especialistas na Lei[a] e aos fariseus: “É permitido curar no sábado ou não?”'
  to: 'Jesus respondeu aos especialistas na Lei[a] e aos fariseus: “É permitido curar no sábado ou não?”'
  rationale: A revisão substitui uma formulação que apenas indica que Jesus começou a falar por «respondeu», preservando o valor de ἀποκριθείς sem recorrer à construção pouco natural «respondeu e disse». Também ajusta a alternativa da nota para uma equivalência lexical mais direta. A pergunta permanece aberta e não acrescenta qualquer conclusão teológica.
