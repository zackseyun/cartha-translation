    rationale: Embora a fórmula grega possa introduzir uma reação a uma situação sem pergunta verbal explícita, ἀποκριθείς marca que Jesus responde. «Respondeu» preserva essa nuance de maneira natural em português.
  - severity: low
    issue: A alternativa de nota «intérpretes da Lei» é menos diretamente equivalente a νομικοί.
    rationale: O termo designa especialistas ou peritos na Lei judaica. «Intérpretes» pode ser possível em certos contextos, mas sugere mais especificamente comentadores ou expositores.
  revised_text: 'Jesus respondeu aos especialistas na Lei[a] e aos fariseus: “É permitido curar no sábado ou não?”'
