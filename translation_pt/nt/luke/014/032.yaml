  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: pt
  text: Mas, se não puder, enquanto o outro ainda está longe, envia uma delegação[a] e pede condições de paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma embaixada” ou “enviados”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as coisas relativas à paz”; isto é, as condições que possibilitariam a paz.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Mas, se não puder
  rationale: A expressão retoma a pergunta do versículo anterior sobre a capacidade de enfrentar o outro rei. A explicitação de “puder” torna a ligação natural em português sem alterar o sentido condicional e adversativo.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: enquanto o outro ainda está longe
  rationale: O genitivo absoluto indica uma circunstância simultânea. “O outro” esclarece que αὐτοῦ se refere ao rei adversário, e não ao rei que envia a delegação.
- source_word: πρεσβείαν
  choice: uma delegação
  rationale: O termo designa uma embaixada ou um grupo de enviados. “Delegação” é claro e corrente no contexto diplomático.
- source_word: ἀποστείλας
  choice: envia
  rationale: O particípio aoristo é expresso naturalmente em português por um verbo coordenado, preservando a sequência entre enviar a delegação e fazer o pedido.
- source_word: ἐρωτᾷ
  choice: pede
  rationale: Neste contexto, o verbo significa solicitar, não apenas fazer uma pergunta.
- source_word: τὰ πρὸς εἰρήνην
  choice: condições de paz
  rationale: A expressão significa literalmente “as coisas relativas à paz” e, neste cenário político-militar, refere-se às condições necessárias para alcançar a paz.
