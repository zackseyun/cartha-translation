id: LUK.14.8
reference: Luke 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: pt
  text: Quando alguém convidar você para uma festa de casamento,[a] não ocupe o lugar de honra,[b] pois pode ser que ele tenha convidado alguém mais honrado do que você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para um casamento”. O plural grego pode se referir às celebrações do casamento, especialmente ao banquete.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o lugar de maior honra à mesa. Nas refeições formais da época, era comum os convidados comerem reclinados, e não sentados em cadeiras como hoje.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Quando alguém convidar você
  rationale: Expressa naturalmente em português a situação geral e indefinida introduzida por ὅταν com o subjuntivo, enquanto o contexto de banquete determina o sentido de καλέω como “convidar”.
- source_word: εἰς γάμους
  choice: para uma festa de casamento
  rationale: O plural γάμους pode designar as celebrações nupciais, especialmente o banquete; esta escolha se ajusta ao contexto de lugares à mesa.
- source_word: μὴ κατακλιθῇς
  choice: não ocupe
  rationale: Embora o verbo descreva literalmente reclinar-se à mesa, “ocupar” transmite com naturalidade a ação relevante — tomar determinado lugar — sem sugerir ao leitor moderno uma postura incomum; a nota cultural esclarece o costume.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: o lugar de honra
  rationale: πρωτοκλισία é o lugar principal e mais prestigioso num banquete; “lugar de honra” comunica diretamente sua função social.
- source_word: μήποτε
  choice: pois pode ser que
  rationale: Introduz a possibilidade que fundamenta a advertência, preservando a força cautelar sem usar uma construção excessivamente formal.
- source_word: ἐντιμότερός σου
  choice: alguém mais honrado do que você
  rationale: Mantém a comparação explícita de honra ou prestígio social presente em ἐντιμότερος, sem reduzi-la apenas a fama ou distinção.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: ele tenha convidado
  rationale: O perfeito perifrástico indica um convite já feito e ainda relevante; o subjuntivo português após “pode ser que” expressa naturalmente a possibilidade. “Ele” retoma o anfitrião mencionado de modo indefinido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita o mais coloquial “te convidar” para manter neutralidade regional. “Não ocupe” privilegia a função comunicativa do gesto, enquanto a nota preserva o dado histórico de que os participantes se reclinavam à mesa. Todos os marcadores de nota aparecem no texto.
