review_pass:
  verdict: approve
  source_fidelity: A tradução transmite adequadamente a construção condicional geral de Ὅταν, o convite para as festividades nupciais (εἰς γάμους), a advertência contra tomar o lugar de honra e a possibilidade de o anfitrião já ter convidado alguém de posição mais honrada. «Pode ser que ... tenha convidado» expressa bem, em português, a possibilidade cautelar introduzida por μήποτε com o perfeito perifrástico ᾖ κεκλημένος.
  naturalness: O texto é claro, moderno e de leitura fluente em português de ampla compreensão, com boa legibilidade brasileira. «Quando alguém convidar você» e «não ocupe o lugar de honra» soam naturais sem reduzir indevidamente o sentido social da cena.
  terminology: «Festa de casamento» comunica apropriadamente o sentido festivo/banqueteiro de γάμοι; a nota preserva a alternativa mais ampla. «Lugar de honra» traduz bem πρωτοκλισία. A nota explica de modo suficiente a prática antiga de reclinar-se, que está por trás de κατακλιθῇς, embora o texto use a expressão idiomática «ocupe».
