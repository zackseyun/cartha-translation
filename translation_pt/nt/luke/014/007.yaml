  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: pt
  text: 'Ele contava aos convidados uma parábola, observando como escolhiam os lugares de honra[a], dizendo-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os primeiros lugares”. O grego se refere aos lugares de maior destaque em um banquete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: contou
  rationale: O imperfeito introduz a fala no fluxo narrativo; em português, o pretérito perfeito é a forma mais natural para apresentar a parábola, sem excluir que a fala se desenvolva nos versículos seguintes.
- source_word: δὲ
  choice: não traduzido explicitamente
  rationale: Aqui δέ funciona como conectivo narrativo leve. O encadeamento do contexto em português não exige um marcador como “então” ou “ora”.
- source_word: τοὺς κεκλημένους
  choice: aos convidados
  rationale: O particípio perfeito designa as pessoas que haviam sido convidadas e permaneciam nessa condição; “os convidados” expressa isso de modo natural e conciso.
- source_word: παραβολήν
  choice: uma parábola
  rationale: Mantém o termo característico dos Evangelhos e a categorização dada pelo próprio narrador.
- source_word: ἐπέχων
  choice: ao notar
  rationale: Expressa a observação atenta que motivou a parábola e preserva a relação circunstancial do particípio.
- source_word: πῶς
  choice: como
  rationale: Introduz diretamente o modo de agir observado.
- source_word: τὰς πρωτοκλισίας
  choice: os lugares de honra
  rationale: O termo designa os lugares mais prestigiosos à mesa; esta formulação comunica claramente sua importância social ao leitor moderno.
- source_word: ἐξελέγοντο
  choice: escolhiam
  rationale: O imperfeito retrata uma ação em curso ou repetida. O contexto já deixa claro que escolhiam esses lugares para si, sem necessidade de explicitar a voz média.
- source_word: λέγων πρὸς αὐτούς
  choice: Disse-lhes
  rationale: Transformar o particípio em oração finita evita uma sequência pesada de gerúndios e introduz naturalmente a fala direta, preservando seu sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma cadeia pouco natural de formas subordinadas. O marcador da nota foi ligado a “lugares de honra”, expressão à qual a alternativa lexical efetivamente se refere.
