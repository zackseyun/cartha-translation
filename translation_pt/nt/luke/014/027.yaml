source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: pt
  text: Quem não carrega a sua própria cruz[a] nem vem após mim[b] não pode ser meu discípulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não suporta a sua própria cruz”.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “vem atrás de mim”; compare a expressão comum do discipulado: “segue-me”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Quem
  rationale: O pronome relativo indefinido introduz uma condição geral. “Quem” é natural em português e preserva sua abrangência universal.
- source_word: βαστάζει
  choice: carrega
  rationale: O verbo pode significar “carregar” ou “suportar”. “Carrega” mantém com clareza a imagem concreta de levar uma cruz, sem eliminar seu sentido metafórico.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: a sua própria cruz
  rationale: “Cruz” é a tradução estabelecida de σταυρός, e “sua própria” conserva a ênfase reflexiva de ἑαυτοῦ. A expressão evoca o instrumento de execução e, no contexto, o custo e a vergonha ligados ao discipulado.
- source_word: καὶ ἔρχεται ὀπίσω μου
  choice: nem vem após mim
  rationale: Sob o alcance da negação anterior, καί coordena a segunda condição. “Nem” torna essa relação inequívoca e natural em português; “vem após mim” preserva a imagem espacial e sua associação com o discipulado.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: não pode ser meu discípulo
  rationale: A construção expressa incapacidade ou incompatibilidade, não apenas proibição. Esta formulação é clara e idiomática em português.
- source_word: μαθητής
  choice: discípulo
  rationale: É o termo corrente e preciso nos Evangelhos para quem aprende de um mestre e o segue com compromisso.
theological_decisions:
- issue: Força genérica do reflexivo singular ἑαυτοῦ
  choice: Manter o singular com “a sua própria cruz”
  alternative: Empregar uma formulação plural, como “suas próprias cruzes”
  rationale: O grego apresenta sujeito e reflexivo no singular com sentido representativo. O português permite conservar esse singular sem restringir a declaração aos homens, pois “quem” é genericamente abrangente.
- issue: Alcance da negação sobre os verbos coordenados
  choice: Traduzir οὐ ... καί por “não ... nem”
  alternative: “não carrega ... e vem após mim”
  rationale: No contexto, as duas exigências coordenadas — carregar a cruz e vir após Jesus — pertencem à condição para ser discípulo. “Nem” comunica naturalmente em português o alcance da negação sem transformar a frase em uma afirmação de que a pessoa vem após Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vem após mim” conserva a imagem do texto grego e soa mais solene que “vem atrás de mim”, enquanto as notas registram as principais alternativas lexicais.
