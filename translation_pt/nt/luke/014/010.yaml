id: LUK.14.10
reference: Luke 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: pt
  text: 'Mas, quando você for convidado, vá e ocupe o último lugar[a], para que, quando vier aquele que o convidou, ele lhe diga: “Amigo, passe para um lugar mais acima.” Então você receberá honra diante de todos os que estiverem à mesa com você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “recline-se no último lugar”. Nas refeições formais daquele tempo, os convidados costumavam comer reclinados.
    reason: Esclarece a imagem cultural expressa pelo verbo grego ἀνάπεσε, preservada de modo idiomático no texto principal.
lexical_decisions:
- source_word: κληθῇς
  choice: for convidado
  rationale: No contexto de um banquete, καλέω significa convidar, não apenas chamar.
- source_word: πορευθεὶς ἀνάπεσε
  choice: vá e ocupe
  rationale: O particípio acompanha o imperativo e é expresso naturalmente como duas ações coordenadas. “Ocupe” evita a estranheza de mandar o leitor moderno reclinar-se, enquanto a nota preserva o costume de comer reclinado.
- source_word: τὸν ἔσχατον τόπον
  choice: o último lugar
  rationale: Mantém de perto a imagem espacial do grego e permite entender o lugar como o de menor destaque social, sem explicitar além do texto.
- source_word: ὁ κεκληκώς σε
  choice: aquele que o convidou
  rationale: Traduz de forma transparente o particípio perfeito e evita substituir a expressão original pelo termo mais interpretativo “anfitrião”.
- source_word: Φίλε
  choice: Amigo
  rationale: Equivalente direto e natural do vocativo, preservando o tratamento cordial sem acrescentar um possessivo.
- source_word: προσανάβηθι ἀνώτερον
  choice: passe para um lugar mais acima
  rationale: Conserva tanto o deslocamento quanto a imagem ascendente associada a uma posição de maior honra.
- source_word: δόξα
  choice: honra
  rationale: Neste contexto social, δόξα designa estima ou reconhecimento público, e não necessariamente glória divina.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: diante de todos os que estiverem à mesa com você
  rationale: Preserva o caráter público da honra e comunica naturalmente a cena da refeição; o particípio grego descreve pessoas reclinadas juntas à mesa.
theological_decisions:
- issue: Natureza do ensinamento
  choice: Manter a instrução como uma cena concreta de banquete que também comunica humildade e inversão de honra.
  alternative: Reduzi-la a uma regra de etiqueta ou apresentá-la exclusivamente como promessa escatológica.
  rationale: O versículo sustenta as dimensões social e parabólica sem definir por si só uma aplicação exclusivamente prática ou exclusivamente escatológica.
translation_notes:
  register: Português moderno, digno e acessível, com construções de ampla compreensão e boa legibilidade brasileira. O uso de “você” mantém naturalidade contemporânea; “último lugar” conserva a imagem e a possível nuance de posição menos honrosa.
