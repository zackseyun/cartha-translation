id: LUK.14.21
reference: Luke 14:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: pt
  text: 'Quando o servo voltou, relatou essas coisas ao seu senhor.[a] Então o dono da casa ficou irado e disse ao seu servo: “Saia depressa pelas ruas largas e vielas da cidade e traga para cá os pobres, as pessoas com deficiência,[b] os cegos e os mancos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “patrão”. O termo grego aqui se refere ao superior humano do servo, não a Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “mutilados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: voltou
  rationale: No contexto narrativo, o servo retorna para informar o resultado de sua missão; “voltou” expressa naturalmente essa ideia implícita.
- source_word: δοῦλος
  choice: servo
  rationale: “Servo” comunica com clareza a função doméstica destacada na parábola, sem tornar a condição jurídica do personagem o foco do texto.
- source_word: ἀπήγγειλεν
  choice: relatou
  rationale: O verbo descreve a transmissão de informações a um superior; “relatou” se ajusta à sequência narrativa.
- source_word: κυρίῳ
  choice: senhor
  rationale: Aqui κύριος designa o superior humano do servo, não um título divino; “senhor” preserva a relação expressa pelo termo.
- source_word: ὀργισθεὶς
  choice: ficou irado
  rationale: A formulação apresenta a ira como reação às desculpas relatadas e preserva o valor ingressivo do particípio.
- source_word: οἰκοδεσπότης
  choice: dono da casa
  rationale: Expressa de modo natural o chefe ou proprietário da casa e o distingue do uso anterior de κύριος.
- source_word: πλατείας καὶ ῥύμας
  choice: ruas largas e vielas
  rationale: Mantém o contraste entre vias amplas e vias urbanas estreitas.
- source_word: ἀναπείρους
  choice: pessoas com deficiência
  rationale: É uma expressão moderna, respeitosa e abrangente para pessoas com limitações físicas, sem antecipar indevidamente uma condição específica.
- source_word: χωλοὺς
  choice: mancos
  rationale: Representa diretamente pessoas com dificuldade física para andar e mantém a distinção em relação ao grupo anterior.
theological_decisions:
- issue: Sentido de δοῦλος no ambiente doméstico da parábola
  choice: servo
  alternative: escravo
  rationale: A função do personagem como agente subordinado do chefe da casa está em primeiro plano. “Servo” preserva essa relação sem acrescentar uma ênfase social que o contexto imediato não desenvolve.
- issue: Sentido de κύριος com referente humano
  choice: senhor
  alternative: patrão
  rationale: O referente é o superior humano do servo dentro da parábola. A inicial minúscula evita sugerir um título divino, enquanto “senhor” conserva a amplitude lexical do grego.
- issue: Alcance de ἀνάπηρος
  choice: pessoas com deficiência
  alternative: mutilados
  rationale: O termo pode indicar incapacidade ou dano corporal sem especificar exatamente sua natureza. A tradução principal preserva essa amplitude; a alternativa mais restrita é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fala direta usa imperativos naturais e mantém a urgência de ταχέως. As categorias humanas são apresentadas de modo respeitoso, sem apagar as distinções do texto grego.
