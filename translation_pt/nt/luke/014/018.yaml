  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: pt
  text: 'Mas todos começaram juntos a dar desculpas.[a] O primeiro lhe disse: “Comprei um campo e preciso ir vê-lo. Peço-lhe que me considere dispensado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “começaram todos, de comum acordo, a recusar”. Literalmente, “a partir de uma [só]”; trata-se de uma expressão idiomática que significa “todos juntos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mas
  rationale: Embora καί normalmente seja aditivo, aqui introduz o contraste entre o convite anterior e a recusa dos convidados.
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: começaram a se desculpar
  rationale: A construção indica o início de recusas acompanhadas de justificativas; a forma reflexiva é natural em português e se ajusta aos exemplos seguintes.
- source_word: ἀπὸ μιᾶς ... πάντες
  choice: todos, sem exceção
  rationale: Expressa conjuntamente a totalidade indicada por πάντες e a ação comum do idiomatismo ἀπὸ μιᾶς, sem recorrer a uma formulação artificial.
- source_word: Ἀγρόν
  choice: um campo
  rationale: Tradução direta de um terreno ou extensão de terra, sem acrescentar a ideia mais específica de fazenda.
- source_word: ἠγόρασα
  choice: Comprei
  rationale: O pretérito perfeito português apresenta naturalmente a compra concluída e relevante para a situação.
- source_word: ἔχω ἀνάγκην
  choice: preciso
  rationale: Equivalente português corrente e claro para a expressão de necessidade.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: ir vê-lo
  rationale: Reproduz de modo natural a ação de sair ou ir para ver o campo, sem intensificar ἰδεῖν para 'inspecionar'.
- source_word: ἐρωτῶ σε
  choice: Peço-lhe
  rationale: Mantém explicitamente a fórmula de pedido e seu tom cortês.
- source_word: ἔχε με παρῃτημένον
  choice: que me considere dispensado
  rationale: Expressa idiomaticamente o pedido para que o anfitrião aceite a recusa, preservando o estado resultante do particípio perfeito.
- source_word: ὁ πρῶτος
  choice: O primeiro
  rationale: Tradução direta do ordinal substantivado que inicia a sequência de desculpas.
