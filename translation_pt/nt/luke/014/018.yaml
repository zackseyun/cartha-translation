  source_fidelity: A expressão «sem exceção» traduz adequadamente πάντες («todos»), mas não o idiomatismo ἀπὸ μιᾶς, que exprime ação conjunta («todos juntos», «de comum acordo»), não apenas universalidade. Além disso, em português moderno, «desculpar-se» tende a significar pedir desculpas, podendo ocultar a ideia de apresentar desculpas para recusar.
