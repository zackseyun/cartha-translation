id: LUK.14.22
reference: Luke 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: pt
  text: 'E o servo disse: “Senhor, foi feito o que ordenaste, e ainda há lugar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: servo
  rationale: Em português, “servo” preserva de modo natural a relação de submissão e serviço no contexto da parábola. O termo grego também pode designar um escravo, mas essa explicitação não é necessária no texto principal deste versículo.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo dirige-se ao dono da casa. “Senhor” é natural, mantém a força respeitosa do título e preserva a possível ressonância mais ampla do termo grego.
- source_word: γέγονεν
  choice: foi feito
  rationale: A forma perfeita comunica uma ação concluída cujos resultados permanecem; “foi feito” expressa claramente o cumprimento da ordem.
- source_word: ὃ ἐπέταξας
  choice: o que ordenaste
  rationale: A expressão indica o conteúdo da instrução anterior e preserva a força de autoridade de ἐπιτάσσω.
- source_word: ἔτι
  choice: ainda
  rationale: “Ainda” exprime naturalmente que, mesmo após o cumprimento da ordem, permanece capacidade disponível.
- source_word: τόπος
  choice: lugar
  rationale: No contexto do banquete, “lugar” comunica de modo idiomático que há capacidade para receber mais convidados.
theological_decisions:
- issue: Possível alcance cristológico de Κύριε dentro da parábola
  choice: Senhor
  alternative: patrão
  rationale: O referente imediato é o dono da casa, mas traduzir por “patrão” estreitaria o termo e poderia eliminar uma ressonância deliberadamente aberta. “Senhor” preserva tanto o sentido narrativo quanto a ambiguidade possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “ordenaste” para manter a fala respeitosa e a distinção da segunda pessoa singular presente no grego, sem tornar a frase excessivamente arcaica.
