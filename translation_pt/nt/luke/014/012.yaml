  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: pt
  text: 'Ele dizia também àquele que o havia convidado: “Quando você oferecer um almoço[a] ou um jantar, não convide seus amigos, nem seus irmãos, nem seus parentes, nem vizinhos ricos, para que eles não convidem você também em retribuição[b] e isso se torne uma recompensa para você[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma refeição do meio-dia”. O grego ἄριστον designa uma refeição mais cedo, frequentemente por volta do meio-dia, e não corresponde necessariamente ao café da manhã moderno.
    reason: lexical_alternative
  - marker: b
    text: Ou “convidem você de volta”. O verbo grego significa convidar em troca.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “e você seja retribuído”. Mais literalmente, o grego diz: “e isso se torne uma recompensa para você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Ele dizia também
  rationale: O imperfeito ἔλεγεν é mantido com valor durativo por “dizia”; δέ funciona como conexão leve, dispensando uma conjunção explícita em português, e καί é representado por “também”.
- source_word: τῷ κεκληκότι αὐτόν
  choice: àquele que o havia convidado
  rationale: O particípio perfeito identifica a pessoa que anteriormente convidara Jesus. A formulação é transparente e evita a interpretação adicional presente em “ao anfitrião”.
- source_word: Ὅταν ποιῇς
  choice: Quando você oferecer
  rationale: Com termos de refeição, ποιέω tem sentido idiomático de oferecer ou dar uma refeição, não apenas prepará-la.
- source_word: ἄριστον ἢ δεῖπνον
  choice: um almoço ou um jantar
  rationale: ἄριστον designa a refeição mais cedo, frequentemente ao redor do meio-dia, enquanto δεῖπνον indica a refeição principal, geralmente mais tarde. “Almoço” e “jantar” preservam naturalmente o contraste em português moderno.
- source_word: μὴ φώνει
  choice: não convide
  rationale: Embora φωνέω possa significar literalmente “chamar”, no contexto de uma refeição refere-se claramente ao ato de convidar.
- source_word: τοὺς ἀδελφούς σου
  choice: seus irmãos
  rationale: Mantém a forma masculina plural do grego sem ampliá-la silenciosamente para uma expressão inclusiva.
- source_word: τοὺς συγγενεῖς σου
  choice: seus parentes
  rationale: Equivalente atual e abrangente para συγγενεῖς no contexto familiar.
- source_word: γείτονας πλουσίους
  choice: vizinhos ricos
  rationale: Tradução direta e natural, preservando πλουσίους como qualificador de γείτονας.
- source_word: μήποτε
  choice: para que não aconteça de
  rationale: Expressa a advertência negativa ou eventualidade indesejada de μήποτε de modo corrente, sem recorrer ao mais elevado “para que não suceda que”.
- source_word: ἀντικαλέσωσίν σε
  choice: convidarem você em retribuição
  rationale: O verbo composto indica especificamente convidar alguém em troca ou de volta; “em retribuição” explicita essa reciprocidade.
- source_word: γένηται ἀνταπόδομά σοι
  choice: isso se torne uma recompensa para você
  rationale: Preserva de perto a construção grega, inclusive sua imagem de o convite recíproco tornar-se uma forma de recompensa, sem reduzi-la simplesmente a “você seja pago”.
theological_decisions:
- issue: Natureza da retribuição mencionada por Jesus
  choice: “isso se torne uma recompensa para você”
  alternative: “você seja retribuído”
  rationale: A tradução mantém a formulação concreta e social do texto, sem decidir se “recompensa” deve ser entendida apenas em sentido material, moral ou escatológico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O tratamento “você” torna natural a segunda pessoa singular no discurso direto. A repetição de “nem” conserva a força cumulativa da lista grega, e a construção final deliberadamente retém a tensão da linguagem de reciprocidade e recompensa.
