  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: pt
  text: Se alguém vem a mim e não odeia o próprio pai, a mãe, a esposa, os filhos, os irmãos e as irmãs — e até a própria vida — não pode ser meu discípulo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ama [...] menos”. O verbo significa literalmente “odiar”, mas, neste contexto, expressa a exigência de que a lealdade a Jesus tenha precedência até sobre os vínculos familiares mais próximos; compare com Mateus 10:37.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a própria alma”. Aqui, “vida” reflete o sentido provável de ψυχή no contexto do custo do discipulado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: odeia
  rationale: Conserva o sentido lexical direto e a formulação deliberadamente forte do grego. A possível força comparativa, isto é, amar menos ou subordinar outros vínculos à lealdade a Jesus, é registrada em nota, sem suavizar o texto principal.
- source_word: ἔρχεται πρός με
  choice: vem a mim
  rationale: Reproduz de modo direto e natural o movimento relacional expresso por ἔρχεται πρός με, sem substituir a frase por 'segue-me' ou 'vem após mim'.
- source_word: πατέρα ἑαυτοῦ
  choice: seu próprio pai
  rationale: O adjetivo 'próprio' representa a força pessoal do reflexivo ἑαυτοῦ.
- source_word: γυναῖκα
  choice: mulher
  rationale: Na enumeração familiar, γυνή designa a esposa. 'Sua mulher' é uma expressão corrente e compreensível em português; 'esposa' seria uma alternativa igualmente possível.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: irmãos e irmãs
  rationale: Mantém explicitamente os dois termos, masculino e feminino, presentes no original.
- source_word: ἔτι τε καὶ
  choice: e até
  rationale: Comunica naturalmente a intensificação que introduz o item culminante da lista.
- source_word: ψυχὴν ἑαυτοῦ
  choice: a própria vida
  rationale: No contexto do custo do discipulado, ψυχή aponta para a vida da pessoa, ou para ela mesma, e não exige o sentido mais estreito de uma alma imaterial. A alternativa literal é preservada em nota.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: não pode ser meu discípulo
  rationale: Expressa com naturalidade a incapacidade ou incompatibilidade indicada pela construção grega, e não uma simples proibição.
theological_decisions:
- issue: Se a exigência expressa por μισεῖ deve ser suavizada no texto principal
  choice: Manter 'odeia' no texto principal e explicar em nota a possível força comparativa ou de prioridade.
  alternative: Traduzir no texto principal como 'ama menos' ou 'não prefere menos'.
  rationale: A linguagem de Jesus é intencionalmente contundente. Manter o verbo preserva a tensão do original, enquanto a nota esclarece que, no contexto, a lealdade a Jesus deve ter precedência sobre os vínculos familiares mais íntimos, sem reduzir a fala a hostilidade literal.
- issue: Sentido de ψυχή neste versículo
  choice: Traduzir por 'vida'.
  alternative: Traduzir por 'alma' ou 'a si mesmo'.
  rationale: O contexto trata do custo do discipulado e da entrega da própria vida à lealdade suprema a Jesus. 'Vida' comunica esse sentido em português atual sem impor uma afirmação antropológica mais restrita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da lista e o impacto retórico do original foram preservados. O travessão destaca naturalmente o item culminante, 'a própria vida'. Os marcadores [a] e [b] aparecem no texto principal.
