  text: οἱ δὲ ἡσύχασαν. καὶ ἐπιλαβόμενος ἰάσατο αὐτὸν καὶ ἀπέλυσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/004.yaml
  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: pt
  text: Mas eles ficaram calados[a]. E, tomando-o, Jesus o curou e o mandou embora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permaneceram em silêncio” ou “não disseram nada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o soltou”, “o deixou ir” ou “o dispensou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: O artigo substantivado retoma os interlocutores mencionados anteriormente, e δέ marca o contraste entre a pergunta de Jesus e a falta de resposta deles.
- source_word: ἡσύχασαν
  choice: ficaram calados
  rationale: Neste contexto, o aoristo de ἡσυχάζω indica que eles não responderam. A expressão é natural em português e preserva o caráter pontual da reação.
- source_word: ἐπιλαβόμενος
  choice: segurando o homem
  rationale: O particípio de ἐπιλαμβάνομαι comunica contato físico, isto é, tomar ou segurar alguém. A explicitação de 'o homem' evita uma sequência pouco natural de pronomes sem acrescentar uma identificação ausente do contexto.
- source_word: ἰάσατο αὐτὸν
  choice: o curou
  rationale: ἰάομαι designa cura, aqui física, e αὐτόν retoma o homem enfermo.
- source_word: ἀπέλυσεν
  choice: o mandou embora
  rationale: ἀπολύω pode significar soltar, dispensar ou mandar embora. No contexto narrativo, 'mandou embora' comunica naturalmente que Jesus permitiu que o homem partisse, sem sugerir que estivesse preso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome “Jesus” foi empregado na segunda oração para tornar natural a mudança de sujeito após “eles”, embora o grego use sujeito implícito. A sequência das ações e a fisicalidade de ἐπιλαβόμενος foram preservadas.
