id: LUK.14.11
reference: Luke 14:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: pt
  text: Pois[a] todo aquele[b] que se exalta será humilhado, e aquele que se humilha será exaltado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque”.'
    reason: lexical_alternative
  - marker: b
    text: As formas gregas estão no masculino singular, mas são usadas aqui em sentido genérico.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da instrução anterior e preserva de modo natural a força explicativa da conjunção grega.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: todo aquele que se exalta
  rationale: Reproduz o sentido genérico do particípio substantivado e expressa com clareza a ideia metafórica de elevar a própria posição.
- source_word: ταπεινωθήσεται
  choice: será humilhado
  rationale: Mantém o futuro passivo e o contraste verbal com a exaltação na segunda metade da sentença.
- source_word: καὶ
  choice: e
  rationale: Preserva a coordenação grega; a própria estrutura paralela comunica o contraste.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: aquele que se humilha
  rationale: Expressa naturalmente o particípio substantivado genérico e a ação voluntária de assumir uma posição humilde.
- source_word: ὑψωθήσεται
  choice: será exaltado
  rationale: Mantém o futuro passivo e o paralelismo lexical com “se exalta”, sem explicitar um agente ausente do texto grego.
theological_decisions:
- issue: Agente implícito nos futuros passivos
  choice: Manter “será humilhado” e “será exaltado” sem acrescentar “por Deus”
  alternative: Explicitar “será humilhado por Deus” e “será exaltado por Deus”
  rationale: Embora o contexto bíblico possa sugerir a ação divina, o grego não nomeia o agente; a formulação passiva preserva essa abertura.
- issue: Masculino singular com sentido genérico
  choice: Usar “todo aquele” e “aquele” no texto principal
  alternative: Reformular com “quem” ou uma construção explicitamente neutra
  rationale: A construção portuguesa conserva o singular masculino genérico do grego e o caráter proverbial, enquanto a nota esclarece seu alcance inclusivo.
translation_notes:
  register: Português atual, digno e de leitura natural, com paralelismo direto entre “se exalta/será humilhado” e “se humilha/será exaltado”. O uso de “Pois” conecta o provérbio à instrução precedente sem tornar a frase excessivamente explicativa.
