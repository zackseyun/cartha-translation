  text: Συνεπορεύοντο δὲ αὐτῷ ὄχλοι πολλοί, καὶ στραφεὶς εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: pt
  text: 'Grandes multidões viajavam com ele[a] e, voltando-se, ele lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muitas multidões iam com ele”. O grego destaca que numerosas multidões acompanhavam Jesus durante a viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: viajavam com
  rationale: O imperfeito apresenta uma ação contínua no passado, e o verbo composto expressa que as multidões acompanhavam Jesus durante o percurso. “Viajavam com” é claro e natural, sem acrescentar a ideia específica de discipulado que “seguiam” poderia sugerir.
- source_word: δὲ
  choice: não expresso por palavra separada
  rationale: Aqui δέ funciona como conectivo narrativo suave. A continuidade é transmitida naturalmente em português sem a necessidade de inserir “ora”, “então” ou “mas”, que poderiam dar ao vínculo uma força indevida.
- source_word: αὐτῷ
  choice: com ele
  rationale: O dativo ligado a συμπορεύομαι indica companhia. O pronome preserva a forma grega e seu referente está claro no contexto.
- source_word: ὄχλοι πολλοί
  choice: grandes multidões
  rationale: A expressão indica uma presença numerosa em forma de multidões. “Grandes multidões” é idiomático em português e preserva tanto a pluralidade quanto a dimensão do grupo.
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação simples entre a situação das multidões e a ação seguinte de Jesus.
- source_word: στραφεὶς
  choice: voltando-se
  rationale: O particípio aoristo descreve a ação que antecede imediatamente a fala. “Voltando-se” conserva a sequência narrativa sem especificar além do texto que ele tenha dado uma volta completa.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente narrativo comum e direto do aoristo de λέγω.
- source_word: πρὸς αὐτούς
  choice: lhes
  rationale: O pronome oblíquo marca naturalmente em português os destinatários da fala, retomando as multidões.
theological_decisions: []
