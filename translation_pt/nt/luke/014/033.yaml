id: LUK.14.33
reference: Luke 14:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: pt
  text: Assim, pois, cada um de vocês que não renunciar a tudo o que possui[a] não pode ser meu discípulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não abrir mão de tudo o que possui». O verbo grego pode significar literalmente «despedir-se de» e, aqui, transmite a ideia de renunciar à própria reivindicação sobre os bens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Assim, pois
  rationale: Preserva tanto o valor conclusivo de οὖν quanto a ligação de οὕτως com as comparações anteriores, em formulação natural e digna em português.
- source_word: πᾶς ἐξ ὑμῶν
  choice: cada um de vocês
  rationale: Expressa com clareza a força distributiva e pessoal da frase grega.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: que não renunciar
  rationale: ἀποτάσσομαι pode significar despedir-se ou abrir mão; neste contexto, «renunciar» comunica a ruptura decisiva com a reivindicação sobre os bens sem determinar, por si só, a forma prática dessa renúncia.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: a tudo o que possui
  rationale: O substantivo implícito no particípio substantivado refere-se ao que alguém tem, especialmente seus bens. A formulação é corrente em português e mantém o alcance total de πᾶσιν.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: não pode ser meu discípulo
  rationale: Mantém a força de impossibilidade expressa por οὐ δύναται e a relação pessoal indicada por μου.
- source_word: μαθητής
  choice: discípulo
  rationale: É o termo consagrado e semanticamente adequado no contexto dos Evangelhos, abrangendo aprendizado e seguimento.
theological_decisions:
- issue: Natureza da exigência relativa aos bens
  choice: Traduzir como renúncia a tudo o que a pessoa possui, preservando a ideia de abrir mão de sua reivindicação sobre os bens.
  alternative: «não abrir mão de tudo o que possui», com possível ênfase em abandono ou despojamento material literal.
  rationale: O verbo grego comporta a ideia de despedir-se e renunciar. «Renunciar» conserva a severidade da exigência sem definir de antemão se ela requer, em toda circunstância, a alienação física de cada bem; a tensão teológica permanece aberta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. «Cada um de vocês» evita a necessidade de reproduzir o masculino singular genérico de ἑαυτοῦ, sem perder a aplicação individual. A redação mantém tom direto, solene e acessível.
