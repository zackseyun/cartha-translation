id: LUK.14.1
reference: Luke 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: pt
  text: Aconteceu que, em um sábado, ele entrou na casa de um dos líderes dos fariseus para comer pão[a], e eles o observavam atentamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para tomar uma refeição”; literalmente, “comer pão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o vigiavam de perto”; o grego pode sugerir uma observação suspeitosa ou hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual, sem recorrer ao arcaico “sucedeu que”.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: ele entrou
  rationale: A construção com infinitivo articulado tem valor temporal. Com “Aconteceu que”, a forma finita produz uma frase natural; a relação temporal é expressa pelo contexto da entrada e da refeição.
- source_word: οἶκόν
  choice: casa
  rationale: Equivalente direto e natural para o local da refeição oferecida.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: um dos líderes dos fariseus
  rationale: ἀρχόντων designa figuras de liderança ou autoridade. “Líderes” comunica essa posição sem sugerir necessariamente um cargo civil específico.
- source_word: σαββάτῳ
  choice: em um sábado
  rationale: O dativo é temporal. O artigo indefinido reflete naturalmente o substantivo grego sem artigo e apresenta um sábado específico dentro da narrativa.
- source_word: φαγεῖν ἄρτον
  choice: para comer pão
  rationale: Mantém a expressão concreta do grego, que funciona idiomaticamente no sentido de tomar uma refeição; a nota esclarece esse uso.
- source_word: παρατηρούμενοι
  choice: o observavam atentamente
  rationale: Expressa observação cuidadosa e sustentada, preservando a possível tensão ou suspeita sem afirmar explicitamente uma intenção hostil.
- source_word: αὐτοὶ
  choice: eles
  rationale: O pronome explícito preserva a mudança de sujeito e parte da ênfase do grego sem produzir uma formulação artificial como “eles mesmos”.
theological_decisions:
- issue: Possível hostilidade na observação de Jesus pelos fariseus
  choice: o observavam atentamente
  alternative: o vigiavam de perto
  rationale: O verbo παρατηρέω pode sugerir vigilância suspeitosa ou hostil, mas o versículo não declara diretamente a motivação. A redação escolhida mantém a tensão narrativa sem transformar a implicação em acusação explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, mantendo a fórmula narrativa, a circunstância do sábado, o cenário doméstico e a tensão da observação.
