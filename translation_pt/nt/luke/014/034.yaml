base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: pt
  text: Portanto, o sal é bom; mas, se até o sal perder o sabor[a], com que será temperado?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego pode significar literalmente “tornar-se insensato”, mas, aplicado ao sal, indica que ele se torna insípido, isto é, perde o sabor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: é bom
  rationale: Expressa a avaliação positiva geral do sal de modo natural, sem restringir o sentido a utilidade ou qualidade estética.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a força inferencial que liga o provérbio ao ensino precedente; em português atual, é claro e digno.
- source_word: ἅλας
  choice: sal
  rationale: Mantém literalmente a imagem proverbial do texto grego.
- source_word: ἐὰν δὲ καὶ
  choice: mas, se até
  rationale: 'Reproduz tanto o contraste de δέ quanto a ênfase de καί: até o próprio sal pode perder sua qualidade característica.'
- source_word: μωρανθῇ
  choice: perder o sabor
  rationale: No contexto do sal, o verbo tem sentido idiomático de tornar-se insípido. A formulação é natural em português e preserva o processo expresso pela forma verbal.
- source_word: ἐν τίνι
  choice: com que
  rationale: É a maneira idiomática de indicar o meio ou instrumento na pergunta retórica.
- source_word: ἀρτυθήσεται
  choice: será temperado
  rationale: Mantém a metáfora culinária de ἀρτύω e a forma passiva, sem interpretar o verbo como uma restauração espiritual explícita.
theological_decisions:
- issue: Força metafórica da declaração sobre o sal
  choice: Manter literalmente o provérbio, sem explicitar sua aplicação ao discipulado.
  alternative: Expandir interpretativamente, falando de discípulos que perdem sua característica distintiva.
  rationale: O contexto fornece a aplicação, enquanto o versículo conserva a imagem concreta. A tradução não deve resolver a tensão metafórica no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Portanto” conserva a conexão argumentativa; “perder o sabor” soa mais natural do que “tornar-se insípido” no texto principal, enquanto a nota registra a particularidade lexical do grego.
