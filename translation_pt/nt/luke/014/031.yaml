  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: pt
  text: Ou que rei, indo enfrentar outro rei numa guerra, não se senta primeiro para avaliar se, com dez mil, é capaz de fazer frente ao que vem contra ele com vinte mil?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz a segunda comparação retórica e preserva de modo natural a continuidade do discurso.
- source_word: τίς βασιλεὺς
  choice: que rei
  rationale: Formulação idiomática em português para uma pergunta retórica de sentido genérico.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: indo enfrentar outro rei numa guerra
  rationale: Expressa o movimento intencional rumo ao confronto militar; “enfrentar” comunica com clareza o valor contextual de συμβάλλω sem acrescentar detalhes.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: não se senta primeiro para avaliar
  rationale: A pergunta espera resposta afirmativa. A construção preserva tanto a ação prévia de sentar-se quanto a deliberação cuidadosa.
- source_word: εἰ δυνατός ἐστιν
  choice: se ... é capaz
  rationale: Mantém a ideia de capacidade efetiva e a forma indireta da deliberação.
- source_word: ἐν δέκα χιλιάσιν
  choice: com dez mil homens
  rationale: A preposição tem sentido associativo ou instrumental, indicando a força disponível. “Homens” explicita naturalmente que se trata de combatentes, implícitos no contexto militar.
- source_word: ὑπαντῆσαι
  choice: fazer frente
  rationale: O verbo significa literalmente ir ao encontro, mas, neste contexto militar, indica enfrentar ou resistir ao exército que avança. “Fazer frente” evita a repetição de “enfrentar” e mantém o sentido de oposição.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: ao que vem contra ele com vinte mil
  rationale: Reproduz a descrição do rei adversário em avanço hostil e preserva o contraste numérico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura retórica e o contraste entre dez mil e vinte mil foram preservados. Não se acrescentou nota, pois o sentido militar dos verbos fica claro no próprio texto.
