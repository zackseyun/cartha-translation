review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente o contraste de ἀλλά, o valor indefinido/iterativo de ὅταν com subjuntivo e o imperativo de convite. Contudo, ἀναπείρους designa especificamente pessoas com impedimentos físicos; «pessoas com deficiência», sem qualificativo, é mais amplo no português atual e pode abranger também a cegueira, que o grego enumera separadamente.
  naturalness: O texto é claro, contemporâneo e de ampla compreensão. «Você der um banquete» e «convide» são naturais no registro visado. A retirada da vírgula após «Mas» torna a abertura um pouco mais fluida.
  terminology: «Pessoas com deficiência física» é uma forma atual e respeitosa que explicita o campo semântico corporal de ἀναπείρους. «Mancos» preserva a categoria distinta de χωλούς, e «cegos» traduz diretamente τυφλούς. A nota mantém «aleijados» apenas como alternativa lexical tradicional, identificando adequadamente seu alcance histórico.
  issues:
  - severity: low
    issue: «Pessoas com deficiência» é semanticamente mais amplo que ἀναπείρους.
    rationale: Sem «física», a expressão portuguesa pode incluir deficiência visual, enquanto τυφλούς («cegos») aparece como categoria distinta na lista grega. O qualificativo melhora a precisão sem introduzir uma interpretação doutrinária.
  - severity: low
    issue: Vírgula após «Mas».
    rationale: Em «Mas sempre que...», a vírgula não é necessária e sua omissão produz uma construção mais natural, sem alterar o sentido.
  revised_text: Mas sempre que você der um banquete[a], convide os pobres, as pessoas com deficiência física[b], os mancos e os cegos.
  revised_footnotes:
