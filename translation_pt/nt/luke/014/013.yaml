  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: pt
  text: Mas sempre que você der um banquete[a], convide os pobres, as pessoas com deficiência física[b], os mancos e os cegos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferecer uma festa” ou “promover uma recepção”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os aleijados”. O termo grego se refere a pessoas com limitações físicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Conjunção adversativa que contrasta esta orientação com a instrução anterior sobre quem não convidar.
- source_word: ὅταν
  choice: sempre que
  rationale: A construção com o subjuntivo indica uma ocasião indefinida ou recorrente; “sempre que” conserva essa força.
- source_word: δοχὴν ποιῇς
  choice: você der um banquete
  rationale: A expressão idiomática significa oferecer ou realizar uma recepção festiva; “der um banquete” é natural e preserva o contexto de hospitalidade.
- source_word: κάλει
  choice: convide
  rationale: No contexto de uma refeição, καλέω significa convidar, não apenas chamar.
- source_word: πτωχούς
  choice: os pobres
  rationale: Mantém de modo conciso o adjetivo substantivado e a estrutura da lista grega.
- source_word: ἀναπείρους
  choice: as pessoas com deficiência
  rationale: Designa pessoas com limitações físicas. A formulação é clara, atual e respeitosa, sem confundir o termo com χωλούς, que se refere especificamente à dificuldade de andar.
- source_word: χωλούς
  choice: os mancos
  rationale: Refere-se especificamente a pessoas com dificuldade ou incapacidade para andar e preserva a distinção em relação ao termo anterior.
- source_word: τυφλούς
  choice: os cegos
  rationale: Equivalente português direto e conciso do adjetivo substantivado grego.
theological_decisions:
- issue: Linguagem para os grupos com deficiências físicas
  choice: “as pessoas com deficiência, os mancos e os cegos”
  alternative: “os aleijados, os mancos e os cegos”
  rationale: A tradução mantém distintos os três grupos nomeados no grego, sem suavizar a inclusão social exigida pelo ensino, mas emprega para ἀναπείρους uma expressão moderna e respeitosa. A nota registra uma alternativa mais literal ou tradicional.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. O tratamento por “você” é natural e direto. A enumeração conserva a concisão e a força inclusiva do original, enquanto “pessoas com deficiência” evita uma designação hoje frequentemente considerada pejorativa.
