  text: And they were not able to reply to these things[a].
translation:
  language: pt
  text: E eles não conseguiram responder a essas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “responder a isso” ou “dar uma resposta a essas coisas”. O grego emprega uma expressão no plural, literalmente “a essas coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção coordenativa simples, que mantém a continuidade com o contexto anterior sem acrescentar nuance temporal ou conclusiva.
- source_word: οὐκ ἴσχυσαν
  choice: não conseguiram
  rationale: Neste contexto, ἰσχύω expressa capacidade, não força física. A forma natural em português comunica que eles foram incapazes de responder.
- source_word: ἀνταποκριθῆναι
  choice: responder
  rationale: O infinitivo indica dar uma resposta ao que foi dito ou feito. “Responder” preserva esse sentido sem sugerir indevidamente insolência ou confronto.
- source_word: πρὸς ταῦτα
  choice: a essas coisas
  rationale: Preserva o demonstrativo plural do grego e indica que a resposta seria dada em relação ao que acabara de acontecer e ser dito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação mantém o plural do original, embora “responder a isso” seja mais idiomático em muitos contextos.
