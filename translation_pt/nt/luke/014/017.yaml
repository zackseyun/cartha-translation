  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: pt
  text: 'E, na hora do jantar, ele enviou seu servo para dizer aos que tinham sido convidados: “Venham, pois tudo já está pronto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Traduz diretamente o aoristo de ἀποστέλλω e soa natural no contexto do envio de um mensageiro.
- source_word: δοῦλον
  choice: servo
  rationale: No contexto doméstico da parábola, destaca adequadamente a função do δοῦλος sem tornar sua condição jurídica o foco da frase; “escravo” continua sendo uma alternativa lexical possível.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: na hora do jantar
  rationale: Preserva a expressão temporal específica e traduz δείπνον de modo corrente e amplamente compreensível.
- source_word: εἰπεῖν
  choice: para dizer
  rationale: Expressa naturalmente a finalidade do envio e introduz bem a fala direta.
- source_word: τοῖς κεκλημένοις
  choice: aos que tinham sido convidados
  rationale: 'O mais-que-perfeito composto transmite o estado resultante e a anterioridade do particípio perfeito passivo: eles já haviam recebido o convite antes desta convocação.'
- source_word: Ἔρχεσθε
  choice: Venham
  rationale: Imperativo plural natural em português, preservando a convocação dirigida aos convidados.
- source_word: ὅτι
  choice: pois
  rationale: Introduz de maneira natural a razão da convocação; “porque” também seria possível, mas soa um pouco menos fluido depois do imperativo neste contexto.
- source_word: ἤδη
  choice: já
  rationale: Preserva a ênfase temporal de que os preparativos estão concluídos nesse momento.
- source_word: ἕτοιμά ἐστιν
  choice: tudo está pronto
  rationale: O adjetivo neutro plural com verbo no singular tem valor coletivo e sujeito implícito. “Tudo está pronto” reproduz esse sentido de forma idiomática, sem restringi-lo apenas à comida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e corrente, com boa legibilidade brasileira e compreensão internacional. A construção “tudo já está pronto” torna explícito apenas o mínimo exigido pelo idioma para representar a expressão coletiva grega de sujeito implícito.
