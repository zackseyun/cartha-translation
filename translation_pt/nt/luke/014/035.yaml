source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: pt
  text: Não serve nem para o solo nem para o monte de esterco[a]; jogam-no fora. Quem tem ouvidos para ouvir[b], ouça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a esterqueira”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Aquele que tem ouvidos para ouvir, que ouça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: o solo
  rationale: No contexto agrícola da comparação sobre o sal, refere-se ao solo cultivável, não à terra em sentido cósmico.
- source_word: κοπρίαν
  choice: o monte de esterco
  rationale: Expressa de modo claro e concreto o esterco acumulado para uso agrícola; a nota registra uma alternativa natural.
- source_word: εὔθετόν
  choice: serve
  rationale: Comunica em português corrente a ideia de ser adequado ou útil para determinada finalidade, sem ampliar o sentido.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: jogam-no fora
  rationale: Preserva a construção ativa com sujeito plural indefinido e traduz ἔξω idiomaticamente como parte da locução portuguesa 'jogar fora'.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Quem tem ouvidos para ouvir, ouça
  rationale: Mantém a fórmula proverbial, a finalidade indicada pelo infinitivo e a força imperativa, em português natural e inclusivo por estrutura, sem perder o singular genérico.
theological_decisions:
- issue: Singular masculino representativo na exortação final
  choice: Quem tem ouvidos para ouvir, ouça
  alternative: Aquele que tem ouvidos para ouvir, que ouça
  rationale: O particípio masculino singular grego tem função genérica. 'Quem' preserva essa referência representativa e o verbo singular, sem introduzir marca de gênero desnecessária em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Não serve' é mais natural que 'não é adequado' nesta imagem concreta; 'jogam-no fora' conserva a voz ativa e evita tom arcaico.
