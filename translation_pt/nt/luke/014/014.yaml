id: LUK.14.14
reference: Luke 14:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: pt
  text: E você será feliz[a], porque eles não têm como lhe retribuir[b]; pois você será recompensado na ressurreição dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bem-aventurado”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, não dispõem de meios para retribuir.
    reason: lexical_clarification
lexical_decisions:
- source_word: μακάριος
  choice: feliz
  rationale: “Feliz” comunica de modo claro e atual a condição favorecida por Deus, sem limitar o termo a um sentimento passageiro; a nota registra a alternativa tradicional “bem-aventurado”.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: eles não têm como lhe retribuir
  rationale: A expressão preserva a forma idiomática do grego, que literalmente diz que eles “não têm” como retribuir, e evita a leitura equivocada de que não possuem obrigação de fazê-lo.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: pois você será recompensado
  rationale: O futuro passivo expressa a recompensa que a pessoa receberá; “pois” mantém a função explicativa de γάρ e “recompensado” soa natural em português.
- source_word: ἐν τῇ ἀναστάσει τῶν δικαίων
  choice: na ressurreição dos justos
  rationale: “Na ressurreição” é idiomático em português como referência temporal, e “dos justos” conserva a relação genitiva sem definir além do texto a estrutura dos acontecimentos futuros.
theological_decisions:
- issue: Sentido de “a ressurreição dos justos”
  choice: Manter a expressão como referência futura à ressurreição associada aos justos.
  alternative: Entendê-la como ênfase nos justos dentro de uma ressurreição geral, ou como uma ressurreição distinta da dos demais.
  rationale: O versículo afirma a futura recompensa divina na ressurreição dos justos, mas não especifica a relação cronológica dessa ressurreição com qualquer outra; a tradução não resolve esse debate.
- issue: Agente implícito da recompensa
  choice: Preservar a construção passiva, “você será recompensado”.
  alternative: Explicitar “Deus o recompensará”.
  rationale: Deus é naturalmente entendido como o agente no contexto, mas não é nomeado nesta oração; o passivo evita acrescentar ao texto uma explicitação interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” para o singular e mantém o paralelismo entre a retribuição humana impossível e a recompensa futura, sem introduzir um esquema escatológico específico.
