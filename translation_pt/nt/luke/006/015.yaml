  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: pt
  text: e Mateus, e Tomé, e Tiago, filho de Alfeu, e Simão, chamado Zelote[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o zeloso”. O título grego pode funcionar como epíteto e, por si só, não exige concluir que Simão fosse membro formal de um movimento político específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa padrão; sua repetição preserva o estilo de enumeração do texto grego.
- source_word: Μαθθαῖον
  choice: Mateus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Μαθθαῖος.
- source_word: Θωμᾶν
  choice: Tomé
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Θωμᾶς.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Tiago, filho de Alfeu
  rationale: Nesta fórmula de identificação, o genitivo Ἁλφαίου indica naturalmente filiação; a explicitação com “filho de” é clara e idiomática em português.
- source_word: Σίμωνα
  choice: Simão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Σίμων.
- source_word: τὸν καλούμενον
  choice: chamado
  rationale: O artigo com o particípio passivo presente tem função atributiva; “chamado” expressa isso de modo natural e conciso numa lista de nomes.
- source_word: Ζηλωτὴν
  choice: Zelote
  rationale: Título identificador tradicional que conserva a possível referência tanto a uma pessoa zelosa quanto a uma associação mais específica, sem decidir a questão histórica.
theological_decisions:
- issue: Se Ζηλωτής deve ser entendido como designação político-religiosa formal ou como epíteto descritivo
  choice: Zelote
  alternative: zeloso
  rationale: “Zelote” mantém o título identificador tradicional sem acrescentar “membro do partido”, enquanto a nota registra que o grego também pode funcionar simplesmente como epíteto descritivo.
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes bíblicos. A repetição de “e” acompanha deliberadamente o ritmo catalogal do grego.
source_grounding:
  english_pob_role: consult_only
