  to: Mas aquele que ouviu e não praticou é semelhante a um homem que construiu uma casa sobre o solo, sem alicerce[a]. Quando o rio bateu contra ela, ela desabou imediatamente, e foi grande a ruína daquela casa[b].
  rationale: A revisão é limitada a duas melhorias seguras de expressão. «Sobre o solo» representa naturalmente a superfície indicada por γῆ, e «quando o rio bateu contra ela» traduz com clareza o impacto violento de προσέρηξεν, preservando a referência à casa. Mantêm-se todas as escolhas semânticas e os marcadores das notas.
