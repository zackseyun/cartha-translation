id: LUK.6.49
reference: Luke 6:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: pt
  text: Mas aquele que ouviu e não praticou é semelhante a um homem que construiu uma casa sobre o solo, sem alicerce[a]. Quando o rio bateu contra ela, ela desabou imediatamente, e foi grande a ruína daquela casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem fundamento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi grande a ruptura daquela casa”. O termo grego pode indicar ruptura, brecha ou ruína resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας
  choice: Mas aquele que ouviu
  rationale: O particípio aoristo com artigo funciona como substantivo. “Aquele que ouviu” preserva o singular representativo e soa natural em português.
- source_word: καὶ μὴ ποιήσας
  choice: e não praticou
  rationale: ποιέω retoma aqui a ação correspondente às palavras de Jesus. “Não praticou” expressa de modo conciso e idiomático a oposição entre ouvir e pôr em prática, sem explicitar na linha principal um objeto apenas implícito.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: é semelhante a um homem
  rationale: Mantém a fórmula comparativa e o singular masculino representativo de ἀνθρώπῳ em linguagem clara e digna.
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν
  choice: que construiu uma casa sobre o chão
  rationale: O aoristo é vertido pelo pretérito perfeito simples. γῆ designa aqui a superfície em que se edificou; “chão” distingue a imagem de uma referência ao planeta ou à terra em sentido amplo.
- source_word: χωρὶς θεμελίου
  choice: sem alicerce
  rationale: “Alicerce” é termo corrente e preciso para θεμέλιος no contexto de construção.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: O rio investiu contra ela
  rationale: O relativo ᾗ retoma a casa. προσρήγνυμι indica impacto violento; “investiu contra” conserva essa força sem transformar ποταμός em “enchente”.
- source_word: καὶ εὐθὺς συνέπεσεν
  choice: e imediatamente ela desabou
  rationale: συμπίπτω descreve adequadamente o desabamento de uma construção, e “imediatamente” preserva εὐθύς.
- source_word: καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: e foi grande a ruína daquela casa
  rationale: ῥῆγμα pode indicar ruptura, brecha ou a ruína resultante. No contexto do desabamento, “ruína” é natural e mantém a gravidade da frase, enquanto “grande” corresponde diretamente a μέγα.
theological_decisions:
- issue: Linguagem masculina representativa na comparação
  choice: um homem
  alternative: uma pessoa
  rationale: O grego emprega ἀνθρώπῳ no singular dentro da figura representativa. “Um homem” preserva a forma da comparação sem limitar a aplicação moral do ensino.
- issue: Natureza da resposta às palavras de Jesus
  choice: não praticou
  alternative: não fez / não as pôs em prática
  rationale: O texto contrasta ouvir e fazer, sem acrescentar uma formulação doutrinária sobre mérito ou salvação. “Praticou” mantém o foco na resposta concreta às palavras ouvidas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem final “foi grande a ruína” conserva a ênfase do grego sem soar excessivamente arcaica. Os marcadores [a] e [b] aparecem no texto principal.
