  source_fidelity: 'O sentido central está bem preservado: o contraste entre ouvir e não agir, a construção sem fundamento, o impacto do rio, o desabamento imediato e a grande ruína correspondem ao grego. Contudo, «o rio investiu contra ela» é menos idiomático para o choque físico expresso por προσέρηξεν, e «sobre o chão» é uma formulação pouco natural neste contexto.'
  naturalness: A redação é clara e de registro apropriado, mas «sobre o solo» e «bateu contra ela» soam mais naturais e precisos em português moderno amplo. A reorganização da oração do rio também evita a sequência um pouco pesada com ponto e vírgula antes de «e».
  terminology: «Não praticou», «um homem», «alicerce» e «ruína» são escolhas adequadas. «Alicerce» comunica bem θεμέλιος, e a nota preserva uma alternativa legítima. «Ruína» é contextual e natural para ῥῆγμα sem eliminar a possibilidade de «ruptura/brecha» na nota.
