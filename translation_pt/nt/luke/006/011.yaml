  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: pt
  text: Mas eles ficaram cheios de fúria insensata[a] e discutiam uns com os outros o que poderiam fazer a Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cheios de loucura” ou “cheios de insensatez”. O termo grego pode indicar irracionalidade, falta de juízo ou uma exaltação descontrolada.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Mas eles
  rationale: A conjunção marca contraste com a ação de Jesus no contexto anterior; o pronome explícito preserva adequadamente a ênfase nos adversários sem tornar o português rígido.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: ficaram cheios de uma fúria insensata
  rationale: Preserva a imagem de plenitude e comunica tanto a falta de bom senso expressa por ἄνοια quanto a reação emocional hostil indicada pelo contexto, sem sugerir necessariamente um diagnóstico clínico.
- source_word: διελάλουν
  choice: discutiam
  rationale: O imperfeito indica uma deliberação em andamento; “discutiam” é corrente e admite o sentido de conversar para decidir algo.
- source_word: πρὸς ἀλλήλους
  choice: uns com os outros
  rationale: Expressa naturalmente a reciprocidade da conversa.
- source_word: τί ἂν ποιήσαιεν
  choice: o que poderiam fazer
  rationale: Representa a potencialidade deliberativa de ἄν com o optativo, sem transformá-la em obrigação.
- source_word: τῷ Ἰησοῦ
  choice: com Jesus
  rationale: O dativo indica a pessoa sobre quem recairia a ação. “Com Jesus” é natural em português e evita explicitar “contra”, embora o contexto seja hostil.
theological_decisions:
- issue: Se ἀνοίας deve ser vertido como insanidade clínica, insensatez moral ou ira irracional
  choice: fúria insensata
  alternative: loucura; insensatez
  rationale: A escolha conserva a tensão entre irracionalidade e forte hostilidade no contexto, sem psicologizar os adversários nem reduzir a expressão a simples deficiência intelectual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção evita regionalismos e mantém a ambiguidade quanto ao ato específico que planejavam praticar contra Jesus.
