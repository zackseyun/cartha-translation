id: LUK.6.39
reference: Luke 6:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: pt
  text: 'E contou-lhes também uma parábola: “Será que um cego pode guiar outro cego? Não cairão ambos numa cova?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa cega pode guiar outra pessoa cega”. O grego usa formas masculinas singulares com sentido representativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “num fosso” ou “numa vala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: também
  rationale: Preserva a força aditiva de καὶ após δὲ e soa natural em português.
- source_word: παραβολὴν
  choice: parábola
  rationale: É o termo corrente nos Evangelhos para uma comparação ou dito figurado e mantém o gênero reconhecido.
- source_word: Μήτι δύναται
  choice: Será que ... pode
  rationale: Expressa de modo natural a pergunta retórica que espera resposta negativa, sem tornar explícito além do necessário.
- source_word: τυφλὸς ... τυφλὸν
  choice: um cego ... outro cego
  rationale: Mantém as formas substantivadas masculinas singulares e o caráter proverbial; “outro” evita repetição pouco natural sem alterar o sentido.
- source_word: ὁδηγεῖν
  choice: guiar
  rationale: Reproduz diretamente a imagem de alguém orientando o caminho de outra pessoa.
- source_word: οὐχὶ
  choice: Não ...?
  rationale: Mantém a pergunta retórica que espera resposta afirmativa.
- source_word: ἀμφότεροι
  choice: ambos
  rationale: Representa de forma concisa a referência aos dois.
- source_word: βόθυνον
  choice: cova
  rationale: O termo grego pode designar uma cova, fosso ou vala; “cova” é claro e vívido no português atual.
- source_word: ἐμπεσοῦνται
  choice: cairão numa
  rationale: O futuro é preservado, e a construção traduz naturalmente εἰς βόθυνον.
theological_decisions:
- issue: Masculino substantivado genérico em τυφλός
  choice: um cego ... outro cego
  alternative: uma pessoa cega ... outra pessoa cega
  rationale: O grego emprega formas masculinas singulares com força representativa. A tradução conserva essa forma proverbial sem limitar a aplicação do ensino aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial foi naturalizada para “E contou-lhes também”, mantendo tanto δὲ quanto καὶ sem rigidez excessiva. As duas perguntas retóricas e a imagem proverbial foram preservadas.
