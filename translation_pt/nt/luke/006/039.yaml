  source_fidelity: 'A tradução preserva os elementos centrais do grego: o conectivo aditivo ("também"), a introdução de uma parábola, a pergunta retórica de resposta negativa, os dois cegos, a ação de guiar e a consequência futura de ambos caírem em uma βόθυνος. “E contou-lhes também” comunica de modo idiomático a fórmula narrativa Εἶπεν δὲ καὶ ... αὐτοῖς, sem perda relevante de sentido.'
