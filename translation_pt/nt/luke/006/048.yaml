id: LUK.6.48
reference: Luke 6:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: pt
  text: Ele é como um homem que, ao construir uma casa, cavou fundo e pôs o alicerce sobre a rocha. Quando veio uma enchente, o rio investiu contra aquela casa, mas não conseguiu abalá-la, porque ela tinha sido bem construída.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: Ele é como um homem
  rationale: Mantém a fórmula direta de comparação e o referente masculino singular da figura ilustrativa.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: que, ao construir uma casa
  rationale: Expressa naturalmente em português a ação circunstancial do particípio grego.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: cavou fundo
  rationale: Reproduz de modo idiomático a intensidade da escavação indicada pelos dois verbos coordenados.
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: pôs o alicerce sobre a rocha
  rationale: Usa vocabulário corrente de construção e preserva a imagem definida da rocha.
- source_word: πλημμύρης δὲ γενομένης
  choice: Quando veio uma enchente
  rationale: Traduz a circunstância temporal do genitivo absoluto em português natural.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: o rio investiu contra aquela casa
  rationale: “Investiu contra” comunica o impacto violento do verbo sem sugerir apenas contato leve.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: não conseguiu abalá-la
  rationale: Conserva a ideia de incapacidade e de desestabilização estrutural, com formulação fluente.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: porque ela tinha sido bem construída
  rationale: Preserva a relação causal, a voz passiva e a anterioridade da construção em relação à enchente.
theological_decisions:
- issue: Gênero de ἀνθρώπῳ na figura comparativa
  choice: um homem
  alternative: uma pessoa
  rationale: O grego apresenta um indivíduo masculino na ilustração. A tradução mantém essa forma sem restringir a aplicação representativa da comparação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Alicerce”, “enchente” e “abalar” são termos correntes e preservam a força concreta da imagem.
