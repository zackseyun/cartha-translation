  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: pt
  text: 'Mas alguns dos fariseus disseram: “Por que vocês fazem o que não é permitido no sábado?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: alguns
  rationale: Indica uma parte dos fariseus, não o grupo inteiro; “alguns” é natural e preciso.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição e introduz a reação crítica dos fariseus.
- source_word: Φαρισαίων
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o nome desse grupo judaico.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo apresenta o ato de fala como um acontecimento simples.
- source_word: Τί ποιεῖτε
  choice: Por que vocês fazem
  rationale: Embora Τί seja literalmente “o que”, nesta construção interrogativa a expressão questiona a razão da conduta; “por que” comunica naturalmente essa força em português. O presente “fazem” também pode abranger a ação observada naquele momento.
- source_word: ὃ οὐκ ἔξεστιν
  choice: o que não é permitido
  rationale: Expressa aquilo que, segundo a acusação, não era lícito ou autorizado; “permitido” mantém o sentido jurídico-religioso em linguagem corrente.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: O plural grego é uma construção idiomática comum para o dia de sábado; o singular é a forma natural e semanticamente equivalente em português.
theological_decisions:
- issue: Forma da expressão referente ao sábado
  choice: no sábado
  alternative: nos sábados
  rationale: Embora o grego use o plural τοῖς σάββασιν, trata-se de um idiomatismo que designa o sábado como dia de observância. O singular português evita sugerir repetição habitual e corresponde ao contexto imediato sem resolver qualquer questão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para o plural de segunda pessoa, amplamente compreensível e natural para leitores brasileiros. A formulação preserva o tom de contestação dos fariseus sem introduzir explicações no corpo do versículo.
