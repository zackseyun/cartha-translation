  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: pt
  text: Simão, a quem também deu o nome de Pedro, André, irmão de Simão, Tiago, João, Filipe e Bartolomeu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Simão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome Σίμων neste contexto.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: a quem também deu o nome de Pedro
  rationale: Expressa com clareza o ato de atribuir o nome, preservando o valor aditivo de καί.
- source_word: Πέτρον
  choice: Pedro
  rationale: Forma portuguesa consagrada de Πέτρος.
- source_word: Ἀνδρέαν
  choice: André
  rationale: Forma portuguesa consagrada de Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: irmão dele
  rationale: Indica naturalmente o vínculo literal com Simão e evita a possível ambiguidade de 'seu irmão' em português.
- source_word: Ἰάκωβον
  choice: Tiago
  rationale: Forma portuguesa tradicional do nome deste apóstolo no Novo Testamento, embora o nome grego corresponda historicamente a Jacó.
- source_word: Ἰωάννην
  choice: João
  rationale: Forma portuguesa consagrada de Ἰωάννης.
- source_word: Φίλιππον
  choice: Filipe
  rationale: Forma portuguesa moderna e consagrada de Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Bartolomeu
  rationale: Forma portuguesa consagrada de Βαρθολομαῖος.
- source_word: καὶ
  choice: e; pontuação de lista
  rationale: O primeiro καί aditivo é traduzido por 'também'. Na enumeração, a coordenação grega é representada por ponto e vírgula e por 'e' entre nomes emparelhados, produzindo uma lista natural sem alterar seus membros.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. Como o versículo integra uma lista que continua no seguinte, termina com ponto e vírgula. A pontuação organiza os apóstolos em pares sugeridos pela sequência coordenada do texto, sem acrescentar conteúdo.
