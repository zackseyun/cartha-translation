base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: pt
  text: 'Mas ele sabia os pensamentos deles[a] e disse ao homem que tinha a mão ressequida[b]: “Levante-se e fique de pé no meio[c].” Ele se levantou e ficou de pé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os raciocínios deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a mão encolhida” ou “mirrada”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para o meio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: conhecia
  rationale: O verbo οἶδα, embora apareça aqui numa forma morfologicamente associada ao mais-que-perfeito, tem sentido presente de saber ou conhecer. “Conhecia” é natural na narrativa e não explica como Jesus obteve esse conhecimento.
- source_word: διαλογισμοὺς
  choice: pensamentos
  rationale: O termo pode indicar pensamentos, raciocínios ou deliberações interiores. “Pensamentos” é claro e preserva a amplitude sem especificar demais a intenção.
- source_word: ἀνδρὶ
  choice: homem
  rationale: ἀνήρ designa especificamente um adulto do sexo masculino; “homem” preserva essa referência.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: a mão ressequida
  rationale: ξηρός aplicado a uma parte do corpo comunica a ideia de algo seco, mirrado ou atrofiado. “Ressequida” conserva a imagem concreta do grego sem impor um diagnóstico médico.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: O primeiro imperativo ordena que o homem se erga do lugar onde estava e deve permanecer distinto do imperativo seguinte.
- source_word: στῆθι
  choice: fique de pé
  rationale: A expressão portuguesa distingue naturalmente esta ordem de “Levante-se” e transmite a ideia de tomar posição.
- source_word: εἰς τὸ μέσον
  choice: no meio
  rationale: A expressão aponta para o meio do grupo reunido. “No meio” é idiomático e mantém o caráter público da ação.
- source_word: ἀναστὰς ἔστη
  choice: Ele se levantou e ficou de pé
  rationale: A sequência de particípio e verbo principal relata duas etapas correspondentes às duas ordens, sem reduzi-las a uma única ação.
theological_decisions:
- issue: O conhecimento de Jesus acerca dos pensamentos alheios
  choice: Afirmar diretamente que ele conhecia os pensamentos deles, sem explicar o mecanismo.
  alternative: “Ele percebeu as intenções deles” ou “soube sobrenaturalmente o que eles pensavam”.
  rationale: O texto declara o conhecimento de Jesus, mas não informa como ele o obteve. A tradução preserva a afirmação e sua tensão teológica sem acrescentar uma explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição “ficou de pé” preserva deliberadamente a correspondência entre a ordem e seu cumprimento. Os marcadores foram posicionados junto aos termos a que cada nota se refere.
