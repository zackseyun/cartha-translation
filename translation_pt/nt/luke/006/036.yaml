  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: pt
  text: Sejam misericordiosos[a], assim como o Pai de vocês é misericordioso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «compassivos». O adjetivo grego descreve quem se compadece e demonstra misericórdia.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Sejam
  rationale: O imperativo presente, na segunda pessoa do plural, expressa uma exortação dirigida aos discípulos. Em português corrente, «sejam» é natural e pode abranger a prática contínua dessa qualidade sem tornar explícito o aspecto com uma formulação pesada como «continuem se tornando».
- source_word: οἰκτίρμονες
  choice: misericordiosos
  rationale: O adjetivo descreve pessoas caracterizadas por compaixão que se manifesta em misericórdia. «Misericordiosos» é direto, digno e mantém a ligação lexical com a segunda ocorrência do mesmo adjetivo.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz uma comparação e apresenta o caráter do Pai como modelo da conduta dos discípulos, sem converter a relação em causa.
- source_word: ὁ πατὴρ ὑμῶν
  choice: o Pai de vocês
  rationale: Reproduz a expressão grega sem acrescentar «celestial», que não aparece neste versículo. «De vocês» oferece leitura clara e amplamente compreensível no português moderno.
- source_word: οἰκτίρμων
  choice: misericordioso
  rationale: A repetição da mesma raiz portuguesa preserva a correspondência deliberada entre a ordem aos discípulos e o caráter do Pai.
theological_decisions:
- issue: Relação entre a ordem e o caráter do Pai
  choice: 'O caráter misericordioso do Pai é apresentado como padrão: «assim como o Pai de vocês é misericordioso».'
  alternative: 'Entender a expressão causalmente: «porque o Pai de vocês é misericordioso».'
  rationale: καθὼς tem aqui força comparativa. A tradução conserva o chamado à imitação sem acrescentar uma explicação causal que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A forma «vocês» evita a ambiguidade regional de «vós» e conserva explicitamente o destinatário plural.
