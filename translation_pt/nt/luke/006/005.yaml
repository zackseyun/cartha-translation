  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: pt
  text: 'E dizia-lhes: “O Filho do Homem é Senhor do sábado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão simples com o contexto anterior, sem acrescentar uma nuance temporal ausente do grego.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego é representado naturalmente pelo pretérito imperfeito português, preservando seu aspecto durativo ou discursivo sem tornar a frase pesada.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Traduz diretamente o dativo plural e retoma os interlocutores sem especificá-los além do que o texto declara.
- source_word: Κύριος
  choice: Senhor
  rationale: Expressa autoridade e preserva o peso cristológico do título no contexto.
- source_word: τοῦ σαββάτου
  choice: do sábado
  rationale: Reproduz de modo compacto o genitivo grego. Em português, a construção 'Senhor do sábado' comunica naturalmente autoridade sobre o sábado.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: É a forma consagrada e transparente do título, preservando seu pano de fundo semítico e sua possível relação com Daniel 7.
theological_decisions:
- issue: Força cristológica da afirmação sobre o sábado
  choice: “O Filho do Homem é Senhor do sábado.”
  alternative: “O Filho do Homem tem autoridade sobre o sábado.”
  rationale: A tradução mantém a afirmação direta de senhorio e a formulação compacta do grego, sem acrescentar 'até mesmo' nem explicar interpretativamente o título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O pretérito imperfeito 'dizia' preserva o aspecto de ἔλεγεν. Usa-se minúscula em 'sábado', conforme a ortografia corrente em português para o nome do dia e da instituição, sem diminuir sua importância no contexto.
