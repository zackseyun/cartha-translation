  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: pt
  text: Abençoem os que amaldiçoam vocês; orem pelos que maltratam vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Abençoem
  rationale: O imperativo plural preserva a ordem direta e o contraste intencional com amaldiçoar. “Abençoem” é natural, consagrado e semanticamente amplo em português.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: os que amaldiçoam vocês
  rationale: O particípio substantivado designa aqueles que dirigem maldição aos ouvintes. A construção é clara e idiomática em português moderno.
- source_word: προσεύχεσθε
  choice: orem
  rationale: O imperativo plural transmite de modo natural a ordem. Não se explicita artificialmente o aspecto presente, embora o contexto permita entendê-la como atitude contínua.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: pelos que maltratam vocês
  rationale: Com προσεύχομαι, περί indica aqueles em favor de quem se ora. “Maltratam” conserva a amplitude de ἐπηρεάζω, que pode envolver abuso, hostilidade ou insulto, sem restringi-lo apenas à fala.
theological_decisions:
- issue: Alcance das ordens de amor aos inimigos
  choice: Apresentar as duas ordens diretamente, sem explicação doutrinária adicional.
  alternative: Acrescentar qualificações sobre como ou em que circunstâncias abençoar e orar.
  rationale: O texto formula imperativos éticos claros e mantém deliberadamente a tensão entre a hostilidade sofrida e a resposta ordenada. A tradução não deve limitar nem expandir essa exigência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμᾶς e formas verbais correspondentes. O paralelismo conciso do grego foi preservado.
