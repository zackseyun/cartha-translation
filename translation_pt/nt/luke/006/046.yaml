id: LUK.6.46
reference: Luke 6:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: pt
  text: Por que vocês me chamam de “Senhor, Senhor”[a], mas não fazem o que eu digo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Mestre, Mestre”. Em grego: κύριε, κύριε.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Por que
  rationale: Embora τί seja formalmente “o que”, nesta construção pergunta pela razão e tem força de repreensão; “Por que” é o equivalente natural em português.
- source_word: δέ
  choice: —
  rationale: A partícula funciona como conectivo leve. O português não exige sua tradução explícita aqui, e o contraste já aparece naturalmente na pergunta.
- source_word: με
  choice: me
  rationale: Objeto direto de καλεῖτε, traduzido de modo direto.
- source_word: καλεῖτε
  choice: chamam
  rationale: Presente do indicativo na segunda pessoa do plural; “vocês me chamam” é claro e amplamente compreensível.
- source_word: Κύριε κύριε
  choice: Senhor, Senhor
  rationale: Preserva tanto a repetição enfática quanto o peso respeitoso e cristológico do vocativo κύριε.
- source_word: καὶ οὐ
  choice: mas não
  rationale: Embora καί seja normalmente coordenativo, aqui a relação semântica é de forte contraste entre a forma de tratamento e a falta de obediência; “mas não” expressa isso naturalmente.
- source_word: ποιεῖτε
  choice: fazem
  rationale: Neste contexto, ποιέω significa pôr em prática ou cumprir o que Jesus diz. “Fazem o que eu digo” mantém linguagem simples e direta.
- source_word: ἃ
  choice: o que
  rationale: O relativo neutro plural refere-se coletivamente ao conteúdo das palavras de Jesus; em português corrente, “o que” é mais natural do que “as coisas que”.
- source_word: λέγω
  choice: eu digo
  rationale: Tradução direta que não acrescenta um objeto indireto ausente do grego.
theological_decisions:
- issue: Tradução de κύριος como título dirigido a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva melhor a amplitude de κύριος, incluindo respeito, autoridade e possível peso cristológico. “Mestre” é lexicalmente possível no contexto, mas restringe mais o sentido.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A formulação mantém a pergunta repreensiva e o contraste entre confissão verbal e prática.
