  terminology: «Dê», «pedir», «o que é seu» e «exija de volta» são escolhas apropriadas, modernas e não interpretativas. «Leva» mantém o aspecto genérico/presente do particípio e a ideia de remoção de αἴρω sem especificar furto ou categoria jurídica.
