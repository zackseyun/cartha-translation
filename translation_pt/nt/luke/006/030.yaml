source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: pt
  text: Dê a todo aquele que lhe pedir; e não exija de volta, de quem leva o que é seu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não peça de volta, de quem leva o que é seu”.'
    reason: Alternativa lexical para ἀπαιτέω; «pedir de volta» é uma possibilidade menos enfática que «exigir de volta».
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: a todo aquele que lhe pedir
  rationale: A construção distributiva expressa alcance universal. “Pedir” traduz αἰτέω sem restringir o pedido à mendicância, e “lhe” representa σε de modo natural no português de ampla legibilidade.
- source_word: δίδου
  choice: Dê
  rationale: O imperativo presente é vertido por um imperativo simples e direto; o aspecto pode sugerir prática contínua, mas explicitá-lo tornaria a frase menos natural.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: de quem tirar
  rationale: O particípio substantivado indica qualquer pessoa que tome ou leve embora. “Tirar” preserva a ideia de remoção sem impor a categoria jurídica de furto.
- source_word: τὰ σὰ
  choice: o que é seu
  rationale: Equivalente idiomático do neutro plural, amplo o bastante para não limitar indevidamente a referência a uma categoria específica de bens.
- source_word: μὴ ἀπαίτει
  choice: não exija de volta
  rationale: O verbo pode significar reclamar, requerer ou exigir a devolução. “Exija de volta” conserva sua força e deixa claro o sentido de reaver.
theological_decisions:
- issue: Alcance e força dos mandamentos éticos de Jesus
  choice: Manter imperativos diretos e de alcance amplo
  alternative: Abrandar como hipérbole, restringir à esmola ou limitar a segunda oração à restituição jurídica por furto
  rationale: O grego usa imperativos diretos e linguagem distributiva ampla. A tradução preserva a tensão ética sem decidir na própria redação como o ensino deve ser aplicado.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” expresso pelas formas “lhe/seu”. A formulação evita regionalismos fortes e mantém o paralelismo conciso do dito.
