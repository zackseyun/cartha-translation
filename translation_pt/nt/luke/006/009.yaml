id: LUK.6.9
reference: Luke 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: pt
  text: 'Mas Jesus lhes disse: “Eu lhes pergunto: é lícito, no sábado, fazer o bem ou fazer o mal[a], salvar uma vida ou destruí-la[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causar dano”. O grego estabelece um contraste ético entre fazer o bem e praticar uma ação má ou prejudicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “salvar uma alma ou destruí-la”. Neste contexto, “vida” é preferível porque a questão é preservar ou destruir a vida de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste, enquanto Jesus responde à atitude dos que o observavam.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Eu lhes pergunto
  rationale: Reproduz de modo natural e direto o desafio introduzido pelo verbo grego e mantém explícito o objeto pronominal.
- source_word: εἰ ἔξεστιν
  choice: é lícito
  rationale: Preserva a dimensão legal e ética da controvérsia sobre o que a Lei permite no sábado.
- source_word: τῷ σαββάτῳ
  choice: no sábado
  rationale: É a forma idiomática em português para o dativo temporal e identifica claramente o dia em questão.
- source_word: ἀγαθοποιῆσαι
  choice: fazer o bem
  rationale: Mantém a formulação verbal e o contraste ético explícito com κακοποιῆσαι.
- source_word: κακοποιῆσαι
  choice: fazer o mal
  rationale: Conserva a polaridade formal com “fazer o bem” e a amplitude ética do termo; a alternativa concreta “causar dano” é registrada em nota.
- source_word: ψυχὴν
  choice: uma vida
  rationale: Neste contexto de cura e preservação de uma pessoa, ψυχή se refere concretamente à vida, sem exigir uma afirmação sobre uma parte imaterial do ser humano.
- source_word: σῶσαι
  choice: salvar
  rationale: Preserva o sentido básico e sua ligação com o uso bíblico mais amplo, sendo natural no sentido de preservar uma vida.
- source_word: ἀπολέσαι
  choice: destruí-la
  rationale: Mantém a forte antítese com “salvar” e recupera em português o objeto feminino “uma vida”; “matar” seria mais estreito que o verbo grego.
theological_decisions:
- issue: Sentido de ψυχή em ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: “salvar uma vida ou destruí-la”
  alternative: “salvar uma alma ou destruí-la”
  rationale: O contexto imediato trata do bem ou mal feito a uma pessoa no sábado. “Vida” comunica esse sentido concreto sem transformar a frase numa declaração antropológica sobre a alma; a alternativa mais formal é preservada em nota.
- issue: Amplitude ética de κακοποιῆσαι
  choice: “fazer o mal”
  alternative: “causar dano”
  rationale: “Fazer o mal” espelha diretamente “fazer o bem” e preserva a tensão ética geral da pergunta. “Causar dano” explicita melhor a consequência concreta no contexto da cura, por isso aparece como alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da pergunta foi mantida próxima do grego, mas com pontuação natural. “É lícito” preserva o caráter jurídico-ético da controvérsia, enquanto “no sábado” é idiomático e corrente.
