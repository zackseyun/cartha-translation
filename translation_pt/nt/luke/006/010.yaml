id: LUK.6.10
reference: Luke 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: pt
  text: 'Depois de olhar ao redor para todos eles, disse-lhe: “Estenda a mão.” Ele fez isso, e sua mão foi restaurada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua mão foi curada”. Mais literalmente, o grego diz “sua mão foi restaurada”, enfatizando que ela voltou à condição adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: depois de olhar ao redor
  rationale: O particípio aoristo indica que Jesus percorreu com o olhar os presentes antes de falar; a formulação preserva tanto a sequência quanto a ideia de olhar em volta.
- source_word: πάντας αὐτούς
  choice: para todos eles
  rationale: Mantém a ênfase do grego na totalidade das pessoas para as quais Jesus olhou.
- source_word: εἶπεν αὐτῷ
  choice: disse-lhe
  rationale: Reproduz de modo natural e conciso o verbo de fala com objeto indireto, sem acrescentar identificação ausente nesta frase grega.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Estenda a mão
  rationale: Expressa com clareza a ordem direta; em português, o possessivo pode ser omitido naturalmente porque a referência à mão do interlocutor é inequívoca.
- source_word: ὁ δὲ ἐποίησεν
  choice: Ele fez isso
  rationale: O verbo retoma a ação ordenada; a tradução evita o literalismo obscuro e conserva a progressão narrativa leve de δέ.
- source_word: ἀπεκατεστάθη
  choice: foi restaurada
  rationale: Preserva o sentido de retorno à condição apropriada ou anterior, sem substituir o verbo por linguagem médica mais interpretativa.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: sua mão
  rationale: Mantém a repetição explícita de 'mão' no grego e identifica naturalmente o possuidor em português.
theological_decisions:
- issue: Natureza do milagre expressa por ἀπεκατεστάθη
  choice: 'linguagem de restauração: “sua mão foi restaurada”'
  alternative: “sua mão foi curada” ou “sua mão ficou sã”
  rationale: O verbo grego destaca a volta da mão à condição adequada. “Restaurada” conserva essa nuance e não impõe uma formulação médica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “disse-lhe” mantém concisão e um tom narrativo moderadamente formal; “Ele fez isso” evita rigidez excessiva.
