review_pass:
  verdict: revise
  source_fidelity: κρίνετε e καταδικάζετε são bem distinguidos por «julguem» e «condenem». A negação enfática οὐ μή é mais idiomática e fielmente expressa em português por «certamente não». No encadeamento de Lucas 6:37, ἀπολύετε/ἀπολυθήσεσθε tem o sentido contextual de perdoar ou liberar de uma acusação; «Libertem» sugere de modo demasiado imediato libertação física e não funciona naturalmente neste paralelismo.
  naturalness: «De modo nenhum serão...» é compreensível, mas marcado e pouco natural nesta construção. «Certamente não serão...» mantém a ênfase com fluidez. «Perdoem, e serão perdoados» é a formulação portuguesa natural para o sentido contextual do último par.
  terminology: «Julgar», «condenar» e «perdoar» preservam a progressão semântica do dito. A nota registra de modo não doutrinário a amplitude lexical de ἀπολύω, incluindo «soltar» e «libertar».
  issues:
  - severity: medium
    issue: «Libertem, e serão libertados» é uma tradução excessivamente literal e semanticamente deslocada no contexto.
    rationale: Embora ἀπολύω possa denotar soltar ou libertar, a sequência com julgar e condenar favorece «perdoar»/«absolver». Em português, «libertar» tende a evocar libertação física ou social e enfraquece a relação contextual com a remissão de juízo.
  - severity: low
    issue: «De modo nenhum serão julgados/condenados» é pouco idiomático.
    rationale: A expressão traduz a ênfase de οὐ μή, mas «certamente não serão...» a comunica de forma mais natural e mantém o paralelismo.
  revised_text: Não julguem, e certamente não serão julgados; não condenem, e certamente não serão condenados. Perdoem[a], e serão perdoados.
  revised_footnotes:
