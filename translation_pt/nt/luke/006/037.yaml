  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: pt
  text: Não julguem, e certamente não serão julgados; não condenem, e certamente não serão condenados. Perdoem[a], e serão perdoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Libertem, e serão libertados». O verbo grego pode significar «soltar», «libertar» ou, neste contexto, «perdoar» ou «absolver».'
    reason: alternativa lexical
lexical_decisions:
- source_word: κρίνετε
  choice: julguem
  rationale: Mantém o sentido comum de avaliar ou emitir juízo e conserva a forma imperativa concisa, em paralelo com «serão julgados».
- source_word: οὐ μὴ κριθῆτε
  choice: de modo nenhum serão julgados
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação enfática; «de modo nenhum» comunica essa força sem enfraquecer a afirmação.
- source_word: καταδικάζετε
  choice: condenem
  rationale: Expressa um juízo adverso mais forte que κρίνω e preserva a progressão de «julgar» para «condenar».
- source_word: οὐ μὴ καταδικασθῆτε
  choice: de modo nenhum serão condenados
  rationale: Reproduz a negação enfática e mantém o paralelismo com a oração anterior.
- source_word: ἀπολύετε
  choice: Libertem
  rationale: ἀπολύω pode significar soltar, libertar, deixar ir ou absolver. «Libertem» preserva essa amplitude e a reciprocidade verbal, sem restringir o sentido antecipadamente a «perdoem».
- source_word: ἀπολυθήσεσθε
  choice: serão libertados
  rationale: Mantém a correspondência lexical e retórica com «Libertem»; «serão perdoados» continua possível como interpretação contextual, mas é mais restrito.
- source_word: καὶ
  choice: e
  rationale: A repetição de «e» preserva a coordenação e o ritmo das declarações gregas.
theological_decisions:
- issue: Se ἀπολύετε deve ser entendido especificamente como perdão ou, de modo mais amplo, como libertação/soltura
  choice: Manter «Libertem» no texto principal
  alternative: «Perdoem» ou «Absolvam»
  rationale: O contexto de julgar e condenar permite a ideia de absolver ou perdoar, mas o verbo grego é mais amplo. A tradução principal preserva essa abertura sem impor uma interpretação doutrinária específica; a leitura contextual tradicional é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural que funcionam naturalmente no uso brasileiro e permanecem amplamente compreensíveis. O paralelismo e a intensidade da negação grega foram preservados.
