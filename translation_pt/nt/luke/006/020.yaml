  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: pt
  text: 'E ele, erguendo os olhos para os seus discípulos, dizia: “Felizes são vocês, os pobres[a], porque de vocês é o Reino de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lucas diz apenas “os pobres”, não “os pobres de espírito” (compare Mateus 5:3). A expressão grega tem forma de terceira pessoa, mas “de vocês” mostra que Jesus fala diretamente aos discípulos.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: erguendo os olhos
  rationale: Preserva a imagem concreta e a relação circunstancial do particípio aoristo com o verbo principal, em português natural.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: para os seus discípulos
  rationale: Com os olhos como objeto, εἰς indica a direção do olhar; “para” é claro e idiomático.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta ou enquadra a fala em curso; “dizia” preserva esse aspecto sem a tornar artificial.
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em uma bem-aventurança, “felizes” comunica a condição favorável declarada por Deus em linguagem portuguesa atual; não se limita a uma emoção passageira neste contexto solene.
- source_word: οἱ πτωχοί
  choice: vocês, os pobres
  rationale: O artigo substantiva o adjetivo (“os pobres”), enquanto o possessivo de segunda pessoa logo depois mostra que Jesus se dirige diretamente aos discípulos. A formulação conserva ambos os dados.
- source_word: ὅτι
  choice: porque
  rationale: Expressa com clareza a razão da declaração de felicidade.
- source_word: ὑμετέρα ἐστὶν
  choice: de vocês é
  rationale: Mantém a ênfase do possessivo predicativo e a ligação direta com os ouvintes.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É a expressão portuguesa estabelecida e preserva a amplitude semântica de βασιλεία, que pode envolver governo, domínio e reino.
theological_decisions:
- issue: Se πτωχοί deve receber uma qualificação espiritual
  choice: os pobres
  alternative: os pobres de espírito
  rationale: Lucas não inclui “de espírito”. Acrescentar essa expressão harmonizaria indevidamente o texto com Mateus 5:3 e reduziria a tensão própria da formulação lucana.
- issue: Se a bem-aventurança deve aparecer em terceira pessoa ou como discurso direto
  choice: vocês, os pobres
  alternative: os pobres
  rationale: οἱ πτωχοί tem forma de terceira pessoa, mas ὑμετέρα (“de vocês”) torna inequívoco o endereço direto. A tradução conserva a forma nominal e explicita o fluxo discursivo.
- issue: Como traduzir Μακάριοι
  choice: Felizes
  alternative: Bem-aventurados
  rationale: “Felizes” é atual e inteligível, mantendo no contexto o sentido de pessoas declaradas em condição favorecida; “bem-aventurados” é tradicional, mas menos corrente para muitos leitores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “de vocês é o Reino de Deus” preserva a ênfase grega sem soar arcaica. O marcador [a] aparece imediatamente após a expressão comentada.
