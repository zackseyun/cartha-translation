  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: pt
  text: 'Mas digo a vocês que estão escutando[a]: amem os seus inimigos; façam o bem aos que odeiam vocês,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ouvem”. O particípio grego também admite essa tradução mais formal; “que estão escutando” ressalta, no contexto, o sentido de ação em curso e atenção ativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mas
  rationale: Expressa de modo conciso e natural o forte contraste com o que vem antes.
- source_word: ὑμῖν λέγω
  choice: digo a vocês
  rationale: Preserva a fórmula de fala e o destinatário plural em português atual e amplamente compreensível.
- source_word: τοῖς ἀκούουσιν
  choice: que estão escutando
  rationale: A construção progressiva comunica a ação presente e a receptividade ativa sugeridas pelo particípio grego no contexto.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Mantém o sentido lexical de amar e a força imperativa dirigida a um grupo.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: os seus inimigos
  rationale: Tradução direta e natural do objeto com pronome possessivo.
- source_word: καλῶς ποιεῖτε
  choice: façam o bem
  rationale: Reproduz de forma idiomática tanto a ação quanto sua qualidade moral, sem expandir o texto.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: aos que odeiam vocês
  rationale: Conserva sem atenuação o sentido de μισέω e representa naturalmente o dativo após “façam o bem”.
theological_decisions:
- issue: Imperativos éticos dirigidos aos adversários
  choice: Apresentar as ordens como imperativos gerais, sem restringir seu alcance.
  alternative: Limitá-las a inimigos pessoais ou tratá-las na tradução como hipérbole retórica.
  rationale: O grego traz imperativos diretos na segunda pessoa do plural e não explicita nenhuma limitação; a tradução preserva sua força ética radical e deixa abertas as questões interpretativas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais compatíveis com “vocês”. “Escutando” foi preferido a “ouvindo” no texto principal para realçar atenção ativa, sem tornar essa nuance obrigatória; a alternativa consta em nota.
