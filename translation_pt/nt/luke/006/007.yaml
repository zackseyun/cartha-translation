id: LUK.6.7
reference: Luke 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: pt
  text: Os escribas e os fariseus o observavam atentamente[a] para ver se ele curaria no sábado, a fim de encontrarem motivo para acusá-lo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vigiavam cuidadosamente”. O verbo grego pode indicar observação atenta e, neste contexto, hostil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a fim de encontrarem de que acusá-lo” ou, mais literalmente, “a fim de encontrarem como acusá-lo”. A expressão indica a busca de uma base ou oportunidade para acusação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: o observavam atentamente
  rationale: O imperfeito indica uma observação contínua e intencional. Neste contexto, a finalidade de acusar confere à vigilância um tom hostil. O pronome “o”, embora implícito no grego, retoma Jesus com naturalidade em português.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional, direto e amplamente reconhecido para os especialistas judeus na Lei mencionados nos Evangelhos.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo religioso.
- source_word: εἰ
  choice: para ver se
  rationale: Depois de um verbo de observação, esta construção expressa naturalmente em português a pergunta indireta introduzida por εἰ.
- source_word: ἐν τῷ σαββάτῳ
  choice: no sábado
  rationale: Expressão temporal idiomática em português que preserva o singular do texto grego.
- source_word: θεραπεύει
  choice: ele curaria
  rationale: 'Embora o grego use o presente, o futuro do pretérito é natural no discurso indireto dependente de um verbo no passado: observavam para ver o que ele faria.'
- source_word: ἵνα εὕρωσιν
  choice: a fim de encontrarem
  rationale: Preserva de modo claro a finalidade expressa por ἵνα e concorda com o sujeito plural.
- source_word: κατηγορεῖν αὐτοῦ
  choice: motivo para acusá-lo
  rationale: A combinação com “encontrar” sugere a busca de base ou oportunidade para uma acusação. A formulação é idiomática sem especificar qual seria a acusação.
theological_decisions:
- issue: Intenção dos opositores
  choice: A tradução apresenta uma vigilância deliberada voltada à busca de motivo para acusar Jesus.
  alternative: Uma formulação mais neutra poderia dizer apenas que observavam se ele curava.
  rationale: A finalidade explícita de acusar, somada ao verbo de observação atenta, mostra que não se trata de curiosidade neutra. A tradução mantém essa hostilidade sem ampliar a acusação para além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Escribas”, “fariseus” e “sábado” preservam a terminologia bíblica corrente; a sintaxe evita literalismo rígido sem eliminar a intenção hostil expressa no grego.
