id: LUK.6.12
reference: Luke 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: pt
  text: Naqueles dias, aconteceu que ele saiu para o monte a fim de orar e passou a noite inteira em oração a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: permaneceu a noite toda em oração a Deus.'
    reason: Alternativa lexical que preserva mais explicitamente o aspecto contínuo de ἦν διανυκτερεύων.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: aconteceu que
  rationale: Reproduz a fórmula narrativa característica de Lucas sem acrescentar um advérbio temporal que não esteja expresso no grego. O valor levemente conectivo de δέ é transmitido pelo fluxo da frase.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: naqueles dias
  rationale: Expressão temporal idiomática em português narrativo, referindo-se ao período descrito no contexto.
- source_word: ἐξελθεῖν αὐτὸν
  choice: ele saiu
  rationale: O infinitivo com sujeito no acusativo, dependente de ἐγένετο, é vertido naturalmente como oração finita, preservando o sentido de movimento para fora.
- source_word: εἰς τὸ ὄρος
  choice: para o monte
  rationale: Mantém o artigo e o sentido básico de ὄρος. “Monte” é natural no registro bíblico moderno e não especifica além do texto.
- source_word: προσεύξασθαι
  choice: a fim de orar
  rationale: Explicita de modo natural o valor de finalidade do infinitivo após o verbo de movimento.
- source_word: ἦν διανυκτερεύων
  choice: passou a noite inteira
  rationale: Expressão portuguesa idiomática que comunica tanto a duração contínua da construção perifrástica quanto a ideia de atravessar toda a noite.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: em oração a Deus
  rationale: 'Entende o genitivo como objetivo ou direcional: a oração é dirigida a Deus. Evita a leitura enganosa de que a oração pertenceria a Deus ou seria feita por ele.'
theological_decisions:
- issue: Relação de τοῦ θεοῦ com a oração de Jesus
  choice: oração a Deus
  alternative: oração de Deus
  rationale: No contexto, a frase descreve Jesus dirigindo sua oração a Deus. A tradução conserva essa relação sem acrescentar “Pai” nem desenvolver uma explicação cristológica ausente do versículo.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. “A fim de orar” mantém clara a finalidade; “monte” conserva a formulação tradicional sem soar arcaica.
