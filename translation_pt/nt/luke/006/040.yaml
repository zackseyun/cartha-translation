id: LUK.6.40
reference: Luke 6:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: pt
  text: O discípulo não está acima do seu mestre, mas todo aquele que estiver plenamente preparado será como o seu mestre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas todo aquele que tiver sido plenamente treinado será como o seu mestre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: discípulo
  rationale: “Discípulo” preserva o sentido relacional e formativo de alguém que aprende ligado a um mestre, mais amplo que o sentido acadêmico de “aluno”.
- source_word: ὑπὲρ
  choice: acima de
  rationale: Neste uso comparativo, indica superioridade de posição ou condição; “acima de” reproduz de modo claro e conciso o contraste do provérbio.
- source_word: διδάσκαλον / διδάσκαλος
  choice: mestre
  rationale: No contexto de discipulado, “mestre” expressa naturalmente tanto a função de ensinar quanto a relação formativa, sem exigir uma conotação doutrinária adicional.
- source_word: κατηρτισμένος
  choice: estiver plenamente preparado
  rationale: O particípio perfeito passivo de καταρτίζω indica alguém levado a uma condição completa de preparo ou formação. A formulação preserva a amplitude entre treinamento e capacitação sem sugerir perfeição moral absoluta.
- source_word: πᾶς
  choice: todo aquele
  rationale: O masculino singular tem força genérica. “Todo aquele” mantém a correspondência singular do provérbio e soa natural em português.
- source_word: ὡς
  choice: como
  rationale: Introduz aqui uma comparação direta entre o discípulo plenamente preparado e seu mestre.
- source_word: αὐτοῦ
  choice: seu
  rationale: O possessivo retoma a pessoa mencionada de forma genérica e preserva naturalmente a relação singular em português.
theological_decisions:
- issue: Sentido de κατηρτισμένος
  choice: “plenamente preparado”, entendido como formação ou capacitação completa
  alternative: “perfeitamente instruído” ou “plenamente treinado”
  rationale: O verbo pode abranger preparar, capacitar, ajustar ou completar. Neste contexto pedagógico, “plenamente preparado” preserva essa amplitude e evita transformar a expressão em afirmação de perfeição moral.
- issue: Referência masculina genérica no provérbio
  choice: Manter o singular genérico em “todo aquele ... seu mestre”
  alternative: “todos ... seus mestres” ou uma reformulação explicitamente neutra
  rationale: O grego apresenta formas masculinas singulares com alcance genérico. A redação portuguesa mantém tanto o alcance geral quanto a estrutura singular sem restringir a aplicação apenas a homens.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Mestre” foi preferido a “professor” por conservar a relação formativa própria de discípulo, e a nota registra a alternativa pedagógica mais explícita para κατηρτισμένος.
