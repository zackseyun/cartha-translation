id: LUK.6.21
reference: Luke 6:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: pt
  text: Felizes são vocês que agora têm fome[a], porque serão saciados[b]. Felizes são vocês que agora choram, porque rirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Felizes os que agora têm fome... Felizes os que agora choram”. O grego usa particípios com artigo, literalmente “os que têm fome” e “os que choram”; os verbos da promessa estão, porém, na segunda pessoa do plural, e o contexto favorece o discurso direto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “serão plenamente satisfeitos”. O verbo grego pode referir-se a ficar cheio de alimento e, por extensão, a ficar plenamente satisfeito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: “Felizes” comunica de modo natural a declaração de bem-aventurança, sem introduzir explicitamente uma ação divina que o adjetivo grego não expressa por si só. No contexto, não descreve apenas um sentimento passageiro, mas a condição favorável daqueles a quem Jesus dirige a promessa.
- source_word: οἱ πεινῶντες
  choice: vocês que agora têm fome
  rationale: O particípio presente indica uma condição atual e contínua. A formulação com “vocês” harmoniza-se com os verbos futuros na segunda pessoa do plural e com o discurso direto aos discípulos, sem intensificar “fome” para “inanição”.
- source_word: νῦν
  choice: agora
  rationale: Preserva o contraste temporal entre a privação presente e a reversão futura.
- source_word: χορτασθήσεσθε
  choice: serão saciados
  rationale: O futuro passivo de χορτάζω conserva tanto a imagem concreta de ter a fome plenamente satisfeita quanto sua possível extensão figurada, sem definir aqui a natureza ou o momento do cumprimento.
- source_word: οἱ κλαίοντες
  choice: vocês que agora choram
  rationale: κλαίω significa chorar ou derramar lágrimas; “choram” é atual, claro e não restringe a causa do choro ao luto por falecimento.
- source_word: γελάσετε
  choice: rirão
  rationale: Mantém a imagem concreta e vívida de γελάω e o contraste direto com o choro, em vez de substituí-la pela interpretação mais geral “se alegrarão”.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de maneira clara, em português contemporâneo, a razão da declaração de felicidade.
theological_decisions:
- issue: Discurso direto ou formulação genérica da bem-aventurança
  choice: “vocês que agora têm fome” e “vocês que agora choram”
  alternative: “os que agora têm fome” e “os que agora choram”
  rationale: Embora o grego empregue artigo com particípios, as promessas usam a segunda pessoa do plural, e o contexto imediato apresenta Jesus falando diretamente aos discípulos. A nota preserva a forma mais literal como alternativa.
- issue: Natureza e momento da reversão prometida
  choice: 'Manter as promessas concretas: “serão saciados” e “rirão”'
  alternative: Explicitar satisfação espiritual, alívio nesta vida ou cumprimento exclusivamente escatológico
  rationale: O versículo anuncia uma reversão, mas não define por si só seu modo nem seu momento. A tradução evita resolver essa tensão teológica.
- issue: Sentido de μακάριοι
  choice: “Felizes”
  alternative: “Bem-aventurados” ou “abençoados”
  rationale: “Felizes” é compreensível e natural no português atual; no formato da declaração e ligado às promessas, expressa uma condição favorável, não mera emoção. “Abençoados” tornaria mais explícita a agência divina, enquanto “bem-aventurados” é menos corrente para muitos leitores.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Felizes são vocês” conserva a forma declarativa da bem-aventurança e torna explícito o discurso direto indicado pelo contexto e pelos futuros na segunda pessoa. Evitaram-se tanto o arcaísmo de “bem-aventurados” quanto interpretações que especificariam indevidamente o tipo ou o tempo do cumprimento.
