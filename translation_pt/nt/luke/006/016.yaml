id: LUK.6.16
reference: Luke 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: pt
  text: e Judas, filho de Tiago[a], e Judas Iscariotes, que se tornou traidor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Judas, irmão de Tiago»; o grego diz apenas «Judas de Tiago».
    reason: 'Leitura alternativa: o genitivo grego indica uma relação, mas não especifica se Tiago era o pai ou o irmão de Judas.'
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Judas, filho de Tiago
  rationale: O genitivo Ἰακώβου deixa implícita a relação familiar. Em uma lista de apóstolos, o português natural pede que ela seja explicitada; «filho de Tiago» é a interpretação mais provável, enquanto a alternativa permanece registrada em nota.
- source_word: Ἰσκαριὼθ
  choice: Iscariotes
  rationale: Forma tradicional e amplamente reconhecida em português para o nome ou designação grega, adequada à transliteração de nomes próprios.
- source_word: ὃς ἐγένετο
  choice: que se tornou
  rationale: Preserva o sentido dinâmico de γίνομαι, «tornar-se», em vez de reduzi-lo ao estado expresso por «era».
- source_word: προδότης
  choice: traidor
  rationale: Traduz de modo direto e idiomático o substantivo que caracteriza aquele que trai.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples e repetida dos nomes no fim da lista.
theological_decisions:
- issue: Relação indicada pelo genitivo Ἰακώβου em «Judas de Tiago»
  choice: Traduzir no texto principal como «Judas, filho de Tiago»
  alternative: «Judas, irmão de Tiago» ou, literalmente, «Judas de Tiago»
  rationale: O grego não especifica a relação. «Filho de Tiago» é a interpretação contextual mais provável e produz português natural, mas a nota preserva a ambiguidade real sem impor certeza indevida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A vírgula antes do aposto «filho de Tiago» favorece a leitura natural; «Iscariotes» segue o uso português consolidado.
