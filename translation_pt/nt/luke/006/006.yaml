base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: pt
  text: Aconteceu que, em outro sábado, ele entrou na sinagoga e estava ensinando. Havia ali um homem que tinha a mão direita atrofiada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mirrada”. O adjetivo grego pode descrever algo seco, mirrado ou atrofiado; neste contexto, refere-se à deficiência na mão direita do homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Reproduz a transição narrativa típica de Lucas sem acrescentar um advérbio temporal inexistente no grego; δέ funciona aqui como conector leve, dispensável em português após essa abertura.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: em outro sábado
  rationale: Expressa naturalmente uma nova ocasião sabática e mantém a distinção indicada por ἑτέρῳ.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: ele entrou na sinagoga
  rationale: Converte a construção infinitiva idiomática ligada a ἐγένετο em oração finita natural em português.
- source_word: καὶ διδάσκειν
  choice: e estava ensinando
  rationale: O gerúndio com o auxiliar preserva o aspecto imperfectivo do infinitivo presente, apresentando o ensino como ação em andamento.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Havia ali um homem
  rationale: É a forma existencial mais natural em português e mantém a referência explícita a um homem.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: cuja mão direita
  rationale: A oração relativa evita rigidez e preserva a especificação enfática de que se tratava da mão direita.
- source_word: ξηρά
  choice: ressequida
  rationale: Mantém a imagem básica de algo seco ou mirrado e, no contexto, descreve com dignidade a condição incapacitante da mão sem impor um diagnóstico médico específico.
