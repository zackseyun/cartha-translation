id: LUK.6.38
reference: Luke 6:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: pt
  text: 'Deem, e será dado a vocês: uma boa medida — compactada, sacudida e transbordante — darão no colo de vocês[a]. Pois, com a medida com que medem, será medido de volta a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, na dobra frontal da roupa, usada como uma bolsa para receber produtos medidos.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Deem
  rationale: Imperativo presente plural; a forma simples em português expressa naturalmente a exortação geral sem tornar explícita uma ideia iterativa que o aspecto verbal, por si só, não exige.
- source_word: δοθήσεται ὑμῖν
  choice: e lhes será dado
  rationale: Mantém o futuro passivo e o objeto implícito, desenvolvido pela imagem da medida que segue.
- source_word: μέτρον καλὸν
  choice: uma boa medida
  rationale: Preserva a metáfora de quantidade ou recipiente de medição; “boa” mantém a amplitude de καλόν sem explicitar “generosa”.
- source_word: πεπιεσμένον
  choice: apertada
  rationale: Descreve o conteúdo comprimido para caber em maior quantidade; é corrente e conserva a imagem comercial.
- source_word: σεσαλευμένον
  choice: sacudida
  rationale: Representa o recipiente sacudido para que o conteúdo se acomode, sem acrescentar explicação ao texto principal.
- source_word: ὑπερεκχυννόμενον
  choice: transbordante
  rationale: Comunica vividamente o excesso que derrama para fora e concorda com “medida”.
- source_word: δώσουσιν
  choice: será colocada
  rationale: O grego usa a terceira pessoa plural com sujeito indeterminado. Em português, a construção passiva é natural para um agente não especificado, embora não reproduza formalmente o plural ativo.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: no colo de vocês
  rationale: É o equivalente moderno mais claro; a nota preserva a referência cultural à dobra frontal da roupa usada para receber mercadorias.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Pois, com a medida com que medem
  rationale: Mantém a repetição intencional da raiz “medida/medem” e a máxima de reciprocidade.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: também será medido para vocês
  rationale: Conserva o futuro passivo e expressa a correspondência recíproca de ἀντί por meio de “também”, sem transformar a frase em linguagem de pagamento.
theological_decisions:
- issue: Se a exortação deve ser limitada a dinheiro ou esmolas
  choice: Manter a linguagem ampla de dar e da medida recíproca.
  alternative: Interpretar o versículo especificamente como promessa ligada à generosidade financeira ou à esmola.
  rationale: O contexto imediato abrange misericórdia, julgamento, perdão e generosidade, e o grego não limita o ato de dar a dinheiro. A tradução evita tanto uma leitura exclusivamente financeira quanto a inserção de uma promessa de prosperidade.
- issue: Agente da retribuição
  choice: Deixar o agente não especificado por meio da voz passiva e da construção impessoal.
  alternative: Identificar explicitamente Deus ou as pessoas como quem dá e mede de volta.
  rationale: Embora δώσουσιν seja um plural indefinido e os demais verbos sejam passivos, o texto não nomeia o agente. Explicitá-lo resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural e evita “seio”, hoje ambíguo ou arcaizante neste contexto. A sequência rítmica de particípios foi preservada. O marcador [a] aparece imediatamente após a expressão explicada.
