review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a exortação ampla e a imagem de medida abundante. Contudo, «apertada» não é a melhor representação de πεπιεσμένον no contexto de mercadorias comprimidas, e a passiva «será colocada» obscurece desnecessariamente o plural ativo indefinido δώσουσιν. A expressão recíproca ἀντιμετρηθήσεται pede mais claramente «de volta».
  naturalness: «Deem» e «vocês» são naturais e adequados ao registro. «Compactada» comunica melhor a imagem de conteúdo pressionado para caber mais. «Darão no colo de vocês» conserva o sujeito indefinido e é compreensível; a nota esclarece o sentido cultural de «colo».
  terminology: «Boa medida», «sacudida» e «transbordante» mantêm a metáfora sem restringi-la a dinheiro. «De volta» torna explícita a reciprocidade de ἀντί, sem introduzir uma doutrina de retribuição financeira.
  issues:
  - severity: medium
    issue: «apertada» para πεπιεσμένον
    rationale: Em português moderno, «apertada» tende a descrever algo estreito, justo ou pressionado externamente, não o conteúdo de uma medida compactado para maximizar a quantidade. «Compactada» representa melhor a imagem.
  - severity: medium
    issue: «será colocada» para δώσουσιν
    rationale: δώσουσιν é terceira pessoa do plural ativa, com sujeito indefinido. A passiva é possível como adaptação, mas apaga a alternância deliberada entre os futuros passivos e este plural ativo. «Darão» preserva a ambiguidade do agente e o verbo de dar.
  - severity: medium
    issue: «também será medido para vocês» enfraquece ἀντί
    rationale: «Também» sugere mera adição; o prefixo ἀντί exprime medida em retorno. «Será medido de volta a vocês» preserva melhor a reciprocidade.
  - severity: low
    issue: Posição do marcador da nota
    rationale: O marcador deve seguir diretamente «colo de vocês», a expressão que a nota explica, e preceder a pontuação final.
  revised_text: 'Deem, e será dado a vocês: uma boa medida — compactada, sacudida e transbordante — darão no colo de vocês[a]. Pois, com a medida com que medem, será medido de volta a vocês.'
  revised_footnotes:
