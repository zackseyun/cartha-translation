revisions:
- from: 'Deem, e lhes será dado: uma boa medida — apertada, sacudida e transbordante — será colocada no colo de vocês.[a] Pois, com a medida com que medem, também será medido para vocês.'
  to: 'Deem, e será dado a vocês: uma boa medida — compactada, sacudida e transbordante — darão no colo de vocês[a]. Pois, com a medida com que medem, será medido de volta a vocês.'
  rationale: A revisão melhora a precisão lexical de πεπιεσμένον, conserva o plural ativo indefinido de δώσουσιν sem identificar seu agente e explicita a reciprocidade de ἀντιμετρηθήσεται. Mantém-se a abrangência da exortação e a imagem de mercado, sem limitá-las a esmolas ou finanças.
