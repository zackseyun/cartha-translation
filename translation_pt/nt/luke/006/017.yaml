id: LUK.6.17
reference: Luke 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: pt
  text: E, descendo com eles, ele ficou de pé num lugar plano[a]. Havia ali uma grande multidão de seus discípulos e uma grande multidão do povo de toda a Judeia, de Jerusalém e do litoral de Tiro e Sidom,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «numa planície». A expressão grega significa literalmente «num lugar plano».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: descendo com eles
  rationale: O particípio aoristo indica o movimento de descida associado à ação principal; a formulação é natural em português e conserva a direção e a companhia.
- source_word: ἔστη
  choice: Jesus parou
  rationale: No contexto narrativo, o verbo indica que ele se deteve e tomou posição. O nome explícito evita ambiguidade em português sem acrescentar conteúdo referencial.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: num lugar plano
  rationale: Reproduz de perto τόπος, «lugar», e πεδινός, «plano», sem especificar indevidamente uma planície geográfica extensa.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: uma grande multidão de seus discípulos
  rationale: Expressa um grupo numeroso composto por discípulos de Jesus e preserva a distinção em relação ao povo mencionado em seguida.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: muita gente
  rationale: Comunica em português corrente o grande número de pessoas da população em geral, em contraste com os discípulos, sem a rigidez de «uma grande multidão do povo».
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: de toda a Judeia
  rationale: Preserva o sentido abrangente de πάσης e usa a forma geográfica corrente em português.
- source_word: Ἰερουσαλὴμ
  choice: Jerusalém
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: do litoral de Tiro e Sidom
  rationale: παράλιος designa a faixa junto ao mar; «litoral» transmite de modo conciso a região costeira associada às duas cidades.
theological_decisions:
- issue: Formulação topográfica do cenário do discurso
  choice: num lugar plano
  alternative: numa planície
  rationale: A tradução mantém o sentido lexical da expressão grega sem harmonizá-la com o cenário de Mateus nem pressupor que Lucas descreva uma planície geográfica ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a distinção entre discípulos e a população mais ampla foram preservadas. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
