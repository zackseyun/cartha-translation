- from: E, descendo com eles, Jesus parou num lugar plano[a]. Havia ali uma grande multidão de seus discípulos e muita gente de toda a Judeia, de Jerusalém e do litoral de Tiro e Sidom,
  to: E, descendo com eles, ele ficou de pé num lugar plano[a]. Havia ali uma grande multidão de seus discípulos e uma grande multidão do povo de toda a Judeia, de Jerusalém e do litoral de Tiro e Sidom,
  rationale: A revisão substitui uma expressão que apenas indica interrupção do movimento por uma que comunica a postura implicada por ἔστη. Também restabelece explicitamente a grande multidão e «o povo», preservando a distinção entre os discípulos e a população mais ampla. Mantêm-se o sentido topográfico cauteloso de «lugar plano», o topônimo tradicional «Sidom» e a vírgula final, pois a frase se completa no versículo seguinte.
