id: LUK.6.22
reference: Luke 6:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: pt
  text: Felizes são vocês quando as pessoas os odiarem, quando os excluírem, os insultarem e rejeitarem o nome de vocês como mau[a], por causa do Filho do Homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, repudiarem publicamente o nome ou a reputação de vocês, tratando-o como algo moralmente mau.
    reason: Esclarece o provável sentido social da expressão idiomática grega sem substituir sua imagem no texto principal.
lexical_decisions:
- source_word: Μακάριοί
  choice: Felizes
  rationale: Em português atual, “Felizes” mantém a forma reconhecível das bem-aventuranças e comunica uma condição de favor que não se reduz a uma emoção passageira.
- source_word: ὅταν
  choice: quando
  rationale: Com os subjuntivos, indica uma circunstância futura indefinida; “quando” é natural e preserva a formulação proverbial.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: as pessoas os odiarem
  rationale: “As pessoas” expressa o valor humano genérico de οἱ ἄνθρωποι, e “odiarem” conserva diretamente a força da hostilidade.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: os excluírem
  rationale: No contexto de perseguição social, o verbo indica separação ou exclusão da convivência comunitária.
- source_word: ὀνειδίσωσιν
  choice: os insultarem
  rationale: “Insultar” é claro e contemporâneo para a ideia de censurar, afrontar ou injuriar verbalmente.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: rejeitarem o nome de vocês como mau
  rationale: A expressão grega é idiomática e sugere repúdio público do nome ou da reputação. “Rejeitarem” comunica naturalmente a ação, enquanto “o nome de vocês” preserva a imagem e “como mau” mantém a caracterização moral sem explicá-la em excesso.
- source_word: ἕνεκα
  choice: por causa de
  rationale: Expressa de modo natural a causa da hostilidade sofrida.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Preserva o título tradicional, seu uso nos Evangelhos e suas ressonâncias intertextuais.
theological_decisions:
- issue: Sentido de μακάριοι na bem-aventurança
  choice: Felizes
  alternative: Abençoados; Bem-aventurados
  rationale: “Felizes” é a forma corrente e compreensível na tradição portuguesa das bem-aventuranças. Aqui descreve uma condição objetiva de favor, determinada pela declaração de Jesus, não mero contentamento emocional.
- issue: Expressão ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: rejeitarem o nome de vocês como mau
  alternative: expulsarem o nome de vocês como mau; denunciarem vocês como maus
  rationale: A opção mantém “nome” e a ambiguidade entre o repúdio da identidade, da reputação e da posição social dos discípulos, mas evita uma construção excessivamente literal e pouco natural em português.
- issue: Referência genérica de οἱ ἄνθρωποι
  choice: as pessoas
  alternative: os homens; os seres humanos
  rationale: O referente é genérico, não limitado ao sexo masculino.
- issue: Título τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Filho do Homem
  alternative: Filho do ser humano
  rationale: A forma consagrada preserva o caráter titular, o uso evangélico e as alusões bíblicas sem impor uma interpretação específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A repetição de “quando” acompanha a estrutura grega; os pronomes “vocês/os” tornam explícito o plural. A formulação preserva a tensão paradoxal da bem-aventurança e a ambiguidade parcial da referência ao “nome”.
