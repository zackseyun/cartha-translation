  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: pt
  text: 'Então Jesus lhes respondeu: “Vocês nem sequer leram o que Davi fez quando ele e os que estavam com ele sentiram fome?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: respondeu
  rationale: A construção participial seguida de verbo finito é idiomática no grego koiné; em português natural, “respondeu” comunica o sentido sem a redundância de “respondendo, disse”.
- source_word: πρὸς αὐτοὺς
  choice: lhes
  rationale: “Jesus lhes respondeu” expressa de modo idiomático os destinatários da resposta.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Vocês nem sequer leram
  rationale: “Nem sequer” preserva a ênfase crítica de οὐδέ, enquanto o pretérito perfeito é natural em português para esta pergunta retórica sobre conhecimento das Escrituras.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: o que Davi fez
  rationale: Construção relativa corrente e fiel ao grego.
- source_word: ὁπότε ἐπείνασεν
  choice: quando ... sentiram fome
  rationale: “Quando” traduz diretamente a conjunção temporal, e “sentiram fome” comunica de forma natural o aoristo narrativo.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: ele e os que estavam com ele
  rationale: Preserva tanto o pronome explícito quanto a expressão participial, evitando interpretar o grupo mais especificamente como “companheiros”.
