  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: pt
  text: A quem bater em você na face[a], ofereça[b] também a outra; e a quem tirar de você a capa[c], não lhe negue também a túnica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na mandíbula”.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz mais literalmente “ofereça” ou “apresente”, não “vire”.
    reason: alternative_reading
  - marker: c
    text: A “capa” (ἱμάτιον) era a veste exterior; a “túnica” (χιτών), a peça usada por baixo.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: A quem lhe bater
  rationale: O particípio presente substantivado descreve genericamente a pessoa que desfere o golpe. A construção mantém o destinatário do imperativo em primeiro plano e soa natural em português.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: na face
  rationale: σιαγών pode designar a face ou a mandíbula. “Face” comunica de modo claro o local do golpe sem restringir excessivamente a anatomia.
- source_word: πάρεχε
  choice: ofereça
  rationale: παρέχω significa dar, proporcionar ou apresentar. “Ofereça” preserva a ação voluntária exigida pelo imperativo e evita importar de Mateus o verbo tradicional “virar”.
- source_word: καὶ τὴν ἄλλην
  choice: também a outra
  rationale: A expressão retoma elipticamente a outra face, preservando tanto o referente implícito de ἄλλην quanto o valor aditivo de καί.
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: a quem tirar de você a capa
  rationale: αἴρω aqui expressa retirar ou levar, enquanto ἱμάτιον designa a veste exterior. A formulação comunica a tomada da peça sem decidir se ocorre por furto, confisco ou outra forma de apropriação.
- source_word: καὶ τὸν χιτῶνα
  choice: também a túnica
  rationale: χιτών é a veste usada por baixo da capa. “Túnica” conserva a distinção cultural entre as duas peças sem substituí-las por equivalentes modernos imprecisos.
- source_word: μὴ κωλύσῃς
  choice: não negue
  rationale: κωλύω significa impedir, proibir ou obstar. Neste contexto, “não negue” exprime naturalmente a ordem de não impedir nem recusar que a segunda peça seja levada.
theological_decisions:
- issue: Possível harmonização com a formulação mais conhecida de Mateus, “virar a outra face”
  choice: 'Preservar a formulação própria de Lucas: “ofereça também a outra”'
  alternative: “vire também a outra face”
  rationale: Lucas emprega πάρεχε, “ofereça/apresente”, e não um verbo que signifique “virar”. A tradução mantém a redação específica deste Evangelho.
- issue: Se os imperativos devem receber qualificações interpretativas no texto
  choice: Traduzir diretamente os imperativos, sem atenuação ou explicação doutrinária
  alternative: Acrescentar no texto qualificações sobre não retaliação, hipérbole ou aplicação jurídica
  rationale: O original apresenta ordens diretas. Preservar sua força mantém a tensão ética e teológica sem resolver no texto debates de interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se o tratamento na terceira pessoa do singular e o paralelismo dos dois imperativos. “Capa” e “túnica” preservam a distinção entre as vestes antigas; as notas registram a alternativa anatômica e a diferença verbal em relação à formulação tradicional.
