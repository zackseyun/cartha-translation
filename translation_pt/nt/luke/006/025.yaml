  source_fidelity: 'A tradução acompanha com precisão a estrutura e o sentido do grego: o duplo «Ai de vocês», o contraste temporal marcado por «agora», o estado presente de saciedade, a fome futura e a sequência intensificada «se lamentarão e chorarão». «Estão saciados» representa adequadamente o particípio perfeito ἐμπεπλησμένοι como estado presente resultante.'
