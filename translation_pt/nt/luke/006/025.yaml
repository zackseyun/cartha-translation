id: LUK.6.25
reference: Luke 6:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: pt
  text: Ai de vocês que agora estão saciados, porque passarão fome.[a] Ai de vocês[b] que agora estão rindo, porque se lamentarão e chorarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terão fome”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Que aflição para vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ai de vocês
  rationale: Mantém a força profética de advertência e juízo da interjeição grega, sem reduzi-la a mera compaixão. A expressão é corrente e solene em português.
- source_word: ἐμπεπλησμένοι
  choice: estão saciados
  rationale: Expressa o estado presente resultante de terem sido plenamente satisfeitos, preservando o contraste concreto com a fome futura.
- source_word: νῦν
  choice: agora
  rationale: Preserva o contraste temporal decisivo entre a condição presente e a reversão futura.
- source_word: πεινάσετε
  choice: passarão fome
  rationale: Forma natural em português para o futuro do verbo, mantendo a ideia de privação vindoura.
- source_word: γελῶντες
  choice: estão rindo
  rationale: Reproduz a ação presente e contínua do particípio, sem ampliar indevidamente o sentido para alegria em geral.
- source_word: πενθήσετε
  choice: se lamentarão
  rationale: Comunica lamento profundo e conserva sua distinção em relação ao choro expresso pelo verbo seguinte.
- source_word: κλαύσετε
  choice: chorarão
  rationale: Preserva a expressão concreta do pesar e a intensificação retórica formada com πενθήσετε.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente, em português atual, o fundamento de cada declaração de aflição.
theological_decisions:
- issue: Natureza da declaração de aflição
  choice: Advertência profética de futura reversão e juízo dirigida aos que agora estão saciados e despreocupados
  alternative: Mera observação sociológica sobre mudanças de sorte
  rationale: A repetição de οὐαί, os verbos no futuro e o paralelismo com as bem-aventuranças próximas apontam para uma advertência de reversão futura. A tradução mantém essa força sem definir além do texto o modo ou o momento de seu cumprimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ai de vocês” preserva o tom profético; “estão saciados” evita a possível ambiguidade coloquial de “estão fartos”; e “se lamentarão e chorarão” mantém distintos os dois verbos finais.
