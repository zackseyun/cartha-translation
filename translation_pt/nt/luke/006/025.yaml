  terminology: «Ai de vocês» preserva adequadamente a força profética de οὐαί. As escolhas «saciados», «passarão fome», «rindo», «se lamentarão» e «chorarão» são semanticamente defensáveis e não introduzem interpretação doutrinária adicional. As notas oferecem alternativas legítimas; a âncora [b], embora posicionada após «vocês», permanece ligada de modo inteligível à segunda ocorrência de «Ai de vocês».
