source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: pt
  text: Mas ai de vocês, os ricos, porque já receberam a sua consolação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já receberam por completo o seu conforto”. O verbo pode ter o sentido de receber integralmente o que é devido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz o forte contraste com as bem-aventuranças anteriores de modo natural e direto em português.
- source_word: οὐαὶ
  choice: ai de
  rationale: Fórmula profética consagrada que preserva tanto o tom de lamento quanto o de advertência e juízo.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: de vocês, os ricos
  rationale: Mantém a interpelação direta à classe designada pelo adjetivo substantivado, sem acrescentar uma qualificação ausente no grego.
- source_word: ὅτι
  choice: porque
  rationale: Expressa claramente a relação causal entre a advertência e a consolação já recebida.
- source_word: ἀπέχετε
  choice: já receberam
  rationale: Comunica idiomaticamente o sentido de possuir ou receber o que é devido, frequentemente com a nuance de recebimento integral; o advérbio 'já' ressalta a situação presente sem impor uma explicação escatológica.
- source_word: παράκλησιν
  choice: consolação
  rationale: Equivalente direto e digno que preserva o sentido de conforto ou alívio recebido.
- source_word: ὑμῶν
  choice: sua
  rationale: Reproduz o possessivo de maneira natural; no contexto, refere-se inequivocamente aos ricos interpelados.
theological_decisions:
- issue: Natureza da advertência aos ricos
  choice: 'Mantém-se a declaração direta: ''ai de vocês, os ricos''.'
  alternative: Restringir a advertência aos que confiam nas riquezas ou aos ricos desta era.
  rationale: O grego interpela diretamente os ricos, sem declarar neste versículo a razão moral precisa de sua condenação; acrescentar tal restrição reduziria a tensão do dito.
- issue: Força temporal e idiomática de ἀπέχετε
  choice: já receberam
  alternative: estão recebendo; receberam por completo
  rationale: Embora esteja no presente, ἀπέχετε pode funcionar idiomaticamente como fórmula de quitação, indicando que alguém tem ou recebeu integralmente o que lhe cabia. A tradução principal oferece essa leitura natural, e a nota registra explicitamente a nuance de integralidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. 'Consolação' conserva o teor solene do dito; 'ai de vocês' mantém sua força profética.
