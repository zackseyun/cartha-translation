  to: E, se vocês emprestam àqueles de quem esperam receber, que crédito isso lhes dá?[a] Até os pecadores emprestam a pecadores para receberem de volta a mesma quantia.
  rationale: A revisão substitui «mérito» por «crédito», que preserva melhor o sentido de χάρις como reconhecimento favorável na pergunta retórica, e ajusta a nota para refletir a alternativa lexical sem introduzir uma relação de recebimento que não está expressa no original.
