  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: pt
  text: E, se vocês emprestam àqueles de quem esperam receber, que crédito isso lhes dá?[a] Até os pecadores emprestam a pecadores para receberem de volta a mesma quantia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que gratidão há para vocês?” A palavra grega também pode significar “gratidão”, mas aqui provavelmente se refere a crédito ou reconhecimento favorável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: emprestam
  rationale: Expressa naturalmente em português o ato de ceder dinheiro ou bens esperando devolução, sem linguagem técnica.
- source_word: παρ’ ὧν
  choice: àqueles de quem
  rationale: A construção portuguesa indica tanto os destinatários do empréstimo quanto as pessoas de quem se espera receber.
- source_word: ἐλπίζετε λαβεῖν
  choice: esperam receber
  rationale: Neste contexto, ἐλπίζω comunica expectativa de retorno, e não apenas desejo; 'receber' preserva a formulação ampla do grego.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: que mérito há nisso para vocês?
  rationale: '''Mérito'' comunica aqui reconhecimento ou valor digno de aprovação, sem sugerir que χάρις se refira à graça salvífica. A nota registra a alternativa lexical ''gratidão''.'
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: Reproduz de modo direto e tradicional o adjetivo substantivado, preservando a categoria moral empregada por Lucas.
- source_word: ἵνα ἀπολάβωσιν
  choice: para receberem de volta
  rationale: ἀπολαμβάνω indica receber em retorno aquilo que foi emprestado.
- source_word: τὰ ἴσα
  choice: a mesma quantia
  rationale: Comunica uma devolução equivalente, provavelmente do principal, sem acrescentar a ideia de juros ou lucro.
theological_decisions:
- issue: Sentido de χάρις na pergunta retórica de Jesus
  choice: mérito, no sentido de valor digno de reconhecimento ou aprovação
  alternative: graça; gratidão; benefício
  rationale: O contexto contrasta a conduta dos discípulos com a dos pecadores. A pergunta trata do que há de distintivo e digno de aprovação nessa conduta, não da graça salvífica como conceito teológico.
- issue: Natureza do retorno esperado no empréstimo
  choice: 'devolução equivalente: ''receberem de volta a mesma quantia'''
  alternative: receber juros; obter lucro; receber pagamento acrescido
  rationale: τὰ ἴσα indica equivalência. A tradução evita introduzir juros, usura ou lucro, elementos que o texto não especifica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural 'vocês' traduz ὑμῖν de modo natural. 'Até os pecadores' preserva a força comparativa de καὶ antes de ἁμαρτωλοί. A formulação evita tecnicismo financeiro e não acrescenta juros ao retorno equivalente.
