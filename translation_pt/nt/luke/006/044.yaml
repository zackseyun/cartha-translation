id: LUK.6.44
reference: Luke 6:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: pt
  text: Pois cada árvore é conhecida pelo seu próprio fruto. Pois não se colhem figos de espinheiros, nem se vindimam uvas de uma sarça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «arbusto espinhoso»; o grego se refere a uma planta espinhosa semelhante a uma silva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: cada árvore
  rationale: Preserva o sentido distributivo de ἕκαστον com o substantivo singular e soa natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a relação explicativa com o contexto. Na segunda ocorrência, a relação lógica continua clara sem repetir a conjunção, o que evita uma formulação pesada em português.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: pelo seu próprio fruto
  rationale: Em combinação com γινώσκεται, «pelo» expressa idiomaticamente o meio ou critério de reconhecimento; «próprio» preserva a ênfase de ἰδίου.
- source_word: γινώσκεται
  choice: é conhecida
  rationale: Reproduz o presente passivo e o caráter proverbial da afirmação.
- source_word: ἀκανθῶν
  choice: espinheiros
  rationale: O plural designa plantas ou arbustos espinhosos; «espinheiros» é claro e natural, sem reduzir o termo a espinhos soltos.
- source_word: συλλέγουσιν
  choice: se colhem
  rationale: Expressa naturalmente a coleta de frutos e preserva a formulação geral e impessoal do provérbio.
- source_word: σῦκα
  choice: figos
  rationale: Equivalente direto e corrente do plural grego.
- source_word: βάτου
  choice: sarça
  rationale: Designa um arbusto espinhoso semelhante a uma silva; «sarça» é conciso, reconhecível no registro bíblico e não especifica indevidamente uma espécie.
- source_word: σταφυλήν
  choice: uvas
  rationale: Embora o grego esteja no singular, o plural genérico é a forma idiomática em português para o fruto colhido da videira.
- source_word: τρυγῶσιν
  choice: se vindimam
  rationale: O verbo é especificamente associado à colheita de frutos maduros, sobretudo uvas; «vindimar» preserva essa precisão e distingue o termo de συλλέγουσιν.
theological_decisions:
- issue: Força metafórica da imagem do fruto
  choice: Manter o provérbio agrícola sem explicitar sua aplicação moral.
  alternative: Expandir interpretativamente a referência para caráter, palavras ou ações.
  rationale: O grego conserva a imagem proverbial, cuja aplicação decorre do contexto. Explicá-la no próprio versículo ultrapassaria o que a fonte afirma e estreitaria sua força retórica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Sarça» e «vindimar» mantêm precisão agrícola e um leve registro bíblico sem tornar a frase obscura. A estrutura proverbial foi preservada, com impessoalidade natural em «se colhem» e «se vindimam».
