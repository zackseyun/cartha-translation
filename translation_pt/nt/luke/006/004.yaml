source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: pt
  text: como entrou na casa de Deus, tomou os pães da Presença[a], comeu-os e deu deles aos que estavam com ele — pães que somente os sacerdotes têm permissão para comer?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os pães consagrados”; tradicionalmente, “os pães da proposição”.'
    reason: Registra uma alternativa funcional e a designação portuguesa tradicional para a expressão cultual, sem ocultar a tradução mais formal adotada no texto.
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Neste contexto, introduz o conteúdo e o modo da ação de Davi, mantendo a ligação com a pergunta iniciada no versículo anterior.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: entrou na casa de Deus
  rationale: Preserva οἶκος como “casa”, em vez de substituir o termo por “templo”, e comunica naturalmente o movimento indicado pelo verbo e pela preposição.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: os pães da Presença
  rationale: Designa os pães sagrados colocados diante de Deus e preserva a dimensão cultual da expressão. O plural corresponde a ἄρτους.
- source_word: λαβὼν ἔφαγεν
  choice: tomou ... [e] comeu-os
  rationale: Transforma naturalmente o particípio seguido do verbo principal em ações sequenciais, sem alterar seu sentido.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: deu deles aos que estavam com ele
  rationale: “Aos que estavam com ele” reflete de perto o grego; “deles” explicita em português que Davi repartiu os pães, sem acrescentar uma quantidade não indicada.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: não é lícito comer
  rationale: Mantém a nuance de permissão legal e religiosa, e não apenas de costume social.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: a não ser aos sacerdotes somente
  rationale: Conserva a exclusividade expressa conjuntamente por εἰ μή e μόνους.
theological_decisions:
- issue: Restrição cultual e legal referente aos pães sagrados
  choice: não é lícito comer
  alternative: não é permitido comer
  rationale: A formulação preserva a referência à norma sacerdotal da Lei de Israel sem introduzir uma explicação teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa de Deus” e “pães da Presença” preservam a linguagem bíblico-cultual sem arcaísmo excessivo. O travessão ajuda a identificar o antecedente da oração relativa, e o ponto de interrogação mantém a continuidade da pergunta iniciada no contexto anterior.
