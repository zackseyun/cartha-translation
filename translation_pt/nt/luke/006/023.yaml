reference: Luke 6:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: pt
  text: 'Alegrem-se naquele dia e saltem de alegria[a], pois vejam: a recompensa de vocês é grande no céu; pois os antepassados deles faziam o mesmo aos profetas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fiquem contentes naquele dia e saltem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, com uma construção elíptica: “pois, da mesma maneira, os antepassados deles faziam aos profetas”; o sentido é que agiam com os profetas da mesma maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Alegrem-se
  rationale: O imperativo aoristo plural de χαίρω expressa uma convocação direta à alegria; “Alegrem-se” é corrente, claro e digno em português.
- source_word: σκιρτήσατε
  choice: saltem de alegria
  rationale: O verbo descreve uma manifestação física exuberante; a expressão explicita de modo idiomático que o salto procede da alegria.
- source_word: ἰδοὺ
  choice: vejam
  rationale: Preserva a função de chamar a atenção dos ouvintes para a razão apresentada em seguida, com naturalidade no português moderno.
- source_word: μισθὸς
  choice: recompensa
  rationale: No contexto, indica retribuição positiva, e não salário em sentido econômico estrito.
- source_word: πολὺς
  choice: grande
  rationale: “Grande” combina naturalmente com “recompensa” e mantém a ênfase do predicativo grego.
- source_word: ἐν τῷ οὐρανῷ
  choice: no céu
  rationale: Traduz diretamente a referência singular ao âmbito celestial sem acrescentar uma explicação teológica.
- source_word: κατὰ τὰ αὐτά
  choice: o mesmo
  rationale: A expressão idiomática indica correspondência de conduta; “faziam o mesmo” comunica isso com clareza.
- source_word: ἐποίουν
  choice: faziam
  rationale: O imperfeito pode indicar ação habitual no passado; em português, o imperfeito “faziam” preserva essa força sem tornar a frase pesada.
- source_word: τοῖς προφήταις
  choice: aos profetas
  rationale: Mantém a construção condensada com ποιέω e não explicita além do texto a natureza hostil do tratamento, que decorre do contexto.
- source_word: οἱ πατέρες αὐτῶν
  choice: os antepassados deles
  rationale: Neste uso, πατέρες designa os predecessores históricos dos opositores. “Antepassados” comunica esse sentido com maior clareza do que o possível e ambíguo “pais” em português.
theological_decisions:
- issue: Natureza da recompensa prometida
  choice: a recompensa de vocês é grande no céu
  alternative: Deus tem no céu uma grande recompensa para vocês
  rationale: A formulação escolhida mantém o céu como localização ou esfera da recompensa, sem inserir Deus como complemento explícito nem definir além do texto a natureza dessa recompensa.
- issue: Referência de “os antepassados deles”
  choice: os antepassados deles
  alternative: os pais deles
  rationale: A expressão provavelmente vincula os perseguidores atuais aos que historicamente rejeitaram os profetas. A tradução preserva essa relação entre gerações sem sugerir apenas os pais imediatos.
- issue: Natureza do que os antepassados fizeram aos profetas
  choice: faziam o mesmo aos profetas
  alternative: tratavam os profetas da mesma maneira
  rationale: A opção mantém a formulação comprimida e a dependência do contexto anterior, evitando especificar em termos mais interpretativos o tratamento sofrido pelos profetas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “vocês” torna explícito o destinatário plural dos imperativos e do pronome grego. O registro é digno sem recorrer ao arcaísmo “eis”.
