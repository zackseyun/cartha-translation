  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: pt
  text: que vieram para ouvi-lo e ser curados de suas doenças; e os que eram afligidos[a] por espíritos imundos iam sendo curados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atormentados” ou “perturbados”. O particípio grego pode indicar diferentes graus de aflição conforme o contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: que vieram
  rationale: Mantém a oração relativa ligada à multidão mencionada no versículo anterior e traduz naturalmente o aoristo narrativo.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: para ouvi-lo
  rationale: Expressa o propósito indicado pelo infinitivo e conserva a referência direta a Jesus.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: ser curados de suas doenças
  rationale: Em português, “curados de” comunica de modo natural a libertação das doenças marcada por ἀπό, enquanto “doenças” preserva o sentido concreto de νόσοι.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: afligidos por espíritos impuros
  rationale: “Afligidos” preserva a amplitude do particípio sem impor necessariamente o grau mais intenso sugerido por “atormentados”; “por” indica a causa ou agência. “Espíritos impuros” é claro e mantém o valor de ἀκάθαρτος.
- source_word: ἐθεραπεύοντο
  choice: iam sendo curados
  rationale: A locução verbal torna perceptível o aspecto contínuo ou repetido do imperfeito passivo dentro da cena.
theological_decisions:
- issue: Identidade de πνεύματα ἀκάθαρτα no contexto de aflição espiritual
  choice: espíritos impuros
  alternative: espíritos imundos; demônios
  rationale: A tradução conserva a expressão grega e sua referência a agentes espirituais malignos sem substituí-la pela paráfrase interpretativa “demônios”.
- issue: Força aspectual de ἐθεραπεύοντο
  choice: iam sendo curados
  alternative: eram curados; foram curados
  rationale: A forma escolhida preserva a ação em andamento ou repetida sugerida pelo imperfeito, sem converter o relato em um acontecimento meramente pontual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A construção começa com “que” para preservar a ligação sintática com Lucas 6:17; o ponto e vírgula mantém as duas descrições coordenadas sem desfazer essa continuidade.
