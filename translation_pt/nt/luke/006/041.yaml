id: LUK.6.41
reference: Luke 6:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: pt
  text: Mas por que você vê o cisco que está no olho do seu irmão[a] e não percebe a trave que está no seu próprio olho?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmão” traduz o substantivo grego masculino singular; o ensino não se limita a um irmão homem.
    reason: cultural_note
  - marker: b
    text: “Cisco” também pode ser entendido como “farpa” ou “palhinha”; “trave” designa uma grande peça de madeira. A imagem contrapõe algo minúsculo a algo enorme.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: por que
  rationale: Neste contexto, τί introduz uma pergunta retórica de censura; “por que” comunica naturalmente essa força em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao ensino anterior.
- source_word: βλέπεις
  choice: vê
  rationale: Preserva o verbo visual comum e a concretude da imagem.
- source_word: κάρφος
  choice: cisco
  rationale: Designa uma partícula pequena e seca; “cisco” é natural em português no contexto do olho e mantém o forte contraste com δοκός.
- source_word: ἀδελφοῦ
  choice: irmão
  rationale: Mantém o substantivo masculino singular da imagem grega, sem restringir em nota a aplicação do ensino apenas a um irmão homem.
- source_word: δοκόν
  choice: trave
  rationale: Refere-se a uma grande peça estrutural de madeira; “trave” preserva com clareza a hipérbole em contraste com “cisco”.
- source_word: ἰδίῳ
  choice: seu próprio
  rationale: Conserva a ênfase possessiva de ἴδιος e o contraste com o olho do irmão.
- source_word: κατανοεῖς
  choice: não percebe
  rationale: Expressa a falta de observação ou reconhecimento atento e diferencia o verbo de βλέπεις.
theological_decisions:
- issue: Termo relacional masculino ἀδελφοῦ
  choice: irmão
  alternative: irmão ou irmã; próximo
  rationale: O texto usa o masculino singular numa ilustração moral representativa. A tradução preserva essa forma, enquanto a nota esclarece que o ensino não se limita a um irmão homem.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a interpelação singular explícita e natural; “cisco” e “trave” preservam a imagem concreta e hiperbólica.
