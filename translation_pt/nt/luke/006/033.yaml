id: LUK.6.33
reference: Luke 6:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: pt
  text: E, se vocês fizerem o bem aos que fazem o bem a vocês, que mérito há nisso para vocês?[a] Até os pecadores fazem o mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que graça há nisso para vocês?” A palavra grega pode significar “graça”, “favor”, “gratidão” ou “mérito”; aqui se refere ao reconhecimento por uma bondade recíproca.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: fizerem o bem
  rationale: Expressa de modo natural o ato de beneficiar alguém e, com o futuro do subjuntivo após “se”, forma uma condição idiomática em português.
- source_word: ἀγαθοποιοῦντας
  choice: aos que fazem o bem
  rationale: Mantém a mesma expressão usada para o verbo principal, preservando a repetição deliberada do grego.
- source_word: ποία ... χάρις
  choice: que mérito
  rationale: Neste contexto ético, χάρις indica reconhecimento, aprovação ou crédito por uma conduta, e não necessariamente a graça salvífica.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Representa naturalmente o dativo, indicando o mérito ou reconhecimento atribuído aos ouvintes.
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: É a tradução direta e tradicional da categoria social e religiosa empregada em Lucas.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: fazem o mesmo
  rationale: Reproduz com clareza e concisão a expressão grega.
- source_word: καὶ
  choice: E / Até
  rationale: O primeiro καί mantém a ligação com a sequência de declarações; o segundo tem força inclusiva ou intensificadora, expressa naturalmente por “Até”.
theological_decisions:
- issue: Sentido de χάρις no contexto do ensino ético
  choice: mérito ou reconhecimento
  alternative: graça; favor; gratidão
  rationale: A pergunta retórica trata do reconhecimento especial por fazer o bem apenas de modo recíproco. “Mérito” comunica esse sentido sem impor aqui o uso teológico de “graça”, enquanto a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” explicita o plural dos pronomes gregos; a repetição de “fazer o bem” preserva a coesão lexical do original.
