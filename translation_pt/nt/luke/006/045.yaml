reference: Luke 6:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: pt
  text: O homem bom tira o que é bom do bom tesouro do seu coração, e o homem mau tira o que é mau do mal; pois a sua boca fala a partir da abundância do coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a partir do que transborda do coração».'
    reason: Alternativa lexical para περισσεύματος; «o que transborda» preserva a imagem de excedente que se derrama.
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: o homem bom
  rationale: Mantém a forma masculina singular do grego e o paralelismo antitético com «o homem mau», ao mesmo tempo que funciona de modo representativo no provérbio.
- source_word: θησαυροῦ
  choice: tesouro
  rationale: Preserva a metáfora de uma reserva interior da qual procedem palavras e ações; «depósito» seria possível, mas menos vívido.
- source_word: καρδίας
  choice: coração
  rationale: É a correspondência portuguesa tradicional e ainda clara para o centro interior da vontade, dos afetos e do caráter.
- source_word: προφέρει
  choice: tira
  rationale: Expressa de modo natural em português a ideia de fazer sair algo de uma reserva interior e permite manter a simetria entre as duas orações.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: mau / mau / o que é mau
  rationale: Conserva de maneira coerente o contraste moral com ἀγαθός. «Perverso» seria mais forte e estilisticamente mais pesado; «ruim» poderia enfraquecer o sentido ético.
- source_word: περισσεύματος
  choice: daquilo que transborda
  rationale: Reproduz a imagem de uma abundância interior que excede seus limites e se manifesta na fala. A alternativa mais formal «da abundância» é registrada em nota.
- source_word: λαλεῖ
  choice: fala
  rationale: Equivalente português natural e digno para a expressão proverbial.
- source_word: τὸ στόμα αὐτοῦ
  choice: a sua boca
  rationale: Mantém a referência explícita à boca como manifestação exterior do que há no coração, em vez de simplificar para «ele fala».
theological_decisions:
- issue: Contraste antropológico e ético em ἀγαθός/πονηρός
  choice: Preservar as categorias morais «bom» e «mau».
  alternative: Empregar categorias funcionais ou atenuadas, como «saudável» e «ruim».
  rationale: O dito relaciona o caráter moral interior com sua expressão exterior. «Bom» e «mau» mantêm a força ética e o paralelismo do texto sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se as metáforas do «tesouro», do «coração» e da «boca», bem como o paralelismo moral entre o homem bom e o homem mau.
