revisions:
- from: O homem bom tira o que é bom do bom tesouro do seu coração, e o homem mau tira o que é mau do seu mau tesouro; pois a sua boca fala daquilo que transborda do coração.[a]
  to: O homem bom tira o que é bom do bom tesouro do seu coração, e o homem mau tira o que é mau do mal; pois a sua boca fala a partir da abundância do coração.[a]
  rationale: A revisão elimina o «tesouro» suprido na segunda oração para seguir a leitura da SBLGNT, mantendo o paralelismo moral por meio de «do mal». Também reformula a última oração para que a boca fale a partir da abundância do coração, e não aparentemente sobre ela. A nota permanece ancorada no segmento que traduz περισσεύματος e oferece a imagem alternativa de transbordamento.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:09:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'A oração relativa ao homem mau acrescenta «seu mau tesouro», mas o texto da SBLGNT traz simplesmente ἐκ τοῦ πονηροῦ («do mal/do que é mau»), sem θησαυροῦ nem pronome possessivo. Além disso, «fala daquilo que transborda» pode ser entendido em português como ‘fala sobre aquilo’, enquanto o grego indica a origem da fala: ela procede da abundância do coração.'
  naturalness: O paralelismo é claro, mas «fala daquilo que transborda do coração» é semanticamente ambíguo no português moderno. «Fala a partir da abundância do coração» comunica naturalmente a relação de procedência.
  terminology: «Homem bom/mau», «tesouro» e «coração» preservam adequadamente o registro proverbial e o contraste ético. «Do mal» reproduz de modo conciso a substantivação neutra de τοῦ πονηροῦ, sem suprir o substantivo omitido no texto crítico.
  issues:
  - severity: medium
    issue: Acréscimo de «seu mau tesouro» na segunda oração.
    rationale: A SBLGNT lê καὶ ὁ πονηρὸς ἐκ τοῦ πονηροῦ προφέρει τὸ πονηρόν. Embora «tesouro» possa ser inferido por paralelismo e conste na redação inglesa fornecida, não está expresso nessa oração do texto-fonte e não deve ser inserido como se estivesse.
  - severity: medium
    issue: «A sua boca fala daquilo que transborda do coração» não expressa de modo inequívoco a relação de origem.
    rationale: Em português, falar de algo normalmente significa falar acerca de algo. O genitivo ἐκ περισσεύματος καρδίας indica que a fala procede da abundância do coração.
  revised_text: O homem bom tira o que é bom do bom tesouro do seu coração, e o homem mau tira o que é mau do mal; pois a sua boca fala a partir da abundância do coração.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: «a partir do que transborda do coração».'
    reason: Alternativa lexical para περισσεύματος; «o que transborda» preserva a imagem de excedente que se derrama.
  revision_rationale: A revisão elimina o «tesouro» suprido na segunda oração para seguir a leitura da SBLGNT, mantendo o paralelismo moral por meio de «do mal». Também reformula a última oração para que a boca fale a partir da abundância do coração, e não aparentemente sobre ela. A nota permanece ancorada no segmento que traduz περισσεύματος e oferece a imagem alternativa de transbordamento.
