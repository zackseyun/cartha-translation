id: LUK.6.13
reference: Luke 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: pt
  text: Quando amanheceu, chamou[a] os seus discípulos e escolheu doze dentre eles, aos quais também deu o nome de apóstolos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “convocou”. O verbo grego pode significar “chamar para junto de si” ou “dirigir-se a alguém”; neste contexto, a reunião dos discípulos para a escolha favorece o primeiro sentido.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos quais também chamou de apóstolos”. O verbo grego significa “dar nome” ou “chamar”; “deu o nome” distingue esta designação do ato anterior de chamar os discípulos para junto de si.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Quando amanheceu
  rationale: Expressa de modo natural em português a chegada do dia indicada pela oração temporal grega, sem a rigidez de “quando se fez dia”.
- source_word: προσεφώνησεν
  choice: chamou
  rationale: No contexto, indica que Jesus chamou os discípulos para junto de si a fim de fazer a escolha; “dirigiu-se a” é lexicalmente possível, mas se ajusta menos à sequência narrativa.
- source_word: μαθητὰς
  choice: discípulos
  rationale: É o termo consagrado e claro no contexto dos Evangelhos, preservando a relação de aprendizagem e seguimento.
- source_word: ἐκλεξάμενος
  choice: escolheu
  rationale: Verbo corrente e preciso, que comunica a seleção deliberada sem tornar a frase pesada.
- source_word: ἀπ’ αὐτῶν
  choice: dentre eles
  rationale: Deixa claro que os doze foram escolhidos de um grupo maior de discípulos.
- source_word: δώδεκα
  choice: doze
  rationale: Correspondência direta e natural do numeral.
- source_word: οὓς καὶ ἀποστόλους ὠνόμασεν
  choice: aos quais também deu o nome de apóstolos
  rationale: Comunica claramente a atribuição de uma designação e evita confusão com o “chamou” anterior.
- source_word: ἀποστόλους
  choice: apóstolos
  rationale: Preserva a designação específica dada aos Doze na narrativa de Lucas, em vez de reduzi-la ao sentido genérico de mensageiros ou enviados.
theological_decisions:
- issue: Se ἀποστόλους deve ser traduzido pelo título estabelecido ou por seu sentido etimológico genérico
  choice: apóstolos
  alternative: enviados; mensageiros
  rationale: Aqui o termo funciona como a designação que Jesus dá aos doze, e não apenas como descrição genérica de pessoas enviadas. “Apóstolos” preserva essa função narrativa sem acrescentar afirmações doutrinárias.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quando amanheceu” evita literalismo pouco natural; “dentre eles” explicita com concisão que os doze vieram de um grupo maior. A estrutura preserva a progressão do grego: chegada do dia, convocação dos discípulos, escolha dos doze e sua designação como apóstolos.'
