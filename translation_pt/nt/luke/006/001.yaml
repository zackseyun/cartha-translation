id: LUK.6.1
reference: Luke 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: pt
  text: Aconteceu que, num sábado, ele atravessava campos de cereais. Seus discípulos arrancavam espigas e as comiam, esfregando-as com as mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eles esfregavam as espigas com as mãos para soltar os grãos que podiam comer.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Reproduz a transição narrativa comum em Lucas sem acrescentar um advérbio temporal ausente do grego e sem soar excessivamente literal.
- source_word: ἐν σαββάτῳ
  choice: num sábado
  rationale: O substantivo sem artigo permite entender a expressão como uma ocasião sabática não especificada; “num sábado” é claro e natural em português.
- source_word: διαπορεύεσθαι αὐτὸν
  choice: ele atravessava
  rationale: Transforma naturalmente a construção grega com infinitivo em oração finita e conserva o aspecto durativo da ação.
- source_word: διὰ σπορίμων
  choice: campos de cereais
  rationale: σπόριμος designa campos semeados ou cultivados; a tradução evita especificar indevidamente qual era o cereal.
- source_word: ἔτιλλον
  choice: arrancavam
  rationale: Expressa a ação contínua indicada pelo imperfeito e descreve com naturalidade a retirada manual das espigas.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: É a forma corrente e clara de traduzir a construção possessiva.
- source_word: καὶ ἤσθιον
  choice: e as comiam
  rationale: Conserva a ação simultânea e contínua ligada ao verbo anterior; o pronome retoma explicitamente “espigas”.
- source_word: τοὺς στάχυας
  choice: espigas
  rationale: στάχυς designa a espiga ou parte superior da planta que contém os grãos; “espigas” é preciso e amplamente compreensível em português.
- source_word: ψώχοντες ταῖς χερσίν
  choice: esfregando-as com as mãos
  rationale: 'Mantém a ação concreta do particípio: esfregar as espigas manualmente para soltar os grãos antes de comê-los.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário compreensível tanto no Brasil como em outros contextos lusófonos. A divisão em duas frases evita uma construção pesada sem alterar a sequência ou a simultaneidade das ações.
