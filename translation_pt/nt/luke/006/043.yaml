id: LUK.6.43
reference: Luke 6:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: pt
  text: Pois não há árvore boa que produza fruto podre,[a] nem, por outro lado, árvore podre que produza fruto bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fruto ruim” / “árvore má”. A palavra grega pode significar deteriorado, podre ou mau.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Pois não há
  rationale: Mantém o valor explicativo de γάρ e expressa de modo natural em português a negação da existência.
- source_word: δένδρον καλὸν
  choice: árvore boa
  rationale: Preserva tanto a imagem agrícola quanto a possível ressonância moral de καλός.
- source_word: ποιοῦν καρπὸν
  choice: que produza fruto
  rationale: Em português, “produzir fruto” é uma combinação idiomática e mantém o sentido do particípio de ποιέω.
- source_word: σαπρόν
  choice: podre
  rationale: Conserva a imagem concreta de fruto deteriorado e também permite a extensão figurada para aquilo que é mau.
- source_word: οὐδὲ πάλιν
  choice: nem, por outro lado
  rationale: οὐδέ coordena a segunda negação, enquanto πάλιν introduz o contraste inverso; esta formulação é clara e natural.
- source_word: δένδρον σαπρὸν
  choice: árvore podre
  rationale: Mantém a repetição lexical do grego e a simetria da comparação, ainda que “árvore má” seja uma alternativa idiomática.
- source_word: καρπὸν καλόν
  choice: fruto bom
  rationale: Espelha “árvore boa” e preserva o paralelismo antitético do original.
theological_decisions:
- issue: Intensidade da metáfora agrícola e moral
  choice: Traduzir σαπρός por “podre” nas duas ocorrências
  alternative: “ruim” ou “mau”
  rationale: “Podre” retém a força concreta da imagem agrícola, sem transformar diretamente a metáfora numa avaliação moral abstrata; a aplicação moral permanece disponível pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Por outro lado” comunica naturalmente a inversão marcada por πάλιν; a repetição de “podre” preserva a textura e a tensão lexical do grego.
