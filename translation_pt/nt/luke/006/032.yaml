source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: pt
  text: E, se vocês amam os que os amam, que mérito há nisso para vocês?[a] Pois até os pecadores amam os que os amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que graça há nisso para vocês?” A palavra grega pode significar “graça”, “favor” ou “reconhecimento”; aqui, refere-se ao que é digno de aprovação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: amam / amam / amam
  rationale: A repetição de “amar” preserva a ligação lexical e a força retórica das três ocorrências do mesmo verbo grego.
- source_word: ποία
  choice: que
  rationale: Introduz de modo natural em português a pergunta sobre o valor ou a qualidade do mérito em questão.
- source_word: χάρις
  choice: mérito
  rationale: Neste contexto, refere-se ao que há de digno de reconhecimento ou aprovação na conduta, não primariamente à graça salvífica. “Mérito” comunica esse sentido ético sem transformar o termo em “recompensa”.
- source_word: ἁμαρτωλοὶ
  choice: pecadores
  rationale: Reproduz naturalmente o adjetivo substantivado e conserva a categoria moral expressa no grego.
- source_word: καὶ γὰρ
  choice: Pois até
  rationale: “Pois” introduz a justificativa, e “até” preserva a ênfase inclusiva de καί.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa de maneira idiomática o dativo grego na construção “que mérito há nisso para vocês?”.
theological_decisions:
- issue: Sentido de χάρις na pergunta de Jesus
  choice: mérito, no sentido de algo digno de reconhecimento
  alternative: graça; favor; reconhecimento
  rationale: O contexto contrasta o amor recíproco comum com uma conduta distintiva. A tradução principal evita impor a χάρις um sentido técnico de graça salvífica, enquanto a nota preserva a amplitude lexical do grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” para o plural. A repetição de “amam” foi mantida deliberadamente, e “nisso” torna natural em português a referência à ação descrita sem alterar o sentido.
