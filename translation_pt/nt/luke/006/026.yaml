  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: pt
  text: Ai de vocês quando todos falarem bem de vocês, pois os antepassados de todos eles costumavam fazer o mesmo aos falsos profetas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαί
  choice: Ai de vocês
  rationale: Preserva a força solene de advertência e denúncia profética da interjeição grega, em formulação natural e reconhecível em português.
- source_word: ὅταν
  choice: quando
  rationale: Expressa uma circunstância geral ou futura sem tornar a frase desnecessariamente pesada.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: falarem bem de vocês
  rationale: Reproduz naturalmente o sentido idiomático de falar de alguém de modo favorável, e não simplesmente falar corretamente.
- source_word: πάντες οἱ ἄνθρωποι
  choice: todos
  rationale: No contexto pessoal da oração, 'todos' transmite de modo claro e inclusivo a ideia de todas as pessoas.
- source_word: γάρ
  choice: pois
  rationale: Mantém a relação explicativa pela qual a conduta das gerações passadas fundamenta a advertência.
- source_word: κατὰ τὰ αὐτά
  choice: o mesmo
  rationale: Com o verbo ποιέω, esta é a expressão idiomática portuguesa mais natural para a comparação de condutas.
- source_word: ἐποίουν
  choice: faziam
  rationale: O pretérito imperfeito português preserva adequadamente o aspecto habitual ou reiterado do imperfeito grego.
- source_word: τοῖς ψευδοπροφήταις
  choice: com os falsos profetas
  rationale: Em português, 'fazer o mesmo com alguém' expressa naturalmente a pessoa que recebe esse tratamento.
- source_word: οἱ πατέρες αὐτῶν
  choice: os antepassados deles
  rationale: Torna explícito o sentido intergeracional do idioma sem sugerir apenas pais biológicos ou exclusivamente homens da geração anterior.
theological_decisions:
- issue: Força da comparação com os falsos profetas
  choice: A advertência associa a aprovação universal ao modo como gerações anteriores tratavam os falsos profetas.
  alternative: Entender o versículo como condenação irrestrita de todo elogio ou comentário positivo.
  rationale: γάρ e κατὰ τὰ αὐτά fundamentam a advertência em um padrão histórico de aprovação dos falsos profetas. A redação mantém essa tensão sem transformar o texto em rejeição absoluta de qualquer elogio.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de 'vocês' preserva a referência plural explícita do grego e evita a ambiguidade regional de 'vós'.
