review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a advertência de οὐαί, a contingência geral de ὅταν, o elogio expresso por καλῶς ... εἴπωσιν e o caráter habitual do imperfeito ἐποίουν. Contudo, «os antepassados deles» deixa o antecedente de «deles» sintaticamente vulnerável a ser entendido como «os falsos profetas», em vez de «todos»; a revisão torna a relação intergeracional explícita.
  naturalness: «Ai de vocês quando todos falarem bem de vocês» é natural, claro e mantém um registro bíblico moderno. «Costumavam fazer o mesmo aos falsos profetas» expressa de modo mais claro o aspecto habitual e a direção do dativo, preservando uma formulação natural.
  terminology: «Falsos profetas» é a equivalência estabelecida e precisa para ψευδοπροφήταις. «Antepassados» é uma opção inclusiva e adequada para πατέρες neste uso geracional, desde que seu referente seja desambiguado.
  issues:
  - severity: medium
    issue: Antecedente ambíguo em «os antepassados deles».
    rationale: Embora possa retomar «todos», o pronome «deles» pode ser lido mais naturalmente em ligação com o sintagma mais próximo, «os falsos profetas». O grego αὐτῶν retoma «todos os seres humanos»; «os antepassados de todos eles» preserva esse referente sem introduzir interpretação doutrinária.
  - severity: low
    issue: O valor habitual de ἐποίουν pode ser expresso de maneira mais explícita.
    rationale: O imperfeito «faziam» é defensável, mas «costumavam fazer» comunica com maior nitidez a ação costumeira indicada pelo imperfeito grego e refletida no audit trail inglês.
  revised_text: Ai de vocês quando todos falarem bem de vocês, pois os antepassados de todos eles costumavam fazer o mesmo aos falsos profetas.
  revised_footnotes: []
  revision_rationale: A revisão resolve a possível troca de referente do pronome em «deles» e explicita o aspecto habitual do imperfeito, sem alterar a advertência, a comparação histórica ou a ambiguidade interpretativa mais ampla do versículo.
