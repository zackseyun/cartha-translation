id: LUK.6.35
reference: Luke 6:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: pt
  text: Mas amem os seus inimigos[a], façam o bem e emprestem, sem esperar nada em troca; então a recompensa de vocês será grande, e vocês serão filhos do Altíssimo[b], porque ele é bondoso para com os ingratos e maus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “sem perder a esperança em ninguém” ou “nunca perdendo a esperança”. A expressão grega μηδὲν ἀπελπίζοντες é difícil; neste contexto, é entendida como não esperar restituição ou retorno.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos” traduz o termo grego masculino plural e pode ter aqui sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Marca o forte contraste com o padrão de reciprocidade descrito antes e soa natural em português atual.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: amem os seus inimigos
  rationale: Preserva diretamente o imperativo e o impacto de “inimigos”, sem suavizá-lo.
- source_word: ἀγαθοποιεῖτε
  choice: façam o bem
  rationale: Expressão portuguesa idiomática que comunica a beneficência ativa do verbo.
- source_word: δανίζετε
  choice: emprestem
  rationale: Traduz o verbo sem acrescentar “dinheiro”, detalhe que o grego não especifica.
- source_word: μηδὲν ἀπελπίζοντες
  choice: sem esperar nada em troca
  rationale: No contexto de empréstimo e reciprocidade, expressa de modo natural a renúncia à expectativa de restituição; a dificuldade lexical é registrada em nota.
- source_word: μισθὸς ὑμῶν πολύς
  choice: a recompensa de vocês será grande
  rationale: “Recompensa” se ajusta ao contexto ético e escatológico, e “grande” preserva a força de πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: filhos do Altíssimo
  rationale: Mantém o substantivo masculino plural do grego e o título divino tradicional, deixando em nota seu possível alcance representativo.
- source_word: χρηστός
  choice: bondoso
  rationale: Comunica a benevolência de Deus para com quem não a merece; “bondoso” é natural e distinto do adjetivo “maus” no fim da frase.
- source_word: ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς
  choice: até para com os ingratos e maus
  rationale: “Para com” expressa a bondade dirigida a essas pessoas, enquanto “até” torna explícita em português a força contextual inclusiva de ἐπί sem alterar o sentido.
theological_decisions:
- issue: Se υἱοὶ Ὑψίστου deve receber uma formulação neutra quanto ao gênero
  choice: filhos do Altíssimo
  alternative: filhos e filhas do Altíssimo; crianças do Altíssimo
  rationale: O texto grego emprega υἱοί, masculino plural. A tradução conserva essa forma histórica e teológica, enquanto a nota esclarece que ela pode ter sentido representativo no contexto.
- issue: Sentido de μηδὲν ἀπελπίζοντες no mandamento de emprestar
  choice: sem esperar nada em troca
  alternative: sem perder a esperança em ninguém; nunca perdendo a esperança
  rationale: O contexto imediato trata de empréstimo e de reciprocidade, favorecendo a ideia de não esperar restituição. Como a expressão grega é difícil e admite outra análise, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. Emprega “vocês” de modo coerente com os imperativos plurais e preserva a tensão lexical nas notas.
