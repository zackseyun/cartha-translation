id: LUK.6.19
reference: Luke 6:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: pt
  text: E toda a multidão procurava tocar nele, porque dele saía poder e curava a todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Preserva o sentido coletivo de que a multidão inteira participava e soa natural em português.
- source_word: ἐζήτουν
  choice: procurava
  rationale: O imperfeito expressa uma ação contínua ou repetida; com o sujeito coletivo singular, «a multidão procurava» é natural e fiel.
- source_word: ἅπτεσθαι
  choice: tocar nele
  rationale: No contexto de cura, ἅπτομαι indica contato físico; «tocar» é a forma mais clara e corrente.
- source_word: δύναμις
  choice: poder
  rationale: Traduz diretamente o poder eficaz associado às curas, sem acrescentar o qualificativo interpretativo «miraculoso».
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: dele saía
  rationale: Reproduz de modo idiomático a ideia de poder que procedia continuamente de Jesus. A posição inicial de «dele» destaca a origem sem tornar a frase artificial.
- source_word: ἰᾶτο πάντας
  choice: curava a todos
  rationale: O imperfeito «curava» preserva a ação em curso, e «a todos» mantém o alcance abrangente de πάντας sem inserir um referente ausente do grego.
theological_decisions:
- issue: Natureza do poder que saía de Jesus
  choice: «dele saía poder»
  alternative: «dele saía poder miraculoso»
  rationale: O texto apresenta Jesus como a fonte do poder eficaz que curava, mas não qualifica explicitamente esse poder como «miraculoso»; a tradução conserva a afirmação sem ampliação doutrinária.
- issue: Relação sintática de «curava a todos»
  choice: Manter «poder» como o sujeito gramatical mais imediato de «curava»
  alternative: 'Explicitar Jesus como sujeito: «e ele curava a todos»'
  rationale: No grego, δύναμις é o antecedente nominativo disponível e ἰᾶτο está no singular, permitindo que o poder seja apresentado como aquilo que curava. Explicitar «ele» resolveria uma relação que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação conserva a coordenação simples e vívida do grego. Não foi incluída nota, pois a alternativa inglesa mencionada para a expressão de saída do poder não pertence ao marcador após «touch him» e, em português, «dele saía» comunica naturalmente o sentido lexical relevante.
