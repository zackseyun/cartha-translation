id: LUK.6.47
reference: Luke 6:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: pt
  text: Todo aquele que vem a mim, ouve as minhas palavras e as pratica — eu mostrarei a vocês com quem ele se parece:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega formas masculinas no singular (“aquele”, “ele”) em sentido genérico, referindo-se a qualquer pessoa que vem, ouve e pratica.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Todo aquele que vem a mim
  rationale: A construção com πᾶς e particípio articular tem sentido genérico e universal. “Todo aquele que vem a mim” é natural em português e conserva o movimento em direção a Jesus expresso por πρός.
- source_word: ἀκούων μου τῶν λόγων
  choice: ouve as minhas palavras
  rationale: A expressão se refere ao ensino proferido por Jesus. “Ouve” mantém o paralelismo verbal da frase, sem acrescentar explicitamente a ideia de atenção ou obediência.
- source_word: λόγων
  choice: palavras
  rationale: λόγοι designa aqui as palavras ou ensinamentos de Jesus. “Palavras” é a correspondência mais direta e natural no contexto.
- source_word: ποιῶν αὐτούς
  choice: as pratica
  rationale: Embora ποιέω signifique literalmente “fazer”, com referência a palavras ou instruções indica agir de acordo com elas. “As pratica” comunica isso com clareza e retoma “palavras” pelo pronome feminino plural.
- source_word: ὑποδείξω ὑμῖν
  choice: eu mostrarei a vocês
  rationale: O futuro introduz a comparação que vem em seguida. “Mostrarei” preserva o sentido de apresentar ou indicar, e “a vocês” torna explícito o plural de ὑμῖν.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: com quem ele se parece
  rationale: A formulação conserva a estrutura comparativa pessoal do grego, em que τίνι significa formalmente “a quem”, e soa natural em português.
theological_decisions:
- issue: Masculino singular genérico
  choice: Manter “Todo aquele” e “ele” como singular representativo
  alternative: Empregar “toda pessoa” e repetir “essa pessoa”, ou omitir o pronome
  rationale: Os particípios e ὅμοιος estão no masculino singular, mas abrangem qualquer pessoa. A tradução preserva essa forma representativa sem restringir o alcance universal da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pratica” evita o pouco idiomático “faz as minhas palavras”, enquanto o travessão e os dois-pontos preservam a introdução enfática da comparação que continua no versículo seguinte.
