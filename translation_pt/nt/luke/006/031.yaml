source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: pt
  text: E, assim como vocês querem que as pessoas façam a vocês, façam o mesmo a elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, como vocês desejam que os outros ajam com vocês, ajam da mesma forma com eles.”'
    reason: Alternativa lexical e sintática para o dativo e para o verbo ποιέω, preservando a amplitude relacional da frase.
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz o padrão de comparação e preserva de modo natural a força comparativa da expressão grega.
- source_word: θέλετε
  choice: vocês querem
  rationale: Expressa desejo ou preferência comum; “querem” é corrente e direto no português moderno.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: que as pessoas façam por vocês
  rationale: A oração com ἵνα apresenta o conteúdo do desejo. “Façam por vocês” é idiomático em português, embora o dativo grego também possa ser entendido em sentido relacional, como “ajam com vocês”.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: O termo é genérico e se refere aos seres humanos em geral, não especificamente a homens do sexo masculino.
- source_word: ποιεῖτε
  choice: façam
  rationale: Mantém a repetição de ποιέω e comunica naturalmente a ordem. O presente imperativo aponta para uma prática habitual, sem necessidade de explicitar o aspecto na tradução.
- source_word: αὐτοῖς
  choice: por elas
  rationale: Retoma “as pessoas” e mantém o paralelismo recíproco com “por vocês”.
- source_word: ὁμοίως
  choice: o mesmo
  rationale: Expressa a correspondência entre a conduta desejada dos outros e a conduta ordenada aos ouvintes, em formulação idiomática.
theological_decisions:
- issue: Referência genérica de οἱ ἄνθρωποι
  choice: as pessoas
  alternative: os homens / os seres humanos
  rationale: O grego tem sentido inclusivo e genérico neste contexto; “as pessoas” comunica isso com clareza sem introduzir exclusividade masculina.
- issue: Sentido do dativo em ποιῶσιν ὑμῖν e αὐτοῖς
  choice: façam por vocês / por elas
  alternative: ajam com vocês / com elas
  rationale: A construção pode ser vertida de maneira benefactiva ou relacional. O texto principal conserva o verbo amplo “fazer” e sua repetição; a nota registra a alternativa relacional sem reduzir o mandamento a uma forma específica de tratamento.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa. A formulação evita linguagem masculina genérica e mantém a estrutura comparativa e recíproca do grego.
