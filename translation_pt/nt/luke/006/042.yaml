source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: pt
  text: 'Como você pode dizer ao seu irmão[a]: ‘Irmão, deixe-me tirar o cisco[b] que está no seu olho’, sem você mesmo ver a trave[c] que está no seu próprio olho? Hipócrita! Tire primeiro a trave do seu próprio olho; então você verá claramente para tirar o cisco que está no olho do seu irmão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmão” traduz o grego ἀδελφός, um termo de parentesco masculino singular; a instrução pode ter aplicação mais ampla, mas a formulação grega é masculina.
    reason: cultural_note
  - marker: b
    text: Ou “farpa”; o grego κάρφος indica um fragmento muito pequeno de material seco.
    reason: lexical_alternative
  - marker: c
    text: Ou “viga”; o grego δοκός se refere a uma grande peça de madeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Como você pode dizer
  rationale: Preserva a pergunta retórica sobre a possibilidade ou impropriedade da ação, em português corrente e direto.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: irmão / Irmão / irmão
  rationale: Mantém o substantivo masculino singular e o tratamento direto do texto grego, sem ampliar nem restringir silenciosamente seu alcance.
- source_word: ἄφες ἐκβάλω
  choice: deixe-me tirar
  rationale: O imperativo de ἀφίημι introduz um pedido de permissão; esta formulação é natural e mantém o sentido da expressão.
- source_word: κάρφος
  choice: cisco
  rationale: Designa um fragmento muito pequeno de material seco; “cisco” é corrente em português e conserva o contraste hiperbólico com a trave.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: sem você mesmo ver
  rationale: “Você mesmo” preserva a ênfase contrastiva de αὐτός, enquanto a construção com “sem” expressa naturalmente a circunstância do particípio negado.
- source_word: δοκός
  choice: trave
  rationale: Refere-se a uma grande peça de madeira estrutural; “trave” reproduz bem a imagem e o contraste desproporcional com o cisco.
- source_word: ὑποκριτά
  choice: Hipócrita!
  rationale: Mantém o vocativo singular e a força da repreensão direta.
- source_word: διαβλέψεις ... ἐκβαλεῖν
  choice: verá claramente para tirar
  rationale: Conserva o sentido de visão nítida de διαβλέπω e a relação do infinitivo com a retirada do cisco, sem acrescentar explicitamente uma ideia de capacidade ausente da forma grega.
theological_decisions:
- issue: Termo de parentesco masculino ἀδελφός em uma instrução ética
  choice: irmão
  alternative: irmão ou irmã; próximo; companheiro de fé
  rationale: O grego emprega o masculino singular tanto na referência quanto no vocativo. A tradução preserva essa forma textual sem negar que o princípio ensinado possa ter aplicação mais ampla.
- issue: Contraste metafórico entre κάρφος e δοκός
  choice: cisco ... trave
  alternative: farpa ... viga; argueiro ... trave
  rationale: A escolha mantém a hipérbole entre algo minúsculo no olho alheio e uma grande peça de madeira no próprio olho, sem atenuar a denúncia da percepção moral distorcida.
translation_notes:
  register: Português moderno, claro e digno, com construção de fácil leitura no Brasil e vocabulário amplamente compreensível no espaço lusófono. “Você” evita solenidade artificial; “trave” preserva a imagem tradicional e corresponde adequadamente à peça estrutural indicada pelo grego.
