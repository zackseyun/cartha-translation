  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: pt
  text: 'E, se alguém perguntar a vocês: “Por que estão desamarrando o jumentinho?”, respondam assim: “O Senhor precisa dele”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O dono precisa dele”.'
    reason: κύριος pode significar “senhor”, “mestre” ou “dono”; embora “Senhor” provavelmente se refira a Jesus, o sentido prático de “dono” é possível neste contexto.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: perguntar
  rationale: Verbo corrente e natural para introduzir uma pergunta direta.
- source_word: Διὰ τί
  choice: Por que
  rationale: Equivalente interrogativo idiomático e claro em português moderno.
- source_word: λύετε
  choice: estão desamarrando o jumentinho
  rationale: No contexto, λύω indica soltar o animal de onde está amarrado. O objeto, implícito no grego, é explicitado como “o jumentinho” para clareza e continuidade narrativa.
- source_word: οὕτως ἐρεῖτε
  choice: respondam assim
  rationale: O futuro grego tem força instrutiva; o imperativo português comunica essa diretiva com naturalidade. “Respondam” se ajusta ao contexto de uma pergunta.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título aplicado a Jesus e sua possível ressonância teológica, sem excluir completamente o sentido contextual de autoridade.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome retoma naturalmente o jumentinho; “precisa dele” é idiomático em português.
- source_word: χρείαν ἔχει
  choice: precisa
  rationale: Equivalente português natural para a expressão idiomática “tem necessidade de”, sem perda de sentido.
theological_decisions:
- issue: Referente e força de Ὁ κύριος
  choice: “O Senhor”, entendido no contexto como Jesus e preservando o valor de título
  alternative: “O dono” ou “O mestre”, em sentido mais estritamente prático
  rationale: Em Lucas, κύριος pode designar Jesus como “Senhor”; essa tradução conserva a ressonância narrativa e teológica. A nota registra a alternativa lexical genuína sem impô-la ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. Emprega “vocês” e evita formulações excessivamente literais como “tem necessidade dele”.
