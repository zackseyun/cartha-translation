  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: pt
  text: E ele ensinava todos os dias no templo. Mas os principais sacerdotes, os escribas e os homens de maior destaque entre o povo procuravam eliminá-lo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: ensinava
  rationale: A construção perifrástica no imperfeito indica ação contínua ou repetida no passado; o imperfeito português comunica isso de modo natural.
- source_word: τὸ καθ’ ἡμέραν
  choice: todos os dias
  rationale: Expressão idiomática que indica ocorrência diária e repetida; esta forma é clara e corrente em português.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa o complexo do templo, não especificamente o santuário interior; “templo” é a tradução tradicional e concisa.
- source_word: οἱ ἀρχιερεῖς
  choice: os principais sacerdotes
  rationale: Designa coletivamente a liderança sacerdotal; “principais sacerdotes” é uma formulação estabelecida e evita sugerir vários sumos sacerdotes simultâneos.
- source_word: οἱ γραμματεῖς
  choice: os escribas
  rationale: Tradução direta e historicamente reconhecível; “mestres da Lei” seria mais explicativo e interpretativo.
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito expressa uma intenção ou tentativa contínua; “procuravam” preserva tanto o sentido lexical quanto o aspecto.
- source_word: ἀπολέσαι
  choice: eliminá-lo
  rationale: No contexto, o verbo implica provocar a morte de Jesus, mas ἀπόλλυμι é mais amplo que simplesmente “matar”; “eliminar” preserva a intenção letal sem estreitar indevidamente o termo.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: os homens de maior destaque entre o povo
  rationale: πρῶτοι significa literalmente “os primeiros” e aqui se refere a homens proeminentes ou influentes; a formulação mantém a referência masculina e explicita naturalmente o status social.
theological_decisions:
- issue: Referência masculina em οἱ πρῶτοι τοῦ λαοῦ
  choice: os homens de maior destaque entre o povo
  alternative: os líderes do povo
  rationale: O plural masculino provavelmente aponta para notáveis masculinos no contexto histórico. A tradução mantém essa referência sem transformar necessariamente o grupo em detentores de cargos formais.
- issue: Amplitude de ἀπολέσαι
  choice: eliminá-lo
  alternative: matá-lo
  rationale: A intenção letal é clara pelo contexto, mas a escolha conserva algo da amplitude lexical de ἀπόλλυμι, sem suavizar a hostilidade dos líderes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos três grupos foi preservada. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
