base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: pt
  text: 'dizendo: “Bendito é o Rei[a] que vem em nome do Senhor! Paz no céu e glória nas alturas!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas traduções seguem a formulação mais conhecida: “Bendito aquele que vem em nome do Senhor”; porém, Lucas inclui explicitamente “o Rei”.'
    reason: alternative_reading
  - marker: b
    text: 'Esta aclamação ecoa Lucas 2:14, mas muda o lugar: ali, “paz na terra”; aqui, “paz no céu”.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém o particípio presente que liga a aclamação ao versículo anterior, com formulação concisa e natural em português.
- source_word: Εὐλογημένος
  choice: Bendito
  rationale: É a forma consagrada e adequada para uma aclamação de bênção, preservando a ressonância do Salmo 118 sem paráfrase desnecessária.
- source_word: ὁ ἐρχόμενος
  choice: que vem
  rationale: Em ligação com “o Rei”, traduz naturalmente o particípio substantivado e conserva seu sentido presente.
- source_word: βασιλεὺς
  choice: o Rei
  rationale: O substantivo está explícito no texto de Lucas e deve ser preservado; o artigo definido comunica a identificação régia específica sem acrescentar interpretação.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Preserva o idioma de fundo semítico e seu sentido de vir sob a autoridade do Senhor.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Paz no céu
  rationale: Mantém a concisão da oração nominal exclamativa e a formulação distinta de Lucas, sem harmonizá-la com “paz na terra” em Lucas 2:14.
- source_word: δόξα ἐν ὑψίστοις
  choice: glória nas alturas
  rationale: Expressão portuguesa natural e tradicional para o idioma referente às regiões mais elevadas, conservando a ressonância com Lucas 2:14.
theological_decisions:
- issue: Aclamação régia messiânica na entrada em Jerusalém
  choice: Manter explicitamente “o Rei”.
  alternative: “Bendito o que vem em nome do Senhor.”
  rationale: Lucas inclui βασιλεὺς, e sua omissão apagaria a ênfase régia explícita do texto.
- issue: Relação com Lucas 2:14
  choice: Traduzir “Paz no céu”.
  alternative: “Paz na terra”.
  rationale: O texto-fonte diz claramente “no céu”; preservar essa expressão mantém o contraste intertextual e a tensão teológica em vez de harmonizá-los.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura exclamativa e o paralelismo poético foram preservados; “nas alturas” mantém a linguagem bíblica reconhecível sem soar arcaica.
