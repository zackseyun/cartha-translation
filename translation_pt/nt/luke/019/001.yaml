lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples, sem acrescentar uma nuance temporal não expressa.
- source_word: εἰσελθὼν
  choice: tendo entrado
  rationale: Reproduz o particípio aoristo e sua ação anterior à do verbo principal, mantendo de modo natural a relação entre as duas ações.
- source_word: διήρχετο
  choice: atravessava
  rationale: O pretérito imperfeito expressa a ação em curso indicada pelo imperfeito grego; o verbo comunica movimento através da cidade.
- source_word: τὴν Ἰεριχώ
  choice: Jericó
  rationale: Forma portuguesa corrente do topônimo; o artigo grego não precisa ser reproduzido diante do nome próprio.
