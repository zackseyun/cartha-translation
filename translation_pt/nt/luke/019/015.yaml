id: LUK.19.15
reference: Luke 19:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these slaves to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: pt
  text: E aconteceu que, ao voltar, depois de receber o poder real, ele mandou chamar à sua presença aqueles escravos[a] a quem havia dado o dinheiro, para saber o que tinham conseguido negociando.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos». O termo grego pode designar servos ou escravos; «escravos» destaca aqui a condição de sujeição ao homem nobre.
    reason: lexical_alternative
  - marker: b
    text: Ou «quanto tinham lucrado» ou «que negócios tinham feito». O verbo grego pode abranger tanto a atividade comercial quanto o resultado obtido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual, sem recorrer ao arcaísmo «sucedeu».
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: ao voltar
  rationale: O infinitivo articular com ἐν tem sentido temporal; «ao voltar» é conciso, natural e fiel.
- source_word: λαβόντα τὴν βασιλείαν
  choice: depois de receber o poder real
  rationale: O particípio indica uma ação anterior à convocação. Neste contexto político, βασιλεία se refere sobretudo à condição ou autoridade régia, não necessariamente ao território; «poder real» comunica esse sentido com clareza.
- source_word: φωνηθῆναι αὐτῷ
  choice: mandou chamar à sua presença
  rationale: Expressa naturalmente tanto a ordem indicada por εἶπεν quanto a convocação para comparecer diante dele.
- source_word: δούλους
  choice: escravos
  rationale: A relação de sujeição ao homem nobre é relevante na parábola. A nota registra «servos» como alternativa contextual legítima.
- source_word: δεδώκει
  choice: havia dado
  rationale: O mais-que-perfeito grego indica que a entrega do dinheiro ocorreu anteriormente; a forma verbal portuguesa conserva essa relação temporal.
- source_word: ἀργύριον
  choice: o dinheiro
  rationale: Embora o termo possa significar literalmente «prata», aqui designa os recursos monetários distribuídos anteriormente.
- source_word: ἵνα γνοῖ
  choice: para saber
  rationale: Mantém de modo natural a finalidade expressa pela oração com ἵνα.
- source_word: τί διεπραγματεύσαντο
  choice: o que tinham conseguido negociando
  rationale: 'Conserva o interrogativo amplo τί e reúne os dois aspectos do verbo: a atividade comercial e seu resultado, sem limitar explicitamente a pergunta ao montante do lucro.'
theological_decisions:
- issue: Tradução de δοῦλος no contexto socioeconômico da parábola
  choice: escravos
  alternative: servos
  rationale: «Escravos» torna visível a condição social e a sujeição desses homens ao nobre, sem transformar a relação em uma categoria teológica. Como δοῦλος também pode ser vertido por «servo» conforme o contexto, a alternativa é registrada em nota.
- issue: Sentido contextual de βασιλεία
  choice: poder real
  alternative: reino
  rationale: Na narrativa, o nobre recebe a posição ou autoridade para governar. «Poder real» evita que o termo seja entendido apenas como território, enquanto «reino» continua sendo uma alternativa lexical possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A abertura conserva a cadência narrativa de Lucas; «à sua presença» mantém o tom formal adequado sem soar arcaico. As notas preservam as ambiguidades relevantes de δοῦλος e do verbo comercial.
