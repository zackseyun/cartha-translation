id: LUK.19.44
reference: Luke 19:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: pt
  text: e arrasarão você e os seus filhos que estão dentro de você até o chão, e não deixarão em você pedra sobre pedra, porque você não reconheceu o tempo da sua visitação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tempo em que você foi inspecionada”. O termo grego pode indicar visitação ou inspeção, especialmente uma visita divina que pode trazer misericórdia ou juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: arrasarão
  rationale: O verbo indica lançar por terra, devastar ou reduzir ao chão. “Arrasarão” é natural e forte em português, sem precisar acrescentar um objeto ausente no grego.
- source_word: σε
  choice: você
  rationale: Mantém o singular da interpelação direta a Jerusalém personificada, sem explicitar interpretativamente “a sua cidade”.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: os seus filhos que estão dentro de você
  rationale: Preserva τέκνα como “filhos” e, portanto, a imagem de Jerusalém como mãe, ao mesmo tempo que exprime com naturalidade os que estão dentro da cidade.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: Não deixarão em você pedra sobre pedra
  rationale: Reproduz a expressão de destruição completa e mantém explícito ἐν σοί, com uma ordem natural em português.
- source_word: ἀνθ’ ὧν
  choice: porque
  rationale: No contexto, introduz a causa do juízo; “porque” transmite diretamente essa relação.
- source_word: ἔγνως
  choice: reconheceu
  rationale: Expressa a falha em perceber e reconhecer a ação decisiva de Deus, nuance mais adequada aqui do que o genérico “conheceu”.
- source_word: καιρὸν
  choice: tempo
  rationale: Mantém o sentido de ocasião significativa ou determinada sem acrescentar “designado”, que não está expresso.
- source_word: τῆς ἐπισκοπῆς σου
  choice: da sua visitação
  rationale: “Visitação” conserva a ressonância bíblica e a amplitude do termo, que pode envolver uma visita divina de misericórdia ou de juízo, sem explicitar Deus no texto principal.
theological_decisions:
- issue: Sentido de ἐπισκοπή no contexto de juízo
  choice: “visitação”, deixando implícito o agente divino e aberta a tensão entre misericórdia e juízo
  alternative: “inspeção” ou “o tempo em que Deus visitou você”
  rationale: O substantivo admite visitação ou inspeção e pode designar a intervenção divina com efeitos de graça ou juízo. A formulação escolhida evita resolver de modo excessivo essa amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “você” sustenta a personificação e a interpelação singular de Jerusalém. A repetição de “você” é deliberada para preservar a retórica do original.
