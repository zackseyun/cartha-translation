  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: pt
  text: Pois o Filho do Homem veio buscar e salvar o que estava perdido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quem estava perdido». A expressão grega está no singular neutro e pode ser entendida em sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: veio
  rationale: O aoristo indicativo é expresso naturalmente pelo pretérito perfeito, preservando a declaração resumida sobre a missão de Jesus.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior de maneira concisa, natural e digna em português.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação reconhecida de Jesus e suas ressonâncias bíblicas, sem paráfrase interpretativa.
- source_word: ζητῆσαι
  choice: buscar
  rationale: O infinitivo indica propósito após ἦλθεν; “buscar” comunica procura intencional e corresponde bem ao uso no contexto.
- source_word: σῶσαι
  choice: salvar
  rationale: Preserva a amplitude salvífica do verbo em Lucas e sua ligação imediata com a salvação mencionada em Lucas 19:9.
- source_word: τὸ ἀπολωλός
  choice: quem estava perdido
  rationale: Expressa de modo natural em português a referência pessoal e genérica do particípio substantivado, enquanto “estava perdido” comunica o estado resultante indicado pelo perfeito.
theological_decisions:
- issue: Alcance e nuance de τὸ ἀπολωλός
  choice: quem estava perdido
  alternative: o que estava perdido; os que estavam perdidos
  rationale: O neutro singular grego pode ter sentido genérico ou coletivo. “Quem estava perdido” aplica-se naturalmente a Zaqueu sem limitar a declaração somente a ele e preserva a amplitude da missão de Jesus; a nota registra uma forma mais próxima da estrutura grega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a conexão explicativa com o contexto, e “quem estava perdido” evita sugerir objetos inanimados sem apagar a forma genérica do grego.
