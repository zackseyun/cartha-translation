id: LUK.19.13
reference: Luke 19:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own slaves[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: pt
  text: 'Depois de chamar dez dos seus escravos[a], deu-lhes dez minas[b] e disse: “Façam negócios até que eu volte.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. A palavra grega doulos pode designar um servo ou um escravo, conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: A mina era uma antiga unidade monetária.
    reason: cultural_note
  - marker: c
    text: Ou “Negociem até que eu volte” ou “Comerciem até que eu volte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Depois de chamar
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; esta formulação expressa a sequência com naturalidade em português.
- source_word: δούλους
  choice: escravos
  rationale: Neste contexto, δοῦλος designa pessoas pertencentes a um senhor; “escravos” preserva com clareza a realidade social pressuposta pela parábola.
- source_word: ἑαυτοῦ
  choice: dos seus
  rationale: O reflexivo ressalta que eram escravos do próprio homem; “dos seus” transmite essa relação de modo idiomático.
- source_word: μνᾶς
  choice: minas
  rationale: Mantém a designação histórica da unidade monetária antiga sem criar uma equivalência enganosa com moedas modernas.
- source_word: Πραγματεύσασθε
  choice: Façam negócios
  rationale: O imperativo pede atividade comercial com o valor confiado, sem especificar indevidamente se isso ocorreria por comércio, investimento ou outro meio.
- source_word: ἐν ᾧ ἔρχομαι
  choice: até que eu volte
  rationale: A expressão temporal é vertida de modo idiomático e, no contexto da viagem narrada, “volte” torna explícita a ideia de retorno já implicada.
theological_decisions:
- issue: Tradução de δοῦλος no contexto da relação entre senhor e escravo
  choice: escravos
  alternative: servos
  rationale: A linguagem de posse e toda a estrutura social da parábola favorecem “escravos”. A nota preserva “servos” como possibilidade lexical sem atenuar silenciosamente a condição retratada.
- issue: Distribuição das dez minas
  choice: deu-lhes dez minas
  alternative: deu uma mina a cada um
  rationale: O texto grego declara apenas o total entregue ao grupo neste versículo. A tradução evita explicitar aqui uma distribuição individual, embora ela possa ser inferida do contexto posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “deu-lhes” conserva um registro bíblico moderadamente formal, enquanto “Façam negócios” comunica a ordem em linguagem corrente. Os marcadores de nota aparecem junto aos termos a que se referem.
