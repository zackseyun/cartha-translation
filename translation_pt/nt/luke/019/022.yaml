source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked slave. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: pt
  text: 'Ele lhe disse: “Pela sua própria boca[a] julgarei você, escravo perverso.[b] Você sabia que sou um homem severo, que tomo o que não pus[c] e colho o que não semeei?[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pelas suas próprias palavras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo perverso”. O grego δοῦλος designa alguém sujeito a um senhor; “escravo” foi usado porque essa condição é relevante no contexto.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “tomo o que não depositei”. O verbo grego para “pus” também pode ter nuance de depósito neste contexto.'
    reason: lexical_alternative
  - marker: d
    text: O grego diz literalmente “o que não semeei”, e não “onde não semeei”.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ele lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito, forma natural na narrativa em português; o pronome indireto preserva αὐτῷ.
- source_word: Ἐκ τοῦ στόματός σου
  choice: Por sua própria boca
  rationale: Preserva a imagem concreta do grego e expressa que o julgamento se baseia na declaração do próprio escravo. A nota oferece a formulação idiomática alternativa.
- source_word: κρίνω
  choice: julgarei
  rationale: Mantém o futuro do verbo e seu sentido amplo de julgar, sem restringi-lo antecipadamente a condenar.
- source_word: πονηρὲ
  choice: perverso
  rationale: Comunica reprovação moral forte e soa natural no tratamento direto; “mau” seria possível, mas pode ser menos incisivo.
- source_word: δοῦλε
  choice: escravo
  rationale: No cenário parabólico, a relação de domínio e sujeição é saliente; “escravo” preserva essa condição social melhor que o termo mais amplo “servo”.
- source_word: ᾔδεις
  choice: Você sabia
  rationale: Reproduz de modo natural o valor de οἶδα no contexto e mantém a caracterização do senhor como parte da réplica retórica.
- source_word: αὐστηρός
  choice: severo
  rationale: Expressa rigor e dureza em português atual e digno, sem o tom arcaizante de “austero”.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: que retiro o que não depositei
  rationale: “Retiro” reflete a ideia de tomar ou levantar, enquanto “depositei” torna inteligível o contraste financeiro sugerido pelo contexto. A nota registra a alternativa mais concreta para τίθημι.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: e colho o que não semeei
  rationale: Preserva a metáfora agrícola e a construção objetiva “o que”, correspondente ao pronome relativo acusativo neutro grego, sem assimilá-la a “onde”.
theological_decisions:
- issue: Tradução de δοῦλος no contexto parabólico de senhor e subordinado
  choice: escravo
  alternative: servo
  rationale: A condição de sujeição ao senhor é relevante na cena. A escolha descreve a relação social representada na parábola sem acrescentar uma conclusão doutrinária.
- issue: Caráter da afirmação de que o senhor é severo
  choice: 'Manter a formulação direta: “Você sabia que sou um homem severo”'
  alternative: “Você diz que sou um homem severo” ou “Se você sabia que sou um homem severo”
  rationale: O grego formula a declaração diretamente dentro da resposta retórica. A tradução não determina se o senhor confirma literalmente a caracterização ou se usa contra o escravo as próprias palavras dele.
- issue: Objeto da colheita na cláusula final
  choice: “o que não semeei”
  alternative: “onde não semeei”
  rationale: O texto grego desta edição traz um pronome relativo acusativo neutro, isto é, um objeto colhido. A redação evita harmonização interpretativa com formulações paralelas.
translation_notes:
  register: Português contemporâneo, amplamente internacional e de leitura natural no Brasil. O tratamento com “você” favorece clareza corrente; a sintaxe permanece digna e próxima da estrutura retórica do original. As imagens da boca, do depósito e da colheita foram preservadas, e a ambiguidade sobre a severidade do senhor não foi resolvida interpretativamente.
