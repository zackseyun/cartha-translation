id: LUK.19.26
reference: Luke 19:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: pt
  text: Eu lhes digo que a todo aquele que tem será dado[a]; mas daquele que não tem, até o que tem será tirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será dado mais”. O grego diz literalmente apenas “será dado”, embora, no contexto, geralmente se entenda que haverá aumento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Mantém o presente da introdução enfática ao discurso e emprega uma construção natural e amplamente compreensível em português.
- source_word: παντὶ τῷ ἔχοντι
  choice: a todo aquele que tem
  rationale: O particípio articular tem valor substantivo e genérico; esta formulação preserva tanto o alcance de παντί quanto a concisão proverbial.
- source_word: δοθήσεται
  choice: será dado
  rationale: Reproduz diretamente o futuro passivo grego sem explicitar um objeto ou a ideia de aumento que o texto deixa implícitos.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: mas, daquele que não tem
  rationale: Conserva a relação adversativa de δέ, a origem da retirada expressa por ἀπό e o caráter genérico do particípio substantivado.
- source_word: καὶ ὃ ἔχει
  choice: até o que tem
  rationale: Neste contraste, καί tem força intensiva; “até” comunica naturalmente que a perda alcançará inclusive aquilo que a pessoa possui.
- source_word: ἀρθήσεται
  choice: será tirado
  rationale: Expressa de modo claro o futuro passivo de αἴρω no sentido de retirada ou privação.
theological_decisions:
- issue: Força interpretativa do dito como princípio de aumento e perda
  choice: Traduzir o provérbio de forma direta, sem explicar seu mecanismo teológico.
  alternative: Restringi-lo explicitamente à administração de bens na parábola ou formulá-lo como princípio geral do Reino.
  rationale: O versículo não especifica se o princípio deve ser sistematizado em termos de salvação, mérito, predestinação ou outra doutrina; a formulação concisa preserva essa tensão e deixa a aplicação ao contexto.
translation_notes:
  register: Português moderno, digno e acessível, com construção proverbial concisa. “Aquele” funciona genericamente, sem acrescentar uma especificação de gênero ausente da aplicação geral do dito.
