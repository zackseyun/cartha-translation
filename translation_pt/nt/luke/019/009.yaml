id: LUK.19.9
reference: Luke 19:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: pt
  text: 'E Jesus lhe disse: “Hoje a salvação chegou a esta casa[a], porque ele também é filho de Abraão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a esta família” ou “aos moradores desta casa”. A palavra grega pode indicar tanto a casa propriamente dita quanto as pessoas que pertencem a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτόν
  choice: E Jesus lhe disse
  rationale: “E” preserva o valor conectivo leve de δέ, enquanto “lhe disse” traduz naturalmente πρὸς αὐτόν sem acrescentar o nome de Zaqueu ao versículo.
- source_word: Σήμερον
  choice: Hoje
  rationale: Equivalente direto e atual, mantido no início da declaração para conservar a ênfase temporal.
- source_word: σωτηρία
  choice: salvação
  rationale: Preserva o peso teológico que o termo costuma ter em Lucas, sem o reduzir a um livramento meramente circunstancial.
- source_word: τῷ οἴκῳ τούτῳ
  choice: a esta casa
  rationale: “Casa” é o equivalente lexical direto de οἶκος e, como no grego, pode abranger tanto a residência quanto as pessoas ligadas a ela; a alternativa é registrada em nota.
- source_word: ἐγένετο
  choice: chegou
  rationale: No contexto da salvação, “chegou” expressa de modo idiomático o acontecimento indicado por γίνομαι e combina naturalmente com o dativo “a esta casa”.
- source_word: καθότι
  choice: porque
  rationale: Introduz com clareza a razão apresentada por Jesus.
- source_word: καὶ αὐτός
  choice: ele também
  rationale: Conserva a ênfase inclusiva da expressão grega sem intensificá-la indevidamente.
- source_word: υἱὸς Ἀβραάμ
  choice: filho de Abraão
  rationale: Mantém a forma masculina singular e a ressonância identitária e pactual da expressão, sem a reduzir explicitamente a mera descendência biológica.
theological_decisions:
- issue: Sentido de “filho de Abraão”
  choice: Manter a expressão bíblica sem definir se ela indica descendência étnica, pertencimento fiel à família de Abraão ou ambos.
  alternative: Traduzir explicitamente como “descendente de Abraão” ou interpretar como “membro da família da fé de Abraão”.
  rationale: O versículo não resolve de modo inequívoco a relação entre essas dimensões; preservar a expressão mantém sua tensão teológica e permite que o contexto de Lucas oriente a interpretação.
- issue: Alcance da salvação sobre a “casa”
  choice: Conservar “casa” no texto e indicar em nota que o termo pode referir-se à família ou aos moradores.
  alternative: Traduzir diretamente como “família” ou “lar”.
  rationale: οἶκος comporta tanto o sentido físico quanto o doméstico-social. A tradução não deve determinar além do texto quem, além de Zaqueu, está incluído na declaração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial “Hoje” preserva a ênfase do grego; “lhe disse” evita repetição pesada, e a formulação mantém a concisão solene da fala de Jesus.
