revisions:
- from: 'dizendo: “Se você tivesse reconhecido, neste dia, também você, o que conduz à paz![a] Mas agora isso está oculto aos seus olhos.”'
  to: 'dizendo: “Se neste dia você, até você, soubesse as coisas que levam à paz![a] Mas agora elas foram ocultadas dos seus olhos.”'
  rationale: A revisão torna a ênfase sobre Jerusalém mais idiomática, mantém explicitamente o plural do original e liga de modo claro «elas» às «coisas que levam à paz». «Foram ocultadas» conserva a passiva do grego e não atribui a ocultação a um agente específico.
