  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: pt
  text: 'dizendo: “Se neste dia você, até você, soubesse as coisas que levam à paz![a] Mas agora elas foram ocultadas dos seus olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se ao menos você soubesse, neste dia, as coisas que levam à paz!” Grego literalmente: “as coisas para a paz”, isto é, o que diz respeito à paz ou conduz a ela.'
    reason: Registra a força possível do lamento e esclarece a expressão grega plural τὰ πρὸς εἰρήνην.
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o particípio presente ligado ao fluxo narrativo do versículo anterior.
- source_word: Εἰ ἔγνως
  choice: Se você tivesse reconhecido
  rationale: Expressa a condição não realizada e o tom de lamento; “reconhecido” comunica aqui percepção e compreensão, sem acrescentar uma partícula equivalente a “somente”.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: neste dia
  rationale: Forma temporal natural em português e próxima da expressão grega.
- source_word: καὶ σὺ
  choice: também você
  rationale: Preserva a ênfase sobre a própria Jerusalém sem recorrer a uma formulação pouco natural.
- source_word: τὰ πρὸς εἰρήνην
  choice: o que conduz à paz
  rationale: Comunica de modo claro o sentido idiomático de aquilo que diz respeito à paz ou leva a ela; o neutro plural grego pode ser expresso naturalmente por uma construção coletiva singular em português.
- source_word: εἰρήνην
  choice: paz
  rationale: Preserva o termo central, com sua amplitude de reconciliação, bem-estar e afastamento do juízo.
- source_word: νῦν δὲ
  choice: Mas agora
  rationale: Marca claramente o contraste abrupto entre a oportunidade não reconhecida e a ocultação presente.
- source_word: ἐκρύβη
  choice: está oculto
  rationale: O aoristo passivo, neste contexto, descreve uma ocultação cujo resultado permanece; a concordância singular retoma conceitualmente “o que conduz à paz”.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: aos seus olhos
  rationale: Expressão idiomática portuguesa que conserva a imagem bíblica da visão como percepção.
theological_decisions:
- issue: Referente implícito de ἐκρύβη
  choice: “isso está oculto”, retomando conceitualmente o que conduz à paz
  alternative: “essas coisas estão ocultas”, retomando formalmente o plural τὰ πρὸς εἰρήνην
  rationale: O verbo grego está no singular embora o antecedente seja neutro plural, permitindo uma retomada conceitual. A formulação portuguesa mantém essa tensão sem introduzir um novo referente.
- issue: Força do lamento condicional
  choice: “Se você tivesse reconhecido”
  alternative: “Se ao menos você tivesse reconhecido”
  rationale: O contexto dá à frase força de lamento, mas o grego não contém uma partícula explícita correspondente a “ao menos”; a alternativa é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação conclui a oração elíptica de lamento antes do contraste “Mas agora”. O tratamento singular por “você/seus” corresponde à personificação de Jerusalém no contexto.
