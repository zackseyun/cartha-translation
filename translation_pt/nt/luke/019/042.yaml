    text: 'Ou: “Se ao menos você soubesse, neste dia, as coisas que levam à paz!” Grego literalmente: “as coisas para a paz”, isto é, o que diz respeito à paz ou conduz a ela.'
    reason: Registra a força possível do lamento e esclarece a expressão grega plural τὰ πρὸς εἰρήνην.
  revision_rationale: A revisão torna a ênfase sobre Jerusalém mais idiomática, mantém explicitamente o plural do original e liga de modo claro «elas» às «coisas que levam à paz». «Foram ocultadas» conserva a passiva do grego e não atribui a ocultação a um agente específico.
