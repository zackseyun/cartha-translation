  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: pt
  text: 'E eles disseram[a]: “O Senhor precisa dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O dono precisa dele”, se κύριος for entendido no sentido de proprietário, e não como título de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: E eles
  rationale: δέ é um conectivo narrativo suave, e o artigo substantivado οἱ retoma os discípulos mencionados no contexto. “E eles” mantém a continuidade sem introduzir contraste indevido.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo de λέγω significa simplesmente “disseram”. Embora a fala seja uma resposta, traduzir por “responderam” acrescentaria uma nuance contextual não expressa pelo verbo.
- source_word: ὅτι
  choice: representado pelos dois-pontos e pelas aspas
  rationale: Aqui ὅτι introduz discurso direto. Em português corrente, a pontuação transmite essa função de modo natural, sem exigir a conjunção “que”.
- source_word: Ὁ κύριος
  choice: O Senhor
  rationale: κύριος pode significar “Senhor” ou “dono”. O contexto de Lucas favorece uma referência a Jesus, preservando-se em nota a alternativa lexical genuína.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome genitivo retoma naturalmente o jumentinho mencionado no contexto. “Dele” mantém a referência pronominal sem explicitação além do grego.
- source_word: χρείαν ἔχει
  choice: precisa
  rationale: A expressão idiomática significa literalmente “tem necessidade”. “Precisa dele” é clara, natural e digna em português moderno, sem perda de conteúdo semântico.
theological_decisions:
- issue: Referente de κύριος na resposta dos discípulos
  choice: “O Senhor”, entendido no contexto como referência a Jesus
  alternative: “O dono”, referindo-se ao proprietário do jumentinho
  rationale: A frase repete a instrução dada por Jesus, e Lucas emprega com frequência κύριος como título de Jesus. Contudo, como o substantivo também pode designar o dono ou senhor do animal, essa possibilidade não é eliminada e aparece em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é concisa e narrativa; “precisa dele” evita o tom artificial de “tem necessidade dele”, enquanto a nota preserva a ambiguidade de κύριος.
