id: LUK.19.33
reference: Luke 19:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: pt
  text: 'Enquanto eles desamarravam o jumentinho, os donos dele[a] lhes disseram: “Por que vocês estão desamarrando o jumentinho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os senhores dele”. A palavra grega é o plural de “senhor” ou “dono” (κύριος), mas aqui se refere aos proprietários humanos do jumentinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων ... λύετε
  choice: desamarravam ... estão desamarrando
  rationale: O verbo λύω descreve concretamente soltar o animal preso. “Desamarrar” é natural em português e sua repetição preserva a correspondência lexical do grego. O particípio presente indica simultaneidade, e o presente da pergunta expressa a ação em curso.
- source_word: δὲ
  choice: Enquanto
  rationale: A construção portuguesa com “Enquanto” incorpora naturalmente tanto a leve progressão narrativa de δέ quanto a simultaneidade expressa pelo genitivo absoluto, sem sugerir contraste indevido.
- source_word: αὐτῶν
  choice: eles
  rationale: O pronome retoma os dois discípulos mencionados no contexto anterior, sem explicitá-los além do que consta neste versículo.
- source_word: πῶλον
  choice: jumentinho
  rationale: πῶλος designa um animal jovem; o contexto precedente o identifica como um jumento. “Jumentinho” comunica com clareza tanto a espécie quanto a pouca idade.
- source_word: εἶπαν
  choice: disseram
  rationale: Equivalente direto de λέγω, mantendo o verbo de fala embora o conteúdo seja uma pergunta.
- source_word: οἱ κύριοι αὐτοῦ
  choice: os donos dele
  rationale: Neste contexto, κύριοι se refere aos proprietários humanos do animal, não a um título teológico. “Donos” é claro e corrente; a nota registra a alternativa mais formal.
- source_word: πρὸς αὐτούς
  choice: lhes
  rationale: O pronome dativo é uma forma portuguesa natural de expressar os destinatários do verbo de fala.
- source_word: Τί
  choice: Por que
  rationale: Neste uso interrogativo, τί pergunta pela razão da ação; “Por que” reproduz naturalmente essa força em português.
theological_decisions:
- issue: Tradução de κύριοι em contexto não teológico de posse humana
  choice: donos
  alternative: senhores
  rationale: Embora κύριος possa significar “Senhor” ou “senhor”, aqui o plural designa os proprietários do jumentinho. “Donos” evita uma ressonância teológica indevida, enquanto a nota preserva a alternativa lexical mais formal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o sujeito plural da pergunta de modo natural; “jumentinho” se apoia no contexto imediato para especificar a espécie do πῶλος.
