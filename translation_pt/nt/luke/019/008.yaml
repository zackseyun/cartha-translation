id: LUK.19.8
reference: Luke 19:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: pt
  text: 'Zaqueu, porém, pôs-se de pé e disse ao Senhor: “Veja, Senhor, dou aos pobres a metade dos meus bens e, se extorqui alguma coisa de alguém[a], restituo quatro vezes o valor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se defraudei alguém em alguma coisa”. O verbo grego pode se referir a extorquir, explorar ou defraudar, às vezes por meio de acusação falsa.'
    reason: lexical_alternative
  - marker: b
    text: Os verbos gregos no presente também podem ser entendidos como “darei” e “restituirei”, expressando uma decisão imediata.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: pôs-se de pé
  rationale: O particípio aoristo de ἵστημι tem sentido intransitivo e introduz a ação narrativa sem explicar além do texto a postura ou a motivação de Zaqueu.
- source_word: κύριον / κύριε
  choice: Senhor
  rationale: Preserva o título e a forma de tratamento dirigida a Jesus, sem reduzi-la apenas a uma expressão de cortesia.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Expressão moderna que chama enfaticamente a atenção para a declaração seguinte, sem o tom arcaico de “eis”.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: a metade dos meus bens
  rationale: Expressa com naturalidade o sentido partitivo e patrimonial da frase grega.
- source_word: τοῖς πτωχοῖς
  choice: aos pobres
  rationale: Equivalente substantivado natural em português, mantendo a referência socioeconômica.
- source_word: δίδωμι
  choice: dou
  rationale: Reproduz o presente do indicativo grego e mantém aberta a possibilidade de prática atual ou decisão imediata.
- source_word: εἴ τινός τι
  choice: se extorqui alguma coisa de alguém
  rationale: A construção indefinida grega é vertida em ordem idiomática portuguesa sem perder nenhum de seus elementos.
- source_word: ἐσυκοφάντησα
  choice: extorqui
  rationale: O verbo pode indicar extorsão, exploração ou fraude, inclusive mediante acusação falsa; “extorqui” se ajusta ao contexto de um chefe de cobradores de impostos, enquanto a nota preserva a alternativa lexical.
- source_word: ἀποδίδωμι
  choice: restituo
  rationale: Comunica a ideia de devolver ou ressarcir e se adapta bem ao contexto de reparação.
- source_word: τετραπλοῦν
  choice: quatro vezes o valor
  rationale: Expressa com clareza uma restituição quádrupla e evita a possível ambiguidade matemática de “quatro vezes mais”.
theological_decisions:
- issue: Valor dos presentes δίδωμι e ἀποδίδωμι
  choice: 'Traduzir pelo presente simples: “dou” e “restituo”'
  alternative: 'Traduzir como decisão imediata no futuro: “darei” e “restituirei”'
  rationale: Os verbos gregos estão no presente. O presente português preserva a forma e não decide se Zaqueu descreve uma prática já existente, uma resolução imediata ou ambas, mantendo a tensão interpretativa e teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Veja” funciona como chamamento enfático; “bens” e “restituo” mantêm precisão sem soar excessivamente técnicos.
