  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: pt
  text: 'dizendo-lhes: “Está escrito: ‘E a minha casa será casa de oração’, mas vocês fizeram dela um covil de ladrões.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: dizendo-lhes
  rationale: Preserva o particípio presente ligado à narrativa anterior e explicita naturalmente o objeto indireto.
- source_word: Γέγραπται
  choice: Está escrito
  rationale: Fórmula portuguesa consagrada e natural para o perfeito passivo que introduz uma citação autorizada das Escrituras.
- source_word: Καὶ ἔσται
  choice: E ... será
  rationale: Mantém tanto a conjunção inicial quanto o valor futuro da citação de Isaías.
- source_word: ὁ οἶκός μου
  choice: a minha casa
  rationale: Traduz οἶκος diretamente como “casa”, preservando a formulação profética e sua referência contextual ao templo.
- source_word: οἶκος προσευχῆς
  choice: casa de oração
  rationale: Expressão portuguesa clara e reconhecível que reproduz naturalmente a construção genitiva.
- source_word: ὑμεῖς δὲ
  choice: mas vocês
  rationale: “Mas” expressa o contraste, e “vocês” conserva a ênfase do pronome grego explícito em português amplamente compreensível.
- source_word: αὐτὸν ἐποιήσατε
  choice: fizeram dela
  rationale: A retomada feminina concorda naturalmente com “casa”; o pretérito perfeito português comunica a ação consumada e seu resultado no contexto.
- source_word: σπήλαιον
  choice: covil
  rationale: No eco de Jeremias 7:11, designa um esconderijo ou refúgio de criminosos; “covil” preserva essa força melhor que o sentido meramente geológico de “caverna”.
- source_word: λῃστῶν
  choice: ladrões
  rationale: Abrange o sentido de assaltantes ou salteadores sem impor uma conotação política específica e mantém a conhecida linguagem profética.
theological_decisions:
- issue: Traduzir a citação referente ao templo como “casa” ou explicitá-la como “templo”
  choice: a minha casa ... casa de oração
  alternative: o meu templo ... casa de oração
  rationale: O grego emprega οἶκος, “casa”, em eco direto de Isaías 56:7. A tradução literal preserva o vínculo intertextual e a imagem teológica da casa de Deus, enquanto o contexto já identifica o referente como o templo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem e o paralelismo da citação profética foram preservados sem recorrer a formulações arcaicas. Não se acrescentaram notas porque as alternativas relevantes podem ser registradas nas decisões editoriais sem necessidade de marca no texto desta unidade.
