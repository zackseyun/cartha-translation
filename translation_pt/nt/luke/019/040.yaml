id: LUK.19.40
reference: Luke 19:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: pt
  text: 'Em resposta, ele disse: “Eu digo a vocês: se estes se calarem[a], as pedras clamarão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: ficarem em silêncio; ou: permanecerem calados.'
    reason: Registra nuances possíveis de σιωπάω, que pode indicar calar-se, estar em silêncio ou continuar calado.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Em resposta, ele disse
  rationale: Reproduz tanto o valor responsivo do particípio quanto o verbo principal, evitando a redundância pouco natural de “respondendo, disse” no português atual.
- source_word: Λέγω ὑμῖν
  choice: Eu digo a vocês
  rationale: Expressão direta e enfática, natural no português moderno e amplamente compreensível, que preserva a autoridade da fórmula de fala.
- source_word: ὅτι
  choice: ':'
  rationale: O conteúdo da declaração é introduzido naturalmente por dois-pontos antes da condição. Traduzir ὅτι por “que” também seria possível, mas tornaria a frase menos fluida com a oração condicional seguinte.
- source_word: οὗτοι
  choice: estes
  rationale: Mantém o demonstrativo sem explicitar no texto principal que se trata dos discípulos ou dos que louvavam, deixando a referência ser determinada pelo contexto.
- source_word: σιωπήσουσιν
  choice: se calarem
  rationale: O futuro do indicativo grego em uma condição é expresso naturalmente pelo futuro do subjuntivo em português. “Calarem” comunica a cessação da fala ou do louvor, preservando alternativas como ficar ou permanecer em silêncio em nota.
- source_word: οἱ λίθοι
  choice: as pedras
  rationale: Tradução literal e concreta, com o artigo definido preservado.
- source_word: κράξουσιν
  choice: clamarão
  rationale: Expressa um brado forte e mantém o caráter vívido e solene da imagem; não reduz o verbo a uma simples fala.
theological_decisions:
- issue: Se a declaração deve ser explicitada como metáfora, hipérbole ou milagre
  choice: Manter a imagem literal “as pedras clamarão” sem explicação interpretativa no texto.
  alternative: Explicitar que as pedras testemunhariam metaforicamente ou que a própria criação louvaria a Deus.
  rationale: O grego apresenta a imagem sem qualificá-la. A tradução preserva sua força retórica e teológica sem decidir entre hipérbole, imagem profética e possibilidade milagrosa.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. “A vocês” favorece compreensão internacional e brasileira; “clamarão” conserva a intensidade e a solenidade da fala. A construção “Em resposta, ele disse” mantém os dois elementos verbais gregos com fluidez.
