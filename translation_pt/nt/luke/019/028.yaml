  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: pt
  text: E, depois de dizer essas coisas, ele seguiu adiante, subindo para Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Depois de
  rationale: A conexão narrativa é expressa naturalmente em português junto com o particípio temporal, sem acrescentar uma nuance interpretativa.
- source_word: εἰπὼν ταῦτα
  choice: de dizer essas coisas
  rationale: O particípio aoristo indica ação anterior ao verbo principal; a construção preserva também a referência ampla do demonstrativo plural ao discurso precedente.
- source_word: ἐπορεύετο
  choice: seguiu
  rationale: O imperfeito descreve a continuação do deslocamento no relato. “Seguiu” é corrente e natural em português nesse contexto.
- source_word: ἔμπροσθεν
  choice: adiante
  rationale: Mantém o sentido adverbial de ir à frente, sem explicitar um complemento (“deles”) que não aparece no texto grego.
- source_word: ἀναβαίνων
  choice: subindo
  rationale: Preserva o particípio presente e a linguagem concreta de subida a Jerusalém, simultânea ao avanço de Jesus.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: Expressa direção e destino sem sugerir que a entrada na cidade já ocorreu.
theological_decisions:
- issue: Preservação da linguagem de subida a Jerusalém
  choice: subindo para Jerusalém
  alternative: indo para Jerusalém
  rationale: O texto fala literalmente de subir. A formulação preserva tanto a realidade geográfica quanto a possível ressonância narrativa, sem explicar nem ampliar essa ressonância.
- issue: Identificação do sujeito elíptico
  choice: Jesus
  alternative: ele
  rationale: Embora o grego traga apenas o verbo na terceira pessoa, o referente contextual é Jesus. Explicitar o nome evita ambiguidade pouco natural em um versículo isolado sem alterar o referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a progressão temporal, o movimento à frente e a subida a Jerusalém.
