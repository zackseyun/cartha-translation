  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: pt
  text: Então ele desceu depressa e o recebeu com alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então ele se apressou, desceu e o acolheu com alegria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: depressa
  rationale: O particípio aoristo de σπεύδω indica prontidão e urgência. Ligado a “desceu”, “depressa” comunica isso de modo natural em português.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva diretamente o movimento descendente exigido pelo contexto de Zaqueu na árvore.
- source_word: ὑπεδέξατο
  choice: recebeu
  rationale: O verbo pode significar receber ou acolher, frequentemente com sentido hospitaleiro. “Recebeu” conserva a amplitude lexical, enquanto a nota registra a alternativa mais explícita.
- source_word: αὐτόν
  choice: o
  rationale: Pronome acusativo masculino que retoma Jesus.
- source_word: χαίρων
  choice: com alegria
  rationale: O particípio presente de χαίρω exprime a disposição que acompanha a recepção. “Com alegria” preserva de modo claro esse valor circunstancial.
- source_word: καὶ ... καὶ
  choice: Então ... e
  rationale: O primeiro καί dá continuidade à sequência narrativa e é naturalmente expresso por “Então”; o segundo coordena as ações com “e”.
