lexical_decisions:
- source_word: εἰσελθὼν
  choice: ao entrar
  rationale: O particípio aoristo indica ação associada e anterior ao início da ação principal. “Ao entrar” expressa a sequência de modo natural, sem enfatizar além do necessário a ideia de posterioridade.
- source_word: ἱερὸν
  choice: templo
  rationale: Ἱερόν designa aqui o complexo do templo, e não especificamente o santuário interior. “Templo” é a forma concisa e corrente; a nota esclarece o alcance espacial.
- source_word: ἤρξατο
  choice: começou
  rationale: Com o infinitivo, ἄρχομαι indica claramente o início da ação.
- source_word: ἐκβάλλειν
  choice: expulsar
  rationale: O verbo comunica retirada enérgica e decisiva. “Expulsar” é natural, atual e preserva essa força.
- source_word: πωλοῦντας
  choice: os que estavam vendendo
  rationale: O particípio presente identifica pessoas envolvidas na atividade contínua de vender, sem acrescentar o que vendiam.
theological_decisions:
- issue: Alcance de ἱερόν na ação de Jesus no templo
  choice: “templo” no texto principal, entendido como o complexo ou recinto do templo
  alternative: “recinto do templo”, “pátios do templo” ou “santuário”
  rationale: O termo grego normalmente abrange o complexo do templo, não apenas o santuário interior. A tradução concisa mantém a leitura natural, e a nota evita uma compreensão espacial indevidamente estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “ao entrar” conserva a fluidez narrativa; “expulsar” transmite a força da ação sem arcaísmo.
