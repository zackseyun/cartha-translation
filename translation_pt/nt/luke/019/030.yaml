source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: pt
  text: 'dizendo: “Vão ao povoado à frente de vocês. Ao entrarem nele, encontrarão um potro amarrado, no qual ninguém jamais montou. Soltem-no e tragam-no.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμην
  choice: povoado
  rationale: Expressa naturalmente uma pequena localidade, sem sugerir necessariamente uma cidade formal.
- source_word: πῶλον
  choice: jumentinho
  rationale: Embora πῶλος isoladamente possa designar a cria de um animal, o contexto da entrada em Jerusalém identifica o animal como um jovem jumento; a forma diminutiva é clara e natural em português.
- source_word: ἐκάθισεν
  choice: montou
  rationale: No contexto de sentar-se sobre um animal, “montou” comunica idiomaticamente o sentido pretendido.
- source_word: λύσαντες
  choice: Desamarrem-no
  rationale: Reproduz a ação de soltar o animal que estava amarrado e mantém o imperativo dirigido a mais de uma pessoa.
- source_word: ἀγάγετε
  choice: tragam-no
  rationale: Indica conduzir o animal até Jesus, de modo natural em português.
theological_decisions:
- issue: Animal designado por πῶλος
  choice: jumentinho
  alternative: potro
  rationale: “Potro” pode ser entendido predominantemente como um cavalo jovem no português corrente. “Jumentinho” harmoniza com a identificação contextual do animal sem introduzir uma interpretação doutrinária.
- issue: Declaração de que ninguém se sentou sobre o animal
  choice: no qual ninguém jamais montou
  alternative: sobre o qual nenhum ser humano jamais se sentou
  rationale: A formulação escolhida preserva a ideia de que o animal nunca havia sido montado, em linguagem idiomática, sem atribuir explicitamente uma razão ritual ou teológica.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na terceira pessoa do plural (“vão”, “desamarrem”, “tragam”), adequados à legibilidade brasileira e amplamente compreensíveis. A sintaxe foi levemente reorganizada para fluência sem perda de conteúdo.
