id: LUK.19.37
reference: Luke 19:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: pt
  text: Quando ele já se aproximava da descida do monte das Oliveiras, toda a multidão dos discípulos, cheia de alegria, começou a louvar a Deus em alta voz por todos os feitos poderosos[a] que tinham visto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milagres” ou “atos de poder”; o grego emprega um termo que também significa “poderes” e ressalta atos em que o poder se manifesta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Quando ele já se aproximava
  rationale: A construção temporal em genitivo absoluto estabelece o pano de fundo da ação; “já se aproximava” preserva tanto o movimento em curso quanto o advérbio ἤδη.
- source_word: πρὸς τῇ καταβάσει
  choice: da descida
  rationale: No contexto de “aproximava”, a expressão localiza Jesus junto ao início ou à região da encosta descendente, sem definir com precisão excessiva a topografia.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: do monte das Oliveiras
  rationale: Forma consagrada e imediatamente reconhecível em português para o topônimo.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: toda a multidão dos discípulos
  rationale: Mantém a ideia de totalidade e identifica a multidão como composta de discípulos, sem transformá-la numa multidão pública indistinta.
- source_word: ἤρξαντο ... χαίροντες αἰνεῖν τὸν θεὸν
  choice: cheia de alegria, começou a louvar a Deus
  rationale: “Começou a louvar” reproduz a construção ingressiva com infinitivo; “cheia de alegria” transmite o particípio circunstancial χαίροντες de modo natural, concordando semanticamente com os integrantes da multidão.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressão idiomática e concreta em português para a intensidade audível da aclamação.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: por todos os feitos poderosos que tinham visto
  rationale: “Por” expressa a causa do louvor; “feitos poderosos” conserva a ligação de δυνάμεις com poder manifesto em atos, e o pretérito mais-que-perfeito composto deixa clara a anterioridade do que foi visto.
theological_decisions:
- issue: Sentido de δυνάμεις no contexto de atos extraordinários
  choice: feitos poderosos
  alternative: milagres; atos de poder
  rationale: O termo pode designar poderes, manifestações de poder ou milagres. “Feitos poderosos” comunica atos extraordinários de poder sem reduzir o campo semântico a um termo técnico mais estreito.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A ordem foi ajustada para evitar uma construção participial artificial, sem alterar a relação entre alegria e louvor. O marcador foi colocado junto a “feitos poderosos”, expressão à qual a nota lexical se refere.
