source:
  edition: SBLGNT
  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: pt
  text: Então levaram o jumentinho até Jesus e, depois de lançarem seus mantos sobre ele, fizeram Jesus montar nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: levaram o jumentinho até Jesus
  rationale: O verbo ἄγω indica conduzir ou levar, e πρός com acusativo expressa movimento em direção a Jesus. Repetir “o jumentinho” é mais natural e claro em português do que usar um pronome masculino potencialmente ambíguo.
- source_word: ἐπιρίψαντες
  choice: depois de lançarem
  rationale: O particípio aoristo apresenta a ação como anterior ao verbo principal; “depois de” torna clara essa sequência.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: seus mantos
  rationale: Ἱμάτια designa aqui as vestes exteriores dos discípulos; “mantos” é preciso, corrente e adequado ao contexto histórico.
- source_word: ἐπὶ τὸν πῶλον
  choice: sobre ele
  rationale: Ἐπί com acusativo indica que os mantos foram postos sobre o animal. O pronome evita repetição sem perder clareza.
- source_word: πῶλον
  choice: jumentinho
  rationale: Πῶλος designa um animal jovem; o contexto anterior identifica especificamente um jumento. “Jumentinho” comunica de modo claro essa referência em português.
- source_word: ἐπεβίβασαν τὸν Ἰησοῦν
  choice: fizeram Jesus montar
  rationale: 'O verbo é causativo: os discípulos ajudaram ou fizeram Jesus subir no animal. A formulação é natural e evita a impressão de que simplesmente o colocaram como um objeto.'
