id: LUK.19.16
reference: Luke 19:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: pt
  text: 'Então veio o primeiro, dizendo: “Senhor,[a] a tua mina rendeu mais dez minas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mestre”. O título grego κύριε pode ser um tratamento respeitoso dirigido a um superior, além de significar “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο δὲ
  choice: Então veio
  rationale: δέ assinala o avanço da narrativa, e παραγίνομαι descreve a chegada ou apresentação do servo. “Então veio” é natural e preserva a sequência.
- source_word: ὁ πρῶτος λέγων
  choice: o primeiro, dizendo
  rationale: Identifica o primeiro servo na sequência e mantém a relação simultânea expressa pelo particípio λέγων.
- source_word: Κύριε
  choice: Senhor
  rationale: É a correspondência usual de κύριε e funciona como tratamento respeitoso dirigido a um superior; “Mestre” continua sendo uma possibilidade contextual, registrada em nota.
- source_word: ἡ μνᾶ σου
  choice: a tua mina
  rationale: Mantém a unidade monetária histórica μνᾶ por transliteração e deixa claro que o capital pertencia ao senhor.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: rendeu dez minas
  rationale: προσεργάζομαι indica obter ou produzir um ganho adicional mediante atividade. Em português, “rendeu dez minas” comunica naturalmente o resultado produzido pelo capital sem substituir a unidade antiga.
theological_decisions:
- issue: Sentido de κύριος como tratamento dentro da parábola
  choice: Senhor
  alternative: Mestre
  rationale: O contexto permite um tratamento respeitoso a um superior, não necessariamente uma confissão cristológica. “Senhor” preserva a correspondência lexical habitual, enquanto a alternativa contextual é explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva a concisão narrativa do grego; “mina” mantém a especificidade histórica, e “rendeu” expressa de modo idiomático o ganho produzido.
