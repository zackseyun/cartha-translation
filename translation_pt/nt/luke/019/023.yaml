source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: pt
  text: Então, por que você não depositou o meu dinheiro no banco? Assim, quando eu voltasse, eu o receberia com juros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: por que
  rationale: Forma interrogativa natural em português, preservando o tom de censura e o pedido de justificativa.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: depositou ... no banco
  rationale: A expressão literalmente fala em pôr ou entregar o dinheiro sobre uma mesa, mas, neste contexto financeiro, τράπεζα designa a atividade bancária; 'depositar no banco' comunica com clareza a ação pretendida.
- source_word: μου τὸ ἀργύριον
  choice: o meu dinheiro
  rationale: Embora ἀργύριον possa denotar prata, aqui se refere ao dinheiro confiado ao servo; 'dinheiro' é natural e evita uma literalidade enganosa.
- source_word: κἀγὼ ἐλθὼν
  choice: Assim, quando eu voltasse
  rationale: O particípio é vertido como oração temporal, e 'assim' explicita de modo natural a consequência pretendida. 'Voltasse' se ajusta ao cenário em que o senhor retorna após partir.
- source_word: σὺν τόκῳ
  choice: com juros
  rationale: τόκος indica juros produzidos pelo depósito; a expressão é corrente, clara e não introduz a conotação pejorativa de 'usura'.
- source_word: αὐτὸ ἔπραξα
  choice: eu o receberia
  rationale: πράσσω tem aqui o sentido comercial de obter ou cobrar o valor devido. 'Receberia' preserva a ideia de recuperar o principal com os juros, em português natural.
theological_decisions: []
