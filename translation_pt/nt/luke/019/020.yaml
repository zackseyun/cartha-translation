  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: pt
  text: 'E veio o outro, dizendo: “Senhor, aqui está a sua mina, que mantive guardada num lenço.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: o outro
  rationale: Refere-se ao servo restante, em contraste com os anteriores; “o outro” preserva naturalmente essa relação.
- source_word: ἦλθεν λέγων
  choice: veio, dizendo
  rationale: Mantém de perto a construção participial e a sequência narrativa do grego, sem deixar o português pouco natural.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma corrente de tratamento correspondente a κύριος e preserva a possível ressonância do termo sem ultrapassar o contexto da parábola.
- source_word: ἰδοὺ
  choice: aqui está
  rationale: No ato de apresentar a mina, esta expressão transmite de modo idiomático tanto o chamado de atenção quanto o gesto dêitico.
- source_word: ἡ μνᾶ σου
  choice: a sua mina
  rationale: “Mina” translitera com precisão a antiga unidade monetária e evita equivalentes modernos enganosos.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: que mantive guardada
  rationale: 'Expressa o estado continuado indicado por εἶχον com o particípio ἀποκειμένην: a mina permaneceu guardada.'
- source_word: ἐν σουδαρίῳ
  choice: num lenço
  rationale: σουδάριον designa um pano pequeno usado para enxugar o rosto ou o suor; “lenço” é claro, natural e suficientemente amplo em português.
theological_decisions:
- issue: Tradução de κύριος como vocativo dentro da parábola
  choice: Senhor
  alternative: Patrão
  rationale: Embora o referente imediato seja o homem nobre da parábola, “Senhor” traduz diretamente κύριος e preserva sua amplitude sem impor que a fala seja uma confissão cristológica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima ao grego. O pronome possessivo “sua” é natural no tratamento por “Senhor”; o referente fica inequívoco no contexto. “Lenço” evita a imagem excessivamente genérica de qualquer pano e corresponde ao uso histórico de σουδάριον.
