  text: καὶ εἶπαν αὐτῷ· Κύριε, ἔχει δέκα μνᾶς—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: pt
  text: 'E eles lhe disseram: “Senhor[a], ele tem dez minas[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor” como simples tratamento respeitoso, ou “mestre”.
    reason: lexical_alternative
  - marker: b
    text: A mina era uma antiga unidade monetária, equivalente aproximadamente ao pagamento por cem dias de trabalho.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação narrativa simples do grego, sem acrescentar uma nuance temporal ou adversativa.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo indicativo é expresso naturalmente pelo pretérito perfeito na narrativa portuguesa.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo retoma a figura do homem nobre ou rei da parábola; o pronome indireto é natural e conciso em português.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo de κύριος pode ser uma forma respeitosa de tratamento neste contexto, mas “Senhor” preserva tanto o valor lexical quanto a autoridade da personagem.
- source_word: ἔχει
  choice: ele tem
  rationale: Expressa diretamente a posse no presente sem acrescentar a ênfase de “já”, que não está explícita no grego.
- source_word: δέκα
  choice: dez
  rationale: Correspondência direta do numeral cardinal.
- source_word: μνᾶς
  choice: minas
  rationale: A transliteração preserva a unidade monetária antiga e evita equipará-la de maneira enganosa a uma moeda moderna.
theological_decisions:
- issue: Tradução de κύριος como vocativo dentro da parábola
  choice: Senhor
  alternative: senhor; mestre
  rationale: Neste versículo, o termo pode funcionar apenas como tratamento respeitoso dirigido à autoridade da parábola, e não necessariamente como confissão cristológica. “Senhor” mantém a amplitude lexical e a ressonância de autoridade sem decidir essa questão além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O travessão final preserva a interrupção ou reação abrupta sugerida pela forma do texto-fonte.
