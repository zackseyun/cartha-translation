  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: pt
  text: 'E alguns dos fariseus, dentre a multidão, lhe disseram: “Mestre, repreenda os seus discípulos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: alguns dos fariseus
  rationale: Preserva o pronome indefinido e o genitivo partitivo, indicando um grupo não especificado dentre os fariseus.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: que estavam no meio da multidão
  rationale: Expressa naturalmente em português a procedência ou localização dos fariseus dentro da multidão, evitando a possível leitura de que acabavam de se afastar dela.
- source_word: εἶπαν πρὸς αὐτόν
  choice: lhe disseram
  rationale: Equivalente narrativo corrente e conciso para a fórmula grega de fala com πρός e acusativo.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Em português, “Mestre” é a forma vocativa tradicional e atual para alguém reconhecido como professor, sem exigir uma afirmação cristológica mais forte.
- source_word: ἐπιτίμησον
  choice: repreenda
  rationale: O imperativo pede censura verbal direta; “repreenda” conserva sua força sem acrescentar explicitamente a ideia interpretativa de fazê-los calar.
- source_word: τοῖς μαθηταῖς σου
  choice: os seus discípulos
  rationale: “Discípulos” preserva a relação mestre-discípulo própria do contexto dos Evangelhos; o dativo regido pelo verbo é expresso naturalmente como objeto direto em português.
theological_decisions:
- issue: Sentido do título Διδάσκαλε dirigido a Jesus
  choice: Mestre
  alternative: Professor
  rationale: O título caracteriza Jesus como aquele que ensina, sem transformar por si só a fala dos fariseus numa confissão cristológica. “Mestre” é natural e digno neste contexto em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “no meio da multidão” explicita idiomaticamente que os fariseus faziam parte dela, sem alterar o referente.
