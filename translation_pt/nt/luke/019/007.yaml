source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: pt
  text: 'Ao verem isso, todos começaram a murmurar: “Ele entrou para hospedar-se com um homem pecador.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Ao verem isso
  rationale: O particípio aoristo é expresso temporalmente de modo natural; “isso” retoma, pelo contexto, a ida de Jesus com Zaqueu.
- source_word: πάντες
  choice: todos
  rationale: Preserva a abrangência enfática da reação coletiva.
- source_word: διεγόγγυζον
  choice: começaram a murmurar
  rationale: O imperfeito admite valor ingressivo e continuativo; a formulação comunica o início da murmuração e mantém o tom negativo.
- source_word: λέγοντες
  choice: — introdução de discurso direto após dois-pontos
  rationale: Em português natural, o conteúdo de “dizendo” pode ser integrado diretamente ao verbo de murmuração sem perda semântica.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: na casa de um homem pecador
  rationale: παρά com o dativo indica hospedagem junto a alguém; “na casa de” explicita naturalmente o cenário, e “homem pecador” preserva o substantivo masculino ἀνήρ e o adjetivo.
- source_word: εἰσῆλθεν
  choice: Ele entrou
  rationale: Traduz diretamente o aoristo de εἰσέρχομαι e funciona com naturalidade na reclamação em discurso direto.
- source_word: καταλῦσαι
  choice: para ficar hospedado
  rationale: Expressa a ideia de permanecer como hóspede, com maior precisão contextual do que o simples “ficar” e sem implicar necessariamente passar a noite.
theological_decisions:
- issue: Caracterização de Zaqueu pela multidão
  choice: um homem pecador
  alternative: um pecador
  rationale: A expressão preserva tanto o adjetivo ἁμαρτωλῷ quanto o substantivo masculino ἀνδρί, mantendo o juízo depreciativo da multidão sem condensá-lo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Murmurar” conserva a tonalidade bíblica e continua amplamente compreensível; “ficar hospedado” comunica de modo corrente a função de hóspede.
