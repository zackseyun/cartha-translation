  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: pt
  text: E eis um homem chamado Zaqueu[a]. Ele era chefe dos cobradores de impostos e era rico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de nome Zaqueu”.'
    reason: Registra uma tradução alternativa natural para a expressão grega ὀνόματι καλούμενος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis
  rationale: Preserva o marcador que chama a atenção do leitor e dá vivacidade à narrativa, em linguagem bíblica ainda clara e corrente.
- source_word: ἀνὴρ
  choice: um homem
  rationale: Traduz diretamente o substantivo masculino singular, que se refere a um indivíduo do sexo masculino.
- source_word: ὀνόματι καλούμενος
  choice: chamado
  rationale: Expressa de modo natural em português a construção grega que identifica o nome da pessoa.
- source_word: Ζακχαῖος
  choice: Zaqueu
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: αὐτὸς ἦν
  choice: ele era
  rationale: Retoma explicitamente o sujeito de modo natural, sem exagerar a leve ênfase do pronome grego.
- source_word: ἀρχιτελώνης
  choice: chefe dos cobradores de impostos
  rationale: Comunica tanto a função ligada à cobrança de impostos quanto a posição superior indicada pelo elemento ἀρχι-.
- source_word: αὐτὸς πλούσιος
  choice: era rico
  rationale: Traduz diretamente o predicado e mantém a repetição verbal do grego em português natural.
