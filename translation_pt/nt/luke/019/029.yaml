  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: pt
  text: E aconteceu que, ao se aproximar de Betfagé e Betânia, junto ao monte chamado das Oliveiras, enviou dois dos discípulos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa característica de Lucas em português natural e atual, preservando também a ligação expressa por καί.
- source_word: ὡς
  choice: ao
  rationale: Introduz de modo idiomático a circunstância temporal ligada ao infinitivo português, sem fixar uma separação rígida entre a aproximação e a ação seguinte.
- source_word: ἤγγισεν
  choice: se aproximar
  rationale: Expressa de maneira corrente o ato de chegar perto de um lugar, evitando a formulação mais solene ou antiquada “se achegar”.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: de Betfagé e Betânia
  rationale: Com “aproximar-se”, o português exige naturalmente a preposição “de”; os topônimos seguem suas formas portuguesas tradicionais.
- source_word: πρὸς τὸ ὄρος
  choice: junto ao monte
  rationale: Neste contexto, πρός situa as localidades em relação ao monte. “Junto ao” é geograficamente natural e evita sugerir que Jesus estivesse indo ao monte depois de já se aproximar das aldeias.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: chamado das Oliveiras
  rationale: Preserva a construção nominal grega tanto quanto o português permite. “Monte chamado das Oliveiras” é compreensível sem inserir uma segunda ocorrência de “monte”, ausente no texto grego.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo simples e preciso do aoristo; o sujeito, Jesus, permanece implícito como no grego.
- source_word: δύο τῶν μαθητῶν
  choice: dois dos discípulos
  rationale: Reproduz a construção partitiva e não acrescenta o possessivo “seus”, embora a referência aos discípulos de Jesus seja clara pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi mantida próxima do grego sem sacrificar a naturalidade; não se acrescentou “seus” antes de “discípulos”, e a fórmula narrativa lucana foi preservada.
