  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: pt
  text: 'pois eu tinha medo do senhor, porque é um homem severo[a]: tira o que não pôs[b] e colhe o que não semeou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rigoroso” ou “duro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tira o que não colocou”. Algumas traduções entendem a expressão de modo mais interpretativo como “retira o que não depositou” ou “cobra o que não aplicou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: eu tinha medo
  rationale: O imperfeito expressa um estado contínuo no passado; “tinha medo” é natural em português e preserva esse aspecto.
- source_word: γάρ
  choice: pois
  rationale: Introduz a explicação da declaração anterior e mantém de modo conciso a ligação argumentativa.
- source_word: σε / εἶ / αἴρεις / θερίζεις
  choice: do senhor / é / tira / colhe
  rationale: O contexto é a fala de um servo ao seu senhor. O tratamento respeitoso em terceira pessoa soa natural em português, embora o grego use formas de segunda pessoa.
- source_word: ἄνθρωπος αὐστηρός
  choice: um homem severo
  rationale: “Severo” conserva o sentido negativo de alguém rigoroso ou duro sem determinar além do texto se a acusação do servo é verdadeira.
- source_word: αἴρεις
  choice: tira
  rationale: Mantém o sentido amplo de tomar ou retirar e forma uma declaração clara no contexto econômico.
- source_word: ὃ οὐκ ἔθηκας
  choice: o que não depositou
  rationale: No contexto imediato de dinheiro confiado e ganho, “depositou” comunica naturalmente o que foi colocado para render; a nota registra a formulação mais literal.
- source_word: θερίζεις
  choice: colhe
  rationale: Preserva a imagem agrícola e é a correspondência corrente de θερίζω em português.
- source_word: ὃ οὐκ ἔσπειρας
  choice: o que não semeou
  rationale: Mantém diretamente a metáfora agrícola e o paralelismo tradicional entre semear e colher.
theological_decisions:
- issue: Se a descrição que o servo faz do senhor deve ser suavizada para proteger a imagem do nobre na parábola
  choice: 'Manter a formulação acusatória do servo: “homem severo”'
  alternative: Empregar sistematicamente uma expressão mais branda, como “homem exigente”
  rationale: O versículo apresenta a explicação e a acusação do próprio servo. A tradução preserva sua força retórica sem decidir se essa descrição é objetivamente verdadeira a respeito do senhor.
translation_notes:
  register: Português moderno, claro e digno, com tratamento respeitoso por “o senhor” adequado à relação entre servo e senhor. A construção mantém o paralelismo entre tirar/depositar e colher/semear. O marcador [a] acompanha “severo”, e [b], a expressão econômica interpretada.
