id: LUK.19.4
reference: Luke 19:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: pt
  text: Então, correu adiante e subiu numa figueira-sicômoro[a] para vê-lo, pois ele estava prestes a passar por ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma figueira da espécie Ficus sycomorus; também chamada sicômoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: correu adiante
  rationale: A combinação do particípio com a expressão direcional indica que Zaqueu se adiantou correndo; a formulação portuguesa é natural e evita redundância.
- source_word: ἀνέβη ἐπὶ
  choice: subiu numa
  rationale: No contexto de uma árvore, exprime claramente o ato de subir nela, sem exigir a explicitação de 'escalou'.
- source_word: συκομορέαν
  choice: figueira-sicômoro
  rationale: Designa a Ficus sycomorus, uma figueira distinta do sicômoro conhecido em outras regiões; a forma composta oferece precisão botânica com legibilidade.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: para vê-lo
  rationale: Preserva de modo conciso e natural a finalidade expressa por ἵνα com o subjuntivo.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão pela qual Zaqueu subiu na árvore e mantém o fluxo narrativo em português.
- source_word: ἐκείνης
  choice: por ali
  rationale: O feminino grego provavelmente pressupõe uma palavra como 'via' ou 'rua'; 'por ali' mantém a referência elíptica sem acrescentar um substantivo específico.
- source_word: ἤμελλεν διέρχεσθαι
  choice: estava prestes a passar
  rationale: Expressa a ação iminente indicada por μέλλω com infinitivo, de maneira idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. O pronome sujeito de 'correu' fica implícito, como é natural em português e inequívoco no contexto. A referência elíptica de ἐκείνης foi preservada por meio de 'por ali'.
