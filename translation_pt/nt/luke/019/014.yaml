id: LUK.19.14
reference: Luke 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: pt
  text: 'Mas os seus concidadãos o odiavam e enviaram uma delegação[a] atrás dele, dizendo: “Não queremos que este homem reine sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma embaixada”. O termo grego se refere a um grupo de representantes enviado em missão oficial.'
    reason: alternativa lexical
lexical_decisions:
- source_word: πολῖται
  choice: concidadãos
  rationale: Preserva o sentido cívico-político de membros da mesma comunidade, sem chamá-los antecipadamente de “súditos”, justamente quando rejeitam o reinado dele.
- source_word: ἐμίσουν
  choice: odiavam
  rationale: O imperfeito indica hostilidade contínua ou característica; “odiavam” é natural em português e não intensifica indevidamente o verbo.
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: Equivalente claro e idiomático para o aoristo narrativo, sem acrescentar solenidade ausente do texto.
- source_word: πρεσβείαν
  choice: uma delegação
  rationale: Designa um grupo de representantes enviado em missão oficial. “Delegação” é corrente e preserva o contexto político.
- source_word: ὀπίσω αὐτοῦ
  choice: atrás dele
  rationale: No contexto, indica que a delegação foi enviada após a partida dele, seguindo-o; a expressão portuguesa mantém essa relação espacial e narrativa.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém de modo direto a ligação do particípio com o conteúdo da mensagem.
- source_word: Οὐ θέλομεν
  choice: Não queremos
  rationale: Expressa de maneira atual e direta a recusa da vontade indicada por θέλω.
- source_word: τοῦτον
  choice: este homem
  rationale: Conserva o tom distanciado, possivelmente depreciativo, do demonstrativo sem recorrer a uma formulação excessivamente coloquial.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: reine sobre nós
  rationale: Preserva a imagem explicitamente régia de βασιλεύω, em vez de reduzi-la à ideia genérica de governar.
theological_decisions:
- issue: Nuance política e régia da parábola
  choice: reine sobre nós
  alternative: governe sobre nós
  rationale: A linguagem de realeza é essencial à imagem da parábola e deve permanecer explícita, sem impor ao versículo uma identificação alegórica além do que ele declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Concidadãos” mantém o campo político sem antecipar a condição de súditos. O marcador [a] foi colocado junto a “delegação”, termo ao qual a nota lexical efetivamente se refere.
