  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: pt
  text: Então, os enviados partiram e encontraram conforme ele lhes tinha dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: «encontraram»; o objeto está subentendido pelo contexto, isto é, aquilo que Jesus lhes havia indicado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: foram
  rationale: O particípio aoristo de ἀπέρχομαι indica que eles partiram para cumprir a instrução. Em português, «foram» expressa isso de modo natural; «foram embora» poderia sugerir uma partida definitiva ou afastamento indevido ao contexto.
- source_word: δὲ
  choice: Então
  rationale: Aqui, δέ dá continuidade à narrativa. «Então» marca naturalmente a progressão dos acontecimentos sem introduzir contraste.
- source_word: οἱ ἀπεσταλμένοι
  choice: os que tinham sido enviados
  rationale: O particípio perfeito passivo substantivado é preservado com uma construção passiva transparente. O mais-que-perfeito composto situa o envio antes da ida, sem acrescentar a noção interpretativa de «mensageiros».
- source_word: εὗρον
  choice: encontraram tudo
  rationale: O verbo significa «encontraram» e não traz objeto expresso. «Tudo» retoma de forma idiomática a situação descrita por Jesus, mas uma nota registra a possibilidade formal de deixar o objeto subentendido.
- source_word: καθὼς
  choice: como
  rationale: καθώς indica correspondência entre o que foi encontrado e o que Jesus dissera. Com «tudo», o português «tudo como» comunica plenamente essa correspondência sem precisar intensificar com «exatamente».
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes havia dito
  rationale: «Dizer a alguém» representa diretamente λέγω com o dativo αὐτοῖς. «Havia dito» torna clara, em português natural, a anterioridade da fala em relação ao encontro.
