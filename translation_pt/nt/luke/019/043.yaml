  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: pt
  text: Pois virão dias sobre você em que os seus inimigos erguerão contra você uma obra de cerco[a], a cercarão e a apertarão por todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma paliçada de cerco” ou “um aterro de cerco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Liga a predição à lamentação anterior com valor explicativo ou causal, de modo natural e solene em português.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: virão dias sobre você
  rationale: Preserva a expressão profética e a ideia de acontecimentos que sobrevirão a Jerusalém, sem reduzi-la apenas a hostilidade.
- source_word: παρεμβαλοῦσιν
  choice: levantarão
  rationale: Com χάρακα, descreve a construção ou instalação de uma obra de cerco; “levantarão” é corrente e mantém a imagem concreta.
- source_word: οἱ ἐχθροί σου
  choice: os seus inimigos
  rationale: Tradução direta e clara da expressão possessiva.
- source_word: χάρακά σοι
  choice: contra você uma fortificação de cerco
  rationale: χάραξ designa aqui uma obra militar erguida para sitiar uma cidade; “fortificação de cerco” é compreensível e suficientemente abrangente para não restringir indevidamente a construção a uma rampa ou paliçada.
- source_word: περικυκλώσουσίν σε
  choice: a cercarão
  rationale: Expressa diretamente o cerco completo; o pronome feminino retoma Jerusalém personificada no contexto.
- source_word: συνέξουσίν σε πάντοθεν
  choice: a apertarão por todos os lados
  rationale: Comunica a pressão e o confinamento produzidos pelo cerco, preservando a ênfase de πάντοθεν na totalidade do envolvimento.
theological_decisions:
- issue: Referente dos pronomes da segunda pessoa na lamentação de Jesus sobre Jerusalém
  choice: Mantém-se o singular, com “você” e depois os clíticos femininos “a”, dirigidos a Jerusalém personificada.
  alternative: Explicitar coletivamente “vocês” ou “os seus habitantes”.
  rationale: Os pronomes gregos estão no singular e o contexto personifica Jerusalém. A tradução preserva essa força profética sem ampliar ou resolver o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” preserva o singular e evita o regionalismo de “tu”; a alternância posterior para “a cercarão” deixa claro que a cidade de Jerusalém, de gênero feminino em português, continua sendo interpelada.
