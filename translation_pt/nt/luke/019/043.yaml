  source_fidelity: 'A sequência e o sentido da predição são bem preservados: dias virão sobre Jerusalém; os inimigos erguerão uma estrutura de cerco, a cercarão e a pressionarão de todos os lados. Contudo, “fortificação” normalmente sugere uma obra defensiva, enquanto χάραξ neste contexto designa uma obra construída pelo exército atacante para o cerco. A nota também chama essa obra de “defensiva”, o que é impreciso.'
  naturalness: O texto tem registro moderno e profético apropriado. “Erguerão” é um pouco mais direto que “levantarão” para a construção da obra de cerco. A retomada feminina por “a” é aceitável, pois Jerusalém é personificada e é gramaticalmente feminina em português.
  terminology: “Obra de cerco” é uma designação abrangente e fiel para χάραξ, sem decidir indevidamente entre paliçada, aterro ou rampa/baluarte de cerco. As alternativas devem ser apresentadas como possibilidades lexicais, não como obras defensivas.
