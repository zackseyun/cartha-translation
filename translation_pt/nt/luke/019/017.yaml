source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: pt
  text: 'E ele lhe disse: “Muito bem, bom servo[a]! Porque você foi fiel numa coisa muito pequena, tenha autoridade sobre dez cidades.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravo”. A palavra grega doulos pode significar “servo” ou “escravo”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Muito bem
  rationale: Interjeição idiomática de aprovação, natural em português e adequada à avaliação positiva do senhor.
- source_word: ἀγαθὲ
  choice: bom
  rationale: Equivalente direto do adjetivo no vocativo, qualificando o servo.
- source_word: δοῦλε
  choice: servo
  rationale: No contexto da parábola, preserva com naturalidade a relação de subordinação ao senhor; a alternativa lexical “escravo” é registrada em nota.
- source_word: ἐν ἐλαχίστῳ
  choice: numa coisa muito pequena
  rationale: Expressa de modo claro e corrente a fidelidade demonstrada em algo de importância ou dimensão mínima.
- source_word: πιστὸς ἐγένου
  choice: você foi fiel
  rationale: Reflete diretamente a construção grega sem acrescentar a nuance interpretativa de que ele “demonstrou” ou “provou” ser fiel.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: tenha autoridade
  rationale: Reproduz de maneira concisa a construção imperativa perifrástica, indicando a concessão de autoridade.
- source_word: ἐπάνω δέκα πόλεων
  choice: sobre dez cidades
  rationale: Mantém o sentido de governo ou jurisdição expresso pela preposição no contexto.
theological_decisions:
- issue: Tradução de δοῦλος no contexto da relação entre senhor e subordinado em uma parábola
  choice: servo
  alternative: escravo
  rationale: “Servo” é natural e mantém a relação hierárquica sem destacar além do necessário o estatuto jurídico implicado em δοῦλος; “escravo” permanece como alternativa lexical legítima em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação da nota após “servo bom” associa o marcador inequivocamente a “servo”, e a pontuação preserva o tom de elogio seguido da explicação e da recompensa.
