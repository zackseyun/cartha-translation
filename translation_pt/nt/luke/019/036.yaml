  text: πορευομένου δὲ αὐτοῦ ὑπεστρώννυον τὰ ἱμάτια ⸀ἑαυτῶν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: pt
  text: E, enquanto ele avançava, estendiam seus mantos[a] pelo caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas roupas” ou “suas vestes exteriores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Enquanto ele seguia
  rationale: A construção absoluta no genitivo, com particípio presente, indica uma ação simultânea. “Enquanto ele seguia” expressa naturalmente essa relação temporal; o conectivo δέ é absorvido pelo fluxo da frase, sem sugerir um contraste inexistente.
- source_word: ὑπεστρώννυον
  choice: estendiam
  rationale: O imperfeito apresenta a ação em andamento ou repetida ao longo do percurso. “Estendiam” preserva esse aspecto narrativo de modo claro e natural.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: seus mantos
  rationale: Ἱμάτια pode designar roupas em geral, mas frequentemente se refere às peças exteriores. “Mantos” é concreto, inteligível e apropriado à ação de colocá-los diante de Jesus.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: A expressão indica o local e a extensão do trajeto onde os mantos eram postos. “Pelo caminho” soa natural em português e comunica que eram estendidos no percurso de Jesus.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O sujeito plural permanece implícito, como no grego, e o imperfeito conserva a ação em desenvolvimento.
