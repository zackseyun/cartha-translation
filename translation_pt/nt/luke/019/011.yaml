id: LUK.19.11
reference: Luke 19:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: pt
  text: Enquanto eles ouviam essas coisas, Jesus prosseguiu e contou uma parábola, porque ele estava perto de Jerusalém e porque eles pensavam que o Reino de Deus estava prestes a se manifestar imediatamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava prestes a aparecer imediatamente”. O verbo pode indicar tornar-se visível ou manifesto.'
    reason: Alternativa lexical para ἀναφαίνεσθαι, preservando também a ideia de iminência expressa por μέλλει.
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Enquanto eles ouviam essas coisas
  rationale: O genitivo absoluto com particípio presente indica uma ação em andamento e simultânea ao que vem a seguir.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: Jesus prosseguiu e contou uma parábola
  rationale: A construção exprime continuação ou acréscimo no discurso. O nome explícito torna a referência natural em português, e “contou uma parábola” corresponde idiomaticamente ao gênero introduzido.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: porque estava perto de Jerusalém
  rationale: διά com infinitivo articular tem sentido causal; αὐτόν é o sujeito acusativo do infinitivo e se refere a Jesus.
- source_word: δοκεῖν αὐτοὺς
  choice: eles pensavam
  rationale: Expressa a opinião ou expectativa deles sem sugerir certeza.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: O advérbio ressalta que esperavam a manifestação sem demora.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: estava prestes a se manifestar
  rationale: μέλλω com infinitivo indica iminência, enquanto ἀναφαίνεσθαι comunica tornar-se visível ou manifesto.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão consagrada, clara e coerente com o uso teológico e narrativo de Lucas.
theological_decisions:
- issue: Natureza da manifestação esperada do Reino
  choice: “o Reino de Deus estava prestes a se manifestar imediatamente”
  alternative: “o Reino de Deus estava prestes a aparecer imediatamente”
  rationale: O versículo relata a expectativa de uma manifestação iminente, mas não especifica se seria política, apocalíptica ou espiritual; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Reino” recebe inicial maiúscula por convenção editorial, sem acrescentar interpretação ao texto.
