  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: pt
  text: 'Quando Jesus chegou àquele lugar, olhou para cima e lhe disse: “Zaqueu, desça depressa, pois hoje tenho de ficar em sua casa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “tenho de” indica necessidade e, em Lucas, pode apontar para a missão de Jesus ou para o propósito divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: quando
  rationale: Introduz uma oração temporal na sequência narrativa; “quando” é natural e preciso em português.
- source_word: ἐπὶ τὸν τόπον
  choice: àquele lugar
  rationale: Expressa o ponto específico onde Zaqueu estava; o demonstrativo torna a referência contextual natural sem acrescentar conteúdo.
- source_word: ἀναβλέψας
  choice: olhou para cima
  rationale: Indica que Jesus dirigiu o olhar para o alto, onde Zaqueu estava na árvore.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lhe disse
  rationale: Forma idiomática e clara de reproduzir a fórmula de fala grega.
- source_word: Ζακχαῖε
  choice: Zaqueu
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: σπεύσας κατάβηθι
  choice: desça depressa
  rationale: Reproduz de modo natural a urgência comunicada pelo particípio σπεύσας junto ao imperativo κατάβηθι.
- source_word: σήμερον γὰρ
  choice: pois hoje
  rationale: “Pois” conserva a função explicativa ou causal de γάρ e mantém a fluidez da fala.
- source_word: ἐν τῷ οἴκῳ σου
  choice: em sua casa
  rationale: οἶκος designa aqui a residência ou o lar de Zaqueu; “casa” é a opção corrente e suficientemente ampla em português.
- source_word: δεῖ με
  choice: tenho de
  rationale: Preserva a ideia forte de necessidade sem explicitar no texto principal se ela decorre diretamente de missão ou propósito divino.
- source_word: μεῖναι
  choice: ficar
  rationale: No contexto, indica permanecer na casa de Zaqueu; “ficar” é natural e não limita indevidamente a duração ou a natureza da visita.
theological_decisions:
- issue: Força de δεῖ na teologia narrativa de Lucas
  choice: tenho de ficar
  alternative: preciso ficar; é necessário que eu fique
  rationale: A formulação preserva a necessidade enfática que, em Lucas, pode estar ligada à missão de Jesus e ao propósito divino, sem transformar essa possível conotação em explicação explícita no texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem da frase foi ajustada ao uso natural do português, preservando a urgência da ordem e a força de necessidade de δεῖ.
