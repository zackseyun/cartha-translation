  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: pt
  text: 'Então ele disse: “Certo homem de família nobre foi para um país distante, a fim de receber para si um reino[a] e voltar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realeza” ou “poder real”. O grego βασιλεία pode referir-se ao próprio reino ou ao governo e à autoridade de um rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica. “Então” é natural em português e preserva a força sequencial/inferencial sem tornar a frase rígida.
- source_word: Ἄνθρωπός τις
  choice: Certo homem
  rationale: Introduz uma personagem indefinida no contexto da parábola. “Certo homem” preserva essa função e se liga naturalmente à caracterização seguinte.
- source_word: εὐγενὴς
  choice: de família nobre
  rationale: Indica origem ou posição social elevada. A expressão atual evita a possível ambiguidade de “nobre” como qualidade moral.
- source_word: ἐπορεύθη
  choice: foi
  rationale: Expressa de maneira simples e natural o deslocamento indicado pelo verbo grego.
- source_word: εἰς χώραν μακρὰν
  choice: para um país distante
  rationale: Preserva a ideia geográfica de uma região longínqua em linguagem portuguesa clara e corrente.
- source_word: λαβεῖν
  choice: receber
  rationale: No contexto político, indica obter legitimamente um reino ou autoridade régia, não necessariamente tomá-los pela força.
- source_word: ἑαυτῷ
  choice: para si
  rationale: Reproduz o dativo reflexivo, indicando que ele receberia o reino em benefício ou posse própria.
- source_word: βασιλείαν
  choice: um reino
  rationale: Mantém a formulação concreta e tradicional, ao mesmo tempo que a nota registra que o termo também pode designar realeza ou poder real.
- source_word: ὑποστρέψαι
  choice: voltar
  rationale: Infinitivo coordenado com “receber”; “voltar” é conciso, natural e não acrescenta um conector temporal ausente do grego.
theological_decisions:
- issue: Nuance de βασιλείαν na imagem política da parábola
  choice: um reino
  alternative: realeza; poder real
  rationale: O termo pode indicar tanto um reino quanto a condição ou autoridade régia. O texto principal conserva a expressão concreta, enquanto a nota mantém aberta a nuance politicamente relevante sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De família nobre” comunica posição de nascimento sem sugerir primariamente virtude moral; a sintaxe final preserva a coordenação dos dois infinitivos gregos.
