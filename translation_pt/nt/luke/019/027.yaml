id: LUK.19.27
reference: Luke 19:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: pt
  text: Mas, quanto a estes meus inimigos, que não quiseram que eu reinasse sobre eles, tragam-nos aqui e massacrem-nos diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mas, quanto a
  rationale: Marca uma transição adversativa e introduz com ênfase o último grupo mencionado; a expressão é natural em português e preserva tanto o contraste quanto a topicalização.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: estes meus inimigos
  rationale: Preserva o substantivo pessoal ἐχθρούς, o possessivo e a ênfase específica do demonstrativo τούτους.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: que não quiseram que eu reinasse sobre eles
  rationale: Converte naturalmente o particípio atributivo em oração relativa; 'não quiseram' expressa θέλω, e 'reinasse sobre eles' mantém o sentido verbal e régio de βασιλεύω.
- source_word: ἀγάγετε ὧδε
  choice: tragam-nos aqui
  rationale: '''Trazer'' comunica de modo idiomático o movimento ordenado em direção ao falante, enquanto ''aqui'' preserva ὧδε.'
- source_word: κατασφάξατε
  choice: massacrem-nos
  rationale: O verbo é mais forte e gráfico que um simples 'matar'. 'Massacrar' preserva a violência intensificada sem acrescentar um método específico de execução.
- source_word: ἔμπροσθέν μου
  choice: diante de mim
  rationale: Expressão corrente e dignificada que conserva a ideia espacial e pessoal de a ação ocorrer perante o falante.
theological_decisions:
- issue: Referência ao falante dentro da parábola
  choice: Apresentar diretamente a ordem do homem de origem nobre, sem atenuar sua violência nem acrescentar uma identificação explícita com uma ordem direta de Jesus fora da parábola.
  alternative: Acrescentar linguagem que distancie explicitamente a fala como mera imagem parabólica.
  rationale: O grego registra a fala da personagem dentro da parábola. A tradução deve manter sua força narrativa e sua tensão teológica sem inserir conclusões interpretativas que o versículo não declara.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. Mantiveram-se os pronomes enclíticos formais ('tragam-nos', 'massacrem-nos') por adequação ao registro bíblico público, sem arcaísmo lexical.
