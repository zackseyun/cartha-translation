  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: pt
  text: 'Então veio o segundo, dizendo: “A sua mina, senhor, rendeu cinco minas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: o segundo
  rationale: Reproduz diretamente a sequência dos servos na parábola.
- source_word: Ἡ μνᾶ σου
  choice: A sua mina
  rationale: Mantém a unidade monetária antiga e a relação possessiva do original.
- source_word: κύριε
  choice: senhor
  rationale: É a forma natural de tratamento dirigida ao homem nobre da parábola; a minúscula evita identificar o personagem de modo editorial e explícito com o título divino.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: rendeu cinco minas
  rationale: Em contexto financeiro, 'rendeu' comunica naturalmente que a quantia produziu retorno, sem alterar o sentido do verbo.
theological_decisions:
- issue: Referência de κύριε
  choice: senhor
  alternative: Senhor
  rationale: O vocativo dirige-se ao governante da narrativa. A tradução preserva a função de tratamento sem impor, pela capitalização, uma identificação cristológica que o grego não marca graficamente.
translation_notes:
  register: Português moderno, claro e digno, com pontuação narrativa natural. Conserva 'mina' como termo histórico e evita explicação desnecessária neste versículo.
