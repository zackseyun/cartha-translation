  text: εἶπεν δὲ καὶ τούτῳ· Καὶ σὺ ⸂ἐπάνω γίνου⸃ πέντε πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: pt
  text: 'E disse também a este: “E você, fique responsável por cinco cidades.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: E disse
  rationale: O aoristo εἶπεν introduz a fala na narrativa, enquanto δέ funciona aqui como conectivo leve; “E disse” mantém o fluxo sem criar contraste indevido.
- source_word: καὶ τούτῳ
  choice: também a este
  rationale: Preserva tanto o valor demonstrativo de τούτῳ quanto o sentido aditivo de καί, retomando o padrão distributivo do servo anterior.
- source_word: Καὶ σὺ
  choice: E você
  rationale: Mantém a ênfase do pronome expresso e o paralelismo direto da fala grega em linguagem corrente.
- source_word: ἐπάνω γίνου
  choice: fique responsável por
  rationale: O imperativo presente γίνου com ἐπάνω comunica a atribuição de uma posição de autoridade. “Fique responsável por” soa natural em português e conserva a ideia funcional sem explicitar mais do que o grego.
- source_word: πέντε πόλεων
  choice: cinco cidades
  rationale: πόλις significa normalmente “cidade”, e o genitivo indica o âmbito da responsabilidade ou autoridade.
