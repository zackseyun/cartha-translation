  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: pt
  text: 'E ele disse aos que estavam ali: “Tirem dele a mina[a] e deem-na àquele que tem as dez minas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais tradicional, “libra”. O termo grego designa uma antiga unidade monetária, a mina.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: aos que estavam ali
  rationale: O particípio perfeito substantivado refere-se às pessoas presentes nas proximidades. A expressão mantém a cena concreta e soa natural em português.
- source_word: Ἄρατε
  choice: Tirem
  rationale: Neste contexto, o imperativo aoristo plural de αἴρω significa retirar ou tomar de alguém; “tirem” expressa claramente a separação indicada por ἀπό.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: ἀπό com o genitivo indica separação; “dele” é a formulação direta e idiomática em português.
- source_word: τὴν μνᾶν
  choice: a mina
  rationale: μνᾶ designa uma antiga unidade monetária. A transliteração “mina” preserva o contexto histórico sem sugerir equivalência exata com uma moeda moderna.
- source_word: δότε
  choice: deem-na
  rationale: O imperativo aoristo plural de δίδωμι ordena uma transferência simples. O pronome retoma “a mina” sem repetição desnecessária.
- source_word: τῷ ... ἔχοντι
  choice: àquele que tem
  rationale: O particípio articular no dativo singular funciona como substantivo; “àquele que tem” não acrescenta uma identificação não expressa no grego.
- source_word: τὰς δέκα μνᾶς
  choice: as dez minas
  rationale: O artigo grego identifica a quantia já mencionada no contexto, adequadamente representada por “as”.
theological_decisions:
- issue: Tradução de μνᾶ como unidade monetária
  choice: mina
  alternative: libra
  rationale: “Mina” representa diretamente a antiga unidade monetária grega e evita a impressão de uma moeda moderna ou de uma equivalência exata. Trata-se de uma decisão de tradição tradutória, não de uma resolução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se os imperativos no plural porque o senhor se dirige às pessoas que estavam ali.
