source:
  edition: SBLGNT
  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: pt
  text: E não conseguiam descobrir o que poderiam fazer[a], pois todo o povo o ouvia com atenção intensa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não encontravam o que fazer”.'
    reason: Alternativa mais literal para οὐχ εὕρισκον τὸ τί ποιήσωσιν; a tradução no texto explicita a incapacidade contínua e preserva a nuance deliberativa.
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: não conseguiam descobrir
  rationale: O imperfeito com negação indica uma dificuldade contínua em encontrar uma forma de agir; a formulação preserva tanto o aspecto durativo quanto a incapacidade prática.
- source_word: τὸ τί ποιήσωσιν
  choice: o que poderiam fazer
  rationale: 'Mantém a nuance deliberativa do subjuntivo aoristo: procuravam determinar que ação lhes seria possível tomar.'
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: pois todo o povo
  rationale: “Pois” expressa a razão introduzida por γάρ, enquanto “todo o povo” conserva a abrangência enfática de ἅπας.
- source_word: ἐξεκρέματο αὐτοῦ
  choice: o ouvia com atenção intensa
  rationale: O verbo idiomático descreve atenção absorvente dirigida a Jesus. Em português, esta formulação comunica naturalmente o sentido sem introduzir explicitamente “palavras”, ausente do grego.
- source_word: ἀκούων
  choice: ouvia
  rationale: O particípio presente especifica como o povo permanecia intensamente atento. O singular concorda naturalmente com o coletivo “povo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A expressão grega literalmente próxima de “estava pendurado nele, ouvindo” foi vertida pelo sentido idiomático de atenção intensa, sem acrescentar “suas palavras” ao texto.
