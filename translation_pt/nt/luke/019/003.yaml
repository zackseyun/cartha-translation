source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: pt
  text: E procurava ver quem era Jesus, mas não conseguia por causa da multidão, pois era de baixa estatura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «era baixo». A expressão grega refere-se literalmente a ser pequeno quanto à estatura; neste contexto, diz respeito à altura física, não à idade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: procurava
  rationale: O imperfeito indica uma tentativa contínua; «procurava ver» expressa naturalmente o esforço em curso.
- source_word: ἰδεῖν
  choice: ver
  rationale: O infinitivo indica o objetivo do esforço de Zaqueu, e «ver» é a tradução direta e natural.
- source_word: τίς ἐστιν
  choice: quem era Jesus
  rationale: Preserva a formulação grega e sua possível referência tanto à identidade quanto à pessoa de Jesus, sem explicá-la em excesso.
- source_word: οὐκ ἠδύνατο
  choice: não conseguia
  rationale: Forma idiomática em português que, no contexto, comunica sua incapacidade de alcançar o objetivo.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: por causa da multidão
  rationale: Aqui ἀπό assinala a causa impeditiva; a expressão é clara e corrente em português.
- source_word: ὅτι
  choice: pois
  rationale: Introduz de modo natural a razão pela qual a multidão o impedia de ver.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: era de baixa estatura
  rationale: Embora ἡλικία possa se relacionar à idade ou à estatura, o impedimento causado pela multidão indica altura física; «de baixa estatura» é preciso e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura mantém o esforço contínuo indicado pelo imperfeito e evita confundir baixa estatura com pouca idade.
