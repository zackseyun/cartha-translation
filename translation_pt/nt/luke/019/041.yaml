  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: pt
  text: E, quando se aproximou, ao ver a cidade, chorou por ela,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: quando se aproximou
  rationale: O verbo ἐγγίζω indica aproximar-se ou chegar perto. A construção temporal com ὡς é expressa naturalmente por “quando”, sem explicitar um objeto que o grego deixa implícito.
- source_word: ἰδὼν
  choice: ao ver
  rationale: O particípio aoristo liga diretamente a visão da cidade ao choro de Jesus. “Ao ver” preserva essa relação temporal e causal sem torná-la mais específica do que o texto.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: πόλις significa “cidade”. Jerusalém já é identificável pelo contexto, por isso não se acrescenta seu nome ao texto.
- source_word: ἔκλαυσεν
  choice: chorou
  rationale: κλαίω denota chorar ou derramar lágrimas, por vezes com manifestação audível. “Chorou” comunica o peso emocional com naturalidade e sem acrescentar intensidade.
- source_word: ἐπ’ αὐτήν
  choice: por ela
  rationale: Com κλαίω, ἐπί com acusativo indica aquele ou aquilo que é objeto do lamento. Em português, “chorou por ela” é natural, e o pronome feminino concorda com “cidade”.
theological_decisions:
- issue: Possível personificação de Jerusalém no pronome feminino
  choice: por ela
  alternative: sobre ela
  rationale: Em português, o feminino de “ela” decorre naturalmente do gênero gramatical de “cidade” e pode também acomodar a personificação de Jerusalém, sem impô-la. “Por ela” expressa de modo idiomático o objeto do lamento; “sobre ela” seria mais formal e menos natural neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem mantém o movimento conciso do grego, e a vírgula final preserva a continuidade sintática com o versículo seguinte.
