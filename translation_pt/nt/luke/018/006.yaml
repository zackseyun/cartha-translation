  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: pt
  text: 'E o Senhor disse: “Ouçam o que diz o juiz injusto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: O aoristo de λέγω funciona como introdução narrativa simples de fala; “disse” é a forma natural em português.
- source_word: δὲ
  choice: E
  rationale: δέ dá continuidade à narrativa sem necessariamente marcar uma sequência temporal; “E” conserva essa ligação.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Em Lucas, o título se refere a Jesus e preserva peso cristológico; “o Senhor” é a equivalência consagrada e adequada.
- source_word: Ἀκούσατε
  choice: Ouçam
  rationale: O imperativo aoristo plural pede atenção ao conteúdo da fala. “Ouçam” é direto, natural e preserva o número plural.
- source_word: τί
  choice: o que
  rationale: Introduz o conteúdo daquilo que o juiz diz, não a maneira como fala.
- source_word: ὁ κριτὴς
  choice: o juiz
  rationale: Equivalência direta; o artigo retoma o juiz já apresentado na parábola.
- source_word: τῆς ἀδικίας
  choice: injusto
  rationale: O genitivo qualitativo, literalmente “da injustiça”, caracteriza o juiz. Em português, “juiz injusto” é idiomático e preserva claramente a avaliação moral e judicial.
- source_word: λέγει
  choice: diz
  rationale: O presente grego confere vivacidade; “diz” mantém essa forma presente de modo natural.
theological_decisions:
- issue: Tradução de κύριος em referência a Jesus
  choice: o Senhor
  alternative: o mestre
  rationale: “O Senhor” preserva o valor titular e cristológico que κύριος possui na narrativa de Lucas, sem acrescentar conteúdo doutrinário ao texto.
- issue: Valor de τῆς ἀδικίας
  choice: juiz injusto
  alternative: juiz da injustiça
  rationale: A expressão é um genitivo qualitativo que descreve o caráter do juiz. A forma idiomática portuguesa “juiz injusto” comunica o sentido sem resolver além do texto se a injustiça é principalmente moral ou judicial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O imperativo plural “Ouçam” corresponde ao grego e se dirige aos ouvintes de Jesus.
