  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: pt
  text: 'Havia naquela cidade uma viúva que ia repetidamente até ele e dizia: “Faça-me justiça contra o meu adversário.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Defenda a minha causa contra o meu adversário” ou “Conceda-me justiça contra o meu oponente”. O verbo grego pode indicar a obtenção de justiça ou de uma decisão favorável, não necessariamente vingança pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: viúva
  rationale: Equivalente português padrão e preciso, preservando a relevância social da personagem no contexto da parábola.
- source_word: δὲ
  choice: também
  rationale: Marca a continuação narrativa e liga a viúva ao juiz já apresentado, sem impor um contraste forte.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: Havia naquela cidade
  rationale: A construção existencial com εἰμί é expressa naturalmente em português por “havia”, mantendo de perto a localização indicada pelo grego.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: sempre ia até ele
  rationale: O imperfeito, no contexto, sugere ação reiterada; “sempre ia” comunica de modo natural a persistência da viúva.
- source_word: λέγουσα
  choice: e dizia
  rationale: Expressa a fala que acompanhava as visitas repetidas, com coordenação idiomática em português.
- source_word: Ἐκδίκησόν με
  choice: Faça-me justiça
  rationale: No cenário judicial, ἐκδικέω indica obter justiça ou reparação, não necessariamente vingança pessoal.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: contra o meu adversário
  rationale: ἀντίδικος designa a parte contrária numa disputa, e “adversário” preserva tanto o sentido jurídico quanto a formulação mais ampla do termo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Faça-me justiça” mantém o contexto jurídico sem sugerir retaliação; “adversário” conserva a amplitude do termo grego.
