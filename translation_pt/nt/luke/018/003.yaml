  naturalness: “Havia naquela cidade uma viúva que ia repetidamente até ele e dizia” é natural, claro e adequado ao português moderno de ampla compreensão. “Faça-me justiça contra o meu adversário” mantém um registro jurídico acessível.
  terminology: “Viúva”, “justiça” e “adversário” são escolhas precisas. A nota deve manter a direção jurídica de ἀπό e evitar “diante de”, que não corresponde bem à construção grega neste contexto.
