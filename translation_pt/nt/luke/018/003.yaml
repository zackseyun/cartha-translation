  to: 'Havia naquela cidade uma viúva que ia repetidamente até ele e dizia: “Faça-me justiça contra o meu adversário.”[a]'
  rationale: A revisão substitui a formulação potencialmente absoluta “sempre ia” por “ia repetidamente”, que reflete de modo mais controlado o imperfeito no contexto da parábola. Também ajusta a alternativa da nota para conservar a relação expressa pelo grego. A omissão de “também” evita atribuir peso semântico indevido à partícula δέ, cuja função aqui é sobretudo narrativa.
