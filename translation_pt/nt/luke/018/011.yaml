source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: pt
  text: 'O fariseu, de pé e à parte, orava estas palavras[a]: “Ó Deus, eu te agradeço porque não sou como as demais pessoas — extorsores, injustos, adúlteros — nem mesmo como este cobrador de impostos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O fariseu, de pé, orava para si mesmo estas palavras”. A expressão grega pode indicar que ele estava à parte ou, em sentido irônico, que sua oração era dirigida a si mesmo.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: em pé
  rationale: Expressa naturalmente a postura indicada pelo particípio aoristo de ἵστημι, sem tornar a frase excessivamente formal.
- source_word: πρὸς ἑαυτὸν
  choice: à parte
  rationale: Mantém no texto principal o possível sentido espacial de estar separado dos demais; o possível sentido reflexivo, “consigo mesmo”, é preservado em nota.
- source_word: ταῦτα
  choice: esta oração
  rationale: No contexto, o demonstrativo introduz o conteúdo da oração seguinte. A formulação é natural em português, embora menos literal que “estas coisas”.
- source_word: προσηύχετο
  choice: fazia esta oração
  rationale: O imperfeito indica ação em curso; “fazia esta oração” conserva adequadamente o valor progressivo no contexto narrativo.
- source_word: εὐχαριστῶ σοι
  choice: eu te agradeço
  rationale: Equivalente moderno e idiomático de εὐχαριστέω com pronome no dativo.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: como as outras pessoas
  rationale: Comunica o sentido genérico de ἄνθρωποι em português atual e evita a possível leitura exclusivamente masculina de “homens”.
- source_word: ἅρπαγες
  choice: ladrões
  rationale: O termo designa pessoas que tomam avidamente o que pertence a outros, podendo incluir roubo e exploração. “Ladrões” é claro e corrente; “exploradores” seria outra possibilidade contextual.
- source_word: ἄδικοι
  choice: injustos
  rationale: Preserva de modo direto o sentido moral amplo de ἄδικος e soa natural numa lista de vícios em português.
- source_word: μοιχοί
  choice: adúlteros
  rationale: Tradução direta e corrente do substantivo plural.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: nem mesmo como este cobrador de impostos
  rationale: “Nem mesmo” transmite a intensificação depreciativa de ἢ καί, e “cobrador de impostos” é uma tradução clara de τελώνης.
theological_decisions:
- issue: Sentido de πρὸς ἑαυτόν na oração do fariseu
  choice: Sentido espacial, “à parte”, no texto principal
  alternative: Sentido reflexivo, “consigo mesmo” ou “para si mesmo”
  rationale: A expressão grega admite tanto uma referência à posição isolada do fariseu quanto a sugestão irônica de que a oração se dirigia a ele próprio. A nota conserva essa ambiguidade sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala preserva o tom de superioridade do fariseu sem acrescentar juízos que não estejam explicitamente no texto.
