  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: pt
  text: 'E lhe disseram: “Jesus, o Nazareno[a], está passando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus de Nazaré está passando.” O grego diz literalmente “Jesus, o Nazareno”.'
    reason: alternativa lexical para a designação ὁ Ναζωραῖος
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: disseram
  rationale: O verbo pode significar informar, relatar ou comunicar. Neste contexto narrativo, “disseram” expressa naturalmente a comunicação dirigida ao homem, sem acrescentar solenidade.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ é um conectivo leve que faz a narrativa avançar; “E” preserva o fluxo sem criar um contraste indevido.
- source_word: αὐτῷ
  choice: a ele
  rationale: Representa explicitamente o objeto indireto dativo. Embora “lhe disseram” também seja possível, “disseram a ele” tem ampla clareza no português contemporâneo.
- source_word: ὅτι
  choice: dois-pontos e discurso direto
  rationale: ὅτι introduz o conteúdo comunicado. O discurso direto é natural em português e preserva integralmente a informação do grego.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e padrão do nome em português.
- source_word: ὁ Ναζωραῖος
  choice: o Nazareno
  rationale: O grego emprega uma designação substantivada. “O Nazareno” preserva essa forma mais diretamente do que “de Nazaré” e continua claro e corrente em português.
- source_word: παρέρχεται
  choice: está passando
  rationale: O presente descreve uma ação em andamento naquele momento. “Está passando” comunica de modo natural sua atualidade e caráter progressivo.
theological_decisions:
- issue: Tradução da designação Ναζωραῖος aplicada a Jesus
  choice: o Nazareno
  alternative: de Nazaré
  rationale: A expressão funciona principalmente como identificador geográfico ou designativo. A tradução mantém a forma substantivada do grego sem lhe atribuir conteúdo cristológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Jesus, o Nazareno” reproduz com naturalidade a designação grega; a pontuação trata “o Nazareno” como aposto identificador.
