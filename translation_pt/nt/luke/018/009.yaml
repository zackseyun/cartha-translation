  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: pt
  text: Ele também contou esta parábola a alguns que confiavam em si mesmos, por se considerarem justos, e desprezavam os demais:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e tratavam os demais com desprezo”.'
    reason: Alternativa lexical para ἐξουθενοῦντας, que pode significar desprezar ou tratar com desprezo.
lexical_decisions:
- source_word: Εἶπεν
  choice: contou
  rationale: Como o objeto é «esta parábola», «contou» é a formulação idiomática em português e preserva o sentido narrativo de λέγω.
- source_word: δὲ
  choice: (não expresso separadamente)
  rationale: δέ é um conectivo discursivo leve; a progressão narrativa fica natural em português sem uma conjunção explícita.
- source_word: καὶ
  choice: também
  rationale: Preserva o valor aditivo do advérbio, indicando mais um ensinamento parabólico.
- source_word: πρός τινας
  choice: a alguns
  rationale: πρός com pessoas depois de um verbo de fala identifica os destinatários.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: que confiavam em si mesmos
  rationale: Expressa a confiança voltada para si próprios; o imperfeito português apresenta adequadamente o estado contínuo indicado pelo particípio perfeito.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: convencidos de que eram justos
  rationale: «Justos» mantém o vocabulário moral e teológico de δίκαιοι, enquanto «convencidos» torna natural a relação entre a autoconfiança e a avaliação que faziam de si mesmos.
- source_word: ἐξουθενοῦντας
  choice: desprezavam
  rationale: O verbo significa considerar alguém sem valor ou desprezá-lo; «desprezavam» é direto, atual e preserva a força ativa.
- source_word: τοὺς λοιπούς
  choice: todos os outros
  rationale: Neste contraste entre os próprios destinatários e o restante das pessoas, «todos os outros» comunica naturalmente o alcance de τοὺς λοιπούς.
- source_word: τὴν παραβολὴν ταύτην
  choice: esta parábola
  rationale: «Parábola» é o equivalente estabelecido e reconhecível para esse gênero de ensino.
theological_decisions:
- issue: Tradução de δίκαιοι no contexto da justiça própria
  choice: justos
  alternative: corretos / com razão
  rationale: O texto critica a confiança dos ouvintes em sua própria justiça, mas δίκαιοι não é pejorativo. «Justos» conserva o termo teológico e permite que o contexto produza a crítica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção evita linguagem excessivamente técnica; «justos» preserva a terminologia bíblica, e «todos os outros» comunica de modo natural o contraste abrangente.
