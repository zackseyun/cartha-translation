  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: pt
  text: 'Ele respondeu: “Tenho guardado todas essas coisas desde a minha juventude.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ele respondeu
  rationale: No contexto de diálogo, εἶπεν introduz a réplica do homem. “Respondeu” expressa naturalmente essa função, enquanto o δέ, conectivo leve, não precisa ser traduzido separadamente.
- source_word: Ταῦτα πάντα
  choice: todas essas coisas
  rationale: Reproduz diretamente o demonstrativo com πᾶς sem inserir “mandamentos”, termo apenas implícito pelo contexto anterior.
- source_word: ἐφύλαξα
  choice: tenho guardado
  rationale: φυλάσσω, aplicado aos mandamentos, significa guardar ou observar. O pretérito perfeito composto comunica a afirmação de uma prática mantida desde a juventude até o presente.
- source_word: ἐκ νεότητος μου
  choice: desde a minha juventude
  rationale: ἐκ com o genitivo indica o ponto inicial no tempo. “Desde a minha juventude” é idiomático em português e preserva o alcance temporal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluência natural para leitores brasileiros e ampla compreensão internacional. A formulação mantém a referência genérica do grego em “todas essas coisas”, sem explicitar interpretativamente “mandamentos”.
