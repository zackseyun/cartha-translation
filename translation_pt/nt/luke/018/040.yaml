source:
  edition: SBLGNT
  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: pt
  text: Então Jesus parou e ordenou que o levassem até ele.[a] Quando o homem se aproximou, Jesus lhe perguntou:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que o conduzissem até ele”. O verbo grego pode significar levar ou conduzir alguém.
    reason: lexical_alternative
  - marker: b
    text: A frase continua no versículo seguinte com a pergunta de Jesus.
    reason: discourse_clarity
lexical_decisions:
- source_word: σταθεὶς
  choice: parou
  rationale: O particípio aoristo de ἵστημι tem aqui sentido intransitivo e indica que Jesus interrompeu seu movimento; “parou” é natural e claro em português.
- source_word: δὲ
  choice: Então
  rationale: δέ funciona como conectivo narrativo leve; “Então” liga naturalmente a ação ao contexto anterior sem criar contraste forte.
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: κελεύω expressa uma ordem; “ordenou” conserva sua força de autoridade em linguagem moderna.
- source_word: ἀχθῆναι
  choice: que o levassem
  rationale: O infinitivo passivo de ἄγω indica que outras pessoas deveriam conduzir o homem a Jesus. A construção ativa impessoal é mais natural em português e mantém esse sentido.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: πρός com acusativo indica movimento em direção a Jesus; “até ele” comunica a aproximação ao destino com naturalidade.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Quando o homem se aproximou
  rationale: O genitivo absoluto tem valor temporal. “O homem” explicita o referente de αὐτοῦ — o cego mencionado no contexto — e evita a ambiguidade pronominal pouco natural em português.
- source_word: ἐπηρώτησεν αὐτόν
  choice: Jesus lhe perguntou
  rationale: ἐπερωτάω significa aqui “perguntar”. Repetir “Jesus” esclarece o sujeito, enquanto “lhe” representa naturalmente o objeto pessoal em português.
