  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: pt
  text: 'Então Pedro disse: “Olha, nós deixamos o que era nosso[a] e seguimos você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nossas coisas” ou “os nossos bens”. A expressão grega é ampla e não especifica exatamente o que Pedro e os outros deixaram.
    reason: alternativa lexical
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Então Pedro disse
  rationale: δέ assinala a continuação e uma leve transição no relato; “então” mantém esse fluxo sem acentuar demais o contraste. O aoristo de λέγω é naturalmente traduzido por “disse”.
- source_word: Ἰδοὺ
  choice: Olha
  rationale: Funciona como chamado de atenção. “Olha” é atual, direto e preserva melhor sua vivacidade do que uma forma solene ou arcaica.
- source_word: ἡμεῖς
  choice: nós
  rationale: O pronome explícito dá ênfase ao grupo de Pedro. Sua presença em português conserva essa ênfase de modo natural.
- source_word: ἀφέντες τὰ ἴδια
  choice: deixamos o que era nosso
  rationale: A construção grega é ampla e não identifica especificamente bens, casas ou família. A formulação portuguesa conserva essa abertura sem soar incompleta.
- source_word: ἠκολουθήσαμέν σοι
  choice: seguimos você
  rationale: ἀκολουθέω com o dativo é o verbo comum para seguir alguém, inclusive como discípulo. A tradução direta preserva essa dimensão sem explicá-la em excesso.
theological_decisions:
- issue: O alcance daquilo que os discípulos deixaram
  choice: o que era nosso
  alternative: nossas coisas / nossos bens
  rationale: τὰ ἴδια não especifica apenas posses materiais e pode abranger tudo o que lhes pertencia ou fazia parte de sua vida. A tradução mantém deliberadamente essa amplitude.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. “Você” evita a ambiguidade regional de “te” e corresponde claramente ao singular σοι.
