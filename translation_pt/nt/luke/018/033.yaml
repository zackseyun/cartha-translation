source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: pt
  text: E, depois de o açoitarem, eles o matarão; e, no terceiro dia, ele ressuscitará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele será ressuscitado”. O grego aqui diz mais diretamente: “ele ressuscitará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: depois de o açoitarem
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal. “Açoitar” é corrente e claro em português e comunica a violência física sem recorrer ao tom mais arcaico de “flagelar”.
- source_word: ἀποκτενοῦσιν
  choice: eles o matarão
  rationale: O futuro ativo plural tem agentes hostis implícitos no contexto. “Matarão” expressa diretamente o sentido do verbo sem acrescentar a nuance jurídica de “executarão” nem a avaliação moral específica de “assassinarão”.
- source_word: αὐτόν
  choice: o
  rationale: O pronome funciona como objeto direto e retoma Jesus, o Filho do Homem, no contexto.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: no terceiro dia
  rationale: A expressão temporal no dativo corresponde naturalmente a “no terceiro dia”, formulação consagrada e clara em português.
- source_word: ἀναστήσεται
  choice: ele ressuscitará
  rationale: O futuro médio de ἀνίστημι tem aqui sentido intransitivo. “Ressuscitará” é a forma natural em português e mantém o foco da construção grega sem explicitar um agente externo.
theological_decisions:
- issue: Formulação da ressurreição
  choice: ele ressuscitará
  alternative: ele será ressuscitado
  rationale: 'A forma grega é futuro médio e, neste contexto, é mais diretamente entendida de modo intransitivo: “ressuscitará”. A alternativa passiva é teologicamente atestada em outros textos, mas explicitaria aqui algo que esta forma verbal não declara diretamente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação do grego foi preservada, enquanto a ordem verbal foi ajustada à sintaxe natural do português.
