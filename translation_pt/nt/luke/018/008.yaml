id: LUK.18.8
reference: Luke 18:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: pt
  text: Eu lhes digo que ele lhes fará justiça sem demora.[a] Contudo, quando o Filho do Homem vier, será que encontrará fé na terra?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «rapidamente». A expressão grega pode indicar que ele agirá com rapidez ou sem demora; a frase anterior também pode ser traduzida por «ele os vindicará».
    reason: lexical_alternative
  - marker: b
    text: Ou «fidelidade» ou «confiança». A palavra grega pode designar fé, confiança ou fidelidade; o texto principal mantém a tradução mais abrangente, «fé».
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: ele lhes fará justiça
  rationale: No contexto judicial da viúva persistente, a expressão comunica que Deus concederá justiça aos seus escolhidos. Evita dar destaque indevido à ideia de vingança, sem excluir a noção de vindicação presente em ἐκδίκησις.
- source_word: ἐν τάχει
  choice: sem demora
  rationale: A expressão indica rapidez ou prontidão. «Sem demora» preserva a força temporal sem transformar a frase necessariamente numa previsão de que o acontecimento ocorrerá em breve.
- source_word: πλὴν
  choice: Contudo
  rationale: Marca com naturalidade a forte transição concessiva entre a garantia da justiça divina e a pergunta penetrante que se segue.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva o título consagrado, sua função como autodesignação de Jesus e sua ressonância com Daniel 7.
- source_word: ἐλθὼν
  choice: quando ... vier
  rationale: O particípio aoristo tem aqui sentido temporal e é expresso naturalmente em português por uma oração introduzida por «quando».
- source_word: ἆρα
  choice: será que
  rationale: A construção portuguesa «será que» transmite o caráter reflexivo e perscrutador da pergunta, sem forçar uma resposta explícita.
- source_word: τὴν πίστιν
  choice: fé
  rationale: «Fé» conserva a amplitude semântica de πίστις. O artigo grego pode apontar para a fé perseverante evocada pelo contexto, mas a tradução evita explicitar essa interpretação no texto principal.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: É a formulação portuguesa natural para o sentido amplo e provavelmente universal de γῆ nesta declaração escatológica.
theological_decisions:
- issue: Sentido de πίστις no contexto da oração perseverante
  choice: fé
  alternative: fidelidade ou confiança
  rationale: O texto principal mantém o termo amplo «fé», enquanto a nota registra sentidos possíveis que não devem ser eliminados. Assim, não se decide dogmaticamente se a ênfase recai na confiança, na perseverança fiel ou na fé em sentido mais geral.
- issue: Força temporal de ἐν τάχει
  choice: sem demora
  alternative: rapidamente ou em breve
  rationale: «Sem demora» ressalta a prontidão da ação de Deus sem resolver a tensão entre justiça rápida e a aparente demora pressuposta pela parábola.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eu lhes digo» e «ele lhes fará justiça» usam a colocação pronominal corrente no português brasileiro sem perder formalidade. «Será que» reproduz de modo natural a força interrogativa de ἆρα. Todas as notas estão marcadas no texto principal.
