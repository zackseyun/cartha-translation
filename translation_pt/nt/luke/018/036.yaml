base_translation:
  language: en
  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: pt
  text: Ao ouvir uma multidão passando, ele perguntava o que era aquilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que poderia ser aquilo”. O imperfeito pode sugerir que ele perguntava repetidamente, e o optativo na pergunta indireta pode transmitir um tom um pouco mais incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Ao ouvir
  rationale: O particípio aoristo tem valor circunstancial, aqui expresso naturalmente em português com sentido temporal, sem exigir que a ação seja apresentada como plenamente anterior.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula funciona como conexão narrativa leve; em português, a continuidade é natural sem acrescentar um conectivo que poderia pesar a frase.
- source_word: ὄχλου
  choice: uma multidão
  rationale: O substantivo anartro designa o grupo cujo movimento ele ouviu; o artigo indefinido é natural em português.
- source_word: διαπορευομένου
  choice: passando
  rationale: O particípio presente retrata movimento em curso. “Passando” é idiomático e preserva a relação com aquilo que ele ouviu.
- source_word: ἐπυνθάνετο
  choice: ele perguntava
  rationale: O imperfeito indica ação em curso e pode também sugerir perguntas repetidas; “perguntava” preserva essa abertura melhor que uma formulação pontual.
- source_word: τί εἴη τοῦτο
  choice: o que era aquilo
  rationale: A pergunta indireta após um verbo no passado é expressa naturalmente assim em português. “Aquilo” aponta para o acontecimento percebido sem interpretar τοῦτο como “significava”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção preserva o aspecto contínuo do imperfeito e evita interpretar a pergunta como sendo especificamente sobre o significado do acontecimento.
