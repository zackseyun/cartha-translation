  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: pt
  text: 'Ao ouvir isso, Jesus lhe disse: “Uma coisa ainda lhe falta:[a] venda tudo o que você tem e distribua aos pobres, e você terá um tesouro no céu;[b] venha e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você ainda carece de uma coisa”. Mais literalmente, o grego diz: “Uma coisa ainda lhe falta”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos céus”. O grego emprega o plural, enquanto em português é comum usar o singular “céu” neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Ao ouvir isso, Jesus
  rationale: A construção participial aorista é expressa naturalmente como oração temporal. “Isso” retoma a declaração anterior, sem acrescentar conteúdo ao texto.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Uma coisa ainda lhe falta
  rationale: Preserva “uma coisa” como sujeito de λείπει e mantém a ênfase na única deficiência restante, em português natural.
- source_word: πάντα ὅσα ἔχεις πώλησον
  choice: venda tudo o que você tem
  rationale: Comunica a abrangência de πάντα ὅσα e a força direta do imperativo aoristo, sem formulação artificial.
- source_word: διάδος πτωχοῖς
  choice: distribua aos pobres
  rationale: “Distribua” preserva a nuance de repartir ou distribuir de διαδίδωμι; o objeto é recuperado naturalmente da ordem anterior.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: você terá um tesouro no céu
  rationale: “Tesouro” corresponde diretamente a θησαυρός. O singular “céu” é idiomático em português, embora o grego empregue o plural.
- source_word: καὶ δεῦρο ἀκολούθει μοι
  choice: Depois, venha e siga-me
  rationale: δεῦρο funciona como convite imperativo de aproximação, e ἀκολούθει como chamado contínuo ao discipulado. “Siga-me” expressa essa força naturalmente em português; “depois” torna clara a sequência sem enfraquecer o chamado.
theological_decisions:
- issue: Alcance da renúncia e do chamado ao discipulado
  choice: Manter as ordens como exigências concretas dirigidas a esse homem, culminando no chamado para seguir Jesus.
  alternative: Interpretar a ordem como regra universal explícita de alienação total de bens, ou reduzi-la a um gesto meramente simbólico.
  rationale: O versículo apresenta uma exigência econômica real ao interlocutor, mas não declara por si só como ela deve ser aplicada universalmente. A tradução conserva a tensão sem impor uma conclusão doutrinária.
- issue: Tesouro no céu
  choice: 'Conservar a afirmação futura simples: “você terá um tesouro no céu”.'
  alternative: Explicar o tesouro como uma recompensa espiritual específica ou como mérito salvífico.
  rationale: O texto não define aqui a natureza exata do tesouro nem formula uma teoria de mérito; a tradução mantém essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por clareza contemporânea, “lhe” como complemento idiomático e imperativos diretos. A pontuação separa as ordens e a promessa sem alterar sua progressão.
