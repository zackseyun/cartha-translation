id: LUK.18.17
reference: Luke 18:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: pt
  text: 'Em verdade lhes digo: quem não receber o Reino de Deus como uma criança[a] certamente não entrará nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na condição de criança”. A expressão pode destacar receptividade, confiança, humildade ou dependência próprias de uma criança; o grego não especifica a qualidade exata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Na fórmula introdutória solene de Jesus, «Em verdade» transmite a afirmação enfática de modo claro e digno em português, sem recorrer à transliteração «Amém».
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma natural de discurso direto em português, preservando o plural de ὑμῖν.
- source_word: ὃς ἂν
  choice: quem
  rationale: Exprime de maneira concisa e idiomática a condição geral e indefinida do grego.
- source_word: μὴ δέξηται
  choice: não receber
  rationale: «Receber» preserva a ideia de acolhimento ou aceitação sem determinar além do texto como o Reino é recebido.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Tradução tradicional, transparente e amplamente compreensível; mantém aberta a amplitude semântica entre reino e governo régio.
- source_word: ὡς παιδίον
  choice: como uma criança
  rationale: Preserva a comparação sem especificar se o aspecto em vista é receptividade, confiança, humildade ou dependência.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: certamente não entrará
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática; «certamente não» conserva essa força em português atual.
- source_word: εἰς αὐτήν
  choice: nele
  rationale: O pronome retoma «Reino», masculino em português; «entrará nele» comunica naturalmente o movimento indicado por εἰς.
theological_decisions:
- issue: Sentido de receber o Reino «como uma criança»
  choice: Manter a comparação sem definir a qualidade específica da criança.
  alternative: Explicitar «com humildade de criança», «com confiança de criança» ou entender «na condição de criança».
  rationale: O grego não identifica expressamente qual aspecto da criança está em foco. A tradução preserva a ambiguidade legítima e evita impor uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega «lhes digo» e futuro simples natural; mantém a fórmula solene «Em verdade» e a imagem não explicada da criança.
