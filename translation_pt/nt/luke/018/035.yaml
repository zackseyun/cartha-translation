  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: pt
  text: Quando ele se aproximava de Jericó, um cego estava sentado à beira do caminho, pedindo esmolas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: não expresso separadamente
  rationale: A fórmula funciona aqui como transição narrativa. Em português, a oração temporal já introduz a cena com naturalidade, sem a necessidade de acrescentar «aconteceu» ou um marcador temporal inexistente no grego.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Quando ele se aproximava de Jericó
  rationale: A construção com infinitivo articular indica simultaneidade, e o presente imperfeito português preserva o aspecto progressivo da aproximação. «De Jericó» é a regência idiomática de «aproximar-se» e mantém o movimento em direção à cidade.
- source_word: τυφλός τις
  choice: um cego
  rationale: O indefinido «um» traduz naturalmente τις no contexto. «Certo cego» preservaria uma leve força individualizadora, mas soaria menos natural e poderia sugerir que o homem já era conhecido do leitor.
- source_word: ἐκάθητο
  choice: estava sentado
  rationale: A forma imperfeita apresenta uma situação em andamento e estabelece o cenário; «estava sentado» reproduz esse valor aspectual.
- source_word: παρὰ τὴν ὁδὸν
  choice: à beira do caminho
  rationale: A expressão comunica posição ao lado da via. «À beira do caminho» é natural, clara e preserva a imagem espacial.
- source_word: ἐπαιτῶν
  choice: pedindo esmolas
  rationale: O particípio descreve a atividade contínua do homem. «Pedindo esmolas» explicita de modo idiomático e digno o sentido de mendigar, sem limitar indevidamente o pedido a dinheiro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva a progressão narrativa e o aspecto contínuo das ações, evitando tanto literalismo artificial quanto explicações não presentes no texto.
