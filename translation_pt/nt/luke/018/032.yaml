  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: pt
  text: Pois ele será entregue aos gentios[a], será ridicularizado, insultado[b] e será alvo de cusparadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”. Aqui, o sentido é especificamente o dos povos não judeus, isto é, os gentios.
    reason: lexical_alternative
  - marker: b
    text: Ou “tratado de modo ultrajante” ou “tratado vergonhosamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: será entregue
  rationale: Preserva o futuro passivo e a ideia ampla de ser posto nas mãos de outros, sem restringir indevidamente o sentido a traição.
- source_word: γὰρ
  choice: Pois
  rationale: Expressa de modo conciso a relação explicativa com a declaração anterior.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: Neste contexto, designa especificamente os não judeus, e não as nações em sentido abstrato.
- source_word: ἐμπαιχθήσεται
  choice: será ridicularizado
  rationale: Comunica claramente a zombaria e o escárnio envolvidos no verbo grego, em registro atual e digno.
- source_word: ὑβρισθήσεται
  choice: insultado
  rationale: Representa o tratamento ultrajante e desonroso indicado pelo verbo, sem o reduzir necessariamente apenas a palavras; a nota preserva a amplitude lexical.
- source_word: ἐμπτυσθήσεται
  choice: receberá cusparadas
  rationale: Expressa naturalmente em português a ação passiva concreta e humilhante de cuspirem nele.
theological_decisions:
- issue: Referente do sujeito implícito dos verbos passivos
  choice: Uso de “ele”, retomando o Filho do Homem do contexto anterior
  alternative: Omitir o pronome e iniciar com “Pois será entregue”
  rationale: Embora o grego não expresse aqui o sujeito, o antecedente está claro em Lucas 18:31. O pronome torna a frase natural em português sem acrescentar conteúdo teológico.
- issue: Sentido de τοῖς ἔθνεσιν
  choice: “aos gentios”
  alternative: “às nações”
  rationale: O contexto da paixão aponta para a entrega a autoridades não judias; a nota mantém visível a alternativa formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação dos futuros passivos reproduz a sequência enfática do grego. Os marcadores aparecem depois da oração, na ordem [a][b], correspondendo respectivamente a “gentios” e “insultado”.
