  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: pt
  text: 'Jesus, vendo-o, disse: “Como é difícil para os que têm riquezas entrar no Reino de Deus!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Jesus, vendo-o, disse
  rationale: Mantém de modo natural a construção participial do grego. δέ é um conectivo leve e não precisa ser representado por uma conjunção explícita em português.
- source_word: Πῶς δυσκόλως
  choice: Como é difícil
  rationale: Reproduz a força exclamativa de grau da expressão grega em português corrente e digno.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: os que têm riquezas
  rationale: Preserva a formulação participial, sem reduzi-la ao simples rótulo “os ricos”; χρήματα abrange dinheiro, bens e riqueza.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: entrar no Reino de Deus
  rationale: A construção com infinitivo é idiomática após “é difícil”; “Reino de Deus” conserva a expressão bíblica conhecida.
theological_decisions:
- issue: Força da declaração de Jesus sobre quem possui riquezas e o Reino
  choice: Uma afirmação geral sobre a dificuldade de quem possui riquezas entrar no Reino de Deus
  alternative: Uma declaração de impossibilidade absoluta para os ricos
  rationale: O grego afirma dificuldade, não impossibilidade. A tradução mantém a tensão do versículo sem antecipar nem impor a explicação dada no contexto seguinte.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem “Jesus, vendo-o” acompanha de perto o particípio grego sem soar artificial. Emprega-se “Reino” com inicial maiúscula por convenção editorial, sem acrescentar conteúdo interpretativo.
