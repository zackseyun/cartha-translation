  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: pt
  text: Levavam-lhe até mesmo bebês, para que ele tocasse neles[a]. Mas, ao verem isso[c], os discípulos repreendiam essas pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “crianças de colo”. O termo grego se refere a crianças muito pequenas, especificamente bebês.'
    reason: lexical_alternative
  - marker: c
    text: Nos relatos paralelos, o toque de Jesus está associado à bênção e à imposição das mãos sobre as crianças (ver Mateus 19:13; Marcos 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: traziam
  rationale: O imperfeito indica uma ação em andamento ou repetida. “Traziam” expressa isso naturalmente em português.
- source_word: δὲ
  choice: Também… Mas
  rationale: A primeira ocorrência funciona como conexão narrativa leve e não exige uma palavra própria no início; a segunda introduz o contraste entre a ação das pessoas e a reação dos discípulos, expresso naturalmente por “Mas”.
- source_word: καὶ
  choice: até mesmo
  rationale: 'No contexto, acrescenta ênfase: traziam a Jesus até crianças de pouquíssima idade.'
- source_word: τὰ βρέφη
  choice: bebês
  rationale: βρέφη designa crianças muito pequenas, especialmente bebês. A escolha é precisa, atual e facilmente compreendida.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: para que ele tocasse neles
  rationale: Preserva tanto a finalidade indicada por ἵνα quanto o sentido direto de ἅπτομαι, “tocar”, sem inserir “abençoar” no texto principal.
- source_word: ἰδόντες
  choice: ao verem isso
  rationale: A construção temporal traduz com naturalidade o particípio aoristo; “isso” explicita em português a situação observada, já implícita no contexto.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Tradução direta do substantivo com artigo, sem acrescentar o possessivo “seus”, que não está expresso.
- source_word: ἐπετίμων
  choice: repreendiam
  rationale: O imperfeito sugere ação em curso ou repetida, e “repreendiam” mantém o tom forte de censura do verbo.
- source_word: αὐτοῖς
  choice: essas pessoas
  rationale: O pronome refere-se mais naturalmente às pessoas que levavam os bebês. A expressão evita em português uma referência pronominal confusa, preservando a identificação em nota.
theological_decisions:
- issue: Natureza da ação de Jesus para com os bebês
  choice: tocasse neles
  alternative: os abençoasse; impusesse as mãos sobre eles
  rationale: O verbo grego imediato é ἅπτηται, “tocar”. Embora os relatos paralelos associem esse toque à bênção e à imposição das mãos, não se deve inserir no texto principal mais do que Lucas declara aqui.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Bebês” é preferido por precisão e naturalidade; “até mesmo” conserva a ênfase de καὶ. A redação evita um marcador inicial artificial e mantém o toque de Jesus sem interpretá-lo diretamente como bênção.
