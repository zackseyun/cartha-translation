  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: pt
  text: E Deus não fará justiça aos seus escolhidos, que clamam a ele dia e noite? Será que demorará muito para agir em favor deles?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “embora seja paciente com eles” ou “e será paciente com eles?”. A expressão grega pode indicar paciência ou longanimidade, em vez de demora.'
    reason: Leitura alternativa de μακροθυμεῖ ἐπ’ αὐτοῖς, cuja relação sintática e nuance semântica são discutidas.
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: fará justiça
  rationale: No contexto da parábola do juiz injusto e do pedido persistente, indica reparação judicial ou defesa do direito, não vingança pessoal. “Fazer justiça” é natural em português e mantém o sentido forense.
- source_word: ἐκλεκτῶν
  choice: escolhidos
  rationale: O adjetivo funciona como substantivo e se refere aos que Deus escolheu. “Escolhidos” é claro para leitores modernos e evita restringir a expressão a uma formulação doutrinária específica.
- source_word: βοώντων
  choice: que clamam
  rationale: O particípio expressa um apelo intenso e insistente. “Clamam” preserva tanto a urgência quanto o contexto de oração.
- source_word: ἡμέρας καὶ νυκτός
  choice: dia e noite
  rationale: Mantém literalmente a expressão temporal e comunica a persistência contínua do apelo.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Será que demorará muito para agir em favor deles?
  rationale: A expressão é sintática e semanticamente difícil. Embora μακροθυμέω costume significar “ser paciente”, o contexto e a afirmação de rápida justiça no versículo seguinte favorecem aqui a ideia de possível demora em agir. A formulação preserva a força retórica sem sugerir indiferença divina.
- source_word: οὐ μὴ ποιήσῃ
  choice: não fará
  rationale: οὐ μή com o subjuntivo aoristo dá forte ênfase à negação dentro de uma pergunta retórica que espera resposta afirmativa. Em português, “não fará...?” expressa isso de modo natural.
- source_word: θεὸς
  choice: Deus
  rationale: Equivalente português padrão; o artigo grego identifica o sujeito sem exigir expansão.
theological_decisions:
- issue: Sentido de μακροθυμεῖ ἐπ’ αὐτοῖς em relação ao caráter e à ação de Deus
  choice: A frase principal pergunta se Deus demorará muito para agir em favor dos seus escolhidos.
  alternative: A expressão também pode ser entendida como “embora seja paciente com eles” ou “e será paciente com eles?”.
  rationale: O grego permite uma leitura centrada na paciência ou longanimidade de Deus, mas o contexto imediato destaca a prontidão da justiça divina. A tradução principal acompanha o fluxo retórico, enquanto a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Fará justiça”, “clamam” e “agir em favor deles” mantêm o cenário judicial e a intensidade do apelo sem recorrer a linguagem técnica ou denominacional.
