  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: pt
  text: 'E ele lhes disse: “Em verdade lhes digo: não há ninguém que tenha deixado casa, esposa, irmãos, pais ou filhos por causa do Reino de Deus,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Preserva a fórmula solene de afirmação de Jesus em linguagem digna e amplamente compreensível.
- source_word: ἀφῆκεν
  choice: tenha deixado
  rationale: Expressa a ideia de abandonar ou deixar para trás sem acrescentar uma interpretação sobre a permanência da separação.
- source_word: οἰκίαν
  choice: casa
  rationale: Mantém o sentido amplo de residência ou lar; o português não exige artigo neste elenco.
- source_word: γυναῖκα
  choice: mulher
  rationale: No contexto da lista de relações familiares, refere-se naturalmente à esposa, mas “mulher” preserva de modo direto a forma lexical grega.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: por causa do Reino de Deus
  rationale: Tradução natural que conserva a motivação expressa no texto-fonte.
theological_decisions:
- issue: Natureza de deixar familiares e bens
  choice: tenha deixado
  alternative: tenha abandonado
  rationale: “Deixado” preserva a amplitude do grego e não impõe a noção mais negativa ou absoluta que “abandonado” pode transmitir.
- issue: Referência a γυνή
  choice: mulher
  alternative: esposa
  rationale: “Mulher” segue formalmente o substantivo grego e, na sequência familiar, comunica a relação conjugal sem explicitação interpretativa adicional.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural. A pontuação final permanece aberta porque o versículo continua sintaticamente em Lucas 18:30.
