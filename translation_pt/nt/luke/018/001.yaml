id: LUK.18.1
reference: Luke 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: pt
  text: Ele lhes contava uma parábola sobre a necessidade que tinham de orar sempre e não desanimar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para mostrar que deviam orar sempre e não desanimar”.'
    reason: A construção πρὸς τὸ + infinitivo pode ser entendida de maneira mais explicitamente final, enquanto δεῖν também admite a formulação com “deviam”.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: contava
  rationale: O imperfeito apresenta a fala como ação passada em curso ou como pano de fundo narrativo; “contava” preserva esse aspecto sem tornar a frase artificial.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como conectivo leve de transição. Em português, a continuidade discursiva pode ser transmitida naturalmente sem acrescentar “agora” ou sugerir uma sequência temporal mais forte do que o grego.
- source_word: παραβολὴν
  choice: uma parábola
  rationale: É o equivalente consagrado e preciso no contexto dos Evangelhos, preservando o gênero da fala.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Representa naturalmente o objeto indireto de Ἔλεγεν e remete aos ouvintes de Jesus.
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: sobre a necessidade que tinham de
  rationale: A formulação portuguesa expressa com naturalidade a referência ou finalidade da parábola e preserva a necessidade indicada por δεῖν, fazendo dos ouvintes o sujeito dos infinitivos.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente direto e corrente, indicando persistência na oração sem exigir a ideia artificial de fala ininterrupta.
- source_word: προσεύχεσθαι
  choice: orar
  rationale: Tradução padrão e natural do infinitivo no contexto.
- source_word: μὴ ἐγκακεῖν
  choice: não desanimar
  rationale: ἐγκακέω pode indicar perder o ânimo, cansar-se ou desistir. “Não desanimar” conserva de modo claro o sentido interior de desalento e a perseverança exigida pelo contexto.
theological_decisions:
- issue: Força da exortação de Jesus à perseverança na oração
  choice: “a necessidade que tinham de orar sempre e não desanimar”
  alternative: “para mostrar que deviam orar sempre e não desanimar”
  rationale: A redação principal preserva a necessidade expressa por δεῖν sem introduzir uma doutrina específica sobre a eficácia da oração. A nota registra a possível leitura mais explicitamente final da construção πρὸς τὸ + infinitivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Contava” mantém o aspecto imperfeito; “não desanimar” é corrente e evita tanto o arcaísmo quanto uma interpretação denominacional.
