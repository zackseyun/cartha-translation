id: LUK.18.16
reference: Luke 18:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: pt
  text: 'Jesus, porém, chamou as crianças para junto de si e disse: “Deixem que as crianças venham a mim e não as impeçam, pois o Reino de Deus pertence aos que são como elas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “pois dos que são como elas é o Reino de Deus”.'
    reason: alternativa lexical que expõe a forma genitiva mais literal do grego
lexical_decisions:
- source_word: προσεκαλέσατο αὐτά
  choice: chamou as crianças para junto de si
  rationale: O verbo no médio expressa chamar para perto de si; explicitar “as crianças” torna natural em português o referente do pronome αὐτά sem mudar seu sentido.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Deixem que as crianças venham a mim
  rationale: Reproduz de forma direta e corrente a ordem para permitir que as crianças se aproximem de Jesus.
- source_word: μὴ κωλύετε αὐτά
  choice: não as impeçam
  rationale: “Impedir” comunica com clareza o sentido amplo de κωλύω, sem exigir que a ação já estivesse concluída.
- source_word: τῶν ... τοιούτων
  choice: aos que são como elas
  rationale: 'Preserva a força representativa da expressão: as crianças presentes apontam para uma classe mais ampla, sem definir qual característica está em vista.'
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Forma portuguesa consagrada e clara para a expressão grega, entendida aqui como o reino ou governo de Deus.
theological_decisions:
- issue: Alcance de τῶν τοιούτων
  choice: “aos que são como elas” inclui pessoas representadas pelas crianças
  alternative: Referência exclusiva às crianças presentes
  rationale: A expressão grega naturalmente indica pessoas desse tipo, mas o versículo não especifica em que sentido elas são semelhantes às crianças; a tradução mantém essa tensão.
- issue: Relação expressa pelo genitivo em τῶν τοιούτων ἐστὶν ἡ βασιλεία
  choice: “pertence aos que são como elas”
  alternative: “dos que são como elas é o Reino de Deus”
  rationale: A formulação idiomática comunica a relação de pertencimento ou associação sem acrescentar condições teológicas ausentes do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Para junto de si” preserva a ideia reflexiva do verbo, e “aos que são como elas” mantém aberta a natureza exata da comparação.
