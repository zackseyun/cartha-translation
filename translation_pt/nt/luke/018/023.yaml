lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste entre as palavras de Jesus e a reação do homem, de modo natural em português.
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: O particípio aoristo tem valor temporal neste contexto; “ao ouvir” preserva de forma concisa a sequência da reação.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo plural retoma as declarações anteriores de Jesus sem restringi-las a uma única frase.
- source_word: περίλυπος
  choice: profundamente triste
  rationale: O adjetivo expressa tristeza ou aflição intensa; esta formulação comunica sua força em português atual.
- source_word: ἐγενήθη
  choice: ficou
  rationale: Expressa a entrada em um estado emocional, preservando o sentido ingressivo de γίνομαι com naturalidade.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação para a tristeza do homem em registro claro e digno.
- source_word: πλούσιος
  choice: rico
  rationale: Equivalente direto, corrente e adequado ao contexto.
- source_word: σφόδρα
  choice: extremamente
  rationale: Preserva a forte intensificação da riqueza, mais enfática do que um simples “muito”.
