  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: pt
  text: Mas, ao ouvir essas coisas, ele ficou profundamente triste[a], pois era extremamente rico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
