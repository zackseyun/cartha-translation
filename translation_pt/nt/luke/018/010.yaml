id: LUK.18.10
reference: Luke 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: pt
  text: 'Dois homens subiram ao templo para orar[a]: um era fariseu, e o outro, cobrador de impostos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Dois homens
  rationale: Embora ἄνθρωποι possa designar pessoas em geral, as descrições masculinas que se seguem identificam dois homens; a tradução preserva essa referência contextual.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Preserva o sentido de movimento ascendente de ἀναβαίνω e a maneira habitual de falar da ida a Jerusalém e ao templo.
- source_word: εἰς τὸ ἱερὸν
  choice: ao templo
  rationale: ἱερόν designa o complexo ou recinto do templo, não especificamente o santuário interior. Em português, «ao templo» é idiomático e mantém a ideia de destino, enquanto a nota esclarece a extensão do termo.
- source_word: προσεύξασθαι
  choice: para orar
  rationale: O infinitivo aoristo expressa finalidade; «para orar» é direto, natural e semanticamente preciso.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: um ... e o outro
  rationale: Reproduz de modo natural em português o contraste distributivo entre os dois indivíduos.
- source_word: Φαρισαῖος
  choice: fariseu
  rationale: Forma portuguesa estabelecida para o membro desse grupo judaico.
- source_word: τελώνης
  choice: cobrador de impostos
  rationale: Expressão moderna e clara para o agente que arrecadava impostos ou taxas, sem recorrer ao arcaísmo «publicano».
theological_decisions:
- issue: Distinção entre ἱερόν e ναός
  choice: templo, com nota explicativa
  alternative: recinto do templo
  rationale: O referente é o complexo do templo, e não necessariamente o santuário interior. A forma familiar fica no texto, sem apagar a precisão lexical, registrada em nota.
- issue: Referência de gênero em ἄνθρωποι
  choice: homens
  alternative: pessoas
  rationale: Apesar de o substantivo poder ser genérico, o contexto imediato apresenta dois indivíduos do sexo masculino; «homens» preserva essa referência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Subiram ao templo» conserva o movimento do original sem soar artificial. A construção «um era fariseu, e o outro, cobrador de impostos» explicita naturalmente a identificação nominal elíptica do grego.
