  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: pt
  text: Contudo, como esta viúva não para de me causar transtorno, vou fazer justiça a ela[a], para que, vindo sem parar, não me desgaste[b]”.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vou defendê-la” ou “vou lhe garantir justiça”. Em certos contextos, o verbo grego também pode significar “vingar”, mas aqui se refere a conceder reparação judicial.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “me golpeie debaixo do olho”; aqui, uma expressão forte que pode indicar exaurir ou desgastar alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην
  choice: Contudo, como esta viúva não para de me causar transtorno
  rationale: διά com o infinitivo articular exprime causa, e γε acrescenta ênfase. O presente παρέχειν sugere ação contínua; a formulação escolhida comunica isso em português natural.
- source_word: ἐκδικήσω αὐτήν
  choice: vou fazer justiça a ela
  rationale: No contexto judicial da parábola, ἐκδικέω indica conceder reparação ou assegurar justiça, não executar vingança pessoal.
- source_word: εἰς τέλος ἐρχομένη
  choice: continue vindo sem parar
  rationale: A combinação transmite a persistência das visitas. 'Sem parar' conserva o valor de εἰς τέλος neste contexto sem tornar a frase artificial.
- source_word: ὑπωπιάζῃ με
  choice: acabe comigo
  rationale: O verbo significa literalmente golpear debaixo do olho, mas aqui funciona de modo figurado para o desgaste causado pela insistência. 'Acabe comigo' preserva a força expressiva e soa natural.
theological_decisions:
- issue: Sentido de ἐκδικήσω no contexto da justiça pedida pela viúva
  choice: vou fazer justiça a ela
  alternative: vou vingá-la
  rationale: A cena trata de uma decisão judicial favorável e de reparação, não necessariamente de vingança; a tradução mantém o vínculo temático com a justiça nos versículos seguintes.
- issue: Possível literalidade de ὑπωπιάζῃ
  choice: acabe comigo
  alternative: me dê um golpe debaixo do olho
  rationale: Embora a imagem literal seja forte, no contexto a fala do juiz descreve figuradamente o desgaste produzido pela persistência. A nota preserva a imagem grega sem impor uma ameaça física à narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala conserva o tom exasperado e coloquial do juiz sem perder o contexto judicial. Todos os marcadores de nota aparecem no texto principal.
