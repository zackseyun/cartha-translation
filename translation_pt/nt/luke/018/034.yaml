source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: pt
  text: Eles não compreenderam nada disso, e essa palavra lhes estava oculta[a], e não sabiam o que estava sendo dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essa declaração” ou “essa mensagem”. O texto não diz quem ou o que a ocultou deles.
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: compreenderam
  rationale: Expressa a compreensão intelectual das declarações anteriores de Jesus e distingue naturalmente este verbo do posterior ἐγίνωσκον.
- source_word: οὐδὲν τούτων
  choice: nada disso
  rationale: Forma idiomática em português que remete ao conjunto das declarações anteriores, sem exigir uma expressão rígida como “nenhuma destas coisas”.
- source_word: τὸ ῥῆμα τοῦτο
  choice: essa palavra
  rationale: Preserva a forma de ῥῆμα e sua referência à declaração de Jesus; “essa” retoma naturalmente, em português, o que acabou de ser dito.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: lhes estava oculta
  rationale: Reproduz o estado resultante indicado pela construção perifrástica com particípio perfeito passivo e mantém indeterminado o agente que ocultou.
- source_word: ἐγίνωσκον
  choice: entendiam
  rationale: Neste contexto, γινώσκω se refere à apreensão do sentido do que era dito. “Entendiam” é natural em português, enquanto “conheciam” seria inadequado para o conteúdo de uma fala.
- source_word: τὰ λεγόμενα
  choice: o que estava sendo dito
  rationale: Tradução natural do particípio passivo presente, preservando tanto o conteúdo como o aspecto em curso da fala.
theological_decisions:
- issue: Natureza da falta de compreensão dos discípulos
  choice: Manter a declaração de que a palavra lhes estava oculta sem identificar quem ou o que a ocultou.
  alternative: Explicitar que Deus a ocultou ou reduzir a ocultação à confusão psicológica dos discípulos.
  rationale: O passivo grego não declara o agente; a tradução conserva essa ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A coordenação grega foi vertida com “pois” para expressar de modo natural a relação explicativa entre a incompreensão e a ocultação, sem identificar o agente desta. O paralelismo tríplice foi preservado.
