  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: pt
  text: 'Durante algum tempo, ele não quis atendê-la. Mas depois disse consigo mesmo: “Embora eu não tema a Deus nem respeite ninguém,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: não quis atendê-la
  rationale: O imperfeito, junto de ἐπὶ χρόνον e do contexto imediato da petição da viúva, indica indisposição persistente por certo período. O complemento contextual torna a frase natural em português sem sugerir uma recusa definitiva.
- source_word: ἐπὶ χρόνον
  choice: Durante algum tempo
  rationale: Reproduz de modo idiomático a duração indefinida da expressão grega.
- source_word: μετὰ ταῦτα δὲ
  choice: Mas depois
  rationale: Expressa tanto a sequência temporal quanto a leve mudança de rumo marcada por δέ.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: disse consigo mesmo
  rationale: Preserva a forma de discurso interior do grego em linguagem portuguesa natural e digna.
- source_word: Εἰ καὶ
  choice: Embora
  rationale: A construção é concessiva neste contexto, não uma condição incerta.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: não tema a Deus
  rationale: Mantém a expressão bíblica tradicional e a força moral direta de φοβοῦμαι, que pode envolver temor e reverência.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: nem respeite ninguém
  rationale: O singular anartro ἄνθρωπον é genérico, e ἐντρέπομαι aqui significa ter consideração ou respeito. “Ninguém” comunica naturalmente em português a ausência de consideração por qualquer pessoa.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπον
  choice: ninguém
  alternative: homem algum
  rationale: Embora o grego use o singular “ser humano/homem”, seu valor é genérico. “Ninguém” preserva o alcance universal e o paralelismo com a negação anterior sem restringir o referente ao sexo masculino.
- issue: Temor de Deus
  choice: tema a Deus
  alternative: reverencie a Deus
  rationale: “Temer a Deus” conserva a formulação bíblica e a ambivalência legítima entre medo e reverência, sem reduzir o sentido a apenas um deles.
translation_notes:
  register: Português moderno, claro e amplamente internacional, com leitura natural no Brasil. A abertura liga explicitamente a relutância à petição da viúva, conforme o contexto, e a vírgula final preserva a continuidade da fala no versículo seguinte.
