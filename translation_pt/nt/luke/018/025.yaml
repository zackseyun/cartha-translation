  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: pt
  text: Pois é mais fácil um camelo entrar pelo buraco de uma agulha do que um rico entrar no Reino de Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pela abertura de uma agulha”.
    reason: lexical_alternative
  - marker: b
    text: Alguns propuseram explicações como a existência de um portão estreito chamado “buraco da agulha” ou o sentido “corda” em vez de “camelo”; no entanto, o texto grego aqui diz “camelo”.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: é mais fácil
  rationale: O comparativo predicativo com ἐστιν é expresso de modo direto e natural em português por “é mais fácil”.
- source_word: γάρ
  choice: Pois
  rationale: Preserva a função explicativa que liga a declaração ao contexto anterior, com registro corrente e digno.
- source_word: κάμηλον
  choice: um camelo
  rationale: κάμηλος significa normalmente “camelo”; não há base textual para substituí-lo por “corda”.
- source_word: διὰ τρήματος βελόνης
  choice: pelo buraco de uma agulha
  rationale: Expressa de maneira clara e natural a passagem através da abertura de uma agulha, sem transformar a imagem em uma suposta referência a um portão.
- source_word: εἰσελθεῖν
  choice: entrar
  rationale: Mantém o sentido básico do infinitivo de εἰσέρχομαι nas duas partes da comparação.
- source_word: πλούσιον
  choice: um rico
  rationale: O adjetivo masculino singular substantivado é reproduzido de forma concisa e fiel como “um rico”.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: no Reino de Deus
  rationale: “Reino de Deus” conserva a expressão bíblica central; “entrar no” é a formulação idiomática em português para o movimento indicado por εἰς.
theological_decisions:
- issue: Interpretação da imagem do camelo e da agulha
  choice: Manter a imagem literal e hiperbólica de um camelo entrando pelo buraco de uma agulha.
  alternative: Explicá-la como referência a um portão estreito chamado “buraco da agulha” ou substituir “camelo” por “corda”.
  rationale: O texto grego traz κάμηλον, “camelo”, e descreve uma imagem deliberadamente extrema. Explicações tradicionais posteriores não devem ser inseridas no texto sem apoio textual.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação explicativa; “buraco de uma agulha” evita um calque pouco natural e comunica claramente a imagem; “Reino” recebe inicial maiúscula por convenção editorial bíblica.
