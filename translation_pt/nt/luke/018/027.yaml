base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: pt
  text: 'Mas ele disse: “O que é impossível para os seres humanos é possível para Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Mas ele disse
  rationale: δέ tem aqui valor levemente adversativo, pois introduz a resposta de Jesus à dificuldade expressa no contexto anterior.
- source_word: Τὰ ἀδύνατα
  choice: O que é impossível
  rationale: O adjetivo neutro plural é substantivado. A construção singular coletiva é natural em português e preserva a referência geral àquilo que está além da capacidade humana.
- source_word: παρὰ ἀνθρώποις
  choice: para os seres humanos
  rationale: παρά com o dativo indica esfera ou referência, isto é, aquilo que é impossível no âmbito humano. “Seres humanos” comunica de modo claro o sentido genérico de ἀνθρώποις.
- source_word: δυνατὰ
  choice: é possível
  rationale: Mantém o contraste direto com ἀδύνατα e produz uma formulação idiomática em português.
- source_word: παρὰ τῷ θεῷ
  choice: para Deus
  rationale: Assim como na expressão anterior, παρά com o dativo indica referência ou esfera. “Para Deus” é natural em português e conserva o paralelismo entre incapacidade humana e capacidade divina.
theological_decisions:
- issue: Alcance da possibilidade divina
  choice: A frase afirma que aquilo que é impossível no âmbito humano é possível para Deus, especialmente no contexto da salvação.
  alternative: Ler a declaração como uma máxima filosófica que define de forma exaustiva tudo o que Deus pode fazer.
  rationale: A tradução mantém a formulação ampla do grego, mas não acrescenta uma definição filosófica de onipotência nem restringe explicitamente a afirmação além do que o contexto indica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo “para os seres humanos / para Deus” reproduz naturalmente o contraste das duas construções com παρά. Não foi necessária nota textual ou lexical.
