base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: pt
  text: 'E Jesus lhe disse: “Recupere a visão[a]; a sua fé salvou você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Volte a ver.” Neste contexto de cura, o imperativo grego pode significar “enxergue novamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “curou você” ou “fez você ficar bem”. O verbo grego pode se referir tanto à cura quanto à salvação.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação narrativa simples, sem acrescentar uma relação temporal ou conclusiva que o grego não explicita.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Forma natural e direta de preservar o verbo de fala e o objeto indireto no português.
- source_word: Ἀνάβλεψον
  choice: Recupere a visão
  rationale: No contexto da cura de um cego, o imperativo se refere a passar a enxergar, ou a enxergar novamente, e não simplesmente a olhar para cima.
- source_word: πίστις
  choice: fé
  rationale: É o equivalente corrente e teologicamente amplo; neste contexto, indica a confiança do homem em Jesus sem reduzir o termo a uma explicação interpretativa.
- source_word: σέσωκέν
  choice: salvou
  rationale: Preserva a amplitude de σῴζω, que neste contexto pode abranger tanto a cura física quanto a salvação em sentido mais pleno. O pretérito perfeito é a forma portuguesa natural para o perfeito grego neste enunciado.
theological_decisions:
- issue: Alcance de σῴζω em uma narrativa de cura
  choice: salvou
  alternative: curou; fez você ficar bem
  rationale: O contexto inclui claramente a restauração física, mas o verbo também pode expressar salvação. “Salvou” mantém a tensão e a amplitude teológica presentes no grego, enquanto a nota registra as leituras mais estritamente relacionadas à cura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Recupere a visão” comunica naturalmente a cura sem exigir no texto principal que o homem tivesse enxergado antes; “salvou você” evita a ambiguidade referencial que “o salvou” poderia causar e preserva a amplitude do verbo grego.
