  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: pt
  text: 'E os que iam à frente o repreendiam para que se calasse; ele, porém, gritava ainda mais: “Filho de Davi, tem misericórdia de mim!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: os que iam à frente
  rationale: O particípio presente substantivado indica as pessoas que seguiam adiante na multidão; a formulação preserva o sentido espacial sem lhes atribuir uma função de liderança.
- source_word: ἐπετίμων
  choice: o repreendiam
  rationale: O imperfeito expressa ação continuada ou repetida, enquanto “repreendiam” conserva a força de censura de ἐπιτιμάω.
- source_word: ἵνα σιγήσῃ
  choice: para que se calasse
  rationale: Expressa naturalmente em português a finalidade da repreensão e mantém a ideia enfática de ficar em silêncio.
- source_word: αὐτὸς δὲ
  choice: ele, porém
  rationale: Marca o contraste entre a tentativa de silenciá-lo e sua reação persistente, sem tornar explícito demais o valor enfático do pronome.
- source_word: πολλῷ μᾶλλον
  choice: ainda mais
  rationale: Equivalente idiomático que preserva a intensificação comparativa sem acrescentar “alto” ou “forte”, ideias não expressas diretamente.
- source_word: ἔκραζεν
  choice: gritava
  rationale: O imperfeito comunica ação persistente no contexto; “gritava” é atual e natural, além de transmitir a força de κράζω.
- source_word: Υἱὲ Δαυίδ
  choice: Filho de Davi
  rationale: Traduz diretamente o título davídico e preserva sua relevância messiânica no relato.
- source_word: ἐλέησόν με
  choice: tem misericórdia de mim
  rationale: Formulação consagrada, clara e digna para o imperativo urgente, preservando a ressonância teológica do pedido.
theological_decisions:
- issue: Significado messiânico de Υἱὲ Δαυίδ
  choice: Traduzir no texto como “Filho de Davi”
  alternative: Tratá-lo apenas como uma forma honorífica de tratamento
  rationale: No contexto narrativo de Lucas, a expressão tem relevância real e messiânica. A tradução direta conserva essa significação sem inserir uma explicação interpretativa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém o contraste e a progressão aspectual do grego, evitando explicitações não presentes na fonte.
