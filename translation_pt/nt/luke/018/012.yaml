  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: pt
  text: Jejuo duas vezes por semana[a] e dou o dízimo de tudo o que adquiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “duas vezes do sábado”, expressão idiomática que significa “duas vezes por semana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Jejuo
  rationale: O presente do indicativo descreve aqui uma prática habitual; a forma simples em português expressa naturalmente esse costume alegado pelo falante.
- source_word: δὶς τοῦ σαββάτου
  choice: duas vezes por semana
  rationale: A expressão grega, literalmente ligada ao sábado, funciona idiomaticamente como referência ao ciclo semanal; esta formulação comunica a frequência sem sugerir dois jejuns no próprio sábado.
- source_word: ἀποδεκατῶ
  choice: dou o dízimo
  rationale: O verbo significa dar a décima parte. A locução é clara, corrente e mais amplamente compreensível do que o verbo menos usual «dizimar».
- source_word: πάντα ὅσα
  choice: de tudo o que
  rationale: Reproduz de modo natural o alcance abrangente da construção relativa grega.
- source_word: κτῶμαι
  choice: adquiro
  rationale: O verbo médio indica adquirir ou obter para si, e não meramente possuir; «adquiro» preserva essa nuance.
theological_decisions:
- issue: Sentido de τοῦ σαββάτου na declaração sobre o jejum
  choice: 'sentido temporal idiomático: «por semana»'
  alternative: 'tradução mais literal: «do sábado»'
  rationale: A expressão indica frequência no ciclo semanal, não uma afirmação teológica sobre a observância do sábado. A tradução idiomática evita a impressão equivocada de que a pessoa jejua duas vezes no mesmo sábado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Dou o dízimo» evita o possível sentido moderno de «dizimar» como destruir em grande número, e «adquiro» mantém a nuance aquisitiva do grego.
