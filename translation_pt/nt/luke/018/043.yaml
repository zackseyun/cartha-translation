id: LUK.18.43
reference: Luke 18:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: pt
  text: Imediatamente, ele passou a enxergar[a] e seguia Jesus, glorificando a Deus. Ao ver isso, todo o povo deu louvor a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «voltou a ver» ou «recuperou a visão». O verbo grego pode indicar recuperação da visão; «passou a enxergar» não afirma se o homem já havia enxergado antes.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Expressa de modo natural e preciso que a cura ocorreu sem demora.
- source_word: ἀνέβλεψεν
  choice: passou a enxergar
  rationale: No contexto de cura da cegueira, comunica que o homem recebeu a capacidade de ver sem afirmar necessariamente que ele já enxergara antes.
- source_word: ἠκολούθει
  choice: seguia Jesus
  rationale: O imperfeito apresenta a ação como contínua. A repetição de «Jesus» evita ambiguidade pronominal e permanece natural em português.
- source_word: δοξάζων
  choice: glorificando
  rationale: Preserva a linguagem de atribuição de glória a Deus e distingue este verbo de αἶνον, traduzido depois como «louvor».
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Reproduz o valor coletivo da expressão grega sem substituí-la por «multidão».
- source_word: ἰδών
  choice: ao ver isso
  rationale: O particípio concorda formalmente com o coletivo singular «povo»; «isso» explicita de maneira discreta o acontecimento visto, implícito no grego.
- source_word: ἔδωκεν αἶνον
  choice: deu louvor
  rationale: Mantém a construção verbal-nominal do grego e soa digna e compreensível em português.
- source_word: θεόν / θεῷ
  choice: Deus / a Deus
  rationale: Tradução padrão; a repetição é preservada para manter a ênfase do versículo.
theological_decisions:
- issue: Aspecto da ação de seguir Jesus após a cura
  choice: seguia Jesus
  alternative: seguiu Jesus
  rationale: O imperfeito ἠκολούθει retrata uma ação em curso. A tradução conserva esse aspecto sem acrescentar uma interpretação doutrinária sobre o discipulado.
- issue: Possível história anterior da visão do homem
  choice: passou a enxergar
  alternative: recuperou a visão
  rationale: A alternativa pode sugerir que ele enxergava antes, algo que o verbo permite, mas que o contexto não exige. A formulação escolhida preserva essa abertura.
- issue: Concordância coletiva de πᾶς ὁ λαός
  choice: todo o povo ... deu
  alternative: todos ... deram
  rationale: A concordância no singular acompanha naturalmente o substantivo coletivo português e reflete a construção grega, sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A vírgula após «Imediatamente» favorece o ritmo natural. O texto preserva a distinção lexical entre glorificar e dar louvor.
