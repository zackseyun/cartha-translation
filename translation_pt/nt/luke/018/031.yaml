reference: Luke 18:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: pt
  text: 'Então, tomando consigo os Doze, disse-lhes: “Vejam, estamos subindo para Jerusalém, e se cumprirá tudo o que foi escrito por meio dos profetas a respeito do Filho do Homem.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o Filho do Homem”. A construção grega admite essa tradução mais literal, embora provavelmente se refira aqui ao que os profetas escreveram a respeito dele.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: tomando consigo
  rationale: Expressa o ato de Jesus levar os Doze consigo para lhes falar, sem acrescentar explicitamente a ideia de que os chamou à parte, que não está lexicalmente marcada no verbo.
- source_word: τοὺς δώδεκα
  choice: os Doze
  rationale: Mantém a designação reconhecida do grupo mais próximo de Jesus sem acrescentar “discípulos”.
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Funciona como marcador discursivo que chama a atenção dos ouvintes, em português atual e natural.
- source_word: ἀναβαίνομεν
  choice: estamos subindo
  rationale: Preserva tanto o aspecto presente da viagem quanto a noção geográfica de subida a Jerusalém.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa convencional do nome da cidade.
- source_word: τελεσθήσεται
  choice: se cumprirá
  rationale: No contexto profético, comunica naturalmente que o que foi escrito chegará à sua realização.
- source_word: πάντα τὰ γεγραμμένα
  choice: tudo o que foi escrito
  rationale: Reproduz a totalidade de πάντα e o sentido resultante do particípio perfeito em português idiomático.
- source_word: διὰ τῶν προφητῶν
  choice: por meio dos profetas
  rationale: Preserva o valor instrumental de διά com o genitivo e a ideia de que os profetas foram os agentes pelos quais a mensagem foi registrada.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: a respeito do Filho do Homem
  rationale: Entende o dativo como referência ou assunto no contexto, oferecendo uma construção natural em português sem ocultar a alternativa mais literal, registrada em nota.
theological_decisions:
- issue: Tradução do título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional preserva a estrutura grega, a força titular da expressão e sua possível ressonância com Daniel, sem reduzi-la a uma designação genérica.
- issue: Função do dativo τῷ υἱῷ τοῦ ἀνθρώπου
  choice: a respeito do Filho do Homem
  alternative: para o Filho do Homem
  rationale: No contexto de coisas escritas pelos profetas, o dativo provavelmente indica aquilo a que a profecia se refere; a nota mantém visível a construção mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Os Doze” conserva a designação histórica; “Vejam” evita o arcaísmo de “Eis” sem perder a função enfática. A nota foi posicionada junto à expressão cuja construção grega gera a alternativa.
