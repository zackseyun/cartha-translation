source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: pt
  text: 'Você conhece os mandamentos: Não cometa adultério[a]; não assassine; não roube; não dê falso testemunho; honre seu pai e sua mãe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, na formulação mais tradicional: “Não cometerás adultério; não matarás; não roubarás; não darás falso testemunho”.'
    reason: Alternativa estilística tradicional para a série de proibições do Decálogo.
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: os mandamentos
  rationale: Neste contexto, ἐντολή designa mandamentos reconhecidos do Decálogo; “mandamentos” preserva o sentido bíblico e jurídico.
- source_word: οἶδας
  choice: você conhece
  rationale: Embora οἶδα tenha forma de perfeito, apresenta sentido presente no grego koiné. “Você conhece” é natural e mantém a ideia de familiaridade com os mandamentos.
- source_word: Μὴ μοιχεύσῃς
  choice: Não cometa adultério
  rationale: Traduz diretamente a proibição específica de μοιχεύω em português moderno e claro.
- source_word: Μὴ φονεύσῃς
  choice: não mate
  rationale: No contexto do Decálogo, φονεύω proíbe tirar ilicitamente a vida humana. “Não mate” é a formulação bíblica mais amplamente reconhecível em português; a nota esclarece a alternativa lexical mais específica.
- source_word: Μὴ κλέψῃς
  choice: não roube
  rationale: κλέπτω significa diretamente roubar; a formulação breve conserva a força da proibição.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: não dê falso testemunho
  rationale: Preserva tanto o sentido de testemunhar falsamente quanto a ressonância reconhecível do Decálogo, em linguagem portuguesa natural.
- source_word: Τίμα
  choice: honre
  rationale: τιμάω expressa conferir honra e tratar com a consideração devida; “honre” mantém o peso ético e pactual.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: seu pai e sua mãe
  rationale: A repetição de “seu/sua” soa natural em português e representa claramente o possessivo grego associado aos dois pais.
theological_decisions:
- issue: Forma das proibições do Decálogo
  choice: 'Imperativos modernos: “Não cometa...; não mate...”'
  alternative: 'Forma tradicional com futuro: “Não cometerás...; não matarás...”'
  rationale: O grego emprega subjuntivos aoristos proibitivos. O imperativo negativo moderno comunica sua força sem linguagem arcaica e sem alterar o conteúdo teológico.
- issue: Extensão semântica de φονεύω
  choice: “não mate”, com esclarecimento em nota
  alternative: “não assassine”
  rationale: φονεύω normalmente se refere a matar de modo ilícito, e “assassinar” explicita essa precisão. Contudo, “não mate” preserva a forma consagrada e imediatamente reconhecível do mandamento em português; a nota evita que seja entendido como referência indistinta a toda forma de matar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” por corresponder ao singular dirigido ao interlocutor e imperativos contemporâneos, evitando a forma arcaica “não cometerás”. A pontuação com ponto e vírgula distingue claramente cada mandamento.
