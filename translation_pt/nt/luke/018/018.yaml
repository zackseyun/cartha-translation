  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: «um líder» preserva o caráter indefinido de τις e a posição de autoridade de ἄρχων; «lhe perguntou» corresponde a ἐπηρώτησεν αὐτόν; «Bom Mestre» mantém a forma de tratamento Διδάσκαλε ἀγαθέ; e «herdar a vida eterna» conserva tanto κληρονομήσω quanto ζωὴν αἰώνιον. «O que devo fazer» é uma equivalência idiomática apropriada para τί ποιήσας ... κληρονομήσω, sem transformar a pergunta do personagem em uma afirmação teológica do narrador.'
