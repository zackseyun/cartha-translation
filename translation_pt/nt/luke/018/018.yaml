id: LUK.18.18
reference: Luke 18:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: pt
  text: 'E um líder lhe perguntou: “Bom Mestre, o que devo fazer para herdar a vida eterna?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: perguntou
  rationale: O verbo significa perguntar ou interrogar; “perguntou” é natural e adequado ao fluxo narrativo.
- source_word: τις ἄρχων
  choice: um líder
  rationale: O pronome indefinido introduz uma pessoa não identificada, e ἄρχων indica alguém em posição de autoridade. “Um líder” preserva essa amplitude sem especificar um cargo.
- source_word: λέγων
  choice: introduzido por dois-pontos
  rationale: Em português, após “perguntou”, os dois-pontos introduzem a fala direta de modo mais natural do que reproduzir literalmente “dizendo”.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Bom Mestre
  rationale: Preserva tanto o sentido de διδάσκαλος, aquele que ensina, quanto o adjetivo ἀγαθός, cuja formulação será retomada por Jesus no versículo seguinte.
- source_word: τί ποιήσας
  choice: o que devo fazer
  rationale: A construção participial com o futuro exprime a ação vista como requisito ou meio; esta formulação é idiomática e mantém a pergunta do líder em termos de ação humana.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa consagrada e fiel ao sentido contextual, sem excluir a dimensão da vida da era futura.
- source_word: κληρονομήσω
  choice: herdar
  rationale: Mantém explicitamente a linguagem de herança presente no verbo grego, importante para a força narrativa e teológica da pergunta.
theological_decisions:
- issue: A pergunta sobre a salvação formulada em relação à ação humana
  choice: o que devo fazer para herdar a vida eterna?
  alternative: o que, tendo feito, herdarei como vida eterna?
  rationale: A tradução preserva a formulação do próprio líder, que apresenta a herança da vida eterna em termos do que deve fazer, sem endossar nem corrigir antecipadamente sua perspectiva teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe da fala foi naturalizada sem apagar a linguagem de herança nem a tensão teológica do original.
