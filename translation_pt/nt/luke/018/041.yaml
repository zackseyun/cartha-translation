id: LUK.18.41
reference: Luke 18:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: pt
  text: '“O que você quer que eu faça por você?” E ele disse: “Senhor[a], que eu volte a ver[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”, como forma respeitosa de tratamento; o grego κύριε também pode ter esse uso, embora “Senhor” seja a tradução adotada aqui.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “que eu recupere a visão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: O que
  rationale: Introduz uma pergunta direta sobre o pedido específico do homem; aqui o sentido é interrogativo, não causal.
- source_word: σοι
  choice: por você
  rationale: O dativo com ποιήσω tem sentido benefactivo e é expresso de modo natural em português por “por você”.
- source_word: θέλεις
  choice: você quer
  rationale: Expressa vontade de forma direta e corrente, adequada ao diálogo.
- source_word: ποιήσω
  choice: que eu faça
  rationale: O subjuntivo aoristo, dependente de θέλεις, corresponde naturalmente à construção portuguesa “quer que eu faça”.
- source_word: ὁ δὲ εἶπεν
  choice: Ele respondeu
  rationale: No fluxo do diálogo, “respondeu” comunica naturalmente o ato de falar em reação à pergunta; δέ funciona aqui como conexão narrativa leve.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a tradução usual de κύριος e preserva tanto o respeito no tratamento quanto uma possível ressonância cristológica.
- source_word: ἵνα
  choice: que
  rationale: Introduz o conteúdo do pedido numa formulação concisa e natural em português.
- source_word: ἀναβλέψω
  choice: eu volte a ver
  rationale: Em relatos de cura, ἀναβλέπω frequentemente significa recuperar a visão; “voltar a ver” expressa esse sentido com clareza sem expansão excessiva.
theological_decisions:
- issue: Tradução de κύριος no vocativo dirigido a Jesus
  choice: Senhor
  alternative: senhor, como forma respeitosa de tratamento
  rationale: “Senhor” preserva a abertura do termo grego, que pode funcionar como tratamento respeitoso e também carregar uma ressonância cristológica, sem reduzir antecipadamente seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta usa uma construção conversacional corrente; a resposta mantém a forma concisa do grego e preserva a ambiguidade respeitosa e cristológica de Κύριε.
