id: LUK.18.19
reference: Luke 18:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Por que você me chama de bom? Ninguém é bom, a não ser um só: Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca de modo natural o leve contraste e o caráter corretivo da resposta de Jesus no contexto.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Jesus ... disse
  rationale: Reproduz diretamente o verbo λέγω sem tornar explícita, por meio de “respondeu”, uma nuance apenas contextual.
- source_word: αὐτῷ
  choice: lhe
  rationale: Preserva o pronome grego de maneira concisa e natural em português.
- source_word: Τί
  choice: Por que
  rationale: 'Nesta construção idiomática, τί pergunta pela razão: “Por que você me chama de bom?”.'
- source_word: με λέγεις ἀγαθόν
  choice: você me chama de bom
  rationale: Expressa com clareza a construção com objeto e adjetivo predicativo, mantendo a forma direta da pergunta.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: bom
  rationale: Mantém o mesmo termo nas duas ocorrências e evita acrescentar uma qualificação moral que não está explícita no adjetivo.
- source_word: οὐδεὶς
  choice: Ninguém
  rationale: É a forma corrente e clara de preservar a negação universal.
- source_word: εἰ μὴ εἷς
  choice: a não ser um só
  rationale: Conserva tanto a construção de exceção quanto a ênfase de εἷς na singularidade daquele que é bom.
- source_word: ὁ θεός
  choice: Deus
  rationale: Identifica naturalmente o referente em português; os dois-pontos tornam clara a aposição explicativa sem acrescentar conteúdo.
theological_decisions:
- issue: Implicação cristológica da pergunta de Jesus
  choice: Preservar a pergunta e a afirmação sem explicar se Jesus está recusando o qualificativo ou conduzindo o interlocutor a reconhecer sua identidade.
  alternative: Parafrasear o texto como uma negação da bondade de Jesus ou como uma declaração direta de sua divindade.
  rationale: O grego mantém essa tensão e não explicita aqui nenhuma das conclusões. A tradução não deve resolver por paráfrase aquilo que o versículo deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para naturalidade contemporânea e “a não ser um só” para preservar a ênfase do original.
