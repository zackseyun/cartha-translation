  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: pt
  text: 'dizendo: “Em certa cidade havia certo juiz que não temia a Deus nem respeitava ninguém[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “não respeitava ser humano algum”. O grego emprega o singular de modo genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a forma participial que liga este versículo ao anterior e introduz naturalmente as palavras da parábola.
- source_word: Κριτής τις ἦν ἔν τινι πόλει
  choice: Em certa cidade havia um juiz
  rationale: A construção existencial com “havia” é natural em português. “Certa cidade” preserva a indefinição narrativa, enquanto repetir “certo” diante de “juiz” soaria artificial sem acrescentar conteúdo relevante.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: não temia a Deus
  rationale: Preserva o sentido moral e religioso de φοβέομαι e apresenta a característica habitual do juiz em português corrente.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: nem respeitava ninguém
  rationale: Neste contexto, ἐντρέπομαι exprime consideração, respeito ou deferência. “Ninguém” comunica de modo natural o valor genérico do singular ἄνθρωπον e a total falta de consideração do juiz pelas pessoas.
theological_decisions:
- issue: O singular genérico ἄνθρωπον em contraste com Deus
  choice: ninguém
  alternative: o ser humano / as pessoas
  rationale: O substantivo grego está no singular, mas é usado genericamente. Em português moderno, “ninguém” preserva melhor o sentido abrangente da afirmação sem sugerir que o juiz desrespeitava apenas homens do sexo masculino. A nota registra a forma da expressão grega.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A ordem “Em certa cidade havia um juiz” evita a repetição pouco natural de “certo” e mantém a indefinição própria da parábola.
