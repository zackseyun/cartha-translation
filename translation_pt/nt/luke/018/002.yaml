  naturalness: A redação é clara e natural em português moderno. “Certo juiz” é suficientemente idiomático em registro narrativo e preserva melhor a especificidade indefinida do grego. É necessário também fechar as aspas abertas.
  terminology: “Temia a Deus” preserva adequadamente o sentido religioso de φοβούμενος. “Não respeitava ninguém” comunica bem μὴ ἐντρεπόμενος com o singular genérico ἄνθρωπον; a nota pode indicar de modo mais preciso a formulação singular do grego.
