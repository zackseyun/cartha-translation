  source_fidelity: O texto traduz com fidelidade a oração relativa e a garantia enfática de οὐχὶ μὴ por «certamente receberá». «Muitas vezes mais» corresponde bem a πολλαπλασίονα; «neste tempo» mantém ἐν τῷ καιρῷ τούτῳ; e «na era que há de vir» preserva a distinção escatológica de ἐν τῷ αἰῶνι τῷ ἐρχομένῳ. «A vida eterna» é a tradução estabelecida e adequada de ζωὴν αἰώνιον.
  naturalness: 'A redação é natural, clara e apropriada ao português moderno de ampla compreensão: «que certamente receberá muitas vezes mais neste tempo e, na era que há de vir, a vida eterna». A abertura com «que» preserva corretamente a dependência sintática do versículo anterior.'
  terminology: «Era que há de vir» conserva o contraste entre o tempo presente e a era futura sem introduzir uma interpretação espacial ou denominacional. «Vida eterna» é terminologia bíblica portuguesa corrente e semanticamente adequada. A nota assinalada em «tempo» oferece uma alternativa lexical possível e está corretamente ancorada.
