  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: pt
  text: que certamente receberá muitas vezes mais neste tempo[a] e, na era que há de vir, a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: nesta era.'
    reason: Tradução alternativa de καιρός neste contraste escatológico; “tempo” é mais direto, enquanto “era” torna mais explícita a relação com a era que há de vir.
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: certamente
  rationale: A combinação enfática com o subjuntivo expressa uma garantia vigorosa. Em português, “certamente receberá” comunica essa certeza com naturalidade, sem reproduzir uma dupla negação artificial.
- source_word: ἀπολάβῃ
  choice: receberá
  rationale: O verbo pode significar “receber de volta” ou simplesmente “receber”. Aqui, “receberá” é natural e permite que o contexto comunique a ideia de recompensa sem acentuar demais o prefixo verbal.
- source_word: πολλαπλασίονα
  choice: muitas vezes mais
  rationale: A expressão indica uma retribuição multiplicada e abundante; “muitas vezes mais” é clara e corrente em português.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: neste tempo
  rationale: καιρός designa aqui o tempo presente em contraste com a era futura. A tradução mantém de perto a formulação grega e sua oposição temporal.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: na era que há de vir
  rationale: A expressão preserva o contraste escatológico entre o tempo presente e a ordem futura, além de refletir naturalmente o particípio ἐρχομένῳ.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a formulação portuguesa estabelecida e contextualmente adequada para a vida pertencente à era futura e de duração eterna.
- source_word: ὃς
  choice: que
  rationale: O pronome relativo retoma diretamente a pessoa descrita no versículo anterior, de modo que “que” preserva a continuidade sintática.
theological_decisions:
- issue: Expressão escatológica αἰῶνι τῷ ἐρχομένῳ
  choice: na era que há de vir
  alternative: na era vindoura; no mundo que há de vir
  rationale: “Era que há de vir” mantém o esquema neotestamentário das duas eras, sem reduzir a expressão a uma referência vaga ao futuro nem identificar indevidamente “era” com um lugar.
- issue: Força da negação enfática οὐχὶ μὴ
  choice: certamente receberá
  alternative: de modo nenhum deixará de receber
  rationale: A construção grega funciona como forte garantia de que o recebimento ocorrerá. A forma afirmativa com “certamente” preserva essa força de maneira idiomática, sem sugerir uma negação do ato de receber.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O versículo foi mantido como continuação sintática do anterior; por isso começa com “que”. A vírgula antes de “e” foi omitida por não ser necessária em português, enquanto a expressão intercalada “na era que há de vir” foi pontuada para favorecer a clareza.
