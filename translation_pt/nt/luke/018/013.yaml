  source_fidelity: 'O texto reproduz adequadamente os elementos centrais do grego: o cobrador de impostos está à distância, não quer levantar os olhos ao céu, bate no peito de modo reiterado e pede misericórdia como «o pecador». A formulação «pelo contrário», porém, é mais forte que ἀλλά, que aqui introduz simplesmente o contraste entre não erguer os olhos e bater no peito.'
  naturalness: O português é moderno, claro e digno. «Em pé à distância» e «batia repetidamente no peito» são naturais e preservam bem a postura e o aspecto imperfeito. A substituição de «pelo contrário» por «mas» torna a frase mais idiomática e mais precisa.
  terminology: «Cobrador de impostos», «tem misericórdia de mim» e «o pecador» são escolhas adequadas. A nota conserva de modo útil a alternativa ligada ao campo semântico de propiciação/expiação, sem impor uma interpretação doutrinária ao texto principal.
  issues:
