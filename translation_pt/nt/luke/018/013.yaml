    issue: «Pelo contrário» intensifica indevidamente a conjunção ἀλλά.
    rationale: No contexto, ἀλλά contrasta as ações do homem, mas não requer a ideia forte de oposição expressa por «pelo contrário». «Mas» é mais direto e fiel.
  - severity: low
    issue: Posição da chamada de nota após o ponto de exclamação.
    rationale: Como a nota explica ἱλάσθητί μοι, a chamada deve ficar diretamente associada a «tem misericórdia de mim», e não ao fim da fala ou a «o pecador».
