source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: pt
  text: 'Mas o cobrador de impostos, em pé à distância, não queria nem sequer levantar os olhos para o céu, mas batia repetidamente no peito, dizendo: “Ó Deus, tem misericórdia de mim[a], o pecador!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sê propício a mim”. O verbo está relacionado à linguagem de expiação e propiciação.'
    reason: Preservar a nuance cultual e teológica de ἱλάσκομαι sem recorrer a terminologia técnica no texto principal.
lexical_decisions:
- source_word: τελώνης
  choice: cobrador de impostos
  rationale: Equivalente moderno, claro e amplamente compreensível; evita o arcaísmo “publicano” e mantém a função social retratada no contexto.
- source_word: μακρόθεν ἑστὼς
  choice: em pé à distância
  rationale: Expressa naturalmente tanto a postura física quanto o afastamento espacial, sem explicitar além do texto a humildade sugerida pelo contexto.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: não queria nem sequer
  rationale: Preserva o valor volitivo de θέλω e a ênfase de οὐδέ em português corrente.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: levantar os olhos para o céu
  rationale: Reproduz de modo idiomático a imagem e a direção do gesto grego.
- source_word: ἔτυπτε
  choice: batia repetidamente
  rationale: Torna perceptível o aspecto imperfeito, indicando ação reiterada ou contínua.
- source_word: τὸ στῆθος αὐτοῦ
  choice: no peito
  rationale: “Peito” é a designação natural e atual em português para esse gesto de aflição e arrependimento.
- source_word: ἱλάσθητί μοι
  choice: tem misericórdia de mim
  rationale: É uma oração natural em português e comunica o pedido de favor misericordioso, enquanto a ligação lexical com expiação ou propiciação é preservada em nota.
- source_word: τῷ ἁμαρτωλῷ
  choice: o pecador
  rationale: Mantém o artigo grego e sua possível força enfática, em vez de suavizar a expressão para “um pecador”.
theological_decisions:
- issue: Sentido de ἱλάσθητί μοι no pedido dirigido a Deus
  choice: tem misericórdia de mim
  alternative: sê propício a mim; faz expiação por mim
  rationale: A formulação principal é clara e natural, sem eliminar a relação do verbo com a linguagem de expiação e propiciação, registrada na nota. Não se impõe ao verso uma elaboração doutrinária mais específica do que a forma grega exige.
- issue: Força do artigo em τῷ ἁμαρτωλῷ
  choice: o pecador
  alternative: um pecador
  rationale: A forma marcada “o pecador” conserva a autoidentificação enfática do grego e a tensão retórica da oração, embora “um pecador” seja mais convencional em português.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Ó Deus” sinaliza a invocação sem soar coloquial; o ponto e vírgula organiza o contraste. Evitou-se “publicano”, por ser arcaico ou pouco transparente, e preservou-se a expressão enfática “o pecador”.
