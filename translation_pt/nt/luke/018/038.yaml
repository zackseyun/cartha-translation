  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: pt
  text: 'E ele gritou: “Jesus, Filho de Davi[a], tem misericórdia de mim!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho de Davi” é um título messiânico que evoca o rei prometido da linhagem de Davi; também pode ser entendido, de modo mais geral, como “descendente de Davi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: gritou
  rationale: O aoristo de βοάω indica um clamor em voz alta. “Gritou” comunica de modo natural tanto o volume quanto a urgência.
- source_word: λέγων
  choice: introdução direta da fala, sem tradução separada
  rationale: Embora λέγων signifique literalmente “dizendo”, em português narrativo a construção fica mais natural com dois-pontos após “gritou”; o conteúdo da fala permanece integralmente expresso.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma vocativa do nome Ἰησοῦς, vertida conforme a forma portuguesa consagrada.
- source_word: υἱὲ Δαυίδ
  choice: Filho de Davi
  rationale: Preserva a forma do título bíblico e sua ressonância régio-messiânica, sem reduzi-lo a uma explicação meramente genealógica.
- source_word: ἐλέησόν με
  choice: tem misericórdia de mim
  rationale: Expressa a súplica direta e urgente do imperativo aoristo, usando uma formulação natural e consagrada em português.
theological_decisions:
- issue: Força messiânica de υἱὲ Δαυίδ
  choice: Filho de Davi
  alternative: descendente de Davi
  rationale: No contexto narrativo de Lucas, a expressão funciona como um título régio-messiânico dirigido a Jesus. “Filho de Davi” preserva essa força e também a forma tradicional da expressão, enquanto “descendente de Davi” explicita apenas seu sentido genealógico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta é introduzida naturalmente por dois-pontos; o clamor mantém urgência sem linguagem arcaica.
