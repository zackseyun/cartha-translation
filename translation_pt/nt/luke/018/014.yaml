id: LUK.18.14
reference: Luke 18:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: pt
  text: 'Eu lhes digo: este homem desceu para sua casa justificado, mais do que o outro[a], porque todo aquele que se exalta será humilhado, mas quem se humilha será exaltado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “justificado em comparação com o outro”; a expressão contrasta este homem com o outro homem.'
    reason: Preserva a possível formulação comparativa de παρ’ ἐκεῖνον e explica o contraste sem acrescentar que o outro “foi adorar”.
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: justificado
  rationale: O particípio perfeito passivo preserva tanto a ideia do veredito favorável de Deus quanto seu resultado contínuo, sem desenvolver no texto uma formulação teológica mais ampla.
- source_word: παρ’ ἐκεῖνον
  choice: e não o outro
  rationale: Expressa de modo natural o contraste comparativo entre o cobrador de impostos e o fariseu; a possível nuance de comparação é preservada em nota.
- source_word: κατέβη
  choice: desceu
  rationale: Mantém o movimento concreto indicado por καταβαίνω, apropriado à saída da área do templo.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: para sua casa
  rationale: Reproduz o destino e a relação possessiva de modo corrente em português.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: todo aquele que se exalta
  rationale: Transmite a máxima geral e preserva a força reflexiva do grego em português idiomático.
- source_word: ταπεινωθήσεται
  choice: será humilhado
  rationale: Mantém o futuro passivo e deixa implícito o agente, como no grego.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: mas quem se humilha
  rationale: Preserva o contraste introduzido por δέ e a ação reflexiva, com formulação natural e paralela.
- source_word: ὑψωθήσεται
  choice: será exaltado
  rationale: Mantém o futuro passivo e corresponde verbalmente a 'se exalta', destacando a inversão anunciada por Jesus.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta claramente a máxima seguinte como fundamento explicativo do veredito anterior.
- source_word: οὗτος
  choice: este homem
  rationale: Retoma de modo explícito o cobrador de impostos e reforça seu contraste com o outro participante da parábola.
theological_decisions:
- issue: Sentido de δικαιόω na conclusão da parábola
  choice: veredito divino favorável expresso por 'justificado'
  alternative: vindicado em sentido social mais amplo
  rationale: O contexto imediato apresenta os dois homens diante de Deus. 'Justificado' conserva o peso forense e resultativo do termo sem importar para o versículo um sistema doutrinário completo.
- issue: Contraste expresso por παρ’ ἐκεῖνον
  choice: '''e não o outro'' no texto, com alternativa comparativa em nota'
  alternative: '''em comparação com o outro'''
  rationale: A construção pode ser entendida como contraste excludente ou comparação. A redação principal comunica a leitura contextual mais provável, enquanto a nota preserva a nuance possível sem decidir além da evidência.
- issue: Linguagem representativa na máxima
  choice: singular genérico com formas reflexivas ('se exalta', 'se humilha')
  alternative: formulação explícita no plural
  rationale: O português permite conservar naturalmente a estrutura singular geral do grego sem restringir a aplicação da máxima a um sexo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a imagem concreta de descer do templo, o vocabulário teológico tradicional de 'justificado' e o paralelismo entre exaltação e humilhação.
