  text: Then those who heard it said, “And who can be saved?”
translation:
  language: pt
  text: 'Então os que ouviram disseram: “E quem pode ser salvo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: disseram
  rationale: O aoristo indicativo tem valor narrativo pontual e é expresso naturalmente pelo pretérito perfeito.
- source_word: δὲ
  choice: Então
  rationale: A partícula marca progressão narrativa e transição; “Então” preserva essa função com fluidez em português.
- source_word: οἱ ἀκούσαντες
  choice: os que ouviram
  rationale: O particípio aoristo substantivado identifica as pessoas que ouviram a declaração anterior de Jesus; o objeto fica naturalmente implícito em português.
- source_word: Καὶ
  choice: E
  rationale: Mantém a força conectiva e o tom de reação surpresa presentes na pergunta grega.
- source_word: τίς
  choice: quem
  rationale: Equivalente direto do pronome interrogativo, sem acrescentar ênfase ausente do texto.
- source_word: δύναται
  choice: pode
  rationale: Expressa de modo conciso e natural a ideia de capacidade ou possibilidade.
- source_word: σωθῆναι
  choice: ser salvo
  rationale: O infinitivo aoristo passivo, no contexto da entrada no Reino, tem sentido soteriológico, adequadamente expresso por “ser salvo”.
theological_decisions:
- issue: Sentido de σωθῆναι no contexto
  choice: ser salvo
  alternative: ser resgatado; ser liberto
  rationale: O contexto imediato trata da entrada no Reino de Deus e da possibilidade da salvação, não de um resgate meramente físico; a tradução preserva esse sentido sem especificar além do texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A construção conserva os dois conectivos gregos sem tornar a frase artificial.
