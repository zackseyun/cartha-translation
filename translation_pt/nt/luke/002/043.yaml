base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: pt
  text: Quando terminaram os dias, enquanto voltavam, o menino Jesus permaneceu[a] em Jerusalém, e seus pais[b] não o souberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou para trás”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “seus pais”. A linguagem familiar comum de Lucas aqui não nega a concepção virginal apresentada anteriormente no Evangelho.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: quando terminaram os dias da festa
  rationale: A construção absoluta apresenta uma circunstância concluída antes da ação principal. A expressão “da festa” explicita de modo natural em português o referente contextual dos “dias”, sem definir além do texto qual era sua duração.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: enquanto voltavam
  rationale: O infinitivo articular com ἐν indica ação simultânea e em andamento; “enquanto voltavam” reproduz essa relação temporal com naturalidade.
- source_word: ὑπέμεινεν
  choice: permaneceu
  rationale: Neste contexto, o verbo significa permanecer ou ficar para trás. “Permaneceu” conserva o sentido básico, enquanto a alternativa contextual é registrada em nota.
- source_word: ὁ παῖς
  choice: o menino Jesus
  rationale: παῖς pode designar criança, menino ou jovem. Como Jesus tem doze anos no contexto imediato, “menino” é uma escolha natural e apropriada à idade.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Trata-se do uso locativo comum de ἐν com nome de lugar.
- source_word: οὐκ ἔγνωσαν
  choice: não perceberam isso
  rationale: Aqui γινώσκω expressa perceber ou tomar conhecimento de um fato. O pronome “isso” torna explícito em português que os pais não perceberam que Jesus havia permanecido em Jerusalém.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: seus pais
  rationale: γονεῖς significa diretamente “pais”; a tradução preserva a linguagem familiar comum empregada por Lucas.
theological_decisions:
- issue: A referência a Maria e José como οἱ γονεῖς αὐτοῦ
  choice: seus pais
  alternative: seu pai e sua mãe
  rationale: O grego diz explicitamente “seus pais”. Essa linguagem familiar comum deve ser preservada, sem harmonização, e não anula a concepção virginal narrada anteriormente no Evangelho.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. “Enquanto voltavam” mantém a simultaneidade, e “o menino Jesus” é natural para a idade indicada no contexto. A conjunção “mas” expressa em português o contraste narrativo implícito na sequência coordenada.
