  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: pt
  text: Quando o viram, deram a conhecer a mensagem[a] que lhes havia sido comunicada a respeito deste menino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a palavra»; ou ainda: «o que lhes havia sido dito».'
    reason: Preservar as alternativas lexicais de ῥῆμα, que pode significar palavra, declaração, dito ou mensagem.
lexical_decisions:
- source_word: ἰδόντες
  choice: Quando o viram
  rationale: O particípio aoristo tem valor temporal e indica uma ação anterior à ação principal. O pronome «o», suprido em português, retoma naturalmente o menino visto pelos pastores no contexto imediato.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui δέ é um conectivo narrativo leve. A sequência já flui naturalmente em português sem a necessidade de acrescentar «e» ou «então».
- source_word: ἐγνώρισαν
  choice: deram a conhecer
  rationale: Preserva o sentido de tornar algo conhecido ou divulgá-lo, sem sugerir indevidamente um anúncio formal.
- source_word: περὶ τοῦ ῥήματος
  choice: a mensagem
  rationale: Neste contexto, ῥῆμα se refere ao conteúdo comunicado aos pastores acerca do menino. «Mensagem» é claro e corrente, enquanto a nota preserva alternativas mais formais.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: que lhes havia sido comunicada
  rationale: Mantém a voz passiva e a anterioridade da comunicação em relação ao relato dos pastores, em linguagem portuguesa natural.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: a respeito daquele menino
  rationale: παιδίον designa a criança; «menino» é natural no contexto. «Daquele» funciona idiomaticamente em português ao remeter ao menino que os pastores acabavam de ver.
theological_decisions:
- issue: Sentido de ῥῆμα na referência ao anúncio angelical
  choice: mensagem
  alternative: palavra; declaração; o que lhes havia sido dito
  rationale: O termo aponta para o conteúdo anteriormente comunicado aos pastores. «Mensagem» expressa esse sentido sem acrescentar uma conotação doutrinária específica, e a nota conserva a amplitude lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «deram a conhecer» mantém proximidade com o grego sem soar arcaica; «havia sido comunicada» evita a rigidez de «havia sido falada».
