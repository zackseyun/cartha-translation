id: LUK.2.22
reference: Luke 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: pt
  text: E, quando se completaram os dias da purificação deles[a], segundo a Lei de Moisés, levaram-no a Jerusalém para apresentá-lo ao Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “da purificação dela” em vez de “da purificação deles”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: se completaram
  rationale: O passivo, aplicado a um período, indica que os dias chegaram ao fim. Em português, “se completaram” preserva de modo natural essa nuance temporal.
- source_word: καθαρισμοῦ
  choice: purificação
  rationale: Neste contexto, refere-se à purificação ritual prescrita após o parto; “purificação” mantém com clareza o registro legal e religioso.
- source_word: αὐτῶν
  choice: deles
  rationale: O texto grego fornecido traz o pronome plural αὐτῶν. A tradução conserva o número gramatical sem harmonizá-lo silenciosamente com Levítico 12.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: segundo a Lei de Moisés
  rationale: Expressa conformidade com a prescrição mosaica. “Segundo” é corrente e mantém o tom jurídico; “Lei” recebe inicial maiúscula por designar o corpo legal mosaico.
- source_word: ἀνήγαγον
  choice: levaram-no
  rationale: O verbo pode conter a ideia de subir a Jerusalém, mas “levaram-no a Jerusalém” é a formulação portuguesa mais natural; o destino preserva o movimento essencial sem tornar a frase pesada.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa estabelecida do topônimo.
- source_word: παραστῆσαι
  choice: para apresentá-lo
  rationale: No contexto cultual e legal, significa apresentar alguém diante de Deus. Esta opção é clara, digna e tradicional sem ser arcaica.
- source_word: κυρίῳ
  choice: ao Senhor
  rationale: κύριος designa aqui Deus no contexto reverente e pactual; “Senhor” é a equivalência portuguesa apropriada.
theological_decisions:
- issue: Número do pronome em “os dias da purificação deles”
  choice: Manter o plural “deles” no texto principal
  alternative: “da purificação dela”
  rationale: A edição SBLGNT fornecida lê αὐτῶν (“deles”). Embora o singular se alinhe mais diretamente à legislação de Levítico 12 e apareça em alguns manuscritos, a tensão não deve ser resolvida por harmonização; a variante singular fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a estrutura coordenada e o tom legal-ritual do grego. A colocação pronominal “levaram-no” e “apresentá-lo” mantém um registro escrito natural. O marcador [a] aparece imediatamente após “Lei de Moisés”, acompanhando a posição do texto de consulta, embora a nota trate especificamente do pronome anterior.
