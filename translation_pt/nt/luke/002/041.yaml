  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: pt
  text: Todos os anos, os pais de Jesus iam a Jerusalém para a Festa da Páscoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: iam
  rationale: O imperfeito indica uma ação habitual no passado; em português, “iam”, junto de “todos os anos”, expressa isso de modo natural.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: os pais de Jesus
  rationale: γονεῖς significa diretamente “pais”. O referente explícito “de Jesus” evita uma possível ambiguidade pronominal em português sem acrescentar conteúdo ao texto.
- source_word: κατ’ ἔτος
  choice: todos os anos
  rationale: A expressão distributiva significa “a cada ano”; “todos os anos” é idiomático, claro e preserva a ideia de costume anual.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome da cidade.
- source_word: τῇ ἑορτῇ
  choice: para a Festa
  rationale: No contexto do verbo de movimento, o dativo apresenta a festa como ocasião ou finalidade da viagem; “para” comunica isso naturalmente.
- source_word: τοῦ πάσχα
  choice: da Páscoa
  rationale: πάσχα designa aqui a festa judaica da Páscoa; a forma definida é natural em português.
theological_decisions:
- issue: Referência aos familiares de Jesus
  choice: os pais de Jesus
  alternative: seu pai e sua mãe
  rationale: O grego emprega o termo comum “pais”. Mantê-lo preserva o sentido narrativo sem tentar resolver ou negar implicações relacionadas à concepção virginal afirmada em outro trecho de Lucas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A ordem da frase foi ajustada para destacar naturalmente a frequência habitual.
