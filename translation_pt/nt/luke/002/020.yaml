id: LUK.2.20
reference: Luke 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: pt
  text: E os pastores voltaram, glorificando e louvando a Deus por tudo o que tinham ouvido e visto, exatamente como lhes havia sido dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “assim como lhes foi falado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: O aoristo de ὑποστρέφω indica que os pastores retornaram ao lugar ou à atividade anterior; “voltaram” é natural e claro em português.
- source_word: οἱ ποιμένες
  choice: os pastores
  rationale: Equivalente direto e corrente para ποιμένες no contexto narrativo.
- source_word: δοξάζοντες καὶ αἰνοῦντες
  choice: glorificando e louvando
  rationale: Mantém os dois particípios coordenados e sua distinção semântica, apresentando-os como ações concomitantes ao retorno.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: Objeto de ambos os particípios; a regência portuguesa pede a preposição em “louvar/glorificar a Deus” neste uso.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: por tudo o que
  rationale: ἐπί com dativo expressa aqui a razão ou ocasião do louvor; “por tudo o que” é idiomático e preserva esse valor.
- source_word: ἤκουσαν καὶ εἶδον
  choice: tinham ouvido e visto
  rationale: O mais-que-perfeito composto explicita naturalmente em português que ouvir e ver precederam o retorno e o louvor, sem alterar o sentido dos aoristos.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: exatamente como lhes havia sido dito
  rationale: Preserva a correspondência expressa por καθώς e a voz passiva, deixando implícito o agente da fala, como no grego.
theological_decisions:
- issue: Se deve ser identificado explicitamente quem lhes havia falado
  choice: 'Manter o agente implícito: “como lhes havia sido dito”'
  alternative: “como o anjo lhes havia dito”
  rationale: Embora o contexto aponte para a mensagem angelical, a cláusula grega está na voz passiva e não nomeia o agente; a tradução não acrescenta essa identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Exatamente como” comunica com naturalidade a conformidade marcada por καθώς. O marcador [a] aparece no texto junto à cláusula a que se refere.
