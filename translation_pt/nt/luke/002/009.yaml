source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: pt
  text: E um anjo do Senhor pôs-se junto deles[a], e a glória do Senhor resplandeceu ao redor deles, e eles ficaram tomados de grande temor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chegou de repente até eles» ou «apresentou-se diante deles». O verbo grego pode indicar tanto uma chegada súbita quanto o ato de ficar junto de alguém.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «temeram um grande temor», expressão idiomática que comunica medo intenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: um anjo do Senhor
  rationale: No contexto narrativo, ἄγγελος designa um ser celestial. A construção sem artigo é naturalmente indefinida, e κυρίου é preservado como «do Senhor».
- source_word: ἐπέστη αὐτοῖς
  choice: pôs-se junto deles
  rationale: O verbo ἐφίστημι pode indicar tanto a chegada súbita quanto a presença ao lado de alguém. A tradução mantém a imagem concreta sem reduzir o sentido a uma simples aparição.
- source_word: δόξα κυρίου
  choice: a glória do Senhor
  rationale: Preserva diretamente o peso teológico de δόξα, que neste contexto inclui a manifestação luminosa da majestade divina.
- source_word: περιέλαμψεν αὐτούς
  choice: resplandeceu ao redor deles
  rationale: περιλάμπω descreve luz que brilha em volta ou envolve. «Resplandeceu ao redor» é claro, digno e próximo da imagem grega.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ficaram tomados de grande temor
  rationale: A construção com verbo e substantivo cognato intensifica o medo. Esta formulação comunica terror intenso em português natural, sem a estranheza de reproduzir literalmente o idioma grego.
theological_decisions:
- issue: Tradução de κύριος nas duas expressões genitivas
  choice: Senhor
  alternative: Mestre
  rationale: O referente é divino, e «Senhor» preserva o uso bíblico e a força teológica do título sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «e» acompanha o encadeamento narrativo do grego; «temor» conserva o tom solene, enquanto a nota registra a forma idiomática literal.
