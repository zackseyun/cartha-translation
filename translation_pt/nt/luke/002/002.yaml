  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: pt
  text: Este recenseamento ocorreu primeiro enquanto Quirino governava a Síria[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Este recenseamento ocorreu antes de Quirino governar a Síria». Alguns entendem aqui «primeiro» em sentido temporal comparativo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «registro». O termo grego se refere a uma inscrição oficial, muitas vezes ligada à tributação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Este
  rationale: O demonstrativo retoma o recenseamento mencionado no versículo anterior; «este» é natural e mantém a referência explícita.
- source_word: ἀπογραφή
  choice: recenseamento
  rationale: O termo designa um registro oficial da população, muitas vezes ligado à tributação. «Recenseamento» é claro em português e conserva o caráter administrativo; «registro» permanece possível.
- source_word: πρώτη
  choice: primeiro
  rationale: Mantém o sentido ordinal mais direto do grego e sua relação adverbial natural com «ocorreu», sem eliminar a interpretação temporal comparativa discutida, registrada em nota.
- source_word: ἐγένετο
  choice: ocorreu
  rationale: Expressa de modo corrente e digno a realização do evento administrativo.
- source_word: ἡγεμονεύοντος
  choice: enquanto ... governava
  rationale: Preserva a circunstância contemporânea do genitivo absoluto sem impor a Quirino um título oficial mais específico do que o verbo grego exige.
- source_word: τῆς Συρίας
  choice: a Síria
  rationale: Forma geográfica padrão em português, com artigo natural após «governava».
- source_word: Κυρηνίου
  choice: Quirino
  rationale: Forma tradicional e amplamente reconhecida em português para o nome Κυρήνιος.
theological_decisions:
- issue: Interpretação de πρώτη numa oração histórica e sintaticamente debatida
  choice: 'Traduzir πρώτη como «primeiro» no texto principal: «Este recenseamento ocorreu primeiro enquanto Quirino governava a Síria».'
  alternative: «Este recenseamento ocorreu antes de Quirino governar a Síria»; ou «Este foi o primeiro recenseamento realizado quando Quirino governava a Síria».
  rationale: O sentido ordinal é o mais direto, mas a construção e sua relação com a cronologia histórica são discutidas. A tradução principal não resolve silenciosamente a questão, e a leitura comparativa temporal é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «Recenseamento» é corrente e preciso; a sintaxe conserva de propósito a ambiguidade debatida de πρώτη.
