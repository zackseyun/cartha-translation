  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: pt
  text: E o menino crescia e se fortalecia, sendo cheio de sabedoria; e o favor de Deus estava sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a graça de Deus estava sobre ele”.'
    reason: Alternativa lexical para χάρις θεοῦ.
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: E o menino
  rationale: παιδίον designa uma criança; neste resumo posterior ao relato da infância, “menino” soa natural em português. δέ funciona como conexão narrativa leve, vertida por “E”.
- source_word: ηὔξανεν
  choice: crescia
  rationale: O imperfeito de αὐξάνω apresenta crescimento contínuo; o pretérito imperfeito português preserva esse aspecto.
- source_word: ἐκραταιοῦτο
  choice: se fortalecia
  rationale: O imperfeito médio/passivo expressa fortalecimento progressivo. “Se fortalecia” mantém tanto o desenvolvimento quanto a forma reflexiva natural em português.
- source_word: πληρούμενον σοφίᾳ
  choice: enchendo-se de sabedoria
  rationale: O particípio presente indica um processo concomitante e contínuo; o dativo σοφίᾳ indica aquilo de que o menino se enchia.
- source_word: χάρις θεοῦ
  choice: o favor de Deus
  rationale: χάρις pode significar graça ou favor. Neste retrato narrativo da benevolência divina sobre o menino, “favor” é claro e idiomático, sem eliminar a alternativa lexical “graça”.
- source_word: ἦν ἐπ’ αὐτό
  choice: estava sobre ele
  rationale: A construção indica a presença do favor divino sobre alguém. “Estava sobre ele” preserva a imagem e o tom elevado sem acrescentar a noção interpretativa de que ‘repousava’.
theological_decisions:
- issue: Sentido de χάρις θεοῦ no contexto do desenvolvimento humano de Jesus
  choice: o favor de Deus
  alternative: a graça de Deus
  rationale: “Favor” comunica a benevolência e a presença aprovadora de Deus no contexto narrativo, enquanto “graça” continua sendo uma tradução lexical legítima. A alternativa é preservada em nota, sem resolver indevidamente a amplitude do termo grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com pretéritos imperfeitos para refletir o desenvolvimento contínuo expresso no grego. A pontuação com ponto e vírgula organiza as duas descrições coordenadas sem tornar o período pesado.
