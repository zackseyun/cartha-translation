source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: pt
  text: e viúva, até os oitenta e quatro anos[a]. Ela não se afastava do templo[b], servindo a Deus com jejuns e súplicas[c], noite e dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e viúva por oitenta e quatro anos”. O grego pode indicar tanto a idade de Ana quanto a duração de sua viuvez.'
    reason: alternative_reading
  - marker: b
    text: A palavra grega designa o conjunto ou recinto do templo, não especificamente o santuário interior.
    reason: cultural_note
  - marker: c
    text: 'Ou: “orações” ou “petições”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: viúva
  rationale: Sentido comum de uma mulher cujo marido morreu; dá continuidade à descrição da condição de Ana após o casamento.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: até os oitenta e quatro anos
  rationale: A construção grega é condensada e pode indicar a idade de Ana ou a duração de sua viuvez. O texto principal adota a leitura de idade por ser natural em português, preservando a outra possibilidade em nota.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: não se afastava do templo
  rationale: O imperfeito expressa conduta habitual e contínua. A formulação portuguesa conserva essa ideia sem exigir que Ana residisse literalmente no recinto.
- source_word: ἱεροῦ
  choice: templo
  rationale: ἱερόν designa o conjunto ou recinto do templo, não especificamente o santuário interior; 'templo' é a forma corrente, com a precisão registrada em nota.
- source_word: νηστείαις
  choice: com jejuns
  rationale: O plural preserva a referência a práticas repetidas de jejum e o dativo indica o modo pelo qual ela prestava culto.
- source_word: δεήσεσιν
  choice: súplicas
  rationale: δέησις enfatiza pedidos insistentes ou petições dirigidas a Deus; 'súplicas' é natural e semanticamente mais específico que o termo geral 'orações'.
- source_word: λατρεύουσα
  choice: adorava a Deus
  rationale: No contexto religioso, λατρεύω descreve serviço cultual prestado a Deus. O objeto implícito é explicitado em português para clareza, sem acrescentar uma identificação controvertida.
- source_word: νύκτα καὶ ἡμέραν
  choice: noite e dia
  rationale: Mantém a ordem grega e comunica dedicação habitual e contínua em expressão natural portuguesa.
theological_decisions:
- issue: A idade de Ana ou a duração de sua viuvez
  choice: O texto principal entende que Ana permaneceu viúva até completar oitenta e quatro anos.
  alternative: A expressão pode significar que Ana já era viúva havia oitenta e quatro anos.
  rationale: A sintaxe grega permite as duas leituras. A alternativa é mantida em nota para preservar a ambiguidade histórica e exegética sem transformá-la em questão doutrinária.
- issue: Sentido cultual de λατρεύουσα
  choice: adorava a Deus
  alternative: servia a Deus em culto
  rationale: Ambas refletem o serviço religioso expresso pelo verbo. 'Adorava a Deus' é claro e corrente, enquanto a alternativa explicita mais diretamente a nuance de serviço cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase continua sintaticamente o versículo anterior. 'Não se afastava' conserva o aspecto habitual do imperfeito; 'com jejuns e súplicas' mantém os plurais gregos e o caráter devocional da atividade.
