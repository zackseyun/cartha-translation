source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: pt
  text: E eis que havia em Jerusalém um homem chamado Simeão. Esse homem era justo e piedoso, esperava a consolação de Israel[a], e o Espírito Santo estava sobre ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o conforto de Israel». A expressão refere-se ao esperado consolo divino e à restauração de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, «um espírito santo estava sobre ele»; contudo, no contexto de Lucas, a referência mais natural é ao Espírito Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador narrativo vívido de Lucas em linguagem bíblica ainda compreensível, chamando a atenção para a entrada de Simeão na narrativa.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: O referente é Simeão, um indivíduo do sexo masculino; por isso, a tradução específica é natural e exata.
- source_word: ᾧ ὄνομα Συμεών
  choice: chamado Simeão
  rationale: Expressa de modo idiomático e conciso a construção identificadora grega.
- source_word: δίκαιος
  choice: justo
  rationale: Mantém o sentido moral e pactual da descrição de Simeão e é a formulação natural em português.
- source_word: εὐλαβής
  choice: piedoso
  rationale: Comunica reverência a Deus e prática religiosa cuidadosa em português corrente e digno.
- source_word: προσδεχόμενος
  choice: esperava
  rationale: O imperfeito em português, no contexto da caracterização, comunica a atitude contínua de expectativa expressa pelo particípio presente.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: a consolação de Israel
  rationale: Preserva a ressonância bíblica da esperança pelo consolo divino e pela restauração de Israel; «conforto» também é lexicalmente possível.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: Embora a expressão grega esteja sem artigo, o uso de Lucas e o contexto imediato, sobretudo os versículos 26–27, favorecem a referência definida ao Espírito Santo.
- source_word: ἐπ’ αὐτόν
  choice: estava sobre ele
  rationale: Reproduz naturalmente a imagem bíblica da presença do Espírito sem acrescentar especificamente a ideia de repouso ou capacitação.
theological_decisions:
- issue: Referente de πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: o Espírito Santo estava sobre ele
  alternative: um espírito santo estava sobre ele
  rationale: O grego admite formalmente uma leitura indefinida, mas o padrão narrativo de Lucas e a sequência imediata apontam mais naturalmente para o Espírito Santo. A alternativa permanece registrada em nota para preservar a possibilidade gramatical.
- issue: Sentido de παράκλησις τοῦ Ἰσραήλ
  choice: a consolação de Israel
  alternative: o conforto de Israel
  rationale: «Consolação» mantém tanto o consolo prometido por Deus quanto a esperança mais ampla de restauração, sem definir além do que a expressão permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «E eis que» conserva a vivacidade do marcador narrativo sem tornar toda a frase excessivamente arcaica. A pontuação divide o longo período grego para favorecer a leitura natural. Os marcadores [a] e [b] aparecem junto às expressões a que se referem.
