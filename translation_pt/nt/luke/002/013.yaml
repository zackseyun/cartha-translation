  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: pt
  text: 'E, de repente, houve com o anjo uma multidão do exército celestial[a], louvando a Deus e dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da hoste celestial” ou “do exército do céu”.
    reason: Alternativas lexicais para στρατιᾶς οὐρανίου, expressão que designa o exército ou a hoste do céu.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: de repente
  rationale: Expressa a irrupção súbita da cena em português natural e preserva a surpresa narrativa.
- source_word: ἐγένετο
  choice: apareceu
  rationale: Neste contexto existencial e narrativo, introduz a presença repentina da multidão. “Apareceu” é natural em português, embora torne explícita a manifestação sugerida pela cena.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: com o anjo
  rationale: Traduz diretamente a ideia de acompanhamento expressa por σύν com o dativo.
- source_word: πλῆθος
  choice: uma multidão
  rationale: Conserva a ênfase em um número muito grande e mantém o tom elevado da narrativa.
- source_word: στρατιᾶς οὐρανίου
  choice: do exército celestial
  rationale: Preserva tanto a referência ao céu quanto a imagem militar de στρατιά, em linguagem clara para leitores modernos.
- source_word: αἰνούντων τὸν θεόν
  choice: louvando a Deus
  rationale: Reproduz de modo direto o particípio presente e seu objeto, descrevendo a atividade contínua da multidão.
- source_word: καὶ λεγόντων
  choice: e dizendo
  rationale: Mantém a coordenação dos particípios e introduz naturalmente as palavras do versículo seguinte.
theological_decisions:
- issue: Tradução de στρατιᾶς οὐρανίου
  choice: do exército celestial
  alternative: da hoste celestial; do exército do céu
  rationale: A escolha conserva a dimensão militar e ordenada da expressão sem transformar a cena em combate; os seres estão aqui louvando a Deus. A nota registra formulações alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Exército celestial” comunica a imagem grega mais imediatamente do que “hoste celestial”, que permanece na nota por seu uso bíblico tradicional.
