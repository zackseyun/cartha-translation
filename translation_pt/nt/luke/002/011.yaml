id: LUK.2.11
reference: Luke 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: pt
  text: porque hoje, na cidade de Davi, nasceu para vocês um Salvador, que é o Messias, o Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais tradicional, “Cristo, o Senhor”. Os títulos gregos são χριστὸς κύριος, literalmente “Messias Senhor”, geralmente entendidos como “o Messias, o Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão ou o conteúdo explicativo do anúncio angélico anterior, de modo natural em português.
- source_word: ἐτέχθη
  choice: nasceu
  rationale: O aoristo passivo de τίκτω é expresso idiomaticamente em português pelo verbo intransitivo “nascer” no pretérito perfeito.
- source_word: ὑμῖν
  choice: para vocês
  rationale: 'O dativo indica benefício: o nascimento traz boas-novas em favor dos ouvintes. A expressão é clara e amplamente compreensível.'
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto, atual e natural.
- source_word: σωτὴρ
  choice: Salvador
  rationale: Preserva tanto a ideia de livramento como o peso régio e teológico do título neste contexto.
- source_word: ὅς ἐστιν
  choice: que é
  rationale: Mantém a oração relativa que identifica o Salvador por meio dos títulos seguintes.
- source_word: χριστὸς
  choice: Messias
  rationale: Aqui Χριστός funciona como título ligado à expectativa davídica, não simplesmente como nome próprio.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente consagrado que preserva a autoridade e a forte carga teológica do título.
- source_word: ἐν πόλει Δαυίδ
  choice: na cidade de Davi
  rationale: Reprodução natural da expressão grega, mantendo sua associação davídica e sua referência contextual a Belém.
theological_decisions:
- issue: Interpretação de χριστὸς κύριος
  choice: o Messias, o Senhor
  alternative: Cristo, o Senhor; o Messias do Senhor
  rationale: Os dois nominativos são mais naturalmente entendidos como títulos em aposição que identificam o Salvador. “Messias” comunica o sentido titular de Χριστός; “Senhor” preserva κύριος. A formulação não elimina totalmente a concisão incomum do grego, registrada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A colocação de “na cidade de Davi” antes do verbo evita uma sequência pouco natural sem alterar seu alcance. “Para vocês” explicita o valor benefactivo do dativo e mantém o anúncio dirigido aos pastores.
