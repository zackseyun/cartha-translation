  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: pt
  text: E todos os que o ouviam ficavam admirados com a sua compreensão e com as suas respostas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “maravilhados”. O verbo grego pode expressar forte espanto ou admiração.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ficavam admirados
  rationale: O imperfeito descreve uma reação contínua, e a expressão transmite forte admiração em português natural sem recorrer a um idiomatismo excessivo.
- source_word: δὲ
  choice: E
  rationale: δέ funciona aqui como conectivo narrativo leve; “E” mantém a continuidade do relato sem sugerir contraste forte.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: todos os que o ouviam
  rationale: Preserva o alcance universal de πάντες e o aspecto contínuo do particípio presente em formulação corrente.
- source_word: ἐπὶ τῇ συνέσει
  choice: com a sua compreensão
  rationale: Neste contexto, ἐπί com dativo indica o motivo da reação; “com” é idiomático após “admirados”, e “compreensão” expressa a capacidade de entender demonstrada por Jesus.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: com as suas respostas
  rationale: “Respostas” corresponde diretamente ao contexto dialogal e a repetição de “com” dá clareza natural aos dois motivos da admiração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O imperfeito foi mantido em “ouviam” e “ficavam”, refletindo a cena em andamento.
