  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: pt
  text: Quando se completaram os oito dias para circuncidá-lo[a], foi-lhe dado o nome de Jesus[b], o nome anunciado pelo anjo antes de ele ser concebido no ventre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando se completaram oito dias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “seu nome foi chamado Jesus”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, antes de ser concebido no ventre de Maria.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: quando se completaram os oito dias
  rationale: Reproduz o sentido completivo da expressão grega em português natural, mantendo o sabor formal da construção de Lucas.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: para circuncidá-lo
  rationale: Expressa de modo claro e direto a finalidade indicada pelo infinitivo articular com τοῦ.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: foi-lhe dado o nome de Jesus
  rationale: É a formulação idiomática em português para o ato de nomear, preservando a voz passiva e a menção explícita ao nome.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Emprega a forma tradicional e universalmente reconhecida do nome no Novo Testamento em português.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: o nome indicado pelo anjo
  rationale: Torna explícito que o particípio retoma 'nome' e comunica naturalmente que o anjo havia determinado ou anunciado esse nome; evita a repetição pouco idiomática de 'chamado'.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: antes de ele ser concebido
  rationale: Traduz com clareza o infinitivo aoristo passivo e mantém a referência à concepção humana de Jesus sem acréscimo doutrinário.
- source_word: ἐν τῇ κοιλίᾳ
  choice: no ventre
  rationale: Neste contexto, 'ventre' designa naturalmente o ventre materno e preserva a concisão do grego.
theological_decisions:
- issue: A cláusula da concepção em relação à cristologia
  choice: antes de ele ser concebido no ventre
  alternative: antes da sua concepção no ventre
  rationale: A redação afirma simplesmente a concepção humana de Jesus, conforme o grego, sem introduzir terminologia ou explicações cristológicas que o versículo não apresenta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção principal privilegia naturalidade sem apagar a passividade do texto grego; as alternativas mais literais ficam registradas nas notas.
