id: LUK.2.39
reference: Luke 2:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: pt
  text: E, quando terminaram tudo conforme a Lei do Senhor[a], voltaram para a Galileia, para a sua própria cidade[b], Nazaré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que a Lei do Senhor exigia”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode designar uma localidade ou povoado; Nazaré era um assentamento pequeno.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: quando
  rationale: Introduz temporalmente a ação que antecede o retorno; “quando” é natural e não acentua uma imediatidade que o grego não exige.
- source_word: ἐτέλεσαν
  choice: terminaram
  rationale: Expressa levar à conclusão os atos prescritos, sem a possível conotação profética ou teológica de “cumpriram”.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: tudo conforme a Lei do Senhor
  rationale: Mantém de perto a construção grega e permite tanto a ideia de conformidade quanto, por implicação, a de exigências legais, sem explicitar além do texto.
- source_word: νόμον κυρίου
  choice: a Lei do Senhor
  rationale: Conserva a formulação bíblica e identifica a lei divina; a inicial maiúscula em “Lei” ajuda a indicar o corpo legal das Escrituras neste contexto.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente normal de κύριος e, neste contexto, refere-se a Deus sem substituir o termo grego por uma representação do Tetragrama.
- source_word: ἐπέστρεψαν
  choice: voltaram
  rationale: É a forma corrente e clara de expressar retorno em uma narrativa de viagem.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: Traduz naturalmente o destino indicado por εἰς.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: para a sua própria cidade
  rationale: Preserva tanto πόλις, “cidade”, quanto a ênfase possessiva de ἑαυτῶν. Uma nota esclarece que Nazaré era um povoado pequeno.
- source_word: Ναζαρέθ
  choice: Nazaré
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
theological_decisions:
- issue: Referente de “Senhor” em “Lei do Senhor”
  choice: “Senhor” refere-se a Deus, cuja lei está registrada nas Escrituras.
  alternative: Não há alternativa relevante com consequência teológica neste contexto.
  rationale: A expressão pertence ao uso judaico e bíblico comum; a tradução direta ressalta a observância da família sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Terminaram” evita a carga potencial de “cumpriram”; “sua própria cidade” preserva formalmente o grego, com esclarecimento histórico na nota.
