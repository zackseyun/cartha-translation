  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: pt
  text: E todos iam se registrar, cada um à sua própria cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: iam
  rationale: O imperfeito expressa movimento em andamento no cenário narrativo; “iam” preserva esse aspecto de modo natural em português.
- source_word: πάντες
  choice: todos
  rationale: Equivalente direto e idiomático que conserva o sentido abrangente do plural grego.
- source_word: ἀπογράφεσθαι
  choice: se registrar
  rationale: No contexto do recenseamento, o infinitivo indica comparecer para registro oficial. “Se registrar” é claro e atual; a forma média/passiva também pode ser entendida como “ser registrado”.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a força distributiva, destacando a ação individual dentro da totalidade.
- source_word: ἑαυτοῦ
  choice: sua própria
  rationale: O reflexivo possessivo retoma “cada um”; em português, “sua própria” concorda com “cidade” e preserva a ideia de pertencimento sem tornar o gênero do referente explícito.
- source_word: πόλιν
  choice: cidade
  rationale: É o equivalente usual de πόλις e evita acrescentar a interpretação “cidade natal” ou “cidade de origem”, ausente do termo grego.
theological_decisions:
- issue: Expressão distributiva com ἕκαστος ... ἑαυτοῦ
  choice: “cada um em sua própria cidade”
  alternative: “cada qual à sua cidade”
  rationale: A formulação preserva o singular distributivo do grego. Como o possessivo português concorda gramaticalmente com “cidade”, não é necessário introduzir um pronome masculino para representar com fidelidade a construção.
- issue: Natureza da cidade mencionada
  choice: “cidade”
  alternative: “cidade natal” ou “cidade de origem”
  rationale: O texto diz apenas πόλις. A tradução não explicita se se trata da cidade natal, ancestral ou de outro vínculo administrativo, preservando a concisão e a possível tensão histórica do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase acompanha de perto o grego sem soar artificial. Não há marcadores de nota porque nenhuma nota é necessária para comunicar adequadamente as alternativas relevantes neste versículo.
