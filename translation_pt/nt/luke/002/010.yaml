id: LUK.2.10
reference: Luke 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: pt
  text: 'E o anjo lhes disse: “Não tenham medo, pois eis que lhes anuncio uma boa notícia de grande alegria, que será para todo o povo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para todas as pessoas”. O grego diz mais literalmente “para todo o povo” e, neste contexto, pode se referir de modo definido ao povo de Israel.'
    reason: Leitura alternativa quanto ao alcance de παντὶ τῷ λαῷ.
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: o anjo
  rationale: O artigo retoma o anjo já apresentado no contexto, por isso a forma definida é a mais precisa.
- source_word: Μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: É uma proibição dirigida a várias pessoas; esta formulação é natural no português moderno e preserva o sentido.
- source_word: ἰδοὺ γὰρ
  choice: pois eis que
  rationale: “Pois” expressa a relação explicativa de γάρ, e “eis que” conserva a função enfática e o tom solene de ἰδού.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: lhes anuncio uma boa notícia
  rationale: Expressa naturalmente o ato de comunicar boas novas aos pastores, sem impor ao verbo um sentido técnico posterior.
- source_word: χαρὰν μεγάλην
  choice: grande alegria
  rationale: Reproduz de modo claro e idiomático a intensidade da expressão grega.
- source_word: ἥτις ἔσται
  choice: que será
  rationale: Mantém a ligação relativa com “grande alegria” e o valor futuro do verbo.
- source_word: παντὶ τῷ λαῷ
  choice: para todo o povo
  rationale: Preserva o artigo definido e a referência coletiva de λαός, que no contexto imediato provavelmente aponta para o povo de Israel, sem impedir o desenvolvimento universal posterior em Lucas.
theological_decisions:
- issue: Alcance de παντὶ τῷ λαῷ
  choice: para todo o povo
  alternative: para todos os povos; para todas as pessoas
  rationale: A construção grega traz λαός no singular com artigo definido e, no contexto narrativo imediato, provavelmente se refere ao povo de Israel. A tradução conserva essa definição e evita universalizar antecipadamente o versículo, sem negar a inclusão posterior das nações na obra lucana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “tenham” e o pronome “lhes” refletem os destinatários plurais; “eis que” mantém a ênfase narrativa sem tornar o restante da frase arcaico.
