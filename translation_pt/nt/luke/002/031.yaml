  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: pt
  text: que preparaste diante de todos os povos[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «à vista de todos os povos»; a expressão grega pode indicar algo exposto abertamente aos olhos de todos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todas as nações».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: que
  rationale: Pronome relativo neutro singular que retoma «salvação» no versículo anterior; em português, «que» faz a ligação de modo natural.
- source_word: ἡτοίμασας
  choice: preparaste
  rationale: Aoristo ativo, segunda pessoa do singular, dirigido a Deus. O pretérito perfeito simples conserva a referência a uma ação realizada e combina com o tratamento singular do contexto.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: Expressão idiomática que indica algo colocado perante os olhos ou na presença de outros. «Diante de» preserva o sentido público e visível em português natural.
- source_word: πάντων
  choice: todos
  rationale: Traduz diretamente o genitivo plural e mantém o alcance universal da expressão.
- source_word: τῶν λαῶν
  choice: os povos
  rationale: O plural «povos» preserva a pluralidade de grupos humanos no grego sem antecipar a distinção entre gentios e Israel explicitada no versículo seguinte.
theological_decisions:
- issue: Alcance e nuance de λαῶν em relação ao versículo seguinte
  choice: todos os povos
  alternative: todas as nações; toda a gente
  rationale: O plural grego apresenta coletivamente vários povos diante dos quais a salvação de Deus foi preparada. «Povos» mantém essa amplitude e deixa que Lucas 2:32 especifique gentios e Israel.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Diante de» evita o decalque pouco natural «diante da face de», mas conserva a imagem de presença e visibilidade do idioma grego. Os marcadores seguem a ordem normal [a][b].
