source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: pt
  text: E ela deu à luz seu filho primogênito, envolveu-o em faixas de pano[a] e o deitou num cocho[b], porque não havia lugar para eles no quarto de hóspedes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «enfaixou-o». O verbo se refere a envolver um bebê em faixas ou tiras de pano.
    reason: lexical_alternative
  - marker: b
    text: Ou «numa manjedoura». O termo grego designa um lugar ou recipiente onde os animais se alimentam.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, «hospedaria». O grego κατάλυμα pode significar quarto de hóspedes ou lugar de alojamento; em Lucas 10.34, o autor usa outra palavra para uma hospedaria comercial.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: deu à luz
  rationale: Expressão idiomática e corrente em português para o ato de dar à luz, sem recorrer ao menos natural «pariu» nem ao literário «deu à luz a» com construção pesada.
- source_word: πρωτότοκον
  choice: primogênito
  rationale: Equivalente padrão que indica a ordem de nascimento no contexto imediato, sem acrescentar conclusões sobre filhos posteriores.
- source_word: ἐσπαργάνωσεν
  choice: envolveu-o em faixas de pano
  rationale: Comunica de modo concreto o costume de envolver um recém-nascido em tiras ou faixas de tecido; evita o termo menos corrente «enfaixou», preservado como alternativa na nota.
- source_word: ἀνέκλινεν
  choice: o deitou
  rationale: Forma natural em português para colocar um bebê deitado, preservando o sentido contextual do verbo.
- source_word: φάτνῃ
  choice: num cocho
  rationale: O substantivo designa um lugar ou recipiente onde se põe alimento para animais. «Cocho» torna esse sentido concreto e transparente; «manjedoura», tradicional, é mantido na nota.
- source_word: τόπος
  choice: lugar
  rationale: Reproduz o sentido amplo de espaço ou lugar disponível e funciona naturalmente na expressão «não havia lugar para eles».
- source_word: καταλύματι
  choice: quarto de hóspedes
  rationale: κατάλυμα pode indicar aposento para hóspedes ou lugar de alojamento. Em Lucas 22.11 refere-se claramente a um quarto de hóspedes, enquanto Lucas emprega πανδοχεῖον para uma hospedaria comercial em 10.34.
theological_decisions:
- issue: Se κατάλυμα deve ser traduzido pela forma tradicional «hospedaria» ou como um espaço destinado a hóspedes
  choice: quarto de hóspedes
  alternative: hospedaria; lugar de alojamento
  rationale: O grego não exige uma hospedaria comercial. O uso vocabular de Lucas favorece «quarto de hóspedes», evitando introduzir no cenário uma hospedaria que o texto não especifica, sem excluir a alternativa lexical em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem coordenada do grego foi preservada sem rigidez. «Cocho» explicita a realidade concreta do cenário, enquanto as formas tradicionais e as alternativas relevantes são registradas em notas.
