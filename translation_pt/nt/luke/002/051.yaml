id: LUK.2.51
reference: Luke 2:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: pt
  text: Então ele desceu com eles e foi para Nazaré, e continuava sujeito a eles. Sua mãe guardava todas essas palavras[a] no coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas essas coisas” ou “todos esses acontecimentos”. A palavra grega pode se referir a palavras, declarações ou assuntos relatados.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: desceu
  rationale: Preserva de modo natural o sentido geográfico de καταβαίνω, sem a formalidade excessiva de “descendeu”.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: Expressa diretamente a ideia simples de acompanhamento.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: foi para Nazaré
  rationale: Em português, “foi para” acompanha naturalmente o ponto de vista narrativo e a sequência do deslocamento.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: continuava sujeito a eles
  rationale: A construção perifrástica no imperfeito apresenta uma submissão contínua. “Continuava sujeito” é natural em português e preserva tanto a duração quanto a relação de obediência.
- source_word: διετήρει
  choice: guardava
  rationale: Comunica a preservação atenta na memória sem introduzir no texto principal a nuance mais interpretativa de “entesourava”.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: todas essas palavras
  rationale: Mantém a correspondência transparente com ῥήματα, deixando em nota a possibilidade contextual mais ampla de acontecimentos ou assuntos.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: no coração
  rationale: Preserva o conhecido idioma bíblico de lembrança e reflexão interior; o possessivo é desnecessário em português neste contexto.
theological_decisions:
- issue: A relação de Jesus com seus pais terrenos
  choice: continuava sujeito a eles
  alternative: continuava obedecendo a eles
  rationale: O texto afirma a submissão contínua de Jesus a Maria e José nessa etapa da vida. A formulação preserva essa tensão teológica sem acrescentar explicações cristológicas nem reduzir ὑποτάσσω a um ato pontual.
- issue: Amplitude semântica de ῥήματα
  choice: palavras
  alternative: coisas; acontecimentos
  rationale: “Palavras” conserva o valor lexical direto, enquanto a nota reconhece que o termo grego pode abranger assuntos ou acontecimentos relatados.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Continuava sujeito” evita uma construção reflexiva pouco natural e explicita legitimamente o aspecto contínuo da forma grega.
