  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: pt
  text: Mas, supondo que ele estivesse no grupo de viajantes[a], fizeram uma jornada de um dia e começaram a procurá-lo[b] entre os parentes e conhecidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na caravana”. O termo grego se refere a um grupo que viajava junto.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “e ficaram procurando por ele”, ressaltando a continuidade da busca.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: supondo
  rationale: O particípio aoristo expressa a suposição de Maria e José; “supondo” preserva o caráter não confirmado dessa ideia.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao versículo anterior e introduz a reviravolta narrativa.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: estivesse no grupo de viajantes
  rationale: συνοδία designa uma companhia que viaja junta. A expressão é clara em português atual e evita limitar a imagem a um tipo específico de caravana.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: caminharam um dia inteiro
  rationale: Traduz naturalmente o idioma que indica o percurso de uma jornada de um dia, sem exigir que todo o trajeto tenha sido feito literalmente a pé.
- source_word: ἀνεζήτουν
  choice: começaram a procurá-lo
  rationale: O imperfeito pode apresentar o início e a continuidade da procura no desenvolvimento narrativo; a nota registra a alternativa durativa.
- source_word: συγγενεῦσιν
  choice: parentes
  rationale: Refere-se amplamente às pessoas ligadas por parentesco e é natural e inclusivo em português.
- source_word: γνωστοῖς
  choice: conhecidos
  rationale: Designa pessoas conhecidas, sem necessariamente implicar a intimidade sugerida por “amigos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Grupo de viajantes” explicita naturalmente a ideia de companhia em viagem; “caravana” é preservado em nota. A colocação do marcador [b] ao fim da oração vincula a nota à expressão verbal sobre a procura.
