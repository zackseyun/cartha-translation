  naturalness: O português é moderno e claro. “Grupo de viajantes”, “parentes” e “conhecidos” são naturais e adequados. “Fizeram uma jornada de um dia” evita a implicação específica de caminhar a pé e mantém boa legibilidade.
  terminology: “Grupo de viajantes” representa adequadamente συνοδία; “caravana” é uma alternativa válida em nota. “Parentes” e “conhecidos” correspondem bem a συγγενεῦσιν e γνωστοῖς. A nota sobre o imperfeito é apropriada; o marcador deve ficar junto ao verbo a que se refere.
