source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your slave[a], Master, according to your word[b], in peace.
translation:
  language: pt
  text: Agora, Mestre, estás libertando o teu escravo[a], conforme a tua palavra, em paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O grego δοῦλος pode significar “escravo” ou “servo”; “escravo” ressalta aqui a relação de pertença e serviço diante daquele a quem Simeão chama de Mestre.
    reason: lexical_alternative
  - marker: b
    text: O sentido contextual é que Simeão está pronto para partir desta vida em paz, embora o grego diga mais literalmente que Deus o está “libertando” ou “dispensando”.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Agora
  rationale: Marca o momento presente em que se cumpre a expectativa de Simeão; é o equivalente português direto e natural.
- source_word: ἀπολύεις
  choice: estás libertando
  rationale: O presente do indicativo retrata a ação como atual. “Libertando” preserva a imagem de soltura ou dispensa sem explicitar a morte, que é apenas implicada pelo contexto.
- source_word: τὸν δοῦλόν σου
  choice: o teu escravo
  rationale: δοῦλος pode designar escravo ou servo. Aqui, a forma de tratamento δέσποτα ressalta a relação de autoridade e pertença, favorecendo “escravo”, embora “servo” seja uma alternativa legítima.
- source_word: δέσποτα
  choice: Soberano
  rationale: O vocativo designa quem possui autoridade absoluta. “Soberano” conserva essa força em português e evita a possível leitura moderna de “Mestre” como professor; a relação com δοῦλος permanece expressa no restante da frase.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: conforme a tua palavra
  rationale: κατά com acusativo indica conformidade, e ῥῆμα remete aqui à palavra pronunciada ou promessa divina. A formulação é clara, digna e próxima do grego.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Reproduz diretamente a locução preposicional e conserva sua ressonância bíblica.
theological_decisions:
- issue: Se a fala de Simeão deve mencionar explicitamente a morte
  choice: Manter a metáfora de libertação sem explicitar a morte no texto principal
  alternative: Agora deixas o teu servo morrer em paz
  rationale: O contexto sugere que Simeão está preparado para morrer, mas ἀπολύω significa libertar, soltar ou dispensar, não “deixar morrer”. A tradução conserva a imagem e sua tensão poética.
- issue: Relação entre δοῦλος e δέσποτα
  choice: Traduzir δοῦλος por “escravo” e δέσποτα por “Soberano”
  alternative: “servo” e “Senhor” ou “escravo” e “Mestre”
  rationale: “Escravo” torna explícita a condição de pertença presente no par lexical, enquanto “Soberano” comunica autoridade plena em português corrente sem acrescentar uma identificação teológica ausente do vocábulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima do grego sem produzir sintaxe artificial; a pontuação vincula “em paz” ao ato de libertar.
