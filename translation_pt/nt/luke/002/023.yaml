  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: pt
  text: 'como está escrito na Lei do Senhor: “Todo filho do sexo masculino que abrir o ventre será chamado santo ao Senhor”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o primogênito do sexo masculino será considerado santo, ou consagrado, ao Senhor; compare Êxodo 13:2, 12.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: como está escrito
  rationale: Fórmula natural e consagrada em português para introduzir uma citação das Escrituras, preservando a força durativa do perfeito grego.
- source_word: ἐν νόμῳ κυρίου
  choice: na Lei do Senhor
  rationale: Identifica a Lei mosaica como autoridade escrita; a inicial maiúscula em “Lei” assinala esse corpo específico de instrução divina.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo daquilo que está escrito, sem exigir o menos fluente “que” antes da citação direta.
- source_word: Πᾶν ἄρσεν
  choice: Todo filho do sexo masculino
  rationale: Explicita de modo claro e corrente que o substantivo neutro grego ἄρσεν designa aqui uma criança do sexo masculino, conforme o contexto de nascimento.
- source_word: διανοῖγον μήτραν
  choice: que abrir o ventre
  rationale: Preserva de perto a expressão bíblica para o primeiro filho nascido de uma mulher, sem substituí-la silenciosamente por “primogênito”.
- source_word: ἅγιον τῷ κυρίῳ
  choice: santo ao Senhor
  rationale: Mantém o vocabulário explícito de santidade e a relação de dedicação expressa pelo dativo, sem trocar “santo” pelo interpretativo “consagrado”.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Representa diretamente o futuro passivo e soa natural numa citação legal solene em português moderno.
theological_decisions:
- issue: Tradução de κύριος numa citação da Lei de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: A tradução segue o texto grego, que apresenta κύριος, preservando ao mesmo tempo a referência ao Deus de Israel.
- issue: Linguagem de santidade ou de consagração
  choice: santo ao Senhor
  alternative: consagrado ao Senhor
  rationale: Como o grego usa explicitamente ἅγιον, o texto principal conserva “santo”; a ideia de consagração é esclarecida em nota, sem substituir o termo-fonte.
- issue: Expressão idiomática para o primeiro filho do sexo masculino
  choice: que abrir o ventre
  alternative: primogênito do sexo masculino
  rationale: A formulação concreta do grego e da citação legal é preservada, enquanto a nota explica seu referente para o leitor moderno.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Os dois-pontos introduzem a citação de maneira idiomática. Conserva-se a expressão bíblica “abrir o ventre” e a linguagem de “santo”, com esclarecimento em nota.
