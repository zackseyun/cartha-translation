id: LUK.2.48
reference: Luke 2:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: pt
  text: 'Quando o viram, ficaram espantados, e sua mãe lhe disse: “Filho, por que você fez isso conosco? Veja, seu pai e eu, angustiados[a], estávamos procurando você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflitos” ou “em grande aflição”; o particípio grego expressa dor emocional durante a busca.
    reason: Alternativa lexical que explicita a intensidade de ὀδυνώμενοι.
lexical_decisions:
- source_word: ἰδόντες αὐτόν
  choice: Quando o viram
  rationale: Expressa naturalmente em português o valor temporal do particípio aoristo e mantém a sequência narrativa.
- source_word: ἐξεπλάγησαν
  choice: ficaram espantados
  rationale: Comunica a forte surpresa indicada pelo verbo, em linguagem atual e digna.
- source_word: Τέκνον
  choice: Filho
  rationale: No contexto da fala materna dirigida a Jesus, “Filho” é uma forma vocativa natural em português e preserva o tom familiar de τέκνον.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: por que você fez isso conosco?
  rationale: Reproduz de modo idiomático a pergunta de censura, preservando tanto a ação quanto seu efeito sobre Maria e José.
- source_word: ἰδού
  choice: Veja
  rationale: Mantém a função enfática de chamar a atenção sem recorrer ao arcaizante “Eis”.
- source_word: ὁ πατήρ σου
  choice: seu pai
  rationale: Traduz diretamente a expressão grega, sem acrescentar uma qualificação interpretativa como “terreno” ou “adotivo”.
- source_word: ὀδυνώμενοι
  choice: angustiados
  rationale: Preserva o sentido participial e a intensidade de dor emocional ou aflição durante a busca, mais explicitamente que apenas “ansiosos”.
- source_word: ἐζητοῦμέν σε
  choice: estávamos procurando você
  rationale: O pretérito imperfeito expressa a busca contínua anterior ao encontro; “procurando você” é claro e natural em português brasileiro.
theological_decisions:
- issue: José ser chamado de “seu pai” em relação à filiação divina de Jesus
  choice: Manter “seu pai” sem qualificação.
  alternative: “seu pai terreno” ou “seu pai adotivo”
  rationale: Maria diz literalmente “seu pai e eu”. Acrescentar uma qualificação resolveria interpretativamente uma tensão que o próprio relato preserva, especialmente diante da resposta de Jesus no versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem “seu pai e eu, angustiados, estávamos procurando você” conserva o particípio grego sem produzir uma construção artificial. “Você” é usado como forma amplamente compreensível de tratamento direto.
