base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: pt
  text: Glória a Deus nas maiores alturas, e paz na terra entre as pessoas do seu agrado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «entre as pessoas de quem ele se agrada».'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos trazem: «e paz na terra, boa vontade entre as pessoas».'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Glória
  rationale: Preserva o caráter exclamativo, litúrgico e teológico da atribuição dirigida a Deus.
- source_word: ἐν ὑψίστοις
  choice: nas maiores alturas
  rationale: Expressa de modo natural o âmbito celestial mais elevado e mantém o contraste espacial com «na terra».
- source_word: θεῷ
  choice: a Deus
  rationale: A preposição explicita naturalmente em português o dativo de atribuição.
- source_word: ἐπὶ γῆς
  choice: na terra
  rationale: Tradução espacial direta e idiomática, em contraste com «nas maiores alturas».
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém o sentido bíblico amplo do substantivo sem o restringir indevidamente.
- source_word: ἐν ἀνθρώποις
  choice: entre as pessoas
  rationale: ἄνθρωποι refere-se aqui genericamente aos seres humanos; «pessoas» comunica essa abrangência com naturalidade no português atual.
- source_word: εὐδοκίας
  choice: do seu agrado
  rationale: O genitivo qualifica as pessoas como objetos do agrado ou favor divino. O possessivo torna explícita a referência contextual a Deus sem transformar a expressão em uma oração verbal.
theological_decisions:
- issue: Sentido do genitivo εὐδοκίας na proclamação angélica
  choice: A paz é anunciada entre as pessoas que são objeto do agrado divino.
  alternative: «paz na terra, boa vontade entre as pessoas», segundo a variante nominativa εὐδοκία; ou «entre as pessoas com quem ele se agrada», como formulação mais explícita.
  rationale: O texto adotado pela SBLGNT traz o genitivo εὐδοκίας, que depende de ἀνθρώποις e caracteriza as pessoas associadas à paz. A tradução conserva essa relação sem desenvolver uma doutrina específica sobre quem elas são ou por que recebem o favor.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Maiores alturas» evita a ambiguidade de «no Altíssimo», que poderia ser entendida como referência direta a Deus, e «pessoas» transmite naturalmente o valor genérico de ἀνθρώποις.
