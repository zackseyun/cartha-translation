  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: pt
  text: 'E este será o sinal para vocês: encontrarão um bebê envolto em faixas de pano e deitado numa manjedoura.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “envolto em panos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “num cocho”.
