lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: Mantém o sentido de indicação ou marca identificadora dada aos pastores, sem explicitar que se trate de uma prova milagrosa.
- source_word: εὑρήσετε
  choice: encontrarão
  rationale: Reproduz de modo direto e natural o futuro indicativo na segunda pessoa do plural.
- source_word: βρέφος
  choice: um bebê
  rationale: Expressa com clareza e linguagem corrente que se trata de uma criança muito pequena.
- source_word: ἐσπαργανωμένον
  choice: envolto em faixas de pano
  rationale: Comunica concretamente o costume de envolver o bebê em panos, evitando tanto um termo arcaico quanto uma formulação vaga.
- source_word: κείμενον
  choice: deitado
  rationale: Descreve o estado ou a posição do bebê, sem transformar o particípio estativo em uma ação anterior.
- source_word: φάτνῃ
  choice: numa manjedoura
  rationale: É a designação tradicional e precisa do recipiente em que os animais comem; a alternativa explicativa é preservada em nota.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: este será o sinal para vocês
  rationale: Supre naturalmente a cópula elíptica do grego e apresenta o que segue como o sinal identificador destinado aos pastores.
theological_decisions:
- issue: Natureza do sinal dado aos pastores
  choice: O versículo apresenta concretamente um sinal de identificação.
  alternative: O sinal também pode carregar o sentido teológico mais amplo de confirmação divina.
  rationale: A tradução conserva “sinal” sem acrescentar “prova” ou “milagre”, permitindo que a função narrativa imediata e uma possível profundidade teológica permaneçam juntas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Para vocês” evita regionalismo excessivo; “bebê” é corrente e claro; “faixas de pano” explicita a prática indicada pelo verbo grego.
