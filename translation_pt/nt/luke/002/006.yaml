lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: E
  rationale: A expressão funciona aqui como progressão narrativa. A conjunção preserva a ligação com o contexto sem impor a formulação mais rígida “aconteceu que”.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: enquanto eles estavam ali
  rationale: A construção com infinitivo articular e ἐν tem valor temporal e simultâneo; esta formulação é natural em português e mantém esse sentido.
- source_word: ἐπλήσθησαν
  choice: cumpriram-se
  rationale: O verbo indica que o período chegou à sua plenitude ou conclusão. “Cumpriram-se” preserva a linguagem característica de Lucas sem tornar explícita uma interpretação teológica que o versículo não declara.
- source_word: αἱ ἡμέραι
  choice: os dias
  rationale: Mantém o substantivo concreto do grego, em vez de simplificá-lo para “o tempo”, e continua compreensível no contexto da gestação.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: para ela dar à luz
  rationale: Expressa com clareza e naturalidade a referência do infinitivo grego ao parto de Maria, preservando sua força verbal.
theological_decisions:
- issue: Possível conotação de tempo providencial ou determinado em ἐπλήσθησαν αἱ ἡμέραι
  choice: cumpriram-se os dias
  alternative: chegou o tempo
  rationale: A opção mantém a formulação de plenitude ou cumprimento usada por Lucas e sua possível ressonância teológica, sem afirmar mais do que o texto diz sobre o fim da gestação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a progressão narrativa e a expressão concreta “os dias”, evitando tanto rigidez excessiva quanto paráfrase interpretativa.
