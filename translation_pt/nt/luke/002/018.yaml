lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação simples com a narrativa anterior.
- source_word: πάντες οἱ ἀκούσαντες
  choice: todos os que ouviram
  rationale: O particípio aoristo com artigo funciona como substantivo. Em português, a construção é natural sem acrescentar um objeto explícito, que não aparece no grego.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Expressa assombro diante do relato em linguagem atual, sem indicar por si só fé ou incredulidade.
- source_word: περὶ τῶν λαληθέντων
  choice: com o que ... haviam contado
  rationale: περί com genitivo indica aquilo a respeito do qual ocorreu a reação; o particípio passivo aponta para o conteúdo comunicado. A formulação portuguesa é idiomática e mantém a anterioridade do relato.
- source_word: ὑπὸ τῶν ποιμένων
  choice: os pastores
  rationale: Na reestruturação idiomática para a voz ativa, os pastores continuam sendo os agentes da comunicação.
- source_word: πρὸς αὐτούς
  choice: lhes
  rationale: Mantém a referência pronominal aos ouvintes sem especificar além do texto.
theological_decisions:
- issue: Natureza da reação descrita por ἐθαύμασαν
  choice: A reação é apresentada como admiração ou assombro, sem afirmar fé salvadora nem incredulidade.
  alternative: Entender a reação como fé positiva ou como mera curiosidade.
  rationale: O verbo descreve uma reação de espanto, mas o versículo não informa qual foi seu resultado espiritual; a tradução preserva essa abertura narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A voz ativa em “os pastores lhes haviam contado” evita uma passiva pesada sem alterar os papéis semânticos do grego.
