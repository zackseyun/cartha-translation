  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: pt
  text: E todos os que ouviram ficaram admirados com o que os pastores lhes haviam contado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram maravilhados”.'
