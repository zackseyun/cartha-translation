source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: pt
  text: Naquela mesma região havia pastores que passavam a noite ao relento[a], cuidando de seu rebanho durante as vigílias da noite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pernoitavam ao ar livre” ou “ficavam nos campos”. O verbo grego enfatiza que os pastores passavam a noite fora, a céu aberto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “guardando as vigílias da noite sobre seu rebanho”, expressão que pode sugerir a vigilância noturna em turnos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: pastores
  rationale: É o termo português corrente e preciso para os que cuidam de ovelhas.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: naquela mesma região
  rationale: χώρα indica aqui a região ou área circundante; a expressão mantém a ligação narrativa e soa natural em português.
- source_word: ἀγραυλοῦντες
  choice: passavam a noite ao relento
  rationale: O verbo enfatiza que os pastores pernoitavam fora, a céu aberto; esta formulação é clara e preserva esse traço.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: cuidando ... durante as vigílias da noite
  rationale: Preserva a construção cognata e a ideia das vigílias noturnas, possivelmente organizadas em turnos, sem tornar explícito o que o texto apenas sugere.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: de seu rebanho
  rationale: Com o verbo 'cuidar', esta é uma construção idiomática em português e mantém o substantivo coletivo ποίμνη.
- source_word: Καὶ ... ἦσαν
  choice: havia
  rationale: Na abertura de uma nova cena, 'havia' representa naturalmente o valor existencial de ἦσαν; a continuidade de καί fica implícita no fluxo narrativo português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao relento” comunica de modo conciso o pernoite ao ar livre; “vigílias da noite” conserva a forma e a possível nuance do grego, esclarecida em nota.
