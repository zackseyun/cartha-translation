id: LUK.2.38
reference: Luke 2:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: pt
  text: Naquela mesma hora[a], aproximando-se[b], ela dava graças[c] a Deus e falava a respeito dele[d] a todos os que aguardavam a redenção de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “naquela exata hora” ou “naquele mesmo momento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “chegando ali” ou “vindo para perto”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “louvava”. O verbo pode expressar agradecimento ou louvor.'
    reason: lexical_alternative
  - marker: d
    text: No contexto, “dele” refere-se mais naturalmente ao menino Jesus, embora Deus seja o antecedente explícito mais próximo no grego.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: naquela mesma hora
  rationale: A expressão dativa indica o momento da ação, e αὐτῇ enfatiza que se tratava daquela mesma hora. A formulação é natural em português e mantém a ligação imediata com a cena anterior.
- source_word: ἐπιστᾶσα
  choice: aproximando-se
  rationale: O particípio aoristo descreve Ana chegando à cena ou se aproximando naquele momento, sem especificar indevidamente o modo de sua chegada.
- source_word: ἀνθωμολογεῖτο
  choice: dava graças
  rationale: O verbo no imperfeito pode expressar agradecimento ou louvor dirigido a Deus. O imperfeito é preservado como ação em curso, sem acrescentar explicitamente a ideia de que ela começou a fazê-lo.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O artigo grego é idiomático e não precisa ser reproduzido em português.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: falava a respeito dele
  rationale: O imperfeito comunica ação continuada. O pronome é mantido para preservar a possível ambiguidade de seu referente no grego.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: a todos os que aguardavam
  rationale: προσδέχομαι expressa espera acompanhada de expectativa; “aguardavam” é claro, natural e adequado ao contexto da esperança messiânica.
- source_word: λύτρωσιν
  choice: redenção
  rationale: λύτρωσις denota libertação ou resgate e pode ter forte alcance salvífico. “Redenção” conserva esse peso e a amplitude da esperança apresentada por Lucas.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
theological_decisions:
- issue: Referente de αὐτοῦ em “falava a respeito dele”
  choice: Manter o pronome “dele”, cujo referente mais natural no contexto é o menino Jesus.
  alternative: Entender “dele” como referência a Deus, o antecedente nominal explícito mais próximo.
  rationale: A narrativa está centrada no menino, e a fala de Ana aos que aguardavam a redenção provavelmente diz respeito a ele. Contudo, substituir o pronome por “Jesus” resolveria uma ambiguidade que o texto grego deixa aberta.
- issue: Sentido de “redenção de Jerusalém”
  choice: Preservar literalmente “a redenção de Jerusalém”.
  alternative: Traduzir “a libertação de Jerusalém” ou explicitar uma interpretação política, espiritual ou coletiva.
  rationale: A expressão pode abranger a ação salvadora esperada de Deus em favor de seu povo, com ressonâncias coletivas e escatológicas. A tradução não restringe esse alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial; os imperfeitos são mantidos como ações em curso, e ambiguidades legítimas são preservadas.
