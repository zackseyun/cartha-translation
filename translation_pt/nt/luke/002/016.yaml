  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: pt
  text: E foram às pressas e encontraram Maria, José e o bebê deitado na manjedoura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no cocho”. O grego φάτνη pode se referir a uma manjedoura ou a um cocho de alimentação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: foram
  rationale: No contexto narrativo, os pastores se deslocam para o lugar indicado; “foram” expressa naturalmente esse movimento em português, embora o verbo grego também possa ser traduzido por “vieram” conforme o ponto de vista narrativo.
- source_word: σπεύσαντες
  choice: às pressas
  rationale: O particípio indica a maneira urgente como se deslocaram. “Às pressas” é idiomático e preserva essa urgência.
- source_word: ἀνεῦραν
  choice: encontraram
  rationale: O verbo indica encontrar, possivelmente depois de procurar. “Encontraram” é a forma narrativa mais natural, e o contexto deixa implícita a busca bem-sucedida.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Maria e José
  rationale: Os nomes seguem suas formas portuguesas tradicionais; a construção coordenativa grega é representada de maneira natural.
- source_word: τὸ βρέφος
  choice: o bebê
  rationale: βρέφος designa uma criança muito pequena; no contexto imediato do nascimento, “bebê” é claro, preciso e corrente.
- source_word: κείμενον
  choice: que estava deitado
  rationale: A expressão descreve o estado e a posição do bebê, não o ato de alguém colocá-lo ali.
- source_word: ἐν τῇ φάτνῃ
  choice: na manjedoura
  rationale: φάτνη pode designar uma manjedoura ou cocho. “Manjedoura” é a tradução tradicional, correta e natural neste relato, enquanto a nota preserva a alternativa lexical concreta.
- source_word: καὶ ... καὶ ... καὶ
  choice: E ... e ... e
  rationale: A coordenação repetida conserva o fluxo aditivo e simples da narrativa grega sem tornar a frase artificial em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a coordenação do grego foram preservadas dentro de uma sintaxe portuguesa natural; “que estava deitado” explicita o valor descritivo do particípio sem acrescentar agente ou ação.
