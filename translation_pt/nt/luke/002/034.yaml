  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: pt
  text: 'E Simeão os abençoou e disse a Maria, sua mãe: “Veja, este está destinado à queda e ao levantamento de muitos em Israel e a ser um sinal que será contestado[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sinal contra o qual se falará”.'
    reason: Registra de modo mais literal a força verbal de ἀντιλεγόμενον e sua nuance de oposição expressa em palavras.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Este
  rationale: A construção apresentativa concentra a atenção na criança; em português, “Este está...” comunica isso com naturalidade e dignidade, sem o tom arcaizante de “Eis”.
- source_word: κεῖται εἰς
  choice: está destinado a
  rationale: No contexto, a expressão indica que a criança foi posta ou designada para os resultados mencionados. “Está destinado a” preserva essa orientação sem explicitar indevidamente o agente.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: queda e levantamento
  rationale: Mantém o paralelismo e a tensão metafórica do grego. “Levantamento” preserva a possível ressonância de restauração e ressurreição sem decidir entre elas.
- source_word: ἀντιλεγόμενον
  choice: que será contestado
  rationale: O particípio significa ser contradito, alvo de oposição ou contestação. “Contestado” é corrente e conserva o foco na reação ao sinal.
theological_decisions:
- issue: Sentido de ἀνάστασιν
  choice: levantamento
  alternative: ressurreição
  rationale: O termo pode sugerir tanto erguer/restaurar quanto ressurreição. “Levantamento” preserva a amplitude sem impor uma leitura exclusivamente escatológica.
- issue: Agência implícita em κεῖται
  choice: está destinado
  alternative: foi designado por Deus
  rationale: O grego não nomeia o agente. A tradução evita acrescentar explicitamente “por Deus”, embora essa agência possa ser inferida no contexto teológico.
- issue: Identidade do sinal
  choice: um sinal que será contestado
  alternative: um sinal contra o qual se falará
  rationale: Mantém a ambiguidade quanto a “sinal” se referir diretamente à criança ou ao papel que ela desempenha, sem expandir a formulação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Evita arcaísmos como “eis” e preserva o paralelismo compacto e a ambiguidade teológica do original.
