  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: pt
  text: Havia também uma profetisa, Ana, filha de Fanuel, da tribo de Aser. Ela era de idade muito avançada[a], tendo vivido com um marido durante sete anos desde a sua virgindade[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “avançada em muitos dias”, expressão idiomática para idade muito avançada.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “depois de sua virgindade”. Literalmente, “desde a sua virgindade”; no contexto, a expressão se refere aos sete anos de vida conjugal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: profetisa
  rationale: O substantivo grego é feminino e identifica Ana explicitamente como mulher que exercia função profética; “profetisa” é a forma portuguesa direta e corrente.
- source_word: θυγάτηρ Φανουήλ
  choice: filha de Fanuel
  rationale: Reproduz de modo natural a identificação genealógica em aposição.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: da tribo de Aser
  rationale: Expressa de maneira idiomática a origem ou pertença tribal indicada por ἐκ.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: muito avançada em idade
  rationale: Traduz o sentido do idiomatismo grego, literalmente “avançada em muitos dias”, em português claro e digno, preservando a imagem literal em nota.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: tinha vivido com o marido
  rationale: No contexto, ἀνήρ designa o esposo e a expressão se refere à vida conjugal, não a mera coabitação.
- source_word: ἔτη ἑπτὰ
  choice: durante sete anos
  rationale: Indica com clareza a duração expressa no grego.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: desde que deixara de ser virgem
  rationale: Comunica em português natural que os sete anos de vida conjugal são contados a partir do fim de sua virgindade, sem acrescentar uma idade ou cronologia não declarada.
theological_decisions:
- issue: Identificação de Ana como προφῆτις
  choice: Manter a designação explícita “profetisa”.
  alternative: Enfraquecer o termo para “mulher piedosa” ou tratá-lo como título meramente honorífico.
  rationale: Lucas emprega o substantivo comum para profeta em sua forma feminina; a tradução não deve reduzir a função que o texto atribui a Ana.
- issue: Descrição da idade de Ana
  choice: Traduzir o idiomatismo como “muito avançada em idade”, com a forma literal em nota.
  alternative: Manter no texto “avançada em muitos dias” ou importar para este versículo um cálculo de idade baseado no versículo seguinte.
  rationale: A formulação escolhida transmite o sentido idiomático em português corrente sem tornar a cronologia mais específica do que o grego.
- issue: Ponto inicial dos sete anos de casamento
  choice: Entender ἀπὸ τῆς παρθενίας αὐτῆς como o período contado desde que Ana deixou a virgindade ao iniciar a vida conjugal.
  alternative: Traduzir literalmente “desde a sua virgindade”, deixando a relação temporal menos explícita.
  rationale: O particípio sobre viver com o marido e a duração de sete anos apontam para os anos de casamento; a nota registra a forma mais literal e a possível formulação alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Havia também” mantém a ligação narrativa de Καί sem rigidez sintática; “Fanuel” e “Aser” seguem as formas bíblicas portuguesas correntes. A vírgula final foi preservada porque o enunciado continua no versículo seguinte.
