base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: pt
  text: 'E ele o tomou nos braços, abençoou a Deus e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: recebeu
  rationale: O verbo δέχομαι significa comumente “receber” ou “acolher”. Com “nos braços”, “recebeu” expressa com naturalidade o ato físico e preserva a nuance lexical do grego.
- source_word: αὐτό
  choice: o
  rationale: Embora o pronome grego seja neutro por concordar com a referência à criança, ele se refere pessoalmente ao menino Jesus; em português, o pronome masculino evita uma leitura impessoal enganosa.
- source_word: εἰς τὰς ἀγκάλας
  choice: nos braços
  rationale: A expressão indica os braços usados para acolher ou carregar alguém. O possessivo “seus” fica naturalmente implícito em português pelo sujeito da ação.
- source_word: εὐλόγησεν τὸν θεόν
  choice: bendisse a Deus
  rationale: Preserva o sentido direto de εὐλογέω quando Deus é o objeto e mantém uma formulação bíblica clara no português atual.
- source_word: καὶ εἶπεν
  choice: 'e disse:'
  rationale: Mantém a sequência narrativa simples; os dois-pontos introduzem naturalmente as palavras que vêm a seguir.
- source_word: αὐτός
  choice: ele
  rationale: Representa o sujeito expresso no grego sem intensificar indevidamente como “ele mesmo”.
theological_decisions:
- issue: Referência do pronome neutro αὐτό
  choice: O pronome se refere pessoalmente ao menino Jesus e é traduzido por “o”.
  alternative: Uma reprodução hiperliteral do gênero gramatical neutro, com referência impessoal.
  rationale: O gênero gramatical acompanha a designação grega da criança, mas o referente é Jesus como pessoa. A forma pessoal em português evita equívoco sem acrescentar conteúdo teológico ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendisse a Deus” preserva a formulação lexical do grego; “recebeu nos braços” mantém tanto a ação física quanto a ideia de acolhimento.
