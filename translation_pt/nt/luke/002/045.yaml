  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: pt
  text: E, sem o encontrarem[a], voltaram a Jerusalém, à procura dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando não o encontraram, voltaram a Jerusalém, procurando por ele”.'
    reason: Alternativa que torna explícita a possível nuance temporal do particípio grego e conserva a formulação verbal para a busca.
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a ligação simples e o fluxo paratático da narrativa de Lucas.
- source_word: μὴ εὑρόντες
  choice: como não o encontraram
  rationale: Expressa de modo natural em português o particípio aoristo circunstancial com μή, sem definir de forma rígida se a relação é apenas temporal ou também circunstancial.
- source_word: ὑπέστρεψαν
  choice: voltaram
  rationale: Equivalente corrente e digno para o aoristo de ὑποστρέφω, indicando retorno.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: A preposição «a» com o verbo «voltar» comunica naturalmente o movimento em direção à cidade e tem ampla inteligibilidade internacional.
- source_word: ἀναζητοῦντες
  choice: procurando por ele
  rationale: Comunica a busca ativa indicada por ἀναζητέω em linguagem moderna e concreta; «por ele» favorece a leitura brasileira sem prejudicar a compreensão internacional.
- source_word: αὐτόν
  choice: ele
  rationale: Pronome masculino singular que retoma Jesus; aparece regido por «por» na formulação portuguesa.
