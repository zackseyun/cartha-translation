source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: pt
  text: 'e para oferecer um sacrifício conforme o que está dito na Lei do Senhor: “um par de rolas ou dois pombinhos”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: para oferecer um sacrifício
  rationale: O infinitivo articular expressa propósito no contexto. Embora δίδωμι signifique literalmente “dar”, em português a colocação natural e precisa é “oferecer um sacrifício”.
- source_word: κατὰ τὸ εἰρημένον
  choice: conforme o que está dito
  rationale: O particípio perfeito passivo indica algo que foi declarado e permanece registrado com autoridade. “Está dito” preserva esse valor resultante sem acrescentar a interpretação “prescrito”.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: na Lei do Senhor
  rationale: A expressão se refere à Lei mosaica como Escritura; “Senhor” traduz κύριος de modo reconhecível e apropriado ao contexto divino.
- source_word: ζεῦγος τρυγόνων
  choice: um par de rolas
  rationale: ζεῦγος designa aqui um par, e τρυγών é especificamente a rola, não uma pomba em sentido genérico.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: dois pombinhos
  rationale: νοσσός denota uma ave jovem. “Pombinhos” comunica de modo conciso e natural que se trata de pombos jovens, preservando a terminologia sacrificial.
theological_decisions:
- issue: Tradução de κύριος na fórmula referente à Lei divina
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κύριος. “Senhor” mantém a forma normal do Novo Testamento sem impor graficamente uma retroversão para o nome divino.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe que mantém a ligação do versículo ao propósito expresso no contexto anterior. As aspas identificam como citação a formulação extraída da Lei.
