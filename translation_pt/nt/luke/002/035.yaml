  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: pt
  text: e uma espada atravessará também a sua própria alma[b][a], para que sejam revelados os pensamentos de muitos corações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “transpassará”. O verbo grego significa mais literalmente “passará através”, enquanto a imagem da espada comunica naturalmente a ideia de perfurar.'
    reason: lexical_alternative
  - marker: b
    text: A “espada” é geralmente entendida como figura da profunda angústia que Maria sofreria.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: a sua própria
  rationale: A combinação do pronome com αὐτῆς é enfática e dirige pessoalmente a profecia a Maria; “a sua própria” preserva essa força em português natural.
- source_word: ψυχή
  choice: alma
  rationale: No contexto, designa a pessoa interior, atingida por profundo sofrimento. “Alma” preserva o peso emocional e espiritual sem reduzir o termo à vida física.
- source_word: διελεύσεται
  choice: atravessará
  rationale: O verbo significa literalmente passar ou ir através de algo. “Atravessará” mantém esse sentido e, com a imagem da espada, comunica naturalmente a ideia de perfuração sem inseri-la diretamente no verbo.
- source_word: ῥομφαία
  choice: espada
  rationale: Embora possa designar uma espada grande, “espada” é o equivalente claro e idiomático; maior especificidade seria desnecessária no texto principal.
- source_word: ὅπως ἂν
  choice: para que
  rationale: Expressa propósito ou resultado pretendido e mantém de modo natural a ligação com a revelação dos pensamentos.
- source_word: ἀποκαλυφθῶσιν
  choice: sejam revelados
  rationale: Preserva a voz passiva e o valor subjuntivo da construção grega.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: os pensamentos de muitos corações
  rationale: “De muitos corações” é a formulação portuguesa natural para pensamentos procedentes do íntimo das pessoas, conservando καρδία como “coração” e sem acrescentar uma valoração moral.
theological_decisions:
- issue: Referente do pronome e alcance da profecia da espada
  choice: Manter a fala dirigida diretamente a Maria e apresentar a espada como imagem de profundo sofrimento pessoal, sem determinar no texto principal a forma histórica exata desse sofrimento.
  alternative: Identificar explicitamente a espada com a dor de Maria na crucificação de Jesus ou, de modo mais amplo, com a dor produzida pelo caráter divisivo da missão dele.
  rationale: O grego enfatiza que a própria alma de Maria será atingida, mas não especifica como a metáfora se cumpre. A tradução deve preservar essa abertura e sua ligação com a revelação dos pensamentos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores [b][a] acompanha a apresentação fornecida. “A sua própria alma” conserva a ênfase sem recorrer a uma construção excessivamente literal; “atravessará” mantém a imagem concreta e a proximidade com o verbo grego.
