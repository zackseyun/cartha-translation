  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: pt
  text: E o pai e a mãe dele estavam maravilhados com as coisas que se diziam a respeito dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «o pai dele». No uso familiar comum da narrativa, a expressão se refere a José. Algumas traduções trazem «José e a mãe dele» para evitar possível mal-entendido à luz do relato anterior de Lucas sobre a concepção virginal de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: o pai dele
  rationale: Traduz diretamente a expressão grega, sem substituí-la por «José». No contexto narrativo, José é designado pai no sentido familiar e jurídico comum.
- source_word: μήτηρ
  choice: a mãe
  rationale: Equivalente corrente e direto de μήτηρ; com a conjunção, forma o par «o pai e a mãe dele».
- source_word: ἦν ... θαυμάζοντες
  choice: estavam admirados
  rationale: A construção perifrástica comunica uma reação contínua no passado. «Estavam admirados» é natural em português e preserva o sentido de assombro.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: com as coisas que se diziam
  rationale: Mantém o conteúdo plural substantivado e a voz passiva, ao mesmo tempo que soa natural em português.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Expressão portuguesa clara e digna para περί com genitivo neste contexto.
theological_decisions:
- issue: A designação de José como «o pai dele» em um contexto que afirma a concepção virginal de Jesus
  choice: Manter «o pai dele» no texto principal e explicar a referência em nota.
  alternative: «José e a mãe dele» ou «seu pai, isto é, José, no sentido legal/social»
  rationale: A tradução preserva a formulação do texto grego e sua tensão narrativa. Em Lucas, José pode ser chamado pai no sentido familiar e jurídico comum sem que isso negue o relato anterior da concepção virginal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem coordenada do grego foi preservada, e «dele» evita a possível ambiguidade de «seu».
