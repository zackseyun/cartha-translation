id: LUK.2.26
reference: Luke 2:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: pt
  text: E lhe havia sido revelado pelo Espírito Santo que ele não veria a morte antes de ver o Messias do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “o Cristo do Senhor”.
    reason: Registra a tradução tradicional de Χριστός e preserva uma alternativa formalmente próxima do grego.
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: havia sido revelado
  rationale: O particípio perfeito passivo indica uma comunicação divina já recebida, cujo efeito permanecia. “Havia sido revelado” é natural em português e, com o agente expresso, transmite adequadamente esse sentido.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: pelo Espírito Santo
  rationale: Ὑπό com genitivo identifica o agente pessoal da revelação; “pelo Espírito Santo” reflete diretamente essa construção.
- source_word: μὴ ἰδεῖν θάνατον
  choice: não veria a morte
  rationale: Preserva a imagem idiomática grega, compreensível em português, sem reduzi-la à paráfrase “não morreria”.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: antes de ver
  rationale: Expressa com clareza e naturalidade que a morte não ocorreria antes do encontro prometido, sem acrescentar uma nuance temporal ausente no texto.
- source_word: τὸν χριστὸν κυρίου
  choice: o Messias do Senhor
  rationale: Χριστός funciona aqui como título messiânico. “Messias” conserva esse contexto, enquanto “do Senhor” mantém a relação genitiva deliberadamente ampla, que pode sugerir pertencimento, escolha ou envio.
theological_decisions:
- issue: Tradução de Χριστός como título messiânico
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός é um título, não uma designação já semelhante a nome próprio. “Messias” torna explícita sua função sem resolver além do texto a relação expressa pelo genitivo κυρίου; a forma tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ele” evita que “lhe” deixe ambíguo o sujeito de “não veria”. A expressão bíblica “ver a morte” foi mantida por ser inteligível e conservar a imagem do original.
