  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: pt
  text: 'E ele lhes disse: “Por que vocês estavam me procurando? Não sabiam que eu devo estar na casa de meu Pai[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ocupado com as coisas de meu Pai” ou “nas coisas de meu Pai”. A expressão grega é elíptica e pode se referir tanto à casa do Pai quanto aos assuntos dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Por que
  rationale: A expressão idiomática introduz uma pergunta sobre a razão ou causa; “Por que” é a forma natural e direta em português.
- source_word: ἐζητεῖτέ
  choice: estavam me procurando
  rationale: ζητέω, neste contexto narrativo, refere-se à procura por uma pessoa; a forma progressiva corresponde naturalmente ao imperfeito grego.
- source_word: οὐκ ᾔδειτε
  choice: Não sabiam
  rationale: Preserva de modo direto a pergunta retórica sobre conhecimento ou percepção.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: na casa de meu Pai
  rationale: A expressão grega é elíptica, literalmente “nas [coisas] de meu Pai”. O contexto imediato do templo favorece “na casa de meu Pai”, enquanto a ambiguidade genuína é preservada em nota.
- source_word: δεῖ
  choice: devo
  rationale: Expressa necessidade ou obrigação, possivelmente de caráter divino, com concisão e peso adequados.
- source_word: εἶναί με
  choice: eu devo estar
  rationale: O infinitivo εἶναι com sujeito acusativo após δεῖ é vertido naturalmente pela construção pessoal “eu devo estar”.
- source_word: πατρός μου
  choice: meu Pai
  rationale: A inicial maiúscula sinaliza que, no contexto do templo, Jesus se refere a Deus como seu Pai, sem acrescentar explicação ao texto.
theological_decisions:
- issue: Expressão elíptica ἐν τοῖς τοῦ πατρός μου
  choice: “na casa de meu Pai” no texto principal
  alternative: “ocupado com as coisas de meu Pai” / “nas coisas de meu Pai”
  rationale: O cenário do templo sustenta fortemente o sentido locativo, mas o grego também pode indicar os assuntos ou interesses do Pai. A nota mantém essa tensão sem resolver além do que a fonte permite.
- issue: Referente de “meu Pai”
  choice: Deus, chamado por Jesus de “meu Pai”
  alternative: pai terreno
  rationale: O contraste narrativo com José e o cenário do templo apontam para Deus. A tradução conserva a afirmação filial sem paráfrase doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A ordem e a pontuação favorecem leitura natural sem apagar a ambiguidade lexical central.
