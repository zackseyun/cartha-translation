  - marker: b
    text: “Refletindo” pode ter o sentido de reunir mentalmente, comparar ou considerar essas coisas em conjunto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve entre a reação pública dos demais e a resposta interior de Maria, sem romper o fluxo narrativo.
- source_word: συνετήρει
  choice: guardava cuidadosamente
  rationale: O imperfeito sugere uma ação contínua, e o verbo comunica conservar com cuidado, não apenas recordar.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: todas essas palavras
  rationale: Preserva a abrangência de πάντα e o sentido verbal mais direto de ῥήματα no contexto do relato dos pastores, embora 'coisas' ou 'acontecimentos' também sejam possíveis.
- source_word: συμβάλλουσα
  choice: refletindo sobre elas
  rationale: Expressa o processo mental de reunir, confrontar e considerar os elementos, em português natural, sem afirmar que Maria já os compreendia plenamente.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: em seu coração
  rationale: Mantém a metáfora bíblica para a vida interior, incluindo pensamento, consideração e afeto.
- source_word: Μαρία
  choice: Maria
  rationale: Emprega a forma tradicional e corrente do nome em português.
theological_decisions:
- issue: Natureza da resposta de Maria
  choice: Maria preservava cuidadosamente a mensagem e refletia sobre ela.
  alternative: Maria apenas se lembrava dos acontecimentos ou já os compreendia por completo.
  rationale: Os verbos indicam conservação atenta e reflexão contínua, mas não estabelecem nem mera lembrança nem compreensão plena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o aspecto contínuo dos verbos e a imagem bíblica do coração.
