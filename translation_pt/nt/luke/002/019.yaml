  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: pt
  text: Mas Maria guardava cuidadosamente todas essas palavras[a], refletindo[b] sobre elas em seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardava cuidadosamente todas essas coisas”; “palavras” também pode abranger fatos ou acontecimentos relatados.'
