id: LUK.2.46
reference: Luke 2:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: pt
  text: E aconteceu que, depois de três dias, eles o encontraram no templo[a], sentado entre os mestres, ouvindo-os e fazendo-lhes perguntas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por «templo» refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: 'Ou: «interrogando-os».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português corrente, sem recorrer ao arcaico «sucedeu».
- source_word: μετὰ ἡμέρας τρεῖς
  choice: depois de três dias
  rationale: Reproduz de perto a expressão temporal grega com μετά e acusativo, mantendo sua possível relação com o período da busca.
- source_word: εὗρον αὐτόν
  choice: eles o encontraram
  rationale: Tradução direta e natural do aoristo narrativo; o sujeito plural é explicitado para dar clareza em português.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma corrente e legível; uma nota esclarece que ἱερόν designa o complexo ou recinto do templo, não especificamente o santuário interior.
- source_word: καθεζόμενον
  choice: sentado
  rationale: Representa naturalmente a postura contínua de Jesus no momento em que foi encontrado.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: entre os mestres
  rationale: Expressa ἐν μέσῳ com naturalidade e não acrescenta «da Lei», especificação ausente do texto grego.
- source_word: ἀκούοντα αὐτῶν
  choice: ouvindo-os
  rationale: Mantém a ação contínua do particípio e comunica atenção no contexto, sem expansão desnecessária.
- source_word: ἐπερωτῶντα αὐτούς
  choice: fazendo-lhes perguntas
  rationale: Expressa de modo idiomático o ato de perguntar, sem sugerir necessariamente confronto ou interrogatório.
theological_decisions:
- issue: Natureza da interação de Jesus com os mestres
  choice: «ouvindo-os e fazendo-lhes perguntas»
  alternative: «ouvindo-os e interrogando-os»
  rationale: A formulação retrata participação atenta e ativa, preservando tanto a humildade quanto a inteligência de Jesus, sem impor ao verbo um tom confrontador que o grego não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das ações e a estrutura participial do grego são preservadas de modo natural; evitam-se tanto arcaísmos quanto especificações interpretativas não expressas no original.
