  source_fidelity: 'A tradução reproduz com precisão a sequência narrativa e os elementos centrais do grego: a fórmula introdutória (καὶ ἐγένετο), o intervalo temporal, o encontro no ἱερόν, a postura de Jesus e as duas ações participiais simultâneas. «Depois de três dias» preserva adequadamente μετά com acusativo, sem tentar resolver além do versículo a contagem temporal implícita.'
