base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: pt
  text: para se registrar com Maria, que estava prometida em casamento a ele[a] e estava grávida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “noiva dele”. O termo grego indica um compromisso matrimonial formal, com vínculo jurídico e social mais forte que o noivado moderno.
    reason: lexical_alternative
  - marker: b
    text: Ou “esperando um filho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: para se registrar
  rationale: O infinitivo aoristo médio expressa a finalidade da viagem de José no contexto do recenseamento. “Registrar-se” é natural em português moderno e preserva o sentido administrativo.
- source_word: σὺν
  choice: com
  rationale: Equivalente direto e natural para a ideia de acompanhamento.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: que estava prometida em casamento a ele
  rationale: A expressão comunica um compromisso matrimonial formal, juridicamente e socialmente mais forte que o noivado moderno, sem afirmar que o casamento já tivesse sido consumado.
- source_word: οὔσῃ ἐγκύῳ
  choice: e estava grávida
  rationale: Expressa com clareza e naturalidade a condição de Maria naquele momento; a coordenação explicita de modo fluente a relação entre os particípios gregos.
theological_decisions:
- issue: A condição matrimonial de Maria em relação a José
  choice: prometida em casamento a ele
  alternative: noiva dele; casada com ele
  rationale: O grego emprega μνηστεύομαι, que indica um compromisso matrimonial formal. “Casada” acrescentaria uma condição que esta oração não declara, enquanto “noiva” poderia sugerir apenas o compromisso moderno, geralmente menos vinculante.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva o caráter formal do compromisso matrimonial sem recorrer ao termo menos corrente “desposada”.
