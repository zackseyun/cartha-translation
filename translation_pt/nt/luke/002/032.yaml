id: LUK.2.32
reference: Luke 2:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: pt
  text: luz para revelação aos gentios[a] e glória do teu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às nações”. O termo grego pode designar as nações em geral, mas aqui provavelmente destaca os gentios em contraste com Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: luz
  rationale: Mantém a imagem direta do grego e se encaixa naturalmente na construção poética e apositiva do cântico, sem necessidade de acrescentar artigo indefinido em português.
- source_word: εἰς
  choice: para
  rationale: 'Expressa de modo conciso a ideia de finalidade ou resultado e introduz os dois termos coordenados: revelação e glória.'
- source_word: ἀποκάλυψιν
  choice: revelação
  rationale: Preserva tanto a ideia de tornar conhecido ou desvelar quanto a ressonância bíblico-teológica do termo, sem paráfrase interpretativa.
- source_word: ἐθνῶν
  choice: aos gentios
  rationale: No paralelismo com Israel, refere-se contextualmente aos povos não judeus. “Gentios” torna esse contraste claro para leitores de língua portuguesa; a alternativa mais formal, “nações”, é registrada em nota.
- source_word: δόξαν
  choice: glória
  rationale: É o equivalente corrente que conserva as ideias de honra, esplendor e exaltação associadas à obra salvadora de Deus.
- source_word: λαοῦ σου Ἰσραήλ
  choice: do teu povo Israel
  rationale: Reproduz a relação genitiva e identifica Israel, em aposição, como o povo de Deus. A ausência de vírgula mantém a leitura fluente sem eliminar essa identificação.
- source_word: καὶ
  choice: e
  rationale: 'Liga diretamente os dois elementos paralelos dependentes de “para”: revelação aos gentios e glória de Israel.'
theological_decisions:
- issue: Sentido de ἐθνῶν em contraste com Israel
  choice: aos gentios
  alternative: às nações
  rationale: A menção imediata de “teu povo Israel” favorece a leitura de ἐθνῶν como os povos não judeus. A tradução principal explicita o contraste contextual, enquanto a nota preserva a amplitude lexical do termo grego.
- issue: Relação sintática de εἰς com ἀποκάλυψιν e δόξαν
  choice: Entender “para” como regendo os dois substantivos coordenados
  alternative: Entender “glória” como uma descrição independente, sem repetir mentalmente a relação de finalidade ou resultado
  rationale: Os acusativos ἀποκάλυψιν e δόξαν estão ligados por καί após εἰς, o que favorece uma estrutura paralela. O português permite manter essa coordenação sem repetir “para”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A formulação mantém o caráter poético do cântico e evita explicações dentro do texto principal.
