id: LUK.2.52
reference: Luke 2:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: pt
  text: E Jesus continuava crescendo em sabedoria, estatura[a] e favor diante de Deus e das pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “idade” ou “maturidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: continuava crescendo
  rationale: O imperfeito expressa progresso contínuo ao longo do tempo; a formulação é natural em português e preserva a realidade do desenvolvimento.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: Equivalente corrente que abrange entendimento e discernimento.
- source_word: ἡλικίᾳ
  choice: estatura
  rationale: O termo pode indicar idade ou estatura. No contexto do crescimento de Jesus, “estatura” comunica naturalmente o desenvolvimento físico, enquanto a ambiguidade lexical é preservada em nota.
- source_word: χάριτι
  choice: favor
  rationale: Na relação paralela com Deus e com as pessoas, χάρις indica mais naturalmente favor ou boa acolhida do que a noção teológica abstrata de graça.
- source_word: παρὰ θεῷ
  choice: diante de Deus
  rationale: παρά com o dativo pode indicar consideração ou posição aos olhos de alguém; “diante de Deus” é idiomático e se estende naturalmente ao complemento paralelo.
- source_word: ἀνθρώποις
  choice: pessoas
  rationale: O plural refere-se aqui aos seres humanos em geral; “pessoas” transmite essa abrangência com clareza no português moderno, sem sugerir apenas indivíduos do sexo masculino.
theological_decisions:
- issue: O desenvolvimento humano de Jesus
  choice: Traduzir diretamente que Jesus continuava crescendo em sabedoria, estatura e favor.
  alternative: Atenuar ou obscurecer seu desenvolvimento para evitar tensão cristológica.
  rationale: O grego afirma progresso real. A tradução preserva sem explicação harmonizadora a tensão entre essa descrição de seu desenvolvimento humano e as afirmações teológicas sobre sua identidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Continuava crescendo” explicita de modo natural o aspecto durativo do imperfeito; “diante de Deus e das pessoas” evita rigidez e comunica a relação expressa por παρά com o dativo.
