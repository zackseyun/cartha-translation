  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: pt
  text: José também subiu da Galileia, da cidade de Nazaré, para a Judeia, para a cidade de Davi, chamada Belém, porque era da casa e da linhagem de Davi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέβη
  choice: subiu
  rationale: Preserva o idioma de deslocamento ascendente e sua nuance geográfica, sem acrescentar um verbo explicativo.
- source_word: δὲ καὶ
  choice: também
  rationale: Mantém a continuidade narrativa e a ideia aditiva; em português, não é necessário reproduzir δέ por uma conjunção separada.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: da Galileia, da cidade de Nazaré
  rationale: Reproduz a origem regional e local expressa no grego, com formulação natural em português.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: para a Judeia
  rationale: Usa a designação geográfica corrente para a região no período romano.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: para a cidade de Davi chamada Belém
  rationale: Conserva a designação davídica e a identificação de Belém, evitando uma relativa pesada sem perder conteúdo.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: porque era
  rationale: Expressa naturalmente em português a causa indicada por διά com infinitivo articular; o sujeito José permanece claro.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: da casa e da linhagem de Davi
  rationale: Mantém os dois termos de ancestralidade. “Casa” conserva o sentido dinástico, e “linhagem” comunica a descendência ancestral de modo claro.
theological_decisions:
- issue: Terminologia da descendência davídica
  choice: da casa e da linhagem de Davi
  alternative: da casa e da família de Davi
  rationale: Preserva a distinção entre οἶκος e πατριά e a ênfase de Lucas na ascendência davídica de José, sem desenvolver implicações doutrinárias além do texto.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a repetição do ponto de partida regional e local e mantém o título bíblico “cidade de Davi”. Não há marcador de nota, pois a nota inglesa fornecida parece estar deslocada: seu conteúdo se refere à terminologia final de ancestralidade, não a “Galileia”.'
