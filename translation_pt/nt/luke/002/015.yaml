revisions:
- from: 'E aconteceu que, quando os anjos se afastaram deles e foram para o céu, os pastores disseram uns aos outros: “Vamos agora até Belém[a] e vejamos isso que aconteceu[b], que o Senhor nos deu a conhecer”.'
  to: 'E aconteceu que, quando os anjos partiram deles para o céu, os pastores disseram uns aos outros: “Vamos agora até Belém[a] e vejamos este acontecimento que ocorreu[b], que o Senhor nos deu a conhecer.”'
  rationale: A revisão torna a partida dos anjos uma única ação, como no grego, e substitui a construção mais vaga «isso que aconteceu» por «este acontecimento que ocorreu», que representa com maior precisão o fato referido por ῥῆμα e pelo particípio γεγονός. As notas mantêm as alternativas lexicais e seus respectivos âncoras.
