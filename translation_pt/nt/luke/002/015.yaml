id: LUK.2.15
reference: Luke 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: pt
  text: 'E aconteceu que, quando os anjos partiram deles para o céu, os pastores disseram uns aos outros: “Vamos agora até Belém[a] e vejamos este acontecimento que ocorreu[b], que o Senhor nos deu a conhecer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Belém”; mais literalmente, “até Belém”.
    reason: lexical_alternative
  - marker: b
    text: Ou “este assunto que aconteceu” ou “esta coisa que aconteceu”. A palavra grega ῥῆμα pode significar “palavra”, “assunto” ou “coisa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas sem recorrer ao arcaico “e sucedeu que”.
- source_word: ὡς
  choice: quando
  rationale: Introduz naturalmente em português a circunstância temporal da partida dos anjos.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: se afastaram deles e foram para o céu
  rationale: Expressa tanto o afastamento em relação aos pastores quanto o destino indicado por εἰς τὸν οὐρανόν, em ordem natural no português.
- source_word: οἱ ἄγγελοι
  choice: os anjos
  rationale: Equivalente direto e corrente.
- source_word: οἱ ποιμένες
  choice: os pastores
  rationale: Equivalente direto e corrente no contexto.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: disseram uns aos outros
  rationale: Introduz o discurso direto de modo idiomático; o imperfeito grego não exige aqui uma construção durativa em português.
- source_word: Διέλθωμεν δὴ
  choice: Vamos agora
  rationale: “Vamos” comunica a força exortativa do subjuntivo, e “agora” transmite a urgência ou prontidão acrescentada por δή.
- source_word: ἕως Βηθλέεμ
  choice: até Belém
  rationale: “Até” preserva o sentido de ἕως e soa natural em português como indicação do destino.
- source_word: καὶ ἴδωμεν
  choice: e vejamos
  rationale: Mantém a segunda exortação coordenada e a forma subjuntiva do original.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: isso que aconteceu
  rationale: No contexto, ῥῆμα aponta para o fato anunciado e ocorrido. A formulação é clara e natural, enquanto a nota preserva a amplitude lexical de “palavra”, “assunto” ou “coisa”.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: que o Senhor nos deu a conhecer
  rationale: Reproduz o sentido de “tornar conhecido” sem restringi-lo a “contar” nem intensificá-lo com linguagem técnica de revelação.
theological_decisions:
- issue: Referente de ὁ κύριος
  choice: o Senhor
  alternative: Explicitar “Deus” ou identificar mais especificamente uma pessoa divina
  rationale: O contexto apresenta Deus como a fonte do que os anjos anunciaram, mas o texto emprega apenas “o Senhor”. A tradução mantém essa designação e não impõe uma especificação teológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da primeira oração foi levemente ajustada para evitar rigidez, e as ambiguidades relevantes de ῥῆμα e κύριος foram preservadas sem explicação denominacional.
