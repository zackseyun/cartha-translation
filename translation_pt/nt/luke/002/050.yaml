source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: pt
  text: E eles não entenderam o que ele lhes tinha dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra”, “a declaração”, “o dito” ou “o assunto de que ele lhes falou”.
    reason: 'Alternativa lexical: ῥῆμα possui amplitude semântica e pode designar uma palavra ou declaração falada, bem como um assunto.'
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo narrativo simples, sem acrescentar uma força adversativa que não está expressa no grego.
- source_word: αὐτοὶ
  choice: eles
  rationale: Retoma os pais de Jesus no contexto. O pronome explícito é mantido de modo natural em português, sem a ênfase excessiva de “eles mesmos”.
- source_word: οὐ συνῆκαν
  choice: não entenderam
  rationale: Expressa diretamente a falta de compreensão indicada por συνίημι, em linguagem atual e clara.
- source_word: τὸ ῥῆμα
  choice: o que
  rationale: Neste contexto, ῥῆμα se refere ao que Jesus acabara de dizer. A construção “o que ele lhes tinha dito” é natural em português e mantém aberta, em nota, a amplitude lexical de palavra, declaração, dito ou assunto.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: ele lhes tinha dito
  rationale: Traduz a ação de falar dirigida a eles. O mais-que-perfeito composto explicita naturalmente em português que a fala precedeu a falta de compreensão, sem mudar a sequência dos acontecimentos.
theological_decisions:
- issue: Retrato narrativo da reação dos pais de Jesus
  choice: Afirmar de maneira direta que eles não entenderam o que Jesus lhes disse.
  alternative: “Não entenderam plenamente” ou “não aceitaram”.
  rationale: O grego indica falta de entendimento, não entendimento parcial nem rejeição. A formulação preserva a tensão narrativa sobre a identidade e a missão de Jesus sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A colocação pronominal em “lhes tinha dito” é natural e evita uma tradução rígida da oração relativa grega.
