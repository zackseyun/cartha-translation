source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: pt
  text: E ele veio, no Espírito[a], ao templo; e, quando os pais[b] introduziram o menino Jesus, a fim de fazerem, a respeito dele, o que era costume segundo a Lei,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo Espírito”. A expressão grega admite as duas formas; “no Espírito” reproduz mais de perto sua construção e o destaque repetido que Lucas dá ao Espírito Santo neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “os pais”. Lucas usa aqui a linguagem familiar comum para Maria e José em seu cuidado de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: no Espírito
  rationale: O artigo e o contexto imediato de Lucas 2:25–27 favorecem uma referência ao Espírito Santo. “No Espírito” preserva a preposição grega e a nuance da atuação do Espírito, sem definir mais precisamente o modo dessa atuação.
- source_word: ἱερόν
  choice: templo
  rationale: Ἱερόν designa aqui o complexo do templo, não especificamente o santuário interior. “Templo” é a forma corrente e suficientemente abrangente em português.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: quando ... levaram para dentro
  rationale: A construção com infinitivo articular tem sentido temporal. Esta formulação natural em português também conserva a ideia de entrada expressa pelo verbo composto.
- source_word: γονεῖς
  choice: os pais
  rationale: É o sentido direto e comum do termo no contexto familiar. Lucas descreve Maria e José segundo seu papel social no cuidado de Jesus, sem fazer aqui uma afirmação sobre paternidade biológica.
- source_word: παιδίον Ἰησοῦν
  choice: o menino Jesus
  rationale: Παιδίον refere-se aqui à criança ainda pequena; “o menino Jesus” é uma expressão natural em português e mantém o nome em aposição.
- source_word: τοῦ ποιῆσαι αὐτοὺς
  choice: a fim de fazer
  rationale: O infinitivo articular no genitivo expressa propósito, e αὐτούς tem “os pais” como sujeito implícito. Em português, o sujeito permanece claro pela oração anterior.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: segundo o costume da Lei
  rationale: Εἰθισμένον indica aquilo que era costumeiro ou estabelecido como prática. A formulação mantém a relação explícita com a Lei e soa natural em português.
- source_word: περὶ αὐτοῦ
  choice: por ele
  rationale: Περί com genitivo expressa referência ou relação. No contexto ritual, “por ele” comunica naturalmente que os pais realizariam o que dizia respeito a Jesus.
theological_decisions:
- issue: A identidade do “Espírito” que orienta Simeão
  choice: Espírito Santo
  alternative: o espírito ou a disposição interior de Simeão
  rationale: As referências repetidas ao Espírito Santo no contexto imediato favorecem essa leitura. A inicial maiúscula a sinaliza, enquanto “no Espírito” conserva a forma preposicional e não elimina a possível nuance instrumental.
- issue: A designação de Maria e José como “os pais”
  choice: traduzir γονεῖς diretamente como “os pais”
  alternative: “os responsáveis” ou “José e Maria”
  rationale: A linguagem familiar comum de Lucas deve ser preservada, sem ser enfraquecida por preocupação doutrinária nem ampliada além do grego. No contexto, ela descreve o papel de Maria e José na família e no cuidado de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a coordenação do grego e a vírgula final porque o versículo continua sintaticamente no seguinte. “Lei” recebe inicial maiúscula como referência contextual à Lei mosaica.
