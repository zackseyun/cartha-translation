  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: pt
  text: E quando ele tinha doze anos, enquanto eles subiam[a] conforme o costume da festa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eles subiram”. O particípio grego descreve a subida como simultânea ao restante da ação; uma tradução com verbo finito também é possível.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a festa da Páscoa, mencionada no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὅτε
  choice: E, quando
  rationale: Mantém tanto a continuidade narrativa expressa por καί como o valor temporal de ὅτε.
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: ele tinha doze anos
  rationale: A construção idiomática com γίνομαι e o genitivo de idade indica que Jesus estava nessa idade; esta é a forma mais natural em português, sem sugerir necessariamente o instante exato do aniversário.
- source_word: ἀναβαινόντων αὐτῶν
  choice: enquanto eles subiam
  rationale: O genitivo absoluto indica uma ação simultânea. “Eles” preserva o pronome grego sem explicitar além do texto que se trata do grupo familiar; “subiam” conserva a ideia tradicional de subir a Jerusalém, já indicada no contexto anterior.
- source_word: κατὰ τὸ ἔθος
  choice: conforme o costume
  rationale: Expressa de modo natural a conformidade com uma prática estabelecida e mantém o sentido definido do substantivo grego.
- source_word: τῆς ἑορτῆς
  choice: da festa
  rationale: ἑορτή designa uma celebração religiosa; “festa” é corrente, digna e adequada ao contexto da Páscoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com boa legibilidade brasileira. A estrutura permanece propositalmente incompleta porque a oração continua no versículo seguinte; preserva-se também a referência implícita a Jerusalém, sem acrescentá-la ao texto principal.
