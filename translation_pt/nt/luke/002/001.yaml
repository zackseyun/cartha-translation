id: LUK.2.1
reference: Luke 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: pt
  text: Naqueles dias, aconteceu que saiu um decreto de César Augusto para que todo o mundo habitado fosse registrado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o mundo romano” ou “todo o império”. O termo grego muitas vezes se refere ao mundo habitado tal como era concebido no contexto do Império Romano.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: aconteceu que
  rationale: A fórmula narrativa introduz um novo acontecimento. “Aconteceu que” conserva seu valor sem recorrer ao arcaico “sucedeu que”; δὲ funciona como transição narrativa e não exige uma palavra separada em português.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Expressão temporal corrente, natural e próxima da estrutura grega.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Preserva a imagem do decreto que procede da autoridade e continua claro em português atual.
- source_word: δόγμα
  choice: decreto
  rationale: Designa aqui uma ordem imperial; “decreto” é claro e tem o nível adequado de formalidade.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: de César Augusto
  rationale: παρά com o genitivo indica fonte ou origem; “de César Augusto” expressa isso de modo idiomático.
- source_word: ἀπογράφεσθαι
  choice: fosse registrado
  rationale: O verbo indica inscrição ou registro oficial, frequentemente ligado a censo ou tributação. A tradução evita acrescentar uma finalidade específica que o versículo não explicita.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: todo o mundo habitado
  rationale: Mantém o sentido lexical de οἰκουμένη e evita reduzir silenciosamente a expressão ao Império Romano, embora esse seja o contexto histórico provável.
theological_decisions:
- issue: Alcance de οἰκουμένη
  choice: todo o mundo habitado
  alternative: todo o mundo romano; todo o império
  rationale: A expressão grega pode designar o mundo habitado concebido no horizonte imperial romano. O texto principal preserva sua amplitude lexical, e a nota apresenta as leituras contextuais sem decidir além do que a formulação exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Naqueles dias, aconteceu que” soa mais natural em português do que a reprodução rígida da ordem grega. Evitou-se tanto o arcaísmo “sucedeu” quanto a explicitação excessiva de ἀπογράφεσθαι como recenseamento fiscal.
