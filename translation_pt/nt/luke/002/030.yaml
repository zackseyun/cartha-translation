  text: because my eyes have seen your salvation[a]
translation:
  language: pt
  text: porque os meus olhos viram a tua salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o teu Salvador». O grego diz «a tua salvação», mas, no contexto, a salvação de Deus está presente na pessoa de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Neste contexto, introduz a razão pela qual Simeão pode partir em paz; «porque» expressa com clareza o valor causal.
- source_word: εἶδον
  choice: viram
  rationale: O aoristo indica uma ação realizada. Em português, o pretérito perfeito simples é a forma natural para essa experiência recém-consumada.
- source_word: οἱ ὀφθαλμοί μου
  choice: os meus olhos
  rationale: Preserva a expressão corporal explícita e enfática do grego, natural também em português.
- source_word: τὸ σωτήριόν σου
  choice: a tua salvação
  rationale: σωτήριον designa literalmente salvação ou libertação, não usa o substantivo pessoal σωτήρ («Salvador»). A tradução mantém a formulação de Lucas e permite que o contexto mostre essa salvação presente em Jesus.
theological_decisions:
- issue: Se τὸ σωτήριόν σου deve ser traduzido pelo conceito «salvação» ou personalizado como «Salvador» por referir-se ao menino Jesus.
  choice: a tua salvação
  alternative: o teu Salvador
  rationale: A forma grega é σωτήριον, não o substantivo pessoal σωτήρ. «A tua salvação» preserva a tensão entre a dádiva salvadora de Deus e sua manifestação concreta na pessoa de Jesus, sem resolver interpretativamente a expressão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a construção vívida «os meus olhos» e usa «tua», em continuidade natural com a referência direta a Deus no contexto.
