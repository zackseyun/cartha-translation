id: LUK.17.13
reference: Luke 17:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: pt
  text: 'E eles ergueram a voz[a], dizendo: “Jesus, Mestre[b], tem misericórdia de nós!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “levantaram a voz”.
    reason: lexical_alternative
  - marker: b
    text: “Mestre” traduz o grego epistáta, forma de tratamento para alguém que exerce autoridade; não é a palavra normalmente traduzida por “Senhor” (kýrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo, sem acrescentar uma ideia temporal ausente do texto.
- source_word: αὐτοὶ
  choice: eles
  rationale: Representa o pronome explícito; em português, a forma simples é natural, enquanto “eles mesmos” daria ênfase excessiva neste contexto.
- source_word: ἦραν φωνὴν
  choice: ergueram a voz
  rationale: Preserva de modo natural a imagem do idioma grego, que indica falar em voz alta. O singular “a voz” também acompanha de perto a forma grega.
- source_word: λέγοντες
  choice: dizendo
  rationale: Conserva a estrutura participial do grego de maneira clara e idiomática em português.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: É o vocativo do nome próprio, vertido segundo sua forma portuguesa consagrada.
- source_word: ἐπιστάτα
  choice: Mestre
  rationale: Expressa uma forma respeitosa de tratamento dirigida a alguém com autoridade, sem confundi-la com κύριος, normalmente traduzido por “Senhor”.
- source_word: ἐλέησον
  choice: tem misericórdia
  rationale: Transmite o imperativo de um pedido urgente por compaixão e intervenção; é uma formulação natural e tradicionalmente inteligível em português.
- source_word: ἡμᾶς
  choice: de nós
  rationale: Completa idiomaticamente em português a expressão “ter misericórdia de” e representa o objeto plural grego.
theological_decisions:
- issue: Tradução de ἐπιστάτα como título dirigido a Jesus
  choice: Mestre
  alternative: Senhor
  rationale: O texto usa ἐπιστάτης, título que comunica autoridade e liderança, e não κύριος. “Mestre” preserva essa distinção lexical sem introduzir por meio da tradução as conotações cristológicas mais fortes que “Senhor” pode carregar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a imagem do original em “ergueram a voz” e preserva a distinção entre “Mestre” e “Senhor”.
