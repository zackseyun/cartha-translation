source:
  edition: robinson-pierpont-2005-byzantine
  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: pt
  text: Dois homens[a] estarão no campo; um será levado, e o outro será deixado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não aparece nos manuscritos gregos mais antigos, incluindo o Sinaítico e o Vaticano, do século IV, nem em antigas traduções coptas. Contudo, está presente na tradição ocidental, como no Códice Beza, do século V, na tradição majoritária bizantina e na Vulgata latina. É provável que copistas posteriores o tenham acrescentado para harmonizar esta passagem com Mateus 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: dois homens
  rationale: Embora o grego diga literalmente apenas “dois”, o masculino εἷς/ὁ ἕτερος indica duas pessoas do sexo masculino neste contexto; explicitar “homens” produz português natural.
- source_word: παραλαμβάνω
  choice: será levado
  rationale: Preserva a ideia de alguém ser tomado ou levado, sem definir além do texto o destino ou a finalidade desse ato.
- source_word: ἀφίημι
  choice: será deixado
  rationale: Expressa o contraste direto com “será levado” e mantém em aberto se o sentido contextual é ficar para trás ou ser abandonado.
- source_word: ἕτερος
  choice: o outro
  rationale: Refere-se naturalmente ao segundo dos dois homens já mencionados.
theological_decisions:
- issue: Destino daquele que é levado e daquele que é deixado
  choice: Não identificar explicitamente qual deles é salvo ou julgado.
  alternative: Interpretar “levado” como reunido para salvação e “deixado” como abandonado para juízo, ou o inverso.
  rationale: O versículo não declara o destino de nenhum dos dois; a tradução conserva a tensão escatológica e evita impor uma leitura denominacional.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A construção paralela reproduz a concisão do grego.
