id: LUK.17.31
reference: Luke 17:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: pt
  text: Naquele dia, quem estiver no terraço[a], tendo seus bens dentro de casa, não desça para buscá-los. Do mesmo modo, quem estiver no campo não volte para trás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o terraço plano da casa, usado como espaço acessível.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não volte para buscar o que ficou para trás”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Naquele dia
  rationale: Expressa naturalmente o valor temporal e preserva a ênfase demonstrativa de ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: quem estiver
  rationale: Preserva o futuro e o sentido geral da construção relativa em português corrente.
- source_word: ἐπὶ τοῦ δώματος
  choice: no terraço
  rationale: No contexto, δῶμα designa o terraço plano e acessível da casa, não simplesmente a cobertura inclinada evocada por “telhado”.
- source_word: τὰ σκεύη αὐτοῦ
  choice: seus bens
  rationale: Comunica de modo conciso os objetos ou pertences móveis da pessoa, sem restringir o termo a utensílios.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: não desça para buscá-los
  rationale: A proibição no imperativo aoristo exige ação urgente; “buscá-los” exprime naturalmente a descida para recolher os bens que estão na casa.
- source_word: ὁ ἐν ἀγρῷ
  choice: quem estiver no campo
  rationale: Reproduz o caráter representativo da expressão substantivada e mantém o paralelismo com a primeira oração.
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Conecta claramente a segunda proibição à primeira em linguagem natural.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: não volte para trás
  rationale: É uma formulação portuguesa natural para a ideia de retornar ao que ficou atrás, sem impor um objeto específico que o grego deixa implícito.
theological_decisions:
- issue: Urgência escatológica da imagem
  choice: Manter as ordens concretas de não descer e não voltar
  alternative: Parafrasear como uma advertência geral contra o apego aos bens
  rationale: A cena prática está ligada a “naquele dia”; preservá-la mantém a força e a tensão do texto sem convertê-lo em máxima moral abstrata.
- issue: Referente de εἰς τὰ ὀπίσω
  choice: Não especificar no texto principal aquilo para o qual a pessoa voltaria
  alternative: Traduzir “não volte para buscar o que ficou para trás”
  rationale: A expressão pode evocar pessoas, bens ou tudo o que ficou atrás. A tradução principal preserva essa abertura, e a nota registra a formulação explicitadora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Terraço” recebe nota cultural para evitar que se imagine apenas um telhado; a repetição de “quem estiver” conserva o paralelismo e a generalidade do original.
