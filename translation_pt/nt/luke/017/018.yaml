  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: pt
  text: Não se achou ninguém que voltasse para dar glória a Deus, a não ser este estrangeiro?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este homem de outro povo” ou “este forasteiro”; o termo grego designa um estrangeiro, alguém de fora de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: se achou ninguém
  rationale: A construção impessoal preserva de modo natural em português o aoristo passivo dentro da pergunta retórica.
- source_word: ὑποστρέψαντες
  choice: que voltasse
  rationale: Expressa com clareza a ação de retornar, anterior e ligada ao ato de dar glória.
- source_word: δοῦναι δόξαν
  choice: dar glória
  rationale: Mantém a expressão bíblica próxima do grego, sem reduzi-la apenas a 'louvar'.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: É a forma natural em português para o dativo que indica a quem a glória é dada.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Equivalente idiomático e claro da construção de exceção.
- source_word: ἀλλογενής
  choice: estrangeiro
  rationale: Indica alguém de outro povo e preserva a condição de pessoa de fora de Israel.
- source_word: οὗτος
  choice: este
  rationale: Conserva a ênfase demonstrativa do texto grego.
theological_decisions:
- issue: Condição étnico-religiosa externa do homem curado
  choice: este estrangeiro
  alternative: este homem de outro povo; este forasteiro
  rationale: A formulação conserva a ironia de que somente alguém de fora de Israel voltou para honrar a Deus, sem acrescentar identificação além do que este versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A pergunta retórica e a expressão tradicional 'dar glória a Deus' foram preservadas.
