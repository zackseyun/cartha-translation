source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: pt
  text: Haverá duas mulheres moendo juntas[a]; uma será levada[b], mas a outra será deixada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no mesmo lugar”. A expressão grega pode significar “juntas” ou “no mesmo lugar”.
    reason: lexical_alternative
  - marker: b
    text: “Será levada” não especifica por si só se a pessoa é levada para a salvação ou para o juízo; o grego deixa essa questão para o contexto mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: Haverá
  rationale: O futuro de εἰμί introduz a cena. “Haverá” é idiomático em português e preserva o sentido futuro e existencial.
- source_word: δύο / ἀλήθουσαι
  choice: duas mulheres moendo
  rationale: O numeral significa “duas”, e o particípio feminino plural identifica as pessoas como mulheres. “Moendo” traduz diretamente a atividade sem explicitar “grãos”, que está implícito.
- source_word: ἐπὶ τὸ αὐτό
  choice: juntas
  rationale: A expressão pode indicar associação ou presença no mesmo lugar. “Juntas” é natural no contexto, enquanto a alternativa espacial é registrada em nota.
- source_word: ἡ μία
  choice: uma
  rationale: Distingue a primeira das duas mulheres; “uma” é a formulação portuguesa natural nesse contraste.
- source_word: παραλημφθήσεται
  choice: será levada
  rationale: O futuro passivo de παραλαμβάνω é vertido de modo transparente, sem decidir se a ação conduz à salvação ou ao juízo.
- source_word: ἡ δὲ ἑτέρα
  choice: mas a outra
  rationale: δέ assinala o contraste, e ἑτέρα identifica a segunda mulher.
- source_word: ἀφεθήσεται
  choice: será deixada
  rationale: O futuro passivo de ἀφίημι indica que a outra ficará ou será deixada. A formulação evita acrescentar a ideia mais forte de abandono.
theological_decisions:
- issue: Se “será levada” e “será deixada” devem indicar salvação ou juízo.
  choice: Manter “uma será levada, mas a outra será deixada” sem especificar o destino de cada uma.
  alternative: Interpretar a levada como salva e a deixada como julgada, ou a levada como julgada e a deixada como poupada.
  rationale: O versículo descreve a separação, mas não define por si só o valor teológico de cada ação. A tradução preserva essa tensão contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A estrutura concisa e o paralelismo do grego foram preservados.
