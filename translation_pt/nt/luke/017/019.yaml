id: LUK.17.19
reference: Luke 17:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: pt
  text: 'E ele lhe disse: “Levante-se e vá. A sua fé[a] salvou você[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiança”. A palavra grega também pode expressar confiança ou fidelidade, embora “fé” seja a tradução mais provável aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou “curou você” ou “fez você ficar bem”. O verbo grego pode se referir a salvação, resgate ou cura.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Forma narrativa natural e concisa em português; o pronome retoma o samaritano curado sem acrescentar identificação interpretativa.
- source_word: Ἀναστὰς
  choice: Levante-se
  rationale: O particípio aoristo funciona em conjunto com a ordem seguinte. “Levante-se” conserva a força imperativa e o tom digno em português atual.
- source_word: πορεύου
  choice: vá
  rationale: Equivalente idiomático e direto do imperativo de πορεύομαι, sem o tom tradicional de “siga o seu caminho”.
- source_word: πίστις
  choice: fé
  rationale: É o equivalente principal e consagrado de πίστις neste contexto, embora “confiança” seja semanticamente possível; a alternativa é preservada em nota.
- source_word: σέσωκέν
  choice: salvou
  rationale: σῴζω pode indicar salvação, resgate ou cura. “Salvou” preserva a amplitude teológica da declaração e evita reduzi-la apenas à cura física, já que os dez haviam sido purificados.
- source_word: σε
  choice: você
  rationale: Objeto direto expresso de modo claro e amplamente compreensível em português moderno.
theological_decisions:
- issue: Sentido de σέσωκέν σε num contexto de cura
  choice: salvou você
  alternative: curou você; fez você ficar bem
  rationale: Embora σῴζω possa referir-se à cura física, o contraste narrativo entre os dez purificados e o único que voltou glorificando a Deus favorece uma formulação que mantenha o sentido mais amplo. A nota preserva as leituras ligadas à cura sem eliminar a tensão do texto.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança
  rationale: Neste contexto, πίστις descreve a resposta confiante do homem a Jesus. “Fé” preserva a linguagem teológica normal sem excluir a nuance relacional de confiança, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Você” torna explícito o objeto sem recorrer ao lusitanismo “te”. A pontuação divide as duas ordens da declaração final, acompanhando o fluxo natural da fala.
