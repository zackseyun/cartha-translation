id: LUK.17.7
reference: Luke 17:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a slave plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: pt
  text: 'Mas qual de vocês, tendo um escravo[a] que esteja arando ou cuidando do rebanho, lhe dirá quando ele voltar do campo: “Venha imediatamente e recline-se à mesa”[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O grego doulos designa aqui uma pessoa submetida à autoridade de um senhor, não um trabalhador contratado.
    reason: alternative_reading
  - marker: b
    text: “Recline-se à mesa” reflete o costume antigo de comer reclinado; em linguagem mais livre, “sente-se para comer”.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: escravo
  rationale: O termo designa uma pessoa escravizada e submetida à autoridade do senhor, não um trabalhador contratado. “Escravo” preserva a força social e retórica da comparação.
- source_word: ἀροτριῶντα
  choice: que esteja arando
  rationale: Expressa diretamente a atividade agrícola de lavrar a terra com arado e mantém a construção participial de modo natural em português.
- source_word: ποιμαίνοντα
  choice: cuidando do rebanho
  rationale: O verbo significa exercer a atividade de pastor ou cuidar de um rebanho. A formulação é natural e evita especificar animais não mencionados no grego.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: quando ele voltar do campo
  rationale: O particípio dativo tem valor temporal e indica a chegada do escravo depois do trabalho no campo. “Voltar” explicita naturalmente o retorno sem alterar o sentido.
- source_word: ἐρεῖ αὐτῷ
  choice: lhe dirá
  rationale: Reproduz de forma concisa e idiomática o futuro “dirá a ele”.
- source_word: Εὐθέως
  choice: imediatamente
  rationale: Preserva a ideia de ação sem demora e se ajusta ao registro digno da fala.
- source_word: παρελθὼν
  choice: Venha
  rationale: O particípio acompanha a ordem principal e indica aproximação ou entrada; o imperativo “Venha” comunica essa função naturalmente.
- source_word: ἀνάπεσε
  choice: recline-se à mesa
  rationale: Preserva o costume antigo de tomar a refeição reclinado, em vez de modernizar silenciosamente a expressão como “sente-se para comer”.
theological_decisions:
- issue: Tradução de δοῦλος no contexto doméstico da parábola
  choice: escravo
  alternative: servo
  rationale: A assimetria entre senhor e escravo é essencial à pergunta retórica. “Escravo” preserva essa realidade social sem acrescentar uma interpretação teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem retórica e a relação social do texto grego foram preservadas; a postura antiga à mesa foi mantida no texto e esclarecida em nota.
