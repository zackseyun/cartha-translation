  terminology: «Sofra», «seja rejeitado» e «esta geração» são escolhas estáveis, compreensíveis e teologicamente não interpretativas. A redação não explicita indevidamente a origem da necessidade nem restringe «geração» a uma categoria doutrinária específica.
