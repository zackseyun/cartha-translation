source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: pt
  text: Mas primeiro é necessário que ele sofra muitas coisas e seja rejeitado por esta geração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: primeiro
  rationale: Advérbio que marca prioridade temporal; preserva de modo claro a sequência antes dos acontecimentos mencionados no contexto.
- source_word: δὲ
  choice: Mas
  rationale: Marca aqui uma transição com leve contraste em relação ao que precede.
- source_word: δεῖ
  choice: é necessário que
  rationale: Expressa necessidade com sua força intacta, sem explicitar na tradução se ela decorre diretamente do plano divino.
- source_word: αὐτὸν
  choice: ele
  rationale: Embora seja acusativo no grego como sujeito dos infinitivos, a construção portuguesa pede o pronome sujeito na oração introduzida por “que”.
- source_word: πολλὰ
  choice: muitas coisas
  rationale: O neutro plural funciona como objeto de παθεῖν; esta formulação preserva a amplitude das experiências de sofrimento.
- source_word: παθεῖν
  choice: sofra
  rationale: Equivalente direto e natural do infinitivo aoristo de πάσχω, mantendo a concisão e a gravidade.
- source_word: ἀποδοκιμασθῆναι
  choice: seja rejeitado
  rationale: Comunica claramente a rejeição após avaliação, sem recorrer a linguagem técnica ou pouco corrente.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: por esta geração
  rationale: Com o verbo passivo, ἀπό indica o agente ou a fonte da rejeição; “por” é idiomático em português, e “esta geração” conserva a referência aos contemporâneos.
theological_decisions:
- issue: Força de δεῖ em relação ao sofrimento do Filho do Homem
  choice: “é necessário que” preserva a necessidade sem identificar explicitamente sua origem.
  alternative: “deve” ou uma formulação que explicite o cumprimento do plano de Deus.
  rationale: Em Lucas, δεῖ muitas vezes sugere propósito divino, especialmente nas predições da paixão. A tradução mantém essa possibilidade implícita, sem acrescentar uma explicação ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em âmbito lusófono mais amplo. A construção “é necessário que” mantém a força de δεῖ e a ordem enfática de “primeiro”.
