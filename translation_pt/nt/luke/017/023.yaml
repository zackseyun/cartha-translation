base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: pt
  text: 'E dirão a vocês: “Olhem, ali!” ou: “Olhem, aqui!” Não saiam nem corram atrás.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não vão embora nem os persigam.” Aqui, “os” é suprido; o grego não explicita o objeto de “perseguir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: dirão a vocês
  rationale: O futuro ativo de λέγω introduz naturalmente a fala direta; “a vocês” expressa ὑμῖν em português claro e amplamente compreensível.
- source_word: Ἰδοὺ
  choice: Olhem
  rationale: Funciona como chamado dêitico de atenção. “Olhem” é atual e natural, sem o tom arcaico de “Eis”.
- source_word: ἐκεῖ / ὧδε
  choice: ali / aqui
  rationale: Mantém o contraste espacial conciso entre o lugar distante e o próximo.
- source_word: μὴ ἀπέλθητε
  choice: Não saiam
  rationale: A proibição com μή e o subjuntivo aoristo adverte contra ir ao lugar apontado; “não saiam” preserva a ideia concreta de deslocamento sugerida pelo contexto.
- source_word: μηδὲ διώξητε
  choice: nem corram atrás
  rationale: διώκω indica perseguir ou ir no encalço. A formulação idiomática preserva a força da advertência sem inserir no texto principal um objeto que o grego não explicita.
theological_decisions:
- issue: Objeto não expresso de διώξητε
  choice: 'Manter o objeto implícito: “nem corram atrás”'
  alternative: “nem corram atrás deles”
  rationale: O grego não declara se o objeto são pessoas, alegações ou supostos aparecimentos. O português permite a construção absoluta, preservando essa ambiguidade genuína.
- issue: Relação entre as duas exclamações dêiticas
  choice: Usar “ou” entre “ali” e “aqui”
  alternative: 'Justapor: “Olhem, ali! Olhem, aqui!”'
  rationale: O sentido contextual é de alegações alternativas sobre localização; “ou” torna essa relação natural em português sem acrescentar interpretação escatológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. O plural “vocês” evita regionalismo excessivo; “Olhem” comunica diretamente o valor de ἰδού.
