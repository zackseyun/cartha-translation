id: LUK.17.37
reference: Luke 17:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: pt
  text: 'Eles lhe perguntaram: “Onde, Senhor?” Ele lhes respondeu: “Onde estiver o corpo[a], ali também os abutres[b] serão reunidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Corpo” também pode ser traduzido como “cadáver”, tornando mais explícita a imagem de aves que se alimentam de carniça.
    reason: lexical_alternative
  - marker: b
    text: Ou “águias”. A palavra grega pode designar águias, mas, neste contexto de aves reunidas em torno de um corpo, “abutres” provavelmente comunica o sentido com mais clareza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: Eles lhe perguntaram
  rationale: A expressão introduz a reação dos interlocutores. Em português corrente, “perguntaram” comunica naturalmente que responderam ao ensino de Jesus com a pergunta seguinte, sem reproduzir a construção participial de modo artificial.
- source_word: Ποῦ
  choice: Onde
  rationale: O advérbio solicita uma localização, e a forma breve “Onde?” corresponde diretamente ao grego.
- source_word: κύριε
  choice: Senhor
  rationale: É o equivalente natural e tradicional de κύριε como forma de tratamento dirigida a Jesus.
- source_word: Ὅπου
  choice: Onde
  rationale: Mantém a formulação proverbial sem acrescentar uma nuance distributiva mais explícita, como “onde quer que”.
- source_word: σῶμα
  choice: corpo
  rationale: É o sentido usual de σῶμα e preserva a formulação menos explícita do grego, embora o contexto possa indicar um cadáver.
- source_word: ἀετοὶ
  choice: abutres
  rationale: Embora o termo também possa designar águias, aves que se reúnem em torno de um corpo são mais naturalmente entendidas aqui como abutres; a alternativa lexical é preservada em nota.
- source_word: ἐπισυναχθήσονται
  choice: serão reunidos
  rationale: Reproduz a forma futura passiva do grego e conserva o tom solene e proverbial da declaração.
theological_decisions:
- issue: Referente da imagem proverbial do corpo e dos abutres
  choice: Traduzir a imagem sem identificar seu referente
  alternative: Explicá-la como referência específica ao juízo final, aos exércitos romanos ou a um princípio geral de exposição e julgamento
  rationale: O texto grego não especifica o referente da metáfora. A tradução preserva a ambiguidade e a tensão interpretativa, sem impor uma leitura teológica ou histórica determinada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe do diálogo foi naturalizada, enquanto a formulação proverbial e a voz passiva da frase final foram preservadas.
