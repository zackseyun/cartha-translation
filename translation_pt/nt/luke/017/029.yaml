  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: pt
  text: mas, no dia em que Ló saiu de Sodoma, choveu do céu fogo e enxofre, e todos foram destruídos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: mas, no dia em que
  rationale: A construção dativa é temporal, e δέ marca uma leve contraposição ou continuação em relação ao versículo anterior; “mas” preserva essa ligação.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Expressa de modo direto e natural o movimento concreto indicado pelo aoristo de ἐξέρχομαι.
- source_word: Λὼτ
  choice: Ló
  rationale: Forma tradicional e corrente do nome em português.
- source_word: ἀπὸ Σοδόμων
  choice: de Sodoma
  rationale: A forma idiomática portuguesa do topônimo é singular, e a preposição comunica com naturalidade o ponto de partida.
- source_word: ἔβρεξεν
  choice: choveram
  rationale: O verbo grego é usado impessoalmente com “fogo e enxofre” como conteúdos da chuva. Em português, a construção pessoal no plural é clara e natural, sem acrescentar um agente explícito.
- source_word: πῦρ καὶ θεῖον
  choice: fogo e enxofre
  rationale: “Enxofre” é o sentido lexical moderno de θεῖον e preserva a imagem do juízo sem recorrer a vocabulário arcaico.
- source_word: ἀπ’ οὐρανοῦ
  choice: do céu
  rationale: Preserva o idioma bíblico e a alusão a Gênesis 19:24, sem explicitar além do texto a origem divina do juízo.
- source_word: ἀπώλεσεν πάντας
  choice: que destruíram a todos
  rationale: ἀπόλλυμι significa aqui “destruir”, e πάντας tem referente humano masculino plural implícito. A oração relativa evita ambiguidade gramatical em português e conserva a abrangência total.
theological_decisions:
- issue: Tradução de θεῖον no contexto de juízo
  choice: enxofre
  alternative: pedra de enxofre
  rationale: “Enxofre” comunica diretamente o sentido lexical e mantém a imagem bíblica tradicional em linguagem moderna.
- issue: Tradução de οὐρανός
  choice: céu
  alternative: firmamento
  rationale: “Céu” é a opção natural e preserva tanto a amplitude semântica do termo quanto a alusão a Gênesis, sem impor uma descrição cosmológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e cadência bíblica discreta. A redação preserva a ligação contrastiva com o contexto e evita arcaísmos.
