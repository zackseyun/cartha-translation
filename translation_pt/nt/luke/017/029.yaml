review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente a moldura temporal, a saída de Ló de Sodoma, o fogo e enxofre vindos do céu e a destruição total. Contudo, a formulação atual trata explicitamente “fogo e enxofre” como sujeito plural de ambos os verbos, enquanto o grego emprega verbos no singular, com construção impessoal em ἔβρεξεν e agente/sujeito não expresso em ἀπώλεσεν. Uma redação portuguesa impessoal preserva melhor essa forma sem acrescentar um agente.
  naturalness: A frase é clara e de bom registro. A construção impessoal “choveu do céu fogo e enxofre” é natural e concisa em português bíblico moderno. A coordenação final com passiva evita uma atribuição gramatical excessivamente específica da ação destrutiva.
  terminology: “Ló”, “Sodoma”, “fogo e enxofre” e “céu” são escolhas estabelecidas, modernas e fiéis. “Enxofre” traduz θεῖον com precisão, sem o arcaísmo de “enxofre e fogo” ou “brimstone/pedra de enxofre” como terminologia fixa.
