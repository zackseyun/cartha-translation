base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: pt
  text: 'E, se ele pecar contra você sete vezes em um dia e sete vezes voltar-se para você, dizendo: “Eu me arrependo”, você deverá perdoá-lo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltar para você”. O verbo grego pode significar “voltar” ou “voltar-se” neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: sete vezes no mesmo dia
  rationale: Expressa naturalmente em português o genitivo de tempo dentro do qual a ação se repete, sem exigir que o grego contenha literalmente o numeral “um”.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: pecar contra você
  rationale: A construção com εἰς σέ indica uma ofensa dirigida à pessoa interpelada; esta é a formulação portuguesa corrente e exata.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: voltar a você
  rationale: ἐπιστρέφω pode significar tanto voltar como virar-se; no contexto de repetidas ofensas seguidas por uma nova aproximação, “voltar a você” comunica bem o sentido.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém de modo natural a ligação participial e indica o que acompanha o retorno.
- source_word: Μετανοῶ
  choice: Eu me arrependo
  rationale: Preserva o sentido moral de μετανοέω e soa mais natural em português do que uma formulação nominal ou excessivamente literal.
- source_word: ἀφήσεις αὐτῷ
  choice: você deverá perdoá-lo
  rationale: O futuro indicativo tem força diretiva neste contexto; “deverá” conserva tanto uma tonalidade futura quanto a obrigação expressa, evitando a possível leitura meramente preditiva de “perdoará”.
theological_decisions:
- issue: Força do futuro indicativo ἀφήσεις
  choice: você deverá perdoá-lo
  alternative: você o perdoará; perdoe-o
  rationale: No ensino de Jesus, o futuro funciona como ordem ou obrigação. A tradução escolhida torna essa força clara sem intensificá-la para além do texto.
- issue: Sentido de Μετανοῶ
  choice: Eu me arrependo
  alternative: Sinto muito; mudei de ideia
  rationale: O verbo designa arrependimento, e não apenas tristeza, pedido de desculpas ou simples mudança intelectual.
- issue: Ambiguidade de ἐπιστρέψῃ
  choice: voltar a você, com alternativa em nota
  alternative: virar-se para você
  rationale: O contexto favorece a ideia de retorno, mas o campo semântico do verbo também permite a ideia de voltar-se para alguém; a nota preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” corresponde naturalmente ao singular de segunda pessoa no uso brasileiro corrente. “No mesmo dia” esclarece de forma idiomática que as sete ocorrências se dão dentro de um só dia. A colocação pronominal em “perdoá-lo” mantém um registro cuidado sem soar arcaico.
