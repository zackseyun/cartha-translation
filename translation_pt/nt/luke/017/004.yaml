  source_fidelity: A tradução comunica corretamente a ofensa contra o interlocutor, a repetição sete vezes dentro de um dia, a declaração de arrependimento e a força diretiva de ἀφήσεις. Contudo, “no mesmo dia” explicita “mesmo”, que não está formulado no grego, embora a concentração das ocorrências em um dia esteja implicada. “Voltar a você” é menos idiomático em português e não exprime tão claramente a nuance de ἐπιστρέψῃ πρὸς σέ.
  naturalness: “Pecar contra você”, “Eu me arrependo” e “você deverá perdoá-lo” são naturais, claros e adequados ao registro. “Sete vezes em um dia” é uma formulação idiomática sem a explicitação desnecessária de “mesmo”. “Voltar-se para você” é mais natural e semanticamente mais próximo neste contexto do que “voltar a você”.
  terminology: “Arrependo” preserva adequadamente μετανοῶ, sem reduzi-lo a simples pedido de desculpas. “Deverá perdoá-lo” comunica de modo sóbrio a função diretiva do futuro ἀφήσεις. A alternativa lexical para ἐπιστρέφω deve apresentar “voltar” como alternativa, não introduzir uma construção condicional que não corresponde exatamente ao ponto da nota.
