  - severity: medium
    issue: “Voltar a você” é pouco idiomático e pode sugerir retorno a uma pessoa como destino, em vez de nova aproximação dirigida a ela.
    rationale: ἐπιστρέψῃ πρὸς σέ permite “voltar-se para você” ou “voltar para você”. “Voltar-se para você” conserva bem a direção indicada por πρός e funciona naturalmente com o particípio “dizendo”.
