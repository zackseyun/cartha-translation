id: LUK.17.10
reference: Luke 17:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy slaves[b]; we have done what we were obligated to do.’
translation:
  language: pt
  text: 'Assim também vocês, quando tiverem feito tudo o que lhes foi ordenado, digam: “Somos escravos inúteis[a]; fizemos o que tínhamos obrigação de fazer[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos sem proveito” ou “escravos que não dão lucro”. O adjetivo grego pode indicar falta de utilidade ou proveito. Neste contexto, a expressão indica que o cumprimento do dever não dá direito a recompensa, e não necessariamente que os discípulos não tenham valor.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que era nosso dever fazer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: Liga diretamente a aplicação à ilustração anterior e conserva de modo natural a força comparativa e inferencial.
- source_word: ὅταν ποιήσητε
  choice: quando tiverem feito
  rationale: A construção com ὅταν e o subjuntivo aoristo aponta para uma situação geral ou futura em que a ação estará concluída antes da ordem de dizer.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: tudo o que lhes foi ordenado
  rationale: Preserva o sentido autoritativo de διατάσσω e expressa naturalmente o dativo ὑμῖν em português.
- source_word: λέγετε
  choice: digam
  rationale: O imperativo presente é vertido pelo imperativo simples, idiomático neste ensino de aplicação geral.
- source_word: Δοῦλοι
  choice: escravos
  rationale: O contexto imediato apresenta explicitamente uma relação entre senhor e escravo; portanto, 'escravos' conserva melhor a condição social e a força retórica de δοῦλοι do que 'servos'.
- source_word: ἀχρεῖοί
  choice: sem mérito
  rationale: No contexto, o termo indica que o cumprimento da obrigação não cria lucro excedente nem direito a recompensa. 'Sem mérito' comunica a ausência de reivindicação sem sugerir necessariamente inutilidade absoluta.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: o que tínhamos obrigação de fazer
  rationale: ὀφείλω expressa dever ou obrigação; esta formulação é clara, atual e mantém esse sentido.
- source_word: πεποιήκαμεν
  choice: fizemos
  rationale: O perfeito apresenta a ação como concluída e relevante no momento da declaração. Em português, o pretérito perfeito simples é a forma natural para esse valor.
theological_decisions:
- issue: Tradução de δοῦλοι na analogia do discipulado
  choice: escravos
  alternative: servos
  rationale: A cena anterior depende da relação assimétrica entre senhor e escravo. A escolha mantém essa força histórica e retórica sem suavizar a imagem.
- issue: Sentido de ἀχρεῖοι
  choice: sem mérito
  alternative: inúteis; sem valor; que não dão lucro
  rationale: A afirmação enfatiza que a obediência não torna o senhor devedor nem fundamenta uma reivindicação de recompensa. A alternativa literal 'inúteis' poderia ser entendida como negação absoluta do valor ou da utilidade dos discípulos; a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' é natural no português contemporâneo. A formulação mantém a imagem social forte do texto e registra em nota a ambiguidade de ἀχρεῖοι.
