id: LUK.17.22
reference: Luke 17:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: pt
  text: 'Então ele disse aos discípulos: “Virão dias em que vocês desejarão muito ver um dos dias do Filho do Homem[a], e não o verão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os dias do Filho do Homem” pode se referir ao tempo de sua presença e atuação ou, mais especificamente, à sua revelação futura; a formulação grega deixa o alcance em aberto.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Então ele disse
  rationale: δέ é uma conexão narrativa leve; “Então” dá fluidez natural sem criar um contraste forte.
- source_word: πρὸς τοὺς μαθητάς
  choice: aos discípulos
  rationale: O grego traz o artigo, mas não um possessivo explícito; por isso, evita-se acrescentar “seus”.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Virão dias
  rationale: Reproduz de modo natural e digno a fórmula profética que anuncia um tempo futuro.
- source_word: ἐπιθυμήσετε
  choice: vocês desejarão muito
  rationale: Expressa a intensidade de ἐπιθυμέω em português corrente, sem reduzir o termo a uma vontade indiferente.
- source_word: μίαν τῶν ἡμερῶν
  choice: um dos dias
  rationale: Preserva o genitivo partitivo e a referência a um único dia dentro de um conjunto.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Mantém literalmente o título usado por Jesus e suas ressonâncias bíblicas e teológicas.
- source_word: ἰδεῖν
  choice: ver
  rationale: Equivalente simples e natural do infinitivo grego neste complemento de desejo.
- source_word: καὶ οὐκ ὄψεσθε
  choice: mas não o verão
  rationale: Embora καί seja normalmente “e”, “mas” comunica em português a oposição contextual natural entre o desejo e sua frustração; “o” retoma “um dos dias”.
theological_decisions:
- issue: Sentido de “os dias do Filho do Homem”
  choice: Manter a expressão aberta, com sua carga escatológica, sem limitá-la exclusivamente ao ministério terreno de Jesus nem à sua revelação futura.
  alternative: Entender a expressão somente como os dias da presença terrena de Jesus, ou somente como o tempo futuro de sua revelação e juízo.
  rationale: A formulação grega permite que a saudade da presença de Jesus e a expectativa da manifestação futura do Filho do Homem permaneçam em tensão; a tradução não deve resolver o que o texto deixa aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” como plural corrente e preserva o título tradicional “Filho do Homem”.
