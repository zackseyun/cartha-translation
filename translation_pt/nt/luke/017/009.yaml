  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the slave because he did what was commanded?[a]
translation:
  language: pt
  text: Será que ele agradece ao escravo[a] por ter feito o que lhe foi ordenado?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo grego doulos designa alguém sujeito à autoridade de um senhor.
    reason: alternativa lexical
lexical_decisions:
- source_word: μὴ
  choice: Será que ...?
  rationale: Com o indicativo, μή introduz uma pergunta retórica que espera resposta negativa. Em português corrente, “Será que...?” comunica naturalmente essa expectativa sem acrescentar uma negação ausente da forma da pergunta.
- source_word: ἔχει χάριν
  choice: agradece
  rationale: A expressão ἔχειν χάριν τινί significa sentir ou demonstrar gratidão a alguém. “Agradece” é conciso, natural e adequado ao contexto.
- source_word: δούλῳ
  choice: escravo
  rationale: Neste contexto de senhor, ordens e obrigação, “escravo” preserva a condição jurídica e social expressa por δοῦλος, bem como a assimetria necessária ao argumento.
- source_word: ὅτι
  choice: por
  rationale: ὅτι apresenta a razão da suposta gratidão. Na construção portuguesa “agradecer ... por”, a preposição “por” expressa essa relação de modo idiomático.
- source_word: ἐποίησεν
  choice: ter feito
  rationale: O infinitivo composto após “por” expressa naturalmente a ação anterior de cumprir aquilo que havia sido ordenado.
- source_word: τὰ διαταχθέντα
  choice: o que lhe foi ordenado
  rationale: O particípio perfeito passivo substantivado significa literalmente aquilo que foi ordenado. A inclusão de “lhe” torna explícito em português o destinatário implícito da ordem sem alterar o sentido.
theological_decisions:
- issue: Tradução de δοῦλος no contexto parabólico de senhor e escravo
  choice: escravo
  alternative: servo
  rationale: A lógica da pergunta depende da obrigação imposta a alguém sob plena autoridade do senhor. “Escravo” mantém essa assimetria social e evita suavizar o cenário pressuposto pela parábola.
translation_notes:
  register: Português moderno, claro e digno, com formulação retórica natural. “Será que” sinaliza a resposta negativa esperada, enquanto “escravo” conserva a força histórica e social do original.
