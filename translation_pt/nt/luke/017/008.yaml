source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: pt
  text: 'Ao contrário, não lhe dirá: “Prepare algo para eu comer, prenda as vestes à cintura[a] e sirva-me até que eu tenha comido e bebido[b]. Depois disso, você comerá e beberá?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cingindo-se”. Prender as vestes à cintura permitia trabalhar com mais facilidade.
    reason: cultural_note
  - marker: b
    text: 'Ou: “até que eu coma e beba”. A tradução no texto ressalta que ele termina de comer e beber antes de chegar a vez daquele que o serve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Ao contrário, não lhe dirá
  rationale: A expressão introduz uma pergunta retórica contrastiva que espera resposta afirmativa. “Ao contrário” preserva a força adversativa de ἀλλά, e “não lhe dirá” reproduz naturalmente essa expectativa em português.
- source_word: ἐρεῖ αὐτῷ
  choice: lhe dirá
  rationale: Mantém o futuro e o objeto indireto explícito, introduzindo de modo natural a fala direta.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Prepare o meu jantar
  rationale: δειπνάω se refere a tomar a refeição principal, normalmente à tarde ou à noite. No contexto doméstico, “prepare o meu jantar” comunica de modo claro e conciso o sentido de preparar aquilo que o senhor comerá.
- source_word: περιζωσάμενος
  choice: apronte-se para servir
  rationale: O particípio descreve o ato de prender a roupa à cintura para trabalhar. A formulação funcional é compreensível hoje, enquanto a nota preserva a imagem cultural concreta.
- source_word: διακόνει μοι
  choice: sirva-me
  rationale: No contexto, o verbo indica serviço à mesa. “Sirva-me” é direto e evita a conotação eclesiástica que “ministre-me” teria.
- source_word: ἕως φάγω καὶ πίω
  choice: até que eu tenha comido e bebido
  rationale: O pretérito perfeito composto do subjuntivo destaca o término das ações antes de chegar a vez do outro personagem, sem alterar a relação temporal do grego.
- source_word: μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressão temporal idiomática que conserva claramente a sequência dos acontecimentos.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: você comerá e beberá
  rationale: Os futuros são traduzidos diretamente. O pronome explícito “você” corresponde à ênfase de σύ e contrasta a vez daquele que serve com a de quem é servido.
theological_decisions:
- issue: Terminologia do papel social na parábola
  choice: Manter apenas os pronomes e as ordens presentes neste versículo, sem acrescentar “servo” ou “escravo”.
  alternative: Explicitar “servo” ou “escravo” com base no contexto do versículo anterior.
  rationale: Embora o contexto identifique a pessoa como δοῦλος, este versículo emprega pronomes, formas verbais e imperativos. Não acrescentar o substantivo preserva a forma do texto e evita intensificar ou atenuar por iniciativa editorial a condição social pressuposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícita a ênfase do pronome grego σύ sem inserir um substantivo ausente do versículo. A imagem antiga de cingir as vestes é apresentada funcionalmente no texto e preservada na nota.
