  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: pt
  text: 'Quando os fariseus lhe perguntaram quando viria o Reino de Deus, ele lhes respondeu: “O Reino de Deus não vem de modo que possa ser observado[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com observação”, “de forma observável” ou “mediante cuidadosa vigilância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Quando os fariseus lhe perguntaram
  rationale: A oração temporal natural em português preserva a circunstância do particípio aoristo passivo e identifica os fariseus como agentes. O δέ funciona como transição leve e não exige um marcador explícito aqui.
- source_word: πότε ἔρχεται
  choice: quando viria
  rationale: O presente grego tem orientação futura na pergunta. O futuro do pretérito é idiomático no discurso indireto português após um verbo no passado.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão neotestamentária reconhecível e transparente; a inicial maiúscula em “Reino” ajuda a indicar o conceito teológico sem acrescentar interpretação.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: ele lhes respondeu
  rationale: Em português atual, “respondeu” comunica naturalmente a dupla fórmula grega sem a redundância pouco idiomática de “respondeu e disse”.
- source_word: Οὐκ ἔρχεται
  choice: não vem
  rationale: Preserva o presente de caráter geral sobre a maneira pela qual o Reino vem.
- source_word: μετὰ παρατηρήσεως
  choice: de modo que possa ser observado
  rationale: Mantém o campo semântico de observação, vigilância ou escrutínio sem transformar explicitamente o termo em “sinais”, que não aparece no grego.
theological_decisions:
- issue: Sentido da negação de Jesus sobre a vinda do Reino
  choice: A frase nega que o Reino venha de maneira sujeita à observação ou ao acompanhamento humano.
  alternative: “com sinais observáveis”, entendendo a expressão como referência específica a manifestações exteriores detectáveis.
  rationale: A formulação conserva a amplitude e a ambiguidade de παρατήρησις, sem afirmar que Jesus esteja negando todo e qualquer sinal escatológico ou impondo uma leitura específica da escatologia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi tornada natural sem perder a pergunta temporal nem a tensão interpretativa da expressão final.
