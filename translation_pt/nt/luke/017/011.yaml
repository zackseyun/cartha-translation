id: LUK.17.11
reference: Luke 17:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: pt
  text: E aconteceu que, enquanto ele ia para Jerusalém, passava pela região entre Samaria e Galileia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passava pelo meio de Samaria e da Galileia”. A expressão grega pode indicar tanto movimento entre as duas regiões como através da zona fronteiriça que as separava.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa frequente em Lucas, com linguagem atual e digna.
- source_word: ἐν τῷ πορεύεσθαι
  choice: enquanto ele ia
  rationale: Expressa a simultaneidade e o caráter contínuo da viagem indicados pelo infinitivo articular com ἐν.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: Indica naturalmente o destino do movimento expresso por εἰς.
- source_word: αὐτός
  choice: ele
  rationale: Mantém o pronome explícito sem introduzir em português uma ênfase excessiva como 'ele próprio'.
- source_word: διήρχετο
  choice: passava
  rationale: O imperfeito retrata movimento em andamento; 'passava' é natural e não determina sozinho se o percurso atravessava ou margeava as regiões.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: pela região entre Samaria e Galileia
  rationale: Comunica de modo idiomático o provável percurso pela zona intermediária ou fronteiriça, sem apagar a possibilidade de se entender a expressão como passagem pelo meio das duas regiões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a cadência narrativa de Lucas e mantém em nota a ambiguidade geográfica do grego.
