  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: pt
  text: 'Eu lhes digo: naquela noite, duas pessoas estarão em uma só cama; uma será levada[a], e a outra será deixada[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode significar ser levada por alguém consigo; por si só, não especifica aqui se essa ação visa livramento ou juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “será deixada para trás”; a forma mais breve “será deixada” evita importar associações escatológicas posteriores que não estão explícitas no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Fórmula direta de discurso que preserva a ênfase do grego e soa natural em português moderno.
- source_word: ταύτῃ τῇ νυκτί
  choice: naquela noite
  rationale: A expressão temporal com demonstrativo aponta para uma noite específica em vista; “naquela noite” é a formulação idiomática em português.
- source_word: ἔσονται δύο
  choice: duas pessoas estarão
  rationale: O grego usa o numeral de modo substantivado. “Duas pessoas” evita sugerir sem necessidade que se trata especificamente de dois homens e permite uma frase natural em português.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: em uma só cama
  rationale: κλίνη pode designar cama ou leito; o contexto noturno favorece “cama”. “Uma só” preserva a ênfase numérica e é mais natural em português do que uma reprodução rígida da preposição grega.
- source_word: ὁ εἷς
  choice: uma
  rationale: Na construção correlativa, o sentido é “uma [das duas pessoas]”; o feminino retoma naturalmente “pessoas”.
- source_word: παραλημφθήσεται
  choice: será levada
  rationale: O futuro passivo de παραλαμβάνω pode significar tomar ou levar consigo. A forma escolhida é clara e não determina se a ação visa livramento ou juízo.
- source_word: ὁ ἕτερος
  choice: a outra
  rationale: Expressa naturalmente o contraste entre os dois indivíduos mencionados.
- source_word: ἀφεθήσεται
  choice: será deixada
  rationale: Neste contraste, ἀφίημι tem o sentido de deixar, não de perdoar. A formulação evita acrescentar as associações escatológicas modernas que “deixada para trás” pode evocar.
theological_decisions:
- issue: Se a pessoa levada é salva e a deixada é julgada, ou o contrário
  choice: 'O texto principal permanece neutro: “uma será levada, e a outra será deixada”.'
  alternative: Explicitar que a pessoa levada é conduzida ao livramento, ou que é levada para o juízo.
  rationale: Os verbos gregos, por si mesmos, não resolvem a questão neste versículo. A tradução preserva essa ambiguidade e não introduz um esquema escatológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o paralelismo conciso do original e posiciona cada nota junto ao termo que ela explica.
