  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: pt
  text: Lembrem-se da mulher de Ló.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Gênesis 19:26, onde a mulher de Ló olhou para trás durante a destruição de Sodoma.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Lembrem-se
  rationale: Imperativo presente ativo, segunda pessoa do plural. A forma pronominal é a maneira mais natural em português de expressar a exortação direta feita a todos os ouvintes, sem exagerar o valor aspectual do presente.
- source_word: τῆς γυναικὸς
  choice: da mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. A relação com Ló é inequívoca no contexto, mas “a mulher de Ló” é a expressão bíblica tradicional e natural em português, além de conservar mais de perto a construção genitiva grega.
- source_word: Λώτ
  choice: Ló
  rationale: Forma consagrada do nome bíblico em português.
theological_decisions:
- issue: Forma da advertência e da alusão
  choice: Lembrem-se da mulher de Ló.
  alternative: Lembrem-se da esposa de Ló.
  rationale: A formulação mantém a concisão e a força imperativa da advertência de Jesus, remetendo diretamente a Gênesis 19:26. “Mulher de Ló” conserva a expressão portuguesa reconhecível sem acrescentar interpretação à breve alusão.
translation_notes:
  register: Português moderno, claro e digno, com forma plural amplamente compreensível. A construção “mulher de Ló” é natural, tradicional e próxima da sintaxe do original.
