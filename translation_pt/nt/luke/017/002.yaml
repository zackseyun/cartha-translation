id: LUK.17.2
reference: Luke 17:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: pt
  text: Seria melhor para ele que lhe pendurassem uma pedra de moinho[a] ao redor do pescoço e o lançassem ao mar do que levar um destes pequeninos a tropeçar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, «uma grande pedra de moinho». A expressão grega pode indicar a pedra mais pesada usada em um moinho.
    reason: lexical_alternative
  - marker: b
    text: Ou «levar um destes pequeninos a pecar». O verbo grego inclui a ideia de fazer alguém cair em pecado ou sofrer ruína espiritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Seria melhor para ele
  rationale: Expressa de modo natural em português que esse destino seria preferível para a pessoa, preservando a força comparativa da expressão grega.
- source_word: λίθος μυλικὸς
  choice: uma pedra de moinho
  rationale: Equivalente claro e corrente que mantém a referência concreta à pedra usada em moinho; a possível especificação de uma pedra maior fica registrada em nota.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: lhe pendurassem ... ao redor do pescoço
  rationale: A construção portuguesa comunica naturalmente o estado resultante indicado pelo grego no cenário hipotético.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: o lançassem ao mar
  rationale: Reproduz com clareza a ação passiva dentro da comparação hipotética; «ao mar» é idiomático e fiel ao sentido.
- source_word: σκανδαλίσῃ
  choice: levar ... a tropeçar
  rationale: Preserva a metáfora grega e sugere fazer alguém cair em pecado ou sofrer dano espiritual, sem reduzir o sentido a mero incômodo ou ofensa.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: um destes pequeninos
  rationale: Mantém a expressão deliberadamente ampla do grego, sem especificar que se trate exclusivamente de crianças ou de discípulos.
- source_word: ἢ ἵνα
  choice: do que
  rationale: Introduz de maneira natural em português o segundo termo da comparação.
theological_decisions:
- issue: Referente de «estes pequeninos»
  choice: Manter «estes pequeninos» sem identificar o grupo com exclusividade.
  alternative: «estas crianças» ou «estes discípulos humildes/crentes»
  rationale: O texto imediato não delimita explicitamente o referente. A tradução preserva essa abertura interpretativa e evita impor uma leitura teológica mais estreita.
- issue: Sentido de σκανδαλίσῃ
  choice: Traduzir metaforicamente como «levar ... a tropeçar».
  alternative: «levar ... a pecar»
  rationale: A metáfora de tropeço pertence ao grego e abrange indução ao pecado ou ruína espiritual; a nota esclarece esse alcance sem eliminar a imagem do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita regionalismos marcados e preserva tanto a metáfora do tropeço quanto a ambiguidade do referente «pequeninos».
