id: LUK.17.14
reference: Luke 17:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: pt
  text: 'Ao vê-los, ele lhes disse: “Vão e apresentem-se aos sacerdotes.[a]” E aconteceu que, enquanto iam, foram purificados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A ordem de se apresentarem aos sacerdotes reflete o exame sacerdotal exigido para quem fosse purificado de uma doença de pele; veja Levítico 14.
    reason: cross_reference
  - marker: b
    text: Ou “ficaram limpos”. O verbo grego pode indicar purificação tanto no sentido físico quanto no ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Ao vê-los
  rationale: O particípio aoristo de ὁράω é expresso naturalmente como oração temporal. O pronome “-los” é suprido pelo contexto e retoma os homens aos quais Jesus fala.
- source_word: Πορευθέντες
  choice: Vão
  rationale: O particípio aoristo tem força imperativa em ligação com ἐπιδείξατε. “Vão” comunica a ordem de modo direto e idiomático.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: apresentem-se
  rationale: No contexto de inspeção sacerdotal, “apresentem-se” é natural em português e comunica que eles deveriam comparecer pessoalmente diante dos sacerdotes.
- source_word: τοῖς ἱερεῦσιν
  choice: aos sacerdotes
  rationale: Mantém o artigo e a referência aos sacerdotes encarregados da avaliação prevista na Lei.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: E aconteceu que, enquanto iam
  rationale: Preserva tanto a fórmula narrativa ἐγένετο quanto a simultaneidade indicada pela construção com ἐν τῷ e o infinitivo.
- source_word: ἐκαθαρίσθησαν
  choice: foram purificados
  rationale: O passivo de καθαρίζω pode abranger a restauração física e a condição de pureza ritual. “Foram purificados” conserva melhor essa amplitude do que simplesmente “foram curados”.
theological_decisions:
- issue: Linguagem de purificação no contexto de doença de pele
  choice: foram purificados
  alternative: foram curados; ficaram limpos
  rationale: O grego descreve purificação, não apenas cura. A opção preserva a relação entre restauração corporal e pureza ritual sem decidir que somente um desses aspectos está em vista.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Apresentem-se” evita a rigidez de uma reprodução literal, e “foram purificados” mantém a tensão entre cura corporal e pureza ritual.
