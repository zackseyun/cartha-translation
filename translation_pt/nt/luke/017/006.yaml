  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: pt
  text: 'O Senhor disse: “Se vocês tivessem fé como um grão de mostarda, diriam a esta amoreira[a]: ‘Seja arrancada pela raiz e plantada no mar’, e ela obedeceria a vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sicamina”, uma tradução tradicional do termo grego para “amoreira”.
    reason: Preserva a alternativa lexical tradicional para συκάμινος sem identificá-la indevidamente como um nome vernáculo preciso nem confundi-la com o sicômoro de Lucas 19:4.
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título narrativo e cristológico usual em Lucas, sem reduzi-lo a mero tratamento de mestre.
- source_word: πίστιν
  choice: fé
  rationale: Neste dito sobre o impossível, o termo expressa confiança em Deus; “fé” preserva a formulação teológica corrente sem converter o sentido em “fidelidade”.
- source_word: ὡς κόκκον σινάπεως
  choice: como um grão de mostarda
  rationale: Preserva a comparação aberta introduzida por ὡς, sem explicá-la exclusivamente em termos de tamanho.
- source_word: συκαμίνῳ
  choice: amoreira
  rationale: Designa uma árvore do gênero da amoreira. “Amoreira” é claro no português atual e evita confusão com o sicômoro mencionado em outra passagem de Lucas.
- source_word: ἐλέγετε ἂν
  choice: diriam
  rationale: O imperfeito com ἄν exprime resultado potencial ou hipotético; o futuro do pretérito é a equivalência portuguesa natural.
- source_word: Ἐκριζώθητι
  choice: Seja arrancada pela raiz
  rationale: Reproduz a força do imperativo passivo aoristo e torna explícita, de modo idiomático, a imagem contida no verbo.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: plantada no mar
  rationale: Conserva literalmente a imagem paradoxal de plantar a árvore no mar, sem substituí-la por “transplantada”.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: ela obedeceria a vocês
  rationale: “Obedecer” corresponde à resposta da árvore à ordem, enquanto o futuro do pretérito mantém a estrutura hipotética.
theological_decisions:
- issue: Sentido de πίστις no dito sobre o impossível
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto aponta para confiança em Deus, não principalmente para constância moral ou fidelidade pactual. A tradução tradicional “fé” preserva a densidade teológica do termo.
- issue: Força da construção condicional
  choice: Se vocês tivessem fé… diriam… e ela obedeceria
  alternative: Se vocês têm fé… podem dizer… e ela obedecerá
  rationale: Embora εἰ ἔχετε tenha presente do indicativo, os dois verbos com ἄν apresentam o cenário como hipotético. A construção portuguesa com imperfeito do subjuntivo e futuro do pretérito transmite essa relação sem decidir se Jesus nega inteiramente a existência de fé nos ouvintes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. Os imperativos passivos foram mantidos em forma natural (“seja arrancada… e plantada”), e a repetição de “vocês” no fim evita o regionalismo de “lhes” como objeto de “obedecer”.
