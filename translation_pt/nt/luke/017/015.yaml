  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: pt
  text: Mas um deles, ao ver que tinha sido curado, voltou, glorificando a Deus em alta voz,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Mas um deles
  rationale: A expressão é partitiva, “um deles”. δέ introduz aqui um contraste narrativo suave com os demais; “Mas” o expressa de modo natural.
- source_word: ἰδὼν
  choice: ao ver
  rationale: O particípio aoristo indica uma percepção contemporânea ou ligeiramente anterior à ação principal. “Ao ver” preserva a relação temporal sem a tornar excessivamente específica.
- source_word: ὅτι ἰάθη
  choice: que tinha sido curado
  rationale: O aoristo passivo de ἰάομαι denota cura. O mais-que-perfeito composto comunica naturalmente que a cura já estava realizada quando ele a percebeu.
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: No contexto narrativo, ὑποστρέφω significa retornar; “voltou” é direto, corrente e implica adequadamente o retorno a Jesus.
- source_word: μετὰ φωνῆς μεγάλης
  choice: em alta voz
  rationale: A expressão idiomática indica falar ou clamar de modo audível e intenso. “Em alta voz” é natural em português e evita o literalismo pouco idiomático “com grande voz”.
- source_word: δοξάζων τὸν θεόν
  choice: glorificando a Deus
  rationale: δοξάζω significa glorificar ou dar glória. “Glorificando” conserva a linguagem de glória do grego sem excluir a ideia de louvor.
theological_decisions:
- issue: Tradução de τὸν θεόν
  choice: a Deus
  alternative: —
  rationale: O texto afirma simplesmente que o homem curado glorificava a Deus. A tradução não acrescenta identificação ou desenvolvimento doutrinário ausente do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A estrutura mantém o fluxo participial do grego, sem sacrificar a naturalidade. Não se incluiu nota lexical porque “glorificar a Deus” é clara e preserva adequadamente a amplitude de δοξάζω; a nota do inglês não corresponde ao marcador presente no texto inglês e não é necessária para o português.
