  source_fidelity: 'O texto traduz adequadamente a sequência grega: οὐδὲ ἐροῦσιν como continuação negativa futura, as duas indicações locativas contrastantes, γάρ como explicação e o presente ἐστιν. A explicitação de “está” nas exclamações é idiomática em português e não altera o sentido elíptico do original.'
  naturalness: O português é moderno, claro e de registro digno. “Também não dirão”, “Vejam”, “pois eis que” e “no meio de vocês” formam uma redação fluente e compreensível, inclusive para leitores brasileiros. A repetição de “está” nas indicações locativas ajuda a naturalidade sem introduzir conteúdo indevido.
  terminology: “Reino de Deus” é uma equivalência estabelecida e teologicamente não redutora para ἡ βασιλεία τοῦ θεοῦ. “No meio de vocês” apresenta legitimamente a leitura corporativa de ἐντὸς ὑμῶν, enquanto a nota preserva de modo apropriado a alternativa real “dentro de vocês”. O uso de “vocês” comunica o plural de ὑμῶν.
