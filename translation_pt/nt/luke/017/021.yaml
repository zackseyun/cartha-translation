id: LUK.17.21
reference: Luke 17:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: pt
  text: 'Também não dirão: “Vejam, está aqui!” ou: “Está ali!”, pois eis que o Reino de Deus está no meio de vocês[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentro de vocês”. A expressão grega pode indicar tanto algo interior como algo presente entre um grupo, isto é, “entre vocês” ou “no meio de vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Também não dirão
  rationale: Dá continuidade natural à negação do contexto anterior e preserva o futuro do verbo λέγω.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: '“Vejam, está aqui!” ou: “Está ali!”'
  rationale: Expressa de modo corrente a função dêitica de ἰδού e o contraste locativo entre ὧδε e ἐκεῖ; a inserção de “está” torna explícito em português o sentido elíptico da exclamação.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a relação explicativa entre a impossibilidade de apontar o Reino em determinado lugar e a afirmação seguinte.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o chamado enfático à atenção em registro digno, distinguindo-o naturalmente do primeiro ἰδού traduzido como “Vejam”.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Tradução tradicional e transparente que conserva as dimensões régia e escatológica da expressão sem reduzi-la apenas a domínio espacial ou a exercício abstrato de governo.
- source_word: ἐντὸς ὑμῶν
  choice: no meio de vocês
  rationale: O plural ὑμῶν e o contexto de uma fala dirigida a um grupo favorecem aqui o sentido corporativo de presença entre os ouvintes. A alternativa lexical genuína, “dentro de vocês”, é preservada em nota.
- source_word: ἐστιν
  choice: está
  rationale: Em português, “está” combina naturalmente com a expressão locativa “no meio de vocês” e comunica presença atual sem acrescentar uma interpretação temporal.
theological_decisions:
- issue: Sentido de ἐντὸς ὑμῶν
  choice: o Reino de Deus está no meio de vocês
  alternative: o Reino de Deus está dentro de vocês
  rationale: A expressão grega admite leitura corporativa (“entre vocês/no meio de vocês”) e leitura interior (“dentro de vocês”). O contexto plural e a discussão sobre localização favorecem a primeira no texto principal, mas a nota mantém a ambiguidade lexical e teológica real.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” torna explícito o plural de ὑμῶν. “Eis que” conserva a solenidade enfática do segundo ἰδού sem produzir a repetição menos natural de “Vejam”.
