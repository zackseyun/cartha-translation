id: LUK.17.1
reference: Luke 17:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: pt
  text: 'Então ele disse aos seus discípulos: “É impossível que não venham pedras de tropeço[a], mas ai daquele por meio de quem elas vêm!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofensas”, “causas de pecado” ou “tentações para pecar”. O termo grego σκάνδαλα indica coisas que fazem alguém tropeçar ou cair moral ou espiritualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Então ele disse
  rationale: δέ funciona aqui como conexão narrativa leve; “Então” dá sequência natural ao discurso sem introduzir um contraste forte.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: aos seus discípulos
  rationale: Representa explicitamente o possessivo αὐτοῦ e emprega “discípulos”, equivalente corrente de μαθηταί.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: É impossível
  rationale: Preserva a forma enfática do grego; com a oração negativa seguinte, declara ser impossível que tais ocasiões não surjam.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: que não venham pedras de tropeço
  rationale: 'A construção de infinitivo articular com μή expressa aquilo que é impossível: o não surgimento dos σκάνδαλα. A formulação portuguesa mantém a negação e a inevitabilidade do original.'
- source_word: σκάνδαλα
  choice: pedras de tropeço
  rationale: Mantém visível a metáfora de algo que faz alguém tropeçar ou cair moral e espiritualmente, sem restringir o sentido a mera ofensa subjetiva.
- source_word: πλὴν οὐαὶ
  choice: mas ai
  rationale: “Mas” expressa a ressalva adversativa de πλήν, enquanto “ai” conserva a denúncia solene de οὐαί.
- source_word: δι’ οὗ
  choice: daquele por meio de quem
  rationale: Preserva a referência pessoal singular e a noção de mediação ou agência expressa por διά.
- source_word: ἔρχεται
  choice: elas vêm
  rationale: Em português, a concordância plural com “pedras de tropeço” é natural e torna explícito o antecedente conceitual, embora o verbo grego esteja no singular.
theological_decisions:
- issue: Sentido ético de σκάνδαλα
  choice: “pedras de tropeço” no texto principal
  alternative: “ofensas”, “causas de pecado” ou “tentações para pecar”
  rationale: A expressão conserva a amplitude da advertência sobre realidades que levam outros à queda moral ou espiritual, sem decidir indevidamente entre ofensa, tentação e indução ao pecado.
- issue: Expressão pessoal singular em δι’ οὗ
  choice: “daquele por meio de quem”
  alternative: “da pessoa por meio de quem”
  rationale: Mantém a força representativa e singular do grego em uma formulação portuguesa tradicional, clara e aplicável de modo geral.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Pedras de tropeço” preserva a metáfora bíblica sem recorrer ao falso cognato moderno “escândalos”. A dupla negação em “É impossível que não venham” foi mantida por fidelidade à estrutura e à ênfase do grego.
