id: LUK.17.33
reference: Luke 17:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: pt
  text: Quem procurar preservar a própria vida[a] a perderá, mas quem a perder a conservará viva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «alma»; aqui, porém, o termo grego provavelmente se refere à vida ou ao próprio ser da pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou «a manterá viva»; tradicionalmente, «a salvará». O verbo grego significa literalmente conservar ou manter com vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: procurar
  rationale: Expressa esforço intencional, e não mero desejo; é natural em português na construção genérica com «quem».
- source_word: ψυχὴν
  choice: vida
  rationale: Neste contexto, ψυχή designa a vida ou o próprio ser da pessoa, não necessariamente uma alma imaterial.
- source_word: περιποιήσασθαι
  choice: preservar
  rationale: O infinitivo médio indica preservar ou assegurar algo para si; «preservar a própria vida» comunica essa nuance de autoproteção.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: perderá / perder
  rationale: Mantém o paralelismo e o paradoxo deliberado do dito sem acrescentar a ideia interpretativa de entrega voluntária.
- source_word: ζῳογονήσει
  choice: conservará viva
  rationale: Reflete o sentido específico de manter ou conservar com vida, distinguindo o verbo do termo grego habitual para «salvar».
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Quem ... mas quem
  rationale: Reproduz de modo conciso a construção condicional genérica e torna explícito o contraste indicado por δέ.
- source_word: αὐτοῦ / αὐτήν
  choice: a própria / a
  rationale: «A própria vida» expressa naturalmente em português a referência reflexiva do possessivo, enquanto o pronome átono evita repetição desnecessária.
theological_decisions:
- issue: Sentido de ψυχή no paradoxo de Jesus
  choice: vida
  alternative: alma
  rationale: O contexto trata da tentativa de preservar a própria existência diante do juízo e do paradoxo de perdê-la para mantê-la viva. «Vida» evita impor uma dicotomia entre corpo e alma que o texto não exige.
- issue: Sentido de ζῳογονήσει
  choice: conservará viva
  alternative: salvará; preservará
  rationale: O verbo não é o termo grego usual para «salvar»; a tradução escolhida preserva sua imagem concreta e a tensão verbal do dito.
- issue: Natureza da perda na segunda oração
  choice: quem a perder
  alternative: quem abrir mão dela; quem entregar a vida
  rationale: O grego diz literalmente «perder» e não especifica aqui se a perda é voluntária. A formulação mantém essa ambiguidade e o caráter paradoxal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no uso brasileiro. A construção «quem» funciona de modo genericamente inclusivo sem introduzir marcação de gênero. O paralelismo e o paradoxo do original foram preservados.
