reference: Luke 17:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: pt
  text: Pois, assim como o relâmpago, ao relampejar, brilha de uma extremidade do céu à outra[a], assim será o Filho do Homem no seu dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “de uma parte debaixo do céu à outra parte debaixo do céu”. O grego repete a expressão “debaixo do céu”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em seu dia”. A expressão designa o tempo associado ao Filho do Homem, sem especificá-lo mais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva a função explicativa de γάρ e introduz com naturalidade a comparação marcada por ὥσπερ.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: o relâmpago, ao relampejar
  rationale: Mantém tanto o substantivo quanto o particípio cognato, reproduzindo a vivacidade e a repetição deliberada do grego sem tornar a frase ininteligível.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: de uma extremidade do céu à outra
  rationale: Expressa em português corrente a abrangência espacial da construção grega, que repete literalmente a ideia de estar 'debaixo do céu'; a forma mais literal é registrada em nota.
- source_word: λάμπει
  choice: brilha
  rationale: Distingue λάμπει do particípio anterior ἀστράπτουσα, como faz o grego, em vez de traduzir ambos pelo mesmo verbo.
- source_word: οὕτως ἔσται
  choice: assim será
  rationale: Reproduz de modo direto o segundo termo da comparação e o valor futuro do verbo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação tradicional e semanticamente transparente, sem a substituir por uma interpretação.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: no seu dia
  rationale: Conserva o possessivo e a referência temporal ampla do grego, sem especificar que evento escatológico está em vista.
theological_decisions:
- issue: Sentido de “o Filho do Homem no seu dia” no contexto escatológico
  choice: no seu dia
  alternative: na sua vinda; no dia do juízo; no dia do Filho do Homem
  rationale: O texto associa um dia ao Filho do Homem, mas não o identifica explicitamente aqui como sua vinda ou como o juízo. A tradução mantém essa amplitude e evita acrescentar precisão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição cognata “relâmpago, ao relampejar” foi mantida para refletir a forma expressiva do original; a expressão espacial foi vertida idiomaticamente no texto e esclarecida em nota.
