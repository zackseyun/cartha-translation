  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: pt
  text: Quando ele estava entrando em certo povoado, dez homens com lepra[a] foram ao encontro dele, mas ficaram a certa distância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego tradicionalmente traduzido por “lepra” podia abranger diversas doenças da pele e não designa necessariamente a hanseníase moderna.
    reason: lexical_alternative
  - marker: b
    text: Ou “de longe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: quando ele estava entrando
  rationale: O genitivo absoluto com particípio presente indica uma ação em andamento e simultânea ao encontro; a formulação preserva esse aspecto de modo natural em português.
- source_word: εἴς τινα κώμην
  choice: em certo povoado
  rationale: τινα mantém a referência indefinida, mas perceptível; “certo povoado” traduz essa nuance sem sugerir que o lugar tenha sido identificado.
- source_word: ἀπήντησαν
  choice: vieram ao encontro dele
  rationale: ἀπαντάω pode indicar não apenas encontrar alguém, mas sair ou vir ao seu encontro. A expressão portuguesa é natural no contexto e explicita adequadamente o movimento sugerido.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: dez homens com lepra
  rationale: A formulação atual e centrada nas pessoas comunica a condição descrita pelo adjetivo grego sem transformar a enfermidade na identidade dos homens. A nota esclarece que o termo antigo não corresponde necessariamente ao diagnóstico moderno de hanseníase.
- source_word: οἳ ἔστησαν
  choice: e pararam
  rationale: Embora o grego use uma oração relativa, a coordenação é mais fluente em português. No contexto de homens que vêm ao encontro de Jesus, ἔστησαν indica que eles pararam e permaneceram em determinada posição.
- source_word: πόρρωθεν
  choice: a certa distância
  rationale: A expressão comunica de modo claro a separação espacial indicada pelo advérbio, sem especificar uma distância que o texto não informa.
theological_decisions:
- issue: Alcance da designação λεπροί
  choice: homens com lepra, acompanhada de nota explicativa
  alternative: homens leprosos; homens com doença de pele
  rationale: “Lepra” preserva a designação bíblica reconhecível, enquanto a nota evita equipará-la de maneira indevida e exclusiva à hanseníase moderna. Isso mantém a categoria antiga sem importar precisão médica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção progressiva preserva a simultaneidade do particípio grego; a coordenação na segunda oração evita a rigidez de “os quais ficaram de pé”. O καί inicial não foi representado isoladamente, pois o encadeamento já é expresso naturalmente pela construção temporal em português.
