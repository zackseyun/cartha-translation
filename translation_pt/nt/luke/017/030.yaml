  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: pt
  text: Assim será no dia em que o Filho do Homem for revelado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Do mesmo modo será” ou “Da mesma maneira será”. A expressão grega retoma os exemplos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Assim será
  rationale: A expressão remete aos exemplos anteriores e indica correspondência de padrão. “Assim será” é natural em português, preserva a força comparativa e se articula com o futuro de ἔσται.
- source_word: ἔσται
  choice: será
  rationale: O futuro de εἰμί é vertido diretamente por “será”, sem linguagem arcaica.
- source_word: ᾗ ἡμέρᾳ
  choice: no dia em que
  rationale: O dativo relativo tem valor temporal. “No dia em que” é a formulação idiomática e mantém a especificidade temporal.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação consagrada nos Evangelhos e sua ressonância apocalíptica e messiânica ligada a Daniel 7.
- source_word: ἀποκαλύπτεται
  choice: for revelado
  rationale: A forma passiva é preservada. Após “no dia em que”, o futuro do subjuntivo é natural em português e expressa a manifestação futura sem trocar a ideia lexical de revelação pela de chegada.
theological_decisions:
- issue: Tradução do título escatológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional preserva melhor a ligação intertextual com Daniel 7 e o uso reconhecível do título nos Evangelhos, sem decidir além do texto suas implicações teológicas.
- issue: Força de ἀποκαλύπτεται no contexto
  choice: for revelado
  alternative: vier / aparecer
  rationale: O verbo exprime revelação ou desvelamento, não simplesmente movimento ou chegada. A tradução mantém a forma passiva e evita importar outro conceito verbal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem é natural, e “Assim será” conserva de forma concisa a referência retrospectiva aos exemplos de Noé e Ló.
