base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: pt
  text: 'Então Jesus respondeu: “Não foram purificados os dez? Mas onde estão os nove?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Então Jesus perguntou
  rationale: A fórmula semítica literalmente combina ‘respondendo’ e ‘disse’. Em português, diante das perguntas retóricas que seguem, ‘perguntou’ comunica a introdução da fala com naturalidade, enquanto ‘Então’ representa o valor continuativo de δέ.
- source_word: Οὐχὶ
  choice: Não foram
  rationale: οὐχί introduz uma pergunta que espera resposta afirmativa; a construção negativa em português preserva essa força retórica.
- source_word: οἱ δέκα
  choice: os dez
  rationale: O artigo com o numeral remete ao grupo conhecido dos dez leprosos, sem acrescentar a ênfase interpretativa de ‘todos’.
- source_word: ἐκαθαρίσθησαν
  choice: foram purificados
  rationale: O passivo de καθαρίζω significa tornar limpo ou purificar. ‘Purificados’ preserva tanto a restauração física quanto a dimensão de pureza associada à lepra, sem reduzir o sentido a simples cura.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Onde estão os outros nove?
  rationale: O segundo δέ estabelece contraste com o único homem que voltou. Em português, ‘os outros nove’ torna esse contraste claro e idiomático, e a posição inicial de ‘Onde’ mantém a força da pergunta.
theological_decisions:
- issue: Sentido de καθαρίζω no relato da cura de leprosos
  choice: purificados
  alternative: curados; tornados limpos
  rationale: O verbo grego é καθαρίζω, não o termo mais geral para curar. ‘Purificados’ conserva conjuntamente as implicações físicas e cerimoniais do contexto, sem impor uma conclusão doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e a força das duas perguntas retóricas.
