  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: pt
  text: 'Do mesmo modo[a], assim como aconteceu nos dias de Ló: comiam, bebiam, compravam, vendiam, plantavam e construíam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Semelhantemente, como aconteceu nos dias de Ló».'
    reason: Alternativa lexical para ὁμοίως e forma mais concisa de expressar a comparação.
lexical_decisions:
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Liga o exemplo de Ló à comparação anterior e conserva de forma natural a força comparativa do advérbio.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz explicitamente a comparação de modo, com clareza no português atual.
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Expressa o sentido eventivo de γίνομαι sem recorrer a uma formulação arcaica como «sucedeu».
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: nos dias de Ló
  rationale: Mantém a expressão temporal bíblica, compreensível em português, para o período associado a Ló.
- source_word: ἤσθιον
  choice: comiam
  rationale: O pretérito imperfeito representa uma atividade habitual e contínua no cenário descrito.
- source_word: ἔπινον
  choice: bebiam
  rationale: O pretérito imperfeito preserva o aspecto durativo e acompanha naturalmente os demais verbos da enumeração.
- source_word: ἠγόραζον
  choice: compravam
  rationale: Designa de maneira direta a atividade comercial rotineira e conserva o aspecto imperfeito.
- source_word: ἐπώλουν
  choice: vendiam
  rationale: Forma o par natural com «compravam» e retrata a atividade habitual do comércio.
- source_word: ἐφύτευον
  choice: plantavam
  rationale: Traduz literalmente a atividade agrícola e mantém o caráter contínuo da descrição.
- source_word: ᾠκοδόμουν
  choice: construíam
  rationale: Comunica aqui o sentido literal de erguer construções, não o sentido metafórico de edificar, e preserva o aspecto contínuo.
