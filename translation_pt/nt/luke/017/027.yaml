source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: pt
  text: Comiam, bebiam, casavam-se e eram dados em casamento, até o dia em que Noé entrou na arca; e veio o dilúvio e destruiu a todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤσθιον
  choice: comiam
  rationale: O imperfeito retrata uma atividade habitual ou contínua no passado; em português, o pretérito imperfeito expressa isso naturalmente.
- source_word: ἔπινον
  choice: bebiam
  rationale: O pretérito imperfeito preserva o aspecto contínuo ou habitual da série verbal grega.
- source_word: ἐγάμουν
  choice: casavam-se
  rationale: Expressa de modo natural o ato de contrair casamento sem impor uma especificação de gênero além do uso representativo do plural grego.
- source_word: ἐγαμίζοντο
  choice: eram dados em casamento
  rationale: Mantém a forma passiva e a distinção em relação ao verbo anterior, embora a expressão reflita uma prática social antiga.
- source_word: ἄχρι ἧς ἡμέρας
  choice: até o dia em que
  rationale: Marca com clareza o limite temporal das atividades contínuas e é idiomático em português.
- source_word: εἰσῆλθεν ... εἰς τὴν κιβωτόν
  choice: entrou na arca
  rationale: Verte naturalmente o evento pontual e usa a designação tradicional e inequívoca da arca de Noé.
- source_word: κατακλυσμός
  choice: dilúvio
  rationale: É o termo português consagrado para o dilúvio de Gênesis e permanece amplamente compreensível.
- source_word: ἀπώλεσεν πάντας
  choice: destruiu a todos
  rationale: Torna explícito que πάντας se refere a todas as pessoas mencionadas, preservando a totalidade do juízo.
theological_decisions:
- issue: Distinção entre os dois verbos relativos ao casamento
  choice: casavam-se e eram dados em casamento
  alternative: casavam-se e davam-se em casamento
  rationale: A tradução mantém distintos o verbo ativo γαμέω e o passivo de γαμίζω, sem extrair deles uma afirmação doutrinária adicional.
- issue: Aspecto da série verbal inicial
  choice: 'pretérito imperfeito: “comiam, bebiam, casavam-se e eram dados”'
  alternative: 'pretérito perfeito: “comeram, beberam, casaram-se e foram dados”'
  rationale: Os imperfeitos gregos apresentam a vida cotidiana em andamento até a chegada súbita do juízo.
translation_notes:
  register: Português moderno, claro e digno, com pretérito imperfeito para o pano de fundo contínuo e formas pontuais para a entrada de Noé e a chegada do dilúvio. “Eram dados em casamento” preserva deliberadamente a passiva histórica do original; a nota oferece uma formulação mais compacta.
