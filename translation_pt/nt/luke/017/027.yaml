  to: Comiam, bebiam, casavam-se e eram dados em casamento, até o dia em que Noé entrou na arca; e veio o dilúvio e destruiu a todos.
  rationale: Remove-se a nota lexicalmente imprecisa e seu respectivo marcador. Substitui-se “Então veio” por “e veio” para refletir a coordenação do grego sem acréscimo discursivo. O restante é mantido, pois comunica adequadamente o aspecto imperfeito, a dupla formulação relativa ao casamento e a totalidade da destruição.
