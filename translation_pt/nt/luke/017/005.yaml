id: LUK.17.5
reference: Luke 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: pt
  text: 'E os apóstolos disseram ao Senhor: “Aumenta[a] a nossa fé[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acrescenta-nos fé”. O verbo grego significa literalmente “acrescentar”, mas aqui tem o sentido idiomático de “aumentar”.'
    reason: lexical_alternative
  - marker: b
    text: “Fé” também pode ser entendida como “confiança”; menos provavelmente neste contexto, o termo pode significar “fidelidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples do grego, sem acrescentar uma nuance temporal.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo indicativo é naturalmente expresso pelo pretérito perfeito em português.
- source_word: οἱ ἀπόστολοι
  choice: os apóstolos
  rationale: É a designação consagrada e exata, em Lucas–Atos, para os representantes comissionados por Jesus.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Mantém tanto a forma respeitosa de se dirigir a Jesus quanto a ressonância cristológica habitual de κύριος em Lucas.
- source_word: Πρόσθες
  choice: Aumenta
  rationale: Embora o sentido básico do verbo seja “acrescentar”, com πίστιν ele expressa idiomaticamente o pedido por uma medida maior de fé.
- source_word: ἡμῖν
  choice: a nossa
  rationale: O dativo grego, literalmente “a nós”, é expresso de modo natural em português pela construção possessiva “a nossa fé”.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, designa mais naturalmente a fé ou confiança dos apóstolos; “fidelidade” pertence ao campo semântico, mas é menos provável aqui.
theological_decisions:
- issue: Tradução de κύριος em referência a Jesus
  choice: Senhor
  alternative: mestre
  rationale: “Senhor” preserva a forma natural de tratamento no relato e o peso cristológico do título; “mestre” reduziria essa ressonância.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; menos provavelmente, fidelidade
  rationale: “Fé” é a tradução mais abrangente e natural neste pedido, enquanto a nota preserva possibilidades reais do campo semântico sem decidir além do contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “a nossa fé” é natural no registro corrente e preserva o sentido do dativo grego sem produzir uma formulação artificial.
