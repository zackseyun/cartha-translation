id: LUK.17.3
reference: Luke 17:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: pt
  text: Tenham cuidado com vocês mesmos. Se o seu irmão[b] pecar[a], repreenda-o; e, se ele se arrepender, perdoe-lhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Se o seu irmão pecar contra você, repreenda-o.”'
    reason: textual_variant
  - marker: b
    text: “Irmão” está no masculino singular em grego e pode referir-se, de modo mais amplo, a outro discípulo.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: Tenham cuidado
  rationale: O imperativo presente pede vigilância contínua. “Tenham cuidado” comunica a advertência de modo natural e claro, sem enfraquecer sua força.
- source_word: ἑαυτοῖς
  choice: com vocês mesmos
  rationale: Preserva o sentido reflexivo do pronome e permite tanto a ideia de vigilância pessoal quanto a de atenção no âmbito da comunidade.
- source_word: ἁμάρτῃ
  choice: pecar
  rationale: O texto grego adotado não contém um complemento equivalente a “contra você”; por isso, a formulação principal mantém o sentido mais amplo.
- source_word: ὁ ἀδελφός σου
  choice: o seu irmão
  rationale: Reproduz o masculino singular do grego. No contexto, pode designar de maneira representativa outro discípulo, o que é esclarecido em nota.
- source_word: ἐπιτίμησον
  choice: repreenda-o
  rationale: Expressa a correção verbal direta ordenada pelo imperativo aoristo, sem suavizá-la para uma simples advertência ou conselho.
- source_word: μετανοήσῃ
  choice: se arrepender
  rationale: É a expressão corrente em português para uma mudança moral e relacional de atitude, adequada à relação entre arrependimento e perdão neste contexto.
- source_word: ἄφες
  choice: perdoe-lhe
  rationale: No contexto interpessoal, ἀφίημι significa perdoar. “Perdoe-lhe” é claro, digno e mantém explícito o referente pessoal.
theological_decisions:
- issue: Inclusão de “contra você” depois de “pecar”
  choice: Omitir “contra você” do texto principal
  alternative: “Se o seu irmão pecar contra você, repreenda-o”
  rationale: O texto da SBLGNT fornecido lê simplesmente ἐὰν ἁμάρτῃ ὁ ἀδελφός σου, sem εἰς σέ ou expressão equivalente. A tradução principal preserva essa formulação mais ampla, enquanto a leitura mais longa é registrada em nota.
- issue: Representação de gênero em ἀδελφός
  choice: “o seu irmão”
  alternative: “seu irmão ou sua irmã” ou “outro discípulo”
  rationale: O substantivo grego está no masculino singular. A tradução mantém essa forma, sem excluir a possível aplicação representativa a qualquer integrante da comunidade de discípulos, indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A primeira oração conserva o plural do grego; as ordens seguintes refletem a passagem ao tratamento individual no singular. A pontuação mantém unidas a repreensão, o arrependimento e o perdão sem acrescentar uma relação além da expressa no texto.
