  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: pt
  text: E caiu com o rosto em terra, aos pés de Jesus, agradecendo-lhe. E ele era samaritano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: prostrando-se com o rosto em terra
  rationale: A combinação de πίπτω com ἐπὶ πρόσωπον descreve uma queda deliberada em postura de prostração. A formulação portuguesa comunica de modo natural e vívido tanto o movimento quanto a posição corporal.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: aos pés de Jesus
  rationale: No contexto reverencial, παρά com o acusativo é expresso idiomaticamente por «aos pés». O referente pronominal é explicitado como Jesus para evitar, em português, uma possível leitura de que o homem caiu aos próprios pés.
- source_word: εὐχαριστῶν αὐτῷ
  choice: agradeceu-lhe
  rationale: O particípio presente indica uma ação concomitante à prostração. Em português corrente, a coordenação verbal produz uma frase fluida e mantém Jesus como destinatário do agradecimento.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: E ele era samaritano
  rationale: O pronome explícito αὐτός recebe correspondência em «ele», preservando a ênfase discreta na identidade inesperada do homem. «Samaritano» é a designação histórica e etnorreligiosa convencional.
theological_decisions:
- issue: Ênfase narrativa na identidade do homem curado
  choice: E ele era samaritano
  alternative: Ora, esse homem era samaritano
  rationale: A redação simples conserva a revelação enfática, mas sóbria, de que quem voltou para agradecer pertencia a um grupo tratado como externo, sem acrescentar interpretação social ou teológica ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para clareza referencial; «Jesus» explicita o antecedente de αὐτοῦ sem alterar o sentido. «Com o rosto em terra» conserva a imagem concreta da prostração.
