id: LUK.17.26
reference: Luke 17:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: pt
  text: E, assim como aconteceu nos dias de Noé, assim também será nos dias do Filho do Homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do Ser Humano”. O título grego tradicionalmente traduzido por “Filho do Homem” provavelmente evoca Daniel 7 e é mantido aqui por sua reconhecida ressonância messiânica e apocalíptica.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz de modo natural e enfático a comparação, em correlação com οὕτως (“assim”).
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva o sentido eventivo de γίνομαι no contexto, em português moderno e sem formulação arcaica.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: nos dias de Noé
  rationale: Reproduz a expressão temporal grega com uma formulação tradicional, clara e natural em português.
- source_word: οὕτως
  choice: assim
  rationale: Marca a segunda parte da comparação e mantém a correlação explícita “assim como... assim”.
- source_word: ἔσται
  choice: será
  rationale: Reflete de perto o futuro de εἰμί sem especificar além do texto o que ocorrerá.
- source_word: καὶ
  choice: também
  rationale: 'Mantém a extensão enfática da comparação: o que ocorreu nos dias de Noé também caracterizará os dias do Filho do Homem.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Conserva a forma consagrada do título e suas ressonâncias messiânicas e apocalípticas, inclusive a provável evocação de Daniel 7.
theological_decisions:
- issue: Tradução do título τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Filho do Homem
  alternative: Ser Humano
  rationale: “Filho do Homem” preserva tanto a forma literal quanto o uso estabelecido do título nos Evangelhos e sua provável ressonância em Daniel 7, sem reduzir a expressão a uma referência humana genérica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção correlativa “assim como... assim também” conserva a estrutura e a ênfase do grego sem soar excessivamente literal.
