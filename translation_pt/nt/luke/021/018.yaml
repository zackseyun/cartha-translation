  text: And not a hair from your head will perish[a].
translation:
  language: pt
  text: E nem um só fio de cabelo da cabeça de vocês se perderá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “nem um só fio de cabelo da cabeça de vocês de modo algum se perderá”; o grego emprega uma dupla negação enfática para expressar forte certeza de que isso não acontecerá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples com o contexto anterior, sem introduzir um contraste que a conjunção grega não explicita.
- source_word: θρὶξ
  choice: um só fio de cabelo
  rationale: Expressa de modo natural em português o singular proverbial e realça a ideia de que nem sequer a menor parte se perderá.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: da cabeça de vocês
  rationale: Reproduz a construção partitiva em português corrente e preserva a referência coletiva aos discípulos.
- source_word: οὐ μὴ
  choice: nem ... se perderá
  rationale: A combinação da negação com o futuro comunica uma garantia categórica em português natural; a nota registra a intensidade formal da dupla negação grega.
- source_word: ἀπόληται
  choice: se perderá
  rationale: Neste dito proverbial, «perder-se» conserva a amplitude semântica de ἀπόλλυμι e evita sugerir apenas destruição física, preservando a tensão com a previsão próxima de que alguns discípulos seriam mortos.
theological_decisions:
- issue: Tensão aparente com as previsões próximas de perseguição e morte
  choice: Manter a afirmação proverbial de preservação sem explicar no texto em que sentido ela se cumpre.
  alternative: Traduzir como promessa estritamente literal de que nenhum dano físico atingiria os discípulos.
  rationale: O contexto imediato prevê que alguns discípulos serão mortos. A tradução conserva a garantia enfática e a tensão do texto, sem impor uma solução interpretativa ou denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» torna explícito o plural de ὑμῶν; «fio de cabelo» é idiomático e natural. A formulação evita tanto o arcaísmo quanto uma explicação teológica inserida no versículo.
