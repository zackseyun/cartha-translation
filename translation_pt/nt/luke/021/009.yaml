id: LUK.21.9
reference: Luke 21:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: pt
  text: Mas, quando ouvirem falar de guerras e tumultos[a], não fiquem apavorados, pois é necessário que essas coisas aconteçam primeiro; mas o fim não virá imediatamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agitações”, “desordens” ou “revoltas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, a frase grega é elíptica: “mas não imediatamente o fim”.'
    reason: source_structure
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν introduz uma circunstância temporal futura, e δέ marca uma transição com leve contraste; “Mas, quando” é natural e preserva essa relação.
- source_word: ἀκούσητε
  choice: ouvirem falar de
  rationale: A expressão portuguesa é idiomática para notícias ou relatos a respeito de acontecimentos como guerras e tumultos.
- source_word: πολέμους
  choice: guerras
  rationale: Equivalente direto e natural para conflitos armados, preservando o plural.
- source_word: ἀκαταστασίας
  choice: tumultos
  rationale: O termo abrange desordens, agitações e instabilidade social ou política. “Tumultos” mantém amplitude razoável sem especificar revoltas armadas.
- source_word: μὴ πτοηθῆτε
  choice: não fiquem apavorados
  rationale: Expressa a ideia de ser tomado por medo ou pânico, com força maior que uma simples preocupação.
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: pois é necessário que essas coisas aconteçam primeiro
  rationale: Preserva explicitamente a necessidade expressa por δεῖ, a explicação introduzida por γάρ e a sequência indicada por πρῶτον.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: mas o fim não virá imediatamente
  rationale: A oração grega é elíptica, sem verbo expresso. Em português, “não virá” explicita de modo natural a relação temporal sem definir a natureza do fim.
theological_decisions:
- issue: Relação entre guerras, tumultos e o momento do fim
  choice: Esses acontecimentos devem ocorrer primeiro, mas o fim não se segue imediatamente.
  alternative: Esses acontecimentos pertencem ao período anterior ao fim, sem serem eles próprios o fim.
  rationale: A tradução mantém a advertência contra identificar crises históricas com a chegada imediata do fim, sem impor um esquema escatológico específico.
translation_notes:
  register: Português moderno, claro e digno, com construção facilmente compreensível no Brasil e em outros contextos lusófonos. “Ouvirem falar de” é idiomático; “é necessário” preserva a força de δεῖ; e “o fim não virá imediatamente” torna natural em português a oração grega sem verbo expresso.
