id: LUK.21.16
reference: Luke 21:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: pt
  text: Mas vocês serão entregues até mesmo por pais, irmãos, parentes e amigos[a], e eles matarão alguns de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”, pois o plural masculino grego pode, em certos contextos, referir-se a um grupo misto de irmãos e irmãs.
    reason: Alternativa lexical para ἀδελφῶν.
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: vocês serão entregues
  rationale: O futuro passivo de παραδίδωμι indica que os discípulos serão entregues a autoridades ou adversários. “Serão entregues” preserva o sentido básico sem explicitar demais a ideia contextual de traição.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação à promessa do versículo anterior.
- source_word: καὶ
  choice: até
  rationale: 'O primeiro καί tem força ascendente: não apenas outros, mas até pessoas próximas participarão da entrega.'
- source_word: ὑπὸ
  choice: por
  rationale: Com o verbo passivo, ὑπό identifica os agentes pessoais.
- source_word: γονέων
  choice: pais
  rationale: γονεῖς designa coletivamente pai e mãe; “pais” é a forma corrente e inclusiva em português.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego. Em uma lista de parentesco, o termo também pode abranger irmãos e irmãs; essa possibilidade é registrada em nota.
- source_word: συγγενῶν
  choice: parentes
  rationale: Expressa naturalmente pessoas ligadas por parentesco, sem restringir o grau de relação.
- source_word: φίλων
  choice: amigos
  rationale: Equivalente direto, natural e adequado ao registro.
- source_word: θανατώσουσιν
  choice: matarão
  rationale: θανατόω significa causar a morte. “Matarão” é claro e natural; o contexto não exige limitar o ato a uma execução formal.
- source_word: ἐξ ὑμῶν
  choice: alguns de vocês
  rationale: A construção partitiva significa que apenas parte do grupo será morta; esta é a formulação idiomática em português.
theological_decisions:
- issue: Alcance de ἀδελφῶν em uma lista de parentesco
  choice: irmãos
  alternative: irmãos e irmãs; pessoas da própria família
  rationale: O texto principal conserva a forma masculina plural da fonte, enquanto a nota reconhece que, nesse contexto, o termo pode designar um grupo misto de irmãos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” evita formas regionais de segunda pessoa; “até por” comunica a ênfase sem tornar a frase artificial.
