id: LUK.21.4
reference: Luke 21:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: pt
  text: Pois todos estes deram para as ofertas[a] do que lhes sobrava; ela, porém, da sua carência[b], depositou tudo o que tinha para viver[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as dádivas». O grego diz literalmente «os dons» ou «as dádivas», referindo-se às contribuições feitas no contexto do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou «da sua pobreza» ou «da sua necessidade».
    reason: lexical_alternative
  - marker: c
    text: Isto é, todos os seus meios de subsistência; não «toda a sua vida» no sentido de sua existência inteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Pois todos estes
  rationale: «Pois» preserva a relação explicativa de γάρ com o versículo anterior; «todos estes» traduz diretamente πάντες... οὗτοι.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: do que lhes sobrava
  rationale: Expressa de modo natural aquilo que estava em excesso para eles e mantém o contraste com a carência da viúva.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: deram para as ofertas
  rationale: No contexto de doações no templo, «deram» comunica naturalmente o ato, enquanto «para as ofertas» conserva a referência plural de τὰ δῶρα sem especificar um tesouro ou recipiente que o versículo não nomeia.
- source_word: αὕτη δὲ
  choice: ela, porém
  rationale: Retoma naturalmente a viúva mencionada no contexto e preserva o contraste marcado por δέ.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: da sua carência
  rationale: «Carência» mantém a ideia de falta ou necessidade e o contraste lexical com aquilo que sobrava aos demais.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: tudo o que tinha para viver
  rationale: Comunica claramente os recursos materiais de subsistência, sentido contextual de βίος, evitando a leitura equivocada de que ela deu a própria existência.
- source_word: ἔβαλεν
  choice: depositou
  rationale: Preserva a imagem concreta de colocar a contribuição, com linguagem natural no contexto monetário.
theological_decisions:
- issue: Sentido de βίος na oferta da viúva
  choice: Recursos materiais necessários para viver
  alternative: Toda a sua vida, no sentido existencial
  rationale: O contexto é de contribuição monetária, e βίος aqui designa os meios de subsistência. «Tudo o que tinha para viver» preserva esse sentido sem sugerir que ela entregou literalmente a própria vida.
- issue: Referência de τὰ δῶρα
  choice: As ofertas
  alternative: As dádivas; o tesouro do templo
  rationale: «Ofertas» é natural no contexto do templo e permanece próxima da ideia de dádivas doadas. Não se introduz a especificação «tesouro do templo», que não aparece expressamente nesta frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a oposição entre sobra e carência e distingue naturalmente os dois verbos de contribuição, sem acrescentar detalhes institucionais ao cenário do templo.
