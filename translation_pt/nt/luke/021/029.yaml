  text: Καὶ εἶπεν παραβολὴν αὐτοῖς· Ἴδετε τὴν συκῆν καὶ πάντα τὰ δένδρα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: pt
  text: 'E contou-lhes uma parábola: “Observem a figueira e todas as árvores.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhem para a figueira e para todas as árvores.”'
    reason: Alternativa lexical para Ἴδετε e explicitação idiomática da regência em português.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a continuidade simples da narrativa sem acrescentar uma nuance temporal ausente do grego.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: contou-lhes uma parábola
  rationale: Embora εἶπεν normalmente signifique “disse”, em português a combinação idiomática com παραβολή é “contar uma parábola”; o pronome preserva o destinatário αὐτοῖς.
- source_word: παραβολὴν
  choice: parábola
  rationale: É o termo consagrado e contextualmente adequado para essa forma de ensino nos Evangelhos Sinóticos.
- source_word: Ἴδετε
  choice: Observem
  rationale: O imperativo dirige a atenção dos ouvintes para o exemplo visível; “Observem” é natural, claro e preserva melhor que uma formulação meramente perceptiva o valor exortativo.
- source_word: τὴν συκῆν
  choice: a figueira
  rationale: συκῆ designa a árvore, e “figueira” é o equivalente português preciso e corrente.
- source_word: πάντα τὰ δένδρα
  choice: todas as árvores
  rationale: Reproduz diretamente o plural abrangente sem inserir “outras”, palavra que não está explícita no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contou-lhes” conserva concisão e tom narrativo; “Observem” evita ambiguidade entre percepção passiva e atenção deliberada.
