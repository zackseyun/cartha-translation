  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: pt
  text: quando elas já brotam[a], vocês mesmos, ao ver isso, sabem que o verão já está perto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando já produzem novo crescimento”. O grego não diz explicitamente “folhas”, embora o contexto das árvores indique o surgimento de brotos ou folhagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal de caráter eventual; “quando” é natural em português e adequado à comparação.
- source_word: προβάλωσιν
  choice: brotam
  rationale: No contexto das árvores do versículo anterior, indica o surgimento de novo crescimento. “Brotam” comunica isso naturalmente sem inserir “folhas” no texto principal.
- source_word: ἤδη
  choice: já
  rationale: Preserva nas duas ocorrências a indicação de que tanto o brotar quanto a proximidade do verão já são perceptíveis.
- source_word: βλέποντες
  choice: ao ver isso
  rationale: Expressa a circunstância ou o meio pelo qual os ouvintes reconhecem a estação, em formulação natural em português.
- source_word: ἀφ’ ἑαυτῶν
  choice: vocês mesmos
  rationale: Indica reconhecimento baseado na própria observação, sem necessidade de explicação alheia.
- source_word: γινώσκετε
  choice: sabem
  rationale: Traduz diretamente o reconhecimento comum decorrente da observação.
- source_word: ἐγγὺς
  choice: perto
  rationale: Expressa de modo simples e natural a proximidade temporal.
- source_word: θέρος
  choice: verão
  rationale: Designa diretamente a estação do verão.
theological_decisions: []
