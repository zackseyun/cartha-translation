  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: pt
  text: Haverá sinais no sol, na lua e nas estrelas[a] e, na terra, angústia das nações, perplexas diante do rugido do mar e de sua agitação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «em sol, lua e estrelas», sem artigos.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «diante do som do mar e de sua agitação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: sinais
  rationale: É a tradução ampla e usual, adequada a fenômenos extraordinários sem defini-los mais estreitamente como presságios.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: no sol, na lua e nas estrelas
  rationale: O uso dos artigos é natural e praticamente necessário em português; a tradução mantém a estrutura coordenada dos três corpos celestes.
- source_word: συνοχὴ ἐθνῶν
  choice: angústia entre as nações
  rationale: συνοχή indica aflição opressiva ou aperto. A preposição «entre» expressa com naturalidade que essa condição atingirá as nações, sem entender ἔθνη especificamente como gentios em contraste com judeus.
- source_word: ἐν ἀπορίᾳ
  choice: que ficarão perplexas
  rationale: ἀπορία descreve quem não sabe o que fazer nem encontra saída. A oração relativa torna clara, em português corrente, a relação com as nações.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: diante do rugido do mar e das ondas revoltas
  rationale: ἦχος é o som ou estrondo, aqui expresso naturalmente como «rugido»; σάλος designa a agitação ou o revolver do mar, comunicado de modo vívido e inteligível por «ondas revoltas». «Diante de» conserva a ideia de reação sem impor uma causalidade mais rígida do que a construção grega exige.
theological_decisions:
- issue: Natureza dos fenômenos cósmicos
  choice: Apresentar diretamente os sinais celestes e a angústia terrestre, sem explicar sua natureza.
  alternative: Defini-los como perturbações astronômicas literais ou como imagens simbólico-políticas.
  rationale: O versículo não decide se os sinais são literais, simbólicos ou ambos; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Rugido do mar» e «ondas revoltas» preservam a força da cena apocalíptica sem recorrer a vocabulário arcaico; a formulação não define o modo de cumprimento dos sinais.
