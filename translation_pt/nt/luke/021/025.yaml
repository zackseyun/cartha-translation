  verdict: revise
  source_fidelity: A redação comunica adequadamente os sinais celestes, a aflição das nações e sua perplexidade perante o mar agitado. Contudo, «angústia entre as nações» enfraquece o genitivo de συνοχὴ ἐθνῶν, que se refere mais diretamente à angústia experimentada pelas nações. «Ondas revoltas» é uma explicitação possível de σάλος, mas «agitação» preserva melhor a concisão e a abrangência do termo grego.
  naturalness: A formulação revisada permanece moderna, clara e natural em português internacional, com boa legibilidade brasileira. A aposição «das nações, perplexas» reproduz de modo econômico a ligação entre ἐθνῶν e ἐν ἀπορίᾳ.
  terminology: «Sinais», «angústia», «perplexas», «rugido» e «agitação» são escolhas adequadas. «Agitação» para σάλος evita especificar indevidamente ondas como referente explícito, embora a imagem marítima permaneça clara.
