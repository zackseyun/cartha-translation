id: LUK.21.12
reference: Luke 21:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: pt
  text: Mas, antes de tudo isso, eles porão as mãos em vocês[a] e os perseguirão, entregando-os às sinagogas e às prisões; e vocês serão levados perante reis e governadores por causa do meu nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prenderão vocês”. O grego diz literalmente “porão as mãos em vocês”, expressão que aqui indica captura, prisão ou maus-tratos.
    reason: lexical_alternative
  - marker: b
    text: “Por causa do meu nome” também pode ser traduzido como “por amor do meu nome” ou, de modo mais interpretativo, “por minha causa”. A tradução principal preserva a expressão bíblica que liga o nome de Jesus à sua pessoa e autoridade.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Mas, antes de tudo isso
  rationale: πρό com o genitivo indica anterioridade temporal; πάντων é representado por “tudo”, e δέ por “Mas”, marcando a transição contrastiva.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: eles porão as mãos em vocês
  rationale: Mantém a imagem concreta do idioma grego, que neste contexto indica captura, prisão ou ação hostil.
- source_word: διώξουσιν
  choice: os perseguirão
  rationale: No contexto da oposição aos discípulos, διώκω denota perseguição, não apenas seguir ou procurar.
- source_word: παραδιδόντες
  choice: entregando-os
  rationale: O particípio expressa uma maneira pela qual ocorrerá a perseguição e conserva o matiz hostil ou judicial de παραδίδωμι.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: às sinagogas e às prisões
  rationale: εἰς, com “entregando”, indica destino. Os termos institucionais são preservados sem explicitar autoridades ou procedimentos que o texto apenas sugere.
- source_word: ἀπαγομένους
  choice: e vocês serão levados
  rationale: O particípio passivo acusativo se refere aos discípulos. A formulação explicita naturalmente em português que eles são conduzidos por outros, sem transformar a construção em voz ativa.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: perante reis e governadores
  rationale: Com verbo de condução e autoridades, ἐπί comunica comparecimento diante delas, provavelmente em contexto judicial.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: por causa do meu nome
  rationale: ἕνεκεν indica causa ou motivo. A tradução preserva a expressão bíblica “meu nome”, com sua ligação à pessoa e autoridade de Jesus.
theological_decisions:
- issue: Sentido de “meu nome” no contexto da perseguição
  choice: por causa do meu nome
  alternative: por minha causa; por causa de mim
  rationale: A expressão é mantida sem paráfrase para conservar sua ressonância bíblica, na qual o nome representa a pessoa e a autoridade de Jesus, sem limitar o sentido a uma explicação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; as formas oblíquas “os” mantêm concisão. O ponto e vírgula ajuda a distinguir a entrega às instituições da condução perante governantes, sem romper a unidade da frase.
