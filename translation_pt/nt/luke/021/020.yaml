id: LUK.21.20
reference: Luke 21:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: pt
  text: Mas, quando virem Jerusalém cercada por exércitos[a], saibam então que a sua desolação[b] está próxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por acampamentos militares”. O termo grego pode designar acampamentos ou exércitos acampados; aqui se refere às forças que cercam Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: “Desolação” retoma a linguagem profética de juízo; compare a expressão relacionada em Mateus 24:15 e Marcos 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mas, quando
  rationale: Ὅταν com o subjuntivo introduz uma situação futura esperada; “quando” é natural em português. δὲ marca uma transição ou contraste leve, aqui bem expresso por “mas”.
- source_word: ἴδητε
  choice: virem
  rationale: A forma é aoristo do subjuntivo de ὁράω após ὅταν. “Virem” mantém a segunda pessoa do plural e a construção temporal idiomática em português.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: cercada por exércitos
  rationale: O particípio passivo apresenta Jerusalém na condição de estar cercada. στρατόπεδον pode designar acampamento militar ou, por extensão contextual, as forças acampadas; “exércitos” comunica com clareza a situação de cerco, e a alternativa lexical é registrada em nota.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: τότε γνῶτε
  choice: saibam então
  rationale: γνῶτε é imperativo aoristo e conclama os ouvintes a reconhecer o significado do sinal. A colocação de “então” após o verbo é natural e preserva a relação temporal.
- source_word: ἤγγικεν
  choice: está próxima
  rationale: O perfeito de ἐγγίζω descreve algo que se aproximou e, por isso, se encontra perto. “Está próxima” expressa naturalmente em português esse estado resultante.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: a sua desolação
  rationale: “Desolação” preserva tanto o sentido de devastação quanto a ressonância da linguagem profética. “Sua” retoma Jerusalém sem impor personificação feminina, pouco natural no português corrente.
theological_decisions:
- issue: Referência ao juízo vindouro sobre Jerusalém
  choice: Traduzir ἐρήμωσις por “desolação” sem definir no texto principal um esquema interpretativo posterior.
  alternative: Usar “destruição” ou ligar explicitamente a expressão à “abominação da desolação”.
  rationale: O versículo afirma que a desolação de Jerusalém está próxima quando ela for cercada por forças militares. “Desolação” conserva o peso lexical e profético sem acrescentar uma estrutura escatológica que o próprio versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das notas foi ajustada para que cada marcador apareça imediatamente após a expressão a que se refere.
