id: LUK.21.6
reference: Luke 21:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: pt
  text: Quanto a estas coisas que vocês estão contemplando[a], virão dias em que não ficará pedra sobre pedra que não seja derrubada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas coisas que vocês veem”. O verbo pode indicar tanto ver como observar ou contemplar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não ficará pedra sobre pedra que não seja derrubada”, expressão que indica destruição completa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Quanto a estas coisas que vocês estão contemplando
  rationale: A construção topicaliza os objetos diante dos ouvintes. “Contemplando” conserva o sentido de observar atentamente e o aspecto contínuo do presente, sem reduzir o verbo ao genérico “ver”.
- source_word: ἐλεύσονται ἡμέραι
  choice: virão dias
  rationale: Reproduz de modo natural a expressão grega para acontecimentos futuros, mantendo a ausência de artigo e a forma verbal futura.
- source_word: ἐν αἷς
  choice: em que
  rationale: Expressa naturalmente em português o valor temporal da oração relativa, com correspondência próxima ao grego.
- source_word: οὐκ ἀφεθήσεται
  choice: não ficará
  rationale: Neste contexto de demolição, o passivo de ἀφίημι indica que nada será deixado ou permanecerá; “não ficará” é claro e idiomático.
- source_word: λίθος ἐπὶ λίθῳ
  choice: pedra sobre pedra
  rationale: Preserva a conhecida imagem concreta e a expressão enfática de destruição completa.
- source_word: ὃς οὐ καταλυθήσεται
  choice: que não seja derrubada
  rationale: καταλύω descreve aqui o desmantelamento de uma estrutura. “Derrubada” é natural no contexto de pedras e edifícios e preserva a intensificação da oração relativa.
theological_decisions:
- issue: Alcance e força da predição de Jesus acerca das estruturas do templo
  choice: Apresentar a declaração como uma predição concreta de destruição estrutural completa.
  alternative: Interpretá-la como juízo principalmente simbólico ou vinculá-la explicitamente a um sistema escatológico específico.
  rationale: O grego descreve diretamente as estruturas visíveis sendo desmontadas pedra por pedra. A tradução mantém essa força concreta sem acrescentar uma estrutura doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural dos destinatários; a ordem da frase conserva a ênfase inicial do grego. Todos os marcadores de nota aparecem no texto principal.
