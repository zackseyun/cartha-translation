  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: pt
  text: Mas fiquem atentos em todos os momentos, orando para que tenham força[a] para escapar de todas essas coisas que estão para acontecer[b] e para ficar de pé diante do Filho do Homem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “sejam considerados dignos de escapar de todas essas coisas” em vez de “tenham força para escapar de todas essas coisas”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “que irão acontecer”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “ficar de pé diante do Filho do Homem” pode sugerir ser aceito ou vindicado diante dele, mas o grego deixa isso implícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: fiquem atentos
  rationale: O imperativo pede vigilância contínua. A expressão é natural em português moderno e comunica o sentido metafórico de permanecer alerta sem sugerir apenas ausência literal de sono.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação às advertências anteriores.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo o tempo
  rationale: Preserva a ideia distributiva e contínua do grego em linguagem digna e compreensível.
- source_word: δεόμενοι
  choice: orando
  rationale: O particípio indica oração de súplica; “orando” é a formulação contextual mais clara.
- source_word: ἵνα κατισχύσητε
  choice: para que tenham força
  rationale: κατισχύω expressa ser forte o bastante ou prevalecer. A tradução mantém esse sentido, em contraste com a variante textual que fala em ser considerado digno.
- source_word: ἐκφυγεῖν
  choice: para escapar
  rationale: Expressa claramente o resultado desejado da força pedida em oração.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: todas essas coisas que estão para acontecer
  rationale: “Estão para acontecer” preserva a possível nuance de iminência de μέλλω, sem excluir seu sentido mais geral de futuridade.
- source_word: σταθῆναι
  choice: ficar de pé
  rationale: Mantém a imagem concreta do verbo grego e não explicita aceitação ou vindicação, sentidos apenas possíveis no contexto.
- source_word: ἔμπροσθεν
  choice: diante de
  rationale: Equivalente relacional natural e preciso em português.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: do Filho do Homem
  rationale: Forma consagrada que preserva o título e seu pano de fundo bíblico.
theological_decisions:
- issue: Sentido de κατισχύσητε em relação à perseverança escatológica
  choice: “tenham força”, conforme κατισχύσητε no SBLGNT
  alternative: “sejam considerados dignos”
  rationale: O texto adotado fala de força ou capacidade para prevalecer. A leitura ligada à dignidade pertence a uma variante textual relevante e, por isso, é registrada em nota, não incorporada ao texto principal.
- issue: Sentido de σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: “ficar de pé diante do Filho do Homem”, sem explicitação interpretativa
  alternative: “ser aceitos diante do Filho do Homem” ou “comparecer diante do Filho do Homem”
  rationale: A expressão pode sugerir aceitação ou vindicação escatológica, mas o grego deixa essa implicação sem explicá-la. A imagem e a tensão teológica são preservadas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fiquem atentos” evita a possível leitura meramente física de “fiquem acordados”; “ficar de pé” conserva a imagem escatológica sem resolver sua ambiguidade.
