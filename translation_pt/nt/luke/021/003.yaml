  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: pt
  text: 'E disse: “Em verdade lhes digo que esta viúva pobre depositou mais do que todos os outros.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Em verdade
  rationale: Introduz uma afirmação solene e enfática; a expressão é clara, digna e preserva a força característica das palavras de Jesus.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma natural em português para a expressão de fala direta, preservando tanto o destinatário plural quanto a força assertiva.
- source_word: χήρα
  choice: viúva
  rationale: Equivalente português padrão e preciso para uma mulher cujo marido morreu.
- source_word: πτωχή
  choice: pobre
  rationale: Expressa diretamente sua condição econômica sem intensificá-la além do que este adjetivo, isoladamente, exige.
- source_word: αὕτη
  choice: esta
  rationale: Mantém a força dêitica do demonstrativo, identificando a viúva que Jesus observa.
- source_word: πλεῖον
  choice: mais
  rationale: Reproduz de modo conciso e natural o comparativo quantitativo.
- source_word: πάντων
  choice: do que todos os outros
  rationale: Explicita naturalmente em português que a comparação é com os demais ofertantes, sem antecipar a explicação do versículo seguinte.
- source_word: ἔβαλεν
  choice: depositou
  rationale: No contexto do tesouro do templo, comunica de modo corrente e preciso o ato de colocar a oferta, evitando a impressão excessivamente física de 'lançou'.
theological_decisions:
- issue: Comparação entre a oferta da viúva e as demais
  choice: depositou mais do que todos os outros
  alternative: depositou mais do que qualquer um deles
  rationale: O grego πλεῖον πάντων compara a contribuição dela com as dos demais. A formulação preserva a afirmação avaliativa de Jesus sem explicar ainda que a comparação envolve proporção ou sacrifício, ponto desenvolvido no versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'Em verdade lhes digo' conserva solenidade sem recorrer a linguagem excessivamente arcaica. Nenhuma nota é necessária; a nota inglesa associada a uma alternativa lexical para ἔβαλεν parece estar com o marcador deslocado e não acrescenta informação indispensável em português.
