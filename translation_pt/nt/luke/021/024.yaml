id: LUK.21.24
reference: Luke 21:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: pt
  text: Eles cairão ao fio da espada e serão levados cativos para todas as nações[a]. Jerusalém será pisoteada pelas nações[b], até que os tempos das nações se cumpram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre todos os gentios”. A palavra grega também pode significar “gentios”, isto é, os não judeus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Jerusalém será pisoteada pelos gentios”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “até que os tempos dos gentios se cumpram”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: cairão
  rationale: No contexto de guerra, o futuro de πίπτω é uma forma idiomática de dizer que serão mortos. “Cairão” preserva a imagem e permite que a expressão seguinte indique o meio.
- source_word: στόματι μαχαίρης
  choice: ao fio da espada
  rationale: Equivalente natural em português do idioma literalmente “pela boca da espada”; mantém a imagem concreta sem produzir uma formulação estranha.
- source_word: αἰχμαλωτισθήσονται
  choice: serão levados cativos
  rationale: Preserva a voz passiva e expressa não apenas a captura, mas também a condução ou deportação dos prisioneiros.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: para todas as nações
  rationale: εἰς com acusativo expressa movimento em direção às nações. “Nações” mantém a coesão lexical das três ocorrências de ἔθνη sem decidir antecipadamente entre o sentido geopolítico e “gentios”.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma consagrada do nome da cidade em português.
- source_word: πατουμένη
  choice: será pisoteada
  rationale: O particípio passivo com ἔσται forma uma construção futura e retrata Jerusalém submetida e tratada como estando debaixo dos pés. “Será pisoteada” comunica essa imagem com clareza.
- source_word: ὑπὸ ἐθνῶν
  choice: pelas nações
  rationale: Mantém “nações” para a repetição de ἔθνη no versículo; a leitura “gentios” continua disponível em nota.
- source_word: ἄχρι οὗ
  choice: até que
  rationale: Equivalente temporal direto e natural em português.
- source_word: πληρωθῶσιν
  choice: se cumpram
  rationale: Expressa de modo idiomático a ideia passiva de chegar ao cumprimento, sem determinar se se trata apenas de término cronológico ou de realização de um propósito estabelecido.
- source_word: καιροὶ ἐθνῶν
  choice: os tempos das nações
  rationale: καιροί designa tempos ou períodos significativos, possivelmente determinados. A formulação conserva a ambiguidade do genitivo e evita impor um esquema escatológico específico.
theological_decisions:
- issue: Sentido de ἔθνη nas três ocorrências
  choice: nações
  alternative: gentios
  rationale: A tradução uniforme preserva a coesão lexical e deixa aberta a questão de o foco recair sobre povos ou poderes nacionais em geral, ou especificamente sobre os não judeus. As notas registram a alternativa tradicional e contextualmente possível “gentios”.
- issue: Sentido de καιροὶ ἐθνῶν
  choice: os tempos das nações se cumpram
  alternative: se cumpram os tempos dos gentios; se completem os períodos determinados para as nações
  rationale: A redação preserva tanto a noção de períodos significativos quanto o peso de cumprimento, sem introduzir uma cronologia escatológica denominacional nem especificar aquilo que o genitivo deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ao fio da espada” conserva o idioma tradicional ainda corrente; “serão levados cativos” comunica a deportação sem arcaísmo excessivo. As três ocorrências de ἔθνη foram traduzidas por “nações”, e a possibilidade “gentios” foi documentada nas notas.
