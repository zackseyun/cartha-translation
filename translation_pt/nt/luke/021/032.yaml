id: LUK.21.32
reference: Luke 21:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: pt
  text: 'Em verdade lhes digo: esta geração[a] certamente não passará até que todas as coisas[b] aconteçam[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este povo” ou “esta era”; a palavra grega pode ser entendida de mais de uma maneira, embora “geração” seja a tradução mais direta.
    reason: alternative_reading
  - marker: b
    text: Algumas traduções dizem “todas estas coisas”, suprindo “estas” com base no contexto; aqui, o grego diz simplesmente “todas as coisas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “se realizem” ou “venham a acontecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Em verdade
  rationale: Introduz uma afirmação solene e enfática; é uma formulação portuguesa natural e digna.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Reproduz diretamente a fórmula de fala, com uso corrente e amplamente compreensível em português.
- source_word: οὐ μὴ παρέλθῃ
  choice: certamente não passará
  rationale: A combinação οὐ μή com o subjuntivo aoristo exprime negação enfática; esta formulação preserva sua força sem exagerá-la como 'jamais'.
- source_word: ἡ γενεὰ αὕτη
  choice: esta geração
  rationale: É o sentido lexical mais direto de γενεά neste contexto, mantendo aberta a discussão sobre seu referente.
- source_word: ἕως ἂν
  choice: até que
  rationale: Expressa naturalmente em português o limite temporal indicado pela construção grega.
- source_word: πάντα
  choice: todas as coisas
  rationale: Traduz o neutro plural sem acrescentar 'estas', palavra que não aparece explicitamente no texto grego.
- source_word: γένηται
  choice: aconteçam
  rationale: Neste contexto, γίνομαι indica que algo ocorre ou vem a acontecer; o subjuntivo português se ajusta naturalmente a 'até que'.
theological_decisions:
- issue: Sentido de “esta geração” em uma declaração escatológica
  choice: Manter “esta geração” no texto principal, sem definir seu referente.
  alternative: “este povo” ou “esta era”; também se interpreta como a geração que presencia os acontecimentos.
  rationale: Embora o sentido lexical direto seja 'geração', seu referente é debatido. A tradução preserva a formulação e a tensão interpretativa do texto.
- issue: Referência de πάντα
  choice: Traduzir literalmente como “todas as coisas”.
  alternative: “todas estas coisas”
  rationale: O contexto pode indicar os acontecimentos mencionados antes, mas o grego deste versículo não contém demonstrativo; por isso ele não é acrescentado ao texto principal.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem das notas segue os termos a que se referem no texto. Evita-se linguagem denominacional e não se resolve no texto principal a controvérsia sobre o referente de “esta geração”.
