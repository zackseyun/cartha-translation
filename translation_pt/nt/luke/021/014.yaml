  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: pt
  text: Portanto, resolvam em seus corações não preparar de antemão a sua defesa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não ensaiar de antemão como se defender».
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: decidam
  rationale: O imperativo de τίθημι, na expressão idiomática com «em seu coração», comunica a ideia de tomar uma decisão firme; «decidam» é natural e preserva a força imperativa.
- source_word: οὖν
  choice: Portanto
  rationale: Marca uma conclusão ou inferência decorrente do contexto anterior e mantém explícita a ligação lógica.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: em seu coração
  rationale: Preserva o idioma bíblico do coração como centro da decisão interior. Embora o grego tenha o plural «corações», o singular distributivo é mais natural em português ao dirigir-se a várias pessoas.
- source_word: μὴ
  choice: não
  rationale: 'Nega o infinitivo dependente do imperativo: a decisão requerida é não realizar a preparação antecipada.'
- source_word: προμελετᾶν
  choice: preparar de antemão
  rationale: Abrange tanto planejar mentalmente quanto ensaiar com antecedência, sem as conotações potencialmente enganosas de «premeditar».
- source_word: ἀπολογηθῆναι
  choice: a própria defesa
  rationale: No contexto de comparecimento perante autoridades, o verbo se refere a apresentar uma defesa ou resposta formal; a formulação nominal é clara e natural em português.
theological_decisions:
- issue: Alcance da proibição de preparação prévia
  choice: Manter a referência específica à preparação antecipada da defesa no contexto de perseguição e testemunho.
  alternative: Generalizar como uma proibição de todo preparo para ensinar, pregar ou responder.
  rationale: O verbo ἀπολογέομαι e o contexto imediato apontam para uma defesa perante autoridades; o versículo não deve ser ampliado para impor uma doutrina geral contra qualquer preparação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com singular distributivo em «seu coração». «A própria defesa» conserva o contexto formal ou judicial, e a nota registra a nuance possível de ensaio antecipado.
