- from: E todo o povo ia de madrugada até ele no templo, para ouvi-lo.[a]
  to: E todo o povo ia ao encontro dele, de madrugada, no templo, para ouvi-lo.[a]
  rationale: A revisão substitui “até ele” por “ao encontro dele”, uma construção mais fluente em português contemporâneo que mantém o movimento em direção a Jesus. A posição de “de madrugada” também torna mais clara a indicação temporal e habitual do imperfeito grego.
