  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: pt
  text: E todo o povo ia ao encontro dele, de madrugada, no templo, para ouvi-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “templo” refere-se ao complexo ou aos pátios do templo, não especificamente ao santuário interior.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: Mantém o sentido coletivo e abrangente da expressão grega, sem exigir que se entenda cada indivíduo sem exceção.
- source_word: ὤρθριζεν
  choice: ia de madrugada
  rationale: O imperfeito sugere ação habitual ou repetida, e o verbo indica ir cedo, ao romper do dia. A formulação é natural e concisa em português.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Expressa o movimento em direção a Jesus, preservando a referência pronominal do grego.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a formulação corrente e legível; aqui ἱερόν designa o complexo ou os pátios do templo, esclarecimento preservado em nota.
- source_word: ἀκούειν αὐτοῦ
  choice: para ouvi-lo
  rationale: O infinitivo indica finalidade, e a construção com o genitivo significa ouvir ou escutar a pessoa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A locução “ia de madrugada” comunica tanto a chegada cedo quanto o caráter habitual indicado pelo imperfeito grego.
