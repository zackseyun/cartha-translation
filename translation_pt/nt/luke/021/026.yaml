id: LUK.21.26
reference: Luke 21:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: pt
  text: as pessoas desfalecerão de medo e da expectativa das coisas que virão sobre o mundo habitado[a], pois os poderes dos céus[b] serão abalados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao mundo” ou “à terra”; em grego, “ao mundo habitado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os poderes celestes” ou “os poderes do céu”. A expressão pode referir-se amplamente a poderes cósmicos ou celestes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: as pessoas desfalecerão
  rationale: O particípio descreve pessoas perdendo as forças ou desmaiando sob o terror. A forma finita no futuro produz uma frase natural em português dentro do cenário futuro do discurso, enquanto “desfalecerão” preserva tanto a dimensão física quanto a psicológica.
- source_word: ἀνθρώπων
  choice: as pessoas
  rationale: O plural masculino grego tem referência humana genérica, não limitada a homens; “as pessoas” comunica isso de modo claro e inclusivo.
- source_word: ἀπὸ φόβου
  choice: de medo
  rationale: A preposição ἀπό indica aqui causa ou origem. “De medo” é a expressão portuguesa natural e concisa.
- source_word: προσδοκίας
  choice: expectativa
  rationale: O substantivo significa expectativa ou espera. O contexto torna essa expectativa ameaçadora, sem que seja necessário acrescentar lexicalmente “pavorosa” ou “sombria”.
- source_word: τῶν ἐπερχομένων
  choice: das coisas que sobrevirão
  rationale: O particípio substantivado neutro plural aponta para acontecimentos vindouros. A tradução conserva a pluralidade e o caráter iminente dos eventos.
- source_word: τῇ οἰκουμένῃ
  choice: ao mundo habitado
  rationale: οἰκουμένη designa o mundo habitado, isto é, o âmbito da sociedade humana, embora também possa ser traduzido de modo mais simples por “mundo” ou “terra”.
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: os poderes dos céus
  rationale: A formulação próxima do grego preserva a possível referência ampla a forças cósmicas, celestes ou aos elementos celestes, sem decidir entre elas.
- source_word: σαλευθήσονται
  choice: serão abalados
  rationale: O futuro passivo expressa uma perturbação cósmica. “Serão abalados” mantém de modo claro a imagem literal e sua ressonância apocalíptica.
theological_decisions:
- issue: Sentido de “os poderes dos céus” no contexto apocalíptico
  choice: Manter a expressão cósmica ambígua “os poderes dos céus”.
  alternative: “os corpos celestes” ou “os poderes angelicais”
  rationale: A expressão pode evocar estruturas cósmicas, astros ou poderes celestes. O texto grego não obriga a restringi-la exclusivamente a corpos astronômicos nem a seres espirituais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a imagem apocalíptica e evita linguagem arcaica. “Diante das coisas” torna idiomática a relação entre expectativa e os acontecimentos vindouros.
