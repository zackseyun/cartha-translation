id: LUK.21.11
reference: Luke 21:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: pt
  text: Haverá grandes terremotos e, em vários lugares, fomes e epidemias; haverá também acontecimentos aterrorizantes e grandes sinais vindos do céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Céu” pode referir-se tanto ao céu visível quanto à esfera celestial; a expressão pode descrever fenômenos celestes visíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί ... μεγάλοι
  choice: grandes terremotos
  rationale: Tradução direta e natural; μεγάλοι pode indicar grande magnitude ou gravidade sem exigir maior especificação.
- source_word: κατὰ τόπους
  choice: em vários lugares
  rationale: Expressa de modo idiomático a distribuição geográfica indicada pela locução grega.
- source_word: λιμοὶ
  choice: fomes
  rationale: O substantivo designa períodos de fome generalizada, e não apenas escassez moderada de alimentos.
- source_word: λοιμοὶ
  choice: epidemias
  rationale: Comunica em português atual surtos disseminados de doença; evita o tom arcaico de 'pestilências' e a possível amplitude excessiva de 'pragas'.
- source_word: φόβητρα
  choice: acontecimentos aterrorizantes
  rationale: O raro plural neutro denota coisas ou ocorrências que causam medo; esta formulação é clara e conserva a força ameaçadora.
- source_word: σημεῖα ... μεγάλα
  choice: grandes sinais
  rationale: Preserva o termo amplo 'sinais' e o adjetivo sem acrescentar uma interpretação específica, como 'prodígios' ou 'portentos'.
- source_word: ἀπ’ οὐρανοῦ
  choice: vindos do céu
  rationale: Em português, 'céu' preserva naturalmente a ambiguidade entre a esfera celeste visível e o céu em sentido teológico.
- source_word: ἔσονται / ἔσται
  choice: haverá ... haverá
  rationale: A construção existencial é natural em português e reproduz as duas afirmações futuras do texto grego.
theological_decisions:
- issue: Sentido de οὐρανός no contexto apocalíptico
  choice: do céu
  alternative: da esfera celeste / procedentes do céu em sentido divino
  rationale: A palavra portuguesa 'céu' conserva a ambiguidade genuína do grego entre o céu visível e a esfera celestial, sem definir a natureza dos sinais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'haverá' mantém a estrutura em duas partes; 'acontecimentos aterrorizantes' evita o caráter abstrato ou pouco natural de 'terrores'. O marcador [a] aparece junto à expressão a que se refere.
