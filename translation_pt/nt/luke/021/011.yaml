  source_fidelity: 'A tradução reproduz com precisão os dois enunciados futuros do grego: grandes terremotos; fomes e epidemias distribuídas por vários lugares; acontecimentos que inspiram medo; e grandes sinais procedentes do céu. «Epidemias» é uma opção moderna e semanticamente adequada para λοιμοί, e «acontecimentos aterrorizantes» explicita de modo fiel o valor concreto de φόβητρα sem introduzir interpretação doutrinária.'
  naturalness: O português é moderno, claro e de registro digno. A pontuação torna natural a inserção «em vários lugares», e a repetição de «haverá» preserva a articulação em duas partes do original. «Vindos do céu» concorda naturalmente com «sinais».
