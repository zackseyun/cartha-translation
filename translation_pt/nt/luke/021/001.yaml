source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: pt
  text: Então, levantando os olhos, ele viu pessoas ricas depositando suas ofertas[a] no tesouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suas dádivas».
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido como «tesouro» pode referir-se à área do tesouro do templo ou aos receptáculos destinados às ofertas.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: levantando os olhos
  rationale: Expressa de modo natural em português o ato concreto de erguer o olhar, mantendo a relação circunstancial do particípio aoristo.
- source_word: δὲ
  choice: Então
  rationale: Representa o conectivo narrativo leve δέ e liga naturalmente este acontecimento ao contexto anterior, sem introduzir contraste forte.
- source_word: εἶδεν
  choice: viu
  rationale: Tradução direta e não interpretativa do aoristo de ὁράω.
- source_word: τοὺς βάλλοντας
  choice: pessoas ... depositando
  rationale: O particípio substantivado indica pessoas, posteriormente qualificadas como ricas. Neste contexto de contribuições, «depositando» é mais idiomático que «lançando» e combina com as possíveis caixas ou receptáculos.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: no tesouro
  rationale: «Tesouro» preserva a amplitude de γαζοφυλάκιον, que pode designar a área do tesouro do templo ou os receptáculos de ofertas. A preposição «em» com o verbo «depositar» comunica naturalmente o movimento para dentro.
- source_word: τὰ δῶρα αὐτῶν
  choice: suas ofertas
  rationale: Embora δῶρα signifique literalmente «dádivas» ou «presentes», no contexto cultual «ofertas» comunica com clareza a função desses donativos. A alternativa lexical é registrada em nota.
- source_word: πλουσίους
  choice: pessoas ricas
  rationale: Torna explícita em português a função substantiva/appositiva do adjetivo e evita transformar o grupo em um rótulo abstrato como «os ricos».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a sequência narrativa e evita especificar «templo» no texto principal, pois essa palavra não está expressa no versículo. Todos os marcadores de nota aparecem no texto.
