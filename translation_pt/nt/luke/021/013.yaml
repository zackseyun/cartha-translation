source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: pt
  text: Isso resultará, para vocês, em testemunho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isso dará a vocês uma oportunidade de testemunhar.”'
    reason: Alternativa lexical e contextual que explicita μαρτύριον como o ato de dar testemunho, sem excluir a formulação mais ampla do texto principal.
lexical_decisions:
- source_word: ἀποβήσεται
  choice: resultará
  rationale: O futuro de ἀποβαίνω expressa aqui desfecho ou resultado, não mera ocorrência. “Resultará” comunica isso de modo natural e direto em português.
- source_word: ὑμῖν
  choice: para vocês
  rationale: O dativo indica o resultado da situação com referência aos discípulos. “Para vocês” é claro e natural no português moderno.
- source_word: εἰς
  choice: em
  rationale: Na construção εἰς μαρτύριον, a preposição indica resultado ou finalidade. Com “resultará”, “em” reproduz naturalmente essa relação sem decidir entre resultado e oportunidade.
- source_word: μαρτύριον
  choice: testemunho
  rationale: “Testemunho” preserva tanto o ato ou conteúdo de testemunhar quanto a possível ressonância pública ou judicial do termo no contexto.
theological_decisions:
- issue: Sentido do sofrimento dos discípulos diante das autoridades
  choice: Os acontecimentos resultarão em testemunho relacionado aos discípulos, provavelmente como ocasião para testemunharem.
  alternative: Os acontecimentos servirão como prova ou testemunho contra os adversários.
  rationale: O contexto imediato favorece o testemunho dado pelos discípulos acerca de Jesus, mas a formulação concisa do grego não explicita totalmente a direção do testemunho. O texto principal preserva essa amplitude, e a nota apresenta a leitura contextual mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “para vocês” entre vírgulas mantém sua relação com o resultado e evita sugerir que o testemunho seja necessariamente dirigido a eles.
