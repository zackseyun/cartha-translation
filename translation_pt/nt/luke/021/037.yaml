id: LUK.21.37
reference: Luke 21:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: pt
  text: De dia, ele ensinava no templo[a]; à noite, saía e passava a noite[b] no monte chamado Monte das Oliveiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
  - marker: b
    text: Ou «pernoitava»; o verbo também pode sugerir que passava a noite ao relento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: ele ensinava
  rationale: A construção perifrástica no imperfeito descreve uma atividade contínua e habitual; o imperfeito português expressa isso de modo natural.
- source_word: τὰς ἡμέρας
  choice: De dia
  rationale: O acusativo temporal indica o período recorrente da atividade e forma, em português corrente, um contraste claro com «à noite».
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma portuguesa natural, enquanto a nota esclarece que ἱερόν designa o complexo ou recinto do templo, não apenas o santuário interior.
- source_word: τὰς δὲ νύκτας
  choice: à noite
  rationale: Reproduz de modo idiomático o padrão habitual e o contraste entre o dia e a noite; o ponto e vírgula torna a oposição explícita sem forçar um adversativo.
- source_word: ἐξερχόμενος
  choice: saía
  rationale: O imperfeito comunica a saída repetida e habitual associada ao período noturno.
- source_word: ηὐλίζετο
  choice: passava a noite
  rationale: Traduz diretamente a ideia de permanecer ou alojar-se durante a noite sem especificar indevidamente as condições da hospedagem.
- source_word: εἰς τὸ ὄρος
  choice: no monte
  rationale: Embora εἰς marque direção, com o verbo de pernoitar o destino resulta em localização; «no monte» é a construção natural em português.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: chamado Monte das Oliveiras
  rationale: Emprega o topônimo português estabelecido e conserva a formulação explicativa do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura paralela «De dia...; à noite...» preserva o contraste e o caráter habitual das ações sem tornar a frase artificialmente literal.
