  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: pt
  text: 'E, enquanto alguns falavam sobre o templo[a], dizendo que ele estava adornado com belas pedras e ofertas votivas[b], ele disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere ao conjunto do templo, incluindo seus pátios, e não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: Ou “dádivas consagradas”. O termo grego se refere a ofertas dedicadas a Deus e expostas no templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Enquanto alguns falavam
  rationale: A construção genitiva absoluta expressa uma circunstância temporal simultânea; esta formulação natural preserva o aspecto contínuo de λεγόντων.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: Ἱερόν designa aqui o conjunto do templo, não especificamente o santuário interior; “templo” é a forma corrente e legível em português.
- source_word: λίθοις καλοῖς
  choice: com belas pedras
  rationale: Preserva de modo direto o valor apreciativo de καλοῖς e a referência às pedras impressionantes que ornamentavam o templo.
- source_word: ἀναθήμασιν
  choice: ofertas votivas
  rationale: O termo se refere a dádivas consagradas a Deus e expostas no templo; “ofertas votivas” é preciso e evita confundi-las com sacrifícios comuns.
- source_word: κεκόσμηται
  choice: estava adornado
  rationale: O perfeito passivo descreve um ato concluído cujo resultado permanecia visível; “estava adornado” comunica naturalmente esse estado resultante em português.
- source_word: εἶπεν
  choice: ele disse
  rationale: Mantém o sujeito implícito do grego sem acrescentar explicitamente o nome de Jesus; os dois-pontos introduzem naturalmente as palavras do versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada para fluência, sem eliminar a relação entre os comentários das pessoas e o estado ornamentado do templo. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
