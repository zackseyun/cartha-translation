lexical_decisions:
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo de ὁράω é expresso diretamente por «viu», preservando o movimento simples da narrativa.
- source_word: δέ
  choice: E
  rationale: Aqui, δέ funciona como conectivo narrativo leve; «E» mantém a continuidade sem criar um contraste mais forte do que o texto indica.
- source_word: τινα
  choice: uma
  rationale: O pronome indefinido introduz uma pessoa não especificada; em português corrente, essa indefinição é naturalmente expressa pelo artigo «uma».
- source_word: χήραν
  choice: viúva
  rationale: χήρα significa diretamente «viúva» e preserva a vulnerabilidade social relevante ao contexto.
- source_word: πενιχράν
  choice: pobre
  rationale: πενιχρός descreve alguém de recursos escassos; «pobre» é natural e preciso, sem intensificar indevidamente para «indigente».
- source_word: βάλλουσαν
  choice: depositar
  rationale: Embora βάλλω possa significar literalmente «lançar», no contexto de colocar dinheiro no tesouro, «depositar» comunica a ação com naturalidade e dignidade em português moderno.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio indica o lugar já estabelecido no contexto anterior; «ali» é a correspondência direta e idiomática.
- source_word: λεπτὰ δύο
  choice: duas pequenas moedas de cobre
  rationale: Os λεπτά eram moedas de cobre de valor muito baixo. A tradução comunica o número, o tamanho e o material de modo acessível, enquanto a nota preserva o nome grego.
