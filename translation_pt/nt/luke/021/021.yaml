id: LUK.21.21
reference: Luke 21:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: pt
  text: Então, os que estiverem na Judeia fujam para os montes; os que estiverem dentro dela[a] saiam; e os que estiverem na zona rural não entrem nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos “dela” e “nela” referem-se a Jerusalém, tratada no grego por pronomes femininos.
    reason: Esclarecer o referente dos pronomes sem substituir no texto principal a forma pronominal do original.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal em relação aos sinais mencionados anteriormente e mantém o fluxo natural do discurso.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: os que estiverem na Judeia
  rationale: Expressa de modo natural as pessoas que se encontrarem na Judeia no momento descrito.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: fujam para os montes
  rationale: O imperativo comunica ação urgente, e “montes” representa diretamente ὄρη sem reduzir a referência a simples colinas.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: os que estiverem dentro dela
  rationale: “Dentro” comunica com clareza a localização no interior da cidade; “dela” conserva o pronome feminino grego sem inserir o nome Jerusalém no texto principal.
- source_word: ἐκχωρείτωσαν
  choice: saiam
  rationale: No contexto de evacuação, o verbo indica retirar-se do lugar; “saiam” é atual, direto e preserva a força imperativa.
- source_word: οἱ ἐν ταῖς χώραις
  choice: os que estiverem na zona rural
  rationale: χῶραι designa aqui as áreas rurais fora da cidade, não necessariamente campos cultivados; “zona rural” é claro em português internacional com boa legibilidade brasileira.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: não entrem nela
  rationale: Mantém a proibição imperativa e conserva o pronome feminino que retoma a cidade.
theological_decisions:
- issue: Referente dos pronomes femininos αὐτῆς e αὐτήν
  choice: Conservar a retomada pronominal feminina como “dela” e “nela”, esclarecendo em nota que se refere a Jerusalém.
  alternative: Explicitar “Jerusalém” ou “a cidade” no texto principal.
  rationale: O contexto imediato identifica Jerusalém como referente, mas o versículo grego usa apenas pronomes femininos. A tradução preserva essa textura e não introduz um substantivo ausente, enquanto a nota elimina possível ambiguidade.
translation_notes:
  register: Português moderno, digno e direto, com imperativos claros. Preferiu-se “zona rural” a “campos” para evitar a ideia restrita de terrenos cultivados. A coordenação por ponto e vírgula torna perceptível o paralelismo das três ordens.
