id: LUK.21.23
reference: Luke 21:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: pt
  text: Ai das que estiverem grávidas e das que estiverem amamentando naqueles dias! Pois haverá grande aflição sobre a terra[a] e ira contra este povo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a região” ou “sobre o país”. A palavra grega γῆ pode designar a terra em sentido amplo ou um território; aqui o contexto de Jerusalém e da Judeia favorece o sentido local.
    reason: lexical_alternative
  - marker: b
    text: Ou “ira sobre este povo”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Ai
  rationale: Preserva a exclamação profética de lamento e juízo de forma corrente e solene em português.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: das que estiverem grávidas
  rationale: Expressão natural em português moderno para o particípio grego, sem recorrer a linguagem arcaica.
- source_word: ταῖς θηλαζούσαις
  choice: das que estiverem amamentando
  rationale: Verter o verbo por “amamentando” comunica naturalmente a ação materna; o objeto implícito não precisa ser explicitado em português.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Formulação temporal corrente, clara e próxima da estrutura grega.
- source_word: ἀνάγκη μεγάλη
  choice: grande aflição
  rationale: No contexto de calamidade, ἀνάγκη indica sofrimento ou angústia extrema, e não mera necessidade.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: “Terra” preserva em português a ambiguidade de γῆ entre território local e mundo habitado; o contexto favorece a primeira acepção.
- source_word: ὀργή
  choice: ira
  rationale: Mantém o peso de indignação e juízo sem acrescentar explicitamente um agente que o grego não nomeia.
- source_word: τῷ λαῷ τούτῳ
  choice: contra este povo
  rationale: Expressa de modo natural o povo atingido pela ira, preservando a força do demonstrativo τούτῳ.
theological_decisions:
- issue: Referente e alcance de γῆ e de “este povo”
  choice: Manter “terra” no texto e indicar em nota que também pode significar “região/país”; o contexto imediato aponta principalmente para Jerusalém e a Judeia.
  alternative: Entender γῆ universalmente como o planeta ou toda a humanidade.
  rationale: O discurso circundante trata do cerco e da desolação de Jerusalém. A tradução e a nota preservam tanto o foco local provável quanto a amplitude lexical do termo.
- issue: Natureza e agente de ὀργή
  choice: Traduzir simplesmente por “ira”, sem acrescentar “de Deus”.
  alternative: “ira de Deus” ou “juízo”.
  rationale: Embora a ira possa ser entendida como divina no contexto, o texto grego não explicita seu agente; acrescentá-lo resolveria uma tensão que deve permanecer aberta.
- issue: Relação do dativo τῷ λαῷ τούτῳ com ὀργή
  choice: “ira contra este povo”
  alternative: “ira sobre este povo” ou “ira para este povo”.
  rationale: “Contra” é a construção idiomática mais clara em português para indicar o alvo da ira, sem alterar o sentido básico do dativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ai” conserva a força profética; “grávidas” e “amamentando” evitam arcaísmos. A pontuação final com vírgula acompanha o fato de o versículo continuar sintaticamente no seguinte.
