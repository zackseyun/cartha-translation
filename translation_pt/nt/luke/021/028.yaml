source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: pt
  text: Mas, quando essas coisas começarem a acontecer[a], endireitem-se e levantem a cabeça[b], porque a redenção[c] de vocês está se aproximando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à medida que essas coisas começarem a acontecer”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ergam-se e levantem a cabeça”.'
    reason: lexical_alternative
  - marker: c
    text: “Redenção” também pode ser traduzida como “libertação”; neste contexto, refere-se à libertação final que se aproxima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: Mas, quando essas coisas começarem a acontecer
  rationale: A construção com genitivo absoluto expressa uma circunstância temporal. “Quando... começarem a acontecer” preserva tanto a ideia de início quanto a de ocorrência, enquanto “Mas” marca a transição da aflição anterior para o encorajamento.
- source_word: ἀνακύψατε
  choice: endireitem-se
  rationale: O verbo pode indicar erguer ou endireitar o corpo antes curvado. “Endireitem-se” conserva a imagem corporal e sua sugestão de coragem renovada.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: levantem a cabeça
  rationale: A expressão portuguesa natural preserva a imagem idiomática de confiança e esperança. O singular coletivo “a cabeça” concorda de modo corrente com o imperativo plural dirigido aos discípulos.
- source_word: διότι
  choice: porque
  rationale: Expressa com clareza a relação causal em português contemporâneo.
- source_word: ἐγγίζει
  choice: está se aproximando
  rationale: A forma presente indica proximidade em curso; esta formulação comunica melhor o movimento de aproximação do que a expressão estática “está perto”.
- source_word: ἀπολύτρωσις
  choice: redenção
  rationale: “Redenção” preserva o peso salvífico e a amplitude do termo, que também pode denotar libertação, sem reduzi-lo a mero livramento político ou imediato.
theological_decisions:
- issue: Sentido de “a redenção de vocês” no discurso escatológico
  choice: Manter “a redenção de vocês”, apontando no contexto para a libertação e vindicação final dos discípulos de Jesus.
  alternative: Entender a expressão apenas como livramento de uma crise histórica imediata ou como realidade exclusivamente espiritual e não escatológica.
  rationale: O contexto é futuro e escatológico. A tradução mantém a profundidade de ἀπολύτρωσις sem especificar além do texto o modo ou todos os aspectos dessa redenção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” e imperativos correspondentes, evita construções excessivamente literais e conserva a imagem corporal e a tensão escatológica do grego.
