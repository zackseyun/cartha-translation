id: LUK.21.17
reference: Luke 21:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: pt
  text: E vocês serão odiados por todos por causa do meu nome[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por minha causa”. A expressão “meu nome” pode se referir à identidade e à autoridade de Jesus, bem como à confissão de lealdade a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: serão odiados
  rationale: A construção com o futuro de εἰμί e o particípio passivo é expressa naturalmente em português pelo futuro passivo, preservando a ideia de hostilidade sofrida pelos discípulos.
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Ὑπό com o genitivo indica o agente, e πάντων tem alcance amplo. “Por todos” mantém a concisão e a força generalizante do grego sem acrescentar um substantivo não expresso.
- source_word: διὰ τὸ ὄνομά μου
  choice: por causa do meu nome
  rationale: Διά com o acusativo indica causa. A formulação preserva literalmente “meu nome” e sua amplitude semântica no contexto bíblico.
theological_decisions:
- issue: Sentido de “meu nome” no contexto de perseguição aos discípulos
  choice: Manter “por causa do meu nome” no texto principal.
  alternative: “por minha causa” ou “porque vocês pertencem a mim”
  rationale: O grego menciona explicitamente o nome de Jesus. Em Lucas–Atos, o “nome” pode envolver sua identidade, autoridade e a confissão de lealdade a ele. A tradução literal preserva essa riqueza e evita limitar a expressão a apenas um desses aspectos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “E vocês” reproduz a ligação καί e explicita naturalmente a segunda pessoa do plural; “odiados por todos” conserva a formulação compacta e enfática do original.
