id: LUK.21.33
reference: Luke 21:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: pt
  text: O céu e a terra passarão, mas as minhas palavras certamente não passarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jamais passarão”. O grego emprega uma negação enfática (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: o céu e a terra
  rationale: A expressão forma um par de alcance cósmico, referindo-se ao conjunto da criação, e não apenas ao céu visível e a uma região de terra.
- source_word: παρελεύσονται
  choice: passarão
  rationale: Neste contexto, παρέρχομαι indica deixar de existir ou chegar ao fim. “Passarão” é conciso, natural e permite conservar a repetição retórica do verbo nas duas orações.
- source_word: δὲ
  choice: mas
  rationale: A conjunção introduz um contraste direto entre a transitoriedade do céu e da terra e a permanência das palavras de Jesus.
- source_word: οἱ λόγοι μου
  choice: as minhas palavras
  rationale: λόγοι refere-se aqui às palavras ou declarações de Jesus. “As minhas palavras” é uma tradução direta, clara e solene.
- source_word: οὐ μὴ
  choice: certamente não
  rationale: A combinação οὐ μή com o futuro expressa negação enfática. “Certamente não” torna explícita essa força sem recorrer a uma dupla negação artificial em português.
theological_decisions:
- issue: A força da afirmação de Jesus sobre a permanência de suas palavras
  choice: 'Preservar a negação enfática: “certamente não passarão”'
  alternative: “jamais passarão”
  rationale: O grego οὐ μή é mais forte que uma negação simples. A tradução mantém o contraste absoluto entre o caráter transitório da criação e a permanência das palavras de Jesus, sem acrescentar uma explicação doutrinária ao texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “passarão” preserva o paralelismo e o contraste do original.
