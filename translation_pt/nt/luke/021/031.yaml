id: LUK.21.31
reference: Luke 21:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: pt
  text: Assim também vocês, quando virem essas coisas acontecendo[a], saibam que o reino de Deus[b] está perto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essas coisas se realizando”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o reinado de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Assim também vocês
  rationale: Aplica aos discípulos a comparação anterior e conserva a presença enfática do pronome ὑμεῖς, sem recorrer a uma formulação artificial em português.
- source_word: ὅταν ἴδητε
  choice: quando virem
  rationale: Expressa de modo natural em português a contingência futura indicada por ὅταν com o subjuntivo aoristo.
- source_word: ταῦτα γινόμενα
  choice: essas coisas acontecendo
  rationale: Refere-se aos acontecimentos anteriormente descritos; “acontecendo” é atual e claro, enquanto a nota registra uma alternativa um pouco mais formal.
- source_word: γινώσκετε
  choice: saibam
  rationale: Traduz diretamente o imperativo presente, convocando os ouvintes a reconhecerem o significado dos sinais.
- source_word: ἐγγύς ἐστιν
  choice: está perto
  rationale: Mantém de forma concisa a metáfora de proximidade espacial ou temporal, sem acrescentar uma interpretação aspectual.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o reino de Deus
  rationale: É a expressão bíblica corrente em português e preserva as possíveis ideias de domínio, governo e esfera do reino sem restringir o sentido.
theological_decisions:
- issue: Sentido de “o reino de Deus” no contexto escatológico
  choice: Conservar “o reino de Deus” sem expansão interpretativa.
  alternative: “o reinado de Deus” ou “o governo régio de Deus está próximo de sua consumação”
  rationale: O versículo relaciona a proximidade do reino aos sinais descritos, mas não especifica se o foco é sua manifestação, consumação ou vindicação. A formulação tradicional preserva essa tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural explícito; “virem” e “saibam” preservam a relação verbal do texto grego. Os marcadores foram associados às expressões a que suas alternativas efetivamente correspondem.
