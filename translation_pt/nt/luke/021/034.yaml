id: LUK.21.34
reference: Luke 21:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: pt
  text: Mas estejam atentos a si mesmos, para que seus corações não fiquem sobrecarregados com excessos[a], embriaguez e preocupações desta vida, e aquele dia não venha de repente sobre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ressaca” ou “farra”; o termo grego pode se referir aos excessos no consumo de bebida e aos seus efeitos posteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Mas estejam atentos a si mesmos
  rationale: Expressa a ordem de vigilância pessoal e preserva o valor reflexivo de ἑαυτοῖς em português natural e digno.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: para que seus corações não fiquem sobrecarregados
  rationale: A construção preventiva traduz μήποτε, enquanto “fiquem sobrecarregados” conserva a metáfora de corações tornados pesados.
- source_word: κραιπάλῃ
  choice: excessos
  rationale: O termo pode indicar tanto a indulgência desmedida na bebida quanto seus efeitos desagradáveis. “Excessos” mantém essa amplitude sem limitar o sentido a farra ou ressaca; a nota registra a nuance.
- source_word: μέθῃ
  choice: embriaguez
  rationale: Equivalente direto e corrente para o estado ou prática de estar bêbado.
- source_word: μερίμναις βιωτικαῖς
  choice: preocupações desta vida
  rationale: Comunica as ansiedades ligadas à vida cotidiana sem acrescentar uma condenação de tudo o que é terreno.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: não venha de repente sobre vocês
  rationale: Preserva a ideia de chegada súbita sobre as pessoas, com ordem sintática natural em português.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: aquele dia
  rationale: Mantém a expressão alusiva do grego sem explicitar no texto uma identificação doutrinária que o versículo não formula.
theological_decisions:
- issue: Referência escatológica de “aquele dia”
  choice: aquele dia
  alternative: aquele dia do juízo
  rationale: O contexto aponta para o dia culminante mencionado no discurso de Jesus, mas a tradução conserva a formulação não expandida do texto grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa plural é expressa por “vocês”, evitando formas regionais; “estejam atentos a si mesmos” mantém o chamado à vigilância sem soar arcaico.
