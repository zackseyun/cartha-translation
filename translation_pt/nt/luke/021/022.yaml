  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: pt
  text: Pois estes são dias de retribuição, para que se cumpra tudo o que está escrito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois estes são dias de vingança, de modo que se cumpra tudo o que foi escrito.”'
    reason: Registra a alternativa lexical para ἐκδικήσεως e a possível nuance resultativa de τοῦ com o infinitivo.
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação causal da advertência anterior de modo natural e digno em português.
- source_word: ἡμέραι ἐκδικήσεως
  choice: dias de retribuição
  rationale: Preserva o caráter judicial e punitivo de ἐκδίκησις sem sugerir, no português corrente, vingança humana movida por rancor.
- source_word: αὗταί εἰσιν
  choice: estes são
  rationale: Mantém diretamente a cópula e o demonstrativo enfático referente aos dias em vista.
- source_word: τοῦ πλησθῆναι
  choice: para que se cumpra
  rationale: Expressa a construção articular com infinitivo, cuja força pode abranger propósito e resultado, sem a tornar excessivamente explícita.
- source_word: πάντα τὰ γεγραμμένα
  choice: tudo o que está escrito
  rationale: Reproduz a abrangência de πάντα e o estado resultante do perfeito γεγραμμένα em português natural, sem restringir expressamente o referente a uma coleção específica de Escrituras.
theological_decisions:
- issue: Natureza de ἐκδικήσεως na profecia de Jesus
  choice: retribuição
  alternative: vingança
  rationale: “Retribuição” mantém a noção de resposta judicial e punitiva. “Vingança” é lexicalmente possível, mas pode transmitir ao leitor moderno a ideia indevida de revide passional; a nota conserva essa alternativa.
- issue: Força de τοῦ com o infinitivo πλησθῆναι
  choice: para que se cumpra
  alternative: de modo que se cumpra
  rationale: A construção admite nuances de propósito e resultado. “Para que” é idiomático e conserva a orientação teleológica, sem excluir que o cumprimento seja apresentado também como resultado.
- issue: Referente de τὰ γεγραμμένα
  choice: tudo o que está escrito
  alternative: todas as Escrituras
  rationale: A formulação escolhida deixa o referente amplo como no grego e evita especificá-lo além do que o texto declara.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva tom solene e profético sem arcaísmos; “retribuição” comunica juízo punitivo com clareza.
