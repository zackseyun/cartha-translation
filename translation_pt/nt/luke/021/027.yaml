id: LUK.21.27
reference: Luke 21:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: pt
  text: E então verão o Filho do Homem vindo em uma nuvem, com poder e grande glória[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre uma nuvem”. O grego está no singular e diz literalmente “em uma nuvem”, enquanto a imagem evoca Daniel 7 e outras passagens relacionadas, nas quais o Filho do Homem vem com as nuvens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: verão
  rationale: O futuro de ὁράω expressa percepção visual futura; “verão” é direto, natural e não acrescenta solenidade ausente do texto.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva o título cristológico consagrado e sua ressonância com Daniel 7, sem reduzir a expressão a uma simples referência genérica ao ser humano.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: O particípio presente apresenta a ação em curso associada ao que será visto; “vindo” é natural e adequado ao contexto escatológico.
- source_word: ἐν νεφέλῃ
  choice: em uma nuvem
  rationale: Reflete o singular νεφέλῃ e o uso de ἐν com o dativo. A formulação mantém a imagem própria de Lucas sem harmonizá-la com passagens que falam em “nuvens”.
- source_word: μετὰ δυνάμεως
  choice: com poder
  rationale: μετά com o genitivo indica acompanhamento; “com poder” comunica de modo claro e idiomático o sentido de δύναμις.
- source_word: δόξης πολλῆς
  choice: grande glória
  rationale: “Grande glória” é a forma idiomática em português de expressar a intensidade indicada por πολλῆς, preservando o tom elevado.
theological_decisions:
- issue: Tradução do título cristológico τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: “Filho do Homem” mantém o título reconhecido aplicado a Jesus e sua ligação literária e teológica com Daniel 7, sem impor uma interpretação adicional.
- issue: Imagem da nuvem e sua ressonância daniélica e teofânica
  choice: em uma nuvem
  alternative: sobre uma nuvem
  rationale: A tradução segue a forma singular de Lucas e o sentido mais direto de ἐν, sem apagar a possível alusão a Daniel 7 nem harmonizar o versículo com outras formulações bíblicas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar artificial; o título tradicional e o vocabulário escatológico são preservados.
