id: LUK.21.15
reference: Luke 21:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: pt
  text: Pois eu lhes darei palavras[a] e sabedoria que nenhum dos que se opõem a vocês será capaz de enfrentar ou contradizer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “boca”.
    reason: Registra a metáfora do texto grego, enquanto o corpo do texto comunica seu sentido idiomático em português.
lexical_decisions:
- source_word: στόμα
  choice: palavras
  rationale: Embora o sentido literal seja “boca”, aqui a metonímia indica a capacidade e o conteúdo da fala concedida por Jesus; “palavras” comunica isso de modo natural em português.
- source_word: σοφίαν
  choice: sabedoria
  rationale: Preserva o sentido direto de discernimento e habilidade sábia para responder.
- source_word: ἀντιστῆναι
  choice: enfrentar
  rationale: No contexto de oposição verbal e testemunho, expressa a incapacidade dos adversários de fazer frente à fala concedida, sem restringir o verbo à resistência física.
- source_word: ἀντειπεῖν
  choice: contradizer
  rationale: Reproduz o sentido de falar em oposição ou contestar o que foi dito.
- source_word: ἅπαντες οἱ ἀντικείμενοι ὑμῖν
  choice: nenhum dos que se opõem a vocês
  rationale: A construção afirmativa universal sob negação é expressa naturalmente em português por “nenhum”, sem alterar seu alcance.
theological_decisions:
- issue: Natureza da promessa de Jesus
  choice: Manter a concessão futura de palavras e sabedoria sem explicar seu mecanismo ou alcance além do contexto.
  alternative: Identificar explicitamente a dádiva com inspiração verbal permanente ou com uma doutrina específica da ação do Espírito.
  rationale: O versículo atribui diretamente a Jesus a dádiva necessária para o testemunho, mas não formula aqui uma doutrina técnica nem define todas as suas aplicações.
- issue: Referente do pronome relativo ᾗ
  choice: Usar “que”, permitindo que a oração descreva naturalmente a dádiva conjunta de palavras e sabedoria.
  alternative: Limitar explicitamente a oração relativa somente à “sabedoria”, conforme a concordância feminina singular no grego.
  rationale: A concordância grega aponta formalmente para σοφίαν, mas o sentido da oração abrange de modo plausível a fala sábia como uma unidade; o relativo invariável português preserva essa tensão sem forçar uma solução.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e construção acessível a leitores brasileiros e amplamente compreensível no português internacional.
