id: LUK.21.35
reference: Luke 21:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: pt
  text: como uma armadilha.[a] Pois virá sobre todos os que habitam[b] na face de toda a terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um laço”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que estão sentados/vivem”. Neste modo de dizer grego, a expressão se refere aos que residem ou vivem na terra.
    reason: lexical_alternative
  - marker: c
    text: Ou “toda a região”, embora “toda a terra” se ajuste melhor ao alcance da expressão neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: como uma armadilha
  rationale: παγίς designa uma armadilha ou um laço. “Armadilha” é clara no português atual e preserva a imagem de algo súbito e difícil de evitar.
- source_word: ἐπεισελεύσεται
  choice: virá sobre
  rationale: O futuro de ἐπεισέρχομαι expressa a ideia de vir sobre ou alcançar alguém. O sujeito, não expresso nesta oração, é o dia mencionado no contexto anterior; a forma portuguesa mantém essa ligação implícita.
- source_word: γὰρ
  choice: Pois
  rationale: γάρ introduz a razão da advertência anterior. “Pois” conserva essa função explicativa em registro natural e digno.
- source_word: ἐπὶ πάντας
  choice: sobre todos
  rationale: ἐπί com o acusativo indica aqui aquilo ou aqueles sobre quem o acontecimento virá. “Sobre todos” combina naturalmente com “virá” e mantém a abrangência do grego.
- source_word: τοὺς καθημένους
  choice: os que habitam
  rationale: Embora κάθημαι possa significar literalmente “estar sentado”, nesta expressão idiomática refere-se aos que residem ou vivem na terra. “Habitam” comunica esse sentido sem produzir uma imagem literal enganosa.
- source_word: ἐπὶ πρόσωπον
  choice: na face de
  rationale: A expressão, de fundo semítico, significa “sobre a face/superfície de”. “Na face de” preserva a imagem bíblica e continua compreensível em português.
- source_word: πάσης τῆς γῆς
  choice: toda a terra
  rationale: γῆ pode significar “terra” tanto em sentido global como regional. Neste contexto, a combinação com “todos os que habitam na face de” favorece o alcance universal; “toda a terra” preserva também a formulação do original.
theological_decisions:
- issue: Alcance de γῆ na advertência escatológica
  choice: toda a terra
  alternative: toda a região / toda a terra de Israel
  rationale: Embora γῆ admita o sentido regional de “terra”, a expressão abrangente “todos os que habitam na face de toda a terra” favorece aqui o sentido mundial. A nota registra a alternativa sem restringir silenciosamente o alcance da advertência.
- issue: Sujeito implícito de ἐπεισελεύσεται
  choice: manter o sujeito implícito em “virá”
  alternative: explicitar “esse dia virá”
  rationale: O grego não repete o sujeito, que é recuperado do contexto anterior. O português permite a mesma elipse, evitando inserir no texto palavras não presentes nesta oração, sem alterar a referência contextual.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A tradução conserva a imagem bíblica “na face de toda a terra”, mas verte idiomaticamente τοὺς καθημένους como “os que habitam”. O fragmento inicia em minúscula porque ὡς παγίς conclui a oração iniciada no versículo anterior.
