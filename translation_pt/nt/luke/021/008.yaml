id: LUK.21.8
reference: Luke 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: pt
  text: 'Ele, porém, disse: “Tenham cuidado para não serem enganados, pois muitos virão em meu nome, dizendo: ‘Sou eu’[a] e ‘O tempo está próximo’. Não vão atrás deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: “Eu sou”; isto é, uma pessoa que afirma falsamente ser aquele que era esperado, possivelmente o Messias.'
    reason: Registra a forma mais literal da expressão grega e esclarece sua provável força contextual sem inserir “Messias” no texto principal.
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Tenham cuidado para não serem enganados
  rationale: A construção traz uma advertência à vigilância seguida de uma oração negativa. A formulação portuguesa é natural e mantém a voz passiva, apresentando os ouvintes como possíveis alvos do engano.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: virão em meu nome
  rationale: Mantém a expressão idiomática que indica apelo ao nome, à autoridade ou à identidade de Jesus, sem restringir qual desses aspectos está em primeiro plano.
- source_word: Ἐγώ εἰμι
  choice: Sou eu
  rationale: Em português, esta é uma autodeclaração elíptica natural. Preserva a falta de predicativo explícito no grego e evita acrescentar diretamente “o Messias”.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: O tempo está próximo
  rationale: καιρός designa aqui o tempo decisivo ou oportuno, e o perfeito ἤγγικεν comunica proximidade com efeito presente. “Está próximo” expressa isso com clareza em português atual.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Não vão atrás deles
  rationale: Preserva a imagem direcional de ir atrás de alguém e, no contexto, comunica a proibição de seguir esses pretendentes.
theological_decisions:
- issue: Sentido da autodeclaração Ἐγώ εἰμι feita pelos falsos pretendentes
  choice: Sou eu
  alternative: Eu sou; ou, de modo mais interpretativo, “Eu sou o Messias”
  rationale: O contexto sugere uma reivindicação de identidade ou condição esperada, possivelmente messiânica, mas o texto grego não explicita o predicativo. A tradução principal mantém a elipse e a nota registra a forma mais literal e a provável força contextual sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “tenham” e “vão” reproduz os imperativos dirigidos aos ouvintes. A pontuação apresenta as duas alegações como conteúdo do mesmo particípio “dizendo”.
