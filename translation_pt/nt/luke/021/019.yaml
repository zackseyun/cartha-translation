  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: pt
  text: Por meio da perseverança de vocês, obtenham a própria vida.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem o verbo no futuro: “Por meio da perseverança de vocês, vocês obterão a própria vida”.'
    reason: textual_variant
  - marker: b
    text: Ou “almas”; a palavra grega também pode significar “vida” ou “pessoa”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: perseverança
  rationale: No contexto de perseguição e provação, ὑπομονή indica constância resistente, não mera espera paciente. “Perseverança” é natural em português e comunica a continuidade fiel sob pressão.
- source_word: κτήσασθε
  choice: ganhem
  rationale: A forma no texto da SBLGNT é um imperativo aoristo médio. “Ganhem” preserva a força imperativa e o sentido de alcançar ou obter, sem transformar silenciosamente a forma em futuro.
- source_word: ψυχὰς
  choice: a vida de vocês
  rationale: ψυχή pode designar vida, pessoa ou alma. Neste contexto de perseguição, morte e preservação final, “vida” mantém o sentido abrangente e evita restringir a referência à parte imaterial do ser humano.
- source_word: ἐν
  choice: Por meio de
  rationale: ἐν com o dativo expressa aqui o meio pelo qual se alcança o resultado. “Por meio de” torna essa relação clara e idiomática em português.
theological_decisions:
- issue: Sentido de ψυχή no contexto escatológico de perseguição
  choice: vida em sentido integral
  alternative: alma; o próprio ser
  rationale: A tradução “vida” conserva a tensão entre o perigo físico real e a preservação definitiva prometida aos discípulos, sem impor uma antropologia estreitamente dualista.
- issue: Imperativo ou futuro em κτάομαι
  choice: 'imperativo: “ganhem”'
  alternative: 'futuro: “vocês ganharão”'
  rationale: O texto fornecido da SBLGNT traz κτήσασθε, imperativo aoristo médio, e essa forma deve orientar o texto principal. A leitura futura, bem atestada na tradição manuscrita e refletida em muitas traduções, é registrada em nota sem substituir a forma da edição-fonte.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para ampla legibilidade brasileira. A repetição de “vocês” mantém explícita a correspondência com os dois pronomes plurais gregos, embora o português também permita formulações mais compactas.
