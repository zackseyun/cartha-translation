    issue: «a vida de vocês» representa de modo impreciso o plural τὰς ψυχὰς ὑμῶν e a expressão «ganhem a vida» é ambígua em português.
    rationale: O português pode empregar singular distributivo com «a própria vida», mas «a vida de vocês» tende a apresentar uma vida coletiva e «ganhar a vida» normalmente significa obter sustento.
  - severity: low
    issue: A nota lexical não explicita que ψυχή também pode significar «vida».
    rationale: Como o texto principal emprega «vida», a nota deve esclarecer o leque semântico relevante e apresentar «almas» como alternativa, não como leitura que exclua o sentido principal.
