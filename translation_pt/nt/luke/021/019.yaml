review_pass:
  verdict: revise
  source_fidelity: A forma da SBLGNT, κτήσασθε, é imperativo aoristo médio e deve permanecer no texto principal. A formulação proposta conserva indevidamente o plural de ψυχάς como «a vida» em construção pouco natural e potencialmente ambígua em português. A nota variante pode indicar com precisão a leitura futura sem deslocar o imperativo do texto-base.
  naturalness: «Ganhem a vida de vocês» soa pouco idiomático neste contexto e pode sugerir ganhar o sustento. «Obtenham a própria vida» evita essa associação e expressa o resultado de modo mais claro, mantendo o imperativo e o valor distributivo do plural grego.
  terminology: «Perseverança» é uma boa equivalência para ὑπομονή. «A própria vida» comunica ψυχή no sentido integral/contextual, sem impor o sentido restrito de «alma». A alternativa lexical deve também reconhecer «vida», «pessoa» ou «alma» conforme o contexto.
  issues:
