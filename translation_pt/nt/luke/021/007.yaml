  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: pt
  text: 'Eles lhe perguntaram: “Mestre, quando, então, acontecerão essas coisas? E qual será o sinal quando essas coisas estiverem prestes a acontecer?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando essas coisas acontecerem”. O verbo grego também pode ser entendido de modo mais geral do que “estiverem prestes a acontecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες
  choice: Eles lhe perguntaram
  rationale: O aoristo indica uma ação passada simples; o pronome dativo é expresso naturalmente por “lhe”, e o particípio λέγοντες é representado pelos dois-pontos que introduzem a fala direta. δέ funciona aqui como conexão narrativa leve e não exige uma conjunção explícita em português.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Em português, “Mestre” é a forma corrente e digna de tratamento para alguém reconhecido como διδάσκαλος, sem exigir o sentido de senhor ou proprietário.
- source_word: πότε οὖν
  choice: quando, então
  rationale: “Quando” expressa a pergunta temporal, e “então” conserva o valor inferencial de οὖν em relação ao que Jesus acabara de dizer.
- source_word: ταῦτα ἔσται
  choice: acontecerão essas coisas
  rationale: Embora o grego use literalmente o verbo “ser”, nesse contexto a expressão indica a ocorrência dos eventos; “acontecerão” é clara e natural em português.
- source_word: σημεῖον
  choice: sinal
  rationale: “Sinal” é o equivalente comum para algo que indica ou anuncia um acontecimento significativo.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo, introduz uma circunstância temporal futura; “quando” preserva essa relação sem sugerir repetição.
- source_word: μέλλῃ ... γίνεσθαι
  choice: estiverem prestes a acontecer
  rationale: A expressão conserva a nuance de iminência potencial de μέλλω, enquanto “acontecer” comunica de modo natural o sentido contextual de γίνομαι.
theological_decisions:
- issue: Nuance temporal da linguagem escatológica
  choice: estiverem prestes a acontecer
  alternative: forem acontecer / estiverem para acontecer
  rationale: A tradução mantém a possível ideia de iminência em μέλλῃ sem definir quão próximos estão os acontecimentos nem impor um esquema escatológico específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para uma pergunta natural, mantendo “então” e a repetição de “acontecer” para refletir as duas formulações gregas relacionadas.
