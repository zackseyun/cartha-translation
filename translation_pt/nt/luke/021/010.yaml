  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: pt
  text: 'Então lhes disse: “Nação se levantará[a] contra nação, e reino contra reino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surgirá”.'
    reason: Alternativa lexical legítima para Ἐγερθήσεται neste contexto.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Funciona como marcador temporal e discursivo, ligando a fala ao contexto anterior e preservando a sequência narrativa com naturalidade.
- source_word: ἔλεγεν
  choice: disse
  rationale: Embora o imperfeito possa destacar ação contínua ou repetida, o pretérito perfeito é a forma idiomática em português para introduzir esta fala direta, sem acrescentar uma nuance aspectual incerta.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Expressa naturalmente o objeto indireto dativo em português.
- source_word: Ἐγερθήσεται
  choice: se levantará
  rationale: A forma futura de ἐγείρω, nesta fórmula de conflito, tem sentido intransitivo de erguer-se em oposição; “se levantará” preserva a imagem e soa natural.
- source_word: ἔθνος
  choice: nação
  rationale: No contexto geopolítico e em paralelo com “reino”, designa um povo entendido como entidade coletiva ou política.
- source_word: ἐπ’ ἔθνος
  choice: contra nação
  rationale: ἐπί com acusativo nesta construção indica oposição hostil; “contra” comunica isso claramente.
- source_word: βασιλεία
  choice: reino
  rationale: Aqui se refere a um domínio político concreto, e não ao exercício abstrato da realeza.
- source_word: ἐπὶ βασιλείαν
  choice: contra reino
  rationale: Repete a relação de oposição hostil da primeira oração e preserva o paralelismo da fórmula.
theological_decisions:
- issue: Fórmula apocalíptica de conflito
  choice: Apresentar a declaração como uma previsão direta de conflitos entre nações e reinos, sem impor um sistema escatológico específico.
  alternative: Restringir a previsão exclusivamente à queda de Jerusalém ou tratá-la como um cronograma detalhado do fim.
  rationale: O versículo afirma o conflito em termos gerais; a tradução deve preservar essa formulação sem decidir debates escatológicos que o próprio texto não resolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do original foram preservados sem produzir uma construção artificial.
