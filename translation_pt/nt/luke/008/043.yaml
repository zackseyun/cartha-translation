  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: pt
  text: E uma mulher que sofria de sangramento havia doze anos[a] e que tinha gastado com médicos todos os seus recursos[b] não pôde ser curada por ninguém[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinha uma hemorragia havia doze anos” ou, mais literalmente, “estava com um fluxo de sangue havia doze anos”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego βίος aqui se refere aos meios de subsistência ou aos recursos dela, não à sua vida biológica.
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos usam outra preposição grega, com o sentido de “por ninguém”, em lugar de “de ninguém”; o sentido da frase permanece o mesmo.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα ἐν ῥύσει αἵματος
  choice: uma mulher que sofria de um fluxo de sangue
  rationale: A construção participial apresenta a condição da mulher como pano de fundo. “Sofria de” é natural em português e comunica uma condição persistente, enquanto “fluxo de sangue” conserva a expressão concreta do grego.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: havia doze anos
  rationale: Neste contexto, a preposição exprime duração; “havia doze anos” é uma formulação portuguesa idiomática.
- source_word: ἰατροῖς προσαναλώσασα
  choice: havia gastado com médicos
  rationale: O particípio aoristo indica ação anterior à incapacidade expressa pelo verbo principal. O dativo identifica aqueles com quem os recursos foram gastos.
- source_word: ὅλον τὸν βίον
  choice: todos os seus recursos
  rationale: βίος aqui designa os meios de subsistência ou os bens disponíveis, não a vida biológica. “Todos os seus recursos” comunica esse sentido com clareza.
- source_word: οὐκ ἴσχυσεν
  choice: não tinha conseguido
  rationale: O verbo exprime incapacidade ou falta de êxito. O mais-que-perfeito composto se ajusta ao pano de fundo narrativo em português.
- source_word: ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ser curada por ninguém
  rationale: A formulação preserva o infinitivo passivo e entende ἀπ’ οὐδενός, no contexto, como referência ao agente de quem não veio a cura.
