id: LUK.8.29
reference: Luke 8:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: pt
  text: Pois Jesus havia ordenado ao espírito impuro que saísse do homem. Muitas vezes[a] o espírito havia se apoderado dele. Ele era mantido preso com correntes e grilhões, sob vigilância, e, rompendo as amarras, era impelido pelo demônio para lugares desertos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por muito tempo”. A expressão grega também pode indicar duração prolongada; o contexto favorece aqui episódios repetidos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para regiões desabitadas”. O grego emprega o plural, literalmente “para os lugares desertos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: havia ordenado
  rationale: O mais-que-perfeito composto expressa naturalmente em português a ação anterior que explica a reação do demônio no contexto narrativo, sem perder o valor de pano de fundo do imperfeito grego.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: ao espírito impuro
  rationale: Expressão clara e atual que preserva a linguagem de impureza do grego e identifica diretamente o agente espiritual.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: que saísse do homem
  rationale: Construção idiomática em português para a ordem de expulsão, mantendo a ideia espacial de afastamento.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: muitas vezes
  rationale: O plural e o contexto das repetidas tentativas de contenção favorecem o sentido iterativo; a possibilidade de duração prolongada é preservada em nota.
- source_word: συνηρπάκει
  choice: havia se apoderado dele
  rationale: Transmite domínio violento e irresistível de modo natural; o mais-que-perfeito mantém a informação como pano de fundo narrativo.
- source_word: ἐδεσμεύετο
  choice: era mantido preso
  rationale: Reproduz o aspecto habitual ou repetido do imperfeito e a ação de terceiros que procuravam contê-lo.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: com correntes e grilhões
  rationale: Distingue as correntes dos instrumentos de contenção dos pés, usando vocabulário compreensível e preciso.
- source_word: φυλασσόμενος
  choice: sob vigilância
  rationale: 'Expressa de forma concisa a circunstância indicada pelo particípio: ele permanecia guardado enquanto estava preso.'
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: rompia as amarras
  rationale: Mantém a força do verbo e usa um termo geral para os meios de contenção, evitando repetir “correntes”.
- source_word: ἠλαύνετο
  choice: era impelido
  rationale: Preserva a voz passiva, a coerção e o caráter repetido da ação; “impelido” evita sugerir movimento voluntário.
- source_word: ὑπὸ τοῦ δαιμονίου
  choice: pelo demônio
  rationale: Traduz diretamente a agência pessoal atribuída pelo texto ao ser demoníaco, sem suavização ou psicologização.
- source_word: εἰς τὰς ἐρήμους
  choice: para lugares desertos
  rationale: Preserva o plural grego e comunica regiões desabitadas sem especificar indevidamente um tipo de terreno.
theological_decisions:
- issue: Terminologia referente aos agentes demoníacos
  choice: espírito impuro; demônio
  alternative: espírito maligno; espírito impuro entendido metaforicamente
  rationale: A narrativa distingue e nomeia diretamente um espírito impuro e um demônio como agente pessoal. A tradução conserva essa apresentação sem convertê-la em diagnóstico psicológico nem acrescentar elaboração doutrinária.
- issue: Agência de Jesus na ordem
  choice: explicitar “Jesus” como sujeito
  alternative: usar apenas “ele”
  rationale: O sujeito está implícito no grego e é inequivocamente Jesus no contexto imediato; explicitá-lo evita ambiguidade em português sem alterar o conteúdo narrativo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil e compreensão internacional. “Impuro”, “grilhões”, “amarras” e “lugares desertos” preservam as distinções lexicais sem recorrer a formulações excessivamente arcaicas. O contraste introduzido por “mas” torna explícita em português a relação contextual entre a contenção e o rompimento, sem mudar a sequência dos acontecimentos.
