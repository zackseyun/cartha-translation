  terminology: “Espírito impuro”, “demônio”, “correntes”, “grilhões”, “amarras” e “lugares desertos” são escolhas compreensíveis e suficientemente precisas. “Espírito impuro” preserva de modo transparente o termo ἀκάθαρτος; não é necessário substituí-lo por uma expressão tradicional.
