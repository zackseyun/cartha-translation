base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: pt
  text: Outra semente caiu no meio dos espinhos, e os espinhos cresceram junto com ela e a sufocaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: Outra semente
  rationale: O adjetivo neutro singular é usado substantivamente e retoma a semente mencionada no contexto; explicitar “semente” torna a referência natural e clara em português.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Reproduz diretamente a ação narrativa simples do aoristo de πίπτω.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: no meio dos espinhos
  rationale: Preserva de perto o sentido espacial da expressão grega e soa natural em português.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: os espinhos
  rationale: Mantém a imagem tradicional de plantas espinhosas sem especificar indevidamente uma espécie vegetal.
- source_word: συμφυεῖσαι
  choice: cresceram junto com ela
  rationale: Expressa o crescimento simultâneo e lado a lado indicado pelo particípio de συμφύομαι.
- source_word: ἀπέπνιξαν
  choice: a sufocaram
  rationale: Transmite o sentido de impedir a vida ou o desenvolvimento por sufocamento e conserva a força da metáfora agrícola.
- source_word: αὐτό
  choice: a
  rationale: O pronome retoma naturalmente “semente”, substantivo feminino em português.
