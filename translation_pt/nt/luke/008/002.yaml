source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: pt
  text: 'e algumas mulheres que haviam sido curadas de espíritos malignos e enfermidades: Maria, chamada Madalena, de quem haviam saído sete demônios,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: algumas mulheres
  rationale: τινες indica um grupo indefinido; “algumas mulheres” é natural, claro e fiel em português moderno.
- source_word: ἦσαν τεθεραπευμέναι
  choice: haviam sido curadas
  rationale: A construção perifrástica com o imperfeito de εἰμί e o particípio perfeito passivo expressa uma cura anterior cujos efeitos permaneciam.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: de espíritos malignos
  rationale: Mantém a referência explícita a seres espirituais maus e não introduz “impuros”, termo que traduziria outro adjetivo grego.
- source_word: καὶ ἀσθενειῶν
  choice: e enfermidades
  rationale: ἀσθένεια designa fraquezas ou doenças físicas; “enfermidades” preserva o sentido amplo e combina naturalmente com “curadas”.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: chamada Madalena
  rationale: Reproduz de modo conciso a designação pela qual Maria era conhecida.
- source_word: ἀφ’ ἧς
  choice: de quem
  rationale: Expressa naturalmente em português a ideia de separação ou procedência marcada por ἀπό.
- source_word: δαιμόνια ἑπτὰ
  choice: sete demônios
  rationale: Preserva a referência específica a demônios, distinta do termo mais amplo “espíritos” usado anteriormente.
- source_word: ἐξεληλύθει
  choice: haviam saído
  rationale: O mais-que-perfeito indica que a saída dos demônios já havia ocorrido antes do momento narrado; o plural português concorda naturalmente com “sete demônios”.
theological_decisions:
- issue: Linguagem sobre aflição demoníaca
  choice: Manter as referências pessoais e distintas a “espíritos malignos” e “demônios”.
  alternative: Interpretar esses termos como metáforas de condições psicológicas ou físicas.
  rationale: O grego distingue πνεύματα πονηρά e δαιμόνια de ἀσθένειαι, apresentando aflições espirituais e enfermidades como categorias relacionadas, mas diferentes. A tradução conserva essa distinção sem explicação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a estrutura de continuação do versículo e evita explicitar além do que o grego afirma.
