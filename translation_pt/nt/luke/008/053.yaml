  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: pt
  text: E riam dele, porque sabiam que ela tinha morrido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: riam dele
  rationale: O imperfeito expressa uma ação em curso, e a construção portuguesa «riam dele» comunica naturalmente o sentido de escárnio dirigido a Jesus.
- source_word: αὐτοῦ
  choice: dele
  rationale: O pronome no genitivo é complemento de καταγελάω; em português, a regência idiomática é «rir de alguém».
- source_word: εἰδότες
  choice: porque sabiam
  rationale: Embora seja formalmente um particípio («sabendo»), aqui apresenta a razão da reação deles. A oração causal é clara e natural em português.
- source_word: ὅτι
  choice: que
  rationale: 'Introduz o conteúdo do conhecimento: «que ela tinha morrido».'
- source_word: ἀπέθανεν
  choice: tinha morrido
  rationale: O aoristo apresenta a morte como acontecimento concluído; o mais-que-perfeito composto situa naturalmente esse acontecimento antes da reação narrada.
theological_decisions:
- issue: Explicitar ou não a identidade da menina, embora o grego contenha apenas o verbo na terceira pessoa do singular
  choice: ela tinha morrido
  alternative: a menina tinha morrido; ela estava morta
  rationale: O referente feminino é claro no contexto. «Ela tinha morrido» preserva a concisão do original sem acrescentar um substantivo nem transformar o acontecimento de morrer em mera descrição de estado.
translation_notes:
  register: Português moderno, natural e digno, de ampla compreensão internacional e com boa legibilidade brasileira. «Riam dele» é idiomático e conserva o tom de escárnio; «porque sabiam» explicita de modo natural a força causal do particípio.
