id: LUK.8.12
reference: Luke 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: pt
  text: Os que estão à beira do caminho são os que ouviram. Depois vem o diabo e tira a palavra do coração deles, para que não creiam e sejam salvos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: à beira do caminho
  rationale: Expressa naturalmente em português a posição indicada por παρά com o acusativo e preserva a imagem da semente caída junto ao caminho.
- source_word: ἀκούσαντες
  choice: os que ouviram
  rationale: O particípio aoristo identifica as pessoas por sua ação anterior de ouvir; o pretérito perfeito é claro e natural em português.
- source_word: εἶτα
  choice: Depois
  rationale: Marca de modo simples a sequência da ação.
- source_word: ὁ διάβολος
  choice: o diabo
  rationale: Neste contexto, designa o ser pessoal maligno; esta é a equivalência corrente e inequívoca em português.
- source_word: αἴρει
  choice: tira
  rationale: Transmite o sentido contextual de remover ou levar embora, sem acrescentar ao verbo uma violência não explicitada.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Preserva o uso bíblico de λόγος; no contexto da parábola, refere-se à mensagem de Deus proclamada.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: do coração deles
  rationale: 'O singular distributivo é natural em português: cada pessoa tem a palavra retirada do próprio coração. “Coração” preserva o centro interior do pensamento, da vontade e da resposta.'
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: para que não creiam e sejam salvos
  rationale: Mantém a relação de propósito ou resultado expressa por ἵνα μή e verte naturalmente o particípio seguido do verbo finito como duas ações coordenadas.
- source_word: πιστεύσαντες
  choice: creiam
  rationale: “Crer” é a correspondência direta e tradicional de πιστεύω neste contexto, sem reduzir o sentido a mera compreensão intelectual.
- source_word: σωθῶσιν
  choice: sejam salvos
  rationale: O passivo preserva a forma grega e, no contexto lucano, comunica salvação em sentido redentor.
theological_decisions:
- issue: Relação entre crer e ser salvo
  choice: “para que não creiam e sejam salvos”
  alternative: Formulações interpretativas que expliquem a ordem causal ou a natureza da fé
  rationale: A tradução conserva a ligação feita pelo texto entre crer e ser salvo, sem introduzir uma explicação confessional sobre essa relação.
- issue: Finalidade ou resultado em ἵνα μή
  choice: “para que não”
  alternative: “de modo que não”
  rationale: A formulação principal representa adequadamente o propósito do diabo no contexto, embora a construção grega possa incluir uma nuance de resultado; não se acrescenta uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura “Os que estão à beira do caminho” retoma diretamente a imagem da parábola. Preferiu-se “do coração deles”, forma distributiva natural, em vez do menos idiomático “dos seus corações”.
