source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: pt
  text: E o espírito dela voltou[a], e ela se levantou imediatamente, e ele ordenou que lhe dessem de comer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua respiração voltou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que lhe fosse dado algo para comer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O aoristo de ἐπιστρέφω descreve aqui o retorno do espírito e a restauração da vida; “voltou” é direto, natural e não acrescenta interpretação.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: o espírito dela
  rationale: πνεῦμα pode significar “espírito”, “sopro” ou “respiração”. Neste contexto de retorno da morte, “o espírito dela” preserva melhor a amplitude e o peso da expressão grega; a possibilidade de “respiração” é mantida em nota.
- source_word: ἀνέστη
  choice: ela se levantou
  rationale: ἀνίστημι indica levantar-se ou pôr-se de pé. “Ela se levantou” é idiomático em português e descreve claramente a ação física.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: O advérbio enfatiza que a menina se levantou sem demora; “imediatamente” corresponde com clareza a essa força temporal.
- source_word: διέταξεν
  choice: ordenou
  rationale: διατάσσω expressa uma instrução autoritativa. “Ordenou” preserva essa força e é natural no contexto.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: que lhe dessem de comer
  rationale: A construção infinitiva passiva determina que algo para comer seja dado à menina. “Que lhe dessem de comer” é natural em português, preserva o sentido passivo e traduz explicitamente φαγεῖν.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto do retorno da morte
  choice: o espírito dela voltou
  alternative: sua respiração voltou
  rationale: “Espírito” preserva a extensão semântica e a tensão teológica de πνεῦμα sem reduzir a restauração da menina apenas à retomada da respiração. A alternativa lexical legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência pesada de coordenações sem apagar a progressão narrativa. “Ele” mantém o sujeito implícito do grego sem inserir explicitamente o nome de Jesus.
