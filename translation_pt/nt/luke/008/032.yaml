id: LUK.8.32
reference: Luke 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: pt
  text: Havia ali uma grande manada de porcos[a] se alimentando no monte[b]. Eles[c] lhe suplicaram que lhes permitisse entrar naqueles porcos, e ele permitiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos porcos” ou “uma manada considerável de porcos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na encosta”.
    reason: lexical_alternative
  - marker: c
    text: “Eles” se refere aos demônios ou espíritos impuros mencionados no contexto; algumas traduções tornam esse sujeito explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: uma grande manada de porcos
  rationale: “Manada de porcos” é uma expressão coletiva clara em português, e “grande” comunica de modo natural que o grupo era numeroso ou considerável.
- source_word: βοσκομένη
  choice: se alimentando
  rationale: Descreve a atividade dos porcos sem restringi-la à ideia mais específica de pastar.
- source_word: ἐν τῷ ὄρει
  choice: no monte
  rationale: Mantém de perto a referência topográfica de ὄρος; “na encosta” também é possível conforme o relevo pretendido.
- source_word: παρεκάλεσαν
  choice: suplicaram
  rationale: Expressa a intensidade do pedido melhor que o simples “pediram”, sem soar excessivamente arcaico.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: permitisse / permitiu
  rationale: Preserva em português a correspondência lexical entre o pedido e a resposta.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: entrar naqueles porcos
  rationale: Representa tanto o movimento de entrada quanto o demonstrativo ἐκείνους, deixando explícito o destino.
- source_word: δὲ
  choice: Havia ali
  rationale: O conectivo narrativo não recebe uma palavra inicial independente; a progressão do relato é transmitida naturalmente pela frase em português.
theological_decisions:
- issue: Referente do sujeito plural em παρεκάλεσαν
  choice: Manter o sujeito pronominal implícito no grego como “Eles”, esclarecendo-o em nota.
  alternative: Traduzir explicitamente “Os demônios lhe suplicaram”.
  rationale: O contexto identifica os agentes como os demônios ou espíritos impuros, mas o versículo emprega apenas o verbo no plural. A tradução conserva essa formulação sem resolver no corpo do texto o que o original deixa contextual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Suplicaram” conserva a urgência do pedido; “se alimentando” evita a especificidade potencial de “pastando”. Os marcadores foram colocados junto às expressões que explicam.
