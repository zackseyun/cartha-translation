id: LUK.8.11
reference: Luke 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: pt
  text: 'Esta é a parábola: a semente é a palavra de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Este é o sentido da parábola». Mais literalmente, o grego diz: «Esta é a parábola».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: é
  rationale: A cópula introduz diretamente a explicação de Jesus e preserva a estrutura formal do grego, sem acrescentar o substantivo interpretativo «sentido».
- source_word: δὲ
  choice: não explicitado
  rationale: A partícula marca uma transição leve. Em português, a passagem para a explicação já fica clara pelo contexto; inserir «ora» ou «então» daria à transição um peso desnecessário.
- source_word: αὕτη ἡ παραβολή
  choice: Esta é a parábola
  rationale: Reprodução próxima do grego, que diz literalmente «esta é a parábola». Embora o contexto introduza o sentido da parábola, a tradução não acrescenta «sentido» ao texto principal.
- source_word: σπόρος
  choice: semente
  rationale: O singular conserva tanto a forma grega quanto a imagem central da parábola e pode ter valor coletivo em português.
- source_word: λόγος
  choice: palavra
  rationale: Neste contexto, refere-se ao que Deus comunica. «Palavra» é clara, preserva a linguagem e as ressonâncias bíblicas e evita reduzir o termo a «mensagem».
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Traduz diretamente o genitivo, sem impor a interpretação mais específica «vinda de Deus».
theological_decisions:
- issue: Se παραβολή deve ser mantida como «parábola» ou ampliada para «sentido/explicação da parábola»
  choice: parábola
  alternative: sentido da parábola; explicação da parábola
  rationale: Embora Jesus esteja claramente explicando a história, o grego mantém o substantivo «parábola». A tradução preserva essa formulação e registra a alternativa contextual em nota, sem eliminar a tensão entre forma e função.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem simples e o vocabulário bíblico corrente preservam a concisão do original.
