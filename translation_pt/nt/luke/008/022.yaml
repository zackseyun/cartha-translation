source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: pt
  text: 'Certo dia, ele entrou num barco com os seus discípulos e lhes disse: “Vamos atravessar para o outro lado do lago”. Então partiram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então se fizeram ao largo” ou “Então zarparam”. O verbo grego é usado aqui em sentido náutico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: Certo dia
  rationale: Expressa com naturalidade o tempo indefinido da locução lucana. O valor narrativo de δέ é absorvido pela transição, sem acrescentar um advérbio temporal inexistente no grego.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ele entrou num barco com os seus discípulos
  rationale: Reproduz de modo claro a ação conjunta indicada pela coordenação grega. “Num barco” é natural em português e corresponde ao substantivo anartro.
- source_word: εἶπεν πρὸς αὐτούς
  choice: lhes disse
  rationale: Equivalente português direto e idiomático de λέγω com πρός.
- source_word: Διέλθωμεν
  choice: Vamos atravessar
  rationale: Preserva o valor exortativo da primeira pessoa do plural no subjuntivo, em formulação corrente e digna.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: para o outro lado do lago
  rationale: Mantém o destino expresso por εἰς, o sentido de τὸ πέραν e a referência específica de λίμνη a um lago.
- source_word: ἀνήχθησαν
  choice: partiram
  rationale: Comunica concisamente o início da travessia. A nota registra o sentido náutico mais específico do verbo.
theological_decisions: []
