id: LUK.8.52
reference: Luke 8:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: pt
  text: 'Todos choravam e lamentavam por ela. Mas ele disse: “Não chorem, pois ela não morreu, mas está dormindo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον
  choice: choravam
  rationale: O imperfeito indica uma ação em andamento; “choravam” preserva naturalmente esse aspecto em português.
- source_word: πάντες
  choice: todos
  rationale: Mantém de modo explícito e idiomático a abrangência universal dos que pranteavam.
- source_word: ἐκόπτοντο αὐτήν
  choice: lamentavam por ela
  rationale: No contexto de luto, κόπτομαι denota lamentação, por vezes acompanhada de bater no peito. A escolha comunica o sentido sem explicitar um gesto físico apenas implícito.
- source_word: Μὴ κλαίετε
  choice: Não chorem
  rationale: A proibição no presente pode sugerir a interrupção de uma ação em curso; “Não chorem” é natural e preserva a forma da ordem sem impor a tradução mais interpretativa “Parem de chorar”.
- source_word: οὐ γὰρ
  choice: pois ... não
  rationale: “Pois” preserva de forma concisa a função explicativa de γάρ.
- source_word: ἀπέθανεν
  choice: não morreu
  rationale: O pretérito perfeito traduz naturalmente o aoristo e mantém a afirmação verbal de Jesus, sem reformulá-la como simples descrição de estado.
- source_word: καθεύδει
  choice: está dormindo
  rationale: A locução progressiva corresponde naturalmente ao presente e preserva a metáfora verbal, em vez de reduzi-la ao adjetivo “adormecida”.
theological_decisions:
- issue: A afirmação de Jesus de que a menina “não morreu; está dormindo”
  choice: Manter literalmente a formulação contrastante e a metáfora do sono, sem explicá-la no texto principal.
  alternative: “Ela não está definitivamente morta, mas apenas dormindo” ou “Ela parece morta, mas na verdade está dormindo”.
  rationale: A fala de Jesus enquadra a condição da menina de modo metafórico ou revelador à luz de sua restauração iminente. A tradução deve conservar a tensão narrativa e teológica, sem decidir no texto se se trata de morte reversível, aparência de morte ou sono literal.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A coordenação “choravam e lamentavam” conserva os dois verbos gregos sem soar excessivamente ritual; a pontuação com ponto e vírgula realça o contraste entre “não morreu” e “está dormindo”.
