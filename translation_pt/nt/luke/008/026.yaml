  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: pt
  text: E navegaram até a região dos gerasenos[a], que fica em frente à Galileia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e passagens paralelas dos Evangelhos trazem “gadarenos” ou “gergesenos”.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: navegaram até
  rationale: O aoristo de καταπλέω descreve a viagem por água até um destino. “Navegaram até” comunica com naturalidade a chegada por barco sem impor ao português uma direção descendente que o contexto não exige.
- source_word: χώραν
  choice: região
  rationale: χώρα designa aqui uma área ou território, não um país no sentido moderno; “região” é claro e preciso.
- source_word: Γερασηνῶν
  choice: gerasenos
  rationale: Mantém no texto principal a leitura da SBLGNT e emprega a forma gentílica tradicional e inteligível em português.
- source_word: ἥτις
  choice: que
  rationale: Introduz uma oração relativa descritiva cujo antecedente é “região”; “que” é a formulação portuguesa mais natural.
- source_word: ἀντιπέρα
  choice: do outro lado, em frente a
  rationale: A expressão indica uma localização oposta, através do lago. A combinação preserva tanto a ideia de estar no lado oposto quanto a relação geográfica com a Galileia.
- source_word: Γαλιλαίας
  choice: Galileia
  rationale: Forma portuguesa consagrada do nome geográfico.
theological_decisions:
- issue: Variação textual e geográfica do nome do lugar na tradição sinótica
  choice: gerasenos
  alternative: gadarenos ou gergesenos
  rationale: O texto principal segue Γερασηνῶν, leitura da SBLGNT. As demais formas presentes na tradição manuscrita e em passagens paralelas são registradas em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Então” representa o καί narrativo sem a rigidez de iniciar com “E”; “fica” torna idiomática a descrição geográfica.
