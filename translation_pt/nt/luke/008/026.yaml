    issue: «Então» para καί
    rationale: Embora possível em narrativa portuguesa, «Então» pode sugerir uma sequência temporal ou inferencial mais marcada do que a simples coordenação narrativa do grego. «E» preserva essa abertura sem acrescentar nuance.
  - severity: low
    issue: Redundância em «do outro lado, em frente à Galileia»
    rationale: ἀντιπέρα exprime uma relação de oposição/posição em frente. A dupla expressão é desnecessária e «do outro lado» sem complemento pode ficar levemente solta.
