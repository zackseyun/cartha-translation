  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Minha mãe e meus irmãos são os que ouvem a palavra de Deus e a praticam.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus irmãos e minhas irmãs”. O grego diz literalmente “irmãos”, mas a aplicação da declaração pode abranger tanto homens como mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: Mas ele lhes respondeu
  rationale: Expressa de modo natural em português a fórmula narrativa grega ‘respondendo, disse-lhes’; ‘Mas’ preserva a transição contrastiva de δέ sem reproduzir uma redundância pouco idiomática.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: Minha mãe e meus irmãos
  rationale: Tradução direta que conserva o singular ‘mãe’ e o masculino plural ‘irmãos’, ecoando os parentes mencionados no contexto; uma possível abrangência além dos homens é indicada em nota.
- source_word: οὗτοί εἰσιν οἱ ... ἀκούοντες καὶ ποιοῦντες
  choice: são os que ouvem ... e a praticam
  rationale: ‘São os que’ integra naturalmente o demonstrativo e os particípios substantivados. Os presentes caracterizam essas pessoas por ouvir e praticar continuamente.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão tradicional e teologicamente significativa, referindo-se aqui à mensagem ou instrução procedente de Deus.
- source_word: ποιοῦντες
  choice: a praticam
  rationale: No contexto, ποιέω significa cumprir ou pôr em prática aquilo que se ouve. ‘A praticam’ é claro e idiomático, sem explicitar de maneira excessiva a ideia como ‘obedecem’ faria.
theological_decisions:
- issue: Abrangência da família redefinida por Jesus
  choice: Jesus identifica como sua família os que ouvem e praticam a palavra de Deus, sem afirmar que rejeita sua família biológica.
  alternative: Entender a fala como rejeição absoluta da família biológica ou como referência exclusiva a discípulos homens.
  rationale: A declaração redefine e amplia os vínculos de parentesco em torno da resposta à palavra de Deus. O texto conserva a referência masculina a ‘irmãos’, mas não limita explicitamente a aplicação a homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula grega redundante ἀποκριθεὶς εἶπεν foi vertida pelo idiomático ‘respondeu’, e ‘a praticam’ evita o pouco natural ‘fazem isso’.
