id: LUK.8.3
reference: Luke 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: pt
  text: e Joana, esposa de Cuza, administrador de Herodes, e Susana, e muitas outras, que os serviam[a] com os bens que possuíam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “o serviam” em vez de “os serviam”.
    reason: textual_variant
  - marker: b
    text: Ou “com os seus recursos” ou “com aquilo que lhes pertencia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: mulher de
  rationale: Em aposição a Joana e seguida do nome pessoal no genitivo, identifica naturalmente Joana como esposa de Cuza. “Mulher de” é uma forma corrente e clara em português para essa relação conjugal.
- source_word: ἐπιτρόπου
  choice: administrador
  rationale: Designa alguém encarregado de negócios, propriedades ou assuntos de outra pessoa. “Administrador” é claro no contexto da corte ou casa de Herodes e evita o tom arcaico de “mordomo”.
- source_word: ἕτεραι πολλαί
  choice: muitas outras
  rationale: O feminino plural retoma as mulheres mencionadas no contexto; não é necessário repetir “mulheres” para que a referência fique clara.
- source_word: διηκόνουν
  choice: serviam
  rationale: Preserva o sentido amplo de prestar serviço ou assistência sem impor um sentido eclesiástico posterior. A expressão seguinte indica que esse serviço envolvia seus próprios bens.
- source_word: αὐτοῖς
  choice: os
  rationale: Segue o plural do texto grego fornecido, referindo-se naturalmente a Jesus e aos que o acompanhavam.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: com os bens que possuíam
  rationale: Expressa de modo natural que elas sustentavam o grupo a partir de seus próprios recursos ou propriedades, mantendo a concretude de ὑπάρχοντα.
theological_decisions:
- issue: Referente e variante textual de αὐτοῖς
  choice: 'plural: “os serviam”, referindo-se a Jesus e aos seus companheiros'
  alternative: 'singular: “o serviam”, referindo-se a Jesus'
  rationale: O SBLGNT fornecido traz o pronome plural αὐτοῖς. A tradução segue esse texto e registra em nota a leitura singular presente em alguns manuscritos, sem resolver silenciosamente a diferença textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Administrador” comunica a função de Cuza sem soar excessivamente técnico ou arcaico; “com os bens que possuíam” mantém o apoio material explícito e natural.
