  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: pt
  text: 'Quando uma grande multidão se reunia e pessoas de uma cidade após outra vinham até ele, ele falou em parábola[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falou por meio de uma parábola». A expressão grega διὰ παραβολῆς pode indicar o meio ou a maneira de falar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: se reunia
  rationale: O particípio presente no genitivo absoluto descreve uma ação em andamento; “se reunia” expressa naturalmente a multidão convergindo.
- source_word: δὲ
  choice: Quando
  rationale: A partícula marca a continuação narrativa e é absorvida pela oração temporal em português, sem introduzir contraste indevido.
- source_word: ὄχλου πολλοῦ
  choice: uma grande multidão
  rationale: Traduz diretamente a ideia de uma multidão numerosa em português atual e natural.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: pessoas de cidade após cidade vinham
  rationale: “Cidade após cidade” preserva o sentido distributivo de κατὰ πόλιν, enquanto “pessoas” explicita naturalmente o referente humano do particípio substantivado.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Indica movimento em direção a Jesus; “até ele” é idiomático e mantém a referência pronominal do grego.
- source_word: εἶπεν
  choice: ele falou
  rationale: “Falou” combina naturalmente com a expressão seguinte, e o pronome explícito evita ambiguidade sintática após “até ele”.
- source_word: διὰ παραβολῆς
  choice: por meio de uma parábola
  rationale: Representa o valor instrumental ou modal de διά com o genitivo sem eliminar a possibilidade alternativa de entender a expressão como modo de falar.
