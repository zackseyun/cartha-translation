review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz com precisão a concessão expressa pelo perfeito passivo («foi dado»), a distinção entre «conhecer» e «entender», «mistérios», «Reino de Deus» e a força não resolvida de «para que». Contudo, «isso vem por meio de parábolas» introduz um referente abstrato e o verbo «vem», que não estão no grego e tornam menos nítida a elipse de «em parábolas».
  naturalness: 'O texto é claro e de registro apropriado. «Aos demais, porém, isso vem por meio de parábolas» soa um pouco explicativo e impreciso em português: «isso» pode remeter tanto aos mistérios quanto ao conhecimento. «Aos demais, porém, ele fala em parábolas» é natural e torna explícito apenas o verbo de comunicação exigido pela elipse contextual.'
  terminology: «Mistérios», «Reino de Deus», «parábolas» e «entendam» são escolhas adequadas e consistentes. A nota sobre «segredos» e a nota sobre Isaías preservam corretamente as alternativas lexicais e a tensão propósito/resultado. «Resultado de juízo» é mais idiomático em português do que «resultado judicial».
