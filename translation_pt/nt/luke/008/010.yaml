  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: pt
  text: 'E ele disse: “A vocês foi dado conhecer os mistérios[a] do Reino de Deus; mas, aos demais, ele fala em parábolas, para que, vendo, não vejam e, ouvindo, não entendam[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segredos”. Aqui, “mistérios” são verdades a respeito do Reino de Deus ocultas a alguns e reveladas a outros.
    reason: lexical_alternative
  - marker: b
    text: A frase “para que, vendo, não vejam e, ouvindo, não entendam” faz eco a Isaías 6:9–10 e pode expressar propósito divino, resultado de juízo, ou ambos.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: foi dado
  rationale: Preserva o perfeito passivo como concessão divina já efetuada, sem explicitar o agente que o grego deixa implícito.
- source_word: γνῶναι
  choice: conhecer
  rationale: Distingue γινώσκω de συνίημι, traduzido adiante por “entender”.
- source_word: μυστήρια
  choice: mistérios
  rationale: Mantém o sentido bíblico de realidades divinas antes ocultas e reveladas, sem reduzi-las a mera informação secreta.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Reino de Deus
  rationale: Expressão natural e tradicional que comporta tanto o domínio quanto o governo de Deus.
- source_word: τοῖς δὲ λοιποῖς
  choice: aos demais, porém
  rationale: Traduz λοιποί sem importar de Marcos a formulação “os de fora”.
- source_word: ἐν παραβολαῖς
  choice: isso vem por meio de parábolas
  rationale: Explicita com naturalidade a elipse grega, preservando as parábolas como forma ou meio da comunicação.
- source_word: ἵνα
  choice: para que
  rationale: Conserva a tensão entre propósito e resultado, sem suavizar a formulação.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: vendo, não vejam
  rationale: Preserva deliberadamente a repetição de βλέπω e o eco de Isaías.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: ouvindo, não entendam
  rationale: Mantém o contraste entre ouvir e compreender, em português claro e direto.
theological_decisions:
- issue: Força da oração introduzida por ἵνα na alusão a Isaías 6
  choice: “para que”, mantendo a formulação tensa do texto
  alternative: “de modo que”, com ênfase predominante no resultado
  rationale: O grego admite uma relação de propósito/resultado no contexto de revelação e juízo. A tradução não deve decidir silenciosamente entre propósito judicial e resultado.
- issue: Sentido de μυστήρια
  choice: “mistérios”
  alternative: “segredos”
  rationale: “Mistérios” preserva melhor a ideia de verdades do Reino ocultas a alguns e concedidas a outros, sem sugerir conhecimento esotérico independente da revelação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse em τοῖς δὲ λοιποῖς ἐν παραβολαῖς foi discretamente suprida para evitar uma frase truncada. Mantiveram-se a repetição retórica e a tensão teológica da alusão a Isaías.
