revisions:
- from: 'E ele disse: “A vocês foi dado conhecer os mistérios[a] do Reino de Deus; aos demais, porém, isso vem por meio de parábolas, para que, vendo, não vejam e, ouvindo, não entendam[b]”.'
  to: 'E ele disse: “A vocês foi dado conhecer os mistérios[a] do Reino de Deus; mas, aos demais, ele fala em parábolas, para que, vendo, não vejam e, ouvindo, não entendam[b].”'
  rationale: 'A revisão substitui a expansão pouco determinada «isso vem por meio de parábolas» por uma explicitação contextual mínima da elipse: Jesus fala aos demais em parábolas. Mantêm-se a oposição entre os dois grupos, o modo «em parábolas», a repetição de «vendo/ver» e «ouvindo/entender», e a ambiguidade teológica de ἵνα. Também se ajusta levemente a redação da nota para maior naturalidade em português, sem alterar seu conteúdo.'
