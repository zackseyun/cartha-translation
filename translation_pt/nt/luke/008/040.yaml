  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: pt
  text: Quando Jesus voltou, a multidão o acolheu[a], pois todos o esperavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o recebeu”; o verbo grego pode indicar receber ou acolher, com sentido positivo neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “estavam todos à espera dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Quando ... voltou
  rationale: A construção ἐν com infinitivo articular tem valor temporal e é expressa naturalmente por “quando”. O δέ marca a progressão narrativa, sem exigir uma palavra separada em português.
- source_word: ὑποστρέφειν
  choice: voltou
  rationale: ὑποστρέφω significa “voltar” ou “retornar”; “voltou” é claro, corrente e adequado ao contexto.
- source_word: ἀπεδέξατο
  choice: acolheu
  rationale: ἀποδέχομαι indica aqui uma recepção favorável. “Acolheu” transmite essa nuance positiva sem acrescentar explicitamente a ideia de alegria.
- source_word: ὁ ὄχλος
  choice: a multidão
  rationale: ὄχλος designa o grupo reunido; “a multidão” é a forma natural e preserva o sentido coletivo.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: pois todos o esperavam
  rationale: γάρ apresenta a razão do acolhimento. A forma “esperavam” comunica a ação contínua de προσδοκῶντες, e “todos” preserva a ênfase de πάντες.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega-se a forma portuguesa convencional do nome próprio.
