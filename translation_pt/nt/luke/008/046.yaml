  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Alguém me tocou, pois eu soube que poder tinha saído de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Alguém me tocou
  rationale: Reproduz de modo natural a construção grega, mantendo a ênfase em uma pessoa não identificada.
- source_word: ἔγνων
  choice: soube
  rationale: Expressa o sentido de reconhecer ou tomar conhecimento, sem enfraquecê-lo para uma mera impressão subjetiva.
- source_word: δύναμιν
  choice: poder
  rationale: É o equivalente corrente e contextual para a força eficaz que procede de Jesus.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: de mim saiu
  rationale: 'Conserva a imagem concreta do perfeito grego: o poder havia saído de Jesus, com resultado perceptível.'
theological_decisions:
- issue: Conhecimento de Jesus sobre a saída de poder
  choice: eu soube
  alternative: eu percebi
  rationale: “Soube” preserva mais diretamente a força de ἔγνων e evita sugerir apenas uma sensação física, sem explicar o modo desse conhecimento.
translation_notes:
  register: Português moderno, claro e digno, com ordem levemente marcada em “de mim saiu poder” para conservar o foco e a imagem do original sem soar arcaico.
