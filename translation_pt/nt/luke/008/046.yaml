  source_fidelity: A tradução transmite corretamente o toque de uma pessoa não identificada e a saída de poder de Jesus. Contudo, «saiu» verte o particípio perfeito ἐξεληλυθυῖαν como simples pretérito; «tinha saído» reproduz melhor a anterioridade e o estado resultante expresso no grego.
