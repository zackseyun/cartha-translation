  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: pt
  text: 'Mas ele lhe disse: “Filha, a sua fé salvou você[a]; vá em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “curou você” ou “deixou você bem”. O verbo grego pode se referir tanto à cura quanto à salvação.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Filha
  rationale: Mantém o vocativo literal e afetuoso, natural em português e sem acrescentar uma interpretação ausente do substantivo grego.
- source_word: πίστις
  choice: fé
  rationale: Preserva o termo teologicamente significativo; neste contexto, refere-se à confiança da mulher em Jesus.
- source_word: σέσωκέν
  choice: salvou
  rationale: O perfeito de σῴζω pode abranger salvação e cura. “Salvou” conserva a amplitude e a ressonância teológica, enquanto a nota explicita o sentido físico evidente no contexto.
- source_word: πορεύου
  choice: vá
  rationale: Imperativo direto, corrente e digno em português moderno.
- source_word: εἰς εἰρήνην
  choice: em paz
  rationale: Expressão idiomática natural em português, comunicando despedida acompanhada de paz.
- source_word: δὲ
  choice: Mas
  rationale: Representa a transição levemente contrastiva entre a confissão temerosa da mulher e a resposta tranquilizadora de Jesus.
theological_decisions:
- issue: Amplitude de σῴζω em um contexto de cura
  choice: “salvou você” no texto principal
  alternative: “curou você” ou “deixou você bem”
  rationale: A cena envolve claramente cura física, mas o verbo grego possui alcance mais amplo e pode também sugerir salvação. A tradução principal preserva essa tensão; a nota registra as possibilidades contextuais mais estreitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para concordar naturalmente com “a sua fé” e evita formulações excessivamente formais.
