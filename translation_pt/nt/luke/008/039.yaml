id: LUK.8.39
reference: Luke 8:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: pt
  text: “Volte para sua casa e conte tudo o que Deus fez por você.” Então ele foi embora, proclamando por toda a cidade tudo o que Jesus havia feito por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Volte
  rationale: O imperativo presente de ὑποστρέφω ordena o retorno a um lugar anterior. “Volte” é direto, natural e preserva esse sentido.
- source_word: εἰς τὸν οἶκόν σου
  choice: para sua casa
  rationale: Com εἰς, οἶκος tem aqui sentido espacial. “Para sua casa” é claro em português e também sugere naturalmente o retorno ao lar.
- source_word: διηγοῦ
  choice: conte
  rationale: διηγέομαι significa relatar ou narrar. “Conte” comunica isso em linguagem corrente sem perder a força da ordem.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: tudo o que Deus fez por você
  rationale: ὅσα expressa a totalidade do que foi feito. “Tudo o que” traduz o grego com naturalidade, sem acrescentar o adjetivo não expresso “grandes”.
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: O aoristo de ἀπέρχομαι indica que ele deixou o local. “Foi embora” preserva essa nuance em português natural.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: por toda a cidade
  rationale: κατά com o acusativo tem sentido distributivo neste contexto. “Por toda a cidade” expressa a extensão da proclamação de modo idiomático.
- source_word: κηρύσσων
  choice: proclamando
  rationale: κηρύσσω denota anúncio público. “Proclamando” mantém essa força sem sugerir necessariamente um sermão formal.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: tudo o que Jesus havia feito por ele
  rationale: A formulação espelha a declaração anterior sobre Deus. “Havia feito” torna clara e natural a anterioridade da ação no fluxo narrativo.
theological_decisions:
- issue: Paralelo entre “Deus” na ordem de Jesus e “Jesus” na proclamação do homem
  choice: 'Preservar o paralelo narrativo: “tudo o que Deus fez por você” / “tudo o que Jesus havia feito por ele”'
  alternative: Uniformizar as duas orações usando apenas “Deus” ou apenas “Jesus”, ou explicitar a relação entre ambos
  rationale: Lucas põe “Deus” e “Jesus” em paralelo sem explicação editorial. A tradução conserva essa tensão e sua força teológica sem acrescentar uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita o acréscimo interpretativo “grandes coisas” e prefere “tudo o que”, que representa diretamente ὅσα. Mantém-se a repetição entre as duas orações para preservar o paralelo intencional do texto.
