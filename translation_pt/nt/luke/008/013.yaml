id: LUK.8.13
reference: Luke 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: pt
  text: 'Os que estão sobre a rocha são os que, quando ouvem, recebem a palavra com alegria. Mas estes não têm raiz: creem por algum tempo e, no tempo da provação,[a] afastam-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo da tentação” ou “quando chega a prova”. O termo grego pode se referir a provação, prova ou tentação, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: sobre a rocha
  rationale: Mantém de perto a imagem concreta e singular do grego, sem transformar πέτρα em uma referência mais ampla a solo pedregoso.
- source_word: ἀκούσωσιν
  choice: ouvem
  rationale: O presente é natural em português numa construção geral introduzida por “quando” e expressa adequadamente o ato de ouvir a palavra.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Reproduz diretamente a locução grega e preserva sua força afetiva.
- source_word: δέχονται τὸν λόγον
  choice: recebem a palavra
  rationale: “Recebem” corresponde claramente a δέχονται, e “a palavra” conserva a expressão bíblica para a mensagem proclamada.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: não têm raiz
  rationale: Preserva o singular do grego e a concisão da metáfora.
- source_word: πρὸς καιρὸν
  choice: por algum tempo
  rationale: Expressa duração limitada de modo natural, sem sugerir quão longo é esse período.
- source_word: πιστεύουσιν
  choice: creem
  rationale: É o equivalente verbal direto e mantém em aberto a natureza teológica dessa fé temporária.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: no tempo da provação
  rationale: “Provação” abrange a ideia de teste ou aflição e mantém a construção temporal do original; a possível nuance de tentação é registrada em nota.
- source_word: ἀφίστανται
  choice: afastam-se
  rationale: Comunica o abandono da posição anterior sem recorrer ao termo técnico “apostatam” nem acrescentar uma direção não expressa no grego.
theological_decisions:
- issue: Se πιστεύουσιν indica fé salvadora genuína ou crença superficial
  choice: creem
  alternative: parecem crer; creem superficialmente; creem genuinamente e depois apostatam
  rationale: O texto afirma que creem por algum tempo e depois se afastam, mas não resolve por si só debates posteriores sobre perseverança, apostasia ou a natureza da fé salvadora.
- issue: Sentido de πειρασμός neste contexto
  choice: provação
  alternative: tentação; teste
  rationale: O termo grego pode designar prova, aflição ou tentação. “Provação” preserva melhor essa amplitude no contexto, enquanto a alternativa “tentação” aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação conserva a metáfora da rocha e da raiz, bem como a tensão teológica de uma fé que dura apenas algum tempo. O marcador [a] aparece no texto principal junto a “provação”.
