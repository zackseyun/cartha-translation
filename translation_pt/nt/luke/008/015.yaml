id: LUK.8.15
reference: Luke 8:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: pt
  text: Mas a semente em terra boa representa os que, tendo ouvido a palavra com coração nobre e bom, a retêm e dão fruto com perseverança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: a semente em terra boa
  rationale: A expressão grega é elíptica e retoma a semente no contexto da parábola. Explicitar “a semente” torna o referente claro em português.
- source_word: καλῇ γῇ
  choice: terra boa
  rationale: No contexto agrícola, γῆ designa a terra cultivável; “terra boa” preserva de modo natural a imagem e o contraste da parábola.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: representa os que
  rationale: A construção identifica quem é simbolizado pela semente em terra boa. “Representa os que” expressa naturalmente em português a função explicativa da parábola.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: com coração nobre e bom
  rationale: καλός pode exprimir qualidade nobre, bela ou excelente, enquanto ἀγαθός significa bom. A formulação mantém os dois adjetivos sem reduzi-los a mera sinceridade ou honestidade verbal.
- source_word: ἀκούσαντες τὸν λόγον
  choice: tendo ouvido a palavra
  rationale: O particípio aoristo indica que ouvir antecede reter e dar fruto; a formulação conserva essa relação temporal.
- source_word: κατέχουσιν
  choice: a retêm
  rationale: O verbo expressa conservar ou manter firmemente. “Retêm” é conciso, natural e comunica a permanência ativa na palavra.
- source_word: καρποφοροῦσιν
  choice: dão fruto
  rationale: Expressão portuguesa corrente que preserva a metáfora agrícola.
- source_word: ἐν ὑπομονῇ
  choice: com perseverança
  rationale: ὑπομονή denota constância e resistência firme ao longo do tempo; “com perseverança” expressa o modo como dão fruto.
theological_decisions:
- issue: Descrição moral do coração receptivo
  choice: com coração nobre e bom
  alternative: com coração honesto e bom
  rationale: A tradução preserva a dupla caracterização positiva do grego sem explicar como esse coração se forma nem introduzir conclusões sobre mérito, regeneração ou bondade inata. “Honesto” poderia restringir καλός à veracidade, enquanto “nobre” comunica melhor sua qualidade moral mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem “nobre e bom” acompanha a sequência dos adjetivos gregos e evita a repetição pouco idiomática de “bom e bom”.
