id: LUK.8.14
reference: Luke 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: pt
  text: A semente que caiu entre os espinhos corresponde aos que ouviram, mas, enquanto seguem seu caminho, são sufocados pelas preocupações[a], pelas riquezas e pelos prazeres da vida, e não produzem fruto maduro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cuidados” ou “inquietações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não levam o fruto à maturidade” ou “não completam a frutificação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: A semente que caiu entre os espinhos
  rationale: O particípio substantivado neutro retoma a semente da parábola. Em português, explicitar “semente” evita uma construção pouco natural e torna claro o referente sem alterar o sentido contextual.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: corresponde aos que ouviram
  rationale: A formulação expressa naturalmente em português a identificação entre a semente descrita e o grupo de ouvintes, evitando a discordância de número que uma reprodução rígida da sintaxe grega produziria.
- source_word: πορευόμενοι
  choice: enquanto seguem seu caminho
  rationale: Preserva o aspecto contínuo do particípio e a imagem de prosseguir, sem restringi-la explicitamente a toda a trajetória da vida.
- source_word: ὑπὸ μεριμνῶν
  choice: pelas preocupações
  rationale: “Preocupações” comunica de modo claro e atual a ideia de inquietações ou cuidados que ocupam e oprimem.
- source_word: πλούτου
  choice: pelas riquezas
  rationale: O plural coletivo é idiomático em português e preserva a referência à abundância material como influência sufocante.
- source_word: ἡδονῶν τοῦ βίου
  choice: pelos prazeres da vida
  rationale: Mantém a relação genitiva e indica os prazeres ligados à vida presente e cotidiana, sem acrescentar uma qualificação ausente no grego.
- source_word: συμπνίγονται
  choice: são sufocados
  rationale: Conserva a voz passiva e a forte imagem agrícola dos espinhos que impedem o desenvolvimento da planta.
- source_word: οὐ τελεσφοροῦσιν
  choice: não produzem fruto maduro
  rationale: Preserva tanto a metáfora do fruto quanto a noção de que ele não chega à maturidade ou conclusão.
theological_decisions:
- issue: Natureza do fracasso dos ouvintes representados pelo solo com espinhos
  choice: A tradução mantém as imagens de serem sufocados e de não produzirem fruto maduro, sem definir a condição espiritual final desses ouvintes.
  alternative: Interpretar explicitamente que nunca foram regenerados, que eram crentes verdadeiros mas se tornaram infrutíferos, ou que começaram bem e depois apostataram.
  rationale: O versículo descreve o efeito das preocupações, riquezas e prazeres sobre os ouvintes, mas não resolve por si só debates posteriores sobre regeneração, perseverança, apostasia ou perda de recompensa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A redação conserva a metáfora agrícola e o desenvolvimento progressivo indicado pelo grego.
