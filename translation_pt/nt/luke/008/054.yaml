id: LUK.8.54
reference: Luke 8:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: pt
  text: 'Mas ele, tomando-a pela mão, chamou em voz alta: “Menina[a], levante-se!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Criança”. O termo grego παῖς pode significar “criança” ou, neste contexto, “menina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Mas ele
  rationale: δέ marca aqui uma transição narrativa levemente adversativa; αὐτός é expresso naturalmente pelo pronome, sem acrescentar uma ênfase artificial com “ele mesmo”.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: tomando-a pela mão
  rationale: Expressão portuguesa natural que preserva o ato físico concreto de segurá-la pela mão, sem a força excessiva de “agarrando”.
- source_word: ἐφώνησεν λέγων
  choice: chamou em voz alta
  rationale: φωνέω indica um chamado audível, e o particípio λέγων pode ser incorporado naturalmente pela introdução direta da fala, evitando o redundante “chamou, dizendo”.
- source_word: Ἡ παῖς
  choice: Menina
  rationale: παῖς pode significar “criança” ou, conforme o contexto, “menina”. Como a pessoa interpelada é a filha de Jairo, “menina” é natural e preserva a referência contextual sem importar o diminutivo dos relatos paralelos.
- source_word: ἔγειρε
  choice: levante-se
  rationale: O imperativo de ἐγείρω ordena que ela se erga. “Levante-se” é claro, atual e digno, e mantém a força direta da ordem.
theological_decisions:
- issue: Forma de Jesus se dirigir à filha de Jairo
  choice: Menina
  alternative: Criança
  rationale: O contexto especifica que παῖς se refere a uma menina, embora o substantivo tenha amplitude lexical maior. A alternativa é registrada em nota para preservar essa ambiguidade sem harmonizar com os relatos paralelos.
- issue: Tradução da ordem ἔγειρε
  choice: levante-se
  alternative: erga-se
  rationale: A ordem permanece direta e sem linguagem arcaizante. “Levante-se” pode, no contexto, envolver tanto erguer-se fisicamente quanto retornar à vida, sem explicar além do que o texto diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi levemente ajustada para evitar a redundância pouco natural de “chamou, dizendo”, sem perder nenhum componente semântico relevante.
