source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: pt
  text: Quando os que cuidavam dos porcos viram o que tinha acontecido, fugiram e contaram o ocorrido na cidade e nos campos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na região rural». Literalmente, «nos campos».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Quando ... viram
  rationale: O particípio aoristo é expresso naturalmente como oração temporal, preservando sua relação com os verbos principais.
- source_word: οἱ βόσκοντες
  choice: os que cuidavam dos porcos
  rationale: O particípio substantivado designa, no contexto, as pessoas que cuidavam da manada de porcos; explicitar os animais evita a associação indevida de «pastores» com ovelhas.
- source_word: τὸ γεγονός
  choice: o que tinha acontecido
  rationale: O particípio perfeito substantivado indica o acontecimento já consumado; esta formulação é natural e mantém esse valor resultativo.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Equivalente direto e digno para o aoristo de φεύγω, sem acrescentar a ideia de terem escapado de algo.
- source_word: ἀπήγγειλαν
  choice: contaram o ocorrido
  rationale: ἀπαγγέλλω significa comunicar ou relatar uma notícia; a expressão explicita de modo natural em português o objeto subentendido pelo contexto.
- source_word: εἰς τὴν πόλιν
  choice: na cidade
  rationale: Embora εἰς seja direcional, com o verbo de comunicação a expressão identifica naturalmente o lugar em que a notícia foi divulgada.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: e nos campos
  rationale: Mantém a imagem concreta e o plural de ἀγρούς; no contraste com a cidade, refere-se à região rural ao redor, esclarecida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «acontecido/ocorrido» evita um pronome de referência pouco clara. A ordem dos marcadores da camada inglesa não foi reproduzida porque havia apenas uma variante pertinente ao texto português; o marcador [a] aparece no texto principal.
