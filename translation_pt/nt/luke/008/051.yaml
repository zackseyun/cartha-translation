id: LUK.8.51
reference: Luke 8:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: pt
  text: Ao chegar à casa, ele não deixou ninguém entrar com ele, a não ser Pedro, João e Tiago, e o pai e a mãe da menina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da criança”. A palavra grega pode designar uma criança em geral, mas o contexto mostra que se trata de uma menina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ao chegar
  rationale: O particípio aoristo tem aqui valor temporal; “Ao chegar” expressa com naturalidade a sequência da narrativa.
- source_word: οἰκίαν
  choice: à casa
  rationale: οἰκία designa a casa ou residência; “casa” é a correspondência direta e corrente no contexto narrativo.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: não deixou ... entrar
  rationale: ἀφίημι seguido do infinitivo significa permitir. A construção “não deixou ninguém entrar” é clara, atual e natural em português.
- source_word: τινα σὺν αὐτῷ
  choice: ninguém entrar com ele
  rationale: Sob a negação, o indefinido τινα tem força de “ninguém”; σὺν αὐτῷ é ligado naturalmente ao ato de entrar.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Depois de uma oração negativa, a expressão introduz uma exceção, não uma condição.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pedro, João e Tiago
  rationale: Empregam-se as formas tradicionais dos nomes em português e a coordenação idiomática da língua-alvo.
- source_word: τῆς παιδὸς
  choice: da menina
  rationale: παῖς pode significar criança, menino ou menina; o contexto imediato identifica a pessoa como a filha de Jairo, justificando “menina”.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: o pai e a mãe
  rationale: A tradução preserva a menção individual de ambos os pais, sem reduzi-los ao coletivo “os pais”.
theological_decisions:
- issue: Especificidade de παῖς no contexto
  choice: o pai e a mãe da menina
  alternative: o pai e a mãe da criança
  rationale: A palavra grega é lexicalmente mais ampla, mas o contexto identifica claramente a criança como menina. A alternativa geral é registrada em nota para preservar a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa natural. A coordenação dos nomes foi ajustada ao uso corrente do português, sem alterar os participantes nem a exclusividade indicada no grego.
