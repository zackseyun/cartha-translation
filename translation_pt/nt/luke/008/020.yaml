id: LUK.8.20
reference: Luke 8:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: pt
  text: 'Então lhe disseram: “Sua mãe e seus irmãos estão lá fora, querendo ver você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parentes”, caso irmãos seja entendido em sentido mais amplo neste contexto; o termo grego normalmente significa “irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: lhe disseram
  rationale: O aoristo passivo indica que a informação foi comunicada a Jesus. A construção impessoal com terceira pessoa do plural é natural em português e mantém os agentes indeterminados.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ é um conectivo narrativo leve; “Então” faz a transição de modo natural, sem introduzir contraste forte.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo marca Jesus como destinatário da informação e é expresso naturalmente por “lhe”.
- source_word: μήτηρ
  choice: mãe
  rationale: “Mãe” é o equivalente comum, claro e digno.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O substantivo está no plural masculino e seu sentido comum no contexto é “irmãos”; a tradução evita ampliar interpretativamente para “parentes”.
- source_word: ἑστήκασιν
  choice: estão
  rationale: O perfeito de ἵστημι tem força de estado presente. Em português, com “lá fora”, “estão” comunica naturalmente a presença deles no local, sem exigir o literalismo menos idiomático “estão de pé”.
- source_word: ἔξω
  choice: lá fora
  rationale: Expressão espacial corrente que representa com clareza o sentido de “fora”, sem acrescentar que se tratava de uma casa.
- source_word: ἰδεῖν
  choice: ver
  rationale: Preserva o sentido básico do infinitivo de ὁράω, sem parafraseá-lo como “falar com” ou “encontrar”.
- source_word: θέλοντες
  choice: querendo
  rationale: O particípio presente indica o desejo contemporâneo da mãe e dos irmãos e é reproduzido naturalmente pelo gerúndio.
theological_decisions:
- issue: Identidade dos ἀδελφοί em relação a Jesus
  choice: Traduzir como “irmãos” sem expansão interpretativa.
  alternative: “parentes”
  rationale: “Irmãos” preserva o sentido ordinário do termo grego. O versículo não define com maior precisão a natureza desses vínculos familiares, por isso a tradução não resolve a questão segundo uma tradição doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a construção foram ajustadas à fluência do português, preservando o conteúdo e a ambiguidade familiar relevante do grego.
