id: LUK.8.35
reference: Luke 8:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: pt
  text: Então saíram para ver o que tinha acontecido e foram até Jesus. Encontraram o homem de quem os demônios tinham saído[b] sentado aos pés de Jesus, vestido e em perfeito juízo[a]. E ficaram com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a mente sã”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem o verbo no plural (“os demônios tinham saído”); o texto impresso traz o verbo no singular com sujeito plural, mas o sentido não muda.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι descreve o movimento das pessoas para fora, a fim de examinarem o ocorrido.
- source_word: ἰδεῖν τὸ γεγονός
  choice: para ver o que tinha acontecido
  rationale: O infinitivo expressa finalidade, e o particípio perfeito substantivado é vertido de modo natural, preservando a anterioridade do acontecimento.
- source_word: ἦλθον πρὸς τὸν Ἰησοῦν
  choice: foram até Jesus
  rationale: Com verbo de movimento, πρός indica deslocamento em direção a uma pessoa; a expressão é clara e idiomática em português.
- source_word: εὗρον καθήμενον τὸν ἄνθρωπον
  choice: Encontraram o homem ... sentado
  rationale: Mantém o sentido narrativo de εὑρίσκω e apresenta a postura do homem no momento em que foi encontrado.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: de quem os demônios tinham saído
  rationale: Identifica o homem anteriormente possesso; o mais-que-perfeito composto explicita que a saída ocorreu antes de ele ser encontrado. A concordância portuguesa segue naturalmente o sujeito plural.
- source_word: δαιμόνια
  choice: demônios
  rationale: Equivalente lexical direto, preservando a dimensão pessoal e sobrenatural da narrativa.
- source_word: ἱματισμένον
  choice: vestido
  rationale: Expressa de modo corrente o estado restaurado do homem e mantém o contraste contextual com sua nudez anterior.
- source_word: σωφρονοῦντα
  choice: em perfeito juízo
  rationale: Expressão portuguesa natural para lucidez, domínio de si e sanidade, sem introduzir terminologia clínica moderna.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: aos pés de Jesus
  rationale: Verte naturalmente a posição junto aos pés de Jesus, sem tornar explícitas possíveis implicações de submissão ou discipulado.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Formulação corrente que comunica o temor provocado pelo que presenciaram.
theological_decisions:
- issue: Sentido de δαιμόνια no relato de exorcismo
  choice: demônios
  alternative: espíritos malignos
  rationale: A designação direta preserva a apresentação narrativa de seres demoníacos reais, sem reduzir o episódio a doença ou metáfora.
- issue: Nuance de σωφρονοῦντα após a expulsão dos demônios
  choice: em perfeito juízo
  alternative: com a mente sã
  rationale: Comunica a restauração da lucidez e do domínio de si, sem impor categorias clínicas ou uma interpretação denominacional.
- issue: Número do verbo em ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: 'concordância portuguesa no plural: “os demônios tinham saído”'
  alternative: reprodução literal da forma verbal singular
  rationale: O texto impresso traz verbo singular com sujeito neutro plural, construção possível no grego, enquanto há manuscritos com verbo plural. Em português, a concordância plural transmite o sentido sem criar uma anomalia gramatical artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi ajustada para evitar ambiguidade sintática e manter juntos “sentado aos pés de Jesus, vestido e em perfeito juízo”. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
