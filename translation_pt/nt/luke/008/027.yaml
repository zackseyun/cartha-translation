  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: pt
  text: Quando ele desembarcou em terra[a], veio ao encontro dele certo homem da cidade que tinha demônios[b]. E já fazia bastante tempo que ele não vestia roupa alguma e não ficava numa casa, mas entre os túmulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “quando saiu para a terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “possuído por demônios”. O grego diz literalmente “tendo demônios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: quando ele saiu para terra
  rationale: A construção participial é temporal e se refere a Jesus. A formulação conserva a ideia de sair da embarcação e passar para terra sem especificar além do grego que se tratava da margem.
- source_word: ὑπήντησεν
  choice: veio ao encontro dele
  rationale: Expressa de modo natural o movimento implícito no encontro e mantém a ação direta da narrativa.
- source_word: ἀνήρ τις
  choice: certo homem
  rationale: Preserva tanto o sentido masculino de ἀνήρ quanto a indefinição com alguma especificidade comunicada por τις.
- source_word: ἐκ τῆς πόλεως
  choice: da cidade
  rationale: Indica de modo conciso a origem ou associação do homem com a cidade.
- source_word: ἔχων δαιμόνια
  choice: que tinha demônios
  rationale: Segue de perto a expressão grega, literalmente 'tendo demônios', sem introduzir no texto principal o termo mais interpretativo 'possuído'.
- source_word: χρόνῳ ἱκανῷ
  choice: havia bastante tempo
  rationale: Comunica uma duração considerável em português natural e introduz adequadamente a descrição de estado prolongado.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: não vestia roupa alguma
  rationale: Reproduz em português corrente a ausência prolongada do ato de vestir qualquer peça de roupa, sem sugerir apenas um episódio isolado.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: não ficava numa casa
  rationale: Mantém a amplitude de μένω, que pode significar ficar, permanecer ou morar, sem definir de modo excessivo uma residência permanente.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: mas entre os túmulos
  rationale: Túmulos é a equivalência contextual precisa para μνήμασιν; 'entre' expressa naturalmente o ambiente dos sepulcros.
theological_decisions:
- issue: Tradução de δαιμόνια no contexto de opressão demoníaca
  choice: demônios
  alternative: espíritos impuros
  rationale: O termo grego é especificamente δαιμόνια, não πνεύματα ἀκάθαρτα; 'demônios' preserva essa distinção lexical.
- issue: Tradução da expressão ἔχων δαιμόνια
  choice: que tinha demônios
  alternative: possuído por demônios
  rationale: A redação principal conserva a forma menos interpretativa do original e deixa a expressão idiomática comum como alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação com “e” foi mantida na segunda frase para refletir καί sem sugerir uma relação causal. As notas foram associadas aos trechos correspondentes do texto principal.
