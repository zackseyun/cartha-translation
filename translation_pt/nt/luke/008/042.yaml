- from: porque ele tinha uma filha única[a], de cerca de doze anos, e ela estava morrendo. Enquanto ele seguia caminho, as multidões se apertavam ao redor dele[b].
  to: porque ele tinha sua única filha[a], de cerca de doze anos, e ela estava morrendo. Enquanto ele seguia caminho, as multidões o apertavam[b].
  rationale: A revisão substitui a construção reflexiva por “o apertavam”, que mantém Jesus como aquele sobre quem recaía a pressão das multidões. Também ajusta a ordem de “sua única filha” para uma formulação portuguesa mais idiomática, sem alterar o sentido.
