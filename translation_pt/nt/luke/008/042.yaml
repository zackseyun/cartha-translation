id: LUK.8.42
reference: Luke 8:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: pt
  text: porque ele tinha sua única filha[a], de cerca de doze anos, e ela estava morrendo. Enquanto ele seguia caminho, as multidões o apertavam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “uma filha única”.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego sugere que as multidões o apertavam com tanta força que quase o esmagavam ou sufocavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Mantém a relação causal com o pedido de Jairo no versículo anterior.
- source_word: θυγάτηρ μονογενὴς
  choice: uma filha única
  rationale: Neste contexto familiar, μονογενής indica uma filha única, sem sugerir uma nuance metafísica ou enfatizar o ato de gerar.
- source_word: ὡς ἐτῶν δώδεκα
  choice: de cerca de doze anos
  rationale: ὡς diante de um número indica aproximação; a formulação é natural em português e não apresenta a idade como exata.
- source_word: ἀπέθνῃσκεν
  choice: estava morrendo
  rationale: O imperfeito retrata um processo em andamento, não uma morte já consumada.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Enquanto ele seguia caminho
  rationale: A construção com infinitivo articular expressa uma ação simultânea; o destino é conhecido pelo contexto, mas não é explicitado nesta oração.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Preserva o plural do texto grego sem recorrer ao registro antiquado de “multidões” em sentido solene; aqui a palavra continua natural no contexto narrativo.
- source_word: συνέπνιγον
  choice: se apertavam ao redor dele
  rationale: Comunica a forte pressão física exercida pela aglomeração sem traduzir literalmente a imagem de sufocamento de modo potencialmente enganoso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A oração inicial permanece ligada causalmente ao versículo anterior. Preservam-se a aproximação da idade, o aspecto contínuo de “estava morrendo” e o plural “multidões”.
