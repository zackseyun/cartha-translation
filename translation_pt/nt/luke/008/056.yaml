  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: pt
  text: E os pais dela ficaram espantados[a], mas ele lhes ordenou[b] que não contassem a ninguém o que havia acontecido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram maravilhados” ou “ficaram fora de si”.
    reason: lexical_alternative
  - marker: b
    text: Ou “instruiu”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a coisa que havia acontecido” ou “o acontecimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: ficaram maravilhados
  rationale: O aoristo de ἐξίστημι descreve uma reação intensa de espanto. “Ficaram maravilhados” é natural e digno em português, sem perder a força do termo.
- source_word: γονεῖς
  choice: os pais
  rationale: γονεῖς é o termo plural comum para os pais de alguém; esta é a forma mais direta e idiomática em português.
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: παραγγέλλω comunica uma determinação ou ordem. “Ordenou” preserva com clareza a força diretiva do verbo neste contexto.
- source_word: μηδενὶ
  choice: a ninguém
  rationale: Com o infinitivo εἰπεῖν, o dativo μηδενί é expresso naturalmente em português pela construção negativa “não contassem a ninguém”.
- source_word: εἰπεῖν
  choice: contassem
  rationale: Embora λέγω possa significar “dizer”, diante de um destinatário e de um acontecimento como conteúdo, “contar a alguém” é a formulação mais natural em português.
- source_word: τὸ γεγονός
  choice: o que havia acontecido
  rationale: O particípio perfeito substantivado refere-se ao acontecimento já ocorrido. A construção preserva seu aspecto retrospectivo e soa natural em português.
- source_word: δὲ
  choice: mas
  rationale: δέ assinala um contraste leve entre o assombro dos pais e a ordem dada por Jesus; “mas” torna essa relação clara.
theological_decisions:
- issue: Motivo do segredo messiânico e alcance da ordem de Jesus
  choice: Traduzir diretamente como uma ordem para não contar a ninguém o que havia acontecido, sem explicar seu motivo ou duração.
  alternative: Interpretar a fala como uma ordem de silêncio público ligada ao chamado segredo messiânico, ou como uma proibição apenas temporária e limitada.
  rationale: O versículo não informa a razão nem a duração da proibição. A tradução mantém essa tensão e não introduz uma interpretação teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores foi normalizada para que cada nota apareça junto à expressão correspondente no texto.
