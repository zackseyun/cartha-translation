id: LUK.8.49
reference: Luke 8:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: pt
  text: 'Enquanto ele ainda falava, chegou alguém da parte do dirigente da sinagoga e disse: “Sua filha morreu; não incomode mais o mestre”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não dê mais trabalho ao mestre”.
    reason: Alternativa lexical para σκύλλε, que pode realçar o esforço ou transtorno causado ao mestre.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Enquanto ele ainda falava
  rationale: O genitivo absoluto indica uma ação simultânea, e ἔτι acrescenta a ideia de continuidade expressa por “ainda”.
- source_word: ἔρχεταί τις
  choice: chegou alguém
  rationale: O presente histórico é vertido naturalmente pelo passado na narrativa em português, e τις permanece indefinido como “alguém”.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: da parte do dirigente da sinagoga
  rationale: παρά com o genitivo indica procedência. “Da parte de” preserva a ideia de que a pessoa veio enviada pelo dirigente, sem acrescentar que necessariamente veio da casa dele.
- source_word: λέγων
  choice: e disse
  rationale: A coordenação verbal é mais natural em português narrativo do que a reprodução rígida do particípio, sem alterar sua função de introduzir a mensagem.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Sua filha morreu
  rationale: O perfeito grego apresenta a morte como fato consumado com resultado presente. Em português, o pretérito perfeito comunica isso de modo natural; “tem morrido” seria inadequado neste contexto.
- source_word: μηκέτι σκύλλε
  choice: não incomode mais
  rationale: A proibição com μηκέτι pede a cessação da ação. “Incomodar” comunica de modo corrente o sentido contextual de σκύλλω, isto é, causar trabalho ou transtorno.
- source_word: τὸν διδάσκαλον
  choice: o mestre
  rationale: διδάσκαλος designa quem ensina. “Mestre” é um título corrente e digno em português, sem acrescentar uma afirmação cristológica além do texto.
theological_decisions:
- issue: Título ἀρχισυνάγωγος aplicado a Jairo
  choice: dirigente da sinagoga
  alternative: chefe da sinagoga
  rationale: Trata-se de uma função institucional. “Dirigente” é claro no português moderno e evita conotações eclesiásticas posteriores.
- issue: Tradução de διδάσκαλος
  choice: o mestre
  alternative: o professor
  rationale: “Mestre” conserva o uso respeitoso do título no contexto, enquanto “professor” soaria excessivamente escolar e moderno. A inicial minúscula evita inserir no texto uma interpretação tipográfica ausente do grego.
- issue: Estado resultante expresso por Τέθνηκεν
  choice: morreu
  alternative: está morta
  rationale: “Morreu” preserva em português natural o acontecimento consumado; “está morta” destacaria apenas o estado resultante. Nenhuma implicação sobre a possibilidade de restauração é acrescentada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “da parte do dirigente” preserva a relação de procedência sem introduzir “casa”, que não aparece no grego. A pontuação mantém as duas partes da mensagem estreitamente ligadas.
