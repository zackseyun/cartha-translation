id: LUK.8.24
reference: Luke 8:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: pt
  text: 'Então eles se aproximaram e o acordaram, dizendo: “Mestre, Mestre, estamos perecendo!” Ele, ao despertar, repreendeu o vento e a agitação da água[a]; ambos cessaram, e houve calmaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ondas revoltas”.
    reason: Alternativa lexical para κλύδωνι τοῦ ὕδατος, que pode descrever a forte agitação da água ou as ondas resultantes.
lexical_decisions:
- source_word: προσελθόντες
  choice: eles se aproximaram
  rationale: O particípio aoristo de προσέρχομαι indica o movimento em direção a Jesus antes de o acordarem; a formulação é natural e não acrescenta detalhes.
- source_word: διήγειραν
  choice: o acordaram
  rationale: O aoristo ativo de διεγείρω descreve de modo direto e idiomático a ação de tirar Jesus do sono.
- source_word: Ἐπιστάτα
  choice: Mestre
  rationale: Este vocativo característico de Lucas reconhece a autoridade de Jesus. “Mestre” é corrente em português e não restringe o termo à atividade de ensino.
- source_word: ἀπολλύμεθα
  choice: estamos perecendo
  rationale: Preserva o aspecto presente e a gravidade do perigo mortal, sem suavizar a exclamação.
- source_word: διεγερθεὶς
  choice: despertando
  rationale: Mantém a sequência participial e não determina além do grego se o despertar é apresentado como passivo ou simplesmente como mudança de estado.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: Conserva a força de uma ordem autoritativa dirigida ao vento e à água, além de corresponder ao uso recorrente do verbo nos Evangelhos.
- source_word: ἀνέμῳ
  choice: o vento
  rationale: É a equivalência lexical direta, sem ampliar o substantivo para “vendaval” ou “tempestade”.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: a agitação das águas
  rationale: κλύδων designa ondulação forte, vaga ou agitação; “agitação das águas” preserva a imagem e soa natural em português, sem reduzi-la simplesmente a “ondas”.
- source_word: ἐπαύσαντο
  choice: ambos cessaram
  rationale: O verbo plural retoma o vento e a agitação das águas; “ambos” torna essa concordância clara em português sem mudar o referente.
- source_word: ἐγένετο γαλήνη
  choice: houve calmaria
  rationale: Expressa naturalmente o resultado indicado por γίνομαι com γαλήνη e preserva a ideia de súbita tranquilidade.
theological_decisions:
- issue: Forma de tratamento Ἐπιστάτα dirigida a Jesus
  choice: Mestre
  alternative: Instrutor; Chefe
  rationale: “Mestre” comunica respeito e autoridade no português corrente sem limitar a função de Jesus ao ensino nem introduzir terminologia eclesiástica posterior.
- issue: Autoridade de Jesus sobre a criação em ἐπετίμησεν
  choice: repreendeu
  alternative: ordenou; falou severamente a
  rationale: A tradução preserva a apresentação textual de uma ação autoritativa sobre o vento e a água, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática “Mestre, Mestre” e o plural de ἐπαύσαντο foram preservados; “ambos” evita uma referência pronominal pouco natural.
