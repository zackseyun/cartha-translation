  revision_rationale: A única alteração substitui “despertando” por “ao despertar”, a fim de expressar com naturalidade portuguesa a anterioridade do particípio aoristo em relação à repreensão. Também se emprega “da água”, em singular, para refletir diretamente o genitivo singular τοῦ ὕδατος, sem perda de naturalidade.
