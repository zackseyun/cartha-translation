review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a aproximação dos discípulos, o apelo repetido, o perigo iminente, a repreensão ao vento e à agitação da água, e o resultado de calmaria. Contudo, “despertando” sugere uma ação simultânea/em curso, enquanto o particípio aoristo διεγερθείς situa o despertar como anterior à repreensão. “Ao despertar” conserva a concisão e a sequência sem especificar indevidamente o agente do despertar.
  naturalness: O texto tem registro moderno, claro e digno. “Ao despertar” é mais natural e temporalmente preciso neste contexto do que “despertando”. “Ambos cessaram” é uma solução aceitável para preservar o plural grego, com referentes explícitos.
  terminology: “Mestre” é uma opção apropriada para Ἐπιστάτα no uso lucano. “Repreendeu” preserva a força de ἐπετίμησεν. “Agitação da água” representa bem κλύδωνι τοῦ ὕδατος; a nota oferece uma alternativa legítima sem transformar o texto principal em interpretação excessivamente específica.
  issues:
  - severity: medium
    issue: “despertando” para διεγερθείς
    rationale: O gerúndio português normalmente apresenta simultaneidade ou modo (“enquanto despertava”), mas o particípio aoristo introduz a ação completada que antecede “repreendeu”. “Ao despertar” preserva melhor a relação temporal e não resolve além do necessário a voz passiva do grego.
