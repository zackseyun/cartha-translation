revisions:
- from: 'Então eles se aproximaram e o acordaram, dizendo: “Mestre, Mestre, estamos perecendo!” Ele, despertando, repreendeu o vento e a agitação das águas[a]; ambos cessaram, e houve calmaria.'
  to: 'Então eles se aproximaram e o acordaram, dizendo: “Mestre, Mestre, estamos perecendo!” Ele, ao despertar, repreendeu o vento e a agitação da água[a]; ambos cessaram, e houve calmaria.'
