id: LUK.8.33
reference: Luke 8:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: pt
  text: Então os demônios saíram do homem e entraram nos porcos. A manada disparou encosta íngreme abaixo[a], para dentro do lago, e se afogou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo barranco íngreme”; ou: “pelo precipício”. O grego indica uma descida íngreme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: saíram
  rationale: O particípio aoristo expressa uma ação anterior ao verbo principal; a coordenação em português comunica naturalmente a sequência dos acontecimentos.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Traduz diretamente o substantivo grego, preservando sua distinção lexical em relação a expressões como “espíritos impuros”.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: do homem
  rationale: Refere-se ao homem mencionado no contexto anterior; com “saíram”, esta é a construção idiomática em português.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: entraram nos porcos
  rationale: Expressa de modo claro e natural o movimento para dentro dos animais.
- source_word: τοὺς χοίρους
  choice: os porcos
  rationale: Termo moderno, comum e preciso, preferível ao mais literário “suínos” neste relato.
- source_word: ὥρμησεν
  choice: disparou
  rationale: Comunica o movimento súbito e impetuoso indicado pelo verbo, sem acrescentar uma causa ou intenção.
- source_word: ἡ ἀγέλη
  choice: a manada
  rationale: É um substantivo coletivo claro e corrente para o grupo de porcos e mantém a concordância no singular do texto grego.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: encosta íngreme abaixo
  rationale: Preserva tanto o movimento descendente quanto a topografia íngreme, sem exigir a imagem mais forte de um penhasco vertical.
- source_word: εἰς τὴν λίμνην
  choice: para dentro do lago
  rationale: Mantém explicitamente o movimento para o interior da água e traduz λίμνη por “lago”, em distinção de “mar”.
- source_word: ἀπεπνίγη
  choice: se afogou
  rationale: No contexto dos animais entrando na água, o verbo passivo tem o sentido de morrer por afogamento; a forma pronominal é a expressão natural em português.
theological_decisions:
- issue: Tradução de δαιμόνια no relato de possessão
  choice: demônios
  alternative: espíritos impuros
  rationale: O versículo emprega especificamente δαιμόνια; traduzir por “demônios” preserva a terminologia do próprio texto sem substituir uma expressão relacionada, mas diferente.
- issue: Grau de especificidade de κρημνός
  choice: encosta íngreme
  alternative: penhasco ou precipício
  rationale: O termo indica uma descida de forte inclinação, mas não obriga a entender uma parede rochosa vertical. A opção principal evita intensificar a imagem, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Disparou encosta íngreme abaixo” reproduz de maneira natural o movimento súbito e descendente; a divisão em duas frases evita uma coordenação excessivamente longa sem alterar a sequência narrativa.
