source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: pt
  text: Enquanto navegavam, ele adormeceu. Então uma tempestade de vento desceu sobre o lago, e eles estavam sendo inundados[a] e corriam perigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o barco estava se enchendo de água”. O grego traz o verbo no plural, embora não mencione explicitamente o barco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Enquanto navegavam
  rationale: O genitivo absoluto com particípio presente indica uma ação contínua contemporânea e serve de pano de fundo; a formulação é natural em português.
- source_word: ἀφύπνωσεν
  choice: ele adormeceu
  rationale: O aoristo tem sentido ingressivo, indicando a entrada no sono; o sujeito, recuperado do contexto, é Jesus.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva a imagem espacial do verbo e se ajusta aos ventos que descem sobre o lago.
- source_word: λαῖλαψ ἀνέμου
  choice: uma tempestade de vento
  rationale: Expressa de modo claro uma tempestade caracterizada por vento forte, sem acrescentar chuva ao quadro.
- source_word: εἰς τὴν λίμνην
  choice: sobre o lago
  rationale: Com um fenômeno meteorológico e o verbo 'desceu', 'sobre o lago' é idiomático em português e conserva a cena.
- source_word: συνεπληροῦντο
  choice: o barco começou a se encher de água
  rationale: O plural passivo grego é incomum e provavelmente descreve os ocupantes como afetados pelo enchimento da embarcação. Em português, explicitar o barco comunica com clareza a situação implícita, enquanto 'começou a' representa o processo imperfectivo.
- source_word: ἐκινδύνευον
  choice: deixando-os em perigo
  rationale: Comunica a situação contínua de risco e liga naturalmente o perigo dos ocupantes ao barco que se enchia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação evita vocabulário arcaico e explicita a embarcação apenas onde o português exige maior naturalidade, registrando em nota a forma plural ambígua do grego.
