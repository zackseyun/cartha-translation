- from: 'O homem de quem os demônios haviam saído suplicava-lhe que o deixasse ficar com ele, mas Jesus o mandou embora, dizendo:'
  to: 'O homem de quem os demônios haviam saído suplicava-lhe para ficar com ele, mas Jesus o mandou embora, dizendo:'
