id: LUK.8.38
reference: Luke 8:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: pt
  text: 'O homem de quem os demônios haviam saído suplicava-lhe para ficar com ele, mas Jesus o mandou embora, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: suplicava-lhe
  rationale: O imperfeito de δέομαι expressa um pedido insistente ou contínuo; “suplicava” preserva a intensidade e soa natural em português.
- source_word: ὁ ἀνὴρ
  choice: O homem
  rationale: Refere-se especificamente ao homem anteriormente libertado e mantém a referência masculina do grego.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: de quem os demônios haviam saído
  rationale: O mais-que-perfeito grego indica uma ação já concluída antes da súplica; “haviam saído” preserva essa relação temporal.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: É a correspondência direta e corrente para δαιμόνια e mantém a apresentação sobrenatural do relato.
- source_word: εἶναι σὺν αὐτῷ
  choice: que o deixasse ficar com ele
  rationale: Expressa naturalmente em português o conteúdo do pedido, sem transformar a ideia genérica de estar com Jesus em um termo mais específico como “segui-lo” ou “acompanhá-lo”.
- source_word: ἀπέλυσεν δὲ αὐτὸν
  choice: mas Jesus o mandou embora
  rationale: “Mandou embora” comunica a recusa do pedido e o envio indicado pelo contexto. O nome “Jesus” explicita o referente do pronome grego para evitar a sequência ambígua de pronomes em português.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém a forma participial que introduz diretamente as palavras do versículo seguinte.
theological_decisions:
- issue: Identidade de τὰ δαιμόνια no relato de exorcismo
  choice: os demônios
  alternative: os espíritos malignos
  rationale: “Demônios” traduz diretamente o termo e preserva a apresentação do texto sem reduzir as entidades a uma categoria mais vaga.
- issue: Referente de αὐτόν em ἀπέλυσεν δὲ αὐτόν
  choice: Jesus o mandou embora
  alternative: ele o mandou embora
  rationale: A explicitação de Jesus apenas torna claro o referente pronominal no português e não acrescenta uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita um marcador inicial como “Então” ou “Ora”, pois o grego não contém aqui um advérbio temporal explícito; δέ é representado pela oposição em “mas”. O versículo termina com dois-pontos porque introduz a fala que continua no versículo seguinte.
