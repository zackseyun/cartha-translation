source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: pt
  text: 'Então ele lhes disse: “Onde está a fé de vocês[a]?” Tomados de medo, ficaram maravilhados e diziam uns aos outros: “Quem é este, afinal, que dá ordens até aos ventos e à água, e eles lhe obedecem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “confiança”. A pergunta de Jesus também pode ser entendida como: “Onde está a confiança de vocês?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Onde está
  rationale: Preserva a pergunta direta sobre a presença ou localização da fé, sem expandi-la interpretativamente para “Por que vocês não têm fé?”.
- source_word: πίστις
  choice: fé
  rationale: É a tradução ampla e tradicional do termo; neste contexto inclui a nuance de confiança, registrada em nota.
- source_word: φοβηθέντες
  choice: Tomados de medo
  rationale: Expressa de modo natural em português a circunstância participial que acompanha e antecede a reação de admiração, sem definir uma intensidade além do contexto.
- source_word: ἐθαύμασαν
  choice: ficaram maravilhados
  rationale: Comunica espanto e admiração em registro narrativo digno e corrente.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Quem é este, afinal
  rationale: “Afinal” preserva a força inferencial de ἄρα diante do milagre recém-presenciado.
- source_word: ἐπιτάσσει
  choice: dá ordens
  rationale: Traduz diretamente a ideia de ordenar, evitando importar “repreende” do versículo anterior.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: aos ventos e à água
  rationale: Mantém os substantivos explícitos do texto grego, sem substituí-los por “vento e ondas” ou “mar” com base nos relatos paralelos.
- source_word: ὑπακούουσιν αὐτῷ
  choice: eles lhe obedecem
  rationale: Expressa com clareza a obediência personificada dos ventos e da água; o pronome plural conserva a concordância conceitual com ambos.
theological_decisions:
- issue: Sentido de πίστις num contexto em que “confiança” é uma nuance possível
  choice: fé
  alternative: confiança
  rationale: “Fé” preserva a amplitude do termo grego e a formulação reconhecível, enquanto a nota registra a nuance contextual legítima sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e evita formulações excessivamente literais que soariam artificiais, preservando, porém, a sequência de medo e admiração e a referência específica aos ventos e à água.
