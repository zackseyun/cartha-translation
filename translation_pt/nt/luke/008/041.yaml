  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: pt
  text: E eis que veio um homem chamado Jairo; ele era dirigente da sinagoga e, caindo aos pés de Jesus, suplicava-lhe que entrasse em sua casa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador narrativo de destaque e a ligação com o contexto anterior, em linguagem bíblica ainda compreensível.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: dirigente da sinagoga
  rationale: Expressa uma função de liderança e administração da sinagoga sem sugerir governo civil ou necessariamente o único chefe.
- source_word: πεσὼν παρὰ τοὺς πόδας
  choice: prostrando-se aos pés
  rationale: Comunica naturalmente o gesto corporal de cair ou lançar-se aos pés de alguém, mantendo sua intensidade.
- source_word: παρεκάλει
  choice: suplicava-lhe
  rationale: O contexto e o gesto indicam um pedido insistente e urgente; o imperfeito é preservado por uma forma verbal que apresenta a ação em curso.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: que entrasse em sua casa
  rationale: Tradução direta e idiomática do pedido para Jesus ir para dentro da casa de Jairo.
