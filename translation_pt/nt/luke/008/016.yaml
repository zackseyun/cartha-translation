id: LUK.8.16
reference: Luke 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: pt
  text: Ninguém acende uma lamparina e a cobre com um recipiente ou a coloca debaixo de uma cama; pelo contrário, coloca-a num suporte para lamparina, para que os que entram vejam a luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: lamparina
  rationale: Refere-se a uma pequena lâmpada alimentada por óleo; “lamparina” comunica melhor o objeto antigo ao leitor moderno do que a genérica “lâmpada”.
- source_word: σκεύει
  choice: recipiente
  rationale: O termo é amplo e designa um objeto ou utensílio; “recipiente” preserva essa generalidade sem especificar indevidamente uma vasilha concreta.
- source_word: κλίνης
  choice: cama
  rationale: Equivalente natural e direto para o móvel doméstico indicado no contexto.
- source_word: λυχνίας
  choice: suporte
  rationale: Designa o lugar próprio onde se põe a lamparina para iluminar. “Suporte” é claro e evita sugerir necessariamente um candelabro destinado a velas.
- source_word: οἱ εἰσπορευόμενοι
  choice: os que entram
  rationale: Reproduz de modo natural o particípio substantivado e mantém a referência geral às pessoas que entram.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para ampla compreensão. O contraste marcado por ἀλλά é expresso por “pelo contrário”. Não se acrescenta “agora”, pois δέ funciona aqui como conector discursivo, sem valor temporal explícito.
