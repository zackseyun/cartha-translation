id: LUK.8.28
reference: Luke 8:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: pt
  text: 'Mas, ao ver Jesus, ele gritou, prostrou-se diante dele e disse em alta voz: “O que você tem a ver comigo[a], Jesus, Filho do Deus Altíssimo? Eu lhe imploro: não me atormente!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “O que há entre mim e você?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: ao ver
  rationale: O particípio aoristo apresenta a circunstância anterior às ações principais; “ao ver” é natural e preserva a relação temporal.
- source_word: ἀνακράξας
  choice: gritou
  rationale: O verbo descreve uma forte manifestação vocal. “Gritou” é claro e não elimina a expressão posterior “em alta voz”.
- source_word: προσέπεσεν αὐτῷ
  choice: prostrou-se diante dele
  rationale: A expressão indica cair diante de alguém em atitude de submissão ou desespero. “Prostrou-se” comunica a postura sem acrescentar que tenha sido especificamente aos pés.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Reproduz de modo natural o dativo de maneira e mantém a intensidade explícita da fala.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: O que você tem a ver comigo
  rationale: Esta formulação portuguesa comunica a dissociação e o protesto do idioma sem o transformar numa pergunta sobre intenção. A forma mais literal é preservada em nota.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Filho do Deus Altíssimo
  rationale: Preserva integralmente o título dado a Jesus e representa naturalmente a construção genitiva grega.
- source_word: δέομαί σου
  choice: Eu lhe imploro
  rationale: Expressa o apelo intenso do verbo grego com dignidade e urgência; o pronome explicita naturalmente a pessoa a quem se dirige o pedido.
- source_word: μή με βασανίσῃς
  choice: não me atormente
  rationale: “Atormentar” preserva o sentido severo de βασανίζω neste contexto espiritual e judicial, sem restringi-lo necessariamente à tortura física.
theological_decisions:
- issue: A identificação de Jesus na fala do demônio
  choice: Jesus, Filho do Deus Altíssimo
  alternative: Jesus, Filho de Deus, o Altíssimo
  rationale: A opção preserva toda a força cristológica do vocativo e entende “Altíssimo” como parte do título divino, sem ampliar a fala com uma formulação doutrinária posterior.
- issue: A natureza do tormento solicitado que não ocorra
  choice: não me atormente
  alternative: não me torture
  rationale: “Atormente” mantém aberta a natureza exata do sofrimento temido e evita especificar um tormento exclusivamente físico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” evita o regionalismo de “tu” e mantém a fala direta; “prostrou-se” conserva o tom narrativo solene sem arcaísmo excessivo. O marcador da nota foi colocado junto à expressão que ele explica.
