source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: pt
  text: 'Mas Jesus, ao ouvir isso, respondeu-lhe: “Não tenha medo; apenas creia[a], e ela será salva[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tenha apenas fé” ou “apenas confie”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ela será curada” ou “ela ficará bem”. O verbo grego pode significar salvar, resgatar ou curar e, neste contexto, inclui a restauração diante da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir isso
  rationale: Expressa de modo natural a ação anterior do particípio aoristo e explicita apenas o objeto implícito no contexto.
- source_word: ἀπεκρίθη αὐτῷ
  choice: respondeu-lhe
  rationale: Equivalente conciso e idiomático da construção com objeto indireto no dativo.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Proibição natural em português moderno, mantendo a força pastoral e imperativa da fala.
- source_word: μόνον
  choice: apenas
  rationale: Restringe a ordem seguinte sem o tom potencialmente coloquial de “só”.
- source_word: πίστευσον
  choice: creia
  rationale: Imperativo direto de πιστεύω; preserva a ligação lexical com crer, enquanto a nota registra as nuances de fé e confiança.
- source_word: σωθήσεται
  choice: ela será salva
  rationale: Mantém a amplitude de σῴζω e sua ressonância teológica, sem ocultar que, no contexto, pode indicar cura ou restauração.
theological_decisions:
- issue: Tradução de πιστεύω na ordem de Jesus
  choice: creia
  alternative: tenha fé; confie
  rationale: “Creia” é o equivalente verbal mais direto, mas pode ser entendido apenas como assentimento intelectual; a nota preserva as nuances relacionais de fé e confiança.
- issue: Tradução de σωθήσεται em contexto de cura e retorno à vida
  choice: ela será salva
  alternative: ela será curada; ela ficará bem
  rationale: A opção principal preserva a ligação com o campo semântico de salvação, enquanto as alternativas contextuais evitam reduzir ou apagar a tensão lexical do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento na terceira pessoa (“não tenha”, “creia”) é natural e respeitoso. As notas preservam a amplitude lexical sem impor uma leitura denominacional.
