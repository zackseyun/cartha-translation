id: LUK.8.1
reference: Luke 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: pt
  text: E aconteceu, pouco depois, que ele percorria cidade após cidade e povoado após povoado,[a] proclamando e anunciando as boas-novas do Reino de Deus;[b] e os Doze estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de cidade em cidade e de povoado em povoado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o reinado de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: E aconteceu, pouco depois
  rationale: Preserva o marcador narrativo lucano ἐγένετο e expressa ἐν τῷ καθεξῆς como sucessão temporal em português natural.
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome explícito identifica o sujeito sem impor uma ênfase reflexiva que o contexto não exige.
- source_word: διώδευεν
  choice: percorria
  rationale: O imperfeito indica ação continuada ou repetida, e o verbo composto descreve o deslocamento por diversos lugares.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: cidade após cidade e povoado após povoado
  rationale: Reproduz a força distributiva de κατά com substantivos no singular e torna claro o movimento reiterado entre localidades.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Conserva o sentido de anúncio público de κηρύσσω sem restringi-lo à ideia moderna de sermão.
- source_word: εὐαγγελιζόμενος
  choice: anunciando as boas-novas
  rationale: Mantém a distinção em relação a κηρύσσων e comunica de modo claro o conteúdo positivo do anúncio.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É uma formulação ampla e reconhecível, capaz de preservar tanto a dimensão do domínio quanto a do governo real de Deus.
- source_word: οἱ δώδεκα
  choice: os Doze
  rationale: Mantém a designação reconhecida do grupo sem acrescentar “discípulos” ou “apóstolos”, ausentes no texto.
- source_word: σὺν αὐτῷ
  choice: estavam com ele
  rationale: A forma verbal explícita completa naturalmente a oração em português e expressa acompanhamento.
theological_decisions:
- issue: Tradução de βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  alternative: o reinado de Deus
  rationale: “Reino de Deus” conserva melhor a amplitude semântica da expressão, sem reduzi-la apenas ao exercício dinâmico do governo divino; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Povoado” distingue κώμη de πόλις sem soar arcaico. A construção inicial preserva a fórmula narrativa grega, enquanto a pontuação evita ambiguidade quanto ao conteúdo proclamado e anunciado.
