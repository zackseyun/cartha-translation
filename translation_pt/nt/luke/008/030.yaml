id: LUK.8.30
reference: Luke 8:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: pt
  text: 'Então Jesus lhe perguntou: “Qual é o seu nome?” Ele respondeu: “Legião”[a], porque muitos demônios tinham entrado nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legião” era o nome de uma grande unidade do exército romano; aqui, o termo indica que havia muitos demônios no homem.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Então Jesus lhe perguntou
  rationale: A formulação expressa a progressão narrativa marcada por δέ e traduz ἐπηρώτησεν de modo direto e natural. O pronome “lhe” representa αὐτόν no contexto da pergunta dirigida ao homem.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Qual é o seu nome?
  rationale: É a forma idiomática corrente em português para a pergunta grega, sem reproduzir de maneira artificial sua estrutura literal.
- source_word: Λεγιών
  choice: Legião
  rationale: Emprega a forma portuguesa tradicional do empréstimo latino, preservando tanto a designação dada quanto sua associação com uma grande unidade militar romana.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão pela qual foi dada a resposta “Legião”.
- source_word: εἰσῆλθεν
  choice: tinham entrado
  rationale: O mais-que-perfeito composto esclarece que a entrada dos demônios precedeu a resposta, sem alterar a relação temporal implícita no contexto.
- source_word: δαιμόνια πολλὰ
  choice: muitos demônios
  rationale: Preserva a referência explícita a seres espirituais malignos e a ênfase na grande quantidade.
- source_word: εἰς αὐτόν
  choice: nele
  rationale: Em português, “entrar nele” comunica naturalmente o movimento para dentro expresso por εἰς, evitando uma construção menos idiomática.
theological_decisions:
- issue: Natureza dos δαιμόνια no relato
  choice: demônios
  alternative: espíritos maus
  rationale: “Demônios” é o equivalente lexical mais direto e mantém sem atenuação a afirmação sobrenatural do texto.
- issue: Relação temporal de εἰσῆλθεν com a resposta “Legião”
  choice: tinham entrado
  alternative: entraram
  rationale: O mais-que-perfeito torna explícito em português que a entrada ocorreu antes da explicação do nome; trata-se de clareza discursiva, não de acréscimo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem das orações acompanha a progressão do grego, e a nota explica a conotação histórica de “Legião” sem impor um número exato ao texto.
