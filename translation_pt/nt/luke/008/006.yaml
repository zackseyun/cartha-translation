lexical_decisions:
- source_word: ἕτερον
  choice: Outra
  rationale: Adjetivo neutro singular usado substantivamente, retomando a semente implícita; o feminino em português concorda naturalmente com “semente”.
- source_word: κατέπεσεν
  choice: caiu
  rationale: Traduz de modo direto o aoristo de καταπίπτω, sem acrescentar ênfase desnecessária.
- source_word: ἐπὶ τὴν πέτραν
  choice: sobre a rocha
  rationale: Preserva o singular concreto πέτρα e a imagem da semente caindo sobre uma superfície rochosa, em vez de ampliar para “solo pedregoso”.
- source_word: φυὲν
  choice: depois de brotar
  rationale: Expressa o valor temporal do particípio aoristo e usa uma formulação natural para a germinação da semente.
- source_word: ἐξηράνθη
  choice: secou
  rationale: No contexto vegetal, comunica naturalmente que o broto perdeu a umidade; também mantém a ligação lexical com a causa explicitada em seguida.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: por não ter
  rationale: Reproduz concisamente a relação causal expressa por διά com infinitivo articular.
- source_word: ἰκμάδα
  choice: umidade
  rationale: Equivalente claro e preciso para a água ou umidade necessária ao crescimento, sem a especificidade indevida de “seiva”.
