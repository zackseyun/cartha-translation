  text: Outra caiu sobre a rocha[a] e, depois de brotar, secou por não ter umidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na rocha”. O grego usa o singular “rocha”, preservando a imagem da semente que cai sobre uma superfície rochosa, em vez da expressão mais ampla “solo pedregoso”.
