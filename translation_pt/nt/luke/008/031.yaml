id: LUK.8.31
reference: Luke 8:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: pt
  text: E eles lhe suplicavam insistentemente que não lhes ordenasse ir para o abismo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a profundeza”. A palavra grega pode indicar uma grande profundidade; aqui, provavelmente se refere ao abismo como lugar de confinamento de espíritos malignos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: suplicavam insistentemente
  rationale: O imperfeito indica uma súplica contínua ou repetida. A expressão comunica a urgência do apelo dos demônios em português natural.
- source_word: ἐπιτάξῃ
  choice: ordenasse
  rationale: O verbo expressa uma ordem dada com autoridade; “ordenasse” preserva essa força no discurso indireto requerido pela construção portuguesa.
- source_word: ἄβυσσον
  choice: abismo
  rationale: É a correspondência mais direta e, neste contexto sobrenatural, mantém a ideia de uma profundidade associada ao confinamento de espíritos malignos sem acrescentar detalhes não expressos por Lucas.
- source_word: ἀπελθεῖν
  choice: ir
  rationale: O infinitivo de movimento é expresso naturalmente por “ir”; o destino já é indicado por “para o abismo”.
- source_word: ἵνα μὴ
  choice: que não
  rationale: Depois de um verbo de súplica, a construção introduz o conteúdo negativo do pedido; “que não... ordenasse” é idiomático e preserva a relação sintática.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome dativo indica aqueles aos quais a ordem seria dirigida. “Não lhes ordenasse ir” conserva essa relação de modo claro e natural.
theological_decisions:
- issue: Sentido de ἄβυσσος no contexto dos demônios
  choice: “o abismo”, entendido contextualmente como lugar sobrenatural de confinamento ou juízo
  alternative: “a profundeza”, em sentido espacial mais geral
  rationale: A fala dos demônios e o temor de uma ordem autoritativa de Jesus favorecem a dimensão espiritual e cósmica. A tradução “abismo” preserva essa dimensão sem definir além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Suplicavam insistentemente” explicita de modo natural o aspecto contínuo do imperfeito, e “lhes ordenasse ir” conserva a autoridade da ordem sem soar excessivamente literal.
