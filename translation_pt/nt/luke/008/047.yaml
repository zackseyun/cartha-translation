  naturalness: O texto é claro, moderno e amplamente compreensível. A coordenação de ações com «veio tremendo, caiu diante dele e declarou» é natural em português e torna a sequência narrativa direta.
  terminology: «Declarou», «perante todo o povo», «por que havia tocado nele» e «tinha sido curada imediatamente» são escolhas adequadas. «Caiu diante dele» é preferível a «prostrando-se diante dele» por não especificar indevidamente o grau ou a forma da postura.
