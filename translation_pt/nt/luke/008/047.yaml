id: LUK.8.47
reference: Luke 8:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: pt
  text: Quando a mulher viu que não havia passado despercebida[a], veio tremendo, caiu diante dele[b] e declarou perante todo o povo por que havia tocado nele e como tinha sido curada imediatamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinha ficado oculta” ou “não tinha passado despercebida”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “lançando-se diante dele”. O grego diz “caindo diante dele”, sem mencionar explicitamente os pés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: Quando ... viu
  rationale: O particípio aoristo introduz a circunstância temporal da ação principal; esta formulação é natural em português e preserva essa relação.
- source_word: οὐκ ἔλαθεν
  choice: não havia passado despercebida
  rationale: λανθάνω expressa aqui não escapar à percepção ou não permanecer oculto. A formulação comunica que a mulher percebeu que seu ato fora notado.
- source_word: τρέμουσα
  choice: tremendo
  rationale: Preserva o estado físico e emocional vívido expresso pelo particípio presente, sem reduzi-lo apenas ao medo.
- source_word: ἦλθεν
  choice: aproximou-se
  rationale: Embora o sentido básico seja 'veio', no contexto o movimento é em direção a Jesus; 'aproximou-se' é natural e não acrescenta uma ideia alheia à cena.
- source_word: προσπεσοῦσα αὐτῷ
  choice: prostrando-se diante dele
  rationale: προσπίπτω indica cair ou lançar-se diante de alguém em súplica ou reverência. A tradução mantém a postura sem acrescentar explicitamente 'aos pés'.
- source_word: δι’ ἣν αἰτίαν
  choice: por que
  rationale: Equivalente português conciso e natural para 'por qual motivo'.
- source_word: ἥψατο αὐτοῦ
  choice: havia tocado nele
  rationale: ἅπτομαι com genitivo significa 'tocar'. O mais-que-perfeito composto deixa clara a anterioridade do toque em relação à declaração.
- source_word: ἀπήγγειλεν
  choice: declarou
  rationale: O verbo denota relatar ou dar a conhecer; 'declarou' combina com o caráter público da fala sem impor a noção teológica de confissão.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: perante todo o povo
  rationale: Reproduz de modo claro e digno a ideia de falar na presença de todos os presentes.
- source_word: ὡς ἰάθη
  choice: como tinha sido curada
  rationale: ὡς introduz o conteúdo referente à maneira ou ao fato da cura. A formulação preserva 'como', e o tempo verbal indica que a cura precedeu o relato.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: O advérbio enfatiza que a cura ocorreu no mesmo instante.
theological_decisions:
- issue: Natureza da declaração pública da mulher
  choice: Descrição do tremor, da prostração e do relato público, sem inserir linguagem explícita de arrependimento ou adoração.
  alternative: Traduzir o gesto como confissão de arrependimento ou afirmar que ela o adorou.
  rationale: O grego descreve suas ações e seu relato, mas não nomeia explicitamente arrependimento ou adoração. A tradução conserva a possível reverência do gesto sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa e a repetição do conteúdo público foram preservadas; evitou-se tanto o literalismo rígido quanto a explicitação doutrinária.
