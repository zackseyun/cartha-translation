  rationale: A revisão substitui «aproximou-se ... prostrando-se» por «veio ... caiu diante dele». Assim, mantém-se o verbo básico «veio» e se reproduz προσπεσοῦσα com uma formulação portuguesa natural que não acrescenta a ideia de prostração completa. As notas foram ajustadas para corresponderem exatamente às alternativas relevantes e ao ponto de ancoragem.
