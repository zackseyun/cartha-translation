  source_fidelity: A tradução preserva adequadamente a progressão narrativa, os termos de parentesco e a causa do impedimento. Contudo, «chegar junto dele» é pouco idiomático e a nota sobre «irmãos», importante para explicitar que a tradução não resolve debates posteriores, foi omitida.
  naturalness: «Chegaram até onde ele estava» seguido de «não conseguiam chegar junto dele» cria repetição pesada; além disso, «chegar junto de alguém» não é a formulação mais natural no português internacional contemporâneo. «Foram até ele ... não conseguiam alcançá-lo» é claro e conserva a tensão contextual do grego.
  terminology: «Mãe», «irmãos», «multidão» e «por causa de» são escolhas adequadas. «Irmãos» deve receber nota, não para favorecer uma interpretação doutrinária, mas para registrar que o grego emprega o termo diretamente.
