source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: pt
  text: Então a mãe e os irmãos dele[b] foram até ele, mas não conseguiam alcançá-lo[a] por causa da multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «encontrar-se com ele» ou «chegar até ele».
    reason: lexical_alternative
  - marker: b
    text: O grego diz «irmãos»; alguns entendem o termo de modo mais amplo, como «parentes» ou «familiares», mas o texto emprega «irmãos».
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Então ... chegaram até onde ele estava
  rationale: δέ faz a narrativa avançar, e παραγίνομαι πρός indica a chegada do grupo à proximidade de Jesus. A formulação distingue naturalmente essa chegada inicial da impossibilidade subsequente de chegar junto dele.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: a mãe e os irmãos dele
  rationale: Tradução direta dos termos de parentesco; o masculino plural ἀδελφοί é preservado como «irmãos», sem especificar além do que o grego afirma.
- source_word: οὐκ ἠδύναντο
  choice: não conseguiam
  rationale: O imperfeito expressa uma incapacidade persistente naquela situação; «não conseguiam» é natural em português.
- source_word: συντυχεῖν αὐτῷ
  choice: chegar junto dele
  rationale: No contexto do impedimento causado pela multidão, exprime conseguir aproximar-se e entrar em contato com Jesus, preservando também a possibilidade lexical de encontrá-lo.
- source_word: διὰ τὸν ὄχλον
  choice: por causa da multidão
  rationale: διά com acusativo indica a causa do impedimento.
theological_decisions:
- issue: Identidade dos «irmãos» de Jesus
  choice: irmãos
  alternative: parentes ou familiares
  rationale: O texto usa ἀδελφοί, cujo sentido comum é «irmãos», mas não esclarece a natureza biológica ou jurídica exata da relação. A tradução não resolve debates posteriores sobre esses familiares.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de «chegar» reflete dois movimentos distintos no original: a chegada da família ao local e a incapacidade de se aproximar de Jesus por causa da multidão.'
