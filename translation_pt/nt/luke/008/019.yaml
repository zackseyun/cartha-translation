- from: Então a mãe e os irmãos dele chegaram até onde ele estava, mas não conseguiam chegar junto dele[a] por causa da multidão.
  to: Então a mãe e os irmãos dele[b] foram até ele, mas não conseguiam alcançá-lo[a] por causa da multidão.
  rationale: A revisão substitui a expressão menos natural «chegar junto dele» por «alcançá-lo», que comunica de modo idiomático a impossibilidade de chegar a Jesus através da multidão. «Foram até ele» mantém o movimento expresso por πρὸς αὐτόν sem acrescentar um propósito. A nota em «irmãos» preserva a leitura direta do grego e não toma posição sobre debates acerca do vínculo familiar.
