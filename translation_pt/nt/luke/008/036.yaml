  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: pt
  text: E os que tinham visto contaram a eles como o homem que havia estado possuído por demônios tinha sido salvo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinha sido curado” ou “tinha sido liberto”. O verbo grego pode significar salvar, curar ou livrar, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: contaram
  rationale: O aoristo de ἀπαγγέλλω indica comunicar ou relatar o que ocorreu. “Contaram” é natural em português narrativo e mantém a ideia de testemunho ocular.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ é um conectivo leve que faz a narrativa avançar, sem contraste forte.
- source_word: αὐτοῖς
  choice: a eles
  rationale: O pronome no dativo identifica os destinatários do relato. “A eles” é claro e amplamente compreensível.
- source_word: οἱ ἰδόντες
  choice: os que tinham visto
  rationale: O particípio aoristo substantivado designa as pessoas que presenciaram o acontecimento; o mais-que-perfeito composto expressa naturalmente sua anterioridade em relação ao relato.
- source_word: πῶς
  choice: como
  rationale: Introduz o conteúdo do relato, podendo apontar para o modo ou para o fato do que aconteceu; “como” preserva essa abertura.
- source_word: ἐσώθη
  choice: tinha sido salvo
  rationale: O passivo de σῴζω pode significar salvar, curar ou livrar. “Salvo” preserva a amplitude lexical e a ressonância do termo grego; a nota registra alternativas particularmente adequadas ao contexto.
- source_word: ὁ δαιμονισθείς
  choice: o homem que havia estado possuído por demônios
  rationale: O particípio substantivado refere-se ao homem anteriormente submetido à ação demoníaca. A formulação deixa claro que esse estado já havia terminado e evita o termo menos acessível “endemoninhado”.
theological_decisions:
- issue: Sentido de ἐσώθη em contexto de exorcismo e restauração
  choice: tinha sido salvo
  alternative: tinha sido curado; tinha sido liberto
  rationale: σῴζω abrange salvação, resgate, cura e livramento. O texto principal conserva “salvo” para não reduzir sua amplitude, enquanto a nota reconhece os sentidos contextualmente plausíveis de cura e libertação, sem definir se a ênfase é apenas física ou estritamente espiritual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário compreensível internacionalmente. A construção evita linguagem excessivamente técnica e preserva a anterioridade dos acontecimentos.
