  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: pt
  text: O semeador saiu para semear a sua semente. Enquanto semeava, uma parte caiu à beira do caminho, foi pisada, e as aves do céu a devoraram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: saiu
  rationale: O aoristo de ἐξέρχομαι é expresso com naturalidade pelo pretérito perfeito «saiu».
- source_word: ὁ σπείρων
  choice: o semeador
  rationale: O particípio com artigo funciona como substantivo; «o semeador» é idiomático e apropriado à parábola.
- source_word: τοῦ σπεῖραι
  choice: para semear
  rationale: O infinitivo articular genitivo após verbo de movimento indica finalidade; «para semear» torna essa relação explícita e natural.
- source_word: τὸν σπόρον αὐτοῦ
  choice: a sua semente
  rationale: σπόρος designa a semente destinada ao plantio. O possessivo preserva αὐτοῦ sem ampliar o sentido.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: enquanto semeava
  rationale: A construção com ἐν e infinitivo articular indica ação simultânea; esta formulação é clara e corrente.
- source_word: ὃ μὲν
  choice: uma parte
  rationale: O relativo neutro singular com μέν aponta distributivamente para uma porção da semente; «uma parte» preserva essa referência melhor que um plural implícito.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: caiu à beira do caminho
  rationale: παρά com acusativo indica aqui o espaço ao lado do caminho; a expressão é natural em português.
- source_word: κατεπατήθη
  choice: foi pisada
  rationale: O passivo de καταπατέω significa ser calcado ou pisoteado. «Foi pisada» é direto, claro e concorda com «parte».
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: A expressão traduz de modo próximo o hebraísmo/idioma grego, é digna e perfeitamente compreensível em português.
- source_word: κατέφαγεν αὐτό
  choice: a devoraram
  rationale: κατεσθίω expressa comer por completo ou vorazmente; «devoraram» conserva essa força. O pronome retoma a porção de semente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. Conserva-se «aves do céu», expressão natural que mantém a imagem do original; não se julgou necessária nota lexical. A colocação de «Enquanto semeava» evita repetição pesada sem perder a simultaneidade da construção grega.
