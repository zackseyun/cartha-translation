id: LUK.8.17
reference: Luke 8:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: pt
  text: Pois não há nada oculto que não se torne evidente[a], nem nada secreto que não venha a ser conhecido[b] e a vir à luz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se torne manifesto”.
    reason: lexical_alternative
  - marker: b
    text: Ou “certamente venha a ser conhecido”; a construção grega nega enfaticamente que algo secreto permaneça desconhecido.
    reason: lexical_alternative
  - marker: c
    text: Ou “venha a público”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: oculto
  rationale: Expressa naturalmente aquilo que está escondido e mantém o contraste com φανερόν.
- source_word: φανερὸν γενήσεται
  choice: se torne evidente
  rationale: 'Preserva a mudança de estado indicada por γίνομαι: o que está oculto passará a estar manifesto.'
- source_word: ἀπόκρυφον
  choice: secreto
  rationale: Mantém uma leve distinção lexical em relação a κρυπτόν sem desfazer o paralelismo.
- source_word: οὐ μὴ γνωσθῇ
  choice: não venha a ser conhecido
  rationale: No interior da construção relativa negativa, comunica que nada secreto permanecerá desconhecido; a nota registra a força enfática da negação grega.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: vir à luz
  rationale: É uma expressão portuguesa corrente para algo tornar-se público ou abertamente perceptível.
- source_word: γάρ
  choice: Pois
  rationale: Conserva de modo conciso a função explicativa do versículo em relação ao contexto anterior.
theological_decisions:
- issue: Alcance da declaração sobre a revelação do que está oculto
  choice: Mantê-la como um princípio geral de que o oculto e o secreto serão revelados.
  alternative: Restringi-la à revelação no juízo final ou exclusivamente à manifestação do ensino de Jesus no contexto imediato.
  rationale: O próprio versículo não especifica o momento nem limita a aplicação; a tradução preserva essa amplitude e a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo entre “oculto/evidente” e “secreto/conhecido... à luz” foi preservado, assim como o valor explicativo de “Pois”.
