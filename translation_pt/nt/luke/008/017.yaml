  source_fidelity: 'A tradução preserva com precisão a dupla construção negativa e relativa: nada oculto deixará de tornar-se evidente, e nada secreto deixará de ser conhecido e vir à luz. “Se torne” reproduz adequadamente o aspecto ingressivo de γενήσεται, e “vir à luz” transmite bem εἰς φανερὸν ἔλθῃ sem restringir o horizonte temporal ou teológico do dito.'
