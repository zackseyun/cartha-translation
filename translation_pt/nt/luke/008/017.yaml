  terminology: “Oculto” para κρυπτόν, “secreto” para ἀπόκρυφον e “evidente” para φανερόν são escolhas semanticamente sólidas. As notas apresentam alternativas legítimas e a nota b explica corretamente a força da construção οὐ μὴ γνωσθῇ no âmbito da relativa negativa.
