source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: pt
  text: Aproximando-se por trás dele, ela tocou na franja[a] da veste dele, e imediatamente seu fluxo de sangue parou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “borda”, “barra” ou “borla”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Aproximando-se por trás
  rationale: O particípio aoristo indica uma ação que acompanha e precede o toque; a expressão preserva de modo natural o movimento e a posição da mulher.
- source_word: ἥψατο
  choice: tocou
  rationale: Neste contexto, o verbo significa tocar, sem exigir a ideia mais forte de agarrar.
- source_word: τοῦ κρασπέδου
  choice: na franja
  rationale: κράσπεδον pode indicar franja, borda, barra ou borla. “Franja” preserva a provável referência à extremidade da veste sem especificá-la excessivamente; as alternativas são registradas em nota.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: da veste dele
  rationale: ἱμάτιον designa uma peça de roupa, frequentemente exterior. “Veste” é amplo, digno e natural em português.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: O advérbio ressalta que o efeito ocorreu sem demora.
- source_word: ἔστη
  choice: parou
  rationale: Com ῥύσις como sujeito, ἵστημι tem o sentido contextual de parar ou cessar.
- source_word: ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: seu fluxo de sangue
  rationale: A formulação permanece próxima do grego e descreve diretamente a hemorragia contínua, sem substituí-la por uma expressão mais interpretativa.
theological_decisions:
- issue: Possível nuance ritual ou alusiva à vestimenta judaica em κράσπεδον
  choice: franja no texto principal
  alternative: borda, barra ou borla
  rationale: O termo pode designar genericamente a extremidade da veste ou, mais especificamente, uma borla ligada à vestimenta judaica. O versículo não torna inequívoca essa alusão, por isso a tradução mantém a amplitude lexical e registra as alternativas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e a relação temporal do grego foram preservadas sem rigidez sintática.
