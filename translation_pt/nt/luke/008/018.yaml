  source_fidelity: 'O sentido central é fiel ao grego: a advertência sobre o modo de ouvir, a antítese proverbial entre ter e não ter, o acréscimo implícito em «mais» e a privação final são preservados. A nota registra adequadamente a alternativa semântica de δοκεῖ («parece»).'
  naturalness: «Prestem atenção em como vocês escutam» é mais natural e corrente no português brasileiro e internacional do que «prestem atenção a como». A explicitação pronominal «lhe» nas duas cláusulas finais torna claras as relações de destinatário e de privação, que no rascunho ficam apenas subentendidas.
  terminology: «Escutam», «mais lhe será dado» e «lhe será tirado» mantêm registro moderno, sóbrio e adequado. «Aquilo que pensa ter» reproduz legitimamente a leitura de δοκεῖ como pensamento ou suposição, sem eliminar a alternativa «parece ter» na nota.
