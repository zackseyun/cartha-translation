id: LUK.8.18
reference: Luke 8:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: pt
  text: Portanto, prestem atenção em como vocês escutam. Pois a quem tem, mais lhe será dado; e, a quem não tem, até aquilo que pensa ter[a] lhe será tirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que parece ter”.'
    reason: Alternativa lexical legítima para δοκεῖ ἔχειν.
lexical_decisions:
- source_word: βλέπετε
  choice: prestem atenção
  rationale: O imperativo exige cuidado e vigilância, não visão literal; a expressão é natural e mantém a força da advertência.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente do ensino anterior sobre ouvir e acolher a palavra.
- source_word: πῶς ἀκούετε
  choice: a como vocês escutam
  rationale: Preserva a ênfase na maneira de ouvir, com sentido ativo e responsivo.
- source_word: ὃς ἂν ... ἔχῃ
  choice: a quem tem
  rationale: Expressa de modo proverbial e natural a condição geral e indefinida do grego.
- source_word: δοθήσεται αὐτῷ
  choice: mais será dado
  rationale: Embora o objeto esteja implícito no grego, 'mais' torna claro em português o aumento indicado pelo paralelismo.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: a quem não tem
  rationale: Mantém a construção geral e a antítese da primeira oração.
- source_word: ὃ δοκεῖ ἔχειν
  choice: aquilo que pensa ter
  rationale: δοκέω pode significar 'pensar' ou 'parecer'; a leitura principal comunica com clareza uma posse suposta, e a alternativa é preservada em nota.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: será tirado
  rationale: Expressa claramente a ideia de remoção ou privação contida no futuro passivo.
- source_word: αὐτῷ / αὐτοῦ
  choice: a quem / de quem, implícito na construção
  rationale: A formulação portuguesa evita repetição pesada sem alterar o referente humano genérico do singular grego.
theological_decisions:
- issue: Força interpretativa do provérbio sobre ter e não ter
  choice: O enunciado permanece ligado, pelo contexto, à receptividade ao ensino de Jesus, sem explicitação doutrinária adicional.
  alternative: Entendê-lo como princípio mais amplo de receptividade espiritual ou como provérbio geral sobre mordomia.
  rationale: O versículo apresenta um princípio paradoxal relacionado ao modo de ouvir; a tradução preserva essa tensão sem impor ideias de predestinação, mérito ou prosperidade material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' explicita o número plural de βλέπετε e ἀκούετε; a construção proverbial 'a quem' evita gênero marcado e soa natural em português.
