id: LUK.8.45
reference: Luke 8:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: pt
  text: 'E Jesus disse: “Quem foi que me tocou?” Enquanto todos negavam, Pedro disse: “Mestre, as multidões te cercam e te apertam[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se aglomeram ao teu redor e te comprimem”.'
    reason: 'Alternativa lexical que explicita outros matizes possíveis dos dois verbos gregos: estar cercado pela multidão e sofrer sua pressão física.'
lexical_decisions:
- source_word: ἁψάμενός
  choice: tocou
  rationale: No contexto, o verbo médio ἅπτομαι indica contato físico. “Tocou” é a forma natural em português e mantém a ligação com a ação da mulher.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Enquanto todos negavam
  rationale: O particípio presente expressa uma negação em andamento. “Enquanto” preserva esse aspecto durativo; o objeto da negação fica naturalmente implícito em português.
- source_word: Ἐπιστάτα
  choice: Mestre
  rationale: É uma forma de tratamento característica de Lucas que reconhece a autoridade de Jesus. “Mestre” é respeitoso e corrente sem substituir o termo pelo título mais forte “Senhor”, que traduziria κύριος.
- source_word: ὄχλοι
  choice: as multidões
  rationale: Preserva o plural grego e comunica que muitas pessoas cercavam Jesus.
- source_word: συνέχουσίν
  choice: te cercam
  rationale: O verbo descreve Jesus sendo envolvido ou comprimido pelas pessoas ao redor. “Te cercam” conserva de modo claro essa imagem.
- source_word: ἀποθλίβουσιν
  choice: te apertam
  rationale: O verbo intensifica a pressão física exercida pelas multidões. “Te apertam” distingue essa ação de “te cercam” sem exagerá-la como “te esmagam”.
theological_decisions:
- issue: Forma de tratamento Ἐπιστάτα dirigida a Jesus
  choice: Mestre
  alternative: Senhor
  rationale: O texto usa Ἐπιστάτα, não κύριος. “Mestre” comunica autoridade reconhecida sem introduzir neste ponto um título cristológico mais forte do que o termo grego empregado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem foi que me tocou?” reproduz naturalmente a construção enfática τίς ὁ ἁψάμενός μου. A próclise em “te cercam” e “te apertam” é corrente no português brasileiro, sem perda de compreensão internacional.
