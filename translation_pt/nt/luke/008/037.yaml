source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: pt
  text: Toda a multidão da região circundante dos gerasenos pediu-lhe que se afastasse deles, pois estavam tomados de grande medo.[a] Então ele entrou num barco e voltou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: estavam dominados por um grande medo.'
    reason: Alternativa lexical para συνείχοντο, destacando a força de algo que os controlava ou mantinha sob seu poder.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: pediu-lhe
  rationale: Neste contexto, ἐρωτάω introduz um pedido. “Pediu-lhe” é natural em português e não intensifica indevidamente a ação como faria “suplicou-lhe”.
- source_word: ἅπαν τὸ πλῆθος
  choice: toda a multidão
  rationale: Preserva tanto o sentido coletivo de πλῆθος quanto a força totalizante de ἅπαν.
- source_word: τῆς περιχώρου
  choice: da região circundante
  rationale: περίχωρος designa a área ou distrito ao redor; “região circundante” mantém essa dimensão geográfica em registro claro e digno.
- source_word: τῶν Γερασηνῶν
  choice: dos gerasenos
  rationale: Reproduz a leitura Γερασηνῶν do texto grego fornecido e emprega a forma gentílica tradicional e inteligível em português.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: que fosse embora dali
  rationale: Expressa naturalmente o conteúdo do pedido e conserva a ideia de afastamento do lugar e de seus habitantes, sem sugerir apenas distanciamento emocional.
- source_word: φόβῳ μεγάλῳ
  choice: de grande medo
  rationale: Traduz diretamente a intensidade de μέγας sem especificar a natureza desse medo.
- source_word: συνείχοντο
  choice: estavam tomados
  rationale: συνέχω descreve pessoas fortemente presas ou dominadas por uma condição. “Estavam tomados” preserva essa força e soa natural em português.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: entrou num barco
  rationale: Representa de modo claro o ato de embarcar e mantém a indefinição formal de πλοῖον sem artigo.
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: Tradução concisa e natural de ὑποστρέφω, sem acrescentar um destino que o versículo não declara.
theological_decisions:
- issue: Natureza do medo da população gerasena diante de Jesus
  choice: Relatar que a multidão estava tomada de grande medo sem explicar sua causa ou qualidade.
  alternative: Definir o medo como reverência diante do poder divino, hostilidade por perdas econômicas ou receio da perturbação social.
  rationale: O texto informa que o medo motivou o pedido, mas não esclarece se era reverencial, hostil ou misto. A tradução preserva essa ambiguidade narrativa e teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é narrativo e digno, sem arcaísmos desnecessários; “pediu-lhe” mantém concisão formal, enquanto “fosse embora dali” evita uma formulação rígida ou ambígua.
