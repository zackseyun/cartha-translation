  naturalness: “Então seus discípulos lhe perguntaram...” é claro, moderno e natural em português de ampla compreensão. “Esta parábola” permanece natural ao retomar a parábola recém-narrada.
  terminology: “Discípulos” e “parábola” são termos estabelecidos, precisos e adequados ao registro. “O que significava” transmite de forma idiomática a pergunta interpretativa, sem exigir que εἴη seja traduzido rigidamente como cópula.
