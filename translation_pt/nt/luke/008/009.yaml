  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: pt
  text: Então seus discípulos lhe perguntaram o que significava esta parábola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o que seria esta parábola”.
    reason: Alternativa lexical que preserva a formulação do optativo na pergunta indireta.
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: perguntaram
  rationale: O imperfeito pode indicar uma ação em andamento ou reiterada, mas o pretérito perfeito é a forma mais natural em português para este acontecimento narrativo.
- source_word: δὲ
  choice: Então
  rationale: δέ funciona como conectivo leve; “Então” dá continuidade natural à narrativa sem introduzir contraste forte.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: Expressão idiomática e tradicional que preserva tanto a relação com Jesus quanto o sentido de μαθηταί.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: o que significava aquela parábola
  rationale: Embora a formulação grega seja mais literalmente “o que seria aquela parábola”, o contexto indica um pedido de interpretação; “o que significava” comunica isso com naturalidade.
- source_word: παραβολή
  choice: parábola
  rationale: Termo consagrado, preciso no contexto dos Evangelhos e amplamente compreensível.
- source_word: εἴη
  choice: significava
  rationale: O optativo aparece numa pergunta indireta após um verbo no passado. A tradução comunica a função interpretativa da pergunta, enquanto a nota preserva a forma mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Aquela parábola” soa mais natural em referência à parábola que Jesus acabara de contar; a nota registra a formulação grega mais literal.
