id: LUK.8.8
reference: Luke 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: pt
  text: 'Outra caiu em solo bom[a] e, depois de crescer, deu fruto cem por um[b]. Ao dizer essas coisas, ele clamava: “Quem tem ouvidos para ouvir[c], ouça!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra boa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “produziu fruto cem vezes mais”.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “Aquele que tem ouvidos para ouvir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Outra
  rationale: O neutro singular se refere, pelo contexto da parábola, a outra semente; em português, o feminino retoma naturalmente “semente”, implícita na sequência.
- source_word: γῆν τὴν ἀγαθήν
  choice: solo bom
  rationale: No contexto agrícola, “solo” expressa com clareza o sentido de γῆ e soa mais específico e atual do que “terra”.
- source_word: φυὲν
  choice: depois de crescer
  rationale: O particípio aoristo indica que o crescimento precede a produção do fruto; a locução preserva essa sequência em português natural.
- source_word: ἐποίησεν καρπὸν
  choice: produziu fruto
  rationale: Expressão clara e idiomática para o resultado agrícola, sem transformar a imagem do texto.
- source_word: ἑκατονταπλασίονα
  choice: cem vezes maior
  rationale: Comunica de modo corrente a produção multiplicada por cem, preservando a ideia de rendimento extraordinário.
- source_word: ταῦτα λέγων
  choice: Ao dizer essas coisas
  rationale: Mantém a relação temporal entre o particípio presente e o verbo principal, em formulação natural.
- source_word: ἐφώνει
  choice: exclamou
  rationale: Transmite a fala enfática e em voz elevada indicada por φωνέω, sem sugerir necessariamente desespero.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Quem tem ouvidos para ouvir
  rationale: “Quem” representa naturalmente em português o particípio substantivado de alcance genérico, sem especificidade masculina indevida.
- source_word: ἀκουέτω
  choice: ouça
  rationale: O presente imperativo na terceira pessoa é expresso diretamente pelo subjuntivo exortativo “ouça”, preservando a força solene do apelo.
theological_decisions:
- issue: Linguagem representativa na exortação de Jesus
  choice: Quem tem ouvidos para ouvir, ouça
  alternative: Aquele que tem ouvidos para ouvir, ouça
  rationale: A construção grega é genérica, não limitada a homens. “Quem” preserva essa abrangência e mantém o singular e a força imperativa sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém o ritmo narrativo da parábola e dá à exortação final um tom público e enfático.
