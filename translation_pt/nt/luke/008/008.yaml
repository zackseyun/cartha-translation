  timestamp: '2026-07-13T21:10:58Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente a sequência da parábola e a exortação final. Contudo, “cem vezes maior” pode referir-se ao tamanho e, em uso estrito, sugerir uma grandeza 101 vezes a original, em vez do rendimento “cem por um” expresso por ἑκατονταπλασίονα. Além disso, “exclamou” neutraliza o imperfeito ἐφώνει; “clamava” conserva melhor a ação de chamar em voz alta enquanto dizia essas coisas.
  naturalness: O português é moderno, claro e apropriado. “Outra caiu” é uma elipse natural de “outra semente” no contexto imediato da parábola. “Deu fruto cem por um” é uma formulação agrícola estabelecida, clara e idiomática em português.
  terminology: “Solo bom”, “fruto”, “quem tem ouvidos para ouvir” e “ouça” são escolhas fiéis e de registro adequado. A formulação inclusiva com “quem” reproduz bem o valor genérico do particípio substantivado grego.
  issues:
  - severity: medium
    issue: “cem vezes maior” não expressa com precisão o rendimento multiplicado.
    rationale: Ἑκατονταπλασίονα descreve uma produção de cem por um / cem vezes tanto. “Maior” tende a qualificar dimensão e pode ser matematicamente ambíguo; “cem por um” conserva o sentido agrícola de rendimento.
  - severity: low
    issue: “exclamou” não reproduz plenamente o aspecto imperfeito de ἐφώνει.
    rationale: O imperfeito retrata Jesus chamando ou clamando enquanto dizia essas coisas. “Clamava” mantém melhor essa ação em curso e o caráter público e enfático da fala.
  revised_text: 'Outra caiu em solo bom[a] e, depois de crescer, deu fruto cem por um[b]. Ao dizer essas coisas, ele clamava: “Quem tem ouvidos para ouvir[c], ouça!”'
