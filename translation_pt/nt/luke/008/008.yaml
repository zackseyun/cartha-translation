revisions:
- from: 'Outra caiu em solo bom[a] e, depois de crescer, produziu fruto cem vezes maior[b]. Ao dizer essas coisas, ele exclamou: “Quem tem ouvidos para ouvir[c], ouça!”'
  to: 'Outra caiu em solo bom[a] e, depois de crescer, deu fruto cem por um[b]. Ao dizer essas coisas, ele clamava: “Quem tem ouvidos para ouvir[c], ouça!”'
  rationale: A revisão substitui uma expressão potencialmente imprecisa de grandeza pela expressão de rendimento agrícola “cem por um” e ajusta o verbo de fala para refletir o imperfeito grego. As demais escolhas são mantidas por serem naturais, fiéis e adequadas ao registro.
