  verdict: revise
  source_fidelity: A tradução preserva corretamente a resposta de Jesus, o imperativo de ir e relatar, a lista de restaurações e as passivas gregas em «são purificadas», «são ressuscitados» e no anúncio aos pobres. Contudo, a nota b está ancorada incorretamente em «são ressuscitados», embora trate de πτωχοὶ εὐαγγελίζονται, a oração final.
  naturalness: «Os cegos recebem a visão» é compreensível, mas pouco idiomático em português moderno. «Os cegos passam a ver» é natural, conciso e conserva a afirmação de que passam a enxergar, sem impor que se trate necessariamente de recuperação de visão anterior.
  terminology: «Pessoas com lepra» e «são purificadas» preservam adequadamente tanto a referência pessoal quanto a nuance de purificação. «Boas-novas» é uma opção legítima de registro bíblico moderado. A construção «aos pobres são anunciadas as boas-novas» mantém a voz passiva e é gramaticalmente apropriada.
