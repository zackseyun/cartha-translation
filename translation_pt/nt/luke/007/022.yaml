  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: pt
  text: 'E ele lhes respondeu: “Vão e contem a João o que vocês viram e ouviram: os cegos passam a ver[a], os mancos andam, as pessoas com lepra são purificadas, os surdos ouvem, os mortos são ressuscitados, e aos pobres são anunciadas as boas-novas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltam a ver”. O verbo grego pode indicar recuperar a visão ou olhar para cima; aqui se refere a passar a enxergar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as boas-novas são pregadas aos pobres”. A construção grega é passiva: os pobres recebem o anúncio das boas-novas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: ele lhes respondeu
  rationale: Expressa de modo natural em português a construção semítica formada pelo particípio ‘respondendo’ e pelo verbo ‘disse’, preservando a ideia de resposta sem a redundância pouco idiomática ‘respondendo, disse’.
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Vão e contem
  rationale: O particípio de movimento acompanha o imperativo principal. A coordenação imperativa é natural em português e ‘contem’ comunica o ato de levar de volta a João um relato do que foi observado.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: o que vocês viram e ouviram
  rationale: Tradução direta e corrente da oração relativa, com ‘vocês’ adequado ao português moderno de ampla compreensão.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: os cegos recebem a visão
  rationale: Preserva a ideia de passar a enxergar sem decidir no texto principal se todos recuperam uma visão anteriormente possuída; a alternativa ‘voltam a ver’ é registrada em nota.
- source_word: χωλοὶ περιπατοῦσιν
  choice: os mancos andam
  rationale: Mantém a forma concisa e paralela da enumeração grega. ‘Mancos’ é compreensível e não restringe o termo a uma condição específica, como faria ‘paralíticos’.
- source_word: λεπροὶ καθαρίζονται
  choice: as pessoas com lepra são purificadas
  rationale: A formulação centrada na pessoa evita reduzir os indivíduos à doença, enquanto ‘são purificadas’ conserva tanto a restauração física quanto a dimensão de pureza presente em καθαρίζονται.
- source_word: κωφοὶ ἀκούουσιν
  choice: os surdos ouvem
  rationale: Com o verbo ‘ouvir’, κωφοί designa claramente pessoas surdas; a tradução preserva o paralelismo direto do grego.
- source_word: νεκροὶ ἐγείρονται
  choice: os mortos são ressuscitados
  rationale: Mantém a voz passiva e não explicita o agente. ‘São ressuscitados’ comunica claramente o levantamento da morte neste contexto.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: aos pobres são anunciadas as boas-novas
  rationale: Conserva a voz passiva e o sentido de receber o anúncio de boas notícias, sem recorrer ao termo eclesiástico potencialmente ambíguo ‘evangelizados’.
theological_decisions:
- issue: A lista de milagres como evidência da identidade e missão de Jesus
  choice: Apresentar diretamente os atos observáveis de restauração, mantendo a linguagem que evoca as promessas proféticas.
  alternative: Acrescentar no texto que esses atos cumprem profecias messiânicas.
  rationale: O versículo oferece as obras como resposta a João, mas não declara explicitamente a conclusão interpretativa. A tradução preserva a alusão sem inserir uma explicação teológica no texto.
- issue: Agente das formas passivas
  choice: Preservar as formas passivas em ‘são purificadas’, ‘são ressuscitados’ e ‘são anunciadas’.
  alternative: Tornar explícito Deus ou Jesus como agente das ações.
  rationale: O grego não nomeia o agente nessas orações. Mantê-lo implícito preserva a tensão e evita acrescentar uma identificação não expressa no versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega ‘vocês’ para o plural e evita tanto arcaísmos quanto jargão eclesiástico desnecessário. A enumeração conserva ritmo conciso e paralelismo. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
