base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: pt
  text: pois ele ama a nossa nação e ele mesmo construiu a sinagoga para nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandou construir a sinagoga para nós”. O grego diz simplesmente “construiu”, o que pode indicar tanto envolvimento pessoal quanto patrocínio ou financiamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: ama
  rationale: Preserva de modo direto e natural a força de ἀγαπάω, sem reduzi-la a mera simpatia ou boa vontade.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão apresentada pelos líderes judeus para fundamentar o pedido do versículo anterior.
- source_word: τὸ ἔθνος ἡμῶν
  choice: a nossa nação
  rationale: Refere-se coletivamente ao povo judeu dos falantes; “nação” conserva o sentido étnico-comunitário de ἔθνος.
- source_word: τὴν συναγωγήν
  choice: a sinagoga
  rationale: Mantém a referência definida à sinagoga local, sem acrescentar um possessivo ausente no grego.
- source_word: αὐτός
  choice: ele mesmo
  rationale: Reproduz a ênfase do pronome grego, destacando o envolvimento ou patrocínio do centurião.
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: Traduz o aoristo de modo simples e direto, sem decidir se ele executou pessoalmente a obra ou a financiou.
- source_word: ἡμῖν
  choice: para nós
  rationale: 'Expressa naturalmente o dativo de benefício: a sinagoga foi construída em favor da comunidade.'
theological_decisions: []
