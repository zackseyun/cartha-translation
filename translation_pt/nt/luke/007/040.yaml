  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Simão, tenho algo para lhe dizer.” Ele disse: “Mestre, diga.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Jesus lhe respondeu
  rationale: A combinação idiomática do particípio ἀποκριθείς com εἶπεν introduz uma resposta. Em português, “respondeu” expressa naturalmente a construção sem a redundância pouco idiomática de “respondendo, disse”.
- source_word: Σίμων
  choice: Simão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: tenho algo para lhe dizer
  rationale: Reproduz com naturalidade o sentido da expressão grega e mantém explícito o destinatário indicado por σοί.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Em português bíblico corrente, “Mestre” é a forma natural de tratamento para um professor ou instrutor e preserva o respeito contextual sem exigir a ideia de senhorio.
- source_word: εἰπέ
  choice: diga
  rationale: O imperativo simples de λέγω é vertido diretamente por “diga”; o conteúdo a ser dito permanece implícito, como no grego.
- source_word: φησίν
  choice: disse
  rationale: O presente histórico grego é expresso no passado, conforme o uso narrativo natural do português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “lhe respondeu” e “lhe dizer” é natural e amplamente compreensível; “Mestre, diga” conserva a concisão do diálogo grego.
