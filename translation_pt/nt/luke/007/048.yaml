  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: pt
  text: 'Então ele disse a ela: “Seus pecados estão perdoados.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Seus pecados foram perdoados.” O perfeito passivo grego pode enfatizar o ato concluído e seu resultado contínuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: O aoristo de λέγω é expresso naturalmente por “disse”, preservando a fala direta.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ é um conectivo suave que faz a narrativa avançar; “Então” oferece fluidez sem sugerir um contraste forte.
- source_word: αὐτῇ
  choice: a ela
  rationale: O dativo indica a destinatária da fala, expresso naturalmente em português por “a ela”.
- source_word: Ἀφέωνταί
  choice: estão perdoados
  rationale: O perfeito passivo de ἀφίημι apresenta um estado atual resultante de uma ação concluída. “Estão perdoados” é claro e idiomático, sem apagar a força resultativa.
- source_word: σου
  choice: seus
  rationale: O genitivo da segunda pessoa é naturalmente vertido pelo possessivo “seus”.
- source_word: αἱ ἁμαρτίαι
  choice: pecados
  rationale: Com o possessivo, o artigo grego não precisa ser representado separadamente em português; “pecados” comunica as transgressões morais no contexto.
theological_decisions:
- issue: Força do perfeito passivo Ἀφέωνταί na declaração de perdão
  choice: “Seus pecados estão perdoados.”
  alternative: “Seus pecados foram perdoados.”
  rationale: A tradução escolhida destaca o estado presente decorrente de um ato concluído; a alternativa explicita mais diretamente o ato passado. A nota preserva ambas as nuances possíveis sem determinar além do que a forma grega permite.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional ampla. A colocação “disse a ela” evita a possível ambiguidade regional de “lhe disse” e mantém explícita a destinatária.
