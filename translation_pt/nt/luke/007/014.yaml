id: LUK.7.14
reference: Luke 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: pt
  text: 'E, aproximando-se, tocou na padiola funerária[a]. Os que a carregavam pararam, e ele disse: “Jovem, eu lhe digo: levante-se!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esquife” ou “caixão”. O termo grego se refere à padiola ou estrutura usada para transportar o morto numa procissão funerária, não necessariamente a um caixão fechado no sentido moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: aproximando-se
  rationale: O particípio aoristo indica que Jesus se aproximou antes de tocar na padiola. A formulação é natural em português e mantém a sequência narrativa.
- source_word: ἥψατο
  choice: tocou
  rationale: Neste contexto, o verbo pode significar tocar ou segurar. “Tocou” comunica adequadamente o gesto sem sugerir que Jesus necessariamente agarrou o objeto.
- source_word: σοροῦ
  choice: padiola funerária
  rationale: O termo designa o suporte no qual o morto era transportado na procissão, provavelmente aberto, e não exige a ideia moderna de um caixão fechado. “Padiola funerária” é clara e historicamente apropriada.
- source_word: οἱ δὲ βαστάζοντες
  choice: Os que a carregavam
  rationale: Reproduz de modo transparente o particípio substantivado e retoma naturalmente a padiola, sem recorrer ao termo menos comum “carregadores do féretro”.
- source_word: ἔστησαν
  choice: pararam
  rationale: No contexto da procissão, o verbo indica que os portadores interromperam o movimento. “Pararam” é direto e natural.
- source_word: Νεανίσκε
  choice: Jovem
  rationale: Forma de tratamento direta para um homem jovem. “Jovem” é corrente, respeitosa e adequada ao tom narrativo.
- source_word: σοὶ λέγω
  choice: eu lhe digo
  rationale: Mantém o pronome explícito e a força direta da declaração, em português natural.
- source_word: ἐγέρθητι
  choice: levante-se
  rationale: O imperativo ordena ao jovem morto que se erga. “Levante-se” é atual, digno e preserva a autoridade da ordem sem tornar explícita uma análise da forma passiva.
theological_decisions:
- issue: Tom e possível valor passivo de ἐγέρθητι na ordem dirigida ao morto
  choice: levante-se
  alternative: seja levantado; erga-se
  rationale: A forma grega pode ser analisada morfologicamente como passiva, mas funciona naturalmente como ordem para se levantar. “Levante-se” preserva a força imediata e milagrosa da fala de Jesus sem acrescentar uma explicação doutrinária sobre a agência do ato; “seja levantado” soaria artificial em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a progressão do grego sem rigidez excessiva. O marcador da nota foi colocado junto de “padiola funerária”, termo ao qual a nota lexical efetivamente se refere.
