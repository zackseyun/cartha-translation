  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the slave healthy.
translation:
  language: pt
  text: Quando os que tinham sido enviados voltaram para a casa, encontraram o escravo com saúde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. A palavra grega doulos pode significar “escravo” ou “servo”, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Quando ... voltaram
  rationale: O particípio aoristo tem valor temporal e indica uma ação anterior à do verbo principal; esta construção comunica naturalmente a sequência em português.
- source_word: εἰς τὸν οἶκον
  choice: para a casa
  rationale: εἰς com acusativo indica movimento em direção a um lugar ou para dentro dele. “Para a casa” preserva a referência concreta sem interpretar οἶκος como “lar”.
- source_word: οἱ πεμφθέντες
  choice: os que tinham sido enviados
  rationale: Preserva tanto a forma passiva quanto a anterioridade contextual, sem acrescentar o substantivo interpretativo “mensageiros”.
- source_word: εὗρον
  choice: encontraram
  rationale: Equivalente narrativo direto e natural de εὑρίσκω neste contexto.
- source_word: τὸν δοῦλον
  choice: o escravo
  rationale: δοῦλος designa aqui alguém socialmente subordinado e sujeito à autoridade do centurião; “escravo” preserva esse estatuto melhor que o termo mais amplo “servo”.
- source_word: ὑγιαίνοντα
  choice: com saúde
  rationale: O particípio presente de ὑγιαίνω descreve o escravo como saudável. “Com saúde” é natural e evita substituir a descrição do estado pelo termo interpretativo “curado”.
theological_decisions:
- issue: Tradução de δοῦλος em uma narrativa de cura
  choice: escravo
  alternative: servo
  rationale: O contexto não reduz δοῦλος a um trabalhador contratado; “escravo” conserva a condição social indicada pelo grego. Como “servo” é possível e tradicional, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção temporal natural. A expressão “com saúde” mantém o valor descritivo de ὑγιαίνοντα sem explicitar além do texto que ele havia sido curado.
