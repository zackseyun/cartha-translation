  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: pt
  text: 'Depois que os mensageiros de João partiram, Jesus começou a falar às multidões a respeito de João: “O que vocês foram ver no deserto? Um caniço agitado pelo vento?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Depois que ... partiram
  rationale: O particípio aoristo em genitivo absoluto tem valor temporal e indica que a partida dos mensageiros ocorreu antes do início da fala.
- source_word: ἀγγέλων
  choice: mensageiros
  rationale: Neste contexto, refere-se aos enviados humanos de João, não a seres celestiais.
- source_word: Ἰωάννου
  choice: de João / João
  rationale: O primeiro genitivo expressa vínculo ou procedência dos mensageiros; em περὶ Ἰωάννου, o nome é o assunto da fala.
- source_word: ἤρξατο λέγειν
  choice: Jesus começou a falar
  rationale: Preserva o aspecto incoativo da construção. O sujeito explícito 'Jesus' torna a referência natural e inequívoca em português.
- source_word: πρὸς τοὺς ὄχλους
  choice: às multidões
  rationale: Mantém o plural de ὄχλους e expressa naturalmente o destinatário da fala.
- source_word: περὶ Ἰωάννου
  choice: a respeito de João
  rationale: Equivalente corrente e digno para περί com genitivo neste contexto discursivo.
- source_word: Τί ἐξήλθατε
  choice: O que vocês foram
  rationale: τί pergunta pelo objeto que as pessoas foram ver, e não primariamente pelo motivo de sua ida.
- source_word: εἰς τὴν ἔρημον
  choice: no deserto
  rationale: Em português, 'ir ver no deserto' expressa naturalmente a ida ao local sem exigir a formulação mais rígida 'para o deserto'. 'Deserto' é amplamente compreensível para a região erma ligada ao ministério de João.
- source_word: θεάσασθαι
  choice: ver
  rationale: Forma natural em português para contemplar ou observar algo; no contexto, conserva a pergunta sobre aquilo que atraíra a atenção das multidões.
- source_word: κάλαμον
  choice: um caniço
  rationale: Designa com precisão uma planta de haste delgada e preserva a imagem literal de instabilidade.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: agitado pelo vento
  rationale: Reproduz a ação do vento sobre o caniço de modo claro e idiomático, sem explicar a metáfora.
theological_decisions:
- issue: Força metafórica da pergunta retórica sobre João
  choice: 'Manter a imagem literal: “Um caniço agitado pelo vento?”'
  alternative: Explicitar como “Um homem fraco ou inconstante?”
  rationale: O texto apresenta a imagem e deixa que o ouvinte deduza sua relação com João. A tradução não deve resolver no corpo do versículo essa tensão metafórica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega 'vocês' para a segunda pessoa do plural e evita formulações arcaicas. Não foi incluída nota para θεάσασθαι, pois 'ver' transmite adequadamente o sentido no contexto sem perda que exija alternativa editorial.
