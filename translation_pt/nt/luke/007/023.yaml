  source_fidelity: A tradução preserva adequadamente a imagem de tropeço e o valor causal de ἐν ἐμοί em «por minha causa». Contudo, «feliz» atenua o peso tradicional e religioso de μακάριος nesta bem-aventurança, e o presente indicativo «não tropeça» torna menos visível a construção geral/condicional ὃς ἐὰν μὴ ... σκανδαλισθῇ.
  naturalness: «Bem-aventurado é aquele que não tropeçar por minha causa» é digno, claro e amplamente inteligível no português atual, inclusive para leitores brasileiros. O futuro do subjuntivo é natural após «aquele que» e comunica bem a condição genérica do grego.
  terminology: «Bem-aventurado» é a opção mais apropriada para μακάριος nos ditos de Jesus, preservando sua ressonância de declaração de favor divino. «Tropeçar por minha causa» mantém a metáfora sem decidir indevidamente entre ofensa, queda e afastamento.
  issues:
  - severity: medium
    issue: «feliz» para μακάριος
    rationale: Embora seja possível em certos contextos, «feliz» tende a sugerir sobretudo estado emocional ou boa sorte. Nesta fórmula de bem-aventurança, «bem-aventurado» preserva melhor o registro e o peso religioso do termo grego.
  - severity: low
    issue: «não tropeça» para ἐὰν μὴ σκανδαλισθῇ
    rationale: O presente indicativo é compreensível como generalização, mas «não tropeçar» reflete mais claramente a construção condicional com subjuntivo e evita enfraquecer sua nuance potencial.
  - severity: low
