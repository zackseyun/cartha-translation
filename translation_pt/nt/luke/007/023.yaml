  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: pt
  text: E bem-aventurado é aquele que não tropeçar por minha causa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se escandalizar por minha causa” ou “não cair por minha causa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: feliz
  rationale: Em uma bem-aventurança, “feliz” é natural e compreensível em português, sem reduzir o sentido a uma emoção passageira; expressa a condição favorável daquele que recebe a aprovação divina.
- source_word: ὃς ἐὰν μή
  choice: aquele que não
  rationale: Reproduz de modo idiomático a referência singular e representativa e o valor de condição geral da construção grega.
- source_word: σκανδαλισθῇ
  choice: tropeça
  rationale: Preserva a metáfora de tropeço do verbo grego e sua tensão entre escandalizar-se com Jesus e vir a cair por causa dele. Embora a forma grega seja passiva, o português emprega naturalmente “tropeçar” de modo intransitivo nesse contexto.
- source_word: ἐν ἐμοί
  choice: por minha causa
  rationale: Neste uso, ἐν ἐμοί indica Jesus como ocasião ou causa do tropeço. A expressão é clara e idiomática em português.
theological_decisions:
- issue: Amplitude do tropeço provocado pela pessoa e atuação de Jesus
  choice: não tropeça por minha causa
  alternative: não se escandaliza comigo; não se afasta por minha causa
  rationale: A formulação mantém a imagem bíblica e não reduz o sentido a uma reação emocional de ofensa nem o define exclusivamente como abandono da fé.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “E feliz é” conserva a forma de bem-aventurança sem recorrer ao menos corrente “bem-aventurado”.
