revisions:
- from: E feliz é aquele que não tropeça por minha causa.[a]
  to: E bem-aventurado é aquele que não tropeçar por minha causa.[a]
  rationale: A revisão substitui «feliz» por «bem-aventurado» para conservar o registro característico de μακάριος nos ensinamentos de Jesus. Também emprega «não tropeçar» para representar mais diretamente a condição geral expressa por ὃς ἐὰν μὴ com o subjuntivo aoristo passivo, sem impor uma interpretação única de σκανδαλίζω. A nota preserva alternativas semanticamente legítimas e mantém «por minha causa», que explicita de modo natural a função causal de ἐν ἐμοί.
