  source_fidelity: A primeira oração transmite corretamente o relato dos discípulos a João e «todas essas coisas». Contudo, «Então João chamou» transforma o particípio grego προσκαλεσάμενος em verbo finito e introduz «Então», que não corresponde ao simples conectivo καί. Como a construção permanece deliberadamente incompleta até o versículo seguinte, convém conservar a forma participial.
  naturalness: «E João, chamando dois dos seus discípulos,» é natural em registro bíblico moderno, preserva a suspensão sintática e evita a inferência não explícita de que os chamou para junto de si.
  terminology: «Discípulos», «João» e «todas essas coisas» são adequados e consistentes. «Dos seus discípulos» expressa de modo idiomático o genitivo partitivo τῶν μαθητῶν αὐτοῦ. A nuance indefinida de τινάς não exige uma formulação artificial como «dois certos».
