lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: contaram
  rationale: O verbo indica transmitir uma notícia ou relatar acontecimentos. “Contaram” é natural no português narrativo e mantém a ideia de comunicar informações.
- source_word: Ἰωάννῃ
  choice: a João / lhe
  rationale: O dativo marca o destinatário. Na redação portuguesa, “os discípulos de João lhe contaram” identifica naturalmente João como destinatário sem ambiguidade.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os discípulos de João
  rationale: Embora αὐτοῦ signifique literalmente “dele”, explicitar “de João” evita que o possessivo pareça retomar outra personagem no contexto e preserva o referente.
- source_word: περὶ πάντων τούτων
  choice: todas essas coisas
  rationale: Com “contaram”, o português dispensa uma preposição explícita. A formulação preserva tanto a abrangência de πάντων quanto a referência demonstrativa de τούτων.
- source_word: προσκαλεσάμενος
  choice: chamou
  rationale: O particípio aoristo médio apresenta uma ação anterior à principal que continua no versículo seguinte. A forma finita “chamou” soa natural e comunica que João convocou os discípulos para junto de si.
- source_word: δύο τινὰς
  choice: dois
  rationale: τινάς acrescenta uma nuance indefinida ou seletiva, normalmente já expressa de modo idiomático em português por “dois de seus discípulos”; “dois certos” seria artificial e poderia sugerir uma ênfase indevida.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: de seus discípulos
  rationale: 'O genitivo é partitivo: os dois foram escolhidos dentre o grupo dos discípulos de João. A construção portuguesa é concisa e natural.'
- source_word: ὁ Ἰωάννης
  choice: João
  rationale: O sujeito expresso é preservado no início da segunda oração, facilitando a transição narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “João” na primeira oração foi usada para tornar inequívoco o referente do possessivo grego; a segunda oração mantém o nome como sujeito explícito. A estrutura termina com vírgula porque a oração prossegue no versículo 19.
