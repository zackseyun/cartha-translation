  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: pt
  text: E aconteceu que, no dia seguinte, ele foi a uma cidade chamada Naim[a], e seus discípulos e uma grande multidão iam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “logo depois”, em vez de “no dia seguinte”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa característica de Lucas em português corrente, sem recorrer ao arcaísmo “sucedeu”.
- source_word: ἐν τῷ ἑξῆς
  choice: logo depois
  rationale: A construção neutra do texto da SBLGNT indica o tempo subsequente de modo geral; “logo depois” é natural e não especifica um dia que o texto adotado não menciona explicitamente.
- source_word: ἐπορεύθη
  choice: foi
  rationale: Expressa de modo simples e natural o movimento indicado por πορεύομαι no relato.
- source_word: εἰς πόλιν
  choice: a uma cidade
  rationale: πόλις designa um núcleo urbano; “cidade” é a correspondência portuguesa usual, sem depender de uma classificação moderna do tamanho de Naim.
- source_word: καλουμένην Ναΐν
  choice: chamada Naim
  rationale: Tradução idiomática do particípio e forma tradicional portuguesa do topônimo.
- source_word: συνεπορεύοντο αὐτῷ
  choice: iam com ele
  rationale: O imperfeito apresenta o acompanhamento em curso, e a formulação mantém tanto o movimento quanto a duração.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Seus discípulos
  rationale: Forma portuguesa direta e consagrada para a relação expressa pelo possessivo grego.
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: Reproduz com naturalidade a ideia de um grupo numeroso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se o pronome “ele”, como no sujeito implícito do grego, sem inserir explicitamente o nome de Jesus.
