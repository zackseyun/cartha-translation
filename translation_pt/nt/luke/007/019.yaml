  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: pt
  text: 'Ele enviou ao Senhor, dizendo: “És tu aquele que há de vir, ou devemos esperar outro?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Ele os enviou
  rationale: O aoristo de πέμπω indica uma ação narrativa passada. Em português, o objeto é explicitado como “os”, retomando naturalmente os mensageiros mencionados no contexto imediato.
- source_word: πρὸς τὸν κύριον
  choice: ao Senhor
  rationale: πρός com acusativo indica direção a uma pessoa. “Senhor” preserva o tratamento narrativo e o peso cristológico de κύριος em Lucas.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio presente introduz o conteúdo da mensagem; “dizendo” mantém de modo natural essa ligação.
- source_word: Σὺ εἶ
  choice: És tu
  rationale: A forma declarativa grega tem sentido interrogativo no discurso direto. “És tu” é claro, digno e dá expressão ao pronome enfático σύ.
- source_word: ὁ ἐρχόμενος
  choice: Aquele que Vem
  rationale: O particípio substantivado com artigo pode ser descritivo, “aquele que vem”, mas neste contexto provavelmente funciona como designação messiânica. A formulação conserva ambos os aspectos.
- source_word: ἢ
  choice: ou
  rationale: Conjunção disjuntiva que introduz a alternativa.
- source_word: ἄλλον
  choice: outro
  rationale: Equivalente direto e conciso do objeto de προσδοκῶμεν, sem acrescentar “alguém” ao texto.
- source_word: προσδοκῶμεν
  choice: devemos esperar
  rationale: No contexto de uma pergunta deliberativa, expressa adequadamente a expectativa contínua e a questão sobre qual conduta adotar.
theological_decisions:
- issue: Tradução de κύριος como título aplicado a Jesus
  choice: Senhor
  alternative: mestre
  rationale: “Senhor” preserva o uso narrativo habitual de Lucas e a possível relevância cristológica do título; “mestre” reduziria esse alcance sem necessidade contextual.
- issue: Caráter messiânico ou meramente descritivo de ὁ ἐρχόμενος
  choice: Aquele que Vem
  alternative: aquele que está vindo
  rationale: A expressão provavelmente atua como designação messiânica reconhecível, mas continua formalmente sendo um particípio. A tradução escolhida sinaliza a força titular sem substituir a expressão por uma interpretação explícita como “Messias”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “És tu” preserva a ênfase do pronome grego; “Aquele que Vem” mantém a possível força titular, explicada em nota.
