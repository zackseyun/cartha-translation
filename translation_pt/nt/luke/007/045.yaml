source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: pt
  text: Você não me deu um beijo[a], mas ela, desde que entrei, não parou de beijar meus pés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um beijo de saudação”; o beijo era um gesto costumeiro de acolhimento.
    reason: cultural_note
  - marker: b
    text: 'O verbo pode indicar beijar afetuosa ou repetidamente: “não parou de cobrir meus pés de beijos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: beijo
  rationale: O substantivo com ἔδωκας designa o ato de dar um beijo, aqui no contexto de recepção e hospitalidade. A formulação simples preserva o texto sem inserir a explicação cultural no corpo do versículo.
- source_word: μοι
  choice: me
  rationale: 'O pronome dativo é expresso naturalmente em português como objeto indireto: “me deu”.'
- source_word: ἔδωκας
  choice: deu
  rationale: δίδωμι significa diretamente “dar”; “dar um beijo” é idiomático e mantém de perto a forma grega.
- source_word: αὕτη δὲ
  choice: ela, porém
  rationale: O pronome aponta para a mulher e δέ estabelece contraste com o anfitrião. “Ela, porém” comunica esse contraste com clareza e dignidade.
- source_word: ἀφ’ ἧς
  choice: desde que
  rationale: A construção tem sentido temporal, indicando o ponto inicial da ação que continua até o momento da fala.
- source_word: εἰσῆλθον
  choice: entrei
  rationale: Tradução direta e natural de εἰσέρχομαι no contexto da entrada de Jesus na casa.
- source_word: οὐ διέλιπεν
  choice: não parou
  rationale: διαλείπω significa cessar ou interromper. “Não parou” expressa em português corrente a continuidade da ação.
- source_word: καταφιλοῦσά
  choice: cobrir de beijos
  rationale: καταφιλέω pode indicar beijos afetuosos ou repetidos. “Cobrir de beijos” preserva essa força intensiva de modo natural; a nota registra a alternativa mais simples.
- source_word: μου τοὺς πόδας
  choice: meus pés
  rationale: Mantém o possessivo e o plural explícitos no grego.
theological_decisions:
- issue: O costume de oferecer um beijo de saudação ao hóspede
  choice: Manter no texto apenas a ação — “nenhum beijo” — e explicar o costume em nota.
  alternative: “nenhum beijo de saudação”
  rationale: O contraste entre a omissão do anfitrião e a devoção da mulher está presente no contexto, mas o grego não explicita “de saudação”. A nota fornece o dado cultural sem acrescentá-lo ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ela, porém” conserva o contraste do grego; “cobrir de beijos” comunica de modo natural a possível intensidade ou repetição de καταφιλέω.
