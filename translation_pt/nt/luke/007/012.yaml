  source_fidelity: O texto transmite com precisão a progressão temporal (ὡς δὲ ἤγγισεν), a chegada ao portão, o destaque narrativo de ἰδού, o imperfeito passivo de ἐξεκομίζετο e a condição resultante expressa por τεθνηκώς. “O único filho de sua mãe” reproduz adequadamente a relação familiar indicada por μονογενὴς υἱὸς τῇ μητρὶ αὐτοῦ. A viúva e a multidão considerável da cidade que estava com ela também estão preservadas.
