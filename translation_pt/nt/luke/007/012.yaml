id: LUK.7.12
reference: Luke 7:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: pt
  text: Quando ele se aproximou do portão da cidade, eis que levavam para fora um morto, o único filho[a] de sua mãe. Ela era viúva, e uma multidão numerosa da cidade a acompanhava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu filho único”.'
    reason: Alternativa lexical e sintática para μονογενὴς υἱός.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Quando ele se aproximou
  rationale: Expressa naturalmente a relação temporal e o aspecto pontual do aoristo, enquanto a leve força conectiva de δέ é absorvida pelo fluxo narrativo.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: do portão da cidade
  rationale: “Portão” designa com clareza a entrada urbana e mantém a relação genitiva do grego.
- source_word: καὶ ἰδοὺ
  choice: eis que
  rationale: Preserva a função de ἰδού de chamar a atenção para uma cena repentina, em registro digno e corrente.
- source_word: ἐξεκομίζετο
  choice: levavam para fora
  rationale: O imperfeito passivo descreve a ação em andamento; a forma impessoal portuguesa comunica naturalmente que o morto estava sendo transportado para fora da cidade.
- source_word: τεθνηκώς
  choice: um morto
  rationale: O particípio perfeito apresenta a pessoa no estado resultante da morte; “um morto” é conciso e natural no contexto de um cortejo fúnebre.
- source_word: μονογενὴς υἱός
  choice: o único filho
  rationale: Neste contexto familiar, μονογενής indica que ele era o único filho da mulher; “filho” preserva explicitamente o substantivo masculino υἱός.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: de sua mãe
  rationale: O dativo relacional identifica de quem ele era o único filho, relação expressa idiomaticamente em português com “de”.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: Ela era viúva
  rationale: Mantém o destaque dado à própria mãe por αὐτή e comunica de modo direto a intensidade da situação.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: uma multidão numerosa da cidade
  rationale: ἱκανός indica quantidade considerável; “numerosa” é natural e evita tornar a estimativa mais exata do que o texto permite.
- source_word: ἦν σὺν αὐτῇ
  choice: a acompanhava
  rationale: No contexto do cortejo, expressa naturalmente a ideia de estar com ela sem acrescentar uma relação ausente do grego.
theological_decisions:
- issue: Sentido de μονογενής em contexto não cristológico
  choice: o único filho
  alternative: seu filho único
  rationale: Aqui o termo descreve a relação familiar entre a viúva e o falecido, sem exigir o vocabulário teológico tradicional “unigênito”. A formulação escolhida preserva o sentido simples de filho único.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva o relevo narrativo do original; a construção geral evita arcaísmos e explicitações doutrinárias.
