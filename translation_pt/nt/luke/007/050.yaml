base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: pt
  text: 'E ele disse à mulher: “A sua fé[a] salvou você[b]; vá em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiança”. Menos provavelmente neste contexto, “fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “resgatou você” e, em contextos de cura, “curou você”. O verbo grego pode ter esses sentidos, mas aqui o contexto destaca o perdão e a salvação.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: E ele disse
  rationale: O aoristo de λέγω é naturalmente traduzido por “disse”, enquanto δέ dá continuidade simples à narrativa, adequadamente expressa por “E”.
- source_word: πρὸς τὴν γυναῖκα
  choice: à mulher
  rationale: No contexto, γυνή designa a mulher presente na cena, não uma esposa; a construção portuguesa “disse à mulher” é direta e natural.
- source_word: Ἡ πίστις σου
  choice: A sua fé
  rationale: Aqui πίστις indica a resposta confiante da mulher a Jesus. “Fé” conserva o termo teológico corrente sem eliminar a nuance de confiança.
- source_word: σέσωκέν σε
  choice: salvou você
  rationale: O perfeito de σῴζω apresenta uma ação realizada cujo resultado permanece. O contexto imediato destaca perdão e salvação, embora o verbo também possa significar cura em outros contextos.
- source_word: πορεύου εἰς εἰρήνην
  choice: vá em paz
  rationale: Esta é a forma idiomática, natural e digna de expressar em português a ordem e o estado de paz indicado pela locução grega.
theological_decisions:
- issue: Sentido de σῴζω em relação ao perdão e à salvação
  choice: salvou você
  alternative: curou você
  rationale: Lucas 7:36–50 enfatiza o perdão dos pecados e a resposta de fé da mulher. “Salvou” preserva esse peso contextual, enquanto uma nota registra a amplitude lexical do verbo sem converter o episódio em uma cura física não explicitada.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” é a correspondência mais adequada no contexto, no qual a confiança da mulher em Jesus está em foco. “Fidelidade” é lexicalmente possível em outros contextos, mas menos provável aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se “você” para clareza e fluidez, mantendo o paralelismo entre “a sua fé” e “salvou você”.
