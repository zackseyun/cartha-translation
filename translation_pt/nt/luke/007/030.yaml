id: LUK.7.30
reference: Luke 7:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: pt
  text: Mas os fariseus e os peritos na Lei rejeitaram o propósito de Deus para si mesmos[a], não tendo sido batizados por ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o conselho de Deus contra si mesmos” ou “o plano de Deus a respeito deles”.
    reason: alternative_reading
  - marker: b
    text: Isto é, por João Batista.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: peritos na Lei
  rationale: O termo designa pessoas especializadas na Lei de Moisés. “Peritos na Lei” é claro e atual, além de evitar confundi-los diretamente com os escribas.
- source_word: βουλὴν
  choice: propósito
  rationale: βουλή pode indicar propósito, plano ou desígnio. “Propósito” comunica naturalmente a intenção de Deus sem sugerir apenas conselho ou recomendação.
- source_word: ἠθέτησαν
  choice: rejeitaram
  rationale: ἀθετέω expressa rejeitar, pôr de lado ou invalidar. Neste contexto, “rejeitaram” apresenta com clareza a recusa deles.
- source_word: εἰς ἑαυτούς
  choice: para si mesmos
  rationale: A expressão indica que o propósito de Deus dizia respeito a eles pessoalmente. A tradução mantém essa referência sem decidir de modo categórico entre benefício, relação ou resultado adverso.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: não tendo sido batizados por ele
  rationale: A construção participial preserva a forma do grego e não determina indevidamente se a circunstância é causal, instrumental ou simplesmente concomitante.
- source_word: αὐτοῦ
  choice: ele
  rationale: O pronome remete contextualmente a João Batista, mencionado no contexto anterior; mantê-lo no texto principal segue de perto o grego, enquanto a nota esclarece o referente.
- source_word: δὲ
  choice: Mas
  rationale: δέ estabelece contraste com o versículo anterior, no qual o povo e os cobradores de impostos reconheceram a justiça de Deus após receberem o batismo de João.
theological_decisions:
- issue: Sentido do propósito de Deus em relação aos fariseus e aos peritos na Lei
  choice: o propósito de Deus para si mesmos
  alternative: o conselho de Deus contra si mesmos; o plano de Deus a respeito deles
  rationale: A formulação afirma que eles rejeitaram o que Deus pretendia em relação a eles, sem resolver a tensão teológica por meio de uma afirmação mais ampla sobre a vontade decretiva de Deus.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Peritos na Lei” evita o uso potencialmente enganoso de “advogados”, e a construção participial mantém a ambiguidade sintática do original.
