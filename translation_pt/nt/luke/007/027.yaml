id: LUK.7.27
reference: Luke 7:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: pt
  text: 'Este é aquele sobre quem está escrito: “Eis que envio o meu mensageiro[b] diante da tua face[a], o qual preparará o teu caminho à tua frente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais natural, “diante de ti”. O grego diz literalmente “diante da tua face”.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega também pode significar “anjo”, mas aqui designa um emissário humano, João.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Este é aquele
  rationale: Retoma João de modo enfático e, em português, introduz naturalmente a oração relativa que se segue.
- source_word: περὶ οὗ γέγραπται
  choice: sobre quem está escrito
  rationale: Expressão idiomática e fiel à fórmula de citação das Escrituras; o perfeito passivo grego é naturalmente representado por “está escrito”.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva o tom solene e profético da citação sem deixar de ser compreensível no português moderno.
- source_word: ἀποστέλλω
  choice: envio
  rationale: Mantém o presente vívido da citação profética e soa natural em português.
- source_word: ἄγγελόν
  choice: mensageiro
  rationale: O termo grego pode designar um anjo ou um emissário humano; neste contexto refere-se a João, portanto “mensageiro” comunica corretamente o sentido contextual.
- source_word: πρὸ προσώπου σου
  choice: diante da tua face
  rationale: Conserva a imagem concreta e a forma enfática da expressão grega, enquanto uma alternativa mais fluente é registrada em nota.
- source_word: κατασκευάσει
  choice: preparará
  rationale: Expressa com clareza a ação futura de deixar pronto.
- source_word: τὴν ὁδόν σου
  choice: o teu caminho
  rationale: É o equivalente mais natural no contexto profético e metafórico.
- source_word: ἔμπροσθέν σου
  choice: à tua frente
  rationale: Tradução natural que mantém esta expressão distinta da imagem mais concreta de πρὸ προσώπου σου.
theological_decisions:
- issue: Aplicação a João, em relação a Jesus, da linguagem da citação profética
  choice: Manter os pronomes de segunda pessoa e não explicitar a identidade de quem tem o caminho preparado
  alternative: Acrescentar uma identificação interpretativa, como “o caminho do Senhor” ou “o teu caminho, isto é, o caminho do Messias”
  rationale: O texto grego aplica diretamente a citação, mas não faz essa expansão. A manutenção de “tua” e “tua frente” preserva a força teológica e a tensão do texto sem inserir comentário denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva o registro solene da citação; “diante da tua face” mantém deliberadamente a imagem do original, esclarecida em nota.
