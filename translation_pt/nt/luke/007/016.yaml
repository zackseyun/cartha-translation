id: LUK.7.16
reference: Luke 7:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: pt
  text: 'E o temor tomou conta de todos, e eles glorificavam a Deus, dizendo: “Um grande profeta se levantou entre nós[a], e Deus visitou o seu povo[b]”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi levantado entre nós”, ressaltando a possibilidade de Deus ter levantado esse profeta.'
    reason: lexical_alternative
  - marker: b
    text: “Visitou” é linguagem bíblica para Deus voltar sua atenção ao seu povo e agir em favor dele.
    reason: cultural_note
  - marker: c
    text: 'O grego também pode ser pontuado como duas declarações: “Um grande profeta se levantou entre nós”, e: “Deus visitou o seu povo”.'
    reason: translation_alternative
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: o temor tomou conta de todos
  rationale: Preserva φόβος como “temor”, sem reduzi-lo interpretativamente a mera admiração, e comunica de modo natural a ideia de uma reação súbita que dominou a todos.
- source_word: δὲ
  choice: E
  rationale: Funciona aqui como conectivo narrativo leve, sem impor contraste ou sequência mais forte do que o grego expressa.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: glorificavam a Deus
  rationale: O imperfeito é representado por “glorificavam”, preservando a ação em curso; “glorificar” mantém a ligação lexical com δοξάζω.
- source_word: λέγοντες
  choice: dizendo
  rationale: Introduz de maneira direta e natural o conteúdo pelo qual glorificavam a Deus.
- source_word: Προφήτης μέγας
  choice: Um grande profeta
  rationale: Equivalência direta, idiomática e fiel à força avaliativa de μέγας.
- source_word: ἠγέρθη
  choice: se levantou
  rationale: Expressão natural em português para o surgimento de um profeta, sem eliminar por completo a possibilidade de o passivo grego sugerir que Deus o levantou; essa nuance é explicitada em nota.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Traduz naturalmente a localização no meio da comunidade.
- source_word: Ἐπεσκέψατο
  choice: visitou
  rationale: Preserva a linguagem bíblica de visitação divina, que pode envolver atenção, cuidado e intervenção, sem restringi-la a uma única explicação.
- source_word: τὸν λαὸν αὐτοῦ
  choice: o seu povo
  rationale: Formulação corrente que mantém as possíveis ressonâncias de pertencimento e aliança.
theological_decisions:
- issue: Sentido de φόβος diante do milagre
  choice: temor
  alternative: reverente admiração
  rationale: “Temor” preserva a força e a tensão da reação descrita pelo texto; uma tradução como “admiração” interpretaria antecipadamente a natureza dessa reação.
- issue: Agência implícita em ἠγέρθη
  choice: se levantou
  alternative: foi levantado
  rationale: A forma grega é passiva e pode evocar Deus levantando um profeta, mas também admite a expressão idiomática de que um profeta surgiu. O texto principal permanece natural e a nota conserva a possível agência divina.
- issue: Alcance da visitação divina em Ἐπεσκέψατο
  choice: Deus visitou o seu povo
  alternative: Deus veio ajudar o seu povo
  rationale: “Visitou” retém a riqueza bíblico-teológica da visitação de Deus, sem reduzi-la apenas a ajuda, socorro ou observação.
- issue: Relação entre as duas declarações introduzidas por ὅτι
  choice: uma só fala contínua
  alternative: duas declarações citadas separadamente
  rationale: A repetição de ὅτι permite perceber duas afirmações paralelas, mas ambas constituem o conteúdo do mesmo ato de glorificar a Deus. Uma única citação é mais natural sem apagar a estrutura, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Temor”, “glorificavam” e “visitou” preservam o registro bíblico sem arcaísmo excessivo; a ordem e a pontuação favorecem fluidez oral.
