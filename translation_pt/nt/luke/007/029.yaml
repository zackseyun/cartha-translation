  terminology: “Cobradores de impostos” é claro e apropriado para τελῶναι. “Batismo de João” é terminologia bíblica estabelecida e comunica adequadamente τὸ βάπτισμα Ἰωάννου. A nota sobre “justificou a Deus” preserva a alternativa formal sem induzir o sentido impróprio de tornar Deus justo.
