id: LUK.7.29
reference: Luke 7:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: pt
  text: E todo o povo, ao ouvir isso, incluindo os cobradores de impostos, reconheceu que Deus era justo[a], tendo recebido o batismo de João[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “justificou a Deus”. O sentido é que reconheceu que Deus tinha razão.'
    reason: lexical_alternative
  - marker: b
    text: 'O particípio também pode ser entendido em sentido causal: “porque havia recebido o batismo de João”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: Preserva a expressão coletiva e seu alcance amplo em português natural.
- source_word: ἀκούσας
  choice: ao ouvir isso
  rationale: Expressa naturalmente o valor temporal do particípio aoristo; “isso” retoma o conteúdo ouvido no contexto.
- source_word: τελῶναι
  choice: cobradores de impostos
  rationale: Termo moderno, claro e amplamente compreensível para os agentes de arrecadação fiscal.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: reconheceu que Deus era justo
  rationale: Comunica que o povo reconheceu ou confirmou que Deus tinha razão, sem sugerir que seres humanos tornaram Deus justo. O singular concorda naturalmente com o coletivo “todo o povo” em português.
- source_word: βαπτισθέντες
  choice: tendo recebido
  rationale: Com “o batismo”, esta formulação expressa com naturalidade o particípio passivo e mantém sua relação circunstancial sem torná-la explicitamente causal.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: o batismo de João
  rationale: Tradução concisa e idiomática que identifica o batismo administrado por João.
theological_decisions:
- issue: Sentido de “justificaram a Deus”
  choice: reconheceu que Deus era justo
  alternative: justificou a Deus
  rationale: A expressão descreve o reconhecimento humano da justiça de Deus, não uma mudança na condição moral de Deus. A alternativa mais formal é registrada em nota.
- issue: Valor do particípio βαπτισθέντες
  choice: tendo recebido o batismo de João
  alternative: porque havia recebido o batismo de João
  rationale: O particípio pode ter sentido causal no contexto, mas sua forma não exige essa leitura. A tradução principal preserva a relação sem resolver excessivamente a sintaxe.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Incluindo” evita acrescentar a ênfase que “até mesmo” poderia sugerir. A construção coletiva no singular é natural em português; a nota preserva a alternativa formal de δικαιόω, e a segunda nota mantém aberta a possível força causal do particípio.
