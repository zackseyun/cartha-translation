  source_fidelity: A tradução preserva adequadamente a estrutura e o sentido do grego. “Todo o povo” reproduz bem o coletivo πᾶς ὁ λαός; “incluindo os cobradores de impostos” expressa a coordenação sem acrescentar a ênfase de “até mesmo”. “Reconheceu que Deus era justo” comunica corretamente o valor de ἐδικαίωσαν τὸν θεόν como reconhecimento da justiça de Deus, e “tendo recebido o batismo de João” mantém o particípio como circunstancial, sem impor sentido causal.
