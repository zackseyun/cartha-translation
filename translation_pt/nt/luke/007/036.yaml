id: LUK.7.36
reference: Luke 7:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: pt
  text: Um dos fariseus lhe pedia que comesse com ele[a]. Jesus entrou na casa do fariseu e reclinou-se à mesa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: «o convidava para comer com ele».'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, adotou a postura habitual nas refeições formais daquele tempo: reclinado, e não sentado ereto.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: lhe pedia
  rationale: O imperfeito sugere uma ação em curso no passado. Em português, «lhe pedia» preserva esse aspecto e permanece mais próximo do verbo grego do que «convidava», embora o pedido funcione como convite no contexto.
- source_word: δέ
  choice: não expresso separadamente
  rationale: Conectivo narrativo leve; em português, a progressão entre as frases já comunica sua função sem exigir «ora» ou «então», que poderiam acrescentar uma nuance temporal ou retórica indevida.
- source_word: τις ... τῶν Φαρισαίων
  choice: um dos fariseus
  rationale: A construção com genitivo partitivo é expressa naturalmente e com precisão por «um dos fariseus».
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: que comesse com ele
  rationale: Reproduz de modo relativamente formal a construção de pedido seguida de ἵνα com subjuntivo, sem substituir o ato de comer pelo mais interpretativo «jantar».
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: entrou na casa do fariseu
  rationale: 'O particípio aoristo indica ação anterior ao verbo principal. A coordenação em português mantém com clareza a sequência: entrou e depois reclinou-se.'
- source_word: κατεκλίθη
  choice: reclinou-se à mesa
  rationale: O verbo designa a postura reclinada costumeira nas refeições formais antigas. «À mesa» torna explícito o contexto da refeição sem transformar a postura em mero «sentar-se».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome «Jesus» explicita o referente de αὐτόν ao iniciar a segunda frase, evitando a ambiguidade pouco natural de uma sequência de pronomes em português. A divisão em duas frases melhora a fluidez sem alterar a sequência narrativa.
