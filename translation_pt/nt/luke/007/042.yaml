  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: pt
  text: Como eles não tinham com que pagar, ele perdoou generosamente a dívida de ambos[a]. Então, qual deles o amará mais?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cancelou as dívidas de ambos”. O verbo grego pode denotar conceder livremente ou remitir o que é devido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Como eles não tinham com que pagar
  rationale: A construção absoluta expressa a circunstância explicativa de não possuírem recursos para quitar o que deviam. A formulação é natural em português e mantém o contexto financeiro.
- source_word: ἀμφοτέροις
  choice: de ambos
  rationale: Refere-se de modo inequívoco aos dois devedores mencionados no contexto.
- source_word: ἐχαρίσατο
  choice: perdoou generosamente a dívida
  rationale: No contexto, o verbo denota remissão gratuita do que era devido. “Perdoou a dívida” preserva a ligação entre dívida e perdão, enquanto “generosamente” comunica a ideia de favor gratuito presente no verbo.
- source_word: τίς οὖν αὐτῶν
  choice: Então, qual deles
  rationale: “Então” preserva a inferência marcada por οὖν em português corrente.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: o amará mais
  rationale: Reproduz diretamente o futuro de ἀγαπάω e o comparativo πλεῖον, mantendo a conexão temática com o amor.
theological_decisions:
- issue: Sentido de χαρίζομαι na parábola sobre dívidas
  choice: perdoou generosamente a dívida de ambos
  alternative: cancelou a dívida de ambos
  rationale: A situação imediata é financeira, mas a parábola também ilumina o perdão e o amor no contexto mais amplo. A escolha conserva tanto a remissão da dívida quanto a nuance de favor gratuito, sem impor uma formulação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Ter com que pagar” comunica de forma idiomática a falta de recursos; “perdoar a dívida” mantém explícito o cenário da parábola.
