  - severity: low
    issue: «enviou até Jesus»
    rationale: Embora compreensível, a construção é menos natural para o envio de pessoas a um destinatário. «Enviou a Jesus anciãos dos judeus» comunica diretamente a construção ἀπέστειλεν πρὸς αὐτόν.
