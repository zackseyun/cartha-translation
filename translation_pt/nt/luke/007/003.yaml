  source_fidelity: A estrutura central é preservada, incluindo a sequência ouvir–enviar–pedir e a amplitude de «salvar» para διασώσῃ. Contudo, «alguns líderes» introduz uma indefinição quantitativa e uma especificação funcional que o grego não exige. πρεσβυτέρους designa «anciãos» neste contexto; a nota pode esclarecer, se necessário, que não se trata meramente de idade.
  naturalness: O texto é claro, mas «enviou até Jesus alguns líderes» é menos idiomático e mais impreciso do que «enviou a Jesus anciãos dos judeus». «Pedindo-lhe que fosse salvar» é uma formulação natural, com referente claro.
  terminology: «Escravo» é uma boa escolha para δοῦλος neste contexto e a nota registra adequadamente «servo» como alternativa. «Anciãos dos judeus» mantém o termo de liderança comunitária sem substituir o vocabulário do texto por «líderes».
