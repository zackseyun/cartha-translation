source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his slave.
translation:
  language: pt
  text: Quando ouviu falar de Jesus, enviou a Jesus anciãos dos judeus, pedindo-lhe que fosse salvar seu escravo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo grego doulos pode significar “servo” ou “escravo”, conforme o contexto; aqui, “escravo” preserva a condição de sujeição indicada pelo termo.
    reason: Leitura alternativa e esclarecimento histórico-lexical.
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: Quando ouviu falar de Jesus
  rationale: O particípio aoristo apresenta a circunstância anterior à ação principal. A construção temporal é natural em português; δέ funciona como conexão leve e não requer tradução explícita.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ele enviou até Jesus
  rationale: O pronome foi explicitado como “Jesus” para evitar que “até ele” soe ambíguo em português, sem acrescentar informação ao referente do texto.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: alguns líderes dos judeus
  rationale: πρεσβύτεροι designa aqui homens reconhecidos como dirigentes da comunidade, não apenas pessoas idosas. “Alguns” reflete a ausência do artigo sem exigir que fossem todos os líderes.
- source_word: ἐρωτῶν αὐτὸν ὅπως ἐλθὼν
  choice: pedindo-lhe que viesse
  rationale: A formulação expressa naturalmente o pedido transmitido pelos líderes e preserva a referência a Jesus como aquele que deveria ir.
- source_word: διασώσῃ
  choice: salvar
  rationale: O verbo pode significar salvar, resgatar ou fazer passar em segurança e, neste contexto, inclui a recuperação de uma enfermidade grave. “Salvar” conserva sua amplitude sem reduzi-lo simplesmente a “curar”.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: seu escravo
  rationale: δοῦλος indica uma pessoa em condição de sujeição e propriedade no contexto doméstico do centurião. “Escravo” preserva essa realidade social; a tradução tradicional “servo” é registrada em nota.
theological_decisions:
- issue: Tradução de δοῦλος no contexto doméstico do centurião
  choice: escravo
  alternative: servo
  rationale: O termo indica mais do que serviço voluntário e inclui a condição social de sujeição. “Escravo” evita ocultar essa realidade histórica, enquanto “servo” permanece uma possibilidade lexical e tradicional digna de nota.
- issue: Alcance de διασώσῃ na enfermidade
  choice: salvar
  alternative: curar
  rationale: Embora o contexto torne a cura física central, o verbo grego é mais amplo que “curar”. A escolha preserva essa amplitude sem introduzir aqui um sentido técnico de salvação espiritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Jesus” elimina uma ambiguidade pronominal possível. “Líderes dos judeus” comunica a função comunitária de πρεσβύτεροι com mais clareza para leitores comuns do que o uso isolado de “anciãos”.
