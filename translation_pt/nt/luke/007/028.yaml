id: LUK.7.28
reference: Luke 7:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: pt
  text: 'Eu lhes digo[a]: entre os nascidos de mulher[b], ninguém é maior do que João; contudo, o menor[c] no reino de Deus é maior do que ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Eu digo a vocês”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “nascidos de mulher” refere-se aos seres humanos em geral.
    reason: cultural_note
  - marker: c
    text: Ou “aquele que é o menor”. A expressão grega também pode ser explicitada dessa maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Mantém a fórmula discursiva direta e o presente do grego em português natural e digno.
- source_word: μείζων
  choice: maior
  rationale: Preserva a força comparativa sem definir em que sentido consiste a grandeza.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: entre os nascidos de mulher
  rationale: Conserva o idiomatismo semítico e continua compreensível como referência aos seres humanos em geral.
- source_word: Ἰωάννου
  choice: João
  rationale: Emprega a forma portuguesa tradicional do nome.
- source_word: οὐδείς ἐστιν
  choice: ninguém é
  rationale: Expressa naturalmente em português a declaração comparativa.
- source_word: ὁ δὲ μικρότερος
  choice: contudo, o menor
  rationale: O artigo com o comparativo tem valor substantivado; «o menor» preserva a concisão e o contraste, enquanto «contudo» comunica a força adversativa de δέ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no reino de Deus
  rationale: Tradução corrente que preserva tanto a expressão bíblica familiar quanto o sentido locativo.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: é maior do que ele
  rationale: Mantém João como termo da comparação e evita uma formulação pronominal ambígua ou pouco natural.
theological_decisions:
- issue: Sentido da comparação entre João e «o menor» no reino de Deus
  choice: Preservar a comparação paradoxal sem explicar a natureza da grandeza.
  alternative: Interpretar «maior» especificamente como maior privilégio na história da redenção, superioridade moral ou espiritual, ou posição de honra.
  rationale: O grego não especifica em que aspecto o menor no reino é maior que João; explicitar um aspecto resolveria indevidamente a tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é digna e direta; preserva o idiomatismo «nascidos de mulher» e a ambiguidade teológica de «maior».
