- from: 'Por essa razão, eu lhe digo: os muitos pecados dela foram perdoados, porque ela amou muito.[a] Mas aquele a quem pouco se perdoa pouco ama.'
  to: 'Por essa razão, eu lhe digo: os seus muitos pecados estão perdoados, porque ela amou muito.[a] Mas aquele a quem pouco se perdoa, pouco ama.'
  rationale: A revisão conserva a relação causal explicitamente marcada por “porque”, sem resolver a tensão interpretativa no texto principal. “Estão perdoados” torna mais visível o estado resultante do perfeito passivo grego. A nota foi ajustada para distinguir uma explicação contextual de sentido de uma tradução alternativa estritamente literal e para não reescrever a sintaxe grega como se “portanto” fosse seu equivalente direto.
