source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: pt
  text: 'Por essa razão, eu lhe digo: os seus muitos pecados estão perdoados, porque ela amou muito.[a] Mas aquele a quem pouco se perdoa, pouco ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto ao sentido: “Por isso ela amou muito.” A construção grega pode ser entendida, à luz do contexto, como apresentando o amor dela como evidência de que seus pecados foram perdoados, e não como a causa do perdão.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Por essa razão
  rationale: Expressão causal ou inferencial idiomática que mantém a ligação com o contexto em português natural.
- source_word: ἀφέωνται
  choice: foram perdoados
  rationale: O perfeito passivo indica uma ação consumada cujos resultados permanecem; no contexto, a forma portuguesa comunica o perdão já concedido.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: os muitos pecados dela
  rationale: Preserva a ênfase na grande quantidade de pecados com uma construção clara e corrente.
- source_word: ὅτι
  choice: porque
  rationale: Mantém o valor causal explícito do grego e sua tensão interpretativa, sem substituí-lo por uma conclusão teológica na tradução.
- source_word: ἠγάπησεν πολύ
  choice: ela amou muito
  rationale: Reproduz de modo direto o aoristo e conserva a linguagem bíblica fundamental do amor.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: Mas aquele a quem pouco se perdoa
  rationale: Expressa naturalmente a construção relativa genérica e o presente passivo, sem acrescentar uma especificidade masculina ao referente.
- source_word: ὀλίγον ἀγαπᾷ
  choice: pouco ama
  rationale: Mantém o paralelismo conciso entre pouco perdão e pouco amor.
theological_decisions:
- issue: Se ὅτι apresenta o amor da mulher como causa meritória do perdão
  choice: Traduzir ὅτι por “porque”, preservando a formulação causal e a tensão do texto.
  alternative: Parafrasear como “portanto, ela amou muito”, apresentando o amor como evidência ou resultado do perdão.
  rationale: A parábola anterior e o v. 50 favorecem entender o amor como resposta ou evidência do perdão, mas o próprio versículo usa uma conjunção normalmente causal. A tradução mantém essa forma, enquanto a nota registra a leitura contextual alternativa sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eu lhe digo” evita regionalismo excessivo; “aquele a quem” funciona aqui como expressão genérica. A ordem “pouco ama” preserva o paralelismo e o tom proverbial.
