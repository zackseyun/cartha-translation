review_pass:
  verdict: revise
  source_fidelity: 'A tradução principal preserva adequadamente οὗ χάριν, o perfeito passivo ἀφέωνται, o valor causal de ὅτι e o paralelismo final. Contudo, “foram perdoados” tende a perder o resultado presente expresso pelo perfeito grego; “têm sido perdoados”/“foram perdoados” não é ideal, e “foram perdoados” é aceitável mas menos preciso que “estão perdoados” ou “têm sido perdoados”. Em português natural, “estão perdoados” comunica melhor o estado resultante sem afirmar uma duração processual. A nota alternativa atual altera indevidamente a ordem e a relação sintática: não é uma tradução alternativa segura de toda a frase e introduz “portanto” como se fosse equivalente direta de ὅτι.'
  naturalness: O texto é claro, moderno e de registro apropriado. “Os muitos pecados dela” é compreensível, mas “os seus muitos pecados” soa mais natural em português contemporâneo e mantém a referência. “Aquele a quem pouco se perdoa pouco ama” é correto, embora uma vírgula antes de “pouco ama” favoreça a leitura.
  terminology: “Pecados”, “perdoados” e “amou muito” são escolhas estabelecidas e adequadas. “Estão perdoados” representa de modo mais fiel e idiomático o perfeito passivo neste contexto.
  issues:
  - severity: medium
    issue: O perfeito passivo ἀφέωνται é vertido apenas como “foram perdoados”.
    rationale: Embora possível, o pretérito perfeito português destaca principalmente o ato passado e enfraquece o estado presente resultante do perfeito grego. “Estão perdoados” expressa naturalmente o perdão já concedido e vigente.
  - severity: medium
    issue: A formulação alternativa da nota não é uma alternativa tradutória segura.
    rationale: “Portanto, ela amou muito” substitui a relação expressa por ὅτι e reorganiza a frase de modo que não corresponde diretamente à sintaxe grega. A nota deve explicar que, no contexto, “porque ela amou muito” pode ser entendido como evidência do perdão, sem apresentar uma pseudoalternativa como se fosse tradução literal.
  revised_text: 'Por essa razão, eu lhe digo: os seus muitos pecados estão perdoados, porque ela amou muito.[a] Mas aquele a quem pouco se perdoa, pouco ama.'
