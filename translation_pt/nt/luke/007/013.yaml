source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: pt
  text: 'Quando o Senhor a viu, foi movido de compaixão por ela e lhe disse: “Não chore.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não fique chorando” ou “Pare de chorar”. O grego pode ser entendido tanto como uma proibição geral quanto como uma ordem para que ela cesse o pranto que já estava em curso.
    reason: alternativa lexical e nuance aspectual
lexical_decisions:
- source_word: ἰδὼν
  choice: quando ... viu
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a oração temporal é natural em português e preserva essa relação.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Em Lucas, κύριος funciona aqui como título cristológico de Jesus; “Senhor” preserva esse uso sem reduzi-lo a simples tratamento de autoridade.
- source_word: ἐσπλαγχνίσθη
  choice: foi movido de compaixão
  rationale: O verbo expressa compaixão profunda e interior; esta formulação mantém sua força afetiva em linguagem digna e compreensível.
- source_word: ἐπ’ αὐτῇ
  choice: por ela
  rationale: Com σπλαγχνίζομαι, a construção indica a pessoa que é alvo da compaixão; “por ela” é idiomático em português.
- source_word: εἶπεν αὐτῇ
  choice: lhe disse
  rationale: Reproduz de modo conciso e natural o sentido de “disse a ela”, sem acrescentar conteúdo ao ato de fala.
- source_word: Μὴ κλαῖε
  choice: Não chore
  rationale: κλαίω significa chorar ou prantear. O presente imperativo com μή pode ser uma proibição geral ou uma ordem para cessar a ação já em curso; “Não chore” preserva ambas as possibilidades melhor que “Pare de chorar”.
theological_decisions:
- issue: κύριος como título de Jesus
  choice: o Senhor
  alternative: o mestre
  rationale: O narrador emprega um título elevado para Jesus. “O Senhor” conserva a dimensão cristológica do texto, enquanto “o mestre” restringiria indevidamente o alcance do termo.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Não chore” é mais corrente que “Não pranteie”, enquanto a nota preserva a possível nuance de interrupção do lamento presente.
