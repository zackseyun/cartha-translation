  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: pt
  text: Mas o que vocês foram ver? Um profeta? Sim, eu lhes digo, e mais do que um profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o contraste com a pergunta retórica anterior e funciona como transição natural em português.
- source_word: τί
  choice: o que
  rationale: Pronome interrogativo neutro como objeto de «ver»; aqui pergunta pelo que foram ver, não pelo motivo da saída.
- source_word: ἐξήλθατε ἰδεῖν
  choice: vocês foram ver
  rationale: Expressa de modo natural em português a ação passada de sair com a finalidade de ver; «foram ver» deixa o movimento implícito sem perder o sentido contextual.
- source_word: προφήτην
  choice: Um profeta
  rationale: Substantivo comum no acusativo, empregado elipticamente na pergunta retórica.
- source_word: ναί
  choice: Sim
  rationale: Resposta afirmativa direta e enfática à pergunta retórica.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Fórmula discursiva natural e digna, mantendo a referência explícita aos ouvintes.
- source_word: καὶ
  choice: e
  rationale: Preserva a coordenação e a progressão enfática do grego sem acrescentar interpretação.
- source_word: περισσότερον προφήτου
  choice: mais do que um profeta
  rationale: Reproduz de forma idiomática o comparativo com genitivo e mantém aberta a natureza exata da superioridade declarada.
theological_decisions:
- issue: Identidade e posição de João Batista na descrição de Jesus
  choice: Jesus afirma que João é profeta e mais do que um profeta, sem definir neste versículo em que consiste essa superioridade.
  alternative: Explicitar que João é o maior profeta ou identificar aqui sua função específica de mensageiro escatológico.
  rationale: A formulação concisa do texto deve ser preservada; o contexto imediato oferece explicação adicional, mas ela não deve ser inserida neste versículo.
translation_notes:
  register: Português moderno, corrente e digno, com «vocês» para o plural e «lhes» como complemento indireto. A tradução evita linguagem arcaica e preserva a concisão e a tensão teológica do original.
