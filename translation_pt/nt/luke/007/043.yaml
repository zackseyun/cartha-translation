source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: pt
  text: 'Simão respondeu: “Suponho que aquele a quem ele perdoou mais.”[a] Ele lhe disse: “Você julgou corretamente.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele para quem ele cancelou uma dívida maior”. O verbo grego pode indicar a remissão graciosa de uma dívida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: respondeu
  rationale: A construção com particípio aoristo e verbo finito introduz idiomaticamente uma resposta; em português natural, um único verbo finito transmite o sentido sem perda.
- source_word: Ὑπολαμβάνω
  choice: Suponho
  rationale: Expressa uma inferência cautelosa, sem a certeza mais forte que outras formulações poderiam sugerir.
- source_word: ᾧ τὸ πλεῖον
  choice: aquele a quem ele ... mais
  rationale: Mantém a estrutura de objeto indireto do pronome relativo dativo e verte τὸ πλεῖον de modo idiomático como “mais”.
- source_word: ἐχαρίσατο
  choice: perdoou
  rationale: No contexto imediato da parábola dos devedores, o verbo indica a remissão graciosa de uma dívida; “perdoou” também preserva a ligação lexical e temática com o perdão no restante da passagem.
- source_word: Ὀρθῶς
  choice: corretamente
  rationale: Transmite de modo claro e atual a avaliação positiva da resposta de Simão.
- source_word: ἔκρινας
  choice: julgou
  rationale: Preserva o sentido básico de κρίνω e se refere à avaliação que Simão acaba de fazer.
theological_decisions:
- issue: Natureza da linguagem de perdão na parábola
  choice: perdoou
  alternative: cancelou uma dívida maior
  rationale: O contexto é de remissão de dívida e prepara a aplicação aos pecados da mulher. “Perdoou” preserva essa conexão sem acrescentar uma formulação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Suponho” conserva a cautela da resposta; “você” oferece naturalidade contemporânea sem tornar o registro coloquial.
