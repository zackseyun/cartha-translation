id: LUK.7.32
reference: Luke 7:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: pt
  text: 'Eles são como crianças sentadas na praça, chamando umas às outras e dizendo: “Tocamos flauta para vocês, mas vocês não dançaram; entoamos uma lamentação[a], mas vocês não choraram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entoamos um canto fúnebre” ou “lamentamos”. O verbo grego pode indicar a execução de uma lamentação, inclusive fúnebre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Eles são como
  rationale: Expressão comparativa direta e natural em português, preservando a introdução da analogia.
- source_word: παιδίοις
  choice: crianças
  rationale: Termo amplo e corrente, sem especificar indevidamente idade ou sexo.
- source_word: ἐν ἀγορᾷ
  choice: na praça
  rationale: ἀγορά designa aqui o espaço público da cidade, que podia incluir atividades comerciais; “praça” comunica melhor esse cenário no português moderno do que o possível sentido restrito de “mercado”.
- source_word: καθημένοις
  choice: sentadas
  rationale: Reproduz de modo simples o particípio que descreve a postura das crianças.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: chamando umas às outras
  rationale: Preserva tanto a ideia de chamar em voz alta quanto o sentido recíproco de ἀλλήλοις.
- source_word: ἃ λέγει
  choice: e dizendo
  rationale: Solução idiomática para a construção textual difícil, cujo pronome neutro plural e verbo singular têm sentido coletivo; evita uma concordância artificial em português.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Tocamos flauta para vocês
  rationale: αὐλέω indica especificamente tocar flauta ou instrumento de sopro semelhante; a formulação é clara e concreta.
- source_word: οὐκ ὠρχήσασθε
  choice: vocês não dançaram
  rationale: Tradução direta do aoristo, sem impor nuance aspectual não exigida pelo contexto.
- source_word: ἐθρηνήσαμεν
  choice: entoamos uma lamentação
  rationale: Preserva o caráter performativo de θρηνέω e o contraste com tocar flauta, podendo evocar um lamento fúnebre sem restringir o sentido no texto principal.
- source_word: οὐκ ἐκλαύσατε
  choice: vocês não choraram
  rationale: Equivalente atual e natural de κλαίω; mantém a reação concreta esperada diante da lamentação.
theological_decisions:
- issue: Preservação da força parabólica das ações contrastantes das crianças
  choice: 'Manter as ações concretas: tocar flauta, dançar, entoar uma lamentação e chorar'
  alternative: Interpretar as ações como celebrar e ficar de luto
  rationale: O versículo apresenta a imagem, não sua explicação. A linguagem concreta conserva a abertura interpretativa e evita antecipar a aplicação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Praça” representa o espaço público da ἀγορά sem reduzi-lo a um estabelecimento comercial. “Vocês” evita regionalismo e mantém clareza para o plural.
