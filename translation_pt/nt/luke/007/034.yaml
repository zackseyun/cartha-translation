reference: Luke 7:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: pt
  text: 'O Filho do Homem veio comendo e bebendo, e vocês dizem: “Vejam! Um homem comilão e beberrão, amigo de cobradores de impostos e pecadores!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: veio
  rationale: O perfeito grego apresenta a vinda do Filho do Homem como fato consumado com relevância presente. Em português, o pretérito perfeito simples é a forma natural neste contexto; “tem vindo” sugeriria ação repetida ou contínua.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva a forma consagrada da autodesignação de Jesus e suas possíveis ressonâncias bíblicas, sem paráfrase interpretativa.
- source_word: ἐσθίων καὶ πίνων
  choice: comendo e bebendo
  rationale: Reproduz naturalmente os particípios que indicam a maneira ou circunstância de sua vinda, em contraste com a conduta de João.
- source_word: λέγετε
  choice: vocês dizem
  rationale: O presente do indicativo dirigido a um grupo é expresso de modo corrente e amplamente compreensível em português.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Mantém a força exclamativa e de chamada de atenção do grego em linguagem moderna, concordando com os destinatários plurais.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Mantém explícito o substantivo presente no grego, formando uma acusação natural em português.
- source_word: φάγος
  choice: comilão
  rationale: Expressa de forma idiomática e depreciativa a acusação de alguém que come em excesso.
- source_word: οἰνοπότης
  choice: beberrão
  rationale: Preserva o caráter pejorativo da acusação; a tradução mais literal “bebedor de vinho” seria menos natural e poderia enfraquecer o insulto.
- source_word: φίλος
  choice: amigo
  rationale: A aposição sem artigo é natural em português e conserva a sequência das acusações.
- source_word: τελωνῶν
  choice: cobradores de impostos
  rationale: Equivalente moderno, claro e corrente para agentes de arrecadação fiscal.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Tradução direta que preserva o rótulo social e religioso empregado pelos críticos de Jesus.
theological_decisions:
- issue: Tradução do título ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A formulação tradicional preserva a função titular, a reconhecibilidade cristológica e possíveis ecos de Daniel, sem resolver sua tensão interpretativa.
- issue: Força das acusações contra Jesus
  choice: um homem comilão e beberrão
  alternative: um homem glutão e bebedor de vinho
  rationale: O texto relata uma calúnia hostil, não endossa o juízo. Termos idiomáticos e fortes conservam o tom insultuoso do original, enquanto a presença de “um homem” mantém a forma grega explícita.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Vocês” evita regionalismo excessivo; “cobradores de impostos” é transparente. A fala acusatória conserva sua aspereza sem linguagem arcaica.
