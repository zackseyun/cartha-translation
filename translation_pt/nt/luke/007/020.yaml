  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: pt
  text: 'Quando os homens chegaram a ele, disseram: “João Batista nos enviou ao senhor com esta pergunta: ‘O senhor é aquele que há de vir[a], ou devemos esperar outro?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que vem”.'
    reason: Alternativa lexical que reproduz mais diretamente o particípio presente grego, enquanto o texto principal expressa sua orientação esperada ou futura no contexto.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Quando os homens chegaram até ele
  rationale: O particípio aoristo introduz a circunstância anterior à fala. A construção temporal é natural em português e mantém o movimento em direção a Jesus.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: O substantivo ἀνήρ identifica especificamente os mensageiros do sexo masculino; não é necessário acrescentar informação ausente do versículo.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: João Batista
  rationale: É a forma tradicional, corrente e amplamente compreendida em português.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: nos enviou ao senhor para perguntar
  rationale: A formulação comunica naturalmente em português que eles foram enviados a Jesus com a pergunta de João, sem obscurecer o conteúdo da missão.
- source_word: Σὺ εἶ
  choice: O senhor é
  rationale: A repetição de “o senhor” preserva a ênfase do pronome grego σύ e oferece uma forma respeitosa e natural de tratamento em português moderno.
- source_word: ὁ ἐρχόμενος
  choice: aquele que há de vir
  rationale: A expressão preserva tanto o sentido verbal quanto sua ressonância como designação esperada, sem explicitar no texto uma identificação teológica além do grego.
- source_word: ἄλλον προσδοκῶμεν
  choice: devemos esperar outro
  rationale: “Esperar” abrange a expectativa pela chegada de alguém, e “outro” reproduz de modo conciso o objeto masculino do grego.
theological_decisions:
- issue: Força messiânica de ὁ ἐρχόμενος
  choice: aquele que há de vir
  alternative: aquele que vem
  rationale: A opção principal conserva a expectativa futura e a possível força titular da expressão, mas sem inserir “Messias” nem resolver explicitamente a identidade em questão. A alternativa mais literal no aspecto verbal é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Emprega “o senhor” como tratamento respeitoso dirigido a Jesus, evitando tanto o arcaísmo de “tu és” quanto a excessiva informalidade de “você” neste contexto.
