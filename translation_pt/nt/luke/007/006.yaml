  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: pt
  text: 'Jesus foi com eles. Quando já não estava longe da casa, o centurião enviou amigos para lhe dizerem: “Senhor[a], não se incomode, pois não sou digno[b] de que entre sob o meu teto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, como simples tratamento respeitoso, “senhor”. O grego kýrie pode funcionar como forma cortês de tratamento e também pode indicar reconhecimento da autoridade de Jesus.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “apto” ou “adequado”. O termo grego pode indicar capacidade, adequação ou dignidade; aqui expressa a humildade do centurião diante de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: foi
  rationale: O imperfeito descreve o deslocamento de Jesus; “foi” é a forma narrativa mais natural em português, sem excluir a ideia de que ele estava a caminho.
- source_word: σὺν αὐτοῖς
  choice: com eles
  rationale: Reproduz diretamente a ideia de acompanhamento.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: Quando já não estava longe da casa
  rationale: A construção temporal preserva a formulação negativa do grego e expressa com naturalidade que Jesus já se encontrava perto da casa.
- source_word: ἔπεμψεν φίλους
  choice: enviou amigos
  rationale: Mantém o verbo de envio e o plural anartro φίλους sem acrescentar necessariamente “alguns”.
- source_word: ὁ ἑκατοντάρχης
  choice: o centurião
  rationale: É a designação portuguesa tradicional e precisa para esse oficial do exército romano.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto a possível percepção da autoridade de Jesus, sem decidir além do que o contexto permite.
- source_word: μὴ σκύλλου
  choice: não se incomode
  rationale: Expressa de modo corrente e respeitoso o sentido idiomático de não se dar trabalho ou não se molestar.
- source_word: ἱκανός εἰμι
  choice: não sou digno
  rationale: No contexto, o centurião manifesta humildade e reconhece não ser digno ou adequado para receber Jesus em sua casa.
- source_word: ἵνα ... εἰσέλθῃς
  choice: de que entre
  rationale: A oração com subjuntivo comunica naturalmente em português o conteúdo daquilo para o qual o centurião não se considera digno.
- source_word: ὑπὸ τὴν στέγην μου
  choice: sob o meu teto
  rationale: Conserva a imagem concreta do grego, usada para se referir à entrada na casa de alguém.
theological_decisions:
- issue: Sentido de κύριος como vocativo dirigido a Jesus
  choice: Senhor
  alternative: senhor, como simples tratamento respeitoso
  rationale: O vocativo pode ser uma fórmula de respeito e também pode sugerir reconhecimento da autoridade de Jesus. “Senhor” conserva essa amplitude sem transformar necessariamente a fala numa confissão cristológica plena.
- issue: Nuance de ἱκανός na declaração do centurião
  choice: digno
  alternative: apto ou adequado
  rationale: “Digno” comunica melhor a humildade relacional do centurião, enquanto a nota preserva a amplitude lexical do termo grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita regionalismos marcados, conserva a imagem “sob o meu teto” e mantém abertas as nuances de “Senhor” e “digno” por meio de notas.
