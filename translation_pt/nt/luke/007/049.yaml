id: LUK.7.49
reference: Luke 7:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: pt
  text: 'E os que estavam reclinados à mesa com ele começaram a dizer entre si[a]: “Quem é este que até perdoa pecados?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dizer consigo mesmos”. A expressão grega pode indicar tanto reflexão íntima quanto conversa entre os convidados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: começaram
  rationale: Preserva a força ingressiva do aoristo de ἄρχω com infinitivo e soa natural em português atual.
- source_word: οἱ συνανακείμενοι
  choice: os que estavam reclinados à mesa com ele
  rationale: Explicita a postura antiga nas refeições e preserva tanto o cenário da mesa quanto a ideia de companhia expressa pelo prefixo συν-.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: dizer entre si
  rationale: A expressão pode indicar reflexão interior ou conversa mútua; no plural e nesse contexto social, “entre si” preserva melhor a ambiguidade, esclarecida em nota.
- source_word: Τίς οὗτός ἐστιν
  choice: Quem é este
  rationale: Mantém a formulação direta e abrupta do grego sem acrescentar “homem”, termo ausente no texto-fonte.
- source_word: καὶ
  choice: até
  rationale: Aqui καί tem força ascensiva e expressa surpresa diante do alcance da ação atribuída a Jesus.
- source_word: ἁμαρτίας ἀφίησιν
  choice: perdoa pecados
  rationale: É a equivalência portuguesa clara e consagrada para o uso de ἀφίημι nesse contexto, preservando sua relevância teológica.
theological_decisions:
- issue: Implicação da autoridade de Jesus para perdoar pecados
  choice: 'Manter a pergunta dos convidados sem explicação interpretativa: “Quem é este que até perdoa pecados?”'
  alternative: “Quem é este homem que até perdoa pecados?”
  rationale: O versículo suscita uma questão cristológica, mas não oferece aqui uma conclusão explícita. A tradução conserva a surpresa e a tensão teológica sem inserir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Reclinados à mesa” preserva o dado cultural antigo sem tornar a frase excessivamente técnica; “até” comunica naturalmente o espanto expresso por καί.
