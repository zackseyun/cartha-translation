source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: pt
  text: E eis que uma mulher que estava na cidade e era pecadora[a], ao saber que ele estava reclinado à mesa na casa do fariseu[b], trouxe um frasco de alabastro com perfume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz apenas “pecadora” e não especifica qual era o pecado dela.
    reason: lexical_alternative
  - marker: b
    text: Isto é, reclinado segundo o costume adotado nas refeições formais daquela época.
    reason: cultural_note
  - marker: c
    text: Ou “um recipiente de alabastro com óleo perfumado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função discursiva de introduzir a mulher de modo vívido e surpreendente, em linguagem bíblica ainda compreensível.
- source_word: γυνὴ ἥτις ἦν ἐν τῇ πόλει
  choice: uma mulher daquela cidade
  rationale: Expressa com naturalidade a ligação da mulher com a cidade, sem acrescentar que fosse conhecida ali ou especificar há quanto tempo vivia nela.
- source_word: ἁμαρτωλός
  choice: pecadora
  rationale: Mantém a caracterização moral explícita do grego, sem definir qual era o pecado nem adotar a identificação tradicional, porém não expressa, de prostituta.
- source_word: ἐπιγνοῦσα
  choice: ao saber
  rationale: Indica que ela tomou conhecimento da presença de Jesus antes de levar o frasco, com construção natural em português.
- source_word: κατάκειται
  choice: estava reclinado à mesa
  rationale: Comunica a postura antiga usada durante refeições formais, em vez de substituí-la pelo moderno 'sentado'.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: na casa do fariseu
  rationale: Tradução direta e idiomática que mantém a referência definida ao fariseu do contexto.
- source_word: κομίσασα
  choice: trouxe
  rationale: Verbo natural que expressa que a mulher levou consigo o recipiente.
- source_word: ἀλάβαστρον μύρου
  choice: um frasco de alabastro com perfume
  rationale: Identifica de forma acessível tanto o recipiente quanto seu conteúdo aromático, sem exigir que o leitor entenda 'alabastro' como formato em vez de material ou tipo de recipiente.
theological_decisions:
- issue: Caracterização moral da mulher
  choice: que era pecadora
  alternative: uma mulher de vida imoral; uma prostituta
  rationale: O grego a chama de ἁμαρτωλός, mas não informa a natureza do pecado. A tradução conserva essa indeterminação e evita importar uma identificação tradicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “E eis que” conserva a ênfase narrativa de Lucas; “reclinado à mesa” mantém o dado cultural sem modernizá-lo indevidamente. Os marcadores seguem a ordem em que aparecem no texto.
