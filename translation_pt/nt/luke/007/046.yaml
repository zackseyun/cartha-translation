  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: pt
  text: Você não ungiu a minha cabeça com óleo; ela, porém, ungiu os meus pés com perfume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com óleo perfumado” ou “com unguento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: com óleo
  rationale: O dativo indica o meio empregado. “Óleo” é natural e suficiente no contexto; especificar “azeite” seria possível, mas desnecessário.
- source_word: ἤλειψας / ἤλειψεν
  choice: ungiu / ungiu
  rationale: ἀλείφω descreve a aplicação de óleo ou unguento. “Ungir” preserva o paralelo entre a cortesia esperada e o gesto da mulher, sem acrescentar finalidade ritual.
- source_word: τὴν κεφαλήν μου
  choice: a minha cabeça
  rationale: Tradução direta do objeto acusativo com o pronome possessivo.
- source_word: αὕτη δὲ
  choice: ela, porém
  rationale: Mantém o contraste enfático entre o anfitrião e a mulher presente sem tornar a referência excessivamente marcada.
- source_word: μύρῳ
  choice: com perfume
  rationale: μύρον designa óleo perfumado ou unguento aromático. “Perfume” é claro, corrente e conserva o contraste com o óleo comum da primeira oração.
- source_word: τοὺς πόδας μου
  choice: os meus pés
  rationale: Tradução direta do objeto plural com o pronome possessivo.
theological_decisions:
- issue: Contraste de honra social na repreensão de Jesus
  choice: Expressar claramente o contraste entre a omissão do anfitrião e o gesto da mulher, sem atribuir explicitamente ao ato um sentido ritual.
  alternative: Usar linguagem mais cerimonial que sugira consagração formal.
  rationale: No contexto imediato, Jesus contrasta a hospitalidade não oferecida por Simão com a honra extraordinária demonstrada pela mulher. O verbo “ungir” é lexicalmente adequado, mas a formulação não deve impor simbolismo além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a pontuação realçam o contraste expresso por δέ; o marcador de nota aparece imediatamente após “perfume”.
