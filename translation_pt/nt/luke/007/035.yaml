translation:
  language: pt
  text: Mas a sabedoria teve sua razão comprovada por todos os seus filhos[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi justificada” ou “foi vindicada”.
    reason: lexical_alternative
  - marker: b
    text: “Filhos” é uma metáfora para aqueles que demonstram que a sabedoria é verdadeira por sua resposta ou modo de vida.
    reason: lexical_alternative
  - marker: c
    text: 'Em Mateus 11:19, lê-se: “a sabedoria teve sua razão comprovada por suas obras”.'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Mas
  rationale: Embora καί normalmente signifique “e”, aqui introduz um contraste com a rejeição incoerente descrita nos versículos anteriores; “Mas” expressa esse valor discursivo sem exagerá-lo.
- source_word: ἐδικαιώθη
  choice: foi reconhecida como justa
  rationale: O aoristo passivo de δικαιόω, neste contexto, indica que a sabedoria foi reconhecida ou confirmada como certa, não a justificação forense no sentido paulino. A formulação conserva a voz passiva e evita uma leitura técnica desnecessária.
- source_word: ἡ σοφία
  choice: a sabedoria
  rationale: Equivalente direto e corrente de σοφία; o substantivo feminino também preserva naturalmente a personificação em português.
- source_word: ἀπὸ πάντων
  choice: por todos
  rationale: Com o verbo passivo, ἀπό pode indicar o agente ou a fonte da confirmação. “Por todos” é a expressão idiomática correspondente em português.
- source_word: τῶν τέκνων
  choice: os filhos
  rationale: τέκνα significa literalmente “filhos” ou “crianças”. A tradução mantém a metáfora do texto de Lucas, sem substituí-la interpretativamente por “obras”, “resultados” ou “seguidores”.
- source_word: αὐτῆς
  choice: dela
  rationale: O pronome retoma σοφία, que é feminino. “Dela” torna explícita a relação com a sabedoria personificada e evita a possível ambiguidade do possessivo “seus”.
theological_decisions:
- issue: Sentido dos “filhos” da sabedoria
  choice: Manter literalmente a metáfora para aqueles que evidenciam a verdade da sabedoria por sua resposta ou modo de vida.
  alternative: Entender “filhos” como resultados ou frutos da sabedoria, ou harmonizar a expressão com “obras” em Mateus 11:19.
  rationale: O texto grego de Lucas traz τέκνων, “filhos”. Preservar a imagem mantém a ambiguidade e a tensão teológica do dito, em vez de determinar no texto principal quem ou o que esses filhos representam.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Foi reconhecida como justa” comunica o sentido público de confirmação sem importar terminologia doutrinária técnica; “filhos dela” conserva de modo explícito a personificação da sabedoria.
