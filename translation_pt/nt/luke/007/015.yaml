base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: pt
  text: E o morto sentou-se e começou a falar, e Jesus o entregou à sua mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus o entregou de volta à sua mãe” ou “Jesus o devolveu à sua mãe”. O grego diz simplesmente “o deu à sua mãe”; o sentido de restituição está implícito no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: sentou-se
  rationale: O verbo descreve o movimento de quem estava deitado para a posição sentada. “Sentou-se” é natural em português e não acrescenta ao sinal da ressurreição mais do que o grego afirma.
- source_word: ὁ νεκρός
  choice: o morto
  rationale: A expressão substantivada significa literalmente “o morto”. Em português, “o morto” é clara no contexto e evita o tom clínico de “o cadáver”.
- source_word: ἤρξατο λαλεῖν
  choice: começou a falar
  rationale: Reproduz naturalmente a construção ingressiva de ἄρχομαι com infinitivo e mantém um registro narrativo digno.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Jesus o entregou à sua mãe
  rationale: “Entregou” expressa de modo idiomático o ato de dar uma pessoa aos cuidados de outra. O sujeito implícito foi explicitado como “Jesus” para evitar, em português, que “o morto” seja entendido como sujeito; não se acrescentou “de volta” ao texto principal.
theological_decisions:
- issue: Se a tradução deve explicitar a restituição do filho à mãe com “de volta” ou “devolveu”
  choice: Manter “Jesus o entregou à sua mãe” no texto principal
  alternative: “Jesus o entregou de volta à sua mãe” / “Jesus o devolveu à sua mãe”
  rationale: O contexto implica claramente restituição após a ressurreição, mas o grego emprega simplesmente δίδωμι, sem partícula restaurativa explícita. A redação principal preserva essa contenção, e a nota registra as alternativas contextuais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “e” preserva o encadeamento narrativo do grego. “Jesus” explicita o sujeito apenas para impedir ambiguidade sintática indesejada em português.
