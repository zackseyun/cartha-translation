lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: O plural ἀνθρώπους refere-se aqui aos seres humanos ou ao povo da geração em questão, sem exigir o sentido restrito de indivíduos do sexo masculino; “as pessoas” é natural e semanticamente abrangente em português.
- source_word: τῆς γενεᾶς ταύτης
  choice: desta geração
  rationale: Reproduz de modo direto o demonstrativo e o genitivo do grego, preservando a referência aos contemporâneos de Jesus.
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: Com que se parecem?
  rationale: Expressa naturalmente em português a segunda pergunta comparativa, mantendo sua distinção retórica em relação à primeira.
