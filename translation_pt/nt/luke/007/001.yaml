  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: pt
  text: Depois de ter terminado de dizer todas as suas palavras aos ouvidos do povo, entrou em Cafarnaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Depois de
  rationale: Neste contexto, introduz uma oração temporal anterior à ação principal; «Depois de» expressa com naturalidade a sequência narrativa.
- source_word: ἐπλήρωσεν
  choice: terminar de dizer
  rationale: Com «palavras», πληρόω tem o sentido idiomático de completar o ato de falar, não de «cumprir».
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: todas essas palavras
  rationale: Mantém o substantivo ῥήματα e remete naturalmente, em português, ao discurso precedente; «essas» explicita a referência contextual de αὐτοῦ sem sugerir conteúdo diferente.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: diante do povo
  rationale: Expressa de modo corrente que as palavras foram pronunciadas na presença e ao alcance da audição do povo, evitando o pouco natural «aos ouvidos do povo».
- source_word: λαοῦ
  choice: povo
  rationale: Preserva o sentido coletivo de λαός sem especificá-lo indevidamente como mera multidão.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Equivalente direto, conciso e natural do verbo de movimento.
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
