  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: pt
  text: 'Quando chegaram a Jesus, pediram-lhe com insistência: “Ele merece que lhe concedas isso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: chegaram
  rationale: O particípio indica que eles chegaram à presença de Jesus; a oração temporal finita é natural em português.
- source_word: παρεκάλουν
  choice: suplicaram-lhe
  rationale: No contexto de um pedido respeitoso e intenso, “suplicaram” expressa a solicitação insistente sem perder a dignidade do tom.
- source_word: σπουδαίως
  choice: com insistência
  rationale: A expressão comunica empenho e intensidade de modo idiomático em português.
- source_word: Ἄξιός
  choice: merece
  rationale: Embora “é digno” seja formalmente próximo, “merece” transmite com naturalidade o juízo de que o centurião é merecedor do favor solicitado.
- source_word: ᾧ
  choice: lhe
  rationale: O pronome dativo retoma o centurião e funciona naturalmente como objeto indireto de “conceder”.
- source_word: παρέξῃ
  choice: concedas
  rationale: παρέχω pode significar proporcionar ou conceder; “concedas” combina com o tom deferente e com o favor solicitado.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo remete ao pedido mencionado no contexto; “isso” é a referência anafórica mais natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A colocação pronominal em “suplicaram-lhe” mantém tom literário moderado, enquanto “merece” evita rigidez excessiva.
