source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: pt
  text: 'Pois João Batista veio sem comer pão nem beber vinho, e vocês dizem: “Ele tem demônio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: veio
  rationale: O perfeito grego apresenta a vinda de João com relevância para a situação em pauta. Em português, o pretérito perfeito simples é a forma mais natural neste contexto; “tem vindo” sugeriria repetição ou continuidade indevida.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva de modo natural a ligação argumentativa.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: João Batista
  rationale: É a designação consagrada e imediatamente reconhecível em português; mantém o título histórico sem tornar a frase artificial.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: sem comer pão nem beber vinho
  rationale: Reproduz a descrição concreta do modo ascético de João, mantendo ἄρτον como “pão” em vez de generalizá-lo para “comida”.
- source_word: λέγετε
  choice: vocês dizem
  rationale: O presente exprime a reação característica dos ouvintes. “Vocês” oferece legibilidade ampla, especialmente brasileira, sem perder a referência plural.
- source_word: Δαιμόνιον ἔχει
  choice: Ele tem demônio
  rationale: Tradução direta da expressão grega, preservando a forma e a força da acusação sem explicá-la como possessão demoníaca.
theological_decisions:
- issue: Sentido de δαιμόνιον na acusação contra João
  choice: demônio
  alternative: espírito impuro
  rationale: δαιμόνιον significa “demônio” neste contexto. “Espírito impuro” traduziria uma expressão grega relacionada, mas diferente, e harmonizaria indevidamente a terminologia.
- issue: Forma de Δαιμόνιον ἔχει
  choice: Ele tem demônio
  alternative: Ele está possuído por um demônio
  rationale: A formulação direta mantém a ambiguidade e a retórica do original. A alternativa explicita uma interpretação possível, mas vai além da construção grega.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sintaxe é natural, mas conserva os elementos concretos “pão” e “vinho” e a acusação direta “tem demônio”.
