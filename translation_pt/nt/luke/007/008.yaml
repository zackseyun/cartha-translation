reference: Luke 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my slave, ‘Do this,’ and he does it.
translation:
  language: pt
  text: 'Pois eu também sou homem colocado sob autoridade e tenho soldados sob as minhas ordens. Digo a este: “Vá!”, e ele vai; a outro: “Venha!”, e ele vem; e ao meu escravo[a]: “Faça isto!”, e ele faz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo grego doulos designa uma pessoa em condição subordinada, vinculada ou pertencente a um senhor, embora em alguns contextos possa ser traduzido de modo mais geral como “servo”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a declaração anterior do centurião. “Pois” preserva de modo natural a força explicativa de γάρ sem traduzir καί de forma artificial.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: eu também sou homem
  rationale: O pronome explícito tem valor enfático, e καί comunica a comparação (“também”). “Homem” é natural e adequado ao referente masculino concreto.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: colocado sob autoridade
  rationale: Preserva o sentido passivo do particípio e a posição do centurião dentro de uma cadeia hierárquica de comando.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: tenho soldados sob as minhas ordens
  rationale: Expressa em português corrente a relação hierárquica indicada por ὑπ’ ἐμαυτόν, evitando a formulação pouco idiomática “sob mim”.
- source_word: λέγω τούτῳ
  choice: Digo a um
  rationale: Embora τούτῳ seja demonstrativo, “a um” é a forma natural em português na sequência correlativa “a um... a outro”, conservando a estrutura exemplificativa.
- source_word: Πορεύθητι / πορεύεται
  choice: “Vá!”, e ele vai
  rationale: Mantém de maneira simples e direta o paralelismo entre ordem e cumprimento.
- source_word: Ἔρχου / ἔρχεται
  choice: “Venha!”, e ele vem
  rationale: Reproduz o paralelismo verbal e a resposta imediata à ordem.
- source_word: τῷ δούλῳ μου
  choice: ao meu escravo
  rationale: δοῦλος designa aqui alguém em condição subordinada e vinculada ao senhor; essa condição reforça a ilustração sobre autoridade. A alternativa “servo” é registrada em nota.
- source_word: Ποίησον τοῦτο / ποιεῖ
  choice: “Faça isto!”, e ele faz
  rationale: Preserva a correspondência direta entre a ordem e sua execução.
theological_decisions:
- issue: Tradução de δοῦλος na analogia do centurião
  choice: escravo
  alternative: servo
  rationale: A condição de sujeição é relevante para a cadeia de autoridade descrita. “Escravo” explicita a realidade social do termo, enquanto “servo” continua sendo uma tradução possível em certos contextos e por isso aparece na nota, sem transformar o versículo numa afirmação doutrinária sobre a escravidão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “sob as minhas ordens” por naturalidade, preserva a estrutura paralela das ordens e mantém “escravo” no texto com a alternativa “servo” em nota.
