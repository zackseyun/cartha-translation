id: LUK.7.17
reference: Luke 7:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: pt
  text: E essa notícia a respeito dele se espalhou por toda a Judeia e por toda a região ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «esse relato a respeito dele» ou «essa palavra a respeito dele».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se espalhou
  rationale: Embora o sentido literal seja «saiu», neste contexto de circulação de uma notícia o português natural pede «se espalhou», preservando a ideia de ampla difusão.
- source_word: ὁ λόγος οὗτος
  choice: essa notícia
  rationale: Aqui λόγος designa o relato ou notícia sobre o que Jesus havia feito, e não uma única palavra pronunciada.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: por toda a Judeia
  rationale: A expressão transmite alcance distributivo por toda a região e é idiomática em português com «se espalhou».
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: Traduz naturalmente περί com genitivo e mantém Jesus como referente sem acrescentar interpretação.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: por toda a região ao redor
  rationale: περίχωρος substantivado indica a área circundante; a formulação é clara, atual e geograficamente não excessiva.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: A coordenação cumulativa das duas áreas geográficas é preservada por meio da repetição simples da conjunção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Se espalhou» expressa naturalmente o movimento idiomático da notícia, enquanto a nota preserva a amplitude lexical de λόγος.
