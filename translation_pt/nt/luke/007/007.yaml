  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: pt
  text: Por isso, nem sequer me considerei digno de ir até você. Mas diga uma palavra, e que meu servo[a] seja curado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu menino” ou “minha criança”; a palavra grega pode referir-se a uma criança, um jovem ou um servo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a inferência em relação à declaração anterior.
- source_word: οὐδὲ
  choice: nem sequer
  rationale: Reforça a negação e preserva a ideia de que o centurião não se julgou digno nem mesmo de comparecer pessoalmente.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: me considerei digno
  rationale: Reproduz o sentido reflexivo de considerar a si mesmo digno ou merecedor.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: ir até ti
  rationale: Comunica claramente o movimento em direção a Jesus; em português, do ponto de vista de quem fala, 'ir até ti' é mais natural do que 'vir a ti'.
- source_word: ἀλλὰ
  choice: Mas
  rationale: Introduz diretamente o pedido que contrasta com a recusa do centurião em comparecer pessoalmente.
- source_word: εἰπὲ λόγῳ
  choice: dize uma palavra
  rationale: Preserva a ausência de artigo no grego e comunica que uma simples palavra autoritativa de Jesus bastaria.
- source_word: ἰαθήτω
  choice: que ... seja curado
  rationale: Mantém a força do imperativo passivo aoristo, em vez de transformá-lo silenciosamente em uma afirmação futura.
- source_word: ὁ παῖς μου
  choice: o meu servo
  rationale: No contexto da casa e da autoridade do centurião, 'servo' é a opção mais clara, embora o termo também possa designar menino, jovem ou filho, ambiguidade registrada em nota.
theological_decisions:
- issue: Sentido de παῖς no relato do centurião
  choice: o meu servo
  alternative: o meu menino; o meu filho
  rationale: O contexto favorece uma relação de serviço sob a autoridade do centurião, mas o termo grego possui amplitude semântica e pode conter uma nuance etária, familiar ou afetiva; por isso, as alternativas são preservadas em nota.
- issue: Força verbal de ἰαθήτω
  choice: que ... seja curado
  alternative: será curado
  rationale: A forma grega é um imperativo passivo, não um indicativo futuro. A tradução mantém o pedido dirigido ao resultado desejado sem resolver a construção como mera previsão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se 'ti' em coerência com o pronome oblíquo do texto e 'dize' como imperativo correspondente. A construção 'que ... seja curado' é formal o suficiente para preservar o imperativo grego, mas continua natural.
