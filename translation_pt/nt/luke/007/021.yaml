base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: pt
  text: Naquela hora[a], ele curou muitas pessoas de doenças, aflições[b] e espíritos maus; e concedeu a muitas pessoas cegas que vissem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naquela mesma hora”. A expressão grega pode enfatizar a imediatidade daquele momento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “flagelos”. A palavra grega significa literalmente “açoites” e, por extensão, pode referir-se a males ou sofrimentos físicos intensos.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “concedeu ver”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Naquela mesma hora
  rationale: Preserva a especificidade temporal e comunica com naturalidade a possível ênfase na ocasião imediata.
- source_word: ἐθεράπευσεν πολλοὺς ἀπὸ νόσων
  choice: ele curou muitas pessoas de doenças
  rationale: Em português, 'curar alguém de' expressa naturalmente a separação indicada por ἀπό; 'pessoas' explicita sem restringir o referente implícito de πολλούς.
- source_word: μαστίγων
  choice: sofrimentos severos
  rationale: O sentido literal de 'açoites' se estende aqui a males ou aflições corporais intensas; a escolha comunica esse uso metafórico em português atual.
- source_word: πνευμάτων πονηρῶν
  choice: espíritos maus
  rationale: Traduz diretamente πονηρός sem substituir a expressão por 'impuros', que corresponderia a outro adjetivo grego.
- source_word: τυφλοῖς πολλοῖς
  choice: a muitos cegos
  rationale: Conserva o dativo de beneficiário e não restringe o grupo ao sexo masculino; em português, o substantivo plural pode designar genericamente as pessoas cegas.
- source_word: ἐχαρίσατο βλέπειν
  choice: concedeu ... que vissem
  rationale: Mantém tanto a nuance de dádiva graciosa de χαρίζομαι quanto a forma verbal literal do infinitivo βλέπειν, em construção portuguesa clara.
theological_decisions:
- issue: Natureza dos atos de Jesus em relação aos πνεύματα πονηρά
  choice: Manter 'espíritos maus' como realidade espiritual distinta entre os males dos quais as pessoas foram curadas.
  alternative: Interpretar a expressão apenas como metáfora de doenças físicas ou mentais.
  rationale: A expressão grega designa de modo direto espíritos maus. A tradução preserva a apresentação do texto sem a reduzir a uma explicação não pessoal nem desenvolver além dela uma doutrina específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a sequência das três fontes de sofrimento e a construção benefativa da oração final, evitando tanto literalismo obscuro quanto paráfrase teológica.
