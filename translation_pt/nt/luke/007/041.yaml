source:
  edition: SBLGNT
  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: pt
  text: 'Dois devedores deviam dinheiro a um certo emprestador: um lhe devia quinhentos denários[a], e o outro, cinquenta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de prata, geralmente associada a aproximadamente o salário de um dia de trabalho de um trabalhador.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: devedores
  rationale: Designa pessoas que têm uma dívida; “devedores” é direto, natural e adequado ao contexto da parábola.
- source_word: δανιστῇ τινι
  choice: a certo credor
  rationale: δανιστής designa quem empresta dinheiro. “Credor” é corrente e claro em português, enquanto “certo” preserva o caráter indefinido, mas particular, de τινι.
- source_word: ὤφειλεν
  choice: devia
  rationale: O imperfeito expressa a situação continuada da dívida no cenário narrativo; “devia” é a forma portuguesa natural.
- source_word: δηνάρια
  choice: denários
  rationale: Mantém a unidade monetária histórica específica, deixando sua explicação cultural para a nota.
- source_word: πεντακόσια
  choice: quinhentos
  rationale: Tradução direta do numeral cardinal que modifica “denários”.
- source_word: ἕτερος
  choice: o outro
  rationale: Forma o contraste natural com “um” e preserva a estrutura correlativa grega.
- source_word: πεντήκοντα
  choice: cinquenta
  rationale: Tradução direta; “denários” fica naturalmente subentendido na segunda oração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A elipse em “o outro, cinquenta” evita repetição sem perder clareza.
