id: LUK.7.39
reference: Luke 7:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: pt
  text: 'Quando o fariseu que o havia convidado viu isso, disse consigo mesmo: “Se este homem fosse profeta, saberia quem é e que tipo de mulher é esta que está tocando nele[a], pois ela é uma pecadora[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega ressalta tanto a identidade da mulher quanto sua condição, seu caráter ou sua reputação.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “que ela é uma pecadora”. A oração pode indicar o conteúdo do que ele saberia ou explicar a avaliação que o fariseu faz da mulher.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quando ... viu isso
  rationale: O particípio aoristo introduz a circunstância temporal da fala; “isso” retoma naturalmente a ação imediatamente anterior. δέ apenas desenvolve a narrativa e não exige um marcador explícito em português.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: o fariseu que o havia convidado
  rationale: No contexto de uma refeição, καλέω significa “convidar”; o mais-que-perfeito composto deixa clara a anterioridade do convite.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: disse consigo mesmo
  rationale: Expressa de modo natural a fala interior sem reproduzir redundantemente εἶπεν e λέγων.
- source_word: Οὗτος
  choice: este homem
  rationale: O demonstrativo isolado se refere a Jesus e carrega certo distanciamento; “este homem” preserva esse tom em português.
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: Se este homem fosse profeta, saberia
  rationale: A construção expressa uma condição irreal ou contrária à suposição do fariseu; o imperfeito do subjuntivo com o futuro do pretérito é seu equivalente idiomático.
- source_word: τίς καὶ ποταπὴ
  choice: quem é e que tipo de mulher é
  rationale: 'Mantém os dois elementos gregos: a identidade da mulher e sua condição, caráter ou reputação.'
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: esta que está tocando nele
  rationale: O presente indica contato em andamento; “tocar nele” é natural e fiel, sem acrescentar conotação indevida.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: pois ela é uma pecadora
  rationale: ὅτι pode introduzir explicação causal ou o conteúdo do conhecimento. “Pois” preserva melhor a abertura entre essas relações do que um “porque” estritamente causal.
theological_decisions:
- issue: Força da condição acerca de Jesus ser profeta
  choice: “Se este homem fosse profeta, saberia...”
  alternative: “Se este homem é profeta, saberá/sabe...”
  rationale: εἰ com o imperfeito, seguido de imperfeito com ἄν, apresenta naturalmente uma condição irreal do ponto de vista do fariseu. A tradução conserva seu ceticismo sem validar sua conclusão.
- issue: Relação de ὅτι ἁμαρτωλός ἐστιν com a oração anterior
  choice: Texto principal com “pois”, acompanhado de nota
  alternative: “que ela é uma pecadora” ou “porque ela é uma pecadora”
  rationale: A sintaxe permite ouvir a oração tanto como explicação da avaliação da mulher quanto, possivelmente, como conteúdo adicional daquilo que Jesus saberia. A nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a duplicidade enfática de τίς καὶ ποταπὴ nem a tensão narrativa do juízo interior do fariseu.
