id: LUK.7.44
reference: Luke 7:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: pt
  text: 'Então, voltando-se para a mulher, disse a Simão: “Você está vendo esta mulher? Entrei em sua casa, e você não me deu água para os pés[a]; ela, porém, molhou os meus pés com suas lágrimas e os enxugou com os cabelos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “não me deu água sobre os pés”. O sentido é o costume de oferecer água para lavar os pés.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: voltando-se para a mulher
  rationale: Expressa naturalmente o particípio aoristo e preserva a reorientação física de Jesus em direção à mulher.
- source_word: τῷ Σίμωνι ἔφη
  choice: disse a Simão
  rationale: Forma narrativa corrente e fiel para introduzir as palavras dirigidas a Simão.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Você está vendo esta mulher?
  rationale: Mantém a pergunta direta, o aspecto presente de βλέπεις e a ênfase demonstrativa de ταύτην.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Entrei em sua casa
  rationale: Tradução direta e natural do ingresso na casa pertencente a Simão.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: você não me deu água para os pés
  rationale: Preserva a menção explícita à água sem acrescentar ao texto o verbo 'lavar'; em português, 'para os pés' comunica naturalmente a finalidade no contexto da hospitalidade.
- source_word: αὕτη δὲ
  choice: ela, porém
  rationale: Marca com clareza o contraste enfático entre a conduta de Simão e a da mulher.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: molhou os meus pés com suas lágrimas
  rationale: Traduz βρέχω de modo preciso e conserva o valor instrumental do dativo τοῖς δάκρυσιν.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: os enxugou com os cabelos
  rationale: ‘Enxugou’ comunica adequadamente a ação de ἐκμάσσω, e o pronome retoma naturalmente os pés.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna clara a interpelação direta a Simão sem perder a solenidade. A ordem das orações preserva o contraste retórico do grego.
