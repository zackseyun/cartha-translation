  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: pt
  text: E, estando atrás dele, junto aos seus pés, chorando, ela começou a molhar os pés dele com suas lágrimas; enxugava-os com os cabelos da sua cabeça, beijava os pés dele[a] e os ungia com o óleo perfumado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “beijava repetidamente os pés dele” ou “beijava intensamente os pés dele”; o verbo grego pode sugerir beijos reiterados ou intensos, e o tempo verbal retrata uma ação em andamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “com o unguento aromático” ou “com o perfume”; a palavra grega se refere a óleo ou unguento perfumado.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: ficando
  rationale: O particípio aoristo introduz a posição assumida pela mulher; “ficando” é natural em português e mantém a função circunstancial sem tornar a sequência excessivamente rígida.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: atrás dele, junto aos seus pés
  rationale: Preserva tanto ὀπίσω, “atrás”, quanto a proximidade expressa por παρά com acusativo. A formulação também se ajusta à posição de Jesus reclinado à mesa.
- source_word: κλαίουσα
  choice: chorando
  rationale: Expressa de modo simples e natural uma ação emocional contínua.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: começou a molhar ... com suas lágrimas
  rationale: Mantém explicitamente o início da ação indicado por ἤρξατο e o sentido comum de βρέχειν, sem intensificá-lo para “encharcar”.
- source_word: ἐξέμασσεν
  choice: enxugava-os
  rationale: O imperfeito apresenta a ação em andamento; “enxugava” comunica o ato de remover a umidade sem afirmar além do texto que os pés ficaram completamente secos.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: com os cabelos da própria cabeça
  rationale: Retém a expressão vívida e explícita do grego, ao mesmo tempo evitando possível ambiguidade quanto à pessoa a quem pertenciam os cabelos.
- source_word: κατεφίλει
  choice: beijava repetidamente
  rationale: O composto καταφιλέω pode sugerir beijos intensos ou reiterados, e o imperfeito retrata ação continuada. “Repetidamente” torna esse valor perceptível sem acrescentar uma avaliação devocional.
- source_word: ἤλειφεν
  choice: ungia
  rationale: “Ungia” é corrente no registro bíblico, preserva a ação culturalmente significativa e reflete o aspecto contínuo do imperfeito.
- source_word: τῷ μύρῳ
  choice: com o óleo perfumado
  rationale: μύρον designa óleo ou unguento aromático. “Óleo perfumado” é claro ao leitor moderno e evita a possível ideia de perfume alcoólico líquido.
theological_decisions:
- issue: Descrição das ações da mulher em relação aos pés de Jesus
  choice: Manter as ações corporais concretas e sua intensidade emocional, incluindo os beijos repetidos
  alternative: Resumi-las como demonstração de devoção ou suavizar a reiteração dos beijos
  rationale: O texto narra atos específicos e emocionalmente fortes, mas não explicita aqui sua interpretação teológica. A tradução preserva a cena sem acrescentar motivação ou avaliação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre “começou a molhar” e os imperfeitos “enxugava”, “beijava” e “ungia” procura reproduzir a progressão e a continuidade das ações no grego. Os marcadores [a] e [b] aparecem imediatamente após as expressões às quais se referem.
