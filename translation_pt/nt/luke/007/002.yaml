  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s slave[a], who was sick and about to die, was highly valued by him.
translation:
  language: pt
  text: O escravo[a] de certo centurião estava doente e prestes a morrer; o centurião o estimava muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servo». A palavra grega doulos pode significar «escravo» ou «servo», conforme o contexto; aqui foi escolhido «escravo» para preservar a relação de sujeição indicada pelo termo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: de certo centurião
  rationale: Preserva a relação genitiva e a indefinição de τινος em português natural.
- source_word: δέ
  choice: não expresso separadamente
  rationale: Marca uma transição narrativa leve; neste versículo, a continuidade é transmitida naturalmente sem um conectivo explícito, evitando acrescentar uma ideia temporal.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição de sujeição e pertencimento implicada pelo termo no contexto social do primeiro século; «servo» pode atenuar essa relação.
- source_word: κακῶς ἔχων
  choice: estava doente
  rationale: Tradução idiomática e clara da expressão que indica estar fisicamente mal.
- source_word: ἤμελλεν τελευτᾶν
  choice: prestes a morrer
  rationale: Expressa de modo natural a iminência indicada por μέλλω com o infinitivo.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: o centurião o estimava muito
  rationale: Comunica a grande estima ou valor do escravo para o centurião, ao mesmo tempo que esclarece os referentes pronominais sem introduzir sentimentalismo indevido.
theological_decisions:
- issue: Tradução de δοῦλος no contexto de escravidão doméstica
  choice: escravo
  alternative: servo
  rationale: O contexto envolve uma relação social de sujeição sob um centurião; «escravo» preserva essa realidade histórica. A nota mantém «servo» como tradução possível do termo, sem apagar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda oração explicita «o centurião» para evitar a possível ambiguidade de uma sequência de pronomes masculinos.
