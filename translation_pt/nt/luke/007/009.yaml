id: LUK.7.9
reference: Luke 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: pt
  text: 'Quando Jesus ouviu essas coisas, ficou admirado com ele e, voltando-se para a multidão que o seguia, disse: “Eu lhes digo: nem mesmo em Israel encontrei tamanha fé[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tão grande fé”; aqui, “fé” também pode ser entendida como “confiança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Quando Jesus ouviu essas coisas
  rationale: O particípio aoristo introduz a circunstância anterior ao verbo principal; “quando ouviu” expressa naturalmente a relação temporal. δέ funciona como transição narrativa leve e não exige equivalente explícito.
- source_word: ἐθαύμασεν αὐτόν
  choice: ficou admirado com ele
  rationale: Expressa a admiração genuína indicada por θαυμάζω, em linguagem atual e digna; o pronome remete ao centurião.
- source_word: στραφεὶς
  choice: voltando-se
  rationale: Reproduz de modo conciso e natural o particípio aoristo com sentido ativo.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: para a multidão que o seguia
  rationale: Mantém a ação contínua do particípio presente e identifica com clareza Jesus como aquele a quem a multidão seguia.
- source_word: Λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Fórmula direta e idiomática em português moderno, preservando a ênfase do pronome verbal expresso na tradução.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: nem mesmo em Israel
  rationale: Preserva a força enfática de οὐδέ e a formulação locativa convencional.
- source_word: τοσαύτην πίστιν
  choice: tamanha fé
  rationale: “Tamanha” comunica o grau expresso por τοσαύτην, enquanto “fé” é o equivalente contextual natural de πίστις.
- source_word: εὗρον
  choice: encontrei
  rationale: O pretérito perfeito traduz diretamente o aoristo e soa natural na declaração em português.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança
  rationale: O contexto destaca a confiança do centurião na autoridade de Jesus. “Fé” preserva o termo teológico amplo e usual sem excluir essa dimensão de confiança.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe acompanha o movimento narrativo do grego sem rigidez; “lhes” é usado como forma corrente de plural em “Eu lhes digo”.
