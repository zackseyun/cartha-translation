id: LUK.7.25
reference: Luke 7:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: pt
  text: 'Mas o que vocês foram ver? Um homem vestido com roupas macias[a]? Vejam: os que usam roupas esplêndidas e vivem no luxo estão nos palácios reais[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestes delicadas”. A expressão se refere a roupas finas e suaves associadas ao luxo, não à fraqueza moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas cortes dos reis”. O grego se refere a residências reais ou aos ambientes da corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Mantém a transição adversativa que dá continuidade à série de perguntas retóricas de Jesus.
- source_word: ἐξήλθατε ἰδεῖν
  choice: vocês foram ver
  rationale: Expressa de modo natural em português a ação passada e a finalidade indicada pelo infinitivo.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo singular refere-se, neste contraste retórico, a um indivíduo do sexo masculino.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: vestido com roupas macias
  rationale: Preserva a imagem concreta de roupas suaves, finas e próprias do luxo, sem introduzir uma conotação moral indevida.
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Interjeição de chamada de atenção; o plural concorda naturalmente com os ouvintes já tratados por 'vocês'.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: usam roupas esplêndidas
  rationale: Comunica com clareza a magnificência e o prestígio social das vestes.
- source_word: τρυφῇ
  choice: vivem no luxo
  rationale: Torna idiomática a construção grega e expressa o modo de vida luxuoso indicado pelo substantivo.
- source_word: ἐν τοῖς βασιλείοις
  choice: nos palácios reais
  rationale: Representa as residências ou dependências da realeza e conserva o plural do texto grego.
theological_decisions:
- issue: Sentido de μαλακοῖς no contexto
  choice: Referência literal a roupas macias e finas
  alternative: Roupas efeminadas; vestes delicadas
  rationale: O contraste imediato entre o deserto e a vida luxuosa dos palácios aponta para condição social e estilo de vida, não para uma censura de caráter ou de masculinidade.
- issue: Cenário social de βασιλείοις
  choice: palácios reais
  alternative: cortes dos reis
  rationale: O termo pode designar residências ou ambientes da realeza; 'palácios reais' comunica o sentido principal sem impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para a segunda pessoa do plural. A formulação conserva a sequência de perguntas retóricas e o contraste entre austeridade e luxo da corte.
