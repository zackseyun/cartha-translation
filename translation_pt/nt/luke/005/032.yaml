  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: pt
  text: Não vim chamar os justos, mas os pecadores ao arrependimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que se arrependam». A expressão grega εἰς μετάνοιαν indica finalidade ou meta.'
    reason: alternativa lexical e explicitação da construção de finalidade
lexical_decisions:
- source_word: οὐκ ἐλήλυθα
  choice: Não vim
  rationale: O perfeito de ἔρχομαι descreve a vinda de Jesus com relevância presente; em português, «não vim» é a formulação idiomática para declarar missão ou propósito.
- source_word: καλέσαι
  choice: chamar
  rationale: O infinitivo aoristo expressa propósito e «chamar» preserva tanto a ideia de convite quanto a de convocação, sem restringir o sentido.
- source_word: δικαίους
  choice: os justos
  rationale: O adjetivo substantivado designa os que são justos; a tradução mantém a categoria sem explicar se são de fato justos ou apenas considerados assim.
- source_word: ἁμαρτωλούς
  choice: os pecadores
  rationale: Equivalente direto e corrente para o substantivo que designa pessoas caracterizadas como pecadoras.
- source_word: εἰς μετάνοιαν
  choice: ao arrependimento
  rationale: A preposição εἰς indica finalidade ou meta. «Ao arrependimento» conserva o substantivo μετάνοια e é uma expressão natural e teologicamente não redutiva em português.
theological_decisions:
- issue: Se Jesus nega a existência de pessoas verdadeiramente justas ou fala segundo uma classificação social ou percebida
  choice: Manter literalmente o contraste entre «os justos» e «os pecadores».
  alternative: «os que se consideram justos» ou «os considerados justos»
  rationale: O versículo não traz qualificação explícita nem marca inequívoca de ironia; acrescentá-la resolveria uma tensão que o texto grego deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma concisa preserva o paralelismo e o contraste do original.
