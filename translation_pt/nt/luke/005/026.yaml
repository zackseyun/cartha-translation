id: LUK.5.26
reference: Luke 5:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: pt
  text: 'E o espanto tomou conta de todos, e eles glorificavam a Deus; ficaram cheios de temor, dizendo: “Hoje vimos coisas extraordinárias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas surpreendentes” ou “coisas incomuns”; o grego indica coisas que ultrapassam a expectativa normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: espanto
  rationale: Neste contexto, indica assombro intenso diante do ocorrido, não êxtase em sentido místico. “Espanto” é natural e preserva a força da reação.
- source_word: ἔλαβεν ἅπαντας
  choice: tomou conta de todos
  rationale: Expressa de modo idiomático e vívido que o espanto se apoderou de todos.
- source_word: ἐδόξαζον
  choice: glorificavam
  rationale: Mantém a proximidade lexical com δοξάζω e o aspecto contínuo do imperfeito.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Tradução portuguesa padrão neste contexto.
- source_word: ἐπλήσθησαν φόβου
  choice: ficaram cheios de temor
  rationale: Preserva a imagem de serem enchidos e traduz φόβος sem reduzi-lo apenas a admiração; “temor” comunica tanto medo quanto reverência no contexto.
- source_word: λέγοντες
  choice: e diziam
  rationale: O imperfeito em português apresenta naturalmente a fala como parte da reação contínua do grupo.
- source_word: Εἴδομεν
  choice: vimos
  rationale: O pretérito perfeito é a forma portuguesa natural para o aoristo em uma reação imediata ao que acabara de acontecer.
- source_word: παράδοξα
  choice: coisas extraordinárias
  rationale: Designa acontecimentos além da expectativa comum. A expressão é clara e evita o sentido potencialmente pejorativo de “coisas estranhas”.
- source_word: σήμερον
  choice: hoje
  rationale: Preserva diretamente a referência temporal e a imediaticidade do testemunho.
theological_decisions:
- issue: Nuance de φόβος diante da ação divina
  choice: temor
  alternative: medo; reverência
  rationale: “Temor” preserva a tensão entre medo e reverência sem interpretar a reação apenas como admiração nem sugerir somente pânico.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação do grego foi levemente segmentada em frases para fluidez, sem alterar a progressão: espanto, glorificação, temor e declaração. O marcador [a] aparece após a expressão a que se refere.'
