  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: pt
  text: Mas o vinho novo deve ser colocado em odres novos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega dois adjetivos diferentes: νέος (“novo”, sobretudo quanto ao tempo) para o vinho e καινός (“novo”, sobretudo quanto à qualidade ou condição) para os odres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que contrasta a prática inadequada descrita no versículo anterior com o procedimento correto apresentado aqui.
- source_word: οἶνον νέον
  choice: vinho novo
  rationale: νέον modifica diretamente οἶνον e indica vinho recente, ainda em processo de fermentação; “vinho novo” é a expressão natural e tradicional em português.
- source_word: εἰς
  choice: em
  rationale: Embora a preposição expresse movimento para dentro, em português “colocar em odres” comunica naturalmente esse sentido direcional; “dentro de” seria possível, mas mais pesado.
- source_word: ἀσκοὺς
  choice: odres
  rationale: ἀσκός designa um recipiente de pele usado para guardar líquidos. “Odres” é o termo português preciso e corrente no contexto bíblico.
- source_word: καινοὺς
  choice: novos
  rationale: καινός destaca aqui odres novos quanto ao estado ou à condição, ainda flexíveis e próprios para receber vinho novo. “Frescos” não é uma colocação natural com “odres” em português; a distinção entre os dois adjetivos gregos é registrada em nota.
- source_word: βλητέον
  choice: deve ser colocado
  rationale: O adjetivo verbal impessoal expressa necessidade ou procedimento apropriado. “Deve ser colocado” preserva esse valor com clareza e naturalidade.
theological_decisions:
- issue: Distinção entre νέος e καινός na mesma frase
  choice: Traduzir ambos por “novo”, registrando em nota a diferença lexical
  alternative: Traduzir καινός por “fresco” ou “em bom estado”
  rationale: 'O grego emprega adjetivos diferentes: νέος enfatiza sobretudo a novidade no tempo, e καινός, a novidade quanto à qualidade ou condição. Em português, porém, “odres frescos” soa pouco natural, enquanto “odres em bom estado” enfraquece a correspondência com o contraste entre odres velhos e novos. A nota preserva a distinção sem impor uma formulação artificial ao texto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Odres” conserva a precisão cultural do objeto antigo; a sintaxe é direta e natural.
