  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: pt
  text: 'E eles lhe disseram: “Os discípulos de João jejuam com frequência e fazem orações, e os dos fariseus fazem o mesmo; os teus, porém, comem e bebem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: E eles lhe disseram
  rationale: δέ é uma conexão narrativa leve; “E” mantém o fluxo sem impor um contraste forte.
- source_word: μαθηταὶ Ἰωάννου
  choice: os discípulos de João
  rationale: Expressa de modo natural e inequívoco a relação indicada pelo genitivo.
- source_word: νηστεύουσιν πυκνά
  choice: jejuam com frequência
  rationale: πυκνά tem valor adverbial de frequência; a expressão é atual, clara e digna.
- source_word: δεήσεις ποιοῦνται
  choice: fazem orações
  rationale: Conserva a construção nominal do grego e distingue a expressão do simples verbo “orar”.
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: e os dos fariseus fazem o mesmo
  rationale: “Os dos fariseus” preserva a elipse de “discípulos”, enquanto “fazem o mesmo” comunica naturalmente ὁμοίως e abrange as duas práticas mencionadas.
- source_word: οἱ δὲ σοὶ
  choice: os teus, porém
  rationale: Mantém a elipse grega de “discípulos” e torna explícito o contraste marcado por δέ.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: comem e bebem
  rationale: O presente simples expressa adequadamente uma conduta habitual contrastada com o jejum.
theological_decisions:
- issue: Explicitar ou não “discípulos” nas referências aos fariseus e a Jesus
  choice: Preservar a elipse com “os dos fariseus” e “os teus”
  alternative: Traduzir “os discípulos dos fariseus” e “os teus discípulos”
  rationale: A elipse é clara em português no contexto e reflete de perto a estrutura grega, sem introduzir interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível; “com frequência” evita coloquialismo excessivo, e as elipses “os dos fariseus” e “os teus” permanecem compreensíveis pelo contexto.
