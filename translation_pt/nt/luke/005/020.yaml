id: LUK.5.20
reference: Luke 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: pt
  text: 'Ao ver a fé deles[a], ele disse: “Homem, os seus pecados estão perdoados[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiança”; em grego, “fé”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram perdoados”. O perfeito passivo grego pode enfatizar um estado presente resultante de uma ação concluída.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Ao ver
  rationale: Expressa de modo natural o particípio aoristo e sua relação temporal com o verbo principal, sem tornar a sequência mais precisa do que o grego permite.
- source_word: πίστιν
  choice: fé
  rationale: É o equivalente português usual neste contexto e comunica a confiança demonstrada pelo paralítico e pelas pessoas que o acompanhavam.
- source_word: αὐτῶν
  choice: deles
  rationale: Preserva o pronome plural grego sem decidir se ele abrange o paralítico e seus acompanhantes ou destaca os que o levaram.
- source_word: Ἄνθρωπε
  choice: Homem
  rationale: Mantém a forma direta de tratamento e o referente masculino do grego. Alternativas como “amigo” acrescentariam uma nuance afetiva não expressa no texto.
- source_word: ἀφέωνταί
  choice: estão perdoados
  rationale: A forma perfeita passiva descreve um estado presente resultante do perdão; esta formulação é clara e natural em português.
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: Tradução direta e corrente que preserva o sentido moral e teológico do termo.
- source_word: σοι ... σου
  choice: os seus pecados estão perdoados
  rationale: O possessivo representa naturalmente a relação pessoal indicada pelos dois pronomes gregos; repetir “a você” seria possível, mas menos fluente em português.
theological_decisions:
- issue: Alcance de “a fé deles”
  choice: Preservar a referência plural sem identificar de modo exclusivo quem está incluído.
  alternative: Entender que se trata apenas da fé dos homens que levaram o paralítico, ou da fé compartilhada por ele e seus acompanhantes.
  rationale: O plural αὐτῶν não especifica a composição exata do grupo; a tradução mantém essa abertura.
- issue: Força da declaração de perdão
  choice: 'Traduzir como declaração de um estado presente: “estão perdoados”.'
  alternative: “Foram perdoados” ou “têm sido perdoados”, com ênfase diferente no aspecto temporal.
  rationale: O perfeito passivo afirma a realidade presente resultante de uma ação concluída, sem definir por si só a mecânica temporal ou teológica do perdão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Homem” é deliberadamente direto para conservar o vocativo grego, embora seja menos comum como forma de tratamento no português atual.
