  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: pt
  text: 'E aconteceu que, estando ele em uma das cidades, eis que havia um homem cheio de lepra[a]. Ao ver Jesus, ele se prostrou com o rosto em terra e lhe suplicou: “Senhor, se quiseres, podes purificar-me[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “coberto de lepra”. O grego diz literalmente “cheio de lepra”, destacando a gravidade ou a extensão da condição. Na Antiguidade, “lepra” podia abranger diversas doenças de pele, não apenas a hanseníase moderna.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornar-me limpo”. O verbo pode se referir à purificação em sentidos físico, ritual e social, e não somente à cura médica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa de Lucas em português atual, sem o arcaísmo de “sucedeu”. O valor formulaico permanece perceptível na abertura da cena.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: estando ele
  rationale: Expressa de modo conciso e natural a circunstância temporal da construção grega com infinitivo articular.
- source_word: μιᾷ τῶν πόλεων
  choice: uma das cidades
  rationale: πόλις pode designar cidade ou povoação; “cidade” é a equivalência portuguesa corrente e não exige que se trate de um grande centro urbano.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém o marcador discursivo que chama a atenção para a entrada súbita do homem na cena.
- source_word: ἀνὴρ
  choice: um homem
  rationale: Correspondência direta e natural para o substantivo que identifica um homem adulto.
- source_word: πλήρης λέπρας
  choice: cheio de lepra
  rationale: Conserva a expressão intensiva do grego, que destaca a gravidade ou extensão da condição, sem reduzi-la a uma descrição médica moderna.
- source_word: ἰδὼν
  choice: ao ver
  rationale: Converte o particípio aoristo em uma oração temporal idiomática, preservando a sequência narrativa.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: se prostrou com o rosto em terra
  rationale: Comunica claramente tanto a ação de cair/prostrar-se quanto a postura física de humildade e súplica.
- source_word: ἐδεήθη αὐτοῦ
  choice: lhe suplicou
  rationale: Transmite a intensidade do pedido sem soar coloquial nem excessivamente rebuscado.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva o tratamento respeitoso e a possível ressonância cristológica de κύριος sem determinar além do contexto o grau de reconhecimento do homem.
- source_word: ἐὰν θέλῃς
  choice: se quiseres
  rationale: Expressa diretamente a condição ligada à vontade de Jesus, sem sugerir dúvida quanto à sua capacidade.
- source_word: δύνασαί με καθαρίσαι
  choice: podes purificar-me
  rationale: Mantém tanto a afirmação de capacidade quanto a linguagem de purificação, que abrange dimensões físicas, rituais e sociais.
theological_decisions:
- issue: Sentido de λέπρα e καθαρίζω no relato
  choice: “lepra” e “purificar-me”
  alternative: “doença de pele” e “curar-me”
  rationale: A terminologia grega antiga não corresponde necessariamente apenas à hanseníase moderna, mas “lepra” preserva o termo bíblico reconhecível. “Purificar” conserva as dimensões ritual e social da restauração, além da cura física.
- issue: Tratamento κύριε dirigido a Jesus
  choice: “Senhor”
  alternative: “Mestre” ou “senhor” no sentido de “meu senhor”
  rationale: “Senhor” mantém o respeito expresso no contexto e permite a ressonância cristológica do termo sem afirmar que o homem já compreendia plenamente a identidade de Jesus.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe conserva alguma solenidade narrativa em “eis que” e no tratamento direto “se quiseres, podes”, evitando tanto arcaísmos opacos quanto paráfrases excessivamente coloquiais.
