id: LUK.5.25
reference: Luke 5:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: pt
  text: E, no mesmo instante, ele se levantou diante deles, pegou aquilo sobre o que estivera deitado[a] e foi para casa, glorificando a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a esteira em que estivera deitado” (literalmente, “aquilo sobre o que estava deitado”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: no mesmo instante
  rationale: Expressa que a ação aconteceu sem demora e preserva a ênfase de Lucas no efeito imediato da cura.
- source_word: ἀναστὰς
  choice: ele se levantou
  rationale: Converte naturalmente o particípio aoristo em verbo finito, mantendo a sequência das ações.
- source_word: ἐνώπιον αὐτῶν
  choice: diante deles
  rationale: Indica que o homem se levantou publicamente, na presença dos que estavam reunidos, sem acrescentar a ideia interpretativa de que ocorreu 'diante dos olhos' deles.
- source_word: ἄρας
  choice: pegou
  rationale: Neste contexto, αἴρω descreve levantar e tomar consigo o objeto; 'pegou' é claro e idiomático em português.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: aquilo sobre o que estivera deitado
  rationale: Preserva a expressão relativa do grego, que não nomeia explicitamente o objeto neste versículo, sem impor 'esteira', 'maca' ou 'cama' ao texto principal.
- source_word: κατέκειτο
  choice: estivera deitado
  rationale: Representa retrospectivamente o estado anterior e contínuo do homem antes de se levantar.
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: foi para casa
  rationale: É a formulação portuguesa mais natural para o movimento em direção à própria casa, preservando o sentido de partida de ἀπῆλθεν e o valor de οἶκος como lar ou casa.
- source_word: δοξάζων τὸν θεόν
  choice: glorificando a Deus
  rationale: Mantém a linguagem ampla de atribuir glória e honra a Deus; 'louvando' seria possível, mas poderia restringir o sentido à expressão verbal de louvor.
theological_decisions:
- issue: Se o objeto levado deve ser identificado como esteira, maca ou cama
  choice: Manter no texto principal a expressão não específica 'aquilo sobre o que estivera deitado'.
  alternative: Traduzir 'a esteira em que estivera deitado' ou 'a cama em que estivera deitado'.
  rationale: Neste versículo, o grego emprega uma expressão relativa, sem substantivo explícito. A opção escolhida evita acrescentar uma identificação específica, enquanto a nota oferece uma leitura mais explícita e fluente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. 'No mesmo instante' transmite prontidão sem soar excessivamente formal; 'foi para casa' é mais natural do que 'foi para a sua casa'. A formulação deliberadamente incomum 'aquilo sobre o que' preserva a falta de um substantivo explícito no grego e é esclarecida pela nota.
