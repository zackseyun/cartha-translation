  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: pt
  text: 'E os fariseus e seus escribas murmuravam[a] aos discípulos de Jesus, dizendo: “Por que vocês comem e bebem com cobradores de impostos e pecadores?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “queixavam-se”. O verbo grego pode indicar uma reclamação murmurada, não apenas uma objeção formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: murmuravam
  rationale: O imperfeito expressa uma queixa contínua ou repetida, e “murmuravam” conserva a ideia de reclamação em voz baixa.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Equivalente histórico direto, sem substituir a designação do grupo por uma explicação de sua função.
- source_word: αὐτῶν
  choice: deles
  rationale: Mantém a relação sintática mais natural entre os escribas e os fariseus, sem especificar além do grego.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: contra os discípulos de Jesus
  rationale: Neste contexto de murmuração, πρός pode indicar o alvo da queixa; “de Jesus” identifica naturalmente o antecedente de αὐτοῦ em português.
- source_word: Διὰ τί
  choice: Por que
  rationale: Forma interrogativa corrente e fiel em português.
- source_word: τελωνῶν
  choice: cobradores de impostos
  rationale: Expressão clara e corrente que preserva a função e a carga social do grupo no contexto dos Evangelhos.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Tradução direta que conserva a categoria moral e social empregada pelos interlocutores.
- source_word: ἐσθίετε καὶ πίνετε
  choice: vocês comem e bebem
  rationale: Preserva os dois verbos concretos e torna explícito o sujeito plural exigido pela clareza em português.
- source_word: καὶ
  choice: E
  rationale: Conserva a ligação narrativa simples do texto grego.
theological_decisions:
- issue: Força social e religiosa da comunhão à mesa com “cobradores de impostos e pecadores”
  choice: Manter a acusação concreta, sem explicação adicional
  alternative: Explicitar na tradução uma suposta transgressão ritual ou aprovação moral
  rationale: O versículo formula a objeção por meio dessas categorias sociais e do ato de comer e beber com elas. A tradução preserva a tensão sem determinar uma justificativa teológica que o texto não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Escribas” conserva o termo histórico; “cobradores de impostos” é mais transparente ao leitor atual. O pronome informal plural “vocês” corresponde naturalmente à segunda pessoa plural no português brasileiro.
