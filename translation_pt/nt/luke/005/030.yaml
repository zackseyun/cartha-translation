review_pass:
  verdict: revise
  source_fidelity: A tradução de ἐγόγγυζον como “murmuravam” preserva bem o imperfeito e a nuance de reclamação em voz baixa. Contudo, “contra os discípulos” interpreta πρὸς como hostilidade dirigida contra eles, enquanto a construção, seguida de uma fala direta, indica primariamente que a reclamação foi dirigida aos discípulos. A tradução deve refletir essa direção da fala.
  naturalness: “Os fariseus e seus escribas” é mais natural e claro que “os escribas deles”, mantendo a relação expressa por αὐτῶν. “Murmuravam aos discípulos de Jesus” é compreensível e preserva a direção da fala; a nota oferece uma alternativa mais idiomática.
  terminology: “Fariseus”, “escribas”, “cobradores de impostos” e “pecadores” são escolhas adequadas, historicamente reconhecíveis e fiéis ao texto. “Discípulos de Jesus” esclarece com segurança o referente de αὐτοῦ no português sem alterar o sentido.
  issues:
  - severity: medium
    issue: “contra os discípulos de Jesus” para πρὸς τοὺς μαθητὰς αὐτοῦ
    rationale: Nesta fala dirigida aos discípulos, πρός com acusativo marca a direção ou o destinatário da fala. “Contra” acrescenta uma orientação adversativa que o grego não exige e que destoa da leitura mais direta, confirmada pelo texto inglês de referência (“to his disciples”).
  - severity: low
    issue: Posição da nota lexical
    rationale: A nota trata de “murmuravam”, mas seu marcador está ligado a “Jesus”. O marcador deve seguir o termo a que a alternativa lexical se refere.
