lexical_decisions:
- source_word: θάμβος
  choice: espanto
  rationale: Expressa uma reação intensa e repentina diante da pesca extraordinária, em linguagem natural e digna.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa com a reação de Simão no versículo anterior.
- source_word: περιέσχεν
  choice: havia tomado conta
  rationale: Reproduz de modo idiomático a imagem de uma emoção que envolve e domina alguém.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: todos os que estavam com ele
  rationale: Preserva claramente o alcance coletivo e a relação dos demais com Simão.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: por causa da quantidade de peixes
  rationale: ἐπί indica aqui a causa da reação; no contexto, ἄγρα denota a pesca ou captura, e a formulação explicita naturalmente o resultado extraordinário sem recorrer à repetição pouco elegante de 'pesca de peixes'.
- source_word: ὧν συνέλαβον
  choice: que haviam apanhado
  rationale: O relativo retoma os peixes e o verbo no plural indica a participação do grupo; 'apanhado' é corrente e evita repetir 'pesca/pescado'.
