id: LUK.5.19
reference: Luke 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: pt
  text: Sem encontrar por onde introduzi-lo por causa da multidão[a], subiram ao terraço e, por entre as telhas[b], desceram-no com a esteira[c] até o meio do recinto, diante de Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem descobrir como introduzi-lo por causa da multidão”. A expressão grega pode destacar tanto a via de acesso quanto o modo de entrar.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, através da cobertura de telhas. As palavras de Lucas refletem uma estrutura de telhado revestida de telhas.
    reason: cultural_note
  - marker: c
    text: 'Ou: “com o pequeno leito” ou “com a maca”. O termo grego designa uma cama pequena, esteira ou leito portátil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: por onde introduzi-lo
  rationale: A construção elíptica pergunta pela via ou pelo modo de fazê-lo entrar. “Por onde introduzi-lo” soa natural em português e mantém em primeiro plano a dificuldade de acesso.
- source_word: διὰ τὸν ὄχλον
  choice: por causa da multidão
  rationale: 'διά com acusativo tem aqui valor causal: a multidão era o obstáculo à entrada.'
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: subiram ao terraço
  rationale: δῶμα designa o teto plano ou terraço da casa. “Terraço” comunica de modo natural uma cobertura acessível, coerente com a cena.
- source_word: διὰ τῶν κεράμων
  choice: por entre as telhas
  rationale: κέραμοι são telhas, provavelmente de barro. A expressão preserva o detalhe arquitetônico de Lucas sem explicar no corpo do versículo como elas foram removidas.
- source_word: καθῆκαν
  choice: desceram-no
  rationale: O verbo descreve fazer descer algo a partir de cima. A forma pronominal é clara, concisa e digna em português.
- source_word: σὺν τῷ κλινιδίῳ
  choice: com a esteira
  rationale: κλινίδιον refere-se a um leito pequeno, cama portátil ou esteira. “Esteira” é compreensível e evita tanto o arcaísmo quanto uma associação médica excessiva de “maca”.
- source_word: εἰς τὸ μέσον
  choice: até o meio do recinto
  rationale: A expressão indica que o homem foi colocado na área central da reunião. “Do recinto” explicita naturalmente o referente espacial implícito, sem identificar um cômodo específico.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: diante de Jesus
  rationale: A expressão marca posição espacial diretamente à frente de Jesus; “diante de” é natural e mantém o registro digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem das notas foi regularizada para acompanhar sua ocorrência no texto. “Terraço” representa o teto plano acessível, enquanto a nota sobre as telhas preserva o detalhe construtivo específico.
