  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: pt
  text: 'E os escribas e os fariseus começaram a raciocinar, dizendo: “Quem é este que profere blasfêmias? Quem pode perdoar pecados, a não ser somente Deus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: começaram a refletir
  rationale: Preserva a construção ingressiva de ἄρχομαι com infinitivo e o sentido deliberativo de διαλογίζομαι, sem decidir se a reflexão foi apenas interior ou também compartilhada.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e ainda compreensível nos Evangelhos para especialistas reconhecidos na Lei, mantendo correspondência direta com o grego.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa consagrada para o nome do grupo.
- source_word: λαλεῖ βλασφημίας
  choice: profere blasfêmias
  rationale: Mantém o plural βλασφημίας e expressa em português natural a acusação de enunciar palavras blasfemas.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: perdoar pecados
  rationale: Equivalente idiomático e teologicamente preciso da combinação de ἀφίημι com ἁμαρτίας.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: a não ser somente Deus
  rationale: Conserva tanto a construção de exceção quanto a exclusividade enfática de μόνος.
- source_word: Τίς ἐστιν οὗτος
  choice: Quem é este
  rationale: Reproduz a pergunta abrupta sem acrescentar “homem”, termo ausente do grego.
theological_decisions:
- issue: Implicação da autoridade de Jesus para perdoar pecados
  choice: Manter diretamente a afirmação dos escribas e fariseus de que somente Deus pode perdoar pecados.
  alternative: Explicitar uma conclusão cristológica ou suavizar a exclusividade da afirmação.
  rationale: O versículo cria tensão narrativa e teológica, mas não formula aqui a conclusão. A tradução deve preservar a implicação sem resolvê-la por expansão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Escribas” e “fariseus” preservam a terminologia bíblica corrente; “profere” sustenta o tom solene da acusação sem soar arcaico. Nenhuma nota de rodapé foi necessária.
