  text: αὐτὸς δὲ ἦν ὑποχωρῶν ἐν ταῖς ἐρήμοις καὶ προσευχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: pt
  text: Mas ele costumava se retirar para lugares desertos e orar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Mas ele próprio estava se retirando em lugares desertos e orando». Em grego, a construção no imperfeito com particípios expressa ação contínua ou habitual.'
    reason: Alternativa mais formal que preserva a construção e a possível ênfase do original.
lexical_decisions:
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome explícito retoma Jesus e tem leve força enfática; em português, «ele» preserva naturalmente o referente, enquanto o contraste também é marcado por «Mas».
- source_word: δὲ
  choice: Mas
  rationale: 'A partícula introduz leve contraste com a crescente publicidade no contexto: apesar disso, Jesus se retirava regularmente.'
- source_word: ἦν ὑποχωρῶν
  choice: costumava se retirar
  rationale: A construção perifrástica no imperfeito indica ação contínua ou habitual no passado. A formulação escolhida comunica com clareza o caráter costumeiro.
- source_word: ἐν ταῖς ἐρήμοις
  choice: para lugares desertos
  rationale: O plural substantivado designa áreas desabitadas ou solitárias, não necessariamente um deserto específico. Embora ἐν seja literalmente «em», o português emprega naturalmente «para» com «retirar-se» para indicar o destino implícito.
- source_word: καὶ
  choice: e
  rationale: Coordena de modo simples as duas ações habituais.
- source_word: προσευχόμενος
  choice: orar
  rationale: O particípio coordenado participa do valor habitual da construção e descreve a oração associada aos repetidos retiros de Jesus.
theological_decisions:
- issue: Aspecto das ações de Jesus
  choice: O versículo descreve o costume de Jesus de se retirar e orar.
  alternative: O versículo narra somente uma ocasião específica em que ele se retirou e orou.
  rationale: O imperfeito perifrástico, ἦν com particípios presentes, favorece uma ação contínua ou recorrente. A tradução mantém essa nuance gramatical sem acrescentar conclusões doutrinárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lugares desertos» significa locais desabitados ou solitários, sem exigir a imagem de um deserto árido.
