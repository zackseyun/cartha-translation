  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Os que têm saúde não precisam de médico, mas sim os doentes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Jesus lhes respondeu
  rationale: A combinação do particípio ἀποκριθείς com εἶπεν introduz uma resposta em narrativa. A formulação portuguesa evita a redundância pouco natural de “respondendo, disse-lhes”, preservando tanto o caráter responsivo quanto os destinatários.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: não precisam
  rationale: Expressa de modo natural em português a locução grega “não têm necessidade”, sem alterar seu sentido.
- source_word: οἱ ὑγιαίνοντες
  choice: os que têm saúde
  rationale: O particípio substantivado designa pessoas em estado de saúde; a formulação é clara, atual e mantém o contraste proverbial.
- source_word: ἰατροῦ
  choice: de médico
  rationale: “Médico” é a correspondência moderna, comum e digna de ἰατρός; o português dispensa o artigo nesta construção.
- source_word: ἀλλὰ οἱ κακῶς ἔχοντες
  choice: mas sim os doentes
  rationale: κακῶς ἔχειν é uma expressão idiomática para estar enfermo. “Mas sim” torna explícito o contraste elíptico natural do grego, no qual a necessidade do médico é subentendida na segunda oração.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o formato proverbial e a oposição entre pessoas saudáveis e doentes, sem acrescentar interpretação teológica ao dito.
