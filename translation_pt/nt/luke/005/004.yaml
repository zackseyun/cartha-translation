source:
  edition: SBLGNT
  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: pt
  text: 'Quando terminou de falar, ele disse a Simão: “Avance para águas profundas[a] e baixem as redes de vocês para uma pesca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para a profundidade”; neste contexto, refere-se às águas profundas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz a ação seguinte com valor temporal e leve progressão narrativa, sem tornar δέ excessivamente explícito.
- source_word: ἐπαύσατο λαλῶν
  choice: terminou de falar
  rationale: Expressa de modo natural o término da ação contínua indicada por παύω com o particípio presente.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ele disse a Simão
  rationale: Reproduz diretamente a fórmula de introdução da fala, sem a interpretação adicional que haveria em “ordenou”.
- source_word: Ἐπανάγαγε
  choice: Avance
  rationale: No contexto náutico, o verbo singular manda Simão conduzir a embarcação para longe da margem; “avance” comunica isso naturalmente sem chamar o lago de mar.
- source_word: εἰς τὸ βάθος
  choice: para águas profundas
  rationale: O substantivo βάθος significa literalmente “profundidade”, mas aqui designa a parte funda da água. A formulação é clara e idiomática em português.
- source_word: χαλάσατε
  choice: baixem
  rationale: Descreve naturalmente a ação de fazer descer as redes a partir da embarcação.
- source_word: τὰ δίκτυα ὑμῶν
  choice: as redes de vocês
  rationale: Preserva o plural de ὑμῶν e, com o verbo plural, deixa claro que a segunda ordem se dirige a Simão e aos seus companheiros.
- source_word: εἰς ἄγραν
  choice: para uma pesca
  rationale: Mantém a ideia de propósito ligada a ἄγρα, aqui a captura de peixes, em linguagem acessível e sem garantir antecipadamente o resultado.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A mudança do imperativo singular (“Avance”) para o plural (“baixem”) foi preservada, refletindo a passagem de uma ordem dirigida a Simão para outra que inclui seus companheiros.
