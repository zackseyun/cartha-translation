  rationale: A revisão mantém o sentido da leitura αὐτόν adotada no SBLGNT, entendendo-a como Jesus sendo aquele que cura, sem acrescentar “os” ou outro objeto. Também corrige a nota para que ela descreva de forma explícita e verificável o contraste entre a leitura principal e a variante plural.
