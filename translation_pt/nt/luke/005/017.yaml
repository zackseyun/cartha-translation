id: LUK.5.17
reference: Luke 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: pt
  text: Certo dia, enquanto ele ensinava, estavam ali sentados fariseus e mestres da Lei, vindos de todos os povoados da Galileia e da Judeia, e também de Jerusalém. E o poder do Senhor estava presente para que ele curasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “para curá-los” em vez de “para que ele curasse”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Certo dia
  rationale: Reproduz de modo natural a fórmula narrativa de Lucas, sem o arcaísmo de uma tradução literal como “aconteceu em um dos dias”.
- source_word: αὐτὸς ἦν διδάσκων
  choice: enquanto ele ensinava
  rationale: Expressa a ação contínua da construção perifrástica e liga naturalmente a cena ao restante da frase.
- source_word: καθήμενοι
  choice: estavam ali sentados
  rationale: Retrata a presença já estabelecida dos fariseus e mestres da Lei na cena.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: νομοδιδάσκαλοι
  choice: mestres da Lei
  rationale: Traduz diretamente a função de ensinar a Lei, com linguagem clara e consagrada, sem ampliar para “especialistas”.
- source_word: ἐληλυθότες
  choice: vindos
  rationale: Comunica de forma concisa que eles haviam chegado anteriormente e agora estavam presentes.
- source_word: ἐκ πάσης κώμης
  choice: de todos os povoados
  rationale: “Povoados” representa assentamentos menores e o plural coletivo soa mais natural em português do que “de cada povoado” neste contexto.
- source_word: Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: da Galileia e da Judeia, e também de Jerusalém
  rationale: Distingue naturalmente as duas regiões da cidade de Jerusalém, sem alterar a abrangência geográfica.
- source_word: δύναμις κυρίου
  choice: o poder do Senhor
  rationale: Preserva a construção genitiva e o peso teológico da atuação do poder divino.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: estava com ele para curar
  rationale: Mantém a relação entre o poder do Senhor e a atividade curadora de Jesus, ao mesmo tempo que evita introduzir no texto principal o objeto plural “eles”, ausente na leitura do SBLGNT fornecida.
theological_decisions:
- issue: Sentido e referência de δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: “o poder do Senhor estava com ele para curar”
  alternative: “o poder do Senhor estava presente para curá-lo” ou, conforme a variante, “para curá-los”
  rationale: Na leitura αὐτόν, a formulação grega é difícil e pode ser entendida com αὐτόν como sujeito acusativo do infinitivo, isto é, Jesus como aquele que cura. A tradução comunica essa leitura sem especificar um objeto das curas. A nota registra a variante plural relevante.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Certo dia” evita uma fórmula narrativa pesada; “mestres da Lei” mantém terminologia bíblica reconhecível. A nota foi colocada na cláusula a que a variante textual efetivamente pertence.
