  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: pt
  text: Depois de fazerem isso, cercaram uma grande quantidade de peixes[a], e as redes deles estavam se rasgando[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pegaram uma grande quantidade de peixes”. O verbo grego significa mais literalmente “cercaram” ou “fecharam ao redor”, destacando a imagem dos peixes rodeados pelas redes.
    reason: lexical_alternative
  - marker: b
    text: Ou “estavam começando a se rasgar”. O verbo grego no imperfeito apresenta o rasgar como um processo em andamento, não necessariamente já concluído.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Depois de fazerem isso
  rationale: O particípio aoristo indica uma ação anterior à principal; a formulação temporal preserva a sequência de modo natural em português.
- source_word: συνέκλεισαν
  choice: cercaram
  rationale: O verbo expressa a ideia de fechar ao redor ou encurralar. “Cercaram” conserva a imagem dos peixes rodeados pelas redes sem reduzi-la simplesmente a “pescaram”.
- source_word: πλῆθος ἰχθύων πολύ
  choice: uma quantidade enorme de peixes
  rationale: A expressão enfatiza fortemente a abundância. Esta formulação é clara e corrente, refletindo tanto πλῆθος quanto πολύ.
- source_word: διερρήσσετο
  choice: estavam se rasgando
  rationale: O imperfeito apresenta o rompimento como um processo em andamento, não necessariamente como ruptura já consumada; a forma pronominal é idiomática em português.
- source_word: τὰ δίκτυα αὐτῶν
  choice: as redes deles
  rationale: Mantém o plural explícito do grego e identifica naturalmente os possuidores.
