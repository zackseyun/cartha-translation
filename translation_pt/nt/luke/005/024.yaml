id: LUK.5.24
reference: Luke 5:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: pt
  text: 'Mas, para que vocês saibam que o Filho do Homem[a] tem autoridade na terra para perdoar pecados — disse ele ao homem paralisado —: “Eu lhe digo: levante-se, pegue sua esteira[b] e vá para sua casa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Ser Humano”. O título grego “Filho do Homem” foi mantido por ser uma autodesignação de Jesus e por carregar importantes ressonâncias bíblicas, especialmente com Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Ou “seu leito” ou “sua cama”. O termo grego κλινίδιον designa uma cama pequena, um leito simples ou uma esteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Mas, para que
  rationale: Preserva a transição levemente contrastiva de δέ e a finalidade introduzida por ἵνα, com formulação natural em português.
- source_word: εἰδῆτε
  choice: vocês saibam
  rationale: Expressa conhecimento e certeza; o plural explicita corretamente o destinatário coletivo indicado pela forma verbal grega.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação de Jesus e suas ressonâncias bíblicas, especialmente com Daniel 7, sem reduzir sua tensão interpretativa.
- source_word: ἐξουσίαν ἔχει
  choice: tem autoridade
  rationale: ἐξουσία comunica direito ou prerrogativa legítima, não apenas capacidade ou força.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Tradução locativa direta e idiomática, sem expansão interpretativa.
- source_word: ἀφιέναι ἁμαρτίας
  choice: para perdoar pecados
  rationale: No contexto, ἀφίημι denota perdoar ou remitir; esta é a expressão portuguesa mais clara e estabelecida.
- source_word: τῷ παραλελυμένῳ
  choice: ao homem paralisado
  rationale: O particípio substantivado identifica a pessoa por sua condição; a formulação é clara, atual e respeitosa.
- source_word: Σοὶ λέγω
  choice: Eu digo a você
  rationale: Conserva a ênfase do pronome Σοί e a solenidade da declaração direta.
- source_word: ἔγειρε
  choice: levante-se
  rationale: Imperativo imediato, natural e digno em português contemporâneo.
- source_word: ἄρας
  choice: pegue
  rationale: No encadeamento imperativo, comunica naturalmente a ação de levantar e levar consigo o objeto.
- source_word: κλινίδιόν σου
  choice: a sua esteira
  rationale: O diminutivo designa uma cama pequena, leito simples ou esteira; 'esteira' é concreta e adequada ao contexto, mantendo alternativas em nota.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: vá para a sua casa
  rationale: Reproduz de modo direto e idiomático a ordem de deslocamento até a própria casa.
theological_decisions:
- issue: Tradução de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional preserva a função cristológica da expressão, sua ligação provável com Daniel 7 e sua ambiguidade entre título e expressão semítica.
- issue: Nuance de ἐξουσία no perdão dos pecados
  choice: autoridade
  alternative: poder
  rationale: O debate diz respeito à prerrogativa legítima de perdoar pecados; 'autoridade' preserva melhor essa dimensão do que mera capacidade.
- issue: Alcance de ἐπὶ τῆς γῆς
  choice: na terra
  alternative: no âmbito terreno
  rationale: A tradução direta evita explicar além do texto e conserva aberta a relação entre o lugar da atuação e a autoridade exercida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural e 'você' para o singular, refletindo a mudança de destinatário no grego. O travessão conserva a interrupção narrativa em que Jesus passa da explicação à ordem dirigida ao homem.
