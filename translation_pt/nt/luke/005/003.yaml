id: LUK.5.3
reference: Luke 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: pt
  text: Então ele entrou em um dos barcos, que pertencia a Simão, e lhe pediu que o afastasse um pouco da margem.[a] Depois, sentou-se e, do barco, ensinava as multidões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da terra”; a expressão contrasta o barco com o solo firme. Também pode ser traduzida por “da praia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: entrou
  rationale: O particípio aoristo de ἐμβαίνω indica que Jesus entrou no barco antes de fazer o pedido; “entrou” é natural e preserva o movimento concreto.
- source_word: πλοίων / πλοίου
  choice: barcos / barco
  rationale: No contexto da pesca no lago, πλοῖον designa adequadamente uma embarcação pequena; os números plural e singular do grego foram preservados.
- source_word: ὃ ἦν Σίμωνος
  choice: que pertencia a Simão
  rationale: O genitivo Σίμωνος expressa posse, vertida de modo claro e corrente.
- source_word: ἠρώτησεν
  choice: pediu
  rationale: Neste contexto, ἐρωτάω tem o sentido de fazer um pedido, não apenas formular uma pergunta.
- source_word: ἐπαναγαγεῖν
  choice: que o afastasse
  rationale: No contexto náutico, ἐπανάγω indica levar a embarcação para longe da terra; o pronome retoma naturalmente o barco.
- source_word: ἀπὸ τῆς γῆς
  choice: da margem
  rationale: Embora γῆ signifique literalmente “terra”, neste cenário a referência concreta é à margem do lago. A nota preserva a expressão literal e seu contraste espacial.
- source_word: ὀλίγον
  choice: um pouco
  rationale: Preserva de forma concisa a pequena extensão indicada pelo acusativo adverbial.
- source_word: καθίσας
  choice: sentou-se
  rationale: O particípio aoristo apresenta a ação anterior ao ensino contínuo e é vertido naturalmente como verbo finito na narrativa.
- source_word: ἐκ τοῦ πλοίου
  choice: do barco
  rationale: A expressão indica o ponto a partir do qual Jesus ensinava; a colocação entre vírgulas mantém clara essa relação.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O imperfeito indica ação em curso; “ensinava” preserva esse aspecto habitual ou progressivo sem exigir uma locução pesada.
- source_word: τοὺς ὄχλους
  choice: as multidões
  rationale: Mantém o plural do grego e usa uma forma digna e amplamente compreensível em português.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem perder a sequência narrativa nem o aspecto contínuo do imperfeito grego.
