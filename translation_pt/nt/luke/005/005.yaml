  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: pt
  text: 'E Simão respondeu: “Mestre, trabalhamos duro a noite toda e não pegamos nada; mas, pela tua palavra[a], baixarei as redes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da tua palavra”. A expressão grega apresenta a palavra de Jesus como base ou razão para a ação de Simão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: respondeu
  rationale: A combinação participial é uma fórmula grega de introdução à fala direta; em português corrente, o verbo finito «respondeu» transmite-a naturalmente, sem a repetição pouco idiomática «respondendo, disse».
- source_word: Ἐπιστάτα
  choice: Mestre
  rationale: Em Lucas, o vocativo reconhece a autoridade de Jesus. «Mestre» é natural em português e evita substituir o termo pela carga potencialmente mais ampla de «Senhor», correspondente habitual de outro vocábulo grego.
- source_word: δι’ ὅλης νυκτὸς
  choice: a noite toda
  rationale: Expressão idiomática e clara que conserva a duração por toda a noite.
- source_word: κοπιάσαντες
  choice: trabalhamos duro
  rationale: Comunica de maneira acessível o esforço intenso expresso pelo verbo, mais claramente do que o simples «trabalhamos».
- source_word: οὐδὲν ἐλάβομεν
  choice: não pegamos nada
  rationale: No contexto da pesca, «pegar» comunica naturalmente a captura de peixes sem precisar explicitar um objeto ausente no grego.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: mas, pela tua palavra
  rationale: A construção indica que a palavra de Jesus é a base ou razão da ação de Simão. «Pela tua palavra» preserva essa relação sem decidir de modo excessivamente estreito entre fundamento, causa e deferência à ordem.
- source_word: χαλάσω
  choice: baixarei
  rationale: O futuro indica a ação de fazer descer as redes à água; «baixarei» é conciso e natural.
- source_word: τὰ δίκτυα
  choice: as redes
  rationale: Mantém o plural do texto da SBLGNT e é suficiente no contexto de pesca.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste entre o esforço infrutífero e a disposição de Simão para agir com base na palavra de Jesus.
theological_decisions:
- issue: Tradução do título Ἐπιστάτα dirigido a Jesus
  choice: Mestre
  alternative: Senhor
  rationale: O original emprega ἐπιστάτης, não κύριος. «Mestre» conserva o reconhecimento da autoridade de Jesus sem antecipar ou importar a força cristológica que «Senhor» pode ter em outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém «tua» em concordância com «Mestre», forma bíblica ainda corrente e natural neste registro. A coordenação simples e o plural «redes» seguem de perto o grego, enquanto «trabalhamos duro» explicita a intensidade lexical de κοπιάω.
