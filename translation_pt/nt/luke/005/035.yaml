id: LUK.5.35
reference: Luke 5:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: pt
  text: Mas virão dias, e, quando o noivo lhes for tirado[a], então jejuarão naqueles dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “for afastado deles”. O verbo grego indica que o noivo é tirado, não apenas que vai embora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: virão dias
  rationale: Preserva naturalmente o idioma grego e seu caráter prospectivo, sem acrescentar artigo definido.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste moderado entre a situação presente, em que não jejuam, e os dias futuros.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo aoristo, introduz uma ocorrência futura; “quando” é a forma mais natural em português.
- source_word: ἀπαρθῇ
  choice: for tirado
  rationale: Mantém a voz passiva e a ideia de remoção, mais forte que uma simples partida voluntária.
- source_word: ἀπ’ αὐτῶν
  choice: lhes
  rationale: O pronome dativo na construção portuguesa “lhes for tirado” expressa de modo natural a separação indicada por “deles” no grego.
- source_word: ὁ νυμφίος
  choice: o noivo
  rationale: “Noivo” é o termo corrente e preciso em português para a figura masculina do casamento e preserva a metáfora.
- source_word: τότε
  choice: então
  rationale: Conserva explicitamente a consequência temporal marcada no grego.
- source_word: νηστεύσουσιν
  choice: jejuarão
  rationale: Expressa especificamente o jejum, inclusive em seu sentido religioso, e mantém o futuro.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Preserva a repetição enfática do texto grego sem tornar a frase artificial em português.
theological_decisions:
- issue: Se a passiva “for tirado” deve ser suavizada como simples partida
  choice: 'Manter a formulação passiva e forte: “o noivo lhes for tirado”'
  alternative: “o noivo partir” ou “o noivo for embora”
  rationale: O passivo ἀπαρθῇ sugere que o noivo é removido, e não apenas que parte por vontade própria. A tradução conserva a tensão antecipatória sem explicar no próprio versículo a possível alusão à morte de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a repetição temporais do grego foram preservadas, e a colocação pronominal “lhes for tirado” mantém naturalidade sem perder a ideia de separação.
