id: LUK.5.15
reference: Luke 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: pt
  text: Mas a notícia a respeito dele se espalhava ainda mais[a], e grandes multidões se reuniam para ouvi-lo e para serem curadas de suas enfermidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra a respeito dele” ou “o relato a respeito dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: se espalhava
  rationale: O imperfeito expressa uma divulgação contínua; a forma pronominal é natural em português para uma notícia que circula.
- source_word: μᾶλλον
  choice: ainda mais
  rationale: Preserva a força comparativa e intensificadora em relação ao que já vinha acontecendo.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: a notícia a respeito dele
  rationale: No contexto narrativo, λόγος designa a notícia ou relato que circulava sobre Jesus, não um uso técnico ou teológico de “palavra”.
- source_word: συνήρχοντο
  choice: se reuniam
  rationale: O imperfeito indica ação contínua ou repetida, e o verbo comunica o ajuntamento das multidões.
- source_word: ὄχλοι πολλοὶ
  choice: grandes multidões
  rationale: É uma formulação idiomática que comunica a presença de numerosas multidões sem o pouco natural “muitas multidões”.
- source_word: ἀκούειν
  choice: para ouvi-lo
  rationale: O infinitivo indica propósito. O objeto está implícito no grego, mas é naturalmente recuperado em português como Jesus, sem alterar o sentido contextual.
- source_word: θεραπεύεσθαι
  choice: para serem curadas
  rationale: Mantém a voz passiva e o sentido direto de receber cura.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: de suas enfermidades
  rationale: No contexto de cura, ἀσθένεια refere-se a males físicos; “enfermidades” é claro, digno e combina naturalmente com “curadas de”.
theological_decisions:
- issue: Natureza da linguagem de cura
  choice: Traduzir θεραπεύεσθαι e ἀσθενειῶν em termos diretos de cura de enfermidades físicas.
  alternative: Usar linguagem mais ampla, como “ser restauradas” ou “tornar-se plenamente sãs”, que poderia sugerir restauração espiritual.
  rationale: O contexto imediato trata de pessoas que procuram Jesus para ouvi-lo e receber cura de males físicos; o versículo não explicita uma cura espiritual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Notícia” torna natural o valor contextual de λόγος; a nota preserva alternativas mais formais. A repetição de “para” mantém claros os dois propósitos das multidões.
