  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: pt
  text: 'E ninguém, depois de beber o vinho velho, quer o novo, pois diz: “O velho é bom[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “O velho é melhor”.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Expressa de modo natural e inclusivo a negação genérica referente a qualquer pessoa.
- source_word: πιὼν
  choice: depois de beber
  rationale: O particípio aoristo indica ação anterior à do verbo principal; esta formulação preserva com naturalidade a relação temporal.
- source_word: παλαιὸν
  choice: o vinho velho
  rationale: Embora o substantivo esteja implícito no grego, o contexto imediato permite explicitá-lo em português para assegurar clareza.
- source_word: θέλει
  choice: quer
  rationale: Aqui θέλω expressa desejo ou preferência; “quer” é corrente, direto e adequado ao caráter proverbial da frase.
- source_word: νέον
  choice: o novo
  rationale: Mantém a elipse do grego, com “vinho” claramente subentendido pelo contexto e pelo primeiro membro da frase.
- source_word: λέγει γάρ
  choice: pois diz
  rationale: Preserva a função explicativa de γάρ e introduz de modo conciso a fala direta.
- source_word: Ὁ παλαιὸς
  choice: O velho
  rationale: Conserva a elipse concisa do original, sem perder clareza, pois “vinho” está evidente no contexto.
- source_word: χρηστός
  choice: bom
  rationale: χρηστός significa aqui “bom” ou “agradável”, não sendo por si só uma forma comparativa. “Bom” é amplo e pouco interpretativo.
theological_decisions:
- issue: Tradução de χρηστός na afirmação sobre o vinho velho e o novo
  choice: bom
  alternative: melhor
  rationale: O texto grego impresso traz χρηστός, cujo sentido simples é “bom” ou “agradável”, e não o comparativo “melhor”. A leitura tradicional “melhor” é registrada em nota como variante textual, sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição parcial e as elipses do grego são preservadas quando naturais em português; “vinho” é explicitado apenas na primeira ocorrência para clareza.
