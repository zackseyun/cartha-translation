source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: pt
  text: 'O que é mais fácil: dizer: “Seus pecados estão perdoados”, ou dizer: “Levante-se e ande”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: O que é mais fácil
  rationale: Expressa de modo natural em português a pergunta idiomática sobre qual das duas alternativas é mais fácil.
- source_word: εἰπεῖν
  choice: dizer
  rationale: O infinitivo introduz o conteúdo das duas declarações contrastadas; “dizer” é a equivalência corrente e precisa.
- source_word: Ἀφέωνταί
  choice: estão perdoados
  rationale: Neste contexto, ἀφίημι se refere ao perdão dos pecados. A forma perfeita passiva apresenta um estado presente resultante de uma ação concluída; “estão perdoados” comunica esse estado sem explicitar indevidamente o agente.
- source_word: σοι ... αἱ ἁμαρτίαι σου
  choice: Seus pecados estão perdoados
  rationale: A reorganização sintática é idiomática em português e preserva tanto a referência pessoal quanto o sentido da declaração.
- source_word: ἢ
  choice: ou
  rationale: Mantém a disjunção entre as duas alternativas.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: Imperativo natural, atual e digno para a ordem de se erguer.
- source_word: καὶ περιπάτει
  choice: e ande
  rationale: Refere-se literalmente a caminhar e forma, em português, um par imperativo natural com “Levante-se”.
theological_decisions:
- issue: Representação do perfeito passivo na declaração de perdão sem acrescentar uma conclusão doutrinária sobre a agência
  choice: Seus pecados estão perdoados
  alternative: Seus pecados foram perdoados
  rationale: “Estão perdoados” destaca o estado presente resultante sem fazer do tempo verbal português uma afirmação teológica mais específica. A construção passiva continua sem identificar expressamente o agente.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. O paralelismo das duas ocorrências de “dizer” e a concisão da pergunta foram preservados.
