id: LUK.5.14
reference: Luke 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: pt
  text: 'E ele lhe ordenou: “Não diga nada a ninguém; vá, mostre-se ao sacerdote e apresente a oferta pela sua purificação, conforme Moisés ordenou,[a] como testemunho para eles.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Veja Levítico 14 sobre a oferta que Moisés ordenou para a purificação de uma pessoa com doença de pele.
    reason: cross_reference
  - marker: b
    text: Ou “como testemunho contra eles”. O pronome pode se referir aos sacerdotes ou a outras pessoas, e a expressão também pode ter o sentido de evidência contra eles.
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: Expressa uma instrução direta e autoritativa, sem acrescentar uma intensidade que o verbo não explicita.
- source_word: μηδενὶ εἰπεῖν
  choice: que não contasse isso a ninguém
  rationale: Formulação idiomática em português; “isso” explicita apenas o objeto naturalmente subentendido no contexto, isto é, o ocorrido.
- source_word: ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: Vá, mostre-se ao sacerdote
  rationale: Reproduz com naturalidade a ação preliminar do particípio e o imperativo principal, mantendo a sequência sem a rigidez de “tendo ido”.
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: apresente a oferta pela sua purificação
  rationale: O contexto cultual favorece uma oferta apresentada ao sacerdote. “Purificação” comunica a dimensão ritual de καθαρισμός e evita reduzir a expressão apenas à cura física.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: conforme Moisés ordenou
  rationale: Tradução direta que preserva a referência à prescrição da Lei mosaica.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: para servir de testemunho a eles
  rationale: Mantém o pronome sem identificar seu referente e conserva a possível amplitude de μαρτύριον como testemunho ou evidência.
theological_decisions:
- issue: Referente e força de αὐτοῖς em εἰς μαρτύριον αὐτοῖς
  choice: “a eles”, sem identificar o grupo nem definir o testemunho como favorável ou acusatório
  alternative: “aos sacerdotes” ou “como prova contra eles”
  rationale: O grego não explicita o referente do pronome nem determina por si só uma força positiva ou adversativa; a tradução preserva essa ambiguidade.
- issue: Natureza do καθαρισμός
  choice: “purificação”
  alternative: “limpeza”
  rationale: No contexto da legislação levítica, a palavra abrange reconhecimento e restauração de pureza ritual, não somente remoção física de doença.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto foi marcado para tornar natural a sequência das ordens. “Doença de pele” na nota evita impor ao termo levítico a identificação médica moderna com hanseníase.
