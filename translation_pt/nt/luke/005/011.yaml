  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: pt
  text: Depois de levarem os barcos para terra, deixaram tudo e o seguiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: Depois de levarem
  rationale: O particípio aoristo indica uma ação anterior à ação principal; a construção temporal é natural em português e preserva a sequência narrativa.
- source_word: τὰ πλοῖα
  choice: os barcos
  rationale: No contexto da pesca no mar da Galileia, «barcos» é a opção mais natural e precisa.
- source_word: ἐπὶ τὴν γῆν
  choice: para terra
  rationale: Expressa naturalmente em português o movimento dos barcos até a terra, sem restringir γῆ especificamente à praia.
- source_word: ἀφέντες
  choice: deixaram
  rationale: Aqui ἀφίημι tem o sentido de deixar para trás; a forma verbal coordenada torna a frase clara sem alterar a progressão das ações.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente; «tudo» comunica essa totalidade de modo direto e idiomático.
- source_word: ἠκολούθησαν αὐτῷ
  choice: o seguiram
  rationale: Preserva tanto a ação narrativa de ir atrás de Jesus quanto sua implicação de discipulado, sem explicá-la além do texto.
theological_decisions:
- issue: Alcance da renúncia em πάντα
  choice: deixaram tudo
  alternative: deixaram todas as coisas
  rationale: «Tudo» mantém a força abrangente do texto sem especificar quais bens ou relações foram deixados, nem concluir se a renúncia material foi permanente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono.
