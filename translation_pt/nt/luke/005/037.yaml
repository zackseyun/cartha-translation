source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: pt
  text: E ninguém põe vinho novo em odres velhos.[a] Caso contrário, o vinho novo romperá os odres, e o próprio vinho se derramará[b], e os odres ficarão arruinados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Odres são recipientes feitos de pele, usados para guardar vinho e outros líquidos.
    reason: lexical_clarification
  - marker: b
    text: 'Ou: “será derramado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: põe
  rationale: Verbo geral de colocação; “põe” preserva o sentido sem explicitar, de modo interpretativo, o ato de despejar.
- source_word: οἶνον νέον
  choice: vinho novo
  rationale: Equivalente tradicional, claro e adequado ao contexto de fermentação.
- source_word: ἀσκοὺς παλαιούς
  choice: odres velhos
  rationale: “Odres” designa recipientes feitos de pele, especialmente usados para líquidos, e é uma palavra bíblica corrente em português; a nota esclarece o objeto.
- source_word: εἰ δὲ μήγε
  choice: Caso contrário
  rationale: Expressa naturalmente a consequência condicional introduzida pela locução grega.
- source_word: ῥήξει
  choice: romperá
  rationale: Indica que o vinho causará a ruptura dos recipientes; “romperá” conserva a construção transitiva do grego.
- source_word: ἐκχυθήσεται
  choice: se derramará
  rationale: O futuro passivo grego descreve o vinho saindo e sendo perdido após a ruptura; a construção pronominal é natural em português.
- source_word: ἀπολοῦνται
  choice: ficarão arruinados
  rationale: Aplicado aos odres, comunica que serão inutilizados, sem sugerir necessariamente aniquilação.
- source_word: καὶ αὐτός
  choice: se derramará
  rationale: O pronome enfático retoma o vinho novo. Em português, a referência fica clara pelo sujeito elíptico, sem a formulação pouco natural “ele próprio”.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto, natural e adequado ao tom proverbial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva a imagem histórica dos odres e a sequência causal do grego.
