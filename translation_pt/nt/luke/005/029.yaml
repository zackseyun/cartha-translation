source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: pt
  text: Então Levi ofereceu a Jesus um grande banquete em sua casa. Havia uma grande multidão de cobradores de impostos e de outras pessoas, todos reclinados à mesa com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “com eles”. O grego emprega um pronome plural; conforme se entenda seu referente no contexto, a expressão também pode ser compreendida como “à mesa com Jesus”.
    reason: alternative_reading
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: um grande banquete
  rationale: δοχή designa uma recepção ou refeição festiva oferecida por alguém; “grande banquete” expressa com naturalidade a importância da ocasião.
- source_word: αὐτῷ
  choice: a Jesus
  rationale: Embora o grego use um pronome, explicitar “Jesus” evita a ambiguidade pouco natural de “lhe” ou “para ele” em português e identifica corretamente o referente imediato.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: em sua casa
  rationale: Tradução direta e idiomática; pelo contexto, o possessivo se refere a Levi.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: uma grande multidão de cobradores de impostos
  rationale: Preserva tanto a ideia coletiva de ὄχλος quanto a grande quantidade indicada por πολύς, usando a designação mais clara para τελῶναι.
- source_word: ἄλλων
  choice: outras pessoas
  rationale: O substantivo implícito é explicitado para dar fluência em português, sem definir quem eram essas pessoas.
- source_word: κατακείμενοι
  choice: reclinadas à mesa
  rationale: Expressa a postura habitual dos participantes de refeições formais no mundo mediterrâneo antigo e deixa claro o contexto da refeição.
- source_word: μετ’ αὐτῶν
  choice: com eles
  rationale: Mantém o pronome plural do texto grego e sua referência coletiva, sem corrigi-lo para o singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Então” comunica a progressão narrativa de καί. A explicitação de Jesus e de “pessoas” favorece a naturalidade sem acrescentar conteúdo interpretativo indevido; a nota preserva a possível variação de referência em μετ’ αὐτῶν.
