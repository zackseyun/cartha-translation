id: LUK.5.8
reference: Luke 5:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: pt
  text: 'Ao ver isso, Simão Pedro caiu aos joelhos de Jesus e disse: “Afasta-te de mim, porque sou um homem pecador, Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: Ao ver isso
  rationale: 'O particípio aoristo é expresso naturalmente com valor temporal. “Isso” explicita de modo mínimo o objeto implícito no contexto: a pesca extraordinária.'
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca a progressão narrativa e uma leve mudança de foco. Em português, essa transição já é comunicada naturalmente por “Ao ver isso”, sem necessidade de acrescentar “mas” ou “então”.
- source_word: Σίμων Πέτρος
  choice: Simão Pedro
  rationale: Preserva os dois nomes presentes no texto grego.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: lançou-se aos joelhos de Jesus
  rationale: Expressa de maneira viva e idiomática o movimento de cair em direção aos joelhos de Jesus, preservando a postura corporal descrita.
- source_word: λέγων
  choice: e disse
  rationale: A coordenação é mais natural em português narrativo do que o particípio literal “dizendo”, sem alterar a relação entre as ações.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Afasta-te de mim
  rationale: Traduz o pedido urgente de separação em linguagem atual e dignificada. “Retira-te de mim” seria possível, mas soa mais solene e menos corrente.
- source_word: ὅτι
  choice: porque
  rationale: Introduz diretamente a razão do pedido de Simão Pedro.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: um homem pecador
  rationale: Mantém o substantivo especificamente masculino e o adjetivo predicativo, ambos referentes ao próprio Simão Pedro.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva a reverência e a possível profundidade cristológica do vocativo, sem reduzi-lo a simples tratamento cortês.
theological_decisions:
- issue: Sentido de κύριε na forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: senhor; mestre
  rationale: Diante do sinal e em conexão com a confissão de pecado, “Senhor” conserva tanto o respeito imediato quanto a possível dimensão teológica, sem afirmar mais do que o contexto permite.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A ordem final do vocativo “Senhor” acompanha o grego e conserva a força emocional da confissão. Não se reproduziu a nota inglesa marcada [a], pois ela está associada a “saw it”, mas seu conteúdo trata de Ἔξελθε; a alternativa lexical foi registrada nas decisões, sem criar uma nota deslocada.
