  source_fidelity: A tradução preserva adequadamente o valor temporal de ἰδών, o objeto implícito suprido por “isso”, os dois nomes, o pedido de afastamento, a confissão de ser “um homem pecador” e o vocativo “Senhor”. A omissão de δέ como partícula autônoma é aceitável em português, pois a progressão narrativa permanece clara.
  naturalness: “Lançou-se aos joelhos de Jesus” é compreensível, mas é uma colocação menos idiomática em português moderno. “Caiu aos joelhos de Jesus” é mais direta e natural, mantendo a localização corporal específica do grego, sem substituí-la genericamente por “aos pés”.
  terminology: “Simão Pedro”, “homem pecador” e “Senhor” são escolhas adequadas. “Senhor” conserva a reverência e a abertura semântica de κύριε sem impor uma leitura confessional mais desenvolvida.
