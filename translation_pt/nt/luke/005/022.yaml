id: LUK.5.22
reference: Luke 5:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: pt
  text: 'Mas Jesus, percebendo os pensamentos deles, respondeu: “Por que vocês ficam raciocinando nos seus corações?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: percebendo
  rationale: Expressa a plena consciência de Jesus a respeito do que se passava interiormente neles, sem explicar nem exagerar o modo desse conhecimento.
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve transição contrastiva entre a objeção interior anterior e a reação de Jesus.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: os pensamentos deles
  rationale: Neste contexto, designa suas reflexões e objeções interiores; “pensamentos” é claro e natural, enquanto o verbo seguinte conserva a ideia de raciocínio ativo.
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A construção grega contém literalmente “respondendo, disse”, fórmula narrativa semítica que em português corrente e digno é expressa naturalmente por “respondeu”, sem perda significativa de conteúdo.
- source_word: Τί διαλογίζεσθε
  choice: Por que vocês ficam raciocinando assim
  rationale: Τί tem aqui valor idiomático de “por que”; a locução “ficam raciocinando assim” comunica a deliberação interior em andamento e liga naturalmente a pergunta ao contexto precedente.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: no coração
  rationale: Preserva a linguagem antropológica bíblica, na qual o coração representa o centro interior do pensamento e da vontade; o singular distributivo soa mais natural em português.
theological_decisions:
- issue: Natureza do conhecimento de Jesus acerca dos pensamentos interiores
  choice: Declarar simplesmente que Jesus percebeu os pensamentos deles
  alternative: Explicitar que ele os conheceu sobrenaturalmente, ou atenuar dizendo que apenas os inferiu
  rationale: O texto afirma a consciência de Jesus acerca do raciocínio interior deles, mas não explica o mecanismo. A tradução preserva essa tensão sem ampliação nem redução interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” oferece clareza contemporânea; “no coração” preserva o idiomatismo bíblico sem soar excessivamente arcaico.
