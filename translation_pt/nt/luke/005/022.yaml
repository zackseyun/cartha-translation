    issue: Inclusão de “assim” na pergunta de Jesus.
    rationale: O grego pergunta simplesmente “Por que vocês raciocinam em seus corações?”. Embora “assim” possa aludir ao contexto, acrescenta um elemento demonstrativo não expresso no texto-fonte.
  - severity: low
    issue: Uso do singular “no coração” para ἐν ταῖς καρδίαις ὑμῶν.
    rationale: O singular distributivo é possível em português, mas o original traz explicitamente “nos corações de vocês”. O plural preserva melhor a forma e o alcance da expressão, sem perder naturalidade.
