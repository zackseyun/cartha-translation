review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente que Jesus tomou conhecimento dos pensamentos interiores deles e responde a esse raciocínio. Contudo, “assim” não tem correspondente explícito no grego, e o singular “no coração” deixa de refletir o plural expresso em ἐν ταῖς καρδίαις ὑμῶν.
  naturalness: O português é moderno, claro e de registro apropriado. “Por que vocês ficam raciocinando” é compreensível e reproduz razoavelmente o presente de διαλογίζεσθε; a forma sem “assim” é mais enxuta e mais fiel.
  terminology: “Pensamentos”, “raciocinando” e “corações” conservam a distinção contextual entre os pensamentos deles e o ato de raciocinar, bem como a expressão antropológica bíblica καρδία, sem explicar o modo do conhecimento de Jesus.
  issues:
