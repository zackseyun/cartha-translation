  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: pt
  text: E, deixando tudo para trás[a], ele se levantou e o seguiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo deixado tudo, levantou-se e o seguiu”.'
    reason: Alternativa que torna mais explícita a anterioridade dos particípios aoristos em relação ao verbo principal.
lexical_decisions:
- source_word: καταλιπὼν
  choice: deixando ... para trás
  rationale: O particípio aoristo de καταλείπω apresenta uma ação anterior à ação principal; a expressão é natural em português e comunica uma renúncia decisiva sem intensificá-la indevidamente como “abandonando”.
- source_word: πάντα
  choice: tudo
  rationale: O acusativo neutro plural tem sentido abrangente; “tudo” preserva de forma idiomática a totalidade expressa no grego.
- source_word: ἀναστὰς
  choice: ele se levantou
  rationale: O particípio aoristo de ἀνίστημι, neste contexto narrativo, descreve Levi levantando-se para agir.
- source_word: ἠκολούθει
  choice: seguiu
  rationale: Embora o imperfeito possa destacar ação continuada, neste contexto “seguiu” expressa naturalmente o ingresso de Levi no seguimento de Jesus sem acrescentar explicitamente um valor incoativo que o verbo não exige.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome dativo retoma Jesus no contexto imediato; o pronome português preserva essa coesão sem repetir o nome.
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação simples do grego e a ligação direta com o chamado narrado no versículo anterior.
theological_decisions:
- issue: Alcance da renúncia de Levi no discipulado
  choice: O texto declara que Levi deixou “tudo” e seguiu Jesus, sem definir se isso implica despojamento permanente de todos os bens.
  alternative: Entender que ele apenas deixou temporariamente o trabalho, ou que renunciou de modo permanente a todas as posses.
  rationale: A tradução conserva a linguagem abrangente de πάντα e a resposta decisiva ao chamado, mas não transforma a cena em uma afirmação doutrinária mais específica sobre propriedade ou vocação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Deixando tudo para trás” é corrente sem ser coloquial demais; a nota oferece uma formulação mais formal e estruturalmente próxima do grego.
