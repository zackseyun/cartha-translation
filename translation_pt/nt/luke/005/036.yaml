reference: Luke 5:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: pt
  text: 'Ele também lhes contou uma parábola: “Ninguém rasga um pedaço de uma roupa nova e o põe numa roupa velha.[a] Se fizer isso, rasgará a nova, e o remendo tirado da nova não combinará com a velha.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Ninguém, depois de rasgar um pedaço de uma roupa nova, o põe numa roupa velha”. O grego emprega um particípio aoristo (“depois de rasgar”) antes do verbo principal.'
    reason: lexical_alternative
  - marker: b
    text: “Não combinará” também pode ser traduzido por “não servirá” ou “não ficará adequado”. O verbo grego indica falta de correspondência ou de adequação entre o remendo novo e a roupa velha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Ele também lhes contou
  rationale: O imperfeito ἔλεγεν pode retratar a fala em andamento, mas, neste contexto narrativo, o pretérito perfeito é mais natural em português. “Também” representa καί, enquanto δέ marca suavemente a progressão do discurso.
- source_word: παραβολὴν
  choice: uma parábola
  rationale: “Parábola” é o termo corrente e preserva a categoria literária indicada por Lucas.
- source_word: ἐπίβλημα
  choice: um pedaço / o remendo
  rationale: Na primeira ocorrência, “um pedaço” funciona naturalmente como objeto tirado da roupa nova; na segunda, sua finalidade já está clara, e “o remendo” explicita de modo idiomático a peça aplicada à roupa velha.
- source_word: ἱμάτιον
  choice: roupa
  rationale: O termo designa uma peça de vestuário. “Roupa” é amplo, natural e de fácil compreensão, sem restringir indevidamente o referente a um manto.
- source_word: σχίσας
  choice: rasga
  rationale: 'Embora seja um particípio aoristo, a construção portuguesa fica mais natural com dois verbos coordenados: “rasga ... e põe”, preservando a sequência das ações.'
- source_word: ἐπιβάλλει ἐπὶ
  choice: o põe numa roupa velha
  rationale: Traduz a ideia básica de colocar sobre, sem acrescentar que o pedaço foi necessariamente costurado.
- source_word: εἰ δὲ μήγε
  choice: Se fizer isso
  rationale: A expressão introduz as consequências da ação anteriormente negada. A forma explícita é clara e idiomática em português.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: rasgará a nova
  rationale: O futuro ativo tem como sujeito implícito a pessoa que tira o pedaço. “A nova” retoma naturalmente “roupa nova” e evita repetição pesada.
- source_word: οὐ συμφωνήσει
  choice: não combinará
  rationale: No contexto de vestuário, συμφωνέω comunica falta de correspondência, adequação ou harmonia. “Não combinará” preserva essa amplitude melhor que uma formulação estritamente ligada ao tamanho.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém a imagem concreta do vestuário, evita especificar que o remendo é costurado e conserva a responsabilidade do agente por estragar a roupa nova.
