base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: pt
  text: Então fizeram sinal aos seus parceiros, que estavam no outro barco, para que viessem ajudá-los. Eles vieram e encheram ambos os barcos, a ponto de começarem a afundar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que os barcos estavam afundando”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: fizeram sinal
  rationale: Expressa com naturalidade um gesto ou sinal feito à distância, adequado ao contexto dos barcos.
- source_word: μετόχοις
  choice: companheiros
  rationale: Designa aqui os associados na atividade da pesca; “companheiros” é claro e natural, embora “sócios” também seja possível.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: que estavam no outro barco
  rationale: Torna explícita em português a localização dos companheiros e preserva a distinção entre os barcos.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: para que viessem ajudá-los
  rationale: Reproduz a finalidade da construção grega e o sentido contextual de prestar ajuda conjunta.
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: encheram os dois barcos
  rationale: Preserva diretamente a imagem de ambos os barcos cheios, deixando que o contexto indique que estavam cheios de peixes.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: a ponto de começarem a afundar
  rationale: Comunica o resultado como um processo em curso, sem afirmar que os barcos chegaram a afundar completamente.
