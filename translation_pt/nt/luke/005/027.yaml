id: LUK.5.27
reference: Luke 5:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: pt
  text: 'Depois disso, ele saiu e viu[a] um cobrador de impostos chamado Levi, sentado no posto de cobrança[b], e lhe disse: “Siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observou” ou “reparou em”; o verbo grego pode indicar mais do que um olhar passageiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “no posto de pedágio” ou “na alfândega”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente em português a transição narrativa marcada pelo demonstrativo plural grego, sem sugerir uma ligação temporal mais precisa do que o texto oferece.
- source_word: ἐξῆλθεν
  choice: ele saiu
  rationale: Preserva o sentido concreto e direto do aoristo de ἐξέρχομαι.
- source_word: ἐθεάσατο
  choice: viu
  rationale: É a forma mais natural no fluxo narrativo; a nota registra que o verbo também pode indicar um olhar mais atento do que uma percepção passageira.
- source_word: τελώνην
  choice: cobrador de impostos
  rationale: Designa com clareza a função de Levi e é amplamente compreensível no português moderno.
- source_word: ὀνόματι Λευὶν
  choice: chamado Levi
  rationale: Reproduz de modo idiomático e conciso a construção grega com ὄνομα.
- source_word: καθήμενον
  choice: sentado
  rationale: Mantém o particípio descritivo e apresenta Levi em seu local de trabalho.
- source_word: ἐπὶ τὸ τελώνιον
  choice: no posto de cobrança
  rationale: τελώνιον é o lugar onde se cobravam impostos, taxas ou pedágios; “posto de cobrança” mantém essa amplitude sem impor um cenário administrativo moderno.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Conserva a forma direta do imperativo e sua força contextual de chamado ao discipulado, sem acrescentar explicação ao texto.
theological_decisions:
- issue: Força do imperativo de Jesus como chamado ao discipulado
  choice: Siga-me
  alternative: Torne-se meu discípulo
  rationale: O contexto confere ao imperativo a força de um chamado ao discipulado, mas a tradução preserva a formulação concisa do grego e não explicita além do que foi dito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Cobrador de impostos” evita tecnicismo desnecessário; “posto de cobrança” preserva a possível referência a impostos, taxas, pedágios ou alfândega. Os marcadores foram posicionados junto aos termos a que suas notas realmente se referem.
