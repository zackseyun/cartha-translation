id: LUK.5.18
reference: Luke 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: pt
  text: E eis que alguns homens traziam, sobre um leito[a], um homem que estava paralisado; e tentavam levá-lo para dentro e colocá-lo diante dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre uma maca” ou “sobre um divã”; o grego κλίνη pode designar uma cama, um catre ou um móvel semelhante a um divã.
    reason: lexical_alternative
  - marker: b
    text: Isto é, diante de Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a função de chamar a atenção e a vivacidade narrativa, em uma expressão consagrada e ainda compreensível em português.
- source_word: ἄνδρες
  choice: alguns homens
  rationale: Mantém a referência específica a homens adultos; “alguns” torna natural em português a introdução de participantes indefinidos.
- source_word: φέροντες
  choice: traziam
  rationale: O imperfeito perifrástico grego apresenta a ação em andamento; “traziam” comunica naturalmente esse aspecto no contexto.
- source_word: ἐπὶ κλίνης
  choice: sobre um leito
  rationale: “Leito” conserva a amplitude de κλίνη como objeto semelhante a uma cama ou divã, sem impor a interpretação mais específica de “maca”.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: No contexto, refere-se a um indivíduo do sexo masculino, e “um homem” é claro e natural.
- source_word: παραλελυμένος
  choice: estava paralisado
  rationale: Expressa o estado resultante indicado pelo particípio perfeito passivo sem transformar a condição em designação identitária.
- source_word: ἐζήτουν
  choice: tentavam
  rationale: Neste contexto, o verbo no imperfeito descreve uma tentativa contínua; “tentavam” comunica isso com mais naturalidade do que o literal “procuravam”.
- source_word: εἰσενεγκεῖν
  choice: levá-lo para dentro
  rationale: Transmite o movimento para o interior expresso pelo verbo composto e se ajusta ao fato de o homem estar sendo transportado.
- source_word: θεῖναι
  choice: colocá-lo
  rationale: Verbo amplo e natural que não especifica além do grego a postura em que o homem seria posto.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Preserva o pronome do texto grego e, portanto, sua forma referencial, em vez de substituí-lo diretamente pelo nome de Jesus.
theological_decisions:
- issue: Referente de αὐτοῦ no fim do versículo
  choice: diante dele
  alternative: diante de Jesus
  rationale: O contexto identifica Jesus como o referente, mas o grego usa um pronome. A tradução mantém esse pronome, e a nota esclarece o referente sem alterar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” preserva a vivacidade do marcador narrativo; “leito” evita especificidade indevida, e “tentavam” comunica de modo idiomático a ação contínua de ἐζήτουν.
