id: LUK.5.1
reference: Luke 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: pt
  text: Aconteceu que, enquanto a multidão se apertava contra ele e ouvia a palavra de Deus[a], ele estava em pé à beira do lago de Genesaré[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando a multidão se apertava contra ele e ouvia a palavra de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: Genesaré é o lago também conhecido como mar da Galileia.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Reproduz a fórmula narrativa frequente em Lucas de maneira natural em português. O δέ tem aqui leve função de transição e não exige um marcador temporal como “agora”.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: enquanto a multidão se apertava contra ele e ouvia
  rationale: A construção com infinitivos articulados tem valor temporal. “Enquanto” expressa a ação em curso, e os dois infinitivos coordenados permanecem explícitos, sem transformar o ato de ouvir em finalidade.
- source_word: ὄχλον
  choice: a multidão
  rationale: Equivalente corrente e claro para ὄχλος neste contexto.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: se apertava contra ele
  rationale: Comunica a pressão física exercida pela multidão, preservando a força do verbo sem recorrer a linguagem artificial.
- source_word: ἀκούειν
  choice: ouvia
  rationale: “Ouvir” é natural em português e, no contexto, comunica atenção à mensagem proclamada.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva a formulação bíblica tradicional, sua amplitude semântica e suas ressonâncias intertextuais.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: ele estava em pé
  rationale: A construção perifrástica descreve uma postura contínua. O pronome αὐτός não requer ênfase adicional neste contexto.
- source_word: παρὰ τὴν λίμνην
  choice: à beira do lago
  rationale: Expressão portuguesa natural para a posição junto ao lago indicada por παρά com acusativo.
- source_word: Γεννησαρέτ
  choice: Genesaré
  rationale: Emprega a forma transliterada consagrada em português e mantém o nome específico presente no texto grego.
theological_decisions:
- issue: Tradução de τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  alternative: a mensagem de Deus
  rationale: A expressão pode designar a mensagem divina proclamada, mas “a palavra de Deus” conserva melhor tanto a forma do original quanto sua amplitude teológica, sem restringir o sentido.
- issue: Identificação de Γεννησαρέτ
  choice: Genesaré
  alternative: mar da Galileia
  rationale: O texto grego chama o lago de Genesaré. Substituir esse nome por “mar da Galileia” introduziria no corpo do texto uma identificação explicativa não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no trecho seguinte. A formulação evita transformar os infinitivos coordenados em uma relação explícita de finalidade.
