  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: pt
  text: 'E também Tiago e João, filhos de Zebedeu, que eram sócios de Simão. E Jesus disse a Simão: “Não tenha medo; de agora em diante você apanhará pessoas vivas”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “capturará pessoas vivas”. O verbo grego significa capturar ou tomar vivo, preservando uma nuance distinta da expressão mais conhecida “pescadores de homens” em Mateus 4:19 e Marcos 1:17.'
    reason: lexical_alternative
  - marker: b
    text: 'Compare Mateus 4:19 e Marcos 1:17, onde Jesus diz: “Farei de vocês pescadores de homens”. A formulação de Lucas aqui é diferente e não deve ser harmonizada com a dos paralelos.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: e igualmente
  rationale: Expressa de modo natural em português a força comparativa e aditiva, ligando Tiago e João à reação já mencionada.
- source_word: υἱοὺς Ζεβεδαίου
  choice: filhos de Zebedeu
  rationale: Forma corrente e fiel de identificação familiar em português.
- source_word: κοινωνοὶ
  choice: sócios
  rationale: No contexto da atividade pesqueira, indica mais provavelmente parceiros de trabalho ou negócio, e não apenas companheiros.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Formulação idiomática, atual e pastoral, adequada à proibição grega.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Marca naturalmente a transição decisiva na vocação de Simão.
- source_word: ἀνθρώπους
  choice: pessoas
  rationale: O substantivo grego se refere aqui aos seres humanos em geral, sem restrição ao sexo masculino.
- source_word: ζωγρῶν
  choice: apanhará pessoas com vida
  rationale: Preserva tanto a imagem de apanhar quanto o componente lexical de tomar ou capturar vivo, sem harmonizar a formulação de Lucas com Mateus 4:19 e Marcos 1:17.
theological_decisions:
- issue: A metáfora de ζωγρέω no chamado de Simão
  choice: você apanhará pessoas com vida
  alternative: você pescará pessoas
  rationale: Lucas emprega um verbo distinto da expressão “pescadores de homens” encontrada nos paralelos. A tradução conserva a noção de apanhar com vida e a tensão própria da metáfora.
- issue: Abrangência de gênero de ἀνθρώπους
  choice: pessoas
  alternative: homens
  rationale: Neste contexto, o referente são seres humanos em geral; “pessoas” comunica essa abrangência sem acrescentar uma limitação masculina.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Sócios” torna explícito o contexto de parceria profissional; “apanhará pessoas com vida” mantém a formulação própria e incomum de Lucas. Os marcadores foram colocados após a declaração completa à qual ambas as notas se referem.
