source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: pt
  text: E viu dois barcos parados junto ao lago; os pescadores, porém, haviam desembarcado dos barcos e estavam lavando as redes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: viu
  rationale: O aoristo de ὁράω é naturalmente traduzido por “viu” na narrativa, sem acrescentar a nuance de percepção súbita que “notou” poderia sugerir.
- source_word: δύο πλοῖα
  choice: dois barcos
  rationale: No contexto da pesca em um lago, “barcos” é a designação moderna e natural; “navios” sugeriria embarcações maiores.
- source_word: ἑστῶτα
  choice: parados
  rationale: O particípio perfeito descreve os barcos em posição estacionária. “Parados” é natural em português e evita especificar que estivessem atracados ou ancorados.
- source_word: παρὰ τὴν λίμνην
  choice: junto ao lago
  rationale: παρά com acusativo indica posição ao lado de; “junto ao lago” expressa isso de modo claro e idiomático.
- source_word: οἱ δὲ ἁλιεῖς
  choice: os pescadores, porém
  rationale: δέ introduz um contraste leve ou mudança de foco entre os barcos e os pescadores; “porém” preserva essa relação sem torná-la excessivamente forte.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: haviam desembarcado deles
  rationale: O particípio aoristo indica ação anterior à lavagem das redes. “Haviam desembarcado” comunica naturalmente essa sequência, e “deles” mantém explícita a referência aos barcos.
- source_word: ἔπλυνον
  choice: estavam lavando
  rationale: O imperfeito apresenta a ação em andamento na cena; a forma progressiva portuguesa preserva esse aspecto.
- source_word: τὰ δίκτυα
  choice: as redes
  rationale: O grego traz o artigo, mas não um possessivo. “As redes” permanece transparente ao texto sem acrescentar “suas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula organiza a mudança de foco marcada por δέ sem fragmentar o versículo. Não se acrescentou que os barcos estavam atracados nem que os pescadores tinham ido à margem, pois essas ideias são contextualmente plausíveis, mas não explícitas.
