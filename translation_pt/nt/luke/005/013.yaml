source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: pt
  text: 'E, estendendo a mão, tocou nele e disse: “Quero; fique limpo.” E imediatamente a lepra[a] o deixou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais amplo, “doença de pele”; no uso bíblico, o termo grego λέπρα pode designar várias doenças da pele, e não apenas a hanseníase moderna.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: estendendo a mão
  rationale: Mantém a ação física expressa pelo particípio aoristo e soa natural em português.
- source_word: ἥψατο αὐτοῦ
  choice: tocou nele
  rationale: Expressa de modo claro o sentido idiomático de ἅπτομαι com objeto no genitivo e preserva a importância do contato físico.
- source_word: εἰπών
  choice: e disse
  rationale: Converte o particípio em verbo coordenado para obter fluidez natural em português, sem alterar a sequência da ação.
- source_word: Θέλω
  choice: Quero
  rationale: Neste contexto, comunica de forma direta tanto a vontade quanto a disposição de Jesus para purificar o homem.
- source_word: καθαρίσθητι
  choice: fique limpo
  rationale: Preserva o campo semântico de limpeza e pureza, que inclui a cura física e a remoção da impureza ritual, em linguagem atual e compreensível.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente temporal direto e corrente em português.
- source_word: λέπρα
  choice: lepra
  rationale: Mantém o termo tradicional e reconhecível, enquanto a nota esclarece que seu alcance antigo era mais amplo que o diagnóstico moderno.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: o deixou
  rationale: Forma idiomática e concisa de representar o afastamento completo da doença.
theological_decisions:
- issue: Sentido de καθαρίσθητι na cura de uma pessoa com λέπρα
  choice: fique limpo
  alternative: seja curado; seja purificado
  rationale: A formulação conserva a dimensão de limpeza física, ritual e social do grego, sem reduzir o acontecimento a uma cura apenas médica nem tornar a fala excessivamente técnica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação “e disse” é mais natural que a reprodução rígida do particípio. O marcador da nota foi colocado junto de “lepra”, termo ao qual a explicação se refere.
