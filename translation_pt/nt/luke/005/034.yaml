id: LUK.5.34
reference: Luke 5:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: pt
  text: 'Então ele lhes disse: “Vocês não podem fazer os convidados do casamento jejuar enquanto o noivo está com eles, podem?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Vocês não podem... podem?
  rationale: A pergunta com μή espera resposta negativa. A formulação conserva de modo natural em português a força retórica do grego.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: os convidados do casamento
  rationale: A expressão idiomática, literalmente ‘os filhos da câmara nupcial’, designa os participantes ou companheiros do noivo na celebração. A tradução comunica o sentido sem introduzir uma imagem espacial enganosa.
- source_word: νυμφίος
  choice: noivo
  rationale: Equivalente corrente e claro em português, que preserva a imagem nupcial do texto.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: está com eles
  rationale: Tradução direta e natural da presença do noivo junto aos participantes da celebração.
- source_word: ποιῆσαι νηστεῦσαι
  choice: fazer ... jejuar
  rationale: Preserva o valor causativo de ποιέω seguido de infinitivo, em vez de reduzir a pergunta à capacidade dos convidados de jejuar.
- source_word: νηστεῦσαι
  choice: jejuar
  rationale: É o equivalente português conciso e convencional para a abstinência religiosa de alimento neste contexto.
theological_decisions:
- issue: Identificação metafórica de Jesus como o noivo
  choice: Manter a imagem do noivo sem explicar sua significação teológica no texto principal.
  alternative: Explicitar interpretativamente que Jesus se identifica com a figura do noivo.
  rationale: O próprio dito apresenta e sugere a metáfora, mas explicá-la na tradução acrescentaria interpretação além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome ‘vocês’ torna explícito o plural de αὐτούς e é amplamente compreensível. ‘Convidados do casamento’ traduz idiomaticamente a expressão grega; como a literalidade não é necessária para compreender o versículo, não se acrescentou nota de rodapé.
