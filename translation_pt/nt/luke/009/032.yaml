id: LUK.9.32
reference: Luke 9:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: pt
  text: Pedro e os que estavam com ele estavam vencidos pelo sono; mas, quando despertaram por completo[a], viram a glória de Jesus e os dois homens que estavam de pé com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de acordarem” ou “quando ficaram plenamente despertos”. O verbo grego é raro e pode enfatizar que eles ficaram totalmente alertas, em vez de indicar que permaneceram acordados durante todo o tempo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: vencidos pelo sono
  rationale: Expressa naturalmente em português o estado intenso de estarem dominados ou oprimidos pelo sono, preservando mais força que a simples formulação “estavam sonolentos”.
- source_word: διαγρηγορήσαντες
  choice: quando despertaram por completo
  rationale: O verbo raro provavelmente indica que eles chegaram a um estado de plena vigília, em contraste com estarem vencidos pelo sono; a nota preserva a alternativa lexical.
- source_word: τὴν δόξαν αὐτοῦ
  choice: a glória de Jesus
  rationale: “Glória” mantém a ressonância bíblica de δόξα. O nome “Jesus” explicita com naturalidade o referente de αὐτοῦ em português e evita uma sequência pronominal potencialmente ambígua.
- source_word: τοὺς δύο ἄνδρας
  choice: os dois homens
  rationale: Tradução idiomática e exata de ἀνήρ para os dois homens adultos, identificados no contexto como Moisés e Elias.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: que estavam de pé com ele
  rationale: Preserva tanto o estado resultante expresso pelo particípio perfeito quanto a disposição visual da cena.
- source_word: δὲ … δὲ
  choice: '[não expresso] … mas'
  rationale: O primeiro δέ apenas desenvolve o discurso e pode ficar implícito em português; o segundo introduz o contraste entre o peso do sono e a visão subsequente, sendo traduzido por “mas”.
theological_decisions:
- issue: Sentido de δόξα no contexto da transfiguração
  choice: a glória de Jesus
  alternative: o esplendor dele / a majestade dele
  rationale: “Glória” conserva a linguagem e as conexões teológicas bíblicas sem explicar além do que o texto afirma.
- issue: Interpretação de διαγρηγορήσαντες
  choice: quando despertaram por completo
  alternative: tendo permanecido acordados
  rationale: A leitura escolhida se ajusta melhor ao contraste com estarem vencidos pelo sono, mas a raridade do verbo exige que a alternativa permaneça visível em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vencidos pelo sono” preserva a força metafórica sem soar excessivamente literal; “despertaram por completo” é natural e mantém a nuance contextual, enquanto a nota registra a ambiguidade do verbo raro.
