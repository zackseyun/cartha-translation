id: LUK.9.45
reference: Luke 9:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: pt
  text: Mas eles não entendiam essa palavra[a]. Ela estava oculta para eles, para que não a percebessem[b], e tinham medo de lhe perguntar a respeito dessa palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “declaração”, “dito” ou “assunto”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz que ela estava oculta deles, sem identificar quem a ocultou.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: não entendiam
  rationale: No contexto, indica que os discípulos não compreendiam o que Jesus acabara de dizer; o imperfeito é naturalmente expresso por “não entendiam”.
- source_word: ῥῆμα
  choice: palavra
  rationale: Refere-se à declaração específica de Jesus. “Palavra” é uma equivalência tradicional e natural em português, embora “declaração” ou “dito” também sejam possíveis.
- source_word: παρακεκαλυμμένον
  choice: estava encoberta
  rationale: Preserva o estado resultante expresso pela construção perifrástica e mantém a voz passiva, sem identificar quem encobriu a palavra.
- source_word: ἀπ’ αὐτῶν
  choice: lhes
  rationale: O pronome dativo em “lhes estava encoberta” comunica de modo idiomático que a palavra permanecia oculta para eles.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: para que não a percebessem
  rationale: “Percebessem” mantém a nuance de αἰσθάνομαι e evita repetir “entendessem”, preservando a distinção lexical em relação a ἠγνόουν.
- source_word: ἐφοβοῦντο
  choice: tinham medo
  rationale: Expressa em português corrente a disposição contínua indicada pelo imperfeito.
- source_word: ἐρωτῆσαι
  choice: perguntar
  rationale: É o equivalente natural para pedir esclarecimento a Jesus neste contexto.
theological_decisions:
- issue: Agente do encobrimento
  choice: 'Manter a construção passiva sem identificar o agente: “Ela lhes estava encoberta”.'
  alternative: Explicitar que Deus a encobriu ou dizer apenas que ela lhes parecia obscura.
  rationale: O grego não nomeia o agente. A formulação preserva essa ambiguidade e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa sem alterar as relações sintáticas. “Lhes estava encoberta” preserva a passiva e soa mais natural do que “estava encoberta deles”.
