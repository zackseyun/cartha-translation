  text: ⸀καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: pt
  text: E foram para outro povoado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povoado diferente”. O adjetivo grego pode enfatizar tanto a diferença quanto simplesmente indicar outro povoado.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação narrativa simples do grego, sem acrescentar uma nuance temporal explícita.
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: Expressa de modo natural o sentido de πορεύομαι, isto é, ir ou seguir viagem; o contexto já deixa claro que prosseguiram para outro lugar.
- source_word: εἰς
  choice: para
  rationale: Com verbo de movimento, indica o destino; “para” é a formulação portuguesa natural neste contexto.
- source_word: ἑτέραν
  choice: outro
  rationale: ἕτερος pode significar “outro” ou “diferente”. “Outro” é idiomático e mantém no texto a referência a um povoado distinto do anterior.
- source_word: κώμην
  choice: povoado
  rationale: κώμη designa uma povoação menor que uma cidade. “Povoado” é claro e amplamente compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com coordenação narrativa direta. “Povoado” comunica uma localidade pequena sem soar excessivamente regional; a nota preserva a possível ênfase de ἑτέραν na diferença.
