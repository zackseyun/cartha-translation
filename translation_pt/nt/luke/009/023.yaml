reference: Luke 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: pt
  text: 'E ele dizia a todos: “Se alguém quer vir após mim[a], negue a si mesmo, tome a sua cruz diariamente e siga-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vir atrás de mim”.'
    reason: Alternativa mais espacial para ὀπίσω μου ἔρχεσθαι; o texto principal preserva o idioma com uma formulação corrente e distinta do verbo “seguir” que aparece depois.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: dizia
  rationale: O imperfeito apresenta a fala em curso ou habitual no contexto; “dizia” preserva esse aspecto sem tornar a frase artificial.
- source_word: πρὸς πάντας
  choice: a todos
  rationale: Tradução direta e natural, que mantém o alcance coletivo da fala de Jesus.
- source_word: Εἴ τις θέλει
  choice: Se alguém quer
  rationale: “Alguém” representa o indefinido singular e genérico τις; “quer” comunica de modo corrente a vontade expressa por θέλει.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: vir após mim
  rationale: Preserva a imagem espacial do idioma grego e sua implicação de discipulado, sem antecipar o verbo explícito “seguir” no fim do versículo.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: negue a si mesmo
  rationale: O imperativo de terceira pessoa é expresso naturalmente por “negue”; “a si mesmo” mantém o reflexivo e evita reduzir a expressão a mera abnegação pontual.
- source_word: ἀράτω
  choice: tome
  rationale: Comunica o ato de tomar sobre si a cruz; “carregue” enfatizaria a continuidade do transporte mais do que o verbo grego neste ponto.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: a sua cruz
  rationale: Mantém o substantivo concreto “cruz” e representa o possessivo sem explicar antecipadamente seu sentido figurado.
- source_word: καθ’ ἡμέραν
  choice: diariamente
  rationale: Expressa com clareza a ideia de “cada dia” e preserva a ênfase lucana na continuidade do discipulado.
- source_word: ἀκολουθείτω μοι
  choice: e siga-me
  rationale: Mantém o segundo imperativo coordenado e distingue o seguimento explícito da imagem anterior de vir após Jesus.
theological_decisions:
- issue: Sentido da linguagem da “cruz” no discipulado
  choice: Conservar literalmente “a sua cruz”.
  alternative: Parafrasear como “seu sofrimento”, “seu fardo” ou “seu sacrifício”.
  rationale: σταυρός designa concretamente uma cruz e, no contexto, adquire implicações metafóricas que a tradução não deve limitar a uma única explicação.
- issue: Singular genérico nas ordens
  choice: 'Manter “alguém” e os imperativos no singular: “negue”, “tome” e “siga”.'
  alternative: Reformular toda a declaração no plural inclusivo.
  rationale: O grego usa um indefinido singular genérico e continua com formas singulares. Em português, “alguém” já inclui naturalmente qualquer pessoa, sem exigir uma forma masculina referente a um indivíduo específico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. A construção conserva o paralelismo das três ordens e o aspecto imperfeito de ἔλεγεν.
