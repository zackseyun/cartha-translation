  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: pt
  text: E enviou mensageiros à sua frente[a]. Eles foram e entraram numa aldeia de samaritanos[b], a fim de fazer os preparativos para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “diante de sua face”.
    reason: lexical_alternative
  - marker: b
    text: Ou “numa aldeia samaritana”. O grego diz mais literalmente “numa aldeia de samaritanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo de ἀποστέλλω descreve de modo direto o ato de enviar; “enviou” é natural e preciso em português.
- source_word: ἀγγέλους
  choice: mensageiros
  rationale: Neste contexto, são enviados humanos que seguem para uma aldeia; “mensageiros” expressa o sentido contextual de ἄγγελος sem sugerir seres celestiais.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: à sua frente
  rationale: A expressão significa literalmente “diante de sua face”, mas funciona aqui como um idiomatismo para pessoas enviadas adiante dele.
- source_word: πορευθέντες εἰσῆλθον
  choice: Eles foram e entraram
  rationale: A coordenação em português comunica naturalmente que primeiro foram e então entraram, preservando a sequência indicada pelo particípio aoristo seguido do verbo principal.
- source_word: κώμην Σαμαριτῶν
  choice: numa aldeia de samaritanos
  rationale: κώμη indica uma aldeia ou pequeno povoado, e o genitivo plural Σαμαριτῶν é mantido de perto como “de samaritanos”.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: a fim de fazer os preparativos para ele
  rationale: ὡς com o infinitivo exprime finalidade. A formulação portuguesa comunica essa finalidade sem especificar indevidamente quais preparativos seriam feitos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente naturalizada, sem eliminar a sequência das ações nem tornar explícito o conteúdo dos preparativos.
