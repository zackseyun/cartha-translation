  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: pt
  text: 'E aconteceu que, enquanto ele orava a sós[a], os discípulos estavam com ele, e ele lhes perguntou: “Quem as multidões dizem que eu sou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em particular». A expressão grega pode indicar recolhimento, não necessariamente ausência absoluta de outras pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual e natural.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: enquanto ele orava
  rationale: A construção com infinitivo articular e ἐν indica uma circunstância simultânea; «enquanto» expressa claramente essa relação temporal.
- source_word: κατὰ μόνας
  choice: a sós
  rationale: Expressão idiomática que pode indicar oração solitária ou em lugar reservado; mantém concisão e permite preservar a tensão com a presença dos discípulos.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: os discípulos estavam com ele
  rationale: Reproduz de modo direto a relação expressa no grego, sem acrescentar que os discípulos chegaram depois ou que estavam apenas nas proximidades.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Então lhes perguntou
  rationale: Em português, o verbo de elocução pode ser incorporado naturalmente ao verbo «perguntar»; «então» dá continuidade à narrativa sem alterar a sequência.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι;
  choice: Quem as multidões dizem que eu sou?
  rationale: Forma idiomática portuguesa que conserva a pergunta indireta do grego e mantém «multidões» como equivalente específico de οἱ ὄχλοι.
theological_decisions:
- issue: Tensão aparente entre Jesus orar «a sós» e os discípulos estarem com ele
  choice: 'Manter diretamente as duas afirmações: ele orava a sós, e os discípulos estavam com ele.'
  alternative: Traduzir «em particular» ou explicar que os discípulos estavam por perto.
  rationale: O texto grego permite que «a sós» descreva recolhimento ou isolamento relativo, mas não explica como isso se relaciona com a presença dos discípulos. A tradução preserva essa nuance sem harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «A sós» é corrente e suficientemente formal; «multidões» preserva a referência aos grupos populares reunidos. A divisão em duas frases evita um período pesado sem perder a relação narrativa.
