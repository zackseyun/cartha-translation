source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: pt
  text: 'Então João respondeu: “Mestre, vimos alguém expulsando demônios em teu nome e tentamos impedi-lo, porque ele não segue conosco.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ele não nos acompanha”. O grego diz mais literalmente: “porque ele não segue conosco”, possivelmente enfatizando que ele não fazia parte do grupo dos discípulos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Então João respondeu
  rationale: A construção com δέ funciona como transição narrativa e ἀποκριθείς introduz uma fala em resposta ao contexto anterior. “Então João respondeu” é natural e preserva o movimento do relato.
- source_word: Ἐπιστάτα
  choice: Mestre
  rationale: Em Lucas, ἐπιστάτης é uma forma característica pela qual os discípulos se dirigem a Jesus, reconhecendo sua autoridade e liderança. “Mestre” é corrente, digno e adequado ao contexto.
- source_word: εἴδομέν τινα
  choice: vimos alguém
  rationale: τινα é indefinido; “alguém” reproduz essa indefinição de modo natural, sem acrescentar uma identificação ausente do texto.
- source_word: ἐν τῷ ὀνόματί σου
  choice: em teu nome
  rationale: A expressão indica atuação vinculada ao nome e à autoridade de Jesus. “Em teu nome” preserva o idioma bíblico e seu peso teológico.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: expulsando demônios
  rationale: No contexto de exorcismo, ἐκβάλλω significa fazer sair ou expulsar. “Expulsando demônios” é claro e idiomático em português moderno.
- source_word: ἐκωλύομεν αὐτόν
  choice: tentamos impedi-lo
  rationale: O imperfeito pode descrever uma ação em curso ou conativa. “Tentamos impedi-lo” comunica adequadamente que os discípulos procuravam detê-lo sem afirmar que conseguiram.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: porque ele não te segue conosco
  rationale: ἀκολουθεῖ tem Jesus como referente implícito, enquanto μεθ’ ἡμῶν preserva a ideia explícita de associação com o grupo dos discípulos. A formulação mantém ambos os elementos de maneira inteligível em português.
theological_decisions:
- issue: Ambiguidade quanto à lealdade e à pertença ao grupo dos discípulos
  choice: porque ele não te segue conosco
  alternative: porque ele não nos segue
  rationale: 'O grego diz literalmente que a pessoa “não segue com nós”, isto é, não acompanha Jesus junto ao grupo. A tradução escolhida evita sugerir que os discípulos se apresentavam como o objeto do discipulado e preserva a tensão narrativa: o homem atua em nome de Jesus, mas não integra a companhia deles.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “teu” para manter uma forma singular inequívoca e natural de referência a Jesus. A nota conserva a construção grega incomum e sua possível ênfase na não pertença ao grupo.
