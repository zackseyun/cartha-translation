base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: pt
  text: 'E ele lhes disse: “Não levem nada para a viagem: nem bastão, nem bolsa[a], nem pão, nem dinheiro[b]; nem tenham duas túnicas cada um[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bolsa de viagem”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “prata”; aqui, refere-se a dinheiro.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão grega tem sentido distributivo: “duas túnicas por pessoa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Não levem nada para a viagem
  rationale: Expressa naturalmente em português a proibição de levar provisões ou objetos para o percurso, preservando a abrangência de Μηδέν.
- source_word: ῥάβδον
  choice: bordão
  rationale: No contexto de viagem, designa um bastão usado para caminhar; “bordão” preserva a referência histórica com clareza.
- source_word: πήραν
  choice: bolsa
  rationale: Refere-se a uma bolsa usada por viajantes para carregar provisões. “Bolsa” é corrente e conciso; a especificidade é indicada em nota.
- source_word: ἄρτον
  choice: pão
  rationale: Mantém o item concreto mencionado no grego, sem generalizá-lo como “comida”.
- source_word: ἀργύριον
  choice: dinheiro
  rationale: Embora o sentido literal seja “prata”, aqui o metal é mencionado como meio de pagamento; “dinheiro” comunica diretamente a função contextual.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: não tenham duas túnicas cada um
  rationale: 'Torna explícita a força distributiva de ἀνά: dois exemplares por pessoa, e não apenas duas túnicas para o grupo inteiro.'
- source_word: χιτῶνας
  choice: túnicas
  rationale: Preserva a referência à peça de roupa do mundo antigo, evitando tanto o genérico “roupas” quanto o anacrônico “camisas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção direta. “Levem” e “tenham” refletem que Jesus se dirige ao grupo; “cada um” preserva a distribuição individual. A pontuação organiza a lista sem acrescentar relações não expressas no texto.
