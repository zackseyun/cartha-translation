  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: pt
  text: Eles apareceram em glória e falavam sobre a partida[a] dele, que ele estava prestes a cumprir em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “partida” é éxodos, literalmente “saída”; pode também evocar o Êxodo de Israel.
    reason: Esclarece o alcance lexical e a provável ressonância bíblica sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: apareceram em glória
  rationale: Expressa naturalmente o particípio aoristo passivo com valor de aparição visível, sem perder a associação de sua manifestação com a glória.
- source_word: ἔλεγον
  choice: falavam
  rationale: O imperfeito indica uma conversa em andamento, bem representada pelo imperfeito português.
- source_word: ἔξοδον
  choice: partida
  rationale: No contexto, designa a partida de Jesus por meio dos acontecimentos que ocorreriam em Jerusalém. “Partida” mantém a amplitude da metáfora, enquanto a nota registra o termo grego e sua possível evocação do Êxodo.
- source_word: ἤμελλεν πληροῦν
  choice: estava prestes a cumprir
  rationale: Mantém tanto a iminência expressa por ἤμελλεν quanto o verbo ativo πληροῦν, cuja ideia é levar algo ao cumprimento, e não apenas realizá-lo.
theological_decisions:
- issue: Sentido da “partida” de Jesus
  choice: Manter o termo abrangente “partida”, com nota sobre ἔξοδος
  alternative: Especificar apenas a morte, a ressurreição ou a ascensão de Jesus
  rationale: O texto não reduz a referência a um único acontecimento. A escolha preserva a densidade narrativa e teológica do termo sem impor uma delimitação denominacional.
- issue: Agência de Jesus no cumprimento
  choice: “que ele estava prestes a cumprir”
  alternative: “que estava para acontecer” ou “que estava para se cumprir”
  rationale: A construção grega apresenta Jesus como sujeito ativo de πληροῦν; a tradução preserva essa agência e a noção de cumprimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando o aspecto verbal, a agência de Jesus e a ambiguidade teológica de ἔξοδος.
