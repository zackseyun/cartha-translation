base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: pt
  text: Todos comeram e ficaram satisfeitos; e foram recolhidos doze cestos dos pedaços que lhes sobraram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos fragmentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: comeram
  rationale: O aoristo narra o acontecimento de modo simples; o pretérito perfeito é a forma natural em português.
- source_word: ἐχορτάσθησαν
  choice: ficaram satisfeitos
  rationale: Expressa que todos comeram até se saciar, em linguagem atual e natural.
- source_word: πάντες
  choice: Todos
  rationale: Preserva a ênfase de que todas as pessoas presentes comeram.
- source_word: ἤρθη
  choice: foi recolhido
  rationale: Neste contexto, o passivo de αἴρω descreve a ação de juntar o alimento que sobrou.
- source_word: τὸ περισσεῦσαν
  choice: o que restou
  rationale: Reproduz naturalmente o particípio substantivado e seu sentido de sobra.
- source_word: αὐτοῖς
  choice: para eles
  rationale: Mantém expressa a relação dativa sem decidir que eles próprios realizaram a coleta.
- source_word: κλασμάτων
  choice: dos pedaços
  rationale: κλάσματα designa pedaços partidos; “pedaços” é concreto, claro e natural.
- source_word: κόφινοι δώδεκα
  choice: doze cestos
  rationale: Traduz com clareza o recipiente e preserva o número em posição enfática após os dois-pontos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção próxima do grego sem sacrificar a legibilidade. A formulação “para eles” conserva a ambiguidade do dativo αὐτοῖς e evita tratá-lo inequivocamente como agente da ação.
