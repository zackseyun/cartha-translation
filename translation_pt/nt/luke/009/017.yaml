review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração traduz bem καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες. Na segunda, όμως, “o que restou para eles” torna αὐτοῖς pouco natural em português e pode sugerir que as sobras lhes foram reservadas. O dativo é mais bem expresso como referência/posse: aquilo que lhes sobrou. A formulação revista também deixa claro, em português idiomático, que a quantidade recolhida foi de doze cestos.'
  naturalness: '“Todos comeram e ficaram satisfeitos” é claro e atual. “Foram recolhidos doze cestos dos pedaços que lhes sobraram” é mais fluente e evita a construção pesada “foi recolhido ...: doze cestos”.'
  terminology: “Cestos” é apropriado para κόφινοι; “pedaços” traduz κλασμάτων com clareza. “Fragmentos” permanece uma alternativa lexical válida.
  issues:
  - severity: medium
    issue: Posicionamento e sentido de “para eles”
    rationale: Em “o que restou para eles”, a expressão tende a qualificar as sobras como destinadas a eles, em vez de indicar o que lhes restou após comerem. O dativo αὐτοῖς é preservado de modo natural por “que lhes sobraram”.
  - severity: low
    issue: Construção final pouco idiomática
    rationale: '“Foi recolhido ...: doze cestos” reproduz a estrutura do inglês, mas em português a quantificação fica mais clara com “foram recolhidos doze cestos”.'
  - severity: low
    issue: Nota b pouco útil como alternativa em português
    rationale: “Foi levantado” é excessivamente literal e não funciona naturalmente para a coleta de sobras neste contexto; a nota pode ser omitida sem perda textual.
  revised_text: Todos comeram e ficaram satisfeitos; e foram recolhidos doze cestos dos pedaços que lhes sobraram[a].
  revised_footnotes:
  - marker: a
    text: Ou “dos fragmentos”.
    reason: lexical_alternative
