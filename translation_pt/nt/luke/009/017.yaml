  rationale: A revisão expressa αὐτοῖς como dativo de referência/posse (“lhes sobraram”), preservando sem forçar sua relação com o particípio περισσεῦσαν. A oração foi reestruturada para um português natural, mantendo o sentido de que as sobras, num total de doze cestos, foram recolhidas. A alternativa “foi levantado” foi retirada por ser pouco idiomática neste contexto.
