  source_fidelity: A enumeração e os nomes estão corretos. Contudo, «algum profeta dos tempos antigos» não exprime com precisão a construção partitiva προφήτης τις τῶν ἀρχαίων, que identifica o profeta como um dentre os antigos. «Um dos profetas antigos» reproduz essa relação de modo claro. «Ressuscitou» é contextual e defensável para ἀνέστη, mas uma nota pode preservar a possibilidade lexical menos explícita de «se levantou/surgiu».
  naturalness: «Eles responderam» e a enumeração elíptica são naturais e adequadas ao registro. «Um dos profetas antigos» é mais idiomático e preciso do que «algum profeta dos tempos antigos».
  terminology: «João Batista» e «Elias» são as formas portuguesas estabelecidas. «Ressuscitou» mantém a ressonância de ressurreição sem transformar a fala atribuída à multidão em afirmação do narrador.
  issues:
