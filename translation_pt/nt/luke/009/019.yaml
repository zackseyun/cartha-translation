base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: pt
  text: 'Eles responderam: “João Batista; outros, Elias; e outros, que um dos profetas antigos ressuscitou[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dos profetas antigos se levantou” ou “surgiu”. O verbo grego pode ter esse sentido mais amplo, embora, neste contexto, possa referir-se à ressurreição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Eles responderam
  rationale: A construção com particípio seguido de verbo finito é idiomática; “responderam” transmite naturalmente o sentido em português sem redundância.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: João Batista
  rationale: É a designação tradicional, clara e amplamente reconhecida em português para João, o batizador.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: outros ... e outros
  rationale: Mantém a repetição e a enumeração contrastiva do grego com fluidez natural em português.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente o conteúdo da opinião atribuída ao terceiro grupo.
- source_word: προφήτης τις
  choice: algum profeta
  rationale: Preserva explicitamente a indefinição expressa por τις.
- source_word: τῶν ἀρχαίων
  choice: dos tempos antigos
  rationale: Expressa em português corrente a referência a uma figura profética pertencente ao passado remoto, sem a formulação pouco natural “dos antigos”.
- source_word: ἀνέστη
  choice: ressuscitou
  rationale: No contexto de uma pessoa do passado que voltou a viver ou aparecer, “ressuscitou” representa o sentido provável e conserva a ressonância de ressurreição do verbo, sem acrescentar que ela “voltou” de algum lugar.
theological_decisions:
- issue: Se ἀνέστη deve declarar explicitamente ressurreição
  choice: ressuscitou
  alternative: se levantou / surgiu
  rationale: A especulação popular diz respeito a um profeta antigo agora presente. Em português, “ressuscitou” comunica com clareza a leitura contextual mais provável; a declaração continua sendo apresentada apenas como opinião de algumas pessoas, não como afirmação do narrador.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A pontuação preserva a forma elíptica das respostas enumeradas.
