source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: pt
  text: Mas, enquanto ele ainda se aproximava, o demônio o derrubou e o fez ter convulsões. Jesus, porém, repreendeu o espírito impuro, curou o menino e o devolveu a seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o restituiu a seu pai”.'
    reason: Alternativa lexical para ἀπέδωκεν, que pode expressar a ideia de devolver ou restituir.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Mas, enquanto ... ainda
  rationale: ἔτι indica uma ação em curso (“ainda”), e δέ funciona como transição narrativa levemente contrastiva, expressa naturalmente por “mas”.
- source_word: προσερχομένου αὐτοῦ
  choice: ele ainda se aproximava
  rationale: O genitivo absoluto com particípio presente indica uma ação simultânea. “Aproximava-se” preserva o movimento em direção a Jesus sem acrescentar detalhes ausentes do texto.
- source_word: ἔρρηξεν αὐτὸν
  choice: o derrubou
  rationale: Neste contexto, ῥήγνυμι descreve o ato violento do demônio de lançar o menino ao chão. “Derrubou” é claro, natural e não sugere literalmente rasgar seu corpo.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: É o equivalente direto de δαιμόνιον e mantém a descrição pessoal do agente espiritual no texto.
- source_word: συνεσπάραξεν
  choice: o fez ter convulsões
  rationale: O verbo descreve espasmos ou convulsões violentas. A formulação evita o uso transitivo pouco natural de “convulsionar” e comunica claramente que o demônio causou as convulsões.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: “Repreendeu” preserva o confronto verbal autoritativo característico dos relatos de exorcismo nos Evangelhos.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: o espírito impuro
  rationale: “Impuro” comunica em português atual as dimensões moral e ritual de ἀκάθαρτος; a expressão mantém a distinção lexical em relação a “demônio” sem separar os referentes.
- source_word: ἰάσατο
  choice: curou
  rationale: ἰάομαι significa curar e, neste contexto, apresenta a restauração do menino juntamente com sua libertação.
- source_word: τὸν παῖδα
  choice: o menino
  rationale: παῖς pode designar criança, menino, filho ou servo. Aqui, “menino” é específico o bastante sem inserir explicitamente a relação filial no substantivo.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: o devolveu ao pai
  rationale: ἀποδίδωμι expressa aqui restituição ou retorno. “Devolveu ao pai” preserva essa dimensão restauradora em português claro e conciso.
theological_decisions:
- issue: Linguagem da aflição demoníaca
  choice: Traduzir δαιμόνιον e πνεῦμα ἀκάθαρτον diretamente como “demônio” e “espírito impuro”.
  alternative: Empregar termos impessoais, como “força maligna”, ou reinterpretar a cena apenas como enfermidade.
  rationale: O grego apresenta um agente espiritual pessoal e depois o chama de espírito impuro. A tradução conserva essa apresentação sem naturalizá-la como condição meramente física ou psicológica. Ao mesmo tempo, mantém a afirmação de que Jesus curou o menino, preservando tanto a libertação quanto a cura.
- issue: Relação entre “demônio” e “espírito impuro”
  choice: Manter as duas designações distintas usadas pelo texto.
  alternative: Uniformizar ambas como “demônio” ou ambas como “espírito maligno”.
  rationale: As duas expressões parecem referir-se ao mesmo agente, mas a variação lexical é significativa e deve ser preservada sem explicar além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações segue de perto o fluxo narrativo grego, enquanto “o fez ter convulsões” privilegia naturalidade e clareza. O pronome possessivo de “seu pai” foi omitido porque “ao pai”, no contexto, já expressa inequivocamente a relação e soa mais fluente.
