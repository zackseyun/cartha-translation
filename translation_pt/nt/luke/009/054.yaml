  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: pt
  text: 'Ao verem isso[a], os discípulos Tiago e João disseram: “Senhor, queres que mandemos descer fogo do céu para consumi-los?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “que digamos que fogo desça do céu e os consuma”. Também pode ser traduzido: “que invoquemos fogo do céu para destruí-los”.'
    reason: Preservar a formulação incomum do grego e registrar as alternativas lexicais de εἴπωμεν e ἀναλῶσαι.
lexical_decisions:
- source_word: ἰδόντες
  choice: Ao verem isso
  rationale: O particípio aoristo é expresso como circunstância temporal. “Isso” explicita naturalmente em português a recusa dos samaritanos narrada no versículo anterior, sem acrescentar nova informação.
- source_word: δὲ
  choice: incorporado à transição temporal
  rationale: Neste contexto, δέ marca a progressão narrativa e não precisa de equivalente separado; sua função é transmitida por “Ao verem isso”.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: os discípulos Tiago e João
  rationale: A construção apositiva identifica quais discípulos fizeram a proposta.
- source_word: Κύριε
  choice: Senhor
  rationale: É o equivalente corrente e digno de κύριε como forma direta de tratamento dirigida a Jesus.
- source_word: θέλεις
  choice: queres
  rationale: θέλω expressa vontade ou desejo. “Queres” é natural no diálogo e mantém a segunda pessoa do singular.
- source_word: εἴπωμεν
  choice: que mandemos descer
  rationale: Embora o verbo seja literalmente “digamos”, a construção com o infinitivo comunica uma ordem dirigida ao fogo. “Mandemos descer” preserva essa força de modo natural em português, sem sugerir que o verbo grego seja lexicalmente “ordenar”.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: fogo do céu para descer / descer fogo do céu
  rationale: “Descer fogo do céu” conserva a imagem vívida e a linguagem de juízo profético com ordem natural em português.
- source_word: ἀναλῶσαι
  choice: consumi-los
  rationale: ἀναλίσκω pode significar consumir ou destruir. “Consumir” mantém de forma mais direta a imagem do fogo.
- source_word: αὐτούς
  choice: -los
  rationale: O pronome plural retoma os samaritanos que recusaram receber Jesus.
theological_decisions:
- issue: Objeto implícito de “ver”
  choice: Acrescentar “isso”, remetendo à recusa do versículo anterior.
  alternative: “Ao verem” sem objeto expresso.
  rationale: O grego não expressa o objeto, mas “isso” torna clara e natural em português a ligação narrativa sem resolver qualquer questão teológica.
- issue: Força da proposta dos discípulos
  choice: “que mandemos descer fogo”
  alternative: “que digamos ao fogo que desça” ou “que façamos descer fogo”
  rationale: A tradução comunica a força imperativa da construção sem ocultar, na nota, que o verbo grego empregado é literalmente “dizer”. Preserva-se assim tanto a naturalidade quanto a forma incomum do original.
- issue: Resultado ou propósito de ἀναλῶσαι
  choice: “para consumi-los”
  alternative: “e consumi-los”
  rationale: O infinitivo pode ser entendido como parte do conteúdo proposto e indica o efeito pretendido. “Para” apresenta com naturalidade esse propósito sem diminuir a severidade da proposta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma “queres” preserva o tratamento singular dirigido a Jesus e permanece amplamente compreensível no português internacional. A nota mantém visível a expressão literal incomum sem tornar o texto principal artificial.
