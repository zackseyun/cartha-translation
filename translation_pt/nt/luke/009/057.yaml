  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: pt
  text: 'Enquanto iam pelo caminho, alguém lhe disse: “Eu o seguirei aonde quer que vá[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aonde quer que vá embora” ou “parta”.
    reason: alternativa_lexical
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Enquanto eles seguiam
  rationale: O genitivo absoluto com particípio presente indica uma ação contínua e simultânea. “Enquanto eles seguiam” comunica naturalmente essa relação temporal.
- source_word: ἐν τῇ ὁδῷ
  choice: pelo caminho
  rationale: Mantém o cenário concreto da viagem e permite que permaneça a possível ressonância do motivo lucano do caminho.
- source_word: εἶπέν τις
  choice: alguém lhe disse
  rationale: τις é indefinido e não explicita gênero; “alguém” evita acrescentar “homem” ao texto.
- source_word: Ἀκολουθήσω σοι
  choice: Eu o seguirei
  rationale: O futuro expressa intenção ou compromisso, e “seguir” preserva tanto o movimento literal quanto a ressonância de discipulado.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: aonde quer que o senhor vá
  rationale: A construção indefinida ὅπου ἐάν com subjuntivo significa “aonde quer que”. Embora ἀπέρχομαι possa significar “partir” ou “ir embora”, “vá” é natural no contexto e não elimina a abrangência da promessa.
theological_decisions:
- issue: Ressonância de discipulado em ἀκολουθέω
  choice: seguir
  alternative: tornar-me seu discípulo
  rationale: “Seguir” preserva simultaneamente o sentido concreto e a dimensão de discipulado sem inserir uma explicação interpretativa no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega-se “o senhor” como forma respeitosa de segunda pessoa dirigida a Jesus; “pelo caminho” mantém fluidez e o cenário narrativo.
