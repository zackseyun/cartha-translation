  - severity: low
    issue: A alternativa lexical de ἀπέρχῃ não foi registrada em nota.
    rationale: Embora «vá» seja a melhor opção contextual, ἀπέρχομαι pode salientar partir ou ir embora. Uma nota breve preserva essa possibilidade sem sobrecarregar o texto.
