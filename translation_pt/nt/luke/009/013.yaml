source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Vocês deem-lhes algo para comer.” Eles responderam: “Não temos mais do que cinco pães e dois peixes, a menos que nós saiamos e compremos comida para todo este povo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda esta multidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Deem vocês mesmos algo para eles comerem
  rationale: Expressa naturalmente em português a construção com o infinitivo φαγεῖν e preserva a ênfase do pronome explícito ὑμεῖς por meio de “vocês mesmos”.
- source_word: πλεῖον ἢ
  choice: mais do que
  rationale: Com a negação, forma a expressão limitativa natural “não temos mais do que”.
- source_word: ἄρτοι πέντε
  choice: cinco pães
  rationale: Neste contexto, ἄρτοι designa unidades de pão; “cinco pães” é a formulação corrente e clara em português.
- source_word: ἰχθύες δύο
  choice: dois peixes
  rationale: Equivalente direto e natural do plural grego.
- source_word: εἰ μήτι
  choice: a menos que
  rationale: Introduz a única exceção cogitada pelos discípulos, sem aumentar o tom emocional da resposta.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: nós mesmos saiamos e compremos
  rationale: Converte naturalmente o particípio subordinado em verbo coordenado e preserva a ênfase do pronome explícito ἡμεῖς.
- source_word: λαὸν
  choice: povo
  rationale: Mantém o sentido coletivo mais direto de λαός; “multidão” também é possível no contexto.
- source_word: βρώματα
  choice: comida
  rationale: Termo corrente e abrangente para os alimentos que teriam de ser comprados.
theological_decisions:
- issue: Tom da ordem de Jesus e da resposta dos discípulos
  choice: Apresentar uma ordem direta, com a ênfase explícita em “vocês mesmos”, seguida de uma objeção prática.
  alternative: Suavizar a ênfase omitindo “mesmos” ou intensificar a fala como repreensão e a resposta como exasperação.
  rationale: O grego enfatiza os pronomes ὑμεῖς e ἡμεῖς, mas não marca explicitamente ironia, repreensão ou irritação; a tradução conserva a ênfase sem acrescentar emoções.
translation_notes:
  register: Português moderno, claro e digno, com alta legibilidade brasileira. “Deem vocês mesmos” conserva a ênfase do grego sem soar arcaico; “saiamos e compremos” mantém a construção deliberativa e evita uma formulação artificial.
