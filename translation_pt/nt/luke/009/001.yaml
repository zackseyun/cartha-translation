id: LUK.9.1
reference: Luke 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: pt
  text: E, tendo reunido os doze[a], deu-lhes poder e autoridade sobre todos os demônios[b] e para curar doenças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo convocado os doze”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobre cada demônio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: reunindo
  rationale: O particípio aoristo médio indica a convocação do grupo antes ou em conexão imediata com o ato principal. “Reunindo” é natural em português e expressa também o elemento συν-, sem tornar a relação temporal mais explícita do que no grego.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ funciona como conectivo narrativo leve, sem contraste forte.
- source_word: τοὺς δώδεκα
  choice: os doze
  rationale: Mantém exatamente a designação do grego, sem acrescentar “discípulos” ou “apóstolos”.
- source_word: ἔδωκεν
  choice: deu-lhes
  rationale: Tradução direta de δίδωμι; o pronome enclítico representa αὐτοῖς de modo conciso e natural.
- source_word: δύναμιν
  choice: poder
  rationale: Expressa capacidade ou força para agir e preserva sua distinção de ἐξουσία.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Comunica autoridade ou direito delegado para agir, distinguindo-se de δύναμις.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: sobre todos os demônios
  rationale: ἐπί com acusativo indica domínio ou autoridade sobre; a formulação conserva o plural e o sentido abrangente do grego.
- source_word: δαιμόνια
  choice: demônios
  rationale: É o equivalente lexical direto; “espíritos impuros” corresponderia a outra expressão grega.
- source_word: νόσους
  choice: doenças
  rationale: Termo corrente e concreto para enfermidades, adequado à ação de curar.
- source_word: θεραπεύειν
  choice: para curar
  rationale: O infinitivo expressa a ação para a qual lhes foram dados poder e autoridade; “curar” é claro, amplo e idiomático.
theological_decisions:
- issue: Distinção entre δύναμις e ἐξουσία
  choice: poder e autoridade
  alternative: capacidade e autoridade; poder e direito
  rationale: 'A tradução mantém os dois conceitos coordenados: capacidade efetiva e autoridade delegada, sem reduzi-los a uma só ideia.'
- issue: Identidade dos “doze”
  choice: os doze
  alternative: os doze discípulos; os doze apóstolos
  rationale: O versículo não contém os substantivos “discípulos” nem “apóstolos”; evitar o acréscimo preserva a formulação da fonte.
- issue: Alcance de πάντα τὰ δαιμόνια
  choice: todos os demônios
  alternative: cada demônio
  rationale: Ambas as formulações podem representar o alcance distributivo ou coletivo da expressão grega. O texto principal usa a forma coletiva natural e registra a alternativa em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e a coordenação do grego foram preservadas sem rigidez excessiva; “os doze” permanece em minúsculas como designação contextual, não como título editorial.
