id: LUK.9.28
reference: Luke 9:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: pt
  text: Cerca de oito dias depois dessas palavras[a], Jesus levou consigo Pedro, João e Tiago e subiu ao monte para orar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «depois dessas declarações». O termo grego também pode ser entendido como «palavras» ou «coisas ditas» neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (não expresso separadamente)
  rationale: A expressão funciona aqui como transição narrativa. O português flui naturalmente sem a fórmula literal «aconteceu, porém», e não se acrescenta um «então» temporal ausente do grego.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: depois dessas palavras
  rationale: λόγους remete ao discurso imediatamente anterior. «Palavras» é natural em português e mantém de perto o alcance lexical do grego; «declarações» seria uma alternativa possível.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: cerca de oito dias
  rationale: ὡσεὶ indica aproximação; «cerca de» preserva essa imprecisão sem harmonizar Lucas com os relatos paralelos.
- source_word: παραλαβὼν
  choice: levou consigo
  rationale: O particípio indica que Jesus tomou os três discípulos para acompanhá-lo. «Levou consigo» torna explícita essa companhia em português natural.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pedro, João e Tiago
  rationale: Empregam-se as formas portuguesas tradicionais dos nomes, com pontuação normal de enumeração. A ordem do texto grego é preservada.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: subiu ao monte
  rationale: «Subiu» preserva o movimento ascendente, e «ao monte» traduz de modo idiomático εἰς τὸ ὄρος sem identificar uma montanha específica.
- source_word: προσεύξασθαι
  choice: para orar
  rationale: O infinitivo expressa propósito; «para orar» é a correspondência direta e natural.
theological_decisions:
- issue: Aproximação cronológica em relação aos relatos paralelos
  choice: cerca de oito dias
  alternative: oito dias
  rationale: O texto de Lucas contém ὡσεὶ, que assinala aproximação. A tradução conserva essa formulação em vez de tornar o número exato ou harmonizá-lo com outros Evangelhos.
- issue: Sujeito de παραλαβὼν e ἀνέβη
  choice: Jesus
  alternative: ele
  rationale: O sujeito está implícito no grego e é Jesus pelo contexto. Repetir o nome em português torna o versículo autônomo e claro sem alterar o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita literalismo narrativo artificial, conserva a aproximação cronológica e usa «monte», forma bíblica corrente e natural.
