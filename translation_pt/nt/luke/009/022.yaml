id: LUK.9.22
reference: Luke 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: pt
  text: 'dizendo: “É necessário[a] que o Filho do Homem sofra muitas coisas, seja rejeitado pelos anciãos, pelos principais sacerdotes e pelos escribas, seja morto e, no terceiro dia, seja ressuscitado[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Filho do Homem deve sofrer muitas coisas...”'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega a forma passiva, preservada aqui; outra tradução possível é “ressuscite”.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: dizendo
  rationale: O particípio aoristo introduz o conteúdo da declaração de Jesus e mantém a ligação com a narrativa anterior.
- source_word: Δεῖ
  choice: É necessário
  rationale: Preserva a construção impessoal e a força de necessidade, sem explicitar além do texto a origem ou o mecanismo dessa necessidade.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação tradicional e suas ressonâncias bíblicas, sem reduzi-la a uma paráfrase genérica.
- source_word: πολλὰ παθεῖν
  choice: sofra muitas coisas
  rationale: Representa explicitamente o plural neutro πολλὰ e comunica a amplitude dos sofrimentos, embora 'sofra muito' seja mais idiomático.
- source_word: ἀποδοκιμασθῆναι
  choice: seja rejeitado
  rationale: Expressa com clareza a rejeição oficial indicada pelo infinitivo passivo.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: pelos anciãos, pelos principais sacerdotes e pelos escribas
  rationale: A preposição ἀπό, com o passivo, indica os agentes da rejeição. A repetição de 'pelos' torna inequívoca a relação de agência em português.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Conserva o termo institucional para esse grupo reconhecido da liderança judaica.
- source_word: ἀρχιερέων
  choice: principais sacerdotes
  rationale: No plural, designa o grupo sacerdotal dirigente, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: γραμματέων
  choice: escribas
  rationale: É o equivalente direto e preserva a designação histórica reconhecível nos Evangelhos.
- source_word: ἀποκτανθῆναι
  choice: seja morto
  rationale: Mantém a voz passiva e expressa de modo direto que outros lhe causarão a morte.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: no terceiro dia
  rationale: Equivalente natural do dativo temporal e formulação consagrada sem acréscimos interpretativos.
- source_word: ἐγερθῆναι
  choice: seja ressuscitado
  rationale: Em contexto de morte e retorno à vida, 'ressuscitado' comunica com clareza o sentido de ἐγείρω e preserva a voz passiva sem nomear seu agente.
theological_decisions:
- issue: Voz passiva do verbo da ressurreição
  choice: seja ressuscitado
  alternative: ressuscite
  rationale: O grego apresenta um infinitivo passivo. A tradução conserva a possível nuance de ação divina sem inserir explicitamente Deus como agente.
- issue: Força de Δεῖ
  choice: É necessário que
  alternative: O Filho do Homem deve
  rationale: A construção impessoal preserva a forma grega e a necessidade inserida no plano redentor, sem explicar além do texto em que consiste essa necessidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém os termos bíblicos reconhecíveis 'Filho do Homem', 'anciãos', 'principais sacerdotes' e 'escribas'. A sequência de subjuntivos após 'É necessário que' reproduz naturalmente em português a série de infinitivos gregos.
