  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: pt
  text: E supliquei aos teus discípulos que o expulsassem[a], mas eles não conseguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “o” pode referir-se ao espírito ou ao menino.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: pedi
  rationale: No contexto, δέομαι expressa um pedido insistente. Em português, “pedi” é natural e, à luz da situação urgente, comunica adequadamente a súplica sem soar excessivamente rebuscado.
- source_word: τῶν μαθητῶν σου
  choice: aos teus discípulos
  rationale: “Discípulos” preserva a relação entre mestre e aprendiz e corresponde ao uso consolidado de μαθητής nos Evangelhos.
- source_word: ἵνα ἐκβάλωσιν
  choice: que o expulsassem
  rationale: A construção com ἵνα e o subjuntivo indica o conteúdo ou propósito do pedido. “Expulsar” reproduz com clareza o uso exorcístico de ἐκβάλλω neste contexto.
- source_word: αὐτό
  choice: o
  rationale: O pronome grego neutro provavelmente retoma o espírito mencionado no contexto. Em português, “o” concorda naturalmente com “espírito”, embora também possa retomar “menino”; a ambiguidade é registrada em nota.
- source_word: οὐκ ἠδυνήθησαν
  choice: não conseguiram
  rationale: A expressão comunica falta de capacidade ou êxito. “Não conseguiram” é corrente, clara e digna em português moderno.
theological_decisions:
- issue: Referente de αὐτό no contexto do exorcismo
  choice: O pronome é entendido como referência ao espírito, traduzido por “o”.
  alternative: O pronome pode referir-se ao menino; em português, a mesma forma “o” também permite essa leitura.
  rationale: O uso exorcístico de ἐκβάλλω favorece o espírito como objeto, e o gênero neutro de αὐτό concorda com πνεῦμα no contexto. Como a forma portuguesa não distingue os dois referentes masculinos, a nota explicita a ambiguidade genuína sem impor uma solução absoluta.
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira e compreensão internacional. A colocação pronominal em “o expulsassem” é padrão e clara; “não conseguiram” evita rigidez desnecessária.
