reference: Luke 9:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: pt
  text: 'E disse-lhes: “Quem receber esta criança em meu nome[a] recebe a mim; e quem receber a mim recebe aquele que me enviou. Pois aquele que é o menor entre todos vocês, esse é grande.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Receber” também pode ser traduzido por “acolher” em todas as ocorrências do versículo. A expressão “em meu nome” pode ter o sentido de “com base no meu nome” ou “por causa do meu nome”, indicando acolhimento em relação à autoridade e à pessoa de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: receber
  rationale: Preserva a repetição verbal e permite tanto a ideia de acolhimento hospitaleiro quanto a de aceitação, sem restringir o sentido.
- source_word: παιδίον
  choice: criança
  rationale: É o equivalente simples e natural em português; o contexto já comunica a condição humilde, sem exigir o diminutivo “criancinha”.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Mantém a relação com o nome, a autoridade e a representação de Jesus sem reduzir a expressão a uma única explicação causal.
- source_word: τὸν ἀποστείλαντά με
  choice: aquele que me enviou
  rationale: Reproduz naturalmente o particípio substantivado e não explicita como “Pai” ou “Deus” o que o grego deixa implícito.
- source_word: μικρότερος
  choice: o menor
  rationale: Neste contexto, indica posição humilde ou baixa condição no grupo, não necessariamente tamanho físico ou idade.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: entre todos vocês
  rationale: Expressa de modo claro a posição relativa dentro do grupo.
- source_word: ὑπάρχων
  choice: for
  rationale: Na construção “aquele que for o menor”, comunica naturalmente a condição expressa pelo particípio, sem a rigidez de “sendo”.
- source_word: οὗτός ἐστιν μέγας
  choice: esse é grande
  rationale: Preserva a ênfase do demonstrativo e a declaração paradoxal sobre a verdadeira grandeza.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Quem ... e quem
  rationale: Expressa em português corrente a condição geral e indefinida das duas orações.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: E disse-lhes
  rationale: Reflete a ligação narrativa de καί e conserva o referente pronominal do texto sem acrescentar um nome ausente no versículo.
theological_decisions:
- issue: Referente de “aquele que me enviou”
  choice: Manter a referência implícita, sem acrescentar “o Pai” ou “Deus”.
  alternative: “o Pai que me enviou” ou “Deus, que me enviou”
  rationale: O grego emprega um particípio substantivado; a formulação preserva a afirmação relacional da missão de Jesus sem expandir o texto.
- issue: Sentido de receber uma criança “em meu nome”
  choice: Preservar a fórmula ampla “em meu nome”.
  alternative: “por causa do meu nome”, “com base no meu nome” ou “por minha causa”
  rationale: A expressão pode envolver autoridade, representação e lealdade a Jesus; uma paráfrase única estreitaria essa amplitude.
- issue: Paradoxo da grandeza
  choice: Entender “o menor” em termos de posição humilde entre os discípulos.
  alternative: “o mais jovem” ou “o menor em tamanho”
  rationale: O contexto trata de grandeza e posição dentro do grupo. A tradução mantém a inversão de valores sem convertê-la em uma afirmação meramente etária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “receber” reproduz o encadeamento retórico do grego. “Disse-lhes” mantém concisão narrativa; “vocês” evita uma forma regionalmente limitada. A pontuação destaca, sem exagero, a conclusão enfática.
