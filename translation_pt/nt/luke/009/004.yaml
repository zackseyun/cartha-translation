  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: pt
  text: E em qualquer casa em que entrarem, fiquem ali e dali partam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: em qualquer casa em que
  rationale: Expressa naturalmente em português a construção indefinida com ἣν ἂν, sem perder a ideia de qualquer casa na qual eles viessem a entrar.
- source_word: ἐκεῖ μένετε
  choice: fiquem ali
  rationale: Traduz μένω no sentido contextual de permanecer hospedado no mesmo lugar; “fiquem” é claro e idiomático.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: dali partam
  rationale: Preserva o valor de procedência de ἐκεῖθεν e o sentido de sair daquele lugar, com formulação digna e natural.
theological_decisions:
- issue: Permanência na casa que os recebesse
  choice: “fiquem ali” conserva a instrução sem explicitar motivo ou duração
  alternative: “permaneçam hospedados ali”
  rationale: O texto ordena a permanência naquela casa, mas não declara neste versículo a razão nem especifica até quando; a tradução evita acrescentar essas inferências.
translation_notes:
  register: Português moderno, claro e de ampla compreensão, com imperativos na terceira pessoa do plural. A repetição espacial do grego é preservada por “ali” e “dali”, sem rigidez excessiva.
