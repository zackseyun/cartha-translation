  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: pt
  text: E não o acolheram[a], porque ele seguia com o rosto voltado para Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o receberam”. O verbo pode significar receber, aceitar ou acolher; aqui, provavelmente se refere à recusa de hospitalidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “porque o rosto dele estava indo para Jerusalém”. Trata-se de uma expressão que indica sua direção e pode também sugerir firme propósito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: acolheram
  rationale: Neste contexto de viagem e provável hospitalidade, δέχομαι indica receber ou dar acolhida. “Acolheram” comunica naturalmente a recusa de recepção sem limitar o sentido apenas à hospedagem.
- source_word: τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον
  choice: ele seguia com o rosto voltado
  rationale: A formulação conserva a imagem concreta do “rosto” e também o movimento expresso por πορευόμενον, mas reestrutura a construção perifrástica para soar natural em português.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: A preposição εἰς marca destino ou direção; “para” é a correspondência portuguesa mais natural nesta construção.
- source_word: ὅτι
  choice: porque
  rationale: Introduz explicitamente a causa da recusa e é o conector causal mais claro em português atual.
theological_decisions:
- issue: Força idiomática da expressão referente ao rosto e a Jerusalém
  choice: Manter no texto a imagem do rosto, juntamente com o movimento em direção a Jerusalém
  alternative: Traduzir apenas como “porque ele estava a caminho de Jerusalém” ou interpretar como “porque estava decidido a ir para Jerusalém”
  rationale: A imagem tem peso narrativo na seção da viagem de Lucas. A redação escolhida preserva tanto a direção resoluta sugerida pelo idioma quanto o movimento verbalmente expresso, sem converter a sugestão em uma afirmação psicológica explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Acolheram” esclarece o contexto de recepção/hospitalidade; “seguia com o rosto voltado” preserva a imagem sem reproduzir de modo ininteligível a sintaxe grega.
