id: LUK.9.6
reference: Luke 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: pt
  text: Então eles saíram e percorriam os povoados[a], anunciando as boas-novas[b] e curando por toda parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de povoado em povoado». A expressão grega pode destacar distributivamente o movimento entre os povoados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pregando o evangelho».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: saíram
  rationale: O particípio aoristo introduz uma ação anterior ao percurso contínuo; «saíram» expressa de modo natural que os discípulos partiram após receberem a missão.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá continuidade à narrativa e sugere progressão a partir da ordem de Jesus; «Então» comunica essa ligação sem torná-la excessivamente causal.
- source_word: διήρχοντο
  choice: percorriam
  rationale: O imperfeito descreve movimento contínuo ou repetido por vários lugares; «percorriam» preserva esse aspecto e combina naturalmente com «os povoados».
- source_word: κατὰ τὰς κώμας
  choice: os povoados
  rationale: κατά com o acusativo tem sentido espacial e distributivo, indicando movimento pelos diversos povoados. A nota conserva explicitamente a alternativa «de povoado em povoado».
- source_word: εὐαγγελιζόμενοι
  choice: anunciando as boas-novas
  rationale: A expressão comunica a proclamação da boa notícia em linguagem clara e atual, sem depender do sentido técnico posterior que «evangelho» pode evocar.
- source_word: θεραπεύοντες
  choice: curando
  rationale: No contexto da missão dos discípulos, o verbo se refere à cura de pessoas; «curando» é direto, natural e semanticamente adequado.
- source_word: πανταχοῦ
  choice: por toda parte
  rationale: A locução idiomática expressa a extensão ampla da atividade dos discípulos e corresponde ao sentido de «em todo lugar».
theological_decisions:
- issue: Sentido de εὐαγγελιζόμενοι na missão dos discípulos
  choice: anunciando as boas-novas
  alternative: pregando o evangelho
  rationale: A escolha preserva o conteúdo evangelizador da ação sem impor ao termo uma formulação técnica ou eclesiástica mais desenvolvida; a alternativa tradicional permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Povoados» distingue κώμαι de cidades maiores; «boas-novas» mantém linguagem acessível. Os marcadores seguem imediatamente as expressões às quais se referem.
