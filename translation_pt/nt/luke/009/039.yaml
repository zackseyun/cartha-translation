- from: E eis que um espírito[a] o toma; de repente, ele grita, e o espírito o sacode em convulsões, fazendo-o espumar. Quase não se afasta dele e o deixa destroçado.
  to: E eis que um espírito[a] o toma; de repente, ele grita, e o espírito o sacode em convulsões, fazendo-o espumar. Mal se afasta dele, ferindo-o.
  rationale: A revisão limita-se à oração final. «Mal se afasta dele» reproduz de modo idiomático a dificuldade expressa por μόγις, e «ferindo-o» traduz o particípio presente συντρῖβον sem transformar a ação em um resultado absoluto ou definir indevidamente a natureza do dano.
