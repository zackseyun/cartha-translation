  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: pt
  text: E eis que um espírito[a] o toma; de repente, ele grita, e o espírito o sacode em convulsões, fazendo-o espumar. Mal se afasta dele, ferindo-o.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um espírito mau» ou «um demônio»; aqui, o grego diz simplesmente «um espírito».
    reason: Leitura alternativa contextual, mantendo no texto principal a formulação menos específica do original.
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a vivacidade do marcador discursivo grego em linguagem digna e ainda compreensível, sem recorrer ao imperativo menos natural «olhe».
- source_word: πνεῦμα
  choice: um espírito
  rationale: Mantém a generalidade lexical do grego, que neste versículo não traz um adjetivo como «mau» ou «impuro», nem emprega o substantivo «demônio».
- source_word: λαμβάνει
  choice: o toma
  rationale: Comunica domínio repentino sobre o menino e mantém uma formulação direta, sem acrescentar detalhes ausentes do verbo grego.
- source_word: ἐξαίφνης
  choice: de repente
  rationale: Expressa de maneira natural o início abrupto do ataque.
- source_word: κράζει
  choice: ele grita
  rationale: Preserva o menino como sujeito implícito do verbo ativo, sem explicitar interpretativamente que o espírito o faz gritar.
- source_word: σπαράσσει
  choice: o sacode em convulsões
  rationale: Torna claro, em português atual, o efeito corporal violento indicado pelo verbo neste contexto.
- source_word: μετὰ ἀφροῦ
  choice: fazendo-o espumar
  rationale: Expressa naturalmente que a espuma acompanha as convulsões; a formulação explicita apenas a relação corporal exigida pelo contexto.
- source_word: μόγις
  choice: quase não
  rationale: Preserva a força de «mal, dificilmente, a custo» e também a possível noção de que o espírito raramente o deixa.
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: se afasta dele
  rationale: Mantém o sentido de afastamento do espírito sem tornar a expressão excessivamente técnica.
- source_word: συντρῖβον αὐτόν
  choice: o deixa destroçado
  rationale: Comunica o dano severo produzido pelo espírito sem especificar uma lesão física concreta que o grego não define.
theological_decisions:
- issue: Identificar explicitamente πνεῦμα como demoníaco no texto principal
  choice: um espírito
  alternative: um espírito mau; um demônio
  rationale: Embora o contexto mais amplo mostre que se trata de um ser sobrenatural hostil, o versículo usa apenas πνεῦμα. A tradução conserva essa generalidade e registra as interpretações contextuais em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «E eis que» conserva a vivacidade narrativa sem excessiva coloquialidade. A repetição de «o espírito» esclarece o sujeito de «sacode» em português, enquanto «ele grita» mantém o menino como sujeito do verbo correspondente.
