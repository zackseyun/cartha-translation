  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: pt
  text: Mas ele os repreendeu e ordenou que não contassem isso a ninguém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas ele os advertiu severamente e ordenou que não contassem isso a ninguém.”'
    reason: Alternativa lexical para ἐπιτιμήσας, que pode denotar uma advertência enérgica no contexto.
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: os repreendeu
  rationale: O particípio aoristo de ἐπιτιμάω expressa aqui uma repreensão ou advertência enérgica. “Os repreendeu” preserva a força do termo, enquanto a nota registra a alternativa contextual “os advertiu severamente”.
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: παραγγέλλω indica uma determinação dada com autoridade; “ordenou” é claro, atual e conserva essa força.
- source_word: μηδενὶ
  choice: a ninguém
  rationale: O dativo de μηδείς funciona como objeto indireto de λέγειν e é traduzido naturalmente por “a ninguém”.
- source_word: λέγειν
  choice: que não contassem
  rationale: Embora λέγω frequentemente signifique “dizer”, com uma pessoa como objeto indireto e τοῦτο como conteúdo, “contar isso a alguém” é a formulação idiomática em português. A construção com subjuntivo depois de “ordenou que não” transmite naturalmente o infinitivo grego sob a negação.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo remete à confissão de Pedro no contexto imediato. “Isso” mantém a referência anafórica sem explicá-la além do texto.
- source_word: δὲ
  choice: Mas
  rationale: δέ assinala um contraste leve entre a confissão anterior e a resposta de Jesus; “Mas” o expressa com naturalidade.
theological_decisions:
- issue: Força da proibição após a confissão de Pedro
  choice: Uma proibição forte de divulgar naquele momento o que Pedro havia confessado
  alternative: Uma advertência mais branda para que não o mencionassem
  rationale: A combinação de ἐπιτιμήσας com παρήγγειλεν vai além de um simples pedido. A tradução mantém a tensão narrativa sem acrescentar ao versículo uma explicação teológica para a proibição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ele” preserva o sujeito expresso de modo indireto no grego e evita inserir explicitamente “Jesus” neste versículo. A formulação mantém a concisão e a força autoritativa do original.
