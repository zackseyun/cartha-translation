  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: pt
  text: 'E outro também disse: “Eu o seguirei, Senhor, mas primeiro permita-me despedir-me dos de minha casa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: outro
  rationale: Introduz mais uma pessoa, distinta das anteriores; “outro” é conciso e natural no contexto.
- source_word: Ἀκολουθήσω σοι
  choice: Eu o seguirei
  rationale: O futuro do indicativo expressa a intenção declarada do homem; a colocação pronominal é natural no português moderno e mantém Jesus como objeto do verbo.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto o possível peso teológico do termo, sem reduzi-lo a “senhor” no sentido meramente cortês ou a “Mestre”.
- source_word: πρῶτον
  choice: primeiro
  rationale: Expressa claramente a prioridade temporal solicitada pelo homem.
- source_word: ἐπίτρεψόν μοι
  choice: permita-me
  rationale: O imperativo aoristo formula um pedido de permissão; “permita-me” conserva o tom respeitoso e é corrente em português.
- source_word: ἀποτάξασθαι
  choice: despedir-me
  rationale: O infinitivo médio significa tomar despedida ou dizer adeus; “despedir-me” é preciso e idiomático.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: dos que estão em minha casa
  rationale: A expressão aponta para as pessoas que estão na casa ou pertencem a ela. Esta formulação mantém a referência pessoal sem restringi-la explicitamente à família ou ampliá-la para uma categoria social fixa como “casa” ou “domicílio”.
- source_word: δὲ καὶ
  choice: E ... também
  rationale: Conserva tanto a ligação com o diálogo anterior quanto a força aditiva das partículas.
theological_decisions:
- issue: Tradução de κύριε ao dirigir-se a Jesus
  choice: Senhor
  alternative: Mestre; senhor
  rationale: “Senhor” preserva a amplitude do termo em Lucas, que pode funcionar como tratamento respeitoso e também carregar reconhecimento teológico, sem resolver essa tensão em uma única direção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “Eu o seguirei” é natural no registro escrito e evita regionalismo. Não foram incluídas notas porque as alternativas lexicais não são necessárias para compreender o versículo.
