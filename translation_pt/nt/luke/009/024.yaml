  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: pt
  text: Pois quem quiser salvar a sua vida[a] a perderá; mas quem perder a sua vida por minha causa a salvará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua alma” ou “o próprio ser”; a palavra grega pode significar vida, alma ou o próprio ser, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Pois quem quiser
  rationale: A construção indefinida com ἄν e subjuntivo é expressa naturalmente por “quem quiser”. “Pois” preserva a ligação explicativa de γάρ com o dito anterior.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: a sua vida
  rationale: Neste paradoxo sobre seguir Jesus, ψυχή designa primariamente a vida da pessoa, embora também possa significar alma ou o próprio ser. “Sua” mantém o referente singular sem impor gênero em português.
- source_word: σῶσαι / σώσει
  choice: salvar / salvará
  rationale: A repetição de “salvar” preserva o vínculo verbal e a força paradoxal do grego; “preservar” seria possível, mas reduziria a ressonância mais ampla do verbo.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: perderá / perder
  rationale: “Perder” é a expressão portuguesa natural neste contexto e conserva a simetria entre as duas metades do dito, sem sugerir que a pessoa destrói ativamente a própria vida.
- source_word: ἕνεκεν ἐμοῦ
  choice: por minha causa
  rationale: A expressão comunica com clareza causa e motivação pessoal. É natural em português contemporâneo e mantém o foco do discipulado em Jesus.
- source_word: οὗτος σώσει αὐτήν
  choice: a salvará
  rationale: O demonstrativo οὗτος realça a pessoa anteriormente descrita, mas o sujeito já está claro em português. A forma natural “a salvará” transmite o sentido sem o artificial “esse é quem”, e o pronome retoma “vida”.
theological_decisions:
- issue: Sentido de ψυχή no paradoxo de Jesus
  choice: vida
  alternative: alma; o próprio ser
  rationale: O contexto imediato trata de negar a si mesmo, seguir Jesus e perder ou conservar a vida. “Vida” comunica melhor o sentido principal sem limitar ψυχή à alma imaterial; a amplitude lexical é registrada em nota.
- issue: Referência genericamente humana no singular
  choice: quem... a sua vida
  alternative: aquele que... a vida dele
  rationale: “Quem” conserva o caráter geral e singular da declaração grega e inclui naturalmente qualquer pessoa, sem alterar o número nem acrescentar uma marca masculina desnecessária em português.
- issue: Ênfase de οὗτος
  choice: sujeito implícito em “a salvará”
  alternative: esse salvará a sua vida
  rationale: O demonstrativo grego destaca a pessoa que perde a vida por causa de Jesus. Em português, repeti-lo explicitamente torna a frase pesada; o contraste entre as orações preserva funcionalmente essa ênfase.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a repetição verbal conservam o paralelismo do original; o ponto e vírgula torna nítida a oposição entre as duas partes.
