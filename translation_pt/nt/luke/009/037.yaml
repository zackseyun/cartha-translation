  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: pt
  text: No dia seguinte[a], quando eles desceram do monte, uma grande multidão veio ao encontro dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «No outro dia».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: '[não expresso separadamente]'
  rationale: A expressão funciona aqui como transição narrativa. Em português atual, o início direto com «No dia seguinte» transmite naturalmente a progressão do relato, sem acrescentar um «aconteceu que» pesado nem um advérbio temporal ausente do grego.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: No dia seguinte
  rationale: O dativo indica o momento em que o fato ocorreu. «No dia seguinte» é claro, idiomático e fiel ao sentido temporal.
- source_word: κατελθόντων αὐτῶν
  choice: quando eles desceram
  rationale: O genitivo absoluto fornece a circunstância de fundo. O pretérito perfeito expressa de modo natural a descida que precede o encontro, sem tornar a sequência excessivamente explícita.
- source_word: ἀπὸ τοῦ ὄρους
  choice: do monte
  rationale: ὄρος designa monte ou montanha. «Monte» é natural neste contexto bíblico e preserva a referência ao lugar elevado sem sugerir precisão geográfica ausente do texto.
- source_word: συνήντησεν αὐτῷ
  choice: veio ao encontro dele
  rationale: A formulação transmite o movimento da multidão para encontrar Jesus e é mais natural em português do que o possível, porém ambíguo, «encontrou-se com ele».
- source_word: ὄχλος πολύς
  choice: uma grande multidão
  rationale: A expressão indica uma multidão numerosa. Esta tradução é corrente, clara e mantém a intensidade de πολύς.
