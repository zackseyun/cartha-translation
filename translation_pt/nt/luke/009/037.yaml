  source_fidelity: A tradução transmite corretamente a sequência temporal, a descida do monte e o encontro da multidão com ele. «Veio ao encontro dele» representa adequadamente συνήντησεν αὐτῷ e evita a ambiguidade de «encontrou-se com ele».
