    issue: Aspecto verbal em «O dia começava a declinar»
    rationale: ἤρξατο é aoristo e marca o começo da ação. «O dia começou a declinar» preserva essa nuance de modo mais direto.
  - severity: low
    issue: «Lugar isolado» enfraquece a imagem de ἐρήμῳ τόπῳ
    rationale: «Isolado» pode indicar apenas afastamento; «lugar deserto» comunica melhor a falta de população e recursos implicada pelo contexto, mantendo a alternativa explicada na nota.
