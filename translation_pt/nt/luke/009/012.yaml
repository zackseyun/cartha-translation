  to: 'O dia começou a declinar, e os Doze se aproximaram de Jesus e lhe disseram: “Mande a multidão embora, para que a multidão vá aos povoados e campos ao redor, consiga hospedagem e encontre mantimentos[a], pois estamos aqui num lugar deserto[b].”'
