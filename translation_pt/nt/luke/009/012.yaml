source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: pt
  text: 'O dia começou a declinar, e os Doze se aproximaram de Jesus e lhe disseram: “Mande a multidão embora, para que a multidão vá aos povoados e campos ao redor, consiga hospedagem e encontre mantimentos[a], pois estamos aqui num lugar deserto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encontre comida”. A palavra grega se refere a mantimentos ou provisões alimentares.
    reason: lexical_alternative
  - marker: b
    text: Ou “lugar isolado”. A palavra grega pode indicar uma região desabitada ou pouco habitada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: O dia começava a declinar
  rationale: Preserva a imagem de κλίνω aplicada ao avanço do dia em direção ao entardecer, com formulação natural e digna em português.
- source_word: προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ
  choice: e os Doze se aproximaram de Jesus e lhe disseram
  rationale: “Se aproximaram” expressa diretamente προσέρχομαι. O referente de αὐτῷ é explicitado como “Jesus” para evitar ambiguidade em português, e “os Doze” mantém o uso titular.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Mande a multidão embora
  rationale: Traduz o sentido contextual de ἀπολύω, isto é, dispensar ou mandar embora, numa ordem natural em português.
- source_word: ἵνα πορευθέντες
  choice: para que vá
  rationale: Integra o particípio à oração de finalidade de modo idiomático. O verbo no singular concorda com o coletivo “multidão”.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: aos povoados e campos ao redor
  rationale: κύκλῳ indica os lugares circundantes; κώμαι são povoados ou aldeias, e ἀγροί pode designar campos ou áreas rurais.
- source_word: καταλύσωσιν
  choice: consiga hospedagem
  rationale: Neste contexto, καταλύω se refere a encontrar onde se alojar; “consiga hospedagem” torna esse sentido claro sem excesso de paráfrase.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: encontre mantimentos
  rationale: ἐπισιτισμός designa provisões ou suprimento de comida. “Mantimentos” conserva esse alcance mais amplo.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: pois estamos aqui num lugar isolado
  rationale: Mantém ὧδε (“aqui”) e traduz ἔρημος como um lugar afastado e com poucos recursos, sem introduzir associações teológicas não exigidas pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva a progressão narrativa e a finalidade do pedido dos Doze, evitando tanto literalismo rígido quanto explicações interpretativas no corpo do versículo.
