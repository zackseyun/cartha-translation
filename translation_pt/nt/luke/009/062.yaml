  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: pt
  text: 'Mas Jesus disse: “Ninguém que tenha posto a mão no arado[a] e olhe para trás é apto[b] para o Reino de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo posto a mão no arado”. A imagem é a de começar o trabalho de arar e então dirigir a atenção para trás.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “bem apropriado” ou “útil” para o Reino de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste em relação à fala anterior, sem tornar a oposição mais forte do que o grego exige.
- source_word: Οὐδεὶς
  choice: Ninguém
  rationale: Preserva a referência universal e genérica do pronome negativo em português natural, sem especificação desnecessária de gênero.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: põe a mão no arado
  rationale: Mantém a imagem agrícola e expressa de modo idiomático o ato inicial de assumir o trabalho. O presente proverbial soa natural em português, enquanto a nota registra uma representação mais formal do particípio aoristo.
- source_word: ἄροτρον
  choice: arado
  rationale: É o termo português corrente para o instrumento agrícola mencionado no texto.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: olha para trás
  rationale: Conserva tanto a ação literal na cena de arar quanto a sugestão metafórica de atenção ou compromisso dividido; o presente reflete o aspecto contínuo ou característico do particípio.
- source_word: εὔθετός
  choice: apto
  rationale: Expressa adequação ou idoneidade para determinado fim sem transformar a afirmação em declaração explícita de mérito moral, condenação final ou utilidade ministerial.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: para o Reino de Deus
  rationale: Com εὔθετος, o dativo indica aquilo para o qual alguém é apto. “Reino de Deus” é a formulação tradicional, clara e semanticamente ampla, sem reduzir βασιλεία apenas a território ou apenas ao ato de reinar.
theological_decisions:
- issue: Sentido de εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: “é apto para o Reino de Deus”, preservando a ideia geral de adequação às exigências do Reino
  alternative: “é digno de entrar no Reino de Deus” ou “é útil no serviço do Reino de Deus”
  rationale: O adjetivo grego afirma aptidão ou adequação, mas não define expressamente se o foco é entrada, salvação final ou serviço. A tradução mantém a força da advertência sobre discipulado indiviso sem resolver essa tensão em favor de uma doutrina mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção proverbial no presente preserva a vivacidade da máxima; as notas registram a forma participial mais literal e a amplitude semântica de εὔθετος.
