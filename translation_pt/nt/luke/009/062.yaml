review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a negação universal, a imagem do arado, o olhar para trás e a noção de aptidão para o Reino. Contudo, «põe» nivela o particípio aoristo ἐπιβαλών a uma ação presente simultânea. Uma formulação com «tenha posto» conserva melhor o ato já iniciado antes do olhar continuado para trás, sem perder a naturalidade proverbial em português.
  naturalness: «Ninguém que tenha posto a mão no arado e olhe para trás» é uma construção clara, idiomática e de registro digno. «Apto para o Reino de Deus» é natural e não força uma conclusão soteriológica que o grego não explicita.
  terminology: «Arado», «Reino de Deus» e «apto» são escolhas apropriadas. Na nota de εὔθετος, «bem preparado» pode sugerir preparo prévio, não o sentido principal de adequação/suitability; «bem apropriado» e «útil» refletem melhor a amplitude lexical.
  issues:
  - severity: medium
    issue: Aspecto de ἐπιβαλών
    rationale: O particípio aoristo denota o ato de pôr/tomar a mão no arado como anterior ao presente βλέπων. «Põe ... e olha» é possível como máxima proverbial, mas perde essa relação aspectual. «Tenha posto ... e olhe» a preserva de modo natural.
  - severity: low
    issue: Alternativa da nota b
    rationale: «Bem preparado» pode deslocar εὔθετος para a ideia de estar previamente treinado ou pronto. «Bem apropriado» ou «útil» corresponde mais diretamente a “well-suited/useful”.
  revised_text: 'Mas Jesus disse: “Ninguém que tenha posto a mão no arado[a] e olhe para trás é apto[b] para o Reino de Deus.”'
  revised_footnotes:
