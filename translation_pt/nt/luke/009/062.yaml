revisions:
- from: 'Mas Jesus disse: “Ninguém que põe a mão no arado[a] e olha para trás é apto[b] para o Reino de Deus.”'
  to: 'Mas Jesus disse: “Ninguém que tenha posto a mão no arado[a] e olhe para trás é apto[b] para o Reino de Deus.”'
  rationale: A revisão explicita, na medida em que o português permite, a anterioridade do ato expresso pelo particípio aoristo em relação ao olhar contínuo para trás. Mantém-se «apto para o Reino de Deus» para traduzir εὔθετος sem especificar entrada no Reino, salvação final ou utilidade no serviço. As notas foram ajustadas para maior precisão semântica e idiomática.
