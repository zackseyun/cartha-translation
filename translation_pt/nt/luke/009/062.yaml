    text: 'Ou: “tendo posto a mão no arado”. A imagem é a de começar o trabalho de arar e então dirigir a atenção para trás.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “bem apropriado” ou “útil” para o Reino de Deus.'
    reason: alternative_reading
  revision_rationale: A revisão explicita, na medida em que o português permite, a anterioridade do ato expresso pelo particípio aoristo em relação ao olhar contínuo para trás. Mantém-se «apto para o Reino de Deus» para traduzir εὔθετος sem especificar entrada no Reino, salvação final ou utilidade no serviço. As notas foram ajustadas para maior precisão semântica e idiomática.
