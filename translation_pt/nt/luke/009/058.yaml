id: LUK.9.58
reference: Luke 9:58
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: pt
  text: 'E Jesus lhe disse: “As raposas têm tocas, e as aves do céu têm ninhos[a], mas o Filho do Homem[b] não tem onde reclinar a cabeça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares para pousar” ou “abrigos”; o termo grego indica lugares de alojamento.
    reason: lexical_alternative
  - marker: b
    text: “Filho do Homem” é uma autodesignação de Jesus e pode evocar Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: raposas
  rationale: Correspondência direta ao termo grego, sem razão contextual para generalizar.
- source_word: φωλεοὺς
  choice: tocas
  rationale: Designa covis ou abrigos de animais; “tocas” é a forma natural em português para os abrigos das raposas.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: aves do céu
  rationale: Mantém de modo claro e natural a construção grega, literalmente referente às aves do céu.
- source_word: κατασκηνώσεις
  choice: ninhos
  rationale: No contexto das aves, “ninhos” comunica naturalmente lugares onde elas se alojam, embora o substantivo grego seja mais amplo; a nota preserva essa amplitude.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Filho do Homem
  rationale: Preserva a autodesignação reconhecida de Jesus e sua possível ressonância com Daniel 7, sem substituí-la por uma interpretação.
- source_word: οὐκ ἔχει ποῦ
  choice: não tem onde
  rationale: Reproduz de maneira idiomática a construção negativa grega sem acrescentar uma ideia ausente do texto.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: reclinar a cabeça
  rationale: Preserva a imagem concreta do grego e é uma expressão digna e inteligível em português.
- source_word: δὲ
  choice: mas
  rationale: Explicita o contraste entre os animais, que têm abrigo, e o Filho do Homem, que não tem onde reclinar a cabeça.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: Tradução direta e natural da introdução narrativa grega; o “E” inicial mantém a ligação com o contexto anterior.
theological_decisions:
- issue: Autodesignação de Jesus υἱὸς τοῦ ἀνθρώπου
  choice: Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional traduz literalmente a expressão, preserva sua condição de autodesignação e mantém aberta sua possível alusão messiânica e apocalíptica a Daniel 7:13–14.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tocas” e “ninhos” oferecem imagens concretas e naturais; “aves do céu”, “Filho do Homem” e “reclinar a cabeça” preservam a linguagem e as ressonâncias do original.
