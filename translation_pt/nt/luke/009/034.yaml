  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: pt
  text: Enquanto ele dizia essas coisas, surgiu uma nuvem e os envolveu[a]; eles ficaram com medo ao entrarem na nuvem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surgiu uma nuvem e começou a cobri-los com sua sombra”. O imperfeito grego pode indicar uma ação em desenvolvimento, mas também pode ser traduzido sem explicitar a ideia de início da ação.'
    reason: lexical_alternative
  - marker: b
    text: A nuvem provavelmente evoca cenas do Antigo Testamento em que Deus manifesta sua presença, embora o versículo não diga isso de modo explícito.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e remete naturalmente às palavras anteriores de Pedro.
- source_word: αὐτοῦ λέγοντος
  choice: enquanto ele dizia
  rationale: O genitivo absoluto com particípio presente exprime uma ação em curso simultânea ao aparecimento da nuvem.
- source_word: ἐγένετο νεφέλη
  choice: surgiu uma nuvem
  rationale: Expressa de modo natural o aparecimento ou a chegada da nuvem sem especificar sua origem.
- source_word: ἐπεσκίαζεν
  choice: começou a cobri-los com sua sombra
  rationale: Comunica a possível nuance ingressiva do imperfeito e traduz o sentido de envolver ou cobrir com sombra em português corrente.
- source_word: ἐφοβήθησαν
  choice: eles ficaram com medo
  rationale: Formulação natural que pode comunicar o surgimento do medo indicado pelo aoristo.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: ao entrarem
  rationale: O infinitivo articular com ἐν tem valor temporal contemporâneo; a construção preserva sem rigidez a referência do sujeito acusativo.
- source_word: εἰς τὴν νεφέλην
  choice: na nuvem
  rationale: Com o verbo entrar, 'na nuvem' expressa naturalmente em português o movimento para dentro indicado por εἰς.
theological_decisions:
- issue: Natureza da nuvem e de sua ação
  choice: Descrever apenas que a nuvem surgiu e começou a cobri-los com sua sombra.
  alternative: Identificar explicitamente a nuvem como manifestação da presença ou glória divina.
  rationale: O contexto evoca cenas veterotestamentárias da presença manifesta de Deus, mas o versículo não identifica expressamente a nuvem; a tradução conserva a imagem sem resolver a alusão no texto principal.
- issue: Referente de αὐτούς em εἰσελθεῖν αὐτούς
  choice: Manter o pronome implícito e abrangente em 'ao entrarem'.
  alternative: Explicitar 'quando aqueles homens entraram', limitando a entrada a Jesus, Moisés e Elias.
  rationale: A sintaxe permite discussão sobre o referente do pronome. A formulação portuguesa preserva a ambiguidade do grego em vez de selecionar silenciosamente um grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão 'cobri-los com sua sombra' é mais clara no uso comum do que 'ensombreá-los' e mantém a imagem do verbo grego. A construção final evita resolver o referente potencialmente ambíguo de αὐτούς.
