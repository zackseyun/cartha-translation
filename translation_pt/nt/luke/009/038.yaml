  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: pt
  text: 'E eis que um homem da multidão gritou: “Mestre, eu te suplico: olha para o meu filho, pois ele é meu único filho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador de atenção e o fluxo narrativo de Lucas em linguagem bíblica ainda compreensível no português moderno.
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: um homem da multidão
  rationale: Mantém tanto a referência explícita a um homem quanto sua procedência entre as pessoas reunidas.
- source_word: ἐβόησεν λέγων
  choice: gritou
  rationale: Comunica a fala alta e urgente; em português, introduzir diretamente a fala evita a construção redundante “gritou, dizendo” sem perda relevante.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É a forma natural e tradicional de dirigir-se a um διδάσκαλος em português, conservando o sentido de quem ensina sem acrescentar um título cristológico.
- source_word: δέομαί σου
  choice: eu te suplico
  rationale: Expressa o apelo intenso e urgente de δέομαι com dignidade e naturalidade.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: olha para
  rationale: Traduz o pedido de que Jesus volte sua atenção ao menino. No contexto, a expressão sugere consideração e cuidado, não um mero olhar casual.
- source_word: τὸν υἱόν μου
  choice: o meu filho
  rationale: Correspondência direta e natural ao sintagma grego.
- source_word: μονογενής μοί ἐστιν
  choice: ele é meu único filho
  rationale: No contexto, μονογενής indica que o menino é o único descendente do homem. “Único filho” preserva sua identidade masculina já explicitada e é idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva o relevo narrativo de ἰδού; “eu te suplico” mantém a intensidade emocional do pedido. Não foi incluída nota, pois “meu único filho” comunica naturalmente a referência contextual de μονογενής sem criar uma alternativa substantiva em português.
