  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: pt
  text: E ele os enviou para proclamar o reino de Deus[a] e curar os doentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reinado de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo de ἀποστέλλω significa “enviar”. Em português, “os enviou” expressa naturalmente o comissionamento no contexto, sem exigir a explicitação “para fora”.
- source_word: κηρύσσειν
  choice: proclamar
  rationale: κηρύσσω indica anúncio público. “Proclamar” preserva essa força e evita restringir o sentido à pregação em ambiente religioso.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: É a formulação bíblica consagrada e transparente, capaz de abranger tanto o domínio quanto o governo soberano de Deus.
- source_word: ἰᾶσθαι
  choice: curar
  rationale: ἰάομαι, neste contexto, denota restaurar a saúde. “Curar” é a equivalência direta e natural em português.
- source_word: τοὺς ἀσθενεῖς
  choice: os doentes
  rationale: Embora ἀσθενής também possa significar “fraco”, sua combinação com “curar” indica pessoas enfermas; “os doentes” comunica esse sentido com clareza.
theological_decisions:
- issue: Sentido de βασιλεία τοῦ θεοῦ
  choice: o reino de Deus
  alternative: o reinado de Deus
  rationale: A expressão pode destacar tanto a esfera quanto o exercício do governo divino. “Reino de Deus” preserva essa amplitude tradicional, enquanto a nota registra a alternativa que enfatiza mais diretamente o governo de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples acompanha a estrutura grega, e o marcador [a] aparece imediatamente após a expressão a que se refere.
