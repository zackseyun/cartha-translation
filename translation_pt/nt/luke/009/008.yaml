  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: pt
  text: outros, porém, diziam que Elias tinha aparecido; e outros, que algum profeta dos tempos antigos havia ressuscitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: outros ... e outros
  rationale: A construção elíptica retoma a ideia de que diferentes pessoas davam explicações distintas sobre Jesus. Em português, explicitar “diziam” na primeira oração torna o fragmento natural e claro.
- source_word: δὲ ... δὲ
  choice: porém ... e
  rationale: O primeiro δέ marca a passagem a outra opinião, enquanto o segundo acrescenta mais uma. A combinação evita uma repetição pesada sem eliminar a progressão da lista.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ἐφάνη
  choice: tinha aparecido
  rationale: Expressa o sentido de tornar-se visível ou aparecer e, pelo mais-que-perfeito composto, situa a suposta aparição antes dos comentários relatados.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: algum profeta dos tempos antigos
  rationale: τις dá caráter indefinido ao profeta, e τῶν ἀρχαίων o situa entre os profetas de épocas remotas. “Dos tempos antigos” é mais natural em português atual do que “dos antigos” e não identifica qual profeta seria.
- source_word: ἀνέστη
  choice: havia ressuscitado
  rationale: No contexto, o verbo indica levantar-se dentre os mortos. “Ressuscitado” comunica essa ideia claramente, sem introduzir a voz passiva “havia sido ressuscitado”, que o grego não exige.
theological_decisions:
- issue: Natureza da afirmação popular sobre o profeta antigo
  choice: havia ressuscitado
  alternative: havia voltado / havia sido ressuscitado
  rationale: A tradução conserva a linguagem de ressurreição sugerida por ἀνέστη, apresentando-a apenas como opinião relatada, sem endossá-la nem definir o agente da ressurreição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Como o versículo começa no meio de uma enumeração iniciada no versículo anterior, “outros” preserva a continuidade contextual. O ponto e vírgula separa com clareza as duas opiniões.
