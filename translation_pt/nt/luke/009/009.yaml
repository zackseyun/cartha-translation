  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: pt
  text: 'Mas Herodes disse: “João, eu o decapitei. Mas quem é este de quem ouço tais coisas?” E procurava vê-lo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E continuava procurando vê-lo.” O imperfeito grego pode indicar uma ação em curso ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a continuação do discurso com leve contraste em relação aos relatos anteriores e introduz naturalmente a reação de Herodes.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: João, eu mandei decapitar
  rationale: Mantém o pronome explícito e enfático ἐγώ. A construção causativa é natural em português e condiz com a execução ordenada por um governante, sem perder o sentido específico de decapitação do verbo.
- source_word: τίς δέ ἐστιν οὗτος
  choice: Quem, então, é este
  rationale: Preserva a pergunta direta e o tom de perplexidade; “então” expressa aqui a força discursiva de δέ sem repetir “mas” de modo pouco natural.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: a respeito de quem ouço tais coisas
  rationale: Tradução próxima do grego, mantendo τοιαῦτα geral, sem restringi-lo interpretativamente a “relatos” ou “milagres”.
- source_word: καὶ ἐζήτει ἰδεῖν αὐτόν
  choice: E procurava vê-lo
  rationale: O imperfeito ἐζήτει é representado pelo pretérito imperfeito português, que preserva a ação em curso sem decidir se era repetida; ἰδεῖν permanece no sentido direto de “ver”.
theological_decisions:
- issue: A afirmação de Herodes sobre João e sua curiosidade acerca de Jesus
  choice: Traduzir como afirmação histórica seguida de uma pergunta, sem explicitar medo, ressurreição ou uma identificação de Jesus com João.
  alternative: Parafrasear como se Herodes temesse que João tivesse ressuscitado.
  rationale: Embora o contexto anterior explique sua perplexidade, este versículo apenas registra que Herodes mandou decapitar João, pergunta quem é a pessoa de quem ouve tais coisas e procura vê-la. A tradução conserva essa contenção e tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Mandou decapitar” evita sugerir que Herodes realizou pessoalmente a execução, ao mesmo tempo que mantém sua responsabilidade expressa no grego. O marcador [a] está colocado após a oração a que a nota se refere.
