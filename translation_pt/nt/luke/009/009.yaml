- from: 'Mas Herodes disse: “João, eu mandei decapitar. Quem, então, é este a respeito de quem ouço tais coisas?” E procurava vê-lo.[a]'
  to: 'Mas Herodes disse: “João, eu o decapitei. Mas quem é este de quem ouço tais coisas?” E procurava vê-lo.[a]'
  rationale: A revisão substitui a construção causativa por uma tradução direta de ἀπεκεφάλισα, preservando a ênfase de ἐγώ em “eu o decapitei”. Também torna a pergunta mais fluente em português e mantém δέ como contraste (“Mas”), sem acrescentar inferências sobre a identidade de Jesus ou sobre a ressurreição de João. A nota mantém a possibilidade aspectual do imperfeito sem impor uma leitura única.
  reviewer_model: gpt-5.6-terra
