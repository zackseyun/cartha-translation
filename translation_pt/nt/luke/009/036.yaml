reference: Luke 9:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: pt
  text: Quando a voz se fez ouvir, Jesus foi encontrado sozinho. Eles se calaram e, naqueles dias, não contaram a ninguém nada do que tinham visto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Quando a voz cessou
  rationale: A construção com ἐν e infinitivo articular é temporal. Embora γενέσθαι isoladamente signifique literalmente 'acontecer' ou 'vir a ser', no contexto a expressão assinala o momento em que a voz terminou, como mostra o resultado imediato de Jesus estar sozinho. 'Cessou' comunica esse valor contextual de modo natural, sem transformar φωνή em mero som.
- source_word: φωνή
  choice: voz
  rationale: No contexto da transfiguração, φωνή designa a declaração celestial; 'voz' é a correspondência direta e adequada.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Preserva a forma passiva e a contenção narrativa do aoristo de εὑρίσκω. Alternativas como 'foi visto' ou 'permaneceu' explicitariam uma interpretação possível, mas não lexicalmente necessária.
- source_word: μόνος
  choice: sozinho
  rationale: Indica que Jesus estava sem Moisés e Elias. 'Sozinho' é claro e idiomático em português.
- source_word: ἐσίγησαν
  choice: ficaram calados
  rationale: Expressa naturalmente o silêncio assumido pelos discípulos após o acontecimento, sem sugerir necessariamente uma ordem explícita para que se calassem.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: não contaram a ninguém
  rationale: ἀπαγγέλλω significa contar, comunicar ou relatar. 'Não contaram a ninguém' é natural no registro narrativo moderno.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Correspondência temporal direta, concisa e tradicional sem ser arcaica.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: nada do que tinham visto
  rationale: Preserva o pronome negativo e a relação partitiva da oração relativa. O mais-que-perfeito composto situa a visão antes do silêncio e da ausência de relato.
theological_decisions:
- issue: Implicação narrativa da presença solitária de Jesus depois da voz celestial
  choice: Jesus foi encontrado sozinho
  alternative: Só Jesus permaneceu / eles viram apenas Jesus
  rationale: A tradução permanece descritiva e conserva o passivo grego, sem converter o desfecho da cena numa explicação teológica explícita.
- issue: Valor temporal de ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Quando a voz cessou
  alternative: Quando a voz se fez ouvir / enquanto a voz soava
  rationale: O contexto favorece o término da voz como ponto em que Jesus é encontrado sozinho, mas a formulação grega é compacta e admite descrição mais literal do acontecimento da voz; a nota preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência, sem eliminar a repetição negativa enfática do grego.
