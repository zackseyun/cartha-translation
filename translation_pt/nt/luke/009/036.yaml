revisions:
- from: Quando a voz cessou[a], Jesus foi encontrado sozinho. Eles ficaram calados e, naqueles dias, não contaram a ninguém nada do que tinham visto.
  to: Quando a voz se fez ouvir, Jesus foi encontrado sozinho. Eles se calaram e, naqueles dias, não contaram a ninguém nada do que tinham visto.
  rationale: A revisão substitui “cessou” por “se fez ouvir”, que traduz de modo natural o acontecimento da voz sem introduzir seu término como conteúdo lexical. O restante é mantido em sentido e registro, com “se calaram” refletindo diretamente o verbo grego para guardar silêncio. A nota é removida porque a alternativa necessária já está incorporada ao texto e a nota anterior continha uma alegação lexical imprecisa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:09:50Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução de εὑρέθη μόνος como “Jesus foi encontrado sozinho” preserva bem o passivo e a descrição contida da cena. “Ficaram calados”, “não contaram a ninguém” e “nada do que tinham visto” também correspondem adequadamente ao grego. Contudo, “Quando a voz cessou” atribui a γενέσθαι (“acontecer/ocorrer, vir a ser”) o sentido específico de “cessar”, que não está expresso na construção.
  naturalness: O português é claro, moderno e adequado ao registro narrativo. “Quando a voz se fez ouvir” é uma formulação natural e evita a especificação indevida de que a voz terminou.
  terminology: “Voz”, “foi encontrado sozinho”, “se calaram” e “contaram a ninguém” são escolhas terminologicamente sólidas e sem carga doutrinária acrescentada.
  issues:
  - severity: medium
    issue: “Quando a voz cessou” sobretraduz ἐν τῷ γενέσθαι τὴν φωνήν.
    rationale: A expressão temporal refere-se ao ocorrer ou fazer-se ouvir da voz; embora o contexto situe o achado de Jesus após a voz, o verbo γενέσθαι não significa “cessar”. A nota atual também chama de literal uma formulação que não é literal.
  - severity: low
    issue: A nota de rodapé propõe uma alternativa válida, mas sua explicação literal é inexata.
    rationale: “Quando a voz aconteceu” pode espelhar mecanicamente o verbo, mas não é uma formulação literal idiomática nem a melhor explicação em português; a nota não é necessária para preservar o sentido.
  revised_text: Quando a voz se fez ouvir, Jesus foi encontrado sozinho. Eles se calaram e, naqueles dias, não contaram a ninguém nada do que tinham visto.
  revised_footnotes: []
