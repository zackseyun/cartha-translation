    rationale: Κατακλίνατε sugere reclinar-se para uma refeição, mas o contexto deve permanecer como nuance lexical, adequadamente registrada em nota, em vez de ser acrescentado à linha principal.
  - severity: low
    issue: “Façam-nos reclinar-se” soa pesado e pouco idiomático.
    rationale: “Façam que se reclinem” exprime naturalmente o imperativo causativo sem alterar o sentido.
  - severity: low
    issue: “Então” dá a δέ uma força temporal mais específica do que a necessária.
    rationale: “E” reproduz melhor a simples progressão narrativa do grego.
