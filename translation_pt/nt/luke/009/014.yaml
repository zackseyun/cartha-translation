  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: pt
  text: 'Pois havia cerca de cinco mil homens[a]. E disse aos seus discípulos: “Façam que se reclinem[b] em grupos de cerca de cinquenta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “homens”, referindo-se especificamente a homens adultos; mulheres e crianças não estão incluídas nesse número.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Façam que se sentem”. O verbo grego sugere especificamente reclinar-se para uma refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: cerca de
  rationale: Indica aproximação nas duas ocorrências e é a formulação mais natural em português corrente.
- source_word: ἄνδρες
  choice: homens
  rationale: Refere-se especificamente a homens adultos, e não à multidão inteira de modo genérico.
- source_word: πεντακισχίλιοι
  choice: cinco mil
  rationale: Tradução direta do numeral cardinal que qualifica “homens”.
- source_word: Κατακλίνατε
  choice: Façam-nos reclinar-se para a refeição
  rationale: Preserva o sentido causativo e a postura de reclinar-se própria de uma refeição, embora exija uma pequena explicitação para soar clara ao leitor moderno.
- source_word: κλισίας
  choice: em grupos
  rationale: Comunica de modo idiomático as divisões organizadas da multidão.
- source_word: ἀνὰ πεντήκοντα
  choice: de cerca de cinquenta
  rationale: Expressa o valor distributivo de ἀνά e mantém a aproximação indicada por ὡσεὶ.
- source_word: γὰρ ... δὲ
  choice: Pois ... Então
  rationale: “Pois” conserva a função explicativa de γάρ; “então” apresenta com naturalidade a continuação narrativa marcada por δέ.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: aos seus discípulos
  rationale: Mantém o pronome possessivo explícito no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A construção “reclinar-se para a refeição” conserva a nuance histórica do verbo sem deixar ambígua a ação.
