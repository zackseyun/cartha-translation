- from: 'Pois havia cerca de cinco mil homens[a]. Então ele disse aos seus discípulos: “Façam-nos reclinar-se para a refeição[b] em grupos de cerca de cinquenta.”'
  to: 'Pois havia cerca de cinco mil homens[a]. E disse aos seus discípulos: “Façam que se reclinem[b] em grupos de cerca de cinquenta.”'
  rationale: A revisão elimina uma explicitação contextual do texto principal, melhora a naturalidade do imperativo em português e mantém, em nota, a nuance de refeição associada ao verbo grego. Também substitui “Então” por “E” para refletir mais sobriamente a função narrativa de δέ.
