id: LUK.9.27
reference: Luke 9:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: pt
  text: 'Mas digo a vocês, em verdade: alguns dos que estão aqui[a] certamente não provarão a morte[b] até verem o reino de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “dos que estão aqui de pé”.'
    reason: lexical_alternative
  - marker: b
    text: “Provar a morte” é uma expressão que significa experimentar a morte, isto é, morrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Mas digo a vocês, em verdade
  rationale: Mantém o marcador discursivo δέ com “Mas” e traduz ἀληθῶς como locução adverbial, preservando a ordem e a ênfase do grego em português natural e digno.
- source_word: εἰσίν τινες
  choice: alguns
  rationale: No contexto da oração, “alguns” expressa de modo natural a referência indefinida de τινες, sem a rigidez de “há certos”.
- source_word: τῶν αὐτοῦ ἑστηκότων
  choice: dos que estão aqui
  rationale: Expressa naturalmente o grupo presente indicado pela construção partitiva e pelo particípio perfeito de ἵστημι. A imagem literal de estar de pé é registrada em nota, pois não é necessária para identificar o grupo em português.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: certamente não provarão a morte
  rationale: “Certamente não” comunica a negação enfática οὐ μή, enquanto “provarão a morte” conserva a metáfora de γεύομαι em vez de reduzi-la a “morrerão”.
- source_word: ἕως ἂν ἴδωσιν
  choice: até verem
  rationale: Construção portuguesa natural para a oração futura introduzida por ἕως ἄν com subjuntivo aoristo, sem acrescentar aspecto não explicitado pelo texto.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: É a formulação portuguesa tradicional, clara e semanticamente ampla, preservando tanto a ideia de governo quanto a esfera do reinado sem restringir βασιλεία a uma só nuance.
theological_decisions:
- issue: Referente de “verem o reino de Deus” no contexto
  choice: Manter a expressão sem expansão interpretativa
  alternative: Identificá-la especificamente com a transfiguração, a ressurreição e ascensão, a destruição de Jerusalém ou a expansão da igreja
  rationale: O grego não explicita aqui qual manifestação do reino está em vista. A tradução conserva a ambiguidade e a tensão escatológica, sem impor uma interpretação histórica ou denominacional.
- issue: Força da negação οὐ μή
  choice: certamente não
  alternative: de modo nenhum
  rationale: Ambas refletem a negação grega enfática; “certamente não” é fluente e digna em português e evita que a frase soe excessivamente rígida.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “vocês” é claro e corrente; a locução “em verdade” preserva a solenidade sem arcaísmo excessivo. A metáfora “provar a morte” foi mantida no texto e esclarecida em nota.
