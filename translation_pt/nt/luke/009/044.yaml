  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: pt
  text: “Vocês, gravem bem estas palavras nos ouvidos, pois o Filho do Homem está para ser entregue[a] nas mãos dos homens.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ser traído”. O verbo grego pode significar “entregar”, “pôr sob o poder de alguém” ou, em certos contextos, “trair”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dos seres humanos”. Aqui, o termo grego traduzido como “homens” pode referir-se mais amplamente aos seres humanos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Vocês, gravem bem nos ouvidos
  rationale: O imperativo com o pronome explícito recebe ênfase por meio de “Vocês”. “Gravem bem nos ouvidos” conserva a imagem vívida do grego e comunica de modo natural a ideia de ouvir atentamente e reter, sem reduzi-la a uma simples ordem para escutar.
- source_word: τοὺς λόγους τούτους
  choice: estas palavras
  rationale: Refere-se à declaração específica que Jesus está prestes a fazer; “palavras” é direto, claro e natural.
- source_word: ὁ γὰρ
  choice: ':'
  rationale: Neste contexto, γάρ introduz o conteúdo que explica por que as palavras devem ficar gravadas. Os dois-pontos exprimem essa ligação explicativa de maneira natural em português, sem acrescentar uma relação diferente.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma tradicional e literal do título, bem como sua ambiguidade e sua ressonância bíblica, inclusive a possível alusão a Daniel 7.
- source_word: μέλλει
  choice: está para
  rationale: Expressa a ação iminente indicada por μέλλω com infinitivo, sem introduzir uma ideia mais forte de destino inevitável.
- source_word: παραδίδοσθαι
  choice: ser entregue
  rationale: Preserva o sentido amplo de ser posto sob o poder de outros, sem restringir antecipadamente o verbo ao ato de traição de Judas.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: nas mãos dos homens
  rationale: Conserva a conhecida imagem de ficar sob o poder de alguém. “Homens” preserva o contraste verbal com “Filho do Homem”, enquanto a nota registra que o substantivo grego pode abranger os seres humanos em geral.
theological_decisions:
- issue: Tradução do título ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Ser Humano
  rationale: A forma tradicional conserva o caráter titular, a ambiguidade da expressão e sua provável ressonância em Daniel 7, sem impor uma interpretação cristológica mais estreita.
- issue: Amplitude semântica de παραδίδοσθαι
  choice: ser entregue
  alternative: ser traído
  rationale: A forma passiva descreve de modo amplo Jesus sendo colocado sob o poder de agentes humanos. “Traído” é possível, mas estreitaria o foco ao ato de traição.
- issue: Alcance de ἀνθρώπων
  choice: homens
  alternative: seres humanos
  rationale: “Homens” mantém o contraste retórico com “Filho do Homem”; a nota preserva a possibilidade de referência mais ampla à humanidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação “gravem bem nos ouvidos” preserva a imagem enfática do original sem recorrer ao literalismo pouco idiomático de “ponham estas palavras nos ouvidos”. Mantiveram-se o título tradicional “Filho do Homem” e o contraste com “homens”.
