id: LUK.9.47
reference: Luke 9:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: pt
  text: Mas Jesus, sabendo o que eles ponderavam no coração, tomou uma criança e a colocou ao seu lado,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio de ὁράω expressa aqui percepção ou conhecimento mental; “sabendo” é natural e não especifica como Jesus obteve esse conhecimento.
- source_word: διαλογισμὸν
  choice: o que eles ponderavam
  rationale: A expressão verbal comunica o raciocínio ou a deliberação interior, preservando melhor a nuance cognitiva do que o termo mais genérico “pensamento”.
- source_word: τῆς καρδίας αὐτῶν
  choice: no coração
  rationale: Mantém o singular καρδίας e comunica em português o âmbito interior compartilhado pelo plural “eles”, sem produzir a construção pouco natural “do coração deles” neste contexto.
- source_word: ἐπιλαβόμενος
  choice: tomou
  rationale: Embora possa significar “tomar pela mão” ou “agarrar”, o contexto não explicita a maneira; “tomou” conserva a ação concreta sem sugerir força indevida.
- source_word: παιδίον
  choice: uma criança
  rationale: É o equivalente corrente e claro; “criancinha” acrescentaria uma ênfase diminutiva não necessária.
- source_word: ἔστησεν
  choice: colocou
  rationale: O aoristo causativo significa fazer ficar de pé ou pôr em determinado lugar; “colocou” é preciso e natural no português moderno.
- source_word: παρ’ ἑαυτῷ
  choice: ao seu lado
  rationale: Expressa de modo claro que Jesus colocou a criança junto de si, evitando qualquer ambiguidade referencial ou idiomática desnecessária.
theological_decisions:
- issue: O conhecimento de Jesus acerca do raciocínio interior dos discípulos
  choice: A tradução afirma que Jesus sabia o que eles ponderavam interiormente, sem indicar o mecanismo desse conhecimento.
  alternative: Explicitar onisciência sobrenatural ou mera percepção humana aguçada.
  rationale: Lucas afirma o conhecimento de Jesus, mas não explica aqui como ele o possuía; a tradução preserva essa tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem acompanha o grego sem sacrificar a naturalidade. Não foram necessárias notas, pois as alternativas lexicais relevantes podem ser representadas adequadamente no texto principal.
