id: LUK.9.11
reference: Luke 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: pt
  text: As multidões, porém, ao saberem disso, seguiram-no. Ele as acolheu, falava-lhes sobre o Reino de Deus e curava os que precisavam de tratamento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de cura”. O termo grego também pode significar “cura”, “tratamento” ou “cuidado”.
    reason: Registra a amplitude lexical de θεραπεία sem resolver indevidamente a nuance no texto principal.
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: As multidões, porém
  rationale: Preserva o plural ὄχλοι e expressa δέ como uma transição levemente contrastiva, natural no contexto.
- source_word: γνόντες
  choice: ao saberem disso
  rationale: Apresenta o particípio aoristo como circunstância temporal e mantém implícito, como no grego, o conteúdo exato de que tomaram conhecimento.
- source_word: ἠκολούθησαν αὐτῷ
  choice: seguiram-no
  rationale: É a equivalência direta e natural para o ato de ir após Jesus, sem eliminar a possível ressonância de seguimento discipular.
- source_word: ἀποδεξάμενος αὐτούς
  choice: Ele as acolheu
  rationale: Comunica a recepção favorável e calorosa expressa por ἀποδέχομαι.
- source_word: ἐλάλει αὐτοῖς
  choice: falava-lhes
  rationale: O imperfeito é mantido para indicar uma ação em andamento.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: sobre o Reino de Deus
  rationale: Conserva a expressão bíblica tradicional e transparente; a inicial maiúscula em “Reino” favorece seu reconhecimento como expressão temática sem alterar o sentido.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: os que precisavam de tratamento
  rationale: “Tratamento” representa uma acepção legítima de θεραπεία, soa natural em português e evita a repetição pouco elegante de “curava os que precisavam de cura”.
- source_word: ἰᾶτο
  choice: curava
  rationale: O imperfeito expressa a atividade contínua de curar, em paralelo com “falava”.
theological_decisions:
- issue: Tradução de βασιλεία τοῦ θεοῦ
  choice: Reino de Deus
  alternative: reinado de Deus
  rationale: “Reino de Deus” é a formulação bíblica consolidada e suficientemente ampla para abranger o governo divino, sem reduzir a expressão apenas a um território.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação “acolheu, falava-lhes... e curava” conserva a sequência narrativa e distingue o acolhimento pontual das ações contínuas expressas pelos imperfeitos gregos.
