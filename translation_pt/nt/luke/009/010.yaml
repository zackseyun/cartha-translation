  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: pt
  text: Quando os apóstolos voltaram, contaram a Jesus tudo o que tinham feito. E, levando-os consigo, retirou-se à parte[a] para uma cidade chamada Betsaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em particular”. A expressão indica afastamento da multidão, não necessariamente isolamento completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Quando ... voltaram
  rationale: O particípio aoristo indica uma ação anterior à de contar; a oração temporal expressa com naturalidade a sequência em português.
- source_word: οἱ ἀπόστολοι
  choice: os apóstolos
  rationale: Em Lucas, é a designação reconhecida dos Doze no contexto de sua missão; a forma tradicional é clara e precisa.
- source_word: διηγήσαντο αὐτῷ
  choice: contaram a Jesus
  rationale: O verbo denota narrar ou relatar. “Contaram” é natural e não confere formalidade excessiva; o referente pronominal é explicitado para maior clareza em português.
- source_word: ὅσα ἐποίησαν
  choice: tudo o que tinham feito
  rationale: ὅσα abrange as coisas que fizeram, e o mais-que-perfeito composto marca a anterioridade em relação ao relato.
- source_word: παραλαβὼν αὐτούς
  choice: os levou consigo
  rationale: Expressa que Jesus tomou os apóstolos como seus acompanhantes, de modo conciso e idiomático.
- source_word: ὑπεχώρησεν
  choice: se retirou
  rationale: Preserva a ideia de afastar-se da atividade pública ou da multidão, em vez do sentido mais neutro de simplesmente partir.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: Indica afastamento reservado, separado da multidão, sem sugerir que Jesus estivesse sozinho, pois os apóstolos o acompanhavam.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: para uma cidade chamada Betsaida
  rationale: “Cidade” é o equivalente comum de πόλις e não exige uma distinção moderna rígida quanto ao tamanho do povoado; “chamada” traduz naturalmente o particípio.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Forma consagrada do topônimo em português.
theological_decisions:
- issue: Sentido de κατ’ ἰδίαν apesar da companhia dos apóstolos
  choice: em particular
  alternative: à parte
  rationale: A expressão descreve a retirada para longe da multidão, não solidão absoluta. A tradução mantém essa tensão sem contradizer a afirmação de que Jesus levou os apóstolos consigo.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. O nome de Jesus foi explicitado onde o grego traz pronome, evitando possível ambiguidade sem alterar o referente.
