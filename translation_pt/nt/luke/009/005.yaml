id: LUK.9.5
reference: Luke 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: pt
  text: E, quanto a todos os que não receberem vocês[a], ao saírem daquela cidade[b], sacudam a poeira dos pés de vocês como testemunho contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não acolherem vocês”. O verbo pode incluir tanto receber quanto acolher e aceitar os mensageiros.
    reason: lexical_alternative
  - marker: b
    text: Ou “daquele povoado”. A palavra grega pode designar uma cidade ou uma localidade menor, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: se alguns não receberem vocês
  rationale: A construção generalizante abrange quaisquer pessoas que rejeitem os mensageiros. “Receber” mantém tanto a ideia de acolhimento quanto a de aceitação, sem restringi-la à hospedagem.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: ao saírem daquela cidade
  rationale: O particípio indica uma ação contemporânea à ordem principal. “Ao saírem” é natural e preserva o valor temporal; πόλις pode designar cidade ou povoado.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ἀποτινάσσετε
  choice: sacudam dos pés a poeira
  rationale: A formulação conserva a imagem concreta da remoção deliberada da poeira dos pés e soa natural em português.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: como testemunho contra eles
  rationale: A expressão apresenta o gesto como testemunho de caráter adversativo, sem explicitar além do texto a extensão do juízo envolvido.
theological_decisions:
- issue: Força simbólica do ato de sacudir a poeira
  choice: como testemunho contra eles
  alternative: como sinal para eles; como declaração explícita de condenação divina
  rationale: A tradução preserva a força solene e judicial da expressão grega, mas não transforma o gesto numa afirmação explícita de condenação final, que o versículo não formula.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e imperativo correspondente. A ordem foi levemente ajustada para fluência, sem eliminar a ambiguidade lexical de πόλις, registrada em nota.
