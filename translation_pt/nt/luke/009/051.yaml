    issue: A preposição «para» em «os dias para ele ser levado para o alto» pode expressar propósito ou expectativa temporal.
    rationale: O genitivo τῆς ἀναλήμψεως αὐτοῦ qualifica «os dias» como os dias de seu ser levado para o alto, não como dias destinados a esse evento. A troca por «de» corrige a relação semântica.
  revised_text: Aconteceu que, quando se completavam os dias de ele ser levado para o alto[a], Jesus decidiu firmemente[b] ir para Jerusalém.
