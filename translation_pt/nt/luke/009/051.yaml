source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: pt
  text: Aconteceu que, quando se completavam os dias de ele ser levado para o alto[a], Jesus decidiu firmemente[b] ir para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de sua ascensão”. O grego diz literalmente “de ele ser levado para o alto”.'
    reason: Registra a tradução tradicional e plausível sem estreitar a possível abrangência da expressão grega.
  - marker: b
    text: Literalmente, “firmou o rosto”, expressão que indica uma decisão resoluta.
    reason: Preserva a imagem do idioma original e explica sua força ao leitor moderno.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Mantém a fórmula de transição narrativa sem recorrer ao arcaísmo “sucedeu que”; o valor conectivo de δέ fica integrado naturalmente à construção.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: quando se completavam os dias
  rationale: A construção com infinitivo articulado é temporal, e o presente συμπληροῦσθαι apresenta o período em processo de chegar ao seu cumprimento. “Os dias” preserva a imagem concreta do texto grego.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: para ele ser levado para o alto
  rationale: Traduz o sentido básico de ἀνάλημψις sem restringi-lo de antemão apenas à ascensão; a formulação permite que o leitor perceba o movimento mais amplo rumo à morte, ressurreição e exaltação de Jesus.
- source_word: καὶ αὐτὸς
  choice: Jesus
  rationale: A retomada explícita do nome identifica naturalmente o sujeito em português. A ênfase do pronome grego é comunicada sobretudo pela firmeza da decisão na oração principal.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: decidiu firmemente
  rationale: Comunica em português atual a força idiomática da expressão sem sugerir apenas um movimento físico do rosto. A imagem literal é preservada em nota.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: ir para Jerusalém
  rationale: Expressa de modo natural a finalidade e o destino indicados pelo infinitivo e por εἰς.
theological_decisions:
- issue: Alcance de ἀνάλημψις
  choice: ser levado para o alto
  alternative: sua ascensão
  rationale: A expressão escolhida conserva a amplitude do termo grego e não decide se Lucas se refere exclusivamente à ascensão ou ao conjunto dos acontecimentos que conduzem à exaltação de Jesus.
- issue: Força da expressão τὸ πρόσωπον ἐστήρισεν
  choice: decidiu firmemente
  alternative: firmou o rosto
  rationale: A tradução principal comunica com clareza a determinação resoluta de Jesus; a nota mantém acessível a metáfora sem transformar uma expressão semítica em formulação pouco natural no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evita tanto o arcaísmo quanto a rigidez de uma reprodução literal, preservando em notas a metáfora e a ambiguidade teológica relevantes.
