  to: 'Mas Jesus respondeu: “Ó geração incrédula e distorcida, até quando estarei com vocês e os suportarei? Traga seu filho aqui.”'
  rationale: A revisão elimina o acréscimo de obrigação em «terei de» e substitui uma opção portuguesa mais restritiva por «distorcida», que reproduz com maior amplitude o sentido de διεστραμμένη. Mantêm-se a ambiguidade quanto ao grupo repreendido, a força retórica da exclamação, o plural «vocês» e o imperativo singular dirigido ao pai.
