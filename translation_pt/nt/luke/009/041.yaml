source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: pt
  text: 'Mas Jesus respondeu: “Ó geração incrédula e distorcida, até quando estarei com vocês e os suportarei? Traga seu filho aqui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄπιστος
  choice: incrédula
  rationale: Expressa de modo natural a falta de fé ou confiança indicada pelo grego, sem restringir o sentido à simples ignorância.
- source_word: διεστραμμένη
  choice: pervertida
  rationale: Preserva a ideia de uma geração moralmente desviada ou distorcida; no contexto, o termo qualifica a geração, não necessariamente cada indivíduo de forma isolada.
- source_word: ἀνέξομαι ὑμῶν
  choice: terei de suportá-los
  rationale: Comunica a ideia de tolerar ou aguentar pessoas, mantendo o tom de lamento e repreensão da pergunta.
- source_word: προσάγαγε ὧδε
  choice: Traga ... aqui
  rationale: É a forma direta e idiomática de transmitir a ordem no singular.
theological_decisions:
- issue: Alcance da repreensão “geração incrédula e pervertida”
  choice: Manter o destinatário coletivo indefinido, como no grego
  alternative: Identificar explicitamente os discípulos, a multidão ou os contemporâneos de Jesus
  rationale: O texto usa “geração” e o pronome plural sem especificar com precisão um único grupo; identificar o alvo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A inversão “Ó geração...” conserva a força retórica da exclamação. O singular “Traga” acompanha a ordem dirigida ao pai mencionado no contexto.
