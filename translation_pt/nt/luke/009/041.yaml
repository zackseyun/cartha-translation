review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e o sentido geral estão corretos: Jesus responde, repreende uma «geração» coletiva, pergunta por quanto tempo estará com eles e os suportará, e ordena que o filho seja trazido. Contudo, «terei de suportá-los» introduz a noção de obrigação («terei de»), que não está expressa em ἀνέξομαι. «Pervertida» pode sugerir em português um sentido predominantemente sexual ou de depravação individual, mais estreito do que διεστραμμένη («distorcida», «desviada», «deturpada»).'
  naturalness: «Mas Jesus respondeu» e o tratamento por «vocês» são naturais e adequados ao registro moderno. «Até quando estarei com vocês e os suportarei?» é idiomático, preserva a pergunta retórica e evita o acréscimo modal da redação anterior.
  terminology: «Incrédula» representa bem ἄπιστος. «Distorcida» comunica de forma ampla e contemporânea o qualificativo διεστραμμένη, sem impor uma leitura sexualizada ou denominacional. Não há nomes, termos técnicos ou âncoras de nota que exijam tratamento adicional.
  issues:
  - severity: medium
    issue: «terei de suportá-los» acrescenta obrigação ou necessidade
    rationale: O futuro ἀνέξομαι significa «suportarei/tolerarei»; o grego não inclui um equivalente de «terei de».
  - severity: low
    issue: «pervertida» é semanticamente mais carregado e potencialmente mais estreito
    rationale: Embora possa traduzir o termo em certos contextos, em português moderno tende a evocar depravação, frequentemente sexual. «Distorcida» preserva melhor a imagem de algo desviado ou deformado e se alinha ao sentido lexical e ao audit trail inglês («twisted»).
