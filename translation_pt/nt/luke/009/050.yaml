reference: Luke 9:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: pt
  text: 'Mas Jesus lhe disse: “Não o impeçam[a], pois quem não é contra vocês é a favor de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não o detenham” ou “Não o proíbam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Mas Jesus lhe disse
  rationale: δέ marca uma conexão levemente contrastiva com a objeção anterior; “mas” é natural neste contexto. “Lhe” preserva a referência pronominal a João sem substituir o pronome pelo nome próprio.
- source_word: Μὴ κωλύετε
  choice: Não o impeçam
  rationale: κωλύω pode significar impedir, deter ou proibir. “Não o impeçam” expressa com clareza a ordem dirigida ao grupo de discípulos, enquanto “o” retoma o homem mencionado no contexto.
- source_word: ὃς γὰρ
  choice: pois quem
  rationale: γάρ fundamenta a ordem anterior, e ὅς tem aqui força generalizadora. “Pois quem” comunica essa máxima de modo conciso e natural.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: não é contra vocês
  rationale: κατά com o genitivo indica oposição. “Vocês” torna explícito que ὑμῶν é plural e oferece ampla legibilidade brasileira.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: é a favor de vocês
  rationale: ὑπέρ expressa apoio ou alinhamento. “A favor de” preserva o paralelismo antitético com “contra” em português corrente.
theological_decisions:
- issue: Alcance da declaração de Jesus
  choice: 'Traduzir ὅς com sentido geral: “quem não é contra vocês...”'
  alternative: “Aquele que não é contra vocês...”
  rationale: A frase se aplica ao homem mencionado, mas também apresenta um princípio mais amplo. “Quem” preserva esse alcance sem acrescentar uma delimitação doutrinária.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. O plural “vocês” explicita a forma plural grega; “lhe disse” mantém a referência pronominal do original. A construção paralela “contra vocês / a favor de vocês” preserva a tensão e a concisão da máxima.
