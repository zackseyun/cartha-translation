reference: Luke 9:59
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: pt
  text: 'Então ele disse a outro: “Siga-me.” Mas este respondeu: “Senhor, permita-me primeiro ir e sepultar meu pai.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Senhor, deixe-me ir primeiro e sepultar meu pai.”'
    reason: Alternativa idiomática para o pedido de permissão e para a relação entre ἀπελθόντι πρῶτον e θάψαι.
lexical_decisions:
- source_word: ἕτερον
  choice: outro
  rationale: Equivalente direto e natural de ἕτερος, mantendo a referência a uma pessoa distinta sem acrescentar identificação.
- source_word: Ἀκολούθει μοι
  choice: Siga-me
  rationale: Forma idiomática e concisa em português para o imperativo presente de ἀκολουθέω com o pronome dativo; não explicita indevidamente um aspecto contínuo.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso dirigido a Jesus quanto a possível ressonância cristológica do título.
- source_word: ἐπίτρεψόν μοι
  choice: permita-me
  rationale: Expressa com clareza o pedido respeitoso de permissão e corresponde de perto ao verbo ἐπιτρέπω.
- source_word: ἀπελθόντι πρῶτον
  choice: primeiro ir
  rationale: Comunica a prioridade solicitada e o movimento de afastar-se, com uma ordem de palavras natural em português.
- source_word: θάψαι τὸν πατέρα μου
  choice: sepultar meu pai
  rationale: Tradução direta e digna; “sepultar” é corrente no contexto funerário e evita qualquer explicação cultural não presente no texto.
theological_decisions:
- issue: Sentido de κύριος ao dirigir-se a Jesus
  choice: Senhor
  alternative: Mestre; senhor como mero tratamento de cortesia
  rationale: “Senhor” conserva a tensão entre um tratamento respeitoso e o peso titular ou cristológico que a palavra pode ter na narrativa de Lucas, sem decidir antecipadamente entre esses sentidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Mas este respondeu” distingue naturalmente o outro homem de Jesus; a pontuação mantém o diálogo direto sem excesso de formalidade.
