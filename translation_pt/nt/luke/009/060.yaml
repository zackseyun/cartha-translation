id: LUK.9.60
reference: Luke 9:60
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: pt
  text: 'Mas ele lhe disse[a]: “Deixe que os mortos sepultem os seus próprios mortos; você, porém, vá e anuncie o reino de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A primeira ocorrência de “mortos” provavelmente é metafórica, referindo-se aos que não respondem espiritualmente; a segunda se refere aos mortos em sentido físico. O grego usa a mesma palavra nas duas ocorrências, e a tradução preserva esse efeito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Deixe
  rationale: O imperativo aoristo de ἀφίημι dá uma ordem incisiva para deixar essa tarefa a outros; “deixe” é natural em português e mantém a força do contexto.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: os mortos ... os seus próprios mortos
  rationale: A repetição de νεκρούς é preservada para manter o paradoxo marcante, sem explicitar no texto principal os prováveis sentidos metafórico e literal.
- source_word: θάψαι
  choice: sepultem
  rationale: Expressa diretamente a ação indicada pelo infinitivo θάψαι e, no contexto funerário, mantém um registro digno e corrente.
- source_word: ἑαυτῶν
  choice: seus próprios
  rationale: Preserva a ênfase reflexiva de ἑαυτῶν, que seria enfraquecida por apenas “seus”.
- source_word: ἀπελθὼν
  choice: vá
  rationale: Embora seja um particípio aoristo, forma com o imperativo principal uma sequência que em português se comunica naturalmente por “vá e anuncie”, sem perder a ideia de partir para cumprir a missão.
- source_word: διάγγελλε
  choice: anuncie
  rationale: O imperativo presente pede declaração pública e continuada. “Anuncie” é claro, corrente e adequado à proclamação do reino.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: Expressão bíblica estabelecida e inteligível, que preserva tanto a imagem do reino quanto a ideia do governo de Deus.
theological_decisions:
- issue: Sentido de “os mortos” nas duas ocorrências
  choice: Manter “os mortos” nas duas ocorrências, sem distinguir os sentidos no texto principal.
  alternative: “Deixe que os espiritualmente mortos sepultem os seus próprios mortos.”
  rationale: A primeira ocorrência provavelmente é metafórica, enquanto a segunda se refere aos fisicamente mortos. Como o grego emprega a mesma palavra nas duas posições, explicitar “espiritualmente” eliminaria do texto principal uma tensão deliberadamente preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sepultem” evita a possível ambiguidade coloquial de “enterrem”, enquanto “vá e anuncie” traduz o particípio seguido do imperativo de maneira natural.
