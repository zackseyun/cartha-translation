  terminology: «Reino de Deus» é a forma bíblica estabelecida e corresponde adequadamente a βασιλεία τοῦ θεοῦ. A repetição de «mortos» preserva deliberadamente a ambiguidade expressiva do original, sem introduzir uma interpretação no corpo do versículo. A nota assinala a leitura metafórica provável como nota, não como tradução.
