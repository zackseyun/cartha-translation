  source_fidelity: 'O texto traduz com fidelidade a estrutura e os elementos centrais do grego: o imperativo incisivo Ἄφες, a repetição paradoxal de «mortos», a ênfase reflexiva em «seus próprios mortos», e a oposição enfática «você, porém». «Vá e anuncie» é uma acomodação idiomática adequada do particípio ἀπελθών seguido de διάγγελλε, sem alteração material de sentido.'
