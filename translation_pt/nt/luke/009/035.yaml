  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: pt
  text: 'E veio uma voz da nuvem, dizendo: “Este é o meu Filho, o Escolhido[a]; escutem-no.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Este é o meu Filho amado” em vez de “Este é o meu Filho, o Escolhido”.
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: uma voz veio
  rationale: A construção idiomática indica o surgimento de uma voz. “Uma voz veio” preserva o caráter de acontecimento e soa natural em português narrativo.
- source_word: ἐκ τῆς νεφέλης
  choice: da nuvem
  rationale: A preposição ἐκ indica origem ou procedência; “da nuvem” comunica isso de modo claro e idiomático.
- source_word: λέγουσα
  choice: dizendo
  rationale: O particípio introduz o conteúdo da voz, e “dizendo” é seu equivalente narrativo natural.
- source_word: Οὗτός ἐστιν
  choice: Este é
  rationale: Preserva de forma direta e natural a identificação expressa pelo demonstrativo com o verbo copulativo.
- source_word: ὁ υἱός μου
  choice: o meu Filho
  rationale: Reproduz diretamente o substantivo articulado com o pronome possessivo; a inicial maiúscula assinala o uso cristológico no contexto.
- source_word: ὁ ἐκλελεγμένος
  choice: o Escolhido
  rationale: O particípio perfeito passivo de ἐκλέγομαι significa aquele que foi escolhido. “O Escolhido” preserva tanto o sentido quanto o artigo grego, sem acrescentar um segundo possessivo ausente no texto.
- source_word: αὐτοῦ ἀκούετε
  choice: escutem-no
  rationale: O imperativo presente pede atenção obediente àquele que fala. “Escutem-no” é claro, corrente e preserva a força da ordem.
theological_decisions:
- issue: Descritor cristológico variante na voz celestial
  choice: ἐκλελεγμένος traduzido como “o Escolhido”
  alternative: ἀγαπητός traduzido como “amado” ou a expressão “meu Filho amado”
  rationale: O texto da SBLGNT traz ἐκλελεγμένος. A tradução segue essa leitura, sem harmonizá-la com a formulação mais conhecida dos paralelos sinóticos, e registra a variante em nota. “O Escolhido” permanece em aposição a “meu Filho” sem acrescentar um possessivo que não está expresso no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa conserva o ritmo solene da declaração celestial e a distinção textual própria de Lucas.
