  text: But he turned and rebuked them[a].
translation:
  language: pt
  text: Mas Jesus se voltou e os repreendeu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos posteriores acrescentam: «e disse: “Vocês não sabem de que espírito são; pois o Filho do Homem não veio para destruir a vida das pessoas, mas para salvá-las.”»'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: se voltou
  rationale: O particípio aoristo descreve Jesus voltando-se para os discípulos; «se voltou» é natural em português e mantém a sequência da ação.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste moderado com a proposta feita pelos discípulos no versículo anterior.
- source_word: ἐπετίμησεν
  choice: repreendeu
  rationale: O verbo indica uma censura ou correção verbal firme; «repreendeu» comunica esse sentido com clareza e dignidade.
- source_word: αὐτοῖς
  choice: os
  rationale: O pronome dativo plural refere-se aos discípulos, particularmente Tiago e João; com «repreender», o português emprega naturalmente o objeto direto.
theological_decisions:
- issue: Expansão textual encontrada em manuscritos posteriores
  choice: 'Traduzir no texto principal apenas a leitura curta do SBLGNT: «Mas Jesus se voltou e os repreendeu.»'
  alternative: '«Mas Jesus se voltou, os repreendeu e disse: “Vocês não sabem de que espírito são; pois o Filho do Homem não veio para destruir a vida das pessoas, mas para salvá-las.”»'
  rationale: A fonte grega fornecida contém somente a leitura curta. A expansão posterior, embora conhecida na tradição manuscrita e na história das traduções, não deve ser incorporada ao texto principal, mas é relevante o bastante para constar em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O nome «Jesus», implícito no pronome grego pelo contexto, foi explicitado para produzir uma frase natural e inequívoca em português.
