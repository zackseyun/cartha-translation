id: LUK.9.25
reference: Luke 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: pt
  text: Pois que proveito tem alguém se ganhar o mundo inteiro, mas perder a si mesmo ou sofrer a perda de si mesmo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perder a própria vida” ou “perder a própria alma”. O grego diz literalmente “a si mesmo”, usando um pronome reflexivo, não o termo habitual para “vida” ou “alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Pois que proveito alguém tem
  rationale: Expressa naturalmente a pergunta retórica e conserva a função explicativa de γάρ, que fundamenta a declaração anterior.
- source_word: ἄνθρωπος
  choice: alguém
  rationale: Neste contexto, o substantivo é genérico e se refere a qualquer pessoa; “alguém” comunica essa abrangência com naturalidade em português.
- source_word: κερδήσας
  choice: se ganhar
  rationale: O particípio aoristo apresenta uma circunstância hipotética, bem expressa em português por uma oração condicional.
- source_word: τὸν κόσμον ὅλον
  choice: o mundo inteiro
  rationale: Equivalente claro e corrente para a totalidade das vantagens ou posses do mundo.
- source_word: ἑαυτὸν
  choice: a si mesmo
  rationale: Preserva o pronome reflexivo grego sem restringi-lo a “alma” ou “vida”.
- source_word: ἀπολέσας
  choice: perder
  rationale: Mantém o contraste direto entre ganhar o mundo e perder a própria pessoa.
- source_word: ἢ ζημιωθείς
  choice: ou sofrer dano
  rationale: 'Conserva a disjunção e o valor passivo do particípio: a pessoa sofre perda ou prejuízo em relação a si mesma.'
theological_decisions:
- issue: Sentido de ἑαυτόν quanto ao destino humano
  choice: a si mesmo
  alternative: a própria alma; a própria vida
  rationale: O texto traz o pronome reflexivo, não ψυχή. A tradução mantém a referência à pessoa inteira e evita impor uma leitura restrita à alma imaterial ou somente à vida física.
- issue: Relação entre ἀπολέσας e ζημιωθείς
  choice: perder... ou sofrer dano
  alternative: perder ou arruinar; perder ou sofrer perda
  rationale: A formulação preserva os dois termos coordenados e sua tensão sem fundi-los em uma única consequência teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação argumentativa com o versículo anterior; “alguém” evita que o uso genérico de ἄνθρωπος seja entendido como limitado ao sexo masculino.
