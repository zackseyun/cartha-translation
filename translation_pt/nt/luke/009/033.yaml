source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: pt
  text: 'Quando eles estavam se afastando dele, Pedro disse a Jesus: “Mestre, é bom estarmos aqui. Façamos três abrigos[a]: um para o senhor, um para Moisés e um para Elias” — sem saber o que dizia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cabanas”, “tendas” ou, tradicionalmente, “tabernáculos”. O termo grego se refere a abrigos temporários e talvez evoque imagens bíblicas ligadas a festas.
    reason: Alternativas lexicais e possível ressonância bíblica de σκηνάς.
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Quando eles estavam se afastando dele
  rationale: A construção narrativa ἐγένετο ἐν τῷ com infinitivo marca uma ação simultânea. A formulação natural em português conserva tanto a relação temporal quanto a separação de Moisés e Elias em relação a Jesus.
- source_word: Ἐπιστάτα
  choice: Mestre
  rationale: Em Lucas, ἐπιστάτης é uma forma respeitosa de se dirigir a Jesus, reconhecendo sua autoridade. “Mestre” é corrente e digno, sem reduzi-lo necessariamente ao sentido estrito de “professor”.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: é bom estarmos aqui
  rationale: Preserva a avaliação direta expressa por καλόν e reproduz naturalmente em português a construção com infinitivo.
- source_word: ποιήσωμεν
  choice: Façamos
  rationale: O subjuntivo hortativo de primeira pessoa expressa uma proposta. “Façamos” mantém essa força sem acrescentar a ideia mais específica de construir.
- source_word: σκηνὰς
  choice: abrigos
  rationale: σκηνή pode designar abrigo temporário, cabana ou tenda. “Abrigos” é claro no português moderno e evita impor no texto principal uma associação ritual específica.
- source_word: μίαν σοὶ
  choice: um para o senhor
  rationale: O pronome singular σοὶ refere-se diretamente a Jesus. “O senhor” preserva o tratamento respeitoso e soa natural no diálogo em português.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Ele não sabia o que estava dizendo
  rationale: A oração explicativa descreve a falta de compreensão de Pedro enquanto falava. O imperfeito perifrástico traduz naturalmente o aspecto presente de λέγει no contexto passado.
theological_decisions:
- issue: Possível associação de σκηνάς com a Festa das Cabanas ou com imagens do tabernáculo
  choice: abrigos no texto principal, com alternativas em nota
  alternative: cabanas, tendas ou, tradicionalmente, tabernáculos
  rationale: O versículo não identifica explicitamente as estruturas com uma festa ou instituição cultual. A tradução principal permanece semanticamente aberta, enquanto a nota conserva as possíveis ressonâncias bíblicas.
- issue: Referente de αὐτούς em “eles estavam se afastando dele”
  choice: manter o pronome no texto
  alternative: explicitar “Moisés e Elias”
  rationale: O grego usa pronomes cujos referentes são fornecidos pelo contexto imediato. Mantê-los evita inserir explicitação desnecessária e preserva a coesão narrativa do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa foi naturalizada sem perder a simultaneidade das ações. O tratamento “o senhor” distingue a referência respeitosa a Jesus do título vocativo “Mestre”. O marcador [a] aparece imediatamente após o termo anotado.
