id: LUK.9.43
reference: Luke 9:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: pt
  text: 'E todos ficavam tomados de espanto com a majestade[a] de Deus. Mas, enquanto todos se maravilhavam com tudo o que Jesus fazia, ele disse aos seus discípulos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandeza”. O termo grego pode indicar grandeza, grandiosidade ou majestade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ficavam assombrados
  rationale: O imperfeito retrata uma reação contínua de forte espanto; a expressão é natural em português e mantém intensidade distinta de θαυμαζόντων.
- source_word: πάντες
  choice: todos
  rationale: Preserva a abrangência universal da reação.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: com a majestade de Deus
  rationale: A preposição com dativo indica o objeto ou motivo do espanto. “Majestade” comunica a grandeza ou grandiosidade divina em registro digno e natural.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Mas, enquanto todos se maravilhavam
  rationale: O genitivo absoluto é vertido como oração temporal circunstancial; “se maravilhavam” distingue esta reação do assombro mais forte expresso por ἐξεπλήσσοντο.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: com tudo o que Jesus fazia
  rationale: Mantém o valor durativo do imperfeito e explicita o sujeito contextual para evitar que, em português, o antecedente imediato “Deus” torne a referência indevidamente confusa.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ele disse aos seus discípulos
  rationale: Formulação narrativa corrente; “ele” retoma Jesus, já explicitado na oração anterior.
theological_decisions:
- issue: Referente do sujeito implícito em οἷς ἐποίει e εἶπεν
  choice: Jesus é explicitado como aquele que fazia essas coisas e retomado por “ele”
  alternative: Manter apenas o pronome ou o sujeito oculto, permitindo possível associação gramatical com “Deus”
  rationale: O contexto narrativo identifica Jesus como agente e locutor. A formulação continua atribuindo a majestade a Deus, sem equiparar ou separar indevidamente Deus e Jesus, e preserva a tensão teológica do relato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O imperfeito foi mantido nas duas reações e na ação em andamento. O marcador da nota aparece imediatamente após o termo a que se refere.
