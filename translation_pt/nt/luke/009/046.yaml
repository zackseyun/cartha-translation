  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: pt
  text: Então surgiu entre eles uma disputa sobre qual deles seria o maior[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surgiu entre eles um raciocínio” ou “surgiu entre eles uma discussão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: surgiu
  rationale: Embora signifique literalmente “entrou”, com διαλογισμός a expressão indica que algo começou ou surgiu no grupo; “surgiu” é natural em português e preserva o caráter eventivo.
- source_word: δὲ
  choice: Então
  rationale: Conectivo leve de progressão narrativa; “Então” liga naturalmente este episódio ao contexto anterior.
- source_word: διαλογισμὸς
  choice: disputa
  rationale: O termo pode indicar raciocínio, debate ou discussão. A pergunta competitiva sobre quem seria o maior favorece “disputa”, sem eliminar em nota a possibilidade de reflexão ou discussão.
- source_word: ἐν αὐτοῖς
  choice: entre eles
  rationale: Embora literalmente possa ser “neles”, o referente plural permite a formulação idiomática “entre eles”, indicando algo ocorrido dentro do grupo.
- source_word: τὸ τίς ἂν εἴη
  choice: sobre qual deles seria
  rationale: A construção introduz o conteúdo da disputa. “Seria” conserva de modo natural em português a nuance potencial do optativo com ἄν no discurso indireto.
- source_word: μείζων
  choice: o maior
  rationale: O comparativo grego, literalmente “maior”, tem sentido superlativo dentro do grupo; “o maior” é a forma idiomática em português.
- source_word: αὐτῶν
  choice: deles
  rationale: O genitivo delimita o grupo dentro do qual se faz a comparação.
theological_decisions:
- issue: Natureza da interação entre os discípulos
  choice: disputa
  alternative: raciocínio ou discussão
  rationale: O contexto sugere competição acerca de posição e grandeza, mas o substantivo grego também pode descrever reflexão ou debate; a nota mantém aberta essa ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A formulação principal transmite a provável dimensão interpessoal, enquanto a nota preserva a amplitude de διαλογισμός.
