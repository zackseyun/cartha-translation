- from: Então, tomou os cinco pães e os dois peixes, ergueu os olhos para o céu, abençoou-os[a], partiu-os e continuou entregando-os aos discípulos, para que os colocassem diante da multidão.
  to: Então, tomou os cinco pães e os dois peixes, ergueu os olhos para o céu, abençoou-os[a], partiu-os e os dava aos discípulos para que os pusessem diante da multidão.
  rationale: A revisão limita-se a substituir «continuou entregando-os» por «os dava», forma natural em português que reproduz o valor imperfeito de ἐδίδου como distribuição repetida ou em curso, sem acrescentar uma continuidade temporal não explicitada. O restante do texto e a nota são mantidos.
