  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: pt
  text: Então, tomou os cinco pães e os dois peixes, ergueu os olhos para o céu, abençoou-os[a], partiu-os e os dava aos discípulos para que os pusessem diante da multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deu graças por eles”. O verbo grego aqui é “abençoou”, enquanto alguns relatos paralelos usam “deu graças”.'
    reason: Alternativa lexical e esclarecimento da diferença em relação aos relatos paralelos.
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Então, tomou
  rationale: O particípio aoristo introduz uma ação anterior e ligada às ações principais, enquanto δὲ faz a narrativa avançar. A forma verbal finita com “Então” preserva a sequência em português natural.
- source_word: τοὺς πέντε ἄρτους
  choice: os cinco pães
  rationale: Neste contexto, ἄρτος designa unidades de pão. Em português, “cinco pães” é a forma idiomática e concreta.
- source_word: τοὺς δύο ἰχθύας
  choice: os dois peixes
  rationale: Tradução direta e corrente do plural ἰχθύας.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ergueu os olhos para o céu
  rationale: Expressa naturalmente em português o olhar dirigido para cima e preserva o sentido reverente de οὐρανός neste contexto de bênção.
- source_word: εὐλόγησεν αὐτοὺς
  choice: abençoou-os
  rationale: Mantém o verbo grego εὐλογέω e o objeto masculino plural αὐτούς, que retoma os pães e os peixes, sem harmonizar a formulação com relatos paralelos.
- source_word: κατέκλασεν
  choice: partiu-os
  rationale: O verbo indica partir o alimento para distribuí-lo. O pronome explicita em português o objeto recuperado do contexto.
- source_word: ἐδίδου
  choice: continuou entregando-os
  rationale: O imperfeito apresenta uma ação em curso ou repetida. “Continuou entregando-os” comunica essa distribuição contínua em português moderno.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Reproduz o artigo grego sem acrescentar um possessivo que não está expresso.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: para que os colocassem diante da multidão
  rationale: Preserva tanto a finalidade do infinitivo quanto o sentido concreto de pôr o alimento diante das pessoas, evitando substituir a expressão por uma interpretação mais ampla como “distribuir”.
theological_decisions:
- issue: Sentido de οὐρανός no contexto de oração e bênção
  choice: céu
  alternative: firmamento
  rationale: O gesto de erguer os olhos acompanha a bênção dirigida a Deus; “céu” preserva essa dimensão contextual sem acrescentar explicação doutrinária.
- issue: Tradução de εὐλόγησεν
  choice: abençoou-os
  alternative: deu graças por eles
  rationale: O texto usa εὐλογέω, “abençoar”, e não εὐχαριστέω, “dar graças”. A opção mantém a formulação própria de Lucas e deixa a alternativa interpretativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção evita arcaísmos, conserva a progressão narrativa e mantém a repetição pronominal necessária para deixar claro que os alimentos são abençoados, partidos e entregues.
