source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: pt
  text: Pois quem se envergonhar de mim e das minhas palavras, dessa pessoa[a] o Filho do Homem se envergonhará quando vier na sua glória e na glória do Pai e dos santos anjos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «desse».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «quando vier na sua glória, e na glória do Pai e dos santos anjos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Pois quem
  rationale: Expressa o valor explicativo de γάρ e o sentido geral e indefinido de ὃς ... ἄν de modo natural em português.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: se envergonhar ... se envergonhará
  rationale: Mantém a reciprocidade deliberada do mesmo verbo grego sem intensificá-lo para «rejeitar» ou «renegar».
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: de mim e das minhas palavras
  rationale: Conserva os dois objetos do verbo e traduz λόγους diretamente como «palavras».
- source_word: τοῦτον
  choice: desse
  rationale: Retoma enfaticamente o referente indefinido anterior e preserva a forma demonstrativa singular do grego; a nota registra uma alternativa mais explícita.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Preserva o título tradicional e suas ressonâncias intertextuais.
- source_word: ὅταν ἔλθῃ
  choice: quando vier
  rationale: Representa naturalmente o valor temporal futuro de ὅταν com o subjuntivo aoristo.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: na sua glória e na glória do Pai e dos santos anjos
  rationale: Supre «na glória» para tornar clara em português a coordenação elíptica dos genitivos, sem decidir indevidamente se a construção destaca uma manifestação conjunta ou esferas coordenadas de glória.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: dos santos anjos
  rationale: Tradução direta e digna do sintagma adjetival.
theological_decisions:
- issue: Referência singular e genérica em τοῦτον
  choice: desse
  alternative: dessa pessoa
  rationale: «Desse» conserva o demonstrativo singular masculino do texto e sua retomada enfática, sem limitar a aplicação da advertência aos homens; a alternativa explicita o sentido genérico.
- issue: A glória na vinda do Filho do Homem
  choice: na sua glória e na glória do Pai e dos santos anjos
  alternative: na sua glória, e na do Pai e dos santos anjos
  rationale: A formulação mantém a associação da glória com o Filho do Homem, o Pai e os santos anjos, sem explicar além do que o texto afirma nem apagar sua tensão cristológica e escatológica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de «se envergonhar» foi preservada por seu efeito retórico e semântico. Todos os marcadores de nota aparecem no texto principal.
