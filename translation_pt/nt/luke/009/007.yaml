id: LUK.9.7
reference: Luke 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: pt
  text: Herodes, o tetrarca, ouviu falar de tudo o que estava acontecendo e ficou perplexo, porque alguns diziam que João havia sido ressuscitado dentre os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «havia ressuscitado dentre os mortos». O verbo grego está na voz passiva, literalmente «havia sido levantado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: ouviu falar de
  rationale: Com o objeto «tudo o que estava acontecendo», «ouviu falar de» expressa naturalmente em português o recebimento de notícias sobre os acontecimentos.
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: Aqui δέ é um conectivo narrativo leve; a continuidade do relato fica natural em português sem acrescentar «agora», «então» ou um contraste que o contexto não exige.
- source_word: ὁ τετραάρχης
  choice: o tetrarca
  rationale: Preserva o título político histórico específico de Herodes, sem reduzi-lo a «rei» ou a um termo genérico como «governante».
- source_word: τὰ γινόμενα πάντα
  choice: tudo o que estava acontecendo
  rationale: Formulação corrente que conserva o aspecto contínuo dos acontecimentos em curso.
- source_word: διηπόρει
  choice: ficou perplexo
  rationale: Comunica o estado de grande dúvida e confusão indicado por διαπορέω, em linguagem atual e digna.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: porque alguns diziam
  rationale: A construção causal é vertida de modo idiomático; a voz passiva grega é naturalmente convertida em uma oração ativa indefinida em português, sem alterar quem divulgava o relato.
- source_word: ἠγέρθη
  choice: havia sido ressuscitado
  rationale: Mantém a anterioridade em relação à perplexidade de Herodes e preserva a forma passiva do grego no contexto de ressurreição.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressão portuguesa natural no vocabulário de ressurreição, preservando a ideia de sair do meio dos mortos.
theological_decisions:
- issue: Formulação da ressurreição no relato sobre João
  choice: havia sido ressuscitado dentre os mortos
  alternative: havia ressuscitado dentre os mortos
  rationale: O grego emprega a forma passiva ἠγέρθη. A tradução principal conserva essa voz sem determinar explicitamente o agente; a alternativa ativa é possível em português, mas não reproduz tão diretamente a forma da fonte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O título histórico «tetrarca» é mantido; a sintaxe é clara e narrativa, sem introduzir um marcador discursivo ausente como «agora».
