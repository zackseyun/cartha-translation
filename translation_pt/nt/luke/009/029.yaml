base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: pt
  text: Enquanto ele orava, a aparência do seu rosto ficou diferente, e sua roupa se tornou branca, relampejando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sua roupa ficou branca e deslumbrante”; o particípio grego evoca o lampejo de um relâmpago.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Enquanto ele orava
  rationale: A construção lucana introduz um acontecimento ocorrido durante a oração. “Enquanto ele orava” transmite naturalmente o valor temporal sem reproduzir de modo rígido o semitismo narrativo “aconteceu que”.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον
  choice: a aparência do seu rosto ficou diferente
  rationale: εἶδος indica a aparência visível, e ἕτερον significa “diferente” ou “outro”. A formulação preserva a linguagem comedida de Lucas sem importar dos paralelos a ideia explícita de que o rosto brilhou.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: sua roupa
  rationale: ἱματισμός designa a roupa ou vestimenta. O singular coletivo “roupa” é claro e natural em português contemporâneo.
- source_word: λευκὸς
  choice: branca
  rationale: λευκός significa diretamente “branco”; o brilho extraordinário é expresso pelo particípio seguinte, sem necessidade de ampliar o adjetivo.
- source_word: ἐξαστράπτων
  choice: relampejando
  rationale: O particípio evoca o clarão ou lampejo de um relâmpago. “Relampejando” conserva essa imagem vívida e a forma participial, embora “deslumbrante” também seja possível.
theological_decisions:
- issue: Descrição da transfiguração de Jesus
  choice: Descrever uma mudança visível na aparência do rosto sem dizer que ele brilhou
  alternative: “a aparência do seu rosto foi transformada” ou “seu rosto brilhou”
  rationale: Lucas afirma que a aparência ficou “diferente”, numa formulação mais contida que a dos paralelos sinóticos. A tradução preserva a realidade da mudança sem harmonizar o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ficou diferente” mantém a simplicidade e a ambiguidade do grego; “relampejando” preserva sua imagem marcante sem acrescentar uma comparação ausente da forma lexical.
