id: LUK.9.20
reference: Luke 9:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: pt
  text: 'Ele lhes perguntou: “Mas vocês, quem dizem que eu sou?” Pedro respondeu: “O Messias de Deus[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo de Deus”.'
    reason: Alternativa lexical tradicional para χριστός.
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ele lhes perguntou
  rationale: Embora εἶπεν signifique literalmente “disse”, o conteúdo é uma pergunta; “perguntou” expressa naturalmente a função da fala em português. O pronome “lhes” preserva αὐτοῖς.
- source_word: Ὑμεῖς δὲ
  choice: Mas vocês
  rationale: O pronome grego explícito e enfático contrasta os discípulos com outras pessoas. “Mas vocês” reproduz esse contraste com naturalidade e deixa claro o plural.
- source_word: τίνα με λέγετε εἶναι
  choice: quem dizem que eu sou
  rationale: Reproduz em português corrente a construção grega de discurso indireto com λέγετε e o infinitivo εἶναι.
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: O particípio seguido do verbo finito forma uma expressão que o português comunica de modo claro e não redundante com um único verbo.
- source_word: Τὸν χριστὸν
  choice: O Messias
  rationale: Χριστός funciona aqui como título, e não como nome próprio. “Messias” comunica o sentido do título dentro da expectativa de Israel.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém diretamente a relação genitiva da expressão grega sem explicar além do que o texto afirma.
theological_decisions:
- issue: Tradução de χριστός na confissão de Pedro
  choice: Messias
  alternative: Cristo
  rationale: A palavra é usada como título identificador e significa o ungido esperado. “Messias” traduz essa função; “Cristo”, forma tradicional derivada do grego, é preservada como alternativa em nota, sem resolver além do texto a natureza exata da relação expressa por “de Deus”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vocês” marca de forma natural o plural e o contraste expresso por Ὑμεῖς; “lhes” conserva concisão e amplitude internacional. A nota foi colocada junto de “Messias de Deus”, termo ao qual efetivamente se refere.
