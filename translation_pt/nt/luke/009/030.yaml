  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: pt
  text: 'E eis que dois homens conversavam com ele: eram Moisés e Elias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador discursivo de atenção súbita e vividez narrativa de Lucas em uma forma digna e amplamente compreensível em português.
- source_word: ἄνδρες δύο
  choice: dois homens
  rationale: ἀνήρ designa aqui homens identificáveis, Moisés e Elias; “dois homens” é a correspondência natural e precisa.
- source_word: συνελάλουν
  choice: conversavam
  rationale: O imperfeito indica ação em andamento, e o verbo composto expressa diálogo; “conversavam” comunica ambos os aspectos de modo natural.
- source_word: αὐτῷ
  choice: com ele
  rationale: Com συλλαλέω, o dativo indica a pessoa com quem se conversa, não apenas o destinatário de uma fala.
- source_word: οἵτινες ἦσαν
  choice: eram
  rationale: A oração identifica diretamente os dois homens. A construção com dois-pontos evita uma relativa pesada e conserva sem expansão o sentido identificador.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa tradicional e corrente do nome.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma portuguesa tradicional e corrente do nome do profeta.
theological_decisions:
- issue: Identificação das duas figuras na transfiguração
  choice: O texto identifica diretamente os dois homens como Moisés e Elias.
  alternative: Acrescentar uma explicação sobre o simbolismo ou a função escatológica das figuras.
  rationale: O grego não explica aqui o significado da presença deles. A tradução mantém a identificação simples, sem introduzir interpretação teológica externa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “E eis que” conserva a vividez narrativa sem tornar a frase excessivamente arcaica; os dois-pontos tornam natural a identificação final.
