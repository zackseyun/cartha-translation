id: LUK.12.32
reference: Luke 12:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: pt
  text: Não tenha medo[a], pequeno rebanho[b], pois o Pai de vocês teve prazer em dar a vocês o Reino[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tema”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rebanho pequeno”.'
    reason: lexical_alternative
  - marker: c
    text: “O Reino” também pode ser entendido como “o reinado”, destacando o governo real de Deus, bem como o reino dado ao seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: O imperativo presente singular com μή expressa uma proibição dirigida ao rebanho como unidade. “Não tenha medo” é direto, natural e preserva o sentido sem aumentar a formalidade.
- source_word: τὸ μικρὸν ποίμνιον
  choice: pequeno rebanho
  rationale: Mantém tanto a ideia de reduzido tamanho em μικρόν quanto a metáfora pastoral de ποίμνιον. Evita “rebanhozinho”, que poderia acentuar um tom afetivo além do que a forma grega exige.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão para não ter medo, reproduzindo o valor causal de ὅτι neste contexto.
- source_word: εὐδόκησεν
  choice: se agradou
  rationale: Expressa a disposição favorável e o beneplácito do Pai, sem transformar o aoristo em uma formulação técnica sobre decreto nem intensificar o componente emotivo.
- source_word: ὁ πατὴρ ὑμῶν
  choice: o Pai de vocês
  rationale: Traduz exatamente a referência ao Pai e o possessivo plural, sem acrescentar “celestial”, ausente do texto grego.
- source_word: δοῦναι ὑμῖν
  choice: em dar-lhes
  rationale: Reproduz o infinitivo e o objeto indireto plural de maneira concisa e natural em português.
- source_word: τὴν βασιλείαν
  choice: o Reino
  rationale: “Reino” é a expressão bíblica corrente e conserva a amplitude semântica de βασιλεία, que pode abranger tanto o governo real quanto o domínio concedido ao povo.
theological_decisions:
- issue: Amplitude semântica de βασιλεία
  choice: o Reino
  alternative: o reinado
  rationale: “Reino” preserva a formulação bíblica conhecida e não restringe o termo apenas ao exercício abstrato do governo nem somente a um território; a nota registra a outra ênfase possível.
- issue: Sentido de εὐδόκησεν em relação à vontade divina
  choice: se agradou
  alternative: decidiu bondosamente
  rationale: A tradução comunica o beneplácito e a iniciativa favorável do Pai sem introduzir uma formulação doutrinária mais técnica do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento “vocês” torna explícito o plural de ὑμῶν e ὑμῖν; o imperativo permanece no singular porque se dirige ao “rebanho” como unidade. A inicial maiúscula em “Reino” sinaliza o uso teológico contextual sem acrescentar “de Deus”, expressão ausente do versículo.
