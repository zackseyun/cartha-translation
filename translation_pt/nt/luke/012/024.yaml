id: LUK.12.24
reference: Luke 12:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: pt
  text: 'Observem atentamente os corvos: eles não semeiam nem colhem; não têm despensa nem celeiro, e Deus os alimenta. Quanto mais vocês valem do que as aves!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσατε
  choice: Observem atentamente
  rationale: O imperativo aoristo pede observação reflexiva e cuidadosa, não apenas um olhar passageiro. A expressão é clara e natural em português.
- source_word: τοὺς κόρακας
  choice: os corvos
  rationale: κόραξ designa especificamente o corvo, preservando a imagem concreta do texto grego.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: não semeiam nem colhem
  rationale: Reproduz com concisão o paralelismo dos dois verbos agrícolas.
- source_word: ταμεῖον
  choice: despensa
  rationale: Designa um compartimento interno usado para guardar provisões e mantém distinção em relação a ἀποθήκη.
- source_word: ἀποθήκη
  choice: celeiro
  rationale: Indica um lugar de armazenamento de produtos agrícolas; junto de 'despensa', preserva os dois termos distintos do grego.
- source_word: τρέφει
  choice: alimenta
  rationale: Expressa de modo direto e idiomático a provisão contínua de Deus para as aves.
- source_word: πόσῳ μᾶλλον
  choice: Quanto mais
  rationale: É a forma portuguesa natural para o argumento comparativo do menor para o maior.
- source_word: διαφέρετε
  choice: vocês valem
  rationale: Neste contexto, o verbo indica superioridade de valor ou importância, não mera diferença.
- source_word: τῶν πετεινῶν
  choice: do que as aves
  rationale: πετεινόν é um termo geral para aves; a comparação passa dos corvos especificamente às aves em geral.
theological_decisions:
- issue: Providência divina no argumento comparativo
  choice: e Deus os alimenta
  alternative: e Deus os sustenta
  rationale: A tradução mantém a ação explícita de Deus no cuidado das criaturas, fundamento do argumento de Jesus, sem ampliar a afirmação para além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no Brasil e internacionalmente. 'Observem atentamente' conserva o chamado à reflexão; 'despensa' e 'celeiro' distinguem os dois locais de armazenamento. O ponto de exclamação comunica a força retórica da frase final.
