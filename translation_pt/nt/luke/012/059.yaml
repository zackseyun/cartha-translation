source:
  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: pt
  text: 'Eu lhe digo: você certamente não sairá dali enquanto não pagar até a última pequena moeda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego lépton designa uma moeda de valor muito baixo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Eu lhe digo
  rationale: Fórmula direta de fala, natural em português e fiel ao presente do indicativo e ao pronome no singular.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: você certamente não sairá
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa forte negação futura; «certamente não sairá» conserva essa ênfase sem soar arcaico.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: Expressa de modo conciso e idiomático o sentido de «de lá» ou «daquele lugar».
- source_word: ἕως
  choice: enquanto não
  rationale: Em português, após uma oração negativa, «enquanto não» comunica naturalmente o limite temporal expresso por ἕως.
- source_word: καὶ τὸ ἔσχατον
  choice: até a última
  rationale: O καί intensifica a totalidade do pagamento; em português, «até a última» transmite naturalmente a ideia de não faltar nem mesmo a parcela mínima.
- source_word: λεπτόν
  choice: pequena moeda
  rationale: O λεπτόν era uma moeda de valor muito baixo. A tradução comunica imediatamente o sentido ao leitor comum, enquanto a nota preserva o nome histórico.
- source_word: ἀποδῷς
  choice: pagar
  rationale: No contexto de dívida e detenção, «pagar» é o equivalente natural; a construção com «enquanto não» apresenta o pagamento completo como condição para sair.
theological_decisions:
- issue: Natureza da imagem de dívida e prisão
  choice: Manter a imagem de confinamento até o pagamento integral sem identificar explicitamente seu referente
  alternative: Explicitar uma advertência jurídica terrena, o juízo divino ou uma interpretação purgatorial posterior
  rationale: O versículo não define se a imagem se refere a consequências jurídicas terrenas, ao juízo divino ou a outra realidade. A formulação literal preserva essa tensão e evita introduzir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento «você» torna explícito o singular de σοι e ἐξέλθῃς. «Pequena moeda» prioriza compreensão imediata; a nota registra o termo histórico.
