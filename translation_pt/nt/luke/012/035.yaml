  text: Estejam com a cintura cingida e as lâmpadas acesas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estejam prontos para agir”. A imagem é a de recolher as vestes compridas e prendê-las à cintura para se preparar para a ação.'
