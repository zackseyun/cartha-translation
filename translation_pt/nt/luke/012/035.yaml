lexical_decisions:
- source_word: Ἔστωσαν
  choice: Que ... esteja ... e ... [estejam]
  rationale: O imperativo presente de terceira pessoa de εἰμί é expresso naturalmente em português pela construção exortativa com «que»; a concordância é ajustada aos dois sujeitos coordenados.
- source_word: ὑμῶν
  choice: de vocês
  rationale: O genitivo tem função possessiva e se aplica às duas expressões coordenadas. «De vocês» é claro e amplamente compreensível no português moderno.
- source_word: ὀσφύες
  choice: cintura
  rationale: O plural grego designa a região dos lombos ou da cintura. O singular coletivo «cintura» é a forma idiomática em português e preserva a imagem corporal sem o tom arcaico ou anatômico de «lombos».
- source_word: περιεζωσμέναι
  choice: cingida
  rationale: O particípio perfeito passivo indica a roupa já presa ao redor da cintura, em estado de prontidão. «Cingida» conserva a metáfora concreta; o sentido cultural é explicado em nota.
- source_word: λύχνοι
  choice: lâmpadas
  rationale: O termo se refere concretamente a pequenas lâmpadas, normalmente alimentadas com óleo, e não à luz em abstrato.
- source_word: καιόμενοι
  choice: acesas
  rationale: No contexto de lâmpadas, «acesas» é natural e comunica o estado contínuo indicado pelo particípio presente. «Ardendo» seria mais literal, mas menos idiomático em português atual.
theological_decisions:
- issue: Imagem idiomática de prontidão
  choice: Manter no texto a imagem concreta da cintura cingida
  alternative: Estejam vestidos e prontos para agir
  rationale: O grego apresenta uma imagem cultural específica, não uma explicação abstrata. Preservá-la mantém a força e a textura da exortação, enquanto a nota esclarece sua implicação prática sem impor uma leitura teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «Que ... esteja» preserva o caráter exortativo; «cingida» mantém a imagem antiga, esclarecida pela nota. A elipse do segundo verbo evita repetição pesada, e «acesas» soa mais natural do que «ardendo» para lâmpadas.
