  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: pt
  text: 'Enquanto isso, quando muitos milhares de pessoas da multidão[a] se haviam reunido, a ponto de pisarem umas nas outras, ele começou a falar primeiro aos seus discípulos: “Tenham cuidado com o fermento dos fariseus[b], que é a hipocrisia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as miríades da multidão”. O grego μυριάδες pode indicar “dezenas de milhares” ou, mais geralmente, uma multidão muito grande.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Fiquem atentos ao fermento dos fariseus” ou “Protejam-se do fermento dos fariseus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Enquanto isso
  rationale: Expressa de modo natural o valor temporal e circunstancial da locução, ligando a cena ao contexto anterior.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: milhares de pessoas se aglomeraram
  rationale: μυριάδες pode indicar dezenas de milhares ou, de forma geral, uma multidão enorme. “Milhares” preserva a magnitude sem impor um número exato, e “se aglomeraram” comunica a concentração física sugerida pelo contexto.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: a ponto de pisarem umas nas outras
  rationale: Reproduz o resultado expresso por ὥστε com infinitivo e mantém o caráter caótico da cena.
- source_word: ἤρξατο λέγειν
  choice: começou a falar
  rationale: Forma corrente em português para a construção incoativa grega.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: primeiro aos seus discípulos
  rationale: Preserva a posição e a provável função de πρῶτον, indicando prioridade dos discípulos como destinatários sem acrescentar uma sequência não declarada.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Tenham cuidado com
  rationale: Formulação portuguesa natural que comunica tanto a atenção reflexiva quanto a ideia de proteção contra algo; evita o artificial “tenham cuidado para vocês mesmos”.
- source_word: τῆς ζύμης
  choice: o fermento
  rationale: “Fermento” é o equivalente corrente em português e conserva a metáfora bíblica sem substituí-la por uma interpretação como “influência” ou “ensino”.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: que é a hipocrisia
  rationale: Mantém a identificação explicativa direta feita pelo próprio texto.
- source_word: τῶν Φαρισαίων
  choice: dos fariseus
  rationale: Reproduz naturalmente o genitivo descritivo ou possessivo.
theological_decisions:
- issue: Força metafórica de ζύμη
  choice: Manter “fermento” e sua identificação textual com a hipocrisia.
  alternative: Substituir a metáfora por “influência”, “ensino” ou “corrupção”.
  rationale: O próprio versículo explica a imagem; preservá-la mantém a linguagem e a tensão literária sem restringir seu sentido por paráfrase doutrinária.
- issue: Alcance de πρῶτον
  choice: 'Entender como prioridade dos discípulos enquanto destinatários: “primeiro aos seus discípulos”.'
  alternative: 'Entender como marcador discursivo: “antes de tudo, disse aos seus discípulos”.'
  rationale: A posição grega admite alguma ambiguidade, mas a formulação escolhida conserva de perto a ordem e a provável ênfase narrativa sem afirmar uma sequência posterior específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pessoas” explicita de modo natural o coletivo ὄχλος; “se aglomeraram” dá fluidez narrativa. O marcador [a] aparece imediatamente após a expressão a que se refere.
