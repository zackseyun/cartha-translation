id: LUK.12.41
reference: Luke 12:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: pt
  text: 'Então Pedro disse: “Senhor, é para nós que o senhor conta esta parábola, ou também para todos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: disse
  rationale: O aoristo de λέγω é vertido diretamente por “disse”; a pontuação e o conteúdo deixam claro que Pedro faz uma pergunta.
- source_word: δὲ
  choice: Então
  rationale: Neste ponto, δέ dá continuidade à narrativa; “Então” funciona como transição natural sem introduzir contraste indevido.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” preserva o tratamento respeitoso dirigido a Jesus e a possível ressonância cristológica de κύριος.
- source_word: πρὸς ἡμᾶς
  choice: para nós
  rationale: Com λέγεις, πρός indica os destinatários da fala; “para nós” é idiomático em português neste contexto.
- source_word: τὴν παραβολὴν ταύτην
  choice: esta parábola
  rationale: “Parábola” é o equivalente consagrado e adequado ao ensino figurado de Jesus, mantendo a continuidade literária dos Sinóticos.
- source_word: λέγεις
  choice: conta
  rationale: No contexto de uma parábola, “conta” expressa naturalmente o ato presente de narrá-la, sem alterar o sentido básico de λέγω.
- source_word: ἢ καὶ
  choice: ou também
  rationale: A formulação preserva tanto a alternativa marcada por ἤ quanto o valor aditivo de καί.
- source_word: πρὸς πάντας
  choice: para todos
  rationale: πάντας tem referência genérica ao público mais amplo; “todos” comunica essa abrangência de modo natural em português.
theological_decisions:
- issue: Sentido de κύριος no tratamento de Pedro a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” mantém o sentido respeitoso e a possível dimensão cristológica do termo sem forçar uma interpretação além do texto.
- issue: Referência genérica de πάντας
  choice: todos
  alternative: todas as pessoas
  rationale: O masculino plural grego é genérico no contexto e contrasta “nós” com o público mais amplo; “todos” conserva essa amplitude em português.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção enfática “é para nós que...” reproduz com naturalidade o contraste entre πρὸς ἡμᾶς e πρὸς πάντας. A repetição de “Senhor” e “o senhor” evita alternância entre formas de tratamento e mantém clareza no português brasileiro.
