  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: pt
  text: E vocês, não busquem o que comer e o que beber, nem vivam inquietos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não vivam preocupados», «não vivam ansiosos» ou, mais literalmente, «não vivam em suspense».
    reason: alternativa lexical
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito tem valor enfático e contrastivo. A construção inicial «E vocês» preserva essa ênfase de modo natural em português.
- source_word: ζητεῖτε
  choice: fiquem buscando
  rationale: ζητέω significa «buscar» ou «procurar». A perífrase com «ficar» comunica a ideia de busca contínua ou preocupação persistente sugerida pelo imperativo presente, sem transformar a ordem numa proibição de todo planejamento cotidiano.
- source_word: τί φάγητε καὶ τί πίητε
  choice: o que comer e o que beber
  rationale: Os subjuntivos deliberativos são expressos naturalmente pelos infinitivos em português. A repetição preserva o paralelismo e o καί entre as duas necessidades.
- source_word: μετεωρίζεσθε
  choice: fiquem inquietos
  rationale: O verbo pode descrever alguém mentalmente suspenso, agitado ou tomado por incerteza. «Fiquem inquietos» mantém essa imagem de instabilidade sem restringir o sentido apenas à ansiedade.
- source_word: καὶ ... καὶ ... καὶ
  choice: E ... e ... nem
  rationale: O primeiro «E» conserva a ligação com o contexto e o segundo une os objetos paralelos. Antes da segunda proibição, «nem» é a coordenação negativa natural em português e preserva sua força cumulativa.
theological_decisions:
- issue: Alcance da proibição relativa a alimento e bebida
  choice: Proibição da busca inquieta e persistente por aquilo que se vai comer e beber
  alternative: Proibição de qualquer planejamento de provisões ou chamado à indiferença quanto às necessidades físicas
  rationale: O contexto trata da preocupação com as necessidades materiais. «Não fiquem buscando» e «nem fiquem inquietos» preservam a força da ordem sem apresentar alimento, bebida ou planejamento responsável como algo condenável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» evita ambiguidade de número; «o que comer e o que beber» é idiomático sem perder o paralelismo grego.
