id: LUK.12.8
reference: Luke 12:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: pt
  text: 'Eu lhes digo: todo aquele que me reconhecer[a] diante das pessoas, também o Filho do Homem o reconhecerá diante dos anjos de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que declarar publicamente que me conhece». O verbo grego também pode ser traduzido por «confessar» ou «reconhecer abertamente».
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Eu lhes digo
  rationale: O presente introduz uma afirmação solene. δέ funciona aqui como conexão leve; em português, a continuidade pode permanecer implícita, sem criar um contraste mais forte do que o grego exige.
- source_word: πᾶς ὃς ἂν
  choice: todo aquele que
  rationale: A construção expressa uma condição geral e indefinida, abrangendo qualquer pessoa que cumpra a ação descrita.
- source_word: ὁμολογήσῃ ... ὁμολογήσει
  choice: me reconhecer ... o reconhecerá
  rationale: ὁμολογέω, neste contexto, indica reconhecimento ou confissão pública. A repetição de «reconhecer» conserva a reciprocidade verbal entre a ação humana e a do Filho do Homem, em português corrente e digno.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: me ... o
  rationale: Com ὁμολογέω, a construção com ἐν é idiomática e exprime reconhecimento em relação a uma pessoa. A tradução direta pelos pronomes comunica naturalmente esse sentido, sem o português pouco claro «confessar em mim/nele».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: diante das pessoas
  rationale: ἔμπροσθεν indica presença pública. ἀνθρώπων designa aqui seres humanos em geral; «pessoas» transmite naturalmente essa abrangência em português moderno.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a autodesignação de Jesus e suas ressonâncias bíblicas, sem paráfrase interpretativa.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: diante dos anjos de Deus
  rationale: Tradução direta que preserva o cenário solene de testemunho na presença celestial.
theological_decisions:
- issue: A fórmula recíproca com ὁμολογέω e ἐν + dativo
  choice: «me reconhecer ... o reconhecerá»
  alternative: «confessar em mim ... confessará nele» ou «me confessar ... o confessará»
  rationale: A formulação escolhida conserva o reconhecimento público e a correspondência entre as duas ações, evitando uma construção artificial em português e sem acrescentar uma definição doutrinária de «confissão».
- issue: O alcance de ἀνθρώπων
  choice: «pessoas»
  alternative: «homens»
  rationale: Neste plural, ἄνθρωπος tem referência humana geral, não especificamente masculina. «Pessoas» reproduz esse alcance de modo claro e natural.
- issue: Referente de αὐτῷ
  choice: pronome singular masculino «o», retomando «todo aquele»
  alternative: repetir «essa pessoa»
  rationale: O pronome preserva a estrutura recíproca e o singular gramatical do texto, sem determinar além dele a identidade do indivíduo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Reconhecer» evita o uso pouco natural de «confessar alguém», enquanto a nota explicita o caráter público e declarativo do verbo grego. A repetição do mesmo verbo mantém o paralelismo central do versículo.
