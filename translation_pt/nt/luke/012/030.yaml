id: LUK.12.30
reference: Luke 12:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: pt
  text: Pois todas essas coisas as nações do mundo buscam[a], mas o Pai de vocês sabe que vocês precisam delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gentios do mundo”. O termo grego pode significar “nações” ou “gentios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: todas essas coisas
  rationale: O demonstrativo neutro plural com πᾶς retoma as necessidades materiais mencionadas no contexto e as explicita de modo natural em português.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: as nações do mundo
  rationale: Preserva a formulação ampla do grego e sua possível ressonância bíblica, sem restringir necessariamente o sentido a um grupo étnico ou religioso.
- source_word: ἐπιζητοῦσιν
  choice: buscam
  rationale: Expressa de modo natural a procura ativa indicada pelo verbo; opções como “procuram avidamente” explicitariam uma intensidade que convém não impor no texto principal.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: o Pai de vocês
  rationale: Reproduz a relação possessiva com linguagem corrente e não acrescenta “celestial”, ausente neste versículo.
- source_word: οἶδεν
  choice: sabe
  rationale: Embora formalmente perfeito, οἶδα tem valor presente e corresponde naturalmente a “sabe”.
- source_word: χρῄζετε τούτων
  choice: vocês precisam delas
  rationale: É uma formulação moderna e clara; o pronome feminino retoma naturalmente “essas coisas”, sem repetição pesada.
theological_decisions:
- issue: Contraste entre a busca das nações e a confiança filial dos discípulos
  choice: Manter “as nações do mundo” e “o Pai de vocês” sem expansão interpretativa.
  alternative: Traduzir ἔθνη por “gentios” ou acrescentar “celestial” a “Pai”.
  rationale: A tradução conserva o contraste presente no grego entre a busca do mundo e o conhecimento paterno de Deus, sem estreitar o alcance de ἔθνη nem importar palavras do paralelo de Mateus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “O Pai de vocês” evita tanto o lusitanismo de “vosso Pai” quanto a ambiguidade regional de “seu Pai”.
