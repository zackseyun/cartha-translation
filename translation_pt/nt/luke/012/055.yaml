id: LUK.12.55
reference: Luke 12:55
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: pt
  text: 'E, quando sopra o vento sul[a], vocês dizem: “Vai fazer um calor abrasador[b]”; e assim acontece.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sul”, isto é, o vento vindo do sul.
    reason: lexical_alternative
  - marker: b
    text: Ou “um calor intenso” ou “um calor escaldante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: vento sul
  rationale: O substantivo pode designar o sul ou o vento procedente do sul. Com o particípio πνέοντα (“soprando”), “vento sul” expressa de modo natural em português o sentido meteorológico.
- source_word: πνέοντα
  choice: sopra
  rationale: O particípio presente descreve o vento em ação. A oração “quando sopra o vento sul” reproduz esse aspecto circunstancial com fluidez em português.
- source_word: λέγετε
  choice: vocês dizem
  rationale: O presente tem valor habitual ou geral, indicando o que os ouvintes costumam dizer diante desse sinal meteorológico.
- source_word: Καύσων
  choice: calor abrasador
  rationale: O termo indica calor intenso e opressivo. “Calor abrasador” conserva essa força sem recorrer à expressão moderna e mais específica “onda de calor”.
- source_word: ἔσται
  choice: vai fazer
  rationale: Em português corrente, condições climáticas futuras são naturalmente expressas por “vai fazer calor”, equivalente idiomático da construção grega.
- source_word: γίνεται
  choice: assim acontece
  rationale: A expressão indica que a previsão se concretiza; “assim acontece” retoma com clareza o fato anunciado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural; “vento sul” e “vai fazer calor” são expressões meteorológicas correntes. A tradução evita acrescentar um verbo como “ver”, ausente do texto grego fornecido.
