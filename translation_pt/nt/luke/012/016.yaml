  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: pt
  text: 'Então lhes contou uma parábola: “A terra de certo homem rico produziu em abundância.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Então contou
  rationale: O conectivo δέ é expresso de modo leve por “então”, acompanhando o avanço da narrativa; com “parábola” como objeto, “contou” é natural em português.
- source_word: παραβολὴν πρὸς αὐτοὺς
  choice: lhes contou uma parábola
  rationale: “Parábola” preserva a categoria literária usual dos Evangelhos, e o pronome “lhes” representa naturalmente os destinatários πρὸς αὐτούς.
- source_word: λέγων
  choice: ':'
  rationale: Os dois-pontos introduzem de maneira idiomática o conteúdo anunciado pelo particípio “dizendo”, sem perda de sentido.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: de certo homem rico
  rationale: Mantém o valor possessivo da construção genitiva, a referência masculina e a especificação indefinida de τινός.
- source_word: εὐφόρησεν
  choice: produziram com abundância
  rationale: O verbo descreve terra que dá boa e farta produção; a formulação é clara, atual e mantém a ideia de abundância.
- source_word: ἡ χώρα
  choice: As terras
  rationale: Neste contexto agrícola, χώρα designa a propriedade rural ou as terras produtivas do homem, não um país; o plural idiomático evita sugerir apenas um campo específico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. A tradução preserva o caráter agrícola e a menção explícita ao homem rico, sem acrescentar interpretação teológica.
