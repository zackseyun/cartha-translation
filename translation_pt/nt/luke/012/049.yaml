  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: pt
  text: Vim lançar fogo sobre a terra, e como desejo que já estivesse aceso![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «e que quero eu, se já foi aceso?» A cláusula grega é difícil; o texto principal expressa o provável sentido idiomático de forte desejo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: fogo
  rationale: Preserva a imagem metafórica sem defini-la como juízo, purificação, Espírito ou divisão.
- source_word: ἦλθον
  choice: Vim
  rationale: O aoristo expressa de modo natural, em português, a missão ou o propósito da vinda de Jesus.
- source_word: βαλεῖν
  choice: lançar
  rationale: Mantém a força concreta e solene de βάλλω, sendo mais vívido que «trazer».
- source_word: ἐπὶ τὴν γῆν
  choice: sobre a terra
  rationale: γῆ admite «terra», «país» ou «solo»; neste dito de alcance amplo, «a terra» é a opção mais natural.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: e como desejo que já estivesse aceso!
  rationale: A cláusula grega é difícil; a formulação principal comunica sua provável força idiomática exclamativa de desejo intenso, enquanto a nota preserva a forma mais literal.
- source_word: ἤδη
  choice: já
  rationale: Expressa diretamente a noção temporal de algo que se deseja realizado desde agora.
- source_word: ἀνήφθη
  choice: estivesse aceso
  rationale: Reproduz o passivo de ἀνάπτω em português corrente e mantém a imagem do fogo; «estivesse» se ajusta naturalmente à expressão de desejo.
theological_decisions:
- issue: Sentido de «fogo» no dito de Jesus
  choice: Manter a metáfora como «fogo», sem especificar seu referente.
  alternative: Interpretá-lo explicitamente como juízo, purificação, Espírito Santo ou crise divisiva da missão de Jesus.
  rationale: O versículo não define a metáfora. A tradução preserva suas possíveis ressonâncias e a tensão teológica do contexto.
- issue: Força da cláusula difícil τί θέλω εἰ ἤδη ἀνήφθη
  choice: 'Traduzir como exclamação de desejo: «como desejo que já estivesse aceso!»'
  alternative: 'Traduzir como pergunta mais literal: «que quero eu, se já foi aceso?»'
  rationale: A leitura exclamativa representa uma compreensão idiomática provável e produz português claro, sem ocultar na nota a estrutura alternativa possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lançar fogo» preserva a vivacidade do original; «aceso» é mais corrente que «abrasado» ou «ateado».
