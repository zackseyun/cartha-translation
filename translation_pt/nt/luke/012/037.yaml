id: LUK.12.37
reference: Luke 12:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those slaves whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: pt
  text: 'Felizes aqueles escravos[a] que o Senhor[b], quando vier, encontrar acordados. Em verdade lhes digo: ele se preparará para servir[c], fará com que se reclinem à mesa e, aproximando-se, os servirá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O termo grego designa pessoas escravizadas; nesta parábola, a relação doméstica com o senhor é explícita.
    reason: lexical_alternative
  - marker: b
    text: No contexto imediato da parábola, também pode significar “senhor” ou “dono”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cingirá a si mesmo”, isto é, prenderá as vestes para se pôr a servir.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa de modo natural o pronunciamento de bem-aventurança em português atual; aqui não descreve apenas uma emoção, mas a condição favorecida daqueles escravos.
- source_word: δοῦλοι
  choice: escravos
  rationale: A condição de escravidão é relevante na relação doméstica explícita da parábola; “servos” permanece como alternativa em nota.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o valor titular de κύριος e sua possível ressonância para além da cena parabólica, sem eliminar o sentido imediato de senhor de escravos.
- source_word: γρηγοροῦντας
  choice: acordados
  rationale: O particípio indica que permanecem despertos e vigilantes; “acordados” é vívido e idiomático neste contexto noturno.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Em verdade lhes digo
  rationale: Mantém a fórmula enfática e solene em português corrente.
- source_word: περιζώσεται
  choice: se preparará para servir
  rationale: Comunica a função do gesto cultural de prender ou cingir as vestes para o trabalho, enquanto a imagem literal é registrada em nota.
- source_word: ἀνακλινεῖ αὐτούς
  choice: fará com que se reclinem à mesa
  rationale: Conserva a postura de refeição indicada pelo verbo e torna explícito o contexto da mesa.
- source_word: παρελθὼν
  choice: aproximando-se
  rationale: Representa o movimento do senhor em direção aos que estão à mesa para atendê-los, sem impor a ideia mais específica de passar de um para outro.
- source_word: διακονήσει αὐτοῖς
  choice: os servirá
  rationale: Expressa diretamente o serviço prático, provavelmente à mesa, e preserva a surpreendente inversão de papéis.
theological_decisions:
- issue: Sentido de κύριος na parábola e sua possível ressonância cristológica
  choice: Senhor
  alternative: senhor ou dono
  rationale: A cena doméstica permite entender o termo como o senhor dos escravos, mas “Senhor” preserva também a possível ressonância titular sem tornar explícita uma identificação que o versículo deixa implícita.
- issue: Representação da condição indicada por δοῦλος
  choice: escravos
  alternative: servos
  rationale: A relação hierárquica e jurídica integra a imagem da parábola. “Escravos” mantém essa força histórica, enquanto a alternativa mais branda é indicada em nota.
- issue: Inversão do papel do senhor, que serve seus escravos
  choice: manter explicitamente “os servirá”
  alternative: os atenderá à mesa
  rationale: 'A tradução conserva a tensão teológica e narrativa do texto: o Senhor assume o papel de quem serve, sem explicar ou restringir o alcance dessa imagem.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A ordem das notas foi regularizada para acompanhar sua ocorrência no texto. Preservaram-se a linguagem de escravidão da cena, a ambiguidade de κύριος e a inversão surpreendente em que o Senhor serve.
