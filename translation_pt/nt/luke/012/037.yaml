  terminology: “Escravos” reflete de forma historicamente e lexicalmente responsável δοῦλοι nesta cena doméstica, com “servos” registrado como alternativa. “Senhor” preserva tanto o sentido doméstico imediato de κύριος quanto sua possível ressonância titular, sem explicá-la em excesso. A nota sobre “cingirá a si mesmo” esclarece com precisão a imagem cultural de περιζώσεται.
