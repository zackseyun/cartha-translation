id: LUK.12.50
reference: Luke 12:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: pt
  text: Mas tenho um batismo pelo qual passar[a][b], e como estou angustiado até que ele se cumpra![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho de ser batizado com um batismo”. O grego mantém explícita a repetição ligada ao batismo.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “batismo” é uma metáfora para a experiência avassaladora que aguardava Jesus, no contexto, seu sofrimento e sua morte.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “como estou sob pressão” ou “como estou constrangido, até que se complete”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: um batismo
  rationale: Mantém explícita a metáfora do batismo, sem a reduzir no texto principal a “sofrimento” ou “morte”.
- source_word: ἔχω βαπτισθῆναι
  choice: tenho um batismo pelo qual passar
  rationale: Expressa em português natural a experiência iminente e necessária, preservando a imagem de batismo sem a repetição pouco idiomática “ser batizado com um batismo”.
- source_word: πῶς
  choice: como
  rationale: Conserva a forma exclamativa que intensifica o estado emocional de Jesus.
- source_word: συνέχομαι
  choice: estou angustiado
  rationale: Comunica a intensa pressão interior, embora o verbo também possa significar estar constrangido ou sob pressão.
- source_word: ἕως ὅτου
  choice: até que
  rationale: Marca de modo idiomático o limite temporal desse estado.
- source_word: τελεσθῇ
  choice: se cumpra
  rationale: Transmite a ideia de chegar à realização ou conclusão, sem importar deliberadamente a formulação de João 19:30.
theological_decisions:
- issue: Referência metafórica de “batismo”
  choice: Manter “batismo” no texto, entendendo-o no contexto como imagem do sofrimento e da morte que aguardavam Jesus.
  alternative: Parafrasear diretamente como “sofrimento”, “morte” ou, no outro extremo, entender como batismo literal em água.
  rationale: O contexto aponta para a paixão de Jesus, mas a tradução deve preservar a metáfora e sua tensão literária e teológica.
- issue: Nuance de συνέχομαι
  choice: “estou angustiado”
  alternative: “estou sob pressão” ou “estou constrangido”
  rationale: A opção principal é clara e natural, mas uma nota preserva a amplitude semântica do original, que não define de maneira inequívoca apenas sofrimento emocional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pelo qual passar” evita uma repetição artificial no texto principal, enquanto a nota conserva a forma mais literal. A exclamação reproduz o valor exclamativo de πῶς.
