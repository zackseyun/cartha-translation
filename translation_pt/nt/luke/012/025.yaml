  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: pt
  text: E quem de vocês, por se preocupar, é capaz de acrescentar um côvado à duração da própria vida?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acrescentar um côvado à própria estatura?”. O termo grego pode se referir à duração da vida, à idade ou à estatura.'
    reason: Preserva a ambiguidade lexical genuína de ἡλικία e informa a principal tradução alternativa.
lexical_decisions:
- source_word: μεριμνῶν
  choice: por se preocupar
  rationale: 'Expressa de modo natural o particípio que indica o meio ou a circunstância: a pessoa tenta alcançar algo por meio da preocupação.'
- source_word: ἡλικίαν
  choice: duração da própria vida
  rationale: No contexto da preocupação com a vida e em combinação com a medida figurada de um côvado, refere-se provavelmente à duração da vida. Como o termo também pode significar idade ou estatura, a ambiguidade é registrada em nota.
- source_word: πῆχυν
  choice: um côvado
  rationale: Mantém a antiga medida de comprimento usada na imagem deliberadamente concreta de Jesus.
- source_word: δύναται ... προσθεῖναι
  choice: é capaz de acrescentar
  rationale: Preserva tanto a ideia de capacidade expressa por δύναται quanto o infinitivo προσθεῖναι.
theological_decisions:
- issue: Objeto impossível de aumentar pela preocupação
  choice: a duração da própria vida
  alternative: a própria estatura
  rationale: O contexto imediato trata da vida e da ansiedade; contudo, o grego admite a leitura física de estatura, que não deve ser ocultada e por isso aparece na nota.
translation_notes:
  register: Português atual, claro e digno, com construção interrogativa natural. “Côvado” é mantido por ser uma imagem cultural e retórica importante, enquanto “duração da própria vida” torna explícito o sentido mais provável no contexto.
