id: LUK.12.22
reference: Luke 12:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: pt
  text: 'Então ele disse aos seus discípulos: “Por isso lhes digo: não se preocupem com a vida[a], quanto ao que comerão, nem com o corpo, quanto ao que vestirão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”; aqui, a palavra grega pode se referir à vida terrena da pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Então ele disse
  rationale: δέ é um conectivo leve; “Então” expressa com naturalidade a progressão do discurso sem criar um contraste forte.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: aos seus discípulos
  rationale: Mantém o possessivo αὐτοῦ e emprega a tradução corrente de μαθηταί.
- source_word: Διὰ τοῦτο λέγω ὑμῖν
  choice: Por isso lhes digo
  rationale: Preserva tanto a inferência que remete ao ensino anterior como a forma direta e enfática da declaração.
- source_word: μὴ μεριμνᾶτε
  choice: não se preocupem
  rationale: O verbo denota preocupação ou cuidado ansioso; esta formulação é clara e natural em português amplo.
- source_word: τῇ ψυχῇ
  choice: com a vida
  rationale: Neste contexto, ψυχή designa a vida terrena sustentada pelo alimento, e não necessariamente a alma como categoria distinta do corpo.
- source_word: τί φάγητε
  choice: quanto ao que comerão
  rationale: Expressa naturalmente o sentido deliberativo e voltado para o futuro do subjuntivo grego.
- source_word: μηδὲ τῷ σώματι
  choice: nem com o corpo
  rationale: Conserva a coordenação negativa e o paralelismo entre vida/alimento e corpo/vestuário.
- source_word: τί ἐνδύσησθε
  choice: quanto ao que vestirão
  rationale: O médio de ἐνδύω significa vestir ou pôr uma roupa; a formulação mantém o paralelismo com “o que comerão”.
theological_decisions:
- issue: Sentido de ψυχή neste contexto
  choice: vida
  alternative: alma
  rationale: A associação imediata de ψυχή com alimento, em paralelo com corpo e vestuário, aponta para a existência terrena. A nota preserva a possibilidade lexical de “alma” sem impor ao versículo uma leitura antropológica dualista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do grego foi preservada sem reproduzir sua sintaxe de modo artificial.
