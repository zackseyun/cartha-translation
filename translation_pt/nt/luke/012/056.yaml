id: LUK.12.56
reference: Luke 12:56
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: pt
  text: Hipócritas! Vocês sabem interpretar o aspecto da terra e do céu, mas como é que não sabem interpretar este tempo[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta ocasião” ou “este momento decisivo”. O grego καιρός pode indicar um tempo significativo ou oportuno, e não apenas o tempo em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hipócritas
  rationale: Vocativo direto de repreensão; é o equivalente tradicional e contextualmente adequado para fingimento moral, não para atores em sentido literal.
- source_word: πρόσωπον
  choice: aspecto
  rationale: Na expressão referente à terra e ao céu, indica a aparência visível. “Aspecto” conserva o sentido idiomático de modo natural em português.
- source_word: γῆς
  choice: terra
  rationale: Embora também possa significar “região” ou “solo”, o par com “céu” favorece “terra” no contexto dos sinais meteorológicos.
- source_word: οὐρανοῦ
  choice: céu
  rationale: Neste contexto, refere-se ao céu visível, cujos sinais permitem avaliar o tempo, e não especificamente à esfera divina.
- source_word: οἴδατε δοκιμάζειν
  choice: sabem interpretar
  rationale: A construção expressa conhecimento ou capacidade, e δοκιμάζειν significa aqui avaliar e discernir sinais observáveis. “Sabem interpretar” é claro e natural.
- source_word: καιρὸν τοῦτον
  choice: este tempo
  rationale: Mantém o demonstrativo e preserva a amplitude de καιρός, que pode designar o tempo presente, uma ocasião ou um momento decisivo, sem explicitar além do grego.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: como é que não sabem interpretar
  rationale: Reproduz a força indignada da pergunta retórica e mantém a repetição verbal do texto grego em português corrente.
theological_decisions:
- issue: Sentido de καιρός na repreensão de Jesus
  choice: este tempo
  alternative: este momento decisivo; esta ocasião
  rationale: O contexto sugere a incapacidade de discernir a importância do momento do ministério de Jesus e da ação de Deus, mas a tradução não deve tornar explícita uma interpretação mais estreita do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento plural “vocês” torna explícito o plural grego sem regionalismo excessivo. A repetição de “interpretar” preserva a estrutura retórica do original.
