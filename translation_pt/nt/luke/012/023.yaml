  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: pt
  text: Pois a vida é mais do que o alimento[a], e o corpo, mais do que a roupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “alma” ou “pessoa”: a palavra grega ψυχή pode ter esses sentidos; aqui, o contexto favorece “vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão explicativa da ordem anterior para não viver preocupado; “pois” preserva de modo natural a conexão argumentativa.
- source_word: ψυχή
  choice: vida
  rationale: No contexto de comer, preocupação e provisão material, refere-se à vida da pessoa, não especificamente à alma imaterial.
- source_word: πλεῖόν
  choice: mais do que
  rationale: Preserva a comparação com genitivo sem explicitar além do texto se a superioridade é de valor, importância ou abrangência.
- source_word: τροφή
  choice: alimento
  rationale: Equivalente corrente e claro para aquilo que sustenta a vida; combina naturalmente com o registro proverbial da frase.
- source_word: σῶμα
  choice: corpo
  rationale: Designa literalmente o corpo físico, em paralelo com a roupa.
- source_word: ἔνδυμα
  choice: roupa
  rationale: Termo moderno, geral e natural para aquilo que cobre o corpo.
theological_decisions:
- issue: Sentido de ψυχή no ensino sobre preocupação e provisão
  choice: vida
  alternative: alma; pessoa
  rationale: O paralelismo entre ψυχή e alimento, e entre corpo e roupa, aponta para a vida terrena sustentada pela comida. A nota conserva a amplitude lexical sem impor uma antropologia específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula em “e o corpo, mais do que a roupa” marca a elipse natural de “é”; “roupa” foi preferido a “vestimenta” por ser mais corrente, sem perda de dignidade.
