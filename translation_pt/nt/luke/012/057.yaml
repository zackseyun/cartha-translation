  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: pt
  text: E por que vocês não julgam por si mesmos o que é certo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é justo” ou “a coisa certa”.
    reason: Alternativas lexicais legítimas para τὸ δίκαιον.
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: E por que
  rationale: Introduz uma pergunta retórica que dá continuidade e intensidade ao argumento anterior. A formulação é natural em português e conserva a força conectiva das partículas.
- source_word: ἀφ’ ἑαυτῶν
  choice: por si mesmos
  rationale: Expressa julgamento feito por iniciativa e capacidade próprias. É uma formulação corrente e mantém a ênfase reflexiva do grego.
- source_word: οὐ κρίνετε
  choice: não julgam
  rationale: Preserva o sentido central de κρίνω, avaliar e chegar a um juízo, além de manter a forma retórica negativa do original.
- source_word: τὸ δίκαιον
  choice: o que é certo
  rationale: O adjetivo neutro substantivado denota aquilo que é certo ou justo. Esta opção é natural e conserva o sentido ético amplo sem restringi-lo ao âmbito jurídico.
theological_decisions:
- issue: Nuance de τὸ δίκαιον
  choice: o que é certo
  alternative: o que é justo; a coisa certa
  rationale: A expressão admite tanto a ideia geral do que é correto quanto a nuance de justiça. O texto principal mantém a amplitude ética; a nota registra alternativas legítimas sem impor uma interpretação jurídica ou doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito que o verbo grego se dirige ao grupo; “por si mesmos” conserva a ênfase reflexiva sem soar excessivamente literal.
