  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: pt
  text: Se, portanto, vocês não conseguem fazer nem mesmo a menor coisa, por que ficam ansiosos quanto ao resto?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quanto às demais coisas?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: Se, portanto
  rationale: Preserva tanto a forma condicional de εἰ quanto a ligação inferencial expressa por οὖν, em português natural.
- source_word: οὐδὲ ἐλάχιστον
  choice: nem mesmo a menor coisa
  rationale: ἐλάχιστον é neutro substantivado e designa a coisa ou questão mínima; acrescentar “coisa” torna explícita em português a elipse grega sem definir além do necessário o referente.
- source_word: δύνασθε
  choice: vocês não conseguem fazer
  rationale: Expressa a incapacidade indicada por δύνασθε e fornece naturalmente o verbo “fazer”, implícito na construção com “a menor coisa”.
- source_word: τί
  choice: por que
  rationale: 'Nesta pergunta retórica, τί tem valor causal: pergunta pela razão da ansiedade, não por seu objeto.'
- source_word: περὶ τῶν λοιπῶν
  choice: quanto ao resto
  rationale: Mantém a referência concisa às demais questões ou coisas além da menor, sem especificá-las indevidamente.
- source_word: μεριμνᾶτε
  choice: ficam ansiosos
  rationale: Comunica o sentido de ansiedade ou preocupação persistente no contexto, com formulação corrente e sem sugerir que toda cautela responsável seja condenada.
theological_decisions:
- issue: Sentido de μεριμνάω no ensino de Jesus sobre a dependência de Deus
  choice: ficam ansiosos
  alternative: se preocupam
  rationale: “Ficam ansiosos” preserva o foco na ansiedade indevida dentro do discurso, sem transformar o versículo numa proibição explícita de toda preocupação prudente. A expressão não pretende impor o sentido clínico moderno de ansiedade.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e sintaxe amplamente compreensível no Brasil e em outros contextos lusófonos. A formulação conserva a progressão lógica e a pergunta retórica do grego.
