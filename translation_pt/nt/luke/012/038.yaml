source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: pt
  text: Mesmo que ele venha na segunda vigília[a], ou mesmo na terceira, e os encontre assim, felizes são aqueles servos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “na segunda vigília da noite, ou na terceira vigília da noite”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “felizes são aqueles”. O referente são os servos mencionados no contexto imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Mesmo que ... ou mesmo
  rationale: A construção repetida introduz uma condição concessiva e indefinida. A formulação preserva a ênfase da repetição grega de modo natural em português.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: segunda vigília ... terceira
  rationale: φυλακή designa aqui um período de guarda durante a noite. “Vigília” é uma forma concisa e tradicional em português; “da noite” fica implícito no contexto e é explicitado em nota.
- source_word: ἔλθῃ
  choice: venha
  rationale: O subjuntivo traduz naturalmente o aoristo do subjuntivo dentro da condição indefinida e mantém a referência a uma possível chegada futura.
- source_word: εὕρῃ οὕτως
  choice: os encontre assim
  rationale: οὕτως remete ao estado de prontidão descrito no versículo anterior. O objeto implícito é retomado pelo pronome “os”, sem resolver além do contexto imediato.
- source_word: μακάριοι
  choice: felizes
  rationale: Neste pronunciamento, μακάριοι descreve pessoas em condição favorecida e digna de congratulação. “Felizes” comunica isso em português atual sem reduzir a expressão a uma emoção passageira.
- source_word: ἐκεῖνοι
  choice: aqueles servos
  rationale: O grego diz literalmente “aqueles”, mas o referente imediato são os servos mencionados no contexto. Explicitá-lo evita ambiguidade em português.
theological_decisions:
- issue: Explicitação do referente de ἐκεῖνοι
  choice: aqueles servos
  alternative: aqueles
  rationale: O substantivo não aparece neste versículo, mas o pronome demonstrativo retoma claramente os servos do contexto imediato. A explicitação melhora a clareza sem acrescentar conteúdo teológico novo; a nota preserva a forma literal.
- issue: Sentido de μακάριοι
  choice: felizes
  alternative: bem-aventurados
  rationale: “Felizes” é claro e natural para leitores modernos e conserva o pronunciamento de condição favorecida. “Bem-aventurados” é possível, mas tem registro mais arcaico e pode funcionar como termo técnico não exigido pelo grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe mantém a condição concessiva e a repetição enfática do grego, enquanto as notas registram tanto a elipse de “da noite” quanto a explicitação contextual de “servos”.
