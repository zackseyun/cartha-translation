id: LUK.12.13
reference: Luke 12:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: pt
  text: 'Então alguém da multidão lhe disse: “Mestre, diga ao meu irmão que divida comigo a herança.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que reparta comigo a herança” ou “que me dê a minha parte da herança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Então ... disse
  rationale: δέ é um conectivo leve; “Então” expressa com naturalidade a progressão narrativa sem introduzir forte contraste.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: alguém da multidão
  rationale: Traduz de modo direto e natural a pessoa não identificada que fala dentre os presentes.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo indica o destinatário da fala, Jesus; a forma pronominal é corrente e concisa em português.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É a forma de tratamento tradicional e ainda corrente para um instrutor, sem acrescentar um título cristológico que o contexto não explicita.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: diga ao meu irmão
  rationale: O imperativo pede que Jesus se dirija ao irmão; esta construção preserva o sentido e soa natural em português.
- source_word: μερίσασθαι
  choice: que divida
  rationale: O infinitivo aoristo médio refere-se a dividir ou repartir bens; após “diga”, a oração com subjuntivo é a construção portuguesa mais natural.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Preserva a ideia de associação ou participação expressa por μετά com genitivo, sem interpretar de forma excessivamente específica como “entre nós”.
- source_word: τὴν κληρονομίαν
  choice: a herança
  rationale: Termo amplo e exato para os bens herdados, sem especificar além do texto a situação jurídica ou familiar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Mestre” mantém o vocativo bíblico corrente; “diga ao meu irmão que divida” reproduz naturalmente a relação entre o imperativo e o infinitivo gregos. O marcador foi colocado após a frase a que se refere.
