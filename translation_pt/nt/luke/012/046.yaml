source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that slave will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: pt
  text: o senhor daquele escravo virá num dia em que ele não o espera e numa hora que não conhece, e o cortará em dois[a] e lhe dará lugar entre os infiéis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns entendem a expressão de modo figurado: “o castigará severamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os descrentes”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: senhor
  rationale: No contexto da parábola, designa o senhor daquele escravo. Em português, “senhor” expressa naturalmente essa relação doméstica e hierárquica; a construção deixa claro que não se trata aqui necessariamente de um título cristológico direto.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição de sujeição e propriedade implicada no termo grego, especialmente saliente na relação descrita pela parábola.
- source_word: ἥξει
  choice: virá
  rationale: Futuro simples e natural para a chegada do senhor no contexto da advertência.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: num dia em que ele não o espera
  rationale: Mantém o sentido de falta de expectativa e explicita pelo pronome que o escravo não espera o senhor.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: numa hora que não conhece
  rationale: Preserva a distinção lexical entre não esperar e não saber/conhecer, sem repetir “espera”.
- source_word: διχοτομήσει
  choice: o cortará em dois
  rationale: Traduz diretamente a imagem forte do verbo, que significa literalmente dividir ou cortar em dois, sem suavizá-la no texto principal.
- source_word: τὸ μέρος αὐτοῦ
  choice: lhe dará lugar
  rationale: Expressa em português natural a atribuição de seu quinhão, posição ou destino junto a determinado grupo.
- source_word: ἀπίστων
  choice: infiéis
  rationale: No contexto imediato da conduta desleal do escravo, “infiéis” conserva o sentido relacional, embora o grego também possa significar “descrentes”.
- source_word: θήσει
  choice: dará
  rationale: Na expressão idiomática, comunica que o senhor determinará ou atribuirá ao escravo um lugar entre os infiéis.
theological_decisions:
- issue: Se a imagem da punição deve ser traduzida literalmente ou apresentada como expressão idiomática de castigo severo
  choice: Manter “o cortará em dois” no texto principal
  alternative: “o castigará severamente”
  rationale: A tradução principal preserva a violência e a força retórica da imagem grega. A leitura idiomática possível é registrada em nota, sem resolver indevidamente a tensão.
- issue: Se ἀπίστων deve ser entendido como infidelidade ou incredulidade
  choice: Usar “infiéis” no texto principal
  alternative: “descrentes”
  rationale: A fidelidade é o eixo imediato da parábola, mas o adjetivo grego admite também o sentido de incredulidade; a nota preserva essa amplitude teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Senhor” e “escravo” preservam a relação social da parábola; a ordem das notas segue a ocorrência dos marcadores no texto.
