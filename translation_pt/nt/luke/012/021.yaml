id: LUK.12.21
reference: Luke 12:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: pt
  text: Assim é aquele que acumula tesouros para si mesmo e não é rico para com Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não é rico diante de Deus».'
    reason: Alternativa lexical para εἰς θεόν, entendendo a expressão em termos da posição ou avaliação da pessoa diante de Deus.
lexical_decisions:
- source_word: οὕτως
  choice: Assim é
  rationale: Retoma a parábola anterior e aplica seu desfecho à pessoa descrita, preservando a força concisa e proverbial do grego.
- source_word: ὁ θησαυρίζων
  choice: aquele que acumula tesouros
  rationale: O particípio presente substantivado descreve genericamente uma pessoa caracterizada por acumular; «tesouros» mantém a ligação lexical com θησαυρός e o contexto da parábola.
- source_word: ἑαυτῷ
  choice: para si mesmo
  rationale: Expressa diretamente a vantagem ou orientação para o próprio indivíduo e conserva o contraste com a orientação para Deus.
- source_word: καὶ μὴ
  choice: e não é
  rationale: «E» preserva a coordenação grega, enquanto «é» torna natural em português a construção com o particípio πλουτῶν.
- source_word: εἰς θεὸν
  choice: para com Deus
  rationale: Conserva a orientação relacional de εἰς sem reduzir a expressão a mera posse nem explicitar em excesso seu sentido teológico.
- source_word: πλουτῶν
  choice: rico
  rationale: O particípio funciona predicativamente; o adjetivo «rico» é natural em português e mantém o contraste com o acúmulo de tesouros.
theological_decisions:
- issue: Masculino singular representativo em uma máxima moral
  choice: aquele que
  alternative: o homem que / a pessoa que
  rationale: «Aquele que» traduz naturalmente o particípio substantivado masculino singular, mantém o número e evita sugerir que a aplicação se limite aos homens.
- issue: Sentido de ser rico εἰς θεόν
  choice: rico para com Deus
  alternative: rico diante de Deus / rico no que diz respeito a Deus
  rationale: A formulação relacional preserva a concisão, a ambiguidade legítima e a tensão teológica do original, sem acrescentar uma explicação doutrinária ausente do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «para com Deus» é ligeiramente elevada, mas corrente e adequada para preservar a orientação relacional da expressão grega.
