  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: pt
  text: 'E o Senhor disse: “Quem é, então, o administrador fiel e prudente[a], a quem o senhor encarregará dos servos da casa, para lhes dar no tempo certo a porção de alimento[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sensato”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a ração de cereal”, isto é, a porção medida de alimento destinada a cada servo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Senhor / senhor
  rationale: Na introdução narrativa, o título “Senhor” identifica Jesus; dentro da figura doméstica, “seu senhor” designa o dono que confia uma responsabilidade ao administrador. A diferença de maiúscula e construção esclarece os níveis narrativos sem esconder que o grego usa a mesma palavra.
- source_word: πιστός
  choice: fiel
  rationale: Expressa confiabilidade no exercício de uma responsabilidade recebida e é natural neste contexto.
- source_word: οἰκονόμος
  choice: administrador
  rationale: Designa quem recebe a gestão de uma casa ou propriedade. “Administrador” é claro em português moderno e conserva a ideia de autoridade delegada.
- source_word: φρόνιμος
  choice: prudente
  rationale: Comunica sabedoria prática, bom senso e discernimento no desempenho da função.
- source_word: καταστήσει
  choice: encarregará
  rationale: Neste contexto, καθίστημι indica colocar alguém numa posição de responsabilidade; “encarregará” destaca a atribuição da tarefa sem exigir um cargo formal.
- source_word: θεραπείας
  choice: seus servos
  rationale: Aqui o substantivo coletivo se refere ao grupo de servidores ou criados da casa. “Seus servos” é corrente, concreto e adequado ao cenário antigo.
- source_word: ἐν καιρῷ
  choice: no tempo certo
  rationale: Indica o momento apropriado ou devido para a distribuição.
- source_word: σιτομέτριον
  choice: porção de alimento
  rationale: Refere-se à quantidade medida e distribuída, originalmente uma ração de cereal; a expressão comunica naturalmente a função no contexto, e a nota preserva a forma mais literal.
theological_decisions:
- issue: Tradução das duas ocorrências de κύριος
  choice: “o Senhor” para Jesus na narração e “seu senhor” para o dono da casa na figura
  alternative: “o Senhor” nas duas ocorrências
  rationale: O mesmo termo grego admite tanto o título aplicado a Jesus quanto a designação de um senhor ou dono. A solução preserva essa amplitude e distingue com clareza os dois níveis do discurso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a pergunta retórica e o cenário de administração doméstica, evitando linguagem excessivamente arcaica.
