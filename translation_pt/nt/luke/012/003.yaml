id: LUK.12.3
reference: Luke 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: pt
  text: Portanto, tudo o que vocês disseram na escuridão será ouvido na luz; e o que falaram ao ouvido nos aposentos interiores será proclamado do alto dos telhados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre os telhados”. A imagem é a de um anúncio público feito a partir dos telhados planos das casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Portanto
  rationale: O idiomatismo tem força inferencial e liga esta declaração ao que foi dito no versículo anterior sobre a revelação do que está oculto.
- source_word: ὅσα
  choice: tudo o que
  rationale: Expressa de modo natural e abrangente o sentido relativo indefinido, incluindo qualquer coisa dita em segredo.
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: na escuridão / na luz
  rationale: Mantém o contraste retórico e permite tanto a imagem concreta quanto o sentido figurado de segredo e publicidade.
- source_word: ἀκουσθήσεται
  choice: será ouvido
  rationale: Preserva o futuro passivo e o tema daquilo que, antes oculto, chega ao conhecimento público.
- source_word: πρὸς τὸ οὖς
  choice: ao ouvido
  rationale: Reproduz de forma inteligível a imagem singular de falar muito de perto e em segredo.
- source_word: ἐν τοῖς ταμείοις
  choice: nos aposentos interiores
  rationale: ταμεῖον pode indicar quarto interior, depósito ou aposento privado; aqui, o contexto favorece um espaço reservado, sem restringi-lo à função de depósito.
- source_word: κηρυχθήσεται
  choice: será proclamado
  rationale: Comunica anúncio público e enfático, sem introduzir o sentido religioso mais específico que 'será pregado' poderia sugerir.
- source_word: ἐπὶ τῶν δωμάτων
  choice: do alto dos telhados
  rationale: Expressa naturalmente em português a proclamação pública feita a partir dos telhados planos, embora o grego também possa ser vertido mais formalmente como 'sobre os telhados'.
theological_decisions:
- issue: Natureza e ocasião da revelação do que estava oculto
  choice: 'Manter a declaração ampla: o que foi dito em segredo se tornará público.'
  alternative: Defini-la especificamente como revelação no juízo final ou como exposição histórica da hipocrisia.
  rationale: O contexto trata da hipocrisia oculta que será descoberta, mas o versículo não determina explicitamente o momento nem o meio dessa revelação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. O paralelismo entre escuridão/luz e segredo/proclamação pública foi preservado. A formulação evita definir se a revelação ocorre na história ou no juízo final.
