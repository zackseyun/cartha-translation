id: LUK.12.39
reference: Luke 12:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: pt
  text: 'Mas saibam disto: se o dono da casa soubesse a que hora o ladrão viria, não teria deixado que arrombassem[a] a sua casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ser escavada através [da parede]”, numa referência à prática de abrir uma passagem pela parede da casa para entrar.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Mas saibam disto
  rationale: O imperativo presente plural γινώσκετε convoca os ouvintes a reconhecer algo; “saibam disto” é direto e natural. “Mas” representa δέ como transição com leve contraste.
- source_word: ὅτι
  choice: ':'
  rationale: 'Os dois-pontos introduzem naturalmente em português o conteúdo daquilo que os ouvintes devem saber, evitando a construção menos fluida “saibam disto: que, se...”.'
- source_word: οἰκοδεσπότης
  choice: o dono da casa
  rationale: Expressa de modo claro e contemporâneo o responsável ou senhor da residência, sem o caráter antiquado de “pai de família” ou a limitação jurídica de “proprietário”.
- source_word: ποίᾳ ὥρᾳ
  choice: a que hora
  rationale: Mantém a especificidade de ὥρα e se integra naturalmente ao tema de vigilância do contexto.
- source_word: ὁ κλέπτης ἔρχεται
  choice: o ladrão viria
  rationale: Embora ἔρχεται esteja no presente grego, o futuro do pretérito é a forma natural em português dentro desta condição irreal situada no passado, sem mudar a referência ao momento esperado da chegada.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: não teria deixado
  rationale: Transmite com clareza a consequência contrafactual marcada por οὐκ ἄν com o indicativo aoristo.
- source_word: διορυχθῆναι
  choice: que arrombassem[a]
  rationale: “Arrombar” comunica de forma idiomática a entrada forçada numa casa; a nota preserva a imagem literal de escavar ou abrir passagem pela parede.
- source_word: τὸν οἶκον αὐτοῦ
  choice: a sua casa
  rationale: “Casa” é o equivalente direto de οἶκος neste contexto físico, e “sua” retoma naturalmente o dono da casa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “saibam” preserva o imperativo dirigido ao grupo. A formulação mantém a condição contrária aos fatos e conserva em nota a imagem concreta do verbo grego.
