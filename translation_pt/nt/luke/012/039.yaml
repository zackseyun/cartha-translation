  source_fidelity: 'O texto principal transmite adequadamente o imperativo plural, a condição contrária aos fatos e o sentido de entrada forçada. «O dono da casa», «a que hora», «viria» e «não teria deixado» são escolhas fiéis e naturais. A nota, porém, deve refletir que διορυχθῆναι é infinitivo passivo: a casa é objeto da ação de escavar/abrir passagem, não algo que o sujeito simplesmente escava «através de sua casa».'
  naturalness: A redação é clara, moderna e amplamente compreensível. «Não teria deixado que arrombassem a sua casa» é idiomático e preserva a construção contrafactual.
  terminology: «Dono da casa» comunica bem οἰκοδεσπότης neste contexto, sem introduzir uma leitura técnica de propriedade. «Arrombassem» expressa adequadamente o resultado contextual de διορυχθῆναι; a imagem concreta é preservada na nota corrigida.
