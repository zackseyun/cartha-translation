review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a exortação comparativa, a espera pelo senhor e a prontidão à sua chegada. Contudo, «da festa de casamento» singulariza o plural grego τῶν γάμων, que aqui designa as celebrações nupciais, e «bater à porta» explicita um objeto que o grego apenas pressupõe.
  naturalness: «E sejam vocês como pessoas» é compreensível, mas «E vocês sejam como pessoas» é uma ordem de palavras mais natural e fluida em português moderno. «Lhe abram imediatamente» também evita a construção um tanto pesada «logo a abram para ele».
  terminology: «Senhor» preserva adequadamente κύριος no cenário doméstico-parabólico, sem impor uma interpretação doutrinária. «Pessoas» é uma boa tradução genérica de ἀνθρώποις.
  issues:
  - severity: low
    issue: Singularização de τῶν γάμων
    rationale: O original traz plural, com o sentido idiomático de festividades ou celebrações de casamento. «Das festas de casamento» o conserva de modo natural.
  - severity: low
    issue: Explicitação de «à porta» e formulação da abertura
    rationale: O ato de bater sugere uma porta, mas ela não é expressa no grego. «Quando ele vier e bater, lhe abram imediatamente» preserva a elipse e soa mais natural.
  - severity: low
    issue: Ordem de palavras no imperativo
    rationale: «E vocês sejam» é mais idiomático do que «E sejam vocês» neste registro, sem alterar a ênfase exortativa.
  revised_text: E vocês sejam como pessoas que esperam o seu senhor voltar das festas de casamento, para que, quando ele vier e bater, lhe abram imediatamente.
  revised_footnotes: []
  revision_rationale: A revisão conserva o sentido e o registro da parábola, ajusta o plural de «festas de casamento», evita uma explicitação desnecessária de «porta» e melhora a fluidez sintática em português.
