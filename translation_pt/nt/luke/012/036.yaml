revisions:
- from: E sejam vocês como pessoas que esperam seu senhor voltar da festa de casamento, para que, quando ele chegar e bater à porta, logo a abram para ele.
  to: E vocês sejam como pessoas que esperam o seu senhor voltar das festas de casamento, para que, quando ele vier e bater, lhe abram imediatamente.
  rationale: A revisão conserva o sentido e o registro da parábola, ajusta o plural de «festas de casamento», evita uma explicitação desnecessária de «porta» e melhora a fluidez sintática em português.
