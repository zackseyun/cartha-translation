id: LUK.12.36
reference: Luke 12:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: pt
  text: E vocês sejam como pessoas que esperam o seu senhor voltar das festas de casamento, para que, quando ele vier e bater, lhe abram imediatamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώποις
  choice: pessoas
  rationale: Expressa naturalmente o sentido genérico de seres humanos, sem restringi-lo desnecessariamente a homens do sexo masculino.
- source_word: προσδεχομένοις
  choice: que esperam
  rationale: Comunica a espera atenta e expectante exigida pelo contexto.
- source_word: τὸν κύριον ἑαυτῶν
  choice: seu senhor
  rationale: Preserva a designação relacional e a autoridade do κύριος na cena, sem substituí-la por uma interpretação funcional como “patrão”.
- source_word: ἀναλύσῃ
  choice: voltar
  rationale: Neste contexto, o verbo indica partir do lugar da festa e, do ponto de vista dos que aguardam, retornar.
- source_word: ἐκ τῶν γάμων
  choice: da festa de casamento
  rationale: O plural idiomático γάμοι pode designar as celebrações nupciais; esta formulação é clara e natural em português.
- source_word: κρούσαντος
  choice: bater à porta
  rationale: “Bater” é o sentido lexical; “à porta” torna explícito o complemento naturalmente pressuposto pela cena.
- source_word: εὐθέως
  choice: logo
  rationale: Mantém a ideia de resposta imediata em português corrente e digno.
theological_decisions:
- issue: Tradução de κύριος na parábola
  choice: senhor
  alternative: patrão
  rationale: “Senhor” preserva a amplitude semântica e a possível ressonância cristológica de κύριος, sem eliminar seu sentido normal de autoridade doméstica na imagem parabólica.
- issue: Referente inclusivo de ἀνθρώποις
  choice: pessoas
  alternative: homens
  rationale: O substantivo é genérico na comparação; “pessoas” evita sugerir uma limitação masculina não exigida pelo grego.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o imperativo comparativo, a expectativa do retorno e a prontidão imediata, com tom digno e acessível.
