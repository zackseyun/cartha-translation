source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: pt
  text: 'Então lhes disse: “Fiquem atentos e protejam-se de todo tipo de ganância,[a] porque a vida de alguém não consiste na abundância de seus bens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de toda cobiça”. A palavra grega pode indicar ganância, cobiça ou desejo de adquirir cada vez mais.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Fiquem atentos
  rationale: O imperativo plural tem força de advertência; esta formulação é clara e natural em português atual.
- source_word: φυλάσσεσθε
  choice: protejam-se
  rationale: Preserva o valor reflexivo do imperativo e, ao lado de “fiquem atentos”, mantém os dois comandos distintos.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: de todo tipo de ganância
  rationale: “Ganância” comunica amplamente o desejo de ter mais; “todo tipo” representa o alcance abrangente de πάσης.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo natural a razão da advertência.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: mesmo que alguém tenha muitas coisas, sua vida não vem daquilo que possui
  rationale: 'A formulação reproduz com clareza a construção grega difícil: a vida de alguém não deriva de seus bens quando estes abundam, sem reduzir ζωή à mera riqueza material.'
theological_decisions:
- issue: Sentido abrangente de πλεονεξία
  choice: todo tipo de ganância
  alternative: toda cobiça
  rationale: A advertência trata do impulso aquisitivo em sentido amplo, e não apenas do desejo pela propriedade alheia.
- issue: Relação entre vida e posses
  choice: sua vida não vem daquilo que possui
  alternative: sua vida não consiste na abundância dos seus bens
  rationale: “Não vem” preserva a força de ἐκ e evita sugerir que Jesus esteja oferecendo uma definição metafísica exaustiva de “vida”; a afirmação nega que os bens abundantes sejam sua fonte.
- issue: Expressão masculina genérica
  choice: alguém ... sua vida ... aquilo que possui
  alternative: a vida de uma pessoa ... suas posses
  rationale: A construção inclusiva representa o referente humano genérico sem tornar o sexo masculino parte do sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento verbal no plural evita marcar regionalmente “vocês” ou “vós”; “aquilo que possui” é natural e mantém o referente genérico.
