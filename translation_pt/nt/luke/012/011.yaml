review_pass:
  verdict: revise
  source_fidelity: 'A enumeração das instâncias e o sentido de condução para comparecimento perante elas estão adequadamente preservados. Contudo, a redação «com como ou com o que apresentarão sua defesa» é sintaticamente deficiente em português: falta a preposição exigida por «apresentar ... em sua defesa», e «com como» não é formulação natural. A revisão conserva a dupla pergunta πῶς ἢ τί, o caráter forense de ἀπολογήσησθε e a cláusula final distinta.'
  naturalness: «Não se preocupem» é mais direto e idiomático do que «não fiquem preocupados» neste imperativo negativo. «A maneira ou o conteúdo de sua defesa» comunica naturalmente, em português moderno, o contraste entre como e o que, sem criar uma construção artificial.
  terminology: «Sinagogas», «governantes» e «autoridades» são termos adequados e suficientemente amplos. «Defesa» preserva o campo forense de ἀπολογήσησθε sem importar o sentido contemporâneo de «pedir desculpas».
  issues:
  - severity: medium
    issue: Construção sintática e idiomática inadequada em «com como ou com o que apresentarão sua defesa».
    rationale: Em português, «com como» não é natural nesse contexto, e «apresentarão sua defesa» não pode reger diretamente «o que» com o sentido pretendido; seria necessário, no mínimo, «o que apresentarão em sua defesa». A formulação compromete a clareza da dupla pergunta do grego.
  revised_text: Mas, quando levarem vocês diante das sinagogas, dos governantes e das autoridades,[a] não se preocupem com a maneira ou com o conteúdo de sua defesa, nem com o que dirão.[b]
