  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: pt
  text: Mas, quando levarem vocês diante das sinagogas, dos governantes e das autoridades,[a] não se preocupem com a maneira ou com o conteúdo de sua defesa, nem com o que dirão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão se refere tanto a órgãos religiosos ligados às sinagogas quanto a governantes e autoridades civis diante dos quais os discípulos poderiam ser interrogados.
    reason: cultural_note
  - marker: b
    text: 'Ou, de modo mais próximo à estrutura grega: «como ou o que dirão em sua defesa, ou o que dirão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mas, quando
  rationale: ὅταν exprime uma situação futura eventual ou recorrente; em português, «quando» a comunica naturalmente. δέ recebe o contraste leve de «Mas», em continuidade com o contexto.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: levarem vocês
  rationale: No contexto judicial, o verbo indica conduzir pessoas à presença de órgãos ou autoridades. «Levar» é corrente e a expressão seguinte deixa claro o comparecimento perante eles.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: diante das sinagogas, dos governantes e das autoridades
  rationale: 'ἐπί com acusativo tem aqui sentido forense: comparecer diante de instâncias religiosas e civis. A repetição grega dos artigos foi condensada segundo o uso natural do português, sem apagar as três categorias.'
- source_word: συναγωγάς
  choice: sinagogas
  rationale: Mantém o referente lexical direto e preserva a metonímia do original, em que as sinagogas representam também seus corpos judiciais.
- source_word: ἀρχάς
  choice: governantes
  rationale: Neste contexto, designa pessoas ou instâncias governantes. «Governantes» é amplo e inteligível, sem restringir indevidamente a magistrados específicos.
- source_word: ἐξουσίας
  choice: autoridades
  rationale: Refere-se aos que detêm autoridade oficial; «autoridades» é a equivalência corrente e adequada ao cenário político-judicial.
- source_word: μὴ μεριμνήσητε
  choice: não fiquem preocupados
  rationale: A proibição diz respeito à preocupação ansiosa antecipada. Esta formulação é natural, clara e evita sugerir que toda reflexão ou preparação seja censurada.
- source_word: πῶς ἢ τί
  choice: com como ou com o que
  rationale: Representa os dois interrogativos do texto adotado, preservando tanto o modo quanto o conteúdo da defesa.
- source_word: ἀπολογήσησθε
  choice: apresentarão sua defesa
  rationale: O verbo tem sentido forense de falar em defesa própria. A formulação nominal é idiomática em português e preserva o valor judicial sem introduzir a ideia moderna de pedir desculpas.
- source_word: ἢ τί εἴπητε
  choice: nem com o que dirão
  rationale: Mantém a cláusula adicional sobre o conteúdo do que será dito; «nem» expressa naturalmente a continuidade da proibição negativa em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural explícito de ὑμᾶς e formas verbais correspondentes. Conserva a enumeração das instâncias e a distinção entre apresentar defesa e falar, evitando linguagem jurídica excessivamente técnica.
