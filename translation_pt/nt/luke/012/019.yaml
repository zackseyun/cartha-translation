id: LUK.12.19
reference: Luke 12:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: pt
  text: 'E direi à minha alma[a]: ‘Alma, você tem muitos bens armazenados para muitos anos. Descanse, coma, beba e alegre-se.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mim mesmo” ou “à minha vida”. O grego ψυχή pode ter esses sentidos conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: direi
  rationale: Futuro de λέγω; “direi” reproduz de modo direto e natural a fala futura.
- source_word: ψυχῇ / Ψυχή
  choice: à minha alma / Alma
  rationale: Preserva a repetição e a força retórica do autoendereçamento no grego, sem transformar o termo em uma afirmação antropológica técnica.
- source_word: ἀγαθὰ
  choice: bens
  rationale: No contexto dos celeiros e da riqueza acumulada, designa bens materiais; “bens” é natural em português e mantém suficiente amplitude lexical.
- source_word: κείμενα
  choice: armazenados
  rationale: O particípio indica coisas depositadas ou guardadas; no contexto, “armazenados” exprime claramente a reserva acumulada.
- source_word: εἰς ἔτη πολλά
  choice: para muitos anos
  rationale: Reproduz a projeção temporal futura da expressão grega de modo idiomático.
- source_word: ἀναπαύου
  choice: Descanse
  rationale: Imperativo que convida ao repouso e à vida despreocupada; “descanse” é claro, atual e digno.
- source_word: φάγε
  choice: coma
  rationale: Imperativo simples, traduzido diretamente.
- source_word: πίε
  choice: beba
  rationale: Imperativo simples, traduzido diretamente.
- source_word: εὐφραίνου
  choice: alegre-se
  rationale: Exprime desfrutar com alegria ou festejar; “alegre-se” preserva a forma reflexiva e evita linguagem arcaica.
theological_decisions:
- issue: Tradução de ψυχή em um autoendereçamento dentro da parábola
  choice: alma
  alternative: eu; vida
  rationale: “Alma” conserva a repetição literária e a ressonância do grego. A nota registra alternativas contextuais para não impor uma antropologia técnica nem ocultar a amplitude de ψυχή.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “você” torna o autoendereçamento claro; os imperativos mantêm dignidade sem arcaísmo. A coordenação final usa “e” antes do último imperativo, natural em português.
