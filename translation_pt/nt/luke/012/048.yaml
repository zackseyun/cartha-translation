id: LUK.12.48
reference: Luke 12:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: pt
  text: Mas aquele que não sabia e fez o que merecia golpes receberá poucos golpes. De todo aquele a quem muito foi dado, muito será exigido; e daquele a quem confiaram muito, ainda mais lhe pedirão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: aquele que não soube
  rationale: Mantém o particípio substantivado e a falta de conhecimento sem transformar a expressão em incapacidade de compreender nem explicitar o objeto, que vem do contexto anterior.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: fez o que merecia golpes
  rationale: Expressa de modo natural a relação entre os atos praticados e o castigo merecido, preservando a imagem concreta de golpes.
- source_word: δαρήσεται ὀλίγας
  choice: receberá poucos golpes
  rationale: Torna explícito em português o substantivo elíptico retomado de πληγῶν e conserva o sentido passivo de ser golpeado, sem especificar instrumento ou modalidade.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: De todo aquele a quem muito foi dado
  rationale: Reproduz a construção geral de responsabilidade e prepara naturalmente a expressão seguinte, 'muito será exigido'.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: muito será exigido
  rationale: Neste contexto, ζητέω indica cobrança ou exigência de prestação de contas; a origem pessoal da cobrança já fica indicada por 'daquele'.
- source_word: παρέθεντο πολύ
  choice: confiaram muito
  rationale: Παρατίθημι denota entregar algo aos cuidados de alguém. O plural sem sujeito expresso é preservado, sem identificar indevidamente o agente.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: ainda mais pedirão
  rationale: Preserva a distinção verbal entre αἰτέω e ζητέω, bem como o plural impessoal, enquanto 'ainda mais' comunica a responsabilidade aumentada.
theological_decisions:
- issue: Natureza da imagem de castigo
  choice: Manter a imagem concreta de golpes e a gradação do castigo.
  alternative: Substituir por 'castigo' ou especificar 'açoites'.
  rationale: O texto apresenta, em linguagem parabólica, castigo proporcional ao conhecimento e à responsabilidade. 'Golpes' preserva a imagem sem a tornar vaga nem impor um instrumento específico.
- issue: Agente das ações na cláusula final
  choice: Preservar o plural sem sujeito expresso em 'confiaram' e 'pedirão'.
  alternative: Identificar explicitamente Deus ou outras pessoas como agentes.
  rationale: Os verbos gregos estão na terceira pessoa do plural sem sujeito declarado. Nomear o agente resolveria uma indeterminação que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de 'golpes' foi mantida para explicitar a elipse grega e preservar a força da imagem. O paralelismo entre o que foi dado e o que foi confiado permanece sem acrescentar um agente explícito.
