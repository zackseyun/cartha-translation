revisions:
- from: Mas aquele que não soube e fez o que merecia golpes receberá poucos golpes. De todo aquele a quem muito foi dado, muito será exigido; e daquele a quem confiaram muito, ainda mais pedirão.
  to: Mas aquele que não sabia e fez o que merecia golpes receberá poucos golpes. De todo aquele a quem muito foi dado, muito será exigido; e daquele a quem confiaram muito, ainda mais lhe pedirão.
  rationale: A revisão explicita, com «lhe», o complemento pessoal expresso por αὐτόν na última oração e ajusta «não soube» para «não sabia», formulação portuguesa mais natural para a ignorância em questão. Mantêm-se a imagem concreta de «golpes», a proporcionalidade da responsabilidade e os agentes plurais não especificados.
