review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a lógica central: ignorância relativa, atos merecedores de golpes e responsabilidade proporcional ao que se recebeu ou foi confiado. Contudo, na última cláusula, «ainda mais pedirão» deixa sem expressão clara a pessoa de quem se pede, enquanto αὐτόν indica explicitamente «dele/lhe».'
  naturalness: O português é moderno e claro. «Aquele que não soube» é possível, mas «aquele que não sabia» soa mais natural para a condição de não ter conhecimento que o particípio grego descreve. A inclusão de «lhe» na cláusula final torna a frase idiomática e inequívoca.
  terminology: «Golpes» traduz bem πληγαί sem especificar açoites ou outro instrumento. «Será exigido» e «confiaram» comunicam adequadamente a prestação de contas e a responsabilidade confiada. O plural indeterminado de «confiaram» e «pedirão» é mantido.
  issues:
  - severity: medium
    issue: A pessoa requerida na cláusula final está apenas implícita em «ainda mais pedirão».
    rationale: O grego traz αὐτόν, «dele/dele mesmo», como complemento de αἰτήσουσιν. Em português, «ainda mais lhe pedirão» preserva explicitamente que a exigência é feita à pessoa a quem muito foi confiado, e não apenas que se pedirá uma quantidade maior.
  - severity: low
    issue: «Não soube» pode sugerir que a pessoa deixou de descobrir algo, em vez de simplesmente não ter conhecimento.
    rationale: «Não sabia» expressa mais naturalmente em português a condição de ignorância indicada por ὁ μὴ γνούς, sem introduzir uma nuance de falha em obter informação.
  revised_text: Mas aquele que não sabia e fez o que merecia golpes receberá poucos golpes. De todo aquele a quem muito foi dado, muito será exigido; e daquele a quem confiaram muito, ainda mais lhe pedirão.
