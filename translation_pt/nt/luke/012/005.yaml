id: LUK.12.5
reference: Luke 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: pt
  text: 'Mas eu lhes mostrarei a quem devem temer: temam aquele que, depois de matar, tem autoridade para lançar na Geena.[a] Sim, eu lhes digo: temam esse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inferno”. O termo grego é Geena, expressão de juízo cujas raízes remontam às imagens associadas ao vale de Hinom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: eu lhes mostrarei
  rationale: O futuro de ὑποδείκνυμι indica que Jesus vai apontar claramente a quem se deve temer; “mostrarei” é natural e não acrescenta a ideia de advertência ao verbo.
- source_word: τίνα φοβηθῆτε
  choice: a quem devem temer
  rationale: A pergunta indireta é expressa em português corrente com “a quem devem temer”, preservando seu caráter instrutivo.
- source_word: φοβήθητε
  choice: temam
  rationale: O imperativo, repetido no versículo, transmite uma ordem solene; “temam” preserva tanto a força quanto a continuidade lexical.
- source_word: τὸν
  choice: aquele
  rationale: O artigo substantivado aponta para uma pessoa ainda não nomeada; “aquele” é claro e natural em português.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: depois de matar
  rationale: A construção com μετά e infinitivo marca sequência temporal de modo direto, sem explicitar além do grego o sujeito do ato.
- source_word: ἔχοντα ἐξουσίαν
  choice: tem autoridade
  rationale: ἐξουσία denota autoridade, direito ou poder autorizado, e não apenas capacidade bruta.
- source_word: ἐμβαλεῖν εἰς
  choice: lançar na
  rationale: “Lançar” preserva a ação forte de ἐμβάλλω e mantém um registro digno sem soar arcaico.
- source_word: γέενναν
  choice: Geena
  rationale: “Geena” é a forma portuguesa tradicionalmente transliterada do termo grego e conserva sua ressonância judaica e geográfica sem o equiparar silenciosamente a conceitos teológicos posteriores.
- source_word: ναί
  choice: Sim
  rationale: A afirmação enfática é reproduzida pela forma simples e vigorosa “Sim”.
- source_word: τοῦτον
  choice: esse
  rationale: O demonstrativo retoma enfaticamente a pessoa já indicada; “esse” é a retomada mais natural em português brasileiro corrente.
theological_decisions:
- issue: Identidade daquele que deve ser temido
  choice: Manter a referência implícita como “aquele”
  alternative: Explicitar “Deus”
  rationale: O contexto costuma ser entendido como referência a Deus, mas o texto grego não o nomeia neste versículo. A tradução preserva essa formulação e não resolve a referência por inserção interpretativa.
- issue: Tradução de γέεννα no contexto de juízo
  choice: Geena
  alternative: inferno
  rationale: A transliteração mantém o termo específico empregado pelo texto e suas raízes na imagem do vale de Hinom. “Inferno” é fornecido em nota como equivalente interpretativo comum, sem substituir o termo original no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “temer/temam” e a ênfase final foram preservadas; evitou-se nomear explicitamente o referente que o grego deixa implícito.
