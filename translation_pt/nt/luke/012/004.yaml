id: LUK.12.4
reference: Luke 12:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: pt
  text: 'Mas eu digo a vocês, meus amigos: não tenham medo dos que matam o corpo e, depois disso, nada mais podem fazer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Mas eu digo
  rationale: δέ marca uma transição levemente adversativa no discurso. “Mas eu digo” preserva essa mudança sem exagerar o contraste.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: a vocês, meus amigos
  rationale: 'A expressão dativa é apositiva: Jesus se dirige aos ouvintes e os chama afetuosamente de “meus amigos”. A formulação conserva tanto o pronome quanto a designação.'
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: não tenham medo dos que matam
  rationale: O subjuntivo aoristo com μή expressa proibição, e ἀπό após φοβέομαι introduz o objeto ou a fonte do medo. A construção portuguesa é natural e mantém o sentido genérico do particípio presente.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: σῶμα designa aqui o corpo físico; a tradução direta é clara e preserva a formulação do texto.
- source_word: καὶ μετὰ ταῦτα
  choice: e, depois disso
  rationale: A expressão é temporal e indica o que sucede à morte do corpo. “Depois disso” reproduz naturalmente a sequência.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: nada mais podem fazer
  rationale: A frase descreve o limite dos que matam após a morte corporal. περισσότερόν τι significa “algo mais” ou “algo além”; a formulação escolhida é idiomática e mantém a ênfase na incapacidade de ir além.
theological_decisions:
- issue: Alcance do poder humano depois da morte corporal
  choice: A tradução afirma apenas que os perseguidores humanos podem matar o corpo e, depois disso, nada mais podem fazer.
  alternative: Explicitar que eles não podem matar a alma.
  rationale: Embora o versículo seguinte contraste a limitação humana com a autoridade de Deus, este versículo não menciona expressamente a alma. A tradução preserva a formulação e a tensão do texto sem antecipar ou importar a explicação do contexto seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” oferece naturalidade internacional com forte clareza no Brasil; “não tenham medo” é mais corrente do que “não temam”, sem perda da força proibitiva.
