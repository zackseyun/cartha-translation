  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: pt
  text: 'Mas ele lhe disse: “Homem, quem me constituiu juiz ou encarregado de repartir entre vocês?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Homem
  rationale: Preserva a forma direta e sóbria de tratamento do grego, sem acrescentar familiaridade ou hostilidade.
- source_word: κατέστησεν
  choice: constituiu
  rationale: Expressa a ideia de designação formal para uma função, em registro digno e natural.
- source_word: κριτὴν
  choice: juiz
  rationale: Equivalente direto e corrente para aquele que decide uma disputa.
- source_word: μεριστὴν
  choice: responsável pela partilha
  rationale: Comunica em português natural a função de repartir ou distribuir os bens em disputa, sem confundi-la completamente com a função judicial.
- source_word: ἐφ’ ὑμᾶς
  choice: entre vocês
  rationale: No contexto de uma controvérsia entre partes, transmite de modo idiomático a autoridade exercida sobre elas.
theological_decisions:
- issue: Alcance da pergunta de Jesus
  choice: Manter a pergunta sobre quem o constituiu para essas funções específicas
  alternative: Formular como rejeição absoluta de qualquer função judicial ou autoridade de Jesus
  rationale: O grego apresenta uma pergunta retórica ligada à disputa concreta; a tradução não deve ampliar isso para uma negação teológica geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação distingue ‘juiz’ da pessoa encarregada de efetuar a partilha.
