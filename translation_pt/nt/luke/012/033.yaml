id: LUK.12.33
reference: Luke 12:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: pt
  text: Vendam os seus bens e deem esmolas[a]. Façam para si bolsas que não se desgastem, um tesouro inesgotável nos céus[b], onde ladrão algum chega perto e nenhuma traça destrói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, deem ajuda material aos necessitados como expressão de misericórdia.
    reason: lexical_clarification
  - marker: b
    text: 'Também se pode traduzir: “no céu”. O grego emprega o plural, “nos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Vendam
  rationale: O imperativo aoristo plural pede uma ação decidida; “vendam” é direto e não acrescenta a ideia de liquidação total.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: os seus bens
  rationale: Expressa de modo natural e abrangente aquilo que lhes pertence, isto é, suas posses.
- source_word: δότε ἐλεημοσύνην
  choice: deem esmolas
  rationale: Preserva o substantivo grego referente à ajuda material motivada por misericórdia, especialmente em favor dos necessitados.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Façam para si
  rationale: Mantém tanto a força imperativa quanto o sentido reflexivo de agir em benefício próprio.
- source_word: βαλλάντια
  choice: bolsas
  rationale: Refere-se a bolsas ou pequenos sacos usados para guardar dinheiro; “bolsas” conserva a metáfora concreta sem exigir explicação no corpo do texto.
- source_word: μὴ παλαιούμενα
  choice: que não se desgastem
  rationale: No contexto de bolsas, traduz naturalmente a ideia de não envelhecerem nem ficarem gastas.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: um tesouro inesgotável
  rationale: Comunica que o tesouro não falha nem se acaba, preservando com clareza a força de ἀνέκλειπτον.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural do grego e soa natural no registro bíblico português.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: onde ladrão algum chega perto
  rationale: Conserva a imagem espacial e a ênfase negativa sem tornar a frase excessivamente formal.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: e nenhuma traça destrói
  rationale: Traduz o dano causado pela traça com um verbo forte e natural, em paralelo com a ameaça do ladrão.
theological_decisions:
- issue: Sentido de ἐλεημοσύνην na exortação sobre os bens
  choice: deem esmolas
  alternative: deem aos pobres
  rationale: “Esmolas” representa diretamente o substantivo grego e sua referência a atos concretos de misericórdia material. A nota esclarece o sentido para leitores que possam associar a palavra apenas a pequenas doações.
- issue: Número de ἐν τοῖς οὐρανοῖς
  choice: nos céus
  alternative: no céu
  rationale: O plural é conservado por refletir a forma grega e o idioma judaico do período, sem impor uma distinção cosmológica que o versículo não desenvolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bens” é mais natural que “posses”; “esmolas” preserva o termo específico do original e recebe esclarecimento em nota. O paralelismo e as metáforas de bolsas, tesouro, ladrão e traça foram mantidos.
