id: LUK.12.43
reference: Luke 12:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: pt
  text: Feliz aquele servo a quem o seu senhor[a], quando chegar, encontrar agindo assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amo”. O termo grego pode indicar o senhor da casa no cenário da parábola ou o Senhor na aplicação mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Em português bíblico corrente, “feliz” expressa naturalmente a condição favorável declarada pela bem-aventurança, sem reduzi-la a uma emoção passageira.
- source_word: δοῦλος
  choice: servo
  rationale: “Servo” preserva o contexto doméstico e a relação de submissão e dever, sem fazer da condição jurídica de escravo o foco do versículo.
- source_word: ἐκεῖνος
  choice: aquele
  rationale: Mantém a especificidade e a ênfase do demonstrativo grego.
- source_word: κύριος
  choice: senhor
  rationale: “Senhor” funciona naturalmente para o superior da casa e também conserva a possível ressonância de “Senhor” na aplicação mais ampla da parábola.
- source_word: ἐλθὼν
  choice: quando chegar
  rationale: 'Converte o particípio aoristo em oração temporal idiomática, mantendo a sequência: o senhor chega e então encontra o servo.'
- source_word: εὑρήσει
  choice: encontrar
  rationale: 'O infinitivo dependente de “Feliz aquele servo que...” representa de modo natural em português o futuro grego: será feliz o servo que, na chegada do senhor, for encontrado nessa conduta.'
- source_word: ποιοῦντα οὕτως
  choice: agindo assim
  rationale: Retoma de forma clara e idiomática a conduta descrita anteriormente; evita o pouco natural “fazendo desse modo”.
theological_decisions:
- issue: Possível ressonância cristológica de κύριος numa parábola sobre a volta do senhor da casa
  choice: senhor
  alternative: amo
  rationale: “Senhor” é adequado à relação doméstica da parábola e, ao mesmo tempo, não elimina a alusão possível à volta do Senhor. A nota registra “amo” como leitura que ressalta apenas o cenário social imediato.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura ampla no Brasil. A formulação conserva a concisão do grego e sua tensão entre o senhor doméstico da parábola e o Senhor evocado por sua aplicação.
