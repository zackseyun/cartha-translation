- from: Feliz aquele servo que o seu senhor[a], quando chegar, encontrar agindo assim.
  to: Feliz aquele servo a quem o seu senhor[a], quando chegar, encontrar agindo assim.
  rationale: Substituiu-se «que» por «a quem» exclusivamente para explicitar a função do servo como objeto de «encontrar» e produzir uma construção relativa mais nítida em português. Não há alteração semântica nem teológica.
