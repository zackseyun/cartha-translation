review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente a bem-aventurança (μακάριος), o servo específico (ὁ δοῦλος ἐκεῖνος), a chegada do senhor e o achá-lo em determinada conduta. «Senhor» preserva legitimamente tanto o sentido doméstico imediato de κύριος quanto sua possível ressonância mais ampla, sem decidir a questão teológica.
  naturalness: A redação é clara e de registro bíblico moderno. Contudo, «aquele servo que o seu senhor ... encontrar» pode gerar uma leve ambiguidade sintática, pois «que» pode ser inicialmente processado como sujeito da oração relativa. «A quem» torna inequívoca a função de objeto e corresponde mais diretamente a ὃν.
  terminology: «Feliz», «servo», «senhor» e «agindo assim» são escolhas defensáveis e naturais para o português-alvo. A nota com «amo» oferece de modo apropriado a alternativa que salienta o cenário doméstico, sem impor uma leitura cristológica.
  issues:
  - severity: low
    issue: Ambiguidade sintática potencial em «aquele servo que o seu senhor ... encontrar».
    rationale: O pronome relativo sem preposição pode momentaneamente obscurecer que o servo é o objeto de «encontrar». «A quem» explicita essa relação, reflete ὃν e mantém o sentido inalterado.
  revised_text: Feliz aquele servo a quem o seu senhor[a], quando chegar, encontrar agindo assim.
  revised_footnotes:
