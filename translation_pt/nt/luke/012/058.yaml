id: LUK.12.58
reference: Luke 12:58
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: pt
  text: Pois, enquanto você vai com seu acusador perante uma autoridade, empenhe-se, no caminho, em se livrar dele[a], para que ele não arraste você até o juiz, o juiz entregue você ao oficial de justiça, e o oficial de justiça jogue você na prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegar a um acordo com ele”. A expressão grega significa literalmente “ficar livre dele”, mas, neste contexto, provavelmente se refere a resolver a disputa antes que ela chegue ao juiz.'
    reason: alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Pois, enquanto
  rationale: “Pois” preserva a ligação explicativa de γάρ, e “enquanto” apresenta com naturalidade a situação introduzida por ὡς, sem produzir a construção pouco idiomática “pois, assim como” neste contexto.
- source_word: ἀντιδίκου
  choice: acusador
  rationale: No cenário judicial, designa a parte contrária que conduz a demanda. “Acusador” é claro para o leitor comum e conserva o caráter legal da cena.
- source_word: ἄρχοντα
  choice: autoridade
  rationale: O termo indica aqui uma autoridade cívica diante da qual a causa seria levada. “Autoridade” mantém o sentido administrativo e evita confundi-la com o “juiz” mencionado em seguida.
- source_word: δὸς ἐργασίαν
  choice: empenhe-se
  rationale: Expressa a exortação idiomática a agir com diligência e esforço, em português atual e conciso.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: se livrar dele
  rationale: Mantém de modo relativamente formal a ideia grega de ficar livre da parte contrária ou de sua reivindicação, sem inserir diretamente no texto a interpretação mais específica de chegar a um acordo.
- source_word: ἐν τῇ ὁδῷ
  choice: no caminho
  rationale: Preserva tanto a localização literal quanto a urgência temporal de agir antes de chegar ao tribunal.
- source_word: κατασύρῃ
  choice: arraste
  rationale: Conserva a força e a vivacidade do verbo, que sugere condução coercitiva.
- source_word: κριτήν / κριτής
  choice: juiz
  rationale: É a equivalência jurídica direta e clara para o agente que profere a decisão.
- source_word: παραδώσει
  choice: entregue você
  rationale: Expressa naturalmente a transferência judicial da pessoa à custódia de outro agente.
- source_word: πράκτορι / πράκτωρ
  choice: oficial de justiça
  rationale: Identifica de modo compreensível o funcionário encarregado de executar a ordem judicial. Embora as funções antigas não coincidam exatamente com as modernas, a expressão comunica melhor o papel no contexto do que o genérico “oficial”.
- source_word: βαλεῖ εἰς φυλακήν
  choice: jogue você na prisão
  rationale: Preserva a imagem forte e coercitiva de βάλλω, em vez de reduzi-la ao mais neutro “coloque”.
theological_decisions:
- issue: Especificidade interpretativa da exortação judicial
  choice: Manter a cena jurídica sem identificar explicitamente suas figuras com realidades espirituais.
  alternative: Traduzir a cena como uma exortação direta à reconciliação com Deus antes do juízo final.
  rationale: O contexto mais amplo pode sugerir urgência escatológica, mas o versículo apresenta diretamente uma situação judicial. A tradução não deve transformar em identificação doutrinária explícita aquilo que o texto deixa na forma de imagem ou analogia.
- issue: Sentido de ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: Preservar no texto a formulação mais aberta “se livrar dele”.
  alternative: Explicitar “chegar a um acordo com ele”.
  rationale: Chegar a um acordo é provavelmente a ação prática pretendida, mas a expressão grega fala literalmente em ficar livre da parte contrária. A redação principal conserva essa amplitude, e a interpretação contextual é informada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “oficial de justiça” evita ambiguidade quanto ao sujeito da última oração. O marcador [a] foi colocado imediatamente após a expressão a que a nota se refere.
