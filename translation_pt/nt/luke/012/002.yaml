id: LUK.12.2
reference: Luke 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: pt
  text: Mas não há nada encoberto que não venha a ser revelado,[a][c] nem nada oculto que não venha a ser conhecido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «escondido». O grego emprega a imagem de algo que foi coberto e depois será revelado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «secreto».'
    reason: lexical_alternative
  - marker: c
    text: Esta afirmação pode referir-se, de modo amplo, à revelação futura, seja no presente, seja no juízo final.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: não há nada
  rationale: Expressa de modo natural em português o pronome negativo absoluto, sem reduzir seu alcance.
- source_word: δὲ
  choice: Mas
  rationale: Preserva a leve ideia de contraste ou desenvolvimento no contexto imediato.
- source_word: συγκεκαλυμμένον
  choice: encoberto
  rationale: O particípio perfeito passivo descreve algo que permanece coberto ou escondido; «encoberto» conserva a imagem e soa natural.
- source_word: ἀποκαλυφθήσεται
  choice: venha a ser revelado
  rationale: Traduz o futuro passivo e mantém o contraste lexical e imagético com «encoberto»; a construção portuguesa comunica a inevitabilidade futura sem especificar quando ocorrerá.
- source_word: κρυπτὸν
  choice: oculto
  rationale: Representa algo escondido ou secreto e evita repetição excessiva de «encoberto».
- source_word: γνωσθήσεται
  choice: venha a ser conhecido
  rationale: Preserva o futuro passivo e a distinção entre revelar algo e ele tornar-se conhecido.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: que não venha a ser
  rationale: Mantém o paralelismo das duas orações relativas negativas em português corrente e digno.
theological_decisions:
- issue: Alcance e momento da revelação
  choice: Uma afirmação geral de que aquilo que agora está encoberto ou oculto acabará sendo revelado e conhecido.
  alternative: Uma referência exclusivamente ao juízo final ou exclusivamente à exposição da hipocrisia no presente.
  rationale: Os futuros passivos afirmam a revelação posterior, mas não determinam seu momento. A tradução preserva essa abertura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo do grego foi preservado, com vocabulário corrente e tom digno.
