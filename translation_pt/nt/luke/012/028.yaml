id: LUK.12.28
reference: Luke 12:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: pt
  text: Mas, se Deus veste assim a vegetação do campo[a], que hoje existe e amanhã é lançada no forno[b], quanto mais vestirá vocês, vocês de pouca fé!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “erva” ou “capim”.
    reason: lexical_alternative
  - marker: b
    text: Trata-se de um forno para assar; a vegetação seca do campo podia ser usada como combustível.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: vegetação
  rationale: Neste contexto, χόρτος abrange a vegetação rasteira do campo, incluindo plantas e flores, e não apenas grama; “vegetação” preserva melhor essa amplitude em português.
- source_word: ἐν ἀγρῷ
  choice: do campo
  rationale: A expressão localiza genericamente a vegetação no campo; “vegetação do campo” é natural e concisa em português.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: que hoje existe e amanhã é lançada
  rationale: Expande naturalmente a construção participial grega, mantendo o contraste temporal e a transitoriedade da vegetação sem acrescentar a ideia de estar viva.
- source_word: κλίβανον
  choice: forno
  rationale: κλίβανος designa um forno, frequentemente de barro e usado para assar; “forno” evita a conotação industrial de “fornalha”.
- source_word: ἀμφιέζει
  choice: veste
  rationale: O verbo descreve Deus revestindo a vegetação e sustenta a comparação com a roupa humana; “veste” é corrente e digno.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: Equivalente idiomático do argumento do menor para o maior, preservando sua força retórica.
- source_word: ὀλιγόπιστοι
  choice: gente de pouca fé
  rationale: Mantém o vocativo direto e a repreensão à confiança insuficiente, em linguagem portuguesa natural e inclusiva para o grupo, sem transformar a expressão em formulação doutrinária técnica.
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: “Mas” marca a leve transição contrastiva de δέ, enquanto “se” conserva a forma condicional do argumento.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Representa diretamente o sujeito explícito do texto grego.
- source_word: οὕτως
  choice: assim
  rationale: Modifica o modo como Deus veste a vegetação e é o equivalente português mais natural neste contexto.
theological_decisions:
- issue: Força de ὀλιγόπιστοι na interpelação de Jesus
  choice: 'Repreensão direta, mas não técnica: “gente de pouca fé”'
  alternative: “homens de pouca fé” ou “vocês, que têm pouca fé”
  rationale: A expressão censura a confiança deficiente dos discípulos em Deus, mas não define sua condição salvífica nem implica apostasia. A formulação preserva a tensão pastoral e a força do vocativo sem intensificá-las.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “vocês” favorece clareza e abrangência; “gente de pouca fé” evita o masculino marcado sem perder o caráter direto do vocativo. A sintaxe preserva o contraste entre a existência breve da vegetação e o cuidado maior de Deus pelas pessoas.
