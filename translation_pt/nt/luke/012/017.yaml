  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: pt
  text: 'E pensava consigo mesmo: “O que farei, já que não tenho onde armazenar minha colheita?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: pensava
  rationale: O imperfeito retrata um processo contínuo de reflexão e deliberação interior. “Pensava” é natural em português e, com “consigo mesmo”, comunica adequadamente esse sentido.
- source_word: ἐν ἑαυτῷ
  choice: consigo mesmo
  rationale: A expressão indica deliberação interior, sem exigir que as palavras tenham sido pronunciadas em voz alta.
- source_word: λέγων
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural em português o conteúdo do pensamento, evitando a formulação mais pesada “dizendo” sem perder a função do particípio grego.
- source_word: Τί ποιήσω
  choice: O que farei
  rationale: A pergunta deliberativa é bem expressa pelo futuro do indicativo em português contemporâneo, preservando a incerteza sobre o que fazer.
- source_word: ὅτι
  choice: já que
  rationale: Aqui a conjunção introduz a razão da pergunta. “Já que” é causal, claro e natural no contexto.
- source_word: οὐκ ἔχω ποῦ
  choice: não tenho onde
  rationale: É a forma idiomática e direta de expressar em português a ausência de um lugar disponível.
- source_word: συνάξω
  choice: armazenar
  rationale: Embora o verbo tenha o sentido básico de reunir, o contexto exige um lugar para guardar a produção; “armazenar” torna clara essa finalidade agrícola e prepara naturalmente o desenvolvimento da parábola.
- source_word: τοὺς καρπούς μου
  choice: minha colheita
  rationale: Neste contexto, καρποί designa a produção agrícola. “Colheita” é abrangente, natural e evita o sentido moderno mais restrito de “frutos”.
