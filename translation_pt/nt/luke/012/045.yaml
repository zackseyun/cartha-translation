source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that slave says in his heart[a], ‘My master delays in coming,’ and begins to beat the male slaves and the female servants, and to eat and drink and get drunk[b],
translation:
  language: pt
  text: 'Mas, se aquele escravo[a] disser em seu coração[b]: “Meu senhor está demorando a vir”, e começar a espancar os escravos e as escravas, a comer, a beber e a embriagar-se,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O grego δοῦλος indica alguém sujeito à autoridade de um senhor; “escravo” destaca essa relação de dependência no contexto da parábola.
    reason: lexical_alternative
  - marker: b
    text: Isto é, “disser consigo mesmo”. “Em seu coração” descreve um pensamento interior.
    reason: idiom_clarification
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: A relação de sujeição e autoridade doméstica é relevante na parábola; “escravo” expressa essa condição com mais precisão do que o termo mais brando “servo”.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: em seu coração
  rationale: Preserva de modo natural a imagem semítica e grega do pensamento interior, isto é, algo dito consigo mesmo.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: está demorando a vir
  rationale: Expressa naturalmente em português a demora em curso indicada pelo presente e pelo infinitivo complementar.
- source_word: κύριός μου
  choice: meu senhor
  rationale: No contexto da casa narrada na parábola, designa o superior do escravo. Em português, “senhor” pode indicar naturalmente essa relação sem exigir aqui um título divino.
- source_word: ἄρξηται τύπτειν
  choice: começar a espancar
  rationale: “Começar” comunica o aspecto ingressivo, e “espancar” transmite a agressão reiterada ou severa sugerida pelo contexto.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: os criados e as criadas
  rationale: Mantém a distinção masculina e feminina do par grego e emprega termos atuais para os subordinados da casa, sem igualá-los necessariamente ao δοῦλος mencionado antes.
- source_word: ἐσθίειν τε καὶ πίνειν
  choice: a comer, a beber
  rationale: Reproduz de maneira direta os infinitivos coordenados e mantém o paralelismo das ações.
- source_word: μεθύσκεσθαι
  choice: a embriagar-se
  rationale: Forma digna e corrente que comunica claramente o processo de ficar bêbado.
theological_decisions:
- issue: Sentido de κύριος dentro da parábola
  choice: senhor
  alternative: amo
  rationale: O referente imediato é o superior humano da casa. “Senhor” preserva a amplitude lexical de κύριος e funciona no contexto doméstico, sem explicitar prematuramente uma identificação teológica.
- issue: Condição social expressa por δοῦλος
  choice: escravo
  alternative: servo
  rationale: A hierarquia, a sujeição e a prestação de contas são centrais no cenário; “escravo” preserva a realidade social mais forte do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Criados e criadas” diferencia παῖδας/παιδίσκας do δοῦλος principal e conserva o par de gêneros. A vírgula final foi mantida porque o versículo prossegue sintaticamente no versículo seguinte.
