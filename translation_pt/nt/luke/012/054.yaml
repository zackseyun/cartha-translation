id: LUK.12.54
reference: Luke 12:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: pt
  text: 'Ele dizia também às multidões: “Quando vocês veem uma nuvem surgindo no oeste, dizem imediatamente: ‘Vem chuva forte[a]’, e assim acontece.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vem chuva”. O termo grego ὄμβρος pode indicar chuva em geral ou, mais especificamente, chuva forte ou torrencial.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ele dizia
  rationale: O imperfeito apresenta a fala como contínua ou como pano de fundo narrativo; “dizia” preserva naturalmente esse aspecto em português.
- source_word: δὲ καὶ
  choice: também
  rationale: A combinação dá continuidade ao discurso e acrescenta outro grupo de ouvintes; “também” comunica a força aditiva sem sobrecarregar a frase.
- source_word: τοῖς ὄχλοις
  choice: às multidões
  rationale: Mantém o plural explícito do grego e usa uma forma corrente e digna em português.
- source_word: Ὅταν ἴδητε
  choice: Quando vocês veem
  rationale: Ὅταν com o subjuntivo aoristo expressa uma situação geral recorrente ou contingente. O presente em português comunica com naturalidade esse valor geral.
- source_word: νεφέλην
  choice: uma nuvem
  rationale: O substantivo significa simplesmente “nuvem”; a associação com chuva vem do contexto e não precisa ser acrescentada.
- source_word: ἀνατέλλουσαν
  choice: surgindo
  rationale: O particípio descreve a nuvem aparecendo ou elevando-se no horizonte; “surgindo” é natural no contexto meteorológico.
- source_word: ἐπὶ δυσμῶν
  choice: no oeste
  rationale: A expressão indica o lado ou região do poente. “No oeste” preserva a imagem da observação da nuvem no horizonte, sem impor o sentido direcional “do oeste”.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Reproduz de modo claro a rapidez expressa pelo advérbio.
- source_word: λέγετε
  choice: dizem
  rationale: O presente indica uma reação habitual; o presente simples em português expressa adequadamente essa generalização.
- source_word: ὅτι
  choice: introdução de discurso direto
  rationale: Aqui ὅτι introduz o conteúdo do que é dito; em português, os dois-pontos e as aspas fazem isso de forma idiomática.
- source_word: Ὄμβρος
  choice: chuva forte
  rationale: ὄμβρος pode designar chuva em geral ou, mais especificamente, chuva intensa ou temporal. “Chuva forte” conserva a possível intensidade sem exigir que se entenda uma tempestade com vento ou trovões.
- source_word: ἔρχεται
  choice: Vem
  rationale: O presente tem sentido iminente. “Vem chuva forte” é uma previsão meteorológica natural e corrente em português.
- source_word: καὶ γίνεται οὕτως
  choice: e assim acontece
  rationale: Tradução direta e idiomática que preserva a confirmação de que a previsão se cumpre.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Emprega “vocês” para tornar explícito o plural dos verbos gregos e mantém um tom narrativo digno e acessível. A formulação meteorológica “Vem chuva forte” busca naturalidade oral sem perder o peso lexical possível de ὄμβρος.
