id: LUK.12.31
reference: Luke 12:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: pt
  text: Mas busquem o reino dele[b][a], e estas coisas serão acrescentadas a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reino de Deus”; o grego diz “o reino dele”, e o contexto indica o referente.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “o reino de Deus” em vez de “o reino dele”.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz o contraste com a busca ansiosa pelas necessidades materiais mencionada antes, de modo conciso e natural.
- source_word: ζητεῖτε
  choice: busquem
  rationale: O imperativo presente aponta para uma orientação contínua; em português, o imperativo simples comunica isso naturalmente no contexto.
- source_word: βασιλείαν
  choice: reino
  rationale: É a tradução consagrada e amplamente compreensível, capaz de abranger tanto o governo quanto o domínio real.
- source_word: αὐτοῦ
  choice: dele
  rationale: Preserva o pronome do texto grego, cujo referente — Deus — é fornecido pelo contexto, sem torná-lo explicitamente nominal no corpo do versículo.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Retoma as necessidades discutidas no contexto. Não se acrescenta “todas”, ausente nesta leitura grega, evitando harmonização com o paralelo de Mateus.
- source_word: προστεθήσεται
  choice: serão acrescentadas
  rationale: Conserva a metáfora de adição e o futuro passivo, sem parafraseá-lo como “serão providenciadas”.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Representa naturalmente o dativo plural e oferece ampla legibilidade no português moderno.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: Manter o pronome em “o reino dele”, entendendo Deus como referente contextual.
  alternative: Explicitar “o reino de Deus”.
  rationale: O contexto identifica claramente Deus como referente, mas a manutenção do pronome preserva a forma da leitura principal e sua ambiguidade gramatical limitada.
- issue: Variante textual em αὐτοῦ
  choice: Traduzir a leitura do SBLGNT, “dele”.
  alternative: Alguns manuscritos trazem “de Deus”.
  rationale: A tradução segue o texto crítico fornecido e registra a variante manuscrita em nota, sem incorporá-la ao corpo do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Busquem” e “a vocês” evitam regionalismos excessivos; “o reino dele” preserva deliberadamente o pronome grego. Os marcadores seguem a ordem apresentada no texto de consulta.
