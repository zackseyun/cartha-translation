source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: pt
  text: 'Pois, de agora em diante, haverá cinco numa só casa[a], divididos: três contra dois e dois contra três.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “família” ou “unidade doméstica”. A palavra grega traduzida por “casa” pode referir-se tanto à casa em si quanto à família que vive nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: haverá
  rationale: O futuro de εἰμί introduz a existência de cinco pessoas no mesmo ambiente doméstico; a construção existencial com “haverá” é natural e clara em português.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva o valor explicativo que liga este versículo à declaração anterior sobre divisão.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressão idiomática atual que mantém a perspectiva temporal prospectiva do grego.
- source_word: πέντε
  choice: cinco
  rationale: Numeral direto, entendido no contexto como cinco pessoas.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: numa só casa
  rationale: Mantém a imagem concreta de οἶκος e a ênfase de ἑνί na unidade da casa, sem excluir o sentido de núcleo familiar.
- source_word: διαμεμερισμένοι
  choice: divididos
  rationale: O particípio perfeito passivo descreve um estado resultante de divisão; “divididos” expressa naturalmente a ruptura relacional neste contexto.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: três contra dois
  rationale: ἐπί com dativo indica aqui oposição; “contra” comunica de modo conciso e moderno essa relação adversativa.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: e dois contra três
  rationale: Mantém o paralelismo e a simetria adversativa da frase grega.
theological_decisions:
- issue: Se οἶκος deve ser traduzido concretamente como “casa” ou interpretativamente como “família”/“lar” no contexto da divisão familiar
  choice: casa
  alternative: família; lar
  rationale: O versículo seguinte explicita relações familiares, mas οἶκος conserva aqui sua imagem concreta e também pode designar a unidade doméstica. A tradução principal mantém “casa”, enquanto a nota registra a amplitude semântica para não resolver em excesso a nuance.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Numa só casa” preserva a unidade enfatizada no grego; a ordem e o paralelismo da frase foram mantidos sem produzir uma construção artificial.
