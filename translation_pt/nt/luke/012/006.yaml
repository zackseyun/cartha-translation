id: LUK.12.6
reference: Luke 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: pt
  text: Não se vendem cinco pardais por dois asses? Contudo, nenhum deles está esquecido diante de Deus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por duas pequenas moedas de cobre”. O grego diz literalmente “dois asses”; o asse era uma moeda romana de cobre de baixo valor.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “nenhum deles passa despercebido aos olhos de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: pardais
  rationale: Embora o termo possa designar pequenos pássaros em geral, “pardais” é a referência mais provável neste contexto e é natural em português.
- source_word: πωλοῦνται
  choice: se vendem
  rationale: A construção com “se” expressa de modo idiomático em português o sentido passivo do presente grego.
- source_word: ἀσσαρίων δύο
  choice: por dois asses
  rationale: Preserva o nome da antiga moeda romana, sem substituí-la por um valor moderno inexato; a nota explica o termo.
- source_word: ἐπιλελησμένον
  choice: está esquecido
  rationale: O particípio perfeito indica o estado de ter sido esquecido; esta tradução mantém tanto o aspecto resultante quanto o sentido lexical básico.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Equivalente direto, natural e digno, que conserva a ideia de estar na presença ou à vista de Deus.
- source_word: οὐχὶ ... ;
  choice: Não se vendem ...?
  rationale: A pergunta retórica com οὐχί espera resposta afirmativa, força bem reproduzida por esta formulação portuguesa.
- source_word: καὶ ἓν ἐξ αὐτῶν οὐκ
  choice: Contudo, nenhum deles
  rationale: “Contudo” torna claro o contraste contextual, enquanto “nenhum deles” expressa naturalmente que nem sequer um dos cinco fica esquecido.
theological_decisions:
- issue: Linguagem sobre a lembrança e o cuidado de Deus
  choice: nenhum deles está esquecido diante de Deus
  alternative: nenhum deles passa despercebido aos olhos de Deus
  rationale: “Esquecido” permanece próximo do sentido lexical e afirma a atenção divina sem desenvolver além do texto uma doutrina mais ampla da providência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se o nome antigo da moeda no texto, explicado em nota, e mantém-se a formulação concreta “esquecido diante de Deus” sem explicitação doutrinária adicional.
