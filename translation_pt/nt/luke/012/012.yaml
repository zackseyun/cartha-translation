  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: pt
  text: pois o Espírito Santo ensinará a vocês, naquela mesma hora, o que devem dizer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “naquela hora”. A expressão grega enfatiza o momento exato da necessidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: pois
  rationale: Preserva a função explicativa que liga o versículo à garantia anterior e soa natural em português.
- source_word: τὸ ἅγιον πνεῦμα
  choice: o Espírito Santo
  rationale: É a forma contemporânea consagrada para a expressão grega e mantém o Espírito como agente definido da ação.
- source_word: διδάξει
  choice: ensinará
  rationale: Reproduz diretamente o futuro ativo de διδάσκω e a promessa de orientação futura.
- source_word: ὑμᾶς
  choice: a vocês
  rationale: Marca de modo claro e amplamente compreensível o objeto na segunda pessoa do plural.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: naquela mesma hora
  rationale: A expressão conserva tanto a referência temporal quanto a ênfase de αὐτῇ no momento preciso da necessidade.
- source_word: ἃ
  choice: o que
  rationale: É a forma idiomática em português para introduzir o conteúdo que será dito.
- source_word: δεῖ
  choice: devem
  rationale: Expressa a necessidade ou obrigação indicada pelo verbo impessoal grego, concordando naturalmente com o destinatário plural.
- source_word: εἰπεῖν
  choice: dizer
  rationale: É o equivalente mais natural neste contexto de resposta verbal diante de autoridades.
theological_decisions:
- issue: Referência a “o Espírito Santo”
  choice: Agente divino pessoal que ensinará ativamente os discípulos
  alternative: Influência ou inspiração divina impessoal
  rationale: O texto faz do Espírito Santo o sujeito definido do verbo ativo “ensinará”, favorecendo a leitura de agência pessoal sem acrescentar formulações doutrinárias posteriores ao versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “A vocês” explicita o plural grego sem recorrer a regionalismos; “naquela mesma hora” preserva a ênfase temporal.
