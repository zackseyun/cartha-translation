id: LUK.12.20
reference: Luke 12:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: pt
  text: 'Mas Deus lhe disse: “Insensato! Nesta mesma noite, exigirão de você a sua vida[a]. E aquilo que você preparou, de quem será?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua alma”. A palavra grega pode significar “vida” ou “alma”, conforme o contexto.
    reason: Alternativa lexical que preserva a amplitude semântica de ψυχή.
lexical_decisions:
- source_word: Ἄφρων
  choice: Insensato
  rationale: O adjetivo no vocativo expressa uma repreensão direta e forte. “Insensato” comunica falta de juízo moral e prático de modo natural e digno, sem acrescentar um pronome ausente do grego.
- source_word: ταύτῃ τῇ νυκτί
  choice: Nesta mesma noite
  rationale: A expressão temporal com demonstrativo enfatiza a proximidade e a urgência; “nesta mesma noite” reproduz essa ênfase em português corrente.
- source_word: ψυχήν
  choice: vida
  rationale: Neste contexto de morte iminente, ψυχή designa sobretudo a vida do homem. A alternativa tradicional “alma” é preservada em nota para manter a amplitude semântica do termo.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: exigirão de você
  rationale: A terceira pessoa do plural sem agente expresso pode funcionar de modo indeterminado. Esta construção portuguesa preserva o agente não identificado, a força de exigência e o sentido futuro dado pelo contexto, sem inserir explicitamente “de volta”.
- source_word: ἃ δὲ ἡτοίμασας
  choice: aquilo que você preparou
  rationale: A formulação trata coletivamente os bens acumulados e permanece clara e próxima da expressão grega.
- source_word: τίνι ἔσται
  choice: de quem será?
  rationale: O dativo interrogativo pode indicar posse ou destinação. “De quem será?” é conciso, idiomático e conserva a força retórica da pergunta.
theological_decisions:
- issue: Sentido de ψυχή no contexto da morte
  choice: vida
  alternative: alma
  rationale: “Vida” se ajusta à morte iminente do homem sem impor uma definição antropológica mais estreita. “Alma” permanece em nota como alternativa lexical legítima.
- issue: Agente não expresso de ἀπαιτοῦσιν
  choice: 'construção indeterminada na terceira pessoa do plural: “exigirão”'
  alternative: 'passiva: “a sua vida será exigida”'
  rationale: A forma escolhida preserva o plural verbal e não identifica se os agentes são Deus, anjos ou outros executores, evitando resolver uma ambiguidade real do texto.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A fala mantém força e dignidade, sem arcaísmos. A pontuação destaca a repreensão e a pergunta retórica.
