  naturalness: «Pois onde está o tesouro de vocês, aí também estará o coração de vocês» é claro, natural e de registro digno no português moderno de ampla compreensão. A retirada da vírgula depois de «Pois» melhora a fluidez.
  terminology: «Tesouro» e «coração» são escolhas diretas, biblicamente contínuas e semanticamente amplas. «De vocês» comunica explicitamente o plural sem recorrer a uma forma regional ou excessivamente formal.
