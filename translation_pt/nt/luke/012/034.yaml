  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: pt
  text: Pois onde está o tesouro de vocês, aí também estará o coração de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois onde quer que esteja o tesouro de vocês, ali também estará o coração de vocês.»'
    reason: Alternativa lexical para ὅπου («onde quer que») e alternativa estilística correlata para ἐκεῖ («ali»).
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Introduz de modo direto a oração de lugar e preserva a estrutura proverbial correlativa com ἐκεῖ, «onde... aí...».
- source_word: γάρ
  choice: pois
  rationale: Mantém a função explicativa que liga a afirmação à instrução anterior, em linguagem portuguesa natural e digna.
- source_word: θησαυρός
  choice: tesouro
  rationale: É a correspondência direta e idiomática, preservando tanto a referência à riqueza quanto a força metafórica daquilo a que se atribui valor.
- source_word: καρδία
  choice: coração
  rationale: Conserva o termo antropológico bíblico para o centro dos afetos, desejos e compromissos, sem reduzi-lo a apenas uma faculdade psicológica.
- source_word: ἐκεῖ
  choice: aí
  rationale: Preserva a correlação espacial «onde... aí...»; «aí» retoma naturalmente em português o lugar já mencionado.
- source_word: καὶ
  choice: também
  rationale: 'Expressa o valor aditivo: o coração acompanha o tesouro.'
- source_word: ἔσται
  choice: estará
  rationale: Preserva o futuro explícito do grego, que pode comunicar tanto resultado futuro quanto certeza proverbial.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Torna explícito o plural da segunda pessoa nas duas ocorrências e oferece ampla legibilidade brasileira sem recorrer ao regional «vosso».
theological_decisions:
- issue: Sentido antropológico de «coração»
  choice: Manter «coração» como o centro figurado dos afetos, desejos e compromissos da pessoa.
  alternative: Traduzir de forma interpretativa como «desejos», «mente» ou «interior».
  rationale: A formulação proverbial trata da orientação interior da pessoa em relação ao que ela valoriza. «Coração» preserva a amplitude teológica e literária do termo sem estreitar seu sentido.
- issue: Valor do futuro ἔσται
  choice: Traduzir pelo futuro «estará».
  alternative: 'Naturalizar como presente gnômico: «está».'
  rationale: O grego traz futuro explícito. Mantê-lo preserva a forma da afirmação e sua ideia de consequência ou certeza, sem excluir o caráter proverbial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «De vocês» conserva o plural do grego; «onde... aí...» reproduz a estrutura correlativa sem soar excessivamente formal.
