  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: pt
  text: Vocês também estejam prontos[a], porque o Filho do Homem[c] vem numa hora em que vocês não esperam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês também devem estar prontos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “numa hora em que vocês não pensam” ou “quando vocês não estiverem esperando”.'
    reason: lexical_alternative
  - marker: c
    text: Em grego, literalmente, “o Filho do Homem”, título que Jesus usa para si mesmo, provavelmente evocando Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Vocês também
  rationale: 'Preserva a inclusão e a ênfase: os ouvintes, assim como os servos da ilustração anterior, também recebem a advertência.'
- source_word: γίνεσθε ἕτοιμοι
  choice: estejam prontos
  rationale: Expressa de modo natural a força imperativa e a postura contínua de prontidão indicada pelo imperativo presente.
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão para a ordem de estar pronto.
- source_word: ᾗ ὥρᾳ
  choice: numa hora em que
  rationale: A formulação indefinida destaca que o momento é desconhecido e inesperado, sem sugerir uma hora específica já identificada.
- source_word: οὐ δοκεῖτε
  choice: vocês não esperam
  rationale: No contexto de vigilância, 'não esperam' comunica naturalmente o sentido prático de não pensar ou supor que o acontecimento ocorrerá naquele momento.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma tradicional e transparente do título, bem como suas ressonâncias messiânicas e apocalípticas.
- source_word: ἔρχεται
  choice: vem
  rationale: Conserva o presente grego com sentido futuro e sua vivacidade, sendo ao mesmo tempo idiomático em português.
theological_decisions:
- issue: Tradução do título cristológico ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  alternative: o Humano
  rationale: A tradução literal tradicional preserva a função do título como autodesignação de Jesus e sua provável ligação com Daniel 7:13–14, sem acrescentar uma interpretação doutrinária além do texto.
- issue: Força temporal de ἔρχεται nesta declaração escatológica
  choice: vem
  alternative: virá
  rationale: O presente grego pode ter referência futura. 'Vem' preserva a forma vívida e o tom de urgência sem definir um sistema escatológico específico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural 'vocês' torna explícito o referente plural de ὑμεῖς; 'estejam prontos' evita rigidez excessiva e mantém a força da ordem.
