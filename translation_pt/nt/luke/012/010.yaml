id: LUK.12.10
reference: Luke 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: pt
  text: E todo aquele que disser uma palavra contra o Filho do Homem, isso lhe será perdoado; mas quem blasfemar contra o Espírito Santo não será perdoado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὃς
  choice: todo aquele que
  rationale: Expressa de modo natural em português o sentido distributivo e genérico da construção grega, preservando seu alcance universal.
- source_word: ἐρεῖ λόγον
  choice: disser uma palavra
  rationale: Mantém o substantivo λόγον e reproduz com clareza a expressão grega, sem tornar a frase excessivamente literal.
- source_word: εἰς
  choice: contra
  rationale: No contexto de fala hostil e blasfêmia, indica oposição, não simples direção.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: É a forma consagrada e precisa do título, preservando seu pano de fundo semítico e sua força cristológica.
- source_word: ἀφεθήσεται αὐτῷ
  choice: isso lhe será perdoado
  rationale: Preserva a construção passiva e o dativo αὐτῷ; “isso” explicita apenas o referente implícito — a palavra ou ofensa mencionada — sem alterar o sentido.
- source_word: τῷ ... βλασφημήσαντι
  choice: quem blasfemar
  rationale: O particípio substantivado identifica genericamente a pessoa que pratica o ato. O futuro do subjuntivo é idiomático em português e evita impor ao aoristo uma nuance temporal de ato já concluído.
- source_word: τὸ ἅγιον πνεῦμα
  choice: o Espírito Santo
  rationale: Forma padrão no português contemporâneo para a expressão grega.
- source_word: οὐκ ἀφεθήσεται
  choice: não será perdoado
  rationale: Reproduz diretamente a negação e o futuro passivo, mantendo toda a severidade da declaração.
theological_decisions:
- issue: Contraste entre falar contra o Filho do Homem e blasfemar contra o Espírito Santo
  choice: Manter a distinção textual e a diferença declarada quanto ao perdão, sem definir na tradução a natureza da blasfêmia contra o Espírito Santo.
  alternative: Explicar a primeira ação como ignorância menor e a segunda como impenitência definitiva, ou ampliar o texto com base nas passagens paralelas.
  rationale: O versículo estabelece o contraste, mas não explica aqui seu mecanismo teológico. A tradução deve preservar essa tensão sem inserir uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “isso lhe será perdoado” conserva uma característica sintática relevante do grego e continua natural em português; o ponto e vírgula ressalta o contraste entre as duas orações.
