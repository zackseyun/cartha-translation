source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: pt
  text: Mas até os cabelos da cabeça de vocês estão todos contados. Não tenham medo; vocês valem mais do que muitos pardais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês são mais valiosos do que muitos pardais”.'
    reason: Alternativa lexical para διαφέρετε que preserva a mesma comparação de valor.
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mas até
  rationale: Preserva tanto o contraste introduzido por ἀλλά como a ênfase de καί, ligando a afirmação à garantia dada no contexto anterior.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: os cabelos da cabeça de vocês ... todos
  rationale: Mantém a imagem concreta e expressa a totalidade indicada por πᾶσαι em ordem natural no português atual.
- source_word: ἠρίθμηνται
  choice: estão ... contados
  rationale: O perfeito passivo descreve uma contagem realizada cujo resultado permanece; “estão contados” comunica de modo natural esse estado presente.
- source_word: μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: É uma forma direta, idiomática e amplamente compreensível do imperativo negativo plural.
- source_word: πολλῶν στρουθίων
  choice: muitos pardais
  rationale: Identifica as mesmas aves pequenas mencionadas no contexto imediato e preserva a continuidade da imagem.
- source_word: διαφέρετε
  choice: vocês valem mais do que
  rationale: No contexto, o verbo indica superioridade comparativa de valor, não apenas diferença; esta formulação é clara e natural.
theological_decisions:
- issue: Comparação entre o valor dos discípulos e o de muitos pardais
  choice: vocês valem mais do que muitos pardais
  alternative: vocês são mais valiosos do que muitos pardais
  rationale: A formulação conserva o argumento do menor para o maior acerca do cuidado atento de Deus, sem ampliar a afirmação para além da comparação expressa no texto.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com “vocês” para o plural. “Não tenham medo” soa mais natural no uso corrente do que “não temam”, sem enfraquecer o imperativo.
