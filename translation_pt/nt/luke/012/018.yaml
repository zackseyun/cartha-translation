base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: pt
  text: 'Então ele disse: “É isto que farei: derrubarei os meus celeiros e construirei outros maiores[a]. Ali reunirei todo o meu cereal[b] e os meus bens[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depósitos” em vez de “celeiros” (ἀποθήκας).
    reason: lexical_alternative
  - marker: b
    text: “Cereal” (σῖτος) pode significar mais especificamente “trigo” em alguns contextos.
    reason: lexical_alternative
  - marker: c
    text: Ou “minhas posses” em vez de “meus bens” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Já sei o que vou fazer
  rationale: Expressão natural em português para a decisão que o personagem acaba de formular; preserva o caráter enfático e prospectivo da frase.
- source_word: καθελῶ
  choice: derrubarei
  rationale: Comunica de modo concreto e corrente a demolição das estruturas existentes.
- source_word: ἀποθήκας
  choice: celeiros
  rationale: No contexto agrícola, designa naturalmente construções destinadas a armazenar a colheita, embora o grego possa ter o sentido mais amplo de depósitos.
- source_word: μείζονας οἰκοδομήσω
  choice: construirei outros maiores
  rationale: Explicita naturalmente em português que novos celeiros, maiores que os anteriores, serão construídos.
- source_word: συνάξω ἐκεῖ
  choice: Ali reunirei
  rationale: Mantém o sentido básico de juntar em determinado lugar sem acrescentar a ideia mais interpretativa de acumular.
- source_word: πάντα τὸν σῖτον
  choice: todo o meu cereal
  rationale: σῖτος designa cereal ou grão e, em certos contextos, especificamente trigo. O possessivo é natural no discurso e se harmoniza com 'meus bens'.
- source_word: τὰ ἀγαθά μου
  choice: os meus bens
  rationale: Preserva a referência ampla às posses materiais, sem restringi-la a dinheiro ou riqueza monetária.
