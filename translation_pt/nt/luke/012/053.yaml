  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: pt
  text: 'Ficarão divididos[a]: pai contra filho e filho contra pai, mãe contra filha e filha contra mãe, sogra contra sua nora[b] e nora contra a sogra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Serão divididos”. O verbo grego destaca a divisão que surge dentro de um grupo ou de uma família.'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega também pode significar “noiva” em outros contextos; aqui, a correspondência com “sogra” indica o sentido de “nora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: ficarão divididos
  rationale: O futuro passivo introduz o estado de divisão que se manifesta nas oposições familiares seguintes. A formulação preserva o sentido resultativo sem explicitar uma causa não declarada no versículo.
- source_word: ἐπὶ
  choice: contra
  rationale: Na construção repetida com pessoas, a preposição expressa oposição; “contra” é a forma portuguesa mais direta e natural.
- source_word: πατήρ / υἱός
  choice: pai / filho
  rationale: Mantém os termos específicos de parentesco e a reciprocidade da primeira dupla.
- source_word: μήτηρ / θυγάτηρ
  choice: mãe / filha
  rationale: Mantém os termos específicos de parentesco e a reciprocidade da segunda dupla.
- source_word: πενθερά
  choice: sogra
  rationale: Equivalente contemporâneo e inequívoco do termo grego de parentesco neste contexto.
- source_word: νύμφη
  choice: nora
  rationale: Embora possa significar “noiva” em outros contextos, a oposição recíproca com πενθερά exige aqui o sentido de “nora”.
- source_word: αὐτῆς
  choice: sua
  rationale: O possessivo explícito na primeira menção de νύμφη é preservado em “sua nora”; na oração recíproca final, o grego não repete o pronome.
theological_decisions:
- issue: Natureza da divisão descrita
  choice: Descrição direta de conflito familiar decorrente da missão de Jesus no contexto anterior
  alternative: Um provérbio genérico sobre tensões familiares ou uma aprovação da hostilidade entre parentes
  rationale: A tradução conserva a linguagem severa e recíproca do texto, sem suavizar o conflito nem acrescentar a ideia de que ele seja moralmente aprovado.
translation_notes:
  register: Português moderno, claro e digno, com construções de parentesco naturais tanto no Brasil quanto em outras variedades. A sequência repetitiva foi mantida para preservar o paralelismo enfático do grego.
