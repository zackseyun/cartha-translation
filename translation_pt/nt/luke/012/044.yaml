id: LUK.12.44
reference: Luke 12:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: pt
  text: 'Em verdade lhes digo: ele o encarregará de tudo o que possui.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de todos os seus bens» ou «de todas as suas propriedades».'
    reason: Alternativas lexicais para πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ.
lexical_decisions:
- source_word: ἀληθῶς
  choice: Em verdade
  rationale: Reproduz a ênfase solene na veracidade da declaração e é uma fórmula natural e digna na fala de Jesus.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa de modo corrente a fórmula de discurso e preserva o destinatário plural.
- source_word: ὅτι
  choice: ':'
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo da declaração após a fórmula «Em verdade lhes digo», sem necessidade de explicitar «que».
- source_word: ἐπὶ
  choice: de
  rationale: Integrado à construção «encarregar de», comunica a esfera de responsabilidade ou autoridade expressa por ἐπί com dativo.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: tudo o que possui
  rationale: Formulação abrangente e idiomática que inclui todos os bens pertencentes ao senhor sem restringi-los a uma categoria específica.
- source_word: καταστήσει
  choice: encarregará
  rationale: No contexto, καθίστημι significa colocar ou nomear alguém para exercer responsabilidade; «encarregará» torna essa função clara e natural.
- source_word: αὐτόν
  choice: o
  rationale: Mantém o objeto masculino singular, retomando o personagem masculino da parábola.
theological_decisions:
- issue: Pronome masculino em contexto parabólico
  choice: Manter «ele» e «o»
  alternative: Empregar uma formulação neutra, como «essa pessoa»
  rationale: As formas gregas são masculinas singulares e retomam os personagens masculinos da parábola; preservá-las evita neutralizar um dado explícito do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Em verdade» preserva o tom enfático; «encarregará» comunica naturalmente a nomeação para uma posição de responsabilidade.
