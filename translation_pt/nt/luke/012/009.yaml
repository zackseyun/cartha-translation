  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: pt
  text: Mas aquele que me negar diante das pessoas será negado diante dos anjos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «será renegado» ou «será repudiado». O verbo grego é uma forma cognata mais forte do verbo traduzido por «negar»; o texto principal conserva o paralelo: «negar... será negado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός
  choice: Mas aquele que negar
  rationale: O artigo com o particípio aoristo substantivado designa genericamente «aquele que negar». O futuro do subjuntivo é natural em português para essa condição geral, e «negar» preserva a correspondência verbal com o passivo seguinte.
- source_word: με
  choice: me
  rationale: Mantém explicitamente o pronome que tem Jesus como referente.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressão corrente e digna que conserva a ideia de presença e testemunho público.
- source_word: τῶν ἀνθρώπων
  choice: das pessoas
  rationale: Aqui ἄνθρωποι se refere aos seres humanos em geral, em contraste com os anjos; «pessoas» comunica isso com naturalidade e sem sugerir apenas indivíduos do sexo masculino.
- source_word: ἀπαρνηθήσεται
  choice: será negado
  rationale: Mantém a forma passiva e o paralelo solene «negar ... será negado». O verbo grego é um cognato prefixado e pode ter a nuance de repudiar ou renegar, registrada em nota.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: dos anjos de Deus
  rationale: Reprodução direta do genitivo grego, preservando a referência ao cenário celestial.
- source_word: δὲ
  choice: Mas
  rationale: Assinala o contraste com a declaração positiva do versículo anterior.
theological_decisions:
- issue: Identidade do agente implícito em «será negado»
  choice: Manter a construção passiva sem acrescentar o agente.
  alternative: Explicitar «pelo Filho do Homem» ou «por Deus».
  rationale: O grego não nomeia o agente. Embora o contexto permita inferências, explicitá-lo resolveria uma tensão que o próprio versículo deixa em aberto.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. «Pessoas» expressa naturalmente o sentido humano genérico de ἄνθρωποι; a sintaxe passiva preserva a ambiguidade do agente presente no original.
