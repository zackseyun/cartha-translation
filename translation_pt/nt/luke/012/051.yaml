id: LUK.12.51
reference: Luke 12:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: pt
  text: Vocês pensam que vim trazer paz à terra? Não, eu lhes digo, mas sim divisão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: Vocês pensam
  rationale: Expressa naturalmente em português a pergunta retórica dirigida a várias pessoas, preservando o desafio direto.
- source_word: εἰρήνην
  choice: paz
  rationale: É o equivalente amplo e usual, capaz de abranger aqui paz e harmonia nas relações sem restringir o sentido à tranquilidade interior.
- source_word: παρεγενόμην
  choice: vim
  rationale: O aoristo de παραγίνομαι, seguido de infinitivo de finalidade, refere-se à vinda de Jesus; “vim” é direto e idiomático.
- source_word: δοῦναι
  choice: trazer
  rationale: Embora o verbo signifique literalmente “dar”, em português “trazer paz à terra” é a combinação idiomática natural e comunica com precisão a finalidade da vinda.
- source_word: ἐν τῇ γῇ
  choice: à terra
  rationale: γῆ pode significar “terra” ou “região”; neste contexto, o alcance mais amplo é mais provável. Com “trazer”, a construção portuguesa natural é “trazer paz à terra”.
- source_word: οὐχί
  choice: Não
  rationale: Mantém a resposta negativa forte, concisa e enfática.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Fórmula discursiva natural em português, com o pronome “eu” preservando a ênfase do contraste.
- source_word: ἀλλ’ ἢ
  choice: mas sim
  rationale: 'Marca com clareza o contraste enfático: não paz, e sim divisão.'
- source_word: διαμερισμόν
  choice: divisão
  rationale: Equivalente direto que preserva a amplitude do termo e antecipa adequadamente a divisão familiar descrita nos versículos seguintes.
theological_decisions:
- issue: Se a afirmação de Jesus deve ser suavizada para evitar tensão com passagens sobre paz
  choice: Manter o contraste incisivo entre paz e divisão.
  alternative: Explicitar “conflito” ou apresentar a divisão apenas como efeito acidental.
  rationale: O grego formula deliberadamente uma negação forte seguida de contraste. O contexto explica a divisão entre pessoas e famílias, mas o versículo não deve ser harmonizado nem suavizado na própria tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” sinaliza de modo natural o plural de δοκεῖτε e ὑμῖν. A formulação é enxuta e preserva a força retórica do original.
