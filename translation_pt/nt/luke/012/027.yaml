  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: pt
  text: 'Considerem os lírios[a], como crescem: não trabalham nem fiam. Contudo, eu lhes digo: nem mesmo Salomão, em toda a sua glória[b], se vestiu como um deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as flores silvestres” ou “as flores”; o grego diz especificamente “lírios”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com todo o seu esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Observem
  rationale: O imperativo pede observação atenta e reflexão. “Observem” é natural, direto e mantém a ideia de considerar cuidadosamente.
- source_word: τὰ κρίνα
  choice: os lírios
  rationale: κρίνα designa especificamente lírios, embora possa evocar de modo mais amplo as flores silvestres do campo; a tradução preserva o termo específico do grego.
- source_word: πῶς αὐξάνει
  choice: como crescem
  rationale: Embora o grego use verbo singular com sujeito neutro plural, o português exige concordância idiomática no plural.
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: não trabalham nem fiam
  rationale: κοπιάω indica trabalhar arduamente, e νήθω significa fiar fibras ou linha. A formulação é concisa e conserva o contraste com a produção humana de roupas.
- source_word: λέγω δὲ ὑμῖν
  choice: Contudo, eu lhes digo
  rationale: δὲ introduz uma transição levemente contrastiva; “contudo” expressa o movimento retórico sem exagerá-lo.
- source_word: οὐδὲ Σολομὼν
  choice: nem mesmo Salomão
  rationale: 'οὐδέ confere ênfase: nem sequer o rei proverbialmente esplendoroso alcançou aparência comparável.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: em toda a sua glória
  rationale: δόξα se refere aqui à magnificência régia. “Glória” é compreensível, preserva a ressonância bíblica e não elimina a alternativa contextual “esplendor”.
- source_word: περιεβάλετο
  choice: se vestiu
  rationale: A forma média pode ser expressa naturalmente em português como “se vestiu”, preservando a imagem da roupa sem explicitar indevidamente quem a forneceu.
- source_word: ὡς ἓν τούτων
  choice: como um deles
  rationale: A comparação remete claramente a um dos lírios; o masculino concorda em português com “lírios”.
theological_decisions:
- issue: Referência da imagem floral
  choice: Manter “lírios” no texto principal.
  alternative: “flores” ou “flores silvestres”
  rationale: O grego traz κρίνα especificamente. A nota reconhece a possível extensão referencial sem generalizar silenciosamente o texto.
- issue: Sentido de δόξα na descrição de Salomão
  choice: Traduzir por “glória”.
  alternative: “esplendor”
  rationale: No contexto, o termo denota magnificência régia, mas “glória” continua natural e conserva a amplitude lexical e a ressonância bíblica.
- issue: Voz de περιεβάλετο
  choice: Traduzir por “se vestiu”.
  alternative: “foi vestido” ou “esteve vestido”
  rationale: A forma pode ser entendida como média ou passiva; “se vestiu” é idiomático e mantém a comparação centrada no modo de vestir, sem construir uma afirmação doutrinária sobre agência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O plural “lhes” evita regionalismo excessivo; “fiam” preserva de modo conciso a atividade têxtil antiga. Todos os marcadores de nota aparecem no texto principal.
