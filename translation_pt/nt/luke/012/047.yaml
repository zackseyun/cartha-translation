reference: Luke 12:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that slave[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: pt
  text: Mas aquele escravo que conhecia a vontade do seu senhor e não se preparou ou não agiu de acordo com a vontade dele receberá muitos golpes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “será golpeado muitas vezes” ou “receberá muitas pancadas”. O substantivo está implícito no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: O termo designa uma pessoa submetida à autoridade de um senhor, não um empregado contratado. No contexto da parábola, “escravo” preserva claramente essa relação social.
- source_word: γνοὺς
  choice: que conhecia
  rationale: O particípio aoristo indica que o escravo tinha conhecimento prévio da vontade do senhor; a oração relativa é natural em português.
- source_word: θέλημα
  choice: vontade
  rationale: “Vontade” expressa adequadamente a intenção ou determinação do senhor e mantém a repetição do grego.
- source_word: κυρίου αὐτοῦ
  choice: do seu senhor
  rationale: No cenário doméstico da parábola, κύριος indica o senhor do escravo. A minúscula evita transformar diretamente a palavra em título divino, sem eliminar a referência mais ampla da parábola.
- source_word: μὴ ἑτοιμάσας
  choice: não se preparou
  rationale: O grego não explicita um objeto. A forma pronominal preserva essa abertura e soa natural em português.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: nem agiu de acordo com a vontade dele
  rationale: Em uma construção negativa coordenada, “nem” comunica naturalmente a segunda omissão. “Agiu de acordo com” transmite o sentido de ποιέω com πρός sem acrescentar uma ação específica.
- source_word: δαρήσεται πολλάς
  choice: receberá muitos golpes
  rationale: O futuro passivo descreve um castigo físico, e πολλάς contém um substantivo feminino plural subentendido, provavelmente “pancadas” ou “chicotadas”. “Receberá muitos golpes” conserva a imagem concreta sem especificar o instrumento.
theological_decisions:
- issue: Sentido de κύριος no contexto parabólico
  choice: senhor
  alternative: Senhor; dono
  rationale: A palavra designa o superior do escravo dentro da narrativa. “Senhor” preserva a relação social e a possível ressonância teológica sem impor no próprio enunciado um título divino grafado com maiúscula.
- issue: Construção elíptica δαρήσεται πολλάς
  choice: receberá muitos golpes
  alternative: será muito castigado; receberá muitas chicotadas
  rationale: O grego deixa o substantivo implícito. A tradução explicita “golpes” para a clareza em português, mantendo a multiplicidade e a concretude do castigo, mas sem determinar que se trate especificamente de chicotadas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “vontade” acompanha o texto grego; “dele” evita a possível ambiguidade de um segundo “sua”. O marcador de nota aparece após a expressão a que se refere.
