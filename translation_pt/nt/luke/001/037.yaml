source:
  edition: SBLGNT
  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: pt
  text: Pois nenhuma palavra vinda de Deus será impossível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois nada será impossível para Deus.”'
    reason: Leitura alternativa tradicional e gramaticalmente possível de παρὰ τοῦ θεοῦ πᾶν ῥῆμα.
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: A conjunção introduz a razão que fundamenta a afirmação anterior de Gabriel; “Pois” preserva essa força explicativa de modo natural em português.
- source_word: οὐκ ἀδυνατήσει
  choice: será impossível
  rationale: O futuro de ἀδυνατέω expressa impossibilidade ou incapacidade. “Será impossível” reproduz diretamente o sentido e combina naturalmente com “nenhuma palavra”.
- source_word: παρὰ τοῦ θεοῦ
  choice: vinda de Deus
  rationale: παρά com genitivo pode indicar origem. Ligada a ῥῆμα, a expressão aponta naturalmente para uma palavra que procede de Deus; “vinda de Deus” torna essa relação clara sem eliminar a leitura tradicional alternativa.
- source_word: πᾶν
  choice: nenhuma
  rationale: Embora πᾶν signifique formalmente “toda”, a combinação com a negação verbal é expressa idiomaticamente em português por “nenhuma ... será impossível”, preservando o alcance universal.
- source_word: ῥῆμα
  choice: palavra
  rationale: ῥῆμα pode significar palavra, declaração ou assunto. “Palavra” mantém o elemento explícito do grego e, no contexto, remete ao anúncio divino sem restringi-lo interpretativamente a “promessa”.
theological_decisions:
- issue: Sentido de παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: O versículo afirma que nenhuma palavra vinda de Deus será impossível.
  alternative: Pois nada será impossível para Deus.
  rationale: As duas leituras são gramaticalmente defensáveis. O texto principal conserva ῥῆμα como “palavra” e entende παρά com genitivo como origem, em harmonia com o anúncio de Gabriel. A formulação tradicional, centrada na capacidade de Deus, fica na nota para preservar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Vinda de Deus” explicita a relação de origem sem recorrer a linguagem excessivamente técnica.
