id: LUK.1.28
reference: Luke 1:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: pt
  text: 'Ao entrar, ele lhe disse: “Saudações[a], agraciada[b]! O Senhor está com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Alegre-se”; tradicionalmente, “Salve”. A palavra grega funciona aqui como saudação, embora formalmente seja um imperativo com o sentido de “alegre-se”.
    reason: lexical_alternative
  - marker: b
    text: Ou “muito favorecida” ou “aquela que recebeu graça”; tradicionalmente, “cheia de graça”. O grego indica alguém que recebeu graça ou favor.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: Ao entrar, ele lhe disse
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à fala. “Ao entrar” preserva o movimento sem acrescentar um local não expresso; o pronome oblíquo em “lhe disse” comunica naturalmente que ele se dirigiu a ela.
- source_word: Χαῖρε
  choice: Saudações
  rationale: Embora seja formalmente um imperativo de χαίρω, “alegrar-se”, aqui funciona como fórmula de saudação. “Saudações” transmite essa função em português atual; o sentido formal e a tradução tradicional são preservados em nota.
- source_word: κεχαριτωμένη
  choice: agraciada
  rationale: O particípio perfeito passivo de χαριτόω descreve alguém que recebeu graça ou favor. “Agraciada” preserva a voz passiva e a força duradoura do favor recebido, sem sugerir que Maria seja a fonte dessa graça.
- source_word: ὁ κύριος
  choice: O Senhor
  rationale: Mantém o título bíblico habitual para Deus e sua continuidade reverente no contexto do anúncio angélico.
- source_word: μετὰ σοῦ
  choice: está com você
  rationale: μετά com o genitivo significa “com”; em português, a cópula precisa ser expressa. “Você” oferece ampla legibilidade brasileira sem alterar o singular do original.
theological_decisions:
- issue: Tradução de κεχαριτωμένη em um texto mariológico teologicamente sensível
  choice: agraciada
  alternative: muito favorecida; aquela que recebeu graça; tradicionalmente, cheia de graça
  rationale: 'A escolha segue o valor passivo do particípio grego: Maria recebeu graça ou favor. Assim, preserva a forte afirmação do favor divino sem transformar a expressão em uma formulação doutrinária posterior. As traduções historicamente ou lexicalmente importantes são registradas em nota.'
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade no Brasil. “Saudações” evita o arcaísmo de “Salve”, enquanto as notas preservam tanto o sentido formal de Χαῖρε quanto a tradição de tradução. “Agraciada” é corrente, concisa e mantém a passividade teologicamente relevante do termo grego.
