id: LUK.1.78
reference: Luke 1:78
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: pt
  text: por causa da terna misericórdia de nosso Deus, pela qual o amanhecer[a] que vem do alto nos visitará,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alvorada”; ἀνατολή também pode evocar o título messiânico “o Renovo” no Antigo Testamento grego.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, διά expressa causa ou fundamento. A formulação preserva claramente essa relação causal.
- source_word: σπλάγχνα ἐλέους
  choice: terna misericórdia
  rationale: A expressão significa literalmente as “entranhas da misericórdia” e comunica compaixão profunda e íntima. “Terna misericórdia” conserva essa força afetiva em português natural e digno.
- source_word: θεοῦ ἡμῶν
  choice: de nosso Deus
  rationale: Reproduz diretamente o genitivo possessivo em ordem natural no português.
- source_word: ἐν οἷς
  choice: pela qual
  rationale: Retoma idiomaticamente “misericórdia” e expressa o meio ou fundamento pelo qual ocorre a visita, sem a rigidez de “na qual”.
- source_word: ἐπισκέψεται
  choice: nos visitará
  rationale: Mantém o futuro do verbo e sua imagem bíblica de visitação, permitindo que o contexto comunique a ideia de intervenção salvadora.
- source_word: ἀνατολὴ
  choice: o amanhecer
  rationale: No contexto imediato de luz sobre os que estão nas trevas, o sentido de aurora ou nascer da luz é o mais provável. “Amanhecer” preserva a metáfora e permite sua personificação, sem excluir a possível ressonância messiânica registrada em nota.
- source_word: ἐξ ὕψους
  choice: que vem do alto
  rationale: Expressa naturalmente a origem celestial indicada pelo grego, sem explicitar “céu” além do que o texto diz.
theological_decisions:
- issue: Sentido de ἀνατολή no contexto messiânico
  choice: o amanhecer
  alternative: a alvorada; o Renovo; aquele que se levanta
  rationale: A linguagem de luz no versículo seguinte favorece a imagem do amanhecer. Contudo, o uso de ἀνατολή na Septuaginta pode evocar o título messiânico “Renovo”; essa ressonância é preservada em nota, sem substituir o sentido mais evidente no contexto.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. A estrutura poética e a personificação do amanhecer foram preservadas; a vírgula final mantém a continuidade sintática com Lucas 1:79.
