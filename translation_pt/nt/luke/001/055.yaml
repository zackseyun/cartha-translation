id: LUK.1.55
reference: Luke 1:55
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: pt
  text: conforme falou aos nossos pais[a], a Abraão e à sua descendência[b], para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos nossos antepassados”. O grego diz literalmente “aos nossos pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à sua semente”. O grego emprega um substantivo coletivo singular que pode significar “semente”, “descendência” ou “descendentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: conforme
  rationale: Expressa correspondência com a declaração anterior de modo natural em português, preservando a ideia de que a ação ocorreu de acordo com o que Deus havia dito.
- source_word: ἐλάλησεν
  choice: falou
  rationale: Traduz diretamente o aoristo de λαλέω sem substituí-lo por “prometeu”, interpretação possível no contexto, mas não expressa pelo verbo grego.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: aos nossos pais[a]
  rationale: Mantém a formulação masculina e a ressonância patriarcal e pactual do grego; “antepassados” é uma alternativa natural explicitada em nota.
- source_word: τῷ Ἀβραὰμ
  choice: a Abraão
  rationale: Conserva o dativo como complemento paralelo do verbo “falou”, apresentando Abraão em aposição explicativa a “nossos pais”.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: à sua descendência[b]
  rationale: “Descendência” é um coletivo singular natural em português e preserva melhor que “descendentes” o número gramatical e a amplitude semântica de σπέρμα.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração permanente indicada pela locução grega.
theological_decisions:
- issue: Linguagem masculina de πρὸς τοὺς πατέρας ἡμῶν no contexto da história da aliança
  choice: aos nossos pais
  alternative: aos nossos antepassados
  rationale: O texto grego emprega o masculino plural e evoca os patriarcas de Israel. A tradução principal preserva essa forma, enquanto a nota registra a alternativa inclusiva sem apagar a nuance original.
- issue: Sentido coletivo singular de σπέρματι αὐτοῦ na promessa a Abraão
  choice: à sua descendência
  alternative: à sua semente; aos seus descendentes
  rationale: “Descendência” equilibra naturalidade e correspondência formal, mantendo o coletivo singular e sem decidir se o termo deve ser entendido apenas coletivamente ou com uma possível ressonância individual. “Semente” preserva a imagem lexical e aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a estrutura apositiva do grego e evita transformar “falou” em “prometeu”, preservando a formulação explícita da fonte.
