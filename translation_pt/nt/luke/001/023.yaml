  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: pt
  text: E aconteceu que, quando se completaram os dias do seu serviço[a], ele foi para casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Serviço» refere-se aos deveres sacerdotais designados de Zacarias no templo.
    reason: cultural_note
  - marker: b
    text: 'Ou: «para a sua casa». A palavra grega pode indicar tanto a casa como edifício quanto, em sentido mais amplo, o lar ou a unidade doméstica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual, sem recorrer ao arcaísmo «sucedeu».
- source_word: ὡς
  choice: quando
  rationale: Introduz aqui uma oração temporal; «quando» é a forma mais natural e precisa em português.
- source_word: ἐπλήσθησαν
  choice: se completaram
  rationale: Expressa que os dias designados chegaram ao fim ou ao seu número completo, mantendo a forma verbal sem acrescentar uma interpretação teológica.
- source_word: λειτουργίας
  choice: serviço
  rationale: No contexto, designa o serviço sacerdotal de Zacarias no templo. A formulação concisa mantém o sentido cultual pelo contexto, explicitado em nota.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: Equivalente idiomático e direto para o aoristo de movimento, sem a formalidade desnecessária de «partiu» ou «retirou-se».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: para casa
  rationale: É a expressão portuguesa mais natural para o retorno à própria residência e permite que οἶκος conserve sua possível abrangência de casa, lar ou núcleo doméstico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue a ocorrência dos marcadores no texto. «Para casa» evita uma construção possessiva pouco idiomática, enquanto a nota preserva a amplitude lexical de οἶκος.
