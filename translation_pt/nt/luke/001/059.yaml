  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: pt
  text: E aconteceu que, no oitavo dia, vieram circuncidar o menino e queriam dar-lhe o nome de Zacarias[a], o nome de seu pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estavam chamando-o de Zacarias». O imperfeito grego pode indicar uma tentativa ou uma ação em andamento, o que combina com a correção feita no versículo seguinte.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «pelo nome de seu pai, Zacarias»; isto é, queriam dar ao menino o mesmo nome de seu pai.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual, sem recorrer ao arcaico «sucedeu».
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: no oitavo dia
  rationale: Expressa de modo natural e preciso a indicação temporal do grego.
- source_word: ἦλθον
  choice: vieram
  rationale: Mantém o sujeito plural implícito e indefinido, sem acrescentar quem eram as pessoas.
- source_word: περιτεμεῖν
  choice: circuncidar
  rationale: Traduz diretamente o infinitivo de finalidade.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: É uma tradução natural de παιδίον neste contexto e adequada ao português corrente.
- source_word: ἐκάλουν
  choice: queriam chamá-lo
  rationale: Comunica a ação pretendida ou ainda não consumada sugerida pelo imperfeito e exigida pelo desenvolvimento no versículo seguinte, sem afirmar que o nome foi efetivamente dado.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: como seu pai
  rationale: Expressa de forma idiomática que pretendiam dar ao menino o mesmo nome do pai.
- source_word: Ζαχαρίαν
  choice: Zacarias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «queriam chamá-lo» evita a pouco natural «estavam chamando-o» e preserva a tensão narrativa do imperfeito grego. Todos os marcadores de nota aparecem no texto.
