  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: pt
  text: 'E a mãe dele respondeu: “Não, mas ele será chamado João[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
