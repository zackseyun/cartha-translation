lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: respondeu
  rationale: O particípio aoristo de ἀποκρίνομαι introduz a fala direta; em português corrente, a forma finita “respondeu” é mais natural do que a construção participial “respondendo”.
- source_word: μήτηρ αὐτοῦ
  choice: a mãe dele
  rationale: Forma possessiva natural e clara em português, preservando a referência definida do grego.
- source_word: Οὐχί
  choice: Não!
  rationale: Neste diálogo, οὐχί expressa uma negação enfática. “Não!” transmite de modo direto essa força.
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: A conjunção corrige a proposta anterior sobre o nome da criança; “pelo contrário” explicita adequadamente esse valor adversativo e corretivo.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Preserva a forma futura passiva de καλέω e seu sentido de atribuição de nome, mantendo ao mesmo tempo uma expressão natural em português.
- source_word: Ἰωάννης
  choice: João
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A ênfase da negativa e a força corretiva de ἀλλά foram preservadas.
