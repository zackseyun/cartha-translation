source:
  edition: SBLGNT
  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: pt
  text: para que, libertados da mão dos nossos inimigos[b], o servíssemos[c] sem medo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destemidamente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do poder dos nossos inimigos”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode ser traduzido por “prestássemos culto”, especialmente por se tratar de serviço dirigido a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: sem medo
  rationale: O advérbio significa “sem medo” ou “destemidamente”. “Sem medo” é natural em português e mantém clara sua relação com o ato de servir a Deus.
- source_word: ἐκ χειρὸς
  choice: da mão de
  rationale: A expressão idiomática indica libertação do poder ou controle de alguém. A tradução conserva a imagem bíblica, ainda compreensível em português.
- source_word: ἐχθρῶν
  choice: nossos inimigos
  rationale: Embora o possessivo não esteja explícito no texto grego apresentado, o contexto da profecia fala da libertação do povo de Deus de seus inimigos; “nossos” explicita de modo natural essa referência coletiva implícita.
- source_word: ῥυσθέντας
  choice: libertados
  rationale: O particípio aoristo passivo apresenta a libertação como fundamento anterior ao serviço. “Libertados” preserva a voz passiva e se integra naturalmente à oração.
- source_word: λατρεύειν
  choice: servíssemos
  rationale: O verbo pode designar serviço prestado a Deus, com dimensão de culto. “Servíssemos” mantém o sentido amplo de devoção e obediência, sem restringi-lo ao culto litúrgico.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome dativo se refere a Deus. Em português, o verbo “servir” admite aqui o objeto direto pronominal “o”, produzindo uma formulação natural e digna.
theological_decisions:
- issue: Alcance de λατρεύειν quando dirigido a Deus
  choice: o servíssemos
  alternative: lhe prestássemos culto
  rationale: O termo inclui serviço de caráter cultual, mas pode abranger devoção e obediência de modo mais amplo. “Servíssemos” preserva essa amplitude sem eliminar a possibilidade do sentido de culto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a imagem bíblica “da mão”, enquanto as notas registram alternativas lexicais genuínas. A ordem portuguesa posiciona “sem medo” após o verbo para tornar inequívoco que o advérbio qualifica o serviço prestado a Deus.
