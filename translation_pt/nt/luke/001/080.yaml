  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: pt
  text: A criança continuava crescendo e se fortalecendo em espírito[a], e estava nas regiões desertas[b] até o dia de sua apresentação pública a Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Espírito”. O grego pode indicar força interior ou espiritual em sentido geral, ou, mais especificamente, fortalecimento relacionado ao Espírito Santo.
    reason: alternative_reading
  - marker: b
    text: Ou “no deserto”. O grego está no plural, literalmente “nas regiões desertas” ou “nos lugares ermos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “até o dia de sua manifestação diante de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: a criança
  rationale: Designa João em sua juventude sem exigir uma faixa etária mais específica; “a criança” é amplo, claro e natural.
- source_word: ηὔξανε
  choice: continuava crescendo
  rationale: O imperfeito grego descreve um processo em andamento, preservado por “continuava crescendo”.
- source_word: ἐκραταιοῦτο
  choice: se fortalecendo
  rationale: Expressa desenvolvimento contínuo e não determina indevidamente se a forma deve ser entendida como passiva (“era fortalecido”) ou intransitiva (“ficava forte”).
- source_word: πνεύματι
  choice: em espírito
  rationale: Mantém aberta a possibilidade de força interior ou espiritual, sem identificar explicitamente o referente como o Espírito Santo.
- source_word: ἐν ταῖς ἐρήμοις
  choice: nas regiões desertas
  rationale: Conserva a forma plural do grego e evita restringir o sentido a desertos arenosos.
- source_word: ἀναδείξεως
  choice: apresentação pública
  rationale: Comunica a ideia de ser mostrado ou surgir publicamente, em português atual e sem jargão desnecessário.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: a Israel
  rationale: Expressa Israel como o povo diante do qual e para o qual João seria publicamente apresentado.
theological_decisions:
- issue: Sentido de πνεύματι no desenvolvimento de João
  choice: em espírito
  alternative: no Espírito
  rationale: A expressão grega não identifica inequivocamente o Espírito Santo. A tradução principal preserva o sentido mais geral, e a nota registra a leitura específica possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma coordenação pesada. “Regiões desertas” preserva o plural grego, e as notas mantêm as ambiguidades lexical e teológica relevantes.
