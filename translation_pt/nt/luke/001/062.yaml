  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: pt
  text: Então fizeram sinais ao pai do menino, para saber como ele queria que o menino se chamasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Então fizeram sinais ao pai do menino sobre como ele gostaria que o menino fosse chamado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνένευον
  choice: fizeram sinais
  rationale: O verbo indica comunicação por sinais ou gestos; a expressão é clara e natural em português e não especifica um gesto além do que o grego afirma.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ é um conectivo leve que faz a narrativa avançar; “Então” expressa naturalmente essa sequência.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: ao pai do menino
  rationale: O dativo identifica o destinatário dos sinais. A repetição de “do menino” evita uma possível ambiguidade pronominal em português.
- source_word: τὸ τί ἂν θέλοι
  choice: para saber como ele queria
  rationale: A construção introduz o conteúdo comunicado ou procurado pelos sinais. “Para saber” torna idiomática a relação implícita, enquanto “queria” transmite sem rigidez a potencialidade ou indefinição cortês do optativo com ἄν.
- source_word: καλεῖσθαι αὐτό
  choice: que o menino se chamasse
  rationale: A construção conserva o sentido passivo de receber um nome em forma portuguesa natural. “O menino” explicita o referente de αὐτό sem tratá-lo de modo impessoal.
