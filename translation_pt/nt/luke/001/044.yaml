  naturalness: '“Pois, veja: quando...” é português moderno, claro e digno. “Aos meus ouvidos”, “o bebê”, “saltou de alegria” e “no meu ventre” são naturais e amplamente compreensíveis.'
  terminology: “Saudação” traduz bem ἀσπασμός; “bebê” traduz βρέφος de modo concreto e não doutrinário; “ventre” é apropriado para κοιλία neste contexto. “De alegria” comunica adequadamente ἐν ἀγαλλιάσει.
