    rationale: A expressão portuguesa sugere necessariamente que o salto ocorreu imediatamente ao chegar o som. A construção grega situa o salto no momento/ocasião em que o som chegou, sem exigir essa nuance de imediatidade. “Quando” é mais fiel e preserva a amplitude do original.
