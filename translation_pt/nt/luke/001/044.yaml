source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: pt
  text: 'Pois, veja: quando o som da sua saudação chegou aos meus ouvidos, o bebê saltou de alegria no meu ventre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: veja
  rationale: Preserva a função de chamar vividamente a atenção, em português moderno e natural.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com a declaração anterior.
- source_word: ὡς ἐγένετο
  choice: assim que ... chegou
  rationale: Expressa de modo natural a relação temporal imediata sugerida pelo contexto.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: o som da sua saudação
  rationale: Mantém a ênfase concreta no som audível da saudação, sem reduzir φωνή apenas à ideia abstrata de voz.
- source_word: εἰς τὰ ὦτά μου
  choice: aos meus ouvidos
  rationale: É a forma idiomática em português para indicar que o som foi ouvido, preservando a imagem sensorial.
- source_word: ἐσκίρτησεν
  choice: saltou
  rationale: Comunica o movimento súbito e vivo indicado pelo verbo.
- source_word: ἐν ἀγαλλιάσει
  choice: de alegria
  rationale: Expressa naturalmente a maneira ou o caráter jubiloso do salto.
- source_word: τὸ βρέφος
  choice: o bebê
  rationale: Designa de forma concreta e corrente a criança ainda no ventre, conforme o contexto.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: no meu ventre
  rationale: Ventre é preciso no contexto e mantém a imagem corporal do grego.
theological_decisions:
- issue: Tradução de βρέφος para João ainda no ventre
  choice: o bebê
  alternative: a criança; o bebê ainda não nascido
  rationale: O termo grego pode designar um bebê antes ou depois do nascimento. “O bebê” preserva seu sentido concreto sem acrescentar formulação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, sem eliminar a força explicativa de γάρ nem a vivacidade de ἰδού.
