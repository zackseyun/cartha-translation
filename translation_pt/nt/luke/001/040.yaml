base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: pt
  text: e entrou na casa de Zacarias e saudou Isabel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι descreve a entrada em um lugar; “entrou” é direto, natural e fiel ao movimento indicado por εἰς.
- source_word: οἶκον
  choice: casa
  rationale: Com εἰς, οἶκος designa aqui o local físico em que Maria entrou; “casa” é a correspondência mais clara e corrente.
- source_word: Ζαχαρίου
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio grego Ζαχαρίας no genitivo.
- source_word: ἠσπάσατο
  choice: saudou
  rationale: ἀσπάζομαι significa dirigir uma saudação a alguém; “saudou” preserva o sentido sem acrescentar a ideia de acolhimento por parte de Isabel.
- source_word: Ἐλισάβετ
  choice: Isabel
  rationale: Forma tradicional, natural e amplamente reconhecida em português para o nome próprio.
- source_word: καὶ
  choice: e
  rationale: As duas ocorrências coordenam a sequência narrativa; “e” preserva a parataxe simples do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples que conserva a coordenação narrativa do original. O versículo começa com “e” porque continua diretamente a frase e a ação do versículo anterior.
