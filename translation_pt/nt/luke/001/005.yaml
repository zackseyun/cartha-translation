id: LUK.1.5
reference: Luke 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: pt
  text: Nos dias de Herodes, rei da Judeia, havia um sacerdote chamado Zacarias, da turma de Abias[a]. Ele tinha uma esposa dentre as filhas de Arão[b], e o nome dela era Isabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “turma de Abias” era um dos grupos de sacerdotes organizados para se revezarem no serviço do templo.
    reason: cultural_note
  - marker: b
    text: Ou “dentre os descendentes de Arão”. O grego diz literalmente “dentre as filhas de Arão”, expressão que indica linhagem sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: havia
  rationale: A forma funciona aqui como introdução narrativa e existencial. “Havia” é natural em português e introduz o personagem sem a rigidez de “aconteceu que”.
- source_word: ἐν ταῖς ἡμέραις
  choice: Nos dias de
  rationale: Expressão temporal corrente que permanece próxima do idioma grego.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Herodes, rei da Judeia
  rationale: Reproduz diretamente a identificação de Herodes por seu título e território.
- source_word: ἱερεύς τις
  choice: um sacerdote
  rationale: O indefinido τις apresenta uma nova personagem; o artigo indefinido português transmite isso naturalmente, sem exigir “certo sacerdote”.
- source_word: ὀνόματι Ζαχαρίας
  choice: chamado Zacarias
  rationale: Equivalente idiomático e conciso da fórmula grega de nomeação.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: da turma de Abias
  rationale: ἐφημερία designa um grupo organizado de sacerdotes em seu turno de serviço. “Turma” é uma designação portuguesa clara e usual nesse contexto, explicitada em nota.
- source_word: γυνὴ αὐτῷ
  choice: Ele tinha uma esposa
  rationale: O dativo αὐτῷ tem sentido possessivo; esta formulação é idiomática e preserva a relação expressa no grego.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: dentre as filhas de Arão
  rationale: Mantém a imagem familiar concreta do original, que indica a linhagem sacerdotal, sem substituí-la silenciosamente pela interpretação “descendentes”.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: o nome dela era Isabel
  rationale: Tradução natural da fórmula grega, com referência pronominal clara.
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: Zacarias / Isabel / Abias / Arão
  rationale: Empregam-se as formas bíblicas consolidadas e amplamente reconhecidas em português moderno.
theological_decisions:
- issue: Formulação genealógica da linhagem de Isabel
  choice: dentre as filhas de Arão
  alternative: dentre os descendentes de Arão
  rationale: O grego emprega literalmente “filhas de Arão”. Conservar a expressão mantém a imagem e a ênfase na linhagem sacerdotal, enquanto a nota esclarece seu sentido idiomático sem inserir uma interpretação no corpo do texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A frase grega longa foi dividida em duas para clareza, sem perder suas relações sintáticas. Os marcadores foram posicionados junto às expressões que cada nota explica.
