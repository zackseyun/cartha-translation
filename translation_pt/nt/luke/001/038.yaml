id: LUK.1.38
reference: Luke 1:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: pt
  text: 'Maria disse: “Eis aqui a serva do Senhor.[a] Que aconteça comigo conforme a sua palavra.”[b] E o anjo afastou-se dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a escrava do Senhor”. O grego δούλη pode designar uma escrava ou uma serva; aqui, “serva” destaca a humilde submissão de Maria a Deus.
    reason: alternative_reading
  - marker: b
    text: Ou “Que seja comigo conforme a sua palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: disse
  rationale: A partícula δέ é um conectivo narrativo leve. Em português, não precisa ser representada por uma conjunção explícita neste ponto; a sequência do relato já comunica a continuidade sem acrescentar uma ideia temporal forte.
- source_word: Ἰδοὺ
  choice: Eis aqui
  rationale: Preserva a força marcada e solene da apresentação de Maria, em linguagem digna e ainda amplamente compreensível.
- source_word: δούλη
  choice: serva
  rationale: O termo feminino pode designar escrava ou serva. No contexto, “serva” expressa com naturalidade a humilde submissão de Maria ao Senhor, enquanto a nuance social mais forte é registrada em nota.
- source_word: κυρίου
  choice: do Senhor
  rationale: Mantém κύριος como título divino e expressa de modo idiomático a relação declarada por Maria.
- source_word: γένοιτό μοι
  choice: Que aconteça comigo
  rationale: O optativo aoristo comunica desejo e assentimento voluntário, não mera previsão. A formulação é clara em português moderno e evita transformar a frase em ordem.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: conforme a sua palavra
  rationale: “Conforme” preserva a ideia de correspondência, e “palavra” remete ao anúncio específico que o anjo acaba de pronunciar.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: retirou-se de junto dela
  rationale: Reproduz tanto a partida do anjo quanto o complemento “dela”, com tom narrativo digno e natural.
- source_word: ὁ ἄγγελος
  choice: o anjo
  rationale: No relato da infância em Lucas, o referente é claramente um ser angelical, não apenas um mensageiro humano.
theological_decisions:
- issue: Autodesignação de Maria como δούλη
  choice: serva do Senhor
  alternative: escrava do Senhor
  rationale: A escolha principal destaca a humilde submissão de Maria à vontade divina sem apagar que o termo grego também pode indicar condição de escravidão; essa alternativa é preservada em nota.
- issue: Força de γένοιτό μοι
  choice: Que aconteça comigo conforme a sua palavra
  alternative: Que se cumpra em mim conforme a sua palavra
  rationale: A tradução principal conserva o valor volitivo do optativo e o sentido amplo de “acontecer”, sem interpretar antecipadamente ῥῆμα como promessa a ser “cumprida”.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com construções naturais no Brasil e compreensíveis internacionalmente. “Eis aqui” conserva a solenidade do original sem tornar todo o versículo arcaico; “retirou-se de junto dela” mantém explicitamente a relação expressa por ἀπ’ αὐτῆς.
