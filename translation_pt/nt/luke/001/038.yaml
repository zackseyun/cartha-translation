  source_fidelity: O texto principal transmite com fidelidade a autodesignação de Maria, o valor volitivo de γένοιτό μοι, a conformidade com a palavra anunciada e a partida do anjo. A omissão explícita de δέ é aceitável em português. Contudo, a nota b atualmente proposta, «Que se cumpra em mim», introduz a noção de cumprimento e troca «comigo» por «em mim», não correspondendo de perto à alternativa lexical indicada no registro inglês.
  naturalness: «Eis aqui a serva do Senhor» mantém um registro elevado, mas ainda claro e natural para uma tradução bíblica em português moderno. «Retirou-se de junto dela» é compreensível, porém algo pesado; «afastou-se dela» é mais direto e natural sem perda de sentido.
  terminology: «Serva do Senhor» é uma escolha contextual legítima para δούλη, e a nota preserva adequadamente «escrava». «Senhor» para κύριος e «anjo» para ἄγγελος estão corretos.
  issues:
