    issue: A nota b não é uma alternativa lexical suficientemente próxima de γένοιτό μοι.
    rationale: «Que se cumpra em mim» sugere cumprimento/realização e altera a relação expressa por μοι. Uma alternativa como «Que seja comigo conforme a sua palavra» preserva melhor a formulação alternativa «Let it be to me» sem acrescentar interpretação.
  - severity: low
    issue: «Retirou-se de junto dela» é estilisticamente pesado.
    rationale: Embora fiel, «afastou-se dela» exprime naturalmente ἀπῆλθεν ἀπ’ αὐτῆς e se ajusta melhor ao português moderno.
