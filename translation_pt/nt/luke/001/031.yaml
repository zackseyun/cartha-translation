id: LUK.1.31
reference: Luke 1:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: pt
  text: E eis que você conceberá e dará à luz um filho, e lhe dará o nome de Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “chamará o nome dele de Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a função de chamar a atenção e o tom solene do anúncio. Embora um pouco elevada, a expressão é reconhecível e natural no registro bíblico moderno.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: você conceberá
  rationale: O conjunto expressa a concepção no ventre. Em português, “conceberá” já contém essa ideia, de modo que acrescentar “em seu ventre” seria possível, mas menos natural e parcialmente redundante.
- source_word: τέξῃ
  choice: dará à luz
  rationale: É a forma corrente, clara e digna de expressar o ato de gerar ou dar à luz uma criança.
- source_word: υἱόν
  choice: um filho
  rationale: Mantém o sentido masculino específico de υἱός.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: lhe dará o nome de
  rationale: Traduz naturalmente a fórmula de nomeação em português sem perder seu sentido. A forma mais literal é registrada em nota.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome no Novo Testamento.
theological_decisions:
- issue: Forma de traduzir a fórmula de nomeação καλέσεις τὸ ὄνομα αὐτοῦ
  choice: lhe dará o nome de Jesus
  alternative: chamará o nome dele de Jesus
  rationale: Não há diferença doutrinária. A opção principal comunica fielmente o ato de nomear em português natural; a nota conserva a estrutura mais próxima do grego e sua textura bíblica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” conserva a solenidade da anunciação, enquanto “você” evita regionalizar excessivamente a segunda pessoa.
