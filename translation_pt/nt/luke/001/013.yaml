base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: pt
  text: 'Mas o anjo lhe disse: “Não tenha medo, Zacarias, porque a sua oração[a] foi ouvida, e Isabel, sua esposa, dará à luz um filho seu, e você lhe dará o nome de João.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “súplica” ou “pedido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος
  choice: Mas o anjo lhe disse
  rationale: “Mas” representa a leve transição de δέ diante do medo de Zacarias; “lhe disse” expressa naturalmente πρὸς αὐτόν sem redundância em português.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Forma corrente e natural em português para a proibição, adequada ao estado emocional de Zacarias.
- source_word: διότι εἰσηκούσθη
  choice: porque ... foi ouvida
  rationale: Mantém a relação causal e a voz passiva do grego, sem explicitar Deus como sujeito quando o texto não o faz.
- source_word: ἡ δέησίς σου
  choice: a sua oração
  rationale: No contexto de uma petição dirigida a Deus, “oração” é clara e natural; a nota registra o sentido mais específico de súplica ou pedido.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: Isabel, sua esposa
  rationale: O possessivo e o contexto conjugal determinam o sentido de γυνή como “esposa”; a ordem escolhida soa natural em português.
- source_word: γεννήσει υἱόν σοι
  choice: dará à luz um filho seu
  rationale: Com sujeito feminino, γεννάω significa dar à luz. “Um filho seu” comunica de modo natural a relação expressa pelo dativo σοι.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: você lhe dará o nome de João
  rationale: Reproduz em português idiomático o sentido da expressão grega, evitando o decalque pouco natural “chamará o nome dele João”.
theological_decisions:
- issue: Agente implícito em “foi ouvida”
  choice: Manter a construção passiva sem nomear o agente
  alternative: 'Explicitar: “Deus ouviu a sua oração”'
  rationale: O contexto indica naturalmente que Deus ouviu a oração, mas o grego usa uma passiva e não nomeia o agente; a tradução preserva essa forma e evita explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. O tratamento por “você” evita solenidade artificial; “sua esposa” e “dará à luz” mantêm clareza narrativa.
