id: LUK.1.72
reference: Luke 1:72
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: pt
  text: para mostrar misericórdia aos nossos pais[c][a] e lembrar-se da sua santa aliança[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os nossos pais”; a expressão grega indica mostrar misericórdia em relação aos antepassados de Israel.
    reason: lexical_alternative
  - marker: b
    text: Na linguagem bíblica de aliança, Deus “lembrar-se” geralmente implica agir com fidelidade a uma promessa anterior, não apenas trazê-la à memória.
    reason: cultural_note
  - marker: c
    text: “Nossos pais” refere-se aos antepassados ou patriarcas de Israel; também se pode traduzir por “nossos antepassados”.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: mostrar misericórdia
  rationale: A expressão grega significa literalmente fazer/praticar misericórdia; em português atual, “mostrar misericórdia” comunica o idioma com naturalidade e mantém o sentido do infinitivo.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: aos nossos pais
  rationale: Embora μετά com genitivo seja literalmente “com”, neste contexto relacional “mostrar misericórdia aos nossos pais” é natural em português. “Pais” preserva a forma masculina e a ressonância patriarcal do grego.
- source_word: μνησθῆναι
  choice: lembrar-se
  rationale: Mantém o verbo explícito do grego e sua linguagem bíblica de aliança, sem expandi-lo interpretativamente para “cumprir” ou “agir”.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: da sua santa aliança
  rationale: “Aliança” é o equivalente apropriado neste contexto histórico-salvífico; “santa” preserva o qualificativo, e “sua” mantém a referência pronominal a Deus.
theological_decisions:
- issue: A lembrança divina como ação de aliança
  choice: lembrar-se da sua santa aliança
  alternative: agir fielmente segundo a sua santa aliança; cumprir a sua santa aliança
  rationale: Na linguagem bíblica, Deus “lembrar-se” frequentemente implica agir com fidelidade à promessa. Contudo, o texto diz “lembrar-se”; a tradução conserva essa formulação e explica sua implicação em nota.
- issue: Referente de πατέρων ἡμῶν
  choice: nossos pais
  alternative: nossos antepassados; nossos patriarcas
  rationale: A opção preserva a linguagem masculina e a ressonância pactual do original, enquanto a nota esclarece que se trata dos antepassados de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a estrutura de propósito do contexto, a terminologia bíblica de aliança e a ambiguidade significativa do verbo “lembrar-se”. Os marcadores foram colocados imediatamente após as expressões a que correspondem.
