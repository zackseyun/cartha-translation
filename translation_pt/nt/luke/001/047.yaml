  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: pt
  text: e o meu espírito se alegrou em Deus, meu Salvador[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «exultou em Deus, meu Salvador».'
    reason: Alternativa lexical que explicita com maior intensidade a alegria expressa por ἠγαλλίασεν, embora seja menos comum na linguagem cotidiana.
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém o conectivo simples que liga este verso ao anterior no paralelismo poético.
- source_word: ἠγαλλίασεν
  choice: se alegrou
  rationale: O pretérito perfeito traduz naturalmente o aoristo indicativo e comunica alegria intensa sem tornar a expressão artificial; «exultou» permanece uma alternativa lexical válida.
- source_word: τὸ πνεῦμά μου
  choice: o meu espírito
  rationale: Preserva o termo πνεῦμα e sua distinção lexical em relação a «alma» no verso anterior, sem impor uma antropologia técnica.
- source_word: ἐπὶ τῷ θεῷ
  choice: em Deus
  rationale: Com o verbo de alegria, ἐπί com dativo indica a base ou o objeto da alegria; «em Deus» é idiomático e mantém o foco relacional.
- source_word: τῷ σωτῆρί μου
  choice: meu Salvador
  rationale: Traduz diretamente σωτήρ, preservando a identificação enfática de Deus como Salvador de Maria.
theological_decisions:
- issue: A identificação de Deus como Salvador de Maria
  choice: Deus, meu Salvador
  alternative: Deus, meu libertador
  rationale: O grego identifica diretamente Deus como σωτήρ de Maria. «Salvador» conserva o peso usual do termo no Novo Testamento sem acrescentar conclusões doutrinárias além do texto.
- issue: A relação entre «espírito» neste verso e «alma» no verso anterior
  choice: Manter «espírito» como termo distinto
  alternative: Uniformizar os dois termos como referência ao ser interior
  rationale: O paralelismo sugere sobreposição semântica, mas o texto grego emprega palavras diferentes; a tradução preserva tanto o paralelismo quanto essa distinção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito perfeito «se alegrou» reflete naturalmente o aoristo grego; a ordem e o vocabulário preservam o caráter poético do cântico.
