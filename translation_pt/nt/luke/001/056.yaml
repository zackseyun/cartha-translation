  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: pt
  text: Maria ficou com ela cerca de três meses e voltou para casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: ficou
  rationale: O aoristo de μένω indica que Maria permaneceu naquele lugar por certo período. “Ficou” é natural e claro no português atual.
- source_word: δὲ
  choice: e depois
  rationale: δέ funciona como conectivo narrativo leve. A formulação “e depois” liga naturalmente a permanência de Maria ao seu retorno, sem introduzir contraste indevido.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: σὺν αὐτῇ
  choice: com ela
  rationale: σύν com o dativo expressa companhia. “Com ela” conserva a referência contextual a Isabel sem acrescentar o nome ao texto.
- source_word: ὡς μῆνας τρεῖς
  choice: cerca de três meses
  rationale: ὡς diante de uma medida temporal indica aproximação. “Cerca de três meses” comunica essa nuance com naturalidade e dignidade.
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: O verbo indica retorno a um lugar anterior. “Voltou” é conciso e idiomático em português.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: para casa
  rationale: Neste contexto, οἶκος designa o lugar para o qual Maria retorna. A expressão portuguesa “voltou para casa” é mais natural do que “voltou para a sua casa” e não sugere o sentido de família ou unidade doméstica.
