  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: pt
  text: E os seus vizinhos e parentes ouviram que o Senhor havia demonstrado grande misericórdia para com ela e alegraram-se com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: vizinhos
  rationale: Designa os que moravam nas proximidades; “vizinhos” é natural, claro e adequado ao contexto social.
- source_word: συγγενεῖς
  choice: parentes
  rationale: Equivale diretamente a familiares ou pessoas da mesma parentela, sem restringir o grau de parentesco.
- source_word: ἐμεγάλυνεν
  choice: havia engrandecido
  rationale: Preserva a imagem lexical de μεγαλύνω, “tornar grande/engrandecer”, e sua ressonância no contexto próximo de Lucas, embora a expressão exija uma formulação portuguesa cuidadosa.
- source_word: κύριος
  choice: o Senhor
  rationale: Embora sem artigo no grego, funciona no contexto como título divino definido; “o Senhor” é a forma portuguesa natural.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente tradicional e semanticamente apropriado para a compaixão bondosa de Deus, importante na narrativa da infância em Lucas.
- source_word: μετ’ αὐτῆς
  choice: para com ela
  rationale: A tradução estritamente formal “com ela” soaria pouco clara em português dentro desta expressão. “Para com ela” comunica a orientação da misericórdia sem reduzi-la simplesmente a uma ação genérica.
- source_word: συνέχαιρον αὐτῇ
  choice: se alegraram com ela
  rationale: Expressa diretamente a alegria compartilhada indicada pelo verbo composto συγχαίρω.
theological_decisions:
- issue: Tradução da expressão ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: o Senhor havia engrandecido sua misericórdia para com ela
  alternative: o Senhor havia demonstrado grande misericórdia para com ela
  rationale: A opção principal conserva a força de μεγαλύνω e a imagem de a misericórdia ser engrandecida, sem recorrer ao português pouco natural “engrandecido sua misericórdia com ela”. A nota registra a formulação idiomática possível, mantendo aberta a tensão entre forma lexical e sentido contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “para com ela” é ligeiramente elevada, mas natural no registro bíblico e evita a estranheza de uma reprodução mecânica de μετά com o genitivo.
