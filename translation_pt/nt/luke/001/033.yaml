id: LUK.1.33
reference: Luke 1:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: pt
  text: E ele reinará sobre a casa de Jacó para sempre[a], e o seu reino não terá fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelas eras” ou “pelos séculos”. A expressão grega εἰς τοὺς αἰῶνας indica duração sem fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: reinará
  rationale: O futuro ativo de βασιλεύω indica o exercício da autoridade real. “Reinará” é natural em português e preserva diretamente o sentido régio.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: sobre a casa de Jacó
  rationale: Com ἐπί e acusativo após βασιλεύω, a expressão indica domínio “sobre”. “Casa de Jacó” preserva a formulação bíblica e seu sentido coletivo e pactual, sem substituí-la por uma interpretação.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: A locução idiomática expressa duração sem fim. “Para sempre” comunica isso de maneira clara e corrente, enquanto a nota registra a forma mais literal.
- source_word: βασιλείας
  choice: reino
  rationale: βασιλεία pode indicar reinado, domínio real ou reino. Neste contexto, “reino” é idiomático e mantém tanto a dimensão régia quanto a continuidade expressa pela ausência de fim.
- source_word: οὐκ ἔσται τέλος
  choice: não terá fim
  rationale: Embora a construção grega seja literalmente existencial (“não haverá fim”), em português “o seu reino não terá fim” é mais fluente, mantém a negação enfática e preserva o sentido futuro.
theological_decisions:
- issue: Alcance de “a casa de Jacó”
  choice: Manter “a casa de Jacó” sem ampliar para “Israel” ou “povo de Deus”.
  alternative: “o povo de Israel” ou “o povo de Deus”
  rationale: A expressão tradicional de caráter pactual deve ser preservada, pois o versículo não explicita aqui uma ampliação de seu alcance. Isso evita resolver no texto principal uma questão teológica posterior.
- issue: Duração do reinado
  choice: Traduzir εἰς τοὺς αἰῶνας por “para sempre” e afirmar que o reino “não terá fim”.
  alternative: “pelos séculos” ou “pelas eras”
  rationale: As duas afirmações paralelas apresentam o reinado e o reino como intermináveis. “Para sempre” transmite com clareza a força idiomática da expressão grega, sem enfraquecê-la nem recorrer a formulação arcaica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se a expressão bíblica “casa de Jacó”; evita-se a ordem mais rígida “e do seu reino não haverá fim” em favor da formulação portuguesa natural “e o seu reino não terá fim”.
