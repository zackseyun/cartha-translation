  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: pt
  text: E toda a multidão do povo estava orando do lado de fora, à hora da oferta de incenso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à hora de queimar o incenso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: toda a multidão
  rationale: Preserva a ideia da totalidade do grupo reunido e o substantivo coletivo singular, em português natural.
- source_word: τοῦ λαοῦ
  choice: do povo
  rationale: Traduz λαός sem explicitar “Israel”, identificação provável no contexto do templo, mas não expressa no texto.
- source_word: προσευχόμενον
  choice: estava orando
  rationale: A construção perifrástica com ἦν e o particípio presente indica ação em andamento; a forma escolhida é clara e natural.
- source_word: ἔξω
  choice: do lado de fora
  rationale: Expressa naturalmente o contraste espacial sem acrescentar “do santuário”, que permanece implícito no contexto.
- source_word: τῇ ὥρᾳ
  choice: à hora
  rationale: Mantém a noção de um horário determinado para o ato litúrgico.
- source_word: τοῦ θυμιάματος
  choice: da oferta de incenso
  rationale: No contexto do templo, θυμίαμα se refere ao incenso em seu uso ritual; “oferta de incenso” torna esse sentido claro sem ampliar indevidamente o texto.
theological_decisions:
- issue: Terminologia do culto do templo em θυμίαμα
  choice: oferta de incenso
  alternative: queima do incenso
  rationale: A escolha conserva o contexto litúrgico e sacerdotal, sem associá-lo a formulações doutrinárias posteriores. A alternativa é lexicalmente possível e aparece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Do lado de fora” soa mais natural que o simples “fora”; a ordem da frase acompanha de perto o grego sem sacrificar a fluidez.
