source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: pt
  text: 'Todos os que ouviram isso guardaram isso no coração e perguntavam: “O que, então, virá a ser[a] este menino?” Pois a mão do Senhor estava com ele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que, então, será este menino?” O verbo grego significa literalmente “será”, mas, no contexto, a pergunta diz respeito ao futuro, à identidade ou ao papel do menino.'
    reason: lexical_alternative
  - marker: b
    text: “A mão do Senhor” é uma expressão bíblica que pode indicar o poder, o favor ou a orientação ativa de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: guardaram essas coisas no coração
  rationale: Preserva a metáfora bíblica de colocar algo no coração, expressando reflexão e memória deliberadas em português natural. O plural “essas coisas” explicita com sobriedade os acontecimentos ouvidos no contexto.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Todos os que ouviram falar disso
  rationale: Representa o particípio substantivado e fornece em português o complemento implícito, retomando os acontecimentos narrados.
- source_word: λέγοντες
  choice: e diziam
  rationale: A coordenação com verbo finito é mais natural em português do que “dizendo” e mantém a ação atribuída a todos os que ouviram.
- source_word: Τί ἄρα
  choice: O que, então
  rationale: '“Então” comunica a nuance inferencial de ἄρα: a pergunta surge como conclusão diante dos sinais relatados.'
- source_word: τὸ παιδίον τοῦτο
  choice: este menino
  rationale: No contexto, παιδίον designa o filho recém-nascido de Zacarias e Isabel. “Menino” é natural e mantém a referência masculina sem acrescentar uma idade além do contexto.
- source_word: ἔσται
  choice: virá a ser
  rationale: O verbo significa literalmente “será”; a formulação “virá a ser” expressa em português a pergunta contextual sobre o futuro, a identidade ou o papel da criança, sem defini-lo.
- source_word: καὶ γὰρ
  choice: Pois
  rationale: A combinação introduz a razão que fundamenta a expectativa expressa na pergunta. “Pois” transmite essa relação de forma clara e idiomática.
- source_word: χεὶρ κυρίου
  choice: a mão do Senhor
  rationale: Mantém a metáfora bíblica da atuação divina e sua ressonância intertextual, em vez de reduzi-la a uma única interpretação.
- source_word: μετ’ αὐτοῦ
  choice: estava com ele
  rationale: Traduz diretamente μετά com genitivo e conserva a afirmação contida do texto sobre a presença ou atuação divina junto ao menino.
theological_decisions:
- issue: Sentido da expressão “a mão do Senhor estava com ele”
  choice: Manter a metáfora como afirmação da atuação e do favor divinos sem especificar seu modo.
  alternative: “O Senhor o ajudava” ou “o poder de Deus estava sobre ele”.
  rationale: A expressão indica o envolvimento ativo de Deus na vida do menino, mas não limita esse envolvimento a ajuda, proteção, poder, favor ou orientação. Preservar a metáfora mantém a amplitude teológica do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi tornada natural sem eliminar as metáforas bíblicas nem definir de modo excessivo o futuro do menino ou a natureza da atuação divina.
