  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: pt
  text: conforme o costume do serviço sacerdotal, coube-lhe por sorte queimar incenso ao entrar no santuário do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὸ ἔθος
  choice: conforme o costume
  rationale: A expressão indica conformidade com uma prática estabelecida; esta formulação é natural e preserva o sentido formal.
- source_word: τῆς ἱερατείας
  choice: do serviço sacerdotal
  rationale: ἱερατεία designa o ofício ou serviço sacerdotal; em português, esta opção comunica melhor a prática institucional do que apenas «dos sacerdotes».
- source_word: ἔλαχε
  choice: coube-lhe por sorte
  rationale: Torna explícito o sorteio indicado por λαγχάνω e preserva a ideia de que a incumbência lhe foi atribuída.
- source_word: τοῦ θυμιᾶσαι
  choice: queimar incenso
  rationale: O infinitivo expressa a tarefa que lhe coube, e θυμιάω se refere concretamente a queimar ou oferecer incenso.
- source_word: εἰσελθὼν
  choice: ao entrar
  rationale: Reproduz de modo conciso a relação temporal do particípio aoristo sem impor uma sequência mais precisa do que o grego exige.
- source_word: εἰς τὸν ναὸν
  choice: no santuário
  rationale: Neste contexto cultual, ναός se refere ao edifício interior, onde se queimava incenso, e não ao conjunto mais amplo dos pátios do templo.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Traduz κύριος de modo direto e tradicional, referindo-se aqui a Deus.
theological_decisions:
- issue: Sentido de ναός no contexto do culto do templo
  choice: santuário
  alternative: templo
  rationale: Como Zacarias entra para queimar incenso, o referente provável é o santuário propriamente dito, não todo o complexo do templo. «Santuário» preserva essa distinção lexical sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção «coube-lhe por sorte» mantém o caráter do procedimento sacerdotal e evita sugerir mera escolha humana.
