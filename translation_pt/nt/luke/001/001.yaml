  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: pt
  text: Visto que muitos se propuseram a compilar um relato a respeito dos acontecimentos que se cumpriram entre nós,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que foram realizados entre nós” ou “que foram plenamente confirmados entre nós”.
