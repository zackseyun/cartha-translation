lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Visto que
  rationale: Introduz o prólogo formal com valor causal e de contexto, em português atual e digno; a força enfática de -περ fica sugerida pelo registro da locução.
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz diretamente o sentido quantitativo sem acrescentar “outros”, que não está explícito no grego.
- source_word: ἐπεχείρησαν
  choice: empreenderam
  rationale: Expressa o início deliberado de uma tarefa sem sugerir que a tentativa tenha fracassado.
- source_word: ἀνατάξασθαι
  choice: compilar
  rationale: Comunica a atividade de organizar e redigir material em forma de narrativa, adequada ao tom literário do prólogo.
- source_word: διήγησιν
  choice: um relato
  rationale: É claro para leitores modernos e preserva o caráter narrativo e historiográfico do termo.
- source_word: περὶ
  choice: a respeito de
  rationale: Mantém um registro formal, mas natural e amplamente compreensível em português.
- source_word: τῶν πεπληροφορημένων
  choice: que se cumpriram
  rationale: O particípio perfeito passivo pode indicar acontecimentos levados ao cumprimento; a formulação preserva a ressonância de cumprimento sem excluir em nota as alternativas lexicais.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Preserva a referência coletiva sem definir indevidamente quem integra o “nós”.
- source_word: πραγμάτων
  choice: acontecimentos
  rationale: No contexto de um relato sobre fatos realizados, “acontecimentos” é mais natural em português do que “assuntos”, embora o termo grego seja amplo.
theological_decisions:
- issue: Sentido de πεπληροφορημένων no prólogo de Lucas
  choice: que se cumpriram
  alternative: que foram realizados; que foram plenamente confirmados entre nós
  rationale: Com πραγμάτων e diante da narrativa dos atos de Deus, o sentido de cumprimento ou realização parece mais provável. Como o verbo também pode, em certos contextos, envolver plena confirmação ou certeza, essa possibilidade é mantida na nota em vez de ser eliminada.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A abertura conserva o caráter formal do prólogo de Lucas sem recorrer a formulações arcaicas. A vírgula antes da nota acompanha a continuidade sintática do período, que prossegue nos versículos seguintes.
