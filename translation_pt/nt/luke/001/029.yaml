base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: pt
  text: Mas ela ficou profundamente perturbada com a mensagem[a] e se perguntava que tipo de saudação seria aquela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a palavra” ou “por causa do que foi dito”. O grego λόγος pode significar “palavra”, “declaração” ou “mensagem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e continuava refletindo sobre que tipo de saudação seria aquela”. O imperfeito grego indica uma reflexão em andamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição com leve contraste entre a saudação do anjo e a reação de Maria.
- source_word: ἐπὶ τῷ λόγῳ
  choice: com essas palavras
  rationale: Refere-se ao conteúdo que o anjo acabara de dizer. A expressão é natural em português e mantém a relação causal da construção grega.
- source_word: διεταράχθη
  choice: ficou profundamente perturbada
  rationale: Expressa a forte agitação indicada pelo verbo intensivo, sem atribuir culpa moral ou incredulidade a Maria.
- source_word: διελογίζετο
  choice: se perguntava
  rationale: Comunica a reflexão interior em andamento expressa pelo imperfeito, em linguagem corrente.
- source_word: ποταπὸς
  choice: que tipo de
  rationale: Preserva a pergunta sobre a natureza ou qualidade da saudação.
- source_word: εἴη
  choice: seria
  rationale: O futuro do pretérito é uma forma natural de representar em português a nuance potencial do optativo no discurso indireto.
- source_word: ἀσπασμὸς
  choice: saudação
  rationale: Equivalente claro e corrente para a saudação verbal do anjo.
- source_word: οὗτος
  choice: aquela
  rationale: Retoma a saudação já proferida; em português, 'aquela' soa natural no discurso indireto retrospectivo.
theological_decisions:
- issue: Natureza da reação de Maria
  choice: Maria fica perturbada com as palavras do anjo e reflete sobre o significado da saudação.
  alternative: Maria ficou perturbada com a aparição do anjo, ou sua reação implica incredulidade.
  rationale: O grego relaciona explicitamente sua perturbação às palavras proferidas e descreve deliberação interior, sem emitir juízo moral ou teológico sobre sua reação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita linguagem excessivamente erudita e preserva tanto a intensidade da reação quanto o caráter contínuo da reflexão de Maria.
