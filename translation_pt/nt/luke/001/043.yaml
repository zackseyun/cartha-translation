  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: pt
  text: E como é que me é concedido isto, que a mãe do meu Senhor venha a mim?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «E de onde me vem isto, que a mãe do meu Senhor venha a mim?» A expressão manifesta espanto diante de tamanha honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: como me é concedido isto
  rationale: A expressão grega, literalmente ligada à ideia de origem («de onde vem isto a mim?»), funciona como exclamação de espanto diante de uma honra inesperada. A formulação portuguesa comunica esse sentido sem inserir no texto principal um substantivo interpretativo como «honra» ou «privilégio».
- source_word: ἵνα ἔλθῃ
  choice: que ... venha
  rationale: Neste contexto, ἵνα introduz o conteúdo da circunstância que causa espanto. O presente do subjuntivo em português é natural depois da expressão introdutória e mantém o tom admirado.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Equivalência direta e natural do substantivo grego.
- source_word: τοῦ κυρίου μου
  choice: do meu Senhor
  rationale: Preserva κύριος como título reverente e mantém o possessivo pessoal de Isabel, sem acrescentar formulações doutrinárias posteriores.
- source_word: πρὸς ἐμέ
  choice: a mim
  rationale: Expressa o movimento em direção a Isabel sem especificar «à minha casa», detalhe que não está explícito no grego.
theological_decisions:
- issue: Sentido de κύριος em «a mãe do meu Senhor»
  choice: meu Senhor
  alternative: meu mestre
  rationale: «Senhor» conserva o peso reverente e cristológico do título no relato da infância, sem definir além do que o próprio versículo afirma.
- issue: Grau de explicitação da expressão πόθεν μοι τοῦτο
  choice: como me é concedido isto
  alternative: de onde me vem isto
  rationale: A escolha torna compreensível o valor idiomático de privilégio recebido, enquanto a nota preserva a forma mais literal e a ambiguidade de origem/causa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção mantém a concisão e o tom de admiração de Isabel; a alternativa mais literal é registrada em nota.
