id: LUK.1.17
reference: Luke 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: pt
  text: E ele irá à frente dele, no espírito e no poder de Elias,[a] para fazer os corações dos pais se voltarem para os filhos e os desobedientes se voltarem para a sabedoria dos justos,[b] a fim de preparar para o Senhor um povo pronto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “no espírito e no poder de Elias” indica um ministério profético semelhante ao de Elias e capacitado como o dele, não necessariamente o retorno literal do próprio Elias.
    reason: cross_reference
  - marker: b
    text: 'Ou: “para a maneira de pensar dos justos” ou “na prudência dos justos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: irá adiante dele
  rationale: Expressa a ação de preceder alguém em sua missão, preservando o pronome indefinido do grego sem explicitar seu referente.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: no espírito e no poder de Elias
  rationale: Tradução transparente que indica continuidade e capacitação proféticas associadas a Elias, sem identificar João literalmente com ele.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: para fazer o coração dos pais voltar-se para os filhos
  rationale: Mantém o sentido de mudança ou reconciliação e a alusão a Malaquias, em português natural; o singular coletivo 'coração' evita uma formulação pesada.
- source_word: ἀπειθεῖς
  choice: os desobedientes
  rationale: Abrange recusa obstinada, insubmissão e desobediência, adequando-se ao contraste ético com os justos.
- source_word: ἐν φρονήσει δικαίων
  choice: para a sabedoria dos justos
  rationale: Entende a expressão como direção ou esfera para a qual os desobedientes são conduzidos; 'sabedoria' comunica discernimento moral, mantendo em nota alternativas possíveis.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: a fim de preparar para o Senhor um povo pronto
  rationale: Preserva o segundo infinitivo de propósito e o estado resultante expresso pelo particípio perfeito passivo.
theological_decisions:
- issue: Identidade e função da linguagem sobre Elias
  choice: João atua no espírito e no poder de Elias.
  alternative: Entender que Elias em pessoa retornaria literalmente.
  rationale: A construção grega descreve caráter e capacitação proféticos semelhantes aos de Elias, sem afirmar identidade pessoal.
- issue: Referente de αὐτοῦ e κύριος
  choice: Manter 'dele' e 'o Senhor', como no grego.
  alternative: Explicitar no texto principal 'do Messias/Jesus'.
  rationale: O contexto ajuda a identificar o referente, mas o versículo conserva pronome e título; explicitá-lo eliminaria uma tensão textual genuína.
- issue: Relação sintática de ἀπειθεῖς ἐν φρονήσει δικαίων
  choice: Entender que os desobedientes são conduzidos para a sabedoria dos justos.
  alternative: Traduzir 'os desobedientes na prudência dos justos' ou 'à mentalidade dos justos'.
  rationale: A relação de propósito com ἐπιστρέψαι favorece um sentido direcional, mas a formulação grega admite nuances de esfera, disposição mental e prudência, registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação separa os dois propósitos do ministério descrito. Todos os marcadores de nota aparecem no texto principal.
