    issue: Plural de καρδίας não preservado
    rationale: O texto grego traz «corações» (καρδίας). Embora o singular coletivo seja possível em português, o plural pode ser mantido naturalmente e reflete melhor a forma e a imagem da alusão a Malaquias.
  - severity: medium
    issue: Coordenação elíptica de «os desobedientes»
    rationale: Em «para fazer o coração dos pais voltar-se para os filhos e os desobedientes, para a sabedoria dos justos», falta um verbo expresso para o segundo objeto. O grego coordena «corações» e «desobedientes» sob ἐπιστρέψαι; explicitar o segundo «se voltarem» preserva essa relação com clareza.
