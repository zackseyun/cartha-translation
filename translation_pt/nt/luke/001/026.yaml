id: LUK.1.26
reference: Luke 1:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: pt
  text: No sexto mês[a], o anjo Gabriel foi enviado da parte de Deus a uma cidade da Galileia chamada Nazaré[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o sexto mês da gravidez de Isabel; veja Lucas 1:24, 36.
    reason: cross_reference
  - marker: b
    text: 'Ou: «a uma cidade na Galileia chamada Nazaré».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: No sexto mês
  rationale: A construção ἐν com o dativo expressa tempo. δέ funciona aqui como conectivo leve e não exige uma palavra específica em português; omiti-lo produz uma transição natural sem criar contraste indevido.
- source_word: ἀπεστάλη
  choice: foi enviado
  rationale: Preserva de modo direto a voz passiva do aoristo de ἀποστέλλω e a ideia de uma missão recebida.
- source_word: ὁ ἄγγελος
  choice: o anjo
  rationale: Neste contexto narrativo, ἄγγελος designa claramente um ser celestial, e não apenas um mensageiro humano.
- source_word: Γαβριὴλ
  choice: Gabriel
  rationale: Emprega a forma tradicional e corrente do nome em português.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: da parte de Deus
  rationale: ἀπό com o genitivo ressalta procedência ou origem. «Da parte de Deus» preserva essa nuance melhor que «por Deus», que destacaria principalmente o agente.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: a uma cidade da Galileia
  rationale: εἰς indica destino, e o genitivo τῆς Γαλιλαίας admite a formulação natural «da Galileia», próxima da estrutura grega.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: chamada Nazaré
  rationale: A construção significa literalmente «cujo nome [era] Nazaré». «Chamada Nazaré» comunica isso com concisão e naturalidade.
theological_decisions:
- issue: Referência de «sexto mês»
  choice: Manter apenas «no sexto mês» no texto principal
  alternative: Explicitar «no sexto mês da gravidez de Isabel»
  rationale: O contexto imediato indica o sexto mês da gravidez de Isabel, mas o versículo não repete esse referente. A tradução conserva a formulação grega, e a nota esclarece a referência contextual sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Da parte de Deus» preserva a procedência expressa por ἀπό sem reduzir a frase a uma indicação de agência.
