  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: pt
  text: Naqueles dias, Maria levantou-se e foi apressadamente para a região montanhosa[a], a uma cidade de Judá[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para a região das colinas». A expressão grega designa uma região elevada ou montanhosa.
    reason: lexical_alternative
  - marker: b
    text: Ou «a um povoado de Judá» ou «a uma cidade da Judeia». O grego πόλις pode designar cidade ou povoado, e Ἰούδα pode referir-se a Judá ou à Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι indica uma ação anterior e ligada ao verbo principal; «se levantou» preserva a sequência narrativa sem transformá-lo interpretativamente em «partiu».
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ marca uma transição narrativa leve. Em português, a continuidade é transmitida naturalmente pela expressão temporal inicial, sem necessidade de acrescentar «ora» ou «então».
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: Naqueles dias
  rationale: Equivalente temporal corrente que preserva a referência demonstrativa de ταύταις.
- source_word: ἐπορεύθη
  choice: foi
  rationale: πορεύομαι significa aqui ir ou viajar; «foi» é natural e suficientemente amplo.
- source_word: εἰς τὴν ὀρεινὴν
  choice: para a região montanhosa
  rationale: O adjetivo substantivado ὀρεινή designa a região elevada ou montanhosa; esta formulação é clara e geograficamente neutra.
- source_word: μετὰ σπουδῆς
  choice: sem demora
  rationale: σπουδή pode indicar pressa, diligência ou empenho. No contexto da viagem, «sem demora» comunica prontidão sem sugerir necessariamente deslocamento fisicamente apressado.
- source_word: εἰς πόλιν Ἰούδα
  choice: a uma cidade de Judá
  rationale: πόλις pode designar cidade ou povoado; «cidade» conserva seu equivalente mais direto, enquanto «de Judá» mantém a forma regional ou tribal do genitivo sem identificar uma localidade específica.
theological_decisions:
- issue: Identificação de Ἰούδα
  choice: Judá como designação regional ou tribal
  alternative: Judeia como designação regional; ou uma cidade chamada Judá
  rationale: No contexto, Ἰούδα refere-se mais naturalmente à região associada a Judá. Manter «Judá» fica próximo da forma grega e evita resolver a expressão como o nome próprio de uma cidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa do grego foi preservada, e a vírgula final acompanha o fato de o versículo continuar na frase seguinte.
