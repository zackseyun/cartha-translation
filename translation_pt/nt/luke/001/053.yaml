  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: pt
  text: Encheu os que têm fome de coisas boas e mandou embora os ricos vazios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: os que têm fome
  rationale: Particípio presente substantivado. A formulação é natural e clara em português, preservando a referência concreta a pessoas famintas sem intensificar o sentido para “os que passam fome”.
- source_word: ἐνέπλησεν
  choice: encheu
  rationale: O aoristo indica a ação decisiva celebrada no Magnificat. O pretérito perfeito é a forma portuguesa natural e mantém o paralelismo com “mandou embora”.
- source_word: ἀγαθῶν
  choice: de coisas boas
  rationale: O genitivo expressa aquilo com que os famintos foram enchidos. “Coisas boas” é direto e não acrescenta a ideia de dádivas, ausente do adjetivo substantivado.
- source_word: πλουτοῦντας
  choice: os ricos
  rationale: Particípio presente substantivado, traduzido de modo conciso e idiomático, mantendo o contraste social concreto com os que têm fome.
- source_word: ἐξαπέστειλεν
  choice: mandou embora
  rationale: Expressa naturalmente em português o ato de fazer alguém partir, preservando a força do verbo composto sem sugerir necessariamente uma despedida formal.
- source_word: κενούς
  choice: de mãos vazias
  rationale: O adjetivo predicativo descreve o estado em que os ricos foram mandados embora. A expressão idiomática portuguesa comunica claramente que partiram sem receber nada; a imagem das mãos é uma explicitação convencional do sentido contextual.
theological_decisions:
- issue: Reversão socioteológica no cântico de Maria
  choice: Manter o contraste concreto entre “os que têm fome” e “os ricos”.
  alternative: Interpretar os termos como “os espiritualmente necessitados” e “os autossuficientes” ou “orgulhosos”.
  rationale: O grego nomeia concretamente pessoas famintas e pessoas ricas. A tradução preserva a tensão social e teológica da reversão divina sem reduzir os termos a uma alegoria espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das duas ações e o paralelismo do original foram preservados. Não se acrescentou pronome sujeito, pois o contexto identifica Deus e o português permite sujeito elíptico com naturalidade.
