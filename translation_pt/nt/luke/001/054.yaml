  text: ἀντελάβετο Ἰσραὴλ παιδὸς αὐτοῦ, μνησθῆναι ἐλέους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: pt
  text: Ele veio em auxílio de Israel, seu servo[a], lembrando-se da misericórdia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Israel, seu filho». A palavra grega pode significar «servo» ou «filho»; aqui, «servo» é preferível por refletir o padrão do Antigo Testamento de chamar Israel de servo de Deus.
    reason: lexical_alternative
  - marker: b
    text: «Misericórdia» também pode incluir a ideia de misericórdia ligada à aliança ou de fidelidade compassiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: veio em auxílio de
  rationale: O verbo descreve tomar alguém sob seu cuidado para ajudar ou sustentar. A expressão é natural em português e comunica com clareza a intervenção salvadora de Deus.
- source_word: Ἰσραὴλ
  choice: Israel
  rationale: Mantém o nome próprio; no contexto, designa coletivamente o povo de Israel.
- source_word: παιδὸς
  choice: servo
  rationale: παῖς pode significar tanto «servo» como «filho/criança». Aqui, «servo» preserva melhor o pano de fundo veterotestamentário em que Israel é chamado servo de Deus, sem ocultar a alternativa lexical.
- source_word: αὐτοῦ
  choice: seu
  rationale: 'Pronome possessivo referente a Deus: Israel é seu servo.'
- source_word: μνησθῆναι
  choice: lembrando-se
  rationale: O infinitivo aoristo liga a ajuda divina ao ato de recordar. O gerúndio produz uma formulação portuguesa natural, sem decidir rigidamente entre circunstância, propósito e resultado.
- source_word: ἐλέους
  choice: misericórdia
  rationale: Equivalente direto que abrange compaixão e pode, neste contexto, evocar a fidelidade misericordiosa ligada à aliança.
theological_decisions:
- issue: Sentido de παῖς aplicado a Israel
  choice: Israel, seu servo
  alternative: Israel, seu filho
  rationale: «Servo» conserva a ressonância bíblica de Israel como servo do Senhor. Como παῖς também pode significar «filho», a ambiguidade legítima é registrada em nota.
- issue: Relação de μνησθῆναι ἐλέους com a ação principal
  choice: lembrando-se da misericórdia
  alternative: para se lembrar da misericórdia; em lembrança da misericórdia
  rationale: A construção mantém compacta a ligação entre o auxílio prestado a Israel e a lembrança divina, sem impor uma classificação sintática ou teológica excessivamente precisa.
- issue: Nuance de ἔλεος
  choice: misericórdia
  alternative: amor leal; fidelidade compassiva
  rationale: «Misericórdia» traduz diretamente o termo, enquanto a possível dimensão de fidelidade à aliança é indicada na nota, em vez de ser acrescentada ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Veio em auxílio de» evita tanto a formulação excessivamente genérica «ajudou» quanto o literalismo pouco natural «tomou pela mão». Os marcadores de nota aparecem no texto.
