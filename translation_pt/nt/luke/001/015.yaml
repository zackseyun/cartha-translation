id: LUK.1.15
reference: Luke 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: pt
  text: Pois ele será grande diante do Senhor e não beberá vinho nem bebida forte[a], e será cheio do Espírito Santo já desde o ventre de sua mãe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bebida forte” se refere a bebida alcoólica diferente do vinho. A expressão grega “não beberá” é enfática e também pode ser traduzida por “certamente não beberá”; no contexto de sua consagração, pode também sugerir que ele jamais deverá beber.
    reason: lexical_alternative
  - marker: b
    text: Ou “ainda no ventre de sua mãe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: grande
  rationale: Equivalente direto e transparente, que preserva a ideia de grandeza e importância sem especificar indevidamente sua natureza.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: diante do Senhor
  rationale: Expressão natural em português que conserva o sentido de estar perante Deus e ser considerado à sua vista.
- source_word: οἶνον καὶ σίκερα
  choice: vinho nem bebida forte
  rationale: “Vinho” traduz οἶνος diretamente; “bebida forte” mantém a amplitude de σίκερα para bebidas alcoólicas que não fossem vinho, sem restringi-lo a uma bebida específica.
- source_word: οὐ μὴ πίῃ
  choice: não beberá
  rationale: O futuro negativo preserva a forma de anúncio profético; a construção grega é enfática, nuance registrada em nota sem convertê-la silenciosamente em uma ordem explícita.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: No uso de Lucas, a expressão se refere ao Espírito divino; o artigo é exigido pelo idioma português nesta construção.
- source_word: πλησθήσεται
  choice: será cheio
  rationale: Preserva o futuro passivo e a noção de ação recebida.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: já desde o ventre de sua mãe
  rationale: “Já” expressa a ênfase de ἔτι, e “desde o ventre” mantém a possível abrangência temporal sem definir com precisão maior do que a permitida pelo grego.
theological_decisions:
- issue: Força de οὐ μὴ πίῃ no anúncio profético
  choice: “não beberá”, com nota sobre a negação enfática
  alternative: “jamais deverá beber” ou “certamente não beberá”
  rationale: A forma principal conserva o caráter futuro do anúncio, enquanto a nota registra sua forte ênfase e a possível nuance de exigência ligada à consagração de João.
- issue: Referente de πνεύματος ἁγίου
  choice: “do Espírito Santo”, como referente divino pessoal
  alternative: “de espírito santo”, entendido como força ou disposição impessoal
  rationale: O contexto e o uso de Lucas favorecem claramente a referência ao Espírito divino.
- issue: Momento indicado por ἔτι ἐκ κοιλίας
  choice: “já desde o ventre de sua mãe”
  alternative: “ainda no ventre de sua mãe”
  rationale: A redação preserva a amplitude da construção, que pode apontar para o período no ventre ou para a origem temporal desde esse período, sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a cadência do anúncio e a repetição coordenada do grego, evitando tanto arcaísmos quanto explicitação doutrinária excessiva.
