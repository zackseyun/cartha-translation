  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: pt
  text: E suscitou para nós um chifre de salvação na casa de Davi, seu servo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um poderoso Salvador”. Literalmente, “um chifre de salvação”, imagem bíblica de força e poderosa libertação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: levantou
  rationale: O aoristo celebra a ação salvadora de Deus como realizada. “Levantou” preserva o idioma bíblico de suscitar ou fazer surgir um libertador e soa natural neste cântico.
- source_word: κέρας σωτηρίας
  choice: um chifre de salvação
  rationale: Mantém a metáfora bíblica concreta de força e poder vitorioso que traz libertação, bem como a forma genitiva do grego e suas ressonâncias veterotestamentárias.
- source_word: ἡμῖν
  choice: para nós
  rationale: Expressa o dativo de vantagem, destacando que a ação divina ocorre em nosso benefício.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: na casa de Davi
  rationale: Conserva a preposição e a imagem bíblica da casa como linhagem ou dinastia, especialmente apropriada à promessa davídica.
- source_word: παιδὸς αὐτοῦ
  choice: seu servo
  rationale: Referido a Davi, παῖς tem aqui o sentido bíblico de servo de Deus; “criança” ou “filho” induziria a uma leitura inadequada.
theological_decisions:
- issue: Preservar a metáfora “chifre de salvação” ou interpretá-la como um título pessoal
  choice: Preservar “um chifre de salvação” no texto principal.
  alternative: um poderoso Salvador
  rationale: O grego emprega uma imagem bíblica ligada à força régia e à libertação vitoriosa. Preservá-la mantém a continuidade literária e teológica sem restringir silenciosamente seu sentido a uma paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo e a metáfora bíblica; a nota esclarece a imagem potencialmente pouco familiar sem substituí-la no texto.
