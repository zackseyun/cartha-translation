  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: pt
  text: 'E disseram a ela: “Não há ninguém entre os seus parentes que tenha esse nome.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: disseram a ela
  rationale: A expressão traduz naturalmente o aoristo de λέγω e πρός com acusativo, que identifica a pessoa a quem se dirigiram.
- source_word: Οὐδείς ἐστιν
  choice: não há ninguém
  rationale: Em português corrente, a construção existencial comunica com naturalidade que nenhuma pessoa do grupo satisfaz a descrição seguinte.
- source_word: ἐκ τῆς συγγενείας σου
  choice: entre os seus parentes
  rationale: συγγένεια designa o círculo de parentesco; “entre os seus parentes” representa de modo idiomático o valor partitivo de ἐκ.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: que tenha esse nome
  rationale: No contexto de dar nome a uma criança, καλεῖται com o dativo de ὄνομα significa ser chamado ou ter determinado nome. A formulação escolhida é clara e natural em português, e “esse” remete ao nome mencionado pela interlocutora.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. “Parentes” preserva a referência explícita ao grupo de parentesco, sem ampliar necessariamente o sentido para toda a família ou casa.
