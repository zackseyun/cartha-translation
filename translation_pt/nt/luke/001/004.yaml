id: LUK.1.4
reference: Luke 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ἐπιγνῷς περὶ ὧν κατηχήθης λόγων τὴν ἀσφάλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/004.yaml
  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: pt
  text: para que você reconheça a certeza[a] das coisas que lhe foram ensinadas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a confiabilidade”; o substantivo grego pode indicar certeza, segurança ou caráter digno de confiança.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre as quais você foi instruído”; o verbo grego está na origem do termo “catequizar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a oração de propósito de Lucas, preservando sua força final.
- source_word: ἐπιγνῷς
  choice: você reconheça
  rationale: O aoristo do subjuntivo de ἐπιγινώσκω, após ἵνα, expressa o propósito. “Reconheça” comunica conhecimento seguro ou confirmado sem exagerar uma possível força intensiva do verbo composto.
- source_word: περὶ ὧν ... λόγων
  choice: das coisas que
  rationale: A construção se refere ao conteúdo da instrução recebida. “Das coisas que” é natural em português e evita o literalismo pouco claro de “das palavras acerca das quais”.
- source_word: κατηχήθης
  choice: lhe foram ensinadas
  rationale: O passivo de κατηχέω indica que Teófilo recebeu instrução, provavelmente oral. “Foram ensinadas” preserva o sentido sem importar o uso eclesiástico posterior de “catequizar”.
- source_word: τὴν ἀσφάλειαν
  choice: a certeza
  rationale: ἀσφάλεια pode indicar certeza, segurança ou confiabilidade. “Certeza” preserva aqui tanto a firmeza objetiva do ensino quanto a segurança que Teófilo pode ter a respeito dele.
theological_decisions:
- issue: Natureza do propósito declarado por Lucas ao escrever
  choice: Lucas escreve para que Teófilo reconheça a certeza do ensino recebido, sem limitar essa certeza à confiança subjetiva ou à confiabilidade objetiva.
  alternative: Traduzir exclusivamente como “segurança” subjetiva ou como “confiabilidade” histórica objetiva.
  rationale: A amplitude semântica de ἀσφάλεια comporta ambas as dimensões. A tradução mantém essa tensão epistemológica e teológica sem resolvê-la indevidamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal “lhe foram ensinadas” é natural em registro escrito amplo. A formulação evita terminologia eclesiástica posterior no texto principal e conserva em nota as alternativas lexicais relevantes.
