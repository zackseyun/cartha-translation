  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: pt
  text: assim como nos transmitiram os que foram testemunhas oculares desde o princípio e se tornaram servidores da palavra,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensagem”. A palavra grega λόγος pode significar “palavra”, “mensagem” ou “relato”; aqui provavelmente se refere à mensagem proclamada a respeito de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: assim como
  rationale: Introduz a correspondência com a afirmação do versículo anterior de modo natural e fiel.
- source_word: παρέδοσαν ἡμῖν
  choice: nos transmitiram
  rationale: Expressa a transmissão de tradição ou informação recebida; o pronome dativo é vertido naturalmente por “nos”.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: os que, desde o princípio
  rationale: Preserva tanto a identificação do grupo quanto a referência temporal.
- source_word: αὐτόπται
  choice: testemunhas oculares
  rationale: Comunica com precisão que essas pessoas observaram os acontecimentos diretamente.
- source_word: ὑπηρέται γενόμενοι
  choice: se tornaram servidores
  rationale: Mantém o valor de mudança ou passagem expresso por γενόμενοι e evita sugerir um cargo eclesiástico formal.
- source_word: τοῦ λόγου
  choice: da palavra
  rationale: Preserva a amplitude lexical de λόγος e sua formulação tradicional, enquanto uma nota registra a alternativa contextual “mensagem”.
theological_decisions:
- issue: Referente de τοῦ λόγου
  choice: “a palavra”, provavelmente no sentido da mensagem proclamada a respeito de Jesus
  alternative: “a mensagem” ou “o relato”
  rationale: O contexto favorece a proclamação sobre Jesus, não o uso de Logos como título cristológico; a tradução principal mantém a expressão mais formal sem eliminar sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática natural. “Servidores” evita a conotação de cargo clerical que “ministros” poderia introduzir. O objeto de “transmitiram” permanece implícito, como no grego e em continuidade com o versículo anterior.
