  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: pt
  text: Eles não tinham nenhum filho, porque Isabel era estéril, e ambos já tinham idade avançada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “haviam avançado em seus dias”.
    reason: Registra a forma concreta do idioma grego subjacente à tradução natural “tinham idade avançada”.
lexical_decisions:
- source_word: τέκνον
  choice: nenhum filho
  rationale: O singular grego é preservado, enquanto “não tinham nenhum filho” expressa com naturalidade em português a construção possessiva οὐκ ἦν αὐτοῖς.
- source_word: καθότι
  choice: porque
  rationale: Introduz de modo claro e direto a causa de não terem filhos.
- source_word: στεῖρα
  choice: estéril
  rationale: Indica especificamente infertilidade e distingue a condição de Isabel do resultado, já declarado, de o casal não ter filhos.
- source_word: ἀμφότεροι
  choice: ambos
  rationale: Mantém a ênfase de que a descrição se aplica conjuntamente a Zacarias e Isabel.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: já tinham idade avançada
  rationale: Traduz o sentido idiomático de que eram idosos com linguagem respeitosa, clara e natural, enquanto a nota registra a imagem literal.
- source_word: οὐκ ἦν αὐτοῖς
  choice: não tinham
  rationale: A construção grega, literalmente “não havia para eles”, é um modo idiomático de indicar posse e se expressa naturalmente em português por “não tinham”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Estéril” mantém a precisão do texto sem substituir a condição pela consequência; “idade avançada” evita uma formulação brusca.
