base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: pt
  text: Aconteceu que, enquanto ele prestava serviço sacerdotal diante de Deus, segundo a ordem de sua divisão,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: A fórmula narrativa introduz um novo desenvolvimento. Em português, “Aconteceu que” transmite essa função de modo natural; o δέ funciona como conexão narrativa leve, sem exigir uma conjunção separada.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: enquanto ele exercia o sacerdócio
  rationale: A construção com infinitivo articular tem valor temporal. “Exercia o sacerdócio” expressa especificamente o serviço próprio do sacerdote em linguagem clara e digna.
- source_word: τάξει
  choice: vez
  rationale: No contexto, indica a ordem estabelecida em que cada divisão sacerdotal prestava serviço. “Na vez de” comunica naturalmente o turno ordenado, evitando a possível ambiguidade de “ordem” em português.
- source_word: ἐφημερίας
  choice: divisão
  rationale: Designa o grupo sacerdotal organizado para servir segundo uma escala. “Divisão” preserva o caráter institucional do termo.
- source_word: ἔναντι τοῦ θεοῦ
  choice: diante de Deus
  rationale: Expressão concisa e tradicionalmente inteligível para o serviço realizado na presença de Deus.
theological_decisions:
- issue: Terminologia cultual para o serviço de Zacarias
  choice: exercia o sacerdócio diante de Deus, na vez de sua divisão
  alternative: prestava serviço sacerdotal diante de Deus, segundo o turno de sua divisão
  rationale: A formulação mantém o cenário histórico do serviço sacerdotal no templo sem importar conceitos eclesiásticos posteriores. “Vez de sua divisão” conserva tanto a escala quanto o grupo sacerdotal, embora “turno” seja uma alternativa explicativa possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo forma uma oração que prossegue no contexto imediato.
