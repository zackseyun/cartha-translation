  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: pt
  text: “Pois foi assim que o Senhor agiu comigo, nos dias em que olhou para mim, para remover a minha desonra[a] entre as pessoas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu opróbrio” ou “a minha vergonha”. O termo grego enfatiza a desonra ou a perda de honra no âmbito social.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ou o conteúdo da declaração de Isabel em ligação com o versículo anterior; “pois” mantém essa conexão com naturalidade em português.
- source_word: Οὕτως μοι πεποίηκεν
  choice: foi assim que ... agiu comigo
  rationale: Preserva a ênfase de Οὕτως na maneira da ação e expressa de forma idiomática o verbo amplo ποιέω com o dativo μοι.
- source_word: κύριος
  choice: o Senhor
  rationale: Mantém o título divino tradicional e adequado ao contexto, no qual Isabel fala da ação de Deus.
- source_word: ἐν ἡμέραις αἷς
  choice: nos dias em que
  rationale: Reproduz de modo próximo e natural a construção temporal relativa do grego.
- source_word: ἐπεῖδεν
  choice: olhou para mim
  rationale: Conserva a imagem verbal de olhar com atenção ou consideração; “mim” é recuperado naturalmente do contexto e de μοι.
- source_word: ἀφελεῖν
  choice: para tirar
  rationale: Expressa o infinitivo como propósito ou resultado sem eliminar a ambiguidade sintática entre essas nuances.
- source_word: ὄνειδός μου
  choice: o meu opróbrio
  rationale: “Opróbrio” preserva a dimensão externa e social de censura e desonra, em vez de reduzir o termo a um sentimento interior de vergonha.
- source_word: ἐν ἀνθρώποις
  choice: entre as pessoas
  rationale: Indica a esfera social em que o opróbrio era vivido e usa linguagem inclusiva correspondente ao sentido genérico de ἄνθρωποι.
theological_decisions:
- issue: Referente de κύριος
  choice: “o Senhor” refere-se a Deus
  alternative: Nenhuma alternativa contextual importante
  rationale: Isabel descreve a ação divina que removeu o estigma social de sua esterilidade; a tradução mantém o título sem introduzir uma leitura cristológica mais estreita neste contexto imediato.
- issue: Sentido social de ὄνειδος
  choice: o meu opróbrio
  alternative: a minha desonra; a minha vergonha
  rationale: O contexto aponta para uma desonra percebida socialmente. “Opróbrio” conserva essa dimensão pública, enquanto “vergonha” pode ser entendida principalmente como emoção interior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a conexão discursiva com o versículo anterior, conserva a metáfora do olhar divino e evita explicar além do que o grego afirma.
