id: LUK.1.6
reference: Luke 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: pt
  text: E ambos eram justos diante de Deus[a] e viviam de modo irrepreensível, obedecendo a todos os mandamentos e preceitos do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos olhos de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: E ... eram
  rationale: δέ funciona como conexão narrativa leve; “E” mantém a continuidade sem introduzir contraste indevido.
- source_word: δίκαιοι
  choice: justos
  rationale: “Justos” preserva o sentido moral e pactual de δίκαιοι e é expressão natural no português bíblico contemporâneo.
- source_word: ἀμφότεροι
  choice: ambos
  rationale: Expressa de forma concisa que a descrição se aplica igualmente a Zacarias e Isabel.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: diante de Deus
  rationale: 'Conserva o sentido relacional e avaliativo: eram justos perante Deus, e não apenas segundo a opinião humana.'
- source_word: πορευόμενοι
  choice: vivendo
  rationale: Neste contexto ético, o particípio descreve a maneira de viver. “Vivendo” comunica naturalmente em português o sentido figurado de caminhar ou conduzir-se.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: em todos os mandamentos
  rationale: Mantém a abrangência de πάσαις e representa a conduta dentro da esfera dos mandamentos, sem explicitar além do texto a ideia de obediência.
- source_word: δικαιώμασιν
  choice: preceitos
  rationale: “Preceitos” designa determinações estabelecidas e mantém, tanto quanto possível em português corrente, a distinção em relação a “mandamentos”.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: É a forma natural de traduzir o genitivo e preserva o título divino aplicado ao Deus de Israel.
- source_word: ἄμεμπτοι
  choice: de modo irrepreensível
  rationale: O adjetivo plural qualifica a conduta descrita pelo particípio. A formulação adverbial produz uma frase natural e comunica vida não passível de censura sem enfraquecer o termo.
theological_decisions:
- issue: Se ἄμεμπτοι afirma ausência absoluta de pecado
  choice: Manter a forte caracterização da conduta como “irrepreensível”, sem acrescentar uma explicação doutrinária ao versículo.
  alternative: Interpretar ou explicar a expressão como perfeição moral absoluta, ou enfraquecê-la para mera respeitabilidade.
  rationale: O texto caracteriza a conduta de ambos em relação aos mandamentos e preceitos do Senhor. “Irrepreensível” preserva essa afirmação, mas não resolve além do que o texto diz a questão da impecabilidade absoluta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Vivendo” evita um calque pouco natural de πορευόμενοι, enquanto “justos”, “irrepreensível” e “Senhor” preservam o peso bíblico do enunciado.
