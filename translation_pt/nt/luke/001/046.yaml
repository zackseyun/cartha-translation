  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: pt
  text: 'E Maria disse: “Minha alma engrandece o Senhor,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo do grego sem acrescentar uma nuance temporal como “Então”.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente narrativo natural para o aoristo de λέγω.
- source_word: Μαριάμ
  choice: Maria
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Μεγαλύνει
  choice: engrandece
  rationale: Preserva o presente, a força poética e a imagem de declarar ou celebrar alguém como grande; é uma expressão bíblica corrente e inteligível em português.
- source_word: ἡ ψυχή μου
  choice: Minha alma
  rationale: Conserva a expressão poética e antropológica do texto, sem reduzi-la simplesmente a “eu” nem interpretá-la como “meu íntimo”.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Neste contexto, κύριος funciona como título divino reverente e evoca a linguagem bíblica de louvor.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o Soberano
  rationale: “Senhor” preserva o título divino tradicional e o peso intertextual da linguagem de louvor; “Soberano” seria mais interpretativo e estreito.
- issue: Expressão antropológica ἡ ψυχή μου
  choice: Minha alma
  alternative: Eu
  rationale: A formulação mantém a linguagem teológico-poética sem resolver ψυχή em um mero pronome nem impor uma definição técnica de alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A vírgula final foi mantida porque o versículo prossegue na unidade poética seguinte.
