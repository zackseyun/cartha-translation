  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: pt
  text: 'E veja só: Isabel, sua parenta, também concebeu um filho na velhice; e este é o sexto mês para a que é chamada estéril.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: veja
  rationale: Mantém o chamado de atenção do discurso angélico em português atual, sem o tom arcaizante de “eis”.
- source_word: συγγενίς
  choice: parenta
  rationale: Expressa uma mulher ligada por parentesco sem especificar um grau que o grego não informa.
- source_word: συνείληφεν
  choice: concebeu
  rationale: Equivalente direto e natural no contexto de gravidez.
- source_word: ἐν γήρει αὐτῆς
  choice: na velhice
  rationale: Preserva de modo conciso a referência à idade avançada de Isabel.
- source_word: στείρᾳ
  choice: estéril
  rationale: Reproduz o termo descritivo do texto sem acrescentar interpretação.
theological_decisions:
- issue: Identidade exata do parentesco entre Maria e Isabel
  choice: parenta
  alternative: prima
  rationale: O texto grego afirma parentesco, mas não define Isabel especificamente como prima.
- issue: Tempo de τῇ καλουμένῃ στείρᾳ
  choice: era chamada estéril
  alternative: é chamada estéril
  rationale: A formulação portuguesa conserva o valor do particípio e o contraste implícito entre a antiga reputação de esterilidade e a gravidez presente, sem afirmar que o rótulo deixou formalmente de ser usado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “E veja” conserva a força discursiva de καὶ ἰδού; a pontuação organiza naturalmente as duas afirmações sem alterar seu vínculo.
