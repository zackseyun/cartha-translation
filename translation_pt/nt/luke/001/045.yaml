source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: pt
  text: E bem-aventurada aquela que creu que se cumprirá o que lhe foi dito da parte do Senhor[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque se cumprirá o que lhe foi dito da parte do Senhor”. A conjunção grega também pode ter sentido causal, embora aqui seja mais provável que introduza o conteúdo daquilo em que ela creu.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “haverá cumprimento do que lhe foi dito”; também pode ser traduzido por “conclusão” ou “realização”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: bem-aventurada
  rationale: Preserva o peso religioso e declarativo da linguagem de μακάριος em Lucas, sem reduzi-la ao sentimento subjetivo de estar feliz.
- source_word: ἡ πιστεύσασα
  choice: aquela que creu
  rationale: Reproduz naturalmente o particípio aoristo substantivado e mantém a referência ao ato de crer.
- source_word: ὅτι
  choice: que
  rationale: 'Introduz de modo mais provável o conteúdo da fé: ela creu que haveria cumprimento. A leitura causal permanece registrada em nota.'
- source_word: τελείωσις
  choice: se cumprirá
  rationale: Expressa idiomaticamente em português a ideia de levar à plena realização aquilo que foi prometido, ainda que transforme o substantivo grego em construção verbal.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: o que lhe foi dito
  rationale: Conserva o sentido passivo e a referência ao conteúdo anteriormente comunicado a Maria, em português corrente.
- source_word: παρὰ κυρίου
  choice: da parte do Senhor
  rationale: Comunica a origem divina da mensagem com naturalidade e preserva melhor a força de παρά com genitivo do que uma formulação puramente agentiva.
- source_word: κυρίου
  choice: Senhor
  rationale: É a correspondência tradicional e contextual para κύριος, que aqui designa Deus como fonte da promessa.
theological_decisions:
- issue: Relação entre a bem-aventurança de Maria, sua fé e a palavra prometida
  choice: Maria é declarada bem-aventurada por ter crido que a palavra vinda do Senhor se cumpriria.
  alternative: Maria é declarada bem-aventurada porque haverá cumprimento do que lhe foi dito, tomando ὅτι em sentido causal.
  rationale: A sintaxe favorece ὅτι como introdutor do conteúdo de πιστεύσασα, preservando a ênfase lucana na fé na promessa divina sem excluir a alternativa gramatical possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bem-aventurada” mantém a ressonância religiosa do original; “da parte do Senhor” indica origem sem eliminar a possível noção de agência.
