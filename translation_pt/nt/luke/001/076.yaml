id: LUK.1.76
reference: Luke 1:76
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: pt
  text: E você também, menino, será chamado profeta do Altíssimo, pois irá adiante do Senhor[a] para preparar os caminhos dele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença do Senhor”. A expressão pode indicar tanto ir adiante de alguém como servir diante dessa pessoa.
    reason: lexical_alternative
  - marker: b
    text: Estas palavras retomam promessas proféticas sobre preparar o caminho diante do Senhor (compare Is 40:3; Ml 3:1). Na narrativa de Lucas, elas se cumprem no ministério de João, que precedeu o de Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: E você também
  rationale: A formulação marca a transição e dá ênfase ao destinatário, preservando de modo natural a força aditiva da expressão grega.
- source_word: παιδίον
  choice: menino
  rationale: É uma forma natural de dirigir-se ao recém-nascido João e, neste contexto, seu sexo é conhecido. Evita o tom por vezes excessivamente genérico de “criança” no vocativo.
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente português corrente e direto.
- source_word: Ὑψίστου
  choice: do Altíssimo
  rationale: Preserva o título divino reverente e a relação genitiva com “profeta”.
- source_word: κληθήσῃ
  choice: será chamado
  rationale: Mantém a forma passiva e o sentido de designação ou reconhecimento.
- source_word: προπορεύσῃ
  choice: irá adiante
  rationale: Expressa a ação de avançar à frente de alguém e soa natural em português no contexto do precursor.
- source_word: ἐνώπιον κυρίου
  choice: do Senhor
  rationale: Com “irá adiante”, forma a expressão “irá adiante do Senhor”, que comunica o papel precursor. A possível nuance de atuar na presença do Senhor é registrada em nota.
- source_word: ἑτοιμάσαι
  choice: para preparar
  rationale: Explicita naturalmente em português a finalidade expressa pelo infinitivo grego.
- source_word: ὁδοὺς αὐτοῦ
  choice: os caminhos dele
  rationale: Conserva o plural do grego e a ressonância da linguagem profética. “Dele” identifica o possuidor sem tornar o português artificial.
theological_decisions:
- issue: Referente de “o Senhor” na profecia sobre o precursor
  choice: Manter “o Senhor” sem especificar o referente na linha traduzida.
  alternative: Entender explicitamente como Deus, à luz de Isaías e Malaquias, ou como Jesus, à luz do cumprimento narrativo em Lucas.
  rationale: A formulação remete às promessas do Antigo Testamento sobre preparar o caminho diante do Senhor, enquanto a narrativa de Lucas apresenta João como precursor de Jesus. A tradução preserva essa tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência profética é preservada sem arcaísmos; os marcadores [a] e [b] aparecem no texto principal.
