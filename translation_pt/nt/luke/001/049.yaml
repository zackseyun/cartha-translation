  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: pt
  text: porque o Poderoso fez grandes coisas em meu favor, e santo é o seu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o seu nome é santo”. No grego, “santo” vem antes de “seu nome” para dar ênfase.'
    reason: Alternativa de ordem das palavras e explicação da ênfase no grego.
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a causa do louvor de Maria no versículo anterior e preserva com clareza a força causal.
- source_word: ἐποίησέν
  choice: fez
  rationale: O aoristo apresenta a ação divina como realizada; o pretérito perfeito é a forma natural em português neste contexto.
- source_word: μοι
  choice: por mim
  rationale: 'O dativo tem sentido benefactivo: as grandes coisas foram feitas em favor de Maria.'
- source_word: μεγάλα
  choice: grandes coisas
  rationale: O adjetivo neutro plural é usado substantivamente; esta expressão mantém sua amplitude sem especificar demais os atos de Deus.
- source_word: ὁ δυνατός
  choice: o Poderoso
  rationale: O adjetivo com artigo funciona como designação substantivada de Deus; a forma é concisa, reverente e natural em português.
- source_word: ἅγιον
  choice: santo
  rationale: Mantém o sentido de santidade e separação próprio do termo, além de sua posição enfática antes de 'nome'.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o seu nome
  rationale: É uma tradução idiomática que conserva a referência textual ao nome de Deus.
theological_decisions:
- issue: Tradução de ὁ δυνατός como título divino
  choice: o Poderoso
  alternative: aquele que é poderoso
  rationale: O artigo substantiva o adjetivo, que funciona como uma designação reverente de Deus. A inicial maiúscula sinaliza esse uso titular sem acrescentar conteúdo doutrinário.
- issue: Ordem das palavras em καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: e santo é o seu nome
  alternative: e o seu nome é santo
  rationale: A formulação preserva a anteposição enfática de 'santo' no grego e continua natural no registro poético e reverente do cântico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem 'santo é o seu nome' conserva a ênfase e o tom poético sem recorrer a linguagem arcaica.
