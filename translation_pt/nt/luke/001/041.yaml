reference: Luke 1:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: pt
  text: E aconteceu que, quando Isabel ouviu a saudação de Maria, o bebê saltou em seu ventre, e Isabel foi cheia do Espírito Santo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu
  rationale: Preserva a fórmula narrativa característica de Lucas em português atual, sem recorrer ao arcaico «sucedeu».
- source_word: ὡς
  choice: quando
  rationale: Neste contexto temporal com verbo no aoristo, indica naturalmente o momento em que a ação seguinte ocorreu.
- source_word: ἀσπασμός
  choice: saudação
  rationale: Designa as palavras com que Maria saudou Isabel; «saudação» é claro, corrente e digno em português.
- source_word: Μαρίας
  choice: de Maria
  rationale: Expressa naturalmente em português o genitivo que identifica Maria como autora da saudação.
- source_word: ἐσκίρτησεν
  choice: saltou
  rationale: Comunica o movimento súbito e vivo indicado pelo verbo, com mais força do que «mexeu-se».
- source_word: βρέφος
  choice: bebê
  rationale: Refere-se aqui a João ainda no ventre; «bebê» é concreto, preciso e de leitura natural sobretudo no português brasileiro.
- source_word: κοιλίᾳ
  choice: ventre
  rationale: No contexto da gestação, «ventre» expressa com precisão e dignidade o sentido de útero materno.
- source_word: ἐπλήσθη
  choice: foi cheia
  rationale: Mantém a forma passiva e apresenta o enchimento como um acontecimento, sem explicitar um agente que o grego deixa implícito.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: Em Lucas–Atos, a expressão normalmente se refere ao Espírito divino; o artigo e as maiúsculas são a forma idiomática de expressar esse referente em português.
theological_decisions:
- issue: Referente de πνεύματος ἁγίου
  choice: o Espírito Santo, entendido como o Espírito divino
  alternative: um espírito santo
  rationale: O uso recorrente da expressão em Lucas–Atos e o contexto de inspiração profética favorecem o referente divino. A tradução não acrescenta uma explicação doutrinária ao texto.
- issue: Tradução de βρέφος para João ainda não nascido
  choice: bebê
  alternative: criança; infante
  rationale: O termo grego designa uma criança muito pequena e, neste contexto, refere-se concretamente a João no ventre. «Bebê» conserva essa referência sem comentário teológico adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das orações acompanha de perto o grego, mas a pontuação segue o fluxo natural do português. Não se acrescentou nota para «saudação», pois a alternativa «cumprimento» não altera significativamente o sentido.
