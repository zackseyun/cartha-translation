  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: pt
  text: Chegou o tempo de Isabel dar à luz[a], e ela deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “completou-se o tempo de Isabel dar à luz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não traduzido separadamente
  rationale: Conector discursivo leve que marca a progressão narrativa; em português, o fluxo do contexto dispensa um conectivo explícito aqui.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: Chegou o tempo
  rationale: Expressa de modo natural em português a conclusão do período indicado pela formulação grega literalmente equivalente a ‘o tempo se completou’. A forma mais literal é preservada em nota.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: de Isabel dar à luz
  rationale: O infinitivo articular refere-se ao parto; repetir o nome evita uma construção pronominal pesada e deixa claro que Isabel é o sujeito.
- source_word: ἐγέννησεν
  choice: ela deu à luz
  rationale: Verbo narrativo no aoristo que descreve o parto como acontecimento concluído; esta é a expressão corrente e digna em português.
- source_word: υἱόν
  choice: um filho
  rationale: Preserva a referência específica a um descendente do sexo masculino.
- source_word: Ἐλισάβετ
  choice: Isabel
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
