id: LUK.1.22
reference: Luke 1:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: pt
  text: Mas, quando saiu, ele não conseguia falar com eles, e perceberam que tinha tido uma visão no santuário[a]. Ele continuava fazendo sinais para eles e permaneceu mudo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo”. A palavra grega designa aqui mais especificamente o santuário propriamente dito, e não todo o complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega traduzida como “mudo” também pode, em alguns contextos, indicar surdez.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: quando saiu
  rationale: O particípio aoristo anterior ao verbo principal é expresso naturalmente como oração temporal, preservando a sequência narrativa.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: não conseguia falar
  rationale: Expressa de modo natural a incapacidade indicada por δύναμαι com o infinitivo λαλῆσαι.
- source_word: ἐπέγνωσαν
  choice: perceberam
  rationale: No contexto, o verbo indica que chegaram a uma conclusão clara a partir do estado e dos gestos de Zacarias.
- source_word: ὀπτασίαν ἑώρακεν
  choice: tinha tido uma visão
  rationale: Comunica com clareza uma experiência visual de caráter sobrenatural e preserva a anterioridade indicada pelo perfeito grego, sem a redundância pouco natural de 'ver uma visão'.
- source_word: ἐν τῷ ναῷ
  choice: no santuário
  rationale: ναός designa mais especificamente o recinto sagrado propriamente dito, e não todo o complexo do templo.
- source_word: ἦν διανεύων
  choice: continuava fazendo sinais
  rationale: A construção perifrástica no imperfeito indica ação contínua; esta formulação conserva seu aspecto durativo.
- source_word: διέμενεν
  choice: permaneceu
  rationale: Expressa concisamente a continuidade do estado de Zacarias.
- source_word: κωφός
  choice: mudo
  rationale: O contexto imediato enfatiza a incapacidade de falar. 'Mudo' evita repetição e não acrescenta explicitamente surdez, embora essa possibilidade lexical seja registrada em nota.
theological_decisions:
- issue: Sentido de κωφός no juízo imposto a Zacarias
  choice: mudo
  alternative: surdo e mudo; incapaz de falar
  rationale: O versículo destaca que Zacarias não conseguia falar e recorria a sinais. Como κωφός pode também envolver surdez em certos contextos, a tradução principal mantém o foco narrativo imediato e a nota preserva a amplitude lexical sem resolver além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita literalismos pouco naturais, preserva a progressão narrativa e mantém a possível abrangência de κωφός em nota. Os marcadores foram posicionados junto aos termos a que suas respectivas notas se referem.
