  - severity: low
    issue: “Com o nascimento dele” é menos preciso para ἐπὶ τῇ γενέσει αὐτοῦ.
    rationale: A construção grega pode indicar a ocasião ou a base da alegria. “Por ocasião do nascimento dele” representa claramente a leitura ocasional no texto, e a nota registra a alternativa causal.
  revised_text: Você terá alegria e júbilo, e muitos se alegrarão por ocasião do nascimento dele.[a]
