  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: pt
  text: Você terá alegria e júbilo, e muitos se alegrarão por ocasião do nascimento dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do nascimento dele”. A expressão grega pode indicar tanto a ocasião da alegria quanto o seu motivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται ... σοι
  choice: Você terá
  rationale: Expressa de modo natural em português a construção grega que literalmente indica que alegria e júbilo existirão para o destinatário.
- source_word: χαρά
  choice: alegria
  rationale: Equivalente comum e claro, preservando o substantivo do original.
- source_word: ἀγαλλίασις
  choice: grande júbilo
  rationale: Distingue o termo de χαρά e comunica sua intensidade festiva sem recorrer a uma formulação pouco corrente.
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz naturalmente o adjetivo substantivado grego sem acrescentar um referente não expresso.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: com o nascimento dele
  rationale: A preposição ἐπί com dativo pode apontar para a ocasião ou o motivo da alegria; a formulação portuguesa mantém razoavelmente essa abertura.
- source_word: χαρήσονται
  choice: se alegrarão
  rationale: Representa o futuro de χαίρω e mantém a ligação lexical com χαρά.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Grande júbilo” preserva a distinção e a intensidade entre os dois substantivos, enquanto “com o nascimento dele” evita resolver indevidamente a ambiguidade de ἐπί com dativo.
