id: LUK.1.11
reference: Luke 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: pt
  text: Então um anjo do Senhor lhe apareceu, em pé à direita do altar do incenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu
  rationale: O aoristo passivo de ὁράω funciona aqui com sentido intransitivo de manifestação visível; “apareceu” é natural em português e preserva o caráter repentino do acontecimento.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ dá continuidade à narrativa; “Então” expressa naturalmente a progressão sequencial, sem introduzir contraste indevido.
- source_word: αὐτῷ
  choice: a ele
  rationale: O dativo identifica aquele a quem o anjo apareceu; “apareceu a ele” mantém esse destinatário explícito.
- source_word: ἄγγελος
  choice: um anjo
  rationale: No contexto de uma manifestação no templo, trata-se claramente de um ser celestial, de modo que “anjo” é mais adequado que o termo geral “mensageiro”.
- source_word: κυρίου
  choice: do Senhor
  rationale: A construção genitiva ἄγγελος κυρίου é vertida naturalmente como “um anjo do Senhor”, preservando o título bíblico κύριος.
- source_word: ἑστὼς
  choice: em pé
  rationale: O particípio perfeito de ἵστημι descreve a postura do anjo no momento da aparição; “em pé” é claro e idiomático em português.
- source_word: ἐκ δεξιῶν
  choice: à direita
  rationale: A expressão indica posição no lado direito; “à direita” é conciso, natural e mantém o sentido locativo.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: “Altar” é o equivalente português estabelecido para θυσιαστήριον.
- source_word: τοῦ θυμιάματος
  choice: do incenso
  rationale: O genitivo identifica o altar destinado ao incenso; “altar do incenso” é uma formulação convencional, clara e exata.
theological_decisions:
- issue: Tradução de κύριος na expressão ἄγγελος κυρίου
  choice: Senhor
  alternative: senhor
  rationale: “Senhor” preserva o título divino tradicional no contexto, sem acrescentar uma identificação doutrinária além da que a expressão grega permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, sem eliminar nenhum elemento semântico do grego.
