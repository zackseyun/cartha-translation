  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: pt
  text: Ao vê-lo, Zacarias ficou perturbado, e o medo caiu sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: ficou perturbado
  rationale: O aoristo passivo de ταράσσω indica que Zacarias foi interiormente abalado ou agitado. “Ficou perturbado” é natural em português e não antecipa nem intensifica indevidamente o medo mencionado em seguida.
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἰδών
  choice: Ao vê-lo
  rationale: O particípio aoristo tem valor temporal no contexto. “Ao vê-lo” expressa isso com concisão e retoma naturalmente o anjo mencionado no versículo anterior.
- source_word: φόβος
  choice: o medo
  rationale: φόβος designa de modo geral o medo; esta escolha direta evita a intensificação interpretativa de opções como “terror” ou “pavor”.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: caiu sobre ele
  rationale: Preserva a imagem do idioma grego ἐπιπίπτω com ἐπί e permanece clara e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para “Ao vê-lo” no início, reproduzindo naturalmente o valor temporal do particípio grego sem necessidade de nota. A imagem literal de o medo cair sobre alguém foi preservada.
