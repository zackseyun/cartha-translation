id: LUK.1.27
reference: Luke 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: pt
  text: a uma virgem prometida em casamento[a] a um homem chamado José, da casa de Davi; e o nome da virgem era Maria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desposada”. O termo grego indica um compromisso matrimonial formal, anterior à plena vida conjugal.
    reason: lexical_alternative
  - marker: b
    text: Ou “Mariam”, transliteração mais próxima da forma grega do nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: virgem
  rationale: É o sentido normal do termo neste contexto, e sua repetição no versículo ressalta esse sentido.
- source_word: ἐμνηστευμένην
  choice: prometida em casamento
  rationale: O particípio perfeito descreve um estado formal já estabelecido, com maior peso social e jurídico que o noivado moderno comum; a expressão é clara em português atual.
- source_word: ἀνδρὶ
  choice: a um homem
  rationale: ἀνήρ pode significar “homem” ou “marido”, mas, com o particípio que indica compromisso matrimonial, “homem” evita sugerir que o casamento já estivesse plenamente realizado.
- source_word: ᾧ ὄνομα Ἰωσήφ
  choice: chamado José
  rationale: Expressa de modo natural em português a fórmula grega de nomeação, sem alterar seu conteúdo.
- source_word: ἐξ οἴκου Δαυίδ
  choice: da casa de Davi
  rationale: Preserva a linguagem bíblica de pertencimento familiar e dinástico, sem substituí-la pela interpretação mais específica “linhagem”.
- source_word: Μαριάμ
  choice: Maria
  rationale: “Maria” é a forma tradicional e plenamente estabelecida do nome em português; a transliteração mais próxima é registrada em nota.
theological_decisions:
- issue: Se παρθένος deve preservar explicitamente o sentido virginal relevante à narrativa da infância em Lucas
  choice: virgem
  alternative: jovem mulher
  rationale: A escolha reflete o sentido lexical mais adequado e a repetição deliberada do termo no próprio versículo, preservando sua relevância teológica sem acrescentar informação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Prometida em casamento” comunica melhor ao leitor comum o caráter formal do vínculo antigo do que o simples “noiva”, enquanto “desposada” é preservado em nota. A construção “da casa de Davi” mantém a expressão dinástica tradicional do original.
