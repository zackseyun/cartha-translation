  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: pt
  text: 'E, tendo pedido uma tabuinha para escrever, escreveu: “João é o nome dele.” E todos ficaram admirados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: tendo pedido
  rationale: O particípio aoristo indica uma ação anterior à de escrever; a construção é natural em português e preserva a sequência narrativa.
- source_word: πινακίδιον
  choice: uma tabuinha para escrever
  rationale: Designa uma pequena tábua usada para escrita. A expressão esclarece a função do objeto e evita a associação moderna de “tablet” com um aparelho eletrônico.
- source_word: ἔγραψεν λέγων
  choice: 'escreveu:'
  rationale: Em português, os dois-pontos introduzem naturalmente o conteúdo escrito. Traduzir λέγων por “dizendo” seria possível, mas soaria redundante e menos idiomático neste contexto.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: João é o nome dele
  rationale: Preserva a ordem marcada do grego, que coloca “João” em destaque, e mantém o presente afirmativo, sem transformá-lo em “será”.
- source_word: ἐθαύμασαν πάντες
  choice: todos ficaram admirados
  rationale: Expressa a reação coletiva de espanto de modo claro, atual e digno.
theological_decisions:
- issue: Força da declaração sobre o nome
  choice: João é o nome dele
  alternative: O nome dele é João / João será o nome dele
  rationale: A formulação mantém a ênfase inicial no nome divinamente indicado e o tempo presente do grego, sem introduzir uma ideia futura não explicitada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe conserva a ênfase do original sem rigidez excessiva; “tabuinha para escrever” é clara para leitores contemporâneos.
