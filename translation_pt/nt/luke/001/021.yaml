source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: pt
  text: O povo esperava Zacarias e se admirava com a demora dele no santuário.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: o povo
  rationale: O substantivo coletivo com artigo se refere às pessoas reunidas do lado de fora; “o povo” é natural e preserva o valor coletivo.
- source_word: προσδοκῶν
  choice: esperava
  rationale: Com ἦν, o particípio forma uma construção perifrástica de sentido durativo; o imperfeito português comunica a espera em andamento.
- source_word: Ζαχαρίαν
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐθαύμαζον
  choice: se admirava
  rationale: O imperfeito indica uma reação contínua. “Admirava-se” preserva o espanto sem introduzir explicitamente a ideia de dúvida ou investigação.
- source_word: ἐν τῷ χρονίζειν
  choice: com a demora dele
  rationale: A construção com infinitivo articular indica a circunstância ou o motivo do espanto; esta formulação é idiomática e mantém o sentido de que Zacarias levava mais tempo que o esperado.
- source_word: ναῷ
  choice: no santuário
  rationale: ναός designa aqui o edifício sagrado propriamente dito, em contraste com o conjunto mais amplo dos pátios do templo; “santuário” comunica essa precisão no contexto sacerdotal.
- source_word: αὐτόν
  choice: dele
  rationale: O pronome é o sujeito acusativo de χρονίζειν; na nominalização portuguesa, seu referente é expresso naturalmente pelo possessivo “dele”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e precisão espacial em “santuário”. O singular coletivo “o povo” rege verbos no singular em português.
