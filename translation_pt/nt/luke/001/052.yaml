id: LUK.1.52
reference: Luke 1:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: pt
  text: Derrubou os governantes[a] de seus tronos e exaltou os humildes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os poderosos”. O termo grego pode designar de modo mais amplo pessoas que detêm poder, embora a referência a tronos favoreça “governantes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os de condição humilde”. O termo grego pode referir-se à humildade e/ou à baixa posição social.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: Derrubou
  rationale: O verbo indica fazer descer ou remover de uma posição elevada. “Derrubou” é natural, vigoroso e preserva a imagem de reversão de poder sem limitar o sentido à deposição política formal.
- source_word: δυνάστας
  choice: os governantes
  rationale: O termo designa pessoas poderosas e pode referir-se a governantes. A menção imediata a tronos favorece aqui o sentido político, embora a alternativa mais ampla “os poderosos” permaneça possível.
- source_word: ἀπὸ θρόνων
  choice: de seus tronos
  rationale: A tradução mantém a imagem concreta dos tronos. O possessivo, não expresso no grego, é acrescentado por naturalidade e clareza em português, sem mudar o referente contextual.
- source_word: ὕψωσεν
  choice: exaltou
  rationale: “Exaltou” expressa elevar a uma posição alta e conserva tanto a dimensão social quanto a ressonância teológica da grande reversão celebrada no cântico.
- source_word: ταπεινούς
  choice: os humildes
  rationale: O adjetivo pode descrever pessoas humildes ou de baixa condição. “Os humildes” é claro e conciso e conserva parte dessa ambiguidade, explicitada na nota.
theological_decisions:
- issue: Valor dos aoristos no Magnificat
  choice: 'Empregar o pretérito perfeito: “Derrubou ... exaltou”'
  alternative: Uma formulação que explicite resultado presente ou ação profética, como “tem derrubado” ou “derrubará”
  rationale: O pretérito perfeito português corresponde naturalmente aos aoristos e apresenta as ações divinas como decisivas e completas, sem definir se são retrospectivas, proféticas ou uma celebração da atuação característica de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase é natural, e a imagem bíblica concreta dos tronos foi preservada.
source_grounding:
  english_pob_role: consult_only
