  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: pt
  text: 'Depois desses dias, Isabel, sua esposa, ficou grávida e se manteve escondida por cinco meses, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Depois desses dias
  rationale: μετά com o acusativo marca sequência temporal. Em narrativa portuguesa sobre acontecimentos passados, “desses dias” expressa com naturalidade a referência retrospectiva de ταύτας; o δέ é uma ligação leve e não exige representação separada.
- source_word: συνέλαβεν
  choice: ficou grávida
  rationale: Neste contexto, συλλαμβάνω se refere à concepção de um filho. “Ficou grávida” é claro, natural e corrente em português moderno.
- source_word: Ἐλισάβετ
  choice: Isabel
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: sua esposa
  rationale: Embora γυνή possa significar “mulher” ou “esposa”, o possessivo e o contexto conjugal tornam “esposa” inequívoco. A colocação após o nome é natural em português.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: se manteve recolhida
  rationale: A construção reflexiva e o imperfeito indicam uma conduta continuada ao longo do período. “Manteve-se recolhida” preserva a duração sem sugerir necessariamente ocultação absoluta.
- source_word: μῆνας πέντε
  choice: durante cinco meses
  rationale: O acusativo indica duração; “durante” torna essa função temporal explícita e idiomática em português.
- source_word: λέγουσα
  choice: 'dizendo:'
  rationale: O particípio presente introduz diretamente a fala que continua no versículo seguinte; “dizendo” conserva essa ligação sintática.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada ao uso português sem perder as relações do grego. O versículo termina com dois-pontos porque a fala de Isabel vem no versículo seguinte.
