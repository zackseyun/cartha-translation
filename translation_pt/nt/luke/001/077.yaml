lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: para dar
  rationale: O infinitivo articular expressa propósito em dependência do versículo anterior; “para dar” transmite essa relação com naturalidade em português.
- source_word: γνῶσιν σωτηρίας
  choice: o conhecimento da salvação
  rationale: Mantém a construção genitiva e o sentido direto de γνῶσις, sem especificar indevidamente a natureza desse conhecimento.
- source_word: τῷ λαῷ αὐτοῦ
  choice: ao seu povo
  rationale: O dativo indica os destinatários, e “seu povo” conserva a linguagem de pertencimento e aliança.
- source_word: ἐν ἀφέσει
  choice: no perdão
  rationale: Preserva a preposição grega e deixa aberta a relação de esfera, modo ou meio entre a salvação e o perdão.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: dos seus pecados
  rationale: Conserva o plural ἁμαρτιῶν e refere naturalmente o possessivo ao povo.
theological_decisions:
- issue: Relação entre salvação e perdão
  choice: “no perdão dos seus pecados”
  alternative: “por meio do perdão dos seus pecados” ou “pelo perdão dos seus pecados”
  rationale: A expressão ἐν ἀφέσει admite nuances próximas de esfera, modo ou instrumento. A tradução principal preserva a ligação estreita entre salvação e perdão sem impor uma única análise.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. A formulação mantém a continuidade sintática com o versículo anterior.
