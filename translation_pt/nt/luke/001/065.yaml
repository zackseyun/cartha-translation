  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: pt
  text: E o temor tomou conta de todos os que moravam ao redor deles[a], e, por toda a região montanhosa da Judeia, comentava-se tudo isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus vizinhos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas essas palavras” ou “todos esses acontecimentos”. O termo grego pode se referir tanto a palavras faladas quanto aos fatos sobre os quais se falava.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: o temor tomou conta de todos
  rationale: Expressa naturalmente em português o surgimento e a extensão do temor sobre todas as pessoas, preservando a força eventiva da construção grega.
- source_word: φόβος
  choice: temor
  rationale: Mantém o sentido básico de medo, mas também admite a reverência e o assombro diante da evidente atuação divina, sem resolver a nuance no corpo do texto.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: os que moravam ao redor deles
  rationale: Representa de modo transparente a ideia de residir nas proximidades, sem reduzir necessariamente o grupo aos vizinhos imediatos.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: por toda a região montanhosa da Judeia
  rationale: Traduz a designação geográfica da região elevada ou montanhosa e comunica a abrangência indicada por ὅλῃ.
- source_word: διελαλεῖτο
  choice: comentava-se
  rationale: O imperfeito indica uma conversa que circulava continuamente; a construção impessoal é natural em português e preserva o sentido passivo sem sugerir apenas uma proclamação formal.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: tudo isso
  rationale: No contexto narrativo, ῥήματα pode abranger palavras, acontecimentos ou assuntos. A formulação portuguesa é natural e mantém essa amplitude, explicitada em nota.
theological_decisions:
- issue: Nuance de φόβος como reação à atividade divina
  choice: temor
  alternative: medo; reverente assombro
  rationale: “Temor” preserva tanto a reação de medo quanto a possível dimensão de reverência diante da atuação de Deus, sem impor uma interpretação exclusivamente devocional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi ajustada com naturalidade, mantendo a progressão do grego e sua ambiguidade lexical.
