  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: pt
  text: salvação que nos livra de nossos inimigos e da mão de todos os que nos odeiam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «livramento de nossos inimigos e do poder de todos os que nos odeiam».'
    reason: Alternativa lexical para «salvação» e explicitação do sentido idiomático de «mão» como poder ou domínio.
lexical_decisions:
- source_word: σωτηρίαν
  choice: salvação
  rationale: Preserva o peso teológico do termo no cântico de Zacarias e, ao mesmo tempo, admite o sentido concreto de livramento diante de forças hostis.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: dos nossos inimigos
  rationale: A preposição ἐξ indica origem ou separação; em português, «dos nossos inimigos» expressa naturalmente a ideia de ser salvo deles, sem acrescentar «do poder», que não aparece de modo explícito.
- source_word: ἐκ χειρὸς
  choice: da mão de
  rationale: Mantém a imagem bíblica de mão como poder ou domínio e preserva sua ressonância veterotestamentária, permanecendo compreensível em português.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: todos os que nos odeiam
  rationale: Reproduz de modo natural o particípio substantivado e conserva seu sentido característico ou contínuo.
- source_word: καὶ
  choice: e
  rationale: Coordena diretamente as duas expressões preposicionais, sem introduzir interpretação adicional.
theological_decisions:
- issue: Natureza da salvação prometida na profecia de Zacarias
  choice: Usar «salvação» e conservar a referência concreta aos inimigos e aos que odeiam o povo.
  alternative: Traduzir de modo a restringir o sentido a livramento político/nacional ou, no extremo oposto, apenas a salvação espiritual do pecado.
  rationale: O versículo descreve livramento de adversários humanos, enquanto o contexto mais amplo de Lucas confere a «salvação» alcance redentor. A formulação preserva essa tensão sem resolvê-la além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção «da mão de» foi mantida por sua força imagética e ressonância bíblica; a nota oferece uma formulação mais explícita.
