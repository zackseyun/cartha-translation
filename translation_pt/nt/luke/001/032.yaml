id: LUK.1.32
reference: Luke 1:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: pt
  text: Ele será grande e será chamado Filho do Altíssimo[a], e o Senhor Deus lhe dará o trono de Davi, seu pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Este será grande e será chamado Filho do Altíssimo». O grego começa com um pronome demonstrativo: «Este».'
    reason: lexical_alternative
  - marker: b
    text: Aqui, «seu pai» apresenta Davi como antepassado régio de Jesus na linhagem davídica.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Ele
  rationale: O pronome demonstrativo retoma o filho recém-anunciado; em português corrente, «Ele» é mais natural que «Este», sem alterar o referente.
- source_word: ἔσται μέγας
  choice: será grande
  rationale: Mantém a amplitude de μέγας, que pode abranger grandeza, importância e dignidade, sem restringi-lo a poder.
- source_word: υἱὸς Ὑψίστου
  choice: Filho do Altíssimo
  rationale: Preserva a expressão como título elevado. Em português, o artigo antes de «Filho» não é necessário após «será chamado»; a inicial maiúscula sinaliza o uso titular sem acrescentar conteúdo ao grego.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Reproduz naturalmente o futuro passivo de καλέω e conserva a ideia de designação ou reconhecimento pelo título.
- source_word: κύριος ὁ θεὸς
  choice: o Senhor Deus
  rationale: É a correspondência portuguesa natural e tradicional, sem converter κύριος na representação tipográfica do tetragrama.
- source_word: δώσει αὐτῷ
  choice: lhe dará
  rationale: Expressa de modo idiomático o verbo «dar» com o destinatário no dativo.
- source_word: τὸν θρόνον Δαυὶδ
  choice: o trono de Davi
  rationale: Preserva a construção genitiva e a ressonância da promessa régia davídica.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: seu pai
  rationale: Mantém o equivalente direto de πατήρ e a linguagem dinástica do texto, deixando a nota esclarecer que se trata de ancestralidade régia.
theological_decisions:
- issue: Título cristológico υἱὸς Ὑψίστου
  choice: Filho do Altíssimo
  alternative: um filho do Altíssimo
  rationale: A construção funciona como designação titular no anúncio a respeito de Jesus. A tradução preserva sua força filial e régia sem inserir formulação dogmática posterior.
- issue: Sentido de κύριος na expressão κύριος ὁ θεὸς
  choice: o Senhor Deus
  alternative: o SENHOR Deus
  rationale: O texto grego traz κύριος, não o tetragrama hebraico; «Senhor» evita especificar além da evidência textual.
- issue: Paternidade davídica
  choice: Davi, seu pai
  alternative: Davi, seu antepassado
  rationale: Conserva a forma concreta e dinástica do grego, enquanto a nota previne uma leitura de paternidade imediata.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das orações acompanha de perto o grego; «lhe dará» evita rigidez, e «Davi, seu pai» recebe vírgula para deixar clara a aposição.
