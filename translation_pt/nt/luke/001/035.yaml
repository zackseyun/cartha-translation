source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: pt
  text: 'O anjo lhe respondeu: “O Espírito Santo virá sobre você, e o poder do Altíssimo a cobrirá com a sua sombra; por isso, o santo que nascerá[a] será chamado Filho de Deus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que está sendo gerado” ou “a criança que nascerá”. A expressão grega τὸ γεννώμενον significa literalmente “o que está sendo gerado/nascendo”.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “Filho” não vem acompanhado de artigo. Contudo, neste contexto, “Filho de Deus” funciona como título e não significa “um filho de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: O anjo lhe respondeu
  rationale: Reproduz de modo natural em português o particípio idiomático ἀποκριθείς seguido de εἶπεν, sem a redundância pouco natural de “respondendo, disse-lhe”.
- source_word: Πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto, a expressão designa o Espírito divino; o artigo e as maiúsculas seguem o uso corrente em português.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: virá sobre você
  rationale: Mantém o sentido ativo e poderoso de vir sobre alguém, com linguagem atual e amplamente compreensível.
- source_word: δύναμις Ὑψίστου
  choice: o poder do Altíssimo
  rationale: Preserva diretamente o genitivo e o valor titular de Ὑψίστου.
- source_word: ἐπισκιάσει σοι
  choice: a cobrirá com sua sombra
  rationale: Conserva a imagem concreta de sombra presente no verbo, em formulação natural, sem introduzir uma explicação biológica ou sexual.
- source_word: διὸ καὶ
  choice: por isso
  rationale: Expressa com fluidez a consequência indicada por διό; o valor de καί se reflete na ligação entre a ação divina e a identidade atribuída à criança, sem um “também” artificial em português.
- source_word: τὸ γεννώμενον ἅγιον
  choice: o santo que nascerá
  rationale: Comunica naturalmente a referência à criança e sua santidade. O futuro em português é adequado ao ponto temporal da anunciação, enquanto a nota registra a forma participial mais literal.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Preserva a voz passiva e deixa aberta a força de nomeação, reconhecimento e identidade.
- source_word: υἱὸς θεοῦ
  choice: Filho de Deus
  rationale: A expressão anartrosa tem força qualitativa e titular no contexto. Em português, o título funciona naturalmente sem artigo após “chamado”.
theological_decisions:
- issue: Referência de Πνεῦμα ἅγιον
  choice: o Espírito Santo
  alternative: espírito santo
  rationale: O contexto apresenta o Espírito de Deus como agente divino; a tradução não o reduz a mera disposição ou força impessoal, sem acrescentar formulações dogmáticas ausentes do versículo.
- issue: Imagem de ἐπισκιάσει
  choice: a cobrirá com sua sombra
  alternative: a envolverá
  rationale: A opção conserva a metáfora reverente da presença e ação divinas e evita explicar o modo da concepção além do que o grego afirma.
- issue: Força de υἱὸς θεοῦ
  choice: Filho de Deus
  alternative: um filho de Deus
  rationale: A ausência do artigo em grego não torna a expressão indefinida; neste contexto ela funciona como designação qualitativa e título. A tradução evita sugerir que Jesus seria apenas um filho de Deus entre outros.
- issue: Relação entre ἅγιον e τὸ γεννώμενον
  choice: o santo que nascerá
  alternative: o que nascerá será santo
  rationale: A construção grega admite análise qualificativa/predicativa. A opção mantém a concisão e a ligação da santidade com aquele que nasce, enquanto a nota reconhece a forma e a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” por naturalidade contemporânea, conserva os títulos divinos tradicionais e mantém a metáfora do original. Todos os marcadores de nota aparecem no texto principal.
