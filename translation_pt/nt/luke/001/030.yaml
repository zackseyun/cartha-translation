base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: pt
  text: 'E o anjo lhe disse: “Não tenha medo, Maria, pois você encontrou favor[a] diante de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “graça”. O substantivo grego χάρις pode significar “graça” ou “favor”; na expressão “encontrar favor diante de Deus”, “favor” reproduz melhor a construção idiomática deste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: Forma narrativa natural em português para o aoristo de λέγω, introduzindo discurso direto.
- source_word: ἄγγελος
  choice: anjo
  rationale: No contexto da narrativa da infância em Lucas, refere-se a um mensageiro celestial; “anjo” é a designação específica e corrente.
- source_word: Μὴ φοβοῦ
  choice: Não tenha medo
  rationale: Expressa de modo natural e atual a proibição grega, sem recorrer ao mais solene ou arcaizante “não temas”.
- source_word: Μαριάμ
  choice: Maria
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: εὗρες
  choice: você encontrou
  rationale: O pretérito perfeito português comunica a ação concluída cujo resultado é relevante no anúncio presente.
- source_word: χάριν
  choice: favor
  rationale: Na expressão idiomática εὑρίσκω χάριν παρά, “favor” transmite melhor a disposição positiva de Deus sem impor ao termo uma formulação teológica posterior.
- source_word: παρὰ τῷ θεῷ
  choice: diante de Deus
  rationale: Representa de maneira idiomática o favor reconhecido na presença ou aos olhos de Deus.
theological_decisions:
- issue: Tradução de χάριν em contexto mariano
  choice: favor
  alternative: graça
  rationale: A construção εὑρίσκω χάριν παρά + dativo é uma expressão convencional equivalente a “encontrar favor diante de”. “Favor” preserva o sentido relacional imediato, enquanto a nota mantém visível a alternativa lexical “graça” sem introduzir uma conclusão doutrinária no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o sujeito já indicado pela forma verbal grega; “não tenha medo” evita arcaísmo. A colocação da nota após “favor” identifica com precisão o termo a que ela se refere.
