  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: pt
  text: 'E exclamou em alta voz e disse: “Bendita é você entre as mulheres, e bendito é o fruto do seu ventre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: exclamou
  rationale: O aoristo de ἀναφωνέω indica falar de modo forte e audível. “Exclamou” transmite intensidade sem sugerir necessariamente aflição.
- source_word: κραυγῇ μεγάλῃ
  choice: em alta voz
  rationale: O dativo expressa modo. “Em alta voz” é natural em português e preserva a força e a audibilidade pública da expressão.
- source_word: Εὐλογημένη
  choice: Bendita é você
  rationale: O particípio perfeito passivo tem função predicativa. A formulação preserva o caráter exclamativo da bênção e mantém linguagem bíblica compreensível.
- source_word: ἐν γυναιξίν
  choice: entre as mulheres
  rationale: A expressão distingue Maria em relação às mulheres em geral. Não se acrescenta “todas”, pois isso não está explícito no grego.
- source_word: εὐλογημένος
  choice: bendito é
  rationale: Repete a estrutura da primeira declaração e conserva o paralelismo entre Maria e a criança que ela carrega.
- source_word: ὁ καρπὸς
  choice: o fruto
  rationale: Mantém a metáfora literal e tradicional do original, que continua clara em português.
- source_word: τῆς κοιλίας σου
  choice: do seu ventre
  rationale: Neste contexto de gravidez, κοιλία se refere ao ventre materno. A expressão é precisa, natural e preserva a imagem do texto.
theological_decisions:
- issue: Formulação da bênção dirigida a Maria
  choice: Bendita é você entre as mulheres
  alternative: Você é bendita entre as mulheres
  rationale: A tradução conserva a fórmula bíblica de bênção e a declaração do texto sem ampliar nem reduzir o papel de Maria por meio de formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Bendita é você” conserva solenidade sem recorrer ao pronome regional ou arcaizante “tu”. Não se incluiu nota para “com grande clamor”, pois “exclamou em alta voz” representa de modo suficientemente transparente a combinação ἀνεφώνησεν κραυγῇ μεγάλῃ.
