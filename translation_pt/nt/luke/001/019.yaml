id: LUK.1.19
reference: Luke 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: pt
  text: 'O anjo lhe respondeu: “Eu sou Gabriel, aquele que está na presença de Deus. Fui enviado para falar com você e lhe anunciar estas boas notícias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe anunciar estas coisas como boas notícias”. O grego diz literalmente “anunciar boas notícias a você, estas coisas”; “estas coisas” se refere à mensagem que Gabriel acaba de anunciar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: O particípio aoristo introduz a fala direta; em português corrente, a forma finita “respondeu” transmite a construção com naturalidade.
- source_word: ἄγγελος
  choice: anjo
  rationale: O contexto identifica o mensageiro como Gabriel, um ser celestial; “anjo” é, portanto, a designação natural e específica.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Eu sou Gabriel
  rationale: Preserva o pronome explícito e enfático Ἐγώ, além de transliterar o nome pessoal segundo o uso estabelecido em português.
- source_word: ὁ παρεστηκὼς
  choice: aquele que está
  rationale: O particípio perfeito descreve uma posição ou condição vigente; “aquele que está” comunica o estado contínuo sem tornar a frase artificial.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: na presença de Deus
  rationale: Expressa proximidade e o cenário de serviço diante da corte divina, mantendo uma formulação clara e digna.
- source_word: ἀπεστάλην
  choice: Fui enviado
  rationale: Mantém diretamente a voz passiva do aoristo e o sentido de comissionamento.
- source_word: λαλῆσαι πρὸς σὲ
  choice: para falar com você
  rationale: O infinitivo indica propósito; esta formulação é natural no português moderno e mantém a ideia de dirigir a palavra a Zacarias.
- source_word: εὐαγγελίσασθαί σοι
  choice: lhe anunciar estas boas notícias
  rationale: O verbo significa anunciar ou proclamar boas notícias. “Anunciar” preserva o ato verbal, e “boas notícias” evita transformar o termo em jargão técnico posterior.
- source_word: ταῦτα
  choice: estas boas notícias
  rationale: Literalmente, o demonstrativo significa “estas coisas”, mas aqui aponta para o conteúdo da mensagem anunciada como boa notícia. A nota registra a forma mais literal.
theological_decisions:
- issue: Sentido de εὐαγγελίζω no anúncio do anjo
  choice: boas notícias
  alternative: evangelho; boas-novas
  rationale: “Boas notícias” preserva o sentido lexical no contexto narrativo sem impor ao termo um uso técnico cristão posterior. “Evangelho” poderia soar anacronicamente fixo, enquanto “boas-novas” é possível, mas menos corrente para parte do público contemporâneo.
- issue: Força do perfeito em ὁ παρεστηκὼς
  choice: aquele que está na presença de Deus
  alternative: aquele que permanece diante de Deus; aquele que tem estado diante de Deus
  rationale: A tradução apresenta a posição contínua de Gabriel sem definir além do texto a natureza ou a duração de seu serviço celestial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o destinatário singular de σέ/σοι, enquanto “lhe” evita repetição excessiva. A redação mantém a ênfase de “Eu sou Gabriel” e conserva o tom solene sem recorrer a formas arcaicas.
