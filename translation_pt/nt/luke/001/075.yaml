  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: pt
  text: em santidade e justiça diante dele todos os nossos dias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em retidão”.
    reason: Alternativa lexical para δικαιοσύνῃ, destacando aqui a conduta moralmente correta diante de Deus.
lexical_decisions:
- source_word: ἐν
  choice: em
  rationale: Introduz a esfera ou o modo em que o serviço é prestado; “em” preserva naturalmente a estrutura grega em português.
- source_word: ὁσιότητι
  choice: santidade
  rationale: Expressa santidade ou devoção em relação a Deus e permanece distinta de δικαιοσύνη; “santidade” é clara, digna e natural neste par.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois substantivos.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Neste contexto ético, em par com “santidade” e diante de Deus, “justiça” comunica conduta reta e conformidade com o que é justo sem restringir o termo à justiça social.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Formulação idiomática e concisa que preserva os sentidos de presença e avaliação aos olhos de Deus.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: todos os nossos dias
  rationale: Reproduz de perto a expressão grega e indica toda a duração da vida sem acrescentar um substantivo ausente do texto.
theological_decisions:
- issue: Sentido de δικαιοσύνη em contexto ético não paulino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o correspondente português tradicional e semanticamente amplo de δικαιοσύνη; no contexto, denota viver corretamente diante de Deus. “Retidão” explicita melhor o aspecto moral, mas reduz a ligação lexical com o campo de justo/justiça.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados sem produzir construção artificial.
