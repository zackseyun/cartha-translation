id: LUK.1.16
reference: Luke 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: pt
  text: E fará muitos dos filhos de Israel voltarem para o Senhor, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Israel” ou “dos israelitas”. O grego diz literalmente “dos filhos de Israel”, preservando a expressão pactual tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo no início da oração e a continuidade narrativa com o versículo anterior.
- source_word: πολλοὺς
  choice: muitos
  rationale: O adjetivo é usado substantivamente e se liga ao genitivo seguinte; “muitos” é natural e conciso em português.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: dos filhos de Israel
  rationale: Preserva a forma masculina explícita e a expressão bíblica tradicional de aliança, sem reduzi-la simplesmente a “israelitas”.
- source_word: ἐπιστρέψει
  choice: fará ... voltarem
  rationale: 'Expressa claramente a força causativa e transitiva do futuro ativo: João será o agente por meio de quem muitos se voltarão. Evita o termo mais interpretativo “converterá”.'
- source_word: ἐπὶ
  choice: para
  rationale: Com ἐπιστρέφω e o acusativo, indica redirecionamento para alguém; “voltar para” é idiomático e claro.
- source_word: κύριον
  choice: Senhor
  rationale: Neste contexto, designa o Deus de Israel e tem força pactual, não o sentido menor de um senhor humano.
- source_word: τὸν θεὸν αὐτῶν
  choice: seu Deus
  rationale: A expressão está em aposição a “o Senhor”; o singular distributivo “seu” retoma naturalmente o grupo “filhos de Israel” em português.
theological_decisions:
- issue: Tradução da expressão pactual τῶν υἱῶν Ἰσραὴλ
  choice: filhos de Israel
  alternative: descendentes de Israel; israelitas
  rationale: A escolha conserva a formulação explicitamente masculina do grego e sua ressonância bíblica tradicional. As alternativas são idiomáticas, mas tornam menos visível a expressão da fonte.
- issue: Referente de κύριον τὸν θεὸν αὐτῶν
  choice: o Senhor, seu Deus
  alternative: o senhor deles, o seu deus
  rationale: A aposição identifica claramente o Senhor como o Deus de Israel. A capitalização e a redação preservam o peso pactual sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “fará ... voltarem” evita a ambiguidade sintática que “voltará muitos” teria em português e conserva a causalidade do verbo grego. A vírgula em “o Senhor, seu Deus” explicita a aposição.
