source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: pt
  text: para iluminar os que estão sentados nas trevas e na sombra da morte[a] e guiar os nossos pés pelo caminho da paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em alguns contextos do Antigo Testamento, a expressão correspondente pode ser entendida de modo mais amplo como “escuridão profunda”; aqui, porém, o grego menciona explicitamente a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: iluminar
  rationale: Expressa a ação da luz que alcança quem está nas trevas e, em português, liga-se naturalmente ao objeto direto; preserva a imagem sem reduzi-la a mero aparecimento.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: os que estão sentados nas trevas
  rationale: Mantém o sentido concreto de καθημένοις e a força poética e intertextual da imagem, sem substituí-la por “vivem” ou “habitam”.
- source_word: σκότει
  choice: trevas
  rationale: Termo bíblico corrente e compreensível que conserva tanto a dimensão imagética quanto a possível força metafórica do grego.
- source_word: σκιᾷ θανάτου
  choice: sombra da morte
  rationale: Reproduz o genitivo explícito θανάτου e preserva a conhecida imagem bíblica, sem dissolvê-la interpretativamente em “escuridão profunda”.
- source_word: τοῦ κατευθῦναι
  choice: guiar
  rationale: Comunica orientação e direção de modo natural com “pés”, sem impor o sentido mais específico de “endireitar”.
- source_word: τοὺς πόδας ἡμῶν
  choice: os nossos pés
  rationale: Conserva a metáfora corporal e o pronome inclusivo do texto grego.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: pelo caminho da paz
  rationale: “Caminho da paz” preserva a metáfora de ὁδός; “pelo” é a formulação portuguesa mais natural para o movimento dirigido de passos, embora εἰς expresse literalmente direção para dentro ou em direção ao caminho.
theological_decisions:
- issue: Imagens metafóricas de trevas, morte, pés e caminho
  choice: Manter as imagens sem explicá-las no corpo do texto
  alternative: Explicitar as trevas como ignorância espiritual e o caminho como conduta que produz paz
  rationale: O texto é poético e alusivo; sua abertura teológica deve ser preservada, sem restringir as metáforas a uma única interpretação.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. “Trevas” e “sombra da morte” conservam o caráter poético e bíblico sem arcaísmo sintático; “os nossos pés” mantém a metáfora com naturalidade.
