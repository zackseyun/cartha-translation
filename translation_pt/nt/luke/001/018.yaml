  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: pt
  text: 'E Zacarias disse ao anjo: “Como saberei disso? Pois eu sou velho, e minha esposa está avançada em idade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: Verbo narrativo comum de fala; “disse” é a forma direta e natural em português.
- source_word: πρὸς τὸν ἄγγελον
  choice: ao anjo
  rationale: Com verbo de fala, πρός indica o destinatário; “ao anjo” é idiomático e preciso.
- source_word: Κατὰ τί
  choice: Como
  rationale: A expressão pergunta com base em quê ou por que meio Zacarias obterá certeza; “Como” preserva a pergunta de modo natural, sem acrescentar uma exigência explícita de sinal.
- source_word: γνώσομαι
  choice: saberei
  rationale: O futuro de γινώσκω indica o vir a saber ou reconhecer; “saberei” mantém o valor futuro, em vez de deslocá-lo para mera capacidade.
- source_word: τοῦτο
  choice: disso
  rationale: Refere-se ao anúncio que o anjo acaba de fazer. Depois de “saber”, “disso” é mais natural em português do que “isto”, sem alterar o referente.
- source_word: πρεσβύτης
  choice: velho
  rationale: O substantivo designa um homem de idade avançada, não alguém que ocupa o cargo de presbítero. “Sou velho” é direto, claro e natural.
- source_word: γυνή
  choice: minha mulher
  rationale: Com o possessivo e neste contexto conjugal, γυνή significa “esposa”; “minha mulher” é uma expressão corrente e amplamente compreensível em português.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: já está avançada em idade
  rationale: A expressão grega diz literalmente que ela está “avançada em seus dias”, um idioma para idade avançada. A tradução escolhida comunica esse sentido com dignidade e naturalidade em português.
theological_decisions:
- issue: Sentido de ἄγγελος
  choice: anjo
  alternative: mensageiro
  rationale: Embora ἄγγελος possa significar “mensageiro”, o contexto imediato identifica a figura celestial como Gabriel; “anjo” é, portanto, a leitura contextual adequada, sem expansão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura da pergunta e o futuro “saberei” preservam a nuance do grego; o idioma final é vertido pelo equivalente natural “avançada em idade”.
