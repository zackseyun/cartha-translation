base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: pt
  text: 'Mas Maria disse ao anjo: “Como será isso, visto que não conheço homem algum[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “não tenho relações sexuais com homem algum”. No grego, “conhecer um homem” é uma expressão recatada que se refere a relações sexuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca a leve mudança de rumo entre o anúncio do anjo e a pergunta de Maria, sem sugerir forte oposição.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: πρὸς τὸν ἄγγελον
  choice: ao anjo
  rationale: No contexto da narrativa, ἄγγελος designa claramente um mensageiro celestial; “anjo” é a forma natural e precisa.
- source_word: Πῶς ἔσται τοῦτο
  choice: Como acontecerá isso
  rationale: Expressa em português corrente a pergunta sobre como o que foi anunciado virá a realizar-se.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Introduz naturalmente a razão da pergunta, preservando o valor causal.
- source_word: ἄνδρα οὐ γινώσκω
  choice: não conheço homem algum
  rationale: Preserva na redação principal o eufemismo bíblico “conhecer” para relações sexuais. “Homem algum” comunica com naturalidade a ausência de tal relação, sem restringir ἀνήρ a “marido”.
theological_decisions:
- issue: A declaração de Maria e a concepção virginal de Jesus
  choice: Manter no texto o eufemismo “não conheço homem algum”, explicado em nota.
  alternative: “não tive relações com homem algum” ou “sou virgem”
  rationale: O grego emprega o presente οὐ γινώσκω, literalmente “não conheço”, como expressão recatada para relações sexuais. A tradução preserva a forma e a tensão do texto sem acrescentar uma formulação doutrinária mais explícita do que a fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Perguntou” torna natural a introdução de uma fala interrogativa; “homem algum” preserva o sentido sem o possível equívoco moderno de “não conhecer um homem” como simples falta de familiaridade.
