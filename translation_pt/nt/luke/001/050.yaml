id: LUK.1.50
reference: Luke 1:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: pt
  text: E a sua misericórdia se estende, de geração em geração, aos que o temem.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “para gerações e gerações”, expressão que indica continuidade através de gerações sucessivas.
    reason: lexical_alternative
  - marker: b
    text: “Os que o temem” são os que vivem em temor reverente diante de Deus; também se pode traduzir por “os que o reverenciam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente português mais direto e natural, preservando tanto a ideia de compaixão para com quem necessita quanto o tom pactual do cântico de Maria.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: de geração em geração
  rationale: Expressa de modo idiomático em português a continuidade da misericórdia através de gerações sucessivas. Embora εἰς tenha sentido de extensão, uma tradução literal como “para gerações e gerações” seria menos natural.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: aos que o temem
  rationale: O dativo identifica os beneficiários da misericórdia. “Temem” conserva a linguagem bíblica e a amplitude semântica do grego, que neste contexto envolve temor reverente.
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação cumulativa e o fluxo poético com a linha anterior do Magnificat.
- source_word: αὐτοῦ / αὐτόν
  choice: sua / o
  rationale: Os pronomes retomam Deus no contexto imediato sem acrescentar explicação interpretativa ao texto.
theological_decisions:
- issue: Sentido de φοβέομαι quando Deus é o objeto
  choice: temem
  alternative: reverenciam
  rationale: “Temem” preserva a expressão bíblica e sua tensão teológica; aqui não indica mero pavor, mas temor reverente diante de Deus.
- issue: Relação entre a misericórdia, seus beneficiários e as gerações
  choice: “se estende, de geração em geração, aos que o temem”
  alternative: “é para os que o temem de geração em geração”
  rationale: A redação escolhida deixa claro que a expressão geracional indica a continuidade da misericórdia, evitando a possível leitura de que modifica apenas o ato de temer.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o paralelismo poético do Magnificat e a expressão bíblica “temer a Deus”, esclarecida em nota sem ser reduzida no texto principal.
