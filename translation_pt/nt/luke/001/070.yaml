lexical_decisions:
- source_word: καθὼς
  choice: como
  rationale: Introduz a correspondência com a afirmação anterior de modo natural em português, sem acrescentar ênfase ausente do grego.
- source_word: ἐλάλησεν
  choice: falou
  rationale: Traduz diretamente o aoristo de λαλέω e combina naturalmente com a expressão instrumental seguinte.
- source_word: διὰ στόματος
  choice: pela boca
  rationale: Preserva a imagem concreta do idioma bíblico e a ideia de que Deus comunicou sua palavra por intermédio dos profetas.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: dos seus santos profetas
  rationale: Mantém ἁγίων como modificador atributivo de προφητῶν e expressa αὐτοῦ de forma idiomática.
- source_word: ἀπ’ αἰῶνος
  choice: desde os tempos antigos
  rationale: Expressa antiguidade remota em português claro e natural, adequada à referência histórica aos profetas, sem excluir indevidamente a amplitude da expressão.
- source_word: αὐτοῦ
  choice: seus
  rationale: O pronome refere-se mais naturalmente a Deus no contexto e indica que os profetas lhe pertencem.
theological_decisions:
- issue: Alcance temporal de ἀπ’ αἰῶνος
  choice: antiguidade remota na história da salvação (“desde os tempos antigos”)
  alternative: passado eterno (“desde a eternidade”)
  rationale: A menção imediata aos profetas favorece uma referência à antiga atuação profética de Deus. A nota preserva a possibilidade lexical mais forte sem transformá-la na leitura principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “pela boca” conserva o caráter bíblico da imagem sem soar excessivamente arcaica; “desde os tempos antigos” é mais natural internacionalmente do que uma reprodução literal como “desde o século”.
