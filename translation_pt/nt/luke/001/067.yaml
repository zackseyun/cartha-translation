base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: pt
  text: 'E Zacarias, seu pai, ficou cheio do Espírito Santo e profetizou, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: seu pai
  rationale: Forma idiomática em português que preserva a identificação familiar do referente.
- source_word: ἐπλήσθη
  choice: ficou cheio
  rationale: Expressa o aoristo passivo como um acontecimento, preservando a imagem de ser cheio sem tornar a frase artificial.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: O genitivo exigido por πίμπλημι é naturalmente expresso com «de» em português; as maiúsculas identificam o referente como o Espírito de Deus no contexto lucano.
- source_word: ἐπροφήτευσεν
  choice: profetizou
  rationale: Equivalente direto e corrente de προφητεύω, mantendo o caráter profético da declaração inspirada.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva de modo natural o particípio que introduz o conteúdo da profecia seguinte.
- source_word: Καὶ
  choice: E
  rationale: Mantém a continuidade narrativa assinalada pela conjunção grega.
theological_decisions:
- issue: Referente de πνεύματος ἁγίου
  choice: o Espírito Santo
  alternative: um espírito santo
  rationale: No contexto de inspiração divina em Lucas–Atos, a expressão se refere regularmente ao Espírito de Deus. A tradução mantém essa identificação sem acrescentar formulações doutrinárias ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. A construção «ficou cheio do Espírito Santo» comunica o início do estado resultante neste episódio; «profetizou, dizendo» conserva a forma solene e a ligação explícita com o discurso subsequente.
