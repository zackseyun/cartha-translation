id: LUK.1.20
reference: Luke 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: pt
  text: E eis que você ficará em silêncio, sem poder falar, até o dia em que essas coisas acontecerem, porque não creu nas minhas palavras, as quais se cumprirão no tempo determinado para elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo apropriado para elas”. A expressão grega indica o tempo adequado ou determinado em que essas palavras haveriam de se cumprir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva o marcador enfático e solene da declaração angélica; embora menos comum na fala cotidiana, “eis que” permanece claro no registro bíblico moderno.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: você ficará em silêncio, sem poder falar
  rationale: 'Mantém os dois elementos do grego: o estado de silêncio e a incapacidade que o impõe, sem reduzi-los simplesmente a “ficará mudo”.'
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: até o dia em que essas coisas acontecerem
  rationale: Reproduz de modo natural a relação temporal e emprega linguagem portuguesa atual para γένηται.
- source_word: ἀνθ’ ὧν
  choice: porque
  rationale: 'Expressa com clareza a força causal da locução neste contexto: a incapacidade de falar decorre da incredulidade de Zacarias.'
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: não creu nas minhas palavras
  rationale: “Creu” com a preposição “em” comunica naturalmente que Zacarias não aceitou como verdade aquilo que o anjo disse, preservando λόγοι como “palavras”.
- source_word: οἵτινες πληρωθήσονται
  choice: as quais se cumprirão
  rationale: Retém a referência às “palavras” e o sentido passivo de sua realização; em português, a forma pronominal “se cumprirão” é idiomática.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: no tempo determinado para elas
  rationale: Comunica que καιρός é o tempo adequado ou designado para o cumprimento, mantendo o vínculo pronominal com “palavras” e evitando especificar quem o determinou.
theological_decisions:
- issue: Natureza do juízo imposto a Zacarias
  choice: Uma incapacidade de falar imposta até o cumprimento do anúncio
  alternative: Uma decisão voluntária de permanecer calado
  rationale: A combinação de “ficará em silêncio” com “sem poder falar” indica incapacidade, e não uma simples ordem para guardar silêncio.
- issue: Agente implícito na determinação do tempo
  choice: Manter o agente não expresso em “tempo determinado”
  alternative: Explicitar “tempo determinado por Deus”
  rationale: O contexto permite entender a determinação divina, mas o grego não nomeia o agente nesta frase; a tradução evita tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” oferece naturalidade contemporânea; “eis que” conserva a ênfase solene do anúncio. A formulação preserva tanto o silêncio quanto a incapacidade de falar e evita acrescentar um agente não expresso ao tempo determinado.
