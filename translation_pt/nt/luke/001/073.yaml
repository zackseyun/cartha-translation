  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: pt
  text: o juramento que fez a Abraão, nosso pai[a], de nos conceder
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso antepassado”. O grego diz literalmente “nosso pai”, preservando a linguagem da aliança a respeito de Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: o juramento
  rationale: O acusativo retoma a construção do versículo anterior e se refere ao juramento específico já em vista.
- source_word: ὃν ὤμοσεν
  choice: que fez
  rationale: Em português, “fazer um juramento” é uma expressão natural e preserva claramente a ideia de jurar, evitando a repetição pouco elegante “o juramento que jurou”.
- source_word: πρὸς Ἀβραὰμ
  choice: a Abraão
  rationale: Com o verbo de jurar, πρός indica a pessoa a quem o juramento foi dirigido; “a Abraão” é a formulação idiomática mais clara.
- source_word: τὸν πατέρα ἡμῶν
  choice: nosso pai
  rationale: Mantém a linguagem familiar e pactual do grego a respeito de Abraão; “nosso antepassado” explicitaria o sentido genealógico, mas reduziria essa ressonância.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: de nos conceder
  rationale: O infinitivo articular depende do juramento e pode indicar seu conteúdo, propósito ou resultado. “De nos conceder” é natural no contexto e conserva o registro elevado do cântico.
theological_decisions:
- issue: Linguagem da aliança abraâmica
  choice: nosso pai
  alternative: nosso antepassado
  rationale: “Nosso pai” preserva o idioma bíblico e a identificação coletiva de Israel com Abraão sem acrescentar uma interpretação doutrinária.
- issue: Relação do infinitivo τοῦ δοῦναι com o juramento
  choice: de nos conceder
  alternative: para nos conceder
  rationale: A construção grega admite nuances de conteúdo, propósito ou resultado. “De nos conceder” liga naturalmente a expressão ao juramento e evita resolver de modo excessivo essa relação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação permanece incompleta porque o conteúdo iniciado por “de nos conceder” continua no versículo seguinte.
