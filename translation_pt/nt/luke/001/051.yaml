  text: Ἐποίησεν κράτος ἐν βραχίονι αὐτοῦ, διεσκόρπισεν ὑπερηφάνους διανοίᾳ καρδίας αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: pt
  text: Manifestou poder com o seu braço[a]; dispersou os orgulhosos nos pensamentos do coração deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Realizou feitos poderosos com o seu braço”. O grego diz literalmente “fez poder/força”, expressão que indica uma demonstração de poder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dispersou os arrogantes pela intenção do coração deles”; ou: “na imaginação do coração deles”. A expressão grega pode indicar os pensamentos que caracterizam os orgulhosos ou a esfera ou o meio de sua dispersão.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: Manifestou poder
  rationale: A expressão grega literalmente diz “fez poder/força”, um modo idiomático de descrever a demonstração efetiva de poder. “Manifestou poder” é natural em português e conserva a ideia de força posta em ação.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: com o seu braço
  rationale: O ἐν tem sentido instrumental neste semitismo que evoca a linguagem do Antigo Testamento sobre o braço poderoso de Deus. A formulação mantém a metáfora antropomórfica.
- source_word: διεσκόρπισεν
  choice: dispersou
  rationale: O verbo indica espalhar ou dispersar. “Dispersou” é claro, digno e adequado ao paralelismo poético.
- source_word: ὑπερηφάνους
  choice: os orgulhosos
  rationale: O adjetivo substantivado designa pessoas caracterizadas pela soberba. “Os orgulhosos” é conciso e amplamente compreensível.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: nos pensamentos do coração deles
  rationale: A expressão une διάνοια, que pode indicar pensamento, intenção ou imaginação, a καρδία como centro da vida interior. A tradução conserva a formulação semítica e não reduz sua possível função à mera atividade intelectual.
theological_decisions:
- issue: Valor dos aoristos no cântico de Maria
  choice: 'Empregar o pretérito perfeito simples: “manifestou” e “dispersou”'
  alternative: Usar formas presentes ou “tem manifestado/tem dispersado”
  rationale: Os aoristos apresentam as ações divinas como decisivas e completas, possivelmente com força profética ou resumitiva. Em português, o pretérito perfeito simples comunica isso melhor; o pretérito perfeito composto normalmente sugere repetição ou continuidade e, portanto, não equivale ao present perfect inglês.
- issue: Relação sintática de διανοίᾳ καρδίας αὐτῶν
  choice: Manter “nos pensamentos do coração deles”, sem explicitar se a frase caracteriza os orgulhosos ou indica esfera/meio da dispersão
  alternative: Traduzir de modo interpretativo como “os de coração orgulhoso” ou “por causa das intenções do coração deles”
  rationale: A construção grega admite mais de uma relação sintática. A redação principal preserva essa tensão em vez de escolher silenciosamente uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário internacional. O sujeito divino, implícito no grego e recuperável pelo contexto, permanece implícito em português. A ordem poética e a metáfora do braço foram preservadas.
