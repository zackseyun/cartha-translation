  - severity: low
    issue: «Depois de acompanhar» dá ao particípio uma nuance temporal desnecessariamente explícita.
    rationale: O particípio perfeito descreve a qualificação ou ação prévia que fundamenta a decisão de escrever; «tendo acompanhado» reflete isso de modo mais direto.
  - severity: low
