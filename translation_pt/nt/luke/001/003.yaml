  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: pt
  text: Pareceu-me bem também, tendo acompanhado cuidadosamente tudo desde o princípio, escrever para você um relato em ordem[a], excelentíssimo Teófilo,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em sequência» ou «de forma organizada»; a expressão pode indicar uma disposição ordenada, e não necessariamente uma sequência estritamente cronológica.
    reason: alternative_reading
  - marker: b
    text: Ou «tendo investigado cuidadosamente tudo desde o princípio».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξε
  choice: pareceu-me bem
  rationale: A expressão comunica uma decisão ponderada e conserva o tom formal do prefácio.
- source_word: κἀμοὶ
  choice: também
  rationale: Mantém a ligação de Lucas consigo mesmo em relação aos narradores mencionados anteriormente; em português, integra-se naturalmente a «pareceu-me bem também».
- source_word: παρηκολουθηκότι
  choice: depois de acompanhar
  rationale: O verbo pode significar acompanhar de perto, investigar ou examinar o curso de algo. «Acompanhar» preserva sua amplitude sem eliminar o sentido investigativo.
- source_word: ἄνωθεν
  choice: desde o princípio
  rationale: Neste contexto historiográfico, indica o ponto inicial dos acontecimentos, não «do alto».
- source_word: πᾶσιν
  choice: tudo
  rationale: Forma portuguesa natural e abrangente para o neutro plural, referindo-se a todos os assuntos ou acontecimentos em questão.
- source_word: ἀκριβῶς
  choice: cuidadosamente
  rationale: Expressa atenção precisa e rigorosa, combinando de modo natural com «acompanhar».
- source_word: καθεξῆς
  choice: em sequência ordenada
  rationale: Conserva tanto a ideia de sequência quanto a de organização, sem afirmar necessariamente uma cronologia estrita.
- source_word: σοι γράψαι
  choice: escrever para você um relato
  rationale: «Para você» identifica naturalmente o destinatário; «um relato» explicita em português o objeto contextual da escrita sem acrescentar conteúdo novo.
- source_word: κράτιστε
  choice: excelentíssimo
  rationale: Equivalente honorífico formal adequado ao tratamento respeitoso empregado no prólogo.
- source_word: Θεόφιλε
  choice: Teófilo
  rationale: Transliteração portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions:
- issue: Sentido de καθεξῆς quanto à ordem histórica
  choice: em sequência ordenada
  alternative: em ordem; em ordem cronológica
  rationale: O termo pode indicar sucessão ou arranjo organizado, mas não exige uma afirmação de cronologia estrita. A formulação mantém essa abertura sem enfraquecer a intenção historiográfica de Lucas.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade apropriada ao prólogo literário. «Você» oferece legibilidade brasileira ampla; «excelentíssimo» preserva o tratamento honorífico. A construção conserva o período iniciado nos versículos anteriores e, por isso, termina com vírgula.
