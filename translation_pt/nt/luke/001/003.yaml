  source_fidelity: A tradução transmite adequadamente a decisão ponderada de ἔδοξε, a inclusão enfática de κἀμοὶ, o alcance de «tudo», «desde o princípio» e o tratamento honorífico a Teófilo. Contudo, «depois de acompanhar» introduz uma relação temporal mais marcada do que o particípio perfeito grego exige e pode enfraquecer o aspecto investigativo de παρηκολουθηκότι. «Tendo acompanhado cuidadosamente» conserva melhor a construção e a amplitude semântica.
  naturalness: O registro é apropriado e «você» é aceitável para a variante-alvo. «Em sequência ordenada» é compreensível, mas algo redundante em português; «em ordem» é mais idiomático e preserva a abertura de καθεξῆς. A frase revista mantém a cadência formal do prólogo.
  terminology: «Excelentíssimo Teófilo» é uma boa equivalência de κράτιστε Θεόφιλε. «Relato» é contextual e aceitável, mas não é necessário explicitar um objeto que o grego deixa implícito; a formulação revista mantém «um relato» por clareza sem impor conteúdo alheio ao contexto imediato.
  issues:
