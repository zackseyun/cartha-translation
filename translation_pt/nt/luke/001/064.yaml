id: LUK.1.64
reference: Luke 1:64
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: pt
  text: Então, imediatamente sua boca se abriu, e sua língua também[a]. Ele começou a falar[b], bendizendo a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sua boca foi aberta imediatamente, e sua língua também”. O grego não acrescenta um verbo como “soltou-se” para a língua.
    reason: lexical_alternative
  - marker: b
    text: Ou “continuava falando” ou “falava”. O verbo no imperfeito pode destacar a fala em andamento, e não necessariamente seu início.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: se abriu
  rationale: O aoristo passivo de ἀνοίγω indica a súbita restauração da capacidade de falar. A construção pronominal é natural em português e mantém o acontecimento em primeiro plano sem especificar o agente.
- source_word: δὲ
  choice: Então
  rationale: δέ funciona aqui como conectivo narrativo leve; “Então” faz a narrativa avançar sem introduzir um contraste indevido.
- source_word: στόμα
  choice: boca
  rationale: Equivalente anatômico direto e natural no contexto da restauração da fala.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Expressa com clareza a rapidez e a sequência direta indicadas pelo advérbio grego.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: e sua língua também
  rationale: Mantém a menção explícita à língua e reflete καί (“também”), sem acrescentar um verbo como “soltou-se”, ausente do texto grego.
- source_word: ἐλάλει
  choice: começou a falar
  rationale: O imperfeito pode apresentar tanto o início quanto a continuidade da ação. Após o período de mudez, o valor ingressivo se ajusta bem ao fluxo narrativo, sem ocultar a alternativa aspectual indicada em nota.
- source_word: εὐλογῶν
  choice: bendizendo
  rationale: O particípio presente descreve o modo ou conteúdo de sua fala. “Bendizendo” preserva mais diretamente o sentido de εὐλογέω do que a alternativa mais ampla “louvando”.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: Objeto direto de εὐλογῶν; “bendizer a Deus” é construção portuguesa natural e fiel.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação preserva a elipse grega referente à língua e evita importar a expressão tradicional “a língua se soltou”. Mantém-se “bendizendo” por precisão lexical, embora “louvando” seja mais corrente.
