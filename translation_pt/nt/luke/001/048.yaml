id: LUK.1.48
reference: Luke 1:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his slave[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: pt
  text: porque olhou para a condição humilde de sua escrava[a]. Pois eis que, de agora em diante, todas as gerações me chamarão bem-aventurada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serva”.
    reason: Registra a alternativa portuguesa mais branda e tradicional para δούλη, enquanto o texto principal preserva a ideia forte de pertencimento.
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: olhou para
  rationale: Expressa de modo natural a atenção dirigida a Maria, com a possibilidade contextual de um olhar favorável, sem explicitar além do que a construção grega afirma.
- source_word: ταπείνωσιν
  choice: condição humilde
  rationale: Indica a condição social baixa e a insignificância de Maria, sem limitar o termo à virtude interior da humildade nem intensificá-lo necessariamente como humilhação.
- source_word: δούλης
  choice: escrava
  rationale: Preserva a linguagem forte de pertencimento e submissão a Deus presente em δούλη e reforçada pelo possessivo 'sua'. A alternativa mais branda 'serva' é registrada em nota.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Mantém a força de chamada de atenção da interjeição em um registro elevado, apropriado ao cântico, mas ainda amplamente compreensível.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Reproduz naturalmente a perspectiva temporal prospectiva da expressão.
- source_word: μακαριοῦσίν με
  choice: me chamarão bem-aventurada
  rationale: Comunica que as gerações declararão ou reconhecerão Maria como agraciada e feliz, preservando a formulação pública do verbo.
- source_word: πᾶσαι αἱ γενεαί
  choice: todas as gerações
  rationale: Equivalente direto e idiomático para as sucessivas gerações humanas, sem acrescentar 'futuras', já implícito no contexto.
theological_decisions:
- issue: Autodesignação de Maria como δούλη
  choice: sua escrava
  alternative: sua serva
  rationale: A opção principal não suaviza a relação de pertencimento total a Deus expressa pelo termo, sem acrescentar conclusões doutrinárias marianas posteriores. A alternativa corrente é preservada em nota.
- issue: Sentido de ταπείνωσις no cântico
  choice: condição humilde
  alternative: baixa condição; humilhação
  rationale: A tradução prioriza a situação baixa e socialmente insignificante de Maria, preservando a amplitude do termo sem reduzi-lo à humildade interior ou à experiência de desonra.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve elevação poética em “eis que” e “bem-aventurada”. O pretérito perfeito “olhou” é o equivalente narrativo natural do aoristo grego; “condição humilde” evita confundir baixa posição com mera virtude subjetiva.
