  source_fidelity: O texto traduz adequadamente ἐπέβλεψεν ἐπί como “olhou para”, preservando a atenção divina dirigida a Maria; “condição humilde” comunica bem ταπείνωσις como condição baixa, sem a reduzir a uma virtude interior. “Sua escrava” mantém a força de δούλη e o feminino do referente. “Eis que”, “de agora em diante”, “me chamarão bem-aventurada” e “todas as gerações” correspondem de modo fiel ao grego e preservam o tom elevado do cântico.
