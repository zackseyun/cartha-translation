id: LUK.1.68
reference: Luke 1:68
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: pt
  text: Bendito seja o Senhor, o Deus de Israel, porque visitou[a] o seu povo e lhe trouxe redenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «veio ajudar»; no grego, «visitou» é uma expressão bíblica para a intervenção atenta de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Bendito seja
  rationale: Mantém a forma de bênção e louvor do predicativo grego, em expressão natural e digna no português bíblico contemporâneo.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título divino e sua ressonância nas Escrituras de Israel.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: o Deus de Israel
  rationale: Reproduz diretamente a designação bíblica e a aposição a «Senhor».
- source_word: ὅτι
  choice: porque
  rationale: Introduz claramente a razão pela qual Deus é bendito.
- source_word: ἐπεσκέψατο
  choice: visitou
  rationale: Conserva a metáfora bíblica da visita divina, que aqui implica atenção e intervenção salvadora, sem reduzi-la a uma paráfrase.
- source_word: ἐποίησεν λύτρωσιν
  choice: trouxe redenção
  rationale: Expressa de modo idiomático a construção grega literalmente equivalente a «fez redenção», preservando a ação eficaz e seu resultado.
- source_word: λύτρωσιν
  choice: redenção
  rationale: Mantém o peso soteriológico do termo e sua associação com libertação mediante resgate.
- source_word: τῷ λαῷ αὐτοῦ
  choice: ao seu povo / lhe
  rationale: O dativo indica o povo como beneficiário; «lhe trouxe» evita ambiguidade e produz português fluente, enquanto «o seu povo» também funciona naturalmente como objeto de «visitou» pela relação semântica compartilhada dos dois verbos.
theological_decisions:
- issue: Linguagem da visita divina
  choice: visitou
  alternative: veio ajudar; voltou-se favoravelmente para
  rationale: A formulação preserva a imagem veterotestamentária da visita de Deus como intervenção atenta e salvadora, sem restringir seu sentido a uma explicação específica.
- issue: Relação de «seu povo» com os dois verbos
  choice: visitou o seu povo e lhe trouxe redenção
  alternative: visitou e trouxe redenção ao seu povo
  rationale: O grego apresenta um único dativo depois dos dois verbos. A formulação portuguesa explicita de maneira natural que o povo é alvo da visita e beneficiário da redenção, sem alterar o conteúdo da construção.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmo excessivo; preserva-se a linguagem bíblica de bênção, visita e redenção.
