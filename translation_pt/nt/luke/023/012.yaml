id: LUK.23.12
reference: Luke 23:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: pt
  text: E, naquele mesmo dia, Herodes e Pilatos se tornaram amigos um do outro[a], pois antes havia inimizade entre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passaram a ter relações amistosas um com o outro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pois antes eram hostis um ao outro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: se tornaram
  rationale: Expressa naturalmente a mudança de estado ou de relacionamento indicada pelo aoristo de γίνομαι.
- source_word: φίλοι
  choice: amigos
  rationale: Reproduz de modo direto o predicativo plural, sem reduzir antecipadamente o sentido a mera cordialidade nem ampliá-lo para uma aliança política explícita.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Herodes e Pilatos
  rationale: A coordenação portuguesa identifica claramente as duas partes; não é necessário acrescentar “tanto... como” para preservar o sentido.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: naquele mesmo dia
  rationale: “Mesmo” conserva a ênfase temporal da construção grega de maneira natural em português.
- source_word: μετ’ ἀλλήλων
  choice: um do outro
  rationale: Torna explícita a reciprocidade do novo relacionamento.
- source_word: προϋπῆρχον
  choice: antes havia
  rationale: Comunica o estado contínuo anterior e seu contraste com a mudança ocorrida naquele dia.
- source_word: ἐν ἔχθρᾳ
  choice: inimizade
  rationale: Mantém o substantivo relacional forte do grego em português corrente e digno.
- source_word: ὄντες πρὸς αὑτούς
  choice: entre eles
  rationale: Integra o particípio e a expressão recíproca em uma formulação portuguesa fluente, preservando a mutualidade da inimizade.
theological_decisions:
- issue: Natureza da mudança no relacionamento entre Herodes e Pilatos
  choice: O texto diz que eles se tornaram amigos, sem definir se isso envolvia amizade pessoal profunda ou entendimento político.
  alternative: Traduzir de modo mais fraco como “passaram a manter relações amistosas” ou de modo mais específico como “tornaram-se aliados”.
  rationale: φίλοι permite amizade ou uma relação favorável, mas o versículo não explica a natureza, os motivos ou o significado teológico dessa aproximação. A tradução principal preserva a afirmação direta sem importar uma interpretação política ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada levemente para dar fluidez à narrativa, mantendo a ênfase em “naquele mesmo dia”. “Pilatos” segue a forma portuguesa tradicional e amplamente reconhecida.
