  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: pt
  text: As mulheres que tinham vindo com ele da Galileia seguiram e viram o túmulo e como o corpo dele foi colocado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o tinham acompanhado da Galileia».'
    reason: Alternativa lexical para a construção συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: seguiram
  rationale: O particípio aoristo indica uma ação anterior ou associada à ação principal. A coordenação «seguiram e viram» é natural em português e preserva a sequência narrativa.
- source_word: δέ
  choice: sem equivalente expresso
  rationale: A partícula marca uma transição narrativa leve. Neste contexto, omiti-la evita introduzir um «então» ou «ora» mais marcado do que o grego.
- source_word: αἱ γυναῖκες
  choice: as mulheres
  rationale: O artigo identifica um grupo já conhecido no contexto narrativo.
- source_word: αἵτινες
  choice: que
  rationale: O pronome relativo especifica quais mulheres estavam presentes; «que» é a forma natural e clara em português.
- source_word: ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: tinham vindo com ele da Galileia
  rationale: A construção perifrástica expressa uma ação anterior. A tradução mantém tanto a procedência da Galileia como a associação com Jesus, sem substituir o verbo de movimento por uma interpretação mais específica.
- source_word: ἐθεάσαντο
  choice: viram
  rationale: O verbo pode sugerir observação atenta, mas «viram» é natural e suficiente, pois os complementos explicitam o que observaram.
- source_word: τὸ μνημεῖον
  choice: o túmulo
  rationale: No contexto do sepultamento, «túmulo» é preciso, corrente e digno.
- source_word: ὡς
  choice: como
  rationale: Introduz a maneira pela qual o corpo foi colocado.
- source_word: ἐτέθη
  choice: havia sido colocado
  rationale: A voz passiva de τίθημι descreve a colocação do corpo. O mais-que-perfeito composto torna clara, em português, a anterioridade dessa ação em relação à observação das mulheres.
- source_word: τὸ σῶμα αὐτοῦ
  choice: o corpo dele
  rationale: Forma natural em português que mantém a referência masculina sem a possível ambiguidade formal de «seu corpo».
theological_decisions:
- issue: Relação temporal entre κατακολουθήσασαι e ἐθεάσαντο
  choice: 'ações coordenadas: «seguiram e viram»'
  alternative: «tendo seguido, viram»
  rationale: A coordenação comunica naturalmente a sequência narrativa sem transformar uma decisão estilística em interpretação doutrinária.
- issue: Sentido de συνεληλυθυῖαι ... αὐτῷ
  choice: «tinham vindo com ele»
  alternative: «o tinham acompanhado»
  rationale: A opção principal preserva mais diretamente a ideia verbal de vir junto, enquanto a nota registra a alternativa legítima que enfatiza o acompanhamento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase segue o fluxo narrativo do grego; evita-se um marcador discursivo inicial que não é necessário em português.
