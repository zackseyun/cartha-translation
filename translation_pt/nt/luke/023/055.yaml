  terminology: «Túmulo» é apropriado para μνημεῖον. «Tinham vindo com ele da Galileia» preserva satisfatoriamente a origem e a companhia. A nota lexical deve usar «da Galileia», e não «desde a Galileia», para manter explicitamente o valor de procedência de ἐκ.
  issues:
