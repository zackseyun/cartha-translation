  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: pt
  text: 'E começaram a acusá-lo, dizendo: “Encontramos este homem levando a nossa nação[a] ao erro, proibindo-nos de pagar tributos[b] a César e dizendo que ele mesmo é o Messias[c], um rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “subvertendo a nossa nação” ou “desviando a nossa nação”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego φόρους se refere a impostos ou tributos pagos ao governante romano.
    reason: cultural_note
  - marker: c
    text: Ou “dizendo que ele mesmo é o Cristo, um rei”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: E começaram a acusá-lo
  rationale: Preserva o sentido ingressivo de ἤρξαντο, o valor forense de κατηγορεῖν e representa δὲ de modo natural na continuidade narrativa.
- source_word: Τοῦτον εὕραμεν
  choice: Encontramos este homem
  rationale: Mantém a fórmula acusatória e torna natural em português o demonstrativo aplicado à pessoa, sem eliminar seu possível tom depreciativo.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: desencaminhando a nossa nação
  rationale: “Desencaminhando” comunica a ideia ampla de desviar ou levar ao erro sem restringir a acusação à rebelião política; “nação” preserva a dimensão coletiva e política de ἔθνος neste contexto perante Pilatos.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: proibindo-nos de pagar tributos a César
  rationale: κωλύοντα apresenta a alegação de que Jesus proibia o pagamento; “tributos” expressa o imposto devido ao poder romano, e “-nos” explicita o sujeito implícito de διδόναι conforme o contexto.
- source_word: λέγοντα αὑτὸν
  choice: dizendo que ele mesmo
  rationale: Mantém o verbo neutro λέγοντα e a ênfase reflexiva de αὑτόν sem acrescentar o julgamento implícito em “alegando”.
- source_word: χριστὸν βασιλέα εἶναι
  choice: é o Messias, um rei
  rationale: “Messias” conserva o sentido titular e régio de χριστός; “um rei” mantém βασιλέα como predicação adicional sem fundir os dois termos em um título teológico fixo.
theological_decisions:
- issue: Tradução de χριστόν na acusação politicamente carregada
  choice: o Messias
  alternative: o Cristo
  rationale: Aqui χριστός funciona como título ligado à identidade real reivindicada, não como nome próprio. “Messias” preserva o pano de fundo judaico do ungido esperado.
- issue: Relação entre χριστόν e βασιλέα
  choice: o Messias, um rei
  alternative: o Messias-Rei; o Messias, o rei
  rationale: A formulação mantém os dois predicativos do grego e sua tensão, sem transformá-los num título composto nem especificar que se trata de “o rei” de maneira mais definida do que o texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção natural para leitores brasileiros. Conserva o caráter formal da acusação judicial e evita tanto arcaísmos quanto terminologia denominacional.
