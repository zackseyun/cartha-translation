id: LUK.23.7
reference: Luke 23:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: pt
  text: Quando soube que Jesus estava sob a jurisdição de Herodes[a], Pilatos o enviou a Herodes, que também estava em Jerusalém naqueles dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sob a autoridade de Herodes». A expressão grega pode se referir ao território governado por Herodes ou à sua autoridade legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Quando soube
  rationale: O particípio aoristo indica ação anterior à do verbo principal; a oração temporal comunica isso de modo natural em português.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Jesus estava sob a jurisdição de Herodes
  rationale: A expressão designa o âmbito administrativo e jurídico de Herodes. Os nomes foram explicitados para evitar a sequência ambígua de pronomes em português.
- source_word: ἀνέπεμψεν αὐτὸν
  choice: Pilatos o enviou
  rationale: O verbo pode ter matiz de encaminhamento judicial neste contexto, mas «enviou» é claro e fiel; «Pilatos» explicita o sujeito implícito.
- source_word: πρὸς Ἡρῴδην
  choice: a Herodes
  rationale: πρός com acusativo indica movimento em direção a uma pessoa; esta é a construção portuguesa natural.
- source_word: ὄντα καὶ αὐτὸν
  choice: que também estava
  rationale: A oração relativa liga claramente a informação a Herodes; «também» preserva o valor de καί, enquanto a ênfase de αὐτόν não requer o pouco natural «ele próprio».
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Forma corrente do topônimo em português.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: naqueles dias
  rationale: Embora literalmente diga «nestes dias», a perspectiva narrativa passada pede naturalmente «naqueles dias» em português.
theological_decisions:
- issue: Sentido político-jurídico de ἐξουσία em relação a Herodes
  choice: jurisdição
  alternative: autoridade; domínio
  rationale: O contexto trata da competência governamental de Herodes Antipas sobre a região de origem de Jesus. «Jurisdição» preserva o sentido jurídico-administrativo sem atribuir aqui um sentido teológico a ἐξουσία.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os referentes «Jesus» e «Pilatos» foram explicitados porque a reprodução literal dos pronomes gregos criaria ambiguidade em um versículo isolado.
