source:
  edition: SBLGNT
  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: pt
  text: Mas eles continuavam insistindo em voz alta, pedindo que ele fosse crucificado, e suas vozes prevaleciam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέκειντο
  choice: continuavam insistindo
  rationale: O imperfeito expressa pressão persistente e repetida; a formulação é natural em português e preserva o aspecto durativo.
- source_word: φωναῖς μεγάλαις
  choice: em alta voz
  rationale: A expressão indica a maneira intensa e audível da insistência. Esta tradução é idiomática sem especificar além do texto se eram gritos.
- source_word: αἰτούμενοι
  choice: pedindo
  rationale: Preserva o sentido lexical básico de αἰτέω; a força da exigência já é comunicada pelo contexto e por 'continuavam insistindo'.
- source_word: αὐτὸν σταυρωθῆναι
  choice: que ele fosse crucificado
  rationale: Expressa naturalmente em português a construção de acusativo com infinitivo e conserva a voz passiva.
- source_word: κατίσχυον
  choice: prevaleciam
  rationale: O imperfeito apresenta as vozes ganhando e mantendo a vantagem no processo; 'prevaleciam' preserva esse valor aspectual.
- source_word: αἱ φωναὶ αὐτῶν
  choice: suas vozes
  rationale: Mantém o substantivo φωνή e, tanto quanto permite o português idiomático, a ligação lexical com a primeira ocorrência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a progressão verbal no imperfeito e evita intensificar αἰτούμενοι como 'exigindo', pois a insistência hostil já está explícita no restante da frase.
