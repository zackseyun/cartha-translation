source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: pt
  text: E nós, com justiça, porque estamos recebendo o que os nossos atos merecem; mas este homem não fez nada de errado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίως
  choice: com justiça
  rationale: Preserva o sentido adverbial e judicial de que a pena sofrida é justa e merecida, em linguagem portuguesa natural.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: porque estamos recebendo o que os nossos atos merecem
  rationale: Expressa de modo idiomático a proporcionalidade entre os atos praticados e as consequências recebidas, sem perder a relação causal marcada por γάρ.
- source_word: ἀπολαμβάνομεν
  choice: estamos recebendo
  rationale: A forma progressiva comunica o aspecto presente e contínuo da punição que eles sofrem naquele momento.
- source_word: οὗτος
  choice: este homem
  rationale: Mantém a força demonstrativa e torna claro, em português corrente, o contraste com os dois criminosos.
- source_word: οὐδὲν ἄτοπον
  choice: nada de errado
  rationale: Traduz com clareza o sentido de algo impróprio ou condenável no contexto, sem restringi-lo indevidamente a uma categoria jurídica específica.
- source_word: ἔπραξεν
  choice: fez
  rationale: O pretérito perfeito é natural em português e apresenta a declaração sobre os atos de Jesus sem acrescentar nuance ausente do grego.
theological_decisions:
- issue: A declaração do criminoso sobre a inocência de Jesus
  choice: mas este homem não fez nada de errado
  alternative: mas este homem não fez nada impróprio
  rationale: Formula claramente o testemunho de inocência no contexto imediato, sem ampliar a frase para uma afirmação doutrinária além do que o texto explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o contraste enfático entre a culpa merecidamente punida dos criminosos e a ausência de conduta errada em Jesus.
