id: LUK.23.25
reference: Luke 23:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: pt
  text: Então Pilatos soltou o homem que havia sido lançado na prisão por causa de uma revolta e de um homicídio, aquele que eles pediam; mas entregou Jesus à vontade deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao que eles queriam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: soltou
  rationale: No contexto de custódia, ἀπολύω indica pôr um preso em liberdade. “Soltou” é claro, natural e preciso em português.
- source_word: διὰ στάσιν καὶ φόνον
  choice: por causa de uma revolta e de um homicídio
  rationale: διά com acusativo expressa a causa. Aqui στάσις se refere a levante ou revolta civil, e φόνος ao ato de matar; os artigos indefinidos produzem uma formulação natural sem transformar os termos em nomes abstratos excessivamente gerais.
- source_word: βεβλημένον εἰς φυλακήν
  choice: havia sido lançado na prisão
  rationale: O particípio perfeito passivo de βάλλω conserva a imagem vívida de alguém lançado na prisão e indica um estado resultante de ação anterior.
- source_word: ὃν ᾐτοῦντο
  choice: aquele que eles pediam
  rationale: O imperfeito de αἰτέω retrata o pedido em andamento. “Pediam” preserva esse aspecto sem intensificar indevidamente o verbo para “exigiam”.
- source_word: παρέδωκεν
  choice: entregou
  rationale: παραδίδωμι descreve entregar alguém ao poder ou à disposição de outros. “Entregou” é idiomático e mantém o sentido judicial da transferência.
- source_word: τῷ θελήματι αὐτῶν
  choice: à vontade deles
  rationale: A expressão mantém a força volitiva de θέλημα e a construção concisa do grego, sem reduzi-la apenas a um desejo passageiro.
- source_word: δὲ ... δὲ
  choice: Então ... mas
  rationale: O primeiro δέ faz a narrativa avançar, enquanto o segundo marca o contraste entre o homem solto e Jesus entregue.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Transliteração portuguesa convencional do nome próprio, usado sem artigo conforme a estrutura da oração.
theological_decisions:
- issue: Contraste entre o revoltoso solto e Jesus entregue
  choice: Manter explícito o contraste narrativo sem acrescentar linguagem de substituição ou expiação.
  alternative: Acrescentar expressões interpretativas como “em lugar de Jesus” ou “para morrer por eles”.
  rationale: O versículo relata as decisões de Pilatos e a vontade da multidão, mas não formula explicitamente uma explicação doutrinária desses atos.
- issue: Agente explicitado em ἀπέλυσεν
  choice: Explicitar “Pilatos” para tornar claro o sujeito retomado do contexto imediato.
  alternative: Traduzir apenas “Então ele soltou”, acompanhando formalmente o sujeito implícito do grego.
  rationale: O grego codifica o sujeito na forma verbal e o contexto o identifica como Pilatos. Em português, o nome evita possível ambiguidade sem alterar a referência.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Revolta” é mais corrente que “insurreição”; “havia sido lançado” preserva a vivacidade do grego. O único marcador de nota aparece no fim da frase por esclarecer a expressão final.
