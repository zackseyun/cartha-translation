  source_fidelity: 'O texto traduz com precisão a estrutura e o sentido do grego: Pilatos solta o homem preso por causa de revolta e homicídio, que a multidão pedia, e entrega Jesus à vontade deles. “Havia sido lançado na prisão” conserva adequadamente o perfeito passivo e a vivacidade de βεβλημένον. A explicitação de “Pilatos” é contextual e não acrescenta conteúdo indevido.'
  naturalness: A redação é fluente, moderna e amplamente compreensível em português, incluindo o uso brasileiro. “Soltou”, “revolta”, “homicídio” e “à vontade deles” são naturais no registro narrativo digno adotado. A construção “aquele que eles pediam” é clara e preserva o aspecto em curso de ᾐτοῦντο de modo suficiente.
  terminology: “Revolta” comunica bem στάσις no contexto político-criminal sem recorrer a linguagem excessivamente técnica; “homicídio” reproduz φόνος com precisão. “Entregou Jesus” preserva o sentido judicial de παρέδωκεν, e “à vontade deles” mantém a força volitiva de τῷ θελήματι αὐτῶν sem impor interpretação teológica.
