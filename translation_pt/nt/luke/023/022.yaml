base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: pt
  text: 'Ele, porém, lhes disse pela terceira vez: “Pois que mal fez este homem?[a] Não encontrei nele motivo algum para a pena de morte.[b] Portanto, depois de castigá-lo,[c] vou soltá-lo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por quê? Que mal este homem fez?” O Τί inicial pode ser entendido como um protesto elíptico que introduz a pergunta completa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não encontrei nele nada que mereça a morte”, “nenhuma causa para a morte” ou “nenhum fundamento para uma sentença de morte”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “depois de puni-lo”; possivelmente, em sentido mais específico, “depois de açoitá-lo”. O grego παιδεύσας indica punição disciplinar, mas a palavra, por si só, não especifica sua forma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: pela terceira vez
  rationale: O acusativo adverbial indica repetição; esta formulação é natural em português e mantém a ênfase narrativa.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Mas por quê? Que mal este homem fez?
  rationale: Τί pode funcionar elipticamente como protesto antes da pergunta completa, enquanto γάρ liga a objeção ao pedido anterior. A formulação preserva esse movimento discursivo e traduz κακόν como “mal”.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: motivo algum para a pena de morte
  rationale: No contexto judicial, αἴτιον expressa motivo, causa ou fundamento. “Pena de morte” torna claro que se trata de uma sentença, sem atribuir ao texto uma acusação específica.
- source_word: εὗρον ἐν αὐτῷ
  choice: Não encontrei nele
  rationale: Mantém de perto a expressão grega e comunica o resultado vigente da avaliação de Pilatos.
- source_word: παιδεύσας
  choice: depois de castigá-lo
  rationale: Neste contexto, o verbo designa tratamento disciplinar punitivo. “Castigar” é claro e amplo, sem especificar uma forma de punição que o verbo isoladamente não determina.
- source_word: ἀπολύσω
  choice: vou soltá-lo
  rationale: No contexto judicial, ἀπολύω significa pôr em liberdade. “Vou soltá-lo” é natural e direto em português contemporâneo.
theological_decisions:
- issue: Natureza da ação proposta por Pilatos em παιδεύσας
  choice: Traduzir de modo geral como castigo, sem determinar sua forma exata.
  alternative: “depois de puni-lo” ou, mais especificamente, “depois de açoitá-lo”
  rationale: Pilatos declara não haver fundamento para a pena de morte, mas ainda propõe uma punição menor. O verbo grego admite uma ação disciplinar ou punitiva, porém não especifica por si só o método; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom judicial e a insistência de Pilatos, sem suavizar a punição proposta nem especificá-la além do grego.
