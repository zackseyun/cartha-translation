  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: pt
  text: Este homem foi até Pilatos e pediu o corpo de Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Este homem
  rationale: O demonstrativo retoma José de Arimateia, mencionado no versículo anterior. “Este homem” preserva essa força anafórica com clareza e naturalidade.
- source_word: προσελθὼν
  choice: foi até
  rationale: O particípio aoristo indica uma ação que precede e acompanha o pedido. “Foi até” expressa isso de modo idiomático, sem a rigidez possível de “aproximou-se de”.
- source_word: τῷ Πιλάτῳ
  choice: Pilatos
  rationale: O dativo indica a pessoa a quem José se dirigiu. Com “foi até”, não é necessária preposição adicional antes do nome; não se acrescenta “Pôncio”, ausente neste versículo.
- source_word: ᾐτήσατο
  choice: pediu
  rationale: Neste contexto, o verbo significa solicitar algo. “Pediu o corpo” é natural e transmite adequadamente o sentido, sem formalidade excessiva.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: A tradução direta mantém a sobriedade do grego. “Cadáver” seria mais explícito e mais áspero do que o texto-fonte exige.
- source_word: τοῦ Ἰησοῦ
  choice: de Jesus
  rationale: O genitivo estabelece uma relação possessiva simples, expressa naturalmente em português por “de Jesus”.
