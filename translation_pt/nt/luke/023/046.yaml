  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: pt
  text: 'E Jesus, clamando em alta voz, disse: “Pai, em tuas mãos entrego o meu espírito.”[a] Depois de dizer isso, deu o último suspiro.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confio o meu espírito aos teus cuidados”. O verbo indica colocar algo sob os cuidados de outra pessoa. Esta declaração também ecoa o Salmo 31:5 na tradução grega das Escrituras: “Em tuas mãos entrego o meu espírito”.'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 'Ou: “expirou” ou, simplesmente, “morreu”. O verbo grego se refere literalmente a expirar, isto é, a respirar para fora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: clamando em alta voz
  rationale: Reproduz a força da expressão grega e soa natural e solene em português, sem sugerir necessariamente desespero.
- source_word: Πάτερ
  choice: Pai
  rationale: Mantém o vocativo direto sem acrescentar o possessivo “meu”, ausente no grego.
- source_word: εἰς χεῖράς σου
  choice: em tuas mãos
  rationale: Preserva o plural e a formulação que ecoa o Salmo 31:5 na Septuaginta; “em” é a forma idiomática corrente em português para esta entrega.
- source_word: παρατίθεμαι
  choice: entrego
  rationale: Expressa o ato deliberado de colocar o espírito sob os cuidados do Pai. “Confio” seria possível, mas “entrego” preserva melhor tanto o gesto de entrega quanto o eco bíblico.
- source_word: τὸ πνεῦμά μου
  choice: o meu espírito
  rationale: “Espírito” conserva a amplitude semântica e o peso do contexto de oração melhor do que a opção estritamente fisiológica “sopro”.
- source_word: τοῦτο δὲ εἰπών
  choice: Depois de dizer isso
  rationale: Torna clara e natural a anterioridade da ação expressa pelo particípio aoristo.
- source_word: ἐξέπνευσεν
  choice: deu o último suspiro
  rationale: Comunica de modo idiomático a morte e mantém a imagem do verbo grego ligado ao ato de expirar.
theological_decisions:
- issue: Sentido de τὸ πνεῦμά μου na palavra final de Jesus
  choice: o meu espírito
  alternative: o meu sopro
  rationale: A oração consciente dirigida ao Pai e o verbo de entrega favorecem “espírito”, sem definir além do texto a relação entre espírito, vida e morte.
- issue: Força de παρατίθεμαι
  choice: entrego
  alternative: confio
  rationale: O presente grego funciona como declaração performativa de autoentrega. “Entrego” é claro e preserva a ação intencional, enquanto a nota registra a nuance de confiar aos cuidados de alguém.
- issue: Descrição da morte em ἐξέπνευσεν
  choice: deu o último suspiro
  alternative: expirou
  rationale: A expressão mantém a imagem respiratória do original e afirma a morte sem introduzir uma explicação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala usa “tuas” para conservar o tom bíblico solene sem formas verbais marcadamente regionais. A pontuação e a ordem sintática favorecem leitura pública natural.
