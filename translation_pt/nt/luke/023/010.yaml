  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: pt
  text: Os chefes dos sacerdotes e os escribas estavam ali, de pé, acusando-o com veemência[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresentando acusações contra ele com grande insistência” ou “acusando-o ferozmente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: estavam ali
  rationale: O mais-que-perfeito de ἵστημι tem aqui valor estativo e indica que eles permaneciam presentes na cena; “estavam ali” é natural em português sem enfatizar desnecessariamente a postura física.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula faz uma transição narrativa leve. Em português, a continuidade é transmitida naturalmente pela própria sequência, sem necessidade de “e” ou “mas”.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa as principais autoridades sacerdotais, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Equivalente direto, tradicional e amplamente reconhecido para os especialistas ligados à interpretação e aplicação da Lei.
- source_word: εὐτόνως
  choice: com veemência
  rationale: Expressa a intensidade e o vigor hostil das acusações em linguagem clara e digna.
- source_word: κατηγοροῦντες
  choice: acusando-o
  rationale: O particípio presente apresenta uma ação contínua concomitante à presença deles diante de Herodes.
- source_word: αὐτοῦ
  choice: -o
  rationale: O genitivo regido por κατηγορέω identifica a pessoa contra quem se faz a acusação; o pronome objeto é a formulação idiomática em português.
