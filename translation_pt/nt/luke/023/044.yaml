source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: pt
  text: Já era por volta da hora sexta[a], e houve trevas sobre toda a terra[b] até a hora nona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, aproximadamente do meio-dia até as três horas da tarde.
    reason: cultural_note
  - marker: b
    text: 'Ou: sobre toda a região. A palavra grega γῆ pode significar «terra» ou «região».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Indica que esse momento da narrativa já havia chegado; «já» é direto e natural em português.
- source_word: ὡσεὶ
  choice: por volta de
  rationale: Expressa aproximação, sem sugerir uma hora exata.
- source_word: ὥρα ἕκτη
  choice: hora sexta
  rationale: Preserva a forma antiga de contar as horas e a textura narrativa do original; o equivalente moderno é explicado em nota.
- source_word: σκότος
  choice: trevas
  rationale: É uma tradução corrente e digna para a escuridão extraordinária descrita no contexto da crucificação.
- source_word: ἐγένετο
  choice: houve
  rationale: Transmite de modo natural o surgimento do fenômeno, sem acrescentar uma imagem ausente do grego.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sobre toda a terra
  rationale: Mantém em português a possível amplitude de γῆ, que pode designar a terra ou uma região; a nota explicita essa ambiguidade.
- source_word: ἕως ὥρας ἐνάτης
  choice: até a hora nona
  rationale: Mantém a expressão temporal do original em paralelo com «hora sexta»; a conversão aproximada é dada em nota.
theological_decisions:
- issue: Alcance de γῆ no relato das trevas
  choice: terra, com a ambiguidade explicitada em nota
  alternative: região; mundo inteiro
  rationale: O substantivo grego permite tanto uma referência regional quanto mais ampla. A tradução não determina indevidamente se as trevas foram locais ou universais.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas compreensíveis. «Hora sexta» e «hora nona» preservam a contagem antiga, enquanto a nota oferece ao leitor a equivalência horária moderna.
