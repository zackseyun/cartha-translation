  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: pt
  text: 'Pois vejam: estão chegando os dias em que dirão: “Felizes as mulheres estéreis, os ventres que nunca deram à luz e os seios que nunca amamentaram!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Mantém a função de chamar a atenção para o anúncio, em linguagem natural e atual, sem o tom arcaico de “eis”.
- source_word: Μακάριαι
  choice: Felizes
  rationale: Expressa a declaração de condição considerada afortunada no contexto, sem acrescentar uma noção específica de bênção divina.
- source_word: αἱ στεῖραι
  choice: as mulheres estéreis
  rationale: Explicita o referente feminino do adjetivo substantivado e conserva o sentido de incapacidade de gerar filhos.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: os ventres que nunca deram à luz
  rationale: Preserva a imagem corporal do grego e traduz o aoristo no contexto como uma experiência jamais ocorrida.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: os seios que nunca amamentaram
  rationale: No paralelismo materno, o verbo significa nutrir ao seio; “amamentaram” comunica isso diretamente em português.
theological_decisions:
- issue: A esterilidade declarada feliz diante do sofrimento futuro
  choice: Conservar a formulação paradoxal sem explicá-la no versículo
  alternative: Parafrasear como uma preferência motivada pelas calamidades futuras
  rationale: O texto apresenta deliberadamente uma inversão chocante dos valores habituais; explicá-la apagaria parte de sua força e anteciparia o contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Pois vejam” liga o versículo ao motivo dado por ὅτι e reproduz o chamado de atenção de ἰδού. O paralelismo entre mulheres, ventres e seios foi preservado.
