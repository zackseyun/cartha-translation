base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: pt
  text: o qual havia sido lançado na prisão por causa de certa revolta ocorrida na cidade[a] e por assassinato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insurreição”. A palavra grega στάσις pode indicar revolta, levante ou insurreição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: o qual
  rationale: Retoma especificamente Barrabás e preserva a função relativa do grego; a forma é clara e digna neste fragmento de frase.
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, expressa a causa de sua prisão e distingue com clareza essa relação causal.
- source_word: στάσιν
  choice: revolta
  rationale: Comunica uma perturbação cívica violenta ou levante político em português corrente, sem restringir indevidamente o sentido.
- source_word: τινὰ
  choice: certa
  rationale: Mantém a indefinição expressa por τις, sem identificar ou especificar a revolta.
- source_word: γενομένην ἐν τῇ πόλει
  choice: ocorrida na cidade
  rationale: Reproduz de modo conciso e natural o particípio que modifica 'revolta', sem explicitar qual cidade o grego deixa implícita.
- source_word: φόνον
  choice: assassinato
  rationale: Preserva o sentido criminal de homicídio intencional, mais específico do que uma morte ou matança em geral.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: havia sido lançado na prisão
  rationale: Mantém a força do passivo de βάλλω e a anterioridade contextual, em linguagem portuguesa natural e solene.
