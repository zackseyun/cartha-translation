    issue: Âncora da nota colocada após «Preparação»
    rationale: A nota explica ἐπέφωσκεν e a expressão «o sábado estava amanhecendo», não «Preparação». A âncora deve ser deslocada para depois de «estava começando», preservando com clareza a relação entre nota e palavra explicada.
  revised_text: Era o dia da Preparação, e o sábado estava começando.[a]
  revised_footnotes:
  - marker: a
    text: Mais literalmente, “o sábado estava amanhecendo”. O verbo grego pode significar “amanhecer” ou “começar”; aqui se refere ao início do sábado ao entardecer.
    reason: lexical_alternative
  revision_rationale: Desloca-se exclusivamente a âncora da nota para a oração que contém ἐπέφωσκεν. O texto e a nota conservam o sentido contextual do original e registram a alternativa lexical mais literal sem criar a impressão de que o sábado começava pela manhã.
