  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: pt
  text: Era o dia da Preparação, e o sábado estava começando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “o sábado estava amanhecendo”. O verbo grego pode significar “amanhecer” ou “começar”; aqui se refere ao início do sábado ao entardecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: Preparação
  rationale: No uso judaico do grego, παρασκευή designa o dia de preparação anterior ao sábado. A inicial maiúscula preserva seu caráter de designação reconhecida sem substituí-la pelo equivalente interpretativo «sexta-feira».
- source_word: σάββατον
  choice: o sábado
  rationale: Embora o grego não tenha artigo, o referente definido é claro no contexto; o português pede naturalmente «o sábado».
- source_word: ἐπέφωσκεν
  choice: estava começando
  rationale: O verbo pode significar literalmente «amanhecer», mas aqui descreve o início do sábado ao entardecer. «Estava começando» transmite o sentido contextual sem sugerir que já era manhã; a imagem lexical é preservada em nota.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Era o dia da Preparação
  rationale: Formulação natural e digna em português que conserva a construção temporal e o sentido calendárico do grego.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação narrativa de Lucas na segunda oração; o primeiro καί não precisa ser reproduzido por «e» no início, pois «Era» dá continuidade natural ao relato em português.
theological_decisions:
- issue: Sentido de ἐπέφωσκεν em relação ao início do sábado
  choice: O sábado estava começando ao entardecer.
  alternative: O sábado estava amanhecendo.
  rationale: No contexto judaico, o sábado começa ao entardecer. A tradução principal evita sugerir uma alvorada matinal, mas a nota conserva a expressão mais literal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Dia da Preparação» preserva a terminologia judaica do período; «estava começando» esclarece o referente temporal sem apagar a alternativa literal, registrada em nota.
