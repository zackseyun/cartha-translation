  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: pt
  text: 'e diziam: “Se você é o Rei dos judeus[a], salve a si mesmo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos judeanos”. O grego Ἰουδαίων pode referir-se aos judeus ou aos habitantes da Judeia, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa que liga esta ação à narrativa do versículo anterior.
- source_word: λέγοντες
  choice: diziam
  rationale: O particípio presente retoma o sujeito plural do contexto anterior; em português, a forma verbal finita produz uma ligação narrativa natural sem acrescentar explicitamente a ideia de zombaria ao verbo.
- source_word: Εἰ
  choice: Se
  rationale: Preserva a condição usada como desafio provocador, sem sugerir que os falantes reconheçam a afirmação como verdadeira.
- source_word: σὺ εἶ
  choice: você é
  rationale: Expressa de modo natural em português a segunda pessoa enfática do grego; o contexto já comunica o destaque do pronome explícito.
- source_word: ὁ βασιλεὺς
  choice: o Rei
  rationale: Mantém o artigo e o título régio específico lançado contra Jesus; a inicial maiúscula segue o uso titular, sem retirar a ironia contextual.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: É a formulação tradicional e contextualmente adequada do título político-messiânico na narrativa da paixão; a alternativa regional ou étnica “dos judeanos” é preservada em nota.
- source_word: σῶσον
  choice: salve
  rationale: Imperativo direto que conserva a ligação lexical com os demais usos de σῴζω em Lucas.
- source_word: σεαυτόν
  choice: a si mesmo
  rationale: Representa com clareza o objeto reflexivo do imperativo e soa digno e natural no registro bíblico moderno.
theological_decisions:
- issue: Tradução do título régio βασιλεὺς τῶν Ἰουδαίων
  choice: o Rei dos judeus
  alternative: o rei dos judeanos
  rationale: Na narrativa da crucificação, a expressão funciona como título carregado de sentido político e messiânico, empregado em acusação e zombaria. “Dos judeus” comunica melhor o título estabelecido, enquanto a nota preserva a possível nuance regional ou étnica de Ἰουδαίων.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “e diziam” integra naturalmente o particípio grego à sequência narrativa. A fala mantém o tom condicional de desafio sem inserir no verbo uma interpretação explícita de zombaria.
