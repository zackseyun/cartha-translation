reference: Luke 23:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: pt
  text: 'Então Pilatos lhe perguntou: “Você é o rei dos judeus[a]?” Ele respondeu: “Você o diz[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judeanos”. O termo grego pode referir-se a judeus ou, conforme o contexto, a habitantes da Judeia.
    reason: lexical_alternative
  - marker: b
    text: Ou “Sim, é como você diz”. A resposta grega é concisa e pode ser entendida como uma afirmação qualificada.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Então / Ele
  rationale: O primeiro δέ faz a narrativa avançar com uma conexão leve, expressa naturalmente por “Então”. O segundo introduz a resposta e não precisa de um conectivo explícito em português.
- source_word: ἠρώτησεν αὐτόν λέγων
  choice: lhe perguntou
  rationale: Em português atual, “perguntou-lhe, dizendo” seria uma reprodução desnecessariamente rígida do particípio semítico; “lhe perguntou” comunica plenamente o ato de fala.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: A pontuação e o contexto dão à oração valor interrogativo. “Você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: o rei dos judeus
  rationale: Preserva o título régio e a formulação convencional da acusação. A possível acepção geográfica de Ἰουδαῖοι é registrada em nota.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Ele respondeu
  rationale: A formulação portuguesa reúne naturalmente o particípio e o verbo de fala, mantendo a relação responsiva sem repetição pesada.
- source_word: Σὺ λέγεις
  choice: É você quem está dizendo
  rationale: Mantém a ênfase explícita em σύ e a forma indireta e concisa da resposta, sem transformá-la num “sim” inequívoco nem numa negação.
theological_decisions:
- issue: Força da resposta Σὺ λέγεις
  choice: 'Uma resposta deliberadamente indireta: “É você quem está dizendo”.'
  alternative: “Você o diz” ou “Sim, é como você diz”.
  rationale: A expressão pode funcionar como assentimento qualificado, mas sua concisão preserva distância em relação à formulação de Pilatos. A tradução evita resolver a tensão cristológica e retórica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com legibilidade brasileira. O particípio redundante λέγων foi traduzido de modo idiomático; a resposta final conserva a ambiguidade e a ênfase do grego.
