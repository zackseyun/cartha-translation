  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: pt
  text: 'Então começarão a dizer aos montes[a]: “Caiam sobre nós!”, e às colinas[b]: “Cubram-nos!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta formulação ecoa a linguagem profética de juízo, especialmente Oseias 10:8.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Escondam-nos”. O verbo significa literalmente “cobrir”, mas, neste contexto, também transmite a ideia de ocultar diante do juízo que se aproxima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência temporal em relação ao contexto anterior e mantém de modo natural a projeção futura.
- source_word: ἄρξονται λέγειν
  choice: começarão a dizer
  rationale: Preserva o aspecto ingressivo de ἄρξονται com o infinitivo complementar λέγειν, em vez de reduzir a expressão a um simples “dirão”.
- source_word: τοῖς ὄρεσιν
  choice: aos montes
  rationale: ὄρος pode designar monte ou montanha; “montes” é corrente em português e mantém a distinção em relação a βουνοῖς, traduzido por “colinas”.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Caiam sobre nós
  rationale: Reproduz diretamente o imperativo plural e o movimento expresso por ἐπί com acusativo.
- source_word: τοῖς βουνοῖς
  choice: às colinas
  rationale: βουνός designa tipicamente uma elevação menor e contrasta aqui com ὄρεσιν.
- source_word: Καλύψατε ἡμᾶς
  choice: Cubram-nos
  rationale: Mantém o sentido concreto primário de καλύπτω e preserva a imagem profética, sem explicitar no texto a ideia contextual de esconder.
theological_decisions:
- issue: Linguagem profética de juízo e alusão a Oseias 10:8
  choice: Manter literalmente o clamor dirigido aos montes e às colinas.
  alternative: Explicitar no texto que as pessoas pedem para ser escondidas do juízo.
  rationale: A formulação concreta preserva a alusão profética e sua tensão teológica, sem introduzir interpretação explicativa no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Montes” e “colinas” preservam a distinção lexical do grego; os imperativos no plural concordam naturalmente com esses substantivos.
