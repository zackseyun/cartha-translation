  source_fidelity: A tradução mantém adequadamente a coordenação narrativa, o pedido direto a Jesus e a construção futura de ὅταν com subjuntivo. “Lembra-te de mim” traduz com precisão μνήσθητί μου sem explicitar indevidamente a implicação de favor. “Quando vieres no teu reino” conserva de modo formal e aberto o ἐν do texto SBLGNT, sem substituir o texto por uma leitura direcional ou por uma interpretação do poder régio.
  naturalness: O português é claro, digno e amplamente compreensível. “Lembra-te”, “vieres” e “teu” formam uma segunda pessoa singular coerente e apropriada à fala dirigida a Jesus. A formulação “vieres no teu reino”, embora mais solene do que coloquial, é natural no registro bíblico e preserva a construção deliberadamente concisa do original.
  terminology: “Jesus” e “reino” são as formas estabelecidas e adequadas. A nota informa corretamente, sem favorecer doutrinariamente uma leitura, que há manuscritos com formulação direcional, enquanto o SBLGNT traz a expressão locativa.
