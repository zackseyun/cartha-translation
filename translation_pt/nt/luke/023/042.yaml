id: LUK.23.42
reference: Luke 23:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: pt
  text: 'E ele disse: “Jesus, lembra-te de mim quando vieres no teu reino.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem mais explicitamente “para o teu reino”; o texto do SBLGNT diz “no teu reino”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a coordenação narrativa simples, sem acrescentar uma relação temporal ou causal não expressa.
- source_word: ἔλεγεν
  choice: ele disse
  rationale: Embora o imperfeito possa ser vertido por “dizia”, no relato esta forma introduz naturalmente uma fala pontual; “ele disse” é corrente e não altera o sentido.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma vocativa do nome próprio, transliterada segundo o uso português estabelecido.
- source_word: μνήσθητί μου
  choice: lembra-te de mim
  rationale: Reproduz de modo direto o imperativo e seu complemento. O pedido pode implicar consideração favorável e ação, mas essa implicação não é explicitada além do grego.
- source_word: ὅταν ἔλθῃς
  choice: quando vieres
  rationale: Expressa naturalmente em português a referência futura construída com ὅταν e o subjuntivo, sem definir uma cronologia mais precisa.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: no teu reino
  rationale: Segue o sentido locativo mais direto de ἐν e preserva a formulação do texto SBLGNT. “Reino” continua permitindo tanto a ideia de domínio quanto a de governo real; a variante direcional é registrada em nota.
theological_decisions:
- issue: Nuance escatológica do pedido dirigido a Jesus
  choice: O homem pede que Jesus se lembre dele quando vier no seu reino, sem especificar a cronologia ou a forma dessa vinda.
  alternative: Entender a expressão como a chegada de Jesus em poder régio ou como sua entrada no reino consumado.
  rationale: O versículo associa a Jesus um reino futuro, mas não define por si só todo o cenário escatológico. A tradução conserva essa expectativa e sua abertura interpretativa.
- issue: Sentido de μνήσθητί no pedido
  choice: “lembra-te”
  alternative: “lembra-te favoravelmente” ou “cuida de mim”
  rationale: Em contexto de súplica, “lembrar” pode envolver agir em favor de alguém, mas explicitar isso no texto principal resolveria uma implicação que o grego deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento na segunda pessoa singular (“lembra-te”, “vieres”, “teu”) preserva a forma direta e solene da súplica sem soar arcaico. A nota foi colocada junto à expressão a que se refere.
