source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: pt
  text: Pois, se fazem estas coisas quando a madeira está verde[a][b], o que acontecerá quando estiver seca?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na madeira verde ... na seca». O grego usa literalmente uma construção com «em», que pode ser entendida como «no caso da madeira verde ... no caso da seca».'
    reason: lexical_alternative
  - marker: b
    text: 'A imagem provavelmente argumenta do menor para o maior: se tais coisas são feitas quando a madeira está verde, o que ocorrerá quando estiver seca? Os referentes exatos da metáfora não são explicitados.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão que sustenta o lamento e a advertência anteriores, preservando a força causal com naturalidade em português.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: com a madeira verde
  rationale: Mantém a imagem proverbial e expressa de modo natural a madeira ainda úmida, que não queima facilmente. A preposição «com» conserva a formulação aberta sem transformar a metáfora em explicação.
- source_word: ὑγρῷ
  choice: verde
  rationale: Embora possa significar «úmido» ou «molhado», no contraste com ξηρός a expressão portuguesa corrente é «madeira verde».
- source_word: ξύλῳ
  choice: madeira
  rationale: Neste dito, «madeira» comunica melhor a imagem de material combustível do que «árvore» ou «lenho», sem especificar demais o referente metafórico.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o demonstrativo plural e sua referência abrangente às ações que estão sendo praticadas.
- source_word: ποιοῦσιν
  choice: fazem
  rationale: Reproduz o presente ativo e mantém indefinido o sujeito plural, assim como no grego.
- source_word: ἐν τῷ ξηρῷ
  choice: com a seca
  rationale: Retoma elipticamente «madeira» e conserva o contraste paralelo entre verde e seca em português natural.
- source_word: τί γένηται
  choice: o que acontecerá
  rationale: Expressa com clareza a consequência prevista na pergunta retórica, sem enfraquecê-la com uma possibilidade meramente eventual.
theological_decisions:
- issue: Imagem metafórica da madeira verde e da seca
  choice: Manter a metáfora sem identificar seus referentes no texto principal.
  alternative: Explicitar Jesus como a madeira verde e Jerusalém ou seu povo como a seca, ou apresentar o dito apenas como princípio geral do menor para o maior.
  rationale: O dito provavelmente avança de uma situação menos provável para outra mais grave, ligada ao juízo vindouro, mas os referentes exatos permanecem interpretativos. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Madeira verde» é expressão corrente; a elipse «a seca» evita repetição pesada e mantém o paralelismo. Os marcadores aparecem em ordem alfabética no texto.
