id: LUK.23.11
reference: Luke 23:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: pt
  text: Herodes também, junto com seus soldados, tratou Jesus com desprezo e zombou dele. Depois de vesti-lo com uma roupa esplêndida[a], enviou-o de volta a Pilatos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma veste brilhante”. A palavra grega também pode significar “brilhante”; provavelmente, a roupa fazia parte da zombaria de Herodes, dando a Jesus uma aparência de falsa honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: tratou Jesus com desprezo
  rationale: O particípio indica considerar alguém sem valor ou tratá-lo com desprezo. A formulação explicita a humilhação pública e evita que o pronome repetido torne a frase pesada.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: junto com seus soldados
  rationale: στράτευμα pode designar tropas ou soldados; “soldados” é claro e natural neste contexto narrativo.
- source_word: ἐμπαίξας
  choice: zombou dele
  rationale: Expressa diretamente a ação de ridicularizar, em linguagem corrente e digna.
- source_word: περιβαλὼν
  choice: depois de vesti-lo com
  rationale: O particípio descreve a colocação da roupa em Jesus; a construção temporal comunica com naturalidade a sequência das ações.
- source_word: ἐσθῆτα λαμπρὰν
  choice: uma roupa esplêndida
  rationale: ἐσθής designa roupa ou veste, e λαμπρός pode significar brilhante, esplêndido ou magnífico. A escolha não especifica indevidamente que se tratava de um manto real.
- source_word: ἀνέπεμψεν
  choice: enviou-o de volta
  rationale: No contexto judicial, o verbo indica o envio de Jesus de volta à autoridade anterior.
- source_word: τῷ Πιλάτῳ
  choice: a Pilatos
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions:
- issue: Sentido da roupa na zombaria de Herodes
  choice: Preservar a possível ironia de uma aparência honrosa sem definir a roupa como manto real.
  alternative: Interpretar explicitamente a peça como um manto real ou como sinal de loucura e frivolidade.
  rationale: O contexto associa a roupa ao desprezo e à zombaria, mas o grego afirma apenas que era brilhante ou esplêndida. A tradução mantém essa tensão sem acrescentar uma interpretação simbólica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Herodes também” reflete δὲ ... καὶ ὁ Ἡρῴδης. O nome “Jesus” substitui o primeiro pronome por clareza contextual, sem alterar o referente.
