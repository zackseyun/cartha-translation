  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: pt
  text: 'Então Pilatos disse aos chefes dos sacerdotes e às multidões: “Não encontro neste homem motivo algum para acusação.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não encontro culpa alguma neste homem.” A palavra grega αἴτιον pode significar “culpa”, mas, neste contexto, tem sentido judicial: nenhum motivo válido para acusação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Conector narrativo leve; “Então” expressa com naturalidade a progressão do relato, sem impor um contraste forte.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa a liderança sacerdotal superior e evita sugerir que havia vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: ὄχλους
  choice: multidões
  rationale: Preserva o plural grego e distingue o grupo popular da liderança sacerdotal.
- source_word: Οὐδὲν εὑρίσκω αἴτιον
  choice: Não encontro ... motivo algum para acusação
  rationale: Formulação portuguesa natural que conserva o presente da declaração e explicita o sentido judicial de αἴτιον.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: neste homem
  rationale: Mantém de perto a construção grega e soa natural em português com “encontrar motivo ... neste homem”.
