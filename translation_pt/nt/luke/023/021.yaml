source:
  edition: SBLGNT
  text: οἱ δὲ ἐπεφώνουν λέγοντες· ⸂Σταύρου σταύρου⸃ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: pt
  text: 'Mas eles continuavam gritando: “Crucifique-o! Crucifique-o!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Execute-o numa cruz! Execute-o numa cruz!”'
    reason: Alternativa lexical que explicita o modo de execução inerente ao verbo grego.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: O artigo funciona substantivamente e retoma as pessoas mencionadas no contexto; δέ marca aqui contraste com a fala anterior.
- source_word: ἐπεφώνουν
  choice: continuavam gritando
  rationale: O imperfeito expressa ação contínua ou repetida, e ἐπιφωνέω indica clamor em voz alta.
- source_word: λέγοντες
  choice: introduzido diretamente pelos dois-pontos
  rationale: O particípio introduz o conteúdo do clamor. Em português natural, os dois-pontos comunicam essa relação sem o redundante 'dizendo'.
- source_word: Σταύρου σταύρου
  choice: Crucifique-o! Crucifique-o!
  rationale: O imperativo repetido transmite insistência e urgência. Em português, repetir a oração completa preserva naturalmente a força do clamor; o pronome objeto expresso em cada ordem corresponde semanticamente ao único αὐτόν grego.
- source_word: αὐτόν
  choice: -o
  rationale: O pronome acusativo refere-se diretamente a Jesus e é expresso de modo idiomático como pronome enclítico.
theological_decisions:
- issue: Sentido de σταύρου
  choice: Crucifique-o
  alternative: Execute-o numa cruz
  rationale: σταυρόω designa especificamente executar por crucificação. 'Crucificar' é preciso, corrente e não acrescenta interpretação teológica ao sentido lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação direta reproduz a urgência da repetição, e a omissão de 'dizendo' evita uma construção pouco natural sem perder conteúdo.
