  source_fidelity: O texto reproduz adequadamente οἱ δέ como «Mas eles», o imperfeito iterativo de ἐπεφώνουν como «continuavam gritando» e a urgência da repetição de Σταύρου. A substituição de λέγοντες por dois-pontos é uma adaptação sintática natural em português que conserva sua função de introduzir o conteúdo do clamor. Embora αὐτόν ocorra uma só vez no grego, sua explicitação em cada imperativo é idiomática em português e não altera o sentido.
  naturalness: '«Mas eles continuavam gritando: “Crucifique-o! Crucifique-o!”» é claro, moderno, solene sem ser arcaico e plenamente compreensível para leitores brasileiros e internacionais. A repetição de orações completas soa mais natural do que deixar o primeiro imperativo sem objeto.'
