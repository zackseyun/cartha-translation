  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: pt
  text: Então Pilatos convocou os principais sacerdotes, as autoridades e o povo
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: δὲ
  choice: Então
  rationale: Marca uma transição narrativa suave. “Então” expressa o avanço da cena sem impor um contraste forte que o contexto não exige.
- source_word: συγκαλεσάμενος
  choice: reuniu
  rationale: O particípio aoristo indica que Pilatos convocou essas pessoas antes de lhes falar. Em português corrente, a forma verbal finita produz uma frase natural e preserva a sequência da ação.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: No plural, designa os principais membros da autoridade sacerdotal, não vários ocupantes simultâneos do cargo singular de sumo sacerdote.
- source_word: ἄρχοντας
  choice: as autoridades
  rationale: No contexto, refere-se aos dirigentes com posição oficial. “Autoridades” é natural em português e mantém esse sentido institucional.
- source_word: λαὸν
  choice: o povo
  rationale: Preserva o sentido coletivo de λαός sem reduzi-lo necessariamente a uma multidão momentânea.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura participial grega foi convertida em oração principal para maior naturalidade, sem alterar a ordem dos acontecimentos. O versículo termina sem ponto final porque a declaração de Pilatos continua no versículo seguinte.
