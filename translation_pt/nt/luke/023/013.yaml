  naturalness: «Pilatos convocou os principais sacerdotes, as autoridades e o povo» é claro, moderno e natural em português internacional de boa legibilidade brasileira. «Principais sacerdotes» é a formulação mais corrente para ἀρχιερεῖς neste contexto.
  terminology: «Pilatos», «autoridades» e «povo» são adequados. Para ἀρχιερεῖς, «principais sacerdotes» comunica o grupo de autoridades sacerdotais sem sugerir múltiplos sumos sacerdotes em exercício.
