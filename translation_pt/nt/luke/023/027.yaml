source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: And a large crowd of the people and of women was following him[b][a], and the women were beating their breasts and mourning for him.
translation:
  language: pt
  text: Uma grande multidão, formada por pessoas do povo e por mulheres, o seguia; essas mulheres batiam no peito e o lamentavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “batiam em si mesmas e o lamentavam”; o grego provavelmente se refere ao costume de bater no peito como expressão de luto.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠκολούθει
  choice: seguia
  rationale: O imperfeito indica uma ação em andamento no passado; o imperfeito português preserva naturalmente esse aspecto.
- source_word: δὲ
  choice: e
  rationale: Aqui a partícula dá continuidade à narrativa; “e” mantém essa ligação sem lhe atribuir contraste indevido.
- source_word: αὐτῷ
  choice: o
  rationale: Com ἀκολουθέω, o dativo identifica aquele a quem seguiam; em português, “segui-lo” é a construção idiomática.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: uma grande multidão do povo
  rationale: Mantém a ideia de uma numerosa massa de gente e conserva a relação genitiva do texto grego.
- source_word: καὶ γυναικῶν
  choice: e também mulheres
  rationale: Representa a coordenação das mulheres com o povo dentro da descrição da multidão, em formulação natural e sem obscurecer que as ações seguintes pertencem especificamente a elas.
- source_word: αἳ
  choice: que
  rationale: O pronome relativo feminino plural retoma “mulheres”, atribuindo-lhes, e não à multidão inteira, os gestos de luto.
- source_word: ἐκόπτοντο
  choice: batiam no peito
  rationale: No contexto de luto, o verbo descreve o gesto costumeiro de bater em si, especialmente no peito; a expressão comunica claramente a ação ao leitor moderno.
- source_word: ἐθρήνουν αὐτόν
  choice: lamentavam por ele
  rationale: Expressa o lamento dirigido a Jesus em português corrente, preservando o sentido de manifestação de profunda tristeza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A vírgula antes de “que” ajuda a deixar claro que o lamento é atribuído às mulheres mencionadas, de acordo com o pronome feminino plural grego.
