revisions:
- from: Uma grande multidão do povo o seguia, e também mulheres, que batiam no peito e lamentavam por ele.[a]
  to: Uma grande multidão, formada por pessoas do povo e por mulheres, o seguia; essas mulheres batiam no peito e o lamentavam.[a]
  rationale: A revisão resolve a construção elíptica e torna explícito que as ações de luto pertencem às mulheres, conforme o pronome relativo feminino plural αἳ. Também substitui “lamentavam por ele” por “o lamentavam”, que corresponde mais diretamente ao acusativo αὐτόν e permanece natural em português moderno.
  reviewer_model: gpt-5.6-terra
