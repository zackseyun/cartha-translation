lexical_decisions:
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve transição ou contraste na narrativa; “Mas” expressa naturalmente a reação de Pilatos ao que acabara de ouvir.
- source_word: ἀκούσας
  choice: ao ouvir isso
  rationale: O particípio aoristo indica uma ação anterior ou circunstancial ligada à pergunta. “Isso” explicita de modo idiomático o objeto implícito no contexto.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: Equivalente direto e natural para o verbo que significa perguntar ou indagar.
- source_word: εἰ
  choice: se
  rationale: Introduz naturalmente uma pergunta indireta em português.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: Preserva a expressão grega sem substituir explicitamente o referente por “Jesus” nem acrescentar valor demonstrativo.
- source_word: Γαλιλαῖός
  choice: galileu
  rationale: O adjetivo predicativo indica identidade ou procedência regional; “galileu” é a equivalência portuguesa direta.
- source_word: ἐστιν
  choice: era
  rationale: Embora o grego use o presente, o português emprega naturalmente o imperfeito numa pergunta indireta subordinada ao verbo passado “perguntou”.
