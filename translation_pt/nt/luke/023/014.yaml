reference: Luke 23:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: pt
  text: 'Disse-lhes: “Vocês me trouxeram este homem como alguém que desvia o povo[a]. Vejam: depois de examiná-lo diante de vocês, não encontrei neste homem nenhuma base para as acusações que fazem contra ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estava desviando o povo”. O verbo grego pode significar afastar, desviar ou levar ao erro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não encontrei neste homem culpa alguma quanto às coisas de que vocês o acusam”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Vocês me trouxeram
  rationale: Expressa de modo natural o ato concluído de levar Jesus à presença de Pilatos e preserva a referência explícita a quem o recebeu.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: este homem
  rationale: Refere-se a um indivíduo do sexo masculino e mantém a formulação direta do contexto judicial.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: como alguém que estava levando o povo ao erro
  rationale: Comunica o sentido contextual de desviar ou desencaminhar, sem intensificá-lo para a ideia mais específica de incitar uma revolta.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Representa naturalmente o coletivo designado por λαός no uso lucano.
- source_word: ἰδοὺ
  choice: E vejam
  rationale: Mantém a função do marcador discursivo, que chama a atenção dos ouvintes, em português atual e digno.
- source_word: ἐνώπιον ὑμῶν
  choice: diante de vocês
  rationale: Salienta que o exame foi realizado na presença dos acusadores.
- source_word: ἀνακρίνας
  choice: depois de examiná-lo
  rationale: Preserva tanto a relação temporal do particípio com o verbo principal quanto o sentido judicial de investigar ou interrogar.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: não encontrei neste homem fundamento algum
  rationale: Apresenta a declaração como uma conclusão judicial de que não havia base para a acusação, sem transformá-la numa afirmação moral absoluta.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: para as acusações que fazem contra ele
  rationale: Conserva o tom forense de κατηγορέω e explicita com naturalidade a relação entre o fundamento e as acusações.
theological_decisions:
- issue: Natureza da declaração de Pilatos
  choice: uma conclusão judicial de que não havia fundamento para as acusações
  alternative: uma declaração de que não havia culpa alguma no homem
  rationale: O conjunto de termos jurídicos no versículo favorece uma conclusão relativa às acusações examinadas. A tradução evita ampliar a afirmação para um veredito moral absoluto, enquanto a nota conserva a formulação possível com “culpa”.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A construção preserva o cenário judicial, a força de ἰδού e a alternativa semântica de αἴτιον por meio de notas.
