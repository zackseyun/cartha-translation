id: LUK.23.47
reference: Luke 23:47
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: pt
  text: 'Quando o centurião viu o que havia acontecido, glorificou a Deus, dizendo: “De fato, este homem era justo[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inocente”. Neste contexto, a palavra grega pode indicar tanto retidão moral quanto inocência jurídica.
    reason: alternativa lexical
lexical_decisions:
- source_word: Ἰδὼν
  choice: quando ... viu
  rationale: O particípio aoristo é entendido temporalmente e vertido de modo natural, preservando sua relação com o verbo principal.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Conectivo narrativo leve; em português, a progressão é natural sem acrescentar “então”, “ora” ou um contraste indevido.
- source_word: ἑκατοντάρχης
  choice: centurião
  rationale: Termo tradicional, preciso e amplamente compreensível para o posto militar romano.
- source_word: τὸ γενόμενον
  choice: o que havia acontecido
  rationale: Expressa de modo idiomático o acontecimento já consumado que o centurião presenciou.
- source_word: ἐδόξαζεν
  choice: glorificou
  rationale: O pretérito perfeito é natural na narrativa portuguesa; evita impor valor incoativo ao imperfeito grego, cujo aspecto não exige “começou a glorificar” neste contexto.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: Complemento direto de “glorificou”, com a preposição exigida pelo uso português diante de referente pessoal.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém naturalmente o particípio que introduz o conteúdo da fala.
- source_word: Ὄντως
  choice: De fato
  rationale: Transmite a afirmação enfática do advérbio sem soar excessivamente formal.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: este homem
  rationale: Representa com precisão a referência masculina específica a Jesus.
- source_word: δίκαιος
  choice: justo
  rationale: Preserva a força moral e teológica usual do termo, sem excluir sua possível nuance forense de inocência, registrada em nota.
- source_word: ἦν
  choice: era
  rationale: O imperfeito de εἰμί é adequadamente expresso pelo pretérito imperfeito português.
theological_decisions:
- issue: Sentido de δίκαιος na declaração do centurião
  choice: justo
  alternative: inocente
  rationale: “Justo” conserva a dimensão moral e teológica do grego, enquanto “inocente” é uma leitura contextual plausível diante da condenação injusta de Jesus. A nota mantém essa tensão sem decidir dogmaticamente entre as nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é direta e narrativa; evita conectivo inicial artificial e expansão aspectual desnecessária.
