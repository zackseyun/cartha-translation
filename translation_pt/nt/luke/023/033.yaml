  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: pt
  text: Quando chegaram ao lugar chamado Caveira[a], ali o crucificaram, bem como aos criminosos, um à direita e outro à esquerda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chamado a Caveira”. O termo grego Κρανίον significa literalmente “caveira”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “um da direita e um da esquerda”. O texto grego não explicita “dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: chegaram
  rationale: No contexto narrativo, o aoristo de ἔρχομαι com um destino expresso é traduzido naturalmente por “chegaram” em português.
- source_word: ἐπὶ τὸν τόπον
  choice: ao lugar
  rationale: Com verbo de movimento, ἐπί + acusativo indica o destino; “ao lugar” exprime essa direção de modo idiomático.
- source_word: τὸν καλούμενον Κρανίον
  choice: chamado Caveira
  rationale: Κρανίον significa literalmente “caveira”. Traduzir o substantivo preserva o sentido do nome do lugar sem importar formas tradicionais oriundas dos relatos paralelos.
- source_word: ἐσταύρωσαν
  choice: o crucificaram
  rationale: “Crucificar” é o equivalente corrente e preciso de σταυρόω; o pronome retoma Jesus sem acrescentar detalhes ausentes do verbo grego.
- source_word: κακούργους
  choice: criminosos
  rationale: κακοῦργος designa quem pratica o mal ou comete crimes. “Criminosos” é claro, atual e evita harmonizar Lucas com termos mais específicos empregados em outros contextos.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: um à direita e outro à esquerda
  rationale: A construção correlativa distribui os dois criminosos pelos dois lados. A formulação portuguesa é natural e não acrescenta o possessivo “dele”, que está apenas implícito.
theological_decisions:
- issue: Tradução de Κρανίον
  choice: Caveira
  alternative: a Caveira; Crânio
  rationale: O nome do lugar deriva de um substantivo comum cujo conteúdo semântico é relevante. “Caveira” preserva esse significado de modo natural e evita importar “Calvário” ou “Gólgota” dos paralelos e da tradição.
- issue: Descrição dos dois homens crucificados com Jesus
  choice: criminosos
  alternative: malfeitores; pessoas que praticavam o mal
  rationale: O termo de Lucas, κακοῦργοι, é mais amplo que “ladrões”, “assaltantes” ou “rebeldes”. “Criminosos” mantém essa amplitude e não harmoniza a passagem com a terminologia de outros Evangelhos.
- issue: Relação sintática entre Jesus e os criminosos
  choice: o crucificaram com os criminosos
  alternative: crucificaram a ele e aos criminosos
  rationale: A preposição “com” produz português natural e conserva a ideia de que Jesus e os dois criminosos foram crucificados ali, sem sugerir identidade moral entre eles.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Caveira” é usado como nome próprio traduzido; “criminosos” evita linguagem arcaica e harmonização com os relatos paralelos.
