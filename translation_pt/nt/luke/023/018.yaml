  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: pt
  text: 'Mas todos gritaram juntos, dizendo: “Leve este homem embora[a] e liberte Barrabás para nós!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fora com este homem!” O imperativo grego pode ser traduzido de modo mais breve, mas o sentido é que exigiam que ele fosse removido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: gritaram
  rationale: O verbo indica um clamor em voz alta; “gritaram” transmite de modo natural e direto a intensidade da reação coletiva.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca aqui o contraste com a fala anterior de Pilatos.
- source_word: παμπληθεὶ
  choice: todos ... juntos
  rationale: A expressão comunica que o grupo inteiro participou do clamor coletivo, sem acrescentar a ideia mais interpretativa de perfeita unanimidade.
- source_word: λέγοντες
  choice: introdução direta da fala após dois-pontos
  rationale: Em português, a citação depois de “gritaram” já expressa naturalmente o sentido do particípio “dizendo”, evitando uma formulação redundante.
- source_word: Αἶρε τοῦτον
  choice: Tire este homem daqui
  rationale: O imperativo exige a remoção de Jesus. “Este homem” preserva a força demonstrativa de τοῦτον, e “daqui” torna explícito em português o sentido contextual de afastá-lo.
- source_word: ἀπόλυσον
  choice: solte
  rationale: No contexto de alguém sob custódia, “solte” é uma forma corrente e clara de expressar a ordem de libertar.
- source_word: ἡμῖν
  choice: para nós
  rationale: A expressão preserva o dativo de interesse ou benefício, indicando que a libertação solicitada seria em favor do grupo.
- source_word: τὸν Βαραββᾶν
  choice: Barrabás
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A fala direta conserva a urgência e a hostilidade do clamor sem explicitar além do texto o destino pretendido para Jesus.
