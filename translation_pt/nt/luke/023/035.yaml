source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: pt
  text: 'E o povo estava de pé, observando. Os líderes também zombavam dele, dizendo: “Salvou os outros; salve a si mesmo, se este é o Messias de Deus, o Escolhido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: permanecia ali
  rationale: A forma verbal tem sentido estativo e serve para compor a cena. “Permanecia ali” expressa de modo natural a continuidade, sem sugerir uma nova ação de pôr-se em pé.
- source_word: θεωρῶν
  choice: observando
  rationale: O particípio indica atenção visual contínua. “Observando” é claro e mantém o aspecto durativo.
- source_word: ἐξεμυκτήριζον
  choice: zombavam dele
  rationale: O verbo comunica zombaria desdenhosa ou escárnio. O pronome “dele” é recuperado naturalmente do contexto.
- source_word: ἄρχοντες
  choice: os líderes
  rationale: No contexto, refere-se às autoridades dirigentes, especialmente à liderança judaica. “Líderes” é atual e inteligível sem especificar além do texto.
- source_word: Ἄλλους ἔσωσεν
  choice: Salvou os outros
  rationale: “Salvar” preserva o amplo campo semântico de σῴζω e a repetição retórica com a ordem seguinte.
- source_word: σωσάτω ἑαυτόν
  choice: salve a si mesmo
  rationale: O imperativo de terceira pessoa é reproduzido de modo direto, preservando a repetição de “salvar” e a ironia da provocação.
- source_word: εἰ οὗτός ἐστιν
  choice: se este é
  rationale: “Este” conserva a força demonstrativa de οὗτός e seu possível tom depreciativo, em vez de reduzi-lo ao simples pronome “ele”.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: o Messias de Deus
  rationale: Χριστός funciona como título e é traduzido por “Messias”. A construção “de Deus” preserva de perto o genitivo grego e é natural em português.
- source_word: ὁ ἐκλεκτός
  choice: o Escolhido
  rationale: A expressão funciona como título. “O Escolhido” é clara, solene e acessível, sem acrescentar uma interpretação sobre a natureza dessa escolha.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός é um título explícito, ligado a “de Deus” e “o Escolhido”. “Messias” comunica seu sentido titular com clareza.
- issue: Força titular de ὁ ἐκλεκτός
  choice: o Escolhido
  alternative: o Eleito
  rationale: “O Escolhido” preserva o peso cristológico e soa natural ao leitor moderno; “o Eleito” poderia evocar formulações doutrinárias posteriores não exigidas pelo contexto.
- issue: Relação entre os títulos finais
  choice: o Messias de Deus, o Escolhido
  alternative: o Cristo de Deus, o Eleito
  rationale: A aposição é mantida sem explicar se os títulos são equivalentes ou como se relacionam, preservando a tensão e a formulação do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do original foram preservadas sempre que naturais; não se acrescentou identificação denominacional aos líderes nem explicação teológica aos títulos.
