id: LUK.23.48
reference: Luke 23:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: pt
  text: E todas as multidões que haviam se reunido para assistir àquela cena, ao verem o que tinha acontecido, voltavam batendo no peito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bater no peito era um gesto de pesar, lamento ou choque.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: haviam se reunido
  rationale: Expressa de modo natural a ação anterior de pessoas que vieram e se juntaram no local, sem sobrecarregar o prefixo σύν-.
- source_word: ὄχλοι
  choice: multidões
  rationale: Mantém o plural grego e designa os diversos grupos presentes.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: para assistir àquela cena
  rationale: Comunica tanto a finalidade da presença quanto a ideia de algo publicamente contemplado; em português, evita o possível tom de entretenimento de “espetáculo”.
- source_word: θεωρήσαντες
  choice: ao verem
  rationale: Representa com naturalidade a ação circunstancial anterior ou coincidente em estreita sequência com o retorno.
- source_word: τὰ γενόμενα
  choice: o que tinha acontecido
  rationale: Tradução idiomática do particípio substantivado, preservando a referência ampla aos acontecimentos.
- source_word: τύπτοντες τὰ στήθη
  choice: batendo no peito
  rationale: Expressão portuguesa corrente para o gesto físico de pesar, lamento ou choque, sem definir por si só a disposição interior.
- source_word: ὑπέστρεφον
  choice: voltavam
  rationale: 'O pretérito imperfeito preserva o aspecto contínuo ou distributivo do imperfeito grego: as pessoas iam voltando.'
theological_decisions:
- issue: Força emocional da reação das multidões
  choice: Manter apenas o gesto físico, “batendo no peito”
  alternative: Explicitar que se arrependeram ou que sentiram culpa, pesar ou horror
  rationale: O grego descreve a ação, mas não determina explicitamente o estado espiritual ou emocional interior; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Cena” traduz θεωρία no contexto sem sugerir diversão; a construção “para assistir” explicita de modo idiomático a finalidade indicada por ἐπί com acusativo. O marcador [a] aparece no texto junto ao gesto que a nota explica.
