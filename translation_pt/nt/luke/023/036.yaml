  text: ⸀ἐνέπαιξαν δὲ αὐτῷ καὶ οἱ στρατιῶται προσερχόμενοι, ⸀ὄξος προσφέροντες αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: pt
  text: Os soldados também zombaram dele, aproximando-se e oferecendo-lhe vinho azedo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vinagre». O grego ὄξος refere-se a vinho azedo, uma bebida ácida comum e barata; «vinagre» é uma tradução tradicional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: zombavam
  rationale: O verbo ἐμπαίζω expressa zombaria hostil. O imperfeito em português apresenta a ação em curso na cena e combina naturalmente com os particípios seguintes.
- source_word: δὲ ... καὶ
  choice: também
  rationale: A combinação dá continuidade à narrativa e acrescenta os soldados aos que já zombavam de Jesus.
- source_word: αὐτῷ
  choice: dele / lhe
  rationale: As duas ocorrências referem-se a Jesus; a regência idiomática portuguesa pede “zombavam dele” e “oferecendo-lhe”.
- source_word: οἱ στρατιῶται
  choice: os soldados
  rationale: Equivalente direto, claro e apropriado ao contexto da execução romana.
- source_word: προσερχόμενοι
  choice: aproximando-se
  rationale: Preserva o valor circunstancial do particípio e descreve naturalmente o movimento dos soldados em direção a Jesus.
- source_word: ὄξος
  choice: vinho azedo
  rationale: ὄξος designa vinho avinagrado ou azedo, uma bebida barata e ácida; “vinho azedo” evita a ideia moderna de vinagre usado apenas como condimento.
- source_word: προσφέροντες
  choice: oferecendo-lhe
  rationale: Expressa diretamente a ação de apresentar a bebida a Jesus, sem acrescentar uma motivação não declarada.
theological_decisions:
- issue: Natureza da oferta de ὄξος pelos soldados
  choice: A ação é relatada dentro da cena de zombaria, sem definir além disso a intenção dos soldados.
  alternative: Interpretá-la explicitamente como gesto de misericórdia ou exclusivamente como provocação.
  rationale: O contexto associa os soldados à zombaria, mas o versículo não explica em termos psicológicos a motivação específica da oferta. A tradução mantém essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, mantendo as relações participiais e a continuidade narrativa do grego.
