  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: pt
  text: E Pilatos decidiu que a exigência deles fosse atendida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais formal: “Pilatos deu sentença para que o pedido deles fosse cumprido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção narrativa simples, que liga a decisão de Pilatos à cena anterior sem acrescentar uma nuance temporal ou causal não expressa.
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐπέκρινεν
  choice: decidiu
  rationale: O verbo indica uma decisão ou pronunciamento judicial. “Decidiu” é natural no português atual e preserva o sentido jurídico sem sugerir especificamente a imposição de uma pena.
- source_word: γενέσθαι
  choice: fosse atendida
  rationale: Como infinitivo complementar, expressa que aquilo que foi pedido deveria realizar-se. Em conjunto com αἴτημα, “fosse atendida” comunica de modo idiomático a autorização do pedido.
- source_word: τὸ αἴτημα
  choice: a exigência
  rationale: O substantivo pode significar pedido, solicitação ou exigência. O contexto de forte pressão sobre Pilatos favorece “exigência”, sem ultrapassar a faixa semântica do termo.
- source_word: αὐτῶν
  choice: deles
  rationale: Genitivo plural possessivo, referente aos que pressionavam Pilatos para que aceitasse o que pediam.
theological_decisions:
- issue: Nuance judicial da ação de Pilatos
  choice: Pilatos decidiu que a exigência deles fosse atendida
  alternative: Pilatos deu sentença para que o pedido deles fosse cumprido
  rationale: A formulação principal conserva a decisão judicial formal, mas usa português corrente. A alternativa explicita mais o registro jurídico, embora seja menos natural e possa soar como uma sentença penal específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão narrativa do grego e registra em nota a alternativa mais formal para ἐπέκρινεν e para a relação entre γενέσθαι e αἴτημα.
