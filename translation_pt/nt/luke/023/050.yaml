source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: pt
  text: E eis que havia um homem chamado José, membro do conselho, homem bom e justo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador discursivo e o chamado de atenção de Lucas, com formulação bíblica ainda clara em português moderno.
- source_word: ἀνὴρ
  choice: um homem
  rationale: Designa aqui um indivíduo adulto do sexo masculino; a tradução mantém essa referência explícita.
- source_word: ὀνόματι Ἰωσὴφ
  choice: chamado José
  rationale: Expressão idiomática em português para a construção dativa grega, preservando a fórmula de apresentação.
- source_word: βουλευτὴς ὑπάρχων
  choice: membro do conselho
  rationale: βουλευτής indica um integrante de um conselho governante; a formulação é clara e não especifica além do que este versículo declara.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: homem bom e justo
  rationale: Mantém a repetição de ἀνήρ, que caracteriza José com ênfase. 'Bom e justo' comunica de modo natural tanto sua bondade quanto sua retidão.
theological_decisions:
- issue: Tradução de δίκαιος na descrição de José
  choice: justo
  alternative: reto
  rationale: δίκαιος pode indicar retidão ética e também justiça. 'Justo' preserva essa amplitude em português e possui ressonância bíblica sem transformar a descrição em uma afirmação doutrinária técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve solenidade narrativa em 'E eis que'. O travessão final foi mantido porque a frase continua no versículo seguinte.
