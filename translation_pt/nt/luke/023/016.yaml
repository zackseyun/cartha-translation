id: LUK.23.16
reference: Luke 23:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: pt
  text: Portanto, depois de castigá-lo[a], vou soltá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de puni-lo” ou “depois de discipliná-lo”; o verbo pode indicar um castigo corretivo. Alguns entendem aqui, mais especificamente, “depois de açoitá-lo”, embora o verbo grego seja mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: depois de castigá-lo
  rationale: O particípio aoristo tem valor temporal neste contexto. No cenário judicial, παιδεύω indica punição ou castigo, não instrução; “castigar” conserva esse sentido sem especificar indevidamente o método.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a força inferencial ou conclusiva da partícula na fala de Pilatos.
- source_word: αὐτόν
  choice: -lo
  rationale: Pronome acusativo que retoma Jesus, expresso naturalmente como objeto enclítico em português.
- source_word: ἀπολύσω
  choice: vou soltá-lo
  rationale: No contexto de custódia judicial, ἀπολύω significa libertar ou soltar. “Vou soltá-lo” é corrente, claro e natural na fala direta.
theological_decisions:
- issue: Alcance de παιδεύω na proposta de Pilatos
  choice: castigá-lo
  alternative: discipliná-lo; açoitá-lo
  rationale: O contexto exige sentido penal, mas o verbo grego não identifica por si só uma forma específica de castigo. A tradução evita tanto o sentido pedagógico inadequado de “disciplinar” quanto a especificação excessiva de “açoitar”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção verbal “vou soltá-lo” preserva a intenção futura de Pilatos em linguagem natural.
