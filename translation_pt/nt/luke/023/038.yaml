  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: pt
  text: 'Havia também sobre ele uma inscrição: “Este é o Rei dos judeus”.[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “placa”, “aviso” ou “acusação escrita”.
    reason: lexical_alternative
  - marker: b
    text: Ou “acima dele”.
    reason: lexical_alternative
  - marker: c
    text: 'O grego diz literalmente: “O Rei dos judeus, este”.'
    reason: lexical_alternative
  - marker: d
    text: Em alguns contextos, “judeus” pode ser traduzido como “judeanos”; neste título da crucificação, porém, “judeus” é a tradução tradicional e adequada ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: inscrição
  rationale: Designa um texto afixado junto ao crucificado. “Inscrição” conserva o sentido formal sem especificá-lo demais como acusação legal.
- source_word: ἐπ’ αὐτῷ
  choice: sobre ele
  rationale: No contexto, indica a posição da inscrição em relação a Jesus; “sobre ele” é natural e mantém a possível nuance de estar acima dele.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Este é o Rei dos judeus
  rationale: A frase grega não contém verbo expresso e termina com o demonstrativo οὗτος. O português requer naturalmente “é”, e a formulação mantém a força demonstrativa.
- source_word: Ἰουδαίων
  choice: judeus
  rationale: Embora possa significar “judeanos” em certos contextos, no título tradicional e político da crucificação “Rei dos judeus” é a tradução contextualmente adequada.
- source_word: δὲ καὶ
  choice: também
  rationale: Acrescenta um novo detalhe à narrativa. A construção portuguesa “Havia também” comunica com fluidez sua força aditiva.
theological_decisions:
- issue: Natureza da inscrição da crucificação
  choice: 'Apresentar diretamente a inscrição como identificação de Jesus: “Este é o Rei dos judeus”.'
  alternative: Traduzir explicitamente como acusação formal ou acrescentar seu caráter irônico ou político.
  rationale: O versículo apenas informa a existência e o teor da inscrição; explicitar acusação, ironia ou confissão messiânica importaria uma interpretação não expressa no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, sem eliminar a ênfase demonstrativa do original.
