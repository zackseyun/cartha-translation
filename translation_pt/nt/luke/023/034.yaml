  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: pt
  text: 'Mas Jesus dizia[a]: “Pai, perdoa-lhes, pois não sabem o que estão fazendo.” E, repartindo as roupas dele, lançaram sortes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem: “Pai, perdoa-lhes, pois não sabem o que estão fazendo.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego sugere fala em curso ou repetida; “dizia” preserva esse aspecto melhor que o pontual “disse”.
- source_word: Πάτερ
  choice: Pai
  rationale: Vocativo direto e natural em português, sem acrescentar o possessivo ausente no grego.
- source_word: ἄφες
  choice: perdoa
  rationale: Em uma oração dirigida a Deus em favor de ofensores, “perdoa” expressa naturalmente o sentido contextual de ἀφίημι.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Mantém a referência pronominal sem especificar quem são os beneficiários do perdão, como no grego.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: pois não sabem o que estão fazendo
  rationale: Traduz diretamente a ideia de conhecimento e preserva o aspecto presente da ação.
- source_word: διαμεριζόμενοι
  choice: repartiram
  rationale: Expressa de modo natural a divisão das peças de roupa entre os envolvidos; a construção finita evita um gerúndio pouco elegante em português.
- source_word: ἱμάτια
  choice: roupas
  rationale: Termo atual, claro e digno para artigos de vestuário, sem a tonalidade arcaizante de “vestes”.
- source_word: ἔβαλον κλήρους
  choice: lançaram sortes
  rationale: Expressão tradicional e inteligível para o procedimento antigo de decidir a distribuição por sortes.
- source_word: δὲ
  choice: Mas / Então
  rationale: O primeiro δέ marca uma transição com leve contraste; o segundo prossegue a narrativa. A variação contextual produz português natural sem sobrecarregar os conectivos.
theological_decisions:
- issue: Autenticidade da declaração “Pai, perdoa-lhes, pois não sabem o que estão fazendo”
  choice: Incluída no texto principal
  alternative: Alguns manuscritos omitem toda a declaração.
  rationale: A SBLGNT imprime a declaração no texto, assinalando incerteza textual. A tradução acompanha o texto fornecido e registra a variante significativa em nota, sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; “dizia” preserva o aspecto imperfectivo, e “roupas” evita arcaísmo desnecessário.
