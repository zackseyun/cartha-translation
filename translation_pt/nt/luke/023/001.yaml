  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: pt
  text: Então, toda a assembleia se levantou e levou Jesus a Pilatos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «toda a multidão».'
    reason: Alternativa lexical para πλῆθος, que pode designar tanto um conjunto reunido quanto uma multidão.
lexical_decisions:
- source_word: Καὶ
  choice: Então
  rationale: O conectivo introduz o acontecimento seguinte na sequência narrativa; «Então» expressa essa progressão de modo natural em português, sem acrescentar uma relação causal.
- source_word: ἀναστὰν
  choice: se levantou
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal. A coordenação em português mantém a sequência das ações com clareza e naturalidade.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: toda a assembleia
  rationale: πλῆθος designa o conjunto reunido; neste contexto judicial, «assembleia» evita a ideia de uma multidão casual sem especificar uma instituição além do que o grego permite. ἅπαν é preservado por «toda»; o genitivo αὐτῶν fica implícito no contexto, pois «toda a assembleia deles» seria pouco natural e potencialmente ambíguo em português.
- source_word: ἤγαγον
  choice: levou
  rationale: O aoristo de ἄγω pode significar conduzir ou levar. «Levou» é corrente e comunica que o grupo escoltou Jesus ao destino indicado.
- source_word: αὐτὸν
  choice: Jesus
  rationale: Embora o grego use o pronome «o», a explicitação do referente evita a sequência pouco clara «levou-o» após um sujeito coletivo e torna o texto mais acessível sem alterar o referente.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: a Pilatos
  rationale: ἐπί com acusativo após verbo de movimento indica deslocamento em direção a uma pessoa. «A Pilatos» preserva diretamente esse sentido; «diante de Pilatos» explicitaria uma implicação contextual.
- source_word: Πιλᾶτον
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Designação do sujeito coletivo no contexto judicial
  choice: toda a assembleia
  alternative: toda a multidão
  rationale: «Assembleia» representa o corpo reunido que acabara de deliberar, sem sugerir uma aglomeração casual nem identificar de modo mais específico uma instituição. A alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem das ações é natural em português, e a nota preserva a amplitude lexical do substantivo grego.
