id: LUK.23.51
reference: Luke 23:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: pt
  text: Este homem não havia concordado com a decisão e a ação deles[a]. Ele era de Arimateia, uma cidade dos judeus, e esperava o Reino de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia consentido na decisão e no ato deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Este homem
  rationale: Retoma José, mencionado no versículo anterior, e preserva a ênfase do demonstrativo grego de modo natural em português.
- source_word: οὐκ ἦν συγκατατεθειμένος
  choice: não havia concordado
  rationale: A construção perifrástica com particípio perfeito indica uma posição anterior e estabelecida de não concordância. A formulação é clara e atual, sem pressupor um procedimento formal de votação.
- source_word: βουλῇ
  choice: decisão
  rationale: No contexto, refere-se ao resultado deliberado ou propósito dos líderes, não ao conselho como instituição. “Decisão” evita essa possível confusão e combina naturalmente com “ação”.
- source_word: πράξει
  choice: ação
  rationale: Designa aquilo que eles fizeram e mantém a distinção entre a decisão tomada e sua execução.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: de Arimateia, uma cidade dos judeus
  rationale: Segue de perto a aposição grega sem transformar “dos judeus” em uma especificação geográfica ou étnica mais estreita do que o texto exige.
- source_word: προσεδέχετο
  choice: esperava
  rationale: O imperfeito expressa uma atitude contínua de expectativa. “Esperava” é natural em português e admite o sentido de espera confiante sem acrescentá-lo explicitamente.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão consagrada, clara e coerente com o uso recorrente em Lucas, preservando a amplitude de βασιλεία entre reino e governo régio.
theological_decisions:
- issue: Natureza do afastamento de José da atuação do Sinédrio na morte de Jesus
  choice: Dizer que ele não havia concordado com a decisão e a ação deles
  alternative: Dizer que ele não votou a favor da decisão ou que não participou da condenação
  rationale: O grego afirma sua não concordância com a βουλή e a πρᾶξις, mas não especifica mecanismo de votação nem detalha a extensão de sua ausência ou participação. A tradução conserva essa limitação.
- issue: Sentido de “Reino de Deus”
  choice: Manter “Reino de Deus”
  alternative: Traduzir como “governo de Deus” ou “reinado de Deus”
  rationale: “Reino de Deus” preserva a formulação lucana tradicional e sua amplitude sem decidir exclusivamente entre domínio régio e esfera do reino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A longa estrutura grega foi dividida em duas frases para maior clareza. O marcador da nota foi colocado junto à expressão que ela efetivamente esclarece.
