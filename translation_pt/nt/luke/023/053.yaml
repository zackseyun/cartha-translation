  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: pt
  text: Depois de tirá-lo, envolveu-o num pano de linho e o colocou num túmulo escavado na rocha, onde ninguém ainda havia sido sepultado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθελὼν
  choice: Depois de tirá-lo da cruz
  rationale: O particípio aoristo de καθαιρέω indica uma ação anterior aos verbos principais. Embora “da cruz” esteja implícito pelo contexto, explicitá-lo torna a ação imediatamente clara em português sem acrescentar conteúdo estranho à cena.
- source_word: ἐνετύλιξεν
  choice: envolveu-o
  rationale: Expressa naturalmente a ação de envolver o corpo com tecido, preservando a sobriedade do grego.
- source_word: σινδόνι
  choice: num pano de linho
  rationale: σινδών designa um tecido de linho, aqui usado no sepultamento. “Pano de linho” é claro e menos interpretativo que “mortalha”.
- source_word: ἔθηκεν
  choice: o colocou
  rationale: τίθημι significa pôr ou colocar; a escolha é corrente e digna no contexto funerário.
- source_word: μνήματι
  choice: num túmulo
  rationale: μνῆμα refere-se a um lugar de sepultamento; “túmulo” corresponde bem ao contexto do primeiro século.
- source_word: λαξευτῷ
  choice: escavado na rocha
  rationale: λαξευτός descreve algo talhado ou escavado em pedra. A formulação é natural em português e comunica o tipo de túmulo.
- source_word: οὗ
  choice: onde
  rationale: O advérbio relativo retoma o túmulo; “onde” é a equivalência mais natural em português.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: onde ninguém ainda havia sido sepultado
  rationale: A construção afirma que nenhuma pessoa fora anteriormente posta ou estivera deitada ali. No contexto funerário, “havia sido sepultado” comunica com clareza que o túmulo ainda não tinha sido usado.
theological_decisions:
- issue: Descrição do sepultamento e do tipo de túmulo
  choice: José colocou Jesus num túmulo escavado na rocha que ainda não havia sido usado para sepultar ninguém.
  alternative: José colocou Jesus num túmulo talhado em pedra onde ninguém jamais havia jazido.
  rationale: O versículo é descritivo. A tradução conserva os dados históricos apresentados, sem importar detalhes dos relatos paralelos nem acrescentar conclusões teológicas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência narrativa foi explicitada naturalmente por “Depois de”. Não foram usadas notas porque as alternativas lexicais não afetam substancialmente o sentido e podem ser representadas com precisão no texto principal.
