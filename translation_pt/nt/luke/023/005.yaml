id: LUK.23.5
reference: Luke 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: pt
  text: 'Mas eles insistiam com veemência, dizendo: “Ele agita[a] o povo, ensinando por toda a Judeia[b], desde a Galileia até aqui[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incita”. O verbo grego pode indicar que alguém levanta ou agita pessoas em sentido perturbador.
    reason: lexical_alternative
  - marker: b
    text: “Judeia” pode designar especificamente a região da Judeia ou, em certos contextos, um território judaico mais amplo. Aqui, a expressão ressalta a grande extensão da atividade alegada.
    reason: cultural_note
  - marker: c
    text: Ou “até este lugar”. A expressão indica a extensão desde a Galileia até o local em que Jesus estava diante de Pilatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: insistiam com veemência
  rationale: O imperfeito expressa uma pressão contínua ou reiterada. A formulação comunica tanto o aspecto durativo quanto a força crescente da acusação.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio introduz diretamente o conteúdo da insistência e pode ser preservado de modo natural em português.
- source_word: Ἀνασείει
  choice: agita
  rationale: O verbo descreve o ato de levantar ou instigar pessoas em sentido perturbador. “Agita” conserva a acusação hostil sem especificar tecnicamente o crime de sedição.
- source_word: τὸν λαὸν
  choice: o povo
  rationale: λαός designa aqui a população em sentido amplo, não apenas uma multidão reunida.
- source_word: διδάσκων
  choice: ensinando
  rationale: O particípio presente associa o ensino à alegada agitação, sem definir além do grego se o ensino é o meio preciso ou uma atividade concomitante.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: por toda a Judeia
  rationale: κατά com o genitivo tem sentido espacial e distributivo, salientando a extensão geográfica da atividade alegada.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε
  choice: desde a Galileia até aqui
  rationale: A expressão portuguesa apresenta com clareza o ponto inicial e a extensão até o lugar em que Jesus estava diante de Pilatos, preservando a força dêitica de ὧδε.
theological_decisions:
- issue: Natureza da acusação contra Jesus
  choice: “Ele agita o povo”
  alternative: “Ele incita o povo”
  rationale: A acusação sugere perturbação social, mas ἀνασείει não exige por si só a especificação de uma insurreição ou de um crime político tecnicamente definido.
- issue: Relação do ensino com a alegada agitação
  choice: Manter “ensinando” como particípio associado à acusação
  alternative: Explicitar “agita o povo por meio de seus ensinamentos”
  rationale: A construção grega associa as ações, mas não obriga a tradução a resolver de maneira rígida se o ensino é meio, modo ou circunstância concomitante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Com veemência” evita uma formulação excessivamente coloquial, enquanto “agita o povo” preserva a imagem e a indeterminação jurídica do original. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
