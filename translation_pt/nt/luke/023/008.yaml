  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: pt
  text: Quando Herodes viu Jesus, alegrou-se muito, pois já fazia muito tempo que queria vê-lo, porque vinha ouvindo falar dele[a], e esperava ver algum sinal realizado por ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque tinha ouvido falar dele”. O infinitivo presente grego pode sugerir relatos repetidos ou contínuos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “algum milagre”. O grego diz “algum sinal” (σημεῖον), termo que pode designar um ato milagroso visto como sinal significativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν
  choice: Quando Herodes viu Jesus
  rationale: O particípio aoristo ἰδών é naturalmente entendido como temporal. A relação narrativa de δέ é transmitida pela fluidez da frase, sem acrescentar um advérbio temporal sem correspondente explícito.
- source_word: ἐχάρη λίαν
  choice: alegrou-se muito
  rationale: Preserva o sentido verbal de χαίρω e a intensidade de λίαν em português natural e digno.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: havia muito tempo queria vê-lo
  rationale: Expressa a duração prolongada sem especificar anos, algo que o grego não exige, e mantém o desejo contínuo indicado pela construção perifrástica.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: porque vinha ouvindo falar dele
  rationale: A construção com διά indica causa, e o infinitivo presente pode sugerir notícias repetidas ou contínuas. A formulação é idiomática e preserva esse aspecto.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: esperava ver algum sinal
  rationale: Mantém a nuance de esperança ou expectativa de ἐλπίζω e traduz σημεῖον por 'sinal', sem reduzi-lo automaticamente a 'milagre'.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: realizado por ele
  rationale: Expressa com naturalidade a ação e a agência marcadas pelo particípio γινόμενον e por ὑπό.
theological_decisions:
- issue: Sentido de σημεῖον
  choice: sinal
  alternative: milagre
  rationale: '''Sinal'' preserva a amplitude do termo grego e sua possível função significativa ou comprobatória, embora neste contexto provavelmente se trate de um ato milagroso.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe evita arcaísmos, preserva a progressão narrativa e mantém a distinção lexical entre 'sinal' e 'milagre'.
