  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: pt
  text: Mas todos os que o conheciam[a], e as mulheres que o haviam acompanhado desde a Galileia, estavam à distância, observando essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus conhecidos”. O termo grego γνωστοί pode designar as pessoas conhecidas de alguém, isto é, conhecidos ou pessoas de seu convívio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: estavam
  rationale: O mais-que-perfeito grego, no contexto, apresenta um estado contínuo; com o predicativo locativo, “estavam a distância” exprime naturalmente a postura mantida na cena.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação à cena anterior.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: todos os que o conheciam
  rationale: γνωστοί pode designar conhecidos ou pessoas ligadas a alguém; esta formulação é clara e evita restringir o grupo a amigos íntimos.
- source_word: μακρόθεν
  choice: a distância
  rationale: Expressa de modo natural a separação espacial, sem determinar uma distância exata.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: as mulheres que o haviam acompanhado
  rationale: O artigo identifica um grupo definido, e o particípio com συν- sugere que elas o acompanhavam; o mais-que-perfeito situa esse acompanhamento antes da cena presente.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: desde a Galileia
  rationale: No contexto de acompanhamento, ἀπό indica o ponto de partida, bem expresso por “desde”.
- source_word: ὁρῶσαι ταῦτα
  choice: observando essas coisas
  rationale: O particípio presente retrata uma observação contínua, e “essas coisas” preserva o plural de ταῦτα.
