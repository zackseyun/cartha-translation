id: LUK.23.39
reference: Luke 23:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: pt
  text: 'Um dos criminosos que estavam pendurados ali o insultava, dizendo: “Você não é o Messias[a]? Salve a si mesmo e a nós!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. Grego: ho christos.'
    reason: Registra a tradução tradicional alternativa do título grego.
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Um
  rationale: δέ marca aqui uma leve progressão ou contraposição narrativa; em português, o fluxo é natural sem explicitar uma conjunção.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: dos criminosos que estavam pendurados ali
  rationale: “Criminosos” traduz naturalmente κακούργων, enquanto “estavam pendurados” preserva a imagem de κρεμασθέντων sem substituir o verbo grego por um termo mais específico.
- source_word: ἐβλασφήμει
  choice: o insultava
  rationale: Neste contexto, o verbo indica fala ofensiva dirigida a Jesus. O imperfeito é expresso por “insultava”, sugerindo ação continuada.
- source_word: λέγων
  choice: dizendo
  rationale: Forma natural de introduzir em português as palavras pronunciadas.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: Você não é o Messias?
  rationale: A pergunta conserva a expectativa afirmativa e o tom de provocação de οὐχί; “Messias” apresenta Χριστός como título.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Salve a si mesmo e a nós!
  rationale: Mantém o imperativo e os dois objetos coordenados, além da ligação lexical com a linguagem mais ampla de salvação.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Neste escárnio, Χριστός funciona como título messiânico. “Messias” comunica seu sentido e contexto judaico, enquanto “Cristo” é uma alternativa tradicional legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a provocação direta e natural; “a si mesmo” evita a forma regional “a você mesmo” e mantém registro adequado. O ponto de exclamação no imperativo comunica a força da ordem sem eliminar a ironia da pergunta anterior.
