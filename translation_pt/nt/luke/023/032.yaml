  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: pt
  text: Também eram conduzidos com ele outros dois, que eram criminosos[a], para serem mortos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “malfeitores” ou “criminosos condenados”. O termo grego designa pessoas que praticaram atos maus ou delitos.
    reason: lexical_alternative
  - marker: b
    text: Ou “para serem executados”. O grego diz que seriam mortos, ou postos à morte, e não especifica aqui o método, embora o contexto mostre que foi a crucificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: eram conduzidos
  rationale: O imperfeito passivo apresenta a ação em andamento no passado; “eram conduzidos” preserva esse aspecto e mantém Jesus como referência do acompanhamento.
- source_word: δὲ καὶ
  choice: Também
  rationale: A combinação faz a narrativa avançar e acrescenta os dois homens à cena. Em português, “também” comunica naturalmente essa inclusão sem impor um contraste forte.
- source_word: ἕτεροι ... δύο
  choice: outros dois
  rationale: Identifica dois indivíduos além de Jesus. A formulação é corrente e evita sugerir, como poderia fazer “dois outros criminosos”, que Jesus pertencesse à mesma categoria.
- source_word: κακοῦργοι
  choice: que eram criminosos
  rationale: O substantivo designa pessoas culpadas de delitos graves e aqui condenadas criminalmente. A oração explicativa deixa claro que o termo caracteriza os dois homens, não Jesus.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: A preposição σύν com o dativo expressa acompanhamento; “com ele” é a equivalência direta e natural.
- source_word: ἀναιρεθῆναι
  choice: para serem mortos
  rationale: O infinitivo aoristo passivo refere-se a tirar a vida, neste contexto por condenação oficial. A formulação preserva a voz passiva e não especifica um método que o verbo em si não contém.
theological_decisions:
- issue: Se ἀναιρεθῆναι deve ser traduzido especificamente como crucificação
  choice: para serem mortos
  alternative: para serem executados; para serem crucificados
  rationale: O contexto posterior mostra que a morte seria por crucificação, mas este verbo significa de modo mais amplo matar ou levar à morte. A tradução conserva o alcance lexical do texto sem antecipar uma especificação contextual.
- issue: Evitar que a construção identifique Jesus como criminoso
  choice: outros dois, que eram criminosos
  alternative: dois outros criminosos
  rationale: A construção grega caracteriza os dois outros homens como criminosos, mas não classifica Jesus dessa maneira. A oração explicativa preserva essa relação sem resolver qualquer questão teológica além da sintaxe.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada à sintaxe natural do português, preservando o aspecto durativo do imperfeito, a distinção entre Jesus e os dois criminosos e a generalidade lexical do verbo referente à morte.
