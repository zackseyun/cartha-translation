  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: pt
  text: Ele tinha a obrigação[a] de soltar-lhes um preso durante a festa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo inteiro não aparece em vários dos manuscritos gregos mais antigos, entre eles o Papiro 75, do século III, e o Vaticano, do século IV, nem em antigas traduções coptas. Está presente em outros manuscritos antigos importantes, como o Sinaítico, do século IV, na tradição latina e na maioria dos manuscritos bizantinos posteriores. É provável que copistas o tenham acrescentado para harmonizar o relato de Lucas com o costume de soltar um preso mencionado em Mateus 27:15 e Marcos 15:6. Alguns manuscritos colocam esta frase depois do versículo 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην ... εἶχεν
  choice: tinha a obrigação
  rationale: A expressão idiomática indica estar sob necessidade ou obrigação; esta formulação comunica de modo natural a exigência decorrente do costume.
- source_word: ἀπολύειν
  choice: soltar
  rationale: No contexto penal, refere-se a libertar alguém mantido sob custódia.
- source_word: αὐτοῖς
  choice: -lhes
  rationale: 'Preserva o objeto indireto: a soltura era concedida ao povo.'
- source_word: κατὰ ἑορτήν
  choice: durante a festa
  rationale: Expressa o costume observado por ocasião da festa; no contexto, trata-se da Páscoa, sem tornar explícito no texto o que o grego deixa implícito.
- source_word: ἕνα
  choice: um preso
  rationale: O grego diz literalmente 'um'; 'preso' é uma explicitação contextual mínima que torna natural em português quem seria solto.
