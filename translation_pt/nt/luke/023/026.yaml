  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: pt
  text: Ao levarem Jesus dali, agarraram um certo Simão de Cirene, que vinha da zona rural[a]. Puseram sobre ele a cruz[b], para que a carregasse atrás de Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de um campo». O grego pode referir-se a um campo específico ou, de modo mais geral, à zona rural fora da cidade.
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem aqui «a cruz» mais especificamente como «a trave transversal», mas o texto grego diz simplesmente «a cruz».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον αὐτόν
  choice: levavam Jesus dali
  rationale: ἀπάγω indica conduzir alguém para longe. A forma «levavam ... dali» expressa com naturalidade o deslocamento sob custódia; o nome «Jesus» torna claro o referente do pronome sem acrescentar nova informação.
- source_word: ἐπιλαβόμενοι
  choice: agarraram
  rationale: O particípio de ἐπιλαμβάνομαι indica que tomaram Simão fisicamente. «Agarraram» comunica a ação coerciva sem soar excessivamente técnica.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: um homem chamado Simão, de Cirene
  rationale: τινα apresenta uma pessoa até então não identificada, e Κυρηναῖον associa Simão à cidade de Cirene. A formulação escolhida é corrente em português e preserva ambas as informações.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: que vinha da zona rural
  rationale: ἀγρός pode designar um campo específico ou, de modo mais amplo, a região campestre fora da cidade. «Zona rural» comunica bem o sentido amplo no texto principal, mantendo a alternativa mais específica em nota.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: Puseram sobre ele a cruz
  rationale: ἐπιτίθημι significa pôr ou colocar sobre alguém. A construção preserva tanto a imposição da carga quanto o objeto explicitamente mencionado.
- source_word: τὸν σταυρόν
  choice: a cruz
  rationale: σταυρός é traduzido diretamente por «cruz». Embora possa haver uma reconstrução histórica segundo a qual Simão carregou a trave transversal, o termo grego não faz essa especificação.
- source_word: φέρειν ὄπισθεν τοῦ Ἰησοῦ
  choice: para que a carregasse atrás de Jesus
  rationale: φέρειν descreve o ato físico de carregar, e ὄπισθεν indica primariamente posição espacial atrás de alguém. A tradução mantém os dois elementos.
theological_decisions:
- issue: Se σταυρός deve ser especificado como a trave transversal no relato da crucificação
  choice: a cruz
  alternative: a trave transversal
  rationale: O texto grego emprega o termo geral σταυρός, sem identificar uma parte específica do instrumento. «A cruz» segue o sentido lexical expresso e evita incorporar ao texto uma reconstrução histórica possível, mas não declarada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Enquanto» preserva o caráter simultâneo da ação; «agarraram» comunica coerção de modo natural. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
