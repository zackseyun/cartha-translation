  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: pt
  text: quando o sol deixou de brilhar[a], a cortina do santuário[b] rasgou-se ao meio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sol escureceu”. O grego não exige a ideia específica de um eclipse astronômico.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o véu do templo”. “Santuário” se refere ao edifício sagrado propriamente dito, não a todo o complexo do templo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “rasgou-se pelo meio” ou “rasgou-se em duas partes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: o sol escureceu
  rationale: A construção de genitivo absoluto é vertida como oração coordenada natural em português. No contexto, ἐκλείπω descreve a perda da luz do sol; “escureceu” comunica isso sem especificar um eclipse como mecanismo astronômico.
- source_word: ἐσχίσθη
  choice: rasgou-se
  rationale: O aoristo passivo de σχίζω descreve naturalmente em português o rompimento de um tecido. A forma pronominal mantém o foco no acontecimento sem identificar quem o causou.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ é um conectivo leve; “e” liga naturalmente os dois acontecimentos, sem introduzir contraste indevido.
- source_word: τὸ καταπέτασμα
  choice: a cortina
  rationale: καταπέτασμα designa uma cortina ou véu divisório. “Cortina” é atual, clara e adequada ao objeto descrito; a forma tradicional “véu” aparece em nota.
- source_word: τοῦ ναοῦ
  choice: do santuário
  rationale: ναός se refere mais precisamente ao edifício sagrado, o santuário propriamente dito, e não a todo o complexo do templo. “Santuário” preserva essa distinção.
- source_word: μέσον
  choice: ao meio
  rationale: A expressão portuguesa “rasgou-se ao meio” reproduz de modo natural a localização ou maneira indicada por μέσον, sem precisar afirmar explicitamente “em duas partes”.
theological_decisions:
- issue: Sentido de ἐκλιπόντος em referência ao sol
  choice: o sol escureceu
  alternative: o sol falhou; houve um eclipse do sol
  rationale: A tradução comunica o fenômeno de escuridão no contexto sem impor uma explicação astronômica técnica. “Falhou” seria lexicalmente próximo, mas pouco natural e potencialmente obscuro em português; “houve um eclipse” é mais específico do que o grego exige.
- issue: Referente de ναός
  choice: santuário
  alternative: templo
  rationale: “Santuário” distingue o edifício sagrado do complexo mais amplo do templo e identifica com maior precisão onde ficava a cortina, sem acrescentar uma interpretação teológica ao sinal.
- issue: Tradução de καταπέτασμα
  choice: cortina
  alternative: véu
  rationale: “Cortina” é acessível e concreta no português moderno. “Véu” é uma alternativa tradicional legítima, preservada em nota, mas pode ser menos transparente para alguns leitores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe grega comprimida foi convertida em duas orações coordenadas para fluidez, preservando a sequência dos acontecimentos e sem definir a escuridão como eclipse.
