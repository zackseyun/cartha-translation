  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: pt
  text: 'E ele lhe disse: “Em verdade lhe digo: hoje[a] você estará comigo no paraíso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “Em verdade lhe digo hoje: você estará comigo no paraíso.” Os manuscritos gregos mais antigos não tinham pontuação; esta alternativa liga “hoje” a “lhe digo”, em vez de a “você estará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Em verdade
  rationale: Na fórmula solene característica das declarações de Jesus, ἀμήν afirma a certeza e a autoridade do que segue. “Em verdade” é uma expressão digna e amplamente compreensível em português.
- source_word: σοι λέγω
  choice: lhe digo
  rationale: Reproduz com naturalidade a fórmula grega e mantém explícito o destinatário singular.
- source_word: σήμερον
  choice: hoje
  rationale: O advérbio é ligado, na leitura principal, a “estará”, indicando que a promessa se cumpriria naquele mesmo dia. Como o texto grego antigo não trazia a pontuação moderna e existe outra segmentação possível, ela é registrada em nota.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: Equivalente direto e natural que preserva a ênfase na companhia pessoal de Jesus.
- source_word: ἔσῃ
  choice: você estará
  rationale: Traduz o futuro singular de εἰμί em português corrente e deixa claro que Jesus se dirige ao homem mencionado no contexto.
- source_word: παραδείσῳ
  choice: paraíso
  rationale: É o equivalente português estabelecido para παράδεισος neste contexto escatológico, sem acrescentar uma definição que o próprio versículo não oferece.
theological_decisions:
- issue: Relação sintática de σήμερον (“hoje”) numa declaração cuja pontuação afeta a interpretação do estado intermediário
  choice: Ligar “hoje” a “você estará comigo no paraíso”
  alternative: 'Ligar “hoje” a “lhe digo”: “Em verdade lhe digo hoje: você estará comigo no paraíso.”'
  rationale: Como os manuscritos gregos antigos não continham a pontuação moderna, a colocação dos sinais é interpretativa. A ordem e o fluxo da frase favorecem que “hoje” qualifique o cumprimento da promessa. A alternativa é genuinamente possível, embora menos provável, e por isso é preservada em nota, sem resolver silenciosamente a tensão teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Usa “você” para tornar inequívoco o singular de ἔσῃ, sem recorrer ao mais regional “tu”. Mantém “Em verdade” como fórmula solene e “paraíso” em minúscula como substantivo comum.
