  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: pt
  text: 'Mas o outro respondeu, repreendendo-o: “Você nem sequer teme a Deus, já que está sob a mesma sentença[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob a mesma condenação” ou “no mesmo julgamento”. O termo grego κρίμα pode indicar julgamento, veredito, condenação ou sentença; aqui se refere à situação penal compartilhada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Mas o outro ... dizendo
  rationale: δὲ marca contraste com a atitude do primeiro criminoso. O particípio ἀποκριθείς introduz uma resposta, mas, em português, combinar literalmente “respondeu” com ἔφη (“disse”) produziria redundância; “dizendo” preserva com naturalidade a função introdutória da construção.
- source_word: ἐπιτιμῶν αὐτῷ
  choice: o repreendeu
  rationale: ἐπιτιμάω indica censura firme. A formulação mantém tanto o destinatário pronominal quanto o tom corretivo.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Você nem sequer teme a Deus
  rationale: “Nem sequer” reproduz a ênfase de οὐδέ, e “temer a Deus” conserva a força direta e o peso moral-religioso de φοβέομαι sem o suavizar para mero respeito.
- source_word: ὅτι
  choice: estando
  rationale: Neste contexto, ὅτι apresenta a circunstância que fundamenta a repreensão. A construção participial portuguesa expressa essa relação de modo claro e natural.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: estando sob a mesma sentença
  rationale: κρίμα pode designar julgamento, veredito, condenação ou sentença. No contexto da crucificação, “sob a mesma sentença” comunica de modo idiomático a situação penal compartilhada.
theological_decisions:
- issue: Sentido de temer a Deus
  choice: teme a Deus
  alternative: reverencia a Deus; respeita a Deus
  rationale: A tradução conserva o idioma bíblico e sua dimensão de responsabilidade diante de Deus, sem o atenuar nem acrescentar uma explicação doutrinária.
- issue: Alcance de κρίμα
  choice: sentença
  alternative: condenação; julgamento
  rationale: O contexto imediato favorece o resultado judicial e penal comum aos crucificados, mas a nota preserva a amplitude semântica legítima do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para transmitir naturalmente o pronome grego enfático σὺ e evita a redundância pouco idiomática “respondeu... dizendo”.
