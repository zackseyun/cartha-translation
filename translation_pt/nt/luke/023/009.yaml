id: LUK.23.9
reference: Luke 23:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: pt
  text: Então Herodes o interrogou longamente[a], mas Jesus não lhe respondeu nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com muitas palavras” ou “com muitas perguntas”. A expressão grega enfatiza um questionamento verbal prolongado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: interrogou
  rationale: O verbo indica questionamento dirigido, e o imperfeito grego sugere ação prolongada ou repetida; essa duração é expressa por “longamente”.
- source_word: δὲ
  choice: Então / mas
  rationale: A primeira ocorrência funciona como conexão narrativa leve, traduzida naturalmente por “Então”; a segunda marca o contraste entre o interrogatório de Herodes e o silêncio de Jesus, por isso “mas”.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: longamente
  rationale: A expressão, literalmente relacionada a muitas ou consideráveis palavras, enfatiza a extensão do questionamento. “Longamente” comunica isso de modo claro e idiomático sem limitar λόγοις estritamente a “perguntas”.
- source_word: αὐτὸς
  choice: Jesus
  rationale: O pronome enfático contrasta o interrogador com aquele que permanece calado. Repetir “Jesus” elimina a possível ambiguidade de dois pronomes masculinos em português e preserva o contraste.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: não lhe respondeu nada
  rationale: Formulação direta e natural que preserva tanto o destinatário da resposta quanto a negação absoluta do conteúdo respondido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla internacional. O nome “Herodes” foi explicitado pelo contexto imediato para evitar ambiguidade pronominal; “Jesus” explicita o referente de αὐτός.
