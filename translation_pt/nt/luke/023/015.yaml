id: LUK.23.15
reference: Luke 23:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: pt
  text: 'Mas Herodes também não, pois o enviou de volta a nós. E vejam: ele não fez nada que mereça a morte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vejam: nada que mereça a morte foi feito por ele.”'
    reason: Alternativa mais formal, que preserva mais de perto a construção passiva e perfeita do grego.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ
  choice: Mas Herodes também não
  rationale: Mantém o contraste e a elipse do grego, acrescentando Herodes como outra autoridade que igualmente não encontrou crime capital.
- source_word: ἀνέπεμψεν
  choice: enviou de volta
  rationale: No contexto narrativo e judicial, o verbo indica que Herodes remeteu Jesus de volta a Pilatos; a formulação é clara e natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação para a afirmação de que Herodes tampouco encontrou culpa digna de morte.
- source_word: αὐτὸν πρὸς ἡμᾶς
  choice: o ... a nós
  rationale: Traduz literalmente o pronome e a direção; a ideia de retorno já está expressa em 'de volta'.
- source_word: καὶ ἰδοὺ
  choice: E vejam
  rationale: Reproduz o marcador que chama a atenção dos ouvintes, em linguagem atual e compatível com o discurso público de Pilatos.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: nada que mereça a morte
  rationale: Preserva o sentido judicial de nenhuma conduta passível de pena capital, com formulação idiomática em português.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: ele não fez
  rationale: Expressa em português natural o resultado presente da construção perfeita e entende o dativo como agente, sem sugerir que algo foi feito contra Jesus.
theological_decisions:
- issue: Sentido de αὐτῷ com πεπραγμένον
  choice: 'agente: ''ele não fez nada'''
  alternative: 'referência: ''nada disso foi constatado nele'''
  rationale: O contexto é o veredito de Pilatos sobre atos atribuíveis a Jesus. A leitura de agente comunica diretamente que Jesus não praticou delito merecedor da morte, embora a construção grega também possa ser vertida de modo mais impessoal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. 'Vejam' dirige naturalmente o apelo à multidão e às autoridades presentes; a nota registra a forma mais literal e formal.
