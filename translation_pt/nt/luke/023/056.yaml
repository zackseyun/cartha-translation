id: LUK.23.56
reference: Luke 23:56
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: pt
  text: Depois de voltarem[a], elas prepararam especiarias aromáticas e óleos perfumados[b]. No sábado, porém, descansaram conforme o mandamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “Tendo voltado”. O particípio grego indica uma ação anterior à ação principal.
    reason: lexical_alternative
  - marker: b
    text: “Óleos perfumados” também pode ser traduzido por “unguentos” ou “perfumes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Depois de voltarem
  rationale: O particípio aoristo feminino plural retoma as mulheres do contexto anterior e indica ação anterior ao verbo principal; esta formulação é natural em português.
- source_word: δὲ
  choice: não representado separadamente
  rationale: A partícula marca uma progressão narrativa leve, já comunicada naturalmente pela sequência da frase em português.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Equivalente direto, corrente e adequado ao contexto narrativo.
- source_word: ἀρώματα
  choice: especiarias aromáticas
  rationale: No contexto funerário, designa substâncias aromáticas usadas no tratamento do corpo; a qualificação evita que 'especiarias' seja entendida apenas em sentido culinário.
- source_word: μύρα
  choice: óleos perfumados
  rationale: Designa óleo ou unguento aromático; a expressão distingue o termo de ἀρώματα e soa mais clara no português moderno.
- source_word: τὸ μὲν σάββατον
  choice: No sábado, porém
  rationale: A expressão é temporal; 'porém' representa discretamente μέν e realça o contraste entre os preparativos e a interrupção exigida pelo sábado.
- source_word: ἡσύχασαν
  choice: descansaram
  rationale: No contexto do sábado, o verbo indica cessar a atividade e repousar.
- source_word: κατὰ τὴν ἐντολήν
  choice: conforme o mandamento
  rationale: Preserva o substantivo no singular e a ideia de agir em conformidade com o mandamento.
theological_decisions:
- issue: Referência de “o mandamento”
  choice: Manter “o mandamento” sem explicitação no texto principal
  alternative: Explicitar “o mandamento sobre o sábado” ou entender como uma ordem divina geral
  rationale: O contexto aponta para o mandamento mosaico do descanso sabático, mas a tradução preserva a formulação singular e não acrescenta informação interpretativa ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a relação temporal nem o contraste do original.
