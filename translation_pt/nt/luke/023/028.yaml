id: LUK.23.28
reference: Luke 23:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: pt
  text: 'Mas Jesus, voltando-se para elas, disse: “Filhas de Jerusalém[a], não chorem por mim; mas chorem por vocês mesmas e por seus filhos,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mulheres de Jerusalém”. O grego diz literalmente “Filhas de Jerusalém”, forma de tratamento de estilo profético preservada no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Mas Jesus, voltando-se para elas
  rationale: O particípio aoristo indica que Jesus se voltou fisicamente para as mulheres antes de falar. A construção com gerúndio preserva a ligação com o verbo principal, enquanto “mas” expressa a transição levemente contrastiva de δέ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Filhas de Jerusalém
  rationale: Mantém o sentido literal e a ressonância do modo profético de dirigir-se coletivamente às mulheres de Jerusalém.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: não chorem por mim
  rationale: Expressa naturalmente a proibição sem decidir de modo indevido se o imperativo presente significa especificamente “parem de chorar”.
- source_word: πλὴν
  choice: pelo contrário
  rationale: 'Marca com clareza a correção contrastiva: elas não devem chorar por Jesus, mas por si mesmas e pelos filhos.'
- source_word: ἐφ’ ἑαυτὰς κλαίετε
  choice: chorem por vocês mesmas
  rationale: Preserva tanto o pronome reflexivo feminino quanto o paralelismo com “por mim”, em português natural e amplamente compreensível.
- source_word: τὰ τέκνα ὑμῶν
  choice: seus filhos
  rationale: É a equivalência familiar, simples e contextual de τέκνα.
theological_decisions:
- issue: Forma de traduzir Θυγατέρες Ἰερουσαλήμ
  choice: Filhas de Jerusalém
  alternative: Mulheres de Jerusalém
  rationale: “Filhas” conserva a linguagem corporativa e a ressonância profética da expressão bíblica, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e compreensão internacional. O plural “vocês” evita regionalismos marcados; “filhas” preserva a imagem bíblica sem soar excessivamente arcaica.
