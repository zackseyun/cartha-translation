lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: O advérbio indica repetição e, nesta posição, soa natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação à reação anterior da multidão.
- source_word: ὁ Πιλᾶτος
  choice: Pilatos
  rationale: Forma tradicional e amplamente reconhecida do nome em português; o artigo grego não precisa ser reproduzido.
- source_word: προσεφώνησεν
  choice: dirigiu-se a eles
  rationale: O verbo pode significar chamar ou dirigir a palavra a alguém; esta escolha preserva o sentido de discurso dirigido sem determinar indevidamente o volume da voz.
- source_word: θέλων
  choice: querendo
  rationale: Mantém de modo natural o valor do particípio presente, que expressa a intenção contemporânea de Pilatos.
- source_word: ἀπολῦσαι
  choice: soltar
  rationale: No contexto de custódia judicial, expressa de maneira clara e corrente a libertação pretendida.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Forma tradicional do nome em português, com omissão natural do artigo grego.
