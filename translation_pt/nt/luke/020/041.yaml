  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Como dizem que o Messias[a] é filho de Davi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Cristo”. Aqui, o título grego Χριστός se refere ao Messias esperado.
    reason: alternative_reading
  - marker: b
    text: Também pode ser entendido como “um filho de Davi” ou “o Filho de Davi”. Em grego, literalmente, “filho de Davi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Marca com naturalidade a transição discursiva; o contraste é leve e não exige necessariamente «mas».
- source_word: πρὸς αὐτούς
  choice: lhes perguntou
  rationale: A construção de fala dirigida a alguém é expressa de modo idiomático pelo pronome «lhes»; «perguntou» explicita a força interrogativa da fala sem alterar seu conteúdo.
- source_word: Πῶς λέγουσιν
  choice: Como podem dizer
  rationale: Reproduz o questionamento da coerência da afirmação. O sujeito plural indefinido de λέγουσιν permanece implícito, como é natural em português.
- source_word: τὸν χριστόν
  choice: o Messias
  rationale: Χριστός é título e, neste contexto davídico, designa o libertador real esperado.
- source_word: εἶναι
  choice: é
  rationale: O infinitivo no discurso indireto grego é vertido naturalmente como verbo finito em português.
- source_word: Δαυὶδ υἱόν
  choice: filho de Davi
  rationale: Preserva a linguagem filial e a relação davídica sem impor ao grego anartro a forma titular «o Filho de Davi».
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O contexto trata explicitamente da identidade e ascendência do rei davídico esperado; «Messias» evidencia o sentido titular sem resolver a tensão desenvolvida nos versículos seguintes.
- issue: Linguagem da filiação davídica
  choice: filho de Davi
  alternative: o Filho de Davi; um filho de Davi
  rationale: A formulação conserva a ambiguidade de definição da expressão grega e evita transformá-la silenciosamente em título fixo ou em referência meramente indefinida.
- issue: Força de Πῶς λέγουσιν
  choice: Como podem dizer
  alternative: Como dizem
  rationale: A pergunta contesta a lógica da afirmação, mas não nega por si só a ascendência davídica do Messias; a tensão permanece aberta para a argumentação subsequente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem dos marcadores acompanha os termos a que cada nota se refere.
