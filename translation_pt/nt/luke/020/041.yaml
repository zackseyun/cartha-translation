review_pass:
  verdict: revise
  source_fidelity: A tradução de «o Messias é filho de Davi» representa adequadamente τὸν χριστὸν εἶναι Δαυὶδ υἱόν e preserva a formulação não titulada de «filho de Davi». Porém, εἶπεν significa «disse», não «perguntou». Embora a fala tenha forma interrogativa, o verbo grego não especifica «perguntou».
  naturalness: «Mas ele lhes disse» e «Como dizem que...?» são formulações naturais, claras e adequadas ao registro narrativo em português contemporâneo. «Como podem dizer» é possível, mas acrescenta uma nuance modal que não está expressa diretamente em λέγουσιν.
  terminology: «Messias» é a escolha apropriada para χριστός neste contexto davídico. «Filho de Davi» mantém a linguagem da fonte sem impor a capitalização honorífica nem uma definitude além da explicitada no grego.
  issues:
  - severity: medium
    issue: «perguntou» traduz εἶπεν de modo excessivamente específico
    rationale: O texto grego diz literalmente que ele «disse-lhes»; a pergunta pertence ao discurso citado. Traduzir o verbo narrativo por «perguntou» não altera muito o sentido global, mas perde a distinção lexical da fonte.
  - severity: low
    issue: «podem dizer» explicita uma modalidade ausente em λέγουσιν
    rationale: λέγουσιν é simplesmente «dizem». A pergunta já comunica o desafio lógico sem a necessidade de acrescentar «podem».
