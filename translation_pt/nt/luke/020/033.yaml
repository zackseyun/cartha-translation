id: LUK.20.33
reference: Luke 20:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: pt
  text: Na ressurreição[a], então, de qual deles ela se torna esposa?[b] Pois os sete a tiveram por esposa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando houver a ressurreição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de qual deles ela será esposa?”'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “casaram-se com ela”. Literalmente, “tiveram-na por esposa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: ela
  rationale: O referente feminino já está claro no contexto; o pronome evita a repetição pouco natural de “a mulher” em português, sem perder a distinção em relação ao sentido conjugal posterior.
- source_word: οὖν
  choice: então
  rationale: Marca a conclusão ou retomada do argumento dos saduceus com naturalidade, sem acentuar excessivamente sua força lógica.
- source_word: ἐν τῇ ἀναστάσει
  choice: na ressurreição
  rationale: Reproduz diretamente a expressão grega e soa natural em português; “quando houver a ressurreição” é uma alternativa explicativa.
- source_word: τίνος αὐτῶν
  choice: de qual deles
  rationale: Expressa de modo idiomático a relação interrogativa indicada pelo genitivo τίνος e mantém explícito o grupo dos sete.
- source_word: γίνεται γυνή
  choice: se torna esposa
  rationale: Preserva tanto a nuance de γίνομαι, “tornar-se”, quanto o sentido conjugal inequívoco de γυνή nesta posição predicativa.
- source_word: οἱ γὰρ ἑπτὰ
  choice: pois os sete
  rationale: Segue de perto o artigo e o numeral gregos, sem acrescentar “todos”, ausente do texto-fonte.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: a tiveram por esposa
  rationale: Mantém a construção relacional “ter alguém por esposa” e evita reduzir a expressão ao ato pontual de casar.
theological_decisions:
- issue: Sentido da linguagem de ressurreição na pergunta dos saduceus
  choice: Traduzir ἀνάστασις simplesmente como “ressurreição”
  alternative: “ressurreição dos mortos”
  rationale: O versículo emprega apenas ἀνάστασις. Não se acrescenta uma explicação doutrinária trazida do contexto, preservando a formulação e a tensão do argumento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente naturalizada, mantendo a progressão argumentativa e a repetição conjugal do grego.
