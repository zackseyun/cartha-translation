  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: pt
  text: 'Então alguns dos saduceus, que afirmam não haver ressurreição, aproximaram-se e o interrogaram:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: aproximaram-se
  rationale: O particípio aoristo indica a aproximação anterior ao ato principal de interrogar. A formulação é natural em português e preserva o movimento em direção a Jesus.
- source_word: δέ
  choice: Então
  rationale: Aqui a partícula marca progressão narrativa, sem contraste forte.
- source_word: τινες τῶν Σαδδουκαίων
  choice: alguns dos saduceus
  rationale: Preserva de modo claro e natural a construção partitiva grega.
- source_word: οἱ ἀντιλέγοντες
  choice: que afirmam não haver
  rationale: No contexto, o particípio descreve a posição declarada dos saduceus. Com a oração infinitiva negativa, esta formulação portuguesa transmite idiomaticamente que eles sustentam a inexistência da ressurreição.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: não haver ressurreição
  rationale: Reproduz de maneira concisa e natural o conteúdo da posição atribuída aos saduceus, sem acrescentar explicações doutrinárias.
- source_word: ἐπηρώτησαν αὐτόν
  choice: o interrogaram
  rationale: O verbo pode significar perguntar ou interrogar. Neste cenário de controvérsia, “interrogaram” comunica o caráter questionador sem exceder o sentido do grego.
theological_decisions:
- issue: Formulação da posição dos saduceus acerca da ressurreição
  choice: que afirmam não haver ressurreição
  alternative: que negam que haja ressurreição
  rationale: A escolha preserva a afirmação histórica e teológica do texto sem definir a natureza da ressurreição nem importar elaborações posteriores. Também reflete diretamente a construção grega ἀνάστασιν μὴ εἶναι.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português. O dois-pontos final prepara a fala que começa no versículo seguinte.
