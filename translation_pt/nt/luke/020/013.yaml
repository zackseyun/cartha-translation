id: LUK.20.13
reference: Luke 20:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: pt
  text: 'Então o dono da vinha disse[a]: “Que farei? Enviarei meu filho amado; talvez o respeitem[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o senhor da vinha”.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como “respeitem” também pode significar “fiquem envergonhados diante dele” ou “lhe mostrem deferência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: dono
  rationale: No contexto agrário da parábola, a expressão indica aquele a quem pertence a vinha. “Dono” comunica naturalmente essa relação sem introduzir à força o título teológico “Senhor”.
- source_word: ἀμπελῶνος
  choice: vinha
  rationale: “Vinha” é o equivalente português corrente para ἀμπελών neste contexto agrícola.
- source_word: Τί ποιήσω;
  choice: Que farei?
  rationale: A pergunta deliberativa dirigida a si mesmo é preservada de modo conciso, natural e digno.
- source_word: πέμψω
  choice: Enviarei
  rationale: O futuro expressa a decisão tomada pelo dono da vinha.
- source_word: υἱόν
  choice: filho
  rationale: υἱός designa especificamente um filho do sexo masculino, relevante tanto para a narrativa quanto para sua ressonância cristológica.
- source_word: ἀγαπητόν
  choice: amado
  rationale: “Amado” preserva o valor afetivo e a possível evocação da linguagem sobre o Filho no batismo e na transfiguração em Lucas.
- source_word: ἴσως
  choice: talvez
  rationale: Expressa expectativa sem certeza e é a forma natural em português moderno.
- source_word: τοῦτον
  choice: o
  rationale: O pronome oblíquo retoma naturalmente “meu filho” em português; o demonstrativo grego acrescenta certa ênfase, mas vertê-lo literalmente como “este” produziria uma formulação menos idiomática.
- source_word: ἐντραπήσονται
  choice: respeitem
  rationale: Neste contexto, o verbo em forma passiva/média indica demonstrar respeito ou deferência diante de alguém. “Respeitem” é claro e natural, enquanto a possibilidade mais literal é registrada em nota.
theological_decisions:
- issue: Tradução de κύριος numa parábola em que o personagem pode representar Deus
  choice: dono da vinha
  alternative: senhor da vinha
  rationale: O sentido narrativo imediato é o proprietário da vinha. “Dono” preserva esse sentido sem obrigar o leitor a entender κύριος como título divino, embora a correspondência teológica da parábola continue disponível.
- issue: Possível ressonância cristológica de τὸν υἱόν μου τὸν ἀγαπητόν
  choice: meu filho amado
  alternative: meu filho, o amado
  rationale: A formulação natural em português conserva tanto o sentido da parábola quanto a provável evocação da linguagem lucana a respeito do Filho, sem explicitar além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe é concisa e digna; “Que farei?” preserva o caráter deliberativo, e as notas mantêm visíveis as principais alternativas lexicais do grego.
