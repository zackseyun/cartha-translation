lexical_decisions:
- source_word: καὶ
  choice: Então
  rationale: No fluxo narrativo, καί liga a resposta à deliberação anterior; “Então” expressa naturalmente essa continuação com leve valor consequencial.
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: O aoristo de ἀποκρίνομαι indica a resposta dada por eles e é vertido de modo direto e idiomático.
- source_word: μὴ εἰδέναι
  choice: que não sabiam
  rationale: O infinitivo negado funciona como discurso indireto depois de “responderam”; a oração com “que” é a forma natural em português.
- source_word: πόθεν
  choice: de onde vinha
  rationale: πόθεν pergunta pela procedência ou origem. “De onde vinha” retoma naturalmente o batismo de João mencionado no contexto sem explicitar além do grego.
