  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: pt
  text: Havia, pois, sete irmãos. O primeiro se casou[a] e morreu sem filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tomou uma esposa”, expressão grega que significa casar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: sete
  rationale: Número cardinal direto que quantifica os irmãos.
- source_word: οὖν
  choice: pois
  rationale: Conserva a função conectiva e inferencial no desenvolvimento do exemplo, sem lhe atribuir sentido temporal.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: O plural masculino refere-se especificamente a homens no cenário de casamento levirato.
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: Indica o primeiro na sequência, sem afirmar que era necessariamente o mais velho.
- source_word: λαβὼν γυναῖκα
  choice: se casou
  rationale: Expressa em português natural o idioma grego literalmente equivalente a 'tomar uma esposa', preservando na nota a forma literal.
- source_word: γυναῖκα
  choice: esposa
  rationale: Neste contexto matrimonial, γυνή significa esposa, não apenas mulher.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e clara do aoristo.
- source_word: ἄτεκνος
  choice: sem filhos
  rationale: Forma corrente e inequívoca de dizer que morreu sem descendência, importante para o contexto legal e narrativo.
