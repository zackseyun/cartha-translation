  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Então, deem a César o que é de César e a Deus o que é de Deus.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devolvam a César... e a Deus...”. O verbo pode significar dar, pagar ou devolver o que é devido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Mas ele lhes disse
  rationale: δέ admite valor levemente adversativo ou continuativo; “mas” se ajusta ao intercâmbio, enquanto “lhes disse” traduz de modo idiomático πρὸς αὐτούς com εἶπεν.
- source_word: Τοίνυν
  choice: Então
  rationale: Marca uma conclusão inferencial ou de retomada; “então” conserva a força retórica em português atual sem a formalidade maior de “portanto”.
- source_word: ἀπόδοτε
  choice: deem
  rationale: O verbo pode significar dar, pagar ou devolver o que é devido. “Deem” é natural e amplo no texto; a nota registra as nuances de restituição e obrigação.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: deem a César o que é de César
  rationale: A construção com τὰ é expressa naturalmente por “o que é de”, preservando o alcance amplo sem restringi-lo aos impostos.
- source_word: Καίσαρος / Καίσαρι
  choice: César
  rationale: Mantém o nome/título imperial da fonte, em vez da paráfrase interpretativa “imperador”.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: e a Deus o que é de Deus
  rationale: Conserva o paralelismo e o contraste equilibrado com a oração referente a César.
theological_decisions:
- issue: Alcance político e teológico da declaração de Jesus
  choice: Preservar a obrigação paralela para com César e para com Deus sem definir os limites exatos de cada esfera.
  alternative: Entender a frase como separação rígida entre religião e Estado, aprovação de autoridade estatal ilimitada ou referência exclusiva ao pagamento de impostos.
  rationale: O grego enuncia o princípio de dar a cada um o que lhe corresponde, mas não apresenta por si só uma teoria política completa. A tradução mantém a amplitude e a tensão do dito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “deem a César o que é de César” reproduz naturalmente o paralelismo grego. O marcador da nota foi colocado após a citação inteira, à qual a alternativa lexical se aplica.
