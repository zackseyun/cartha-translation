id: LUK.20.10
reference: Luke 20:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a slave to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: pt
  text: No tempo oportuno, ele enviou aos lavradores da vinha um escravo[a], para que lhe dessem parte do fruto da vinha. Mas os lavradores o espancaram e o mandaram embora de mãos vazias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servo». O termo grego δοῦλος pode ser traduzido das duas maneiras, mas «escravo» expressa mais claramente a condição de sujeição neste contexto.
    reason: alternative_reading
  - marker: b
    text: Literalmente, «vazio», isto é, sem receber parte alguma do fruto da vinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: no tempo oportuno
  rationale: O dativo temporal indica o momento apropriado ou determinado, sem especificar além do grego que se tratava exatamente da colheita.
- source_word: γεωργούς
  choice: lavradores da vinha
  rationale: γεωργοί designa os que cultivam a terra; a explicitação «da vinha» preserva a especificidade dada pelo contexto sem impor a condição jurídica de arrendatários.
- source_word: δοῦλον
  choice: escravo
  rationale: Preserva de modo transparente a condição de sujeição expressa por δοῦλος neste contexto social; «servo» continua possível como alternativa.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: para que lhe dessem
  rationale: Expressa naturalmente em português a finalidade da ação, correspondente a ἵνα com futuro do indicativo no grego koiné.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: parte do fruto da vinha
  rationale: Comunica o valor partitivo de ἀπό com o genitivo, sem acrescentar uma proporção específica nem formular explicitamente uma reivindicação legal.
- source_word: ἐξαπέστειλαν αὐτὸν δείραντες
  choice: o espancaram e o mandaram embora
  rationale: A coordenação é natural em português e conserva tanto a agressão de δέρω quanto a ideia de expulsão ou afastamento presente no composto ἐξαποστέλλω.
- source_word: κενόν
  choice: de mãos vazias
  rationale: É a expressão idiomática portuguesa para alguém enviado sem receber nada e comunica com clareza o sentido contextual do adjetivo «vazio».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Lavradores da vinha» evita o tecnicismo «viticultores» e não introduz a condição jurídica não expressa diretamente pelo substantivo grego. A repetição de «vinha» foi mantida por clareza e proximidade com a formulação grega.
