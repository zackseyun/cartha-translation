  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: pt
  text: 'Pois o próprio Davi diz no Livro dos Salmos: “O Senhor disse ao meu Senhor: ‘Sente-se à minha direita.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo o hebraico de Salmo 110:1: “O SENHOR disse ao meu Senhor.”'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Pois o próprio Davi
  rationale: “Pois” introduz a explicação dada por Jesus, enquanto “o próprio” preserva a ênfase de αὐτός sobre Davi.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente da fórmula de citação grega e soa natural em português.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: no Livro dos Salmos
  rationale: Reproduz de modo natural a referência à coleção escrita dos salmos, com a capitalização usual do título bíblico.
- source_word: Εἶπεν
  choice: disse
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito dentro da citação.
- source_word: κύριος
  choice: O Senhor
  rationale: Segue diretamente o κύριος do texto grego; a forma que explicita o nome divino no hebraico de Salmo 110:1 é indicada em nota.
- source_word: τῷ κυρίῳ μου
  choice: ao meu Senhor
  rationale: Preserva tanto a relação possessiva quanto a repetição teologicamente significativa de κύριος, sem reduzi-lo a “senhor” no sentido meramente social.
- source_word: Κάθου
  choice: Sente-se
  rationale: Imperativo natural e digno no português moderno; evita o menos corrente “Assenta-te”.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressão idiomática corrente em português para a posição de honra indicada pela construção grega.
theological_decisions:
- issue: Primeiro κύριος na citação de Salmo 110:1, cujo texto hebraico subjacente contém o nome divino YHWH
  choice: O Senhor
  alternative: O SENHOR
  rationale: O texto-fonte imediato de Lucas é grego e traz κύριος. A nota registra a forma baseada no hebraico sem substituir silenciosamente o testemunho grego.
- issue: Segundo κύριος em uma citação de relevância messiânica e cristológica
  choice: meu Senhor
  alternative: meu senhor / meu mestre
  rationale: “Meu Senhor” preserva a repetição do termo grego e a tensão do argumento de Jesus acerca da identidade e posição do Messias, sem explicá-la além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Sente-se” emprega a forma de tratamento corrente no português brasileiro; a pontuação distingue a citação de Davi das palavras citadas dentro do salmo.
