  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: pt
  text: E não conseguiram apanhá-lo em palavra alguma diante do povo[a] e, admirados com a sua resposta, calaram-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «agarrar-se a uma de suas palavras».'
    reason: A expressão grega descreve tentar explorar ou tomar uma declaração como base para apanhá-lo.
lexical_decisions:
- source_word: ἴσχυσαν
  choice: conseguiram
  rationale: No contexto, o verbo expressa capacidade para realizar a tentativa; com a negação, “não conseguiram” é natural e fiel.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: apanhá-lo em nenhuma palavra
  rationale: A construção sugere agarrar-se a uma declaração para incriminá-lo. A formulação portuguesa comunica a tentativa de apanhá-lo pelo que dissesse, sem transformar a imagem em explicação extensa; “nenhuma” decorre naturalmente da negação da tentativa bem-sucedida.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: diante do povo
  rationale: Preserva o sentido de agir na presença pública do povo e mantém λαός como “povo”, sem reduzi-lo a uma multidão circunstancial.
- source_word: θαυμάσαντες
  choice: admirados
  rationale: Expressa a reação de espanto diante da resposta e se encaixa naturalmente na construção participial portuguesa.
- source_word: ἀποκρίσει
  choice: resposta
  rationale: É o equivalente direto e natural para a resposta dada por Jesus no debate.
- source_word: ἐσίγησαν
  choice: ficaram em silêncio
  rationale: Comunica a entrada no estado de silêncio como resultado da resposta, preservando a força pontual do aoristo.
