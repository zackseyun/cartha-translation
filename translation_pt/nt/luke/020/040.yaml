  text: For they no longer dared to ask him anything.
translation:
  language: pt
  text: Pois já não ousavam perguntar-lhe coisa alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa que, daquele ponto em diante, cessaram de fazer perguntas; «já não» é natural em português e preserva a força temporal.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior de maneira concisa e clara.
- source_word: ἐτόλμων
  choice: ousavam
  rationale: O imperfeito indica disposição ou coragem continuada no passado; «ousavam» preserva tanto o aspecto verbal quanto o sentido de τολμάω.
- source_word: ἐπερωτᾶν
  choice: perguntar
  rationale: Como complemento de «ousavam», transmite naturalmente o ato de dirigir perguntas a Jesus, sem intensificar indevidamente para «interrogar».
- source_word: αὐτὸν
  choice: -lhe
  rationale: O pronome refere-se a Jesus e, com «perguntar», o objeto pessoal é expresso de modo idiomático pelo pronome dativo «lhe».
- source_word: οὐδέν
  choice: coisa alguma
  rationale: Em construção de polaridade negativa após «já não», «coisa alguma» comunica a totalidade enfática de οὐδέν com naturalidade e dignidade.
