  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: pt
  text: Todo aquele que cair sobre aquela pedra será despedaçado[a]; mas aquele sobre quem ela cair, ela o esmagará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será estilhaçado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ela o reduzirá a pó” ou “o espalhará como palha”; o verbo grego tem sentido mais forte que um simples impacto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Todo aquele que cair
  rationale: O particípio substantivado tem sentido genérico e abrangente. A formulação é natural em português e preserva o valor indefinido de “todo aquele que”.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: sobre aquela pedra
  rationale: ἐπί com acusativo após πίπτω indica movimento sobre ou contra a pedra; “sobre aquela pedra” preserva de modo claro o demonstrativo ἐκεῖνον.
- source_word: συνθλασθήσεται
  choice: será despedaçado
  rationale: O futuro passivo exprime ser quebrado em pedaços ou estilhaçado. “Será despedaçado” comunica a gravidade do resultado sem especificar além do texto.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: mas aquele sobre quem ela cair
  rationale: A oração relativa com ἄν e subjuntivo expressa referência indefinida. A redação mantém o paralelismo com a primeira oração e explicita naturalmente que o sujeito de “cair” é a pedra.
- source_word: λικμήσει
  choice: esmagará
  rationale: λικμάω pode transmitir a ideia de triturar ou joeirar até dispersar. “Esmagará” é claro no texto principal, enquanto a nota preserva as nuances mais fortes possíveis.
- source_word: αὐτόν
  choice: o
  rationale: O pronome masculino singular retoma genericamente “aquele”. O pronome oblíquo “o” preserva a referência singular masculina de maneira idiomática.
theological_decisions:
- issue: Imagem da pedra como juízo
  choice: Manter a pedra como agente de juízo destrutivo, sem suavizar os verbos.
  alternative: Interpretar a linguagem apenas como tropeço ou ferimento leve.
  rationale: No contexto, a pedra da citação precedente representa juízo decisivo. συνθλασθήσεται e λικμήσει são verbos fortes; a tradução conserva essa força sem acrescentar uma identificação teológica não expressa neste versículo.
- issue: Referência masculina genérica
  choice: Usar “aquele” e retomá-lo com o pronome masculino “o”.
  alternative: Empregar uma reformulação neutra, como “a pessoa”.
  rationale: O grego apresenta antecedente e pronome no masculino singular com força genérica. A forma portuguesa preserva essa estrutura e continua compreensível como referência abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “ela” na segunda oração evita qualquer dúvida quanto à pedra ser o sujeito de “esmagará”, ao mesmo tempo que acompanha a ênfase sintática do grego.
