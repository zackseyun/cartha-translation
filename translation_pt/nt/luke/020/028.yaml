source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: pt
  text: 'dizendo: “Mestre, Moisés escreveu para nós que, se o irmão de alguém morrer casado[a] e sem filhos, o irmão dele deve tomar a esposa e suscitar descendência[b] em favor do irmão falecido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “morrer tendo esposa”; a expressão também pode ser traduzida como “morrer deixando esposa”.'
    reason: lexical_alternative
  - marker: b
    text: “Suscitar descendência” ecoa a linguagem jurídica de Deuteronômio 25:5 sobre prover descendência em nome do irmão falecido; literalmente, “suscitar semente”.
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É a forma vocativa natural e digna de se dirigir a Jesus como mestre que ensina, sem a conotação de domínio pessoal que outras opções poderiam sugerir.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Moisés escreveu para nós
  rationale: O dativo ἡμῖν indica que a prescrição foi escrita para o povo de Israel, e não que Moisés lhes tenha dirigido uma carta.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: se o irmão de alguém morrer
  rationale: Preserva o caráter indefinido e genérico de τινος e a construção singular do grego.
- source_word: ἔχων γυναῖκα
  choice: sendo casado
  rationale: Expressa em português corrente a situação indicada literalmente por 'tendo mulher/esposa', sem inserir no texto principal a formulação interpretativa 'deixar viúva'.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: e não tiver filhos
  rationale: Comunica com naturalidade que o falecido não deixou filhos; o português permite manter o mesmo sujeito sem repetir um pronome demonstrativo pesado.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: o irmão dele deve tomar a esposa
  rationale: A construção com ἵνα apresenta a obrigação prevista na lei. 'Tomar a esposa' conserva o tom jurídico-bíblico sem expandir para uma explicação do casamento levirato.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: suscitar descendência
  rationale: Mantém algo da imagem e do registro jurídico do idioma grego, ao mesmo tempo que 'descendência' comunica melhor o sentido moderno do que o literal 'semente'.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para seu irmão
  rationale: 'O dativo indica benefício ou referência: a descendência seria reconhecida em favor do irmão morto. A formulação concisa conserva a estrutura do original.'
theological_decisions:
- issue: Linguagem jurídica do casamento levirato
  choice: o irmão dele deve tomar a esposa e suscitar descendência para seu irmão
  alternative: o irmão dele deve casar-se com a viúva e gerar filhos em nome do irmão falecido
  rationale: A opção escolhida preserva o idioma legal e bíblico sem acrescentar ao texto principal uma explicação cultural que o grego apenas pressupõe.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva-se o tom de citação legal, enquanto notas esclarecem o literalismo e o pano de fundo veterotestamentário.
