source:
  edition: SBLGNT
  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: pt
  text: É permitido que paguemos tributo a César[a] ou não?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «imposto». O termo grego se refere a um tributo pago a um poder governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: É permitido
  rationale: Expressa a ideia de licitude ou permissão sem explicitar se a norma em vista é a lei romana ou a lei de Deus.
- source_word: ἡμᾶς
  choice: (sujeito implícito na forma verbal)
  rationale: Em português, o infinitivo impessoal em «É permitido pagar» inclui naturalmente os que fazem a pergunta; acrescentar «para nós» seria menos idiomático, e «para nós, judeus» acrescentaria algo ausente do grego.
- source_word: Καίσαρι
  choice: a César
  rationale: Preserva a designação histórica e política do governante romano.
- source_word: φόρον
  choice: tributo
  rationale: Designa o imposto pago a um poder governante e conserva a conotação política de sujeição presente no contexto.
- source_word: δοῦναι
  choice: pagar
  rationale: Embora o verbo signifique literalmente «dar», em português «pagar tributo» é a combinação natural e semanticamente exata.
- source_word: ἢ οὔ
  choice: ou não
  rationale: É a forma idiomática direta de concluir a pergunta alternativa.
theological_decisions:
- issue: Qual lei determina o que é permitido
  choice: Manter implícito o referencial de «É permitido»
  alternative: Explicitar «segundo a lei romana» ou «segundo a lei de Deus»
  rationale: O grego não especifica a lei em vista. A pergunta envolve deliberadamente tensão religiosa e política, que não deve ser resolvida pela tradução.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural tanto no Brasil como em outros contextos lusófonos. «Tributo» preserva a dimensão fiscal e política do termo grego; «pagar» evita o pouco natural «dar tributo».
