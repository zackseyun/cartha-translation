  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: pt
  text: 'E Jesus lhes disse: “Eu também não lhes direi com que autoridade[a] faço estas coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com base em que autoridade”.'
    reason: Alternativa idiomática para ἐν ποίᾳ ἐξουσίᾳ, explicitando a ideia de fundamento ou autorização para agir.
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: E Jesus lhes disse
  rationale: Mantém a ligação narrativa de καί e expressa naturalmente o dativo αὐτοῖς por meio do pronome «lhes».
- source_word: Οὐδὲ ἐγώ
  choice: Eu também não
  rationale: No contexto, οὐδέ relaciona a recusa de Jesus à recusa anterior dos líderes. «Também não» preserva essa correspondência sem acrescentar uma explicação.
- source_word: λέγω ὑμῖν
  choice: lhes direi
  rationale: Embora λέγω esteja no presente, aqui constitui uma recusa em fornecer a resposta; o futuro em português comunica essa força discursiva com naturalidade. «Lhes» representa ὑμῖν.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: É uma formulação portuguesa natural para a base ou autorização sob a qual alguém age; «por que autoridade» também é possível.
- source_word: ἐξουσίᾳ
  choice: autoridade
  rationale: Neste contexto, o termo indica legitimidade ou direito para agir, não apenas poder ou capacidade.
- source_word: ταῦτα ποιῶ
  choice: faço estas coisas
  rationale: Preserva o plural de ταῦτα e traduz o presente ποιῶ de modo direto e idiomático.
theological_decisions:
- issue: A recusa de Jesus em responder aos líderes
  choice: Apresentar diretamente a recusa de revelar a autoridade pela qual ele age.
  alternative: Caracterizar a resposta como evasão ou explicar explicitamente a recusa como juízo sobre a incredulidade deles.
  rationale: O versículo declara a recusa, mas não fornece aqui sua interpretação teológica; a tradução mantém essa tensão sem acrescentar motivos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das palavras é natural, e o pronome «lhes» evita repetição pesada sem perder os destinatários explícitos no grego.
