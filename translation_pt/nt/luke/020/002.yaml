  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: pt
  text: 'E lhe disseram: “Diga-nos: com que autoridade você faz estas coisas? Ou quem foi que lhe deu esta autoridade?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo narrativo simples e liga a pergunta ao contexto anterior sem acrescentar uma nuance temporal.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: lhe disseram
  rationale: Expressa naturalmente em português a construção grega redundante, preservando tanto o ato de falar quanto o destinatário.
- source_word: Εἰπὸν ἡμῖν
  choice: Diga-nos
  rationale: É a forma idiomática e direta de traduzir o imperativo aoristo neste pedido incisivo.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: com que autoridade
  rationale: Em português, esta formulação comunica naturalmente a base ou autorização sob a qual alguém age.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o plural do demonstrativo e sua referência às ações recentes de Jesus.
- source_word: ποιεῖς
  choice: você faz
  rationale: O presente simples é natural em português nesta pergunta sobre a atuação presente e característica de Jesus.
- source_word: ἢ
  choice: Ou
  rationale: Introduz a segunda pergunta como formulação alternativa e estreitamente relacionada da mesma contestação.
- source_word: τίς ἐστιν ὁ δούς
  choice: quem foi que ... deu
  rationale: A construção clivada conserva a ênfase identificadora do particípio substantivado sem soar artificial em português.
- source_word: σοι
  choice: lhe
  rationale: O pronome dativo é expresso de modo natural como objeto indireto de “deu”.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: esta autoridade
  rationale: “Autoridade” indica legitimidade ou direito delegado, e não apenas capacidade ou força; o demonstrativo é preservado.
theological_decisions:
- issue: Sentido de ἐξουσία no confronto de Jesus no templo
  choice: autoridade
  alternative: poder; direito
  rationale: O contexto trata da legitimidade e da fonte das ações de Jesus. “Autoridade” preserva a dimensão institucional e teológica da pergunta sem reduzi-la a mera capacidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita a marca regional ou excessivamente solene de “tu” e mantém a fala direta. A sintaxe foi suavizada sem eliminar conteúdo semântico.
