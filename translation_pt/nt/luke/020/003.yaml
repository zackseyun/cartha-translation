base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Eu também vou fazer uma pergunta a vocês. Digam-me:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Mas ele lhes respondeu
  rationale: Reproduz de modo natural o particípio responsivo seguido do verbo de fala, sem a formulação pesada “respondendo, disse-lhes”; “mas” expressa o leve contraste de δέ no intercâmbio.
- source_word: Ἐρωτήσω ὑμᾶς
  choice: vou fazer uma pergunta a vocês
  rationale: Em português corrente, “fazer uma pergunta a vocês” comunica com clareza o futuro de ἐρωτάω e o objeto plural ὑμᾶς.
- source_word: κἀγὼ
  choice: Eu também
  rationale: 'Preserva a ênfase recíproca de καὶ ἐγώ: já que eles o interrogaram, ele também os interrogará.'
- source_word: λόγον
  choice: uma pergunta
  rationale: Embora λόγος possa significar “palavra” ou “questão/assunto”, com ἐρωτάω designa idiomaticamente aquilo que se pergunta; “uma pergunta” é claro e natural.
- source_word: καὶ εἴπατέ μοι
  choice: Digam-me
  rationale: Mantém o imperativo plural direto e o pronome dativo, sem o pouco natural “e vocês me digam”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O pronome plural “vocês” torna explícitos os destinatários; “lhes respondeu” evita repetição. A pontuação final com dois-pontos mantém a introdução à pergunta apresentada no versículo seguinte.
