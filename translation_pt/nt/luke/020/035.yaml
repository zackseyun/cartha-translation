id: LUK.20.35
reference: Luke 20:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: pt
  text: Mas os que forem considerados dignos[a] de alcançar aquela era[b] e a ressurreição dentre os mortos não se casam nem são dados em casamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forem julgados dignos” ou “forem tidos por dignos”. O grego está na voz passiva, indicando os que são avaliados como dignos.
    reason: lexical_alternative
  - marker: b
    text: Ou “a era futura”. Literalmente, “aquela era”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: forem considerados dignos
  rationale: 'Preserva o sentido passivo do particípio: trata-se dos que são julgados ou tidos por dignos, sem afirmar dignidade intrínseca nem mérito adquirido.'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: aquela era
  rationale: Reproduz o demonstrativo grego e mantém o contraste escatológico com a era presente sem explicitar no texto principal aquilo que o grego deixa implícito.
- source_word: τυχεῖν
  choice: alcançar
  rationale: Expressa naturalmente, com os dois complementos coordenados, a ideia de chegar a participar daquela era e da ressurreição.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: a ressurreição dentre os mortos
  rationale: A formulação natural preserva a força de ἐκ, indicando ressurreição do meio dos mortos.
- source_word: γαμοῦσιν
  choice: se casam
  rationale: É a forma corrente e clara de expressar o ato de contrair casamento.
- source_word: γαμίζονται
  choice: são dados em casamento
  rationale: Mantém a distinção do segundo verbo e sua voz passiva, refletindo o idioma social do período.
theological_decisions:
- issue: Se καταξιωθέντες implica que a vida da ressurreição é conquistada por mérito
  choice: 'A tradução preserva a avaliação passiva: “forem considerados dignos”.'
  alternative: “os dignos” ou “os que merecerem”
  rationale: A formulação não atribui mérito intrínseco nem define quem faz a avaliação, mas conserva a tensão teológica do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aquela era” conserva a formulação do original; “são dados em casamento” mantém deliberadamente o paralelismo histórico e a distinção verbal do grego.
