  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: pt
  text: 'Mas ele olhou para eles e disse: “Que é, então, isto que está escrito: ‘A pedra que os construtores rejeitaram, esta se tornou a cabeça do canto’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pedra angular”; alternativamente, “a pedra de remate”. O grego diz literalmente “a cabeça do canto”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: olhando fixamente para eles
  rationale: O particípio aoristo descreve um olhar deliberado e dirigido. A expressão é natural em português e comunica a atenção intencional sem exagerar a intensidade.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Que significa, então, isto que está escrito
  rationale: Em português, a pergunta grega é naturalmente entendida como uma indagação retórica sobre o sentido do texto citado. “Está escrito” é a fórmula corrente e preserva o estado resultante do perfeito passivo γεγραμμένον.
- source_word: Λίθον
  choice: A pedra
  rationale: Embora o substantivo esteja sem artigo na forma grega da citação, o contexto identifica uma pedra específica; o artigo definido é natural em português.
- source_word: ἀπεδοκίμασαν
  choice: rejeitaram
  rationale: Expressa de modo claro a avaliação negativa seguida de recusa implícita no verbo grego.
- source_word: οἱ οἰκοδομοῦντες
  choice: os construtores
  rationale: O particípio substantivado designa naturalmente aqueles que constroem, e “construtores” conserva a metáfora arquitetônica.
- source_word: οὗτος
  choice: essa
  rationale: O demonstrativo retoma enfaticamente “a pedra”. A forma feminina exigida pelo português preserva a ênfase sem introduzir explicitamente uma identificação cristológica.
- source_word: ἐγενήθη εἰς
  choice: se tornou
  rationale: Tradução idiomática do aoristo com εἰς, indicando mudança de condição ou função.
- source_word: κεφαλὴν γωνίας
  choice: a cabeça da esquina
  rationale: A tradução formal mantém a imagem literal e sua ambiguidade arquitetônica, sem decidir entre pedra angular de fundação e pedra de remate.
theological_decisions:
- issue: Metáfora arquitetônica na citação do Salmo 118:22
  choice: a cabeça da esquina
  alternative: a pedra angular; a pedra de remate
  rationale: A expressão grega admite mais de uma compreensão arquitetônica. A formulação literal no texto principal preserva essa tensão, enquanto a nota oferece as interpretações idiomáticas mais comuns.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção da citação conserva deliberadamente a metáfora incomum do original, esclarecida em nota.
