  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: pt
  text: Cuidado com os escribas[a], que querem andar com vestes longas[b] e gostam de saudações nas praças públicas, dos primeiros assentos nas sinagogas[c] e dos lugares de honra nos banquetes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquem atentos aos escribas”.'
    reason: lexical_alternative
  - marker: b
    text: “Vestes longas” pode referir-se a trajes formais ou vistosos, associados no contexto à exibição de posição e prestígio.
    reason: cultural_note
  - marker: c
    text: 'Ou: “os assentos principais” ou “os lugares de maior honra” nas sinagogas.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “os primeiros lugares” ou “os lugares principais” nos banquetes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Cuidado com
  rationale: Expressa de modo natural e direto a força do imperativo de advertência com ἀπό, isto é, manter-se alerta diante deles.
- source_word: γραμματέων
  choice: escribas
  rationale: Termo tradicional, conciso e lexicalmente próximo, adequado à função religiosa e jurídica desse grupo no contexto dos Evangelhos.
- source_word: τῶν θελόντων
  choice: que gostam de
  rationale: Neste contexto, θέλω caracteriza uma inclinação ou preferência persistente, não apenas uma intenção momentânea; a formulação também coordena naturalmente os comportamentos enumerados.
- source_word: περιπατεῖν ἐν στολαῖς
  choice: andar com vestes longas
  rationale: Mantém a ação pública de circular e explicita o tipo de traje indicado por στολή, associado à exibição de posição social.
- source_word: φιλούντων ἀσπασμοὺς
  choice: adoram receber saudações
  rationale: Preserva a intensidade de φιλέω e torna explícito, de modo natural em português, que as saudações honoríficas eram dirigidas a eles.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nas praças públicas
  rationale: A ἀγορά era o espaço público e comercial da cidade; 'praças públicas' comunica melhor o cenário social do que o sentido moderno restrito de 'mercados'.
- source_word: πρωτοκαθεδρίας
  choice: lugares de maior destaque
  rationale: Comunica a primazia e o prestígio dos assentos nas sinagogas, sem sugerir necessariamente qualidade ou conforto físico.
- source_word: πρωτοκλισίας
  choice: lugares de honra
  rationale: Transmite a função social dos lugares principais à mesa nos banquetes, em vez de reproduzir literalmente o costume antigo de reclinar-se.
theological_decisions:
- issue: Alcance da crítica aos escribas
  choice: Conservar a referência aos 'escribas' seguida pelos comportamentos que os caracterizam no versículo.
  alternative: Explicitar que se trata apenas de alguns escribas, ou condenar sem distinção todos os escribas como classe.
  rationale: O grego usa o artigo definido e caracteriza o grupo por particípios, sem inserir 'alguns' nem desenvolver uma condenação doutrinária de cada indivíduo. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência foi levemente reestruturada para evitar repetição pesada de orações relativas, mantendo os comportamentos sob a caracterização dos escribas e preservando o paralelismo entre sinagogas e banquetes.
