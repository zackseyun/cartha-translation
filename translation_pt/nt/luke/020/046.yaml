revisions:
- from: Cuidado com os escribas[a], que gostam de andar com vestes longas[b] e adoram receber saudações nas praças públicas, ocupar os lugares de maior destaque nas sinagogas[c] e os lugares de honra nos banquetes[d].
  to: Cuidado com os escribas[a], que querem andar com vestes longas[b] e gostam de saudações nas praças públicas, dos primeiros assentos nas sinagogas[c] e dos lugares de honra nos banquetes[d].
  rationale: A revisão conserva a advertência e a crítica social do original, mas restitui a nuance volitiva de θέλοντων com «querem andar». Também reorganiza a segunda série de comportamentos para que «gostam de» governe, de forma paralela, «saudações», «primeiros assentos» e «lugares de honra», como φιλούντων rege os três objetos gregos. As notas foram ajustadas para maior precisão e prudência histórica.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:10:20Z'
review_pass:
  verdict: revise
  source_fidelity: A advertência inicial e a designação «escribas» são adequadas. No entanto, «que gostam de andar» enfraquece o valor volitivo de θέλοντων («que querem/desejam andar»). Além disso, a coordenação atual faz «adoram» reger inadequadamente «os lugares de honra nos banquetes», sem verbo correspondente, e reestrutura os objetos da segunda série de particípios de modo pouco fiel.
  naturalness: O texto é geralmente claro e de registro apropriado. A enumeração após «adoram receber saudações» fica sintaticamente incompleta no último membro («e os lugares de honra nos banquetes»). A revisão restaura um paralelismo fluente e natural.
  terminology: «Escribas», «vestes longas», «sinagogas» e «banquetes» são escolhas apropriadas. «Primeiros assentos» comunica bem πρωτοκαθεδρίας; «lugares de honra» comunica adequadamente πρωτοκλισίας. A nota cultural sobre as vestes deve evitar apresentar como definição histórica absoluta algo que é uma conotação contextual.
  issues:
  - severity: medium
    issue: «que gostam de andar» para τῶν θελόντων περιπατεῖν
    rationale: θέλω expressa querer ou desejar; «gostam de andar» desloca a ênfase de intenção/aspiração para prazer habitual.
  - severity: high
    issue: Coordenação sintaticamente incompleta na lista de honras buscadas
    rationale: Em «adoram receber saudações..., ocupar os lugares... e os lugares de honra...», o último sintagma nominal não é regido de maneira natural pelo verbo e não espelha claramente os três objetos de φιλούντων.
  - severity: low
    issue: Nota b formula a conotação social como fato definicional
    rationale: στόλαι designa vestes longas ou formais; o caráter vistoso e sinalizador de status é plausível no contexto, mas deve ser expresso com cautela.
