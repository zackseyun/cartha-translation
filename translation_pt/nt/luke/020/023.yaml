  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: pt
  text: 'Mas, percebendo a astúcia deles[a], disse-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “artimanha”, “malícia” ou “engano”. O termo grego indica esperteza usada de maneira inescrupulosa para tramar algo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: percebendo
  rationale: O particípio aoristo indica que Jesus discerniu a atitude deles antes de falar. “Percebendo” expressa reconhecimento atento sem intensificar indevidamente o sentido.
- source_word: δὲ
  choice: Mas
  rationale: Marca aqui uma transição com leve contraste entre a tentativa deles e a reação de Jesus.
- source_word: αὐτῶν
  choice: deles
  rationale: O genitivo modifica πανουργίαν; “deles” é uma construção possessiva natural e clara em português.
- source_word: πανουργίαν
  choice: astúcia
  rationale: O termo denota esperteza calculada e moralmente inescrupulosa. “Astúcia” preserva tanto o elemento de habilidade quanto sua conotação negativa.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente narrativo corrente e direto para o aoristo de λέγω.
- source_word: πρὸς αὐτούς
  choice: disse-lhes
  rationale: A construção com πρός e acusativo identifica os destinatários da fala; a forma pronominal é natural no registro bíblico digno e permanece compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação concisa acompanha a estrutura narrativa grega sem reproduzi-la de modo rígido.
