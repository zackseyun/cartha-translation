    issue: Posição de «para ele» na oração final
    rationale: Na posição final, «vivem para ele» tende a sugerir propósito. Antepor o sintagma («para ele, todos vivem») preserva melhor a abertura semântica de αὐτῷ e produz uma leitura mais natural em português.
