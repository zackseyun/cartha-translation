  to: Ele não é Deus de mortos, mas de vivos, pois, para ele, todos vivem.[a]
  rationale: A única alteração é a posição de «para ele». Ela melhora a naturalidade em português e reduz a leitura teleológica indevida, sem alterar o sentido, o escopo de «todos» ou a ambiguidade do dativo grego.
