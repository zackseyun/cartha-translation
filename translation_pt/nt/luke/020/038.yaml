review_pass:
  verdict: revise
  source_fidelity: O texto transmite corretamente a oposição de οὐκ ... ἀλλὰ («não... mas»), os substantivos plurais «mortos» e «vivos», e a afirmação presente de que «todos vivem». «Deus» é corretamente definido pelo contexto. O dativo αὐτῷ permanece semanticamente condensado e não deve ser convertido numa formulação doutrinariamente mais explícita.
  naturalness: «Todos vivem para ele» é possível, mas em português pode ser lido mais naturalmente como finalidade ou dedicação («vivem em favor dele»). A ordem «pois, para ele, todos vivem» é idiomática, mantém a concisão e expressa melhor a relação perspectival/referencial que o dativo pode ter, sem eliminar sua ambiguidade.
  terminology: «Deus de mortos, mas de vivos» é uma construção bíblica portuguesa estabelecida, concisa e adequada ao paralelismo do grego. A nota alternativa «estão vivos diante dele» é defensável como explicitação interpretativa e está apropriadamente identificada como alternativa.
  issues:
