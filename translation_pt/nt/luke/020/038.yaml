id: LUK.20.38
reference: Luke 20:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: pt
  text: Ele não é Deus de mortos, mas de vivos, pois, para ele, todos vivem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois todos estão vivos diante dele”.'
    reason: Tradução alternativa do dativo αὐτῷ e da expressão ζῶσιν, cuja formulação grega é semanticamente condensada.
lexical_decisions:
- source_word: θεὸς
  choice: Deus
  rationale: Embora esteja sem artigo em grego, o substantivo é definido neste contexto monoteísta e na construção predicativa; “Deus” é a forma natural em português.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ marca uma transição ou contraste leve. Em português, o contraste já é transmitido naturalmente por “não... mas”, sem necessidade de acrescentar “ora” ou “porém”.
- source_word: νεκρῶν
  choice: mortos
  rationale: O genitivo plural substantivado forma a expressão concisa “Deus de mortos”, mantendo o paralelismo com “vivos”.
- source_word: ζώντων
  choice: vivos
  rationale: O particípio substantivado contrasta diretamente com “mortos”; “vivos” é conciso, natural e fiel.
- source_word: πάντες
  choice: todos
  rationale: Preserva a formulação ampla e compacta do grego sem restringir explicitamente o referente aos patriarcas mencionados no contexto.
- source_word: αὐτῷ
  choice: para ele
  rationale: A expressão conserva a relação semântica comprimida do dativo e evita resolver de modo excessivo se o sentido é “para ele”, “diante dele” ou “em relação a ele”.
- source_word: ζῶσιν
  choice: vivem
  rationale: Traduz diretamente o presente ativo e mantém a concisão da afirmação.
theological_decisions:
- issue: Sentido de αὐτῷ em πάντες γὰρ αὐτῷ ζῶσιν
  choice: pois todos vivem para ele
  alternative: pois todos estão vivos diante dele
  rationale: “Vivem para ele” permanece formalmente próximo do dativo grego e preserva sua ambiguidade relacional. A alternativa esclarece uma interpretação possível, mas pode sugerir de maneira mais definida a perspectiva divina; por isso aparece em nota, sem resolver a tensão do texto principal.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso entre “mortos” e “vivos”. O marcador de nota [a] foi colocado após a cláusula a que a alternativa se refere.
