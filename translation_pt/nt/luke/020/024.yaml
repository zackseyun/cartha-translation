  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: pt
  text: '“Mostrem-me um denário.[a] De quem são a imagem e a inscrição que ele traz?” Eles responderam: “De César.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de uso comum naquela época; conserva-se o nome da moeda para preservar o contexto histórico.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Mostrem-me
  rationale: O imperativo aoristo plural é uma ordem direta dirigida aos interlocutores; “Mostrem-me” é natural e preserva número e força verbal.
- source_word: δηνάριον
  choice: um denário
  rationale: Mantém o nome histórico específico da moeda romana, em vez de generalizá-la.
- source_word: τίνος ἔχει
  choice: De quem são ... que ele traz?
  rationale: Expressa de modo idiomático a pergunta acerca da pessoa representada e nomeada na moeda, sem entender o genitivo como propriedade da própria moeda.
- source_word: εἰκόνα
  choice: imagem
  rationale: Equivalente amplo e tradicional, adequado à figura ou efígie gravada na moeda.
- source_word: ἐπιγραφήν
  choice: inscrição
  rationale: Termo preciso e corrente para o texto gravado numa moeda.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Eles responderam
  rationale: Converte naturalmente a construção com particípio e verbo finito em uma oração portuguesa concisa; δέ marca a progressão narrativa sem exigir “mas”.
- source_word: Καίσαρος
  choice: De César
  rationale: Preserva a resposta genitiva elíptica do grego e corresponde naturalmente à pergunta “De quem...?”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita o menos natural “cuja imagem” e explicita “que ele traz” apenas para tornar idiomática a construção portuguesa, sem acrescentar conteúdo interpretativo.
