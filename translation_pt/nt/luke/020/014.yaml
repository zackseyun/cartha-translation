id: LUK.20.14
reference: Luke 20:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: pt
  text: 'Mas, quando os lavradores[a] o viram, deliberavam entre si: “Este é o herdeiro. Vamos matá-lo, para que a herança se torne nossa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrendatários” ou “agricultores”. A palavra grega se refere a trabalhadores agrícolas; nesta parábola, eles cultivam uma vinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: lavradores
  rationale: O substantivo designa trabalhadores agrícolas. “Lavradores” preserva esse sentido sem inserir diretamente a condição jurídica de arrendatários; no contexto da parábola, eles cultivam uma vinha.
- source_word: διελογίζοντο
  choice: deliberavam
  rationale: O imperfeito indica uma deliberação em andamento, de caráter calculado. “Deliberavam” comunica melhor esse processo do que “discutiam”, que poderia sugerir conflito.
- source_word: πρὸς ἀλλήλους
  choice: entre si
  rationale: Expressa de modo natural em português a interação recíproca dos lavradores.
- source_word: κληρονόμος
  choice: herdeiro
  rationale: É o equivalente jurídico e narrativo corrente de κληρονόμος.
- source_word: ἀποκτείνωμεν
  choice: Vamos matá-lo
  rationale: Reproduz naturalmente a força exortativa do subjuntivo na primeira pessoa do plural, sem acrescentar ao verbo a avaliação explícita de “assassinar”.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: para que a herança se torne nossa
  rationale: Mantém a oração de finalidade introduzida por ἵνα e o sentido de mudança expresso por γένηται.
- source_word: δὲ
  choice: Mas
  rationale: Marca o desenvolvimento narrativo com leve contraste em relação à chegada do filho.
- source_word: ἰδόντες
  choice: quando ... o viram
  rationale: A construção temporal traduz com naturalidade o particípio aoristo, apresentando a visão do herdeiro como antecedente da deliberação.
theological_decisions:
- issue: Designação dos γεωργοί na parábola da vinha
  choice: lavradores
  alternative: arrendatários; agricultores; viticultores
  rationale: “Lavradores” traduz o sentido agrícola do termo sem tornar explícita no substantivo a relação jurídica de arrendamento, inferida do contexto mais amplo. A nota registra tanto essa função contextual quanto a ligação específica com a vinha.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Deliberavam” conserva o aspecto durativo e o tom calculado da ação; a fala direta permanece incisiva e natural.
