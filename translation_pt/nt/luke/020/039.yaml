  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: pt
  text: 'Então alguns dos escribas responderam: “Mestre, falaste bem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: responderam
  rationale: O particípio aoristo de ἀποκρίνομαι introduz a reação verbal; em português corrente, a forma finita “responderam” expressa naturalmente a construção.
- source_word: δέ
  choice: Então
  rationale: Marca uma transição discursiva leve. “Então” acompanha o fluxo narrativo sem impor forte contraste.
- source_word: τινες τῶν γραμματέων
  choice: alguns dos escribas
  rationale: Preserva a construção partitiva, indicando que apenas parte dos escribas se manifestou.
- source_word: γραμματέων
  choice: escribas
  rationale: É o termo tradicional e preciso no contexto dos Evangelhos; alternativas como “mestres da Lei” acrescentariam interpretação funcional.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: No uso bíblico em português, “Mestre” comunica naturalmente o sentido vocativo de alguém reconhecido como professor, sem a estranheza de “Professor” neste contexto.
- source_word: καλῶς
  choice: bem
  rationale: Mantém a força ampla do advérbio, que pode elogiar tanto a maneira quanto a correção do que foi dito.
- source_word: εἶπας
  choice: falaste
  rationale: O pretérito perfeito traduz diretamente o aoristo e forma, com “bem”, uma expressão natural e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com legibilidade brasileira. A colocação pronominal e o pretérito “falaste” preservam o tom bíblico sem arcaísmo excessivo.
