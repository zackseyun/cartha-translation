id: LUK.20.34
reference: Luke 20:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: pt
  text: 'E Jesus lhes disse: “Os filhos desta era[a] se casam e são dados em casamento,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “As pessoas desta era”. Em grego, “Os filhos desta era”, expressão masculina representativa para os que pertencem à era presente.
    reason: Alternativa lexical e esclarecimento do alcance representativo da expressão grega.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples, sem acrescentar uma nuance temporal como “Então”.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Expressa de modo natural em português o verbo λέγω com o pronome dativo plural, sem transformar explicitamente “disse” em “respondeu”.
- source_word: Οἱ υἱοὶ
  choice: Os filhos
  rationale: Mantém a expressão masculina representativa do grego e seu sentido idiomático de pessoas caracterizadas por pertencerem a determinada era; a nota esclarece que não se limita aos homens.
- source_word: τοῦ αἰῶνος τούτου
  choice: desta era
  rationale: αἰών designa aqui a era ou ordem presente, em contraste escatológico com a era vindoura; “mundo” seria menos preciso.
- source_word: γαμοῦσιν
  choice: se casam
  rationale: É a forma corrente e natural em português para o ato de contrair casamento.
- source_word: γαμίσκονται
  choice: são dados em casamento
  rationale: Conserva a voz passiva e a distinção em relação ao verbo ativo anterior, sem apagar o idioma social refletido no texto grego.
theological_decisions:
- issue: Expressão de gênero em uma declaração de alcance representativo
  choice: Os filhos desta era
  alternative: As pessoas desta era; os que pertencem a esta era
  rationale: O grego traz o masculino plural υἱοί. A tradução conserva a forma da expressão, enquanto a nota deixa claro seu alcance representativo, sem restringi-la apenas aos homens.
- issue: αἰών como categoria escatológica
  choice: desta era
  alternative: deste mundo
  rationale: “Era” preserva o contraste entre a ordem presente e a era vindoura desenvolvido no contexto imediato; “mundo” poderia sugerir indevidamente o universo físico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem “lhes disse” é natural e concisa. A formulação preserva tanto o idioma semítico “filhos desta era” quanto o contraste entre as formas ativa e passiva dos verbos de casamento.
