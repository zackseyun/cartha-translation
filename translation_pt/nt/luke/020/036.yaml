id: LUK.20.36
reference: Luke 20:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: pt
  text: Pois já não podem morrer, porque são como os anjos[a] e são filhos de Deus[b], sendo filhos da ressurreição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “iguais aos anjos”.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “filhos de Deus” e “filhos da ressurreição”; aqui, a forma masculina expressa condição e identidade, sem limitar a afirmação apenas aos homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: já não podem morrer
  rationale: Expressa naturalmente a incapacidade indicada por δύνανται e toma ἔτι no sentido de “já não”, isto é, o fim da mortalidade, não simplesmente a impossibilidade de morrer outra vez.
- source_word: ἰσάγγελοι
  choice: como os anjos
  rationale: Comunica a ideia de semelhança ou igualdade com os anjos sem sugerir que as pessoas ressuscitadas se tornam anjos; a alternativa mais literal fica registrada em nota.
- source_word: υἱοί ... θεοῦ
  choice: filhos de Deus
  rationale: Mantém o substantivo masculino plural υἱοί e preserva a repetição retórica com “filhos da ressurreição”.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: sendo filhos da ressurreição
  rationale: Preserva a metáfora e a forma participial, sem tornar exclusivamente causal uma relação que no grego pode conservar alguma abertura semântica.
- source_word: γάρ ... γάρ
  choice: Pois ... porque
  rationale: O primeiro γάρ liga o versículo ao argumento anterior; o segundo introduz com naturalidade a explicação seguinte.
theological_decisions:
- issue: Linguagem filial em contexto escatológico
  choice: Manter “filhos de Deus” e “filhos da ressurreição” no texto principal
  alternative: “filhos e filhas de Deus” / “pessoas da ressurreição” ou “filhos de Deus” entendido de modo exclusivamente masculino
  rationale: O grego repete υἱοί, e a tradução conserva tanto a imagem de filiação quanto o paralelismo. Neste contexto, o masculino plural expressa condição e identidade compartilhadas, não inclusão apenas de homens; isso é esclarecido em nota sem neutralizar a formulação da fonte.
- issue: Natureza da comparação com os anjos
  choice: “como os anjos”
  alternative: “iguais aos anjos”
  rationale: A tradução preserva a comparação quanto à condição descrita no contexto, sem afirmar identidade ontológica entre ressuscitados e anjos. A opção mais formal permanece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Já não podem morrer” é idiomático; “sendo filhos da ressurreição” conserva deliberadamente a metáfora e a tensão formal do original.
