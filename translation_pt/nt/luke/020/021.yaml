source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: pt
  text: 'E eles lhe perguntaram: “Mestre, sabemos que falas e ensinas corretamente e que não tratas as pessoas com parcialidade[a], mas ensinas verdadeiramente o caminho de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não recebes rosto”; expressão idiomática que significa não favorecer alguém por sua aparência, posição ou prestígio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: perguntaram
  rationale: O verbo significa perguntar ou dirigir uma pergunta. “Perguntaram” é natural em português e não explicita além do texto a intenção hostil sugerida pelo contexto.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma vocativa corrente e digna para quem ensina; em português, “Mestre” comunica adequadamente o papel de instrutor.
- source_word: ὀρθῶς
  choice: corretamente
  rationale: Expressa que Jesus fala e ensina de modo certo, preservando o valor adverbial do grego em linguagem atual.
- source_word: λέγεις καὶ διδάσκεις
  choice: falas e ensinas
  rationale: Mantém os dois verbos coordenados do original sem fundi-los.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: não fazes distinção entre as pessoas
  rationale: Traduz o sentido do idioma, que nega favoritismo ou tratamento condicionado pela posição e aparência da pessoa, evitando uma reprodução literal obscura.
- source_word: ἐπ’ ἀληθείας
  choice: com verdade
  rationale: Preserva a ideia de ensinar em conformidade com a verdade e mantém a ligação natural com o verbo “ensinas”.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: o caminho de Deus
  rationale: Conserva a imagem de “caminho” e sua ressonância religiosa, sem reduzir a expressão apenas à vontade ou aos mandamentos de Deus.
theological_decisions:
- issue: Imparcialidade de Jesus
  choice: não fazes distinção entre as pessoas
  alternative: não te deixas levar pelas aparências
  rationale: O idioma grego indica que Jesus não adapta seu juízo ou ensino à condição, prestígio ou aparência de alguém. A formulação escolhida preserva o ponto ético sem restringi-lo somente à aparência externa.
- issue: Relação de ἐπ’ ἀληθείας com o ensino
  choice: ensinas com verdade o caminho de Deus
  alternative: verdadeiramente ensinas o caminho de Deus
  rationale: As duas construções são gramaticalmente possíveis e muito próximas em sentido. “Com verdade” mantém aberta a nuance entre sinceridade e conformidade com a verdade, sem impor uma interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa adequadas à fala direta dirigida a Jesus. A coordenação e o contraste do grego foram preservados, e o idioma sobre parcialidade foi traduzido pelo sentido.
