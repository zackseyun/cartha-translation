lexical_decisions:
- source_word: Ἀκούοντος
  choice: Enquanto ... ouvia
  rationale: O particípio presente em uma construção de genitivo absoluto indica uma ação simultânea que estabelece a circunstância da fala. Em português, “Enquanto ... ouvia” é natural e preserva o aspecto contínuo.
- source_word: δὲ
  choice: não traduzido separadamente
  rationale: Aqui, δέ é um conectivo narrativo leve. A sequência é expressa naturalmente em português sem acrescentar “e” ou “então”, evitando uma ligação mais marcada que a do grego.
- source_word: παντὸς τοῦ λαοῦ
  choice: todo o povo
  rationale: A expressão designa o povo em sua totalidade. “Todo o povo” mantém o sentido coletivo e é mais fiel a λαός do que “multidão”.
- source_word: εἶπεν
  choice: ele disse
  rationale: O aoristo de λέγω é vertido diretamente pela forma narrativa comum “disse”; o pronome torna o sujeito claro em português.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: “Discípulos” é o equivalente consagrado e adequado ao contexto. Não se acrescenta “seus”, pois o possessivo não está expresso no grego.
theological_decisions:
- issue: Distinção entre os públicos presentes na cena
  choice: Jesus fala diretamente aos discípulos enquanto todo o povo ouve.
  alternative: Jesus se dirige diretamente a todo o povo, ou fala em particular aos discípulos.
  rationale: O genitivo absoluto estabelece que todo o povo estava ouvindo, enquanto o dativo τοῖς μαθηταῖς identifica os destinatários diretos. A tradução preserva ambos os elementos sem confundi-los.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a concisão narrativa e distingue os ouvintes dos destinatários diretos.
