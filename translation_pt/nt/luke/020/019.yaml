reference: Luke 20:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: pt
  text: E os escribas e os chefes dos sacerdotes procuraram pôr as mãos nele naquela mesma hora[a], mas ficaram com medo do povo, pois sabiam que ele havia contado essa parábola contra eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agarrá-lo” ou “prendê-lo”; literalmente, “pôr as mãos nele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a eles” ou “a respeito deles”. O contexto indica que a parábola era dirigida contra eles.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: procuraram
  rationale: O aoristo resume a intenção e a tentativa dos líderes sem afirmar que conseguiram realizá-la.
- source_word: γραμματεῖς
  choice: escribas
  rationale: Termo tradicional e historicamente específico para esse grupo ligado à interpretação e ao ensino da Lei.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: No plural, designa a liderança sacerdotal, não vários sumos sacerdotes exercendo simultaneamente o cargo.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: pôr as mãos nele
  rationale: Preserva a imagem do idioma grego e deixa aberta a nuance exata entre agarrar, prender e exercer força hostil.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: naquela mesma hora
  rationale: Mantém a ênfase temporal e a ligação imediata com a ocasião narrada.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: ficaram com medo do povo
  rationale: Expressa naturalmente em português o receio diante da população, preservando λαός como 'povo'.
- source_word: ἔγνωσαν
  choice: sabiam
  rationale: Tradução direta do reconhecimento, por parte dos líderes, de que eram o alvo da parábola.
- source_word: πρὸς αὐτοὺς
  choice: contra eles
  rationale: O contexto da reação hostil indica que entenderam a parábola como dirigida contra eles; a nota preserva as possibilidades mais literais.
- source_word: παραβολὴν
  choice: parábola
  rationale: Equivalente estabelecido e exato no contexto dos Evangelhos Sinóticos.
theological_decisions:
- issue: Sentido de πρὸς αὐτοὺς em relação à parábola de Jesus
  choice: A parábola foi contada contra os líderes religiosos.
  alternative: A parábola foi contada a eles ou a respeito deles.
  rationale: A reação imediata mostra que se reconheceram como os alvos condenados na parábola anterior. 'Contra eles' comunica a força confrontadora do contexto, enquanto a nota registra a amplitude semântica da expressão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a imagem idiomática do grego no texto principal e registra em notas tanto as alternativas contextuais para a ação hostil quanto a ambiguidade de πρὸς αὐτούς.
