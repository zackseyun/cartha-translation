id: LUK.20.15
reference: Luke 20:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: pt
  text: E, depois de expulsá-lo da vinha, mataram-no. O que, então, o dono da vinha fará com eles?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: depois de expulsá-lo
  rationale: O particípio aoristo expressa uma ação anterior à de matar. “Expulsar” preserva a ideia de fazê-lo sair à força e soa natural em português.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: da vinha
  rationale: Com “expulsar”, a preposição “de” comunica idiomaticamente o movimento de dentro para fora; “para fora da vinha” seria possível, mas mais pesado.
- source_word: ἀπέκτειναν
  choice: mataram-no
  rationale: Traduz diretamente o sentido de matar, sem acrescentar a nuance jurídica de “executar” nem explicitar a avaliação moral de “assassinar”.
- source_word: τί οὖν
  choice: O que, então
  rationale: “Então” conserva a força inferencial de οὖν e mantém a pergunta natural em português contemporâneo.
- source_word: ποιήσει
  choice: fará
  rationale: O verbo tem sentido amplo e pergunta que ação o proprietário tomará em resposta.
- source_word: αὐτοῖς
  choice: com eles
  rationale: Em português, “o que fará com eles?” é a formulação idiomática para a ação dirigida contra ou referente aos lavradores.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: o dono da vinha
  rationale: No âmbito narrativo da parábola, κύριος designa o proprietário humano da vinha. “Dono” comunica esse sentido com clareza e naturalidade, sem transformar automaticamente o termo em título divino.
theological_decisions:
- issue: Tradução de κύριος quando o referente imediato é uma personagem humana da parábola
  choice: dono
  alternative: senhor
  rationale: Embora κύριος possa ser traduzido como “Senhor” quando funciona como título divino, aqui designa, no plano da narrativa, o proprietário da vinha. “Dono” evita induzir a leitura de um título explícito, sem negar a dimensão teológica da parábola.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação enclítica em “expulsá-lo” e “mataram-no” mantém concisão e um registro bíblico moderadamente formal sem arcaísmo.
