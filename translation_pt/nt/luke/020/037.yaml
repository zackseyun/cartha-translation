reference: Luke 20:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: pt
  text: Mas que os mortos são ressuscitados, até Moisés o mostrou no trecho sobre a sarça[a], ao dizer que o Senhor[b] é o Deus de Abraão, o Deus de Isaque e o Deus de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto à sarça”. A expressão grega pode referir-se tanto à cena da sarça como, de modo idiomático, ao trecho das Escrituras sobre a sarça ardente (Êxodo 3).'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “o Senhor”. Isso reflete o modo habitual como a Septuaginta traduz o nome divino em Êxodo 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: são ressuscitados
  rationale: Preserva a forma passiva do presente e, no contexto, expressa naturalmente a ação divina implícita de ressuscitar os mortos.
- source_word: οἱ νεκροὶ
  choice: os mortos
  rationale: Equivalente coletivo, idiomático e tradicional em português, sem expansão desnecessária.
- source_word: ἐμήνυσεν
  choice: mostrou
  rationale: Comunica de modo claro que Moisés tornou conhecida ou indicou essa verdade, sem transformar o verbo numa proclamação formal.
- source_word: ἐπὶ τῆς βάτου
  choice: no trecho sobre a sarça
  rationale: A expressão pode funcionar como referência à seção das Escrituras acerca da sarça; esta formulação deixa clara a referência literária em português moderno.
- source_word: ὡς λέγει
  choice: quando chama
  rationale: A construção seguinte atribui ao Senhor o título de Deus de Abraão, Isaque e Jacó; “quando chama” reproduz isso com naturalidade.
- source_word: κύριον
  choice: o Senhor
  rationale: Mantém o título divino expresso pelo grego κύριον, sem substituir diretamente pelo nome divino hebraico.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: o Deus de Abraão, o Deus de Isaque e o Deus de Jacó
  rationale: Conserva a repetição enfática de θεόν e a cadência da citação de Êxodo.
theological_decisions:
- issue: Linguagem da ressurreição no argumento de Jesus contra os saduceus
  choice: os mortos são ressuscitados
  alternative: os mortos ressuscitam
  rationale: A opção escolhida preserva a voz passiva grega e a ação divina implícita, sem acrescentar uma explicação doutrinária ao texto.
- issue: Tradução de κύριος numa alusão ao Deus de Israel
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριον; por isso, traduz-se o título como “o Senhor”, enquanto a relação com o nome divino em Êxodo é esclarecida em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sarça” foi mantido por ser o termo bíblico reconhecível; “no trecho sobre” esclarece a referência literária. A repetição “o Deus de...” conserva a ênfase e o ritmo do grego.
