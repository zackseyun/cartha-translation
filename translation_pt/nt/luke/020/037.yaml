  source_fidelity: A tradução transmite corretamente a ressurreição dos mortos, a referência à passagem da sarça e a tríplice designação de Deus. Contudo, ὡς λέγει é mais diretamente “quando/ao dizer”, isto é, introduz as palavras de Moisés na Escritura; “quando chama o Senhor de” é gramaticalmente possível, mas desloca levemente a formulação para um ato de nomear.
