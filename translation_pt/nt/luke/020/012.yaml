  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: pt
  text: E ele enviou um terceiro[a]; mas eles também o feriram e o expulsaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “acrescentou enviar um terceiro”, expressão idiomática que significa “enviou um terceiro” ou “prosseguiu enviando um terceiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: mandou
  rationale: A construção προστίθημι + infinitivo indica prosseguir ou repetir uma ação. Em português, “mandou” é natural, e a ideia de continuação já fica clara em “um terceiro”.
- source_word: τρίτον πέμψαι
  choice: mandou um terceiro
  rationale: O grego omite o substantivo por estar subentendido pelo contexto dos servos anteriormente enviados. “Um terceiro” preserva essa concisão sem prejudicar a clareza.
- source_word: οἱ δὲ
  choice: mas eles
  rationale: δέ introduz aqui a reação contrastante dos lavradores; “mas eles” transmite de modo natural essa mudança adversativa.
- source_word: καὶ τοῦτον
  choice: também o
  rationale: καί assinala que o terceiro enviado sofreu tratamento semelhante aos anteriores. “Também o” expressa a repetição de forma idiomática.
- source_word: τραυματίσαντες
  choice: feriram
  rationale: τραυματίζω significa causar ferimento. “Feriram” é direto, preciso e adequado ao caráter violento da ação.
- source_word: ἐξέβαλον
  choice: expulsaram
  rationale: ἐκβάλλω denota lançar ou pôr alguém para fora. “Expulsaram” é claro e natural em português e mantém explícita a remoção violenta, sem acrescentar um modo não especificado pelo texto.
