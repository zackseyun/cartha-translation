  source_fidelity: 'O sentido do grego é preservado: o proprietário procede ao envio de um terceiro emissário, e os lavradores também o ferem e o põem para fora. Contudo, “mandou um terceiro” pode ser entendido em português como ordenar que uma terceira pessoa faça algo; “enviou um terceiro” expressa sem ambiguidade o envio implícito no verbo πέμψαι.'
  naturalness: A frase é concisa e natural após a substituição de “mandou” por “enviou”. “Também o feriram e o expulsaram” reproduz bem a força aditiva de καὶ τοῦτον e a sequência de particípio seguido de verbo finito.
  terminology: “Feriram” corresponde precisamente a τραυματίσαντες. “Expulsaram” é uma tradução moderna e adequada de ἐξέβαλον, sem especificar indevidamente o modo da remoção. A elipse em “um terceiro” é justificável pelo contexto imediatamente anterior.
