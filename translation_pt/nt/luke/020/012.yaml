- from: E ele mandou um terceiro[a]; mas eles também o feriram e o expulsaram.
  to: E ele enviou um terceiro[a]; mas eles também o feriram e o expulsaram.
  rationale: A revisão troca apenas “mandou” por “enviou”, para representar πέμψαι com maior clareza em português e evitar uma leitura possível, mas indesejada, de ordem dada a uma terceira pessoa. A nota foi ajustada para refletir a mesma opção sem alterar seu valor explicativo.
