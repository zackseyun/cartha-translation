id: LUK.20.44
reference: Luke 20:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: pt
  text: Portanto, Davi o chama de Senhor. Como, então, ele é filho de Davi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendente de Davi”. O grego diz literalmente “filho dele”; nesse contexto, “filho” pode ter o sentido dinástico de descendente, mas o texto principal preserva o termo explícito usado no argumento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência que decorre da citação e do argumento anteriores.
- source_word: αὐτὸν κύριον
  choice: o chama de Senhor
  rationale: Reproduz naturalmente a construção grega e mantém κύριος como “Senhor”, título de honra e superioridade relevante ao argumento messiânico.
- source_word: καλεῖ
  choice: chama
  rationale: O presente simples corresponde diretamente ao verbo grego e soa natural em português.
- source_word: καὶ πῶς
  choice: Como, então
  rationale: Introduz com naturalidade a pergunta retórica e torna clara sua ligação lógica com a primeira oração, sem acrescentar uma solução ao argumento.
- source_word: αὐτοῦ υἱός
  choice: filho de Davi
  rationale: Mantém o termo explícito “filho” e explicita o referente do pronome grego, evitando a ambiguidade potencial de “seu filho” em português.
- source_word: ἐστιν
  choice: é
  rationale: Corresponde de modo direto ao presente do verbo εἰμί, sem inserir a ideia modal de “pode ser”.
theological_decisions:
- issue: Tradução de κύριος no argumento messiânico e cristológico
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o valor lexical, a dignidade do título e o peso do contraste entre a condição de Senhor e a de filho, sem definir além do que o texto afirma.
- issue: Se υἱός deve ser ampliado para indicar descendência dinástica
  choice: filho de Davi
  alternative: descendente de Davi
  rationale: O grego emprega explicitamente “filho”, termo do qual depende a tensão retórica. A tradução principal conserva essa formulação, enquanto a possível força genealógica ou dinástica é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Davi” evita a ambiguidade referencial que “seu filho” poderia criar. A pergunta mantém o verbo simples “é”, em vez de acrescentar o modal interpretativo “pode ser”.
