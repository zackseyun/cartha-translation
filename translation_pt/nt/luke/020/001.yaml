id: LUK.20.1
reference: Luke 20:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: pt
  text: E aconteceu que, num daqueles dias, enquanto ele ensinava o povo no templo[a] e anunciava as boas-novas[b], os chefes dos sacerdotes e os escribas, junto com os anciãos, aproximaram-se dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego refere-se ao complexo do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: Ou «pregava o evangelho».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a transição narrativa característica de Lucas sem recorrer à fórmula arcaica «e sucedeu que».
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: num daqueles dias
  rationale: Expressa de modo natural o dia não especificado dentro da sequência narrativa e mantém o sentido partitivo.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: enquanto ele ensinava o povo
  rationale: Traduz o genitivo absoluto como ação simultânea e conserva λαός como «o povo», sem reduzi-lo a uma multidão ocasional.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: É a forma corrente em português; uma nota esclarece que ἱερόν designa o complexo do templo, e não apenas o santuário interior.
- source_word: εὐαγγελιζομένου
  choice: anunciava as boas-novas
  rationale: Mantém o sentido verbal de comunicar boas notícias em linguagem acessível e evita tornar o verbo desnecessariamente técnico ou eclesiástico.
- source_word: ἐπέστησαν
  choice: aproximaram-se dele
  rationale: Comunica a chegada direta do grupo até Jesus sem acrescentar uma hostilidade explícita que o verbo, por si só, não exige.
- source_word: ἀρχιερεῖς
  choice: os chefes dos sacerdotes
  rationale: Identifica a liderança sacerdotal no plural, sem sugerir que houvesse vários sumos sacerdotes simultaneamente no sentido estrito do cargo.
- source_word: γραμματεῖς
  choice: os escribas
  rationale: Preserva a designação histórica direta do grupo.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: junto com os anciãos
  rationale: Representa explicitamente a ideia de acompanhamento expressa por σύν.
theological_decisions:
- issue: Tradução de εὐαγγελιζομένου no relato do ministério público de Jesus
  choice: anunciava as boas-novas
  alternative: pregava o evangelho
  rationale: A escolha conserva o conteúdo semântico do verbo e evita impor ao contexto narrativo uma formulação eclesiástica posterior; a alternativa tradicional permanece registrada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a transição narrativa lucana e organiza as ações simultâneas de maneira natural. Os marcadores foram vinculados aos termos que efetivamente explicam: «templo» e «boas-novas».'
