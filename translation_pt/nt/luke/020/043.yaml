  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: pt
  text: até que eu faça dos seus inimigos um estrado para os seus pés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “até que eu ponha os seus inimigos como estrado dos seus pés”.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἕως ἂν
  choice: até que
  rationale: A combinação introduz o limite futuro da ação e corresponde naturalmente a “até que” em português.
- source_word: θῶ
  choice: ponha
  rationale: O verbo τίθημι significa “pôr/colocar”. “Ponha ... como estrado” conserva essa força e soa natural no contexto da citação.
- source_word: τοὺς ἐχθρούς σου
  choice: os seus inimigos
  rationale: Reproduz diretamente o objeto acusativo e o possessivo, sem atenuar a hostilidade expressa.
- source_word: ὑποπόδιον
  choice: estrado
  rationale: Designa um apoio ou banquinho para os pés. “Estrado” mantém de modo claro e digno a imagem régia tradicional.
- source_word: τῶν ποδῶν σου
  choice: para os seus pés
  rationale: Embora literalmente seja “dos seus pés”, a construção portuguesa idiomática com “estrado” é “para os seus pés” e preserva a metáfora.
theological_decisions:
- issue: Imagem de subjugação na citação do Salmo 110.1
  choice: Manter a metáfora de pôr os inimigos como estrado para os pés.
  alternative: até que eu ponha os seus inimigos debaixo dos seus pés
  rationale: A formulação conserva a imagem régia e messiânica da citação sem explicá-la como derrota ou domínio total, preservando sua força cristológica e sua tensão própria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do grego foram preservadas sem rigidez excessiva; “estrado para os seus pés” é idiomático, enquanto a nota registra a relação genitiva literal.
