review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: a vigilância hostil, o envio de espiões, a falsa aparência de justiça, a intenção de obter uma declaração incriminadora e a entrega ao poder oficial do governador. Contudo, «domínio» não é a opção mais precisa nem mais idiomática neste contexto para ἀρχή; «poder» preserva melhor o poder governante em paralelo com «autoridade».'
  naturalness: «Apanhá-lo em alguma palavra» soa pouco natural em português moderno e pode sugerir uma apreensão física ou uma formulação pouco clara. «Apanhá-lo em alguma coisa que dissesse» comunica de modo claro a armadilha baseada em sua fala, sem perder o sentido forense da expressão grega.
  terminology: «Espiões», «justos», «entregá-lo» e «governador» são escolhas adequadas. A coordenação «poder e autoridade» mantém a dupla ἀρχή/ἐξουσία sem impor uma distinção técnica excessiva ou empregar o menos apropriado «domínio».
  issues:
