    issue: «ao domínio e à autoridade do governador» para τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος
    rationale: «Domínio» tende a designar território, posse ou soberania em sentido abstrato. Neste contexto de entrega a autoridades públicas, «poder e autoridade do governador» é mais natural e representa melhor o par grego.
  - severity: low
    issue: «a fim de apanhá-lo em alguma palavra»
    rationale: A formulação é pouco idiomática e não deixa imediatamente claro que a armadilha seria baseada em algo que Jesus dissesse. Uma explicitação moderada preserva o sentido sem acrescentar conteúdo.
