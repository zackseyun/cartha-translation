reference: Luke 20:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: pt
  text: E, depois de o vigiarem atentamente, enviaram espiões que fingiam ser justos, a fim de apanhá-lo em alguma coisa que dissesse[a] e, assim, entregá-lo ao poder e à autoridade do governador.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “agarrá-lo por uma palavra” ou “apoderar-se de uma palavra dele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entregá-lo à jurisdição e à autoridade do governador”. Os dois termos associados provavelmente enfatizam a esfera oficial de governo e o poder do governador.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: depois de o vigiarem atentamente
  rationale: O particípio aoristo indica ação anterior ao verbo principal, e a expressão comunica a vigilância cuidadosa e hostil presente no contexto.
- source_word: ἐγκαθέτους
  choice: espiões
  rationale: O termo designa pessoas introduzidas secretamente para preparar uma armadilha; “espiões” é claro e natural em português.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: que fingiam ser justos
  rationale: Preserva a apresentação enganosa e o sentido moral-religioso de δίκαιος sem tornar a frase artificial.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: a fim de apanhá-lo em alguma palavra
  rationale: Expressa a intenção de incriminá-lo com base no que dissesse, ao mesmo tempo que retém a imagem verbal do grego.
- source_word: ὥστε
  choice: e, assim
  rationale: Indica a consequência pretendida da armadilha de modo idiomático.
- source_word: παραδοῦναι
  choice: entregá-lo
  rationale: É a formulação corrente para transferir alguém às mãos de uma autoridade em contexto hostil ou judicial.
- source_word: τῇ ἀρχῇ
  choice: ao domínio
  rationale: Distingue ἀρχή de ἐξουσία e comunica o poder governante ou a esfera oficial de governo.
- source_word: τῇ ἐξουσίᾳ
  choice: à autoridade
  rationale: Comunica o direito ou poder oficial de agir, preservando o segundo elemento do par.
- source_word: τοῦ ἡγεμόνος
  choice: do governador
  rationale: Equivalente acessível e historicamente apropriado para a autoridade provincial romana.
theological_decisions:
- issue: Sentido de δίκαιος na descrição da identidade fingida
  choice: justos
  alternative: íntegros; honestos
  rationale: “Justos” preserva o peso moral e religioso do adjetivo e não o reduz à mera honestidade social.
- issue: Relação entre ἀρχή e ἐξουσία
  choice: domínio e autoridade
  alternative: jurisdição e autoridade; poder e autoridade
  rationale: Mantém os dois termos coordenados sem fundi-los, preservando a possível ênfase na esfera de governo e no poder oficial do governador.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “depois de o vigiarem” segue a norma formal sem soar arcaica; “apanhá-lo” conserva a metáfora de armadilha, e as notas registram alternativas mais literais e jurídicas.
