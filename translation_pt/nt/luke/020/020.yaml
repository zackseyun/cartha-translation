  to: E, depois de o vigiarem atentamente, enviaram espiões que fingiam ser justos, a fim de apanhá-lo em alguma coisa que dissesse[a] e, assim, entregá-lo ao poder e à autoridade do governador.[b]
  rationale: A revisão substitui duas construções menos naturais ou menos precisas. «Em alguma coisa que dissesse» torna explícita a força de ἐπιλάβωνται αὐτοῦ λόγου como tentativa de incriminá-lo por sua fala; «poder e autoridade» representa de modo mais adequado e fluente o par ἀρχή e ἐξουσία. As notas mantêm as alternativas literal e jurídica, com os marcadores posicionados junto aos trechos a que se referem.
