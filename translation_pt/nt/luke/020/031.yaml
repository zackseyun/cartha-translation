  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: pt
  text: E o terceiro tomou-a por esposa; do mesmo modo, também os sete não deixaram filhos e morreram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: o terceiro
  rationale: Preserva a elipse do grego, pois o contexto já identifica os irmãos, e soa natural em português.
- source_word: ἔλαβεν αὐτήν
  choice: a tomou por esposa
  rationale: Explicita com naturalidade o sentido idiomático de λαμβάνω neste contexto de casamento por levirato, sem a possível ambiguidade moderna de simplesmente 'a tomou'.
- source_word: ὡσαύτως δὲ καὶ
  choice: do mesmo modo
  rationale: Expressa de forma clara e concisa a continuidade e a semelhança indicadas pela combinação de partículas.
- source_word: οἱ ἑπτὰ
  choice: os sete
  rationale: Segue de perto a forma grega e, no contexto, designa naturalmente o conjunto completo dos sete irmãos.
- source_word: οὐ κατέλιπον τέκνα
  choice: não deixaram filhos
  rationale: Conserva a relação entre a ausência de descendência sobrevivente e a morte, presente no verbo καταλείπω.
- source_word: ἀπέθανον
  choice: morreram
  rationale: Tradução direta e sóbria do verbo grego, sem eufemismo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão 'tomou por esposa' comunica o idioma matrimonial do grego diretamente no texto, dispensando nota lexical.
