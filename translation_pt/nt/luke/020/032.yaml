lexical_decisions:
- source_word: ὕστερον
  choice: Depois
  rationale: O advérbio indica um momento posterior na sequência narrativa. “Depois” é natural em português e não especifica mais do que o grego.
- source_word: καὶ
  choice: também
  rationale: Neste contexto, καί assinala que a mulher, assim como os irmãos mencionados antes, morreu; “também” expressa essa função com clareza.
- source_word: ἡ γυνή
  choice: a mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. Como ela esteve sucessivamente casada com vários irmãos, “a mulher” identifica a personagem sem sugerir uma única relação conjugal específica.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo relata diretamente a morte como acontecimento passado. “Morreu” preserva a formulação simples e direta do grego.
