  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: pt
  text: O batismo de João vinha do céu ou dos seres humanos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de Deus”; literalmente, “do céu”, modo reverente de indicar origem ou autoridade divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ βάπτισμα
  choice: O batismo
  rationale: O substantivo designa o rito ou a prática ligada a João; “batismo” é o equivalente corrente e preciso em português.
- source_word: Ἰωάννου
  choice: de João
  rationale: O genitivo indica o batismo associado a João e é expresso naturalmente em português pela construção “de João”.
- source_word: ἐξ οὐρανοῦ
  choice: vinha do céu
  rationale: Preserva a formulação grega e o reverente modo judaico de indicar origem ou autoridade divina; “vinha” torna explícita em português a ideia de procedência expressa por ἐξ.
- source_word: ἦν
  choice: vinha
  rationale: Embora seja literalmente a cópula “era”, com expressões de origem a pergunta significa naturalmente “vinha/procedia”; esta forma evita em português a construção menos idiomática “era do céu”.
- source_word: ἢ
  choice: ou
  rationale: Mantém a alternativa direta entre as duas possíveis origens.
- source_word: ἐξ ἀνθρώπων
  choice: dos seres humanos
  rationale: O plural ἀνθρώπων é genérico, não especificamente masculino; “seres humanos” comunica com precisão a oposição entre origem divina e origem meramente humana.
theological_decisions:
- issue: Sentido de “do céu” quanto ao batismo de João
  choice: Manter “do céu” no texto principal.
  alternative: “de Deus”
  rationale: A expressão aponta para origem ou autoridade divina, mas o grego diz literalmente “do céu”. Preservar o idioma evita explicitar além do texto e mantém sua formulação reverente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta é direta; “vinha” comunica de modo idiomático a procedência, enquanto “seres humanos” preserva o sentido genérico de ἀνθρώπων.
