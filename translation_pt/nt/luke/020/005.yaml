id: LUK.20.5
reference: Luke 20:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: pt
  text: 'Mas eles ponderaram entre si: “Se dissermos: ‘Do céu’, ele dirá: ‘Por que vocês não acreditaram nele[a]?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não confiaram nele”.'
    reason: 'Alternativa lexical: πιστεύω com o dativo pode significar acreditar em alguém ou confiar nessa pessoa.'
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: ponderaram entre si
  rationale: Expressa a deliberação calculada do grupo de modo natural em português, preservando tanto o aspecto reflexivo de συλλογίζομαι quanto a ideia de consulta interna indicada por πρὸς ἑαυτούς.
- source_word: λέγοντες
  choice: ':'
  rationale: O dois-pontos introduz naturalmente, em português narrativo, o conteúdo da deliberação expresso pelo particípio grego, sem a formulação mais pesada “dizendo”.
- source_word: Ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: Reproduz de modo idiomático e preciso a condição eventual do grego.
- source_word: Ἐξ οὐρανοῦ
  choice: Do céu
  rationale: Mantém a expressão grega e sua referência implícita à origem ou autorização divina, sem explicitar interpretativamente “de Deus”.
- source_word: ἐρεῖ
  choice: ele dirá
  rationale: Conserva o sentido básico de λέγω; a fala citada assume naturalmente a forma de pergunta.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: vocês não acreditaram nele
  rationale: πιστεύω com dativo pode indicar acreditar em alguém ou confiar nessa pessoa. “Acreditaram nele” é claro e atual, além de se ajustar ao contexto da aceitação do testemunho de João.
theological_decisions:
- issue: Sentido da resposta implícita “Do céu”
  choice: Manter “Do céu”
  alternative: “De Deus”
  rationale: A expressão aponta para autoridade divina, mas o texto usa literalmente “céu”. Preservá-la mantém a forma reverencial e evita tornar explícito o que permanece implícito no grego.
- issue: Força de πιστεύω em relação a João
  choice: “acreditaram nele”
  alternative: “confiaram nele”
  rationale: O contexto envolve dar crédito à mensagem ou ao testemunho de João. A tradução principal preserva a amplitude do verbo, enquanto a nota registra a nuance legítima de confiança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ponderaram entre si” evita tanto a rigidez de “raciocinaram entre si” quanto a possível redução de συνελογίσαντο a mera conversa em “discutiram”.
