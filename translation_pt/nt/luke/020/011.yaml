revisions:
- from: E ele continuou, enviando outro escravo; mas eles também espancaram e humilharam esse[a], e o mandaram embora de mãos vazias.
  to: E ele mandou ainda outro escravo; mas eles também espancaram e humilharam aquele escravo e o mandaram embora de mãos vazias.
  rationale: A revisão substitui uma construção gerundiva pouco natural por «mandou ainda outro», que expressa o avanço narrativo de προσέθετο e o caráter adicional de ἕτερον. Também torna a referência a κἀκεῖνον mais fluente em português, sem alterar o sentido nem introduzir interpretação adicional.
