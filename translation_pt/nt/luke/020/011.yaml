source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another slave; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: pt
  text: E ele mandou ainda outro escravo; mas eles também espancaram e humilharam aquele escravo e o mandaram embora de mãos vazias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθετο ... πέμψαι
  choice: continuou, enviando
  rationale: A construção idiomática indica que ele prosseguiu com a ação de enviar; esta formulação é natural em português e mantém o avanço narrativo.
- source_word: ἕτερον
  choice: outro
  rationale: Identifica um escravo adicional, distinto do primeiro.
- source_word: δοῦλον
  choice: escravo
  rationale: Preserva a condição de sujeição e propriedade implicada por δοῦλος no contexto da parábola; a alternativa lexical é indicada em nota.
- source_word: κἀκεῖνον
  choice: também ... esse
  rationale: Mantém tanto a ideia aditiva de καί quanto a referência enfática àquele segundo escravo.
- source_word: δείραντες
  choice: espancaram
  rationale: Expressa uma agressão física reiterada ou severa sem especificar indevidamente o instrumento ou a forma do castigo.
- source_word: ἀτιμάσαντες
  choice: humilharam
  rationale: Comunica o tratamento desonroso e vergonhoso em português corrente, preservando a dimensão pública de afronta.
- source_word: ἐξαπέστειλαν κενόν
  choice: mandaram embora de mãos vazias
  rationale: Reproduz naturalmente a ideia de expulsá-lo ou despedi-lo sem o fruto esperado.
theological_decisions:
- issue: Tradução de δοῦλος na parábola
  choice: escravo
  alternative: servo
  rationale: A relação de sujeição ao proprietário é relevante na cena, e “escravo” preserva com maior precisão essa realidade social sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Continuou, enviando” evita o literalismo pouco idiomático de “acrescentou enviar”; “de mãos vazias” comunica com clareza o uso predicativo de κενόν.
