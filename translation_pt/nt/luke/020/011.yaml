review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está preservado: o proprietário envia um escravo adicional; os lavradores o espancam, o tratam desonrosamente e o mandam embora sem nada. Contudo, «continuou, enviando» é uma reprodução pouco natural da construção προσέθετο + infinitivo e pode sugerir meio ou simultaneidade, não a ação narrativa subsequente. «Mandou ainda outro escravo» expressa com clareza o valor de continuidade/adição.'
  naturalness: «Mas eles também espancaram e humilharam esse» soa truncado em português, especialmente porque «esse» fica substantivado e separado de «escravo». A redação revista mantém o paralelismo do grego e torna explícito o objeto pronominal em «mandaram-no embora».
  terminology: «Escravo» é uma opção defensável e fiel para δοῦλος neste contexto parabólico; a nota oferece «servo» como alternativa. «Humilhar» comunica adequadamente ἀτιμάζω, e «de mãos vazias» traduz naturalmente κενόν.
  issues:
  - severity: medium
    issue: Construção «continuou, enviando»
    rationale: Embora compreensível, a locução com gerúndio não é a forma mais idiomática de verter προσέθετο πέμψαι e pode enfraquecer a noção de que ele passou a enviar mais um escravo.
  - severity: low
    issue: Uso substantivado de «esse»
    rationale: «Humilharam esse» é gramaticalmente possível, mas pouco fluente no registro bíblico moderno. «Aquele escravo» preserva a referência enfática de κἀκεῖνον com maior clareza.
  revised_text: E ele mandou ainda outro escravo; mas eles também espancaram e humilharam aquele escravo e o mandaram embora de mãos vazias.
  revised_footnotes:
