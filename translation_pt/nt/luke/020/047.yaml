source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: pt
  text: os quais devoram as casas das viúvas e, como pretexto, fazem longas orações. Estes receberão juízo mais severo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “condenação maior”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: devoram
  rationale: Preserva a imagem vívida e acusatória do verbo grego, empregado metaforicamente para exploração voraz.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: as casas das viúvas
  rationale: Mantém a formulação concreta do grego; no contexto, 'casas' pode representar os bens ou o patrimônio das viúvas sem explicitar essa metonímia no texto.
- source_word: προφάσει
  choice: como pretexto
  rationale: Expressa a oração usada como cobertura ou justificativa aparente para a conduta exploradora, preservando a força de falsidade do termo.
- source_word: μακρὰ προσεύχονται
  choice: fazem longas orações
  rationale: Formulação natural em português que comunica a duração prolongada das orações.
- source_word: λήμψονται
  choice: receberão
  rationale: Equivalente direto e solene do futuro de λαμβάνω neste contexto judicial.
- source_word: περισσότερον κρίμα
  choice: juízo mais severo
  rationale: Comunica naturalmente o caráter comparativo da sentença, mantendo κρίμα como 'juízo' em vez de restringi-lo lexicalmente a 'condenação'.
theological_decisions:
- issue: Natureza de κρίμα no contexto
  choice: juízo mais severo
  alternative: condenação maior
  rationale: O contexto indica um juízo divino adverso, mas 'juízo' preserva melhor a amplitude lexical de κρίμα; 'mais severo' torna explícita em português a comparação expressa por περισσότερον.
- issue: Relação de προφάσει com as orações
  choice: como pretexto
  alternative: para manter as aparências
  rationale: A expressão pode indicar tanto uma falsa aparência quanto um pretexto. 'Como pretexto' conserva a ideia de que as longas orações servem de cobertura, sem definir além do necessário a motivação exata.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abertura relativa, “os quais”, preserva a continuidade sintática com o versículo anterior. A imagem concreta de devorar as casas foi mantida, e a nota registra a principal alternativa para κρίμα.
