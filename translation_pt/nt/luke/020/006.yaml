  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: pt
  text: 'Mas, se dissermos: ‘Dos homens’, todo o povo nos apedrejará, pois está convencido de que João era profeta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de que João é profeta”. O infinitivo grego não especifica por si só o tempo; o contexto permite as duas formas em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Mas, se dissermos
  rationale: A construção ἐὰν com o subjuntivo aoristo apresenta uma possibilidade condicional; “mas” conserva a força adversativa de δέ no contexto.
- source_word: Ἐξ ἀνθρώπων
  choice: Dos homens
  rationale: Mantém de modo conciso a expressão elíptica que retoma a origem do batismo ou da autoridade de João. Em português bíblico corrente, “dos homens” preserva o paralelo com “do céu” sem explicitar além do grego.
- source_word: ὁ λαὸς ἅπας
  choice: todo o povo
  rationale: Reproduz naturalmente o sentido coletivo de λαός e a abrangência enfática de ἅπας.
- source_word: καταλιθάσει ἡμᾶς
  choice: nos apedrejará
  rationale: Expressa diretamente o futuro do verbo “apedrejar”, sem acrescentar “até a morte”, ideia não explicitada no texto.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: pois está convencido
  rationale: O particípio e o verbo estão no singular, concordando com o coletivo “todo o povo”; o singular também é natural em português.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: de que João era profeta
  rationale: A oração de acusativo com infinitivo é vertida naturalmente por uma oração finita. “Era” se ajusta ao quadro narrativo, enquanto o infinitivo grego não determina por si só o tempo relativo.
theological_decisions:
- issue: Tempo verbal na avaliação popular de João
  choice: de que João era profeta
  alternative: de que João é profeta
  rationale: O infinitivo εἶναι não especifica por si mesmo o tempo. “Era” é natural em português no relato e não nega a condição profética de João; a alternativa no presente é mantida em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva a elipse “Dos homens” em correspondência com o contraste contextual “do céu” e mantém a ambiguidade temporal do infinitivo por meio de nota.
