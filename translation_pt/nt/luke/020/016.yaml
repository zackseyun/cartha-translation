id: LUK.20.16
reference: Luke 20:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: pt
  text: 'Ele virá, destruirá esses lavradores arrendatários[a] e dará a vinha a outros”. Ao ouvirem isso, eles disseram: “Que isso nunca aconteça!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lavradores” ou “arrendatários”; o termo grego se refere a pessoas que cultivavam terras pertencentes a outra pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “De modo nenhum!” ou “Certamente não!” A expressão grega comunica forte rejeição; literalmente, “Que não aconteça”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Ele virá
  rationale: Mantém o futuro simples de ἔρχομαι sem acrescentar a ideia interpretativa de retorno.
- source_word: ἀπολέσει
  choice: destruirá
  rationale: Preserva a severidade e a amplitude semântica de ἀπόλλυμι, que no contexto pode envolver morte e ruína.
- source_word: γεωργοὺς
  choice: lavradores arrendatários
  rationale: Explicita que eles cultivavam uma vinha pertencente a outro, sem reduzi-los a simples trabalhadores agrícolas.
- source_word: τούτους
  choice: esses
  rationale: Conserva a referência demonstrativa aos lavradores específicos da parábola.
- source_word: δώσει
  choice: dará
  rationale: Reproduz de modo direto o sentido comum de δίδωμι, sem explicitar além do texto a natureza da transferência.
- source_word: τὸν ἀμπελῶνα
  choice: a vinha
  rationale: É a designação portuguesa natural para a área plantada de videiras e preserva a imagem bíblica.
- source_word: ἄλλοις
  choice: a outros
  rationale: Mantém indefinidos os novos destinatários, como no grego.
- source_word: ἀκούσαντες
  choice: Ao ouvirem isso
  rationale: Expressa naturalmente em português a relação temporal do particípio aoristo.
- source_word: Μὴ γένοιτο
  choice: Que isso nunca aconteça!
  rationale: Comunica a forma volitiva e a forte rejeição emocional da expressão grega.
theological_decisions:
- issue: Força da reação Μὴ γένοιτο
  choice: Que isso nunca aconteça!
  alternative: De modo nenhum! / Certamente não!
  rationale: A tradução preserva a reação horrorizada em forma de desejo, em vez de convertê-la numa simples negação lógica.
- issue: Identidade dos “outros”
  choice: Permanece não especificada
  alternative: Explicitar um grupo teológico ou histórico
  rationale: O versículo não identifica diretamente os destinatários; a tradução evita resolver no texto uma questão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lavradores arrendatários” esclarece a relação social da parábola; a exclamação final mantém a intensidade e a forma volitiva do grego.
