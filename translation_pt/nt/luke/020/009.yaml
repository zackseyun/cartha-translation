reference: Luke 20:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: pt
  text: 'Então ele começou a contar ao povo esta parábola: “Um homem plantou uma vinha, arrendou-a a lavradores e ausentou-se por bastante tempo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “viajou para longe por bastante tempo”. O verbo pode indicar que alguém deixou sua região de origem, até mesmo para ir ao exterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Então ele começou
  rationale: δέ marca a progressão da narrativa, e ἤρξατο introduz o início do ato de falar. A formulação é natural em português e mantém a referência explícita a Jesus pelo pronome.
- source_word: πρὸς τὸν λαὸν
  choice: ao povo
  rationale: πρός com o acusativo indica os destinatários da fala; “povo” preserva o sentido coletivo de λαός sem especificá-lo como mera multidão.
- source_word: λέγειν τὴν παραβολὴν ταύτην
  choice: a contar ao povo esta parábola
  rationale: Embora λέγειν possa significar “dizer” ou “falar”, “contar uma parábola” é a expressão idiomática em português. “Parábola” preserva o gênero literário e as ressonâncias do termo nos Evangelhos.
- source_word: Ἄνθρωπος
  choice: Um homem
  rationale: O substantivo masculino singular apresenta uma figura masculina específica na narrativa; “um homem” representa isso com precisão.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: plantou uma vinha
  rationale: Tradução direta e corrente da ação de plantar e do substantivo que designa uma plantação de videiras.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: arrendou-a a lavradores
  rationale: ἐκδίδωμι, neste contexto, indica ceder uma propriedade mediante arrendamento. “Lavradores” traduz os cultivadores, enquanto “arrendou” deixa clara a relação de posse e exploração.
- source_word: ἀπεδήμησεν
  choice: ausentou-se
  rationale: O verbo indica partir e permanecer longe do lugar de residência, por vezes em outra região ou país. “Ausentou-se” preserva o sentido básico sem tornar explícito um destino que o texto não informa.
- source_word: χρόνους ἱκανούς
  choice: por bastante tempo
  rationale: A expressão plural indica uma duração substancial. “Por bastante tempo” é clara, natural e conserva essa extensão sem precisão indevida.
theological_decisions:
- issue: Gênero do personagem introduzido por Ἄνθρωπος
  choice: Um homem
  alternative: Uma pessoa
  rationale: A forma masculina singular apresenta um personagem masculino, tradicionalmente entendido dentro da parábola como proprietário da vinha. A tradução mantém o dado gramatical e narrativo sem neutralizá-lo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vinha”, “parábola”, “arrendou” e “lavradores” conservam o cenário agrícola e o registro bíblico sem arcaísmo excessivo. A colocação do marcador após a expressão completa relaciona corretamente a nota tanto à partida quanto à duração.
