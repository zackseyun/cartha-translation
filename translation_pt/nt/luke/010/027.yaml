reference: Luke 10:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: pt
  text: 'Ele respondeu: “Você amará o Senhor, seu Deus, de todo o seu coração[a], com toda a sua alma, com toda a sua força e com toda a sua mente, e o seu próximo como a si mesmo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muitas traduções dizem “com todo o seu coração”. O grego usa aqui “de todo o seu coração” (ἐξ ὅλης τῆς καρδίας), enquanto as três expressões seguintes empregam uma preposição que pode ser traduzida por “com” (ἐν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ele respondeu
  rationale: Expressão narrativa idiomática em português para o particípio seguido do verbo finito, sem perda de sentido.
- source_word: Ἀγαπήσεις
  choice: Você amará
  rationale: O futuro do indicativo expressa aqui um mandamento em citação das Escrituras; o futuro preserva sua forma e ressonância melhor que uma paráfrase modal ou um imperativo.
- source_word: κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: “Senhor” preserva o título divino no contexto da citação, e “seu Deus” verte diretamente a relação expressa no grego.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: de todo o seu coração
  rationale: “De” preserva a distinção de ἐξ em relação ao ἐν das expressões seguintes e é idiomático em português.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: com toda a sua alma
  rationale: “Alma” mantém o termo tradicional e lexical sem impor uma antropologia técnica; “com” é natural para o valor instrumental ou modal de ἐν neste contexto.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: com toda a sua força
  rationale: “Força” é equivalente direto, claro e atual de ἰσχύς.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: com toda a sua mente
  rationale: “Mente” comunica de modo direto a faculdade de pensar e compreender indicada por διάνοια.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: o seu próximo como a si mesmo
  rationale: Formulação portuguesa consagrada e exata, preservando tanto a categoria relacional de πλησίον quanto a comparação de ὡς.
theological_decisions:
- issue: Título divino κύριος na citação do mandamento
  choice: Senhor
  alternative: Mestre
  rationale: Neste contexto, κύριος se refere ao Deus de Israel; “Senhor” preserva o peso teológico e a ressonância bíblica do título.
- issue: Relação entre coração, alma, força e mente
  choice: Manter os quatro termos distintos
  alternative: Resumi-los como “todo o seu ser”
  rationale: A enumeração sobrepõe aspectos da pessoa para expressar devoção total. Manter cada termo preserva a retórica sem impor divisões antropológicas rígidas nem achatar o texto.
- issue: Forma verbal de Ἀγαπήσεις
  choice: Você amará
  alternative: Ame / Você deve amar
  rationale: O futuro preserva a forma do mandamento citado e permite que sua força normativa seja percebida sem ser explicitada por uma modalidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” por clareza contemporânea e mantém a solenidade da citação. O ponto e vírgula separa os dois mandamentos coordenados sem desfazer sua unidade.
