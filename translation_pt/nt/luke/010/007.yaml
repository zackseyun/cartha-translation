id: LUK.10.7
reference: Luke 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: pt
  text: Permaneçam naquela mesma casa, comendo e bebendo o que eles lhes oferecerem, pois o trabalhador é digno do seu salário.[a] Não fiquem mudando de casa em casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do salário que lhe é devido”.'
    reason: Alternativa lexical que explicita a ideia de remuneração devida, possível no contexto de ἄξιος e μισθός.
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε
  choice: Permaneçam naquela mesma casa
  rationale: “Naquela mesma casa” retoma a casa que os recebeu e ressalta a permanência em um só lugar. “Permaneçam” expressa naturalmente o imperativo presente, com sentido continuativo.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: comendo e bebendo o que eles lhes oferecerem
  rationale: Os particípios indicam atividade simultânea à permanência. A expressão idiomática τὰ παρ’ αὐτῶν refere-se ao que os anfitriões disponibilizam; “oferecerem” é claro sem acrescentar elementos de passagens paralelas.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: pois o trabalhador é digno do seu salário
  rationale: “Trabalhador” traduz ἐργάτης em linguagem corrente, e “salário” preserva o sentido econômico de μισθός como compensação pelo trabalho. “Seu” mantém a construção singular do grego.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Não fiquem mudando de casa em casa
  rationale: A formulação comunica a proibição de trocar repetidamente de hospedagem. “Não fiquem mudando” reproduz bem o valor do imperativo presente negativo em português natural.
theological_decisions:
- issue: Referência masculina singular em τοῦ μισθοῦ αὐτοῦ
  choice: do seu salário
  alternative: do salário que lhe é devido
  rationale: O grego apresenta “o trabalhador” no masculino singular e associa a ele o pronome singular. A tradução mantém essa forma sem neutralizá-la; o sentido proverbial continua genericamente aplicável.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Permaneçam” evita coloquialismo excessivo, enquanto “não fiquem mudando” soa natural e preserva o aspecto continuativo. O pronome “eles” identifica naturalmente os moradores da casa, e “lhes” deixa claros os destinatários plurais.
