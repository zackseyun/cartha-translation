  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: pt
  text: Qual destes três lhe parece ter-se tornado próximo daquele que caiu nas mãos dos assaltantes?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Qual destes três lhe parece ter sido o próximo daquele que caiu nas mãos dos assaltantes?» O grego diz literalmente «lhe parece ter-se tornado próximo», destacando o ato de tornar-se próximo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Qual
  rationale: Introduz uma escolha dentro de um grupo definido, «destes três»; «qual» é idiomático e preciso em português.
- source_word: τούτων τῶν τριῶν
  choice: destes três
  rationale: Reproduz diretamente o genitivo partitivo sem acrescentar «homens», ausente do grego.
- source_word: πλησίον
  choice: próximo
  rationale: Aqui funciona substantivamente ou de modo predicativo no sentido de «próximo». A formulação «tornar-se próximo de» preserva a ligação verbal com γεγονέναι e o vocabulário da pergunta anterior.
- source_word: δοκεῖ σοι
  choice: na sua opinião
  rationale: Expressa de modo natural o juízo solicitado por δοκεῖ σοι, sem transformar a pergunta numa afirmação objetiva.
- source_word: γεγονέναι
  choice: se tornou
  rationale: 'Preserva o sentido dinâmico de γίνομαι e a força do perfeito: a questão é quem veio a agir como próximo, não apenas quem possuía essa condição.'
- source_word: τοῦ ἐμπεσόντος
  choice: daquele que caiu
  rationale: Mantém o particípio substantivado sem acrescentar «homem», embora o referente masculino esteja claro no contexto.
- source_word: εἰς τοὺς λῃστάς
  choice: nas mãos dos assaltantes
  rationale: Verte naturalmente a expressão idiomática grega, que indica cair sob o poder de assaltantes. «Assaltantes» é corrente e adequado ao ataque violento descrito.
theological_decisions:
- issue: Foco ético da pergunta na parábola do bom samaritano
  choice: Traduzir γεγονέναι por «se tornou»
  alternative: «foi o próximo» ou «era próximo»
  rationale: 'A opção dinâmica conserva a reformulação feita por Jesus: em vez de apenas delimitar quem é o próximo, a pergunta destaca quem se tornou próximo por sua ação.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Na sua opinião» evita a construção pouco natural «parece a você» no texto principal; a nota preserva a forma mais literal e a alternativa estática. O marcador [a] aparece no texto principal.
