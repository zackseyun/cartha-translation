review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha adequadamente a sequência e os referentes do grego: o contraste introduzido por δέ, o samaritano em viagem, sua chegada ao homem, a visão e a reação compassiva. Contudo, ἐσπλαγχνίσθη é uma forma passiva de sentido idiomático/depoente, cujo significado é «teve/sentiu compaixão»; a construção portuguesa «foi movido de compaixão» não é a forma natural para esse sentido.'
  naturalness: «Que viajava» é mais direto e fluente do que «que estava viajando» neste contexto narrativo. «Teve compaixão» é português moderno, claro e idiomático; «foi movido de compaixão» soa pouco natural, pois em português se diria normalmente «movido por compaixão».
  terminology: «Samaritano» é o equivalente estabelecido e preserva adequadamente a identidade etnorreligiosa e o contraste narrativo. Não há necessidade de explicação adicional no versículo.
  issues:
  - severity: low
    issue: «Foi movido de compaixão» é formulação pouco idiomática em português.
    rationale: Embora tente refletir a forma passiva grega, em português a preposição natural seria «por», e o verbo grego tem aqui o sentido estabelecido de sentir ou ter profunda compaixão. «Teve compaixão» transmite o sentido sem artificialidade.
  revised_text: Mas um samaritano, que viajava, chegou ao lugar onde ele estava e, ao vê-lo, teve compaixão.[a]
