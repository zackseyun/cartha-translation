  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: pt
  text: Mas um samaritano, que viajava, chegou ao lugar onde ele estava e, ao vê-lo, teve compaixão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi movido por compaixão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: um samaritano
  rationale: “Samaritano” é o termo estabelecido em português para essa identidade etnorreligiosa e preserva o contraste social e narrativo da parábola.
- source_word: δέ
  choice: Mas
  rationale: Expressa o contraste com o sacerdote e o levita dos versículos anteriores.
- source_word: τις
  choice: um
  rationale: O artigo indefinido comunica naturalmente o valor indefinido de τις, sem a rigidez de “certo samaritano”.
- source_word: ὁδεύων
  choice: que estava viajando
  rationale: Apresenta a ação contínua de fundo do particípio presente em português natural.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: chegou ao lugar onde ele estava
  rationale: Comunica idiomaticamente o movimento até o local do homem ferido, evitando a possível ambiguidade de “chegou a ele”.
- source_word: ἰδών
  choice: ao vê-lo
  rationale: Preserva de modo conciso a relação temporal do particípio aoristo com o verbo principal.
- source_word: ἐσπλαγχνίσθη
  choice: foi movido de compaixão
  rationale: Preserva a intensidade afetiva do verbo grego, que descreve compaixão profunda, sem acrescentar interpretação doutrinária.
theological_decisions:
- issue: Representação da resposta compassiva do samaritano sem importar interpretação moral ou doutrinária posterior
  choice: foi movido de compaixão
  alternative: teve compaixão
  rationale: A formulação mantém a força emocional do verbo grego sem expandi-lo com conceitos como graça, misericórdia ou amor ao próximo que não estão explicitamente enunciados neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste narrativo e explicita naturalmente o local indicado por κατ’ αὐτόν.
