- from: Mas um samaritano, que estava viajando, chegou ao lugar onde ele estava e, ao vê-lo, foi movido de compaixão.[a]
  to: Mas um samaritano, que viajava, chegou ao lugar onde ele estava e, ao vê-lo, teve compaixão.[a]
  rationale: A revisão preserva o conteúdo, a progressão narrativa e a força compassiva de ἐσπλαγχνίσθη, mas substitui um calque português pouco natural por uma expressão idiomática. A nota mantém uma alternativa que explicita a nuance afetiva intensa sem apresentar uma construção gramaticalmente estranha.
