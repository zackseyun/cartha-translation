source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: pt
  text: Todas as coisas me foram entregues por meu Pai[a]. Ninguém sabe quem é o Filho, a não ser o Pai; e ninguém sabe quem é o Pai, a não ser o Filho e aquele a quem o Filho quiser revelar o Pai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo me foi entregue por meu Pai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e qualquer um a quem o Filho queira revelar o Pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Todas as coisas
  rationale: O neutro plural tem alcance abrangente. “Todas as coisas” conserva o peso formal da afirmação, enquanto “Tudo” seria uma alternativa mais idiomática.
- source_word: παρεδόθη
  choice: me foram entregues
  rationale: O aoristo passivo de παραδίδωμι indica que as coisas foram entregues ao Filho; a formulação evita acrescentar a noção mais estreita de mera administração.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: por meu Pai
  rationale: Ὑπό com genitivo assinala o agente pessoal da construção passiva; “por meu Pai” reproduz isso diretamente.
- source_word: γινώσκει
  choice: sabe
  rationale: O verbo expressa conhecimento. Não se acrescentou “plenamente”, pois isso explicitaria uma intensidade não verbalizada no grego.
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: quem é o Filho / quem é o Pai
  rationale: A construção natural em português preserva o caráter pessoal e relacional das duas orações.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: o Filho / o Pai
  rationale: As maiúsculas identificam os títulos relacionais cristológicos e divinos reconhecidos pelo contexto.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: aquele a quem o Filho o quiser revelar
  rationale: A formulação conserva o destinatário indefinido, a volição do Filho e o Pai como objeto implícito de “revelar”.
- source_word: βούληται
  choice: quiser
  rationale: “Quiser” comunica naturalmente volição e decisão em português, sem o tom arcaizante de “for da vontade” nem o possível enfraquecimento de “desejar”.
- source_word: ἀποκαλύψαι
  choice: revelar
  rationale: “Revelar” é claro, corrente e preserva a ressonância de uma manifestação que torna alguém conhecido.
theological_decisions:
- issue: Conhecimento recíproco exclusivo entre o Pai e o Filho
  choice: Mantida a afirmação direta de que ninguém sabe quem é o Filho, exceto o Pai, e ninguém sabe quem é o Pai, exceto o Filho.
  alternative: Acrescentar qualificadores interpretativos como “conhece plenamente” ou “sabe verdadeiramente”.
  rationale: A sintaxe já preserva o forte peso cristológico e a singularidade do conhecimento mútuo, sem ser necessário intensificar γινώσκει além de sua forma explícita.
- issue: Alcance da vontade reveladora do Filho
  choice: Traduzido βούληται por “quiser”, mantendo o Filho como agente decisivo da revelação do Pai.
  alternative: Usar “desejar”, “for da vontade” ou uma paráfrase que reduza a agência do Filho.
  rationale: O grego atribui ao Filho a volição na escolha do destinatário da revelação. A tradução mantém essa afirmação sem a sistematizar além do texto.
- issue: Objeto implícito de ἀποκαλύψαι
  choice: Explicitado pelo pronome “o”, referente ao Pai.
  alternative: Deixar “revelar” sem objeto expresso ou parafrasear “dar a conhecer o Pai”.
  rationale: O Pai é o antecedente contextual inequívoco; o pronome produz português natural e preserva a concisão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a declaração inicial e usa ponto e vírgula para tornar clara a reciprocidade entre Pai e Filho. Os marcadores [a] e [b] aparecem no texto principal.
