  source_fidelity: 'A tradução reproduz fielmente a estrutura e o sentido do grego: a entrega universal pelo Pai, o conhecimento exclusivo e recíproco do Filho e do Pai, e a revelação do Pai àqueles a quem o Filho quer revelá-lo. A elipse de «ninguém sabe» na segunda oração é legitimamente suprida em português para tornar explícita a coordenação grega.'
  naturalness: «Aquele a quem o Filho o quiser revelar» é compreensível, mas a sequência de dois pronomes átonos («o ... o») soa pouco fluida no português moderno. Explicitar «o Pai» como objeto de «revelar» é natural, elimina qualquer hesitação referencial e não acrescenta conteúdo além do antecedente inequívoco no contexto imediato.
  terminology: «Pai» e «Filho», com maiúsculas, preservam adequadamente o uso titular e relacional do texto. «Entregues», «sabe» e «quiser revelar» são escolhas modernas, precisas e de registro apropriado. A nota alternativa deve também empregar uma construção portuguesa fluente.
