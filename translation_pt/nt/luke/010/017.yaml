id: LUK.10.17
reference: Luke 10:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: pt
  text: 'Então os setenta e dois voltaram com alegria[a], dizendo: “Senhor, até os demônios se submetem a nós em teu nome.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “os setenta” em vez de “os setenta e dois”.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: voltaram
  rationale: O aoristo de ὑποστρέφω indica o retorno após a missão; “voltaram” é natural, claro e direto em português.
- source_word: δὲ
  choice: Então
  rationale: δέ assinala o avanço da narrativa; “Então” mantém a continuidade temporal e discursiva sem tornar a ligação excessivamente rígida.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: os setenta e dois
  rationale: Segue o texto impresso do SBLGNT. A variante significativa “os setenta” é registrada em nota.
- source_word: μετὰ χαρᾶς
  choice: cheios de alegria
  rationale: Expressa de modo natural em português a circunstância de alegria intensa no retorno, preservando o substantivo χαρά.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a ligação participial do grego e introduz naturalmente o discurso direto.
- source_word: Κύριε
  choice: Senhor
  rationale: É o vocativo de κύριος dirigido a Jesus; “Senhor” é a correspondência corrente e digna.
- source_word: καὶ
  choice: até
  rationale: 'Neste contexto exclamativo, καί tem valor ascensivo: destaca com surpresa que até mesmo os demônios se submetiam.'
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Preserva o sentido direto e o uso neotestamentário de δαιμόνια, sem substituí-lo pela formulação interpretativa “espíritos malignos”.
- source_word: ὑποτάσσεται
  choice: se submetem
  rationale: A forma presente média/passiva comunica sujeição; “se submetem” é idiomático em português e concorda com o sujeito plural traduzido.
- source_word: ἡμῖν
  choice: a nós
  rationale: Representa diretamente o dativo que acompanha ὑποτάσσω.
- source_word: ἐν τῷ ὀνόματί σου
  choice: em teu nome
  rationale: Preserva a expressão grega e comunica ação realizada sob a autoridade associada ao nome de Jesus, sem explicitar além do texto.
theological_decisions:
- issue: Variante textual quanto ao número dos enviados
  choice: os setenta e dois
  alternative: os setenta
  rationale: O texto fornecido do SBLGNT traz “setenta e dois”. Como “setenta” é uma variante textual antiga e conhecida, ela é preservada em nota em vez de ser omitida.
- issue: Força de “em teu nome”
  choice: manter a expressão sem explicação no corpo do versículo
  alternative: por tua autoridade
  rationale: A expressão pode envolver autoridade e agência, mas a tradução literal e natural preserva sua amplitude teológica sem reduzir seu sentido a uma única explicação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega-se “teu” por combinar naturalmente com o vocativo singular “Senhor”. A exclamação final comunica a evidente surpresa e alegria do relato sem acrescentar conteúdo lexical.
