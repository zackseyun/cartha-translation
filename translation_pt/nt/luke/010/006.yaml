id: LUK.10.6
reference: Luke 10:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: pt
  text: E, se ali houver um filho da paz[a], a paz de vocês repousará sobre ele; mas, se não, voltará para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma pessoa de paz» — isto é, alguém receptivo à saudação e à mensagem de paz.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: um filho da paz
  rationale: Preserva a expressão de matriz semítica e o masculino singular do grego. A expressão caracteriza alguém ligado à paz ou receptivo à saudação e à mensagem de paz; a nota apresenta uma formulação mais idiomática.
- source_word: ἐπαναπαήσεται
  choice: repousará sobre
  rationale: Mantém a imagem de a paz pousar e permanecer sobre quem a recebe, com formulação natural e digna em português.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: a paz de vocês
  rationale: Conserva a estrutura possessiva direta e permite que a expressão abranja tanto a saudação quanto a bênção de paz, sem restringir explicitamente o sentido.
- source_word: μήγε
  choice: se não
  rationale: Expressa de modo corrente a condição negativa enfática, sem introduzir uma rigidez pouco natural.
- source_word: ἀνακάμψει
  choice: voltará
  rationale: Comunica claramente a ideia de retorno da paz que não encontrou acolhimento.
- source_word: ἐφ’ ὑμᾶς
  choice: para vocês
  rationale: Com o verbo «voltar», esta regência é idiomática em português e preserva o sentido de retorno aos enviados.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: E, se ali houver
  rationale: Preserva a conexão com o versículo anterior e a referência locativa, usando uma construção natural em português.
theological_decisions:
- issue: Se a expressão masculina υἱὸς εἰρήνης deve ser neutralizada
  choice: Manter «filho da paz» no texto principal
  alternative: «pessoa de paz» ou «alguém receptivo à paz»
  rationale: A forma principal preserva o idioma semítico e o masculino singular do texto grego, sem decidir além do que a expressão afirma. A nota esclarece o sentido idiomático e oferece a alternativa corrente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vocês» traduz o plural ὑμῶν/ὑμᾶς de maneira natural; «repousará sobre» conserva a imagem do original, e «filho da paz» preserva deliberadamente sua textura idiomática.
