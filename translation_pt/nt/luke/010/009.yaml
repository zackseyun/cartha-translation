id: LUK.10.9
reference: Luke 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: pt
  text: 'E curem os doentes que houver nela e digam-lhes: “O Reino de Deus se aproximou de vocês.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegou perto de vocês”.'
    reason: Alternativa lexical para ἤγγικεν ἐφ’ ὑμᾶς, preservando a ideia de aproximação consumada com efeito presente.
lexical_decisions:
- source_word: θεραπεύετε
  choice: curem
  rationale: O imperativo presente pede a ação dos enviados em relação aos enfermos. “Curem” é direto, natural e adequado ao contexto; “cuidem” seria amplo demais.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: os doentes que houver nela
  rationale: Com θεραπεύετε, ἀσθενεῖς se refere primariamente a pessoas enfermas. “Nela” retoma a cidade mencionada no contexto anterior, e a construção portuguesa evita ambiguidade.
- source_word: λέγετε αὐτοῖς
  choice: digam-lhes
  rationale: Reproduz de modo simples e direto o imperativo de fala e seu objeto indireto.
- source_word: Ἤγγικεν
  choice: se aproximou
  rationale: O perfeito grego indica uma aproximação já ocorrida com relevância presente. “Se aproximou” preserva tanto o movimento quanto a proximidade atual, sem reduzir a expressão a um simples estado.
- source_word: ἐφ’ ὑμᾶς
  choice: de vocês
  rationale: Com ἐγγίζω, a expressão indica aproximação em relação aos ouvintes. “De vocês” é a construção idiomática exigida por “se aproximou” em português.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É a expressão bíblica consagrada e compreensível, preservando a amplitude semântica de βασιλεία, que pode envolver tanto o governo de Deus quanto seu domínio.
theological_decisions:
- issue: Sentido do anúncio do Reino
  choice: O Reino de Deus “se aproximou”, indicando uma aproximação já efetivada e atualmente relevante.
  alternative: “O Reino de Deus está perto”, que pode sugerir apenas iminência futura, ou uma formulação que declare sua plena realização presente.
  rationale: A forma perfeita ἤγγικεν sustenta a relevância presente da aproximação, mas o versículo não resolve por completo a tensão entre a presença atual e a consumação futura do Reino.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Vocês” comunica naturalmente o plural ὑμᾶς; “digam-lhes” mantém concisão sem soar excessivamente arcaico.
