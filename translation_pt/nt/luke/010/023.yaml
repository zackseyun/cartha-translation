source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: pt
  text: 'E, voltando-se para os discípulos, disse-lhes em particular[a]: “Bem-aventurados os olhos que veem o que vocês veem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em privado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: voltando-se
  rationale: O particípio aoristo introduz a ação de Jesus antes da fala; a forma preserva a ligação participial de modo natural em português.
- source_word: κατ’ ἰδίαν
  choice: em particular
  rationale: A expressão indica que Jesus se dirigiu aos discípulos separadamente; “em particular” é corrente e preserva a possível nuance adverbial sem especificar além do texto.
- source_word: μαθητάς
  choice: discípulos
  rationale: Termo consagrado e ainda compreensível, que conserva a relação de aprendizado e seguimento.
- source_word: Μακάριοι
  choice: Felizes
  rationale: Em português bíblico atual, “felizes” expressa a condição favorecida proclamada pela bem-aventurança, sem reduzi-la necessariamente a uma emoção passageira.
- source_word: ὀφθαλμοὶ
  choice: os olhos
  rationale: Mantém a metonímia e a imagem explícita do grego, sem substituí-las pelas pessoas que veem.
- source_word: οἱ βλέποντες
  choice: que veem
  rationale: Reproduz naturalmente a função adjetiva do particípio presente, qualificando “os olhos”.
- source_word: ἃ βλέπετε
  choice: o que vocês veem
  rationale: Tradução direta e idiomática do pronome relativo com o verbo no presente; “vocês” torna inequívoco o plural.
theological_decisions:
- issue: Força da bem-aventurança
  choice: Uma declaração de felicidade favorecida sobre os olhos que contemplam aquilo que os discípulos veem.
  alternative: Uma referência apenas à sensação emocional de felicidade.
  rationale: Μακάριοι tem força de bem-aventurança e aponta para uma condição privilegiada; “felizes” é natural em português e, no formato declarativo, preserva essa força sem acrescentar explicitamente uma causa divina que o versículo não enuncia.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para fluidez, mantendo a imagem literal dos olhos e a repetição de “veem” presente no grego.
