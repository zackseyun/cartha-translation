  source_fidelity: A estrutura e o sentido geral são fiéis ao grego. Contudo, «Felizes» pode ser entendido predominantemente como estado emocional e atenua a força convencional de bem-aventurança de μακάριοι neste pronunciamento. «Em particular» é mais claro quando ligado ao ato de falar aos discípulos, não ao gesto de voltar-se.
  naturalness: A redação revista mantém português moderno e acessível. «Disse-lhes em particular» explicita naturalmente que a fala foi dirigida aos discípulos à parte.
  terminology: «Bem-aventurados» é o equivalente português mais estável para μακάριοι em uma bem-aventurança, preservando seu registro e peso sem acrescentar uma explicação doutrinária. «Discípulos» e a imagem metonímica de «olhos» são adequados.
  issues:
