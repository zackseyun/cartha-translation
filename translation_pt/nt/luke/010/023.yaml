    issue: «Felizes» para Μακάριοι
    rationale: Embora possível em português contemporâneo, «felizes» pode sugerir apenas emoção subjetiva. Neste dito de bem-aventurança, «bem-aventurados» preserva melhor a força declarativa e o registro do original.
  - severity: low
    issue: Posição de «em particular»
    rationale: Em «voltando-se em particular para os discípulos», o adjunto pode parecer modificar «voltando-se». No grego, κατ’ ἰδίαν qualifica mais naturalmente a comunicação dirigida aos discípulos; «disse-lhes em particular» reduz essa ambiguidade.
