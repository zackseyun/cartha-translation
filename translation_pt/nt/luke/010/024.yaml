reference: Luke 10:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: pt
  text: Pois eu lhes digo que muitos profetas e reis desejaram ver o que vocês veem e não viram, e ouvir o que vocês ouvem e não ouviram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Pois eu lhes digo
  rationale: “Eu lhes digo” expressa naturalmente λέγω com o dativo ὑμῖν; “pois” preserva a ligação explicativa de γάρ com a bem-aventurança anterior.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: muitos profetas e reis
  rationale: Tradução direta e natural, mantendo as categorias históricas do grego sem ampliar βασιλεῖς para “governantes”.
- source_word: ἠθέλησαν
  choice: desejaram
  rationale: θέλω aqui indica vontade ou desejo; “desejaram” mantém o tom digno e não exagera a intensidade como poderia fazer “ansiavam”.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: ver o que vocês veem
  rationale: Reproduz de modo conciso e idiomático a oração relativa, preservando o contraste entre os personagens do passado e os ouvintes de Jesus.
- source_word: καὶ οὐκ εἶδαν
  choice: mas não viram
  rationale: Embora καί seja literalmente “e”, o valor adversativo contextual é expresso naturalmente por “mas”; o objeto permanece recuperável da oração anterior e não precisa ser acrescentado.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: ouvir o que vocês ouvem
  rationale: Mantém o paralelismo com “ver o que vocês veem” e traduz de forma direta o infinitivo e a oração relativa.
- source_word: καὶ οὐκ ἤκουσαν
  choice: mas não ouviram
  rationale: Preserva o paralelismo da frase e verte naturalmente o contraste contextual, sem acrescentar um pronome objeto ausente no grego.
theological_decisions:
- issue: Identidade de “profetas e reis”
  choice: Manter as categorias históricas “profetas e reis” sem explicação adicional.
  alternative: “profetas e governantes” ou “profetas e reis do passado”
  rationale: O texto contrasta os discípulos de Jesus com figuras notáveis anteriores, mas não identifica indivíduos nem acrescenta “do passado”; a tradução preserva essa tensão sem interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμεῖς e “lhes” como objeto indireto. Conserva o paralelismo retórico entre ver e ouvir. Não se incluiu nota lexical, pois “desejaram” representa adequadamente ἠθέλησαν no texto e as alternativas não são necessárias para evitar perda relevante de sentido.
