base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: pt
  text: Mas, no juízo, será mais suportável para Tiro e Sidom do que para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mais tolerável».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz o forte contraste com a denúncia anterior de modo natural e direto em português.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: para Tiro e Sidom
  rationale: Os dativos indicam aqueles para quem o juízo será comparativamente mais suportável; a construção com «para» é idiomática em português.
- source_word: ἀνεκτότερον
  choice: mais suportável
  rationale: Expressa com clareza o comparativo de ἀνεκτός, preservando a ideia de algo relativamente mais fácil de suportar; «mais tolerável» continua sendo uma alternativa legítima.
- source_word: ἔσται
  choice: será
  rationale: Traduz diretamente o futuro de εἰμί em português atual.
- source_word: ἐν τῇ κρίσει
  choice: no juízo
  rationale: Mantém o substantivo definido e sua referência contextual ao juízo divino, sem acrescentar explicitamente «final» ao texto.
- source_word: ἢ ὑμῖν
  choice: do que para vocês
  rationale: Completa naturalmente a comparação e representa o valor do dativo plural; «vocês» oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Natureza de κρίσις no contexto
  choice: «o juízo», entendido contextualmente como o juízo divino escatológico
  alternative: juízo em sentido geral
  rationale: A comparação entre as cidades impenitentes e Tiro e Sidom aponta para o juízo futuro, mas a tradução conserva a formulação concisa do grego e não insere «final».
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem «no juízo» foi antecipada para produzir uma frase mais fluente sem alterar as relações semânticas do grego.
