id: LUK.10.1
reference: Luke 10:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: pt
  text: Depois disso, o Senhor designou também outros setenta e dois[a] e os enviou de dois em dois à sua frente, a todas as cidades e lugares aonde ele próprio estava para ir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «setenta» em vez de «setenta e dois».
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal e preserva a referência ao conjunto de acontecimentos anteriores, sem a rigidez de «depois destas coisas».
- source_word: ἀνέδειξεν
  choice: designou
  rationale: O verbo indica escolher ou nomear pessoas para uma tarefa. «Designou» comunica a comissão sem sugerir apenas uma escolha informal.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É a tradução portuguesa corrente de κύριος e, neste contexto narrativo de Lucas, refere-se naturalmente a Jesus.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: também outros setenta e dois
  rationale: Preserva tanto a ideia de pessoas adicionais em ἑτέρους quanto o valor aditivo de καί. Segue a leitura do SBLGNT, registrando a variante «setenta» em nota.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Tradução direta e idiomática, sem acrescentar ao verbo uma nuance técnica de ofício apostólico.
- source_word: ἀνὰ δύο δύο
  choice: de dois em dois
  rationale: Reproduz de modo natural em português a expressão distributiva grega e seu destaque na organização em pares.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: à sua frente
  rationale: Indica que foram enviados adiante dele, preparando os lugares antes de sua chegada.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: a todas as cidades e lugares
  rationale: Mantém os dois substantivos de Lucas. O plural depois de πᾶσαν é idiomático em português e conserva o sentido distributivo de totalidade.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: aonde ele próprio estava para ir
  rationale: «Estava para ir» preserva a ação futura iminente ou prevista expressa por μέλλω; «ele próprio» mantém a ênfase de αὐτός. «Aonde» é adequado por envolver destino com o verbo ir.
theological_decisions:
- issue: Variante textual no número dos designados
  choice: setenta e dois
  alternative: setenta
  rationale: O texto principal segue o SBLGNT, que traz ἑβδομήκοντα δύο. Como «setenta» possui apoio manuscrito relevante, a alternativa é preservada em nota, sem atribuir à diferença uma solução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Depois disso» evita literalismo artificial; «designou» mantém o caráter formal da comissão; e «de dois em dois» conserva a cadência do grego.
