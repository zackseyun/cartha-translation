source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: pt
  text: 'E ele lhes disse: “A colheita é grande, mas os trabalhadores são poucos. Por isso, orem ao Senhor da colheita que envie[a] trabalhadores para a sua colheita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mande para fora”; o verbo grego pode transmitir uma força maior do que simplesmente “enviar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego é preservado de modo natural em português e pode sugerir uma fala continuada ou habitual no contexto narrativo.
- source_word: δὲ
  choice: E
  rationale: Aqui funciona como conectivo leve de continuidade narrativa; “E” conserva essa ligação sem introduzir contraste indevido.
- source_word: θερισμός
  choice: colheita
  rationale: Mantém a metáfora agrícola e seu uso figurado sem explicá-la além do que o texto diz.
- source_word: πολύς
  choice: grande
  rationale: “A colheita é grande” é uma construção clara e natural em português, indicando ampla extensão ou abundância.
- source_word: ἐργάται
  choice: trabalhadores
  rationale: Termo moderno, abrangente e diretamente ligado ao trabalho da colheita.
- source_word: ὀλίγοι
  choice: poucos
  rationale: Reproduz de forma direta e idiomática o contraste com a grandeza da colheita.
- source_word: δεήθητε
  choice: peçam
  rationale: Expressa a petição dirigida ao Senhor da colheita de forma natural; o contexto deixa claro que se trata de oração, sem exigir a inserção de um complemento ausente no grego.
- source_word: οὖν
  choice: Por isso
  rationale: Torna clara a inferência prática decorrente da falta de trabalhadores, em linguagem corrente.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva tanto a ideia de autoridade e domínio quanto a ressonância teológica do título.
- source_word: ὅπως
  choice: que
  rationale: Introduz naturalmente em português o conteúdo da petição.
- source_word: ἐκβάλῃ
  choice: mande
  rationale: No contexto, comunica o envio dos trabalhadores sem sugerir indevidamente expulsão ou violência; a possível força maior do verbo é preservada em nota.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: para a sua colheita
  rationale: Conserva a direção indicada por εἰς e o possessivo, sem acrescentar “campo”, que não aparece no texto grego.
theological_decisions:
- issue: Referente e força de “Senhor da colheita”
  choice: Manter o título metafórico “Senhor da colheita” sem identificar explicitamente seu referente.
  alternative: Explicitar que se trata de Deus como proprietário e dirigente da missão, ou entender que Jesus alude à sua própria autoridade divina.
  rationale: O versículo apresenta uma autoridade divina que possui a colheita e envia trabalhadores, mas não desenvolve aqui sua identificação cristológica; manter o título preserva a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a metáfora agrícola, evita linguagem denominacional e preserva na nota a intensidade possível de ἐκβάλῃ.
