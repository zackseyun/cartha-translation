review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a metáfora da colheita, o contraste entre sua abundância e a escassez de trabalhadores, o título «Senhor da colheita» e o possessivo «sua». Contudo, «peçam» enfraquece desnecessariamente o sentido de oração/petição religiosa de δεήθητε neste contexto, e «mande» não expressa tão claramente o envio para a colheita quanto «envie». O imperfeito «dizia» é gramaticalmente possível, mas o pretérito perfeito é mais natural como introdução narrativa em português e não perde conteúdo relevante, como reconhece a trilha inglesa.
  naturalness: «Ele lhes disse» e «orem ao Senhor» são formulações modernas, claras e dignas em português de ampla compreensão. «Envie trabalhadores para a sua colheita» comunica de modo inequívoco a comissão/envio e preserva a metáfora sem acrescentar «campo».
  terminology: «Colheita», «trabalhadores» e «Senhor da colheita» são escolhas adequadas. «Orar» reproduz naturalmente a força religiosa de δεήθητε sem impor interpretação doutrinária. A nota deve indicar a possível força de ἐκβάλῃ sem fazer de uma alternativa excessivamente áspera a leitura principal.
  issues:
  - severity: medium
    issue: «Peçam ao Senhor» em vez de «orem ao Senhor»
    rationale: δεήθητε é um imperativo de petição, e, dirigido ao «Senhor da colheita», tem no contexto o sentido natural de orar. «Peçam» é possível lexicalmente, mas torna menos explícita em português a natureza da ação que o contexto e a tradução inglesa preservam.
  - severity: low
    issue: «Mande» é menos claro que «envie» para ἐκβάλῃ
    rationale: Embora «mandar trabalhadores» possa significar enviá-los, «enviar» expressa com mais clareza o movimento/comissionamento para a colheita. A nuance mais enérgica de ἐκβάλῃ permanece apropriadamente em nota.
  - severity: low
    issue: O imperfeito «dizia» soa marcado como abertura de uma fala única
    rationale: O imperfeito grego pode ser vertido literalmente, mas o pretérito perfeito é a forma idiomática portuguesa para essa introdução narrativa e corresponde à decisão do texto-base inglês, sem perda semântica significativa.
  revised_text: 'E ele lhes disse: “A colheita é grande, mas os trabalhadores são poucos. Por isso, orem ao Senhor da colheita que envie[a] trabalhadores para a sua colheita.”'
  revised_footnotes:
  - marker: a
    text: Ou “mande para fora”; o verbo grego pode transmitir uma força maior do que simplesmente “enviar”.
    reason: lexical_alternative
  revision_rationale: A revisão torna explícita a oração implícita no imperativo de petição e usa «envie» para representar de forma mais clara o envio dos trabalhadores. A nota conserva, sem exagerá-la no texto principal, a força potencial de ἐκβάλῃ. «Ele lhes disse» oferece uma abertura narrativa idiomática em português, preservando o sentido do imperfeito no contexto.
