revisions:
- from: 'E ele lhes dizia: “A colheita é grande, mas os trabalhadores são poucos. Por isso, peçam ao Senhor da colheita que mande[a] trabalhadores para a sua colheita.”'
  to: 'E ele lhes disse: “A colheita é grande, mas os trabalhadores são poucos. Por isso, orem ao Senhor da colheita que envie[a] trabalhadores para a sua colheita.”'
  rationale: A revisão torna explícita a oração implícita no imperativo de petição e usa «envie» para representar de forma mais clara o envio dos trabalhadores. A nota conserva, sem exagerá-la no texto principal, a força potencial de ἐκβάλῃ. «Ele lhes disse» oferece uma abertura narrativa idiomática em português, preservando o sentido do imperfeito no contexto.
