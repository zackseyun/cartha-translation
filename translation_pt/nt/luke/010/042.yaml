id: LUK.10.42
reference: Luke 10:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: pt
  text: Mas poucas coisas são necessárias — ou apenas uma[a]. Pois Maria escolheu a boa porção[b], e esta não lhe será tirada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “somente uma coisa é necessária”. No contexto da refeição, o grego também pode ser entendido mais especificamente como: “poucos pratos são necessários — ou apenas um”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a boa parte”. “Porção” pode evocar intencionalmente tanto uma porção de comida quanto, em sentido figurado, a participação naquilo que tem verdadeiro valor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Mas poucas coisas são necessárias — ou apenas uma
  rationale: A expressão idiomática ἐστιν χρεία indica necessidade. O plural ὀλίγων é vertido por “poucas coisas”, enquanto ἢ ἑνός mantém o contraste compacto com “uma”, sem decidir se o referente específico são pratos ou uma única coisa essencial.
- source_word: Μαριὰμ
  choice: Maria
  rationale: Forma tradicional e natural do nome em português.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: a boa porção
  rationale: “Porção” traduz μερίδα e conserva a possível ressonância dupla entre uma porção de comida no contexto imediato e a participação figurada naquilo que tem verdadeiro valor. “Boa” corresponde diretamente a ἀγαθή, sem introduzir o comparativo “melhor”.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: O aoristo médio apresenta a escolha deliberada de Maria. O pretérito perfeito é natural em português, e a consequência duradoura aparece explicitamente na oração seguinte.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: e esta não lhe será tirada
  rationale: “Esta” retoma com clareza “a boa porção”; a construção passiva futura preserva a promessa de que ela não será removida de Maria.
theological_decisions:
- issue: Sentido de “poucas coisas... ou uma” em relação ao serviço de Marta e à escolha de Maria
  choice: Manter a afirmação aberta quanto ao que é necessário, sem determinar se Jesus fala de poucos pratos, de um único prato ou de uma só coisa essencial.
  alternative: Traduzir exclusivamente como “apenas uma coisa é necessária” ou especificar “poucos pratos, ou apenas um”.
  rationale: A redação grega admite tanto uma referência prática aos preparativos da refeição quanto um contraste espiritual mais amplo. A tradução conserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a concisão e a ambiguidade genuína do grego; os travessões destacam o contraste sem o explicar em excesso.
