source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: pt
  text: Ela tinha uma irmã chamada Maria[a], que também se sentou aos pés de Jesus e ficou ouvindo a palavra dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “do Senhor” em vez de “de Jesus”.
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: ela
  rationale: O demonstrativo dativo feminino retoma Marta no versículo anterior; em português corrente, o pronome explicita naturalmente essa referência.
- source_word: ἀδελφὴ
  choice: irmã
  rationale: Equivalente direto e natural do termo de parentesco.
- source_word: καλουμένη Μαριάμ
  choice: chamada Maria
  rationale: Reproduz de modo claro e idiomático o particípio que introduz o nome da pessoa.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: se sentou aos pés
  rationale: Expressa a ação de tomar lugar aos pés de alguém, mantendo a postura concreta e sua possível conotação de discípula sem explicitá-la na tradução.
- source_word: τοῦ Ἰησοῦ
  choice: de Jesus
  rationale: Segue diretamente o texto apresentado da SBLGNT, que traz Ἰησοῦ; a variante κύριος é registrada em nota.
- source_word: ἤκουεν
  choice: ficou ouvindo
  rationale: O imperfeito descreve uma ação em andamento; esta formulação preserva esse valor aspectual em português natural.
- source_word: τὸν λόγον αὐτοῦ
  choice: a palavra dele
  rationale: Mantém a amplitude de λόγος e indica que se trata da palavra proferida por Jesus, sem restringi-la a 'ensino' ou 'mensagem'.
theological_decisions:
- issue: Leitura textual no sintagma referente à pessoa a cujos pés Maria se sentou
  choice: Jesus
  alternative: o Senhor
  rationale: O texto grego fornecido da SBLGNT lê Ἰησοῦ. A leitura alternativa κύριος é significativa e, por isso, foi preservada em nota, sem substituir a evidência da edição-fonte no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “ficou ouvindo” conserva a ação contínua do imperfeito; “a palavra dele” evita a possível ambiguidade sonora de “sua palavra” e mantém proximidade lexical com o grego.
