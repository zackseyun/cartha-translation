  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: pt
  text: 'Vão! Vejam: eu os envio como cordeiros no meio de lobos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: Vão
  rationale: Imperativo presente na segunda pessoa do plural. “Vão” é a ordem mais direta, natural e concisa em português moderno.
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Partícula que chama a atenção para o que segue. O plural “Vejam” concorda naturalmente com os destinatários e evita o arcaísmo de “eis” sem perder a força discursiva.
- source_word: ἀποστέλλω ὑμᾶς
  choice: eu os envio
  rationale: O presente do indicativo expressa o envio que Jesus está realizando. “Os” explicita em português que o grupo é o objeto do verbo; “eu” conserva a ênfase possível do sujeito verbal.
- source_word: ὡς ἄρνας
  choice: como cordeiros
  rationale: ὡς introduz uma comparação, e ἄρνας significa especificamente “cordeiros”, preservando a imagem de vulnerabilidade sem generalizá-la para “ovelhas”.
- source_word: ἐν μέσῳ λύκων
  choice: para o meio de lobos
  rationale: A construção indica a situação ou esfera na qual são enviados. Com o verbo de envio, “para o meio de lobos” é idiomático e conserva mais claramente a imagem espacial de ἐν μέσῳ do que apenas “entre lobos”.
theological_decisions:
- issue: Imagem animal aplicada à missão dos discípulos
  choice: “como cordeiros para o meio de lobos”
  alternative: “como ovelhas entre lobos”
  rationale: O grego usa ἄρνας, “cordeiros”, não o termo geral para “ovelhas”. A tradução mantém a vulnerabilidade acentuada da imagem e não harmoniza o versículo com formulações semelhantes em outras passagens.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A pontuação separa a ordem inicial e deixa “Vejam” introduzir enfaticamente a declaração seguinte.
