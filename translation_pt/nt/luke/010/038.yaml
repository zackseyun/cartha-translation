  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: pt
  text: Enquanto eles seguiam viagem, ele entrou em certo povoado, e uma mulher chamada Marta o acolheu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Enquanto eles seguiam viagem
  rationale: A construção ἐν com infinitivo articular indica ação simultânea. “Enquanto” preserva essa relação temporal, e “eles” mantém o plural αὐτούς, distinguindo o grupo daquele que entra no povoado.
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome grego destaca Jesus em contraste com o grupo plural. Em português, “ele” preserva a referência sem substituir interpretativamente o pronome pelo nome “Jesus”.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Tradução direta e natural do aoristo de εἰσέρχομαι, mantendo conciso o movimento narrativo.
- source_word: εἰς κώμην τινά
  choice: em certo povoado
  rationale: κώμη designa uma povoação menor, e τινά acrescenta uma indefinição específica. “Certo povoado” conserva ambos os elementos com linguagem corrente.
- source_word: γυνὴ δέ τις
  choice: e uma mulher
  rationale: δέ introduz uma nova participante e faz a narrativa avançar; “e” expressa essa ligação de modo natural. O caráter indefinido de τις já é comunicado por “uma”, e a mulher é imediatamente identificada pelo nome.
- source_word: ὀνόματι Μάρθα
  choice: chamada Marta
  rationale: É a forma idiomática e clara de traduzir a expressão dativa que apresenta o nome da mulher.
- source_word: ὑπεδέξατο
  choice: acolheu
  rationale: O verbo indica receber alguém favoravelmente, muitas vezes como hóspede. “Acolheu” comunica a recepção hospitaleira sem acrescentar explicitamente “em sua casa”, expressão ausente do texto grego.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma Jesus; a forma átona “o” é clara e natural neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o contraste entre o grupo em viagem e Jesus, evita explicitar uma casa que o grego não menciona e mantém a nuance hospitaleira do verbo final.
