  source_fidelity: O texto português traduz adequadamente a construção temporal Ἐν δὲ τῷ πορεύεσθαι αὐτούς por “Enquanto eles seguiam viagem”, preservando o sujeito plural distinto de “ele”. “Entrou em certo povoado” corresponde bem a εἰσῆλθεν εἰς κώμην τινά, e “uma mulher chamada Marta o acolheu” reproduz com fidelidade γυνὴ ... ὀνόματι Μάρθα ὑπεδέξατο αὐτόν. “Acolheu” comunica de modo apropriado a recepção hospitaleira sem introduzir “em sua casa”, elemento não expresso no grego.
  naturalness: A redação é fluente, moderna e amplamente compreensível em português, inclusive para leitores brasileiros. A ordem das orações é natural, e os pronomes “eles”, “ele” e “o” deixam claras as referências sem sobrecarregar o texto.
  terminology: “Povoado” é uma opção legítima e natural para κώμη; “certo” conserva a indefinição com leve particularização de τινά. “Marta” e “acolheu” são formas adequadas ao registro narrativo e ao sentido lexical.
