id: LUK.10.19
reference: Luke 10:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: pt
  text: Vejam, eu lhes dei autoridade para pisar sobre serpentes e escorpiões[a] e sobre todo o poder do inimigo; e nada jamais lhes fará mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem pode referir-se literalmente a serpentes e escorpiões e, no contexto, também evocar forças espirituais hostis.
    reason: ambiguity
  - marker: b
    text: 'Ou: «nada de modo algum lhes causará dano». O grego emprega uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Vejam
  rationale: Reproduz de modo atual e compreensível a função de chamar enfaticamente a atenção, sem recorrer ao mais solene e menos corrente «eis».
- source_word: δέδωκα
  choice: eu lhes dei
  rationale: O perfeito grego apresenta uma concessão já realizada e ainda vigente; no português natural, o pretérito perfeito comunica bem esse resultado presente.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Preserva a ideia de autoridade ou direito concedido e mantém a distinção lexical em relação a δύναμις, traduzido depois por «poder».
- source_word: τοῦ πατεῖν
  choice: para pisar
  rationale: Expressa naturalmente o conteúdo ou finalidade da autoridade concedida, preservando a imagem sem intensificá-la para «esmagar».
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: sobre serpentes e escorpiões
  rationale: Mantém a imagem concreta e a relação espacial do grego. «Serpentes» é corrente no registro bíblico e amplamente inteligível.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: sobre todo o poder
  rationale: Comunica domínio ou superioridade em relação à força do inimigo e conserva o alcance total indicado por πᾶσαν.
- source_word: δύναμιν
  choice: poder
  rationale: É uma tradução natural de força ou capacidade e conserva o contraste com a «autoridade» recebida pelos discípulos.
- source_word: τοῦ ἐχθροῦ
  choice: do inimigo
  rationale: Preserva o singular pessoal do texto sem explicitar como Satanás ou o diabo aquilo que o versículo deixa implícito.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: nada jamais lhes fará mal
  rationale: A combinação negativa é fortemente enfática. «Nada jamais» transmite essa ênfase em português natural, enquanto «fará mal» abrange dano ou prejuízo sem restringir o sentido a ferimento físico.
theological_decisions:
- issue: Identidade do «inimigo»
  choice: Manter «o inimigo» sem identificação adicional.
  alternative: Traduzir ou explicar no texto principal como «Satanás» ou «o diabo».
  rationale: O contexto aponta para oposição satânica, mas o grego deste versículo diz apenas «o inimigo». A formulação mais ampla preserva o que está explícito e não elimina a inferência contextual.
- issue: Sentido de «serpentes e escorpiões»
  choice: Conservar a imagem concreta no texto principal.
  alternative: Interpretá-los diretamente como forças demoníacas ou como imagem exclusivamente simbólica.
  rationale: Os termos têm referentes literais claros, embora o contexto possa lhes dar valor representativo ou espiritual. A tradução mantém aberta essa tensão interpretativa.
- issue: Alcance da promessa de que nada fará mal
  choice: Traduzir enfaticamente a afirmação sem acrescentar qualificações interpretativas.
  alternative: Restringir explicitamente a promessa a dano espiritual, à missão imediata ou à salvação final.
  rationale: O grego formula uma negação abrangente e enfática, mas o versículo não explicita em que sentido ou horizonte ela se aplica. A tradução não deve resolver essa questão teológica por acréscimo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vejam» evita o arcaísmo de «eis»; «lhes» dirige a declaração ao grupo. A pontuação com ponto e vírgula destaca a promessa final sem romper a unidade do versículo.
