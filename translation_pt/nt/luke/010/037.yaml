source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: pt
  text: 'Ele respondeu: “Aquele que teve misericórdia dele.” Então Jesus lhe disse: “Vá e faça você também o mesmo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Aquele que teve misericórdia dele
  rationale: A expressão idiomática grega significa literalmente ‘aquele que praticou a misericórdia para com ele’. ‘Teve misericórdia dele’ comunica isso de modo natural e fiel em português.
- source_word: Πορεύου
  choice: Vá
  rationale: Imperativo singular direto e corrente, correspondente ao comando de Jesus.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: e faça você também o mesmo
  rationale: Mantém a ênfase explícita de καὶ σύ (‘você também’) e traduz o imperativo presente ποίει sem forçar uma distinção aspectual pouco natural em português.
theological_decisions:
- issue: Ênfase no destinatário da ordem de Jesus
  choice: faça você também o mesmo
  alternative: faça o mesmo
  rationale: A inclusão de ‘você também’ preserva o pronome enfático σύ e a aplicação pessoal da resposta ao especialista na Lei, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem conserva a ênfase do grego sem soar excessivamente literal.
source_grounding:
  english_pob_role: consult_only
