  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: pt
  text: 'Mas ele, querendo justificar-se, disse a Jesus: “E quem é o meu próximo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: querendo
  rationale: O particípio presente expressa a intenção ou motivação do homem; “querendo” preserva naturalmente essa relação com o verbo principal.
- source_word: δικαιῶσαι ἑαυτόν
  choice: justificar-se
  rationale: No contexto, indica a tentativa de mostrar que estava com a razão ou de se defender, sem impor ao termo um sentido técnico paulino. “Justificar-se” preserva tanto a forma reflexiva quanto a tensão narrativa.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: perguntou a Jesus
  rationale: Embora a expressão grega diga literalmente “disse a Jesus”, o conteúdo é interrogativo; “perguntou a Jesus” é natural em português e transmite com exatidão o ato de fala.
- source_word: Καὶ
  choice: E
  rationale: Mantém a conjunção que introduz a pergunta de continuação e preserva o fluxo do diálogo.
- source_word: τίς ἐστίν μου πλησίον
  choice: quem é o meu próximo
  rationale: πλησίον funciona como substantivo e corresponde ao termo tradicional e inteligível “próximo”, importante também por sua ligação com a citação da Lei no contexto.
theological_decisions:
- issue: Sentido de δικαιῶσαι ἑαυτόν
  choice: A tentativa do homem de justificar-se, isto é, mostrar que estava com a razão.
  alternative: Defender-se moralmente ou vindicar-se diante dos presentes.
  rationale: O contexto é um diálogo jurídico-ético. A formulação preserva a possibilidade de autodefesa e a ironia narrativa, sem transformar a expressão em uma afirmação técnica sobre a doutrina da justificação.
- issue: Alcance de πλησίον
  choice: Manter a pergunta direta “quem é o meu próximo?”.
  alternative: “Quem conta como meu próximo?”
  rationale: A forma direta preserva a pergunta grega e não antecipa sua implicação delimitadora; a interpretação do alcance de “próximo” emerge da parábola seguinte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “justificar-se” é natural no registro escrito contemporâneo. Não se acrescentou nota, pois não há marcador necessário no texto e a alternativa interpretativa pode ser preservada nas decisões editoriais sem sobrecarregar o versículo.
