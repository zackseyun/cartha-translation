id: LUK.10.4
reference: Luke 10:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: pt
  text: Não levem bolsa de dinheiro, bolsa de viagem[a] nem sandálias, e não cumprimentem ninguém pelo caminho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Bolsa de viagem» também pode ser traduzido como «sacola» ou «mochila». Era uma bolsa usada para levar provisões durante a jornada.
    reason: lexical_alternative
  - marker: b
    text: 'A ordem provavelmente não proíbe a cortesia comum, mas ressalta a urgência da missão: as saudações sociais daquela cultura podiam ser demoradas.'
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: levem
  rationale: No contexto de instruções para uma viagem, «levar» expressa de modo natural a ideia de carregar consigo os itens mencionados.
- source_word: βαλλάντιον
  choice: bolsa de dinheiro
  rationale: Designa uma bolsa destinada a guardar dinheiro; a expressão é clara e evita associações modernas inadequadas de «carteira».
- source_word: πήραν
  choice: bolsa de viagem
  rationale: Refere-se a uma bolsa usada para provisões durante uma jornada. A tradução comunica sua função em português corrente, sem impor um formato específico.
- source_word: ὑποδήματα
  choice: sandálias
  rationale: O termo designa calçados e, no contexto do Mediterrâneo antigo, provavelmente sandálias. Como depende de «levem», pode referir-se a sandálias carregadas como provisão, sem afirmar isso explicitamente.
- source_word: μηδένα
  choice: ninguém
  rationale: Equivalente direto e natural para o objeto da proibição.
- source_word: κατὰ τὴν ὁδόν
  choice: pelo caminho
  rationale: Expressão idiomática portuguesa que mantém o sentido de algo feito durante o percurso.
- source_word: ἀσπάσησθε
  choice: cumprimentem
  rationale: Neste contexto, ἀσπάζομαι significa saudar ou trocar cumprimentos; «cumprimentem» é claro e atual.
theological_decisions:
- issue: Alcance da proibição de cumprimentar durante a viagem
  choice: 'Manter no texto a proibição direta: «não cumprimentem ninguém pelo caminho»'
  alternative: Parafrasear como «não se demorem cumprimentando as pessoas pelo caminho»
  rationale: O grego formula uma proibição direta. A tradução preserva sua força, enquanto a provável urgência da missão e o caráter demorado das saudações sociais da época são explicados em nota, sem suavizar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «levem/cumprimentem» reflete que Jesus se dirige aos enviados. A coordenação simples conserva o caráter direto das instruções.
