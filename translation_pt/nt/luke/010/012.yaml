source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: pt
  text: 'Eu digo a vocês: naquele dia[b], será mais suportável[a] para Sodoma do que para aquela cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais tolerável». O comparativo grego ἀνεκτότερον admite ambas as traduções.'
    reason: lexical_alternative
  - marker: b
    text: «Naquele dia» refere-se ao dia do juízo divino; algumas passagens paralelas dizem isso explicitamente.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu digo a vocês
  rationale: Reproduz a afirmação direta e solene em português atual, mantendo explicitamente o verbo no presente e o destinatário plural.
- source_word: Σοδόμοις
  choice: para Sodoma
  rationale: Mantém o nome do lugar em uso metonímico e a construção comparativa com dativo, sem explicitar além do texto se a referência é à cidade ou aos habitantes.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: É a expressão temporal natural em português e conserva a referência judicial sem acrescentar no texto principal a palavra «juízo».
- source_word: ἀνεκτότερον
  choice: mais suportável
  rationale: Expressa de modo claro e corrente o sentido comparativo de algo mais fácil de suportar; «mais tolerável» continua sendo alternativa legítima.
- source_word: ἔσται
  choice: será
  rationale: Traduz diretamente o futuro do verbo «ser» e produz uma construção comparativa natural em português.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: do que para aquela cidade
  rationale: Preserva a comparação e o demonstrativo que remete à localidade mencionada no contexto anterior.
theological_decisions:
- issue: Natureza de «naquele dia»
  choice: Manter «naquele dia» no texto principal.
  alternative: «no dia do juízo»
  rationale: O contexto indica o dia do juízo divino, mas este versículo não contém explicitamente a palavra «juízo»; a formulação conserva a precisão e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eu digo a vocês» mantém a solenidade sem recorrer ao mais formal «digo-vos»; a ordem dos marcadores acompanha as expressões às quais cada nota se aplica.
