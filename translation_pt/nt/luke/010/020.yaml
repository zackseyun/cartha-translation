source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: pt
  text: Contudo, não se alegrem com isto, porque os espíritos se submetem a vocês[a]; alegrem-se, antes, porque os nomes de vocês estão escritos nos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O contexto indica seres espirituais hostis; também se poderia traduzir por “os espíritos malignos” ou “os demônios”, embora o grego diga simplesmente “os espíritos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, conforme a forma tradicional, “no céu”. O grego está no plural: “nos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Contudo
  rationale: Introduz com naturalidade uma ressalva enfática que corrige o motivo da alegria dos discípulos.
- source_word: ἐν τούτῳ μὴ χαίρετε ... χαίρετε δὲ
  choice: não se alegrem porque...; alegrem-se, antes, porque...
  rationale: Preserva a repetição de χαίρω e o contraste retórico, enquanto verte ἐν τούτῳ idiomaticamente em ligação com a oração explicativa introduzida por ὅτι.
- source_word: τὰ πνεύματα
  choice: os espíritos
  rationale: Mantém o artigo e a amplitude lexical do grego; o contexto indica seres espirituais hostis, mas o texto não emprega especificamente o termo 'demônios'.
- source_word: ὑμῖν ὑποτάσσεται
  choice: se submetem a vocês
  rationale: Expressão portuguesa clara e atual para a ideia de ficarem sujeitos à autoridade dos discípulos.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: os nomes de vocês
  rationale: Forma natural e amplamente compreensível de expressar o genitivo possessivo.
- source_word: ἐγγέγραπται
  choice: estão escritos
  rationale: O perfeito passivo descreve uma inscrição já realizada cujo resultado permanece; em português, 'estão escritos' comunica naturalmente esse estado resultante.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Preserva o plural do grego com uma formulação portuguesa natural e digna.
theological_decisions:
- issue: Natureza dos espíritos
  choice: os espíritos
  alternative: os demônios / os espíritos malignos
  rationale: Embora o contexto identifique seres hostis, mantém-se o termo mais amplo usado neste versículo, sem inserir no texto principal uma especificação ausente do grego.
- issue: Aspecto da inscrição dos nomes
  choice: estão escritos
  alternative: foram escritos / têm sido escritos
  rationale: A tradução apresenta o estado presente resultante do perfeito passivo, sem decidir além do texto quando ocorreu a inscrição.
- issue: Local da inscrição celestial
  choice: nos céus
  alternative: no céu
  rationale: Conserva-se o plural οὐρανοῖς, evitando normalizá-lo silenciosamente para o singular tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega 'vocês' como plural corrente, preserva a repetição imperativa e mantém no texto principal tanto a generalidade de 'espíritos' quanto o plural 'céus'.
