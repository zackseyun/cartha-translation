id: LUK.10.16
reference: Luke 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: pt
  text: Quem ouve vocês ouve a mim, e quem rejeita[a] vocês rejeita a mim; mas quem rejeita a mim rejeita aquele que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desconsidera” ou “põe de lado” (grego ἀθετέω).
    reason: alternativa lexical
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Quem ouve
  rationale: O particípio presente substantivado tem sentido genérico. “Quem ouve” expressa isso de modo natural e conciso em português.
- source_word: ὑμῶν
  choice: vocês
  rationale: O genitivo com ἀκούω indica as pessoas ouvidas. A tradução mantém a referência pessoal aos discípulos, sem acrescentar “mensagem”.
- source_word: ἐμοῦ
  choice: a mim
  rationale: Preserva o paralelismo pessoal com “vocês” e a identificação entre acolher os enviados e acolher Jesus.
- source_word: ἀκούει
  choice: ouve
  rationale: Mantém a repetição de ἀκούω e a formulação direta da declaração.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: quem rejeita / rejeita
  rationale: Neste contexto relacional, “rejeitar” comunica com clareza a recusa dos enviados, de Jesus e daquele que o enviou. A nota registra outras nuances possíveis.
- source_word: ὑμᾶς
  choice: vocês
  rationale: O objeto são os próprios discípulos como representantes de Jesus; “a mensagem de vocês” seria uma explicitação não presente no grego.
- source_word: δὲ
  choice: mas
  rationale: Sinaliza a leve progressão contrastiva para a afirmação culminante sobre aquele que enviou Jesus.
- source_word: τὸν ἀποστείλαντά με
  choice: aquele que me enviou
  rationale: Reproduz naturalmente o particípio aoristo substantivado e deixa implícita, como no grego, a identidade do remetente.
theological_decisions:
- issue: Identificação de Jesus com seus mensageiros comissionados
  choice: 'Manter a cadeia pessoal direta: ouvir ou rejeitar os discípulos equivale a ouvir ou rejeitar Jesus; rejeitar Jesus equivale a rejeitar aquele que o enviou.'
  alternative: Parafrasear como ouvir ou rejeitar somente a mensagem dos discípulos.
  rationale: O texto grego emprega pronomes pessoais, não substantivos abstratos como “mensagem” ou “ensino”. A tradução preserva essa estrutura representativa sem ampliar seu alcance.
- issue: Identidade de “aquele que me enviou”
  choice: Deixar o referente implícito.
  alternative: Explicitar “o Pai que me enviou”.
  rationale: O contexto aponta para Deus Pai, mas o versículo não emprega aqui a palavra “Pai”; a formulação implícita conserva a precisão do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vocês” evita o regionalismo de “vós” e mantém a referência pessoal explícita. A repetição de “ouve” e “rejeita” conserva a força retórica do original.
