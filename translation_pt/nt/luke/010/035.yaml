id: LUK.10.35
reference: Luke 10:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: pt
  text: 'No dia seguinte, tirou dois denários[a], deu-os ao hospedeiro e disse: “Cuide dele. Tudo o que você gastar a mais, eu lhe pagarei quando voltar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O denário era uma moeda romana de prata, geralmente equivalente ao pagamento de um dia de trabalho de um trabalhador braçal.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: No dia seguinte
  rationale: Expressa de modo natural em português a locução temporal que indica o dia posterior.
- source_word: ἐκβαλών
  choice: tirou
  rationale: No contexto, o particípio indica que ele retirou ou pegou o dinheiro que trazia consigo; “tirou” é claro e não reproduz indevidamente o sentido literal mais forte de “lançar para fora”.
- source_word: δύο δηνάρια
  choice: dois denários
  rationale: Mantém a designação histórica das moedas, sem substituir o valor por uma equivalência econômica necessariamente imprecisa.
- source_word: πανδοχεῖ
  choice: hospedeiro
  rationale: Designa a pessoa responsável pela hospedaria. “Hospedeiro” é conciso, compreensível e apropriado ao contexto antigo.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Cuide dele
  rationale: Transmite com naturalidade e clareza a ordem de prestar atenção e assistência contínua ao homem ferido.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Tudo o que você gastar a mais
  rationale: Preserva tanto a quantidade indefinida quanto a ideia de despesas adicionais além das moedas já entregues.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: quando voltar
  rationale: Verte naturalmente a construção temporal com infinitivo, sem especificar mais do que o grego se ele volta à hospedaria ou passa novamente pelo local.
- source_word: ἀποδώσω σοι
  choice: eu lhe pagarei
  rationale: No contexto financeiro, comunica a restituição ao hospedeiro em português natural; o objeto implícito é o valor adicional gasto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por ser natural no discurso direto em grande parte do português contemporâneo. O marcador da nota foi colocado depois de “denários”, termo ao qual a explicação cultural efetivamente se refere.
