  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: pt
  text: Do mesmo modo, também um levita chegou àquele lugar e, ao vê-lo, passou pelo outro lado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passou adiante, mantendo-se do lado oposto”. O verbo grego pode sugerir que ele evitou aproximar-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Retoma de forma natural e clara a ação anterior do sacerdote, preservando a força comparativa do advérbio.
- source_word: δὲ καὶ
  choice: também
  rationale: O conectivo δέ é leve e pode ser absorvido pelo fluxo da frase; καί acrescenta o levita como exemplo paralelo.
- source_word: Λευίτης
  choice: um levita
  rationale: Mantém a designação histórica e religiosa específica, com a forma consagrada e inteligível em português.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: chegou àquele lugar
  rationale: Expressa em português corrente a chegada ao local já definido pelo contexto, sem tornar rígida a construção participial grega.
- source_word: καὶ ἰδὼν
  choice: e, ao vê-lo
  rationale: Preserva a sequência das ações e explicita o objeto masculino recuperado do contexto.
- source_word: ἀντιπαρῆλθεν
  choice: passou pelo outro lado
  rationale: Comunica a ideia do verbo composto de passar mantendo-se no lado oposto, sugerindo a esquiva sem acrescentar explicitamente uma motivação.
theological_decisions:
- issue: Identidade histórico-religiosa de Λευίτης
  choice: levita
  alternative: servidor do templo; membro da tribo de Levi
  rationale: A transliteração preserva a identidade social e religiosa da personagem em paralelo com o sacerdote, sem inserir no texto uma explicação interpretativa.
- issue: Grau de intenção expresso por ἀντιπαρῆλθεν
  choice: passou pelo outro lado
  alternative: passou adiante; evitou-o deliberadamente
  rationale: A tradução conserva a imagem espacial e a possível ideia de esquiva, mas não torna explícita uma intenção psicológica além do que o verbo exige.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A estrutura participial foi convertida em sequência narrativa fluente, e a nota preserva a nuance espacial e possivelmente deliberada do verbo final.
