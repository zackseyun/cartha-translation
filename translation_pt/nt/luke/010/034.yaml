id: LUK.10.34
reference: Luke 10:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: pt
  text: Aproximou-se e enfaixou as feridas dele[a], derramando sobre elas azeite e vinho. Depois, colocou-o sobre seu próprio animal[b], levou-o para uma hospedaria e cuidou dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atou as feridas dele”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere a um animal usado para carga ou montaria.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: Aproximou-se
  rationale: Expressa de modo natural o particípio aoristo, preservando o movimento físico em direção ao homem ferido.
- source_word: κατέδησεν
  choice: enfaixou
  rationale: O verbo significa atar ou enfaixar, especialmente feridas; esta escolha é clara e corrente em português.
- source_word: τραύματα
  choice: feridas
  rationale: Equivalente comum e preciso para os ferimentos físicos causados pelo ataque.
- source_word: ἐπιχέων
  choice: derramando sobre elas
  rationale: Preserva a ação concomitante indicada pelo particípio presente e explicita naturalmente que o azeite e o vinho foram aplicados às feridas.
- source_word: ἔλαιον
  choice: azeite
  rationale: No contexto mediterrânico, o termo normalmente se refere a azeite de oliva; em português, “azeite” comunica isso de modo conciso e natural.
- source_word: οἶνον
  choice: vinho
  rationale: Equivalente lexical direto, sem acrescentar ao texto uma explicação sobre possível uso medicinal.
- source_word: ἐπιβιβάσας
  choice: colocou-o sobre
  rationale: Transmite de maneira idiomática a ação de pôr o ferido em cima do animal.
- source_word: ἴδιον
  choice: seu próprio
  rationale: Mantém a ênfase do grego na posse pessoal do animal.
- source_word: κτῆνος
  choice: animal
  rationale: Termo abrangente e natural para um animal de carga ou de montaria, sem especificar uma espécie que o grego não identifica.
- source_word: πανδοχεῖον
  choice: hospedaria
  rationale: Designa claramente um estabelecimento que recebia viajantes e soa natural em português contemporâneo.
- source_word: ἐπεμελήθη
  choice: cuidou
  rationale: Comunica a atenção pessoal e prática expressa pelo verbo grego médio.
