source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: pt
  text: 'Mas, em qualquer cidade em que vocês entrarem e não forem recebidos, saiam para as ruas[a] dela e digam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praças públicas” ou “ruas largas”. O termo grego se refere a vias abertas e públicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Mas, em qualquer cidade em que
  rationale: A construção relativa com ἄν é indefinida e genérica. “Em qualquer cidade em que” comunica naturalmente a possibilidade aberta, enquanto “mas” representa a transição contrastiva de δέ.
- source_word: εἰσέλθητε
  choice: vocês entrarem
  rationale: O aoristo do subjuntivo integra a construção eventual; o futuro do subjuntivo em português expressa com naturalidade a entrada que possa ocorrer.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: não os receberem
  rationale: “Receber” preserva tanto a ideia de acolher os mensageiros como a de aceitar sua presença e missão, sem restringir o sentido a uma reação meramente cordial.
- source_word: ἐξελθόντες
  choice: saiam
  rationale: 'O particípio circunstancial antecede o imperativo principal e tem força de ação associada. O imperativo coordenado em português conserva com clareza a sequência: sair e falar.'
- source_word: εἰς τὰς πλατείας αὐτῆς
  choice: para as ruas dela
  rationale: πλατεῖαι designa vias largas e públicas, podendo também abranger praças. “Ruas” é natural no contexto, e a nota preserva a amplitude lexical.
- source_word: εἴπατε
  choice: digam
  rationale: Imperativo aoristo de λέγω, traduzido pelo comando direto e corrente “digam”, que introduz a fala do versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para a segunda pessoa do plural. A ordem das ações e a construção condicional genérica do grego foram mantidas sem rigidez sintática.
