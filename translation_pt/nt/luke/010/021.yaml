id: LUK.10.21
reference: Luke 10:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: pt
  text: 'Naquela mesma hora, ele se alegrou no Espírito Santo e disse: “Eu te louvo, Pai, Senhor do céu e da terra, porque escondeste estas coisas dos sábios e dos entendidos e as revelaste às criancinhas.[a] Sim, Pai, porque assim foi do teu agrado.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos pequeninos” ou “aos bebês”. A expressão provavelmente é metafórica e descreve pessoas humildes, dependentes ou socialmente insignificantes, não apenas crianças em sentido literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque essa foi a tua boa vontade” ou “porque assim te aprouve”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Naquela mesma hora
  rationale: Preserva a ênfase demonstrativa da expressão temporal grega e soa natural em português.
- source_word: ἠγαλλιάσατο
  choice: se alegrou
  rationale: Expressa alegria intensa de modo claro e digno, sem o tom menos corrente de “exultou”.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: no Espírito Santo
  rationale: A construção articulada aponta naturalmente para o Espírito Santo; “no” preserva a possível nuance de esfera sem restringi-la a instrumento.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Eu te louvo
  rationale: No contexto de oração, o verbo comunica louvor e ação de graças. “Eu te louvo” preserva melhor a amplitude do que apenas “eu te agradeço”.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Pai, Senhor do céu e da terra
  rationale: Mantém os vocativos em aposição e traduz κύριος pelo equivalente tradicional, claro e lexicalmente adequado “Senhor”.
- source_word: ἀπέκρυψας
  choice: escondeste
  rationale: Equivalente direto e natural do aoristo ativo, preservando Deus como sujeito da ação.
- source_word: σοφῶν καὶ συνετῶν
  choice: dos sábios e dos entendidos
  rationale: Reproduz o par grego sem reduzi-lo à escolaridade formal; “entendidos” é corrente e mantém o sentido de discernimento.
- source_word: ἀπεκάλυψας αὐτὰ
  choice: as revelaste
  rationale: Preserva o contraste entre esconder e revelar; o pronome feminino retoma naturalmente “estas coisas” em português.
- source_word: νηπίοις
  choice: às criancinhas
  rationale: Mantém a imagem de crianças muito pequenas e sua provável força metafórica de dependência, humildade ou insignificância social.
- source_word: ναί, ὁ πατήρ
  choice: Sim, Pai
  rationale: Forma direta e natural do assentimento enfático seguido do vocativo.
- source_word: ὅτι οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: porque assim foi do teu agrado
  rationale: Expressa com naturalidade a ideia de algo que se mostrou agradável diante de Deus, sem transformar explicitamente a frase em “vontade graciosa”.
theological_decisions:
- issue: Referente de τῷ πνεύματι τῷ ἁγίῳ
  choice: Espírito Santo, com iniciais maiúsculas
  alternative: espírito, entendido como a disposição interior de Jesus
  rationale: A construção grega com artigo favorece a referência ao Espírito Santo. A tradução não precisa definir além disso se o dativo indica esfera ou agência.
- issue: Relação entre a ocultação, a revelação e o agrado do Pai
  choice: Manter Deus como sujeito explícito de “escondeste” e “revelaste”, seguido de “foi do teu agrado”
  alternative: Atenuar a agência divina ou parafrasear como mera resposta humana
  rationale: A sintaxe grega atribui ambas as ações ao Pai e associa esse contraste ao seu agrado; a tensão teológica deve ser preservada.
- issue: Sentido de εὐδοκία na cláusula final
  choice: agrado
  alternative: vontade graciosa; boa vontade; beneplácito
  rationale: “Agrado” mantém o sentido de aprovação ou bom prazer sem decidir se o substantivo deve ser entendido mais especificamente como decreto, vontade ou benevolência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “te/teu” na oração por fluidez e coerência, sem coloquialismo excessivo. A colocação dos marcadores segue imediatamente as expressões a que as notas se referem.
