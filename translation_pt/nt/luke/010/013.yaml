id: LUK.10.13
reference: Luke 10:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: pt
  text: “Ai de você, Corazim! Ai de você, Betsaida! Pois, se em Tiro e Sidom tivessem acontecido as obras poderosas[a] que aconteceram entre vocês, há muito tempo teriam se arrependido[b], sentados em pano de saco e cinzas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “milagres”; em grego, “obras poderosas” ou “obras de poder”.
    reason: lexical_alternative
  - marker: b
    text: Ou “teriam mudado de atitude”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ai de você
  rationale: Preserva a força profética de denúncia e lamento de οὐαί, em forma natural no português atual; o singular acompanha cada cidade interpelada separadamente.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: Corazim / Betsaida
  rationale: Emprega as formas tradicionalmente estabelecidas e amplamente reconhecidas em português para esses topônimos.
- source_word: δυνάμεις
  choice: obras poderosas
  rationale: Mantém tanto a ideia de feitos concretos quanto a de poder manifestado, sem restringir o termo à categoria mais interpretativa de “milagres”.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: tivessem acontecido ... que aconteceram
  rationale: Reproduz a repetição de γίνομαι e destaca a ocorrência dos feitos, sem introduzir um agente não expresso.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Expressa de modo idiomático o âmbito em que os feitos ocorreram, dirigindo-se conjuntamente às duas cidades.
- source_word: πάλαι
  choice: há muito tempo
  rationale: Comunica claramente a anterioridade enfática da situação contrária aos fatos.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: em pano de saco e cinzas
  rationale: Conserva a imagem bíblica concreta de luto, humilhação e arrependimento.
- source_word: καθήμενοι
  choice: sentados
  rationale: Mantém a postura vívida expressa pelo particípio grego, sem convertê-la em uma abstração.
- source_word: μετενόησαν
  choice: teriam se arrependido
  rationale: É a formulação portuguesa corrente para a mudança moral e espiritual indicada por μετανοέω neste contexto.
theological_decisions:
- issue: Natureza das δυνάμεις no ministério de Jesus
  choice: obras poderosas
  alternative: milagres; manifestações de poder
  rationale: A tradução preserva a ênfase lexical nos feitos e no poder neles manifesto, sem negar seu caráter extraordinário nem impor um termo técnico mais estreito.
- issue: Força da imagem de arrependimento
  choice: teriam se arrependido, sentados em pano de saco e cinzas
  alternative: teriam demonstrado arrependimento com roupas de luto e cinzas
  rationale: A imagem concreta e profética do grego é mantida, inclusive a postura de estar sentado, em vez de ser substituída por uma explicação abstrata.
- issue: Referente implícito do plural em “teriam se arrependido”
  choice: manter o sujeito implícito
  alternative: os habitantes de Tiro e Sidom teriam se arrependido
  rationale: O contexto identifica suficientemente os habitantes das cidades, e evitar a explicitação impede acrescentar ao texto palavras que não aparecem no grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. A construção preserva o paralelismo enfático, a condição contrária aos fatos e a imagem histórica de pano de saco e cinzas. O plural sem sujeito expresso remete naturalmente aos habitantes de Tiro e Sidom.
