  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: pt
  text: 'Em qualquer casa em que entrarem, digam primeiro: “Paz a esta casa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que haja paz nesta casa” ou “Paz sobre esta casa”. O grego emprega uma fórmula breve de saudação e bênção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: Em qualquer casa em que
  rationale: A construção com pronome relativo e ἄν forma uma oração relativa indefinida. Em português, “em qualquer casa em que” expressa naturalmente a ideia geral; o verbo “entrar” já comunica o movimento indicado por εἰς.
- source_word: εἰσέλθητε
  choice: entrarem
  rationale: O aoristo do subjuntivo na oração relativa indefinida tem sentido geral voltado para cada ocasião futura. O futuro do subjuntivo é a forma idiomática em português.
- source_word: οἰκίαν
  choice: casa
  rationale: Refere-se primariamente à habitação na qual os discípulos entram. “Casa” mantém o sentido concreto e a ligação verbal com οἴκῳ na bênção.
- source_word: πρῶτον
  choice: primeiro
  rationale: 'Marca prioridade na sequência: a saudação deve ser a primeira ação ao entrar.'
- source_word: λέγετε
  choice: digam
  rationale: O imperativo prescreve as palavras a serem pronunciadas. “Digam” é direto, natural e adequado ao tratamento plural do contexto.
- source_word: Εἰρήνη
  choice: Paz
  rationale: Preserva a fórmula breve de saudação e bênção, sem acrescentar um verbo ausente no grego.
- source_word: τῷ οἴκῳ τούτῳ
  choice: a esta casa
  rationale: O dativo indica o destinatário da paz. “A esta casa” é conciso e mantém a possível abrangência da casa como moradia e seus moradores.
theological_decisions:
- issue: Natureza da fórmula de paz
  choice: “Paz a esta casa” como saudação e bênção pronunciada
  alternative: “Que haja paz nesta casa” ou “Paz sobre esta casa”
  rationale: A expressão ecoa uma fórmula judaica de saudação e bênção. A redação escolhida conserva sua força performativa e concisão, sem reduzi-la a um simples cumprimento nem acrescentar formulação litúrgica.
- issue: Alcance de “casa” na bênção
  choice: Manter “casa” sem explicitar “família” ou “moradores”
  alternative: “Paz a esta família” ou “Paz aos moradores desta casa”
  rationale: οἶκος pode incluir a casa e seus membros, mas o contexto também retém a imagem concreta da habitação. A tradução preserva essa amplitude em vez de resolver a referência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Em qualquer casa em que entrarem” evita a construção menos idiomática “em qualquer casa que entrarem”; a fórmula “Paz a esta casa” conserva a concisão e o sabor semítico do original.
