source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: pt
  text: 'Então ele lhe disse: “O que está escrito na Lei? Como você a lê?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como você a interpreta?” Em sentido mais literal, o grego diz: “Como você a lê?”, expressão que também pode envolver a ideia de compreensão ou interpretação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Então ele
  rationale: δέ é um conectivo leve; “Então” mantém o fluxo narrativo natural sem criar um contraste forte. O artigo tem função pronominal, indicando “ele”.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lhe disse
  rationale: Expressa de modo natural λέγω com πρός e acusativo, identificando o destinatário sem acrescentar a ideia explícita de resposta.
- source_word: Ἐν τῷ νόμῳ
  choice: na Lei
  rationale: νόμος se refere aqui à Lei reconhecida nas Escrituras de Israel. A inicial maiúscula distingue esse corpo de escritos de uma lei genérica.
- source_word: τί γέγραπται
  choice: O que está escrito
  rationale: O perfeito passivo indica aquilo que foi escrito e permanece registrado; “está escrito” conserva essa força e é idiomático em português.
- source_word: πῶς
  choice: Como
  rationale: Mantém aberta a pergunta quanto ao modo de ler e, no contexto, possivelmente de compreender.
- source_word: ἀναγινώσκεις
  choice: você a lê
  rationale: O sentido lexical básico é “ler”. O pronome “a” retoma naturalmente “a Lei”; a possível nuance de compreensão ou interpretação é preservada em nota.
theological_decisions:
- issue: Sentido de νόμος na pergunta de Jesus
  choice: A Lei como o corpo reconhecido da lei escriturística dada a Israel, grafada com inicial maiúscula
  alternative: Torá; lei em sentido genérico
  rationale: O diálogo ocorre com um especialista na Lei dentro do contexto judaico. “Lei” é acessível em português e não restringe o referente além do que o grego exige.
- issue: Nuance interpretativa de πῶς ἀναγινώσκεις
  choice: Manter “Como você a lê?”
  alternative: “Como você a interpreta?”
  rationale: Embora a pergunta possa envolver compreensão e interpretação, o verbo grego significa primariamente “ler”. A tradução conserva a abertura retórica e teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” oferece tratamento natural e amplamente compreensível; “lhe disse” evita repetição pesada. A formulação preserva a concisão e as duas perguntas paralelas do grego.
