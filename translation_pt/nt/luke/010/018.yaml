base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: pt
  text: 'E ele lhes disse: “Eu estava observando[a] Satanás cair do céu como um relâmpago.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu vi Satanás cair do céu como um relâmpago”. O verbo grego no imperfeito também pode ser traduzido de modo mais simples por “vi”, embora “estava observando” preserve melhor seu aspecto durativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: E ele lhes disse
  rationale: O aoristo εἶπεν é traduzido como passado narrativo simples; δέ funciona como conexão leve, e αὐτοῖς como objeto indireto plural.
- source_word: Ἐθεώρουν
  choice: Eu estava observando
  rationale: A locução no imperfeito preserva o aspecto durativo de ἐθεώρουν e soa mais natural em português do que “eu estava vendo”.
- source_word: τὸν Σατανᾶν
  choice: Satanás
  rationale: Mantém a forma consagrada em português para o nome ou título pessoal Σατανᾶς.
- source_word: ὡς ἀστραπὴν
  choice: como um relâmpago
  rationale: Expressa naturalmente a comparação introduzida por ὡς.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: do céu
  rationale: Neste contexto, οὐρανός designa o âmbito celeste, sem excluir a força visual da imagem.
- source_word: πεσόντα
  choice: cair
  rationale: O particípio aoristo, ligado a Satanás como objeto de percepção, é vertido naturalmente em português pelo infinitivo “cair”.
theological_decisions:
- issue: Referência temporal e aspecto da queda de Satanás
  choice: “Eu estava observando Satanás cair” preserva a apresentação durativa da visão ou percepção.
  alternative: “Eu vi Satanás cair”
  rationale: O grego não determina se Jesus se refere a uma queda primordial, ao efeito presente da missão dos discípulos ou a uma visão profética da derrota de Satanás. A tradução mantém essa tensão sem impor uma cronologia doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem “cair do céu como um relâmpago” evita que “do céu” pareça modificar “relâmpago” e preserva a relação sintática com a queda.
