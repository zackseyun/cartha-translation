  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: pt
  text: 'Mas Marta estava distraída com muito serviço. Então, aproximou-se e disse: “Senhor, não te importa que minha irmã tenha me deixado sozinha para servir?[a] Manda, pois, que ela venha me ajudar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não te preocupas com o fato de minha irmã ter me deixado sozinha para servir?”'
    reason: Alternativa lexical para οὐ μέλει σοι, que também pode ser expressa em termos de cuidado ou preocupação.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: estava distraída
  rationale: O imperfeito retrata uma situação contínua, e o verbo indica que Marta estava sendo desviada ou absorvida por suas tarefas. “Estava distraída” preserva o contraste contextual com a atenção de Maria.
- source_word: περὶ πολλὴν διακονίαν
  choice: com muito serviço
  rationale: No ambiente doméstico, διακονία se refere ao trabalho prático de servir. “Muito serviço” é natural e evita restringir o sentido a “muitos preparativos” ou ampliá-lo para um ministério formal.
- source_word: ἐπιστᾶσα
  choice: aproximou-se
  rationale: O particípio indica que Marta chegou perto antes de falar. “Aproximou-se” expressa isso com clareza e dignidade.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma corrente e contextualmente adequada de traduzir κύριος como título respeitoso dirigido a Jesus.
- source_word: οὐ μέλει σοι
  choice: não te importa
  rationale: A expressão pergunta se a situação é motivo de interesse ou preocupação para Jesus. A tradução preserva a força queixosa da pergunta sem intensificá-la indevidamente.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: tenha me deixado sozinha para servir
  rationale: A formulação conserva tanto μόνην, “sozinha”, quanto o infinitivo διακονεῖν, “servir”, sem recorrer ao excessivamente forte “abandonado”.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Manda, pois, que ela
  rationale: No contexto, dizer a Maria que ajude equivale a dar-lhe uma instrução. “Pois” mantém a força conclusiva de οὖν.
- source_word: συναντιλάβηται
  choice: venha me ajudar
  rationale: O verbo descreve alguém que se junta a outra pessoa para ajudá-la. “Venha me ajudar” torna explícita de modo natural essa participação conjunta.
theological_decisions:
- issue: Tradução de κύριος na fala de Marta dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva o título respeitoso e se harmoniza com o uso mais amplo de κύριος para Jesus em Lucas, sem exigir que o versículo resolva isoladamente todas as implicações cristológicas do título.
translation_notes:
  register: Português moderno, natural e digno, com leitura fluente no Brasil e compreensão ampla no espaço lusófono. “Muito serviço” mantém a concretude da cena doméstica; “Manda, pois” conserva a franqueza de Marta e a relação lógica indicada por οὖν.
