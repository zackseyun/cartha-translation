  source_fidelity: 'A tradução transmite com fidelidade os elementos centrais do grego: o estado contínuo de Marta em περιεσπᾶτο, o serviço doméstico em πολλὴν διακονίαν, sua aproximação antes de falar, a pergunta de reprovação, o fato de ter sido deixada a servir sozinha e o pedido para que Maria se junte a ela. «Manda, pois» é uma forma legítima de representar o imperativo εἰπὲ com a inferência de οὖν, sem alterar o sentido.'
  naturalness: O texto é fluente, moderno e amplamente compreensível em português internacional, com boa legibilidade brasileira. «Estava distraída com muito serviço», «aproximou-se» e «venha me ajudar» soam naturais no registro narrativo. A colocação pronominal em «tenha me deixado» é corrente no português brasileiro e não compromete a compreensão mais ampla.
  terminology: «Senhor» corresponde adequadamente a Κύριε e preserva o uso estabelecido para o título dirigido a Jesus. «Serviço/servir» mantém o campo semântico doméstico de διακονία/διακονεῖν sem introduzir a conotação institucional de «ministério». A nota oferece uma alternativa lexical plausível para οὐ μέλει σοι e conserva a pergunta original.
