  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: pt
  text: 'Jesus respondeu: “Certo homem descia de Jerusalém para Jericó e caiu nas mãos de assaltantes. Eles lhe tiraram as roupas, espancaram-no e foram embora, deixando-o quase morto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: Jesus respondeu
  rationale: No contexto de diálogo, o particípio ὑπολαβών introduz a resposta de Jesus; esta formulação é natural e fiel em português.
- source_word: Ἄνθρωπός τις
  choice: Certo homem
  rationale: Preserva a referência indefinida do grego sem sugerir uma personagem identificável.
- source_word: κατέβαινεν
  choice: descia
  rationale: Mantém tanto o movimento geográfico de Jerusalém para Jericó quanto o aspecto imperfeito da ação em curso.
- source_word: λῃσταῖς περιέπεσεν
  choice: caiu nas mãos de assaltantes
  rationale: Expressão idiomática corrente que comunica ter sido surpreendido e dominado por ladrões violentos.
- source_word: ἐκδύσαντες αὐτὸν
  choice: lhe tiraram as roupas
  rationale: Explicita naturalmente o objeto implícito em português e preserva a ideia de despir a vítima.
- source_word: πληγὰς ἐπιθέντες
  choice: espancaram-no
  rationale: Equivalente idiomático conciso para infligir golpes ou ferimentos repetidos.
- source_word: ἡμιθανῆ
  choice: quase morto
  rationale: Formulação portuguesa natural para o estado de estar semimorto, à beira da morte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência narrativa foi mantida clara e direta; não há necessidade de nota textual ou teológica neste versículo.
