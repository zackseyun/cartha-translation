  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: pt
  text: E, em qualquer cidade em que entrarem, se os receberem, comam o que for posto diante de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: em qualquer cidade
  rationale: A construção relativa com ἄν tem sentido indefinido e geral. Em português, “em qualquer cidade” expressa isso naturalmente; o movimento para dentro já fica claro com “entrarem”, sem necessidade de reproduzir εἰς de modo rígido.
- source_word: εἰσέρχησθε
  choice: entrarem
  rationale: O presente do subjuntivo integra uma construção geral e indefinida. “Entrarem” é a forma portuguesa natural nesse contexto.
- source_word: δέχωνται ὑμᾶς
  choice: forem recebidos
  rationale: δέχομαι admite os sentidos de receber e acolher. “Forem recebidos” mantém correspondência lexical próxima e, ligado por “e”, preserva a forma coordenada do grego sem tornar a frase pouco natural.
- source_word: ἐσθίετε
  choice: comam
  rationale: O presente imperativo comunica uma instrução direta. “Comam” é claro, atual e adequado ao tratamento plural do contexto.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: o que lhes for posto diante de vocês
  rationale: A expressão preserva o sentido passivo do particípio de παρατίθημι e a imagem da comida colocada diante dos discípulos. A combinação de “lhes” com “vocês” é idiomática no português brasileiro e mantém explícitos tanto o destinatário quanto a expressão espacial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação “e forem recebidos” conserva mais de perto o καί do texto grego; o valor circunstancial equivalente a “se os receberem” permanece perceptível pelo contexto geral indefinido.
