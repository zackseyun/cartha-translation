source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: pt
  text: 'Mas o Senhor lhe respondeu: “Marta, Marta, você está preocupada e agitada com muitas coisas,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Mas o Senhor lhe respondeu
  rationale: A construção participial idiomática com εἶπεν é expressa naturalmente por um único verbo finito em português. “Mas” comunica o contraste suave entre a queixa de Marta e a resposta do Senhor; “lhe” representa o objeto indireto.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título narrativo e cristológico habitual em Lucas, sem reduzi-lo ao sentido apenas social de “mestre”.
- source_word: Μάρθα Μάρθα
  choice: Marta, Marta
  rationale: Mantém a repetição do vocativo, que transmite ênfase e solicitude.
- source_word: μεριμνᾷς
  choice: você está preocupada
  rationale: Expressa de modo corrente e claro a preocupação interior indicada pelo verbo, com boa legibilidade internacional e brasileira.
- source_word: θορυβάζῃ
  choice: agitada
  rationale: Comunica perturbação e tumulto interior, preservando a distinção em relação à preocupação expressa por μεριμνᾷς.
- source_word: περὶ πολλά
  choice: com muitas coisas
  rationale: Formulação natural em português que mantém a amplitude do original, sem especificar quais eram as preocupações.
theological_decisions:
- issue: Tradução de κύριος como título de Jesus
  choice: o Senhor
  alternative: o mestre
  rationale: “Senhor” conserva tanto o valor respeitoso quanto a ressonância cristológica do título no relato lucano; “mestre” restringiria essa amplitude.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada para soar natural em português, sem eliminar a dupla descrição do estado de Marta nem a repetição enfática de seu nome.
