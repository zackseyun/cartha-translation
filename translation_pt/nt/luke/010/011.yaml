source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: pt
  text: 'Até o pó da cidade de vocês que aderiu aos nossos pés[a], nós o removemos contra vocês[b]. Contudo, saibam disto: o Reino de Deus se aproximou[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se prendeu a nós, vindo da cidade de vocês, nos pés”. A construção grega é pouco usual e descreve o pó da cidade aderido aos pés dos mensageiros.'
    reason: lexical_alternative
  - marker: b
    text: Muitas traduções trazem “sacudimos”, mas o verbo grego empregado aqui significa mais especificamente “limpar” ou “remover esfregando”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “chegou perto”. O tempo perfeito grego indica que o Reino se aproximou, com relevância contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: pó
  rationale: Refere-se especificamente a pó, e a escolha preserva a força simbólica do gesto neste contexto missionário.
- source_word: κολληθέντα
  choice: ficou grudado
  rationale: Expressa de modo natural o pó que aderiu aos mensageiros, preservando o sentido de κολλάομαι.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: da cidade de vocês
  rationale: Comunica com naturalidade a origem do pó indicada por ἐκ.
- source_word: εἰς τοὺς πόδας
  choice: em nossos pés
  rationale: No contexto idiomático, descreve o pó aderido aos pés; a formulação evita a literalidade pouco natural de 'para os pés'.
- source_word: ἀπομασσόμεθα
  choice: nós o limpamos
  rationale: O verbo indica mais especificamente limpar ou remover esfregando, não simplesmente sacudir; o pronome retoma claramente 'pó'.
- source_word: ὑμῖν
  choice: contra vocês
  rationale: Neste contexto, o dativo comunica a direção testemunhal e adversativa do gesto, feito como sinal contra os ouvintes que rejeitam a mensagem.
- source_word: πλήν
  choice: Contudo
  rationale: 'Marca a ressalva enfática: apesar do gesto de juízo, permanece uma verdade que os ouvintes devem reconhecer.'
- source_word: γινώσκετε
  choice: saibam
  rationale: Reproduz diretamente o imperativo plural, em linguagem portuguesa atual.
- source_word: ἤγγικεν
  choice: chegou perto
  rationale: 'Preserva o valor do perfeito: a aproximação ocorreu e sua relevância continua, sem sugerir consumação plena.'
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É a expressão tradicional, clara e natural, e não reduz βασιλεία apenas a território nem elimina sua dimensão de governo.
theological_decisions:
- issue: Força do gesto de limpar o pó
  choice: Um ato simbólico de testemunho e juízo contra a cidade que rejeita a mensagem
  alternative: Uma ação meramente higiênica ou ligada à viagem
  rationale: O dativo ὑμῖν e o contexto do discurso missionário conferem ao gesto uma direção adversativa e testemunhal; 'contra vocês' preserva essa força sem explicitar além do texto.
- issue: Sentido da proximidade do Reino
  choice: O Reino de Deus chegou perto e essa proximidade continua relevante
  alternative: O Reino é apenas temporalmente iminente, ou já está plenamente consumado
  rationale: O perfeito ἤγγικεν expressa proximidade alcançada com efeito presente, preservando a tensão escatológica sem afirmar consumação final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa 'vocês' para o plural explícito e 'Reino de Deus' como formulação consagrada. A ordem foi ajustada para fluidez sem apagar a construção grega difícil; a ambiguidade relevante é registrada em nota.
