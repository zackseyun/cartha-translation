source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: pt
  text: Por acaso, certo sacerdote descia por aquela estrada e, ao vê-lo, passou pelo outro lado da estrada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo menos explícito, “passou adiante”; o verbo grego sugere que ele passou mantendo-se do lado oposto, o que pode indicar uma atitude deliberada de evitar o homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: por acaso
  rationale: A expressão idiomática indica uma ocorrência casual ou coincidente. “Por acaso” é a forma mais natural em português e não pretende fazer uma afirmação filosófica sobre a providência ou o acaso.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ é um conectivo narrativo leve. A progressão do relato já fica natural em português sem acrescentar “então”, “ora” ou “mas”.
- source_word: ἱερεύς τις
  choice: certo sacerdote
  rationale: “Certo” preserva a indefinição individual de τις, apresentando uma pessoa específica, mas não identificada.
- source_word: κατέβαινεν
  choice: descia
  rationale: O pretérito imperfeito preserva o aspecto durativo e de pano de fundo do imperfeito grego; no contexto, também mantém a ideia de deslocamento descendente.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: por aquela estrada
  rationale: Com ὁδός, a preposição é traduzida idiomaticamente por “por”; “aquela estrada” retoma o caminho mencionado no contexto.
- source_word: ἰδὼν αὐτὸν
  choice: ao vê-lo
  rationale: 'A construção temporal concisa reproduz naturalmente o particípio aoristo: a ação seguinte ocorre quando o sacerdote vê o homem.'
- source_word: ἀντιπαρῆλθεν
  choice: passou pelo lado oposto
  rationale: O verbo composto sugere passar mantendo-se do lado contrário, e não apenas seguir adiante. A tradução conserva a ideia de afastamento ou evitação sem explicitar além do que o verbo permite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Certo sacerdote” preserva a especificidade indefinida do grego, e “passou pelo lado oposto” comunica de forma natural a força do verbo composto.
