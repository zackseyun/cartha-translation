id: LUK.10.15
reference: Luke 10:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: pt
  text: E você, Cafarnaum, será elevada até o céu? Até o Hades[a] você será rebaixada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mundo dos mortos”. Em grego, “Hades”, não Geena (“inferno”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Cafarnaum
  rationale: Usa a forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: μὴ ... ὑψωθήσῃ
  choice: será elevada
  rationale: Mantém a pergunta retórica que espera resposta negativa e preserva o sentido figurado de elevação ou exaltação. O feminino concorda com a cidade de Cafarnaum subentendida.
- source_word: ἕως οὐρανοῦ
  choice: até o céu
  rationale: Preserva a ideia de extensão vertical expressa por ἕως e o contraste com a descida ao Hades.
- source_word: ἕως τοῦ ᾅδου
  choice: até o Hades
  rationale: Mantém a distinção lexical entre ᾅδης, o mundo dos mortos, e Geena, evitando traduzir o termo por 'inferno' e assim impor associações doutrinárias posteriores.
- source_word: καταβιβασθήσῃ
  choice: você será rebaixada
  rationale: Preserva a voz passiva e reúne as ideias de movimento para baixo e humilhação. 'Será levada para baixo' seria mais literal, mas menos natural em português.
theological_decisions:
- issue: Tradução de ᾅδης
  choice: Hades
  alternative: mundo dos mortos; inferno
  rationale: A transliteração preserva a diferença entre Hades e Geena. A nota explica o termo sem identificar automaticamente o Hades com o lugar de punição final.
- issue: Forma de μὴ ... ὑψωθήσῃ
  choice: 'pergunta retórica: ''será elevada até o céu?'''
  alternative: 'declaração: ''não será elevada até o céu'''
  rationale: A partícula μὴ favorece uma pergunta que espera resposta negativa; a forma interrogativa conserva a força retórica e a tensão do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de 'até' conserva o paralelismo vertical do original; 'rebaixada' comunica tanto descida quanto humilhação sem ampliar o verbo para 'lançada'.
