  source_fidelity: 'A tradução preserva adequadamente todos os elementos do grego: o marcador narrativo «Καὶ ἰδού», «νομικός τις» no sentido de especialista na Lei judaica, o levantar-se, a intenção de pôr Jesus à prova, a forma de tratamento e a pergunta que mantém tanto «fazer» quanto «herdar». «Para pô-lo à prova» representa com naturalidade o particípio ἐκπειράζων e seu sentido examinador/adversarial sem extrapolá-lo.'
  naturalness: O texto é claro, digno e natural em português moderno de ampla compreensão. «E eis que» conserva um leve tom narrativo bíblico sem se tornar obscuro; «certo especialista na Lei» evita o anacronismo provável de «advogado»; e «o que devo fazer para herdar a vida eterna?» é idiomático e fiel.
  terminology: «Especialista na Lei», com «Lei» maiúscula, comunica apropriadamente o referente à Lei de Moisés. «Mestre», «vida eterna» e «herdar» são escolhas estabelecidas, compreensíveis e semanticamente adequadas. Não há imposição doutrinária nem alteração da tensão entre fazer e herdar.
