id: LUK.10.25
reference: Luke 10:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: pt
  text: 'E eis que certo especialista na Lei se levantou para pô-lo à prova, dizendo: “Mestre, o que devo fazer para herdar a vida eterna?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva tanto a conexão narrativa de καί quanto a função de ἰδού de chamar a atenção, em linguagem bíblica ainda compreensível em português moderno.
- source_word: νομικός τις
  choice: certo especialista na Lei
  rationale: Evita que “advogado” seja entendido como um profissional jurídico moderno e comunica diretamente que se trata de alguém versado na Lei de Moisés. A inicial maiúscula em “Lei” sinaliza esse referente específico.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Reproduz de modo direto e natural a ação expressa pelo aoristo.
- source_word: ἐκπειράζων αὐτὸν
  choice: para pô-lo à prova
  rationale: Expressa a finalidade ou intenção do ato e conserva a ideia de teste, sem sugerir necessariamente uma tentativa de sedução ao pecado, como poderia ocorrer com “tentá-lo”.
- source_word: λέγων
  choice: dizendo
  rationale: Mantém o fluxo participial do grego e soa natural na construção portuguesa.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: É a forma corrente, digna e contextual de dirigir-se a um mestre religioso em português.
- source_word: τί ποιήσας
  choice: o que devo fazer
  rationale: Reestrutura idiomaticamente o particípio aoristo ligado ao futuro, preservando a pergunta sobre a ação necessária sem acrescentar uma conclusão teológica.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão portuguesa corrente e semanticamente adequada para o sintagma grego.
- source_word: κληρονομήσω
  choice: herdar
  rationale: Mantém a metáfora de receber uma herança, relevante no vocabulário bíblico, em vez de reduzi-la a “obter” ou “receber”.
theological_decisions:
- issue: Sentido de νομικός no contexto judaico do Segundo Templo
  choice: especialista na Lei
  alternative: advogado; doutor da Lei; intérprete da Lei
  rationale: A personagem é versada na interpretação da Torá, não um advogado secular no sentido moderno. A formulação escolhida torna isso explícito sem impor uma filiação institucional mais específica.
- issue: Força de τί ποιήσας ... κληρονομήσω
  choice: o que devo fazer para herdar a vida eterna?
  alternative: o que farei para herdar a vida eterna?; fazendo o quê herdarei a vida eterna?
  rationale: A formulação portuguesa transmite naturalmente a relação entre ação e resultado apresentada na pergunta. Preserva a tensão entre “fazer” e “herdar”, sem harmonizá-la ou explicá-la doutrinariamente.
- issue: Intenção de ἐκπειράζων
  choice: para pô-lo à prova
  alternative: tentando-o; testando-o
  rationale: A escolha conserva o caráter intencional e potencialmente adversarial do teste, mas não especifica além do que o verbo e o contexto permitem.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmo excessivo. “E eis que” conserva a vivacidade narrativa do grego; “especialista na Lei” privilegia clareza histórica; e “pô-lo” mantém correção e concisão sem prejudicar a compreensão.
