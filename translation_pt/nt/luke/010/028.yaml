  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: pt
  text: 'E ele lhe disse: “Você respondeu corretamente. Faça isso e viverá.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O contexto mais amplo trata da vida eterna (ver Lucas 10:25), mas aqui o grego diz simplesmente: “viverá”.'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Então ele lhe disse
  rationale: O aoristo de λέγω é traduzido naturalmente por “disse”; αὐτῷ é o objeto indireto “lhe”. δέ é um conectivo leve, e “então” mantém o fluxo narrativo sem impor forte contraste.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Você respondeu corretamente
  rationale: Ὀρθῶς significa “corretamente” ou “com acerto”, e o aoristo ἀπεκρίθης descreve a resposta já dada. A formulação é clara e corrente em português.
- source_word: τοῦτο ποίει
  choice: Faça isso
  rationale: τοῦτο retoma o mandamento citado, e ποίει é imperativo presente. “Faça isso” é idiomático e preserva a ordem, embora o presente grego também possa sugerir prática contínua.
- source_word: καὶ ζήσῃ
  choice: e viverá
  rationale: ζήσῃ é futuro de ζάω e significa literalmente “viverá”. A tradução evita acrescentar “herdará a vida eterna”, expressão não repetida nesta oração.
theological_decisions:
- issue: Alcance de “viverá” no contexto da vida eterna
  choice: e viverá
  alternative: e herdará a vida eterna
  rationale: Lucas 10:25 estabelece que a conversa trata da vida eterna, mas esta oração diz apenas καὶ ζήσῃ, “e viverá”. Mantém-se a concisão e a tensão do texto grego, registrando o contexto em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O uso de “você” torna explícito o singular de ἀπεκρίθης e ποίει sem recorrer a uma forma regional ou excessivamente solene. A nota foi colocada após a oração a que se refere.
