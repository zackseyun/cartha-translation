id: LUK.4.12
reference: Luke 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: pt
  text: 'E Jesus lhe respondeu: “Foi dito: ‘Não ponha à prova o Senhor, seu Deus’”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma tradicional em muitas traduções é “Está escrito”. O grego aqui diz literalmente “Foi dito”.
    reason: alternative_reading
  - marker: b
    text: Citação de Deuteronômio 6:16. No hebraico, esse texto traz o nome divino YHWH, muitas vezes representado como “SENHOR”.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: lhe respondeu
  rationale: A construção com particípio e verbo finito é um modo semitizante comum de expressar uma resposta. “Lhe respondeu” é natural em português e mantém o referente pronominal sem a redundância de “respondendo, disse-lhe”.
- source_word: ὅτι
  choice: —
  rationale: Depois de “respondeu”, o português pode introduzir diretamente o conteúdo da fala; traduzir ὅτι por “que” deixaria a frase menos natural neste contexto.
- source_word: Εἴρηται
  choice: Foi dito
  rationale: O perfeito passivo de λέγω significa literalmente “foi dito” ou “está dito”. A forma escolhida preserva o verbo grego, em vez de substituí-lo pela fórmula tradicional “está escrito”.
- source_word: Οὐκ ἐκπειράσεις
  choice: Não ponha à prova
  rationale: ἐκπειράζω significa testar ou pôr à prova. A formulação evita o sentido moderno possivelmente enganoso de “tentar”, como induzir alguém ao pecado. O imperativo negativo natural em português comunica a força normativa do futuro grego na citação.
- source_word: κύριον
  choice: o Senhor
  rationale: Traduz κύριος de modo direto e natural. O artigo é adequado na expressão portuguesa “o Senhor, seu Deus”.
- source_word: τὸν θεόν σου
  choice: seu Deus
  rationale: Preserva a relação expressa pelo possessivo e a aposição a “o Senhor”. “Seu” concorda com o tratamento de terceira pessoa adotado no mandamento.
theological_decisions:
- issue: Fórmula de citação bíblica (Εἴρηται)
  choice: Foi dito
  alternative: Está escrito
  rationale: O texto grego emprega o perfeito passivo de λέγω, não γράφω. A tradução principal preserva essa diferença, enquanto a forma tradicional é registrada em nota.
- issue: κύριος numa citação de Deuteronômio 6:16
  choice: o Senhor
  alternative: SENHOR
  rationale: A tradução segue diretamente o grego κύριον. A nota informa que o texto hebraico citado traz o nome divino YHWH, frequentemente representado por “SENHOR”.
- issue: Forma do mandamento em Οὐκ ἐκπειράσεις
  choice: Não ponha à prova
  alternative: Você não porá à prova
  rationale: Embora a forma grega seja futuro do indicativo, ela reproduz o uso normativo da citação e funciona como proibição. O imperativo negativo é a expressão idiomática correspondente em português, sem alterar sua força.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “seu” em vez de “teu” para manter um tratamento corrente de terceira pessoa. A pontuação distingue a fala de Jesus da citação bíblica nela contida; os dois marcadores de nota aparecem no texto principal.
