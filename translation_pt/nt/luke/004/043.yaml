id: LUK.4.43
reference: Luke 4:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “Também preciso anunciar as boas-novas do Reino de Deus às outras cidades, pois foi para isso que fui enviado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Mas ele lhes disse
  rationale: O δέ assinala aqui um contraste leve com o desejo da multidão de retê-lo; a formulação é natural e preserva o movimento narrativo.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: Também ... às outras cidades
  rationale: καί tem sentido aditivo, e ἑτέραις distingue essas cidades do lugar presente. “Cidades” corresponde diretamente a πόλεσιν.
- source_word: εὐαγγελίσασθαί
  choice: anunciar as boas-novas
  rationale: O infinitivo significa levar ou anunciar uma boa notícia. A escolha preserva a força verbal e é clara em português atual, sem restringir o termo ao ato formal de pregar.
- source_word: με δεῖ
  choice: preciso
  rationale: δεῖ expressa forte necessidade, frequentemente associada à missão divina em Lucas. “Preciso” comunica essa necessidade de modo conciso e natural.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão central em Lucas, mantida em sua forma tradicional e transparente, sem decidir entre as nuances de reinado e domínio.
- source_word: ἐπὶ τοῦτο
  choice: foi para isso
  rationale: A expressão indica finalidade. A construção portuguesa torna explícito e idiomático o vínculo de propósito sem acrescentar conteúdo.
- source_word: ἀπεστάλην
  choice: fui enviado
  rationale: Preserva a voz passiva e a linguagem de missão, sem nomear o agente que o texto deixa implícito nem importar terminologia técnica posterior.
theological_decisions:
- issue: Força da necessidade da missão de Jesus
  choice: “preciso” preserva uma necessidade forte ligada à missão
  alternative: “é necessário que eu” ou “devo”
  rationale: Em Lucas, δεῖ muitas vezes sugere necessidade divina. A tradução mantém esse peso sem explicar no texto principal a origem da necessidade.
- issue: Identidade daquele que enviou Jesus
  choice: manter a passiva “fui enviado” sem identificar o agente
  alternative: explicitar “Deus me enviou”
  rationale: Embora o contexto teológico sugira Deus como agente, o grego não o nomeia neste versículo; preservar a passiva mantém a tensão e evita expansão interpretativa.
- issue: Sentido de βασιλεία τοῦ θεοῦ
  choice: “Reino de Deus”
  alternative: “reinado de Deus”
  rationale: “Reino de Deus” preserva a expressão central e sua amplitude sem limitar o sentido somente ao exercício do governo ou somente a um domínio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” mantém o sentido de notícia favorável e a ressonância bíblica sem recorrer a linguagem excessivamente eclesiástica. Não foram incluídas notas porque as alternativas lexicais não são necessárias para compreender nem para preservar uma ambiguidade relevante do original.
