source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: pt
  text: E, levando-o para o alto, mostrou-lhe todos os reinos do mundo habitado[a] num instante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do mundo”. O termo grego frequentemente significa “mundo habitado” e, em alguns contextos, pode referir-se mais especificamente ao mundo civilizado ou imperial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “num ponto de tempo”; isto é, num instante.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: levando-o para o alto
  rationale: Preserva o particípio aoristo e a ideia de movimento ascendente, sem acrescentar um monte, que não é mencionado no texto de Lucas.
- source_word: ἔδειξεν αὐτῷ
  choice: mostrou-lhe
  rationale: É a correspondência narrativa direta e natural para o verbo δείκνυμι com objeto indireto.
- source_word: πάσας τὰς βασιλείας
  choice: todos os reinos
  rationale: No plural, βασιλεία designa aqui reinos ou domínios, e πάσας pede a totalidade expressa por “todos”.
- source_word: τῆς οἰκουμένης
  choice: do mundo habitado
  rationale: Mantém a especificidade lexical de οἰκουμένη, que pode indicar o mundo habitado e, em certos contextos, o mundo civilizado ou imperial, sem restringi-lo ao Império Romano.
- source_word: ἐν στιγμῇ χρόνου
  choice: num instante
  rationale: Expressa em português corrente a extrema brevidade indicada por στιγμή com χρόνου, sem perder o sentido temporal.
theological_decisions:
- issue: Natureza da apresentação dos reinos pelo diabo
  choice: Descrever apenas que ele os mostrou, sem explicar o mecanismo.
  alternative: Especificar uma visão sobrenatural ou uma observação literal a partir de um lugar elevado.
  rationale: O grego não esclarece se a apresentação foi visionária, sobrenatural ou geográfica; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Para o alto” evita importar o monte do paralelo em Mateus; “num instante” é mais natural que uma reprodução rígida da expressão grega.
