source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: pt
  text: 'E o espanto tomou conta de todos, e eles conversavam entre si, dizendo: “Que palavra é esta,[a] que dá ordens aos espíritos imundos com autoridade e poder, e eles saem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Que mensagem é esta?” A palavra grega logos pode significar “palavra”, “mensagem” ou “assunto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: espanto
  rationale: Expressa forte assombro ou perplexidade em português atual, sem soar arcaico.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: tomou conta de todos
  rationale: Reproduz de modo natural a ideia de algo que sobrevém a todas as pessoas presentes.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: conversavam entre si
  rationale: O imperfeito indica uma troca continuada, e a expressão recíproca aponta para conversa mútua.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Que palavra é esta
  rationale: Mantém a concisão e a amplitude de λόγος, que neste contexto pode apontar para a palavra proferida, a mensagem ou a natureza da ordem.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: com autoridade e poder
  rationale: Trata ἐν como modal ou instrumental, conserva a ordem grega e distingue autoridade de poder eficaz.
- source_word: ἐπιτάσσει
  choice: dá ordens
  rationale: Comunica de maneira corrente a ação de ordenar com autoridade e mantém o presente vívido.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: aos espíritos impuros
  rationale: É uma formulação clara e natural no português moderno para seres espirituais caracterizados como ἀκάθαρτοι, sem reduzir o referente a uma metáfora psicológica.
- source_word: ἐξέρχονται
  choice: eles saem
  rationale: Preserva o sentido direto da saída dos espíritos e o presente do texto grego.
theological_decisions:
- issue: Designação dos seres demoníacos no contexto de exorcismo
  choice: espíritos impuros
  alternative: espíritos imundos
  rationale: Preserva o referente sobrenatural e a caracterização de ἀκάθαρτος, usando uma expressão amplamente compreensível e digna em português atual.
- issue: Relação entre autoridade e poder
  choice: autoridade e poder
  alternative: poder e autoridade
  rationale: Mantém os dois conceitos distintos e conserva sua ordem no texto grego, sem fundi-los ou explicar teologicamente a relação entre eles.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Tomou conta de todos” traduz idiomaticamente a reação coletiva; “conversavam entre si” mantém o aspecto continuado. A nota conserva a ambiguidade lexical de λόγος.
