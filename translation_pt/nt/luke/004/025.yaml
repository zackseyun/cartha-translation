source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: pt
  text: 'Mas digo a vocês a verdade: havia muitas viúvas em Israel nos dias de Elias, quando o céu se fechou por três anos e seis meses, e houve uma grande fome em toda a terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: Mas digo a vocês a verdade
  rationale: Expressa de modo natural a fórmula enfática grega, preservando o contraste introduzido por δέ e a afirmação de veracidade.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: o céu se fechou
  rationale: Mantém a imagem passiva do texto grego para a interrupção da chuva, sem explicitação interpretativa.
- source_word: λιμὸς μέγας
  choice: uma grande fome
  rationale: Equivalente direto e corrente para a grave escassez descrita.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: em toda a terra
  rationale: Preserva a extensão espacial e a ambiguidade de γῆ, que pode indicar a terra ou região em questão, sem ampliar para 'mundo'.
theological_decisions:
- issue: Agente do fechamento do céu
  choice: 'Construção pronominal/passiva: “o céu se fechou”'
  alternative: “Deus fechou o céu”
  rationale: O grego usa voz passiva e não nomeia explicitamente o agente; a tradução não acrescenta uma identificação teológica ausente do versículo.
- issue: Extensão geográfica da fome
  choice: “em toda a terra”
  alternative: “em todo o país” ou “em todo o mundo”
  rationale: Conserva a possível amplitude sem resolver indevidamente o alcance de γῆ.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “A vocês” evita regionalismo excessivo; a ordem da frase acompanha de perto o grego sem soar artificial.
