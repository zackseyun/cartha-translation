source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: pt
  text: Enquanto o sol se punha[a], todos os que tinham consigo pessoas enfermas de diversas doenças as levaram até ele; e ele, impondo as mãos sobre cada uma delas, as curava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Quando o sol estava se pondo». O grego emprega uma construção temporal com particípio presente, indicando que esses acontecimentos ocorreram durante o pôr do sol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Enquanto o sol se punha
  rationale: A construção de genitivo absoluto com particípio presente situa os acontecimentos durante o pôr do sol. «Enquanto» preserva a simultaneidade e o aspecto em curso de forma natural em português; o leve valor conectivo de δέ não exige uma palavra separada.
- source_word: ἅπαντες ὅσοι
  choice: todos os que
  rationale: A expressão combinada tem força abrangente. «Todos os que» é clara, corrente e mantém essa totalidade.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: tinham consigo pessoas enfermas de diversas doenças
  rationale: Neste contexto, ἔχω indica pessoas ligadas aos que as levaram, provavelmente sob seus cuidados, sem especificar a relação. «Tinham consigo» evita a impressão de posse; «enfermas de diversas doenças» expressa tanto a enfermidade quanto a variedade das condições.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: as levaram até ele
  rationale: ἄγω pode significar conduzir ou levar. Aqui, «levaram» é a forma idiomática para a ação de apresentar os enfermos a Jesus.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: cada uma delas
  rationale: A formulação distributiva enfatiza que ninguém foi tratado apenas como parte da multidão. «Cada uma delas» conserva a atenção individual.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: impondo as mãos sobre
  rationale: Mantém a ação concreta descrita pelo idioma grego sem acrescentar uma interpretação ritual ou sacramental.
- source_word: ἐθεράπευεν
  choice: as curava
  rationale: O imperfeito apresenta a ação repetida ou em andamento enquanto Jesus atendia cada pessoa. «As curava», associado a «cada uma», preserva melhor esse aspecto do que um pretérito perfeito isolado.
theological_decisions:
- issue: Imposição das mãos
  choice: impondo as mãos sobre cada uma delas
  alternative: colocando as mãos sobre cada uma delas
  rationale: A tradução conserva o gesto físico e a atenção individual de Jesus, mas não atribui ao ato um significado sacramental ou eclesial que o versículo não explicita.
- issue: Aspecto verbal da cura
  choice: as curava
  alternative: as curou
  rationale: O imperfeito grego retrata a cura como ação reiterada, correspondente à imposição das mãos sobre cada enfermo. A tradução mantém essa nuance sem reduzir a eficácia da ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Enfermas» evita a possível leitura possessiva ou coloquial de «doentes» como substantivo, e «tinham consigo» comunica a relação de cuidado sem especificá-la. O pronome feminino plural retoma «pessoas» de modo gramaticalmente claro.
