  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: pt
  text: E ele ensinava nas sinagogas deles, sendo honrado por todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sendo glorificado por todos» ou «sendo elogiado por todos». O particípio grego δοξαζόμενος pode expressar ser glorificado, honrado ou elogiado publicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a coordenação simples com a narrativa anterior sem acrescentar uma nuance temporal ausente do grego.
- source_word: αὐτὸς
  choice: ele
  rationale: Mantém o pronome explícito e seu referente, Jesus, sem exagerar a possível ênfase com «ele mesmo».
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O pretérito imperfeito português expressa naturalmente uma ação passada contínua ou habitual, refletindo o aspecto imperfeito do verbo grego.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: nas sinagogas deles
  rationale: Reproduz de modo natural a expressão locativa e conserva o pronome genitivo, que no contexto provavelmente se refere às comunidades da Galileia.
- source_word: δοξαζόμενος
  choice: sendo honrado
  rationale: Neste contexto de recepção pública, δοξάζω pode significar conceder honra ou louvor. «Honrado» é corrente em português e evita que «glorificado» sugira, por si só, uma afirmação teológica mais específica.
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Preserva concisamente a construção de agente com ὑπό e a amplitude da aprovação descrita.
theological_decisions:
- issue: Sentido de δοξαζόμενος em relação a Jesus
  choice: sendo honrado por todos
  alternative: sendo glorificado por todos; sendo elogiado por todos
  rationale: O particípio pode denotar glorificação, honra ou louvor. No contexto imediato, descreve a recepção favorável ao ensino de Jesus. «Honrado» comunica esse sentido público com naturalidade, enquanto a nota preserva tanto a conexão lexical com a linguagem de glória quanto a alternativa «elogiado».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperfeito «ensinava» preserva a ação contínua ou habitual; «nas sinagogas deles» mantém a referência do pronome grego. A nota conserva a amplitude semântica de δοξαζόμενος.
