lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: ficaram cheios
  rationale: Preserva a imagem e o sentido passivo de πίμπλημι, ao mesmo tempo que soa natural em português.
- source_word: πάντες
  choice: todos
  rationale: Reproduz de modo conciso a referência coletiva a todas as pessoas presentes.
- source_word: θυμοῦ
  choice: de ira
  rationale: θυμός indica aqui uma emoção intensa; «ira» conserva essa força sem impor necessariamente o grau máximo sugerido por «fúria».
- source_word: ἐν τῇ συναγωγῇ
  choice: na sinagoga
  rationale: Expressa diretamente o local em que as pessoas estavam.
- source_word: ἀκούοντες
  choice: ao ouvir
  rationale: Traduz o particípio contemporâneo com valor temporal ou circunstancial em português natural.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Retoma de maneira ampla as declarações anteriores de Jesus, sem especificá-las como «palavras».
