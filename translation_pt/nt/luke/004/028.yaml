  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: pt
  text: E todos na sinagoga ficaram cheios de ira ao ouvir essas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficaram cheios de fúria». O grego θυμός pode indicar ira intensa ou fúria.
