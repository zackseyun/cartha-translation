source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: pt
  text: 'E lhe entregaram o rolo do profeta Isaías[a]. Depois de desenrolar o rolo, ele encontrou o lugar onde estava escrito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livro”. A palavra grega βιβλίον pode designar um documento escrito em geral, mas, neste contexto de sinagoga, provavelmente se refere a um rolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: lhe entregaram
  rationale: A forma passiva grega significa que o documento foi dado ou entregue a Jesus. A construção ativa com sujeito indeterminado é mais natural em português e preserva o sentido sem identificar quem o entregou.
- source_word: βιβλίον
  choice: rolo
  rationale: Embora o termo possa designar de modo geral um documento escrito ou livro, neste contexto de leitura sinagogal do primeiro século trata-se muito provavelmente de um rolo.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: do profeta Isaías
  rationale: Reproduz naturalmente a construção genitiva e mantém tanto a identificação de Isaías quanto seu título profético.
- source_word: ἀναπτύξας
  choice: Depois de desenrolar
  rationale: Expressa a ação anterior à de encontrar e descreve com precisão o manuseio de um rolo.
- source_word: εὗρεν
  choice: encontrou
  rationale: Correspondência direta e natural, sem sugerir uma dificuldade de localização que o grego não explicita.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: Preserva a imagem concreta do texto grego, referindo-se ao ponto específico do rolo.
- source_word: οὗ ἦν γεγραμμένον
  choice: onde estava escrito
  rationale: Formulação corrente que introduz naturalmente a citação seguinte e reflete a construção perifrástica grega.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A voz passiva grega foi vertida pela construção ativa de sujeito indeterminado “lhe entregaram”, idiomática em português e sem acréscimo de agente. A repetição de “rolo” foi mantida para clareza e correspondência lexical.
