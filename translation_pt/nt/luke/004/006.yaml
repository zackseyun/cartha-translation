  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: pt
  text: 'E o diabo lhe disse: “Eu lhe darei toda esta autoridade e a glória deles,[a] porque ela me foi entregue, e eu a dou a quem eu quiser.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o esplendor deles”. A palavra grega pode indicar glória, esplendor ou magnificência neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: o diabo
  rationale: No relato da tentação, funciona como designação pessoal de Satanás; a forma consagrada comunica o referente melhor que o sentido etimológico de ‘caluniador’.
- source_word: Σοὶ δώσω
  choice: Eu lhe darei
  rationale: O pronome dativo anteposto dá ênfase ao destinatário. A formulação é natural em português e preserva adequadamente essa ênfase pelo pronome explícito.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Denota autoridade, direito ou poder de governo; ‘autoridade’ se ajusta ao contexto dos reinos sem sugerir apenas força bruta.
- source_word: ταύτην ἅπασαν
  choice: toda esta
  rationale: Preserva tanto o demonstrativo quanto a ideia enfática de totalidade em português natural.
- source_word: δόξαν αὐτῶν
  choice: a glória deles
  rationale: Mantém o alcance semântico e a ressonância bíblica de δόξα; o pronome retoma os reinos mostrados no versículo anterior.
- source_word: παραδέδοται
  choice: ela me foi entregue
  rationale: O perfeito passivo aponta para uma entrega anterior cujo resultado permanece. A construção conserva a voz passiva e não afirma a legitimidade da alegação.
- source_word: ᾧ ἂν θέλω
  choice: a quem eu quiser
  rationale: Expressa de modo corrente a referência indefinida subordinada à vontade declarada pelo diabo.
- source_word: δίδωμι αὐτήν
  choice: eu a dou
  rationale: O presente simples comunica uma ação geral ou habitual, e o pronome feminino retoma ‘autoridade’.
theological_decisions:
- issue: Se a tradução deve endossar ou enfraquecer a alegação do diabo de possuir autoridade sobre os reinos
  choice: Apresentar diretamente a fala como alegação do próprio diabo, sem qualificadores editoriais
  alternative: Acrescentar linguagem de distanciamento, como ‘segundo ele’ ou ‘alegou que lhe foi entregue’
  rationale: O grego traz discurso direto e identifica claramente o falante. A tradução não deve confirmar nem negar por acréscimo a veracidade da alegação, preservando a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. ‘Lhe’ e ‘a quem eu quiser’ são naturais sem cair em coloquialismo excessivo. A referência pronominal de ‘ela’ e ‘a’ é ‘autoridade’; ‘deles’ retoma os reinos do versículo anterior.
