  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: pt
  text: 'Então o levou a Jerusalém e o colocou sobre o pináculo do templo[a][b], e lhe disse: “Se você é o Filho de Deus[c], jogue-se daqui para baixo;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na extremidade do templo” ou “na ala do templo”. O termo grego se refere a uma extremidade saliente ou a um ponto elevado do complexo do templo.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “templo” se refere ao complexo do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: c
    text: Ou “Já que você é o Filho de Deus”. A condição grega pode ser entendida assim, mas “Se” preserva o tom de desafio do tentador.
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: Então o levou
  rationale: δέ assinala a progressão narrativa, expressa naturalmente por “Então”; ἤγαγεν pode significar conduzir ou levar, e “o levou” é claro e idiomático sem especificar o modo.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: ἔστησεν
  choice: colocou-o
  rationale: O aoristo causativo de ἵστημι indica que ele o pôs em determinado lugar; “colocou-o” soa natural em português atual.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: no ponto mais alto
  rationale: πτερύγιον designa literalmente uma pequena asa, mas, no contexto arquitetônico, uma extremidade saliente ou um ponto elevado. “Ponto mais alto” comunica o referente com clareza, enquanto a nota preserva a alternativa tradicional e a imagem literal.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν se refere ao complexo do templo, não especificamente ao santuário interior; “templo” é a expressão portuguesa natural, com a precisão lexical registrada em nota.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Se você é o Filho de Deus
  rationale: 'εἰ com o indicativo admite em certos contextos um valor próximo de “já que”, mas “Se” preserva aqui o tom de desafio do tentador. A construção genitiva tem sentido titular: “o Filho de Deus”.'
- source_word: βάλε σεαυτὸν
  choice: jogue-se
  rationale: O imperativo de βάλλω exprime lançar ou atirar; “jogue-se” é direto, atual e natural em português.
- source_word: ἐντεῦθεν κάτω
  choice: daqui para baixo
  rationale: ἐντεῦθεν indica o ponto de partida, e κάτω, a direção descendente; a locução reproduz ambos de modo claro.
theological_decisions:
- issue: Forma do desafio à identidade de Jesus
  choice: Se você é o Filho de Deus
  alternative: Já que você é o Filho de Deus
  rationale: A condição grega pode ocasionalmente ter força argumentativa próxima de “já que”, mas “Se” conserva a provocação e a tensão narrativa sem sugerir que o narrador duvida da identidade de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “você” para fala direta e evita tanto arcaísmos quanto explicações interpretativas no corpo do versículo.
