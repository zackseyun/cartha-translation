id: LUK.4.7
reference: Luke 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: pt
  text: Portanto, se você me adorar, tudo isso será seu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se você se prostrar diante de mim”. O verbo grego pode indicar prostração ou adoração; aqui, “adorar” foi usado porque o contexto trata de prestar homenagem religiosa ao diabo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: você
  rationale: O pronome de segunda pessoa do singular está explícito para dar ênfase. Em português, “você” mantém a interlocução direta; não se acrescenta “você mesmo”, que soaria excessivo.
- source_word: οὖν
  choice: portanto
  rationale: Marca a consequência inferida da oferta feita no versículo anterior e preserva com clareza a ligação lógica.
- source_word: ἐὰν
  choice: se
  rationale: Introduz naturalmente em português a condição expressa com o subjuntivo no grego.
- source_word: προσκυνήσῃς
  choice: adorar
  rationale: O verbo pode indicar prostrar-se ou prestar adoração. Neste contexto, a resposta de Jesus no versículo seguinte mostra que está em jogo a homenagem religiosa devida a Deus.
- source_word: ἐνώπιον ἐμοῦ
  choice: me
  rationale: Com “adorar”, a construção portuguesa direta “me adorar” comunica de modo natural a homenagem prestada diante do tentador, sem a formulação pouco idiomática “adorar diante de mim”.
- source_word: ἔσται σοῦ
  choice: será seu
  rationale: Reproduz de modo natural o futuro e a relação possessiva expressos no grego.
- source_word: πᾶσα
  choice: tudo isso
  rationale: O feminino singular retoma elipticamente a totalidade mencionada no contexto anterior. “Tudo isso” torna a referência clara em português sem inserir um substantivo específico ausente deste versículo.
theological_decisions:
- issue: Se προσκυνέω deve ser traduzido como gesto de prostração ou como adoração religiosa
  choice: adorar
  alternative: prostrar-se diante de mim
  rationale: Embora o verbo admita ambos os sentidos, a resposta de Jesus em Lucas 4:8 interpreta a exigência como adoração. A escolha preserva a gravidade religiosa da tentação sem acrescentar uma doutrina externa ao contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase conserva a progressão lógica do grego; “tudo isso” recupera naturalmente o referente elíptico do contexto.
