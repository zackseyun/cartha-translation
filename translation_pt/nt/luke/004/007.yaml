  source_fidelity: 'A tradução preserva adequadamente a estrutura condicional e consequencial do grego: «Portanto» para οὖν, «se» para ἐάν com subjuntivo, e «será seu» para ἔσται σοῦ. «Se você me adorar» expressa de forma idiomática o sentido de προσκυνήσῃς ἐνώπιον ἐμοῦ: a homenagem é dirigida ao diabo e, no contexto, tem caráter religioso. «Tudo isso» comunica apropriadamente o πᾶσα elíptico, retomando a totalidade apresentada no versículo anterior.'
