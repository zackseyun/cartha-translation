  text: καὶ ἐξεπορεύετο ἦχος περὶ αὐτοῦ εἰς πάντα τόπον τῆς περιχώρου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: pt
  text: E notícias sobre ele se espalhavam por todos os lugares da região ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E um relato sobre ele saía para todos os lugares da região ao redor.»'
    reason: Alternativa lexical que preserva mais literalmente ἦχος como «relato» e ἐξεπορεύετο como «saía».
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação narrativa simples com o episódio anterior, sem acrescentar uma relação lógica mais específica.
- source_word: ἐξεπορεύετο
  choice: se espalhavam
  rationale: O imperfeito expressa uma ação contínua no passado. Com ἦχος como sujeito, a expressão portuguesa natural «se espalhavam» comunica a propagação das notícias, embora «saíam» seja uma alternativa mais formalmente próxima.
- source_word: ἦχος
  choice: notícias
  rationale: Embora possa significar literalmente «som» ou «ruído», neste contexto, junto de περὶ αὐτοῦ, designa o que se dizia a respeito de Jesus. «Notícias» é claro, corrente e adequado ao contexto narrativo.
- source_word: περὶ αὐτοῦ
  choice: sobre ele
  rationale: Tradução direta e natural da expressão que indica o conteúdo das notícias.
- source_word: εἰς πάντα τόπον
  choice: por todos os lugares
  rationale: Preserva a força distributiva de πάντα τόπον em português natural; «por» se harmoniza com a ideia de notícias que se espalham.
- source_word: τῆς περιχώρου
  choice: da região ao redor
  rationale: περίχωρος indica a área ou região circundante. A formulação mantém o sentido geográfico sem especificar fronteiras não presentes no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural «notícias» exige o plural verbal «se espalhavam» e transmite naturalmente o sentido contextual do singular grego ἦχος.
