  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: pt
  text: Mas ele, passando pelo meio deles[a], seguiu seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego descreve Jesus passando pelo meio da multidão, sem dizer como isso aconteceu.
    reason: Preservar a neutralidade descritiva e a ambiguidade teológica do texto-fonte.
lexical_decisions:
- source_word: αὐτὸς
  choice: ele
  rationale: O pronome está explícito e tem certa ênfase no grego. Em português, «ele» preserva o sujeito sem acrescentar a ênfase mais forte de «ele mesmo».
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste moderado entre a intenção hostil da multidão no versículo anterior e a partida de Jesus sem ser detido.
- source_word: διελθὼν
  choice: passando
  rationale: O particípio aoristo de διέρχομαι indica movimento através de um espaço. «Passando» mantém de modo natural a relação circunstancial com o verbo principal.
- source_word: διὰ μέσου αὐτῶν
  choice: pelo meio deles
  rationale: A expressão descreve movimento pelo centro do grupo. Esta formulação é corrente, clara e preserva a imagem espacial do grego.
- source_word: ἐπορεύετο
  choice: seguiu seu caminho
  rationale: O imperfeito de πορεύομαι apresenta a ação em curso. «Seguiu seu caminho» comunica naturalmente que Jesus continuou a ir embora, sem tornar o português excessivamente literal.
theological_decisions:
- issue: Se o versículo deve indicar uma fuga milagrosa ou permanecer descritivamente neutro
  choice: 'Formulação neutra: «passando pelo meio deles, seguiu seu caminho»'
  alternative: Explicitar uma ação sobrenatural, como «passou milagrosamente pelo meio deles»
  rationale: O grego relata o movimento de Jesus através da multidão, mas não explica como isso aconteceu. A tradução não acrescenta um mecanismo sobrenatural nem impede que o contexto seja entendido dessa maneira.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pelo meio deles» é mais natural do que «por entre eles» para preservar a ideia espacial de μέσος, enquanto «seguiu seu caminho» expressa com fluidez o aspecto continuativo do imperfeito.
