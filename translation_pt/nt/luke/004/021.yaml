  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: pt
  text: 'Então começou a dizer-lhes: “Hoje se cumpriu esta Escritura enquanto vocês a ouviam.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nos ouvidos de vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: começou
  rationale: O aoristo médio de ἄρχω, com o infinitivo λέγειν, indica o início da fala de Jesus; “começou” é natural e mantém a progressão narrativa.
- source_word: δὲ
  choice: Então
  rationale: Aqui δέ assinala a progressão da narrativa, sem contraste forte; “Então” liga naturalmente a leitura anterior à declaração de Jesus.
- source_word: λέγειν πρὸς αὐτοὺς
  choice: a dizer-lhes
  rationale: O infinitivo completa ἤρξατο, e πρός com acusativo identifica os destinatários. “Dizer-lhes” é conciso, atual e adequado à introdução de uma citação direta.
- source_word: Σήμερον
  choice: Hoje
  rationale: A posição inicial confere destaque temporal; “Hoje” preserva a imediatidade da declaração.
- source_word: πεπλήρωται
  choice: se cumpriu
  rationale: O perfeito passivo de πληρόω apresenta o cumprimento como realizado e relevante no presente. Em português, “se cumpriu” expressa com naturalidade o passivo e o caráter consumado sem acrescentar interpretação.
- source_word: ἡ γραφὴ αὕτη
  choice: esta Escritura
  rationale: No contexto, γραφή designa o texto sagrado de Isaías que acaba de ser lido. “Esta Escritura” preserva essa referência sem expandi-la para “profecia” ou “passagem”.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: aos ouvidos de vocês
  rationale: A expressão grega diz literalmente “nos ouvidos de vocês”. A formulação portuguesa mantém a imagem concreta e a ambiguidade entre aquilo que foi ouvido e o cumprimento ocorrido no ato da proclamação.
theological_decisions:
- issue: Natureza da declaração de cumprimento
  choice: Apresentar a Escritura como cumprida hoje, aos ouvidos dos presentes, sem explicitar o agente ou o modo do cumprimento.
  alternative: “Hoje esta profecia se cumpriu em mim enquanto vocês a ouviam.”
  rationale: Embora o contexto associe a declaração a Jesus, o grego não contém “profecia”, “em mim” nem uma explicação do modo do cumprimento. A tradução conserva a força e a tensão da afirmação sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “a dizer-lhes” conserva concisão e elevação moderada. A expressão literal “aos ouvidos de vocês” foi mantida no texto para preservar a imagem e a possível tensão semântica do original.
