source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: pt
  text: E ele desceu a Cafarnaum, cidade da Galileia, e os ensinava aos sábados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega o plural, indicando provavelmente ocasiões repetidas: “aos sábados”.'
    reason: Esclarecer que o plural é textual e provavelmente tem sentido iterativo.
lexical_decisions:
- source_word: κατῆλθεν
  choice: desceu
  rationale: Preserva o sentido direcional de κατέρχομαι, adequado ao deslocamento para Cafarnaum, situada em altitude mais baixa.
- source_word: Καφαρναοὺμ
  choice: Cafarnaum
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: cidade da Galileia
  rationale: Reproduz de modo natural a aposição e o genitivo gregos; em português, a ausência do artigo é idiomática nessa construção apositiva.
- source_word: ἦν διδάσκων
  choice: ensinava
  rationale: O imperfeito português expressa naturalmente a ação contínua ou habitual indicada pela construção perifrástica grega.
- source_word: αὐτοὺς
  choice: os
  rationale: Mantém o pronome sem acrescentar um referente explícito que o grego não fornece neste versículo.
- source_word: ἐν τοῖς σάββασιν
  choice: aos sábados
  rationale: Expressão portuguesa natural que conserva o plural e comunica ensino repetido em sucessivos sábados.
theological_decisions:
- issue: Se o plural σάββασιν deve ser reduzido a um sábado singular
  choice: aos sábados
  alternative: no sábado
  rationale: O plural, em conjunto com o aspecto durativo de ἦν διδάσκων, provavelmente apresenta uma prática repetida. Preservá-lo evita transformar silenciosamente o ministério habitual em um único episódio.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação foi mantida, mas as duas orações gregas foram reunidas em uma frase fluente. O marcador da nota foi colocado junto de “sábados”, termo ao qual a nota se refere.
