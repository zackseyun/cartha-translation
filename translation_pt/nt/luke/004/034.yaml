id: LUK.4.34
reference: Luke 4:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: pt
  text: '“Ah![a] O que você tem a ver conosco,[b][d] Jesus de Nazaré?[c] Você veio para nos destruir? Sei quem você é: o Santo de Deus.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A interjeição grega é um grito abrupto de alarme ou protesto. Pelo sentido do contexto, também pode ser entendida de modo mais interpretativo como “Deixe-nos em paz!”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Que há para nós e para você?” — expressão de fundo semítico que comunica distanciamento ou protesto hostil.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Jesus, o Nazareno”.'
    reason: lexical_alternative
  - marker: d
    text: O grego não especifica a quem o plural “conosco” se refere. O demônio pode estar falando de modo representativo apenas de si ou, de maneira mais ampla, do domínio demoníaco.
    reason: alternative_reading
  - marker: e
    text: A expressão pode ser explicada como “o Santo que pertence a Deus”; a tradução mantém a formulação titulativa “o Santo de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ah!
  rationale: Interjeição abrupta de alarme ou protesto. “Ah!” preserva o grito sem explicitar além do texto a ideia de “Deixe-nos em paz!”.
- source_word: τί ἡμῖν καὶ σοί
  choice: O que você tem a ver conosco
  rationale: Expressão de fundo semítico, literalmente “que há para nós e para você?”, que comunica distanciamento e protesto. A formulação escolhida é natural em português e mantém o tom confrontador.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus de Nazaré
  rationale: Vocativo que identifica Jesus por sua associação com Nazaré. É a forma mais natural e amplamente compreendida em português.
- source_word: ἦλθες
  choice: Você veio
  rationale: O aoristo é vertido de modo direto, mantendo a pergunta sobre a chegada de Jesus e seu propósito.
- source_word: ἀπολέσαι
  choice: para nos destruir
  rationale: Neste confronto, o infinitivo de ἀπόλλυμι indica destruição. “Destruir” é claro e não acrescenta uma interpretação doutrinária específica.
- source_word: ἡμᾶς
  choice: nos / conosco
  rationale: Mantém-se o plural do grego sem identificar quem está incluído, preservando a ambiguidade do referente.
- source_word: οἶδά σε τίς εἶ
  choice: Sei quem você é
  rationale: Tradução direta e natural da declaração de reconhecimento.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: o Santo de Deus
  rationale: Preserva o título cristológico e sua relação genitiva com Deus sem ampliar no texto seu significado doutrinário.
theological_decisions:
- issue: Referente do plural ἡμᾶς na fala demoníaca
  choice: Manter simplesmente o plural “nos/conosco”.
  alternative: Explicitar que o demônio fala em nome do domínio demoníaco, ou que inclui a si mesmo e o homem possuído.
  rationale: O grego não define quem está incluído no plural. A tradução conserva essa indeterminação em vez de resolver a tensão interpretativa.
- issue: Título cristológico ὁ ἅγιος τοῦ θεοῦ
  choice: “o Santo de Deus” sem expansão doutrinária.
  alternative: Interpretá-lo explicitamente como título messiânico ou como referência à consagração e missão divina de Jesus.
  rationale: A expressão tem claro peso cristológico, mas o versículo não desenvolve todas as suas implicações. O título é, portanto, preservado como aparece.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “você” é natural na fala direta, e a ordem das frases mantém a urgência e o confronto do original.
