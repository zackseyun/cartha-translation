  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: pt
  text: O Espírito do Senhor está sobre mim, porque ele me ungiu para anunciar boas-novas aos pobres. Ele me enviou para proclamar libertação aos cativos[a] e recuperação da vista aos cegos, para pôr em liberdade os oprimidos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como “libertação” também pode significar “perdão”; aqui, o contexto dos cativos e dos oprimidos favorece o sentido de libertação.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que foram quebrados” ou “esmagados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: O Espírito do Senhor
  rationale: Expressa naturalmente o genitivo e preserva tanto o pano de fundo de Isaías quanto o sentido neotestamentário habitual.
- source_word: ἐπ’ ἐμέ
  choice: está sobre mim
  rationale: Supre o verbo implícito exigido pelo português e conserva a imagem e a cadência da citação.
- source_word: οὗ εἵνεκεν
  choice: porque
  rationale: Transmite de modo claro e atual a relação causal do idioma grego.
- source_word: ἔχρισέν με
  choice: ele me ungiu
  rationale: Preserva a ressonância messiânica de χρίω; o pretérito perfeito simples é natural em português e apresenta a comissão como ato realizado.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: para anunciar boas-novas aos pobres
  rationale: Comunica o anúncio de uma boa notícia sem restringir πτωχοῖς além de 'os pobres' nem recorrer a linguagem eclesiástica mais estreita.
- source_word: ἀπέσταλκέν με
  choice: Ele me enviou
  rationale: O perfeito grego indica um envio efetuado com efeito vigente; em português, 'me enviou' é a formulação idiomática e suficiente no contexto.
- source_word: κηρύξαι
  choice: para proclamar
  rationale: Mantém o sentido de anúncio público e solene de κηρύσσω.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: libertação aos cativos
  rationale: No contexto de cativos e oprimidos, ἄφεσις aponta primariamente para soltura ou libertação, embora também possa significar perdão.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: recuperação da vista aos cegos
  rationale: Representa o sentido específico de receber ou recuperar a visão.
- source_word: ἀποστεῖλαι
  choice: para pôr em liberdade
  rationale: Em conjunto com ἐν ἀφέσει, verte de modo natural a ideia de enviar ou deixar sair numa condição de libertação, sem reproduzir uma construção artificial em português.
- source_word: τεθραυσμένους
  choice: os oprimidos
  rationale: O particípio significa literalmente os que foram quebrados ou esmagados; no contexto libertador, 'os oprimidos' comunica seu sentido idiomático, enquanto a forma literal é registrada em nota.
- source_word: ἐν ἀφέσει
  choice: em liberdade
  rationale: Preserva o campo semântico e a repetição conceitual de ἄφεσις em português natural.
theological_decisions:
- issue: Sentido de ἄφεσις na citação de Isaías
  choice: libertação/liberdade
  alternative: perdão
  rationale: As associações imediatas com cativos e pessoas quebradas ou oprimidas favorecem a linguagem de libertação. Como ἄφεσις também pode significar perdão, a alternativa é preservada em nota, sem eliminar a tensão lexical e teológica.
- issue: Sentido contextual de τεθραυσμένους
  choice: os oprimidos
  alternative: os que foram quebrados/esmagados
  rationale: A tradução principal comunica a situação humana no contexto de libertação, enquanto a nota conserva a força concreta e passiva do particípio grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência pública da proclamação e evita jargão denominacional. Os marcadores [a] e [b] aparecem no texto junto aos termos a que se referem.
