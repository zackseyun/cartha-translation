  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: pt
  text: 'Jesus o repreendeu, dizendo: “Cale-se[a] e saia dele!” Depois de lançar o homem no meio, o demônio saiu dele sem lhe causar dano algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Fique amordaçado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: o repreendeu
  rationale: “Repreendeu” preserva a fala firme e autoritativa de Jesus. O pronome retoma o demônio mencionado no contexto.
- source_word: Φιμώθητι
  choice: Cale-se
  rationale: O verbo evoca literalmente pôr uma mordaça, mas, como ordem dirigida à fala, significa de modo idiomático “Cale-se”. A imagem literal é preservada em nota.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: saia dele
  rationale: Tradução direta e natural da ordem de expulsão expressa pelo imperativo e pela construção com ἀπό.
- source_word: ῥίψαν αὐτὸν
  choice: Depois de lançar o homem
  rationale: Explicita os referentes para evitar a sequência ambígua de pronomes em português, sem alterar os participantes da cena. “Depois de” expressa naturalmente a ação do particípio anterior à saída.
- source_word: εἰς τὸ μέσον
  choice: no meio de todos
  rationale: A expressão significa “para/no meio”. “De todos” torna explícito em português o grupo presente, implícito no contexto, e evita a formulação pouco natural “no meio” sem complemento.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: É o equivalente lexical direto de δαιμόνιον e mantém a apresentação narrativa de um ser espiritual maligno.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: sem lhe causar dano algum
  rationale: Reproduz a negação enfática de qualquer dano e mantém claro que o homem não foi ferido.
theological_decisions:
- issue: Natureza e atuação de τὸ δαιμόνιον
  choice: Traduzir como “o demônio” e conservar a descrição de um ser espiritual maligno diretamente repreendido por Jesus e saindo do homem.
  alternative: Representar o referente de modo abstrato, como “força maligna” ou como mera aflição.
  rationale: A narrativa grega apresenta fala direta, ordem de saída e partida do demônio; uma formulação abstrata reduziria indevidamente o sentido do texto.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Os referentes foram explicitados onde a sequência de pronomes poderia causar confusão.
