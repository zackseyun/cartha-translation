  text: 'Pois está escrito: “Ele dará ordens aos seus anjos a seu respeito, para que protejam você”,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula portuguesa consagrada e natural para introduzir uma citação das Escrituras; comunica a relevância contínua do perfeito passivo.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a função explicativa que liga a citação ao que foi dito no versículo anterior.
- source_word: ὅτι
  choice: ':'
  rationale: Depois de “está escrito”, os dois-pontos introduzem a citação naturalmente em português, sem exigir um “que” explícito.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: aos seus anjos
  rationale: Reproduz naturalmente em português o dativo regido pelo verbo e o possessivo grego.
- source_word: ἐντελεῖται
  choice: dará ordens
  rationale: Expressa o futuro de ἐντέλλομαι como a emissão de uma ordem ou incumbência; é idiomático e mantém a força do verbo.
- source_word: περὶ σοῦ
  choice: a seu respeito
  rationale: Reflete περί com genitivo no sentido de “acerca de você”, com registro digno e natural.
- source_word: τοῦ διαφυλάξαι σε
  choice: para que protejam você
  rationale: Torna explícito de modo natural o valor final do infinitivo articular e preserva o sentido protetor de διαφυλάσσω.
theological_decisions:
- issue: Forma da citação do Salmo na fala do diabo
  choice: Traduzir estritamente o trecho citado por Lucas, sem completar a redação do Salmo 91:11.
  alternative: Acrescentar a continuação do Salmo ou harmonizar a citação com sua forma mais extensa.
  rationale: Lucas registra somente esta parte da citação. Não se devem introduzir palavras ausentes do texto grego nem suavizar o uso seletivo da Escritura na narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” evita o regionalismo marcado de “tu”; “a seu respeito” mantém clareza sem excesso de formalismo. A vírgula antes da oração final acompanha a estrutura da citação sem recorrer a pontuação enfática.
