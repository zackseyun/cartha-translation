  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: pt
  text: 'Na sinagoga havia um homem que tinha um espírito de demônio impuro[a], e ele gritou em alta voz:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito demoníaco impuro”. O grego emprega aqui tanto “espírito” como “demônio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: É o termo corrente e preciso para o lugar judaico de reunião e culto.
- source_word: ἄνθρωπος
  choice: homem
  rationale: No contexto narrativo, o substantivo singular se refere a um indivíduo adulto do sexo masculino.
- source_word: ἔχων
  choice: que tinha
  rationale: Reproduz o sentido básico de ‘ter’ sem acrescentar a interpretação mais específica ‘possuído por’.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: um espírito de demônio impuro
  rationale: Conserva os dois substantivos presentes no grego, ‘espírito’ e ‘demônio’; ‘impuro’ concorda gramaticalmente com ‘demônio’, que está no genitivo.
- source_word: ἀνέκραξεν
  choice: gritou
  rationale: Expressa de modo natural o ato de clamar com intensidade, reforçado pela expressão seguinte.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Equivalente idiomático que preserva a referência concreta à voz e sua intensidade.
theological_decisions:
- issue: Terminologia referente ao espírito e ao demônio
  choice: um espírito de demônio impuro
  alternative: um espírito demoníaco impuro
  rationale: A tradução principal mantém explicitamente πνεῦμα e δαιμόνιον e respeita a concordância formal de ἀκαθάρτου com δαιμονίου. A nota registra uma formulação idiomática possível sem reduzir a expressão simplesmente a ‘espírito mau’.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção ‘que tinha’ evita introduzir no texto uma definição técnica de possessão não expressa pelo particípio. Os dois-pontos preparam a fala que começa no versículo seguinte.
