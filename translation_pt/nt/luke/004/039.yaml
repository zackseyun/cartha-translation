reference: Luke 4:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: pt
  text: Então, de pé junto a ela[a], Jesus repreendeu a febre, e a febre a deixou. Imediatamente, ela se levantou e começou a servi-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre ela”. A expressão indica a posição próxima de Jesus em relação à mulher.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: de pé junto a ela
  rationale: Expressa de modo natural em português a posição de Jesus ao lado e acima da mulher acamada. A nota preserva a formulação espacial mais literal, que soaria ambígua no texto principal.
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: repreendeu a febre
  rationale: Mantém o objeto explícito e o tom de autoridade do grego, sem explicar a febre como entidade pessoal ou demoníaca.
- source_word: ἀφῆκεν αὐτήν
  choice: esta a deixou
  rationale: O demonstrativo retoma claramente «a febre» como sujeito implícito, enquanto o pronome «a» representa a mulher.
- source_word: παραχρῆμα
  choice: Imediatamente
  rationale: Preserva a ênfase de Lucas na cura instantânea.
- source_word: ἀναστᾶσα
  choice: ela se levantou
  rationale: Formulação corrente e clara para a ação da mulher logo após ser curada.
- source_word: διηκόνει αὐτοῖς
  choice: começou a servi-los
  rationale: A forma inceptiva comunica naturalmente o início da ação expressa pelo imperfeito e evita a possível conotação eclesiástica de «ministrar».
theological_decisions:
- issue: Se a repreensão dirigida à febre implica personificação ou causa demoníaca
  choice: Manter «repreendeu a febre» sem explicação causal
  alternative: Explicitar que Jesus falou severamente à doença ou atribuí-la a uma causa pessoal
  rationale: O texto apresenta a febre como alvo da repreensão, mas não explica sua natureza. A tradução conserva essa tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Esta a deixou» é ligeiramente mais formal, mas evita qualquer dúvida sobre a febre ser o sujeito da ação.
