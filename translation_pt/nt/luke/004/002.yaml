source:
  edition: SBLGNT
  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: pt
  text: durante quarenta dias, sendo tentado[a] pelo diabo. Ele não comeu nada durante aqueles dias e, quando estes chegaram ao fim, teve fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «posto à prova». O verbo grego pode significar tanto «tentar» como «pôr à prova»; aqui, «tentado» se ajusta melhor ao contexto porque o agente é o diabo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: durante quarenta dias
  rationale: O acusativo de duração é expresso naturalmente em português com «durante», tornando claro o período indicado.
- source_word: πειραζόμενος
  choice: sendo tentado
  rationale: O verbo pode significar «tentar» ou «pôr à prova». Como o agente é o diabo, «tentado» comunica melhor o sentido hostil neste contexto, sem apagar a alternativa lexical, registrada em nota.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: pelo diabo
  rationale: διάβολος funciona aqui como designação pessoal reconhecível; «diabo» é a forma portuguesa clara e tradicional, enquanto «caluniador» obscureceria o referente.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: não comeu nada
  rationale: Forma enfática, direta e natural em português contemporâneo.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: durante aqueles dias
  rationale: «Durante» explicita corretamente a extensão temporal do jejum, e «aqueles» mantém o valor dêitico de ἐκείναις.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: quando estes chegaram ao fim
  rationale: A construção temporal de genitivo absoluto refere-se aos dias. «Chegaram ao fim» é natural em português e preserva a ideia de conclusão, enquanto «estes» evita repetir «dias».
- source_word: ἐπείνασεν
  choice: teve fome
  rationale: Expressão idiomática e digna em português, adequada ao resultado ou manifestação da fome ao término dos quarenta dias.
theological_decisions:
- issue: Sentido de πειραζόμενος na experiência de Jesus no deserto
  choice: sendo tentado
  alternative: sendo posto à prova
  rationale: O agente explícito, o diabo, favorece o sentido de tentação hostil. A nota preserva a amplitude lexical do verbo sem resolver doutrinariamente a natureza da experiência de Jesus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém a ligação sintática com o versículo anterior, iniciando com «durante quarenta dias», e preserva a repetição temporal do grego sem soar excessivamente literal.
