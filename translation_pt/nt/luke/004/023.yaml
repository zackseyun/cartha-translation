  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: pt
  text: 'E ele lhes disse: “Certamente vocês me dirão este provérbio: ‘Médico, cure a si mesmo.’ Tudo o que ouvimos ter acontecido em Cafarnaum[a], faça também aqui, na sua terra natal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa εἰς, normalmente “para/dentro de”, onde se esperaria ἐν (“em”) para indicar localização. No contexto, porém, o sentido é locativo: “em Cafarnaum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Certamente
  rationale: Expressa a convicção enfática com que Jesus antecipa o que seus ouvintes dirão e combina naturalmente com o futuro “dirão”.
- source_word: ἐρεῖτέ μοι
  choice: vocês me dirão
  rationale: Preserva o futuro do indicativo como previsão e mantém o sentido direto de λέγω com o pronome no dativo.
- source_word: παραβολὴν
  choice: provérbio
  rationale: Neste contexto, designa uma máxima proverbial breve, e não uma parábola narrativa.
- source_word: Ἰατρέ
  choice: Médico
  rationale: Equivalente corrente e digno para o vocativo que nomeia um profissional da medicina, adequado ao tom proverbial.
- source_word: θεράπευσον σεαυτόν
  choice: cure a si mesmo
  rationale: Mantém a ordem imperativa dirigida a uma só pessoa e soa como uma máxima compreensível em português moderno.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Tudo o que ouvimos dizer que aconteceu
  rationale: Conserva tanto o caráter indireto da informação recebida quanto o sentido amplo de acontecimentos, sem especificá-los como milagres ou obras.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: em Cafarnaum
  rationale: 'Embora εἰς normalmente indique movimento para dentro ou em direção a, com o particípio de γίνομαι a expressão tem sentido locativo natural: acontecimentos ocorridos em Cafarnaum.'
- source_word: ποίησον καὶ ὧδε
  choice: faça também aqui
  rationale: Preserva o imperativo singular dirigido a Jesus, a amplitude semântica de “fazer” e a força aditiva de καί.
- source_word: ἐν τῇ πατρίδι σου
  choice: na sua terra natal
  rationale: Mantém a referência ao lugar de origem sem reduzir necessariamente πατρίς apenas à cidade nem ampliá-la a um Estado nacional moderno.
theological_decisions:
- issue: Natureza de παραβολή neste contexto
  choice: provérbio
  alternative: parábola; ditado
  rationale: “Médico, cure a si mesmo” é uma máxima breve e proverbial, não uma narrativa figurada; a escolha é contextual e evita sugerir uma forma literária que o versículo não apresenta.
- issue: Natureza dos fatos relatados em Cafarnaum
  choice: aconteceu
  alternative: foi feito; realizaste
  rationale: O particípio γενόμενα descreve de modo amplo o que ocorreu. A tradução não explicita milagres nem atribui gramaticalmente a Jesus um agente que o texto deixa implícito pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “vocês” para o plural e “faça” para deixar claro que, dentro da fala antecipada da multidão, a ordem é dirigida a Jesus no singular. “Terra natal” preserva a extensão potencial de πατρίς melhor que a opção mais restrita “cidade natal”.
