source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: pt
  text: E foi a Nazara[a], onde tinha sido criado; e, como era seu costume, entrou na sinagoga no sábado e levantou-se para ler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Nazaré». Aqui, o grego traz Nazara.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazar
  rationale: Translitera diretamente a forma grega Ναζαρά em português, sem harmonizá-la silenciosamente com o topônimo tradicional «Nazaré»; a forma conhecida é indicada em nota.
- source_word: τεθραμμένος
  choice: havia sido criado
  rationale: O particípio perfeito passivo de τρέφω refere-se à criação e formação recebidas naquele lugar; «havia sido criado» é natural em português e conserva a anterioridade.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: como era seu costume
  rationale: Expressa de modo claro e idiomático uma prática habitual de Jesus.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: no sábado
  rationale: O plural grego σαββάτων integra uma expressão idiomática cujo sentido contextual é o dia de sábado; a formulação portuguesa é corrente e precisa.
- source_word: συναγωγήν
  choice: sinagoga
  rationale: No contexto judaico, designa a sinagoga como local institucional de reunião e culto.
- source_word: ἀνέστη ἀναγνῶναι
  choice: levantou-se para ler
  rationale: Conserva tanto a ação de pôr-se de pé quanto a finalidade expressa pelo infinitivo.
theological_decisions:
- issue: Forma do topônimo Ναζαρά
  choice: Nazar
  alternative: Nazaré
  rationale: A escolha segue a forma presente no texto grego deste versículo, em vez de harmonizá-la com a forma tradicional portuguesa. A variante familiar é preservada em nota; a questão não altera o sentido teológico da passagem.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. A divisão em duas frases evita uma coordenação pesada sem eliminar nenhuma relação do grego. O pronome «ele» preserva o encadeamento narrativo, e «seu» tem referente claro no contexto.
