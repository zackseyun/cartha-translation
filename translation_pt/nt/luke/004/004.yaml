  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: pt
  text: 'E Jesus lhe respondeu[b]: “Está escrito: ‘O ser humano não viverá só de pão.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O homem não viverá só de pão”. A expressão grega tem sentido genérico e se refere ao ser humano em geral.
    reason: lexical_alternative
  - marker: b
    text: Jesus cita Deuteronômio 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: lhe respondeu
  rationale: A construção com πρός + acusativo é expressa naturalmente em português pelo pronome indireto “lhe”, sem reproduzir de modo artificial a preposição grega.
- source_word: Γέγραπται
  choice: Está escrito
  rationale: 'A fórmula tradicional e corrente de citação preserva o valor resultativo do perfeito passivo: o texto foi escrito e permanece em vigor.'
- source_word: ὅτι
  choice: ':'
  rationale: Neste contexto, ὅτι introduz o conteúdo citado; os dois-pontos fazem isso de maneira natural em português.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: só de pão
  rationale: Com o verbo “viver”, ἐπί indica aquilo de que a vida depende ou pelo qual é sustentada. “Viver só de pão” é a formulação portuguesa natural e mantém o foco de μόνῳ.
- source_word: ζήσεται
  choice: viverá
  rationale: O futuro grego é vertido diretamente pelo futuro do indicativo, em linguagem atual e digna.
- source_word: ὁ ἄνθρωπος
  choice: o ser humano
  rationale: Ἄνθρωπος é singular e genérico neste contexto, referindo-se à humanidade representada por cada pessoa. “O ser humano” preserva esse caráter singular e universal sem sugerir que a afirmação se restrinja aos homens do sexo masculino.
theological_decisions:
- issue: Sentido genérico de ὁ ἄνθρωπος na citação das Escrituras
  choice: o ser humano
  alternative: o homem
  rationale: A expressão grega masculina singular tem sentido representativo e universal. “O ser humano” comunica esse alcance com clareza no português contemporâneo; “o homem”, formulação tradicional e mais próxima da forma gramatical, é preservado em nota.
- issue: Extensão da citação de Deuteronômio 8:3
  choice: Traduzir apenas as palavras presentes no texto crítico de Lucas
  alternative: 'Acrescentar a continuação conhecida: “mas de toda palavra de Deus”'
  rationale: O texto apresentado do SBLGNT termina em ὁ ἄνθρωπος. Não se acrescenta ao corpo do versículo uma continuação encontrada em tradições textuais ou harmonizações posteriores.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A ordem da frase evita tanto o arcaísmo de “Não só de pão viverá o homem” quanto uma paráfrase excessiva; as aspas internas deixam explícito que Jesus está citando as Escrituras.
