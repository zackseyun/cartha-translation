id: LUK.4.8
reference: Luke 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: pt
  text: 'E Jesus lhe respondeu: “Está escrito: ‘Adore[a] o Senhor, seu Deus[b], e sirva somente a ele.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Curve-se diante do Senhor, seu Deus”.
    reason: lexical_alternative
  - marker: b
    text: A citação evoca Deuteronômio 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: A construção grega com particípio e verbo finito é vertida pela forma narrativa natural em português, preservando tanto a ideia de resposta quanto o objeto indireto.
- source_word: Γέγραπται
  choice: Está escrito
  rationale: Fórmula consagrada e natural para introduzir uma citação das Escrituras, mantendo a força resultativa do perfeito grego.
- source_word: Κύριον τὸν θεόν σου
  choice: o Senhor, seu Deus
  rationale: Mantém ‘Senhor’ para κύριος no texto grego do Novo Testamento e expressa com naturalidade a relação indicada por ‘seu Deus’, sem importar a forma ‘SENHOR’ do texto hebraico.
- source_word: προσκυνήσεις
  choice: Adore
  rationale: No contexto de devoção exclusiva a Deus, ‘adorar’ comunica claramente a força religiosa do verbo. O imperativo português reproduz a função normativa do futuro grego na citação.
- source_word: λατρεύσεις
  choice: sirva
  rationale: ‘Servir’ é claro e natural; no paralelo com ‘adorar’, conserva o sentido de serviço religioso prestado a Deus.
- source_word: αὐτῷ μόνῳ
  choice: somente a ele
  rationale: 'A ordem escolhida deixa inequívoca a exclusividade: o serviço deve ser prestado a ele e a mais ninguém.'
theological_decisions:
- issue: Tradução de κύριος em uma citação bíblica referente a Deus
  choice: Senhor
  alternative: SENHOR
  rationale: A tradução segue diretamente o grego κύριον de Lucas. Embora a passagem evoque um texto hebraico com o nome divino, não o reinsere no texto principal do Novo Testamento.
- issue: Relação entre adoração e serviço em προσκυνήσεις e λατρεύσεις
  choice: Adore ... e sirva
  alternative: Curve-se ... e preste culto
  rationale: A redação mantém os dois verbos e sua tensão sem fundi-los. ‘Adore’ explicita a dimensão religiosa de προσκυνέω, enquanto ‘sirva’ conserva a amplitude de λατρεύω no contexto do culto a Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega ‘lhe respondeu’ e os imperativos ‘adore’ e ‘sirva’ para evitar uma construção excessivamente literal ou arcaizante, sem enfraquecer a solenidade da citação.
