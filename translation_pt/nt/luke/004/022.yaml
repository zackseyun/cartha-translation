id: LUK.4.22
reference: Luke 4:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: pt
  text: 'Todos falavam bem dele[a] e se admiravam das palavras cheias de graça[b] que saíam de sua boca. E diziam: “Este não é o filho de José?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “davam testemunho a respeito dele”. A expressão grega pode indicar tanto que falavam favoravelmente dele quanto que testemunhavam a respeito dele; neste contexto, o sentido favorável combina melhor com “se admiravam”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “palavras de graça”, isto é, palavras marcadas por graça, favor ou encanto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: falavam bem dele
  rationale: Neste contexto, junto de “se admiravam”, a expressão provavelmente indica uma reação favorável. A formulação é clara e natural em português, enquanto a nota preserva o sentido possível de testemunho.
- source_word: ἐθαύμαζον
  choice: se admiravam
  rationale: Expressa uma reação contínua de assombro e admiração, de acordo com o imperfeito grego, sem intensificá-la indevidamente.
- source_word: ἐπὶ τοῖς λόγοις
  choice: das palavras
  rationale: Com o verbo “admirar-se”, a regência “admirar-se de” comunica naturalmente em português a causa ou ocasião da reação.
- source_word: τῆς χάριτος
  choice: cheias de graça
  rationale: 'Interpreta o genitivo como qualitativo: palavras caracterizadas por graça, favor ou encanto. É uma expressão corrente e mantém a riqueza semântica de χάρις; a alternativa mais formal é registrada em nota.'
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: que saíam de sua boca
  rationale: Preserva a imagem concreta e o aspecto contínuo do particípio, com linguagem portuguesa natural.
- source_word: Οὐχὶ
  choice: Este não é
  rationale: Mantém a pergunta retórica que espera resposta afirmativa e soa natural em português contemporâneo.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: o filho de José
  rationale: Traduz diretamente a identificação feita pela multidão, sem acrescentar qualquer esclarecimento narrativo ou doutrinário.
theological_decisions:
- issue: A referência a Jesus como filho de José diante da concepção virginal
  choice: Traduzir diretamente a percepção da multidão como “o filho de José”.
  alternative: Acrescentar uma ressalva ou reformular a fala para evitar que seja entendida como afirmação do narrador.
  rationale: O texto relata a percepção dos presentes, não oferece aqui uma correção do narrador. A tradução preserva essa tensão narrativa e não introduz esclarecimento teológico ausente do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, e os marcadores das notas foram colocados junto às expressões que explicam.
