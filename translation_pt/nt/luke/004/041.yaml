id: LUK.4.41
reference: Luke 4:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: pt
  text: 'Também saíam demônios de muitas pessoas, gritando: “Você é o Filho de Deus!” Mas ele os repreendia e não lhes permitia falar, porque sabiam que ele era o Messias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. Em grego, Χριστός significa “Messias” ou “Ungido”.'
    reason: Preservar a alternativa tradicional para o título grego Χριστός.
lexical_decisions:
- source_word: δαιμόνια
  choice: demônios
  rationale: Traduz diretamente o substantivo grego, sem substituí-lo pela expressão distinta “espíritos impuros”.
- source_word: ἐξήρχετο
  choice: saíam
  rationale: O imperfeito descreve uma ação repetida ou em andamento; o imperfeito português preserva essa força com naturalidade.
- source_word: ἀπὸ πολλῶν
  choice: de muitas pessoas
  rationale: O grego deixa implícito o referente humano, mas o português requer maior explicitação para evitar a leitura ambígua de que saíam “muitos demônios”.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: gritando
  rationale: Em português, “gritando” comunica de modo natural tanto o clamor em voz alta quanto a introdução da fala, evitando a redundância pouco idiomática “gritando e dizendo”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva a forma reconhecível e o peso titular da expressão cristológica.
- source_word: ἐπιτιμῶν
  choice: repreendia
  rationale: Expressa a censura ou ordem firme de Jesus, e o imperfeito acompanha a ação reiterada do contexto.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: não lhes permitia falar
  rationale: Reproduz de forma natural a proibição continuada; “lhes” retoma os demônios sem tratá-los como pessoas.
- source_word: ᾔδεισαν
  choice: sabiam
  rationale: O mais-que-perfeito formal de οἶδα tem valor estativo e é traduzido naturalmente pelo imperfeito português.
- source_word: τὸν χριστὸν αὐτὸν εἶναι
  choice: que ele era o Messias
  rationale: Traduz naturalmente a construção de acusativo com infinitivo e mantém Χριστός como título messiânico.
theological_decisions:
- issue: Tradução de Χριστός na identificação feita pelo narrador
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona claramente como título, “o Ungido”; “Messias” torna esse sentido transparente, enquanto “Cristo” pode ser entendido como nome próprio.
- issue: Relação entre “Filho de Deus” e “Messias”
  choice: Manter os dois títulos distintos
  alternative: Fundir os títulos numa única identificação explicativa
  rationale: O texto grego põe “Filho de Deus” na fala dos demônios e “Messias” na explicação narrativa. A tradução preserva essa distinção e sua tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar ambiguidade, e a coordenação participial grega foi condensada em “gritando” por naturalidade. O marcador [a] aparece no texto junto de “Messias”, termo ao qual a nota se refere.
