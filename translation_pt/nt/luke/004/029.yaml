id: LUK.4.29
reference: Luke 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: pt
  text: E, levantando-se, expulsaram-no da cidade e o levaram até a beirada do monte sobre o qual a cidade deles havia sido construída, a fim de atirá-lo de lá para baixo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: levantando-se
  rationale: Preserva o particípio aoristo e o movimento físico pelo qual a multidão passa à ação, sem reduzir a expressão a uma simples indicação temporal.
- source_word: ἐξέβαλον
  choice: expulsaram-no
  rationale: Expressa a retirada forçada de Jesus da cidade de modo natural e vigoroso, sem a possível coloração religiosa de outras formulações.
- source_word: πόλεως / πόλις
  choice: cidade
  rationale: É o equivalente português corrente de πόλις; embora Nazaré fosse uma localidade pequena, 'cidade' preserva de forma direta a designação do texto grego.
- source_word: ἤγαγον
  choice: o levaram
  rationale: Mantém o sentido amplo de ἄγω. O contexto já comunica hostilidade, de modo que 'arrastaram' acrescentaria uma maneira de condução que o verbo não especifica.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: até a beirada do monte
  rationale: ὀφρύς designa literalmente a sobrancelha e, por extensão, a borda ou saliência de uma elevação. 'Beirada' comunica com clareza o ponto elevado de onde pretendiam lançá-lo.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: sobre o qual a cidade deles havia sido construída
  rationale: Preserva a relação topográfica, o possessivo αὐτῶν e o valor passivo do mais-que-perfeito ᾠκοδόμητο.
- source_word: ὥστε
  choice: a fim de
  rationale: Com o infinitivo, introduz aqui o resultado pretendido ou propósito da condução até a beirada; a formulação portuguesa expressa naturalmente essa intenção.
- source_word: κατακρημνίσαι
  choice: lançá-lo lá de cima
  rationale: O verbo indica lançar alguém de uma altura, potencialmente de forma precipitada. 'Lá de cima' torna explícita a relação espacial já fornecida pelo monte, sem acrescentar um 'precipício' não mencionado nominalmente.
theological_decisions:
- issue: Grau de violência atribuído à multidão
  choice: Mostrar a expulsão forçada e a intenção de lançar Jesus de uma altura, sem inserir no texto a palavra 'assassinar' nem especificar um precipício.
  alternative: Empregar termos mais intensos, como 'arrastaram-no' e 'tentaram matá-lo', ou acrescentar 'do precipício'.
  rationale: A sequência narrativa revela uma intenção letal, mas a tradução deve permitir que ela emerja das ações descritas, sem acrescentar detalhes ou interpretar além do que o grego explicita.
- issue: Valor de ὥστε com infinitivo
  choice: 'Traduzir como propósito pretendido: ''a fim de''.'
  alternative: 'Traduzir como resultado: ''de modo que''.'
  rationale: Como a ação final não se consuma no contexto imediato, a leitura de intenção ou propósito é a mais natural, embora a construção grega possa abranger a ideia de resultado pretendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi preservada. 'Beirada do monte' evita o pouco natural 'sobrancelha do monte', e 'lá de cima' comunica o sentido de κατακρημνίζω sem importar a palavra 'precipício'.
