  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: pt
  text: 'E disse: “Em verdade lhes digo: nenhum profeta é bem recebido em sua terra natal.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua própria cidade” ou “em sua pátria”. O termo grego πατρίς pode se referir à cidade, à região ou à terra de origem de alguém; o cenário em Nazaré favorece, neste contexto, o sentido de “cidade natal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: E disse
  rationale: δέ funciona aqui como conectivo narrativo leve; “E disse” mantém o fluxo sem introduzir um contraste mais forte do que o grego exige.
- source_word: Ἀμὴν
  choice: Em verdade
  rationale: Na fórmula introdutória de Jesus, ἀμήν marca uma afirmação solene; “Em verdade” comunica essa força de modo claro e digno em português.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Forma natural e concisa em português para a fórmula de discurso direto, preservando a referência aos ouvintes no plural.
- source_word: οὐδεὶς προφήτης
  choice: nenhum profeta
  rationale: Reproduz diretamente e de modo idiomático a construção negativa grega.
- source_word: δεκτός
  choice: bem recebido
  rationale: Neste contexto, o adjetivo indica acolhimento ou recepção favorável; “bem recebido” expressa com naturalidade o sentido social e avaliativo.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: em sua terra natal
  rationale: πατρίς pode designar a cidade, região ou terra de origem. “Terra natal” preserva melhor essa amplitude, enquanto o contexto imediato permite entender especificamente Nazaré.
