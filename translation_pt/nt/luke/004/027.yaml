source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: pt
  text: Havia muitos leprosos em Israel no tempo do profeta Eliseu, e nenhum deles foi purificado, a não ser Naamã, o sírio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: leprosos
  rationale: Tradução convencional e concisa do adjetivo substantivado. No contexto bíblico, designa pessoas acometidas por uma doença de pele chamada tradicionalmente de lepra, sem pretender estabelecer um diagnóstico médico moderno.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: em Israel
  rationale: Expressa naturalmente o âmbito ou lugar indicado pela preposição grega, sem especificar além do texto se a referência principal é à terra ou ao povo.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: no tempo do profeta Eliseu
  rationale: ἐπί com genitivo tem aqui sentido temporal. A formulação é atual, clara e preserva tanto o título quanto o nome.
- source_word: ἐκαθαρίσθη
  choice: foi purificado
  rationale: Preserva a linguagem de purificação associada às doenças de pele no mundo bíblico, em vez de reduzi-la ao sentido estritamente médico de cura.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: A expressão grega introduz uma exceção. Esta formulação é idiomática em português e mantém a ênfase de que somente Naamã foi purificado.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Naamã, o sírio
  rationale: Mantém a forma tradicional do nome em português e a designação étnica definida, essencial para o contraste entre os muitos em Israel e o estrangeiro beneficiado.
theological_decisions:
- issue: Sentido da linguagem de purificação relacionada à lepra
  choice: foi purificado
  alternative: foi curado
  rationale: O verbo καθαρίζω pode envolver a remoção da aflição física e a condição de impureza associada a ela. “Foi purificado” conserva essa amplitude bíblica sem acrescentar uma explicação doutrinária.
- issue: Força da designação étnica de Naamã
  choice: Naamã, o sírio
  alternative: Naamã, um sírio
  rationale: 'O artigo grego apresenta “o sírio” como designação identificadora. Mantê-lo reforça o contraste narrativo: o único purificado foi esse estrangeiro conhecido, não alguém dentre os muitos em Israel.'
- issue: Relação entre as duas orações
  choice: mas
  alternative: e
  rationale: O segundo καί liga as orações, mas o conteúdo estabelece um contraste claro entre os muitos leprosos e o fato de nenhum deles ter sido purificado. “Mas” explicita em português uma relação já presente no sentido, sem alterar a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada para “no tempo do profeta Eliseu”. “Leprosos” mantém a concisão do original e o uso bíblico tradicional; “purificado” conserva a ressonância física e cerimonial do verbo grego.
