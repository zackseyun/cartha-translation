  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: pt
  text: E ele pregava nas sinagogas da Judeia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “Galileia” em vez de “Judeia”. O texto principal segue a leitura “Judeia” no texto grego adotado aqui.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: continuava pregando
  rationale: A construção perifrástica no imperfeito expressa uma atividade contínua ou repetida no passado. “Continuava pregando” comunica naturalmente esse aspecto em português.
- source_word: κηρύσσων
  choice: pregando
  rationale: κηρύσσω indica proclamação pública; no contexto das sinagogas, “pregar” é a expressão corrente e preserva o caráter público da atividade.
- source_word: εἰς τὰς συναγωγάς
  choice: nas sinagogas
  rationale: Embora εἰς frequentemente indique movimento para dentro, aqui assinala de modo idiomático o âmbito ou local da atividade. “Nas sinagogas” é claro e natural em português.
- source_word: συναγωγάς
  choice: sinagogas
  rationale: Neste contexto, συναγωγή se refere às reuniões ou aos locais judaicos conhecidos como sinagogas; este é o equivalente padrão e transparente.
- source_word: Ἰουδαίας
  choice: Judeia
  rationale: O texto grego adotado lê Ἰουδαίας, “Judeia”. A tradução conserva essa leitura apesar da tensão com o contexto galileu, sem harmonizá-la.
theological_decisions:
- issue: A referência geográfica τῆς Ἰουδαίας diante do contexto galileu circundante
  choice: Judeia
  alternative: Galileia; ou Judeia entendida em sentido mais amplo como território judaico
  rationale: A prioridade do texto-fonte exige conservar a leitura do SBLGNT, “Judeia”, em vez de harmonizá-la com o contexto imediato. A variante “Galileia” é registrada em nota, sem resolver silenciosamente a tensão textual e geográfica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A formulação “continuava pregando” explicita de modo natural o aspecto durativo ou reiterado da construção grega.
