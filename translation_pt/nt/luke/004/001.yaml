reference: Luke 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: pt
  text: Jesus, cheio do Espírito Santo, voltou do Jordão e era conduzido pelo Espírito[a] no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito”. A expressão grega pode ser traduzida mais literalmente dessa maneira, embora aqui provavelmente indique que o Espírito conduzia Jesus.'
    reason: alternativa lexical
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: cheio do Espírito Santo
  rationale: πλήρης com o genitivo expressa estar cheio de algo. A formulação é direta e natural em português e mantém o caráter descritivo da expressão, sem sugerir necessariamente um novo ato pontual de enchimento.
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: O aoristo de ὑποστρέφω significa normalmente “voltar” ou “retornar”. “Voltou” é corrente, conciso e adequado à narrativa.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: do Jordão
  rationale: O grego emprega o nome Jordão sem acrescentar “rio”. Em português, “do Jordão” é natural e preserva a concisão do original.
- source_word: ἤγετο
  choice: era conduzido
  rationale: O imperfeito passivo apresenta uma ação em curso no passado. “Era conduzido” conserva esse aspecto durativo com linguagem natural e digna.
- source_word: ἐν τῷ πνεύματι
  choice: pelo Espírito
  rationale: 'Embora ἐν possa ser vertido literalmente por “em”, junto do passivo de ἄγω a expressão admite sentido instrumental ou agentivo: o Espírito conduz Jesus. “Pelo Espírito” comunica esse sentido com clareza, enquanto a nota preserva a alternativa formal.'
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: ἔρημος pode designar deserto, região erma ou lugar desabitado. “Deserto” é a expressão bíblica corrente em português e não exige a ideia específica de uma extensão arenosa.
- source_word: δὲ
  choice: sem equivalente explícito
  rationale: δέ marca aqui uma transição narrativa leve. A ligação com o contexto permanece natural em português sem a necessidade de acrescentar “e”, “então” ou “ora” no início da frase.
theological_decisions:
- issue: Referente de “Espírito” em ἐν τῷ πνεύματι
  choice: o Espírito Santo como aquele que conduz Jesus
  alternative: o estado espiritual interior de Jesus
  rationale: A menção imediatamente anterior a Jesus como “cheio do Espírito Santo”, somada à ênfase de Lucas na atuação do Espírito Santo, torna mais natural entender que o mesmo Espírito conduz Jesus. A tradução não acrescenta afirmações doutrinárias além dessa relação contextual.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. Preferiu-se “voltou” a “retornou” por maior naturalidade, e “era conduzido” para representar o valor durativo do imperfeito grego. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
