lexical_decisions:
- source_word: καὶ ὅτι
  choice: 'e:'
  rationale: A expressão continua e introduz o segundo trecho da citação iniciada no versículo anterior; os dois-pontos representam naturalmente essa função em português.
- source_word: Ἐπὶ χειρῶν
  choice: nas mãos
  rationale: Preserva a imagem de ser amparado pelas mãos dos anjos e soa natural em português atual.
- source_word: ἀροῦσίν σε
  choice: eles o sustentarão
  rationale: O futuro de αἴρω, neste contexto, comunica erguer e manter alguém amparado; “sustentarão” expressa com clareza a proteção retratada na citação.
- source_word: μήποτε
  choice: para que não
  rationale: Introduz aqui a finalidade preventiva da ação e é uma formulação corrente em português.
- source_word: προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: você não bata o pé contra uma pedra
  rationale: Mantém o pé no singular e traduz concretamente a ideia de atingir uma pedra, sem enfraquecê-la para o sentido mais geral de tropeçar.
theological_decisions:
- issue: Formulação da imagem de proteção na citação do Salmo
  choice: “Eles o sustentarão nas mãos”
  alternative: “Eles o erguerão nas mãos” ou “Eles o levarão nas mãos”
  rationale: “Sustentarão” comunica de modo natural que os anjos erguem e amparam a pessoa, preservando a imagem protetora sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A pontuação deixa claro que o texto continua a citação do versículo anterior.
