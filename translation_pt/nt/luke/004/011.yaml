  text: 'e: “Eles o levarão nas mãos, para que você não bata o pé contra uma pedra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que você não tropece com o pé numa pedra”.'
