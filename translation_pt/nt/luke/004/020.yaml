id: LUK.4.20
reference: Luke 4:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: pt
  text: Depois de enrolar o rolo[a] e devolvê-lo ao auxiliar[b], ele se sentou. Os olhos de todos na sinagoga estavam fixos nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «livro». A palavra grega pode designar mais genericamente um documento escrito, mas, neste contexto de sinagoga, o objeto seria um rolo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o auxiliar da sinagoga encarregado de cuidar dos rolos e de prestar assistência durante o serviço.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: depois de enrolar
  rationale: O verbo descreve o ato de enrolar novamente um rolo, não de fechar um códice. A construção temporal também preserva a sequência dos atos anterior ao verbo principal.
- source_word: βιβλίον
  choice: rolo
  rationale: Embora possa designar de modo geral um documento escrito ou livro, no contexto da leitura de Isaías numa sinagoga do primeiro século tratava-se de um rolo.
- source_word: ἀποδοὺς
  choice: devolvê-lo
  rationale: Expressa a entrega do objeto de volta a quem o tinha sob seus cuidados; «devolver» é conciso e natural em português.
- source_word: ὑπηρέτῃ
  choice: auxiliar
  rationale: Neste contexto, indica a pessoa que prestava assistência no serviço da sinagoga e cuidava dos rolos. «Auxiliar» evita a conotação social potencialmente enganosa de «servo».
- source_word: ἐκάθισεν
  choice: ele se sentou
  rationale: Reproduz diretamente a ação narrativa sem inserir no texto explicações adicionais sobre a postura de ensino.
- source_word: πάντων
  choice: de todos
  rationale: Preserva o alcance universal da expressão grega e se liga naturalmente a «os olhos».
- source_word: οἱ ὀφθαλμοὶ
  choice: Os olhos
  rationale: Mantém como sujeito a imagem vívida usada pelo grego.
- source_word: ἀτενίζοντες
  choice: estavam fixos nele
  rationale: Comunica um olhar contínuo e atento sem sugerir necessariamente hostilidade ou falta de educação.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: O contexto exige o sentido institucional e espacial de sinagoga, não o sentido genérico de assembleia.
theological_decisions:
- issue: Forma histórica de βιβλίον no culto da sinagoga
  choice: rolo
  alternative: livro
  rationale: A escolha reflete o suporte material historicamente adequado à leitura de Isaías numa sinagoga do primeiro século, sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem narrativa foi mantida, e a repetição explícita de «Os olhos» preserva a força visual do original.
