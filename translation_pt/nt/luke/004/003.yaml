  verdict: revise
  source_fidelity: A tradução preserva adequadamente a progressão narrativa, a designação «o diabo», a condição «Se você é o Filho de Deus» e o demonstrativo «esta pedra». Contudo, «mande» torna o imperativo εἰπέ mais forte do que o verbo λέγω («diga»), e «virar» é uma paráfrase mais coloquial de γένηται. Além disso, a âncora da nota está em «lhe disse», embora a nota trate da cláusula condicional.
  naturalness: «Diga a esta pedra que se torne pão» é natural, claro e digno em português moderno, mantendo maior proximidade com a construção grega do que «mande esta pedra virar pão».
  terminology: «O diabo», «Filho de Deus», «pedra» e «pão» são escolhas adequadas e consistentes. «Você» é aceitável para o registro moderno de ampla legibilidade brasileira.
  issues:
