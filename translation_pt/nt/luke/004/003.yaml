id: LUK.4.3
reference: Luke 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: pt
  text: 'Então o diabo lhe disse: “Se você é o Filho de Deus[a], diga a esta pedra que se torne pão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Visto que você é o Filho de Deus”. A condição grega pode ser entendida como uma premissa admitida para efeito do desafio, mas o texto principal conserva a forma condicional.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Então
  rationale: Conjunção narrativa leve; “Então” expressa com naturalidade a progressão do episódio.
- source_word: διάβολος
  choice: o diabo
  rationale: Neste contexto, funciona como designação pessoal reconhecida; “o diabo” é a forma corrente e clara em português.
- source_word: Εἰ
  choice: Se
  rationale: Preserva a forma condicional e a tensão do desafio, sem decidir que a frase significa explicitamente “visto que”.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: O predicativo sem artigo tem sentido qualitativo/definido neste contexto cristológico, não indefinido.
- source_word: εἰπὲ
  choice: mande
  rationale: No português natural, “mande esta pedra virar” comunica o ato de fala dirigido à pedra; evita o pouco idiomático “diga a esta pedra que” sem ampliar para uma formulação teológica explícita de poder.
- source_word: τῷ λίθῳ τούτῳ
  choice: esta pedra
  rationale: Mantém tanto o sentido comum de λίθος quanto o demonstrativo.
- source_word: ἵνα γένηται
  choice: virar
  rationale: Após “mande”, a construção com infinitivo é idiomática e comunica que a pedra deve tornar-se pão.
- source_word: ἄρτος
  choice: pão
  rationale: Equivalente direto, sem acrescentar a especificidade de “um pão” ou ampliar para “alimento”.
theological_decisions:
- issue: Força da oração condicional εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Se você é o Filho de Deus
  alternative: Visto que você é o Filho de Deus
  rationale: A tradução principal conserva a condição expressa no grego e a tensão narrativa da tentação, sem negar a filiação de Jesus nem transformar a frase em uma afirmação inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” evita a regionalidade de “tu”; “mandar ... virar” é corrente e compreensível, sem perder o caráter imperativo do desafio.
