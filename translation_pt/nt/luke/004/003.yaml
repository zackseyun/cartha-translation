    issue: «Mande esta pedra virar pão» intensifica e parafraseia a ordem.
    rationale: εἰπέ é imperativo de λέγω, isto é, «diga». Embora o contexto implique autoridade sobre a pedra, «mande» explicita uma força de comando que o verbo escolhido no grego não exprime por si só. «Diga a esta pedra que se torne pão» conserva tanto o ato de fala quanto o conteúdo da ordem.
  - severity: low
    issue: A âncora [a] está ligada a «lhe disse», mas a nota explica «Se você é o Filho de Deus».
    rationale: A âncora deve acompanhar a expressão à qual a variante interpretativa se refere, para que a nota seja verificável e não pareça comentar αὐτῷ («lhe»).
