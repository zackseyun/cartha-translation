id: LUK.4.19
reference: Luke 4:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/019.yaml
  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: pt
  text: para proclamar o ano favorável do Senhor[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para proclamar o ano do favor do Senhor».'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: «o ano aceitável do Senhor». A frase ecoa Isaías 61:2 e pode evocar temas do Jubileu.'
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: proclamar
  rationale: O infinitivo aoristo continua a sequência de propósito e preserva o sentido público e solene de anunciar como arauto, sem restringi-lo à pregação formal.
- source_word: ἐνιαυτὸν
  choice: ano
  rationale: O termo normalmente designa um ano; conservar essa forma mantém a alusão a Isaías 61:2 e sua possível ressonância jubilar sem generalizá-la como mero período.
- source_word: κυρίου
  choice: do Senhor
  rationale: Traduz κύριος pelo equivalente doutrinariamente neutro e corrente «Senhor»; o genitivo é expresso naturalmente em português e acompanha de perto a formulação da fonte.
- source_word: δεκτόν
  choice: favorável
  rationale: No contexto, significa aceito ou recebido com favor. «Favorável» comunica em português atual a ideia do favor divino melhor que o possível, porém menos natural, «aceitável».
theological_decisions:
- issue: Alusão a Isaías 61:2 e possível ressonância do Jubileu
  choice: Manter «ano» no texto principal, sem inserir explicitamente «Jubileu».
  alternative: ano do favor do Senhor; ano aceitável do Senhor; Jubileu do Senhor
  rationale: O grego ecoa Isaías 61:2 e pode evocar o Jubileu, mas não emprega explicitamente o termo correspondente. A tradução conserva a alusão sem transformar uma possível implicação em afirmação direta.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR; Mestre
  rationale: «Senhor» preserva a formulação grega e a tradição da citação de Isaías, sem decidir no texto principal se o leitor deve entendê-lo especificamente como representação gráfica do nome divino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Proclamar» mantém o tom público e solene; «ano favorável» conserva a concisão e a ordem do grego, enquanto as notas registram alternativas legítimas e a alusão bíblica.
