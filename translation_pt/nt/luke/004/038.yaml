base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: pt
  text: Então, levantando-se, saiu da sinagoga e entrou na casa de Simão. A sogra de Simão estava sofrendo de febre alta, e pediram-lhe por ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perguntaram-lhe a respeito dela”. A expressão grega diz literalmente que lhe perguntaram “a respeito dela”; no contexto, provavelmente se trata de um apelo em favor dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Então, levantando-se, ele saiu da sinagoga
  rationale: O particípio aoristo indica uma ação anterior à entrada na casa. A formulação explicita naturalmente em português o movimento para fora marcado por ἀπό, sem perder a sequência narrativa.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: entrou na casa de Simão
  rationale: Reproduz de modo claro e corrente o movimento de entrada expresso por εἰσέρχομαι com εἰς.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: a sogra de Simão
  rationale: πενθερά designa especificamente a mãe do cônjuge; “sogra” é a equivalência direta e natural em português.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: estava sofrendo de uma febre alta
  rationale: A construção perifrástica passiva descreve a mulher como dominada ou afligida pela enfermidade. “Sofrendo de uma febre alta” comunica com naturalidade tanto o estado contínuo quanto sua gravidade.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: fizeram-lhe um pedido a respeito dela
  rationale: ἐρωτάω pode significar perguntar ou pedir, e περί introduz aquilo a que o pedido dizia respeito. A formulação portuguesa preserva a relativa indeterminação do conteúdo, embora o contexto sugira um apelo em favor da mulher.
theological_decisions:
- issue: Implicação do estado civil de Simão em πενθερὰ
  choice: Traduzir diretamente como “a sogra de Simão”, sem acrescentar conclusões sobre seu estado civil.
  alternative: Explicitar no texto que Simão era casado.
  rationale: O termo de parentesco implica que Simão tinha uma esposa, mas o versículo apenas identifica a mulher como sua sogra; a tradução não deve desenvolver a implicação.
- issue: Natureza do pedido em ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: Manter no texto “fizeram-lhe um pedido a respeito dela”.
  alternative: “pediram-lhe que a curasse” ou “pediram-lhe que a ajudasse”.
  rationale: O contexto torna provável um pedido de intervenção ou cura, mas o grego não declara expressamente seu conteúdo. A tradução conserva essa contenção textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Evitou-se tanto o literalismo pouco idiomático (“era mantida por uma grande febre”) quanto a explicitação não declarada de que o pedido era especificamente por cura.
