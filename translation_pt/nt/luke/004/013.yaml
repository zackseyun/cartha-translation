  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: pt
  text: E, depois de concluir toda tentação[a], o diabo afastou-se dele até um momento oportuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda provação». O termo grego pode significar tanto «tentação» como «provação»; aqui, o papel do diabo torna «tentação» a tradução mais natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: depois de concluir
  rationale: O particípio aoristo modifica «o diabo» e apresenta uma ação anterior ao verbo principal; a formulação explicita essa relação temporal em português natural.
- source_word: πάντα πειρασμόν
  choice: toda tentação
  rationale: A expressão singular com πᾶς pode ter sentido abrangente, indicando que o diabo completou todo o ciclo de tentações narrado. «Tentação» é preferível no contexto, sem eliminar a alternativa «provação».
- source_word: διάβολος
  choice: o diabo
  rationale: No relato, designa o adversário sobrenatural pessoal; esta é a tradução corrente e contextualmente precisa.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: afastou-se dele
  rationale: ἀφίστημι indica retirar-se ou afastar-se de alguém. A escolha conserva o movimento de separação e soa natural em português.
- source_word: ἄχρι καιροῦ
  choice: até um momento oportuno
  rationale: καιρός denota aqui uma ocasião adequada ou propícia, e não apenas tempo cronológico; a expressão sugere que a retirada era temporária e estratégica.
theological_decisions:
- issue: Sentido de πειρασμός na experiência de Jesus
  choice: tentação
  alternative: provação
  rationale: O termo grego admite os sentidos de tentação e provação. Como o agente é o diabo e ele procura desviar Jesus da obediência fiel, «tentação» é a opção principal mais natural; a nota preserva a ambiguidade legítima, pois a cena também põe Jesus à prova.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Depois de concluir» evita uma construção participial pesada; «momento oportuno» preserva a nuance estratégica de καιρός.
