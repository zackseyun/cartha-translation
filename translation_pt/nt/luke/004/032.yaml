  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: pt
  text: E ficavam admirados com o seu ensino, porque a sua palavra tinha autoridade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele falava com autoridade” ou “a sua mensagem era revestida de autoridade”.
    reason: Alternativas legítimas para ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ, que pode destacar a maneira de falar ou a qualidade autorizada da mensagem.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: ficavam admirados
  rationale: O imperfeito expressa uma reação contínua ou recorrente; “ficavam admirados” é natural em português e comunica a intensidade da surpresa sem exagerá-la.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: com o seu ensino
  rationale: ἐπί com dativo indica aqui aquilo que provocava a admiração. “Com o seu ensino” é idiomático e mantém διδαχή aberto tanto ao ato de ensinar quanto ao conteúdo ensinado.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão da admiração e é vertido de maneira causal explícita e natural.
- source_word: ἐν ἐξουσίᾳ
  choice: tinha autoridade
  rationale: Na construção com ἦν e ὁ λόγος αὐτοῦ, comunica que a fala de Jesus possuía força autorizada; esta formulação é mais natural em português do que o decalque “estava com autoridade”.
- source_word: ὁ λόγος αὐτοῦ
  choice: a sua palavra
  rationale: Preserva a expressão compacta do grego e pode designar a palavra pronunciada, a fala ou a mensagem de Jesus, sem restringi-la apenas ao conteúdo.
theological_decisions:
- issue: Natureza da autoridade da fala de Jesus
  choice: “a sua palavra tinha autoridade”
  alternative: “ele falava com autoridade” ou “a sua mensagem era revestida de autoridade”
  rationale: A tradução afirma a autoridade da palavra de Jesus sem explicar neste versículo sua origem ou seu fundamento teológico, preservando o alcance e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita “doutrina”, que seria mais estreita e técnica neste contexto, e conserva “palavra” para refletir a concisão do grego.
