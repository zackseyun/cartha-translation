  source_fidelity: O texto preserva adequadamente o passivo impessoal de ἐπέμφθη (“não foi enviado”), a exclusão de πρὸς οὐδεμίαν αὐτῶν (“a nenhuma delas”), o valor exceptivo de εἰ μή e o destino na viúva. A reformulação para “a uma viúva em Sarepta” é idiomática em português e mantém o sentido da dupla expressão direcional grega. “Na região de Sidom” comunica de modo aceitável a associação geográfica expressa por τῆς Σιδωνίας, sem identificar Sarepta com a cidade de Sidom.
