id: LUK.4.26
reference: Luke 4:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: pt
  text: E Elias não foi enviado a nenhuma delas, exceto a uma viúva em Sarepta, na região de Sidom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ver 1 Reis 17:9.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: foi enviado
  rationale: Mantém o passivo do grego e deixa implícito o agente, sem explicitar Deus além do que o texto declara.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: a nenhuma delas
  rationale: Expressa de modo natural a direção e a exclusão enfática; o feminino retoma as muitas viúvas mencionadas no versículo anterior.
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἰ μὴ
  choice: exceto
  rationale: A construção é exceptiva, não condicional; “exceto” comunica isso com clareza.
- source_word: Σάρεπτα
  choice: Sarepta
  rationale: Translitera naturalmente a forma grega e corresponde ao nome tradicionalmente usado em português para a localidade de 1 Reis 17.
- source_word: τῆς Σιδωνίας
  choice: na região de Sidom
  rationale: Torna clara a associação geográfica indicada pelo genitivo, evitando sugerir que Sarepta fosse a própria cidade de Sidom.
- source_word: γυναῖκα χήραν
  choice: uma viúva
  rationale: O português exprime naturalmente a locução appositiva literal “uma mulher, viúva” com o substantivo “viúva”, sem perda de sentido.
theological_decisions:
- issue: Agente implícito do envio de Elias
  choice: 'Preservar o passivo sem nomear o agente: “Elias não foi enviado”'
  alternative: 'Explicitar o agente: “Deus não enviou Elias”'
  rationale: Embora o contexto indique a ação de Deus, o grego não nomeia o agente. A tradução conserva essa contenção e não acrescenta ao texto uma identificação explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A reorganização de “a uma viúva em Sarepta” evita a construção pouco natural “a Sarepta... a uma mulher viúva”, preservando o destino pessoal do envio e a localização geográfica.
