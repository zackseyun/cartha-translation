id: LUK.4.14
reference: Luke 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: pt
  text: Jesus voltou para a Galileia no poder do Espírito, e uma notícia[a] sobre ele se espalhou por toda a região ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um relato”, “fama” ou “um rumor”. O termo grego pode indicar uma informação que se espalha amplamente, sem especificar se ela é positiva ou negativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: O aoristo de ὑποστρέφω indica o retorno de Jesus. “Voltou” é direto, natural e preserva o movimento narrativo.
- source_word: ἐν τῇ δυνάμει
  choice: no poder
  rationale: Mantém de perto a construção grega e deixa aberta a nuance de esfera ou modo, sem reduzi-la explicitamente a instrumento.
- source_word: τοῦ πνεύματος
  choice: do Espírito
  rationale: O contexto imediato de Lucas identifica o referente como o Espírito Santo, mas o adjetivo “Santo”, ausente neste versículo, não foi acrescentado.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: É a forma idiomática em português para indicar o destino da viagem.
- source_word: φήμη
  choice: uma notícia
  rationale: O termo designa informação ou relato que circula. “Notícia” evita impor tanto o sentido positivo de “fama” quanto o negativo de “rumor”.
- source_word: ἐξῆλθεν
  choice: se espalhou
  rationale: Expressa naturalmente em português a metáfora de uma notícia que “sai” e passa a circular, sem alterar o sentido narrativo.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: por toda a região ao redor
  rationale: Reproduz a extensão completa indicada por καθ’ ὅλης e o sentido geográfico de περίχωρος em linguagem clara e corrente.
- source_word: περὶ αὐτοῦ
  choice: sobre ele
  rationale: É a tradução contemporânea e natural da referência introduzida por περί com genitivo.
theological_decisions:
- issue: Referente de πνεύματος
  choice: “Espírito” refere-se ao Espírito Santo
  alternative: um espírito não especificado
  rationale: O contexto imediato de Lucas 4 apresenta repetidamente o Espírito Santo na preparação e no início do ministério de Jesus. A tradução “o Espírito” reconhece esse referente contextual sem inserir no texto a palavra “Santo”, que não aparece no grego deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva “no poder do Espírito” de modo relativamente formal, enquanto “se espalhou” comunica naturalmente a circulação da notícia. O marcador da nota foi colocado após “notícia”, termo ao qual a alternativa lexical efetivamente se refere.
