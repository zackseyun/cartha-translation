  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: pt
  text: Quando amanheceu, ele saiu e foi para um lugar deserto[a]. As multidões o procuravam, chegaram até ele e tentavam impedi-lo de se afastar delas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um lugar isolado” ou “para um lugar desabitado”. O grego descreve um local afastado ou sem habitantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “tentavam retê-lo” ou “tentavam detê-lo”. O sentido é que as multidões procuravam evitar que ele partisse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quando amanheceu
  rationale: A construção temporal em genitivo absoluto marca a chegada do dia. A formulação é natural em português e preserva a transição temporal.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ele saiu e foi
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à ida. A coordenação reproduz ambas as ações com clareza, sem o peso de uma construção participial literal.
- source_word: εἰς ἔρημον τόπον
  choice: para um lugar deserto
  rationale: ἔρημος descreve aqui um lugar isolado ou desabitado, não necessariamente uma região desértica. “Lugar deserto” é a expressão portuguesa mais direta e tradicionalmente inteligível.
- source_word: οἱ ὄχλοι
  choice: As multidões
  rationale: O plural indica grupos numerosos de pessoas. “Multidões” preserva esse número e a força coletiva do termo.
- source_word: ἐπεζήτουν αὐτόν
  choice: o procuravam
  rationale: O imperfeito exprime uma busca em andamento. “Procuravam” comunica naturalmente essa ação durativa.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: chegaram até ele
  rationale: A expressão indica que as multidões alcançaram o lugar onde Jesus estava. “Chegaram até ele” preserva explicitamente essa ideia.
- source_word: κατεῖχον αὐτὸν
  choice: tentavam impedi-lo
  rationale: κατέχω pode significar reter, deter ou impedir alguém de partir. O imperfeito, em conjunto com o infinitivo seguinte, favorece a ideia de uma tentativa contínua de impedir sua saída sem exigir contato físico.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: de deixá-las
  rationale: 'A construção infinitiva explicita aquilo que as multidões procuravam impedir: que ele partisse para longe delas. “Deixá-las” é conciso e natural, mantendo as pessoas, e não apenas o lugar, como ponto de afastamento.'
