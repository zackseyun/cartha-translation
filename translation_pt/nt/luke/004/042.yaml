translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição simples de verbos de movimento reflete a sequência do grego sem soar excessivamente literal. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
