  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: pt
  text: Mas Herodes, o tetrarca, sendo repreendido[a] por ele a respeito de Herodias, mulher de seu irmão, e a respeito de todas as maldades que Herodes havia cometido,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “censurado” ou “tendo seus atos expostos”. O particípio grego pode transmitir tanto a ideia de repreensão moral quanto a de exposição do erro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: tetrarca
  rationale: Mantém o título político-histórico específico, em vez de reduzi-lo ao termo genérico “governante”.
- source_word: ἐλεγχόμενος
  choice: sendo repreendido
  rationale: Preserva tanto o valor participial, contemporâneo à ação principal, quanto a ideia de censura moral; a nota registra sentidos próximos sem restringir indevidamente o termo.
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: Conserva o pronome do grego e sua referência contextual a João, sem explicitar no texto o que o original deixa implícito.
- source_word: περὶ Ἡρῳδιάδος
  choice: por causa de Herodias
  rationale: Expressa de modo natural em português o assunto e o motivo da repreensão, mantendo o paralelismo com a segunda ocorrência de περὶ.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: mulher de seu irmão
  rationale: Reproduz com clareza a relação indicada pela cadeia de genitivos, central à acusação contra Herodes.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: e por causa de todas as maldades que Herodes havia cometido
  rationale: Mantém a abrangência de πάντων e o plural substantivado de πονηρῶν. O mais-que-perfeito composto situa naturalmente os atos antes da repreensão.
- source_word: πονηρῶν
  choice: maldades
  rationale: É uma forma corrente e digna de designar atos moralmente maus, preservando o plural coletivo do grego.
- source_word: δὲ
  choice: Mas
  rationale: Marca adequadamente o contraste narrativo com o contexto anterior.
theological_decisions:
- issue: Força moral da censura de João a Herodes
  choice: “sendo repreendido”
  alternative: “sendo censurado” ou “tendo seus atos expostos”
  rationale: A tradução conserva a censura moral e profética presente em ἐλέγχω sem transformar o termo em linguagem exclusivamente jurídica nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tetrarca” preserva a precisão histórica; “por ele” mantém a ambiguidade referencial formal do original, embora o contexto aponte para João. A repetição de “Herodes” no final acompanha a ênfase explícita do texto grego.
