id: LUK.3.4
reference: Luke 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: pt
  text: 'como está escrito no livro das palavras do profeta Isaías: “Voz de quem clama no deserto: ‘Preparem o caminho do Senhor[a]; endireitem as veredas dele.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “SENHOR”. A citação ecoa Isaías 40:3, onde o hebraico traz o nome divino YHWH.'
    reason: alternative_reading
  - marker: b
    text: 'A expressão “no deserto” também pode ser ligada à ordem seguinte: “Voz de quem clama: ‘No deserto, preparem o caminho do Senhor’”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: como está escrito
  rationale: Fórmula corrente e natural para introduzir uma citação das Escrituras, preservando o sentido resultante do perfeito passivo.
- source_word: ἐν βίβλῳ λόγων Ἠσαΐου τοῦ προφήτου
  choice: no livro das palavras do profeta Isaías
  rationale: Mantém os dois substantivos gregos e expressa de modo natural em português a identificação de Isaías como profeta.
- source_word: Φωνὴ βοῶντος
  choice: Voz de quem clama
  rationale: Reproduz a construção participial com sentido pessoal sem acrescentar um artigo indefinido desnecessário em português.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: Equivalente atual e amplamente compreensível para ἔρημος; nesta pontuação, liga-se ao ato de clamar, como sugere a sequência grega de Lucas.
- source_word: Ἑτοιμάσατε
  choice: Preparem
  rationale: Preserva o imperativo plural e oferece uma exortação profética clara e digna.
- source_word: τὴν ὁδὸν κυρίου
  choice: o caminho do Senhor
  rationale: Conserva a imagem bíblica da preparação de uma estrada e traduz κύριος diretamente como “Senhor”.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: endireitem as veredas dele
  rationale: Expressa naturalmente a construção predicativa e mantém o paralelismo da metáfora viária; “veredas” distingue τρίβους de ὁδόν.
theological_decisions:
- issue: Tradução de κύριος numa citação de Isaías 40:3, cujo texto hebraico traz YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego de Lucas traz κύριος, traduzido diretamente como “Senhor”. A nota preserva a referência ao nome divino no pano de fundo hebraico sem resolver além do texto a ressonância cristológica do contexto lucano.
- issue: Ligação sintática de “no deserto”
  choice: com “clama”
  alternative: com “Preparem”
  rationale: A ordem e a pontuação mais comum do grego citado por Lucas favorecem “quem clama no deserto”, mas a sintaxe e o texto de Isaías permitem a outra segmentação; a nota conserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a cadência profética, o plural dos imperativos e a distinção entre “caminho” e “veredas”. Os marcadores das duas notas aparecem no texto principal junto aos pontos pertinentes.
