  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: pt
  text: filho de Aminadabe[a], filho de Admin, filho de Arni, filho de Esrom, filho de Perez, filho de Judá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «filho de Aminadabe, filho de Admin, filho de Arã»; outros omitem «Admin» e trazem «filho de Aminadabe, filho de Arã».
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia, o artigo no genitivo repetido diante de cada nome retoma de forma elíptica a relação genealógica expressa no contexto. «Filho de» torna essa relação explícita em português natural e conserva o ritmo da lista.
- source_word: Ἀμιναδάβ
  choice: Aminadabe
  rationale: Forma tradicional e reconhecível do nome em português bíblico, correspondente ao nome semítico transmitido pelo grego.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Translitera diretamente o nome próprio grego conforme o texto da SBLGNT; a variação textual é registrada em nota.
- source_word: Ἀρνί
  choice: Arni
  rationale: Representa diretamente a leitura impressa na SBLGNT, sem substituí-la pela variante «Arã».
- source_word: Ἑσρώμ
  choice: Esrom
  rationale: Forma tradicional em português, reconhecível no contexto genealógico e correspondente ao grego Ἑσρώμ.
- source_word: Φαρές
  choice: Perez
  rationale: Adota a forma veterotestamentária corrente em português para facilitar o reconhecimento do mesmo ancestral.
- source_word: Ἰούδα
  choice: Judá
  rationale: Forma consagrada em português para o patriarca e a tribo, evitando confusão com personagens do Novo Testamento chamados Judas.
theological_decisions: []
