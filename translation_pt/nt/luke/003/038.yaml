  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego simplesmente repete a construção no genitivo: “de Enos, de Sete, de Adão, de Deus”; a expressão “filho de” é explicitada em português com base na estrutura já estabelecida da genealogia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: filho de Enos
  rationale: O artigo no genitivo seguido do nome próprio dá continuidade à fórmula elíptica da genealogia; “filho” é explicitado em português para tornar clara a relação de filiação. “Enos” é a forma tradicional e reconhecível do nome em português.
- source_word: τοῦ Σὴθ
  choice: filho de Sete
  rationale: A mesma construção genitiva elíptica indica filiação. “Sete” é a forma portuguesa tradicional do nome próprio bíblico.
- source_word: τοῦ Ἀδὰμ
  choice: filho de Adão
  rationale: A fórmula genealógica mantém a relação filial implícita. Ἀδάμ funciona aqui como nome próprio, por isso é vertido pela forma portuguesa “Adão”, e não pelo substantivo comum “homem”.
- source_word: τοῦ θεοῦ
  choice: filho de Deus
  rationale: O genitivo final segue o mesmo padrão genealógico dos nomes anteriores. Repetir “filho de” preserva tanto a estrutura literária quanto a conclusão culminante da genealogia.
theological_decisions:
- issue: Sentido da expressão final τοῦ θεοῦ na genealogia de Adão
  choice: filho de Deus
  alternative: de Deus; procedente de Deus
  rationale: Embora o grego traga formalmente apenas o genitivo, a sequência genealógica fornece a relação elíptica de filiação. “Filho de Deus” conserva o paralelismo e a força teológica do texto sem definir além dele a natureza dessa filiação nem equipará-la automaticamente à filiação cristológica.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecidas dos nomes bíblicos. A repetição de “filho de” reproduz naturalmente em português a relação elíptica expressa pela sequência de genitivos no grego.
