lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia, o artigo no genitivo é elíptico e retoma a relação de filiação estabelecida pelo contexto. Repor «filho de» produz português claro e comunica a sintaxe implícita.
- source_word: Ἰωανὰν
  choice: Joanã
  rationale: Transliteração portuguesa corrente da forma grega do nome, em harmonia com o padrão bíblico em português.
- source_word: Ῥησὰ
  choice: Resá
  rationale: Transliteração direta e natural em português; o acento indica a tonicidade final da forma grega.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida em português para esta personagem bíblica.
- source_word: Σαλαθιὴλ
  choice: Salatiel
  rationale: Forma portuguesa tradicional, próxima da forma grega Σαλαθιήλ e reconhecível no cânon bíblico.
- source_word: Νηρὶ
  choice: Neri
  rationale: Transliteração simples e tradicional da forma grega.
theological_decisions:
- issue: Elipse genealógica
  choice: Repetir «filho de» diante de cada nome.
  alternative: Manter uma sequência literal com «de» diante de cada nome.
  rationale: O grego repete apenas o artigo genitivo, pois a relação filial está subentendida pelo padrão da genealogia. Explicitá-la traduz o sentido sem acrescentar uma interpretação teológica.
- issue: Identificação de Σαλαθιήλ com o nome veterotestamentário
  choice: Usar «Salatiel», forma portuguesa tradicional correspondente ao grego.
  alternative: Transliterar de modo mais estrito como «Salatiel» sem indicar a correspondência canônica, ou adotar uma forma baseada diretamente no hebraico.
  rationale: A forma escolhida preserva o testemunho grego e, ao mesmo tempo, mantém o nome reconhecível para leitores da Bíblia em português; a nota registra a relação tradicional sem transformar a identificação em parte explícita do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes familiares ao público bíblico lusófono. A repetição de «filho de» preserva o ritmo genealógico e torna explícita a elipse grega. Os marcadores foram posicionados após «Joanã» e «Neri», correspondendo às notas fornecidas.
