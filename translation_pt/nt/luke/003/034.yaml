  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: pt
  text: filho de Jacó, filho de Isaque, filho de Abraão, filho de Terá[a], filho de Naor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, Θάρα (Thára); «Terá» é a forma tradicional do nome no Antigo Testamento.
    reason: lexical_alternative
  - marker: b
    text: Em grego, Ναχώρ (Nachór); «Naor» é a forma tradicional do nome no Antigo Testamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante de cada nome dá continuidade à relação filial elíptica estabelecida pelo contexto. Em português, explicitar «filho de» torna a sequência clara e natural.
- source_word: Ἰακώβ
  choice: Jacó
  rationale: Forma portuguesa consagrada do nome do patriarca.
- source_word: Ἰσαάκ
  choice: Isaque
  rationale: Forma portuguesa consagrada e amplamente reconhecida do nome do patriarca.
- source_word: Ἀβραάμ
  choice: Abraão
  rationale: Forma portuguesa consagrada do nome do patriarca.
- source_word: Θάρα
  choice: Terá
  rationale: Embora a forma grega seja Θάρα, «Terá» identifica claramente a mesma personagem pela forma tradicional do Antigo Testamento em português.
- source_word: Ναχώρ
  choice: Naor
  rationale: «Naor» é a forma tradicional em português para a personagem do Antigo Testamento identificada pelo grego Ναχώρ.
theological_decisions:
- issue: Explicitação da relação filial na genealogia elíptica
  choice: Repetir «filho de» diante de cada nome
  alternative: Manter apenas uma sequência literal com «de»
  rationale: O grego depende do padrão genealógico do contexto e repete artigo e nome no genitivo sem repetir o substantivo relacional. A explicitação em português comunica a função sintática sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas tradicionais reconhecíveis. A repetição de «filho de» preserva a cadência genealógica e esclarece a elipse grega.
