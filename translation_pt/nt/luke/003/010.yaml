  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: pt
  text: 'E as multidões lhe perguntavam: “Então, o que devemos fazer?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: perguntavam
  rationale: O imperfeito expressa ação contínua ou repetida; “perguntavam” preserva naturalmente esse aspecto em português.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Mantém o plural do grego e designa os grupos numerosos reunidos para ouvir João.
- source_word: λέγοντες
  choice: introdução direta da fala, sem tradução separada
  rationale: Em português, depois de “perguntavam”, os dois-pontos introduzem de modo natural o conteúdo expresso pelo particípio λέγοντες, evitando o redundante “perguntavam, dizendo”.
- source_word: Τί οὖν
  choice: Então, o que
  rationale: “Então” conserva o valor inferencial de οὖν, ligando a pergunta à exortação anterior de João.
- source_word: ποιήσωμεν
  choice: devemos fazer
  rationale: A pergunta deliberativa com subjuntivo aoristo pede orientação prática; “devemos fazer” é corrente e fiel em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “Então, o que devemos fazer?” soa natural e preserva a ligação lógica com o contexto. Não há necessidade de nota, pois a alternativa mais formal “que faremos?” não acrescenta uma ambiguidade relevante do original.
