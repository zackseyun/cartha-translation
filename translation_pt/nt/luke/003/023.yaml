id: LUK.3.23
reference: Luke 3:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: pt
  text: E o próprio Jesus, ao começar[a], tinha cerca de trinta anos[b], sendo, como se pensava[c], filho de José, filho de Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando começou”. O grego não diz explicitamente o que Jesus começou; no contexto, provavelmente se refere à sua atividade pública.'
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível organizar a frase: “Jesus tinha cerca de trinta anos quando começou”.'
    reason: previous_rendering
  - marker: c
    text: Isto é, Jesus era geralmente considerado filho de José.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a ligação narrativa com a cena anterior sem introduzir uma transição mais forte do que a do grego.
- source_word: αὐτὸς
  choice: o próprio
  rationale: 'Conserva a ênfase do pronome grego em uma formulação natural em português: “o próprio Jesus”.'
- source_word: ἀρχόμενος
  choice: quando começou
  rationale: Expressa de modo corrente o particípio, sem acrescentar “seu ministério”, ideia provável no contexto, mas não explicitada no texto grego.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: cerca de trinta anos
  rationale: Reproduz a expressão idiomática de idade e mantém a aproximação indicada por ὡσεὶ.
- source_word: ὢν υἱός
  choice: e era ... filho
  rationale: Integra o particípio à frase em português corrente, mantendo a identificação filial que introduz a genealogia.
- source_word: ὡς ἐνομίζετο
  choice: como se pensava
  rationale: Indica uma opinião comum ou pública, sem afirmar que José era o pai biológico de Jesus.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: τοῦ Ἠλὶ
  choice: filho de Eli
  rationale: Explicita a elipse própria da cadeia genealógica grega em português natural; o segundo “filho” é entendido a partir de υἱός.
theological_decisions:
- issue: Relação de “como se pensava” com a filiação de Jesus e José
  choice: Colocar a expressão entre vírgulas imediatamente antes de “filho de José”, apresentando a filiação como entendimento público.
  alternative: Traduzir sem incisos ou ligar a ressalva de modo menos claro.
  rationale: 'A formulação mantém a tensão narrativa de Lucas: Jesus era tido socialmente como filho de José, sem que o versículo afirme paternidade biológica.'
- issue: Explicitação do que Jesus começou
  choice: Não acrescentar “seu ministério” ao texto principal.
  alternative: “quando começou seu ministério”
  rationale: O contexto aponta para o início da atividade pública de Jesus, mas o substantivo “ministério” não aparece no grego; a nota informa a leitura contextual sem eliminar a abertura lexical.
- issue: Elipse na cadeia genealógica
  choice: Traduzir τοῦ Ἠλὶ como “filho de Eli”.
  alternative: “de Eli”
  rationale: Em português, “José, de Eli” seria obscuro e pouco natural. A repetição de “filho” torna explícita apenas a elipse genealógica exigida pela sintaxe, sem decidir questões posteriores sobre a natureza da genealogia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “e era” evita um particípio rígido em português; as vírgulas preservam o caráter parentético de “como se pensava”. Todos os marcadores de nota aparecem no texto principal.
