lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante de cada nome funciona de modo elíptico e dá continuidade à relação genealógica indicada pelo contexto. A expressão «filho de» torna essa relação clara e natural em português.
- source_word: Μελχὶ
  choice: Melqui
  rationale: Forma portuguesa convencional e legível do nome próprio grego.
- source_word: Ἀδδὶ
  choice: Adi
  rationale: Transliteração adaptada à ortografia portuguesa; um só «d» evita uma duplicação gráfica desnecessária sem alterar a identificação do nome.
- source_word: Κωσὰμ
  choice: Cosã
  rationale: Forma aportuguesada que representa o nome grego Κωσάμ e segue o uso bíblico corrente em português.
- source_word: Ἐλμαδὰμ
  choice: Elmadã
  rationale: Forma aportuguesada do nome próprio, com terminação nasal natural em português.
- source_word: Ἢρ
  choice: Er
  rationale: Transliteração simples e convencional do nome próprio grego.
