  text: filho de Matusalém, filho de Enoque, filho de Jarede, filho de Maalaleel, filho de Cainã[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego Καϊνάμ, também transliterado como «Cainam» ou «Kainan». O texto grego de Lucas inclui este nome.
    reason: Registrar formas alternativas do nome e deixar claro que a tradução mantém o nome presente no texto grego, sem introduzir uma alegação imprecisa de harmonização.
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido antes de cada nome dá continuidade elíptica à relação genealógica. Explicitar «filho de» comunica com naturalidade o sentido do contexto.
- source_word: Μαθουσαλά
  choice: Matusalém
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o personagem correspondente do Antigo Testamento.
- source_word: Ἑνώχ
  choice: Enoque
  rationale: Forma bíblica consagrada em português, clara e reconhecível.
- source_word: Ἰάρετ
  choice: Jarede
  rationale: Forma portuguesa corrente do nome bíblico correspondente.
- source_word: Μαλελεήλ
  choice: Malaleel
  rationale: Forma tradicional em português que preserva a identificação do nome na genealogia.
- source_word: Καϊνάμ
  choice: Cainã
  rationale: Forma bíblica corrente em português. O nome presente no texto grego é mantido, sem harmonização silenciosa com outras formas das genealogias do Antigo Testamento.
theological_decisions:
- issue: Elipse genealógica nos genitivos repetidos
  choice: Repetir «filho de» diante de cada nome
  alternative: Traduzir literalmente por uma sequência de «de»
  rationale: A expressão explicita a relação indicada pela construção grega no contexto, sem acrescentar uma interpretação doutrinária.
- issue: Forma de Καϊνάμ na genealogia
  choice: Manter o nome como «Cainã» no texto principal
  alternative: Cainam, Kainan ou Quenã
  rationale: O nome consta do texto grego de Lucas e, por isso, não deve ser omitido nem alterado para harmonizar a genealogia com uma tradição do Antigo Testamento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas tradicionais dos nomes bíblicos. A repetição de «filho de» preserva a estrutura genealógica e torna explícita a elipse grega. O marcador foi colocado junto de «Cainã», nome ao qual a nota se refere.
