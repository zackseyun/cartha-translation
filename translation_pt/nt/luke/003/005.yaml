  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: pt
  text: Todo vale será aterrado[a], e todo monte e toda colina serão rebaixados; os trechos tortuosos se tornarão retos[b], e os caminhos acidentados se tornarão estradas planas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda ravina será preenchida”.'
    reason: lexical_alternative
  - marker: b
    text: Esta frase ecoa Isaías 40:4 e usa a imagem da construção de uma estrada para a preparação do caminho do Senhor.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Todo vale
  rationale: φάραγξ pode designar vale, ravina ou desfiladeiro. “Vale” é natural e claro em português, além de preservar a amplitude da imagem profética; a alternativa mais estreita é registrada em nota.
- source_word: πληρωθήσεται
  choice: será aterrado
  rationale: O futuro passivo de πληρόω significa literalmente “será enchido”. No contexto de nivelamento do terreno e preparação de uma estrada, “será aterrado” comunica com naturalidade que a depressão será preenchida.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: todo monte e toda colina
  rationale: Os dois substantivos próximos em sentido são preservados, distinguindo a elevação maior da menor. A repetição de “toda” torna a distribuição clara e idiomática em português.
- source_word: ταπεινωθήσεται
  choice: serão rebaixados
  rationale: Neste contexto topográfico, o verbo indica que as elevações serão baixadas. “Rebaixados” mantém a imagem física sem convertê-la em uma interpretação moral.
- source_word: τὰ σκολιά
  choice: os trechos tortuosos
  rationale: O adjetivo neutro plural é substantivado e não nomeia explicitamente caminhos. “Trechos tortuosos” preserva certa abertura lexical, ao mesmo tempo que se integra à imagem viária do contexto.
- source_word: εἰς εὐθείαν
  choice: se tornarão retos
  rationale: A construção indica transformação ou resultado. A formulação portuguesa é direta e preserva o contraste entre o tortuoso e o reto.
- source_word: αἱ τραχεῖαι
  choice: os caminhos acidentados
  rationale: O adjetivo feminino plural substantivado provavelmente pressupõe vias ou estradas. “Caminhos acidentados” expressa uma superfície irregular sem antecipar exatamente o substantivo ὁδούς da oração seguinte.
- source_word: εἰς ὁδοὺς λείας
  choice: estradas planas
  rationale: ὁδούς nomeia explicitamente estradas ou caminhos, e λείας pode significar lisas ou planas. “Estradas planas” combina bem com o nivelamento do terreno e evita sugerir apenas uma superfície pavimentada.
theological_decisions:
- issue: Imagem profética e topográfica de Isaías 40:4 citada em Lucas
  choice: Manter a imagem concreta de nivelamento do terreno e preparação de estradas.
  alternative: Parafrasear a imagem em termos morais, como a exaltação dos humildes e a humilhação dos orgulhosos.
  rationale: Embora a imagem possa ter implicações teológicas e morais, Lucas conserva a linguagem concreta da profecia. Traduzir essa linguagem diretamente preserva sua força poética e evita inserir uma interpretação específica no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A pontuação evidencia os dois pares da imagem de nivelamento, e a elipse verbal no último membro preserva o ritmo poético.
