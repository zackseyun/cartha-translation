lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante de cada nome funciona de modo elíptico dentro da sequência de descendência estabelecida pelo contexto. “Filho de” explicita naturalmente essa relação em português.
- source_word: Καϊνὰμ
  choice: Cainã
  rationale: Forma portuguesa bíblica tradicional e reconhecível do nome grego, adequada à leitura moderna.
- source_word: Ἀρφαξὰδ
  choice: Arfaxade
  rationale: Forma portuguesa corrente que representa o nome grego de Lucas; distingue-se da forma veterotestamentária mais próxima do hebraico, “Arpachshad”.
- source_word: Σὴμ
  choice: Sem
  rationale: Forma portuguesa bíblica estabelecida do nome próprio.
- source_word: Νῶε
  choice: Noé
  rationale: Forma portuguesa bíblica estabelecida, mais natural do que uma transliteração direta do grego.
- source_word: Λάμεχ
  choice: Lameque
  rationale: Forma portuguesa bíblica tradicional e amplamente reconhecida.
theological_decisions:
- issue: Inclusão de Cainã na genealogia de Lucas entre Arfaxade e Sem
  choice: Manter Cainã no texto principal, conforme o SBLGNT.
  alternative: Algumas tradições omitem Cainã para aproximar a genealogia de certas formas do Antigo Testamento.
  rationale: O texto grego fornecido inclui Καϊνάμ. A tradução preserva a redação de Lucas sem harmonizá-la silenciosamente com outras formas genealógicas.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas usuais dos nomes próprios. A repetição de “filho de” reproduz de maneira natural a estrutura genealógica elíptica do grego. Os marcadores foram colocados junto aos nomes ou à afirmação a que se referem; a nota textual [b] aparece após Lameque por dizer respeito ao versículo como um todo.
