id: LUK.3.1
reference: Luke 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: pt
  text: No décimo quinto ano do reinado de Tibério César[a], quando Pôncio Pilatos governava a Judeia, Herodes era tetrarca da Galileia, seu irmão Filipe era tetrarca da região da Itureia e Traconítide, e Lisânias era tetrarca de Abilene[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante o décimo quinto ano”.'
    reason: lexical_alternative
  - marker: b
    text: “Tetrarca” era um governante regional subordinado à autoridade romana.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: No décimo quinto ano
  rationale: Expressa de modo natural a localização temporal; δέ funciona como transição narrativa e não exige uma palavra introdutória separada em português.
- source_word: ἡγεμονίας
  choice: reinado
  rationale: Com Tibério César como complemento, designa de maneira clara e idiomática o período de seu governo imperial.
- source_word: ἡγεμονεύοντος
  choice: governava
  rationale: Preserva o valor verbal e circunstancial do particípio, sem convertê-lo estritamente em um título oficial.
- source_word: τετρααρχοῦντος
  choice: era tetrarca de
  rationale: Mantém o título político historicamente específico, em vez de generalizá-lo como simples governante.
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: seu irmão Filipe
  rationale: Reproduz naturalmente a relação apositiva e toma o pronome como referência a Herodes.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: da região da Itureia e Traconítide
  rationale: Conserva χώρας como 'região' e entende os dois nomes como designações do território governado.
- source_word: τῆς Ἀβιληνῆς
  choice: de Abilene
  rationale: Forma portuguesa natural para indicar o território sob a tetrarquia de Lisânias.
theological_decisions:
- issue: Tradução do título político τετρααρχοῦντος
  choice: era tetrarca de
  alternative: governava; era governante de
  rationale: Preserva a precisão histórica do título sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com grafia corrente no Brasil. A frase mantém o encadeamento histórico do grego e termina com vírgula porque a construção prossegue no versículo seguinte.
