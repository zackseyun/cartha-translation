  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: pt
  text: Aconteceu que, quando todo o povo foi batizado e Jesus também já tinha sido batizado e estava orando, o céu[a] se abriu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o céu visível”. A palavra grega pode indicar tanto o céu visível como o âmbito celestial; neste contexto de revelação, “o céu” expressa melhor o sentido da cena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Aconteceu que
  rationale: Preserva a fórmula narrativa de Lucas e sua força eventiva. O δέ funciona como progressão narrativa e não exige um marcador temporal explícito em português.
- source_word: ἐν τῷ βαπτισθῆναι
  choice: quando ... foi batizado
  rationale: A construção com infinitivo articular e ἐν tem valor temporal; esta formulação é natural em português e mantém a voz passiva.
- source_word: ἅπαντα τὸν λαὸν
  choice: todo o povo
  rationale: Expressa o povo considerado em sua totalidade sem restringi-lo a uma simples multidão presente.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: Jesus também já tinha sido batizado
  rationale: O particípio aoristo no genitivo absoluto acrescenta Jesus ao cenário temporal. “Também” representa a força aditiva de καί, e “já tinha sido batizado” indica naturalmente que o batismo antecede a oração e a abertura do céu.
- source_word: καὶ προσευχομένου
  choice: e estava orando
  rationale: Representa a ação contínua contemporânea à abertura do céu.
- source_word: ἀνεῳχθῆναι
  choice: se abriu
  rationale: Comunica em português natural o aoristo passivo sem introduzir a imagem mais forte de o céu ser rasgado.
- source_word: τὸν οὐρανὸν
  choice: o céu
  rationale: No contexto da revelação que se segue, “céu” comunica adequadamente o âmbito celestial e continua permitindo a referência ao céu visível.
theological_decisions:
- issue: Sentido de οὐρανός na cena do batismo
  choice: o céu
  alternative: o céu visível
  rationale: A descida do Espírito e a voz divina favorecem o sentido celestial, mas a nota preserva a amplitude lexical do termo grego sem resolver além do necessário a relação entre o céu visível e o âmbito divino.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura mantém a progressão temporal do grego sem imitar rigidamente seus particípios. O ponto e vírgula evita ambiguidades na longa oração e “então” explicita apenas a sequência narrativa já presente na sintaxe.
