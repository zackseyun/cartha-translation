  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo genitivo repetido diante de cada nome tem valor elíptico dentro da fórmula genealógica estabelecida pelo contexto. Repor “filho de” em português explicita a relação e evita uma sequência pouco natural de nomes.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal grego, adequada à transliteração bíblica em português.
- source_word: Ἀμὼς
  choice: Amós
  rationale: Forma portuguesa convencional do nome pessoal, com acentuação necessária à pronúncia natural.
- source_word: Ναοὺμ
  choice: Naum
  rationale: Forma consagrada em português para o nome pessoal grego Ναούμ.
- source_word: Ἑσλὶ
  choice: Esli
  rationale: Transliteração clara e corrente do nome, sem acrescentar um H inicial que não é necessário em português.
- source_word: Ναγγαὶ
  choice: Nagai
  rationale: Transliteração portuguesa simples do nome pessoal, com consoante única, pois a duplicação gráfica não é necessária para representar naturalmente o grego em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A repetição de “filho de” preserva a estrutura genealógica e torna explícita a elipse do grego. Os nomes seguem formas portuguesas tradicionais ou transliterações naturais.
