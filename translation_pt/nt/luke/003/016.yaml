source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: pt
  text: 'João respondeu a todos, dizendo: “Eu batizo vocês com água[a], mas vem aquele que é mais forte do que eu[b], e não sou digno de desamarrar a correia das sandálias dele. Ele batizará vocês no Espírito Santo[c] e no fogo[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em água”. O dativo grego pode indicar meio ou elemento neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquele que é mais poderoso do que eu”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com o Espírito Santo”. O grego diz literalmente “no Espírito Santo”, e a preposição pode ser entendida como indicação de meio, esfera ou elemento.
    reason: lexical_alternative
  - marker: d
    text: O “fogo” pode ser entendido como purificação, como juízo ou como parte da única imagem do batismo no Espírito e no fogo; a tradução mantém a expressão sem decidir entre essas interpretações.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: João respondeu a todos, dizendo
  rationale: Preserva a fórmula narrativa de resposta, o particípio λέγων e o alcance de πᾶσιν, mantendo uma construção clara e digna em português.
- source_word: Ἐγὼ μὲν ... δὲ
  choice: Eu ... mas
  rationale: O contraste preparado por μέν e completado por δέ é expresso naturalmente por “mas”; o pronome “Eu” mantém a ênfase em João sem recorrer à construção pouco natural “por um lado”.
- source_word: ὕδατι
  choice: com água
  rationale: O dativo pode indicar meio ou elemento. “Batizar com água” é idiomático em português, enquanto a nota registra a alternativa mais formal “em água”.
- source_word: βαπτίζω / βαπτίσει
  choice: batizo / batizará
  rationale: “Batizar” é o termo estabelecido e adequado à narrativa dos Evangelhos. “Imergir” poderia impor uma especificidade interpretativa desnecessária.
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: mas vem aquele que é mais forte do que eu
  rationale: “Vem” comunica a chegada iminente, e “mais forte do que eu” reproduz de modo explícito e natural o comparativo grego.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: não sou digno
  rationale: Embora ἱκανός possa indicar capacidade ou suficiência, nesta fórmula de humildade “digno” expressa adequadamente o sentido contextual.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: desamarrar a correia das sandálias dele
  rationale: A formulação comunica claramente a tarefa humilde de soltar o calçado, sem vocabulário arcaico. “Dele” evita possível ambiguidade referencial de “suas”.
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: Ele batizará vocês
  rationale: O pronome explícito conserva a ênfase contrastiva de αὐτός entre João e aquele que vem. “Vocês” oferece ampla legibilidade brasileira e representa naturalmente o plural ὑμᾶς.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: no Espírito Santo e no fogo
  rationale: “No” mantém de perto a preposição ἐν e deixa em aberto seus possíveis matizes de meio, esfera ou elemento. A repetição de “no” torna claro que ambos os substantivos dependem da mesma construção, sem determinar a relação teológica entre Espírito e fogo.
theological_decisions:
- issue: Sentido de “batizará vocês no Espírito Santo e no fogo”
  choice: Manter a expressão concisa sem definir a função do fogo.
  alternative: Interpretar explicitamente o fogo como purificação, ou separar o batismo no Espírito do batismo em fogo como juízo.
  rationale: O texto não explica nesta cláusula se o fogo é purificador, judicial ou parte de uma única imagem de batismo no Espírito e no fogo. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade especialmente natural no Brasil. Emprega “vocês” para a segunda pessoa do plural, evita arcaísmos e conserva a estrutura contrastiva e a ambiguidade teológica do grego.
