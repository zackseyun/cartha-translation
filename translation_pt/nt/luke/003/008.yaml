id: LUK.3.8
reference: Luke 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: pt
  text: 'Portanto, produzam frutos dignos de arrependimento[a] e não comecem a dizer entre vocês[b]: ‘Temos Abraão como pai’, pois eu lhes digo que Deus pode, destas pedras, suscitar filhos para Abraão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “frutos condizentes com o arrependimento”. O grego emprega o plural “frutos” e destaca uma conduta que corresponda ao arrependimento genuíno.
    reason: lexical_alternative
  - marker: b
    text: Ou “dentro de vocês” ou “a si mesmos”. A expressão pode indicar tanto um pensamento interior quanto o que diziam entre os membros do próprio grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: produzam
  rationale: O imperativo aoristo exige ação decidida; com “frutos”, “produzam” é natural em português e preserva a ideia de resultados concretos.
- source_word: οὖν
  choice: Portanto
  rationale: Explicita a inferência decorrente da advertência anterior.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: frutos dignos de arrependimento
  rationale: Mantém o plural grego e a correspondência entre a conduta e o arrependimento, sem sugerir mérito que obtenha perdão.
- source_word: μὴ ἄρξησθε λέγειν
  choice: não comecem a dizer
  rationale: Reproduz de modo direto a construção que proíbe até mesmo iniciar essa alegação autoconfiante.
- source_word: ἐν ἑαυτοῖς
  choice: entre vocês
  rationale: Preserva a leitura coletiva mais natural no contexto, enquanto a nota registra a possibilidade de fala interior.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Temos Abraão como pai
  rationale: Expressa naturalmente a reivindicação enfática de descendência abraâmica.
- source_word: δύναται
  choice: pode
  rationale: Comunica com clareza e naturalidade a capacidade soberana de Deus.
- source_word: ἐκ τῶν λίθων τούτων
  choice: destas pedras
  rationale: Mantém a referência demonstrativa e a origem indicada por ἐκ.
- source_word: ἐγεῖραι
  choice: suscitar
  rationale: Neste contexto, transmite a ideia de fazer surgir ou levantar descendentes de maneira inesperada, sem limitar o verbo a criação material.
theological_decisions:
- issue: Sentido de “frutos dignos de arrependimento”
  choice: Ações e resultados concretos que correspondem ao arrependimento genuíno.
  alternative: “frutos condizentes com o arrependimento” ou o singular coletivo “fruto digno de arrependimento”.
  rationale: A formulação conserva a tensão do grego entre arrependimento e conduta correspondente, sem afirmar que as obras conquistam o perdão.
- issue: Valor da descendência de Abraão
  choice: A descendência física de Abraão não constitui, por si só, fundamento de segurança diante de Deus.
  alternative: Explicitar “verdadeiros filhos espirituais”, interpretação que ultrapassaria o que o versículo afirma diretamente.
  rationale: O texto contesta a confiança na ancestralidade e afirma a liberdade e o poder de Deus para suscitar filhos para Abraão, sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “suscitar” conserva o tom solene e o alcance semântico do verbo grego.
