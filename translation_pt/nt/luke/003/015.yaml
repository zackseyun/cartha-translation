    issue: A expressão «a respeito de João» não está explicitada.
    rationale: 'περὶ τοῦ Ἰωάννου modifica a deliberação: todos raciocinavam interiormente a respeito de João. Em «se acaso João seria o Messias», o sentido geral permanece, mas a relação sintática fica condensada e menos fiel à disposição do grego.'
  - severity: low
    issue: «No coração» usa singular não marcado.
    rationale: Embora o singular distributivo seja possível em português, «em seus corações» reproduz mais claramente o plural αὐτῶν e evita a impressão de um único coração coletivo.
  revised_text: Enquanto o povo esperava com expectativa, e todos refletiam em seus corações a respeito de João, perguntando-se se talvez ele fosse o Messias[a],
