id: LUK.3.15
reference: Luke 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: pt
  text: Enquanto o povo esperava com expectativa, e todos refletiam em seus corações a respeito de João, perguntando-se se talvez ele fosse o Messias[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. Grego: ho christos.'
    reason: Registra a alternativa tradicional para o título grego e mantém visível sua forma de origem.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: esperava com expectativa
  rationale: O genitivo absoluto estabelece a cena, e προσδοκάω expressa espera carregada de expectativa; a formulação preserva o aspecto contínuo e o sentido antecipatório.
- source_word: δὲ
  choice: enquanto
  rationale: A partícula marca uma leve progressão narrativa. Em português, sua função é absorvida naturalmente pela oração circunstancial iniciada por “Enquanto”, sem exigir “ora” ou “mas”.
- source_word: τοῦ λαοῦ
  choice: o povo
  rationale: λαός designa o povo como coletividade; “o povo” é direto, natural e preserva possíveis ressonâncias bíblicas.
- source_word: διαλογιζομένων πάντων
  choice: todos ponderavam
  rationale: διαλογίζομαι indica deliberação interior, e πάντων amplia a ação a todos os que estão em vista. “Ponderavam” comunica reflexão interna de modo idiomático.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: no coração
  rationale: A expressão conserva a imagem bíblica do coração como centro do pensamento e da deliberação. O singular distributivo é natural em português.
- source_word: περὶ τοῦ Ἰωάννου
  choice: João
  rationale: O referente da ponderação é João. Na construção portuguesa “se acaso João seria...”, a relação expressa por περί fica clara sem o menos fluente “a respeito de João”.
- source_word: μήποτε αὐτὸς εἴη
  choice: se acaso João seria
  rationale: “Se acaso” preserva a incerteza de μήποτε, enquanto “seria” transmite a possibilidade cautelosa expressa pelo optativo εἴη. A repetição de “João” evita ambiguidade pronominal em português.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Aqui Χριστός funciona como título ligado à expectativa popular; “Messias” preserva com clareza o contexto judaico.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: o Messias
  alternative: o Cristo
  rationale: Neste contexto, o termo é um título cuja identidade o povo cogita atribuir a João, não uma designação semelhante a nome próprio. “Messias” torna essa função explícita sem resolver além do texto a dúvida dos personagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi preservada porque o versículo continua sintaticamente no seguinte. O marcador [a] foi colocado imediatamente após “Messias”, termo ao qual a nota se refere.
