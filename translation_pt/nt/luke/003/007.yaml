reference: Luke 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: pt
  text: 'Então, ele dizia às multidões que saíam para ser batizadas por ele: “Crias de víboras,[a] quem alertou vocês para fugirem da ira que está por vir?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Raça de víboras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da ira vindoura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: dizia
  rationale: O imperfeito indica ação em curso ou repetida; “dizia” conserva esse aspecto sem afirmar explicitamente uma frequência.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e lógica do contexto anterior de modo natural em português.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: às multidões que saíam
  rationale: O particípio modifica “multidões” e descreve seu movimento para fora, em direção a João.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: para ser batizadas por ele
  rationale: Preserva a finalidade e a voz passiva do infinitivo grego, bem como o pronome que se refere a João sem explicitar seu nome.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Crias de víboras
  rationale: “Crias” expressa aquilo que foi gerado e mantém a imagem contundente de descendência de víboras; a alternativa idiomática e tradicional é registrada em nota.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: quem avisou vocês
  rationale: Neste contexto de perigo e juízo iminente, ὑποδείκνυμι tem a força de advertir ou avisar; “vocês” é claro e amplamente compreensível.
- source_word: φυγεῖν
  choice: de que deviam fugir
  rationale: A construção portuguesa explicita naturalmente o conteúdo do aviso, enquanto “fugir” conserva a imagem vívida de afastar-se do perigo.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: da ira que está por vir
  rationale: μέλλουσα aponta para algo futuro ou iminente; a expressão conserva tanto a noção de ira quanto a referência temporal sem definir mais precisamente sua realização.
theological_decisions:
- issue: Natureza de ὀργή na advertência de João
  choice: “ira” refere-se ao juízo divino vindouro sem especificar um esquema doutrinário mais estreito
  alternative: juízo escatológico especificamente, ou juízo temporal na história
  rationale: O contexto associa arrependimento ao juízo de Deus, mas o versículo não delimita aqui a forma ou o momento exato desse juízo. A tradução mantém o termo amplo e sua tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Crias de víboras” preserva a metáfora concreta; “Raça de víboras” aparece como alternativa mais tradicional. Os marcadores de ambas as notas constam no texto principal e foram posicionados junto às expressões a que se referem.
