  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: pt
  text: filho de Matate[a], filho de Levi, filho de Melqui, filho de Janai, filho de José,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “de Matate, de Levi, de Melqui, de Janai, de José”. O grego prossegue a genealogia com genitivos repetidos, deixando “filho de” subentendido pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante de cada nome retoma elipticamente a relação filial estabelecida pelo contexto. Explicitar “filho de” torna a sequência natural e clara em português.
- source_word: Μαθθὰτ
  choice: Matate
  rationale: Forma portuguesa tradicional e legível do nome próprio grego Μαθθάτ.
- source_word: Λευὶ
  choice: Levi
  rationale: Forma portuguesa consagrada do nome próprio Λευί.
- source_word: Μελχὶ
  choice: Melqui
  rationale: Transliteração adaptada à ortografia portuguesa, preservando a forma do nome grego Μελχί.
- source_word: Ἰανναὶ
  choice: Janai
  rationale: Transliteração portuguesa próxima da forma grega Ἰανναί, sem simplificá-la para Jana.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Forma portuguesa consagrada do nome próprio Ἰωσήφ.
theological_decisions:
- issue: Elipse genealógica
  choice: Explicitar “filho de” antes de cada nome
  alternative: Manter a cadeia formal “de Matate, de Levi, de Melqui, de Janai, de José”
  rationale: O grego apresenta uma sequência de genitivos que depende da fórmula genealógica do contexto. A explicitação comunica em português a relação implícita sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes adaptados às formas portuguesas usuais e repetição clara da relação genealógica.
