  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: pt
  text: filho de Serugue, filho de Reú, filho de Pelegue, filho de Éber, filho de Salá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: «de Seruque, de Ragau, de Faleque, de Éber, de Salá». A genealogia de Lucas apresenta uma sequência elíptica de genitivos; «filho de» foi explicitado conforme o contexto. Esses nomes correspondem aos patriarcas chamados Serugue, Reú, Pelegue, Éber e Selá na genealogia de Gênesis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: A sequência de genitivos é elíptica e dá continuidade à fórmula genealógica estabelecida pelo contexto. Em português, explicitar «filho de» comunica naturalmente a relação pretendida.
- source_word: Σεροὺχ
  choice: Serug
  rationale: Forma tradicional portuguesa do nome veterotestamentário correspondente, reconhecível na genealogia de Gênesis.
- source_word: Ῥαγαὺ
  choice: Reú
  rationale: Adota-se a forma portuguesa tradicional do patriarca de Gênesis, em vez da transliteração direta do grego «Ragau».
- source_word: Φάλεκ
  choice: Pelegue
  rationale: Forma portuguesa consagrada do nome hebraico correspondente, preservando a ligação com a genealogia de Gênesis.
- source_word: Ἔβερ
  choice: Éber
  rationale: Forma portuguesa tradicional do patriarca, com acento gráfico para indicar a pronúncia corrente.
- source_word: Σαλὰ
  choice: Salá
  rationale: A forma «Salá», comum na tradição bíblica portuguesa para este nome na genealogia lucana, segue mais de perto o grego Σαλὰ; a nota registra a correspondência com Selá na genealogia hebraica.
