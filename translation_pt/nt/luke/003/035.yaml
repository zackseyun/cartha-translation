translation_notes:
  register: Português moderno, claro e digno, com formas de nomes amplamente reconhecíveis em Bíblias de língua portuguesa. Mantém-se a estrutura repetitiva própria de uma genealogia; o ponto final vem após o marcador da nota, que também esclarece tanto a elipse grega quanto as variantes nominais.
