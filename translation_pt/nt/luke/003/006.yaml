source:
  edition: SBLGNT
  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: pt
  text: E toda carne verá a salvação de Deus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade”. O grego diz literalmente “toda carne”, ecoando Isaías 40:5 e referindo-se aqui a todas as pessoas.
    reason: lexical_alternative
  - marker: b
    text: Ou “a salvação que vem de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: verá
  rationale: Futuro de ὁράω com sentido direto. “Verá” é natural em português atual e preserva a imagem concreta do texto grego.
- source_word: πᾶσα σὰρξ
  choice: toda carne
  rationale: A expressão de caráter semítico e profético refere-se a toda a humanidade e ecoa Isaías 40:5. A formulação literal preserva a ligação intertextual e a linguagem bíblica, enquanto a nota esclarece o sentido idiomático.
- source_word: σωτήριον
  choice: a salvação
  rationale: O adjetivo substantivado com artigo designa a salvação. Esta tradução direta preserva tanto o pano de fundo de Isaías quanto a amplitude da ação salvadora de Deus.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém formalmente o genitivo grego e sua possível amplitude semântica; “que vem de Deus” explicita a ideia de origem e, por isso, fica como alternativa em nota.
theological_decisions:
- issue: Sentido da expressão πᾶσα σὰρξ
  choice: '“Toda carne”, com alcance humano universal: toda a humanidade verá a salvação de Deus.'
  alternative: “Toda a humanidade”, explicitando diretamente o sentido idiomático.
  rationale: No contexto da citação de Isaías, a expressão abrange universalmente os seres humanos. Preservar “toda carne” mantém a ressonância profética sem negar esse referente humano.
- issue: Relação expressa por τοῦ θεοῦ
  choice: “de Deus”, preservando a construção genitiva e sua abertura semântica.
  alternative: “que vem de Deus”, entendendo o genitivo como indicação explícita de origem.
  rationale: O grego permite compreender Deus como aquele a quem a salvação pertence e/ou de quem ela procede; a tradução principal evita resolver desnecessariamente essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o vocabulário preservam a concisão e o paralelismo profético do original.
