  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: pt
  text: A pá de joeirar[a] está em sua mão, para limpar completamente a sua eira e recolher o trigo em seu celeiro[b]; mas ele queimará por completo a palha com fogo que não se apaga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “forquilha de joeirar” ou, tradicionalmente, “ventilabro”. O termo grego designa o instrumento usado para lançar o cereal ao ar e separá-lo da palha.
    reason: lexical_alternative
  - marker: b
    text: Ou “depósito de cereais” ou “armazém”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com fogo inextinguível”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pá de joeirar
  rationale: Designa o instrumento usado para lançar ao ar o cereal e separar o grão da palha. “Pá de joeirar” comunica a prática agrícola com clareza em português moderno.
- source_word: διακαθᾶραι
  choice: limpar completamente
  rationale: O verbo composto intensifica a ideia de limpar ou desimpedir; a formulação preserva essa força e se ajusta naturalmente à imagem da eira.
- source_word: ἅλωνα
  choice: eira
  rationale: É o termo português preciso e tradicional para o espaço onde os cereais eram debulhados e joeirados.
- source_word: συναγαγεῖν
  choice: recolher
  rationale: Expressa naturalmente a reunião do trigo depois da joeira, sem acrescentar uma interpretação à metáfora.
- source_word: σῖτον
  choice: trigo
  rationale: Embora possa designar cereal de modo mais amplo, “trigo” é adequado no contraste contextual com a palha e é imediatamente compreensível.
- source_word: ἀποθήκην
  choice: celeiro
  rationale: Indica de forma natural o lugar onde o cereal é armazenado; mantém a imagem agrícola sem restringir indevidamente o tipo de construção.
- source_word: ἄχυρον
  choice: palha
  rationale: No contexto da joeira, refere-se ao material sem valor separado do grão. “Palha” é a designação portuguesa corrente nessa imagem bíblica e agrícola.
- source_word: κατακαύσει
  choice: queimará
  rationale: O contexto e o contraste transmitem a destruição pelo fogo; o verbo simples em português é natural, enquanto a impossibilidade de apagar o fogo reforça a ação consumidora.
- source_word: πυρὶ ἀσβέστῳ
  choice: com fogo que não se apaga
  rationale: Comunica em linguagem clara que o fogo não pode ser extinto, preservando sem suavização a força da imagem de juízo.
- source_word: οὗ
  choice: sua / ele
  rationale: O pronome relativo genitivo retoma aquele que vem no contexto anterior. Em português, a frase independente “A pá... está em sua mão” e a retomada “ele queimará” preservam a referência de modo natural.
theological_decisions:
- issue: Imagem de juízo na metáfora agrícola
  choice: Manter a separação decisiva entre o trigo recolhido e a palha queimada, sem explicar além do que o versículo afirma.
  alternative: Entender a imagem exclusivamente como juízo histórico sobre Israel ou convertê-la em uma formulação sistemática completa sobre o destino final.
  rationale: O texto apresenta simultaneamente recolhimento e juízo por meio de uma metáfora agrícola. A tradução conserva a intensidade de “fogo que não se apaga”, mas não define aqui o alcance, a duração ou todos os detalhes doutrinários desse juízo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se “eira” por sua precisão agrícola, compensada pelo contexto transparente da joeira. A sintaxe segue de perto a progressão do grego, mas evita a construção relativa pouco natural em português.
