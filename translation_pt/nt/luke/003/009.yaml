id: LUK.3.9
reference: Luke 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: pt
  text: O machado já está posto à raiz das árvores. Portanto, toda árvore que não produz bom fruto é cortada e lançada ao fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: já
  rationale: Expressa a urgência temporal de ἤδη e, em português natural, permite que δὲ καὶ funcione como elemento de continuidade e reforço sem uma sequência artificial de conectivos.
- source_word: ἡ ἀξίνη
  choice: o machado
  rationale: Equivalente corrente e claro para a ferramenta de corte presente na imagem de juízo.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: está posto à raiz das árvores
  rationale: Preserva a posição do machado junto à raiz e sua prontidão para o corte. “Está posto” representa κεῖται de maneira idiomática, sem converter a imagem em ação já iniciada.
- source_word: πᾶν οὖν δένδρον
  choice: Portanto, toda árvore
  rationale: “Portanto” conserva a inferência marcada por οὖν, e “toda árvore” mantém o alcance distributivo de πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: que não produz bom fruto
  rationale: “Produz” é natural com “fruto” e representa adequadamente ποιέω; “bom fruto” conserva tanto a imagem concreta quanto seu valor ético no contexto.
- source_word: ἐκκόπτεται
  choice: é cortada
  rationale: No contexto arbóreo, indica que a árvore é abatida. “Cortada” é conciso e natural, sem acrescentar detalhes ausentes do grego.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: e lançada ao fogo
  rationale: Mantém a voz passiva e a severidade da imagem. “Ao fogo” expressa de modo idiomático o movimento indicado por εἰς.
theological_decisions:
- issue: Imagem metafórica de juízo
  choice: Manter literalmente o machado, as árvores, o fruto e o fogo como advertência de juízo iminente
  alternative: Identificar explicitamente o fogo como inferno ou limitar a imagem exclusivamente a um juízo histórico sobre Israel
  rationale: O versículo comunica juízo severo e iminente, mas não define por si só todo o referente do fogo. A tradução preserva a tensão e não impõe um esquema escatológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão e a força proverbial da advertência. Não foram incluídas notas porque as alternativas lexicais não alteram substancialmente o sentido e poderiam sobrecarregar um versículo curto.
