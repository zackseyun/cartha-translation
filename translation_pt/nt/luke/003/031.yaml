lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante dos nomes forma uma construção elíptica cujo sentido, estabelecido pelo contexto, é «filho de». Explicitar a relação produz português natural sem acrescentar informação ao texto.
- source_word: Μελεὰ
  choice: Meleá
  rationale: Transliteração portuguesa direta do nome grego Μελεά, com acento gráfico para indicar a tonicidade final.
- source_word: Μεννὰ
  choice: Mená
  rationale: Representa diretamente a forma Μεννά do SBLGNT em ortografia portuguesa; «Menã» e «Menan» são formas alternativas encontradas na tradição.
- source_word: Ματταθὰ
  choice: Matatá
  rationale: Transliteração adaptada às convenções portuguesas, simplificando a consoante dupla grega e indicando a tonicidade final.
- source_word: Ναθὰμ
  choice: Natã
  rationale: Emprega a forma bíblica tradicional e reconhecível em português para Ναθάμ, filho de Davi.
- source_word: Δαυὶδ
  choice: Davi
  rationale: Emprega a forma consagrada em português para o nome grego Δαυίδ.
theological_decisions:
- issue: Elipse genealógica
  choice: Explicitar «filho de» diante de cada nome.
  alternative: Traduzir literalmente apenas «de Meleá, de Mená, de Matatá, de Natã, de Davi».
  rationale: A cadeia de genitivos depende da fórmula genealógica presente no contexto. A explicitação conserva o sentido da sintaxe grega e torna a sequência clara em português, sem resolver qualquer questão teológica além do que a construção implica.
translation_notes:
  register: Português moderno, digno e acessível, com formas de nomes reconhecíveis para leitores brasileiros e compreensão internacional. A repetição de «filho de» reproduz com clareza o caráter genealógico da passagem. Os marcadores das notas foram colocados no texto; a nota [b], embora apareça ao fim do versículo para acompanhar a camada inglesa auditada, esclarece especificamente a forma do nome Mená.
