lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo repetido diante de cada nome dá continuidade elíptica à relação genealógica expressa no contexto. “Filho de” torna essa relação clara e natural em português.
- source_word: Συμεὼν
  choice: Simeão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: Ἰούδα
  choice: Judá
  rationale: A forma grega pode ser vertida como “Judá” ou “Judas”; neste contexto genealógico, “Judá” representa melhor o nome semítico e evita uma associação indevida com Judas Iscariotes.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Forma portuguesa convencional e claramente reconhecível do nome próprio.
- source_word: Ἰωνὰμ
  choice: Jonã
  rationale: Forma tradicional e natural em português para o nome representado no texto grego como Ἰωνάμ; preserva a reconhecibilidade do nome na genealogia.
- source_word: Ἐλιακὶμ
  choice: Eliaquim
  rationale: Forma portuguesa convencional do nome semítico, clara e amplamente usada em traduções bíblicas.
