source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: pt
  text: 'A tudo isso acrescentou também: trancou João na prisão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Acrescentou também isto a todas elas.” O sentido é que Herodes somou esse ato a todas as suas outras maldades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: Acrescentou
  rationale: 'O aoristo de προστίθημι tem aqui sentido cumulativo: Herodes somou mais um ato às maldades já mencionadas.'
- source_word: καὶ τοῦτο
  choice: ainda esta
  rationale: A expressão aponta para o ato que vem em seguida e conserva sua força aditiva em português natural.
- source_word: ἐπὶ πᾶσιν
  choice: a todas as outras
  rationale: No contexto, a expressão significa que esse ato foi acrescentado a todas as maldades anteriores de Herodes. O feminino plural retoma naturalmente as maldades do versículo anterior.
- source_word: κατέκλεισεν
  choice: trancou
  rationale: Preserva o sentido concreto de fechar ou confinar, evitando reduzir a expressão inteira a um único verbo abstrato como “prendeu”.
- source_word: τὸν Ἰωάννην
  choice: João
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ἐν φυλακῇ
  choice: na prisão
  rationale: φυλακή designa aqui o lugar de confinamento; “na prisão” é claro e idiomático em português.
theological_decisions:
- issue: Referente e força de ἐπὶ πᾶσιν
  choice: A expressão indica que Herodes acrescentou a prisão de João a todas as suas maldades anteriores.
  alternative: 'Traduzir de modo mais estritamente formal: “acrescentou também isto a todas elas” ou “sobre todas elas”.'
  rationale: O contexto imediato enumera as maldades de Herodes e apresenta a prisão de João como mais uma. A tradução explicita apenas a relação contextual, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Trancou João na prisão” mantém a concretude do grego, enquanto a nota registra sua formulação mais literal e a ambiguidade superficial do pronome.
