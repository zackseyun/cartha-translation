id: LUK.3.11
reference: Luke 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: pt
  text: 'Ele lhes respondeu: “Quem tem duas túnicas[a] reparta com quem não tem nenhuma; e quem tem comida faça o mesmo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “camisas” ou “peças de roupa”. O termo grego se refere a uma túnica, peça básica de vestuário usada junto ao corpo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Ele lhes respondeu
  rationale: Reproduz com naturalidade em português a fórmula narrativa formada pelo particípio aoristo, o conectivo leve e o imperfeito de λέγω, sem impor ao contexto uma duração ou repetição que ele não exige.
- source_word: Ὁ ἔχων
  choice: Quem tem
  rationale: Expressa de modo corrente o particípio substantivado genérico e preserva sua aplicação ampla sem recorrer ao masculino genérico explícito.
- source_word: δύο χιτῶνας
  choice: duas túnicas
  rationale: χιτών designa uma peça básica de roupa, normalmente usada junto ao corpo; “túnicas” conserva melhor a referência histórica do que “camisas” ou “casacos”.
- source_word: μεταδότω
  choice: reparta
  rationale: O imperativo de terceira pessoa ordena que se dê uma parte do que se possui. “Reparta com” comunica tanto a força exortativa quanto a ideia de compartilhar.
- source_word: τῷ μὴ ἔχοντι
  choice: com quem não tem nenhuma
  rationale: O objeto ausente é recuperado naturalmente do contexto — nenhuma túnica —, e a construção corresponde ao dativo ligado ao ato de repartir.
- source_word: βρώματα
  choice: comida
  rationale: Termo português claro e abrangente para alimentos ou coisas de comer.
- source_word: ὁμοίως ποιείτω
  choice: faça o mesmo
  rationale: Mantém a força do imperativo e aplica à comida a mesma obrigação de partilha, em formulação idiomática.
theological_decisions:
- issue: Singular representativo e expressão de gênero
  choice: Quem tem ... quem não tem ... quem tem
  alternative: Aquele que tem ... aquele que não tem ... aquele que tem
  rationale: Os particípios masculinos singulares gregos têm sentido genérico. “Quem” mantém a abrangência e o número conceitual sem acrescentar exclusividade masculina nem tornar a frase pesada.
- issue: Força ética dos imperativos
  choice: reparta ... faça o mesmo
  alternative: deve repartir ... deve fazer o mesmo
  rationale: O subjuntivo usado como imperativo em português transmite diretamente a ordem de João, sem enfraquecê-la como simples sugestão nem ampliá-la com linguagem doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe é direta; “túnicas” preserva a precisão histórica e recebe nota cultural.
