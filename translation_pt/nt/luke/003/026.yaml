  text: τοῦ Μάαθ τοῦ Ματταθίου τοῦ Σεμεῒν τοῦ ⸀Ἰωσὴχ τοῦ Ἰωδὰ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/026.yaml
  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: pt
  text: filho de Maate[a], filho de Matatias, filho de Semeim, filho de Joseque, filho de Jodá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego é elíptico e repete apenas “de” diante de cada nome; “filho de” foi acrescentado para tornar explícita a relação genealógica indicada pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na genealogia de Lucas, o artigo no genitivo é repetido de modo elíptico e dá continuidade à relação genealógica indicada pelo contexto. A explicitação como “filho de” produz português claro e natural.
- source_word: Μάαθ
  choice: Maate
  rationale: Transliteração aportuguesada do nome próprio grego, com vogal final para representar naturalmente a consoante grega θ em português.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Forma portuguesa reconhecível do nome próprio grego Ματταθίας, aqui flexionado no genitivo.
- source_word: Σεμεῒν
  choice: Semeim
  rationale: Transliteração do nome grego com terminação adaptada à ortografia portuguesa.
- source_word: Ἰωσὴχ
  choice: Joseque
  rationale: Transliteração aportuguesada da leitura Ἰωσήχ do SBLGNT; “-que” representa de modo legível o som final de χ sem confundir o leitor quanto à pronúncia.
- source_word: Ἰωδὰ
  choice: Jodá
  rationale: Transliteração direta de Ἰωδά, com acento gráfico para preservar a tonicidade final indicada pelo grego.
