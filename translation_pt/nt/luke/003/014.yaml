revisions:
- from: 'Também alguns soldados lhe perguntavam: “E nós, o que devemos fazer?” Ele lhes respondeu: “Não extorquam ninguém nem façam acusações falsas; contentem-se com o seu soldo.”'
  to: 'Soldados também lhe perguntavam: “E nós, o que devemos fazer?” Ele lhes respondeu: “Não extorquam nem façam acusações falsas contra ninguém; contentem-se com o seu soldo.”'
  rationale: A revisão melhora a idiomaticidade portuguesa e a regência de «extorquir», preservando o sentido de abuso coercitivo e o objeto universal compartilhado pelas duas proibições. Não altera a força inclusiva da pergunta nem o sentido de ὀψώνια como remuneração militar.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:09:25Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a pergunta inclusiva dos soldados, as duas proibições e a exortação à satisfação com a remuneração. Contudo, «Não extorquam ninguém» é uma construção pouco natural em português, pois «extorquir» normalmente pede aquilo que se obtém ou uma formulação com «de alguém».
  naturalness: «Também alguns soldados lhe perguntavam» é compreensível, mas a colocação de «também» após «soldados» é mais fluida no português moderno. A reformulação das proibições preserva a concisão e torna explícito, para ambos os verbos, o alcance de «ninguém» no grego.
  terminology: «Soldados», «acusações falsas», «contentem-se» e «soldo» são adequados. «Soldo» mantém apropriadamente a referência à remuneração militar e é compreensível no registro proposto.
  issues:
  - severity: medium
    issue: Regência e naturalidade de «Não extorquam ninguém».
    rationale: Embora se possa inferir o sentido, o uso corrente de «extorquir» tende a exigir o bem extorquido («extorquir dinheiro») ou a pessoa introduzida por «de». «Não extorquam nem façam acusações falsas contra ninguém» expressa naturalmente as duas proibições, sem limitar a extorsão a dinheiro.
  - severity: low
    issue: Ordem marcada em «Também alguns soldados».
    rationale: «Soldados também lhe perguntavam» é mais idiomático e conserva o valor aditivo de καί.
  revised_text: 'Soldados também lhe perguntavam: “E nós, o que devemos fazer?” Ele lhes respondeu: “Não extorquam nem façam acusações falsas contra ninguém; contentem-se com o seu soldo.”'
  revised_footnotes: []
  revision_rationale: A revisão melhora a idiomaticidade portuguesa e a regência de «extorquir», preservando o sentido de abuso coercitivo e o objeto universal compartilhado pelas duas proibições. Não altera a força inclusiva da pergunta nem o sentido de ὀψώνια como remuneração militar.
