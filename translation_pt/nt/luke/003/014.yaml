source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: pt
  text: 'Soldados também lhe perguntavam: “E nós, o que devemos fazer?” Ele lhes respondeu: “Não extorquam nem façam acusações falsas contra ninguém; contentem-se com o seu soldo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατευόμενοι
  choice: soldados
  rationale: O particípio designa pessoas em serviço militar; “soldados” é claro, natural e adequado ao contexto.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: E nós, o que devemos fazer?
  rationale: 'A pergunta deliberativa é expressa naturalmente por “devemos fazer”, enquanto “E nós” preserva a ênfase explícita de καὶ ἡμεῖς: esse grupo também pergunta o que lhe cabe fazer.'
- source_word: διασείσητε
  choice: extorquam
  rationale: No contexto, o verbo indica obter algo por coerção ou intimidação, especialmente mediante abuso de poder. “Extorquir” comunica esse sentido sem acrescentar que o objeto seja necessariamente dinheiro.
- source_word: συκοφαντήσητε
  choice: façam acusações falsas
  rationale: A expressão transmite o sentido de acusar ou denunciar falsamente e evita restringir o termo ao sentido mais específico de chantagem.
- source_word: ἀρκεῖσθε
  choice: contentem-se
  rationale: O imperativo presente pede uma disposição contínua de satisfação com aquilo que recebem.
- source_word: ὀψωνίοις
  choice: soldo
  rationale: O termo era usado para a remuneração ou provisão dada a soldados; “soldo” preserva com precisão o contexto militar e é compreensível em português.
theological_decisions:
- issue: Instrução ética dirigida a soldados
  choice: Traduzir as ordens como proibições de abuso, falsa acusação e cobiça no exercício da condição militar.
  alternative: Entender o versículo como uma condenação implícita do próprio serviço militar.
  rationale: O texto não ordena que abandonem o serviço militar; dirige-se a eles em sua situação presente e especifica práticas injustas que devem evitar. A tradução não amplia essa observação para uma doutrina geral sobre a guerra ou a carreira militar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Também alguns soldados” reproduz o valor aditivo de καί sem a rigidez de uma ordem excessivamente literal. “Soldo” mantém a referência especificamente militar de ὀψώνια; a formulação conserva a concisão e a força ética do original.
