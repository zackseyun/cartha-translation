  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: pt
  text: Assim, com muitas outras exortações, ele anunciava as boas-novas ao povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: muitas outras exortações também
  rationale: O neutro plural deixa implícito o objeto de “muitas outras”; ligado ao particípio παρακαλῶν, a formulação natural em português pode expressá-lo como “exortações”, sem perder a alternativa mais literal indicada em nota.
- source_word: μὲν οὖν
  choice: Assim
  rationale: Marca continuação e transição inferencial no discurso; “Assim” preserva o fluxo sem traduzir excessivamente cada partícula.
- source_word: παρακαλῶν
  choice: com ... exortações
  rationale: No contexto da pregação profética de João, παρακαλέω tem o sentido de exortar, instar ou incentivar; “exortações” conserva tanto a admoestação moral quanto o apelo pastoral.
- source_word: εὐηγγελίζετο
  choice: anunciava as boas-novas
  rationale: O imperfeito descreve ação contínua no passado, enquanto “anunciava as boas-novas” mantém explicitamente o sentido de proclamação favorável de εὐαγγελίζω.
- source_word: τὸν λαόν
  choice: ao povo
  rationale: Traduz diretamente λαός e preserva suas possíveis ressonâncias coletivas sem restringir o referente a “multidão” ou explicitar “Israel”.
theological_decisions:
- issue: Força de εὐηγγελίζετο no ministério de João
  choice: anunciava as boas-novas
  alternative: pregava / anunciava
  rationale: O próprio texto caracteriza a mensagem exortativa de João como boas-novas. A tradução preserva essa tensão teológica, em vez de reduzi-la a uma pregação genérica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Boas-novas” mantém a força verbal de εὐαγγελίζω; “exortações” é corrente no registro bíblico, embora ligeiramente formal.
