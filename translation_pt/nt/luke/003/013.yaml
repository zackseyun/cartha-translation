base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: pt
  text: 'Então ele lhes disse[a]: “Não cobrem nada além do que foi determinado para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Não façam nada além do que foi determinado para vocês.” No contexto, o verbo se refere especificamente à atividade de cobrar impostos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Então ele
  rationale: δέ é um conectivo leve. “Então” dá continuidade natural ao diálogo sem introduzir um contraste forte.
- source_word: εἶπεν πρὸς αὐτούς
  choice: lhes disse
  rationale: Expressão portuguesa direta e natural para λέγω + πρός, preservando o destinatário plural.
- source_word: Μηδὲν πλέον
  choice: nada além
  rationale: Exprime com clareza a proibição de exceder o limite estabelecido.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: do que foi determinado para vocês
  rationale: 'Preserva o sentido passivo e oficial de διατάσσω: aquilo que foi ordenado, fixado ou prescrito para eles.'
- source_word: πράσσετε
  choice: cobrem
  rationale: Embora πράσσω tenha sentido amplo de “fazer”, no contexto imediato os destinatários são cobradores de impostos; “cobrem” explicita naturalmente em português a atividade subentendida.
theological_decisions:
- issue: Especificação contextual da ação subentendida em πράσσετε
  choice: 'Explicitar a cobrança: “Não cobrem nada além...”'
  alternative: “Não façam nada além do que foi determinado para vocês.”
  rationale: A tradução explicita a atividade indicada pelo contexto imediato, sem acrescentar conteúdo doutrinário. A alternativa formal preserva a amplitude lexical do verbo, mas pode soar como uma proibição geral, em vez de uma orientação sobre a cobrança de impostos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμῖν; “determinado” mantém a nuance de uma exigência oficialmente fixada.
