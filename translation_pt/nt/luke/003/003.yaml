id: LUK.3.3
reference: Luke 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: pt
  text: E ele percorreu toda a região ao redor do Jordão, proclamando um batismo de arrependimento para o perdão dos pecados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: percorreu toda a região ao redor do Jordão
  rationale: A combinação de ἦλθεν com εἰς e a área inteira designada por πᾶσαν περίχωρον é expressa naturalmente em português por “percorreu”, comunicando o movimento pela região sem exigir um ponto de referência para “veio”.
- source_word: κηρύσσων
  choice: proclamando
  rationale: Expressa o anúncio público próprio de κηρύσσω e evita restringir o sentido ao uso eclesiástico moderno de “pregar”.
- source_word: βάπτισμα
  choice: batismo
  rationale: É o equivalente português padrão e direto para o rito designado pelo substantivo grego.
- source_word: μετανοίας
  choice: de arrependimento
  rationale: Preserva a construção genitiva e a associação estreita entre o batismo e o arrependimento sem definir além do texto a natureza dessa relação.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: para o perdão dos pecados
  rationale: É uma tradução natural de εἰς ἄφεσιν ἁμαρτιῶν; “perdão” comunica adequadamente ἄφεσις neste contexto, sem excluir à força suas nuances de remissão ou libertação.
theological_decisions:
- issue: Relação entre batismo, arrependimento e perdão
  choice: “um batismo de arrependimento para o perdão dos pecados”
  alternative: “um batismo que expressava arrependimento em vista do perdão dos pecados”
  rationale: A formulação escolhida acompanha de perto βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν e mantém em aberto se o batismo é instrumental, declarativo, evidencial ou simbólico em relação ao perdão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Percorreu” torna idiomático o movimento pela região; “proclamando” preserva o caráter público do anúncio. Não são necessárias notas, pois as alternativas lexicais não alteram substancialmente o sentido e a ambiguidade teológica central permanece no próprio texto.
