reference: Luke 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: pt
  text: 'e o Espírito Santo desceu sobre ele em forma corporal, como uma pomba, e uma voz veio do céu: “Você é o meu Filho amado; em você me agradei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβῆναι
  choice: desceu
  rationale: Preserva o movimento descendente do aoristo infinitivo na sequência narrativa e soa natural em português.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Forma consagrada, clara e corrente em português contemporâneo.
- source_word: σωματικῷ εἴδει
  choice: em forma corpórea
  rationale: Expressa uma manifestação visível e corporal sem afirmar mais do que o texto grego; mantém o tom digno e a precisão da frase.
- source_word: ὡς περιστερὰν
  choice: como uma pomba
  rationale: Preserva a comparação introduzida por ὡς, sem sugerir que o Espírito se tornou literalmente uma pomba.
- source_word: ἐπ’ αὐτόν
  choice: sobre ele
  rationale: Comunica de modo natural a direção da descida até Jesus.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: veio do céu uma voz
  rationale: Reproduz de modo idiomático a expressão de acontecimento formada por φωνή e γενέσθαι.
- source_word: Σὺ εἶ
  choice: Você é
  rationale: Mantém o discurso direto e a ênfase do pronome explícito em linguagem moderna, amplamente compreensível e com legibilidade brasileira.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: o meu Filho amado
  rationale: Conserva a relação filial, o possessivo e o valor de ἀγαπητός em formulação natural e solene.
- source_word: ἐν σοὶ εὐδόκησα
  choice: em você me agrado
  rationale: A formulação portuguesa expressa aprovação e deleite presentes de maneira natural; a nuance mais formalmente passada do aoristo é preservada em nota.
theological_decisions:
- issue: Natureza da manifestação do Espírito
  choice: O Espírito Santo desceu de modo corporal e visível, comparado a uma pomba.
  alternative: O Espírito desceu como uma pomba literal.
  rationale: σωματικῷ εἴδει indica manifestação corpórea, enquanto ὡς introduz uma comparação; a tradução evita transformar a comparação em identificação ontológica.
- issue: Força temporal de εὐδόκησα
  choice: “em você me agrado” no texto principal
  alternative: “em você me agradei”
  rationale: O aoristo pode ser vertido formalmente pelo passado, mas a declaração idiomática em português comunica naturalmente a aprovação divina como vigente. A nota conserva a alternativa temporal mais formal.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. “Você” evita o regionalismo verbal associado a “tu”; “forma corpórea” mantém precisão sem recorrer a linguagem arcaica. A pontuação preserva o fluxo da frase grega e a fala direta.
