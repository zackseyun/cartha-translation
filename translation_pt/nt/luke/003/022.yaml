  to: 'e o Espírito Santo desceu sobre ele em forma corporal, como uma pomba, e uma voz veio do céu: “Você é o meu Filho amado; em você me agradei.”'
  rationale: A revisão conserva a comparação «como uma pomba» e a manifestação em forma visível, mas emprega «forma corporal» por clareza idiomática. «Em você me agradei» representa diretamente o aoristo εὐδόκησα; por isso, a nota que apresentava essa forma como mera alternativa é desnecessária.
