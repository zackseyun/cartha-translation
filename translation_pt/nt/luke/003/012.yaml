id: LUK.3.12
reference: Luke 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: pt
  text: 'Até cobradores de impostos vieram para ser batizados[a] e lhe disseram: “Mestre, o que devemos fazer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cobradores de impostos também vieram para ser batizados.”'
    reason: Alternativa que distribui a força aditiva de καί por meio de “também”, em vez da ênfase inicial com “Até”.
lexical_decisions:
- source_word: ἦλθον
  choice: vieram
  rationale: O aoristo indicativo de ἔρχομαι é expresso naturalmente como um acontecimento passado simples.
- source_word: δὲ καὶ τελῶναι
  choice: Até cobradores de impostos
  rationale: δέ faz avançar a narrativa, enquanto καί tem aqui força aditiva e enfática. “Até” preserva a inclusão surpreendente desse grupo no contexto.
- source_word: βαπτισθῆναι
  choice: para ser batizados
  rationale: 'O infinitivo aoristo passivo após ἦλθον indica finalidade: eles vieram a fim de receber o batismo.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: lhe disseram
  rationale: Mantém o sentido direto de λέγω com πρός, sem substituir o verbo por “perguntaram”, embora a fala tenha forma interrogativa.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Forma de tratamento natural e digna em português para alguém que ensina; no uso contemporâneo, “Professor” seria excessivamente institucional.
- source_word: τί ποιήσωμεν
  choice: o que devemos fazer?
  rationale: O subjuntivo aoristo deliberativo solicita orientação sobre a conduta apropriada; “devemos” comunica isso com clareza em português atual.
theological_decisions:
- issue: Inclusão de um grupo socialmente estigmatizado no chamado de João ao arrependimento
  choice: Preservar a ênfase inclusiva com “Até cobradores de impostos”.
  alternative: “Cobradores de impostos também vieram para ser batizados.”
  rationale: A formulação principal conserva a força retórica de que até esse grupo, visto com desconfiança no contexto narrativo, respondeu à mensagem, sem acrescentar juízo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cobradores de impostos” é transparente; “lhe disseram” evita repetição pesada; a ordem da frase preserva a ênfase do grego.
