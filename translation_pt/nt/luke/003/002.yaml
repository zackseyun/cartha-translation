id: LUK.3.2
reference: Luke 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: pt
  text: durante o sumo sacerdócio de Anás e Caifás[a], a palavra de Deus veio a João, filho de Zacarias, no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «no sumo sacerdócio de Anás e Caifás». Lucas menciona os dois, embora o cargo esteja no singular.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: durante o sumo sacerdócio de Anás e Caifás
  rationale: Neste contexto cronológico, ἐπί com o genitivo indica o período em que algo ocorreu. A formulação mantém no singular o cargo expresso por ἀρχιερέως, sem eliminar a tensão histórica e literária de Lucas mencionar Anás e Caifás.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: a palavra de Deus veio
  rationale: Reproduz de modo natural em português a fórmula profética bíblica, na qual ἐγένετο expressa a ocorrência da revelação, sem a tradução rígida e pouco idiomática «aconteceu».
- source_word: ἐπὶ Ἰωάννην
  choice: a João
  rationale: Com a ideia de vir ou de revelação, ἐπί com o acusativo indica o destinatário. «Veio a João» é corrente e preserva a direção da palavra divina.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: filho de Zacarias
  rationale: A expressão em aposição identifica João. A forma sem artigo é natural em português depois do nome próprio e conserva o tom narrativo.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: Em português bíblico corrente, «deserto» designa adequadamente uma região erma e pouco habitada, sem necessariamente sugerir apenas dunas ou areia.
theological_decisions:
- issue: A referência a Anás e Caifás diante do singular ἀρχιερέως
  choice: 'Manter a instituição no singular: «durante o sumo sacerdócio de Anás e Caifás»'
  alternative: «quando Anás e Caifás eram sumos sacerdotes»
  rationale: O grego emprega ἀρχιερέως no singular, embora nomeie duas pessoas. A tradução preserva essa tensão, sem harmonizá-la por meio de um plural nem explicar no corpo do versículo a situação histórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Sumo sacerdócio» preserva a precisão institucional; «no deserto» segue o uso bíblico corrente em português.
