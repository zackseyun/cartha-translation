  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: pt
  text: 'Ele, porém, respondeu-lhe: “Senhor, deixe-a[a] também este ano, até que eu cave ao redor dela e coloque esterco nela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poupe-a” ou “deixe-a ficar”.
    reason: lexical_alternative
  - marker: b
    text: De modo mais geral, “adube-a”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ
  choice: Ele, porém, respondeu
  rationale: A construção narrativa com particípio e verbo de fala é idiomática no grego. Em português, “respondeu” comunica naturalmente ambos sem a redundância pouco corrente de “respondendo, disse-lhe”.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” preserva o título respeitoso dirigido ao proprietário da vinha e mantém a correspondência usual de κύριος, sem exigir aqui uma identificação teológica explícita.
- source_word: ἄφες αὐτὴν
  choice: deixe-a
  rationale: O verbo significa permitir que a figueira permaneça, sem cortá-la. “Deixe-a” conserva a formulação direta; “poupe-a” tornaria explícita a suspensão da sentença, que no grego está apenas implícita pelo contexto.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: também este ano
  rationale: Reproduz a ideia de acrescentar o ano presente ao tempo já concedido, sem parafrasear como “mais um ano”.
- source_word: ἕως ὅτου
  choice: até que
  rationale: Introduz de modo natural em português o limite associado às ações que o trabalhador pretende realizar.
- source_word: σκάψω περὶ αὐτὴν
  choice: eu cave ao redor dela
  rationale: Mantém a imagem concreta de cavar em torno da figueira, sem explicitar finalidades agrícolas que o texto não declara.
- source_word: βάλω κόπρια
  choice: coloque esterco
  rationale: “Esterco” conserva o sentido concreto de κόπρια como matéria usada para fertilizar; “adube” seria mais geral e menos vívido.
theological_decisions:
- issue: Sentido de κύριος no diálogo da parábola
  choice: Senhor
  alternative: patrão; senhor (apenas como tratamento cortês)
  rationale: No cenário narrativo, o termo é um tratamento respeitoso dirigido ao proprietário. “Senhor” mantém essa possibilidade e a correspondência lexical habitual, sem afirmar que o personagem esteja diretamente chamando Deus ou Jesus de Senhor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “também este ano” acompanha de perto o grego, e as imagens agrícolas concretas foram preservadas. As aspas marcam a fala direta; não se acrescentou “disse-lhe”, pois o destinatário já está claro no contexto e a fórmula grega de resposta foi vertida de modo natural.
