  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: pt
  text: 'Então, alguém lhe disse: “Senhor[a], são poucos os que estão sendo salvos?[b]” Ele lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Senhor” também pode ser entendido como uma forma respeitosa de tratamento; o grego deixa em aberto todo o peso do título neste contexto.
    reason: alternative_reading
  - marker: b
    text: 'Ou, de forma mais concisa: “são poucos os salvos?” A redação do texto principal conserva mais claramente o aspecto presente da expressão grega.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: Então / porém
  rationale: A primeira ocorrência funciona como conexão narrativa leve e é expressa naturalmente por “Então”; a segunda marca a passagem da pergunta para a resposta e é vertida por “porém”, sem criar um contraste forte demais.
- source_word: τις
  choice: alguém
  rationale: Mantém a referência indefinida a uma pessoa não identificada, em português corrente.
- source_word: αὐτῷ
  choice: lhe
  rationale: Preserva o pronome grego sem inserir explicitamente o nome de Jesus neste versículo.
- source_word: Κύριε
  choice: Senhor
  rationale: É a tradução usual de κύριος e mantém aberta a possibilidade de ser tanto um tratamento respeitoso quanto um título de maior peso cristológico.
- source_word: εἰ ὀλίγοι
  choice: são poucos
  rationale: Reproduz de modo natural a pergunta introduzida por εἰ e mantém o foco no pequeno número, sem acrescentar uma restrição lexical inexistente de forma explícita.
- source_word: οἱ σῳζόμενοι
  choice: os que estão sendo salvos
  rationale: Preserva o artigo, a voz passiva e o aspecto presente do particípio, sem transformá-lo em simples resultado concluído.
- source_word: πρὸς αὐτούς
  choice: lhes
  rationale: 'Mantém o pronome plural: embora uma só pessoa tenha perguntado, a resposta é dirigida a várias pessoas.'
theological_decisions:
- issue: Força de Κύριε como forma de tratamento
  choice: Senhor
  alternative: Senhor, no sentido meramente respeitoso de “senhor” ou “senhor meu”
  rationale: O grego permite desde um tratamento cortês até uma designação cristologicamente significativa. “Senhor” conserva essa abertura sem reduzi-la a mera cortesia.
- issue: Aspecto de σῳζόμενοι
  choice: estão sendo salvos
  alternative: são salvos
  rationale: A forma presente passiva pode apresentar a salvação como processo ou estado em curso. A tradução escolhida preserva esse aspecto sem impor um sistema soteriológico específico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A formulação conserva a pergunta direta, o aspecto passivo contínuo de σῳζόμενοι e a mudança do interlocutor singular para o público plural.
