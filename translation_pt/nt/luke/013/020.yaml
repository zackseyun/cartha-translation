  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: pt
  text: 'E disse novamente: “A que compararei o reino de Deus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples do grego sem acrescentar uma nuance temporal.
- source_word: πάλιν
  choice: novamente
  rationale: Expressa de modo natural e direto a repetição indicada pelo advérbio.
- source_word: εἶπεν
  choice: disse
  rationale: É a forma idiomática em português para introduzir discurso direto neste contexto narrativo.
- source_word: Τίνι
  choice: A que
  rationale: O dativo interrogativo, no contexto da construção comparativa, pergunta por um termo de comparação, não por uma pessoa.
- source_word: ὁμοιώσω
  choice: compararei
  rationale: Mantém o futuro do verbo grego e comunica adequadamente a força deliberativa da pergunta retórica.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: o reino de Deus
  rationale: Preserva a expressão bíblica consagrada e a amplitude semântica de βασιλεία, que pode abranger tanto o governo régio quanto o âmbito desse governo.
theological_decisions:
- issue: Tradução de βασιλεία em uma declaração sobre o governo de Deus
  choice: o reino de Deus
  alternative: o reinado de Deus
  rationale: “Reino de Deus” preserva a formulação bíblica reconhecida e não reduz o sentido apenas ao exercício dinâmico do governo, embora “reinado de Deus” seja uma alternativa lexical possível.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A ordem e a concisão da pergunta grega foram preservadas; não há necessidade de nota de rodapé.
