id: LUK.13.17
reference: Luke 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: pt
  text: Enquanto ele dizia essas coisas, todos os que se opunham a ele[a] ficavam envergonhados[b], e toda a multidão se alegrava com todas as coisas gloriosas[c] que eram feitas por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus adversários”.
    reason: lexical_alternative
  - marker: b
    text: Ou “eram humilhados” ou “passavam vergonha”.
    reason: lexical_alternative
  - marker: c
    text: Ou “coisas maravilhosas” ou “coisas esplêndidas”. O grego diz literalmente “coisas gloriosas”, expressão ampla que pode incluir seus feitos poderosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Enquanto ele dizia essas coisas
  rationale: A construção genitiva absoluta com particípio presente indica simultaneidade e ação em curso; “enquanto” comunica isso com naturalidade em português.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: os que se opunham a ele
  rationale: Mantém a força verbal e contínua do particípio, em vez de reduzi-lo ao substantivo mais estático “adversários”.
- source_word: κατῃσχύνοντο
  choice: ficavam envergonhados
  rationale: Expressa o estado resultante e progressivo indicado pelo imperfeito, em português natural, preservando a ideia de vergonha pública sem intensificá-la necessariamente como “humilhação”.
- source_word: πᾶς ὁ ὄχλος
  choice: toda a multidão
  rationale: Forma idiomática que conserva o sentido coletivo e abrangente da expressão grega.
- source_word: ἔχαιρεν
  choice: se alegrava
  rationale: O imperfeito indica uma reação contínua; “se alegrava” preserva esse aspecto durativo.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: com todas as coisas gloriosas
  rationale: “Com” indica naturalmente o motivo da alegria, e “coisas gloriosas” mantém a amplitude de ἔνδοξος sem restringir a referência a milagres.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: que ele realizava
  rationale: A forma ativa é mais natural em português e mantém Jesus como agente explícito das ações, enquanto o imperfeito comunica sua ocorrência continuada.
theological_decisions:
- issue: Natureza das “coisas gloriosas”
  choice: coisas gloriosas
  alternative: coisas maravilhosas; feitos milagrosos
  rationale: O contexto inclui uma cura, mas ἔνδοξος é mais amplo que “milagroso”. A tradução conserva essa amplitude e não restringe indevidamente as ações de Jesus a uma única categoria.
- issue: Agência em ὑπ’ αὐτοῦ
  choice: que ele realizava
  alternative: que eram realizadas por ele; que aconteciam por meio dele
  rationale: A construção grega atribui diretamente a Jesus a agência. A formulação ativa é idiomática e não introduz a ideia mais indireta de que as coisas apenas aconteciam “por meio” dele.
- issue: Valor passivo ou médio de κατῃσχύνοντο
  choice: ficavam envergonhados
  alternative: eram humilhados; passavam vergonha
  rationale: A escolha preserva o resultado de vergonha sem decidir de modo excessivamente rígido entre experiência interna e desonra pública; a nota registra alternativas possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperfeitos “dizia”, “se opunham”, “ficavam”, “se alegrava” e “realizava” preservam o caráter contínuo das ações. Evitou-se “milagres” para não estreitar o alcance semântico do original.
