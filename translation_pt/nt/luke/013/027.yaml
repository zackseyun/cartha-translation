source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: pt
  text: 'E ele dirá a vocês: “Não sei de onde vocês vêm. Afastem-se de mim, todos vocês que praticam a injustiça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: ele dirá a vocês
  rationale: A construção grega combina o futuro de λέγω com um particípio redundante do mesmo verbo. Em português natural, a função introdutória da expressão é preservada sem reproduzir a repetição de modo artificial.
- source_word: οὐκ οἶδα πόθεν ἐστέ
  choice: Não sei de onde vocês são
  rationale: Mantém o sentido direto de οἶδα, “saber/conhecer”, e de πόθεν, que indica origem, sem explicitar além do texto a possível ideia contextual de não reconhecimento.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Afastem-se de mim
  rationale: O imperativo pede separação decidida. “Afastem-se” conserva esse sentido e tem tom digno e claro no português moderno.
- source_word: πάντες ἐργάται ἀδικίας
  choice: todos vocês que praticam a injustiça
  rationale: A formulação verbal é mais natural em português do que “trabalhadores da injustiça” e preserva a ideia de pessoas caracterizadas pela prática da ἀδικία.
theological_decisions:
- issue: Sentido de ἀδικίας na declaração de juízo
  choice: injustiça
  alternative: maldade; prática do mal; iniquidade
  rationale: “Injustiça” corresponde diretamente a ἀδικία e preserva sua relação conceitual com a justiça, sem introduzir a noção mais específica de violação da lei. “Iniquidade” seria possível, mas é menos corrente para muitos leitores.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. O plural “vocês” evita regionalismos; a redundância semítica de ἐρεῖ λέγων foi integrada em uma introdução de fala natural.
