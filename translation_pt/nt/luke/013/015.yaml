source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: pt
  text: 'Mas o Senhor lhe respondeu: “Hipócritas! No sábado, cada um de vocês não desamarra o seu boi ou jumento da manjedoura[a] e o leva para dar-lhe água?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cocho”. O termo grego pode designar um lugar ou recipiente de alimentação para animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: o Senhor
  rationale: Preserva o título narrativo e cristológico empregado por Lucas para Jesus, sem reduzi-lo a “mestre” ou “dono”.
- source_word: Ὑποκριταί
  choice: Hipócritas
  rationale: Mantém o vocativo plural e a contundência da repreensão direta.
- source_word: ἕκαστος ὑμῶν
  choice: cada um de vocês
  rationale: 'Expressa com naturalidade a força distributiva: Jesus apela à prática de cada ouvinte.'
- source_word: τῷ σαββάτῳ
  choice: no sábado
  rationale: Equivalente temporal corrente e claro em português.
- source_word: λύει
  choice: desamarra
  rationale: No contexto de um animal preso junto ao local de alimentação, indica de modo concreto que se solta a amarra.
- source_word: βοῦν
  choice: boi
  rationale: Termo tradicional, natural e contextualmente adequado para o bovino mencionado ao lado do jumento.
- source_word: ὄνον
  choice: jumento
  rationale: Equivalente claro e amplamente compreensível para o animal de carga; evita termos ambíguos ou excessivamente regionais.
- source_word: φάτνης
  choice: manjedoura
  rationale: Designa o lugar ou recipiente onde o animal se alimenta e conserva a imagem concreta do texto; a amplitude lexical é registrada em nota.
- source_word: ἀπαγαγὼν
  choice: o leva
  rationale: 'Converte naturalmente o particípio aoristo em verbo coordenado, preservando a sequência: desamarrar, levar e dar água.'
- source_word: ποτίζει
  choice: dar-lhe água
  rationale: Expressa de maneira idiomática o ato de fazer o animal beber, sem a possível estranheza de “regá-lo”.
theological_decisions:
- issue: Título narrativo κύριος aplicado a Jesus
  choice: o Senhor
  alternative: o mestre
  rationale: “O Senhor” preserva o peso cristológico do uso narrativo de Lucas sem acrescentar explicação ao texto.
- issue: Plural Ὑποκριταί após resposta dirigida a um indivíduo
  choice: Hipócritas
  alternative: Hipócrita
  rationale: Mantém a mudança textual do singular αὐτῷ (“lhe”) para o vocativo plural, preservando a tensão de Jesus responder ao dirigente e repreender um grupo mais amplo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva a pergunta retórica, a repreensão incisiva e a mudança do interlocutor singular para o vocativo plural. A ordem “da manjedoura” junto de “desamarra” deixa clara a relação sintática.
