id: LUK.13.26
reference: Luke 13:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: pt
  text: 'Então vocês começarão a dizer: “Comemos e bebemos na tua presença, e ensinaste em nossas ruas[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em nossas praças públicas”; o termo grego pode designar ruas largas ou espaços públicos abertos dentro de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural e conciso a sequência temporal no discurso.
- source_word: ἄρξεσθε λέγειν
  choice: vocês começarão a dizer
  rationale: Preserva explicitamente o sentido ingressivo da construção com ἄρχω e o infinitivo λέγειν, em vez de reduzi-la a uma simples declaração futura.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Comemos e bebemos
  rationale: Os aoristos coordenados são expressos naturalmente pelo pretérito perfeito simples e mantêm a referência a uma convivência à mesa.
- source_word: ἐνώπιόν σου
  choice: na tua presença
  rationale: Comunica proximidade pessoal e associação externa, não apenas posição espacial, sem sugerir que o interlocutor reconheça uma relação salvífica.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: em nossas ruas
  rationale: πλατεῖαι pode designar ruas largas ou espaços públicos abertos de uma cidade. “Ruas” é natural e não restringe indevidamente o referente; a alternativa é registrada em nota.
- source_word: ἐδίδαξας
  choice: ensinaste
  rationale: O pretérito perfeito simples preserva o valor histórico do aoristo e a alegação de que o ensino ocorreu publicamente entre eles.
theological_decisions:
- issue: Natureza do apelo dos que falam a Jesus
  choice: A formulação conserva a alegação de associação exterior — comer e beber na presença dele e ouvi-lo ensinar em suas ruas — sem implicar uma relação reconhecida ou salvífica.
  alternative: Uma tradução mais livre poderia sugerir comunhão aceita, intimidade espiritual ou reconhecimento da parte de Jesus.
  rationale: O texto apresenta a defesa dos que falam com base na proximidade e no contato público. A tradução mantém essa tensão sem acrescentar validação teológica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural explícito e formas de segunda pessoa singular (“tua”, “ensinaste”) dentro da fala dirigida a Jesus. A colocação do marcador após “ruas” vincula corretamente a nota à alternativa lexical.
