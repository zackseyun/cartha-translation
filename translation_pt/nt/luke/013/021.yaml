review_pass:
  verdict: revise
  source_fidelity: O texto traduz corretamente a comparação, ζύμη como «fermento», a ação literal de esconder e as três medidas de farinha. Contudo, «até que tudo ficasse fermentado» introduz uma forma verbal subjuntiva/imperfeita menos direta do que o aoristo passivo grego e pode soar como finalidade; «até que tudo fermentasse» expressa de modo mais idiomático o resultado abrangente. A construção «É semelhante ao fermento que...» pode também sugerir que «que» restrinja «fermento»; a pausa com vírgula reflete melhor a oração relativa que descreve a ação da mulher.
  naturalness: «É semelhante ao fermento, que uma mulher pegou e escondeu...» é clara e natural em português moderno. «Tomou» é mais sóbrio e internacional do que «pegou», sem sacrificar clareza. «Até que tudo fermentasse» é mais fluente e preserva a referência abrangente, deixada implicitamente no grego.
  terminology: '«Fermento» é apropriado para ζύμη. A nota alternativa «massa fermentada» não é uma boa alternativa lexical neste contexto: ζύμη designa o agente fermentador/levedura, não a massa já fermentada. «Três satás» requer pequena explicação de que satá é uma medida; a equivalência «seás» pode ajudar, mas não é indispensável.'
  issues:
  - severity: low
    issue: Alternativa lexical imprecisa na nota de «fermento».
    rationale: «Massa fermentada» designa primariamente a massa, ao passo que ζύμη aqui é o fermento/agente de fermentação. «Levedura» é uma alternativa portuguesa mais adequada, embora «fermento» permaneça preferível no texto.
  - severity: low
    issue: Tempo/modo de «ficasse fermentado».
    rationale: O grego ἐζυμώθη é aoristo passivo indicativo após ἕως οὗ. «Até que tudo fermentasse» é uma solução portuguesa mais direta para o evento completo, sem a nuance potencial ou de finalidade que «ficasse» pode sugerir.
  - severity: low
    issue: Pontuação e escolha verbal na oração relativa.
    rationale: A vírgula antes de «que» torna explícito que se trata da descrição da parábola, não de uma restrição identificadora de «fermento». «Tomou» mantém registro narrativo mais sóbrio que «pegou».
  revised_text: É semelhante ao fermento[a], que uma mulher tomou e escondeu[b] em três medidas[c] de farinha, até que tudo fermentasse.
