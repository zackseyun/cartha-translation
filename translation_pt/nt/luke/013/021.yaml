  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: pt
  text: É semelhante ao fermento[a], que uma mulher tomou e escondeu[b] em três medidas[c] de farinha, até que tudo fermentasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levedura”. O termo grego designa um agente fermentador usado na massa.
    reason: lexical_alternative
  - marker: b
    text: Ou “misturou”. O verbo grego significa literalmente “escondeu” ou “ocultou”.
    reason: lexical_alternative
  - marker: c
    text: Em grego, “três satás” (cerca de três seás), uma grande quantidade de farinha.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: É semelhante a
  rationale: Reproduz naturalmente em português a comparação predicativa que introduz a parábola.
- source_word: ζύμῃ
  choice: fermento
  rationale: É o equivalente corrente em português para o agente fermentador e preserva a imagem antiga sem sugerir necessariamente um produto industrial moderno.
- source_word: λαβοῦσα γυνὴ
  choice: uma mulher pegou
  rationale: Converte o particípio aoristo em uma sequência verbal natural, mantendo a anterioridade da ação.
- source_word: ἔκρυψεν
  choice: escondeu
  rationale: Mantém o sentido literal e expressivo do verbo grego, sem substituí-lo silenciosamente pela interpretação contextual 'misturou'.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: em três medidas de farinha
  rationale: Oferece uma formulação compreensível no texto e reserva para a nota a unidade antiga e a grande quantidade envolvida.
- source_word: ἕως οὗ
  choice: até que
  rationale: Equivalente temporal direto e idiomático.
- source_word: ἐζυμώθη ὅλον
  choice: tudo ficasse fermentado
  rationale: Expressa a voz passiva e o alcance total de ὅλον com naturalidade, sem explicitar 'massa', palavra não presente no grego.
theological_decisions:
- issue: Valor simbólico do fermento
  choice: Manter apenas a imagem neutra do fermento
  alternative: Explicitar que o fermento representa crescimento positivo ou influência negativa
  rationale: O versículo não define explicitamente a valência simbólica da imagem; a tradução não deve resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue os termos a que cada nota se refere, e todos aparecem no texto principal.
