  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: pt
  text: 'E ele lhes respondeu: “Vocês pensam que esses galileus se tornaram mais pecadores do que todos os outros galileus por terem sofrido essas coisas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: respondeu
  rationale: A construção semítica, literalmente “respondendo, disse”, é expressa com naturalidade em português pelo verbo “respondeu”, sem perda do sentido discursivo.
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: se tornaram mais pecadores do que todos os outros galileus
  rationale: “Se tornaram” preserva o valor de ἐγένοντο, conforme a evidência textual fornecida; “mais pecadores do que” comunica a comparação introduzida por παρά, e “outros” explicita naturalmente que os homens mencionados pertenciam ao mesmo grupo.
- source_word: ταῦτα πεπόνθασιν
  choice: terem sofrido essas coisas
  rationale: O infinitivo composto após “por” representa com naturalidade a relação causal indicada por ὅτι e mantém o aspecto resultante do perfeito πεπόνθασιν sem tornar a frase artificial.
theological_decisions:
- issue: Relação entre sofrimento e grau de pecado
  choice: Manter a pergunta sem afirmar que o sofrimento prova maior culpa
  alternative: Traduzir de modo explicativo, como “porque mereceram sofrer assim”
  rationale: O texto apresenta como pergunta a suposição dos ouvintes; não se deve inserir na tradução uma conclusão teológica que só será tratada pela resposta subsequente de Jesus.
- issue: Valor de ἐγένοντο
  choice: “se tornaram”
  alternative: “eram” ou “foram considerados”
  rationale: A tradução preserva o sentido verbal mais direto de γίνομαι e a tensão incomum da formulação, sem substituí-la por uma interpretação mais fluente, porém menos formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”, de boa legibilidade brasileira. A ordem foi ajustada para soar natural, evitando o calque “respondendo, disse”.
