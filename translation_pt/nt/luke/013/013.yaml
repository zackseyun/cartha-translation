source:
  edition: SBLGNT
  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: pt
  text: E pôs as mãos sobre ela; imediatamente, ela se endireitou[a] e glorificava a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou ereta” ou “foi endireitada”.
    reason: Alternativas lexicais para ἀνωρθώθη, que pode destacar a postura resultante ou conservar mais explicitamente a forma passiva grega.
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: pôs as mãos sobre ela
  rationale: Reproduz de modo natural em português a expressão grega de imposição das mãos, mantendo a ação concreta e identificando Jesus como o possuidor implícito das mãos.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Expressa com clareza que a cura ocorreu sem demora.
- source_word: ἀνωρθώθη
  choice: ela se endireitou
  rationale: No contexto da mulher encurvada, esta formulação portuguesa descreve naturalmente a passagem à postura ereta. Embora o grego tenha forma passiva, o verbo pronominal português não exige que ela tenha realizado a cura por esforço próprio; a nota preserva alternativas mais explícitas.
- source_word: ἐδόξαζεν
  choice: glorificava
  rationale: Mantém o sentido teológico de δοξάζω e representa o aspecto imperfeito, apresentando a glorificação como resposta em curso.
- source_word: τὸν θεόν
  choice: a Deus
  rationale: É a tradução direta e idiomática do objeto de ἐδόξαζεν.
theological_decisions:
- issue: Resultado físico expresso por ἀνωρθώθη
  choice: ela se endireitou
  alternative: ela ficou ereta; ela foi endireitada
  rationale: A tradução comunica a restauração corporal indicada pelo contexto sem especificar além do texto o mecanismo da cura. A nota conserva tanto a leitura de estado resultante quanto a forma passiva mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “e” acompanha a coordenação narrativa grega; o ponto e vírgula evita uma sequência excessivamente pesada. “Glorificava” preserva o imperfeito, embora “dava glória” também fosse idiomático.
