  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: pt
  text: 'E vejam: há últimos que serão primeiros, e há primeiros que serão últimos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: vejam
  rationale: Emprega um chamamento de atenção natural no português moderno, preservando a função discursiva de ἰδοὺ sem recorrer ao mais tradicional e menos corrente «eis».
- source_word: ἔσχατοι
  choice: últimos
  rationale: Mantém a posição ou condição de estar por último, sem restringir o sentido a inferioridade moral, e conserva a antítese concisa com «primeiros».
- source_word: πρῶτοι
  choice: primeiros
  rationale: É o correspondente direto e idiomático de ἔσχατοι nesta declaração de inversão.
- source_word: εἰσὶν
  choice: alguns que são
  rationale: Expressa de modo natural em português a construção existencial grega («há últimos»), sem dar a entender que todas as pessoas atualmente em determinada posição necessariamente sofrerão a inversão.
- source_word: οἳ ἔσονται
  choice: serão
  rationale: Reproduz diretamente a predicação futura das orações relativas, com formulação clara e concisa.
- source_word: καὶ
  choice: e
  rationale: Preserva tanto a ligação inicial como o paralelismo equilibrado entre as duas metades da declaração.
theological_decisions:
- issue: Alcance da declaração de inversão
  choice: Apresentar uma declaração geral sobre a inversão de posições, sem especificar no texto categorias étnicas, sociais ou escatológicas.
  alternative: Interpretá-la especificamente como referência a judeus e gentios, à humildade e ao orgulho, ou às posições no juízo final.
  rationale: Embora o contexto trate da entrada no Reino de Deus e permita várias aplicações, o grego formula o princípio de maneira breve e ampla. A tradução preserva essa abertura e a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vejam» funciona como chamamento de atenção corrente; a estrutura paralela e aforística do original foi preservada.
