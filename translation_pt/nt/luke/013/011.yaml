  to: E eis que havia uma mulher que, havia dezoito anos, tinha um espírito de enfermidade[a]. Ela estava encurvada e não conseguia se endireitar completamente.
  rationale: A revisão remove uma localização não expressa no original e substitui uma formulação levemente interpretativa por outra que reproduz mais de perto a descrição grega. Mantêm-se “espírito de enfermidade” e a nota, pois ambos preservam a ambiguidade textual e a referência explícita a espírito.
