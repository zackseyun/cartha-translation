id: LUK.13.11
reference: Luke 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: pt
  text: E eis que havia uma mulher que, havia dezoito anos, tinha um espírito de enfermidade[a]. Ela estava encurvada e não conseguia se endireitar completamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito debilitante” ou “um espírito de fraqueza”. O grego menciona explicitamente um “espírito”, o que pode indicar atuação espiritual em sua aflição.
    reason: alternativa lexical e preservação da ambiguidade quanto à natureza da aflição
lexical_decisions:
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o recurso narrativo que chama a atenção, em registro digno e ainda compreensível em português moderno.
- source_word: γυνὴ
  choice: uma mulher
  rationale: Introduz uma pessoa ainda não identificada, conforme o caráter indefinido do contexto.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: tinha um espírito de enfermidade
  rationale: Mantém a menção explícita a πνεῦμα e a construção ampla com ἀσθενείας, sem definir além do texto a natureza exata da atuação espiritual.
- source_word: ἔτη δεκαοκτώ
  choice: havia dezoito anos
  rationale: Expressa naturalmente em português a duração continuada da condição.
- source_word: συγκύπτουσα
  choice: vivia encurvada
  rationale: Comunica uma condição física persistente, coerente com o particípio e com os dezoito anos mencionados.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: não conseguia se endireitar
  rationale: Reproduz tanto a incapacidade quanto o movimento de voltar à postura ereta, em linguagem corrente.
- source_word: εἰς τὸ παντελές
  choice: completamente
  rationale: 'Preserva a intensificação: ela não conseguia endireitar-se por completo.'
theological_decisions:
- issue: Se πνεῦμα ἀσθενείας deve ser traduzido de modo a minimizar ou eliminar a possível agência espiritual
  choice: Manter “um espírito de enfermidade” no texto principal
  alternative: “uma enfermidade causada por um espírito” ou apenas “uma enfermidade”
  rationale: O grego menciona explicitamente um espírito, mas não especifica neste versículo uma categoria demonológica. A formulação mantém essa tensão sem reduzir a condição a uma descrição meramente médica nem afirmar mais do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” conserva a vivacidade narrativa; “enfermidade” evita a possível leitura de fraqueza moral e mantém a amplitude do termo grego.
