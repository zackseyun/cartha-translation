    issue: Adição de “ali”
    rationale: O texto grego introduz simplesmente “uma mulher” após “e eis”; não especifica “ali”. A omissão evita uma pequena expansão não necessária.
  - severity: low
    issue: “Vivia encurvada” é mais interpretativo que a descrição grega
    rationale: ἦν συγκύπτουσα descreve que ela estava/era curvada naquele estado. “Estava encurvada” reproduz isso de modo mais estrito, sem acrescentar uma nuance habitual.
  revised_text: E eis que havia uma mulher que, havia dezoito anos, tinha um espírito de enfermidade[a]. Ela estava encurvada e não conseguia se endireitar completamente.
