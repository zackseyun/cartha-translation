id: LUK.13.19
reference: Luke 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: pt
  text: É como um grão de mostarda que um homem pegou e lançou em seu jardim; ele cresceu, tornou-se uma árvore[a], e as aves do céu[b] fizeram ninho em seus ramos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “tornou-se uma árvore”, preservando a imagem ampliada do crescimento na parábola.
    reason: lexical_alternative
  - marker: b
    text: Ou “as aves dos céus”; tradicionalmente, “as aves do ar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: É como
  rationale: Reproduz de modo natural e direto a fórmula de comparação usada na parábola.
- source_word: κόκκῳ σινάπεως
  choice: um grão de mostarda
  rationale: “Grão de mostarda” é expressão corrente em português e comunica adequadamente a pequena semente.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: que um homem pegou
  rationale: Mantém a personagem masculina singular do grego e emprega linguagem moderna e natural.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: lançou em seu jardim
  rationale: “Lançou” preserva a vivacidade de βάλλω sem substituir o verbo por “semeou”; “jardim” corresponde a κῆπος.
- source_word: ηὔξησεν
  choice: ele cresceu
  rationale: Expressa de maneira simples o crescimento da semente ou planta; o pronome retoma naturalmente o grão em português.
- source_word: ἐγένετο εἰς δένδρον
  choice: tornou-se uma árvore
  rationale: Conserva explicitamente a imagem ampliada e surpreendente do texto grego.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: É uma tradução próxima do grego, idiomática e de registro digno; neste contexto, “céu” tem sentido espacial.
- source_word: κατεσκήνωσεν
  choice: fizeram ninho
  rationale: No contexto de aves entre ramos, comunica naturalmente a ideia de se instalar ou se alojar, presente no verbo.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: em seus ramos
  rationale: “Ramos” traduz κλάδοις com clareza e mantém a referência à árvore.
theological_decisions:
- issue: Representação de ἄνθρωπος quanto ao gênero
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: A personagem individual da parábola é apresentada no masculino singular; a tradução não neutraliza esse dado do texto.
- issue: Imagem de δένδρον na parábola
  choice: árvore
  alternative: arbusto; planta grande
  rationale: O texto grego diz explicitamente “árvore”. A tradução preserva a hipérbole ou estilização da imagem, sem a ajustar por considerações botânicas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A pontuação mantém a progressão rápida da narrativa, e os termos “lançou”, “árvore” e “aves do céu” preservam as imagens concretas do grego.
