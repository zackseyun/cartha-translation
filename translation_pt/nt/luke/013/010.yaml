  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: pt
  text: Ele estava ensinando em uma das sinagogas no sábado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos sábados”; o grego usa uma forma plural que muitas vezes funciona idiomaticamente com o sentido singular de “sábado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Ele estava ensinando
  rationale: A construção perifrástica com o imperfeito de εἰμί e o particípio presente διδάσκων expressa uma ação em andamento no passado. Em português, “estava ensinando” comunica isso de modo natural. O pronome “Ele” mantém explícito o sujeito retomado pelo contexto, enquanto δέ não exige aqui uma conjunção adversativa forte.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: em uma das sinagogas
  rationale: A expressão partitiva significa literalmente “em uma das sinagogas”. Mantém-se “sinagogas” por designar a instituição e o local judaico específico.
- source_word: ἐν τοῖς σάββασιν
  choice: no sábado
  rationale: Embora σάββασιν tenha forma plural, no grego koiné essa forma pode funcionar idiomaticamente com sentido singular, referindo-se ao dia de sábado. “No sábado” é a formulação portuguesa natural; a leitura formalmente plural é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha naturalmente o grego sem tornar a redação rígida; preserva-se em nota a ambiguidade entre uma ocasião específica e uma atividade habitual.
