id: LUK.13.29
reference: Luke 13:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: pt
  text: E virão do leste e do oeste, do norte e do sul, e se reclinarão à mesa[a] no Reino de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomarão seus lugares à mesa”; o verbo grego se refere mais especificamente ao costume de reclinar-se para uma refeição de banquete.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: virão
  rationale: O futuro de ἥκω exprime aqui movimento e chegada; “virão” é natural em português e combina com as expressões de procedência que seguem.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: do leste e do oeste
  rationale: Os plurais, literalmente ligados ao nascer e ao pôr do sol, funcionam como designações dos pontos cardeais. “Leste e oeste” comunica o sentido de modo claro e atual.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: do norte e do sul
  rationale: As expressões completam a abrangência geográfica das quatro direções, sem especificar povos ou etnias que o versículo não nomeia.
- source_word: ἀνακλιθήσονται
  choice: se reclinarão à mesa
  rationale: Em contexto de banquete, ἀνακλίνω descreve a postura de reclinar-se para comer. A tradução conserva a imagem cultural e a referência à participação no banquete.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no Reino de Deus
  rationale: Formulação portuguesa transparente e consagrada que preserva, sem paráfrase, o peso teológico e escatológico da expressão.
theological_decisions:
- issue: Imagem do banquete no Reino escatológico
  choice: Manter a imagem da refeição com “se reclinarão à mesa”.
  alternative: “se sentarão” ou uma formulação abstrata como “entrarão”
  rationale: O verbo evoca concretamente um banquete e a participação nele. A tradução preserva essa imagem sem acrescentar pormenores doutrinários.
- issue: Abrangência geográfica universal
  choice: Traduzir diretamente as quatro direções, indicando pessoas vindas de toda parte.
  alternative: Identificar explicitamente essas pessoas como gentios de todas as nações.
  rationale: O texto aponta para uma reunião de ampla extensão geográfica, mas não identifica explicitamente a etnia dos que vêm; a tradução evita resolver além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Leste” foi preferido a “oriente” por ser mais direto como ponto cardeal; “Reino” recebe inicial maiúscula por convenção editorial, sem alterar o sentido do grego.
