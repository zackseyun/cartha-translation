  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: pt
  text: Ou aqueles dezoito sobre os quais caiu a torre em Siloé e os matou — vocês pensam que eles se tornaram mais devedores[a] do que todas as outras pessoas que moram em Jerusalém?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais pecadores”, “mais culpados” ou “piores ofensores”. O grego diz literalmente “mais devedores”, provavelmente em sentido moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduz outro exemplo na continuação do argumento de Jesus e preserva o fluxo retórico.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: aqueles dezoito
  rationale: Reproduz naturalmente a construção demonstrativo + artigo + numeral sem acrescentar um substantivo ausente no grego.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: sobre os quais caiu a torre
  rationale: Mantém a imagem e a estrutura direta do grego, sem substituir 'caiu' pelo mais interpretativo 'desabou'.
- source_word: ἐν τῷ Σιλωὰμ
  choice: de Siloé
  rationale: Em português, 'a torre de Siloé' identifica naturalmente a localização ou associação da torre; Siloé é a forma tradicional e reconhecível do topônimo.
- source_word: ἀπέκτεινεν αὐτούς
  choice: os matou
  rationale: Expressa de modo simples o resultado fatal da queda da torre, sem sugerir execução deliberada.
- source_word: δοκεῖτε ὅτι
  choice: vocês pensam que
  rationale: Preserva a pergunta direta e desafiadora de Jesus em português corrente.
- source_word: αὐτοὶ ὀφειλέται ἐγένοντο
  choice: eles se tornaram mais devedores
  rationale: Conserva tanto o verbo γίνομαι ('tornaram-se') quanto a metáfora de ὀφειλέται ('devedores'), entendida aqui em sentido moral; 'mais' torna explícita em português a comparação regida por παρά.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: do que todas as outras pessoas
  rationale: Expressa idiomaticamente o valor comparativo de παρά e entende ἀνθρώπους de modo genérico, abrangendo os habitantes de Jerusalém.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: que moram em Jerusalém
  rationale: Verte o particípio presente em linguagem natural, mantendo a ideia de residência habitual.
theological_decisions:
- issue: Sentido moral de ὀφειλέται
  choice: mais devedores
  alternative: mais pecadores; mais culpados; piores ofensores
  rationale: O termo grego significa literalmente 'devedores' e, no contexto, sugere dívida ou responsabilidade moral. A opção preserva a metáfora distinta empregada neste versículo, sem igualá-la silenciosamente a 'pecadores' no versículo anterior.
- issue: Alcance de ἀνθρώπους
  choice: pessoas
  alternative: homens
  rationale: Aqui o termo designa genericamente os habitantes de Jerusalém; 'pessoas' comunica esse alcance sem afirmar que o grupo era exclusivamente masculino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'mais devedores do que' é deliberadamente incomum para preservar a metáfora e a tensão lexical do original; a nota esclarece as alternativas contextuais.
