base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: pt
  text: 'Então ele disse ao viticultor: “Veja, há três anos venho procurando fruto nesta figueira e não encontro fruto algum. Corte-a. Por que também torna o solo improdutivo?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que ela também ocupa inutilmente o solo?” O verbo grego pode indicar que a figueira torna o solo inútil ou improdutivo; no contexto, também pode referir-se ao uso infrutífero do terreno.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: viticultor
  rationale: Designa a pessoa que cultiva e cuida de uma vinha; “viticultor” preserva com precisão o cenário da parábola.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Chama enfaticamente a atenção do interlocutor em linguagem portuguesa atual, sem o tom arcaico de “Eis”.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: há três anos
  rationale: Expressa uma duração iniciada no passado e prolongada até o momento da fala.
- source_word: ἔρχομαι ζητῶν
  choice: venho procurando
  rationale: A construção comunica ação repetida ou continuada durante os três anos; a perífrase portuguesa preserva esse valor aspectual.
- source_word: καρπὸν
  choice: fruto
  rationale: Mantém o sentido agrícola literal da parábola sem antecipar sua interpretação teológica.
- source_word: συκῇ
  choice: figueira
  rationale: É o equivalente português comum e exato.
- source_word: οὐχ εὑρίσκω
  choice: não encontro nenhum
  rationale: Preserva o presente grego e, no contexto de “venho procurando”, resume o resultado continuamente negativo das buscas.
- source_word: ἔκκοψον αὐτήν
  choice: Corte-a
  rationale: Transmite a ordem direta de derrubar ou remover a árvore; no contexto, “cortar” é claro e idiomático.
- source_word: ἱνατί
  choice: Por que
  rationale: Reproduz de modo direto a pergunta retórica acerca da razão ou finalidade.
- source_word: καὶ
  choice: ainda
  rationale: Neste contexto, reforça que, além de não produzir fruto, a árvore continua prejudicando ou ocupando o solo; “ainda” soa natural com a ideia durativa.
- source_word: γῆν
  choice: o solo
  rationale: No contexto agrícola, refere-se à terra cultivável ao redor da árvore.
- source_word: καταργεῖ
  choice: há de ocupar inutilmente
  rationale: Comunica em português natural que a árvore consome espaço e recursos sem produzir, preservando em nota a possibilidade lexical mais forte de tornar o solo improdutivo.
theological_decisions:
- issue: Imagem parabólica versus interpretação explícita
  choice: Manter literalmente a linguagem agrícola
  alternative: Explicitar na tradução a improdutividade espiritual
  rationale: O versículo pertence a uma parábola; a tradução deve conservar sua imagem e permitir que a interpretação surja do contexto, sem inserir uma aplicação doutrinária no texto.
- issue: Força de καταργεῖ sobre o solo
  choice: Traduzir no texto como ocupação inútil, registrando em nota o sentido causativo mais forte
  alternative: Traduzir diretamente como “tornar o solo improdutivo”
  rationale: O verbo admite a ideia de inutilizar ou tornar improdutivo, mas no cenário também pode ser entendido como uso inútil do terreno. A nota preserva essa tensão lexical sem sobrecarregar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Viticultor” mantém a precisão do cenário; “venho procurando” comunica naturalmente a ação repetida. A pergunta final permanece agrícola e retórica, sem explicação teológica inserida.
