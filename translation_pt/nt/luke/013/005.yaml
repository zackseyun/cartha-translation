  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: pt
  text: Não, eu lhes digo; mas, se não se arrependerem, todos vocês perecerão igualmente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perecerão da mesma maneira”. O termo grego traduzido como “igualmente” pode indicar um juízo comparável à luz dos exemplos anteriores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Não
  rationale: Resposta negativa enfática à pergunta implícita do contexto anterior; “Não” é direto e natural em português.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Expressão idiomática e digna que preserva a fórmula lucana e o objeto plural.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: mas, se não
  rationale: Reproduz de modo natural tanto o contraste de ἀλλά quanto a condição negativa de ἐὰν μή; “a menos que” também seria possível.
- source_word: μετανοῆτε
  choice: se arrependerem
  rationale: “Arrepender-se” é o termo bíblico corrente em português e preserva a amplitude da mudança interior e da volta para Deus, sem reduzi-la a remorso ou mera mudança intelectual.
- source_word: πάντες
  choice: todos vocês
  rationale: Torna explícito o alcance universal da advertência dirigida aos ouvintes e evita que “todos” pareça modificar o modo de perecer.
- source_word: ὡσαύτως
  choice: igualmente
  rationale: Mantém aberta a dimensão exata da comparação — modo, correspondência ou certeza do juízo — sem especificá-la além do grego.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Expressa a gravidade de ruína ou destruição presente em ἀπόλλυμι sem limitar a advertência à morte física.
theological_decisions:
- issue: Sentido do arrependimento na advertência de Jesus
  choice: Traduzir μετανοῆτε por “se arrependerem”.
  alternative: mudarem de ideia; voltarem para Deus
  rationale: A formulação conserva o peso bíblico-teológico do termo sem o reduzir a remorso emocional, alteração intelectual ou uma definição doutrinária posterior.
- issue: Força de ὡσαύτως ἀπολεῖσθε
  choice: “perecerão igualmente”
  alternative: perecerão da mesma maneira
  rationale: “Igualmente” preserva a comparação com os exemplos anteriores, mas não decide se ela diz respeito ao modo, à certeza, à correspondência ou à súbita chegada do juízo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “todos vocês perecerão igualmente” preserva o alcance de πάντες sobre os destinatários e mantém ὡσαύτως junto ao verbo, sem resolver indevidamente a comparação.
