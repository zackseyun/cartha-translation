  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: pt
  text: 'Mas o dirigente da sinagoga, indignado porque Jesus havia curado no sábado, tomou a palavra e disse à multidão: “Há seis dias em que se deve trabalhar. Portanto, venham nesses dias para serem curados, e não no sábado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mas ... tomou a palavra
  rationale: δέ marca o contraste com a cura precedente, enquanto ἀποκριθείς funciona aqui como fórmula de reação discursiva. “Tomou a palavra” é natural em português quando não há uma pergunta explícita e evita o possível estranhamento de “respondeu”.
- source_word: ἀρχισυνάγωγος
  choice: dirigente da sinagoga
  rationale: Designa o responsável pela direção e pelos assuntos da sinagoga. “Dirigente” é atual e não sugere autoridade civil.
- source_word: ἀγανακτῶν
  choice: indignado
  rationale: Expressa forte desagrado com sentido de reprovação; “indignado” preserva esse tom melhor do que o mais genérico “irritado”.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: porque Jesus havia curado no sábado
  rationale: ὅτι é causal, e o mais-que-perfeito composto deixa clara a anterioridade da cura em relação à fala do dirigente.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: disse à multidão
  rationale: O imperfeito apresenta a fala em curso, mas o português narrativo expressa naturalmente este ato discursivo delimitado com “disse”, sem exigir ideia de repetição.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Há seis dias em que se deve trabalhar
  rationale: Mantém a estrutura e a força normativa de δεῖ, ao mesmo tempo que emprega uma formulação idiomática e clara em português.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Portanto, venham nesses dias para ser curados
  rationale: “Portanto” conserva a inferência de οὖν; “venham nesses dias” representa o particípio de movimento, e a forma passiva “ser curados” preserva θεραπεύεσθε.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: e não no dia de sábado
  rationale: Reproduz a oposição explícita entre os seis dias e o sábado, preservando a expressão enfática “dia de sábado”.
theological_decisions:
- issue: A alegação do dirigente sobre os dias apropriados para trabalho e cura
  choice: 'Apresentar diretamente sua regra: “Há seis dias em que se deve trabalhar. Portanto, venham nesses dias para ser curados”.'
  alternative: Parafrasear a fala de modo a qualificá-la explicitamente como hipócrita ou equivocada.
  rationale: O versículo relata a objeção do dirigente sem endossá-la nem avaliá-la dentro da própria fala. A tradução mantém essa tensão e deixa a resposta e a avaliação de Jesus para o contexto seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dirigente da sinagoga” evita o tom civil de “governante”; “tomou a palavra” comunica uma reação discursiva natural sem pressupor pergunta anterior. Não foram necessárias notas de rodapé.
