source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: pt
  text: E esta mulher, que é filha de Abraão e a quem Satanás prendeu há dezoito anos — eis —, não devia ser solta deste vínculo no dia de sábado?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: filha de Abraão
  rationale: Mantém a expressão de identidade pactual e pertencimento ao povo de Abraão, sem reduzi-la apenas a uma indicação genealógica.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: manteve presa / ser libertada / prisão
  rationale: Preserva em português a imagem coesa de atar e desatar, usando linguagem natural para a condição prolongada da mulher.
- source_word: ἰδού
  choice: vejam!
  rationale: Representa a interjeição enfática que chama a atenção dos ouvintes para os dezoito anos, evitando omiti-la.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: no dia de sábado
  rationale: Tradução direta e corrente da referência temporal, mantendo explícito o dia em torno do qual gira a controvérsia.
theological_decisions:
- issue: Atribuição da aflição a Satanás
  choice: a quem Satanás manteve presa
  alternative: que Satanás havia prendido
  rationale: Mantém sem atenuação a atribuição explícita do texto, ao mesmo tempo que o aspecto duradouro é expresso naturalmente em português.
- issue: Força da pergunta com οὐκ ἔδει
  choice: não devia ser libertada
  alternative: não era necessário que fosse libertada
  rationale: Conserva a expectativa de resposta afirmativa e o sentido de obrigação ou conveniência moral, sem decidir de modo excessivamente técnico entre dever e necessidade.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. A interjeição «vejam!» preserva a ênfase de ἰδού; os travessões marcam sua função parentética sem obscurecer a pergunta principal.
