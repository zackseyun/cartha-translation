  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: pt
  text: 'E dizia esta parábola: “Um homem[a] tinha uma figueira plantada em sua vinha. Ele foi procurar fruto nela, mas não encontrou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Alguém tinha uma figueira plantada em sua vinha”. O pronome indefinido grego pode ser traduzido de modo mais genérico, mas “um homem” combina melhor com o estilo narrativo da parábola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: contou
  rationale: O imperfeito introduz a fala narrativa; em português, o pretérito perfeito é a forma mais natural para apresentar a parábola, sem alterar seu sentido.
- source_word: δὲ
  choice: Então
  rationale: δέ é um conectivo leve; “Então” mantém a continuidade discursiva de modo natural, sem lhe atribuir uma sequência temporal rígida.
- source_word: παραβολήν
  choice: parábola
  rationale: Termo consagrado e contextualmente preciso para a narrativa figurada de Jesus.
- source_word: Συκῆν
  choice: figueira
  rationale: O substantivo designa especificamente a árvore que produz figos.
- source_word: εἶχέν τις
  choice: Um homem tinha
  rationale: τις é indefinido. “Um homem” soa natural no estilo narrativo das parábolas, embora “alguém” também seja possível.
- source_word: πεφυτευμένην
  choice: plantada
  rationale: O particípio perfeito passivo descreve a figueira em seu estado estabelecido de ter sido plantada; “plantada” expressa isso com naturalidade.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: em sua vinha
  rationale: ἀμπελών designa uma vinha ou vinhedo; “vinha” é corrente, conciso e preserva o possessivo.
- source_word: ἦλθεν ζητῶν
  choice: foi procurar
  rationale: A combinação do aoristo com o particípio presente indica movimento acompanhado de busca ou propósito; “foi procurar” é idiomático em português.
- source_word: καρπὸν
  choice: fruto
  rationale: Equivalente direto que preserva tanto o sentido agrícola quanto a possível ressonância metafórica da parábola.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: Embora ἐν seja literalmente “em”, “fruto nela” é uma construção natural em português para o fruto produzido pela árvore.
- source_word: οὐχ εὗρεν
  choice: não encontrou
  rationale: A negação retoma naturalmente “fruto”; não é necessário repeti-lo em português.
theological_decisions:
- issue: Sujeito indefinido τις na parábola
  choice: Um homem
  alternative: Alguém
  rationale: O texto apresenta uma personagem humana sem especificação teológica. “Um homem” mantém o estilo narrativo tradicional e não acrescenta conteúdo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita literalismo rígido em Ἔλεγεν e ἦλθεν ζητῶν, mas conserva a imagem agrícola e a indefinição da personagem por meio de nota.
