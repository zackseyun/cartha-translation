  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: pt
  text: 'E ele lhes disse: “Vão e digam àquela raposa: ‘Eis que expulso demônios e realizo curas hoje e amanhã, e, no terceiro dia, sou levado a termo[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chego ao meu objetivo”, “sou aperfeiçoado” ou “concluo minha missão”. O grego pode indicar ser levado ao pleno cumprimento, provavelmente em referência à conclusão da missão designada a Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: raposa
  rationale: Mantém a imagem animal literal e o tom depreciativo, sem explicitar como astúcia ou insignificância uma força metafórica que o grego deixa implícita.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Marcador corrente e digno que chama atenção para a declaração seguinte, preservando sua força de apresentação.
- source_word: ἐκβάλλω δαιμόνια
  choice: expulso demônios
  rationale: Expressão natural e consolidada em português para o ato de exorcizar, preservando a força de ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: realizo curas
  rationale: Traduz ἰάσεις como 'curas' e ἀποτελῶ como o ato de efetuá-las ou levá-las a cabo, em formulação natural em português.
- source_word: σήμερον καὶ αὔριον
  choice: hoje e amanhã
  rationale: Preserva tanto o valor temporal literal quanto a possível referência idiomática a um período breve e determinado.
- source_word: τῇ τρίτῃ
  choice: no terceiro dia
  rationale: Explicita naturalmente em português o substantivo temporal implícito no ordinal grego.
- source_word: τελειοῦμαι
  choice: sou levado à consumação
  rationale: Preserva a voz passiva e a noção de chegar ao cumprimento ou término, sem reduzir a expressão a aperfeiçoamento moral nem especificar diretamente morte, ressurreição ou glorificação.
theological_decisions:
- issue: Sentido de τελειοῦμαι em relação à missão de Jesus e possível alusão à morte e ressurreição
  choice: sou levado à consumação
  alternative: chego ao meu objetivo; sou aperfeiçoado; concluo minha missão
  rationale: A forma grega pode indicar que Jesus é levado ao cumprimento ou término de sua missão. A tradução mantém a voz passiva e a abertura teológica, sem identificar de modo exclusivo o terceiro dia com um único acontecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O imperativo plural foi vertido por “Vão e digam”; “àquela raposa” conserva o demonstrativo e o tom contundente. “Consumação” é deliberadamente formal para preservar a amplitude e a tensão de τελειοῦμαι, esclarecida em nota.
