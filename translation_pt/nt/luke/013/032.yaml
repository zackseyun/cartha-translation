  to: 'E ele lhes disse: “Vão e digam àquela raposa: ‘Eis que expulso demônios e realizo curas hoje e amanhã, e, no terceiro dia, sou levado a termo[a].’”'
  rationale: A revisão substitui apenas a expressão final por uma locução portuguesa mais natural. “Sou levado a termo” conserva a voz passiva e a amplitude de τελειοῦμαι, sem impor uma leitura de aperfeiçoamento moral, morte, ressurreição ou consumação escatológica.
