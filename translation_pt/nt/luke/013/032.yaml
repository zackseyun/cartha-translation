    issue: “Sou levado à consumação” é pouco idiomático e semanticamente marcado.
    rationale: Em português contemporâneo, “consumação” tende a evocar culminação final ou, em certos registros, consumação escatológica; além disso, a construção “levado à consumação” soa pouco natural. “Sou levado a termo” transmite de modo mais idiomático a conclusão passiva expressa por τελειοῦμαι, sem estreitar seu referente.
