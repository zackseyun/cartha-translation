  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: pt
  text: Jerusalém, Jerusalém, você que mata os profetas e apedreja os que lhe foram enviados — quantas vezes quis reunir os seus filhos, como uma galinha reúne sua ninhada sob as asas, e vocês[a] não quiseram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego passa do singular ao plural: Jerusalém é tratada como uma pessoa («você», «seus»), mas o verbo final está no plural («vocês não quiseram»), dirigindo a recusa aos seus habitantes ou representantes.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalém, Jerusalém
  rationale: Mantém o nome tradicional em português e a repetição enfática e pesarosa do chamado.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: você que mata ... e apedreja
  rationale: Os particípios presentes caracterizam Jerusalém por sua conduta recorrente; a oração relativa é mais natural em português do que uma reprodução nominal rígida.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: os que lhe são enviados
  rationale: Preserva a voz passiva e o direcionamento a Jerusalém, com formulação clara e corrente.
- source_word: ποσάκις ἠθέλησα
  choice: Quantas vezes quis
  rationale: Expressa com naturalidade tanto a frequência quanto o desejo ou vontade pessoal indicado pelo grego.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: reunir os seus filhos
  rationale: Conserva a imagem da cidade personificada como mãe, sem restringir interpretativamente quem são os filhos.
- source_word: ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας
  choice: como uma galinha reúne a sua ninhada debaixo das asas
  rationale: Embora ὄρνις possa designar uma ave em geral, a ação maternal de acolher a ninhada sob as asas torna 'galinha' a opção contextual mais natural; 'ninhada' mantém o sentido coletivo de νοσσιά.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: mas vocês não quiseram
  rationale: O plural do verbo é explicitado por 'vocês', distinguindo os destinatários humanos da Jerusalém singular personificada e preservando o contraste volitivo.
theological_decisions:
- issue: Referente de 'os seus filhos'
  choice: Mantida a expressão metafórica 'os seus filhos'.
  alternative: os habitantes de Jerusalém; o povo representado pela cidade
  rationale: O texto personifica Jerusalém como cidade-mãe, mas não delimita expressamente o referente; a tradução evita resolver essa ambiguidade.
- issue: Contraste entre ἠθέλησα e οὐκ ἠθελήσατε
  choice: quis ... vocês não quiseram
  alternative: desejei ... vocês não estiveram dispostos
  rationale: Mantém a linguagem explícita de vontade e recusa sem acrescentar conclusões sobre debates teológicos mais amplos.
- issue: Mudança do singular personificado para o plural humano
  choice: você que mata ... seus filhos ... vocês não quiseram
  alternative: tu que matas ... teus filhos ... não quiseste
  rationale: O grego passa do vocativo singular e dos possessivos singulares ao verbo plural final. A tradução torna visível essa mudança gramatical e retórica, sem harmonizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você/vocês' para tornar clara a significativa mudança grega do singular para o plural. A exclamação após 'enviados' comunica o tom de lamento e substitui com naturalidade a pausa marcada pelo travessão no texto-fonte.
