id: LUK.13.31
reference: Luke 13:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: pt
  text: 'Naquela mesma hora, alguns fariseus se aproximaram e lhe disseram: “Saia daqui e vá embora, porque Herodes quer matar você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Naquela mesma hora
  rationale: Preserva a referência temporal específica e a ênfase de αὐτῇ em português natural; “naquela exata hora” seria menos idiomático.
- source_word: προσῆλθάν
  choice: se aproximaram
  rationale: Expressa claramente o movimento em direção a Jesus e corresponde ao sentido comum de προσέρχομαι.
- source_word: τινες Φαρισαῖοι
  choice: alguns fariseus
  rationale: Mantém a indefinição de τινες sem sugerir que o grupo inteiro participou.
- source_word: λέγοντες αὐτῷ
  choice: e lhe disseram
  rationale: Converte o particípio simultâneo em verbo finito para produzir uma narração natural em português.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Saia daqui e vá embora
  rationale: Mantém os dois imperativos e o movimento para longe do lugar, sem a formalidade de “parta” nem a aspereza coloquial de “dê o fora”.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de maneira direta e corrente a razão apresentada para a advertência.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: θέλει σε ἀποκτεῖναι
  choice: quer matar você
  rationale: Traduz de modo direto o desejo expresso por θέλει e o sentido amplo de matar em ἀποκτεῖναι, sem acrescentar a ideia mais específica de execução formal.
theological_decisions:
- issue: Motivação dos fariseus ao advertirem Jesus
  choice: Relatar a advertência sem indicar se era sincera ou manipuladora
  alternative: Explicitar que os fariseus queriam proteger Jesus ou, ao contrário, intimidá-lo para que partisse
  rationale: O grego registra a aproximação e as palavras deles, mas não declara sua motivação; a tradução preserva essa abertura narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Você” torna explícito o objeto singular σε de maneira natural. Não foram incluídas notas porque as alternativas lexicais não alteram substancialmente o sentido nem preservam uma ambiguidade necessária.
