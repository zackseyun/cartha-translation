  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: pt
  text: 'Então ele dizia: “Com que se parece o Reino de Deus[a], e a que o compararei?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reinado de Deus”, destacando o governo de Deus, e não um território.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ele dizia
  rationale: O imperfeito grego sugere ação discursiva em andamento ou repetida; “dizia” preserva esse aspecto de modo natural em português.
- source_word: οὖν
  choice: Então
  rationale: Mantém a conexão com o contexto anterior e pode expressar continuação ou consequência sem a formalidade mais forte de “portanto”.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: Com que se parece
  rationale: Reproduz de maneira idiomática a pergunta comparativa do grego, sem tornar a formulação excessivamente literal.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: É a expressão bíblica consagrada e preserva tanto a imagem de reino quanto a possibilidade de referência ao governo ativo de Deus.
- source_word: καὶ
  choice: e
  rationale: Conserva a coordenação simples entre as duas perguntas paralelas.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: a que o compararei
  rationale: O futuro “compararei” preserva a forma deliberativa e retórica do futuro indicativo grego; o pronome masculino retoma naturalmente “Reino” em português.
theological_decisions:
- issue: Sentido de βασιλεία τοῦ θεοῦ
  choice: Reino de Deus
  alternative: reinado de Deus
  rationale: “Reino de Deus” mantém a formulação bíblica tradicional e o campo metafórico das parábolas, sem excluir o sentido dinâmico do governo ou domínio exercido por Deus.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo das duas perguntas foram preservados, evitando tanto arcaísmo quanto paráfrase excessiva.
