  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: pt
  text: Não, eu lhes digo; mas, se não se arrependerem, todos vocês igualmente perecerão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da mesma maneira». «Igualmente» pode indicar um juízo súbito semelhante, não necessariamente uma forma idêntica de morrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Não
  rationale: Responde com firmeza à suposição implícita no contexto anterior, sem acrescentar ênfase indevida.
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: Expressão discursiva direta e enfática, natural em português moderno.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca de modo claro o contraste entre a negação e a advertência seguinte.
- source_word: ἐὰν μὴ
  choice: se não
  rationale: Expressa naturalmente a condição negativa; nesta construção, é tão claro quanto «a menos que» e combina bem com o subjuntivo.
- source_word: μετανοῆτε
  choice: se arrependerem
  rationale: Preserva o sentido moral e espiritual de mudar de atitude e voltar-se para Deus, evitando reduzi-lo a mera reconsideração intelectual.
- source_word: πάντες
  choice: todos vocês
  rationale: Torna explícito e natural em português que a advertência abrange todos os ouvintes.
- source_word: ὁμοίως
  choice: igualmente
  rationale: Mantém a comparação com os acontecimentos anteriores sem exigir que a maneira da morte seja idêntica.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Preserva a gravidade e a amplitude de ἀπόλλυμι sem restringir a advertência à morte física nem explicitar condenação eterna.
theological_decisions:
- issue: Alcance de «perecerão» na advertência de Jesus
  choice: Traduzir ἀπολεῖσθε por «perecerão», sem especificar a natureza ou a extensão da perdição.
  alternative: «morrerão», «serão destruídos» ou «serão condenados eternamente»
  rationale: O texto adverte sobre juízo diante da falta de arrependimento, mas não define aqui se a referência é exclusivamente à morte física, à ruína histórica ou ao juízo final.
- issue: Sentido de μετανοέω
  choice: «se arrependerem»
  alternative: «mudarem de pensamento» ou «mudarem de atitude»
  rationale: No contexto, o verbo exige mais que uma mudança intelectual; «arrepender-se» comunica de modo corrente sua dimensão moral e espiritual sem desenvolver uma doutrina além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Eu lhes digo» preserva a solenidade sem soar arcaico; «todos vocês» esclarece o alcance de πάντες.
