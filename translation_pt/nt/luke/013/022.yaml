  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: pt
  text: Ele percorria cidades e povoados, ensinando e seguindo viagem rumo a Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Jerusalém”.'
    reason: Alternativa lexical para εἰς, que pode indicar tanto direção quanto destino.
lexical_decisions:
- source_word: διεπορεύετο
  choice: percorria
  rationale: O imperfeito apresenta uma ação contínua, e o verbo composto comunica movimento por diversos lugares. “Percorria” expressa naturalmente ambos os aspectos em português.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: cidades e povoados
  rationale: κατά com acusativo tem aqui sentido distributivo, indicando passagem por diversas localidades. “Cidades e povoados” mantém a distinção entre núcleos maiores e menores em linguagem atual.
- source_word: διδάσκων
  choice: ensinando
  rationale: O particípio presente descreve a atividade que acompanhava o percurso, preservada de forma concisa pelo gerúndio.
- source_word: πορείαν ποιούμενος
  choice: seguindo viagem
  rationale: A expressão idiomática indica o prosseguimento de uma jornada. “Seguindo viagem” é natural em português e evita uma tradução excessivamente literal.
- source_word: εἰς Ἱεροσόλυμα
  choice: rumo a Jerusalém
  rationale: Neste resumo de viagem, εἰς aponta para o destino em direção ao qual ele avançava, sem afirmar que já estivesse chegando. “Rumo a” preserva esse movimento orientado.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
theological_decisions:
- issue: Direção narrativa da viagem a Jerusalém
  choice: rumo a Jerusalém
  alternative: para Jerusalém
  rationale: A formulação destaca o avanço contínuo em direção ao destino dentro da narrativa de viagem, sem transformar o versículo em anúncio de chegada nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “Ele” preserva o sujeito expresso apenas pelo contexto no grego; “povoados” distingue κώμας de cidades sem recorrer a vocabulário regional.
