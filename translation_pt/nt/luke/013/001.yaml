reference: Luke 13:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: pt
  text: Naquela mesma ocasião, algumas pessoas estavam presentes, relatando-lhe a respeito dos galileus cujo sangue Pilatos havia misturado com os sacrifícios deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia mesclado com os sacrifícios deles”.'
    reason: Alternativa lexical para ἔμιξεν; “mesclado” preserva o mesmo sentido básico, embora “misturado” seja mais comum no português atual.
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: algumas pessoas que estavam presentes
  rationale: Expressa o sentido durativo do imperfeito de πάρειμι como presença, não como chegada. A construção foi reorganizada para soar natural em português; δέ funciona como transição leve, já suficientemente marcada pelo início temporal da frase.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Naquele mesmo momento
  rationale: Preserva a referência enfática ao tempo específico do contexto anterior, em português atual e claro.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: lhe relataram
  rationale: ἀπαγγέλλω indica transmitir uma notícia ou relato. O pretérito perfeito torna natural em português a relação entre a presença das pessoas e o ato de informar Jesus.
- source_word: περὶ τῶν Γαλιλαίων
  choice: o caso dos galileus
  rationale: περί com o genitivo introduz o assunto do relato. 'O caso dos galileus' comunica de modo idiomático que eles eram o tema da notícia.
- source_word: ὧν τὸ αἷμα
  choice: cujo sangue
  rationale: Mantém de forma concisa e direta a relação expressa pelo pronome relativo grego.
- source_word: Πιλᾶτος
  choice: Pilatos
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἔμιξεν
  choice: havia misturado
  rationale: μίγνυμι significa misturar ou mesclar. O mais-que-perfeito composto deixa claro que o ato de Pilatos antecedeu o relato sem alterar o conteúdo da afirmação.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: com os sacrifícios deles
  rationale: 'Mantém o sentido básico de μετά com o genitivo e preserva a ambiguidade do possessivo: o texto não especifica se eram sacrifícios trazidos por eles ou oferecidos naquele instante.'
theological_decisions:
- issue: Força histórica e moral do ato de Pilatos
  choice: Manter a afirmação direta de que Pilatos misturou o sangue dos galileus com os sacrifícios deles.
  alternative: Explicitar que Pilatos os matou enquanto ofereciam sacrifícios.
  rationale: O grego apresenta o acontecimento de modo chocante, mas não explica suas circunstâncias precisas nem seu significado teológico. A tradução evita acrescentar uma reconstrução histórica não declarada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da primeira oração foi ajustada para evitar uma construção excessivamente literal, mantendo a presença das pessoas, a simultaneidade temporal e o caráter de relato.
