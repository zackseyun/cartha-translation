id: LUK.13.25
reference: Luke 13:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: pt
  text: 'Depois que o dono da casa se levantar e fechar a porta, vocês começarão a ficar do lado de fora e a bater à porta, dizendo: “Senhor[a], abra para nós!” Mas ele responderá: “Não conheço vocês; não sei de onde são.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Senhor” também pode ser entendido como um tratamento respeitoso dirigido ao dono da casa.
    reason: alternative_reading
  - marker: b
    text: 'Mais literalmente: “Não conheço vocês, de onde são”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Depois que
  rationale: Introduz uma oração temporal indefinida. “Depois que” é natural em português e preserva a sequência temporal do grego.
- source_word: ἐγερθῇ
  choice: se levantar
  rationale: No contexto, indica levantar-se de uma posição sentada ou reclinada, não ressuscitar.
- source_word: ὁ οἰκοδεσπότης
  choice: o dono da casa
  rationale: Expressa de modo atual e claro quem tem autoridade sobre a casa; “chefe de família” poderia deslocar o sentido para relações familiares.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: fechar a porta
  rationale: Traduz diretamente o ato decisivo de fechar, cujo contexto já comunica a exclusão dos que ficaram fora.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: vocês começarão a ficar do lado de fora
  rationale: O futuro é adequado à sequência discursiva em português, e “ficar do lado de fora” preserva o estado expresso pelo infinitivo perfeito ἑστάναι.
- source_word: κρούειν τὴν θύραν
  choice: bater à porta
  rationale: É uma formulação portuguesa corrente para pedir entrada, sem intensificar indevidamente a ação.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva a tradução tradicional e a possível ressonância teológica em Lucas, embora no cenário da parábola também possa funcionar como tratamento respeitoso dirigido ao dono da casa.
- source_word: ἄνοιξον ἡμῖν
  choice: abra para nós
  rationale: Formulação natural que mantém o imperativo e o benefício indicado pelo dativo.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: ele responderá
  rationale: Reproduz naturalmente em português a combinação grega de particípio e verbo de fala.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Não conheço vocês; não sei de onde são
  rationale: Mantém explicitamente ὑμᾶς e πόθεν ἐστέ, evitando a construção pouco natural “não conheço vocês, de onde são”. O ponto e vírgula apresenta a segunda oração como esclarecimento sem apagar a tensão sintática do grego.
theological_decisions:
- issue: Sentido de Κύριε no apelo feito dentro da parábola
  choice: Senhor
  alternative: Patrão; senhor como simples tratamento respeitoso
  rationale: '“Senhor” mantém a amplitude lexical: pode ser o tratamento dado ao dono da casa e, ao mesmo tempo, conservar a ressonância mais ampla de κύριος no Evangelho, sem determinar além do texto a identidade da figura parabólica.'
- issue: Força de Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Não conheço vocês; não sei de onde são
  alternative: Não sei de onde vocês são; Não conheço vocês, nem sei de onde são
  rationale: A tradução conserva tanto o objeto explícito “vocês” quanto a referência à origem, sem acrescentar “nem”, que poderia tornar as duas expressões mais independentes do que o grego exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e evita formas excessivamente literais que soariam truncadas, preservando em nota a construção incomum do grego.
