id: LUK.13.35
reference: Luke 13:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: pt
  text: 'Vejam: a casa de vocês é deixada para vocês.[a][b] E eu lhes digo: vocês certamente não me verão até que chegue o tempo em que digam: “Bendito aquele que vem em nome do Senhor.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é abandonada” ou “é desamparada”. A forma passiva grega pode sugerir que ela é abandonada em sentido judicial.
    reason: lexical_alternative
  - marker: b
    text: “A casa de vocês” provavelmente se refere a Jerusalém, especialmente ao seu templo, mas o grego diz apenas “a casa de vocês”.
    reason: alternative_reading
  - marker: c
    text: A declaração “Bendito aquele que vem em nome do Senhor” retoma o Salmo 118:26. Alguns a relacionam à entrada triunfal de Jesus; outros, a um reconhecimento futuro dele. O grego não exige uma dessas datas específicas.
    reason: cross_reference_and_alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Interjeição que chama solenemente a atenção. “Vejam” conserva essa força em português atual; “Eis” seria possível, mas é mais tradicional.
- source_word: ἀφίεται
  choice: é deixada
  rationale: Mantém a voz passiva e a amplitude do verbo, que no contexto também pode transmitir abandono ou entrega judicial, sem fixar uma única nuance no texto principal.
- source_word: ὁ οἶκος ὑμῶν
  choice: a casa de vocês
  rationale: Reproduz a expressão grega sem restringi-la explicitamente a Jerusalém, ao templo ou a Israel.
- source_word: ὑμῖν
  choice: lhes
  rationale: 'Conserva a relação dativa em formulação portuguesa concisa: a casa é deixada a vocês.'
- source_word: λέγω δὲ ὑμῖν
  choice: E eu lhes digo
  rationale: δέ introduz aqui uma continuação ou transição leve; “E” é natural e evita impor contraste forte.
- source_word: οὐ μὴ ἴδητέ με
  choice: vocês certamente não me verão
  rationale: A combinação οὐ μή com o subjuntivo expressa negação futura enfática; “certamente não” comunica essa força com naturalidade.
- source_word: ἕως ἥξει ὅτε
  choice: até que chegue o tempo em que
  rationale: Expressa claramente em português a construção temporal grega, cuja reprodução palavra por palavra seria pouco natural.
- source_word: εἴπητε
  choice: digam
  rationale: O subjuntivo é idiomático depois de “até que chegue o tempo em que” e conserva a referência futura.
- source_word: Εὐλογημένος
  choice: Bendito
  rationale: Forma consagrada e natural em fórmulas bíblicas de bênção, preservando a ressonância do Salmo 118:26.
- source_word: ὁ ἐρχόμενος
  choice: aquele que vem
  rationale: Representa naturalmente o particípio substantivado sem transformá-lo necessariamente em título técnico.
- source_word: ἐν ὀνόματι κυρίου
  choice: em nome do Senhor
  rationale: Mantém a fórmula bíblica reconhecível e traduz κύριος por “Senhor”.
theological_decisions:
- issue: Referente de “a casa de vocês”
  choice: Mantida a expressão ampla no texto principal
  alternative: “o templo”, “Jerusalém” ou “a casa de Israel”
  rationale: O contexto aponta para Jerusalém e provavelmente para seu templo, mas o grego diz simplesmente “a casa de vocês”; especificar o referente eliminaria uma amplitude genuína.
- issue: Momento do reconhecimento final
  choice: Mantida uma referência futura sem determinar o acontecimento
  alternative: A entrada triunfal ou um reconhecimento futuro/escatológico de Jesus
  rationale: A redação grega não obriga a tradução a escolher entre essas leituras; o texto preserva essa tensão interpretativa.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês/lhes” para o plural. “Vejam” é preferido a “Eis” por legibilidade contemporânea. A ordem dos marcadores foi normalizada para seguir a passagem: [a] após a declaração sobre a casa e [b][c] junto à condição futura e à citação.'
