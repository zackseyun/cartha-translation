  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: pt
  text: 'Mas, ao vê-la, Jesus a chamou e lhe disse: “Mulher, você foi libertada da sua enfermidade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: ao vê-la
  rationale: O particípio aoristo expressa naturalmente a circunstância temporal anterior à fala de Jesus; “ao vê-la” preserva a sequência com fluidez.
- source_word: δὲ
  choice: Mas
  rationale: Marca a progressão narrativa com leve contraste em relação à situação anteriormente descrita, sem tornar a oposição excessiva.
- source_word: προσεφώνησεν
  choice: a chamou
  rationale: O verbo pode significar chamar ou dirigir-se a alguém. No contexto, “a chamou” comunica de modo natural que Jesus tomou a iniciativa de convocá-la ou falar diretamente com ela, sem especificar indevidamente que ela se aproximou.
- source_word: εἶπεν αὐτῇ
  choice: e lhe disse
  rationale: Representa explicitamente o destinatário expresso pelo dativo αὐτῇ e soa natural em português.
- source_word: Γύναι
  choice: Mulher
  rationale: É a forma direta e digna de conservar o vocativo respeitoso, sem acrescentar intimidade ou uma categoria social ausente do grego.
- source_word: ἀπολέλυσαι
  choice: você está livre
  rationale: O perfeito passivo indica uma libertação realizada cujo resultado permanece. “Está livre” expressa com naturalidade em português o estado presente resultante, conservando a ideia passiva no contexto.
- source_word: τῆς ἀσθενείας σου
  choice: da sua enfermidade
  rationale: ἀσθένεια abrange fraqueza, enfermidade ou doença. Neste contexto de aflição física incapacitante, “enfermidade” é amplo, natural e evita um diagnóstico moderno específico.
theological_decisions:
- issue: Natureza da condição da mulher em ἀσθένεια
  choice: enfermidade
  alternative: fraqueza; doença; incapacidade
  rationale: O contexto aponta para uma aflição física, mas o termo grego não fornece um diagnóstico preciso. “Enfermidade” mantém a amplitude sem reduzir a condição a mera fraqueza nem impor uma categoria clínica moderna.
- issue: Valor do perfeito passivo ἀπολέλυσαι
  choice: você está livre
  alternative: você foi libertada; você está liberta
  rationale: A formulação destaca o estado presente resultante de uma ação completada. Não explicita o agente da libertação, assim como a forma passiva grega, e evita resolver além do texto a relação entre declaração e cura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O tratamento “você” é natural no português brasileiro; “Mulher” preserva o vocativo bíblico sem soar afetivo ou cerimonioso demais. Não se acrescentou marcador de nota porque a redação não exige alternativa indispensável para preservar uma ambiguidade relevante.
