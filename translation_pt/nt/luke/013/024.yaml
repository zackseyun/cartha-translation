id: LUK.13.24
reference: Luke 13:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: pt
  text: Esforcem-se para entrar pela porta estreita[a], porque muitos, eu lhes digo, procurarão entrar e não conseguirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelo portão estreito». O termo grego usado por Lucas (θύρα) significa normalmente «porta»; no paralelo de Mateus, o termo é «portão».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Esforcem-se
  rationale: O imperativo presente de ἀγωνίζομαι comunica empenho intenso e perseverante. «Esforcem-se» é natural em português atual e conserva a seriedade da ordem sem explicar a natureza desse esforço.
- source_word: εἰσελθεῖν
  choice: entrar
  rationale: O infinitivo de εἰσέρχομαι é traduzido naturalmente por «entrar» nas duas ocorrências.
- source_word: διὰ τῆς στενῆς θύρας
  choice: pela porta estreita
  rationale: θύρα designa normalmente uma porta, enquanto στενῆς indica que ela é estreita. «Pela» expressa de modo idiomático a passagem através dela.
- source_word: ὅτι
  choice: porque
  rationale: Aqui ὅτι introduz a razão da ordem anterior; «porque» mantém claramente essa relação causal.
- source_word: πολλοί
  choice: muitos
  rationale: O adjetivo substantivado é traduzido diretamente por «muitos».
- source_word: λέγω ὑμῖν
  choice: eu lhes digo
  rationale: A fórmula discursiva é natural e clara em português. A posição intercalada preserva a ênfase do texto grego.
- source_word: ζητήσουσιν
  choice: procurarão
  rationale: «Procurarão» preserva o sentido básico de ζητέω e mantém a distinção lexical em relação ao esforço intenso expresso por ἀγωνίζομαι.
- source_word: οὐκ ἰσχύσουσιν
  choice: não conseguirão
  rationale: Nesse contexto, ἰσχύω indica capacidade efetiva para realizar a ação. «Não conseguirão» é idiomático e comunica a incapacidade de entrar sem recorrer à formulação menos natural «não serão capazes».
theological_decisions:
- issue: Esforço humano e linguagem de salvação
  choice: Manter a ordem enfática «Esforcem-se» sem acrescentar explicações sobre mérito ou obras.
  alternative: «Façam todo o esforço» ou «Tentem entrar».
  rationale: O versículo ordena empenho sério e adverte que muitos procurarão entrar sem conseguir. A tradução preserva essa tensão entre responsabilidade humana e incapacidade, sem resolver debates doutrinários que o próprio versículo não desenvolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Esforcem-se» preserva a força da exortação; «porta» segue precisamente o vocabulário de Lucas, e a alternativa tradicional «portão» fica registrada em nota.
