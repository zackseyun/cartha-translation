  source_fidelity: O texto reproduz adequadamente o contraste de πλὴν, a necessidade expressa por δεῖ, a sequência temporal tríplice, o sentido de deslocamento continuado de πορεύεσθαι e a razão introduzida por ὅτι. “Não é possível que um profeta morra fora de Jerusalém” preserva a formulação de impossibilidade/incongruência de οὐκ ἐνδέχεται sem decidir indevidamente se a declaração é estritamente literal ou irônica. “Morra”, embora mais específico que o campo semântico mais amplo de ἀπολέσθαι, é uma opção contextual legítima neste dito sobre profetas.
  naturalness: A redação é fluente, clara e digna em português moderno de ampla compreensão. “Contudo” introduz naturalmente a ressalva; “preciso seguir meu caminho” comunica bem a continuidade da viagem e mantém a primeira pessoa de modo idiomático.
  terminology: “Profeta” e “Jerusalém” estão corretos e consistentes. A escolha de “um profeta” conserva apropriadamente o valor genérico do singular anartro. As notas apresentam a alternativa “inconcebível” e a possível ironia sem impor uma interpretação doutrinária.
