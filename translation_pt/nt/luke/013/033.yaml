id: LUK.13.33
reference: Luke 13:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: pt
  text: Contudo, preciso seguir meu caminho hoje, amanhã e no dia seguinte[a], porque não é possível que um profeta morra fora de Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “hoje, amanhã e no dia seguinte” pode ser idiomática, referindo-se a um curso breve e determinado, sem indicar necessariamente três dias exatos do calendário.
    reason: cultural_note
  - marker: b
    text: 'Ou: “é inconcebível que um profeta morra fora de Jerusalém”. A expressão também pode transmitir forte ironia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Contudo
  rationale: Marca a forte ressalva ou contraste com a declaração anterior, em linguagem portuguesa natural e digna.
- source_word: δεῖ με
  choice: preciso
  rationale: Expressa a necessidade indicada pelo verbo impessoal δεῖ sem explicitar se ela é divina, circunstancial ou de outra natureza.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: hoje, amanhã e no dia seguinte
  rationale: Mantém a progressão temporal tríplice do grego e permite tanto uma leitura literal quanto idiomática.
- source_word: πορεύεσθαι
  choice: seguir meu caminho
  rationale: Comunica movimento continuado no contexto da jornada, de modo mais pleno que o simples verbo 'ir'.
- source_word: ὅτι
  choice: porque
  rationale: Introduz com clareza contemporânea a razão da necessidade anteriormente afirmada.
- source_word: οὐκ ἐνδέχεται
  choice: não é possível
  rationale: Preserva a formulação de impossibilidade ou incongruência, sem tornar explícita demais a provável ironia.
- source_word: προφήτην
  choice: um profeta
  rationale: O singular sem artigo tem sentido genérico e contribui para o caráter proverbial da afirmação.
- source_word: ἀπολέσθαι
  choice: morra
  rationale: No contexto da morte de profetas, 'morra' é português atual e natural; evita o tom arcaizante de 'pereça', embora este reflita mais amplamente o campo lexical.
- source_word: ἔξω Ἰερουσαλήμ
  choice: fora de Jerusalém
  rationale: Reproduz diretamente a expressão espacial grega com clareza e precisão.
theological_decisions:
- issue: Força da afirmação de que um profeta não pode morrer fora de Jerusalém
  choice: Manter a linguagem de impossibilidade, deixando perceptível a incongruência e a possível ironia profética.
  alternative: Traduzir como 'é inconcebível' ou 'não convém', ressaltando mais diretamente o caráter retórico ou irônico.
  rationale: οὐκ ἐνδέχεται pode indicar impossibilidade, inadmissibilidade ou algo inconcebível. A versão não transforma a frase em uma afirmação metafísica absoluta nem resolve sua ironia.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; 'preciso' evita a rigidez de 'é necessário que eu', e 'morra' evita o possível arcaísmo de 'pereça'. Os marcadores foram posicionados junto às expressões que explicam.
