base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: pt
  text: Ali haverá choro e ranger de dentes, quando vocês virem Abraão, Isaque, Jacó e todos os profetas no reino de Deus, mas vocês mesmos serão lançados para fora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa um particípio passivo: “sendo lançados para fora”, enfatizando a expulsão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo que aponta para o lugar da exclusão; “ali” é direto e natural em português.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: choro e ranger de dentes
  rationale: Expressão bíblica corrente e fiel, que preserva a imagem concreta de angústia.
- source_word: ὅταν ὄψησθε
  choice: quando vocês virem
  rationale: O subjuntivo português após “quando” expressa naturalmente o acontecimento futuro indicado pelo aoristo subjuntivo grego.
- source_word: πάντας τοὺς προφήτας
  choice: todos os profetas
  rationale: Tradução direta que mantém a ênfase de πάντας.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: no reino de Deus
  rationale: Preserva a formulação bíblica tradicional e o sentido locativo da expressão.
- source_word: ὑμᾶς δὲ
  choice: mas vocês mesmos
  rationale: “Mas” marca o contraste, e “vocês mesmos” reproduz a ênfase do pronome explícito.
- source_word: ἐκβαλλομένους ἔξω
  choice: sendo lançados para fora
  rationale: Mantém o particípio passivo e a força de expulsão de ἐκβάλλω, enquanto “para fora” representa explicitamente ἔξω.
theological_decisions:
- issue: Natureza da imagem de juízo
  choice: Manter a linguagem concreta de exclusão e angústia sem suavizá-la nem defini-la além do texto.
  alternative: Parafrasear como “profunda tristeza” ou “condenação final”.
  rationale: O versículo retrata pessoas excluídas do reino e a angústia associada, mas não apresenta por si só uma formulação completa sobre o juízo final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A ordem da frase foi mantida próxima ao grego sem sacrificar a naturalidade.
