id: LUK.13.9
reference: Luke 13:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: pt
  text: E, se ela der fruto no futuro, muito bem; mas, se não[a], você a cortará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no próximo ano”; algumas traduções tornam o período mais específico com base no versículo anterior, mas aqui o grego diz mais literalmente “no futuro” ou “no tempo que vem”.
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: E, se
  rationale: κἄν reúne καί e ἐάν, introduzindo uma condição ligada ao contexto; μέν prepara o contraste com δέ. “E, se” conserva de modo natural tanto a ligação quanto a condição.
- source_word: ποιήσῃ καρπὸν
  choice: ela der fruto
  rationale: Com καρπός, ποιέω tem o sentido idiomático de produzir ou dar fruto. Em português, “dar fruto” é a colocação agrícola mais natural; “ela” retoma a figueira do contexto.
- source_word: εἰς τὸ μέλλον
  choice: no futuro
  rationale: A expressão indica literalmente o tempo vindouro, sem especificar por si mesma “no próximo ano”. “No futuro” preserva essa abertura temporal.
- source_word: εἰ δὲ μήγε
  choice: mas, se não
  rationale: Expressa a alternativa negativa em contraste enfático com a primeira condição. A formulação é concisa e corrente em português.
- source_word: ἐκκόψεις αὐτήν
  choice: você a cortará
  rationale: No contexto do cultivo da figueira, ἐκκόπτω significa cortar ou abater a árvore. “Cortará” mantém a imagem, e o pronome “a” retoma naturalmente “figueira”.
theological_decisions:
- issue: Sentido temporal do juízo adiado na parábola
  choice: Manter a condição com a referência geral “no futuro”, sem inserir um prazo explícito no texto principal.
  alternative: Traduzir εἰς τὸ μέλλον como “no próximo ano”, com base no período concedido no versículo anterior.
  rationale: Neste versículo, o grego não diz explicitamente “no próximo ano”; a expressão é mais geral. Preservar essa formulação evita uma precisão maior que a do texto, mantendo a tensão entre oportunidade futura e possível corte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o caráter oral da parábola e a ambiguidade temporal do grego. “Muito bem” supre de modo natural a consequência elíptica da primeira condição, sem acrescentar conteúdo teológico.
