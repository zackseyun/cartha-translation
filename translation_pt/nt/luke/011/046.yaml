id: LUK.11.46
reference: Luke 11:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: pt
  text: 'Ele, porém, disse: “Ai de vocês também, especialistas na Lei[a], porque impõem às pessoas cargas difíceis de carregar, e vocês mesmos não tocam nas cargas nem com um só dedo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “intérpretes da Lei”. O termo grego se refere a especialistas na Lei judaica.
    reason: lexical_alternative
  - marker: b
    text: Ou, de modo idiomático, “não levantam um dedo para ajudar com as cargas”. A expressão ressalta que não fazem esforço para ajudar com aquilo que impõem aos outros.
    reason: idiomatic_explanation
lexical_decisions:
- source_word: νομικοῖς
  choice: especialistas na Lei
  rationale: No contexto de Lucas, o termo designa pessoas versadas na Lei judaica, não advogados civis no sentido moderno. A expressão explicita o referente com clareza e naturalidade.
- source_word: οὐαί
  choice: Ai de vocês
  rationale: Preserva a força profética de denúncia e juízo, sem reduzir a expressão a um simples lamento.
- source_word: φορτίζετε
  choice: põem sobre
  rationale: Conserva a imagem concreta de impor uma carga a alguém e evita uma repetição pouco natural em português com o substantivo “cargas”.
- source_word: ἀνθρώπους
  choice: as pessoas
  rationale: O substantivo é genérico e abrange seres humanos em geral, não apenas homens.
- source_word: φορτία δυσβάστακτα
  choice: cargas difíceis de carregar
  rationale: Mantém a metáfora e expressa a dificuldade sem exagerá-la como se as cargas fossem absolutamente impossíveis de suportar.
- source_word: αὐτοὶ
  choice: vocês mesmos
  rationale: 'Reproduz a ênfase contrastiva do pronome: eles impõem as cargas aos outros, mas não participam delas.'
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: nem com um só dedo
  rationale: Expressão natural em português que preserva a imagem de esforço mínimo e a construção enfática.
- source_word: προσψαύετε
  choice: não encostam
  rationale: Mantém o sentido concreto de tocar ou fazer contato, sem transformar a implicação de falta de ajuda em paráfrase no texto principal.
- source_word: Καὶ ὑμῖν
  choice: também de vocês
  rationale: 'Preserva a força aditiva: a declaração de juízo se estende a este outro grupo.'
theological_decisions:
- issue: Identidade dos νομικοί
  choice: especialistas na Lei, isto é, conhecedores da Lei judaica
  alternative: advogados; intérpretes da Lei; escribas
  rationale: “Advogados” sugeriria uma profissão jurídica moderna, enquanto “escribas” identificaria o grupo de modo mais específico do que o termo grego exige. “Especialistas na Lei” comunica a função religiosa e interpretativa sem impor uma equivalência denominacional.
- issue: Sentido da cláusula final
  choice: preservar a imagem concreta de não encostar nas cargas nem com um dedo
  alternative: não mover um dedo para ajudar; não ajudar em nada com as cargas
  rationale: O texto afirma literalmente que eles não tocam as cargas e implica sua indisposição para ajudar. A tradução mantém essa tensão entre imagem e implicação, deixando a explicação para a nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “Lei” recebe inicial maiúscula por se referir à Lei judaica. A metáfora das cargas e do dedo foi preservada, enquanto a sintaxe foi ajustada para soar natural em português.
