  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: pt
  text: 'Por isso, também a sabedoria de Deus disse[a]: “Eu lhes enviarei profetas e apóstolos; eles matarão e perseguirão alguns deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sabedoria divina”. A expressão pode ser entendida como personificação da sabedoria de Deus, como referência ao sábio decreto de Deus ou como autorreferência implícita de Jesus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressão causal e inferencial natural em português, ligando a declaração à acusação anterior.
- source_word: καὶ
  choice: também
  rationale: Preserva a força aditiva do grego sem reduzir a conjunção a mera ligação entre orações.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: a sabedoria de Deus
  rationale: Mantém de perto a construção genitiva e não decide se se trata de personificação, decreto sábio de Deus ou autorreferência implícita de Jesus.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente simples, natural e não interpretativo do aoristo narrativo.
- source_word: Ἀποστελῶ εἰς αὐτούς
  choice: Eu lhes enviarei
  rationale: Forma idiomática em português para enviar pessoas a determinados destinatários; preserva o valor futuro.
- source_word: προφήτας καὶ ἀποστόλους
  choice: profetas e apóstolos
  rationale: Emprega os termos reconhecidos no uso bíblico e preserva o provável sentido técnico de ἀπόστολος.
- source_word: ἐξ αὐτῶν
  choice: alguns ... outros
  rationale: Expressa de modo natural a força partitiva — pessoas dentre o grupo enviado — e, pela coordenação dos dois verbos, evita sugerir sem necessidade que exatamente os mesmos indivíduos sofrerão ambas as ações.
- source_word: ἀποκτενοῦσιν
  choice: matarão
  rationale: Tradução direta, clara e corrente do futuro de ἀποκτείνω.
- source_word: διώξουσιν
  choice: perseguirão
  rationale: No contexto hostil, διώκω denota perseguição, não simples movimento ou busca neutra.
theological_decisions:
- issue: Sentido de “a sabedoria de Deus”
  choice: Manter a expressão sem identificar explicitamente seu referente.
  alternative: Entendê-la como personificação da sabedoria divina, como o sábio decreto de Deus ou como autorreferência implícita de Jesus.
  rationale: O texto admite mais de uma leitura. A tradução conserva a ambiguidade e a tensão teológica, sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem “Por isso, também” conserva o elemento aditivo do grego. A citação usa construção fluente sem elevar desnecessariamente o registro.
