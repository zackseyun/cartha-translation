review_pass:
  verdict: revise
  source_fidelity: A oração condicional, a divisão interna, a pergunta sobre a permanência do reino e a acusação de expulsar demônios por meio de Beelzebul estão bem representadas. Contudo, «até Satanás» tende a significar “even Satan” e não reproduz com precisão o καὶ aditivo (“também”). Além disso, o texto grego de partida traz Βεελζεβούλ (Beelzebul), ao passo que o texto principal usa «Belzebu».
  naturalness: A redação é clara, moderna e apropriada para português internacional com boa legibilidade brasileira. «Como o seu reino permanecerá de pé?» preserva naturalmente a imagem do grego. «Também Satanás» é uma correção pequena e idiomática; a posição após o verbo evita uma abertura menos fluida.
  terminology: «Satanás», «reino», «expulso» e «demônios» são escolhas estabelecidas e adequadas. Para seguir a forma do SBLGNT, o nome no texto deve ser «Beelzebul»; «Belzebu» pode ficar na nota como forma tradicional portuguesa.
  issues:
  - severity: medium
    issue: «até Satanás» para καὶ ὁ Σατανᾶς
    rationale: Neste contexto, καὶ é aditivo (“também”), não intensificador (“até”). «Também Satanás» preserva o paralelismo argumentativo sem introduzir a nuance de surpresa de «até».
  - severity: medium
    issue: «Belzebu» no texto principal para Βεελζεβούλ
    rationale: O SBLGNT fornecido lê Beelzebul. A forma tradicional portuguesa «Belzebu» é válida como variante de recepção, mas não deve substituir no texto a forma seguida pela edição grega, especialmente quando a nota já identifica Beelzebul.
  revised_text: Mas, se Satanás também está dividido contra si mesmo, como o seu reino permanecerá de pé? Pois vocês dizem que eu expulso os demônios por Beelzebul.[a]
