id: LUK.11.18
reference: Luke 11:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: pt
  text: Mas, se Satanás também está dividido contra si mesmo, como o seu reino permanecerá de pé? Pois vocês dizem que eu expulso os demônios por Beelzebul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: Beelzebul; algumas tradições em português usam Belzebu.'
    reason: Registra a forma do texto grego e a variante tradicional portuguesa do nome.
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satanás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome ou título pessoal grego.
- source_word: ἐφ’ ἑαυτὸν
  choice: contra si mesmo
  rationale: Com διεμερίσθη, a expressão indica oposição ou divisão interna; esta formulação é natural e preserva a força reflexiva.
- source_word: διεμερίσθη
  choice: está dividido
  rationale: O aoristo passivo descreve, no argumento condicional, o estado resultante da divisão; o presente em português comunica esse estado com naturalidade.
- source_word: πῶς σταθήσεται
  choice: como ... permanecerá de pé
  rationale: Preserva a metáfora de manter-se estabelecido e explicita naturalmente em português a ideia de continuidade ou resistência.
- source_word: βασιλεία
  choice: reino
  rationale: Termo consagrado e apropriado para o domínio ou esfera de governo de Satanás neste contexto.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação que fundamenta a pergunta retórica de Jesus.
- source_word: ἐν Βεελζεβοὺλ
  choice: por Belzebu
  rationale: Neste contexto, ἐν expressa agência ou instrumentalidade; “por” comunica isso sem acrescentar explicitamente “pelo poder de”.
- source_word: Βεελζεβοὺλ
  choice: Belzebu
  rationale: Forma portuguesa tradicional correspondente ao grego Βεελζεβούλ; a variante também conhecida é registrada em nota.
- source_word: ἐκβάλλειν
  choice: expulso
  rationale: Verbo direto, corrente e adequado ao contexto de expulsão de demônios.
- source_word: δαιμόνια
  choice: demônios
  rationale: Equivalente lexical direto e convencional, sem a interpretação adicional envolvida em “espíritos malignos”.
theological_decisions:
- issue: Natureza da acusação feita pelos adversários de Jesus
  choice: A acusação afirma que Jesus expulsa os demônios por Belzebu.
  alternative: A acusação poderia ser expandida como “pelo poder de Belzebu” ou entendida como associação com Belzebu.
  rationale: A tradução verte ἐν de modo idiomático como agência, mas não explicita uma teoria sobre a natureza desse poder ou vínculo, preservando a concisão e a tensão do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa o plural λέγετε de forma natural. A expressão “permanecerá de pé” conserva a metáfora grega sem soar excessivamente literal.
