  rationale: A revisão substitui o aditivo grego καὶ por «também» e adota «Beelzebul» no texto principal, conforme Βεελζεβούλ no SBLGNT. Mantém-se a forma tradicional «Belzebu» em nota. O restante da redação já transmite com fidelidade e naturalidade o argumento e a acusação.
