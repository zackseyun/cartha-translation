id: LUK.11.52
reference: Luke 11:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: pt
  text: Ai de vocês, especialistas na Lei[a], porque tiraram a chave do conhecimento[b]. Vocês mesmos não entraram e impediram os que estavam entrando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, peritos na Lei judaica; não advogados no sentido moderno.
    reason: Esclarecimento lexical e histórico.
  - marker: b
    text: 'Ou: “a chave para o conhecimento”.'
    reason: Alternativa natural para a relação expressa pelo genitivo grego.
lexical_decisions:
- source_word: οὐαί
  choice: Ai de vocês
  rationale: Preserva a força de denúncia profética da expressão grega em linguagem bíblica clara e corrente.
- source_word: νομικοῖς
  choice: especialistas na Lei
  rationale: Evita a associação moderna de “advogados” com o direito civil e identifica naturalmente os peritos na Lei judaica.
- source_word: ἤρατε
  choice: tiraram
  rationale: Neste contexto, αἴρω indica remover ou privar outros de algo, não apenas carregar.
- source_word: κλεῖδα τῆς γνώσεως
  choice: a chave do conhecimento
  rationale: Reproduz de perto a construção genitiva grega e preserva intacta a metáfora de acesso.
- source_word: αὐτοὶ
  choice: vocês mesmos
  rationale: Mantém a ênfase acusatória e o contraste expresso pelo pronome grego.
- source_word: οὐκ εἰσήλθατε
  choice: não entraram
  rationale: Conserva a metáfora de entrada sem explicitar indevidamente aquilo em que não entraram.
- source_word: τοὺς εἰσερχομένους
  choice: os que estavam entrando
  rationale: Expressa o aspecto contínuo do particípio presente sem acrescentar a ideia não explícita de mera tentativa.
- source_word: ἐκωλύσατε
  choice: impediram
  rationale: Comunica de modo natural a ação de barrar ou obstruir o acesso; embora possa sugerir resultado efetivo, é a equivalência corrente mais clara em português.
theological_decisions:
- issue: Referente metafórico de “entrar” e da “chave do conhecimento”
  choice: Manter a metáfora de acesso e entrada sem nomear seu destino.
  alternative: Explicitar “entrar no Reino de Deus” ou “entrar no verdadeiro conhecimento de Deus”.
  rationale: O texto grego não declara o objeto de “entrar”. Preservar essa abertura evita impor ao versículo uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui a Lei judaica. A formulação mantém o paralelismo acusatório e não resolve o referente implícito da metáfora.
