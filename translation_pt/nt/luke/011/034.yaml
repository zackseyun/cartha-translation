  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: pt
  text: A lâmpada do seu corpo é o seu olho. Quando o seu olho é saudável[a], todo o seu corpo também fica cheio de luz; mas, quando o seu olho é mau[b], todo o seu corpo também fica escuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “simples”, “singelo”, “íntegro” ou, tradicionalmente, “simples”. O adjetivo grego também pode sugerir inteireza ou ausência de duplicidade; aqui descreve o olho em contraste com um olho “mau”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ruim” ou “doente”. O termo grego pode significar “mau” ou “ruim” e pode sugerir tanto um olho defeituoso quanto uma percepção moralmente distorcida.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: lâmpada
  rationale: Preserva a imagem concreta de uma fonte de luz, em vez de empregar o termo abstrato “luz”.
- source_word: σῶμα
  choice: corpo
  rationale: É o sentido normal do substantivo aqui e mantém a metáfora que relaciona percepção e condição interior.
- source_word: ὀφθαλμός
  choice: olho
  rationale: Mantém o órgão corporal literal sobre o qual se constrói a imagem do versículo.
- source_word: ὅταν ... ᾖ
  choice: quando ... é
  rationale: Expressa com naturalidade em português o valor temporal-condicional geral da construção com o subjuntivo.
- source_word: ἁπλοῦς
  choice: saudável
  rationale: No contraste com πονηρός e na imagem do olho como lâmpada, comunica naturalmente a ideia de um olho íntegro e que funciona bem, sem eliminar em nota os sentidos de “simples”, “singelo” ou “sem duplicidade”.
- source_word: ὅλον ... φωτεινόν
  choice: todo o seu corpo também fica cheio de luz
  rationale: “Cheio de luz” transmite de modo idiomático o sentido de φωτεινός e conserva a imagem luminosa; “fica” expressa o estado resultante no paralelismo.
- source_word: ἐπὰν δὲ
  choice: mas, quando
  rationale: Mantém o contraste e o paralelismo temporal-condicional com a oração anterior.
- source_word: πονηρός
  choice: mau
  rationale: Preserva melhor que “doente” a possível sobreposição entre deficiência funcional e maldade moral.
- source_word: σκοτεινόν
  choice: escuro
  rationale: Reproduz de forma concisa a antítese com “cheio de luz”.
theological_decisions:
- issue: Sentido de ἁπλοῦς aplicado ao olho
  choice: saudável no texto principal
  alternative: simples, singelo, sem duplicidade ou generoso
  rationale: A metáfora imediata favorece a ideia de um olho em bom estado, mas o termo pode evocar inteireza ou ausência de duplicidade. A nota preserva essa amplitude sem impor uma leitura moral ou econômica específica.
- issue: Sentido de πονηρός aplicado ao olho
  choice: mau no texto principal
  alternative: ruim, doente ou maligno
  rationale: “Mau” conserva a tensão entre um olho defeituoso e uma percepção moralmente corrompida, evitando resolver a metáfora em apenas um desses sentidos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre luz e escuridão e conserva, por meio das notas, a ambiguidade lexical e sintática genuína do grego.
