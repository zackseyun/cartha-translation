id: LUK.11.15
reference: Luke 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: pt
  text: 'Mas alguns deles disseram: “É por Beelzebul[a], o governante dos demônios, que ele expulsa os demônios.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também conhecido tradicionalmente como Belzebu; o texto grego traz Beelzebul.
    reason: Registra a forma portuguesa tradicional sem afastar o texto principal da forma atestada no grego.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mas alguns deles
  rationale: Mantém o contraste expresso por δέ e o sentido partitivo de ἐξ αὐτῶν, identificando um grupo não especificado entre os presentes, em português natural.
- source_word: εἶπον
  choice: disseram
  rationale: O aoristo apresenta a fala como um acontecimento simples; “disseram” é a correspondência direta e idiomática.
- source_word: Ἐν Βεελζεβοὺλ
  choice: É por Beelzebul
  rationale: Neste contexto, ἐν com nome pessoal indica agência ou meio. A construção enfática “É por...” torna clara a acusação sem acrescentar “poder”, que não aparece explicitamente no grego.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Translitera a forma Βεελζεβούλ do texto grego; a forma tradicional “Belzebu” é registrada em nota.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: o governante dos demônios
  rationale: ἄρχων designa alguém que exerce governo ou autoridade. “Governante” é claro e atual, preservando a relação de autoridade sobre os demônios sem recorrer ao tradicional “príncipe”.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ele expulsa os demônios
  rationale: “Expulsar” comunica naturalmente o sentido de ἐκβάλλω no contexto de exorcismo, enquanto “demônios” corresponde diretamente a δαιμόνια.
theological_decisions:
- issue: Forma do nome Βεελζεβούλ
  choice: Beelzebul
  alternative: Belzebu
  rationale: O texto principal segue de perto a forma grega, sem substituir o nome pela forma portuguesa tradicional. Como “Belzebu” é amplamente conhecida e representa a tradição textual e tradutória, ela é indicada em nota.
- issue: Sentido de ἐν na acusação
  choice: É por Beelzebul... que ele expulsa
  alternative: Ele expulsa... pelo poder de Beelzebul
  rationale: A formulação escolhida preserva a agência ou instrumentalidade atribuída a Beelzebul, mas evita inserir o substantivo “poder”, implícito no contexto e não expresso no original.
- issue: Título ἄρχων
  choice: governante dos demônios
  alternative: príncipe dos demônios
  rationale: “Governante” expressa autoridade de modo transparente no português moderno e não impõe uma hierarquia demonológica mais precisa do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção clivada “É por... que” reproduz com naturalidade a ênfase da acusação e evita uma sequência ambígua de complementos.
