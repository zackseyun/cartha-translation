id: LUK.11.31
reference: Luke 11:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: pt
  text: A rainha do Sul se levantará no julgamento com os homens desta geração e os condenará[a], porque ela veio dos confins da terra para ouvir a sabedoria de Salomão. E eis que algo maior do que Salomão está aqui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a figura comumente identificada como a rainha de Sabá (ver 1 Reis 10:1–13; 2 Crônicas 9:1–12).
    reason: cross_reference
  - marker: b
    text: 'Ou: “alguém maior do que Salomão”. O grego emprega uma expressão neutra, literalmente “algo maior do que Salomão”, que pode enfatizar mais do que uma comparação pessoal direta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: a rainha do Sul
  rationale: Preserva a construção grega e a alusão veterotestamentária sem explicitar no texto principal a identificação provável com a rainha de Sabá.
- source_word: ἐγερθήσεται
  choice: se levantará
  rationale: Expressa naturalmente a cena judicial e mantém a possível ressonância escatológica ou de ressurreição sem torná-la explícita demais.
- source_word: ἐν τῇ κρίσει
  choice: no julgamento
  rationale: O artigo grego aponta para um julgamento definido, no contexto escatológico.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: com os homens
  rationale: Mantém o sentido especificamente masculino de ἀνδρῶν, em vez de generalizá-lo como 'pessoas'.
- source_word: τῆς γενεᾶς ταύτης
  choice: desta geração
  rationale: Representa o sentido usual de γενεά no contexto sinótico, referindo-se aos contemporâneos de Jesus.
- source_word: κατακρινεῖ αὐτούς
  choice: os condenará
  rationale: κατακρίνω indica condenação, e não apenas o ato neutro de julgar.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: dos confins da terra
  rationale: Expressão portuguesa digna e corrente para um lugar extremamente distante, preservando a amplitude do idioma grego.
- source_word: ἀκοῦσαι
  choice: para ouvir
  rationale: O infinitivo expressa propósito após o verbo 'veio'; 'para ouvir' é claro e direto.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: a sabedoria de Salomão
  rationale: Mantém de perto a estrutura grega e o destaque dado à sabedoria buscada.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Conserva a força solene do marcador discursivo que chama atenção para a declaração culminante.
- source_word: πλεῖον Σολομῶνος
  choice: algo maior do que Salomão
  rationale: O comparativo está no neutro; 'algo maior' preserva essa forma e evita reduzir a afirmação a uma comparação exclusivamente pessoal.
- source_word: ὧδε
  choice: está aqui
  rationale: Tradução natural e direta do advérbio locativo, indicando presença atual.
theological_decisions:
- issue: Identidade da rainha como a rainha de Sabá
  choice: Manter 'a rainha do Sul' no texto principal
  alternative: a rainha de Sabá
  rationale: Embora a alusão a 1 Reis 10 e 2 Crônicas 9 seja forte, o texto grego diz literalmente 'rainha do Sul'. A identificação provável é informada em nota, sem ser inserida na fala de Jesus.
- issue: Personalização de πλεῖον Σολομῶνος
  choice: algo maior do que Salomão
  alternative: alguém maior do que Salomão
  rationale: O neutro grego pode abranger a pessoa de Jesus e a realidade presente nele, incluindo sua missão, mensagem ou reino. A tradução mantém essa tensão em vez de resolvê-la.
- issue: Ressonância de ressurreição em ἐγερθήσεται
  choice: se levantará
  alternative: será ressuscitada
  rationale: No cenário escatológico, o verbo pode evocar ressurreição, mas também descreve naturalmente alguém que se levanta ou comparece no julgamento. A formulação escolhida preserva ambas as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. 'Confins da terra' e 'eis que' preservam a solenidade retórica sem tornar o versículo arcaico. Os marcadores [a] e [b] aparecem no texto principal junto às afirmações que explicam.
