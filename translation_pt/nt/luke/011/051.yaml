id: LUK.11.51
reference: Luke 11:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: pt
  text: 'desde o sangue de Abel até o sangue de Zacarias[a], que pereceu entre o altar e a casa[b]. Sim, eu lhes digo: isso será cobrado desta geração.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Não se sabe ao certo qual Zacarias é mencionado aqui. Entre as possibilidades estão Zacarias, filho de Joiada (2 Crônicas 24:20–22), e Zacarias, filho de Berequias.
    reason: cross_reference
  - marker: b
    text: Ou “entre o altar e o templo”; literalmente, “entre o altar e a casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: desde o sangue de Abel até o sangue de Zacarias
  rationale: Preserva a construção retórica que vai de Abel a Zacarias e mantém “sangue” como expressão bíblica de morte violenta e culpa de sangue.
- source_word: τοῦ ἀπολομένου
  choice: que pereceu
  rationale: Mantém a formulação do particípio de ἀπόλλυμι sem explicitar além do grego o agente da morte, embora o contexto indique morte violenta.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: entre o altar e a Casa
  rationale: “Casa”, com inicial maiúscula, conserva o sentido literal de οἶκος e sinaliza no contexto a Casa de Deus, isto é, o edifício do templo; a alternativa contextual mais explícita fica em nota.
- source_word: ναί, λέγω ὑμῖν
  choice: Sim, eu lhes digo
  rationale: Reproduz a afirmação enfática e solene em português atual e natural.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: isso será cobrado desta geração
  rationale: O passivo indica prestação de contas ou exigência judicial. “Isso” preserva o sujeito implícito sem inserir explicitamente Deus como agente, e “desta geração” mantém a força de ἀπό.
theological_decisions:
- issue: Identidade de Zacarias
  choice: O texto principal não identifica qual Zacarias é mencionado.
  alternative: Zacarias, filho de Joiada; Zacarias, filho de Berequias; ou uma figura representativa dos profetas martirizados.
  rationale: O texto grego traz apenas o nome Zacarias. A nota registra a discussão histórica sem resolver uma ambiguidade que o versículo mantém.
- issue: Responsabilidade de “esta geração”
  choice: Mantém-se a referência direta à geração interpelada por Jesus, sem ampliação ou restrição doutrinária.
  alternative: Interpretar a expressão segundo um sistema teológico mais amplo ou como referência a outro grupo além do explicitamente mencionado.
  rationale: A tradução conserva a tensão judicial e pactual da declaração sem importar conclusões que não estão expressas no versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Casa” recebe inicial maiúscula para indicar a Casa de Deus sem abandonar a imagem literal do grego; “isso será cobrado” comunica com clareza a prestação de contas judicial, preservando o agente divino implícito.
