  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: pt
  text: pois um amigo meu chegou até mim, vindo de viagem, e não tenho nada para pôr diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: pois
  rationale: Introduz naturalmente, em português, a razão do pedido feito no contexto da parábola.
- source_word: φίλος μου
  choice: um amigo meu
  rationale: Preserva a referência indefinida e soa mais natural do que «meu amigo» neste contexto.
- source_word: παρεγένετο
  choice: chegou
  rationale: O aoristo de παραγίνομαι indica a chegada do amigo; o resultado presente fica claro pelo contexto.
- source_word: ἐξ ὁδοῦ
  choice: de viagem
  rationale: Expressa em português corrente o sentido idiomático de alguém que acaba de viajar, sem reproduzir de modo artificial a expressão literal «da estrada».
- source_word: πρός με
  choice: à minha casa
  rationale: No contexto de hospitalidade noturna, explicita de forma natural o destino implícito, isto é, a casa do falante.
- source_word: οὐκ ἔχω
  choice: não tenho nada
  rationale: Reproduz de maneira direta e idiomática a posse negada.
- source_word: ὃ παραθήσω αὐτῷ
  choice: para lhe oferecer
  rationale: Em contexto de refeição e hospitalidade, παρατίθημι significa pôr alimento diante de alguém; «oferecer» comunica isso naturalmente sem acrescentar explicitamente «comida».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a fala espontânea da parábola. «À minha casa» torna natural em português o sentido contextual de πρός με, embora o grego diga literalmente «até mim»; não há implicação teológica nessa explicitação.
