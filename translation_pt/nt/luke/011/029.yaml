source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: pt
  text: 'Enquanto as multidões se aglomeravam, ele começou a dizer: “Esta geração é uma geração má[a]. Ela busca um sinal, e nenhum sinal lhe será dado, a não ser o sinal de Jonas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perversa”.'
    reason: lexical_alternative
  - marker: b
    text: “O sinal de Jonas” pode se referir ao próprio Jonas como sinal por meio de sua missão profética e, à luz dos paralelos nos Evangelhos, também pode evocar correspondências tipológicas com a morte e a ressurreição de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: se aglomeravam
  rationale: O particípio presente no genitivo absoluto expressa uma ação contínua simultânea à ação principal. “Se aglomeravam” comunica naturalmente que as multidões estavam se reunindo em número crescente.
- source_word: ἤρξατο λέγειν
  choice: começou a dizer
  rationale: Preserva a força incoativa da construção grega sem sugerir indevidamente repetição.
- source_word: γενεά
  choice: geração
  rationale: É o equivalente corrente e conserva o sentido coletivo, temporal e moral da declaração.
- source_word: πονηρά
  choice: má
  rationale: Expressa de modo direto e compreensível a avaliação moral negativa; “perversa” permanece uma alternativa legítima.
- source_word: σημεῖον
  choice: sinal
  rationale: Mantém o termo amplo do grego, que pode designar um acontecimento autenticador, sem acrescentar explicitamente “milagroso”.
- source_word: ζητεῖ
  choice: busca
  rationale: Corresponde de perto ao verbo grego. O contexto permite perceber a postura exigente sem inseri-la diretamente na tradução.
- source_word: δοθήσεται
  choice: será dado
  rationale: Reproduz de forma natural o futuro passivo grego.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Depois da negação, introduz de maneira idiomática a única exceção.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: o sinal de Jonas
  rationale: Conserva aberta a relação expressa pelo genitivo, permitindo que o contexto esclareça se Jonas, sua missão ou uma correspondência tipológica está em vista.
theological_decisions:
- issue: Alcance da condenação de “esta geração”
  choice: Uma avaliação moral coletiva dos contemporâneos de Jesus, sem atenuação.
  alternative: Referência restrita somente a determinados adversários presentes.
  rationale: A repetição de γενεά produz uma denúncia coletiva enfática. A tradução mantém essa força sem limitar o referente além do que o grego permite.
- issue: Sentido de “o sinal de Jonas”
  choice: A expressão genitiva é preservada sem interpretação explícita no texto principal.
  alternative: Referência direta à pessoa e missão profética de Jonas; ou correspondência tipológica com a morte e ressurreição de Jesus.
  rationale: O contexto imediato de Lucas desenvolve a expressão de uma forma particular, enquanto paralelos nos Evangelhos permitem conexões tipológicas adicionais. A formulação aberta preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “Esta geração é uma geração” foi mantida para preservar a ênfase do grego. Os marcadores de nota foram reposicionados de acordo com o conteúdo efetivo das notas, corrigindo a associação incoerente presente na camada inglesa fornecida.
