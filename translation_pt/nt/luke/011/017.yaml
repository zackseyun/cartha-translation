  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: pt
  text: 'Ele, porém, sabendo o que eles pensavam, disse-lhes: “Todo reino dividido contra si mesmo é devastado, e uma casa cai sobre outra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma família cai contra outra família”. A palavra grega traduzida como “casa” também pode significar família ou unidade doméstica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Expressa conhecimento ou percepção mental e preserva de modo natural a relação participial com o verbo principal.
- source_word: διανοήματα
  choice: o que eles pensavam
  rationale: Comunica em português corrente os pensamentos ou raciocínios interiores sem lhes atribuir uma intenção mais específica do que o grego exige.
- source_word: Πᾶσα βασιλεία
  choice: Todo reino
  rationale: Preserva a força distributiva de πᾶσα e o caráter geral da máxima.
- source_word: ἐφ’ ἑαυτὴν
  choice: contra si mesmo
  rationale: No contexto de divisão interna, indica oposição dentro do próprio reino.
- source_word: διαμερισθεῖσα
  choice: dividido
  rationale: É a forma idiomática e direta para descrever cisão interna.
- source_word: ἐρημοῦται
  choice: é devastado
  rationale: Mantém a voz passiva e a ideia forte de ruína ou desolação, sem reduzir o sentido a mero enfraquecimento.
- source_word: οἶκος ἐπὶ οἶκον
  choice: uma casa cai sobre outra
  rationale: Conserva a imagem concreta e a construção comprimida do grego em português compreensível, sem eliminar a possibilidade de οἶκος significar unidade familiar.
- source_word: πίπτει
  choice: cai
  rationale: Preserva o presente proverbial e a metáfora simples do original.
theological_decisions:
- issue: Sentido de οἶκος na segunda parte da máxima
  choice: casa
  alternative: família ou unidade doméstica
  rationale: O substantivo grego pode designar tanto uma edificação quanto as pessoas de uma casa. O texto principal conserva a imagem concreta, enquanto a nota registra a leitura social possível sem decidir indevidamente entre elas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada para fluência natural, mantendo o contraste de δέ e o tom proverbial da declaração.
