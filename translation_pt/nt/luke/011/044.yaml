  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: pt
  text: Ai de vocês, porque são como túmulos não sinalizados, sobre os quais as pessoas passam sem saber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ai de vocês
  rationale: Reproduz a fórmula profética de denúncia e lamento em linguagem natural e digna; “vocês” oferece ampla legibilidade no português moderno.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: túmulos não sinalizados
  rationale: ἄδηλα indica aquilo que não está visível ou identificável. “Não sinalizados” comunica que os túmulos não podiam ser reconhecidos como tais, sem acrescentar que necessariamente não possuíam qualquer marca física.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: as pessoas passam sobre eles
  rationale: ἄνθρωποι é genérico neste contexto, por isso “as pessoas” é mais natural e semanticamente adequado que “os homens”. O verbo περιπατέω é expresso por “passam”, evitando a rigidez de “andam caminhando”.
- source_word: οὐκ οἴδασιν
  choice: sem saber
  rationale: Expressa de modo idiomático que as pessoas desconhecem estar passando sobre túmulos, preservando o sentido do grego.
theological_decisions:
- issue: Impureza ritual implícita ao passar sobre túmulos
  choice: Manter a imagem sem explicação dentro do versículo
  alternative: Explicitar que as pessoas se tornam ritualmente impuras sem saber
  rationale: O texto grego deixa a consequência cultural e ritual implícita. Acrescentá-la ao corpo do versículo interpretaria além do que está expresso.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A formulação conserva a força da denúncia profética e a imagem concreta, sem explicitar implicações rituais apenas pressupostas pelo contexto.
