id: LUK.11.43
reference: Luke 11:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: pt
  text: Ai de vocês, fariseus, porque amam os lugares de honra[a] nas sinagogas e as saudações nas praças de mercado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os primeiros assentos” ou “os assentos de maior destaque”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, saudações públicas que expressavam honra e reconhecimento social.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Ai de
  rationale: Preserva a força de denúncia profética da interjeição grega em linguagem bíblica clara e ainda corrente.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: vocês, fariseus
  rationale: Mantém o destinatário explícito e a interpelação direta, com pontuação natural em português.
- source_word: ὅτι
  choice: porque
  rationale: Expressa claramente a causa da denúncia.
- source_word: ἀγαπᾶτε
  choice: amam
  rationale: Reproduz diretamente o verbo grego e, neste contexto, comunica forte apego à honra social.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: os lugares de honra
  rationale: O singular coletivo grego designa os assentos de maior prestígio; esta formulação comunica melhor sua dimensão social do que a ideia meramente física de assentos dianteiros.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nas sinagogas
  rationale: Equivalente português direto, natural e historicamente reconhecível.
- source_word: τοὺς ἀσπασμοὺς
  choice: as saudações
  rationale: Mantém o sentido básico sem inserir no corpo do versículo a explicação cultural sobre reconhecimento honorífico.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: nas praças públicas
  rationale: ἀγορά designa o espaço público de mercado e convivência cívica; 'praças públicas' evita limitar a cena ao comércio e soa natural em português.
theological_decisions:
- issue: Natureza da denúncia de Jesus
  choice: Uma declaração profética de juízo contra o apego dos fariseus à honra pública.
  alternative: Uma simples crítica social a maus modos ou à vaidade.
  rationale: οὐαί, seguido da razão introduzida por ὅτι, tem força moral e profética. A tradução conserva essa tensão sem acrescentar consequências não declaradas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula “Ai de vocês” conserva a solenidade profética sem arcaísmo excessivo. Os marcadores aparecem junto às expressões que esclarecem.
