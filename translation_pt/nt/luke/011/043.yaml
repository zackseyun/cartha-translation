  source_fidelity: A tradução preserva adequadamente a denúncia profética de οὐαί, o destinatário direto, o motivo introduzido por ὅτι e a ideia de apreço por posições de honra e por saudações públicas. Contudo, «praças públicas» torna ἀγοραί mais genérico e deixa de indicar o sentido de praças ou espaços de mercado.
