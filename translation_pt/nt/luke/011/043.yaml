  terminology: «Lugares de honra» traduz bem πρωτοκαθεδρίαν sem reduzir o sentido a uma posição física. «Saudações» é correto para ἀσπασμοί; a nota cultural explica de modo não intrusivo sua dimensão honorífica. «Praças de mercado» é preferível a «praças públicas» para ἀγοραί.
