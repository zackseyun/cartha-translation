revisions:
- from: Assim, vocês são testemunhas e aprovam as obras dos seus antepassados, pois eles mataram os profetas, e vocês constroem os túmulos deles.[a]
  to: Assim, vocês são testemunhas e aprovam os atos dos seus antepassados, pois eles mataram os profetas, mas vocês constroem os túmulos deles.
  rationale: Substitui-se «e» por «mas» para refletir a contraposição μέν...δέ e «obras» por «atos» por maior naturalidade contextual. Mantém-se a explicitação, já adotada no texto, dos profetas e de seus túmulos a partir do contexto imediato; por isso, remove-se a nota que se tornou redundante.
