  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: pt
  text: Assim, vocês são testemunhas e aprovam os atos dos seus antepassados, pois eles mataram os profetas, mas vocês constroem os túmulos deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: Assim
  rationale: Expressa a conclusão inferencial ligada à acusação do versículo anterior de modo natural e digno em português.
- source_word: μάρτυρές ἐστε
  choice: vocês são testemunhas
  rationale: Preserva a construção nominal e a ideia de que suas próprias ações dão testemunho da ligação com os atos dos antepassados.
- source_word: συνευδοκεῖτε
  choice: aprovam
  rationale: Comunica concordância moral ativa, e não mera ciência dos atos mencionados.
- source_word: τοῖς ἔργοις
  choice: as obras
  rationale: Mantém o sentido amplo de ἔργα; neste contexto, refere-se claramente aos atos praticados pelos antepassados.
- source_word: τῶν πατέρων ὑμῶν
  choice: dos seus antepassados
  rationale: Em português contemporâneo, 'antepassados' comunica naturalmente as gerações anteriores aqui visadas sem perder a ligação familiar e histórica.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a explicação que fundamenta a acusação, preservando a relação lógica sem tornar a frase pesada.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: eles mataram os profetas
  rationale: O referente dos pronomes é recuperado do contexto imediato; explicitar 'os profetas' evita uma sequência pronominal ambígua em português.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: e vocês constroem os túmulos deles
  rationale: O pronome enfático é refletido em 'vocês'; 'e' preserva a coordenação correlativa μέν...δέ, enquanto o objeto elíptico de 'constroem' é recuperado do versículo anterior.
theological_decisions:
- issue: Se o objeto implícito de οἰκοδομεῖτε deve ser expresso
  choice: Explicitar 'os túmulos deles' no texto principal.
  alternative: Manter apenas 'e vocês constroem'.
  rationale: Embora o verbo esteja sem objeto expresso neste versículo, Lucas 11:47 fornece imediatamente 'os túmulos dos profetas'. A recuperação desse objeto produz português completo e claro sem alterar a acusação.
- issue: Força da relação entre os atos dos antepassados e os dos ouvintes
  choice: Usar 'e vocês constroem', sem converter a coordenação em contraste moral explícito.
  alternative: Usar 'mas vocês constroem'.
  rationale: A construção μέν...δέ contrapõe os sujeitos e distribui seus respectivos atos, mas, no argumento, ambos os atos funcionam juntos como evidência de aprovação. 'E' conserva essa tensão sem sugerir que construir os túmulos seja uma oposição virtuosa ao assassinato.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para ampla legibilidade brasileira. 'Antepassados' é mais natural que 'pais' neste sentido geracional. O objeto elíptico foi recuperado do contexto imediato, e a nota mantém essa dependência textual auditável.
