lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: armando ciladas contra ele
  rationale: O particípio expressa uma espera hostil com a intenção de apanhar alguém numa armadilha. A formulação é natural em português e mantém o caráter deliberadamente adverso da ação.
- source_word: αὐτόν
  choice: contra ele
  rationale: O pronome retoma Jesus e funciona como objeto de ἐνεδρεύοντες. Com «armando ciladas», a preposição «contra» explicita de modo idiomático o alvo da hostilidade, sem substituir o pronome pelo nome.
- source_word: θηρεῦσαί
  choice: apanhar
  rationale: O verbo evoca a caça e a captura de uma presa. «Apanhar» conserva essa metáfora e, no contexto, comunica a tentativa de usar contra Jesus algo que ele dissesse.
- source_word: τι
  choice: algo
  rationale: O pronome indefinido indica qualquer conteúdo verbal que pudesse servir de pretexto ou acusação, sem especificar antecipadamente que tipo de declaração seria.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: que saísse de sua boca
  rationale: A expressão concreta refere-se ao que Jesus viesse a dizer. Esta formulação mantém a imagem da boca e torna natural em português a relação indicada por ἐκ.
