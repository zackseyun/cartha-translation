id: LUK.11.9
reference: Luke 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: pt
  text: 'E eu lhes digo[a]: peçam, e lhes será dado; busquem, e encontrarão; batam, e lhes será aberto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, tornando mais explícita a possível força contínua dos imperativos gregos: «continuem pedindo... continuem buscando... continuem batendo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: E eu
  rationale: A crase de καί com ἐγώ mantém a ligação com o ensino anterior e dá leve ênfase ao sujeito, sem acrescentar um «também» que poderia explicitar em excesso.
- source_word: λέγω
  choice: digo
  rationale: O presente indicativo que introduz a declaração é expresso de modo natural e digno em português por «eu lhes digo».
- source_word: αἰτεῖτε
  choice: peçam
  rationale: O imperativo presente pode admitir força contínua ou reiterada, mas o imperativo simples preserva a amplitude aspectual do grego; a alternativa explícita é registrada em nota.
- source_word: δοθήσεται
  choice: lhes será dado
  rationale: O futuro passivo é preservado diretamente, e o dativo ὑμῖν é expresso por «lhes».
- source_word: ζητεῖτε
  choice: busquem
  rationale: «Buscar» mantém tanto o sentido concreto quanto o figurado de ζητέω e é corrente em português.
- source_word: εὑρήσετε
  choice: encontrarão
  rationale: Reproduz de maneira direta o futuro ativo e mantém o paralelismo entre ordem e promessa.
- source_word: κρούετε
  choice: batam
  rationale: No contexto, κρούω significa bater a uma porta; «batam» é idiomático e permite que o objeto implícito continue não expresso.
- source_word: ἀνοιγήσεται
  choice: lhes será aberto
  rationale: Mantém o futuro passivo e deixa implícito, como no grego, aquilo que será aberto, naturalmente entendido como a porta.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo plural é traduzido com naturalidade por «lhes», preservando a direção pessoal das promessas.
theological_decisions:
- issue: Aspecto dos imperativos presentes αἰτεῖτε, ζητεῖτε e κρούετε
  choice: 'Imperativos simples: «peçam», «busquem», «batam»'
  alternative: «continuem pedindo... continuem buscando... continuem batendo»
  rationale: Os imperativos presentes podem sugerir ação contínua ou repetida, mas essa nuance não precisa ser imposta como única leitura no texto principal. A nota conserva a possibilidade aspectual sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural «lhes» evita regionalizar o versículo com «vos» ou explicitar «a vocês». A cadência paralela e solene do original foi preservada.
