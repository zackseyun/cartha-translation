  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: pt
  text: Dá-nos, a cada dia, o nosso pão diário[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pão para o dia que vem”, “o pão de que necessitamos” ou, menos provavelmente aqui, “o pão supersubstancial”. O adjetivo grego é raro, e seu sentido é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: pão
  rationale: Traduz diretamente o substantivo grego e preserva tanto a imagem tradicional quanto sua possível referência concreta ao sustento básico.
- source_word: ἡμῶν
  choice: nosso
  rationale: Corresponde naturalmente ao pronome possessivo grego que modifica “pão”.
- source_word: ἐπιούσιον
  choice: diário
  rationale: O adjetivo é raro e muito discutido. Em Lucas, a expressão seguinte τὸ καθ’ ἡμέραν reforça a ideia de provisão cotidiana; “diário” é claro no texto principal, e as alternativas são preservadas em nota.
- source_word: δίδου
  choice: Dá
  rationale: O presente imperativo pode sugerir ação contínua ou habitual. “Dá” é natural em português, enquanto “a cada dia” comunica a repetição.
- source_word: ἡμῖν
  choice: nos
  rationale: Representa de modo direto e idiomático o objeto indireto da ordem.
- source_word: τὸ καθ’ ἡμέραν
  choice: a cada dia
  rationale: Expressa explicitamente a provisão repetida dia após dia e preserva a ênfase de Lucas na dependência contínua.
theological_decisions:
- issue: Sentido de ἐπιούσιον na oração do Senhor
  choice: diário
  alternative: para o dia que vem; de que necessitamos; supersubstancial
  rationale: Embora o adjetivo seja lexicalmente incerto, a expressão lucana “a cada dia” favorece aqui o sentido comum de provisão cotidiana. A nota conserva a ambiguidade sem impor ao texto principal uma interpretação sacramental ou metafísica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação pronominal em “Dá-nos” preserva o tom tradicional da oração sem soar arcaica; as vírgulas destacam naturalmente “a cada dia”.
