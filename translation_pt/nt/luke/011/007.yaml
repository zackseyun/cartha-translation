  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: pt
  text: 'e ele, lá de dentro, responde: “Não me incomode.[a] A porta já está fechada,[b] e meus filhos estão comigo na cama.[c] Não posso me levantar e lhe dar nada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me cause transtorno” ou “Pare de me incomodar”. A expressão grega fala literalmente em “causar incômodos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “A porta já foi fechada”. O verbo grego no perfeito pode destacar tanto a ação concluída quanto o estado resultante.'
    reason: lexical_alternative
  - marker: c
    text: “Na cama” refere-se ao lugar compartilhado onde a família dormia, não à intimidade conjugal.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: e ele, lá de dentro, responde
  rationale: Mantém a continuidade narrativa, a localização de quem fala e o presente do cenário hipotético; em português, “responde” comunica naturalmente a fórmula grega ἀποκριθεὶς εἴπῃ sem a redundância pouco idiomática de “respondendo, diga”.
- source_word: Μή μοι κόπους πάρεχε
  choice: Não me incomode
  rationale: Expressa de modo natural e digno o idioma grego de causar trabalho, incômodo ou transtorno, sem ampliar indevidamente a ideia.
- source_word: ἡ θύρα κέκλεισται
  choice: A porta já está fechada
  rationale: O perfeito κέκλεισται apresenta uma ação concluída cujo estado resultante permanece. A formulação portuguesa privilegia naturalmente esse estado sem sugerir que a porta esteja trancada.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: meus filhos estão comigo na cama
  rationale: Reproduz a disposição doméstica indicada pelo grego. “Filhos” é neutro e atual; “na cama” representa o lugar compartilhado de dormir.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Não posso me levantar para lhe dar nada
  rationale: O particípio ἀναστὰς indica a ação necessária antes de dar. “Nada” explicita em português o objeto elíptico recuperado do contexto, sem acrescentar um conteúdo específico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala conserva o tom de recusa cotidiana. “Lá de dentro” torna explícito o contraste espacial; “lhe dar nada” soa natural no português brasileiro e mantém o objeto indefinido pelo contexto.
