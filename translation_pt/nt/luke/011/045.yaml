  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: pt
  text: 'Então, um dos especialistas na Lei lhe respondeu: “Mestre, ao dizer essas coisas, o senhor também nos insulta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Então ... respondeu
  rationale: A construção introduz a reação seguinte na narrativa. “Então” expressa o desenvolvimento leve marcado por δέ, e “respondeu” traduz naturalmente o particípio aoristo em português.
- source_word: τις τῶν νομικῶν
  choice: um dos especialistas na Lei
  rationale: Em Lucas, νομικός designa um conhecedor especializado da Lei judaica, não necessariamente um advogado no sentido profissional moderno. A formulação evita esse possível anacronismo.
- source_word: λέγει αὐτῷ
  choice: respondeu
  rationale: O presente histórico λέγει pode ser vertido pelo passado na narrativa portuguesa. O destinatário está claro pelo contexto imediato, de modo que não é necessário repetir “a ele”.
- source_word: Διδάσκαλε
  choice: Mestre
  rationale: Como vocativo, “Mestre” é a forma corrente, digna e natural em português para alguém reconhecido como instrutor.
- source_word: ταῦτα λέγων
  choice: ao dizer essas coisas
  rationale: Preserva a relação simultânea e causal entre as palavras de Jesus e a queixa do especialista na Lei.
- source_word: καὶ ἡμᾶς
  choice: também nos
  rationale: 'Mantém o valor aditivo de καί: o falante entende que as palavras atingem seu próprio grupo além dos interlocutores já censurados.'
- source_word: ὑβρίζεις
  choice: insulta
  rationale: O verbo exprime insultar ou tratar com desprezo. “Insulta” preserva a força da acusação sem reduzi-la a mero incômodo ou ofensa subjetiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Especialistas na Lei” esclarece o referente histórico de νομικοί; a inicial maiúscula em “Lei” indica a Lei judaica/mosaica. O tratamento “o senhor” soa natural no português brasileiro e explicita respeitosamente o sujeito de segunda pessoa sem acrescentar conteúdo teológico.
