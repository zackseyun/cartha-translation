id: LUK.11.13
reference: Luke 11:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: pt
  text: Portanto, se vocês, sendo maus, sabem dar boas dádivas aos seus filhos, quanto mais o Pai do céu[a] dará o Espírito Santo[b] aos que lhe pedirem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “o Pai do céu” ou “o Pai proveniente do céu”; não diz “seu Pai celestial”, como algumas versões trazem por influência de Mateus 7:11.
    reason: alternative_reading
  - marker: b
    text: Em Mateus 7:11, o paralelo diz “coisas boas”; aqui Lucas diz especificamente “o Espírito Santo”.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: sendo maus
  rationale: Mantém de perto a construção participial grega e caracteriza a condição moral humana sem suavizá-la; em português, a formulação é clara e natural.
- source_word: οἴδατε ... διδόναι
  choice: sabem dar
  rationale: Em português, “saber” seguido do infinitivo expressa naturalmente a capacidade prática indicada pela construção grega, sem necessidade de acrescentar “como”.
- source_word: δόματα ἀγαθὰ
  choice: boas dádivas
  rationale: “Dádivas” preserva o sentido concreto de presentes concedidos e distingue δόματα do termo mais amplo “coisas”.
- source_word: τέκνοις ὑμῶν
  choice: aos seus filhos
  rationale: É a expressão familiar corrente e exata para os destinatários das dádivas.
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: Reproduz o argumento do menor para o maior por meio da fórmula comparativa idiomática em português.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: o Pai que vem do céu
  rationale: Preserva a preposição de origem ἐξ e a formulação peculiar de Lucas, sem acrescentar “seu” nem harmonizar com Mateus 7:11. “Que vem do céu” soa mais natural em português do que “do céu” isolado, embora a expressão grega possa também ser entendida como caracterização de origem.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto lucano, a expressão designa o Espírito divino; o artigo e as maiúsculas correspondem ao uso natural em português.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: aos que lhe pedirem
  rationale: A construção substantivada é vertida naturalmente por “aos que”; “lhe” conserva o objeto explícito referente ao Pai. O futuro do subjuntivo é idiomático na oração relativa de alcance geral ligada ao futuro “dará”.
theological_decisions:
- issue: Referente e grafia de πνεῦμα ἅγιον
  choice: “o Espírito Santo”, entendido como o Espírito divino pessoal
  alternative: “um espírito santo” ou “espírito santo” em sentido genérico
  rationale: Embora a expressão grega não tenha artigo, o contexto de Lucas aponta para o Espírito de Deus como a dádiva do Pai. A tradução mantém esse sentido sem desenvolver além do que o versículo declara.
- issue: Relação com o paralelo de Mateus 7:11
  choice: 'preservar as formulações próprias de Lucas: “o Pai que vem do céu” e “o Espírito Santo”'
  alternative: harmonizar como “seu Pai celestial” e/ou “coisas boas”
  rationale: O texto grego de Lucas não contém “seu” nessa expressão e nomeia especificamente o Espírito Santo; essas diferenças literárias e teológicas devem permanecer visíveis.
- issue: Força de πονηροὶ ὑπάρχοντες
  choice: 'afirmação descritiva: “sendo maus”'
  alternative: 'formulação concessiva explícita: “embora sejam maus”'
  rationale: A construção admite nuance concessiva pelo contexto, mas a versão escolhida conserva a forma mais direta e não resolve além do necessário a relação lógica do particípio.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμεῖς. “Boas dádivas” mantém a precisão lexical, e a ordem da frase acompanha o movimento retórico do grego. Os dois marcadores de nota aparecem no texto principal.
