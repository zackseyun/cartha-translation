base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: pt
  text: Quando ele saiu dali, os escribas e os fariseus começaram a pressioná-lo duramente e a interrogá-lo insistentemente[a] sobre muitos assuntos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «questioná-lo de perto»; ou, possivelmente, «fazê-lo falar de improviso». O verbo grego é raro e sugere uma tentativa agressiva de lhe arrancar respostas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Quando ele saiu dali
  rationale: A construção com genitivo absoluto apresenta a saída de Jesus como circunstância anterior à ação principal. Esta formulação preserva o sentido temporal e espacial em português natural.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Reproduz o valor ingressivo de ἄρχομαι com os infinitivos complementares.
- source_word: οἱ γραμματεῖς
  choice: os escribas
  rationale: Termo tradicional e direto para os especialistas na Lei mencionados no contexto dos Evangelhos.
- source_word: οἱ Φαρισαῖοι
  choice: os fariseus
  rationale: Forma portuguesa consagrada para o nome do grupo.
- source_word: δεινῶς ἐνέχειν
  choice: pressioná-lo duramente
  rationale: A combinação expressa pressão intensa e hostil contra Jesus; a tradução conserva tanto a ação quanto sua intensidade.
- source_word: ἀποστοματίζειν
  choice: interrogá-lo insistentemente
  rationale: O verbo raro descreve a tentativa agressiva de arrancar respostas ou declarações. Esta opção comunica a dinâmica de perguntas insistentes sem especificar além do que o contexto sustenta.
- source_word: περὶ πλειόνων
  choice: sobre muitos assuntos
  rationale: No contexto, a expressão indica uma variedade de temas, e não necessariamente uma comparação quantitativa.
