id: LUK.11.40
reference: Luke 11:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: pt
  text: Insensatos! Aquele que fez o exterior não fez também o interior?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a parte de fora [...] a parte de dentro”. No contexto imediato, as palavras podem indicar o exterior e o interior do recipiente e, por extensão, a vida exterior e interior da pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Insensatos
  rationale: Adjetivo vocativo plural usado como substantivo em uma repreensão direta. “Insensatos” conserva a força da censura e soa digno e natural em português atual.
- source_word: οὐχ ... ἐποίησεν;
  choice: não fez ...?
  rationale: A pergunta introduzida por οὐχ espera resposta afirmativa. A formulação portuguesa preserva essa força retórica e traduz o aoristo pelo pretérito perfeito.
- source_word: ὁ ποιήσας
  choice: Aquele que fez
  rationale: O particípio aoristo com artigo funciona substantivamente. “Aquele que fez” mantém a referência pessoal implícita sem acrescentar “Deus” ao texto.
- source_word: τὸ ἔξωθεν
  choice: o exterior
  rationale: O substantivo neutro designa o aspecto de fora. “O exterior” permite tanto a referência imediata ao recipiente quanto a extensão à vida exterior da pessoa.
- source_word: τὸ ἔσωθεν
  choice: o interior
  rationale: Em paralelo com τὸ ἔξωθεν, indica o aspecto de dentro. “O interior” preserva a aplicação simultânea ao recipiente e à realidade moral interior.
- source_word: καὶ
  choice: também
  rationale: Neste contexto retórico, “também” explicita naturalmente a lógica de que quem fez o exterior igualmente fez o interior.
theological_decisions:
- issue: Referente de “Aquele que fez”
  choice: Preservar uma referência implícita a Deus como Criador, sem explicitá-la no texto.
  alternative: Entender a expressão apenas como referência imediata a quem fez o recipiente.
  rationale: A formulação pode operar tanto no nível da imagem do copo e do prato quanto no nível da verdade mais ampla de que Deus fez o ser exterior e o interior. A tradução mantém essa amplitude e não insere “Deus”, ausente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repreensão permanece incisiva, e o paralelismo entre “exterior” e “interior” conserva a ambiguidade intencional do dito.
