id: LUK.11.33
reference: Luke 11:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: pt
  text: Ninguém, depois de acender uma lamparina, a coloca num lugar escondido[a], nem debaixo de um cesto[b], mas sobre um suporte para lamparina, a fim de que os que entram vejam a luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num porão” ou “num lugar secreto”; o grego κρύπτη pode indicar um lugar oculto, inclusive um compartimento subterrâneo usado para armazenamento.
    reason: lexical_alternative
  - marker: b
    text: O grego μόδιος designa uma medida para produtos secos e também o recipiente usado para medir; tradicionalmente, “alqueire” ou “cesto de medida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ninguém
  rationale: Equivalente português natural do pronome negativo indefinido, preservando a negação universal.
- source_word: λύχνον
  choice: uma lamparina
  rationale: Refere-se a uma pequena lâmpada portátil, normalmente alimentada por óleo; “lamparina” evita a ideia moderna de lâmpada elétrica.
- source_word: ἅψας
  choice: depois de acender
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a formulação preserva essa sequência de modo natural.
- source_word: εἰς κρύπτην
  choice: num lugar escondido
  rationale: κρύπτη pode designar um lugar oculto e, em certos contextos, um compartimento subterrâneo; a opção ampla mantém o foco na ocultação sem especificar indevidamente a arquitetura.
- source_word: τίθησιν
  choice: a coloca
  rationale: Tradução direta e idiomática do verbo de pôr ou colocar; o pronome retoma claramente a lamparina.
- source_word: ὑπὸ τὸν μόδιον
  choice: debaixo de um cesto
  rationale: μόδιος era uma medida de secos e também o recipiente usado para medir. “Cesto” comunica com clareza o objeto que cobriria a lamparina, enquanto a nota preserva a precisão histórica.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: sobre um suporte para lamparina
  rationale: λυχνία designa especificamente o suporte onde se colocava uma lamparina; a expressão é transparente para leitores modernos.
- source_word: ἵνα
  choice: a fim de que
  rationale: Introduz a finalidade da ação e conserva explicitamente a força final da construção grega.
- source_word: οἱ εἰσπορευόμενοι
  choice: os que entram
  rationale: Reproduz de forma concisa o particípio substantivado referente às pessoas que entram.
- source_word: τὸ φέγγος
  choice: a luz
  rationale: No contexto da lamparina, “luz” é a expressão portuguesa mais natural para φέγγος, que também pode significar brilho ou claridade.
- source_word: βλέπωσιν
  choice: vejam
  rationale: O subjuntivo após ἵνα expressa a finalidade pretendida; o subjuntivo português mantém essa relação.
theological_decisions:
- issue: Sentido de κρύπτη
  choice: lugar escondido
  alternative: porão; depósito; lugar secreto
  rationale: A força do dito está no contrassenso de ocultar uma luz. A tradução genérica preserva a imagem sem restringir o termo a um tipo específico de cômodo.
- issue: Representação de μόδιος
  choice: cesto no texto principal, com explicação em nota
  alternative: recipiente de medida; alqueire; cesto de medida
  rationale: A escolha torna imediatamente compreensível a imagem de cobrir a lamparina, enquanto a nota registra que o objeto era propriamente um recipiente de medida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Lamparina” explicita o objeto antigo sem recorrer ao termo mais literário e potencialmente menos acessível “candeia”. Os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem.
