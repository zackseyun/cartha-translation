base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: pt
  text: 'E aconteceu que, enquanto ele dizia essas coisas, uma mulher da multidão levantou a voz[a] e lhe disse: “Feliz o ventre que carregou você[b] e os seios que o amamentaram!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ergueu a voz”. A expressão grega é um idioma que pode indicar falar ou gritar em voz alta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que trouxe você no ventre”. O verbo grego pode referir-se a carregar ou trazer no ventre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa de Lucas em linguagem atual, sem o arcaísmo de «e sucedeu que».
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: enquanto ele dizia essas coisas
  rationale: O infinitivo articular com ἐν indica ação simultânea e em andamento; «enquanto» expressa isso naturalmente.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: uma mulher ... levantou a voz
  rationale: Reproduz o idioma grego de erguer a voz; τις tem aqui valor indefinido e não exige «certa».
- source_word: ἐκ τοῦ ὄχλου
  choice: no meio da multidão
  rationale: Identifica naturalmente a mulher como integrante da multidão; «da multidão» também seria possível, mas poderia soar como classificação.
- source_word: Μακαρία
  choice: Feliz
  rationale: Em português bíblico atual, «feliz» comunica o estado favorecido expresso por μακάριος sem sugerir que o ventre em si recebe uma bênção ritual; o sentido é honorífico, não mera emoção subjetiva.
- source_word: ἡ κοιλία
  choice: o ventre
  rationale: No contexto materno, refere-se ao ventre que gestou Jesus; «ventre» é preciso, digno e corrente em português.
- source_word: ἡ βαστάσασά σε
  choice: que carregou você
  rationale: βαστάζω pode descrever carregar ou trazer no ventre. A formulação conserva a imagem concreta e a ambiguidade entre gestação e dar à luz.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: os seios que o amamentaram
  rationale: Preserva a imagem anatômica concreta, mas formula a relação de modo idiomático em português, em vez do literal pouco natural «que você mamou».
theological_decisions:
- issue: Sentido honorífico de μακαρία em referência à mãe de Jesus
  choice: Feliz o ventre que carregou você, e os seios que o amamentaram!
  alternative: Bendito o ventre que carregou você, e os seios que o amamentaram!
  rationale: A tradução mantém integralmente o louvor dirigido à maternidade de Jesus, sem diminuí-lo nem ampliá-lo por meio de formulações marianas posteriores. «Feliz» é uma tradução usual de μακάριος e deixa que a resposta no versículo seguinte desenvolva a tensão do relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «você» por naturalidade contemporânea, mantendo «lhe disse» e o pronome objeto «o» para evitar repetição e preservar fluidez. A exclamação final explicita o tom enfático já indicado pelo ato de levantar a voz.
