  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: pt
  text: Portanto, se todo o seu corpo estiver cheio de luz, sem nenhuma parte escura, ele será inteiramente cheio de luz, como quando uma lamparina ilumina você com seu brilho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como quando uma lamparina ilumina você com seu clarão”. O termo grego pode indicar clarão ou brilho; aqui, provavelmente se refere ao resplendor da lamparina, não a um relâmpago literal.'
    reason: alternativa lexical
lexical_decisions:
- source_word: σῶμά
  choice: corpo
  rationale: Mantém o termo concreto e a imagem corporal ligada ao ensino anterior sobre o olho, sem interpretar explicitamente o referente como alma, interior ou condição moral.
- source_word: ὅλον
  choice: todo / inteiramente
  rationale: Preserva a força totalizante das duas ocorrências; a variação em português evita uma construção pesada sem eliminar a repetição conceitual.
- source_word: φωτεινόν
  choice: cheio de luz / iluminado
  rationale: Expressa de modo natural o contraste com a parte escura. Na segunda ocorrência, “inteiramente iluminado” produz português fluente e preserva a imagem luminosa.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: sem nenhuma parte escura
  rationale: Reproduz de maneira clara e concisa a ausência de qualquer região escura, mantendo a imagem concreta de “parte”.
- source_word: ἔσται
  choice: ficará
  rationale: Traduz o futuro e torna perceptível a consequência da condição. Embora “será” seja mais estritamente formal, “ficará” é natural neste contexto de iluminação resultante.
- source_word: ὡς ὅταν
  choice: como quando
  rationale: Mantém a comparação temporal de forma direta e idiomática.
- source_word: λύχνος
  choice: lamparina
  rationale: Designa uma pequena lâmpada portátil do mundo antigo e evita a possível abstração de “luz”; “lamparina” é amplamente compreensível em português.
- source_word: τῇ ἀστραπῇ
  choice: com seu brilho
  rationale: ἀστραπή pode indicar relâmpago, clarão ou brilho. Como a lamparina é o sujeito, “com seu brilho” comunica naturalmente sua luz radiante sem sugerir relâmpago literal.
- source_word: φωτίζῃ σε
  choice: ilumina você
  rationale: Preserva o objeto pessoal explícito σε e oferece leitura natural no português brasileiro, sem alterar a metáfora.
theological_decisions:
- issue: Força metafórica de “corpo” e “luz” no ensino de Jesus
  choice: Conservar as imagens de corpo, luz e escuridão sem explicá-las doutrinariamente.
  alternative: Parafrasear “corpo” como pessoa, vida interior, alma ou condição espiritual.
  rationale: O texto permanece ligado à imagem precedente do olho como lamparina do corpo. Explicitar uma aplicação espiritual ou moral resolveria uma tensão que o próprio versículo deixa em forma metafórica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Lamparina” preserva o objeto concreto antigo; “ilumina você” evita ambiguidade pronominal. A formulação conserva a metáfora e a estrutura condicional, com leve ajuste idiomático na repetição de φωτεινόν.
