source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: pt
  text: Mas, se eu expulso os demônios por Belzebu, por quem os filhos de vocês os expulsam?[a] Por isso, eles mesmos serão os juízes de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que meio os filhos de vocês os expulsam?” ou “Por que poder os filhos de vocês os expulsam?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: δέ introduz um contraste moderado na continuação da refutação de Jesus; “Mas, se” preserva naturalmente essa força argumentativa.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome explícito contribui para o contraste do argumento e é mantido em português.
- source_word: ἐν Βεελζεβοὺλ
  choice: por Belzebu
  rationale: Neste contexto, ἐν tem sentido instrumental ou de agência. “Por Belzebu” comunica isso sem acrescentar a expressão interpretativa “pelo poder de”.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: expulso os demônios
  rationale: “Expulsar” é a forma corrente e digna de expressar ἐκβάλλω em contexto de exorcismo; “os demônios” preserva o referente definido.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: os filhos de vocês
  rationale: Mantém o sentido formal de υἱοί sem decidir se a expressão designa discípulos, seguidores ou membros do povo dos interlocutores.
- source_word: ἐν τίνι
  choice: por quem
  rationale: A pergunta solicita a agência ou o meio, e “por quem” mantém o paralelo retórico com “por Belzebu”. A alternativa impessoal permanece em nota.
- source_word: ἐκβάλλουσιν
  choice: os expulsam
  rationale: Repete naturalmente o sentido de ἐκβάλλω; o pronome “os” retoma “os demônios”.
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo claro e atual a conclusão inferencial introduzida pela locução grega.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: eles mesmos serão os juízes de vocês
  rationale: “Eles mesmos” preserva a ênfase do pronome explícito αὐτοί, que é natural e significativa em português.
theological_decisions:
- issue: Identidade de “os filhos de vocês”
  choice: Manter a expressão literal “os filhos de vocês”.
  alternative: “os seguidores de vocês”, “os discípulos de vocês” ou “os seus compatriotas”
  rationale: O grego não identifica explicitamente o grupo além de chamá-lo de “filhos” dos interlocutores. A tradução preserva essa abertura interpretativa.
- issue: Agência ou poder na pergunta ἐν τίνι
  choice: “por quem”
  alternative: “por que meio” ou “por que poder”
  rationale: O paralelo com Belzebu favorece uma referência pessoal, mas a forma grega também pode perguntar pelo meio ou poder; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Belzebu” segue a forma tradicional e corrente do nome em português. A colocação de “eles mesmos” preserva a ênfase grega sem soar artificial.
