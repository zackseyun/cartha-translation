  source_fidelity: 'O texto traduz todos os elementos do grego fornecido: a introdução narrativa, a condição geral («Quando vocês orarem»), a instrução («digam»), o vocativo simples «Pai» e as duas petições. Não acrescenta «nosso» nem harmoniza indevidamente com Mateus 6:9. «Seja santificado o teu nome» preserva de modo conciso a forma passiva e peticionária de ἁγιασθήτω, e «Venha o teu Reino» transmite adequadamente ἐλθέτω ἡ βασιλεία σου.'
