id: LUK.11.2
reference: Luke 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: pt
  text: 'E ele lhes disse: “Quando vocês orarem, digam: ‘Pai, seja santificado o teu nome. Venha o teu Reino.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Quando vocês orarem
  rationale: A construção introduz uma condição temporal geral. Em português corrente, o futuro do subjuntivo expressa naturalmente a ação habitual ou recorrente sem forçar a ideia de repetição.
- source_word: λέγετε
  choice: digam
  rationale: O imperativo presente instrui os discípulos sobre como orar; o imperativo simples é natural e suficiente em português.
- source_word: Πάτερ
  choice: Pai
  rationale: O vocativo grego traz apenas “Pai”; não se acrescenta “nosso”, que pertence ao paralelo de Mateus 6:9 e a parte da tradição litúrgica.
- source_word: ἁγιασθήτω
  choice: seja santificado
  rationale: O imperativo aoristo passivo é preservado como petição. “Seja santificado” é uma formulação digna, inteligível e consolidada, sem explicitar além do texto se o foco é reconhecimento, honra ou ação divina.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Mantém a expressão bíblica literal, que abrange a identidade revelada, a reputação e a honra de Deus sem desenvolver esses sentidos no corpo do texto.
- source_word: ἐλθέτω
  choice: Venha
  rationale: O imperativo de terceira pessoa transmite de modo direto e idiomático a força de petição do grego.
- source_word: ἡ βασιλεία σου
  choice: o teu Reino
  rationale: “Reino” conserva a linguagem bíblica tradicional e pode abranger tanto o governo régio de Deus quanto sua manifestação escatológica.
theological_decisions:
- issue: Forma de dirigir-se a Deus sem pronome possessivo
  choice: Pai
  alternative: Pai nosso
  rationale: Segue-se Πάτερ no texto grego fornecido, sem harmonização com Mateus 6:9 ou com formas litúrgicas posteriores.
- issue: Sentido de ἁγιασθήτω τὸ ὄνομά σου
  choice: seja santificado o teu nome
  alternative: seja reconhecido como santo o teu nome
  rationale: A redação preserva a voz passiva e a concisão da petição, mantendo aberta a tensão entre a santidade intrínseca do nome de Deus e seu reconhecimento e honra entre as pessoas.
- issue: Amplitude semântica de βασιλεία
  choice: Reino
  alternative: reinado
  rationale: “Reino” mantém tanto a dimensão dinâmica do governo de Deus quanto a dimensão escatológica, sem reduzir o termo a apenas uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural explícito e “teu” na oração dirigida diretamente a Deus, combinação natural em uso brasileiro amplo. A ordem “seja santificado o teu nome” conserva o tom solene e a estrutura enfática da petição.
