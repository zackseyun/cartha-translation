  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: pt
  text: Mas outros, para pô-lo à prova, pediam-lhe um sinal vindo do céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sinal celestial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: outros
  rationale: Contrasta este grupo com os interlocutores anteriores, de modo natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Expressa a leve transição adversativa presente no contexto.
- source_word: πειράζοντες
  choice: para pô-lo à prova
  rationale: Comunica a intenção hostil de testar Jesus e torna explícita a relação circunstancial do particípio.
- source_word: σημεῖον
  choice: um sinal
  rationale: Preserva o termo amplo do grego sem explicitar indevidamente que se trata de um milagre.
- source_word: ἐξ οὐρανοῦ
  choice: vindo do céu
  rationale: Indica de maneira natural a origem celestial do sinal.
- source_word: ἐζήτουν
  choice: pediam-lhe
  rationale: No contexto de uma exigência dirigida a Jesus, traduz idiomaticamente a ação durativa ou repetida do imperfeito.
- source_word: παρ’ αὐτοῦ
  choice: -lhe
  rationale: O pronome ligado a «pediam» preserva Jesus como a pessoa a quem o pedido era dirigido, evitando a repetição pouco natural de «de».
theological_decisions:
- issue: Natureza do sinal solicitado
  choice: um sinal vindo do céu
  alternative: um sinal celestial
  rationale: A formulação preserva a ideia de origem ou autenticação celestial sem definir mais precisamente a natureza do sinal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste, a intenção hostil e a origem celestial do sinal sem sobrecarregar a frase.
