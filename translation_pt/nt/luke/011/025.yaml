  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: pt
  text: E quando chega, encontra a casa varrida e posta em ordem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “varrida e adornada”.'
    reason: Alternativa lexical para κεκοσμημένον, que também pode indicar ornamentação ou embelezamento.
lexical_decisions:
- source_word: ἐλθὸν
  choice: quando chega
  rationale: O particípio aoristo de ἔρχομαι é expresso temporalmente em português natural e retoma o espírito impuro do versículo anterior.
- source_word: εὑρίσκει
  choice: encontra
  rationale: O presente do indicativo conserva a vivacidade narrativa do grego.
- source_word: σεσαρωμένον
  choice: varrida
  rationale: O particípio perfeito passivo descreve a casa como já varrida e ainda nesse estado, sem acrescentar explicitamente a ideia de 'limpa'.
- source_word: κεκοσμημένον
  choice: posta em ordem
  rationale: No contexto doméstico, κοσμέω indica organização ou arranjo; a expressão também preserva o estado resultante do perfeito.
theological_decisions:
- issue: Referente do objeto implícito de εὑρίσκει
  choice: explicitar 'a casa'
  alternative: usar apenas 'a encontra'
  rationale: Embora o grego deixe o objeto implícito, a casa é o referente imediato no contexto. Explicitá-la evita em português a possível leitura de que o pronome retomaria uma pessoa, sem acrescentar uma interpretação teológica.
- issue: Representação do espírito impuro como sujeito
  choice: sujeito oculto em 'chega' e 'encontra'
  alternative: explicitar 'ele' ou 'o espírito'
  rationale: O português permite omitir o pronome e assim evita impor gênero pessoal ao substantivo grego neutro, mantendo clara a retomada contextual.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo dos dois particípios perfeitos e torna explícito apenas o referente exigido pela clareza idiomática.
