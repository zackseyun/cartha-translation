id: LUK.11.42
reference: Luke 11:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: pt
  text: Mas ai de vocês, fariseus! Pois dão o dízimo da hortelã, da arruda e de toda hortaliça, e passam ao largo da justiça e do amor de Deus. Era preciso praticar estas coisas, sem omitir aquelas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ai de vocês
  rationale: Mantém a fórmula profética de denúncia e advertência em português corrente e digno.
- source_word: ἀποδεκατοῦτε
  choice: dão o dízimo
  rationale: Expressa com naturalidade a ação de separar e entregar a décima parte.
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: da hortelã, da arruda e de toda hortaliça
  rationale: Identifica as duas plantas mencionadas e traduz λάχανον pelo sentido abrangente de plantas comestíveis cultivadas em horta.
- source_word: παρέρχεσθε
  choice: passam ao largo
  rationale: Conserva a imagem de passar por algo sem lhe dar a devida atenção, em vez de reduzi-la simplesmente a 'negligenciar'.
- source_word: τὴν κρίσιν
  choice: a justiça
  rationale: No contexto ético, κρίσις aponta para juízo justo ou justiça; 'justiça' é claro e idiomático.
- source_word: ταῦτα ... κἀκεῖνα
  choice: estas coisas ... aquelas
  rationale: 'Preserva a contraposição demonstrativa do grego: justiça e amor de Deus são prioritários, sem que a prática anterior seja omitida.'
- source_word: μὴ παρεῖναι
  choice: sem omitir
  rationale: Comunica de modo conciso a ideia de não deixar de lado ou negligenciar as demais obrigações.
theological_decisions:
- issue: Sentido de ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  alternative: o amor por Deus / o amor que vem de Deus
  rationale: O genitivo grego pode admitir mais de uma relação semântica. A formulação tradicional e natural 'amor de Deus' preserva a ambiguidade em vez de decidir entre o amor dirigido a Deus e o amor procedente dele.
- issue: Relação entre justiça, amor e dízimo
  choice: Era preciso praticar estas coisas, sem omitir aquelas
  alternative: Vocês deveriam ter praticado estas coisas e não negligenciado aquelas
  rationale: 'Mantém a tensão do texto: Jesus afirma a necessidade da justiça e do amor de Deus sem apresentar o dízimo mencionado como algo a ser simplesmente abandonado.'
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. O tom permanece solene e profético sem recorrer a formas arcaicas; 'vocês' torna a interpelação plural inequívoca.
