  naturalness: O registro é moderno e claro. «Depois de entrarem, moram ali» é natural, preserva a relação temporal do particípio e evita o valor ingressivo adicional de «passam a morar».
  terminology: «Espíritos», «malignos» e «daquele homem» são escolhas adequadas. «Malignos» mantém o caráter hostil sem acrescentar «demônios» ou «espíritos impuros».
