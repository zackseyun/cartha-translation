source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: pt
  text: Então ele vai e leva consigo sete outros espíritos mais malignos do que ele próprio[a]; e eles, depois de entrarem, moram ali[b]. A condição final daquele homem se torna pior do que a inicial[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais perversos do que ele próprio».'
    reason: lexical_alternative
  - marker: b
    text: O grego traz «depois de entrarem» por meio de um particípio no plural, mas o verbo «mora» está no singular no texto transmitido. O plural em português segue o particípio e o sentido coletivo dos espíritos.
    reason: textual_ambiguity
  - marker: c
    text: Literalmente, «as últimas coisas daquele homem se tornam piores do que as primeiras»; isto é, sua condição posterior fica pior que a anterior.
    reason: idiom_explanation
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência da ação de maneira direta e natural em português.
- source_word: πορεύεται
  choice: vai
  rationale: Expressa o movimento do espírito com simplicidade, preservando o presente narrativo do grego.
- source_word: παραλαμβάνει
  choice: leva consigo
  rationale: O verbo indica tomar outros para acompanhá-lo, sentido mais preciso do que apenas «leva».
- source_word: ἕτερα πνεύματα
  choice: outros ... espíritos
  rationale: Mantém o substantivo não qualificado do versículo; o caráter hostil é expresso pelo comparativo seguinte.
- source_word: πονηρότερα ἑαυτοῦ
  choice: mais malignos do que ele mesmo
  rationale: Preserva a comparação com o espírito que retorna. «Malignos» comunica maldade ativa sem acrescentar a designação «demônios».
- source_word: εἰσελθόντα
  choice: Eles entram
  rationale: O particípio está no neutro plural e retoma os espíritos; a forma finita produz português corrente sem perder a progressão da ação.
- source_word: κατοικεῖ ἐκεῖ
  choice: passam a morar ali
  rationale: «Morar» comunica residência estável, e «passam a» dá valor ingressivo adequado após a entrada. A discrepância de número no grego é registrada em nota.
- source_word: τὰ ἔσχατα ... τῶν πρώτων
  choice: a condição final ... do que a inicial
  rationale: Traduz idiomaticamente os plurais substantivados, deixando claro o contraste entre o estado posterior e o anterior.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: daquele homem
  rationale: Refere-se ao indivíduo masculino da ilustração e conserva a especificidade do grego.
theological_decisions:
- issue: Identificação dos espíritos como demônios ou espíritos impuros
  choice: espíritos
  alternative: demônios; espíritos impuros
  rationale: Embora o contexto identifique o primeiro como espírito impuro, neste versículo o grego diz apenas «espíritos». A tradução evita inserir uma qualificação ausente, enquanto «mais malignos» deixa evidente seu caráter.
- issue: Referência a ἄνθρωπος
  choice: daquele homem
  alternative: daquela pessoa
  rationale: Na ilustração, o termo aponta para um indivíduo apresentado no masculino; a tradução mantém essa forma sem transformar a afirmação em abstração genérica.
- issue: Concordância entre εἰσελθόντα e κατοικεῖ
  choice: plural no texto corrente, com nota explicativa
  alternative: «depois de entrarem, ele mora ali»
  rationale: O particípio plural retoma os sete outros espíritos, ao passo que o verbo finito aparece no singular no texto transmitido. O plural produz o sentido contextual mais natural, mas a nota conserva a tensão formal em vez de ocultá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Leva consigo», «passam a morar» e «condição final» evitam arcaísmos sem tornar o tom coloquial. Os marcadores aparecem no texto em ordem e as notas preservam tanto a alternativa lexical quanto a irregularidade de concordância do grego.
