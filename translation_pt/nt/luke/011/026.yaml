    rationale: O grego exprime «sete outros espíritos». Em português, «outros sete» pode ser lido como «mais sete»; «sete outros» deixa mais nítido que são espíritos distintos do espírito que vai buscá-los.
  - severity: medium
    issue: A nota b descreve imprecisamente o verbo singular
    rationale: A formulação «o verbo traduzido por “passam a morar” está no singular» pode dar a entender que o verbo português está no singular. É preciso especificar que κατοικεῖ, no grego transmitido pela SBLGNT, está no singular, enquanto εἰσελθόντα está no plural.
  - severity: low
    issue: «Passam a morar» acrescenta nuance ingressiva
    rationale: κατοικεῖ significa «mora/habita». A entrada já é expressa pelo particípio; «passam a» introduz uma nuance de início de estado que não é necessária.
