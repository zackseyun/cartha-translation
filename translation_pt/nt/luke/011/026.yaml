revisions:
- from: Então ele vai e leva consigo outros sete espíritos mais malignos do que ele mesmo[a]. Eles entram e passam a morar ali[b], e a condição final daquele homem se torna pior do que a inicial[c].
  to: Então ele vai e leva consigo sete outros espíritos mais malignos do que ele próprio[a]; e eles, depois de entrarem, moram ali[b]. A condição final daquele homem se torna pior do que a inicial[c].
  rationale: A revisão ajusta a ordem de «sete outros» para refletir melhor o grego e reduz uma possível ambiguidade portuguesa. Também torna explícito no texto o valor temporal do particípio e corrige a explicação da divergência formal entre o particípio plural e o verbo singular da edição grega, sem resolver essa tensão por uma interpretação doutrinária ou textual não indicada pela fonte.
