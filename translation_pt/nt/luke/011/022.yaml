id: LUK.11.22
reference: Luke 11:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: pt
  text: Mas, quando alguém mais forte do que ele vem contra ele e o vence[a], tira-lhe a armadura completa[b] em que tinha confiado e distribui os despojos dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o derrota” ou “o subjuga”.
    reason: lexical_alternative
  - marker: b
    text: “Armadura completa” traduz um termo que designa o conjunto completo do equipamento de guerra.
    reason: lexical_alternative
  - marker: c
    text: Ou “os seus espólios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Mas, quando
  rationale: Preserva a relação temporal-condicional de ἐπάν e o contraste introduzido por δέ, em português natural.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: alguém mais forte do que ele
  rationale: O comparativo substantivado não traz um substantivo explícito; “alguém” mantém essa generalidade sem acrescentar “homem” ao texto.
- source_word: ἐπελθὼν
  choice: vem contra ele
  rationale: Comunica o movimento hostil de vir sobre ou contra alguém sem explicitar além do grego a ideia de ataque militar.
- source_word: νικήσῃ αὐτόν
  choice: o vence
  rationale: Expressa de modo claro e atual a vitória concreta que resulta no desarmamento e na tomada dos bens.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: a armadura completa
  rationale: πανοπλία designa o conjunto completo de armas defensivas e ofensivas; “armadura completa” preserva essa abrangência.
- source_word: αἴρει
  choice: tira-lhe
  rationale: Representa a retirada da armadura do vencido de forma concisa e idiomática.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: em que confiava
  rationale: Mantém a referência relativa à armadura e expressa a confiança contínua ou estabelecida indicada pelo mais-que-perfeito grego.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: os seus despojos
  rationale: σκῦλα são bens tomados de um inimigo vencido; “despojos” conserva com precisão a imagem de conflito.
- source_word: διαδίδωσιν
  choice: distribui
  rationale: Traduz diretamente a ideia de repartir ou distribuir os despojos entre outros.
theological_decisions:
- issue: Se a figura mais forte deve ser identificada explicitamente como “um homem mais forte”.
  choice: alguém mais forte do que ele
  alternative: um homem mais forte do que ele
  rationale: O grego emprega o adjetivo comparativo de modo substantivado, sem repetir “homem”. A formulação escolhida preserva essa característica e deixa que o contexto anterior forneça a imagem.
- issue: A intensidade de νικάω na imagem de confronto.
  choice: o vence
  alternative: o derrota; o subjuga
  rationale: “Vence” preserva o sentido básico e a consequência concreta narrada no versículo, sem impor uma nuance adicional de domínio prolongado ou uma identificação teológica explícita das figuras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. A construção “tira-lhe” é corrente em registro bíblico moderado e evita ambiguidade sobre quem perde a armadura. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
