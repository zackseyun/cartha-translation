id: LUK.11.10
reference: Luke 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: pt
  text: Pois todo aquele que pede recebe, quem busca encontra, e a quem bate, a porta será aberta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mantendo o elemento não expresso no grego: “a quem bate, será aberto”. O contexto sugere uma porta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ αἰτῶν
  choice: Pois todo aquele que pede
  rationale: “Pois” preserva a função explicativa de γάρ, ligando a afirmação à exortação anterior; “todo aquele que pede” expressa de modo natural o sentido distributivo e genérico da construção participial.
- source_word: λαμβάνει
  choice: recebe
  rationale: Equivalente direto e digno, adequado ao contexto de pedido e resposta.
- source_word: ὁ ζητῶν εὑρίσκει
  choice: quem busca encontra
  rationale: Reproduz com concisão a ação genérica e preserva o paralelismo proverbial.
- source_word: τῷ κρούοντι
  choice: a quem bate
  rationale: Mantém o complemento dativo da forma passiva e evita acrescentar explicitamente “à porta”, embora isso seja sugerido pelo contexto.
- source_word: ἀνοιγήσεται
  choice: será aberto
  rationale: Preserva o futuro passivo e deixa sem expressão aquilo que será aberto, assim como no grego.
theological_decisions:
- issue: Alcance e força da promessa universal
  choice: Apresentar a declaração como máxima universal, sem qualificações acrescentadas.
  alternative: Interpretá-la como hipérbole ou inserir condições como “quem pede corretamente”.
  rationale: O grego formula a promessa sem qualificações explícitas. A tradução preserva essa amplitude e a tensão teológica do texto, sem importar condições doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo conciso do grego foi preservado. A formulação menos usual “a quem bate será aberto” mantém deliberadamente a passiva e a ausência do objeto, esclarecidas na nota.
