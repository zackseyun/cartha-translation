id: LUK.11.41
reference: Luke 11:41
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: pt
  text: Mas deem como esmola as coisas que estão dentro[a], e eis que tudo está limpo para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deem como esmola aquilo que vocês têm”. A expressão grega pode referir-se tanto ao que está dentro quanto aos bens que alguém tem à disposição.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz uma correção em contraste com a limpeza exterior mencionada no contexto anterior.
- source_word: τὰ ἐνόντα
  choice: as coisas que estão dentro
  rationale: Preserva de modo natural a forma e a ambiguidade do grego, além de manter o contraste contextual entre o exterior e o interior; a possível referência ao que se possui é registrada em nota.
- source_word: δότε
  choice: deem
  rationale: Imperativo claro e corrente, sem atribuir ao aspecto verbal uma nuance não explicitada.
- source_word: ἐλεημοσύνην
  choice: como esmola
  rationale: Expressa a oferta caridosa indicada pelo substantivo e permite reproduzir a construção grega sem acrescentar explicitamente um destinatário.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Conserva a ênfase retórica e introduz o resultado de maneira digna e compreensível.
- source_word: πάντα
  choice: tudo
  rationale: Equivalente português idiomático e abrangente do plural neutro.
- source_word: καθαρὰ
  choice: limpo
  rationale: Mantém a ligação lexical com a discussão contextual sobre limpeza e pureza.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa naturalmente o dativo de referência ou vantagem em português amplamente compreensível.
theological_decisions:
- issue: Sentido de τὰ ἐνόντα em relação à pureza e à esmola
  choice: 'Sentido interior: “as coisas que estão dentro”'
  alternative: “aquilo que vocês têm”, em referência aos bens disponíveis
  rationale: O contexto imediato contrapõe o exterior e o interior do copo e do prato (Lucas 11:39), favorecendo o sentido interior sem eliminar a alternativa lexical ligada às posses; essa tensão é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” mantém a força retórica do original; “esmola” é empregado em seu sentido bíblico de oferta caridosa.
