id: LUK.11.24
reference: Luke 11:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: pt
  text: 'Quando o espírito impuro sai do homem, passa por lugares sem água[a], procurando descanso; e, não o encontrando, diz: “Voltarei para a minha casa, de onde saí.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lugares secos”. O grego se refere literalmente a lugares sem água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ... ἐξέλθῃ
  choice: Quando ... sai
  rationale: A construção introduz uma situação geral. O presente em português expressa isso com naturalidade, sem perder o valor temporal e condicional do grego.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: o espírito impuro
  rationale: Expressão clara e corrente para um espírito associado à impureza; mantém o caráter pessoal do agente no contexto.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: do homem
  rationale: Preserva o substantivo masculino singular do texto e seu uso como caso representativo.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: passa por lugares sem água
  rationale: Mantém diretamente a imagem de regiões desprovidas de água. A alternativa tradicional 'lugares secos' é registrada em nota.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: procurando descanso
  rationale: Reproduz com naturalidade o particípio e a ideia de buscar repouso.
- source_word: καὶ μὴ εὑρίσκον
  choice: e, não o encontrando
  rationale: O pronome retoma explicitamente 'descanso', implícito como objeto no grego.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Voltarei para a minha casa
  rationale: Conserva tanto a resolução futura quanto a imagem concreta da casa, retomada no versículo seguinte.
- source_word: ὅθεν ἐξῆλθον
  choice: de onde saí
  rationale: Forma idiomática e concisa que mantém a referência ao lugar de onde o espírito saiu.
theological_decisions:
- issue: Natureza do 'espírito impuro'
  choice: Mantido como agente pessoal que sai, procura, fala e volta.
  alternative: Entendê-lo apenas como metáfora de recaída moral ou como força impessoal.
  rationale: A gramática e o contexto narrativo apresentam o espírito como agente pessoal; a tradução não deve reduzir essa apresentação a uma interpretação metafórica.
- issue: Sentido de ἀνθρώπου
  choice: homem
  alternative: pessoa ou alguém
  rationale: O original emprega um substantivo masculino singular em um exemplo representativo. A escolha preserva essa forma sem restringir explicitamente a aplicação do ensino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação favorece a fluidez sem alterar a sequência lógica do grego; a fala direta mantém a vivacidade do presente narrativo.
