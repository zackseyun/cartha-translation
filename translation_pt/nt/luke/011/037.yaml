base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: pt
  text: Enquanto ele falava, um fariseu lhe pede que faça uma refeição com ele[a]. Então ele entrou e reclinou-se à mesa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomar o desjejum” ou “fazer uma refeição pela manhã”. O verbo grego pode indicar uma refeição feita mais cedo no dia, mas aqui pode ter sentido mais geral.
    reason: lexical_alternative
  - marker: b
    text: Isto é, reclinou-se na postura habitual para uma refeição formal.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Enquanto ele falava
  rationale: A construção ἐν + infinitivo articular expressa simultaneidade. A formulação preserva o aspecto contínuo e soa natural em português.
- source_word: ἐρωτᾷ
  choice: lhe pede
  rationale: O verbo significa pedir ou solicitar; o teor de convite decorre da oração seguinte. O presente histórico foi mantido para conservar a vivacidade narrativa do grego.
- source_word: Φαρισαῖος
  choice: um fariseu
  rationale: O substantivo singular sem artigo é expresso naturalmente com o artigo indefinido em português.
- source_word: ὅπως ἀριστήσῃ
  choice: que faça uma refeição
  rationale: ἀριστάω pode designar uma refeição matinal ou ao meio-dia, mas o contexto não exige precisar o horário. A expressão geral evita acrescentar uma informação incerta.
- source_word: παρ’ αὐτῷ
  choice: com ele
  rationale: Traduz de perto a ideia de estar ou comer com o fariseu, sem explicitar uma casa que o texto apenas pode pressupor.
- source_word: εἰσελθὼν
  choice: ele entrou
  rationale: O particípio aoristo indica uma ação anterior à de reclinar-se e é vertido com naturalidade como verbo finito.
- source_word: ἀνέπεσεν
  choice: reclinou-se à mesa
  rationale: O verbo descreve a postura costumeira de reclinar-se para comer, e não simplesmente sentar-se.
