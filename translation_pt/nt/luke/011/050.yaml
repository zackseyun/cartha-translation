source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: pt
  text: para que o sangue de todos os profetas, derramado desde a fundação do mundo, seja cobrado[a] desta geração,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja exigido desta geração”. O verbo tem o sentido de chamar alguém a prestar contas pelo sangue derramado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Preserva de modo natural a força de propósito ou resultado da conjunção em relação ao contexto anterior.
- source_word: ἐκζητηθῇ
  choice: seja cobrado
  rationale: 'O passivo de ἐκζητέω tem aqui sentido judicial: exigir prestação de contas pelo sangue derramado. “Seja cobrado” mantém a imagem do texto e comunica responsabilização em português corrente.'
- source_word: τὸ αἷμα
  choice: o sangue
  rationale: Mantém o termo concreto do grego, empregado metonimicamente para o homicídio e a culpa decorrente dele, sem explicitar além do texto.
- source_word: πάντων τῶν προφητῶν
  choice: de todos os profetas
  rationale: Reproduz diretamente a construção genitiva e preserva o alcance abrangente de πάντων.
- source_word: τὸ ἐκκεχυμένον
  choice: derramado
  rationale: O particípio perfeito passivo modifica “sangue”; “sangue derramado” é a expressão portuguesa natural e conserva o aspecto de uma ação passada com efeito presente.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: Expressão bíblica clara e reconhecível, que preserva tanto a preposição temporal quanto a imagem de καταβολή.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: desta geração
  rationale: Com o passivo “seja cobrado”, identifica de maneira concisa e natural aqueles de quem se exige a prestação de contas.
theological_decisions:
- issue: Natureza da cobrança do sangue dos profetas
  choice: Responsabilização judicial desta geração pelo sangue acumulado dos profetas
  alternative: Uma afirmação apenas retórica de continuidade histórica, sem forte sentido judicial
  rationale: Nesse contexto, ἐκζητέω aplicado ao sangue indica prestação de contas ou cobrança judicial. A tradução conserva essa força sem definir além do versículo como funciona a responsabilidade coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, enquanto “seja cobrado desta geração” oferece uma formulação natural sem eliminar a imagem concreta do sangue.
