id: LUK.11.35
reference: Luke 11:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: pt
  text: Portanto, tenha cuidado para que a luz que há em você não seja escuridão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Portanto, veja bem se a luz que há em você não é escuridão.”'
    reason: Alternativa lexical e sintática que reflete mais diretamente σκόπει e o indicativo ἐστίν.
lexical_decisions:
- source_word: σκόπει
  choice: tenha cuidado
  rationale: O imperativo presente, na segunda pessoa do singular, expressa uma advertência que pede atenção contínua. “Tenha cuidado” é natural em português e preserva a força de alerta.
- source_word: οὖν
  choice: portanto
  rationale: Assinala uma conclusão decorrente do ensino anterior sobre o olho e a luz, mantendo explícita a conexão lógica.
- source_word: μὴ
  choice: para que... não
  rationale: Com o imperativo, introduz a situação indesejável contra a qual se adverte. Esta construção é clara e idiomática em português moderno.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Tradução direta que conserva a metáfora e não a restringe a consciência, entendimento ou condição espiritual.
- source_word: τὸ ἐν σοὶ
  choice: que há em você
  rationale: Forma natural de expressar a luz situada “em você”, sem definir de modo indevido a natureza dessa interioridade.
- source_word: σκότος
  choice: escuridão
  rationale: Preserva o contraste metafórico imediato entre luz e escuridão e sua amplitude moral e espiritual.
- source_word: ἐστίν
  choice: seja
  rationale: O subjuntivo é exigido pela construção portuguesa “para que... não” e transmite adequadamente a advertência, embora o grego empregue o indicativo.
theological_decisions:
- issue: Sentido metafórico de “luz” e “escuridão”
  choice: Conservar a metáfora sem especificar seu referente doutrinário.
  alternative: Traduzir “luz” como entendimento, consciência ou iluminação interior.
  rationale: A formulação grega mantém ampla a imagem, em conexão com o ensino anterior sobre percepção e condição interior. Uma explicitação restringiria uma ambiguidade significativa do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” corresponde ao destinatário singular do grego. A formulação preserva o paradoxo entre luz e escuridão.
