reference: Luke 11:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: pt
  text: 'Mas o Senhor lhe disse: “Agora vocês, fariseus, limpam o lado de fora do copo e do prato, mas o interior de vocês está cheio de ganância[a] e maldade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “roubo”, “saque” ou “extorsão”.
    reason: Alternativas lexicais para ἁρπαγή, que pode indicar tanto avidez predatória quanto apropriação violenta ou exploradora.
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título cristológico usual no Novo Testamento e corresponde ao uso definido do grego, sem reduzi-lo a uma mera forma de tratamento.
- source_word: Νῦν
  choice: Agora
  rationale: Preserva o marcador discursivo que introduz a repreensão incisiva de Jesus.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: vocês, fariseus
  rationale: A construção conserva a ênfase do pronome e identifica diretamente o grupo interpelado, com pontuação natural em português.
- source_word: τὸ ἔξωθεν
  choice: o lado de fora
  rationale: Expressão corrente e concreta para a superfície exterior dos utensílios.
- source_word: ποτηρίου
  choice: copo
  rationale: Equivalente comum e acessível para ποτήριον neste contexto doméstico.
- source_word: πίνακος
  choice: prato
  rationale: Termo moderno de ampla compreensão; o grego também pode designar uma travessa.
- source_word: καθαρίζετε
  choice: limpam
  rationale: O presente expressa a prática característica dos fariseus e mantém a imagem concreta de limpeza.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: mas o interior de vocês
  rationale: Preserva a passagem deliberada da parte externa dos utensílios para a condição interior das pessoas, sem interpretar o referente como coração ou mente.
- source_word: γέμει
  choice: está cheio de
  rationale: Equivalente idiomático do verbo γέμω com os complementos no genitivo.
- source_word: ἁρπαγῆς
  choice: ganância
  rationale: Comunica a cobiça rapace como vício interior no contexto; uma nota conserva os sentidos mais concretos de apropriação violenta ou exploradora.
- source_word: πονηρίας
  choice: maldade
  rationale: Expressa de modo claro e grave a corrupção moral abrangente indicada pelo termo.
theological_decisions:
- issue: Referente metafórico de τὸ ἔσωθεν ὑμῶν
  choice: o interior de vocês
  alternative: o coração de vocês; o íntimo de vocês
  rationale: A tradução mantém o contraste entre limpeza exterior e corrupção interior sem especificar uma faculdade psicológica que o texto grego não nomeia.
- issue: Sentido moral de ἁρπαγή
  choice: ganância no texto, com alternativas concretas em nota
  alternative: roubo; saque; extorsão
  rationale: O contexto aponta para uma disposição moral interior, mas o campo lexical também envolve obtenção predatória; a nota preserva essa tensão sem sobrecarregar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma “vocês” evita regionalismo excessivo; “o interior de vocês” conserva a metáfora grega e a tensão entre pureza externa e corrupção interna.
