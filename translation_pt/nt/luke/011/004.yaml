  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: pt
  text: E perdoa-nos os nossos pecados, pois nós mesmos também perdoamos a todo aquele que nos deve[a]. E não nos leves à tentação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a todo aquele que está em dívida conosco”. O grego emprega aqui linguagem de dívida, embora a primeira oração diga “pecados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “provação” ou “prova”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: perdoa
  rationale: No contexto de oração, o imperativo de ἀφίημι tem naturalmente o sentido de conceder perdão; “perdoa” é direto e idiomático.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: os nossos pecados
  rationale: ἁμαρτίας significa explicitamente “pecados”, preservando a diferença em relação à linguagem de dívida na oração seguinte.
- source_word: καὶ γὰρ αὐτοὶ
  choice: pois nós mesmos também
  rationale: “Pois” expressa a relação explicativa de καὶ γὰρ; “nós mesmos” conserva a ênfase de αὐτοὶ, e “também” representa o valor aditivo de καί.
- source_word: ἀφίομεν
  choice: perdoamos
  rationale: Mantém o vínculo lexical com ἄφες e comunica naturalmente a liberação de uma dívida interpessoal em sentido moral.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: a todo aquele que nos deve
  rationale: Preserva a linguagem de dívida de ὀφείλω sem a formulação pouco natural “todo devedor nosso”; deixa aberta a relação metafórica entre dívida e ofensa.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: não nos introduzas em tentação
  rationale: “Introduzir em” representa de perto o movimento expresso por εἰσφέρω e evita substituir o verbo por “guiar”; “tentação” é uma leitura natural de πειρασμός, cuja amplitude é indicada em nota.
theological_decisions:
- issue: Sentido da petição referente a πειρασμός
  choice: não nos introduzas em tentação
  alternative: não nos introduzas em provação
  rationale: A formulação mantém a tensão do grego sem acrescentar uma explicação doutrinária sobre a relação de Deus com a tentação. A nota registra o sentido alternativo de prova ou provação.
- issue: Relação entre pecados e dívidas
  choice: pecados na primeira oração e linguagem de dívida na segunda
  alternative: uniformizar ambas as orações como pecados ou dívidas
  rationale: Lucas usa ἁμαρτίας na primeira oração e ὀφείλοντι na segunda; conservar a mudança lexical evita apagar a metáfora e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “perdoa-nos” e “não nos introduzas” preserva o tom de oração sem recorrer a vocabulário arcaico. A repetição de “E” acompanha a coordenação do grego.
