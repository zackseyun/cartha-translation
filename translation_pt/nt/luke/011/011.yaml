  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: pt
  text: Qual de vocês que é pai, se seu filho lhe pedir um peixe, dará a ele uma cobra[a] em vez de um peixe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma serpente».
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Qual de vocês, sendo pai
  rationale: Expressa de modo natural em português a pergunta retórica sobre qual pessoa entre os ouvintes, na condição de pai, agiria assim.
- source_word: αἰτήσει
  choice: se ... pedir
  rationale: O futuro grego integra uma situação hipotética; em português, a construção com «se» e futuro do subjuntivo comunica naturalmente essa força.
- source_word: ὁ υἱὸς
  choice: o filho
  rationale: O artigo tem sentido relacional e genérico no contexto; «o filho» preserva isso sem precisar acrescentar um possessivo.
- source_word: ἰχθύν / ἰχθύος
  choice: um peixe / o peixe
  rationale: Mantém o exemplo concreto no singular; na segunda ocorrência, o artigo definido é natural porque retoma o peixe já mencionado.
- source_word: ἀντὶ
  choice: em vez de
  rationale: Comunica claramente a ideia de substituição em português corrente.
- source_word: ὄφιν
  choice: uma cobra
  rationale: «Cobra» é a designação moderna, comum e clara para ὄφις neste contexto; «serpente» permanece como alternativa lexical possível.
- source_word: αὐτῷ ἐπιδώσει
  choice: dará a ele
  rationale: Traduz o ato de dar ou entregar e mantém explicitamente o beneficiário, como no grego.
