source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: pt
  text: 'Mas ele disse: “Antes, felizes são os que ouvem a palavra de Deus e a guardam.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sim, antes, felizes são...” ou “De fato, felizes são...”. A partícula grega pode confirmar o que foi dito e, ao mesmo tempo, redirecionar a ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Sim, antes
  rationale: A partícula afirma o que foi dito e, ao mesmo tempo, redireciona a ênfase para a verdadeira base da felicidade; esta formulação preserva ambas as nuances sem sugerir uma rejeição brusca.
- source_word: μακάριοι
  choice: felizes
  rationale: Em português bíblico corrente, “felizes” comunica de modo natural a condição favorável declarada por Deus, sem reduzi-la necessariamente a uma emoção passageira.
- source_word: οἱ ἀκούοντες
  choice: os que ouvem
  rationale: Expressão natural que representa o particípio presente substantivado e seu sentido característico ou contínuo.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Preserva a amplitude de λόγος como mensagem ou revelação divina e mantém a ressonância bíblica tradicional.
- source_word: φυλάσσοντες
  choice: a guardam
  rationale: “Guardar” conserva a amplitude de φυλάσσω, incluindo acolher, conservar e observar na prática, sem restringi-lo apenas à obediência a regras.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Mas ele disse
  rationale: “Mas” expressa o contraste moderado introduzido por δέ, enquanto “disse” permanece próximo de εἶπεν.
theological_decisions:
- issue: Força da resposta de Jesus à declaração de bênção da mulher
  choice: Jesus acolhe em certa medida a declaração anterior, mas redireciona a ênfase para a felicidade dos que ouvem e guardam a palavra de Deus.
  alternative: Jesus rejeita categoricamente a declaração da mulher; ou simplesmente acrescenta outra bem-aventurança sem corrigi-la.
  rationale: Μενοῦν pode combinar afirmação e correção ou intensificação. “Sim, antes” preserva essa tensão e não decide além do que a partícula permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita tanto uma oposição excessivamente dura quanto a perda da nuance corretiva. O pronome em “a guardam” retoma naturalmente “a palavra de Deus”.
