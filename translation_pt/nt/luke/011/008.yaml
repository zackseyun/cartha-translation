id: LUK.11.8
reference: Luke 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: pt
  text: 'Eu lhes digo: mesmo que ele não se levante para lhe dar coisa alguma por ser seu amigo, ainda assim, por causa da insistência descarada dele[a], ele se levantará e lhe dará tudo de que precisa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da ousadia dele”, “por causa da importunação dele” ou, mais literalmente, “por causa da falta de vergonha dele”. O pronome “dele” não identifica explicitamente a qual dos dois homens se refere.
    reason: Alternativas lexicais e preservação da possível ambiguidade do pronome grego.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Eu lhes digo
  rationale: Fórmula introdutória direta e natural em português, mantendo o endereço plural aos ouvintes.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ
  choice: mesmo que ele não ... lhe dar
  rationale: “Mesmo que” conserva a força concessiva e condicional de εἰ καί sem transformar a afirmação em uma concessão puramente factual.
- source_word: ἀναστὰς
  choice: se levante
  rationale: No cenário doméstico, o verbo indica levantar-se, provavelmente da cama; esta é a expressão corrente em português.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: por ser seu amigo
  rationale: Mantém a causa e a relação pessoal expressas no grego, sem substituí-las pela abstração “por causa da amizade”.
- source_word: διά γε
  choice: ainda assim, por causa de
  rationale: Expressa a transição enfática entre a amizade, que não basta, e o motivo que efetivamente leva o homem a agir.
- source_word: ἀναίδειαν
  choice: insistência sem vergonha
  rationale: Preserva a ideia lexical de falta de vergonha e explicita a insistência socialmente desembaraçada que a palavra comunica neste contexto, sem reduzi-la apenas a “persistência”.
- source_word: ἐγερθεὶς
  choice: ele se levantará
  rationale: Embora venha de outro verbo grego, no contexto também descreve o ato de levantar-se para atender o visitante; a repetição é natural e clara em português.
- source_word: δῶσει αὐτῷ
  choice: lhe dará
  rationale: O pronome dativo português transmite de modo conciso o objeto indireto do grego.
- source_word: ὅσων χρῄζει
  choice: tudo de que precisa
  rationale: Comunica a totalidade dos itens necessários e reproduz o sentido abrangente da construção relativa no genitivo.
- source_word: objeto implícito após δώσει na primeira oração
  choice: coisa alguma
  rationale: O português pede um complemento natural para “dar”; sob a negação, “coisa alguma” explicita apenas o objeto já pressuposto pelo contexto.
theological_decisions:
- issue: Sentido de ἀναίδεια na parábola
  choice: insistência sem vergonha
  alternative: ousadia; importunação; falta de vergonha
  rationale: A expressão mantém a aspereza lexical da palavra grega e, ao mesmo tempo, mostra que ela caracteriza a insistência do pedido. Não transforma o texto numa aprovação geral da grosseria nem apaga a tensão retórica da parábola.
- issue: Referente do possessivo em ἀναίδειαν αὐτοῦ
  choice: dele
  alternative: daquele que pedia; do homem que estava dentro
  rationale: O pronome grego admite discussão quanto ao referente. O português conserva o pronome em vez de inserir no texto principal uma identificação interpretativa que o original não explicita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. A pontuação divide com clareza a longa estrutura concessiva, e a formulação evita linguagem denominacional.
