  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: pt
  text: Ai de vocês, porque constroem os túmulos[a] dos profetas, mas os antepassados[b] de vocês os mataram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “monumentos sepulcrais”. O termo grego pode indicar túmulos ou monumentos funerários.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pais”; aqui, no sentido de antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ai de vocês
  rationale: Preserva a força de denúncia profética de οὐαί e a dirige explicitamente aos ouvintes, em formulação corrente e digna em português.
- source_word: ὅτι
  choice: porque
  rationale: Expressa com clareza o valor causal, introduzindo a razão da denúncia.
- source_word: οἰκοδομεῖτε
  choice: constroem
  rationale: Reproduz o presente grego sem impor aspecto progressivo; é natural para a prática descrita.
- source_word: τὰ μνημεῖα
  choice: os túmulos
  rationale: Comunica de modo claro o sentido funerário usual de μνημεῖα; a possibilidade de monumentos sepulcrais é registrada em nota.
- source_word: τῶν προφητῶν
  choice: dos profetas
  rationale: Mantém diretamente a relação genitiva entre os túmulos e os profetas.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: mas foram os antepassados de vocês
  rationale: ‘Antepassados’ expressa aqui o sentido ancestral de πατέρες sem sugerir apenas os pais imediatos; ‘mas’ conserva a justaposição contrastiva marcada por δέ, e a construção focalizadora soa natural em português.
- source_word: ἀπέκτειναν αὐτούς
  choice: que os mataram
  rationale: ‘Mataram’ traduz diretamente o verbo sem acrescentar uma qualificação jurídica; ‘os’ retoma os profetas.
theological_decisions:
- issue: Explicitar ou não a hipocrisia ou cumplicidade implícita entre construir os túmulos e os antepassados terem matado os profetas
  choice: 'Manter apenas a justaposição: “constroem os túmulos dos profetas, mas foram os antepassados de vocês que os mataram”'
  alternative: Explicitar que, ao fazer isso, eles testemunham contra os antepassados ou concordam com suas ações
  rationale: O versículo apresenta os dois fatos em tensão, enquanto a inferência é desenvolvida no versículo seguinte. A tradução não antecipa essa explicação.
- issue: Relação sintática da oração sobre os antepassados
  choice: Preservar como oração coordenada contrastiva
  alternative: 'Subordinar como relativa: “os profetas que os antepassados de vocês mataram”'
  rationale: O grego apresenta uma nova oração com sujeito expresso e δέ. A coordenação conserva melhor sua estrutura e sua tensão retórica, sem ampliar o contraste além do marcador grego.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita formas regionais marcadas; “Ai de vocês” mantém o tom profético tradicional sem arcaísmo excessivo. Os marcadores aparecem junto aos termos a que se referem.
