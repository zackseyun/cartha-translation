id: LUK.11.21
reference: Luke 11:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: pt
  text: Quando o homem forte, bem armado, guarda o seu próprio pátio[a], seus bens estão em segurança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua própria residência” ou “sua própria propriedade”; a palavra grega pode designar um pátio ou a residência e o recinto ao qual ele pertence.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “estão em paz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Quando
  rationale: Introduz uma situação temporal geral; “Quando” é natural em português e adequado ao caráter ilustrativo da frase.
- source_word: ὁ ἰσχυρός
  choice: o homem forte
  rationale: O adjetivo substantivado, masculino singular e definido, designa uma pessoa forte; a expressão preserva a forma da imagem sem explicitar seu referente metafórico.
- source_word: καθωπλισμένος
  choice: bem armado
  rationale: O particípio perfeito indica o estado resultante de estar equipado com armas. “Bem armado” é natural e comunica preparação suficiente, sem tornar obrigatória a ideia quantitativa de possuir todas as armas possíveis.
- source_word: φυλάσσῃ
  choice: guarda
  rationale: Expressa vigilância contínua e proteção no cenário apresentado pela oração com ὅταν.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: o seu próprio pátio
  rationale: αὐλή pode designar um pátio e, por extensão, a residência ou o conjunto ao qual ele pertence. “Seu próprio” conserva a ênfase de ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ ἐστὶν
  choice: estão em segurança
  rationale: A expressão significa literalmente “estão em paz”, mas, aplicada aos bens guardados, comunica que permanecem seguros e sem perturbação.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: seus bens
  rationale: Designa aquilo que lhe pertence. “Bens” é claro, corrente e suficientemente amplo em português.
theological_decisions:
- issue: Força metafórica da declaração no contexto
  choice: Manter a imagem do homem forte sem identificá-lo explicitamente no versículo.
  alternative: Traduzir ou explicar no texto principal que o homem forte representa Satanás.
  rationale: O versículo apresenta a imagem, enquanto o contexto fornece sua aplicação. Explicitar o referente no texto resolveria interpretativamente algo que o grego deixa na forma de metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a metáfora concreta e traduz idiomaticamente a condição dos bens, registrando em nota a expressão literal.
