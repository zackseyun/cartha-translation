base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: pt
  text: Mas o fariseu, ao ver isso, ficou surpreso porque Jesus não tinha se lavado[a] antes da refeição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinha realizado a lavagem ritual antes da refeição”. O verbo grego é o mesmo frequentemente traduzido por “batizar”, mas aqui se refere à lavagem cerimonial ligada às práticas farisaicas de pureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca uma leve contraposição ou progressão narrativa em relação ao versículo anterior e introduz naturalmente a reação do fariseu.
- source_word: ὁ Φαρισαῖος
  choice: o fariseu
  rationale: Tradução corrente da designação do grupo, preservando naturalmente o artigo definido.
- source_word: ἰδὼν
  choice: ao ver isso
  rationale: O particípio aoristo indica uma circunstância anterior à reação principal; o objeto implícito é recuperado do contexto.
- source_word: ἐθαύμασεν
  choice: ficou admirado
  rationale: Expressa surpresa diante da conduta observada, sem acrescentar explicitamente desaprovação ao que o verbo, por si só, afirma.
- source_word: ὅτι οὐ πρῶτον
  choice: porque Jesus não tinha primeiro
  rationale: ὅτι introduz o motivo da reação. O mais-que-perfeito composto deixa clara a anterioridade esperada; explicitar Jesus evita a ambiguidade pronominal que surgiria em português entre ele e o fariseu.
- source_word: ἐβαπτίσθη
  choice: se lavado
  rationale: Neste contexto de prática farisaica antes da refeição, o verbo indica lavagem ritual, não o batismo cristão. A forma pronominal é natural em português e preserva o sujeito como participante da ação.
- source_word: πρὸ τοῦ ἀρίστου
  choice: antes da refeição
  rationale: Mantém o sentido geral de ἄριστον sem especificar indevidamente se era desjejum, almoço ou refeição do meio do dia.
theological_decisions:
- issue: Sentido de ἐβαπτίσθη no contexto de uma refeição farisaica
  choice: lavagem ritual antes de comer, traduzida como “se lavado”
  alternative: “ter sido batizado” ou “ter se imergido”
  rationale: O contexto imediato trata de costumes farisaicos de pureza antes da refeição, e não do batismo cristão. A nota preserva a ligação lexical com o verbo frequentemente traduzido por “batizar” sem importar uma associação sacramental para a cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jesus” foi explicitado para impedir que “ele” fosse entendido como referência ao fariseu; essa identificação decorre do contexto imediato. A formulação mantém a reação como surpresa, sem tornar explícita uma censura que o verbo grego apenas sugere contextualmente.
