id: LUK.11.1
reference: Luke 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: pt
  text: 'Certa vez, Jesus estava orando em determinado lugar. Quando terminou, um dos seus discípulos lhe disse: “Senhor, ensina-nos a orar, assim como João também ensinou os discípulos dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Certa vez
  rationale: A fórmula narrativa lucana introduz um acontecimento. “Certa vez” cumpre essa função em português atual sem recorrer ao arcaísmo “e aconteceu que”.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: Jesus estava orando
  rationale: A construção com infinitivo articular e particípio expressa uma ação em andamento. O nome “Jesus”, retomado do contexto, evita um pronome inicial potencialmente obscuro em uma unidade isolada.
- source_word: ἐν τόπῳ τινὶ
  choice: em determinado lugar
  rationale: Preserva a indefinição intencional de τινί com uma formulação natural e digna em português.
- source_word: ὡς ἐπαύσατο
  choice: Quando terminou
  rationale: No contexto, o verbo indica que Jesus cessou de orar. “Terminou” é idiomático; o complemento permanece inferível e não acrescenta conteúdo estranho.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: um dos seus discípulos
  rationale: Representa naturalmente a construção partitiva e o caráter indefinido de τις.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém o título estabelecido e sua amplitude sem reduzi-lo ao sentido meramente pedagógico de “Mestre”.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: ensina-nos a orar
  rationale: Reproduz diretamente a construção com infinitivo, sem acrescentar “como”, que não está expresso neste pedido.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: assim como João também ensinou os discípulos dele
  rationale: “Assim como” expressa a comparação de καθώς, e “também” representa καί. “Dele” deixa claro que se trata dos discípulos de João.
theological_decisions:
- issue: Tradução de κύριος na forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” preserva a faixa semântica e a relevância do título em Lucas, sem determinar além do texto o grau de seu peso cristológico nesta fala.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação evita arcaísmos, mantém tom narrativo digno e explicita “Jesus” para dar clareza ao versículo quando apresentado isoladamente.
