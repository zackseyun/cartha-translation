id: LUK.11.30
reference: Luke 11:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: pt
  text: Pois, assim como Jonas se tornou um sinal para os ninivitas, assim também o Filho do Homem será um sinal para esta geração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “assim também o Filho do Homem será para esta geração”; “um sinal” está subentendido pelo paralelo com Jonas.
    reason: A nota preserva a elipse do texto grego e informa que o predicativo foi explicitado na tradução para dar clareza em português.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Pois, assim como
  rationale: Expressa tanto a função explicativa de γάρ como a comparação introduzida por καθώς, de maneira natural em português.
- source_word: ἐγένετο
  choice: se tornou
  rationale: 'Preserva o aspecto resultativo de γίνομαι: Jonas passou a exercer a função de sinal, em vez de simplesmente existir como tal.'
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: τοῖς Νινευίταις
  choice: para os ninivitas
  rationale: Traduz o dativo de relação, indicando aqueles para quem Jonas serviu de sinal.
- source_word: σημεῖον
  choice: um sinal
  rationale: É a correspondência corrente de σημεῖον e conserva sua dimensão reveladora no contexto de Lucas.
- source_word: οὕτως ... καὶ
  choice: assim também
  rationale: Reproduz a correlação entre as duas orações e explicita o paralelismo sem o ampliar.
- source_word: ἔσται
  choice: será
  rationale: Traduz diretamente o futuro de εἰμί; o predicativo “um sinal” é recuperado da primeira oração pelo paralelismo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a forma tradicional do título e sua ressonância bíblica, sem reduzi-lo a uma paráfrase interpretativa.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: para esta geração
  rationale: Expressa naturalmente o dativo de relação e preserva o sentido profético de γενεά.
theological_decisions:
- issue: Predicativo implícito na segunda oração
  choice: Explicitar “um sinal” em “o Filho do Homem será um sinal para esta geração”
  alternative: Manter literalmente “o Filho do Homem será para esta geração”
  rationale: Embora σημεῖον não se repita no grego, o paralelismo o torna claramente subentendido. Sua explicitação produz português claro sem acrescentar uma afirmação teológica nova; a nota registra a forma elíptica do original.
- issue: Sentido de “o Filho do Homem”
  choice: Conservar o título tradicional “o Filho do Homem”
  alternative: “o Ser Humano” ou “o Humano”
  rationale: A tradução tradicional preserva ao mesmo tempo a formulação literal, o caráter titular e as ressonâncias messiânicas e apocalípticas, sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Ninivitas”, “geração” e “Filho do Homem” mantêm o vocabulário bíblico corrente sem arcaísmo desnecessário.
