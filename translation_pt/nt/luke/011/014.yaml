source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: pt
  text: Jesus estava expulsando um demônio mudo[a]. Então, quando o demônio saiu, o homem que era mudo falou, e as multidões ficaram maravilhadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “surdo”. O adjetivo grego pode significar “surdo” ou “mudo”; aqui, “mudo” se ajusta melhor ao contexto, pois o homem fala depois que o demônio sai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: estava expulsando
  rationale: A construção perifrástica no imperfeito (ἦν + particípio presente) apresenta a ação em andamento no passado; “estava expulsando” a reproduz de modo natural.
- source_word: δαιμόνιον
  choice: demônio
  rationale: É a correspondência direta e corrente para δαιμόνιον, sem substituir o termo por uma expressão diferente, como “espírito impuro”.
- source_word: κωφόν
  choice: mudo
  rationale: κωφός pode significar “surdo” ou “mudo”, mas o fato de a pessoa falar depois que o demônio sai indica que a incapacidade de falar está em foco. A ambiguidade lexical é registrada em nota.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Quando o demônio saiu
  rationale: A formulação portuguesa expressa com naturalidade a sequência temporal e a ação do particípio aoristo anterior ao verbo principal, sem conservar literalmente uma fórmula narrativa pouco idiomática como “aconteceu que”.
- source_word: ἐλάλησεν
  choice: falou
  rationale: Tradução direta de λαλέω; evita acrescentar a ideia interpretativa de que “começou” a falar.
- source_word: ὁ κωφός
  choice: o homem que era mudo
  rationale: O adjetivo substantivado designa a pessoa afetada. A forma escolhida é clara em português e evita usar “o mudo” como rótulo pessoal.
- source_word: ἐθαύμασαν
  choice: ficaram maravilhadas
  rationale: Expressa o espanto admirado indicado por θαυμάζω e preserva o tom narrativo.
- source_word: οἱ ὄχλοι
  choice: as multidões
  rationale: Mantém o plural do grego e soa natural em português contemporâneo.
theological_decisions:
- issue: Natureza da aflição e linguagem de exorcismo
  choice: Apresentar o episódio como a expulsão real de um demônio, seguida pela recuperação da fala.
  alternative: Reformular de modo meramente fenomenológico ou evitar a referência sobrenatural explícita.
  rationale: O texto grego nomeia explicitamente um δαιμόνιον e relaciona sua saída à fala da pessoa. A tradução conserva essa afirmação narrativa sem reduzi-la nem ampliá-la.
- issue: Relação entre o demônio e a mudez
  choice: Manter a expressão concisa “demônio mudo”, explicando em nota a amplitude de κωφός.
  alternative: Explicitar no texto “um demônio que tornava a pessoa muda”.
  rationale: O grego atribui diretamente o adjetivo κωφόν a δαιμόνιον. Embora o contexto sugira uma aflição de mudez causada pelo demônio, explicitar essa relação causal acrescentaria uma formulação que não está gramaticalmente expressa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Jesus” explicita o sujeito implícito retomado do contexto, algo natural em português na abertura isolada do versículo. Evitou-se tanto o termo antiquado “demônio surdo-mudo” quanto uma paráfrase causal não expressa diretamente pelo grego.
