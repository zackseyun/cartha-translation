source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: pt
  text: 'E ele lhes disse: “Qual de vocês terá um amigo e irá até ele à meia-noite e lhe dirá: ‘Amigo, empreste-me três pães,’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Qual de vocês
  rationale: Introduz diretamente a pergunta retórica dirigida aos ouvintes; é natural e corrente em português.
- source_word: ἕξει
  choice: terá
  rationale: Preserva a forma futura do grego e a construção hipotética da pergunta, sem convertê-la silenciosamente para o presente.
- source_word: φίλον / Φίλε
  choice: amigo / Amigo
  rationale: Mantém a repetição lexical do grego, tanto para a relação quanto para o vocativo.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: irá procurá-lo
  rationale: Expressa em português natural o movimento dirigido até a casa do amigo; neste contexto, 'procurá-lo' comunica ir até ele sem acrescentar uma finalidade estranha ao texto.
- source_word: μεσονυκτίου
  choice: à meia-noite
  rationale: Equivalente temporal direto e idiomático do genitivo adverbial.
- source_word: εἴπῃ αὐτῷ
  choice: para lhe dizer
  rationale: A finalidade fica clara e natural em português, preservando o verbo de fala e seu destinatário.
- source_word: χρῆσόν μοι
  choice: empreste-me
  rationale: Traduz naturalmente o imperativo que pede a cessão temporária de algo.
- source_word: τρεῖς ἄρτους
  choice: três pães
  rationale: Em português, 'três pães' é a forma comum de contar unidades inteiras de pão e corresponde ao uso cotidiano de ἄρτοι.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro retórico do grego foi mantido. A frase permanece aberta no fim porque o versículo continua sintaticamente no contexto seguinte.
