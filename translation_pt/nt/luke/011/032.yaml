id: LUK.11.32
reference: Luke 11:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: pt
  text: Os homens de Nínive se levantarão no juízo com esta geração e a condenarão, porque se arrependeram em resposta à proclamação de Jonas. E eis que algo maior do que Jonas está aqui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém maior do que Jonas está aqui” ou “mais do que Jonas está aqui”. O grego emprega uma forma neutra (“maior/mais”), que pode apontar de modo amplo para a realidade maior presente em Jesus e em seu ministério, e não apenas para uma comparação pessoal.'
    reason: Leitura alternativa que preserva a ambiguidade gramatical e o alcance teológico de πλεῖον.
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Os homens de Nínive
  rationale: Preserva a referência masculina explícita de ἄνδρες e expressa Νινευῖται de modo natural e claro em português.
- source_word: ἀναστήσονται
  choice: se levantarão
  rationale: Mantém a imagem de levantar-se no cenário escatológico e judicial sem explicitar além do texto a ideia de ressurreição.
- source_word: ἐν τῇ κρίσει
  choice: no juízo
  rationale: Representa κρίσις como o evento judicial escatológico e acompanha de perto a construção com ἐν.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: com esta geração
  rationale: Preserva a associação expressa por μετά com o genitivo e a fórmula sinótica 'esta geração'.
- source_word: κατακρινοῦσιν αὐτήν
  choice: a condenarão
  rationale: κατακρίνω indica condenação, não apenas avaliação; o pronome feminino retoma naturalmente 'esta geração'.
- source_word: μετενόησαν
  choice: se arrependeram
  rationale: No contexto profético, μετανοέω comunica arrependimento moral e espiritual, e não mera mudança intelectual.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: em resposta à proclamação de Jonas
  rationale: Explicita de modo idiomático a relação de resposta indicada por εἰς após μετανοέω, enquanto 'proclamação' preserva o sentido de κήρυγμα.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Conserva a força solene e enfática do marcador discursivo ἰδού em português corrente de registro bíblico.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: algo maior do que Jonas está aqui
  rationale: O neutro πλεῖον favorece 'algo maior', preservando a possibilidade de uma referência mais ampla à realidade presente em Jesus e em seu ministério, sem excluir a comparação pessoal.
theological_decisions:
- issue: Referente e alcance de πλεῖον Ἰωνᾶ
  choice: algo maior do que Jonas está aqui
  alternative: alguém maior do que Jonas está aqui; mais do que Jonas está aqui
  rationale: A tradução mantém o gênero neutro de πλεῖον e, assim, não reduz a expressão a uma comparação exclusivamente pessoal. Jesus está em vista, mas a formulação pode abranger também a realidade maior presente nele e em seu ministério.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se expressões bíblicas reconhecíveis como “no juízo” e “eis que”, sem arcaísmo excessivo. A divisão em duas frases torna a ênfase final natural em português.
