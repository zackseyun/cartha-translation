  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: pt
  text: Ou, se o filho lhe pedir um ovo, será que lhe dará um escorpião?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ou, se
  rationale: Introduz o exemplo paralelo seguinte na sequência retórica. A forma é natural em português e preserva a progressão disjuntiva sem traduzir καί de modo excessivamente explícito.
- source_word: αἰτήσει
  choice: pedir
  rationale: O futuro do indicativo grego funciona numa construção de sentido condicional. O infinitivo pessoal elíptico após “se” é natural em português quando o sujeito já está claro pelo contexto.
- source_word: ᾠόν
  choice: um ovo
  rationale: Equivalente direto e corrente do substantivo grego no acusativo.
- source_word: ἐπιδώσει
  choice: será que lhe dará
  rationale: No contexto, o verbo significa dar ou entregar em resposta a um pedido. “Será que” conserva com naturalidade a força da pergunta retórica, e “lhe dará” expressa o objeto indireto.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo é naturalmente representado pelo objeto indireto “lhe” em português.
- source_word: σκορπίον
  choice: um escorpião
  rationale: Equivalente padrão que mantém o contraste vívido e absurdo com o ovo.
theological_decisions:
- issue: Força retórica da analogia entre pai e filho
  choice: Traduzir como pergunta retórica direta, sem explicação interpretativa adicional.
  alternative: Acrescentar “em vez disso” para explicitar o contraste.
  rationale: O grego deixa implícito o contraste absurdo. A formulação portuguesa o comunica claramente e preserva o argumento sobre a bondade do Pai sem expansão parafrástica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão e o paralelismo da sequência de perguntas de Jesus.
