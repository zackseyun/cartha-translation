id: LUK.11.20
reference: Luke 11:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: pt
  text: Mas, se expulso os demônios pelo dedo de Deus[a], então o Reino de Deus chegou até vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o dedo de Deus”. A expressão retrata a ação direta e poderosa de Deus e ecoa Êxodo 8:19.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “veio sobre vocês” ou “alcançou vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: pelo dedo de Deus
  rationale: Preserva a metáfora vívida do grego e expressa naturalmente meio ou agência em português, evocando a atuação direta de Deus sem substituir a imagem por uma explicação.
- source_word: ἐκβάλλω
  choice: expulso
  rationale: É a forma corrente e precisa em português para a ação de fazer os demônios saírem, adequada ao uso nos relatos de exorcismo.
- source_word: τὰ δαιμόνια
  choice: os demônios
  rationale: Traduz diretamente o substantivo grego e mantém o artigo de modo natural; “espíritos impuros” corresponderia a outra expressão grega.
- source_word: ἄρα
  choice: então
  rationale: Marca com clareza a conclusão que decorre da condição anterior, sem tornar a frase excessivamente formal.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: chegou até vocês
  rationale: Comunica uma chegada efetiva e decisiva dirigida aos ouvintes. Também preserva, em linguagem natural, a ideia de que o Reino já os alcançou.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: o Reino de Deus
  rationale: Expressão tradicional, clara e abrangente, capaz de conservar tanto a dimensão do domínio de Deus quanto a linguagem concreta de reino.
theological_decisions:
- issue: Sentido de “dedo de Deus”
  choice: Manter a imagem como referência à ação ou ao poder direto de Deus.
  alternative: Explicitar no texto principal uma referência específica ao Espírito Santo, por comparação com Mateus 12:28.
  rationale: Lucas emprega deliberadamente “dedo de Deus”. Preservar sua formulação mantém a alusão bíblica e evita harmonizar o texto com o paralelo de Mateus ou impor uma interpretação no corpo da tradução.
- issue: Força de “o Reino de Deus chegou até vocês”
  choice: Apresentar a chegada efetiva do Reino de Deus no ministério de Jesus.
  alternative: 'Entender o Reino apenas como futuro ou ver a expressão exclusivamente como ameaça: “apanhou vocês”.'
  rationale: O aoristo ἔφθασεν, nesta construção e neste contexto, indica que o Reino alcançou decisivamente os ouvintes. A redação mantém essa afirmação presente sem definir além do texto um sistema escatológico completo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμᾶς; a metáfora “dedo de Deus” e a tensão da chegada do Reino foram preservadas sem paráfrase doutrinária.
