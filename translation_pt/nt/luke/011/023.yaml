id: LUK.11.23
reference: Luke 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: pt
  text: Quem não está comigo está contra mim, e quem não ajunta comigo espalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: quem não está
  rationale: O artigo com o particípio presente tem valor substantivado e genérico. “Quem não está” expressa isso de modo natural e atual em português, sem recorrer ao mais pesado “aquele que não está”.
- source_word: μετ’ ἐμοῦ
  choice: comigo
  rationale: μετά com o genitivo indica associação ou alinhamento. “Comigo” é a correspondência direta, clara e idiomática.
- source_word: κατ’ ἐμοῦ
  choice: contra mim
  rationale: κατά com o genitivo exprime oposição. “Contra mim” preserva com clareza a antítese entre estar com Jesus e estar contra ele.
- source_word: συνάγων
  choice: ajunta
  rationale: O verbo denota reunir ou juntar. “Ajunta” mantém a imagem concreta e forma um contraste verbal direto com “espalha”, sendo amplamente compreensível em português.
- source_word: σκορπίζει
  choice: espalha
  rationale: O verbo significa espalhar ou dispersar. “Espalha” é corrente, vívido e preserva o contraste com “ajunta”.
- source_word: καὶ
  choice: e
  rationale: A conjunção coordena as duas afirmações paralelas; “e” reproduz essa ligação simples.
theological_decisions:
- issue: Força da declaração de Jesus sobre a neutralidade diante dele
  choice: A formulação apresenta quem não está alinhado com Jesus como estando contra ele.
  alternative: Atenuar a frase para sugerir apenas falta de apoio, ou restringi-la explicitamente à atividade de expulsar demônios.
  rationale: A forma grega é absoluta e enfática. A tradução conserva essa tensão sem acrescentar uma delimitação contextual ou uma formulação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. Preferiu-se “quem” para o sujeito genérico e “ajunta/espalha” para preservar o paralelismo e a oposição imagética do original.
