  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: pt
  text: Pois todo aquele que se alimenta de leite não tem experiência na palavra da justiça[a][b], porque é criança de colo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mensagem da justiça» ou «palavra a respeito da justiça».
    reason: lexical_alternative
  - marker: b
    text: Ou «retidão», em vez de «justiça».
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: todo aquele que se alimenta de
  rationale: A construção distributiva refere-se a cada pessoa da classe descrita. «Alimenta-se de» soa natural com «leite» e mantém a metáfora do consumo sem afirmar explicitamente que esse seja seu único alimento.
- source_word: γάλακτος
  choice: leite
  rationale: Mantém-se a imagem literal e pedagógica já estabelecida no contexto.
- source_word: ἄπειρος
  choice: não tem experiência
  rationale: Expressa falta de experiência ou familiaridade prática, sem sugerir ignorância absoluta; em português, rege naturalmente a preposição «em».
- source_word: λόγου δικαιοσύνης
  choice: palavra da justiça
  rationale: 'A formulação compacta preserva a abertura da relação genitiva: pode indicar palavra caracterizada pela justiça ou mensagem a respeito dela.'
- source_word: δικαιοσύνης
  choice: justiça
  rationale: «Justiça» é a correspondência portuguesa corrente de δικαιοσύνη e pode abranger tanto a retidão quanto aquilo que é justo; «retidão» é registrada como alternativa para não estreitar o sentido no texto principal.
- source_word: νήπιος
  choice: criança de colo
  rationale: O termo designa uma criança muito pequena e, metaforicamente, imaturidade. «Criança de colo» é natural, clara e se harmoniza com a imagem do leite.
- source_word: γάρ ... γάρ
  choice: pois ... porque
  rationale: As duas ocorrências têm função explicativa. A variação produz português natural sem apagar a progressão argumentativa.
theological_decisions:
- issue: Sentido de λόγου δικαιοσύνης
  choice: palavra da justiça
  alternative: mensagem da justiça; palavra a respeito da justiça
  rationale: Mantém-se no texto a construção condensada e sua ambiguidade genuína, enquanto a nota explicita duas relações possíveis do genitivo.
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva a amplitude do termo em português; «retidão» pode salientar sua dimensão moral, mas não é imposta ao contexto.
- issue: Gênero na construção genérica νήπιος ... ἐστιν
  choice: porque é criança de colo
  alternative: porque ele é uma criança de colo
  rationale: O sujeito genérico já está expresso por «todo aquele». Em português, a omissão do pronome é gramatical e natural, não altera o referente nem introduz uma reformulação ideológica de gênero.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Criança de colo» evita o tom técnico de «lactente» e preserva de modo vivo a metáfora de leite e imaturidade. Os marcadores seguem a ordem em que as questões aparecem na expressão anotada.
