id: HEB.5.3
reference: Hebrews 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: pt
  text: E, por causa dessa fraqueza[a], ele é obrigado a oferecer pelos pecados, tanto pelo povo como por si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “por causa dela”; o pronome feminino retoma naturalmente a “fraqueza” mencionada no versículo anterior.
    reason: A nota registra a forma literal e explica o antecedente gramatical explicitado na tradução.
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: por causa dessa fraqueza
  rationale: A preposição διά com acusativo expressa causa, e o pronome feminino retoma naturalmente ἀσθένεια, “fraqueza”, no versículo anterior. Explicitar o referente evita em português uma expressão vaga ou ambígua de modo não intencional.
- source_word: ὀφείλει
  choice: é obrigado
  rationale: Expressa uma obrigação decorrente de sua condição e função sacerdotal, e não mera conveniência moral.
- source_word: καθὼς ... οὕτως καὶ
  choice: tanto ... como
  rationale: Reproduz de forma natural em português a correlação entre o que o sacerdote oferece por si mesmo e pelo povo; a ordem foi ajustada para favorecer a fluidez sem alterar a relação lógica.
- source_word: τοῦ λαοῦ
  choice: o povo
  rationale: Mantém a designação genérica do texto, cujo contexto identifica o povo da aliança, sem acrescentar “Israel” no corpo do versículo.
- source_word: αὑτοῦ
  choice: si mesmo
  rationale: Preserva com clareza o sentido reflexivo referente ao sumo sacerdote.
- source_word: προσφέρειν
  choice: oferecer
  rationale: Mantém o verbo sem acrescentar um objeto ausente no grego. O contexto sacerdotal torna evidente que se trata de oferecer sacrifícios ou ofertas.
- source_word: περὶ ἁμαρτιῶν
  choice: pelos pecados
  rationale: É a formulação portuguesa concisa e idiomática para a ação sacrificial realizada em relação aos pecados, sem restringi-la à expressão técnica “oferta pelo pecado”.
theological_decisions:
- issue: Referente de δι’ αὐτὴν
  choice: A frase retoma explicitamente a fraqueza do sumo sacerdote mencionada em Hebreus 5:2.
  alternative: Manter “por causa disso” e deixar o referente apenas implícito, ou entendê-lo de maneira mais geral como referência à situação ou ao ofício sacerdotal.
  rationale: A concordância feminina e o antecedente imediato ἀσθένεια favorecem fortemente “fraqueza”. A explicitação transmite em português a coesão que o gênero gramatical sinaliza no grego.
- issue: Objeto implícito de προσφέρειν
  choice: Manter apenas “oferecer”, sem inserir “sacrifícios”.
  alternative: Traduzir “oferecer sacrifícios” para explicitar a ação cultual.
  rationale: Embora o contexto seja inequivocamente sacrificial, o texto grego não apresenta objeto expresso. A formulação portuguesa “oferecer pelos pecados” permanece compreensível e evita tornar explícito no corpo do texto o que está apenas implícito.
- issue: Relação entre as ofertas pelo sacerdote e pelo povo
  choice: Preservar que o sacerdote oferece pelos próprios pecados e pelos do povo, sem aplicar essa fraqueza ou obrigação a Cristo neste versículo.
  alternative: Ler a afirmação diretamente como descrição de Cristo.
  rationale: O referente imediato é o sumo sacerdote humano descrito em 5:1–4. A tradução mantém o desenvolvimento do argumento sem antecipar ou harmonizar sua posterior aplicação cristológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem “por si mesmo ... pelo povo” é natural em português e corresponde à progressão verbal de oferecer primeiro por si e depois pelo povo, embora o grego apresente os termos comparativos na ordem “pelo povo ... por si mesmo”.
