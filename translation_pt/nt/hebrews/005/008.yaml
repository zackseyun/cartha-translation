  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: pt
  text: Embora fosse Filho[a], aprendeu, por meio do que sofreu[b], a obediência,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Embora fosse o Filho». O grego diz simplesmente «Filho», sem artigo; em português, o contexto também permite explicitar o artigo definido.'
    reason: alternative_reading
  - marker: b
    text: A expressão «aprendeu ... a obediência» fala de aprendizado vivido por meio do sofrimento, não de correção por uma desobediência anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Embora
  rationale: 'Introduz naturalmente a concessão: apesar de sua condição de Filho, ele aprendeu a obediência por meio do sofrimento.'
- source_word: ὢν υἱός
  choice: fosse Filho
  rationale: O particípio de εἰμί é expresso por uma oração finita idiomática em português. «Filho», sem artigo, acompanha a forma predicativa e anartrosa do grego, enquanto a inicial maiúscula deixa clara a referência cristológica.
- source_word: ἔμαθεν
  choice: aprendeu
  rationale: Traduz diretamente o aoristo de μανθάνω e preserva a afirmação forte de aprendizado real pela experiência.
- source_word: ἀφ’ ὧν
  choice: por meio do que
  rationale: Expressa de modo natural a fonte ou o meio experiencial do aprendizado, sem reduzir a relação ao mero resultado do sofrimento.
- source_word: ἔπαθεν
  choice: sofreu
  rationale: Traduz de forma direta e clara o sofrimento efetivamente suportado.
- source_word: τὴν ὑπακοήν
  choice: a obediência
  rationale: Mantém o substantivo abstrato e seu artigo, ambos naturais nesta construção em português, indicando submissão responsiva à vontade de Deus.
theological_decisions:
- issue: A condição filial de Cristo em relação ao seu aprendizado
  choice: Embora fosse Filho
  alternative: Embora fosse o Filho
  rationale: A formulação preserva tanto a identidade filial de Jesus quanto a afirmação de que ele aprendeu mediante o sofrimento. A ausência de artigo corresponde de perto ao grego, sem negar que o referente é o Filho específico no contexto.
- issue: Se «aprendeu a obediência» implica desobediência anterior
  choice: Manter a formulação direta «aprendeu ... a obediência»
  alternative: aprendeu pela experiência o que significa obedecer
  rationale: O texto grego afirma que ele aprendeu a obediência e não deve ser suavizado para eliminar a tensão teológica. O contexto permite entendê-lo como aprendizado vivido por meio do sofrimento, não como correção de desobediência ou deficiência moral anterior.
translation_notes:
  register: Português moderno, claro e digno, com construção concessiva natural. A ordem «aprendeu, por meio do que sofreu, a obediência» mantém unidos o verbo e seu objeto sem ocultar o papel experiencial do sofrimento.
