id: HEB.5.12
reference: Hebrews 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: pt
  text: Pois, embora a esta altura vocês já devessem ser mestres, novamente precisam que alguém lhes ensine certos elementos básicos do começo das palavras de Deus[a]. Vocês chegaram a precisar de leite, e não de alimento sólido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certos princípios elementares das primeiras palavras de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: A imagem de leite e alimento sólido contrasta o ensino elementar com a maturidade esperada, sem definir um currículo técnico.
    reason: metaphorical_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: já devessem ser
  rationale: Expressa a expectativa ou obrigação não cumprida, sem dar ao trecho um tom excessivamente jurídico.
- source_word: διὰ τὸν χρόνον
  choice: a esta altura
  rationale: Comunica de modo idiomático que já havia transcorrido tempo suficiente para que alcançassem maturidade.
- source_word: διδάσκαλοι
  choice: mestres
  rationale: Termo corrente e digno para pessoas aptas a ensinar outras.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: precisam novamente que alguém lhes ensine
  rationale: Torna explícito o sujeito implícito do infinitivo e preserva a ideia de regressão ou repetição indicada por πάλιν.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: os elementos básicos e iniciais
  rationale: Reproduz de forma natural tanto a noção de componentes rudimentares em στοιχεῖα quanto a referência ao começo em ἀρχῆς, sem sugerir necessariamente uma ordem cronológica das revelações.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: das declarações de Deus
  rationale: Mantém o sentido de pronunciamentos ou revelações divinas de λόγια, evitando a possível associação moderna de 'oráculos' com práticas pagãs.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: chegaram a precisar
  rationale: Reflete o perfeito grego, que apresenta uma condição alcançada e ainda vigente.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: de leite, não de alimento sólido
  rationale: Preserva diretamente o contraste metafórico e a força retórica do original.
theological_decisions:
- issue: Contraste metafórico entre leite e alimento sólido
  choice: A metáfora foi mantida sem explicação doutrinária no corpo do texto.
  alternative: Parafrasear como ensino elementar em contraste com ensino avançado.
  rationale: O versículo não define um currículo técnico nem um sistema denominacional de maturidade; manter as imagens preserva a tensão e a retórica do autor.
- issue: Sentido de λόγια τοῦ θεοῦ
  choice: declarações de Deus
  alternative: oráculos de Deus; palavras de Deus
  rationale: '''Declarações'' conserva a ideia de pronunciamentos divinos sem reduzir λόγια a palavras comuns nem suscitar, no texto principal, uma associação indevida com adivinhação pagã.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” deixa claro que a repreensão é dirigida à comunidade. As notas foram posicionadas junto às expressões que efetivamente explicam.
