  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: pt
  text: 'como também diz em outra passagem[a]: “Você é sacerdote para sempre, segundo a ordem de Melquisedeque.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em outro lugar”. O grego diz literalmente “em outro”, deixando subentendido o substantivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: como também
  rationale: Expressa naturalmente a comparação e preserva o valor aditivo de καί, introduzindo uma segunda citação bíblica paralela à anterior.
- source_word: ἐν ἑτέρῳ
  choice: em outra passagem
  rationale: O grego diz literalmente “em outra”, com o substantivo subentendido; “passagem” explicita de modo idiomático a referência a outro trecho das Escrituras.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente e deixa implícito o sujeito pessoal, como no grego, preservando a apresentação da Escritura como fala atual de Deus.
- source_word: Σὺ
  choice: Você
  rationale: Preserva o tratamento direto na segunda pessoa do singular, em português moderno e amplamente compreensível.
- source_word: ἱερεὺς
  choice: sacerdote
  rationale: Equivalente corrente de ἱερεύς; em português, o predicativo não requer artigo indefinido.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma idiomática e clara de exprimir duração perpétua neste contexto.
- source_word: κατὰ τὴν τάξιν
  choice: segundo a ordem de
  rationale: Preserva a ideia de ordem ou categoria sacerdotal e a ligação argumentativa com o sacerdócio associado a Melquisedeque.
- source_word: Μελχισέδεκ
  choice: Melquisedeque
  rationale: Forma tradicional e corrente do nome bíblico em português.
theological_decisions:
- issue: Referência ao sujeito na fórmula de citação
  choice: Usar “diz”, deixando implícito o sujeito pessoal, entendido no contexto como Deus falando nas Escrituras.
  alternative: Usar “está escrito” ou “ela diz”, fazendo da Escritura o sujeito explícito.
  rationale: Hebreus apresenta repetidamente a Escritura como fala viva e presente de Deus. A formulação portuguesa mantém essa força sem acrescentar um sujeito ausente do grego.
- issue: Sentido de τάξις na citação sobre Melquisedeque
  choice: “ordem”, entendida como ordem ou categoria sacerdotal.
  alternative: “modo”, “modelo” ou “semelhança”.
  rationale: “Ordem” preserva a amplitude do termo e sua função no argumento de Hebreus, sem reduzir a relação a uma simples comparação de estilo ou padrão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A construção mantém a concisão da fórmula de citação e a ambiguidade do sujeito de “diz”.
