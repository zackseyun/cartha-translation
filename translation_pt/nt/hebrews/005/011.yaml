id: HEB.5.11
reference: Hebrews 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: pt
  text: Sobre isso[a], temos muito que dizer, e é difícil explicar[b], pois vocês se tornaram lentos para ouvir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sobre quem”. O pronome relativo grego pode referir-se pessoalmente a Melquisedeque, embora aqui possa apontar de modo mais amplo para o assunto em discussão.
    reason: alternative_reading
  - marker: b
    text: Ou “é difícil interpretar” ou “é difícil expor”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, vagarosos ou pouco receptivos ao ensino; não se trata de dificuldade física para escutar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Sobre isso
  rationale: O pronome relativo grego pode retomar tanto Melquisedeque pessoalmente quanto, de modo mais amplo, o assunto em discussão. “Sobre isso” é natural em português e mantém o foco discursivo sem romper a ligação com Melquisedeque.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: temos muito que dizer
  rationale: A expressão, literalmente próxima de “muito é para nós o discurso”, pede reestruturação idiomática. A formulação escolhida comunica que o autor tem amplo conteúdo a expor.
- source_word: καί
  choice: mas
  rationale: Embora καί normalmente signifique “e”, aqui a segunda oração contrasta a abundância do que há para dizer com a dificuldade de comunicá-lo. “Mas” torna explícita essa relação contextual de modo natural.
- source_word: δυσερμήνευτος λέγειν
  choice: é difícil explicar
  rationale: O adjetivo indica algo difícil de interpretar ou expor, e o infinitivo λέγειν situa a dificuldade no ato de comunicá-lo. “Difícil explicar” é claro e idiomático.
- source_word: ἐπεὶ
  choice: pois
  rationale: A conjunção introduz a causa da dificuldade de exposição. “Pois” conserva essa força causal em registro digno e corrente.
- source_word: νωθροὶ
  choice: lentos
  rationale: O termo descreve falta de prontidão ou receptividade, não deficiência auditiva física. “Lentos” preserva a imagem e evita sugerir apenas incapacidade intelectual.
- source_word: γεγόνατε
  choice: vocês se tornaram
  rationale: O perfeito grego aponta para um estado presente resultante de um processo. “Se tornaram” preserva a ideia de mudança ocorrida.
- source_word: ταῖς ἀκοαῖς
  choice: para ouvir
  rationale: A expressão refere-se metaforicamente à receptividade ao ensino. “Lentos para ouvir” é natural em português e mantém a metáfora sem explicá-la dentro do texto.
theological_decisions:
- issue: Referente de Περὶ οὗ
  choice: 'Referência principal ao assunto em discussão: “Sobre isso”'
  alternative: 'Referência pessoal a Melquisedeque: “Sobre quem”'
  rationale: Melquisedeque é o antecedente nominal imediato, portanto a leitura pessoal é gramaticalmente possível. Contudo, a frase introduz mais naturalmente o tema amplo que o autor deseja desenvolver. A nota preserva a ambiguidade genuína.
- issue: Natureza da dificuldade de exposição
  choice: A dificuldade decorre da falta de receptividade dos ouvintes
  alternative: O assunto seria intrinsecamente obscuro ou impossível de interpretar
  rationale: A oração causal com ἐπεὶ atribui a dificuldade, neste contexto, ao estado dos destinatários. A tradução evita transformar isso numa afirmação de que o tema em si seja inevitavelmente obscuro.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para ampla legibilidade brasileira. A tradução conserva a metáfora da audição e registra em nota a ambiguidade do referente inicial.
