id: HEB.5.14
reference: Hebrews 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: pt
  text: Mas o alimento sólido é para os maduros, os que, pela prática[a], têm as faculdades de percepção[b] treinadas para distinguir tanto o bem como o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelo hábito» ou «pelo uso constante».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «os sentidos»; aqui, a palavra se refere metaforicamente às faculdades perceptivas da pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: os maduros
  rationale: O genitivo plural indica pessoas e contrasta com os inexperientes do contexto imediato. «Os maduros» comunica desenvolvimento espiritual sem sugerir perfeição moral absoluta.
- source_word: στερεὰ τροφή
  choice: o alimento sólido
  rationale: Preserva de modo natural a metáfora que contrasta alimento sólido com leite.
- source_word: διὰ τὴν ἕξιν
  choice: pela prática
  rationale: ἕξις pode indicar prática, hábito ou disposição adquirida. «Pela prática» expressa de forma concisa o exercício reiterado que conduz ao discernimento, mantendo alternativas em nota.
- source_word: τὰ αἰσθητήρια
  choice: as faculdades de percepção
  rationale: O termo designa literalmente sentidos ou órgãos dos sentidos, mas é empregado metaforicamente para as capacidades perceptivas interiores. A tradução preserva essa ideia sem antecipar em excesso o substantivo «discernimento» da expressão seguinte.
- source_word: γεγυμνασμένα ἐχόντων
  choice: têm ... exercitadas
  rationale: 'O particípio perfeito passivo com ἐχόντων descreve uma condição resultante: essas pessoas possuem faculdades que foram exercitadas e permanecem treinadas.'
- source_word: πρὸς διάκρισιν
  choice: para distinguir
  rationale: Com πρός, διάκρισις exprime finalidade ou resultado. A forma verbal é natural em português e liga-se diretamente a «o bem» e «o mal».
- source_word: καλοῦ τε καὶ κακοῦ
  choice: tanto o bem como o mal
  rationale: Representa a correlação τε καὶ e mantém a conhecida formulação bíblica de distinção moral.
- source_word: δέ
  choice: Mas
  rationale: Marca o contraste com a afirmação anterior sobre o leite e os inexperientes.
theological_decisions:
- issue: Sentido de τελείων no contexto de crescimento espiritual
  choice: os maduros
  alternative: os perfeitos; os plenamente desenvolvidos; os adultos
  rationale: O contexto estabelece contraste entre imaturidade e discernimento desenvolvido. «Os maduros» preserva a força exortativa sem impor a ideia de impecabilidade ou perfeição moral absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém o contraste inicial e a metáfora alimentar. «Faculdades de percepção» evita uma leitura estritamente física de «sentidos» e, ao mesmo tempo, não elimina a imagem do original.
