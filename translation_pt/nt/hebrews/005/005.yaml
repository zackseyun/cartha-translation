source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: pt
  text: 'Assim também o Messias não glorificou a si mesmo para se tornar sumo sacerdote, mas foi glorificado por aquele que lhe disse: “Você é meu Filho; hoje eu o gerei”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação do Salmo 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Assim também
  rationale: Mantém a comparação com a afirmação anterior sobre a nomeação do sumo sacerdote e soa natural em português.
- source_word: ὁ Χριστὸς
  choice: o Messias
  rationale: Aqui Χριστός funciona como título no argumento sobre a nomeação divina para um ofício; “Messias” torna esse valor titular explícito.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: não glorificou a si mesmo
  rationale: Preserva o sentido de δοξάζω e a construção reflexiva enfática, sem reduzir o termo apenas a “honrar” ou ampliar para “exaltar”.
- source_word: γενηθῆναι ἀρχιερέα
  choice: para se tornar sumo sacerdote
  rationale: Expressa a entrada na função indicada pelo infinitivo γενηθῆναι com o predicativo ἀρχιερέα; em português, o título do cargo dispensa artigo nesse contexto.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: mas aquele que lhe disse
  rationale: Mantém o sujeito substantivado e implicitamente identificado como Deus pelo contexto. “Disse” é mais natural em português para introduzir a citação, sem alterar o sentido de λαλέω.
- source_word: Υἱός μου εἶ σύ
  choice: Você é meu Filho
  rationale: Adota ordem portuguesa natural e conserva a declaração filial direta. A inicial maiúscula em “Filho” corresponde ao referente messiânico no contexto.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: hoje eu gerei você
  rationale: “Gerei” traduz diretamente γεννάω e preserva a formulação e a ambiguidade teológica da citação do Salmo 2:7, sem especificar entronização, ressurreição ou geração eterna.
theological_decisions:
- issue: Sentido de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: O termo tem valor de título no argumento sobre a designação para o sacerdócio; “Messias” comunica esse sentido sem tratar Χριστός simplesmente como nome próprio.
- issue: Sentido cristológico de “hoje eu gerei você”
  choice: Manter a citação sem explicação interpretativa no texto principal
  alternative: Explicitar entronização, ressurreição, adoção ou geração eterna
  rationale: A citação deve conservar sua tensão e amplitude intertextual, sem fazer a tradução decidir entre interpretações teológicas posteriores.
- issue: Agente implícito da glorificação e nomeação
  choice: Manter “aquele que lhe disse”
  alternative: Acrescentar explicitamente “Deus o glorificou”
  rationale: O grego deixa a oração principal elíptica depois de ἀλλά e identifica o agente mediante a citação; manter essa forma evita acrescentar conteúdo não expresso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” mantém a fala direta em registro atual; “sumo sacerdote” e “gerei” preservam a precisão bíblica sem arcaísmo excessivo. O único marcador de nota, [a], aparece no texto principal.
