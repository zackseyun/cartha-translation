source:
  edition: SBLGNT
  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: pt
  text: tendo sido declarado por Deus sumo sacerdote segundo a ordem de Melquisedeque.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tendo sido chamado por Deus sumo sacerdote» ou «tendo sido designado por Deus sumo sacerdote».'
    reason: lexical_alternative
  - marker: b
    text: Isto retoma o Salmo 110:4, onde se diz que o sacerdócio é «segundo a ordem de Melquisedeque».
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: tendo sido declarado
  rationale: O particípio aoristo passivo de προσαγορεύω expressa a ação divina de nomear ou reconhecer formalmente Jesus nessa condição. «Declarado» preserva a voz passiva e evita que «designado» sugira, por si só, uma nomeação institucional mais forte do que o verbo exige.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: Ὑπό com o genitivo indica o agente pessoal da construção passiva. O texto diz apenas «por Deus», sem explicitar «o Pai».
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Equivalente português corrente de ἀρχιερεύς. Como o português não exige artigo nesta construção predicativa, «declarado ... sumo sacerdote» é natural e não apresenta Jesus como apenas um entre vários.
- source_word: κατὰ
  choice: segundo
  rationale: Nesta construção, κατά indica conformidade ou correspondência. «Segundo» é conciso, natural e mantém a formulação tradicionalmente reconhecível da citação do Salmo.
- source_word: τὴν τάξιν
  choice: a ordem
  rationale: Em Hebreus, τάξις indica ordem, categoria ou padrão sacerdotal, e não mera sequência. «Ordem» conserva a ligação conceitual com o Salmo 110:4 e com o argumento da carta.
- source_word: Μελχισέδεκ
  choice: Melquisedeque
  rationale: Forma portuguesa consagrada e amplamente inteligível do nome próprio grego Μελχισέδεκ.
theological_decisions:
- issue: Se o particípio deve indicar mudança de condição, nomeação formal ou declaração divina
  choice: tendo sido declarado por Deus sumo sacerdote
  alternative: tendo sido chamado por Deus sumo sacerdote; tendo sido designado por Deus sumo sacerdote
  rationale: «Declarado» comunica a identificação formal feita por Deus sem decidir além do texto se houve naquele momento uma instalação institucional ou uma mudança ontológica. As alternativas lexicalmente possíveis são registradas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação acompanha naturalmente o contexto como continuação da frase anterior e preserva a linguagem sacerdotal de Hebreus.
