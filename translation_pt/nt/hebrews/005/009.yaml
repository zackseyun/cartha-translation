  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: pt
  text: e, tendo sido aperfeiçoado[a], tornou-se a fonte[b] da salvação eterna para todos os que lhe obedecem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo sido levado à perfeição” ou “tendo sido levado à plena realização”. O grego provavelmente se refere a ser conduzido ao pleno cumprimento de sua função sacerdotal e redentora, não a um aperfeiçoamento moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o autor” ou “a causa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém de modo simples a ligação da frase com o contexto anterior, sem especificar uma relação discursiva mais forte.
- source_word: τελειωθεὶς
  choice: tendo sido levado à plena realização
  rationale: O particípio aoristo passivo de τελειόω indica aqui ser conduzido ao fim ou objetivo pretendido. A formulação evita sugerir que Jesus tivesse antes alguma imperfeição moral, ao mesmo tempo que preserva a ideia de completude de sua missão.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: 'Expressa naturalmente o estado ou papel resultante: depois de ser levado à plena realização, ele se tornou a fonte da salvação.'
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: para todos os que lhe obedecem
  rationale: Preserva explicitamente o sentido de obediência de ὑπακούω e traduz o dativo como indicação dos beneficiários. A forma verbal comunica uma atitude característica ou contínua.
- source_word: αἴτιος
  choice: a fonte
  rationale: Comunica de modo claro e natural que ele é aquele que causa ou proporciona a salvação. Evita o sentido predominantemente literário que “autor” pode assumir em português.
- source_word: σωτηρίας
  choice: salvação
  rationale: Mantém o sentido soteriológico estabelecido de σωτηρία no contexto de Hebreus.
- source_word: αἰωνίου
  choice: eterna
  rationale: É a tradução mais direta e natural de αἰώνιος como qualificativo de salvação.
theological_decisions:
- issue: Sentido cristológico de τελειωθεὶς aplicado a Jesus
  choice: tendo sido levado à plena realização
  alternative: tendo sido aperfeiçoado; tendo sido levado à perfeição
  rationale: A escolha apresenta a chegada de Jesus ao objetivo pleno de sua missão sacerdotal e redentora, sem interpretar o termo como passagem de deficiência moral para santidade. A nota preserva as alternativas formais.
- issue: Alcance e condição em πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: para todos os que lhe obedecem
  alternative: para todos os que o escutam; a todos os que lhe obedecem
  rationale: O texto grego fala expressamente dos que obedecem a ele. A tradução não substitui essa linguagem por “creem” nem a amplia segundo um sistema doutrinário particular.
- issue: Força causal de αἴτιος
  choice: a fonte
  alternative: o autor; a causa
  rationale: “Fonte” preserva a agência causal de Cristo em relação à salvação sem resolver além do que o termo grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Plena realização” é empregada em sentido de cumprimento completo de um propósito, não no sentido moderno de realização pessoal. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade.
