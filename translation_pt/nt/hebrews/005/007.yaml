id: HEB.5.7
reference: Hebrews 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: pt
  text: Ele, nos dias da sua carne, tendo oferecido, com forte clamor e lágrimas, tanto orações como súplicas àquele que era capaz de salvá-lo da morte[a], e tendo sido ouvido por causa da sua reverência[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Salvá-lo da morte” também pode ser entendido como ser salvo para fora da morte, isto é, ser libertado dela por meio da ressurreição.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “por causa do seu temor piedoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: nos dias da sua carne
  rationale: Preserva a expressão concreta do grego e sua ênfase na condição humana e corporal de Jesus, sem reduzi-la interpretativamente a “durante sua vida terrena”.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: tanto orações como súplicas
  rationale: Usa termos naturais e dignos em português; “súplicas” comunica o caráter intenso dos apelos e mantém alguma distinção em relação a “orações”.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: àquele que podia salvá-lo da morte
  rationale: Representa o particípio substantivado e conserva, tanto quanto possível em português, a abertura de ἐκ θανάτου entre livramento de morrer e livramento para fora da morte.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: com forte clamor e lágrimas
  rationale: Mantém o singular de κραυγή e expressa de modo natural a intensidade indicada por ἰσχυρά.
- source_word: προσενέγκας
  choice: tendo oferecido
  rationale: Reflete o particípio aoristo e preserva a possível ressonância sacrificial de προσφέρω no contexto sacerdotal de Hebreus.
- source_word: εἰσακουσθεὶς
  choice: tendo sido ouvido
  rationale: Traduz com precisão o particípio passivo e evita especificar de que modo a oração foi respondida.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: por causa da sua reverência
  rationale: “Reverência” corresponde de perto ao campo semântico de εὐλάβεια sem acrescentar explicitamente a ideia interpretativa de submissão; a alternativa “temor piedoso” é registrada em nota.
theological_decisions:
- issue: Sentido de ἀπὸ τῆς εὐλαβείας em relação a Jesus
  choice: por causa da sua reverência
  alternative: por causa do seu temor piedoso
  rationale: A formulação principal mantém a postura reverente de Jesus diante de Deus sem sugerir medo impróprio nem inserir “submissão”, termo não expresso diretamente; a alternativa lexical permanece na nota.
- issue: Alcance de “salvá-lo da morte”
  choice: manter “salvá-lo da morte” sem definir o modo do livramento
  alternative: salvá-lo para fora da morte, isto é, livrá-lo por meio da ressurreição
  rationale: ἐκ θανάτου pode apontar para preservação da morte ou para libertação para fora dela. A tradução não decide entre essas possibilidades e a nota explicita a segunda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial e a vírgula final foram mantidas porque o versículo continua sintaticamente no contexto imediato. Os marcadores foram colocados junto às expressões a que cada nota se refere.
