id: HEB.5.4
reference: Hebrews 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: pt
  text: E ninguém toma para si essa honra, mas é chamado por Deus, assim como Arão também foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τις com οὐχ
  choice: ninguém
  rationale: A combinação da negação com o pronome indefinido é expressa de modo natural em português pelo negativo universal “ninguém”.
- source_word: ἑαυτῷ
  choice: para si
  rationale: O dativo reflexivo indica apropriação pessoal; “para si” comunica naturalmente que a honra não é assumida por iniciativa própria.
- source_word: λαμβάνει
  choice: toma
  rationale: “Toma” preserva o contraste entre apropriar-se da honra e ser chamado por Deus; “recebe” enfraqueceria esse contraste.
- source_word: τὴν τιμήν
  choice: essa honra
  rationale: “Honra” traduz diretamente τιμή, enquanto “essa” retoma de modo natural a dignidade sacerdotal mencionada no contexto imediato, sem substituir o termo por “cargo” ou “ofício”.
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: mas é chamado por Deus
  rationale: A formulação desenvolve o particípio passivo em uma oração coordenada natural em português e mantém Deus como agente do chamado, sem acrescentar a condição explícita “somente quando”.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: assim como também Arão foi
  rationale: “Assim como” preserva a comparação, “também” representa καί, e “foi” explicita o verbo elíptico retomado de “é chamado”.
theological_decisions:
- issue: Natureza da nomeação sacerdotal
  choice: A honra não é assumida pela própria pessoa, mas está ligada ao chamado de Deus, tendo Arão como paradigma.
  alternative: Entender “honra” como uma declaração geral sobre qualquer tipo de honra, não especificamente sobre a dignidade sacerdotal.
  rationale: Hebreus 5:1–5 trata do sumo sacerdócio. Manter “honra”, em vez de explicitar “ofício sacerdotal”, conserva o vocabulário e a tensão do texto, enquanto o demonstrativo remete ao contexto.
- issue: Relação sintática de καλούμενος
  choice: Verter o particípio como “é chamado por Deus”, acompanhando a estrutura contrastiva do período.
  alternative: “mas somente quando chamado por Deus”, tornando explícita uma condição implícita.
  rationale: A alternativa é interpretativamente possível, mas “somente quando” não aparece de forma expressa no grego. A redação escolhida é fiel e natural sem ampliar a formulação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Arão” segue a forma bíblica portuguesa consagrada. Não se acrescentou nota, pois “essa honra” comunica adequadamente a referência contextual sem ocultar uma alternativa relevante.
