  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: pt
  text: capaz de tratar com brandura os que não sabem e se desviam[a], pois ele mesmo também está cercado de fraqueza[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “são desviados”. O particípio grego pode ter nuance passiva.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “está envolto em” ou “está vestido de” fraqueza.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: tratar com brandura
  rationale: Expressa uma reação comedida e paciente, sem sugerir nem dureza nem mera emoção; é natural e digna em português.
- source_word: δυνάμενος
  choice: capaz de
  rationale: Preserva a ideia de capacidade contínua do particípio e se encaixa naturalmente na descrição do sumo sacerdote iniciada no contexto.
- source_word: τοῖς ἀγνοοῦσι
  choice: os que não sabem
  rationale: Conserva a força participial e a ideia de agir por ignorância, sem transformar essas pessoas numa classe fixa nem inserir uma categoria sacrificial técnica.
- source_word: πλανωμένοις
  choice: se desviam
  rationale: Comunica o afastamento moral ou espiritual sem especificar indevidamente sua causa ou agente; a possível nuance passiva é registrada em nota.
- source_word: ἐπεὶ
  choice: pois
  rationale: Introduz de modo claro e idiomático a razão pela qual o sacerdote pode agir com brandura.
- source_word: καὶ αὐτὸς
  choice: ele mesmo também
  rationale: Mantém tanto a ênfase pessoal de αὐτός quanto a força aditiva de καί, ligando o sacerdote à condição daqueles a quem serve.
- source_word: περίκειται ἀσθένειαν
  choice: está cercado de fraqueza
  rationale: Preserva a imagem de uma fraqueza que envolve a pessoa, mantendo a amplitude de ἀσθένεια e evitando restringi-la à debilidade física ou moral.
theological_decisions:
- issue: Natureza da falha descrita por ἀγνοοῦσι καὶ πλανωμένοις
  choice: Pessoas que não sabem e se desviam, em sentido amplo.
  alternative: Alusão estritamente técnica aos pecados não intencionais no sistema levítico.
  rationale: Embora a linguagem tenha ressonância sacerdotal veterotestamentária, a expressão grega é mais ampla; a tradução não impõe uma limitação técnica.
- issue: Sentido de ἀσθένεια em relação ao sumo sacerdote
  choice: fraqueza humana em sentido amplo
  alternative: Fraqueza especificamente física ou especificamente moral.
  rationale: O termo pode abranger a fragilidade própria da condição humana; “fraqueza” mantém essa amplitude sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tratar com brandura” evita tanto um registro excessivamente técnico quanto uma formulação sentimental. A pontuação final mantém a continuidade sintática com o contexto.
