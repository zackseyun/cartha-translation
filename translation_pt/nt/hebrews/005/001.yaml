id: HEB.5.1
reference: Hebrews 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: pt
  text: Pois todo sumo sacerdote, sendo tomado dentre os homens, é constituído em favor dos homens nas coisas referentes a Deus, a fim de oferecer tanto dádivas como sacrifícios pelos pecados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: todo
  rationale: O singular distributivo com ἀρχιερεύς apresenta uma afirmação geral sobre cada ocupante do ofício.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que sustenta o argumento anterior e mantém clara a ligação discursiva.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Designação portuguesa tradicional, precisa e amplamente compreensível para o ofício cultual judaico.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: sendo tomado dentre os homens
  rationale: Preserva a forma passiva do particípio e a linguagem humana masculina do texto, pertinente também ao caráter historicamente masculino do ofício mencionado.
- source_word: ὑπὲρ ἀνθρώπων
  choice: em favor dos homens
  rationale: Expressa a ideia de benefício e representação própria de ὑπέρ, repetindo a referência masculina do original.
- source_word: καθίσταται
  choice: é constituído
  rationale: Comunica que alguém é colocado formalmente no ofício, sem especificar no verbo quem o designa.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nas coisas referentes a Deus
  rationale: Mantém de modo natural o alcance aberto do idioma grego para assuntos de culto e serviço relacionados a Deus.
- source_word: ἵνα προσφέρῃ
  choice: a fim de oferecer
  rationale: Expressa claramente a finalidade indicada por ἵνα com o subjuntivo.
- source_word: δῶρά τε καὶ θυσίας
  choice: tanto dádivas como sacrifícios
  rationale: Reproduz a correlação τε καὶ e preserva os dois termos cultuais distintos.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: pelos pecados
  rationale: É a expressão portuguesa idiomática para ofertas feitas em relação aos pecados no contexto sacrificial.
theological_decisions:
- issue: Linguagem representativa masculina em ἀνθρώπων
  choice: homens nas duas ocorrências
  alternative: seres humanos; pessoas
  rationale: O grego repete ἀνθρώπων. “Homens” conserva a forma representativa masculina e se ajusta ao ofício sacerdotal historicamente masculino, sem negar que o sumo sacerdote representa o povo humano.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A formulação permanece próxima da sintaxe grega, mas usa conectivos e locuções naturais. Não se acrescentou nota, pois a alternativa inclusiva não é necessária para compreender o sentido e o texto principal preserva deliberadamente a linguagem masculina da fonte.
