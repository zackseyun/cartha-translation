id: HEB.12.14
reference: Hebrews 12:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: pt
  text: Busquem a paz com todos e a santidade[a], sem a qual ninguém verá o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santificação”. O termo grego pode indicar tanto a santidade como qualidade ou modo de vida quanto a santificação como estado ou processo de tornar-se santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: a paz
  rationale: No contexto de μετὰ πάντων, refere-se sobretudo à paz nas relações com as outras pessoas, não apenas a uma disposição interior.
- source_word: διώκετε
  choice: Busquem
  rationale: O imperativo plural expressa empenho ativo e persistente. “Busquem” é claro e natural em português; o contexto exortativo comunica que não se trata de uma procura passiva.
- source_word: μετὰ πάντων
  choice: com todos
  rationale: Preserva de modo conciso e natural o alcance universal da expressão grega, referida a todas as pessoas.
- source_word: τὸν ἁγιασμόν
  choice: a santidade
  rationale: ἁγιασμός pode indicar tanto santidade como condição e modo de vida quanto santificação como processo. “Santidade” é corrente, compreensível e adequada à exortação; a alternativa é preservada em nota.
- source_word: οὗ χωρὶς
  choice: sem a qual
  rationale: O pronome relativo masculino singular retoma naturalmente ἁγιασμός; em português, a concordância feminina corresponde a “santidade”.
- source_word: οὐδεὶς ὄψεται
  choice: ninguém verá
  rationale: Reproduz diretamente a negação absoluta e o futuro do verbo ὁράω em linguagem portuguesa natural.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Preserva o título κύριος sem identificar de forma mais específica o referente do que o texto grego permite.
theological_decisions:
- issue: Sentido de ἁγιασμός na exortação
  choice: santidade
  alternative: santificação
  rationale: “Santidade” comunica de maneira direta a realidade ética e religiosa que deve ser buscada, enquanto “santificação” pode soar mais técnica e enfatizar o estado ou processo de tornar-se santo. A nota mantém a amplitude lexical do grego.
- issue: Referente de “o Senhor”
  choice: Manter o título sem explicitação
  alternative: Deus; o Senhor Jesus
  rationale: O texto grego traz apenas τὸν κύριον. A tradução conserva essa formulação e não elimina a possível amplitude da referência no contexto bíblico e cristão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa preserva o paralelismo da exortação grega. O marcador foi colocado junto a “santidade”, termo ao qual a nota lexical se refere.
