id: HEB.12.1
reference: Hebrews 12:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: pt
  text: Portanto, também nós, visto que temos ao nosso redor tão grande nuvem de testemunhas, livremo-nos de todo peso e do pecado que tão facilmente nos enreda[a], e corramos com perseverança a corrida que está diante de nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do pecado que se apega tão de perto a nós” ou “do pecado que facilmente nos enlaça”. O adjetivo grego é raro e pode destacar a ideia de enredar, enlaçar ou aderir de perto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Portanto
  rationale: Conjunção inferencial que apresenta a exortação como conclusão do argumento anterior, especialmente dos exemplos de fé do capítulo 11.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: tão grande nuvem de testemunhas
  rationale: Preserva a metáfora da nuvem e a intensidade de τοσοῦτον, comunicando uma multidão vasta.
- source_word: περικείμενον ἡμῖν
  choice: ao nosso redor
  rationale: Expressa de modo natural que as testemunhas estão dispostas em volta, sem decidir se são espectadores ativos.
- source_word: μαρτύρων
  choice: testemunhas
  rationale: Mantém o sentido de pessoas que dão testemunho; no contexto, remete aos fiéis do capítulo 11, sem excluir as ressonâncias da imagem atlética.
- source_word: ὄγκον ... πάντα
  choice: todo peso
  rationale: Preserva a imagem atlética de remover tudo o que torna o corredor pesado ou dificulta seu avanço.
- source_word: ἀποθέμενοι
  choice: livremo-nos
  rationale: O particípio acompanha a exortação principal e indica a remoção decidida dos impedimentos. A forma exortativa é natural em português e mantém a ligação com “corramos”.
- source_word: εὐπερίστατον
  choice: que tão facilmente nos enreda
  rationale: No contexto da corrida, comunica com clareza a ideia de algo que prende e impede. Como o adjetivo é raro e seu sentido exato é discutido, outras possibilidades são registradas em nota.
- source_word: ἁμαρτίαν
  choice: o pecado
  rationale: Mantém o artigo grego e apresenta o pecado concretamente como impedimento, sem identificar um pecado específico.
- source_word: δι’ ὑπομονῆς
  choice: com perseverança
  rationale: Expressa constância firme em meio à dificuldade e soa natural na exortação atlética.
- source_word: τρέχωμεν
  choice: corramos
  rationale: Reproduz diretamente o subjuntivo exortativo na primeira pessoa do plural.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: a corrida que está diante de nós
  rationale: Embora ἀγών possa indicar disputa ou luta, o verbo “correr” favorece “corrida”; a formulação preserva a ideia do percurso colocado diante dos participantes.
theological_decisions:
- issue: Sentido de “testemunhas” em relação a Hebreus 11
  choice: Pessoas cuja vida dá testemunho da fé, enquanto a imagem de estarem ao redor reforça a exortação
  alternative: Espectadores celestiais que observam ativamente os fiéis em sua corrida
  rationale: O contexto imediato remete aos exemplos do capítulo 11. A tradução conserva “testemunhas” e a imagem espacial sem afirmar que elas estejam observando ativamente, preservando a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o movimento exortativo e a metáfora atlética sem rigidez excessiva. O marcador da nota foi colocado junto à expressão ambígua a que se refere.
