    issue: A alternativa «do pecado que facilmente nos apanha» na nota é semanticamente imprecisa.
    rationale: «Apanhar» pode significar simplesmente capturar ou alcançar; não comunica de modo suficiente a noção figurada de prender numa armadilha ou enredar, relevante para εὐπερίστατον e para a metáfora da corrida. «Enlaça» preserva melhor essa possibilidade lexical.
