id: HEB.12.16
reference: Hebrews 12:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: pt
  text: que ninguém seja sexualmente imoral nem profano como Esaú, que, em troca de uma única refeição, vendeu os seus direitos de primogênito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: sexualmente imoral
  rationale: Expressa de modo claro e atual a pessoa que pratica imoralidade sexual, sem restringir indevidamente o termo a uma forma específica.
- source_word: βέβηλος
  choice: profano
  rationale: Preserva a ideia de alguém que despreza ou trata como comum o que é sagrado; é mais próximo do sentido lexical do que uma formulação que explicite ateísmo ou irreligiosidade.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: em troca de uma única refeição
  rationale: Reproduz naturalmente a relação de troca e a ênfase em uma só porção de comida.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: os seus direitos de primogênito
  rationale: O plural neutro designa o conjunto de privilégios ligados à primogenitura; esta formulação é clara para leitores modernos.
theological_decisions:
- issue: Relação de Esaú com os qualificativos πόρνος e βέβηλος
  choice: 'Manter a construção compacta: “sexualmente imoral nem profano como Esaú”'
  alternative: Pontuar ou reformular de modo que apenas “profano” descreva Esaú
  rationale: A sintaxe grega admite discussão sobre se Esaú exemplifica ambos os termos ou especialmente o segundo. A tradução mantém a ambiguidade estrutural em vez de a resolver explicitamente.
- issue: Sentido de βέβηλος
  choice: profano
  alternative: sem Deus / ímpio
  rationale: “Profano” conserva a tensão do termo, que caracteriza desprezo pelas coisas sagradas, sem importar uma afirmação mais específica de ausência de fé em Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Direitos de primogênito” esclarece o referente cultural sem recorrer a vocabulário excessivamente técnico.
