id: HEB.12.15
reference: Hebrews 12:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: pt
  text: cuidando para que ninguém fique aquém da graça de Deus[a]; para que nenhuma raiz de amargura, brotando, cause perturbação e, por meio dela, muitos sejam contaminados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixe de alcançar a graça de Deus”. A expressão grega pode indicar tanto não atingir o que é oferecido como ficar aquém disso.'
    reason: lexical_alternative
  - marker: b
    text: “Raiz de amargura” provavelmente faz eco a Deuteronômio 29:18, onde uma raiz venenosa simboliza a infidelidade à aliança que se espalha dentro da comunidade.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: cuidando
  rationale: O particípio presente expressa vigilância ativa e responsável. “Cuidando” é natural em português e se liga adequadamente às advertências seguintes.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: para que ninguém fique aquém da graça de Deus
  rationale: “Ficar aquém” preserva a ideia de não alcançar ou deixar de atingir, sem decidir se a advertência se refere à perda, à não obtenção ou ao afastamento da graça.
- source_word: χάριτος
  choice: graça
  rationale: É o equivalente corrente e teologicamente reconhecível, preservando a amplitude do favor gracioso de Deus.
- source_word: ῥίζα πικρίας
  choice: raiz de amargura
  rationale: Reproduz de perto a construção grega e conserva a provável alusão a Deuteronômio 29:18, sem reduzir a expressão a mero ressentimento psicológico.
- source_word: ἄνω φύουσα
  choice: brotando
  rationale: Comunica com naturalidade a imagem vegetal de uma raiz que emerge e cresce.
- source_word: ἐνοχλῇ
  choice: cause perturbação
  rationale: Expressa o efeito de inquietar, molestar ou causar problemas à comunidade, mantendo um registro digno.
- source_word: δι’ αὐτῆς
  choice: por meio dela
  rationale: Preserva o valor instrumental de διά e a referência gramatical mais natural à raiz.
- source_word: μιανθῶσιν πολλοί
  choice: muitos sejam contaminados
  rationale: “Contaminados” conserva a força moral e cultual de μιαίνω e é mais imediatamente compreensível ao leitor moderno do que “profanados” ou “maculados”.
theological_decisions:
- issue: Se a advertência sobre ficar aquém da graça de Deus implica perda da salvação, fracasso em receber a graça ou afastamento comunitário
  choice: para que ninguém fique aquém da graça de Deus
  alternative: para que ninguém deixe de alcançar a graça de Deus
  rationale: A formulação mantém aberta a amplitude de ὑστερέω com ἀπό e não impõe uma conclusão denominacional sobre apostasia ou perseverança.
- issue: Se “raiz de amargura” designa apenas ressentimento pessoal
  choice: manter literalmente “raiz de amargura” e explicar a provável alusão bíblica em nota
  alternative: raiz amarga
  rationale: A expressão provavelmente evoca Deuteronômio 29:18, onde a imagem aponta para infidelidade nociva que se espalha na comunidade; a tradução não deve restringi-la silenciosamente a uma emoção individual.
- issue: Se μιαίνω deve ser suavizado como simples transtorno social
  choice: contaminados
  alternative: perturbados
  rationale: O verbo tem força moral ou cultual mais séria do que mero incômodo; “contaminados” preserva essa gravidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “para que...; para que...” preserva a sequência de advertências do grego. “Fique aquém” mantém a ambiguidade lexical e teológica, enquanto “contaminados” comunica a força de profanação moral ou cultual sem soar excessivamente arcaico.
