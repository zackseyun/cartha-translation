  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: pt
  text: Pois o nosso Deus é fogo consumidor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eco de Deuteronômio 4:24, onde Deus é descrito como “fogo consumidor”.
    reason: cross_reference
  - marker: b
    text: 'Ou: “um fogo que consome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Expressa de modo natural a função explicativa e causal de γὰρ, ligando a afirmação à exortação e à advertência anteriores; καὶ fica incorporado nessa conexão, sem uma tradução separada e artificial.
- source_word: ὁ θεὸς ἡμῶν
  choice: o nosso Deus
  rationale: É a forma possessiva idiomática em português e preserva a dimensão comunitária e pactual da expressão grega.
- source_word: πῦρ
  choice: fogo
  rationale: Tradução direta do substantivo predicativo, mantendo intacta a metáfora e a evocação bíblica de Deuteronômio 4:24.
- source_word: καταναλίσκον
  choice: consumidor
  rationale: Reproduz de forma concisa o particípio presente que caracteriza o fogo e preserva a formulação tradicional e reconhecível da alusão; a alternativa mais explícita, “que consome”, é indicada em nota.
theological_decisions:
- issue: Descrição metafórica de Deus como fogo
  choice: 'Manter a metáfora direta: “o nosso Deus é fogo consumidor”'
  alternative: “o nosso Deus é como fogo consumidor” ou “o nosso Deus é um fogo que consome”
  rationale: O grego apresenta uma declaração equativa, sem marcador de comparação. A tradução direta conserva a força da advertência e a tensão teológica da imagem, sem transformá-la em símile nem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fogo consumidor” preserva a concisão, a força metafórica e a conhecida formulação intertextual, enquanto as notas esclarecem a referência e a alternativa lexical.
