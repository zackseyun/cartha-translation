  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: pt
  text: 'Pois não podiam suportar o que estava sendo ordenado: “Mesmo que um animal toque no monte[a], será apedrejado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “ou atingido por uma flecha”, em consonância com Êxodo 19:12–13.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: não podiam suportar
  rationale: A expressão negativa com φέρω indica não conseguir tolerar ou suportar; esta formulação é natural em português e preserva a ideia de incapacidade.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do que foi dito anteriormente, preservando a ligação argumentativa do texto.
- source_word: τὸ διαστελλόμενον
  choice: o que estava sendo ordenado
  rationale: O particípio substantivado designa uma determinação autoritativa; a forma progressiva conserva seu aspecto verbal sem especificar além do grego.
- source_word: Κἂν
  choice: Mesmo que
  rationale: 'Representa a combinação de καί e ἐάν, introduzindo uma condição com ênfase inclusiva: a proibição valia até para um animal.'
- source_word: θηρίον
  choice: um animal
  rationale: É claro e atual, sem restringir indevidamente o referente a um animal selvagem.
- source_word: θίγῃ
  choice: toque
  rationale: O subjuntivo presente após a expressão condicional transmite de modo natural a condição eventual em português.
- source_word: τοῦ ὄρους
  choice: no monte
  rationale: Traduz diretamente o referente contextual ao Sinai sem inserir o nome que não aparece neste versículo; 'monte' é a expressão bíblica natural em português.
- source_word: λιθοβοληθήσεται
  choice: será apedrejado
  rationale: Preserva o futuro passivo e expressa claramente a pena determinada, sem linguagem arcaica.
theological_decisions:
- issue: Relação da citação com a ordem dada no Sinai
  choice: Traduzir somente a forma da ordem presente no texto grego do SBLGNT.
  alternative: Acrescentar “ou atravessado por uma flecha”, conforme alguns manuscritos e a formulação associada a Êxodo 19:12–13.
  rationale: O texto-base fornecido termina em λιθοβοληθήσεται. A variante é relevante, mas não deve ser incorporada ao corpo do versículo nem usada para harmonizá-lo silenciosamente com outra tradição textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a conexão discursiva; “monte” preserva a referência contextual sem explicitar “Sinai”; a citação mantém formulação direta e solene.
