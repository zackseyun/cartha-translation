lexical_decisions:
- source_word: οὔπω
  choice: ainda não
  rationale: Expressa naturalmente em português que esse limite não havia sido alcançado até então.
- source_word: μέχρις αἵματος
  choice: até o derramamento de sangue
  rationale: Comunica o limite de uma resistência que chega ao sangue, sem decidir se se trata de ferimento ou morte.
- source_word: ἀντικατέστητε
  choice: resistiram
  rationale: Preserva a ideia de oposição firme e se ajusta ao contexto de conflito.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: contra o pecado
  rationale: Representa de modo idiomático a oposição expressa por πρός com acusativo, sem restringir o referente de pecado.
- source_word: ἀνταγωνιζόμενοι
  choice: na luta
  rationale: Retém a imagem de combate ou competição do particípio e indica a circunstância em que ocorre a resistência.
theological_decisions:
- issue: Referente de “pecado” no contexto
  choice: Manter a formulação ampla “o pecado”.
  alternative: Especificar a oposição pecaminosa dos perseguidores, o pecado pessoal ou a tentação de abandonar a fé.
  rationale: O grego não delimita o referente; a tradução preserva a amplitude e a tensão do texto.
- issue: Alcance de “até o sangue”
  choice: Traduzir como “até o derramamento de sangue”, sem especificar morte.
  alternative: Explicitar martírio ou apenas ferimento físico.
  rationale: A expressão indica resistência levada ao ponto de sangue, mas não determina por si só o resultado exato.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito em “vocês”. A construção mantém a concisão do original e sua imagem de luta.
