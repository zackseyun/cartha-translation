  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: pt
  text: Portanto[a], fortaleçam as mãos caídas e os joelhos enfraquecidos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “ergam as mãos caídas e os joelhos enfraquecidos”. A linguagem ecoa Isaías 35:3 na tradição grega e emprega uma imagem corporal para falar de coragem e perseverança renovadas.'
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Portanto
  rationale: Conjunção inferencial que liga esta exortação à exposição anterior sobre perseverança e disciplina; “portanto” preserva de modo claro e conciso essa relação lógica.
- source_word: παρειμένας χεῖρας
  choice: as mãos caídas
  rationale: A expressão descreve mãos deixadas pender, imagem de desânimo ou exaustão. “Mãos caídas” é natural em português, mantém a metáfora corporal e também corresponde bem ao eco de Isaías 35:3.
- source_word: παραλελυμένα γόνατα
  choice: os joelhos enfraquecidos
  rationale: O particípio perfeito indica joelhos que ficaram debilitados ou sem vigor. “Enfraquecidos” evita a conotação clínica excessiva de “paralisados” e conserva a imagem de cansaço e perda de firmeza.
- source_word: ἀνορθώσατε
  choice: fortaleçam
  rationale: O imperativo exige ação decidida. Embora o verbo possa significar erguer, endireitar ou restaurar, “fortaleçam” comunica naturalmente, neste contexto exortativo, a recuperação da coragem e da capacidade de perseverar, sem eliminar a imagem corporal.
theological_decisions:
- issue: Exortação metafórica por meio da imagem de fraqueza corporal
  choice: Traduzir o imperativo como “fortaleçam”, entendendo a imagem como chamado à renovação da coragem e da perseverança.
  alternative: Traduzir mais formalmente como “ergam as mãos caídas e os joelhos enfraquecidos”.
  rationale: O contexto imediato trata de resistência, disciplina e perseverança, e a formulação ecoa Isaías 35:3 na tradição grega. A escolha preserva os elementos corporais da metáfora, mas expressa de modo idiomático sua força exortativa, sem a reduzir a uma instrução sobre postura física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativo plural “fortaleçam”, natural tanto para leitores brasileiros quanto no português internacional. A tradução mantém a metáfora corporal e explicita em nota a alternativa mais formal e o eco intertextual.
