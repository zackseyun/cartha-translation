source:
  edition: SBLGNT
  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: pt
  text: A voz dele sacudiu a terra naquele tempo, mas agora ele prometeu, dizendo:[a] “Ainda uma vez, farei tremer não somente a terra, mas também o céu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação de Ageu 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: A voz dele
  rationale: Expressa de modo natural em português a relação possessiva do pronome relativo genitivo com “voz” e mantém Deus como referente no contexto imediato.
- source_word: ἐσάλευσεν
  choice: sacudiu
  rationale: Comunica com clareza e força a perturbação da terra no acontecimento passado, distinguindo-a naturalmente do futuro “farei tremer” da citação.
- source_word: τὴν γῆν
  choice: a terra
  rationale: No contraste com “o céu”, designa a esfera terrestre em sentido amplo, e não apenas uma região ou o solo.
- source_word: τότε
  choice: naquele tempo
  rationale: Torna explícito e natural o contraste temporal com “agora”, sem acrescentar uma identificação além do contexto.
- source_word: νῦν δὲ ἐπήγγελται
  choice: mas agora ele prometeu
  rationale: 'Preserva o contraste marcado por δέ e o valor resultativo do perfeito: a promessa feita permanece válida.'
- source_word: Ἔτι ἅπαξ
  choice: Mais uma vez
  rationale: Reproduz de forma idiomática a ideia enfática de uma ocorrência adicional, adequada à formulação profética.
- source_word: σείσω
  choice: farei tremer
  rationale: Expressa o futuro causativo no quadro de uma convulsão cósmica e evita repetição estilística rígida com “sacudiu”.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Equivalente português claro e direto da construção correlativa grega.
- source_word: τὸν οὐρανόν
  choice: o céu
  rationale: Preserva o singular com artigo e forma, com “a terra”, o par cósmico abrangente do texto.
theological_decisions:
- issue: Referente do pronome relativo e sujeito implícito da promessa
  choice: Deus é apresentado como aquele cuja voz sacudiu a terra e que agora fez a promessa.
  alternative: Uma construção impessoal que deixe menos claro o mesmo agente nas duas ações.
  rationale: O contexto imediato e a citação de Ageu identificam o mesmo falante divino; “dele” e “ele” mantêm essa ligação sem acrescentar uma designação doutrinária.
- issue: Alcance da linguagem sobre terra e céu
  choice: “a terra” e “o céu” são mantidos como termos cósmicos amplos.
  alternative: “a região” e “o firmamento” ou “o solo” e “o céu”.
  rationale: A oposição entre γῆ e οὐρανός abrange a ordem criada e preserva a força escatológica da promessa sem especificar indevidamente como ela se cumprirá.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o contraste entre o abalo passado e a promessa futura, bem como o paralelismo cósmico entre terra e céu.
