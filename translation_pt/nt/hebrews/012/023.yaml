id: HEB.12.23
reference: Hebrews 12:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: pt
  text: e à assembleia dos primogênitos inscritos nos céus[a], e a Deus, juiz de todos, e aos espíritos dos justos aperfeiçoados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inscritos no céu”. O grego traz o plural “nos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assembleia
  rationale: Preserva o sentido básico de uma comunidade reunida e se ajusta ao contexto da Sião celestial, sem impor uma conotação institucional posterior.
- source_word: πρωτοτόκων
  choice: primogênitos
  rationale: Traduz o substantivo plural sem acrescentar 'filhos', ausente no grego, e preserva a ideia de condição e privilégio de primogenitura.
- source_word: ἀπογεγραμμένων
  choice: inscritos
  rationale: 'Expressa de modo natural o particípio perfeito passivo: a inscrição já foi realizada e seu resultado permanece, mantendo a imagem de um registro.'
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural explícito do grego e uma formulação natural e elevada em português.
- source_word: κριτῇ θεῷ πάντων
  choice: a Deus, o Juiz de todos
  rationale: Representa a aposição e dá continuidade à série de complementos iniciada no contexto por 'vocês chegaram'.
- source_word: πνεύμασι
  choice: espíritos
  rationale: Conserva o sentido lexical direto, sem acrescentar uma explicação doutrinária que o texto não explicita.
- source_word: δικαίων
  choice: dos justos
  rationale: É uma forma substantivada natural, inclusiva e formal em português, sem limitar o referente a homens.
- source_word: τετελειωμένων
  choice: aperfeiçoados
  rationale: Preserva o particípio perfeito passivo e o tema de perfeição ou consumação recorrente em Hebreus.
theological_decisions:
- issue: Identidade dos 'primogênitos'
  choice: Designação coletiva dos que possuem condição ou privilégio de primogenitura.
  alternative: Cristo como o Primogênito, sendo a assembleia pertencente a ele.
  rationale: O plural πρωτοτόκων favorece fortemente um referente coletivo. A tradução mantém o plural e não acrescenta uma interpretação possessiva.
- issue: Referente dos 'espíritos dos justos aperfeiçoados'
  choice: Seres humanos justos descritos quanto ao seu estado espiritual e aperfeiçoado.
  alternative: Todos os justos em sentido amplo, estejam ou não sem corpo.
  rationale: A redação traduz diretamente a expressão grega, sem especificar além dela uma doutrina detalhada do estado intermediário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação iniciada por “e” e as formas dativas com “a” foram mantidas por se tratar da continuação sintática do versículo anterior.
