id: HEB.12.24
reference: Hebrews 12:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: pt
  text: e a Jesus, mediador de uma nova aliança, e ao sangue aspergido[b], que fala melhor do que Abel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que o sangue de Abel”. O grego diz simplesmente “do que Abel”, provavelmente aludindo ao sangue de Abel, que clamava da terra (Gn 4:10).'
    reason: alternative_reading
  - marker: b
    text: O “sangue aspergido” é sangue sacrificial aplicado por aspersão, evocando imagens de ratificação da aliança e de purificação.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: de uma nova aliança
  rationale: “Aliança” preserva o sentido bíblico e pactual de διαθήκη em Hebreus. A construção sem artigo é traduzida naturalmente como “uma nova aliança”, sem negar sua relação com a nova aliança prometida nas Escrituras.
- source_word: μεσίτῃ
  choice: mediador
  rationale: Termo corrente e preciso para aquele que atua entre as partes e estabelece a relação de aliança.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: αἵματι ῥαντισμοῦ
  choice: ao sangue aspergido
  rationale: Expressa em português natural o sangue empregado em aspersão ritual, preservando a imagem sacrificial e de purificação.
- source_word: κρεῖττον
  choice: melhor
  rationale: Mantém o vocabulário temático de superioridade recorrente em Hebreus e soa natural no contexto.
- source_word: λαλοῦντι
  choice: que fala
  rationale: A oração relativa reproduz com naturalidade o particípio presente que modifica “sangue” e conserva sua personificação.
- source_word: παρὰ τὸν Ἅβελ
  choice: do que Abel
  rationale: O grego menciona simplesmente Abel, sem explicitar “o sangue de Abel”. A formulação concisa preserva a elipse e evita resolver no texto principal uma comparação interpretativamente aberta.
theological_decisions:
- issue: Referente da comparação com Abel
  choice: “que fala melhor do que Abel”
  alternative: “que fala melhor do que o sangue de Abel”
  rationale: O contexto provavelmente alude ao sangue de Abel clamando da terra em Gênesis 4:10, mas o texto grego nomeia Abel diretamente. A tradução mantém essa concisão e registra a explicação provável em nota, sem eliminar a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação iniciada por “e a” foi mantida porque o versículo continua a enumeração do contexto anterior. “Aspergido” conserva a linguagem ritual bíblica sem recorrer à formulação menos natural “sangue da aspersão”.
