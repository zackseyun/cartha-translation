  source_fidelity: 'A tradução preserva adequadamente a estrutura coordenada do grego: chegada a Jesus como mediador de uma nova aliança e ao sangue associado à aspersão. “Mediador”, “nova aliança” e “sangue aspergido” representam bem os termos gregos. “Que fala melhor do que Abel” mantém de modo deliberado e legítimo a elipse de παρὰ τὸν Ἅβελ, sem introduzir no texto principal “o sangue de Abel”.'
  naturalness: O português é moderno, claro e apropriado ao registro bíblico. “E a Jesus ... e ao sangue aspergido” conserva naturalmente a continuação enumerativa do contexto. “Aspergido” é termo ritual estabelecido e compreensível.
