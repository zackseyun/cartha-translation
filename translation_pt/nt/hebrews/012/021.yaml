  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: pt
  text: 'E tão aterrorizante era o que se via[a] que Moisés disse[b]: “Estou apavorado e tremendo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que aparecia” ou “o espetáculo”. A expressão grega se refere à manifestação visível no Sinai.
    reason: lexical_alternative
  - marker: b
    text: Estas palavras não são uma citação literal do Antigo Testamento, mas refletem a reação de medo de Moisés associada ao acontecimento no Sinai; compare Deuteronômio 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Conecta o versículo à descrição anterior do Sinai de modo simples e natural.
- source_word: οὕτω φοβερὸν ἦν
  choice: era tão aterrorizante
  rationale: Preserva a intensidade de οὕτω e a força de φοβερόν em português atual.
- source_word: τὸ φανταζόμενον
  choice: a visão
  rationale: Designa a manifestação visível no Sinai de maneira idiomática, sem especificar além do grego.
- source_word: Μωϋσῆς εἶπεν
  choice: Moisés disse
  rationale: Tradução direta e natural do nome e do verbo narrativo.
- source_word: Ἔκφοβός εἰμι
  choice: Estou apavorado
  rationale: Comunica o medo intenso expresso por ἔκφοβος sem recorrer a uma formulação arcaica.
- source_word: καὶ ἔντρομος
  choice: e tremendo
  rationale: Mantém separadamente o segundo predicativo, que acrescenta a reação física de tremor.
theological_decisions:
- issue: Relação da fala de Moisés com a narrativa do Sinai
  choice: Apresentar diretamente a fala como resposta de Moisés à manifestação aterrorizante.
  alternative: Explicá-la no texto principal como resumo livre de tradições sobre o medo de Moisés.
  rationale: O versículo atribui a declaração a Moisés; a questão de sua relação exata com o Antigo Testamento fica na nota, preservando a tensão intertextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Visão” é natural no contexto, e “apavorado e tremendo” preserva os dois termos gregos e sua progressão emocional e física.
