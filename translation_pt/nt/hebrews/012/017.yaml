reference: Hebrews 12:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: pt
  text: Pois vocês sabem que, mais tarde, quando quis herdar a bênção, ele foi rejeitado, pois não encontrou oportunidade para arrependimento[a], embora a tenha buscado com lágrimas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não encontrou lugar para arrependimento”. A expressão pode significar que não encontrou como reverter o resultado ou que não conseguiu fazer Isaque mudar de decisão.'
    reason: alternative_reading
  - marker: b
    text: O pronome pode se referir à bênção ou ao arrependimento/à oportunidade para arrependimento; o grego não deixa o referente inteiramente claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: vocês sabem
  rationale: O perfeito οἶδα tem sentido presente; “vocês sabem” expressa naturalmente o apelo ao conhecimento dos leitores.
- source_word: μετέπειτα
  choice: mais tarde
  rationale: Advérbio temporal que indica um momento posterior; a expressão é corrente e clara em português.
- source_word: θέλων κληρονομῆσαι
  choice: quando quis herdar
  rationale: A oração temporal torna o particípio fluente em português, preservando a ideia de vontade e o sentido normal de κληρονομέω.
- source_word: τὴν εὐλογίαν
  choice: a bênção
  rationale: Refere-se à bênção paterna específica da narrativa de Esaú, sem explicitar além do texto.
- source_word: ἀπεδοκιμάσθη
  choice: ele foi rejeitado
  rationale: Preserva a voz passiva e a ideia de recusa, sem introduzir um sentido soteriológico técnico.
- source_word: μετανοίας ... τόπον
  choice: oportunidade para arrependimento
  rationale: Traduz de modo idiomático a ideia de encontrar lugar ou possibilidade para arrependimento, mantendo o termo teologicamente relevante sem decidir a quem pertence a mudança de mente.
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας
  choice: embora a tenha buscado com lágrimas
  rationale: Mantém a concessão, a busca insistente sugerida pelo verbo e a maneira emotiva expressa por “com lágrimas”.
- source_word: αὐτήν
  choice: a
  rationale: O pronome feminino pode retomar em português tanto “a bênção” quanto “oportunidade”, conservando em alguma medida a ambiguidade referencial do grego.
theological_decisions:
- issue: Referente de αὐτήν e sentido de μετανοίας τόπον
  choice: O texto principal mantém “oportunidade para arrependimento” e um pronome feminino que pode retomar “bênção” ou “oportunidade”.
  alternative: Entender que Esaú buscou especificamente a bênção, que não pôde reverter o resultado, ou que não conseguiu obter de Isaque uma mudança de decisão.
  rationale: A sintaxe grega não determina de forma inequívoca o referente do pronome nem se a mudança de mente seria de Esaú ou de Isaque. A tradução não deve resolver essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A construção evita linguagem denominacional e conserva, tanto quanto a gramática portuguesa permite, a ambiguidade presente no grego.
