  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: pt
  text: Tenham cuidado para não recusarem aquele que está falando. Pois, se aqueles não escaparam quando recusaram aquele que os advertia na terra[a], muito menos escaparemos nós, se nos afastarmos daquele que fala dos céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que lhes transmitia instrução divina na terra”. O verbo grego pode designar instrução ou advertência comunicada com autoridade divina.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “muito mais nós, os que nos afastamos daquele dos céus”. O grego deixa subentendidos o verbo “escapar” e, na expressão “daquele dos céus”, a referência ao que fala ou comunica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Cuidem
  rationale: O imperativo plural introduz uma exortação solene. “Cuidem” comunica de modo natural a força de “vejam bem” ou “tenham cuidado”.
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: não recusar / recusaram
  rationale: A repetição de “recusar” preserva a ligação verbal entre a advertência dirigida aos leitores e a conduta do grupo anterior.
- source_word: τὸν λαλοῦντα
  choice: aquele que está falando
  rationale: Mantém o particípio presente e a ideia de uma fala que continua a se dirigir aos ouvintes.
- source_word: ἐξέφυγον
  choice: não escaparam
  rationale: Expressa naturalmente a impossibilidade de evitar as consequências ou o juízo, sem acrescentar no texto aquilo de que não escaparam.
- source_word: ἐπὶ γῆς
  choice: na terra
  rationale: Preserva o contraste espacial com ἀπ’ οὐρανῶν sem identificar explicitamente o Sinai.
- source_word: χρηματίζοντα
  choice: aquele que os advertia
  rationale: O verbo pode indicar comunicação ou instrução de autoridade divina. No contexto de exortação e juízo, “advertia” transmite bem sua força, enquanto a nota registra a alternativa.
- source_word: πολὺ μᾶλλον
  choice: muito menos escaparemos nós
  rationale: 'Em uma comparação negativa do menor para o maior, essa formulação portuguesa torna clara a lógica: se eles não escaparam, nós tampouco escaparemos, com razão ainda maior.'
- source_word: ἀποστρεφόμενοι
  choice: se nos afastarmos
  rationale: Torna explícito o valor circunstancial do particípio e comunica rejeição deliberada sem empregar terminologia doutrinária mais específica.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: daquele que fala dos céus
  rationale: A expressão grega é elíptica. Retomar “fala” da primeira oração produz português claro, mantém o contraste entre terra e céus e evita identificar nominalmente o personagem.
theological_decisions:
- issue: Identidade daquele que fala e adverte
  choice: Manter as descrições “aquele que está falando”, “aquele que os advertia” e “aquele que fala dos céus”
  alternative: Identificá-lo explicitamente como Deus ou como Cristo
  rationale: O contexto aponta para fala divina, mas o versículo não emprega nome nem título. A tradução preserva essa forma descritiva e não resolve além do texto a identidade precisa do falante.
- issue: Elipse do verbo “escapar” na segunda parte
  choice: Explicitar “escaparemos”
  alternative: 'Reproduzir literalmente a construção incompleta: “muito mais nós, os que nos afastamos...”'
  rationale: O grego deixa o verbo subentendido a partir da oração anterior. Repeti-lo em português torna a frase inteligível sem alterar o argumento teológico.
- issue: Verbo subentendido em τὸν ἀπ’ οὐρανῶν
  choice: 'Retomar a ideia de fala: “daquele que fala dos céus”'
  alternative: “daquele que adverte dos céus” ou a forma mais literal “daquele dos céus”
  rationale: O substantivado grego não repete o verbo. A retomada de “fala” liga a expressão a τὸν λαλοῦντα e evita restringir toda a comunicação celestial ao sentido de advertência.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. O plural “céus” acompanha o grego e é natural no registro bíblico. A construção evita vocabulário arcaico e preserva a progressão retórica do menor para o maior.
