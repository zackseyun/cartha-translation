id: HEB.12.2
reference: Hebrews 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: pt
  text: mantendo os olhos fixos em Jesus[a], o pioneiro e aperfeiçoador da fé, que, em vista da alegria que estava diante dele, suportou a cruz, desprezando a vergonha[b], e assentou-se à direita do trono de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pioneiro e aperfeiçoador da fidelidade”, ou “o pioneiro e aperfeiçoador da nossa fé”. A expressão grega é compacta, e πίστις também pode significar “fidelidade” ou referir-se especificamente à fé dos que creem.
    reason: alternative_reading
  - marker: b
    text: Ou “não dando importância à vergonha”. O sentido é que ele tratou a desonra da crucificação como algo que não seria decisivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: mantendo os olhos fixos em
  rationale: Expressa o ato contínuo de desviar a atenção de outras coisas e concentrá-la em Jesus, em linguagem portuguesa natural e coerente com a imagem da corrida.
- source_word: ἀρχηγὸν
  choice: pioneiro
  rationale: Preserva tanto a ideia daquele que inicia quanto a daquele que abre o caminho e segue à frente; evita a conotação predominantemente literária de “autor”.
- source_word: τελειωτὴν
  choice: aperfeiçoador
  rationale: Indica aquele que conduz algo à plena realização ou ao fim pretendido, mantendo a relação semântica com τελειόω.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: Mantém o genitivo grego compacto sem acrescentar o possessivo “nossa”; a possível referência à fidelidade ou à fé dos crentes é preservada em nota.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Em vista da alegria que estava diante dele
  rationale: Comunica que a alegria futura serviu de perspectiva motivadora, preservando a imagem de algo posto adiante e evitando que “por causa da alegria” sugira causalidade excessivamente definida.
- source_word: ὑπέμεινεν
  choice: suportou
  rationale: Traduz a perseverança firme em meio ao sofrimento e se ajusta naturalmente ao objeto “a cruz”.
- source_word: σταυρὸν
  choice: a cruz
  rationale: Embora sem artigo no grego, a referência contextual à crucificação de Jesus é definida e pede artigo em português.
- source_word: αἰσχύνης καταφρονήσας
  choice: desprezando a vergonha
  rationale: Mantém a força do particípio e comunica que Jesus considerou a desonra da crucificação como algo sem peso decisivo.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: à direita do trono de Deus
  rationale: Preserva a imagem de exaltação e o lugar de honra e autoridade, em formulação idiomática portuguesa.
- source_word: κεκάθικεν
  choice: assentou-se
  rationale: O pretérito perfeito é natural em português e, no contexto, descreve a entronização consumada; o resultado permanente é inerente à imagem e ao perfeito grego.
theological_decisions:
- issue: Sentido de τῆς πίστεως com ἀρχηγὸν καὶ τελειωτὴν
  choice: Jesus é chamado de pioneiro e aperfeiçoador “da fé”, sem pronome possessivo.
  alternative: “da fidelidade” ou “da nossa fé”
  rationale: 'A expressão grega é compacta e permite mais de uma relação: Jesus pode ser apresentado em relação à fé dos crentes ou à fidelidade plenamente demonstrada por ele. O texto principal conserva a formulação não expandida, e a nota registra as alternativas.'
- issue: Força de ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Jesus suportou a cruz em vista da alegria colocada diante dele.
  alternative: Jesus suportou a cruz em vez de desfrutar a alegria que estava diante dele.
  rationale: Embora ἀντί possa significar “em vez de”, o contexto de perseverança rumo a um objetivo favorece a alegria futura como perspectiva motivadora, sem eliminar totalmente a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mantendo os olhos fixos” retoma naturalmente a exortação do versículo anterior; “pioneiro” conserva a imagem daquele que abre o caminho; e “aperfeiçoador” mantém a ideia de conduzir à plena realização. Todos os marcadores de nota aparecem no texto principal.
