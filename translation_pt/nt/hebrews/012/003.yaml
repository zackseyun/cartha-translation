id: HEB.12.3
reference: Hebrews 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: pt
  text: Pois considerem aquele que suportou tamanha oposição dos pecadores contra si mesmos[a], para que vocês não se cansem nem desanimem interiormente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “contra ele”, isto é, contra Jesus. O texto do SBLGNT traz “contra si mesmos”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “desfaleçam em suas almas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: considerem
  rationale: O imperativo pede reflexão deliberada e cuidadosa; “considerem” é natural, conciso e mantém a força exortativa.
- source_word: τοιαύτην
  choice: tamanha
  rationale: Qualifica a oposição suportada e comunica sua intensidade no contexto, sem ampliar o sentido além do permitido pela expressão grega.
- source_word: ὑπομεμενηκότα
  choice: aquele que suportou
  rationale: O particípio perfeito aponta para a perseverança de Jesus diante da oposição, com relevância contínua para os leitores.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: dos pecadores
  rationale: Preserva de modo direto a caracterização moral do substantivo adjetival grego e identifica a origem da oposição.
- source_word: εἰς ἑαυτοὺς ἀντιλογίαν
  choice: oposição dos pecadores contra si mesmos
  rationale: “Oposição” expressa adequadamente ἀντιλογία. O texto impresso do SBLGNT traz o plural reflexivo “contra si mesmos”; embora difícil, essa leitura é mantida no texto principal, e a variante contextual “contra si” é registrada em nota.
- source_word: κάμητε
  choice: não se cansem
  rationale: O verbo indica ficar cansado ou exausto; a formulação é atual e se combina naturalmente com a expressão seguinte.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: nem desanimem em sua alma
  rationale: A coordenação idiomática em português comunica o desfalecimento interior expresso pelo particípio, enquanto “em sua alma” preserva a linguagem antropológica de ψυχή.
theological_decisions:
- issue: Referente de “aquele”
  choice: Manter “aquele”, com Jesus como referente contextual
  alternative: Explicitar “Jesus” no versículo
  rationale: Hebreus 12:2 identifica Jesus imediatamente antes. Manter a expressão pronominal respeita a forma do grego sem obscurecer o referente.
- issue: Referente do pronome reflexivo em εἰς ἑαυτούς
  choice: 'Seguir no texto principal o SBLGNT: “contra si mesmos”'
  alternative: 'Adotar a variante singular: “contra si” (isto é, contra Jesus)'
  rationale: A forma impressa no SBLGNT é plural e cria uma expressão difícil, porém genuína. Para não substituir silenciosamente o texto-base por uma variante e não eliminar a tensão textual, a leitura plural aparece no texto e a variante singular, contextualmente clara, na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A tradução mantém a difícil leitura do SBLGNT no texto principal e esclarece a variante manuscrita em nota. O singular coletivo “sua alma” acompanha o grego e denota a vida interior de cada leitor.
