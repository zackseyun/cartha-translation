  naturalness: «Considerem», «tamanha oposição» e «não se cansem nem desanimem interiormente» são naturais em português moderno. A formulação «contra si mesmos» permanece estranha porque reproduz deliberadamente a dificuldade da leitura impressa no texto-base; a nota a esclarece.
  terminology: «Pecadores», «oposição», «suportou» e «desanimem» são escolhas adequadas e de registro digno. «Interiormente» comunica de modo idiomático o âmbito de ταῖς ψυχαῖς ὑμῶν sem introduzir uma antropologia diferente.
