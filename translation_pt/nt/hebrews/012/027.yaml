source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: pt
  text: A expressão “Mais uma vez” indica a remoção das coisas que estão sendo abaladas — como coisas que foram feitas — para que permaneçam as coisas que não estão sendo abaladas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas que não podem ser abaladas” ou “o que é inabalável”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: A expressão “Mais uma vez”
  rationale: O artigo neutro substantiva as palavras citadas, tratando-as como uma expressão. δέ tem força conectiva leve, que não exige uma conjunção explícita em português. “Mais uma vez” retoma naturalmente a citação anterior.
- source_word: δηλοῖ
  choice: indica
  rationale: Introduz a explicação ou inferência extraída da expressão citada; “indica” é claro, atual e próximo do valor do verbo grego.
- source_word: τῶν σαλευομένων
  choice: das coisas que estão sendo abaladas
  rationale: Preserva o particípio presente passivo e seu contraste formal com τὰ μὴ σαλευόμενα.
- source_word: μετάθεσιν
  choice: a remoção
  rationale: No contexto, designa tirar ou deslocar o que é abalável, e não apenas modificá-lo. “Remoção” comunica esse sentido sem acrescentar pormenores não expressos.
- source_word: ὡς πεποιημένων
  choice: por serem coisas que foram feitas
  rationale: Expressa a relação apresentada por ὡς e preserva o perfeito passivo de ποιέω. A formulação caracteriza essas realidades como pertencentes à ordem das coisas feitas, sem exigir no texto principal a opção mais interpretativa “criadas”.
- source_word: ἵνα μείνῃ
  choice: para que permaneçam
  rationale: Traduz com naturalidade a finalidade ou o resultado indicado por ἵνα com o subjuntivo.
- source_word: τὰ μὴ σαλευόμενα
  choice: as coisas que não estão sendo abaladas
  rationale: Mantém o paralelismo dos particípios presentes e evita transformar a negação em uma afirmação explícita de incapacidade, embora “que não podem ser abaladas” seja uma alternativa contextual válida.
theological_decisions:
- issue: Se τὰ μὴ σαλευόμενα deve ser interpretado como incapacidade de ser abalado ou traduzido segundo o paralelismo participial do versículo
  choice: as coisas que não estão sendo abaladas
  alternative: as coisas que não podem ser abaladas / o que é inabalável
  rationale: O grego contrapõe literalmente as coisas sendo abaladas às coisas não sendo abaladas. A escolha conserva essa tensão e não antecipa a formulação mais explícita sobre o reino inabalável no versículo seguinte.
- issue: Como representar ὡς πεποιημένων
  choice: por serem coisas que foram feitas
  alternative: como coisas que foram feitas / por serem coisas criadas
  rationale: Aqui ὡς pode apresentar a qualidade ou fundamento sob o qual ocorre a remoção. “Por serem” torna inteligível essa relação em português, enquanto a nota preserva a alternativa lexical mais compacta “criadas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “coisas” e o paralelismo de “estão sendo abaladas / não estão sendo abaladas” foram mantidos para refletir a estrutura e a tensão do grego.
