id: HEB.12.8
reference: Hebrews 12:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: pt
  text: Mas, se vocês estão sem disciplina, da qual todos se tornaram participantes, então são filhos ilegítimos e não filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos ilegítimos e não filhos”. O contraste refere-se ao status familiar reconhecido na imagem empregada pelo autor.
    reason: Esclarece o contraste social e familiar de νόθοι e υἱοί sem introduzir “legítimos” como se estivesse expresso no texto grego.
lexical_decisions:
- source_word: παιδείας
  choice: disciplina
  rationale: No contexto, refere-se à formação e correção próprias da relação entre pai e filho; “disciplina” preserva essa amplitude melhor que uma opção limitada a castigo.
- source_word: μέτοχοι
  choice: participantes
  rationale: Expressa de modo natural a participação comum nessa disciplina, sem acrescentar uma ideia não explicitada de benefício ou sofrimento.
- source_word: νόθοι
  choice: filhos ilegítimos
  rationale: Reproduz a imagem social e familiar do termo grego, que designa filhos não reconhecidos como legítimos, evitando o tom hoje excessivamente ofensivo de “bastardos”.
- source_word: υἱοί
  choice: filhos legítimos
  rationale: Embora o grego diga literalmente “filhos”, o contraste explícito com νόθοι torna implícita a condição legítima; ela é expressa em português para que a oposição permaneça clara.
theological_decisions:
- issue: Alcance de πάντες (“todos”)
  choice: todos
  alternative: todos os filhos de Deus
  rationale: Mantém a formulação abrangente e a referência contextual implícita, sem inserir no texto uma delimitação interpretativa.
- issue: Contraste entre νόθοι e υἱοί
  choice: “filhos ilegítimos” e “filhos legítimos”
  alternative: “filhos ilegítimos e não filhos”
  rationale: O contraste antigo diz respeito ao status reconhecido dos filhos, não à negação literal de descendência. A explicitação mínima evita uma leitura enganosa em português.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A imagem familiar e jurídica do original foi preservada sem recorrer a vocabulário arcaico ou pejorativo.
source_grounding:
  english_pob_role: consult_only
