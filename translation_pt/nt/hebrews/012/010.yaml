id: HEB.12.10
reference: Hebrews 12:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: pt
  text: Pois eles nos disciplinavam por poucos dias[a], conforme lhes parecia melhor[b]; ele, porém, nos disciplina para o nosso bem, a fim de participarmos da sua santidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por um breve período”. A expressão grega ressalta a duração limitada da disciplina dos pais terrenos.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme lhes parecia certo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: por poucos dias
  rationale: Mantém a imagem temporal concreta do grego e ressalta a duração limitada da disciplina dos pais terrenos; em português, também pode funcionar idiomaticamente como referência a um período breve.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: conforme lhes parecia melhor
  rationale: Expressa o julgamento subjetivo dos pais terrenos sem afirmar que sua avaliação era necessariamente correta ou perfeita.
- source_word: ἐπαίδευον
  choice: nos disciplinavam
  rationale: No contexto de Hebreus 12, o verbo abrange correção e formação parental, não apenas castigo. O imperfeito é preservado por “disciplinavam”.
- source_word: ὁ δὲ
  choice: ele, porém, nos disciplina
  rationale: O sujeito implícito é Deus, em contraste com os pais terrenos. O pronome preserva a formulação implícita do grego, enquanto a repetição do verbo torna a elipse natural em português.
- source_word: ἐπὶ τὸ συμφέρον
  choice: para o nosso bem
  rationale: Comunica de modo claro a finalidade benéfica da disciplina divina, com o elemento pessoal exigido pelo contexto.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: a fim de participarmos
  rationale: Preserva a força de finalidade da construção e traduz μεταλαμβάνω como participação real, sem definir além do texto a natureza dessa participação.
- source_word: ἁγιότητος αὐτοῦ
  choice: da sua santidade
  rationale: “Santidade” é o equivalente corrente e teologicamente adequado para ἁγιότης; “sua” mantém a referência pronominal a Deus.
theological_decisions:
- issue: Referente do sujeito singular contrastante ὁ δὲ
  choice: Deus é o referente, expresso pelo pronome “ele”.
  alternative: Explicitar “Deus” no texto.
  rationale: O contexto identifica claramente Deus como Pai em contraste com os pais terrenos. O pronome conserva a implicitidade do original sem prejudicar a compreensão.
- issue: Sentido de participar da santidade de Deus
  choice: Manter a formulação ampla “participarmos da sua santidade”.
  alternative: Definir a participação exclusivamente como santidade posicional ou exclusivamente como santificação progressiva.
  rationale: O versículo apresenta a participação na santidade divina como finalidade da disciplina, mas não especifica aqui seus mecanismos; a tradução preserva essa amplitude teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, sem eliminar o contraste entre a avaliação limitada dos pais terrenos e o propósito benéfico de Deus.
