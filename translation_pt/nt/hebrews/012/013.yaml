  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: pt
  text: E façam caminhos retos[a] para os seus pés, para que o que é manco não se desvie[b], mas, antes, seja curado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão evoca Provérbios 4:26 e dá continuidade à imagem de uma caminhada disciplinada.
    reason: cross_reference
  - marker: b
    text: Ou “não seja deslocado” ou “não se desloque”; o verbo grego pode ter uma nuance mais médica dentro da metáfora corporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: caminhos
  rationale: Embora o termo possa designar trilhas, pistas ou sulcos, “caminhos” é natural em português e preserva a imagem do percurso da vida.
- source_word: ὀρθὰς
  choice: retos
  rationale: Expressa um percurso direto e devidamente alinhado, além de conservar a provável evocação de Provérbios 4:26.
- source_word: ποιεῖτε
  choice: façam
  rationale: Reproduz de modo direto o imperativo presente, que exorta a uma ação contínua.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: para os seus pés
  rationale: 'O dativo indica proveito ou referência: os caminhos devem ser feitos para os pés dos destinatários.'
- source_word: τὸ χωλὸν
  choice: o que é manco
  rationale: O adjetivo neutro substantivado permanece deliberadamente amplo, sem definir se aponta para uma pessoa vulnerável, uma parte enfraquecida ou uma realidade metafórica.
- source_word: ἐκτραπῇ
  choice: se desvie
  rationale: Preserva o sentido comum de sair do caminho e se ajusta à imagem de caminhar; a possível nuance médica é registrada em nota.
- source_word: ἰαθῇ
  choice: seja curado
  rationale: Mantém o sentido normal de ἰάομαι e prolonga a metáfora corporal e restauradora.
- source_word: μᾶλλον
  choice: mas, antes
  rationale: Marca claramente o contraste entre o resultado a evitar e o resultado desejado.
theological_decisions:
- issue: Sentido metafórico ou estritamente físico da imagem corporal
  choice: Manter no texto a linguagem corporal sem definir seu referente exato.
  alternative: Interpretar “o que é manco” especificamente como cristãos espiritualmente fracos ou apenas como pessoas fisicamente debilitadas.
  rationale: O grego emprega uma imagem corporal em contexto de exortação e não resolve explicitamente se a fraqueza é física, espiritual ou comunitária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e preservação da metáfora do caminhar. A formulação “o que é manco” mantém a ambiguidade do neutro grego sem impor uma interpretação estritamente física ou espiritual.
