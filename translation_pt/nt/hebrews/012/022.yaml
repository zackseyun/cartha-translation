source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: pt
  text: Mas vocês chegaram ao monte Sião e à cidade do Deus vivo, a Jerusalém celestial, e a miríades[a] de anjos em celebração festiva[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Miríades” pode significar literalmente “dezenas de milhares” ou, de modo mais geral, uma multidão incontável.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e a miríades de anjos, a uma celebração festiva”. A sintaxe grega permite entender “celebração festiva” tanto em ligação com os anjos quanto como outro item da série.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com a aproximação ao Sinai descrita nos versículos anteriores, usando o conectivo mais natural em português.
- source_word: προσεληλύθατε
  choice: vocês chegaram
  rationale: O perfeito grego apresenta uma aproximação já realizada cujos efeitos permanecem; o pretérito perfeito em português comunica naturalmente a chegada ao destino no contraste contextual.
- source_word: Σιὼν ὄρει
  choice: ao monte Sião
  rationale: Mantém a imagem geográfica e a forma consagrada e natural do nome em português.
- source_word: πόλει θεοῦ ζῶντος
  choice: à cidade do Deus vivo
  rationale: Preserva o genitivo possessivo e o título teologicamente significativo θεοῦ ζῶντος sem explicitação interpretativa adicional.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: à Jerusalém celestial
  rationale: Reproduz a aposição à cidade do Deus vivo e traduz diretamente o adjetivo ἐπουρανίῳ.
- source_word: μυριάσιν ἀγγέλων
  choice: a miríades de anjos
  rationale: “Miríades” conserva tanto a imagem de dezenas de milhares quanto o sentido ampliado de uma multidão incontável; a nota esclarece a amplitude lexical.
- source_word: πανηγύρει
  choice: reunidos em celebração festiva
  rationale: Expressa uma assembleia pública e jubilosa em português corrente. O particípio “reunidos” liga a celebração aos anjos de modo natural, sem ocultar na nota a outra análise sintática possível.
theological_decisions:
- issue: Relação sintática de πανηγύρει
  choice: 'Liga-se à hoste angelical: “miríades de anjos reunidos em celebração festiva”.'
  alternative: 'Inicia outro item da série: “miríades de anjos, a uma celebração festiva”.'
  rationale: A sequência de dativos permite as duas análises. A ligação com os anjos imediatamente anteriores produz uma leitura coerente e natural, mas a ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para ampla legibilidade brasileira. “Celebração festiva” evita uma formulação excessivamente técnica, enquanto “miríades” preserva o tom elevado e a amplitude numérica do grego. A vírgula final sinaliza que a enumeração prossegue no versículo seguinte.
