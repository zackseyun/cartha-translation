  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: pt
  text: Suportem, tendo em vista a disciplina[a]. Deus os trata como filhos[b]. Pois que filho há a quem um pai não disciplina?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Suportem isto como disciplina”. O grego pode ser entendido tanto como uma exortação a suportar tendo em vista a disciplina quanto a considerar como disciplina aquilo que se suporta.'
    reason: alternative_reading
  - marker: b
    text: 'Grego: “filhos”. O termo reflete a analogia entre pai e filho usada no argumento; a aplicação não se limita aos homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: visando à disciplina
  rationale: Preserva o possível sentido de propósito ou resultado da preposição εἰς sem inserir um objeto ausente no grego. A nota registra a leitura alternativa, segundo a qual aquilo que se suporta deve ser entendido como disciplina.
- source_word: ὑπομένετε
  choice: Suportem
  rationale: A forma pode ser indicativa ou imperativa, mas o contexto favorece a exortação. O verbo sem objeto preserva a concisão e a abertura do original.
- source_word: ὡς υἱοῖς
  choice: como filhos
  rationale: Mantém a comparação relacional e a imagem paterno-filial do argumento, em português natural.
- source_word: προσφέρεται
  choice: trata
  rationale: Neste contexto, o verbo descreve a maneira como Deus procede para com os destinatários; «trata» comunica naturalmente esse sentido idiomático.
- source_word: τίς γὰρ υἱὸς
  choice: Pois que filho há
  rationale: Reproduz com naturalidade a pergunta retórica e mantém o vínculo lexical com «filhos».
- source_word: ὃν οὐ παιδεύει πατήρ
  choice: a quem o pai não disciplina
  rationale: «Disciplina» preserva a ligação lexical com παιδεία e seu sentido formativo e corretivo. O artigo definido é idiomático em português para o pai do filho em questão, sem acrescentar «seu».
theological_decisions:
- issue: Linguagem familiar marcada por gênero na analogia entre pai e filho
  choice: Manter «filhos» no texto principal
  alternative: «filhos e filhas» ou «crianças»
  rationale: O argumento emprega explicitamente a imagem cultural de um pai que disciplina filhos. A tradução conserva essa figura do texto-fonte; a nota esclarece que sua aplicação à comunidade não se restringe aos homens.
- issue: Valor sintático de εἰς παιδείαν com ὑπομένετε
  choice: Exortação a suportar visando à disciplina
  alternative: «Suportem isso como disciplina»
  rationale: A construção grega admite mais de uma compreensão. O texto principal conserva o possível valor de finalidade ou resultado, enquanto a nota apresenta a leitura circunstancial sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Suportem» evita o tom excessivamente solene de «perseverai»; «visando à disciplina» preserva a ambiguidade relevante sem soar técnico demais. Todos os marcadores de nota aparecem no texto principal.
