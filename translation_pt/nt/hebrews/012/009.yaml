id: HEB.12.9
reference: Hebrews 12:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: pt
  text: Além disso, tínhamos nossos pais terrenos[a] como disciplinadores[b] e os respeitávamos. Não nos sujeitaremos, com muito mais razão, ao Pai dos espíritos[c] e viveremos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os pais da nossa carne”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como aqueles que nos disciplinavam”.'
    reason: lexical_alternative
  - marker: c
    text: “O Pai dos espíritos” pode significar especificamente o Pai de nossos espíritos, em contraste com nossos pais terrenos; no grego, porém, a expressão é mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Além disso
  rationale: Introduz mais um argumento na progressão do raciocínio, sem exigir uma sequência estritamente temporal.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: nossos pais terrenos
  rationale: Expressa de modo natural a ascendência humana e corporal, em contraste com o Pai dos espíritos, sem atribuir a σάρξ o sentido de natureza pecaminosa.
- source_word: παιδευτὰς
  choice: disciplinadores
  rationale: Mantém a ligação lexical e temática com a disciplina mencionada no contexto imediato de Hebreus 12.
- source_word: ἐνετρεπόμεθα
  choice: os respeitávamos
  rationale: Comunica a consideração respeitosa demonstrada aos pais que exerciam disciplina.
- source_word: οὐ πολὺ μᾶλλον
  choice: Não... com muito mais razão
  rationale: Preserva tanto a forma de pergunta retórica quanto a força do argumento do menor para o maior.
- source_word: ὑποταγησόμεθα
  choice: nos sujeitaremos
  rationale: Conserva o futuro e a ideia de colocar-se sob a autoridade de alguém, sem acrescentar uma modalidade ausente do grego.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: ao Pai dos espíritos
  rationale: Reproduz a construção genitiva sem restringi-la explicitamente a 'nossos espíritos' ou ampliá-la apenas a seres espirituais.
- source_word: ζήσομεν
  choice: e viveremos
  rationale: Mantém o futuro e a relação resultante entre sujeitar-se ao Pai e viver.
theological_decisions:
- issue: Sentido de “Pai dos espíritos”
  choice: Manter a expressão ampla “Pai dos espíritos”
  alternative: “Pai de nossos espíritos” ou “Pai dos seres espirituais”
  rationale: O contraste imediato é com os pais humanos, mas o grego não especifica “nossos”; a tradução preserva essa amplitude e a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a pergunta retórica, o contraste entre a paternidade humana e divina e a ambiguidade de “Pai dos espíritos”.
