id: HEB.12.6
reference: Hebrews 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: pt
  text: Pois o Senhor disciplina quem ama e açoita[a] todo filho[b] que acolhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chicoteia” ou “flagela”. O verbo grego é forte e retrata uma disciplina severa.
    reason: lexical_alternative
  - marker: b
    text: “Todo filho” reproduz a expressão grega. Neste contexto, ela tem sentido representativo e se refere a todos os que Deus reconhece como seus filhos, tanto homens como mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: quem ... que
  rationale: Os pronomes relativos preservam a referência pessoal singular e produzem uma formulação geral, clara e natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior, preservando a ligação argumentativa.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: É a tradução direta, corrente e natural do verbo.
- source_word: κύριος
  choice: o Senhor
  rationale: Mantém o título teológico e emprega o artigo exigido pelo uso natural em português.
- source_word: παιδεύει
  choice: disciplina
  rationale: Abrange correção e formação, sem reduzir o sentido a simples punição.
- source_word: μαστιγοῖ
  choice: açoita
  rationale: Conserva a força da imagem de castigo severo e não suaviza a tensão do texto.
- source_word: δὲ
  choice: e
  rationale: Liga as duas orações de modo continuativo, sem introduzir um contraste mais forte do que o grego exige.
- source_word: πάντα υἱὸν
  choice: todo filho
  rationale: Preserva o masculino singular e a imagem filial central no contexto; a nota esclarece seu alcance representativo.
- source_word: παραδέχεται
  choice: acolhe
  rationale: Expressa receber ou aceitar favoravelmente e ressalta de modo natural a dimensão relacional da filiação.
theological_decisions:
- issue: Sentido representativo de υἱός no contexto da disciplina divina
  choice: todo filho
  alternative: todo aquele que é seu filho; todo filho ou filha
  rationale: A tradução mantém a figura explícita de filiação usada no grego e desenvolvida no contexto, sem excluir as filhas de Deus; a nota torna explícito o alcance representativo.
- issue: Força de μαστιγοῖ e a tensão entre amor e disciplina dolorosa
  choice: açoita
  alternative: chicoteia; flagela; castiga severamente
  rationale: O verbo grego é deliberadamente forte. A tradução preserva a gravidade da metáfora e a tensão teológica, em vez de transformá-la em uma referência genérica a dificuldades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Disciplina” comunica correção formativa; “açoita” preserva a imagem severa do original. A construção concisa conserva o paralelismo do versículo.
