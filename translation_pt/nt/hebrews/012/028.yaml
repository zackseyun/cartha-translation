reference: Hebrews 12:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: pt
  text: Portanto, já que estamos recebendo um reino inabalável, tenhamos a graça[a], pela qual sirvamos a Deus de modo aceitável, com reverência e temor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejamos agradecidos”. A expressão grega pode significar “tenhamos a graça” ou, em sentido idiomático, “tenhamos gratidão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Portanto
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior sobre o abalo e a remoção das coisas criadas.
- source_word: βασιλείαν ἀσάλευτον
  choice: um reino inabalável
  rationale: Preserva de forma concisa o contraste contextual entre aquilo que é abalado e o reino que não pode ser abalado.
- source_word: παραλαμβάνοντες
  choice: já que estamos recebendo
  rationale: Representa o particípio presente como circunstância causal e mantém seu aspecto em curso, sem convertê-lo em ação simplesmente passada.
- source_word: ἔχωμεν χάριν
  choice: tenhamos a graça
  rationale: Mantém a forma lexical e a ambiguidade teológica da expressão, além de permitir que o relativo seguinte indique a graça como meio do serviço aceitável; a leitura idiomática de gratidão aparece em nota.
- source_word: δι’ ἧς
  choice: pela qual
  rationale: Conserva o valor instrumental de διά com o genitivo e a referência feminina mais natural a χάριν, 'graça'.
- source_word: λατρεύωμεν
  choice: podemos servir
  rationale: O verbo denota serviço religioso prestado a Deus. 'Servir' evita restringi-lo a um ato interior de adoração, e 'podemos' expressa adequadamente sua relação com a exortação anterior.
- source_word: εὐαρέστως
  choice: de modo aceitável
  rationale: Comunica que o serviço é prestado de maneira agradável ou aceitável a Deus em português atual e claro.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: É a regência idiomática portuguesa de 'servir' e representa naturalmente o dativo grego.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: com reverência e temor
  rationale: '''Reverência'' comunica respeito cauteloso diante de Deus, enquanto ''temor'' preserva melhor que ''admiração'' a dimensão séria e temível de δέος no contexto imediato.'
theological_decisions:
- issue: Sentido de χάριν em ἔχωμεν χάριν
  choice: graça
  alternative: gratidão; sejamos agradecidos
  rationale: A sintaxe imediata favorece 'graça', pois δι’ ἧς pode retomá-la naturalmente como o meio pelo qual se presta serviço aceitável a Deus. Contudo, a expressão também admite o sentido idiomático de gratidão; essa possibilidade legítima é preservada em nota.
- issue: Força de δέος
  choice: temor
  alternative: assombro; profundo respeito
  rationale: O contexto seguinte afirma que Deus é fogo consumidor. 'Temor' preserva a gravidade do termo sem necessariamente implicar terror servil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a progressão lógica e a metáfora do reino inabalável, preservando em nota a ambiguidade de χάριν.
