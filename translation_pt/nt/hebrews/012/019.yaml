  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: pt
  text: nem ao som de trombeta nem a uma voz que proferia palavras[a][b]; os que a ouviram suplicaram que nenhuma outra palavra lhes fosse dirigida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e os que ouviram toda aquela manifestação suplicaram que nenhuma outra palavra lhes fosse dirigida», entendendo-se a referência como mais ampla, a toda a manifestação no Sinai, e não apenas à voz.'
    reason: alternative_reading
  - marker: b
    text: Veja Êxodo 20:18–19 e Deuteronômio 5:23–27, onde os israelitas pedem para não mais ouvir diretamente a voz de Deus.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: ao som de uma trombeta
  rationale: Reproduz naturalmente o fenômeno sonoro de ἦχος e mantém a imagem concreta da trombeta sem especificar intensidade além do grego.
- source_word: φωνῇ ῥημάτων
  choice: a uma voz que pronunciava palavras
  rationale: Expressa em português corrente a ideia de fala articulada contida na construção incomum, sem reduzi-la a mero ruído. A formulação literal «voz de palavras» seria pouco natural em português.
- source_word: ἧς
  choice: a
  rationale: O pronome feminino singular retoma mais naturalmente «voz», seu antecedente feminino imediato. A possível referência mais ampla à manifestação do Sinai é registrada em nota.
- source_word: οἱ ἀκούσαντες
  choice: Os que a ouviram
  rationale: Representa de modo claro e natural o particípio substantivado e explicita, por concordância pronominal, a referência imediata à voz.
- source_word: παρῃτήσαντο
  choice: suplicaram
  rationale: No contexto, o verbo médio indica um pedido insistente para não continuarem sujeitos à fala divina direta; «suplicaram» comunica a urgência sem sugerir simples recusa.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: que nenhuma outra palavra lhes fosse dirigida
  rationale: Transmite a ideia idiomática de não se acrescentar mais fala, preserva o valor passivo e conserva «palavra» para λόγον.
theological_decisions:
- issue: Referente da oração relativa ἧς
  choice: A oração é ligada diretamente à «voz».
  alternative: O relativo pode abranger toda a manifestação auditiva do Sinai, incluindo o som da trombeta e a voz.
  rationale: O antecedente gramatical mais próximo é φωνῇ, também feminino singular, mas o contexto permite que a reação dos israelitas seja entendida diante da manifestação como um todo. A nota preserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção continua a enumeração negativa iniciada no contexto anterior; por isso, «nem... nem...» foi preservado. As notas aparecem no ponto pertinente do texto e mantêm a ambiguidade real do referente de ἧς.
