source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: pt
  text: 'E vocês se esqueceram da exortação que se dirige a vocês como a filhos: “Meu filho[a], não faça pouco caso da disciplina do Senhor[b][c], nem desanime quando for repreendido por ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é literalmente “meu filho” e retoma a linguagem de Provérbios; no contexto, dirige-se representativamente aos filhos de Deus.
    reason: lexical_alternative
  - marker: b
    text: “Disciplina” também pode ter o sentido de “formação”, “treinamento” ou “instrução”, e não apenas de punição.
    reason: lexical_alternative
  - marker: c
    text: Citação de Provérbios 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: vocês se esqueceram
  rationale: O perfeito grego descreve o estado presente resultante do esquecimento; a forma portuguesa mantém tanto esse sentido quanto o tom de repreensão.
- source_word: παρακλήσεως
  choice: exortação
  rationale: No contexto, o termo introduz uma advertência encorajadora das Escrituras; “exortação” preserva o teor admonitório sem excluir o consolo.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: que fala a vocês como a filhos
  rationale: A formulação apresenta a exortação bíblica como fala direta aos destinatários e conserva a linguagem filial masculina do grego.
- source_word: Υἱέ μου
  choice: Meu filho
  rationale: Mantém o vocativo singular da citação e sua ligação verbal com Provérbios 3:11.
- source_word: ὀλιγώρει
  choice: não faça pouco caso
  rationale: Expressão portuguesa natural para tratar algo como insignificante, sem intensificar o verbo para “desprezar”.
- source_word: παιδείας
  choice: disciplina
  rationale: Abrange formação, treinamento e correção, adequando-se ao contexto da ação paterna do Senhor.
- source_word: ἐκλύου
  choice: desanime
  rationale: Comunica o abatimento interior ou a perda de ânimo diante da correção.
- source_word: ἐλεγχόμενος
  choice: quando for repreendido
  rationale: Expressa a censura corretiva no contexto disciplinar sem reduzi-la a mera instrução.
theological_decisions:
- issue: Linguagem filial marcada por gênero
  choice: filhos / Meu filho no texto principal
  alternative: crianças / Meu filho ou meus filhos
  rationale: O grego emprega υἱοί e o vocativo singular Υἱέ, retomando Provérbios e contribuindo para o argumento de Hebreus sobre filiação. A nota esclarece o alcance representativo sem apagar a forma do texto.
- issue: Amplitude de παιδεία na relação entre Deus e seus filhos
  choice: disciplina
  alternative: treinamento, formação ou instrução
  rationale: “Disciplina” permite tanto a dimensão formativa quanto a corretiva, preservando a tensão do contexto em vez de limitar o termo a castigo ou a ensino.
translation_notes:
  register: Português moderno, claro e digno, com formas de ampla compreensão brasileira. “Não faça pouco caso” transmite de modo corrente a força de ὀλιγώρει; a linguagem filial e a amplitude de “disciplina” foram preservadas.
