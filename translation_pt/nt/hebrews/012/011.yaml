  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: pt
  text: Toda disciplina, no momento, não parece ser motivo de alegria, mas de tristeza; depois, porém, produz o fruto pacífico da retidão[a] para os que por ela foram treinados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. A palavra grega pode se referir à retidão ou à justiça; aqui, provavelmente descreve a conduta reta produzida pela disciplina de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: disciplina
  rationale: No contexto de Hebreus 12, abrange formação, correção e treinamento paternos, sem se limitar a castigo.
- source_word: πρὸς μὲν τὸ παρόν
  choice: no momento
  rationale: Expressa a experiência presente e temporária, em contraste direto com ὕστερον.
- source_word: οὐ δοκεῖ
  choice: não parece ser
  rationale: Preserva a perspectiva da percepção humana, em vez de formular uma afirmação absoluta.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: motivo de alegria, mas de tristeza
  rationale: Mantém os substantivos gregos e acrescenta “motivo de” para produzir uma construção clara e natural em português.
- source_word: ὕστερον
  choice: depois
  rationale: Indica de modo simples o resultado posterior da disciplina.
- source_word: καρπὸν εἰρηνικόν
  choice: o fruto pacífico
  rationale: Conserva a imagem do fruto e o adjetivo que o caracteriza pela paz.
- source_word: ἀποδίδωσιν
  choice: produz
  rationale: No contexto, indica o resultado gerado pela disciplina e combina naturalmente com a imagem de fruto.
- source_word: γεγυμνασμένοις
  choice: foram exercitados
  rationale: Preserva a metáfora de treinamento de γυμνάζω e o sentido passivo de pessoas formadas pela experiência da disciplina.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é o equivalente português amplo e tradicional, enquanto a nota preserva a nuance contextual de retidão moral.
theological_decisions:
- issue: Sentido de παιδεία como ação de Deus para com seus filhos
  choice: disciplina formativa, que inclui correção e treinamento
  alternative: castigo; simples instrução
  rationale: Hebreus 12.5–10 apresenta essa ação em termos paternos e orientados para a santidade; “disciplina” mantém essa amplitude sem reduzi-la a punição retributiva.
- issue: Sentido de δικαιοσύνης
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode abranger justiça e retidão. No contexto, provavelmente descreve a conduta reta produzida pela disciplina, mas a tradução principal conserva o termo mais amplo e a nota registra a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo o contraste entre a experiência presente e o resultado posterior. O marcador da nota foi colocado junto de “justiça”, o termo ao qual a alternativa lexical se refere.
