id: HEB.12.18
reference: Hebrews 12:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: pt
  text: Pois vocês não chegaram ao que pode ser tocado[a], e a um fogo ardente, e à escuridão, às trevas e à tempestade[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a um monte que pode ser tocado”. O contexto indica o Sinai, mas a palavra “monte” não aparece explicitamente no grego deste versículo.'
    reason: alternative_reading
  - marker: b
    text: 'Outra forma de pontuar a enumeração: “ao que pode ser tocado, a um fogo ardente, à escuridão, às trevas e à tempestade”.'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Pois ... não
  rationale: Mantém a força explicativa de γάρ e a negação de οὐ, ligando o versículo ao argumento anterior.
- source_word: προσεληλύθατε
  choice: vocês não chegaram
  rationale: O perfeito expressa uma aproximação realizada com efeito presente; “chegaram” é natural e preserva a imagem de acesso.
- source_word: ψηλαφωμένῳ
  choice: ao que pode ser tocado
  rationale: O particípio indica algo palpável ou tangível. Como o grego não traz explicitamente “monte”, a tradução não acrescenta esse substantivo ao texto principal.
- source_word: κεκαυμένῳ πυρί
  choice: a um fogo ardente
  rationale: Expressa o fogo em estado de queima de maneira clara, vívida e digna em português atual.
- source_word: γνόφῳ
  choice: à escuridão
  rationale: Representa a ideia de escuridão densa e permite distingui-la do termo seguinte.
- source_word: ζόφῳ
  choice: às trevas
  rationale: Preserva a acumulação retórica de termos sombrios e diferencia ζόφος de γνόφος sem apagar a sobreposição semântica.
- source_word: θυέλλῃ
  choice: à tempestade
  rationale: Traduz diretamente a ideia de uma tempestade violenta em linguagem moderna e acessível.
theological_decisions:
- issue: Acrescentar ou não “monte” como objeto da aproximação
  choice: Não acrescentar “monte” no texto principal; manter o referente como uma realidade tangível não especificada.
  alternative: “Pois vocês não chegaram a um monte que pode ser tocado...”
  rationale: O contexto aponta para o Sinai, mas ὄρος (“monte”) não aparece neste versículo no texto grego. A formulação principal preserva essa ausência, enquanto a nota esclarece o referente implícito.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “e” conserva a estrutura cumulativa do grego; as contrações de preposição e artigo mantêm a enumeração natural em português.
