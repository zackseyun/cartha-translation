source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: pt
  text: Pois ele foi considerado digno de maior glória do que Moisés, na medida em que aquele que construiu a casa tem maior honra do que a própria casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: ele
  rationale: O pronome retoma naturalmente Jesus, mencionado no contexto imediato, sem inserir o nome no versículo.
- source_word: ἠξίωται
  choice: foi considerado digno
  rationale: Preserva a ideia de avaliação ou reconhecimento expressa pelo perfeito passivo, em português natural.
- source_word: παρὰ Μωϋσῆν
  choice: do que Moisés
  rationale: 'Após o comparativo, παρά indica comparação: maior glória em relação a Moisés.'
- source_word: καθ’ ὅσον
  choice: assim como
  rationale: Expressa a relação comparativa e explicativa entre a superioridade de glória e a honra do construtor em relação à casa.
- source_word: ὁ κατασκευάσας
  choice: aquele que constrói
  rationale: Traduz o particípio substantivado com linguagem corrente; o presente genérico comunica a máxima comparativa, embora o grego use particípio aoristo.
- source_word: οἶκος
  choice: casa
  rationale: Mantém a metáfora central e a possível amplitude semântica de casa, construção ou família, esclarecida pelo contexto.
theological_decisions:
- issue: Identidade do referente de οὗτος
  choice: ele
  alternative: este
  rationale: O contexto identifica o referente como Jesus, mas o pronome evita explicitação interpretativa desnecessária e soa mais natural em português.
- issue: Relação entre o construtor e a casa
  choice: a própria casa
  alternative: ela
  rationale: A repetição de “casa” torna explícita a comparação do texto e evita um pronome potencialmente ambíguo, sem identificar ainda quem é o construtor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação preserva a metáfora da casa e a comparação com Moisés.
