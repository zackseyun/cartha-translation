  - severity: low
    issue: Relação expressa por καθ’ ὅσον
    rationale: «Assim como» pode sugerir apenas analogia. «Na medida em que» preserva a nuance de fundamento/medida presente no grego e no audit trail inglês («just as» é uma simplificação interpretativa).
