  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: pt
  text: E a quem ele jurou que não entrariam no seu descanso, senão aos que desobedeceram[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos que se recusaram a obedecer”. No contexto, essa desobediência está estreitamente ligada à incredulidade (ver Hb 3.19).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: a quem
  rationale: O dativo plural interrogativo refere-se a pessoas; “a quem” é natural em português e preserva a pergunta retórica.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ dá continuidade à sequência de perguntas do argumento, sem exigir contraste forte.
- source_word: ὤμοσεν
  choice: ele jurou
  rationale: O aoristo de ὀμνύω indica um juramento solene; o pronome explícito torna clara e fluente a estrutura interrogativa em português.
- source_word: μὴ εἰσελεύσεσθαι
  choice: que não entrariam
  rationale: O infinitivo expressa o conteúdo do juramento; a oração finita em discurso indireto é a forma mais natural em português.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: no seu descanso
  rationale: κατάπαυσις designa o descanso de Deus, tema central em Hebreus. Com “entrar”, a preposição “em” contraída em “no” expressa naturalmente o movimento para dentro.
- source_word: εἰ μὴ
  choice: senão
  rationale: Na pergunta retórica, εἰ μή introduz a resposta esperada; “senão” conserva esse valor exclusivo com naturalidade.
- source_word: τοῖς ἀπειθήσασιν
  choice: aos que desobedeceram
  rationale: O particípio aoristo de ἀπειθέω aponta para a recusa concreta de obedecer. A formulação preserva a distinção lexical em relação à incredulidade mencionada no versículo seguinte.
theological_decisions:
- issue: Sentido de ἀπειθήσασιν na advertência
  choice: aos que desobedeceram
  alternative: aos que não creram
  rationale: Embora o contexto relacione estreitamente desobediência e incredulidade, este versículo emprega ἀπειθέω, não ἀπιστέω. A tradução mantém essa distinção e não reduz a desobediência a mero assentimento intelectual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A pergunta retórica e a ligação com o versículo anterior foram preservadas.
