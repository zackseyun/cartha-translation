source:
  edition: SBLGNT
  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: pt
  text: E contra quem ele ficou indignado durante quarenta anos? Não foi contra os que pecaram, cujos corpos caíram no deserto?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujos cadáveres caíram no deserto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: ficou indignado
  rationale: Expressa a ira ou indignação persistente de Deus contra alguém e soa natural numa pergunta retórica em português. Evita o possível sentido causal de “foi provocado”.
- source_word: τεσσεράκοντα ἔτη
  choice: durante quarenta anos
  rationale: Reproduz de modo idiomático o acusativo grego de duração.
- source_word: ἁμαρτήσασιν
  choice: os que pecaram
  rationale: Tradução direta e corrente do particípio aoristo, sem especificar além do texto a quantidade ou a natureza dos pecados.
- source_word: κῶλα
  choice: corpos
  rationale: No contexto do juízo no deserto, o termo designa os corpos caídos dos israelitas. “Corpos” é claro e digno; a força mais áspera de “cadáveres” é preservada em nota.
- source_word: ἔπεσεν
  choice: caíram
  rationale: Mantém a imagem verbal do grego e sua alusão implícita à morte, sem acrescentar explicitamente “mortos”.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: É a expressão bíblica corrente e amplamente compreensível em português para o cenário da peregrinação de Israel.
theological_decisions:
- issue: Referente do sujeito implícito de προσώχθισεν
  choice: ele = Deus
  alternative: repetir explicitamente “Deus”
  rationale: O contexto identifica Deus como sujeito. O pronome torna a pergunta natural em português sem acrescentar uma afirmação teológica nova.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura retórica próxima do grego. “Ficou indignado” preserva a intensidade sem soar arcaico; “deserto” segue o uso bíblico corrente em português.
