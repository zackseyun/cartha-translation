  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: pt
  text: 'Por isso, durante quarenta anos, indignei-me com esta geração[a] e disse: “Eles sempre se desviam em seus corações[b], mas não conheceram os meus caminhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquei irado com esta geração”; o verbo grego expressa forte desagrado e pode incluir a ideia de repulsa.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “no coração”, no singular, provavelmente tratando a geração como um todo coletivo; também se pode traduzir “em seu coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Durante quarenta anos
  rationale: Expressa naturalmente em português o acusativo de duração, sem perder a posição enfática da referência temporal.
- source_word: διὸ
  choice: por isso
  rationale: Preserva a relação inferencial com a causa apresentada no contexto anterior e soa mais corrente que “portanto” nesta construção.
- source_word: προσώχθισα
  choice: fiquei profundamente indignado
  rationale: Comunica forte desagrado, incluindo a intensidade do verbo, sem chegar à interpretação mais forte de repulsa ou aversão.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: com esta geração
  rationale: O dativo regido pelo verbo é expresso idiomaticamente por “com”, mantendo concreto o referente coletivo.
- source_word: καὶ εἶπον
  choice: e disse
  rationale: Mantém a coordenação simples do grego; a primeira pessoa já está clara pela forma verbal.
- source_word: Ἀεὶ πλανῶνται
  choice: Eles sempre se desviam
  rationale: Expressa o padrão contínuo de afastamento moral e espiritual em linguagem atual e acessível.
- source_word: τῇ καρδίᾳ
  choice: no coração
  rationale: Conserva o singular do grego, que provavelmente apresenta a geração como um todo coletivo.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: mas não conheceram
  rationale: “Mas” representa a força contrastiva de δέ, enquanto “conheceram” mantém a possível dimensão relacional do verbo, sem reduzi-lo a compreensão intelectual.
- source_word: τὰς ὁδούς μου
  choice: os meus caminhos
  rationale: Preserva a metáfora bíblica para o modo de agir de Deus e o caminho por ele prescrito.
theological_decisions:
- issue: Intensidade do desagrado divino em προσώχθισα
  choice: fiquei profundamente indignado
  alternative: fiquei irado; senti aversão
  rationale: A formulação mantém o forte desagrado divino diante da persistente infidelidade, sem suavizá-lo nem definir o verbo pela alternativa mais extrema de repulsa.
- issue: Singular coletivo em τῇ καρδίᾳ
  choice: no coração
  alternative: em seus corações
  rationale: O singular foi preservado para refletir a representação corporativa da geração no texto grego, sem excluir a responsabilidade de seus integrantes.
- issue: Sentido de conhecimento em οὐκ ἔγνωσαν
  choice: não conheceram
  alternative: não compreenderam; não chegaram a conhecer
  rationale: “Conheceram” preserva a tensão entre conhecimento cognitivo, reconhecimento e relação de fidelidade, sem decidir qual aspecto predomina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem mantém a ligação de “durante quarenta anos” com a reação divina conforme a divisão do versículo apresentada, embora a sequência permaneça sintaticamente marcada. O singular “coração” é deliberadamente conservado e esclarecido em nota.
