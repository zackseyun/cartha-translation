id: HEB.3.5
reference: Hebrews 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: pt
  text: E Moisés, de fato, foi fiel em toda a casa de Deus como servo, para testemunho das coisas que seriam ditas mais tarde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das coisas que haveriam de ser ditas”. A expressão aponta para uma fala ou revelação ainda futura em relação ao serviço de Moisés.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a continuidade com a comparação iniciada nos versículos anteriores.
- source_word: Μωϋσῆς μὲν
  choice: Moisés, de fato
  rationale: A expressão assinala a primeira parte de um contraste que será completado por δέ no versículo seguinte; “de fato” mantém essa antecipação em português natural.
- source_word: πιστὸς
  choice: fiel
  rationale: É a tradução corrente e contextual para a confiabilidade de Moisés no serviço a Deus.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: em toda a casa de Deus
  rationale: Mantém a imagem da casa presente em Números 12:7 e desenvolvida no contexto. O referente de αὐτοῦ é explicitado como Deus para evitar que o leitor entenda equivocadamente que se trata da casa pertencente a Moisés.
- source_word: ὡς θεράπων
  choice: como servo
  rationale: θεράπων designa um servidor ou assistente com nuance honrosa e não traz necessariamente o sentido mais forte de escravidão associado a δοῦλος.
- source_word: εἰς μαρτύριον
  choice: para testemunho
  rationale: 'Conserva de modo conciso a ideia de finalidade ou resultado: o serviço fiel de Moisés servia de testemunho.'
- source_word: τῶν λαληθησομένων
  choice: das coisas que seriam ditas mais tarde
  rationale: O particípio futuro passivo indica coisas que ainda seriam faladas; “mais tarde” torna clara essa orientação futura sem especificar indevidamente o conteúdo ou o agente.
theological_decisions:
- issue: Sentido e referente de “sua casa”
  choice: “casa de Deus”, mantendo a metáfora bíblica da esfera na qual Moisés serviu
  alternative: “toda a sua casa” ou “toda a sua família”
  rationale: O contexto de Hebreus 3 e a alusão a Números 12:7 apontam para a casa de Deus. A explicitação evita uma leitura possessiva referente a Moisés, enquanto “casa” preserva a ligação intertextual e a metáfora desenvolvida nos versículos seguintes.
- issue: Força de θεράπων
  choice: “servo”
  alternative: “assistente” ou “ministro”
  rationale: “Servo” expressa serviço subordinado com dignidade, sem impor o sentido específico de “escravo”, e preserva o contraste entre Moisés como servo e Cristo como Filho no versículo seguinte.
- issue: Referência de τῶν λαληθησομένων
  choice: “das coisas que seriam ditas mais tarde”, sem identificar no texto o agente ou o conteúdo
  alternative: “das coisas que Deus haveria de dizer” ou uma referência explícita à revelação no Filho
  rationale: A forma grega é passiva e não nomeia expressamente o agente nem define aqui o conteúdo. A tradução conserva essa abertura e evita resolver uma questão interpretativa no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a imagem de “casa” foram preservadas, mas o pronome grego foi explicitado como “de Deus” para clareza referencial. O marcador de nota aparece no texto principal.
