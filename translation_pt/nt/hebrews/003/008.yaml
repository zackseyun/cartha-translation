    rationale: A construção «como na rebelião, como no dia...» é pesada em português. O segundo segmento temporal pode seguir a primeira comparação sem perda do sentido da citação grega.
  - severity: low
    issue: Formulação da alternativa com Massá
    rationale: «No dia de Massá» pode sugerir uma relação possessiva. «No dia em Massá» expressa com maior precisão a alusão aos topônimos hebraicos.
