  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: pt
  text: não endureçam seus corações, como na rebelião, no dia da provação no deserto,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: não endureçam
  rationale: O aoristo do subjuntivo ativo com μή forma uma proibição direta. A voz ativa mantém a responsabilidade dos ouvintes por sua resposta.
- source_word: τὰς καρδίας ὑμῶν
  choice: os seus corações
  rationale: Preserva o plural do grego e a referência bíblica ao interior da pessoa — vontade, pensamento e disposição — em linguagem natural.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: como na rebelião
  rationale: παραπικρασμός pode indicar provocação ou rebelião. Aqui descreve a atitude rebelde de Israel contra Deus e traduz o substantivo grego sem substituir sua forma interpretativa pelo topônimo hebraico.
- source_word: κατὰ τὴν ἡμέραν
  choice: como no dia
  rationale: Neste paralelismo, κατά com o acusativo retoma a comparação iniciada por ὡς; repetir «como» torna essa relação explícita e acompanha a estrutura da citação.
- source_word: τοῦ πειρασμοῦ
  choice: da provação
  rationale: πειρασμός designa aqui o episódio de prova no deserto, não simplesmente uma tentação interior. «Provação» conserva a amplitude do termo e o tom bíblico sem especificar indevidamente quem estava sendo provado.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: No contexto do êxodo, ἔρημος se refere à região desabitada da peregrinação de Israel. «Deserto» é claro, corrente e mantém a ressonância narrativa em português.
theological_decisions:
- issue: Forma da alusão histórica ao Salmo 95
  choice: 'Traduzir os substantivos gregos de modo descritivo: «na rebelião» e «no dia da provação».'
  alternative: «como em Meribá, no dia de Massá, no deserto»
  rationale: Hebreus segue a formulação grega do Salmo 94(95):8 da Septuaginta, que verte os topônimos hebraicos por substantivos interpretativos. O texto principal, portanto, traduz o grego de Hebreus; a nota conserva para o leitor a importante relação com os nomes hebraicos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo da citação e preserva o plural «corações» do original.
