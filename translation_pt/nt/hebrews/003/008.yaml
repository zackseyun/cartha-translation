review_pass:
  verdict: revise
  source_fidelity: 'O imperativo proibitivo e os termos centrais são bem traduzidos. Contudo, embora κατά possa participar do paralelismo da citação, «como no dia» introduz em português uma repetição comparativa pouco natural e não necessária: «no dia da provação» preserva adequadamente o valor temporal e permanece sob a comparação já introduzida por «como».'
  naturalness: «Não endureçam seus corações» é mais direto e idiomático no português moderno do que «não endureçam os seus corações». A sequência «como na rebelião, no dia da provação no deserto» é clara, solene e natural; a repetição de «como» torna a frase artificial.
  terminology: «Rebelião», «provação» e «deserto» são escolhas adequadas. A nota deve dizer «no dia em Massá», não «no dia de Massá», para refletir o valor locativo do topônimo na alternativa hebraica.
