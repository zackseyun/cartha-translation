  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: pt
  text: 'enquanto se diz: “Hoje, se ouvirem a voz dele, não endureçam seus corações, como na rebelião[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “provocação”, conforme a tradução tradicional da citação do Salmo 95.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: enquanto se diz
  rationale: A construção com ἐν e infinitivo articular tem valor temporal ou circunstancial. “Enquanto se diz” é natural em português e conserva a ideia de uma declaração que continua sendo proferida e aplicada.
- source_word: Σήμερον
  choice: Hoje
  rationale: Equivalente temporal direto, preservando a urgência da exortação do salmo.
- source_word: ἐὰν ... ἀκούσητε
  choice: se ouvirem
  rationale: A oração condicional com subjuntivo é expressa naturalmente em português pelo futuro do subjuntivo depois de “se”.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: a voz dele
  rationale: Mantém o pronome pessoal do grego sem explicitar seu referente como “Deus”; evita também a possível ambiguidade possessiva de “sua voz” em português.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: não endureçam o coração
  rationale: Expressão corrente e digna em português, que preserva o sentido bíblico de “coração” como o interior da pessoa. O singular distributivo é idiomático para um grupo de ouvintes.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: como na rebelião
  rationale: παραπικρασμός designa a resistência rebelde de Israel no deserto. “Rebelião” comunica com clareza sua força moral e narrativa ao leitor moderno.
theological_decisions:
- issue: Sentido de παραπικρασμός na citação do Salmo 95
  choice: rebelião
  alternative: provocação
  rationale: “Rebelião” apresenta de modo claro a desobediência de Israel contra Deus, enquanto “provocação”, mantida em nota, preserva uma alternativa lexical tradicional e o sentido de provocar a ira divina.
- issue: Referente de αὐτοῦ
  choice: dele
  alternative: de Deus
  rationale: O texto grego usa um pronome cujo referente é compreendido pelo contexto. Não se acrescenta o nome “Deus”, preservando a forma e a coesão do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a estrutura exortativa da citação e evita tanto arcaísmos quanto explicitações teológicas não presentes no grego.
