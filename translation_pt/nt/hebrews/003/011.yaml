base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: pt
  text: 'como jurei na minha ira: “Jamais entrarão no meu descanso.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “Se entrarem no meu descanso”, fórmula de juramento que significa: “Certamente não entrarão no meu descanso”.'
    reason: Explicar a forma literal e a força idiomática da fórmula de juramento.
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz de modo natural a declaração citada e mantém a relação com o contexto precedente.
- source_word: ὤμοσα
  choice: jurei
  rationale: Traduz diretamente o aoristo de ὀμνύω, que indica prestar juramento.
- source_word: ἐν τῇ ὀργῇ μου
  choice: na minha ira
  rationale: Preserva o tom solene e judicial de ὀργή no contexto da advertência divina.
- source_word: Εἰ εἰσελεύσονται
  choice: Jamais entrarão
  rationale: Expressa em português a força negativa da fórmula semítica de juramento, evitando que ela seja confundida com uma condição comum.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: no meu descanso
  rationale: Mantém o motivo teológico de κατάπαυσις desenvolvido em Hebreus, sem restringi-lo antecipadamente a um lugar ou estado específico.
theological_decisions:
- issue: Fórmula de juramento Εἰ εἰσελεύσονται
  choice: 'Negação enfática: “Jamais entrarão no meu descanso”'
  alternative: 'Tradução formal: “Se entrarem no meu descanso”'
  rationale: A construção é uma fórmula elíptica de juramento que comunica uma negação solene. Explicitá-la preserva sua força e evita uma leitura condicional enganosa.
- issue: Sentido de κατάπαυσις
  choice: descanso
  alternative: lugar de descanso
  rationale: “Descanso” conserva a amplitude e a continuidade intertextual do tema em Salmos 95 e Hebreus, sem resolver indevidamente sua tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e com leitura natural no Brasil. A colocação do marcador após a citação vincula a nota à fórmula inteira.
