  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: pt
  text: 'Por isso, como diz o Espírito Santo: “Hoje, se vocês ouvirem a voz dele,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Por isso
  rationale: Conjunção inferencial que liga a exortação à argumentação anterior; é natural em português e preserva a relação lógica.
- source_word: καθὼς
  choice: como
  rationale: Introduz a fórmula de citação de maneira clara e idiomática. O português não exige «assim como» para conservar aqui a força da comparação.
- source_word: λέγει
  choice: diz
  rationale: O presente mantém a apresentação vívida e contínua da voz das Escrituras.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: Equivalente consagrado e preciso da expressão grega, sem acrescentar ênfase.
- source_word: Σήμερον
  choice: Hoje
  rationale: Reproduz diretamente o advérbio temporal que abre a citação do salmo.
- source_word: ἐὰν
  choice: se
  rationale: Expressa de forma direta e natural a condição introduzida pela partícula grega.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: a voz dele
  rationale: Com ἀκούω, o genitivo funciona como objeto; «ouvir a voz dele» é idiomático e mantém a referência pessoal sem explicitação interpretativa.
- source_word: ἀκούσητε
  choice: vocês ouvirem
  rationale: O subjuntivo aoristo após ἐὰν é naturalmente vertido pelo futuro do subjuntivo português; «ouvirem» preserva o núcleo lexical sem ampliar para «obedecerem».
theological_decisions:
- issue: Atribuição da fala na citação do Salmo
  choice: A citação é apresentada diretamente como fala do Espírito Santo.
  alternative: O Espírito Santo fala por meio das Escrituras ou do salmista.
  rationale: O grego afirma explicitamente «o Espírito Santo diz». A tradução conserva essa atribuição direta, sem desenvolver uma formulação doutrinária mais ampla sobre inspiração.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Emprega-se «vocês» para a segunda pessoa do plural, deixando claro que o destinatário é coletivo. A vírgula final é mantida porque o versículo termina no meio da citação, que continua no versículo seguinte.
