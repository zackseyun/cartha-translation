  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: pt
  text: Tenham cuidado, irmãos[a], para que nenhum de vocês tenha um coração mau e incrédulo[b], afastando-se do Deus vivo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o masculino plural ἀδελφοί, que pode dirigir-se a um grupo misto de fiéis.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “um coração mau de incredulidade”; também pode ser entendido como “um coração mau e infiel”.
    reason: alternative_reading
  - marker: c
    text: Ou “desviando-se” ou “abandonando o Deus vivo”. A construção também pode ser entendida como “ao afastar-se do Deus vivo” ou “no afastamento do Deus vivo”.
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Tenham cuidado
  rationale: O imperativo presente plural introduz uma advertência contínua. A expressão é natural em português e preserva a força de alerta.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego, que neste contexto pode dirigir-se ao conjunto dos fiéis.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: para que nenhum de vocês tenha
  rationale: Expressa de modo idiomático a advertência sobre a possibilidade de essa condição surgir em qualquer integrante do grupo, sem reproduzir mecanicamente a construção existencial grega.
- source_word: καρδία
  choice: coração
  rationale: Preserva a imagem bíblica do centro interior do pensamento, da vontade e dos afetos.
- source_word: πονηρὰ ἀπιστίας
  choice: mau e incrédulo
  rationale: Comunica a corrupção moral indicada por πονηρά e entende o genitivo ἀπιστίας como caracterização do coração. A nota conserva a alternativa mais formal.
- source_word: ἐν τῷ ἀποστῆναι
  choice: afastando-se
  rationale: Preserva a ligação circunstancial entre a incredulidade e o afastamento, sem impor o termo teológico técnico “apostatar”.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: do Deus vivo
  rationale: Reproduz a expressão bíblica definida e seu contraste implícito com aquilo que não tem vida.
theological_decisions:
- issue: Se ἀπιστίας deve ser traduzido como incredulidade ou infidelidade
  choice: incrédulo
  alternative: marcado pela incredulidade; infiel
  rationale: O contexto imediato de Hebreus 3 enfatiza a recusa em crer na palavra de Deus. A formulação escolhida mantém essa ênfase, enquanto a nota preserva a construção nominal e sua possível dimensão de falta de fidelidade.
- issue: Se ἀποστῆναι deve receber o sentido técnico de apostasia
  choice: afastando-se
  alternative: desviando-se; abandonando; apostatando
  rationale: O verbo denota afastar-se ou retirar-se. A tradução escolhida mantém a gravidade da advertência sem resolver a tensão mediante uma categoria teológica técnica posterior.
- issue: Relação expressa por ἐν τῷ ἀποστῆναι
  choice: circunstância associada ao coração incrédulo
  alternative: 'resultado ou manifestação: “levando-o a afastar-se”'
  rationale: A construção admite mais de uma nuance próxima. O gerúndio português conserva uma ligação ampla, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Tenham cuidado” evita arcaísmo; “nenhum de vocês tenha” torna idiomática a estrutura grega. Todos os marcadores aparecem no texto principal.
