  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: pt
  text: que é fiel àquele que o designou[a], assim como também Moisés foi fiel em sua casa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que o fez”. O verbo grego pode significar “fazer”, mas aqui provavelmente tem o sentido de “designar” ou “constituir para uma função”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “em toda a sua casa”, em correspondência mais próxima com Números 12:7. A casa provavelmente é a casa de Deus.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: que foi fiel
  rationale: A expressão participial retoma Jesus no versículo anterior. A oração relativa é natural em português, e “fiel” expressa confiabilidade e lealdade, não simplesmente o ato de crer.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: àquele que o designou
  rationale: Embora ποιέω normalmente possa significar “fazer”, neste contexto pode indicar constituir ou designar alguém para uma função. “Designou” comunica a incumbência de Jesus sem introduzir a ideia potencialmente enganosa de que ele foi criado.
- source_word: ὡς καὶ
  choice: assim como ... também
  rationale: A construção torna explícita e natural em português a comparação entre a fidelidade de Jesus e a de Moisés.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: na casa dele
  rationale: “Casa” preserva a imagem que será desenvolvida nos versículos seguintes. “Dele” mantém sem explicitação indevida o referente do pronome grego, embora o contexto aponte para a casa de Deus.
theological_decisions:
- issue: Sentido de ποιήσαντι com referência ao Filho
  choice: designou
  alternative: fez
  rationale: “Fez” é lexicalmente possível, mas pode ser entendido como uma afirmação de que o Filho foi criado. O contexto de função, missão e fidelidade favorece “designou”; a alternativa literal é preservada em nota.
- issue: Referente de αὐτοῦ em “na casa dele”
  choice: manter o pronome como “dele”
  alternative: explicitar “na casa de Deus” ou entender “na casa de Moisés”
  rationale: A casa provavelmente é a de Deus, em eco a Números 12:7, mas o texto grego usa um pronome. Mantê-lo preserva a forma e a pequena margem de ambiguidade do original.
- issue: Presença de “toda” antes de “casa”
  choice: seguir o texto principal do SBLGNT sem “toda”
  alternative: “em toda a sua casa”
  rationale: O texto-base fornecido traz ἐν τῷ οἴκῳ αὐτοῦ, sem um termo equivalente a “toda”. A leitura mais longa, apoiada por parte da tradição manuscrita e por seu eco de Números 12:7, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “foi fiel” torna natural em português a elipse do grego. “Casa” foi mantido para preservar a metáfora desenvolvida no contexto, e “dele” evita resolver no texto principal o referente do pronome.
