  naturalness: O texto é claro e de registro apropriado. «Motivo de glória» é uma solução moderna e natural para καύχημα, evitando a conotação desfavorável de «orgulho».
  terminology: «Messias», «Filho», «casa», «ousadia» e «manter firmes» são adequados. «Sua casa» conserva a ambiguidade referencial do pronome grego, que a nota pode explicar sem a decidir no texto.
