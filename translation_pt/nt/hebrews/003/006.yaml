source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: pt
  text: Mas o Messias foi fiel como Filho sobre sua casa[a]. E nós somos essa casa, se mantivermos firmes a ousadia[b] e o motivo de glória da esperança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «sobre a casa dele». Pelo contexto, a casa é associada a Deus; a construção também pode ser entendida em relação ao Filho. «Messias» também pode ser traduzido por «Cristo».
    reason: ambiguidade referencial e alternativa lexical
  - marker: b
    text: Ou «confiança». A palavra grega pode indicar franqueza, liberdade de expressão ou confiança corajosa.
    reason: alternativa lexical
  - marker: c
    text: Ou «aquilo de que nos gloriamos na esperança» ou «a exultação da esperança».
    reason: alternativa lexical
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Neste contraste com Moisés, Χριστός conserva força titular; «Messias» a torna clara em português, sem excluir a alternativa tradicional «Cristo».
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com a descrição de Moisés no versículo anterior.
- source_word: ὡς υἱὸς
  choice: como Filho
  rationale: Preserva a comparação e a força qualitativa da expressão; a maiúscula identifica o referente cristológico sem acrescentar conteúdo ao texto.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: sobre a casa de Deus
  rationale: ἐπί indica autoridade sobre a casa. O referente de αὐτοῦ é explicitado como Deus com base no contexto imediato (3.2,5), evitando em português a ambiguidade referencial artificial de «sua casa»; a nota registra a forma literal e a possível relação com o Filho.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: E nós somos essa casa
  rationale: Reproduz naturalmente a identificação metafórica da comunidade com a casa mencionada.
- source_word: ἐὰν
  choice: se
  rationale: Mantém a condição real sem impor uma explicação doutrinária sobre perseverança ou apostasia.
- source_word: παρρησίαν
  choice: ousadia
  rationale: Preserva a ideia de franqueza e confiança corajosa; «confiança» é uma alternativa contextual legítima.
- source_word: καύχημα
  choice: orgulho
  rationale: Comunica de modo atual aquilo de que alguém se gloria ou se orgulha, sem suavizar o termo para mera confiança.
- source_word: τῆς ἐλπίδος
  choice: da nossa esperança
  rationale: O possessivo, implícito no contexto da primeira pessoa do plural, é natural em português.
- source_word: κατάσχωμεν
  choice: mantivermos firmes
  rationale: Expressa retenção perseverante no âmbito da condição introduzida por ἐάν.
theological_decisions:
- issue: Χριστός como título ou designação semelhante a nome
  choice: o Messias
  alternative: Cristo
  rationale: O contraste histórico-salvífico com Moisés favorece a força titular, mas a nota preserva a alternativa tradicional.
- issue: Referente de αὐτοῦ em «sobre a casa dele»
  choice: a casa de Deus
  alternative: sua casa / a casa do Filho
  rationale: O contexto anterior chama a casa de casa de Deus e apresenta o Filho sobre ela. Como o pronome grego pode ser relacionado sintaticamente ao Filho, a nota não elimina essa possibilidade.
- issue: Força da condição ἐὰν ... κατάσχωμεν
  choice: se mantivermos firmes
  alternative: desde que mantenhamos firmes
  rationale: «Se» conserva plenamente a tensão condicional do texto sem decidir questões confessionais sobre perseverança e apostasia.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. «Casa» mantém a metáfora que identifica o povo de Deus como sua casa. «Orgulho» é usado no sentido contextual de motivo de glória, esclarecido por nota; a condição é mantida sem suavização teológica.
