- from: Mas o Messias foi fiel como Filho sobre a casa de Deus[a]. E nós somos essa casa, se mantivermos firmes a nossa ousadia[b] e o orgulho da nossa esperança[c].
  to: Mas o Messias foi fiel como Filho sobre sua casa[a]. E nós somos essa casa, se mantivermos firmes a ousadia[b] e o motivo de glória da esperança[c].
  rationale: A revisão conserva a elipse contextual de «foi fiel», como na oração precedente e no registro de auditoria inglês, mas deixa αὐτοῦ como «sua» para não decidir seu referente. Substitui «orgulho» por «motivo de glória», mais fiel ao valor de καύχημα no contexto, e remove o possessivo não expresso de «esperança».
