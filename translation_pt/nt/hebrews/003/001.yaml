id: HEB.3.1
reference: Hebrews 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: pt
  text: Portanto, irmãos santos[a], participantes de um chamado celestial[b], considerem Jesus, o apóstolo e sumo sacerdote da nossa confissão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” se dirige a toda a comunidade dos que creem, incluindo as mulheres.
    reason: cultural_note
  - marker: b
    text: Ou “que participam do chamado celestial”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “considerem aquele a quem confessamos: Jesus, o apóstolo e sumo sacerdote”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Portanto
  rationale: Conjunção inferencial que tira uma conclusão do argumento anterior, especialmente de 2.17–18; “portanto” preserva essa relação lógica com naturalidade.
- source_word: ἀδελφοὶ ἅγιοι
  choice: irmãos santos
  rationale: Mantém a forma masculina plural do vocativo grego e o caráter de consagração expresso por ἅγιοι. No contexto, “irmãos” abrange toda a comunidade cristã, o que é esclarecido em nota.
- source_word: κλήσεως ἐπουρανίου
  choice: de um chamado celestial
  rationale: A construção sem artigo é bem representada pelo indefinido; “celestial” preserva a possível ideia de origem e de caráter do chamado.
- source_word: μέτοχοι
  choice: participantes
  rationale: Expressa participação real em algo e soa mais natural em português atual do que “compartilhadores” ou “coparticipantes” neste contexto.
- source_word: κατανοήσατε
  choice: considerem
  rationale: O imperativo pede atenção refletida e concentrada; “considerem” preserva o núcleo sem intensificação explicativa indevida.
- source_word: ἀπόστολον
  choice: apóstolo
  rationale: Conserva o título incomum aplicado a Jesus e sua conotação de alguém enviado, sem o reduzir a uma paráfrase.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É a designação portuguesa tradicional, precisa e inteligível para o principal sacerdote, além de preservar um tema central de Hebreus.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: da nossa confissão
  rationale: Preserva a formulação nominal e comunitária do grego, bem como sua ligação natural com os dois títulos anteriores, sem restringir ὁμολογία a fé subjetiva.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa estabelecida do nome próprio.
theological_decisions:
- issue: Alcance de gênero de ἀδελφοί
  choice: “irmãos” no texto, com nota indicando que o termo inclui mulheres
  alternative: “irmãos e irmãs”
  rationale: A forma grega é masculina plural, mas funciona contextualmente como endereço de toda a comunidade de fiéis. A tradução mantém a forma e explicita seu alcance inclusivo em nota.
- issue: Sentido de ἀπόστολος aplicado a Jesus
  choice: manter o título “apóstolo”
  alternative: “enviado” ou “mensageiro”
  rationale: O texto aplica explicitamente o termo a Jesus. Manter o título conserva sua força literária e teológica, sem impor distinções eclesiásticas posteriores.
- issue: Relação de τῆς ὁμολογίας ἡμῶν com a frase
  choice: “da nossa confissão”, ligado a “apóstolo e sumo sacerdote”
  alternative: '“aquele a quem confessamos: Jesus, o apóstolo e sumo sacerdote”'
  rationale: A ligação genitiva aos dois títulos é sintaticamente natural, mas a expressão também pode ser entendida em sentido mais verbal; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar a densidade teológica nem as ambiguidades legítimas do grego.
