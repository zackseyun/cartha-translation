id: HEB.3.4
reference: Hebrews 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: pt
  text: Pois toda casa é construída por alguém, mas quem construiu todas as coisas é Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: toda
  rationale: 'Com o singular οἶκος, tem sentido distributivo: “toda casa”, isto é, cada casa.'
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta o argumento anterior e preserva de modo natural a ligação lógica.
- source_word: οἶκος
  choice: casa
  rationale: Mantém a imagem arquitetônica concreta e o jogo metafórico presente no contexto de Hebreus 3, sem antecipar “família” ou “casa de Deus”.
- source_word: κατασκευάζεται
  choice: é construída
  rationale: Expressa naturalmente a voz passiva e a ideia de edificação de uma casa.
- source_word: ὑπό τινος
  choice: por alguém
  rationale: ὑπό com genitivo indica agência, e τις apresenta o agente de maneira indefinida.
- source_word: ὁ δὲ
  choice: mas quem
  rationale: δέ marca a passagem contrastiva da máxima geral à afirmação culminante, enquanto o artigo com o particípio é vertido naturalmente por “quem”.
- source_word: πάντα
  choice: todas as coisas
  rationale: Preserva o alcance amplo e abrangente do neutro plural sem restringi-lo interpretativamente ao universo material.
- source_word: κατασκευάσας
  choice: construiu
  rationale: Mantém a continuidade lexical com κατασκευάζεται e a analogia da construção, ainda que aplicada de modo abrangente.
- source_word: θεός
  choice: Deus
  rationale: Identifica explicitamente Deus como aquele que construiu todas as coisas.
theological_decisions:
- issue: Identificação daquele que construiu todas as coisas
  choice: “quem construiu todas as coisas é Deus”
  alternative: “Deus é quem construiu todas as coisas”
  rationale: A ordem escolhida acompanha de perto a estrutura grega, na qual θεός identifica, ao final da oração, aquele que construiu tudo. A alternativa é igualmente possível em português, mas desloca a ênfase para “Deus” no início da oração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” conserva a conexão argumentativa; “casa” e “construiu” mantêm a metáfora arquitetônica e a repetição lexical do grego.
