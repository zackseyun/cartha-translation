  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: pt
  text: Pois quem foram os que, depois de ouvirem, se rebelaram[a]? Não foram todos os que saíram do Egito por meio de Moisés?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “provocaram [a Deus]”. O verbo grego está ligado à ideia de amargura e pode ser traduzido mais literalmente como “amarguraram”; aqui se refere à provocação rebelde de Israel contra Deus no deserto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: quem foram os que
  rationale: Expressa com naturalidade a pergunta retórica e torna perceptível a referência plural e específica.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior.
- source_word: ἀκούσαντες
  choice: depois de ouvirem
  rationale: Representa o particípio aoristo e sua relação temporal com o verbo principal, sem sugerir que a simples audição causou a rebelião.
- source_word: παρεπίκραναν
  choice: se rebelaram
  rationale: No contexto da geração do deserto, comunica de modo claro a provocação rebelde contra Deus; a alternativa mais literal é registrada em nota.
- source_word: ἀλλ’ οὐ πάντες
  choice: Não foram todos
  rationale: Reproduz a força da pergunta retórica, cuja resposta esperada é afirmativa; o valor idiomático de ἀλλά não exige aqui um 'mas' explícito.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: os que saíram do Egito
  rationale: Tradução direta e natural do particípio substantivado com a expressão de origem.
- source_word: διὰ Μωϋσέως
  choice: por meio de Moisés
  rationale: Preserva o sentido de mediação ou agência de διά com o genitivo, sem ampliar para uma paráfrase como 'sob a liderança de Moisés'.
theological_decisions:
- issue: Sentido de παραπικραίνω no contexto da geração do deserto
  choice: se rebelaram
  alternative: provocaram / causaram amargura
  rationale: A forma verbal alude à provocação de Deus pela desobediência de Israel. 'Se rebelaram' comunica a força narrativa e teológica no português atual, enquanto a nota preserva a formulação mais literal.
- issue: Alcance de πάντες na pergunta retórica
  choice: todos os que saíram do Egito por meio de Moisés
  alternative: explicitar exceções como Josué e Calebe
  rationale: A tradução conserva a formulação abrangente e retórica do texto, sem inserir no corpo do versículo uma harmonização interpretativa com as exceções conhecidas da narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando as duas perguntas retóricas e a ambiguidade lexical relevante em nota.
