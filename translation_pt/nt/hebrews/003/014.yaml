source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: pt
  text: Pois nos tornamos participantes do Messias[a], se de fato mantivermos firme até o fim a nossa confiança inicial[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que compartilham do Messias” ou “os que têm parte no Messias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “certeza”. O termo grego também pode significar “convicção” e, em outros contextos, “substância” ou “realidade”.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “mantivermos firme até o fim o início da confiança”.'
    reason: literal_rendering
lexical_decisions:
- source_word: μέτοχοι
  choice: participantes
  rationale: Expressa pessoas que têm parte em alguém ou compartilham de algo, em linguagem atual e sem o tom arcaico de alternativas como “partícipes”.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da exortação anterior e preserva a ligação argumentativa.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título; “Messias” comunica esse valor e o genitivo exigido por μέτοχοι.
- source_word: γεγόναμεν
  choice: nos tornamos
  rationale: O perfeito indica um estado presente resultante de um acontecimento anterior; “nos tornamos” preserva esse aspecto melhor que um simples “somos”.
- source_word: ἐάνπερ
  choice: se de fato
  rationale: Mantém a ênfase da partícula na condição, sem convertê-la numa formulação doutrinária mais forte.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: a nossa confiança inicial
  rationale: Formulação natural em português para “o princípio da confiança”, entendendo ὑπόστασις como postura confiante neste contexto; a nota preserva a forma mais literal e a amplitude lexical.
- source_word: μέχρι τέλους
  choice: até o fim
  rationale: Indica perseverança ao longo de todo o percurso de modo claro e idiomático.
- source_word: βεβαίαν
  choice: firme
  rationale: Comunica estabilidade e segurança e concorda naturalmente com “confiança”.
- source_word: κατάσχωμεν
  choice: mantivermos
  rationale: Expressa conservar ou reter aquilo que já se possui; o futuro do subjuntivo é natural em português depois de “se”.
theological_decisions:
- issue: Condição e perseverança
  choice: 'Manter a condição real: “se de fato mantivermos...”'
  alternative: Explicitar que a perseverança apenas comprova uma participação anterior, ou que ela mantém essa participação.
  rationale: O grego apresenta uma condição, mas não decide por si só entre sistemas teológicos posteriores sobre perseverança, apostasia ou evidência da fé. A tradução conserva essa tensão.
- issue: Sentido de ὑπόστασις
  choice: confiança
  alternative: certeza, convicção, fundamento, substância ou realidade
  rationale: No contexto da exortação, “confiança” representa bem uma postura firme, sem negar a amplitude semântica do termo, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “confiança inicial” evita a rigidez de “o princípio da confiança”, enquanto a nota conserva a estrutura grega. “Participantes” mantém o sentido relacional sem arcaísmo.
