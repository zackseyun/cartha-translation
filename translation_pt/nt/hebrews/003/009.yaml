  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: pt
  text: onde seus antepassados me puseram à prova, testando-me,[a] e viram as minhas obras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me puseram à prova por meio de uma prova” ou “me testaram”. A expressão grega é difícil e pode indicar modo ou meio.'
    reason: lexical_alternative
  - marker: b
    text: 'Algumas traduções entendem a frase em sentido concessivo: “embora tivessem visto as minhas obras” ou “e, mesmo assim, viram as minhas obras”. O grego diz simplesmente “e viram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: onde
  rationale: Retoma espacialmente o cenário do deserto no versículo anterior; preserva o sentido mais direto do advérbio relativo.
- source_word: ἐπείρασαν
  choice: puseram à prova
  rationale: Expressa naturalmente em português a ação de testar Deus em sentido provocador, sem perder a força do verbo grego.
- source_word: οἱ πατέρες ὑμῶν
  choice: os seus antepassados
  rationale: Em português atual, comunica com clareza a referência histórica aos pais ancestrais dos destinatários, evitando que “pais” seja entendido apenas como progenitores imediatos.
- source_word: ἐν δοκιμασίᾳ
  choice: submetendo-me a teste
  rationale: Mantém a ideia de prova/teste e representa a possível nuance de modo ou meio da expressão difícil, sem fingir uma precisão inexistente.
- source_word: καὶ εἶδον
  choice: e viram
  rationale: Reproduz a coordenação simples do grego, sem introduzir no texto principal uma relação concessiva.
- source_word: τὰ ἔργα μου
  choice: as minhas obras
  rationale: Preserva a forma lexical e a ressonância bíblica de ἔργα, referindo-se aos atos de Deus no deserto.
theological_decisions:
- issue: Objeto de ἐπείρασαν
  choice: me puseram à prova
  alternative: puseram à prova
  rationale: Embora o objeto não esteja expresso neste trecho do SBLGNT, Deus é o referente entendido pelo contexto da citação do Salmo 95; explicitá-lo produz português natural sem acrescentar conteúdo doutrinário.
- issue: Relação entre a prova e a visão das obras
  choice: e viram
  alternative: embora tivessem visto / e, mesmo assim, viram
  rationale: O grego traz simplesmente καί. A leitura concessiva é contextualmente possível, mas não deve ser inserida sem indicação no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Antepassados” evita a ambiguidade moderna de “pais”; “obras” conserva o registro bíblico. A repetição semântica em “puseram à prova, submetendo-me a teste” reflete deliberadamente a dificuldade e a possível ênfase do original.
