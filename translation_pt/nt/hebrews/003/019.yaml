  source_fidelity: 'A tradução preserva com precisão a sequência e a força do grego: καὶ βλέπομεν é corretamente expresso por “E vemos”, ὅτι introduz adequadamente a oração de conteúdo, e οὐκ ἠδυνήθησαν εἰσελθεῖν é bem vertido por “não puderam entrar”. “Por causa da” reproduz o valor causal de διά com acusativo. “Incredulidade” é uma tradução apropriada e contextualizada de ἀπιστία.'
