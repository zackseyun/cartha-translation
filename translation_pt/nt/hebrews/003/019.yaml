id: HEB.3.19
reference: Hebrews 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: pt
  text: E vemos que não puderam entrar por causa da incredulidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “infidelidade”. O termo grego pode indicar não apenas falta de fé, mas também a recusa infiel de confiar.
    reason: alternativa lexical
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva a conexão simples com o argumento anterior sem acrescentar uma força conclusiva que a conjunção grega não exige.
- source_word: βλέπομεν
  choice: vemos
  rationale: Reproduz de modo direto e natural o presente do indicativo na primeira pessoa do plural, mantendo a vivacidade retórica.
- source_word: ὅτι
  choice: que
  rationale: Introduz claramente, em português idiomático, o conteúdo daquilo que o autor afirma que vemos.
- source_word: οὐκ ἠδυνήθησαν
  choice: não puderam
  rationale: Expressa de forma concisa e natural a incapacidade indicada por δύναμαι, sem enfraquecer a afirmação.
- source_word: εἰσελθεῖν
  choice: entrar
  rationale: Equivalente direto do infinitivo grego e adequado ao contexto da entrada na terra ou no descanso prometido.
- source_word: δι’
  choice: por causa da
  rationale: Com o acusativo, διά indica aqui causa ou razão; esta é a formulação mais clara em português atual.
- source_word: ἀπιστίαν
  choice: incredulidade
  rationale: Termo corrente no português bíblico e moderno para falta ou recusa de fé; a possível nuance de infidelidade é preservada em nota.
theological_decisions:
- issue: Tradução de ἀπιστία em sua relação com πίστις
  choice: incredulidade
  alternative: infidelidade
  rationale: O contexto imediato ressalta que Israel não creu nem confiou na promessa de Deus, favorecendo “incredulidade”. Como o termo também pode envolver recusa desleal em confiar, “infidelidade” é mantida em nota para não eliminar essa tensão semântica e teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção concisa acompanha de perto o grego sem soar artificial; “não puderam” é preferível ao mais pesado “não foram capazes de”.
