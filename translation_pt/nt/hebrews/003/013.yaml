source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: pt
  text: Mas encorajem uns aos outros todos os dias[b], enquanto ainda se diz “Hoje”[a], para que nenhum de vocês seja endurecido pelo engano do pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hoje” retoma o Salmo 95 e se refere ao tempo presente em que é preciso responder ao chamado de Deus.
    reason: cross_reference
  - marker: b
    text: Ou “exortem uns aos outros”. O verbo grego pode significar encorajar, exortar, instar ou consolar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Marca o forte contraste com a advertência do versículo anterior e soa natural neste contexto.
- source_word: παρακαλεῖτε
  choice: encorajem
  rationale: O verbo abrange encorajar, exortar e instar. Aqui, “encorajem” comunica de modo claro o fortalecimento mútuo e contínuo, sem eliminar a alternativa lexical indicada em nota.
- source_word: ἑαυτοὺς
  choice: uns aos outros
  rationale: Embora formalmente reflexivo, o pronome plural tem sentido recíproco neste contexto e descreve uma ação mútua da comunidade.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: todos os dias
  rationale: Expressa repetição diária em português natural e corrente.
- source_word: ἄχρις οὗ
  choice: enquanto ainda
  rationale: Realça o período presente durante o qual permanece a urgência de responder, sem tratar a expressão apenas como indicação de um ponto final.
- source_word: τὸ Σήμερον καλεῖται
  choice: se diz “Hoje”
  rationale: Preserva a construção passiva e o uso substantivado de “Hoje”, com aspas para assinalar a alusão ao Salmo 95.
- source_word: ἵνα μὴ σκληρυνθῇ
  choice: para que ... não seja endurecido
  rationale: Mantém a finalidade negativa e a voz passiva do grego.
- source_word: τις ἐξ ὑμῶν
  choice: nenhum de vocês
  rationale: Sob a negação introduzida por ἵνα μή, esta formulação distribui naturalmente a advertência por todos os membros da comunidade.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: pelo engano do pecado
  rationale: Toma o dativo como instrumental e retrata o pecado como agente de engano, em linguagem clara e fiel.
theological_decisions:
- issue: Reciprocidade da exortação comunitária
  choice: uns aos outros
  alternative: a vocês mesmos
  rationale: O reflexivo plural funciona reciprocamente; a tradução deixa claro que os membros da comunidade devem agir mutuamente, sem individualizar a ordem.
- issue: Sentido de τὸ Σήμερον
  choice: “Hoje” como eco bíblico e tempo presente de resposta
  alternative: hoje apenas como referência temporal comum
  rationale: No contexto de Hebreus 3, “Hoje” retoma o Salmo 95. As aspas preservam essa força intertextual sem desenvolver uma interpretação adicional no corpo do versículo.
- issue: Agente ou meio do endurecimento
  choice: voz passiva, com o engano do pecado como meio
  alternative: o pecado endurece vocês
  rationale: A formulação mantém a voz passiva e a ambiguidade quanto ao agente último, enquanto o dativo explicita o meio pelo qual ocorre o endurecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nenhum de vocês” preserva o alcance comunitário da advertência; “pelo engano do pecado” mantém a imagem teológica sem linguagem excessivamente técnica.
