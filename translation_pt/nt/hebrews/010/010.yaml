id: HEB.10.10
reference: Hebrews 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: pt
  text: Por essa vontade[a], fomos santificados mediante a oferta do corpo de Jesus, o Messias[b], de uma vez por todas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “nessa vontade”. A expressão se refere à vontade de Deus mencionada imediatamente antes no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “Jesus Cristo”. O título grego Χριστός é traduzido aqui por “Messias” para deixar explícito seu significado.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Por essa vontade
  rationale: A expressão retoma a vontade de Deus mencionada no contexto. “Por” comunica naturalmente o valor instrumental de ἐν, enquanto “essa” preserva a referência ao que acaba de ser citado.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: fomos santificados
  rationale: A construção perifrástica perfeita apresenta uma ação realizada com resultado vigente. Em português atual, “fomos santificados” exprime com clareza a ação consumada; “temos sido santificados” poderia sugerir indevidamente um processo repetido ou contínuo.
- source_word: διὰ τῆς προσφορᾶς
  choice: mediante a oferta
  rationale: Com o genitivo, διά indica meio. “Mediante” torna essa relação explícita, e “oferta” corresponde diretamente a προσφορά sem substituir o termo por “sacrifício”, interpretação já sugerida pelo contexto.
- source_word: τοῦ σώματος
  choice: do corpo
  rationale: Mantém a estrutura concreta do grego e identifica o que foi oferecido.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor de título. A forma apositiva com artigo é idiomática em português e deixa claro o sentido de “Messias”, sem tratar o título apenas como sobrenome.
- source_word: ἐφάπαξ
  choice: de uma vez por todas
  rationale: Expressa o caráter único, definitivo e não repetível da oferta com uma locução portuguesa corrente.
theological_decisions:
- issue: Aspecto e força teológica da santificação
  choice: “fomos santificados”, como ação consumada cujo resultado permanece no contexto
  alternative: “estamos santificados” ou “temos sido santificados”
  rationale: O perfeito perifrástico grego não é um presente progressivo. A tradução evita impor uma formulação denominacional sobre santificação meramente posicional ou progressiva, embora o português não reproduza em uma única forma toda a combinação grega de ação concluída e estado vigente.
- issue: Valor cristológico de Χριστοῦ
  choice: “o Messias”
  alternative: “Cristo”
  rationale: A tradução torna transparente o sentido do título grego sem negar que “Cristo” seja a forma tradicional e lexicalmente possível.
- issue: Caráter definitivo da oferta
  choice: “de uma vez por todas”
  alternative: “uma vez”
  rationale: A expressão preserva a ênfase de ἐφάπαξ na singularidade e definitividade da oferta, sem acrescentar uma teoria expiatória além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mediante” preserva precisão sem soar excessivamente técnico; “de uma vez por todas” é natural e enfático. As vírgulas em “Jesus, o Messias,” apresentam o título como aposto claro.
