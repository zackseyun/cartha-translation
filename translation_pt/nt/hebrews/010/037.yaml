id: HEB.10.37
reference: Hebrews 10:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: pt
  text: Pois, dentro de muito pouco tempo,[a] aquele que vem virá e não demorará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um pouco, quanto quanto”; repetição idiomática que enfatiza um intervalo muito breve.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não tardará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Pois, dentro de
  rationale: “Pois” preserva a função explicativa de γάρ, ligando a citação à exortação anterior; ἔτι, em combinação com a expressão temporal seguinte, comunica que ainda resta um breve intervalo.
- source_word: μικρὸν ὅσον ὅσον
  choice: muito pouco tempo
  rationale: A repetição idiomática ὅσον ὅσον intensifica μικρόν. “Muito pouco tempo” expressa naturalmente em português a extrema brevidade do intervalo.
- source_word: ὁ ἐρχόμενος
  choice: aquele que vem
  rationale: O particípio presente com artigo é substantivado. A formulação mantém tanto o sentido verbal quanto a possível força messiânica contextual sem tornar explícito, por capitalização ou título acrescentado, aquilo que o grego deixa implícito.
- source_word: ἥξει
  choice: virá
  rationale: O futuro do indicativo tem força preditiva direta; “virá” também conserva o eco lexical entre ἐρχόμενος e ἥξει.
- source_word: οὐ χρονίσει
  choice: não demorará
  rationale: χρονίζω significa demorar, tardar ou prolongar a espera. “Não demorará” é claro, atual e natural.
theological_decisions:
- issue: Se ὁ ἐρχόμενος deve ser apresentado explicitamente como título messiânico
  choice: Manter “aquele que vem” no texto principal
  alternative: “Aquele que há de vir” ou “o que vem”, com possível leitura titular messiânica
  rationale: O contexto de Hebreus favorece uma referência messiânica, mas a forma grega continua sendo um particípio substantivado e não exige que a tradução marque graficamente um título. A redação escolhida preserva a referência provável e a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição de “vem virá” preservam deliberadamente o jogo verbal do grego, apesar de sua leve estranheza em português.
