base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: pt
  text: Portanto[a], não abandonem a confiança de vocês, que tem grande recompensa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ousadia». O termo grego pode indicar confiança, liberdade franca ou ousadia, especialmente na aproximação de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: não joguem fora
  rationale: O subjuntivo aoristo com μή expressa proibição. A formulação preserva a ideia de renúncia deliberada e enfática, em português corrente.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão prática decorrente da exortação e dos exemplos anteriores.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: a sua ousadia
  rationale: παρρησία pode indicar franqueza, liberdade confiante ou coragem, especialmente no acesso a Deus. “Ousadia” preserva a dimensão corajosa sem reduzir o termo a um sentimento interior.
- source_word: ἥτις ἔχει
  choice: pois ela traz
  rationale: A oração relativa é explicativa. Embora ἔχει signifique literalmente “tem”, “pois ela traz” comunica com naturalidade em português a relação entre a ousadia perseverante e a recompensa, sem alterar o sentido contextual.
- source_word: μεγάλην μισθαποδοσίαν
  choice: uma grande recompensa
  rationale: μισθαποδοσία denota recompensa ou retribuição. “Grande recompensa” é clara, digna e adequada ao sentido positivo do contexto.
theological_decisions:
- issue: Sentido de παρρησία em Hebreus 10:35
  choice: ousadia
  alternative: confiança
  rationale: No contexto de Hebreus, o termo abrange liberdade confiante diante de Deus e coragem para perseverar publicamente na fé. “Ousadia” mantém a força exortativa; “confiança” continua sendo uma alternativa lexical legítima.
- issue: Relação expressa por ἥτις ἔχει com a recompensa
  choice: pois ela traz uma grande recompensa
  alternative: a qual tem uma grande recompensa
  rationale: A construção grega atribui à παρρησία uma grande recompensa. A redação escolhida expressa essa associação de modo idiomático, sem definir além do texto a natureza ou o mecanismo da recompensa.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. Tom direto, digno e exortativo; plural de segunda pessoa expresso pela concordância verbal e pelo possessivo “sua”.
