id: HEB.10.16
reference: Hebrews 10:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: pt
  text: '“Esta é a aliança que farei com eles depois daqueles dias, diz o Senhor: pondo as minhas leis sobre os corações deles e as escreverei na mente deles,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluente: “Porei as minhas leis sobre os corações deles e as escreverei na mente deles”.'
    reason: Alternativa sintática que transforma o particípio grego em verbo finito para maior fluidez em português.
lexical_decisions:
- source_word: διαθήκη
  choice: aliança
  rationale: No contexto de Hebreus e da citação de Jeremias, o termo designa uma aliança estabelecida por Deus, não um testamento no sentido moderno.
- source_word: διαθήσομαι
  choice: farei
  rationale: Na fórmula de aliança, o futuro médio de διατίθεμαι significa fazer ou estabelecer; “farei” é natural em português com “aliança”.
- source_word: πρὸς αὐτούς
  choice: com eles
  rationale: No contexto de fazer uma aliança, πρὸς com pessoas corresponde naturalmente a “com”.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: depois daqueles dias
  rationale: Reproduz de maneira clara e direta a expressão temporal da citação.
- source_word: κύριος
  choice: Senhor
  rationale: Traduz diretamente κύριος e preserva a forma da citação tal como aparece no texto grego de Hebreus.
- source_word: διδοὺς
  choice: pondo
  rationale: O particípio indica a ação pela qual a promessa da aliança se concretiza; “pondo” conserva a construção participial do grego.
- source_word: νόμους
  choice: leis
  rationale: Mantém o plural explícito e a ligação lexical com νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sobre o coração deles
  rationale: “Sobre” preserva a imagem de inscrição associada a ἐπί; o singular distributivo “o coração deles” é natural em português, embora καρδίας esteja no plural grego.
- source_word: διάνοιαν
  choice: mente
  rationale: Designa a faculdade do pensamento e do entendimento; “mente” é a equivalência moderna mais abrangente e natural.
- source_word: ἐπιγράψω
  choice: escreverei
  rationale: Expressa com clareza a ação de escrever ou inscrever; os complementos indicam onde ocorre a escrita.
- source_word: αὐτούς
  choice: as
  rationale: O pronome retoma “leis”; em português, o pronome oblíquo feminino plural torna essa referência explícita e idiomática.
theological_decisions:
- issue: Sintaxe interna da citação de Jeremias
  choice: Manter o particípio “pondo” seguido do futuro finito “escreverei”
  alternative: 'Regularizar em dois verbos finitos: “porei ... e escreverei ...”'
  rationale: A construção conserva a forma específica transmitida no texto grego de Hebreus, sem harmonizá-la silenciosamente com versões mais fluidas da passagem de Jeremias. A nota oferece a formulação portuguesa mais natural.
- issue: Número em καρδίας e διάνοιαν com possuidor plural
  choice: Usar as expressões distributivas “o coração deles” e “a mente deles”
  alternative: “os corações deles” e “as mentes deles”
  rationale: O português usa naturalmente o singular distributivo para partes ou faculdades pertencentes a várias pessoas. Isso mantém o sentido individual sem tornar a frase pesada; διάνοιαν também está no singular no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal preserva deliberadamente a construção participial do grego; a nota apresenta a leitura mais fluente. “Aliança”, “Senhor”, “leis”, “coração” e “mente” mantêm o vocabulário teológico e metafórico sem acrescentar uma interpretação denominacional.
