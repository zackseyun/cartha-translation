id: HEB.10.7
reference: Hebrews 10:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: pt
  text: 'Então eu disse: “Eis que venho — no rolo do livro[a] está escrito a meu respeito — para fazer, ó Deus, a tua vontade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no manuscrito em forma de rolo; não se trata de um livro moderno, com páginas encadernadas.
    reason: Esclarecimento lexical e histórico da expressão ἐν κεφαλίδι βιβλίου.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Introduz de modo natural e conciso a resposta citada, preservando a sequência temporal.
- source_word: εἶπον
  choice: eu disse
  rationale: Tradução direta e idiomática do aoristo de λέγω em uma fórmula de citação.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva a força enfática e o tom solene da citação bíblica sem recorrer ao coloquial “olhe”.
- source_word: ἥκω
  choice: venho
  rationale: O presente grego pode indicar chegada com relevância atual. “Venho” é natural em português e mantém aberta a nuance entre movimento presente e chegada efetivada.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: no rolo do livro
  rationale: No contexto, κεφαλίς designa o rolo que continha o texto, não um cabeçalho ou capítulo. A formulação conserva a imagem antiga, esclarecida em nota.
- source_word: γέγραπται
  choice: está escrito
  rationale: Expressão portuguesa consagrada para o perfeito passivo, comunicando que o que foi escrito permanece registrado e válido.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Equivalente atual e preciso de περί com genitivo, adequado ao registro digno da passagem.
- source_word: τοῦ ποιῆσαι
  choice: para fazer
  rationale: Expressa diretamente a finalidade associada à vinda do falante.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: Embora formalmente nominativo, a expressão tem força vocativa; “ó Deus” marca com clareza o discurso direto.
- source_word: τὸ θέλημά σου
  choice: a tua vontade
  rationale: Preserva o termo teologicamente significativo θέλημα e mantém a segunda pessoa singular do discurso dirigido a Deus.
theological_decisions:
- issue: Autorreferência messiânica na citação do Salmo aplicada em Hebreus
  choice: Manter a declaração na primeira pessoa, sem identificar explicitamente o falante no versículo.
  alternative: Acrescentar no texto principal que o falante é o Messias ou Cristo.
  rationale: O contexto de Hebreus aplica as palavras ao Filho, mas o versículo citado apresenta apenas a fala em primeira pessoa. A tradução deixa que o contexto estabeleça a aplicação cristológica, sem inserir uma explicação interpretativa no texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Eis que” conserva o tom marcado da citação; os travessões delimitam naturalmente a oração parentética. Emprega-se “tua” em coerência com o tratamento direto singular presente no grego.
