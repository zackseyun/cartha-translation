source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: pt
  text: Mas este, depois de oferecer para sempre um único sacrifício pelos pecados[a], sentou-se à direita de Deus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como “depois de oferecer um único sacrifício pelos pecados, válido para sempre” ou como “sentou-se para sempre”. Sua posição permite mais de uma ligação sintática.
    reason: alternative_reading
  - marker: b
    text: “À direita de Deus” faz eco ao Salmo 110:1, texto central em Hebreus para a exaltação do Messias.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: este
  rationale: Preserva a força demonstrativa e o contraste com os sacerdotes do versículo anterior, sem acrescentar um substantivo ausente no grego.
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste com os sacerdotes que permanecem de pé e oferecem repetidamente sacrifícios.
- source_word: μίαν ... θυσίαν
  choice: um único sacrifício
  rationale: Destaca a singularidade enfática da oferta em contraste com a multiplicidade dos sacrifícios anteriores.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: pelos pecados
  rationale: Formulação portuguesa natural para a finalidade sacrificial, mantendo o plural do grego.
- source_word: προσενέγκας
  choice: depois de oferecer
  rationale: Torna clara a anterioridade do particípio aoristo em relação ao verbo principal.
- source_word: εἰς τὸ διηνεκές
  choice: válido para sempre
  rationale: Comunica de forma acessível a permanência da eficácia do sacrifício; a nota preserva a ambiguidade sintática da expressão grega.
- source_word: ἐκάθισεν
  choice: sentou-se
  rationale: Mantém a ação concluída e o contraste contextual entre o sacerdote que permanece de pé e Cristo que se senta.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: à direita de Deus
  rationale: Expressão tradicional, clara e adequada à alusão ao Salmo 110:1.
theological_decisions:
- issue: Alcance sintático de εἰς τὸ διηνεκές
  choice: Ligado no texto principal à validade permanente do único sacrifício.
  alternative: Pode ligar-se mais diretamente ao ato de oferecer — “ofereceu para sempre um único sacrifício pelos pecados” — ou ao ato de sentar-se — “sentou-se para sempre à direita de Deus”.
  rationale: O contexto contrasta o sacrifício único e eficaz com ofertas repetidas. Contudo, a ordem grega permite mais de uma ligação sintática, por isso a nota conserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Este” mantém o contraste demonstrativo; “um único sacrifício” soa natural e preserva a ênfase. A formulação “válido para sempre” explicita a eficácia duradoura sem ocultar, graças à nota, a ambiguidade sintática do original.
