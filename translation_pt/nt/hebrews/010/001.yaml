  naturalness: O registro é claro, moderno e apropriado. A frase fica mais natural e mais próxima da sintaxe argumentativa do original se permanecer como uma única construção, sem a divisão após a nota a nem o conectivo explicativo acrescentado.
  terminology: “Lei”, “sombra”, “bens ... por vir”, “realidades”, “aperfeiçoar” e “os que se aproximam” são escolhas adequadas. “A própria imagem” é mais diretamente correspondente a εἰκών do que “a própria forma”, preservando simultaneamente o contraste metafórico com “sombra”.
