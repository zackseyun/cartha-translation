source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: pt
  text: Pois a Lei tem apenas uma sombra dos bens que estão por vir, não a própria imagem das realidades; e nunca pode, pelos mesmos sacrifícios que oferecem continuamente, ano após ano, aperfeiçoar[b] os que se aproximam[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não a própria forma das realidades”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornar perfeitos” ou “levar à plena realização”. Aqui, o termo não se limita à ideia de perfeição moral.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, os que se aproximam de Deus em adoração.
    reason: cultural_note
lexical_decisions:
- source_word: Σκιὰν
  choice: uma sombra
  rationale: Preserva a metáfora explícita de σκιά e seu contraste com εἰκών, sem substituí-la pela interpretação mais explicativa “prenúncio”.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: dos bens que estão por vir
  rationale: Expressa de modo natural o caráter futuro ou iminente indicado pelo particípio de μέλλω, sem definir além do texto o momento escatológico.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: e não a própria forma das realidades
  rationale: “Própria” conserva a ênfase de αὐτήν; “forma” comunica o contraste entre a sombra e aquilo que corresponde plenamente às realidades, enquanto a nota registra a tradução mais literal de εἰκών.
- source_word: κατ’ ἐνιαυτὸν
  choice: ano após ano
  rationale: Realça a repetição anual que sustenta o argumento sobre a incapacidade dos sacrifícios reiterados.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: com os mesmos sacrifícios
  rationale: Traduz o dativo instrumental e preserva a ênfase na repetição dos mesmos sacrifícios.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: que eles oferecem continuamente
  rationale: Mantém a voz ativa e o sujeito humano indefinido do grego; “continuamente” representa εἰς τὸ διηνεκές no sentido de prática persistente e reiterada.
- source_word: οὐδέποτε δύναται
  choice: nunca pode
  rationale: Reproduz de forma direta tanto a capacidade negada por δύναται quanto a negação absoluta de οὐδέποτε.
- source_word: τοὺς προσερχομένους
  choice: os que se aproximam
  rationale: Conserva a imagem de aproximação e não explicita no corpo do texto o complemento “de Deus”, embora esse sentido cultual seja indicado pela nota.
- source_word: τελειῶσαι
  choice: aperfeiçoar
  rationale: Preserva um termo teologicamente importante em Hebreus e sua ideia de conduzir ao objetivo pretendido, sem reduzi-lo a mera melhoria moral.
theological_decisions:
- issue: Contraste entre sombra, imagem e realidade na teologia cultual
  choice: A Lei possui uma sombra dos bens futuros, não a própria forma das realidades.
  alternative: A Lei seria uma representação simbólica que já constitui a imagem plena dos bens futuros.
  rationale: O grego contrasta explicitamente σκιά com αὐτὴν τὴν εἰκόνα. A tradução mantém a tensão entre antecipação e realidade plena sem negar a origem ou a função divina da Lei.
- issue: Sentido de τελειῶσαι no contexto sacrificial de Hebreus
  choice: aperfeiçoar
  alternative: completar; levar à plena realização
  rationale: Em Hebreus, o verbo se relaciona ao alcance do objetivo cultual e ao acesso efetivo a Deus. “Aperfeiçoar” preserva essa ressonância sem afirmar necessariamente perfeição moral sem pecado.
- issue: Complemento implícito de τοὺς προσερχομένους
  choice: Manter “os que se aproximam” no texto e explicar a aproximação cultual em nota.
  alternative: Explicitar no texto “os que se aproximam de Deus para adorá-lo”.
  rationale: O contexto favorece a aproximação de Deus em culto, mas o complemento não está expresso neste versículo; mantê-lo implícito evita resolver silenciosamente essa característica do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Lei” recebe inicial maiúscula por se referir à Lei mosaica no contexto. A ordem foi levemente ajustada para fluidez, mantendo juntas as ideias de oferta contínua e repetição anual. O conectivo “Por isso” explicita em português a relação lógica interna da longa oração grega sem acrescentar uma conclusão externa ao versículo.
