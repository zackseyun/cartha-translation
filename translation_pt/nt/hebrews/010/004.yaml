  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: pt
  text: Pois é impossível que o sangue de touros e bodes tire pecados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “remova pecados”. O verbo grego pode significar tirar ou remover.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: é impossível
  rationale: O adjetivo predicativo, empregado de modo impessoal com o infinitivo, pede em português a expressão natural “é impossível”, preservando a força absoluta da afirmação.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação que sustenta o argumento anterior; “pois” mantém de forma concisa essa ligação lógica.
- source_word: αἷμα
  choice: sangue
  rationale: Mantém a referência sacrificial explícita e central ao argumento de Hebreus, sem parafraseá-la como “sacrifício” ou “morte”.
- source_word: ταύρων
  choice: de touros
  rationale: Reproduz naturalmente o genitivo plural dependente de “sangue”.
- source_word: τράγων
  choice: bodes
  rationale: O termo grego designa especificamente cabritos machos; “bodes” preserva essa precisão em português e é adequado ao contexto sacrificial.
- source_word: ἀφαιρεῖν
  choice: tire
  rationale: “Tirar” comunica de modo natural e concreto a ideia de remover, sem acrescentar uma explicação doutrinária sobre a forma ou o alcance dessa remoção.
- source_word: ἁμαρτίας
  choice: pecados
  rationale: Conserva o plural explícito do grego, sem reduzi-lo ao conceito abstrato singular de pecado.
theological_decisions:
- issue: Eficácia dos sacrifícios de animais em Hebreus
  choice: Afirmar simplesmente que o sangue de animais não pode tirar pecados.
  alternative: Explicitar que os sacrifícios cobriam pecados temporariamente ou proporcionavam purificação ritual sem remoção definitiva.
  rationale: O texto principal permanece próximo ao grego e preserva a tensão do argumento, sem inserir uma teoria sobre eficácia temporária, cobertura ou purificação ritual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” conserva a conexão argumentativa; “bodes” mantém a especificidade lexical do grego; “tire pecados” é natural e preserva a imagem concreta do original.
