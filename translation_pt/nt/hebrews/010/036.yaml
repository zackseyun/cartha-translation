id: HEB.10.36
reference: Hebrews 10:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: pt
  text: Pois vocês precisam de perseverança, para que, depois de fazerem a vontade de Deus, recebam a promessa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebam aquilo que foi prometido”.'
    reason: A expressão grega pode designar tanto a promessa quanto o seu conteúdo ou cumprimento.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: perseverança
  rationale: O termo descreve constância sob pressão e firmeza em meio à provação. “Perseverança” é natural em português e comunica tanto resistência quanto continuidade fiel.
- source_word: χρείαν ἔχετε
  choice: vocês precisam de
  rationale: A expressão idiomática significa “ter necessidade de”. A formulação direta é mais natural no português atual e preserva plenamente a força do grego.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido, expresso de modo claro e idiomático por “para que”.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: a vontade de Deus
  rationale: Reproduz de forma direta e consagrada a construção genitiva grega.
- source_word: ποιήσαντες
  choice: depois de fazerem
  rationale: O particípio aoristo indica aqui uma ação anterior à de receber; a tradução torna explícita essa relação temporal sem acrescentar conteúdo.
- source_word: κομίσησθε
  choice: recebam
  rationale: No contexto, o verbo significa receber ou obter aquilo que foi prometido. “Recebam” é claro, natural e adequado ao registro.
- source_word: τὴν ἐπαγγελίαν
  choice: a promessa
  rationale: Mantém a forma substantiva do grego e preserva a possível tensão entre a promessa como palavra dada e o seu cumprimento ou conteúdo.
theological_decisions:
- issue: Se ἐπαγγελίαν se refere à própria promessa ou àquilo que foi prometido
  choice: a promessa
  alternative: aquilo que foi prometido
  rationale: Embora a combinação com κομίσησθε possa apontar idiomaticamente para o recebimento da bênção prometida, o texto grego diz literalmente “a promessa”. A tradução principal preserva essa formulação e deixa a explicitação interpretativa para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” representa o destinatário plural do grego. A sintaxe foi levemente ajustada à naturalidade do português, preservando a relação lógica e temporal do original.
