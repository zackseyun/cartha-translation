source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: pt
  text: Mas nesses sacrifícios há, ano após ano, uma lembrança dos pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os anos”.'
    reason: Alternativa lexical para κατ’ ἐνιαυτόν, com o mesmo sentido básico de recorrência anual.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Conjunção adversativa que liga o versículo à afirmação anterior de que os sacrifícios não podem aperfeiçoar os que prestam culto; “Mas” é natural e conciso em português.
- source_word: ἐν αὐταῖς
  choice: nesses sacrifícios
  rationale: O pronome feminino plural retoma os sacrifícios mencionados no contexto anterior. Explicitar o referente evita ambiguidade em português sem acrescentar conteúdo novo.
- source_word: ἀνάμνησις
  choice: uma lembrança
  rationale: O substantivo indica o ato ou meio de trazer algo à memória. “Uma lembrança” conserva a formulação sóbria do grego e o contraste entre recordar pecados e removê-los.
- source_word: ἁμαρτιῶν
  choice: dos pecados
  rationale: Reproduz naturalmente o genitivo dependente de ἀνάμνησις, mantendo os pecados como aquilo que é trazido à memória.
- source_word: κατ’ ἐνιαυτόν
  choice: ano após ano
  rationale: A expressão temporal indica recorrência anual. “Ano após ano” comunica de modo idiomático a repetição contínua relevante para o argumento de Hebreus.
theological_decisions:
- issue: Referente de αὐταῖς
  choice: Explicitar o referente como “nesses sacrifícios”.
  alternative: Traduzir apenas “neles” ou “nelas”.
  rationale: O contexto imediato trata dos mesmos sacrifícios continuamente oferecidos. A explicitação dá clareza sem decidir além do que o contexto estabelece.
- issue: Sentido de κατ’ ἐνιαυτόν
  choice: Traduzir “ano após ano”, ressaltando a recorrência anual.
  alternative: “todos os anos” ou “anualmente”.
  rationale: Todas as opções exprimem frequência anual, mas “ano após ano” preserva melhor a ênfase contextual na repetição, sem especificar no texto uma cerimônia que o versículo não nomeia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para “há, ano após ano” por fluidez, mantendo a relação semântica do grego.
