  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: pt
  text: Nós, porém, não somos dos que recuam para a destruição, mas dos que têm fé[a] para a preservação da vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fidelidade”. Neste contexto, “fé” pode incluir a ideia de perseverança fiel.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “para a preservação da alma” ou “para ganhar a vida”. A expressão grega também pode ser entendida como obtenção ou posse da vida, e “vida” pode referir-se à própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Nós, porém
  rationale: Mantém o pronome explícito e enfático e expressa de modo natural o forte contraste com a advertência anterior.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: não somos dos que recuam
  rationale: O genitivo descreve pertencimento ou característica. Esta formulação portuguesa conserva a concisão e comunica retirada ou recuo sem definir o termo, de maneira excessiva, como apostasia consumada.
- source_word: εἰς ἀπώλειαν
  choice: para a destruição
  rationale: Representa o resultado ou destino indicado por εἰς e mantém a gravidade de ἀπώλεια em linguagem atual.
- source_word: ἀλλὰ πίστεως
  choice: mas dos que têm fé
  rationale: Torna natural em português a elipse paralela do grego e mantém πίστις como fé, sem excluir a nuance contextual de fidelidade perseverante.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: para a preservação da vida
  rationale: O contraste com destruição favorece preservação. Aqui ψυχή pode designar a vida ou a própria pessoa, e 'vida' evita restringir indevidamente o termo ao conceito moderno de uma alma separada.
theological_decisions:
- issue: Sentido de πίστις em contraste com ὑποστολή
  choice: fé
  alternative: fidelidade
  rationale: O contexto apresenta a postura crente que persevera em oposição ao recuo. 'Fé' preserva o sentido central, enquanto a possível nuance de fidelidade é registrada em nota.
- issue: Sentido de περιποίησις ψυχῆς
  choice: preservação da vida
  alternative: obtenção da alma; preservação da alma
  rationale: O paralelo antitético com destruição favorece a ideia de preservação, mas περιποίησις também pode indicar obtenção ou aquisição. A nota mantém essa amplitude sem sugerir que a salvação seja merecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção 'somos dos que' explicita naturalmente o genitivo de categoria do grego; 'recuam' evita tanto um literalismo estranho quanto a interpretação mais forte e não obrigatória de apostasia.
