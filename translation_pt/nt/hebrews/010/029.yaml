  to: Quanto mais severo castigo vocês acham que merecerá aquele que pisoteou o Filho de Deus, considerou comum[a] o sangue da aliança pelo qual foi santificado[b] e insultou[c] o Espírito da graça?
  rationale: A revisão torna idiomática a pergunta retórica e substitui «pisou» por «pisoteou», que expressa mais claramente a imagem intensiva de καταπατήσας. Não altera a referência sintática mais direta de «foi santificado» nem resolve a questão teológica debatida; a nota correspondente é mantida.
