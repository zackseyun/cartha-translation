reference: Hebrews 10:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: pt
  text: Quanto mais severo castigo vocês acham que merecerá aquele que pisoteou o Filho de Deus, considerou comum[a] o sangue da aliança pelo qual foi santificado[b] e insultou[c] o Espírito da graça?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «impuro» ou «profano».
    reason: lexical_alternative
  - marker: b
    text: Em grego, a expressão «pelo qual foi santificado» está sintaticamente ligada à pessoa descrita no versículo; alguns intérpretes entendem o referente de outra maneira. A tradução preserva a ambiguidade, sem resolver o debate teológico.
    reason: alternative_reading
  - marker: c
    text: Ou «ultrajou».
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: De quanto pior
  rationale: Reproduz de modo natural a força comparativa da pergunta retórica, sem reduzir χείρονος a uma mera intensificação.
- source_word: ἀξιωθήσεται τιμωρίας
  choice: será considerado digno ... de castigo
  rationale: Mantém o passivo judicial de ἀξιωθήσεται e traduz τιμωρία pelo termo corrente e claro «castigo».
- source_word: καταπατήσας
  choice: pisou
  rationale: Conserva a imagem concreta de tratar o Filho de Deus com extremo desprezo; «pisou» é corrente e dispensa a redundância menos natural de «pisou debaixo dos pés».
- source_word: κοινὸν ἡγησάμενος
  choice: considerou comum
  rationale: Preserva o contraste de κοινός com aquilo que é santo ou consagrado, sem decidir entre as possíveis nuances de «impuro» e «profano».
- source_word: αἷμα τῆς διαθήκης
  choice: o sangue da aliança
  rationale: Mantém a expressão bíblica e suas ressonâncias sacrificiais e pactuais.
- source_word: ἐν ᾧ ἡγιάσθη
  choice: pelo qual foi santificado
  rationale: Expressa o sentido instrumental provável de ἐν ᾧ, conserva a voz passiva e mantém o vocabulário teológico de santificação.
- source_word: ἐνυβρίσας
  choice: insultou
  rationale: Comunica em linguagem atual a ação de tratar com desprezo abusivo; «ultrajou» é uma alternativa mais forte e formal.
- source_word: πνεῦμα τῆς χάριτος
  choice: o Espírito da graça
  rationale: Preserva o genitivo grego e a formulação teológica sem explicá-la além do texto.
theological_decisions:
- issue: Referente de «foi santificado» (ἐν ᾧ ἡγιάσθη)
  choice: A redação segue a ligação sintática mais direta com «aquele» que pratica as ações descritas.
  alternative: Entender o referente como Cristo, o sangue ou a comunidade da aliança.
  rationale: O sujeito singular retratado pelos particípios é o referente gramatical mais próximo. Como a identificação é teologicamente debatida, a tradução conserva a sintaxe e acrescenta uma nota, sem resolver a questão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «será considerado digno» conserva deliberadamente o passivo judicial do grego, embora seja um pouco mais formal que «merecerá».
