id: HEB.10.9
reference: Hebrews 10:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: pt
  text: 'Então ele disse: “Eis que vim para fazer a tua vontade.” Ele remove o primeiro para estabelecer o segundo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“O primeiro” e “o segundo” provavelmente se referem, respectivamente, ao sistema anterior de sacrifícios e à realidade que o substitui: a vontade de Deus cumprida na oferta do Messias. Também podem ser entendidos mais estritamente como a primeira e a segunda declarações da citação, ou mais amplamente como a antiga e a nova aliança.'
    reason: Preservar no texto principal a concisão e a ambiguidade dos adjetivos substantivados gregos, oferecendo ao leitor as principais possibilidades contextuais.
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a sequência lógica e temporal com o argumento e a citação anteriores, em português natural.
- source_word: εἴρηκεν
  choice: disse
  rationale: Embora seja um perfeito grego, neste encadeamento com τότε o pretérito perfeito simples é natural em português e apresenta a declaração anterior com relevância para o argumento presente.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Conserva o caráter enfático e o tom elevado da introdução, sem recorrer ao mais coloquial “Olhe”.
- source_word: ἥκω
  choice: vim
  rationale: Expressa de modo idiomático a chegada já realizada e pertinente no presente; “venho” seria possível, mas menos natural nesta declaração.
- source_word: τοῦ ποιῆσαι
  choice: para fazer
  rationale: Reproduz claramente o sentido de finalidade do infinitivo articular.
- source_word: τὸ θέλημά σου
  choice: a tua vontade
  rationale: Mantém o termo teologicamente importante θέλημα e o tratamento singular presente no texto-fonte.
- source_word: ἀναιρεῖ
  choice: remove
  rationale: Comunica que o primeiro é retirado ou posto de lado, sem acrescentar a noção jurídica mais forte de “abolir”.
- source_word: τὸ πρῶτον
  choice: o primeiro
  rationale: Preserva a formulação substantivada e concisa do grego, deixando o contexto determinar o referente.
- source_word: ἵνα
  choice: para
  rationale: Expressa de maneira direta e natural a finalidade da remoção do primeiro.
- source_word: τὸ δεύτερον
  choice: o segundo
  rationale: Mantém o paralelismo terso com “o primeiro” e evita inserir uma interpretação no corpo do texto.
- source_word: στήσῃ
  choice: estabelecer
  rationale: Transmite a ideia de fazer vigorar ou firmar o segundo, em contraste com remover o primeiro.
theological_decisions:
- issue: Referente de “o primeiro” e “o segundo”
  choice: Manter as expressões concisas e sem complemento no texto principal.
  alternative: Explicitar “o primeiro sistema de sacrifícios” e “a vontade de Deus cumprida na oferta do Messias”, ou entendê-las como as duas declarações da citação ou, de forma mais ampla, como a antiga e a nova aliança.
  rationale: Hebreus 10:8–10 contrasta sacrifícios e ofertas com o cumprimento da vontade de Deus. A redação grega, porém, não nomeia expressamente os dois referentes; por isso, a tradução preserva a tensão e deixa a explicação para a nota.
- issue: Sujeito de ἀναιρεῖ (“remove”)
  choice: Conservar o sujeito implícito como “ele”, retomado naturalmente do enunciado anterior.
  alternative: Explicitar “Cristo remove” ou “Deus remove”.
  rationale: O grego não torna o referente explícito nesta oração. Inserir um nome resolveria uma questão interpretativa que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Eis que” conserva o tom bíblico elevado; “remove” e “estabelecer” são claros sem impor uma formulação confessional. A colocação do marcador após “o segundo” liga a nota diretamente à ambiguidade que ela explica.
