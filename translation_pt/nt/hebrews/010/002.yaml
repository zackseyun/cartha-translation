id: HEB.10.2
reference: Hebrews 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: pt
  text: Do contrário, não teriam deixado de ser oferecidos? Pois os que prestam culto, uma vez purificados[b], já não teriam consciência alguma dos pecados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consciência culpada por causa dos pecados”. A expressão grega pode indicar consciência, percepção ou senso dos pecados; aqui se refere ao contínuo senso de culpa diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “purificados de uma vez por todas”. Neste contexto, “uma vez” pode ter o sentido de algo definitivo e irrepetível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Do contrário
  rationale: No argumento contrafactual iniciado no versículo anterior, introduz a consequência que seria esperada se os sacrifícios realmente aperfeiçoassem os adoradores.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: não teriam deixado de ser oferecidos?
  rationale: Preserva a pergunta retórica contrafactual e o sentido sacrificial do particípio passivo.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: Pois ... já não teriam ... alguma
  rationale: Expressa de modo natural a razão indicada pela construção com διά e o estado hipotético posterior à purificação.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: consciência alguma dos pecados
  rationale: Mantém a amplitude de συνείδησις entre consciência, percepção e senso de culpa, sem sugerir perda da capacidade moral de reconhecer o pecado.
- source_word: τοὺς λατρεύοντας
  choice: os que prestam culto
  rationale: Conserva o sentido verbal e cultual de λατρεύω, apropriado ao contexto dos sacrifícios.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: uma vez purificados
  rationale: O particípio perfeito passivo indica purificação concluída com resultado duradouro; ἅπαξ pode significar simplesmente 'uma vez' ou, contextualmente, 'de uma vez por todas'.
theological_decisions:
- issue: Sentido de συνείδησιν ἁμαρτιῶν após a purificação
  choice: consciência alguma dos pecados
  alternative: consciência culpada por causa dos pecados
  rationale: A tradução preserva a formulação grega e sua ambiguidade lexical, ao mesmo tempo que o contexto aponta para a persistente consciência de culpa diante de Deus, não para a eliminação do discernimento moral.
- issue: Força de ἅπαξ
  choice: uma vez
  alternative: de uma vez por todas
  rationale: A forma mais contida evita explicitar no texto principal uma nuance definitiva que o contexto pode sustentar, mas que não precisa ser imposta ao advérbio isoladamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prestam culto” conserva o contexto cultual sem soar excessivamente técnico; a pergunta retórica e a relação lógica do grego foram mantidas.
