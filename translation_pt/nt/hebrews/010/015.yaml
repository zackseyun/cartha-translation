  text: μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον, μετὰ γὰρ τὸ ⸀εἰρηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: pt
  text: 'E o Espírito Santo também nos dá testemunho[a], pois, depois de dizer:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «testifica-nos».'
    reason: Alternativa lexical e sintática possível para μαρτυρεῖ ἡμῖν.
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: dá testemunho
  rationale: Preserva com naturalidade o campo semântico de testemunha e depoimento do verbo μαρτυρέω; o presente indica a ação testemunhal do Espírito no texto citado.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ funciona como conectivo leve que dá continuidade ao argumento, sem exigir contraste forte.
- source_word: ἡμῖν
  choice: nos
  rationale: O dativo indica os destinatários do testemunho; em português, a construção idiomática é «dar-nos testemunho» ou «nos dar testemunho».
- source_word: καὶ
  choice: também
  rationale: 'Expressa a força aditiva: o Espírito Santo é apresentado como testemunha adicional no argumento.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: o Espírito Santo
  rationale: É a designação padrão, clara e contemporânea em português, e a construção grega identifica especificamente o Espírito Santo.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: pois, depois de dizer
  rationale: O infinitivo articular com μετά expressa sequência temporal. A formulação mantém implícito, como no grego, o sujeito recuperável da oração anterior e introduz a citação seguinte.
theological_decisions:
- issue: Ação pessoal do Espírito Santo ao testemunhar
  choice: o Espírito Santo também nos dá testemunho
  alternative: o Espírito Santo também testemunha para nós
  rationale: A tradução conserva o Espírito Santo como agente ativo do testemunho, sem acrescentar uma interpretação além da sintaxe grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Dá testemunho» preserva a imagem forense sem soar arcaico. A vírgula após «pois» delimita a locução temporal que introduz a citação subsequente.
