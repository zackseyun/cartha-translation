lexical_decisions:
- source_word: ἣν
  choice: a qual
  rationale: Pronome relativo que mantém a ligação sintática com o antecedente no versículo anterior sem explicitá-lo além do grego.
- source_word: ἐνεκαίνισεν
  choice: inaugurou
  rationale: Preserva a ideia de estabelecer ou dedicar algo novo para uso, incluindo a nuance cultual do contexto.
- source_word: ἡμῖν
  choice: para nós
  rationale: Expressa naturalmente o dativo de benefício.
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: um caminho novo e vivo
  rationale: Formulação natural que conserva tanto a novidade do acesso quanto o adjetivo 'vivo', sem interpretá-lo como 'que dá vida'.
- source_word: διὰ τοῦ καταπετάσματος
  choice: através da cortina
  rationale: καταπέτασμα designa a cortina do santuário; 'cortina' é atual e acessível, enquanto 'véu' é mantido como alternativa tradicional em nota.
- source_word: τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ
  choice: isto é, da sua carne
  rationale: Mantém a aposição explicativa do grego e identifica metaforicamente a cortina com a carne dele, sem acrescentar uma segunda ocorrência de 'através de'.
theological_decisions:
- issue: Identificação metafórica da cortina com a carne de Jesus
  choice: isto é, da sua carne
  alternative: isto é, através da sua carne
  rationale: A construção grega é apositiva e explica a cortina em relação à carne de Jesus. A tradução conserva essa identificação e sua tensão tipológica sem explicá-la doutrinariamente nem repetir uma preposição ausente.
- issue: Tradução de σάρξ
  choice: carne
  alternative: corpo
  rationale: '''Carne'' é a correspondência textual mais transparente neste uso literal referente à humanidade corporal e sacrificial de Jesus; ''corpo'' reduziria a ligação lexical com σάρξ.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A redação preserva o encadeamento com o versículo anterior e a vírgula final indica que a frase continua.
