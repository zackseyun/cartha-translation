  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: pt
  text: Não te agradaste de holocaustos nem de ofertas pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não te agradaste de holocaustos nem de sacrifícios pelo pecado.” A expressão grega traduzida por “ofertas pelo pecado” é uma fórmula sacrificial que se refere a uma oferta feita pelo pecado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Em português bíblico, “holocaustos” designa de modo conciso e reconhecível os sacrifícios inteiramente consumidos pelo fogo; neste contexto cultual, não se confunde normalmente com o uso histórico moderno da palavra.
- source_word: καὶ
  choice: nem
  rationale: Embora καί seja literalmente “e”, após a negação portuguesa a coordenação “nem” expressa com naturalidade que a negação abrange as duas categorias de sacrifício.
- source_word: περὶ ἁμαρτίας
  choice: ofertas pelo pecado
  rationale: A expressão é idiomática em contexto sacrificial e indica ofertas feitas em relação ao pecado. “Ofertas pelo pecado” preserva o sentido cultual sem reduzir a expressão a uma formulação abstrata.
- source_word: οὐκ εὐδόκησας
  choice: não te agradaste
  rationale: Mantém a segunda pessoa singular dirigida a Deus e comunica o sentido avaliativo de εὐδοκέω de maneira natural e digna, sem intensificá-lo indevidamente como “detestaste”.
theological_decisions:
- issue: Terminologia sacrificial na citação do Salmo 40 segundo a Septuaginta
  choice: Preservar as categorias específicas “holocaustos” e “ofertas pelo pecado”.
  alternative: “sacrifícios queimados e sacrifícios pelo pecado” ou termos sacrificiais genéricos.
  rationale: A argumentação de Hebreus depende do contraste entre categorias concretas do culto sacrificial e a obediência do Filho. A tradução mantém essa especificidade sem acrescentar uma interpretação doutrinária.
- issue: Alcance da desaprovação divina
  choice: “não te agradaste”
  alternative: “não aceitaste”
  rationale: O verbo exprime agrado ou aprovação, não necessariamente rejeição absoluta da instituição sacrificial. A formulação preserva a tensão do texto no contexto da citação.
translation_notes:
  register: Português moderno, claro e digno, com terminologia bíblica amplamente reconhecida. A ordem foi ajustada ao português natural, mantendo a negação, a segunda pessoa dirigida a Deus e as duas categorias sacrificiais.
