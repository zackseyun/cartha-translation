  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: pt
  text: Mas lembrem-se dos dias passados, quando, depois de terem sido iluminados[a][b], vocês suportaram um grande combate de sofrimentos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando foram iluminados”. O particípio grego pode indicar uma ação anterior ao combate ou temporalmente associada a ele.'
    reason: lexical_alternative
  - marker: b
    text: “Iluminados” pode referir-se de modo amplo ao recebimento de iluminação espiritual; há quem relacione a expressão à conversão, ao batismo ou à instrução na fé.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “uma grande luta de sofrimentos”. O substantivo grego traz a ideia de luta ou competição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: lembrem-se
  rationale: O imperativo presente, na segunda pessoa do plural, é expresso de modo natural e direto em português; o aspecto continuativo pode estar implícito na exortação.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição retórica e o contraste moderado entre a advertência anterior e o apelo para recordar a perseverança passada.
- source_word: τὰς πρότερον ἡμέρας
  choice: os dias passados
  rationale: Expressão corrente e clara para o período anterior da experiência dos destinatários.
- source_word: ἐν αἷς
  choice: quando
  rationale: Embora literalmente signifique “nos quais”, a relação é temporal; “quando” evita rigidez sem perder o sentido.
- source_word: φωτισθέντες
  choice: depois de serem iluminados
  rationale: Preserva a metáfora do aoristo passivo e apresenta a iluminação como anterior à perseverança, sem definir em que evento religioso ela consistiu; uma nota registra a possibilidade de simultaneidade temporal.
- source_word: πολλὴν ἄθλησιν
  choice: uma dura luta
  rationale: ἄθλησις evoca luta ou competição, e πολλήν intensifica sua magnitude. “Dura luta” comunica naturalmente em português tanto o conflito quanto sua intensidade.
- source_word: ὑπεμείνατε
  choice: vocês suportaram
  rationale: Reproduz o aoristo indicativo e o sentido de permanecer firme sob experiências dolorosas.
- source_word: παθημάτων
  choice: em meio a sofrimentos
  rationale: O genitivo caracteriza a luta pelas aflições enfrentadas. A formulação é mais natural em português do que o literal “luta de sofrimentos” e mantém a abrangência do termo.
theological_decisions:
- issue: Sentido de φωτισθέντες no contexto da exortação e advertência
  choice: Manter a metáfora “serem iluminados” sem identificar seu referente exato.
  alternative: Traduzir como “depois de se converterem”, “depois de serem batizados” ou “depois de receberem instrução na fé”.
  rationale: O texto aponta para uma iluminação espiritual anterior, mas não a identifica explicitamente com conversão, batismo ou instrução catequética. A tradução preserva essa abertura teológica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural e construção idiomática de ampla legibilidade brasileira. A metáfora teológica e a imagem de combate foram preservadas sem linguagem denominacional.
