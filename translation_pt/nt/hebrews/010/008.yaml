    rationale: É um termo bíblico tradicional, mas em português contemporâneo sua acepção histórica moderna é muito dominante. “Ofertas totalmente queimadas”, com “holocaustos” como alternativa em nota, mantém a especificidade cultual com maior transparência internacional.
