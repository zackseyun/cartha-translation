source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: pt
  text: 'Depois de dizer acima: “Sacrifícios, ofertas, ofertas totalmente queimadas[a] e ofertas pelo pecado[b] não quiseste, nem nelas tiveste prazer” — que são oferecidos segundo a lei[c] —,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “holocaustos”. Refere-se a ofertas inteiramente consumidas pelo fogo sobre o altar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ofertas por causa do pecado”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, segundo a Lei de Moisés.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Tendo dito anteriormente
  rationale: Retoma a parte anterior da citação e mantém a relação participial com o que segue no argumento.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Sacrifícios, ofertas
  rationale: Emprega termos cultuais claros e correntes, preservando as categorias enumeradas.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Termo bíblico tradicional em português para ofertas inteiramente consumidas pelo fogo; a nota esclarece seu sentido atual e evita possível ambiguidade.
- source_word: περὶ ἁμαρτίας
  choice: ofertas pelo pecado
  rationale: Expressa a categoria sacrificial sem transformar a frase em uma afirmação teológica mais ampla sobre o pecado.
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: não quiseste nem neles tiveste prazer
  rationale: Preserva a distinção entre querer e ter prazer, com o objeto pronominal naturalmente explicitado em português.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: embora sejam oferecidos conforme a Lei
  rationale: O relativo tem aqui valor explicativo e possivelmente concessivo no fluxo argumentativo; “embora” torna clara a tensão entre a afirmação citada e a prescrição legal sem resolvê-la. “Lei” identifica, no contexto, a Lei mosaica.
theological_decisions:
- issue: A tensão entre a rejeição retórica dos sacrifícios e sua oferta prescrita pela Lei
  choice: “embora sejam oferecidos conforme a Lei”
  alternative: “os quais são oferecidos segundo a lei”
  rationale: 'A formulação conserva a tensão do texto: Deus não quis nem aprovou esses sacrifícios no sentido exposto pela citação, embora fossem oferecidos em conformidade com a Lei. Não conclui que a Lei fosse ilegítima.'
- issue: Especificidade das categorias sacrificiais
  choice: “Sacrifícios, ofertas, holocaustos e ofertas pelo pecado”
  alternative: “Sacrifícios e dádivas, ofertas queimadas e ofertas por causa do pecado”
  rationale: Mantém a linguagem cultual e as categorias da enumeração sem inserir uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Holocaustos” é mantido como termo cultual bíblico, acompanhado de nota para evitar a associação exclusiva com o genocídio do século XX. A frase permanece aberta por travessões e vírgula porque o versículo continua sintaticamente no seguinte.
