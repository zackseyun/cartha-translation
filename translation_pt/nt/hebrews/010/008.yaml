  source_fidelity: A enumeração sacrificial e os dois verbos negativos são transmitidos de modo fiel. Contudo, αἵτινες κατὰ νόμον προσφέρονται é uma oração relativa explicativa (“que são oferecidos segundo a lei”), não traz uma conjunção concessiva; “embora” introduz uma relação lógica que o grego não exprime.
  naturalness: A redação é geralmente clara e de registro bíblico moderno. “Ofertas totalmente queimadas” comunica com precisão o sentido de ὁλοκαυτώματα e evita que “holocaustos”, hoje fortemente associado em português ao genocídio do século XX, seja a única forma no texto; a alternativa tradicional permanece em nota.
  terminology: “Sacrifícios”, “ofertas” e “ofertas pelo pecado” são adequados para as categorias cultuais. “Lei” não precisa ser capitalizada no texto, pois a nota pode identificar com sobriedade a lei mosaica.
