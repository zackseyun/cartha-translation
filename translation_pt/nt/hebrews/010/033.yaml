source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: pt
  text: às vezes, sendo expostos publicamente a insultos e aflições[a], e outras vezes, tornando-se companheiros dos que eram tratados dessa maneira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais vívido, “sendo feitos espetáculo público por meio de insultos e aflições”.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “dos que viviam ou se comportavam dessa maneira”; o particípio grego pode se referir ao modo de vida, embora o contexto de perseguição favoreça “eram tratados dessa maneira”.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: às vezes ... e outras vezes
  rationale: Expressa com naturalidade em português a estrutura correlativa que apresenta dois aspectos da experiência passada dos leitores.
- source_word: ὀνειδισμοῖς
  choice: insultos
  rationale: Comunica em linguagem atual a ideia de afrontas verbais e humilhação pública.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Preserva a amplitude e a gravidade das pressões e sofrimentos ligados à perseguição.
- source_word: θεατριζόμενοι
  choice: sendo expostos publicamente
  rationale: Transmite a exposição à vergonha diante do público sem tornar a metáfora teatral explícita demais; a imagem mais vívida é mantida em nota.
- source_word: κοινωνοὶ
  choice: companheiros
  rationale: Indica solidariedade e participação na situação dos perseguidos, e não apenas amizade casual.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: dos que eram tratados dessa maneira
  rationale: O contexto imediato de insultos, aflições e solidariedade favorece o sentido de pessoas submetidas ao mesmo tratamento, embora o sentido ligado à conduta seja possível.
- source_word: γενηθέντες
  choice: tornando-se
  rationale: Reproduz de modo natural a entrada dos leitores em solidariedade com os que sofriam.
theological_decisions:
- issue: Sentido de ἀναστρεφομένων no contexto
  choice: os que eram tratados dessa maneira
  alternative: os que viviam ou se comportavam dessa maneira
  rationale: O contexto de perseguição favorece uma referência ao tratamento sofrido. Como o particípio também pode dizer respeito à maneira de viver ou de se comportar, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo do grego e preserva em notas tanto a imagem teatral quanto a ambiguidade de ἀναστρεφομένων.
