  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: pt
  text: Portanto, irmãos[a], visto que temos plena confiança para entrar nos lugares santos[b] pelo sangue de Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se representativamente a toda a congregação.
    reason: lexical_alternative
  - marker: b
    text: Ou “no santuário”; no contexto das imagens do tabernáculo em Hebreus, a expressão se refere aos lugares santos da presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: visto que temos
  rationale: O particípio introduz a base para a exortação que vem a seguir. “Visto que temos” expressa essa força circunstancial/causal de modo natural em português.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão tirada da argumentação anterior e mantém clara a conexão lógica.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do vocativo grego, que pode representar toda a congregação; essa abrangência é esclarecida em nota.
- source_word: παρρησίαν
  choice: plena confiança
  rationale: No contexto, o termo indica liberdade confiante de acesso à presença de Deus. “Plena confiança” comunica essa segurança sem a possível conotação de atrevimento de “ousadia”.
- source_word: εἰς τὴν εἴσοδον
  choice: para entrar
  rationale: Converte naturalmente em construção verbal a expressão nominal grega relativa à entrada, sem alterar a ideia de acesso.
- source_word: τῶν ἁγίων
  choice: nos lugares santos
  rationale: No contexto da linguagem do tabernáculo em Hebreus, refere-se ao âmbito santo da presença de Deus. O plural mantém a forma e a amplitude do grego, sem restringi-lo indevidamente ao “Santo dos Santos”.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: pelo sangue de Jesus
  rationale: Expressa naturalmente o meio ou fundamento sacrificial pelo qual se obtém acesso, preservando a força teológica da expressão.
theological_decisions:
- issue: Alcance de τῶν ἁγίων
  choice: referência espacial e cultual aos lugares santos da presença de Deus
  alternative: o santuário; o Santo dos Santos; os santos
  rationale: A imagem contínua do tabernáculo em Hebreus favorece uma referência ao âmbito santo da presença divina. “Lugares santos” preserva a amplitude da expressão; “Santo dos Santos” seria específico demais, e “os santos” não se ajusta ao contexto imediato.
- issue: Força representativa de ἀδελφοί
  choice: manter “irmãos” no texto e esclarecer em nota que a forma pode abranger toda a congregação
  alternative: irmãos e irmãs; pessoas da mesma família espiritual
  rationale: “Irmãos” conserva a forma gramatical masculina do grego, enquanto a nota reconhece seu provável uso representativo ao dirigir-se à comunidade cristã inteira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva a estrutura lógica do versículo, emprega vocabulário religioso corrente sem arcaísmo e mantém aberta a extensão exata de “lugares santos”.
