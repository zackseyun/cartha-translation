source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: pt
  text: mas uma expectativa aterradora de juízo[a] e um furor de fogo prestes a consumir os adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais literal: “uma expectativa aterradora de juízo e um zelo de fogo prestes a consumir os adversários”.'
    reason: Alternativa lexical que expõe a construção incomum πυρὸς ζῆλος e preserva sua ambiguidade entre zelo intenso e furor ardente.
lexical_decisions:
- source_word: φοβερὰ
  choice: aterradora
  rationale: Qualifica a expectativa como algo que causa temor. “Aterradora” comunica com naturalidade a força do adjetivo grego sem ampliar o conteúdo do juízo.
- source_word: δέ
  choice: mas
  rationale: Retoma, por contraste, a negação do versículo anterior; “mas” expressa adequadamente essa força adversativa.
- source_word: τις
  choice: uma
  rationale: O pronome indefinido contribui para a expressão indefinida. Em português, “uma certa expectativa aterradora” poderia sugerir hesitação ou atenuar indevidamente a certeza da advertência; o artigo indefinido transmite a construção de modo mais natural.
- source_word: ἐκδοχὴ
  choice: expectativa
  rationale: Designa a expectativa ou espera por algo futuro. “Expectativa” mantém a relação direta com “de juízo” e se encaixa no tom solene da passagem.
- source_word: κρίσεως
  choice: de juízo
  rationale: Preserva o sentido judicial amplo de κρίσις sem restringi-lo antecipadamente a uma formulação doutrinária mais específica.
- source_word: πυρὸς ζῆλος
  choice: um furor de fogo
  rationale: A expressão grega é intensa e condensada. “Furor de fogo” preserva sua forma imagética e a força personificada de ζῆλος, sendo mais compreensível no contexto do que o literalismo “zelo de fogo”.
- source_word: ἐσθίειν
  choice: consumir
  rationale: Transmite idiomaticamente a ação destruidora do fogo, sem o tom coloquial de “comer” nem uma intensificação desnecessária.
- source_word: μέλλοντος
  choice: prestes a
  rationale: Expressa o caráter iminente da ação futura indicado pelo particípio de μέλλω.
- source_word: τοὺς ὑπεναντίους
  choice: os adversários
  rationale: Conserva o sentido daqueles que se colocam em oposição e o tom formal e judicial do contexto.
theological_decisions:
- issue: Natureza da imagem do juízo
  choice: Manter a imagem vívida do fogo que consumirá os adversários, sem definir além do versículo a duração ou a natureza completa desse juízo.
  alternative: Explicitar “castigo eterno” ou reduzir a imagem a uma metáfora genérica de destruição.
  rationale: O texto afirma um juízo divino severo por meio da imagem do fogo, mas neste versículo não formula todos os detalhes doutrinários desse juízo.
- issue: Força de πυρὸς ζῆλος
  choice: “um furor de fogo”
  alternative: “um zelo de fogo” ou “um fogo ardente”
  rationale: “Furor” preserva a intensidade e a personificação possíveis em ζῆλος; “zelo” seria mais formalmente literal, porém obscuro em português, enquanto “fogo ardente” eliminaria parte da tensão metafórica.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o caráter fragmentário e adversativo do versículo no contexto imediato, evita arcaísmos e conserva a intensidade da advertência.
