source:
  edition: SBLGNT
  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: pt
  text: Onde há perdão dessas coisas[a], já não há oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “remissão dessas coisas”; “essas coisas” se refere aos pecados e atos de desobediência mencionados no versículo anterior.
    reason: Alternativa lexical e esclarecimento do referente do demonstrativo.
lexical_decisions:
- source_word: ὅπου
  choice: Onde
  rationale: Introduz a esfera ou condição em que a conclusão se aplica; “onde” é natural e preserva a formulação concisa do grego.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Marca aqui uma transição ou inferência leve. A continuidade do argumento já fica clara em português, e acrescentar “ora” poderia dar ao texto uma marca discursiva desnecessária.
- source_word: ἄφεσις
  choice: perdão
  rationale: No contexto dos pecados e do culto sacrificial, designa perdão ou remissão. “Perdão” é a forma moderna, clara e teologicamente adequada.
- source_word: τούτων
  choice: dessas coisas
  rationale: Mantém o demonstrativo sem explicitar no corpo do texto aquilo a que ele se refere, preservando a ligação contextual e a leve ambiguidade formal do grego.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa cessação com naturalidade e precisão em português.
- source_word: προσφορὰ
  choice: oferta
  rationale: Preserva o termo sacrificial geral sem estreitá-lo indevidamente para “sacrifício”.
- source_word: περὶ ἁμαρτίας
  choice: pelo pecado
  rationale: É uma formulação idiomática no contexto sacrificial e preserva a construção singular sem impor a interpretação mais específica “oferta pelo pecado” como categoria técnica.
theological_decisions:
- issue: Implicação da finalidade do sacrifício de Cristo
  choice: Uma vez havendo perdão, já não há oferta pelo pecado.
  alternative: O versículo elimina toda e qualquer forma de oferta; ou se limita apenas às ofertas levíticas repetidas em sentido cerimonial estrito.
  rationale: O contexto contrasta sacrifícios repetidos com a eficácia definitiva do sacrifício de Cristo. A tradução afirma a cessação da oferta pelo pecado sem ampliar nem restringir silenciosamente a declaração.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem é concisa e acompanha de perto a lógica do original; evita-se o marcador inicial “ora”, pois não há no grego uma palavra temporal equivalente a “agora”.
