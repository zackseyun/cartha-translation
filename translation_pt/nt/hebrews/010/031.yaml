  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: pt
  text: É terrível cair nas mãos do Deus vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É assustador cair nas mãos do Deus vivo.”'
    reason: Alternativa lexical para φοβερὸν, destacando mais diretamente aquilo que provoca medo.
lexical_decisions:
- source_word: φοβερὸν
  choice: terrível
  rationale: O adjetivo predicativo expressa aquilo que causa medo, pavor ou terror. Em português, “é terrível” comunica de modo natural e solene a força da advertência.
- source_word: τὸ ἐμπεσεῖν
  choice: cair
  rationale: O infinitivo aoristo substantivado é vertido idiomaticamente por “cair”; a preposição e o complemento seguintes completam a ideia de entrar repentinamente sob o poder de alguém.
- source_word: εἰς χεῖρας
  choice: nas mãos
  rationale: A expressão indica ficar sob o poder ou juízo de alguém. Manter a imagem das “mãos” preserva a linguagem bíblica e sua ressonância intertextual; em português, “cair nas mãos” é a construção idiomática natural.
- source_word: θεοῦ
  choice: Deus
  rationale: Tradução direta do genitivo dependente de “mãos”, sem acrescentar qualificações ausentes do texto.
- source_word: ζῶντος
  choice: vivo
  rationale: O particípio presente qualifica Deus na expressão bíblica convencional “o Deus vivo”, ressaltando sua realidade e atuação sem explicitar além do grego.
theological_decisions:
- issue: Força da declaração de advertência
  choice: Declaração geral e solene sobre o terror de cair sob o poder judicial do Deus vivo
  alternative: Referência restrita apenas à disciplina temporal, ou declaração existencial sem conotação de juízo
  rationale: O contexto conclui uma passagem de advertência, e a expressão “cair nas mãos” possui força judicial. A tradução conserva essa gravidade sem inserir no texto a palavra interpretativa “juízo”, que não aparece explicitamente no grego.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação mantém a concisão enfática do grego e a imagem bíblica tradicional, sem arcaísmo nem expansão doutrinária.
