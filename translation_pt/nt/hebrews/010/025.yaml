id: HEB.10.25
reference: Hebrews 10:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: pt
  text: não deixemos de nos reunir[a], como alguns costumam fazer, mas encorajemos uns aos outros — e tanto mais quanto vocês veem que o Dia se aproxima.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não abandonemos nossa reunião”.
    reason: lexical_alternative
  - marker: b
    text: “O Dia” provavelmente se refere ao futuro Dia do Senhor ou ao juízo final.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: não deixemos de
  rationale: O particípio com μή dá continuidade à exortação do contexto. A formulação é natural em português e abrange tanto a negligência quanto o abandono, sem pressupor necessariamente apostasia total.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: nos reunir
  rationale: Expressa de modo claro e atual a reunião da própria comunidade, sem importar a ideia institucional posterior de um culto formal.
- source_word: καθὼς ἔθος τισίν
  choice: como alguns costumam fazer
  rationale: Preserva a ideia de hábito ou costume e mantém o tom de repreensão branda, porém direto.
- source_word: παρακαλοῦντες
  choice: encorajemos uns aos outros
  rationale: No contexto de perseverança comunitária, o verbo indica fortalecimento e exortação mútuos. O objeto recíproco está implícito no grego e é explicitado para produzir português natural.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: e tanto mais quanto
  rationale: Reproduz de forma idiomática a construção correlativa, intensificando a exortação à medida que o Dia se aproxima.
- source_word: βλέπετε
  choice: vocês veem
  rationale: Mantém o presente indicativo e deixa em aberto de que modo os destinatários reconhecem a proximidade do Dia.
- source_word: ἐγγίζουσαν
  choice: se aproxima
  rationale: Comunica com clareza o movimento temporal de aproximação expresso pelo particípio.
- source_word: τὴν ἡμέραν
  choice: o Dia
  rationale: A inicial maiúscula sinaliza a provável referência escatológica reconhecida pelos leitores, sem acrescentar ao texto grego 'do Senhor' ou 'do juízo'.
theological_decisions:
- issue: Referência escatológica de τὴν ἡμέραν
  choice: o Dia
  alternative: o dia; o Dia do Senhor; o dia do juízo
  rationale: O contexto favorece o dia escatológico, mas o grego não o especifica além de 'o Dia'. A maiúscula comunica a referência provável sem resolver além do texto se se trata especificamente da vinda do Senhor, do juízo final ou da consumação.
- issue: Objeto mútuo de παρακαλοῦντες
  choice: encorajemos uns aos outros
  alternative: mas encorajemos
  rationale: Embora o objeto não esteja expresso, a reciprocidade é fortemente indicada pelo contexto comunitário. Sua explicitação torna a frase natural em português sem introduzir conteúdo doutrinário novo.
- issue: Força exortativa dos particípios
  choice: não deixemos... mas encorajemos
  alternative: não deixando... mas encorajando
  rationale: Os particípios dependem da exortação do versículo anterior. A forma hortativa em português preserva essa função e produz uma frase autônoma compreensível quando o versículo é citado isoladamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e evita termos institucionais como “culto” ou “serviço religioso”. A redação hortativa explicita a continuidade da exortação iniciada no versículo anterior.
