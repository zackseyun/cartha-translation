  terminology: “Nos reunir” comunica satisfatoriamente ἐπισυναγωγὴν ἑαυτῶν sem introduzir linguagem institucional. “Encorajemos” é uma escolha contextual adequada para παρακαλοῦντες; “Dia”, com maiúscula, mantém a provável força escatológica sem especificação indevida.
