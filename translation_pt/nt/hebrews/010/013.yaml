translation:
  language: pt
  text: daí em diante, esperando até que os seus inimigos sejam postos como estrado para os seus pés[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aguardando com expectativa”. O particípio grego pode expressar uma espera marcada por expectativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Esta linguagem retoma o Salmo 110:1: “Senta-te à minha direita, até que eu ponha os teus inimigos como estrado para os teus pés”.'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: daí em diante
  rationale: A expressão neutra articulada tem função adverbial e indica o período posterior à oferta concluída e ao ato de sentar-se mencionado no contexto anterior.
- source_word: ἐκδεχόμενος
  choice: esperando
  rationale: O particípio expressa a espera contínua de Cristo, podendo incluir expectativa confiante; “esperando” é natural e mantém a amplitude do grego.
- source_word: ἕως
  choice: até que
  rationale: Introduz naturalmente, em português, o limite temporal da espera.
- source_word: τεθῶσιν
  choice: sejam postos
  rationale: Preserva a voz passiva do aoristo subjuntivo de τίθημι e deixa em aberto o agente, como no grego.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: os seus inimigos
  rationale: Reproduz de modo claro e idiomático a construção possessiva grega.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: como estrado para os seus pés
  rationale: Mantém a imagem concreta e a ressonância do Salmo 110:1; “estrado” é corrente e digno em português.
theological_decisions:
- issue: Imagem da entronização messiânica do Salmo 110:1
  choice: Manter os inimigos sendo postos “como estrado para os seus pés”.
  alternative: Parafrasear como “até que os seus inimigos sejam derrotados” ou “submetidos”.
  rationale: A formulação concreta preserva a alusão deliberada ao Salmo 110:1 e sua força cristológica em Hebreus, sem reduzir a imagem a uma interpretação explicativa.
- issue: Agente da submissão dos inimigos
  choice: Preservar a construção passiva “sejam postos”.
  alternative: Explicitar “até que Deus ponha os seus inimigos”.
  rationale: Embora o contexto e o Salmo indiquem a ação divina, o texto grego deste versículo emprega a voz passiva e não nomeia diretamente o agente.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem dos marcadores acompanha sua primeira função no texto: primeiro a alternativa lexical ligada a “esperando”, depois a alusão ao Salmo 110:1.'
