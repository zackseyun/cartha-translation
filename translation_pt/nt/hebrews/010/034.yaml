source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: pt
  text: Pois vocês também compartilharam o sofrimento dos presos[a] e aceitaram com alegria o saque dos seus bens, sabendo que vocês mesmos têm uma possessão melhor e permanente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tiveram compaixão dos presos”. O verbo grego pode indicar compaixão, mas aqui provavelmente inclui solidariedade concreta com o sofrimento deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Alguns manuscritos trazem: “sabendo que vocês têm em si mesmos uma possessão melhor e permanente nos céus”.'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: os presos
  rationale: O substantivo designa pessoas mantidas em prisão ou em correntes. “Os presos” é direto, natural e adequado ao contexto de perseguição.
- source_word: συνεπαθήσατε
  choice: compartilharam o sofrimento
  rationale: O verbo pode indicar compaixão ou solidariedade no sofrimento. A formulação escolhida preserva a ideia de participação solidária, sem reduzi-la a um mero sentimento interior.
- source_word: ἁρπαγήν
  choice: saque
  rationale: O termo indica tomada violenta ou injusta. “Saque” conserva essa força melhor do que “confisco”, que poderia sugerir apenas um procedimento oficial.
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: dos seus bens
  rationale: A expressão substantivada refere-se às coisas que lhes pertenciam. “Bens” é corrente em português e mantém o contraste com o bem superior mencionado no fim do versículo.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Reproduz de modo claro e natural a estrutura e a ênfase da expressão grega.
- source_word: προσεδέξασθε
  choice: aceitaram
  rationale: No contexto, o verbo descreve a disposição com que suportaram a perda, sem sugerir que aprovavam a injustiça cometida.
- source_word: γινώσκοντες
  choice: sabendo
  rationale: 'Mantém a forma participial e permite perceber naturalmente sua nuance causal: aceitaram a perda porque sabiam que possuíam algo melhor.'
- source_word: ἑαυτοὺς ἔχειν
  choice: vocês mesmos têm
  rationale: “Vocês mesmos” preserva a ênfase do pronome reflexivo; o presente “têm” reflete o infinitivo presente e ressalta a posse vigente.
- source_word: κρείττονα
  choice: melhor
  rationale: “Melhor” conserva o tema comparativo recorrente em Hebreus e evita a rigidez de “superior”.
- source_word: ὕπαρξιν
  choice: um bem
  rationale: O substantivo pode significar propriedade ou posse. “Um bem” é natural em português, admite o sentido coletivo ou abstrato e cria um contraste lexical inteligível com “seus bens”.
- source_word: μένουσαν
  choice: permanente
  rationale: O particípio caracteriza esse bem como algo que permanece. “Permanente” comunica com clareza sua duração contínua.
theological_decisions:
- issue: Sentido da solidariedade com os cristãos presos
  choice: A tradução indica participação solidária no sofrimento dos presos.
  alternative: “Tiveram compaixão dos presos” ou “simpatizaram com os presos”.
  rationale: συμπαθέω pode expressar compaixão, mas, neste contexto de perseguição e associado ao objeto no dativo, sugere solidariedade concreta e custosa. A tradução não limita o verbo a uma emoção interior.
- issue: Natureza do “bem melhor e permanente”
  choice: A tradução mantém a referência geral a um bem superior e duradouro.
  alternative: “Uma herança melhor”, “um bem melhor no céu” ou uma identificação explícita com salvação ou recompensa.
  rationale: O texto adotado não especifica “no céu” nem identifica diretamente esse bem. Assim, a tradução preserva a abertura da expressão e não introduz uma definição teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Compartilharam o sofrimento” explicita naturalmente a força solidária do verbo grego; “saque” preserva a violência da perda; e “um bem melhor e permanente” mantém a formulação aberta e o contraste com os bens materiais.
