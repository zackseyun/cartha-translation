source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: pt
  text: Mas o meu justo[b] viverá pela fé[a]; e, se ele recuar[c], a minha alma não encontra prazer nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela fidelidade” ou “pela confiança”. A palavra grega pístis pode ter esses sentidos; o texto principal usa “fé”.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem apenas “o justo”, sem “meu”.
    reason: textual_variant
  - marker: c
    text: “Ele” e “nele” refletem o masculino singular do grego, usado aqui de modo representativo, sem necessariamente se limitar aos homens.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Mas o meu justo
  rationale: O adjetivo substantivado designa uma pessoa caracterizada pela justiça. “O meu justo” preserva de modo conciso o pronome μου do texto SBLGNT e a forma pessoal da expressão, sem acrescentar uma explicação interpretativa.
- source_word: ἐκ πίστεως
  choice: pela fé
  rationale: A preposição ἐκ indica aqui a base ou o princípio pelo qual se vive. “Pela fé” é natural em português e mantém a tradução principal tradicional de πίστις; os sentidos possíveis de fidelidade e confiança são registrados em nota.
- source_word: ζήσεται
  choice: viverá
  rationale: Traduz diretamente o futuro de ζάω, conservando a afirmação prospectiva.
- source_word: ὑποστείληται
  choice: recuar
  rationale: No contexto de advertência, o verbo comunica retirar-se ou voltar atrás diante da pressão. “Recuar” é claro, atual e não acrescenta uma motivação psicológica ausente do grego.
- source_word: οὐκ εὐδοκεῖ
  choice: não terá prazer
  rationale: Expressa a ideia de não se agradar ou não ter prazer. O futuro em português harmoniza naturalmente a formulação da citação, embora o grego use formalmente o presente; não altera a relação condicional nem a força da advertência.
- source_word: ἡ ψυχή μου
  choice: a minha alma
  rationale: Mantém a expressão explícita da fonte bíblica citada, em vez de reduzi-la simplesmente a “eu”.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Representa diretamente ἐν com o pronome dativo no complemento de εὐδοκέω e preserva a referência singular.
theological_decisions:
- issue: Sentido de πίστις em ἐκ πίστεως
  choice: fé
  alternative: fidelidade; confiança
  rationale: O termo admite esses sentidos no contexto da citação de Habacuque. O texto principal usa “fé”, mas a nota preserva a ambiguidade lexical sem decidir uma controvérsia teológica.
- issue: Referente de ὑποστείληται e αὐτῷ
  choice: A mesma pessoa singular apresentada como “o meu justo”
  alternative: Uma pessoa indefinida diferente de “o meu justo”
  rationale: A sequência grega permanece no singular e não assinala explicitamente uma mudança de referente. A tradução conserva essa tensão e não enfraquece a advertência por razões doutrinárias.
- issue: Masculino singular representativo
  choice: Manter “ele” e “nele”
  alternative: Empregar plural neutro ou reformular como “a pessoa”
  rationale: As formas gregas são masculinas singulares. A tradução mantém a estrutura gramatical, enquanto a nota esclarece que seu alcance não se limita necessariamente aos homens.
- issue: Variante textual em μου
  choice: meu justo
  alternative: o justo
  rationale: Segue-se o texto apresentado do SBLGNT, que inclui μου, registrando em nota a leitura sem o pronome encontrada em alguns manuscritos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o tom solene da citação bíblica sem recorrer a arcaísmos. “O meu justo” é deliberadamente conciso para preservar o adjetivo substantivado grego; “recuar” comunica a advertência de maneira natural.
