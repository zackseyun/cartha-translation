source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: pt
  text: Aproximemo-nos com coração verdadeiro[a], em plena certeza da fé, com o coração aspergido[d], purificado de uma consciência má[b], e o corpo lavado com água pura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com coração sincero”.
    reason: lexical_alternative
  - marker: b
    text: Ou “de uma consciência culpada”.
    reason: lexical_alternative
  - marker: c
    text: A imagem pode evocar a linguagem de purificação ritual e também pode ser entendida por alguns leitores como uma alusão ao batismo, mas o versículo não identifica explicitamente essa lavagem.
    reason: cultural_note
  - marker: d
    text: Ou, mais literalmente, “com o coração aspergido de uma consciência má”.
    reason: translation_clarity
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Aproximemo-nos
  rationale: O presente do subjuntivo com valor exortativo pede uma exortação inclusiva. “Aproximemo-nos” é natural em português e preserva o contexto de acesso a Deus em Hebreus.
- source_word: ἀληθινῆς καρδίας
  choice: com coração verdadeiro
  rationale: Mantém a forma compacta e a amplitude de ἀληθινός, que pode indicar o que é verdadeiro, genuíno ou sincero, sem reduzi-lo apenas à sinceridade subjetiva.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: em plena certeza da fé
  rationale: πληροφορία expressa plenitude de convicção ou certeza. A construção mantém a preposição e traduz πίστις pelo termo usual “fé”.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: com o coração purificado por aspersão
  rationale: A formulação conserva explicitamente a imagem cultual da aspersão e comunica em português o efeito purificador indicado pelo contexto e pela construção com ἀπό. O singular distributivo “o coração” concorda naturalmente com a exortação coletiva.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: de uma consciência má
  rationale: “Má” traduz formalmente πονηρά e preserva uma abrangência moral e ritual maior que a interpretação mais estreita “culpada”.
- source_word: λελουσμένοι τὸ σῶμα
  choice: e o corpo lavado
  rationale: O particípio perfeito descreve um estado resultante e é paralelo a ῥεραντισμένοι. O singular distributivo do grego é natural também em português.
- source_word: ὕδατι καθαρῷ
  choice: com água pura
  rationale: “Água pura” é idiomático, preserva a noção de pureza e se ajusta ao contexto de purificação.
theological_decisions:
- issue: Se a lavagem deve ser identificada explicitamente como batismo cristão
  choice: Manter a imagem de purificação sem identificar explicitamente a lavagem como batismo
  alternative: Traduzir com referência direta ao batismo ou tratar a lavagem apenas como metáfora interior
  rationale: A linguagem pode evocar purificações rituais e também pode ser ouvida como alusão ao batismo, mas o versículo não identifica expressamente a lavagem. A tradução preserva essa abertura.
- issue: Se συνειδήσεως πονηρᾶς deve ser interpretado como “consciência culpada”
  choice: consciência má
  alternative: consciência culpada
  rationale: O adjetivo grego significa “má” ou “perversa” e não especifica apenas o sentimento ou estado de culpa; a tradução formal evita estreitar o sentido.
- issue: Como expressar a aspersão e seu efeito purificador
  choice: purificado por aspersão de uma consciência má
  alternative: aspergido de uma consciência má
  rationale: A alternativa estritamente linear seria pouco natural e poderia sugerir, por engano, que a consciência má é o elemento aspergido. A escolha conserva a imagem da aspersão e deixa claro o afastamento purificador indicado por ἀπό.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas usuais no Brasil. A sintaxe mantém o paralelismo entre coração e corpo e conserva as imagens cultuais sem explicação denominacional no texto principal.
