  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: pt
  text: e um grande sacerdote[a] sobre a casa de Deus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um sumo sacerdote». Hebreus apresenta Jesus muitas vezes como sumo sacerdote, mas este versículo diz literalmente «um grande sacerdote».
    reason: alternative_reading
  - marker: b
    text: «Casa de Deus» também pode ter o sentido de família de Deus, isto é, seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa que liga esta expressão à construção iniciada nos versículos anteriores.
- source_word: ἱερέα
  choice: sacerdote
  rationale: Traduz diretamente ἱερεύς sem importar o título técnico ἀρχιερεύς, que não aparece neste versículo.
- source_word: μέγαν
  choice: grande
  rationale: Preserva a qualificação de grandeza ou eminência expressa por μέγας, sem fundi-la silenciosamente no título «sumo sacerdote».
- source_word: ἐπὶ
  choice: sobre
  rationale: Com o acusativo, expressa aqui autoridade ou supervisão; «sobre» conserva isso de modo conciso e natural.
- source_word: τὸν οἶκον
  choice: a casa
  rationale: Mantém a metáfora bíblica e deixa aberta a possível referência tanto à casa quanto à comunidade ou família de Deus.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Construção genitiva direta que identifica a casa como pertencente a Deus.
theological_decisions:
- issue: Se ἱερέα μέγαν deve ser traduzido pelo título técnico «sumo sacerdote»
  choice: grande sacerdote
  alternative: sumo sacerdote
  rationale: Embora Hebreus apresente Jesus repetidamente como sumo sacerdote, o grego deste versículo emprega ἱερεύς + μέγας, não o termo técnico ἀρχιερεύς. A tradução preserva essa formulação e registra a alternativa em nota.
- issue: Sentido de «casa de Deus»
  choice: casa de Deus
  alternative: família de Deus / povo de Deus
  rationale: οἶκος pode designar uma casa ou os que a compõem. Manter «casa» conserva a metáfora e sua ressonância em Hebreus 3:2–6, enquanto a nota esclarece o possível sentido comunitário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura fragmentária do versículo, que continua a frase iniciada anteriormente. Os marcadores seguem imediatamente as expressões a que se referem.
