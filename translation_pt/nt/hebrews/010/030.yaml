  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: pt
  text: 'Pois conhecemos aquele que disse: “A vingança é minha; eu retribuirei”[a]. E também: “O Senhor julgará o seu povo”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A citação remete a Deuteronômio 32:35.
    reason: cross_reference
  - marker: b
    text: A citação remete a Deuteronômio 32:36. No contexto original, “julgar” pode abranger tanto castigo como defesa ou vindicação; aqui, o contexto de advertência enfatiza o juízo divino.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: conhecemos
  rationale: O perfeito οἶδα tem sentido presente no grego koiné; “conhecemos” é natural e mantém a referência pessoal a Deus.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o versículo anterior.
- source_word: τὸν εἰπόντα
  choice: aquele que disse
  rationale: Traduz naturalmente o particípio aoristo substantivado e conserva a referência pessoal ao autor das palavras citadas.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: A vingança é minha
  rationale: Reproduz de modo direto e solene a construção elíptica grega, literalmente “a mim, vingança”, sem enfraquecer seu sentido retributivo.
- source_word: ἀνταποδώσω
  choice: eu retribuirei
  rationale: Expressa a ação futura de dar a devida paga, com registro digno e sem precisar explicitar o objeto ausente no grego.
- source_word: καὶ πάλιν
  choice: E também
  rationale: Introduz naturalmente uma segunda citação em português; evita a possível impressão temporal de “novamente”.
- source_word: Κρινεῖ
  choice: julgará
  rationale: Mantém a amplitude judicial de κρίνω; no contexto de advertência de Hebreus, inclui especialmente juízo punitivo, sem eliminar a possibilidade de vindicação presente no pano de fundo de Deuteronômio.
- source_word: κύριος
  choice: O Senhor
  rationale: Equivalente português tradicional e claro de κύριος nesta referência a Deus.
- source_word: τὸν λαὸν αὐτοῦ
  choice: o seu povo
  rationale: Tradução natural que conserva a relação de pertencimento e as ressonâncias da aliança.
theological_decisions:
- issue: Alcance de κρίνω na citação de Deuteronômio
  choice: “O Senhor julgará o seu povo”
  alternative: “O Senhor defenderá/fará justiça ao seu povo”
  rationale: “Julgará” preserva a ambiguidade judicial do verbo e corresponde ao contexto severo de Hebreus 10. A nota reconhece que, no contexto original, o juízo também pode abranger vindicação, evitando resolver silenciosamente a tensão.
- issue: Força retributiva de ἐκδίκησις e ἀνταποδώσω
  choice: “A vingança é minha; eu retribuirei”
  alternative: “Cabe a mim fazer justiça; eu darei a paga”
  rationale: A formulação escolhida conserva explicitamente a prerrogativa divina de retribuição e a solenidade da citação, sem importar uma teoria denominacional específica do juízo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Pois” mantém a conexão argumentativa; “E também” introduz a segunda citação de forma idiomática. Os marcadores aparecem imediatamente após as respectivas citações.
