  source_fidelity: 'A tradução representa com precisão a estrutura e o sentido do grego: «Pois» preserva o valor explicativo de γάρ; «conhecemos» expressa adequadamente o perfeito presente οἴδαμεν; «aquele que disse» mantém a referência pessoal do particípio substantivado; e as duas citações são traduzidas sem acréscimos interpretativos. «A vingança é minha; eu retribuirei» reproduz de forma clara a elipse solene de Ἐμοὶ ἐκδίκησις e o futuro ἀνταποδώσω. «O Senhor julgará o seu povo» conserva o alcance judicial de Κρινεῖ sem reduzir indevidamente o verbo a punição ou vindicação.'
  naturalness: O português é moderno, claro e de registro apropriadamente solene. «Pois conhecemos aquele que disse» e «E também» são naturais e legíveis em uso brasileiro e internacional. A divisão em duas frases não altera a relação entre as citações e mantém boa fluência.
  terminology: «Senhor», «vingança», «retribuirei», «julgará» e «o seu povo» são escolhas consistentes, inteligíveis e adequadas ao registro bíblico. A formulação não impõe uma leitura denominacional do juízo.
