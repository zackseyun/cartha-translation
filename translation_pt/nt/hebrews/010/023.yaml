id: HEB.10.23
reference: Hebrews 10:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: pt
  text: Mantenhamos firme, sem vacilar, a confissão da nossa esperança,[a] pois aquele que prometeu é fiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a confissão da esperança”. O grego não traz explicitamente “nossa”.'
    reason: alternativa lexical e explicitação de elemento implícito
lexical_decisions:
- source_word: κατέχωμεν
  choice: Mantenhamos firme
  rationale: O presente do subjuntivo na primeira pessoa do plural tem força exortativa. A formulação comunica a ideia de conservar com firmeza de modo natural em português.
- source_word: ὁμολογίαν
  choice: a confissão
  rationale: Neste contexto, refere-se à declaração pública da fé e esperança professadas; “confissão” preserva esse sentido e a linguagem característica da tradição bíblica.
- source_word: τῆς ἐλπίδος
  choice: da nossa esperança
  rationale: Embora o grego não traga pronome possessivo explícito, o contexto comunitário de “mantenhamos” permite explicitar “nossa” com naturalidade. A forma mais literal é registrada em nota.
- source_word: ἀκλινῆ
  choice: sem vacilar
  rationale: O adjetivo significa algo que não se inclina nem se desvia. A locução adverbial portuguesa expressa com clareza a constância requerida e se liga naturalmente à exortação.
- source_word: πιστὸς
  choice: fiel
  rationale: “Fiel” preserva tanto a ideia de confiabilidade quanto a ressonância teológica da fidelidade de Deus às suas promessas.
- source_word: ὁ ἐπαγγειλάμενος
  choice: aquele que prometeu
  rationale: Reproduz de modo natural o particípio substantivado e mantém implícita, como no grego, a identificação do referente como Deus.
theological_decisions:
- issue: Referente de “aquele que prometeu”
  choice: Mantido implícito, como no grego
  alternative: “Deus, que prometeu”
  rationale: O contexto identifica claramente Deus como aquele que fez a promessa, mas explicitá-lo no corpo do versículo acrescentaria algo que a forma grega deixa subentendido.
- issue: Pronome possessivo com “esperança”
  choice: “da nossa esperança”
  alternative: “da esperança”
  rationale: O possessivo torna natural em português a relação entre a comunidade exortada e a esperança que ela confessa, sem resolver qualquer tensão doutrinária. A ausência explícita do pronome no grego é preservada em nota.
- issue: Relação sintática de ἀκλινῆ
  choice: “sem vacilar”, associado à manutenção da confissão
  alternative: “a confissão inabalável da esperança”
  rationale: O grego descreve a confissão como não inclinada ou inabalável, mas em português a formulação escolhida comunica idiomaticamente que os destinatários devem conservá-la sem oscilação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Mantenhamos” preserva a exortação comunitária; “sem vacilar” evita rigidez excessivamente literal. O referente divino permanece implícito como no texto-fonte.
