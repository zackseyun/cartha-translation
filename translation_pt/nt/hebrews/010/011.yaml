id: HEB.10.11
reference: Hebrews 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: pt
  text: E todo sacerdote permanece em pé, dia após dia, exercendo o serviço sagrado e oferecendo repetidas vezes os mesmos sacrifícios, que nunca podem tirar pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “remover pecados”.'
    reason: Alternativa lexical para περιελεῖν ἁμαρτίας.
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: todo sacerdote
  rationale: 'A construção com πᾶς e substantivo singular tem sentido distributivo: cada sacerdote da ordem levítica. “Todo sacerdote” é natural em português e não introduz a ideia de sumo sacerdote, ausente do termo ἱερεύς.'
- source_word: ἕστηκεν
  choice: permanece em pé
  rationale: O perfeito de ἵστημι descreve o estado contínuo de estar em pé. A formulação preserva a postura e o contraste literário com o Messias sentado no versículo seguinte.
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: Expressa ação diária e reiterada, realçando a continuidade do serviço sacerdotal.
- source_word: λειτουργῶν
  choice: exercendo o serviço sagrado
  rationale: O particípio designa serviço litúrgico ou sacerdotal. A expressão torna claro esse sentido cultual sem recorrer ao ambíguo “ministrando”.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: os mesmos sacrifícios
  rationale: Mantém a ênfase em sacrifícios da mesma espécie continuamente repetidos.
- source_word: πολλάκις
  choice: repetidas vezes
  rationale: Comunica com naturalidade a recorrência enfática indicada pelo advérbio.
- source_word: προσφέρων
  choice: oferecendo
  rationale: Em contexto sacrificial, προσφέρω significa oferecer ou apresentar uma oferta; “oferecendo” é a expressão portuguesa padrão.
- source_word: αἵτινες
  choice: que
  rationale: Retoma “os mesmos sacrifícios” e introduz uma explicação acerca da natureza e incapacidade deles, sem tornar a frase artificialmente pesada.
- source_word: οὐδέποτε δύνανται
  choice: nunca podem
  rationale: Preserva de maneira direta e enfática a incapacidade absoluta expressa no grego.
- source_word: περιελεῖν ἁμαρτίας
  choice: tirar pecados
  rationale: περιαιρέω significa retirar ou remover. “Tirar pecados” é claro, idiomático e preserva a imagem de eliminação sem acrescentar uma explicação teológica.
theological_decisions:
- issue: Relação entre a postura sacerdotal e o argumento de Hebreus 10
  choice: “Permanece em pé” preserva a postura contínua dos sacerdotes levíticos e seu contraste com o Messias sentado no versículo seguinte.
  alternative: Traduzir apenas como “está em pé”, com menor destaque para o estado contínuo.
  rationale: O contraste faz parte da construção literária imediata. A tradução o conserva sem inserir uma interpretação além do texto.
- issue: Alcance da ineficácia dos sacrifícios
  choice: Os sacrifícios “nunca podem tirar pecados”.
  alternative: Atenuar a afirmação como “não podem lidar plenamente com os pecados”.
  rationale: A combinação οὐδέποτε δύνανται expressa incapacidade absoluta no argumento do autor; a tradução não deve enfraquecer essa afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dia após dia” e “repetidas vezes” preservam a ênfase retórica na repetição; “serviço sagrado” explicita de modo natural o valor cultual de λειτουργῶν.
