id: HEB.10.14
reference: Hebrews 10:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: pt
  text: Pois, com uma só oferta, ele aperfeiçoou para sempre os que estão sendo santificados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que estão sendo tornados santos”.'
    reason: Alternativa lexical que explicita em linguagem comum o sentido passivo de ἁγιαζομένους.
lexical_decisions:
- source_word: μιᾷ
  choice: uma só
  rationale: O dativo feminino singular modifica προσφορᾷ. “Uma só” expressa com naturalidade a singularidade enfática da oferta no contexto.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta o argumento anterior e preserva de modo natural a função discursiva da conjunção.
- source_word: προσφορᾷ
  choice: oferta
  rationale: Mantém o sentido amplo de algo apresentado a Deus, sem substituir o termo pela interpretação mais específica “sacrifício”, embora o contexto seja sacrificial.
- source_word: τετελείωκεν
  choice: aperfeiçoou
  rationale: O perfeito do indicativo apresenta uma ação concluída com resultado duradouro. “Aperfeiçoou” preserva a linguagem característica e o contraste argumentativo de Hebreus.
- source_word: εἰς τὸ διηνεκές
  choice: para sempre
  rationale: A expressão indica validade ou efeito permanente. “Para sempre” é corrente, claro e adequado ao valor duradouro da única oferta.
- source_word: τοὺς ἁγιαζομένους
  choice: os que estão sendo santificados
  rationale: O particípio presente passivo preserva a dimensão em curso, enquanto “santificados” mantém a terminologia teológica do verbo grego. A nota oferece uma formulação mais transparente.
theological_decisions:
- issue: Relação entre o aperfeiçoamento concluído e a santificação em curso
  choice: Manter lado a lado “aperfeiçoou” e “estão sendo santificados”.
  alternative: Resolver a tensão em favor de um estado exclusivamente concluído (“os santificados”) ou de um processo que enfraqueça o resultado já alcançado.
  rationale: O grego combina deliberadamente o perfeito τετελείωκεν, que aponta para uma realização com efeito permanente, e o particípio presente passivo ἁγιαζομένους. A tradução conserva ambas as dimensões sem impor uma harmonização doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Uma só oferta” soa mais natural e enfático do que “uma oferta”; “para sempre” comunica o efeito permanente sem rigidez técnica. A terminologia “aperfeiçoou” e “santificados” preserva os vínculos conceituais de Hebreus.
