id: HEB.10.26
reference: Hebrews 10:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: pt
  text: Pois, se continuarmos pecando deliberadamente depois de receber o conhecimento da verdade[a], já não resta sacrifício pelos pecados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o pleno conhecimento da verdade». A palavra grega pode indicar um conhecimento mais completo ou decisivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: deliberadamente
  rationale: Expressa com clareza moderna a intencionalidade do ato, sem o tom jurídico ou potencialmente arcaico de «voluntariamente».
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: se continuarmos pecando
  rationale: A construção com particípio presente e genitivo absoluto indica ação continuada; a forma condicional torna a expressão natural em português.
- source_word: μετὰ τὸ λαβεῖν
  choice: depois de receber
  rationale: Preserva a sequência temporal e a anterioridade da recepção em relação ao pecado persistente.
- source_word: ἐπίγνωσιν
  choice: conhecimento
  rationale: É a tradução natural e lexicalmente segura; a possível nuance de conhecimento pleno ou decisivo fica registrada em nota.
- source_word: τῆς ἀληθείας
  choice: da verdade
  rationale: Reproduz naturalmente o sintagma genitivo, sem explicitar além do texto que se trate da verdade do evangelho.
- source_word: οὐκέτι
  choice: já não
  rationale: Indica de modo idiomático que, a partir dessa situação, não resta mais sacrifício.
- source_word: περὶ ἁμαρτιῶν
  choice: pelos pecados
  rationale: No contexto sacrificial, περί com genitivo denota aquilo em favor de que o sacrifício é oferecido.
- source_word: ἀπολείπεται
  choice: resta
  rationale: Transmite de forma concisa e natural a ideia de algo que permanece disponível.
- source_word: θυσία
  choice: sacrifício
  rationale: É o termo adequado ao argumento cultual de Hebreus e à obra sacrificial de Cristo, sem acrescentar uma identificação ausente nesta oração.
theological_decisions:
- issue: Aspecto e força pastoral/teológica de ἁμαρτανόντων
  choice: «se continuarmos pecando deliberadamente», como ação persistente
  alternative: «se pecarmos deliberadamente», que pode sugerir um único ato
  rationale: O particípio presente favorece a noção de conduta continuada. A tradução mantém a gravidade da advertência sem apresentá-la como referência inequívoca a qualquer pecado deliberado isolado cometido depois da conversão.
- issue: Força de ἐπίγνωσις no contexto da advertência
  choice: «conhecimento da verdade», sem definir a condição espiritual dos que o receberam
  alternative: «pleno conhecimento da verdade» ou «conhecimento salvífico da verdade»
  rationale: O texto afirma que houve recepção desse conhecimento, mas não define aqui sua profundidade experiencial nem resolve debates sobre regeneração, apostasia ou perseverança. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Pois» preserva a conexão argumentativa; «continuarmos pecando» comunica o valor durativo; «já não resta sacrifício» conserva a formulação solene e a tensão teológica do original.
