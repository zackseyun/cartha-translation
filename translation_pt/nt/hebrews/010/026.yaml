  source_fidelity: 'O texto reproduz com precisão a estrutura e o sentido do grego: «Pois» preserva o valor explicativo de γάρ; «se continuarmos pecando deliberadamente» comunica de modo natural o particípio presente ἁμαρτανόντων e a intencionalidade de ἑκουσίως; «depois de receber» conserva a anterioridade de μετὰ τὸ λαβεῖν; e «já não resta sacrifício pelos pecados» corresponde adequadamente a οὐκέτι ... ἀπολείπεται θυσία περὶ ἁμαρτιῶν. A formulação não transforma a advertência em referência explícita a um ato isolado nem resolve questões doutrinárias não decididas pelo versículo.'
