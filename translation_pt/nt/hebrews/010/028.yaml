id: HEB.10.28
reference: Hebrews 10:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: pt
  text: Quem rejeita a Lei de Moisés morre sem misericórdia com base no depoimento de duas ou três testemunhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é morto”. O grego diz literalmente “morre”, mas o contexto trata da execução judicial prevista na Lei de Moisés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: rejeita
  rationale: O particípio aoristo expressa o ato de rejeitar ou desconsiderar algo dotado de autoridade. Em português, “rejeita” comunica de modo natural a repudiação da autoridade da Lei sem limitar o sentido a uma infração específica.
- source_word: τις
  choice: Quem
  rationale: O pronome indefinido tem valor genérico. A construção “Quem rejeita” é corrente em português e preserva esse alcance representativo.
- source_word: νόμον Μωϋσέως
  choice: a Lei de Moisés
  rationale: Reproduz claramente a construção genitiva grega e corresponde à designação bíblica usual, sem recorrer ao termo mais técnico “Lei mosaica”.
- source_word: χωρὶς οἰκτιρμῶν
  choice: sem misericórdia
  rationale: O plural grego é expresso naturalmente em português pelo substantivo abstrato singular. A formulação conserva o sentido judicial e a severidade da expressão.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: com base no depoimento de duas ou três testemunhas
  rationale: ἐπί com o dativo indica aqui a base do julgamento. “Com base no depoimento” torna explícita, de modo natural e justificado pelo contexto legal, a função das testemunhas.
- source_word: ἀποθνῄσκει
  choice: morre
  rationale: O presente do indicativo enuncia uma consequência legal geral. “Morre” acompanha diretamente o verbo grego e deixa que o contexto indique a execução judicial.
theological_decisions:
- issue: Se a força judicial e executória de ἀποθνῄσκει deve ser explicitada
  choice: Manter “morre” no texto principal.
  alternative: “é morto” ou “é condenado à morte”
  rationale: O pano de fundo da Lei de Moisés aponta para execução judicial, mas o grego emprega literalmente o verbo “morrer”, não uma formulação causativa explícita. A tradução preserva essa contenção do texto-fonte, enquanto a nota esclarece a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui o corpo legal associado a Moisés. A ordem da frase foi mantida simples e direta, e o vocabulário jurídico foi limitado a “depoimento”, termo comum e preciso.
