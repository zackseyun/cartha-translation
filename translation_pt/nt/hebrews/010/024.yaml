  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: pt
  text: e consideremos uns aos outros, para estimularmos uns aos outros ao amor e às boas obras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para nos impelirmos” ou “para nos provocarmos” ao amor e às boas obras. O substantivo grego παροξυσμός pode indicar forte estímulo, incitamento ou provocação.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: consideremos
  rationale: O presente do subjuntivo na primeira pessoa do plural tem força exortativa. “Consideremos” preserva a ideia de observar e pensar atentamente, com linguagem natural e digna.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco corrente em português, apropriado ao caráter comunitário da exortação.
- source_word: εἰς
  choice: para
  rationale: Introduz aqui a finalidade ou o resultado visado pela consideração mútua.
- source_word: παροξυσμόν
  choice: nos estimularmos
  rationale: O substantivo indica forte incitamento ou provocação. A formulação verbal comunica de modo natural em português a ação mútua visada, sem perder sua intensidade positiva no contexto.
- source_word: ἀγάπης
  choice: amor
  rationale: Equivalente contemporâneo padrão de ἀγάπη.
- source_word: καλῶν ἔργων
  choice: boas obras
  rationale: Tradução direta que preserva a ligação lexical com ἔργον e o uso neotestamentário, sem acrescentar uma teoria de mérito.
- source_word: καί
  choice: e
  rationale: Mantém a coordenação com a exortação anterior e a ligação entre amor e boas obras.
theological_decisions:
- issue: Possível conotação negativa de παροξυσμός
  choice: “nos estimularmos ao amor e às boas obras” no texto principal
  alternative: “nos provocarmos ao amor e às boas obras” ou “nos impelirmos ao amor e às boas obras”
  rationale: Embora o termo grego possa sugerir uma provocação forte e até ter sentido negativo em outros contextos, aqui amor e boas obras definem positivamente o propósito. “Estimular” preserva o impulso ativo sem introduzir hostilidade; a força e a alternativa mais literal são registradas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Consideremos” conserva o tom exortativo formal sem soar arcaico. A construção reflexiva “nos estimularmos” explicita de maneira idiomática a reciprocidade já presente em “uns aos outros” e evita a leitura pouco natural de que amor e boas obras sejam objetos pessoais diretamente provocados.
