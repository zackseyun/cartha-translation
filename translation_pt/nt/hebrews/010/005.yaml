  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: pt
  text: 'Por isso, ao entrar no mundo, ele diz: “Sacrifício e oferta não quiseste, mas preparaste um corpo para mim”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui Hebreus segue a redação grega do Salmo 40.6: “preparaste um corpo para mim”. O texto hebraico do Salmo 40.6 diz: “abriste-me os ouvidos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida do argumento anterior.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: ao entrar no mundo
  rationale: Conserva o valor circunstancial do particípio presente sem fixar desnecessariamente o tempo da entrada.
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente usado para introduzir a fala citada nas Escrituras.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Sacrifício e oferta
  rationale: Preserva os dois termos cultuais distintos e seu emprego genérico.
- source_word: οὐκ ἠθέλησας
  choice: não quiseste
  rationale: Traduz diretamente o desejo ou vontade expressos por θέλω, em registro digno e amplamente compreensível.
- source_word: σῶμα δὲ κατηρτίσω μοι
  choice: mas preparaste um corpo para mim
  rationale: Preserva o contraste introduzido por δέ, o sentido concreto de σῶμα e o valor benefativo de μοι.
theological_decisions:
- issue: A redação grega citada em Hebreus difere do texto hebraico do Salmo 40.6.
  choice: um corpo para mim preparaste
  alternative: abriste os meus ouvidos
  rationale: A tradução segue prioritariamente o texto grego de Hebreus, sem harmonizá-lo com a redação hebraica do Salmo; a diferença relevante é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa singular para preservar a fala dirigida diretamente a Deus. A construção “ao entrar” mantém a fluidez e a ambiguidade temporal do particípio grego.
