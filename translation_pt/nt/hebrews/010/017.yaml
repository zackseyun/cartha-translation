  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: pt
  text: e não me lembrarei mais dos pecados deles nem de seus atos de transgressão da lei.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “certamente não me lembrarei mais dos pecados deles nem de seus atos de transgressão da lei”.'
    reason: lexical_alternative
  - marker: b
    text: “Atos de transgressão da lei” traduz ἀνομίαι, que também pode ser vertido como “atos contrários à lei” ou, tradicionalmente, “iniquidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa comum. Foi mantida no início porque a frase dá continuidade à citação precedente.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dos pecados deles
  rationale: ἁμαρτία designa naturalmente “pecado”; o plural com αὐτῶν resulta de modo claro e direto em “os pecados deles”.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: nem dos atos de desobediência deles
  rationale: Após a oração negativa, “nem” coordena naturalmente em português os dois complementos. ἀνομία expressa transgressão ou desrespeito à lei; “atos de desobediência” comunica o sentido concreto do plural em linguagem corrente, sem recorrer ao menos transparente “iniquidades”.
- source_word: οὐ μὴ μνησθήσομαι
  choice: não me lembrarei
  rationale: A combinação οὐ μή com o futuro forma uma negação enfática e decisiva. A formulação preserva o verbo “lembrar”, importante para a imagem bíblica, sem explicar a expressão como perda literal de conhecimento.
- source_word: ἔτι
  choice: mais
  rationale: Com a negação, ἔτι é expresso idiomaticamente por “não... mais”, isto é, “nunca mais” ou “já não”.
theological_decisions:
- issue: O não se lembrar divino dos pecados
  choice: Preservar literalmente a linguagem de Deus não se lembrar mais dos pecados.
  alternative: Parafrasear como “não os levarei mais em conta” ou “não os lançarei mais contra eles”.
  rationale: A formulação mantém a significativa imagem bíblica de lembrar e não lembrar, sem impor uma explicação filosófica sobre a onisciência divina. No contexto da promessa da aliança, ela comunica o perdão, mas a tradução não elimina a tensão própria da expressão.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. “Não me lembrarei mais” preserva a expressão bíblica e incorpora ἔτι de forma idiomática; “atos de desobediência” privilegia transparência sem apagar a relação de ἀνομία com a violação da lei.
