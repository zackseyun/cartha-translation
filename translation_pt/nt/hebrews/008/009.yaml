id: HEB.8.9
reference: Hebrews 8:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: pt
  text: não como a aliança que fiz com os pais deles, no dia em que os tomei pela mão para tirá-los da terra do Egito[a], porque eles não permaneceram na minha aliança, e eu não me importei com eles[b], diz o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “quando agarrei a mão deles”.'
    reason: lexical_alternative
  - marker: b
    text: 'A citação segue a redação grega refletida em Hebreus: “não me importei com eles”. O texto hebraico de Jeremias 31:32 tem outro sentido, frequentemente traduzido como “embora eu fosse o marido deles” ou “embora eu fosse o senhor deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: aliança
  rationale: Em Hebreus e na citação de Jeremias, o termo designa a relação pactual estabelecida por Deus; “aliança” é preciso e natural em português.
- source_word: ἐποίησα
  choice: fiz
  rationale: A expressão portuguesa “fazer uma aliança” corresponde diretamente ao idioma grego ποιέω com διαθήκη.
- source_word: πατράσιν
  choice: pais
  rationale: O grego usa o masculino plural e se refere aos antepassados israelitas; “pais” preserva essa forma e o registro bíblico sem deixar de ser compreensível.
- source_word: ἐν ἡμέρᾳ
  choice: no dia em que
  rationale: Preserva a imagem temporal concreta e introduz naturalmente em português a ação associada ao êxodo.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: os tomei pela mão
  rationale: Expressão idiomática em português que conserva a imagem de Deus tomando-os pela mão; o singular coletivo de χειρός é bem representado.
- source_word: ἐξαγαγεῖν
  choice: para tirá-los
  rationale: ἐξάγω significa fazer sair, conduzir ou tirar para fora; “tirá-los” é conciso, natural e adequado à saída do Egito.
- source_word: γῆς Αἰγύπτου
  choice: da terra do Egito
  rationale: Mantém explicitamente γῆς, em vez de reduzir a expressão simplesmente a “do Egito”.
- source_word: ἐνέμειναν
  choice: não permaneceram na
  rationale: ἐμμένω comunica permanecer ou persistir em um compromisso; “permanecer na aliança” conserva a metáfora e soa natural.
- source_word: κἀγὼ
  choice: e eu
  rationale: A crase grega equivale literalmente a “e eu”; evita tornar a relação mais explicitamente causal do que o texto.
- source_word: ἠμέλησα αὐτῶν
  choice: não me importei com eles
  rationale: ἀμελέω pode significar não dar atenção, negligenciar ou não se importar. Esta formulação é atual e clara, sem intensificar a ideia para rejeição ativa.
- source_word: λέγει κύριος
  choice: diz o Senhor
  rationale: Reproduz naturalmente a fórmula de citação no presente e mantém “Senhor” para κύριος.
theological_decisions:
- issue: Sentido de ἠμέλησα αὐτῶν na citação de Jeremias 31:32, em que o texto grego de Hebreus e o texto hebraico de Jeremias diferem
  choice: e eu não me importei com eles
  alternative: embora eu fosse o marido deles / embora eu fosse o senhor deles
  rationale: A tradução segue o texto grego de Hebreus, que apresenta ἠμέλησα αὐτῶν, sem harmonizá-lo silenciosamente com o texto hebraico de Jeremias. A diferença intertextual relevante é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens principais do grego foram preservadas, mas a construção “os tomei pela mão” evita rigidez desnecessária. Os marcadores [a] e [b] aparecem no texto.
