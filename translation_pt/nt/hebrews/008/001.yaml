id: HEB.8.1
reference: Hebrews 8:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: pt
  text: 'O ponto principal[a] do que está sendo dito é este: temos um sumo sacerdote como este, que se assentou à direita do trono da Majestade nos céus[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o resumo” ou “o ponto central” do que está sendo dito.
    reason: lexical_alternative
  - marker: b
    text: Ou “no céu”; em grego, “nos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: O ponto principal
  rationale: Neste contexto argumentativo, κεφάλαιον indica o ponto central ou o resumo do que está sendo exposto, não um “capítulo” literal.
- source_word: δὲ
  choice: não representado por palavra isolada
  rationale: A partícula marca uma transição leve; em português, a própria formulação resumitiva comunica essa passagem com naturalidade, sem exigir “agora”, “mas” ou “e”.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: do que está sendo dito
  rationale: Preserva o sentido presente e passivo da expressão grega e soa natural no contexto do discurso em andamento.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: temos um sumo sacerdote assim
  rationale: Mantém a referência ao tipo de sumo sacerdote descrito anteriormente, com ordem natural em português.
- source_word: ἐκάθισεν
  choice: se assentou
  rationale: Expressa a ação concluída de tomar assento sem acrescentar uma interpretação teológica explícita.
- source_word: ἐν δεξιᾷ
  choice: à direita
  rationale: Equivalente idiomático corrente em português para a posição de honra e autoridade.
- source_word: τοῦ θρόνου τῆς μεγαλωσύνης
  choice: do trono da Majestade
  rationale: Preserva a imagem régia e a designação reverente e indireta de Deus presente no grego.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Conserva o plural do grego e é uma expressão natural e tradicional em português.
theological_decisions:
- issue: Tornar explícito que “a Majestade” se refere a Deus
  choice: Manter “a Majestade”
  alternative: o trono de Deus
  rationale: O texto grego emprega uma designação reverente indireta, não θεός; preservá-la mantém o registro e evita explicitação interpretativa.
- issue: Explicitar na tradução a conclusão da obra sacerdotal em ἐκάθισεν
  choice: Traduzir simplesmente por “se assentou”
  alternative: tomou seu lugar após concluir sua obra
  rationale: A relação com a obra sacerdotal concluída pertence ao argumento contextual de Hebreus e não deve ser inserida como expansão neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sumo sacerdote” e “Majestade” preservam o registro bíblico e cultual sem arcaísmo excessivo. A vírgula final acompanha a continuidade sintática do trecho fornecido.
