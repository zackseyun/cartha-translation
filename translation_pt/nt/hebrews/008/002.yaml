  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: pt
  text: ministro dos lugares santos e do verdadeiro tabernáculo[a], que o Senhor, e não um ser humano, ergueu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuário”; a expressão grega pode designar os lugares santos do santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “armou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: dos lugares santos
  rationale: O adjetivo plural substantivado, neste contexto cultual de Hebreus, aponta mais naturalmente para os lugares santos do santuário celestial. O plural preserva a forma grega sem transformá-la numa referência aos santos.
- source_word: λειτουργὸς
  choice: ministro
  rationale: O termo designa alguém que exerce serviço público ou religioso. “Ministro” comunica aqui a função sacerdotal e cultual de modo claro e digno.
- source_word: σκηνῆς
  choice: tabernáculo
  rationale: Em Hebreus, o termo evoca o tabernáculo mosaico e sua contraparte celestial; “tabernáculo” preserva essa ressonância bíblica melhor do que o termo genérico “tenda”.
- source_word: ἀληθινῆς
  choice: verdadeiro
  rationale: Preserva a ideia do que corresponde à realidade plena, em contraste implícito com a cópia terrena, sem ampliar interpretativamente o texto.
- source_word: ἔπηξεν
  choice: ergueu
  rationale: O verbo significa fixar ou montar, especialmente uma tenda. “Ergueu” é natural em português e se aplica adequadamente ao tabernáculo; a imagem mais literal de armar uma tenda é mantida em nota.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Reproduz o título κύριος de forma convencional e mantém o sujeito definido da ação.
- source_word: οὐκ ἄνθρωπος
  choice: e não um ser humano
  rationale: Expressa com clareza o contraste entre a ação do Senhor e a ação humana, preservando o sentido genérico de ἄνθρωπος sem sugerir contraste de sexo.
theological_decisions:
- issue: Referente de τῶν ἁγίων e sua relação com o santuário celestial
  choice: linguagem cultual referente aos lugares santos
  alternative: os santos; o santuário
  rationale: Hebreus 8:1–5 trata do ministério sumo sacerdotal no âmbito celestial. “Lugares santos” conserva tanto o contexto do santuário quanto o plural grego, sem deslocar o sentido para pessoas santas.
- issue: Força genérica de ἄνθρωπος
  choice: um ser humano
  alternative: o homem
  rationale: A oposição é entre aquilo que o Senhor estabeleceu e aquilo que uma pessoa estabeleceria. “Um ser humano” torna inequívoco esse sentido genérico e mantém o contraste teológico sem introduzir uma distinção entre homem e mulher.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o caráter de continuação sintática do versículo anterior. “Tabernáculo” preserva a terminologia cultual bíblica, enquanto “ergueu” evita rigidez excessiva; a alternativa mais ligada à imagem de uma tenda aparece em nota.
