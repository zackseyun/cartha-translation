id: HEB.8.4
reference: Hebrews 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: pt
  text: Se ele estivesse na terra, nem sequer seria sacerdote, visto que há os que oferecem os dons[a] de acordo com a Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ofertas”. O grego diz “os dons”, expressão frequentemente usada para ofertas sacrificiais neste contexto.
    reason: Alternativa lexical que esclarece o sentido cultual de δῶρα sem eliminar sua forma mais literal no texto principal.
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Se
  rationale: Introduz a condição e mantém a transição lógica sem sobrecarregar a frase com partículas pouco naturais em português.
- source_word: ἦν
  choice: estivesse
  rationale: O imperfeito, nesta construção condicional com ἄν na oração principal, expressa uma condição contrária à realidade; o imperfeito do subjuntivo é a forma idiomática em português.
- source_word: ἐπὶ γῆς
  choice: na terra
  rationale: Expressa naturalmente o contraste contextual entre a esfera terrena e a celestial.
- source_word: οὐδ’ ἂν ἦν
  choice: nem sequer seria
  rationale: Preserva tanto a negação hipotética quanto a ênfase de οὐδέ.
- source_word: ἱερεύς
  choice: sacerdote
  rationale: Termo corrente e preciso para o ofício cultual referido no contexto.
- source_word: ὄντων τῶν προσφερόντων
  choice: visto que há os que oferecem
  rationale: Comunica de modo natural o valor circunstancial e causal do genitivo absoluto.
- source_word: κατὰ νόμον
  choice: de acordo com a Lei
  rationale: Indica conformidade com a ordem legal mosaica que regula as ofertas sacerdotais; a inicial maiúscula esclarece a referência contextual sem acrescentar conteúdo.
- source_word: τὰ δῶρα
  choice: os dons
  rationale: Preserva a distinção lexical entre o verbo προσφέρω, traduzido por “oferecer”, e o substantivo δῶρα, embora este tenha sentido sacrificial no contexto.
theological_decisions:
- issue: Sujeito implícito da condição
  choice: Explicitar “ele”, com referência a Jesus, o Messias, no contexto imediato.
  alternative: Reformular a frase para evitar um sujeito explícito.
  rationale: O português requer um sujeito recuperável com clareza, e o antecedente é inequívoco no argumento precedente; a explicitação não acrescenta uma afirmação doutrinária ao texto.
- issue: Valor da construção condicional
  choice: 'Traduzir como condição contrária à realidade: “Se ele estivesse na terra, nem sequer seria sacerdote”.'
  alternative: Usar uma condição menos marcada, como “Se ele está na terra, não é sacerdote”.
  rationale: A construção εἰ com imperfeito, seguida de ἄν com imperfeito, assinala uma situação irreal; o português a representa naturalmente com “estivesse” e “seria”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém o caráter argumentativo e cultual do versículo. O marcador da nota foi colocado junto a “dons”, termo ao qual a nota efetivamente se refere.
