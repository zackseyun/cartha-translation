  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: pt
  text: Ao dizer[a] “nova”[b], tornou obsoleta a primeira. E aquilo que se torna obsoleto e envelhece está perto de desaparecer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quando diz”.
    reason: lexical_alternative
  - marker: b
    text: O grego traz apenas “nova”, retomando a expressão “nova aliança” da citação de Jeremias 31:31 feita anteriormente.
    reason: cross_reference
  - marker: c
    text: Ou “está prestes a desaparecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Ao dizer
  rationale: A construção com infinitivo articulado expressa circunstância ou meio. “Ao dizer” é natural em português, mantém a ligação estreita com a citação anterior e não força uma distinção entre “quando diz” e “por dizer”.
- source_word: Καινὴν
  choice: “nova”
  rationale: O adjetivo feminino aparece de forma elíptica, retomando “nova aliança” da citação anterior. Manter apenas “nova” preserva a concisão e a alusão do grego sem acrescentar um substantivo ausente neste versículo.
- source_word: πεπαλαίωκεν
  choice: tornou obsoleta
  rationale: O perfeito indica uma ação realizada com resultado presente. “Tornou obsoleta” comunica bem a força contextual de παλαιόω e concorda com o referente feminino implícito, a primeira aliança.
- source_word: τὴν πρώτην
  choice: a primeira
  rationale: O adjetivo substantivado remete, pelo contexto, à primeira aliança. A tradução mantém a forma elíptica do grego sem inserir “aliança” no texto principal.
- source_word: τὸ ... παλαιούμενον
  choice: aquilo que se torna obsoleto
  rationale: O particípio presente descreve um processo em curso. A formulação é clara e preserva esse aspecto processual.
- source_word: γηράσκον
  choice: envelhece
  rationale: O verbo conserva a imagem de algo que avança em idade e complementa a ideia de tornar-se obsoleto.
- source_word: ἐγγὺς
  choice: está perto de
  rationale: Com o genitivo, ἐγγύς indica proximidade. “Está perto de” é direto e idiomático em português.
- source_word: ἀφανισμοῦ
  choice: desaparecer
  rationale: O substantivo denota desaparecimento ou sumiço. A locução verbal portuguesa comunica o sentido com naturalidade e preserva o caráter temporal da afirmação.
theological_decisions:
- issue: Referente do sujeito implícito em “Ao dizer ‘nova’”
  choice: Sujeito não expresso no texto principal
  alternative: “Deus, ao dizer” ou “Quando ele diz”
  rationale: O grego deixa o sujeito implícito e remete ao falante da citação de Jeremias. Como o português admite naturalmente o sujeito oculto, a tradução evita identificar de modo mais explícito Deus ou a Escritura além do que este versículo declara.
- issue: Condição da primeira aliança
  choice: “tornou obsoleta a primeira”
  alternative: “tornou antiga a primeira”
  rationale: O contexto contrapõe a primeira aliança à nova e apresenta a anterior como superada. “Obsoleta” transmite essa força sem ampliar a afirmação para além do argumento do autor.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. As elipses “nova” e “a primeira” foram preservadas por refletirem a forma concisa do grego, enquanto o gênero feminino torna clara a referência contextual à aliança.
