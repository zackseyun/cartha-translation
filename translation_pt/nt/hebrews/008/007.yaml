  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: pt
  text: Pois, se aquela primeira aliança[a] tivesse sido sem defeito, não se teria procurado lugar para uma segunda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “aquela primeira”; “aliança” é suprido pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não se teria procurado ocasião ou oportunidade para uma segunda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Pois, se
  rationale: Preserva de modo natural tanto a ligação explicativa de γάρ com o argumento anterior quanto a força condicional de εἰ.
- source_word: ἡ πρώτη ἐκείνη
  choice: aquela primeira aliança
  rationale: O feminino grego retoma a aliança do contexto. Explicitar “aliança” evita uma elipse pouco natural em português, sem acrescentar uma ideia nova.
- source_word: ἦν ἄμεμπτος
  choice: tivesse sido irrepreensível
  rationale: “Irrepreensível” comunica a ausência de motivo para censura ou defeito, enquanto o mais-que-perfeito do subjuntivo integra naturalmente a condição contrária ao fato em português.
- source_word: οὐκ ἂν
  choice: não se teria
  rationale: A construção condicional com ἄν é representada pelo futuro do pretérito composto, preservando o caráter hipotético contrário ao fato.
- source_word: δευτέρας
  choice: para uma segunda
  rationale: Mantém a concisão do grego; “aliança” fica subentendida pela primeira oração.
- source_word: ἐζητεῖτο τόπος
  choice: se teria procurado lugar
  rationale: Conserva a forma passiva e a imagem de τόπος, embora a expressão também possa significar procurar ocasião ou oportunidade.
theological_decisions:
- issue: Explicitar “aliança”, embora o substantivo não seja repetido no grego
  choice: aquela primeira aliança
  alternative: aquela primeira; a primeira
  rationale: O contexto imediato contrasta duas alianças. A explicitação identifica o referente do adjetivo feminino sem introduzir uma afirmação doutrinária adicional.
- issue: Natureza da falta associada à primeira aliança
  choice: irrepreensível, sem explicar em que consistia a deficiência
  alternative: sem defeito; inculpável
  rationale: O versículo formula a lógica condicional, mas não define isoladamente se o problema está na aliança, em sua administração ou no povo. A tradução preserva essa tensão para que o contexto seguinte a desenvolva.
- issue: Sentido de τόπος em relação à segunda aliança
  choice: lugar
  alternative: ocasião; oportunidade
  rationale: “Lugar” mantém a imagem lexical do grego, enquanto a nota registra o sentido idiomático possível sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Pois, se... não se teria...” reproduz com naturalidade o raciocínio contrário ao fato. Os marcadores aparecem no texto junto aos pontos que explicam.
