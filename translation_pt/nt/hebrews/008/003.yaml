id: HEB.8.3
reference: Hebrews 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: pt
  text: Pois todo sumo sacerdote é constituído para oferecer tanto ofertas como sacrifícios; por isso, é necessário que este também tenha algo que ofereça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que este também tenha algo para oferecer”. O grego deixa implícito o referente de “este”; no contexto, trata-se de Jesus como sumo sacerdote.'
    reason: Alternativa sintática e esclarecimento do referente implícito.
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Pois todo sumo sacerdote
  rationale: “Todo” preserva o sentido distributivo de πᾶς com o substantivo singular; “pois” expressa a ligação explicativa de γάρ, e “sumo sacerdote” é a designação cultual corrente de ἀρχιερεύς.
- source_word: εἰς τὸ προσφέρειν
  choice: para oferecer
  rationale: A construção com εἰς e o infinitivo articular indica finalidade; “para oferecer” é natural em português e conserva esse valor.
- source_word: δῶρά τε καὶ θυσίας
  choice: tanto dádivas como sacrifícios
  rationale: “Tanto... como...” representa o pareamento τε καὶ, enquanto “dádivas” e “sacrifícios” mantém distintas as duas categorias cultuais.
- source_word: καθίσταται
  choice: é constituído
  rationale: No contexto sacerdotal, o passivo indica que alguém é colocado ou investido no ofício. “É constituído” preserva esse sentido institucional com registro digno.
- source_word: ὅθεν
  choice: por isso
  rationale: Introduz uma conclusão derivada da afirmação anterior; “por isso” comunica a inferência de modo claro e atual.
- source_word: ἀναγκαῖον ἔχειν
  choice: é necessário que ... tenha
  rationale: A formulação portuguesa com oração finita transmite naturalmente a construção impessoal de necessidade.
- source_word: τι
  choice: algo
  rationale: Mantém a indefinição do pronome sem especificar antecipadamente a natureza da oferta.
- source_word: καὶ τοῦτον
  choice: este também
  rationale: “Este” preserva a força demonstrativa de τοῦτον, e “também” traduz καί. O referente permanece implícito no enunciado, como no grego.
- source_word: ὃ προσενέγκῃ
  choice: que ofereça
  rationale: A oração relativa com subjuntivo expressa aquilo que este deve ou pode apresentar como oferta, sem tornar a formulação desnecessariamente pesada.
theological_decisions:
- issue: Referente de τοῦτον (“este”)
  choice: Manter “este” no texto e explicar em nota que, no contexto, se refere a Jesus como sumo sacerdote.
  alternative: Inserir explicitamente “Jesus” ou “Cristo” no texto principal.
  rationale: O contexto identifica o referente, mas o grego emprega um demonstrativo e não repete o nome. A tradução preserva essa forma sem ocultar do leitor a referência contextual.
- issue: Terminologia cultual
  choice: Conservar “dádivas” e “sacrifícios” como categorias distintas.
  alternative: Usar apenas “ofertas”, ou fundir os termos em “dádivas sacrificiais”.
  rationale: O texto enuncia um princípio geral do sacerdócio e distingue δῶρα de θυσίαι; não convém antecipar aqui uma explicação doutrinária da oferta de Cristo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sumo sacerdote” e “sacrifícios” preservam a precisão cultual; “é constituído” mantém o caráter formal da investidura sacerdotal sem soar arcaico.
