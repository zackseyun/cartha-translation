  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: pt
  text: 'Pois, ao censurá-los, ele diz: “Vejam! Estão chegando os dias, diz o Senhor, em que estabelecerei uma nova aliança com a casa de Israel e com a casa de Judá,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος
  choice: ao censurá-los
  rationale: Expressa de modo natural o particípio com sentido de encontrar falha ou repreender, preservando o objeto pessoal αὐτούς.
- source_word: Ἰδού
  choice: Vejam!
  rationale: Mantém a função de chamar a atenção dos ouvintes, em linguagem atual e compreensível.
- source_word: συντελέσω
  choice: estabelecerei
  rationale: No contexto de διαθήκη, indica levar a efeito ou formalizar a aliança; evita a tradução pouco natural 'completarei sobre'.
- source_word: διαθήκην καινήν
  choice: uma nova aliança
  rationale: Equivalente consagrado e semanticamente adequado para o compromisso pactual anunciado.
- source_word: οἶκον
  choice: casa
  rationale: Preserva a metáfora coletiva bíblica para o povo ou linhagem de Israel e de Judá.
theological_decisions:
- issue: Referente de αὐτούς em 'censurá-los'
  choice: Preservar o pronome masculino plural sem explicitar o referente
  alternative: Traduzir 'ao censurar o povo' ou seguir a variante textual 'ao encontrar falha nela'
  rationale: O texto principal do SBLGNT apresenta αὐτούς, provavelmente referente às pessoas mencionadas no contexto; explicitá-lo eliminaria uma referência que o grego deixa implícita.
- issue: Força de συντελέσω aplicada à nova aliança
  choice: estabelecerei
  alternative: concluirei; farei
  rationale: A escolha comunica a realização efetiva da aliança sem acrescentar uma teoria teológica sobre sua natureza ou momento de cumprimento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A abertura causal 'Pois' mantém γάρ; a formulação conserva a cadência profética e a metáfora 'casa de Israel/Judá'.
