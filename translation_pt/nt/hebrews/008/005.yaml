revisions:
- from: 'Eles realizam seu serviço numa cópia e sombra das coisas celestiais, assim como Moisés foi instruído por Deus[a] quando estava prestes a completar[b] o tabernáculo; pois ele diz: “Tenha o cuidado de fazer tudo de acordo com o modelo que lhe foi mostrado no monte.”'
  to: 'que prestam serviço em algo que é cópia e sombra das coisas celestiais, assim como Moisés foi instruído por Deus[a] quando estava prestes a concluir o tabernáculo[b]; pois ele diz: “Tenha o cuidado de fazer tudo de acordo com o modelo que lhe foi mostrado no monte.”'
  rationale: A revisão restaura a função relativa de οἵτινες, melhora a sintaxe portuguesa da expressão «cópia e sombra» e ajusta «completar» para uma formulação mais natural, sem alterar a ambiguidade ou a orientação lexical do texto-fonte e das notas.
