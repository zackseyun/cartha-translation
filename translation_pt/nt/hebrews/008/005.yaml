  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: pt
  text: 'que prestam serviço em algo que é cópia e sombra das coisas celestiais, assim como Moisés foi instruído por Deus[a] quando estava prestes a concluir o tabernáculo[b]; pois ele diz: “Tenha o cuidado de fazer tudo de acordo com o modelo que lhe foi mostrado no monte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi advertido por Deus”; o verbo grego pode enfatizar uma advertência ou admoestação divina.
    reason: lexical_alternative
  - marker: b
    text: Ou “construir” o tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Eles
  rationale: Retoma naturalmente, em português, os sacerdotes mencionados no contexto anterior, sem forçar a nuance qualitativa do pronome relativo grego.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: numa cópia e sombra
  rationale: “Cópia” expressa a correspondência do santuário terreno com o celestial, enquanto “sombra” conserva a metáfora de algo real, porém inferior à realidade celestial.
- source_word: λατρεύουσιν
  choice: realizam seu serviço
  rationale: No contexto sacerdotal, o verbo designa serviço cultual. A formulação explicita esse sentido sem acrescentar uma interpretação denominacional.
- source_word: τῶν ἐπουρανίων
  choice: das coisas celestiais
  rationale: Mantém amplo o referente do genitivo e evita defini-lo exclusivamente como lugar ou como realidade abstrata.
- source_word: κεχρημάτισται
  choice: foi instruído por Deus
  rationale: O verbo indica uma comunicação de origem divina. A expressão preserva tanto a revelação quanto a orientação, enquanto a possível nuance de advertência é registrada em nota.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: quando estava prestes a completar o tabernáculo
  rationale: Preserva a força prospectiva de μέλλων e o sentido lexical de levar a termo em ἐπιτελεῖν; “tabernáculo” identifica com clareza a tenda-santuário mosaica.
- source_word: Ὅρα ... ποιήσεις πάντα
  choice: Tenha o cuidado de fazer tudo
  rationale: Transmite em português natural a força imperativa de Ὅρα e o valor de ordem do futuro ποιήσεις, sem produzir uma construção artificial.
- source_word: κατὰ τὸν τύπον
  choice: de acordo com o modelo
  rationale: “Modelo” expressa o padrão apresentado a Moisés, segundo o qual cada parte deveria ser feita.
theological_decisions:
- issue: Relação entre o santuário terreno e as coisas celestiais
  choice: “uma cópia e sombra das coisas celestiais”
  alternative: “uma representação e sombra das realidades celestiais”
  rationale: A opção conserva tanto a correspondência quanto a inferioridade do culto terreno, sem reduzir a linguagem a mero símbolo nem definir excessivamente a natureza das coisas celestiais.
- issue: Força de κεχρημάτισται
  choice: “foi instruído por Deus”
  alternative: “foi advertido por Deus”
  rationale: A tradução principal mantém a origem divina e o caráter diretivo da comunicação; a alternativa preserva em nota a possível ênfase admonitória.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação evita literalismos pouco naturais, mas conserva as imagens de “cópia” e “sombra” e a ambiguidade lexical relevante por meio de notas.
