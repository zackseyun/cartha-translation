review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a relação entre o culto terreno e as coisas celestiais, bem como a advertência/instrução dada a Moisés. Contudo, «Eles» substitui sem necessidade o pronome relativo οἵτινες e enfraquece a ligação sintática com os sacerdotes do versículo anterior. Além disso, «numa cópia e sombra» é pouco natural e pode sugerir que «cópia e sombra» é o local físico do serviço, sem explicitar a relação predicativa presente no argumento.
  naturalness: «Realizam seu serviço» é compreensível, mas «prestam serviço» é mais idiomático para λατρεύουσιν no registro cultual. «Em algo que é cópia e sombra» torna a frase clara e natural em português moderno. «Concluir o tabernáculo» mantém o sentido de ἐπιτελεῖν e soa mais natural do que «completar o tabernáculo».
  terminology: «Coisas celestiais», «tabernáculo» e «modelo» são escolhas adequadas. «Instruído por Deus» comunica bem κεχρημάτισται, com a alternativa admonitória devidamente preservada. A expressão «Tenha o cuidado de fazer» transmite apropriadamente a força exortativa de Ὅρα e o futuro imperativo da citação.
  issues:
  - severity: medium
    issue: «Eles» em lugar de um relativo
    rationale: οἵτινες introduz uma oração relativa que retoma os sacerdotes mencionados anteriormente. «que» conserva essa conexão textual de forma natural em português.
  - severity: low
    issue: Construção «numa cópia e sombra»
    rationale: A coordenação sem artigo e a locução espacial soam truncadas. «Em algo que é cópia e sombra» explicita, sem estreitar teologicamente, que o âmbito do serviço é a contraparte terrena das coisas celestiais.
  - severity: low
    issue: «completar o tabernáculo»
    rationale: Embora defensável, a combinação é pouco idiomática em português. «Concluir o tabernáculo» conserva a noção de levar a termo e melhora a fluidez.
