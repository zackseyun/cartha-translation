  source_fidelity: 'A tradução preserva os elementos centrais do grego: a negação enfática de οὐ μή (“de modo nenhum”), a distribuição de ἕκαστος (“cada um”), a especificidade de πολίτην (“concidadão”), o singular masculino de ἀδελφόν (“irmão”), o imperativo “Conheça o Senhor” e a abrangência de “todos me conhecerão, desde o menor deles até o maior”. O uso de “nem” no segundo membro exprime naturalmente em português o escopo da negação já introduzida.'
