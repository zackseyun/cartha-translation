id: HEB.8.11
reference: Hebrews 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: pt
  text: 'E de modo nenhum ensinará cada um ao seu concidadão[a], nem cada um ao seu irmão, dizendo: “Conheça o Senhor”, porque todos me conhecerão, desde o menor deles até o maior.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “próximo”. O texto grego de Hebreus diz “concidadão”, enquanto a passagem correspondente de Jeremias é comumente traduzida como “próximo”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: de modo nenhum ensinará
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação enfática. “De modo nenhum” preserva essa força em português atual.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém a força distributiva, destacando individualmente os membros da comunidade.
- source_word: πολίτην
  choice: concidadão
  rationale: Traduz diretamente o substantivo grego πολίτης, que designa alguém pertencente à mesma comunidade cívica, sem substituí-lo pela formulação tradicional de Jeremias.
- source_word: ἀδελφόν
  choice: irmão
  rationale: Preserva o masculino singular do texto e a linguagem familiar da aliança.
- source_word: Γνῶθι
  choice: Conheça
  rationale: O imperativo aoristo é vertido por um imperativo direto e idiomático em português.
- source_word: κύριον
  choice: Senhor
  rationale: É a tradução estabelecida de κύριος e conserva a ressonância da citação pactual de Jeremias.
- source_word: πάντες εἰδήσουσίν με
  choice: todos me conhecerão
  rationale: Mantém tanto a abrangência de πάντες como o objeto explícito “me”, em ordem natural no português.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: desde o menor deles até o maior
  rationale: Reproduz o merismo que abrange toda a comunidade, sem restringir o sentido apenas a idade ou posição social.
theological_decisions:
- issue: Termo comunitário πολίτην numa citação ou alusão a Jeremias 31:34
  choice: concidadão
  alternative: próximo
  rationale: O texto grego existente de Hebreus traz πολίτην, literalmente alguém da mesma comunidade cívica. A tradução principal segue essa evidência, enquanto a formulação conhecida de Jeremias é indicada em nota.
- issue: Linguagem familiar marcada por gênero em ἀδελφόν
  choice: irmão
  alternative: irmão ou irmã
  rationale: O original está no masculino singular e em construção distributiva. “Irmão” preserva a forma e a metáfora familiar sem negar a abrangência comunitária da promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão “ensinará cada um” evita a sequência menos natural “cada um ensinará” após a negação enfática e conserva o singular distributivo do verbo. O paralelismo foi mantido com “nem cada um”.
