  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: pt
  text: 'Pois esta é a aliança que farei com a casa de Israel depois daqueles dias, diz o Senhor: pondo as minhas leis na mente deles, eu as escreverei nos corações deles; eu serei o Deus deles, e eles serão o meu povo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais fluente: “Porei as minhas leis na mente deles e as escreverei nos corações deles.” O grego emprega primeiro um particípio (“pondo” ou “dando”) e depois um verbo no futuro (“escreverei”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: aliança
  rationale: Em Hebreus e na citação de Jeremias, o termo tem sentido pactual, não o de testamento; “aliança” preserva a continuidade com o contexto profético.
- source_word: διαθήσομαι
  choice: farei
  rationale: No contexto de uma aliança, o futuro médio de διατίθεμαι significa fazer ou estabelecer. “Farei” é natural em português e completa a expressão “farei uma aliança”.
- source_word: οἴκῳ Ἰσραήλ
  choice: casa de Israel
  rationale: Mantém a expressão corporativa e profética da fonte, em vez de reduzi-la simplesmente a “Israel”.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: depois daqueles dias
  rationale: Tradução direta que conserva o idioma profético e o vínculo verbal com Jeremias.
- source_word: κύριος
  choice: Senhor
  rationale: Representa diretamente κύριος no texto grego e mantém a linguagem bíblica da declaração divina.
- source_word: διδοὺς
  choice: pondo
  rationale: Preserva o valor participial do grego e comunica naturalmente a ideia de colocar as leis na mente.
- source_word: νόμους
  choice: leis
  rationale: Conserva o plural explícito do grego, sem harmonizá-lo com tradições que usam o singular.
- source_word: διάνοιαν αὐτῶν
  choice: na mente deles
  rationale: διάνοια designa a faculdade de pensar e compreender. O singular coletivo “mente”, seguido de “deles”, é corrente em português e não apaga a referência plural às pessoas.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: no coração deles
  rationale: A metáfora é a de escrever sobre o coração. Em português, “escrever no coração” é a formulação idiomática e preserva a imagem da inscrição interior.
- source_word: ἐπιγράψω
  choice: eu as escreverei
  rationale: “Escrever” é claro e atual; o pronome “as” retoma explicitamente “leis”.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: eu serei o Deus deles
  rationale: Expressa de forma natural a fórmula relacional da aliança.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: eles serão o meu povo
  rationale: Mantém a fórmula pactual e sua relação recíproca sem paráfrase interpretativa.
theological_decisions:
- issue: Continuidade intertextual com a promessa da nova aliança em Jeremias
  choice: Manter expressões pactuais como “aliança”, “casa de Israel”, “minhas leis”, “Deus deles” e “meu povo”.
  alternative: Empregar uma paráfrase contemporânea que atenue as formas tradicionais da citação.
  rationale: A força teológica da passagem depende em parte do reconhecimento da promessa profética; preservar sua linguagem mantém essa continuidade sem impor uma interpretação denominacional.
- issue: 'Construção verbal mista: particípio διδοὺς seguido do futuro ἐπιγράψω'
  choice: Conservar a assimetria com “pondo ... eu as escreverei”.
  alternative: Regularizar como “porei ... e as escreverei”.
  rationale: A forma escolhida deixa perceptível a estrutura peculiar do grego, enquanto a alternativa mais fluente é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva deliberadamente a construção participial do grego, e a nota oferece a forma portuguesa mais fluente. O marcador foi colocado ao final do versículo por se referir à construção verbal de toda a promessa.
