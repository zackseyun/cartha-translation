  source_fidelity: A tradução comunica corretamente o contraste presente, o perfeito de τέτυχεν, a superioridade do ministério e da aliança, a mediação e o fundamento em promessas melhores. Contudo, «ainda» acrescenta uma intensificação temporal ou progressiva que não está explicitamente em διαφορωτέρας, e a construção comparativa pode refletir mais diretamente ὅσῳ ... κρείττονός.
  naturalness: O texto é claro e de registro apropriado. «Tanto mais excelente quanto» é uma correlação comparativa natural em registro bíblico-literário e torna mais transparente a relação argumentativa do grego. A retirada de «ainda» evita uma nuance desnecessária.
  terminology: «Ministério», «mediador», «aliança» e «promessas» são escolhas adequadas. «Aliança» é exigida pelo contexto imediato da nova aliança em Jeremias. «Instituída» transmite de modo aceitável o sentido jurídico de νενομοθέτηται; a nota alternativa deve evitar «promulgada», que tende a indicar publicação oficial, não necessariamente instituição ou entrada em vigor.
  issues:
