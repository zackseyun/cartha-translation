id: HEB.8.6
reference: Hebrews 8:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: pt
  text: Mas agora ele obteve um ministério tanto mais excelente quanto é também mediador de uma aliança melhor[a], instituída com base em promessas melhores.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega também pode significar «testamento» em alguns contextos; aqui, «aliança» corresponde à promessa da nova aliança em Jeremias, citada nos versículos seguintes.
    reason: alternative_reading
  - marker: b
    text: 'Ou: «estabelecida com base em promessas melhores».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Preserva de modo direto e natural tanto o contraste adversativo quanto a referência à situação presente em relação aos sacerdotes terrenos anteriormente mencionados.
- source_word: διαφορωτέρας
  choice: ainda mais excelente
  rationale: Expressa a superioridade qualitativa indicada pelo comparativo e mantém o tom elevado de Hebreus; «ainda» torna natural em português a correlação comparativa com «na mesma medida».
- source_word: τέτυχεν
  choice: obteve
  rationale: 'O perfeito grego apresenta uma ação consumada cujo resultado permanece: Cristo alcançou esse ministério e continua a possuí-lo.'
- source_word: λειτουργίας
  choice: ministério
  rationale: No contexto, refere-se ao serviço sagrado de Cristo. «Ministério» é claro e evita explicitar como «sacerdotal» aquilo que o contexto já comunica.
- source_word: ὅσῳ καὶ
  choice: na mesma medida em que também
  rationale: 'Conserva a relação proporcional: a excelência do ministério corresponde à superioridade da aliança da qual ele é mediador.'
- source_word: κρείττονός ... διαθήκης
  choice: de uma aliança melhor
  rationale: «Melhor» reproduz naturalmente o termo recorrente de superioridade em Hebreus, enquanto «aliança» corresponde ao contexto da nova aliança de Jeremias citado a seguir.
- source_word: μεσίτης
  choice: mediador
  rationale: É o termo português preciso e consagrado para quem atua entre partes no estabelecimento ou na efetivação de uma relação de aliança.
- source_word: ἥτις
  choice: instituída
  rationale: A referência feminina fica incorporada de modo natural ao particípio que retoma «aliança», sem perder a função descritiva da oração relativa grega.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: com base em promessas melhores
  rationale: Explicita com naturalidade o valor de fundamento ou base de ἐπί com dativo, sem alterar a relação entre a aliança e as promessas.
- source_word: νενομοθέτηται
  choice: instituída
  rationale: Comunica que a aliança foi formalmente estabelecida e permanece vigente. A nota registra a alternativa de matiz legal mais explícito.
theological_decisions:
- issue: Tradução de διαθήκη em Hebreus 8:6
  choice: aliança
  alternative: testamento
  rationale: O contexto imediato remete à promessa da nova aliança em Jeremias e à mediação sacerdotal. «Aliança» preserva essa moldura bíblica; «testamento», embora possível para διαθήκη em certos contextos, obscureceria a conexão aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a progressão comparativa do grego e o caráter jurídico-pactual de νενομοθέτηται sem recorrer a linguagem excessivamente técnica.
