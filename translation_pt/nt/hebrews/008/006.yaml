    rationale: «Promulgar» normalmente se refere à publicação oficial de uma norma; νενομοθέτηται enfatiza que a aliança foi formalmente instituída/estabelecida. «Estabelecida» é alternativa mais precisa.
  revised_text: Mas agora ele obteve um ministério tanto mais excelente quanto é também mediador de uma aliança melhor[a], instituída com base em promessas melhores.[b]
