id: HEB.8.12
reference: Hebrews 8:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: pt
  text: Pois serei misericordioso para com as injustiças deles[a] e não me lembrarei mais dos seus pecados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “seus atos de injustiça” ou “suas maldades”. O grego ἀδικίαις pode indicar injustiça, conduta errada ou atos injustos.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, com negação enfática: “certamente não me lembrarei mais dos seus pecados”. No contexto da aliança, essa é uma expressão de perdão pleno, não uma afirmação de que Deus deixa de ter conhecimento deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou fundamento da promessa anterior e mantém de modo natural a força explicativa do grego.
- source_word: ἵλεως ἔσομαι
  choice: serei misericordioso
  rationale: Expressa a disposição favorável e clemente de Deus sem recorrer ao termo técnico e menos acessível “propício”.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: para com as injustiças deles
  rationale: A construção com “para com” representa o dativo regido por ἵλεως. O plural “injustiças” preserva tanto a dimensão moral quanto a possível referência a atos concretos, sem acrescentar um substantivo ausente do grego.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dos seus pecados
  rationale: ἁμαρτία tem o sentido comum de “pecado”, e o plural é mantido.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: não me lembrarei mais
  rationale: A formulação portuguesa natural mantém o futuro, a negação enfática de οὐ μή e o valor de cessação expresso por ἔτι.
theological_decisions:
- issue: Sentido de Deus não se lembrar mais dos pecados
  choice: Manter no texto a expressão bíblica de que Deus não se lembrará mais dos pecados
  alternative: Explicitar no texto que Deus não os levará mais em conta
  rationale: A linguagem da aliança comunica perdão pleno e a decisão de não imputar os pecados, mas o texto preserva a expressão original sem resolver sua tensão por meio de paráfrase teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Injustiças” preserva a forma plural e evita tanto o arcaísmo relativo de “iniquidades” quanto a adição interpretativa de “atos”. A colocação “não me lembrarei mais” é idiomática e mantém a imagem do original.
