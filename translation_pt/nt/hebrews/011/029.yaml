  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: pt
  text: Pela fé, eles atravessaram o mar Vermelho como por terra seca[a], e os egípcios, ao tentarem fazer o mesmo, foram engolidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar dos Juncos”. O texto grego aqui diz “mar Vermelho” (Ἐρυθρὰν Θάλασσαν), embora o nome hebraico do lugar no relato do Êxodo seja frequentemente entendido como “mar dos Juncos”.
    reason: Alternativa lexical ligada ao topônimo hebraico subjacente, sem alterar a tradução direta do texto grego de Hebreus.
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou instrumento. “Pela fé” preserva a fórmula programática repetida em Hebreus 11 e é natural em português.
- source_word: διέβησαν
  choice: atravessaram
  rationale: O aoristo de διαβαίνω descreve a passagem de um lado ao outro; “atravessaram” comunica isso com clareza.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: o mar Vermelho
  rationale: Traduz diretamente a expressão grega e corresponde ao nome bíblico tradicional em português; a questão do topônimo hebraico subjacente é registrada em nota.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: como por terra seca
  rationale: Mantém a comparação introduzida por ὡς e o sentido de passagem através de solo seco, com redação idiomática.
- source_word: ἧς πεῖραν λαβόντες
  choice: ao tentarem fazer o mesmo
  rationale: πεῖραν λαμβάνειν é uma expressão idiomática para tentar. “Fazer o mesmo” explicita de modo natural que os egípcios tentaram realizar a mesma travessia, sem acrescentar uma ação diferente.
- source_word: οἱ Αἰγύπτιοι
  choice: os egípcios
  rationale: Designação direta do povo, referindo-se no contexto às forças egípcias que perseguiram Israel.
- source_word: κατεπόθησαν
  choice: foram engolidos
  rationale: Preserva a imagem vívida e a voz passiva de καταπίνω, em vez de substituí-la pela consequência interpretativa “afogados”.
theological_decisions:
- issue: Sentido de πίστις em Hebreus 11
  choice: fé
  alternative: confiança; fidelidade
  rationale: A fórmula repetida Πίστει estrutura o capítulo e, neste contexto, “fé” é a correspondência mais adequada e reconhecível. O versículo não exige que se prefira “fidelidade”.
- issue: Identidade dos que atravessaram pela fé
  choice: eles
  alternative: os israelitas
  rationale: O grego deixa o sujeito implícito na forma verbal. “Eles” preserva essa referência contextual sem inserir explicitamente “os israelitas” no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “ao tentarem fazer o mesmo” evita o pouco natural “do qual fizeram a tentativa”, preservando a ligação entre a tentativa dos egípcios e a travessia anterior. O ponto e vírgula e “mas” exprimem com naturalidade o contraste contextual, embora a relação participial do grego não traga uma conjunção explícita.
