id: HEB.11.8
reference: Hebrews 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: pt
  text: Pela fé, Abraão, ao ser chamado, obedeceu e partiu para um lugar que receberia como herança; e partiu sem saber para onde ia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: O dativo indica meio ou esfera. “Pela fé” é a formulação portuguesa consagrada e, neste contexto, expressa a confiança com que Abraão respondeu ao chamado.
- source_word: καλούμενος
  choice: ao ser chamado
  rationale: Reproduz com naturalidade o particípio presente passivo e sua força circunstancial, sem determinar além do texto a relação temporal exata.
- source_word: ὑπήκουσεν
  choice: obedeceu
  rationale: Expressa diretamente a ideia de atender ou cumprir uma ordem.
- source_word: ἐξελθεῖν / ἐξῆλθεν
  choice: partiu / partiu
  rationale: “Partir” é natural em português para deixar um lugar e preserva a repetição entre o infinitivo e o verbo principal, embora sem reproduzir literalmente o componente “para fora”.
- source_word: τόπον
  choice: um lugar
  rationale: O destino ainda não é identificado para Abraão; o indefinido transmite adequadamente essa indeterminação.
- source_word: ἤμελλεν λαμβάνειν
  choice: receberia
  rationale: O futuro do pretérito comunica a futuridade vista a partir do chamado, sem acrescentar a ideia mais forte de predestinação.
- source_word: εἰς κληρονομίαν
  choice: como herança
  rationale: Indica a condição em que o lugar seria recebido, de modo idiomático e fiel.
- source_word: μὴ ἐπιστάμενος
  choice: sem saber
  rationale: Forma portuguesa concisa e natural para o particípio negativo de circunstância acompanhante.
- source_word: ποῦ ἔρχεται
  choice: para onde ia
  rationale: No contexto de deslocamento rumo a um destino, o presente grego é expresso naturalmente em português pelo imperfeito “ia”.
theological_decisions:
- issue: Sentido de πίστις na resposta de Abraão
  choice: fé
  alternative: confiança; fidelidade
  rationale: O contexto destaca a resposta confiante de Abraão ao chamado. “Fé” preserva o termo central do capítulo sem reduzir seu sentido à fidelidade humana.
- issue: Relação entre obedecer e partir
  choice: obedeceu e partiu
  alternative: obedeceu, partindo; obedeceu ao chamado para partir
  rationale: A formulação conserva tanto a obediência quanto a ação exigida, evitando a construção pouco idiomática “obedeceu para partir” e sem inserir explicitamente “ao chamado” como objeto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula conserva a repetição enfática de “partiu” presente no grego sem tornar a frase excessivamente truncada.
