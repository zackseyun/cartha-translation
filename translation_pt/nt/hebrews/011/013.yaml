source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: pt
  text: Todos estes morreram na fé, sem terem recebido as promessas; mas, tendo-as visto de longe, saudaram-nas[a] e declararam que eram estrangeiros e residentes temporários[b] sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acolheram-nas” ou “abraçaram-nas”. O verbo grego significa saudar ou acolher e aqui é usado figuradamente a respeito das promessas vistas de longe.
    reason: lexical_alternative
  - marker: b
    text: Ou “peregrinos”, “forasteiros” ou “estrangeiros residentes”. A palavra grega descreve pessoas que vivem num lugar sem pertencer a ele de modo pleno e permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: na fé
  rationale: A expressão indica que morreram no âmbito ou na postura da fé; “na fé” é natural em português e evita reduzir a fé apenas ao meio de uma ação específica.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: sem terem recebido as promessas
  rationale: Conserva a negação, a relação circunstancial do particípio com o verbo principal e o plural explícito de ἐπαγγελίας.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: tendo-as visto de longe
  rationale: Mantém a imagem de percepção à distância e representa adequadamente o particípio aoristo.
- source_word: ἀσπασάμενοι
  choice: saudaram-nas
  rationale: “Saudar” é o equivalente lexical mais direto e preserva a figura incomum de saudar promessas vistas de longe, sem explicá-la excessivamente.
- source_word: ὁμολογήσαντες
  choice: reconheceram
  rationale: No contexto, o verbo expressa admissão ou declaração aberta. “Reconheceram” é claro e digno, sem impor uma conotação confessional técnica.
- source_word: ξένοι
  choice: estrangeiros
  rationale: Expressa pessoas que não pertencem plenamente ao lugar em que se encontram, com maior precisão social do que “estranhos” no português atual.
- source_word: παρεπίδημοί
  choice: residentes temporários
  rationale: Comunica a condição de quem reside num lugar sem pertencimento permanente; evita acrescentar a ideia de expulsão inerente a “exilados”.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Preserva o sentido amplo de γῆ neste contexto, referente à existência terrena, sem restringi-lo a um território específico.
theological_decisions:
- issue: Sentido de πίστις na morte dos patriarcas
  choice: fé
  alternative: fidelidade; confiança
  rationale: “Fé” preserva o termo teológico amplo e a postura perseverante descrita pelo contexto, sem resolver o conceito em apenas uma de suas dimensões.
- issue: Figura de ἀσπασάμενοι aplicada às promessas
  choice: saudaram-nas
  alternative: acolheram-nas; abraçaram-nas
  rationale: A tradução conserva a personificação e a tensão de responder positivamente a promessas ainda não recebidas; as alternativas interpretam mais diretamente essa resposta.
- issue: Condição expressa por παρεπίδημοί
  choice: residentes temporários
  alternative: peregrinos; forasteiros; exilados
  rationale: O termo indica residência sem pertencimento estabelecido. “Exilados” pode sugerir expulsão, enquanto “peregrinos” pode enfatizar viagem; a escolha mantém o foco no estatuto de residência.
translation_notes:
  register: Português moderno, claro e digno, com construção participial moderadamente formal. A colocação pronominal em “tendo-as visto” e “saudaram-nas” preserva coesão e evita repetir “promessas”. A pontuação explicita o contraste entre não receber e ainda assim ver e saudar.
