  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: pt
  text: Outros passaram por zombarias e açoites[a], e até por correntes e prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram provados por zombarias e açoites, e ainda por correntes e prisão”. Mais literalmente, o grego diz “receberam prova de...”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Outros
  rationale: Retoma o catálogo e introduz outro grupo de fiéis sofredores, preservando o contraste de modo natural.
- source_word: ἐμπαιγμῶν
  choice: zombarias
  rationale: Expressa escárnio e humilhação pública; o plural acompanha de perto o substantivo grego e soa natural em português.
- source_word: μαστίγων
  choice: açoites
  rationale: Designa golpes aplicados com chicote ou correia. “Açoites” é claro, digno e mais específico que “espancamentos”.
- source_word: πεῖραν ἔλαβον
  choice: passaram por
  rationale: Verte idiomaticamente a expressão literal “receberam prova/experiência de”, apresentando esses sofrimentos como provações sem tornar a frase artificial.
- source_word: ἔτι δὲ
  choice: e até
  rationale: Mantém a progressão enfática para formas adicionais e mais severas de sofrimento.
- source_word: δεσμῶν
  choice: correntes
  rationale: Termo concreto e facilmente compreensível para os instrumentos de restrição ou os grilhões do encarceramento.
- source_word: φυλακῆς
  choice: prisão
  rationale: No contexto, indica encarceramento; “prisão” preserva a concisão e funciona naturalmente depois de “passaram por”.
