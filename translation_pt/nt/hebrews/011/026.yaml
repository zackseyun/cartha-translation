  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: pt
  text: Considerou a desonra do Messias[a] uma riqueza maior do que os tesouros do Egito, pois mantinha os olhos na recompensa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a desonra de Cristo”. A expressão “a desonra do Messias” também pode indicar a desonra sofrida por causa do Messias, compartilhada com o ungido de Deus ou entendida por Hebreus como cumprida no Messias; o grego não especifica a relação exata.'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: uma riqueza maior
  rationale: Preserva a comparação de valor expressa pelo comparativo μείζονα e soa natural em português.
- source_word: ἡγησάμενος
  choice: Considerou
  rationale: 'O particípio aoristo de ἡγέομαι tem sentido avaliativo: considerar ou julgar. A forma finita é clara e natural no contexto.'
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: os tesouros do Egito
  rationale: Reproduz de modo direto e idiomático a construção genitiva.
- source_word: τὸν ὀνειδισμὸν
  choice: a desonra
  rationale: ὀνειδισμός abrange censura, insulto e vergonha pública. “Desonra” comunica bem esse campo sem sugerir apenas palavras ofensivas.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona aqui como título. “Messias” torna essa função transparente, sem transformar a expressão em nome próprio.
- source_word: ἀπέβλεπεν
  choice: mantinha os olhos em
  rationale: O imperfeito indica orientação contínua; a expressão portuguesa transmite foco persistente sem explicitar indevidamente uma ideia temporal de olhar adiante.
- source_word: μισθαποδοσίαν
  choice: a recompensa
  rationale: É a forma moderna e clara de expressar a retribuição positiva indicada pelo substantivo neste contexto.
theological_decisions:
- issue: Sentido de “a desonra do Messias” em relação a Moisés
  choice: Manter a construção genitiva “a desonra do Messias” sem expansão interpretativa.
  alternative: a desonra sofrida por causa do Messias; a desonra compartilhada com o ungido de Deus; a desonra que encontra cumprimento no Messias
  rationale: O grego não define explicitamente a relação exata do genitivo. Preservar a formulação mantém a ambiguidade e a tensão cristológica de Hebreus.
- issue: Tradução titular de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste enunciado, o termo funciona como título teológico; “Messias” explicita esse valor. A alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada ao uso natural do português, e o imperfeito foi preservado por uma expressão de foco contínuo.
