source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: pt
  text: Mulheres receberam de volta os seus mortos pela ressurreição; outros, porém, foram torturados[a] e não aceitaram ser libertados[b], para alcançarem uma ressurreição melhor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego indica tormento corporal severo e pode estar ligado a espancamento sobre um cavalete ou armação semelhante a um tambor; o método exato é incerto.
    reason: cultural_note
  - marker: b
    text: Ou “não aceitaram a libertação”. O termo grego se refere aqui a serem libertados da tortura ou da morte, não necessariamente à redenção no sentido da salvação.
    reason: lexical_alternative
  - marker: c
    text: A “ressurreição melhor” contrasta com a devolução anterior dos mortos à vida mortal; aqui, aponta para uma esperança superior de ressurreição além da morte.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: receberam de volta
  rationale: No contexto, indica que as mulheres tornaram a receber aqueles que haviam morrido, e não apenas que os receberam pela primeira vez.
- source_word: γυναῖκες
  choice: Mulheres
  rationale: O plural designa mulheres em sentido geral; o contexto não exige o sentido mais específico de esposas.
- source_word: ἐξ ἀναστάσεως
  choice: pela ressurreição
  rationale: Expressa o meio ou a origem pela qual os mortos lhes foram restituídos, em português natural.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: os seus mortos
  rationale: Reproduz de modo conciso o adjetivo substantivado com o possessivo, referindo-se às pessoas falecidas que lhes pertenciam por vínculo familiar ou afetivo.
- source_word: ἄλλοι δὲ
  choice: outros, porém
  rationale: Marca claramente o contraste entre os que receberam os mortos de volta e os fiéis que não escaparam do sofrimento.
- source_word: ἐτυμπανίσθησαν
  choice: foram torturados
  rationale: Comunica o tormento corporal severo sem especificar um instrumento ou método cuja identificação exata é incerta.
- source_word: οὐ προσδεξάμενοι
  choice: não aceitaram
  rationale: O particípio indica a recusa consciente daquilo que lhes era oferecido.
- source_word: τὴν ἀπολύτρωσιν
  choice: ser libertados
  rationale: Neste contexto, refere-se à libertação da tortura ou da morte, e a construção verbal soa mais natural em português do que o substantivo abstrato.
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade da recusa de modo claro e idiomático.
- source_word: κρείττονος ἀναστάσεως
  choice: uma ressurreição melhor
  rationale: Preserva o termo comparativo característico de Hebreus e o contraste com a restauração anterior à vida mortal.
- source_word: τύχωσιν
  choice: alcançarem
  rationale: Transmite a ideia de obter ou atingir aquilo que se espera, com naturalidade em português.
theological_decisions:
- issue: Sentido de ἀπολύτρωσιν no contexto
  choice: libertação temporal da tortura ou da morte
  alternative: redenção em sentido teológico mais amplo
  rationale: O contexto imediato descreve pessoas fiéis que recusaram uma oportunidade de escapar ao sofrimento. A tradução evita impor ao termo um sentido soteriológico que o versículo não exige.
- issue: Sentido de “ressurreição melhor”
  choice: uma ressurreição superior à restauração temporária à vida mortal
  alternative: uma ressurreição mais favorável sem contraste definido com a primeira parte do versículo
  rationale: A estrutura do versículo contrapõe os mortos devolvidos à vida presente à esperança dos que permaneceram fiéis até a morte, sem definir além do texto todos os aspectos dessa ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar o contraste retórico nem a tensão teológica do grego.
