  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: pt
  text: preferindo ser maltratado junto com o povo de Deus a desfrutar do prazer passageiro do pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desfrutar, por algum tempo, do prazer do pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: preferindo
  rationale: Expressa de modo natural a escolha deliberada entre as duas alternativas e mantém o valor comparativo de μᾶλλον junto ao particípio ἑλόμενος.
- source_word: συγκακουχεῖσθαι
  choice: ser maltratado com
  rationale: Preserva tanto o sentido passivo de sofrer maus-tratos quanto a participação solidária indicada pelo prefixo συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: o povo de Deus
  rationale: Reproduz diretamente a expressão pactual grega em linguagem portuguesa corrente e digna.
- source_word: πρόσκαιρον
  choice: por algum tempo
  rationale: Comunica que o prazer é limitado no tempo, sem exigir uma colocação adjetival menos natural em português.
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: desfrutar por algum tempo o prazer do pecado
  rationale: Embora ἔχειν signifique literalmente 'ter', 'desfrutar' forma em português uma expressão natural com ἀπόλαυσιν e evita a construção pouco idiomática 'ter o prazer'. 'Do pecado' conserva a amplitude do genitivo.
theological_decisions:
- issue: Natureza da alternativa de Moisés ao sofrimento com o povo de Deus
  choice: Contraste moral entre a solidariedade com o povo de Deus e o prazer temporário associado ao pecado, sem especificar os atos pecaminosos.
  alternative: Entender o prazer do pecado especificamente como os privilégios e compromissos da corte do faraó, ou mais amplamente como os prazeres pecaminosos do Egito.
  rationale: O grego não identifica o conteúdo específico do pecado; a tradução mantém essa abertura e a tensão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém o fluxo participial do contexto, usa linguagem digna e evita especificar além do grego qual seria o pecado em vista.
