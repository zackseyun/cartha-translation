id: HEB.11.3
reference: Hebrews 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: pt
  text: Pela fé, entendemos que os mundos[a] foram formados pela palavra de Deus, de modo que aquilo que se vê não veio a existir a partir de coisas visíveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o universo”. Literalmente, “as eras”; o termo grego pode designar a ordem criada ao longo do tempo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo indica meio ou instrumento. A formulação é concisa, natural em português e preserva a repetição temática do capítulo.
- source_word: νοοῦμεν
  choice: entendemos
  rationale: O verbo indica apreensão mental, não simples percepção pelos sentidos; “entendemos” comunica com clareza essa ênfase.
- source_word: κατηρτίσθαι
  choice: foram formadas
  rationale: O infinitivo perfeito passivo expressa constituição ou ordenação já realizada. “Foram formadas” é claro e evita a possível leitura de “ordenadas” como “receberam uma ordem”.
- source_word: τοὺς αἰῶνας
  choice: as eras
  rationale: A tradução mantém o sentido lexical mais direto e a amplitude temporal-cósmica do termo, deixando em nota as interpretações contextuais “os mundos” e “o universo”.
- source_word: ῥήματι θεοῦ
  choice: pela palavra de Deus
  rationale: O dativo é instrumental, e ῥῆμα designa aqui a palavra ou declaração proferida por Deus. A expressão escolhida é natural e fiel sem explicitação indevida.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: de modo que ... não veio a existir
  rationale: A construção apresenta resultado, possivelmente com nuance de propósito. “De modo que” preserva essa relação sem a restringir, e “veio a existir” representa adequadamente γίνομαι.
- source_word: ἐκ φαινομένων
  choice: a partir de coisas visíveis
  rationale: A expressão indica origem em coisas que aparecem ou podem ser vistas; a formulação mantém o contraste com “aquilo que se vê”.
- source_word: τὸ βλεπόμενον
  choice: aquilo que se vê
  rationale: O particípio substantivado singular tem valor coletivo e se refere amplamente à ordem visível. A tradução é idiomática e preserva esse alcance.
theological_decisions:
- issue: Alcance de αἰῶνες na afirmação sobre a criação
  choice: as eras
  alternative: os mundos; o universo
  rationale: O termo pode abranger a ordem criada no decorrer do tempo, e não apenas o cosmos entendido espacialmente. A opção principal preserva a forma e a tensão do grego; a nota oferece as leituras contextuais sem estreitar silenciosamente o sentido.
- issue: Relação entre o visível e a origem da criação
  choice: não veio a existir a partir de coisas visíveis
  alternative: veio a existir do nada
  rationale: O texto afirma explicitamente que o que se vê não se originou de coisas visíveis. Embora isso seja compatível com a criação a partir do nada, a tradução não acrescenta uma formulação metafísica mais completa do que a presente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão incomum “as eras foram formadas” foi mantida por fidelidade à amplitude temporal-cósmica do original, acompanhada de nota explicativa.
