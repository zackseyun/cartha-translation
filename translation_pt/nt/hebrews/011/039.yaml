  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: pt
  text: E todos estes, embora tenham recebido aprovação por meio da fé,[a] não receberam a promessa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenham recebido testemunho favorável” ou “tenham sido atestados”. O particípio grego enfatiza que essas pessoas receberam um testemunho favorável por meio da fé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não obtiveram a promessa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo simples que liga esta síntese à lista anterior, sem acrescentar um contraste que não está expresso na conjunção.
- source_word: πάντες
  choice: todos estes
  rationale: Explicita de modo natural a referência retrospectiva às pessoas mencionadas anteriormente no capítulo.
- source_word: μαρτυρηθέντες
  choice: embora tenham recebido aprovação
  rationale: O particípio passivo indica que eles receberam testemunho favorável; «embora» torna perceptível o valor concessivo produzido pelo contraste contextual com «não receberam».
- source_word: διὰ τῆς πίστεως
  choice: por meio da fé
  rationale: Expressa adequadamente o valor instrumental de διά com genitivo e preserva «fé» como a tradução natural de πίστις neste contexto.
- source_word: οὐκ ἐκομίσαντο
  choice: não receberam
  rationale: κομίζω na voz média pode significar receber ou obter aquilo que foi prometido; «receberam» é claro, atual e adequado ao contexto.
- source_word: τὴν ἐπαγγελίαν
  choice: a promessa
  rationale: Conserva a formulação compacta e singular do grego sem definir antecipadamente se se trata do cumprimento, da herança ou da bênção prometida.
theological_decisions:
- issue: Sentido de «a promessa» no contexto
  choice: a promessa
  alternative: aquilo que havia sido prometido; o cumprimento da promessa; a herança ou bênção prometida
  rationale: A expressão grega permanece compacta, e o versículo seguinte desenvolve seu alcance. A tradução não deve resolver no texto principal uma questão que o original deixa para o contexto.
- issue: Agente do testemunho favorável
  choice: receberam aprovação, sem explicitar de quem
  alternative: foram aprovados por Deus
  rationale: A voz passiva e o contexto podem apontar para Deus como aquele que dá testemunho, mas o agente não está expresso neste versículo; deixá-lo implícito preserva a forma e a abertura do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção concessiva é natural e preserva o contraste contextual; as notas registram alternativas lexicais genuínas sem impor uma interpretação denominacional.
