id: HEB.11.16
reference: Hebrews 11:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: pt
  text: Mas, de fato, eles anseiam por uma pátria melhor[a], isto é, uma pátria celestial. Por isso, Deus não se envergonha de ser chamado o Deus deles, pois lhes preparou uma cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um país melhor”. No grego, o substantivo está implícito; os adjetivos femininos retomam a ideia de “pátria” do contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mas, de fato
  rationale: Aqui, νῦν δὲ introduz a realidade que contrasta com a hipótese do versículo anterior; a expressão não precisa ser entendida em sentido estritamente temporal.
- source_word: κρείττονος
  choice: melhor
  rationale: Preserva o comparativo recorrente em Hebreus com linguagem natural e clara.
- source_word: ὀρέγονται
  choice: anseiam por
  rationale: Expressa desejo intenso e orientação para o objeto desejado, sem reduzir o verbo a um simples querer.
- source_word: κρείττονος ... ἐπουρανίου
  choice: uma pátria melhor ... uma pátria celestial
  rationale: Os adjetivos gregos femininos retomam de modo elíptico πατρίδα, do contexto imediato. Repetir “pátria” torna a relação explícita e natural em português.
- source_word: διὸ
  choice: Por isso
  rationale: Marca claramente a conclusão decorrente do anseio deles pela pátria celestial.
- source_word: οὐκ ἐπαισχύνεται
  choice: não se envergonha
  rationale: Equivalente direto que conserva a dimensão de honra e vergonha presente no verbo.
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: ser chamado o Deus deles
  rationale: Mantém a fórmula relacional do texto e seu eco veterotestamentário sem acrescentar uma explicação teológica.
- source_word: ἡτοίμασεν
  choice: lhes preparou
  rationale: O pretérito perfeito português apresenta a preparação como ato realizado; o pronome dativo é expresso de modo idiomático.
- source_word: πόλιν
  choice: uma cidade
  rationale: Conserva a imagem concreta e escatológica de Hebreus, bem como a indefinição formal do substantivo grego sem artigo.
theological_decisions:
- issue: Substantivo implícito com κρείττονος e ἐπουρανίου
  choice: Suprir “pátria” a partir de πατρίδα no contexto imediato
  alternative: Traduzir por “país” ou deixar o substantivo implícito
  rationale: A concordância feminina dos adjetivos aponta para a ideia de πατρίς retomada do contexto. “Pátria” preserva tanto a ligação lexical quanto o sentido de terra natal, sem definir além do texto a natureza dessa realidade celestial.
- issue: Fórmula relacional “o Deus deles”
  choice: Manter a formulação sem expansão
  alternative: Parafrasear como “reconhecê-los como seu povo”
  rationale: O texto fala especificamente de Deus ser chamado o Deus deles. Uma expansão para a fórmula pactual completa acrescentaria conteúdo não expresso nesta oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mas, de fato” comunica o contraste discursivo; “anseiam” preserva a intensidade afetiva; “pátria celestial” mantém a elipse contextual do grego de forma compreensível.
