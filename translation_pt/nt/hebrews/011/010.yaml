id: HEB.11.10
reference: Hebrews 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: pt
  text: Pois ele esperava a cidade que tem fundamentos[a], da qual Deus é o arquiteto e construtor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cidade que possui os fundamentos”. O plural pode enfatizar permanência e estabilidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “projetista e criador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: esperava
  rationale: O imperfeito expressa expectativa contínua no passado; “esperava” é natural em português e preserva esse aspecto durativo.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa que liga o versículo à peregrinação de Abraão mencionada no contexto anterior.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: a cidade que tem fundamentos
  rationale: Preserva a construção participial, a definição da cidade e o plural “fundamentos”, em português claro e próximo do grego.
- source_word: θεμελίους
  choice: fundamentos
  rationale: É o equivalente normal e conserva o plural, que no contexto pode sugerir solidez e permanência em contraste com tendas.
- source_word: πόλιν
  choice: cidade
  rationale: Equivalente corrente e apropriado ao motivo da cidade de Deus em Hebreus.
- source_word: ἧς
  choice: da qual
  rationale: Retoma “cidade” e introduz naturalmente em português a relação com seus responsáveis pelo projeto e construção.
- source_word: τεχνίτης
  choice: arquiteto
  rationale: No par com δημιουργός, destaca a concepção e o planejamento da cidade, sem perder a ideia de habilidade técnica.
- source_word: δημιουργός
  choice: construtor
  rationale: No contexto de uma cidade, mantém a imagem concreta de construção e distingue a execução do papel de arquiteto.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução padrão do sujeito expresso da oração.
theological_decisions:
- issue: Natureza da cidade prometida
  choice: “a cidade que tem fundamentos”
  alternative: “a cidade celestial” ou “a cidade de fundamentos permanentes”
  rationale: O versículo caracteriza a cidade por seus fundamentos e por Deus como arquiteto e construtor, mas não a chama explicitamente de celestial neste ponto; a tradução não antecipa essa identificação teológica.
- issue: Relação entre τεχνίτης e δημιουργός
  choice: “arquiteto e construtor”
  alternative: “projetista e criador” ou “artífice e construtor”
  rationale: A formulação conserva dois papéis distintos e a metáfora de edificação, sem transformar δημιουργός aqui em uma afirmação técnica sobre criação absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final “Deus é” soa natural e mantém Deus como sujeito enfático. Todos os marcadores de nota aparecem no texto principal.
