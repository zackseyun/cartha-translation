  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: pt
  text: — dos quais o mundo não era digno —, vagando por desertos e montanhas, por cavernas e fendas da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cavidades da terra».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: pessoas das quais
  rationale: Explicita naturalmente em português o referente humano do pronome relativo genitivo, retomando os fiéis que sofreram, sem alterar o sentido.
- source_word: οὐκ ἦν ἄξιος ὁ κόσμος
  choice: o mundo não era digno
  rationale: Conserva a forte avaliação moral do grego e o contraste entre o mundo e os fiéis perseguidos.
- source_word: ἐπὶ ἐρημίαις
  choice: por desertos
  rationale: No contexto de deslocamento, a preposição com dativo admite o âmbito em que vagueavam; «por desertos» soa natural e mantém a imagem concreta.
- source_word: πλανώμενοι
  choice: andando sem rumo
  rationale: Expressa o movimento errante e a condição instável dos fugitivos com linguagem corrente, sem sugerir erro moral.
- source_word: ὄρεσι
  choice: montanhas
  rationale: Equivalente direto e natural de ὄρεσι neste cenário agreste.
- source_word: σπηλαίοις
  choice: cavernas
  rationale: Termo claro e comum para abrigos naturais subterrâneos ou rochosos.
- source_word: ὀπαῖς τῆς γῆς
  choice: fendas da terra
  rationale: Preserva a construção e a imagem de aberturas, cavidades ou fendas no solo, evitando a expressão menos digna «buracos da terra».
theological_decisions:
- issue: Referente e força de «o mundo não era digno»
  choice: Afirmação moral que contrasta a indignidade do mundo com o valor dos fiéis perseguidos.
  alternative: Declaração neutra de incompatibilidade entre os fiéis e a sociedade.
  rationale: A construção grega é explicitamente valorativa. A tradução conserva essa tensão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões preservam o caráter parentético da avaliação. «Andando sem rumo» comunica deslocamento forçado e errante sem a possível conotação moral negativa de «vagando».
