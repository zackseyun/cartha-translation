revisions:
- from: — pessoas das quais o mundo não era digno —, andando sem rumo por desertos e montanhas, cavernas e fendas da terra.[a]
  to: — dos quais o mundo não era digno —, vagando por desertos e montanhas, por cavernas e fendas da terra.[a]
  rationale: A revisão elimina a explicitação desnecessária de «pessoas», substitui a expressão interpretativa «andando sem rumo» por «vagando» e regulariza a construção portuguesa da lista de lugares, sem alterar a força avaliativa nem a imagem concreta do texto grego.
  reviewer_model: gpt-5.6-terra
