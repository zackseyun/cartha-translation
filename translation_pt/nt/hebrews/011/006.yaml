  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: pt
  text: E sem fé é impossível agradar a Deus, pois quem se aproxima dele precisa crer que ele existe[a] e que ele é aquele que recompensa os que o buscam com dedicação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ele é”. O grego é conciso e admite essa tradução mais literal.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “que ele se torna recompensador dos que o buscam”. O verbo grego pode também expressar que Deus se mostra ser aquele que recompensa, sem necessariamente indicar uma mudança em sua natureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: E sem fé
  rationale: χωρίς expressa ausência ou separação, enquanto δέ funciona aqui como conectivo leve. “E sem fé” mantém a continuidade com o contexto anterior sem acentuar um contraste além do necessário.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: é impossível agradar a Deus
  rationale: A construção impessoal com infinitivo é vertida naturalmente por “é impossível agradar”. O objeto implícito é explicitado como “a Deus”, conforme a oração seguinte, evitando em português um pronome sem antecedente expresso no versículo.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: pois ... precisa crer
  rationale: γάρ introduz a razão, e δεῖ comunica necessidade. “Precisa crer” é atual e natural, preservando essa força sem tornar a frase excessivamente formal.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: quem se aproxima dele
  rationale: O particípio presente descreve a pessoa que se achega ou se aproxima de Deus. “Quem se aproxima dele” preserva o movimento relacional e evita repetição pesada de “Deus”.
- source_word: ὅτι ἔστιν
  choice: que ele existe
  rationale: A expressão concisa afirma a realidade de Deus. “Que ele existe” comunica com clareza o sentido em português; a formulação mais literal “que ele é” é preservada em nota.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: os que o buscam com dedicação
  rationale: ἐκζητέω pode transmitir busca persistente ou diligente. “Buscam com dedicação” é claro e idiomático, sem acrescentar uma intensidade desmedida.
- source_word: μισθαποδότης γίνεται
  choice: recompensa
  rationale: O substantivo μισθαποδότης designa aquele que recompensa, e γίνεται, nessa predicação, apresenta aquilo que Deus se mostra ou vem a ser para os que o buscam. A forma verbal “recompensa” produz português natural e mantém a relação ativa, enquanto as nuances literais são registradas em nota.
theological_decisions:
- issue: Sentido de πίστις em contexto teologicamente relevante
  choice: fé
  alternative: confiança; fidelidade
  rationale: A explicação imediata por πιστεῦσαι aponta aqui para crer ou confiar em Deus. “Fé” é o termo consagrado e abrangente, sem impor uma definição denominacional; “confiança” é possível, enquanto “fidelidade” é menos provável neste contexto.
- issue: Força de γίνεται na descrição de Deus como μισθαποδότης
  choice: que recompensa
  alternative: que é aquele que recompensa; que se mostra recompensador; que se torna recompensador
  rationale: O presente γίνεται não precisa indicar mudança na natureza de Deus; em construção predicativa pode expressar aquilo que ele é encontrado ou se mostra ser para os que o buscam. A redação principal evita sugerir mudança ontológica, e a nota conserva a forma e a tensão do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita tanto o arcaísmo “aprazê-lo” quanto uma formulação que sugira mudança no caráter de Deus. Todos os marcadores de notas aparecem no texto principal.
