reference: Hebrews 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: pt
  text: Pois foi por meio dela que os antigos receberam testemunho favorável[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram elogiados” ou “obtiveram bom testemunho”. O verbo grego indica que receberam testemunho favorável.
    reason: lexical_alternative
  - marker: b
    text: Isto é, por meio da fé descrita no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: por meio dela
  rationale: A expressão retoma naturalmente πίστις, substantivo feminino no versículo anterior, e aqui indica o meio pelo qual os antigos receberam testemunho. A forma pronominal preserva a ligação com o contexto sem repetir interpretativamente “fé” no texto principal.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta o que acaba de ser afirmado sobre a fé, mantendo de modo conciso a conexão argumentativa.
- source_word: ἐμαρτυρήθησαν
  choice: receberam testemunho favorável
  rationale: O aoristo passivo de μαρτυρέω indica que os antigos foram objeto de testemunho positivo. A tradução preserva a imagem lexical de testemunho e explicita o sentido favorável exigido pelo contexto, sem identificar expressamente quem testemunhou.
- source_word: οἱ πρεσβύτεροι
  choice: os antigos
  rationale: Neste contexto, o substantivo designa pessoas de gerações passadas, não ocupantes do ofício de presbítero. “Os antigos” é conciso, digno e evita a possível leitura institucional de “os anciãos”.
theological_decisions:
- issue: Referente de ταύτῃ
  choice: O pronome “dela” retoma a fé mencionada em Hebreus 11:1.
  alternative: A expressão pode abranger mais amplamente a realidade da fé descrita no versículo anterior.
  rationale: A concordância feminina singular favorece fortemente πίστις como antecedente, mas a tradução pronominal mantém a ligação contextual sem substituir o demonstrativo por uma explicação explícita.
- issue: Fonte do testemunho favorável
  choice: Não identificar explicitamente Deus no texto principal.
  alternative: Traduzir de modo interpretativo como “foram aprovados por Deus”.
  rationale: Embora o contexto do capítulo aponte para o testemunho divino, o verbo passivo deste versículo não nomeia o agente. Preservar essa forma evita resolver no texto principal aquilo que o grego deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Os antigos” comunica o sentido histórico de οἱ πρεσβύτεροι sem sugerir necessariamente um cargo religioso; “testemunho favorável” conserva a família lexical de μαρτυρέω e sua nuance positiva.
