  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: pt
  text: A fé é a certeza daquilo que se espera[a], a prova das coisas que não se veem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a realidade”, “a substância” ou “a garantia” daquilo que se espera.
    reason: lexical_alternative
  - marker: b
    text: Ou “a evidência” ou “a convicção” a respeito das coisas que não se veem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: fé
  rationale: Neste contexto, designa a atitude de confiança nas promessas de Deus. “Fé” é o termo português natural e consolidado, sem exigir aqui o sentido de “fidelidade”.
- source_word: ἐλπιζομένων
  choice: daquilo que se espera
  rationale: O particípio passivo substantivado indica o conteúdo ou objeto da esperança. A formulação é clara e idiomática em português.
- source_word: ὑπόστασις
  choice: certeza
  rationale: O termo pode expressar realidade, fundamento ou segurança. “Certeza” comunica de modo natural a confiança firme em vista do que se espera, enquanto as possibilidades mais ontológicas são preservadas em nota.
- source_word: πραγμάτων
  choice: das coisas
  rationale: πρᾶγμα é amplo e pode significar coisas, assuntos ou realidades. “Coisas” mantém essa amplitude e o paralelismo do versículo.
- source_word: ἔλεγχος
  choice: prova
  rationale: O termo pode denotar prova, evidência ou a convicção produzida por elas. “Prova” preserva sua força comprobatória sem reduzir o sentido a um sentimento subjetivo.
- source_word: οὐ βλεπομένων
  choice: que não se veem
  rationale: Reproduz diretamente a negação e o particípio passivo presente, referindo-se a coisas que não estão acessíveis à visão.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca uma transição leve. Em português, o fluxo para a definição de fé permanece natural sem um conector explícito; “ora” poderia soar mais marcado ou formulaico.
theological_decisions:
- issue: Sentido de ὑπόστασις em Hebreus 11:1
  choice: certeza
  alternative: realidade, substância ou garantia
  rationale: “Certeza” preserva a dimensão de confiança firme adequada ao contexto exortativo, sem transformar o versículo numa definição metafísica. A nota conserva a amplitude lexical e a leitura tradicional.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança ou fidelidade
  rationale: O contexto descreve a confiança orientada para as promessas de Deus. Não há aqui uma construção que exija “fidelidade”, embora confiança faça parte do sentido de fé.
- issue: Força de ἔλεγχος
  choice: prova
  alternative: evidência ou convicção
  rationale: A tradução principal retém a dimensão objetiva ou comprobatória do termo, enquanto a nota reconhece que ele também pode designar convicção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do grego foi mantida. Evitou-se um conector inicial marcado para δὲ, e as ambiguidades centrais de ὑπόστασις e ἔλεγχος foram preservadas em notas.
