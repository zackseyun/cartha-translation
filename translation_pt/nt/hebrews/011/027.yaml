id: HEB.11.27
reference: Hebrews 11:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: pt
  text: Pela fé, ele deixou o Egito[a], sem temer a ira do rei, pois perseverou como quem vê aquele que é invisível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase pode aludir à fuga de Moisés do Egito, narrada em Êxodo 2, ou à saída do Egito com Israel, narrada em Êxodo 12–14; a redação grega não especifica o episódio.
    reason: cross_reference
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: Mantém a formulação recorrente de Hebreus 11 e expressa o valor instrumental/modal do dativo.
- source_word: κατέλιπεν Αἴγυπτον
  choice: ele deixou o Egito
  rationale: Tradução direta e natural; não acrescenta a ideia mais forte de abandonar nem especifica qual saída do Egito está em vista.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: sem temer a ira do rei
  rationale: Reproduz de modo idiomático a circunstância expressa pelo particípio. “Ira” comunica a intensidade de θυμός sem recorrer a uma expressão excessivamente coloquial.
- source_word: τὸν ἀόρατον
  choice: aquele que é invisível
  rationale: O adjetivo articular é substantivado e tem referente pessoal. Esta formulação é clara, digna e preserva o paradoxo com “vê”.
- source_word: ὡς ὁρῶν
  choice: como quem vê
  rationale: Expressa naturalmente a força comparativa de ὡς com o particípio, sem enfraquecê-la para uma situação meramente hipotética.
- source_word: ἐκαρτέρησεν
  choice: perseverou
  rationale: καρτερέω indica persistência firme. “Perseverou” comunica melhor essa continuidade do que o possível, porém mais amplo, “suportou”.
theological_decisions:
- issue: Qual saída do Egito é mencionada
  choice: O texto principal não decide entre a fuga pessoal de Moisés e a saída de Israel conduzida por ele.
  alternative: Identificar exclusivamente Êxodo 2 ou exclusivamente Êxodo 12–14.
  rationale: A redação grega diz apenas que ele deixou o Egito. Como a identificação do episódio é discutida, a tradução conserva a ambiguidade e a explica em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “como quem vê aquele que é invisível” preserva de forma natural o paradoxo deliberado do grego.
