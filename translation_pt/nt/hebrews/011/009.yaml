reference: Hebrews 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: pt
  text: Pela fé, ele viveu como estrangeiro na terra da promessa, como em terra alheia, habitando em tendas com Isaque e Jacó, coerdeiros da mesma promessa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou instrumento; esta formulação natural preserva o tema recorrente de Hebreus 11.
- source_word: παρῴκησεν
  choice: viveu como estrangeiro
  rationale: O verbo indica residir como alguém de fora, sem posse ou cidadania permanente; a expressão é clara e atual.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: na terra da promessa
  rationale: Com verbo de residência, εἰς pode assumir sentido locativo; a formulação liga diretamente a terra à promessa divina.
- source_word: ὡς ἀλλοτρίαν
  choice: como se fosse terra alheia
  rationale: ἀλλοτρίαν descreve o que pertence a outro ou é estrangeiro; a alternativa aparece em nota porque a sintaxe permite integrá-la estreitamente ao verbo παρῴκησεν.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: habitando em tendas
  rationale: O particípio circunstancial descreve o modo de vida de Abraão e conserva a imagem concreta de habitação não permanente.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: com Isaque e Jacó
  rationale: μετά com genitivo significa diretamente “com”; os nomes seguem formas portuguesas consagradas.
- source_word: τῶν συγκληρονόμων
  choice: coerdeiros
  rationale: O termo designa pessoas que compartilham a mesma herança; “coerdeiros” é conciso, moderno e inteligível.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: da mesma promessa
  rationale: A expressão enfatiza que Isaque e Jacó participavam precisamente da promessa feita a Abraão.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Mantém-se o pronome “ele”, cujo referente contextual é Abraão.
  alternative: Explicitar “Abraão”.
  rationale: O grego não repete o nome, e o sujeito é retomado do versículo anterior. Preservar o pronome mantém a coesão do discurso sem acrescentar explicitação ao texto.
- issue: Relação entre a terra prometida e sua condição de terra alheia
  choice: 'Texto principal: “viveu como estrangeiro na terra da promessa”; nota: “passou a residir na terra da promessa como se fosse terra alheia”.'
  alternative: Fundir no texto principal as duas ideias em “viveu na terra da promessa como se fosse terra alheia”.
  rationale: A construção grega admite destaque tanto à condição de Abraão como residente estrangeiro quanto à terra tratada como alheia. A redação principal é natural e a nota preserva a nuance sintática alternativa, sem resolver indevidamente a tensão entre promessa e não posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Isaque”, “Jacó” e “coerdeiros” são formas correntes; evita-se o arcaísmo “peregrinou” porque pode enfraquecer o sentido social de residência como estrangeiro.
