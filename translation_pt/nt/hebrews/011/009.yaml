  source_fidelity: A redação principal transmite bem πίστει, παρῴκησεν, a terra da promessa, as tendas, Isaque e Jacó e a condição de coerdeiros. Porém, ela não expressa no texto principal a comparação ὡς ἀλλοτρίαν (“como [em terra] alheia/estrangeira”); “como estrangeiro” traduz adequadamente o verbo, mas não substitui integralmente esse complemento. A nota conserva parcialmente a ideia, mas introduz “passou a residir”, nuance incoativa que o aoristo não exige.
  naturalness: '“Pela fé, ele viveu como estrangeiro na terra da promessa, como em terra alheia” é natural em registro bíblico moderno e claramente comunica as duas facetas do grego: a condição de Abraão e a terra tratada como não sua. “Habitando em tendas” e “coerdeiros” são claros e adequados.'
  terminology: “Isaque”, “Jacó”, “terra da promessa” e “coerdeiros” são formas portuguesas estabelecidas e apropriadas. “Terra alheia” preserva a noção de ἀλλότριος — pertencente a outro, não própria — sem impor interpretação teológica adicional.
  issues:
