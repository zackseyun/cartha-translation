    issue: A expressão ὡς ἀλλοτρίαν está ausente do texto principal.
    rationale: “Viveu como estrangeiro” representa παρῴκησεν, mas o grego também qualifica a terra como alheia/estrangeira. Essa informação deve constar na tradução, não apenas em nota.
  - severity: low
    issue: A nota usa “passou a residir”.
    rationale: Essa formulação pode sugerir início de residência, aspecto que não é necessário nem explicitamente marcado pelo texto grego. Como a nuance será expressa diretamente no texto, a nota não é necessária.
  revised_text: Pela fé, ele viveu como estrangeiro na terra da promessa, como em terra alheia, habitando em tendas com Isaque e Jacó, coerdeiros da mesma promessa.
