  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: pt
  text: Pela fé, Isaque abençoou Jacó e Esaú, até mesmo a respeito de coisas futuras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: Expressa de modo natural o dativo instrumental grego e mantém a fórmula recorrente do capítulo.
- source_word: καὶ περὶ μελλόντων
  choice: até mesmo a respeito de coisas que ainda aconteceriam
  rationale: καί tem aqui força enfática, enquanto περὶ μελλόντων aponta para realidades futuras; a formulação conserva essa ênfase sem especificar além do texto.
- source_word: εὐλόγησεν
  choice: abençoou
  rationale: Equivalente direto e corrente para o ato de Isaque ao pronunciar bênçãos sobre seus filhos.
theological_decisions:
- issue: Relação da fé de Isaque com o conteúdo futuro das bênçãos
  choice: Manter a afirmação de que ele abençoou pela fé até mesmo quanto ao futuro
  alternative: Suprimir a força enfática de καί e dizer apenas “a respeito das coisas futuras”
  rationale: A tradução preserva tanto o vínculo explícito com a fé quanto a provável força enfática de καί, sem definir a natureza ou o cumprimento das bênçãos.
translation_notes:
  register: Português moderno, claro e digno, com nomes na forma bíblica corrente no Brasil. A expressão “coisas que ainda aconteceriam” torna o particípio substantivado μέλλοντα inteligível sem eliminar sua abertura semântica.
