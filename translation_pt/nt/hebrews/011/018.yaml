lexical_decisions:
- source_word: πρὸς ὃν
  choice: a quem
  rationale: A expressão introduz a pessoa a quem a declaração foi dirigida; “a quem” é natural em português e preserva a relação com a voz passiva.
- source_word: ἐλαλήθη
  choice: foi dito
  rationale: Mantém a formulação passiva do aoristo de λαλέω sem explicitar desnecessariamente o agente.
- source_word: ὅτι
  choice: dois-pontos antes da citação
  rationale: O conteúdo introduzido por ὅτι é expresso naturalmente em português por uma citação direta após dois-pontos.
- source_word: Ἐν Ἰσαὰκ
  choice: Por meio de Isaque
  rationale: Neste contexto genealógico, ἐν indica a linha ou mediação pela qual a descendência prometida seria reconhecida; a formulação comunica isso com clareza em português moderno.
- source_word: κληθήσεταί
  choice: será chamada
  rationale: Preserva de perto o futuro passivo de καλέω e sua ambiguidade entre chamar, designar e reconhecer.
- source_word: σοι
  choice: sua
  rationale: O dativo tem sentido possessivo no contexto e é expresso idiomaticamente em português pelo possessivo.
- source_word: σπέρμα
  choice: descendência
  rationale: “Descendência” comunica o singular coletivo referente à linhagem sem a possível opacidade do literal “semente”.
theological_decisions:
- issue: Formulação da promessa sobre a linhagem de Abraão
  choice: Por meio de Isaque será chamada a sua descendência
  alternative: Em Isaque será chamada para você uma descendência
  rationale: A opção principal comunica a identificação da linhagem prometida por meio de Isaque sem transformar o texto em uma explicação teológica mais específica. A nota conserva a forma lexical mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “descendência” no texto e preservação da forma mais literal na nota.
