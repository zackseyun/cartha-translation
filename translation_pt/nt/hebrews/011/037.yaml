base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: pt
  text: Foram apedrejados, serrados ao meio, morreram pela violência da espada[a]; andaram de um lado para outro, vestidos de peles de ovelhas e de cabras, passando necessidade, sendo afligidos e maltratados—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: «morreram à espada». A expressão grega inclui φόνος, termo que pode indicar assassinato ou matança e intensifica a violência da frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: Foram apedrejados
  rationale: O aoristo passivo de λιθάζω indica apedrejamento; a formulação preserva a voz passiva sem acrescentar explicitamente que morreram.
- source_word: ἐπρίσθησαν
  choice: serrados ao meio
  rationale: O passivo de πρίζω significa ser serrado; “ao meio” expressa de modo natural o sentido tradicionalmente entendido neste catálogo de martírios.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: mortos pela violência da espada
  rationale: A formulação portuguesa preserva tanto a morte expressa por ἀπέθανον quanto a força violenta de φόνος, evitando a expressão pouco natural “morreram pelo morticínio da espada”.
- source_word: περιῆλθον
  choice: andaram de um lado para outro
  rationale: Expressa o movimento de lugar em lugar indicado por περιέρχομαι, sem impor necessariamente a ideia subjetiva de falta de rumo.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: vestidos de peles de ovelhas e de cabras
  rationale: Explicita de maneira idiomática que as peles serviam de vestimenta e conserva o paralelismo dos dois materiais.
- source_word: ὑστερούμενοι
  choice: passando necessidade
  rationale: O particípio denota carência de recursos ou do necessário; a expressão é clara, atual e não exagera para miséria absoluta.
- source_word: θλιβόμενοι
  choice: sendo afligidos
  rationale: Preserva a forma participial passiva e o sentido amplo de sofrer pressão ou aflição.
- source_word: κακουχούμενοι
  choice: maltratados
  rationale: Equivalente direto e corrente para sofrer tratamento cruel ou ruim.
theological_decisions:
- issue: Força da expressão violenta ἐν φόνῳ μαχαίρης
  choice: mortos pela violência da espada
  alternative: morreram à espada
  rationale: A escolha conserva a intensidade de φόνος sem produzir uma construção portuguesa artificial. Não introduz uma conclusão doutrinária, apenas mantém a força lexical do texto grego.
- issue: Relação dos particípios finais com a situação dos fiéis
  choice: passando necessidade, sendo afligidos e maltratados
  alternative: necessitados, atribulados e maltratados
  rationale: A forma verbal contínua reflete os particípios presentes e apresenta essas condições como experiências concomitantes, sem decidir além do que a sintaxe exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação concisa mantém o ritmo de catálogo do original; o travessão final preserva a continuidade sintática com o versículo seguinte.
