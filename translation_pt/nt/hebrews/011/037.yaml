review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a sequência de violências, o deslocamento contínuo, as vestes de pele e as três condições finais. Contudo, «mortos pela violência da espada» substitui o verbo ativo ἀπέθανον («morreram») por uma construção passiva. «Morreram pela violência da espada» preserva o verbo do grego e conserva a intensificação associada a φόνος.
  naturalness: O texto é moderno, claro e mantém bem o ritmo conciso do catálogo. «Morreram pela violência da espada» é natural em registro bíblico-literário e evita tanto a formulação artificial «morticínio da espada» quanto o apagamento completo da força de φόνος.
  terminology: «Apedrejados», «serrados ao meio», «peles de ovelhas e de cabras», «passando necessidade», «afligidos» e «maltratados» são escolhas adequadas. A nota proposta registra, sem impor uma única análise lexical, que φόνος pode trazer a noção de assassinato ou matança.
  issues:
