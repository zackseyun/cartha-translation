    issue: A expressão «mortos pela violência da espada» não conserva diretamente o verbo ativo ἀπέθανον.
    rationale: Embora o sentido geral seja próximo, o grego diz literalmente que «morreram» em/com a violência (φόνος) da espada. A revisão restaura o verbo ativo, sem enfraquecer a referência à violência.
  revised_text: Foram apedrejados, serrados ao meio, morreram pela violência da espada[a]; andaram de um lado para outro, vestidos de peles de ovelhas e de cabras, passando necessidade, sendo afligidos e maltratados—
