id: HEB.11.40
reference: Hebrews 11:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: pt
  text: pois Deus havia providenciado algo melhor para nós[a], para que eles não fossem aperfeiçoados sem nós[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia previsto algo melhor a nosso respeito”. O particípio grego pode sugerir previsão ou provisão antecipada; o contexto favorece a ideia da provisão ou do desígnio de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “separados de nós” ou “fossem levados à plena realização sem nós”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: havia providenciado
  rationale: No contexto, o particípio indica a provisão ou o desígnio prévio de Deus, não apenas conhecimento antecipado. A formulação também mantém a anterioridade em relação ao aperfeiçoamento conjunto.
- source_word: κρεῖττόν τι
  choice: algo melhor
  rationale: Preserva o tema recorrente de “melhor” em Hebreus e traduz naturalmente o indefinido τι.
- source_word: περὶ ἡμῶν
  choice: para nós
  rationale: Com προβλεψαμένου, expressa de modo idiomático que a provisão divina foi feita tendo-nos em vista.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Mantém a força final ou resultativa da oração grega em português natural.
- source_word: χωρὶς ἡμῶν
  choice: sem nós
  rationale: Expressa com clareza que o aperfeiçoamento deles não ocorre separado do nosso, preservando o sentido corporativo.
- source_word: τελειωθῶσιν
  choice: fossem aperfeiçoados
  rationale: Conserva a amplitude teológica de τελειόω em Hebreus, que pode envolver perfeição, plena realização e chegada à consumação.
- source_word: τοῦ θεοῦ
  choice: Deus
  rationale: O genitivo absoluto é vertido naturalmente como uma oração causal iniciada por “pois Deus”.
theological_decisions:
- issue: Sentido de τελειωθῶσιν no contexto histórico-salvífico de Hebreus
  choice: fossem aperfeiçoados
  alternative: fossem levados à plena realização; chegassem à consumação
  rationale: “Aperfeiçoados” preserva a tensão entre perfeição e conclusão, sem restringir o termo à perfeição moral nem apenas a uma sequência cronológica.
- issue: Relação entre os antigos fiéis e “nós”
  choice: sem nós
  alternative: separados de nós
  rationale: A tradução mantém a afirmação corporativa de que a consumação deles não se dá isoladamente da dos crentes posteriores, sem especificar um esquema doutrinário além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Havia providenciado” evita a possível ambiguidade de “provido” e comunica o desígnio prévio; “aperfeiçoados” mantém o vocabulário teologicamente denso de Hebreus. Os marcadores aparecem junto às expressões a que se referem.
