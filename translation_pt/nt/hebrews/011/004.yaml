  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: pt
  text: Pela fé, Abel ofereceu a Deus um sacrifício melhor que o de Caim[a]. Por meio desse sacrifício, recebeu testemunho de que era justo[b], pois Deus deu testemunho a respeito das ofertas de Abel. E, por meio disso, embora tenha morrido, ele ainda fala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sacrifício maior”. O comparativo grego pode destacar qualidade (“melhor”) ou grandeza/quantidade (“maior”).
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “foi atestado como justo” ou “foi reconhecido como justo”.
    reason: lexical_alternative
  - marker: c
    text: “Por meio disso” pode se referir à fé de Abel ou ao seu sacrifício; o grego não torna o referente inteiramente explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou instrumento. “Pela fé” é natural em português e corresponde ao tema explícito de Hebreus 11.
- source_word: πλείονα θυσίαν
  choice: um sacrifício melhor
  rationale: πλείων pode indicar superioridade qualitativa ou maior grandeza. No contexto comparativo das ofertas, “melhor” é idiomático e evita acrescentar a ideia interpretativa de “mais aceitável”.
- source_word: παρὰ Κάϊν
  choice: que o de Caim
  rationale: παρά após o comparativo introduz o padrão de comparação. A elipse portuguesa “o de Caim” deixa claro que se comparam os sacrifícios, sem alterar o sentido.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: ofereceu a Deus
  rationale: προσφέρω tem sentido cultual neste contexto; “oferecer” é o equivalente corrente e preciso.
- source_word: δι’ ἧς
  choice: Por meio desse sacrifício
  rationale: O pronome relativo feminino retoma mais naturalmente θυσίαν. A explicitação do substantivo é necessária para clareza em português, no qual “sacrifício” é masculino.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: recebeu testemunho de que era justo
  rationale: A formulação mantém o campo semântico de testemunho de μαρτυρέω e soa mais natural em português do que um calque passivo como “foi testemunhado ser justo”.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: pois Deus deu testemunho a respeito de suas ofertas
  rationale: A construção genitiva absoluta é vertida como oração explicativa. “Ofertas” comunica o sentido cultual de δῶρα com maior naturalidade que “dádivas”.
- source_word: δι’ αὐτῆς
  choice: por meio disso
  rationale: A expressão demonstrativa neutra evita decidir no texto principal se o referente é a fé de Abel ou seu sacrifício, ambiguidade possível no grego, mas difícil de reproduzir com os gêneros gramaticais portugueses.
- source_word: ἀποθανὼν
  choice: embora tenha morrido
  rationale: A oração concessiva evidencia o contraste natural com a declaração de que Abel ainda fala.
- source_word: ἔτι λαλεῖ
  choice: ele ainda fala
  rationale: O presente com ἔτι indica efeito ou voz que continua; “ainda fala” é direto e idiomático.
theological_decisions:
- issue: Referente de δι’ αὐτῆς na oração final
  choice: Mantido deliberadamente aberto com “por meio disso”
  alternative: “por meio da fé” ou “por meio do sacrifício”
  rationale: No grego, o pronome feminino pode remeter à fé, que enquadra o versículo e o capítulo, ou ao sacrifício, antecedente feminino mais próximo. Como “fé” e “sacrifício” têm gêneros diferentes em português, um pronome comum resolveria artificialmente a questão; a formulação neutra e a nota preservam a tensão.
- issue: Sentido de ἐμαρτυρήθη
  choice: “recebeu testemunho de que era justo”
  alternative: “foi reconhecido como justo” ou “foi aprovado como justo”
  rationale: A escolha preserva o motivo retórico do testemunho em Hebreus 11 sem reduzir a expressão a mera aprovação nem impor uma formulação soteriológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Preservou-se a repetição temática de “testemunho” e evitou-se linguagem denominacional. A expressão neutra “por meio disso” foi escolhida para conservar uma ambiguidade do original que os gêneros gramaticais do português tenderiam a eliminar.
