  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: pt
  text: Pela fé, Jacó, quando estava morrendo, abençoou cada um dos filhos de José e adorou apoiando-se na extremidade de seu cajado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorou voltado para a extremidade de seu cajado”. A expressão grega também pode descrever a direção de sua postura. O texto hebraico de Gênesis 47:31 traz “inclinou-se em adoração sobre a cabeceira de sua cama”, enquanto o texto grego aqui diz “cajado”.'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: A expressão introduz a ação de Jacó como realizada mediante ou em atitude de fé, conforme o uso recorrente no capítulo 11.
- source_word: ἀποθνῄσκων
  choice: quando estava para morrer
  rationale: O particípio presente é contemporâneo às ações principais e situa a cena nos momentos próximos da morte de Jacó, em português natural.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: cada um dos filhos de José
  rationale: Preserva a força distributiva de ἕκαστον com o genitivo partitivo, destacando que cada filho recebeu a bênção.
- source_word: εὐλόγησεν
  choice: abençoou
  rationale: Equivalente corrente de εὐλογέω, adequado ao contexto patriarcal e à narrativa de Gênesis.
- source_word: προσεκύνησεν
  choice: adorou
  rationale: Expressa o sentido religioso de προσκυνέω no contexto, sem reduzir a ação a uma simples inclinação corporal.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: apoiado na extremidade de seu cajado
  rationale: Oferece uma leitura natural da postura de Jacó e evita sugerir que o cajado fosse o objeto da adoração, sem ocultar a dificuldade da construção grega.
theological_decisions:
- issue: Relação entre a adoração de Jacó e o cajado na oração final
  choice: Jacó adorou a Deus apoiado na extremidade de seu cajado.
  alternative: Jacó adorou voltado para a extremidade de seu cajado; ou, conforme o texto hebraico de Gênesis 47:31, inclinou-se em adoração sobre a cabeceira de sua cama.
  rationale: O texto grego de Hebreus diz “cajado”, em consonância com a forma da Septuaginta, enquanto o hebraico de Gênesis 47:31 permite “cama”. A tradução principal entende a expressão como descrição da postura, não do objeto da adoração; a nota preserva tanto a ambiguidade sintática quanto a diferença intertextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cajado” preserva a imagem tradicional e concreta de ῥάβδος. A nota reúne a ambiguidade da preposição e a diferença entre o texto grego de Hebreus e o hebraico de Gênesis.
