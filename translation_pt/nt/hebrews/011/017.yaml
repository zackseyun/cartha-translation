source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: pt
  text: Pela fé, Abraão, quando estava sendo provado, ofereceu Isaque; e aquele que havia recebido as promessas estava oferecendo o seu filho único[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho singular”. O termo grego enfatiza a singularidade de Isaque; “filho unigênito” é uma tradução tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: Expressa naturalmente em português o dativo de meio ou instrumento e mantém a fórmula recorrente do capítulo.
- source_word: προσενήνοχεν
  choice: ofereceu
  rationale: O perfeito de προσφέρω resume o ato de Abraão; o pretérito perfeito é idiomático em português, e “ofereceu” preserva o sentido sacrificial.
- source_word: πειραζόμενος
  choice: ao ser provado
  rationale: Preserva a voz passiva e o valor circunstancial do particípio presente. “Provado” comunica uma prova da fé, sem sugerir incitação ao pecado.
- source_word: μονογενῆ
  choice: filho único
  rationale: Em uso contextual, μονογενής salienta a condição singular e incomparável de Isaque, especialmente como filho da promessa, sem exigir a ideia etimológica de geração.
- source_word: προσέφερεν
  choice: estava oferecendo
  rationale: A perífrase preserva o aspecto progressivo do imperfeito e o distingue do perfeito anterior.
- source_word: ἀναδεξάμενος
  choice: havia acolhido
  rationale: “Acolhido” representa o valor de receber ou aceitar de bom grado e combina naturalmente com as promessas; o mais-que-perfeito composto esclarece a anterioridade.
- source_word: ἐπαγγελίας
  choice: as promessas
  rationale: Mantém o plural grego e a expressão portuguesa consagrada para as promessas divinas feitas a Abraão.
- source_word: καὶ
  choice: e
  rationale: Conserva a ligação coordenativa simples do texto grego sem acrescentar interpretação.
theological_decisions:
- issue: O sentido de μονογενῆ aplicado a Isaque, embora Abraão tivesse outro filho biológico
  choice: filho único
  alternative: filho singular; filho unigênito
  rationale: A expressão identifica Isaque como o filho singular da promessa e corresponde à linguagem do relato de Gênesis. A nota preserva a precisão necessária, evitando afirmar que Abraão não tinha nenhum outro filho biológico e sem importar associações cristológicas posteriores.
- issue: A relação aspectual entre προσενήνοχεν e προσέφερεν
  choice: “ofereceu” no primeiro verbo e “estava oferecendo” no segundo
  alternative: “ofereceu” em ambos os casos
  rationale: 'A distinção procura refletir o perfeito e o imperfeito gregos sem resolver a tensão narrativa: o primeiro apresenta o ato de modo global, e o segundo focaliza Abraão no processo de oferecê-lo.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ao ser provado” é conciso e natural; “Isaque” segue a forma bíblica corrente no Brasil. A pontuação conserva a progressão retórica do grego, e a nota esclarece a singularidade de Isaque sem sobrecarregar o texto principal.
