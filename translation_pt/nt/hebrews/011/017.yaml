revisions:
- from: Pela fé, Abraão, ao ser provado, ofereceu Isaque; e aquele que havia acolhido as promessas estava oferecendo seu filho único[a].
  to: Pela fé, Abraão, quando estava sendo provado, ofereceu Isaque; e aquele que havia recebido as promessas estava oferecendo o seu filho único[a].
  rationale: A revisão substitui «havia acolhido» por «havia recebido», evitando uma nuance de aceitação voluntária não explicitada pelo grego. Também explicita o valor temporal-progressivo e passivo do particípio com «quando estava sendo provado». Mantêm-se «ofereceu» e «estava oferecendo» para refletir, sem excessiva rigidez, a distinção entre o perfeito προσενήνοχεν e o imperfeito προσέφερεν. A nota conserva a ambiguidade lexical de μονογενῆ e evita uma afirmação biologicamente imprecisa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:32:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a construção central: «Pela fé», a prova de Abraão, o ato de oferecer Isaque, o plural «as promessas» e o contraste aspectual entre «ofereceu» e «estava oferecendo». Contudo, «havia acolhido as promessas» é mais interpretativo do que ἀναδεξάμενος, que aqui se traduz mais diretamente por «havia recebido».'
  naturalness: O português é claro e de registro bíblico moderno. «Ao ser provado» é aceitável, mas «quando estava sendo provado» expressa com mais transparência o particípio presente passivo e a circunstância temporal. A coordenação com ponto e vírgula mantém bem a progressão da frase.
  terminology: «Isaque», «promessas» e «filho único» são escolhas adequadas. A nota deve explicar «filho único» como expressão de singularidade sem afirmar que Isaque fosse o único filho biológico de Abraão. «Filho singular» funciona como alternativa lexical; «unigênito» pode ser mantido como formulação tradicional.
  issues:
  - severity: medium
    issue: «Havia acolhido» para ἀναδεξάμενος
    rationale: Embora «acolher» possa, em certos contextos, sugerir aceitar de bom grado, o verbo no contexto de promessas recebidas pede a formulação menos interpretativa e mais direta «havia recebido», em consonância com o sentido básico e com o audit trail ინგლისês.
  - severity: low
    issue: Formulação temporal do particípio presente passivo
    rationale: «Ao ser provado» é possível, mas pode soar pontual. «Quando estava sendo provado» torna mais explícitos a passividade e o aspecto em curso de πειραζόμενος.
