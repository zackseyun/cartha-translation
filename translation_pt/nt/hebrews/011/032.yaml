id: HEB.11.32
reference: Hebrews 11:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: pt
  text: E que mais direi? Pois me faltaria tempo se eu continuasse contando a respeito de Gideão, Baraque, Sansão, Jefté, Davi, e também de Samuel e dos profetas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: E que mais direi?
  rationale: Mantém a pergunta retórica e seu impulso discursivo em português natural, sem convertê-la numa pergunta sobre o motivo de continuar.
- source_word: ἐπιλείψει με γὰρ ... ὁ χρόνος
  choice: Pois me faltaria tempo
  rationale: A ordem foi ajustada ao português, preservando γάρ como explicação e o futuro grego com sua força retórica e potencial, expressa naturalmente pelo condicional.
- source_word: διηγούμενον
  choice: se eu continuasse contando
  rationale: O particípio presente descreve a atividade contínua durante a qual o tempo faltaria. A formulação condicional é idiomática, e 'continuasse' explicita o aspecto durativo no contexto de uma enumeração já iniciada.
- source_word: περὶ
  choice: a respeito de
  rationale: Introduz naturalmente, em registro digno e corrente, as pessoas que seriam objeto do relato.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gideão, Baraque, Sansão, Jefté, Davi, Samuel
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: τε καὶ
  choice: e também
  rationale: Preserva o valor aditivo da ligação entre Davi e Samuel sem impor uma classificação teológica além da sintaxe.
- source_word: τῶν προφητῶν
  choice: dos profetas
  rationale: Tradução direta do plural articular, integrado à regência de 'a respeito de'.
theological_decisions:
- issue: Força retórica da falta de tempo
  choice: O condicional 'me faltaria tempo' apresenta a limitação como razão retórica para abreviar o relato.
  alternative: 'O futuro mais literal: ''o tempo me faltará''.'
  rationale: O futuro indicativo grego, junto do particípio circunstancial, funciona aqui como afirmação retórica sobre o que ocorreria caso o autor prosseguisse narrando em detalhe; o condicional reproduz essa função em português natural.
- issue: Agrupamento de Samuel e dos profetas
  choice: '''Davi, e também de Samuel e dos profetas'' mantém Samuel nomeado separadamente, preservando a ligação aditiva.'
  alternative: '''Davi, Samuel e os profetas''.'
  rationale: A construção τε καὶ favorece uma leve progressão aditiva, mas não exige decidir se Samuel está incluído ou não, em sentido classificatório, no grupo dos profetas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais bíblicas correntes no Brasil. A sintaxe conserva a pergunta retórica e a cadência enumerativa do grego. Não se acrescentou nota, pois a formulação principal comunica adequadamente a nuance do original sem perda relevante.
