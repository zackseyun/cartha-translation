id: HEB.11.31
reference: Hebrews 11:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: pt
  text: Pela fé, Raabe, a prostituta, não pereceu junto com os desobedientes, pois acolheu os espias em paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo acolhido os espias pacificamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou fundamento e introduz a fórmula característica dos exemplos de Hebreus 11. “Pela fé” é natural e preserva o termo πίστις.
- source_word: Ῥαὰβ
  choice: Raabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἡ πόρνη
  choice: a prostituta
  rationale: Traduz diretamente πόρνη em linguagem moderna, clara e sem eufemismo; “meretriz” é menos corrente.
- source_word: οὐ συναπώλετο
  choice: não pereceu junto com
  rationale: Preserva tanto a ideia de perecer quanto o valor associativo do verbo composto συναπόλλυμι.
- source_word: τοῖς ἀπειθήσασιν
  choice: os desobedientes
  rationale: O particípio substantivado de ἀπειθέω indica os que desobedeceram ou se mostraram desobedientes; evita reduzir o termo apenas a incredulidade intelectual.
- source_word: δεξαμένη
  choice: pois acolheu
  rationale: O particípio aoristo descreve a circunstância que evidencia sua fé e pode ter nuance causal. “Acolheu” é idiomático para receber pessoas de modo favorável, enquanto “pois” torna clara essa relação sem a tornar excessivamente rígida.
- source_word: τοὺς κατασκόπους
  choice: os espias
  rationale: “Espias” é a designação bíblica tradicional e ainda compreensível para os homens enviados em missão secreta; “espiões” seria uma alternativa mais coloquial.
- source_word: μετ’ εἰρήνης
  choice: em paz
  rationale: Mantém de perto o sintagma grego e comunica uma recepção pacífica e favorável.
theological_decisions:
- issue: Sentido de πίστις na fórmula exemplar de Hebreus 11
  choice: fé
  alternative: confiança; fidelidade
  rationale: A construção πίστει seguida do nome do exemplo favorece “pela fé”, fórmula recorrente do capítulo. As alternativas são semanticamente relacionadas, mas menos adequadas como tradução principal aqui.
- issue: Relação lógica do particípio δεξαμένη
  choice: pois acolheu
  alternative: tendo acolhido; depois de acolher
  rationale: O particípio pode ser entendido como circunstancial, com provável nuance causal, sem que o grego explicite uma conjunção. O texto principal comunica a ligação natural entre a fé de Raabe, seu acolhimento dos espias e sua preservação; a nota conserva a formulação menos interpretativa.
- issue: Alcance de ἀπειθήσασιν
  choice: desobedientes
  alternative: os que não creram
  rationale: ἀπειθέω pode envolver incredulidade e desobediência. “Desobedientes” preserva melhor o componente volitivo e moral sem excluir a falta de fé.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem segue de perto o grego, mas a pontuação e a ligação por “pois” dão fluidez natural. “Prostituta” evita o arcaísmo de “meretriz”; “espias” conserva o vocabulário bíblico reconhecível.
