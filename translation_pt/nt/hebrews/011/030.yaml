id: HEB.11.30
reference: Hebrews 11:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: pt
  text: Pela fé, as muralhas de Jericó caíram, depois de terem sido rodeadas durante sete dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por meio da fé”. O dativo grego πίστει pode expressar meio ou modo; o texto principal preserva a fórmula característica de Hebreus 11.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo singular de πίστις pode indicar meio ou modo. “Pela fé” preserva a fórmula recorrente de Hebreus 11, sem definir de maneira excessivamente rígida a nuance gramatical.
- source_word: τὰ τείχη
  choice: as muralhas
  rationale: τεῖχος designa especialmente a muralha defensiva de uma cidade. “Muralhas” é natural e mais preciso no contexto de Jericó.
- source_word: Ἰεριχὼ
  choice: de Jericó
  rationale: O nome próprio identifica a cidade à qual pertenciam as muralhas; a forma portuguesa consagrada é “Jericó”.
- source_word: ἔπεσαν
  choice: caíram
  rationale: O aoristo de πίπτω significa diretamente “caíram”. Evita-se “desmoronaram”, que acrescentaria uma especificidade não expressa pelo verbo grego.
- source_word: κυκλωθέντα
  choice: depois de terem sido rodeadas
  rationale: O particípio aoristo passivo de κυκλόω apresenta as muralhas como tendo sido circundadas antes de caírem. A tradução conserva a voz passiva e não introduz explicitamente os agentes.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: durante sete dias
  rationale: ἐπί com acusativo temporal indica duração ou extensão no tempo. “Durante sete dias” expressa isso de modo claro e natural em português.
theological_decisions:
- issue: Tradução de πίστις em Hebreus 11:30
  choice: fé
  alternative: fidelidade; confiança
  rationale: A fórmula repetida em Hebreus 11 e o contexto dos exemplos apresentados favorecem “fé”. As alternativas poderiam salientar aspectos legítimos do campo semântico, mas não são exigidas neste versículo.
- issue: Nuance do dativo πίστει
  choice: Pela fé
  alternative: Por meio da fé
  rationale: “Pela fé” mantém a ambiguidade possível entre meio e modo e preserva a cadência característica do capítulo; “por meio da fé” tornaria o sentido instrumental mais explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Muralhas” é preferível a “muros” no contexto de fortificações urbanas; “rodeadas” conserva a passividade e evita importar detalhes narrativos além do texto grego.
