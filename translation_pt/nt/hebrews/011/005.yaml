  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: pt
  text: Pela fé, Enoque foi levado para não ver a morte[a], e não foi encontrado, porque Deus o havia levado. Pois, antes de ser levado, recebeu o testemunho de que havia agradado a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passar pela morte” ou “experimentar a morte”. A expressão “ver a morte” reproduz o modo de dizer do grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: Mantém a tradução habitual de πίστις e expressa o valor instrumental ou modal do dativo no contexto dos exemplos de Hebreus 11.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: foi levado / o havia levado / ser levado
  rationale: Traduz de modo claro e coerente a mesma família lexical, preservando a ação divina e a voz passiva sem acrescentar um destino ou mecanismo que o versículo não explicita.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: para não ver a morte
  rationale: Preserva a expressão grega «ver a morte» e entende a construção infinitiva como finalidade ou resultado, sem eliminar a textura idiomática do original.
- source_word: οὐχ ηὑρίσκετο
  choice: não foi encontrado
  rationale: Reproduz diretamente a forma passiva e deixa implícito, como no grego, quem o procurava.
- source_word: μεμαρτύρηται
  choice: recebeu testemunho
  rationale: Expressa o passivo de μαρτυρέω de maneira natural em português e evita restringir o sentido a mero elogio, embora o testemunho seja favorável.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: de que havia agradado a Deus
  rationale: Comunica a anterioridade indicada pelo infinitivo perfeito e se encaixa naturalmente após «recebeu testemunho».
theological_decisions:
- issue: Sentido da linguagem de μετατίθημι aplicada a Enoque
  choice: «foi levado», sem especificar para onde nem explicar o modo
  alternative: «foi levado ao céu» ou o tradicional «foi trasladado»
  rationale: O texto afirma que Deus retirou Enoque para que ele não visse a morte, mas não explicita neste versículo o destino ou o mecanismo; a tradução evita acrescentar uma formulação doutrinária.
- issue: Força da expressão «ver a morte»
  choice: Preservar o idioma no texto principal
  alternative: Traduzir interpretativamente como «passar pela morte» ou «experimentar a morte»
  rationale: A expressão é compreensível em português e conserva a forma marcante do original; a nota esclarece seu sentido idiomático.
- issue: Natureza do testemunho sobre Enoque
  choice: «recebeu testemunho de que havia agradado a Deus»
  alternative: «foi elogiado por ter agradado a Deus»
  rationale: «Recebeu testemunho» preserva melhor a amplitude de μαρτυρέω e sua ligação com o testemunho bíblico, sem excluir o caráter favorável da declaração.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «levado» é intencional para refletir a repetição da mesma família lexical grega. O ponto e vírgula organiza o período longo sem alterar sua relação lógica.
