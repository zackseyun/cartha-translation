source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: pt
  text: Pela fé, ele celebrou a Páscoa e fez a aspersão do sangue[a], para que o destruidor não tocasse os seus primogênitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a aplicação do sangue”. O termo grego indica a colocação ritual do sangue; “aspersão” é a tradução ritual tradicional, enquanto “aplicação” pode refletir mais especificamente o contexto da Páscoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: Expressa o dativo de meio e mantém a fórmula recorrente de Hebreus 11 em português natural.
- source_word: πεποίηκεν
  choice: celebrou
  rationale: No contexto, ποιέω se refere à realização da Páscoa. “Celebrou” comunica de modo natural a observância da festa sem especificar apenas a refeição; o perfeito grego é vertido pelo pretérito perfeito, forma idiomática na narrativa em português.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Preserva a amplitude do termo, que pode abranger a celebração e seus ritos, sem restringi-lo à refeição pascal.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: a aspersão do sangue
  rationale: “Aspersão” é a expressão ritual tradicional e inteligível; como πρόσχυσις também pode indicar a aplicação do sangue, especialmente no cenário de Êxodo 12, essa alternativa é registrada em nota.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Reproduz com naturalidade a finalidade expressa pela oração com ἵνα e o subjuntivo.
- source_word: ὁ ὀλοθρεύων
  choice: o destruidor
  rationale: Traduz o particípio substantivado sem acrescentar “anjo”, identificação que não aparece explicitamente no grego.
- source_word: τὰ πρωτότοκα
  choice: os primogênitos
  rationale: Equivalente português amplo para o adjetivo neutro plural substantivado, sem acrescentar “filhos” ou “crianças”.
- source_word: θίγῃ
  choice: tocasse
  rationale: Conserva o sentido lexical de “tocar” e a alusão ao relato do Êxodo, sem explicitar como “ferir” o resultado destrutivo implícito no contexto.
- source_word: αὐτῶν
  choice: neles
  rationale: Mantém a referência pronominal concisa aos integrantes do povo, sem inserir um substantivo ausente do texto.
theological_decisions:
- issue: Identidade do sujeito implícito de πεποίηκεν
  choice: ele, referindo-se a Moisés
  alternative: Moisés, explicitado no texto
  rationale: O contexto de Hebreus 11:23–29 identifica Moisés, mas o pronome preserva a forma concisa do grego sem introduzir novamente seu nome.
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança ou fidelidade
  rationale: O tema reiterado de Hebreus 11 favorece claramente “fé”; “fidelidade” deslocaria o foco sem apoio contextual suficiente.
- issue: Identidade de ὁ ὀλοθρεύων
  choice: o destruidor
  alternative: o anjo destruidor
  rationale: A tradução evita identificar explicitamente a figura como anjo, pois essa palavra não consta do texto grego.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A estrutura conserva a fórmula repetida “Pela fé”, a referência pronominal a Moisés e a ambiguidade lexical da colocação ritual do sangue por meio de nota.
