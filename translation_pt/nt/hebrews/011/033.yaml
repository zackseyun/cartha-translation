  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: pt
  text: os quais, pela fé, conquistaram reinos, praticaram a justiça[a], alcançaram promessas e fecharam a boca de leões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fizeram o que é justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: pela fé
  rationale: Expressa de modo natural em português o meio pelo qual agiram, preservando πίστις como “fé” e o tema dominante do capítulo.
- source_word: κατηγωνίσαντο βασιλείας
  choice: conquistaram reinos
  rationale: Mantém a força militar e política do verbo, bem como o sentido concreto de βασιλείας.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: praticaram a justiça
  rationale: “Praticaram” comunica ação habitual ou efetiva com naturalidade; “justiça” conserva a amplitude moral e também judicial de δικαιοσύνη.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: alcançaram promessas
  rationale: Segue de perto a formulação grega sem especificar indevidamente se houve recebimento integral ou parcial de tudo o que fora prometido.
- source_word: ἔφραξαν στόματα λεόντων
  choice: fecharam a boca de leões
  rationale: Preserva a imagem vívida do original e soa natural em português, sem explicitar a provável alusão a Daniel.
theological_decisions:
- issue: Sentido de πίστις no catálogo de Hebreus 11
  choice: fé
  alternative: confiança; fidelidade
  rationale: Neste contexto, o termo descreve a resposta confiante a Deus pela qual essas pessoas agiram. “Fé” preserva o eixo lexical e teológico do capítulo sem excluir a noção de confiança.
- issue: Amplitude de δικαιοσύνη
  choice: justiça
  alternative: o que é justo; retidão
  rationale: O termo pode abranger conduta reta e ação justa. “Justiça” mantém essa amplitude, e a nota registra uma formulação alternativa mais explícita.
- issue: Relação entre alcançar promessas e a tensão de Hebreus 11:39
  choice: alcançaram promessas
  alternative: receberam o que havia sido prometido
  rationale: A formulação escolhida não afirma que todas as promessas tenham sido plenamente cumpridas para cada personagem, preservando a tensão interna do capítulo.
translation_notes:
  register: Português moderno, claro e digno, com cadência de enumeração. “Boca” permanece no singular coletivo, construção natural em português, embora o grego tenha “bocas” no plural.
