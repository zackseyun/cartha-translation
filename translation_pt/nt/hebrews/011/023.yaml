id: HEB.11.23
reference: Hebrews 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: pt
  text: Pela fé, Moisés, ao nascer, foi escondido durante três meses por seus pais, porque viram que o menino era belo[a] e não tiveram medo do decreto do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “formoso”, “excelente” ou “notável”. O termo grego ecoa Êxodo 2:2 e Atos 7:20.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Pela fé
  rationale: Expressa naturalmente em português o dativo de meio ou instrumento e preserva o motivo recorrente de Hebreus 11.
- source_word: γεννηθεὶς
  choice: ao nascer
  rationale: Traduz o particípio aoristo passivo com valor temporal de modo conciso e natural.
- source_word: ἐκρύβη τρίμηνον
  choice: foi escondido durante três meses
  rationale: Preserva a voz passiva e torna explícita, em português idiomático, a duração.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: por seus pais
  rationale: Embora πατέρων possa significar literalmente 'pais' no masculino, neste contexto designa coletivamente o pai e a mãe de Moisés.
- source_word: ἀστεῖον τὸ παιδίον
  choice: o menino era belo
  rationale: ἀστεῖος admite sentidos como belo, formoso, excelente ou notável. 'Belo' é direto, digno e mantém aberta a nuance exata.
- source_word: οὐκ ἐφοβήθησαν
  choice: não tiveram medo
  rationale: Forma corrente em português que preserva o contraste entre fé e medo.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: o decreto do rei
  rationale: διάταγμα indica uma ordem oficial; 'decreto' comunica com clareza seu caráter régio e formal.
theological_decisions:
- issue: Motivação dos pais para esconder Moisés
  choice: A ação inteira é apresentada como decorrente da fé; o texto também menciona que eles viram que o menino era belo e que não temeram o decreto real.
  alternative: Entender a beleza como a única motivação ou como um sinal divino explícito.
  rationale: A tradução conserva os elementos coordenados pelo texto sem afirmar que a aparência de Moisés constituía necessariamente um sinal sobrenatural.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O registro é digno sem ser arcaico; 'decreto' foi preferido a 'edito' por ser mais corrente.
