source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: pt
  text: E, se estivessem se lembrando daquela terra da qual haviam saído[a], teriam tido oportunidade de voltar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “daquela pátria” ou “daquele país”. O grego aponta para o lugar terreno que eles haviam deixado.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: estivessem pensando
  rationale: No contexto da condição irreal, o presente grego descreve uma atenção mental contínua. Esta formulação portuguesa é natural e não reduz o sentido a simples nostalgia.
- source_word: ἐκείνης
  choice: naquela terra
  rationale: O demonstrativo feminino retoma a pátria ou terra terrena mencionada no contexto. “Terra” mantém o sentido espacial sem conotação política excessiva.
- source_word: ἀφ’ ἧς
  choice: da qual
  rationale: Reproduz de modo claro e natural a relação de origem expressa pela preposição e pelo pronome relativo.
- source_word: ἐξέβησαν
  choice: haviam saído
  rationale: Preserva a ideia concreta de sair de um lugar e situa a partida antes da condição considerada.
- source_word: εἶχον ἂν
  choice: teriam tido
  rationale: Expressa naturalmente em português o resultado potencial de uma condição contrária ao fato.
- source_word: καιρὸν
  choice: oportunidade
  rationale: Aqui designa ocasião ou possibilidade adequada, não apenas duração cronológica.
- source_word: ἀνακάμψαι
  choice: voltar
  rationale: Comunica de maneira simples e idiomática a ideia de retornar ao lugar anterior.
- source_word: καὶ εἰ μὲν
  choice: E, se
  rationale: Mantém a ligação com o argumento anterior; μέν exerce função estrutural leve e não requer equivalente lexical independente.
theological_decisions:
- issue: Natureza da terra de que se lembrariam
  choice: Uma pátria terrena concreta que haviam deixado
  alternative: Uma referência generalizada ao antigo modo de vida
  rationale: Hebreus 11:13–16 contrapõe a terra de origem dos patriarcas à pátria melhor, celestial. A tradução conserva a linguagem espacial sem alegorizá-la.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Estivessem pensando” representa naturalmente o aspecto contínuo no contexto contrafactual; “haviam saído” e “teriam tido” deixam clara a sequência temporal.
