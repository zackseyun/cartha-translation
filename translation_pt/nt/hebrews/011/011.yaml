source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: pt
  text: Pela fé, até a própria Sara recebeu poder para conceber descendência[a], mesmo depois de ter passado da idade, porque considerou fiel aquele que havia prometido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para a colocação de semente”. A expressão grega é incomum e idiomática; neste contexto, refere-se à capacidade de gerar descendência.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou instrumento na fórmula recorrente de Hebreus 11; “pela fé” é natural e preserva o termo teológico sem explicá-lo além do texto.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: até a própria Sara
  rationale: καί, unido ao pronome intensivo αὐτῇ, destaca Sara como exemplo adicional e enfático; “até a própria Sara” comunica essa força.
- source_word: δύναμιν ... ἔλαβεν
  choice: recebeu poder
  rationale: Mantém de modo claro o valor lexical de δύναμις e a construção ativa do grego.
- source_word: εἰς καταβολὴν σπέρματος
  choice: para conceber descendência
  rationale: A expressão grega é incomum e idiomática. No contexto, indica a capacidade de gerar descendência; a formulação portuguesa mantém Sara como sujeito e evita uma imagem masculina inadequada no texto principal.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: mesmo além do tempo apropriado da vida
  rationale: παρά com acusativo indica ultrapassar um limite, enquanto καιρός denota o tempo oportuno e ἡλικία, a idade ou etapa da vida. A versão preserva essa generalidade sem explicitar mais do que o grego.
- source_word: ἐπεὶ
  choice: porque
  rationale: Introduz claramente a razão pela qual Sara recebeu poder.
- source_word: πιστὸν
  choice: fiel
  rationale: Expressa o caráter digno de confiança daquele que prometeu e preserva a ressonância teológica do termo.
- source_word: ἡγήσατο
  choice: considerou
  rationale: Reproduz naturalmente o sentido de avaliação ou juízo de ἡγέομαι.
- source_word: τὸν ἐπαγγειλάμενον
  choice: aquele que havia prometido
  rationale: Traduz o particípio substantivado com clareza e mantém a referência implícita a Deus, sem inserir seu nome no texto.
theological_decisions:
- issue: O sujeito e o sentido da ação de Sara em uma oração sintaticamente difícil
  choice: 'Sara é o sujeito: ela recebeu poder para conceber descendência.'
  alternative: Abraão está implicitamente envolvido ou é primário; ou Sara recebeu poder para estabelecer uma linhagem.
  rationale: Nesta forma do texto grego, αὐτῇ Σάρρᾳ identifica mais naturalmente Sara como sujeito de ἔλαβεν. Embora a expressão literal καταβολὴ σπέρματος possa soar associada ao papel masculino, o contexto trata da capacidade milagrosa de Sara gerar descendência apesar da idade. A tradução conserva essa leitura e registra a expressão literal em nota.
- issue: Tradução de πιστός aplicado a Deus
  choice: fiel
  alternative: digno de confiança; confiável
  rationale: “Fiel” preserva tanto a confiabilidade de quem prometeu quanto o peso teológico do termo, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura mantém a ênfase em Sara e conserva a tensão da expressão grega incomum por meio de nota textual.
