id: HEB.11.7
reference: Hebrews 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: pt
  text: Pela fé, Noé, tendo sido advertido[a] a respeito de coisas que ainda não se viam, movido por temor reverente[b], construiu uma arca para a salvação dos de sua casa. Por meio dela[c], condenou o mundo e tornou-se herdeiro da justiça que é segundo a fé[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo recebido instrução divina” ou “tendo recebido uma advertência divina”. O verbo pode indicar uma comunicação recebida de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “movido por temor de Deus” ou “agindo com reverência”.
    reason: lexical_alternative
  - marker: c
    text: “Por meio dela” refere-se mais naturalmente à arca; alguns entendem a expressão de modo mais amplo, como referência à fé de Noé ou à sua resposta obediente.
    reason: alternative_reading
  - marker: d
    text: O termo também pode ser expresso como “retidão” ou “condição de justo”; aqui, “justiça” preserva a amplitude do termo grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: Expressa o dativo de meio e preserva a fórmula recorrente de Hebreus 11.
- source_word: χρηματισθεὶς
  choice: tendo sido advertido
  rationale: O particípio passivo indica o recebimento de uma comunicação ou advertência divina; a redação principal preserva a agência implícita no grego sem inserir explicitamente “por Deus”.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: a respeito de coisas que ainda não se viam
  rationale: Mantém a referência às realidades futuras ainda não visíveis e reproduz a força temporal de μηδέπω.
- source_word: εὐλαβηθεὶς
  choice: movido por temor reverente
  rationale: Comunica uma reação de temor piedoso e reverência, e não mero pavor.
- source_word: κατεσκεύασεν
  choice: construiu
  rationale: Verbo natural e preciso para a fabricação deliberada da arca.
- source_word: κιβωτὸν
  choice: uma arca
  rationale: Equivalente consagrado e contextualmente inequívoco na narrativa de Noé.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: para a salvação dos de sua casa
  rationale: Preserva o substantivo σωτηρία e traduz οἶκος no sentido coletivo de casa ou grupo doméstico, sem restringi-lo indevidamente à família nuclear.
- source_word: δι’ ἧς
  choice: Por meio dela
  rationale: O pronome feminino remete mais naturalmente à arca, seu antecedente gramatical mais próximo, sem tornar a construção pesada.
- source_word: κατέκρινεν τὸν κόσμον
  choice: condenou o mundo
  rationale: Tradução direta que mantém a força judicial do verbo e a função condenatória da obediência de Noé.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: da justiça que é segundo a fé
  rationale: Preserva a formulação deliberadamente relacional de κατά e evita reduzi-la à expressão interpretativa “justiça pela fé”.
- source_word: ἐγένετο κληρονόμος
  choice: tornou-se herdeiro
  rationale: Expressa de modo natural o estado resultante indicado pelo verbo e pelo predicativo.
theological_decisions:
- issue: Sentido de χρηματισθεὶς e identificação da fonte da advertência
  choice: tendo sido advertido
  alternative: tendo recebido instrução divina; tendo recebido uma advertência divina
  rationale: O uso do verbo frequentemente pressupõe comunicação divina, e o contexto de Noé confirma isso; contudo, o agente não é nomeado na frase grega, por isso permanece implícito no texto principal e é esclarecido em nota.
- issue: Nuance de εὐλαβηθεὶς
  choice: movido por temor reverente
  alternative: movido por temor de Deus; agindo com reverência
  rationale: A escolha mantém juntas as ideias de temor, cautela e reverência piedosa, sem reduzir a reação de Noé a simples medo.
- issue: Antecedente de δι’ ἧς
  choice: a arca
  alternative: a fé de Noé ou sua resposta obediente
  rationale: O gênero feminino e a proximidade sintática apontam naturalmente para κιβωτός, embora o contexto permita que alguns entendam a expressão de modo mais amplo.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão; condição de justo
  rationale: “Justiça” é o equivalente português tradicional e semanticamente amplo; a nota preserva o possível matiz de condição ou conduta justa sem impor uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Os de sua casa” conserva o alcance coletivo de οἶκος; “temor reverente” mantém a tensão entre medo e piedade. A divisão em duas frases melhora a leitura sem alterar a relação lógica do período grego.
