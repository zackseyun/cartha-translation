id: HEB.11.12
reference: Hebrews 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: pt
  text: Por isso, de um só homem[a] — e este já como morto — nasceram descendentes tão numerosos como as estrelas do céu e incontáveis como a areia à beira-mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “de um só, e este já como morto”. A expressão se refere a Abraão, que já havia passado da idade normal de gerar filhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa naturalmente a conclusão inferida do versículo anterior e mantém a ligação lógica.
- source_word: ἀφ’ ἑνὸς
  choice: de um só homem
  rationale: O masculino singular e o contexto apontam para Abraão; “um só homem” explicita o referente sem introduzir conteúdo estranho ao texto.
- source_word: ἐγεννήθησαν
  choice: nasceram descendentes
  rationale: Torna explícito o sujeito implícito pelo contexto e comunica de modo natural o surgimento da descendência, evitando o arcaísmo de “foram gerados”.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: e este já como morto
  rationale: Preserva a imagem forte do grego, entendida no contexto como referência à condição reprodutiva de Abraão em idade avançada, não à morte literal.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: tão numerosos como as estrelas do céu
  rationale: Mantém tanto a comparação quanto a ideia explícita de grande quantidade em português corrente.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: incontáveis como a areia à beira-mar
  rationale: “À beira-mar” traduz idiomaticamente a imagem literal da borda do mar, e “incontáveis” preserva a impossibilidade de contar.
theological_decisions:
- issue: Referente de ἀφ’ ἑνὸς
  choice: Explicitar Abraão como “um só homem” no texto e registrar em nota a forma mais literal.
  alternative: “de um só”, mantendo implícito o referente.
  rationale: O gênero gramatical e o contexto identificam Abraão, mas a nota preserva para o leitor a concisão e a leve ambiguidade formal do original.
- issue: Sentido de νενεκρωμένου
  choice: Traduzir metaforicamente como “já como morto”.
  alternative: “tendo sido amortecido” ou uma leitura de morte literal.
  rationale: O perfeito passivo descreve a condição de Abraão em relação à geração de filhos por causa da idade; a formulação conserva a tensão da metáfora sem sugerir que ele estivesse literalmente morto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo elevado das estrelas e da areia, enquanto o travessão destaca a observação parentética do grego.
