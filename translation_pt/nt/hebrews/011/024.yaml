  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: pt
  text: Pela fé, Moisés[a], quando já era adulto, recusou ser chamado filho da filha do faraó,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Pela fidelidade” ou “Pela confiança”; grego πίστει. Aqui, o texto principal segue a fórmula recorrente do capítulo: “Pela fé”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: O dativo expressa meio ou instrumento; em Hebreus 11, a fórmula recorrente πίστει é traduzida de modo natural e coerente por “pela fé”.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: μέγας γενόμενος
  choice: quando já era adulto
  rationale: A expressão participial indica que Moisés havia atingido a maturidade, não que se tornara grande em posição ou prestígio.
- source_word: ἠρνήσατο
  choice: recusou
  rationale: Neste contexto, o verbo indica a rejeição deliberada de uma designação ou identidade.
- source_word: λέγεσθαι
  choice: ser chamado
  rationale: Reproduz diretamente o infinitivo passivo e é idiomático em português.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: filho da filha do faraó
  rationale: Expressa a identidade específica atribuída a Moisés; o português dispensa o artigo antes do predicativo após “ser chamado”.
- source_word: Φαραώ
  choice: faraó
  rationale: Forma portuguesa consagrada do título egípcio; usa-se inicial minúscula por funcionar aqui como título.
theological_decisions:
- issue: Tradução de πίστις na fórmula recorrente de Hebreus 11
  choice: fé
  alternative: fidelidade; confiança
  rationale: A construção e o refrão do capítulo favorecem “pela fé”. As possibilidades lexicais “pela fidelidade” e “pela confiança” são preservadas em nota sem eliminar a amplitude do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quando já era adulto” comunica a maturidade de Moisés com naturalidade e evita a leitura equivocada de grandeza social.
