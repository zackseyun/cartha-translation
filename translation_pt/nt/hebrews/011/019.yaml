  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: pt
  text: Ele considerou que Deus é capaz até de ressuscitar dentre os mortos; por isso[a], também o recebeu de volta, em sentido figurado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de onde”.
    reason: alternativa lexical para ὅθεν
  - marker: b
    text: Ou “como numa parábola”. A ideia é que Abraão recebeu Isaque de volta como se ele tivesse voltado da morte, não por uma ressurreição literal.
    reason: alternativa lexical e esclarecimento da expressão ἐν παραβολῇ
lexical_decisions:
- source_word: λογισάμενος
  choice: Ele considerou
  rationale: Expressa o raciocínio deliberado de Abraão em português natural. Embora o grego use um particípio aoristo, a forma finita comunica com clareza sua ação mental no contexto.
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: até de ressuscitar dentre os mortos
  rationale: “Até” preserva a força intensificadora de καί, e “ressuscitar dentre os mortos” transmite de modo idiomático a linguagem de ressurreição.
- source_word: δυνατὸς ὁ θεός
  choice: Deus é capaz
  rationale: Mantém a predicação presente do grego e apresenta a capacidade de Deus como verdade vigente, sem transformá-la apenas numa convicção passada.
- source_word: ὅθεν
  choice: por isso
  rationale: Neste contexto, o advérbio introduz naturalmente a consequência do raciocínio de Abraão. A nota registra a leitura relativa mais literal.
- source_word: ἐκομίσατο
  choice: o recebeu de volta
  rationale: O verbo médio, no contexto do quase sacrifício, indica que Abraão recuperou Isaque; “recebeu de volta” é claro sem acrescentar uma ressurreição literal.
- source_word: ἐν παραβολῇ
  choice: em sentido figurado
  rationale: Comunica que Abraão recebeu Isaque como se este voltasse da morte, preservando o caráter analógico da expressão sem impor uma tipologia específica.
theological_decisions:
- issue: Natureza do recebimento de Isaque de volta
  choice: Abraão recebeu Isaque de volta em sentido figurado, como numa volta da morte, e não por uma ressurreição efetiva.
  alternative: Traduzir ἐν παραβολῇ como “em parábola”, ressaltando uma possível dimensão tipológica.
  rationale: A expressão grega apresenta o acontecimento como analogia ou figura. A tradução evita afirmar qual seria todo o alcance tipológico e mantém a tensão teológica do texto.
- issue: Força de ὅθεν
  choice: 'Entender ὅθεν de modo inferencial: “por isso”.'
  alternative: 'Entendê-lo de modo relativo ou locativo: “de onde”.'
  rationale: O sentido inferencial liga com naturalidade a convicção de Abraão ao fato de ter recebido Isaque de volta; a alternativa permanece possível e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência, mantendo a intensificação de καί, a linguagem de ressurreição e a ambiguidade relevante de ὅθεν em nota.
