source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: pt
  text: apagaram a força do fogo, escaparam do fio da espada, da fraqueza receberam força, tornaram-se poderosos na batalha e puseram em fuga exércitos estrangeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: apagaram a força do fogo
  rationale: Preserva tanto o sentido concreto de σβέννυμι, “apagar”, quanto δύναμις, a força ou o poder destrutivo do fogo, sem reduzir a expressão simplesmente a “apagaram o fogo”.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: escaparam do fio da espada
  rationale: ἔφυγον indica aqui escape bem-sucedido. Embora στόματα seja literalmente “bocas”, a expressão idiomática designa o fio cortante da espada; “fio da espada” é a formulação natural em português.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: da fraqueza receberam força
  rationale: 'A formulação conserva a origem marcada por ἀπό e torna perceptível o valor passivo de ἐδυναμώθησαν: a força foi recebida, não meramente produzida pelos próprios sujeitos.'
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: tornaram-se poderosos na batalha
  rationale: “Tornaram-se” expressa a entrada em um novo estado; “poderosos” evita repetição imediata de “força”, e “na batalha” comunica naturalmente o contexto militar de πόλεμος.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: puseram em fuga exércitos estrangeiros
  rationale: παρεμβολή significa literalmente acampamento, mas pode designar metonimicamente a força militar acampada. No contexto, ἔκλιναν descreve fazê-la recuar; a expressão portuguesa transmite claramente a derrota e retirada das forças inimigas.
theological_decisions:
- issue: Grau de literalidade na sequência de livramentos e vitórias atribuídos à fé
  choice: Manter as imagens históricas e militares concretas
  alternative: Generalizar a passagem como vitória sobre perigos e inimigos espirituais
  rationale: O texto enumera fogo, espada, fraqueza, batalha e exércitos. Preservar essas imagens evita impor uma espiritualização ausente do grego e mantém aberta a relação da passagem com diversos episódios da história de Israel.
- issue: Agente implícito no fortalecimento
  choice: Usar “receberam força”, preservando a passividade sem identificar expressamente o agente
  alternative: Dizer “Deus lhes deu força” ou apenas “ficaram fortes”
  rationale: A forma passiva ἐδυναμώθησαν sugere força recebida, mas não nomeia gramaticalmente o agente. A tradução não deve acrescentar “Deus” ao texto nem apagar a nuance passiva.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A cadência paralela da enumeração foi preservada. Não se acrescentaram notas porque as escolhas idiomáticas “fio da espada” e “exércitos” comunicam adequadamente o sentido no corpo do texto sem perda relevante que exija explicação editorial.
