  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: pt
  text: Pois os que dizem tais coisas deixam claro que estão buscando uma pátria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu próprio país” ou “sua terra natal”. O versículo seguinte esclarece que a pátria esperada é, em última análise, celestial.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o versículo anterior de modo natural e digno em português.
- source_word: τοιαῦτα
  choice: tais coisas
  rationale: Retoma de maneira concisa e idiomática as declarações mencionadas no contexto anterior.
- source_word: λέγοντες
  choice: os que dizem
  rationale: Converte o particípio presente substantivado em oração relativa natural, preservando seu sentido geral e contínuo.
- source_word: ἐμφανίζουσιν
  choice: deixam claro
  rationale: Expressa o ato de tornar algo evidente, inclusive a inferência extraída das palavras dessas pessoas.
- source_word: ὅτι
  choice: que
  rationale: Introduz naturalmente a oração que apresenta o conteúdo tornado evidente.
- source_word: πατρίδα
  choice: uma pátria
  rationale: Traduz o sentido de terra ou país ao qual alguém pertence por origem, preservando a forma indefinida do grego. Em português, “pátria” é corrente e adequada ao registro bíblico, embora outras formulações sejam possíveis.
- source_word: ἐπιζητοῦσιν
  choice: estão buscando
  rationale: Preserva tanto a ideia de procura intencional quanto o aspecto contínuo do presente grego.
theological_decisions:
- issue: Identidade da pátria buscada pelos patriarcas
  choice: uma pátria, sem qualificá-la no texto principal
  alternative: uma pátria terrena ou a pátria celestial
  rationale: O versículo declara apenas que buscavam uma pátria; o versículo seguinte esclarece que a pátria esperada é, em última análise, celestial. A tradução evita antecipar essa explicação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural para brasileiros. A formulação mantém um tom digno, usa sintaxe clara e preserva a progressão argumentativa do contexto.
