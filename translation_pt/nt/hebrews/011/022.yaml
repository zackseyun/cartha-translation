source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: pt
  text: Pela fé, José, ao se aproximar do fim da vida,[a] mencionou a saída[b] dos filhos de Israel e deu instruções a respeito de seus ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando estava morrendo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o êxodo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Pela fé
  rationale: 'Mantém o refrão característico de Hebreus 11 e entende o dativo em sentido instrumental: foi pela fé que José agiu.'
- source_word: τελευτῶν
  choice: ao se aproximar do fim da vida
  rationale: Expressa em português natural a ação simultânea do particípio, indicando que José falou no fim da vida, sem afirmar que já estivesse no instante exato da morte.
- source_word: περὶ τῆς ἐξόδου
  choice: sobre a saída
  rationale: Traduz diretamente o sentido de partida ou saída e, no contexto, aponta para a futura saída de Israel do Egito. A alternativa tradicional 'êxodo' é registrada em nota.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva a formulação familiar explícita do grego, em vez de reduzi-la simplesmente a 'israelitas'.
- source_word: ἐμνημόνευσεν
  choice: falou
  rationale: Com περί, o verbo significa mencionar ou falar a respeito de algo, não apenas lembrar interiormente.
- source_word: ἐνετείλατο
  choice: deu instruções
  rationale: Comunica com clareza moderna o ato de ordenar ou determinar algo, sem enfraquecer o caráter intencional da orientação de José.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: a respeito de seus ossos
  rationale: Conserva o termo concreto 'ossos', que remete ao pedido de José de que fossem levados do Egito.
theological_decisions:
- issue: Sentido de πίστις em Hebreus 11
  choice: fé
  alternative: fidelidade; confiança
  rationale: A fórmula repetida ao longo do capítulo favorece 'fé' como a qualidade pela qual José agiu, sem importar uma leitura denominacional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada naturalmente ao português, e os termos concretos e familiares do grego foram preservados.
