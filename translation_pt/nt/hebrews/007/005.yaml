id: HEB.7.5
reference: Hebrews 7:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: pt
  text: E os que, dentre os filhos de Levi, recebem o sacerdócio têm, segundo a Lei, o mandamento de recolher do povo a décima parte — isto é, de seus irmãos[a] —, embora estes também tenham saído dos lombos de Abraão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seus compatriotas israelitas”. O grego diz literalmente “de seus irmãos”, usando linguagem masculina de parentesco para os demais membros do povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam descendentes de Abraão”. Literalmente, “tenham saído dos lombos de Abraão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: os que, dentre os filhos de Levi
  rationale: Preserva o sentido partitivo de ἐκ e a linguagem de descendência, deixando claro que se trata dos membros da linhagem de Levi que exercem o sacerdócio, e não indistintamente de todos os levitas.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: recebem o sacerdócio
  rationale: Mantém a ideia de receber uma função ou condição, sem sugerir que ela foi assumida por iniciativa própria.
- source_word: ἐντολὴν ἔχουσιν
  choice: têm ... o mandamento
  rationale: Conserva a construção nominal grega e a força legal e pactual de ἐντολή.
- source_word: ἀποδεκατοῦν τὸν λαὸν
  choice: recolher do povo a décima parte
  rationale: Explicita que os sacerdotes recebem a décima parte do povo, evitando a possível ambiguidade de 'dizimar', que em português pode ter outros sentidos.
- source_word: κατὰ τὸν νόμον
  choice: segundo a Lei
  rationale: Expressa a conformidade normativa indicada por κατά; a inicial maiúscula sinaliza, no contexto, a Lei de Moisés.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Reproduz de modo natural a explicação apostiva introduzida no grego.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: seus irmãos
  rationale: Mantém a linguagem masculina de parentesco do texto, sem ocultar que ela designa aqui os demais membros do povo de Israel.
- source_word: καίπερ
  choice: embora ... também
  rationale: Reproduz a concessão e preserva o destaque de que sacerdotes e povo compartilham a mesma ascendência.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: tenham saído dos lombos de Abraão
  rationale: Preserva a imagem corporal de descendência, relevante para o argumento de Hebreus 7, em vez de reduzi-la silenciosamente a uma paráfrase abstrata.
theological_decisions:
- issue: Linguagem de parentesco aplicada ao povo de Israel
  choice: seus irmãos
  alternative: seus compatriotas israelitas
  rationale: O grego emprega ἀδελφούς, termo masculino de parentesco, em sentido coletivo e pactual. O texto principal conserva essa forma, e a nota esclarece seu referente mais amplo.
- issue: Imagem corporal da descendência abraâmica
  choice: tenham saído dos lombos de Abraão
  alternative: sejam descendentes de Abraão
  rationale: A formulação concreta sustenta a lógica genealógica desenvolvida no capítulo e preserva a força retórica da expressão original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção partitiva e as imagens genealógicas foram preservadas sem sacrificar a naturalidade. Os travessões marcam a explicação parentética de τοῦτ’ ἔστιν.
