source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: pt
  text: Considerem como é grande este homem, a quem Abraão, o patriarca, deu a décima parte[a] dos despojos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o dízimo”. O grego diz literalmente “uma décima parte”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego pode designar despojos de guerra e talvez se refira à parte mais escolhida do saque.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Considerem
  rationale: O presente imperativo plural convoca os leitores a refletir atentamente; “Considerem” preserva com naturalidade essa força exortativa.
- source_word: δὲ
  choice: então
  rationale: Marca uma transição leve no desenvolvimento do argumento, sem exigir um contraste forte.
- source_word: πηλίκος
  choice: como ... era grande
  rationale: Expressa grandeza ou importância; a formulação mantém aberta a natureza exata dessa grandeza, que o contexto explica.
- source_word: οὗτος
  choice: este homem
  rationale: Retoma Melquisedeque, mencionado no contexto anterior; “homem” torna natural a referência masculina sem acrescentar uma identificação doutrinária.
- source_word: ᾧ
  choice: a ele
  rationale: Representa o pronome relativo no dativo como destinatário daquilo que Abraão deu; os dois-pontos reproduzem com clareza a relação explicativa.
- source_word: δεκάτην
  choice: a décima parte
  rationale: Traduz diretamente a ideia de um décimo e evita impor no texto principal possíveis associações institucionais posteriores de “dízimo”.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: ἔδωκεν
  choice: deu
  rationale: Equivalente simples e direto do aoristo de δίδωμι.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: dos despojos
  rationale: ἀκροθίνια designa despojos, especialmente de guerra, e pode sugerir a parte mais escolhida; “despojos” mantém o sentido básico sem tornar obrigatória essa nuance possível.
- source_word: ὁ πατριάρχης
  choice: o patriarca
  rationale: Preserva o título que destaca a posição ancestral de Abraão.
theological_decisions:
- issue: Referente e força avaliativa do versículo
  choice: O texto destaca a grandeza de Melquisedeque pelo fato de Abraão, chamado de patriarca, ter-lhe dado a décima parte.
  alternative: Explicitar que o recebimento da décima parte prova a superioridade de Melquisedeque sobre Abraão.
  rationale: Embora o argumento contextual aponte para uma posição superior, o versículo formula a ideia em termos da grandeza de Melquisedeque e do ato de Abraão; a tradução não explicita uma inferência teológica além do que está dito.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Considerem” dirige-se naturalmente à comunidade; “então” sinaliza a transição leve de δέ. A ordem da segunda oração realça o destinatário sem acrescentar o enfático “até”, que não aparece de modo explícito no grego.
