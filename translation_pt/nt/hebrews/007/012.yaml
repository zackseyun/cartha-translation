id: HEB.7.12
reference: Hebrews 7:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: pt
  text: Pois, quando há mudança de sacerdócio, necessariamente também há mudança de lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também há mudança da Lei”, referindo-se de modo explícito à Lei de Moisés, que estabeleceu o sacerdócio levítico.'
    reason: Leitura alternativa que explicita o referente contextual de νόμου.
lexical_decisions:
- source_word: μετατιθεμένης
  choice: quando há mudança
  rationale: O particípio genitivo absoluto indica a circunstância que fundamenta a conclusão. A formulação expressa com naturalidade a mudança de uma ordem sacerdotal para outra, sem reduzi-la a mera transferência administrativa.
- source_word: ἱερωσύνης
  choice: sacerdócio
  rationale: Designa a instituição ou ordem sacerdotal, e não apenas a atividade de um sacerdote individual.
- source_word: ἐξ ἀνάγκης
  choice: necessariamente
  rationale: 'Expressa a necessidade lógica: mudado o sacerdócio, segue-se uma mudança correspondente na lei.'
- source_word: νόμου
  choice: de lei
  rationale: A ausência de artigo no grego permite manter a expressão ligeiramente ampla, referindo-se à ordem legal que rege o sacerdócio, embora o contexto inclua naturalmente a Lei de Moisés.
- source_word: μετάθεσις
  choice: mudança
  rationale: Preserva o paralelo lexical e conceitual com μετατιθεμένης sem sugerir apenas deslocamento ou transferência.
- source_word: γίνεται
  choice: há
  rationale: Verte de modo natural a ocorrência ou efetivação da mudança resultante.
- source_word: καὶ
  choice: também
  rationale: Marca a mudança da lei como consequência adicional e necessária da mudança do sacerdócio.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do versículo em relação ao argumento anterior.
theological_decisions:
- issue: Alcance de νόμος em relação ao sacerdócio
  choice: de lei
  alternative: da Lei, com referência explícita à Lei de Moisés
  rationale: O contexto trata da estrutura legal mosaica que estabeleceu o sacerdócio levítico, mas o substantivo grego sem artigo permite uma formulação que destaque a ordem legal pertinente sem estreitar indevidamente a expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o tom argumentativo de Hebreus e preserva a possível amplitude de νόμου.
