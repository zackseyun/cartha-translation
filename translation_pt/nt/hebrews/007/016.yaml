  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: pt
  text: o qual se tornou sacerdote não segundo uma lei de um mandamento referente à carne[a], mas segundo o poder de uma vida indestrutível[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma exigência física” ou “de um mandamento corporal”. Aqui, “carne” não indica pecaminosidade, mas a esfera corporal e genealógica.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “de uma vida sem fim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: o qual
  rationale: Retoma a pessoa mencionada no contexto anterior e preserva a ligação sintática da oração relativa.
- source_word: οὐ κατὰ νόμον
  choice: não segundo a lei
  rationale: κατά com acusativo indica norma ou fundamento. Em português, a ausência de artigo no grego não exige o indefinido; 'segundo a lei de um mandamento' expressa com naturalidade o princípio legal em foco sem identificar explicitamente toda a Lei mosaica.
- source_word: ἐντολῆς σαρκίνης
  choice: de um mandamento referente à carne
  rationale: Mantém 'mandamento' e o vínculo lexical com σάρξ, enquanto 'referente à carne' evita que 'carnal' seja entendido como moralmente pecaminoso. No contexto, trata-se de uma exigência ligada à condição corporal e genealógica.
- source_word: γέγονεν
  choice: se tornou sacerdote
  rationale: O perfeito indica um estado presente resultante. 'Sacerdote' explicita o predicativo elíptico recuperado diretamente do contexto, produzindo uma frase portuguesa completa e natural.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: mas segundo o poder
  rationale: Preserva o paralelismo antitético entre as duas construções com κατά.
- source_word: ζωῆς ἀκαταλύτου
  choice: de uma vida indestrutível
  rationale: ἀκατάλυτος descreve aquilo que não pode ser desfeito, destruído ou levado ao fim; 'indestrutível' preserva maior amplitude que o tradicional 'sem fim'.
theological_decisions:
- issue: Sentido de σαρκίνης
  choice: '''referente à carne'', no sentido corporal ou genealógico'
  alternative: '''físico'', ''corporal'' ou ''carnal'''
  rationale: A expressão contrasta uma qualificação sacerdotal externa e ligada à descendência com o poder de uma vida indestrutível. Evita-se importar a ideia de pecaminosidade, que o termo não afirma aqui.
- issue: Sentido de ἀκαταλύτου
  choice: indestrutível
  alternative: sem fim
  rationale: '''Indestrutível'' comunica não apenas duração ilimitada, mas a impossibilidade de dissolução ou destruição, preservando a força lexical do grego.'
- issue: Predicativo elíptico de γέγονεν
  choice: explicitar 'sacerdote'
  alternative: traduzir apenas 'se tornou tal' ou 'veio a ser'
  rationale: O sacerdócio está inequivocamente em foco no contexto imediato. A explicitação evita uma formulação obscura em português sem definir além do que o contexto fornece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o contraste entre uma norma ligada à carne e o poder de uma vida que não pode ser destruída.
