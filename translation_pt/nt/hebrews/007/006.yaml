  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: pt
  text: Mas aquele cuja genealogia não é contada entre eles recebeu de Abraão a décima parte[a] e abençoou aquele que tinha as promessas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeu de Abraão o dízimo”. O verbo grego se refere a tomar ou receber a décima parte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquele que tem as promessas”. O grego emprega um particípio presente; “tinha” é mais natural aqui como referência narrativa a Abraão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Mas aquele cuja genealogia não deriva deles
  rationale: Expressa de modo natural o particípio passivo substantivado e a relação indicada por ἐξ αὐτῶν, mantendo o contraste genealógico com a linhagem levítica sem fazer afirmações sobre a origem ou a natureza de Melquisedeque.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: recebeu de Abraão a décima parte
  rationale: O verbo designa receber ou tomar um décimo. A formulação deixa claro que Abraão foi quem o entregou; o perfeito grego sustenta a relevância contínua do fato no argumento, embora o pretérito perfeito simples seja mais natural em português.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: aquele que tinha as promessas
  rationale: Preserva o plural 'promessas' e identifica Abraão de forma narrativa natural. A nota registra a possibilidade de refletir mais diretamente o particípio presente grego.
- source_word: εὐλόγηκεν
  choice: abençoou
  rationale: O pretérito perfeito simples relata naturalmente em português o ato concluído cuja importância permanece no argumento.
theological_decisions:
- issue: Contraste genealógico em relação ao sacerdócio levítico
  choice: A redação apresenta Melquisedeque como alguém cuja genealogia não deriva da linhagem levítica.
  alternative: “Aquele que não consta na genealogia deles” ou “aquele que não descende deles”.
  rationale: O contexto trata da legitimidade sacerdotal fora da genealogia levítica. A tradução preserva esse enfoque sem transformar a frase em uma afirmação metafísica sobre Melquisedeque.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Décima parte” explicita o valor sem depender do termo eclesiástico “dízimo”; a alternativa tradicional consta em nota.
