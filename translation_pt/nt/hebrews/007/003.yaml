  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: pt
  text: sem pai[a], sem mãe, sem genealogia, não tendo princípio de dias nem fim de vida, mas tendo sido feito semelhante ao Filho de Deus, permanece sacerdote para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem genealogia registrada”. O relato de Gênesis não registra a ascendência de Melquisedeque, e Hebreus usa esse silêncio de modo tipológico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “continuamente” ou “por todo o tempo”. A expressão enfatiza o caráter duradouro de seu sacerdócio na apresentação bíblica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος
  choice: sem pai, sem mãe, sem genealogia
  rationale: Preserva a tríade enfática e a simetria do grego. A nota esclarece que, no argumento de Hebreus, a descrição se apoia na ausência de registro genealógico em Gênesis.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: não tendo princípio de dias nem fim de vida
  rationale: Mantém a construção participial, o paralelismo e o tom elevado do original sem explicar além do que o texto afirma.
- source_word: ἀφωμοιωμένος
  choice: tendo sido feito semelhante
  rationale: Representa o particípio perfeito passivo e preserva tanto a ideia de semelhança duradoura quanto a distinção entre Melquisedeque e o Filho de Deus.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: ao Filho de Deus
  rationale: Emprega a forma cristológica consagrada e reproduz naturalmente o título definido.
- source_word: μένει ἱερεὺς
  choice: permanece sacerdote
  rationale: Expressa o estado contínuo indicado pelo presente de μένω; em português, o predicativo 'sacerdote' dispensa artigo.
- source_word: εἰς τὸ διηνεκές
  choice: para sempre
  rationale: Forma corrente, digna e clara para a duração contínua ou permanente expressa pela locução grega; a nota registra alternativas que destacam seu caráter duradouro.
theological_decisions:
- issue: Se Melquisedeque é descrito como literalmente sem pais e eterno ou conforme sua apresentação tipológica no relato bíblico
  choice: Preservar literalmente os qualificativos no texto e esclarecer em nota a leitura baseada no silêncio genealógico de Gênesis.
  alternative: Explicitar no corpo do versículo 'sem genealogia registrada' ou identificar Melquisedeque como uma manifestação pré-encarnada do Filho.
  rationale: O texto fundamenta a comparação na apresentação bíblica de Melquisedeque, enquanto ἀφωμοιωμένος indica que ele foi feito semelhante ao Filho, não que seja idêntico a ele. A tradução mantém a tensão sem impor uma conclusão ontológica.
- issue: Alcance temporal de εἰς τὸ διηνεκές
  choice: para sempre
  alternative: continuamente; por todo o tempo
  rationale: A expressão afirma o caráter permanente do sacerdócio na argumentação de Hebreus. A tradução conserva sua força, e a nota assinala equivalentes possíveis sem restringir indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo próximo ao grego. 'Princípio de dias' conserva a formulação elevada; 'tendo sido feito semelhante' mantém de modo natural a voz passiva e o aspecto resultante do perfeito.
