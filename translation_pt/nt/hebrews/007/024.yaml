  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: pt
  text: Mas ele, porque permanece para sempre, possui um sacerdócio permanente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “possui um sacerdócio imutável” ou “possui um sacerdócio intransferível”. O adjetivo grego pode expressar essas duas nuances; no contexto, a ideia é que, por viver para sempre, o sacerdócio dele não passa para outro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas ele
  rationale: O artigo substantivado retoma Jesus e δέ marca o contraste com os muitos sacerdotes mencionados no versículo anterior.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: porque permanece
  rationale: διά com infinitivo articular expressa causa; μένω indica continuidade de existência, em contraste com sacerdotes impedidos pela morte de continuar.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão idiomática temporal que comunica duração sem fim em português corrente.
- source_word: ἀπαράβατον
  choice: permanente
  rationale: O adjetivo pode indicar algo inalterável ou não transferível. No contexto, ressalta que o sacerdócio de Jesus não passa a um sucessor; a formulação principal é clara sem eliminar a ambiguidade, registrada na nota.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: possui um sacerdócio
  rationale: ἔχω indica posse ou conservação do ofício sacerdotal. “Possui” é natural e dignificado em português.
- source_word: ἱερωσύνην
  choice: sacerdócio
  rationale: O substantivo designa a condição ou o ofício sacerdotal; “sacerdócio” é a correspondência portuguesa estabelecida.
theological_decisions:
- issue: Sentido de ἀπαράβατον aplicado ao sacerdócio de Cristo
  choice: sacerdócio permanente
  alternative: sacerdócio imutável; sacerdócio intransferível
  rationale: A tradução principal destaca a permanência do ofício de Jesus por ele viver para sempre, acompanhando o contraste imediato com sacerdotes mortais e sucessivos. A nota preserva as nuances lexicais legítimas sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Mas ele” mantém o contraste discursivo; “para sempre” e “sacerdócio permanente” evitam rigidez excessiva, enquanto a nota conserva a ambiguidade do grego.
