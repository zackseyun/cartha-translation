source:
  edition: SBLGNT
  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: pt
  text: E isso é ainda mais evidente se surge outro sacerdote[a], segundo a semelhança de Melquisedeque[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sacerdote diferente”; o termo grego pode enfatizar distinção, e não apenas a chegada de mais um sacerdote.
    reason: lexical_alternative
  - marker: b
    text: A expressão “segundo a semelhança de Melquisedeque” retoma a linguagem e o argumento derivados do Salmo 110:4 ao longo deste capítulo.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: ainda mais
  rationale: Preserva a força intensificadora e progressiva da expressão comparativa em português natural.
- source_word: κατάδηλόν
  choice: evidente
  rationale: Expressa aquilo que é manifesto ou claro sem duplicar a intensificação já comunicada por “ainda mais”.
- source_word: εἰ
  choice: se
  rationale: Mantém a forma condicional do grego, sem decidir em favor do valor causal possível (“visto que”).
- source_word: κατὰ τὴν ὁμοιότητα
  choice: segundo a semelhança de
  rationale: Reflete de perto a construção grega e preserva a formulação importante para o argumento do capítulo.
- source_word: Μελχισέδεκ
  choice: Melquisedeque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀνίσταται
  choice: surge
  rationale: Comunica naturalmente o aparecimento de um sacerdote sem impor ao verbo um sentido explícito de ressurreição ou nomeação.
- source_word: ἱερεὺς ἕτερος
  choice: outro sacerdote
  rationale: É a formulação mais natural em português e mantém aberta a possibilidade de ἕτερος salientar distinção de natureza ou ordem.
theological_decisions:
- issue: Nuance de ἕτερος em relação ao sacerdócio
  choice: outro sacerdote
  alternative: um sacerdote diferente
  rationale: “Outro sacerdote” preserva a formulação direta e idiomática; a nota registra que o termo também pode destacar o contraste com a ordem sacerdotal anterior, sem tornar essa ênfase obrigatória no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção “isso é ainda mais evidente” acompanha ἐστιν de modo direto; “segundo a semelhança” conserva a precisão intertextual, embora tenha registro ligeiramente formal. Os marcadores foram posicionados junto aos termos que cada nota explica.
