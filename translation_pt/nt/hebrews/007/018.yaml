  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: pt
  text: Pois, de fato, o mandamento anterior[a] é revogado por causa de sua fraqueza e inutilidade[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mandamento precedente” ou “o mandamento que vinha antes”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ineficaz para levar à perfeição mencionada no contexto (ver Hebreus 7:19), e não uma afirmação de que a revelação anterior de Deus fosse má em si mesma.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: é revogado
  rationale: Expressa a anulação ou perda de vigência do mandamento, preservando o sentido jurídico do substantivo grego em português corrente.
- source_word: μὲν γὰρ
  choice: Pois, de fato
  rationale: Mantém tanto a função explicativa de γάρ como a ênfase e o contraste prospectivo de μέν, que será desenvolvido no versículo seguinte.
- source_word: γίνεται
  choice: é
  rationale: Na construção, indica que a revogação ocorre; a formulação passiva é natural em português e evita uma expressão existencial pesada.
- source_word: προαγούσης ἐντολῆς
  choice: o mandamento anterior
  rationale: O particípio significa aquilo que vinha antes ou precedia; “anterior” comunica claramente a prioridade temporal sem ampliar a referência além do contexto.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: por causa de sua fraqueza e inutilidade
  rationale: Reproduz a razão expressa por διά e conserva a força dos dois adjetivos substantivados, sem suavizar a avaliação do autor.
- source_word: ἀσθενές
  choice: fraqueza
  rationale: Indica falta de força ou eficácia e corresponde à forma substantivada da construção grega.
- source_word: ἀνωφελές
  choice: inutilidade
  rationale: É a equivalência direta e contundente para aquilo que não traz proveito, deixando ao contexto delimitar em que sentido não é útil.
theological_decisions:
- issue: Alcance da crítica ao mandamento anterior
  choice: Conservar no texto a afirmação forte de que o mandamento é fraco e inútil, entendendo pelo contexto que isso diz respeito à sua incapacidade de levar à perfeição mencionada em Hebreus 7:19.
  alternative: Interpretar a frase como declaração de que toda a revelação anterior de Deus era má ou absolutamente sem valor; ou, no extremo oposto, suavizar “inutilidade” para eliminar a avaliação negativa real.
  rationale: O contexto imediato trata da insuficiência da ordem sacerdotal anterior para produzir perfeição. A tradução mantém a tensão e a contundência do grego, enquanto a nota impede uma generalização alheia ao argumento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Revogado” conserva a precisão jurídica sem excessivo tecnicismo; “fraqueza e inutilidade” mantém deliberadamente a linguagem incisiva do original. A vírgula final reflete que o argumento continua no versículo 19.
