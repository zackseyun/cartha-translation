source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: pt
  text: 'Pois um sumo sacerdote assim era exatamente o que nos convinha: santo, inocente, sem mancha, separado dos pecadores e tendo-se tornado mais alto que os céus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοιοῦτος
  choice: um sumo sacerdote assim
  rationale: Retoma de modo natural, em português, o tipo de sumo sacerdote descrito no argumento anterior.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto precedente.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: era justamente ... que precisávamos
  rationale: Expressa idiomaticamente a adequação desse sumo sacerdote às nossas necessidades; “justamente” comunica a força enfática provável de καί.
- source_word: ἀρχιερεύς
  choice: sumo sacerdote
  rationale: Equivalente tradicional, claro e preciso para o ofício cultual em Hebreus.
- source_word: ὅσιος
  choice: santo
  rationale: Comunica santidade e fidelidade moral no contexto da qualificação sacerdotal.
- source_word: ἄκακος
  choice: inocente
  rationale: Expressa ausência de maldade ou culpa sem a possível fraqueza de “inofensivo”.
- source_word: ἀμίαντος
  choice: sem mancha
  rationale: Preserva a imagem de pureza moral e cultual em português corrente e digno.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: separado dos pecadores
  rationale: Reproduz diretamente o estado resultante indicado pelo particípio perfeito, sem definir se a separação é moral, espacial ou ligada à exaltação.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: elevado acima dos céus
  rationale: Comunica de forma natural o movimento resultante para uma posição superior aos céus; a nota registra a formulação mais formal do particípio e do comparativo.
theological_decisions:
- issue: Relação de Jesus com os pecadores em “separado dos pecadores”
  choice: Manter a expressão direta e sem explicação dentro do versículo.
  alternative: Explicitar “moralmente separado dos pecadores” ou restringir a frase à separação posterior à ascensão.
  rationale: A sequência ressalta pureza e exaltação sacerdotais, mas o texto não especifica a natureza ou o momento da separação. A tradução preserva essa tensão e não nega a convivência terrena de Jesus com pecadores.
- issue: Sentido de γενόμενος na exaltação acima dos céus
  choice: “elevado acima dos céus”, com nota para a forma mais literal “tendo-se tornado mais alto que os céus”.
  alternative: “sendo mais alto que os céus” ou “tendo sido exaltado acima dos céus”.
  rationale: A redação principal expressa o movimento histórico e o estado resultante de exaltação sem sugerir mudança na natureza divina; a nota preserva a forma e a ambiguidade de agência do grego.
translation_notes:
  register: Português moderno de ampla compreensão, com leitura natural no Brasil. O tom permanece digno e bíblico. A construção focal “era justamente de ... que precisávamos” evita a rigidez de “convinha-nos” e transmite a adequação expressa por ἔπρεπεν.
