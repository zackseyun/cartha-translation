revisions:
- from: 'Pois era justamente de um sumo sacerdote assim que precisávamos: santo, inocente, sem mancha, separado dos pecadores e elevado acima dos céus.[a]'
  to: 'Pois um sumo sacerdote assim era exatamente o que nos convinha: santo, inocente, sem mancha, separado dos pecadores e tendo-se tornado mais alto que os céus.'
  rationale: A revisão restitui o sentido de adequação de ἔπρεπεν sem perder fluidez e traz para o texto principal o comparativo e o particípio de ὑψηλότερος τῶν οὐρανῶν γενόμενος. Não é necessária nota, pois a redação preserva diretamente a ambiguidade e a força do grego.
