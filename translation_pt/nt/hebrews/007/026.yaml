review_pass:
  verdict: revise
  source_fidelity: A redação atual transmite adequadamente a série de qualificações sacerdotais. Contudo, «precisávamos» desloca ἔπρεπεν, que indica conveniência/adequação, para necessidade. Além disso, «elevado» torna o particípio γενόμενος mais passivo e a construção histórica fica apenas na nota, embora pertença ao texto grego.
  naturalness: «Um sumo sacerdote assim era exatamente o que nos convinha» é natural em português moderno, mantém um registro bíblico digno e expressa com precisão a adequação indicada pelo grego. «Tendo-se tornado mais alto que os céus» é claro e conserva o comparativo e o particípio.
  terminology: «Sumo sacerdote», «santo», «inocente», «sem mancha» e «separado dos pecadores» são escolhas adequadas e consistentes com o vocabulário cultual e moral de Hebreus.
  issues:
  - severity: medium
    issue: «precisávamos» para ἡμῖν καὶ ἔπρεπεν
    rationale: O verbo ἔπρεπεν significa «era apropriado/convinha», não primariamente «precisávamos». Embora a necessidade possa ser inferida do contexto, ela não é o sentido lexical direto.
  - severity: medium
    issue: «elevado acima dos céus» para ὑψηλότερος τῶν οὐρανῶν γενόμενος
    rationale: A formulação suaviza tanto o comparativo («mais alto que») quanto γενόμενος («tendo-se tornado») e pode sugerir uma voz passiva não expressa. A tradução direta preserva melhor a forma e a ambiguidade de agência do grego.
  revised_text: 'Pois um sumo sacerdote assim era exatamente o que nos convinha: santo, inocente, sem mancha, separado dos pecadores e tendo-se tornado mais alto que os céus.'
  revised_footnotes: []
