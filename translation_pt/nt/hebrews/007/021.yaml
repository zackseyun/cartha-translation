source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: pt
  text: 'mas este se tornou sacerdote com juramento, por meio daquele que lhe disse: “O Senhor jurou e não mudará de ideia: ‘Você é sacerdote para sempre.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: mas este
  rationale: Preserva o contraste elíptico com os sacerdotes mencionados no versículo anterior e é natural em português.
- source_word: μετὰ ὁρκωμοσίας
  choice: com juramento
  rationale: Expressa a circunstância ou o meio da nomeação e mantém o contraste com os sacerdotes constituídos sem juramento.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: por meio daquele que lhe disse
  rationale: Mantém a ideia de agência de διά com o genitivo e identifica Deus como aquele que profere a declaração citada, sem explicitar além do grego.
- source_word: Ὤμοσεν κύριος
  choice: O Senhor jurou
  rationale: Traduz diretamente o aoristo grego e conserva o tom solene da citação do Salmo 110.4.
- source_word: οὐ μεταμεληθήσεται
  choice: não mudará de ideia
  rationale: No contexto do juramento, indica que o Senhor não reverterá sua decisão; evita sugerir arrependimento moral.
- source_word: Σὺ ἱερεὺς
  choice: Você é sacerdote
  rationale: Supre naturalmente a cópula implícita e usa linguagem moderna, clara e digna.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma idiomática corrente para a duração permanente expressa pela locução grega.
theological_decisions:
- issue: O juramento divino e a permanência do sacerdócio
  choice: A tradução destaca que este sacerdote foi constituído com juramento e que seu sacerdócio é para sempre.
  alternative: Traduzir ὤμοσεν com valor resultativo, como “O Senhor tem jurado”, ou empregar “não se arrependerá”.
  rationale: O argumento do contexto contrasta os sacerdotes anteriores, constituídos sem juramento, com este sacerdote, cuja condição é confirmada pelo juramento irrevogável de Deus. A formulação preserva o contraste sem acrescentar uma construção doutrinária externa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Você” comunica diretamente a segunda pessoa singular sem arcaísmo; “não mudará de ideia” esclarece o sentido contextual de μεταμέλομαι. A ordem e a estrutura da citação foram mantidas tanto quanto permite a fluência.
