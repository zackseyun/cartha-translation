id: HEB.7.28
reference: Hebrews 7:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: pt
  text: Pois a lei nomeia homens sujeitos à fraqueza como sumos sacerdotes, mas a palavra do juramento, que veio depois da lei, nomeia um Filho[a] que foi aperfeiçoado para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o Filho». O grego traz «Filho» sem artigo, destacando o contraste com «homens», embora no contexto se refira a Jesus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «levado à plena realização para sempre»; no contexto sacerdotal, o verbo também pode incluir a ideia de «consagrado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se à lei mosaica, especialmente às suas disposições sacerdotais; a minúscula é natural em português e não perde a referência contextual.
- source_word: καθίστησιν
  choice: nomeia
  rationale: No contexto de um ofício sacerdotal, comunica a designação formal com mais naturalidade do que o literalismo «constitui».
- source_word: ἀνθρώπους
  choice: homens
  rationale: A referência concreta é aos ocupantes masculinos do sumo sacerdócio levítico, não à humanidade em sentido genérico.
- source_word: ἀρχιερεῖς
  choice: sumos sacerdotes
  rationale: É a designação portuguesa corrente do ofício; o plural contempla seus sucessivos ocupantes.
- source_word: ἔχοντας ἀσθένειαν
  choice: sujeitos à fraqueza
  rationale: Preserva a ideia de fragilidade e limitação humanas, sem restringir o termo a enfermidade física.
- source_word: ὁ λόγος τῆς ὁρκωμοσίας
  choice: a palavra do juramento
  rationale: Mantém o registro bíblico de λόγος e expressa a declaração divina que contém o juramento.
- source_word: τῆς μετὰ τὸν νόμον
  choice: que veio depois da lei
  rationale: Explicita de modo natural a relação temporal indicada pelo grego e relevante para o argumento de Hebreus.
- source_word: υἱόν
  choice: um Filho
  rationale: Conserva a ausência do artigo e o contraste qualitativo entre «homens» e «Filho»; a inicial maiúscula sinaliza a referência cristológica contextual.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma idiomática de expressar duração permanente neste contexto.
- source_word: τετελειωμένον
  choice: que foi aperfeiçoado
  rationale: Reflete o particípio perfeito passivo e seu estado resultante, sem reduzir o campo semântico à consagração sacerdotal.
theological_decisions:
- issue: A ausência de artigo em υἱόν e sua referência cristológica
  choice: um Filho
  alternative: o Filho
  rationale: «Um Filho» preserva mais de perto a forma grega e realça o contraste de qualidade com os homens nomeados pela lei. A nota registra a tradução contextualmente definida «o Filho», sem sugerir que haja vários filhos equivalentes.
- issue: O sentido sacerdotal de τετελειωμένον
  choice: que foi aperfeiçoado para sempre
  alternative: que foi levado à plena realização para sempre; que foi consagrado para sempre
  rationale: A tradução mantém a linguagem característica de perfeição/completude em Hebreus e a voz passiva, sem decidir que o termo signifique apenas consagração ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem «nomeia homens sujeitos à fraqueza como sumos sacerdotes» evita uma construção artificial, enquanto a repetição de «nomeia» torna explícito o verbo subentendido na segunda oração. Os marcadores [a] e [b] estão posicionados junto aos termos que suas notas explicam.
