source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: pt
  text: Pois é evidente que o nosso Senhor surgiu de Judá[a], tribo a respeito da qual Moisés nada falou sobre sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “despontou de Judá”. O verbo grego evoca a imagem de algo que se levanta ou brota; aqui se refere à origem na tribo de Judá, não principalmente à ressurreição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: é evidente
  rationale: Expressa de modo natural e digno o adjetivo predicativo que apresenta um fato manifesto.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o argumento anterior.
- source_word: ἐξ Ἰούδα
  choice: de Judá
  rationale: Indica origem ou descendência sem acrescentar explicitamente “tribo”, termo que aparece logo em seguida.
- source_word: ἀνατέταλκεν
  choice: surgiu
  rationale: Preserva a imagem de despontar ou levantar-se e, no contexto, comunica origem em Judá sem reduzir o verbo a uma formulação genealógica nem sugerir primariamente a ressurreição.
- source_word: ὁ κύριος ἡμῶν
  choice: o nosso Senhor
  rationale: Forma portuguesa natural que conserva o título e o pronome possessivo do grego.
- source_word: εἰς ἣν φυλήν
  choice: tribo a respeito da qual
  rationale: Retoma Judá de maneira idiomática e introduz o tema sobre o qual Moisés nada disse.
- source_word: περὶ ἱερέων οὐδὲν
  choice: nada falou sobre sacerdotes
  rationale: Conserva a referência concreta a sacerdotes, em vez de substituí-la pelo conceito abstrato de sacerdócio.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Moisés ... falou
  rationale: “Falou” corresponde diretamente a λαλέω e soa natural com o complemento “sobre sacerdotes”.
theological_decisions:
- issue: Referente de “o nosso Senhor”
  choice: Manter o título “o nosso Senhor”, que no contexto se refere a Jesus.
  alternative: Explicitar “Jesus, nosso Senhor”.
  rationale: O contexto identifica o referente, mas o texto grego não acrescenta o nome; a tradução evita explicitação desnecessária.
- issue: Sentido de ἀνατέταλκεν
  choice: Traduzir por “surgiu”, com nota que esclarece a imagem e o sentido contextual de origem tribal.
  alternative: “descendeu” ou “ressuscitou”
  rationale: “Descendeu” eliminaria a metáfora, enquanto “ressuscitou” direcionaria indevidamente o verbo à ressurreição; aqui o argumento trata da procedência de Judá.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o encadeamento argumentativo e evita terminologia denominacional.
