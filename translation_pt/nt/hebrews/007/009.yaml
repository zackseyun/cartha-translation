  text: καὶ ὡς ἔπος εἰπεῖν, δι’ Ἀβραὰμ καὶ Λευὶ ὁ δεκάτας λαμβάνων δεδεκάτωται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: pt
  text: E, por assim dizer[a], por meio de Abraão, até mesmo Levi, que recebe dízimos, pagou dízimos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se poderia dizer” ou “se assim se pode dizer”.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega aqui uma forma passiva, literalmente algo como “teve dízimos cobrados dele”. A ideia é que Levi é considerado como tendo pagado dízimos por meio de Abraão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: por assim dizer
  rationale: Expressão idiomática portuguesa natural que mantém a ressalva retórica do autor, sem transformar a afirmação em linguagem estritamente literal.
- source_word: δι’ Ἀβραὰμ
  choice: por meio de Abraão
  rationale: Preserva o valor mediador de διά com o genitivo e exprime a participação de Levi na ação de seu antepassado sem definir além do texto como essa representação funciona.
- source_word: καὶ Λευὶ
  choice: até mesmo Levi
  rationale: 'Comunica a força enfática e surpreendente de καί neste argumento: a conclusão se estende inclusive a Levi.'
- source_word: ὁ δεκάτας λαμβάνων
  choice: que recebe dízimos
  rationale: Traduz com naturalidade o particípio substantivado e descreve a função característica de Levi na ordem sacerdotal.
- source_word: δεκάτας
  choice: dízimos
  rationale: É o termo português corrente e preciso para as décimas partes dadas no contexto religioso.
- source_word: δεδεκάτωται
  choice: pagou dízimos
  rationale: Em português, a reprodução formal do perfeito passivo como “foi dizimado” seria enganosa, pois normalmente sugeriria destruição ou morte. A formulação ativa comunica o sentido contextual de que Levi é considerado participante do pagamento feito por Abraão; a voz passiva e sua formulação compacta são registradas em nota.
theological_decisions:
- issue: Participação representativa de Levi na ação de Abraão
  choice: Levi é apresentado, com a ressalva “por assim dizer”, como tendo pagado dízimos por meio de Abraão.
  alternative: Entender a afirmação exclusivamente como representação corporativa formal ou apenas como figura retórica.
  rationale: A tradução conserva tanto a mediação expressa por “por meio de Abraão” quanto a cautela retórica do autor, sem impor um mecanismo doutrinário específico à relação entre Levi e seu antepassado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Evitou-se “foi dizimado”, que em português moderno comunicaria um sentido gravemente equivocado.
