  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: pt
  text: E, visto que isso não se deu sem juramento (pois aqueles se tornaram sacerdotes sem juramento,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem a prestação de um juramento”.'
    reason: Alternativa lexical que explicita que ὁρκωμοσία pode designar o ato de prestar ou confirmar algo mediante juramento.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação explícita com o argumento precedente.
- source_word: καθ’ ὅσον
  choice: visto que
  rationale: Expressa aqui a base do argumento de modo natural em português; a consequência proporcional será completada na continuação da frase.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: isso não se deu sem juramento
  rationale: Acréscimos mínimos de “isso” e “se deu” tornam inteligível a construção elíptica em português, preservando a negação enfática e o sentido de confirmação por juramento.
- source_word: οἱ μὲν γὰρ
  choice: pois aqueles
  rationale: “Pois” conserva o valor explicativo de γάρ; “aqueles” identifica o primeiro lado do contraste, enquanto a oposição introduzida por μέν será completada no versículo seguinte.
- source_word: χωρὶς ὁρκωμοσίας
  choice: sem juramento
  rationale: Reproduz de maneira concisa e coerente a expressão já usada na oração principal.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: se tornaram sacerdotes
  rationale: Representa naturalmente a construção perifrástica, indicando a entrada deles no sacerdócio e o estado resultante.
theological_decisions:
- issue: Referente do contraste entre os sacerdotes anteriores e o sacerdote estabelecido por juramento
  choice: O texto fala dos sacerdotes anteriores como aqueles que se tornaram sacerdotes sem juramento, deixando que a continuação identifique o outro lado do contraste.
  alternative: Explicitar aqui “os sacerdotes levíticos” e “Jesus”.
  rationale: Embora o contexto sustente essa identificação, o versículo não nomeia explicitamente nenhum dos dois lados neste ponto; evitar a explicitação preserva a progressão e a concisão do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura e o parêntese permanecem sintaticamente incompletos porque a frase continua no versículo seguinte.
