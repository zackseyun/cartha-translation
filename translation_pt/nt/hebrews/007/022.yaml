  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: pt
  text: Por isso mesmo, Jesus se tornou fiador de uma aliança melhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testamento”. A palavra grega pode significar “aliança” ou, em certos contextos, “testamento”; aqui, “aliança” se ajusta melhor ao argumento sobre o sacerdócio e o juramento.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Nessa mesma medida
  rationale: A expressão κατά com acusativo de grau indica medida ou extensão e retoma o argumento anterior, preservando a força comparativa.
- source_word: κρείττονος
  choice: melhor
  rationale: Mantém o termo comparativo central de Hebreus em linguagem clara e natural.
- source_word: διαθήκης
  choice: aliança
  rationale: No contexto do sacerdócio e do juramento, refere-se melhor ao compromisso ou arranjo pactual estabelecido por Deus, sem antecipar o sentido de testamento explorado em outro contexto.
- source_word: γέγονεν
  choice: se tornou
  rationale: O perfeito de γίνομαι apresenta uma mudança realizada cujos efeitos permanecem; o pretérito perfeito composto não seria natural neste uso em português.
- source_word: ἔγγυος
  choice: garantidor
  rationale: Designa a pessoa que oferece garantia ou responde pela validade de um compromisso; é preciso e compreensível no português moderno.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Sentido de διαθήκη em Hebreus 7:22
  choice: aliança
  alternative: testamento
  rationale: Embora διαθήκη possa significar aliança ou, em certos contextos, testamento, o argumento imediato sobre sacerdócio e juramento favorece aliança. A alternativa é preservada em nota para não ocultar a amplitude semântica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Nessa mesma medida” preserva a ligação comparativa com o versículo anterior; “garantidor” mantém o caráter pessoal de ἔγγυος.
