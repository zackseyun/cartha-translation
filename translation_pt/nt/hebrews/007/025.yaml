id: HEB.7.25
reference: Hebrews 7:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: pt
  text: Por isso, ele também é capaz de salvar completamente os que, por meio dele, se aproximam de Deus,[a] pois vive sempre para interceder por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “salvar para sempre”; tradicionalmente: “salvar de maneira plena”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do argumento anterior sobre o sacerdócio permanente de Jesus.
- source_word: καὶ
  choice: também
  rationale: Preserva a força aditiva, ligando esta capacidade salvadora à permanência do sacerdócio de Jesus.
- source_word: σῴζειν
  choice: salvar
  rationale: É o equivalente usual em contexto soteriológico e preserva o peso teológico do termo.
- source_word: εἰς τὸ παντελές
  choice: completamente
  rationale: Comunica a abrangência plena da salvação sem limitar a expressão ao sentido temporal; a possível nuance de perpetuidade é preservada em nota.
- source_word: δύναται
  choice: é capaz
  rationale: Expressa a capacidade efetiva fundamentada no sacerdócio permanente de Jesus, em português claro e digno.
- source_word: τοὺς προσερχομένους
  choice: os que se aproximam
  rationale: Preserva a linguagem recorrente de Hebreus para o acesso a Deus, incluindo suas conotações relacionais e cultuais.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: Torna explícita a mediação de Jesus sem acrescentar conteúdo ao texto.
- source_word: τῷ θεῷ
  choice: de Deus
  rationale: Com 'aproximar-se', a regência natural em português é 'aproximar-se de Deus'.
- source_word: πάντοτε ζῶν
  choice: pois vive sempre
  rationale: Apresenta naturalmente a circunstância como fundamento da capacidade de salvar e mantém a ideia de vida contínua.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: para interceder
  rationale: Preserva a finalidade expressa pela construção e usa linguagem contemporânea e teologicamente precisa.
- source_word: ὑπὲρ αὐτῶν
  choice: por eles
  rationale: Expressa de maneira idiomática a representação ou ação em favor deles.
theological_decisions:
- issue: Amplitude semântica de εἰς τὸ παντελές
  choice: completamente
  alternative: para sempre; de maneira plena/até o fim
  rationale: A expressão pode indicar totalidade ou duração perpétua. O contexto sustenta tanto a plenitude da salvação quanto sua eficácia duradoura, especialmente pela referência à vida permanente de Jesus. O texto principal enfatiza a completude, e a nota conserva a leitura temporal sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem 'por meio dele' junto de 'se aproximam de Deus' evidencia a mediação sem alterar o sentido. A vírgula antes da nota encerra a primeira oração; o marcador está presente no texto principal.
