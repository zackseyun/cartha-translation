  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: pt
  text: Sem qualquer contestação[a], o menor é abençoado pelo maior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem nenhuma disputa” ou “sem contradição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Sem qualquer contestação
  rationale: A expressão apresenta a afirmação como indiscutível. “Sem qualquer contestação” preserva χωρὶς com o genitivo e o alcance de πάσης, em português atual e digno. O δέ funciona como transição leve e não exige uma conjunção explícita neste versículo.
- source_word: τὸ ἔλαττον
  choice: o menor
  rationale: O comparativo substantivado indica aquele que ocupa posição inferior na relação considerada. “O menor” conserva a formulação geral sem sugerir inferioridade moral.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: pelo maior
  rationale: Ὑπό com genitivo marca o agente da voz passiva. “Pelo maior” expressa superioridade de posição e mantém o paralelismo conciso com “o menor”.
- source_word: εὐλογεῖται
  choice: é abençoado
  rationale: O presente passivo indica que o sujeito recebe a bênção. No contexto de Melquisedeque e Abraão, “é abençoado” é direto e adequado.
theological_decisions:
- issue: Natureza da comparação entre “menor” e “maior”
  choice: 'Uma máxima geral de posição: o menor é abençoado pelo maior.'
  alternative: Uma simples convenção social, sem peso teológico.
  rationale: No argumento de Hebreus 7, a máxima sustenta a superioridade de Melquisedeque em relação a Abraão. A tradução mantém a linguagem comparativa sem definir além do texto a natureza exata dessa superioridade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é concisa e digna; “menor/maior” preserva o caráter proverbial e a comparação de posição do grego.
