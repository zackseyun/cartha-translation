source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: pt
  text: a quem Abraão também separou a décima parte de tudo[a]. Primeiro, seu nome é traduzido como Rei da Justiça[b]; e depois também Rei de Salém, isto é, Rei da Paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dízimo de tudo”. O grego diz literalmente “a décima parte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Rei da Retidão”. A palavra grega pode significar “justiça” ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: a quem
  rationale: Pronome relativo no dativo que retoma Melquisedeque e indica o destinatário da décima parte.
- source_word: δεκάτην
  choice: a décima parte
  rationale: Reproduz de modo transparente o sentido literal de um décimo, sem substituir o termo por uma formulação mais interpretativa.
- source_word: ἀπὸ πάντων
  choice: de tudo
  rationale: Expressa naturalmente em português que a décima parte foi retirada do conjunto total.
- source_word: ἐμέρισεν
  choice: destinou
  rationale: Comunica a ideia de separar e atribuir uma porção a alguém, mantendo fluidez em português.
- source_word: ἑρμηνευόμενος
  choice: seu nome é traduzido como
  rationale: Explicita naturalmente que está em pauta o significado do nome Melquisedeque.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Rei da Justiça
  rationale: Neste contexto de explicação etimológica do nome, 'justiça' é natural em português e preserva o campo semântico de δικαιοσύνη.
- source_word: βασιλεὺς Σαλήμ
  choice: Rei de Salém
  rationale: Mantém Salém como nome próprio de lugar e preserva a forma titular da expressão.
- source_word: ὅ ἐστιν
  choice: isto é
  rationale: Introduz com clareza a explicação do sentido de Salém.
- source_word: βασιλεὺς εἰρήνης
  choice: Rei da Paz
  rationale: Traduz diretamente a explicação fornecida pelo autor para Salém.
theological_decisions:
- issue: Sentido de δικαιοσύνη no título ligado ao nome Melquisedeque
  choice: justiça
  alternative: retidão
  rationale: δικαιοσύνη admite ambos os sentidos. 'Justiça' forma um título claro e idiomático em português; 'retidão' preserva uma nuance moral possível e é registrada em nota para não eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura sequencial “Primeiro... depois...” acompanha o desenvolvimento do grego, e as iniciais maiúsculas apresentam as expressões como títulos.
