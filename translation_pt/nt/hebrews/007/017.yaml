  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: pt
  text: 'Pois se dá testemunho: “Tu és sacerdote para sempre, segundo a ordem de Melquisedeque.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais tradicionalmente: “depois da ordem de Melquisedeque”.'
    reason: lexical_alternative
  - marker: b
    text: Citação do Salmo 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: dele se dá testemunho
  rationale: A forma presente passiva introduz o testemunho das Escrituras sem especificar indevidamente quem testemunha; a construção é natural em português e mantém a referência ao destinatário da citação.
- source_word: γὰρ
  choice: Pois
  rationale: Conecta o versículo ao argumento anterior, apresentando sua fundamentação.
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo do testemunho; os dois-pontos apresentam naturalmente a citação direta em português.
- source_word: Σὺ
  choice: Você
  rationale: Reproduz a segunda pessoa do singular em linguagem atual e amplamente compreensível; a posição explícita do pronome preserva a ênfase do grego.
- source_word: ἱερεὺς
  choice: sacerdote
  rationale: Traduz diretamente a designação sacerdotal sem acrescentar “sumo”, que não aparece neste versículo.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão portuguesa idiomática que comunica duração perpétua.
- source_word: κατὰ τὴν τάξιν
  choice: segundo a ordem de
  rationale: Preserva a formulação que indica correspondência com uma ordem ou categoria, em registro digno e corrente.
- source_word: Μελχισέδεκ
  choice: Melquisedeque
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
theological_decisions:
- issue: Designação sacerdotal na citação do salmo
  choice: sacerdote
  alternative: sumo sacerdote
  rationale: O texto grego traz ἱερεύς, “sacerdote”. Embora Hebreus apresente Jesus como sumo sacerdote em outros lugares, acrescentar “sumo” aqui ultrapassaria o texto-fonte.
- issue: Sentido de κατὰ τὴν τάξιν Μελχισέδεκ
  choice: segundo a ordem de Melquisedeque
  alternative: à maneira de Melquisedeque
  rationale: A tradução principal mantém a ambiguidade entre ordem, categoria e padrão, sem reduzir a expressão apenas à semelhança de modo.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. “Você” mantém a citação em discurso direto sem recorrer ao mais regional “tu”; “dele se dá testemunho” preserva a passiva impessoal e evita identificar explicitamente o agente.
