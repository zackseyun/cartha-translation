  source_fidelity: A tradução principal preserva adequadamente γάρ, a forma passiva impessoal de μαρτυρεῖται, a citação direta, «sacerdote», «para sempre» e «segundo a ordem de Melquisedeque». Contudo, «dele se dá testemunho» introduz em português um referente pronominal («dele») que não está expresso no grego; a passiva impessoal pode ser preservada sem essa explicitação.
  naturalness: «Pois se dá testemunho» é natural, conciso e adequado ao registro bíblico moderno. «Você» é compreensível, mas cria uma alternância de tratamento com forte marca de oralidade; «Tu» é amplamente reconhecido em citações solenes e reproduz de modo mais estável a segunda pessoa singular sem exigir formas verbais não padrão neste predicado nominal.
  terminology: '«Sacerdote», «Melquisedeque», «para sempre» e «segundo a ordem de» são corretos. A nota alternativa deve corresponder ao inglês auditado: «depois da ordem de Melquisedeque», não «à maneira de», pois esta última estreita a expressão para simples modo ou semelhança.'
