  source_fidelity: 'A tradução preserva bem a estrutura e o sentido do grego: ἐφ’ ὃν λέγεται ταῦτα é adequadamente expresso por “a respeito de quem essas coisas são ditas”; γάρ por “Pois”; φυλῆς ἑτέρας por “outra tribo”; e ἀφ’ ἧς por “da qual”. “Pertence” comunica de modo idiomático o estado de filiação tribal implicado pelo perfeito μετέσχηκεν sem introduzir explicitamente a noção de descendência. “Serviu no altar” transmite de modo claro o sentido cultual de προσέσχηκεν τῷ θυσιαστηρίῳ.'
