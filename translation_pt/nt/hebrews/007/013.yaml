id: HEB.7.13
reference: Hebrews 7:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: pt
  text: Pois aquele a respeito de quem essas coisas são ditas pertence a outra tribo[a], da qual ninguém serviu no altar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passou a fazer parte de outra tribo” ou “veio de outra tribo”. O verbo grego pode indicar participação ou associação; aqui se refere à filiação tribal.
    reason: lexical_alternative
  - marker: b
    text: Ou “dedicou-se ao altar” ou “oficiou no altar”. A expressão se refere ao atendimento ou serviço sacerdotal ligado ao altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: a respeito de quem
  rationale: 'Com λέγεται ταῦτα, ἐπί com acusativo indica referência: a pessoa acerca de quem essas coisas são ditas.'
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e preserva o fluxo argumentativo.
- source_word: λέγεται ταῦτα
  choice: essas coisas são ditas
  rationale: Mantém a voz passiva no presente e o plural de ταῦτα em português natural.
- source_word: φυλῆς ἑτέρας
  choice: outra tribo
  rationale: No contexto, φυλή designa uma das tribos de Israel, e ἑτέρας assinala que ela é diferente da tribo sacerdotal em discussão.
- source_word: μετέσχηκεν
  choice: pertence
  rationale: O perfeito expressa uma associação estabelecida com relevância presente. Neste contexto, a participação é filiação tribal; o presente português comunica naturalmente esse estado sem explicitar descendência além do grego.
- source_word: ἀφ’ ἧς
  choice: da qual
  rationale: O pronome retoma φυλή, traduzida por “tribo”.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto e natural do indefinido negativo.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: serviu no altar
  rationale: No contexto cultual, προσέχω com o dativo do altar descreve dedicação ou atendimento ligado ao serviço sacerdotal; “serviu no altar” comunica esse sentido sem especificar um rito particular.
- source_word: θυσιαστηρίῳ
  choice: altar
  rationale: É o termo português convencional e claro no contexto sacrificial.
theological_decisions:
- issue: Relação de Jesus com uma tribo não levítica no argumento sobre o sacerdócio
  choice: Expressar filiação tribal sem acrescentar uma explicação sobre descendência
  alternative: “descende de outra tribo”
  rationale: O versículo sustenta que o sacerdócio de Jesus não procede da linhagem levítica, mas aqui o grego fala de participação ou pertencimento a outra tribo, não emprega explicitamente um verbo de descendência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A respeito de quem” preserva a relação expressa no grego; “pertence” apresenta como estado atual a associação estabelecida pelo perfeito; “serviu no altar” evita tanto um literalismo obscuro quanto uma especificação ritual excessiva.
