source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: pt
  text: Pois a lei não aperfeiçoou coisa alguma[a]; mas há a introdução de uma esperança melhor[b], por meio da qual nos aproximamos de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não levou coisa alguma à perfeição” ou “não completou coisa alguma”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a introdução de uma esperança melhor”. O grego apresenta aqui uma construção nominal elíptica. O pronome em “por meio da qual” retoma mais naturalmente a esperança, embora também possa se referir à sua introdução.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: coisa alguma
  rationale: Funciona como objeto de ἐτελείωσεν e preserva a negação absoluta em português natural, sem sugerir que a lei nada fez em qualquer sentido.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa e fundamentadora do conectivo em relação ao contexto anterior.
- source_word: ἐτελείωσεν
  choice: aperfeiçoou
  rationale: Preserva o termo teologicamente carregado em Hebreus, que pode indicar levar à perfeição ou ao objetivo pretendido, sem reduzi-lo a mera utilidade ou realização genérica.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se à lei mosaica e ao sistema sacerdotal em contexto; a minúscula segue o uso natural do português sem acrescentar distinção ausente do grego.
- source_word: ἐπεισαγωγὴ
  choice: foi introduzida
  rationale: A construção verbal torna natural em português a oração nominal elíptica grega e comunica a introdução adicional ou substitutiva da esperança, sem especificar agente.
- source_word: δὲ
  choice: em contrapartida
  rationale: Expressa claramente o contraste estrutural entre a incapacidade da lei para aperfeiçoar e a introdução da esperança melhor.
- source_word: κρείττονος ἐλπίδος
  choice: uma esperança melhor
  rationale: Conserva o comparativo recorrente de Hebreus e a indefinição natural da expressão grega sem artigo.
- source_word: δι’ ἧς
  choice: por meio da qual
  rationale: O pronome feminino retoma naturalmente 'esperança' e expressa meio ou instrumentalidade.
- source_word: ἐγγίζομεν
  choice: nos aproximamos
  rationale: Expressa com clareza o movimento de acesso a Deus e mantém a ressonância cultual do verbo em Hebreus.
- source_word: τῷ θεῷ
  choice: de Deus
  rationale: Complemento exigido pela expressão portuguesa 'aproximar-se de', correspondendo ao dativo grego após ἐγγίζομεν.
theological_decisions:
- issue: Sentido de τελειόω em relação à lei
  choice: A lei não levou coisa alguma à perfeição ou ao objetivo pretendido.
  alternative: A lei não realizou absolutamente nada; ou não levou ninguém à perfeição.
  rationale: A formulação conserva o objeto neutro οὐδὲν e o peso próprio de τελειόω em Hebreus, sem transformar a frase numa afirmação de inutilidade total da lei nem restringir explicitamente o objeto a pessoas.
- issue: Contraste elíptico depois da afirmação sobre a lei
  choice: Verter a oração nominal por 'em contrapartida, foi introduzida uma esperança melhor'.
  alternative: Mas há a introdução de uma esperança melhor; ou mas a introdução de uma esperança melhor.
  rationale: A voz passiva em português explicita apenas o mínimo necessário para formar uma oração natural, preserva a ideia nominal de introdução e não identifica agente nem acrescenta uma cronologia específica.
- issue: Antecedente de δι’ ἧς
  choice: A esperança melhor é o meio pelo qual nos aproximamos de Deus.
  alternative: A introdução da esperança é o meio pelo qual nos aproximamos de Deus.
  rationale: A concordância feminina permite formalmente ambas, pois ἐπεισαγωγή e ἐλπίς são femininas; a proximidade sintática favorece 'esperança', mas a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Em contrapartida' evita uma sequência truncada após o ponto e vírgula; 'nos aproximamos de Deus' é corrente e conserva a ideia de acesso. As notas registram tanto a amplitude lexical de τελειόω quanto a elipse e a possível ambiguidade do antecedente feminino.
