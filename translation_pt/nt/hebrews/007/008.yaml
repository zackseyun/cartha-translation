source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: pt
  text: E aqui homens mortais recebem os dízimos, mas ali se dá testemunho de que ele vive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas ali dá-se testemunho de que ele vive”. O grego mantém a declaração na forma de testemunho bíblico, em vez de afirmar diretamente que Melquisedeque seja literalmente imortal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: aqui
  rationale: Preserva o contraste dêitico e retórico com ἐκεῖ, referindo-se ao sacerdócio levítico vigente.
- source_word: δεκάτας
  choice: os dízimos
  rationale: É a expressão corrente e precisa em português para a prática cultual em questão.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: homens mortais
  rationale: Exprime de modo conciso a mortalidade dos sacerdotes levíticos, em contraste com a apresentação escriturística de Melquisedeque.
- source_word: λαμβάνουσιν
  choice: recebem
  rationale: Tradução direta, natural e sem acréscimo interpretativo.
- source_word: ἐκεῖ
  choice: ali
  rationale: Mantém a contraposição 'aqui... ali' e aponta para o caso de Melquisedeque no relato bíblico.
- source_word: μαρτυρούμενος
  choice: se dá testemunho
  rationale: Conserva a voz passiva e o caráter testemunhal da afirmação sem identificar além do texto quem presta o testemunho.
- source_word: ὅτι ζῇ
  choice: de que ele vive
  rationale: Preserva o presente de ζῇ e a proposição introduzida por ὅτι de forma idiomática em português.
theological_decisions:
- issue: Natureza do contraste entre os sacerdotes levíticos e Melquisedeque
  choice: A mortalidade dos sacerdotes levíticos é contraposta ao testemunho bíblico de que Melquisedeque vive.
  alternative: Entender o versículo como afirmação direta da imortalidade pessoal e contínua de Melquisedeque.
  rationale: A formulação mantém o argumento na forma de testemunho, como no grego, sem transformar a apresentação narrativa de Melquisedeque em uma afirmação ontológica mais explícita do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção 'se dá testemunho de que ele vive' preserva a passividade e a tensão interpretativa do original.
