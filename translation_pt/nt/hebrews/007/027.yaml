source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: pt
  text: que não precisa, dia após dia[a], como os sumos sacerdotes, oferecer sacrifícios primeiro pelos seus próprios pecados e depois pelos do povo[b], pois isso ele fez de uma vez por todas[c], ao oferecer a si mesmo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diariamente”. A expressão grega tem o sentido de “dia após dia”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “depois pelos do povo”; “pecados” fica subentendido com base na expressão anterior.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma única vez”. O termo grego ressalta que o ato não se repete.
    reason: lexical_alternative
  - marker: d
    text: Ou “quando ofereceu a si mesmo” ou “tendo oferecido a si mesmo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: A expressão idiomática indica repetição diária; “dia após dia” preserva essa força e soa natural em português.
- source_word: ἀνάγκην
  choice: precisa
  rationale: Na construção ἔχει ἀνάγκην, “não precisa” é a forma contemporânea e idiomática de expressar ausência de necessidade.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: como os sumos sacerdotes
  rationale: Mantém de forma clara a comparação e o plural do grego.
- source_word: πρότερον ... ἔπειτα
  choice: primeiro ... e depois
  rationale: Expressa diretamente a sequência dos sacrifícios.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: pelos seus próprios pecados
  rationale: Em contexto sacrificial, ὑπέρ indica que o sacrifício é oferecido em favor de ou por causa dos pecados; a formulação escolhida é concisa e natural.
- source_word: θυσίας ἀναφέρειν
  choice: oferecer sacrifícios
  rationale: No contexto cultual, ἀναφέρω com θυσία significa oferecer sacrificialmente; esta é a expressão corrente em português.
- source_word: τῶν τοῦ λαοῦ
  choice: pelos do povo
  rationale: Preserva a elipse grega, na qual “pecados” é subentendido com base na oração anterior, sem prejudicar a compreensão.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: pois isso ele fez
  rationale: Mantém a referência anafórica de τοῦτο e dá leve destaque a “isso”, acompanhando a ordem grega sem tornar a frase artificial.
- source_word: ἐφάπαξ
  choice: de uma vez por todas
  rationale: Expressa o caráter único e definitivo do ato, sentido enfatizado pelo advérbio em Hebreus.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: ao oferecer a si mesmo
  rationale: A construção com “ao” preserva a possível relação temporal ou instrumental do particípio, enquanto “oferecer” mantém o sentido sacrificial.
theological_decisions:
- issue: Alcance de “isso” na oração explicativa
  choice: A tradução deixa “isso” com referência ampla ao ato sacrificial decisivo realizado por Cristo ao oferecer a si mesmo, sem dizer que ele ofereceu sacrifício por pecados próprios.
  alternative: Entender “isso” como referência exclusiva à oferta pelos pecados do povo.
  rationale: A redação conserva a referência anafórica do grego e o contraste com os sumos sacerdotes, sem inserir no texto uma delimitação que a sintaxe não explicita.
- issue: Natureza da auto-oferta de Cristo
  choice: “ao oferecer a si mesmo”
  alternative: “quando ofereceu a si mesmo” ou “tendo oferecido a si mesmo”
  rationale: A formulação mantém o caráter sacerdotal e sacrificial da ação e preserva a flexibilidade semântica do particípio aoristo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura conserva o contraste sacerdotal e a elipse do original sem soar arcaica; “sumos sacerdotes” e “oferecer sacrifícios” mantêm o registro cultual.
