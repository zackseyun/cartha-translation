  source_fidelity: A tradução reproduz com precisão a comparação com os sumos sacerdotes, a sequência “primeiro... e depois”, a elipse referente aos pecados do povo e a ação única e decisiva expressa por ἐφάπαξ. “Ao oferecer a si mesmo” representa adequadamente o particípio aoristo ἑαυτὸν ἀνενέγκας sem fixar indevidamente sua relação como exclusivamente temporal ou instrumental. O pronome “isso” preserva a referência anafórica do grego e não sugere que Cristo tenha oferecido sacrifícios por pecados próprios.
  naturalness: O português é moderno, claro e adequado ao registro sacerdotal do contexto. “Dia após dia”, “sumos sacerdotes”, “oferecer sacrifícios” e “de uma vez por todas” são formulações naturais e amplamente compreensíveis. A elipse em “pelos do povo” é um pouco marcada, mas é inteligível pelo antecedente imediato e é devidamente explicada em nota.
  terminology: “Sumos sacerdotes” é a designação estabelecida para ἀρχιερεῖς; “pecados”, “sacrifícios” e “oferecer a si mesmo” mantêm o vocabulário cultual e teológico do original sem arcaísmo desnecessário. As notas correspondem corretamente aos respectivos pontos lexicais e sintáticos.
