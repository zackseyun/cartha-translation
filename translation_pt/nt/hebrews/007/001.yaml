review_pass:
  verdict: revise
  source_fidelity: A formulação principal “depois de derrotar os reis” atenua indevidamente ἀπὸ τῆς κοπῆς τῶν βασιλέων. Κοπή designa uma matança, massacre ou abatimento, e não uma derrota militar genérica. A nota registra a literalidade, mas não compensa a alteração semântica no texto. O restante representa adequadamente a relação explicativa de γάρ, os títulos de Melquisedeque e as duas ações dirigidas a Abraão.
  naturalness: O texto é claro e de registro apropriado. “Encontrou Abraão” é mais direto e semanticamente neutro que “foi ao encontro de Abraão”, sem sugerir uma iniciativa além da expressa pelo grego. “Quando ele voltava” mantém leitura natural e deixa claro, pelo antecedente imediato, que Abraão voltava.
  terminology: “Melquisedeque”, “Salém”, “Abraão” e “Deus Altíssimo” são formas portuguesas estabelecidas e adequadas. “Matança dos reis” preserva a força de κοπή sem resolver além do necessário questões narrativas sobre quem foi morto.
  issues:
  - severity: medium
    issue: A expressão “depois de derrotar os reis” enfraquece o sentido de ἀπὸ τῆς κοπῆς τῶν βασιλέων.
    rationale: O substantivo κοπή tem força de matança/abatimento; “derrotar” é uma interpretação contextual mais branda. Como o grego emprega linguagem violenta, ela deve figurar no texto principal, não apenas em nota.
  revised_text: Pois este Melquisedeque, rei de Salém, sacerdote do Deus Altíssimo, encontrou Abraão quando ele voltava da matança dos reis e o abençoou,
