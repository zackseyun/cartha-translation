id: HEB.7.1
reference: Hebrews 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: pt
  text: Pois este Melquisedeque, rei de Salém, sacerdote do Deus Altíssimo, encontrou Abraão quando ele voltava da matança dos reis e o abençoou,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: Pois este Melquisedeque
  rationale: “Pois” preserva a ligação explicativa de γάρ com o argumento anterior, e “este” mantém a ênfase demonstrativa de Οὗτος. “Melquisedeque” é a forma portuguesa tradicional e reconhecível do nome.
- source_word: βασιλεὺς Σαλήμ
  choice: rei de Salém
  rationale: Tradução direta, com a forma tradicional portuguesa de Salém, preservando a ligação com Gênesis 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: sacerdote do Deus Altíssimo
  rationale: Expressão natural em português que conserva ὕψιστος como título divino e acompanha de perto a estrutura grega.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: foi ao encontro de Abraão
  rationale: A locução “foi ao encontro de” comunica com naturalidade a ação do particípio aoristo συναντήσας e evita que “encontrou” sugira mero acaso.
- source_word: ὑποστρέφοντι
  choice: quando este voltava
  rationale: O particípio presente indica que Abraão estava regressando no momento do encontro. O demonstrativo “este” torna claro que quem voltava era Abraão.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: depois de derrotar os reis
  rationale: No contexto militar de Gênesis 14, esta formulação comunica o sentido contextual sem afirmar de modo indevido que todos os reis foram mortos. A imagem mais literal de κοπή é preservada em nota.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: e o abençoou
  rationale: Reproduz de modo direto a segunda ação de Melquisedeque em relação a Abraão; o pronome “o” retoma Abraão naturalmente.
theological_decisions:
- issue: Forma do título divino τοῦ θεοῦ τοῦ ὑψίστου
  choice: Deus Altíssimo
  alternative: o Altíssimo Deus
  rationale: “Deus Altíssimo” é natural, digna e tradicional em português, preservando o título divino sem acrescentar uma interpretação doutrinária.
- issue: Sentido de κοπή no relato da vitória de Abraão
  choice: derrotar os reis
  alternative: matança dos reis
  rationale: A escolha principal evita concluir que os próprios reis necessariamente foram mortos, enquanto a nota registra a força literal e violenta do termo grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A vírgula final preserva o fato de que a construção continua no versículo seguinte.
