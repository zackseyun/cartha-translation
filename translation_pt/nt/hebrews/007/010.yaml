base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: pt
  text: Pois ele ainda estava nos lombos de seu pai quando Melquisedeque o encontrou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “ele ainda estava no corpo de seu antepassado”. O grego diz literalmente “nos lombos de seu pai”, expressão que indica descendência ancestral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ainda
  rationale: Expressa a continuidade desse estado até o momento do encontro e corresponde naturalmente ao valor temporal do grego.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa que liga este versículo ao argumento anterior.
- source_word: ἐν τῇ ὀσφύϊ
  choice: nos lombos
  rationale: Preserva a imagem concreta do grego, usada aqui como expressão de descendência e origem procriativa.
- source_word: τοῦ πατρὸς
  choice: de seu pai
  rationale: Reproduz a formulação do grego sem substituir o referente por “Abraão”; no contexto, “pai” tem sentido ancestral.
- source_word: ἦν
  choice: estava
  rationale: O imperfeito de εἰμί descreve a condição de Levi naquele momento; “estava” é natural em português neste contexto.
- source_word: ὅτε
  choice: quando
  rationale: É a correspondência temporal direta e idiomática.
- source_word: συνήντησεν
  choice: foi ao encontro
  rationale: Comunica de modo natural o ato de encontrar-se com alguém e se ajusta à alusão ao encontro narrado em Gênesis.
- source_word: αὐτῷ
  choice: dele
  rationale: Mantém o pronome do grego, cujo referente, Abraão, é fornecido pelo contexto.
- source_word: Μελχισέδεκ
  choice: Melquisedeque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação idiomática da descendência de Levi em relação a Abraão
  choice: Manter no texto principal a imagem concreta “nos lombos de seu pai”
  alternative: “no corpo de seu antepassado” ou “na descendência de seu antepassado”
  rationale: O argumento apresenta Levi como ancestralmente presente em Abraão. Conservar a metáfora torna visível a lógica do autor sem inserir no texto uma explicação teológica mais técnica.
- issue: Identificação de “seu pai”
  choice: Traduzir “de seu pai”, sem explicitar “Abraão”
  alternative: “de seu antepassado Abraão”
  rationale: Embora o contexto identifique Abraão como referente, o grego diz literalmente “de seu pai”. A formulação escolhida evita acrescentar ao texto principal uma especificação ausente do original, enquanto a nota esclarece o uso ancestral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva a metáfora corporal do original, enquanto a nota explica seu sentido ancestral sem apagar a tensão representativa do argumento.
