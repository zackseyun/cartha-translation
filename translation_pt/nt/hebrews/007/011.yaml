id: HEB.7.11
reference: Hebrews 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: pt
  text: Se, portanto, a perfeição fosse obtida por meio do sacerdócio levítico — pois foi com base nele que o povo recebeu a Lei[a] —, que necessidade haveria ainda de que surgisse outro sacerdote segundo a ordem de Melquisedeque e de que não fosse chamado segundo a ordem de Arão?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois sob ele o povo recebeu a Lei”. A expressão grega também pode ser traduzida mais formalmente dessa maneira; o pronome se refere mais naturalmente ao sacerdócio levítico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que surgisse outro sacerdote na ordem de Melquisedeque e não fosse chamado na ordem de Arão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ μὲν οὖν
  choice: Portanto, se
  rationale: οὖν introduz uma inferência a partir do argumento anterior; “portanto” preserva essa ligação sem acrescentar uma ideia temporal. A construção condicional mantém aberta a hipótese retórica.
- source_word: τελείωσις
  choice: perfeição
  rationale: Em Hebreus, o termo tem força cultual e teológica, relacionada ao acesso pleno e à condição pretendida diante de Deus. “Perfeição” preserva essa amplitude sem reduzi-la a mero aperfeiçoamento moral ou simples conclusão.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: por meio do sacerdócio levítico
  rationale: διά com genitivo expressa meio ou instrumentalidade. A formulação é clara e mantém o sacerdócio como o meio hipotético da perfeição.
- source_word: ἐπ’ αὐτῆς
  choice: com base nele
  rationale: O pronome feminino grego retoma mais naturalmente ἱερωσύνης, “sacerdócio”. Em português, “nele” concorda com o substantivo traduzido e exprime de modo idiomático a relação de fundamento.
- source_word: νενομοθέτηται
  choice: recebeu a Lei
  rationale: O perfeito passivo/médio indica que o povo foi objeto da legislação e permanece sob o arranjo resultante. “Recebeu a Lei” é natural em português e evita o pouco idiomático “foi legislado”.
- source_word: τίς ἔτι χρεία
  choice: que necessidade haveria ainda
  rationale: Preserva a força da pergunta retórica e o sentido de uma necessidade que continuaria existindo.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: segundo a ordem de Melquisedeque
  rationale: Mantém a formulação tradicional e semanticamente precisa para a categoria, padrão ou ordem sacerdotal indicada por κατά + τάξις.
- source_word: ἕτερον ... ἱερέα
  choice: outro sacerdote
  rationale: A distinção sugerida por ἕτερον fica clara pelo contraste subsequente entre as ordens de Melquisedeque e Arão, sem necessidade de tornar explícito “de tipo diferente”.
- source_word: ἀνίστασθαι
  choice: surgir
  rationale: No contexto, refere-se ao aparecimento ou levantamento de um sacerdote. “Surgir” é natural e não impõe um sentido de ressurreição.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: e não ser designado
  rationale: λέγεσθαι trata de como o sacerdote é referido ou classificado. “Ser designado” comunica essa função com clareza, enquanto a nota registra a alternativa mais formal “ser chamado”.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melquisedeque / Arão
  rationale: Empregam-se as formas portuguesas consagradas dos nomes bíblicos.
theological_decisions:
- issue: Sentido de τελείωσις no argumento sacerdotal de Hebreus
  choice: perfeição
  alternative: plenitude; acesso pleno a Deus; aperfeiçoamento
  rationale: A tradução mantém a densidade cultual e salvífica do termo e permite que o contexto de Hebreus defina seu alcance, sem limitá-lo à moralidade nem explicá-lo excessivamente.
- issue: Referente de αὐτῆς em ἐπ’ αὐτῆς νενομοθέτηται
  choice: o sacerdócio levítico
  alternative: a Lei; o arranjo da aliança em sentido mais amplo
  rationale: O antecedente feminino sintaticamente mais próximo e adequado é ἱερωσύνης, “sacerdócio”. A oração parentética explica que a legislação dada ao povo estava fundamentada nesse sistema sacerdotal.
- issue: Relação entre as ordens de Melquisedeque e Arão
  choice: manter a contraposição sem explicar sua implicação doutrinária
  alternative: explicitar que se trata de um sacerdócio de natureza superior ou inteiramente distinto
  rationale: O texto afirma a necessidade de outro sacerdote segundo uma ordem diferente, mas a tradução não deve antecipar nem ampliar as conclusões desenvolvidas no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. “Lei” recebe inicial maiúscula por se referir à legislação dada a Israel. Os travessões marcam a explicação parentética do grego, e “portanto” preserva o valor inferencial de οὖν.
