  - marker: b
    text: Isto é, permanecer no exercício do sacerdócio.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém o conectivo simples do grego e a continuidade do argumento.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: aqueles sacerdotes se tornaram muitos
  rationale: Preserva a ideia predicativa e a pluralidade decorrente da sucessão dos sacerdotes. «Aqueles» retoma naturalmente os sacerdotes do contexto, enquanto a estrutura prepara o contraste marcado por μέν com o versículo seguinte.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: porque a morte os impedia
  rationale: Expressa com naturalidade a causa introduzida por διά com infinitivo articular; a morte é o agente ou meio que os impossibilitava de prosseguir.
- source_word: παραμένειν
  choice: continuar
  rationale: No contexto, significa permanecer ou prosseguir no exercício sacerdotal. A formulação concisa conserva o sentido sem inserir explicitamente no texto palavras ausentes do grego.
theological_decisions:
- issue: Contraste entre os sacerdotes anteriores e o sacerdócio de Jesus
  choice: Destacar que os sacerdotes eram muitos porque a morte interrompia sua continuidade
  alternative: Identificá-los explicitamente no texto como sacerdotes levíticos ou dizer que não podiam permanecer no cargo
  rationale: O contexto indica o sacerdócio levítico e a continuidade no ofício, mas o versículo não emprega expressamente esses termos. A tradução preserva a progressão para o contraste com Jesus no versículo seguinte sem antecipar conclusões adicionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, e as notas preservam tanto a alternativa existencial da construção quanto a concisão de παραμένειν.
