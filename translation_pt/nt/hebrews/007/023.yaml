base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: pt
  text: E os sacerdotes foram muitos[a], porque a morte os impedia de permanecer[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «houve muitos sacerdotes».'
