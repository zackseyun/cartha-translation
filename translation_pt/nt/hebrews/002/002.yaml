id: HEB.2.2
reference: Hebrews 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: pt
  text: Pois, se a mensagem anunciada por meio de anjos se mostrou válida[a], e toda transgressão e desobediência recebeu a justa retribuição[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Provavelmente uma referência à Lei, entendida na tradição judaica como mediada por anjos; compare Atos 7:53 e Gálatas 3:19.
    reason: cross_reference
  - marker: b
    text: Ou “a justa penalidade” ou “a retribuição merecida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: a mensagem anunciada por meio de anjos
  rationale: “Mensagem” expressa λόγος como comunicação divina neste contexto; “anunciada” traduz naturalmente λαληθείς, e “por meio de anjos” preserva διά com genitivo sem atribuir aos anjos a autoria da mensagem.
- source_word: ἀγγέλων
  choice: anjos
  rationale: O contexto de Hebreus 2 e a tradição judaica sobre a mediação da Lei apontam para seres celestiais, e não para mensageiros humanos.
- source_word: ἐγένετο βέβαιος
  choice: se mostrou válida
  rationale: A expressão indica que a mensagem permaneceu firme, válida e eficaz em suas consequências. Esta formulação preserva o valor resultativo sem limitar o sentido a mera confirmação intelectual.
- source_word: πᾶσα παράβασις
  choice: toda transgressão
  rationale: παράβασις designa a violação de um limite ou mandamento; “transgressão” conserva o peso moral e jurídico do termo.
- source_word: παρακοὴ
  choice: desobediência
  rationale: O termo parte da ideia de não dar ouvidos e, neste contexto, denota desobediência, em paralelo com παράβασις.
- source_word: ἔλαβεν
  choice: recebeu
  rationale: Tradução direta que mantém cada transgressão e desobediência como sujeito da consequência judicial.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: a justa retribuição
  rationale: μισθαποδοσία significa retribuição ou pagamento correspondente, enquanto ἔνδικος ressalta que é justo ou merecido. “Justa retribuição” conserva a amplitude lexical e o caráter judicial sem restringir a expressão somente a “castigo”.
theological_decisions:
- issue: Natureza da “mensagem anunciada por meio de anjos”
  choice: Manter no texto uma provável alusão à Lei mediada por anjos, sem identificar explicitamente a mensagem como “a Lei”.
  alternative: Entender a expressão como qualquer mensagem divina comunicada por anjos.
  rationale: O contexto e a tradição refletida em Atos 7:53 e Gálatas 3:19 favorecem a referência à Lei do Sinai, mas o grego diz apenas “a mensagem anunciada por meio de anjos”. A tradução preserva essa formulação e deixa a identificação na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a oração condicional aberta, pois o versículo continua no seguinte. “Por meio de” explicita agência intermediária, e “se mostrou válida” comunica firmeza e eficácia jurídica em linguagem natural.
