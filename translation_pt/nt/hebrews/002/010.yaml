source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: pt
  text: Pois convinha àquele para quem são todas as coisas e por meio de quem são todas as coisas que, ao conduzir muitos filhos à glória,[a] aperfeiçoasse[c] por meio de sofrimentos o pioneiro[b] da salvação deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Muitos filhos” preserva a linguagem grega de filiação e herança; a expressão inclui todos os filhos de Deus, não apenas homens.
    reason: lexical_alternative
  - marker: b
    text: Ou “líder”, “fundador” ou “autor” da salvação deles.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “aperfeiçoasse” significa levar à meta ou à plena realização por meio de sofrimentos, e não corrigir uma falha moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: Pois convinha àquele
  rationale: “Convinha” expressa a adequação do propósito divino, enquanto “àquele” mantém a referência pronominal a Deus, identificada pelas orações seguintes.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: para quem são todas as coisas e por meio de quem são todas as coisas
  rationale: A formulação preserva a distinção entre finalidade (“para quem”) e mediação ou agência (“por meio de quem”), bem como o paralelismo solene do grego.
- source_word: πολλοὺς υἱοὺς
  choice: muitos filhos
  rationale: Mantém o termo filial explícito e sua possível relação com filiação e herança; uma nota esclarece que o alcance inclui todos os filhos de Deus, sem restrição ao sexo masculino.
- source_word: εἰς δόξαν
  choice: à glória
  rationale: Expressa de modo natural em português o movimento em direção à glória indicado por εἰς.
- source_word: ἀγαγόντα
  choice: ao conduzir
  rationale: Preserva a ligação circunstancial do particípio com o ato de aperfeiçoar sem convertê-lo, de forma indevida, numa oração inequívoca de finalidade.
- source_word: ἀρχηγὸν
  choice: pioneiro
  rationale: Comunica aquele que inaugura o caminho e vai à frente; a nota registra alternativas plausíveis como “líder”, “fundador” e “autor”.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: da salvação deles
  rationale: Reproduz com clareza a relação genitiva e mantém como referente os muitos filhos.
- source_word: διὰ παθημάτων
  choice: por meio de sofrimentos
  rationale: Conserva o plural concreto de παθημάτων e apresenta os sofrimentos como o meio pelo qual se dá o aperfeiçoamento.
- source_word: τελειῶσαι
  choice: aperfeiçoasse
  rationale: Mantém a importante família lexical de perfeição em Hebreus; a nota explica que aqui se trata de levar à meta ou plena realização, não de corrigir falha moral.
theological_decisions:
- issue: Sentido de τελειῶσαι aplicado ao pioneiro da salvação
  choice: aperfeiçoasse
  alternative: levasse à plena realização; completasse
  rationale: O verbo em Hebreus pode indicar conduzir à meta ou completar a qualificação para uma função. A tradução preserva a tensão lexical do texto sem sugerir que o Filho tivesse deficiência moral.
- issue: Alcance de πολλοὺς υἱοὺς
  choice: muitos filhos
  alternative: muitos filhos e filhas; muitas pessoas como filhos de Deus
  rationale: O masculino plural e a ênfase filial/hereditária são preservados no texto principal, enquanto a nota esclarece seu alcance inclusivo.
- issue: Relação de ἀγαγόντα com τελειῶσαι
  choice: ao conduzir muitos filhos à glória, aperfeiçoasse
  alternative: aperfeiçoasse... a fim de conduzir muitos filhos à glória
  rationale: A construção participial grega não explicita inequivocamente finalidade. “Ao conduzir” conserva a ligação circunstancial e evita resolver uma nuance sintática discutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura mantém o paralelismo teológico do original, mas usa pontuação e ordem sintática naturais em português. Os marcadores [a], [b] e [c] aparecem no texto principal.
