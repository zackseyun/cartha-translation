id: HEB.2.16
reference: Hebrews 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: pt
  text: Pois, evidentemente, não são os anjos que ele socorre, mas a descendência de Abraão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toma” ou “agarra”. O verbo grego pode significar literalmente “tomar” ou “agarrar”, mas aqui provavelmente tem o sentido de socorrer ou vir em auxílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: evidentemente
  rationale: Expressa a força enfática e inferencial da partícula, apresentando a afirmação como algo claro aos leitores, sem tornar o português artificial.
- source_word: ἀγγέλων
  choice: anjos
  rationale: Equivalente direto do genitivo plural, que designa a classe contrastada com a descendência de Abraão.
- source_word: ἐπιλαμβάνεται
  choice: socorre
  rationale: Neste contexto, o verbo provavelmente significa tomar alguém pela mão para ajudar ou vir em seu auxílio. “Socorre” comunica essa ação salvadora com clareza e dignidade; o sentido mais literal é preservado em nota.
- source_word: σπέρματος Ἀβραὰμ
  choice: descendência de Abraão
  rationale: Preserva o valor coletivo de σπέρμα e soa natural em português, sem restringir a expressão a um único descendente nem recorrer ao menos claro “semente”.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Pois ... não ... mas ...
  rationale: Mantém a relação explicativa com o contexto e o contraste enfático entre anjos e a descendência de Abraão.
theological_decisions:
- issue: Sentido de ἐπιλαμβάνεται em relação à obra salvadora de Cristo
  choice: O Filho socorre a descendência de Abraão, e não os anjos.
  alternative: O Filho toma a descendência de Abraão, com possível ênfase em assumir a natureza humana.
  rationale: O contexto imediato destaca a solidariedade do Filho com os seres humanos e sua ação em favor deles. O sentido idiomático “socorrer” se ajusta bem ao argumento, mas a tradução literal “tomar” ou “agarrar” possui relevância exegética e histórica; por isso, permanece registrada em nota, sem eliminar a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Evidentemente” reproduz a nuance de δήπου; “socorre” evita a possível generalidade de “ajuda” e sugere auxílio em situação de necessidade. A construção “não é a anjos que...” conserva a ênfase contrastiva do grego.
