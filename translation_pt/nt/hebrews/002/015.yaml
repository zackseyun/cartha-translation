  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: pt
  text: e libertar aqueles que, por medo da morte, estavam sujeitos à escravidão durante toda a vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: libertar
  rationale: Expressa a ideia de soltar ou livrar de uma condição opressiva e se encaixa naturalmente no contraste com a escravidão.
- source_word: τούτους, ὅσοι
  choice: aqueles que
  rationale: Reproduz de modo idiomático o demonstrativo seguido da expressão relativa de sentido inclusivo.
- source_word: φόβῳ θανάτου
  choice: por medo da morte
  rationale: Preserva a nuance causal ou circunstancial do dativo e soa natural em português atual.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: durante toda a vida
  rationale: Traduz naturalmente a duração contínua por todo o período de vida.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: estiveram sujeitos à escravidão
  rationale: Mantém a ideia de sujeição efetiva, sem reduzir a expressão a mera responsabilidade jurídica nem especificar um agente não declarado no versículo.
- source_word: δουλείας
  choice: escravidão
  rationale: Conserva a força concreta da metáfora de cativeiro melhor que termos mais abstratos como 'servidão'.
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação desta oração com a finalidade expressa no versículo anterior.
theological_decisions:
- issue: Natureza da escravidão associada ao medo da morte
  choice: A tradução apresenta uma sujeição real à escravidão causada ou mediada pelo medo da morte, sem definir mais precisamente seu mecanismo doutrinário.
  alternative: Explicitar como escravidão ao diabo, ao pecado ou à própria mortalidade.
  rationale: Embora o contexto anterior mencione o diabo e o poder da morte, este versículo não identifica explicitamente a quem ou a quê se presta essa escravidão; a formulação preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a relação entre medo da morte, duração da vida e escravidão.
