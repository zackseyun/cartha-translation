id: HEB.2.9
reference: Hebrews 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: pt
  text: Mas vemos Jesus, que por pouco tempo foi feito inferior aos anjos, coroado de glória e honra por causa do sofrimento da morte, para que, à parte de Deus,[a] provasse a morte por todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muitos manuscritos trazem “pela graça de Deus” em vez de “à parte de Deus”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “por tudo”.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: βραχύ τι
  choice: por pouco tempo
  rationale: A expressão é entendida temporalmente no contexto da citação do Salmo 8, indicando um período limitado, sem excluir que isoladamente possa expressar grau.
- source_word: παρ’ ἀγγέλους
  choice: inferior aos anjos
  rationale: Após ἐλαττόω, παρά com acusativo tem força comparativa; esta formulação é natural em português.
- source_word: ἠλαττωμένον
  choice: foi feito inferior
  rationale: Preserva a voz passiva e a ideia comparativa do particípio perfeito sem reduzi-la a mera humilhação emocional.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: por ter sofrido a morte
  rationale: διά com acusativo indica aqui a causa da coroação. A formulação comunica com clareza o sofrimento que culminou na morte.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: coroado de glória e honra
  rationale: Mantém a metáfora de στεφανόω e o motivo da exaltação em linguagem portuguesa corrente e digna.
- source_word: ὅπως
  choice: para que
  rationale: Preserva a força de propósito ou resultado da oração, sem decidir de modo excessivo entre essas nuances.
- source_word: χωρὶς θεοῦ
  choice: à parte de Deus
  rationale: Segue a leitura do texto grego fornecido e conserva sua expressão difícil e ambígua, evitando ampliá-la interpretativamente para 'abandonado' ou 'separado de Deus'.
- source_word: ὑπὲρ παντός
  choice: por todos
  rationale: Expressa de modo natural a força representativa de ὑπέρ e a leitura pessoal distributiva; a possível referência mais ampla a 'tudo' é registrada em nota.
- source_word: γεύσηται θανάτου
  choice: provasse a morte
  rationale: Preserva a metáfora grega, que permanece compreensível em português bíblico moderno.
theological_decisions:
- issue: Variante textual na oração final
  choice: à parte de Deus
  alternative: pela graça de Deus
  rationale: O texto grego fornecido traz χωρὶς θεοῦ, por isso essa leitura aparece no texto principal. A variante χάριτι θεοῦ é antiga, amplamente atestada e adotada por muitas edições e traduções; é apresentada em nota sem apagar a tensão textual.
- issue: Alcance de ὑπὲρ παντός
  choice: por todos
  alternative: por tudo
  rationale: O contexto favorece a referência distributiva a pessoas, mas a forma singular παντός permite uma leitura mais abrangente; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural para leitores brasileiros e compreensão internacional. O texto principal segue a leitura grega fornecida, enquanto variantes e ambiguidades relevantes são preservadas em notas.
