id: HEB.2.3
reference: Hebrews 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: pt
  text: Como escaparemos nós, se negligenciarmos tão grande salvação? Essa salvação[a], que começou a ser anunciada pelo Senhor, foi-nos confirmada pelos que o ouviram,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a qual, tendo começado a ser anunciada pelo Senhor, foi-nos confirmada pelos que o ouviram”.'
    reason: Registra uma construção mais formal do pronome relativo ἥτις e do particípio, preservando a continuidade sintática do grego.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: Como escaparemos nós
  rationale: Mantém a pergunta retórica no futuro e a ênfase expressa pelo pronome ἡμεῖς, sem transformá-la em afirmação explícita.
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: se negligenciarmos tão grande salvação
  rationale: Expressa naturalmente em português o valor condicional do particípio no contexto e preserva a magnitude enfática de τηλικαύτης.
- source_word: ἥτις
  choice: Essa salvação
  rationale: Retoma claramente σωτηρίας e introduz a explicação subsequente; a nota registra a alternativa mais formal com pronome relativo.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: que começou a ser anunciada
  rationale: Reproduz o sentido incoativo da expressão idiomática grega. 'Anunciada' comunica aqui a proclamação oral da mensagem com naturalidade.
- source_word: διὰ τοῦ κυρίου
  choice: pelo Senhor
  rationale: Em português, 'pelo Senhor' expressa de modo natural a agência de διά com genitivo; 'Senhor' preserva o título cristológico de κύριος.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: pelos que o ouviram
  rationale: Traduz a agência e explicita o objeto masculino implícito, contextualizado pelo Senhor.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: foi-nos confirmada
  rationale: A colocação pronominal é digna e corrente, e preserva a direção da confirmação aos destinatários.
theological_decisions:
- issue: Referente de τοῦ κυρίου
  choice: Jesus, designado como “o Senhor”
  alternative: Referência genérica a Deus como senhor
  rationale: A sequência em que a salvação é anunciada pelo Senhor e confirmada por aqueles que o ouviram aponta para a proclamação de Jesus e o testemunho dos seus ouvintes, sem acrescentar ao versículo uma identificação explicativa.
- issue: Força da pergunta de advertência
  choice: Preservar a pergunta retórica no futuro
  alternative: 'Converter em afirmação: “certamente não escaparemos”'
  rationale: A forma interrogativa grega comunica uma advertência severa e implica a impossibilidade de escapar, mas não a formula como declaração direta.
- issue: Valor de ἀμελήσαντες
  choice: 'Condição: “se negligenciarmos”'
  alternative: 'Circunstância participial: “negligenciando” ou “tendo negligenciado”'
  rationale: O valor condicional decorre naturalmente da relação do particípio com a pergunta principal e produz português claro sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “Como escaparemos nós” conserva a ênfase de ἡμεῖς; “foi-nos confirmada” mantém concisão formal sem soar arcaica. A vírgula final foi preservada porque o versículo continua sintaticamente em Hebreus 2:4.
