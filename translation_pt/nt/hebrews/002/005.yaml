id: HEB.2.5
reference: Hebrews 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: pt
  text: Pois não foi aos anjos que ele sujeitou o mundo que há de vir[a], do qual estamos falando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra habitada que há de vir”.'
    reason: Alternativa lexical que torna explícito o sentido mais literal de οἰκουμένη sem substituir a redação mais natural no texto principal.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Pois não
  rationale: “Pois” mantém a ligação explicativa de γάρ com o argumento anterior, enquanto “não” expressa diretamente a negação de οὐ.
- source_word: ἀγγέλοις
  choice: aos anjos
  rationale: No contexto imediato de Hebreus, o termo se refere claramente a seres celestiais, não a mensageiros humanos.
- source_word: ὑπέταξεν
  choice: sujeitou
  rationale: O verbo indica colocar sob autoridade ou domínio; “sujeitou” preserva esse sentido de governo sem paráfrase excessiva.
- source_word: τὴν οἰκουμένην
  choice: o mundo
  rationale: Embora οἰκουμένη possa designar mais literalmente a terra habitada, “o mundo” é natural em português e, com a expressão seguinte, comunica adequadamente o âmbito futuro em vista.
- source_word: τὴν μέλλουσαν
  choice: que há de vir
  rationale: A expressão preserva o valor futuro do particípio e sua possível dimensão escatológica em português claro e digno.
- source_word: περὶ ἧς λαλοῦμεν
  choice: do qual estamos falando
  rationale: A formulação natural preserva tanto a referência ao assunto em pauta quanto o aspecto de discurso em andamento no presente.
theological_decisions:
- issue: Referente de “o mundo que há de vir”
  choice: Um mundo ou ordem futura, sem definir mais precisamente sua relação cronológica com a era presente
  alternative: A terra habitada em geral ou, mais especificamente, a era do evangelho
  rationale: A combinação de οἰκουμένη com μέλλουσαν aponta naturalmente para uma realidade futura. A tradução mantém essa orientação escatológica sem resolver além do texto a natureza exata desse mundo.
- issue: Identidade do sujeito de “sujeitou”
  choice: Manter o pronome “ele” sem explicitar seu referente
  alternative: Explicitar “Deus” como sujeito
  rationale: O grego deixa o sujeito subentendido. Embora o contexto permita identificá-lo, não é necessário inserir um nome ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção focal “não foi aos anjos que” preserva a ênfase contrastiva do dativo colocado antes do verbo no grego.
