  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: pt
  text: Tu o fizeste menor que os anjos por pouco tempo; de glória e honra o coroaste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλάττωσας
  choice: fizeste... menor
  rationale: 'O aoristo ativo de ἐλαττόω tem aqui sentido causativo e comparativo: tornar alguém inferior ou menor em relação a outro. A construção portuguesa com «fazer... menor que» preserva esse valor.'
- source_word: αὐτὸν
  choice: o
  rationale: O pronome objeto masculino singular retoma a figura humana do salmo sem acrescentar um substantivo ausente nesta oração.
- source_word: βραχύ τι
  choice: por um pouco de tempo
  rationale: A expressão pode indicar duração ou grau. No contexto de Hebreus 2, o sentido temporal se ajusta bem à humilhação temporária seguida de exaltação, mas a possibilidade de grau é preservada em nota.
- source_word: παρ’ ἀγγέλους
  choice: que os anjos
  rationale: Após ἐλαττόω, παρά com acusativo introduz o termo da comparação; em português, «menor que os anjos» é natural e preciso.
- source_word: δόξῃ καὶ τιμῇ
  choice: de glória e honra
  rationale: Os dativos indicam aquilo com que a pessoa é coroada. «Coroar de glória e honra» é uma construção portuguesa natural e mantém a associação tradicional dos dois substantivos.
- source_word: ἐστεφάνωσας
  choice: coroaste
  rationale: O aoristo ativo, segunda pessoa do singular, é representado pelo pretérito perfeito simples, adequado ao estilo da citação.
- source_word: αὐτόν
  choice: o
  rationale: O segundo pronome objeto é mantido junto ao verbo «coroaste», preservando a referência explícita do grego.
theological_decisions:
- issue: Sentido de βραχύ τι na citação do Salmo 8 aplicada em Hebreus
  choice: 'Leitura temporal: «por um pouco de tempo»'
  alternative: 'Leitura de grau: «um pouco menor»'
  rationale: O grego admite ambas as leituras. A temporal harmoniza-se fortemente com o desenvolvimento imediato de Hebreus sobre a humilhação e posterior exaltação de Jesus, sem eliminar a leitura de grau, registrada em nota para conservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se «Tu» por se tratar de uma fala dirigida diretamente a Deus e para manter os verbos singulares explícitos da citação; a colocação pronominal e a ordem «de glória e honra o coroaste» conferem solenidade sem obscurecer o sentido.
