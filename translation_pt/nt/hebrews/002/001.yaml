  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: pt
  text: Por isso, devemos prestar ainda mais atenção ao que ouvimos, para não passarmos à deriva[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passemos ao largo” ou “deixemos escapar”. O verbo grego evoca a imagem de passar à deriva ou de algo escapar; no contexto, pode referir-se a nos afastarmos daquilo que ouvimos ou a deixá-lo escapar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do argumento anterior, preservando a ligação lógica e causal.
- source_word: δεῖ
  choice: precisamos
  rationale: Comunica necessidade de maneira clara e firme; a primeira pessoa do plural corresponde a ἡμᾶς, sujeito do infinitivo.
- source_word: περισσοτέρως
  choice: ainda maior
  rationale: Preserva a força comparativa e intensificadora do advérbio em uma combinação idiomática com “prestar atenção”.
- source_word: προσέχειν ἡμᾶς
  choice: precisamos prestar atenção
  rationale: Traduz o sentido de dirigir cuidadosamente a atenção ou dar ouvidos, mantendo a força exortativa.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: ao que ouvimos
  rationale: Forma natural em português para as coisas ou a mensagem ouvida, sem explicitar além do texto que se trata da mensagem proclamada.
- source_word: μήποτε
  choice: para não
  rationale: Introduz de modo idiomático a consequência negativa que a exortação procura evitar.
- source_word: παραρυῶμεν
  choice: nos deixarmos levar para longe
  rationale: Conserva a imagem de um deslocamento gradual e perigoso, semelhante a ser levado pela corrente, sem reduzir o verbo a um afastamento deliberado.
theological_decisions:
- issue: Natureza da advertência metafórica em παραρυῶμεν
  choice: Apresentar os ouvintes como aqueles que podem ser levados para longe.
  alternative: Entender que eles passam à deriva pelo que ouviram, ou que deixam escapar a mensagem.
  rationale: A sintaxe e o contexto de advertência favorecem o movimento perigoso dos ouvintes, mas o verbo admite nuances de passar à deriva ou deixar algo escapar. A tradução mantém a tensão pastoral sem definir um sistema doutrinário sobre apostasia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por isso” evita formalidade desnecessária; “nos deixarmos levar para longe” mantém viva a metáfora sem recorrer a vocabulário técnico ou denominacional.
