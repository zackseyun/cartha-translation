id: HEB.2.14
reference: Hebrews 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: pt
  text: Portanto, visto que os filhos participam de carne e sangue[a], ele próprio também participou, de modo semelhante, dessas mesmas coisas, para que, por meio da morte, reduzisse à impotência[b] aquele que detém o poder da morte, isto é, o diabo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, na ordem grega: “sangue e carne”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “destruísse”. O verbo também pode significar “tornar inoperante”, “neutralizar” ou “abolir”, sem necessariamente indicar aniquilação.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Portanto, visto que
  rationale: Preserva tanto a inferência de οὖν quanto a força causal de ἐπεί, com uma construção natural em português.
- source_word: τὰ παιδία
  choice: os filhos
  rationale: Retoma os filhos mencionados no contexto imediato; é mais adequado ao vínculo expresso na passagem do que «as crianças», sem acrescentar uma interpretação doutrinária.
- source_word: κεκοινώνηκεν
  choice: participam de
  rationale: Expressa a participação comum e o estado resultante indicado pelo perfeito grego, de forma corrente em português.
- source_word: αἵματος καὶ σαρκός
  choice: carne e sangue
  rationale: Emprega a ordem idiomática portuguesa, enquanto a ordem grega, «sangue e carne», é registrada em nota. σάρξ é entendido literalmente como carne, não como suposta natureza pecaminosa.
- source_word: παραπλησίως
  choice: de modo semelhante
  rationale: Indica semelhança estreita e participação humana real, sem transformar o advérbio em uma afirmação de identidade irrestrita.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: participou ... dessas mesmas coisas
  rationale: Mantém a correspondência deliberada com a participação dos filhos, ao mesmo tempo que reflete o verbo grego distinto empregado na segunda oração.
- source_word: ἵνα
  choice: para que
  rationale: Expressa claramente a finalidade.
- source_word: διὰ τοῦ θανάτου
  choice: por meio da morte
  rationale: Torna explícito o valor instrumental de διά com o genitivo.
- source_word: καταργήσῃ
  choice: reduzisse à impotência
  rationale: Comunica a ideia de tornar ineficaz ou destituir de poder, sem sugerir necessariamente aniquilação. A alternativa tradicional «destruísse» é preservada em nota.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: aquele que detém o poder da morte
  rationale: Traduz κράτος como poder ou domínio efetivo e conserva a construção pessoal do grego.
- source_word: τοῦτ’ ἔστι
  choice: isto é
  rationale: Introduz de maneira natural a identificação explicativa.
- source_word: τὸν διάβολον
  choice: o diabo
  rationale: Emprega a designação pessoal estabelecida no uso do Novo Testamento, em vez de uma glosa meramente etimológica.
theological_decisions:
- issue: A participação de Cristo na condição humana
  choice: «ele próprio também participou, de modo semelhante, dessas mesmas coisas»
  alternative: «ele também compartilhou da humanidade deles»
  rationale: A formulação afirma participação real em carne e sangue, preservando o advérbio παραπλησίως e a distinção verbal entre a participação dos filhos e a dele. Evita inserir no versículo uma formulação doutrinária posterior.
- issue: O sentido de καταργήσῃ em relação ao diabo
  choice: «reduzisse à impotência»
  alternative: «destruísse» ou «neutralizasse»
  rationale: Preserva o sentido de tornar inoperante ou destituir de eficácia sem resolver indevidamente a expressão como aniquilação. A leitura tradicional permanece disponível na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem idiomática «carne e sangue» foi preferida no texto, com transparência sobre a ordem grega em nota. «Reduzisse à impotência» conserva a tensão semântica de καταργέω e evita uma conclusão não exigida pelo termo.
