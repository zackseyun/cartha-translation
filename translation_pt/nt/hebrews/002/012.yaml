  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: pt
  text: 'dizendo: “Proclamarei o teu nome aos meus irmãos[a]; no meio da assembleia[b] cantarei louvores a ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”. O grego diz “irmãos”, mas, neste contexto, a referência à família pode incluir todos os demais fiéis.
    reason: lexical_alternative
  - marker: b
    text: Ou “congregação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Particípio presente que introduz a citação; “dizendo” reproduz de modo direto e natural sua função.
- source_word: Ἀπαγγελῶ
  choice: Proclamarei
  rationale: O verbo indica declarar ou dar a conhecer publicamente; “proclamarei” preserva essa força pública e declarativa.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Mantém literalmente “nome”, que no uso bíblico pode abranger caráter, reputação e identidade revelada, sem explicitar no texto o que permanece implícito.
- source_word: τοῖς ἀδελφοῖς μου
  choice: aos meus irmãos
  rationale: Preserva o substantivo masculino plural do grego e a linguagem familiar do contexto; a possível abrangência de homens e mulheres é indicada em nota.
- source_word: ἐν μέσῳ
  choice: no meio de
  rationale: Expressão clara em português que conserva a forma elevada e espacial da citação.
- source_word: ἐκκλησίας
  choice: da assembleia
  rationale: No contexto da citação do Salmo 22, designa o povo reunido; “assembleia” evita impor o sentido institucional posterior que “igreja” pode sugerir.
- source_word: ὑμνήσω
  choice: cantarei louvores
  rationale: O verbo denota louvor expresso em canto; esta formulação natural preserva explicitamente a nuance musical.
- source_word: σε
  choice: a ti
  rationale: Complemento natural de “cantarei louvores” em português, mantendo a referência direta ao destinatário.
theological_decisions:
- issue: Sentido familiar representativo de ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural do grego e a formulação da citação. Como o contexto familiar pode incluir todos os demais fiéis, essa possibilidade é registrada em nota sem resolver além do texto a abrangência do termo.
- issue: Sentido de ἐκκλησία numa citação do Antigo Testamento
  choice: assembleia
  alternative: congregação
  rationale: A passagem evoca o povo de Deus reunido. “Assembleia” preserva o sentido lexical sem importar necessariamente conotações institucionais posteriores.
translation_notes:
  register: Português moderno, claro e digno, com cadência apropriada a uma citação poética. Emprega “teu/ti” de forma coerente e amplamente inteligível. Os marcadores foram associados aos termos a que suas notas efetivamente se referem.
