id: HEB.2.18
reference: Hebrews 2:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: pt
  text: Pois, visto que ele mesmo sofreu quando foi tentado[a], é capaz de ajudar os que estão sendo tentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “posto à prova” nos dois casos: “visto que ele mesmo sofreu quando foi posto à prova, é capaz de ajudar os que estão sendo postos à prova”. O verbo grego pode significar “tentar” ou “pôr à prova”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: visto que
  rationale: A expressão tem valor causal neste contexto, introduzindo a razão pela qual o Filho é capaz de ajudar. “Visto que” comunica essa relação de modo natural e digno.
- source_word: γὰρ
  choice: pois
  rationale: A conjunção introduz a explicação do que foi afirmado anteriormente. “Pois” preserva a ligação argumentativa sem produzir a construção pouco natural “pois porque” em português.
- source_word: πέπονθεν
  choice: sofreu
  rationale: O perfeito de πάσχω aponta para uma experiência concluída cuja relevância permanece. O pretérito perfeito simples é natural em português, e a relevância contínua fica clara pelo resultado expresso na oração principal.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase de que o próprio Filho passou pessoalmente por esse sofrimento.
- source_word: πειρασθείς
  choice: quando foi tentado
  rationale: O particípio circunstancial é expresso naturalmente por uma oração temporal. πειράζω pode significar tanto “tentar” como “pôr à prova”; “tentado” é adequado ao contexto e mantém a ligação com Hebreus 4:15, enquanto a alternativa é registrada em nota.
- source_word: δύναται
  choice: é capaz
  rationale: Expressa claramente a capacidade resultante da experiência do Filho e mantém um registro natural e digno.
- source_word: τοῖς πειραζομένοις
  choice: os que estão sendo tentados
  rationale: A construção preserva o aspecto presente do particípio, indicando pessoas que passam atualmente por tentação ou provação.
- source_word: βοηθῆσαι
  choice: ajudar
  rationale: “Ajudar” comunica de forma clara e corrente o sentido de prestar auxílio ou vir em socorro.
theological_decisions:
- issue: Sentido de πειράζω aplicado a Jesus e aos seres humanos
  choice: tentado
  alternative: posto à prova
  rationale: “Tentado” preserva o sentido neotestamentário comum e a proximidade com Hebreus 4:15, sem sugerir que Jesus tenha cedido ao pecado. Como o verbo também pode indicar prova, a ambiguidade lexical genuína é mantida em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém um tom digno, preserva a ênfase em “ele mesmo” e evita duplicar de modo artificial os dois elementos causais gregos.
