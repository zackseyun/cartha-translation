  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: pt
  text: 'E ainda: “Eu porei nele a minha confiança.”[a] E ainda: “Eis: eu e os filhos que Deus me deu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “Eu estarei confiando nele”; também pode ser entendido como “Eu terei confiança nele”.
    reason: lexical_alternative
  - marker: b
    text: O grego deste versículo não identifica o falante; no contexto, Hebreus aplica estas citações ao Filho.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: E ainda
  rationale: Mantém a fórmula concisa que introduz outra citação, sem acrescentar um verbo como “diz”, ausente do grego.
- source_word: Ἐγὼ ἔσομαι πεποιθὼς
  choice: Eu porei a minha confiança
  rationale: Expressa em português natural a construção perifrástica formada pelo futuro de εἰμί e o particípio perfeito de πείθω, comunicando uma postura firme de confiança.
- source_word: ἐπ’ αὐτῷ
  choice: nele
  rationale: Com o verbo “confiar” e a expressão “pôr a confiança”, “nele” transmite naturalmente o sentido da preposição grega.
- source_word: Ἰδοὺ ἐγὼ
  choice: Eis-me aqui, eu
  rationale: Preserva a força apresentativa de ἰδού e a ênfase do pronome explícito ἐγώ, em registro digno e compreensível.
- source_word: τὰ παιδία
  choice: os filhos
  rationale: No contexto da citação, designa as crianças dadas por Deus ao falante em uma relação filial; “filhos” é a formulação portuguesa mais natural aqui.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: que Deus me deu
  rationale: Reproduz naturalmente a oração relativa e o aoristo ἔδωκεν, sem impor ao verbo um aspecto perfeito que o grego não explicita.
theological_decisions:
- issue: Voz cristológica das citações
  choice: Manter as citações na primeira pessoa sem identificar o falante no texto principal.
  alternative: Acrescentar “ele diz” ou “o Filho diz”.
  rationale: O contexto de Hebreus aplica as citações ao Filho, mas o grego deste versículo não nomeia o falante nem contém um verbo de elocução. A tradução preserva essa forma e registra a aplicação contextual em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. As fórmulas de citação permanecem concisas, e “Eis-me aqui” conserva o tom elevado do texto citado sem soar arcaico em excesso.
