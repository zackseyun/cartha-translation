  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: pt
  text: Por isso, ele teve de se tornar semelhante em tudo aos seus irmãos[a], para que se tornasse um sumo sacerdote misericordioso e fiel no que diz respeito a Deus, para fazer expiação pelos pecados do povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus irmãos e irmãs”. O grego diz “irmãos”, termo familiar masculino plural que, neste contexto, pode abranger homens e mulheres.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “expiar os pecados do povo” ou, em linguagem técnica, “fazer propiciação pelos pecados do povo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural a inferência que decorre do argumento anterior.
- source_word: ὤφειλεν
  choice: teve de
  rationale: Comunica necessidade ou obrigação real no propósito salvador de Deus, sem sugerir coerção externa.
- source_word: κατὰ πάντα
  choice: em tudo
  rationale: Preserva de forma concisa o alcance abrangente da semelhança.
- source_word: τοῖς ἀδελφοῖς
  choice: aos seus irmãos
  rationale: Mantém o substantivo familiar masculino plural do grego e sua ligação com o contexto; a possível abrangência inclusiva é esclarecida em nota.
- source_word: ὁμοιωθῆναι
  choice: se tornar semelhante
  rationale: Formulação natural que comunica a entrada plena na condição humana compartilhada, sem apagar a forma passiva do conceito de semelhança.
- source_word: ἵνα
  choice: para
  rationale: Introduz claramente a finalidade da semelhança com os irmãos.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Equivalente corrente que preserva a dimensão sacerdotal e relacional da misericórdia.
- source_word: πιστὸς
  choice: fiel
  rationale: Expressa adequadamente confiabilidade e fidelidade no exercício sacerdotal.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Título cultual consagrado, claro e diretamente correspondente ao grego.
- source_word: τὰ πρὸς τὸν θεόν
  choice: nas coisas referentes a Deus
  rationale: Preserva a expressão sacerdotal relativamente formal e sua referência à esfera do serviço diante de Deus.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: a fim de fazer expiação por
  rationale: Comunica de maneira acessível a ação sacerdotal de lidar com os pecados, sem decidir na tradução principal entre propiciação e expiação.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: pelos pecados do povo
  rationale: Reproduz naturalmente o objeto da ação expiatória e a referência coletiva ao povo.
theological_decisions:
- issue: Sentido de ἱλάσκεσθαι no contexto da obra sacerdotal
  choice: fazer expiação pelos pecados do povo
  alternative: propiciar ou expiar os pecados do povo
  rationale: “Fazer expiação” é compreensível e amplo o bastante para preservar a tensão entre a remoção do pecado e a satisfação relacionada à ira divina; as alternativas técnicas ficam registradas em nota.
- issue: Abrangência de ἀδελφοῖς
  choice: seus irmãos
  alternative: seus irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina plural do texto grego, enquanto a nota informa que, conforme o contexto familiar, o termo pode abranger homens e mulheres.
- issue: Necessidade expressa por ὤφειλεν
  choice: teve de
  alternative: era necessário que
  rationale: A formulação afirma uma necessidade ligada ao propósito salvador e à solidariedade humana de Cristo sem especificar uma fonte externa de coerção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a progressão lógica e as duas expressões de finalidade do grego. O vocabulário sacerdotal tradicional é mantido onde continua claro, e a ambiguidade teológica de ἱλάσκεσθαι é preservada por nota.
