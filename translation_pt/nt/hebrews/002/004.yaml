  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: pt
  text: enquanto Deus também dava testemunho por meio de sinais, maravilhas, diversos milagres[a] e distribuições do Espírito Santo[b], conforme a sua vontade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diversas manifestações de poder” ou “diversas obras poderosas”. O termo grego pode indicar manifestações de poder e, neste contexto, obras milagrosas.
    reason: lexical_alternative
  - marker: b
    text: Ou “repartições” ou “porções do Espírito Santo”. O texto não acrescenta explicitamente a palavra “dons”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: enquanto Deus também dava testemunho
  rationale: O particípio genitivo expressa uma ação concomitante à do versículo anterior. “Também” preserva a força aditiva do prefixo συν-, e o imperfeito “dava testemunho” comunica naturalmente a ação em andamento no contexto passado.
- source_word: σημείοις τε καὶ τέρασιν
  choice: por meio de sinais, maravilhas
  rationale: Os dativos indicam o meio pelo qual Deus testemunhava. “Sinais e maravilhas” é uma combinação bíblica consagrada, clara e fiel ao caráter probatório e assombroso desses atos.
- source_word: ποικίλαις δυνάμεσιν
  choice: diversos milagres
  rationale: Neste contexto, δύναμις designa manifestações ou obras de poder sobrenatural. “Milagres” comunica esse sentido contextual, enquanto a nota preserva as alternativas mais formais.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: Reproduz de modo direto e corrente o genitivo grego e o título pessoal presente no texto.
- source_word: μερισμοῖς
  choice: distribuições
  rationale: O substantivo indica distribuições, repartições ou porções. Evita-se acrescentar “dons”, palavra que não aparece explicitamente no grego.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: conforme a sua vontade
  rationale: Expressa conformidade com a vontade referida no grego. A formulação portuguesa é natural e não acrescenta explicações à frase.
theological_decisions:
- issue: Referente de αὐτοῦ em “conforme a sua vontade”
  choice: Mantida a formulação “a sua vontade”, cujo referente mais natural no contexto é Deus.
  alternative: Entender o pronome de maneira mais próxima como referência ao Espírito Santo.
  rationale: Deus é o sujeito controlador do particípio e é quem testemunha por todos os meios enumerados; por isso, sua vontade é o referente sintaticamente mais provável. A tradução, porém, não introduz uma explicitação ausente do grego.
- issue: Sentido de πνεύματος ἁγίου
  choice: Espírito Santo
  alternative: espírito santo
  rationale: A expressão funciona aqui como o título reconhecível do Espírito Santo. A tradução preserva a formulação do texto sem acrescentar elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Por meio de” explicita naturalmente o valor instrumental dos dativos; a sequência mantém o ritmo enumerativo do grego e evita acrescentar “dons” ao texto principal.
