id: HEB.2.11
reference: Hebrews 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: pt
  text: Pois tanto aquele que santifica como os que estão sendo santificados, todos procedem de um só[a]. Por essa razão, ele não se envergonha de chamá-los irmãos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procedem de um só Pai”, “têm uma só origem” ou “procedem de um só antepassado”. O grego não especifica a quem ou a que “um só” se refere.
    reason: alternative_reading
  - marker: b
    text: “Irmãos” traduz o plural masculino ἀδελφοὺς; neste contexto, o termo pode abranger a família mais ampla dos fiéis, incluindo as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: aquele que santifica
  rationale: O particípio presente ativo substantivado identifica quem realiza a ação. “Santifica” preserva o vocabulário teológico corrente e mantém correspondência lexical com a forma passiva seguinte.
- source_word: οἱ ἁγιαζόμενοι
  choice: os que estão sendo santificados
  rationale: O particípio presente passivo permite apresentar a ação em curso. A formulação conserva tanto a voz passiva quanto a ligação lexical com ἁγιάζων.
- source_word: ἐξ ἑνὸς
  choice: procedem de um só
  rationale: O grego não explicita o referente de “um”. “Procedem de um só” soa natural em português sem acrescentar “Pai”, “origem” ou “antepassado”, preservando a ambiguidade genuína.
- source_word: πάντες
  choice: todos
  rationale: Mantém a inclusão enfática daquele que santifica e dos santificados; o verbo “procedem”, necessário em português, explicita apenas a relação já implícita na construção.
- source_word: δι’ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Equivalente natural do idioma causal-consecutivo e conecta claramente a afirmação seguinte à origem comum mencionada antes.
- source_word: οὐκ ἐπαισχύνεται
  choice: não se envergonha
  rationale: Expressão portuguesa corrente que preserva a dimensão de vergonha e honra do verbo grego.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: Reproduz o substantivo masculino plural do texto. No contexto, o termo pode abranger a comunidade de fiéis, inclusive mulheres; isso é esclarecido em nota sem substituir a forma lexical do original.
- source_word: καλεῖν
  choice: de chamá-los
  rationale: Construção idiomática em português depois de “não se envergonha”, com o pronome retomando os santificados.
theological_decisions:
- issue: Referente de ἐξ ἑνὸς (“de um só”)
  choice: Manter o referente sem especificação no texto principal.
  alternative: “de um só Pai”, “de uma só origem” ou “de um só antepassado”
  rationale: Embora várias identificações sejam contextualmente possíveis, o grego emprega apenas o numeral substantivado e não nomeia o referente. Especificá-lo resolveria indevidamente uma tensão interpretativa.
- issue: Identidade do sujeito implícito de οὐκ ἐπαισχύνεται
  choice: Usar “ele”, cuja identidade é indicada pelo contexto.
  alternative: Explicitar “Jesus” ou “o Filho”
  rationale: O contexto identifica aquele que santifica com o Filho, mas o versículo usa sujeito implícito. “Ele” preserva a coesão contextual sem inserir um nome ausente desta oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “santifica/santificados” conserva o vínculo lexical do original. “Procedem de um só” evita uma formulação truncada em português e mantém sem solução o referente de ἐξ ἑνὸς. A pontuação final conserva a continuidade sintática com o versículo seguinte.
