id: HEB.2.8
reference: Hebrews 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: pt
  text: “Sujeitaste todas as coisas debaixo dos pés dele.”[a] Pois, ao lhe sujeitar todas as coisas,[b] não deixou nada que não lhe estivesse sujeito. Contudo, agora ainda não vemos todas as coisas sujeitas a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os pronomes “dele”, “lhe” e “ele” retomam o Salmo 8. No contexto, podem apontar para a humanidade no sentido original do salmo e para Jesus na aplicação feita em Hebreus.
    reason: cross_reference
  - marker: b
    text: 'Ou: “quando lhe sujeitou todas as coisas”. A construção grega também pode ser entendida em sentido mais claramente temporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: todas as coisas
  rationale: O neutro plural tem alcance abrangente. “Todas as coisas” preserva essa universalidade e soa natural em português.
- source_word: ὑπέταξας
  choice: sujeitaste
  rationale: O aoristo ativo retoma a linguagem do Salmo 8. “Sujeitaste” mantém o campo semântico de subordinação e concorda com a segunda pessoa do texto citado.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: debaixo dos pés dele
  rationale: Expressão corrente de domínio e sujeição, preservando a alusão ao Salmo 8 sem explicitar o referente do pronome.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: ao lhe sujeitar
  rationale: O infinitivo articular com ἐν admite valor circunstancial ou temporal. A formulação portuguesa é fluente e conserva certa abertura entre “ao sujeitar” e “quando sujeitou”.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação lógica da citação precedente e mantém o encadeamento argumentativo.
- source_word: οὐδὲν ἀφῆκεν
  choice: não deixou nada
  rationale: Equivalente idiomático que preserva a afirmação absoluta do grego.
- source_word: ἀνυπότακτον
  choice: que não lhe estivesse sujeito
  rationale: Expressa com clareza o adjetivo predicativo e retém a repetição do campo lexical de ὑποτάσσω.
- source_word: νῦν δὲ
  choice: Contudo, agora
  rationale: Marca com nitidez o contraste entre a declaração das Escrituras e aquilo que se observa no presente.
- source_word: οὔπω ὁρῶμεν
  choice: ainda não vemos
  rationale: Comunica o estado presente de cumprimento ainda não visível, em ordem natural no português.
- source_word: ὑποτεταγμένα
  choice: sujeitas
  rationale: O particípio perfeito passivo descreve o estado resultante da sujeição. “Sujeitas” transmite esse estado sem tornar a frase pesada.
theological_decisions:
- issue: Referente de αὐτοῦ / αὐτῷ
  choice: Manter os pronomes “dele”, “lhe” e “ele” sem identificar expressamente o referente no corpo do versículo.
  alternative: Explicitar “a humanidade/o ser humano” conforme o sentido original do Salmo 8, ou “Jesus/o Filho” conforme a aplicação cristológica de Hebreus.
  rationale: A exposição parte do sentido do Salmo 8 sobre a humanidade e avança para sua aplicação culminante a Jesus. Manter os pronomes preserva a ambiguidade genuína e a tensão teológica do argumento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão “Sujeitaste todas as coisas” conserva o tom de citação bíblica sem recorrer a linguagem arcaica. A repetição de “sujeitar/sujeito/sujeitas” reproduz deliberadamente a coesão lexical do grego.
