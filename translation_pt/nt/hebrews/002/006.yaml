reference: Hebrews 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: pt
  text: 'Mas, em certo lugar, alguém testemunhou, dizendo:


    “Que é o ser humano, para que te lembres dele[a],

    ou o filho do homem[b], para que cuides dele[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em formulação mais tradicional, “tenhas em mente”.
    reason: lexical_alternative
  - marker: b
    text: “O filho do homem” retoma o Salmo 8:4, onde é uma expressão poética referente ao ser humano; em Hebreus, o contexto mais amplo também dá à passagem relevância para Jesus.
    reason: cross_reference
  - marker: c
    text: Ou “o visites” ou “olhes por ele”. O verbo grego pode indicar atenção cuidadosa demonstrada por meio de visita ou cuidado.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: testemunhou
  rationale: O verbo indica dar testemunho, por vezes com ênfase ou solenidade. “Testemunhou” preserva essa força sem tornar a introdução excessivamente formal.
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao argumento anterior; “Mas” torna essa relação clara e natural em português.
- source_word: πού τις
  choice: em certo lugar, alguém
  rationale: A combinação introduz uma citação conhecida sem nomear sua localização nem seu autor humano. A formulação é idiomática em português e não sugere necessariamente desconhecimento.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Que é o ser humano
  rationale: ἄνθρωπος é singular e representativo, referindo-se à humanidade. “O ser humano” conserva o singular poético e comunica com clareza o sentido genérico.
- source_word: ὅτι μιμνῄσκῃ αὐτοῦ
  choice: para que te lembres dele
  rationale: O verbo significa lembrar-se ou manter alguém em mente. “Te lembres dele” é corrente, claro e próximo da forma grega.
- source_word: υἱὸς ἀνθρώπου
  choice: o filho do homem
  rationale: A expressão retém a forma do texto grego e a ressonância literária do Salmo 8, sem eliminar sua referência poética à humanidade nem transformá-la explicitamente em título messiânico.
- source_word: ὅτι ἐπισκέπτῃ αὐτόν
  choice: para que cuides dele
  rationale: ἐπισκέπτομαι pode denotar visitar, olhar por ou cuidar com atenção. Neste contexto poético, “cuides dele” expressa naturalmente a preocupação ativa implicada pelo verbo.
theological_decisions:
- issue: Se “filho do homem” deve ser apresentado explicitamente como título messiânico
  choice: Manter “o filho do homem” em minúsculas, como aparece na citação poética.
  alternative: Empregar “o Filho do Homem” como título cristológico, ou substituir a expressão por “o ser humano”.
  rationale: No Salmo 8, a expressão é paralela a “ser humano” e se refere poeticamente à humanidade. O contexto mais amplo de Hebreus também a relaciona com Jesus. A redação preserva essa tensão e não antecipa uma resolução interpretativa no próprio versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “em certo lugar, alguém” soa natural e mantém a indefinição deliberada do grego. O paralelismo poético da citação foi disposto em linhas, e “filho do homem” foi preservado sem capitalização para não impor antecipadamente uma leitura titular.
