id: HEB.9.25
reference: Hebrews 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: pt
  text: nem para oferecer a si mesmo muitas vezes, como o sumo sacerdote entra nos lugares santos[a], ano após ano, com sangue que não é o seu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no santuário”. O grego diz literalmente “nos lugares santos”; neste contexto cultual, alguns entendem a expressão mais especificamente como “no Santo dos Santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: nem para
  rationale: Dá continuidade natural, em português, à negação e à ideia de finalidade do versículo anterior, sem transformar o fragmento em uma frase independente.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Reproduz diretamente a repetição que será contrastada com a entrada anual do sumo sacerdote.
- source_word: προσφέρῃ ἑαυτόν
  choice: oferecer a si mesmo
  rationale: Preserva tanto o sentido sacrificial de προσφέρω quanto a força reflexiva de ἑαυτόν.
- source_word: ὥσπερ
  choice: como
  rationale: Introduz de maneira clara e natural a comparação com o sumo sacerdote levítico.
- source_word: ὁ ἀρχιερεὺς
  choice: o sumo sacerdote
  rationale: É a designação portuguesa consagrada e precisa para esse ofício cultual judaico.
- source_word: εἰσέρχεται
  choice: entra
  rationale: Mantém o presente do grego, que descreve uma prática habitual.
- source_word: εἰς τὰ ἅγια
  choice: nos lugares santos
  rationale: Conserva o plural do grego e evita especificar no texto principal se a expressão designa o santuário em geral ou, mais particularmente, o Santo dos Santos.
- source_word: κατ’ ἐνιαυτὸν
  choice: ano após ano
  rationale: Expressa com naturalidade o padrão anual reiterado, importante para o contraste do contexto.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: com sangue que não é o seu
  rationale: Comunica o valor instrumental de ἐν e o sentido de ἀλλότριος como aquilo que pertence a outro, destacando o contraste com Cristo oferecer a si mesmo.
theological_decisions:
- issue: Referente da comparação entre Cristo e o sumo sacerdote levítico
  choice: O texto contrasta a oferta que Cristo faz de si mesmo, não repetida muitas vezes, com a entrada anual reiterada do sumo sacerdote usando sangue que não é o seu.
  alternative: Entender “os lugares santos” mais especificamente como o recinto interior, isto é, o Santo dos Santos.
  rationale: O contexto imediato ressalta o caráter não repetitivo da oferta de Cristo em contraste com o ministério cultual anual. A tradução mantém esse contraste sem acrescentar formulações doutrinárias posteriores e deixa aberta a abrangência exata de τὰ ἅγια.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura permanece ligada ao versículo anterior, como no grego; por isso, começa com letra minúscula e termina com vírgula. O marcador da nota foi colocado após “lugares santos”, expressão à qual a nota pertence.
