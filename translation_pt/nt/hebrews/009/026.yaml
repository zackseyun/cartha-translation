id: HEB.9.26
reference: Hebrews 9:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: pt
  text: Caso contrário, ele teria de sofrer muitas vezes desde a fundação do mundo. Mas agora, na consumação das eras[a], ele se manifestou uma vez por todas para remover o pecado[b] por meio do sacrifício de si mesmo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no fim das eras”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para anular o pecado” ou “para pôr de lado o pecado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “por meio do seu sacrifício”. O grego pode ser entendido mais literalmente como “por meio do sacrifício de si mesmo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Caso contrário
  rationale: No argumento, introduz a consequência hipotética de uma oferta repetida de Cristo; esta expressão comunica naturalmente esse valor inferencial em português.
- source_word: ἔδει αὐτὸν ... παθεῖν
  choice: ele teria de sofrer
  rationale: O imperfeito de δεῖ, neste raciocínio de caráter condicional, indica uma necessidade hipotética; o futuro do pretérito preserva essa nuance.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Mantém o contraste explícito com ἅπαξ, traduzido adiante por “uma vez por todas”.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: A preposição tem sentido temporal, indicando o período que se estende desde a fundação do mundo.
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Marca o forte contraste entre a situação hipotética anterior e o que de fato ocorreu.
- source_word: ἅπαξ
  choice: uma vez por todas
  rationale: No contexto sacrificial de Hebreus, ressalta tanto a singularidade quanto o caráter definitivo e não repetível da manifestação e oferta de Cristo.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: na consumação das eras
  rationale: Preserva o plural de αἰῶνες e o sentido de culminação de συντέλεια, sem reduzi-lo apenas a um término cronológico.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: para remover o pecado
  rationale: Expressa em linguagem clara a finalidade de pôr de lado ou anular o pecado, preservando o singular coletivo do grego.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: por meio do sacrifício de si mesmo
  rationale: Explicita, de acordo com o contexto da auto-oferta de Cristo, que ele próprio é o sacrifício; uma nota registra a tradução formalmente possível “por meio do seu sacrifício”.
- source_word: πεφανέρωται
  choice: ele se manifestou
  rationale: Traduz o perfeito grego como um acontecimento consumado de relevância duradoura; o pretérito perfeito simples evita em português brasileiro a leitura iterativa que “tem se manifestado” poderia sugerir.
theological_decisions:
- issue: Força de ἅπαξ na obra sacrificial de Cristo
  choice: uma vez por todas
  alternative: uma vez
  rationale: O contraste imediato com “muitas vezes” e o desenvolvimento do argumento em Hebreus favorecem uma formulação que expresse a definitividade da oferta sem acrescentar uma conclusão externa ao texto.
- issue: Sentido de ἀθέτησις aplicado ao pecado
  choice: remover o pecado
  alternative: anular o pecado
  rationale: “Remover” é claro e natural, enquanto a nota preserva a força lexical possível de anulação ou supressão sem obrigar o texto principal a uma formulação excessivamente técnica.
- issue: Número e alcance de ἁμαρτίας
  choice: o pecado
  alternative: os pecados
  rationale: O singular grego apresenta o pecado como realidade coletiva ou poder enfrentado pelo sacrifício de Cristo; mantê-lo evita restringir o sentido a uma lista de atos individuais.
- issue: Relação de αὐτοῦ com θυσίας
  choice: o sacrifício de si mesmo
  alternative: o seu sacrifício
  rationale: O contexto imediato da auto-oferta favorece a leitura segundo a qual Cristo é aquilo que se oferece, mas a alternativa gramatical mais geral permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Consumação das eras” conserva a densidade escatológica e o plural do original; a nota oferece uma alternativa mais corrente. A ordem pronominal em “ele se manifestou” é natural no português brasileiro sem perder solenidade.
