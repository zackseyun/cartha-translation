  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: pt
  text: referentes apenas a alimentos, bebidas e diversas lavagens, prescrições externas impostas até o tempo da reforma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até o tempo de pôr tudo em ordem».'
    reason: Registra uma formulação explicativa possível para διορθώσεως, cujo sentido básico inclui correção, reforma ou pôr em ordem.
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: lavagens
  rationale: No plural e neste contexto ritual, o termo se refere a diferentes abluções ou lavagens cerimoniais, não especificamente ao batismo cristão.
- source_word: δικαιώματα σαρκὸς
  choice: prescrições relativas à carne
  rationale: Conserva a referência explícita à carne e evita restringir prematuramente a expressão a algo apenas físico ou externo.
- source_word: διορθώσεως
  choice: restauração
  rationale: Expressa a ideia de corrigir ou pôr em ordem, mantendo o sentido de uma mudança ordenadora no tempo estabelecido.
theological_decisions:
- issue: Alcance de «carne» em δικαιώματα σαρκὸς
  choice: prescrições relativas à carne
  alternative: prescrições externas
  rationale: A tradução escolhida preserva a formulação e a tensão teológica do grego, sem interpretar «carne» exclusivamente como exterioridade ritual.
- issue: Sentido escatológico de καιροῦ διορθώσεως
  choice: tempo da restauração
  alternative: tempo de pôr tudo em ordem
  rationale: «Restauração» mantém aberta a extensão exata da mudança em vista, enquanto a nota registra uma formulação mais idiomática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O travessão explicita a aposição de «prescrições relativas à carne» sem alterar a relação sintática do grego. Como o versículo continua a frase anterior, inicia-se com letra minúscula.
