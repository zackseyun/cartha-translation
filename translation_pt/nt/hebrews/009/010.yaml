  verdict: revise
  source_fidelity: 'A estrutura geral é bem captada: o versículo limita essas práticas a alimentos, bebidas e diversas lavagens, e as situa até um tempo determinado. Contudo, «prescrições relativas à carne» normalmente significa, em português, prescrições a respeito de carne (inclusive alimento), não «regulamentos carnais/físicos» como δικαιώματα σαρκὸς. «Reforma» é a equivalência mais direta e menos interpretativa para διορθώσεως neste contexto.'
  naturalness: «tratam apenas de» é compreensível como continuação da frase anterior, mas «referentes apenas a» torna mais clara a relação com «prescrições». A redação revista permanece em minúscula por continuar o período iniciado no versículo anterior.
  terminology: «Lavagens» representa adequadamente βαπτισμοῖς no contexto ritual. «Prescrições externas» comunica o valor de σαρκὸς como qualificação de regulamentos ligados à esfera corporal/ritual, sem sugerir que sejam regras sobre carne. «Tempo da reforma» corresponde de perto a καιρὸς διορθώσεως e evita especificar indevidamente o alcance da mudança.
  issues:
  - severity: medium
    issue: «prescrições relativas à carne» desloca o sentido de δικαιώματα σαρκὸς
    rationale: Em uso português normal, «relativas à carne» indica objeto ou assunto das prescrições; no grego, σαρκὸς caracteriza as prescrições como pertencentes à esfera da carne/corpo. «Prescrições externas» é uma solução idiomática contextual que não cria essa ambiguidade.
  - severity: low
    issue: «restauração» para διορθώσεως é menos preciso
    rationale: διορθώσεως denota correção, endireitamento ou reforma. «Restauração» pode ser possível em certos contextos, mas aqui introduz mais facilmente a noção de retorno a um estado anterior.
  revised_text: referentes apenas a alimentos, bebidas e diversas lavagens, prescrições externas impostas até o tempo da reforma.[a]
