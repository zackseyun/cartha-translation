  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: pt
  text: 'dizendo: “Este é o sangue da aliança que Deus ordenou para vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio presente que introduz a citação e mantém sua ligação sintática com a ação do versículo anterior.
- source_word: Τοῦτο
  choice: Este é
  rationale: O grego omite a cópula, naturalmente subentendida; em português, “Este é” expressa a predicação de modo claro e minimamente interpretativo.
- source_word: αἷμα
  choice: sangue
  rationale: Equivalente direto que conserva a imagem concreta do sangue sacrificial na ratificação da aliança.
- source_word: διαθήκης
  choice: aliança
  rationale: No contexto da alusão a Êxodo 24:8, o termo designa uma aliança, não um testamento.
- source_word: ἧς
  choice: que
  rationale: O pronome relativo retoma “aliança”; a construção portuguesa “que Deus ordenou” comunica naturalmente a relação gramatical sem tornar a frase excessivamente literal.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: Expressa de forma corrente e digna o sentido de dar uma ordem ou determinação.
- source_word: πρὸς ὑμᾶς
  choice: para vocês
  rationale: A preposição πρός com acusativo indica aqui a direção ou referência da ordem divina ao povo; “para vocês” é natural em português e preserva essa orientação sem definir além do necessário.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução padrão e direta, sem necessidade de ampliar o título.
theological_decisions:
- issue: Sentido de διαθήκη no contexto da ratificação pelo sangue
  choice: aliança
  alternative: testamento
  rationale: A citação remete a Êxodo 24:8 e à ratificação da aliança mosaica. “Testamento” introduziria um sentido jurídico posterior inadequado ao pano de fundo imediato.
- issue: Cópula implícita depois de Τοῦτο
  choice: Este é o sangue da aliança
  alternative: Este, o sangue da aliança
  rationale: O grego permite omitir a cópula, mas o português corrente pede “é” para tornar clara a predicação, sem acrescentar conteúdo teológico.
- issue: Relação de πρὸς ὑμᾶς com a ordem divina
  choice: que Deus ordenou para vocês
  alternative: que Deus ordenou a vocês
  rationale: “Para vocês” comunica naturalmente que a aliança ordenada se dirige ao povo. “A vocês” permanece possível, mas pode soar como se “aliança” fosse simplesmente o objeto comunicado, em vez de realçar sua referência aos destinatários.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém-se o particípio “dizendo” e a terminologia bíblica corrente “sangue da aliança”; “vocês” oferece tratamento plural natural e amplamente inteligível.
