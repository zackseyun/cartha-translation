id: HEB.9.4
reference: Hebrews 9:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: pt
  text: que tinha o altar de incenso de ouro[a] e a arca da aliança revestida de ouro por todos os lados. Nela estavam um vaso de ouro contendo o maná, a vara de Arão que brotou e as tábuas da aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o incensário de ouro”. O termo grego pode designar um utensílio para queimar incenso e seu sentido aqui é discutido.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: que tinha o altar de incenso de ouro
  rationale: Mantém a construção participial em ligação com a tenda mencionada no contexto e entende θυμιατήριον como o altar ligado ao incenso. A expressão portuguesa é natural, enquanto a alternativa lexical genuína é registrada em nota.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: a arca da aliança
  rationale: É a designação consagrada, clara e exata para o cofre sagrado; διαθήκη tem aqui o sentido de aliança.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: revestida de ouro por todos os lados
  rationale: Expressa tanto o revestimento quanto a abrangência indicada por πάντοθεν, sem sugerir que a arca fosse inteiramente de ouro maciço.
- source_word: ἐν ᾗ
  choice: Nela estavam
  rationale: O pronome relativo retoma a arca. A formulação inicia uma nova frase para dar clareza à enumeração, sem alterar a relação sintática.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: um vaso de ouro contendo o maná
  rationale: Vaso é um termo amplo e natural para στάμνος; contendo traduz de modo conciso ἔχουσα, e o artigo de τὸ μάννα é preservado.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: a vara de Arão que brotou
  rationale: Vara é a equivalência corrente de ῥάβδος neste relato, e que brotou preserva a referência ao acontecimento passado sem explicação adicional.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: as tábuas da aliança
  rationale: Traduz diretamente πλάκες e mantém aliança para διαθήκη. Não se acrescenta 'de pedra', pois isso não está explícito neste versículo.
theological_decisions:
- issue: Sentido de θυμιατήριον na descrição do santuário
  choice: altar de incenso
  alternative: incensário
  rationale: O termo grego pode designar um objeto usado para queimar incenso e, neste contexto, é tradicionalmente entendido tanto como altar de incenso quanto como incensário. O texto principal adota o referente cultual considerado mais provável, mas a nota preserva a ambiguidade lexical e a tensão suscitada pela disposição dos objetos do tabernáculo.
- issue: Relação dos objetos enumerados com a arca
  choice: Nela estavam
  alternative: junto dela estavam
  rationale: ἐν ᾗ significa literalmente 'na qual' e retoma a arca. A tradução mantém essa afirmação do texto, embora sua relação com descrições veterotestamentárias seja discutida, sem harmonizá-la por meio de uma expressão espacial diferente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma enumeração excessivamente pesada. Termos bíblicos reconhecíveis, como “arca da aliança”, “maná” e “tábuas da aliança”, foram mantidos sem arcaísmos desnecessários.
