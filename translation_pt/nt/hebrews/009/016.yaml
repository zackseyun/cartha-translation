id: HEB.9.16
reference: Hebrews 9:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: pt
  text: Pois, onde há uma aliança[a], é necessário que seja apresentada a morte daquele que a estabeleceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, onde há um testamento, é necessário comprovar a morte do testador.” A palavra grega traduzida por “aliança” também pode significar “testamento”, e muitos entendem os versículos 16–17 nesse sentido jurídico.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: aliança
  rationale: O contexto amplo de Hebreus 8–10 é dominado pela nova aliança e por sua inauguração sacrificial. O sentido jurídico de “testamento” continua possível e é registrado em nota.
- source_word: θάνατον
  choice: morte
  rationale: Equivalente direto e natural; refere-se à morte efetiva exigida no argumento.
- source_word: ἀνάγκη
  choice: é necessário
  rationale: Expressa de modo idiomático em português a necessidade indicada pelo substantivo predicativo grego.
- source_word: φέρεσθαι
  choice: seja apresentada
  rationale: Preserva o valor passivo de “ser trazida/apresentada” e a ideia de que a morte deve ser posta em evidência, sem acrescentar explicitamente a noção de comprovação.
- source_word: τοῦ διαθεμένου
  choice: daquele que a estabeleceu
  rationale: Traduz o particípio como referência à pessoa que instituiu a aliança, mantendo sua relação com διαθήκη sem impor no texto principal o termo jurídico “testador”.
- source_word: ὅπου γὰρ
  choice: Pois, onde
  rationale: Mantém tanto a função explicativa de γάρ quanto a relação locativa de ὅπου em português natural.
theological_decisions:
- issue: Se διαθήκη em Hebreus 9:16 significa “aliança” ou “testamento”
  choice: aliança no texto principal
  alternative: testamento na nota
  rationale: O discurso circundante trata da aliança, mas os versículos 16–17 admitem uma leitura jurídica testamentária. A tradução principal mantém a coerência contextual, e a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Seja apresentada” mantém a formulação incomum e deliberadamente aberta do grego; “estabeleceu” identifica de modo natural quem instituiu a aliança.
