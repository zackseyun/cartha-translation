  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: pt
  text: Acima dela estavam os querubins da glória, que cobriam com sua sombra o propiciatório[a]. Sobre essas coisas, não é possível falar agora em detalhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a tampa da arca, tradicionalmente chamada de «assento da misericórdia»; estava associada ao rito de expiação.
    reason: Esclarece o referente concreto de ἱλαστήριον neste contexto do santuário, sem importar para o versículo sentidos debatidos em outros contextos.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Acima dela
  rationale: Mantém a relação espacial e o pronome feminino, que retoma naturalmente a arca mencionada no contexto anterior.
- source_word: Χερουβὶν δόξης
  choice: os querubins da glória
  rationale: Preserva a forma compacta e deliberadamente ambígua do genitivo grego, sem reduzi-lo a apenas “gloriosos”.
- source_word: κατασκιάζοντα
  choice: que cobriam com sua sombra
  rationale: 'Expressa em português corrente a imagem espacial do particípio: os querubins se estendiam sobre o propiciatório e o sombreavam.'
- source_word: τὸ ἱλαστήριον
  choice: o propiciatório
  rationale: Neste contexto, o termo designa concretamente a tampa da arca. “Propiciatório” preserva sua associação cultual com a expiação; a nota esclarece o objeto para leitores modernos e registra alternativas sem transformar a peça do santuário em um sacrifício.
- source_word: περὶ ὧν
  choice: Sobre essas coisas
  rationale: O relativo neutro plural remete de modo abrangente aos elementos do santuário mencionados, não somente aos querubins.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: não é possível falar agora em detalhe
  rationale: Reproduz a impossibilidade ou inadequação presente indicada pela expressão e traduz κατὰ μέρος idiomaticamente como tratamento detalhado.
theological_decisions:
- issue: Sentido de ἱλαστήριον no cenário do santuário
  choice: propiciatório
  alternative: sacrifício expiatório; tampa da arca; lugar de expiação
  rationale: A referência imediata é a peça física sobre a arca, sombreada pelas asas dos querubins. “Propiciatório” mantém tanto esse referente cultual quanto a ligação lexical com a expiação, enquanto a nota preserva explicações e traduções alternativas.
- issue: Relação dos querubins com a glória
  choice: querubins da glória
  alternative: querubins gloriosos
  rationale: O genitivo δόξης pode caracterizar os querubins ou associá-los à glória divina. A formulação literal conserva essa tensão em vez de decidir por uma única análise.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva “querubins” e “propiciatório” como vocabulário bíblico estabelecido, explicando o termo técnico em nota. O marcador [a] aparece no texto principal.
