  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: pt
  text: Estando essas coisas assim preparadas, os sacerdotes entram continuamente na primeira parte do tabernáculo[a] para realizar os serviços sagrados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na primeira tenda” ou “no primeiro compartimento”. A palavra grega pode designar o próprio tabernáculo ou, neste contexto, sua primeira seção.
    reason: lexical_alternative
  - marker: b
    text: Ou “para realizar os atos de culto” ou “para cumprir os deveres rituais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Estando tudo assim preparado
  rationale: Reproduz a construção circunstancial do genitivo absoluto e mantém δέ como transição leve, sem acrescentar um marcador temporal explícito. “Preparado” convém ao contexto da disposição do tabernáculo e de seus utensílios.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: na primeira parte do tabernáculo
  rationale: No contexto, σκηνή pode designar tanto o tabernáculo quanto uma de suas seções. A formulação explicita naturalmente que se trata do primeiro compartimento, sem perder a referência cultual ao tabernáculo.
- source_word: διὰ παντὸς
  choice: continuamente
  rationale: Expressa a prática habitual e repetida dos sacerdotes, em contraste com o acesso anual do sumo sacerdote no versículo seguinte, sem sugerir presença física ininterrupta.
- source_word: εἰσίασιν
  choice: entram
  rationale: O presente do indicativo descreve uma ação costumeira; o presente simples em português comunica isso com naturalidade.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Refere-se aos sacerdotes em geral, em contraste com o sumo sacerdote mencionado no versículo seguinte.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: para realizar os serviços sagrados
  rationale: “Realizar” transmite a execução das funções prescritas, e “serviços sagrados” preserva o sentido cultual de λατρείας sem sugerir meramente reuniões religiosas modernas.
theological_decisions:
- issue: Sentido de σκηνή no contexto do santuário
  choice: primeira parte do tabernáculo
  alternative: primeira tenda; primeiro compartimento
  rationale: Hebreus 9 descreve o santuário mosaico e suas duas seções. A escolha conserva a referência ao tabernáculo e torna claro, pelo contexto imediato, que aqui se trata da primeira seção.
- issue: Força de διὰ παντός no ministério sacerdotal
  choice: continuamente
  alternative: sempre; regularmente
  rationale: A expressão descreve acesso habitual e reiterado à primeira seção, em contraste com o acesso restrito do sumo sacerdote à segunda, sem implicar atividade ininterrupta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário cultual compreensível. “Primeira parte do tabernáculo” evita a impressão de dois tabernáculos distintos e preserva a ambiguidade lexical em nota. A oração final com “para realizar” torna natural em português a relação do particípio grego com a entrada dos sacerdotes.
