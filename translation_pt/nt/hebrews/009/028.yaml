  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: pt
  text: Assim também o Messias, tendo sido oferecido uma só vez para levar os pecados de muitos, aparecerá pela segunda vez, sem relação com o pecado[a], aos que o aguardam ansiosamente, para a salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte do pecado”; isto é, não para levar pecados, como em sua primeira oferta.
    reason: Alternativa lexical para χωρὶς ἁμαρτίας e esclarecimento contextual, sem eliminar a concisão e a ambiguidade da expressão no texto principal.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Assim também
  rationale: Mantém a comparação com o destino humano mencionado no versículo anterior e soa natural em português.
- source_word: ὁ Χριστός
  choice: o Messias
  rationale: Traduz Χριστός como título messiânico ativo no argumento histórico-salvífico, em vez de tratá-lo apenas como nome próprio.
- source_word: ἅπαξ
  choice: uma só vez
  rationale: Expressa com clareza a ocorrência única, sem acrescentar explicitamente a ideia de “de uma vez por todas”, que não está lexicalizada aqui.
- source_word: προσενεχθεὶς
  choice: depois de ter sido oferecido
  rationale: Preserva a voz passiva do particípio aoristo e sua anterioridade em relação ao futuro “aparecerá”, sem introduzir o reflexivo “ofereceu a si mesmo”.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: para levar os pecados de muitos
  rationale: Comunica a finalidade e conserva a linguagem sacrificial e a provável ressonância de Isaías 53.
- source_word: ἐκ δευτέρου
  choice: pela segunda vez
  rationale: É uma expressão portuguesa clara para a segunda ocorrência e mantém o contraste com a primeira vinda e oferta.
- source_word: χωρὶς ἁμαρτίας
  choice: à parte do pecado
  rationale: Permanece próxima da formulação grega concisa e preserva sua tensão interpretativa; uma explicação contextual aparece na nota.
- source_word: ὀφθήσεται
  choice: aparecerá
  rationale: Verbo idiomático em português para a manifestação futura, mais natural neste contexto escatológico do que o passivo formal “será visto”.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: aos que o aguardam ansiosamente
  rationale: Retrata a espera intensa e expectante comunicada por ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Conserva de modo conciso a ideia de finalidade ou resultado, sem explicitar além do texto quem traz ou recebe a salvação.
theological_decisions:
- issue: Sentido de χωρὶς ἁμαρτίας na segunda aparição
  choice: à parte do pecado
  alternative: sem relação com o pecado; não para levar o pecado
  rationale: A formulação principal preserva a concisão e a possível ambiguidade do grego. A nota apresenta a leitura contextual de que a segunda aparição não terá a função de levar pecados, sem transformar essa explicação na única redação possível.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a voz passiva, a comparação inicial e a progressão entre oferta única, segunda aparição e salvação.
