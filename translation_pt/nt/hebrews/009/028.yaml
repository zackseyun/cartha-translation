review_pass:
  verdict: revise
  source_fidelity: O rascunho transmite corretamente a comparação inicial, a oferta única e passiva, o levar os pecados de muitos, a segunda aparição, a espera expectante e a finalidade de salvação. Não há acréscimo doutrinário indevido. A expressão «à parte do pecado», porém, é pouco idiomática em português moderno e pode sugerir meramente ausência de pecado, em vez de preservar a relação contextual com a oferta pelos pecados.
  naturalness: «Depois de ter sido oferecido» é compreensível, mas «tendo sido oferecido» é mais conciso e acompanha melhor o particípio aoristo. «Sem relação com o pecado» é uma formulação portuguesa natural para a expressão concisa, mantendo a explicação mais específica na nota.
  terminology: «Messias», «oferecido», «levar os pecados», «pela segunda vez», «aguardam ansiosamente» e «salvação» são adequados, claros e consistentes com o registro solene moderno. A nota deve conservar «oferta» e explicitar que se trata da primeira oferta, sem apresentar a explicação contextual como se fosse a única possibilidade lexical.
