revisions:
- from: Assim também o Messias, depois de ter sido oferecido uma só vez para levar os pecados de muitos, aparecerá pela segunda vez, à parte do pecado[a], aos que o aguardam ansiosamente, para a salvação.
  to: Assim também o Messias, tendo sido oferecido uma só vez para levar os pecados de muitos, aparecerá pela segunda vez, sem relação com o pecado[a], aos que o aguardam ansiosamente, para a salvação.
  rationale: A revisão limita-se a aperfeiçoar a idiomaticidade portuguesa e a tornar mais direta a construção participial, sem alterar a progressão argumentativa nem resolver além do necessário o sentido teológico de χωρὶς ἁμαρτίας. A alternativa mais literal é mantida na nota.
