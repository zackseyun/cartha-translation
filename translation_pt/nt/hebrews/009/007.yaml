  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: pt
  text: Mas, na segunda parte[a], entra somente o sumo sacerdote, uma vez por ano, e não sem sangue, que ele oferece por si mesmo e pelos pecados do povo cometidos por ignorância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na segunda tenda” ou “no segundo recinto”, referindo-se à parte interior do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelos pecados involuntários do povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Mas, na segunda parte
  rationale: O adjetivo substantivado retoma a segunda parte da tenda descrita no contexto. “Parte” preserva a elipse e evita definir além do necessário se se trata de recinto, seção ou tenda.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: uma vez por ano
  rationale: Equivalente português natural e exato para a frequência anual.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: somente o sumo sacerdote
  rationale: Expressa claramente a exclusividade indicada por μόνος.
- source_word: οὐ χωρὶς αἵματος
  choice: e nunca sem sangue
  rationale: Reproduz de modo natural a litotes grega, mantendo explícita a imagem sacrificial do sangue.
- source_word: ὃ προσφέρει
  choice: que ele oferece
  rationale: “Oferece” comunica o sentido sacrificial habitual de προσφέρει e permite que o pronome relativo retome “sangue”.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: por si mesmo
  rationale: Forma natural em português para a ideia representativa ou beneficiária de ὑπέρ neste contexto sacrificial.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: pelos pecados que o povo cometeu por ignorância
  rationale: Torna explícito o valor moral de ἀγνοήματα e preserva sua caracterização como faltas decorrentes de ignorância, sem reduzir o termo a mera falta de informação.
theological_decisions:
- issue: Natureza de ἀγνοήματα no contexto sacrificial
  choice: pecados que o povo cometeu por ignorância
  alternative: pecados involuntários; faltas cometidas sem saber
  rationale: A formulação mantém tanto a culpabilidade das faltas quanto sua relação com ignorância ou falta de intenção, sem impor uma distinção doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a exclusividade do sumo sacerdote, a frequência anual e a linguagem sacrificial.
