  terminology: “Sumo sacerdote”, “sangue”, “oferece” e “pecados ... por ignorância” são escolhas adequadas ao contexto sacrificial e ao sentido de ἀγνοημάτων. “Parte” conserva prudentemente a elipse espacial do grego; as alternativas na nota oferecem maior precisão contextual sem impor uma única leitura.
