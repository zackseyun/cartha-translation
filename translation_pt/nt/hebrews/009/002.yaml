id: HEB.9.2
reference: Hebrews 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: pt
  text: Pois foi preparado o primeiro compartimento da Tenda, no qual estavam o candelabro, a mesa e a apresentação dos pães[a]. Esse compartimento é chamado Lugar Santo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os pães da Presença”; tradicionalmente, “os pães da proposição”.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “Santos [Lugares]”; aqui, o primeiro compartimento da Tenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ … ἡ πρώτη
  choice: o primeiro compartimento da Tenda
  rationale: No contexto, a expressão aponta para a primeira divisão da tenda sagrada, em contraste com a divisão interior mencionada no versículo seguinte. “Compartimento” torna explícita essa relação espacial sem sugerir duas tendas independentes; “Tenda” preserva a imagem concreta do santuário móvel.
- source_word: κατεσκευάσθη
  choice: foi preparado
  rationale: O verbo pode abranger preparar, instalar ou equipar. “Foi preparado” mantém essa amplitude e combina com a descrição dos objetos colocados no compartimento.
- source_word: λυχνία
  choice: candelabro
  rationale: Designa o suporte ritual para lâmpadas a óleo. “Candelabro” é o termo bíblico corrente e amplamente compreensível, embora não se tratasse de velas.
- source_word: τράπεζα
  choice: mesa
  rationale: Equivalente direto e natural para a mesa sagrada do primeiro compartimento.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: a apresentação dos pães
  rationale: Reproduz o sentido básico de pôr ou apresentar os pães, preservando a forma incomum da expressão grega. A nota oferece a designação cultual mais conhecida.
- source_word: ἥτις λέγεται Ἅγια
  choice: Esse compartimento é chamado Lugar Santo
  rationale: O plural grego Ἅγια funciona aqui como nome do primeiro espaço sagrado. A retomada por “esse compartimento” elimina uma possível ambiguidade do pronome português e deixa clara a referência espacial.
theological_decisions:
- issue: Identidade de σκηνὴ ἡ πρώτη
  choice: o primeiro compartimento da Tenda
  alternative: a primeira tenda
  rationale: O versículo seguinte contrasta este espaço com o que ficava além do segundo véu. A tradução explicita a divisão interna sugerida pelo contexto, sem transformar os dois espaços em estruturas separadas.
- issue: Forma plural de Ἅγια
  choice: Lugar Santo
  alternative: Lugares Santos
  rationale: Embora Ἅγια seja formalmente plural, aqui nomeia o primeiro compartimento do santuário. “Lugar Santo” preserva o contraste espacial com o Santo dos Santos sem acrescentar uma afirmação doutrinária.
- issue: Sentido cultual de πρόθεσις τῶν ἄρτων
  choice: a apresentação dos pães
  alternative: os pães da Presença
  rationale: A redação principal conserva mais diretamente a formulação grega e evita definir de modo excessivo a relação expressa. A alternativa tradicional e intertextual é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda” recebe inicial maiúscula por funcionar como designação do santuário móvel; “Lugar Santo” mantém a designação cultual reconhecível. A sintaxe foi dividida em duas frases para evitar que o relativo final pareça qualificar apenas os pães.
