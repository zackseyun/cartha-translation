  source_fidelity: A tradução preserva com precisão a comparação introduzida por καθ’ ὅσον (“assim como”), o caráter fixado/estabelecido de ἀπόκειται (“está determinado”), a referência genérica a toda a humanidade, a unicidade de ἅπαξ (“uma só vez”) e a sequência entre morte e κρίσις. “Juízo” mantém o sentido judicial amplo de κρίσις, sem antecipar condenação nem especificar um modelo escatológico. A vírgula final é correta, pois a comparação se completa em Hebreus 9:28.
  naturalness: “E, assim como está determinado que os seres humanos morram uma só vez e, depois disso, venha o juízo,” é português moderno, claro e digno. A construção impessoal é natural e não introduz um agente que o grego deixa implícito. O subjuntivo “morram” e “venha” funciona bem após “está determinado que”.
  terminology: “Seres humanos” comunica adequadamente o valor genérico de τοῖς ἀνθρώποις para leitores contemporâneos. “Juízo” é o termo teológico e jurídico apropriado para κρίσις e é preferível a alternativas interpretativamente mais restritas, como “condenação” ou “juízo final”.
