  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: pt
  text: E, assim como está determinado que os seres humanos morram uma só vez e, depois disso, venha o juízo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: assim como
  rationale: Neste contexto, a expressão introduz a comparação que se completa no versículo seguinte. “Assim como” sinaliza essa relação com naturalidade em português.
- source_word: ἀπόκειται
  choice: está determinado
  rationale: Com o dativo e o infinitivo, o verbo expressa aquilo que está fixado ou destinado. “Está determinado” comunica esse sentido sem explicitar quem o determinou.
- source_word: τοῖς ἀνθρώποις
  choice: os seres humanos
  rationale: O substantivo grego tem forma masculina plural, mas aqui se refere genericamente à humanidade. “Os seres humanos” preserva com clareza o alcance inclusivo no português atual.
- source_word: ἅπαξ
  choice: uma só vez
  rationale: O advérbio indica uma única ocorrência. “Uma só vez” é natural e enfático, sem acrescentar o sentido mais forte de “de uma vez por todas”.
- source_word: ἀποθανεῖν
  choice: morram
  rationale: A forma verbal integra a construção portuguesa “está determinado que... morram”, traduzindo naturalmente o infinitivo grego “morrer”.
- source_word: μετὰ δὲ τοῦτο
  choice: e, depois disso
  rationale: A expressão marca sequência. “E, depois disso” mantém tanto a progressão quanto a conexão com a oração anterior.
- source_word: κρίσις
  choice: venha o juízo
  rationale: “Juízo” preserva o sentido amplo de avaliação judicial, sem reduzi-lo a condenação. O verbo “venha”, suprido em português, torna natural a frase nominal grega e mantém o paralelismo verbal.
theological_decisions:
- issue: Referência genérica de τοῖς ἀνθρώποις
  choice: “os seres humanos”, referindo-se à humanidade em geral
  alternative: “os homens”
  rationale: Embora a forma grega seja masculina plural, o uso é genérico. Em português contemporâneo, “os seres humanos” comunica o alcance universal sem sugerir referência exclusiva ao sexo masculino.
- issue: Alcance de κρίσις depois da morte
  choice: “juízo”, sem especificar o resultado ou um esquema escatológico detalhado
  alternative: “condenação” ou “juízo final”
  rationale: O substantivo afirma o juízo posterior à morte, mas não define neste versículo seu resultado nem todos os seus pormenores. A tradução evita acrescentar uma conclusão teológica mais estreita.
- issue: Agente implícito em ἀπόκειται
  choice: 'Construção impessoal: “está determinado”'
  alternative: “Deus determinou”
  rationale: O contexto teológico pode pressupor determinação divina, mas o grego não nomeia explicitamente o agente. A construção impessoal preserva essa característica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a vírgula final porque o período e a comparação continuam em Hebreus 9:28. Não há marcador de nota, pois nenhuma nota é necessária nesta redação.
