  rationale: A revisão torna explícita a retomada da disposição do santuário no contexto imediato e emprega «figura», a opção portuguesa mais idiomática para o sentido cultual de παραβολή. A nota preserva «parábola» e «símbolo» como alternativas. A segunda oração foi coordenada para deixar claro que tanto os dons como os sacrifícios são incapazes de aperfeiçoar o adorador no âmbito da consciência.
