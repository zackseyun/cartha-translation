review_pass:
  verdict: revise
  source_fidelity: A relação com a disposição do santuário precedente é preservada melhor por um pronome feminino com antecedente claro. «Figura» é a acepção contextual mais natural de παραβολή em português e conserva o valor de correspondência figurativa, sem transformar o termo numa parábola narrativa.
  naturalness: «Isso é uma parábola» soa pouco preciso e «parábola», sem explicação imediata, tende a denotar em português um relato ilustrativo. «Ela é uma figura» é fluente, digno e apropriado ao contexto cultual. A oração relativa foi ajustada para evitar que «que» pareça referir-se apenas a «sacrifícios».
  terminology: «Figura», com as alternativas «parábola» e «símbolo» em nota, traduz adequadamente παραβολή. Mantêm-se «dons», «sacrifícios», «aperfeiçoar», «consciência» e «aquele que presta culto», sem impor uma leitura doutrinária.
  issues:
  - severity: medium
    issue: «Isso é uma parábola»
    rationale: O grego usa um relativo feminino que retoma a tenda/disposição mencionada anteriormente. «Isso» enfraquece essa ligação, e «parábola» em português moderno normalmente designa uma narrativa, não uma figura cultual.
  - severity: low
    issue: Antecedente potencialmente ambíguo de «que não são capazes»
    rationale: Depois de «dons como sacrifícios», o relativo pode ser lido como ligado apenas a «sacrifícios». A coordenação explícita preserva que a incapacidade se aplica aos dois tipos de oferta.
