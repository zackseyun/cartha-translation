source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: pt
  text: Ela é uma figura para o tempo presente[a], segundo a qual são oferecidos tanto dons como sacrifícios, e eles não são capazes de aperfeiçoar, quanto à consciência, aquele que presta culto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma parábola” ou “um símbolo” para o tempo presente.
    reason: Alternativas lexicais plausíveis para παραβολή neste contexto cultual.
lexical_decisions:
- source_word: ἥτις
  choice: Isso é
  rationale: Retoma a primeira parte do tabernáculo descrita no contexto e introduz de modo natural, em português, sua função explicativa.
- source_word: παραβολὴ
  choice: parábola
  rationale: Preserva o termo grego e a ideia de correspondência figurativa, sem reduzi-la exclusivamente a símbolo; a alternativa contextual consta em nota.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: para o tempo presente
  rationale: Reproduz de forma clara a referência ao tempo vigente no argumento, sem especificar além do grego.
- source_word: καθ’ ἣν
  choice: Segundo ela
  rationale: Expressa a relação reguladora entre a parábola ou disposição figurativa e as ofertas mencionadas, evitando uma construção pesada.
- source_word: δῶρά τε καὶ θυσίαι
  choice: tanto dons como sacrifícios
  rationale: Mantém os dois termos cultuais e representa a correlação τε καὶ.
- source_word: προσφέρονται
  choice: são oferecidos
  rationale: Preserva a voz passiva e o aspecto de prática cultual vigente.
- source_word: μὴ δυνάμεναι
  choice: não são capazes
  rationale: Explicita a incapacidade inerente dos dons e sacrifícios e acompanha a construção participial grega.
- source_word: κατὰ συνείδησιν
  choice: quanto à consciência
  rationale: Delimita o âmbito em que o aperfeiçoamento não ocorre, sem sugerir mera sinceridade subjetiva.
- source_word: τελειῶσαι
  choice: aperfeiçoar
  rationale: Preserva o vocabulário teologicamente significativo de Hebreus acerca de levar à condição ou finalidade pretendida.
- source_word: τὸν λατρεύοντα
  choice: aquele que presta culto
  rationale: Traduz o particípio substantivado singular e conserva a dimensão de serviço cultual, mais específica que uma referência genérica a adoração.
theological_decisions:
- issue: Sentido de παραβολή no contexto cultual e tipológico
  choice: parábola
  alternative: símbolo ou figura
  rationale: “Parábola” mantém a forma lexical e a tensão de uma correspondência figurativa entre o santuário terreno e o tempo presente; a nota registra alternativas contextualmente plausíveis.
- issue: Alcance de κατὰ συνείδησιν
  choice: quanto à consciência
  alternative: na consciência
  rationale: A formulação conserva a limitação do aperfeiçoamento ao âmbito da consciência, sem afirmar que os sacrifícios eram ineficazes em todos os sentidos.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Presta culto” preserva a nuance cultual; “aperfeiçoar” mantém a terminologia recorrente de Hebreus.
