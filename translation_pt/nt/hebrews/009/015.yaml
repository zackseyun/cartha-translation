id: HEB.9.15
reference: Hebrews 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: pt
  text: E por isso ele é o mediador de uma nova aliança[a], para que, tendo ocorrido uma morte para a redenção das transgressões cometidas sob a primeira aliança, os que foram chamados recebam a promessa da herança eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testamento” em lugar de “aliança”. A palavra grega διαθήκη pode ter ambos os sentidos, e Hebreus 9:16–17 explora essa sobreposição; neste versículo, porém, “aliança” se ajusta melhor ao contraste com a primeira aliança.
    reason: Leitura alternativa que preserva a amplitude semântica do termo grego e a tensão desenvolvida no contexto seguinte.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressão causal idiomática que liga o versículo ao argumento anterior, com clareza e concisão em português.
- source_word: διαθήκης καινῆς
  choice: de uma nova aliança
  rationale: O sentido de aliança predomina no contraste com a primeira aliança, embora a possibilidade semântica de “testamento” seja preservada em nota.
- source_word: μεσίτης
  choice: mediador
  rationale: Termo corrente e preciso para aquele que atua entre partes, adequado ao contexto sacerdotal e pactual de Hebreus.
- source_word: ὅπως
  choice: para que
  rationale: Preserva naturalmente a força de propósito ou resultado da oração grega.
- source_word: θανάτου γενομένου
  choice: tendo ocorrido uma morte
  rationale: Representa o genitivo absoluto e o caráter já ocorrido da morte sem identificar explicitamente seu agente além do que esta construção afirma.
- source_word: εἰς ἀπολύτρωσιν
  choice: para a redenção
  rationale: Mantém tanto a orientação ou finalidade expressa por εἰς quanto a ideia de libertação mediante custo presente em ἀπολύτρωσις.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: das transgressões cometidas sob a primeira aliança
  rationale: “Sob” comunica a esfera ou vigência da primeira aliança; “cometidas” torna natural em português a relação implícita entre transgressões e aliança.
- source_word: τὴν ἐπαγγελίαν
  choice: a promessa
  rationale: Conserva o substantivo singular e sua relação com a herança prometida.
- source_word: λάβωσιν
  choice: recebam
  rationale: O presente do subjuntivo em português após “para que” traduz naturalmente o aoristo do subjuntivo grego nesta oração final.
- source_word: οἱ κεκλημένοι
  choice: os que foram chamados
  rationale: Expressa o particípio perfeito passivo, apresentando pessoas que receberam o chamado, sem linguagem excessivamente técnica.
- source_word: τῆς αἰωνίου κληρονομίας
  choice: da herança eterna
  rationale: Reprodução direta e natural da construção genitiva, mantendo o contraste entre o que é temporário e o que é eterno.
theological_decisions:
- issue: Referente do sujeito implícito em ἐστίν
  choice: “ele é”, referindo-se ao Messias no contexto imediato
  alternative: Construção sem sujeito expresso
  rationale: O português requer normalmente um sujeito recuperável; “ele” retoma o Messias mencionado no contexto anterior sem acrescentar identificação doutrinária não indicada pelo texto.
- issue: Sentido de διαθήκη neste versículo
  choice: “aliança” no texto principal
  alternative: “testamento”
  rationale: O contraste entre nova e primeira aliança favorece “aliança”; a sobreposição semântica explorada em Hebreus 9:16–17 é mantida em nota, sem resolver indevidamente a tensão lexical.
- issue: Relação sintática de τῆς αἰωνίου κληρονομίας com τὴν ἐπαγγελίαν
  choice: “a promessa da herança eterna”
  alternative: “a herança eterna prometida”
  rationale: A tradução mantém a estrutura nominal e a possível nuance de promessa cujo conteúdo ou objeto é a herança, em vez de parafraseá-la como se apenas qualificasse a herança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura longa do original foi preservada, mas organizada com vocabulário corrente; evitou-se explicitar “a morte de Cristo” dentro da oração absoluta para não ultrapassar a formulação deste versículo.
