id: HEB.9.22
reference: Hebrews 9:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: pt
  text: E, segundo a Lei, quase tudo é purificado com sangue, e sem derramamento de sangue não há perdão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «remissão». O termo grego pode indicar libertação ou perdão; aqui se refere ao perdão dos pecados.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: quase
  rationale: O advérbio limita o alcance da afirmação e preserva a ressalva de que nem toda purificação prevista na Lei envolvia sangue.
- source_word: ἐν αἵματι
  choice: com sangue
  rationale: A preposição tem aqui sentido instrumental; «com sangue» é natural em português e expressa o meio ritual da purificação.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural abrange de modo geral as coisas e práticas rituais em questão; combinado com «quase», resulta na formulação idiomática «quase tudo».
- source_word: καθαρίζεται
  choice: é purificado
  rationale: O presente passivo descreve o procedimento habitual estabelecido pela Lei. «Purificado» conserva com clareza o sentido ritual do contexto.
- source_word: κατὰ τὸν νόμον
  choice: segundo a Lei
  rationale: κατά indica conformidade com o sistema legal mosaico. «Segundo a Lei» é claro e não amplia indevidamente o sentido.
- source_word: χωρίς
  choice: sem
  rationale: Equivalente direto e idiomático do sentido privativo da preposição.
- source_word: αἱματεκχυσίας
  choice: derramamento de sangue
  rationale: A expressão designa o sangue vertido, especialmente no contexto sacrificial, e mantém essa ressonância em português corrente.
- source_word: οὐ γίνεται
  choice: não há
  rationale: Com o substantivo abstrato ἄφεσις, a expressão indica que o perdão não ocorre; «não há» comunica naturalmente esse sentido existencial.
- source_word: ἄφεσις
  choice: perdão
  rationale: No contexto sacrificial, refere-se ao perdão ou à remissão dos pecados. «Perdão» é a opção moderna mais clara, enquanto «remissão» é menos corrente.
theological_decisions:
- issue: Sentido de ἄφεσις no contexto sacrificial
  choice: perdão
  alternative: remissão
  rationale: «Perdão» comunica claramente a relação entre pecado e sangue sacrificial no argumento de Hebreus, sem impor uma formulação doutrinária mais estreita. A alternativa lexical «remissão» é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lei» recebe inicial maiúscula por designar aqui a Lei mosaica. A coordenação repetida com «e» preserva a estrutura enfática do grego sem tornar a frase artificial.
