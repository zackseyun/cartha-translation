id: HEB.9.12
reference: Hebrews 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: pt
  text: e não por meio de sangue de bodes e bezerros, mas por meio do seu próprio sangue, entrou de uma vez por todas nos lugares santos[a], tendo obtido redenção eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no santuário”. O grego diz literalmente “nos lugares santos”. Algumas traduções vertem a expressão de modo mais específico como “no Santo dos Santos”, mas isso é mais interpretativo do que a própria formulação exige.
    reason: Leitura alternativa que esclarece o uso cultual da expressão plural sem eliminar sua ambiguidade.
lexical_decisions:
- source_word: οὐδὲ
  choice: e não
  rationale: Mantém a ligação com o contraste iniciado no contexto anterior e soa natural em português.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: por meio de sangue de bodes e bezerros
  rationale: διά com genitivo expressa meio ou instrumentalidade; “por meio de” preserva essa relação e permite repetir a mesma construção no contraste seguinte. “Bezerros” traduz μόσχων sem recorrer ao tradicional e mais específico “novilhos”.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: mas por meio do seu próprio sangue
  rationale: Repete a construção de διά e conserva a ênfase possessiva de ἰδίου em “seu próprio sangue”.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo apresenta o ato como realizado; “entrou” é direto e adequado à imagem do santuário.
- source_word: ἐφάπαξ
  choice: de uma vez por todas
  rationale: Expressa um ato único, decisivo e irrepetível, força característica do termo em Hebreus.
- source_word: εἰς τὰ ἅγια
  choice: nos lugares santos
  rationale: Conserva o plural grego e a linguagem cultual sem especificar além do texto se se trata do Santo dos Santos.
- source_word: αἰωνίαν λύτρωσιν
  choice: redenção eterna
  rationale: Comunica naturalmente uma redenção de eficácia permanente e preserva a terminologia teológica corrente.
- source_word: εὑράμενος
  choice: tendo obtido
  rationale: Embora o sentido básico seja “tendo encontrado”, neste contexto o particípio indica alcançar ou obter; a formulação mantém sua relação com o verbo principal.
theological_decisions:
- issue: Sentido da entrada de Cristo por meio do próprio sangue
  choice: A entrada é apresentada como realizada por meio do próprio sangue de Cristo, em contraste com o sangue de animais, sem detalhar o mecanismo sacrificial.
  alternative: Entender que Cristo entrou levando ou apresentando literalmente seu sangue, ou apenas que entrou depois de derramá-lo.
  rationale: A repetição de διά com genitivo favorece a expressão consistente de meio ou instrumentalidade. Isso preserva o contraste tipológico sem impor ao texto uma explicação espacial ou ritual mais detalhada.
- issue: Alcance de τὰ ἅγια
  choice: lugares santos
  alternative: santuário; Santo dos Santos
  rationale: A expressão grega está no plural e pode designar cultualmente o santuário. “Santo dos Santos” resolveria de modo excessivamente específico uma questão que a redação grega deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por meio de” é deliberada para espelhar o contraste do original; “de uma vez por todas” comunica a força decisiva de ἐφάπαξ.
