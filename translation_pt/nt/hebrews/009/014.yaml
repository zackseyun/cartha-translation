id: HEB.9.14
reference: Hebrews 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: pt
  text: quanto mais o sangue do Messias — que, por meio do Espírito eterno, ofereceu a si mesmo sem defeito a Deus — purificará a nossa consciência das obras mortas, para servirmos ao Deus vivo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio de um espírito eterno». A expressão grega também pode ser entendida de modo mais geral, embora aqui «o Espírito eterno» seja tomado como referência ao Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: quanto mais
  rationale: Preserva de modo natural a força retórica do argumento a fortiori iniciado no versículo anterior.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: o sangue do Messias
  rationale: Mantém literalmente a linguagem sacrificial de αἷμα e traduz Χριστός como título, «Messias».
- source_word: διὰ πνεύματος αἰωνίου
  choice: por meio do Espírito eterno
  rationale: «Por meio de» expressa o valor instrumental de διά; a inicial maiúscula apresenta como leitura principal a referência ao Espírito Santo, sem ocultar a ambiguidade da expressão grega.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: ofereceu a si mesmo
  rationale: Conserva tanto o sentido reflexivo quanto a terminologia cultual e sacrificial de προσφέρω.
- source_word: ἄμωμον
  choice: sem defeito
  rationale: Evoca a exigência sacrificial de uma oferta sem defeito, sem reduzir o termo a uma afirmação meramente moral.
- source_word: καθαριεῖ
  choice: purificará
  rationale: Mantém o futuro do verbo grego e se ajusta ao campo semântico de pureza ritual e interior presente no contexto.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: a nossa consciência
  rationale: Reproduz o substantivo no singular e o genitivo plural, referindo-se à interioridade moral compartilhada pelos leitores.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: das obras mortas
  rationale: Preserva a formulação densa e deliberadamente não explicada que também ocorre em Hebreus 6:1.
- source_word: εἰς τὸ λατρεύειν
  choice: para servirmos
  rationale: Expressa a finalidade da purificação; «servir» preserva a amplitude de λατρεύω, que pode incluir culto e serviço religioso.
- source_word: θεῷ ζῶντι
  choice: ao Deus vivo
  rationale: É a formulação idiomática natural em português e conserva o contraste implícito entre obras mortas e o Deus vivo.
theological_decisions:
- issue: Referente de πνεύματος αἰωνίου
  choice: Espírito Santo, vertido como «Espírito eterno»
  alternative: «um espírito eterno», possivelmente o espírito do próprio Messias ou uma caracterização espiritual de sua oferta
  rationale: A construção grega sem artigo admite mais de uma interpretação. A referência pessoal ao Espírito Santo é adotada no texto principal por ser contextualmente plausível, enquanto a leitura mais geral é registrada em nota.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona como título do ungido cuja oferta sacrificial está em foco; «Messias» torna transparente esse valor titular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão isola a oração explicativa sem obscurecer a estrutura principal. «Sem defeito» mantém a ressonância sacrificial; «para servirmos» soa natural e explicita adequadamente o sujeito implícito do infinitivo.
