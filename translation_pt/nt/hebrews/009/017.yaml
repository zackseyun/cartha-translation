revisions:
- from: Pois uma aliança é confirmada sobre mortos[b][a], visto que nunca entra em vigor enquanto vive aquele que a estabeleceu.
  to: Pois uma aliança é válida no caso de mortos[b][a], visto que nunca tem vigor enquanto vive aquele que a estabeleceu.
  rationale: A revisão substitui «é confirmada» por «é válida», reproduzindo com maior precisão o valor jurídico/pactual de βεβαία, e troca a formulação excessivamente literal «sobre mortos» por «no caso de mortos». Esta última conserva deliberadamente a ambiguidade de ἐπὶ νεκροῖς, explicitada na nota, sem impor uma leitura testamentária ou sacrificial. A alternativa de «testamento» e os respectivos marcadores foram preservados.
