  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: pt
  text: Pois uma aliança é válida no caso de mortos[b][a], visto que nunca tem vigor enquanto vive aquele que a estabeleceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois um testamento só é válido depois da morte, visto que nunca tem vigor enquanto vive o testador». O termo grego pode significar tanto «aliança» quanto «testamento».'
    reason: alternative_reading
  - marker: b
    text: A expressão «no caso de mortos» é concisa no grego e pode se referir tanto a pessoas mortas, no sentido testamentário, quanto a mortes envolvidas na ratificação de uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: aliança
  rationale: O contexto mais amplo de Hebreus 8–10 é predominantemente pactual e sacrificial. «Aliança» mantém essa coerência, enquanto a acepção igualmente possível de «testamento» é preservada em nota.
- source_word: ἐπὶ νεκροῖς
  choice: sobre mortos
  rationale: A expressão grega é concisa e elíptica. A formulação deliberadamente aberta pode abranger tanto pessoas mortas, na leitura testamentária, quanto mortes ou vítimas envolvidas na ratificação de uma aliança.
- source_word: βεβαία
  choice: é confirmada
  rationale: O adjetivo indica firmeza, validade ou confirmação jurídica/pactual. «É confirmada» funciona naturalmente com «aliança» e se harmoniza com o contexto de ratificação sem excluir a noção de validade.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Introduz a razão explicativa da declaração anterior, preservando claramente sua força causal.
- source_word: μήποτε
  choice: nunca
  rationale: Neste contexto, com ἰσχύει, exprime que algo não vigora em momento algum enquanto a pessoa indicada vive.
- source_word: ἰσχύει
  choice: entra em vigor
  rationale: Comunica de maneira corrente a eficácia jurídica ou pactual do verbo.
- source_word: ὅτε ζῇ
  choice: enquanto vive
  rationale: Preserva o contraste temporal entre a morte mencionada antes e a vida continuada daquele que estabeleceu a disposição.
- source_word: ὁ διαθέμενος
  choice: aquele que a estabeleceu
  rationale: Evita decidir entre «testador» e «autor da aliança»; o particípio pode funcionar nos dois enquadramentos interpretativos.
theological_decisions:
- issue: Se διαθήκη deve ser traduzida no sentido de aliança ou de testamento em Hebreus 9:17.
  choice: Usar «aliança» no texto principal.
  alternative: «testamento»
  rationale: O contexto de Hebreus 8–10 é dominado pelas alianças, pelo sangue e pela inauguração sacrificial; contudo, a linguagem dos versículos 16–17 admite uma leitura testamentária real, que deve permanecer explícita em nota.
- issue: Até que ponto esclarecer a expressão ἐπὶ νεκροῖς.
  choice: Conservar a formulação aberta «sobre mortos».
  alternative: «depois da morte», «no caso de pessoas mortas» ou «sobre vítimas mortas»
  rationale: A sintaxe grega é comprimida e pode apontar para a morte de um testador ou para mortes ligadas à ratificação sacrificial de uma aliança. Explicitar apenas uma leitura eliminaria uma ambiguidade genuína.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores [b][a] acompanha os pontos correspondentes no texto: [b] após a expressão ambígua «sobre mortos» e [a] após a oração principal, remetendo à tradução testamentária alternativa.'
