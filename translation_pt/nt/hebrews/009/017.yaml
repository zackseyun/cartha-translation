  terminology: '«Aliança» é apropriado como termo principal. «Testamento» e «testador» na nota apresentam de modo claro a leitura alternativa. Os marcadores [b][a] estão corretamente ancorados: [b] segue a expressão ambígua, e [a] remete à alternativa abrangente para a leitura testamentária.'
