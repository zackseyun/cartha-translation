id: HEB.9.19
reference: Hebrews 9:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: pt
  text: Pois, quando Moisés proclamou a todo o povo cada mandamento conforme a Lei, tomou o sangue dos bezerros[a], com água, lã escarlate e hissopo, e borrifou tanto o próprio rolo como todo o povo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “novilhos”. A palavra grega pode designar bezerros ou bovinos jovens em contexto sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Pois, depois que ... proclamou ... cada mandamento
  rationale: O genitivo absoluto tem sentido temporal. A formulação ativa é natural em português, e “cada mandamento” preserva a força distributiva de πάσης.
- source_word: κατὰ τὸν νόμον
  choice: conforme a Lei
  rationale: Expressa a conformidade indicada por κατά com o acusativo, de modo claro e corrente.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: Moisés proclamou a todo o povo
  rationale: A voz ativa conserva Moisés como agente e todo o povo como destinatário, evitando uma passiva menos natural.
- source_word: λαβὼν
  choice: tomou
  rationale: O particípio aoristo é vertido como verbo finito em sequência narrativa, com Moisés ainda como sujeito.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: o sangue dos bezerros
  rationale: “Bezerros” é um equivalente direto de μόσχων; a possibilidade de animais bovinos jovens é indicada em nota.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: com água, lã escarlate e hissopo
  rationale: Preserva os elementos rituais e entende μετά como associação; “lã escarlate” é claro e mantém a imagem cultual.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: tanto o próprio rolo como todo o povo
  rationale: “Rolo” representa adequadamente o documento escrito antigo; “próprio” preserva a ênfase de αὐτό, e “tanto... como” reproduz a coordenação τε...καί.
- source_word: ἐράντισεν
  choice: aspergiu
  rationale: “Aspergir” é o verbo português preciso e estabelecido para o ato ritual de borrifar ou espargir líquido.
theological_decisions:
- issue: Relação com o relato de Êxodo 24
  choice: Traduzir a formulação de Hebreus sem acrescentar detalhes do relato veterotestamentário.
  alternative: Harmonizar ou explicar no texto a composição e os objetos do rito.
  rationale: A redação condensada de Hebreus deve permanecer intacta, inclusive em pontos nos quais não repete explicitamente todos os detalhes de Êxodo.
- issue: Sentido de μόσχων no contexto sacrificial
  choice: bezerros
  alternative: novilhos
  rationale: Ambos são lexicalmente possíveis. “Bezerros” mantém o equivalente mais direto, enquanto a alternativa contextualmente defensável fica registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui a Lei mosaica; “rolo” evita o anacronismo material de “livro”. A vírgula final é mantida porque o versículo continua sintaticamente no seguinte.
