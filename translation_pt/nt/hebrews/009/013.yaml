id: HEB.9.13
reference: Hebrews 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: pt
  text: Pois, se o sangue de bodes e de touros e as cinzas de uma novilha, com as quais se aspergem os que foram contaminados[a], os santificam no que diz respeito à pureza da carne[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que se tornaram impuros”; o grego se refere à contaminação ritual.
    reason: lexical_alternative
  - marker: b
    text: Isto é, pureza exterior e corporal no âmbito dos ritos da antiga aliança, em contraste com a purificação da consciência no versículo seguinte.
    reason: cultural_note
  - marker: c
    text: Alusão ao rito de purificação com as cinzas de uma novilha em Números 19.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Preserva tanto a ligação explicativa com o argumento anterior quanto a estrutura condicional que será completada no versículo seguinte.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: o sangue de bodes e de touros
  rationale: Tradução direta e natural da linguagem sacrificial; “bodes” expressa adequadamente o masculino de τράγων.
- source_word: σποδὸς δαμάλεως
  choice: as cinzas de uma novilha
  rationale: “Novilha” é o termo cultual preciso e mantém a alusão ao rito de Números 19.
- source_word: ῥαντίζουσα τοὺς κεκοινωμένους
  choice: com as quais se aspergem os que foram contaminados
  rationale: A construção torna inequívoca em português a relação do particípio com as cinzas e preserva a ação ritual, sem sugerir que a novilha asperge alguém.
- source_word: τοὺς κεκοινωμένους
  choice: os que foram contaminados
  rationale: Reflete o particípio perfeito e a ideia de contaminação ritual; a nota esclarece o domínio cultual para evitar uma leitura meramente moral.
- source_word: ἁγιάζει
  choice: santificam
  rationale: Mantém o vocabulário cultual e teológico do verbo grego. O plural é exigido pela concordância natural em português com os dois elementos coordenados, embora o grego use o singular.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: no que diz respeito à pureza da carne
  rationale: Preserva “carne” e delimita a eficácia à esfera exterior e ritual, sem confundi-la com a natureza pecaminosa nem eliminar o contraste com a consciência no versículo 14.
theological_decisions:
- issue: O alcance de “santificam” nos ritos da antiga aliança
  choice: Santificação ritual ou cultual, limitada à pureza exterior
  alternative: Transformação moral ou santificação interior plena
  rationale: A expressão “pureza da carne” restringe o sentido neste contexto, e o versículo seguinte estabelece o contraste com a purificação da consciência.
- issue: O sentido de σάρξ
  choice: “carne” no sentido corporal e exterior
  alternative: “natureza pecaminosa”
  rationale: O contexto trata de contaminação e purificação rituais. A tradução mantém o termo concreto e não introduz uma interpretação moral estranha ao contraste do autor.
- issue: Agência na expressão sobre as cinzas e a aspersão
  choice: 'Formulação instrumental: “com as quais se aspergem”'
  alternative: 'Formulação ativa literal: “as cinzas... que aspergem”'
  rationale: A formulação portuguesa evita atribuir às cinzas uma agência pessoal, mas conserva a relação gramatical do particípio com “cinzas” e a ação do rito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece aberta ao final, como no grego, porque a comparação iniciada por “se” é completada em Hebreus 9:14. “Aspergem” conserva o registro ritual bíblico sem soar excessivamente arcaico.
