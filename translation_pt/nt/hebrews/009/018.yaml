  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: pt
  text: Por isso, nem mesmo a primeira aliança foi inaugurada sem sangue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a primeira» — isto é, a primeira aliança. Algumas traduções reproduzem o substantivo implícito de modo mais formal como «o primeiro testamento».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural em português a inferência extraída do argumento anterior sobre aliança, morte e sangue.
- source_word: οὐδὲ
  choice: nem mesmo
  rationale: 'Preserva a ênfase da partícula negativa: o princípio se aplicou até à primeira aliança.'
- source_word: ἡ πρώτη
  choice: a primeira aliança
  rationale: O adjetivo feminino substantivado retoma, pelo contexto, a aliança mencionada anteriormente. Explicitar «aliança» evita obscuridade sem acrescentar uma ideia estranha ao texto.
- source_word: χωρὶς αἵματος
  choice: sem sangue
  rationale: Formulação direta e idiomática que conserva a força sacrificial e pactual da expressão.
- source_word: ἐγκεκαίνισται
  choice: foi inaugurada
  rationale: O perfeito passivo indica uma ação consumada de instituição ou inauguração. O pretérito perfeito é natural em português, e «inaugurada» mantém a dimensão cerimonial sem restringir o sentido a uma ratificação meramente jurídica.
theological_decisions:
- issue: Referente de «a primeira»
  choice: a primeira aliança
  alternative: a primeira; o primeiro testamento; a primeira disposição do santuário
  rationale: O contexto imediato e mais amplo de Hebreus 9 trata da primeira aliança, e a alusão à sua instituição com sangue em Êxodo 24 favorece esse referente. A nota preserva a forma elíptica do grego e a alternativa tradicional «testamento».
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a concisão do grego e explicita apenas o referente contextual necessário.
