  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: pt
  text: Até a primeira aliança tinha regulamentos para o culto e um santuário terreno[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplesmente “a primeira”, isto é, a primeira aliança; alguns entendem a expressão de modo mais geral como “a primeira disposição”.
    reason: alternative_reading
  - marker: b
    text: Ou “um santuário pertencente a este mundo”; aqui, o sentido provável é “terreno”, em contraste com as realidades celestiais mencionadas mais adiante no capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: tinha
  rationale: O imperfeito de ἔχω introduz a descrição da realidade anterior; “tinha” preserva naturalmente o sentido possessivo e o aspecto durativo de fundo.
- source_word: μὲν οὖν
  choice: Até
  rationale: A combinação tem força transitiva e levemente enfática. Neste contexto, “Até” comunica de modo natural que também a primeira aliança possuía tais elementos, sem introduzir um marcador temporal inexistente.
- source_word: ἡ πρώτη
  choice: a primeira aliança
  rationale: O substantivo feminino implícito retoma mais provavelmente “aliança” no contexto imediato de Hebreus 8:13. O termo é explicitado em português para tornar a elipse inteligível.
- source_word: δικαιώματα
  choice: regulamentos
  rationale: No contexto cultual, designa prescrições ou normas que regiam o culto; “regulamentos” é claro, atual e preserva o caráter normativo.
- source_word: λατρείας
  choice: para o culto
  rationale: O genitivo indica a esfera ou finalidade das prescrições. “Culto” expressa aqui o serviço religioso formal, e “para” produz uma construção natural em português.
- source_word: τό τε ἅγιον
  choice: um santuário
  rationale: A expressão designa o espaço sagrado ligado ao culto da primeira aliança. “Santuário” é abrangente e evita antecipar a distinção entre os compartimentos apresentada nos versículos seguintes.
- source_word: κοσμικόν
  choice: terreno
  rationale: Neste contexto, o adjetivo contrasta o santuário da ordem presente com as realidades celestiais. “Terreno” evita a possível conotação moral negativa de “mundano”.
theological_decisions:
- issue: Referente implícito de ἡ πρώτη
  choice: a primeira aliança
  alternative: a primeira; a primeira disposição; o primeiro tabernáculo
  rationale: A discussão imediatamente anterior contrapõe a primeira aliança à nova, tornando “aliança” o referente mais provável. A nota preserva a elipse e a possibilidade de uma compreensão mais geral.
- issue: Sentido de κοσμικόν
  choice: terreno
  alternative: mundano; pertencente a este mundo
  rationale: O contraste desenvolvido no capítulo é entre o santuário terreno e as realidades celestiais, não entre algo moralmente mundano e algo espiritual.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Culto” preserva o contexto ritual sem arcaísmo; “terreno” expressa claramente o contraste espacial e teológico. Os marcadores [a] e [b] aparecem no texto principal.
