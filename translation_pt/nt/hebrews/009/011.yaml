id: HEB.9.11
reference: Hebrews 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: pt
  text: Mas o Messias veio como sumo sacerdote dos bens já realizados[a], por meio do tabernáculo maior e mais perfeito, não feito por mãos humanas — isto é, não pertencente a esta criação —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “dos bens futuros”.
    reason: textual_variant
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: O contexto destaca o título e a função sacerdotal do Ungido; “Messias” torna explícito o valor titular de Χριστός.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com as limitações do santuário e do serviço sacerdotal terrenos descritos anteriormente.
- source_word: παραγενόμενος
  choice: veio
  rationale: Expressa de modo natural o advento e a entrada em cena do Messias como sumo sacerdote, sem acrescentar a ideia específica de visibilidade contida em “apareceu”.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Termo português consagrado e preciso para o ofício cultual em Hebreus.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: dos bens que já chegaram
  rationale: Segue γενομένων, indicando bens que vieram ou se tornaram presentes; “já” comunica o aspecto realizado sem identificar em detalhe quais são esses bens.
- source_word: διὰ τῆς ... σκηνῆς
  choice: por meio do ... tabernáculo
  rationale: “Tabernáculo” preserva a evocação do santuário de Israel, e “por meio de” mantém o valor instrumental ou espacial potencial de διά.
- source_word: μείζονος
  choice: maior
  rationale: Permite a ideia de superioridade, sem limitar o comparativo ao tamanho físico.
- source_word: τελειοτέρας
  choice: mais perfeito
  rationale: Preserva a linguagem temática de perfeição e completude característica de Hebreus.
- source_word: οὐ χειροποιήτου
  choice: não feito por mãos humanas
  rationale: Mantém o contraste bíblico com aquilo que é produzido por seres humanos, em linguagem portuguesa clara.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Introduz diretamente a explicação subsequente.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: não pertencente a esta criação
  rationale: Torna explícita a relação expressa pelo genitivo, preservando a referência ao âmbito ou ordem criada.
theological_decisions:
- issue: Leitura textual e sentido de τῶν γενομένων ἀγαθῶν
  choice: dos bens que já chegaram
  alternative: dos bens futuros
  rationale: O texto principal segue γενομένων no SBLGNT, que apresenta os bens como já vindos ou presentes. A variante μελλόντων, conhecida da tradição manuscrita e de várias traduções, é registrada em nota sem harmonização.
- issue: Relação sintática de διὰ τῆς ... σκηνῆς com o contexto
  choice: manter a frase em continuidade aberta para o versículo 12
  alternative: ligá-la inequivocamente a “veio”
  rationale: A construção grega continua no versículo seguinte, onde o ingresso de Cristo fornece um vínculo sintático natural para a expressão. O travessão final preserva a continuidade e evita encerrar prematuramente o período.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva o período inacabado do grego, que prossegue no versículo 12. “Bens” foi preferido a “coisas boas” por sua concisão e adequação ao registro cultual-teológico.
source_grounding:
  english_pob_role: consult_only
