lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: atrás da segunda cortina
  rationale: Μετά com acusativo expressa aqui relação espacial na descrição do santuário. “Atrás” é natural e claro; “cortina” comunica em linguagem atual a divisória interna do tabernáculo.
- source_word: δὲ
  choice: E
  rationale: A partícula δέ funciona como conectivo leve que dá continuidade à descrição, sem exigir contraste forte.
- source_word: σκηνὴ
  choice: a parte da tenda
  rationale: Σκηνή designa a tenda/tabernáculo, mas neste contexto imediato refere-se à sua parte interior situada depois da segunda cortina. A formulação evita sugerir uma segunda tenda independente e permanece compreensível.
- source_word: ἡ λεγομένη
  choice: chamada
  rationale: O particípio atributivo é vertido naturalmente por “chamada”.
- source_word: Ἅγια Ἁγίων
  choice: Lugar Santíssimo
  rationale: A expressão genitiva intensiva significa literalmente “Santo dos Santos” e designa a parte mais sagrada do santuário. “Lugar Santíssimo” transmite esse sentido em português moderno; a forma tradicional é preservada em nota.
theological_decisions:
- issue: Tradução da expressão cultual Ἅγια Ἁγίων
  choice: Lugar Santíssimo
  alternative: Santo dos Santos
  rationale: A opção principal favorece clareza contemporânea sem alterar a referência ao recinto mais interior e sagrado do tabernáculo. A tradução mais literal e tradicional aparece na nota para preservar transparência e continuidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda” é mais transparente ao leitor comum que o termo eclesiástico “tabernáculo”; “parte da tenda” esclarece que σκηνή indica aqui o compartimento interior. O marcador [a] foi mantido no texto principal.
