id: HEB.9.24
reference: Hebrews 9:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: pt
  text: Pois o Messias não entrou em lugares santos feitos por mãos humanas, representações[a] das realidades verdadeiras, mas no próprio céu, para comparecer agora diante da face de Deus[b] em nosso favor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cópias” ou “correspondentes”. O termo grego indica coisas que correspondem às verdadeiras realidades celestiais.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido de modo idiomático como “na presença de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: o Messias
  rationale: Preserva o valor titular de Χριστός neste contexto de cumprimento e ministério sacerdotal; é claro e natural em português.
- source_word: χειροποίητα
  choice: feitos por mãos humanas
  rationale: Mantém o contraste bíblico entre o que é construído por seres humanos e a realidade celestial, explicitando de modo natural o agente implícito.
- source_word: ἅγια
  choice: lugares santos
  rationale: Conserva o plural neutro e o vocabulário cultual de Hebreus sem restringir a referência a uma única parte do santuário.
- source_word: ἀντίτυπα
  choice: representações
  rationale: Expressa a correspondência figurativa entre os lugares santos terrenos e as realidades celestiais, sem sugerir necessariamente reproduções idênticas.
- source_word: τῶν ἀληθινῶν
  choice: das realidades verdadeiras
  rationale: Traduz o adjetivo substantivado no plural e deixa claro que o contraste diz respeito às realidades últimas, não à veracidade de objetos.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: o próprio céu
  rationale: Reproduz a força intensiva da construção grega e destaca o ingresso direto na realidade celestial.
- source_word: νῦν
  choice: agora
  rationale: Mantém a indicação temporal e a relevância presente da aparição celestial do Messias.
- source_word: ἐμφανισθῆναι
  choice: comparecer
  rationale: No contexto de acesso sacerdotal à presença de Deus, 'comparecer' é idiomático e preserva a ideia de apresentar-se sem acrescentar conteúdo reflexivo explícito.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: diante da face de Deus
  rationale: Preserva de modo inteligível a imagem concreta do original e sua ênfase no acesso pessoal e imediato a Deus.
- source_word: ὑπὲρ ἡμῶν
  choice: em nosso favor
  rationale: Comunica a força representativa e mediadora de ὑπέρ sem impor uma teoria expiatória mais específica.
theological_decisions:
- issue: Terminologia cultual de ἅγια
  choice: lugares santos
  alternative: o santuário; o Santo Lugar
  rationale: O plural grego favorece uma formulação plural. Esta escolha preserva a imagem do tabernáculo e evita identificar prematuramente uma câmara específica.
- issue: Título cristológico Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: O valor titular está ativo no argumento sobre cumprimento e sacerdócio; 'o Messias' torna esse sentido explícito sem alterar a cristologia do texto.
- issue: Sentido de ἀντίτυπα
  choice: representações
  alternative: cópias; correspondentes
  rationale: O termo indica coisas terrenas que correspondem às realidades celestiais. 'Representações' conserva essa relação sem exigir a noção moderna de reprodução exata.
- issue: Força mediadora de ὑπὲρ ἡμῶν
  choice: em nosso favor
  alternative: por nós
  rationale: A formulação conserva o caráter representativo do ministério sacerdotal sem definir além do verso o mecanismo dessa mediação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém o plural cultual, a intensidade de “o próprio céu” e a imagem literal da face de Deus, explicando em nota a alternativa idiomática.
