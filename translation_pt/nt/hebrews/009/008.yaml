  source_fidelity: A oração é em geral fiel ao grego e preserva corretamente o sentido cultual de τῶν ἁγίων como acesso aos lugares santos. Contudo, «ainda não havia sido revelado» desloca desnecessariamente a afirmação para um passado anterior, ao passo que o perfeito passivo μήπω πεφανερῶσθαι, dependente do presente δηλοῦντος, é mais bem expresso por «ainda não foi revelado». «Continuava em vigor» também introduz uma formulação temporal passada e torna mais explícita a noção de validade cultual do que o grego exige; «ainda subsistia» conserva melhor a ambiguidade de στάσις entre permanência/existência e vigência.
  naturalness: «Com isso, o Espírito Santo indica» é claro, solene e natural. «Ainda não foi revelado» e «ainda subsistia» soam naturais em português moderno e mantêm a relação temporal do original com mais precisão.
  terminology: «Espírito Santo», «lugares santos» e «tabernáculo» são terminologia adequada e coerente com o contexto de Hebreus. A nota sobre «Santo dos Santos» preserva legitimamente uma leitura mais específica sem a impor ao texto.
  issues:
