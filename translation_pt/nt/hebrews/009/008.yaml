    issue: Tempo verbal de «ainda não havia sido revelado»
    rationale: O mais-que-perfeito português sugere uma anterioridade em relação a um ponto passado que não está expresso no grego. O perfeito passivo μήπω πεφανερῶσθαι comunica que o caminho ainda não se encontrava revelado; «ainda não foi revelado» reproduz isso sem deslocamento temporal.
  - severity: low
    issue: «Continuava em vigor» para ἐχούσης στάσιν
    rationale: A formulação interpreta στάσις principalmente como vigência normativa e usa um enquadramento passado. «Ainda subsistia» é mais abrangente, podendo referir-se à permanência, existência ou vigência, sem decidir a questão.
