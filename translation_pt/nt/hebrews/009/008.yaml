id: HEB.9.8
reference: Hebrews 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: pt
  text: Com isso, o Espírito Santo indica que o caminho para os lugares santos[a] ainda não foi revelado enquanto o primeiro tabernáculo ainda subsistia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o caminho para o santuário”. A expressão grega pode designar os recintos sagrados em geral; alguns a entendem mais especificamente como “o caminho para o Santo dos Santos”.
    reason: alternative_reading
  - marker: b
    text: Ou “enquanto o primeiro tabernáculo ainda permanecia de pé”. A expressão também pode referir-se à sua continuidade ou vigência.
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: indica
  rationale: O particípio presente, em construção genitiva absoluta, expressa a explicação que o Espírito Santo dá por meio do arranjo descrito; “indica” é claro, atual e digno em português.
- source_word: πνεύματος τοῦ ἁγίου
  choice: o Espírito Santo
  rationale: É a forma consagrada e natural em português para o referente pessoal no Novo Testamento.
- source_word: μήπω πεφανερῶσθαι
  choice: ainda não havia sido revelado
  rationale: O infinitivo perfeito passivo descreve o estado de algo que até então não fora dado a conhecer; a locução mantém tanto a anterioridade contextual quanto a voz passiva.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: o caminho para os lugares santos
  rationale: No contexto do tabernáculo, o genitivo substantivado plural designa o espaço sagrado. “Para” comunica naturalmente a ideia contextual de acesso sem estreitar o referente ao Santo dos Santos.
- source_word: πρώτης σκηνῆς
  choice: o primeiro tabernáculo
  rationale: Mantém a terminologia cultual e a qualificação ordinal do grego, sem substituir explicitamente o referente por “primeiro compartimento” ou “parte externa”.
- source_word: ἐχούσης στάσιν
  choice: continuava em vigor
  rationale: A expressão pode denotar permanência, existência ou vigência. No argumento de Hebreus, esta formulação comunica a manutenção do estatuto cultual, enquanto a nota preserva a leitura física mais literal.
- source_word: ἔτι
  choice: continuava
  rationale: A noção durativa de “ainda” é incorporada de modo idiomático ao verbo “continuava”.
theological_decisions:
- issue: Referente de τῶν ἁγίων
  choice: os lugares santos, isto é, o santuário em sentido cultual
  alternative: o Santo dos Santos especificamente; ou, fora deste contexto, os santos
  rationale: O contexto imediato trata da disposição do tabernáculo e do acesso sacerdotal. O plural deve conservar sua amplitude espacial, sem ser reduzido no texto principal ao compartimento interior.
- issue: Sentido de ἐχούσης στάσιν
  choice: continuidade de vigência do primeiro tabernáculo
  alternative: 'permanência física: “ainda permanecia de pé”'
  rationale: A escolha se ajusta ao argumento sobre acesso e ordem cultual, mas a expressão grega admite uma descrição mais concreta da permanência, registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Tabernáculo” preserva o cenário cultual; as notas mantêm as ambiguidades legítimas quanto ao alcance do santuário e à permanência ou vigência do primeiro tabernáculo.
