id: HEB.9.23
reference: Hebrews 9:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: pt
  text: Portanto, era necessário que as cópias[a] das coisas que estão nos céus fossem purificadas[b] por meio destas coisas, mas as próprias coisas celestiais, com sacrifícios melhores[c] do que estes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “modelos” ou “representações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “limpas”. O verbo pertence à linguagem ritual de limpeza ou purificação.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “sacrifícios melhores”, no plural, embora o contexto de Hebreus se concentre na oferta única e definitiva do Messias.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Portanto, era necessário
  rationale: Expressa de modo natural a necessidade impessoal e a inferência marcada por οὖν; o passado se ajusta à explicação retrospectiva do contexto.
- source_word: ὑποδείγματα
  choice: cópias
  rationale: Mantém o contraste entre as representações terrenas e as próprias coisas celestiais, sem tornar explícita uma interpretação além do texto.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: das coisas que estão nos céus
  rationale: Preserva a construção locativa e o plural de οὐρανοῖς, distinguindo-a do adjetivo ἐπουράνια na oração seguinte.
- source_word: τούτοις
  choice: com essas coisas
  rationale: Mantém o demonstrativo substantivado sem acrescentar no texto um referente como “sacrifícios” ou “ritos”, que é inferido do contexto.
- source_word: καθαρίζεσθαι
  choice: fossem purificadas
  rationale: “Purificar” comunica com clareza o sentido ritual do verbo e concorda naturalmente com “cópias”.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: mas as próprias coisas celestiais
  rationale: “Próprias” preserva a ênfase de αὐτά, e “coisas celestiais” mantém a formulação deliberadamente ampla do grego.
- source_word: κρείττοσι θυσίαις
  choice: com sacrifícios melhores
  rationale: Conserva o vocábulo característico “melhores” e, de modo importante, o plural θυσίαις.
- source_word: παρὰ ταύτας
  choice: do que essas
  rationale: A preposição com o comparativo marca comparação; o demonstrativo é mantido sem explicitação interpretativa.
theological_decisions:
- issue: A purificação das coisas celestiais
  choice: Conservar a afirmação de que as próprias coisas celestiais são purificadas.
  alternative: Identificar as coisas celestiais com o santuário celestial, com o povo celestial ou parafrasear de modo que o céu não pareça necessitar de purificação.
  rationale: O grego aplica linguagem de purificação tanto às cópias quanto às coisas celestiais. A tradução preserva essa tensão sem decidir o referente ou explicar a metáfora.
- issue: O plural “sacrifícios” em relação à oferta única de Cristo
  choice: Manter “sacrifícios” no plural.
  alternative: Harmonizar conceitualmente com o sacrifício único de Cristo e empregar o singular.
  rationale: θυσίαις está no plural. Mantê-lo respeita a forma do texto e evita resolver pela tradução sua relação com a oferta única enfatizada em outros pontos de Hebreus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo e a elipse da segunda oração. “Coisas” foi mantido por ser semanticamente aberto; evita-se substituir por “realidades”, “santuário” ou “ritos”.
