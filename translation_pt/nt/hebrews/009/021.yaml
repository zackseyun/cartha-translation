id: HEB.9.21
reference: Hebrews 9:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: pt
  text: Do mesmo modo, aspergiu com o sangue tanto o tabernáculo[a] como todos os utensílios do serviço sagrado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tenda”. O termo grego pode significar “tenda”, mas aqui se refere ao tabernáculo sagrado.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os objetos usados no culto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: tabernáculo
  rationale: No contexto de Hebreus 9, o termo designa a tenda-santuário mosaica; “tabernáculo” preserva essa referência cultual, enquanto a nota registra o sentido lexical mais geral.
- source_word: σκεύη
  choice: utensílios
  rationale: O termo abrange os objetos e instrumentos empregados no serviço do tabernáculo. “Utensílios” é claro em português e adequado ao contexto ritual.
- source_word: λειτουργία
  choice: serviço sagrado
  rationale: Aqui se refere ao serviço sacerdotal e cultual. O qualificativo “sagrado” torna esse sentido específico claro sem introduzir terminologia denominacional.
- source_word: αἷμα
  choice: sangue
  rationale: É uma referência direta ao sangue sacrificial no rito descrito.
- source_word: ὁμοίως
  choice: do mesmo modo
  rationale: Retoma e compara esta ação com a aspersão narrada no versículo anterior.
- source_word: ῥαντίζω
  choice: aspergiu
  rationale: É o verbo português corrente para a aplicação ritual de líquido por aspersão e mantém o registro digno da passagem.
- source_word: καί ... δὲ καί
  choice: tanto ... como
  rationale: Representa de maneira natural em português a construção coordenada que inclui o tabernáculo e todos os seus utensílios.
- source_word: πάντα τὰ σκεύη
  choice: todos os utensílios
  rationale: Preserva a abrangência expressa por πάντα e o plural coletivo do original.
theological_decisions:
- issue: Relação da afirmação com os ritos mosaicos narrados no Êxodo
  choice: Traduzir como uma afirmação resumida de que ele aspergiu com sangue o tabernáculo e seus utensílios cultuais.
  alternative: Acrescentar explicações históricas ou harmonizar explicitamente a declaração com os relatos do Êxodo.
  rationale: O texto apresenta a síntese do autor sem explicar possíveis questões intertextuais; a tradução preserva essa forma e não resolve a tensão por acréscimo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aspergiu” mantém a precisão ritual; “serviço sagrado” comunica o sentido cultual sem depender de jargão denominacional.
