  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: pt
  text: 'Mas a qual dos anjos ele alguma vez disse: “Sente-se à minha direita, até que eu ponha os seus inimigos como estrado para os seus pés[a]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que eu ponha os seus inimigos debaixo dos seus pés”.'
    reason: Alternativa lexical que explicita o sentido espacial e a imagem de sujeição comunicados por ὑποπόδιον τῶν ποδῶν σου.
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Mas a qual dos anjos
  rationale: A preposição πρός com τίνα, depois de um verbo de fala, tem o sentido de “a quem”. “Mas” preserva o contraste introduzido por δέ com o argumento anterior.
- source_word: εἴρηκέν ποτε
  choice: ele alguma vez disse
  rationale: “Alguma vez disse” expressa com naturalidade o valor de ποτέ e o ato de fala cuja força permanece no argumento. O pronome “ele” retoma Deus no contexto sem acrescentar interpretação ao texto.
- source_word: Κάθου
  choice: Sente-se
  rationale: Imperativo natural e digno em português contemporâneo, adequado à fala direta e amplamente compreensível, inclusive para leitores brasileiros.
- source_word: ἐκ δεξιῶν μου
  choice: à minha direita
  rationale: Expressão idiomática consagrada para a posição de honra indicada pela fórmula de entronização; traduz o sentido locativo da construção.
- source_word: ἕως ἂν θῶ
  choice: até que eu ponha
  rationale: “Até que” com o subjuntivo preserva a referência futura da construção grega, e “ponha” mantém o sentido básico de τίθημι sem perder a naturalidade.
- source_word: τοὺς ἐχθρούς σου
  choice: os seus inimigos
  rationale: Tradução direta do objeto plural, mantendo a referência aos inimigos da pessoa interpelada.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: como estrado para os seus pés
  rationale: Preserva a imagem régia de sujeição do texto citado. “Estrado para os pés” é claro e corrente, sem recorrer ao arcaísmo “escabelo”.
theological_decisions:
- issue: Preservação da força cristológica da citação do Salmo 110:1 sem explicá-la além do texto
  choice: 'Manter a citação como uma declaração régia dirigida singularmente ao Filho: “Sente-se à minha direita, até que eu ponha os seus inimigos como estrado para os seus pés”.'
  alternative: Parafrasear a imagem como “até que eu derrote completamente os seus inimigos”.
  rationale: O argumento de Hebreus depende da formulação da Escritura e do contraste entre o Filho e os anjos. A imagem de entronização e sujeição é, portanto, preservada, em vez de ser substituída por uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita “escabelo”, hoje pouco comum, e conserva tanto a pergunta retórica quanto a imagem bíblica de entronização.
