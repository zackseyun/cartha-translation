id: HEB.1.4
reference: Hebrews 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: pt
  text: tendo se tornado tão superior aos anjos quanto o nome que herdou é mais excelente do que o deles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tão melhor do que os anjos... mais distinto do que o deles”.'
    reason: lexical_alternative
  - marker: b
    text: O contexto seguinte esclarece que o “nome” se refere à designação e à condição filial do Filho.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: tão ... quanto
  rationale: A construção correlativa expressa uma comparação proporcional; “tão... quanto” é natural em português e conserva a relação entre a superioridade do Filho e a excelência do nome herdado.
- source_word: κρείττων
  choice: superior
  rationale: No contraste com os anjos, indica superioridade de posição ou dignidade, sem sugerir primariamente qualidade moral, como “melhor” poderia fazer.
- source_word: γενόμενος
  choice: tendo se tornado
  rationale: Representa de modo direto o particípio aoristo e seu estado resultante, sem introduzir a ideia de criação que “tendo sido feito” poderia sugerir indevidamente.
- source_word: τῶν ἀγγέλων
  choice: aos anjos
  rationale: O genitivo de comparação é expresso idiomaticamente em português por “superior aos anjos”.
- source_word: διαφορώτερον
  choice: mais excelente
  rationale: No contexto, o comparativo comunica distinção e excelência superior; “mais excelente” preserva o registro elevado da passagem.
- source_word: παρ’ αὐτούς
  choice: do que o deles
  rationale: A comparação tem como referente implícito o nome dos anjos; a forma possessiva explicita isso naturalmente sem acrescentar uma interpretação além do contexto.
- source_word: κεκληρονόμηκεν
  choice: herdou
  rationale: O perfeito grego indica uma herança recebida cujos efeitos permanecem. Em português, o pretérito perfeito simples é a forma natural e não elimina necessariamente esse resultado presente.
- source_word: ὄνομα
  choice: o nome
  rationale: Embora anartro em grego, o substantivo é contextualmente definido, e os versículos seguintes esclarecem esse nome sem que seja necessário antecipar aqui “Filho”.
theological_decisions:
- issue: Implicação cristológica de γενόμενος em relação à condição do Filho
  choice: Traduzir de forma transparente como “tendo se tornado”, preservando o motivo de exaltação e a condição resultante no contexto.
  alternative: “Tendo sido feito”, que pode ser entendido como nomeação funcional, mas também pode sugerir inadvertidamente que o Filho foi criado.
  rationale: O texto contrasta o Filho com os anjos e fala de sua posição exaltada e do nome herdado. A tradução mantém a tensão verbal sem afirmar mudança de não divindade para divindade nem inserir uma explicação dogmática no versículo.
- issue: Sentido de “nome”
  choice: Manter literalmente “o nome” e deixar que o contexto seguinte esclareça sua referência filial e seu status.
  alternative: Explicitar “o título de Filho” ou parafrasear como “honra” ou “posição”.
  rationale: O versículo emprega apenas “nome”; antecipar a identificação eliminaria o desenvolvimento literário da passagem e reduziria a amplitude semântica do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada apenas o necessário para preservar com naturalidade a comparação proporcional e o tom elevado de Hebreus.
