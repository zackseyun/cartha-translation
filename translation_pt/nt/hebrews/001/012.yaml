id: HEB.1.12
reference: Hebrews 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: pt
  text: e, como um manto, tu os enrolarás; como uma veste, eles serão mudados. Tu, porém, és o mesmo, e os teus anos não terão fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus anos não cessarão” ou “não se esgotarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: como
  rationale: Introduz de modo natural a comparação em português.
- source_word: περιβόλαιον
  choice: manto
  rationale: Designa uma peça exterior que envolve o corpo e preserva a imagem poética do vestuário.
- source_word: ἑλίξεις
  choice: enrolarás
  rationale: O futuro de ἑλίσσω pode indicar enrolar ou dobrar; “enrolarás” comunica com clareza a ação aplicada ao manto.
- source_word: αὐτούς
  choice: os
  rationale: O pronome masculino plural retoma os elementos da criação mencionados no contexto anterior.
- source_word: ὡς ἱμάτιον
  choice: como uma veste
  rationale: Mantém a segunda comparação com uma peça de roupa e conserva o singular e o tom poético.
- source_word: ἀλλαγήσονται
  choice: eles serão mudados
  rationale: Preserva o futuro passivo e a ideia de que a ordem criada sofrerá mudança.
- source_word: σὺ δὲ
  choice: Tu, porém
  rationale: Marca claramente o contraste enfático entre a criação mutável e a permanência daquele a quem o texto se dirige.
- source_word: ὁ αὐτὸς
  choice: és o mesmo
  rationale: Reproduz de perto a expressão grega sem transformá-la em terminologia teológica técnica.
- source_word: τὰ ἔτη σου
  choice: os teus anos
  rationale: Conserva a metáfora temporal do original.
- source_word: οὐκ ἐκλείψουσιν
  choice: não terão fim
  rationale: Expressa naturalmente em português o sentido de não cessar ou não chegar ao fim; a alternativa mais formal é registrada em nota.
theological_decisions:
- issue: Linguagem de constância divina numa citação aplicada cristologicamente
  choice: Tu, porém, és o mesmo
  alternative: Tu, porém, permaneces o mesmo / não mudas
  rationale: A formulação conserva a afirmação direta de identidade e constância presente em ὁ αὐτός, sem acrescentar linguagem dogmática posterior.
translation_notes:
  register: Português moderno, claro e dignificado, com cadência poética. “Manto” e “veste” preservam as duas imagens paralelas do vestuário. O pronome “tu” acompanha o tratamento direto e solene, sem arcaísmo excessivo.
