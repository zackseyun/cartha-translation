  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: pt
  text: Há muito tempo[a], Deus falou aos pais[b], em muitas partes e de muitas maneiras, pelos profetas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Antigamente».
    reason: lexical_alternative
  - marker: b
    text: Ou «aos antepassados»; em grego, «aos pais».
    reason: lexical_alternative
  - marker: c
    text: Ou «por meio dos profetas»; literalmente, «nos profetas».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: em muitas partes
  rationale: Preserva a ideia de multiplicidade em partes ou porções e mantém a distinção em relação a πολυτρόπως, que descreve a diversidade dos modos.
- source_word: πολυτρόπως
  choice: de muitas maneiras
  rationale: Expressa com naturalidade a diversidade dos modos pelos quais Deus falou, sem confundir o termo com Πολυμερῶς.
- source_word: πάλαι
  choice: Há muito tempo
  rationale: Forma corrente e clara de indicar um passado remoto, sem tom arcaizante.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Representa diretamente o sujeito nominativo; o artigo grego não requer equivalente em português.
- source_word: λαλήσας
  choice: falou
  rationale: Embora seja formalmente um particípio aoristo, ele se articula com o verbo principal do versículo 2. A forma finita produz português natural neste versículo e conserva o contraste temporal com a fala posterior no Filho.
- source_word: τοῖς πατράσιν
  choice: aos pais
  rationale: Mantém a formulação histórica e marcada por gênero do grego, sem acrescentar o possessivo 'nossos'. 'Antepassados' permanece uma alternativa contextual possível.
- source_word: ἐν τοῖς προφήταις
  choice: pelos profetas
  rationale: Entende ἐν em sentido instrumental ou associativo, apresentando os profetas como agentes por meio dos quais Deus falou. A nota conserva a formulação mais literal e a alternativa 'por meio dos profetas'.
theological_decisions:
- issue: Relação da construção participial com Hebreus 1:2
  choice: Empregar o verbo finito «Deus falou» no versículo 1, preservando o contraste temporal com o versículo 2.
  alternative: 'Manter mais formalmente o particípio: «Deus, tendo falado...»'
  rationale: O particípio λαλήσας é sintaticamente completado pelo verbo principal do versículo 2, mas, isolado, «tendo falado» deixaria o versículo incompleto em português. A escolha conserva o sentido sem explicitar além do texto a natureza teológica da progressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial acompanha a ênfase do grego. «Em muitas partes e de muitas maneiras» conserva o paralelismo e a distinção semântica entre os dois advérbios. Todos os marcadores de nota aparecem no texto principal.
