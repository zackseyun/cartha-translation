id: HEB.1.2
reference: Hebrews 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: pt
  text: nestes últimos dias, falou-nos por meio de um Filho[a], a quem constituiu herdeiro de todas as coisas e por meio de quem também fez as eras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em um Filho”; mais literalmente, “em Filho”. O grego não traz artigo antes de “Filho” e pode destacar o modo e o caráter culminante da fala de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “fez o universo” ou “fez os mundos”. A expressão grega “as eras” pode referir-se às próprias eras e, por extensão, a toda a ordem criada.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: nestes últimos dias
  rationale: Expressão temporal natural em português que preserva a força escatológica da construção grega.
- source_word: ἐλάλησεν ἡμῖν
  choice: falou-nos
  rationale: O aoristo indica uma ação passada e completa; o pretérito perfeito português comunica isso de modo natural, sem precisar explicitar no verbo sua relevância presente.
- source_word: ἐν υἱῷ
  choice: por meio de um Filho
  rationale: Torna inteligível o valor instrumental ou modal de ἐν e preserva a ausência do artigo definido antes de υἱῷ. A forma mais literal é registrada em nota para manter visível a construção incomum.
- source_word: ὃν ἔθηκεν
  choice: a quem constituiu
  rationale: Neste contexto, τίθημι significa estabelecer ou designar alguém para uma posição; “constituiu” combina naturalmente com “herdeiro” e mantém um registro digno.
- source_word: κληρονόμον πάντων
  choice: herdeiro de todas as coisas
  rationale: Formulação clara e tradicional que preserva a amplitude de πάντων.
- source_word: δι’ οὗ
  choice: por meio de quem
  rationale: διά com o genitivo expressa agência intermediária; a formulação retoma naturalmente o antecedente pessoal.
- source_word: ἐποίησεν
  choice: fez
  rationale: Mantém a amplitude semântica de ποιέω, evitando especificá-lo automaticamente como κτίζω, embora o contexto tenha alcance criacional.
- source_word: τοὺς αἰῶνας
  choice: as eras
  rationale: Preserva o sentido lexical temporal e sua possível extensão cósmica, sem reduzi-lo de antemão apenas ao universo espacial.
theological_decisions:
- issue: Força cristológica de ἐν υἱῷ
  choice: por meio de um Filho
  alternative: em Filho; em um Filho; por meio do Filho
  rationale: A tradução conserva a expressão anártrica e apresenta o Filho como o modo culminante da fala divina, sem acrescentar o possessivo “seu” nem definir o artigo onde o grego não o traz. A nota preserva a forma mais literal e a possível nuance de esfera ou modo.
- issue: Alcance de τοὺς αἰῶνας na atuação criadora do Filho
  choice: as eras
  alternative: o universo; os mundos; a ordem criada
  rationale: O termo grego pode designar eras e, por extensão, a totalidade da ordem criada. A opção principal mantém sua amplitude temporal-cósmica, e a nota apresenta as leituras contextuais comuns sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A colocação pronominal “falou-nos” mantém solenidade moderada sem arcaísmo excessivo. As notas preservam as ambiguidades relevantes de ἐν υἱῷ e τοὺς αἰῶνας.
