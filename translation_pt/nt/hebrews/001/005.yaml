source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: pt
  text: 'Pois a qual dos anjos ele jamais disse[a]: “Você é meu Filho; hoje eu gerei você[b]”? E, novamente: “Eu serei para ele um pai, e ele será para mim um filho[c]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “disse em algum momento”.
    reason: lexical_alternative
  - marker: b
    text: “Hoje eu gerei você” retoma Salmo 2:7. A frase tem sido relacionada à entronização real, à ressurreição ou à relação eterna do Filho com o Pai; a tradução preserva a formulação sem decidir entre essas interpretações.
    reason: cross_reference
  - marker: c
    text: 'Citação de 2 Samuel 7:14. Uma tradução mais idiomática seria: “Eu serei o pai dele, e ele será o meu filho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: a qual dos anjos
  rationale: Mantém a pergunta distributiva e o contraste entre o Filho e cada um dos anjos.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o argumento anterior.
- source_word: εἶπέν ποτε
  choice: alguma vez disse
  rationale: Expressa de modo natural a ideia retórica de qualquer ocasião possível.
- source_word: ἀγγέλων
  choice: anjos
  rationale: O contexto de Hebreus 1 indica seres celestiais, não mensageiros humanos.
- source_word: Υἱός μου εἶ σύ
  choice: Você é meu Filho
  rationale: Usa ordem natural em português e conserva o título filial no contexto cristológico.
- source_word: σήμερον γεγέννηκά σε
  choice: hoje eu gerei você
  rationale: Conserva o advérbio temporal e a linguagem de gerar sem decidir antecipadamente seu sentido teológico. O pretérito perfeito é mais idiomático em português do que uma reprodução mecânica do perfeito grego.
- source_word: καὶ πάλιν
  choice: E, novamente
  rationale: Introduz claramente uma segunda citação das Escrituras.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Eu serei pai para ele
  rationale: Preserva a relação expressa pela construção grega, com formulação natural e solene em português.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: e ele será filho para mim
  rationale: Mantém o paralelismo equilibrado da fórmula pactual e evita tornar a expressão mais interpretativa do que o original.
theological_decisions:
- issue: Sentido de “hoje eu gerei você”
  choice: Conservar a linguagem de geração sem explicar seu referente no corpo do texto.
  alternative: Interpretar explicitamente a frase como entronização real, ressurreição ou relação eterna do Filho com o Pai.
  rationale: A citação de Salmos 2:7 admite discussão quanto à sua aplicação precisa em Hebreus. A tradução deve preservar essa tensão interpretativa.
- issue: Distinção gráfica entre “Filho” e “filho”
  choice: Usar “Filho” na primeira citação e “filho” na segunda.
  alternative: Empregar inicial maiúscula ou minúscula nas duas ocorrências.
  rationale: A primeira ocorrência funciona diretamente como título no argumento cristológico; a segunda conserva a forma geral da fórmula pactual de 2 Samuel 7:14, embora Hebreus a aplique ao Filho.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Você” torna a fala direta inequívoca e natural; “gerei” preserva a metáfora do original sem recorrer a linguagem arcaica. O paralelismo da segunda citação foi mantido.
