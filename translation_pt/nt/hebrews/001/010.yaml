  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: pt
  text: E[a] “Tu, Senhor, no princípio lançaste os alicerces da terra, e os céus são obras das tuas mãos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no começo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: E
  rationale: Introduz mais uma citação na sequência. A conjunção simples preserva a ligação sem explicitar além do texto.
- source_word: Σὺ
  choice: Tu
  rationale: O pronome grego expresso é enfático; “Tu” preserva a ênfase e concorda naturalmente com o tratamento direto a “Senhor”.
- source_word: κατ’ ἀρχάς
  choice: no princípio
  rationale: Expressão temporal que indica o começo ou origem. “No princípio” é natural no contexto da criação e mantém a conhecida linguagem bíblica.
- source_word: κύριε
  choice: Senhor
  rationale: Vocativo de κύριος; “Senhor” preserva o tratamento direto presente na citação.
- source_word: τὴν γῆν
  choice: a terra
  rationale: No contexto da criação e em paralelo com “os céus”, γῆ designa a terra, não uma região específica.
- source_word: ἐθεμελίωσας
  choice: lançaste os alicerces de
  rationale: Preserva de maneira clara e idiomática a metáfora arquitetônica do verbo θεμελιόω.
- source_word: ἔργα τῶν χειρῶν σού
  choice: obra das tuas mãos
  rationale: Mantém a imagem antropomórfica e concreta do que foi feito pelas mãos do Senhor. O singular coletivo “obra” é idiomático em português, embora o grego use o plural.
- source_word: οἱ οὐρανοί
  choice: os céus
  rationale: Reproduz o plural grego e a linguagem bíblica da criação, em paralelo com “a terra”.
theological_decisions:
- issue: Aplicação ao Filho, em Hebreus 1, da linguagem do Salmo dirigida ao Senhor
  choice: Manter o tratamento direto “Tu, Senhor” sem atenuá-lo.
  alternative: Formular a citação de modo mais neutro para reduzir sua força cristológica.
  rationale: O grego traz explicitamente κύριε no vocativo dentro da citação. A tradução preserva a aplicação feita pelo autor de Hebreus sem acrescentar explicação doutrinária ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “Tu” por ser uma citação solene em discurso direto e para preservar a ênfase do pronome grego; as formas verbais e possessivas mantêm concordância consistente. A construção conserva o paralelismo poético entre terra e céus.
