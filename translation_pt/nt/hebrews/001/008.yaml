  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: pt
  text: 'Mas, a respeito do Filho, diz[a]: “O teu trono, ó Deus[b], é para todo o sempre, e o cetro da retidão[c] é o cetro do teu reino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, ao Filho, [diz]”. O verbo de fala é retomado da construção anterior.'
    reason: syntactic_clarification
  - marker: b
    text: 'Ou, menos provavelmente: “Deus é o teu trono para todo o sempre”. A sintaxe grega tem sido debatida, mas o vocativo “ó Deus” se ajusta melhor ao contexto e à força da citação.'
    reason: alternative_reading
  - marker: c
    text: Ou “justiça”. O termo grego pode denotar retidão ou retitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Mas, a respeito do Filho, ele diz
  rationale: No encadeamento de citações, πρός com acusativo pode introduzir o destinatário ou referente de uma declaração. A formulação explicita em português o verbo de fala subentendido e mantém o contraste com o que foi dito acerca dos anjos.
- source_word: υἱόν
  choice: o Filho
  rationale: O artigo indica uso definido e titular; “o Filho” preserva o título cristológico e o contraste do contexto.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: O teu trono, ó Deus
  rationale: A leitura de ὁ θεός com força vocativa é a mais natural no contexto da citação e do argumento de Hebreus. A construção predicativa continua gramaticalmente possível e é registrada em nota.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: permanece para todo o sempre
  rationale: A expressão idiomática indica duração sem fim. “Para todo o sempre” transmite naturalmente sua força; “permanece” supre em português a cópula implícita da oração nominal grega.
- source_word: ῥάβδος
  choice: cetro
  rationale: No contexto régio, designa a vara que simboliza autoridade real; “cetro” comunica essa imagem com precisão.
- source_word: τῆς εὐθύτητος
  choice: da retidão
  rationale: εὐθύτης expressa retidão, correção ou caráter direito. “Retidão” é corrente, digna e lexicalmente próxima, sem reduzir o termo apenas à justiça jurídica.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: o cetro do teu reino
  rationale: Mantém a imagem régia e traduz βασιλεία em seu sentido direto de reino ou domínio.
theological_decisions:
- issue: Se ὁ θεός é um vocativo dirigido ao Filho ou predicativo, no sentido de que Deus é o trono dele.
  choice: 'Vocativo: “O teu trono, ó Deus”.'
  alternative: “Deus é o teu trono para todo o sempre”.
  rationale: A leitura vocativa se ajusta melhor à sintaxe da citação tal como tradicionalmente compreendida e à função do texto no argumento sobre a superioridade do Filho. Como a alternativa é gramaticalmente possível, ela é preservada em nota, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Emprega “teu” em discurso direto por naturalidade bíblica e para conservar a distinção de segunda pessoa. A nota [a] registra a alternativa de relação de πρός; a nota [b] preserva tanto a ambiguidade sintática principal quanto a amplitude lexical de εὐθύτης.
