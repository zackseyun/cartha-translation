  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: pt
  text: Eles perecerão, mas tu permaneces; e todos eles se desgastarão[a] como uma veste,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta imagem retoma Salmos 102:25–27 e contrasta a transitoriedade da criação com a permanência daquele a quem o texto se dirige. O verbo também pode ser traduzido por «envelhecerão».
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Eles
  rationale: Retoma os céus e a terra do versículo anterior. A posição inicial e o contraste com «tu» preservam a ênfase do pronome grego.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Expressa o fim ou desaparecimento da ordem criada sem especificar um agente externo, mantendo a força do verbo.
- source_word: σὺ δὲ
  choice: mas tu
  rationale: Preserva o contraste enfático entre a criação transitória e aquele a quem o texto se dirige.
- source_word: διαμένεις
  choice: permaneces
  rationale: Comunica continuidade duradoura e corresponde naturalmente ao contraste com «perecerão».
- source_word: πάντες
  choice: todos eles
  rationale: Retoma coletivamente os elementos da criação mencionados antes e preserva a abrangência do grego.
- source_word: ὡς ἱμάτιον
  choice: como uma veste
  rationale: «Veste» é uma designação ampla e digna para uma peça de roupa, sem restringir indevidamente a imagem.
- source_word: παλαιωθήσονται
  choice: se desgastarão
  rationale: No contexto da comparação com uma veste, exprime de modo natural o envelhecimento e desgaste indicado pelo verbo passivo.
theological_decisions:
- issue: Destinatário e força cristológica
  choice: 'Manter a interpelação direta ao Filho: «tu permaneces».'
  alternative: Explicitar no texto «mas tu, ó Filho, permaneces».
  rationale: O contexto de Hebreus 1 identifica o destinatário, mas o versículo grego traz apenas o pronome de segunda pessoa. A tradução preserva a aplicação cristológica sem acrescentar uma identificação ausente desta oração.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. Emprega «tu permaneces» para conservar a segunda pessoa explícita e enfática do grego; a forma é natural em registro bíblico internacional. A pontuação final mantém a continuidade da frase no versículo seguinte.
