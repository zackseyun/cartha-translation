source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: pt
  text: Amaste a retidão e odiaste a transgressão da lei; por isso Deus, o teu Deus, te ungiu com óleo de alegria, acima dos teus companheiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπησας
  choice: Amaste
  rationale: O aoristo indicativo é vertido pelo pretérito perfeito simples, forma natural em português para uma ação vista como completa e adequada ao paralelismo elevado da citação.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: Em português, “justiça” abrange de modo natural a retidão moral e a conformidade com o que é justo neste contexto régio e messiânico.
- source_word: ἐμίσησας
  choice: odiaste
  rationale: Mantém a força do contraste moral direto com “amaste” e reproduz o paralelismo verbal do grego.
- source_word: ἀνομίαν
  choice: a transgressão da lei
  rationale: Explicita de maneira clara e atual a ideia de violação ou desprezo da lei, sem recorrer ao termo menos transparente “iniquidade”.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa com concisão e naturalidade a ligação causal ou inferencial do original.
- source_word: ἔχρισέν
  choice: ungiu
  rationale: Preserva a imagem régia e messiânica central do verbo χρίω; o pretérito perfeito harmoniza-se com o aspecto do aoristo.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Deus, o teu Deus
  rationale: Conserva a repetição e a aposição do grego, bem como a tensão cristológica, sem inserir explicação doutrinária.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: óleo de alegria
  rationale: Mantém a imagem bíblica de celebração e consagração numa formulação corrente e inteligível em português.
- source_word: παρὰ τοὺς μετόχους σου
  choice: acima dos teus companheiros
  rationale: Neste uso comparativo, παρά indica superioridade; “companheiros” preserva a relação pessoal sem a conotação comercial possível de “parceiros”.
theological_decisions:
- issue: Sentido de δικαιοσύνη neste contexto teologicamente significativo
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o equivalente português mais estabelecido e pode incluir a qualidade moral em foco; “retidão” seria possível, mas estreitaria a gama semântica.
- issue: Força cristológica de ὁ θεός, ὁ θεός σου em referência ao Filho
  choice: Deus, o teu Deus
  alternative: Expansão para esclarecer as relações trinitárias
  rationale: A redação é mantida sem suavização nem expansão, preservando a distinção relacional e a tensão teológica presentes no texto.
- issue: Relação causal indicada por διὰ τοῦτο
  choice: por isso
  alternative: por causa disso
  rationale: A tradução conserva a conexão entre o amor à justiça, o ódio à transgressão da lei e a unção, sem definir além do texto a natureza teológica dessa causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” por coerência com a interpelação poética singular. A sintaxe conserva o paralelismo da citação e evita arcaísmos como “iniquidade” e “júbilo”.
