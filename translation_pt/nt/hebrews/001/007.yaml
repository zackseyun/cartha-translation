reference: Hebrews 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: pt
  text: 'E, a respeito dos anjos, ele diz: “Ele faz dos seus anjos ventos[a] e dos seus ministros uma chama de fogo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espíritos”; a palavra grega pode significar tanto “ventos” como “espíritos”.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: a respeito dos anjos
  rationale: 'Com λέγει, πρός tem aqui sentido temático: a citação fala a respeito dos anjos, não diretamente a eles. A formulação também mantém o contraste do contexto com aquilo que Deus diz a respeito do Filho.'
- source_word: λέγει
  choice: ele diz
  rationale: Mantém o presente da fórmula de citação, apresentando a Escritura como palavra que continua falando.
- source_word: Ὁ ποιῶν
  choice: Ele faz
  rationale: Expressa de maneira natural em português a força verbal do particípio substantivado, sem acrescentar a ideia mais específica de nomeação ou designação.
- source_word: ἀγγέλους
  choice: anjos
  rationale: O contexto de Hebreus 1 trata dos seres celestiais contrastados com o Filho; por isso, 'anjos' é preferível ao sentido genérico 'mensageiros'.
- source_word: πνεύματα
  choice: ventos
  rationale: A palavra grega pode significar 'ventos' ou 'espíritos'. 'Ventos' se ajusta melhor ao pano de fundo do Salmo 104:4 e ao paralelismo poético com 'uma chama de fogo'; a ambiguidade genuína é preservada em nota.
- source_word: λειτουργοὺς
  choice: ministros
  rationale: O termo designa pessoas que prestam serviço, muitas vezes com caráter oficial ou sagrado. 'Ministros' conserva esse registro elevado sem especificar um cargo eclesiástico posterior.
- source_word: πυρὸς φλόγα
  choice: uma chama de fogo
  rationale: Mantém o singular do grego e sua imagem poética com uma expressão natural em português.
- source_word: αὐτοῦ
  choice: seus
  rationale: O possessivo refere-se naturalmente a Deus no contexto da citação.
theological_decisions:
- issue: Sentido de πνεύματα na citação do Salmo 104:4
  choice: ventos
  alternative: espíritos
  rationale: O sentido 'ventos' corresponde melhor à imagem poética e ao provável pano de fundo hebraico, mas o grego admite 'espíritos'. A alternativa é registrada em nota para não eliminar uma tensão interpretativa real.
translation_notes:
  register: Português moderno, claro e digno, com construção poética adequada a uma citação das Escrituras. 'A respeito dos anjos' evita sugerir que a citação seja dirigida aos anjos. O artigo antes de 'anjos' foi contraído naturalmente em 'dos', e a repetição de 'dos seus' preserva o paralelismo do original.
