revisions:
- from: Ele é o resplendor da glória de Deus e a expressão exata do seu ser. Ele sustenta todas as coisas pela palavra do seu poder e, depois de realizar por si mesmo[a] a purificação dos pecados, sentou-se à direita da Majestade nas alturas[b].
  to: Ele é o resplendor da glória de Deus e a expressão exata do seu ser. Ele sustenta todas as coisas pela palavra do seu poder e, depois de realizar, por meio de si mesmo[a], a purificação dos pecados, sentou-se à direita da Majestade nas alturas[b].
  rationale: A única alteração necessária substitui «por si mesmo» por «por meio de si mesmo», para refletir o valor instrumental de δι’ αὑτοῦ no texto grego adotado e conservar a distinção em relação à leitura ou formulação «by himself». As notas permanecem corretamente ancoradas e a nota textual continua descrevendo a omissão manuscrita da expressão.
