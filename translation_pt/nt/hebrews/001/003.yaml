id: HEB.1.3
reference: Hebrews 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: pt
  text: Ele é o resplendor da glória de Deus e a expressão exata do seu ser. Ele sustenta todas as coisas pela palavra do seu poder e, depois de realizar, por meio de si mesmo[a], a purificação dos pecados, sentou-se à direita da Majestade nas alturas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem “por meio de si mesmo”; a expressão foi mantida aqui de acordo com o texto da SBLGNT.
    reason: textual_variant
  - marker: b
    text: Ou “no alto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: resplendor
  rationale: Preserva a imagem de brilho que procede da glória divina sem sugerir um mero reflexo, em linguagem natural e digna.
- source_word: χαρακτήρ
  choice: expressão exata
  rationale: Comunica a correspondência precisa evocada pela marca de um selo; é mais clara no português corrente do que uma formulação como “impressão exata”.
- source_word: ὑπόστασις
  choice: ser
  rationale: Expressa a realidade própria de Deus sem inserir diretamente no texto a terminologia metafísica técnica desenvolvida posteriormente.
- source_word: φέρων
  choice: sustenta
  rationale: Indica a ação contínua pela qual o Filho mantém todas as coisas.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém o alcance abrangente da expressão grega sem restringi-la ao universo físico.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: pela palavra do seu poder
  rationale: Conserva a estrutura e a associação entre a palavra eficaz e o poder divino, sem estreitar ῥῆμα a “ordem”.
- source_word: δι’ αὑτοῦ
  choice: por si mesmo
  rationale: Neste contexto, a expressão indica que a purificação foi realizada mediante a própria atuação do Filho; a nota registra a variante textual que omite a frase.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: a purificação dos pecados
  rationale: Mantém a nuance cultual e sacrificial de καθαρισμός e reproduz de forma natural a relação genitiva com os pecados.
- source_word: ποιησάμενος
  choice: depois de realizar
  rationale: Explicita de modo natural a anterioridade da ação do particípio aoristo em relação a “sentou-se”.
- source_word: ἐν δεξιᾷ
  choice: à direita
  rationale: É a expressão portuguesa consagrada e natural para a posição de honra indicada pelo grego.
- source_word: ἐν ὑψηλοῖς
  choice: nas alturas
  rationale: Preserva a forma plural e a dimensão espacial da expressão, mantendo também sua possível conotação celestial.
theological_decisions:
- issue: Sentido de ὑπόστασις em uma passagem central para formulações cristológicas posteriores
  choice: ser
  alternative: natureza, substância ou essência
  rationale: “Ser” conserva a força ontológica do texto sem convertê-lo diretamente em terminologia conciliar posterior.
- issue: Força cristológica de ἀπαύγασμα e χαρακτήρ
  choice: resplendor e expressão exata
  alternative: reflexo e representação
  rationale: A formulação escolhida preserva a forte correspondência entre o Filho, a glória e a realidade de Deus, sem enfraquecê-la nem desenvolver uma explicação doutrinária além do grego.
- issue: Variante textual em δι’ αὑτοῦ
  choice: incluir “por si mesmo” no texto principal
  alternative: omitir a expressão
  rationale: A edição SBLGNT fornecida inclui δι’ αὑτοῦ; por transparência, a variante de omissão é registrada em nota.
- issue: Referente dos pronomes em “sua glória” e “seu ser”
  choice: tornar explícito “de Deus” na primeira ocorrência
  alternative: manter apenas os pronomes “sua” e “seu”
  rationale: O antecedente vem do contexto anterior e pode ficar obscuro em um versículo isolado em português; a explicitação não altera o referente e melhora a compreensão.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O registro é solene sem ser arcaico. A longa frase grega foi dividida em duas frases para clareza, preservando as relações lógicas e a sequência das ações.
