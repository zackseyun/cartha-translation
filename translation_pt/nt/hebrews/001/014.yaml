id: HEB.1.14
reference: Hebrews 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: pt
  text: Não são todos eles espíritos servidores, enviados para servir em favor dos que estão para herdar a salvação?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que herdarão a salvação”. A expressão grega tem sentido voltado para o futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Não são... ?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; esta construção é natural em português e preserva sua força.
- source_word: πάντες
  choice: todos eles
  rationale: Mantém o alcance abrangente do adjetivo plural e deixa claro que a referência é aos anjos mencionados no contexto.
- source_word: λειτουργικὰ πνεύματα
  choice: espíritos servidores
  rationale: λειτουργικός descreve quem presta serviço, muitas vezes com conotação sagrada ou oficial. “Servidores” é claro e digno, sem sugerir um cargo eclesiástico formal.
- source_word: εἰς διακονίαν
  choice: para servir
  rationale: Expressa naturalmente a finalidade da frase preposicional e evita a possível conotação institucional de “ministério”.
- source_word: ἀποστελλόμενα
  choice: enviados
  rationale: Preserva o particípio passivo que caracteriza esses espíritos, com formulação natural em português.
- source_word: διὰ
  choice: em favor de
  rationale: Com acusativo, διά pode indicar benefício ou finalidade; no contexto, os futuros herdeiros são os beneficiários do serviço angelical.
- source_word: τοὺς μέλλοντας
  choice: os que estão para
  rationale: Conserva o sentido prospectivo e voltado para o futuro de μέλλω sem introduzir a ideia mais forte de predestinação.
- source_word: κληρονομεῖν
  choice: herdar
  rationale: Preserva de modo conciso a imagem de herança, importante na argumentação de Hebreus.
- source_word: σωτηρίαν
  choice: a salvação
  rationale: É a tradução corrente e contextualmente adequada, mantendo abertas as dimensões presente e futura do conceito.
theological_decisions:
- issue: Força de μέλλοντας κληρονομεῖν σωτηρίαν
  choice: os que estão para herdar a salvação
  alternative: os que herdarão a salvação
  rationale: A redação escolhida preserva a orientação futura e prospectiva da expressão grega, sem transformá-la numa afirmação específica sobre predestinação ou certeza individual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta retórica e a imagem da herança foram preservadas; evitou-se linguagem eclesiástica técnica desnecessária.
