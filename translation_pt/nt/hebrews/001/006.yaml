  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: pt
  text: 'E quando ele trouxer novamente o Primogênito ao mundo,[a] diz: “E que todos os anjos de Deus o adorem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E novamente, quando ele trouxer o Primogênito ao mundo, diz: ‘Que todos os anjos de Deus o adorem.’” O advérbio grego traduzido como “novamente” pode modificar tanto “trouxer” quanto “diz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal referente a um acontecimento específico; “quando” é mais adequado aqui do que o sentido iterativo de “sempre que”.
- source_word: δὲ
  choice: E
  rationale: Conectivo leve que dá continuidade ao argumento sem criar um contraste forte.
- source_word: πάλιν
  choice: novamente
  rationale: No texto principal, modifica “introduzir”, de acordo com uma leitura natural da ordem grega. A possibilidade de modificar “diz” é preservada em nota.
- source_word: εἰσαγάγῃ
  choice: introduzir
  rationale: Conserva a ideia de fazer entrar ou trazer para dentro e combina naturalmente com “no mundo” em português.
- source_word: τὸν πρωτότοκον
  choice: o Primogênito
  rationale: Mantém o termo cristológico e suas ressonâncias de filiação e preeminência. A inicial maiúscula sinaliza seu uso como título do Filho no contexto.
- source_word: εἰς τὴν οἰκουμένην
  choice: no mundo
  rationale: Expressão clara e natural para a terra habitada ou o mundo humano; evita uma formulação desnecessariamente técnica.
- source_word: λέγει
  choice: diz
  rationale: Reproduz o presente grego sem acrescentar “nas Escrituras”. O sujeito implícito é Deus no contexto da sequência de citações.
- source_word: προσκυνησάτωσαν
  choice: que ... adorem
  rationale: Expressa naturalmente em português a força imperativa ou jussiva do verbo. Neste contexto, “adorem” comunica melhor a honra prestada ao Filho do que uma formulação reduzida a mera reverência.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome funciona como objeto de “adorem” e se refere ao Primogênito.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: todos os anjos de Deus
  rationale: Tradução direta, natural e clara da construção genitiva grega.
theological_decisions:
- issue: Escopo sintático de πάλιν
  choice: “novamente” modifica “introduzir”
  alternative: '“novamente” introduz outra citação: “E novamente, quando ele introduzir o Primogênito no mundo, diz...”'
  rationale: As duas construções são possíveis no grego. O texto principal segue a associação natural de πάλιν com o verbo que vem imediatamente depois, sem suprimir a alternativa genuína, registrada em nota.
- issue: Força de προσκυνέω em relação ao Filho
  choice: “adorem”
  alternative: “se prostrem diante dele” ou “lhe prestem homenagem”
  rationale: No argumento de Hebreus 1, todos os anjos são convocados a prestar ao Filho a honra expressa pelo verbo. “Adorem” preserva adequadamente sua força no contexto, sem atenuá-la para mera cortesia ou homenagem política.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência solene da citação sem recorrer a construções arcaicas. A vírgula antes do marcador integra a nota à oração temporal; “Primogênito” é grafado com inicial maiúscula por funcionar como título contextual.
