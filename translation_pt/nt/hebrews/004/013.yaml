  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: pt
  text: E nenhuma criatura está oculta diante dele, mas todas as coisas estão nuas e expostas[a] aos olhos daquele a quem devemos prestar contas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por “expostas” é raro e pode evocar a imagem do pescoço descoberto ou inclinado para trás, ressaltando a exposição completa diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com quem temos de tratar”. Mais literalmente, a expressão grega pode ser entendida como “a quem se dirige nossa palavra” ou “a quem diz respeito nossa questão”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: criatura
  rationale: O singular é genérico e abrange qualquer ser ou coisa criada. “Criatura” mantém de forma concisa a relação com o Criador, sem transformar o termo no coletivo abstrato “criação”.
- source_word: ἀφανὴς
  choice: oculta
  rationale: No contexto, o termo indica aquilo que não pode esconder-se da percepção e do exame divinos, não invisibilidade metafísica.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Preserva de modo natural o sentido espacial e relacional da expressão grega, enquanto a referência explícita aos olhos aparece na oração seguinte.
- source_word: πάντα
  choice: todas as coisas
  rationale: Reproduz o alcance abrangente do neutro plural e conserva o tom solene da passagem.
- source_word: γυμνὰ
  choice: nuas
  rationale: Mantém a metáfora vívida de completa ausência de cobertura diante do olhar divino.
- source_word: τετραχηλισμένα
  choice: expostas
  rationale: O particípio perfeito raro descreve um estado de total exposição. “Expostas” comunica claramente o resultado sem impor no texto principal uma imagem etimológica discutida ligada ao pescoço.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: aos olhos daquele
  rationale: Expressa diretamente a relação com o olhar divino e permite ligar com clareza o pronome relativo da oração final ao mesmo referente.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: a quem devemos prestar contas
  rationale: Comunica em português corrente a força contextual de responsabilidade perante Deus. A formulação grega é compacta e admite traduções mais literais, registradas em nota.
theological_decisions:
- issue: Sentido de πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'A oração expressa responsabilidade humana perante Deus: “a quem devemos prestar contas”.'
  alternative: “com quem temos de tratar” ou, mais literalmente, “a quem se dirige nossa palavra/questão”.
  rationale: O contexto imediato destaca o conhecimento penetrante e o juízo divinos. A tradução escolhida preserva a força de advertência sem acrescentar conteúdo doutrinário, enquanto a ambiguidade da expressão idiomática é reconhecida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos olhos daquele a quem” evita ambiguidade de referente e conserva a ligação sintática entre o olhar divino e a prestação de contas. O ponto e vírgula e “pelo contrário” tornam explícito o contraste marcado por δέ sem tornar a frase coloquial.
