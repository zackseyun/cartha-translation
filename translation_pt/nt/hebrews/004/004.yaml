id: HEB.4.4
reference: Hebrews 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: pt
  text: 'Pois, em certo lugar, ele falou assim a respeito do sétimo dia: “E Deus descansou, no sétimo dia, de todas as suas obras”.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em algum lugar”. O grego usa uma referência não específica ao local da citação, sem indicar incerteza quanto à autoridade das Escrituras.
    reason: lexical_alternative
  - marker: b
    text: Ou “cessou”. O verbo pode enfatizar que Deus parou de trabalhar; aqui, “descansou” preserva a ligação com Gênesis 2:2 e com o argumento sobre o descanso de Deus em Hebreus 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: falou
  rationale: O perfeito grego apresenta uma declaração passada que permanece relevante. Em português, o pretérito perfeito simples é a forma natural nesse contexto, sem perder a vigência da citação.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a fundamentação do argumento anterior de modo natural e digno.
- source_word: που
  choice: em certo lugar
  rationale: Reproduz a introdução não específica da citação bíblica sem sugerir dúvida quanto à sua autoridade.
- source_word: περὶ τῆς ἑβδόμης
  choice: a respeito do sétimo dia
  rationale: Explicita o substantivo 'dia', subentendido no adjetivo feminino grego, e mantém clareza.
- source_word: οὕτως
  choice: assim
  rationale: Introduz de forma concisa e idiomática as palavras da citação.
- source_word: Καὶ
  choice: E
  rationale: Mantém a conjunção que faz parte da citação de Gênesis.
- source_word: κατέπαυσεν
  choice: descansou
  rationale: Preserva a ligação lexical e temática com Gênesis 2 e com o argumento sobre o descanso de Deus em Hebreus 3–4; o verbo também pode enfatizar a cessação do trabalho.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Correspondência direta e natural para o sujeito nominativo.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: no sétimo dia
  rationale: É a expressão temporal idiomática em português e representa claramente a construção grega.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: de todas as suas obras
  rationale: Mantém o plural ἔργων e a preposição de afastamento, indicando que Deus cessou todas as suas obras.
theological_decisions:
- issue: A cessação sabática de Deus no argumento de Hebreus sobre o descanso
  choice: descansou
  alternative: cessou
  rationale: “Descansou” conserva a conexão canônica com Gênesis 2:2 e a terminologia central de Hebreus 3–4, sem exigir a ideia de fadiga; “cessou” registra uma nuance lexical possível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Em certo lugar” soa mais natural que o possível “em algum lugar” na fórmula de citação. A ordem e a pontuação favorecem leitura pública sem afastamento desnecessário da estrutura grega.
