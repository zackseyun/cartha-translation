id: HEB.4.14
reference: Hebrews 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: pt
  text: Portanto, visto que temos um grande sumo sacerdote que atravessou os céus — Jesus, o Filho de Deus —, apeguemo-nos firmemente à nossa confissão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantenhamo-nos firmes naquilo que professamos”. O grego traz literalmente “a confissão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Portanto, visto que temos
  rationale: A combinação preserva tanto a inferência marcada por οὖν quanto a função causal do particípio ἔχοντες, em português natural.
- source_word: ἀρχιερέα μέγαν
  choice: um grande sumo sacerdote
  rationale: Expressão consagrada e natural, que mantém a ênfase qualitativa do adjetivo sem tornar a construção artificial.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: que atravessou os céus
  rationale: Mantém a ideia de passagem expressa por διέρχομαι e conserva o plural οὐρανούς. O perfeito grego apresenta uma ação consumada cuja relevância permanece no contexto.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: Jesus, o Filho de Deus
  rationale: Preserva o nome e o título cristológico explícito, com a aposição clara em português.
- source_word: κρατῶμεν
  choice: apeguemo-nos firmemente
  rationale: O subjuntivo hortativo pede uma exortação inclusiva. A formulação comunica perseverança contínua em linguagem atual e digna.
- source_word: τῆς ὁμολογίας
  choice: à nossa confissão
  rationale: Com o verbo escolhido, a preposição 'a' é idiomática. 'Confissão' expressa o reconhecimento público da fé; 'nossa' explicita em português a referência comunitária contextual.
theological_decisions:
- issue: Tradução do título cristológico υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  alternative: o Filho de Deus / Filho de Deus sem artigo na formulação portuguesa
  rationale: A forma titular explícita conserva o peso cristológico do texto sem paráfrase nem redução.
- issue: Preservação da imagem cosmológica em τοὺς οὐρανούς
  choice: os céus
  alternative: o céu
  rationale: O plural do grego é mantido, sem desenvolver uma cosmologia além do que o próprio texto afirma.
- issue: Sentido de ὁμολογία
  choice: confissão
  alternative: declaração de fé; aquilo que professamos
  rationale: ‘Confissão’ preserva a densidade religiosa e pública do termo, sem especificar além do contexto o conteúdo exato confessado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. ‘Sumo sacerdote’, ‘Filho de Deus’ e ‘confissão’ preservam a linguagem bíblica reconhecível; ‘apeguemo-nos firmemente’ transmite a força da exortação sem arcaísmo excessivo.
