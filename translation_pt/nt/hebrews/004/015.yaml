source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: pt
  text: Pois não temos um sumo sacerdote incapaz de se compadecer de nossas fraquezas, mas um que foi provado em todos os aspectos, à nossa semelhança,[a] porém sem pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas um que foi tentado em todos os aspectos, como nós”. Literalmente, a expressão traduzida por “à nossa semelhança” é “segundo a semelhança”.'
    reason: Preserva os sentidos alternativos de πεπειρασμένον e a formulação explícita, porém incomum, de καθ’ ὁμοιότητα.
lexical_decisions:
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: Termo português consagrado e preciso para o ofício sacerdotal central ao argumento de Hebreus.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: incapaz de se compadecer
  rationale: Preserva a construção retórica negativa do grego e comunica participação compassiva nas fraquezas alheias, não mera pena.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: das nossas fraquezas
  rationale: Abrange fragilidade e vulnerabilidade humanas, sem limitar o sentido a enfermidades físicas.
- source_word: πεπειρασμένον
  choice: foi provado
  rationale: O verbo pode indicar provar ou tentar. 'Foi provado' expressa a realidade da experiência sob prova sem eliminar a alternativa lexical 'foi tentado', registrada em nota.
- source_word: κατὰ πάντα
  choice: em tudo
  rationale: Formulação natural e abrangente que conserva a ideia de totalidade ou de todos os aspectos relevantes.
- source_word: καθ’ ὁμοιότητα
  choice: à nossa semelhança
  rationale: Mantém o vocabulário explícito de semelhança e torna em português a comparação implícita no contexto, sem afirmar identidade absoluta de experiência.
- source_word: χωρὶς ἁμαρτίας
  choice: porém sem pecado
  rationale: Marca com clareza a exceção decisiva que qualifica a experiência de prova.
theological_decisions:
- issue: Sentido de πεπειρασμένον em relação à ausência de pecado em Cristo
  choice: foi provado
  alternative: foi tentado
  rationale: O campo semântico admite ambos os sentidos. A tradução principal evita sugerir inclinação pecaminosa interior, enquanto a nota preserva a leitura tradicional e legítima sem resolver indevidamente a tensão.
- issue: Explicitação da comparação em καθ’ ὁμοιότητα
  choice: à nossa semelhança
  alternative: segundo a semelhança; como nós
  rationale: A expressão grega menciona semelhança sem declarar expressamente o termo da comparação. O contexto aponta para a experiência humana compartilhada; a formulação adotada é natural, mas conserva a categoria de semelhança em vez de identidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A dupla negação retórica foi preservada, e a ordem foi levemente ajustada para soar natural em português. O marcador [a] aparece no texto principal.
