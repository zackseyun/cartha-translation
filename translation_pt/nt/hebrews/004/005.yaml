  text: καὶ ἐν τούτῳ πάλιν· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: pt
  text: 'E novamente, nesta passagem: “Certamente não entrarão no meu descanso”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “Se entrarão no meu descanso”, fórmula de juramento que significa: “Certamente não entrarão no meu descanso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: nesta passagem
  rationale: O demonstrativo com ἐν remete a outro lugar do texto bíblico citado. “Nesta passagem” expressa isso com clareza e naturalidade em português.
- source_word: πάλιν
  choice: novamente
  rationale: Indica uma nova citação ou um novo apelo às Escrituras.
- source_word: Εἰ εἰσελεύσονται
  choice: Certamente não entrarão
  rationale: A construção condicional grega reproduz uma fórmula semítica de juramento que, neste contexto, comunica uma negação enfática.
- source_word: κατάπαυσίν
  choice: descanso
  rationale: Preserva o termo-chave de Hebreus 3–4 e sua referência ao descanso de Deus.
- source_word: μου
  choice: meu
  rationale: Mantém diretamente o possessivo na fala divina citada do salmo.
theological_decisions:
- issue: Sentido da construção de juramento Εἰ εἰσελεύσονται
  choice: Certamente não entrarão no meu descanso
  alternative: Se entrarem no meu descanso
  rationale: Embora a forma grega seja literalmente condicional, ela reproduz uma fórmula de juramento hebraica usada como negação enfática. A tradução comunica sua força sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nesta passagem” explicita de modo natural a referência a outro trecho das Escrituras; “certamente não” conserva a força enfática da fórmula de juramento.
