source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: pt
  text: Pois, se Josué lhes tivesse dado descanso[a], Deus não teria falado mais tarde sobre outro dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “Jesus”. A forma do nome Ἰησοῦς pode designar tanto Jesus como Josué; aqui, o contexto aponta para Josué, filho de Num.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josué
  rationale: A forma grega pode designar Jesus ou Josué. Neste contexto, o argumento trata da entrada de Israel na terra sob Josué e de uma promessa posterior de descanso; por isso, “Josué” expressa o referente contextual.
- source_word: κατέπαυσεν
  choice: tivesse dado descanso
  rationale: O verbo tem sentido causativo, isto é, fazer cessar ou dar descanso. A formulação preserva esse valor e se integra naturalmente ao tema do descanso em Hebreus 3–4.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: não teria falado
  rationale: A construção com ἄν e o imperfeito exprime o resultado de uma condição contrária ao fato no passado.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: de outro dia
  rationale: A expressão aponta para um dia posterior, mostrando que a promessa de descanso não se esgotou na época de Josué.
- source_word: μετὰ ταῦτα
  choice: mais tarde
  rationale: 'Expressa com naturalidade a sequência temporal: a fala sobre outro dia ocorreu depois dos acontecimentos ligados a Josué.'
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que sustenta a afirmação anterior e mantém clara a ligação lógica.
theological_decisions:
- issue: Referente de Ἰησοῦς em Hebreus 4:8
  choice: Josué, filho de Num
  alternative: Jesus
  rationale: Embora a forma grega do nome seja idêntica, o contexto histórico e o contraste com a promessa posterior do Salmo 95 apontam para Josué. A forma literal alternativa é registrada em nota para transparência.
- issue: Sujeito implícito de ἐλάλει
  choice: ele
  alternative: Deus
  rationale: O grego não explicita novamente o sujeito. O pronome preserva essa característica e a possível tensão referencial, sem inserir diretamente “Deus” no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Pois” mantém a conexão argumentativa; “tivesse dado descanso” preserva o sentido causativo e a terminologia central da passagem.
