  source_fidelity: A tradução identifica corretamente Ἰησοῦς como Josué e preserva adequadamente o valor contrafactual de εἰ γὰρ ... οὐκ ἂν ... ἐλάλει. Contudo, «ele» em português retoma naturalmente «Josué», ao passo que, no contexto argumentativo, aquele que falou posteriormente sobre outro dia é Deus, na Escritura/Salmo 95. A explicitação de «Deus» evita uma atribuição historicamente e contextualmente inadequada a Josué.
  naturalness: «Pois, se Josué lhes tivesse dado descanso, Deus não teria falado mais tarde sobre outro dia» é claro, idiomático e mantém registro bíblico moderno. «Sobre outro dia» reproduz de modo natural περὶ ἄλλης ... ἡμέρας.
  terminology: «Josué», «descanso» e «outro dia» são escolhas apropriadas e coerentes com o argumento de Hebreus 3–4. A nota sobre a forma grega Ἰησοῦς é útil e suficiente.
