id: HEB.4.6
reference: Hebrews 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: pt
  text: Portanto, visto que ainda resta que alguns entrem nele, e aqueles a quem anteriormente foram anunciadas as boas-novas não entraram por causa da desobediência[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da incredulidade”. A palavra grega pode indicar a recusa em crer, manifestada na desobediência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Portanto, visto que
  rationale: Preserva tanto a inferência de οὖν quanto a função causal e introdutória de ἐπεί, com sintaxe natural em português.
- source_word: ἀπολείπεται
  choice: ainda resta
  rationale: Exprime a permanência da possibilidade de entrada; “ainda” torna explícito o valor continuativo sugerido pelo presente e pelo contexto.
- source_word: τινὰς
  choice: que alguns
  rationale: Mantém a referência pessoal indefinida e se integra naturalmente à construção portuguesa com o infinitivo flexionado.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: entrem nele
  rationale: O pronome retoma “descanso”, substantivo masculino em português, sem repetir o referente que o grego também apresenta pronominalmente.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: aqueles a quem anteriormente foram anunciadas as boas-novas
  rationale: Preserva a força passiva de εὐαγγελισθέντες, evita o tom técnico de “evangelizados” e traduz πρότερον de modo claro.
- source_word: οὐκ εἰσῆλθον
  choice: não entraram
  rationale: Tradução direta do aoristo negado, sem acrescentar a nuance de tentativa frustrada.
- source_word: δι’ ἀπείθειαν
  choice: por causa da desobediência
  rationale: “Desobediência” representa o sentido lexical central de ἀπείθεια, enquanto a nota registra sua relação contextual com a incredulidade.
theological_decisions:
- issue: Sentido de ἀπείθεια no contexto da advertência sobre entrar no descanso
  choice: por causa da desobediência
  alternative: por causa da incredulidade
  rationale: O termo pode designar a recusa em crer manifestada como desobediência. O texto principal conserva seu sentido mais direto, sem reduzir a tensão entre incredulidade e desobediência; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Boas-novas” comunica εὐαγγελίζω sem jargão eclesiástico; a oração permanece aberta ao versículo seguinte, como no texto grego.
