source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: pt
  text: Portanto, temamos[a] que, enquanto ainda permanece a promessa de entrar no descanso dele[b], algum de vocês pareça ter ficado aquém[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenhamos medo”. O verbo grego é mais forte do que um simples “tenhamos cuidado” e preserva a seriedade da advertência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais formalmente: “restando uma promessa de entrar no descanso dele”. A construção grega é compacta.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “pareça não tê-lo alcançado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: temamos
  rationale: O subjuntivo exortativo pede uma advertência direta e forte. “Temamos” preserva a intensidade de φοβέομαι sem suavizá-la para mera cautela.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão extraída da advertência anterior sobre os que não entraram no descanso.
- source_word: μήποτε
  choice: que
  rationale: Depois de “temamos”, a construção natural “temamos que” expressa o receio de que algo aconteça e mantém a força negativa de μήποτε.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: enquanto ainda permanece a promessa
  rationale: Expressa a circunstância simultânea do genitivo absoluto e a continuidade da promessa, sem tratá-la como já encerrada.
- source_word: ἐπαγγελίας
  choice: promessa
  rationale: É o equivalente corrente e preserva o conceito central da argumentação.
- source_word: εἰσελθεῖν
  choice: de entrar
  rationale: 'Liga naturalmente o infinitivo à promessa: a promessa de entrar no descanso.'
- source_word: κατάπαυσιν
  choice: descanso
  rationale: Mantém o termo recorrente de Hebreus 3–4 e não o reduz à simples cessação de atividade.
- source_word: αὐτοῦ
  choice: dele
  rationale: Conserva o pronome do grego sem substituir explicitamente seu referente por “Deus” no texto principal.
- source_word: δοκῇ
  choice: pareça
  rationale: Preserva o sentido de aparência ou avaliação de δοκέω, sem decidir se se trata apenas de aparência ou de fracasso efetivo.
- source_word: τις ἐξ ὑμῶν
  choice: algum de vocês
  rationale: Reproduz de modo natural a referência individualizante a alguém dentre os destinatários.
- source_word: ὑστερηκέναι
  choice: ter ficado para trás
  rationale: No contexto, indica não alcançar o objetivo prometido. A formulação mantém a imagem de insuficiência sem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Se a advertência deve ser suavizada e entendida apenas como cautela
  choice: Manter a exortação forte “temamos”
  alternative: “tenhamos cuidado”
  rationale: O verbo grego fala diretamente de temor. A tradução preserva a gravidade da advertência sem resolver questões doutrinárias sobre perseverança ou apostasia.
- issue: Se “o descanso dele” deve ser explicitado como um descanso escatológico de Deus
  choice: Manter “o descanso dele”
  alternative: “o descanso de Deus” ou “seu descanso sabático”
  rationale: O pronome está no texto grego e seu referente decorre do contexto. Não se acrescenta uma especificação interpretativa que o versículo não declara.
- issue: Se δοκῇ torna o fracasso apenas aparente
  choice: Preservar a formulação “pareça ter ficado para trás”
  alternative: “tenha deixado de alcançá-lo”
  rationale: A tradução mantém a tensão lexical de δοκέω, evitando apagar o elemento de aparência ou transformá-lo numa afirmação inequívoca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada ao uso natural do português, preservando a força exortativa, o genitivo absoluto circunstancial e a ambiguidade de δοκῇ.
