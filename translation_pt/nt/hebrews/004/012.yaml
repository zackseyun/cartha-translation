id: HEB.4.12
reference: Hebrews 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: pt
  text: Pois a palavra de Deus é viva e atuante[a], mais cortante que qualquer espada de dois gumes. Ela penetra[b] até a divisão da alma e do espírito[c], das juntas e das medulas, e é capaz de julgar os pensamentos e as intenções do coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eficaz” ou “ativa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “atravessa”, alcançando profundamente o interior.
    reason: lexical_alternative
  - marker: c
    text: A expressão não exige que “alma” e “espírito” sejam entendidos aqui como partes tecnicamente separáveis do ser humano; a imagem ressalta o alcance profundo da palavra de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: viva
  rationale: Preserva a ideia de vitalidade contínua e concorda naturalmente com “a palavra” em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa do versículo em relação à exortação anterior.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Tradução transparente que não restringe o referente às Escrituras, à mensagem proclamada, a uma declaração divina específica ou ao Logos pessoal.
- source_word: ἐνεργὴς
  choice: atuante
  rationale: Comunica que a palavra está em ação, sem acrescentar a ideia de poder que não está explicitamente contida no adjetivo; “eficaz” permanece uma alternativa legítima.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: mais cortante que qualquer espada de dois gumes
  rationale: Reproduz claramente a comparação e conserva a imagem concreta de uma espada afiada dos dois lados.
- source_word: διϊκνούμενος
  choice: penetra
  rationale: Expressa de modo vívido o movimento de alcançar profundamente e dá continuidade à imagem da espada.
- source_word: ἄχρι μερισμοῦ
  choice: até a divisão
  rationale: Preserva a noção de alcance ou extensão introduzida por ἄχρι e não define além do texto a natureza exata da divisão.
- source_word: ψυχῆς καὶ πνεύματος
  choice: da alma e do espírito
  rationale: Mantém os dois termos sem impor uma teoria específica sobre a composição do ser humano.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: das juntas e das medulas
  rationale: Conserva o paralelismo e o plural do grego; “medulas” é compreensível e formalmente correspondente.
- source_word: κριτικὸς
  choice: capaz de julgar
  rationale: Torna explícita em português a capacidade de avaliar expressa pelo adjetivo grego, sem reduzi-la a mera percepção psicológica.
- source_word: ἐνθυμήσεων
  choice: pensamentos
  rationale: Representa de maneira ampla e natural os raciocínios ou reflexões interiores.
- source_word: ἐννοιῶν
  choice: intenções
  rationale: Distingue o termo de “pensamentos” e destaca os propósitos ou desígnios interiores.
theological_decisions:
- issue: Referente de “a palavra de Deus”
  choice: Manter a expressão ampla “a palavra de Deus”.
  alternative: Especificar as Escrituras, a mensagem proclamada, uma promessa ou sentença divina, ou o Filho como Logos.
  rationale: O contexto destaca o falar eficaz de Deus, mas a expressão grega não exige que a tradução escolha exclusivamente um desses referentes.
- issue: Implicação antropológica de “alma e espírito”
  choice: Conservar os termos sem explicar a frase como descrição técnica das partes do ser humano.
  alternative: Entender a expressão como prova de uma antropologia dicotômica ou tricotômica, ou parafraseá-la apenas como “o íntimo do ser”.
  rationale: A imagem enfatiza o alcance penetrante da palavra; a tradução deve preservar a formulação e sua tensão sem transformar a metáfora em definição doutrinária.
- issue: Natureza da “divisão”
  choice: Preservar “até a divisão da alma e do espírito, das juntas e das medulas”.
  alternative: Explicitar “a separação entre alma e espírito” ou entender que a palavra divide cada elemento internamente.
  rationale: A construção genitiva grega admite alguma abertura quanto ao modo preciso da divisão; a versão evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A divisão em duas frases reduz o peso sintático sem perder a sequência argumentativa; “Ela” retoma inequivocamente “a palavra de Deus”.
