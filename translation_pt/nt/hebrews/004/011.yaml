id: HEB.4.11
reference: Hebrews 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: pt
  text: Portanto, esforcemo-nos para entrar naquele descanso, a fim de que ninguém caia seguindo o mesmo padrão de desobediência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mesmo exemplo de incredulidade”. A palavra grega significa mais diretamente “desobediência”, embora aqui possa ser entendida à luz da recusa da geração do deserto em confiar em Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: esforcemo-nos
  rationale: O subjuntivo aoristo tem força exortativa, e o verbo comunica empenho diligente e decidido. “Esforcemo-nos” é natural, conciso e preserva essa força.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a conclusão decorrente do argumento anterior sobre o descanso de Deus e o fracasso da geração do deserto.
- source_word: εἰσελθεῖν
  choice: para entrar
  rationale: O infinitivo complementa a exortação e expressa o objetivo do esforço.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: naquele descanso
  rationale: Mantém a ênfase demonstrativa e remete ao descanso divinamente prometido, já desenvolvido no contexto, sem defini-lo além do que o texto diz.
- source_word: ἵνα μὴ
  choice: a fim de que ninguém
  rationale: Reproduz com naturalidade a finalidade negativa e conserva a força solene da advertência.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: seguindo o mesmo padrão
  rationale: Ὑπόδειγμα pode indicar exemplo, modelo ou padrão de advertência. A formulação portuguesa comunica que o precedente da geração do deserto não deve ser repetido, evitando a construção pouco natural “cair no mesmo exemplo”.
- source_word: πέσῃ
  choice: caia
  rationale: Preserva de modo direto o verbo e sua forma subjuntiva na advertência.
- source_word: τῆς ἀπειθείας
  choice: de desobediência
  rationale: ἀπείθεια designa mais diretamente desobediência, embora no contexto de Hebreus esteja intimamente relacionada à falta de fé. A construção também preserva a relação genitiva com “padrão”.
theological_decisions:
- issue: Relação entre ἀπείθεια e o fracasso da geração do deserto
  choice: Traduzir ἀπείθεια por “desobediência” no texto principal.
  alternative: “incredulidade” ou “falta de fé”
  rationale: Hebreus associa estreitamente incredulidade e desobediência em sua exposição do Salmo 95, mas o sentido lexical mais direto de ἀπείθεια é “desobediência”. A nota conserva a alternativa contextual sem apagar essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Esforcemo-nos” mantém o tom exortativo; “naquele descanso” conserva a ligação com o argumento anterior; e “seguindo o mesmo padrão” torna idiomática a referência ao precedente negativo de Israel.
