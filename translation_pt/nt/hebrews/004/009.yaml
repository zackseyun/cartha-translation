  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: pt
  text: Portanto, ainda resta um descanso sabático[a] para o povo de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observância do sábado”. O termo grego σαββατισμός é raro e remete explicitamente ao sábado; aqui, provavelmente designa um descanso semelhante ao sábado que permanece para o povo de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Portanto
  rationale: Partícula inferencial que apresenta a conclusão do argumento anterior; “portanto” expressa com clareza essa relação lógica em português atual.
- source_word: ἀπολείπεται
  choice: ainda resta
  rationale: O verbo indica que algo permanece disponível ou não realizado; “ainda resta” comunica sua continuidade e reforça naturalmente o valor presente da forma verbal.
- source_word: σαββατισμός
  choice: descanso sabático
  rationale: O substantivo raro evoca explicitamente o sábado e, no contexto, aponta para um descanso semelhante ao de Deus. “Descanso sabático” preserva tanto a ressonância do sábado quanto a ênfase contextual no descanso prometido.
- source_word: τῷ λαῷ
  choice: para o povo
  rationale: 'O dativo é entendido naturalmente como benefício ou destinação: esse descanso permanece para o povo.'
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Tradução direta do genitivo, que expressa pertença ou relação e identifica o povo como pertencente a Deus.
theological_decisions:
- issue: Sentido de σαββατισμός em Hebreus 4:9
  choice: Um descanso de caráter sabático que ainda permanece para o povo de Deus.
  alternative: Uma observância literal do sábado; ou um descanso puramente metafórico, sem ressonância sabática.
  rationale: O termo remete explicitamente ao sábado, enquanto o contexto relaciona o descanso de Deus, o sétimo dia e o descanso prometido. “Descanso sabático” mantém essa tensão sem restringir o texto a uma prática semanal nem apagar sua linguagem sabática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção é concisa e preserva a inferência do contexto, a continuidade expressa pelo verbo e a ressonância sabática do substantivo raro.
