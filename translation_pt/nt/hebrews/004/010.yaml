id: HEB.4.10
reference: Hebrews 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: pt
  text: Pois aquele que entrou no descanso dele[a] descansou também, ele próprio, de suas obras[b], assim como Deus descansou de suas próprias obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que entrou no descanso de Deus”. O pronome “dele” provavelmente se refere a Deus no contexto de Hebreus 3–4.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “cessou de suas obras”. O verbo grego pertence à mesma família da palavra traduzida como “descanso”; por isso, o texto principal conserva a repetição da linguagem de descanso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: aquele que entrou
  rationale: O artigo com o particípio aoristo tem função substantivada e apresenta genericamente alguém cuja entrada no descanso se realizou.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação do versículo anterior.
- source_word: κατάπαυσιν
  choice: descanso
  rationale: Preserva o termo temático de Hebreus 3–4 e sua ligação com o descanso de Deus.
- source_word: αὐτοῦ (após κατάπαυσιν)
  choice: dele
  rationale: Mantém o pronome do grego sem explicitar no texto principal seu referente, embora o contexto favoreça Deus.
- source_word: καὶ αὐτὸς
  choice: também
  rationale: Expressa naturalmente o valor aditivo e comparativo; o sujeito já recebe destaque por meio de “aquele que”.
- source_word: κατέπαυσεν
  choice: descansou
  rationale: Conserva a relação lexical com κατάπαυσις; “cessou” também é possível, sobretudo por causa de ἀπό.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: de suas obras
  rationale: Tradução direta que não restringe ἔργα a esforços meritórios ou a um tipo específico de atividade.
- source_word: ὥσπερ
  choice: assim como
  rationale: Comunica com clareza a comparação entre o descanso daquele que entra e o descanso de Deus.
- source_word: ἀπὸ τῶν ἰδίων
  choice: das suas próprias
  rationale: Recupera por elipse o substantivo “obras”, já expresso na oração anterior, e mantém a ênfase de ἰδίων.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente padrão de θεός; permanece como sujeito explícito da comparação.
theological_decisions:
- issue: Referente de αὐτοῦ em “no descanso dele”
  choice: O contexto favorece entender que se trata do descanso de Deus, sem substituir o pronome por “de Deus” no texto principal.
  alternative: O pronome pode ser entendido como referência ao descanso da própria pessoa que entrou.
  rationale: Hebreus 3–4 fala repetidamente do descanso de Deus e relaciona a entrada nele ao descanso divino; manter “dele” preserva, porém, a ambiguidade formal do grego.
- issue: Identidade de “aquele que entrou”
  choice: A tradução mantém a expressão genérica, sem decidir se aponta para todo crente ou, de maneira específica, para Cristo.
  alternative: Interpretar o singular como referência específica a Cristo.
  rationale: A forma grega não nomeia o sujeito, e o argumento admite discussão interpretativa; explicitar uma identidade importaria uma decisão teológica não exigida pelo texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. A repetição de “descanso/descansou” preserva o jogo lexical do grego. Os marcadores aparecem no texto principal; a nota [a] também esclarece a elipse final.
