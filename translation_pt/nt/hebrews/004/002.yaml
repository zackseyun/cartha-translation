  source_fidelity: 'A oração final segue corretamente o texto da SBLGNT: o particípio acusativo plural συγκεκερασμένους se refere naturalmente a «eles», não à mensagem. Contudo, «recebemos o anúncio» enfraquece a voz passiva perifrástica de εὐηγγελισμένοι, que afirma que boas-novas lhes foram proclamadas.'
  naturalness: «Não foram unidos pela fé aos que ouviram» é compreensível, mas pouco idiomático em português e pode sugerir um evento pontual. «Não estavam unidos pela fé aos que ouviram» expressa de modo mais natural o estado resultante do particípio perfeito.
  terminology: «Boas-novas», «mensagem», «proveito» e «fé» são escolhas adequadas, modernas e teologicamente não tendenciosas. A nota preserva de maneira apropriada a variante textual e seu efeito interpretativo.
  issues:
