  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: pt
  text: Pois também a nós foram anunciadas boas-novas, assim como a eles; mas a mensagem que ouviram não lhes trouxe proveito, porque não estavam unidos pela fé aos que ouviram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução, seguindo uma variante textual: “porque a mensagem ouvida não se misturou com a fé nos que ouviram”.'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: recebemos o anúncio das boas-novas
  rationale: A construção perifrástica perfeita indica uma proclamação já recebida e ainda relevante. A formulação preserva a ideia verbal sem impor ao paralelo com a geração do deserto um uso técnico posterior de “evangelho”.
- source_word: καθάπερ κἀκεῖνοι
  choice: assim como eles
  rationale: Expressa de modo natural a igualdade entre os destinatários atuais e a geração mencionada quanto ao recebimento da mensagem divina.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: a mensagem que ouviram
  rationale: Traduz naturalmente a construção genitiva, entendendo λόγος como o conteúdo proclamado e ἀκοή como aquilo que foi ouvido.
- source_word: ὠφέλησεν
  choice: não lhes trouxe proveito
  rationale: Formulação corrente que conserva a ideia de que a mensagem não produziu vantagem ou benefício neles.
- source_word: συγκεκερασμένους
  choice: unidos
  rationale: O particípio evoca mistura ou combinação, mas aqui comunica metaforicamente a união de pessoas; o acusativo masculino plural concorda mais naturalmente com ἐκείνους.
- source_word: πίστει
  choice: pela fé
  rationale: “Fé” é a equivalência contextual mais adequada para πίστις; o dativo pode indicar o meio pelo qual a união teria ocorrido.
- source_word: τοῖς ἀκούσασιν
  choice: aos que ouviram
  rationale: Mantém a referência direta aos que ouviram, sem acrescentar explicitamente ao verbo a noção interpretativa de acolhimento obediente.
theological_decisions:
- issue: Sentido de πίστις no contraste entre ouvir e responder
  choice: fé
  alternative: confiança
  rationale: O contexto contrapõe a mera recepção auditiva da mensagem à resposta de fé. “Fé” preserva o termo teológico amplo sem definir de modo denominacional sua relação com perseverança ou fidelidade.
- issue: Referente do particípio συγκεκερασμένους na oração final
  choice: eles não foram unidos pela fé aos que ouviram
  alternative: a mensagem ouvida não se misturou com a fé nos que ouviram
  rationale: O texto da SBLGNT apresenta o particípio no acusativo masculino plural, que concorda naturalmente com ἐκείνους (“eles”). A conhecida variante no nominativo singular sustenta a leitura tradicional referente à mensagem; ela é preservada em nota para manter transparente a dificuldade textual e sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boas-novas” preserva o caráter de anúncio; “trouxe proveito” soa natural sem enfraquecer o contraste. A nota é colocada exatamente onde incide a variante textual.
