revisions:
- from: Pois nós também recebemos o anúncio das boas-novas, assim como eles; mas a mensagem que ouviram não lhes trouxe proveito, porque eles não foram unidos pela fé aos que ouviram.[a]
  to: Pois também a nós foram anunciadas boas-novas, assim como a eles; mas a mensagem que ouviram não lhes trouxe proveito, porque não estavam unidos pela fé aos que ouviram.[a]
  rationale: A revisão torna explícita a proclamação passiva das boas-novas e substitui uma formulação relacional pouco idiomática por «não estavam unidos», preservando a leitura do acusativo plural da SBLGNT. A nota continua a registrar a leitura variante em que a mensagem, e não as pessoas, é o sujeito da oração final.
