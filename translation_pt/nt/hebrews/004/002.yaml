    rationale: «Recebemos o anúncio das boas-novas» focaliza a recepção de um anúncio; «foram anunciadas boas-novas a nós» conserva mais diretamente a voz passiva e o aspecto de proclamação do grego.
  - severity: medium
    issue: A expressão «não foram unidos» soa pouco natural para o particípio perfeito em contexto relacional.
    rationale: «Não estavam unidos pela fé» comunica com maior clareza a condição durativa/resultante indicada por συγκεκερασμένους, sem alterar o referente plural nem resolver a dificuldade textual por via doutrinária.
