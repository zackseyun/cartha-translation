id: HEB.4.16
reference: Hebrews 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: pt
  text: Portanto, aproximemo-nos com ousadia[a] do trono da graça, a fim de recebermos misericórdia e encontrarmos graça para auxílio oportuno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: com confiança. O termo grego pode expressar tanto confiança quanto ousadia ou franqueza ao falar e ao se aproximar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: para auxílio no momento da necessidade. Mais literalmente, a expressão grega aponta para um auxílio que vem no momento certo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: aproximemo-nos
  rationale: O presente do subjuntivo tem força exortativa. “Aproximemo-nos” é natural em português atual e expressa o movimento de acesso a Deus sem recorrer a uma formulação arcaica.
- source_word: οὖν
  choice: Portanto
  rationale: Indica a conclusão decorrente do argumento anterior sobre Jesus como sumo sacerdote e preserva claramente essa ligação lógica.
- source_word: μετὰ παρρησίας
  choice: com ousadia
  rationale: παρρησία pode indicar franqueza, confiança ou ousadia. “Com ousadia” preserva a força da liberdade de acesso, sem implicar presunção; a alternativa “com confiança” é registrada em nota.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: do trono da graça
  rationale: Mantém a construção genitiva e a metáfora do original sem definir além do texto a relação exata entre o trono e a graça.
- source_word: ἵνα
  choice: a fim de
  rationale: Introduz a finalidade da aproximação e soa natural e dignificado neste contexto.
- source_word: λάβωμεν ἔλεος
  choice: recebermos misericórdia
  rationale: Traduz diretamente λαμβάνω e ἔλεος em linguagem corrente, preservando a distinção verbal em relação à oração seguinte.
- source_word: χάριν εὕρωμεν
  choice: encontrarmos graça
  rationale: Conserva tanto o verbo “encontrar” quanto o termo teologicamente significativo “graça”, além da ligação lexical com “trono da graça”.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: para auxílio oportuno
  rationale: εὔκαιρος qualifica o auxílio como apropriado ou chegado no momento certo. A formulação é concisa e próxima do grego, sem deslocar silenciosamente a ênfase para a condição de necessidade da pessoa.
theological_decisions:
- issue: Nuance de παρρησία ao aproximar-se de Deus
  choice: com ousadia
  alternative: com confiança
  rationale: A expressão comunica acesso livre e sem reservas a Deus no contexto do sacerdócio de Jesus. “Ousadia” preserva a força do termo, enquanto a nota mantém a nuance legítima de confiança.
- issue: Tradução de χάρις na segunda oração
  choice: graça
  alternative: favor
  rationale: Embora χάρις possa significar “favor”, “graça” preserva a textura teológica da passagem e a repetição intencional do termo já presente em “trono da graça”.
- issue: Sentido temporal de εὔκαιρος
  choice: auxílio oportuno
  alternative: auxílio no momento da necessidade
  rationale: O grego destaca diretamente que o auxílio é oportuno, isto é, vem na ocasião certa. A tradução alternativa tradicional é legítima, mas interpreta essa ocasião como o momento específico da necessidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e dignificado. A colocação “com ousadia” antes de “do trono da graça” favorece a fluidez sem alterar as relações sintáticas. Os dois marcadores de nota foram posicionados junto às expressões que explicam.
