source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: pt
  text: 'Pois nós, os que cremos, entramos no descanso, assim como ele disse: “Como jurei na minha ira: ‘Jamais entrarão no meu descanso’”[a], embora suas obras já estivessem concluídas desde a fundação do mundo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “Se eles entrarem no meu descanso”. Trata-se de uma fórmula de juramento com o sentido de “Certamente não entrarão no meu descanso” ou “Jamais entrarão no meu descanso”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “embora suas obras já tivessem sido realizadas desde a fundação do mundo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: entramos
  rationale: O presente do indicativo expressa a entrada dos que creem no descanso de Deus sem restringi-la apenas ao futuro; o presente simples é natural em português e preserva a tensão temporal do contexto.
- source_word: κατάπαυσιν
  choice: no descanso
  rationale: No contexto, o substantivo designa o descanso específico de Deus já em discussão; “descanso” é claro, corrente e preserva a imagem bíblica.
- source_word: οἱ πιστεύσαντες
  choice: nós, os que cremos
  rationale: A construção identifica o sujeito implícito da primeira pessoa do plural. Embora o particípio seja aoristo, aqui caracteriza o grupo pela fé; esta formulação é natural em português e mantém a inclusão do autor.
- source_word: καθὼς εἴρηκεν
  choice: assim como ele disse
  rationale: A expressão introduz a citação como fundamento da afirmação. Em português, o pretérito perfeito é idiomático nesse uso e não elimina a vigência contínua da declaração.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Assim jurei na minha ira
  rationale: “Ira” conserva o tom solene e judicial de ὀργή. “Assim” introduz naturalmente, em português, o conteúdo e a consequência do juramento.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Jamais entrarão no meu descanso
  rationale: A construção com εἰ reproduz uma fórmula semítica de juramento que, no contexto, comunica uma negação enfática. A tradução verte seu sentido idiomático, enquanto a nota registra a forma literal.
- source_word: καίτοι
  choice: embora
  rationale: A conjunção tem valor concessivo e liga o juramento à afirmação de que as obras de Deus já estavam concluídas.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: suas obras estivessem concluídas
  rationale: O genitivo absoluto indica que as obras de Deus já haviam sido realizadas ou completadas. “Suas” explicita o referente contextual sem acrescentar uma nova ideia.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: desde a fundação do mundo
  rationale: A expressão designa a criação ou estabelecimento do mundo. “Desde a fundação do mundo” é transparente, digna e preserva o idioma tradicional.
theological_decisions:
- issue: Sentido da fórmula de juramento de Salmo 95
  choice: 'Traduzir a fórmula como negação enfática: “Jamais entrarão no meu descanso”.'
  alternative: 'Manter a forma superficial: “Se entrarão no meu descanso”.'
  rationale: No grego da citação, εἰ com o futuro reflete uma fórmula semítica de juramento cujo sentido contextual é exclusão certa. A nota preserva a forma literal e torna visível a particularidade do original.
- issue: Aspecto temporal da entrada dos que creem no descanso
  choice: Usar o presente “entramos”.
  alternative: “estamos entrando” ou “entraremos”.
  rationale: O presente grego permite uma realidade atual sem negar a consumação futura desenvolvida no contexto. A tradução evita reduzir a afirmação a um sentido exclusivamente futuro.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e acessível; conserva a linguagem solene da citação e evita formulações arcaicas. As notas são colocadas exatamente junto aos trechos a que se referem.
