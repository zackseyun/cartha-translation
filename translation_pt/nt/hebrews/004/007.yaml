  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: pt
  text: 'De novo, ele determina certo dia, “Hoje”, ao dizer por meio de Davi, muito tempo depois, como já foi dito:


    “Hoje, se ouvirem a sua voz,


    não endureçam os corações de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: De novo
  rationale: Retoma o argumento e indica que Deus volta a estabelecer um dia; a expressão é clara e natural em português.
- source_word: τινὰ ἡμέραν
  choice: certo dia
  rationale: Preserva a ideia de um dia específico, embora não inicialmente identificado, evitando a vagueza de “algum dia”.
- source_word: ὁρίζει
  choice: determina
  rationale: Expressa o ato autorizado de fixar ou designar esse dia no argumento do autor.
- source_word: Σήμερον
  choice: Hoje
  rationale: Mantém o termo que identifica o dia e sua força retórica na citação do Salmo 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: ao dizer ... por meio de Davi
  rationale: Comunica naturalmente que a fala divina é mediada por Davi, sem definir além do texto a questão da autoria do salmo.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: muito tempo depois
  rationale: Transmite com naturalidade o longo intervalo desde a geração do deserto.
- source_word: καθὼς προείρηται
  choice: como já foi dito
  rationale: Preserva a referência a uma declaração anterior que continua relevante.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: se ouvirem a sua voz
  rationale: Mantém a condição e a imagem bíblica de ouvir a voz, sem explicitar como “obedecer” aquilo que permanece implícito.
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: não endureçam o coração de vocês
  rationale: Reproduz a advertência contra a obstinação em linguagem portuguesa corrente; o singular coletivo “coração” soa natural com “de vocês” e conserva o sentido antropológico bíblico.
theological_decisions:
- issue: Força de “Hoje” no argumento sobre o descanso de Deus
  choice: Manter “Hoje” como o dia novamente determinado por Deus e como oportunidade presente de responder à sua voz.
  alternative: Restringi-lo apenas ao dia histórico do salmista ou defini-lo exclusivamente como um dia escatológico.
  rationale: O texto vincula a palavra do salmo a um momento muito posterior à geração do deserto, mas não sistematiza a natureza temporal desse “Hoje”; a tradução conserva essa tensão.
- issue: Sentido de ἐν Δαυίδ
  choice: por meio de Davi
  alternative: “em Davi”, entendido como “no salmo davídico”.
  rationale: A formulação escolhida é idiomática e apresenta Davi como meio da fala citada, enquanto a nota registra a leitura mais formal e sua possível referência literária.
- issue: Sujeito de ὁρίζει
  choice: ele determina
  alternative: “Deus determina”.
  rationale: O grego mantém o sujeito implícito e recuperável do contexto. O pronome evita inserir explicitamente um nome que não aparece neste versículo, embora o referente contextual seja Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” na citação para representar claramente o plural grego. A disposição em linhas destaca a citação poética sem alterar seu conteúdo.
