  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: pt
  text: Temos essa esperança como uma âncora para a alma, segura e firme, que entra no lugar interior, além da cortina,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no lugar interior, dentro do véu” ou “atrás do véu”.'
    reason: Alternativas lexicais e espaciais para τοῦ καταπετάσματος; “véu” preserva a formulação tradicional.
lexical_decisions:
- source_word: ἣν
  choice: Essa esperança
  rationale: O pronome relativo feminino retoma explicitamente ἐλπίς, “esperança”, no versículo anterior. Repetir o referente em português torna a ligação clara e natural.
- source_word: ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς
  choice: é como uma âncora para a alma
  rationale: A formulação preserva a comparação e o valor metafórico, enquanto “para a alma” expressa em português natural a relação do genitivo τῆς ψυχῆς.
- source_word: ἀσφαλῆ τε καὶ βεβαίαν
  choice: segura e firme
  rationale: 'Os dois adjetivos permanecem distintos: ἀσφαλής salienta segurança, e βέβαιος, estabilidade e confiabilidade.'
- source_word: εἰσερχομένην
  choice: que entra
  rationale: A oração relativa retém a referência do particípio à âncora e soa mais natural em português do que uma sequência participial.
- source_word: εἰς τὸ ἐσώτερον τοῦ καταπετάσματος
  choice: no lugar interior, além da cortina
  rationale: “Lugar interior” preserva o adjetivo substantivado sem especificar além do texto; “além da cortina” comunica a relação espacial implícita no genitivo e mantém a imagem do santuário.
theological_decisions:
- issue: Imagem cultual do santuário celestial
  choice: além da cortina
  alternative: no interior do véu; atrás do véu
  rationale: A tradução conserva a barreira do santuário e o movimento para o espaço interior sem identificar aqui, de modo mais específico do que o grego, o compartimento ou seu referente celestial.
- issue: Referente de ἣν
  choice: Essa esperança
  alternative: a qual
  rationale: A explicitação identifica corretamente o antecedente no versículo anterior sem transformar a esperança em conceito diferente ou enfraquecer a continuidade do argumento.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Cortina” evita o tom arcaizante de “véu” no texto principal, enquanto a nota preserva a expressão tradicional.
