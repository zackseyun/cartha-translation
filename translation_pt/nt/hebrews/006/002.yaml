  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: pt
  text: instrução sobre lavagens[a], imposição de mãos, ressurreição dos mortos e juízo eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução sobre batismos”. O plural grego pode designar lavagens rituais em sentido mais amplo, não necessariamente batismos cristãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: purificações
  rationale: O plural pode designar lavagens ou ritos de purificação em sentido amplo. “Purificações” é natural em português e evita sugerir, sem necessidade, vários batismos cristãos; a alternativa literal possível é registrada em nota.
- source_word: διδαχὴν
  choice: instrução
  rationale: O acusativo dá continuidade à lista de fundamentos do versículo anterior. “Instrução” expressa com clareza o ensino acerca dos itens seguintes.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: imposição de mãos
  rationale: Expressão corrente e digna em português para o ato designado pela construção grega.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: ressurreição dos mortos
  rationale: Forma idiomática consagrada que preserva o sentido coletivo de νεκρῶν.
- source_word: κρίματος αἰωνίου
  choice: juízo eterno
  rationale: Mantém a referência ao juízo final sem restringir κρίμα a condenação.
- source_word: τε ... τε καὶ
  choice: enumeração com vírgulas e “e” final
  rationale: A coordenação simples reproduz naturalmente em português a estrutura da lista grega.
theological_decisions:
- issue: Sentido de βαπτισμῶν na lista de ensinos fundamentais
  choice: “purificações”
  alternative: “batismos”
  rationale: O plural e o uso lexical permitem uma referência mais ampla a lavagens rituais. A escolha evita impor uma leitura sacramental específica, enquanto a nota preserva a alternativa legítima.
- issue: Alcance de κρίματος αἰωνίου
  choice: “juízo eterno”
  alternative: “condenação eterna”
  rationale: O grego diz “juízo”, não especificamente “condenação”; a tradução não restringe o resultado além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o caráter nominal da lista iniciada no versículo anterior e conserva a ambiguidade lexical de βαπτισμῶν por meio de nota.
