  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: pt
  text: onde Jesus entrou como precursor em nosso favor[a], tendo se tornado sumo sacerdote para sempre, segundo a ordem de Melquisedeque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por nós”. A expressão grega pode indicar uma ação realizada em benefício de outros; aqui, destaca a entrada representativa de Jesus.
    reason: lexical_alternative
  - marker: b
    text: Ou “na ordem de Melquisedeque”; a expressão retoma o Salmo 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: onde
  rationale: Retoma o lugar interior, além do véu, mencionado no versículo anterior e preserva naturalmente o sentido locativo.
- source_word: πρόδρομος
  choice: precursor
  rationale: Designa aquele que vai adiante, preservando a imagem de Jesus entrando primeiro e abrindo o caminho para outros.
- source_word: ὑπὲρ ἡμῶν
  choice: em nosso favor
  rationale: Expressa benefício e representação sem impor o sentido mais restrito de substituição, que não é exigido neste contexto.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O pretérito perfeito simples traduz naturalmente o aoristo grego; o contexto comunica a importância contínua dessa entrada.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: segundo a ordem de Melquisedeque
  rationale: Preserva a ideia de correspondência ou ordenação segundo um padrão e mantém a ressonância do Salmo 110:4.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: Equivalente português tradicional, claro e preciso para o ofício cultual central ao argumento de Hebreus.
- source_word: γενόμενος
  choice: tendo se tornado
  rationale: Mantém a força verbal do particípio e apresenta o status sacerdotal assumido por Jesus, sem confundi-lo com uma afirmação sobre sua origem ou essência.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão idiomática e clara que comunica duração permanente.
theological_decisions:
- issue: Relação de γενόμενος com a cristologia
  choice: tendo se tornado sumo sacerdote
  alternative: tendo sido constituído sumo sacerdote
  rationale: A formulação conserva o particípio como declaração da entrada de Jesus no ofício sacerdotal, sem sugerir que ele passou a existir ou sofreu mudança de natureza.
- issue: Sentido de ὑπὲρ ἡμῶν
  choice: em nosso favor
  alternative: por nós
  rationale: Preserva os sentidos de benefício e representação no contexto da entrada de Jesus à frente dos fiéis, sem reduzir a expressão a uma fórmula expiatória mais específica.
- issue: Relação de πρόδρομος com a entrada dos fiéis
  choice: precursor
  alternative: aquele que foi adiante
  rationale: Mantém a metáfora de alguém que entra primeiro, sem explicitar além do texto todos os seus efeitos teológicos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o grego sem sacrificar a naturalidade; os marcadores foram colocados junto às expressões que explicam.
