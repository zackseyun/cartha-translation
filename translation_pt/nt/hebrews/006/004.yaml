id: HEB.6.4
reference: Hebrews 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: pt
  text: Pois é impossível, no caso daqueles que uma vez foram iluminados[a], provaram o dom celestial[b] e se tornaram participantes do Espírito Santo[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iluminados” pode referir-se, em sentido amplo, ao recebimento de luz ou instrução espiritual; alguns entendem o termo mais especificamente como conversão ou iluminação batismal.
    reason: alternative_reading
  - marker: b
    text: Ou “experimentaram o dom celestial”. O verbo significa literalmente “provar” e pode indicar uma experiência real, não apenas uma pequena amostra.
    reason: lexical_alternative
  - marker: c
    text: Ou “os que compartilharam do Espírito Santo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: é impossível
  rationale: O adjetivo predicativo abre a oração com ênfase; o português requer naturalmente o verbo copulativo.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior sem definir além do necessário a relação lógica.
- source_word: ἅπαξ
  choice: uma vez
  rationale: Indica uma ocorrência passada definida, sem acrescentar a força potencialmente excessiva de “de uma vez por todas”.
- source_word: φωτισθέντας
  choice: foram iluminados
  rationale: Preserva a metáfora espiritual e cognitiva do passivo aoristo sem identificá-la especificamente com conversão ou batismo.
- source_word: γευσαμένους
  choice: provaram
  rationale: Conserva a metáfora concreta de experimentar pelo paladar; em português, “provar” também pode denotar experiência real, sem decidir sua extensão.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: o dom celestial
  rationale: Tradução concisa e natural que não especifica a identidade do dom.
- source_word: τε ... καὶ
  choice: e
  rationale: A coordenação cumulativa é expressa naturalmente em português, sem tornar pesada a sequência de particípios.
- source_word: μετόχους
  choice: participantes
  rationale: Expressa participação ou compartilhamento de forma atual e clara, preservando a força do termo sem empregar o menos corrente “coparticipantes”.
- source_word: γενηθέντας
  choice: se tornaram
  rationale: Representa diretamente a entrada em um estado expressa pelo particípio aoristo de γίνομαι.
- source_word: πνεύματος ἁγίου
  choice: do Espírito Santo
  rationale: O genitivo depende de “participantes”; a forma consagrada em português identifica o referente divino pessoal.
theological_decisions:
- issue: Se φωτισθέντας identifica especificamente conversão ou iluminação batismal
  choice: foram iluminados
  alternative: foram convertidos; receberam a iluminação batismal
  rationale: O grego preserva a metáfora de iluminação e não define expressamente seu referente; a tradução evita impor uma leitura denominacional.
- issue: Se γευσαμένους indica mera amostra ou experiência plena
  choice: provaram
  alternative: experimentaram; apenas provaram superficialmente
  rationale: O verbo pode indicar experiência real, mas não determina por si só sua extensão. A redação mantém aberta a tensão interpretativa do contexto.
- issue: Se μετόχους γενηθέντας πνεύματος ἁγίου implica necessariamente habitação salvífica plena ou participação mais ampla
  choice: se tornaram participantes do Espírito Santo
  alternative: compartilharam do Espírito Santo; tornaram-se coparticipantes do Espírito Santo
  rationale: A frase é traduzida com força, mas sem resolver no nível lexical debates sistemáticos sobre apostasia e perseverança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção permanece incompleta por seguir a sintaxe de Hebreus 6:4, cuja declaração continua nos versículos seguintes. Os marcadores foram colocados imediatamente após as expressões a que se referem.
