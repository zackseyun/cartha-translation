  to: Mas, se ela produz espinhos e cardos, é inútil[a] e está próxima da maldição; seu fim é a queima.
  rationale: A revisão substitui uma perífrase botânica artificial por “cardos”, termo agrícola natural e amplamente compreensível, e ajusta a expressão de κατάρας ἐγγύς para conservar a forma nominal do original. Mantêm-se o sujeito feminino implícito, retomado pelo pronome “ela” a partir da terra de 6:7, a avaliação “inútil” e a imagem não explicitada da queima.
