  - severity: low
    issue: “Perto de ser amaldiçoada” para κατάρας ἐγγύς
    rationale: É uma interpretação possível e natural, mas introduz uma construção verbal passiva onde o grego emprega o substantivo “maldição”. “Próxima da maldição” é mais próxima da formulação grega e permanece idiomática.
