source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: pt
  text: Mas, se ela produz espinhos e cardos, é inútil[a] e está próxima da maldição; seu fim é a queima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rejeitada”.
    reason: Alternativa lexical para ἀδόκιμος, que pode indicar aquilo que não foi aprovado ou foi rejeitado.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: produz
  rationale: O particípio presente feminino retoma a terra do versículo anterior. “Produz” é natural na imagem agrícola e expressa o que a terra faz brotar.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a terra produtiva de Hebreus 6:7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: espinhos e ervas daninhas espinhosas
  rationale: Distingue os dois termos de vegetação nociva sem recorrer a nomes botânicos incertos ou pouco conhecidos.
- source_word: ἀδόκιμος
  choice: inútil
  rationale: No contexto agrícola, indica aquilo que não passa na avaliação de utilidade. A alternativa “rejeitada” é preservada em nota por sua possível força passiva.
- source_word: κατάρας ἐγγύς
  choice: perto de ser amaldiçoada
  rationale: Formulação portuguesa natural que mantém a proximidade, e não a consumação, da maldição.
- source_word: ἧς τὸ τέλος
  choice: seu fim
  rationale: O pronome relativo feminino retoma a terra implícita, e “fim” conserva tanto a ideia de desfecho quanto a de destino.
- source_word: εἰς καῦσιν
  choice: é ser queimada
  rationale: Preserva a imagem agrícola da queima e evita explicá-la diretamente como uma doutrina específica de juízo final.
theological_decisions:
- issue: Se o sujeito implícito deve ser explicitado como “terra”
  choice: Manter o sujeito implícito em português
  alternative: Mas a terra que produz...
  rationale: O feminino de “amaldiçoada” e “queimada”, junto ao contexto do versículo anterior, mantém clara a referência à terra sem acrescentar um substantivo ausente neste versículo.
- issue: Como traduzir ἀδόκιμος
  choice: “inútil” no texto, com “rejeitada” em nota
  alternative: rejeitada
  rationale: “Inútil” se ajusta à avaliação agrícola imediata; a nota conserva a possível nuance de reprovação ou rejeição sem impor sua força teológica ao texto principal.
- issue: Se εἰς καῦσιν deve ser explicitado como condenação final
  choice: Conservar a imagem como “ser queimada”
  alternative: ser condenada pelo fogo
  rationale: O grego apresenta a queima na metáfora agrícola, sem identificar explicitamente neste versículo todo o seu referente doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a continuidade com a terra mencionada no versículo anterior e preserva a advertência sem explicitação doutrinária além do grego.
