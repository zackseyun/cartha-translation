id: HEB.6.16
reference: Hebrews 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: pt
  text: Pois as pessoas juram por alguém maior do que elas, e o juramento, como confirmação, põe fim a toda controvérsia entre elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e, para elas, o juramento é o fim de toda contestação, servindo de confirmação».'
    reason: A ordem e a concisão do grego permitem conservar mais literalmente «fim» e entender ἀντιλογία também como «contestação» ou «disputa».
lexical_decisions:
- source_word: ἄνθρωποι
  choice: as pessoas
  rationale: O plural é genérico e se refere aos seres humanos em geral, não especificamente a homens; «as pessoas» é natural e mantém o contraste contextual com Deus.
- source_word: κατὰ τοῦ μείζονος
  choice: por alguém maior do que elas
  rationale: Em fórmulas de juramento, κατά com genitivo indica aquele por quem se jura; a formulação preserva a comparação sem identificar um referente não expresso.
- source_word: ὀμνύουσιν
  choice: juram
  rationale: Tradução direta e idiomática, sem repetir «juramento», que aparece depois na frase.
- source_word: πάσης ... ἀντιλογίας
  choice: toda controvérsia
  rationale: Neste contexto, ἀντιλογία designa contestação, controvérsia ou disputa que um juramento encerra, e não apenas contradição lógica.
- source_word: πέρας
  choice: põe fim
  rationale: Expressa em português natural a ideia de término contida em πέρας, preservando a função do juramento no enunciado.
- source_word: εἰς βεβαίωσιν
  choice: como confirmação
  rationale: Reproduz o valor de finalidade ou resultado de εἰς com acusativo e o sentido de validação de βεβαίωσις.
- source_word: ὁ ὅρκος
  choice: o juramento
  rationale: O artigo definido funciona naturalmente em português numa afirmação geral sobre a função do juramento.
theological_decisions:
- issue: Referência genérica à humanidade numa máxima
  choice: as pessoas
  alternative: os homens
  rationale: O grego ἄνθρωποι abrange os seres humanos em geral; «as pessoas» comunica essa abrangência sem sugerir uma limitação ao sexo masculino.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com vocabulário amplamente compreensível no espaço lusófono. A construção verbal «põe fim» evita uma formulação nominal rígida, enquanto a nota registra a estrutura mais literal e a amplitude lexical.
