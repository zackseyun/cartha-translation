  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: pt
  text: e provaram a boa palavra de Deus e os poderes da era vindoura[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da era que há de vir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: boa
  rationale: Qualifica ῥῆμα com o sentido de algo bom, benéfico ou excelente. “Boa palavra” é natural e preserva a força avaliativa sem ampliá-la.
- source_word: γευσαμένους
  choice: provaram
  rationale: Preserva a metáfora de γεύομαι e sua ligação sintática com a série de particípios acusativos do contexto. Não define se a experiência foi superficial ou plena.
- source_word: θεοῦ ῥῆμα
  choice: a palavra de Deus
  rationale: Expressa naturalmente a palavra ou declaração procedente de Deus, sem restringir ῥῆμα a uma formulação oral específica.
- source_word: δυνάμεις
  choice: os poderes
  rationale: Mantém a amplitude do plural grego, que pode se referir a poderes ou a manifestações poderosas, inclusive milagres, sem limitar antecipadamente o referente.
- source_word: τε
  choice: e
  rationale: Liga de modo natural os poderes ao objeto anterior do verbo, conforme a função conectiva de τε.
- source_word: μέλλοντος αἰῶνος
  choice: da era vindoura
  rationale: Traduz a orientação futura e escatológica da expressão de modo conciso e corrente em português.
theological_decisions:
- issue: Sentido de γευσαμένους no contexto da passagem de advertência
  choice: Manter a metáfora como “provaram”, sem explicar o grau da experiência.
  alternative: “experimentaram” ou “apenas provaram”
  rationale: Hebreus 6:4–6 é teologicamente debatido. A tradução não deve intensificar a participação nem reduzi-la a um contato superficial.
- issue: Força de δυνάμεις no contexto escatológico
  choice: Traduzir por “poderes”.
  alternative: “milagres” ou “obras poderosas”
  rationale: O termo pode designar manifestações milagrosas relacionadas à irrupção da era futura, mas também admite um sentido mais amplo. “Poderes” preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a continuidade sintática com Hebreus 6:4 e termina com vírgula por integrar uma frase que prossegue no versículo seguinte.
