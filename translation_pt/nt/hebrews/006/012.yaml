id: HEB.6.12
reference: Hebrews 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: pt
  text: para que não se tornem indolentes, mas imitadores daqueles que, por meio da fé[a] e da paciência, herdam as promessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da fidelidade e da paciência”. A palavra grega traduzida como “fé” também pode, em certos contextos, ter o sentido de “fidelidade” ou “confiança”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Preserva a relação de finalidade ou resultado com a exortação anterior, em português natural.
- source_word: νωθροὶ
  choice: indolentes
  rationale: Expressa lentidão e falta de empenho sem o tom excessivamente moralista de “preguiçosos” nem uma formulação arcaica.
- source_word: γένησθε
  choice: se tornem
  rationale: Conserva o valor ingressivo de γίνομαι, advertindo contra entrar nesse estado.
- source_word: μιμηταὶ
  choice: imitadores
  rationale: 'Mantém o sentido direto do substantivo: pessoas que tomam outras como modelo.'
- source_word: διὰ πίστεως
  choice: por meio da fé
  rationale: Traduz διά como meio e preserva a amplitude de πίστις, que aqui pode envolver confiança e, possivelmente, fidelidade.
- source_word: μακροθυμίας
  choice: paciência
  rationale: Comunica a disposição de esperar e perseverar por longo tempo em linguagem corrente, sem recorrer ao mais formal “longanimidade”.
- source_word: κληρονομούντων
  choice: herdam
  rationale: O presente caracteriza essas pessoas como herdeiras das promessas; o presente simples é claro e natural.
- source_word: τὰς ἐπαγγελίας
  choice: as promessas
  rationale: Preserva o plural explícito e sua ligação com o tema recorrente das promessas de Deus em Hebreus.
theological_decisions:
- issue: Sentido de πίστις neste contexto exortativo
  choice: fé
  alternative: fidelidade ou confiança
  rationale: “Fé” mantém a formulação teológica ampla e tradicional sem limitar o termo apenas à confiança subjetiva ou à constância fiel; a possibilidade de “fidelidade” é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Indolentes” preserva a ideia de lentidão espiritual e falta de empenho; a ordem e o contraste do grego foram mantidos.
