  to: Pois Deus não é injusto a ponto de se esquecer da obra de vocês e do amor que demonstraram em favor de seu nome[a], tendo servido aos santos[b] e continuando a servi-los[c].
  rationale: A revisão corrige a expressão do contraste aspectual entre o aoristo «tendo servido» e o presente «continuando a servir». Também substitui «por seu nome» por «em favor de seu nome», formulação portuguesa mais transparente para a relação de devoção/honra expressa por εἰς τὸ ὄνομα αὐτοῦ, sem eliminar o termo teologicamente relevante «nome».
