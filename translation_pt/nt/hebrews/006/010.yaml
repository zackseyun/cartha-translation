id: HEB.6.10
reference: Hebrews 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: pt
  text: Pois Deus não é injusto a ponto de se esquecer da obra de vocês e do amor que demonstraram em favor de seu nome[a], tendo servido aos santos[b] e continuando a servi-los[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de seu nome” ou “em favor de seu nome”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, aos demais fiéis; aqui, “santos” se refere ao povo santo de Deus, não a uma classe posteriormente canonizada.
    reason: cultural_note
  - marker: c
    text: 'Ou: “por terem servido aos santos e por continuarem a servi-los”. Essa forma explicita mais diretamente o serviço passado e sua continuidade no presente.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: ἄδικος
  choice: injusto
  rationale: Expressa de modo natural que Deus não agiria contra a justiça ao deixar de levar em conta a obra e o amor dos destinatários.
- source_word: ἐπιλαθέσθαι
  choice: se esquecer
  rationale: Preserva o sentido lexical direto de esquecer, com a implicação contextual de não deixar de reconhecer e considerar o que fizeram.
- source_word: ἔργου
  choice: obra
  rationale: Mantém o singular coletivo do grego e designa a atuação concreta dos destinatários.
- source_word: ἀγάπης
  choice: amor
  rationale: É o equivalente direto e corrente de ἀγάπη; aqui, trata-se de amor manifestado por meio do serviço.
- source_word: ἐνεδείξασθε
  choice: demonstraram
  rationale: Comunica claramente a ideia de tornar o amor evidente por ações concretas.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: por seu nome
  rationale: Conserva a referência ao nome de Deus e permite os sentidos de devoção, honra e ação em favor dele, sem os reduzir a uma única explicação.
- source_word: διακονήσαντες
  choice: servindo
  rationale: O particípio aoristo aponta para o serviço já realizado; no contexto português, a sequência com o gerúndio seguinte continua natural, enquanto a nota explicita a distinção temporal.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Preserva o termo neotestamentário para o povo santo de Deus, sem substituí-lo por uma paráfrase interpretativa.
- source_word: διακονοῦντες
  choice: continuando a servi-los
  rationale: Torna explícito o aspecto contínuo do particípio presente e retoma com clareza os santos como objeto do serviço.
theological_decisions:
- issue: Se o versículo ensina mérito diante de Deus ou o justo reconhecimento divino das ações dos fiéis
  choice: A tradução afirma que Deus, por ser justo, não esquece a obra e o amor demonstrados, sem dizer que essas ações conquistam a salvação.
  alternative: Entender que Deus deve uma recompensa salvífica como pagamento meritório pelas obras humanas.
  rationale: O grego relaciona a justiça de Deus ao fato de ele não esquecer a obra e o amor dos destinatários, mas não formula uma doutrina de mérito salvífico.
- issue: Sentido de “santos”
  choice: Refere-se aos membros do povo santo de Deus, isto é, aos demais fiéis.
  alternative: Entender o termo como uma classe posterior de pessoas formalmente canonizadas.
  rationale: No uso neotestamentário, o plural οἱ ἅγιοι designa normalmente os fiéis como comunidade consagrada a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e mantém “santos” no texto, acompanhado de nota esclarecedora. A construção final prioriza naturalidade, enquanto a nota preserva de modo explícito o contraste aspectual entre os dois particípios gregos.
