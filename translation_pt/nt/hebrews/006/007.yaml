  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: pt
  text: Pois a terra que bebe a chuva que cai muitas vezes sobre ela e produz vegetação[a] útil para aqueles em benefício de quem também é cultivada[b] recebe bênção de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plantas”, “erva” ou “colheita”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por aqueles que a cultivam”; porém, “em benefício de quem” reflete melhor διά com o acusativo neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: terra
  rationale: No contexto agrícola, “terra” designa naturalmente o terreno cultivado, sem a amplitude cósmica que o termo também pode ter em outros contextos.
- source_word: πιοῦσα
  choice: que bebe
  rationale: Preserva a imagem vívida e personificada da terra que recebe a chuva, em vez de a achatar com “absorve”.
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: a chuva que cai muitas vezes sobre ela
  rationale: Expressa de modo natural a construção participial, mantendo tanto a repetição indicada por πολλάκις como a ideia de a chuva vir sobre a terra.
- source_word: τίκτουσα
  choice: produz
  rationale: É uma formulação atual e natural para a terra que faz surgir plantas, conservando o sentido produtivo do verbo.
- source_word: βοτάνην
  choice: vegetação
  rationale: Mantém a referência ampla ao crescimento vegetal, sem restringi-la indevidamente a uma cultura agrícola específica.
- source_word: εὔθετον
  choice: útil
  rationale: Comunica com clareza a adequação prática da vegetação às pessoas beneficiadas.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: para aqueles em benefício de quem também é cultivada
  rationale: Reflete o valor mais natural de διά com acusativo, indicando benefício ou finalidade, e conserva καί com “também”.
- source_word: γεωργεῖται
  choice: é cultivada
  rationale: O passivo descreve de modo amplo e idiomático o trabalho agrícola realizado na terra.
- source_word: μεταλαμβάνει
  choice: recebe
  rationale: No contexto, comunica naturalmente que a terra passa a desfrutar da bênção procedente de Deus.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: bênção de Deus
  rationale: Mantém a expressão proverbial e não força um artigo indefinido ausente do grego.
theological_decisions:
- issue: Metáfora agrícola no contexto da advertência
  choice: Manter a metáfora diretamente, sem acrescentar uma conclusão doutrinária sobre perseverança ou apostasia.
  alternative: Interpretar a terra frutífera como um grupo teológico específico ou explicitar nela a aprovação divina dos crentes frutíferos.
  rationale: O versículo apresenta o lado positivo da analogia agrícola, mas não identifica explicitamente a terra com uma categoria doutrinária particular; a tradução deve preservar essa tensão no contexto mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a personificação da terra e a progressão da imagem agrícola sem soar excessivamente literal.
