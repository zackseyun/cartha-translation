  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: pt
  text: para que, por meio de duas coisas imutáveis[a], nas quais é impossível que Deus minta, nós, que fugimos em busca de refúgio[b] para nos apegarmos à esperança que nos é proposta, tenhamos forte encorajamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto, as duas coisas são a promessa de Deus e o juramento com que ele a confirmou (versículos 13–17).
    reason: contextual_clarification
  - marker: b
    text: A expressão conserva a imagem de alguém que foge para encontrar segurança e pode evocar as cidades de refúgio do Antigo Testamento.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado decorrente da promessa e do juramento mencionados no contexto anterior.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: por meio de duas coisas imutáveis
  rationale: Mantém a amplitude de πράγματα e expressa ἀμετάθετος como aquilo que não pode ser mudado; no contexto, as duas coisas são a promessa e o juramento de Deus.
- source_word: ἐν οἷς
  choice: nas quais
  rationale: Preserva a ligação gramatical com as duas coisas mencionadas, sem explicitar além do texto de que modo elas se relacionam com a impossibilidade de Deus mentir.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: é impossível que Deus minta
  rationale: Reproduz com naturalidade a construção impessoal do grego e mantém a afirmação solene sobre a veracidade divina.
- source_word: ἰσχυρὰν παράκλησιν
  choice: forte encorajamento
  rationale: παράκλησις pode indicar encorajamento, consolo ou exortação; aqui, a segurança dada pela promessa e pelo juramento favorece 'encorajamento', sem excluir a dimensão de consolo.
- source_word: ἔχωμεν
  choice: tenhamos
  rationale: O subjuntivo português corresponde naturalmente ao valor de finalidade ou resultado de ἵνα com o subjuntivo grego.
- source_word: οἱ καταφυγόντες
  choice: nós, que fugimos em busca de refúgio
  rationale: Conserva tanto o movimento de fuga quanto a procura de segurança presentes no particípio, em vez de reduzir a imagem a uma formulação abstrata.
- source_word: κρατῆσαι
  choice: agarrar firmemente
  rationale: Expressa a ideia de agarrar, apoderar-se ou manter com firmeza. A formulação conserva a vivacidade do verbo sem decidir rigidamente entre o ato inicial de agarrar e a continuidade de manter-se apegado.
- source_word: τῆς προκειμένης ἐλπίδος
  choice: a esperança que está diante de nós
  rationale: Preserva a imagem de uma esperança apresentada ou colocada adiante, disponível para ser agarrada.
theological_decisions:
- issue: Imagem de fuga, refúgio e esperança
  choice: 'Preservar a sequência concreta: fugir em busca de refúgio e agarrar firmemente a esperança.'
  alternative: nós, que buscamos refúgio, tenhamos forte encorajamento para nos apegar à esperança que nos foi proposta
  rationale: O grego combina uma imagem de fuga para um lugar seguro com a apropriação ativa da esperança. A tradução evita transformar essa tensão imagética em mera linguagem abstrata de segurança.
- issue: A impossibilidade de Deus mentir
  choice: é impossível que Deus minta
  alternative: Deus não pode mentir
  rationale: A escolha mantém a construção enfática do texto sem acrescentar uma explicação filosófica ou sistemática sobre a natureza divina.
- issue: Identidade das duas coisas imutáveis
  choice: Mantê-las no texto principal como 'duas coisas imutáveis' e identificá-las na nota como a promessa e o juramento no contexto.
  alternative: por meio da promessa e do juramento imutáveis
  rationale: O contexto aponta claramente para a promessa e o juramento, mas o versículo usa a expressão genérica 'duas coisas'; preservá-la no texto evita substituir a formulação do autor por uma explicação.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'coisas imutáveis' para conservar a generalidade do grego, 'forte encorajamento' em vez do mais arcaico 'poderosa consolação' e mantém vivas as imagens de fuga, refúgio e esperança colocada diante do leitor.
