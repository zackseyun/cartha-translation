id: HEB.6.17
reference: Hebrews 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: pt
  text: Por isso, Deus, querendo mostrar ainda mais claramente aos herdeiros da promessa o caráter imutável de seu propósito[a], garantiu isso com um juramento[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a imutabilidade de sua decisão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “interpôs-se por meio de um juramento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Por isso
  rationale: Retoma a argumentação anterior e expressa em português corrente a relação lógica do juramento de Deus com a promessa, evitando o pouco natural «no que».
- source_word: περισσότερον
  choice: ainda mais claramente
  rationale: O comparativo intensifica o ato de mostrar; esta formulação é natural em português e comunica que Deus quis tornar a certeza de seu propósito especialmente evidente.
- source_word: βουλόμενος
  choice: querendo
  rationale: Expressa a intenção deliberada de Deus sem acrescentar necessidade ou obrigação externa.
- source_word: ἐπιδεῖξαι
  choice: mostrar
  rationale: Transmite de modo direto e acessível o sentido de exibir ou demonstrar; combinado com «ainda mais claramente», preserva a força da expressão grega.
- source_word: κληρονόμοις τῆς ἐπαγγελίας
  choice: aos herdeiros da promessa
  rationale: Mantém a linguagem de herança e a relação genitiva do original, importante no contexto da promessa divina.
- source_word: τὸ ἀμετάθετον
  choice: o caráter imutável
  rationale: O adjetivo substantivado indica a qualidade daquilo que não pode ser alterado. A formulação evita o tecnicismo «imutabilidade» sem enfraquecer o sentido.
- source_word: τῆς βουλῆς αὐτοῦ
  choice: de seu propósito
  rationale: βουλή designa aqui a intenção deliberada e resoluta de Deus. «Propósito» é claro, digno e não sugere apenas uma opinião ou recomendação.
- source_word: ἐμεσίτευσεν
  choice: garantiu isso
  rationale: No contexto, o verbo descreve Deus oferecendo garantia mediante juramento. «Isso» retoma naturalmente o caráter imutável de seu propósito; a alternativa mais formal é registrada em nota.
- source_word: ὅρκῳ
  choice: com um juramento
  rationale: Traduz o dativo instrumental de maneira idiomática, indicando o meio pelo qual Deus deu a garantia.
theological_decisions:
- issue: A imutabilidade do propósito de Deus
  choice: o caráter imutável de seu propósito
  alternative: a imutabilidade de sua decisão
  rationale: Preserva a afirmação explícita de que o propósito divino não muda, sem importar categorias metafísicas posteriores nem empregar linguagem excessivamente técnica.
- issue: A função do juramento em ἐμεσίτευσεν ὅρκῳ
  choice: garantiu isso com um juramento
  alternative: interpôs-se com um juramento
  rationale: Comunica a função contextual do juramento como garantia adicional dada aos herdeiros, enquanto a nota conserva a imagem lexical mais formal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para colocar «Deus» antes do particípio e evitar ambiguidade sintática. «Caráter imutável» conserva a força teológica sem soar técnico; «garantiu isso» prioriza clareza contextual, com a tradução mais formal em nota.
