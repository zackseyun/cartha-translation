source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: pt
  text: Portanto, deixando para trás o ensino elementar a respeito do Messias[a], deixemo-nos conduzir à maturidade[b], sem lançar novamente o fundamento do arrependimento de obras mortas e da fé em Deus[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mensagem inicial do Messias” ou “o ensino básico a respeito do Messias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à perfeição” ou “à plenitude”. O grego tem sentido passivo: “deixemo-nos conduzir” ou “sejamos levados”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “da fé voltada para Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Portanto
  rationale: Conjunção inferencial natural em português, ligando a exortação ao contexto anterior.
- source_word: ἀφέντες
  choice: deixando para trás
  rationale: Preserva a forma participial e expressa avanço para além do ensino inicial, sem sugerir sua rejeição absoluta.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: o ensino elementar a respeito do Messias
  rationale: Em contexto, λόγος designa ensino ou mensagem, e τῆς ἀρχῆς aponta para a instrução inicial. A formulação portuguesa é clara sem eliminar a dificuldade da cadeia genitiva; uma alternativa mais literal consta em nota.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: O contexto favorece o sentido titular de Χριστός; “Messias” torna esse valor explícito.
- source_word: ἐπὶ τὴν τελειότητα
  choice: à maturidade
  rationale: No contraste com fundamentos elementares, τελειότης indica desenvolvimento pleno ou maturidade, sem exigir a ideia de impecabilidade absoluta.
- source_word: φερώμεθα
  choice: deixemo-nos conduzir
  rationale: Mantém de modo natural em português a voz passiva do presente subjuntivo, em vez de reduzi-la a um simples “prossigamos” ativo.
- source_word: μὴ πάλιν θεμέλιον καταβαλλόμενοι
  choice: sem lançar novamente o fundamento
  rationale: Preserva a metáfora de construção e a proibição de tornar a estabelecer os elementos básicos.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: do arrependimento de obras mortas
  rationale: “Arrependimento” é a expressão corrente e adequada para μετάνοια; “obras mortas” conserva a imagem e sua possível amplitude interpretativa.
- source_word: πίστεως ἐπὶ θεόν
  choice: da fé em Deus
  rationale: É a formulação portuguesa mais idiomática para πίστις com ἐπί, embora a preposição grega também permita realçar uma orientação “para Deus”.
theological_decisions:
- issue: Se deixar o ensino inicial significa rejeitá-lo ou avançar além dele
  choice: Avançar para além dele como foco presente, sem repudiá-lo
  alternative: Abandonar a mensagem a respeito do Messias
  rationale: A referência imediata a não lançar novamente o fundamento indica progressão a partir de uma base que permanece válida.
- issue: Sentido de τελειότης
  choice: maturidade
  alternative: perfeição ou plenitude
  rationale: O contraste é entre instrução fundamental e desenvolvimento mais pleno; “maturidade” comunica isso sem resolver a palavra como impecabilidade absoluta.
- issue: Voz de φερώμεθα
  choice: deixemo-nos conduzir
  alternative: prossigamos ou avancemos
  rationale: A tradução retém a voz passiva do grego e sua tensão quanto ao agente do avanço, sem identificar explicitamente quem conduz.
- issue: Relação expressa por πίστεως ἐπὶ θεόν
  choice: fé em Deus
  alternative: fé voltada para Deus
  rationale: “Fé em Deus” é idiomático e semanticamente adequado; a alternativa preserva mais visivelmente a nuance direcional de ἐπί.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção exortativa preserva a voz passiva grega; termos teológicos correntes são usados sem linguagem denominacional.
