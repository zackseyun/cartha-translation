id: HEB.6.11
reference: Hebrews 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: pt
  text: E desejamos que cada um de vocês demonstre a mesma dedicação, com vistas à plena certeza da esperança até o fim[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plena convicção da esperança”. O termo grego pode indicar plenitude de certeza, convicção ou segurança.
    reason: lexical_alternative
  - marker: b
    text: Ou “até a conclusão”. A expressão ressalta a perseverança até que se alcance o fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: desejamos
  rationale: Expressa um desejo pastoral intenso, sem a coloquialidade de “queremos” nem a carga emocional mais forte de “ansiamos”.
- source_word: δὲ
  choice: E
  rationale: Marca uma transição suave e mantém a continuidade com a afirmação anterior, sem introduzir um contraste forte.
- source_word: ἕκαστον ὑμῶν
  choice: cada um de vocês
  rationale: Preserva claramente a aplicação individual da exortação a todos os destinatários.
- source_word: τὴν αὐτὴν ... σπουδὴν
  choice: a mesma dedicação
  rationale: Retoma a diligência já demonstrada no amor e no serviço; “dedicação” comunica empenho sério e contínuo em português corrente.
- source_word: ἐνδείκνυσθαι
  choice: demonstre
  rationale: Comunica a manifestação concreta de uma qualidade, com naturalidade e dignidade.
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: para que tenham plena certeza da esperança
  rationale: Torna explícita em português a relação de finalidade expressa por πρός e preserva πληροφορία como plenitude de certeza ou convicção, sem eliminar sua ligação com a esperança.
- source_word: ἄχρι τέλους
  choice: até o fim
  rationale: Mantém o valor temporal e a ênfase na perseverança até a conclusão.
theological_decisions:
- issue: Sentido de “plena certeza da esperança” em relação à perseverança
  choice: A dedicação conduz à plena certeza ligada à esperança e deve permanecer até o fim.
  alternative: Entender a expressão exclusivamente como certeza interior da salvação ou, no extremo oposto, exclusivamente como plena realização objetiva da promessa esperada.
  rationale: O grego permite uma sobreposição entre a certeza subjetiva e a firmeza inerente à esperança fundamentada na promessa. A formulação não impõe um sistema doutrinário posterior.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tom é pastoral, exortativo e digno. “Dedicação” foi preferido a “diligência” por maior naturalidade contemporânea, sem perder a ideia de empenho sustentado.
