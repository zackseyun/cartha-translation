  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: pt
  text: Mas, quanto a vocês, amados, estamos convencidos de coisas melhores, relacionadas à salvação[a], embora falemos dessa maneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que acompanham a salvação”.'
    reason: Alternativa lexical plausível para ἐχόμενα σωτηρίας.
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: estamos convencidos
  rationale: O perfeito expressa um estado firme de convicção; a formulação é natural e preserva a segurança do autor.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a advertência severa dos versículos anteriores.
- source_word: περὶ ὑμῶν
  choice: quanto a vocês
  rationale: Expressa de modo natural περί com genitivo e mantém o foco do juízo favorável nos destinatários.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o vocativo afetuoso e solene sem recorrer a uma paráfrase excessivamente coloquial.
- source_word: τὰ κρείσσονα
  choice: coisas melhores
  rationale: Mantém a substantivação do adjetivo neutro plural e sua força comparativa.
- source_word: ἐχόμενα σωτηρίας
  choice: relacionadas à salvação
  rationale: Comunica a ligação com a salvação sem definir se tais coisas são evidências, efeitos ou acompanhamentos dela.
- source_word: εἰ καὶ
  choice: embora
  rationale: Reproduz com clareza a força concessiva da expressão.
- source_word: οὕτως
  choice: dessa maneira
  rationale: Remete naturalmente ao teor e ao modo severos da advertência anterior.
- source_word: λαλοῦμεν
  choice: falemos
  rationale: O presente do subjuntivo em português é exigido por 'embora' e representa adequadamente o presente indicativo grego dentro da construção concessiva.
theological_decisions:
- issue: Relação de ἐχόμενα com σωτηρίας no contexto de uma passagem de advertência
  choice: relacionadas à salvação
  alternative: que acompanham a salvação
  rationale: A tradução afirma uma associação real com a salvação, mas não determina se essas coisas são seus sinais, efeitos ou concomitantes, preservando a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluidez natural, sem perder o contraste, o afeto pastoral nem a concessão final.
