reference: Hebrews 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: pt
  text: e, tendo caído[a], renová-los outra vez para o arrependimento[b], pois, para si mesmos, estão crucificando novamente o Filho de Deus e expondo-o à vergonha pública.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo apostatado”. O verbo grego pode indicar um afastamento grave.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto, para si mesmos, estão crucificando novamente o Filho de Deus e expondo-o à vergonha pública”. Os particípios gregos podem ser entendidos como simultâneos, além de explicativos.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: tendo caído
  rationale: O particípio aoristo indica uma queda grave no contexto. A formulação preserva a forma participial e evita transformar no texto principal o sentido em um rótulo teológico técnico.
- source_word: πάλιν
  choice: outra vez
  rationale: Modifica naturalmente “renová-los” e expressa repetição com clareza em português atual.
- source_word: ἀνακαινίζειν
  choice: renová-los
  rationale: Traduz diretamente a ideia de renovar ou restaurar a uma condição anterior e retoma as pessoas mencionadas no contexto precedente.
- source_word: εἰς μετάνοιαν
  choice: para o arrependimento
  rationale: Preserva a força direcional ou de finalidade de εἰς e emprega o termo português corrente para μετάνοια.
- source_word: ἀνασταυροῦντας
  choice: estão crucificando novamente
  rationale: A forma progressiva reflete o aspecto presente do particípio e mantém a ideia de repetição expressa pelo prefixo verbal.
- source_word: ἑαυτοῖς
  choice: para si mesmos
  rationale: Conserva o dativo reflexivo, que pode indicar referência, interesse ou desvantagem, sem especificar além do que o grego permite.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Tradução direta e consagrada do título cristológico, preservando sua força integral.
- source_word: παραδειγματίζοντας
  choice: expondo-o à vergonha pública
  rationale: Expressa a exposição pública à desonra contida no verbo e mantém clara a dimensão social da vergonha.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Mantém a coordenação simples entre os elementos e os dois particípios.
theological_decisions:
- issue: Se o versículo deve repetir explicitamente a impossibilidade declarada no versículo anterior
  choice: Manter a dependência sintática, iniciando com “e” e sem acrescentar um novo verbo finito.
  alternative: “é impossível... renová-los outra vez”
  rationale: O texto grego de Hebreus 6:6 continua a construção de 6:4–6. Não repetir a declaração de impossibilidade preserva a sintaxe e evita inserir no versículo palavras ausentes.
- issue: Natureza da queda descrita
  choice: “tendo caído”, com nota que explicita a alternativa “tendo apostatado”.
  alternative: “tendo apostatado” no texto principal
  rationale: A expressão comunica a gravidade da advertência sem decidir debates posteriores sobre perda da salvação, fé aparente ou outras concepções de apostasia.
- issue: Força de ἀνασταυροῦντας e παραδειγματίζοντας
  choice: Leitura explicativa com “pois”.
  alternative: Leitura contemporânea com “enquanto”.
  rationale: Os particípios podem explicar a razão da impossibilidade, mas também admitem valor temporal ou circunstancial. A alternativa é registrada em nota para preservar a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura deliberadamente continua a frase iniciada nos versículos anteriores. “Tendo caído” conserva o particípio e a tensão teológica; “arrependimento” é natural e lexicalmente preciso. Todos os marcadores de nota aparecem no texto principal.
