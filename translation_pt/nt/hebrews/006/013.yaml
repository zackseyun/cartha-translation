id: HEB.6.13
reference: Hebrews 6:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: pt
  text: Pois, quando Deus fez a promessa a Abraão[a], visto que não tinha ninguém maior por quem jurar, jurou por si mesmo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais simples, “quando Deus prometeu a Abraão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: quando Deus fez a promessa a Abraão
  rationale: A construção participial indica que Deus fez uma promessa cujo destinatário foi Abraão. A formulação explicita naturalmente o objeto implícito no contexto, sem perder a relação temporal e lógica com o juramento.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que sustenta o argumento anterior e preserva claramente a conexão lógica.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Aqui a conjunção tem sentido causal, apresentando a razão pela qual Deus jurou por si mesmo.
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: ninguém maior
  rationale: 'Embora οὐδενός possa, em outros contextos, referir-se a coisa ou pessoa, a linguagem de juramento favorece um referente pessoal: não havia ninguém superior por quem Deus pudesse jurar.'
- source_word: εἶχεν ... ὀμόσαι
  choice: não tinha ... por quem jurar
  rationale: Mantém de perto a construção grega de disponibilidade ou possibilidade e soa natural em português, preservando a referência à inexistência de alguém maior.
- source_word: ὤμοσεν καθ’ ἑαυτοῦ
  choice: jurou por si mesmo
  rationale: Na linguagem de juramento, κατά com o reflexivo significa invocar a si próprio como garantia. A tradução conserva a repetição lexical de jurar e a força da autojuramentação divina.
theological_decisions:
- issue: Natureza do juramento de Deus
  choice: Deus jurou por si mesmo porque não tinha ninguém maior por quem jurar.
  alternative: Deus jurou por si mesmo porque não podia jurar por ninguém maior.
  rationale: A tradução preserva a afirmação da supremacia singular de Deus e a razão textual de seu juramento, sem ampliá-la mediante formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fez a promessa a Abraão” preserva a explicitude do substantivo implícito no contexto; a nota registra a alternativa mais concisa. “Visto que” mantém o valor causal de ἐπεί, e “por quem jurar” conserva naturalmente a construção e a ambiguidade limitada do original quanto à possibilidade/disponibilidade.
