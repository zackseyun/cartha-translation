translation:
  language: pt
  text: 'dizendo: “Certamente abençoarei você e certamente farei você se tornar muito numeroso.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “abençoando, abençoarei você e, multiplicando, multiplicarei você”, construção enfática que ecoa Gênesis 22:17.'
    reason: Registra a duplicação verbal do texto grego e sua força enfática, que não pode ser reproduzida literalmente sem tornar o português artificial.
lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: O particípio presente introduz diretamente o conteúdo do juramento divino e mantém a ligação sintática com o versículo anterior.
- source_word: Εἰ μὴν
  choice: Certamente
  rationale: A expressão funciona como fórmula enfática de asseveração em contexto de juramento, e não como condição literal.
- source_word: εὐλογῶν εὐλογήσω
  choice: abençoarei você
  rationale: A duplicação verbal de caráter semítico intensifica a promessa. A tradução principal usa português natural, enquanto “certamente” comunica a ênfase e a nota registra a forma grega.
- source_word: σε
  choice: você / com que se
  rationale: O pronome está no singular e se refere a Abraão. As formas escolhidas mantêm essa referência de maneira clara e natural em português.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga as duas ações prometidas.
- source_word: πληθύνων πληθυνῶ
  choice: certamente farei com que se multiplique
  rationale: Expressa em português natural a promessa enfática de tornar Abraão numeroso por meio de sua descendência, sem apagar a força da repetição grega.
theological_decisions:
- issue: Sentido de “multiplicar” aplicado diretamente a Abraão
  choice: farei com que se multiplique
  alternative: multiplicarei você / tornarei você muito numeroso
  rationale: O objeto singular é Abraão, mas a promessa envolve sua multiplicação por meio da descendência. A formulação mantém Abraão como referente sem inserir explicitamente “descendência”, que não aparece neste versículo.
- issue: Representação da fórmula enfática do juramento
  choice: Repetir “certamente” nas duas promessas e explicar a duplicação verbal em nota
  alternative: Usar “certamente” apenas uma vez ou reproduzir literalmente “abençoando, abençoarei”
  rationale: A repetição de “certamente” preserva o paralelismo e a ênfase de ambas as construções gregas, ao passo que a nota conserva sua forma incomum e sua ligação com Gênesis 22:17.
translation_notes:
  register: Português atual, digno e acessível, com “você” para explicitar o objeto singular de modo claro ao leitor brasileiro e compreensível internacionalmente. A ordem e o paralelismo da citação foram preservados, mas a segunda expressão foi formulada idiomaticamente.
