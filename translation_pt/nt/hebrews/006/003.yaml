  text: καὶ τοῦτο ⸀ποιήσομεν ἐάνπερ ἐπιτρέπῃ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/003.yaml
  text: And this we will do[a], if indeed God permits.
translation:
  language: pt
  text: E faremos isso, se de fato Deus permitir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se Deus deixar”. A expressão grega traduzida por “de fato” dá ênfase à condição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção natural que liga a declaração à exortação anterior.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo neutro singular retoma o curso de ação mencionado no contexto anterior; “isso” é natural em português.
- source_word: ποιήσομεν
  choice: faremos
  rationale: Preserva diretamente o futuro ativo de ποιέω, sem explicitar além do texto a ideia contextual de prosseguir.
- source_word: ἐάνπερ
  choice: se de fato
  rationale: Mantém tanto a condição quanto a ênfase acrescentada pela partícula περ, sem exagerar a incerteza.
- source_word: ἐπιτρέπῃ
  choice: permitir
  rationale: Expressa com precisão o presente do subjuntivo condicionado por ἐάνπερ e conserva o tom digno do texto.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução idiomática do sujeito nominativo articular; em português, o artigo grego não precisa ser reproduzido diante de “Deus”.
theological_decisions:
- issue: Cláusula condicional relativa à permissão divina
  choice: A intenção humana de agir é explicitamente subordinada à permissão de Deus.
  alternative: Verter apenas como a expressão idiomática “se Deus quiser” ou ampliar a frase com uma afirmação determinista.
  rationale: “Se de fato Deus permitir” conserva a condição real do grego e a tensão entre a intenção do autor e a permissão divina, sem impor uma conclusão doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faremos isso” conserva a concisão do grego; “se de fato Deus permitir” preserva a ênfase condicional.
