  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: pt
  text: E assim, depois de esperar com paciência, ele obteve a promessa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeu o que havia sido prometido”. Mais literalmente, o grego diz: “obteve a promessa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: E assim
  rationale: Mantém a ligação com o contexto anterior e expressa de modo natural a ideia de maneira ou resultado.
- source_word: μακροθυμήσας
  choice: depois de esperar com paciência
  rationale: Traduz o particípio aoristo com valor temporal e comunica a perseverança paciente de Abraão enquanto aguardava.
- source_word: ἐπέτυχεν
  choice: obteve
  rationale: Expressa a ideia de alcançar ou obter, sem afirmar além do texto que toda a promessa tenha sido plenamente cumprida.
- source_word: τῆς ἐπαγγελίας
  choice: a promessa
  rationale: Preserva o substantivo grego e sua ligação lexical com a promessa divina mencionada no contexto imediato.
theological_decisions:
- issue: Se a expressão indica que Abraão recebeu o cumprimento integral da promessa ou que alcançou/recebeu a promessa de Deus.
  choice: obteve a promessa
  alternative: recebeu o que havia sido prometido
  rationale: A formulação conserva a expressão grega sem definir se está em vista o cumprimento pleno ou o conteúdo prometido, preservando a tensão presente em Hebreus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção mantém a concisão do original e evita resolver sua ambiguidade teológica.
