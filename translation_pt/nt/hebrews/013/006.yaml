  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: pt
  text: 'de modo que podemos dizer com confiança: “O Senhor é quem me ajuda; não terei medo. O que poderá um ser humano fazer contra mim?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado ou a consequência do que foi afirmado antes e liga naturalmente o versículo ao contexto.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: dizemos com confiança
  rationale: Preserva a construção participial e expressa a coragem ou confiança indicada por θαρροῦντας em português natural.
- source_word: Κύριος
  choice: O Senhor
  rationale: É a forma consagrada e clara de representar κύριος como título divino nesta citação.
- source_word: ἐμοὶ βοηθός
  choice: é quem me ajuda
  rationale: Comunica de modo natural a relação expressa pelo dativo ἐμοί e mantém o caráter pessoal de βοηθός, aquele que presta auxílio.
- source_word: οὐ φοβηθήσομαι
  choice: não terei medo
  rationale: Representa diretamente a forma futura e soa corrente em português moderno.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: O que poderá um ser humano fazer contra mim?
  rationale: O futuro ποιήσει é mantido por “poderá”, enquanto a pergunta retórica comunica a limitação da ameaça humana. “Um ser humano” preserva o singular genérico de ἄνθρωπος sem sugerir referência exclusiva ao sexo masculino; “contra mim” expressa com naturalidade o sentido adversativo contextual do dativo μοι.
theological_decisions:
- issue: Sentido genérico de ἄνθρωπος
  choice: um ser humano
  alternative: o homem
  rationale: ἄνθρωπος designa aqui um ser humano de maneira representativa, não especificamente um indivíduo do sexo masculino. A formulação escolhida conserva o singular e torna explícito o alcance genérico em português contemporâneo.
- issue: Força retórica do futuro ποιήσει
  choice: O que poderá um ser humano fazer contra mim?
  alternative: O que um ser humano fará contra mim?
  rationale: “Poderá” conserva a referência futura e transmite em português a força retórica da pergunta, que minimiza o poder da ameaça humana, sem transformar a declaração em uma afirmação de que nenhum dano temporal seja possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o vínculo inferencial com o contexto, o tom confiante da declaração e a pergunta retórica, sem recorrer a linguagem arcaica.
