  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: pt
  text: Pois não temos aqui uma cidade permanente, mas buscamos a que há de vir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a cidade vindoura” ou “a cidade que virá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois não
  rationale: “Pois” preserva a função explicativa de γάρ em relação ao contexto anterior, e “não” traduz diretamente οὐ.
- source_word: ἔχομεν
  choice: temos
  rationale: O presente do indicativo é expresso de modo simples e natural em português.
- source_word: ὧδε
  choice: aqui
  rationale: Mantém o sentido dêitico do advérbio sem explicitar interpretativamente “na terra”.
- source_word: μένουσαν
  choice: permanente
  rationale: Como particípio que qualifica “cidade”, indica algo que permanece ou perdura; “permanente” é claro e natural no contraste com a cidade futura.
- source_word: πόλιν
  choice: cidade
  rationale: Conserva o substantivo concreto e a imagem própria do texto, sem substituí-la por “pátria” ou “céu”.
- source_word: ἀλλὰ
  choice: mas
  rationale: Expressa naturalmente o forte contraste entre a cidade não permanente daqui e aquela que virá.
- source_word: τὴν μέλλουσαν
  choice: a que há de vir
  rationale: O particípio feminino retoma “cidade”; a formulação preserva essa referência implícita e sua orientação futura.
- source_word: ἐπιζητοῦμεν
  choice: buscamos
  rationale: Traduz de modo corrente o ato de procurar ou aspirar intensamente, sem acrescentar no texto principal um grau de intensidade discutível.
theological_decisions:
- issue: Natureza da imagem da “cidade”
  choice: Manter “cidade” sem identificá-la explicitamente como céu, cidade celestial ou Jerusalém celestial.
  alternative: Traduzir interpretativamente como “céu”, “cidade celestial” ou “Jerusalém celestial”.
  rationale: Embora Hebreus desenvolva em outros lugares a imagem da cidade celestial, este versículo diz apenas que a cidade vindoura é buscada. A tradução conserva a metáfora e evita importar uma identificação mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Há de vir” conserva solenidade moderada sem soar arcaico; “cidade permanente” comunica de maneira natural a ideia de uma cidade que permanece.
