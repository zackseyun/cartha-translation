source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: pt
  text: E não deixem de fazer o bem e de partilhar[a], pois Deus se agrada de tais sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comunhão” ou “generosidade”. Neste contexto, a palavra grega provavelmente se refere à partilha prática de recursos com outras pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: fazer o bem
  rationale: Expressa de modo natural e direto a beneficência ativa indicada pelo substantivo grego.
- source_word: κοινωνίας
  choice: repartir o que têm
  rationale: No contexto, κοινωνία aponta para a partilha prática, especialmente de recursos. A formulação comunica esse sentido sem restringi-lo apenas a contribuições financeiras.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: não se esqueçam
  rationale: Preserva a imagem lexical do verbo grego e constitui uma exortação natural em português, com o sentido prático de não deixar de cumprir essas ações.
- source_word: τοιαύταις ... θυσίαις
  choice: tais sacrifícios
  rationale: Mantém de forma concisa a metáfora cultual que caracteriza o fazer o bem e a partilha como sacrifícios.
- source_word: εὐαρεστεῖται
  choice: se agrada
  rationale: Equivalente português corrente para a ideia de Deus ter prazer ou aprovação diante desses sacrifícios.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução padrão e direta do sujeito nominativo.
- source_word: δὲ
  choice: E
  rationale: Liga a exortação ao contexto anterior sem introduzir um contraste forte.
theological_decisions:
- issue: Natureza dos “sacrifícios” neste versículo
  choice: Referência metafórica ao fazer o bem e à partilha como sacrifícios agradáveis a Deus
  alternative: Entender a expressão apenas como esmolas equivalentes ao culto, ou como conduta ética geral sem força sacrificial
  rationale: O grego aplica explicitamente a linguagem de sacrifício a essas ações. A tradução conserva a metáfora sem reduzi-la a esmolas nem eliminar sua dimensão cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Repartir o que têm” torna explícito o sentido prático provável de κοινωνία, enquanto a nota preserva sua amplitude lexical. O marcador [a] aparece no texto principal.
