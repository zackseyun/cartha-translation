base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: pt
  text: Não se esqueçam da hospitalidade[a], pois, por meio dela, alguns, sem o saber, hospedaram anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguns, sem o saber, hospedaram mensageiros”. A palavra grega pode significar tanto “anjos” como “mensageiros”, embora “anjos” se ajuste melhor à provável alusão neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: hospitalidade
  rationale: O substantivo designa literalmente amor ou acolhimento de estrangeiros. “Hospitalidade” é a forma idiomática e corrente em português, mantendo no contexto a ideia de acolher quem chega de fora.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Não se esqueçam
  rationale: O verbo pode exprimir tanto esquecer como negligenciar. A formulação natural em português preserva a metáfora do esquecimento e, neste imperativo, implica não deixar de praticar a hospitalidade.
- source_word: διὰ ταύτης
  choice: por meio dela
  rationale: O pronome feminino retoma “hospitalidade”, e a expressão preserva claramente o valor instrumental de διά.
- source_word: ἔλαθόν
  choice: sem saber
  rationale: A construção de λανθάνω com particípio indica que a ação ocorreu sem que os sujeitos tivessem consciência disso. “Sem saber” comunica esse sentido de maneira direta e natural.
- source_word: τινες
  choice: alguns
  rationale: Corresponde naturalmente ao pronome indefinido plural.
- source_word: ξενίσαντες
  choice: hospedaram
  rationale: O particípio refere-se a receber alguém como hóspede. “Hospedaram” é claro no português atual e evita o possível sentido de divertir associado a “entreter”.
- source_word: ἀγγέλους
  choice: anjos
  rationale: Embora o termo também possa significar “mensageiros”, a provável alusão aos visitantes celestiais acolhidos nas narrativas de Gênesis 18–19 favorece “anjos” no texto principal.
theological_decisions:
- issue: Sentido de ἀγγέλους
  choice: anjos, no sentido de seres celestiais
  alternative: mensageiros, possivelmente humanos
  rationale: A provável alusão às narrativas veterotestamentárias de hospitalidade prestada a visitantes celestiais favorece “anjos”. Como ἄγγελος possui genuína amplitude lexical, a alternativa “mensageiros” é mantida em nota, sem apagar a ambiguidade da palavra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não se esqueçam” soa natural como exortação comunitária; “hospedaram” comunica com precisão o acolhimento de visitantes.
