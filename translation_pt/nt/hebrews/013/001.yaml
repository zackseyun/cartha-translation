  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: pt
  text: Que o amor fraternal continue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «amor pelos demais crentes»; o termo grego indica o afeto familiar dentro da comunidade cristã, não apenas entre homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: amor fraternal
  rationale: Expressão natural e digna em português que preserva a metáfora familiar do grego. No uso cristão antigo, designa o afeto entre os membros da comunidade de fé, sem se limitar aos homens.
- source_word: μενέτω
  choice: Que ... continue
  rationale: O imperativo presente de μένω pede a permanência de uma realidade já existente. A construção exortativa «Que ... continue» comunica tanto a força imperativa quanto o aspecto contínuo.
- source_word: Ἡ
  choice: incorporado naturalmente em «o amor fraternal»
  rationale: O artigo apresenta φιλαδελφία como uma virtude definida e reconhecível. Em português, ele aparece naturalmente na construção «o amor fraternal».
theological_decisions:
- issue: Alcance de φιλαδελφία e linguagem familiar
  choice: amor fraternal
  alternative: amor entre os irmãos; amor pelos demais crentes; amor mútuo
  rationale: «Amor fraternal» conserva a imagem de uma família presente no termo grego, sem reduzir o sentido a uma abstração genérica. Como a expressão pode ser entendida hoje como referente apenas a homens, a nota esclarece que ela abrange toda a comunidade cristã.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A formulação breve preserva a concisão e a força exortativa do original.
