  terminology: «Casamento», «leito conjugal», «sem mancha», «os sexualmente imorais», «os adúlteros» e «julgará» são escolhas apropriadas, legíveis e teologicamente não excessivas. «Julgará» preserva corretamente o alcance de κρινεῖ, sem antecipar condenação.
