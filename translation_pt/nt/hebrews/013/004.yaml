id: HEB.13.4
reference: Hebrews 13:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: pt
  text: Que o casamento seja honrado por todos[a], e o leito conjugal permaneça sem mancha[b], pois Deus julgará os sexualmente imorais e os adúlteros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O casamento é digno de honra entre todos”. O grego não traz verbo explícito na primeira oração; por isso, ela pode ser entendida como exortação ou como declaração. «Entre todos» é outra possível tradução de «por todos».'
    reason: alternative_reading
  - marker: b
    text: 'Lit.: “e o leito, sem mancha”. Neste contexto, “leito” se refere ao leito conjugal e às relações sexuais no casamento.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τίμιος
  choice: seja honrado
  rationale: Expressa a ideia de algo estimado e digno de honra. A forma exortativa combina com a sequência de instruções éticas de Hebreus 13, sem ocultar em nota a possível leitura declarativa.
- source_word: ὁ γάμος
  choice: o casamento
  rationale: Neste contexto, refere-se ao casamento como vínculo ou estado, não à cerimônia de bodas.
- source_word: ἐν πᾶσιν
  choice: por todos
  rationale: O plural provavelmente se refere a pessoas. Em português, «por todos» expressa naturalmente quem deve honrar o casamento; a possível nuance «entre todos» é preservada em nota.
- source_word: ἡ κοίτη
  choice: o leito conjugal
  rationale: «Leito» funciona como metonímia das relações sexuais e, em paralelo com «casamento», «leito conjugal» torna clara a referência sem abandonar a imagem do grego.
- source_word: ἀμίαντος
  choice: sem mancha
  rationale: Preserva a imagem de pureza moral e a ressonância de algo não contaminado, em linguagem corrente e digna.
- source_word: πόρνους
  choice: os sexualmente imorais
  rationale: Abrange pessoas que praticam imoralidade sexual, evitando o termo antiquado ou potencialmente estreito «fornicadores».
- source_word: μοιχούς
  choice: os adúlteros
  rationale: Mantém a referência específica aos que cometem adultério e a distingue da categoria mais ampla anterior.
- source_word: κρινεῖ
  choice: julgará
  rationale: Reproduz o futuro indicativo e não acrescenta o resultado do julgamento, que o verbo grego não explicita por si só.
- source_word: γάρ
  choice: pois
  rationale: Introduz de modo natural a razão que fundamenta a exortação.
theological_decisions:
- issue: A primeira oração pode ser declarativa ou exortativa porque não há verbo explícito no grego.
  choice: 'Leitura exortativa: «Que o casamento seja honrado».'
  alternative: 'Leitura declarativa: «O casamento é digno de honra».'
  rationale: A sequência de exortações éticas em Hebreus 13 favorece a leitura exortativa. Contudo, a construção grega permite genuinamente a leitura declarativa, por isso ela é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Que ... seja» comunica a exortação de modo natural; «leito conjugal» conserva a imagem bíblica sem ambiguidade excessiva; «sexualmente imorais» mantém a amplitude de πόρνους.
