source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: pt
  text: 'Que o modo de viver de vocês seja livre do amor ao dinheiro, e que vocês se contentem com o que têm, pois ele mesmo disse: “Nunca deixarei você[a] nem jamais abandonarei você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A promessa retoma garantias da aliança presentes no Antigo Testamento, especialmente em Deuteronômio 31:6, 8 e Josué 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: livre do amor ao dinheiro
  rationale: Expressa de modo natural a ausência de apego ao dinheiro e preserva o foco específico do termo na avareza, sem ampliá-lo para toda forma de ganância.
- source_word: ὁ τρόπος
  choice: o modo de viver de vocês
  rationale: No contexto, τρόπος designa a conduta ou maneira de viver. A inclusão de “de vocês” explicita naturalmente os destinatários da exortação.
- source_word: ἀρκούμενοι
  choice: contentem-se
  rationale: O particípio tem força exortativa ligada à oração inicial. A forma verbal direta é clara e natural em português.
- source_word: τοῖς παροῦσιν
  choice: com o que têm
  rationale: A expressão significa literalmente “com as coisas presentes”, referindo-se aqui ao que está à disposição dos leitores. “Com o que têm” comunica esse sentido de modo idiomático e conciso.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: pois ele mesmo disse
  rationale: Preserva a ênfase de αὐτός sem inserir explicitamente “Deus”, substantivo ausente do grego. Em português, o perfeito grego pode ser expresso naturalmente por “disse”, mantendo-se a validade permanente da declaração pelo contexto.
- source_word: Οὐ μή σε ἀνῶ
  choice: Nunca deixarei você
  rationale: A combinação οὐ μή transmite negação enfática. “Nunca deixarei você” é idiomático e conserva a força da promessa.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: nem jamais o abandonarei
  rationale: “Abandonarei” traduz claramente ἐγκαταλείπω, enquanto “jamais” representa a negação enfática reiterada. O pronome “o” retoma “você” segundo o padrão culto corrente.
theological_decisions:
- issue: Identificação de quem fala na citação
  choice: Manter “ele mesmo” no texto principal.
  alternative: “O próprio Deus disse.”
  rationale: O contexto identifica Deus como o autor da promessa, mas o grego traz αὐτός, não θεός. A tradução preserva essa forma sem acrescentar um substantivo teológico não explícito.
- issue: Força das negações enfáticas na promessa
  choice: “Nunca deixarei você nem jamais o abandonarei.”
  alternative: “De modo algum deixarei ou abandonarei você.”
  rationale: As duas construções com οὐ μή intensificam a certeza da promessa. “Nunca” e “jamais” reproduzem essa força em português natural sem criar uma repetição artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” na exortação coletiva e “você” na citação, refletindo o singular grego σε. Preferiu-se “abandonarei” a “desampararei” por sua clareza contemporânea, sem perder a solenidade.
