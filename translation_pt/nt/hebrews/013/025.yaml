lexical_decisions:
- source_word: ἡ χάρις
  choice: A graça
  rationale: 'No encerramento epistolar, χάρις designa a graça como bênção. Em português, a fórmula natural e digna conserva o artigo: “A graça”.'
- source_word: μετὰ
  choice: esteja com
  rationale: μετά com o genitivo significa “com”. Como a frase grega é elíptica, o português explicita naturalmente o valor de desejo ou bênção mediante “esteja”, sem acrescentar conteúdo doutrinário.
- source_word: πάντων ὑμῶν
  choice: todos vocês
  rationale: A expressão inclui explicitamente todos os destinatários. “Todos vocês” preserva essa abrangência e é clara no português moderno de ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Formulação breve, natural e solene, apropriada a uma bênção epistolar. “Vocês” favorece a compreensão internacional com legibilidade brasileira, enquanto “todos” mantém a inclusão explícita do grego.
