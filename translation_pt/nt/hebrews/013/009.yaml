  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: pt
  text: Não se deixem levar por ensinamentos variados e estranhos, pois é bom que o coração seja fortalecido pela graça[a], e não por alimentos[b], pois os que se ocupavam deles[c] não obtiveram proveito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja firmado pela graça”. O verbo grego pode significar fortalecer, firmar ou tornar estável.
    reason: lexical_alternative
  - marker: b
    text: “Alimentos” provavelmente se refere a práticas ou observâncias relacionadas à alimentação; o grego diz simplesmente “alimentos”.
    reason: cultural_note
  - marker: c
    text: Ou “os que viviam segundo eles”. O grego diz literalmente “os que andavam neles”, usando “andar” como imagem da conduta habitual.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: ensinamentos variados e estranhos
  rationale: “Ensinamentos” é claro e atual, sem sugerir necessariamente um sistema doutrinário formal. “Variados e estranhos” preserva tanto a diversidade expressa por ποικίλαις quanto a ideia de algo alheio ou não pertencente à mensagem recebida em ξέναις.
- source_word: μὴ παραφέρεσθε
  choice: Não se deixem levar
  rationale: Reproduz de modo idiomático a imagem passiva de ser levado para fora do rumo e mantém a força da proibição no presente.
- source_word: καλὸν γὰρ
  choice: pois é bom
  rationale: Tradução direta e natural de καλὸν γὰρ, preservando a ligação explicativa com a advertência anterior.
- source_word: χάριτι
  choice: pela graça
  rationale: O dativo é entendido como meio ou instrumento; “graça” é mantida sem paráfrase para conservar sua transparência teológica.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: que o coração seja fortalecido
  rationale: “Fortalecido” comunica a ideia de tornar firme ou estável, enquanto “coração” conserva a imagem bíblica do centro da vida interior.
- source_word: οὐ βρώμασιν
  choice: e não por alimentos
  rationale: Mantém o sentido lexical direto de βρώμασιν sem inserir no texto principal uma identificação mais específica com leis alimentares, refeições sacrificiais ou outras observâncias.
- source_word: ἐν οἷς οὐκ ὠφελήθησαν
  choice: dos quais não se beneficiaram
  rationale: A formulação é natural em português, retoma “alimentos” e conserva a afirmação de que essas coisas não proporcionaram benefício.
- source_word: οἱ περιπατοῦντες
  choice: os que se ocupavam com eles
  rationale: O verbo significa literalmente “andar”, mas aqui descreve conduta ou prática habitual. A expressão escolhida comunica a dedicação a tais alimentos ou práticas sem produzir uma construção artificial em português.
theological_decisions:
- issue: Referente de “alimentos” e seu contraste com a graça
  choice: Manter “alimentos” no texto principal, entendendo o contraste como graça versus dependência de práticas relacionadas à alimentação para firmar o coração.
  alternative: Especificar “leis alimentares”, “observâncias alimentares” ou “refeições sacrificiais”.
  rationale: βρώμασιν designa literalmente alimentos. Embora o contexto permita associações rituais ou cultuais, a tradução não deve restringir o referente além do que o texto afirma.
- issue: Sentido metafórico de “coração”
  choice: Conservar “coração”.
  alternative: Traduzir como “mente”, “interior” ou “ser interior”.
  rationale: καρδία possui peso antropológico e teológico e designa o centro da pessoa interior; a imagem bíblica deve ser preservada.
- issue: Metáfora de “andar” em relação aos alimentos
  choice: Expressar idiomaticamente como “ocupar-se com eles”, registrando em nota a metáfora literal.
  alternative: Traduzir literalmente “andar neles” ou interpretar como “viver segundo essas práticas”.
  rationale: A tradução literal seria obscura em português, enquanto “viver segundo essas práticas” introduziria explicitamente a palavra “práticas”, ausente do grego. A nota preserva a forma e as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais para leitores brasileiros. Evitou-se linguagem excessivamente técnica e também a ampliação interpretativa do referente de “alimentos”. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
