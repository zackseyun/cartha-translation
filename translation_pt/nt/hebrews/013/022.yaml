id: HEB.13.22
reference: Hebrews 13:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: pt
  text: Peço a vocês, irmãos[a], que tenham paciência com esta palavra de exortação[b], pois lhes escrevi em poucas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos”, forma que pode dirigir-se inclusivamente a toda a congregação.
    reason: lexical_alternative
  - marker: b
    text: “Palavra de exortação” também pode ser traduzida por “mensagem de encorajamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Peço
  rationale: Neste apelo pessoal, παρακαλῶ expressa um pedido insistente. “Peço” é natural em português e, no contexto, mantém a força apelativa sem recorrer a uma formulação excessivamente solene.
- source_word: δὲ
  choice: não representado por palavra isolada
  rationale: A partícula marca uma transição leve. Em português, o início direto do apelo comunica com naturalidade essa passagem, sem introduzir contraste ou valor temporal inexistentes.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego. Como ela pode incluir toda a comunidade, essa possibilidade é explicitada em nota.
- source_word: ἀνέχεσθε
  choice: acolham com paciência
  rationale: ἀνέχομαι pede aqui tolerância e receptividade paciente diante da mensagem. A formulação portuguesa evita tanto o tom áspero de “suportem” quanto a redução a simplesmente ouvir.
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: esta palavra de exortação
  rationale: λόγος designa a mensagem comunicada, e παράκλησις pode envolver exortação e encorajamento. “Esta” torna natural a referência à mensagem presente, embora o demonstrativo esteja implícito.
- source_word: καὶ γὰρ
  choice: pois
  rationale: A combinação introduz a razão que sustenta o pedido. “Pois” transmite de modo idiomático sua força explicativa.
- source_word: διὰ βραχέων
  choice: em poucas palavras
  rationale: Reproduz de perto o idioma grego e comunica a brevidade relativa alegada pelo autor.
- source_word: ἐπέστειλα
  choice: escrevi
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito português. No contexto epistolar, o verbo se refere à composição ou ao envio da mensagem escrita.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome dativo indica os destinatários e é expresso naturalmente por “lhes” em português.
theological_decisions:
- issue: Alcance do vocativo masculino ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma gramatical masculina da fonte, enquanto a nota registra que o vocativo pode dirigir-se inclusivamente a toda a congregação.
- issue: Amplitude semântica de παράκλησις
  choice: exortação
  alternative: encorajamento
  rationale: “Exortação” se ajusta ao caráter apelativo do escrito, mas a palavra grega também pode salientar consolo ou encorajamento; a nota preserva essa amplitude sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Peço a vocês” evita o lusitanismo de “rogo-vos”; “acolham com paciência” comunica a atitude solicitada sem a aspereza que “suportem” pode ter no uso corrente.
