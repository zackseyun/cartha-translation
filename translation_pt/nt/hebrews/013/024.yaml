source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: pt
  text: Saúdem todos os seus líderes e todos os santos. Os que são da Itália[a] saúdam vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os que estão na Itália saúdam vocês.” A expressão grega pode se referir tanto a pessoas originárias da Itália quanto a pessoas que se encontram ali.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: O aoristo imperativo de ἀσπάζομαι transmite uma ordem para cumprimentar ou comunicar saudações. “Saúdem” é direto, natural e preserva a força imperativa.
- source_word: πάντας
  choice: todos
  rationale: Reproduz de modo direto a abrangência do plural grego e se aplica aos dois grupos mencionados.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: seus líderes
  rationale: O particípio substantivado designa os que exercem liderança na comunidade. “Seus líderes” é claro e atual, sem a conotação política de “governantes” ou “dominadores”.
- source_word: τοὺς ἁγίους
  choice: os santos
  rationale: Mantém a designação neotestamentária dos fiéis como pessoas consagradas a Deus e conserva seu peso lexical e teológico sem paráfrase interpretativa.
- source_word: ἀσπάζονται
  choice: saúdam
  rationale: No contexto epistolar, o presente de ἀσπάζομαι comunica o envio de saudações. “Saúdam” preserva a concisão e o paralelismo com o primeiro verbo.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Os que são da Itália
  rationale: ἀπό com o genitivo indica mais naturalmente origem ou procedência. A formulação portuguesa expressa essa leitura sem sugerir necessariamente que essas pessoas acabaram de chegar da Itália.
theological_decisions:
- issue: Referente de οἱ ἀπὸ τῆς Ἰταλίας
  choice: Os que são da Itália
  alternative: Os que estão na Itália
  rationale: A preposição ἀπό normalmente aponta para origem ou procedência, por isso essa leitura aparece no texto principal. Como a expressão também pode ser entendida como referência a pessoas situadas na Itália, a alternativa é preservada em nota, sem resolver indevidamente a ambiguidade histórica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Saúdem vocês” evita o regionalismo de formas pronominais mais restritas; “santos” preserva a terminologia bíblica tradicional sem linguagem arcaica. O marcador [a] foi colocado junto à expressão geográfica a que a nota se refere.
