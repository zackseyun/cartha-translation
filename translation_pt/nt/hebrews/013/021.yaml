  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: pt
  text: que ele os capacite com tudo o que é bom para fazerem a vontade dele, realizando em nós o que lhe é agradável, por meio de Jesus, o Messias, a quem[a] seja a glória para sempre. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A quem” pode se referir especificamente a Jesus, o Messias; outros entendem que se refere ao Deus da paz, sujeito da oração.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: capacite
  rationale: No contexto desta oração de bênção, o verbo exprime preparar e prover os destinatários do necessário para obedecer; “capacite” comunica isso com naturalidade em português moderno.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: em tudo o que é bom
  rationale: Mantém a preposição e a amplitude da expressão grega sem impor exclusivamente a ideia instrumental de receber “todas as coisas boas”.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: para fazerem a vontade dele
  rationale: A construção com infinitivo articulado indica finalidade; a forma portuguesa é direta e preserva essa função.
- source_word: ποιῶν ἐν ἡμῖν
  choice: realizando em nós
  rationale: Preserva tanto a ação divina expressa pelo particípio quanto a mudança intencional do texto de “vocês” para “nós”.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: o que lhe é agradável
  rationale: Expressa de modo idiomático aquilo que é agradável diante de Deus, sem transformar a avaliação relacional em mera aceitabilidade formal.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: “Por meio de” comunica a mediação de διά; Χριστός é vertido como o título “o Messias”.
- source_word: ᾧ ἡ δόξα
  choice: a quem seja a glória
  rationale: A oração relativa preserva a forma doxológica e não explicita além do grego o referente do pronome.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: A expressão idiomática denota duração sem fim; “para sempre” é claro, digno e não acrescenta uma duplicação ausente nesta forma grega.
theological_decisions:
- issue: Referente do pronome relativo ᾧ (“a quem”)
  choice: Manter “a quem” sem nomear seu referente
  alternative: Entender que a glória é atribuída especificamente a Jesus, o Messias, ou ao Deus da paz, sujeito da oração iniciada no versículo anterior
  rationale: O antecedente gramatical mais próximo é Jesus, o Messias, mas o sujeito principal da bênção é Deus. A tradução conserva a ambiguidade real da construção grega e a nota apresenta as duas possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A alternância do plural de segunda pessoa (“os”, “fazerem”) para a primeira pessoa (“em nós”) foi preservada. A pontuação apresenta “o Messias” como título em aposição.
