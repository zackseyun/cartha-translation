  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: pt
  text: Jesus, o Messias, é o mesmo ontem, hoje e para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo é o mesmo ontem, hoje e para sempre.” O título grego Χριστός pode ser traduzido como “Messias” ou transliterado como “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa tradicional e padrão do nome próprio grego.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título grego por seu sentido, em vez de apenas transliterá-lo como “Cristo”; o artigo torna o título idiomático em português.
- source_word: ἐχθὲς
  choice: ontem
  rationale: Equivalente temporal direto, preservando a sequência retórica do grego.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e natural em português.
- source_word: ὁ αὐτός
  choice: é o mesmo
  rationale: Expressa naturalmente em português a identidade constante indicada pelo predicativo grego, com a cópula subentendida no original.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressão portuguesa corrente para a duração perpétua da locução grega.
- source_word: καὶ ... καὶ ... καὶ
  choice: e ... e ... e
  rationale: 'A tradução mantém o encadeamento essencial, embora a primeira coordenação seja naturalmente expressa por vírgula na enumeração portuguesa: “ontem, hoje e para sempre”.'
theological_decisions:
- issue: Força cristológica da constância de Jesus
  choice: Afirmar diretamente que Jesus, o Messias, permanece o mesmo através do tempo, sem ampliação doutrinária.
  alternative: Explicitar a imutabilidade ou a divindade de Cristo como interpretação teológica do versículo.
  rationale: O grego declara a identidade constante de Jesus no passado, presente e futuro; a tradução preserva essa afirmação sem acrescentar conclusões doutrinárias que não estejam verbalizadas.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός é um título correspondente a “Messias”. A alternativa tradicional “Cristo” continua legítima e é registrada em nota para preservar a familiaridade e a possibilidade lexical.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A pontuação destaca “o Messias” como título em aposição, e a formulação concisa preserva o ritmo memorável do original.
