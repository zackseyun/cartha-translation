base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: pt
  text: Lembrem-se dos que estão presos[a], como se estivessem presos com eles; e dos que são maltratados, pois vocês mesmos também estão no corpo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivessem ligados a eles”. O grego evoca literalmente estar ligados juntamente com os presos.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “no corpo” provavelmente se refere à condição humana corporal e à vulnerabilidade comum ao sofrimento. Também pode ser entendida como uma referência ao pertencimento ao corpo de Cristo.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Lembrem-se
  rationale: O imperativo presente plural pede lembrança contínua e atuante; em português, a forma simples é natural e pode assumir esse valor durativo no contexto.
- source_word: τῶν δεσμίων
  choice: dos que estão presos
  rationale: δέσμιος designa alguém em cadeias ou sob prisão. A expressão escolhida é clara e corrente, enquanto a nota preserva a imagem concreta de estar ligado por correntes.
- source_word: ὡς συνδεδεμένοι
  choice: como se estivessem presos com eles
  rationale: O particípio evoca estar ligado ou preso juntamente com outros. A formulação comunica identificação solidária sem afirmar que os leitores estavam literalmente encarcerados.
- source_word: τῶν κακουχουμένων
  choice: dos que são maltratados
  rationale: κακουχέομαι indica sofrer maus-tratos ou aflição causada por outros. A tradução mantém a voz passiva e usa linguagem acessível.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: pois vocês mesmos também estão no corpo
  rationale: Mantém a expressão literal ἐν σώματι e sua possível abertura semântica. 'Pois' expressa naturalmente a força motivadora de ὡς neste contexto.
theological_decisions:
- issue: Sentido de ἐν σώματι (“no corpo”)
  choice: Condição humana corporal compartilhada, preservando a formulação literal
  alternative: Pertencimento ao corpo de Cristo
  rationale: O contexto aponta principalmente para a vulnerabilidade física comum diante do sofrimento. Contudo, a tradução não substitui a expressão por 'têm um corpo', evitando excluir uma possível ressonância comunitária ou eclesial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. A construção paralela conserva a concisão exortativa do grego; as notas registram a metáfora das correntes e a ambiguidade de “no corpo”.
