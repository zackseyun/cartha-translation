  source_fidelity: 'O texto preserva com precisão a estrutura da oração: Deus é qualificado como «da paz», é aquele que «trouxe dentre os mortos» Jesus, e Jesus é identificado como «nosso Senhor» e «o grande pastor das ovelhas». «Pelo sangue de uma aliança eterna» representa de modo plausível o valor instrumental/associativo de ἐν αἵματι e não resolve indevidamente sua ligação sintática.'
  naturalness: «Que o Deus da paz ...» é uma abertura natural e solene para a oração optativa que continua no versículo seguinte. «Trouxe dentre os mortos» é formulação bíblica corrente e plenamente compreensível em português moderno. A manutenção da frase aberta por vírgula é correta, pois a construção se completa em 13:21.
  terminology: «Deus da paz», «Senhor», «pastor», «ovelhas» e «aliança eterna» são escolhas naturais, consistentes com o vocabulário de Hebreus e semanticamente fiéis ao grego. O artigo indefinido em «uma aliança eterna» é defensável para a expressão grega anártrica e não impede a alusão contextual à aliança conhecida.
