id: HEB.13.20
reference: Hebrews 13:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: pt
  text: Que o Deus da paz[a], que trouxe dentre os mortos nosso Senhor Jesus, o grande pastor das ovelhas, pelo sangue de uma aliança eterna,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que trouxe dentre os mortos nosso Senhor Jesus — o grande pastor das ovelhas — no sangue da aliança eterna”. O grego permite relacionar de maneiras ligeiramente diferentes a expressão “no/pelo sangue de uma aliança eterna”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Que o
  rationale: δέ marca a transição para a oração de bênção; em português, a construção optativa com «Que» expressa naturalmente o início da oração sem acrescentar um «agora» temporal inexistente no grego.
- source_word: θεὸς τῆς εἰρήνης
  choice: o Deus da paz
  rationale: Preserva a construção genitiva e a expressão bíblica natural, indicando Deus como aquele que se caracteriza pela paz e a concede.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: que trouxe dentre os mortos
  rationale: Mantém a imagem básica de ἀνάγω, «trazer para cima», numa formulação portuguesa compreensível para a ressurreição. «Dentre os mortos» representa de modo idiomático ἐκ νεκρῶν.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: o grande pastor das ovelhas
  rationale: Conserva a metáfora pastoral, o substantivo explícito «ovelhas» e a qualificação «grande».
- source_word: ἐν αἵματι
  choice: pelo sangue
  rationale: Expressa o possível valor instrumental ou de fundamento de ἐν sem desenvolver a relação teológica além do texto.
- source_word: διαθήκης αἰωνίου
  choice: de uma aliança eterna
  rationale: «Aliança» corresponde ao uso de διαθήκη em Hebreus; o artigo indefinido reflete a expressão grega sem artigo, embora o contexto possa remeter à aliança já conhecida.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: nosso Senhor Jesus
  rationale: Reproduz claramente a identificação de Jesus como Senhor e como aquele que Deus trouxe dentre os mortos.
theological_decisions:
- issue: Relação de «ἐν αἵματι διαθήκης αἰωνίου» com o restante da oração
  choice: 'Ligada principalmente ao ato de Deus trazer Jesus dentre os mortos: «pelo sangue de uma aliança eterna»'
  alternative: Ligada principalmente a «o grande pastor das ovelhas», ou traduzida como «no sangue da aliança eterna»
  rationale: A ordem grega permite mais de uma ligação sintática. O texto principal adota a leitura instrumental plausível, enquanto a nota registra a ambiguidade genuína sem explicar os mecanismos da ressurreição ou da expiação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A frase permanece aberta porque o versículo continua em Hebreus 13:21. A formulação evita um «agora» temporal e conserva, em nota, a ambiguidade sintática e instrumental do original.
