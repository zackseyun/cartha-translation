source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: pt
  text: Portanto, saiamos ao encontro dele, para fora do acampamento[a], levando a sua afronta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fora do arraial”. A expressão evoca a prática sacrificial de Levítico 16 e a rejeição sofrida por Jesus fora da cidade.'
    reason: Alternativa lexical para «acampamento» e esclarecimento conciso da imagem intertextual.
lexical_decisions:
- source_word: τοίνυν
  choice: Portanto
  rationale: Partícula inferencial que tira uma conclusão do argumento anterior, especialmente de 13.11–12. “Portanto” conserva com clareza essa força lógica.
- source_word: ἐξερχώμεθα
  choice: saiamos
  rationale: Subjuntivo presente na primeira pessoa do plural, com força de exortação. “Saiamos” é natural, direto e preserva o aspecto coletivo do apelo.
- source_word: πρὸς αὐτὸν
  choice: até ele
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. “Até ele” expressa naturalmente tanto o movimento quanto o propósito de juntar-se a ele.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: para fora do acampamento
  rationale: παρεμβολή designa acampamento ou arraial. “Acampamento” é atual e compreensível, além de preservar a imagem cultual e a evocação do deserto.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: a afronta dele
  rationale: ὀνειδισμός pode indicar afronta, insulto, vergonha pública ou desonra. “Afronta” comunica a hostilidade e a humilhação social sem reduzir a expressão a um sentimento subjetivo.
- source_word: φέροντες
  choice: carregando
  rationale: Particípio presente que acompanha a exortação principal. “Carregando” preserva a metáfora de levar um peso e evita substituir o termo por “suportando”, que explicitaria apenas uma de suas implicações.
theological_decisions:
- issue: Referente de “ele”
  choice: Manter o pronome “ele”, cujo referente contextual é Jesus em 13.12
  alternative: Substituir o pronome por “Jesus”
  rationale: O grego emprega o pronome, e o referente é suficientemente claro no contexto imediato. Mantê-lo evita explicitação desnecessária.
- issue: Sentido de “fora do acampamento”
  choice: Conservar a imagem concreta e cultual
  alternative: Parafrasear como “fora do sistema religioso” ou “fora da comunidade”
  rationale: A expressão retoma o quadro sacrificial de 13.11–12 e permite também a dimensão de rejeição social. Uma paráfrase resolveria indevidamente a abrangência da imagem.
- issue: Relação expressa por αὐτοῦ em “a afronta dele”
  choice: Preservar a formulação possessiva do grego
  alternative: Explicitar como “a afronta que ele sofreu” ou “a afronta sofrida por causa dele”
  rationale: O contexto favorece a participação na afronta associada a Jesus, mas a construção grega é concisa. A tradução evita decidir além do necessário se a afronta é descrita sobretudo como dirigida a ele, pertencente à sua condição rejeitada ou compartilhada por seus seguidores.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “arraial” no texto principal por soar antigo em grande parte do uso contemporâneo; a forma foi preservada na nota por sua tradição bíblica. A ordem mantém o movimento enfático: sair até ele, fora do acampamento, e compartilhar sua afronta.'
