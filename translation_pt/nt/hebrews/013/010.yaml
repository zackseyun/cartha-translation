base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: pt
  text: Temos um altar do qual os que servem no tabernáculo não têm o direito de comer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “os que ministram na tenda ou no tabernáculo”. A expressão se refere aos que participam do serviço do santuário da antiga aliança.
    reason: lexical_alternative
  - marker: b
    text: 'O “altar” é entendido de várias maneiras: como o próprio Cristo, a cruz, o altar celestial ou os benefícios sacrificiais da oferta de Cristo. Aqui, o grego mantém a imagem sem especificá-la mais.'
    reason: alternative_reading
lexical_decisions:
- source_word: θυσιαστήριον
  choice: altar
  rationale: É o equivalente direto e natural em português, preservando a imagem cultual e seu peso tipológico sem interpretá-la como “sacrifício” ou “cruz” no texto principal.
- source_word: ἐξ οὗ
  choice: do qual
  rationale: Expressa a ideia de origem ou procedência ligada a “comer” e mantém a imagem de comer daquilo que provém do altar.
- source_word: φαγεῖν
  choice: comer
  rationale: Tradução simples do infinitivo aoristo, integrada naturalmente à construção portuguesa “ter o direito de comer”.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: não têm o direito
  rationale: Neste contexto cultual, ἐξουσία indica direito ou prerrogativa autorizada; a formulação comunica claramente que não lhes é permitido participar.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: os que servem no tabernáculo
  rationale: λατρεύω designa aqui serviço cultual, enquanto σκηνή evoca o santuário móvel da antiga aliança. “Servem no tabernáculo” é claro, natural e evita reduzir a expressão a adoração genérica.
- source_word: ἔχομεν
  choice: Temos
  rationale: Mantém o presente do original e a inclusão do autor com seus destinatários.
theological_decisions:
- issue: Referente de “altar” em Hebreus 13:10
  choice: Manter o termo concreto “altar” sem especificar seu referente no texto principal.
  alternative: Cristo, a cruz, o altar celestial ou os benefícios sacrificiais da oferta de Cristo.
  rationale: O grego deixa a imagem sem explicação mais específica neste versículo. Preservá-la evita resolver indevidamente uma questão interpretativa e mantém a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Tabernáculo” preserva o termo bíblico estabelecido; as notas esclarecem seu sentido sem sobrecarregar o versículo.
