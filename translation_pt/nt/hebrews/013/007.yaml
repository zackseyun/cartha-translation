id: HEB.13.7
reference: Hebrews 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: pt
  text: Lembrem-se dos seus líderes, que lhes falaram a palavra de Deus. Considerem atentamente o desfecho[b] do modo como viveram e imitem a fé[a] deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. A palavra grega pode significar fé ou fidelidade; o texto principal segue a tradução habitual “fé”.
    reason: alternative_reading
  - marker: b
    text: “Desfecho” também pode ser traduzido por “fim” e, em algumas interpretações, pode se referir especificamente à maneira como morreram.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Lembrem-se
  rationale: O imperativo presente pede uma lembrança contínua; a forma idiomática portuguesa transmite adequadamente essa exortação no contexto.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: dos seus líderes
  rationale: A expressão se refere a pessoas reconhecidas como dirigentes da comunidade. “Líderes” é atual e preserva sua autoridade sem sugerir necessariamente governo político.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: que lhes falaram a palavra de Deus
  rationale: Mantém o sentido direto de λαλέω e a expressão bíblica correspondente à construção grega “a palavra de Deus”.
- source_word: ἀναθεωροῦντες
  choice: Considerem atentamente
  rationale: O particípio indica observação cuidadosa e reflexão, não um olhar superficial; em português, a forma imperativa torna clara sua ligação com a exortação principal.
- source_word: τὴν ἔκβασιν
  choice: o desfecho
  rationale: “Desfecho” abrange o resultado ou fim da vida desses líderes sem afirmar explicitamente que se trate da maneira de sua morte.
- source_word: τῆς ἀναστροφῆς
  choice: do modo como viveram
  rationale: A expressão natural em português comunica conduta ou maneira de viver e se ajusta à referência retrospectiva a esses líderes.
- source_word: μιμεῖσθε
  choice: imitem
  rationale: Reproduz diretamente o imperativo grego e é claro no português moderno.
- source_word: τὴν πίστιν
  choice: a fé deles
  rationale: Segue a tradução habitual de πίστις como “fé”, ao mesmo tempo que a nota preserva a possibilidade contextual de “fidelidade”.
theological_decisions:
- issue: Sentido de πίστις como característica humana a ser imitada
  choice: fé
  alternative: fidelidade
  rationale: O termo pode indicar tanto fé quanto fidelidade, e ambas as leituras cabem no contexto. O texto principal mantém “fé”, sem eliminar a alternativa legítima, registrada em nota.
- issue: Se ἔκβασις designa especificamente a morte ou o martírio dos líderes
  choice: desfecho
  alternative: fim; em algumas interpretações, a maneira como morreram
  rationale: O grego pode indicar o resultado ou fim de sua trajetória, mas não afirma expressamente morte ou martírio. “Desfecho” conserva essa amplitude.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para produzir uma exortação natural em português. Os marcadores foram ligados aos termos a que suas notas efetivamente se referem: [b] a “desfecho” e [a] a “fé”.'
