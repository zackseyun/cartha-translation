  terminology: “Líderes”, “cedam”, “velam”, “almas”, “prestar contas”, “alegria”, “gemendo” e “proveitoso” representam adequadamente os termos gregos e não reforçam indevidamente uma leitura autoritária. A nota deve limitar a alternativa “obedeçam” ao primeiro verbo, Πείθεσθε, sem fundi-lo com ὑπείκετε.
