id: HEB.13.17
reference: Hebrews 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: pt
  text: Deixem-se persuadir por seus líderes e cedam a eles[a], pois eles velam pelas almas de vocês, como aqueles que hão de prestar contas, para que façam isso com alegria e não gemendo; pois isso não seria proveitoso para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Obedeçam aos seus líderes.” O verbo grego traduzido por “deixem-se persuadir” também pode ter o sentido de obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Deixem-se persuadir por
  rationale: O imperativo médio/passivo pode significar “deixem-se persuadir” e, por extensão, “obedeçam”. A opção no texto preserva a nuance relacional de acolher a orientação, enquanto a alternativa tradicional aparece na nota.
- source_word: ἡγουμένοις
  choice: líderes
  rationale: O particípio designa os que exercem liderança reconhecida na comunidade; “líderes” é atual e não acrescenta uma noção autoritária mais forte que o grego.
- source_word: ὑπείκετε
  choice: cedam a eles
  rationale: O verbo significa ceder, dar lugar ou deferir. A tradução mantém uma ideia distinta da persuasão expressa pelo primeiro verbo.
- source_word: ἀγρυπνοῦσιν
  choice: velam
  rationale: Preserva de modo conciso a imagem de vigilância atenta, inclusive a conotação literal de permanecer acordado.
- source_word: ψυχῶν
  choice: almas
  rationale: ψυχή pode designar alma, vida ou pessoa. “Almas” conserva o peso espiritual da expressão sem necessariamente negar a referência à pessoa inteira.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: como quem há de prestar contas
  rationale: Formulação idiomática que preserva a responsabilidade futura dos líderes, implicitamente diante de Deus.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Equivalência direta e natural da locução preposicional.
- source_word: στενάζοντες
  choice: gemendo
  rationale: Mantém a imagem concreta de gemer ou suspirar, sem reduzi-la apenas a tristeza.
- source_word: ἀλυσιτελὲς
  choice: não seria proveitoso
  rationale: Expressa falta de benefício sem intensificar indevidamente o sentido para “prejudicial”.
theological_decisions:
- issue: Natureza da exortação em relação aos líderes da comunidade
  choice: Confiança receptiva e disposição para ceder à orientação de líderes responsáveis
  alternative: Uma ordem de obediência irrestrita aos líderes
  rationale: A combinação de Πείθεσθε e ὑπείκετε indica receptividade e deferência, mas não exige que a tradução maximize uma força autoritária. A própria justificativa apresenta os líderes como cuidadores que prestarão contas.
- issue: Referente implícito da prestação de contas
  choice: Manter Deus implícito
  alternative: Acrescentar explicitamente “a Deus”
  rationale: O contexto teológico sugere prestação de contas a Deus, mas o texto grego não explicita o complemento; por isso, a tradução preserva a formulação aberta.
- issue: Referência do último τοῦτο (“isso”)
  choice: Preservar a referência ampla e ligeiramente ambígua
  alternative: Explicitar que o gemido dos líderes seria prejudicial
  rationale: O demonstrativo pode apontar para o desempenho pesaroso da tarefa ou para a situação descrita como um todo. “Isso” não resolve silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita o destinatário comunitário. “Velam” preserva a metáfora pastoral de vigilância; “há de prestar contas” mantém um tom solene sem arcaísmo excessivo.
