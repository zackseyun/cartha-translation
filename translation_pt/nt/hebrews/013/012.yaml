id: HEB.13.12
reference: Hebrews 13:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: pt
  text: Por isso, também Jesus sofreu fora da porta[b], para santificar o povo por meio do seu próprio sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornar santo” ou “consagrar”, em vez de “santificar”.
    reason: lexical_alternative
  - marker: b
    text: “Fora da porta” provavelmente se refere ao lugar fora de Jerusalém onde Jesus sofreu, evocando a remoção dos restos dos sacrifícios para fora do acampamento, mencionada no contexto anterior.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa naturalmente a inferência que liga o versículo ao argumento anterior.
- source_word: καὶ
  choice: também
  rationale: Assinala a correspondência entre Jesus e o padrão sacrificial mencionado anteriormente.
- source_word: ἵνα ἁγιάσῃ
  choice: para santificar
  rationale: Preserva a ideia de finalidade e o sentido cultual e teológico de ἁγιάζω.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: por meio do seu próprio sangue
  rationale: Torna explícito o valor instrumental de διά com genitivo e conserva a ênfase de ἰδίου.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Mantém a forma definida do grego sem acrescentar interpretativamente “de Deus”.
- source_word: ἔξω τῆς πύλης
  choice: fora da porta
  rationale: Conserva o singular e não acrescenta “da cidade”, embora a referência contextual seja à porta de Jerusalém.
- source_word: ἔπαθεν
  choice: sofreu
  rationale: Tradução direta e concisa do aoristo de πάσχω.
theological_decisions:
- issue: Sentido de ἁγιάζω no contexto sacrificial
  choice: santificar
  alternative: tornar santo; consagrar
  rationale: “Santificar” preserva o registro cultual e pactual de Hebreus sem limitar o termo a uma formulação doutrinária específica.
- issue: Alcance de τὸν λαόν
  choice: o povo
  alternative: o povo de Deus
  rationale: O contexto aponta para o povo da aliança, mas a tradução não acrescenta palavras ausentes do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada naturalmente para o português, mantendo a relação de finalidade e a linguagem sacrificial do grego.
