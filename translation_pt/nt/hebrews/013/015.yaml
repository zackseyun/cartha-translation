source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: pt
  text: Portanto, por meio dele, ofereçamos continuamente a Deus um sacrifício de louvor, isto é, o fruto de lábios que confessam[a] o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que reconhecem publicamente o seu nome”. O verbo grego pode indicar confissão ou reconhecimento aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com o genitivo expressa meio ou mediação; a formulação preserva a referência contextual a Cristo sem explicitar o antecedente além do texto.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente da argumentação anterior e mantém clara a ligação lógica.
- source_word: ἀναφέρωμεν
  choice: ofereçamos
  rationale: O subjuntivo presente na primeira pessoa do plural tem força exortativa. “Ofereçamos” é natural em português e conserva a imagem cultual.
- source_word: θυσίαν αἰνέσεως
  choice: um sacrifício de louvor
  rationale: Mantém a construção e a metáfora sacrificial, além de refletir o pano de fundo bíblico.
- source_word: διὰ παντός
  choice: continuamente
  rationale: Expressa ação constante ou reiterada de modo claro e idiomático.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Representa naturalmente o destinatário da oferta.
- source_word: τοῦτ’ ἔστιν
  choice: isto é
  rationale: Introduz a explicação do que constitui o sacrifício de louvor.
- source_word: καρπὸν χειλέων
  choice: o fruto de lábios
  rationale: Preserva a metáfora e não acrescenta o possessivo “nossos”, ausente do grego.
- source_word: ὁμολογούντων
  choice: que confessam
  rationale: O particípio caracteriza os lábios como agentes de confissão ou reconhecimento público; “confessam” conserva essa amplitude melhor que paráfrases como “louvam” ou “dão graças”.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: o seu nome
  rationale: Com ὁμολογέω, o dativo é vertido idiomaticamente como objeto direto em português, indicando o reconhecimento público do nome de Deus.
theological_decisions:
- issue: Referente de “dele” em δι’ αὐτοῦ
  choice: Manter o pronome, cujo referente contextual é Cristo, preservando o sentido mediador.
  alternative: Explicitar “por meio de Jesus” ou deixar a mediação teologicamente genérica.
  rationale: O contexto imediato aponta para Jesus, mas conservar o pronome evita introduzir no versículo um nome que não está expresso nele.
- issue: Força da linguagem sacrificial
  choice: Conservar “ofereçamos” e “sacrifício de louvor”.
  alternative: Achatar a imagem para “louvemos a Deus”.
  rationale: A formulação cultual é deliberada e sustenta a relação entre sacrifício e louvor sem acrescentar uma interpretação doutrinária.
- issue: Sentido de ὁμολογούντων
  choice: Traduzir por “confessam”, com nota indicando “reconhecem publicamente”.
  alternative: Traduzir diretamente por “reconhecem”, “louvam” ou “dão graças”.
  rationale: “Confessam” preserva a ideia de declaração aberta e a tensão lexical do verbo; a nota esclarece uma alternativa legítima sem reduzir o sentido a louvor ou gratidão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à fluência do português, mantendo as metáforas cultual e frutífera do grego. O marcador [a] aparece imediatamente após a expressão a que se refere.
