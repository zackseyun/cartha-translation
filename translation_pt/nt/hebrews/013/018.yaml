  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: pt
  text: Orem por nós, pois estamos convencidos[a] de que temos boa consciência[b], visto que desejamos proceder bem em tudo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estamos persuadidos” ou “estamos confiantes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma consciência limpa”.
    reason: lexical_alternative
  - marker: c
    text: Ou “desejando proceder honradamente em todas as coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσεύχεσθε περὶ ἡμῶν
  choice: Orem por nós
  rationale: O imperativo presente plural é expresso com naturalidade por “orem”; com linguagem de oração, περί + genitivo significa idiomaticamente “por nós”. O aspecto contínuo possível não é explicitado para evitar sobretradução.
- source_word: πειθόμεθα
  choice: estamos convencidos
  rationale: Preserva a força cognitiva do verbo e comunica uma convicção presente e estabelecida; “estamos persuadidos” e “estamos confiantes” também são possíveis.
- source_word: καλὴν συνείδησιν ἔχομεν
  choice: temos boa consciência
  rationale: Tradução direta e natural que conserva o adjetivo amplo καλὴν sem restringi-lo à ideia mais específica de consciência limpa.
- source_word: θέλοντες
  choice: visto que desejamos
  rationale: Expressa a intenção contínua do particípio e torna inteligível, em português, sua provável relação explicativa ou causal com a afirmação anterior.
- source_word: ἐν πᾶσιν καλῶς ἀναστρέφεσθαι
  choice: proceder bem em tudo
  rationale: “Proceder” comunica a dimensão ética do modo de viver, καλῶς permanece amplo como “bem”, e “em tudo” reproduz o alcance abrangente de ἐν πᾶσιν em português atual.
theological_decisions:
- issue: Relação da oração participial final com a afirmação de boa consciência
  choice: visto que desejamos proceder bem em tudo
  alternative: desejando proceder bem em tudo
  rationale: A formulação explicativa/causal torna a relação sintática natural em português, sem transformar a intenção de agir bem numa alegação mais forte de impecabilidade. A nota registra a possibilidade de manter a ligação participial mais formal e ambígua.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Orem”, “boa consciência” e “proceder bem em tudo” evitam tanto arcaísmo quanto coloquialismo excessivo. Os marcadores foram posicionados junto às expressões a que cada nota se refere.
