  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: pt
  text: E peço-lhes com ainda mais insistência que façam isso, para que eu lhes seja restituído[a] mais cedo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que eu volte a vocês mais cedo”. O grego pode indicar, de modo geral, que o autor seja restituído aos leitores, sem especificar a circunstância exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: ainda mais
  rationale: Preserva a força comparativa do advérbio e soa natural em português atual.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conexão leve com a exortação anterior, sem contraste forte.
- source_word: παρακαλῶ
  choice: insisto
  rationale: Neste contexto, expressa um pedido enfático; “insisto” comunica sua intensidade de modo natural.
- source_word: τοῦτο ποιῆσαι
  choice: que façam isso
  rationale: Retoma diretamente o pedido de oração no versículo anterior e preserva a referência anafórica de τοῦτο.
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade do pedido.
- source_word: τάχιον
  choice: mais depressa
  rationale: 'Mantém explicitamente o valor comparativo do advérbio: mais rapidamente ou mais cedo.'
- source_word: ἀποκατασταθῶ
  choice: eu seja restituído
  rationale: Preserva a voz passiva e o sentido amplo de ser restaurado ou devolvido aos destinatários, sem definir a circunstância.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa com clareza a relação ou direção para o grupo de destinatários.
theological_decisions:
- issue: Sentido da esperada restituição do autor aos destinatários
  choice: Pedido geral para que ele seja restituído aos destinatários
  alternative: Que ele seja libertado da prisão, volte de uma viagem ou seja restaurado ao ministério entre eles
  rationale: O grego ἀποκατασταθῶ ὑμῖν não especifica a causa da separação nem a forma da reunião. A redação evita impor um cenário histórico ou teológico particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Restituído a vocês” conserva a formulação passiva e a ambiguidade do original; a nota oferece a alternativa mais idiomática “volte a vocês”. O marcador foi colocado após a oração a que a nota se refere.
