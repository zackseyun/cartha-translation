  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: pt
  text: Pois os corpos dos animais cujo sangue é levado pelo sumo sacerdote aos lugares santos pelo pecado são queimados fora do acampamento.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao santuário”. O grego diz literalmente “aos lugares santos”, expressão cultual que se refere à área sagrada do santuário.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são completamente consumidos pelo fogo”. O verbo pode enfatizar que são inteiramente queimados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: os corpos dos animais cujo
  rationale: A construção relativa e sua retomada demonstrativa referem-se aos animais sacrificiais. A formulação portuguesa preserva essa relação com clareza e naturalidade.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e mantém explícita a ligação lógica.
- source_word: εἰσφέρεται
  choice: é levado ... para
  rationale: O presente passivo descreve o sangue sendo conduzido para a área sagrada; em português, a colocação do agente antes do destino torna a frase mais fluida.
- source_word: τὸ αἷμα
  choice: sangue
  rationale: Mantém literalmente a referência sacrificial.
- source_word: περὶ ἁμαρτίας
  choice: por causa do pecado
  rationale: Preserva a relação ampla com o pecado no contexto sacrificial sem especificar além do grego que se trata de uma 'oferta pelo pecado'.
- source_word: εἰς τὰ ἅγια
  choice: para os lugares santos
  rationale: Preserva o plural e a expressão cultual, sem restringi-la ao Lugar Santíssimo. 'Para' expressa de modo natural o movimento para dentro dessa esfera sagrada.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: pelo sumo sacerdote
  rationale: διά com genitivo indica aqui a agência sacerdotal; a voz passiva portuguesa pede naturalmente 'pelo'.
- source_word: κατακαίεται
  choice: são queimados
  rationale: Expressa o ato ritual de queimar; a possível nuance intensiva do verbo é conservada em nota.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: fora do acampamento
  rationale: É a formulação clara e tradicional para o acampamento de Israel evocado pela imagem do tabernáculo.
theological_decisions:
- issue: Referência cultual de εἰς τὰ ἅγια
  choice: para os lugares santos
  alternative: para o santuário; para o Lugar Santíssimo
  rationale: Em Hebreus, τὰ ἅγια pode designar de modo flexível o âmbito sagrado do santuário. O plural mais amplo evita impor a identificação mais específica com o Lugar Santíssimo, embora o contexto evoque ritos expiatórios.
- issue: Sentido sacrificial de περὶ ἁμαρτίας
  choice: por causa do pecado
  alternative: como oferta pelo pecado; pelo pecado
  rationale: A tradução mantém a relação cultual com o pecado sem transformar a expressão grega mais ampla numa designação técnica inequívoca de um tipo específico de oferta.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário cultual amplamente reconhecível. A ordem da frase foi ajustada para evitar peso excessivo sem apagar as relações sintáticas do grego.
