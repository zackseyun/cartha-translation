  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: pt
  text: Saibam que nosso irmão Timóteo foi libertado[a]; se ele vier em breve, eu os verei com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi posto em liberdade”. Possivelmente se refere à libertação da prisão; o verbo também pode significar “foi enviado” ou “foi dispensado”, mas “foi libertado” parece se ajustar melhor ao contexto provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Saibam
  rationale: O presente imperativo plural tem aqui função epistolar de dar uma informação aos destinatários; “Saibam” preserva sua força e soa natural em português.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: nosso irmão
  rationale: Mantém a linguagem familiar cristã e a referência masculina singular específica a Timóteo.
- source_word: Τιμόθεον
  choice: Timóteo
  rationale: Forma tradicional e corrente do nome em português.
- source_word: ἀπολελυμένον
  choice: foi libertado
  rationale: O particípio perfeito passivo indica uma ação concluída com relevância presente. “Foi libertado” expressa o sentido contextual mais provável sem especificar indevidamente prisão ou custódia; outras possibilidades lexicais são registradas em nota.
- source_word: μεθ’ οὗ
  choice: com ele
  rationale: Na reorganização natural da frase em português, “com ele” liga claramente Timóteo à visita prevista e evita a construção mais rígida “com quem”.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Se ele vier logo
  rationale: A construção expressa condição, e τάχιον, embora comparativo na forma, tem aqui o sentido idiomático de “logo” ou “em breve”.
- source_word: ὄψομαι ὑμᾶς
  choice: irei vê-los
  rationale: Preserva o sentido direto do futuro de ὁράω. “Visitarei vocês” explicitaria uma implicação, mas seria mais interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da segunda frase foi ajustada para evitar uma construção relativa artificial, sem alterar a relação sintática entre a chegada de Timóteo e a visita do autor.
