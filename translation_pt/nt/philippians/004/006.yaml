source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: pt
  text: Não fiquem ansiosos por coisa alguma[a]; pelo contrário, em tudo, por meio da oração e da súplica[b], com ações de graças, que seus pedidos sejam apresentados a Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se preocupem com coisa alguma”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pedido insistente”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “diante de Deus”.'
    reason: translation_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Não fiquem ansiosos por coisa alguma
  rationale: A construção proibitiva é expressa de modo natural em português, mantendo o sentido de ansiedade ou preocupação inquietante sem converter o texto numa afirmação sobre toda forma de cuidado.
- source_word: ἐν παντί
  choice: em tudo
  rationale: Preserva a abrangência da expressão grega com formulação breve e corrente.
- source_word: τῇ προσευχῇ
  choice: oração
  rationale: Equivalente português padrão para προσευχή, indicando de modo amplo a oração dirigida a Deus.
- source_word: τῇ δεήσει
  choice: súplica
  rationale: Mantém a distinção em relação a oração, indicando pedido insistente ou necessidade específica; embora um pouco mais formal, é amplamente compreensível.
- source_word: μετ’ εὐχαριστίας
  choice: com ações de graças
  rationale: Formulação bíblica natural que conserva o substantivo e o sentido de gratidão expressa a Deus.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: seus pedidos
  rationale: Expressão clara e natural para as coisas concretamente solicitadas, sem repetir 'súplica'.
- source_word: γνωριζέσθω
  choice: apresentem
  rationale: O imperativo ativo idiomático comunica adequadamente a força do imperativo passivo grego ('sejam dados a conhecer') sem sugerir que Deus antes ignorava os pedidos.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: Representa diretamente a orientação dos pedidos para Deus e se encaixa naturalmente com 'apresentem'.
theological_decisions:
- issue: Alcance da proibição de μεριμνάω
  choice: ansiosos
  alternative: preocupados
  rationale: A tradução conserva o foco na inquietação ansiosa, evitando interpretar a frase como proibição absoluta de todo cuidado responsável.
- issue: Sentido de γνωριζέσθω πρὸς τὸν θεόν
  choice: apresentem seus pedidos a Deus
  alternative: sejam conhecidos diante de Deus
  rationale: A opção principal expressa o ato de dirigir os pedidos a Deus; a nota preserva a possibilidade formal de entender πρὸς em sentido relacional ou presencial.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no plural inclusivas para a comunidade. 'Pelo contrário' explicita naturalmente o contraste de ἀλλά. 'Ações de graças' preserva o peso devocional da expressão, e as notas registram alternativas reais sem sobrecarregar o texto principal.
