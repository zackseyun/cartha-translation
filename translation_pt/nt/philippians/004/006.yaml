review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a proibição da ansiedade, o contraste, a abrangência de «em tudo», a distinção entre oração e súplica, a ação de graças e a direção dos pedidos a Deus. Contudo, «apresentem» muda o imperativo passivo γνωριζέσθω para um imperativo ativo. Uma formulação passiva e idiomática preserva melhor a construção do grego.
  naturalness: O texto é claro, moderno e adequado ao registro bíblico acessível. «Que seus pedidos sejam apresentados a Deus» é natural em português e conserva o tom exortativo.
  terminology: «Ansiosos», «oração», «súplica», «ações de graças» e «pedidos» são escolhas apropriadas. A nota c atual chama de mais literal uma expressão que também altera «a Deus» para «diante de Deus» e introduz uma redação mais ampla; deve ser limitada à alternativa real para πρὸς τὸν θεόν.
  issues:
  - severity: medium
    issue: A voz de γνωριζέσθω não é preservada no texto principal.
    rationale: 'γνωριζέσθω é imperativo presente passivo: literalmente, os pedidos devem/que sejam dados a conhecer. «Apresentem» expressa bem a ideia geral, mas transforma a construção em ativa. «Que seus pedidos sejam apresentados a Deus» é uma correção segura e natural.'
  - severity: low
    issue: A nota c é imprecisa como alternativa «mais literalmente».
    rationale: «Sejam conhecidos diante de Deus» não é simplesmente uma tradução mais literal da expressão inteira, pois «diante de Deus» é alternativa contextual para πρὸς τὸν θεόν, enquanto «sejam conhecidos» trata do verbo. A nota deve indicar apenas a alternativa pertinente.
  revised_text: Não fiquem ansiosos por coisa alguma[a]; pelo contrário, em tudo, por meio da oração e da súplica[b], com ações de graças, que seus pedidos sejam apresentados a Deus[c].
