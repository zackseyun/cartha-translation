revisions:
- from: E vocês mesmos sabem, filipenses, que, no início do evangelho, quando saí da Macedônia, nenhuma igreja participou comigo na questão de dar e receber,[a] a não ser somente vocês.
  to: E vocês mesmos também sabem, filipenses, que, no início do evangelho, quando saí da Macedônia, nenhuma igreja se associou a mim na questão de dar e receber,[a] a não ser somente vocês.
  rationale: A revisão explicita o sentido aditivo de καί, melhora a construção que traduz κοινωνέω e ajusta a nota para uma alternativa contábil fiel e não excessivamente interpretativa. Mantém-se a exclusividade enfática de μόνοι e a ambiguidade de «no início do evangelho».
