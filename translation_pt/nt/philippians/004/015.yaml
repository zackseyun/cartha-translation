source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: pt
  text: E vocês mesmos também sabem, filipenses, que, no início do evangelho, quando saí da Macedônia, nenhuma igreja se associou a mim na questão de dar e receber,[a] a não ser somente vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na conta de dar e receber”.'
    reason: Alternativa lexical que preserva a possível nuance contábil de λόγος.
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: E vocês mesmos sabem
  rationale: Mantém o valor presente de οἴδατε, a progressão discursiva de δέ e a ênfase do pronome com o sentido aditivo de καί, em português natural.
- source_word: Φιλιππήσιοι
  choice: filipenses
  rationale: Forma consagrada e natural do vocativo dirigido aos habitantes de Filipos.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: no início do evangelho
  rationale: Preserva a formulação grega e sua possível referência à fase inicial da obra do evangelho, sem explicitar além do texto.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: quando saí da Macedônia
  rationale: Tradução direta, atual e digna do evento indicado pelo aoristo.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: nenhuma igreja participou comigo
  rationale: Comunica a participação concreta da igreja com Paulo sem limitar κοινωνέω a uma transação comercial nem recorrer ao termo eclesiástico potencialmente abstrato 'comungou'.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: na questão de dar e receber
  rationale: Expressa com clareza a parceria material, preservando em nota a possível metáfora contábil de λόγος.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: a não ser somente vocês
  rationale: Conserva a exclusividade enfática da expressão grega em linguagem compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a ênfase em “vocês mesmos” e preserva a possível linguagem contábil em nota, sem reduzir a participação dos filipenses a uma simples operação financeira.
