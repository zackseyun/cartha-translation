lexical_decisions:
- source_word: πλὴν
  choice: Mesmo assim
  rationale: Marca uma ressalva ou transição levemente contrastiva em relação ao que Paulo acaba de dizer, sem diminuir o elogio; é natural no português atual.
- source_word: καλῶς ἐποιήσατε
  choice: vocês fizeram bem
  rationale: Reproduz de modo idiomático a avaliação positiva da ação dos filipenses e mantém o valor pontual do aoristo.
- source_word: συγκοινωνήσαντές
  choice: em participar comigo
  rationale: Expressa participação solidária e conjunta, preservando o elemento relacional indicado por συν- e pelo genitivo μου.
- source_word: τῇ θλίψει
  choice: da minha aflição
  rationale: Comunica pressão e sofrimento com peso adequado, sem ampliar o sentido para uma tribulação escatológica; o possessivo explicita naturalmente a relação de μου com a participação na aflição.
theological_decisions: []
translation_notes:
