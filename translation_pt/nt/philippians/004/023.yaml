  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: pt
  text: A graça do Senhor Jesus Cristo esteja com o espírito de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos acrescentam «Amém».
    reason: variante textual
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Termo consagrado nas bênçãos paulinas; preserva tanto o sentido de favor concedido quanto sua densidade teológica.
- source_word: κυρίου
  choice: Senhor
  rationale: Equivalente natural de κύριος como título cristológico neste contexto.
- source_word: Χριστοῦ
  choice: Cristo
  rationale: Em português, na fórmula onomástica e litúrgica «Senhor Jesus Cristo», a forma tradicional é natural e amplamente compreendida; «Messias» tornaria mais explícita a força titular, mas soaria menos idiomático aqui.
- source_word: μετὰ
  choice: com
  rationale: Com o genitivo, μετά expressa companhia ou presença; «com» é o equivalente direto e natural.
- source_word: πνεύματος
  choice: espírito
  rationale: A minúscula indica que o referente mais provável é o espírito humano ou a vida interior coletiva dos destinatários, não uma referência explícita ao Espírito Santo.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Torna inequívoco, em português de ampla legibilidade brasileira, que o possessivo grego está no plural.
theological_decisions:
- issue: Sentido de πνεύματος ὑμῶν
  choice: o espírito de vocês
  alternative: o Espírito de vocês
  rationale: A construção aponta mais naturalmente para o espírito humano dos destinatários, possivelmente entendido em sentido coletivo. A tradução mantém o singular grego e não identifica indevidamente o referente com o Espírito Santo.
- issue: Tradução de Χριστοῦ na fórmula «Senhor Jesus Cristo»
  choice: Cristo
  alternative: Messias
  rationale: Embora Χριστός tenha origem titular e possa ser traduzido por «Messias», nesta fórmula paulina está estreitamente ligado ao nome Jesus. «Cristo» preserva a ambiguidade entre título e designação quase onomástica e é mais natural em português.
- issue: Força verbal da bênção sem verbo expresso
  choice: esteja
  alternative: está
  rationale: A frase nominal grega funciona como bênção ou desejo. O subjuntivo «esteja» expressa essa força sem transformar a declaração em simples afirmação.
translation_notes:
  register: Português moderno, digno e acessível, com «de vocês» para deixar claro o plural de ὑμῶν. A ordem e o caráter conciso da bênção grega foram preservados.
