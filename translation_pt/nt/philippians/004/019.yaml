id: PHP.4.19
reference: Philippians 4:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: pt
  text: E o meu Deus suprirá cada necessidade de vocês segundo a sua riqueza, em glória, no Messias Jesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”.'
    reason: lexical_alternative
  - marker: b
    text: “Segundo a sua riqueza” indica a medida ou o padrão da provisão de Deus, não apenas que ela procede de sua riqueza.
    reason: alternative_reading
  - marker: c
    text: A expressão grega também pode ser entendida como “gloriosamente”; sua ligação exata com “no Messias Jesus” permanece aberta.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: E o meu Deus
  rationale: δέ funciona aqui como conexão leve com o contexto anterior; “E” preserva o fluxo sem introduzir um contraste forte, enquanto “meu Deus” mantém a expressão pessoal de Paulo.
- source_word: πληρώσει
  choice: suprirá
  rationale: Neste contexto, πληρόω comunica prover aquilo de que se necessita. “Suprirá” é natural em português e mais claro do que o sentido literal “encherá”.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: cada necessidade de vocês
  rationale: χρεία designa necessidade ou carência, e πᾶσαν tem força distributiva. A formulação é clara e preserva o alcance de cada necessidade, sem necessariamente prometer todo desejo.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: segundo a sua riqueza
  rationale: κατά com acusativo indica aqui medida ou padrão, não apenas origem. “Segundo a sua riqueza” preserva a ideia de provisão correspondente à riqueza de Deus.
- source_word: ἐν δόξῃ
  choice: em glória
  rationale: A expressão preposicional grega admite mais de uma relação sintática e nuance. A tradução formal conserva essa abertura em vez de reduzi-la a “gloriosamente”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Χριστός ainda funciona como título cristológico. “Messias” comunica seu significado, enquanto a forma tradicional “Cristo Jesus” é registrada em nota.
theological_decisions:
- issue: Sentido e alcance de ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ
  choice: em glória, no Messias Jesus
  alternative: gloriosamente, no Messias Jesus; ou em glória no Messias Jesus
  rationale: A pontuação torna legíveis em português as duas expressões preposicionais sucessivas sem afirmar que o grego resolve inequivocamente a ligação de “em glória”. As alternativas são mantidas em nota.
- issue: Tradução de Χριστός em ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: em Cristo Jesus
  rationale: O termo é apresentado como título e pode ser traduzido pelo seu significado. A formulação tradicional permanece disponível em nota, sem impor uma distinção doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa. Mantém “em glória” para preservar a ambiguidade do original e usa pontuação mínima para evitar uma sequência pouco natural de locuções prepositivas.
