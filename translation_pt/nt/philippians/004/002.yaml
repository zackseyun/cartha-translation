  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: pt
  text: Exorto Evódia e exorto Síntique a terem o mesmo modo de pensar no Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terem a mesma atitude no Senhor”; também é possível “a entrarem em acordo no Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Evódia
  rationale: Adota a forma tradicional e reconhecível do nome em português, em vez de traduzir seu possível significado.
- source_word: παρακαλῶ
  choice: exorto
  rationale: Expressa o apelo pessoal, sério e pastoral do verbo no contexto. A repetição foi preservada porque Paulo dirige a mesma exortação individualmente a cada mulher.
- source_word: Συντύχην
  choice: Síntique
  rationale: Adota a forma tradicional e reconhecível do nome em português, sem traduzir seu possível significado.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: a terem o mesmo modo de pensar
  rationale: Preserva tanto a ideia de correspondência expressa por τὸ αὐτό quanto a dimensão mental e disposicional de φρονεῖν, sem reduzi-la apenas a concordância sobre um ponto específico.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação concisa e teologicamente aberta do grego, indicando que a unidade solicitada se situa na relação com o Senhor.
theological_decisions:
- issue: Natureza da unidade solicitada
  choice: terem o mesmo modo de pensar no Senhor
  alternative: entrarem em acordo no Senhor
  rationale: A tradução conserva a amplitude de φρονεῖν, que pode envolver pensamento, atitude e disposição, evitando limitar a exortação à resolução de uma divergência específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição retórica de “exorto” foi mantida para refletir a atenção pessoal e equilibrada dada a cada mulher.
