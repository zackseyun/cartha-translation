id: PHP.4.9
reference: Philippians 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: pt
  text: Tudo o que vocês também aprenderam, receberam, ouviram e viram em mim[a], ponham em prática[b]; e o Deus da paz estará com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Viram em mim” também pode ser expresso como “viram no meu exemplo” ou “viram na minha vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “façam essas coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Tudo o que
  rationale: O pronome relativo neutro plural introduz o conteúdo da exortação. “Tudo o que” soa natural em português e preserva a ideia coletiva retomada pela ordem seguinte.
- source_word: ἐμάθετε
  choice: aprenderam
  rationale: O aoristo aponta para aquilo que os filipenses aprenderam de Paulo; “aprenderam” é direto e natural.
- source_word: παρελάβετε
  choice: receberam
  rationale: O verbo pode se referir ao recebimento de ensino ou tradição. “Receberam” mantém essa amplitude sem acrescentar uma especificação ausente no texto.
- source_word: ἠκούσατε
  choice: ouviram
  rationale: Mantém de modo conciso o paralelismo da sequência verbal.
- source_word: εἴδετε ἐν ἐμοί
  choice: viram em mim
  rationale: Reproduz de perto a expressão grega e deixa aberta a referência ao que era observável na pessoa, conduta ou vida de Paulo.
- source_word: ταῦτα πράσσετε
  choice: ponham em prática
  rationale: O imperativo presente pede ação contínua ou habitual. “Ponham em prática” comunica isso com naturalidade em português.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: o Deus da paz
  rationale: Preserva a expressão paulina e o genitivo sem interpretá-lo explicitamente como “o Deus que dá paz”.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: estará com vocês
  rationale: É a tradução direta da promessa futura da presença de Deus; “vocês” é claro e de ampla compreensão, especialmente no português brasileiro.
theological_decisions:
- issue: Relação entre a obediência e a presença divina
  choice: Manter a exortação seguida da promessa, ligadas por “e”
  alternative: Transformar a frase numa construção condicional explícita, como “se fizerem isso, Deus estará com vocês”
  rationale: O grego coordena as orações com καί e não formula uma condição explícita. A tradução preserva a força pastoral e a tensão do texto sem impor uma relação mecanicista de causa e efeito.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A sequência dos quatro verbos foi preservada, e as expansões interpretativas ficaram nas notas.
