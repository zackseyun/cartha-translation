id: PHP.4.8
reference: Philippians 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: pt
  text: Quanto ao mais, irmãos[a], tudo o que é verdadeiro, tudo o que é digno, tudo o que é justo, tudo o que é puro, tudo o que é amável, tudo o que é de boa reputação — se há alguma virtude e se há algum louvor — pensem nessas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o termo grego traduzido por “irmãos” pode dirigir-se a toda a comunidade de fiéis.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Quanto ao mais
  rationale: Preserva o valor transitivo da expressão, que pode introduzir o que resta dizer, sem obrigá-la a significar que esta é a última exortação.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; no uso apostólico, ela pode dirigir-se à comunidade cristã inteira, como esclarece a nota.
- source_word: ὅσα
  choice: tudo o que
  rationale: Reproduz de modo natural em português a abrangência distributiva do relativo neutro plural e permite conservar a repetição retórica.
- source_word: ἀληθῆ
  choice: verdadeiro
  rationale: Expressa a categoria ampla do que corresponde à verdade, sem restringi-la apenas à fala veraz.
- source_word: σεμνά
  choice: digno
  rationale: Comunica respeitabilidade, seriedade moral e aquilo que merece honra em linguagem portuguesa corrente.
- source_word: δίκαια
  choice: justo
  rationale: No catálogo ético, designa o que é correto e conforme à justiça, sem acrescentar uma conotação teológica mais estreita.
- source_word: ἁγνά
  choice: puro
  rationale: Preserva tanto a dimensão moral quanto a de integridade interior do termo.
- source_word: προσφιλῆ
  choice: amável
  rationale: Designa aquilo que desperta amor ou afeição; é conciso e natural no contexto da lista.
- source_word: εὔφημα
  choice: de boa reputação
  rationale: Retém a relação do termo com aquilo de que se fala favoravelmente ou que é bem reputado, evitando sobreposição antecipada com 'louvor'.
- source_word: εἴ τις ἀρετὴ
  choice: se há alguma virtude
  rationale: Conserva a forma nominal compacta e o sentido de excelência moral, bem como a estrutura condicional do grego.
- source_word: εἴ τις ἔπαινος
  choice: se há algum louvor
  rationale: É o equivalente direto e mantém o paralelismo com a oração anterior.
- source_word: ταῦτα λογίζεσθε
  choice: pensem nessas coisas
  rationale: Transmite a ordem de dirigir atenção mental deliberada a essas qualidades em português claro e atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “tudo o que” preserva a cadência enfática do original. “Quanto ao mais” mantém a possível ambiguidade discursiva de Τὸ λοιπόν melhor do que uma conclusão estrita como “Finalmente”.
