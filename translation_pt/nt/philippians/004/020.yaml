  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: pt
  text: Ao nosso Deus e Pai seja a glória para todo o sempre[a]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «para os séculos dos séculos».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Partícula conectiva leve que introduz ou conclui a doxologia. Em português, a transição é natural sem acrescentar «agora» nem sugerir um contraste forte.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: ao nosso Deus e Pai
  rationale: Expressão unificada que se refere a uma só pessoa; «nosso» aplica-se naturalmente aos dois substantivos.
- source_word: ἡ δόξα
  choice: seja a glória
  rationale: A oração grega não tem verbo expresso. «Seja» reproduz de modo natural a força doxológica e evita transformar a fórmula inequivocamente numa simples declaração.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente idiomático, digno e amplamente compreensível para a expressão de duração ilimitada, cuja forma literal é preservada em nota.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a forma tradicional consagrada no uso cristão como afirmação solene.
theological_decisions:
- issue: Verbo subentendido na doxologia
  choice: seja a glória
  alternative: é a glória; pertence a glória
  rationale: Como o grego é uma oração nominal sem verbo expresso, «seja» conserva a função doxológica sem excluir que a glória já pertença a Deus.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e no âmbito lusófono mais amplo. A formulação conserva o tom litúrgico da doxologia sem arcaísmo excessivo.
