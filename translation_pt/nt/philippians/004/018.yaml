  source_fidelity: 'A tradução transmite bem a progressão do grego: Paulo confirma o recebimento integral, declara abundância e suficiência presente, identifica Epafrodito como portador imediato e os filipenses como origem da dádiva, e preserva a metáfora sacrificial. A troca de “depois de receber” por “tendo recebido” reflete com mais proximidade o particípio δεξάμενος, sem impor uma sequência temporal mais marcada do que o texto exige.'
