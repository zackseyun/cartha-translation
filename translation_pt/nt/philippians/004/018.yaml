source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: pt
  text: 'Mas recebi tudo[a] e tenho em abundância. Estou plenamente suprido, tendo recebido de Epafrodito o que veio de vocês: uma fragrância suave, um sacrifício aceitável e agradável a Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “tenho tudo por inteiro” ou “recebi o pagamento integral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: recebi
  rationale: No contexto do apoio material, o verbo pode indicar que Paulo recebeu integralmente o que lhe foi enviado. “Recebi” é natural e claro, enquanto a possível nuance de quitação plena fica registrada em nota.
- source_word: πάντα
  choice: tudo
  rationale: Reproduz de modo idiomático o alcance abrangente do acusativo neutro plural, referindo-se a tudo o que os filipenses enviaram.
- source_word: περισσεύω
  choice: tenho em abundância
  rationale: Expressa abundância além do necessário em português corrente, preservando o contraste retórico com a suficiência plena.
- source_word: πεπλήρωμαι
  choice: Estou plenamente suprido
  rationale: Comunica o estado presente resultante do presente recebido, preservando a força resultativa do perfeito e adequando-se ao contexto de sustento material.
- source_word: δεξάμενος
  choice: depois de receber
  rationale: Explicita de modo natural a circunstância pela qual Paulo passou a estar plenamente suprido, sem acrescentar uma relação causal indevida.
- source_word: παρὰ Ἐπαφροδίτου
  choice: de Epafrodito
  rationale: Identifica Epafrodito como a fonte humana imediata por meio da qual o presente chegou, enquanto a expressão seguinte preserva os filipenses como remetentes.
- source_word: τὰ παρ’ ὑμῶν
  choice: o que veio de vocês
  rationale: É uma formulação portuguesa natural que preserva a origem do presente nos destinatários sem especificar além do texto exatamente o que foi enviado.
- source_word: ὀσμὴν εὐωδίας
  choice: aroma agradável
  rationale: Preserva a imagem cultual veterotestamentária de uma oferta cujo aroma é favorável, em linguagem atual e digna.
- source_word: θυσίαν δεκτήν
  choice: sacrifício aceitável
  rationale: Mantém explicitamente a metáfora sacrificial e a ideia de que a oferta é recebida favoravelmente.
- source_word: εὐάρεστον τῷ θεῷ
  choice: agradável a Deus
  rationale: Expressa com clareza a avaliação divina positiva e mantém a sequência de imagens do original.
theological_decisions:
- issue: Imagem sacrificial aplicada ao apoio material dos filipenses
  choice: 'Manter a linguagem de culto: “aroma agradável, sacrifício aceitável e agradável a Deus”.'
  alternative: Reduzir a imagem a uma declaração geral de gratidão ou traduzir apenas como “uma oferta que Deus aceita com alegria”.
  rationale: Paulo deliberadamente descreve o presente mediante linguagem sacrificial. A tradução conserva aroma, sacrifício, aceitação e agrado divino, sem transformar a metáfora em afirmação técnica sobre sacrifício expiatório.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento “vocês” é natural para o plural. A redação mantém tom digno, imagens cultuais e a progressão enfática do grego, evitando arcaísmos e explicações doutrinárias inseridas no texto.
