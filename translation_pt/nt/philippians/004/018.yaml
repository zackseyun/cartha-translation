  terminology: “Epafrodito”, “sacrifício aceitável” e “agradável a Deus” são adequados. “Plenamente suprido” comunica bem o perfeito πεπλήρωμαι no contexto de sustento material. A nota conserva, de modo apropriado, a alternativa comercial possível para ἀπέχω.
