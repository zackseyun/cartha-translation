  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: pt
  text: Saúdem cada santo no Messias Jesus. Os irmãos que estão comigo mandam saudações a vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “irmãos” pode referir-se de modo mais amplo aos demais crentes que estavam com Paulo, inclusive mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Saúdem
  rationale: O imperativo epistolar pede que os destinatários transmitam uma saudação; “Saúdem” é direto, natural e mantém a força verbal do grego.
- source_word: πάντα ἅγιον
  choice: cada santo
  rationale: O singular com πᾶς tem sentido distributivo. “Cada santo” reproduz esse valor com clareza no português atual.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Χριστός funciona como título; “Messias” torna explícito esse valor, enquanto “no” preserva a construção relacional de ἐν.
- source_word: ἀσπάζονται ὑμᾶς
  choice: mandam saudações a vocês
  rationale: Na despedida de uma carta, esta formulação expressa naturalmente em português o ato de enviar saudações e representa com clareza o objeto plural ὑμᾶς.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Os irmãos que estão comigo
  rationale: Mantém o substantivo masculino plural do texto e explicita de modo natural a construção οἱ σὺν ἐμοί.
theological_decisions:
- issue: Valor de Χριστός em ἐν Χριστῷ Ἰησοῦ
  choice: Messias
  alternative: Cristo
  rationale: O termo grego preserva seu valor titular. “Messias” comunica esse sentido em português sem negar que “Cristo” seja a forma tradicional equivalente.
- issue: Alcance contextual de ἀδελφοί
  choice: irmãos no texto principal, com nota inclusiva
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma gramatical masculina do grego, enquanto a nota reconhece que o plural pode designar de maneira mais ampla os demais crentes que estavam com Paulo.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com concordância no plural (“Saúdem”, “vocês”). A formulação distingue os dois verbos de saudação de maneira natural: ordem direta na primeira oração e expressão epistolar na segunda.'
