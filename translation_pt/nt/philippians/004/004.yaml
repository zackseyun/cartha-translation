id: PHP.4.4
reference: Philippians 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: pt
  text: 'Alegrem-se sempre no Senhor[a]; mais uma vez direi: alegrem-se.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estejam sempre alegres no Senhor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Outra vez direi: alegrem-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Alegrem-se
  rationale: O presente imperativo ativo na segunda pessoa do plural é vertido por uma exortação direta e natural em português. “Alegrem-se” preserva o sentido de χαίρω e funciona bem no uso paulino.
- source_word: ἐν
  choice: 'no'
  rationale: A contração “no” traduz ἐν κυρίῳ de modo natural e preserva a ideia ampla de esfera ou relação, sem reduzi-la a causa ou meio.
- source_word: κυρίῳ
  choice: Senhor
  rationale: “Senhor” é a tradução portuguesa estabelecida de κύριος e, neste contexto paulino, refere-se a Cristo.
- source_word: πάντοτε
  choice: sempre
  rationale: “Sempre” comunica de maneira clara e concisa a força contínua do advérbio.
- source_word: πάλιν
  choice: Repito
  rationale: Em combinação com ἐρῶ, “Repito” expressa em português corrente que Paulo enuncia novamente a exortação, sem perder o valor enfático de πάλιν.
- source_word: ἐρῶ
  choice: Repito
  rationale: Embora a forma grega seja futuro (“direi”), a expressão idiomática portuguesa “Repito” comunica naturalmente o ato discursivo introduzido por πάλιν; a forma literal é preservada em nota.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: A repetição mantém a mesma tradução do primeiro imperativo, preservando a ênfase retórica.
theological_decisions:
- issue: Sentido de “no Senhor”
  choice: 'Preservar a leitura de esfera ou relação: a alegria ocorre em relação e união com o Senhor.'
  alternative: Entender a expressão como causa (“por causa do Senhor”) ou meio (“pelo poder do Senhor”).
  rationale: A formulação “no Senhor” mantém a amplitude teológica de ἐν κυρίῳ e evita resolver uma nuance que o grego deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural imperativo foi expresso por “alegrem-se”; “Repito” favorece a fluidez, enquanto a nota registra a forma futura literal do grego.
