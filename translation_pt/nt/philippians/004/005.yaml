  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: pt
  text: Que a amabilidade de vocês seja conhecida por todos.[a] O Senhor está perto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gentileza”, “tolerância” ou “moderação”.
    reason: lexical_alternative
  - marker: b
    text: “O Senhor está perto” pode significar que o Senhor está presente e próximo, que sua vinda está próxima, ou ambas as coisas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: amabilidade
  rationale: O termo descreve uma atitude atenciosa, tolerante e disposta a ceder, não apenas um temperamento brando. “Amabilidade” comunica essa qualidade relacional de modo natural em português, enquanto a nota preserva outras nuances possíveis.
- source_word: γνωσθήτω
  choice: seja conhecida
  rationale: Reproduz de modo claro e natural o imperativo aoristo passivo, apresentando essa qualidade como algo que deve se tornar reconhecível.
- source_word: πᾶσιν ἀνθρώποις
  choice: por todos
  rationale: Expressa de maneira inclusiva e idiomática a referência a todas as pessoas, sem introduzir especificação masculina desnecessária.
- source_word: κύριος
  choice: Senhor
  rationale: É a tradução portuguesa consagrada do título e preserva seu peso teológico.
- source_word: ἐγγύς
  choice: perto
  rationale: Preserva a ambiguidade do grego entre proximidade presente, proximidade da vinda do Senhor, ou ambas.
theological_decisions:
- issue: Sentido de ὁ κύριος ἐγγύς
  choice: O Senhor está perto
  alternative: O Senhor está próximo / O Senhor virá em breve
  rationale: A expressão grega admite tanto uma nuance espacial ou de presença quanto uma nuance temporal e escatológica. A formulação principal mantém essa tensão sem escolher apenas uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O uso de “vocês” torna explícito o plural de ὑμῶν sem regionalismo excessivo; “por todos” evita uma formulação marcada por gênero.
