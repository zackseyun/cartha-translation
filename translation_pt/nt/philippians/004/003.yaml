  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: pt
  text: Sim, peço também a você, verdadeiro companheiro[a], que ajude estas mulheres, pois elas lutaram ao meu lado no evangelho[b], juntamente com Clemente e meus demais cooperadores, cujos nomes estão no livro da vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «verdadeiro companheiro de jugo»; alguns entendem a palavra como nome próprio: «Sízigo».'
    reason: alternative_reading
  - marker: b
    text: Ou «se esforçaram comigo» ou «trabalharam lado a lado comigo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Sim
  rationale: Mantém a transição afirmativa e direta de Paulo.
- source_word: ἐρωτῶ
  choice: peço
  rationale: Expressa o sentido simples e pessoal do verbo sem intensificá-lo indevidamente como uma exortação.
- source_word: γνήσιε σύζυγε
  choice: fiel companheiro
  rationale: Entende σύζυγος como substantivo comum em vocativo, indicando um parceiro leal; a metáfora mais literal e a possível leitura como nome próprio são preservadas em nota.
- source_word: συλλαμβάνου αὐταῖς
  choice: ajude essas mulheres
  rationale: Comunica de modo natural o pedido de apoio ativo e explicita o referente feminino plural indicado pelo pronome grego.
- source_word: συνήθλησάν μοι
  choice: lutaram ao meu lado
  rationale: Preserva a imagem de esforço conjunto ou competição presente em συναθλέω, sem sugerir conflito contra Paulo.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: no evangelho
  rationale: Mantém a expressão grega condensada e sua amplitude sem decidir entre esfera, causa ou serviço.
- source_word: συνεργῶν
  choice: cooperadores
  rationale: Termo corrente e digno para pessoas que trabalham junto com Paulo.
- source_word: βίβλῳ ζωῆς
  choice: livro da vida
  rationale: Reproduz a expressão bíblica consagrada e claramente compreensível.
theological_decisions:
- issue: Interpretação de γνήσιε σύζυγε
  choice: Designação descritiva de um companheiro fiel não identificado
  alternative: Nome próprio, “Sízigo”, ou a metáfora mais literal “verdadeiro companheiro de jugo”
  rationale: A concordância do adjetivo no vocativo favorece uma designação descritiva, mas o uso como nome próprio e a força metafórica permanecem possibilidades legítimas, registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada levemente para fluidez, mantendo a estrutura e as ambiguidades relevantes do grego.
