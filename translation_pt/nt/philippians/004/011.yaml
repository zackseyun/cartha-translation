id: PHP.4.11
reference: Philippians 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: pt
  text: Não digo isso por estar passando necessidade, pois aprendi a estar contente em quaisquer circunstâncias em que me encontre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “autossuficiente”; o adjetivo grego pode indicar que alguém tem em si mesmo o suficiente, embora aqui “contente” expresse melhor o sentido no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: por estar passando necessidade
  rationale: A expressão indica que Paulo não fala motivado por carência ou falta pessoal. A formulação é natural em português e mantém essa relação causal.
- source_word: λέγω
  choice: digo
  rationale: O presente simples traduz naturalmente o presente grego e remete à declaração que Paulo acaba de fazer.
- source_word: ἔμαθον
  choice: aprendi
  rationale: O pretérito perfeito apresenta a aprendizagem como adquirida, com resultado vigente no momento da fala.
- source_word: ἐν οἷς εἰμι
  choice: em quaisquer circunstâncias em que me encontre
  rationale: A expressão relativa é idiomática e aponta para toda situação em que Paulo possa estar, não apenas para um lugar físico.
- source_word: αὐτάρκης
  choice: contente
  rationale: No contexto, comunica uma disposição aprendida de contentamento e suficiência em circunstâncias variadas, sem fazer da autonomia pessoal a ideia principal.
theological_decisions:
- issue: Possível nuance filosófica de αὐτάρκης
  choice: contente
  alternative: autossuficiente
  rationale: Embora o adjetivo possa expressar autossuficiência ou suficiência em si mesmo, o contexto descreve o contentamento aprendido por Paulo. A opção principal evita sugerir independência absoluta, enquanto a alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita literalismo rígido, preservando a negação inicial, a causalidade e a amplitude das circunstâncias mencionadas.
