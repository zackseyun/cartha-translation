lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz a explicação do que Paulo afirmou no contexto anterior e corresponde naturalmente ao valor causal da conjunção.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: mesmo quando eu estava em Tessalônica
  rationale: O primeiro καί tem valor enfático ('mesmo'); a formulação temporal explicita de modo natural em português que Paulo se encontrava em Tessalônica, sem mudar a referência locativa.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: mais de uma vez
  rationale: É a expressão idiomática portuguesa que transmite o sentido reiterativo da fórmula grega, literalmente 'uma e duas vezes'.
- source_word: εἰς τὴν χρείαν μοι
  choice: para suprir minha necessidade
  rationale: Preserva o singular χρεία e expressa naturalmente a finalidade ou destinação daquilo que foi enviado.
- source_word: ἐπέμψατε
  choice: vocês enviaram ajuda
  rationale: O verbo significa 'enviaram'; 'ajuda' torna explícito o objeto subentendido pelo contexto financeiro, sem especificar indevidamente sua forma.
