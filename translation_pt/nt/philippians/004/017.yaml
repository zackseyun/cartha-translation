  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: pt
  text: Não que eu procure a dádiva, mas procuro o fruto que aumenta para o crédito de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o fruto que se multiplica na conta de vocês”.'
    reason: Alternativa lexical que preserva mais literalmente tanto a ideia de abundância em πλεονάζοντα quanto a imagem contábil de λόγος.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: procuro
  rationale: Expressa busca ou desejo ativo e preserva a repetição contrastiva do verbo nas duas orações.
- source_word: δόμα
  choice: a oferta
  rationale: No contexto, refere-se ao que os filipenses enviaram a Paulo. “Oferta” é natural em português e evita acrescentar a ênfase de “em si”, ausente do grego.
- source_word: καρπὸν
  choice: o fruto
  rationale: Mantém a metáfora de resultado ou rendimento, sem reduzi-la a uma explicação abstrata.
- source_word: πλεονάζοντα
  choice: que aumenta
  rationale: Reproduz a ideia de crescimento ou abundância expressa pelo particípio presente.
- source_word: εἰς λόγον ὑμῶν
  choice: para o crédito de vocês
  rationale: Preserva a linguagem contábil do contexto e comunica que o fruto é lançado em favor dos filipenses.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Não que ... mas
  rationale: Conserva de modo natural a estrutura retórica de esclarecimento e contraste.
theological_decisions:
- issue: Relação entre o fruto e a conta dos filipenses
  choice: para o crédito de vocês
  alternative: em benefício de vocês
  rationale: A opção adotada preserva a metáfora comercial de λόγος e não define de maneira excessiva a natureza teológica da recompensa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vocês” oferece ampla inteligibilidade; a metáfora agrícola de “fruto” e a linguagem financeira de “crédito” foram mantidas em tensão, como no grego.
