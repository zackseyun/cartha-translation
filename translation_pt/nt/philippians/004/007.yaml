id: PHP.4.7
reference: Philippians 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: pt
  text: E a paz de Deus, que ultrapassa todo entendimento, guardará os corações e os pensamentos de vocês no Messias Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente natural e consagrado que preserva a ideia de bem-estar e integridade sem explicitar além do grego.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém diretamente o genitivo grego, sem restringi-lo à ideia de origem.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: que ultrapassa todo entendimento
  rationale: Expressa de modo idiomático que essa paz excede a capacidade de compreensão, preservando a amplitude de πάντα.
- source_word: φρουρήσει
  choice: guardará
  rationale: Conserva a imagem forte de vigilância protetora presente no verbo, inclusive sua possível ressonância militar.
- source_word: τὰς καρδίας ὑμῶν
  choice: o coração ... de vocês
  rationale: O singular coletivo é mais natural em português neste paralelismo e mantém coração como centro da vida interior; 'de vocês' comunica claramente a segunda pessoa do plural.
- source_word: τὰ νοήματα ὑμῶν
  choice: os pensamentos de vocês
  rationale: νοήματα designa pensamentos, percepções ou processos mentais; 'pensamentos' é mais lexicalmente preciso aqui do que repetir a ideia de entendimento ou empregar 'mentes'.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título e preserva a fórmula paulina que situa a proteção na união ou esfera do Messias Jesus.
theological_decisions:
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: em Cristo Jesus
  rationale: A formulação mantém a força titular de Χριστός e deixa intacta a densidade relacional e locativa de ἐν, sem reduzi-la a mero meio ou instrumento.
- issue: Relação entre a paz de Deus e a compreensão humana
  choice: que ultrapassa todo entendimento
  alternative: que é superior a toda mente
  rationale: A tradução preserva a afirmação de transcendência cognitiva sem definir se se trata apenas do entendimento humano nem afirmar que a paz seja irracional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem e o encadeamento do grego são preservados onde soam naturais. Usa-se 'vocês' para o plural de ὑμῶν; o singular coletivo 'o coração' evita uma construção pouco idiomática, enquanto 'os pensamentos' preserva a pluralidade de νοήματα.
