  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: pt
  text: 'Sei estar em condição humilde e sei ter em abundância. Em toda situação e em todas as coisas, aprendi o segredo[a]: tanto estar bem alimentado como passar fome, tanto ter em abundância como passar necessidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «fui iniciado». Paulo emprega metaforicamente a linguagem de iniciação para falar de aprender um segredo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: sei
  rationale: Com os infinitivos seguintes, expressa conhecimento prático adquirido pela experiência; a construção portuguesa com «sei» e infinitivo comunica naturalmente «sei como».
- source_word: ταπεινοῦσθαι
  choice: viver em condição humilde
  rationale: Preserva a ideia de encontrar-se em circunstâncias rebaixadas ou modestas, sem reduzir o termo a uma atitude interior nem sugerir necessariamente humilhação pública.
- source_word: περισσεύειν
  choice: ter em abundância
  rationale: Comunica possuir mais do que o necessário e mantém a amplitude do verbo, sem limitá-lo à prosperidade financeira.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: em cada situação e em todas as circunstâncias
  rationale: Mantém distintos os dois elementos enfáticos da expressão grega e produz uma formulação clara em português.
- source_word: μεμύημαι
  choice: aprendi o segredo
  rationale: 'Transmite de modo natural o uso metafórico da linguagem de iniciação: Paulo adquiriu o conhecimento de como viver sob condições diversas. A imagem literal é preservada em nota.'
- source_word: χορτάζεσθαι
  choice: estar bem alimentado
  rationale: No contraste direto com passar fome, explicita adequadamente a referência à saciedade alimentar.
- source_word: πεινᾶν
  choice: passar fome
  rationale: Expressão corrente e clara para experimentar fome, formando contraste natural com estar bem alimentado.
- source_word: ὑστερεῖσθαι
  choice: passar necessidade
  rationale: Comunica privação de modo amplo e idiomático, sem restringi-la à falta de dinheiro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «tanto... como...» preserva o paralelismo do original, e «ter em abundância» é repetido para refletir a recorrência de περισσεύειν.
