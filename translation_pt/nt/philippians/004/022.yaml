reference: Philippians 4:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: pt
  text: Todos os santos enviam saudações a vocês, especialmente os da casa de César.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, pessoas ligadas à casa imperial, não necessariamente membros da família de César.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: enviam saudações
  rationale: No contexto epistolar, a expressão comunica com naturalidade em português que terceiros saúdam os destinatários, sem acrescentar intensidade ausente do grego.
- source_word: πάντες οἱ ἅγιοι
  choice: Todos os santos
  rationale: Mantém a designação paulina tradicional para os cristãos e evita substituí-la por uma paráfrase interpretativa como “povo de Deus”.
- source_word: μάλιστα δὲ
  choice: especialmente
  rationale: Expressa a ênfase dada a um grupo dentro do conjunto; o valor conectivo de δέ é absorvido de modo idiomático.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: os da casa de César
  rationale: Formulação concisa e natural que preserva a associação com a casa imperial sem afirmar que se tratava de parentes de César.
- source_word: Καίσαρος
  choice: César
  rationale: Conserva o título/nome histórico empregado no grego, em vez de substituí-lo pela interpretação “imperador”.
theological_decisions:
- issue: Sentido de “santos” no uso paulino
  choice: Manter “santos” como designação dos cristãos.
  alternative: “povo de Deus” ou “crentes”
  rationale: O termo não indica aqui uma classe restrita de cristãos excepcionalmente santos. A tradução lexical preserva a linguagem de Paulo sem resolver seu conteúdo teológico por paráfrase.
- issue: Identidade dos membros da “casa de César”
  choice: Preservar a referência ampla a pessoas ligadas à casa imperial.
  alternative: Entender a expressão especificamente como familiares de César.
  rationale: A construção grega pode abranger escravizados, libertos, empregados e oficiais associados ao serviço imperial; não exige parentesco familiar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Enviam saudações a vocês” soa natural em contexto epistolar; “casa de César” preserva a formulação histórica e sua amplitude.
