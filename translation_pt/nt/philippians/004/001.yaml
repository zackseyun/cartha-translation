id: PHP.4.1
reference: Philippians 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: pt
  text: Portanto, meus amados irmãos[a], por quem anseio, minha alegria e minha coroa[b], permaneçam assim firmes no Senhor, amados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz a forma masculina do grego; neste contexto, Paulo se dirige aos fiéis da congregação, não apenas aos homens.
    reason: cultural_note
  - marker: b
    text: Ou “coroa de vitória”; o termo grego refere-se à grinalda concedida ao vencedor de uma competição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Marca com naturalidade a conclusão inferencial ligada ao argumento anterior.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Reproduz a forma vocativa masculina do grego; a nota esclarece que, no contexto, Paulo se dirige à congregação inteira.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o tom afetuoso e a linguagem de amor cristão. A repetição nas duas ocorrências foi mantida para refletir a ênfase de Paulo.
- source_word: ἐπιπόθητοι
  choice: por quem anseio
  rationale: Expressa de modo idiomático em português o forte desejo afetivo indicado pelo adjetivo grego.
- source_word: χαρά
  choice: alegria
  rationale: Equivalente direto e natural, preservando a afirmação de que os próprios filipenses são a alegria de Paulo.
- source_word: στέφανος
  choice: coroa
  rationale: É a forma portuguesa mais reconhecível; a nota registra que o termo pode designar especificamente a coroa de vitória concedida ao vencedor.
- source_word: οὕτως
  choice: assim
  rationale: Mantém a força adverbial sem definir além do texto a extensão exata de sua referência.
- source_word: στήκετε
  choice: permaneçam firmes
  rationale: Comunica claramente a ordem de perseverar com firmeza.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a fórmula paulina locativa e relacional sem explicá-la de maneira excessiva.
theological_decisions:
- issue: Alcance representativo de ἀδελφοί
  choice: O texto principal traz “irmãos”, com uma nota explicando que Paulo se dirige aos fiéis da congregação, e não apenas aos homens.
  alternative: “irmãos e irmãs” ou “irmandade”
  rationale: A opção conserva a forma masculina do vocativo grego e, ao mesmo tempo, torna explícito em nota seu alcance congregacional inclusivo.
- issue: Sentido de ἐν κυρίῳ
  choice: “no Senhor”
  alternative: “em união com o Senhor”
  rationale: A formulação tradicional e natural preserva a amplitude relacional da expressão paulina sem impor uma única explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português, preservando a repetição enfática de “amados” e a ambiguidade concisa de “assim”.
