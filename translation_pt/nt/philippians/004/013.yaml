review_pass:
  verdict: revise
  source_fidelity: A formulação «enfrentar qualquer situação» reflete bem o contexto imediato (4:11–12), mas restringe no texto principal a abrangência de πάντα («todas as coisas»). O grego não explicita «situação» nem o verbo «enfrentar». «Por meio daquele que me fortalece» transmite adequadamente a relação de capacitação, e «daquele que me fortalece» preserva corretamente o particípio substantivado sem inserir «Cristo».
  naturalness: O texto é claro e natural, mas «Sou capaz de enfrentar qualquer situação» é uma paráfrase contextual. «Sou capaz de fazer todas as coisas por meio daquele que me fortalece» é português moderno e conserva melhor a amplitude e a estrutura sem recorrer à formulação tradicional potencialmente menos transparente.
  terminology: «Aquele que me fortalece» é fiel e teologicamente não intrusivo. A nota sobre Cristo deve permanecer, pois o referente é fortemente sugerido pelo contexto, mas não é nomeado no versículo. A nota lexical deve apresentar «todas as coisas» como alternativa formal e explicar o direcionamento contextual sem substituir o sentido textual.
  issues:
