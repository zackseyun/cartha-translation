    issue: Restrição de πάντα a «qualquer situação» no texto principal.
    rationale: 'Embora as circunstâncias sejam decisivas no contexto, πάντα é literalmente e semanticamente mais amplo: «todas as coisas». A explicitação contextual é mais apropriada em nota do que como substituição no texto.'
  - severity: low
    issue: Inserção interpretativa de «enfrentar».
    rationale: ἰσχύω comunica capacidade/força, mas não contém especificamente a noção de enfrentar. «Ser capaz de fazer» preserva a construção de modo mais direto.
