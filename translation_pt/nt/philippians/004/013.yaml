  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: pt
  text: Sou capaz de fazer todas as coisas por meio daquele que me fortalece[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho força para todas as coisas”. No contexto, a expressão se refere à capacidade de Paulo em toda espécie de circunstância.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz “daquele que me fortalece” e não menciona explicitamente Cristo neste versículo, embora o contexto aponte para ele.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: qualquer situação
  rationale: Embora o grego seja literalmente abrangente, o contexto imediato trata de viver em toda espécie de circunstância — fartura ou necessidade. A formulação preserva essa abrangência contextual sem sugerir capacidade ilimitada para qualquer feito imaginável.
- source_word: ἰσχύω
  choice: sou capaz de enfrentar
  rationale: O verbo expressa força ou capacidade. Em combinação com πάντα e no contexto, esta tradução comunica suficiência para atravessar as diversas situações mencionadas, em português natural.
- source_word: ἐν
  choice: por meio de
  rationale: Aqui a preposição introduz aquele em quem ou por cuja ação Paulo recebe força. “Por meio de” expressa adequadamente essa relação instrumental, embora “em” seja formalmente possível.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: daquele que me fortalece
  rationale: O particípio substantivado designa “aquele que me fortalece” e conserva a ação verbal contínua, sem inserir no texto principal um nome que não aparece neste versículo.
theological_decisions:
- issue: Referente implícito de “daquele que me fortalece”
  choice: Manter a expressão substantivada sem acrescentar “Cristo” no texto principal.
  alternative: “por meio de Cristo, que me fortalece”
  rationale: O contexto aponta para Cristo como referente, mas o texto grego deste versículo não o nomeia explicitamente. A tradução conserva essa distinção entre o que está expresso e o que é inferido pelo contexto.
- issue: Alcance de πάντα
  choice: Expressar a capacidade de Paulo em toda espécie de situação.
  alternative: “Posso fazer todas as coisas”
  rationale: O contexto de fartura, fome, abundância e necessidade orienta a frase para perseverança em quaisquer circunstâncias, e não para uma promessa irrestrita de realizar todo e qualquer feito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Enfrentar qualquer situação” explicita de modo natural a força contextual da construção, enquanto as notas preservam a forma mais ampla e a ambiguidade lexical do grego.
