source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: pt
  text: Alegrei-me muito no Senhor porque agora, finalmente, vocês renovaram seu cuidado por mim[a]. De fato, vocês se preocupavam comigo[b], mas lhes faltava oportunidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fizeram seu cuidado por mim reviver”; literalmente, “voltaram a florescer” em seu cuidado por mim.
    reason: lexical_alternative
  - marker: b
    text: Ou “pensavam em mim” ou “se importavam comigo”. O verbo grego pode indicar pensar em alguém, ter determinada disposição para com essa pessoa ou cuidar dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Alegrei-me
  rationale: Expressa diretamente o aoristo de χαίρω e preserva a resposta pessoal e intensa de Paulo.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a expressão paulina que situa a alegria em relação ao Senhor, sem decidir se a nuance principal é esfera, fundamento ou causa.
- source_word: μεγάλως
  choice: muito
  rationale: Forma natural em português para intensificar o verbo sem tornar a frase rebuscada.
- source_word: ἤδη ποτὲ
  choice: agora, finalmente
  rationale: Comunica que, depois de certo intervalo, o cuidado dos filipenses voltou a manifestar-se, sem necessariamente atribuir-lhes culpa pela demora.
- source_word: ἀνεθάλετε
  choice: renovaram
  rationale: Transmite no texto principal a ideia contextual de algo que tornou a surgir; a imagem literal de voltar a florescer é preservada em nota.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: seu cuidado por mim
  rationale: φρονέω indica aqui uma disposição atenta em favor de Paulo, mais ampla que mero pensamento e sem exigir que a ação prática já tivesse ocorrido.
- source_word: ἐφ’ ᾧ
  choice: De fato
  rationale: 'Introduz naturalmente a explicação corretiva de Paulo: o cuidado não havia desaparecido, embora faltasse ocasião para demonstrá-lo.'
- source_word: ἐφρονεῖτε
  choice: já tinham esse cuidado
  rationale: Mantém a ligação lexical com a expressão anterior e afirma a continuidade da disposição dos filipenses.
- source_word: ἠκαιρεῖσθε
  choice: lhes faltava oportunidade
  rationale: Indica ausência de ocasião adequada, não falta de vontade ou cuidado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” adequado à leitura brasileira. A redação conserva a metáfora de ἀνεθάλετε em nota e evita que “finalmente” soe como censura, esclarecendo em seguida que o impedimento foi a falta de oportunidade.
