id: PHP.1.28
reference: Philippians 1:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: pt
  text: sem se deixarem intimidar em nada pelos que se opõem a vocês[a]. Isso é, para eles, sinal da destruição[b], mas, para vocês, da salvação — e isso vem de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem se deixarem alarmar” ou “amedrontar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “evidência” ou “indício” da destruição.
    reason: lexical_alternative
  - marker: c
    text: A expressão “isso vem de Deus” pode referir-se especificamente à salvação ou, de modo mais amplo, a todo o sinal descrito anteriormente.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: sem se deixarem intimidar
  rationale: O verbo exprime ser amedrontado, alarmado ou intimidado. A forma pronominal comunica naturalmente em português a recusa de ceder à intimidação, sem apagar a pressão exercida pelos adversários.
- source_word: ἐν μηδενί
  choice: em nada
  rationale: 'Mantém de perto o alcance total da expressão grega e é claro no contexto: em nenhum aspecto ou circunstância.'
- source_word: ἀντικειμένων
  choice: pelos que se opõem a vocês
  rationale: O particípio substantivado designa pessoas que se colocam contra os destinatários; a formulação explicita essa relação com naturalidade.
- source_word: ἔνδειξις
  choice: sinal
  rationale: A palavra indica evidência ou indício. “Sinal” é conciso e acessível, preservando o caráter indicativo sem elevar o sentido necessariamente a uma prova conclusiva.
- source_word: ἀπωλείας
  choice: destruição
  rationale: Preserva o sentido de ruína ou perdição, inclusive sua possível dimensão judicial, sem acrescentar uma precisão não expressa pelo termo grego.
- source_word: σωτηρίας
  choice: salvação
  rationale: Conserva o peso soteriológico usual do termo no contexto paulino e o contraste direto com “destruição”.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: e isso vem de Deus
  rationale: A expressão é idiomática em português, mantém o demonstrativo e não determina de modo indevido se “isso” retoma apenas a salvação ou toda a realidade anteriormente descrita.
theological_decisions:
- issue: Referente de τοῦτο (“isso”)
  choice: 'O texto principal conserva o referente amplo ou indeterminado: “e isso vem de Deus”.'
  alternative: “Isso” pode referir-se especificamente à salvação de vocês ou, mais amplamente, ao sinal constituído pela firmeza dos fiéis e pelos destinos contrastantes.
  rationale: A sintaxe grega não obriga uma única delimitação do antecedente; por isso, a tradução preserva a ambiguidade teológica genuína em vez de resolvê-la.
- issue: Dativos αὐτοῖς e ὑμῶν no contraste
  choice: “para eles” e “para vocês”
  alternative: 'Entender o primeiro dativo apenas como avaliação subjetiva: “aos olhos deles”.'
  rationale: A construção estabelece o contraste entre o que o sinal indica quanto aos opositores e quanto aos fiéis. A formulação escolhida preserva essa estrutura sem afirmar que os adversários necessariamente reconhecem o significado do sinal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural dos destinatários. A ordem e a pontuação preservam o contraste entre “eles” e “vocês”; os travessões destacam a cláusula final sem resolver o referente de “isso”.
