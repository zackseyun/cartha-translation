id: PHP.1.13
reference: Philippians 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: pt
  text: de modo que as minhas correntes por causa do Messias[a] se tornaram conhecidas por toda a guarda imperial[b] e por todos os demais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as minhas correntes no Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “por todo o pretório”; o termo pode se referir à guarda imperial ou à sede ou residência imperial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado do que foi dito anteriormente e conserva com naturalidade a força consecutiva.
- source_word: τοὺς δεσμούς μου
  choice: as minhas correntes
  rationale: Mantém a imagem concreta de correntes ou grilhões, usada metonimicamente para a prisão de Paulo.
- source_word: φανεροὺς ... γενέσθαι
  choice: se tornaram conhecidas
  rationale: 'Reproduz o sentido resultativo da construção: a natureza das correntes de Paulo passou a ser publicamente conhecida.'
- source_word: ἐν Χριστῷ
  choice: por causa do Messias
  rationale: No contexto, comunica de modo natural que a prisão de Paulo se devia à sua ligação e lealdade ao Messias; a formulação mais literal e teologicamente aberta é preservada em nota.
- source_word: Χριστῷ
  choice: Messias
  rationale: Preserva o valor de Χριστός como título messiânico, e não apenas como nome próprio.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: por toda a guarda imperial
  rationale: Expressa o referente contextual mais provável de πραιτώριον, sem ocultar em nota sua possível referência a um local ou estabelecimento oficial.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: por todos os demais
  rationale: Conserva tanto a abrangência de πᾶσιν quanto a ideia de um grupo adicional expressa por λοιποῖς.
theological_decisions:
- issue: Sentido de ἐν Χριστῷ em relação às correntes de Paulo
  choice: por causa do Messias
  alternative: no Messias
  rationale: O contexto favorece a identificação pública do motivo da prisão, mas a expressão grega também pode destacar a esfera da união com o Messias. A leitura principal é idiomática, e a alternativa preserva a tensão teológica genuína.
- issue: Valor titular de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A tradução explicita o significado do título grego sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A imagem concreta de “correntes” foi mantida; as ambiguidades de ἐν Χριστῷ e πραιτώριον foram preservadas por meio de notas.
