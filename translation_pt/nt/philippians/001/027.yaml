id: PHP.1.27
reference: Philippians 1:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: pt
  text: Apenas vivam[a] de maneira digna do evangelho do Messias[b], para que, quer eu vá e os veja, quer esteja ausente, eu ouça a respeito de vocês que permanecem firmes em um só espírito[c], lutando juntos, com uma só alma[d], pela fé do evangelho[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo grego também pode ser traduzido por “comportem-se” e tem conotações cívicas: literalmente, pode sugerir “vivam como cidadãos”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “do Cristo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em um só Espírito”, com possível referência ao Espírito Santo.
    reason: alternative_reading
  - marker: d
    text: Ou “com um só propósito” ou “com uma só mente”.
    reason: lexical_alternative
  - marker: e
    text: Ou “lutando lado a lado pela fé no evangelho”.
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Apenas
  rationale: Preserva a ênfase inicial e apresenta esta exortação como a preocupação central de Paulo, sem acrescentar uma formulação explicativa.
- source_word: ἀξίως
  choice: de maneira digna
  rationale: Expressa naturalmente em português o modo de viver exigido pelo advérbio grego.
- source_word: πολιτεύεσθε
  choice: vivam
  rationale: É uma formulação clara e natural; a nota registra as conotações cívicas do verbo, especialmente relevantes em Filipos.
- source_word: εὐαγγελίου
  choice: evangelho
  rationale: Termo corrente e reconhecível no uso cristão em português, adequado ao vocabulário paulino.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Mantém o valor titular de Χριστός nesta construção genitiva; a forma tradicional “Cristo” é indicada em nota.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: eu ouça a respeito de vocês
  rationale: Reproduz de modo natural a expressão grega sem transformar “ouvir” em um verbo mais genérico.
- source_word: στήκετε
  choice: permanecem firmes
  rationale: Comunica a ideia de constância e resistência expressa pelo verbo.
- source_word: ἐν ἑνὶ πνεύματι
  choice: em um só espírito
  rationale: A minúscula favorece a referência à unidade comunitária em paralelo com “uma só alma”, sem eliminar a possível referência ao Espírito Santo, registrada em nota.
- source_word: μιᾷ ψυχῇ
  choice: com uma só alma
  rationale: Conserva a imagem concreta de ψυχή e a ênfase na unidade profunda dos cristãos.
- source_word: συναθλοῦντες
  choice: lutando juntos
  rationale: Preserva tanto a ação conjunta quanto a imagem de esforço ou combate contida no verbo.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: pela fé do evangelho
  rationale: Mantém a construção genitiva deliberadamente aberta, sem decidir no texto principal entre a fé associada ao evangelho e a fé depositada nele.
theological_decisions:
- issue: Se πνεύματι designa o Espírito Santo ou o espírito/disposição comum dos cristãos
  choice: em um só espírito
  alternative: em um só Espírito
  rationale: O paralelismo imediato com “com uma só alma” favorece a unidade de disposição entre os cristãos, mas a possível referência ao Espírito Santo permanece explicitamente aberta na nota.
- issue: Sentido do genitivo em τῇ πίστει τοῦ εὐαγγελίου
  choice: pela fé do evangelho
  alternative: pela fé no evangelho
  rationale: A formulação principal conserva a ambiguidade da relação genitiva, enquanto a nota apresenta a interpretação objetiva possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “vocês” torna explícito o plural já presente nas formas gregas. As notas preservam as conotações cívicas de πολιτεύεσθε e as ambiguidades de πνεύματι e da construção genitiva final.
