source:
  edition: SBLGNT
  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: pt
  text: para que, por meio da minha ida novamente até vocês, aumente o motivo de vocês se gloriarem no Messias Jesus por minha causa.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a glória de vocês no Messias Jesus aumente”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em mim”; aqui, a expressão pode significar “por minha causa” ou “por causa de mim”.
    reason: lexical_alternative
  - marker: c
    text: “Messias Jesus” também pode ser traduzido por “Cristo Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado esperado da permanência e futura visita de Paulo.
- source_word: τὸ καύχημα ὑμῶν
  choice: o motivo que vocês têm para se gloriar
  rationale: καύχημα pode indicar tanto a exultação quanto aquilo que lhe dá ocasião. A formulação explicita o provável sentido de fundamento ou motivo, sem transformar essa interpretação em certeza absoluta; a alternativa mais formal consta em nota.
- source_word: περισσεύῃ
  choice: aumente
  rationale: Expressa de modo corrente a ideia de tornar-se abundante ou crescer, mantendo a força do subjuntivo dependente de ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Preserva Χριστός como título traduzido, e a preposição em português associa o gloriar-se ao Messias Jesus.
- source_word: ἐν ἐμοὶ
  choice: por minha causa
  rationale: Transmite o valor de ocasião ou fundamento ligado a Paulo. O sentido formal “em mim” é preservado em nota devido à repetição deliberada de ἐν no grego.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: por meio da minha volta à presença de vocês
  rationale: διά com genitivo marca o meio; παρουσία pode significar presença ou chegada. Como πάλιν πρὸς ὑμᾶς aponta para uma visita renovada, “volta à presença de vocês” comunica ambos os aspectos.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: minha volta à presença de vocês
  rationale: Integra πάλιν e πρὸς ὑμᾶς em uma expressão portuguesa natural que indica o retorno pessoal de Paulo à comunidade.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Χριστός conserva aqui seu valor titular; “Messias” traduz o título em vez de apenas reproduzir sua forma tradicional.
- issue: Relação sintática de ἐν Χριστῷ Ἰησοῦ
  choice: ligado ao ato ou motivo de gloriar-se
  alternative: ligado ao verbo “aumentar”
  rationale: A expressão paulina “gloriar-se no Messias” favorece a primeira relação, embora a ordem grega permita alguma fluidez sintática.
- issue: Sentido de καύχημα
  choice: motivo para se gloriar
  alternative: glória ou exultação
  rationale: O contexto favorece a ocasião ou fundamento de exultação que a visita de Paulo ampliaria, mas a amplitude lexical é mantida em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “vocês”. A ordem foi levemente ajustada para evitar uma sequência pesada de complementos e tornar claras as relações entre o motivo de gloriar-se, Paulo e sua visita, sem eliminar as ambiguidades lexicais relevantes.
