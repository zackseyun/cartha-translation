  naturalness: A frase atual é compreensível, mas a intercalação «aumente, por minha causa, o motivo que vocês têm» é pesada. A ordem revisada torna explícita a relação entre a ida de Paulo e o aumento do motivo de glória, preservando o registro moderno e o uso internacionalmente compreensível de «vocês».
  terminology: «Messias Jesus» preserva corretamente o valor titular de Χριστός. «Gloriar-se» é apropriado ao registro paulino. «Motivo de vocês se gloriarem» é mais conciso e natural do que «o motivo que vocês têm para se gloriar», sem reduzir o alcance de καύχημα.
