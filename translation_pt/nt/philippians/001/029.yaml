id: PHP.1.29
reference: Philippians 1:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: pt
  text: Pois, por causa do Messias[a], foi-lhes concedido por graça não somente crer nele[b], mas também sofrer por ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de Cristo”. O grego Χριστός é um título que significa “Messias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confiar nele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sofrer por causa dele” ou “em favor dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação da postura destemida mencionada no versículo anterior e funciona naturalmente no discurso em português.
- source_word: ἐχαρίσθη
  choice: foi-lhes concedido por graça
  rationale: Preserva tanto a ideia de concessão quanto a nuance de dádiva graciosa presente em χαρίζομαι, sem reduzir o verbo a mera permissão.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: por causa do Messias
  rationale: Apresenta o Messias como a razão ou referência abrangente da dádiva expressa nos dois infinitivos seguintes. 'Messias' conserva Χριστός como título.
- source_word: πιστεύειν εἰς αὐτόν
  choice: crer nele
  rationale: É uma expressão portuguesa natural para depositar fé em uma pessoa e corresponde diretamente à construção grega.
- source_word: πάσχειν
  choice: sofrer
  rationale: Tradução direta e transparente do infinitivo, sem suavizar sua força.
- source_word: ὑπὲρ αὐτοῦ
  choice: por ele
  rationale: Comunica de modo conciso que o sofrimento ocorre por causa dele ou em favor dele, deixando a alternativa mais explícita em nota.
theological_decisions:
- issue: Se a afirmação de que tanto crer quanto sofrer são concedidos por graça deve ser suavizada
  choice: Manter a linguagem explícita de concessão graciosa abrangendo tanto o crer quanto o sofrer
  alternative: Traduzir como mera permissão ou reestruturar a frase de modo a obscurecer que os dois infinitivos dependem de ἐχαρίσθη
  rationale: A sintaxe grega põe tanto πιστεύειν quanto πάσχειν sob o alcance de ἐχαρίσθη. A tradução conserva essa tensão teológica sem explicá-la segundo uma doutrina particular.
- issue: Relação de τὸ ὑπὲρ Χριστοῦ com os infinitivos seguintes
  choice: 'Entender a expressão como uma rubrica abrangente ligada à dádiva inteira: crer nele e sofrer por ele'
  alternative: Ligar 'por causa do Messias' apenas ao verbo 'conceder' ou somente a um dos infinitivos
  rationale: O artigo τὸ substantiva a expressão e os infinitivos epexegéticos especificam o conteúdo concedido; a formulação portuguesa mantém seu alcance amplo sem reproduzir mecanicamente a estrutura grega.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'foi-lhes concedido por graça' mantém a nuance de dádiva sem soar excessivamente técnica. A pontuação encerra o versículo como frase completa, apesar do parêntese no recorte grego fornecido.
