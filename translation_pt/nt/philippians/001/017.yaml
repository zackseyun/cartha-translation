  source_fidelity: A tradução preserva adequadamente os contrastes, a motivação egoísta, a falta de pureza de motivos e a intenção expressa pelo particípio. No entanto, “em minhas prisões” soa como se Paulo se referisse a múltiplos encarceramentos, enquanto τοῖς δεσμοῖς μου designa suas cadeias/vínculos, isto é, sua condição atual de prisioneiro. Uma formulação que diga explicitamente que ele está preso transmite o sentido sem introduzir esse plural indevido.
  naturalness: “Mas os outros proclamam o Messias por ambição egoísta, sem sinceridade” é natural e mantém registro digno. “Enquanto estou preso” é mais idiomático e claro do que “em minhas prisões”.
  terminology: “Messias”, “proclamam”, “ambição egoísta”, “sem sinceridade” e “aflição” são escolhas apropriadas. A nota deve explicar a imagem literal das cadeias sem tratar “prisões” como plural de encarceramentos.
