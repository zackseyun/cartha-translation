reference: Philippians 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: pt
  text: Mas os outros proclamam o Messias por ambição egoísta, sem sinceridade, pensando causar-me aflição enquanto estou preso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em/para minhas cadeias”. A expressão refere-se à prisão de Paulo; a construção pode indicar aflição ligada à sua condição de prisioneiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: ambição egoísta
  rationale: Expressa a busca interesseira e rival por vantagem pessoal ou partidária, em contraste com uma motivação sincera.
- source_word: Χριστόν
  choice: o Messias
  rationale: Neste contexto, o termo destaca a identidade messiânica daquele que é proclamado, conservando sua função de título.
- source_word: καταγγέλλουσιν
  choice: proclamam
  rationale: Preserva a ideia de anúncio público sem restringi-la à pregação formal.
- source_word: οὐχ ἁγνῶς
  choice: sem sinceridade
  rationale: Comunica de modo natural a falta de pureza nas motivações, e não a falsidade do conteúdo proclamado.
- source_word: οἰόμενοι
  choice: pensando
  rationale: Reproduz naturalmente o particípio e mantém aberta a nuance de intenção ou expectativa.
- source_word: θλῖψιν ἐγείρειν
  choice: causar aflição
  rationale: Mantém o peso de θλῖψις e traduz de maneira idiomática a expressão literalmente associada a levantar ou suscitar aflição.
- source_word: τοῖς δεσμοῖς μου
  choice: em minhas prisões
  rationale: Conserva a imagem concreta dos grilhões de Paulo, usando um termo português corrente no plural para as amarras do prisioneiro.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: o Cristo
  rationale: Como o termo designa aqui o conteúdo da proclamação e funciona de modo titular, “o Messias” torna explícito seu sentido semântico.
- issue: Relação da aflição com os grilhões
  choice: causar aflição em minhas prisões
  alternative: aumentar a aflição de meu aprisionamento
  rationale: A construção grega liga a aflição aos δεσμοί de Paulo, mas sua relação exata admite alguma tensão; a formulação escolhida evita especificar indevidamente se os rivais pretendiam agravar as condições objetivas ou a angústia pessoal dele.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Prisões” conserva a imagem concreta de δεσμοί sem recorrer ao menos corrente “grilhões” no texto principal; a nota registra a construção mais literal e sua ambiguidade.
