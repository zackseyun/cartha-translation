  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: pt
  text: Graça e paz a vocês, da parte de Deus, nosso Pai, e do Senhor[a] Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou Mestre.
    reason: lexical_alternative
  - marker: b
    text: Ou Cristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: “Graça” é o equivalente consagrado e natural, preservando tanto o sentido relacional quanto o peso teológico do termo paulino.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo indica os destinatários da saudação. “A vocês” é claro e amplamente compreensível no português moderno.
- source_word: εἰρήνη
  choice: paz
  rationale: “Paz” reproduz diretamente o termo grego e mantém as ressonâncias gregas e judaicas da fórmula de saudação.
- source_word: ἀπό
  choice: da parte de
  rationale: Nesta fórmula epistolar, “da parte de” expressa a origem da graça e da paz com mais naturalidade em português do que o simples “de”.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Deus, nosso Pai
  rationale: A aposição identifica Deus como nosso Pai; as vírgulas tornam essa relação clara e natural em português.
- source_word: κυρίου
  choice: Senhor
  rationale: “Senhor” preserva o uso cristológico estabelecido de κύριος, sem apagar a alternativa lexical “Mestre”.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui um sentido titular reconhecível. “O Messias” traduz o significado do termo de modo transparente, enquanto “Cristo” permanece registrado em nota como alternativa tradicional.
theological_decisions:
- issue: Sentido de Χριστοῦ na fórmula de saudação paulina
  choice: o Messias
  alternative: Cristo
  rationale: Embora “Cristo” possa funcionar quase como nome próprio nas cartas paulinas, o sentido titular de Χριστός continua inteligível neste contexto. A tradução principal torna esse sentido explícito sem excluir a leitura tradicional.
- issue: Força cristológica de κυρίου
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” mantém a força honorífica e cristológica usual do termo no Novo Testamento; “Mestre” é lexicalmente possível, mas estreitaria essa força no presente contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” em vez do regional ou arcaizante “vós”. A ordem foi ajustada para “Graça e paz a vocês”, construção natural em português que aplica o dativo aos dois substantivos, como requer a fórmula grega elíptica.
