id: PHP.1.6
reference: Philippians 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: pt
  text: 'Estou certo disto: aquele que começou uma boa obra entre vocês[a] há de completá-la até o dia do Messias Jesus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em vocês”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “Cristo Jesus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Estou certo
  rationale: O particípio expressa a convicção de Paulo e depende do contexto da frase anterior; em português, a forma finita explicita essa relação com naturalidade.
- source_word: αὐτὸ τοῦτο
  choice: disto
  rationale: A construção enfática aponta diretamente para a afirmação seguinte. “Disto” comunica o foco com clareza, sem o peso pouco natural de “desta mesma coisa”.
- source_word: ὁ ἐναρξάμενος
  choice: aquele que começou
  rationale: Preserva o sujeito pessoal sem inserir explicitamente “Deus”, que está implícito, mas não aparece no texto grego.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: O pronome é plural e se dirige à comunidade de Filipos; “entre vocês” destaca adequadamente o âmbito comunitário, enquanto “em vocês” continua sendo uma leitura possível e consta em nota.
- source_word: ἔργον ἀγαθὸν
  choice: uma boa obra
  rationale: Tradução direta e corrente, sem especificar a natureza da obra além do que o grego afirma.
- source_word: ἐπιτελέσει
  choice: há de completá-la
  rationale: Expressa a conclusão futura da obra e retoma naturalmente o substantivo feminino “obra”.
- source_word: ἄχρι ἡμέρας
  choice: até o dia
  rationale: Reproduz diretamente o limite temporal indicado por ἄχρι, preservando a relação entre o processo e o dia escatológico.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como o título “Messias”, em vez de apenas transliterá-lo pela forma tradicional “Cristo”.
theological_decisions:
- issue: Se a boa obra deve ser apresentada principalmente como individual ou comunitária
  choice: “entre vocês”, com sentido comunitário no texto principal
  alternative: “em vocês”, que pode ser entendido coletiva ou individualmente
  rationale: O plural ὑμῖν e o contexto da carta à comunidade filipense favorecem o âmbito comunitário, sem excluir a atuação de Deus em seus membros.
- issue: Se o agente implícito deve ser identificado explicitamente como Deus
  choice: Manter “aquele que começou”
  alternative: “Deus, que começou”
  rationale: Embora o referente seja naturalmente entendido como Deus, o texto grego não traz o nome; mantê-lo implícito evita uma explicitação interpretativa desnecessária.
- issue: Sentido temporal de ἄχρι em relação ao dia do Messias
  choice: “até o dia”
  alternative: “no dia”
  rationale: “Até” preserva o valor lexical e a tensão entre a obra em andamento e sua conclusão, sem restringir a conclusão a um único momento de modo mais específico do que o original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Estou certo” é corrente sem ser coloquial; “há de completá-la” comunica confiança quanto ao futuro com solenidade moderada. A colocação pronominal evita uma repetição pesada de “a boa obra”.
