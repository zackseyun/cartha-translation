  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: pt
  text: Que importa, então? O importante é que, de toda maneira, seja por fingimento, seja com sinceridade[a], o Messias é anunciado; e nisso me alegro. Sim, e também me alegrarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja como pretexto, seja em verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Que importa, então?
  rationale: Expressa de modo natural a breve pergunta retórica de Paulo no contexto, sem tornar explícito além do necessário aquilo que ele considera secundário.
- source_word: πλὴν ὅτι
  choice: O fato é que
  rationale: 'Reproduz idiomaticamente a força restritiva da expressão: apesar das motivações diferentes, o ponto decisivo é o anúncio do Messias.'
- source_word: παντὶ τρόπῳ
  choice: de toda maneira
  rationale: Preserva o sentido distributivo da expressão e abrange as duas modalidades ou motivações contrastadas em seguida.
- source_word: προφάσει
  choice: por fingimento
  rationale: Comunica a falta de sinceridade indicada pelo substantivo sem especificar uma motivação mais precisa do que o grego permite.
- source_word: ἀληθείᾳ
  choice: com sinceridade
  rationale: No contraste com προφάσει, indica autenticidade de intenção em português natural; a nota registra a formulação mais literal.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Mantém o valor titular de Χριστός no contexto da proclamação.
- source_word: καταγγέλλεται
  choice: é anunciado
  rationale: Preserva a voz passiva e o sentido de proclamação pública; o presente português pode expressar a ação em curso sem uma perífrase pesada.
- source_word: ἐν τούτῳ
  choice: nisso
  rationale: Liga diretamente a alegria de Paulo ao fato de o Messias estar sendo anunciado.
- source_word: χαίρω
  choice: me alegro
  rationale: Mantém o sentido verbal forte de alegria e soa natural em português atual.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Sim, e também me alegrarei
  rationale: Transmite a ênfase aditiva e a orientação futura da expressão sem forçar um contraste adversativo artificial em português.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, o termo funciona como título daquele que é proclamado; “Messias” torna explícito esse valor sem acrescentar uma interpretação denominacional.
- issue: Natureza do contraste entre προφάσει e ἀληθείᾳ
  choice: por fingimento / com sinceridade
  alternative: como pretexto / em verdade
  rationale: A formulação principal comunica naturalmente o contraste entre intenção insincera e sincera, enquanto a nota preserva a possibilidade de uma reprodução mais formal dos substantivos gregos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A pergunta inicial foi vertida idiomaticamente, e a construção final preserva tanto a ênfase quanto o futuro. O marcador [a] aparece no texto principal.
