lexical_decisions:
- source_word: οἱ μὲν
  choice: Estes anunciam
  rationale: A expressão é elíptica e introduz um dos grupos em contraste. O verbo “anunciam” é retomado do contexto imediato para produzir uma frase natural em português.
- source_word: ἐξ ἀγάπης
  choice: por amor
  rationale: Expressa de modo idiomático em português o amor como motivo da ação.
- source_word: εἰδότες
  choice: sabendo
  rationale: Mantém a forma participial e sua ligação explicativa com a ação do grupo.
- source_word: εἰς ἀπολογίαν
  choice: para a defesa
  rationale: Preserva a ideia de finalidade e o sentido de defesa argumentada ou jurídica.
- source_word: τοῦ εὐαγγελίου
  choice: das boas-novas
  rationale: Traduz o sentido básico de εὐαγγέλιον em linguagem acessível, mantendo a referência à mensagem cristã.
- source_word: κεῖμαι
  choice: fui colocado aqui
  rationale: Preserva a imagem de ter sido posto numa determinada situação ou função e evita explicitar mais do que o verbo grego exige.
theological_decisions:
- issue: Sentido de κεῖμαι no contexto da prisão de Paulo
  choice: fui colocado aqui
  alternative: fui designado
  rationale: A tradução mantém aberta a tensão entre a situação concreta de Paulo e sua função providencial na defesa das boas-novas, sem tornar explícito quem o colocou nem formular uma nomeação institucional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Estes anunciam” explicita a ação subentendida pelo contexto; “boas-novas” comunica o sentido de εὐαγγέλιον sem jargão desnecessário.
