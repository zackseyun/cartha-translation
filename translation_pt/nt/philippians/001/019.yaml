id: PHP.1.19
reference: Philippians 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: pt
  text: Pois sei que isso resultará em minha libertação[a], por meio da oração de vocês e da provisão do Espírito de Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salvação” ou “vindicação”.
    reason: alternative_reading
  - marker: b
    text: A expressão grega também pode ser entendida como “a concessão do Espírito de Jesus, o Messias”.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: sei
  rationale: O perfeito οἶδα tem sentido presente; “sei” expressa de modo natural a confiança de Paulo.
- source_word: τοῦτό
  choice: isso
  rationale: O demonstrativo singular retoma de maneira ampla a situação presente de Paulo, sem especificá-la além do texto.
- source_word: ἀποβήσεται
  choice: resultará
  rationale: O verbo indica o desfecho ou resultado de uma situação; “resultará” preserva esse sentido e se encaixa naturalmente na construção portuguesa.
- source_word: σωτηρίαν
  choice: libertação
  rationale: No contexto da prisão, pode indicar a libertação ou o desfecho favorável de Paulo, embora o termo mantenha ressonâncias mais amplas de salvação e vindicação.
- source_word: δεήσεως
  choice: oração
  rationale: “Oração” é claro e corrente; o singular coletivo grego é preservado naturalmente em português.
- source_word: ἐπιχορηγίας
  choice: provisão
  rationale: O substantivo denota ajuda ou recurso fornecido; “provisão” conserva essa ideia sem definir indevidamente como o Espírito atua.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Espírito de Jesus, o Messias
  rationale: Mantém a relação genitiva expressa no grego e verte Χριστός como o título “Messias”, em formulação idiomática portuguesa.
theological_decisions:
- issue: Sentido de σωτηρίαν no contexto da prisão de Paulo
  choice: libertação
  alternative: salvação; vindicação
  rationale: A situação imediata favorece “libertação”, mas o campo semântico do termo permite “salvação” ou “vindicação”; a nota preserva essa tensão interpretativa.
- issue: Relação expressa em ἐπιχορηγίας τοῦ πνεύματος
  choice: a provisão que vem do Espírito
  alternative: o Espírito como aquilo que é concedido
  rationale: A expressão grega pode apontar para a provisão dada pelo Espírito ou para a concessão do próprio Espírito. O texto principal mantém a formulação compacta e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμῶν. A ordem da frase foi ajustada apenas para fluência; preservaram-se a referência ampla de “isso” e as ambiguidades relevantes de σωτηρία e ἐπιχορηγία.
