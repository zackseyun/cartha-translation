source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: pt
  text: para discernirem o que é melhor[a], a fim de que sejam puros e irrepreensíveis para o dia do Messias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aprovar o que é excelente» ou «reconhecer o que realmente importa»; mais literalmente, «discernir as coisas que diferem».'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: «para o dia de Cristo».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: saibam aprovar
  rationale: O verbo envolve examinar e, após a avaliação, reconhecer ou aprovar. A formulação mantém tanto o discernimento quanto o juízo favorável e soa natural em português.
- source_word: τὰ διαφέροντα
  choice: o que é excelente
  rationale: Embora a expressão signifique literalmente «as coisas que diferem», neste contexto provavelmente aponta para aquilo que se distingue por ser superior ou mais importante. A nota preserva as alternativas genuínas.
- source_word: εἰλικρινεῖς
  choice: puros
  rationale: O adjetivo pode indicar pureza, sinceridade ou integridade. «Puros» preserva a dimensão ética e combina naturalmente com «irrepreensíveis».
- source_word: ἀπρόσκοποι
  choice: irrepreensíveis
  rationale: O termo pode descrever quem não tropeça, não causa tropeço ou não dá motivo legítimo de acusação. «Irrepreensíveis» expressa de modo conciso essa integridade ética sem decidir entre todas as nuances possíveis.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: para o dia do Messias
  rationale: εἰς apresenta orientação para uma meta ou ocasião futura; «para» conserva isso. Χριστός funciona aqui como título, por isso «Messias» explicita seu sentido, enquanto a forma tradicional fica na nota.
theological_decisions:
- issue: Tradução de Χριστοῦ na expressão escatológica εἰς ἡμέραν Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Nesta expressão, Χριστός mantém força titular. «Messias» comunica o significado do título; «Cristo», forma tradicional e amplamente conhecida, é preservado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com plural «vocês» para ὑμᾶς. A construção coordena o propósito expresso no contexto e evita linguagem excessivamente técnica. As notas registram a amplitude lexical e a tradução tradicional do título.
