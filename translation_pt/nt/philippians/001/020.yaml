id: PHP.1.20
reference: Philippians 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: pt
  text: conforme a minha ardente expectativa e esperança de que em nada serei envergonhado[a], mas de que, com toda a ousadia, como sempre, também agora o Messias[b] será engrandecido no meu corpo, seja pela vida, seja pela morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me envergonharei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: conforme
  rationale: Expressa conformidade com a expectativa e a esperança de Paulo, mantendo uma ligação natural com o contexto anterior.
- source_word: ἀποκαραδοκίαν
  choice: ardente expectativa
  rationale: Preserva a intensidade e a orientação para o futuro deste substantivo raro sem produzir uma expressão artificial em português.
- source_word: ἐλπίδα
  choice: esperança
  rationale: É o equivalente corrente e adequado ao uso paulino, aqui associado à expectativa confiante.
- source_word: ἐν οὐδενὶ
  choice: em nada
  rationale: Conserva de modo conciso a negação abrangente do grego.
- source_word: αἰσχυνθήσομαι
  choice: serei envergonhado
  rationale: Mantém em primeiro plano a possibilidade de desonra ou vergonha pública; a leitura reflexiva possível é registrada em nota.
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: com toda a ousadia
  rationale: Comunica a coragem e a franqueza do testemunho público, preservando a força de πάσῃ.
- source_word: μεγαλυνθήσεται
  choice: será engrandecido
  rationale: Preserva a metáfora de tornar ou mostrar grande, com linguagem bíblica clara e digna.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o sentido titular de Χριστός, ainda perceptível no contexto, em vez de tratá-lo apenas como nome próprio.
- source_word: ἐν τῷ σώματί μου
  choice: no meu corpo
  rationale: Reproduz diretamente a expressão grega e ressalta o caráter corporal do testemunho de Paulo.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: seja pela vida, seja pela morte
  rationale: Mantém o paralelismo e deixa que διά indique o meio ou a circunstância sem especificação excessiva.
theological_decisions:
- issue: Sentido de αἰσχυνθήσομαι
  choice: serei envergonhado
  alternative: não me envergonharei
  rationale: O contexto de testemunho e vindicação favorece a nuance pública de sofrer vergonha, mas a forma grega também admite o sentido reflexivo, preservado em nota.
- issue: Tradução de Χριστός no contexto paulino
  choice: o Messias
  alternative: Cristo
  rationale: Aqui o título continua semanticamente significativo; “Messias” torna explícito seu conteúdo sem acrescentar uma interpretação denominacional. A forma tradicional é indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem da frase acompanha de perto o desenvolvimento do grego, enquanto “ardente expectativa” e “com toda a ousadia” evitam rigidez excessiva.
