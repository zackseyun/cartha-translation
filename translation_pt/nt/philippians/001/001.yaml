id: PHP.1.1
reference: Philippians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], slaves of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: pt
  text: 'Paulo e Timóteo, escravos[a] do Messias Jesus[b], a todos os santos no Messias Jesus que estão em Filipos, juntamente com os supervisores[c] e diáconos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Cristo Jesus”. O termo grego Χριστός é um título e significa “Messias”; “Cristo” é sua forma tradicional em português.
    reason: alternative_reading
  - marker: c
    text: Ou “bispos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Expressa diretamente a condição de pertença e sujeição inerente ao termo grego, sem suavizá-la para o sentido genérico de serviço.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: do Messias Jesus / no Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu sentido de ‘Messias’, e mantém a repetição da fórmula paulina.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: a todos os santos
  rationale: É uma formulação concisa e corrente em português que conserva a identidade santa atribuída aos destinatários.
- source_word: ἐν
  choice: 'no'
  rationale: Preserva a linguagem paulina de estar ‘no Messias’, sem substituí-la por uma paráfrase interpretativa.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: que estão em Filipos
  rationale: Converte o particípio grego em oração relativa natural, mantendo explícita a localização dos destinatários.
- source_word: σὺν
  choice: juntamente com
  rationale: Torna clara a ideia de associação expressa pela preposição grega.
- source_word: ἐπισκόποις
  choice: supervisores
  rationale: Traduz de modo transparente a função indicada pelo termo grego e evita impor automaticamente conotações desenvolvidas posteriormente associadas a ‘bispos’.
- source_word: διακόνοις
  choice: diáconos
  rationale: No contexto de sua associação com os supervisores, o termo provavelmente designa uma função reconhecida na comunidade, para a qual ‘diáconos’ é a forma portuguesa estabelecida.
theological_decisions:
- issue: Tradução de Χριστός na fórmula de saudação paulina
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: ‘Messias’ preserva o valor titular original de Χριστός. A alternativa tradicional permanece indicada em nota, pois ‘Cristo’ é a forma consagrada em português.
- issue: Tradução de δοῦλοι em Filipenses 1:1
  choice: escravos
  alternative: servos
  rationale: ‘Escravos’ conserva a relação de pertença e sujeição do termo grego; ‘servos’ é mais tradicional e pode soar mais natural, mas tende a atenuar esse aspecto.
- issue: Tradução de ἐπισκόποις
  choice: supervisores
  alternative: bispos
  rationale: ‘Supervisores’ comunica o sentido funcional do grego sem identificar de forma automática o cargo do primeiro século com formas episcopais posteriores; ‘bispos’ continua sendo uma tradução tradicional possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da saudação e as duas ocorrências da fórmula ‘Messias Jesus’ foram mantidas próximas do grego. ‘Escravos’ é deliberadamente mais forte que o tradicional ‘servos’, e ‘supervisores’ privilegia transparência funcional.
