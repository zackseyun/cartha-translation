id: PHP.1.12
reference: Philippians 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: pt
  text: Quero que vocês saibam, irmãos[a], que aquilo que me aconteceu, na verdade, contribuiu para o avanço das boas-novas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou irmãos e irmãs; o grego diz “irmãos” e pode se referir a toda a comunidade dos que creem.
    reason: lexical_alternative
  - marker: b
    text: Ou do evangelho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Quero que vocês saibam
  rationale: Reproduz de modo natural em português a fórmula epistolar pela qual Paulo declara sua intenção de informar os destinatários.
- source_word: δὲ
  choice: não expresso por palavra isolada
  rationale: Aqui δέ funciona como transição leve; a continuidade discursiva é natural em português sem acrescentar “agora”, que poderia sugerir uma referência temporal ausente do grego.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o substantivo masculino plural do texto grego; no contexto, ele pode designar toda a comunidade cristã, possibilidade indicada na nota.
- source_word: τὰ κατ’ ἐμὲ
  choice: aquilo que me aconteceu
  rationale: Expressa naturalmente as circunstâncias e os acontecimentos relacionados a Paulo, sem a rigidez de “as coisas a meu respeito”.
- source_word: μᾶλλον
  choice: na verdade
  rationale: Comunica a ideia de um resultado contrário ao que se poderia esperar, sem forçar o valor estritamente comparativo de “mais”.
- source_word: εἰς προκοπὴν τοῦ εὐαγγελίου
  choice: contribuiu para o avanço das boas-novas
  rationale: Preserva a construção de finalidade ou resultado e a noção de progresso, com sintaxe idiomática em português.
- source_word: ἐλήλυθεν
  choice: contribuiu
  rationale: O perfeito descreve uma situação alcançada com efeito presente; no conjunto da frase, “contribuiu para” comunica naturalmente esse resultado duradouro.
- source_word: τοῦ εὐαγγελίου
  choice: das boas-novas
  rationale: Traduz o sentido lexical de εὐαγγέλιον em linguagem clara; “evangelho” permanece como alternativa tradicional na nota.
