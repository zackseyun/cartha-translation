base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: pt
  text: Mas continuar na carne é mais necessário por causa de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o bem de vocês”. “Continuar na carne” significa continuar vivendo no corpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: continuar
  rationale: O infinitivo articular funciona substantivamente. “Continuar” expressa de modo natural a permanência de Paulo nesta vida, sem acrescentar ao texto um verbo como “viver”.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca o contraste com o desejo anterior de partir e estar com Cristo.
- source_word: ἐν τῇ σαρκὶ
  choice: na carne
  rationale: Preserva a formulação concreta do grego e, neste contexto, refere-se à existência corporal terrena, não a uma natureza pecaminosa.
- source_word: ἀναγκαιότερον
  choice: mais necessário
  rationale: Mantém explicitamente o grau comparativo do adjetivo grego.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: Reproduz a amplitude de διά com acusativo, permitindo que o contexto comunique que a continuação de Paulo é necessária em benefício dos filipenses.
theological_decisions:
- issue: Sentido de σάρξ neste versículo
  choice: existência corporal terrena (“na carne”)
  alternative: sentido moral (“natureza pecaminosa”) ou paráfrase expansiva (“vivo neste mundo”)
  rationale: O contexto contrapõe partir para estar com Cristo a continuar na presente existência corporal. O sentido moral não é sustentado pelo contexto imediato.
- issue: Relação expressa por δι’ ὑμᾶς
  choice: “por causa de vocês” no texto, entendida contextualmente como necessidade em benefício deles
  alternative: “para o bem de vocês” ou “por vocês”
  rationale: A tradução escolhida preserva melhor a forma causal ampla da expressão grega, enquanto a nota explicita a leitura benefativa natural no contexto pastoral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “na carne” conserva a imagem paulina, esclarecida em nota para impedir uma leitura moral indevida.
