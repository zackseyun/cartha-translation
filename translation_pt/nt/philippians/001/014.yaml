id: PHP.1.14
reference: Philippians 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: pt
  text: E a maioria dos irmãos[a], tendo ganhado confiança no Senhor por causa das minhas correntes, ousa ainda mais falar a palavra sem medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; aqui, o termo provavelmente se refere de modo mais amplo aos demais cristãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: a maioria
  rationale: Com o artigo e o genitivo partitivo, indica a maior parte dos irmãos, não apenas um número comparativamente maior.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego; uma nota registra que o termo provavelmente abrange os demais cristãos, incluindo mulheres.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a expressão paulina e a associa à confiança como sua esfera ou fundamento.
- source_word: πεποιθότας
  choice: tendo ganhado confiança
  rationale: Expressa o estado presente resultante sugerido pelo particípio perfeito, em português natural.
- source_word: τοῖς δεσμοῖς μου
  choice: por causa das minhas correntes
  rationale: Conserva a imagem concreta das correntes e comunica o valor causal do dativo no contexto.
- source_word: περισσοτέρως
  choice: ainda mais
  rationale: Reproduz de forma idiomática a intensificação comparativa.
- source_word: τολμᾶν
  choice: ousa
  rationale: Preserva a ideia de coragem resoluta para realizar a ação indicada pelo infinitivo.
- source_word: ἀφόβως
  choice: sem medo
  rationale: Traduz diretamente a ausência de temor, sem ampliar o sentido para a noção mais geral de ousadia.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém a formulação do texto sem acrescentar “de Deus”; no contexto, refere-se provavelmente à mensagem proclamada.
- source_word: λαλεῖν
  choice: falar
  rationale: Corresponde ao verbo geral para falar, sem introduzir a força maior de “proclamar”.
theological_decisions:
- issue: Abrangência de ἀδελφοί
  choice: “irmãos” no texto principal, com nota sobre a provável referência inclusiva
  alternative: “irmãos e irmãs” ou “crentes”
  rationale: A tradução principal preserva o masculino plural do grego, enquanto a nota evita sugerir que as mulheres cristãs estejam necessariamente excluídas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva “no Senhor”, “correntes” e “a palavra”, sem explicitar além do grego.
