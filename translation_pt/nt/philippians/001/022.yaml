  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: pt
  text: 'Mas, se continuar vivendo na carne[a] resulta para mim em fruto do trabalho[b], não sei o que escolherei.


    [a] Ou “no corpo”.


    [b] Ou “trabalho frutífero” ou “fruto de trabalho”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no corpo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “trabalho frutífero” ou “fruto de trabalho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: continuar vivendo
  rationale: O infinitivo substantivado, no contexto, aponta para a continuação da vida presente; a formulação é natural em português e não amplia indevidamente o sentido.
- source_word: ἐν σαρκί
  choice: na carne
  rationale: Mantém a expressão paulina e, neste contexto, designa a existência física terrena, não uma natureza moralmente pecaminosa. A alternativa mais explícita consta em nota.
- source_word: καρπὸς ἔργου
  choice: fruto de trabalho
  rationale: Preserva a formulação compacta e a imagem de καρπός sem resolver por completo a relação entre os dois substantivos; a expressão idiomática alternativa consta em nota.
- source_word: αἱρήσομαι
  choice: escolherei
  rationale: O verbo indica escolher entre as possibilidades mencionadas no contexto; “escolherei” é claro e mantém o valor futuro.
- source_word: οὐ γνωρίζω
  choice: não sei
  rationale: Neste contexto, a expressão comunica incerteza, e não o sentido causativo possível de “dar a conhecer”.
theological_decisions:
- issue: Sentido de σάρξ neste versículo
  choice: existência física terrena (“na carne”)
  alternative: natureza pecaminosa
  rationale: O contexto contrapõe a continuação da vida presente à partida para estar com Cristo; portanto, σάρξ se refere aqui à vida corpórea, sem conotação necessária de corrupção moral.
- issue: Relação sintática entre a condição e καρπὸς ἔργου
  choice: “se eu continuar vivendo... isso será para mim fruto de trabalho”
  alternative: “se continuar vivendo... significa trabalho frutífero para mim”
  rationale: A tradução conserva a estrutura condicional e a metáfora do fruto, sem eliminar a concisão e a leve tensão sintática do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final “não sei o que escolherei” é natural em português; o travessão preserva a pausa e a tensão da construção grega. “Na carne” mantém a dicção paulina, enquanto a nota evita uma leitura moral indevida.
