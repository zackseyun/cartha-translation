id: PHP.1.25
reference: Philippians 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: pt
  text: E, convencido disso, sei que permanecerei e continuarei com todos vocês, para o progresso de vocês e para a alegria de vocês na fé[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alegria da fé” ou “a alegria que vem da fé”.
    reason: O genitivo τῆς πίστεως pode indicar associação, caracterização ou origem; a formulação grega não determina por si só uma única relação.
lexical_decisions:
- source_word: πεποιθὼς
  choice: convencido
  rationale: O particípio perfeito expressa um estado firme de convicção; “convencido” é natural e preserva essa força.
- source_word: μενῶ
  choice: permanecerei
  rationale: Mantém o sentido básico e a forma futura de μένω, além de permitir contraste com o verbo composto seguinte.
- source_word: παραμενῶ
  choice: continuarei com
  rationale: O composto sugere não apenas permanecer, mas continuar presente junto aos filipenses; a formulação distingue o verbo de μενῶ sem tornar a frase artificial.
- source_word: πᾶσιν ὑμῖν
  choice: com todos vocês
  rationale: Explicita πᾶσιν e representa naturalmente o dativo relacional ligado à presença continuada de Paulo junto a eles.
- source_word: προκοπὴν
  choice: progresso
  rationale: Expressa com clareza a ideia de avanço ou desenvolvimento no contexto da vida de fé.
- source_word: χαρὰν τῆς πίστεως
  choice: alegria de vocês na fé
  rationale: “Na fé” é uma construção portuguesa natural que associa a alegria à fé sem impor uma relação causal; “de vocês” vale conjuntamente para “progresso” e “alegria”, tornando explícito o pronome ὑμῶν.
- source_word: πίστεως
  choice: fé
  rationale: Neste contexto, “fé” representa adequadamente πίστις como a vida de confiança e crença dos filipenses.
theological_decisions:
- issue: Sentido do genitivo em χαρὰν τῆς πίστεως
  choice: alegria de vocês na fé
  alternative: alegria da fé; alegria que vem da fé
  rationale: O genitivo admite mais de uma relação semântica. O texto principal usa uma formulação natural e relativamente aberta, enquanto a nota registra possibilidades possessiva ou causal sem escolher uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A coordenação “permanecerei e continuarei com” preserva a distinção entre μένω e παραμένω. A vírgula final foi mantida porque o versículo continua sintaticamente em Filipenses 1:26.
