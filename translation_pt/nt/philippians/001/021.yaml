  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: pt
  text: Pois, para mim, viver é Cristo[a], e morrer é lucro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Messias”.
    reason: Alternativa lexical que preserva a possível força titular de Χριστός.
lexical_decisions:
- source_word: ἐμοὶ
  choice: para mim
  rationale: O dativo exprime a perspectiva pessoal de Paulo; “para mim” é natural em português e conserva essa ênfase.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação do pensamento anterior e preserva de modo conciso o encadeamento argumentativo.
- source_word: τὸ ζῆν
  choice: viver
  rationale: O infinitivo substantivado é expresso naturalmente pelo infinitivo português, mantendo o paralelismo compacto da frase.
- source_word: Χριστὸς
  choice: Cristo
  rationale: “Cristo” é a forma consagrada e natural em português; aqui pode ter uso semelhante ao de um nome, sem deixar de carregar sua origem titular.
- source_word: τὸ ἀποθανεῖν
  choice: morrer
  rationale: O infinitivo português preserva a construção equilibrada em paralelo com “viver”.
- source_word: κέρδος
  choice: lucro
  rationale: “Lucro” comunica de forma clara e vigorosa a ideia de ganho ou benefício, preservando a concisão do original.
theological_decisions:
- issue: Força de Χριστός
  choice: Cristo
  alternative: Messias
  rationale: No uso paulino, Χριστός pode funcionar de maneira próxima a um nome, embora sua origem como título permaneça. “Cristo” mantém essa abertura sem impor uma leitura mais explicitamente titular.
translation_notes:
  register: Português moderno, conciso e digno, com ampla legibilidade brasileira. A ordem “para mim, viver é Cristo” preserva a ênfase pessoal e o paralelismo lapidar do grego.
