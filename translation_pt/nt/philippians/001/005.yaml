  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: pt
  text: por causa da participação de vocês no evangelho, desde o primeiro dia até agora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor do evangelho”. A expressão grega pode indicar tanto a esfera da participação compartilhada quanto seu objetivo ou finalidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: por causa da participação de vocês
  rationale: Com o dativo, ἐπί indica aqui a causa ou o fundamento da ação de graças no contexto. “Participação” expressa o envolvimento compartilhado e ativo dos filipenses sem limitar κοινωνία a mera convivência ou contribuição financeira.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: no evangelho
  rationale: A expressão pode indicar a esfera da participação compartilhada ou sua finalidade. “No evangelho” é natural em português e preserva a primeira possibilidade; a alternativa final é registrada em nota.
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: Termo estabelecido, claro e teologicamente apropriado no contexto paulino.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: desde o primeiro dia
  rationale: Marca com naturalidade o ponto inicial da participação contínua dos filipenses.
- source_word: ἄχρι τοῦ νῦν
  choice: até agora
  rationale: Expressa a continuidade até o momento presente de Paulo em português corrente.
theological_decisions:
- issue: Sentido de εἰς em relação a κοινωνία e εὐαγγέλιον
  choice: no evangelho
  alternative: em favor do evangelho
  rationale: O grego admite tanto a esfera da participação quanto sua direção ou finalidade. A tradução principal mantém a formulação relacional concisa, enquanto a nota preserva a leitura final sem decidir indevidamente entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural de ὑμῶν; “participação” evita a possível redução de “comunhão” a convívio afetivo e mantém aberta a natureza concreta dessa cooperação.
