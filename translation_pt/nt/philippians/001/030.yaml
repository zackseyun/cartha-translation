  text: enfrentando a mesma luta que vocês viram em mim e da qual agora ouvem dizer que enfrento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: luta
  rationale: Expressa o conflito ou combate enfrentado por Paulo, sem limitar o termo a uma disputa esportiva.
- source_word: ἔχοντες
  choice: enfrentando
  rationale: Em português natural, comunica participar ou estar envolvido na luta, em vez do literal menos idiomático 'tendo'.
- source_word: ἐν ἐμοί
  choice: que ainda enfrento
  rationale: No segundo uso, o sentido idiomático é que os filipenses ouvem que a luta continua na experiência de Paulo; 'ainda' torna explícita a continuidade indicada por 'agora' no contraste com o que antes viram.
theological_decisions:
- issue: Natureza da luta
  choice: luta
  alternative: combate
  rationale: Mantém aberto se a referência abrange perseguição, sofrimento, oposição e esforço pela fé, sem impor uma interpretação mais específica.
- issue: Segundo ἐν ἐμοί
  choice: ouvem dizer que ainda enfrento
  alternative: ouvem em mim
  rationale: Evita uma formulação obscura em português e preserva a ideia de que a mesma luta continua ocorrendo com Paulo, sem acrescentar uma causa ou forma específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronome 'vocês' para legibilidade brasileira. A formulação mantém a continuidade entre a luta anteriormente vista e a atualmente relatada.
