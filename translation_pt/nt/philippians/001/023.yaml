source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: pt
  text: 'Mas vejo-me pressionado entre as duas alternativas: tenho o desejo de partir[a] e estar com o Messias[b], pois isso é de longe melhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morrer”. Literalmente, “partir”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Cristo”. Grego: “o Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέχομαι
  choice: sou pressionado
  rationale: Preserva a ideia de estar apertado ou constrangido por forças concorrentes, sem reduzir o verbo apenas a um sentimento de indecisão.
- source_word: ἐκ τῶν δύο
  choice: entre as duas coisas
  rationale: A expressão indica as duas alternativas mencionadas no contexto; esta formulação comunica naturalmente a relação idiomática em português.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: tenho o desejo
  rationale: Mantém explícito o substantivo ἐπιθυμία e expressa em português corrente a construção participial grega.
- source_word: ἀναλῦσαι
  choice: partir
  rationale: Conserva a imagem eufemística do verbo grego, que neste contexto se refere à morte, sem tornar explícito no texto principal mais do que o original diz.
- source_word: Χριστῷ
  choice: o Messias
  rationale: Traduz Χριστός como título e torna seu sentido acessível, registrando em nota a alternativa tradicional 'Cristo'.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: pois isso é de longe melhor
  rationale: Reproduz de modo natural a forte intensificação da comparação presente na expressão grega.
theological_decisions:
- issue: Comunhão com o Messias após a partida
  choice: partir e estar com o Messias
  alternative: morrer e ir imediatamente para o céu
  rationale: A tradução conserva a afirmação explícita do grego sem acrescentar uma cronologia ou uma descrição do estado após a morte que o versículo não apresenta.
- issue: Valor titular de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A opção explicita o título grego sem negar a forma tradicional, que é apresentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os dois-pontos tornam natural em português a relação entre a pressão das duas alternativas e o desejo explicado em seguida, sem eliminar a tensão do texto.
