  text: I thank my God at every remembrance of you,[a]
translation:
  language: pt
  text: Dou graças ao meu Deus sempre que me lembro de vocês,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dou graças ao meu Deus por cada lembrança que tenho de vocês.”'
    reason: Preserva a possibilidade de ἐπὶ indicar o motivo ou fundamento da gratidão, e não apenas a ocasião em que ela ocorre.
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Dou graças
  rationale: Expressa de modo natural e digno o presente ativo na primeira pessoa do singular, preservando a ideia explícita de gratidão.
- source_word: τῷ θεῷ μου
  choice: ao meu Deus
  rationale: O dativo regido por εὐχαριστέω é naturalmente expresso em português com a preposição “a”; o possessivo é mantido.
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: sempre que me lembro
  rationale: Traduz de maneira corrente a circunstância ou ocasião repetida da ação de graças, refletindo o valor distributivo de πάσῃ com o substantivo singular μνείᾳ.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Representa com clareza o genitivo plural em português de ampla compreensão, sem acrescentar “todos”, ausente neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμῶν; “sempre que me lembro” evita a formulação pouco natural “em toda lembrança”, sem eliminar a alternativa lexical registrada na nota.
