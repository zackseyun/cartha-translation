revisions:
- from: É justo que eu pense assim a respeito de todos vocês[a], porque os tenho no coração, pois, tanto nas minhas correntes como na defesa e na confirmação do evangelho, todos vocês participam comigo da graça.
  to: 'É justo que eu pense assim a respeito de todos vocês[a], porque os tenho no coração: tanto nas minhas correntes como na defesa e na confirmação do evangelho, todos vocês são participantes comigo da graça.'
  rationale: A revisão elimina a duplicação causal pouco idiomática e usa os dois-pontos para ligar com clareza a expressão de afeto à descrição da graça compartilhada. Também ajusta «participam» para «são participantes», refletindo mais de perto συγκοινωνούς sem sacrificar a legibilidade. A leitura alternativa da oração sobre o coração é mantida integralmente na nota.
