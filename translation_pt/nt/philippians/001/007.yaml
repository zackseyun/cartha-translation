id: PHP.1.7
reference: Philippians 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: pt
  text: 'É justo que eu pense assim a respeito de todos vocês[a], porque os tenho no coração: tanto nas minhas correntes como na defesa e na confirmação do evangelho, todos vocês são participantes comigo da graça.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque vocês me têm no coração”. A construção grega permite as duas leituras.'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: É justo
  rationale: Expressa que a atitude de Paulo é correta e apropriada, preservando o sentido ético do termo em português natural.
- source_word: φρονεῖν
  choice: que eu pense assim
  rationale: O verbo abrange pensamento e disposição interior; esta formulação é clara e permite que o contexto comunique ambos.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: a respeito de todos vocês
  rationale: Com φρονεῖν, ὑπέρ indica a consideração de Paulo para com os destinatários, não representação em favor deles.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: porque os tenho no coração
  rationale: Segue a leitura tradicional e contextualmente coerente, segundo a qual Paulo guarda os filipenses no coração, sem ocultar em nota a ambiguidade sintática do grego.
- source_word: δεσμοῖς
  choice: correntes
  rationale: Preserva a imagem concreta dos grilhões e comunica vividamente a prisão de Paulo.
- source_word: ἀπολογίᾳ
  choice: defesa
  rationale: Designa a defesa pública, e possivelmente jurídica, do evangelho.
- source_word: βεβαιώσει
  choice: confirmação
  rationale: Comunica o estabelecimento ou a validação da verdade do evangelho e forma uma combinação natural com “defesa”.
- source_word: συγκοινωνούς
  choice: participam comigo
  rationale: Expressa participação conjunta de modo idiomático, sem a redundância de equivalentes como “coparticipantes comigo”.
- source_word: χάριτος
  choice: graça
  rationale: Mantém o termo teológico central e deixa o contexto definir a graça compartilhada no chamado, no sofrimento e no serviço do evangelho.
theological_decisions:
- issue: Ambiguidade sintática na oração sobre o coração
  choice: porque os tenho no coração
  alternative: porque vocês me têm no coração
  rationale: Os dois pronomes estão no acusativo junto ao infinitivo grego, permitindo formalmente ambas as leituras. A principal combina melhor com a expressão imediata do afeto de Paulo, mas a alternativa permanece genuína e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “correntes” conserva a imagem concreta; a ordem da frase mantém a ligação entre prisão, defesa, confirmação do evangelho e participação conjunta na graça.
