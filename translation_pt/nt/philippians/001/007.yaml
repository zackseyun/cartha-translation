    text: 'Ou: “porque vocês me têm no coração”. A construção grega permite as duas leituras.'
    reason: alternative_reading
  revision_rationale: A revisão elimina a duplicação causal pouco idiomática e usa os dois-pontos para ligar com clareza a expressão de afeto à descrição da graça compartilhada. Também ajusta «participam» para «são participantes», refletindo mais de perto συγκοινωνούς sem sacrificar a legibilidade. A leitura alternativa da oração sobre o coração é mantida integralmente na nota.
