id: PHP.1.9
reference: Philippians 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: pt
  text: 'E isto oro: que o amor de vocês transborde cada vez mais em conhecimento[a] e em todo discernimento[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com conhecimento”; a preposição grega também pode indicar estreita associação.
    reason: lexical_alternative
  - marker: b
    text: Ou “em toda percepção” ou “em toda percepção moral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: E isto
  rationale: Preserva o conectivo καί e a força demonstrativa de τοῦτο, fazendo a transição natural da ação de graças para o conteúdo da oração.
- source_word: προσεύχομαι
  choice: oro
  rationale: O presente grego expressa a oração contínua de Paulo; o presente simples é natural e digno em português.
- source_word: ἵνα
  choice: que
  rationale: Introduz naturalmente em português o conteúdo da oração, sem excluir a nuance de propósito presente na construção grega.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: o amor de vocês
  rationale: Traduz diretamente ἀγάπη e torna explícito o possessivo plural ὑμῶν em português moderno, com ampla legibilidade brasileira.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: cada vez mais
  rationale: Expressão portuguesa natural que comunica o aumento contínuo e reiterado indicado por ἔτι e pela repetição de μᾶλλον.
- source_word: περισσεύῃ
  choice: transborde
  rationale: Mantém a imagem de abundância do verbo περισσεύω e expressa de modo natural o sentido desejado da oração.
- source_word: ἐν ἐπιγνώσει
  choice: em conhecimento
  rationale: Conserva a estrutura preposicional e traduz ἐπίγνωσις sem impor a nuance mais forte e discutível de 'pleno conhecimento'.
- source_word: πάσῃ αἰσθήσει
  choice: em todo discernimento
  rationale: No contexto, αἴσθησις indica percepção prática ou moral; 'discernimento' transmite isso com clareza, enquanto 'todo' preserva a abrangência de πάσῃ.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém a imagem de abundância e a relação potencialmente ambígua entre o crescimento do amor, o conhecimento e o discernimento.
