  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: pt
  text: Alguns proclamam o Messias[a] por inveja e rivalidade, enquanto outros o fazem por boa vontade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. O título grego é Χριστός (Christós).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Alguns, de fato, … mas outros
  rationale: Expressa com naturalidade o contraste entre os dois grupos marcado por μέν … δέ, enquanto «de fato» representa a ênfase inicial sem tornar a frase pesada.
- source_word: διὰ φθόνον
  choice: por inveja
  rationale: διά com acusativo indica aqui a causa ou motivação; «por inveja» é direto e idiomático em português.
- source_word: ἔριν
  choice: rivalidade
  rationale: Neste contexto de motivações competitivas, «rivalidade» comunica melhor o sentido interpessoal do que opções como «contenda» ou «discórdia».
- source_word: δι’ εὐδοκίαν
  choice: por boa vontade
  rationale: A expressão descreve uma motivação positiva em contraste com inveja e rivalidade. «Boa vontade» preserva essa amplitude sem especificar além do texto.
- source_word: τὸν Χριστόν
  choice: o Messias
  rationale: O artigo e o contexto favorecem a compreensão de Χριστός como título; «Messias» torna esse valor titular explícito.
- source_word: κηρύσσουσιν
  choice: proclamam
  rationale: «Proclamam» preserva o sentido público e anunciador de κηρύσσω sem restringi-lo à pregação institucional.
theological_decisions:
- issue: Valor de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A tradução principal explicita o título grego e sua ligação com o ungido esperado; a alternativa tradicional é preservada em nota para não ocultar a possibilidade de leitura mais nominal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A retomada «o fazem» evita repetir «proclamam o Messias» e não altera o contraste de motivações.
