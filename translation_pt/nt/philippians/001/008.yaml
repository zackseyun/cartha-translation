source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: pt
  text: Pois Deus é minha testemunha de quanto tenho saudade de todos vocês, com as profundas afeições[b] do Messias Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Cristo Jesus».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «com a compaixão».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: testemunha
  rationale: Na fórmula solene «Deus é minha testemunha», comunica naturalmente que Paulo apela a Deus como fiador da sinceridade de suas palavras.
- source_word: γάρ
  choice: Pois
  rationale: Preserva a ligação explicativa com o contexto anterior sem tornar a frase excessivamente formal.
- source_word: ὡς
  choice: de quanto
  rationale: Introduz de modo idiomático tanto o conteúdo quanto a intensidade da saudade de Paulo.
- source_word: ἐπιποθῶ
  choice: tenho saudade de
  rationale: Expressa em português atual o forte anseio pessoal do verbo grego; evita a possível conotação romântica de «anseio por».
- source_word: πάντας ὑμᾶς
  choice: todos vocês
  rationale: Mantém a ênfase inclusiva de πάντας e é amplamente compreensível em português moderno.
- source_word: σπλάγχνοις
  choice: profundo afeto
  rationale: O termo designa literalmente as entranhas como sede dos sentimentos; esta tradução comunica a profundidade emocional sem reproduzir de maneira opaca a imagem anatômica.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título e conserva a ordem do grego, reconhecendo em nota a forma tradicional e mais lexicalizada «Cristo Jesus».
theological_decisions:
- issue: Sentido da expressão ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ
  choice: com o profundo afeto do Messias Jesus
  alternative: com a compaixão do Messias Jesus
  rationale: O genitivo pode indicar que o afeto de Paulo tem sua fonte, caráter ou identificação no próprio Messias. A tradução mantém essa tensão relacional sem explicar além do texto; «compaixão» é registrada como alternativa lexical.
- issue: Tradução de Χριστοῦ numa construção paulina de título e nome
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: «Messias» torna explícito o valor titular de Χριστός, enquanto «Cristo Jesus», forma tradicional e mais semelhante a nome próprio em Paulo, é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Tenho saudade de» soa natural e afetivo; «profundo afeto» evita o literalismo obscuro de «entranhas». Todos os marcadores de nota aparecem no texto.
