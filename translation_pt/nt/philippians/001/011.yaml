id: PHP.1.11
reference: Philippians 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: pt
  text: cheios do fruto da justiça que vem por meio de Jesus, o Messias[b], para a glória e o louvor de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a glória e o elogio de Deus”.'
    reason: “Louvor” é a tradução contextual mais natural de ἔπαινος, mas “elogio” representa de forma mais literal outra nuance possível.
  - marker: b
    text: 'Grego: “Jesus Cristo”; aqui, “Messias” traduz Christos como título.'
    reason: Registra a forma grega tradicionalmente transliterada como “Cristo” e explica a tradução semântica adotada.
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: cheios
  rationale: O particípio perfeito expressa um estado resultante ligado à oração anterior; “cheios” é natural em português e mantém essa ideia.
- source_word: καρπὸν
  choice: fruto
  rationale: Preserva a metáfora paulina de resultado ético e espiritual.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é o equivalente português amplo e tradicional de δικαιοσύνη; neste contexto pode indicar retidão moral sem definir de modo excessivo a relação do genitivo.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: que vem por meio de Jesus, o Messias
  rationale: διά com genitivo indica meio ou agência. A oração relativa torna clara e natural em português a procedência do fruto, enquanto “Messias” conserva o valor titular de Χριστός.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: para a glória e o louvor de Deus
  rationale: “Para” comunica de modo idiomático a finalidade ou o resultado expresso por εἰς.
theological_decisions:
- issue: Sentido de “fruto da justiça”
  choice: Manter a construção genitiva “fruto da justiça”, permitindo que denote fruto caracterizado pela justiça ou que consiste nela.
  alternative: Explicitar “fruto que é a justiça” ou “fruto produzido pela justiça”.
  rationale: O grego admite mais de uma relação entre “fruto” e “justiça”; a formulação evita resolver silenciosamente essa ambiguidade, embora o contexto associe o fruto à mediação de Jesus, o Messias.
- issue: Relação de διὰ Ἰησοῦ Χριστοῦ com a expressão anterior
  choice: Entender que o fruto vem por meio de Jesus, o Messias.
  alternative: Relacionar a frase mais especificamente apenas com “justiça”.
  rationale: A posição e o sentido instrumental de διά favorecem a mediação de Jesus em relação ao fruto, mas a tradução não descreve além do necessário como essa mediação opera.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada de maneira moderada para fluência. Os marcadores [a] e [b] aparecem no texto principal; [b] acompanha “Messias”, e [a] fica ao final da unidade a que se refere.
