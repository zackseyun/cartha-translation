id: PHP.3.14
reference: Philippians 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: pt
  text: Prossigo em direção ao alvo, para alcançar o prêmio do chamado de Deus para o alto, no Messias Jesus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do chamado celestial de Deus” ou “do chamado de Deus que vem do alto”.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “em Cristo Jesus”; aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: em direção ao alvo
  rationale: No contexto atlético, a expressão indica movimento dirigido a um objetivo fixo. A formulação mantém a imagem da corrida e soa natural em português.
- source_word: διώκω
  choice: Prossigo
  rationale: O verbo expressa perseguição persistente e esforço contínuo. “Prossigo” comunica o avanço decidido no contexto da corrida sem tornar a metáfora excessivamente explícita.
- source_word: εἰς τὸ βραβεῖον
  choice: para alcançar o prêmio
  rationale: εἰς apresenta o prêmio como finalidade do esforço. “Para alcançar” torna essa relação clara e idiomática, sem afirmar necessariamente que o prêmio já foi obtido.
- source_word: ἄνω
  choice: para o alto
  rationale: Preserva a força espacial de ἄνω e a tensão entre a direção ascendente e a origem celestial do chamado. Outras possibilidades são registradas em nota.
- source_word: κλήσεως τοῦ θεοῦ
  choice: do chamado de Deus
  rationale: Reproduz de perto a construção genitiva grega, permitindo entender que o chamado pertence a Deus ou procede dele.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός conserva aqui valor titular; “Messias” comunica esse sentido de modo transparente em português.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a linguagem paulina de esfera ou união expressa por ἐν, ao mesmo tempo que traduz Χριστός como título.
theological_decisions:
- issue: Sentido de ἄνω κλήσεως
  choice: chamado de Deus para o alto
  alternative: chamado celestial de Deus; chamado de Deus que vem do alto
  rationale: A escolha preserva tanto a imagem de movimento ascendente no contexto atlético quanto a associação do chamado com Deus e o céu, sem decidir se ἄνω indica principalmente destino, qualidade ou origem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a metáfora atlética e a ambiguidade de ἄνω sem recorrer à expressão tradicional, porém menos transparente, “soberana vocação”.
