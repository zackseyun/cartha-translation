  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: pt
  text: Embora eu mesmo tenha confiança até na carne. Se qualquer outro pensa que tem confiança na carne[a], eu, ainda mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiança em credenciais humanas” ou “confiança no status exterior”. Em grego: “na carne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Embora
  rationale: Marca com naturalidade a concessão que abre a frase.
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: eu mesmo tenha motivos para confiar
  rationale: Transforma a construção participial em oração finita idiomática e expressa πεποίθησις como base ou razão para confiança, sem perder seu sentido.
- source_word: καὶ ἐν σαρκί
  choice: até na carne
  rationale: Preserva o termo concreto e teologicamente carregado do grego; «até» comunica a força aditiva de καί neste contexto.
- source_word: δοκεῖ
  choice: pensa
  rationale: Expressa de modo corrente o juízo ou a suposição da pessoa acerca de si mesma.
- source_word: πεποιθέναι
  choice: pode confiar
  rationale: No contexto comparativo, transmite possuir base para depositar confiança; a noção é esclarecida sem substituir «carne».
- source_word: μᾶλλον
  choice: ainda mais
  rationale: Reproduz a comparação enfática e elíptica de Paulo em português natural.
theological_decisions:
- issue: Sentido de σάρξ em Filipenses 3:4
  choice: Manter «carne» no texto principal e explicar que aqui se refere às credenciais ou à condição humana exterior.
  alternative: Traduzir diretamente como «credenciais humanas» ou interpretar como «natureza pecaminosa».
  rationale: Os versículos seguintes enumeram circuncisão, linhagem, observância da Lei e zelo. Assim, o contexto aponta para vantagens humanas e distintivos exteriores, não primariamente para a natureza pecaminosa; conservar «carne» preserva a linguagem e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A primeira frase conserva a forma sintaticamente incompleta e concessiva do grego, cuja continuação depende do contexto anterior. «Motivos para confiar» evita a formulação pouco natural «ter confiança na carne», enquanto a segunda ocorrência usa «pode confiar» para preservar a comparação retórica.
