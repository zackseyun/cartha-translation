  text: Only[a], let us keep in step with what we have attained.
translation:
  language: pt
  text: Em todo caso, sigamos de acordo com o ponto a que chegamos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήν
  choice: Contudo
  rationale: 'Introduz uma ressalva ou transição limitadora: apesar do que ainda falta alcançar, Paulo volta a atenção para o progresso já feito. “Contudo” conserva essa força sem fazer a expressão soar como uma exceção estrita.'
- source_word: εἰς ὃ
  choice: quanto ao ponto a que
  rationale: A expressão remete ao ponto ou nível já alcançado. A formulação portuguesa explicita apenas o necessário para produzir uma frase natural, sem definir esse ponto como uma regra específica.
- source_word: ἐφθάσαμεν
  choice: chegamos
  rationale: O verbo indica ter atingido um ponto. “Chegamos” é corrente e, no contexto, comunica que o progresso anterior determina a conduta presente.
- source_word: τῷ αὐτῷ
  choice: no mesmo passo
  rationale: O dativo indica correspondência com o mesmo curso, padrão ou nível, embora o substantivo permaneça implícito no texto grego mais curto. Em conjunto com στοιχεῖν, “no mesmo passo” preserva a imagem sem introduzir “regra” ou “norma”.
- source_word: στοιχεῖν
  choice: continuemos no mesmo passo
  rationale: στοιχεῖν descreve andar em linha, seguir ordenadamente ou manter o passo. “Continuemos no mesmo passo” conserva a metáfora e exprime naturalmente a exortação no português atual.
theological_decisions:
- issue: Se deve ser acrescentado um substantivo explícito, como “regra” ou “norma”, junto de τῷ αὐτῷ
  choice: Não acrescentar esse substantivo; traduzir a construção por “continuemos no mesmo passo”.
  alternative: “andemos segundo a mesma regra” / “mantenhamo-nos na mesma norma”
  rationale: O texto da SBLGNT deixa implícito aquilo que é “o mesmo”. Acrescentar “regra” aproximaria a tradução de expansões textuais posteriores e resolveria mais do que a fonte permite. A formulação escolhida preserva a exortação e sua imagem sem impor uma referência específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A frase mantém a concisão do grego e evita tanto o arcaísmo “andemos segundo” quanto a introdução de “regra”, ausente do texto-base.
