  source_fidelity: A redação proposta capta a ideia geral de perseverança, mas “continuemos no mesmo passo” tende a significar manter o mesmo ritmo. Ela não vincula adequadamente a exortação ao ponto já alcançado (εἰς ὃ ἐφθάσαμεν) e pode sugerir uma nuance temporal que não está expressa.
  naturalness: “Em todo caso, sigamos de acordo com o ponto a que chegamos” é português moderno, claro e idiomático, com legibilidade ampla. Evita o sentido pouco preciso de “no mesmo passo”.
  terminology: A revisão não introduz “regra” ou “norma”, substantivos ausentes do texto curto da SBLGNT. “De acordo com” comunica a orientação implícita em τῷ αὐτῷ στοιχεῖν sem especificar indevidamente qual é o padrão.
