id: PHP.3.8
reference: Philippians 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: pt
  text: Mais do que isso, considero tudo perda por causa do valor incomparável de conhecer o Messias Jesus, meu Senhor. Por causa dele, sofri a perda de todas as coisas e as considero lixo[a], para ganhar o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lixo” traduz um termo forte que também pode significar “refugo”, “detritos” ou “esterco”.
    reason: lexical_alternative
  - marker: b
    text: “Messias” também pode ser traduzido por “Cristo”, tanto aqui como anteriormente no versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Mais do que isso
  rationale: A expressão intensifica e faz o argumento avançar além da afirmação anterior, de modo natural em português.
- source_word: ἡγοῦμαι
  choice: considero
  rationale: Expressa uma avaliação consciente e ponderada; a mesma escolha serve adequadamente às duas ocorrências.
- source_word: πάντα / τὰ πάντα
  choice: tudo / todas as coisas
  rationale: Preserva o alcance abrangente do grego, com variação idiomática natural em português.
- source_word: ζημίαν
  choice: perda
  rationale: Mantém a metáfora de ganhos e perdas que estrutura o versículo.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: por causa do valor incomparável de conhecer
  rationale: Comunica tanto a superioridade expressa por ὑπερέχον quanto o caráter relacional de γνώσεως, em português corrente.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu conteúdo messiânico neste contexto.
- source_word: τοῦ κυρίου μου
  choice: meu Senhor
  rationale: Preserva o possessivo e o peso cristológico de κύριος.
- source_word: δι’ ὃν
  choice: Por causa dele
  rationale: Expressa a causa pessoal da perda sem acrescentar uma nuance sacrificial que não precisa ser explicitada.
- source_word: ἐζημιώθην
  choice: perdi
  rationale: Reproduz de modo conciso e natural o fato de Paulo ter sofrido a perda, embora o português não marque aqui a forma passiva do grego.
- source_word: σκύβαλα
  choice: lixo
  rationale: É forte, depreciativo e compreensível; uma nota preserva sentidos mais ásperos possíveis.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: para ganhar o Messias
  rationale: Mantém a finalidade indicada por ἵνα e completa a metáfora econômica de perda e ganho.
theological_decisions:
- issue: Tradução de Χριστός no uso paulino
  choice: Messias
  alternative: Cristo
  rationale: Neste versículo, o termo pode conservar força titular; a tradução explicita esse conteúdo, enquanto a forma tradicional é registrada em nota.
- issue: Natureza de γνώσεως
  choice: conhecer
  alternative: o conhecimento de
  rationale: A formulação verbal comunica naturalmente em português o conhecimento pessoal e relacional sem excluir seu aspecto cognitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação em duas frases reduz a sobrecarga sintática sem alterar a progressão do argumento. Os marcadores [a] e [b] aparecem no texto principal.
