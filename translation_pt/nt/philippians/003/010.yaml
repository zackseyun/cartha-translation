  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: pt
  text: para conhecê-lo, e o poder da sua ressurreição, e a participação nos seus sofrimentos[a], sendo conformado à sua morte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comunhão nos seus sofrimentos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornando-me conforme à sua morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: conhecer
  rationale: Mantém o infinitivo de propósito e permite tanto o sentido relacional e experiencial quanto o cognitivo, sem explicitar além do grego.
- source_word: δύναμιν
  choice: poder
  rationale: É o equivalente português direto e corrente para a força eficaz manifestada na ressurreição de Cristo.
- source_word: ἀναστάσεως
  choice: ressurreição
  rationale: Termo estabelecido, preciso e natural em português para o acontecimento referido.
- source_word: κοινωνίαν
  choice: participação
  rationale: Expressa envolvimento real nos sofrimentos de Cristo e preserva a forma nominal da construção grega; evita que “comunhão” seja entendida apenas como convivência ou vínculo abstrato.
- source_word: παθημάτων
  choice: sofrimentos
  rationale: Equivalente direto e abrangente, adequado ao caráter pessoal e cristológico da passagem.
- source_word: συμμορφιζόμενος
  choice: sendo conformado
  rationale: Preserva a forma participial, o aspecto de processo em curso e a possível nuance passiva ou médio-passiva do grego.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: à sua morte
  rationale: Reproduz de modo conciso o complemento dativo e mantém o foco na conformidade com a morte de Cristo.
theological_decisions:
- issue: Sentido de κοινωνίαν παθημάτων αὐτοῦ
  choice: participação nos seus sofrimentos
  alternative: comunhão nos seus sofrimentos
  rationale: A formulação comunica participação efetiva no padrão dos sofrimentos de Cristo, não mera simpatia emocional, sem definir um mecanismo doutrinário específico.
- issue: Voz e processo em συμμορφιζόμενος
  choice: sendo conformado à sua morte
  alternative: tornando-me semelhante a ele em sua morte
  rationale: A opção principal conserva a possível voz passiva e a ideia de um processo contínuo, sem resolver explicitamente quem efetua essa conformação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “e” foi mantida para refletir a coordenação enfática do grego, e “participação” conserva a sequência de substantivos sem recorrer a linguagem excessivamente eclesiástica.
