  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: pt
  text: se, de algum modo, eu puder alcançar a ressurreição dentre os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a ex-ressurreição dentre os mortos”; o termo grego para “ressurreição” tem aqui uma forma incomum e composta.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: se, de algum modo
  rationale: Preserva a força condicional e a indefinição quanto ao modo, sem fazer Paulo declarar dúvida explícita sobre a promessa de Deus; a formulação é natural e digna em português.
- source_word: καταντήσω
  choice: eu puder alcançar
  rationale: O aoristo do subjuntivo após εἴ πως apresenta a chegada a um alvo; “alcançar” comunica bem esse sentido metafórico, e “puder” torna natural em português a modalidade da construção.
- source_word: εἰς
  choice: a
  rationale: Com “alcançar”, o português pede objeto direto; a ideia de movimento rumo ao alvo é expressa naturalmente pela construção inteira, sem reproduzir mecanicamente a preposição grega.
- source_word: ἐξανάστασιν
  choice: a ressurreição
  rationale: O substantivo designa ressurreição. Uma reprodução como “ex-ressurreição” seria obscura e poderia impor ao leitor uma distinção que o termo incomum, por si só, não exige.
- source_word: τὴν ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: “Dentre os mortos” preserva com clareza a ideia de sair do meio dos mortos e reflete ἐκ com mais precisão que a formulação mais geral “dos mortos”.
theological_decisions:
- issue: Se ἐξανάστασις deve ser traduzido de modo a distingui-lo fortemente do termo mais comum ἀνάστασις, sugerindo uma ressurreição especial.
  choice: Traduzir no texto principal como “a ressurreição dentre os mortos”.
  alternative: “a ressurreição para fora dentre os mortos” ou um neologismo como “ex-ressurreição”.
  rationale: A expressão aponta claramente para a ressurreição dentre os mortos, mas o substantivo incomum não justifica um neologismo nem a afirmação de uma categoria doutrinária específica. A nota preserva a forma enfática e incomum do grego sem resolver além da evidência a tensão interpretativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem e o vocabulário mantêm um tom simples e digno; “de algum modo” preserva a cautela de Paulo, e “dentre os mortos” conserva a nuance de ἐκ sem tornar o texto principal artificial.
