  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: pt
  text: circuncidado ao oitavo dia, da descendência de Israel, da tribo de Benjamim, hebreu de hebreus[a]; quanto à Lei, fariseu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hebreu nascido de hebreus”, destacando a ascendência e a identidade hebraicas de Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: circuncidado ao oitavo dia
  rationale: Expressa naturalmente em português a formulação grega condensada e preserva a referência ao sinal da aliança realizado no tempo prescrito.
- source_word: ἐκ γένους Ἰσραήλ
  choice: da descendência de Israel
  rationale: γένος indica aqui origem étnica ou linhagem; “descendência” preserva essa ideia sem reduzir Israel a uma mera nacionalidade moderna.
- source_word: φυλῆς Βενιαμίν
  choice: da tribo de Benjamim
  rationale: Reproduz com clareza a identificação da linhagem tribal.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: hebreu de hebreus
  rationale: Mantém a forma enfática e compacta do grego, deixando em aberto sua combinação de ascendência e identidade hebraicas; a alternativa explicativa fica em nota.
- source_word: κατὰ νόμον
  choice: quanto à Lei
  rationale: Neste catálogo de credenciais, κατά introduz o aspecto ou critério sob o qual Paulo se identifica como fariseu. “Quanto à” é natural e fiel à construção.
- source_word: Φαρισαῖος
  choice: fariseu
  rationale: É a designação tradicional e amplamente compreendida do grupo judaico.
