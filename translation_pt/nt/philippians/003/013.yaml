source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: pt
  text: 'Irmãos[a], não considero que eu mesmo já tenha alcançado isso. Mas uma coisa: esquecendo-me das coisas que ficam para trás e estendendo-me para as que estão adiante,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz o vocativo masculino grego adelphoi; Paulo frequentemente o usa ao dirigir-se à comunidade inteira de fiéis, incluindo as mulheres.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Preserva a forma masculina do vocativo grego e seu uso tradicional e natural em português; a nota esclarece que, neste contexto, Paulo se dirige à comunidade inteira, incluindo as mulheres.
- source_word: λογίζομαι
  choice: considero
  rationale: Expressa de modo atual e natural a avaliação que Paulo faz de si mesmo.
- source_word: κατειληφέναι
  choice: já tenha alcançado isso
  rationale: Retoma o verbo de Filipenses 3:12 e comunica a ideia de chegar a possuir ou obter o alvo; “isso” explicita com discrição o objeto subentendido. O advérbio “já” é contextual, não lexical, e torna natural a relação com a negação.
- source_word: ἓν δέ
  choice: Mas uma coisa
  rationale: Mantém a elipse abrupta do grego sem acrescentar “faço”, que não está expresso no texto-fonte.
- source_word: τὰ μὲν ὀπίσω
  choice: as coisas que ficam para trás
  rationale: Conserva o sentido plural e a imagem espacial, com formulação idiomática em português.
- source_word: ἐπιλανθανόμενος
  choice: esquecendo-me
  rationale: Reproduz o sentido lexical direto e mantém o fluxo participial da frase.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: as que estão adiante
  rationale: Preserva o contraste espacial com aquilo que fica para trás e evita especificar indevidamente quais coisas estão em vista.
- source_word: ἐπεκτεινόμενος
  choice: avançando para
  rationale: Comunica o movimento ativo em direção ao que está adiante em português claro; evita intensificar demais a imagem com uma formulação como “esforçando-me ao máximo”.
theological_decisions:
- issue: Objeto implícito de κατειληφέναι
  choice: isso
  alternative: omitir o objeto ou traduzi-lo como “o prêmio/alvo”
  rationale: O grego deixa o objeto subentendido pelo contexto. “Isso” preserva a referência aberta, enquanto “o prêmio” ou “o alvo” resolveria de modo excessivo a ambiguidade antes do versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção elíptica “Mas uma coisa” e os particípios foram mantidos para conservar o ritmo e a tensão do original.
