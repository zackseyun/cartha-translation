  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: pt
  text: Mas tudo o que para mim era ganho, tenho considerado perda por causa do Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por causa de Cristo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mas
  rationale: Marca de forma concisa o forte contraste com os motivos de confiança apresentados nos versículos anteriores.
- source_word: ἅτινα
  choice: tudo aquilo que
  rationale: Expressa o relativo indefinido e abrange o conjunto das vantagens que Paulo acaba de enumerar.
- source_word: ἦν μοι κέρδη
  choice: para mim era ganho
  rationale: Preserva a perspectiva pessoal e a metáfora contábil. Embora κέρδη seja plural em grego, o singular coletivo «ganho» soa mais natural em português e mantém o contraste com «perda».
- source_word: ἥγημαι
  choice: passei a considerar
  rationale: Comunica a reavaliação realizada e seu resultado vigente, valor aspectual do perfeito grego, em linguagem portuguesa natural.
- source_word: διὰ τὸν Χριστὸν
  choice: por causa do Messias
  rationale: διά com acusativo indica aqui causa ou motivo; «Messias» traduz o sentido titular de Χριστός.
- source_word: ζημίαν
  choice: perda
  rationale: Mantém a metáfora comercial em oposição a κέρδη e reúne as antigas vantagens numa avaliação global negativa.
theological_decisions:
- issue: Tradução de Χριστόν
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός conserva sentido titular neste contexto; «Messias» torna esse sentido explícito sem acrescentar uma interpretação denominacional. A alternativa tradicional «Cristo» é registrada em nota.
- issue: Relação expressa por διὰ com acusativo
  choice: por causa do Messias
  alternative: por amor ao Messias
  rationale: A construção indica primariamente causa ou motivo. «Por amor a» poderia sugerir finalidade ou afeição de modo mais específico do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a metáfora de ganho e perda e evita uma reprodução rígida do demonstrativo grego, desnecessária em português.
