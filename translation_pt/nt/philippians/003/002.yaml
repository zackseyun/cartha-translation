  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: pt
  text: Cuidado com os cães; cuidado com os maus trabalhadores; cuidado com a mutilação.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete três vezes a mesma advertência, para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: “Mutilação” é um termo depreciativo que contrasta com “circuncisão” no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: Βλέπετε
  choice: Cuidado com
  rationale: O imperativo presente é repetido três vezes e expressa uma advertência urgente. “Cuidado com” é natural em português moderno e preserva a repetição enfática.
- source_word: τοὺς κύνας
  choice: os cães
  rationale: Mantém literalmente a metáfora insultuosa e contundente, sem acrescentar qualificações interpretativas ausentes do grego.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: os maus trabalhadores
  rationale: Preserva tanto o juízo moral de κακούς quanto o sentido comum de ἐργάτας, em formulação clara e direta.
- source_word: τὴν κατατομήν
  choice: a mutilação
  rationale: Reproduz o substantivo pejorativo κατατομή e conserva seu contraste verbal deliberado com περιτομή, “circuncisão”, no versículo seguinte.
theological_decisions:
- issue: Como traduzir κατατομήν em relação à linguagem da circuncisão no contexto imediato
  choice: a mutilação
  alternative: os mutiladores; a falsa circuncisão
  rationale: Paulo emprega um termo depreciativo distinto da palavra comum para “circuncisão”. A tradução mantém a força retórica e teológica sem transformar o substantivo abstrato em referência explícita a pessoas nem acrescentar “falsa”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Cuidado com” preserva o ritmo retórico; “mutilação” mantém o jogo de palavras e a aspereza do original.
