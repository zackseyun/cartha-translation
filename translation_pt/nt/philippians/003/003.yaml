id: PHP.3.3
reference: Philippians 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: pt
  text: 'Pois nós é que somos a circuncisão: nós, que adoramos pelo Espírito de Deus[a], nos gloriamos no Messias Jesus[b] e não depositamos confiança na carne[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: «que adoramos a Deus em espírito».'
    reason: textual_variant
  - marker: b
    text: «Messias» traduz o título grego Christos.
    reason: lexical_alternative
  - marker: c
    text: Aqui, «carne» se refere a fundamentos corporais ou humanos de confiança, como circuncisão, origem ou posição religiosa.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: a circuncisão
  rationale: Mantém o termo concreto da aliança e a formulação enfática de Paulo, cuja argumentação redefine quem constitui a verdadeira circuncisão.
- source_word: πνεύματι θεοῦ
  choice: pelo Espírito de Deus
  rationale: No texto da SBLGNT, o genitivo θεοῦ favorece a referência ao Espírito divino; «pelo» expressa de modo natural sua atuação como meio do culto.
- source_word: λατρεύοντες
  choice: adoramos
  rationale: O verbo denota serviço religioso ou culto prestado a Deus; «adoramos» é claro e natural em português atual.
- source_word: καυχώμενοι
  choice: nos gloriamos
  rationale: Preserva o contraste entre o motivo de glória em Jesus e a confiança em credenciais humanas, sem sugerir mera alegria.
- source_word: Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como o título «Messias» e conserva a ordem do grego.
- source_word: σαρκί
  choice: carne
  rationale: Conserva a sobreposição literal e figurada do termo no contexto de circuncisão, origem e credenciais humanas; uma nota esclarece seu alcance.
- source_word: πεποιθότες
  choice: não depositamos confiança
  rationale: Expressa a confiança estabelecida indicada pelo particípio perfeito e forma um contraste claro com «nos gloriamos».
- source_word: γάρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a advertência do versículo anterior.
theological_decisions:
- issue: Sentido de σάρξ neste versículo
  choice: «carne» refere-se principalmente a fundamentos corporais e humanos de confiança religiosa, como circuncisão, origem e posição
  alternative: «natureza pecaminosa» como princípio moral interior
  rationale: O contexto imediato enumera circuncisão, linhagem, observância da Lei e posição religiosa, favorecendo o sentido de credenciais humanas e corporais.
- issue: Força de πνεύματι θεοῦ
  choice: o Espírito de Deus é o meio ou a esfera da adoração
  alternative: o espírito humano ou «adorar a Deus espiritualmente»
  rationale: A leitura θεοῦ da SBLGNT aponta naturalmente para o Espírito divino, embora a relação dativa permita nuances de meio ou esfera.
- issue: Identidade da «circuncisão»
  choice: Paulo aplica o termo ao grupo caracterizado pela adoração no Espírito, pela glória no Messias Jesus e pela ausência de confiança na carne
  alternative: referência estritamente à circuncisão física
  rationale: A construção predicativa e as qualificações seguintes produzem uma redefinição retórica da identidade da aliança, sem apagar o sentido concreto do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «nós é que somos» transmite a ênfase de ἡμεῖς; os dois-pontos introduzem com naturalidade as características participiais. Os marcadores foram colocados junto aos elementos correspondentes; a nota textual geral aparece ao fim do versículo.
