  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: pt
  text: quanto ao zelo, perseguidor da igreja; quanto à justiça que há na Lei[a], tendo me tornado irrepreensível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto à justiça sob a Lei”. Grego: “na Lei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: quanto a
  rationale: Introduz cada aspecto pelo qual Paulo avalia suas antigas credenciais e preserva a estrutura retórica repetida.
- source_word: ζῆλος
  choice: zelo
  rationale: É a correspondência direta e natural para a intensidade de seu antigo compromisso religioso.
- source_word: διώκων
  choice: perseguidor
  rationale: O particípio descreve ação hostil contínua contra a comunidade cristã; a forma nominal produz uma frase natural dentro da lista de credenciais.
- source_word: ἐκκλησίαν
  choice: igreja
  rationale: No contexto paulino, designa a comunidade cristã, não uma assembleia genérica.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Em português bíblico corrente, 'justiça' expressa adequadamente a condição de conformidade avaliada pela lei; aqui não significa apenas justiça distributiva.
- source_word: ἐν νόμῳ
  choice: que há na lei
  rationale: Preserva de modo natural a formulação atributiva grega e sua ambiguidade entre esfera e padrão, sem substituir diretamente 'na lei' por uma interpretação como 'sob a lei'.
- source_word: γενόμενος
  choice: tendo me tornado
  rationale: Mantém o valor verbal e perfectivo do particípio aoristo, em vez de reduzi-lo a um simples adjetivo.
- source_word: ἄμεμπτος
  choice: irrepreensível
  rationale: Indica ausência de acusação dentro do critério declarado, sem afirmar impecabilidade absoluta.
theological_decisions:
- issue: Alcance da alegação de irrepreensibilidade de Paulo
  choice: A irrepreensibilidade é qualificada pela justiça que há na lei.
  alternative: Paulo estaria alegando impecabilidade moral absoluta diante de Deus.
  rationale: A sintaxe vincula 'irrepreensível' à justiça definida por sua relação com a lei; a afirmação integra a descrição das antigas credenciais de Paulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo preservado. A opção 'perseguidor' mantém a concisão da enumeração; 'irrepreensível' evita sugerir perfeição sem pecado.
