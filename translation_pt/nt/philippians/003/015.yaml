id: PHP.3.15
reference: Philippians 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: pt
  text: Portanto, todos nós que somos maduros[a] pensemos dessa maneira[b]; e, se em alguma coisa vocês pensam de modo diferente, Deus também revelará isso a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perfeitos”. A palavra grega pode ter esse sentido, mas aqui provavelmente se refere à maturidade espiritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “tenhamos esse modo de pensar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão ou inferência baseada no argumento anterior de Paulo, com clareza e naturalidade em português.
- source_word: ὅσοι
  choice: todos nós que somos
  rationale: Preserva o alcance inclusivo da expressão grega e a referência ao grupo do qual Paulo participa.
- source_word: τέλειοι
  choice: maduros
  rationale: No contexto, descreve maturidade espiritual, não perfeição absoluta; a nota preserva a alternativa lexical literal.
- source_word: τοῦτο φρονῶμεν
  choice: pensemos dessa maneira
  rationale: O subjuntivo tem força exortativa, e o demonstrativo remete à atitude descrita nos versículos anteriores.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: se em alguma coisa vocês pensam de modo diferente
  rationale: Mantém a condição, o alcance indefinido de τι e a ideia de uma divergência de perspectiva.
- source_word: ἀποκαλύψει
  choice: revelará
  rationale: Equivalente direto que conserva a ideia de Deus tornar algo conhecido.
theological_decisions:
- issue: Sentido de τέλειοι na exortação de Paulo
  choice: maduros
  alternative: perfeitos
  rationale: O contexto imediato mostra Paulo reconhecendo que ainda não alcançou a meta plenamente. “Maduros” comunica o sentido contextual sem apagar a possibilidade lexical de “perfeitos”, registrada em nota.
- issue: Referência de τοῦτο
  choice: dessa maneira
  alternative: isto
  rationale: A expressão aponta para a disposição ou maneira de pensar exposta anteriormente. A tradução torna essa referência inteligível sem especificar além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva o tom inclusivo e exortativo de Paulo.
