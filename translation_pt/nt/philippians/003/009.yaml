    rationale: Na trilha inglesa, a segunda nota esclarece a possibilidade de traduzir δικαιοσύνη por «justiça». Como o português emprega «justiça» nas duas ocorrências, a nota deve oferecer «retidão» para ambas, preservando a decisão terminológica declarada e uma alternativa lexical informativa.
