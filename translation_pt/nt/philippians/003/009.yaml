  source_fidelity: 'O texto preserva adequadamente a estrutura e o contraste do grego: ser encontrado nele, sem justiça própria oriunda da Lei, mas com a justiça por meio da fé no Messias, procedente de Deus e fundada na fé. Contudo, «uma justiça própria» enfraquece a posse explicitamente marcada por ἐμήν («minha»).'
  naturalness: A redação é clara, moderna e apropriada ao registro paulino. «Minha própria justiça» é igualmente natural e torna explícita uma ênfase presente no original.
  terminology: «Justiça» é uma opção portuguesa legítima para δικαιοσύνη e é usada coerentemente nas duas ocorrências. «Messias» preserva o valor titular de Χριστός. A nota b atual, porém, apenas repete em formulação alternativa «baseada na fé» e não corresponde à alternativa lexical de δικαιοσύνη registrada na trilha de auditoria; deve abranger ambas as ocorrências de «justiça».
