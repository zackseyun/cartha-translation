  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: pt
  text: e ser encontrado nele, não tendo minha própria justiça, proveniente da Lei, mas a que vem mediante a fé no Messias[a] — a justiça que vem de Deus, baseada na fé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mediante a fidelidade do Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “retidão” (nas duas ocorrências de “justiça”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: ser encontrado
  rationale: Preserva diretamente o aoristo passivo subjuntivo e sua nuance de propósito ou resultado no contexto.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém a formulação paulina ampla de união com o Messias sem reduzi-la a uma explicação interpretativa.
- source_word: μὴ ἔχων
  choice: não tendo
  rationale: Conserva a forma participial que descreve o estado em que Paulo deseja ser encontrado.
- source_word: ἐμὴν δικαιοσύνην τὴν ἐκ νόμου
  choice: uma justiça própria, proveniente da Lei
  rationale: Expressa idiomaticamente a posse enfática e a origem indicada por ἐκ; a inicial maiúscula identifica a Lei no contexto paulino sem acrescentar 'de Moisés'.
- source_word: διὰ πίστεως Χριστοῦ
  choice: mediante a fé no Messias
  rationale: Adota no texto principal a leitura objetiva do genitivo, mas preserva em nota a leitura subjetiva genuinamente possível.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Traduz o valor titular de Χριστός em linguagem portuguesa clara e corrente.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: a justiça que vem de Deus
  rationale: A oração relativa soa natural em português e mantém Deus como a fonte dessa justiça.
- source_word: ἐπὶ τῇ πίστει
  choice: baseada na fé
  rationale: Comunica de modo conciso a relação de base ou fundamento indicada por ἐπί com o dativo, sem eliminar outras nuances possíveis.
theological_decisions:
- issue: Sentido de πίστεως Χριστοῦ
  choice: fé no Messias
  alternative: fidelidade do Messias
  rationale: O genitivo pode ser entendido objetiva ou subjetivamente. A leitura objetiva aparece no texto, enquanto a alternativa subjetiva é explicitada em nota para preservar a tensão exegética.
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: Em português, 'justiça' é o equivalente nominal mais natural e abrangente de δικαιοσύνη; 'retidão' pode destacar a qualidade moral ou o estado de conformidade e é registrada como alternativa.
- issue: Relação expressa por ἐπὶ τῇ πίστει
  choice: baseada na fé
  alternative: com base na fé; sobre a fé
  rationale: A formulação principal conserva a ideia de base ou fundamento sem definir além do necessário a relação precisa da frase com a justiça que vem de Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e as repetições essenciais do grego foram preservadas, mas a expressão 'uma justiça própria' e a oração 'que vem de Deus' dão naturalidade ao período. Todos os marcadores de nota aparecem no texto principal.
