  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: pt
  text: Quanto ao mais[a], meus irmãos[b], alegrem-se no Senhor. Escrever a vocês as mesmas coisas não me é incômodo[c], mas é uma segurança para vocês[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Finalmente» ou «Daqui em diante».
    reason: lexical_alternative
  - marker: b
    text: Aqui, «irmãos» se dirige à congregação inteira, isto é, aos irmãos e às irmãs.
    reason: cultural_note
  - marker: c
    text: Ou «não me dá trabalho» ou «não me é enfadonho».
    reason: lexical_alternative
  - marker: d
    text: Ou «serve de salvaguarda para vocês».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Quanto ao mais
  rationale: Funciona como marcador de transição discursiva e evita sugerir necessariamente que a carta esteja chegando ao fim; «Finalmente» e «Daqui em diante» continuam possíveis.
- source_word: ἀδελφοί μου
  choice: meus irmãos
  rationale: Preserva a forma masculina plural do grego; no contexto, o vocativo se dirige à comunidade inteira, como esclarece a nota.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: Traduz o imperativo plural de χαίρω em linguagem portuguesa atual, preservando a força de exortação.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém diretamente a formulação teológica paulina, situando a alegria na relação com o Senhor.
- source_word: τὰ αὐτά
  choice: as mesmas coisas
  rationale: Preserva a referência ampla e não especificada do grego, sem decidir quais ensinos ou exortações Paulo repete.
- source_word: γράφειν
  choice: escrever
  rationale: O infinitivo português se ajusta naturalmente à construção predicativa da frase.
- source_word: οὐκ ὀκνηρόν
  choice: não me é incômodo
  rationale: Comunica que repetir por escrito não pesa sobre Paulo nem o faz hesitar, sem restringir o sentido à ideia de tédio.
- source_word: ἀσφαλές
  choice: lhes dá segurança
  rationale: Expressa de modo natural em português o valor predicativo de ἀσφαλές e sua ideia de segurança ou proteção; a alternativa mais nominal é registrada em nota.
theological_decisions:
- issue: Forma de tratamento dirigida à congregação
  choice: meus irmãos
  alternative: meus irmãos e irmãs
  rationale: A forma principal conserva o masculino plural gramatical do grego, enquanto a nota esclarece que, neste contexto, Paulo se dirige à congregação como um todo.
- issue: Caráter protetor da repetição de Paulo
  choice: lhes dá segurança
  alternative: serve de salvaguarda para vocês
  rationale: A tradução comunica a segurança expressa pelo adjetivo sem especificar indevidamente o mecanismo dessa proteção; a formulação mais metafórica permanece como alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. «Quanto ao mais» conserva melhor a abertura sem dar a impressão obrigatória de conclusão. O uso de «vocês» evita regionalismo excessivo, e «alegrem-se» mantém a exortação em registro corrente.
