id: PHP.3.19
reference: Philippians 3:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: pt
  text: O fim deles é a destruição; o deus deles é o ventre[a]; e a glória deles está na sua vergonha — eles têm a mente voltada para as coisas terrenas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o deus deles é o apetite”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pensam nas coisas terrenas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: fim
  rationale: “Fim” reproduz de modo compacto o termo grego e pode indicar tanto o término quanto o resultado final, sem explicitar além da fonte a ideia de destino.
- source_word: ἀπώλεια
  choice: destruição
  rationale: “Destruição” é uma forma moderna e natural de preservar a força severa, possivelmente escatológica, do substantivo grego.
- source_word: κοιλία
  choice: ventre
  rationale: “Ventre” mantém a metáfora corporal concreta do grego. Embora “apetite” possa expressar uma implicação possível, restringiria a imagem no texto principal.
- source_word: δόξα
  choice: glória
  rationale: “Glória” é o equivalente direto e conserva a ironia de eles valorizarem justamente aquilo que constitui sua vergonha.
- source_word: αἰσχύνη
  choice: vergonha
  rationale: “Vergonha” expressa de maneira concisa tanto a desonra quanto o caráter vergonhoso do referente.
- source_word: τὰ ἐπίγεια
  choice: as coisas terrenas
  rationale: A expressão é clara e próxima do plural neutro grego, abrangendo interesses e realidades pertencentes à esfera terrena.
- source_word: φρονοῦντες
  choice: só pensam
  rationale: No contexto, a construção caracteriza a orientação mental contínua dessas pessoas. “Pensam” é natural em português, e “só” comunica a força caracterizadora da expressão com o artigo, sem limitar o verbo a pensamentos ocasionais.
- source_word: ὧν ... ὧν
  choice: deles ... deles
  rationale: A repetição retoma naturalmente em português as pessoas mencionadas no versículo anterior e preserva a estrutura enfática das caracterizações.
theological_decisions:
- issue: Força metafórica de “o deus deles é o ventre”
  choice: Manter “ventre” no texto principal
  alternative: “o deus deles é o apetite”
  rationale: O grego emprega uma imagem corporal vívida que pode abranger apetite, desejo sensual ou devoção às necessidades físicas. A tradução concreta evita reduzir a metáfora a uma única interpretação.
- issue: Sentido de φρονοῦντες na cláusula final
  choice: “eles só pensam nas coisas terrenas”
  alternative: “mantêm a mente voltada para as coisas terrenas”
  rationale: A escolha comunica uma orientação mental habitual, não um pensamento momentâneo, mantendo em aberto a extensão exata das “coisas terrenas”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação preserva a sequência retórica das três caracterizações e destaca a cláusula participial final. “Ventre” foi preferido a “barriga” por conservar o registro solene sem ser arcaico.
