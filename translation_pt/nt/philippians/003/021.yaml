reference: Philippians 3:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: pt
  text: que transformará nosso corpo humilhado, tornando-o semelhante ao seu corpo glorioso[a], pelo poder com que ele é capaz até de sujeitar todas as coisas a si mesmo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ao corpo da sua glória”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “segundo a atuação pela qual ele é capaz até de sujeitar todas as coisas a si mesmo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: transformará
  rationale: Expressa uma mudança real de forma ou condição e preserva naturalmente o valor futuro do verbo.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: nosso corpo humilhado
  rationale: Comunica em português corrente a condição presente de humilhação ou rebaixamento do corpo, sem reduzir a expressão a mera fraqueza física.
- source_word: σύμμορφον
  choice: tornando-o semelhante
  rationale: Indica o resultado da transformação e conserva a forte correspondência de forma expressa pelo adjetivo grego, em linguagem natural.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: ao seu corpo glorioso
  rationale: Traduz idiomaticamente o genitivo sem perder a ideia de um corpo caracterizado pela glória.
- source_word: κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτόν
  choice: pelo poder com que ele é capaz
  rationale: ἐνέργεια denota força eficaz em operação; a formulação mantém tanto a ação poderosa quanto a capacidade de Cristo, evitando sugerir que uma força externa o capacita.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: sujeitar a si mesmo todas as coisas
  rationale: Preserva a força de submissão do verbo, o referente reflexivo e o alcance universal de τὰ πάντα.
theological_decisions:
- issue: Relação entre a humilhação corporal presente e a glorificação futura
  choice: A futura transformação torna o corpo presente dos fiéis semelhante ao corpo glorioso de Cristo.
  alternative: Explicitar que se trata da ressurreição ou definir seu mecanismo.
  rationale: O grego afirma transformação corporal e conformidade ao corpo glorioso de Cristo, mas neste versículo não explica o mecanismo; a tradução não acrescenta essa definição.
- issue: Fonte e natureza do poder de Cristo
  choice: A redação atribui a Cristo poder eficaz pelo qual ele pode sujeitar todas as coisas a si mesmo.
  alternative: “pelo poder que o capacita”, que poderia soar como poder recebido de uma fonte externa.
  rationale: A construção grega descreve a operação eficaz correspondente à capacidade dele, sem identificar aqui uma fonte externa de capacitação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Corpo humilhado” conserva mais da imagem grega do que “corpo humilde”; “corpo glorioso” evita uma construção genitiva pouco natural. Os marcadores aparecem no texto em ordem alfabética.
