source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: pt
  text: Não que eu já tenha alcançado isso[a] ou já tenha sido aperfeiçoado[b]; mas prossigo, para ver se também alcance aquilo para o qual também fui alcançado por Cristo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obtido isso”; o grego deixa o objeto implícito, a ser entendido pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “tenha me tornado perfeito” ou “tenha sido levado à plenitude”.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão grega traduzida por “para o qual” também pode ser entendida como causal: “por causa do qual”. Grego Christós, também traduzido por “Messias”.'
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: tenha alcançado isso
  rationale: O objeto permanece implícito no grego e é retomado do contexto; “isso” o explicita com discrição. “Alcançado” exprime aqui a ideia de obter ou atingir o alvo.
- source_word: τετελείωμαι
  choice: tenha sido aperfeiçoado
  rationale: A forma passiva preserva o perfeito passivo grego e comunica um estado resultante, sem definir em termos doutrinários posteriores em que consiste essa perfeição.
- source_word: διώκω
  choice: prossigo
  rationale: Expressa de modo natural o empenho contínuo de Paulo em avançar rumo ao alvo, sem recorrer ao sentido inadequado de perseguição neste contexto.
- source_word: καταλάβω
  choice: consigo tomar posse
  rationale: “Tomar posse” preserva a força concreta de alcançar e apropriar-se do alvo, além de permitir uma correspondência perceptível com o passivo seguinte.
- source_word: ἐφ’ ᾧ
  choice: daquilo para o qual
  rationale: 'Mantém a leitura final ou de propósito: Cristo alcançou Paulo tendo esse objetivo em vista, sem apagar totalmente a ambiguidade possível da construção.'
- source_word: κατελήμφθην
  choice: fui alcançado
  rationale: Preserva o passivo e a repetição do campo verbal de καταλαμβάνω. A formulação também evoca a iniciativa de Cristo sem acrescentar uma explicação não expressa no texto.
- source_word: Χριστοῦ
  choice: Cristo
  rationale: Em Paulo, Χριστός funciona frequentemente de maneira próxima a um nome, embora conserve seu valor titular; “Cristo” é a forma corrente em português.
theological_decisions:
- issue: Se τετελείωμαι deve sugerir perfeição sem pecado
  choice: já tenha sido aperfeiçoado
  alternative: já tenha me tornado perfeito; já tenha sido levado à plenitude
  rationale: O texto nega que Paulo já tenha chegado a um estado completo, mas não define esse estado segundo categorias doutrinárias posteriores. A tradução conserva a voz passiva e a tensão teológica.
- issue: Relação expressa por ἐφ’ ᾧ
  choice: daquilo para o qual
  alternative: porque também fui alcançado; com base no fato de que fui alcançado
  rationale: A leitura de propósito se ajusta bem ao alvo mencionado no contexto, mas a nota registra a possibilidade causal para preservar a ambiguidade real da expressão grega.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A repetição entre “alcançado” e a ideia de “tomar posse” procura refletir o jogo verbal grego sem produzir uma frase artificial. Os marcadores seguem a ordem em que aparecem no texto.
