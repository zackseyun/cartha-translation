  terminology: “Aperfeiçoado” preserva bem o perfeito passivo τετελείωμαι sem impor uma definição doutrinária. “Cristo” é a opção corrente e apropriada; a alternativa “Messias” pode permanecer em nota. “Alcançar” é preferível a “tomar posse” neste versículo por manter a correspondência lexical com “fui alcançado”.
