id: PHP.3.18
reference: Philippians 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: pt
  text: Pois muitos vivem como inimigos da cruz do Messias[a]. Muitas vezes falei a vocês a respeito deles, e agora falo até chorando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”.'
    reason: Registra a tradução tradicional alternativa do título grego Χριστός.
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado indica, de modo direto, um número considerável de pessoas.
- source_word: γὰρ
  choice: pois
  rationale: A conjunção fundamenta a exortação anterior e mantém sua função explicativa.
- source_word: περιπατοῦσιν
  choice: vivem
  rationale: O verbo é empregado metaforicamente para o modo de viver. “Vivem” comunica esse sentido com naturalidade no português atual, sem sugerir mero deslocamento físico.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: muitas vezes falei a vocês
  rationale: O imperfeito com πολλάκις expressa ação repetida no passado; esta formulação preserva a reiteração e soa natural.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: agora falo até chorando
  rationale: Mantém o contraste temporal, a força intensificadora de καί e a ação simultânea indicada pelo particípio presente κλαίων.
- source_word: ἐχθροὺς
  choice: inimigos
  rationale: É o equivalente direto e forte para pessoas que se opõem à cruz.
- source_word: σταυροῦ
  choice: cruz
  rationale: Designa a morte por crucificação e, no contexto, seu significado teológico; “cruz” é a tradução direta estabelecida.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Aqui Χριστός funciona naturalmente como título; “Messias” torna explícito seu significado, enquanto “Cristo” permanece uma alternativa tradicional legítima.
theological_decisions:
- issue: Tradução de Χριστοῦ como título ou designação tradicional
  choice: Messias
  alternative: Cristo
  rationale: O genitivo na expressão “a cruz do Χριστός” admite a leitura titular. “Messias” preserva o conteúdo do título sem negar a forma tradicional “Cristo”, registrada em nota.
- issue: Relação sintática entre “vivem” e “inimigos”
  choice: vivem como inimigos
  alternative: muitos vivem... [eles] são inimigos
  rationale: O grego apresenta ἐχθρούς em aposição aos muitos mencionados, numa construção interrompida pela oração relativa. “Vivem como inimigos” comunica com clareza essa identificação sem decidir além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa estrutura grega foi dividida em duas frases para evitar ambiguidade referencial; a ordem lógica e a intensidade emocional foram preservadas. O marcador [a] aparece no texto junto ao termo a que a nota se refere.
