id: PHP.3.20
reference: Philippians 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: pt
  text: Pois a nossa cidadania está nos céus[a], de onde também aguardamos ansiosamente um Salvador, o Senhor Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a nossa comunidade política está nos céus».
    reason: lexical_alternative
  - marker: b
    text: Ou «o Senhor Jesus Cristo».
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: cidadania
  rationale: Preserva de modo claro e natural a força cívica do substantivo no contraste contextual entre a orientação terrena e a pertença dos fiéis.
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural do grego e corresponde a uma expressão natural e consagrada em português.
- source_word: ὑπάρχει
  choice: está
  rationale: Expressa naturalmente a localização ou pertença presente da cidadania; «existe» seria excessivamente rígido neste contexto.
- source_word: ἐξ οὗ
  choice: de onde
  rationale: Retoma espacialmente «os céus» e indica a procedência daquele que é aguardado.
- source_word: σωτῆρα
  choice: um Salvador
  rationale: «Salvador» preserva o sentido lexical e o peso cristológico; o artigo indefinido reproduz a construção predicativa do grego sem sugerir que seja um salvador entre vários.
- source_word: ἀπεκδεχόμεθα
  choice: aguardamos ansiosamente
  rationale: Comunica a espera contínua, intensa e cheia de expectativa expressa pelo verbo composto.
- source_word: κύριον
  choice: Senhor
  rationale: É o equivalente português normal e adequado no uso cristológico do Novo Testamento.
- source_word: Χριστόν
  choice: o Messias
  rationale: Traduz o valor titular de Χριστός em linguagem portuguesa idiomática, em vez de tratá-lo apenas como parte convencional de um nome.
theological_decisions:
- issue: Sentido de πολίτευμα
  choice: cidadania
  alternative: comunidade política
  rationale: «Cidadania» conserva a dimensão cívica e a pertença dos fiéis sem definir em excesso se o termo designa o estatuto dos cidadãos ou a comunidade política à qual pertencem.
- issue: Tradução de Χριστόν na sequência κύριον Ἰησοῦν Χριστόν
  choice: o Senhor Jesus, o Messias
  alternative: o Senhor Jesus Cristo
  rationale: A aposição com artigo em português torna explícita a força titular de Χριστός. A forma tradicional «Cristo» continua indicada em nota para preservar a alternativa convencional.
- issue: Relação sintática de σωτῆρα com κύριον Ἰησοῦν Χριστόν
  choice: um Salvador, o Senhor Jesus, o Messias
  alternative: como Salvador, o Senhor Jesus Cristo
  rationale: A aposição identifica diretamente o Salvador aguardado sem acrescentar «como», ausente do grego, e preserva a ênfase escatológica da frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pois» preserva a ligação explicativa de γάρ; a ordem da frase segue de perto o grego sem sacrificar a naturalidade. A vírgula antes de «o Messias» marca a aposição titular e evita a forma pouco idiomática «Jesus Messias».
