id: PHP.3.17
reference: Philippians 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: pt
  text: Irmãos[a], unam-se em me imitar e prestem atenção aos que andam desse modo[b], assim como vocês têm a nós por modelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; a forma grega é masculina plural, mas provavelmente se dirige a toda a comunidade.
    reason: cultural_note
  - marker: b
    text: Isto é, “vivem desse modo”. “Andar” é uma metáfora para a maneira de viver.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: sejam todos meus imitadores
  rationale: A construção combina o substantivo que indica imitadores em conjunto com o imperativo de γίνομαι. “Sejam todos meus imitadores” comunica de modo natural tanto a ordem quanto a dimensão coletiva, sem recorrer ao pouco idiomático “coimitadores”.
- source_word: ἀδελφοί
  choice: Irmãos
  rationale: Conserva a forma vocativa masculina plural do grego; uma nota esclarece que, no contexto, a saudação provavelmente abrange toda a comunidade.
- source_word: σκοπεῖτε
  choice: prestem atenção
  rationale: Expressa a ideia de observar cuidadosamente e tomar como referência, em linguagem portuguesa atual.
- source_word: οὕτω περιπατοῦντας
  choice: os que andam desse modo
  rationale: Preserva a metáfora paulina de “andar” como conduta de vida e mantém οὕτω como “desse modo”.
- source_word: τύπον
  choice: modelo
  rationale: Neste contexto, τύπος designa um exemplo ou padrão a ser seguido. “Modelo” é claro e natural, sem enfraquecer a função exemplar.
- source_word: ἡμᾶς
  choice: a nós
  rationale: Mantém o pronome plural do texto grego, sem reduzi-lo apenas a Paulo.
theological_decisions:
- issue: Alcance inclusivo de ἀδελφοί
  choice: Manter “Irmãos” no texto e esclarecer em nota a provável referência a toda a comunidade.
  alternative: Traduzir “irmãos e irmãs” diretamente no texto principal.
  rationale: A forma grega é masculina plural, mas o contexto de uma exortação à igreja inteira favorece um alcance comunitário inclusivo. A nota preserva simultaneamente a forma e o provável referente.
- issue: Plural de ἡμᾶς
  choice: Manter “a nós”.
  alternative: Empregar “a mim” ou reformular como se Paulo fosse o único modelo.
  rationale: O plural é explícito no grego e provavelmente inclui Paulo e seus colaboradores; não deve ser harmonizado com o singular “meus imitadores” da primeira oração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi mantida direta; “vocês” torna explícito o sujeito de ἔχετε de modo natural. A metáfora de andar foi preservada e explicada em nota.
