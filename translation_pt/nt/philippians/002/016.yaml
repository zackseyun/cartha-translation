  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: pt
  text: mantendo firmemente a palavra da vida[a], para que eu tenha motivo de me gloriar no dia do Messias[b], pois não corri em vão nem trabalhei em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresentando ou oferecendo a palavra da vida”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “o dia de Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: a palavra da vida
  rationale: 'Preserva a expressão grega compacta e sua possível dupla força: a palavra que comunica vida e a palavra a respeito da vida.'
- source_word: ἐπέχοντες
  choice: mantendo firme
  rationale: O verbo pode indicar tanto apegar-se firmemente quanto estender ou oferecer. No fluxo da exortação à perseverança e à obediência, “mantendo firme” se encaixa bem; o sentido de apresentação pública fica registrado em nota.
- source_word: καύχημα
  choice: motivo de me gloriar
  rationale: Expressa de modo natural aquilo que dá ocasião a uma glória legítima, sem sugerir orgulho autônomo ou vaidade.
- source_word: ἡμέραν Χριστοῦ
  choice: dia do Messias
  rationale: Χριστός mantém aqui força titular na expressão escatológica; “Messias” comunica essa dimensão, enquanto a forma tradicional é indicada em nota.
- source_word: οὐκ εἰς κενὸν
  choice: não ... em vão
  rationale: Equivalente português claro e conciso para a ideia de esforço vazio ou sem resultado, preservando o paralelismo.
- source_word: ἔδραμον
  choice: corri
  rationale: Mantém a metáfora paulina da corrida para o curso e esforço do ministério.
- source_word: ἐκοπίασα
  choice: trabalhei
  rationale: Verbo corrente e digno que comunica labor intenso; no contexto, a repetição de “em vão” conserva a força retórica do grego.
theological_decisions:
- issue: Tradução de Χριστοῦ numa expressão titular escatológica
  choice: do Messias
  alternative: de Cristo
  rationale: Em “dia do Messias”, Χριστός funciona como título régio e escatológico, não apenas como nome próprio. A alternativa tradicional permanece em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “motivo de me gloriar” evita a rigidez de uma reprodução literal de καύχημα ἐμοὶ, e o paralelismo final conserva a cadência enfática do original.
