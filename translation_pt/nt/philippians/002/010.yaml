    reason: lexical_alternative
  - marker: b
    text: Literalmente, «dos celestiais, dos terrestres e dos que estão debaixo da terra»; a tradução expressa os dois primeiros termos como âmbitos para soar natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente em português a finalidade ou o resultado decorrente da afirmação anterior, preservando o valor télico da conjunção.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: ao nome de Jesus
  rationale: No contexto de reverência, indica a reação diante do nome, da posição e da honra de Jesus. A alternativa «em nome de Jesus» permanece possível, mas pode sugerir mais facilmente representação ou autoridade delegada.
- source_word: πᾶν γόνυ
  choice: todo joelho
  rationale: Mantém a imagem corporal vívida de homenagem universal, em vez de substituí-la por uma referência abstrata a todas as pessoas ou seres.
- source_word: κάμψῃ
  choice: se dobre
  rationale: O subjuntivo depois de ἵνα é representado naturalmente por «se dobre»; a forma reflexiva é idiomática em português para o gesto de reverência.
- source_word: ἐπουρανίων
  choice: dos que estão no céu
  rationale: Representa o adjetivo genitivo substantivado sem definir indevidamente a identidade dos seres abrangidos.
- source_word: ἐπιγείων
  choice: na terra
  rationale: Integra-se à expressão distributiva iniciada por «dos que estão», preservando o segundo âmbito da tríade cósmica.
- source_word: καταχθονίων
  choice: debaixo da terra
  rationale: Conserva a imagem espacial grega sem introduzir um termo mais interpretativo como «mundo dos mortos» ou «inferno».
theological_decisions:
- issue: Alcance da expressão tríplice ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: Preservar o alcance cósmico e universal por meio de «dos que estão no céu, na terra e debaixo da terra».
  alternative: Identificar explicitamente os grupos como anjos, seres humanos e mortos, ou como anjos, pessoas e demônios.
  rationale: O texto enfatiza a homenagem universal a Jesus, mas não especifica a identidade exata de cada grupo. A tradução mantém essa amplitude e evita impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «ao nome de Jesus» preserva uma formulação solene ainda corrente no uso bíblico. Os travessões delimitam a especificação distributiva sem transformar os três grupos apenas em lugares onde o gesto ocorre.
