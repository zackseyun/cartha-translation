  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: pt
  text: Portanto, espero enviá-lo assim que eu vir claramente como estão as coisas comigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: enviá-lo
  rationale: O demonstrativo acusativo retoma Timóteo no contexto imediato; o pronome oblíquo é a forma natural em português.
- source_word: μὲν οὖν
  choice: Portanto
  rationale: Marca uma transição inferencial; “Portanto” comunica com clareza a ligação com o que precede.
- source_word: ἐλπίζω πέμψαι
  choice: espero enviá-lo
  rationale: Preserva diretamente a ideia de esperança ou expectativa expressa por ἐλπίζω com o infinitivo πέμψαι.
- source_word: ὡς ἂν ἀφίδω
  choice: assim que eu souber
  rationale: A construção aponta para um momento futuro condicionado a Paulo tomar conhecimento mais claro de sua situação; “assim que eu souber” é idiomático e mantém o valor temporal.
- source_word: τὰ περὶ ἐμέ
  choice: como ficará a minha situação
  rationale: A expressão refere-se às circunstâncias pessoais de Paulo, provavelmente ao desfecho de sua condição presente; esta formulação comunica o sentido situacional sem literalismo obscuro.
- source_word: ἐξαυτῆς
  choice: assim que
  rationale: O advérbio acrescenta a ideia de prontidão imediata, incorporada naturalmente à locução temporal “assim que”.
