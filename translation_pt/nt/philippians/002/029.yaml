lexical_decisions:
- source_word: προσδέχεσθε
  choice: acolham
  rationale: O imperativo indica uma recepção favorável e calorosa, não mera aceitação; “acolham” expressa isso de modo natural em português.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva de forma clara a relação conclusiva com o que Paulo acaba de dizer.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Mantém a formulação paulina compacta e sua dimensão relacional e espiritual, sem explicá-la além do texto.
- source_word: μετὰ πάσης χαρᾶς
  choice: com toda a alegria
  rationale: Reproduz a ideia de plenitude expressa por πάσης e é idiomático em português.
- source_word: τοὺς τοιούτους
  choice: pessoas como ele
  rationale: Apresenta Epafrodito como exemplo de uma categoria de pessoas e comunica naturalmente a força referencial da expressão grega; o masculino plural do original é registrado em nota.
- source_word: ἐντίμους ἔχετε
  choice: tenham em alta estima
  rationale: Expressa a ideia de considerar e tratar essas pessoas como dignas de honra, em linguagem portuguesa corrente e digna.
