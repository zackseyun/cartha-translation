  text: Portanto, acolham-no no Senhor com toda a alegria e tenham em alta estima pessoas como ele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens como ele”. O grego emprega aqui uma expressão no masculino plural.'
