lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da afirmação em relação ao contexto anterior.
- source_word: οὐδένα ... ἔχω
  choice: não tenho ninguém
  rationale: Reproduz de modo direto e natural a construção grega, sem acrescentar explicitamente “mais”.
- source_word: ἰσόψυχον
  choice: de igual disposição
  rationale: Expressa a ideia de afinidade interior ou de ânimo sem determinar expressamente com quem se faz a comparação, algo que o grego deixa implícito.
- source_word: ὅστις
  choice: que
  rationale: O pronome relativo português liga naturalmente a pessoa de igual disposição à ação que ela realizará.
- source_word: γνησίως
  choice: sinceramente
  rationale: Comunica autenticidade e sinceridade de modo corrente e digno.
- source_word: τὰ περὶ ὑμῶν
  choice: do que diz respeito a vocês
  rationale: Preserva a amplitude da expressão grega, que pode abranger circunstâncias, interesses e bem-estar dos destinatários.
- source_word: μεριμνήσει
  choice: cuide
  rationale: Neste contexto, o verbo indica preocupação pastoral positiva, não ansiedade indevida; “cuide” transmite isso naturalmente.
