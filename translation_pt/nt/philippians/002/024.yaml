id: PHP.2.24
reference: Philippians 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: pt
  text: Porém, estou confiante no Senhor de que eu mesmo também irei em breve.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Confio no Senhor de que eu mesmo também irei em breve.”'
    reason: Alternativa lexical para πέποιθα e para a construção da frase.
lexical_decisions:
- source_word: πέποιθα
  choice: tenho confiança
  rationale: O perfeito expressa um estado presente e consolidado de confiança. “Tenho confiança” comunica esse valor de modo natural, sem transformar a expectativa em certeza autônoma.
- source_word: δὲ
  choice: porém
  rationale: Marca uma transição leve no discurso. “Porém” mantém a conexão, sem lhe atribuir uma oposição forte.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a expressão paulina e apresenta o Senhor como a esfera ou o fundamento da confiança de Paulo.
- source_word: ὅτι
  choice: de que
  rationale: Introduz naturalmente em português o conteúdo da confiança após a construção “ter confiança”.
- source_word: καὶ αὐτὸς
  choice: eu mesmo também
  rationale: “Eu mesmo” conserva a ênfase pessoal de αὐτός, enquanto “também” preserva o valor aditivo de καί em relação ao envio de Timóteo.
- source_word: ταχέως
  choice: em breve
  rationale: Neste contexto, indica proximidade temporal, não rapidez no modo de viajar.
- source_word: ἐλεύσομαι
  choice: irei
  rationale: Embora ἔρχομαι tenha como sentido básico “vir”, o português normalmente adota “ir” quando o falante está distante do destino. “Irei” expressa naturalmente o deslocamento futuro de Paulo até os destinatários.
- source_word: κυρίῳ
  choice: Senhor
  rationale: É a tradução corrente de κύριος e corresponde ao uso cristológico paulino neste contexto.
theological_decisions:
- issue: Natureza da confiança de Paulo em relação ao Senhor
  choice: tenho confiança no Senhor
  alternative: confio no Senhor que
  rationale: A formulação mantém a expectativa de Paulo fundamentada no Senhor, sem apresentá-la como simples otimismo pessoal nem como revelação direta e infalível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem “eu mesmo também” conserva tanto a ênfase pessoal quanto o sentido aditivo do grego.
