- from: Tenho, porém, confiança no Senhor de que eu mesmo também irei em breve.[a]
  to: Porém, estou confiante no Senhor de que eu mesmo também irei em breve.[a]
  rationale: A revisão substitui a locução pouco natural "tenho confiança" por "estou confiante", que expressa bem o estado resultante do perfeito πέποιθα. Mantém-se "Porém" para o δέ continuativo, "no Senhor" para ἐν κυρίῳ, e "eu mesmo também" para conservar a ênfase pessoal e o sentido aditivo. A nota foi corrigida para eliminar a ambiguidade sintática, sem alterar o sentido.
