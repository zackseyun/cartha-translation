base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: pt
  text: pois ele estava com saudade de todos vocês e profundamente angustiado porque vocês souberam que ele tinha adoecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ele soube que vocês tinham ouvido dizer que ele estava doente”.'
    reason: Alternativa que explicita como subentendido o fato de Epafrodito ter tomado conhecimento de que os filipenses haviam recebido a notícia de sua doença.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: pois
  rationale: Introduz a razão explicativa para o envio de Epafrodito e se encaixa naturalmente na continuação da frase anterior.
- source_word: ἐπιποθῶν ἦν
  choice: estava com saudade
  rationale: A construção perifrástica expressa um estado contínuo no passado. No contexto de alguém separado de pessoas queridas, “estar com saudade” comunica de modo natural o forte desejo de revê-las.
- source_word: πάντας ὑμᾶς
  choice: todos vocês
  rationale: Preserva a ênfase inclusiva de πάντας e é claro tanto no português brasileiro quanto no português internacional.
- source_word: ἀδημονῶν
  choice: profundamente angustiado
  rationale: O termo indica aflição emocional intensa, mais forte que mera preocupação.
- source_word: διότι
  choice: porque
  rationale: Expressa diretamente a causa da angústia de Epafrodito.
- source_word: ἠκούσατε
  choice: vocês souberam
  rationale: Neste contexto, o verbo se refere ao recebimento da notícia da doença; “souberam” é mais idiomático em português do que o literal “ouviram”.
- source_word: ὅτι ἠσθένησεν
  choice: que ele tinha adoecido
  rationale: ἀσθενέω se refere aqui a enfermidade física. O mais-que-perfeito composto deixa clara a anterioridade da doença em relação ao recebimento da notícia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural para leitores brasileiros. “Estava com saudade” evita rigidez literal sem enfraquecer a intensidade afetiva; “profundamente angustiado” conserva a força emocional do grego.
