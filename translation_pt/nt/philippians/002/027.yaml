source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: pt
  text: Pois, de fato, ele esteve doente, quase à morte[a]. Mas Deus teve misericórdia dele — e não somente dele, mas também de mim —, para que eu não tivesse tristeza sobre tristeza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “esteve à beira da morte” ou “chegou ao ponto de morrer”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tristeza sobre tristeza”, expressão que comunica tristeza acumulada ou uma dor somada a outra.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: adoeceu
  rationale: No contexto, o verbo se refere a uma enfermidade física. O aoristo pode ser expresso naturalmente por “adoeceu”, sem reduzir o sentido a fraqueza genérica.
- source_word: παραπλήσιον θανάτῳ
  choice: chegou perto da morte
  rationale: A expressão indica grande proximidade da morte sem afirmar que ela ocorreu. Esta formulação é clara e idiomática em português.
- source_word: ἠλέησεν αὐτόν
  choice: teve misericórdia dele
  rationale: Preserva tanto a compaixão divina quanto o peso teológico usual de ἐλεάω, sem especificar de que maneira a misericórdia foi exercida.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: e não somente dele, mas também de mim
  rationale: Retoma explicitamente o complemento de “teve misericórdia” e conserva o contraste enfático entre Epafrodito e Paulo.
- source_word: ἵνα μὴ
  choice: para que eu não
  rationale: Mantém o valor de finalidade ou resultado pretendido da construção grega, em português natural.
- source_word: λύπην ἐπὶ λύπην
  choice: tristeza sobre tristeza
  rationale: Conserva a repetição e a imagem cumulativa da expressão grega, deixando a nota esclarecer seu efeito idiomático.
- source_word: σχῶ
  choice: tivesse
  rationale: O verbo ἔχω tem aqui o sentido amplo de ter ou experimentar tristeza; “tivesse” é direto e natural no contexto da oração final.
theological_decisions:
- issue: Relação entre a misericórdia de Deus e a recuperação de Epafrodito
  choice: Manter apenas a afirmação de que Deus teve misericórdia dele
  alternative: Explicitar que Deus o curou milagrosamente
  rationale: O versículo associa a sobrevivência de Epafrodito à misericórdia divina, mas não descreve o meio nem caracteriza explicitamente a recuperação como milagre. A tradução não deve acrescentar essa especificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois, de fato” preserva o valor confirmatório e explicativo de καὶ γάρ. Os travessões destacam a ampliação enfática da misericórdia de Deus a Paulo sem alterar a sintaxe básica.
