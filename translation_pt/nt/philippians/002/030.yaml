source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: pt
  text: pois, por causa da obra do Messias[a], ele chegou perto da morte, arriscando a própria vida para suprir o que faltava no serviço de vocês a mim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. Grego: “a obra de Cristo/Messias”.'
    reason: alternative_reading
  - marker: b
    text: “O que faltava” se refere ao serviço que os filipenses, por estarem ausentes, não podiam prestar pessoalmente, e não a uma falta de disposição da parte deles.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: pela obra do Messias
  rationale: διά com acusativo indica aqui causa ou motivo, podendo também sugerir dedicação à obra; “pela obra” preserva essa amplitude de modo natural em português.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Traduz o título Χριστός por seu valor semântico, em vez de apenas transliterá-lo; “Cristo” é registrado em nota como alternativa tradicional.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: chegou perto da morte
  rationale: Expressa com clareza e proximidade formal que ele chegou ao ponto de quase morrer.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: arriscando a própria vida
  rationale: O particípio descreve exposição voluntária ao perigo, e ψυχή refere-se aqui à vida terrena, não à alma imaterial.
- source_word: ἵνα ἀναπληρώσῃ
  choice: para suprir
  rationale: A oração com ἵνα indica propósito; “suprir” comunica completar aquilo que não podia ser fornecido diretamente.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: o que faltava
  rationale: Mantém a formulação sem sugerir culpa moral ou falta de disposição dos filipenses.
- source_word: τῆς πρός με λειτουργίας
  choice: no serviço de vocês para comigo
  rationale: λειτουργία designa aqui serviço ou auxílio prático; a formulação conserva seu sentido amplo sem restringi-lo a um ofício religioso.
theological_decisions:
- issue: Tradução de Χριστοῦ na expressão paulina
  choice: do Messias
  alternative: de Cristo
  rationale: O termo funciona como título e “Messias” torna explícito seu conteúdo semântico; a forma eclesiástica tradicional permanece indicada em nota.
- issue: Sentido de τὸ ὑμῶν ὑστέρημα
  choice: uma ausência prática que Epafrodito supriu
  alternative: uma deficiência moral ou falta de disposição dos filipenses
  rationale: O contexto apresenta Epafrodito como representante da comunidade distante; não acusa os filipenses de negligência.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Vocês” representa o plural ὑμῶν; “para comigo” evita a possível leitura de que o serviço pertencia a Paulo, embora tenha um tom levemente mais formal.
