  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: pt
  text: completem a minha alegria, para que pensem do mesmo modo, tendo o mesmo amor, unidos de alma[a] e pensando uma só coisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo uma só alma”; alternativamente, “unidos em espírito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltados para um só propósito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: completem a minha alegria
  rationale: O imperativo pede que a alegria de Paulo seja levada à sua medida plena. “Completem” preserva a imagem de plenitude e soa natural em português.
- source_word: ἵνα τὸ αὐτὸ φρονῆτε
  choice: para que pensem do mesmo modo
  rationale: ἵνα introduz o conteúdo ou resultado pretendido da exortação, enquanto φρονέω indica modo de pensar, disposição ou orientação interior, não apenas um pensamento isolado.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: tendo o mesmo amor
  rationale: Mantém de perto a construção participial grega e traduz ἀγάπη pelo termo corrente e abrangente “amor”.
- source_word: σύμψυχοι
  choice: unidos de alma
  rationale: Preserva a imagem forte de ψυχή e expressa uma união interior profunda sem reduzi-la a mera concordância intelectual.
- source_word: τὸ ἓν φρονοῦντες
  choice: pensando uma só coisa
  rationale: Conserva a repetição de φρονέω e a formulação deliberadamente compacta do grego; uma nota registra a possível expressão funcional de propósito comum.
theological_decisions:
- issue: Alcance da unidade pedida por Paulo na repetição de φρονέω
  choice: “pensem do mesmo modo” e “pensando uma só coisa”
  alternative: “tenham a mesma disposição” e “voltados para um só propósito”
  rationale: A tradução conserva a repetição lexical e a tensão entre concordância interior e propósito compartilhado, sem transformar a exortação em exigência explícita de uniformidade absoluta.
- issue: Sentido da união expressa por σύμψυχοι
  choice: “unidos de alma”
  alternative: “tendo uma só alma” ou “unidos em espírito”
  rationale: A opção principal retém a metáfora da alma e a força relacional do adjetivo, sem decidir de maneira indevida se “alma” e “espírito” são categorias técnicas distintas neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A coordenação final com “e” torna natural em português a sequência de particípios, enquanto as notas preservam as principais alternativas lexicais.
