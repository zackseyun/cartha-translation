  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: pt
  text: Por isso, eu o enviei com ainda mais empenho, para que, ao vê-lo novamente, vocês se alegrem, e eu fique menos entristecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: com ainda mais empenho
  rationale: O advérbio comparativo expressa empenho ou diligência intensificados; a formulação preserva a força comparativa e soa natural em português.
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a conexão inferencial com o contexto anterior em linguagem corrente.
- source_word: ἔπεμψα
  choice: eu o enviei
  rationale: O aoristo indicativo é vertido naturalmente pelo pretérito perfeito; o pronome retoma Epafrodito.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo claro a finalidade introduzida pela conjunção grega.
- source_word: ἰδόντες
  choice: ao vê-lo
  rationale: O particípio aoristo indica a circunstância ligada à alegria pretendida; a construção com infinitivo é idiomática e preserva a relação temporal.
- source_word: πάλιν
  choice: novamente
  rationale: Indica que os filipenses tornariam a ver Epafrodito.
- source_word: χαρῆτε
  choice: vocês se alegrem
  rationale: Preserva o subjuntivo dependente de ἵνα e o tema paulino da alegria.
- source_word: κἀγὼ
  choice: e eu
  rationale: Representa diretamente a crase de καὶ ἐγώ, sem acrescentar uma ênfase ausente.
- source_word: ἀλυπότερος
  choice: menos entristecido
  rationale: Mantém o comparativo e o campo semântico de tristeza ou pesar, sem restringi-lo indevidamente à ansiedade.
- source_word: ὦ
  choice: fique
  rationale: O presente do subjuntivo de εἰμί com o predicativo comparativo é expresso naturalmente por 'fique' dentro da oração de finalidade ou resultado pretendido.
theological_decisions: []
