id: PHP.2.19
reference: Philippians 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: pt
  text: Mas espero, no Senhor Jesus, enviar-lhes Timóteo em breve, para que eu também fique animado ao saber notícias de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: espero
  rationale: O presente do indicativo expressa a esperança ou expectativa atual de Paulo; “espero” é direto e natural em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição suave, com possível contraste em relação ao contexto anterior; “Mas” preserva esse movimento discursivo.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  rationale: Mantém a formulação relacional paulina, indicando que a esperança de Paulo está situada no âmbito de sua dependência do Senhor Jesus.
- source_word: Τιμόθεον
  choice: Timóteo
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ταχέως
  choice: em breve
  rationale: Neste contexto, o advérbio aponta naturalmente para o tempo próximo do envio, não para a velocidade da viagem.
- source_word: πέμψαι ὑμῖν
  choice: enviar-lhes
  rationale: Expressa de modo conciso e idiomático o infinitivo e o destinatário no português escrito contemporâneo.
- source_word: ἵνα κἀγὼ
  choice: para que eu também
  rationale: Preserva tanto a finalidade introduzida por ἵνα quanto a inclusão enfática de Paulo em κἀγώ.
- source_word: εὐψυχῶ
  choice: fique animado
  rationale: O verbo significa estar de bom ânimo ou recobrar o ânimo; esta expressão é clara e natural sem sugerir apenas instrução ou exortação.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: ao saber como vocês estão
  rationale: A construção idiomática se refere às circunstâncias ou à condição dos filipenses. A tradução comunica esse sentido em português natural, sem tornar excessivamente literal uma expressão grega abrangente.
theological_decisions:
- issue: Tradução de κύριος em ἐν κυρίῳ Ἰησοῦ
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” é o título cristológico normal de κύριος no Novo Testamento e preserva a formulação paulina sem impor uma interpretação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” explicita o plural de ὑμῶν; “enviar-lhes” conserva um registro escrito natural. A redação mantém a expressão paulina “no Senhor Jesus” e verte o idiomatismo final pelo português corrente.
