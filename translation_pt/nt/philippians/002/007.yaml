  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a slave, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: pt
  text: mas esvaziou-se[a], tomando a forma de escravo[b], tornando-se semelhante aos seres humanos[c]; e, em aparência, visto como ser humano[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reduziu-se a nada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “servo”. “Escravo” ressalta mais diretamente a condição de sujeição expressa pelo grego δοῦλος.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “tendo-se tornado em semelhança de seres humanos”. “Semelhança” não deve ser entendida como negação de sua verdadeira humanidade.'
    reason: cross_reference
  - marker: d
    text: 'Ou: “como um homem”. Aqui, o grego ἄνθρωπος é genérico e significa “ser humano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o forte contraste com a oração anterior de modo conciso e natural em português.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: esvaziou a si mesmo
  rationale: Preserva a metáfora de κενόω e o objeto reflexivo, sem acrescentar uma explicação teológica ao verbo; os particípios seguintes indicam como esse esvaziamento se realizou.
- source_word: μορφὴν δούλου
  choice: a forma de escravo
  rationale: “Forma” mantém a correspondência com μορφή e o paralelismo do contexto. “Escravo” conserva a força de δοῦλος e a condição de sujeição relevante para o contraste.
- source_word: λαβών
  choice: tomando
  rationale: Reproduz naturalmente o particípio, que expressa o modo ou meio do esvaziamento.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: vindo a ser em semelhança de seres humanos
  rationale: “Vindo a ser” representa diretamente γενόμενος sem restringi-lo explicitamente ao nascimento; “em semelhança” preserva ὁμοίωμα, e “seres humanos” comunica o plural genérico ἀνθρώπων.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: sendo reconhecido, quanto à aparência, como ser humano
  rationale: “Reconhecido” expressa idiomaticamente εὑρεθείς no sentido de ser constatado ou percebido; “quanto à aparência” distingue σχῆμα da μορφή anterior, e “ser humano” traduz o singular genérico ἄνθρωπος sem marcá-lo por gênero.
theological_decisions:
- issue: Sentido cristológico de “esvaziou a si mesmo” (ἐκένωσεν)
  choice: Manter a metáfora e permitir que os particípios seguintes indiquem a maneira do esvaziamento.
  alternative: Explicitar que ele abriu mão de atributos divinos ou traduzir apenas como “reduziu-se a nada”.
  rationale: O texto não especifica perda ou abandono de atributos. A formulação preserva a tensão cristológica sem impor uma teoria kenótica.
- issue: Força de “em semelhança de seres humanos”
  choice: Conservar “semelhança” sem sugerir que a humanidade fosse apenas aparente.
  alternative: Substituir por “mera aparência humana” ou, no outro extremo, eliminar a nuance e dizer somente “tornando-se humano”.
  rationale: ὁμοίωμα deve permanecer perceptível na tradução. A expressão seguinte complementa essa linguagem, mas o tradutor não deve resolver além do texto a relação entre semelhança, aparência e humanidade real.
- issue: Relação entre μορφή e σχῆμα
  choice: Traduzir μορφή por “forma” e σχῆμα por “aparência”.
  alternative: Usar “forma” para ambos os termos.
  rationale: A distinção lexical ajuda a conservar o contraste deliberado do grego sem definir metafisicamente os termos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “vindo a ser em semelhança” é deliberadamente mais formal para conservar a estrutura e a ambiguidade do grego; a pontuação mantém a progressão participial do texto.
