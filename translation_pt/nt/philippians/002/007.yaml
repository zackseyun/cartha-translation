  naturalness: «Esvaziou a si mesmo» e, sobretudo, «vindo a ser em semelhança de seres humanos» são compreensíveis, mas soam excessivamente calcados no grego em português moderno. «Esvaziou-se» e «tornando-se semelhante aos seres humanos» mantêm o sentido com leitura mais natural. «Em aparência, visto como ser humano» expressa de modo claro a percepção externa indicada por σχῆματι εὑρεθείς.
  terminology: «Escravo» é uma boa tradução de δοῦλος neste contraste. «Forma» para μορφή, «semelhante»/«semelhança» para ὁμοίωμα e «aparência» para σχῆμα preservam as distinções relevantes sem impor uma interpretação cristológica.
