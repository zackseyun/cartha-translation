  source_fidelity: A tradução representa adequadamente μὴ ... ἀλλὰ καί como uma exortação que contrapõe a atenção aos próprios interesses à atenção também aos interesses dos outros. «Cuide» transmite de modo natural o sentido contextual de σκοποῦντες, isto é, dirigir atenção e consideração. «Interesses» é uma explicitação contextual defensável para os neutros plurais τὰ ἑαυτῶν e τὰ ἑτέρων, sem os restringir a bens materiais.
  naturalness: «Que cada um cuide não somente dos seus próprios interesses, mas também dos interesses dos outros» é português moderno, claro e de registro apropriado. A correlação «não somente ... mas também» é idiomática e torna explícita a leitura inclusiva adotada também na trilha de auditoria inglesa.
  terminology: «Cada um», «próprios interesses» e «os outros» são escolhas estáveis e amplamente compreensíveis. A nota lexical preserva a formulação mais próxima da superfície grega e a alternativa mais ampla «coisas», sem apresentar uma interpretação doutrinária como se fosse exigida pelo texto.
