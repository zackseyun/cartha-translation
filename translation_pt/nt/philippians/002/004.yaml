id: PHP.2.4
reference: Philippians 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: pt
  text: Que cada um cuide não somente dos seus próprios interesses[a], mas também dos interesses dos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “cada um não olhando para as suas próprias coisas, mas também para as coisas dos outros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: cuide
  rationale: O particípio transmite a ideia de dirigir atentamente a consideração e a preocupação para algo. Em português, «cuidar dos interesses» expressa essa atenção prática com naturalidade e dignidade.
- source_word: τὰ ἑαυτῶν
  choice: dos seus próprios interesses
  rationale: A expressão neutra plural é mais ampla que bens ou posses e abrange assuntos, preocupações e interesses pessoais; «interesses» explicita adequadamente o sentido contextual.
- source_word: ἕκαστοι
  choice: cada um
  rationale: O plural distributivo individualiza os membros da comunidade. «Cada um» preserva essa força de maneira clara e idiomática.
- source_word: ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: 'Embora o grego não apresente aqui uma palavra explícita equivalente a «somente», a construção negativa seguida de ἀλλὰ καὶ expressa idiomaticamente uma correlação aditiva: não se excluem os próprios interesses, mas incluem-se também os alheios.'
- source_word: τὰ ἑτέρων
  choice: dos interesses dos outros
  rationale: Assim como τὰ ἑαυτῶν, a expressão abrange os assuntos, as necessidades e o bem dos demais, sem se limitar às posses deles.
theological_decisions:
- issue: Se o versículo ordena abandonar os próprios interesses
  choice: A formulação «não somente ... mas também» mantém legítimo cuidado pelos próprios interesses e exige igual atenção aos dos outros.
  alternative: «Não cuide dos seus próprios interesses, mas também dos interesses dos outros», acompanhando mais literalmente a forma superficial da negação.
  rationale: No contexto e na construção μὴ ... ἀλλὰ καί, καί acrescenta os interesses dos outros em vez de exigir necessariamente a completa negligência dos próprios. A tradução evita transformar a exortação à humildade e à consideração mútua em proibição absoluta do autocuidado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Que cada um cuide» converte naturalmente o particípio grego em exortação contextual, enquanto a nota preserva a forma mais literal e a amplitude de «coisas».
