  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: pt
  text: Mas considerei necessário enviar a vocês Epafrodito — meu irmão, cooperador e companheiro de armas, e mensageiro de vocês[a] e aquele que atende à minha necessidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apóstolo” — isto é, alguém enviado por vocês.
    reason: alternative_reading
  - marker: b
    text: Ou “ministro que atende à minha necessidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: necessário
  rationale: Expressa aquilo que Paulo julgou necessário; a formulação é direta e natural em português.
- source_word: ἡγησάμην
  choice: considerei
  rationale: Preserva o sentido de avaliação ou juízo deliberado, e não apenas de uma opinião passageira.
- source_word: πέμψαι
  choice: enviar
  rationale: Traduz o infinitivo sem acrescentar “de volta”, ideia possível pelo contexto, mas não expressa neste verbo.
- source_word: ἀδελφὸν
  choice: irmão
  rationale: Mantém diretamente o termo familiar usado para um companheiro na fé.
- source_word: συνεργὸν
  choice: cooperador
  rationale: Designa com clareza alguém que trabalha ao lado de Paulo, em linguagem corrente no contexto cristão.
- source_word: συστρατιώτην
  choice: companheiro de armas
  rationale: Conserva a metáfora militar e soa natural e digna em português.
- source_word: ἀπόστολον
  choice: mensageiro
  rationale: Neste contexto, refere-se ao representante enviado pelos filipenses; evita atribuir automaticamente a Epafrodito o ofício técnico de apóstolo.
- source_word: λειτουργὸν
  choice: servidor
  rationale: Comunica serviço prestado de forma pessoal e digna, sem sugerir necessariamente um cargo eclesiástico moderno.
- source_word: τῆς χρείας μου
  choice: em minha necessidade
  rationale: Mantém o singular do grego e indica a situação de necessidade de Paulo na qual Epafrodito lhe prestou serviço.
theological_decisions:
- issue: Se ἀπόστολον deve ser entendido como o título técnico “apóstolo” ou no sentido mais amplo de representante enviado
  choice: mensageiro
  alternative: apóstolo
  rationale: O pronome “de vocês” identifica Epafrodito como enviado da comunidade filipense. “Mensageiro” preserva esse sentido contextual sem eliminar a alternativa lexical, registrada em nota.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A redação conserva a série de relações que descrevem Epafrodito, mantém a metáfora militar e evita expandir “enviar” para “enviar de volta”. Os marcadores de nota foram colocados junto aos termos a que se referem.
