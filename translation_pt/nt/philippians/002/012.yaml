id: PHP.2.12
reference: Philippians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: pt
  text: Portanto, meus amados, assim como vocês sempre obedeceram, não somente na minha presença, mas agora muito mais na minha ausência, desenvolvam[a] a própria salvação com temor e tremor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser traduzido como “levem a efeito” ou “levem adiante”. A expressão não diz “conquistem” a salvação; o versículo seguinte destaca que Deus atua neles.
    reason: alternative_reading
  - marker: b
    text: “Temor e tremor” expressa reverência, profunda seriedade e humilde consciência diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Portanto
  rationale: Marca a conclusão decorrente da exortação e do exemplo de Cristo apresentados anteriormente, preservando de modo natural a ligação lógica.
- source_word: ἀγαπητοί μου
  choice: meus amados
  rationale: Mantém o vocativo afetuoso e pastoral de Paulo em linguagem digna e corrente.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: assim como vocês sempre obedeceram
  rationale: Expressa o padrão de obediência já demonstrado pelos destinatários e sua relevância para a exortação presente.
- source_word: μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου
  choice: não somente na minha presença, mas agora muito mais na minha ausência
  rationale: Reproduz claramente o contraste entre presença e ausência e conserva a intensificação de πολλῷ μᾶλλον.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: a própria salvação
  rationale: Preserva o valor reflexivo de ἑαυτῶν e o peso teológico normal de σωτηρία, sem acrescentar a ideia de individualismo isolado.
- source_word: κατεργάζεσθε
  choice: desenvolvam
  rationale: Em português, comunica a ideia de levar adiante e tornar efetiva na vida a salvação mencionada, evitando a formulação pouco natural 'trabalhem a salvação'.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: com temor e tremor
  rationale: Mantém a força e a solenidade da expressão grega, sem reduzi-la antecipadamente a mero respeito nem interpretá-la somente como terror.
theological_decisions:
- issue: Sentido de κατεργάζεσθε em relação à salvação
  choice: Traduzir por 'desenvolvam', preservando a exortação a levar a salvação adiante e manifestá-la na vida.
  alternative: Traduzir por 'conquistem' ou 'produzam' a própria salvação, o que poderia sugerir de maneira indevida que ela é obtida exclusivamente pelo esforço humano.
  rationale: O verbo denota realizar, efetuar ou levar algo a cabo. O contexto imediato prossegue no versículo 13 com a atuação de Deus nos destinatários; a tradução mantém a responsabilidade humana expressa no versículo sem eliminar a tensão teológica do contexto.
- issue: Força de 'temor e tremor'
  choice: Conservar literalmente a expressão solene.
  alternative: Substituí-la por 'respeito' ou explicá-la no corpo do texto como simples reverência.
  rationale: A expressão comporta reverência, humildade e profunda seriedade diante de Deus. Mantê-la evita enfraquecer sua carga emocional ou restringir indevidamente seu sentido.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O pronome “vocês” torna explícito que a exortação se dirige à comunidade. Os travessões preservam a longa intercalação do grego sem comprometer a clareza. A formulação mantém o tom afetuoso, solene e exortativo do texto.
