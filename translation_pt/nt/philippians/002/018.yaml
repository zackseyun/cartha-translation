  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: pt
  text: Do mesmo modo[a], alegrem-se também vocês e alegrem-se comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Igualmente, alegrem-se também vocês e compartilhem comigo a sua alegria.”'
