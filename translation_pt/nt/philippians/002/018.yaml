lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Do mesmo modo
  rationale: A expressão funciona adverbialmente e retoma a alegria compartilhada do contexto anterior. “Do mesmo modo” é natural em português e preserva a ligação discursiva; δέ é representado pela transição contextual, sem um “mas” que sugeriria contraste forte.
- source_word: καὶ ὑμεῖς
  choice: também vocês
  rationale: Preserva a ênfase inclusiva de καί e a explicitação enfática do pronome plural ὑμεῖς, em ordem natural no português moderno.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: O presente imperativo plural expressa a convocação à alegria e mantém o vocabulário recorrente de alegria em Filipenses.
- source_word: συγχαίρετέ μοι
  choice: alegrem-se comigo
  rationale: O verbo composto indica alegria compartilhada, e o dativo μοι identifica Paulo como aquele com quem os leitores devem se alegrar. A formulação é direta e idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” evita regionalismo excessivo e torna explícito que a exortação se dirige à comunidade. A repetição de “alegrem-se” conserva a ligação lexical entre χαίρετε e συγχαίρετε.
