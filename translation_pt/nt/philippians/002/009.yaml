id: PHP.2.9
reference: Philippians 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: pt
  text: Por isso, Deus também o exaltou sobremaneira e lhe concedeu graciosamente[a] o nome que está acima de todo nome[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe conferiu”.
    reason: lexical_alternative
  - marker: b
    text: “O nome” pode indicar não apenas um nome pronunciado, mas também posição, dignidade ou título; este versículo ainda não especifica qual nome está em vista.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Por isso, ... também
  rationale: Preserva tanto a inferência expressa por διό quanto a força aditiva de καί, em ordem natural no português.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: O sujeito é explícito e definido no grego; em português, a referência divina como nome próprio normalmente dispensa artigo.
- source_word: ὑπερύψωσεν
  choice: exaltou sobremaneira
  rationale: Comunica a força intensiva do verbo composto sem recorrer a uma forma artificial como “superexaltou” nem acrescentar a ideia espacial de “lugar”.
- source_word: ἐχαρίσατο
  choice: concedeu graciosamente
  rationale: Mantém o sentido de dar ou conceder e torna perceptível a relação lexical com χάρις, “graça”.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Traduz diretamente o grego sem decidir no texto principal se se trata especificamente de nome pronunciado, título, posição ou dignidade.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: o nome que está acima de todo nome
  rationale: Preserva a estrutura comparativa e a repetição de “nome”, com formulação clara e natural em português.
theological_decisions:
- issue: Identidade de “o nome”
  choice: Mantido como “o nome”, sem especificá-lo no texto principal.
  alternative: Entendê-lo como o nome “Jesus” ou como o título divino “Senhor”, explicitado nos versículos seguintes.
  rationale: O versículo 9 não identifica expressamente o nome; a tradução preserva essa abertura e não antecipa uma conclusão interpretativa baseada nos versículos 10–11.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sobremaneira” conserva a intensificação do grego em registro elevado, porém corrente em linguagem bíblica; “concedeu graciosamente” explicita a nuance de graça sem substituir o verbo por uma interpretação denominacional.
source_grounding:
  english_pob_role: consult_only
