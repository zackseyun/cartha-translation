base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: pt
  text: 'Tenham entre vocês esta maneira de pensar[a], que também havia no Messias Jesus[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham entre vocês esta maneira de pensar, que vocês também têm no Messias Jesus”.'
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Cristo”; aqui traduzido como “Messias” porque Χριστός funciona como título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: esta mesma
  rationale: O demonstrativo remete à disposição desenvolvida a seguir; “esta mesma” cria uma ligação natural com a oração relativa sem explicitar além do grego.
- source_word: φρονεῖτε
  choice: Tenham ... maneira de pensar
  rationale: O presente imperativo exorta a uma disposição ou orientação contínua, não apenas a um pensamento isolado.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: O pronome plural e o contexto comunitário de 2:1–4 favorecem o sentido corporativo, embora a formulação também alcance cada integrante.
- source_word: ὃ
  choice: que
  rationale: O pronome relativo liga de modo compacto a disposição ordenada àquela associada a Jesus.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Χριστός mantém aqui força titular; “Messias” comunica essa função em português. A preposição é preservada de modo relativamente literal para não eliminar a ambiguidade relacional.
theological_decisions:
- issue: Se a oração final apresenta a maneira de pensar exemplificada por Jesus ou a que os fiéis possuem em união com ele.
  choice: 'Leitura exemplar: “que também havia no Messias Jesus”.'
  alternative: 'Leitura participativa: “que vocês também têm no Messias Jesus”.'
  rationale: O contexto imediato passa a descrever a humilhação voluntária de Jesus como padrão para a comunidade, favorecendo a leitura exemplar. Como o grego é elíptico e também admite uma leitura ligada à participação nele, essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Maneira de pensar” comunica o alcance de φρονέω sem recorrer ao anglicismo “mentalidade”. A vírgula e os dois-pontos mantêm a ligação com a descrição iniciada no versículo seguinte.
