id: PHP.2.11
reference: Philippians 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: pt
  text: e toda língua confesse que Jesus, o Messias, é Senhor[a], para a glória de Deus Pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo é Senhor”.'
    reason: Registra a forma tradicional de Χριστός e a ordem mais próxima da fórmula grega.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: toda língua
  rationale: Mantém a metáfora corporal do grego e expressa de modo natural a universalidade da confissão.
- source_word: ἐξομολογήσηται
  choice: confesse
  rationale: Preserva a força declarativa e pública do verbo. O subjuntivo também mantém a ligação sintática com a finalidade iniciada no versículo anterior.
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente corrente de κύριος e conserva tanto a força cristológica quanto a ressonância das Escrituras evocadas no contexto.
- source_word: Χριστός
  choice: o Messias
  rationale: Traduz o título em vez de apenas transliterá-lo, tornando perceptível a afirmação messiânica da confissão.
- source_word: εἰς δόξαν
  choice: para a glória de
  rationale: Expressão portuguesa natural que preserva o valor direcional ou resultativo de εἰς neste contexto.
- source_word: θεοῦ πατρός
  choice: Deus Pai
  rationale: Formulação corrente e clara em português para a expressão genitiva grega, sem exigir pontuação explicativa.
theological_decisions:
- issue: Tradução de Χριστός na confissão cristológica
  choice: o Messias
  alternative: Cristo
  rationale: O sentido titular permanece ativo no contexto; “o Messias” comunica esse conteúdo sem acrescentar uma interpretação denominacional. A forma tradicional é registrada em nota.
- issue: Relação entre Jesus como Senhor e a glória do Pai
  choice: é Senhor, para a glória de Deus Pai
  alternative: é o Senhor, para a glória de Deus, o Pai
  rationale: A redação segue de perto a predicação anartrosa κύριος Ἰησοῦς Χριστός e preserva a tensão cristológica do texto sem explicar além do que o grego declara.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação começa com minúscula porque o versículo continua a construção de finalidade do versículo 10. “Toda língua” conserva a imagem do original; “confesse” mantém o subjuntivo e a continuidade sintática.
