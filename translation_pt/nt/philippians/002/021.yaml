  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: pt
  text: Pois todos buscam os seus próprios interesses, não os de Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”.'
    reason: Alternativa lexical tradicional para a expressão Ἰησοῦ Χριστοῦ.
lexical_decisions:
- source_word: οἱ πάντες
  choice: todos
  rationale: O plural substantivado refere-se a todas as pessoas em vista e preserva a ênfase coletiva de modo natural em português.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão da afirmação anterior, mantendo a ligação explicativa sem especificá-la em excesso.
- source_word: τὰ ἑαυτῶν
  choice: os seus próprios interesses
  rationale: O neutro plural idiomático indica aquilo que diz respeito a cada um; “interesses” comunica com clareza o contraste moral implícito.
- source_word: ζητοῦσιν
  choice: buscam
  rationale: Equivalente amplo e natural que preserva tanto a ideia de procura quanto a de empenho em favor de algo.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: os de Jesus, o Messias
  rationale: “Os de” retoma elipticamente “interesses”, como no grego, e “o Messias” conserva Χριστός como título em português idiomático.
theological_decisions:
- issue: Tradução de Χριστοῦ na expressão Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: O contexto permite conservar explicitamente o sentido titular de Χριστός. A alternativa tradicional e mais nominalizada é registrada em nota, sem impor uma distinção teológica que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A elipse do segundo τὰ foi preservada por “os de”, evitando repetição desnecessária.
