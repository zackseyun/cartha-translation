  text: Do everything without grumbling or arguing[b][a],
translation:
  language: pt
  text: Façam tudo sem murmurações nem discussões[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem murmurações nem disputas”. O termo traduzido como “discussões” também pode significar “questionamentos” ou “raciocínios”, conforme o contexto; aqui provavelmente se refere a contendas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: tudo
  rationale: O acusativo plural de πᾶς tem sentido abrangente; “tudo” é natural em português e preserva o alcance universal da exortação.
- source_word: ποιεῖτε
  choice: Façam
  rationale: O presente imperativo expressa uma ordem de aplicação contínua. “Façam” comunica isso naturalmente no português moderno sem tornar necessário explicitar “continuem fazendo”.
- source_word: χωρὶς
  choice: sem
  rationale: “Sem” é a forma mais direta e idiomática de indicar a ausência das atitudes mencionadas.
- source_word: γογγυσμῶν
  choice: murmurações
  rationale: γογγυσμός designa queixa murmurada ou resmungo. “Murmurações” preserva tanto esse sentido quanto a possível ressonância das murmurações de Israel no deserto, embora seja um pouco mais formal que “reclamações”.
- source_word: διαλογισμῶν
  choice: discussões
  rationale: Neste contexto exortativo, διαλογισμός provavelmente indica contendas ou disputas, não apenas raciocínios interiores. “Discussões” é claro e corrente, enquanto a nota preserva a amplitude lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com forma verbal brasileira natural no plural. “Murmurações” mantém a ressonância bíblica sem recorrer ao arcaico “murmúrios”; “discussões” comunica a provável dimensão interpessoal, e a nota registra a ambiguidade de διαλογισμῶν.
