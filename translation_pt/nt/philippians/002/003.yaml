id: PHP.2.3
reference: Philippians 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: pt
  text: Não façam nada por ambição egoísta nem por vanglória[a], mas, com humildade, considerem uns aos outros superiores a vocês mesmos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «presunção vazia»; literalmente, «glória vazia».
    reason: lexical_alternative
  - marker: b
    text: Ou «mais importantes do que vocês mesmos».
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Não façam nada
  rationale: Forma exortativa idiomática em português, preservando a negação abrangente que inicia o versículo.
- source_word: κατ’ ἐριθείαν
  choice: por ambição egoísta
  rationale: Expressa a motivação interesseira e potencialmente facciosa de ἐριθεία, enquanto «por» comunica naturalmente o valor motivacional de κατά.
- source_word: μηδὲ κατὰ κενοδοξίαν
  choice: nem por vanglória
  rationale: «Vanglória» preserva de modo conciso a ideia de glória vazia e ostentação presunçosa presente em κενοδοξία.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: com humildade
  rationale: Português natural para o dativo de modo, comunicando a disposição humilde recomendada.
- source_word: ἀλλήλους ἡγούμενοι
  choice: considerem uns aos outros
  rationale: «Considerem» conserva o sentido cognitivo e avaliativo do particípio ἡγούμενοι; «uns aos outros» mantém a reciprocidade.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: superiores a vocês mesmos
  rationale: Mantém de perto a força comparativa de ὑπερέχω sem determinar em que sentido os outros excedem o próprio indivíduo.
theological_decisions:
- issue: Natureza da superioridade atribuída aos outros
  choice: superiores a vocês mesmos
  alternative: mais importantes do que vocês mesmos
  rationale: A formulação preserva a amplitude e a tensão de ὑπερέχοντας, que pode indicar superioridade ou preeminência, sem restringir o texto a importância social ou valor ontológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» evita regionalismo excessivo; «vanglória» é termo corrente em registro bíblico, esclarecido por nota.
