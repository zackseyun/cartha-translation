base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: pt
  text: Mas vocês conhecem o caráter comprovado dele[a], que ele serviu comigo em favor do evangelho como um filho serve com seu pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o valor comprovado dele». O termo indica uma qualidade que se mostrou genuína ao ser posta à prova.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «como filho com pai».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Mantém a leve transição contrastiva do contexto em português natural.
- source_word: δοκιμὴν αὐτοῦ
  choice: o caráter comprovado dele
  rationale: Expressa não apenas uma prova abstrata, mas o caráter de Timóteo que se mostrou genuíno sob provação.
- source_word: γινώσκετε
  choice: vocês conhecem
  rationale: Representa diretamente o presente indicativo e o conhecimento que os filipenses já tinham de Timóteo.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural, em português, a explicação do caráter comprovado que eles conheciam.
- source_word: ὡς πατρὶ τέκνον
  choice: como um filho ao lado do pai
  rationale: Preserva a comparação familiar e o sentido inclusivo de τέκνον, sem tornar explícita uma relação possessiva ausente do grego.
- source_word: σὺν ἐμοὶ
  choice: comigo
  rationale: Comunica de forma simples a associação de Timóteo com Paulo no serviço.
- source_word: ἐδούλευσεν
  choice: serviu
  rationale: Mantém o sentido verbal de serviço dedicado sem impor, neste contexto ministerial, a formulação excessivamente literal «trabalhou como escravo».
- source_word: εἰς τὸ εὐαγγέλιον
  choice: em favor do evangelho
  rationale: Exprime naturalmente a direção e a finalidade do serviço compartilhado.
