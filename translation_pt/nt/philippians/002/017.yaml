id: PHP.2.17
reference: Philippians 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: pt
  text: Mas, ainda que eu esteja sendo derramado como oferta de bebida[a] sobre o sacrifício e o serviço sagrado[b] da fé de vocês[c], alegro-me e me alegro com todos vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como libação”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “serviço” ou “ministério”; neste contexto, o grego conserva uma conotação de culto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “fidelidade de vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: esteja sendo derramado como oferta de bebida
  rationale: Preserva o aspecto passivo e contínuo do verbo e explicita, em linguagem compreensível, a imagem cultual de uma libação derramada.
- source_word: ἐπὶ
  choice: sobre
  rationale: Mantém a imagem de a libação ser derramada sobre o sacrifício, sem excluir a possível ideia de acréscimo à oferta dos filipenses.
- source_word: θυσίᾳ
  choice: sacrifício
  rationale: É o equivalente direto do termo sacrificial e conserva a linguagem de culto do contexto.
- source_word: λειτουργίᾳ
  choice: serviço sagrado
  rationale: Comunica a ideia de serviço e, ao mesmo tempo, preserva a conotação cultual criada pelo conjunto de termos sacrificiais, sem afirmar de modo indevido que os filipenses exerciam um sacerdócio formal.
- source_word: πίστεως
  choice: fé
  rationale: É o sentido mais natural neste contexto e preserva a formulação compacta do grego; a possibilidade de 'fidelidade' é registrada em nota.
- source_word: χαίρω
  choice: alegro-me
  rationale: Mantém o vocabulário temático da alegria em Filipenses e o valor declarativo do presente.
- source_word: συγχαίρω
  choice: me alegro com
  rationale: Reproduz diretamente a ideia de alegria compartilhada e conserva a repetição intencional entre χαίρω e συγχαίρω.
- source_word: πᾶσιν ὑμῖν
  choice: com todos vocês
  rationale: Expressa com naturalidade a inclusão explícita de toda a comunidade.
theological_decisions:
- issue: Imagem cultual aplicada ao possível derramamento da vida de Paulo
  choice: Paulo se descreve como uma oferta de bebida derramada sobre o sacrifício e o serviço sagrado dos filipenses.
  alternative: Paulo fala apenas de sua vida entregue em conexão com o serviço deles, sem intensificação sacrificial específica.
  rationale: A concentração de σπένδομαι, θυσία e λειτουργία favorece a preservação da metáfora sacrificial, sem converter a linguagem figurada em uma afirmação técnica sobre o ofício sacerdotal.
- issue: Relação do genitivo τῆς πίστεως ὑμῶν
  choice: da fé de vocês
  alternative: produzidos pela fé de vocês; consistindo na fidelidade de vocês
  rationale: A formulação genitiva do português conserva a concisão e parte da ambiguidade do grego quanto à relação exata entre a fé dos filipenses, seu sacrifício e seu serviço.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Oferta de bebida” torna clara a imagem antiga, enquanto a nota oferece o termo técnico “libação”. A repetição “alegro-me e me alegro” foi mantida para refletir o jogo verbal deliberado do original.
