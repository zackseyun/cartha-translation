id: PHP.2.1
reference: Philippians 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: pt
  text: Portanto, se há algum encorajamento no Messias, se há algum consolo vindo do amor, se há alguma comunhão do Espírito[a], se há alguma afeição e compaixão,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “participação no Espírito”; menos provavelmente, “comunhão em espírito”.'
    reason: Leitura alternativa para a relação ambígua entre κοινωνία e πνεύματος.
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Expressa de modo claro e digno a ligação inferencial com o contexto anterior.
- source_word: παράκλησις
  choice: encorajamento
  rationale: Abrange aqui a ideia de fortalecer e animar, sem restringir o sentido a exortação ou mero alívio emocional.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém a preposição ἐν e traduz Χριστός como título, de acordo com seu sentido messiânico neste contexto.
- source_word: παραμύθιον
  choice: consolo
  rationale: Designa fala ou ação consoladora e mantém distinção lexical em relação a παράκλησις, traduzido como “encorajamento”.
- source_word: ἀγάπης
  choice: vindo do amor
  rationale: Expressa naturalmente em português a provável relação de origem ou fonte indicada pelo genitivo, sem tornar a frase obscura.
- source_word: κοινωνία
  choice: comunhão
  rationale: Comunica a dimensão relacional e compartilhada do termo; a possível ideia de participação é preservada em nota.
- source_word: πνεύματος
  choice: do Espírito
  rationale: A referência mais provável é ao Espírito Santo, embora a relação exata do genitivo com κοινωνία permaneça compacta e ambígua.
- source_word: σπλάγχνα
  choice: afeição
  rationale: O sentido idiomático é de sentimento profundo e terno, não uma referência anatômica literal.
- source_word: οἰκτιρμοί
  choice: compaixão
  rationale: É uma forma atual e natural de transmitir misericórdia ou compaixão sentida em relação aos outros.
theological_decisions:
- issue: Se πνεύματος se refere ao Espírito Santo e como deve ser entendida sua relação com κοινωνία
  choice: comunhão do Espírito
  alternative: participação no Espírito; menos provavelmente, comunhão em espírito
  rationale: O contexto favorece uma referência ao Espírito Santo, mas o genitivo grego não define por si só se o Espírito é a fonte da comunhão ou aquele de quem os fiéis participam. A nota preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com repetição de “se há” para reproduzir a estrutura retórica das quatro orações condicionais gregas. “Messias” conserva o valor titular de Χριστός.
