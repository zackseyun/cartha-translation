source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: pt
  text: para que se tornem irrepreensíveis e puros, filhos de Deus sem mancha no meio de uma geração tortuosa e desvirtuada[c], entre os quais vocês brilham[a] como luzes[b] no mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês aparecem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “luminares”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “geração tortuosa e desvirtuada” provavelmente remete a Deuteronômio 32:5 e contrasta os filhos de Deus com uma geração corrupta.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a ideia de propósito ou resultado introduzida pela conjunção.
- source_word: γένησθε
  choice: se tornem
  rationale: Preserva o sentido de vir a ser, em vez de reduzir o verbo a um simples estado.
- source_word: ἄμεμπτοι
  choice: irrepreensíveis
  rationale: Comunica ausência de culpa censurável no contexto ético.
- source_word: ἀκέραιοι
  choice: puros
  rationale: Expressa integridade moral em linguagem clara e atual; “íntegros” também seria possível.
- source_word: τέκνα θεοῦ
  choice: filhos de Deus
  rationale: Em português, “filhos” pode abranger pessoas de ambos os sexos e é a formulação bíblica natural para τέκνα.
- source_word: ἄμωμα
  choice: sem mancha
  rationale: Mantém a imagem de ausência de defeito e a distingue de “irrepreensíveis” no início do versículo.
- source_word: μέσον γενεᾶς
  choice: no meio de uma geração
  rationale: Reproduz de modo natural a posição dos destinatários dentro do grupo que os cerca.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: tortuosa e corrompida
  rationale: Preserva as duas descrições morais fortes e a imagem de desvio, evitando que “pervertida” seja entendida apenas em sentido sexual no português atual.
- source_word: ἐν οἷς
  choice: entre os quais
  rationale: Conserva o referente pessoal plural implícito nos membros dessa geração, embora o antecedente coletivo em português seja singular.
- source_word: φαίνεσθε
  choice: vocês brilham
  rationale: Diante de φωστῆρες, o sentido luminoso é contextual e natural; a possibilidade lexical “aparecem” fica registrada em nota.
- source_word: φωστῆρες
  choice: luzes
  rationale: É claro e acessível, sem a formalidade de “luminares” nem a especificidade excessiva de “estrelas”.
- source_word: ἐν κόσμῳ
  choice: no mundo
  rationale: Refere-se naturalmente ao mundo em que vivem, não necessariamente ao universo físico.
theological_decisions:
- issue: Relação de “sem mancha” com “filhos de Deus” e possível eco de Deuteronômio 32:5
  choice: Manter “filhos de Deus sem mancha” e deixar a alusão bíblica implícita no texto principal.
  alternative: Aplicar “sem mancha” de modo mais geral a toda a oração ou explicitar a alusão a Deuteronômio.
  rationale: A construção grega liga diretamente ἄμωμα a τέκνα θεοῦ, enquanto o contraste com a geração tortuosa e corrompida permite perceber o eco veterotestamentário sem impor sua interpretação no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma “vocês” evita o registro regional ou arcaizante de “vós”; “tortuosa e corrompida” preserva a força moral sem sugerir de modo indevido apenas perversão sexual.
