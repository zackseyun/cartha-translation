base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: pt
  text: Pois é Deus quem opera em vocês tanto o querer como o realizar, em favor da sua boa vontade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tanto o ato de querer como o de realizar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “segundo a sua boa vontade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Pois
  rationale: Introduz a razão explicativa da exortação anterior e mantém de modo natural a conexão argumentativa.
- source_word: ὁ ἐνεργῶν
  choice: quem atua
  rationale: Expressa o particípio substantivado e sua força presente, apresentando Deus como aquele que está em ação.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Preserva a formulação grega e permite tanto uma leitura referente aos indivíduos quanto uma dimensão comunitária.
- source_word: τὸ θέλειν
  choice: o querer
  rationale: O infinitivo articulado indica a volição; a forma nominal mantém o paralelismo grego e evita explicar além do texto.
- source_word: τὸ ἐνεργεῖν
  choice: o realizar
  rationale: Comunica a ação efetiva em português natural e mantém o contraste complementar entre querer e realizar.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: em favor da sua boa vontade
  rationale: Representa o valor de finalidade ou benefício de ὑπέρ com genitivo; o possessivo retoma naturalmente Deus, sujeito da oração.
theological_decisions:
- issue: Agência divina e o querer/realizar humanos
  choice: Deus atua em ambos, o querer e o realizar.
  alternative: Deus concede o desejo e a capacidade de agir.
  rationale: A tradução conserva a afirmação simultânea da atuação divina na volição e na ação sem introduzir uma explicação confessional específica.
- issue: Sentido de ὑπὲρ τῆς εὐδοκίας
  choice: em favor da sua boa vontade
  alternative: segundo a sua boa vontade
  rationale: Mantém como texto principal a nuance natural de finalidade ou benefício, registrando em nota a possível leitura normativa.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural. A construção nominal “o querer... o realizar” preserva o paralelismo do grego; “boa vontade” mantém a expressão teologicamente aberta.
