  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: pt
  text: humilhou a si mesmo, tornando-se obediente até a morte[a] — até mesmo a morte numa cruz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o ponto de morrer”; a expressão indica que sua obediência se estendeu até a própria morte.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “morte, porém, de cruz”; o sentido é “até mesmo a morte numa cruz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν ἑαυτὸν
  choice: humilhou a si mesmo
  rationale: Mantém tanto o sentido ativo de ἐταπείνωσεν quanto o pronome reflexivo explícito, destacando que o ato de humilhação foi voluntário.
- source_word: γενόμενος
  choice: tornando-se
  rationale: Reproduz de modo natural a ligação participial e apresenta a obediência como a forma pela qual ele se humilhou, sem impor uma sequência temporal rígida.
- source_word: ὑπήκοος
  choice: obediente
  rationale: É o equivalente direto e corrente do adjetivo grego, preservando plenamente a ideia de obediência.
- source_word: μέχρι θανάτου
  choice: até a morte
  rationale: Expressão concisa e natural em português, que conserva a ideia de uma obediência levada até a própria morte sem eliminar a possível nuance de 'até o ponto de morrer'.
- source_word: θανάτου δὲ σταυροῦ
  choice: — e morte numa cruz
  rationale: A construção idiomática torna clara a intensificação introduzida por δέ e expressa em português natural o genitivo comprimido σταυροῦ, mantendo em destaque a realidade concreta da crucificação.
theological_decisions:
- issue: Relação entre humilhar-se e tornar-se obediente
  choice: Conservar a construção participial, sem definir além do texto se ela expressa principalmente modo, resultado ou desenvolvimento.
  alternative: Traduzir explicitamente 'humilhou-se ao tornar-se obediente'.
  rationale: O particípio γενόμενος está intimamente ligado ao verbo principal, mas a formulação grega não exige que uma única relação lógica seja explicitada na tradução.
- issue: Alcance de μέχρι θανάτου
  choice: Traduzir 'até a morte', preservando a noção de obediência que se estendeu até a morte e a possível nuance de que ela o levou a morrer.
  alternative: Traduzir 'até o ponto de morrer'.
  rationale: A expressão portuguesa mantém a concisão e a tensão do original, enquanto a nota registra a alternativa sem resolver em excesso a formulação.
- issue: Força de θανάτου δὲ σταυροῦ
  choice: 'Entender a frase final como uma intensificação: não apenas morte, mas morte numa cruz.'
  alternative: 'Entender δέ de maneira mais fracamente aditiva: ''e morte de cruz''.'
  rationale: O segundo uso de θάνατος, seguido por σταυροῦ, forma o clímax retórico da frase; a tradução preserva essa ênfase sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem reflexiva 'humilhou a si mesmo' preserva a ênfase explícita do grego; o travessão marca o clímax retórico sem acrescentar conteúdo interpretativo.
