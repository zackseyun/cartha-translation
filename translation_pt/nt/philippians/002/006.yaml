  text: o qual, embora existisse na forma de Deus,[a] não considerou o ser igual a Deus[b] algo a ser usado em benefício próprio.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “existindo na forma de Deus”. O particípio grego pode ser entendido de modo concessivo (“embora existisse”) ou simplesmente descritivo (“existindo”).'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “o ser igual a Deus”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “algo a ser agarrado”, “algo de que se apoderar” ou “algo a que se apegar”. O sentido do termo grego é discutido.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: na forma de Deus
  rationale: Preserva a expressão grega μορφή sem reduzi-la a uma paráfrase metafísica mais estreita, mantendo sua elevada força cristológica.
- source_word: ὑπάρχων
  choice: embora existisse
  rationale: Explicita o valor concessivo provável do particípio no contraste com o autoesvaziamento do versículo seguinte, enquanto a leitura estritamente estativa é registrada em nota.
- source_word: ἡγήσατο
  choice: não considerou
  rationale: Equivalente corrente e direto para o sentido de avaliar ou julgar atribuído a ἡγέομαι.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: o ser igual a Deus
  rationale: Reproduz de perto a construção infinitiva e o sentido adverbial de ἴσα, evitando transformar a expressão em terminologia doutrinária posterior.
- source_word: ἁρπαγμὸν
  choice: algo a ser usado em benefício próprio
  rationale: No contexto, exprime uma vantagem que Cristo não empregou para proveito próprio e conduz naturalmente ao autoesvaziamento do versículo 7; a leitura tradicional ligada a agarrar ou apoderar-se permanece em nota.
theological_decisions:
- issue: Força cristológica de ἐν μορφῇ θεοῦ
  choice: Manter «na forma de Deus» no texto principal.
  alternative: «na natureza de Deus» ou «sendo Deus por natureza»
  rationale: A formulação preserva a elevada cristologia do texto sem substituir as palavras de Paulo por linguagem dogmática posterior.
- issue: Sentido de ἁρπαγμός em relação à igualdade com Deus
  choice: Traduzir como algo não usado em benefício próprio.
  alternative: «algo a ser agarrado», «algo de que se apoderar» ou «algo a que se apegar»
  rationale: O contexto imediato favorece a ideia de não explorar uma condição ou vantagem para proveito próprio, mas o substantivo é genuinamente discutido; por isso, a alternativa aquisitiva ou retentiva é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «O qual» mantém a ligação sintática com o antecedente no versículo 5; as notas preservam as ambiguidades reais de ὑπάρχων e ἁρπαγμός.
