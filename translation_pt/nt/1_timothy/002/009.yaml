id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: pt
  text: Do mesmo modo, as mulheres também devem se adornar com traje decoroso[a], com modéstia e autocontrole, não com tranças, ouro, pérolas ou roupas caras[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «roupa apropriada» ou «vestimenta modesta».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «tranças, ouro, pérolas ou roupas caras» provavelmente se refere ao adorno ostentoso, sem necessariamente proibir todo uso de tranças ou joias em qualquer circunstância.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Do mesmo modo, ... também
  rationale: Preserva tanto a ligação com a exortação anterior expressa por ὡσαύτως quanto o valor aditivo de καί, em ordem natural no português.
- source_word: γυναῖκας
  choice: as mulheres
  rationale: Embora γυνή também possa significar «esposa», o plural aparece numa exortação geral e sem indicação explícita de relação conjugal.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: com traje decoroso
  rationale: καταστολή se refere ao traje ou à vestimenta, e κόσμιος comunica decoro, boa ordem e respeitabilidade. A expressão é clara e digna em português.
- source_word: μετὰ αἰδοῦς
  choice: com modéstia
  rationale: αἰδώς indica reserva moral e consideração pelo que é apropriado; «modéstia» expressa isso naturalmente no contexto de apresentação pessoal.
- source_word: σωφροσύνης
  choice: autocontrole
  rationale: O termo abrange sensatez e domínio de si. «Autocontrole» é conciso, atual e mantém a dimensão de contenção.
- source_word: κοσμεῖν ἑαυτάς
  choice: devem se adornar
  rationale: Mantém a ideia de arrumar ou adornar a própria aparência e explicita em português a força exortativa dependente do contexto.
- source_word: μὴ ἐν πλέγμασιν
  choice: não com tranças
  rationale: πλέγματα designa cabelos trançados ou arranjos trançados. «Tranças» preserva a formulação concisa sem inserir no texto principal uma qualificação interpretativa como «elaboradas».
- source_word: χρυσίῳ
  choice: ouro
  rationale: Mantém a amplitude do substantivo grego sem especificar indevidamente a forma dos adornos de ouro.
- source_word: μαργαρίταις
  choice: pérolas
  rationale: É o equivalente direto e usual do termo grego.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: roupas caras
  rationale: ἱματισμός significa roupa ou vestuário, e πολυτελής indica alto custo. A expressão é corrente e facilmente compreensível.
theological_decisions:
- issue: Se o versículo se dirige às mulheres em geral ou especificamente às esposas
  choice: mulheres em geral
  alternative: esposas
  rationale: O contexto apresenta instruções gerais e não contém marcador conjugal que exija restringir γυναῖκας às esposas.
- issue: Se a negação constitui proibição absoluta de cada item ou censura à ostentação
  choice: manter literalmente a lista no texto e explicar a provável referência à ostentação em nota
  alternative: entender como proibição absoluta de tranças, ouro, pérolas e roupas caras em todas as circunstâncias
  rationale: A construção contrapõe o adorno decoroso, marcado por modéstia e autocontrole, à exibição de luxo. A tradução não acrescenta qualificadores ao texto, preservando sua força e possível tensão, enquanto a nota fornece o contexto interpretativo provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Traje decoroso» conserva a noção de propriedade social e moral sem soar excessivamente técnico; «autocontrole» evita formas arcaicas. A vírgula final foi mantida porque o versículo continua sintaticamente em 1Timóteo 2.10.
