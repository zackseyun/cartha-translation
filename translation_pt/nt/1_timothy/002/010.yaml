  text: ἀλλ’ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, δι’ ἔργων ἀγαθῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: pt
  text: 'mas com o que convém a mulheres que professam devoção a Deus: boas obras[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquilo que convém” ou “aquilo que é apropriado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “reverência a Deus”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “por meio de boas obras”; aqui, o sentido é que as boas obras constituem o adorno apropriado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: mas
  rationale: Marca o contraste com os adornos exteriores mencionados no versículo anterior; “mas” é o adversativo mais natural em português.
- source_word: ὃ πρέπει
  choice: aquilo que é próprio
  rationale: Reproduz a expressão idiomática que indica o que convém ou é apropriado, com linguagem natural e digna.
- source_word: γυναιξὶν
  choice: de mulheres
  rationale: Neste contexto, o plural é genérico e se refere a mulheres, não especificamente a esposas.
- source_word: ἐπαγγελλομέναις
  choice: que professam
  rationale: O particípio descreve as que declaram ou assumem publicamente determinada devoção; “professam” preserva esse sentido sem sugerir necessariamente um voto.
- source_word: θεοσέβειαν
  choice: devoção a Deus
  rationale: Expressa de modo claro o sentido de reverência e dedicação dirigida a Deus, evitando que “piedade” seja entendida apenas como compaixão.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: boas obras
  rationale: No contraste com o adorno exterior, as boas obras são apresentadas como o adorno apropriado; a nota conserva a forma mais literal “por meio de boas obras”.
theological_decisions:
- issue: Relação entre as boas obras e a profissão de devoção a Deus
  choice: As boas obras são apresentadas como a expressão exterior apropriada das mulheres que professam devoção a Deus.
  alternative: Entender as boas obras como fundamento meritório da aceitação diante de Deus.
  rationale: A sintaxe e o contexto contrastam o adorno exterior com a conduta condizente com a devoção professada; o versículo não formula aqui uma doutrina sobre o mérito das obras.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o contraste com o versículo anterior e preserva a ligação sintática entre o que é apropriado e as boas obras.
