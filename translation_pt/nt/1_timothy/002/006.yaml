id: 1TI.2.6
reference: 1 Timothy 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: pt
  text: que se entregou como resgate por todos[a], o testemunho dado nos tempos determinados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em favor de todos». A expressão preserva a amplitude do grego sem decidir se «todos» significa cada pessoa ou pessoas de todas as categorias.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, «o testemunho nos tempos determinados». A frase grega é condensada e também pode ser entendida como o testemunho acerca da entrega de Cristo, manifestado nos tempos apropriados.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: que se entregou
  rationale: O particípio aoristo de δίδωμι retoma o antecedente do versículo anterior. Em português, a oração relativa é natural; com ἑαυτόν, «entregou-se» comunica melhor a entrega voluntária de si do que o literal «deu a si mesmo».
- source_word: ἑαυτὸν
  choice: se
  rationale: O pronome reflexivo enfatiza que Cristo ofereceu a própria pessoa; a construção pronominal portuguesa preserva esse sentido com naturalidade.
- source_word: ἀντίλυτρον
  choice: como resgate
  rationale: O substantivo designa o preço de libertação e contém uma nuance de troca ou substituição. «Resgate» preserva o núcleo redentor sem ampliar o texto com uma formulação técnica.
- source_word: ὑπὲρ πάντων
  choice: por todos
  rationale: ὑπέρ pode significar «por» ou «em favor de». «Por todos» é conciso e mantém a amplitude de πάντων sem decidir se a referência é a cada indivíduo ou a todas as categorias de pessoas.
- source_word: τὸ μαρτύριον
  choice: o testemunho dado
  rationale: A expressão nominal é comprimida e provavelmente retoma, em aposição, a entrega de Cristo. «O testemunho dado» torna a relação inteligível em português, deixando em nota a construção mais formal sem o particípio implícito.
- source_word: καιροῖς ἰδίοις
  choice: nos tempos determinados
  rationale: O plural καιροῖς indica ocasiões ou tempos próprios, adequados ou designados. «Tempos determinados» comunica a ideia de momentos estabelecidos sem inserir explicitamente um agente não nomeado.
theological_decisions:
- issue: Alcance de πάντων em relação ao resgate de Cristo
  choice: por todos
  alternative: por toda espécie de pessoas; por cada pessoa sem exceção
  rationale: A redação universal do grego é preservada sem solucionar no texto traduzido debates posteriores sobre a extensão da obra de Cristo.
- issue: Força substitutiva de ἀντίλυτρον
  choice: resgate
  alternative: preço de resgate em troca de todos; resgate substitutivo
  rationale: «Resgate» expressa o sentido redentor central. Tornar explícita a troca ou substituição no corpo do versículo excederia o grau de explicitação necessário.
- issue: Relação sintática de τὸ μαρτύριον com a oração anterior
  choice: A entrega de Cristo é apresentada em aposição como o testemunho dado nos tempos determinados.
  alternative: 'O testemunho acerca dessa entrega foi dado nos tempos determinados; leitura formal: «o testemunho nos tempos determinados»'
  rationale: O grego é sintaticamente comprimido. A tradução torna explícita uma relação verbal plausível para produzir português inteligível, enquanto a nota conserva a forma mais estrita e reconhece a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Entregou-se» evita o decalque pouco natural «deu a si mesmo». A formulação principal explicita com moderação a frase nominal final, e a nota preserva sua compressão e ambiguidade.
