  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: pt
  text: o qual deseja que todas as pessoas sejam salvas e cheguem ao conhecimento da verdade[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quer que todas as pessoas sejam salvas”. O verbo grego também pode ser traduzido por “quer” ou “tem a vontade de”; escolheu-se “deseja” para não resolver debates teológicos além do que o texto afirma.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cheguem ao pleno conhecimento da verdade”. O substantivo grego pode conter a nuance de conhecimento mais pleno ou completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: o qual
  rationale: Pronome relativo que retoma Deus no versículo anterior. «O qual» preserva a ligação sintática e concorda com o registro digno do texto.
- source_word: πάντας ἀνθρώπους
  choice: todas as pessoas
  rationale: A expressão se refere aos seres humanos em geral, não apenas aos homens do sexo masculino. A formulação preserva de modo claro o alcance universal do grego.
- source_word: θέλει
  choice: deseja
  rationale: θέλω pode significar querer, desejar ou ter vontade. «Deseja» comunica sua força sem transformar o verbo em termo técnico sobre a vontade decretiva de Deus.
- source_word: σωθῆναι
  choice: sejam salvas
  rationale: O infinitivo passivo de σῴζω tem aqui seu sentido soteriológico habitual; «ser salvas» é a expressão portuguesa mais direta e reconhecível.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: ao conhecimento da verdade
  rationale: A expressão indica conhecimento ou reconhecimento da verdade e pode sugerir conhecimento pleno. A tradução principal é natural e evita tornar obrigatória uma nuance intensiva que o contexto não exige.
- source_word: ἐλθεῖν
  choice: cheguem
  rationale: Com εἰς, ἔρχομαι expressa movimento em direção a um estado ou realidade. «Cheguem ao conhecimento» é idiomático em português e mantém essa imagem.
theological_decisions:
- issue: Alcance de πάντας ἀνθρώπους e vontade salvífica divina
  choice: Traduzir diretamente como «todas as pessoas» e θέλει como «deseja», mantendo tanto o alcance universal da frase quanto a tensão teológica.
  alternative: «Todos os tipos de pessoas»; «quer que todas as pessoas sejam salvas»; «determina que todas as pessoas sejam salvas».
  rationale: O grego apresenta naturalmente a expressão com alcance universal. Restringi-la a categorias de pessoas ou converter θέλει em termo técnico sobre decreto divino resolveria na tradução uma discussão que o próprio enunciado deixa em tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Todas as pessoas» evita o masculino genérico potencialmente ambíguo; «o qual» mantém a conexão com o antecedente fora deste versículo isolado. As notas preservam alternativas lexicais relevantes sem impor uma leitura denominacional.
