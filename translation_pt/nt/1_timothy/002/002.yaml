id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: pt
  text: pelos reis e por todos os que ocupam posições elevadas[a], para que vivamos uma vida tranquila e sossegada, com toda devoção a Deus e dignidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por todos os que estão em posição de autoridade”. A expressão grega significa literalmente “todos os que estão em posição elevada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: por
  rationale: No contexto das orações e intercessões do versículo anterior, indica as pessoas em favor de quem se ora; “por” é natural e preciso em português.
- source_word: βασιλέων
  choice: reis
  rationale: Preserva o sentido específico do substantivo grego, sem generalizá-lo para “governantes”.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: todos os que ocupam posições elevadas
  rationale: Expressa a ideia de eminência ou posição superior sem restringir a frase exclusivamente à autoridade formal.
- source_word: ἵνα
  choice: para que
  rationale: Marca de modo natural a finalidade pretendida.
- source_word: ἤρεμον
  choice: tranquila
  rationale: Comunica calma e ausência de perturbação, mantendo distinção em relação a ἡσύχιον.
- source_word: ἡσύχιον
  choice: sossegada
  rationale: Expressa quietude e estabilidade; forma com “tranquila” uma dupla natural em português sem eliminar a nuance de cada adjetivo.
- source_word: βίον διάγωμεν
  choice: vivamos uma vida
  rationale: Reproduz de maneira clara e corrente a ideia de conduzir ou passar a vida, evitando o menos idiomático “conduzamos uma vida”.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: com toda devoção a Deus
  rationale: εὐσέβεια designa devoção reverente manifestada na conduta. A formulação explicita o referente divino de modo inteligível e evita a possível estranheza de “piedade” no português moderno.
- source_word: σεμνότητι
  choice: dignidade
  rationale: Comunica seriedade moral e conduta digna de respeito em linguagem atual.
theological_decisions:
- issue: Alcance e finalidade da oração pelos governantes civis
  choice: O texto pede oração pelos reis e por todos os que estão em posição elevada, visando condições em que os fiéis possam viver com tranquilidade, devoção e dignidade.
  alternative: Interpretar a frase como uma afirmação mais ampla de submissão política ou limitá-la apenas a autoridades formalmente constituídas.
  rationale: O grego identifica os beneficiários da oração e sua finalidade prática, mas não declara aprovação irrestrita dos governantes nem desenvolve aqui uma doutrina completa da autoridade civil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Devoção a Deus” verte εὐσέβεια de forma transparente; “tranquila e sossegada” preserva os dois adjetivos gregos em uma combinação natural.
