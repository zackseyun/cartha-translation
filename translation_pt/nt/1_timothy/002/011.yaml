  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: pt
  text: A mulher[b] deve aprender em quietude[a], com toda submissão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em silêncio”; o termo grego também pode indicar quietude ou calma, não necessariamente ausência absoluta de fala.
    reason: lexical_alternative
  - marker: b
    text: Ou “esposa”, se o contexto for entendido como conjugal; a palavra grega pode significar tanto “mulher” como “esposa”.
    reason: alternative_reading
lexical_decisions:
- source_word: γυνὴ
  choice: A mulher
  rationale: γυνή pode significar “mulher” ou “esposa”, conforme o contexto. Aqui, o singular sem artigo é mais naturalmente genérico; “a mulher” preserva o singular sem especificar estado civil.
- source_word: ἐν ἡσυχίᾳ
  choice: em quietude
  rationale: ἡσυχία pode indicar quietude, calma ou silêncio. “Em quietude” conserva a construção preposicional e não impõe necessariamente mudez absoluta.
- source_word: μανθανέτω
  choice: deve aprender
  rationale: O imperativo presente na terceira pessoa dá uma instrução positiva. “Deve aprender” comunica com clareza essa força diretiva em português moderno.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: com toda submissão
  rationale: ὑποταγή denota submissão, e πάσῃ lhe confere abrangência. “Com toda submissão” é natural em português e não acrescenta um objeto de submissão que o grego não explicita.
theological_decisions:
- issue: Se ἡσυχία deve ser entendida como silêncio absoluto ou como atitude quieta
  choice: quietude
  alternative: silêncio
  rationale: O termo admite “silêncio”, mas também descreve calma e conduta sossegada. A tradução escolhida preserva essa amplitude sem tornar a instrução mais absoluta do que o grego exige.
- issue: Se γυνή deve ser traduzido como “mulher” ou “esposa”
  choice: mulher
  alternative: esposa
  rationale: A frase não assinala explicitamente uma relação conjugal. “Mulher” evita restringir o referente, enquanto a nota preserva a possibilidade contextual de “esposa”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quietude” preserva a ambiguidade lexical, e “com toda submissão” soa mais natural em português do que uma reprodução rígida de ambas as preposições gregas.
