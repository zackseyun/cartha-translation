  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: pt
  text: Mas não permito que a mulher ensine nem exerça autoridade sobre o homem[a][b]; em vez disso, que ela esteja em quietude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a esposa ... sobre o marido”. As palavras gregas podem ter tanto o sentido geral (“mulher/homem”) quanto o conjugal (“esposa/marido”).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “tenha autoridade sobre”; possivelmente, “domine”. O verbo grego é raro, e sua nuance é discutida.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “em silêncio”. O termo grego pode indicar quietude, calma ou silêncio, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: ensine
  rationale: Expressa de modo natural o infinitivo que complementa «não permito», sem acrescentar uma nuance aspectual ausente no português corrente.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição levemente adversativa em relação à instrução anterior.
- source_word: γυναικὶ
  choice: a mulher
  rationale: γυνή pode significar «mulher» ou «esposa». O sentido geral é adotado no texto, enquanto o sentido conjugal é preservado em nota.
- source_word: οὐκ ἐπιτρέπω
  choice: não permito
  rationale: Reproduz de maneira direta e digna o presente do indicativo, sem decidir se Paulo descreve uma regra geral ou sua prática presente.
- source_word: οὐδὲ
  choice: nem
  rationale: Coordena naturalmente, sob a mesma negação, os dois infinitivos proibidos.
- source_word: αὐθεντεῖν
  choice: exerça autoridade sobre
  rationale: Oferece um sentido de autoridade relativamente neutro para o verbo raro, sem impor a nuance negativa de «dominar»; alternativas são registradas em nota.
- source_word: ἀνδρός
  choice: o homem
  rationale: ἀνήρ pode significar «homem» ou «marido». O sentido geral é preferido no texto, com a leitura conjugal indicada em nota.
- source_word: ἀλλ’
  choice: em vez disso
  rationale: Torna claro o contraste entre a proibição e a postura positiva que se segue.
- source_word: εἶναι
  choice: ela deve permanecer
  rationale: Explicita em português o sujeito e a força esperada da construção infinitiva. «Permanecer» expressa a condição em que ela deve estar, sem sugerir necessariamente duração permanente.
- source_word: ἐν ἡσυχίᾳ
  choice: em quietude
  rationale: Preserva o campo semântico de calma, sossego ou silêncio e evita afirmar inequivocamente silêncio absoluto.
theological_decisions:
- issue: Sentido de αὐθεντεῖν em um texto eclesial debatido
  choice: exerça autoridade sobre
  alternative: tenha autoridade sobre; domine
  rationale: Como o verbo é raro e sua nuance é discutida, o texto principal usa uma formulação relativamente neutra. A nota preserva tanto a alternativa mais estática quanto a possível nuance negativa, sem resolver pela tradução o debate teológico.
- issue: Se γυνή / ἀνήρ designam mulher/homem ou esposa/marido
  choice: a mulher ... o homem
  alternative: a esposa ... o marido
  rationale: Os dois substantivos admitem sentidos gerais e conjugais. O contexto favorece como padrão a referência geral, mas a possibilidade conjugal é genuína e fica registrada em nota.
- issue: Alcance de ἡσυχία
  choice: quietude
  alternative: silêncio
  rationale: «Quietude» preserva a possibilidade de uma postura calma e sossegada sem transformar automaticamente a instrução em exigência de mudez absoluta; «silêncio» continua sendo uma tradução lexical possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português. As notas mantêm as ambiguidades lexicais relevantes sem inserir uma conclusão denominacional.
