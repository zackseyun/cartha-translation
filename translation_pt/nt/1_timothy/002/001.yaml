id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: pt
  text: Portanto, antes de tudo, exorto que se façam súplicas, orações, intercessões e ações de graças por todas as pessoas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “todas as pessoas” é genérica e se refere aos seres humanos, não somente aos homens.
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem aqui “pessoas de todos os tipos”; o grego diz simplesmente “todas as pessoas”.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: exorto
  rationale: O verbo introduz uma orientação apostólica insistente. “Exorto” preserva essa força sem reduzi-la a um simples pedido.
- source_word: οὖν
  choice: Portanto
  rationale: Marca uma transição inferencial ligada ao que foi dito anteriormente.
- source_word: πρῶτον πάντων
  choice: antes de tudo
  rationale: A expressão indica prioridade ou importância principal, sem necessariamente iniciar uma sequência numerada.
- source_word: ποιεῖσθαι
  choice: que se façam
  rationale: A construção impessoal é natural em português e abrange os quatro tipos de oração sem acrescentar uma nuance litúrgica específica.
- source_word: δεήσεις
  choice: súplicas
  rationale: Designa pedidos insistentes motivados por alguma necessidade; “súplicas” conserva essa intensidade.
- source_word: προσευχάς
  choice: orações
  rationale: É o termo geral para orações e recebe aqui sua tradução direta e corrente.
- source_word: ἐντεύξεις
  choice: intercessões
  rationale: No contexto de oração em favor de outros, “intercessões” é uma tradução portuguesa clara e tradicional, embora o termo também possa ter o sentido mais amplo de apelos ou pedidos.
- source_word: εὐχαριστίας
  choice: ações de graças
  rationale: Expressão portuguesa natural que preserva a distinção entre agradecimento e os demais tipos de oração da lista.
- source_word: ὑπὲρ
  choice: por
  rationale: Com o genitivo, indica benefício ou representação. “Por” é idiomático em português e pode significar “em favor de” neste contexto.
- source_word: πάντων ἀνθρώπων
  choice: todas as pessoas
  rationale: ἄνθρωπος é genérico aqui e se refere a seres humanos, não apenas a homens do sexo masculino.
theological_decisions:
- issue: Alcance de πάντων ἀνθρώπων
  choice: todas as pessoas
  alternative: pessoas de todos os tipos
  rationale: O grego diz literalmente “todas as pessoas” e não restringe explicitamente a expressão a grupos ou categorias. A tradução mantém o sentido direto, enquanto a nota registra a interpretação alternativa sem resolver no texto uma questão teológica debatida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Exorto” mantém a seriedade da instrução apostólica; “que se façam” evita uma passiva rígida; e “ações de graças” é a forma idiomática consagrada em português.
