id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: pt
  text: Contudo, ela será salva por meio de dar à luz filhos[a][b][c], se elas permanecerem na fé, no amor e na santidade, com domínio próprio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio do parto”. Alguns entendem a expressão como referência a um nascimento específico, possivelmente o do Messias; ela também pode ser entendida de modo geral, como referência a dar à luz filhos.
    reason: alternative_reading
  - marker: b
    text: “Fé” também pode ter aqui o sentido de “fidelidade”.
    reason: lexical_alternative
  - marker: c
    text: O grego passa do singular (“ela será salva”) para o plural (“se elas permanecerem”).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: será salva
  rationale: O futuro passivo de σῴζω tem normalmente o sentido de salvar no uso paulino. A tradução evita restringi-lo a proteção física, algo que o texto não explicita.
- source_word: δὲ
  choice: Contudo
  rationale: Expressa o contraste ou desenvolvimento moderado introduzido por δέ sem torná-lo excessivamente enfático.
- source_word: διὰ τῆς τεκνογονίας
  choice: por meio da maternidade
  rationale: τεκνογονία designa a geração de filhos ou a maternidade ligada a dar à luz. Esta formulação é natural em português e não limita a expressão ao momento físico do parto; a possível referência a um parto específico é preservada em nota.
- source_word: ἐὰν
  choice: se
  rationale: Representa diretamente a condição introduzida por ἐάν.
- source_word: μείνωσιν
  choice: elas permanecerem
  rationale: Mantém o plural do verbo grego e comunica a ideia de continuar ou perseverar num estado.
- source_word: ἐν πίστει
  choice: na fé
  rationale: É a tradução usual de πίστις neste contexto, sem excluir a nuance possível de fidelidade, registrada em nota.
- source_word: ἀγάπῃ
  choice: no amor
  rationale: Tradução corrente e clara de ἀγάπη.
- source_word: ἁγιασμῷ
  choice: na santidade
  rationale: Expressa de modo natural o sentido moral e espiritual de ἁγιασμός, evitando o jargão mais técnico 'santificação'.
- source_word: μετὰ σωφροσύνης
  choice: com domínio próprio
  rationale: σωφροσύνη pode indicar autocontrole, sensatez ou sobriedade; 'domínio próprio' é claro, digno e apropriado à lista de virtudes.
theological_decisions:
- issue: Mudança do singular em 'ela será salva' para o plural em 'se elas permanecerem'
  choice: Preservar a mudança gramatical do singular para o plural.
  alternative: Uniformizar a frase como 'as mulheres serão salvas... se permanecerem' ou interpretar explicitamente 'ela' como Eva.
  rationale: O grego muda efetivamente do singular para o plural. Manter essa mudança preserva a tensão interpretativa entre a mulher mencionada anteriormente, possivelmente Eva, e um grupo mais amplo de mulheres.
- issue: Sentido de 'salva por meio da maternidade'
  choice: Manter 'salva' e a relação instrumental ampla 'por meio da maternidade', sem definir o tipo de salvação nem seu mecanismo.
  alternative: Traduzir como 'será protegida durante o parto', 'será salva ao assumir a maternidade' ou 'será salva por meio do nascimento do Messias'.
  rationale: A construção é genuinamente difícil. O grego não especifica proteção física no parto, uma vocação materna como condição de salvação, nem uma referência messiânica inequívoca; por isso, a tradução não deve resolver a ambiguidade doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a mudança de número do original e evita explicar no corpo do versículo uma passagem cuja interpretação é disputada. Os marcadores seguem a ordem natural de consulta no texto.
