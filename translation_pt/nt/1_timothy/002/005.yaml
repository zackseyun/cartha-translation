  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: pt
  text: 'Pois há um só Deus e um só mediador entre Deus e os seres humanos: um ser humano, o Messias Jesus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir a expressão final como «o homem, Cristo Jesus». O grego usa a mesma palavra básica para «seres humanos» e «ser humano» e chama Jesus de Χριστός, isto é, «Messias».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς
  choice: um só
  rationale: 'A construção portuguesa «um só» preserva a ênfase e o paralelismo das duas ocorrências: um só Deus, um só mediador.'
- source_word: γὰρ
  choice: Pois
  rationale: Marca de modo natural a relação explicativa com o contexto anterior.
- source_word: θεός
  choice: Deus
  rationale: Equivalente padrão neste contexto.
- source_word: μεσίτης
  choice: mediador
  rationale: Termo corrente e preciso para quem atua entre duas partes.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: entre Deus e os seres humanos
  rationale: Embora o grego empregue genitivos, «mediador entre» é a construção idiomática em português; «seres humanos» comunica o sentido genérico do plural ἀνθρώπων.
- source_word: ἄνθρωπος
  choice: um ser humano
  rationale: Preserva a correspondência lexical com ἀνθρώπων e afirma de modo claro a humanidade do mediador. O artigo indefinido reflete adequadamente a forma grega sem artigo, sem reduzir Jesus a apenas um ser humano entre outros.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz Χριστός como título, em português natural, em vez de tratá-lo como sobrenome.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa estabelecida do nome pessoal.
theological_decisions:
- issue: Relação entre ἀνθρώπων e ἄνθρωπος
  choice: seres humanos ... um ser humano
  alternative: homens ... o homem
  rationale: A escolha mantém visível a repetição da mesma família conceitual e a ênfase na verdadeira humanidade do mediador, sem usar «homens» de modo potencialmente ambíguo quanto ao gênero.
- issue: Valor titular de Χριστός
  choice: o Messias Jesus
  alternative: Cristo Jesus
  rationale: «Messias» torna explícito que Χριστός é um título. O artigo torna a expressão compreensível em português, embora a ordem permaneça próxima da sequência grega.
- issue: Implicação cristológica de ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: Afirmar diretamente a humanidade de Jesus sem acrescentar uma negação ou explicação de sua divindade
  alternative: Reformular a expressão para explicitar simultaneamente humanidade e divindade
  rationale: O versículo enfatiza a humanidade do mediador. A tradução conserva essa afirmação e a tensão do texto, sem inserir uma conclusão que não está expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pois» mantém a conexão argumentativa; os dois casos de «um só» reproduzem a ênfase paralela. Os dois-pontos explicitam a aposição sem alterar a relação sintática essencial.
