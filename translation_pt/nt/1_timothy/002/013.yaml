lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão que fundamenta a instrução anterior, preservando de modo natural e conciso a força explicativa do grego.
- source_word: Ἀδὰμ
  choice: Adão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: πρῶτος
  choice: primeiro
  rationale: Expressa a prioridade temporal de Adão em relação à formação de Eva.
- source_word: ἐπλάσθη
  choice: foi formado
  rationale: Preserva a voz passiva e a ideia de moldar ou dar forma, ecoando a linguagem da criação em Gênesis com mais precisão do que o termo mais amplo «foi criado».
- source_word: εἶτα
  choice: e depois
  rationale: Marca de maneira idiomática a sequência temporal simples indicada pelo grego.
- source_word: Εὕα
  choice: Eva
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Relação com a ordem da criação em Gênesis num contexto eclesial debatido
  choice: 'Traduzir o versículo como uma afirmação simples de sequência temporal: Adão foi formado primeiro, e depois Eva.'
  alternative: Inserir na tradução implicações interpretativas sobre autoridade ou distinções de função.
  rationale: O texto grego declara a ordem de formação, mas não explicita neste versículo isolado a inferência teológica. A tradução conserva a afirmação temporal sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. «Pois» mantém a ligação argumentativa com o versículo anterior; «foi formado» conserva o eco de Gênesis.
