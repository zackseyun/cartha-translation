    rationale: O composto ἐξαπατάω pode ter força intensiva, mas ela não deve ser tratada como certa neste contexto. «Enganada» preserva o sentido básico, e a alternativa intensiva pode ficar na nota.
  - severity: medium
    issue: «Passou a estar em transgressão» é pouco idiomático.
    rationale: A expressão soa calcada e prejudica a leitura. «Ficou em transgressão» mantém a expressão abstrata e pode comunicar o resultado expresso pelo perfeito γέγονεν.
  revised_text: E Adão não foi enganado, mas a mulher, depois de ser enganada,[a] ficou em transgressão.[b]
