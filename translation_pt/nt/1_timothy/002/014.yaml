  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: pt
  text: E Adão não foi enganado, mas a mulher, depois de ser enganada,[a] ficou em transgressão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de ser completamente enganada”. O verbo grego pode ter sentido intensivo, embora essa intensidade não seja certa em todos os contextos.
    reason: lexical_alternative
  - marker: b
    text: Ou “veio a estar em transgressão” ou “tem estado em transgressão”. O perfeito grego pode ressaltar o estado resultante.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἠπατήθη
  choice: não foi enganado
  rationale: Traduz diretamente o aoristo passivo de ἀπατάω, sem acrescentar uma explicação sobre intenção ou culpa.
- source_word: ἡ δὲ γυνὴ
  choice: mas a mulher
  rationale: δὲ expressa o contraste com Adão, e γυνή é traduzido como “mulher” por causa da alusão à narrativa de Gênesis; “esposa” também é lexicalmente possível, mas é menos transparente aqui.
- source_word: ἐξαπατηθεῖσα
  choice: depois de ser completamente enganada
  rationale: A construção explicita a anterioridade circunstancial do particípio aoristo. “Completamente” procura representar a possível força intensiva do verbo composto ἐξαπατάω, sem tornar essa nuance incontestável, razão pela qual se inclui nota.
- source_word: ἐν παραβάσει
  choice: em transgressão
  rationale: Conserva o substantivo abstrato παράβασις e a formulação preposicional, evitando transformá-la interpretativamente em “transgressora” ou acrescentar “caiu”.
- source_word: γέγονεν
  choice: passou a estar
  rationale: Expressa tanto a mudança ocorrida quanto o estado resultante sugerido pelo perfeito de γίνομαι, em português compreensível.
- source_word: καὶ
  choice: E
  rationale: Mantém a ligação simples da afirmação com o argumento anterior.
theological_decisions:
- issue: Como expressar a relação da mulher com a transgressão sem ampliar a afirmação para uma conclusão geral sobre as mulheres.
  choice: 'Conservar a referência histórica e abstrata: “a mulher [...] passou a estar em transgressão”.'
  alternative: “a mulher [...] tornou-se transgressora”
  rationale: A opção escolhida segue a formulação grega e evita converter o substantivo abstrato em um rótulo pessoal ou acrescentar uma generalização ausente do versículo.
- issue: Se a diferença entre ἀπατάω e ἐξαπατάω deve ser apresentada como intensidade certa.
  choice: Usar “completamente enganada” no texto e registrar em nota a tradução menos intensiva.
  alternative: “depois de ser enganada”
  rationale: O verbo composto pode ter força intensiva, mas essa força não precisa estar ativa em todo uso; a nota preserva a legítima incerteza lexical.
- issue: Como representar o perfeito γέγονεν.
  choice: “passou a estar”, com nota sobre as alternativas temporais e o estado resultante.
  alternative: “veio a estar” ou “tem estado”
  rationale: A tradução procura preservar o evento e seu resultado sem decidir além do que a forma verbal permite.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por uma estrutura próxima do grego onde ela permanece compreensível. A expressão menos habitual “em transgressão” foi mantida deliberadamente para preservar o substantivo abstrato e evitar uma paráfrase teologicamente mais carregada.
