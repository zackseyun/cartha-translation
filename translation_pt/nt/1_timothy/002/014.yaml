  source_fidelity: A estrutura contrastiva e as referências a Adão e à mulher são fiéis ao grego. Contudo, «completamente enganada» apresenta como principal uma possível intensificação de ἐξαπατηθεῖσα que não é obrigatória; é mais seguro manter «enganada» no texto e registrar a intensificação em nota. «Passou a estar em transgressão» tenta reproduzir o perfeito γέγονεν, mas é um calque pouco idiomático em português.
  naturalness: «Depois de ser enganada» é claro e natural. «Ficou em transgressão» comunica de modo mais idiomático a entrada numa condição e o estado resultante, sem transformar παράβασις em rótulo pessoal.
  terminology: «Adão», «mulher», «enganado» e «transgressão» são adequados. A manutenção de «em transgressão» preserva o substantivo abstrato e evita a interpretação mais forte «tornou-se transgressora».
  issues:
