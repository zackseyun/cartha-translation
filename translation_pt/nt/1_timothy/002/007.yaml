  source_fidelity: O texto transmite com precisão εἰς ὃ («Para isso»), o passivo de nomeação em ἐτέθην, as funções κῆρυξ e ἀπόστολος, a afirmação parentética enfática e διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ. «Gentios» é contextualmente adequado para ἐθνῶν, e «em fé e verdade» preserva a concisão e a abertura sintática do grego.
