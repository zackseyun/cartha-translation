  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: pt
  text: Para isso fui designado proclamador e apóstolo — digo a verdade, não minto — e mestre dos gentios[a], em fé e verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mestre das nações».
    reason: lexical_alternative
  - marker: b
    text: Ou «em fidelidade e verdade».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Para isso
  rationale: Retoma o propósito ou a proclamação precedente e expressa de modo natural tanto a referência quanto a finalidade; a alternativa «para o que» é possível, mas menos fluente em português.
- source_word: ἐτέθην
  choice: fui designado
  rationale: O passivo de τίθημι indica aqui nomeação ou incumbência para uma função, não simples colocação física.
- source_word: κῆρυξ
  choice: proclamador
  rationale: Comunica alguém incumbido de anunciar publicamente em nome de outro. «Arauto» preservaria melhor a imagem institucional antiga, mas é menos corrente para muitos leitores.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: É o título reconhecido na autorreferência paulina e a tradução mais precisa neste contexto.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: digo a verdade, não minto
  rationale: Preserva a dupla afirmação enfática em português natural e direto.
- source_word: διδάσκαλος ἐθνῶν
  choice: mestre dos gentios
  rationale: No uso paulino, ἔθνη frequentemente designa os povos não judeus; «gentios» torna esse referente explícito sem excluir a alternativa lexical «nações».
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: em fé e verdade
  rationale: Mantém a forma concisa e a abertura semântica do grego quanto à esfera, maneira ou qualidade do ministério; πίστις pode também significar fidelidade.
theological_decisions:
- issue: Sentido de ἐθνῶν na comissão de Paulo
  choice: gentios
  alternative: nações
  rationale: O contexto e o uso paulino favorecem os povos não judeus, enquanto «nações» permanece uma tradução lexical possível.
- issue: Sentido de πίστις em ἐν πίστει καὶ ἀληθείᾳ
  choice: fé
  alternative: fidelidade
  rationale: «Fé» preserva a tradução usual e a possível referência à esfera ou ao conteúdo do ensino, sem eliminar o sentido possível de fidelidade.
- issue: Função de ἐν em ἐν πίστει καὶ ἀληθείᾳ
  choice: em
  alternative: com
  rationale: A preposição pode indicar esfera ou maneira. A formulação literal evita decidir de modo excessivo entre essas relações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Proclamador» evita tanto o arcaísmo relativo de «arauto» quanto associações eclesiásticas mais estreitas de «pregador». Os travessões preservam a afirmação parentética enfática. Os marcadores aparecem após a frase pertinente, em ordem alfabética.
