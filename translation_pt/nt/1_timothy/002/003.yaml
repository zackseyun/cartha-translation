  text: Isso é bom e aceitável diante de Deus, nosso Salvador,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Isso
  rationale: O demonstrativo neutro singular retoma a orientação anterior sobre a oração. “Isso” preserva a referência anafórica de modo natural, sem explicitar além do texto.
- source_word: καλὸν
  choice: bom
  rationale: Neste contexto ético, καλός indica aquilo que é moralmente bom ou apropriado, não beleza estética.
- source_word: ἀπόδεκτον
  choice: aceitável
  rationale: O adjetivo descreve o que é acolhido favoravelmente. “Aceitável” mantém o sentido avaliativo sem interpretar de forma mais intensa como “agradável”.
- source_word: ἐνώπιον
  choice: diante de
  rationale: A expressão indica a avaliação ou consideração de Deus. “Diante de” é corrente, digna e semanticamente adequada.
- source_word: σωτῆρος
  choice: Salvador
  rationale: “Salvador” é o equivalente português estabelecido para σωτήρ e preserva seu valor de título.
- source_word: ἡμῶν
  choice: nosso
  rationale: O pronome genitivo modifica “Salvador” e é reproduzido diretamente.
- source_word: θεοῦ
  choice: Deus
  rationale: O substantivo está em relação apositiva com “nosso Salvador”; a ordem “Deus, nosso Salvador” é natural em português e identifica Deus como Salvador.
theological_decisions:
- issue: Relação apositiva em τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Deus, nosso Salvador
  alternative: nosso Deus Salvador
  rationale: Os genitivos são naturalmente entendidos em aposição, identificando Deus como “nosso Salvador”. A vírgula torna essa relação clara em português sem acrescentar afirmações doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a concisão do grego e a continuidade sintática indicada pela vírgula final.
