lexical_decisions:
- source_word: Βούλομαι
  choice: quero
  rationale: Expressa vontade ou desejo com força diretiva, de modo natural no português atual.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a ligação lógica com a argumentação anterior.
- source_word: προσεύχεσθαι
  choice: orem
  rationale: Equivalente corrente de προσεύχομαι; a forma finita é natural após «quero que».
- source_word: τοὺς ἄνδρας
  choice: os homens
  rationale: ἀνήρ refere-se aqui especificamente a homens, em harmonia com as instruções diferenciadas do contexto imediato.
- source_word: ἐν παντὶ τόπῳ
  choice: em todo lugar
  rationale: Mantém o sentido distributivo da expressão grega em português natural.
- source_word: ἐπαίροντας
  choice: levantando
  rationale: Descreve o gesto que acompanha a oração.
- source_word: ὁσίους χεῖρας
  choice: mãos santas
  rationale: Tradução direta que conserva a ideia de santidade e conduta aceitável diante de Deus, sem substituir o adjetivo por «puras».
- source_word: χωρὶς ὀργῆς
  choice: sem ira
  rationale: Expressa a ausência de ira; «ira» preserva o tom elevado e continua clara no português moderno.
- source_word: διαλογισμοῦ
  choice: discussões
  rationale: No contexto da oração comunitária e em associação com a ira, provavelmente indica disputas contenciosas; a possibilidade de «dúvida» é preservada em nota.
theological_decisions:
- issue: Referência específica de τοὺς ἄνδρας
  choice: os homens
  alternative: as pessoas; todos; os maridos
  rationale: O substantivo masculino é específico neste contexto, que passa a dar instruções diferenciadas a homens e mulheres; uma formulação genérica apagaria essa particularidade.
- issue: Sentido de διαλογισμοῦ no contexto da oração
  choice: discussões
  alternative: dúvida; questionamento; disputa
  rationale: A associação com «ira» favorece o sentido relacional de contenda, mas a possibilidade lexical de dúvida interior permanece genuína e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «quero que ... orem» evita rigidez, enquanto «mãos santas» conserva a imagem tradicional e a forma do original.
