source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: pt
  text: Mas rejeite os mitos profanos e típicos de velhas[a]; exercite-se, porém, para a devoção a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “mitos característicos de mulheres idosas”. A expressão grega é depreciativa. Também se pode traduzir: “histórias de comadres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: profanos
  rationale: Preserva o contraste entre o que é sagrado e o que é comum, irreverente ou alheio ao sagrado.
- source_word: γραώδεις
  choice: próprios de velhas
  rationale: Reproduz de modo transparente o sentido literal e pejorativo do adjetivo grego, sem substituí-lo por uma caracterização genérica como “tolos”.
- source_word: μύθους
  choice: mitos
  rationale: Designa relatos inventados ou especulativos e corresponde diretamente ao termo grego.
- source_word: παραιτοῦ
  choice: rejeite
  rationale: Expressa com concisão a ordem de recusar e não acolher tais mitos.
- source_word: γύμναζε
  choice: exercite-se
  rationale: Mantém a metáfora de exercício ou treinamento presente no verbo grego e sua forma reflexiva no contexto.
- source_word: σεαυτόν
  choice: -se
  rationale: O pronome reflexivo está expresso naturalmente na construção portuguesa “exercite-se”.
- source_word: πρὸς εὐσέβειαν
  choice: para a devoção a Deus
  rationale: πρός indica a meta do exercício; “devoção a Deus” comunica uma vida reverente orientada para Deus sem limitar εὐσέβεια a práticas religiosas formais.
- source_word: δὲ ... δὲ
  choice: Mas ... porém
  rationale: O primeiro conector marca contraste com o contexto anterior; o segundo destaca a contraposição entre rejeitar os mitos e exercitar-se para a devoção.
theological_decisions:
- issue: Sentido de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: “Devoção a Deus” torna explícita a orientação religiosa do termo no contexto das Pastorais, enquanto “piedade” pode ser entendida apenas como compaixão ou assumir um tom técnico e menos acessível.
- issue: Expressão pejorativa γραώδεις μύθους
  choice: mitos ... próprios de velhas
  alternative: mitos tolos; histórias de comadres
  rationale: A tradução conserva a imagem específica e a aspereza cultural do grego, sem endossá-la nem suavizá-la silenciosamente. A nota explica seu caráter depreciativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para que “próprios de velhas” modifique “mitos” sem ambiguidade. A formulação culturalmente marcada foi preservada por fidelidade histórica e esclarecida em nota.
