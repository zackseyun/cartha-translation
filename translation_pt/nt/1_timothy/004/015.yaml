  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: pt
  text: Pratique estas coisas; esteja inteiramente envolvido nelas[a], para que o seu progresso seja evidente a todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “esteja nestas coisas”; isto é, dedique-se plenamente a elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: estas coisas
  rationale: Retoma as instruções anteriores de Paulo sem restringir seu alcance; é natural e mantém o demonstrativo plural.
- source_word: μελέτα
  choice: Pratique
  rationale: Neste contexto, o imperativo abrange dedicação cuidadosa e aplicação contínua, não apenas reflexão interior.
- source_word: ἐν τούτοις ἴσθι
  choice: esteja inteiramente envolvido nelas
  rationale: A expressão grega diz literalmente 'esteja nestas coisas' e comunica envolvimento pleno. A formulação escolhida torna esse sentido idiomático e claro em português, enquanto a nota preserva a forma literal.
- source_word: ἵνα
  choice: para que
  rationale: Expressa naturalmente a relação de propósito ou resultado sem eliminar essa nuance.
- source_word: σου
  choice: seu
  rationale: Reproduz o genitivo possessivo ligado a 'progresso'.
- source_word: προκοπή
  choice: progresso
  rationale: Preserva o sentido amplo de avanço observável, sem limitá-lo à maturidade espiritual ou à eficácia ministerial.
- source_word: φανερὰ ᾖ
  choice: seja evidente
  rationale: Comunica que o progresso deve ser manifesto e reconhecível publicamente.
- source_word: πᾶσιν
  choice: a todos
  rationale: Tradução direta e concisa do dativo plural, abrangendo todas as pessoas em vista.
theological_decisions:
- issue: Alcance do progresso visível de Timóteo
  choice: Progresso amplo e observável no cumprimento das instruções anteriores
  alternative: Crescimento principalmente espiritual ou eficácia principalmente ministerial
  rationale: O contexto inclui ensino, conduta e dedicação. O termo amplo 'progresso' preserva essa abrangência e não impõe uma distinção que o grego não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Esteja inteiramente envolvido nelas' evita o pouco natural 'esteja nelas', enquanto a nota registra a metáfora literal do grego.
