lexical_decisions:
- source_word: πιστὸς
  choice: digna de confiança
  rationale: Na fórmula πιστὸς ὁ λόγος, o adjetivo predicativo descreve a palavra ou declaração como confiável e merecedora de crédito. “Digna de confiança” é natural, clara e solene em português.
- source_word: ὁ λόγος
  choice: esta palavra
  rationale: λόγος aqui se refere a uma palavra, declaração ou afirmação específica. O demonstrativo “esta” torna a fórmula natural em português sem determinar indevidamente se ela aponta para o que precede ou para o que segue.
- source_word: πάσης
  choice: plena
  rationale: Na expressão πάσης ἀποδοχῆς, πάσης comunica totalidade; “plena” exprime essa força de maneira idiomática.
- source_word: ἀποδοχῆς
  choice: aceitação
  rationale: ἀποδοχή denota acolhimento ou aceitação. “Aceitação” é o equivalente moderno mais direto neste contexto.
- source_word: ἄξιος
  choice: merece
  rationale: ἄξιος com genitivo significa ser digno ou merecedor de algo. A construção verbal “merece plena aceitação” é fluente em português e preserva o sentido.
