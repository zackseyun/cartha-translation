id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: pt
  text: Não negligencie o dom que há em você, que lhe foi dado por meio de profecia[a], com a imposição das mãos do conselho de presbíteros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mediante uma declaração profética». A expressão pode indicar que a profecia acompanhou ou serviu de meio para a concessão do dom.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «do corpo de anciãos»; o termo grego se refere coletivamente ao grupo de presbíteros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Não negligencie
  rationale: O imperativo presente com μή expressa uma proibição de caráter contínuo; «não negligencie» é natural, claro e mantém a ideia de não deixar de cuidar do que foi confiado.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: o dom que há em você
  rationale: Preserva tanto χάρισμα como «dom», sem acrescentar «espiritual», quanto a localização explícita ἐν σοὶ, «em você».
- source_word: ἐδόθη σοι
  choice: lhe foi dado
  rationale: Reproduz o aoristo passivo sem identificar o agente, que permanece implícito no grego.
- source_word: διὰ προφητείας
  choice: por meio de profecia
  rationale: διά com genitivo pode indicar meio ou mediação. A formulação mantém aberta a relação exata entre a profecia e a concessão do dom.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: com a imposição das mãos
  rationale: É a expressão portuguesa corrente para o gesto ritual e corresponde de perto ao texto grego.
- source_word: τοῦ πρεσβυτερίου
  choice: do conselho de presbíteros
  rationale: πρεσβυτέριον designa aqui um corpo coletivo de anciãos ou presbíteros. «Conselho de presbíteros» comunica essa coletividade sem recorrer ao termo denominacionalmente carregado «presbitério».
theological_decisions:
- issue: Se χάρισμα deve receber especificação carismática ou ministerial explícita
  choice: dom
  alternative: dom espiritual
  rationale: Embora o contexto possa apontar para uma capacitação para o ministério, o substantivo grego não contém o adjetivo «espiritual». A tradução mais simples evita estreitar o sentido.
- issue: Como representar πρεσβυτέριον sem impor uma forma posterior de governo eclesiástico
  choice: conselho de presbíteros
  alternative: presbitério; corpo de anciãos
  rationale: O termo indica coletivamente os presbíteros envolvidos na imposição das mãos, mas não exige que a tradução atribua ao grupo uma estrutura denominacional posterior.
- issue: Relação entre a profecia e a concessão do dom
  choice: por meio de profecia
  alternative: mediante uma declaração profética
  rationale: A preposição διά permite uma ideia instrumental ou mediadora, enquanto o contexto também admite que a profecia tenha acompanhado a concessão. A tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Você» evita regionalismo excessivo; «presbíteros» conserva o vocabulário eclesial conhecido, enquanto «conselho» esclarece o caráter coletivo. Os marcadores aparecem junto às expressões a que se referem.
