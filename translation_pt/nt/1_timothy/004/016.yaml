source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: pt
  text: Preste muita atenção a si mesmo e ao ensino; persevere nessas coisas. Pois, fazendo isso, você salvará tanto a si mesmo como os que o ouvem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preservará”; o verbo grego pode indicar salvar, resgatar ou preservar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Preste muita atenção
  rationale: O imperativo pede atenção cuidadosa e contínua; esta formulação é natural em português e mantém a força da vigilância.
- source_word: σεαυτῷ
  choice: a si mesmo
  rationale: O dativo reflexivo indica aquilo a que Timóteo deve dedicar atenção.
- source_word: τῇ διδασκαλίᾳ
  choice: ao ensino
  rationale: Preserva tanto o conteúdo quanto a atividade de ensinar, com linguagem mais acessível que 'doutrina'.
- source_word: ἐπίμενε αὐτοῖς
  choice: persevere nessas coisas
  rationale: Expressa continuidade firme e toma o pronome plural como referência conjunta à conduta pessoal e ao ensino.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Pois, fazendo isso
  rationale: Reproduz de modo natural a construção participial, que indica o meio ou a prática contínua.
- source_word: σώσεις
  choice: salvará
  rationale: Mantém o peso normal e teológico de σῴζω sem restringi-lo silenciosamente à preservação temporal ou à salvação escatológica.
- source_word: τοὺς ἀκούοντάς σου
  choice: os que o ouvem
  rationale: Forma corrente que preserva o sentido dos ouvintes contínuos do ensino de Timóteo.
theological_decisions:
- issue: Sentido de σώσεις numa exortação pastoral
  choice: Manter 'salvará' no texto principal
  alternative: '''preservará'' ou uma explicitação exclusivamente escatológica'
  rationale: O texto relaciona a perseverança de Timóteo em sua vida e ensino à salvação dele e de seus ouvintes, sem explicar aqui a natureza precisa dessa relação. A tradução conserva essa tensão e não sugere salvação por mérito próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa 'você' de modo pastoral e direto; evita jargão, mas conserva o peso teológico de 'salvará'.
