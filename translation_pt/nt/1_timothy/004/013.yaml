id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: pt
  text: Até eu chegar, dedique-se à leitura pública[a], à exortação e ao ensino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à leitura das Escrituras”. O grego diz simplesmente “à leitura”, mas, pelo contexto, provavelmente se refere à leitura pública das Escrituras na reunião da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Até eu chegar
  rationale: A construção temporal indica a duração dessa responsabilidade até a chegada de Paulo. Em português, “Até eu chegar” comunica com naturalidade o sentido futuro contextual do presente ἔρχομαι.
- source_word: πρόσεχε
  choice: dedique-se
  rationale: O imperativo pede atenção contínua e empenho, não apenas um ato momentâneo de prestar atenção. “Dedique-se” expressa bem essa força durativa.
- source_word: τῇ ἀναγνώσει
  choice: à leitura pública
  rationale: ἀνάγνωσις significa literalmente “leitura”; neste contexto comunitário, provavelmente se refere à leitura pública na reunião. A tradução explicita o caráter público sem inserir “das Escrituras”, objeto não declarado no grego.
- source_word: τῇ παρακλήσει
  choice: à exortação
  rationale: παράκλησις pode significar encorajamento, apelo ou exortação. Na sequência de atividades ministeriais, “exortação” preserva melhor seu caráter pastoral e diretivo.
- source_word: τῇ διδασκαλίᾳ
  choice: ao ensino
  rationale: διδασκαλία designa aqui o ensino, seja como atividade, seja em seu conteúdo. “Ensino” é claro e evita restringir o termo ao sentido mais sistematizado que “doutrina” pode sugerir.
theological_decisions:
- issue: Se ἀνάγνωσις deve ser explicitamente identificada como leitura das Escrituras no texto principal
  choice: leitura pública
  alternative: leitura das Escrituras; leitura
  rationale: O contexto da ordem e do ministério da comunidade favorece fortemente a leitura pública das Escrituras, mas o texto grego diz apenas “a leitura”. A opção principal comunica o provável contexto público sem acrescentar um objeto não expresso; a nota preserva a alternativa contextual mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “dedique-se” mantém naturalidade e registro formal acessível. A enumeração usa artigos contraídos paralelos e dispensa a vírgula antes do último elemento, conforme o uso corrente.
