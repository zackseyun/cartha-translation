id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: pt
  text: Pois o treinamento físico[a] tem utilidade limitada[b], mas a devoção a Deus é útil para tudo, pois tem a promessa da vida presente e da que há de vir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exercício corporal”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega pode significar “por pouco tempo” ou “em pequena medida”.
    reason: lexical_ambiguity
  - marker: c
    text: Literalmente, “tendo a promessa da vida de agora e da que virá”.
    reason: formal_rendering
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: treinamento físico
  rationale: Expressa de modo natural a ideia de exercício ou disciplina do corpo, sem restringi-la necessariamente ao atletismo.
- source_word: πρὸς ὀλίγον
  choice: por pouco
  rationale: Preserva a ambiguidade do grego entre duração limitada e benefício de alcance limitado; a nota explicita as duas possibilidades.
- source_word: ὠφέλιμος
  choice: útil
  rationale: Termo corrente e claro que funciona naturalmente nas duas orações e comunica proveito sem conotação econômica.
- source_word: εὐσέβεια
  choice: devoção a Deus
  rationale: Comunica a vida reverente e orientada para Deus indicada pelo termo nas Cartas Pastorais, em linguagem compreensível e sem sugerir mero formalismo religioso.
- source_word: πρὸς πάντα
  choice: para tudo
  rationale: Mantém a amplitude da expressão grega e o contraste com o valor limitado do treinamento físico.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: pois tem a promessa
  rationale: Traduz o particípio como explicação da utilidade abrangente da devoção a Deus, sem acrescentar uma relação teológica mais específica do que o texto afirma.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: da vida presente e da que há de vir
  rationale: Reproduz o contraste temporal e mantém na segunda expressão a elipse de 'vida', facilmente entendida em português.
theological_decisions:
- issue: Alcance do valor do treinamento físico
  choice: O treinamento físico tem valor limitado, em contraste com a utilidade abrangente da devoção a Deus.
  alternative: O treinamento físico é útil somente por um curto período; ou é útil apenas em pequena medida.
  rationale: πρὸς ὀλίγον admite leitura temporal ou quantitativa. O texto principal preserva essa abertura e não apresenta o cuidado físico como inútil ou mau.
- issue: Sentido de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A escolha destaca uma vida reverente voltada para Deus, sem reduzir o termo a práticas formais nem carregar associações confessionais específicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa conserva o paralelismo e a ambiguidade real de πρὸς ὀλίγον; as notas registram alternativas relevantes sem sobrecarregar o texto principal.
