id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: pt
  text: Pois tudo o que Deus criou é bom[a], e nada deve ser rejeitado se for recebido com ações de graças[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda criatura de Deus é boa”. O termo grego κτίσμα pode significar “criatura” ou, de modo mais amplo, “coisa criada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e nada é rejeitável quando recebido com ações de graças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação que sustenta a afirmação anterior e mantém a ligação argumentativa de modo natural em português.
- source_word: πᾶν κτίσμα θεοῦ
  choice: tudo o que Deus criou
  rationale: Expressa de maneira natural o valor distributivo de πᾶν com o singular κτίσμα e o sentido de algo criado por Deus, sem restringir a referência a seres vivos nem à criação inteira como cosmos.
- source_word: καλόν
  choice: bom
  rationale: Equivalente direto e corrente, preservando a ressonância da bondade da criação.
- source_word: οὐδὲν ἀπόβλητον
  choice: nada deve ser rejeitado
  rationale: Converte naturalmente o adjetivo verbal grego em uma construção portuguesa que comunica aquilo que não se deve recusar ou descartar.
- source_word: μετὰ εὐχαριστίας
  choice: com ações de graças
  rationale: Mantém a linguagem explícita de agradecimento dirigida a Deus e sua ressonância bíblica.
- source_word: λαμβανόμενον
  choice: se for recebido
  rationale: Explicita de forma idiomática a circunstância de recepção indicada pelo particípio presente passivo, sem eliminar a possível leitura condicional.
theological_decisions:
- issue: Alcance de κτίσμα no contexto das proibições alimentares e ascéticas
  choice: tudo o que Deus criou
  alternative: toda criatura de Deus; toda coisa criada por Deus; todo alimento criado por Deus
  rationale: A formulação mantém o princípio criacional amplo do grego sem reduzi-lo diretamente a alimentos nem limitar κτίσμα a seres vivos.
- issue: Valor circunstancial ou condicional de λαμβανόμενον com μετὰ εὐχαριστίας
  choice: se for recebido com ações de graças
  alternative: quando recebido com ações de graças; sendo recebido com ações de graças
  rationale: A opção torna clara em português a relação entre não rejeitar e receber com gratidão, preservando a tensão entre uma circunstância geral e uma condição prática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Tudo o que Deus criou” evita a possível leitura de “toda a criação” como o cosmos inteiro e soa mais natural do que “cada coisa criada”. “Ações de graças” conserva a expressão bíblica tradicional sem deixar de ser compreensível.
