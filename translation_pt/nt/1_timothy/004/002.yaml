  text: ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/002.yaml
  text: through the hypocrisy of liars whose own conscience has been seared,[a]
translation:
  language: pt
  text: pela hipocrisia de mentirosos, que têm a própria consciência cauterizada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «marcados a ferro na própria consciência». A imagem grega pode indicar uma consciência marcada ou tornada insensível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: pela
  rationale: Neste contexto, ἐν expressa meio ou instrumentalidade em relação ao que precede. «Pela» é natural em português e preserva esse sentido.
- source_word: ὑποκρίσει
  choice: hipocrisia
  rationale: Tradução direta e corrente de ὑπόκρισις, indicando fingimento ou falsa aparência moral.
- source_word: ψευδολόγων
  choice: de mentirosos
  rationale: O genitivo plural qualifica «hipocrisia». «Mentirosos» traduz de modo conciso pessoas caracterizadas pela falsidade.
- source_word: κεκαυστηριασμένων
  choice: que têm ... cauterizada
  rationale: A oração relativa soa natural em português e conserva tanto a imagem de καυστηριάζω quanto o estado resultante expresso pelo particípio perfeito passivo.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: a própria consciência
  rationale: Mantém o singular distributivo do grego e a ênfase possessiva de ἰδίαν.
theological_decisions:
- issue: Força metafórica de κεκαυστηριασμένων
  choice: «têm a própria consciência cauterizada»
  alternative: «têm a própria consciência marcada a ferro» ou «têm a própria consciência insensível»
  rationale: «Cauterizada» preserva a imagem vívida sem decidir se o foco é uma marca deixada por ferro quente ou a perda de sensibilidade moral, nem afirma uma condição espiritual irreversível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a ligação sintática com o contexto anterior e conserva a ambiguidade da metáfora grega.
