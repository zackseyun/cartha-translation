source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: pt
  text: Que ninguém despreze a sua juventude; pelo contrário, seja exemplo para os que creem, no falar, na conduta, no amor, na fé[a] e na pureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na fidelidade”. A palavra grega pode indicar fé ou fidelidade neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς … καταφρονείτω
  choice: Que ninguém o despreze
  rationale: Reproduz a exortação proibitiva em português natural. “Despreze” comunica tanto menosprezo quanto atitude de superioridade social.
- source_word: σου τῆς νεότητος
  choice: por você ser jovem
  rationale: Expressa idiomaticamente a causa do desprezo. A formulação literal “a sua juventude” seria menos natural neste contexto.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Marca com clareza o forte contraste entre ser desprezado e tornar-se exemplo.
- source_word: τύπος γίνου
  choice: seja exemplo
  rationale: τύπος indica aqui um padrão digno de imitação; o imperativo γίνου é naturalmente expresso por “seja”.
- source_word: τῶν πιστῶν
  choice: para os que creem
  rationale: Identifica os cristãos como o grupo para o qual Timóteo deve servir de exemplo, sem confundir sua designação com a qualidade de fidelidade.
- source_word: ἐν λόγῳ
  choice: no falar
  rationale: Neste catálogo de qualidades, λόγος se refere à maneira de falar. “No falar” é claro e corrente.
- source_word: ἐν ἀναστροφῇ
  choice: na conduta
  rationale: ἀναστροφή designa o comportamento ou modo de viver; “conduta” mantém a concisão da lista.
- source_word: ἐν ἀγάπῃ
  choice: no amor
  rationale: Tradução direta e abrangente de ἀγάπη.
- source_word: ἐν πίστει
  choice: na fé
  rationale: Mantém o sentido usual de πίστις e preserva sua possível referência à confiança ou crença, enquanto a alternativa “fidelidade” é registrada em nota.
- source_word: ἐν ἁγνείᾳ
  choice: na pureza
  rationale: ἁγνεία aponta para pureza moral, possivelmente também sexual, sem que o contexto exija limitar o termo à castidade.
theological_decisions:
- issue: Sentido de πίστις na lista de virtudes
  choice: fé
  alternative: fidelidade
  rationale: O contexto admite tanto a fé quanto a qualidade de ser fiel. O texto principal conserva a tradução ampla e tradicional “fé”, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “por você ser jovem” evita a rigidez de uma tradução literal do genitivo, e a repetição de “no/na” preserva o ritmo da lista grega.
