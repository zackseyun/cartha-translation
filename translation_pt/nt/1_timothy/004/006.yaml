id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: pt
  text: Ao apresentar estas coisas aos irmãos[a], você será um bom servo do Messias Jesus[b], sendo nutrido pelas palavras da fé[c] e do bom ensino que você tem seguido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” pode referir-se aos fiéis em geral, incluindo as mulheres, conforme o contexto.
    reason: cultural_note
  - marker: b
    text: Ou “Cristo Jesus”. O título grego Χριστός é traduzido aqui por “Messias” para preservar seu significado.
    reason: lexical_alternative
  - marker: c
    text: Ou “palavras de fé”. Aqui, “a fé” provavelmente se refere ao conteúdo reconhecido da crença cristã.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: estas coisas
  rationale: Mantém o plural neutro e a referência às instruções e advertências anteriores.
- source_word: ὑποτιθέμενος
  choice: ao apresentar
  rationale: Expressa naturalmente a ideia de colocar algo diante de alguém para sua consideração, sem reduzir o verbo a simplesmente “ensinar”.
- source_word: τοῖς ἀδελφοῖς
  choice: aos irmãos
  rationale: Preserva a forma masculina plural do grego; no uso cristão antigo, o termo pode abranger a comunidade de fiéis em geral.
- source_word: καλὸς
  choice: bom
  rationale: Comunica de modo claro e idiomático a qualidade positiva do serviço prestado.
- source_word: διάκονος
  choice: servo
  rationale: O contexto apresenta uma função de serviço, sem indicar inequivocamente o cargo formal de diácono.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu sentido de “Messias”, e mantém Jesus como nome.
- source_word: ἐντρεφόμενος
  choice: sendo nutrido
  rationale: Conserva a forma participial e o sentido passivo de formação e sustento contínuos.
- source_word: τοῖς λόγοις
  choice: pelas palavras
  rationale: O dativo indica o meio pelo qual ocorre a nutrição; “palavras” preserva a imagem e o valor de λόγοις.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: O artigo e a associação com o ensino favorecem a fé entendida como o conteúdo reconhecido da crença cristã, sem excluir inteiramente a noção mais ampla de fé.
- source_word: τῆς καλῆς διδασκαλίας
  choice: do bom ensino
  rationale: Traduz diretamente o caráter positivo de καλῆς e usa uma expressão atual e acessível para διδασκαλία.
- source_word: ᾗ παρηκολούθηκας
  choice: que você tem seguido
  rationale: O pronome feminino singular retoma mais naturalmente “o bom ensino”; o perfeito indica um acompanhamento iniciado anteriormente e ainda relevante.
theological_decisions:
- issue: Sentido titular de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: “Messias” torna explícito o sentido do título grego, enquanto a forma tradicional “Cristo Jesus” permanece uma tradução possível e é registrada em nota.
- issue: Abrangência de τοῖς ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs; fiéis
  rationale: A tradução principal conserva o gênero gramatical do original, enquanto a nota informa que o uso contextual pode abranger mulheres.
- issue: Sentido de πίστις
  choice: a fé
  alternative: fé
  rationale: Neste contexto, o artigo e o paralelismo com “bom ensino” favorecem a referência ao conteúdo da fé cristã, embora a construção sem essa nuance explícita também seja possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção mantém a metáfora de nutrição, evita tratar διάκονος como cargo e conserva no texto as ambiguidades relevantes por meio de notas.
