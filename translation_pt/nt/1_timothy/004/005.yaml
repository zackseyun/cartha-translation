    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: é santificado
  rationale: O presente passivo indica que o alimento mencionado no contexto é santificado. A formulação preserva de perto a linguagem de santificação e não define além do texto o modo ou o alcance dessa ação.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a razão explicativa da afirmação anterior de maneira concisa e natural em português.
- source_word: διὰ
  choice: pela
  rationale: Com o genitivo, διά expressa meio ou instrumento. A contração 'pela' é idiomática e mantém esse sentido.
- source_word: λόγου θεοῦ
  choice: palavra de Deus
  rationale: Reproduz naturalmente a construção genitiva e preserva a abertura referencial da expressão, sem decidir se se trata de uma declaração específica das Escrituras, da palavra criadora ou da autorização divina em sentido mais amplo.
- source_word: ἐντεύξεως
  choice: oração
  rationale: No contexto de alimento recebido com ações de graças, 'oração' comunica de modo claro o ato religioso sem restringi-lo indevidamente; a possível nuance de súplica ou intercessão é registrada em nota.
theological_decisions:
- issue: Alcance da linguagem de santificação no contexto
  choice: Manter 'é santificado', deixando que o contexto indique que o alimento é separado como aceitável para uso.
  alternative: Explicitar 'é tornado santo' ou 'é consagrado'.
  rationale: O contexto imediato trata de alimentos recebidos com ações de graças. A tradução preserva a linguagem teológica e sua tensão sem introduzir uma afirmação sacramental, moral ou soteriológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Pois' mantém a ligação explicativa com o versículo anterior; a repetição de 'pela' torna explícita e natural a coordenação dos dois meios.
