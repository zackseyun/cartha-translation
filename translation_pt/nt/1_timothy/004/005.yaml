  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: pt
  text: pois é santificado pela palavra de Deus e pela oração.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é tornado santo”.
    reason: lexical_alternative
  - marker: b
