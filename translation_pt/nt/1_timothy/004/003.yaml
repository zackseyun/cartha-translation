source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: pt
  text: proíbem o casamento e exigem abstinência de alimentos que Deus criou para serem recebidos com gratidão pelos que creem e chegaram a conhecer a verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais de perto da forma grega: “proíbem casar-se e [ordenam] abster-se de alimentos”. O verbo “ordenam” torna explícita a exigência implícita na construção.'
    reason: alternativa lexical e esclarecimento da elipse sintática
lexical_decisions:
- source_word: κωλυόντων
  choice: proíbem
  rationale: O particípio presente dá continuidade à descrição iniciada no versículo anterior. “Proíbem” expressa de modo natural e direto a imposição dos falsos mestres.
- source_word: γαμεῖν
  choice: o casamento
  rationale: Embora o infinitivo signifique literalmente “casar-se”, “proíbem o casamento” é idiomático em português e comunica a prática que está sendo vedada.
- source_word: ἀπέχεσθαι
  choice: exigem que as pessoas se abstenham
  rationale: O infinitivo significa “abster-se”. Como a construção grega é elíptica, a tradução explicita a imposição implícita e evita o sentido contrário de “proibir que se abstenham”.
- source_word: βρωμάτων
  choice: de alimentos
  rationale: Preserva o plural e é a forma corrente em português para as categorias de comida em questão.
- source_word: ἃ
  choice: que
  rationale: Pronome relativo que retoma “alimentos” de maneira natural.
- source_word: ἔκτισεν
  choice: criou
  rationale: Preserva a linguagem de criação de κτίζω e sua força teológica.
- source_word: εἰς μετάλημψιν
  choice: para serem recebidos
  rationale: Expressa a finalidade indicada por εἰς e o ato de participar ou tomar dos alimentos em linguagem clara.
- source_word: μετὰ εὐχαριστίας
  choice: com gratidão
  rationale: Comunica o agradecimento dirigido a Deus em português moderno; “ações de graças” seria possível, mas menos fluente nesta construção.
- source_word: τοῖς πιστοῖς
  choice: pelos que creem
  rationale: Neste contexto, πιστοῖς designa naturalmente os crentes; a forma verbal torna esse sentido claro.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: chegaram a conhecer a verdade
  rationale: O particípio perfeito retrata um conhecimento adquirido cujos efeitos permanecem; “chegaram a conhecer” preserva esse aspecto.
theological_decisions:
- issue: Se τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν descreve um só grupo ou dois grupos distintos
  choice: Um só grupo, descrito como “os que creem e chegaram a conhecer a verdade”
  alternative: 'Dois grupos: “os crentes e os que conheceram a verdade”'
  rationale: O artigo compartilhado e a coordenação das duas descrições favorecem a referência às mesmas pessoas sob dois aspectos, sem criar duas classes distintas sem necessidade gramatical.
- issue: Como representar a elipse entre κωλυόντων e ἀπέχεσθαι
  choice: Explicitar que os mestres “exigem” a abstinência
  alternative: Reproduzir formalmente “proíbem casar-se e abster-se de alimentos”
  rationale: Aplicar diretamente “proíbem” aos dois infinitivos produziria em português o sentido de que eles proibiam a abstinência, contrário ao desenvolvimento sintático e contextual. A nota registra a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A opção “com gratidão” evita formulação excessivamente tradicional sem enfraquecer a ideia de agradecer a Deus; “as pessoas” explicita apenas o sujeito genérico do infinitivo, sem restringir o grupo afetado.
