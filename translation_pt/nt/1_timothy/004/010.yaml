source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: pt
  text: 'Pois é para isso que trabalhamos arduamente e somos insultados[a]: porque pusemos a nossa esperança no Deus vivo[b], que é o Salvador de todas as pessoas, especialmente das que creem[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos esforçamos até a exaustão e somos injuriados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “depositamos a nossa esperança no Deus vivo”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “Salvador de todas as pessoas, especialmente das que creem” foi traduzida como está escrita. Há diferentes entendimentos sobre se “Salvador” enfatiza aqui o cuidado preservador de Deus por todos, sua provisão de salvação para todos ou a salvação aplicada especialmente aos que creem.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: é para isso
  rationale: Expressa de modo natural a finalidade indicada pela locução grega e sua ligação com o contexto anterior.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação da afirmação anterior, preservando a relação argumentativa.
- source_word: κοπιῶμεν
  choice: trabalhamos arduamente
  rationale: Comunica o esforço intenso de κοπιάω em português atual e claro.
- source_word: ὀνειδιζόμεθα
  choice: somos insultados
  rationale: Preserva a voz passiva e a ideia de sofrer afronta verbal ou desonra pública.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: temos posto a nossa esperança no
  rationale: O pretérito perfeito composto comunica uma esperança estabelecida no passado e mantida no presente.
- source_word: θεῷ ζῶντι
  choice: Deus vivo
  rationale: Mantém a expressão bíblica consagrada e corresponde diretamente ao grego.
- source_word: σωτὴρ
  choice: Salvador
  rationale: Preserva o peso teológico habitual do termo nas Cartas Pastorais sem restringi-lo antecipadamente a 'preservador'.
- source_word: πάντων ἀνθρώπων
  choice: de todas as pessoas
  rationale: Traduz a referência humana genérica de maneira inclusiva, natural e atual.
- source_word: μάλιστα
  choice: especialmente
  rationale: É o sentido mais direto no contexto e mantém a tensão entre a abrangência de 'todas as pessoas' e a relação particular com os que creem.
- source_word: πιστῶν
  choice: das que creem
  rationale: Identifica claramente pessoas caracterizadas pela fé, evitando a possível ambiguidade de 'fiéis' entre pessoas leais e pessoas crentes.
theological_decisions:
- issue: Sentido de “Salvador de todas as pessoas, especialmente das que creem”
  choice: Manter a afirmação ampla e a qualificação “especialmente” sem explicar uma pela eliminação da outra.
  alternative: Entender “Salvador” como preservador de todos e salvador redentor dos crentes; defender salvação universal; ou restringir “todas as pessoas” a “todos os tipos de pessoas”.
  rationale: O grego afirma tanto a abrangência universal quanto uma relação especial com os que creem. A tradução preserva essa tensão e deixa a interpretação teológica para a nota, sem impor um sistema doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a conexão explicativa; “trabalhamos arduamente” evita linguagem arcaica; “das que creem” é claro e preserva o referente pessoal. Os marcadores aparecem no texto em ordem de ocorrência.
