id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: pt
  text: Mas o Espírito diz expressamente que, em tempos posteriores[a], alguns se afastarão da fé[b], dando atenção a espíritos enganadores[c] e a ensinamentos de demônios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos últimos tempos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “abandonarão a fé”.
    reason: lexical_alternative
  - marker: c
    text: Ou “espíritos que enganam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: o Espírito
  rationale: O artigo e o contexto profético paulino apontam mais naturalmente para o Espírito Santo. A inicial maiúscula identifica o referente em português, embora o grego antigo não faça essa distinção gráfica.
- source_word: δὲ
  choice: Mas
  rationale: A partícula marca uma transição com leve contraste em relação ao contexto anterior. “Mas” preserva essa função sem introduzir uma ideia temporal ausente do texto.
- source_word: ῥητῶς
  choice: expressamente
  rationale: O advérbio indica que algo é declarado de modo explícito e inequívoco; “expressamente” é natural e digno em português.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente grego e apresenta a declaração profética como vigente.
- source_word: ἐν ὑστέροις καιροῖς
  choice: em tempos posteriores
  rationale: Refere-se a períodos subsequentes ao tempo do autor, sem restringir necessariamente a expressão ao fim escatológico.
- source_word: ἀποστήσονταί
  choice: se afastarão
  rationale: O futuro médio de ἀφίσταμαι comunica afastamento ou deserção. A formulação preserva a imagem sem definir além do texto a natureza teológica desse afastamento.
- source_word: τινες
  choice: alguns
  rationale: Equivalente idiomático direto do pronome indefinido plural.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: O artigo e o contexto favorecem a fé cristã entendida como conteúdo da crença, embora a palavra também possa ter outros sentidos em contextos diferentes.
- source_word: προσέχοντες
  choice: dando atenção a
  rationale: 'O particípio descreve a ação associada ao afastamento: prestar atenção, dar ouvidos ou aderir ao que é apresentado.'
- source_word: πνεύμασι πλάνοις
  choice: espíritos enganadores
  rationale: πλάνος descreve aquilo que engana ou desvia. “Enganadores” comunica claramente a ação desses espíritos.
- source_word: διδασκαλίαις δαιμονίων
  choice: ensinamentos de demônios
  rationale: A expressão pode indicar ensinamentos originados em demônios ou associados a eles. A tradução mantém a relação genitiva sem transformá-la numa formulação técnica.
theological_decisions:
- issue: Referente de “o Espírito”
  choice: o Espírito Santo
  alternative: um espírito profético ou o espírito humano
  rationale: Neste contexto epistolar e profético, a referência mais natural é ao Espírito Santo. A tradução não especifica o modo pelo qual ele falou.
- issue: Sentido de “a fé”
  choice: a fé cristã como conteúdo ou corpo de crença
  alternative: fé pessoal, confiança ou fidelidade
  rationale: O artigo definido e o contexto de abandono ligado a falsos ensinamentos favorecem o sentido objetivo, sem impor uma doutrina denominacional sobre apostasia.
- issue: Relação em “ensinamentos de demônios”
  choice: ensinamentos provenientes de demônios ou associados a eles
  alternative: ensinamentos a respeito de demônios
  rationale: O contexto favorece um genitivo de origem ou associação; a redação preserva alguma amplitude sem sugerir que o assunto ensinado sejam os próprios demônios.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mas” conserva a transição contrastiva de δέ; “tempos posteriores” evita impor uma leitura exclusivamente escatológica; “ensinamentos” é mais corrente que “doutrinas”. Todos os marcadores de nota aparecem junto às expressões correspondentes.
