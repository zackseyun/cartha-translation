  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: pt
  text: Ordene estas coisas e ensine-as.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Instrua sobre estas coisas e ensine-as.”'
    reason: Alternativa lexical que preserva um sentido possível de παραγγέλλω, embora expresse sua força diretiva de modo menos intenso.
lexical_decisions:
- source_word: Παράγγελλε
  choice: Ordene
  rationale: O imperativo presente ativo, na segunda pessoa do singular, transmite uma orientação contínua e dotada de autoridade. “Ordene” preserva essa força melhor que uma formulação meramente aconselhadora.
- source_word: ταῦτα
  choice: estas coisas
  rationale: O demonstrativo neutro plural retoma naturalmente os ensinos ou as instruções anteriores, preservando sua força plural.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois imperativos.
- source_word: δίδασκε
  choice: ensine-as
  rationale: O imperativo presente sugere ação continuada. O pronome retoma “estas coisas” e torna explícito em português o objeto compreendido no grego.
theological_decisions:
- issue: Autoridade pastoral implícita no imperativo παραγγέλλω
  choice: 'Traduzir com força de autoridade: “Ordene”'
  alternative: “Instrua”
  rationale: O verbo tem força diretiva, e essa tradução evita reduzi-lo a mero conselho sem acrescentar ao texto alegações eclesiológicas específicas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A colocação enclítica em “ensine-as” mantém o registro formal sem soar arcaica.
