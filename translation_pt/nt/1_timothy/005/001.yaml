  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: pt
  text: Não repreenda um homem mais velho[a]; pelo contrário, exorte-o como a um pai, e aos mais jovens, como a irmãos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não repreenda duramente um presbítero”. O termo grego pode significar tanto “homem mais velho” como “presbítero”, mas o contraste de idades neste contexto favorece “homem mais velho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: um homem mais velho
  rationale: O adjetivo substantivado masculino singular contrasta com νεωτέρους (“mais jovens”) e, à luz da sequência de grupos por idade e sexo em 5.1–2, indica naturalmente um homem de mais idade, não necessariamente um presbítero.
- source_word: μὴ ἐπιπλήξῃς
  choice: Não repreenda
  rationale: O verbo denota censurar ou repreender verbalmente. “Repreender” preserva o sentido sem acrescentar explicitamente uma intensidade que o contexto já pode sugerir.
- source_word: ἀλλὰ παρακάλει
  choice: pelo contrário, aconselhe-o
  rationale: παρακαλέω pode significar exortar, encorajar, instar ou apelar. Aqui, em oposição à repreensão e no contexto de relações familiares, “aconselhe-o” comunica uma abordagem respeitosa e pessoal.
- source_word: ὡς πατέρα
  choice: como a um pai
  rationale: Mantém diretamente a comparação introduzida por ὡς e expressa com naturalidade o tratamento respeitoso requerido.
- source_word: νεωτέρους
  choice: aos mais jovens
  rationale: O masculino plural substantivado refere-se aos homens mais jovens, como confirma ἀδελφούς e a distinção posterior entre mulheres idosas e jovens. Em português, o artigo e o adjetivo no masculino preservam essa referência sem tornar a frase pesada.
- source_word: ὡς ἀδελφούς
  choice: como a irmãos
  rationale: Preserva o masculino específico da passagem, que organiza as exortações segundo idade e sexo, sem acrescentar “na fé”, expressão ausente do grego.
theological_decisions:
- issue: Se Πρεσβυτέρῳ designa um homem mais velho ou o ofício eclesiástico de presbítero
  choice: homem mais velho
  alternative: presbítero
  rationale: A estrutura contextual — homem mais velho/pai, homens mais jovens/irmãos, depois mulheres mais velhas/mães e mais jovens/irmãs — favorece fortemente o sentido etário. A alternativa legítima é preservada em nota.
- issue: Se ἀδελφούς deve ser vertido de modo inclusivo
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Neste contexto, o masculino faz parte de uma sequência que distingue homens e mulheres; portanto, “irmãos” preserva a referência específica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pelo contrário” torna clara a oposição; “aconselhe-o” expressa o tom respeitoso de παρακαλέω. A pontuação final com vírgula acompanha a continuação sintática no versículo seguinte.
