id: 1TI.5.5
reference: 1 Timothy 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: pt
  text: Mas a mulher que é verdadeiramente viúva e ficou completamente sozinha[a] depositou a sua esperança em Deus[b] e persevera em súplicas e orações[c], noite e dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi deixada sozinha”. O grego destaca o estado contínuo de quem ficou sem companhia ou apoio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tem esperado em Deus”. O perfeito grego pode destacar uma esperança estabelecida que continua no presente.'
    reason: lexical_alternative
  - marker: c
    text: 'Os dois termos foram mantidos: “súplicas” destaca pedidos específicos ou insistentes, enquanto “orações” é mais geral.'
    reason: lexical_distinction
lexical_decisions:
- source_word: ὄντως χήρα
  choice: verdadeiramente viúva
  rationale: Preserva a ideia de uma viúva que de fato corresponde à categoria definida pelo contexto, e não apenas a designação social.
- source_word: μεμονωμένη
  choice: ficou completamente sozinha
  rationale: O particípio perfeito indica um estado resultante de solidão, no contexto provavelmente sem apoio familiar; a formulação é natural e não especifica além do texto como isso ocorreu.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: depositou a sua esperança em Deus
  rationale: Expressa uma decisão estabelecida cujo efeito continua, refletindo o perfeito grego sem tornar a frase artificial em português.
- source_word: προσμένει
  choice: persevera
  rationale: Comunica continuidade e constância na prática, de acordo com o presente grego e a construção com as formas de oração.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: em súplicas e orações
  rationale: 'Mantém os dois termos gregos: o primeiro destaca pedidos insistentes ou específicos, e o segundo designa a oração de modo mais geral.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: noite e dia
  rationale: Conserva a ordem grega e traduz naturalmente a expressão idiomática de prática contínua.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição contrastiva em relação à situação descrita no versículo anterior; em português, o contraste é natural e contextualmente pertinente.
theological_decisions:
- issue: Caracterização da viúva que é verdadeiramente viúva
  choice: O versículo descreve uma viúva genuinamente desamparada, cuja vida se caracteriza pela esperança em Deus e pela oração perseverante.
  alternative: Entender a expressão apenas como referência geral a qualquer mulher cujo marido morreu, sem função qualificadora no contexto.
  rationale: O advérbio ὄντως e o contexto imediato distinguem uma categoria específica, mas a tradução evita acrescentar critérios eclesiásticos ou confessionais não expressos neste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o contraste de δέ, o estado resultante indicado por μεμονωμένη, o valor continuativo do perfeito em ἤλπικεν e a distinção entre súplicas e orações.
