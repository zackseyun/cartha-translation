id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: pt
  text: Mas, se alguém não cuida dos seus[a], especialmente dos membros de sua casa, negou[b] a fé e é pior do que um descrente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus familiares”. A expressão é mais ampla do que apenas as pessoas que vivem sob o mesmo teto; “os membros de sua casa” identifica o grupo para com o qual a obrigação é especialmente direta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “renunciou à fé” ou “renegou a fé”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: alguém
  rationale: Expressa naturalmente o singular indefinido e genérico, sem limitar a declaração aos homens.
- source_word: τῶν ἰδίων
  choice: dos seus
  rationale: Preserva a abrangência da expressão, que inclui as pessoas ligadas ao indivíduo e sob sua responsabilidade, sem restringi-la apenas aos que moram com ele.
- source_word: μάλιστα
  choice: especialmente
  rationale: Destaca, dentro do grupo mais amplo, aqueles para com quem existe obrigação particular.
- source_word: οἰκείων
  choice: dos de sua própria casa
  rationale: Refere-se especificamente às pessoas pertencentes à casa ou unidade doméstica; a formulação distingue esse grupo do sentido mais amplo de “os seus”.
- source_word: προνοεῖ
  choice: cuida
  rationale: No contexto, indica atenção prática e previdente, incluindo sustento e assistência. “Cuida” é natural em português e não reduz a obrigação somente ao aspecto financeiro.
- source_word: τὴν πίστιν
  choice: a fé
  rationale: O artigo e o contexto apontam para a fé cristã professada, repudiada na prática pela negligência.
- source_word: ἤρνηται
  choice: negou
  rationale: Mantém a força de repúdio do verbo e comunica de modo direto o resultado presente de uma conduta que contradiz a profissão de fé.
- source_word: ἀπίστου
  choice: um descrente
  rationale: No contraste, designa alguém que não professa a fé, e não apenas uma pessoa pouco confiável.
- source_word: χείρων
  choice: pior
  rationale: Reproduz de maneira simples e forte a comparação moral do texto.
theological_decisions:
- issue: Referência genérica no singular
  choice: “alguém” com as formas não marcadas “dos seus” e “sua”
  alternative: Empregar uma formulação explicitamente masculina, como “se algum homem não cuida dos seus”
  rationale: Embora a construção grega esteja no singular gramatical, seu alcance é genérico. O português permite conservar esse alcance sem introduzir restrição ao sexo masculino.
- issue: Sentido de πίστις em τὴν πίστιν ἤρνηται
  choice: “a fé”, entendida como a fé cristã professada
  alternative: “fidelidade” ou a confiança subjetiva do indivíduo
  rationale: No contexto das Cartas Pastorais, a expressão frequentemente indica a fé confessada. A negligência prática é apresentada como negação dessa profissão, sem exigir que πίστις seja redefinida como mera fidelidade humana.
- issue: Força de ἤρνηται
  choice: “negou”
  alternative: “renunciou à” ou “renegou”
  rationale: “Negou” preserva a linguagem direta do original e a tensão entre confissão e conduta, sem acrescentar a ideia de uma renúncia formal ou verbal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Cuida” abrange assistência prática e sustento sem tornar o enunciado exclusivamente financeiro; “os de sua própria casa” mantém a progressão do grupo amplo para o subconjunto doméstico.
