  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: pt
  text: Repreenda os que estão pecando[b][a] diante de todos, para que os demais também tenham temor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que persistem no pecado”; o particípio presente pode sugerir conduta pecaminosa contínua.'
    reason: lexical_alternative
  - marker: b
    text: O contexto imediato pode indicar especificamente presbíteros que pecam, embora o versículo diga apenas “os que estão pecando”.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: os que estão pecando
  rationale: O particípio presente substantivado é expresso de modo natural e próximo ao grego. O aspecto presente pode sugerir conduta contínua, mas traduzir por “persistem no pecado” acrescentaria uma explicitação interpretativa; essa possibilidade fica em nota.
- source_word: ἐνώπιον πάντων
  choice: diante de todos
  rationale: Preserva diretamente a expressão grega e comunica com clareza que a repreensão ocorre na presença de todos, sem condensá-la no advérbio mais interpretativo “publicamente”.
- source_word: ἔλεγχε
  choice: Repreenda
  rationale: Neste contexto disciplinar, “repreender” transmite a ideia de confrontar e corrigir. Evita tanto o tom arcaico de “reprovar” em certos usos quanto a ênfase excessiva em revelação pública que “expor” poderia sugerir.
- source_word: οἱ λοιποὶ
  choice: os demais
  rationale: Expressão portuguesa natural que designa os outros membros do grupo, além dos transgressores.
- source_word: φόβον ἔχωσιν
  choice: tenham temor
  rationale: Mantém a construção e a amplitude semântica do grego, que pode indicar medo ou apreensão salutar, sem decidir entre mero pavor e temor reverente.
theological_decisions:
- issue: Alcance dos transgressores no contexto
  choice: O texto principal diz apenas “os que estão pecando”, sem acrescentar “presbíteros”.
  alternative: O contexto imediato, especialmente os versículos 19–20, pode indicar que se trata especificamente de presbíteros que pecam; o princípio também pode ser entendido de modo mais amplo como disciplina comunitária.
  rationale: Embora o referente contextual possa ser os presbíteros, o versículo grego não repete o substantivo. A tradução preserva essa tensão e registra a possibilidade contextual em nota, sem restringir o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Repreenda”, “diante de todos” e “tenham temor” conservam a força disciplinar e a relativa formalidade do enunciado sem recorrer a linguagem arcaica. Os marcadores aparecem no texto junto ao referente, na ordem [b][a], acompanhando respectivamente a nota contextual e a alternativa lexical.
