base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: pt
  text: Eu lhe ordeno solenemente, diante de Deus, do Messias Jesus e dos anjos escolhidos[a], que guarde estas coisas sem julgamento prévio[b], sem fazer nada por favoritismo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos anjos eleitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem prejulgamento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sem agir com parcialidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Eu o encarrego solenemente
  rationale: No contexto de exortação, o verbo expressa uma incumbência formal e solene, não mero testemunho.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa a presença de testemunhas solenes de modo natural e digno em português.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Mantém o conteúdo titular de Χριστός nesta invocação solene, em conformidade com o sentido lexical.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: dos anjos escolhidos
  rationale: Traduz diretamente a ideia de seleção, com linguagem corrente; “anjos eleitos” permanece como alternativa em nota.
- source_word: ταῦτα φυλάξῃς
  choice: observar estas coisas
  rationale: Aqui φυλάσσω significa cumprir ou observar fielmente as instruções anteriores; a formulação evita especificar além do demonstrativo grego.
- source_word: χωρὶς προκρίματος
  choice: sem julgamento prévio
  rationale: πρόκριμα indica julgamento antecipado ou prejulgamento; a escolha evita a possível ambiguidade jurídica moderna de “sem preconceito”.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: sem fazer nada por favoritismo
  rationale: A expressão indica agir por inclinação parcial em favor de alguém; a construção portuguesa preserva a ligação participial e comunica o sentido claramente.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Nesta fórmula solene, Χριστός ainda pode ser entendido como título; “Messias” explicita seu conteúdo sem negar que “Cristo Jesus” seja a forma tradicional e possível.
- issue: Identidade dos ἐκλεκτῶν ἀγγέλων
  choice: anjos escolhidos
  alternative: anjos eleitos
  rationale: O texto não explica em que sentido os anjos são escolhidos; a tradução conserva essa tensão sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da invocação e a força formal da exortação foram preservadas; a segunda parte foi formulada de modo idiomático sem eliminar a distinção entre julgamento antecipado e favoritismo.
