id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: pt
  text: Não continue bebendo somente água, mas use um pouco de vinho, por causa do seu estômago e das suas frequentes enfermidades.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηκέτι
  choice: Não continue
  rationale: Expressa a cessação de uma prática anterior e, unido ao imperativo seguinte, soa natural em português atual.
- source_word: ὑδροπότει
  choice: bebendo somente água
  rationale: O verbo significa beber água; o contraste com o uso de vinho indica que a prática em questão era beber água exclusivamente, não abandonar toda ingestão de água.
- source_word: ἀλλὰ
  choice: use também
  rationale: Introduz a orientação contrastante. “Também” deixa claro que o vinho deve ser acrescentado à água, sem sugerir que ela seja completamente substituída.
- source_word: οἴνῳ ὀλίγῳ
  choice: um pouco de vinho
  rationale: Preserva de modo direto tanto οἶνος, “vinho”, quanto a limitação quantitativa indicada por ὀλίγῳ.
- source_word: χρῶ
  choice: use
  rationale: Correspondência natural para χράομαι com dativo, mantendo a formulação ampla do grego sem acrescentar uma finalidade medicinal explícita.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, indica a razão da recomendação.
- source_word: στόμαχον
  choice: estômago
  rationale: Tradução anatômica direta e corrente.
- source_word: πυκνάς
  choice: frequentes
  rationale: Comunica a recorrência indicada pelo adjetivo.
- source_word: ἀσθενείας
  choice: enfermidades
  rationale: No contexto corporal, refere-se naturalmente a males ou doenças recorrentes; “enfermidades” conserva alguma amplitude sem reduzir o termo a mera fraqueza.
theological_decisions:
- issue: Se a prática anterior de Timóteo deve ser explicitada como consumo exclusivo de água
  choice: Não continue bebendo somente água
  alternative: Não beba mais água
  rationale: O contraste com “use também um pouco de vinho” aponta para deixar de beber apenas água, e não para uma proibição absoluta da água. A tradução explicita essa implicação contextual para evitar uma leitura enganosa.
- issue: Se οἶνος deve ser traduzido literalmente ou generalizado como bebida medicinal
  choice: vinho
  alternative: vinho medicinal
  rationale: O grego nomeia vinho sem qualificá-lo como medicinal. O contexto sugere finalidade ligada à saúde, mas a tradução não deve inserir essa especificação no substantivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita a interpretação de que Timóteo deveria parar totalmente de beber água e preserva a moderação expressa por “um pouco”.
