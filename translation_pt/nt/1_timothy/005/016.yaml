  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: pt
  text: Se alguma mulher crente tem viúvas[a], que lhes dê apoio, e que a igreja não seja sobrecarregada, para que possa dar apoio às que são verdadeiramente viúvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “se algum homem crente ou alguma mulher crente tem viúvas” ou “se algum crente tem viúvas”, ampliando a instrução para além de um sujeito especificamente feminino.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: alguma mulher crente
  rationale: O adjetivo πιστή está no feminino singular e, nesta forma do texto, indica especificamente uma mulher. “Crente” expressa de modo natural sua identidade cristã.
- source_word: ἔχει χήρας
  choice: tem viúvas sob seus cuidados
  rationale: O grego diz literalmente “tem viúvas”. A explicitação “sob seus cuidados” comunica em português a relação de responsabilidade familiar pressuposta pelo contexto, sem definir um parentesco que o texto não especifica.
- source_word: ἐπαρκείτω αὐταῖς
  choice: que ela lhes dê o sustento necessário
  rationale: ἐπαρκέω denota prestar auxílio suficiente; no contexto, trata-se de assistência material. A formulação torna clara a suficiência do apoio e mantém a referência pronominal às viúvas.
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: que a igreja não seja sobrecarregada
  rationale: Preserva o imperativo passivo e a ideia de não impor à comunidade o peso dessa obrigação de sustento.
- source_word: ταῖς ὄντως χήραις
  choice: as que são verdadeiramente viúvas
  rationale: ὄντως destaca as viúvas que se enquadram plenamente na categoria descrita no contexto, especialmente as que ficaram sem amparo. A tradução preserva a expressão enfática sem inserir toda essa explicação no texto.
- source_word: ἐπαρκέσῃ
  choice: possa amparar
  rationale: O subjuntivo após ἵνα expressa finalidade. “Amparar” comunica auxílio efetivo e evita a repetição pesada de “dar o sustento necessário”, embora traduza o mesmo verbo grego.
theological_decisions:
- issue: Gênero do sujeito na oração inicial
  choice: uma mulher crente
  alternative: qualquer crente; algum crente ou alguma crente
  rationale: O texto principal do SBLGNT fornecido lê τις πιστή, com adjetivo feminino singular. A tradução mantém esse gênero, enquanto as leituras variantes mais abrangentes são registradas em nota.
- issue: Sentido de “verdadeiramente viúvas”
  choice: manter a categoria expressa sem explicá-la dentro do versículo
  alternative: traduzir interpretativamente como “viúvas realmente necessitadas” ou “viúvas sem amparo”
  rationale: O contexto aponta para viúvas efetivamente desamparadas e aptas a receber assistência da igreja, mas a formulação grega retém uma tensão entre estado civil e condição social. A tradução não reduz a expressão apenas à necessidade econômica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mulher crente” é mais natural que “crente” isolado para tornar inequívoco o feminino do grego. A nota textual preserva as leituras variantes sem incorporá-las ao texto principal.
