source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: pt
  text: Não imponha precipitadamente as mãos sobre ninguém[a], nem participe dos pecados alheios; mantenha-se puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais especificamente neste contexto: «Não nomeie nem ordene ninguém depressa demais». O grego diz literalmente «imponha as mãos», expressão frequentemente associada ao comissionamento ou ao reconhecimento para o ministério.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: imponha as mãos sobre
  rationale: Preserva a expressão grega e seu uso eclesial sem restringi-la explicitamente a nomeação ou ordenação.
- source_word: ταχέως
  choice: precipitadamente
  rationale: Expressa rapidez indevida e ação sem a devida cautela, não apenas velocidade.
- source_word: μηδενὶ
  choice: sobre ninguém
  rationale: Mantém o alcance universal da proibição em português natural.
- source_word: μηδὲ κοινώνει
  choice: nem participe
  rationale: Comunica participação ou cumplicidade, sem sugerir apenas convivência ou comunhão social.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: dos pecados alheios
  rationale: Traduz de modo conciso a ideia de pecados pertencentes a outras pessoas.
- source_word: σεαυτὸν ἁγνὸν τήρει
  choice: conserve-se puro
  rationale: Reflete a ordem de manter continuamente a própria pureza moral, sem limitar o sentido à castidade sexual.
theological_decisions:
- issue: Sentido de “impor as mãos” no contexto
  choice: Manter a expressão “impor as mãos”, sem especificar ordenação.
  alternative: “Não nomeie ninguém precipitadamente” ou “Não ordene ninguém depressa demais”.
  rationale: O contexto de presbíteros e responsabilidade torna provável a referência ao reconhecimento ou comissionamento ministerial, mas o grego conserva a expressão mais ampla. A tradução evita impor um procedimento eclesiástico denominacional específico.
- issue: Relação entre as duas proibições
  choice: Manter a segunda oração como advertência ampla contra participar dos pecados alheios.
  alternative: Explicitar que a imposição precipitada de mãos torna Timóteo culpado pelos pecados da pessoa reconhecida.
  rationale: A justaposição sugere uma ligação entre endosso prematuro e cumplicidade, mas o texto não declara precisamente essa relação; por isso, a ambiguidade é preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Precipitadamente” evita a ambiguidade de mera rapidez; “pecados alheios” é corrente e conciso; “conserve-se puro” preserva o aspecto contínuo da exortação.
