id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: pt
  text: Mas não inclua as viúvas mais jovens[a], pois, quando se tornam sensuais em oposição ao Messias[b], querem se casar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não as inclua na lista mencionada no versículo 9; não significa rejeitá-las como pessoas.
    reason: contextual_clarification
  - marker: b
    text: O grego pode ser traduzido mais literalmente por “quando se tornam sensuais contra o Messias”. A relação de “contra” com o Messias é difícil; pode indicar que seus desejos entram em conflito com uma dedicação ou compromisso anterior com ele. Tradicionalmente, “Cristo”.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Mas não inclua as viúvas mais jovens
  rationale: O adjetivo comparativo modifica diretamente “viúvas” e contrasta com as viúvas mais velhas do contexto. O imperativo παραιτοῦ, à luz da lista mencionada no versículo 9, indica não as aceitar para essa inscrição, não rejeitá-las pessoalmente.
- source_word: ὅταν γὰρ
  choice: pois, quando
  rationale: Preserva tanto a função explicativa de γάρ quanto a circunstância temporal e geral introduzida por ὅταν.
- source_word: καταστρηνιάσωσιν
  choice: seus desejos sensuais as afastam
  rationale: O verbo raro sugere impulsos sensuais ou fortes desejos que entram em conflito com um compromisso anterior. A formulação comunica isso em português atual sem sugerir que o simples desejo de casar seja, por si só, sensualidade condenável.
- source_word: τοῦ Χριστοῦ
  choice: do Messias
  rationale: Χριστός funciona como título. A relação genitiva com o verbo é difícil; “as afastam do Messias” expressa naturalmente a ideia de desejos contrários à dedicação a ele, sem eliminar a ambiguidade, que é assinalada em nota.
- source_word: γαμεῖν θέλουσιν
  choice: elas querem se casar
  rationale: A construção infinitiva com θέλω expressa desejo ou intenção; “querem se casar” é natural, clara e digna em português contemporâneo.
theological_decisions:
- issue: Sentido de καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: seus desejos sensuais as afastam do Messias
  alternative: tornam-se sensuais contra o Messias
  rationale: A construção grega pode indicar impulsos em oposição ao Messias ou afastamento da dedicação a ele. A tradução não apresenta o novo casamento em si como pecado nem especifica além do texto a natureza exata do compromisso anterior.
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: Aqui Χριστός mantém seu valor titular; “Messias” torna esse valor explícito, enquanto a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não inclua” explicita o sentido administrativo contextual de παραιτοῦ; a nota evita que isso seja entendido como exclusão pessoal. A vírgula final é preservada porque o versículo continua sintaticamente no versículo seguinte.
