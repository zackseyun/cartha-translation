  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: pt
  text: 'Pois a Escritura diz: “Não amordace o boi enquanto ele debulha”[a], e: “O trabalhador é digno do seu salário”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto pisa o cereal para separar o grão”. O particípio grego se refere a um boi ocupado na debulha.
    reason: lexical_alternative
  - marker: b
    text: Ou “é digno da sua remuneração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Pois a Escritura diz
  rationale: “Pois” expressa a ligação explicativa de γάρ com o versículo anterior. “A Escritura” é a forma idiomática para ἡ γραφή como escrito sagrado autorizado, e “diz” preserva o presente de testemunho permanente.
- source_word: Βοῦν
  choice: o boi
  rationale: βοῦς designa aqui o bovino empregado no trabalho agrícola; “boi” é a expressão portuguesa natural nesse contexto.
- source_word: ἀλοῶντα
  choice: enquanto ele debulha
  rationale: O particípio indica a ação simultânea do boi ao separar o grão. “Enquanto ele debulha” comunica isso claramente; a nota registra a descrição mais concreta da prática antiga.
- source_word: οὐ φιμώσεις
  choice: Não amordace
  rationale: O futuro indicativo tem força proibitiva. O imperativo negativo é natural em português atual, e “amordaçar” mantém a imagem de impedir a boca do animal de comer.
- source_word: καί
  choice: e
  rationale: A conjunção coordena as duas citações sem definir além do grego a relação canônica entre elas.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: O trabalhador é digno
  rationale: ἐργάτης é alguém que trabalha. “Trabalhador” é corrente, abrangente e conserva o caráter proverbial da declaração.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: do seu salário
  rationale: μισθός designa a remuneração devida pelo trabalho, não uma recompensa abstrata. “Seu salário” preserva o singular de αὐτοῦ de modo idiomático em português.
theological_decisions:
- issue: Alcance de γραφή sobre as duas citações
  choice: Apresentar as duas declarações, coordenadas por “e”, sob a fórmula “a Escritura diz”
  alternative: Tratar somente a primeira como Escritura e a segunda explicitamente como provérbio ou palavra do Senhor
  rationale: A sintaxe introduz as duas citações sob uma única fórmula. A tradução mantém essa apresentação sem impor uma teoria específica sobre suas implicações canônicas.
- issue: Gênero e número de αὐτοῦ
  choice: seu salário
  alternative: a remuneração deles
  rationale: O grego é masculino singular, e a construção portuguesa “seu salário” mantém o singular sem acrescentar gênero inexistente na forma possessiva portuguesa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “Não amordace” evita o arcaísmo de uma formulação jurídica rígida; “debulha” conserva o cenário agrícola. Os marcadores vêm imediatamente após as expressões a que suas notas se referem.
