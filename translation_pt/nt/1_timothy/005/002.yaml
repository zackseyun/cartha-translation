  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: pt
  text: as mulheres mais velhas, como mães; as mais jovens, como irmãs, com toda a pureza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em toda a pureza». Neste contexto, «pureza» inclui um forte sentido de castidade e correção sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: as mulheres mais velhas
  rationale: O adjetivo feminino plural é usado como substantivo e, em contraste com νεωτέρας, indica idade, não o ofício de presbítero.
- source_word: ὡς μητέρας
  choice: como mães
  rationale: ὡς introduz uma comparação, e μητέρας mantém a imagem familiar sem acrescentar o possessivo «suas», ausente do grego.
- source_word: νεωτέρας
  choice: as mais jovens
  rationale: O adjetivo feminino plural substantivado designa as mulheres mais jovens; o substantivo fica naturalmente subentendido em português após «as mulheres mais velhas».
- source_word: ὡς ἀδελφὰς
  choice: como irmãs
  rationale: Preserva de modo claro e conciso a continuação da imagem familiar, sem acrescentar um possessivo não expresso.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: com toda a pureza
  rationale: Expressa a maneira de tratar as mulheres mais jovens. «Pureza» conserva a amplitude de ἁγνεία, incluindo sua forte dimensão de castidade e correção sexual neste contexto, sem restringi-la exclusivamente a isso.
theological_decisions:
- issue: Alcance de ἁγνεία na orientação sobre as mulheres mais jovens
  choice: com toda a pureza
  alternative: com absoluta castidade
  rationale: ἁγνεία pode indicar pureza moral em sentido amplo e, neste contexto relacional, inclui fortemente castidade e correção sexual. A formulação escolhida preserva essa amplitude e evita tornar explícita uma restrição que o grego não impõe.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo familiar do grego foi mantido; o ponto e vírgula torna nítido o contraste entre as duas faixas etárias.
