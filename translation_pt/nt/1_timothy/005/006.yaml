  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: pt
  text: Mas a que vive entregue aos prazeres está morta, mesmo enquanto vive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “leva uma vida de autossatisfação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: vive entregue aos prazeres
  rationale: O particípio presente descreve um modo de vida contínuo marcado pela busca de prazer e pela autocomplacência. A expressão é natural em português e evita sugerir que o texto condena qualquer prazer.
- source_word: ζῶσα
  choice: mesmo enquanto vive
  rationale: A formulação expressa o valor concessivo-temporal do particípio e torna claro o paradoxo com o estado de morte indicado pelo verbo seguinte.
- source_word: τέθνηκεν
  choice: está morta
  rationale: O perfeito grego destaca o estado presente resultante; “está morta” reproduz esse sentido melhor do que “morreu” neste contexto metafórico.
- source_word: ἡ ... σπαταλῶσα
  choice: a que vive entregue aos prazeres
  rationale: O artigo feminino com o particípio tem função substantiva. “A que” mantém o gênero e a referência contextual à mulher, sem acrescentar uma identificação ausente nesta frase.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção estabelece contraste com a viúva descrita no versículo anterior.
theological_decisions:
- issue: Natureza da condição de estar “morta”
  choice: Manter a metáfora de que ela “está morta” enquanto fisicamente vive
  alternative: Explicitar “está espiritualmente morta” ou “está moralmente morta”
  rationale: O contraste intencional aponta para uma morte não física, provavelmente espiritual ou moral, mas o texto não a define tecnicamente. A tradução preserva a tensão sem impor uma interpretação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Entregue aos prazeres” comunica um estilo de vida autocomplacente sem soar arcaico; a repetição “morta... vive” preserva o paradoxo enfático do grego.
