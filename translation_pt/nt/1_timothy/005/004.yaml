  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: pt
  text: Mas, se uma viúva tem filhos ou netos[a], que estes aprendam primeiro a demonstrar piedade para com a própria família[b] e a retribuir a seus ascendentes[c], pois isso é aceitável diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos ou descendentes”. O termo grego traduzido por “netos” pode ter sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “a praticar a piedade para com a própria família”. O grego apresenta o cuidado familiar como expressão de piedade.
    reason: lexical_alternative
  - marker: c
    text: Ou “a seus pais e avós” ou “a seus antepassados”. O grego significa literalmente “a seus ascendentes” e pode referir-se de modo mais amplo às gerações anteriores da família.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: viúva
  rationale: É o sentido comum do termo e corresponde ao assunto de todo o parágrafo.
- source_word: τέκνα ἢ ἔκγονα
  choice: filhos ou netos
  rationale: τέκνα designa filhos, enquanto ἔκγονα pode abranger descendentes, mas neste contexto de responsabilidade familiar imediata é expresso naturalmente por “netos”.
- source_word: μανθανέτωσαν
  choice: que estes aprendam
  rationale: Preserva a força do imperativo presente na terceira pessoa do plural; “estes” esclarece que o sujeito são os filhos ou netos da viúva.
- source_word: πρῶτον
  choice: primeiro
  rationale: Mantém a prioridade atribuída ao dever para com a própria família.
- source_word: τὸν ἴδιον οἶκον
  choice: para com a própria família
  rationale: οἶκος se refere aqui à família ou unidade doméstica, não apenas ao edifício.
- source_word: εὐσεβεῖν
  choice: demonstrar devoção
  rationale: Conserva a dimensão religiosa de piedade e, ao mesmo tempo, permite entendê-la como conduta concreta no âmbito familiar.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: retribuir
  rationale: Expressa de modo conciso e natural a ideia de dar algo em retorno pelo cuidado recebido.
- source_word: τοῖς προγόνοις
  choice: a seus pais e avós
  rationale: No contexto, o termo amplo para gerações anteriores aponta concretamente para os ascendentes aos quais filhos e netos devem retribuir; a nota preserva a amplitude lexical.
- source_word: ἀπόδεκτον
  choice: aceitável
  rationale: É uma correspondência próxima ao sentido de algo favoravelmente recebido ou aprovado.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Traduz naturalmente a expressão referente à presença e avaliação de Deus.
theological_decisions:
- issue: Referente do imperativo plural μανθανέτωσαν
  choice: A ordem é dirigida aos filhos ou netos da viúva.
  alternative: A ordem seria dirigida às viúvas, com mudança de número ou sujeito implícito.
  rationale: O referente plural mais próximo e natural é τέκνα ἢ ἔκγονα. A inserção de “estes” torna essa relação clara sem alterar o conteúdo.
- issue: Sentido de εὐσεβεῖν no cuidado familiar
  choice: O cumprimento da responsabilidade familiar é apresentado como manifestação de devoção religiosa.
  alternative: O verbo indicaria apenas o cumprimento de uma obrigação familiar, sem ênfase religiosa.
  rationale: εὐσεβεῖν possui dimensão explícita de devoção ou piedade, e a afirmação de que essa conduta é aceitável diante de Deus confirma essa dimensão.
- issue: Identidade dos πρόγονοι
  choice: No contexto imediato, são os pais e avós vivos que anteriormente cuidaram dos filhos ou netos.
  alternative: O termo pode designar de maneira mais ampla os ascendentes ou antepassados.
  rationale: A retribuição pressupõe beneficiários presentes e se encaixa na obrigação de sustentar a viúva; contudo, a nota registra que o termo grego é lexicalmente mais amplo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Demonstrar devoção para com” preserva a linguagem religiosa sem soar excessivamente técnica; “pais e avós” evita que “antepassados” sugira apenas pessoas falecidas, enquanto a nota mantém a amplitude do grego.
