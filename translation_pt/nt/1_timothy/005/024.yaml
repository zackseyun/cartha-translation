source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: pt
  text: Os pecados de algumas pessoas são evidentes[a] e vão adiante delas para o julgamento[b]; os de outras, porém, vêm depois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «são manifestos».'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «julgamento» pode referir-se à avaliação feita no presente, embora a expressão também possa ter o sentido mais amplo de juízo divino.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Os pecados de algumas pessoas
  rationale: Reproduz naturalmente a relação genitiva e entende ἄνθρωπος em seu sentido humano geral, sem restringir desnecessariamente o referente a homens.
- source_word: πρόδηλοί
  choice: evidentes
  rationale: Termo corrente e digno que comunica que os pecados já estão claramente à vista.
- source_word: προάγουσαι
  choice: vão adiante delas
  rationale: Mantém a imagem personificada dos pecados que precedem as pessoas; «delas» explicita em português o referente implícito.
- source_word: εἰς κρίσιν
  choice: para o julgamento
  rationale: Preserva o movimento indicado por εἰς e deixa κρίσις suficientemente amplo para a avaliação presente ou o juízo divino.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: os de outras, porém, vêm depois
  rationale: Torna explícito que os pecados continuam sendo o sujeito, conserva o contraste e expressa de modo natural a ideia de aparecerem posteriormente.
theological_decisions:
- issue: Alcance de κρίσις
  choice: julgamento
  alternative: avaliação eclesial presente; juízo divino final
  rationale: O contexto imediato favorece a avaliação de pessoas, mas a expressão também comporta um sentido mais amplo. A tradução não decide entre essas possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a metáfora temporal dos pecados que vão à frente ou vêm depois e evita definir de modo indevido a natureza do julgamento.
