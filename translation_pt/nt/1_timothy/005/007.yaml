  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: pt
  text: E ordene[a] estas coisas, para que sejam[b] irrepreensíveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “instrua” ou “determine”; o verbo tem força de orientação autoritativa.'
    reason: lexical_alternative
  - marker: b
    text: O grego não declara quem deve ser irrepreensível. Pelo contexto, a referência mais provável é às pessoas abrangidas pelas instruções anteriores, especialmente às viúvas e suas famílias.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: também
  rationale: Neste contexto, o conectivo liga esta ordem às instruções anteriores e pode ser expresso naturalmente como “também”, sem introduzir contraste.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém a referência ampla do demonstrativo neutro plural às orientações anteriores e próximas, sem especificá-las além do que o grego faz.
- source_word: παράγγελλε
  choice: ordene
  rationale: O imperativo transmite uma instrução com força de autoridade. “Ordene” preserva essa força melhor que opções mais brandas, embora “instrua” também seja possível.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo natural a ideia de propósito ou resultado introduzida pela conjunção.
- source_word: ἀνεπίλημπτοι
  choice: irrepreensíveis
  rationale: Designa pessoas contra as quais não há motivo legítimo de censura ou acusação; “irrepreensíveis” é conciso, digno e corrente no registro bíblico moderno.
- source_word: ὦσιν
  choice: sejam
  rationale: O presente do subjuntivo depois de ἵνα é naturalmente representado por “sejam”. O português permite deixar implícito o sujeito plural, preservando a ambiguidade do grego.
theological_decisions:
- issue: Referente do sujeito plural implícito em ὦσιν (“sejam”)
  choice: O sujeito permanece implícito no texto principal.
  alternative: Explicitar “elas”, referindo-se às viúvas, ou mencionar as viúvas e suas famílias.
  rationale: O grego não declara o sujeito do verbo no plural. O contexto aponta provavelmente para as pessoas abrangidas pelas instruções anteriores, em especial as viúvas e suas famílias, mas explicitá-las no texto resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção com sujeito oculto é natural em português e conserva a ambiguidade do original.
