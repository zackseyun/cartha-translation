id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: pt
  text: Os presbíteros que lideram bem sejam considerados dignos de dupla honra[a], especialmente os que trabalham arduamente na palavra e no ensino[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam tidos por dignos de honra em dobro”. A expressão pode incluir tanto respeito quanto sustento material, especialmente à luz do versículo seguinte.'
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem “especialmente” no sentido de “isto é”, identificando os presbíteros em vista como aqueles que trabalham na proclamação e no ensino.
    reason: alternative_reading
  - marker: c
    text: “Na palavra e no ensino” provavelmente se refere ao ministério verbal, como a proclamação e a instrução.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: presbíteros
  rationale: No contexto das Cartas Pastorais, refere-se a líderes reconhecidos da comunidade, não apenas a homens de mais idade. “Presbíteros” é corrente em português e evita confundir o ofício com a idade.
- source_word: καλῶς προεστῶτες
  choice: que lideram bem
  rationale: προΐστημι indica exercer liderança, direção ou supervisão. “Lideram bem” é natural e preserva a autoridade envolvida sem a dureza que “governam” pode sugerir.
- source_word: διπλῆς τιμῆς
  choice: de dupla honra
  rationale: A formulação literal preserva a amplitude de τιμή, que pode abranger tanto estima quanto sustento material, particularmente à luz do versículo seguinte.
- source_word: ἀξιούσθωσαν
  choice: sejam considerados dignos
  rationale: Reproduz o imperativo passivo e expressa o reconhecimento que a comunidade deve conceder.
- source_word: μάλιστα
  choice: especialmente
  rationale: Marca de modo natural um grupo particularmente enfatizado, sem decidir que a expressão seguinte seja apenas uma reformulação explicativa de todos os presbíteros.
- source_word: κοπιῶντες
  choice: os que trabalham arduamente
  rationale: κοπιάω comunica trabalho intenso e esforço cansativo; a expressão é clara no português atual.
- source_word: ἐν λόγῳ
  choice: na palavra
  rationale: Mantém a abrangência do grego, que provavelmente aponta para o ministério verbal ou a proclamação, sem reduzi-lo explicitamente a “pregação”.
- source_word: διδασκαλίᾳ
  choice: ensino
  rationale: É o equivalente moderno mais claro e acessível, sem a carga técnica que “doutrina” pode adquirir.
theological_decisions:
- issue: Sentido de “dupla honra” em relação aos líderes da comunidade
  choice: Manter “dupla honra” sem restringir seu significado.
  alternative: “respeito redobrado”, “remuneração dobrada” ou “honra que inclui sustento material”
  rationale: O contexto imediato do versículo 18 favorece a inclusão de sustento material, mas τιμή também pode indicar estima. A tradução ampla preserva a tensão sem impor uma teoria denominacional de governo ou remuneração eclesiástica.
- issue: Força de μάλιστα
  choice: Traduzir por “especialmente”.
  alternative: “isto é” ou “a saber”
  rationale: “Especialmente” preserva a provável ênfase em um subconjunto dos presbíteros sem encerrar a discussão sobre se a frase identifica todos os presbíteros ou alguns particularmente dedicados a esse trabalho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Presbíteros” mantém a referência ao papel comunitário; “lideram” evita tanto linguagem excessivamente hierárquica quanto perda de autoridade. A ordem dos marcadores acompanha a expressão a que cada nota se refere.
