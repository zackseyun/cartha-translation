  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: pt
  text: Seja inscrita na lista somente a viúva que tenha pelo menos sessenta anos e tenha sido mulher de um só marido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mulher de um só homem”. A expressão pode se referir à fidelidade conjugal ou à boa reputação nesse aspecto, embora alguns a entendam como “que tenha se casado apenas uma vez”.
    reason: Leitura alternativa de uma expressão grega cuja extensão exata é discutida.
lexical_decisions:
- source_word: Χήρα
  choice: viúva
  rationale: É o sentido comum do termo e identifica a mulher cujo marido morreu, aqui considerada para inclusão formal na lista.
- source_word: καταλεγέσθω
  choice: seja inscrita na lista
  rationale: O verbo indica inclusão em uma lista ou registro oficial; a formulação explicita com naturalidade esse sentido administrativo.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: que tenha pelo menos sessenta anos
  rationale: A expressão estabelece a idade mínima de sessenta anos; esta formulação comunica de modo natural o estado de idade alcançada expresso pelo particípio γεγονυῖα.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: mulher de um só marido
  rationale: A tradução mantém de forma relativamente literal o idioma grego e sua ambiguidade, sem decidir se ele exige um único casamento ao longo da vida ou descreve fidelidade conjugal.
theological_decisions:
- issue: Sentido de ἑνὸς ἀνδρὸς γυνή
  choice: Manter no texto a expressão idiomática “mulher de um só marido”.
  alternative: “fiel ao marido” ou “casada apenas uma vez”
  rationale: O grego não resolve inequivocamente se a expressão se refere à fidelidade e reputação conjugal ou a ter contraído apenas um casamento. Preservar o idioma no texto evita impor uma conclusão doutrinária específica; a nota registra as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Seja inscrita na lista” conserva o tom normativo e o sentido administrativo; “pelo menos sessenta anos” é mais natural do que uma reprodução rígida de “não menos de sessenta anos”.
