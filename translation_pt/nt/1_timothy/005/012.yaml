  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: pt
  text: ficando sujeitas a julgamento, porque deixaram de lado a fé que tinham antes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a primeira promessa” ou “o compromisso anterior”. A palavra grega pode significar “fé”, mas, neste contexto, alguns a entendem como uma promessa anterior, provavelmente relacionada à inclusão na lista de viúvas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: ficando sujeitas
  rationale: O particípio significa literalmente “tendo”, mas, com κρίμα, a expressão idiomática indica que elas ficam sujeitas a julgamento; a formulação também mantém a ligação com o contexto anterior.
- source_word: κρίμα
  choice: julgamento
  rationale: O termo pode indicar julgamento, condenação ou veredicto. “Julgamento” preserva a seriedade sem especificar uma condenação eterna que o versículo não declara expressamente.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro e natural a razão pela qual elas ficam sujeitas a julgamento.
- source_word: τὴν πρώτην πίστιν
  choice: a fé que tinham antes
  rationale: πρῶτος tem aqui sentido temporal, e esta formulação expressa naturalmente a ideia de fé anterior. πίστις é mantido como “fé” no texto principal, enquanto a possível acepção contextual de promessa ou compromisso é registrada em nota.
- source_word: ἠθέτησαν
  choice: deixaram de lado
  rationale: ἀθετέω pode significar rejeitar, pôr de lado ou invalidar. “Deixaram de lado” comunica o repúdio ao que tinham antes sem impor um sentido técnico mais específico.
theological_decisions:
- issue: Sentido de τὴν πρώτην πίστιν no contexto
  choice: a fé que tinham antes
  alternative: a primeira promessa; o compromisso anterior
  rationale: A expressão pode se referir à fé cristã anteriormente professada ou a uma promessa ou compromisso anterior, possivelmente ligado à inclusão na lista de viúvas. O texto principal mantém o sentido comum de πίστις, e a nota preserva a ambiguidade contextual genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “ficando sujeitas a julgamento” é natural e evita identificar κρίμα especificamente com condenação eterna.
