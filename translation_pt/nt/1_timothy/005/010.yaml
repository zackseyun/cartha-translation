source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: pt
  text: 'reconhecida por suas boas obras: se criou filhos, se acolheu estrangeiros, se lavou os pés dos santos[a], se socorreu os aflitos, se se empenhou em toda boa obra.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “santos” se refere ao povo santo de Deus, isto é, aos demais crentes.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “se seguiu de perto toda boa obra”. A expressão grega ressalta busca ativa e compromisso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: reconhecida por suas boas obras
  rationale: Expressa de modo natural a reputação confirmada por outras pessoas e fundamentada em atos observáveis, preservando o sentido passivo de μαρτυρουμένη.
- source_word: ἐτεκνοτρόφησεν
  choice: criou filhos
  rationale: O verbo indica nutrir e educar crianças até que cresçam; a tradução não determina se eram filhos biológicos.
- source_word: ἐξενοδόχησεν
  choice: acolheu estrangeiros
  rationale: Mantém o sentido concreto de receber hóspedes ou desconhecidos em casa, que é a forma de hospitalidade destacada pelo verbo.
- source_word: ἁγίων
  choice: santos
  rationale: Conserva o termo paulino para o povo consagrado a Deus, sem substituí-lo por uma interpretação mais genérica.
- source_word: πόδας ἔνιψεν
  choice: lavou os pés
  rationale: Preserva o ato concreto de serviço humilde e sua força cultural.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: socorreu os aflitos
  rationale: Comunica de forma concisa a prestação de ajuda a pessoas sob sofrimento, pressão ou necessidade, sem restringir a aflição à perseguição.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: se se empenhou em toda boa obra
  rationale: Transmite a ideia de acompanhar, buscar ativamente e manter compromisso com toda espécie de boa obra, em português natural.
theological_decisions:
- issue: Referente de ἁγίων
  choice: santos
  alternative: crentes; povo santo
  rationale: No uso paulino, o termo normalmente designa os que pertencem a Deus. A forma lexical é mantida no texto, e a nota esclarece seu referente sem acrescentar distinções denominacionais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “se” preserva a estrutura dos critérios introduzidos por εἰ; a sequência “se se empenhou” é gramatical e mantém tanto a condição quanto a ação reflexiva.
