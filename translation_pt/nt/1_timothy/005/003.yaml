  text: Honor widows who are truly widows[a].
translation:
  language: pt
  text: Honre as viúvas que são verdadeiramente viúvas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dê assistência às viúvas que são verdadeiramente viúvas”. Neste contexto, “honrar” provavelmente inclui cuidado material.'
    reason: Alternativa lexical que explicita uma provável dimensão contextual de τιμάω sem restringir o texto principal a ela.
lexical_decisions:
- source_word: Χήρας
  choice: as viúvas
  rationale: O substantivo χήρα designa diretamente mulheres cujo marido morreu; o acusativo plural é o objeto do imperativo.
- source_word: τίμα
  choice: Honre
  rationale: τιμάω significa honrar, estimar ou tratar com respeito. Neste contexto, provavelmente inclui assistência material, mas seu sentido é mais amplo que apenas sustento financeiro.
- source_word: τὰς ὄντως χήρας
  choice: que são verdadeiramente viúvas
  rationale: A repetição de χήρας com ὄντως estabelece uma distinção entre as viúvas em geral e aquelas que se encontram de fato na condição caracterizada nos versículos seguintes.
- source_word: ὄντως
  choice: verdadeiramente
  rationale: O advérbio indica realidade ou genuinidade, e não simples ênfase retórica; “verdadeiramente” preserva essa qualificação.
theological_decisions:
- issue: Alcance de τιμάω no contexto
  choice: Manter “Honre”, abrangendo respeito e, no contexto, provavelmente assistência material.
  alternative: “Dê assistência às viúvas que são verdadeiramente viúvas.”
  rationale: O contexto de 1 Timóteo 5 trata do cuidado material das viúvas, mas o verbo grego é semanticamente mais amplo. A tradução principal evita reduzir seu sentido, enquanto a nota registra a aplicação contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal corrente no Brasil e amplamente compreensível no espaço lusófono. A formulação conserva a repetição conceitual e a distinção enfática do grego.
