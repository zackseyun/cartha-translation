id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: pt
  text: Por isso, quero que as viúvas mais jovens se casem[a], tenham filhos, administrem a casa e não deem ao opositor[b] nenhuma oportunidade para falar mal delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz simplesmente «se casem»; como o contexto trata de viúvas mais jovens, um novo casamento está implícito.
    reason: lexical_alternative
  - marker: b
    text: Ou «adversário», possivelmente uma referência a Satanás.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: quero
  rationale: Expressa a vontade ou preferência pessoal de Paulo de modo natural e direto, sem a formalidade de «desejo».
- source_word: οὖν
  choice: Por isso
  rationale: Marca a conclusão decorrente da discussão anterior e soa natural no português contemporâneo.
- source_word: νεωτέρας
  choice: as viúvas mais jovens
  rationale: O adjetivo significa literalmente «as mais jovens», mas o contexto imediato trata das viúvas; o substantivo implícito foi explicitado para clareza.
- source_word: γαμεῖν
  choice: se casem
  rationale: O verbo significa simplesmente «casar-se». Como as mulheres em questão são viúvas, um novo casamento está implícito no contexto, mas não é explicitado no verbo grego.
- source_word: τεκνογονεῖν
  choice: tenham filhos
  rationale: Comunica em português corrente a ideia de gerar filhos, sem recorrer à formulação menos natural «deem à luz filhos».
- source_word: οἰκοδεσποτεῖν
  choice: administrem a casa
  rationale: Expressa a responsabilidade ativa pela direção do lar sem acrescentar uma ideia indevidamente autoritária de domínio.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: não deem ... nenhuma oportunidade
  rationale: Reproduz de modo idiomático a ideia de não oferecer abertura ou ocasião para uma ação hostil.
- source_word: τῷ ἀντικειμένῳ
  choice: ao adversário
  rationale: Mantém o referente no singular e conserva a ambiguidade do particípio grego, que pode indicar um opositor humano ou, possivelmente, Satanás.
- source_word: λοιδορίας χάριν
  choice: para falar mal delas
  rationale: Expressa em linguagem comum a finalidade de censurar, insultar ou difamar. O pronome «delas» explicita o alvo naturalmente subentendido no contexto.
theological_decisions:
- issue: Referente de τῷ ἀντικειμένῳ
  choice: «o adversário», sem identificação explícita
  alternative: Um opositor humano; ou Satanás, entendido como «o Adversário»
  rationale: O texto grego não identifica expressamente quem se opõe. A tradução preserva essa tensão, e a nota registra as possibilidades sem decidir entre elas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. «Por isso» mantém a ligação lógica; «administrem a casa» evita tanto arcaísmo quanto uma conotação de domínio rígido; «falar mal delas» traduz a hostilidade verbal de forma acessível.
