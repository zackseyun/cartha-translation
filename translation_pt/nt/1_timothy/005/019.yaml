id: 1TI.5.19
reference: 1 Timothy 5:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: pt
  text: Não aceite acusação contra um presbítero[a], a não ser com base no depoimento de duas ou três testemunhas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um homem mais velho”, caso πρεσβυτέρου seja entendido em sentido etário, e não como referência ao presbítero da igreja.
    reason: alternative_reading
  - marker: b
    text: Esta formulação retoma o princípio jurídico do Antigo Testamento segundo o qual uma questão é confirmada por “duas ou três testemunhas” (cf. Dt 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: contra um presbítero
  rationale: No contexto imediato das instruções sobre a liderança e a disciplina da comunidade, πρεσβύτερος provavelmente designa um líder da igreja. “Presbítero” preserva esse sentido institucional sem definir uma estrutura denominacional específica; o sentido etário permanece registrado em nota.
- source_word: κατηγορίαν
  choice: acusação
  rationale: O substantivo indica uma acusação ou denúncia de caráter formal. “Acusação” é claro, atual e mantém o tom jurídico do enunciado.
- source_word: μὴ παραδέχου
  choice: Não aceite
  rationale: O imperativo proíbe acolher ou admitir a acusação no processo de consideração. “Não aceite” comunica esse sentido procedimental em português natural.
- source_word: ἐκτὸς εἰ μὴ
  choice: a não ser
  rationale: A expressão introduz uma exceção. “A não ser” é idiomático e liga-se naturalmente à condição probatória seguinte.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: com base no depoimento de duas ou três testemunhas
  rationale: ἐπί expressa aqui a base probatória, em eco ao princípio jurídico de Deuteronômio 19:15. A inclusão de “depoimento” torna explícita a função das testemunhas, sem alterar o sentido.
theological_decisions:
- issue: Sentido de πρεσβυτέρου no contexto da igreja
  choice: presbítero, no sentido de líder da comunidade
  alternative: homem mais velho
  rationale: As instruções próximas sobre os presbíteros favorecem o sentido institucional. Como o termo grego também pode ser etário, a alternativa legítima é preservada em nota, sem resolver dogmaticamente a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Presbítero” conserva a terminologia eclesial histórica sem especificar funções denominacionais; “com base no depoimento” oferece clareza jurídica natural.
