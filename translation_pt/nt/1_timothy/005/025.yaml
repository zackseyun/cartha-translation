  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: pt
  text: Do mesmo modo, também as boas obras são evidentes; e as que são de outro modo[a] não podem permanecer ocultas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as que são diferentes” ou “as que não são assim”. Alguns entendem que a expressão se refere especificamente a obras más, por analogia com o versículo anterior.'
    reason: Preserva a ambiguidade de τὰ ἄλλως ἔχοντα e registra a interpretação moral mais específica sem inseri-la no texto principal.
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Do mesmo modo, também
  rationale: Mantém tanto a ligação comparativa com o versículo anterior quanto a força adicional de καί, em português natural.
- source_word: ἔργα τὰ καλά
  choice: boas obras
  rationale: Expressão corrente que preserva o sentido concreto e moral de ἔργα e καλά e se harmoniza com o uso paulino.
- source_word: πρόδηλα
  choice: evidentes
  rationale: Comunica que as obras estão manifestas ou claramente reconhecíveis, em contraste com aquilo que está oculto.
- source_word: τὰ ἄλλως ἔχοντα
  choice: as que são de outro tipo
  rationale: Preserva a formulação indireta e ambígua do grego sem acrescentar explicitamente a ideia de obras más.
- source_word: κρυβῆναι οὐ δύνανται
  choice: não podem permanecer ocultas
  rationale: Expressa a impossibilidade indicada por οὐ δύνανται e, no contexto, a ideia de que tais obras não ficam escondidas indefinidamente.
theological_decisions:
- issue: Se τὰ ἄλλως ἔχοντα designa especificamente obras más ou, de modo mais amplo, obras que se apresentam de outra maneira
  choice: 'Formulação ampla: “as que são de outro tipo”'
  alternative: “as obras más” ou “as que não são assim”
  rationale: O grego não emprega um adjetivo explícito para “más”. A tradução mantém aberta tanto a possível contraposição moral quanto a referência a obras cuja natureza ou visibilidade difere das boas obras já evidentes.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. O ponto e vírgula destaca o paralelismo entre as duas afirmações.
