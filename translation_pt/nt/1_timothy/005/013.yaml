id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: pt
  text: Ao mesmo tempo, também aprendem a ficar ociosas, andando de casa em casa. E não apenas ociosas, mas também tagarelas[a] e intrometidas[b], falando o que não devem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fofoqueiras”; o termo grego pode indicar fala insensata ou vazia em sentido mais amplo, embora neste contexto possa incluir fofoca.
    reason: lexical_alternative
  - marker: b
    text: Ou “mulheres que se metem na vida alheia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Ao mesmo tempo, também
  rationale: Preserva a ideia cumulativa e simultânea da expressão grega e mantém a ligação com o contexto anterior em português natural.
- source_word: ἀργαὶ
  choice: ociosas
  rationale: Expressa inatividade, sem reduzir o sentido à simples preguiça moral, e conserva a repetição enfática do grego.
- source_word: μανθάνουσιν
  choice: aprendem a ficar
  rationale: No contexto, indica a aquisição de um hábito; a complementação torna a construção natural em português sem alterar o sentido.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: andando de casa em casa
  rationale: Comunica de modo idiomático o movimento repetido entre diferentes casas.
- source_word: φλύαροι
  choice: tagarelas
  rationale: Abrange fala vazia, indiscreta ou insensata sem limitar indevidamente o termo apenas a fofoca; a nota registra uma alternativa contextual.
- source_word: περίεργοι
  choice: intrometidas
  rationale: Indica envolvimento impróprio em assuntos alheios e é claro no português atual.
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: falando o que não devem
  rationale: Reproduz de maneira concisa a fala sobre coisas impróprias, deixando o verbo 'falar' governar naturalmente a oração relativa.
theological_decisions:
- issue: Referência de gênero nas formas femininas plurais
  choice: 'formas femininas: ociosas, tagarelas, intrometidas'
  alternative: repetir explicitamente 'essas mulheres' ou 'as viúvas jovens'
  rationale: As formas gregas se referem às viúvas mais jovens mencionadas no contexto. O português marca naturalmente o gênero nos adjetivos e particípios, preservando a referência sem inserir novamente um substantivo ausente neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'ociosas' e a referência feminina foram preservadas; 'tagarelas' mantém a amplitude lexical do original, enquanto a nota oferece a leitura contextual 'fofoqueiras'.
