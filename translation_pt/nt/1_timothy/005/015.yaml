  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: pt
  text: Pois algumas já se desviaram para seguir Satanás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “desviaram-se após Satanás” ou “desviaram-se atrás de Satanás”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: já
  rationale: Preserva de modo natural a força temporal do advérbio, indicando que o desvio já ocorreu.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a função explicativa ou justificativa da conjunção em relação à instrução anterior.
- source_word: τινες
  choice: algumas
  rationale: O pronome indefinido refere-se, no contexto imediato, a algumas mulheres, por isso o feminino torna a referência natural e clara em português.
- source_word: ἐξετράπησαν
  choice: se desviaram
  rationale: Preserva a imagem de afastamento do caminho correto sem introduzir a ideia causativa de que foram necessariamente desencaminhadas por outra pessoa.
- source_word: ὀπίσω
  choice: para seguir
  rationale: Expressa em português corrente o sentido idiomático de ir após alguém, embora o termo grego possa ser vertido mais literalmente como «atrás de» ou «após».
- source_word: Σατανᾶ
  choice: Satanás
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Se ὀπίσω τοῦ Σατανᾶ deve ser traduzido literalmente como «atrás de Satanás» ou idiomaticamente como «seguir Satanás».
  choice: para seguir Satanás
  alternative: atrás de Satanás; após Satanás
  rationale: A formulação comunica com clareza a ideia metafórica de seguir ou alinhar-se com Satanás, enquanto a nota preserva as possibilidades mais literais e a imagem direcional do grego.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. «Pois» preserva a ligação com o contexto anterior; «algumas» explicita apenas o gênero exigido pelo referente contextual, sem identificar pessoas específicas.
