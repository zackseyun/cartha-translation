  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: pt
  text: Do mesmo modo, os diáconos devem ser dignos de respeito, não dizerem uma coisa a uma pessoa e outra a outra[a], não se entregarem a muito vinho[b], nem serem ávidos por lucro desonroso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não serem dúplices no falar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não serem apegados a muito vinho”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não buscarem ganhos desonrosos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: os diáconos
  rationale: Neste contexto, o termo introduz um grupo reconhecido na comunidade, em paralelo com os supervisores dos versículos anteriores. “Diáconos” preserva essa especificidade sem definir estruturas eclesiásticas posteriores.
- source_word: ὡσαύτως
  choice: Do mesmo modo
  rationale: Marca a continuidade com as qualificações anteriores e introduz um grupo relacionado; a expressão é clara e natural em português.
- source_word: σεμνούς
  choice: respeitáveis
  rationale: Comunica conduta honrada e digna de respeito sem sugerir rigidez ou solenidade excessiva.
- source_word: μὴ διλόγους
  choice: não ser dúplices no falar
  rationale: Expressa a duplicidade verbal indicada pela imagem grega de ter “duas palavras”, em linguagem portuguesa compreensível, sem limitar o sentido apenas à mentira direta.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: não se entregar a muito vinho
  rationale: Retrata dedicação ou apego habitual ao vinho, preserva o qualificativo “muito” e evita introduzir uma categoria clínica moderna como dependência.
- source_word: μὴ αἰσχροκερδεῖς
  choice: nem ser gananciosos por lucro vergonhoso
  rationale: Preserva tanto a avidez por ganho quanto o caráter moralmente vergonhoso ou desonroso desse lucro.
theological_decisions:
- issue: Terminologia de função eclesial para διάκονος
  choice: Traduzir por “diáconos”, como designação de uma função reconhecida
  alternative: “servos” ou “ministros” em sentido amplo
  rationale: A lista de qualificações e o paralelo com os supervisores indicam uma função reconhecida na comunidade. “Diáconos” mantém esse dado contextual sem importar atribuições denominacionais posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção elíptica grega foi explicitada com “devem ser”. “Dúplices no falar” conserva a força da expressão sem recorrer ao arcaísmo “de língua dobre”; a nota esclarece seu sentido idiomático.
