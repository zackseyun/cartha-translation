base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: pt
  text: Mas, se alguém não sabe administrar a própria casa[a], como cuidará[b] da igreja de Deus[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liderar a própria casa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tomará conta”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a igreja de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Mas, se
  rationale: Preserva tanto a condição expressa por εἰ como o leve contraste introduzido por δέ, em português natural.
- source_word: τις
  choice: alguém
  rationale: Representa o pronome indefinido singular sem acrescentar ao termo uma especificação que ele próprio não contém.
- source_word: τοῦ ἰδίου οἴκου
  choice: a própria casa
  rationale: Neste contexto, οἶκος designa a unidade doméstica — família e demais pessoas sob seus cuidados —, não apenas o edifício. “A própria casa” é uma expressão portuguesa natural que conserva essa amplitude contextual.
- source_word: προστῆναι
  choice: administrar
  rationale: Expressa a liderança responsável e a boa condução da casa sem introduzir o tom mais autoritário que “governar” poderia sugerir.
- source_word: οὐκ οἶδεν
  choice: não sabe
  rationale: Com o infinitivo, οἶδα tem o sentido idiomático de saber fazer algo; a construção portuguesa “não sabe administrar” comunica esse valor diretamente.
- source_word: πῶς
  choice: como
  rationale: Mantém a força da pergunta retórica que infere da condução da casa a capacidade de cuidar da igreja.
- source_word: ἐκκλησίας θεοῦ
  choice: da igreja de Deus
  rationale: É a formulação eclesial corrente e reproduz claramente a relação genitiva do texto grego.
- source_word: ἐπιμελήσεται
  choice: cuidará
  rationale: Comunica atenção responsável e solicitude pelo bem da comunidade, distinguindo este verbo do verbo de administração usado na primeira oração.
theological_decisions:
- issue: Relação entre a liderança da casa e o cuidado da igreja
  choice: Usar “administrar” para a própria casa e “cuidará” para a igreja de Deus.
  alternative: Empregar “governar” na primeira oração ou repetir um verbo de liderança nas duas orações.
  rationale: O grego emprega dois verbos diferentes, προΐστημι e ἐπιμελέομαι. A tradução conserva essa distinção e não reduz o cuidado da igreja a mero exercício de autoridade.
- issue: Gênero do sujeito indefinido
  choice: Traduzir τις por “alguém” e aproveitar a construção portuguesa sem pronome pessoal explícito.
  alternative: Explicitar “um homem” ou empregar uma reformulação plural.
  rationale: “Alguém” traduz com precisão o pronome indefinido. A flexão verbal portuguesa permite manter o singular e a referência contextual ao candidato a supervisor sem acrescentar uma expressão de gênero inexistente em τις nem neutralizar o contexto imediato.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase acompanha de perto o raciocínio grego, enquanto “administrar a própria casa” e “cuidará da igreja” soam naturais e preservam a diferença entre os dois verbos do original.
