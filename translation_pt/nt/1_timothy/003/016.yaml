id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: pt
  text: 'E, sem dúvida, grande é o mistério da devoção a Deus:


    Ele[a] foi manifestado em carne,

    foi vindicado em espírito[b],

    foi visto por anjos,

    foi proclamado entre as nações[c],

    foi objeto de fé no mundo,

    foi levado para o alto em glória[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos dizem: «Deus foi manifestado em carne». O texto grego crítico diz literalmente «o qual» ou «aquele que», aqui representado por «Ele».'
    reason: textual_variant
  - marker: b
    text: 'Ou: «foi vindicado pelo Espírito» ou «foi vindicado no Espírito». A expressão grega é concisa e pode indicar a atuação do Espírito Santo ou a esfera da vida espiritual.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: «entre os gentios».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: «foi levado para a glória».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: sem dúvida
  rationale: Expressa em português atual algo reconhecido ou admitido por todos, sem recorrer ao arcaísmo «sem controvérsia».
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: o mistério da devoção a Deus
  rationale: «Mistério» preserva o sentido paulino de uma verdade divina antes oculta e agora revelada. «Devoção a Deus» comunica com clareza a reverência e a vida piedosa denotadas por εὐσέβεια nas Cartas Pastorais.
- source_word: Ὃς
  choice: Ele
  rationale: Representa naturalmente o pronome relativo masculino do texto crítico e introduz a referência pessoal a Cristo sem adotar a variante θεός.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: foi manifestado em carne
  rationale: Mantém a forma passiva, o sentido de manifestação pública e a concisão poética da expressão grega, que aponta para a existência humana corpórea.
- source_word: ἐδικαιώθη
  choice: foi vindicado
  rationale: Indica que ele foi demonstrado ou declarado estar com a razão, evitando a possível impressão de que tenha sido moralmente tornado justo.
- source_word: ἐν πνεύματι
  choice: em espírito
  rationale: A formulação concisa e sem artigo preserva a ambiguidade entre a atuação do Espírito Santo e a esfera ou condição espiritual.
- source_word: ὤφθη ἀγγέλοις
  choice: foi visto por anjos
  rationale: Reproduz o passivo e entende o dativo como agente da percepção; no contexto cristológico, «anjos» é mais provável que «mensageiros» humanos.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: foi proclamado entre as nações
  rationale: «Proclamado» preserva a linguagem de anúncio público, e «nações» mantém a amplitude de ἔθνη sem excluir o sentido de gentios.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: foi objeto de fé no mundo
  rationale: Torna natural em português a construção passiva com Cristo como objeto da fé, evitando o ambíguo «foi acreditado».
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: foi levado para o alto em glória
  rationale: Comunica o movimento ascendente do verbo e conserva «em glória» como expressão potencialmente modal ou esférica.
theological_decisions:
- issue: 'Variante textual no início da composição confessional: Ὃς, θεός ou ὅ'
  choice: Traduzir a leitura crítica Ὃς por «Ele»
  alternative: «Deus foi manifestado em carne» ou «o qual foi manifestado em carne»
  rationale: O SBLGNT lê o pronome relativo masculino Ὃς. «Ele» é natural em português e preserva a referência cristológica sem inserir no texto principal a variante historicamente importante θεός.
- issue: Referente de ἐν πνεύματι
  choice: Usar «em espírito» no texto principal
  alternative: «pelo Espírito» ou «no Espírito»
  rationale: 'A expressão grega sem artigo permite mais de uma compreensão: agência do Espírito Santo ou esfera/condição espiritual. A tradução principal não resolve essa tensão; a nota registra as alternativas.'
- issue: Sentido de ἐδικαιώθη aplicado a Cristo
  choice: Traduzir por «foi vindicado»
  alternative: «foi justificado» ou «foi declarado justo»
  rationale: No contexto, o verbo aponta para demonstração ou declaração pública de que Cristo estava com a razão, não para ele ser tornado justo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A disposição em versos conserva o provável caráter confessional ou hínico e o paralelismo das seis formas verbais. Evitaram-se tanto arcaísmos como formulações denominacionais; as ambiguidades textuais e teológicas relevantes foram mantidas ou indicadas em notas.
