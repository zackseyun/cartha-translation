translation:
  language: pt
  text: não dado à embriaguez[a], não violento[b], mas gentil, pacífico[c] e sem amor ao dinheiro[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não viciado em vinho”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não agressor”, enfatizando a agressividade física.
    reason: lexical_alternative
  - marker: c
    text: Ou “não briguento”.
    reason: lexical_alternative
  - marker: d
    text: Ou “não amante do dinheiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάροινον
  choice: dado à embriaguez
  rationale: A expressão comunica uma disposição habitual ligada ao excesso de vinho, sem sugerir que o simples consumo de vinho seja o ponto central.
- source_word: πλήκτην
  choice: violento
  rationale: Embora o termo possa designar literalmente alguém que agride fisicamente, “violento” expressa de modo natural o traço de caráter censurado.
- source_word: ἐπιεικῆ
  choice: gentil
  rationale: O termo abrange gentileza, moderação, razoabilidade e tolerância; “gentil” é conciso e natural nesta lista de qualificações.
- source_word: ἄμαχον
  choice: pacífico
  rationale: Expressa alguém que não é inclinado a brigas ou contendas, preservando em forma positiva o caráter requerido.
- source_word: ἀφιλάργυρον
  choice: sem amor ao dinheiro
  rationale: A expressão reproduz o sentido do composto grego, que nega o amor ao dinheiro, e destaca a disposição interior, não apenas atos explícitos de ganância.
