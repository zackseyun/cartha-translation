  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: pt
  text: 'Esta afirmação é digna de confiança: se alguém aspira à supervisão[a], deseja uma boa tarefa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao cargo de supervisor”; tradicionalmente, “ao episcopado”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “uma tarefa nobre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Esta palavra é digna de confiança
  rationale: Reproduz a fórmula das Cartas Pastorais em português natural e solene. “Palavra” mantém a ligação com λόγος, enquanto “digna de confiança” comunica o sentido idiomático de πιστός.
- source_word: εἴ τις
  choice: se alguém
  rationale: τις é pronome indefinido e, nesta oração, não especifica por si só o sexo da pessoa.
- source_word: ἐπισκοπῆς
  choice: à supervisão
  rationale: “Supervisão” preserva o sentido de responsabilidade e atividade de cuidar e dirigir, sem impor ao texto uma estrutura episcopal posterior.
- source_word: ὀρέγεται
  choice: aspira
  rationale: Expressa de modo corrente a ideia de estender-se em direção a algo ou procurar alcançá-lo.
- source_word: καλοῦ ἔργου
  choice: uma boa obra
  rationale: Mantém a correspondência direta com καλός e ἔργον e ressalta que se trata de trabalho, não apenas de posição ou prestígio.
- source_word: ἐπιθυμεῖ
  choice: deseja
  rationale: Verbo claro e natural que conserva o paralelismo sem intensificar indevidamente o desejo.
theological_decisions:
- issue: Se ἐπισκοπῆς deve ser vertido com terminologia eclesiástica posterior
  choice: supervisão
  alternative: o cargo de supervisor; episcopado
  rationale: O substantivo pode designar supervisão ou a função correspondente. A escolha mantém a amplitude lexical e evita definir uma forma posterior de governo eclesiástico.
- issue: Se εἴ τις deve ser traduzido de forma especificamente masculina
  choice: se alguém
  alternative: se algum homem
  rationale: O pronome indefinido grego é genérico nesta expressão; uma restrição masculina não deve ser importada a partir deste termo isoladamente.
- issue: Relação entre ὀρέγεται e ἐπιθυμεῖ
  choice: aspira... deseja
  alternative: procura alcançar... anseia por
  rationale: 'A tradução preserva os dois verbos e sua tensão retórica: buscar a supervisão equivale a desejar uma obra boa, sem transformar a afirmação em aprovação de ambição por status.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Supervisão” é mais natural que “superintendência” e menos preso a estruturas denominacionais que “episcopado”. Os marcadores foram colocados junto aos elementos a que se referem.
