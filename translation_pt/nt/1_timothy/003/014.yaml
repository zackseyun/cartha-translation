  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: pt
  text: Escrevo-lhe estas coisas, esperando ir até você em breve[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «rapidamente»; ou: «dentro de pouco tempo».'
    reason: O grego ἐν τάχει pode indicar tanto brevidade temporal («em breve», «dentro de pouco tempo») quanto rapidez da ação («rapidamente»).
lexical_decisions:
- source_word: Ταῦτά
  choice: estas coisas
  rationale: Preserva o plural neutro e remete ao conjunto de instruções dadas no contexto.
- source_word: σοι
  choice: lhe
  rationale: Representa naturalmente o dativo do destinatário com o verbo «escrever», sem acrescentar a ideia de benefício.
- source_word: γράφω
  choice: Escrevo
  rationale: O presente epistolar é natural em português como «Escrevo» e expressa o ato de redigir a carta.
- source_word: ἐλπίζων
  choice: esperando
  rationale: Mantém o particípio como circunstância concomitante e comunica expectativa sem transformá-la em certeza.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: ir até você
  rationale: Em português, a deslocação a partir do lugar do remetente é normalmente expressa por «ir»; «até você» preserva a direção pessoal indicada por πρός com acusativo.
- source_word: ἐν τάχει
  choice: em breve
  rationale: No contexto epistolar, expressa de modo natural a proximidade temporal, enquanto a nota registra os outros sentidos possíveis do idioma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Escrevo-lhe» evita a repetição de «a você» sem soar excessivamente formal; «ir até você» mantém clara a direção do deslocamento.
