source:
  edition: SBLGNT
  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: pt
  text: mantendo o mistério da fé com a consciência limpa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mantendo o mistério da fé com uma consciência pura”.
    reason: Alternativa lexical mais formal para ἐν καθαρᾷ συνειδήσει.
lexical_decisions:
- source_word: ἔχοντας
  choice: guardando
  rationale: O particípio presente indica posse e adesão contínuas por parte dos diáconos mencionados no contexto. “Guardando” expressa essa perseverança melhor do que a simples ideia de “ter”.
- source_word: τὸ μυστήριον
  choice: o mistério
  rationale: Conserva o termo paulino para a verdade divina antes oculta e agora revelada, sem explicitar no texto mais do que o grego afirma.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: O artigo favorece aqui a referência ao conteúdo da fé cristã, embora a formulação concisa preserve a densidade teológica da expressão grega.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: com a consciência limpa
  rationale: “Com” traduz idiomaticamente ἐν nessa relação, e “consciência limpa” é uma expressão portuguesa natural que comunica integridade moral. A alternativa mais formal “consciência pura” é registrada em nota.
theological_decisions:
- issue: Sentido de τῆς πίστεως
  choice: a fé como conteúdo da crença cristã
  alternative: o ato subjetivo de crer ou a fidelidade
  rationale: No contexto das qualificações para diáconos, a expressão provavelmente se refere à fé cristã que eles devem guardar. A tradução “da fé” mantém a formulação tradicional sem impor uma definição técnica posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Consciência limpa” é idiomático; “consciência pura” preserva em nota a correspondência lexical mais direta.
