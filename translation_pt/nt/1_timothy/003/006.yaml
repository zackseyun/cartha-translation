id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: pt
  text: Não deve ser recém-convertido, para que não se encha de orgulho e caia no julgamento do diabo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caia na mesma condenação que o diabo”; alternativamente: “caia sob um julgamento ligado ao diabo”.'
    reason: Leitura alternativa decorrente da ambiguidade do genitivo grego τοῦ διαβόλου.
lexical_decisions:
- source_word: νεόφυτον
  choice: recém-convertido
  rationale: Literalmente, “recém-plantado”; no contexto, designa alguém que há pouco abraçou a fé. “Recém-convertido” expressa esse sentido eclesial com clareza em português atual.
- source_word: τυφωθεὶς
  choice: se encha de orgulho
  rationale: O verbo descreve alguém inflado pela presunção. A formulação preserva a imagem subjacente e comunica naturalmente a advertência moral.
- source_word: κρίμα
  choice: julgamento
  rationale: O termo pode significar “julgamento” ou “condenação”. “Julgamento” é mais amplo e evita decidir antecipadamente a relação exata com o diabo.
- source_word: τοῦ διαβόλου
  choice: do diabo
  rationale: O genitivo grego é ambíguo. A construção formal “do diabo” preserva a possibilidade de se referir ao julgamento sofrido pelo diabo ou a um julgamento relacionado a ele.
- source_word: ἐμπέσῃ
  choice: caia em
  rationale: Mantém a metáfora de entrar ou incorrer em uma condição perigosa e soa natural em português.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Expressa de modo claro e atual a ideia de propósito ou resultado negativo.
theological_decisions:
- issue: Sentido de εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: “caia no julgamento do diabo”, preservando a ambiguidade
  alternative: “caia na mesma condenação que o diabo” ou “caia sob um julgamento ligado ao diabo”
  rationale: O genitivo τοῦ διαβόλου admite mais de uma relação semântica plausível. O texto principal não determina se se trata do julgamento recebido pelo diabo ou de um julgamento de algum modo associado a ele.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Recém-convertido” torna explícito o uso metafórico de “recém-plantado”; “se encha de orgulho” evita uma expressão pouco idiomática sem perder a imagem de presunção inflada.
