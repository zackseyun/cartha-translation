id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: pt
  text: Portanto, é necessário que o supervisor seja irrepreensível, marido de uma só mulher[a], sóbrio, sensato, respeitável, hospitaleiro e apto para ensinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem de uma só mulher”; a expressão pode enfatizar a fidelidade conjugal, e não apenas o estado civil.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: é necessário
  rationale: Expressa claramente a necessidade normativa do verbo impessoal, sem reduzir a qualificação a mero conselho.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a inferência e a ligação lógica com a discussão anterior.
- source_word: ἐπίσκοπον
  choice: supervisor
  rationale: Traduz o título pelo sentido básico de quem exerce supervisão, evitando importar terminologia eclesiástica posterior associada a “bispo”.
- source_word: ἀνεπίλημπτον
  choice: irrepreensível
  rationale: Indica alguém contra quem não cabe acusação válida, sem sugerir perfeição sem pecado.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: marido de uma só mulher
  rationale: Mantém a formulação masculina e formalmente próxima do grego, preservando em aberto as questões sobre fidelidade conjugal, poligamia e estado matrimonial.
- source_word: νηφάλιον
  choice: sóbrio
  rationale: Conserva a imagem de sobriedade e comunica moderação e lucidez, sem restringir necessariamente o sentido à abstinência de vinho.
- source_word: σώφρονα
  choice: sensato
  rationale: Distingue esta qualidade da sobriedade anterior e transmite juízo equilibrado, prudência e domínio de si.
- source_word: κόσμιον
  choice: respeitável
  rationale: Expressa conduta decorosa e apropriada em português atual e natural.
- source_word: φιλόξενον
  choice: hospitaleiro
  rationale: É a forma concisa e corrente para a disposição de acolher hóspedes e estrangeiros.
- source_word: διδακτικόν
  choice: apto para ensinar
  rationale: Comunica capacidade ou competência para o ensino, e não apenas disposição para ensinar.
theological_decisions:
- issue: Interpretação de μιᾶς γυναικὸς ἄνδρα nas qualificações para a supervisão da comunidade
  choice: marido de uma só mulher
  alternative: homem de uma só mulher; fiel à sua esposa
  rationale: A expressão pode destacar fidelidade conjugal, excluir a poligamia ou ter implicações quanto ao estado matrimonial e a novo casamento. A tradução principal conserva a forma mais literal, sem decidir entre essas interpretações, e a nota registra a leitura idiomática relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Supervisor” traduz o ofício por sua função; “é necessário que” mantém a força normativa de δεῖ. A coordenação final com “e” torna natural a lista de qualificações.
