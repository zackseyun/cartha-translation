source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: pt
  text: Os diáconos devem ser maridos de uma só mulher[a], dirigindo bem os seus filhos e as próprias casas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens de uma só mulher”. A expressão pode enfatizar a fidelidade conjugal; alguns a entendem mais especificamente como exclusão da poligamia ou de um novo casamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: diáconos
  rationale: Neste contexto de requisitos para funções na igreja, o termo designa os diáconos, e não servidores em sentido genérico.
- source_word: ἔστωσαν
  choice: devem ser
  rationale: O imperativo presente tem força normativa numa lista de requisitos; “devem ser” expressa isso com naturalidade.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: maridos de uma só mulher
  rationale: A formulação próxima do grego preserva a referência masculina e a ambiguidade entre fidelidade conjugal, monogamia e possíveis restrições relativas a novo casamento.
- source_word: τέκνων
  choice: seus filhos
  rationale: O possessivo, embora implícito no grego, é exigido pelo português natural e decorre do contexto doméstico.
- source_word: καλῶς
  choice: bem
  rationale: É a equivalência direta e idiomática do advérbio.
- source_word: προϊστάμενοι
  choice: cuidando
  rationale: No contexto da casa, comunica responsabilidade e direção sem a rigidez de “governando”; a ideia de supervisão responsável permanece no conjunto da expressão.
- source_word: τῶν ἰδίων οἴκων
  choice: da própria casa
  rationale: “Casa” em português pode designar naturalmente o núcleo doméstico, não apenas o edifício, e evita a sonoridade mais técnica de “lar” ou “unidade doméstica”.
theological_decisions:
- issue: Sentido de μιᾶς γυναικὸς ἄνδρες nos requisitos para diáconos
  choice: maridos de uma só mulher
  alternative: homens fiéis à sua mulher; casados uma só vez
  rationale: A expressão grega é compacta e discutida. A tradução formal no texto principal evita decidir se a ênfase recai especificamente sobre fidelidade conjugal, monogamia ou exclusão de novo casamento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Diáconos” mantém o título reconhecido da função e “própria casa” conserva o sentido amplo do núcleo doméstico.
