reference: 1 Timothy 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: pt
  text: Pois os que serviram bem obtêm para si uma posição honrosa e grande ousadia na fé em Messias Jesus[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande confiança”; a palavra grega pode indicar ousadia, confiança ou franqueza.
    reason: lexical_alternative
  - marker: b
    text: Ou “na fidelidade em Messias Jesus”. A palavra grega πίστις pode significar fé, confiança ou fidelidade.
    reason: alternative_reading
  - marker: c
    text: Em grego, “Cristo”; aqui traduzido como “Messias” porque o termo funciona como título.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: serviram
  rationale: O verbo significa servir ou ministrar. O contexto é o dos diáconos, mas a tradução verbal evita inserir no próprio verbo um título de função que o grego não explicita.
- source_word: καλῶς
  choice: bem
  rationale: É a forma adverbial direta e natural, modificando 'serviram'.
- source_word: βαθμὸν ... καλὸν
  choice: uma posição honrosa
  rationale: βαθμός pode indicar degrau, posição ou condição. Aqui a expressão é metafórica e aponta para uma posição respeitável adquirida pelo bom serviço, sem necessariamente indicar promoção hierárquica.
- source_word: περιποιοῦνται
  choice: conquistam para si
  rationale: Expressa a ideia de obter ou adquirir e preserva a força reflexiva da voz média.
- source_word: παρρησίαν
  choice: ousadia
  rationale: Preserva a força do termo, que pode denotar liberdade confiante para falar ou agir; 'confiança' permanece uma alternativa legítima.
- source_word: πίστει
  choice: fé
  rationale: É a tradução principal mais natural neste contexto, embora o termo também possa transmitir confiança ou fidelidade.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: que está no Messias Jesus
  rationale: Mantém a ligação gramatical da expressão preposicional com 'fé', sem reduzir a frase simplesmente a 'fé em'.
- source_word: Χριστῷ
  choice: Messias
  rationale: Χριστός conserva aqui seu valor de título, correspondendo a 'Messias', e não é tratado apenas como parte de um nome próprio.
theological_decisions:
- issue: Sentido de πίστις em ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: fé
  alternative: fidelidade
  rationale: A leitura principal entende a expressão como fé situada e definida no Messias Jesus. Como πίστις também pode significar fidelidade, essa possibilidade genuína é preservada em nota.
- issue: Natureza de βαθμὸν καλόν
  choice: posição honrosa
  alternative: bom degrau ou boa posição
  rationale: A tradução evita decidir que se trata de grau eclesiástico, progresso espiritual ou recompensa futura; comunica apenas a posição respeitável sugerida pela metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a estrutura e as ambiguidades relevantes do grego sem usar jargão eclesiástico desnecessário.
