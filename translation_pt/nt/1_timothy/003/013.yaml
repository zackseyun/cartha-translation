  rationale: A revisão substitui “conquistam” por “obtêm”, opção semanticamente mais neutra e próxima de περιποιοῦνται, e ajusta a formulação da relação da fé com Messias Jesus para um português mais idiomático. As notas mantêm as alternativas lexicais relevantes e os mesmos marcadores.
