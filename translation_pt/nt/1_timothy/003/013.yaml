    issue: “conquistam para si” para περιποιοῦνται
    rationale: Embora possível, “conquistam” pode sugerir vitória ou tomada por esforço competitivo. “Obtêm para si” preserva melhor o sentido de adquirir e a força reflexiva da voz média.
  - severity: low
    issue: “a fé que está no Messias Jesus”
    rationale: A formulação é muito literal e soa menos natural em português. “A fé em Messias Jesus” transmite a relação contextual mais naturalmente, sem resolver de modo doutrinário a ambiguidade de πίστις.
