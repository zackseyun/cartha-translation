id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: pt
  text: Mas, se eu demorar, escrevo para que você saiba como se deve proceder na família de Deus, que é a assembleia do Deus vivo[a], coluna e sustentáculo da verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “igreja do Deus vivo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “coluna e fundamento da verdade”; também se propõe “coluna e baluarte da verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: demorar
  rationale: No contexto, refere-se à demora de Paulo em chegar. A construção «se eu demorar» é natural em português e preserva o valor condicional sem sugerir lentidão moral.
- source_word: ἵνα εἰδῇς
  choice: para que você saiba
  rationale: Reproduz com naturalidade a oração de finalidade e mantém explícito o destinatário singular.
- source_word: δεῖ ... ἀναστρέφεσθαι
  choice: se deve proceder
  rationale: A construção impessoal preserva a necessidade normativa de δεῖ e o sentido comportamental de ἀναστρέφεσθαι sem restringi-lo apenas a uma ação específica.
- source_word: ἐν οἴκῳ θεοῦ
  choice: na família de Deus
  rationale: οἶκος pode designar casa ou conjunto doméstico. Como a expressão é explicada por ἐκκλησία, «família» comunica que se trata do povo de Deus, e não de um edifício.
- source_word: ἐκκλησία
  choice: comunidade
  rationale: «Comunidade» designa de modo claro e atual o povo reunido, evitando que «igreja» seja entendido primeiramente como prédio ou instituição. A forma tradicional aparece em nota.
- source_word: θεοῦ ζῶντος
  choice: do Deus vivo
  rationale: Equivalência direta e idiomática do genitivo, preservando a ênfase teológica em Deus como vivo.
- source_word: στῦλος
  choice: coluna
  rationale: Mantém a metáfora arquitetônica com o termo português mais natural neste par nominal.
- source_word: ἑδραίωμα
  choice: sustentáculo
  rationale: Expressa aquilo que firma ou sustenta. Preserva a metáfora e sua força sem afirmar que a comunidade seja a origem da verdade.
- source_word: τῆς ἀληθείας
  choice: da verdade
  rationale: Mantém a determinação do sintagma grego e a referência definida à verdade.
theological_decisions:
- issue: Sentido de ἐκκλησία no contexto eclesiológico
  choice: comunidade
  alternative: igreja; assembleia; congregação
  rationale: A escolha destaca as pessoas que constituem a comunidade de Deus, em continuidade com a imagem de sua família. Não nega o sentido eclesial tradicional, registrado em nota.
- issue: Relação entre «família de Deus» e «comunidade do Deus vivo»
  choice: A oração relativa identifica e explica a família de Deus como a comunidade do Deus vivo.
  alternative: Entender «casa de Deus» principalmente como edifício ou local sagrado.
  rationale: A aposição introduzida por ἥτις favorece o sentido coletivo e pessoal de οἶκος, embora a imagem de casa permaneça subjacente.
- issue: Sentido de «coluna e sustentáculo da verdade»
  choice: A expressão é predicada da comunidade do Deus vivo, sem explicar de que modo ela sustenta a verdade.
  alternative: «coluna e fundamento da verdade»; «coluna e baluarte da verdade»
  rationale: A redação conserva a elevada afirmação eclesiológica e a tensão metafórica do grego, sem concluir que a comunidade origine a verdade nem harmonizar o texto com formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» torna explícito o destinatário singular; «se deve proceder» mantém a formulação geral. «Família» e «comunidade» evitam a leitura de um edifício, enquanto as notas preservam alternativas tradicionais e lexicais genuínas.
