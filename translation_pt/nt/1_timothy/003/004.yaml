  text: τοῦ ἰδίου οἴκου καλῶς προϊστάμενον, τέκνα ἔχοντα ἐν ὑποταγῇ μετὰ πάσης σεμνότητος·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: pt
  text: que dirija bem a própria casa[a], tendo os filhos em submissão[b], com toda a dignidade[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governe bem a própria casa” ou “esteja bem à frente da própria família”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tendo filhos submissos” ou “mantendo os filhos sob controle”.
    reason: lexical_alternative
  - marker: c
    text: A expressão “com toda a dignidade” pode descrever a maneira da submissão dos filhos ou, de modo mais amplo, a maneira como ele dirige a casa.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: a própria casa
  rationale: οἶκος pode indicar tanto a casa quanto a família ou o conjunto doméstico. Em português, “a própria casa” preserva essa amplitude e a força possessiva de ἰδίου, sem limitar a referência ao edifício.
- source_word: καλῶς
  choice: bem
  rationale: O advérbio expressa a maneira adequada e competente de exercer a direção; “bem” é direto, natural e semanticamente amplo.
- source_word: προϊστάμενον
  choice: que dirija
  rationale: Neste contexto, προΐστημι indica estar à frente e exercer supervisão responsável. “Dirija” comunica liderança e autoridade reais sem a dureza que “governe” ou “domine” poderia sugerir.
- source_word: τέκνα ἔχοντα
  choice: mantendo os filhos
  rationale: A construção participial descreve uma expressão concreta da boa direção da casa. “Mantendo os filhos” produz uma formulação portuguesa natural e conserva a ideia de uma condição doméstica sob sua responsabilidade.
- source_word: ἐν ὑποταγῇ
  choice: em submissão
  rationale: A expressão nominal preserva o sentido de ordem e sujeição presente em ὑποταγή, sem reduzi-lo apenas a obediência pontual ou a controle externo.
- source_word: μετὰ πάσης σεμνότητος
  choice: com toda a dignidade
  rationale: σεμνότης abrange dignidade, seriedade e conduta respeitável. A formulação é direta e mantém aberta a ligação sintática da expressão com a submissão dos filhos ou com a direção da casa em sentido mais amplo.
theological_decisions:
- issue: Alcance da linguagem de liderança doméstica
  choice: O texto descreve a direção responsável da própria casa como qualificação do candidato à supervisão da igreja.
  alternative: Entender a frase como afirmação geral de domínio patriarcal ou, no extremo oposto, enfraquecer a autoridade para significar apenas cuidado.
  rationale: προΐστημι e ὑποταγή comunicam autoridade e ordem reais, mas o versículo apresenta uma qualificação ministerial específica, não uma exposição completa sobre toda forma de autoridade familiar.
- issue: Referente de “com toda a dignidade”
  choice: Preservar a expressão sem determinar no texto principal se ela caracteriza sobretudo a submissão dos filhos ou toda a maneira de dirigir a casa.
  alternative: Ligá-la exclusivamente à conduta dos filhos ou exclusivamente à conduta do responsável pela casa.
  rationale: A estrutura grega permite mais de uma ligação sintática plausível. A tradução conserva essa ambiguidade genuína, e a nota a torna explícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Dirija” evita tanto um tom arcaico quanto o enfraquecimento da autoridade indicada no grego. A ordem das frases e a pontuação conservam a concisão do original e não resolvem indevidamente a ambiguidade de μετὰ πάσης σεμνότητος.
