  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: pt
  text: Além disso, é necessário que ele tenha bom testemunho dos de fora[a], para não cair em desonra[b] e na armadilha do diabo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que estão de fora”. A expressão se refere às pessoas que não pertencem à comunidade cristã.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “descrédito”, “censura pública”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “na armadilha do caluniador”, caso διάβολος seja entendido em sentido genérico; aqui, a palavra é entendida como referência ao diabo.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: Além disso, é necessário
  rationale: Expressa a ligação aditiva com as qualificações anteriores e preserva a força de necessidade de δεῖ em português natural e digno.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: tenha bom testemunho
  rationale: Mantém de perto a linguagem de testemunho ou atestação favorável, sem reduzir o sentido apenas à ideia mais interpretativa de reputação.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: dos de fora
  rationale: Reproduz de modo conciso a expressão que designa pessoas externas à comunidade cristã, sem inserir explicitamente 'igreja' no texto.
- source_word: ἵνα μὴ
  choice: para não
  rationale: Comunica com clareza a finalidade ou consequência evitada, sem a rigidez de uma construção excessivamente literal.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: cair em desonra
  rationale: Preserva a metáfora de cair e comunica a dimensão pública de vergonha, censura ou descrédito associada a ὀνειδισμός.
- source_word: παγίδα
  choice: armadilha
  rationale: É a equivalência moderna e imediatamente compreensível para a imagem de uma cilada ou laço.
- source_word: τοῦ διαβόλου
  choice: do diabo
  rationale: O uso neotestamentário e o artigo favorecem a referência pessoal ao diabo; a construção com 'de' reflete naturalmente o genitivo grego.
theological_decisions:
- issue: Sentido de τοῦ διαβόλου
  choice: 'referência pessoal ao diabo: ''armadilha do diabo'''
  alternative: '''armadilha do caluniador'' ou uma armadilha ligada à calúnia'
  rationale: Embora διάβολος possa significar genericamente 'caluniador', seu uso nas Cartas Pastorais e no restante do Novo Testamento favorece aqui o diabo como ser pessoal. A nota preserva a alternativa lexical sem impô-la ao texto principal.
- issue: Relação entre ὀνειδισμός e παγίς
  choice: 'dois perigos coordenados: desonra e armadilha'
  alternative: entender a desonra como a própria armadilha do diabo
  rationale: A conjunção καί coordena os termos, mas o texto não explica plenamente a relação lógica entre eles; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Além disso' liga naturalmente o versículo à lista anterior; 'bom testemunho' preserva a formulação do grego, e as notas esclarecem expressões potencialmente menos transparentes sem sobrecarregar o texto.
