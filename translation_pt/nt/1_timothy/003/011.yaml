source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: pt
  text: Do mesmo modo, as mulheres[a] devem ser dignas, não caluniadoras, sóbrias e fiéis em tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as esposas”. Neste contexto, o grego γυναῖκας pode significar tanto “mulheres” como “esposas”; o texto não diz explicitamente “as esposas deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: as mulheres
  rationale: γυνή pode significar «mulher» ou «esposa». A opção principal evita acrescentar um possessivo ausente no grego, enquanto a leitura «as esposas» é preservada em nota.
- source_word: ὡσαύτως
  choice: Do mesmo modo
  rationale: Expressa com naturalidade o paralelo estrutural entre este grupo e as qualificações anteriores.
- source_word: σεμνάς
  choice: dignas
  rationale: Comunica seriedade moral, honra e respeitabilidade em linguagem corrente e elevada.
- source_word: μὴ διαβόλους
  choice: não caluniadoras
  rationale: Aqui διάβολος descreve pessoas que acusam ou difamam, não é o título próprio «Diabo».
- source_word: νηφαλίους
  choice: sóbrias
  rationale: Preserva tanto a ideia de sobriedade quanto a de lucidez, moderação e domínio de si.
- source_word: πιστὰς ἐν πᾶσιν
  choice: fiéis em tudo
  rationale: Mantém a amplitude da expressão grega e permite os matizes de fidelidade e confiabilidade.
theological_decisions:
- issue: Referente de γυναῖκας na lista de qualificações
  choice: as mulheres
  alternative: as esposas
  rationale: O grego permite ambas as leituras e não traz um possessivo equivalente a «deles». O texto principal permanece amplo, e a nota conserva a alternativa contextual sem decidir se se trata de mulheres em função ministerial ou das esposas dos diáconos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Devem ser» explicita em português a força normativa recebida do contexto imediato, sem alterar a lista de qualificações.
