review_pass:
  verdict: revise
  source_fidelity: A sequência πρῶτον... εἶτα é bem preservada, e «que sirvam» traduz diretamente διακονείτωσαν sem introduzir «diáconos» no texto. Contudo, «se forem» converte o particípio presente ὄντες em uma condição explícita e pode sugerir que a irrepreensibilidade seja apenas um pré-requisito anterior, em vez da qualificação que acompanha o serviço. «Sendo» preserva melhor a forma e a relação sintática do grego. «Postos à prova» comunica de modo mais preciso o sentido examinador de δοκιμαζέσθωσαν do que «avaliados».
  naturalness: «Estes também» tem ordem mais corrente que «Também estes». «Sejam primeiro postos à prova; depois, que sirvam, sendo irrepreensíveis» é português moderno, claro e suficientemente solene para o registro da epístola.
  terminology: «Irrepreensíveis» é uma boa equivalência para ἀνέγκλητοι e não implica, por si, perfeição sem pecado. A nota sobre «servir como diáconos» mantém adequadamente a possibilidade contextual sem a impor ao texto traduzido.
  issues:
  - severity: medium
    issue: «se forem» explicita uma relação condicional não marcada pelo particípio ὄντες.
    rationale: O grego usa o particípio presente «sendo», ligado à ação de servir. A formulação condicional estreita e temporaliza a relação qualificadora; «sendo» conserva melhor a ambiguidade sintática e o aspecto durativo.
  - severity: low
    issue: «avaliados» é menos específico que δοκιμαζέσθωσαν.
    rationale: No contexto, o verbo indica provar ou examinar para verificar a idoneidade. «Postos à prova» mantém esse valor sem recorrer a jargão técnico.
