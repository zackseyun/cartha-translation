  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: pt
  text: Estes também sejam primeiro postos à prova; depois, que sirvam, sendo irrepreensíveis[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que sirvam como diáconos”. O verbo grego significa “servir”; neste contexto, pode referir-se especificamente ao exercício da função de diácono.
    reason: lexical_alternative
  - marker: b
    text: Isto é, sem que haja contra eles uma acusação válida; não significa que sejam absolutamente sem pecado.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὗτοι
  choice: estes
  rationale: Mantém o demonstrativo masculino plural, cujo referente é identificado pelo contexto, sem acrescentar “homens” ao texto.
- source_word: καὶ ... δὲ
  choice: também
  rationale: Expressa a relação aditiva com o grupo anteriormente mencionado; em português, não é necessário representar δὲ separadamente.
- source_word: δοκιμαζέσθωσαν
  choice: sejam ... avaliados
  rationale: Comunica o exame destinado a verificar aptidão ou genuinidade, preservando a força imperativa do grego.
- source_word: πρῶτον ... εἶτα
  choice: primeiro ... depois
  rationale: 'Conserva claramente a sequência: a avaliação deve preceder o serviço.'
- source_word: διακονείτωσαν
  choice: que sirvam
  rationale: Traduz diretamente o verbo “servir” sem inserir no texto principal o substantivo “diáconos”, que não aparece nesta oração; o contexto pode conferir sentido ligado ao ofício.
- source_word: ἀνέγκλητοι
  choice: irrepreensíveis
  rationale: Indica pessoas contra as quais não há acusação válida, sem sugerir perfeição sem pecado.
- source_word: ὄντες
  choice: se forem
  rationale: 'Apresenta de modo natural em português a circunstância qualificadora do particípio: eles devem servir na condição de serem irrepreensíveis.'
theological_decisions:
- issue: Sentido genérico ou ligado ao ofício em διακονείτωσαν
  choice: que sirvam
  alternative: que sirvam como diáconos
  rationale: O contexto trata dos diáconos, mas o verbo desta oração significa literalmente “servir”. A tradução principal preserva essa forma verbal e a nota registra a explicitação contextual possível.
- issue: Alcance moral de ἀνέγκλητοι
  choice: irrepreensíveis
  alternative: sem culpa
  rationale: A expressão aponta para a ausência de acusação válida no contexto da qualificação, não para impecabilidade absoluta.
- issue: Relação do particípio ὄντες com o imperativo
  choice: 'condição: “se forem”'
  alternative: 'circunstância concomitante: “sendo”'
  rationale: No contexto de avaliação e qualificação, a formulação condicional é natural e explicita que apenas os considerados irrepreensíveis devem servir, sem alterar o requisito expresso pelo particípio.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Avaliados” evita o tom acadêmico de “examinados”, e a construção “se forem irrepreensíveis” torna natural a função qualificadora do particípio grego.
