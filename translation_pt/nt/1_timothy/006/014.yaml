id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: pt
  text: que você cumpra o mandamento sem mancha e irrepreensível até a manifestação de nosso Senhor Jesus, o Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou apresentado na forma tradicional, mais próxima de um nome, “Cristo”.'
    reason: alternative_reading
  - marker: b
    text: As expressões “sem mancha” e “irrepreensível” podem descrever o próprio mandamento ou Timóteo ao cumpri-lo; a construção grega é compacta e permite essa tensão.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: cumpra
  rationale: O infinitivo depende da exortação do versículo anterior e indica observância fiel. “Cumpra” é natural em português e comunica obediência contínua sem reduzir o sentido à mera preservação defensiva.
- source_word: τὴν ἐντολήν
  choice: o mandamento
  rationale: Mantém o peso moral do substantivo definido singular e sua provável referência à incumbência apostólica dada a Timóteo.
- source_word: ἄσπιλον
  choice: sem mancha
  rationale: Expressa de modo claro e digno a ideia de estar livre de mancha ou mácula, preservando a construção compacta do grego.
- source_word: ἀνεπίλημπτον
  choice: irrepreensível
  rationale: Indica aquilo ou aquele contra o qual não há acusação legítima. O termo é corrente no registro bíblico moderno e concorda, como no grego, tanto com “mandamento” quanto com o destinatário masculino.
- source_word: μέχρι τῆς ἐπιφανείας
  choice: até a manifestação
  rationale: “Até” marca a duração até um acontecimento futuro; “manifestação” comunica o aparecimento público e visível de Cristo sem acrescentar explicitamente a ideia de “segunda” vinda.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de nosso Senhor
  rationale: Preserva a construção possessiva e o título cristológico κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui força titular no contexto escatológico. Em português, o artigo e a vírgula tornam natural e inteligível o título traduzido.
theological_decisions:
- issue: Relação de ἄσπιλον e ἀνεπίλημπτον com “mandamento” ou com Timóteo em seu cumprimento
  choice: 'Construção compacta: “cumpra o mandamento sem mancha e irrepreensível”'
  alternative: “cumpra o mandamento, mantendo-se sem mancha e irrepreensível”
  rationale: Os adjetivos estão no acusativo masculino singular e formalmente concordam com ἐντολήν, mas a expressão pode caracterizar o cumprimento por Timóteo. Como “mandamento” e o destinatário também são masculinos em português, a formulação escolhida conserva parte da ambiguidade sem inserir palavras explicativas.
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: No contexto solene da futura manifestação, o valor de título permanece perceptível. “Messias” torna explícito o sentido do grego, enquanto a forma tradicional “Cristo” é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Você” evita uma forma regional ou arcaizante, enquanto “mandamento”, “irrepreensível” e “manifestação” preservam o peso formal do texto. A pontuação em “Jesus, o Messias” apresenta Χριστός como título traduzido.
