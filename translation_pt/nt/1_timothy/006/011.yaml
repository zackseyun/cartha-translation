id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: pt
  text: Você, porém, homem de Deus, fuja dessas coisas; mas busque a justiça[a], a devoção, a fé[b], o amor, a perseverança e a mansidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fidelidade” ou “confiança”.
    reason: lexical_alternative
  - marker: c
    text: O raro termo grego também pode ser traduzido como “gentileza”, “tolerância” ou “mansidão paciente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Você, porém
  rationale: Preserva a ênfase no pronome e o forte contraste com o que foi dito anteriormente, em português atual e natural.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: homem de Deus
  rationale: Mantém a forma bíblica de tratamento e o masculino singular dirigido especificamente a Timóteo; a interjeição ὦ não precisa ser reproduzida para que o chamado soe natural em português.
- source_word: ταῦτα
  choice: dessas coisas
  rationale: Retoma os erros e vícios mencionados no contexto anterior.
- source_word: φεῦγε
  choice: fuja
  rationale: Conserva a urgência do imperativo e é mais forte do que simplesmente 'evite'.
- source_word: δίωκε δὲ
  choice: mas busque
  rationale: Expressa a ação deliberada e contínua de ir atrás dessas virtudes, mantendo o contraste com 'fuja'.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Em português, 'justiça' abrange de modo natural a conduta moralmente reta e as relações justas; 'retidão' continua sendo uma alternativa legítima.
- source_word: εὐσέβειαν
  choice: devoção
  rationale: Comunica uma vida reverente e orientada para Deus sem recorrer a uma formulação excessivamente técnica.
- source_word: πίστιν
  choice: fé
  rationale: É o equivalente principal e mais reconhecível; neste catálogo de virtudes, 'fidelidade' e 'confiança' também permanecem semanticamente possíveis.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente claro, corrente e adequado ao catálogo de virtudes.
- source_word: ὑπομονήν
  choice: perseverança
  rationale: Expressa constância duradoura diante de pressão ou dificuldade, evitando o sentido potencialmente mais passivo de 'paciência'.
- source_word: πραϋπαθίαν
  choice: mansidão
  rationale: O termo grego raro sugere brandura acompanhada de domínio paciente; 'mansidão' preserva melhor essa qualidade moral do que uma simples referência à delicadeza.
theological_decisions:
- issue: Forma masculina em ὦ ἄνθρωπε θεοῦ
  choice: homem de Deus
  alternative: pessoa de Deus
  rationale: A expressão está no masculino singular e se dirige diretamente a Timóteo; mantê-la evita neutralizar uma referência específica.
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: Neste catálogo de virtudes, o termo pode descrever tanto uma conduta reta quanto relações justas. A alternativa é preservada em nota, sem restringir indevidamente o sentido.
- issue: Sentido de πίστις no catálogo de virtudes
  choice: fé
  alternative: fidelidade ou confiança
  rationale: Embora 'fé' seja a tradução principal, o contexto permite entender a palavra também como confiabilidade ou confiança; a nota conserva essa tensão.
- issue: Sentido do raro πραϋπαθία
  choice: mansidão
  alternative: gentileza, tolerância ou mansidão paciente
  rationale: Como o termo reúne brandura e paciência contida, nenhuma palavra portuguesa reproduz sozinha toda a nuance; as alternativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'Você, porém' marca o contraste inicial, enquanto 'mas busque' mantém a oposição entre fugir do mal e procurar ativamente as virtudes. Os artigos antes dos substantivos dão naturalidade ao catálogo em português.
