id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: pt
  text: Mas os que querem ser ricos[a] caem em tentação, em uma armadilha[b] e em muitos desejos insensatos e nocivos, que afundam as pessoas[c] na ruína e na destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enriquecer”. O grego pode referir-se ao desejo de ser rico ou de tornar-se rico.
    reason: lexical_alternative
  - marker: b
    text: Ou “em um laço”.
    reason: lexical_alternative
  - marker: c
    text: O termo grego traduzido por “pessoas” designa aqui os seres humanos em geral, não apenas os homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Mas os que querem
  rationale: Expressa um desejo ou propósito estabelecido com uma construção natural em português, preservando o contraste introduzido por δέ.
- source_word: πλουτεῖν
  choice: enriquecer
  rationale: O infinitivo pode indicar ser ou tornar-se rico; neste contexto, “enriquecer” comunica com clareza a aspiração à riqueza sem condenar por si só a mera posse de bens.
- source_word: ἐμπίπτουσιν
  choice: caem em
  rationale: Preserva a metáfora de entrar numa condição perigosa e corresponde ao uso corrente em português.
- source_word: πειρασμόν
  choice: tentação
  rationale: No contexto de advertência moral, indica incitamento ao mal, mais provavelmente que uma prova neutra.
- source_word: παγίδα
  choice: armadilha
  rationale: Termo moderno e claro que mantém a imagem de algo que captura a pessoa.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: muitos desejos insensatos e nocivos
  rationale: “Desejos” mantém a amplitude de ἐπιθυμίαι; “insensatos” exprime a falta de entendimento de ἀνοήτους, e “nocivos” comunica o dano causado por βλαβεράς.
- source_word: αἵτινες
  choice: que
  rationale: Retoma naturalmente os desejos e introduz seu efeito característico.
- source_word: βυθίζουσι
  choice: afundam
  rationale: Conserva a imagem vívida de fazer submergir, sem reduzir o verbo a uma ideia genérica de causar.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: ἄνθρωποι é genérico neste contexto e abrange seres humanos, não apenas homens do sexo masculino.
- source_word: ὄλεθρον
  choice: ruína
  rationale: Comunica devastação e mantém distinção lexical em relação ao substantivo seguinte.
- source_word: ἀπώλειαν
  choice: destruição
  rationale: Expressa a gravidade de ἀπώλεια sem definir além do texto se a referência é especificamente à condenação eterna.
theological_decisions:
- issue: Se ὄλεθρον καὶ ἀπώλειαν deve ser traduzido de modo a indicar especificamente condenação eterna
  choice: ruína e destruição
  alternative: ruína e perdição
  rationale: Os termos descrevem consequências devastadoras, mas o versículo não exige que a tradução determine seu alcance como condenação eterna. A formulação escolhida preserva a gravidade e a tensão teológica do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Armadilha” foi preferido a “laço” no texto principal por ser mais corrente; “afundam” preserva a metáfora concreta do grego. Os marcadores seguem a ordem em que aparecem no texto.
