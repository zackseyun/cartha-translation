id: 1TI.6.6
reference: 1 Timothy 6:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: pt
  text: Mas a devoção a Deus com contentamento é grande ganho[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande lucro” ou “um grande meio de ganho”. O termo grego está relacionado a ganho ou lucro e retoma a ideia do versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “autossuficiência”. Aqui, o sentido provável é contentamento ou suficiência, não independência baseada apenas em si mesmo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Expressa a leve contraposição ao versículo anterior, em que se fala de pessoas que tratam a devoção a Deus como fonte de lucro.
- source_word: πορισμὸς
  choice: ganho
  rationale: Preserva a ideia de ganho ou lucro e mantém a ligação verbal com o versículo anterior, sem limitar o sentido à riqueza material.
- source_word: μέγας
  choice: grande
  rationale: Equivalente direto e natural, que conserva a ênfase da afirmação.
- source_word: εὐσέβεια
  choice: devoção a Deus
  rationale: Comunica de modo claro e atual uma vida reverente orientada para Deus; evita que “piedade” seja entendida apenas como compaixão ou prática religiosa exterior.
- source_word: μετὰ
  choice: com
  rationale: Traduz de maneira simples a ideia de associação ou acompanhamento.
- source_word: αὐταρκείας
  choice: contentamento
  rationale: O contexto dos versículos seguintes aponta para estar satisfeito com o necessário. A opção evita sugerir independência autônoma em relação a Deus.
theological_decisions:
- issue: Sentido de αὐτάρκεια no contexto cristão
  choice: contentamento
  alternative: autossuficiência; suficiência
  rationale: Os versículos 7–8 explicam a ideia em termos de satisfação com alimento e roupa, e não de autonomia estoica. A nota preserva a amplitude lexical.
- issue: Relação entre devoção a Deus e ganho
  choice: A devoção a Deus com contentamento é, ela própria, grande ganho
  alternative: A devoção a Deus, quando acompanhada de contentamento, é um grande meio de obter ganho
  rationale: A formulação preserva a construção predicativa e o contraste irônico com o versículo anterior, sem apresentar a religião como instrumento utilitário, embora a nota registre a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Devoção a Deus” torna explícita a orientação religiosa de εὐσέβεια; “grande ganho” conserva a concisão e o jogo vocabular do contexto.
