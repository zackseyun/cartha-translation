  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: pt
  text: a qual ele mostrará em seus próprios tempos — o bem-aventurado e único Soberano, o Rei dos que reinam e Senhor dos que governam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução tradicional: “o Rei dos reis e Senhor dos senhores”. O grego emprega particípios, literalmente, “o Rei dos que reinam e Senhor dos que exercem domínio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: a qual
  rationale: Pronome relativo feminino singular, retomando ἐπιφάνειαν (“manifestação”) no versículo anterior.
- source_word: καιροῖς ἰδίοις
  choice: nos tempos por ele determinados
  rationale: Conserva o plural de καιροῖς e comunica naturalmente que se trata dos tempos próprios ou designados pelo sujeito.
- source_word: δείξει
  choice: mostrará
  rationale: Traduz diretamente o futuro de δείκνυμι, com o sentido de tornar visível ou manifesto.
- source_word: ὁ μακάριος καὶ μόνος δυνάστης
  choice: o bendito e único Soberano
  rationale: “Bendito” mantém o caráter titular de μακάριος, e “Soberano” expressa de modo atual a autoridade governante de δυνάστης.
- source_word: ὁ βασιλεὺς τῶν βασιλευόντων
  choice: o Rei dos que reinam
  rationale: Preserva a força verbal do particípio βασιλευόντων, em vez de assimilá-lo ao substantivo “reis”.
- source_word: κύριος τῶν κυριευόντων
  choice: Senhor dos que governam
  rationale: Mantém “Senhor” como título e verte o particípio κυριευόντων por uma expressão verbal natural em português.
theological_decisions:
- issue: Identidade daquele que mostrará a manifestação
  choice: Manter o sujeito pronominal e deixar que os títulos do próprio versículo o caracterizem.
  alternative: Explicitar que Deus Pai mostrará a manifestação de Jesus Cristo.
  rationale: O grego não fornece aqui um nome próprio para o sujeito; explicitá-lo resolveria uma relação que o texto apresenta de forma contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção “nos tempos por ele determinados” evita a ambiguidade pouco natural de “nos seus próprios tempos”, sem reduzir o plural grego ao singular. O travessão preserva o caráter solene e a sequência de títulos.
