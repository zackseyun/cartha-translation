  source_fidelity: A oração relativa e a cadeia de títulos são bem representadas. Contudo, «nos tempos por ele determinados» explicita que os tempos foram determinados pelo sujeito, enquanto ἰδίοις significa mais diretamente «seus próprios»; a formulação mais literal preserva melhor a expressão sem desenvolver essa inferência.
  naturalness: O texto é claro e solene. «Em seus próprios tempos» é uma expressão portuguesa natural neste registro e mantém o plural do grego. «Bem-aventurado» é a designação mais estabelecida e precisa para μακάριος como título divino neste contexto.
  terminology: «Soberano», «Rei», «Senhor» e as paráfrases participiais «dos que reinam» e «dos que governam» são adequados. A nota preserva corretamente tanto a forma participial grega quanto a tradução tradicional.
  issues:
  - severity: medium
    issue: «nos tempos por ele determinados» desenvolve o sentido de ἰδίοις.
    rationale: O grego diz literalmente «em seus próprios tempos». Embora os tempos possam ser entendidos como estabelecidos por ele no contexto, «por ele determinados» torna explícita uma relação que o adjetivo possessivo não declara por si só.
  - severity: low
    issue: «bendito» é menos preciso para μακάριος neste título.
    rationale: Em português, «bendito» pode sugerir principalmente alguém que recebe louvor ou bênção. «Bem-aventurado» é a equivalência bíblica consolidada para μακάριος e conserva melhor a força titular.
