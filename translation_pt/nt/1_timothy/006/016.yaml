id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: pt
  text: o único que possui imortalidade, que habita em luz inacessível, a quem nenhum ser humano[a] viu nem pode ver. A ele sejam a honra e o domínio eterno[b]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém dentre os seres humanos”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem que esta descrição e esta doxologia se referem mais diretamente ao Senhor Jesus Cristo no contexto mais amplo; contudo, a linguagem sobre aquele que nenhum ser humano viu nem pode ver aponta mais naturalmente para Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: único
  rationale: 'Expressa com naturalidade a exclusividade indicada pelo grego: somente ele possui, de modo inerente, a imortalidade mencionada.'
- source_word: ἔχων ἀθανασίαν
  choice: que possui imortalidade
  rationale: Mantém a construção participial e a ideia de posse. “Possui” soa mais deliberado e digno que o simples “tem”, sem acrescentar conteúdo ao grego.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: que habita em luz inacessível
  rationale: Reproduz a imagem de residir em uma luz à qual não se pode chegar. “Inacessível” é claro em português moderno e preserva o sentido de ἀπρόσιτον.
- source_word: οὐδεὶς ἀνθρώπων
  choice: nenhum ser humano
  rationale: Comunica de forma natural o genitivo partitivo e o valor representativo de ἀνθρώπων, abrangendo toda a humanidade sem sugerir apenas pessoas do sexo masculino.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: nem pode ver
  rationale: Preserva tanto a negação coordenada quanto a incapacidade expressa por δύναται, em formulação idiomática e concisa.
- source_word: τιμὴ
  choice: a honra
  rationale: É a correspondência doxológica corrente; o verbo subentendido no grego é expresso naturalmente em português por “sejam”.
- source_word: κράτος αἰώνιον
  choice: o domínio eterno
  rationale: Em contexto doxológico, κράτος denota poder soberano ou domínio efetivo, não apenas força abstrata. “Domínio eterno” mantém esse valor.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a transliteração consagrada no uso bíblico e litúrgico em português.
theological_decisions:
- issue: Referente das orações relativas e da doxologia
  choice: O versículo continua descrevendo Deus, o bendito e único Soberano do contexto anterior, e dirige a doxologia a ele.
  alternative: Alguns relacionam a descrição mais diretamente ao Senhor Jesus Cristo, tendo em vista o contexto mais amplo e o antecedente próximo.
  rationale: A progressão sintática de 1 Timóteo 6:15–16 e, sobretudo, a afirmação de que ninguém o viu nem pode vê-lo apontam mais naturalmente para Deus. A nota preserva a alternativa contextual sem eliminar a tensão do texto.
- issue: Alcance de ἀνθρώπων
  choice: “nenhum ser humano” no texto principal
  alternative: “ninguém dentre os seres humanos”
  rationale: O substantivo grego tem aqui sentido representativo e inclui a humanidade inteira. A formulação escolhida é precisa, atual e inequívoca em português.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e o encadeamento das orações acompanham de perto o grego, enquanto “nenhum ser humano” e “nem pode ver” evitam construções artificiais. O início em minúscula preserva a continuidade sintática do versículo com o contexto precedente.
