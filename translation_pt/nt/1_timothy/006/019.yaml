  source_fidelity: 'O texto traduz com precisão os elementos do grego: o particípio ἀποθησαυρίζοντας é adequadamente mantido por “acumulando”; ἑαυτοῖς, por “para si mesmos”; θεμέλιον καλόν, por “um bom fundamento”; e εἰς τὸ μέλλον, sem especificação escatológica indevida, por “para o futuro”. A oração final conserva tanto a finalidade de ἵνα quanto a imagem de ἐπιλάβωνται. “Da vida que é verdadeiramente vida” representa de modo fiel a ênfase de τῆς ὄντως ζωῆς.'
