id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: pt
  text: acumulando para si mesmos um bom fundamento para o futuro, a fim de se apoderarem da vida que é verdadeiramente vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: acumulando
  rationale: O particípio presente dá continuidade à exortação do versículo anterior. “Acumulando” comunica a ideia de guardar como tesouro sem recorrer a uma formulação arcaica.
- source_word: ἑαυτοῖς
  choice: para si mesmos
  rationale: O pronome reflexivo no dativo indica benefício ou vantagem para os próprios sujeitos.
- source_word: θεμέλιον καλὸν
  choice: um bom fundamento
  rationale: Preserva a metáfora de construção de θεμέλιον e traduz καλόν de modo claro e natural como algo bom ou sólido.
- source_word: εἰς τὸ μέλλον
  choice: para o futuro
  rationale: Expressa de maneira concisa aquilo que está por vir, mantendo a ressonância escatológica sem explicitar “era”, termo ausente do grego.
- source_word: ἵνα
  choice: a fim de
  rationale: Introduz naturalmente a finalidade da ação anterior em português corrente e digno.
- source_word: ἐπιλάβωνται
  choice: se apoderarem de
  rationale: Preserva a imagem vigorosa de agarrar ou tomar posse, expressa pelo aoristo subjuntivo médio de ἐπιλαμβάνομαι.
- source_word: τῆς ὄντως ζωῆς
  choice: da vida que é verdadeiramente vida
  rationale: Mantém explicitamente o substantivo ζωή e o destaque qualitativo de ὄντως, contrastando a vida genuína com a segurança aparente das riquezas.
theological_decisions:
- issue: Se εἰς τὸ μέλλον deve receber uma tradução especificamente escatológica
  choice: para o futuro
  alternative: para a era futura
  rationale: O contexto aponta para realidades eternas, mas a expressão grega é mais ampla e não contém explicitamente o termo “era”.
- issue: Como exprimir τῆς ὄντως ζωῆς
  choice: da vida que é verdadeiramente vida
  alternative: da verdadeira vida
  rationale: A formulação escolhida preserva a repetição enfática e a tensão qualitativa do grego, sem reduzir a expressão a uma qualificação potencialmente mais plana.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura participial foi mantida porque o versículo continua sintaticamente a exortação anterior. Não se acrescentou nota, pois a tradução principal já representa diretamente a ênfase de ὄντως ζωῆς.
