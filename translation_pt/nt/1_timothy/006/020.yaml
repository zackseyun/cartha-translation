id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: pt
  text: Ó Timóteo, guarde o depósito que lhe foi confiado, afastando-se das conversas vazias e profanas e das contradições[a] daquilo que falsamente se chama conhecimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oposições”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do chamado conhecimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Ó Timóteo
  rationale: Preserva a solenidade e a força retórica da partícula vocativa Ὦ em português natural e digno.
- source_word: παραθήκην
  choice: o depósito que lhe foi confiado
  rationale: Mantém a metáfora de algo entregue para custódia e explicita naturalmente o sentido inerente ao substantivo, sem definir o conteúdo do depósito.
- source_word: φύλαξον
  choice: guarde
  rationale: Expressa a preservação vigilante de algo confiado, com formulação corrente em português.
- source_word: ἐκτρεπόμενος
  choice: afastando-se
  rationale: Conserva a imagem verbal de desviar-se ou manter-se longe, ligando adequadamente o particípio à ordem principal.
- source_word: βεβήλους κενοφωνίας
  choice: conversas vazias e profanas
  rationale: Comunica fala sem conteúdo e alheia ao que é santo; a ordem dos adjetivos soa natural em português sem perder os dois aspectos do grego.
- source_word: ἀντιθέσεις
  choice: contradições
  rationale: Representa afirmações contrapostas no contexto polêmico; a alternativa lexical 'oposições' é preservada em nota.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: daquilo que falsamente se chama conhecimento
  rationale: Torna explícito que o autor contesta a legitimidade do nome 'conhecimento', preservando o valor de ψευδώνυμος.
theological_decisions:
- issue: Natureza de παραθήκη no contexto
  choice: o depósito que lhe foi confiado
  alternative: a mensagem do evangelho; o ensino apostólico; o encargo ministerial de Timóteo
  rationale: O texto fala de algo confiado a Timóteo para ser guardado, mas não identifica aqui seu conteúdo com precisão. A tradução conserva a metáfora e a amplitude do original.
- issue: Relação de τῆς ψευδωνύμου γνώσεως com ἀντιθέσεις
  choice: das contradições daquilo que falsamente se chama conhecimento
  alternative: das conversas vazias e das oposições associadas ao chamado conhecimento
  rationale: O genitivo liga mais diretamente 'conhecimento' a 'contradições/oposições', embora a construção admita alguma amplitude relacional. A formulação evita identificar historicamente esse conhecimento com um sistema posterior específico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O vocativo 'Ó Timóteo' mantém a solenidade; 'depósito' preserva a metáfora histórica, esclarecida pela oração relativa. A pontuação e a coordenação foram ajustadas à fluidez portuguesa sem eliminar ambiguidades relevantes.
