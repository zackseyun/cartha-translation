  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: pt
  text: E os que têm senhores crentes não os desprezem por serem irmãos[a]; pelo contrário, sirvam-nos ainda mais, pois aqueles que recebem o benefício são crentes e amados[b]. Ensine estas coisas e exorte a respeito delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; em grego, “irmãos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “aqueles que recebem o benefício” é difícil. Provavelmente se refere aos senhores crentes como beneficiários do serviço prestado pelas pessoas escravizadas.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: crentes
  rationale: No contexto, caracteriza os senhores como pessoas que creem em Cristo, não apenas como confiáveis ou fiéis.
- source_word: δεσπότας
  choice: senhores
  rationale: No contexto doméstico de escravidão, designa os que detêm autoridade e domínio sobre pessoas escravizadas. “Senhores” é a equivalência portuguesa mais natural, sem ocultar a relação social indicada pelo contexto.
- source_word: καταφρονείτωσαν
  choice: não os desprezem
  rationale: Expressa desprezo ou tratamento com desdém e conserva a força da proibição.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego e a relação familiar entre os que creem em Cristo; a possibilidade inclusiva é indicada em nota.
- source_word: μᾶλλον δουλευέτωσαν
  choice: sirvam-nos ainda mais
  rationale: δουλεύω descreve o serviço prestado em condição de escravidão. “Sirvam-nos” é natural em português, enquanto “ainda mais” preserva μᾶλλον.
- source_word: πιστοί
  choice: crentes
  rationale: Refere-se a pessoas que creem em Cristo, em paralelo com πιστούς no início do versículo.
- source_word: ἀγαπητοὶ
  choice: amados
  rationale: Mantém o sentido afetivo e comunitário do termo sem acrescentar um agente não expresso.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: aqueles que recebem o benefício
  rationale: A expressão grega é compacta e de interpretação difícil. Esta formulação conserva sua relativa abertura sem inserir “serviço” no texto principal.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Ensine e exorte estas coisas
  rationale: Reproduz os dois imperativos dirigidos a Timóteo; “exorte” expressa adequadamente a força de παρακάλει neste contexto.
theological_decisions:
- issue: Sentido de ἀδελφοί no contexto da comunidade cristã
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução conserva o masculino plural do texto grego, sem excluir em nota o uso inclusivo frequente do termo no contexto cristão.
- issue: Terminologia social em contexto de escravidão
  choice: senhores ... sirvam-nos
  alternative: donos ... trabalhem como escravos para eles
  rationale: “Senhores” representa δεσπότας e “sirvam-nos” representa δουλεύω de modo idiomático. A combinação mantém visível a relação hierárquica sem introduzir no versículo o substantivo “escravos”, que não aparece nele.
- issue: Referente de οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: os senhores crentes são provavelmente os que recebem o benefício
  alternative: os escravizados crentes são os dedicados à boa obra, ou ambas as partes participam do benefício
  rationale: A leitura mais provável entende os senhores como beneficiários do serviço, mas a construção grega é difícil; por isso, o texto principal permanece relativamente aberto e a nota informa a interpretação provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “senhores crentes”, formulação natural e próxima do grego. Os imperativos no plural foram vertidos pelo presente do subjuntivo (“não os desprezem”, “sirvam-nos”), e os dirigidos a Timóteo pelo singular formal corrente (“Ensine e exorte”).
