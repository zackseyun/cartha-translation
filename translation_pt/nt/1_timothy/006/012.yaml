source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: pt
  text: Combata o bom combate da fé[a]; tome posse da vida eterna, para a qual você foi chamado, e fez a boa confissão diante de muitas testemunhas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Combata o bom combate de fé”. A expressão grega pode indicar tanto o combate caracterizado pela fé quanto o combate em favor da fé cristã.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e fez a boa confissão a respeito da vida eterna para a qual foi chamado”. O grego não declara expressamente o conteúdo da confissão, embora ela possa estar estreitamente ligada ao chamado para a vida eterna.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου
  choice: Combata
  rationale: O imperativo presente expressa empenho ativo e contínuo. “Combata” preserva a metáfora de luta e forma uma construção enfática com ἀγῶνα.
- source_word: τὸν καλὸν ἀγῶνα
  choice: o bom combate
  rationale: Preserva a construção cognata do grego e a avaliação de καλός como algo bom, nobre ou digno, em linguagem portuguesa reconhecível e natural.
- source_word: τῆς πίστεως
  choice: da fé
  rationale: Mantém a forma definida do grego e permite entender πίστις como a fé cristã, sem eliminar a possibilidade de se tratar do combate caracterizado pela fé.
- source_word: ἐπιλαβοῦ
  choice: tome posse
  rationale: O imperativo aoristo pede uma ação decidida de apropriação. “Tome posse” comunica de modo natural a imagem de agarrar firmemente aquilo para o qual Timóteo foi chamado.
- source_word: τῆς αἰωνίου ζωῆς
  choice: da vida eterna
  rationale: A expressão designa a vida escatológica específica para a qual Timóteo foi chamado; em português, o artigo aparece naturalmente na contração “da”.
- source_word: εἰς ἣν ἐκλήθης
  choice: para a qual você foi chamado
  rationale: “Para” preserva o sentido de alvo ou destino de εἰς, e a voz passiva mantém a referência implícita àquele que chama.
- source_word: ὡμολόγησας
  choice: fez
  rationale: Com ὁμολογίαν, “fez a ... confissão” é uma expressão idiomática em português e evita uma repetição artificial.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: a boa confissão
  rationale: “Confissão” expressa uma declaração ou reconhecimento público; “boa” preserva o paralelo avaliativo com “bom combate”.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: diante de muitas testemunhas
  rationale: Tradução direta e natural de presença pública; “testemunhas” conserva o sentido contextual de pessoas que presenciaram a confissão.
- source_word: καί
  choice: e a respeito da qual
  rationale: A redação principal torna explícita a ligação possível entre a vida eterna e a confissão, sugerida pela sequência sintática, sem definir o conteúdo exato dessa confissão. A leitura estritamente coordenada é preservada em nota.
theological_decisions:
- issue: Sentido de πίστεως em τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: 'sentido definido ou objetivo: “da fé”'
  alternative: 'sentido subjetivo ou caracterizador: “de fé”'
  rationale: O artigo e o uso de πίστις nas Cartas Pastorais favorecem uma referência à fé cristã, mas o genitivo também pode caracterizar o combate como conduzido pela fé. A nota preserva essa ambiguidade.
- issue: Relação da confissão com a vida eterna e o chamado
  choice: “a respeito da qual fez a boa confissão”
  alternative: 'leitura coordenada: “e fez a boa confissão diante de muitas testemunhas”'
  rationale: A sequência grega permite associar a confissão à vida eterna para a qual Timóteo foi chamado, mas não declara expressamente o conteúdo da confissão. A alternativa mais estritamente coordenada permanece na nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. O tratamento por “você” evita formas verbais arcaicas; “bom combate” e “boa confissão” preservam o paralelismo de καλός. As notas registram as duas ambiguidades relevantes sem impor uma interpretação denominacional.
