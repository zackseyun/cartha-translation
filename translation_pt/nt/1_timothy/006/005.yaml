  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: pt
  text: atritos constantes[a] entre pessoas de mente corrompida e privadas da verdade, que imaginam que a devoção a Deus é um meio de obter lucro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disputas constantes” ou “discussões intermináveis”. O termo grego retrata uma fricção contínua, como pessoas que se desgastam umas contra as outras.
    reason: lexical_alternative
  - marker: b
    text: Ou “que a devoção a Deus é lucro” ou “uma fonte de lucro”. A ideia é que tratam a devoção a Deus como algo a explorar em busca de vantagem material.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: atritos constantes
  rationale: O substantivo raro sugere fricção persistente ou conflitos contínuos. “Atritos constantes” conserva a imagem de pessoas que se desgastam umas contra as outras e soa natural em português.
- source_word: διεφθαρμένων ἀνθρώπων τὸν νοῦν
  choice: pessoas de mente corrompida
  rationale: O particípio perfeito descreve um estado resultante de corrupção, e o acusativo τὸν νοῦν especifica a esfera afetada. A formulação mantém tanto a dimensão intelectual quanto a moral sem intensificar o texto para “depravada”.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: privadas da verdade
  rationale: O particípio perfeito passivo indica que essas pessoas se encontram em estado de privação. “Privadas da verdade” é direto, conserva a voz passiva e mantém a referência definida à verdade.
- source_word: νομιζόντων
  choice: que imaginam
  rationale: O particípio apresenta a suposição equivocada dessas pessoas. “Imaginam” sinaliza o erro implícito no contexto sem acrescentar uma condenação ausente da forma lexical.
- source_word: πορισμὸν
  choice: um meio de obter lucro
  rationale: O substantivo pode designar ganho, lucro ou meio de adquiri-lo. Esta expressão comunica claramente o uso instrumental da devoção visando vantagem material.
- source_word: εὐσέβειαν
  choice: a devoção a Deus
  rationale: Nas Cartas Pastorais, o termo denota uma vida reverente orientada para Deus. “Devoção a Deus” é clara para leitores atuais e evita tanto a possível artificialidade de “piedade” quanto a redução a mera religiosidade externa.
theological_decisions:
- issue: Se εὐσέβεια deve sugerir devoção genuína ou apenas religião exterior
  choice: a devoção a Deus
  alternative: a religião; a piedade
  rationale: O termo grego é positivo; a crítica recai sobre quem transforma essa devoção em instrumento de lucro, não sobre a devoção em si.
- issue: A intensidade moral de διεφθαρμένων
  choice: de mente corrompida
  alternative: de mente depravada
  rationale: “Corrompida” preserva a forte avaliação moral e o estado resultante expresso pelo perfeito, sem importar uma formulação doutrinária mais carregada.
- issue: A natureza do ganho em πορισμός
  choice: um meio de obter lucro
  alternative: lucro; fonte de lucro
  rationale: A formulação expressa o caráter instrumental sugerido pelo contexto, enquanto a nota preserva a possibilidade de uma equivalência mais concisa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção permanece como fragmento coordenado ao contexto anterior do versículo, sem acrescentar elementos sintáticos ausentes do grego.
