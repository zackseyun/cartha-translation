id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: pt
  text: Ordene aos que são ricos na era presente[a] que não sejam arrogantes, nem ponham a esperança na incerteza das riquezas[b], mas em Deus, que nos dá ricamente tudo para desfrutarmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «neste mundo presente». A palavra grega pode significar «era» ou, por extensão, a ordem mundial presente; «era» preserva melhor o contraste temporal de Paulo.
    reason: lexical_alternative
  - marker: b
    text: Ou «nas riquezas incertas».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: aos que são ricos
  rationale: O artigo com o adjetivo no dativo funciona substantivamente. A formulação evita transformar as pessoas num rótulo e introduz com naturalidade o objeto indireto de «ordene».
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: na era presente
  rationale: «Era» preserva o sentido temporal e escatológico de αἰών, sem reduzi-lo ao mundo físico.
- source_word: παράγγελλε
  choice: Ordene
  rationale: O imperativo tem força de instrução autoritativa; «ordene» comunica essa força em português atual.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: que não sejam arrogantes
  rationale: Expressa de modo claro e idiomático a ideia de pensar de si mesmo com superioridade.
- source_word: μηδὲ ἠλπικέναι
  choice: nem ponham a esperança
  rationale: O perfeito infinitivo sugere uma esperança depositada ou firmada; «pôr a esperança» conserva essa ideia.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: na incerteza das riquezas
  rationale: Mantém a construção abstrata do grego e destaca a instabilidade inerente à riqueza, sem alterar o sentido para uma simples quantidade de bens.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: mas em Deus
  rationale: A repetição de ἐπί estabelece contraste entre os dois objetos da esperança; em português, «pôr a esperança em» é a construção natural.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: que nos dá
  rationale: O particípio caracteriza Deus como aquele que concede. «Dá» é simples, abrangente e natural para leitores comuns.
- source_word: πάντα
  choice: tudo
  rationale: Preserva a abrangência do neutro plural sem acrescentar uma limitação a necessidades básicas.
- source_word: πλουσίως
  choice: ricamente
  rationale: Além de indicar abundância, conserva a ligação verbal com «ricos» e «riquezas» presente no texto grego.
- source_word: εἰς ἀπόλαυσιν
  choice: para desfrutarmos
  rationale: Comunica a finalidade ou o resultado da provisão divina em português natural; a primeira pessoa do plural já está indicada por «nos».
theological_decisions:
- issue: Sentido de αἰών no contexto ético e escatológico
  choice: era
  alternative: mundo
  rationale: «Era» preserva o contraste temporal característico do uso paulino e evita identificar a riqueza apenas com o âmbito material.
- issue: Abrangência da provisão divina em πάντα
  choice: tudo
  alternative: tudo de que necessitamos
  rationale: O texto formula a provisão de maneira abrangente. A tradução não a restringe às necessidades, mas tampouco acrescenta qualquer promessa de prosperidade.
- issue: Finalidade expressa por εἰς ἀπόλαυσιν
  choice: para desfrutarmos
  alternative: para nosso uso
  rationale: ἀπόλαυσις indica desfrute ou gozo; a escolha preserva a afirmação positiva do texto sobre receber com prazer aquilo que Deus dá.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase conserva o contraste entre a instabilidade das riquezas e Deus. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
