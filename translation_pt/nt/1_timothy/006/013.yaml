  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: pt
  text: Eu lhe ordeno, diante de Deus, que dá vida a todas as coisas[a], e de Messias Jesus[b], que deu testemunho da boa confissão diante de Pôncio Pilatos[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que conserva vivas todas as coisas” ou “que faz viver todas as coisas”. O particípio grego pode enfatizar tanto a preservação da vida quanto a concessão da vida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cristo Jesus”. “Messias” explicita aqui o sentido do título grego Χριστός.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “no tempo de Pôncio Pilatos” ou “sob Pôncio Pilatos”. A expressão grega também pode ter sentido temporal ou indicar autoridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Eu lhe ordeno
  rationale: Expressa uma ordem direta e solene em português natural; o pronome singular corresponde a σοι.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Preserva a ideia de estar na presença de Deus e do Messias Jesus, adequada ao tom solene da exortação.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: que dá vida a todas as coisas
  rationale: Formulação clara que mantém o sentido amplo do particípio, sem limitar a referência apenas ao ato de criar vida ou ao de conservá-la.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  rationale: Mantém explícito o valor titular de Χριστός neste contexto confessional solene.
- source_word: μαρτυρήσαντος
  choice: que deu testemunho
  rationale: Expressão portuguesa natural que conserva tanto o sentido de testemunho público quanto a possível ressonância judicial.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: diante de Pôncio Pilatos
  rationale: No contexto do testemunho de Jesus, indica de modo natural sua comparecência perante Pilatos, embora a construção grega também possa ter sentido temporal ou institucional.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: da boa confissão
  rationale: Conserva a terminologia confessional e a ligação verbal com a confissão de Timóteo no contexto próximo, sem suavizar καλὴν.
theological_decisions:
- issue: Sentido de ζῳογονοῦντος
  choice: que dá vida a todas as coisas
  alternative: que conserva vivas todas as coisas; que faz viver todas as coisas
  rationale: O particípio pode destacar a concessão da vida ou sua preservação. A tradução principal mantém a amplitude, e a nota registra as nuances legítimas.
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução principal explicita o sentido de título ungido; a forma tradicional portuguesa permanece indicada em nota.
- issue: Sentido de ἐπὶ Ποντίου Πιλάτου
  choice: diante de Pôncio Pilatos
  alternative: no tempo de Pôncio Pilatos; sob Pôncio Pilatos
  rationale: A cena judicial favorece o sentido de presença perante Pilatos, mas a construção com ἐπί e genitivo admite uma leitura temporal ou de autoridade, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações acompanha o encadeamento solene do grego. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
