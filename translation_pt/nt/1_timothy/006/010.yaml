  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: pt
  text: Pois o amor ao dinheiro é uma raiz de todo tipo de males[a]; por cobiçá-lo, alguns se desviaram da fé[b] e se traspassaram com muitas dores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a tradução tradicional: «Pois o amor ao dinheiro é a raiz de todo mal». O grego permite mais naturalmente «uma raiz de todo tipo de males», sem afirmar que todo mal tenha uma única causa.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «se afastaram da fé». Aqui, «a fé» provavelmente se refere à fé cristã como corpo de crenças.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «se traspassaram com muitos sofrimentos» ou «com muitas angústias».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: uma raiz
  rationale: O predicativo ῥίζα, sem artigo e antes do verbo, é expresso naturalmente de modo indefinido, sem fazer do amor ao dinheiro a única raiz possível de todo mal.
- source_word: πάντων τῶν κακῶν
  choice: de todo tipo de males
  rationale: A formulação comunica em português o alcance amplo e distributivo da expressão grega, evitando uma afirmação absoluta que atribuiria todos os males, sem exceção, a uma única causa.
- source_word: φιλαργυρία
  choice: o amor ao dinheiro
  rationale: Preserva com clareza a imagem lexical de amor à prata ou ao dinheiro e é mais específico que o termo mais amplo «ganância».
- source_word: ὀρεγόμενοι
  choice: por cobiçá-lo
  rationale: O particípio indica desejo intenso dirigido ao dinheiro e pode ser entendido circunstancialmente como ligado ao desvio que se segue.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: se desviaram da fé
  rationale: Expressa de modo natural o movimento para longe de uma posição anterior, sem exigir que a forma passiva seja explicitada em português como ação de um agente externo.
- source_word: πίστεως
  choice: da fé
  rationale: O artigo e o uso contextual nas Cartas Pastorais favorecem a referência objetiva à fé cristã, embora a expressão portuguesa também preserve certa abertura semântica.
- source_word: περιέπειραν
  choice: feriram a si mesmos
  rationale: Mantém a imagem vívida de transpassar ou perfurar, mas em português corrente evita sugerir necessariamente um ferimento físico literal.
- source_word: ὀδύναις πολλαῖς
  choice: com muitas dores
  rationale: «Dores» conserva a amplitude de sofrimento, aflição ou angústia de ὀδύνη, sem restringir a referência apenas à tristeza emocional.
theological_decisions:
- issue: Alcance da afirmação sobre o dinheiro e os males
  choice: O amor ao dinheiro é uma raiz de todo tipo de males.
  alternative: O amor ao dinheiro é a raiz de todo mal.
  rationale: A ausência de artigo em ῥίζα e o plural πάντων τῶν κακῶν favorecem uma formulação não exclusiva e ampla, sem atribuir absolutamente todo mal a uma única causa.
- issue: Sentido de τῆς πίστεως
  choice: «da fé», provavelmente a fé cristã como realidade objetiva
  alternative: «da fé» no sentido da confiança pessoal
  rationale: Nas Cartas Pastorais, a expressão articulada frequentemente designa a fé cristã ou o conteúdo crido; a nota preserva a alternativa lexical sem resolver além da evidência contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Cobiçá-lo» comunica desejo intenso sem coloquialismo; «feriram a si mesmos» conserva a metáfora, enquanto a nota apresenta a força literal de transpassar. Todos os marcadores de nota aparecem no texto principal.
