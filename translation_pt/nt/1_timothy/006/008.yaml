source:
  edition: SBLGNT
  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: pt
  text: Mas, se temos alimento e algo com que nos cobrir[a], estaremos contentes com isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «roupa»; o termo grego pode designar, de modo mais amplo, aquilo que cobre uma pessoa, possivelmente incluindo também abrigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: se temos
  rationale: O particípio adverbial estabelece a circunstância da oração principal e admite valor semelhante ao condicional. «Se temos» é natural em português e evita tornar explícita uma causa que o grego não exige.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste moderado com a afirmação anterior e é adequadamente representada por «Mas».
- source_word: διατροφὰς
  choice: alimento
  rationale: O substantivo se refere aos meios de sustento, sobretudo comida. «Alimento» é claro, corrente e preserva o sentido básico.
- source_word: σκεπάσματα
  choice: com que nos cobrir
  rationale: A expressão evita restringir o termo grego apenas a roupas e conserva sua ideia ampla de algo que cobre, possivelmente abrangendo também abrigo.
- source_word: τούτοις
  choice: com isso
  rationale: O demonstrativo retoma conjuntamente as necessidades básicas mencionadas. No português corrente, «com isso» é mais natural do que «com estas coisas».
- source_word: ἀρκεσθησόμεθα
  choice: estaremos contentes
  rationale: A forma futura expressa contentamento ou suficiência. O futuro do indicativo é preservado, sem convertê-lo interpretativamente numa exortação como «contentemo-nos».
theological_decisions:
- issue: Alcance de σκεπάσματα
  choice: expressão ampla, «com que nos cobrir»
  alternative: «roupa» apenas ou «abrigo» apenas
  rationale: O termo pode denotar aquilo que cobre uma pessoa e não deve ser artificialmente limitado a vestuário nem identificado exclusivamente com moradia. A formulação preserva a amplitude e a tensão lexical do original.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva o contraste, o possível valor condicional do particípio, o futuro indicativo e a amplitude lexical de σκεπάσματα.
