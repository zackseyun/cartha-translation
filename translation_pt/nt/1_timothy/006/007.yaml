source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: pt
  text: Pois nada trouxemos para o mundo[a], e nada podemos levar dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «Pois nada trouxemos para o mundo, porque também nada podemos levar dele». A conjunção grega pode ter sentido causal («porque») ou introduzir a segunda afirmação correspondente.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: nada
  rationale: Objeto de «trouxemos» com negação absoluta; «nada» é a forma portuguesa mais natural e direta.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação anterior; «pois» conserva essa ligação discursiva com dignidade e naturalidade.
- source_word: εἰσηνέγκαμεν
  choice: trouxemos
  rationale: O aoristo de εἰσφέρω significa trazer para dentro; «trouxemos para o mundo» preserva a imagem da entrada no mundo pelo nascimento.
- source_word: εἰς τὸν κόσμον
  choice: para o mundo
  rationale: κόσμος designa aqui o mundo humano no qual se entra ao nascer; «para o mundo» é idiomático em português.
- source_word: ὅτι
  choice: e
  rationale: A conjunção pode ser entendida causalmente («porque») ou como introdução da segunda afirmação correspondente. «E» comunica com clareza o paralelismo proverbial, enquanto a nota preserva a ambiguidade do grego.
- source_word: οὐδὲ
  choice: nada
  rationale: Em conjunto com τι e sob a negação de δυνάμεθα, resulta naturalmente em português na construção «nada podemos».
- source_word: ἐξενεγκεῖν
  choice: levar dele
  rationale: O infinitivo de ἐκφέρω significa levar ou carregar para fora. O pronome «dele» retoma «o mundo» e expressa de modo natural a saída implícita no verbo grego.
- source_word: τι
  choice: nada
  rationale: Pronome indefinido sob negação; em português, «nada» é a equivalência idiomática adequada.
- source_word: δυνάμεθα
  choice: podemos
  rationale: Com «nada» anteposto, «nada podemos levar» expressa de forma natural a incapacidade indicada por δύναμαι.
theological_decisions:
- issue: Sentido da segunda oração introduzida por ὅτι
  choice: 'Continuação coordenada que apresenta a verdade correspondente: nada pode ser levado para fora do mundo na morte.'
  alternative: 'Oração causal: «porque também nada podemos levar dele».'
  rationale: A forma textual com ὅτι admite valor causal, mas o contexto também favorece duas afirmações proverbiais equilibradas. O texto principal conserva esse paralelismo em português natural, e a nota registra a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo entre entrar no mundo sem nada e sair dele sem levar nada; a nota preserva a ambiguidade sintática de ὅτι.
