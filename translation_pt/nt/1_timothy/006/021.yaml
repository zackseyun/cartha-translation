  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: pt
  text: Ao professarem esse conhecimento[a], alguns erraram o alvo no que diz respeito à fé.[b] A graça esteja com vocês.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conhecimento que alguns afirmam possuir e, quanto à fé, erraram o alvo”. O grego mantém explícito o pronome relativo que retoma o conhecimento mencionado anteriormente; o verbo também pode ser traduzido por “se desviaram” ou “erraram”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “a fé” provavelmente se refere à fé cristã como corpo de crença, embora também possa ser entendida de modo mais amplo como fé pessoal.
    reason: alternative_reading
  - marker: c
    text: No grego, “vocês” está no plural.
    reason: textual_detail
lexical_decisions:
- source_word: ἥν
  choice: esse conhecimento
  rationale: O pronome relativo feminino retoma a “falsamente chamada ciência/conhecimento” do versículo anterior. Em português, a retomada explícita por “esse conhecimento” torna a referência clara e natural, pois “conhecimento” tem gênero masculino.
- source_word: ἐπαγγελλόμενοι
  choice: ao professarem
  rationale: Neste contexto, a forma média indica declarar ou alegar possuir esse conhecimento, e não fazer uma promessa.
- source_word: ἠστόχησαν
  choice: erraram o alvo
  rationale: Preserva a imagem de não atingir o alvo presente no verbo grego, sem reduzir seu sentido a um erro genérico.
- source_word: περὶ τὴν πίστιν
  choice: no que diz respeito à fé
  rationale: περί com acusativo expressa referência ou relação. A formulação é clara em português e mantém o artigo de “a fé”.
- source_word: Ἡ χάρις
  choice: A graça
  rationale: Mantém a fórmula epistolar paulina em linguagem portuguesa natural e dignificada.
- source_word: μεθ’ ὑμῶν
  choice: esteja com vocês
  rationale: O verbo é naturalmente suprido em português, e “vocês” comunica sem ambiguidade o plural de ὑμῶν.
theological_decisions:
- issue: Sentido de “a fé” na advertência
  choice: referência objetiva à fé cristã
  alternative: fé pessoal ou confiança subjetiva
  rationale: Nas Cartas Pastorais e neste contexto de falso ensino, “a fé” provavelmente designa a fé cristã como corpo de crença e compromisso. A redação, porém, não acrescenta uma explicação interpretativa ao texto.
- issue: Destinatários da bênção final
  choice: manter o plural “vocês”
  alternative: usar o singular, dirigindo a bênção somente a Timóteo
  rationale: O texto grego tem o plural ὑμῶν, o que pode estender a bênção à comunidade ligada a Timóteo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação preserva a metáfora de errar o alvo, explicita de modo idiomático o antecedente do pronome relativo e mantém o plural da bênção final.
