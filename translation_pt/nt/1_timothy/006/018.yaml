  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: que façam o bem
  rationale: Conserva a força verbal do infinitivo e expressa de modo natural, claro e conciso o conteúdo da ordem iniciada no contexto anterior.
- source_word: πλουτεῖν
  choice: sejam ricos
  rationale: Preserva a metáfora de riqueza e o contraste deliberado com a riqueza material no contexto.
- source_word: ἐν ἔργοις καλοῖς
  choice: em boas obras
  rationale: Indica a esfera em que devem ser ricos e emprega uma expressão corrente e reconhecível para ἔργα καλά.
- source_word: εὐμεταδότους
  choice: generosos
  rationale: Comunica a disposição de dar dos próprios recursos em português moderno e natural.
- source_word: κοινωνικούς
  choice: dispostos a compartilhar
  rationale: Expressa a inclinação ativa para repartir com outros, evitando sentidos modernos inadequados de termos como “comunitários”.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: generosos e dispostos a compartilhar
  rationale: 'Mantém as duas ideias relacionadas, mas não idênticas: generosidade ao dar e disposição para repartir.'
