id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: pt
  text: Se alguém ensina uma doutrina diferente e não adere às palavras sãs — as de nosso Senhor Jesus, o Messias — nem ao ensino que está de acordo com a devoção a Deus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: ensina uma doutrina diferente
  rationale: Expressa o ensino divergente da doutrina recebida sem acrescentar explicitamente o qualificativo “falsa”, que o contexto sugere, mas o verbo não declara por si só.
- source_word: προσέρχεται
  choice: adere a
  rationale: Neste contexto, com objetos no dativo, o verbo tem o sentido figurado de aceitar, ligar-se a ou conformar-se a determinado ensino; “adere a” conserva essa força melhor que o literal “aproxima-se de”.
- source_word: ὑγιαίνουσι λόγοις
  choice: palavras sadias
  rationale: Preserva tanto a metáfora de saúde em ὑγιαίνω quanto o sentido concreto de λόγοις, sem substituí-lo por “doutrina” ou “ensino”.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: as de nosso Senhor Jesus, o Messias
  rationale: O pronome “as” retoma “palavras”; o genitivo indica que elas pertencem a ou procedem de Jesus. “O Messias” traduz o valor titular de Χριστός em português natural.
- source_word: κατ’ εὐσέβειαν
  choice: que está de acordo com a devoção a Deus
  rationale: Κατά indica correspondência ou conformidade. A formulação evita impor um sentido causal, como “que conduz à”, não explicitado pela expressão.
- source_word: διδασκαλίᾳ
  choice: ensino
  rationale: Representa com naturalidade o conteúdo ensinado e mantém a distinção estilística em relação a “doutrina” na primeira oração.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Comunica em linguagem atual a vida reverente e orientada para Deus denotada por εὐσέβεια; evita o possível sentido vago ou meramente sentimental de “piedade” no português contemporâneo.
theological_decisions:
- issue: Valor de Χριστοῦ na designação Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Aqui Χριστός integra uma designação solene cujo valor titular permanece perceptível. Traduzir como “o Messias” torna esse título explícito sem introduzir uma interpretação denominacional.
- issue: Relação expressa por κατ’ εὐσέβειαν
  choice: ensino que está de acordo com a devoção a Deus
  alternative: ensino que conduz à devoção a Deus
  rationale: A tradução escolhida preserva a ideia primária de conformidade e não resolve a expressão como uma relação especificamente causal, embora esse resultado possa estar implicado no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões esclarecem que “as de nosso Senhor Jesus, o Messias” retoma “palavras sadias”. A vírgula final foi mantida porque o versículo introduz uma construção condicional que prossegue no contexto seguinte.
