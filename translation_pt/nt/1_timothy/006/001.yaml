  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are slaves under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: pt
  text: Todos os que são escravos[a] sob um jugo considerem seus próprios senhores dignos de toda honra, para que o nome de Deus e o ensino[b] não sejam difamados.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos»; grego δοῦλοι. Aqui se usa «escravos» porque a expressão «sob um jugo» torna explícita a condição de sujeição.
    reason: alternative_reading
  - marker: b
    text: Ou «a doutrina».
    reason: lexical_alternative
  - marker: c
    text: Ou «sejam blasfemados».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: A expressão associada «sob um jugo» torna explícita a condição de sujeição; «escravos» traduz com clareza a realidade social indicada pelo grego.
- source_word: ὑπὸ ζυγὸν
  choice: sob um jugo
  rationale: Preserva a metáfora grega de sujeição sem acrescentar um artigo definido ausente no texto-fonte.
- source_word: δεσπότας
  choice: senhores
  rationale: No contexto, designa aqueles que exerciam autoridade sobre escravos; «senhores» é natural em português e mantém a relação social expressa no grego.
- source_word: ἰδίους
  choice: seus próprios
  rationale: Conserva a ênfase possessiva, referindo-se aos senhores específicos de cada escravo.
- source_word: πάσης τιμῆς ἀξίους
  choice: dignos de toda honra
  rationale: Reproduz de modo natural e próximo a abrangência da expressão grega.
- source_word: ἡγείσθωσαν
  choice: considerem
  rationale: O imperativo presente pede uma atitude contínua de avaliação; «considerem» transmite diretamente essa exortação.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: o nome de Deus
  rationale: Mantém a formulação bíblica referente à identidade e à reputação pública de Deus.
- source_word: ἡ διδασκαλία
  choice: o ensino
  rationale: É uma tradução atual e acessível, sem conferir ao termo uma tecnicidade maior do que a exigida pelo grego.
- source_word: βλασφημῆται
  choice: sejam difamados
  rationale: O plural em português concorda naturalmente com os dois sujeitos coordenados, «o nome» e «o ensino»; «difamados» expressa o ato de falar deles de forma injuriosa e funciona com ambos.
- source_word: Ὅσοι εἰσὶν
  choice: Todos os que são
  rationale: Transmite de maneira idiomática a força inclusiva da construção grega.
theological_decisions:
- issue: Tradução de δοῦλοι em um contexto social e moralmente sensível
  choice: escravos
  alternative: servos; escravos por vínculo
  rationale: A tradução descreve a realidade histórica pressuposta pelo texto, sem endossá-la. A frase «sob um jugo» confirma que se trata de sujeição escravista.
- issue: Tradução de διδασκαλία
  choice: o ensino
  alternative: a doutrina
  rationale: «Ensino» preserva o sentido da mensagem ensinada e evita impor uma conotação técnica posterior que o contexto não exige.
- issue: Força de βλασφημῆται aplicado a dois referentes
  choice: sejam difamados
  alternative: sejam blasfemados
  rationale: «Difamados» funciona naturalmente tanto para o nome de Deus quanto para o ensino e preserva a ideia de fala injuriosa; «blasfemados» é possível, mas menos idiomático em relação ao ensino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue os termos correspondentes no versículo, e todos os marcadores aparecem no texto principal.
