id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: pt
  text: está cheio de orgulho[a] e não entende nada. Pelo contrário, tem uma obsessão doentia por controvérsias e disputas sobre palavras[b], das quais surgem inveja, discórdia, calúnias[c] e suspeitas maldosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se presunçoso”. O grego evoca literalmente alguém inchado de orgulho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “brigas por palavras”.'
    reason: lexical_alternative
  - marker: c
    text: Aqui, “calúnias” se refere a falas difamatórias ou injuriosas contra pessoas; em outros contextos, o termo grego pode significar “blasfêmias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: está cheio de orgulho
  rationale: Expressa de modo natural em português o estado resultante de orgulho ou presunção indicado pelo perfeito, embora a metáfora literal de estar inchado seja esclarecida em nota.
- source_word: μηδὲν ἐπιστάμενος
  choice: não entende nada
  rationale: Reproduz diretamente a falta de compreensão atribuída ao sujeito e soa corrente em português.
- source_word: νοσῶν
  choice: tem uma obsessão doentia
  rationale: Mantém a imagem de enfermidade em linguagem idiomática e comunica a fixação nociva envolvida no uso metafórico.
- source_word: περὶ ζητήσεις
  choice: por controvérsias
  rationale: ζητήσεις designa aqui questões controversas ou disputas especulativas; a preposição 'por' liga naturalmente o termo a 'obsessão'.
- source_word: λογομαχίας
  choice: disputas sobre palavras
  rationale: Explicita com clareza o composto grego, preservando tanto seu elemento verbal quanto o caráter contencioso.
- source_word: ἐξ ὧν γίνεται
  choice: das quais surgem
  rationale: Marca essas práticas como a fonte dos vícios enumerados, mantendo a ligação sintática do grego.
- source_word: φθόνος
  choice: inveja
  rationale: Corresponde ao ressentimento diante do bem ou vantagem alheia indicado por φθόνος.
- source_word: ἔρις
  choice: discórdia
  rationale: Comunica conflito e desavença de modo claro e digno em uma lista de vícios.
- source_word: βλασφημίαι
  choice: calúnias
  rationale: No contexto de conflitos interpessoais, indica falas difamatórias ou injuriosas contra pessoas; a amplitude semântica é registrada em nota.
- source_word: ὑπόνοιαι πονηραί
  choice: suspeitas maldosas
  rationale: '''Maldosas'' comunica não apenas uma avaliação moral abstrata, mas o caráter malévolo das suspeitas, em português natural.'
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução emprega equivalência ótima: conserva a metáfora de doença em ''obsessão doentia'', enquanto apresenta de forma idiomática a imagem de orgulho e explica sua forma literal em nota.'
