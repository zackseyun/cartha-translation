id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: pt
  text: Dou graças ao Messias Jesus, nosso Senhor[a], que me fortaleceu, porque me considerou fiel, designando-me para o ministério[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”. O título grego Χριστός pode ser traduzido como “Messias” ou vertido pela forma tradicional “Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou “para o serviço” ou “a serviço”. O termo grego διακονία tem o sentido amplo de serviço ou ministério.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Dou graças
  rationale: A expressão idiomática significa agradecer. “Dou graças” é natural, digna e preserva a forma verbal do grego.
- source_word: ἐνδυναμώσαντί
  choice: que me fortaleceu
  rationale: Expressa a ação de capacitar ou dar forças sem especificar indevidamente a natureza dessa capacitação.
- source_word: Χριστῷ Ἰησοῦ
  choice: ao Messias Jesus
  rationale: Traduz Χριστός como título semanticamente vivo, em vez de apenas transliterá-lo como “Cristo”.
- source_word: κυρίῳ
  choice: Senhor
  rationale: Preserva o título cristológico e sua referência à autoridade de Jesus no uso estabelecido do Novo Testamento.
- source_word: πιστόν
  choice: fiel
  rationale: Pode denotar alguém fiel, digno de confiança ou confiável. “Fiel” preserva a concisão e a ressonância paulina, sem excluir a ideia de confiabilidade.
- source_word: ἡγήσατο
  choice: considerou
  rationale: Comunica com clareza o sentido de ter por, reputar ou considerar, sem acrescentar conotação judicial.
- source_word: θέμενος
  choice: designando-me
  rationale: No contexto de atribuição de serviço, traduz naturalmente a ideia literal de colocar ou estabelecer, sem exigir um cargo eclesiástico posterior.
- source_word: εἰς διακονίαν
  choice: para o ministério
  rationale: διακονία abrange serviço e ministério. Aqui se refere à incumbência confiada a Paulo; “ministério” é adequado, enquanto a nota preserva a amplitude lexical.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: “Messias” traduz o conteúdo do título grego Χριστός. A alternativa tradicional “Cristo” é indicada em nota para preservar o uso português consagrado.
- issue: Sentido da incumbência de Paulo
  choice: designando-me para o ministério
  alternative: colocando-me a serviço
  rationale: A formulação comunica que Jesus lhe atribuiu uma incumbência, mas não importa para o texto uma estrutura posterior de ofício clerical.
- issue: Relação entre fidelidade e designação
  choice: porque me considerou fiel, designando-me
  alternative: porque me julgou digno de confiança e me pôs
  rationale: Mantém a relação sintática do grego sem definir se πιστόν destaca fidelidade demonstrada ou confiabilidade reconhecida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada naturalmente para “ao Messias Jesus, nosso Senhor”. Mantém-se a vírgula final porque o versículo prossegue sintaticamente no contexto imediato.
