  source_fidelity: A tradução representa corretamente a exortação de Paulo, a permanência de Timóteo em Éfeso, a viagem de Paulo à Macedônia e a finalidade de impedir um ensino divergente. «Ordenasse» é uma opção defensável para παραγγείλῃς. A formulação «outra doutrina» expressa de modo mais idiomático em português o contraste de ἑτεροδιδασκαλεῖν sem intensificá-lo para «falsa doutrina».
  naturalness: «Insisti para que você permanecesse» é mais natural do que «insisti com você para que permanecesse», e explicita o sujeito de modo adequado ao português brasileiro contemporâneo. «Outra doutrina» soa mais corrente e claro que «doutrina diferente» neste contexto.
  terminology: Mantêm-se «Éfeso», «Macedônia», «ordenasse» e «doutrina» em registro moderno e digno. A nota é ajustada para conservar a mesma estrutura sintática da tradução e para não sugerir que as pessoas devam ser instruídas a ensinar outra doutrina.
