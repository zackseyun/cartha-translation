id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: pt
  text: Assim como insisti para que você permanecesse em Éfeso, quando eu estava indo para a Macedônia, para que ordenasse[a] a certas pessoas que não ensinassem outra doutrina,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desse instruções a certas pessoas para que não ensinassem outra doutrina».'
    reason: Alternativa lexical para παραγγείλῃς que preserva a construção de finalidade e o sentido de orientação autorizada, sem tornar «ordenasse» a única possibilidade.
lexical_decisions:
- source_word: Καθὼς
  choice: Assim como
  rationale: Preserva a força comparativa e retomadora da expressão grega, introduzindo a lembrança de uma orientação anterior.
- source_word: παρεκάλεσά
  choice: insisti com
  rationale: Comunica um apelo firme e pessoal, mais forte que um simples pedido, sem transformar o verbo em uma ordem direta.
- source_word: προσμεῖναι
  choice: para que permanecesse
  rationale: Expressa de modo natural a ideia de continuar ou ficar em determinado lugar.
- source_word: ἐν Ἐφέσῳ
  choice: em Éfeso
  rationale: Forma corrente do topônimo em português.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: quando eu estava partindo para a Macedônia
  rationale: Torna explícita a circunstância temporal do particípio e seu referente, Paulo, sem alterar o sentido da viagem.
- source_word: ἵνα
  choice: a fim de que
  rationale: Mantém claramente a relação de finalidade introduzida pela conjunção grega.
- source_word: παραγγείλῃς
  choice: ordenasse
  rationale: O verbo denota uma determinação autorizada; 'ordenasse' preserva essa força no contexto da correção do ensino, enquanto a nota registra uma opção menos forte.
- source_word: τισὶν
  choice: a certas pessoas
  rationale: Refere-se a pessoas específicas, mas não identificadas, de modo idiomático em português.
- source_word: ἑτεροδιδασκαλεῖν
  choice: ensinassem doutrina diferente
  rationale: Preserva a ideia lexical de ensinar uma doutrina distinta da norma recebida, sem acrescentar explicitamente a avaliação 'falsa'.
theological_decisions:
- issue: Intensidade de παραγγείλῃς no contexto de correção eclesial
  choice: ordem autorizada, expressa por 'ordenasse'
  alternative: '''instruísse'' ou ''encarregasse'''
  rationale: O contexto envolve autoridade apostólica delegada e a interrupção de um ensino divergente. 'Ordenasse' reflete diretamente essa autoridade, enquanto a alternativa em nota reconhece a amplitude semântica do verbo.
- issue: Avaliação implícita em ἑτεροδιδασκαλεῖν
  choice: '''ensinassem doutrina diferente'''
  alternative: '''ensinassem falsa doutrina'' ou ''ensinassem outra doutrina'''
  rationale: '''Doutrina diferente'' conserva o contraste com o padrão apostólico sem inserir no próprio verbo a formulação interpretativamente mais forte ''falsa doutrina''.'
- issue: Relação temporal de πορευόμενος
  choice: o particípio se refere à partida de Paulo para a Macedônia
  alternative: '''quando fui para a Macedônia'''
  rationale: A construção liga naturalmente o particípio ao sujeito de 'insisti'. A forma progressiva em português apresenta a circunstância da partida sem definir além do necessário o momento exato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final conserva a continuidade sintática indicada pelo texto fornecido e pelo contexto do período que prossegue no versículo seguinte.
