  terminology: «Justo», «ímpios», «pecadores», «profanos» e «assassinos» são escolhas estabelecidas e compreensíveis. A distinção entre impiedade, falta de santidade e profanação é suficientemente preservada no conjunto. A nota está corretamente ancorada em [a] após os dois termos parentais e registra a incerteza sem a resolver dogmaticamente.
