id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: pt
  text: 'reconhecendo isto: a lei não é estabelecida para o justo, mas para os que vivem sem lei e os rebeldes, os ímpios e pecadores, os que não respeitam o que é santo e os profanos, os que matam o pai e os que matam a mãe[a], os assassinos,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «os que agridem o pai e os que agridem a mãe»; os termos gregos podem indicar agressão violenta contra os pais, embora neste contexto «matam» seja provavelmente o sentido.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: reconhecendo isto
  rationale: Mantém a força cognitiva do particípio e sua ligação com a instrução anterior, em português natural e formal.
- source_word: δικαίῳ
  choice: para o justo
  rationale: Preserva o dativo singular substantivado e seu sentido representativo sem acrescentar um substantivo ausente no grego.
- source_word: νόμος οὐ κεῖται
  choice: a lei não é estabelecida
  rationale: Conserva o sentido jurídico de algo posto ou instituído, evitando a interpretação mais forte de que a lei simplesmente não se aplica.
- source_word: ἀνόμοις
  choice: os que vivem sem lei
  rationale: Expressa claramente o sentido moral e jurídico de ἀνόμοις; «sem lei» isoladamente poderia soar menos natural como designação de pessoas.
- source_word: ἀνυποτάκτοις
  choice: os rebeldes
  rationale: Comunica de modo corrente a recusa de submissão ou sujeição.
- source_word: ἀσεβέσι
  choice: os ímpios
  rationale: Equivalente português tradicional e ainda compreensível para a falta de reverência a Deus.
- source_word: ἁμαρτωλοῖς
  choice: pecadores
  rationale: O substantivo é natural em português e mantém a referência a pessoas na série.
- source_word: ἀνοσίοις
  choice: os que não respeitam o que é santo
  rationale: Torna acessível a ideia de violação da santidade e a distingue de ἀσεβέσι e βεβήλοις.
- source_word: βεβήλοις
  choice: os profanos
  rationale: Preserva a ideia de tratar como comum aquilo que pertence ao âmbito sagrado.
- source_word: πατρολῴαις
  choice: os que matam o pai
  rationale: O termo raro pode indicar agressão ou morte do pai; neste catálogo, a acepção mais forte é provável, mas a alternativa é registrada em nota.
- source_word: μητρολῴαις
  choice: os que matam a mãe
  rationale: Segue o paralelismo com πατρολῴαις e mantém a provável referência à morte, sem ocultar em nota a possibilidade de agressão.
- source_word: ἀνδροφόνοις
  choice: os assassinos
  rationale: Comunica de forma concisa e idiomática a ideia de homicídio criminoso.
theological_decisions:
- issue: Força representativa do masculino singular δικαίῳ
  choice: para o justo
  alternative: para uma pessoa justa
  rationale: A forma grega é masculina singular, mas funciona de maneira representativa. «O justo» conserva número e forma sem afirmar que a aplicação se limita aos homens.
- issue: Sentido de πατρολῴαις e μητρολῴαις
  choice: os que matam o pai e os que matam a mãe
  alternative: os que agridem o pai e os que agridem a mãe
  rationale: Os termos admitem a ideia de agressão violenta e também de morte. O contexto favorece «matam», mas a incerteza lexical genuína permanece explícita na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração e os pares retóricos do grego foram mantidos; evitou-se vocabulário excessivamente técnico, salvo termos correntes como «ímpios» e «profanos».
