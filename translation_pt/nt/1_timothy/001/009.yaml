  source_fidelity: O texto representa com precisão a construção participial εἰδὼς τοῦτο, a formulação jurídica νόμος οὐ κεῖται e a série de destinatários no dativo. «Para o justo» preserva adequadamente o singular representativo. Os pares da enumeração grega e a progressão até «os assassinos» foram mantidos. A tradução de πατρολῴαις e μητρολῴαις por «os que matam o pai/a mãe» é contextual e defensável, e a nota conserva de modo explícito a alternativa lexical de agressão violenta.
