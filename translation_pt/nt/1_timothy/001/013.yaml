  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: pt
  text: Eu, que antes era blasfemo, perseguidor e violento[a], fui alvo de misericórdia[b], porque agi por ignorância[c] na incredulidade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insolente” ou “brutal”. O termo grego indica comportamento abusivo e ultrajantemente violento, não apenas orgulho.
    reason: lexical_alternative
  - marker: b
    text: Ou “recebi misericórdia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sendo ignorante” ou “em ignorância”.
    reason: lexical_alternative
  - marker: d
    text: Ou “na infidelidade”. Aqui, o sentido mais provável é falta de fé, e não infidelidade à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: embora antes eu fosse
  rationale: Retoma Paulo no versículo anterior e expressa seu estado passado. A construção concessiva liga naturalmente este fragmento ao contexto sem perder a força do particípio.
- source_word: βλάσφημον
  choice: blasfemo
  rationale: Descritor pessoal direto e corrente, correspondente ao uso substantivado do adjetivo grego.
- source_word: διώκτην
  choice: perseguidor
  rationale: Equivalente normal do substantivo e adequado à antiga hostilidade de Paulo contra a igreja.
- source_word: ὑβριστήν
  choice: violento
  rationale: Comunica de modo claro a conduta abusiva e ultrajantemente agressiva do termo, sem reduzi-lo a mero orgulho.
- source_word: ἠλεήθην
  choice: fui tratado com misericórdia
  rationale: Mantém a voz passiva e deixa implícito, como no grego, o agente que mostrou misericórdia.
- source_word: ὅτι
  choice: porque
  rationale: Preserva o valor causal ou explicativo mais natural da conjunção neste contexto.
- source_word: ἀγνοῶν ἐποίησα
  choice: agi por ignorância
  rationale: Representa de modo idiomático tanto a ação de ποιέω sem objeto expresso quanto a circunstância indicada pelo particípio.
- source_word: ἐν ἀπιστίᾳ
  choice: na incredulidade
  rationale: Neste contexto, indica mais provavelmente falta de fé ou crença do que infidelidade pactual.
theological_decisions:
- issue: Relação causal introduzida por ὅτι
  choice: porque agi por ignorância, na incredulidade
  alternative: pois agi por ignorância, na incredulidade
  rationale: “Porque” preserva a relação causal ou explicativa do grego sem afirmar que a ignorância tornou Paulo merecedor de misericórdia. A tensão teológica permanece sem ser resolvida por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação simples da lista foi preservada, enquanto a abertura concessiva fornece uma ligação natural com o versículo anterior. As notas registram alternativas lexicais reais sem sobrecarregar o texto principal.
