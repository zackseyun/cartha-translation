source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] slave traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: pt
  text: aos sexualmente imorais, aos homens que têm relações sexuais com homens,[a] aos traficantes de escravos, aos mentirosos, aos que juram falsamente e a tudo mais que se opõe ao ensino saudável,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens que praticam atos homossexuais”. O termo grego ἀρσενοκοῖται é raro e seu alcance exato é debatido, mas se refere à atividade sexual entre homens.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: aos sexualmente imorais
  rationale: Expressa de modo amplo e atual aqueles que praticam imoralidade sexual, sem restringir o termo a relações pré-matrimoniais.
- source_word: ἀρσενοκοίταις
  choice: aos homens que têm relações sexuais com homens
  rationale: Mantém a referência masculina e comportamental do termo grego raro, sem introduzir uma categoria moderna de identidade; a incerteza sobre seu alcance exato é registrada em nota.
- source_word: ἀνδραποδισταῖς
  choice: aos traficantes de escravos
  rationale: O termo designa quem captura, escraviza ou negocia pessoas como escravas; esta formulação comunica claramente o tráfico humano voltado à escravização.
- source_word: ψεύσταις
  choice: aos mentirosos
  rationale: Equivalente português direto, natural e preciso para os que mentem.
- source_word: ἐπιόρκοις
  choice: aos que juram falsamente
  rationale: Comunica com clareza a violação ou falsidade de um juramento e é mais acessível no português internacional do que o termo técnico « perjuros ».
- source_word: καὶ εἴ τι ἕτερον
  choice: e a tudo mais
  rationale: Reproduz de maneira idiomática a ampliação aberta da lista a qualquer outra conduta comparável.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ao ensino saudável
  rationale: Preserva a metáfora de saúde presente em ὑγιαίνω e usa linguagem corrente, evitando tornar διδασκαλία excessivamente técnico ou eclesiástico.
- source_word: ἀντίκειται
  choice: se opõe
  rationale: Expressa naturalmente em português a ideia de estar em oposição ou ser contrário a algo.
theological_decisions:
- issue: Tradução de ἀρσενοκοίταις em contexto lexical e doutrinariamente discutido
  choice: homens que têm relações sexuais com homens
  alternative: homens que praticam atos homossexuais
  rationale: A opção principal conserva a especificidade masculina e o foco no ato sexual, sem projetar sobre o texto categorias modernas de orientação ou identidade. Como o termo é raro e seu alcance preciso é debatido, a nota apresenta uma alternativa sem resolver indevidamente a discussão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo dativo da lista por meio de «aos» e preserva a metáfora de saúde em «ensino saudável».
