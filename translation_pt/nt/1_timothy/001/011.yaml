id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: pt
  text: segundo o evangelho da glória do Deus bendito[a], que me foi confiado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “o glorioso evangelho do Deus bendito”.'
    reason: Registra a leitura adjetival possível de τῆς δόξης sem substituir, no texto principal, a construção genitiva do grego.
lexical_decisions:
- source_word: κατὰ
  choice: segundo
  rationale: Com o acusativo, introduz aqui o padrão ou a norma em conformidade com a qual se entende o contexto anterior; “segundo” é natural e preserva essa relação.
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: Termo consagrado e ainda inteligível no uso paulino, preservando seu peso teológico.
- source_word: τῆς δόξης
  choice: da glória
  rationale: Mantém a construção genitiva do grego e evita decidir silenciosamente se a relação é possessiva ou descritiva.
- source_word: μακαρίου
  choice: bendito
  rationale: Aplicado a Deus, comunica adequadamente a condição digna de louvor e plenamente favorecida; “feliz” poderia soar trivial neste contexto.
- source_word: θεοῦ
  choice: Deus
  rationale: Correspondência direta de θεός no genitivo, regido pela expressão precedente.
- source_word: ὃ
  choice: que
  rationale: O pronome relativo retoma “evangelho”; em português, “que me foi confiado” exprime naturalmente a relação.
- source_word: ἐπιστεύθην
  choice: me foi confiado
  rationale: O aoristo passivo de πιστεύω tem aqui o sentido de receber algo em confiança, não de crer; esta formulação é natural e mantém a voz passiva.
- source_word: ἐγώ
  choice: me
  rationale: A primeira pessoa explícita é representada no pronome oblíquo. A inversão “me foi confiado” mantém Paulo como destinatário da incumbência sem acrescentar ênfase tipográfica.
theological_decisions:
- issue: Relação genitiva em τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: o evangelho da glória do Deus bendito
  alternative: o glorioso evangelho do Deus bendito
  rationale: A tradução principal preserva a sequência genitiva grega e deixa aberta a relação exata entre o evangelho e a glória. A forma adjetival, mais idiomática, é registrada em nota.
- issue: Sentido de ἐπιστεύθην
  choice: me foi confiado
  alternative: eu cri
  rationale: Embora πιστεύω frequentemente signifique “crer”, a forma passiva neste contexto indica que o evangelho foi entregue a Paulo como responsabilidade ou comissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendito” foi preferido a “bem-aventurado” por ser mais corrente quando aplicado a Deus, sem perder a solenidade. O marcador [a] aparece imediatamente após a expressão a que se refere.
