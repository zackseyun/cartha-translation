id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: pt
  text: 'Mas foi por isso que recebi misericórdia: para que, em mim, que sou o principal, o Messias Jesus demonstrasse toda a sua paciência, como modelo para os que viriam a crer nele[c] para a vida eterna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Ou: «os que estavam para crer nele» ou «os que creriam nele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: recebi misericórdia
  rationale: Expressa naturalmente em português o aoristo passivo, sem nomear o agente que o texto deixa implícito.
- source_word: πρώτῳ
  choice: o principal
  rationale: Retoma a afirmação do versículo anterior sem impor aqui a paráfrase mais forte «o pior»; a nota preserva o sentido mais literal «o primeiro».
- source_word: ἐνδείξηται
  choice: demonstrasse
  rationale: Comunica a manifestação clara e exemplar da paciência de Jesus, mantendo a finalidade expressa por ἵνα com o subjuntivo.
- source_word: Χριστὸς Ἰησοῦς
  choice: o Messias Jesus
  rationale: Traduz o valor titular de Χριστός e identifica Jesus em sua função messiânica; «Cristo Jesus» é registrado como alternativa tradicional.
- source_word: ἅπασαν μακροθυμίαν
  choice: toda a sua paciência
  rationale: Preserva a ênfase de ἅπασαν e traduz μακροθυμία em linguagem atual como paciência perseverante e contida.
- source_word: ὑποτύπωσιν
  choice: modelo
  rationale: Denota um padrão ou exemplo apresentado para orientar e dar esperança a outros.
- source_word: τῶν μελλόντων πιστεύειν
  choice: os que viriam a crer
  rationale: Mantém a perspectiva futura em relação à experiência passada de Paulo de modo idiomático em português.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: crer nele
  rationale: É a forma portuguesa corrente para a construção com ἐπί e dativo, preservando seu caráter pessoal e relacional.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: Conserva a orientação para o alvo ou resultado indicada por εἰς sem explicitar além do texto.
theological_decisions:
- issue: Sentido de πρώτῳ
  choice: o principal
  alternative: o primeiro; o pior
  rationale: «O principal» mantém a ligação contextual com «o principal dos pecadores» no versículo anterior, mas evita inserir diretamente «o pior», expressão interpretativa mais forte.
- issue: Tradução de Χριστός
  choice: o Messias Jesus
  alternative: Cristo Jesus
  rationale: O título é vertido por seu sentido, «Messias», enquanto a nota registra a forma tradicional e igualmente legítima em português.
- issue: Agente da misericórdia e da paciência
  choice: O agente de «recebi misericórdia» permanece não expresso, enquanto o Messias Jesus é explicitamente quem demonstra a paciência.
  alternative: Explicitar Deus Pai como agente da misericórdia ou fundir diretamente a misericórdia com a ação do Filho.
  rationale: A formulação acompanha a voz passiva e a cláusula de finalidade gregas, sem resolver além do texto a relação entre o agente implícito da misericórdia e Jesus.
- issue: Relação de εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  alternative: resultando em vida eterna; com vistas à vida eterna
  rationale: A versão mantém aberta a nuance de alvo ou resultado de εἰς, sem transformar a frase numa explicação teológica mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe natural para leitores brasileiros. «Recebi misericórdia», «toda a sua paciência» e «viriam a crer» evitam arcaísmos; as notas preservam alternativas relevantes e ambiguidades reais do grego.
