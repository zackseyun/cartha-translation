  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: pt
  text: mantendo a fé[b] e uma boa consciência[a], a qual alguns, tendo-a rejeitado, naufragaram quanto à fé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome traduzido por “a qual” se refere mais naturalmente a “uma boa consciência”, embora alguns o entendam de modo mais amplo, abrangendo “a fé e uma boa consciência”.
    reason: alternative_reading
  - marker: b
    text: “Fé” também pode ser entendida como “confiança” ou, com menor probabilidade neste contexto, “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: mantendo
  rationale: O particípio presente modifica o sujeito implícito do versículo anterior e expressa a conservação ativa e contínua da fé e de uma boa consciência.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, o termo se refere mais naturalmente à fé cristã; “confiança” continua sendo uma possibilidade lexical, enquanto “fidelidade” é menos provável.
- source_word: ἀγαθὴν συνείδησιν
  choice: uma boa consciência
  rationale: Tradução direta e natural que conserva o valor moral de ἀγαθή sem restringi-lo à ideia mais subjetiva de uma consciência tranquila.
- source_word: ἥν
  choice: a qual
  rationale: O pronome relativo feminino singular retoma mais naturalmente συνείδησιν, o antecedente feminino singular mais próximo.
- source_word: τινες
  choice: alguns
  rationale: Expressa de modo simples e natural a referência plural indefinida.
- source_word: ἀπωσάμενοι
  choice: rejeitaram
  rationale: Comunica uma recusa deliberada em português corrente; formas como “repeliram” ou “afastaram de si” seriam mais concretas, porém menos naturais aqui.
- source_word: περὶ τὴν πίστιν
  choice: no que diz respeito à fé
  rationale: Indica a esfera em que ocorreu o naufrágio. O artigo favorece a referência à fé cristã, sem exigir a paráfrase mais interpretativa “doutrina cristã”.
- source_word: ἐναυάγησαν
  choice: naufragaram
  rationale: Preserva de maneira clara e idiomática a metáfora marítima do verbo grego.
theological_decisions:
- issue: Referência de ἥν
  choice: O pronome relativo retoma especificamente “uma boa consciência”.
  alternative: O pronome pode ser entendido de modo mais amplo, resumindo conjuntamente “a fé e uma boa consciência”.
  rationale: ἥν é feminino singular e concorda mais naturalmente com συνείδησιν, o substantivo feminino singular mais próximo. A nota preserva a leitura mais ampla sem impô-la ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem geral e a metáfora do grego foram preservadas, evitando conectores causais não expressos no original.
