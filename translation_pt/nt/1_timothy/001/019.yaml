  terminology: «Fé», «boa consciência», «rejeitado» e «naufragaram» são escolhas adequadas e consistentes. «Quanto à fé» reproduz de modo mais conciso e idiomático a esfera indicada por περὶ τὴν πίστιν do que «no que diz respeito à fé». A nota preserva apropriadamente a possibilidade minoritária de referência mais ampla para ἥν.
