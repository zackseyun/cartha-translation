id: 1TI.1.5
reference: 1 Timothy 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: pt
  text: O objetivo da instrução[a] é o amor que procede de um coração puro, de uma boa consciência e de uma fé sincera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a finalidade”, “o propósito” ou “o resultado da ordem”. O termo traduzido por “instrução” também pode significar “ordem” ou “encargo”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fé sem hipocrisia”. Conforme o contexto, “fé” também pode ser entendida como “fidelidade” ou “confiança”.
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: objetivo
  rationale: Neste contexto, indica a finalidade pretendida da instrução, não seu término; “objetivo” é natural e preciso em português.
- source_word: παραγγελίας
  choice: instrução
  rationale: O termo pode designar ordem, encargo ou instrução. Aqui, no contexto do ensino confiado a Timóteo, “instrução” comunica bem seu conteúdo e função pastoral.
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente corrente e adequado ao enfoque ético do versículo.
- source_word: ἐκ
  choice: que procede de
  rationale: Marca origem ou fonte; a forma verbal produz uma frase natural em português e deixa claro que o amor surge das três disposições mencionadas.
- source_word: καθαρᾶς καρδίας
  choice: um coração puro
  rationale: Preserva o sentido moral e interior da expressão em linguagem corrente e digna.
- source_word: συνειδήσεως ἀγαθῆς
  choice: uma boa consciência
  rationale: Mantém de perto o adjetivo grego ἀγαθῆς sem adotar a interpretação mais específica “consciência limpa”.
- source_word: πίστεως
  choice: fé
  rationale: É o sentido mais provável aqui e a tradução portuguesa mais direta, embora “fidelidade” e “confiança” pertençam ao campo semântico e sejam registradas em nota.
- source_word: ἀνυποκρίτου
  choice: sincera
  rationale: Expressa de modo idiomático a ausência de hipocrisia e concorda naturalmente com “fé”.
- source_word: δὲ
  choice: não explicitado
  rationale: A partícula marca uma transição leve. Em português, neste versículo isolado, não é necessário acrescentar “ora”, “mas” ou “e”, o que poderia acentuar indevidamente a relação discursiva.
theological_decisions:
- issue: Sentido de πίστις em πίστεως ἀνυποκρίτου
  choice: fé sincera
  alternative: fidelidade sem hipocrisia; confiança sincera
  rationale: “Fé” é a leitura mais provável no contexto cristão e preserva o termo teologicamente amplo. Como πίστις também pode significar fidelidade ou confiança, essas possibilidades são mantidas em nota sem resolver a ambiguidade de modo dogmático.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação das três fontes do amor foi preservada, e “que procede de” explicita naturalmente a força de ἐκ sem alterar a relação sintática.
