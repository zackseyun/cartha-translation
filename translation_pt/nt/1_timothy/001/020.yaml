id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: pt
  text: entre os quais estão Himeneu e Alexandre, que entreguei a Satanás[a], para que sejam disciplinados[b] a fim de não blasfemarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão provavelmente se refere a uma medida disciplinar severa, com finalidade corretiva, e não necessariamente à condenação definitiva.
    reason: theological_clarification
  - marker: b
    text: O verbo grego também pode ser traduzido como “ensinados”, “treinados” ou “corrigidos”; inclui a ideia de correção formativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: entre os quais estão
  rationale: Preserva o sentido partitivo do pronome relativo genitivo e soa natural em português.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Himeneu e Alexandre
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes em português.
- source_word: οὓς παρέδωκα
  choice: que entreguei
  rationale: Reproduz de modo direto o aoristo e a força de παραδίδωμι, sem acrescentar um mecanismo específico à ação.
- source_word: τῷ Σατανᾷ
  choice: a Satanás
  rationale: Mantém a designação pessoal convencional no uso bíblico português.
- source_word: ἵνα παιδευθῶσι
  choice: para que aprendam, por meio da disciplina
  rationale: Expressa tanto a finalidade formativa quanto o aspecto corretivo de παιδεύω; a voz passiva grega é explicitada idiomaticamente pela locução 'por meio da disciplina'.
- source_word: μὴ βλασφημεῖν
  choice: a não blasfemar
  rationale: Mantém a gravidade religiosa de βλασφημέω sem restringir no texto o alvo da blasfêmia, que não é explicitado neste versículo.
theological_decisions:
- issue: Sentido de 'entreguei a Satanás'
  choice: Manter literalmente a expressão, indicando em nota seu provável propósito disciplinar e corretivo.
  alternative: Interpretá-la no texto como exclusão da comunidade, sofrimento físico milagroso ou condenação definitiva.
  rationale: O propósito expresso por ἵνα παιδευθῶσι favorece uma finalidade corretiva, mas o versículo não especifica o mecanismo; por isso, a tradução preserva a tensão.
- issue: Amplitude de παιδευθῶσι
  choice: aprendam, por meio da disciplina
  alternative: sejam ensinados; sejam disciplinados; sejam corrigidos
  rationale: A formulação conserva conjuntamente os sentidos de aprendizagem e correção, sem reduzir o termo a instrução meramente intelectual nem a punição sem finalidade formativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita linguagem arcaica e mantém literalmente a expressão teologicamente carregada 'entreguei a Satanás'. Os marcadores [a] e [b] aparecem no texto principal.
