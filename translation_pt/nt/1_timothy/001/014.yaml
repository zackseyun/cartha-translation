id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: pt
  text: Mas a graça de nosso Senhor transbordou ainda mais, com a fé e o amor que estão no Messias Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo Jesus”.'
    reason: Registra a forma tradicional portuguesa do título Χριστός sem substituir no texto principal seu sentido lexical.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: transbordou ainda mais
  rationale: O verbo composto intensifica a ideia de abundar. A formulação comunica superabundância em português atual e natural.
- source_word: δὲ
  choice: Mas
  rationale: No contexto, a conjunção estabelece contraste com a condição anterior de incredulidade e pecado.
- source_word: χάρις
  choice: graça
  rationale: É a tradução corrente e adequada para o favor divino que atua na conversão e no chamado de Paulo.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título κύριος e seu peso confessional no uso do Novo Testamento.
- source_word: μετὰ
  choice: com
  rationale: Mantém a relação gramatical pela qual a graça transborda acompanhada de fé e amor, sem explicitar uma causalidade não declarada.
- source_word: πίστεως
  choice: fé
  rationale: É a tradução direta de πίστις neste contexto, em que não ocorre uma construção genitiva disputada.
- source_word: ἀγάπης
  choice: amor
  rationale: É o equivalente moderno e corrente de ἀγάπη.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: que estão no Messias Jesus
  rationale: A oração relativa no plural deixa claro que a expressão preposicional qualifica conjuntamente a fé e o amor.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu sentido lexical, em vez de tratá-lo como simples nome próprio.
theological_decisions:
- issue: Relação de “com a fé e o amor” com “graça”
  choice: A graça do Senhor é descrita como transbordando com a fé e o amor que estão no Messias Jesus.
  alternative: A fé e o amor são apresentados explicitamente como efeitos produzidos pela graça em Paulo.
  rationale: A sintaxe liga naturalmente μετὰ πίστεως καὶ ἀγάπης ao verbo que descreve a graça. A tradução conserva essa relação sem negar a possível implicação de que a graça produz essas qualidades.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: “Messias” preserva de modo transparente o valor titular do termo grego; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Transbordou ainda mais” preserva a intensidade do verbo grego sem recorrer a formas artificiais como “superabundou”. O plural “estão” explicita que “no Messias Jesus” modifica tanto “fé” quanto “amor”.
