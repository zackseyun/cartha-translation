  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: pt
  text: 'Esta declaração é digna de confiança e de plena aceitação: Jesus, o Messias[a], veio ao mundo para salvar os pecadores, dos quais eu sou o principal[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo Jesus”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “o pior” ou “o primeiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Esta palavra é digna de confiança
  rationale: A fórmula das Cartas Pastorais apresenta uma declaração reconhecidamente confiável. “Esta palavra” mantém λόγος, enquanto “digna de confiança” expressa πιστός de modo natural em português.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: de plena aceitação
  rationale: ἀποδοχή indica acolhimento ou aceitação, e πάσης intensifica a expressão. “Plena aceitação” comunica essa totalidade sem literalismo pouco natural.
- source_word: ὅτι
  choice: ':'
  rationale: Aqui ὅτι introduz o conteúdo da palavra digna de confiança. Em português, os dois-pontos apresentam esse conteúdo com clareza e naturalidade.
- source_word: Χριστὸς Ἰησοῦς
  choice: o Messias Jesus
  rationale: Χριστός conserva aqui seu valor titular, “Messias”; o artigo em português torna a construção mais inteligível e natural, sem transformar o título em mero nome próprio.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: veio ao mundo
  rationale: Expressão direta e corrente que preserva tanto o movimento indicado pelo grego quanto sua ressonância teológica.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: salvar os pecadores
  rationale: O adjetivo substantivado designa pessoas pecadoras, e σῴζω tem aqui sentido soteriológico; “salvar os pecadores” é preciso e natural.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: dos quais eu sou o principal
  rationale: πρῶτος pode indicar o primeiro em posição ou o principal. “Principal” preserva a ideia de preeminência entre os pecadores sem impor a paráfrase interpretativa “pior”; o pronome explícito “eu” reflete a ênfase de ἐγώ.
theological_decisions:
- issue: Tradução de Χριστός
  choice: o Messias Jesus
  alternative: Cristo Jesus
  rationale: O contexto permite reconhecer Χριστός como título messiânico. A alternativa tradicional pode refletir o uso mais próximo de nome próprio.
- issue: Sentido de πρῶτος entre os pecadores
  choice: principal
  alternative: pior; primeiro
  rationale: “Principal” mantém a metáfora de posição ou preeminência. “Pior” explicita uma avaliação moral plausível, mas mais interpretativa; “primeiro” é formalmente próximo, porém pode sugerir indevidamente prioridade cronológica em português.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação evita arcaísmos, preserva a força confessional do enunciado e mantém abertas as nuances de Χριστός e πρῶτος.
