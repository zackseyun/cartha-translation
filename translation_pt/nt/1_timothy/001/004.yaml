source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: pt
  text: nem a dar atenção a mitos e genealogias intermináveis, que promovem especulações[a] em vez da administração de Deus na fé[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que geram controvérsias” ou “que dão origem a investigações”. O termo grego pode indicar questionamentos ou disputas, aqui com o sentido negativo de especulação improdutiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “a gestão de Deus”, “o plano de Deus” ou “a responsabilidade confiada por Deus”. O grego οἰκονομία pode referir-se a administração, encargo ou plano ordenado; “de Deus” também pode indicar aquilo que procede de Deus.
    reason: lexical_alternative
  - marker: c
    text: Ou “pela fé”. Aqui, “fé” também pode trazer a nuance de “confiança” ou “fidelidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: dar atenção a
  rationale: Expressão natural em português que preserva o sentido de prestar atenção ou dedicar-se a algo; o infinitivo continua a incumbência do versículo anterior.
- source_word: μύθοις
  choice: mitos
  rationale: Equivalente direto, atual e digno, sem o tom antiquado ou infantil que “fábulas” pode sugerir.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: genealogias intermináveis
  rationale: “Intermináveis” comunica tanto a ausência de fim quanto a força pejorativa de discussões genealógicas que se prolongam sem proveito.
- source_word: αἵτινες
  choice: que
  rationale: Introduz naturalmente a caracterização explicativa dos mitos e das genealogias.
- source_word: ἐκζητήσεις
  choice: especulações
  rationale: No contexto, designa investigações, questionamentos ou controvérsias improdutivas; “especulações” comunica bem esse valor negativo sem limitar o sentido apenas a conflitos.
- source_word: παρέχουσι
  choice: promovem
  rationale: Expressa que essas coisas fomentam ou dão origem continuamente às especulações.
- source_word: μᾶλλον ἢ
  choice: em vez de
  rationale: Torna claro e idiomático o contraste entre os dois resultados.
- source_word: οἰκονομίαν θεοῦ
  choice: a administração de Deus
  rationale: “Administração” preserva a ideia de gestão, ordenação ou plano inerente a οἰκονομία. “De Deus” mantém aberta, tanto quanto possível em português, a relação genitiva, embora também possa ser entendida como administração procedente de Deus.
- source_word: τὴν ἐν πίστει
  choice: que se realiza pela fé
  rationale: A explicitação verbal produz português natural e liga a expressão à administração divina, preservando a possível nuance de meio ou esfera de ἐν.
- source_word: πίστει
  choice: fé
  rationale: É o equivalente padrão e adequado ao contexto; possíveis nuances de confiança ou fidelidade são registradas em nota.
theological_decisions:
- issue: Sentido de οἰκονομίαν θεοῦ
  choice: a administração de Deus
  alternative: a gestão de Deus; o plano de Deus; a responsabilidade confiada por Deus
  rationale: O termo pode designar administração, encargo ou plano ordenado. A opção principal preserva a amplitude do conceito sem reduzi-lo a um sistema teológico específico; a nota registra as alternativas e a ambiguidade do genitivo.
- issue: Relação expressa por τὴν ἐν πίστει
  choice: que se realiza pela fé
  alternative: que está na fé; que opera no âmbito da fé
  rationale: A formulação escolhida é natural em português e conserva uma nuance instrumental possível, enquanto a nota reconhece a leitura locativa ou esférica.
- issue: Sentido de πίστει
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” mantém o termo teológico tradicional sem decidir se, neste contexto, há também uma nuance mais ampla de confiança ou fidelidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção começa com “nem” porque o infinitivo depende da incumbência iniciada no versículo anterior. O travessão final preserva a continuidade sintática do texto.
