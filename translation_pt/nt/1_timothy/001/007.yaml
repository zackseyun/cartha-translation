  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: pt
  text: querendo ser mestres da lei[b], embora não entendam nem o que dizem nem os assuntos sobre os quais fazem afirmações tão categóricas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não entendem o que dizem nem o que afirmam com tanta segurança”.'
    reason: lexical_alternative
  - marker: b
    text: “Mestres da lei” provavelmente se refere aos que reivindicavam autoridade para ensinar a lei judaica (a Torá).
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες
  choice: querendo
  rationale: O particípio presente expressa a aspiração contínua dos homens mencionados no contexto anterior, sem intensificar indevidamente sua intenção.
- source_word: εἶναι
  choice: ser
  rationale: Infinitivo complementar natural depois de θέλοντες.
- source_word: νομοδιδάσκαλοι
  choice: mestres da lei
  rationale: Traduz de modo natural o substantivo composto e mantém 'lei' sem explicitar no texto principal que se trata da Torá.
- source_word: μὴ νοοῦντες
  choice: embora não entendam
  rationale: 'A construção participial tem valor concessivo no contexto: eles querem ensinar, embora lhes falte entendimento.'
- source_word: μήτε ... μήτε
  choice: nem ... nem
  rationale: Reproduz diretamente a negação correlativa grega em português idiomático.
- source_word: ἃ λέγουσιν
  choice: o que dizem
  rationale: Refere-se ao conteúdo de sua fala; o presente simples é a forma mais natural em português.
- source_word: περὶ τίνων
  choice: os assuntos sobre os quais
  rationale: Preserva a referência às matérias acerca das quais eles se pronunciam, com clareza em português atual.
- source_word: διαβεβαιοῦνται
  choice: fazem afirmações tão categóricas
  rationale: Comunica a ideia de afirmar ou insistir com grande segurança, preservando o contraste entre confiança e falta de compreensão.
theological_decisions:
- issue: Referência de 'lei' em νομοδιδάσκαλοι
  choice: Manter 'lei' no texto principal.
  alternative: Explicitar 'lei de Moisés' ou 'Torá'.
  rationale: O contexto provavelmente aponta para a lei judaica, mas o composto grego contém apenas o elemento 'lei'; a nota esclarece a provável referência sem sobre-especificar a tradução.
- issue: Alcance dos dois objetos da falta de entendimento
  choice: Distinguir entre 'o que dizem' e 'os assuntos sobre os quais fazem afirmações'.
  alternative: 'Traduzir de modo mais compacto: ''não entendem o que dizem nem o que afirmam com tanta segurança''.'
  rationale: A redação principal conserva a diferença formal entre ἃ λέγουσιν e περὶ τίνων διαβεβαιοῦνται, sem resolver se há forte distinção semântica entre as duas expressões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o contraste enfático entre a pretensão de ensinar e a falta de entendimento. Todos os marcadores das notas aparecem no texto principal.
