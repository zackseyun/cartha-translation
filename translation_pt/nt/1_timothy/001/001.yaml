  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: pt
  text: Paulo, apóstolo do Messias Jesus, por ordem de Deus, nosso Salvador, e do Messias Jesus, nossa esperança,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma tradicional e natural do nome em português.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o título reconhecido no cristianismo primitivo e é mais específico que «mensageiro» ou «enviado».
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título e translitera o nome; a contração «do» expressa naturalmente o genitivo em português.
- source_word: κατ’ ἐπιταγὴν
  choice: por ordem de
  rationale: Expressa de modo corrente a autorização baseada numa determinação de autoridade, sem a rigidez de «segundo o mandamento».
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: de Deus, nosso Salvador
  rationale: Mantém «Salvador» como designação de Deus e torna clara a aposição.
- source_word: καὶ Χριστοῦ Ἰησοῦ
  choice: e do Messias Jesus
  rationale: Repete a preposição exigida pela coordenação natural em português e deixa claro que a ordem é associada tanto a Deus quanto ao Messias Jesus.
- source_word: τῆς ἐλπίδος ἡμῶν
  choice: nossa esperança
  rationale: Conserva a aposição compacta e o sentido teologicamente rico de ἐλπίς.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste cabeçalho, o valor titular permanece perceptível; «Messias» traduz o título, enquanto «Cristo» seria a forma tradicional mais semelhante a um nome.
- issue: Relação de «nossa esperança» com o Messias Jesus
  choice: 'Aposição: «o Messias Jesus, nossa esperança»'
  alternative: «o Messias Jesus, que é nossa esperança»
  rationale: A forma compacta preserva a estrutura grega e identifica o Messias Jesus como a esperança dos remetentes e leitores sem explicitação desnecessária.
- issue: Alcance de «por ordem de»
  choice: A ordem é atribuída coordenadamente a Deus e ao Messias Jesus
  alternative: Ler a segunda expressão sem repetir «de», com coordenação formal mais compacta
  rationale: Os dois genitivos coordenados dependem naturalmente de ἐπιταγήν; repetir «do» em português torna essa relação explícita sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação distingue as aposições «nosso Salvador» e «nossa esperança», e a repetição de «do» evita ambiguidade sintática.
