  terminology: “Ordem”, “confio”, “profecias” e “por meio delas” são escolhas defensáveis. “Boa campanha” preserva melhor στρατεία do que uma referência exclusiva a um combate individual; a nota explica adequadamente a metáfora militar. A nota sobre ἐπὶ σέ é ajustada para não apresentar “dirigidas a você” como equivalente mais seguro do que “proferidas sobre você”.
