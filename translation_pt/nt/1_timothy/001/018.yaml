  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: pt
  text: Esta ordem confio a você, Timóteo, meu filho, de acordo com as profecias feitas anteriormente a seu respeito[a], para que, por meio delas[b], você trave a boa campanha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre você”; possivelmente, “proferidas sobre você”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nelas”. O grego pode indicar tanto o meio quanto a esfera em que Timóteo deve agir.
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “combata o bom combate”. O grego emprega linguagem de campanha ou serviço militar, mais ampla que a imagem de uma única luta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: ordem
  rationale: O substantivo indica uma orientação dotada de autoridade. “Ordem” preserva a força solene da incumbência, sem reduzir o termo a uma instrução meramente informativa.
- source_word: παρατίθεμαί
  choice: confio
  rationale: A forma média comunica a ideia de entregar algo à responsabilidade de alguém. “Confio” expressa de modo natural tanto a entrega quanto a responsabilidade pessoal de Timóteo.
- source_word: τέκνον
  choice: meu filho
  rationale: Embora o grego diga literalmente “filho” ou “criança”, trata-se aqui de um vocativo familiar e afetuoso. Em português, “Timóteo, meu filho” reproduz naturalmente essa relação sem afirmar filiação biológica.
- source_word: κατὰ
  choice: de acordo com
  rationale: 'Com o acusativo, κατά expressa correspondência ou conformidade: a ordem está ligada às profecias anteriores e em consonância com elas.'
- source_word: προαγούσας
  choice: feitas anteriormente
  rationale: O particípio significa literalmente “que iam adiante”, mas neste contexto tem força temporal e se refere a profecias já proferidas.
- source_word: ἐπὶ σὲ
  choice: a seu respeito
  rationale: A expressão provavelmente indica referência a Timóteo. “A seu respeito” é clara e natural, enquanto a nota preserva as possibilidades “sobre você” e “dirigidas a você”.
- source_word: προφητείας
  choice: profecias
  rationale: É o equivalente direto e corrente para as mensagens proféticas mencionadas no plural.
- source_word: στρατεύῃ
  choice: você conduza
  rationale: O verbo pertence ao campo militar e, junto do objeto cognato στρατείαν, descreve a participação ativa numa campanha. “Conduza” combina naturalmente com “campanha” e conserva a ideia de levar adiante essa missão.
- source_word: ἐν αὐταῖς
  choice: por meio delas
  rationale: ἐν pode ter valor instrumental ou indicar a esfera em que a ação ocorre. O texto principal adota o sentido instrumental, e a nota registra a ambiguidade.
- source_word: τὴν καλὴν στρατείαν
  choice: a boa campanha
  rationale: στρατεία designa campanha, serviço ou atividade militar, não apenas um combate isolado. “Boa campanha” conserva a imagem militar ampla, esclarecida em nota para evitar a possível associação exclusiva com campanha política.
theological_decisions:
- issue: Relação entre as profecias e a incumbência de Timóteo
  choice: As profecias anteriores a respeito de Timóteo fundamentam ou orientam a ordem e servem como meio ou esfera para sua campanha.
  alternative: As profecias constituíram formalmente uma ordenação, ou foram apenas palavras particulares de encorajamento.
  rationale: O versículo relaciona claramente a ordem às profecias, mas não define por si só a natureza eclesial exata do acontecimento. A tradução não acrescenta uma teoria de ordenação nem reduz as profecias a incentivo privado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. “Timóteo, meu filho” mantém o tom pastoral e afetuoso; “boa campanha” preserva a extensão da metáfora militar, e a nota previne uma leitura política.
