  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: pt
  text: Alguns, não tendo alcançado essas coisas[a], desviaram-se para conversas vazias[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo-se afastado dessas coisas”. O verbo pode significar errar um alvo, deixar de alcançá-lo ou desviar-se dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “discussões inúteis” ou “fala sem sentido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: essas coisas
  rationale: O pronome relativo no genitivo plural retoma as qualidades mencionadas no versículo 5. Em português, «essas coisas» torna clara a referência anterior sem restringi-la além do que o contexto permite.
- source_word: τινες
  choice: Alguns
  rationale: O pronome indefinido indica um grupo não especificado; «Alguns» é natural e preserva essa indefinição.
- source_word: ἀστοχήσαντες
  choice: não tendo alcançado
  rationale: O particípio de ἀστοχέω expressa a ideia de errar o alvo, deixar de atingir ou desviar-se de algo. «Não tendo alcançado» comunica a falha em atingir o objetivo e se liga naturalmente a «essas coisas».
- source_word: ἐξετράπησαν
  choice: desviaram-se
  rationale: A forma de ἐκτρέπομαι descreve afastamento de um rumo correto. «Desviaram-se» preserva a metáfora direcional e o sentido moral, sem tornar explícita uma causa externa.
- source_word: εἰς
  choice: para
  rationale: A preposição indica movimento ou resultado em direção a uma atividade; «para» é idiomático com «desviaram-se».
- source_word: ματαιολογίαν
  choice: conversas vazias
  rationale: O termo denota fala fútil, inútil ou sem conteúdo proveitoso. «Conversas vazias» é atual, claro e apropriado ao contexto de ensino.
theological_decisions:
- issue: Referente do pronome relativo ὧν
  choice: Retoma de modo geral as qualidades e o objetivo apresentados no versículo 5, vertidos como «essas coisas».
  alternative: Entendê-lo de modo mais restrito como referência apenas a «coração puro, boa consciência e fé sincera», ou traduzi-lo formalmente como «das quais».
  rationale: A sintaxe aponta para o contexto imediatamente anterior, mas não exige que a tradução delimite ainda mais o referente. «Essas coisas» mantém a ligação discursiva e a abrangência genuinamente possível.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Não tendo alcançado» preserva a imagem de falhar quanto a um alvo, enquanto as notas registram a alternativa de afastamento. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
