  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: pt
  text: 'A Timóteo, meu verdadeiro filho na fé[a]: graça, misericórdia e paz da parte de Deus Pai e do Messias Jesus, nosso Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu filho genuíno na fé”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ
  choice: verdadeiro
  rationale: Expressa a autenticidade da relação espiritual de Paulo com Timóteo sem sugerir descendência biológica; em português, “verdadeiro filho” é claro e natural.
- source_word: τέκνῳ
  choice: filho
  rationale: Embora τέκνον signifique literalmente “criança/filho” sem enfatizar o sexo, “filho” preserva de modo natural em português a metáfora de parentesco espiritual aplicada a Timóteo.
- source_word: ἐν πίστει
  choice: na fé
  rationale: Mantém aberta a referência à fé como esfera compartilhada ou realidade comum, sem reduzi-la apenas ao ato subjetivo de crer.
- source_word: χάρις
  choice: graça
  rationale: Equivalente consagrado e preciso do termo paulino de saudação.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente lexical direto, preservando o elemento distintivo da saudação das Cartas Pastorais.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente direto e natural, mantendo a plenitude da fórmula de saudação.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: da parte de Deus Pai
  rationale: “Da parte de” comunica naturalmente a origem indicada por ἀπό; “Deus Pai” é a formulação corrente e fiel em português.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título (“Messias”) e translitera o nome Jesus, preservando a ordem do grego.
- source_word: κυρίου
  choice: Senhor
  rationale: É o equivalente tradicional e semanticamente adequado, preservando o peso cristológico do título.
theological_decisions:
- issue: Sentido de Χριστοῦ em Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução verte o título Χριστός pelo seu sentido, “Messias”, em vez de apenas transliterá-lo. A ordem “Messias Jesus” acompanha o texto grego, ainda que “Jesus, o Messias” fosse mais idiomático.
- issue: Força de ἐν πίστει
  choice: na fé
  alternative: em fé
  rationale: “Na fé” pode indicar a esfera da fé compartilhada e a relação espiritual nela fundada, sem transformar a expressão em termo técnico nem excluir a dimensão pessoal do crer.
- issue: Possessivo implícito na relação com Timóteo
  choice: meu verdadeiro filho
  alternative: verdadeiro filho
  rationale: O grego não traz pronome possessivo expresso, mas a relação indicada por “filho” no endereçamento de Paulo torna o possessivo natural e implícito em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a concisão epistolar e a tríade “graça, misericórdia e paz”. O marcador [a] aparece no texto principal e oferece a principal alternativa lexical para γνησίῳ.
