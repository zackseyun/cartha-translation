id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: pt
  text: Ao Rei dos séculos, imortal, invisível, o único Deus[a], sejam a honra e a glória para todo o sempre. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “o único Deus sábio”.'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Rei dos séculos
  rationale: Preserva de modo transparente a construção grega e a linguagem de αἰών, podendo evocar tanto a sucessão das eras quanto o governo permanente de Deus, sem reduzi-la à formulação interpretativa “Rei eterno”.
- source_word: ἀφθάρτῳ
  choice: imortal
  rationale: Em referência a Deus, é uma expressão clara e natural para sua isenção da morte e da corrupção; “incorruptível” seria possível, mas hoje pode sugerir sobretudo integridade moral.
- source_word: ἀοράτῳ
  choice: invisível
  rationale: Equivalente direto e corrente que mantém o tom elevado da doxologia.
- source_word: μόνῳ θεῷ
  choice: o único Deus
  rationale: Reproduz diretamente a confissão monoteísta do texto crítico, sem acrescentar o adjetivo da variante textual.
- source_word: τιμὴ καὶ δόξα
  choice: a honra e a glória
  rationale: Mantém a dupla expressão do original com os equivalentes portugueses consagrados e naturais em contexto doxológico.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Expressa em português idiomático a duração ilimitada da fórmula grega, evitando a artificialidade de “pelos séculos dos séculos”.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a transliteração convencional em português bíblico e litúrgico.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: A partícula marca de modo leve a transição para a doxologia. Em português, essa passagem é comunicada naturalmente pela própria abertura “Ao Rei”, sem introduzir um advérbio temporal inexistente no grego nem um conectivo mais forte.
theological_decisions:
- issue: Preservação da força monoteísta de μόνῳ θεῷ
  choice: o único Deus
  alternative: somente a Deus
  rationale: A formulação escolhida acompanha diretamente a estrutura adjetivo-substantivo e deixa intacta a afirmação do texto, sem inserir explicações doutrinárias externas nem resolver tensões canônicas.
- issue: Variante textual com σοφῷ (“sábio”)
  choice: omitir “sábio” do texto principal
  alternative: o único Deus sábio
  rationale: O SBLGNT fornecido lê μόνῳ θεῷ sem σοφῷ. A forma mais longa é registrada em nota por sua presença em parte da tradição manuscrita.
translation_notes:
  register: Português moderno, claro e digno, com cadência doxológica. “Rei dos séculos” conserva deliberadamente a imagem do original, enquanto “para todo o sempre” comunica de modo idiomático a fórmula final. O marcador da nota foi colocado junto à expressão afetada pela variante textual.
