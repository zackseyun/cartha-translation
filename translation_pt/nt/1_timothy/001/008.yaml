id: 1TI.1.8
reference: 1 Timothy 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: pt
  text: Sabemos, porém, que a lei é boa, se alguém a usa de modo legítimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corretamente”, “apropriadamente” ou “de acordo com a lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Sabemos
  rationale: O perfeito οἶδα tem sentido presente e expressa conhecimento estabelecido; “sabemos” é a forma natural e direta em português.
- source_word: δὲ
  choice: porém
  rationale: δέ introduz aqui uma transição ou contraste leve. “Porém”, em posição pós-verbal, preserva essa função sem sugerir um contraste excessivamente forte.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que se sabe.
- source_word: καλὸς
  choice: boa
  rationale: Expressa a qualidade positiva da lei; “boa” mantém o sentido amplo sem o restringir.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Reproduz a expressão grega sem decidir no texto principal se o referente é especificamente a Lei mosaica ou a lei em sentido mais amplo.
- source_word: ἐάν τις
  choice: se alguém
  rationale: Representa de modo natural em português a condição genérica no singular, sem especificar sexo ou identidade.
- source_word: αὐτῷ
  choice: a
  rationale: O pronome retoma “a lei”; o pronome oblíquo feminino é a construção idiomática com “usar” em português.
- source_word: νομίμως
  choice: de modo legítimo
  rationale: O advérbio pode significar “legalmente”, “legitimamente” ou “corretamente”. “De modo legítimo” conserva a relação conceitual com norma/lei e evita que “legalmente” soe apenas como conformidade com legislação civil.
- source_word: χρῆται
  choice: usa
  rationale: χράομαι significa usar ou empregar; “usa” é conciso e natural.
theological_decisions:
- issue: Âmbito de “a lei”
  choice: Mantida simplesmente como “a lei”.
  alternative: “a Lei mosaica” ou “a lei em geral”
  rationale: Embora o contexto paulino possa apontar especialmente para a Lei mosaica, o grego não explicita essa delimitação; a tradução preserva a abertura do texto.
- issue: Sentido de νομίμως
  choice: “de modo legítimo” no texto principal.
  alternative: “corretamente”, “apropriadamente” ou “de acordo com a lei”
  rationale: A escolha mantém a tensão entre conformidade com a lei e uso apropriado, sem explicar no texto principal em que consiste esse uso.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A vírgula antes da oração condicional acompanha a pausa retórica, e a nota preserva a amplitude semântica de νομίμως.
