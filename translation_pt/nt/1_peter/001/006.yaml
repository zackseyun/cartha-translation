id: 1PE.1.6
reference: 1 Peter 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: pt
  text: Nisso vocês se alegram, embora agora, por pouco tempo, se necessário, tenham sido entristecidos por várias provações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testes”; em outros contextos, o termo grego também pode significar “tentações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nisso
  rationale: Retoma de modo natural o conjunto anterior — a salvação, a esperança e a herança — e preserva o sentido de esfera ou fundamento sem tornar explícita uma relação causal mais forte.
- source_word: ἀγαλλιᾶσθε
  choice: vocês se alegram
  rationale: Expressa alegria intensa em português atual e claro; “exultam” seria possível, mas é menos comum para muitos leitores.
- source_word: ὀλίγον ἄρτι
  choice: agora, por pouco tempo
  rationale: Conserva tanto a referência ao presente quanto a brevidade da aflição.
- source_word: εἰ δέον
  choice: se necessário
  rationale: Preserva a nuance condicional da expressão grega sem explicar de onde vem a necessidade.
- source_word: λυπηθέντες
  choice: tenham sido entristecidos
  rationale: Mantém a força passiva e o sentido de tristeza do particípio, em construção subordinada natural após “embora”.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: por várias provações
  rationale: No contexto, o termo se refere principalmente a dificuldades que põem a fé à prova; “por” comunica em português a circunstância causadora da tristeza.
theological_decisions:
- issue: Sentido de πειρασμοῖς no contexto de sofrimento
  choice: provações
  alternative: tentações; testes
  rationale: O contexto imediato trata da tristeza causada por dificuldades e da fé posta à prova no versículo seguinte. “Provações” abrange essas experiências sem limitar o termo à incitação ao pecado.
- issue: Necessidade expressa por εἰ δέον
  choice: se necessário
  alternative: visto que é necessário
  rationale: A forma condicional do grego foi mantida, sem definir teologicamente a fonte ou a natureza dessa necessidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “agora, por pouco tempo” preserva os dois elementos temporais, e o marcador da nota foi colocado junto de “provações”, termo ao qual a alternativa lexical se refere.
