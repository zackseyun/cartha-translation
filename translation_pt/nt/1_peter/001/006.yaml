  source_fidelity: 'O texto preserva adequadamente todos os elementos do grego: «Nisso» mantém a referência anafórica de ἐν ᾧ; «vocês se alegram» traduz o presente de ἀγαλλιᾶσθε de modo idiomático; «agora, por pouco tempo» reproduz ἄρτι e ὀλίγον; «se necessário» conserva a contingência de εἰ δέον; e «tenham sido entristecidos por várias provações» expressa tanto o particípio passivo λυπηθέντες quanto o contexto causal/circunstancial de ἐν ποικίλοις πειρασμοῖς. A construção concessiva com «embora» é compatível com a sintaxe e o fluxo do enunciado grego.'
