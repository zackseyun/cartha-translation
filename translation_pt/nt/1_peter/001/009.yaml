  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: pt
  text: 'enquanto recebem o resultado[a] da fé de vocês: a salvação de suas almas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fim” ou “o alvo” da fé de vocês.
    reason: lexical_alternative
  - marker: b
    text: Ou “a salvação de suas vidas” ou “a salvação de vocês”. A palavra grega pode significar “almas”, “vidas” ou “pessoas”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: enquanto recebem
  rationale: O particípio presente se liga aos destinatários no contexto anterior e indica que eles passam a receber ou alcançar aquilo a que a fé conduz. “Enquanto recebem” preserva a relação circunstancial e o aspecto em curso sem impor uma distinção de voz pouco natural em português.
- source_word: τέλος
  choice: resultado
  rationale: Neste contexto, designa aquilo em que a fé culmina e que os leitores recebem. “Resultado” evita que “fim” seja entendido apenas em sentido cronológico e não enfatiza tanto a intenção quanto “alvo”.
- source_word: πίστεως
  choice: fé
  rationale: É a tradução direta e contextualmente natural de πίστις, referindo-se aqui à fé dos destinatários.
- source_word: ὑμῶν
  choice: de vocês
  rationale: O pronome plural modifica “fé” e é expresso de modo claro e natural para leitores brasileiros, sem perder a compreensão no português internacional.
- source_word: σωτηρίαν
  choice: salvação
  rationale: É a tradução corrente e adequada neste contexto, preservando a continuidade do tema da salvação em 1 Pedro sem reduzir seu alcance a um livramento meramente circunstancial.
- source_word: ψυχῶν
  choice: almas
  rationale: “Almas” reproduz diretamente o termo tradicional nesta expressão. A nota conserva os sentidos contextualmente possíveis de “vidas” e “pessoas”, sem impor ao versículo uma antropologia dualista detalhada.
theological_decisions:
- issue: Sentido de πίστις no genitivo
  choice: fé de vocês
  alternative: fidelidade de vocês; confiança de vocês
  rationale: O contexto aponta mais naturalmente para a fé dos leitores. A tradução não redefine πίστις como fidelidade nem elimina a dimensão de confiança inerente à fé.
- issue: Alcance de ψυχαί em “salvação de suas almas”
  choice: almas
  alternative: vidas; pessoas
  rationale: A formulação direta preserva a expressão grega e sua tensão antropológica. Não se deve inferir dela, por si só, que a salvação exclua o corpo; os sentidos mais abrangentes do substantivo são registrados em nota.
- issue: Relação entre τέλος e σωτηρίαν
  choice: a salvação é apresentada como o resultado da fé
  alternative: a salvação é o fim ou alvo da fé
  rationale: O segundo sintagma funciona como explicação ou aposição do primeiro. Os dois-pontos tornam essa relação clara sem acrescentar uma causalidade que o grego não explicita.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e ampla compreensão internacional. “De vocês” deixa explícito o plural do pronome grego. A construção mantém o caráter de continuação sintática do particípio inicial e usa dois-pontos para apresentar “a salvação de suas almas” como explicação de “o resultado da fé de vocês”.
