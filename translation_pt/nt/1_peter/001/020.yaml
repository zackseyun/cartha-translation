    rationale: Embora διά com acusativo possa expressar causa em outros contextos, aqui, ligado à revelação de Cristo para os leitores, é melhor traduzido com uma expressão benefactiva. «Em favor de vocês» evita sugerir que os destinatários sejam a causa da revelação.
