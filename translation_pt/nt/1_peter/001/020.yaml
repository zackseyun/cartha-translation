  source_fidelity: 'A tradução preserva corretamente os dois particípios passivos, a anterioridade a «a fundação do mundo» e o contraste com a revelação no período final. Contudo, «por causa de vocês» tende, em português atual, a comunicar causa ou motivo («por causa de vocês aconteceu»), ao passo que δι’ ὑμᾶς neste contexto tem valor predominantemente benefactivo: a revelação ocorreu em favor dos destinatários.'
  naturalness: O texto é claro, moderno e de registro apropriado. «Conhecido de antemão», «fundação do mundo», «foi revelado» e «no fim dos tempos» são formulações naturais. «Em favor de vocês» torna explícita, de modo idiomático e sem expansão doutrinária, a relação de benefício pretendida pela frase final.
  terminology: «Conhecido de antemão» mantém a ambiguidade de προεγνωσμένου e não a substitui por eleição ou predestinação. «Fundação do mundo» e «fim dos tempos» correspondem adequadamente às expressões gregas. A nota a conserva de forma apropriada a alternativa interpretativa «escolhido de antemão».
