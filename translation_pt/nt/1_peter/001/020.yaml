  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: pt
  text: Ele foi conhecido de antemão antes da fundação do mundo[a], mas foi revelado no fim dos tempos[b], em favor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolhido de antemão”. O grego diz “conhecido de antemão”, expressão que pode envolver o propósito divino, mas não exige que essa interpretação mais ampla apareça no texto principal.
    reason: lexical_alternative
  - marker: b
    text: Ou “nestes últimos tempos”.
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: foi conhecido de antemão
  rationale: O particípio aoristo passivo modifica o antecedente do v. 19, Cristo. A formulação preserva o sentido lexical de προγινώσκω sem incorporar ao texto principal a interpretação mais forte de que ele foi previamente escolhido.
- source_word: πρὸ καταβολῆς κόσμου
  choice: antes da fundação do mundo
  rationale: Expressão bíblica consagrada e compreensível para uma realidade anterior à criação, mantendo de perto a imagem do grego.
- source_word: φανερωθέντος
  choice: foi revelado
  rationale: O particípio passivo indica que Cristo foi manifestado ou dado a conhecer abertamente. “Foi revelado” é atual, claro e preserva o valor teológico da manifestação.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: no fim dos tempos
  rationale: Reproduz de modo natural a força temporal e escatológica da expressão, sem acrescentar o demonstrativo “estes”, ausente do grego.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: διά com acusativo pode exprimir motivo, finalidade ou benefício. Neste contexto, a expressão comunica que a manifestação ocorreu em favor dos destinatários, preservando alguma amplitude semântica.
theological_decisions:
- issue: Sentido de προεγνωσμένου a respeito de Cristo antes da criação
  choice: Manter “conhecido de antemão” no texto principal.
  alternative: “escolhido de antemão” ou “predestinado”
  rationale: O verbo pode envolver propósito divino no uso bíblico, mas não exige que conhecimento prévio seja explicitado como eleição ou predestinação. A tradução conserva a tensão teológica e evita impor uma leitura denominacional.
- issue: Força temporal de ἐπ’ ἐσχάτου τῶν χρόνων
  choice: Traduzir por “no fim dos tempos”.
  alternative: “nestes últimos tempos”
  rationale: A alternativa é idiomática e possível, mas acrescenta um demonstrativo que não está expresso no grego. A opção principal mantém mais diretamente a formulação temporal do texto.
- issue: Valor de δι’ ὑμᾶς
  choice: Traduzir por “por causa de vocês”, esclarecendo em nota o possível sentido benefactivo.
  alternative: “em favor de vocês” ou “para vocês”
  rationale: A preposição com acusativo permite mais de uma nuance contextual. O texto principal conserva uma formulação ampla, enquanto a nota registra explicitamente a leitura benefactiva provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a expressão bíblica “fundação do mundo” e usa “vocês” para o plural de segunda pessoa. A ordem e os contrastes do grego são preservados sem sacrificar a fluidez.
