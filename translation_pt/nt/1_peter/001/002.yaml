  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: pt
  text: 'segundo a presciência[b] de Deus Pai, na santificação do Espírito, para a obediência e a aspersão com o sangue[c] de Jesus, o Messias[a]: Que a graça e a paz lhes sejam multiplicadas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός pode funcionar de maneira semelhante a um nome em alguns contextos; aqui foi traduzido por “Messias” para preservar seu sentido de título.
    reason: alternative_reading
  - marker: b
    text: “Presciência” traduz πρόγνωσις. Os intérpretes divergem quanto a saber se o termo enfatiza o conhecimento prévio de Deus, sua escolha prévia ou ambos.
    reason: lexical_alternative
  - marker: c
    text: A expressão “aspersão com o sangue” provavelmente evoca imagens de aliança e purificação do Antigo Testamento, especialmente Êxodo 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: segundo a presciência
  rationale: κατά com o acusativo expressa aqui conformidade ou norma. “Presciência” preserva o sentido lexical de πρόγνωσις sem decidir se a ênfase recai no conhecimento prévio, na escolha prévia ou em ambos.
- source_word: θεοῦ πατρός
  choice: de Deus Pai
  rationale: Os genitivos identificam aquele a quem pertence a presciência. “Deus Pai” é uma formulação natural e digna em português.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: na santificação do Espírito
  rationale: “Santificação” mantém o termo teológico expresso por ἁγιασμός. “Do Espírito” conserva a relativa abertura da construção genitiva, ao passo que a maiúscula identifica o referente como o Espírito Santo no contexto triádico.
- source_word: εἰς ὑπακοὴν
  choice: para a obediência
  rationale: εἰς indica finalidade ou resultado; “para a obediência” reproduz essa orientação de modo claro.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: e a aspersão com o sangue
  rationale: “Aspersão” corresponde a ῥαντισμός e conserva a imagem pactual e purificadora. A preposição “com” produz português natural sem eliminar a relação com o sangue.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: Χριστός conserva aqui força titular. A aposição “Jesus, o Messias” é idiomática em português e distingue o título de um simples sobrenome.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Que a graça e a paz lhes sejam
  rationale: A formulação preserva os destinatários plurais e introduz naturalmente em português o voto expresso pelo optativo grego.
- source_word: πληθυνθείη
  choice: multiplicadas
  rationale: O optativo exprime um desejo ou uma bênção. “Sejam multiplicadas” conserva tanto esse valor quanto a imagem de aumento abundante.
theological_decisions:
- issue: Sentido de πρόγνωσις em relação à eleição
  choice: presciência
  alternative: predeterminação; amor previamente determinado; mero conhecimento antecipado
  rationale: A tradução mantém a tensão do termo grego e não impõe uma solução doutrinária à relação entre conhecimento prévio e escolha divina.
- issue: Referente de πνεύματος
  choice: Espírito, com inicial maiúscula
  alternative: espírito humano ou sentido impessoal
  rationale: A estrutura triádica — Deus Pai, Espírito e Jesus, o Messias — favorece a referência ao Espírito Santo.
- issue: Força de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: A tradução explicita a força titular de Χριστός sem tratar o termo apenas como parte de um nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “presciência”, “santificação” e “aspersão” por sua precisão e importância teológica, sem tornar a sintaxe excessivamente arcaica. Os marcadores foram posicionados junto às expressões efetivamente explicadas por cada nota.
