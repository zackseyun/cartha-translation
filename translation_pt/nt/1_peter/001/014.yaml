source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: pt
  text: como filhos da obediência[a], não se amoldem aos desejos que vocês antes tinham em sua ignorância,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «filhos obedientes». O grego diz literalmente «filhos da obediência».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz a condição ou o caráter em que a exortação deve ser cumprida; «como» conserva com naturalidade essa força.
- source_word: τέκνα ὑπακοῆς
  choice: filhos da obediência
  rationale: Preserva a construção genitiva marcante do grego e sua força ética e identitária, embora «filhos obedientes» seja mais idiomático.
- source_word: μὴ συσχηματιζόμενοι
  choice: não se amoldem
  rationale: Expressa de modo corrente a proibição contextual e a participação responsável dos leitores, sem decidir de forma rígida entre as nuances média e passiva do particípio.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: aos desejos
  rationale: «Desejos» é amplo, atual e adequado ao valor moralmente negativo assumido pelo termo no contexto, sem restringi-lo indevidamente à esfera sexual.
- source_word: πρότερον
  choice: que vocês tinham antes
  rationale: Torna explícita em português natural a relação temporal do advérbio com os desejos da vida anterior.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: na sua ignorância
  rationale: Reproduz diretamente a expressão preposicional, preservando a referência ao estado anterior dos leitores sem acrescentar uma explicação teológica não expressa no versículo.
theological_decisions:
- issue: Se a expressão ética τέκνα ὑπακοῆς deve ser suavizada como uma construção adjetiva
  choice: filhos da obediência
  alternative: filhos obedientes
  rationale: A forma escolhida conserva a imagem identitária e a construção incomum do original, sem transformar sua força em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para leitura natural no Brasil. «Amoldem» comunica conformação a um padrão sem soar excessivamente técnico. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo 15.
