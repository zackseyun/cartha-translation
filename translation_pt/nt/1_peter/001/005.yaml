id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: pt
  text: que são guardados pelo poder de Deus, mediante a fé, para uma salvação pronta para ser revelada no último tempo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mediante a confiança”; menos provavelmente aqui, “mediante a fidelidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por ocasião do último tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: são guardados
  rationale: O particípio presente passivo indica uma ação contínua exercida sobre os destinatários. “Guardados” conserva o sentido protetor, possivelmente militar, de φρουρέω sem tornar a formulação pesada.
- source_word: ἐν δυνάμει θεοῦ
  choice: pelo poder de Deus
  rationale: Embora ἐν possa significar literalmente “em”, aqui funciona naturalmente como expressão de meio ou instrumento junto à forma passiva.
- source_word: διὰ πίστεως
  choice: mediante a fé
  rationale: διά com o genitivo indica meio. “Fé” é a correspondência principal de πίστις neste contexto; “confiança” continua possível, e “fidelidade” é menos provável.
- source_word: εἰς σωτηρίαν
  choice: para uma salvação
  rationale: εἰς expressa meta ou resultado e mantém a orientação futura. O artigo indefinido é natural em português porque “salvação” recebe a qualificação seguinte.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: pronta para ser revelada
  rationale: A construção de adjetivo com infinitivo passivo é expressa de modo direto e natural, preservando tanto a prontidão quanto a futura revelação.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: no último tempo
  rationale: καιρός designa um tempo decisivo ou determinado. “No último tempo” conserva o sentido escatológico sem impor um esquema técnico específico.
- source_word: τοὺς
  choice: que
  rationale: O artigo retoma os destinatários mencionados no contexto anterior; em português, o pronome relativo mantém naturalmente a ligação sintática.
theological_decisions:
- issue: Relação entre a preservação divina e a resposta humana em διὰ πίστεως
  choice: Deus guarda por seu poder, e a fé é apresentada como o meio dessa guarda.
  alternative: Entender a fé como mero elemento descritivo, sem função mediadora, ou interpretar πίστις principalmente como “fidelidade”.
  rationale: A sintaxe atribui a guarda ao poder de Deus e introduz a fé mediante διά. A tradução mantém ambos os elementos sem definir uma doutrina específica de perseverança ou apostasia.
- issue: Temporalidade escatológica da salvação
  choice: A salvação está pronta para uma revelação futura no último tempo.
  alternative: Restringir “salvação” apenas à conversão presente ou afirmar, com base somente neste versículo, que ela não possui dimensão presente alguma.
  rationale: A expressão “pronta para ser revelada no último tempo” aponta claramente para uma manifestação futura, sem resolver toda a amplitude temporal do conceito de salvação no Novo Testamento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Mediante a fé” evita a possível leitura causal de “por fé” e expressa com clareza o meio. A ordem das expressões acompanha de perto o grego sem sacrificar a naturalidade.
