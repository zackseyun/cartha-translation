  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do grego: os destinatários são objeto contínuo da guarda (φρουρουμένους), o poder de Deus é o meio/agente dessa guarda, e a fé é apresentada como meio mediador. «Para uma salvação pronta para ser revelada» preserva adequadamente εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι e sua orientação futura. «No último tempo» traduz de modo direto ἐν καιρῷ ἐσχάτῳ sem impor um esquema escatológico.'
