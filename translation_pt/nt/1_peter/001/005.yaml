  terminology: «Fé», «salvação», «poder de Deus» e «guardados» são escolhas terminológicas consistentes e semanticamente adequadas. As notas preservam alternativas lexicais reais para πίστις e para a expressão temporal, sem sobrecarregar o texto nem resolver questões teológicas além do que o versículo afirma.
