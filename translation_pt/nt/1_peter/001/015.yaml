source:
  edition: SBLGNT
  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: pt
  text: mas, assim como é santo aquele que os chamou, vocês mesmos também sejam[a] santos em toda a sua conduta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornem-se”. O imperativo grego pode enfatizar a entrada nesse estado ou sua manifestação, embora “sejam” seja a exortação mais natural aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou “em todo o seu modo de viver”. O termo grego pode abranger toda a maneira de viver de uma pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste com os desejos anteriores mencionados no contexto e é o adversativo mais natural em português.
- source_word: κατὰ
  choice: assim como
  rationale: 'Expressa correspondência ou conformidade: a santidade dos chamados deve corresponder à daquele que os chamou.'
- source_word: τὸν καλέσαντα ὑμᾶς
  choice: aquele que os chamou
  rationale: O particípio aoristo articulado tem função substantiva; esta formulação conserva essa referência pessoal com naturalidade.
- source_word: ἅγιον
  choice: é santo
  rationale: O adjetivo caracteriza aquele que chamou os leitores. A oração com cópula explícita completa naturalmente a comparação em português sem transformar o adjetivo no título “o Santo”.
- source_word: καὶ αὐτοὶ
  choice: vocês mesmos também
  rationale: “Vocês mesmos” preserva a ênfase de αὐτοί, enquanto “também” representa καί.
- source_word: ἅγιοι
  choice: santos
  rationale: Mantém a repetição lexical de ἅγιον e, assim, a correspondência deliberada entre a santidade de Deus e a vida dos chamados.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: em toda a sua conduta
  rationale: ἀναστροφή denota conduta ou modo de viver. “Toda a sua conduta” é conciso, claro e moralmente significativo.
- source_word: γενήθητε
  choice: sejam
  rationale: O imperativo aoristo de γίνομαι pode sugerir entrada ou manifestação nesse estado, mas “sejam” constitui a exortação mais natural e não impõe uma descrição específica do processo de santificação.
theological_decisions:
- issue: A santidade de Deus como padrão para os chamados
  choice: assim como é santo aquele que os chamou ... sejam santos
  alternative: segundo o Santo que os chamou ... tornem-se santos
  rationale: A formulação preserva a correspondência estabelecida pelo grego e deixa claro que a santidade daquele que chama fundamenta a exortação, sem acrescentar uma explicação doutrinária.
- issue: Força do imperativo γενήθητε
  choice: sejam santos
  alternative: tornem-se santos
  rationale: “Sejam santos” comunica diretamente a exortação e evita decidir se o aspecto verbal descreve sobretudo um processo, o ingresso num estado ou sua demonstração prática; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A colocação “aquele que os chamou” evita rigidez excessiva; “vocês mesmos também” conserva a ênfase do original. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
