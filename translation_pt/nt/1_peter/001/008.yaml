  source_fidelity: 'O texto transmite com fidelidade a sequência e as relações do grego: não terem visto Cristo e, ainda assim, amá-lo; não o verem agora, mas crerem nele e exultarem. «Embora» e «mesmo sem» expressam adequadamente o contraste concessivo implicado pela construção participial e por δέ. «Exultam» faz justiça à força de ἀγαλλιᾶσθε, e «alegria inexprimível e gloriosa» comunica bem χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ sem forçar uma interpretação confessional.'
  naturalness: O português é moderno, claro e apropriado a leitores internacionais, com boa legibilidade brasileira. O uso de «vocês» é coerente e a repetição do pronome sujeito contribui para clareza, sem tornar o período excessivamente pesado. «Inexprimível» e «exultam» pertencem a um registro bíblico moderno, digno e compreensível.
  terminology: «Crendo nele» preserva de modo transparente πιστεύοντες εἰς ὃν. «Gloriosa» é uma solução idiomática aceitável para o particípio perfeito passivo δεδοξασμένῃ neste contexto; a nota registra de forma útil a alternativa mais formal («glorificada») e a leitura explicativa («cheia de glória»). O marcador está corretamente ligado à expressão explicada.
