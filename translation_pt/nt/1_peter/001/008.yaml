id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: pt
  text: Embora não o tenham visto, vocês o amam. Mesmo sem vê-lo agora, crendo nele, vocês exultam com alegria inexprimível e gloriosa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «glorificada»; ou «cheia de glória».
    reason: A expressão grega usa um particípio perfeito passivo e admite tanto uma tradução formal quanto a ideia de uma alegria plena ou revestida de glória.
lexical_decisions:
- source_word: ὃν
  choice: o
  rationale: O pronome relativo retoma Jesus Cristo no contexto anterior. Em português, o pronome oblíquo «o» é natural como objeto de «visto» e «amam».
- source_word: οὐκ ἰδόντες
  choice: Embora não o tenham visto
  rationale: O particípio aoristo indica que os leitores não tiveram a experiência de ver Jesus; o pretérito perfeito composto do subjuntivo, em uma oração concessiva, comunica essa anterioridade com relevância presente de modo idiomático.
- source_word: ἀγαπᾶτε
  choice: vocês o amam
  rationale: O presente indica uma realidade atual e contínua. «Amam» preserva de forma direta o sentido de ἀγαπάω.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: Mesmo sem vê-lo agora
  rationale: A formulação preserva tanto o contraste temporal de ἄρτι («agora») quanto a ausência presente de visão expressa pelo particípio.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: crendo nele
  rationale: Com πιστεύω, εἰς identifica o objeto da fé. «Crendo nele» é conciso, corrente e mantém a forma participial do grego.
- source_word: δὲ
  choice: Mesmo sem ... crendo
  rationale: A partícula introduz contraste entre não ver e ainda assim crer. Em português, a construção concessiva com «mesmo sem» expressa esse contraste com naturalidade, sem exigir um «mas» rígido.
- source_word: ἀγαλλιᾶσθε
  choice: vocês exultam
  rationale: O verbo denota alegria intensa. «Exultam» conserva essa força melhor que o mais genérico «alegram-se», permanecendo compreensível no registro bíblico moderno.
- source_word: χαρᾷ
  choice: com alegria
  rationale: O dativo exprime modo ou acompanhamento; «com alegria» é a construção portuguesa natural.
- source_word: ἀνεκλαλήτῳ
  choice: inexprimível
  rationale: Descreve uma alegria que não pode ser plenamente expressa em palavras. «Inexprimível» é preciso, atual e digno.
- source_word: δεδοξασμένῃ
  choice: gloriosa
  rationale: O particípio perfeito passivo modifica «alegria» e comunica sua relação ou revestimento de glória. «Gloriosa» é a equivalência portuguesa mais natural; a forma mais literal e a leitura expansiva ficam registradas em nota.
theological_decisions:
- issue: Sentido de πιστεύοντες com εἰς ὃν
  choice: crendo nele
  alternative: confiando nele
  rationale: «Crendo nele» mantém a ligação lexical com fé/crer e identifica claramente Cristo como objeto da fé. «Confiando nele» explicita uma nuance legítima, mas não precisa substituir a formulação mais transparente no texto principal.
- issue: Sentido de δεδοξασμένῃ aplicado à alegria
  choice: alegria ... gloriosa
  alternative: alegria glorificada; alegria cheia de glória
  rationale: O grego emprega um particípio perfeito passivo incomum, que pode ser entendido como «glorificada», «revestida/cheia de glória» ou, idiomaticamente, «gloriosa». O texto principal usa português natural, e a nota preserva a forma e a amplitude da expressão grega sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para a segunda pessoa do plural. A estrutura concessiva reproduz o contraste entre não ver e amar/crer, enquanto «exultam» retém a intensidade do verbo grego. O marcador [a] foi colocado junto à expressão que a nota explica.
