  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: pt
  text: para uma herança incorruptível, sem mancha e imperecível, reservada nos céus para vocês,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: herança
  rationale: Equivalente direto e natural, preservando a ideia bíblica de uma porção recebida como herança.
- source_word: ἄφθαρτον
  choice: incorruptível
  rationale: Expressa aquilo que não está sujeito à deterioração ou destruição.
- source_word: ἀμίαντον
  choice: incontaminável
  rationale: Preserva o sentido de algo não manchado, não profanado e imune à contaminação.
- source_word: ἀμάραντον
  choice: imperecível
  rationale: Comunica a imagem de algo que não murcha nem perde seu vigor ou esplendor, sem repetir exatamente o campo lexical de “incorruptível”.
- source_word: τετηρημένην
  choice: reservada
  rationale: O particípio perfeito passivo indica que a herança foi guardada e permanece assegurada; “reservada” é natural em português e concorda com “herança”.
- source_word: ἐν οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural do grego e a formulação bíblica corrente.
- source_word: εἰς ὑμᾶς
  choice: para vocês
  rationale: Expressa a destinação da herança aos destinatários em linguagem moderna e amplamente compreensível.
theological_decisions:
- issue: Relação de εἰς κληρονομίαν com o versículo anterior
  choice: para uma herança
  alternative: rumo a uma herança
  rationale: Embora εἰς possa indicar movimento ou finalidade, “para uma herança” preserva a ligação sintática e a orientação final sem impor uma espacialização incomum em português.
- issue: Segurança presente da herança no particípio perfeito τετηρημένην
  choice: reservada
  alternative: guardada
  rationale: “Reservada” comunica que Deus a mantém assegurada para os destinatários, sem acrescentar uma explicação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sequência tríplice de adjetivos foi preservada para reproduzir a ênfase retórica do grego; não foram adicionadas notas por não haver ambiguidade que exija esclarecimento editorial.
