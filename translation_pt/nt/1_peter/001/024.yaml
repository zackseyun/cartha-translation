  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: pt
  text: porque toda carne é como a erva[a], e toda a sua glória[b] é como a flor da erva; a erva secou, e a flor caiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade”. O grego diz literalmente “toda carne”, ecoando Isaías 40:6 e ressaltando a mortalidade humana.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo o seu esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: porque
  rationale: Introduz a razão bíblica para a afirmação anterior e preserva claramente a relação causal.
- source_word: πᾶσα σὰρξ
  choice: toda carne
  rationale: Mantém a expressão concreta do grego e a alusão a Isaías 40:6, onde a carne representa a humanidade em sua fragilidade e mortalidade.
- source_word: ὡς χόρτος
  choice: como a erva
  rationale: Preserva a comparação e emprega um termo natural e de ampla compreensão para a vegetação passageira evocada pela citação.
- source_word: πᾶσα δόξα αὐτῆς
  choice: toda a sua glória
  rationale: Conserva o valor de δόξα e seu eco bíblico; o pronome retoma coletivamente “carne”.
- source_word: ὡς ἄνθος χόρτου
  choice: como a flor da erva
  rationale: Reproduz de perto a imagem genitiva do texto grego sem substituí-la pela tradicional, mas menos precisa, “flor do campo”.
- source_word: ἐξηράνθη
  choice: secou
  rationale: Expressa de modo corrente o ressecamento da erva e preserva o aspecto incisivo da imagem poética.
- source_word: ἐξέπεσεν
  choice: caiu
  rationale: É a formulação portuguesa mais natural para a queda da flor, sem acrescentar ao texto uma referência explícita ao caule.
theological_decisions:
- issue: Sentido de σάρξ na citação sobre a mortalidade humana
  choice: toda carne
  alternative: toda a humanidade
  rationale: Aqui σάρξ não designa uma natureza moralmente pecaminosa, mas os seres humanos como mortais e passageiros. A tradução literal preserva essa tensão e a ligação intertextual com Isaías 40:6.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e o ponto e vírgula preservam o fluxo poético da citação; a omissão de “é” antes da segunda comparação reproduz naturalmente a elipse do grego.
