id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: pt
  text: Mas a palavra do Senhor permanece para sempre”. E esta é a palavra que foi anunciada a vocês como boa notícia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a palavra que foi pregada a vocês como evangelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: palavra
  rationale: “Palavra” preserva o eco direto de Isaías 40:8 e funciona nas duas ocorrências, sem eliminar os sentidos possíveis de palavra falada ou mensagem.
- source_word: κυρίου
  choice: do Senhor
  rationale: É a tradução natural do genitivo e mantém tanto a linguagem da citação bíblica quanto sua aplicação no contexto cristão.
- source_word: μένει
  choice: permanece
  rationale: Expressa continuidade duradoura em português atual e digno.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É o equivalente idiomático mais claro para a duração ilimitada indicada pela expressão grega.
- source_word: τοῦτο δέ ἐστιν
  choice: E esta é
  rationale: O “E” representa a transição leve marcada por δέ e liga a citação à aplicação feita por Pedro.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: a palavra que foi anunciada [...] como boa notícia
  rationale: Conserva “palavra” para manter a ligação com a citação e explicita a força verbal de εὐαγγελίζω, isto é, anunciar boas notícias.
- source_word: εἰς ὑμᾶς
  choice: a vocês
  rationale: Indica naturalmente os destinatários do anúncio e oferece ampla legibilidade no português moderno.
theological_decisions:
- issue: Relação entre “a palavra do Senhor” na citação de Isaías 40:8 e a mensagem anunciada aos leitores
  choice: Manter “a palavra do Senhor” na citação e identificá-la, na segunda frase, com a palavra anunciada como boa notícia aos leitores.
  alternative: Traduzir interpretativamente as duas ocorrências como “a mensagem do Senhor”.
  rationale: A redação preserva o eco das Escrituras e a aplicação evangelística feita por Pedro, sem reduzir antecipadamente “palavra” ao sentido mais estreito de “mensagem”.
- issue: Tradução de εὐαγγελισθέν
  choice: Usar a formulação verbal “foi anunciada [...] como boa notícia”.
  alternative: “Foi pregada a vocês como evangelho”.
  rationale: A escolha comunica de modo transparente a força de εὐαγγελίζω sem acrescentar conteúdo doutrinário nem depender de vocabulário eclesiástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “vocês” torna explícito o plural de ὑμᾶς. A aspas de fechamento pertence à citação iniciada nos versículos anteriores.
