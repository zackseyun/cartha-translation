id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: pt
  text: para que a autenticidade comprovada da fé de vocês[a] — mais preciosa do que o ouro, que perece embora seja provado pelo fogo — resulte em louvor, glória e honra[b] na revelação de Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a prova da fé de vocês”. O termo grego pode destacar tanto o processo de provar quanto a autenticidade demonstrada por esse processo.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “seja achada para louvor, glória e honra”.'
    reason: literal_rendering
  - marker: c
    text: 'Ou: “Jesus Cristo”. Aqui, “Messias” traduz o título grego Χριστός conforme seu significado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: autenticidade comprovada
  rationale: Expressa o sentido resultativo daquilo que, submetido à prova, se mostra genuíno, sem excluir totalmente a nuance do processo de provar.
- source_word: πίστεως
  choice: fé
  rationale: É o equivalente corrente e contextualmente adequado para a confiança dos destinatários que é submetida a provações.
- source_word: πολυτιμότερον
  choice: mais preciosa
  rationale: Preserva a comparação de valor com o ouro em português natural.
- source_word: χρυσίου
  choice: ouro
  rationale: Equivalente lexical direto no genitivo de comparação.
- source_word: ἀπολλυμένου
  choice: que perece
  rationale: Mantém a força verbal e o contraste entre a natureza perecível do ouro e o valor da fé comprovada.
- source_word: διὰ πυρὸς
  choice: pelo fogo
  rationale: Expressa naturalmente o meio pelo qual o ouro é provado.
- source_word: δοκιμαζομένου
  choice: seja provado
  rationale: Mantém a ideia de teste ou verificação do ouro sem restringi-la ao refinamento metalúrgico.
- source_word: εὑρεθῇ εἰς
  choice: resulte em
  rationale: Comunica com clareza o resultado escatológico, embora a formulação grega seja mais literalmente 'seja achada para'; a alternativa é registrada em nota.
- source_word: ἔπαινον
  choice: louvor
  rationale: Equivalente padrão que preserva a abertura quanto à fonte ou ao destinatário do louvor.
- source_word: δόξαν
  choice: glória
  rationale: Equivalente consagrado e adequado à tríade escatológica.
- source_word: τιμήν
  choice: honra
  rationale: Transmite reconhecimento e estima pública no contexto da tríade.
- source_word: ἐν ἀποκαλύψει
  choice: na revelação
  rationale: Preserva a formulação nominal e permite o sentido temporal de 'por ocasião da revelação' sem o explicitar excessivamente.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός segundo o sentido do título, em formulação idiomática portuguesa.
theological_decisions:
- issue: Sentido de τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: A autenticidade da fé demonstrada pelas provações
  alternative: O processo de pôr a fé à prova
  rationale: δοκίμιον pode focalizar a prova ou a qualidade aprovada resultante; o contexto e a comparação com o ouro favorecem o sentido resultativo, enquanto a nota preserva a alternativa.
- issue: Referente de 'louvor, glória e honra'
  choice: Manter implícitos a fonte e o destinatário da tríade
  alternative: Honra concedida aos fiéis; louvor dirigido a Deus ou ao Messias; vindicação escatológica combinada
  rationale: O grego não identifica explicitamente quem recebe ou concede esses elementos; explicitar isso importaria uma resolução teológica não exigida pelo texto.
- issue: Valor de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A tradução pelo significado do título torna seu conteúdo perceptível, enquanto a nota registra a forma tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a longa comparação parentética e a ambiguidade teológica da tríade final. Os travessões facilitam a leitura sem desarticular a sintaxe.
