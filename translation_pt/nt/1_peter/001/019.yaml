  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: pt
  text: mas com o precioso sangue do Messias[a], como o de um cordeiro sem defeito e sem mancha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de Cristo”. O título grego Χριστός significa “Messias”; “Cristo” é sua forma tradicional em português.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o forte contraste com a negação do versículo anterior e liga naturalmente este fragmento ao contexto.
- source_word: τιμίῳ αἵματι
  choice: com o precioso sangue
  rationale: Mantém a imagem concreta do sangue e expressa tanto seu grande valor quanto sua honra, sem substituir a linguagem sacrificial por uma explicação.
- source_word: ὡς ἀμνοῦ
  choice: como o de um cordeiro
  rationale: Torna claro em português que a comparação se refere ao sangue, preservando a imagem sacrificial do cordeiro.
- source_word: ἀμώμου καὶ ἀσπίλου
  choice: sem defeito e sem mancha
  rationale: Conserva os dois qualificativos distintos e seu provável sentido sacrificial; a formulação é clara, paralela e natural em português.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Neste contexto, Χριστός funciona como título; “Messias” comunica de modo transparente o sentido do termo e mantém a ligação com o contexto sacrificial e messiânico.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: do Messias
  alternative: de Cristo
  rationale: O genitivo identifica o sangue como sendo do Messias. A tradução principal preserva o valor titular de Χριστός; a forma tradicional “Cristo” permanece em nota como alternativa legítima.
- issue: Relação da comparação introduzida por ὡς
  choice: o sangue é comparado ao de um cordeiro sem defeito e sem mancha
  alternative: formular diretamente o Messias como cordeiro
  rationale: A construção grega permite reconhecer a forte identificação simbólica, mas sua forma imediata compara o sangue ao de um cordeiro. A tradução evita explicitar além do que a sintaxe afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o texto fornecido é um fragmento que continua no versículo seguinte.
