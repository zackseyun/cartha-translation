id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: pt
  text: investigando a que pessoa ou a que tipo de tempo o Espírito do Messias que estava neles indicava, ao dar testemunho antecipado dos sofrimentos destinados ao Messias[a] e das glórias que se seguiriam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sofrimentos do Messias”.'
    reason: A construção grega com εἰς admite uma relação direcional ou referencial com o Messias, mas também pode ser entendida, no contexto, como os sofrimentos por ele experimentados.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: investigando
  rationale: O particípio dá continuidade à atividade dos profetas mencionada no versículo anterior e comunica uma busca atenta; “investigando” é natural e mantém a força examinadora do verbo.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: a que pessoa ou a que tipo de tempo
  rationale: 'Mantém a difícil construção grega e sua investigação dupla: τίνα pode apontar para uma pessoa, enquanto ποῖον qualifica o tempo. “Que tipo de tempo” preserva melhor a nuance qualitativa de ποῖον.'
- source_word: ἐδήλου
  choice: se referia
  rationale: No contexto da pergunta sobre pessoa e tempo, exprime aquilo que o Espírito indicava. O imperfeito é refletido pela perífrase verbal dentro da ação contínua de investigação.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: o Espírito do Messias que estava neles
  rationale: Preserva tanto a associação direta do Espírito com o Messias quanto sua presença nos profetas, sem explicar além do texto.
- source_word: προμαρτυρόμενον
  choice: quando dava testemunho antecipado
  rationale: Conserva o elemento de testemunho e o sentido temporal do prefixo προ-, evitando reduzi-lo simplesmente a “predizia”.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: os sofrimentos reservados ao Messias
  rationale: Representa a direção ou referência expressa por εἰς sem tratá-la automaticamente como genitivo possessivo. Como a construção admite outra leitura forte, ela é registrada em nota.
- source_word: Χριστοῦ / Χριστόν
  choice: Messias
  rationale: Χριστός funciona aqui como título; “Messias” traduz seu valor, em vez de apenas transliterá-lo como “Cristo”.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: as glórias que viriam depois
  rationale: Mantém o plural “glórias” e torna natural em português a relação temporal com os sofrimentos.
theological_decisions:
- issue: Sentido de “Espírito do Messias” em relação aos profetas
  choice: Manter “o Espírito do Messias que estava neles”
  alternative: o Espírito profético que falava a respeito do Messias; o Espírito dado pelo Messias
  rationale: A formulação grega associa diretamente o Espírito ao Messias e afirma sua presença nos profetas. A tradução conserva essa densidade cristológica sem a reduzir a uma paráfrase interpretativa.
- issue: Força de εἰς em τὰ εἰς Χριστὸν παθήματα
  choice: os sofrimentos reservados ao Messias
  alternative: os sofrimentos do Messias; os sofrimentos referentes ao Messias
  rationale: A preposição εἰς não é a maneira mais direta de exprimir posse, podendo sugerir sofrimentos dirigidos, destinados ou relativos ao Messias. A leitura tradicional e contextualmente plausível é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a investigação dupla e a ambiguidade relevante da expressão sobre os sofrimentos, sem impor uma solução denominacional.
