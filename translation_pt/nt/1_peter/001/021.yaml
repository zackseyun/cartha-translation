  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: pt
  text: vocês que, por meio dele, creem em Deus[a], que o ressuscitou dentre os mortos e lhe deu glória, de modo que a fé e a esperança de vocês estão em Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fiéis»; neste contexto, a expressão provavelmente se refere aos que creem em Deus por meio de Cristo.
    reason: lexical_alternative
  - marker: b
    text: Ou «com o resultado de que a fé e a esperança de vocês estão em Deus».
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: διά com o genitivo indica mediação ou meio; a expressão comunica que é por meio de Cristo que os leitores creem em Deus, sem exagerar a ideia de agência direta.
- source_word: πιστοὺς εἰς θεόν
  choice: creem em Deus
  rationale: Embora πιστός também possa significar «fiel», sua construção com εἰς θεόν favorece aqui o sentido de crer ou confiar em Deus. A forma verbal é mais natural em português do que «crentes em Deus».
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: que o ressuscitou dentre os mortos
  rationale: Expressa com clareza a linguagem grega da ressurreição; «dentre os mortos» preserva a força de ἐκ νεκρῶν.
- source_word: δόξαν αὐτῷ δόντα
  choice: e lhe deu glória
  rationale: Mantém o paralelismo dos particípios aoristos e traduz diretamente a concessão de glória a Cristo por Deus.
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz naturalmente a consequência decorrente de Deus ter ressuscitado e glorificado Cristo, sem excluir por completo uma nuance de propósito.
- source_word: πίστιν ὑμῶν καὶ ἐλπίδα
  choice: a fé e a esperança de vocês
  rationale: «Fé» e «esperança» são equivalentes claros e consagrados, enquanto «de vocês» oferece ampla legibilidade no português moderno.
- source_word: εἶναι εἰς θεόν
  choice: estão em Deus
  rationale: O infinitivo regido por ὥστε descreve o estado resultante, e «em Deus» expressa idiomaticamente o objeto ou direção da fé e da esperança.
theological_decisions:
- issue: Sentido de πιστούς
  choice: «creem», referindo-se aos que creem em Deus por meio de Cristo
  alternative: «são fiéis» ou «fiéis»
  rationale: A expressão εἰς θεόν favorece a ideia de fé dirigida a Deus, embora o valor lexical de fidelidade seja genuíno e por isso conste em nota.
- issue: Mediação de Cristo
  choice: «por meio dele»
  alternative: «por causa dele» ou «mediante ele»
  rationale: A tradução preserva a mediação indicada por διά com o genitivo sem acrescentar uma formulação doutrinária que vá além do texto.
- issue: Força da oração introduzida por ὥστε
  choice: «de modo que», com ênfase no resultado
  alternative: «para que», com maior ênfase no propósito
  rationale: O contexto favorece a consequência das ações de Deus em Cristo, mas a construção pode comportar uma nuance de propósito; a nota conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural de segunda pessoa. «Por meio dele» e «de modo que» mantêm a lógica do grego com fluidez. A redação começa como oração relativa porque o versículo integra a frase iniciada no contexto anterior.
