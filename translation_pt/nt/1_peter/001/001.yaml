id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: pt
  text: 'Pedro, apóstolo de Jesus, o Messias[a], aos escolhidos[b] que vivem como estrangeiros[c] da dispersão[d] no Ponto, na Galácia, na Capadócia, na Ásia e na Bitínia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Jesus Cristo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «eleitos».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «residentes temporários», «peregrinos» ou «forasteiros».'
    reason: lexical_alternative
  - marker: d
    text: A expressão «da dispersão» pode evocar tanto a Diáspora judaica como, de modo mais amplo, o povo de Deus vivendo longe de sua verdadeira pátria.
    reason: cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Pedro
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o título reconhecido e a reivindicação de autoridade do remetente, em vez de reduzi-lo ao sentido genérico de mensageiro.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Expressa Χριστός como título messiânico em português natural; a vírgula e o artigo tornam a aposição idiomática sem apagar a alternativa tradicional «Jesus Cristo».
- source_word: ἐκλεκτοῖς
  choice: escolhidos
  rationale: Comunica diretamente a ideia de pessoas escolhidas, evitando que o termo técnico «eleitos» imponha por si só um sistema teológico específico.
- source_word: παρεπιδήμοις
  choice: que vivem como estrangeiros
  rationale: Indica pessoas que residem fora de sua terra ou de seu lugar de pertença. A formulação corrente evita tanto o tom burocrático de «estrangeiros residentes» quanto uma interpretação exclusivamente espiritual de «peregrinos».
- source_word: διασπορᾶς
  choice: da dispersão
  rationale: Mantém a construção genitiva e sua possível evocação da Diáspora judaica, sem limitar a expressão a um sentido exclusivamente étnico ou exclusivamente metafórico.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: no Ponto, na Galácia, na Capadócia, na Ásia e na Bitínia
  rationale: Usa as formas geográficas convencionais em português e acrescenta as preposições e artigos exigidos pela fluência da língua.
theological_decisions:
- issue: Sentido de ἐκλεκτοῖς
  choice: escolhidos
  alternative: eleitos
  rationale: Afirma que os destinatários foram escolhidos sem transformar o adjetivo, no texto principal, em um rótulo ligado a uma formulação doutrinária particular.
- issue: Relação entre παρεπιδήμοις e διασπορᾶς
  choice: estrangeiros da dispersão
  alternative: peregrinos espirituais ou membros étnicos da Diáspora judaica
  rationale: Conserva juntas as dimensões social, geográfica e teológica da expressão, sem decidir se a referência é exclusivamente literal, étnica ou metafórica.
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Mantém explícita a força titular e messiânica de Χριστός, oferecendo em nota a forma tradicional portuguesa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A saudação mantém a estrutura epistolar do grego, mas usa «que vivem como estrangeiros» para evitar uma sequência nominal rígida e pouco natural. Os dois-pontos encerram adequadamente o cabeçalho e preparam a continuação da frase no versículo seguinte.
