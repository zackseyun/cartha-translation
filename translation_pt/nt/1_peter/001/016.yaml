  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: pt
  text: 'pois está escrito: “Sejam santos[a], porque eu sou santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, segundo a forma futura do grego: “Vocês serão santos”. Nesse contexto bíblico, o futuro tem força de ordem.'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: pois
  rationale: Introduz a base bíblica da exortação anterior; “pois” preserva o valor causal e soa natural na ligação com o contexto.
- source_word: γέγραπται
  choice: está escrito
  rationale: Fórmula consagrada para introduzir uma citação das Escrituras, preservando o sentido vigente do perfeito passivo.
- source_word: ὅτι (primeiro)
  choice: marcado por dois-pontos e aspas
  rationale: Introduz a citação; em português, a pontuação e as aspas exercem essa função com mais naturalidade do que um “que” explícito.
- source_word: Ἅγιοι
  choice: santos
  rationale: Expressa adequadamente a santidade ética e pactual requerida, sem reduzi-la apenas à ideia de separação.
- source_word: ἔσεσθε
  choice: sejam
  rationale: Embora a forma grega seja futura, ela reproduz uma formulação bíblica com força imperativa. Em português contemporâneo, “sejam” comunica essa força de modo claro; a forma do original é registrada em nota.
- source_word: ὅτι (segundo)
  choice: porque
  rationale: Apresenta a santidade de Deus como fundamento da exortação.
- source_word: ἐγὼ
  choice: eu
  rationale: Mantém o pronome explícito e a ênfase da autorreferência divina.
- source_word: ἅγιος
  choice: santo
  rationale: Mantém a correspondência lexical com “santos” e evidencia que a santidade de Deus fundamenta a do seu povo.
theological_decisions:
- issue: Força do futuro ἔσεσθε na citação sobre santidade
  choice: “Sejam santos”, com nota sobre a forma futura grega
  alternative: “Vocês serão santos” ou “Sereis santos”
  rationale: No contexto da citação levítica, o futuro tem força prescritiva. O imperativo em português transmite essa função com clareza, enquanto a nota preserva a forma e a tensão presentes no grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Pois está escrito” mantém o tom bíblico sem arcaísmo excessivo; “sejam” evita o regionalismo de “sede” e comunica diretamente a força exortativa.
