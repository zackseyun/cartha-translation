source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: pt
  text: Tendo purificado as suas almas pela obediência à verdade, para um amor fraternal sincero[a], amem uns aos outros intensamente, de coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor pelos irmãos e irmãs na fé”; no grego, “amor fraternal” indica afeição familiar entre os que creem, incluindo tanto mulheres como homens.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “de coração puro”.
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: Tendo purificado
  rationale: Preserva a forma participial e apresenta uma ação realizada com relevância contínua, anterior à exortação principal.
- source_word: ψυχὰς ὑμῶν
  choice: a alma de vocês
  rationale: “Alma” mantém o equivalente lexical direto de ψυχή, aqui referente às próprias pessoas em sua vida interior; o singular coletivo é natural no português.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: pela obediência à verdade
  rationale: Expressa de modo natural o provável valor instrumental de ἐν com dativo, sem excluir por completo a ideia de esfera.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: para um amor fraternal sincero
  rationale: “Para” conserva a noção de finalidade ou resultado de εἰς; “amor fraternal” distingue φιλαδελφία do verbo ἀγαπάω que vem depois, e “sincero” comunica a ausência de hipocrisia.
- source_word: ἐκ καρδίας
  choice: de coração
  rationale: Traduz diretamente o texto da SBLGNT sem introduzir o adjetivo “puro”, presente em uma variante manuscrita.
- source_word: ἀλλήλους ἀγαπήσατε ἐκτενῶς
  choice: amem uns aos outros intensamente
  rationale: O imperativo simples reproduz a exortação decisiva; “intensamente” comunica a força e a persistência de ἐκτενῶς em português atual.
theological_decisions:
- issue: Distinção entre φιλαδελφία e ἀγαπάω no mesmo versículo
  choice: “amor fraternal” para φιλαδελφία e “amem” para ἀγαπήσατε
  alternative: Traduzir ambos apenas com formas de “amor” sem qualificação
  rationale: A escolha preserva a textura lexical e a progressão retórica do grego, sem afirmar que os termos designem categorias teológicas rigidamente separadas.
- issue: Abrangência de gênero de φιλαδελφία
  choice: Manter “amor fraternal” no texto e explicar sua abrangência em nota
  alternative: “amor pelos irmãos e irmãs” ou “amor pelos demais cristãos”
  rationale: “Amor fraternal” conserva a imagem familiar e a distinção lexical, enquanto a nota esclarece que o termo inclui mulheres e homens da comunidade.
- issue: Variante textual após ἐκ καρδίας
  choice: “de coração”
  alternative: “de coração puro”
  rationale: A SBLGNT traz ἐκ καρδίας sem adjetivo; a leitura com “puro” é preservada somente em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo o particípio inicial, a relação entre purificação e obediência e os dois termos ligados ao amor.
