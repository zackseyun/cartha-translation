id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: pt
  text: A respeito dessa salvação, os profetas que profetizaram sobre a graça para vocês[a] buscaram e investigaram cuidadosamente,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a graça que viria para vocês”. O sentido futuro costuma ser inferido do contexto, embora não esteja expresso de forma explícita neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: A respeito dessa salvação
  rationale: περί com o genitivo introduz o assunto, e ἧς retoma a salvação mencionada no contexto anterior. “Dessa salvação” expressa essa referência de modo natural em português.
- source_word: σωτηρίας
  choice: salvação
  rationale: Mantém o sentido soteriológico de σωτηρία e a continuidade lexical e temática com o contexto.
- source_word: ἐξεζήτησαν
  choice: buscaram
  rationale: O verbo comunica procura empenhada. “Buscaram” é claro e permite conservar a sequência enfática dos dois verbos gregos.
- source_word: ἐξηραύνησαν
  choice: investigaram cuidadosamente
  rationale: Expressa a ideia de examinar ou pesquisar a fundo e distingue este verbo do anterior, preservando a intensificação retórica.
- source_word: προφῆται
  choice: os profetas
  rationale: Embora o substantivo não tenha artigo, a expressão participial atributiva seguinte identifica o grupo. O artigo definido é natural em português para os profetas assim especificados.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: que profetizaram sobre a graça para vocês
  rationale: A oração relativa reproduz a função atributiva do particípio; περί indica o conteúdo da profecia, e εἰς ὑμᾶς conserva aqui uma nuance direcional e de benefício.
- source_word: χάριτος
  choice: graça
  rationale: “Graça” preserva o termo teológico corrente e o sentido do favor gracioso de Deus neste contexto.
- source_word: εἰς ὑμᾶς
  choice: para vocês
  rationale: A formulação é natural, amplamente compreensível e preserva tanto a direção quanto o benefício sem acrescentar uma referência temporal ausente do grego.
theological_decisions:
- issue: Tornar explícito um elemento futuro em “a graça para vocês”
  choice: Manter “a graça para vocês” sem acrescentar no texto principal “que viria”
  alternative: a graça que viria para vocês
  rationale: A orientação futura pode ser inferida do contexto e da função prospectiva dos profetas, mas não é expressa por verbo ou particípio futuro neste versículo. A nota preserva a leitura contextual sem incorporá-la silenciosamente ao texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para inteligibilidade internacional com boa legibilidade brasileira. A ordem do grego foi mantida porque permanece clara em português; a vírgula final indica que a frase continua no versículo seguinte.
