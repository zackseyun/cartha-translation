  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: pt
  text: E, se vocês invocam como Pai aquele que julga com imparcialidade segundo a obra de cada um, vivam com temor durante o tempo em que residem como estrangeiros.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com reverência» ou «com temor reverente».
    reason: lexical_alternative
  - marker: b
    text: Ou «durante o tempo do exílio de vocês». O termo grego pode indicar a vida de quem é estrangeiro ou residente temporário.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: invocam como
  rationale: O verbo médio pode indicar dirigir-se a Deus ou invocá-lo; com o predicativo πατέρα, «invocam como Pai» preserva ambas as ideias de modo natural.
- source_word: πατέρα
  choice: Pai
  rationale: Funciona como predicativo de ἐπικαλεῖσθε e se refere a Deus; a inicial maiúscula é apropriada em português.
- source_word: ἀπροσωπολήμπτως
  choice: com imparcialidade
  rationale: Expressa julgamento sem favoritismo ou consideração pelo status das pessoas.
- source_word: κρίνοντα
  choice: aquele que julga
  rationale: O particípio presente caracteriza Deus de modo contínuo; a oração relativa é natural em português.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: segundo a obra de cada um
  rationale: κατά indica o critério do julgamento, e o singular ἔργον é mantido sem impor uma explicação doutrinária.
- source_word: ἐν φόβῳ
  choice: com temor
  rationale: «Temor» mantém a amplitude entre medo, reverência e assombro reverente, além da seriedade moral do contexto.
- source_word: παροικίας
  choice: residem como estrangeiros
  rationale: A expressão comunica a condição de estrangeiro ou residente temporário em linguagem atual, sem especificar exílio político.
- source_word: ἀναστράφητε
  choice: vivam
  rationale: Neste uso de ἀναστρέφω, o imperativo diz respeito à maneira de conduzir toda a vida; «vivam» é claro e idiomático.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: durante o tempo em que residem como estrangeiros
  rationale: O acusativo marca duração, e a formulação conserva tanto o elemento temporal quanto a condição de residência estrangeira.
theological_decisions:
- issue: Sentido de φόβος diante de Deus como Pai e juiz
  choice: temor
  alternative: medo; reverência; assombro reverente
  rationale: «Temor» preserva a tensão entre a relação filial e a responsabilidade diante do julgamento imparcial, sem reduzir o termo a mero medo nem suavizá-lo para simples reverência.
- issue: Julgamento segundo a obra de cada um
  choice: traduzir diretamente, sem definir um sistema de mérito ou uma doutrina específica do juízo
  alternative: explicitar juízo final das obras dos crentes; entender apenas como princípio geral de avaliação divina
  rationale: O grego afirma o critério individual do julgamento, mas não desenvolve aqui como isso se relaciona com mérito, salvação ou segurança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» evita regionalismo excessivo; «residem como estrangeiros» comunica o sentido de παροικία com mais clareza corrente do que «peregrinação» ou «estadia». Os marcadores foram colocados junto às expressões a que se referem.
