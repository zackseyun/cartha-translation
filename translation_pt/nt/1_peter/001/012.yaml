id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: pt
  text: A eles foi revelado que, nessas coisas, não serviam a si mesmos, mas a vocês[a]. Essas coisas agora lhes foram anunciadas por meio daqueles que lhes comunicaram as boas-novas[b] pelo Espírito Santo enviado do céu[c] — coisas que os anjos anseiam examinar atentamente[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não prestavam esse serviço para si mesmos, mas para vocês». Os dativos gregos indicam os beneficiários do serviço dos profetas.
    reason: lexical_alternative
  - marker: b
    text: Ou «lhes anunciaram o evangelho». O grego emprega o verbo que significa anunciar ou comunicar boas-novas.
    reason: lexical_alternative
  - marker: c
    text: Ou «no Espírito Santo enviado do céu». O dativo grego pode indicar o meio pelo qual as boas-novas foram anunciadas ou a esfera em que isso ocorreu.
    reason: genuine_ambiguity
  - marker: d
    text: A expressão também pode ser traduzida por «espiar de perto» ou «inclinar-se para olhar», sugerindo observação intensa e interessada.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: A eles
  rationale: O pronome relativo no dativo retoma os profetas mencionados no versículo anterior. A formulação explicita de modo natural o objeto indireto em português.
- source_word: ἀπεκαλύφθη
  choice: foi revelado
  rationale: Preserva a voz passiva e o registro revelatório sem identificar expressamente o agente, que permanece implícito no grego.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: não serviam a si mesmos, mas a vocês
  rationale: Mantém o contraste entre os beneficiários do serviço profético. A nota registra a alternativa idiomática com «para».
- source_word: διηκόνουν
  choice: serviam
  rationale: O imperfeito indica uma atividade passada em curso. «Serviam» é atual e transparente, sem o tom eclesiástico que «ministravam» pode adquirir.
- source_word: αὐτά
  choice: nessas coisas
  rationale: Retoma os assuntos proféticos mencionados no contexto e os liga diretamente ao serviço prestado pelos profetas.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Essas coisas agora lhes foram anunciadas
  rationale: A nova oração evita uma cadeia excessivamente longa em português, preservando o passivo, o advérbio temporal e o vínculo com as realidades anteriormente profetizadas.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: por meio daqueles que lhes comunicaram as boas-novas
  rationale: Traduz o verbo εὐαγγελίζω de modo acessível e mantém διά como indicação de mediação. A nota oferece a formulação tradicional «anunciaram o evangelho».
- source_word: πνεύματι ἁγίῳ
  choice: pelo Espírito Santo
  rationale: O dativo é entendido no texto principal como instrumental, indicando o agente ou meio capacitador da proclamação. A nota preserva a possibilidade de leitura «no Espírito Santo».
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: enviado do céu
  rationale: A expressão modifica «Espírito Santo» e preserva de forma concisa o particípio passivo e a origem celestial.
- source_word: εἰς ἃ
  choice: coisas para as quais
  rationale: Conserva a força direcional de εἰς em português natural e fornece o antecedente necessário à oração final.
- source_word: ἐπιθυμοῦσιν
  choice: anseiam
  rationale: Expressa o desejo intenso e contínuo indicado pelo presente verbal, com registro digno e corrente.
- source_word: ἄγγελοι παρακύψαι
  choice: os anjos ... olhar atentamente
  rationale: Neste contexto, ἄγγελοι designa seres celestiais. «Olhar atentamente» comunica a observação interessada de παρακύπτω; a imagem mais concreta de inclinar-se para olhar é mantida em nota.
theological_decisions:
- issue: Referente de πνεύματι ἁγίῳ
  choice: Espírito Santo, entendido como agente divino da proclamação
  alternative: espírito santo como poder ou disposição espiritual não pessoal
  rationale: O contexto da revelação, da proclamação das boas-novas e do envio do céu favorece a referência ao Espírito Santo. A maiúscula identifica esse referente sem acrescentar ao conteúdo da frase.
- issue: Valor do dativo πνεύματι ἁγίῳ
  choice: 'instrumental: «pelo Espírito Santo»'
  alternative: 'esférico ou locativo: «no Espírito Santo»'
  rationale: Sem preposição expressa no texto fornecido, o dativo admite mais de uma nuance. O valor instrumental se ajusta bem à proclamação, mas a alternativa é registrada para não eliminar a ambiguidade sintática.
- issue: Relação entre o serviço dos profetas e os destinatários cristãos
  choice: Os profetas serviam aos crentes posteriores ao anunciarem antecipadamente as realidades agora proclamadas
  alternative: Os profetas serviam primordialmente a si mesmos ou somente à sua própria geração
  rationale: O contraste explícito entre «não a si mesmos» e «mas a vocês» apresenta os destinatários como beneficiários do serviço profético, sem negar que a mensagem também tivesse relevância no tempo dos profetas.
- issue: Conhecimento e interesse dos anjos
  choice: Os anjos desejam examinar atentamente essas realidades anunciadas
  alternative: Os anjos são apresentados como plenamente alheios ou, inversamente, como já possuidores de conhecimento exaustivo delas
  rationale: 'A tradução mantém a tensão do texto: há desejo intenso de observar, mas o versículo não define a extensão da compreensão angelical.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases alivia a longa estrutura grega sem romper a continuidade referencial. «Boas-novas» torna o verbo εὐαγγελίζω transparente; «evangelho» permanece em nota. Evitou-se linguagem eclesiástica desnecessária, e as ambiguidades do dativo referente ao Espírito Santo e da imagem de παρακύπτω foram preservadas em notas.
