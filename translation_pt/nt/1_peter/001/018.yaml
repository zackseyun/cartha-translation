id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: pt
  text: sabendo que não foi com coisas perecíveis, como prata ou ouro, que vocês foram resgatados[a] da maneira inútil de viver transmitida por seus pais[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “redimidos”. O verbo grego traz a ideia de libertação mediante o pagamento de um resgate.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdada de seus antepassados”. Literalmente, “transmitida pelos pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sabendo
  rationale: Preserva a forma participial e sua ligação com a exortação do contexto, com redação natural em português.
- source_word: οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ
  choice: não foi com coisas perecíveis, como prata ou ouro
  rationale: O adjetivo substantivado designa coisas sujeitas à deterioração; prata e ouro são apresentados como exemplos. A construção clivada mantém em português a ênfase inicial da negação grega.
- source_word: ἐλυτρώθητε
  choice: vocês foram resgatados
  rationale: O verbo expressa libertação mediante pagamento. “Resgatados” comunica de modo claro a imagem do resgate, reforçada pelo contraste com prata e ouro, sem especificar além do texto o mecanismo teológico.
- source_word: ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς
  choice: da maneira inútil de viver
  rationale: ἀναστροφή refere-se à conduta ou maneira de viver, e μάταιος indica aquilo que é vazio, ineficaz ou sem proveito. “Maneira inútil de viver” é clara e mantém essa avaliação.
- source_word: πατροπαραδότου
  choice: transmitida por seus pais
  rationale: Preserva tanto a ideia de algo recebido por tradição quanto a referência explícita aos pais no termo grego.
theological_decisions:
- issue: Terminologia de redenção ou resgate
  choice: resgatados
  alternative: redimidos
  rationale: “Resgatados” torna transparente a noção lexical de libertação mediante preço e se encaixa diretamente no contraste com prata e ouro. “Redimidos” também é possível, mas pode soar mais técnico e tornar menos imediata a metáfora econômica.
- issue: Linguagem da tradição herdada
  choice: transmitida por seus pais
  alternative: herdada de seus antepassados
  rationale: A escolha mantém a referência paternal explícita do grego sem excluir a possibilidade de que “pais” tenha o sentido mais amplo de antepassados.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural “vocês” explicita o referente plural de ὑμῶν e ἐλυτρώθητε. A vírgula final conserva a continuidade sintática com o versículo seguinte.
