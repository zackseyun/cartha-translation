id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: pt
  text: Por isso, preparem a mente para agir[a], mantenham-se lúcidos e depositem inteiramente a esperança[b] na graça que está sendo trazida a vocês na revelação de Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo cingido os lombos da mente de vocês”; isto é, preparando a mente para agir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mantenham-se plenamente lúcidos e depositem a esperança na graça”. O advérbio grego pode ser entendido com “mantenham-se lúcidos” ou com “depositem a esperança”.'
    reason: alternative_reading
  - marker: c
    text: 'Grego: “Jesus Cristo”. Aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Introduz de modo natural a conclusão prática decorrente do argumento anterior.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: preparem a mente para agir
  rationale: Expressa em português corrente o sentido da metáfora de cingir os lombos da mente; a imagem literal é preservada em nota.
- source_word: νήφοντες
  choice: mantenham-se lúcidos
  rationale: No contexto de preparação mental, o particípio indica clareza, vigilância e domínio mental, sem exigir uma referência literal à abstinência de vinho.
- source_word: τελείως
  choice: inteiramente
  rationale: No texto principal, o advérbio é ligado ao imperativo 'depositem a esperança'; a possível ligação com 'mantenham-se lúcidos' é registrada em nota.
- source_word: ἐλπίσατε ἐπί
  choice: depositem ... a esperança ... na
  rationale: Comunica a orientação deliberada e decisiva ordenada pelo imperativo aoristo.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: na graça que está sendo trazida a vocês
  rationale: Preserva o aspecto do particípio presente passivo e o movimento da graça em direção aos destinatários, embora seu pleno recebimento seja futuro.
- source_word: ἐν ἀποκαλύψει
  choice: na revelação
  rationale: Mantém a formulação compacta do grego e sua associação temporal com a manifestação de Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título messiânico ativo e usa uma construção idiomática em português.
theological_decisions:
- issue: Preservação da metáfora dos lombos da mente
  choice: Usar no texto principal a expressão idiomática 'preparem a mente para agir' e conservar a metáfora literal em nota.
  alternative: Tendo cingido os lombos da mente de vocês.
  rationale: A tradução literal soa obscura e pouco natural para muitos leitores modernos; a formulação principal comunica a função da imagem sem apagar sua forma original, documentada na nota.
- issue: Ligação sintática de τελείως
  choice: Ligar 'inteiramente' a 'depositem ... a esperança' no texto principal.
  alternative: 'Ligar o advérbio a ''mantenham-se lúcidos'': ''mantendo-se plenamente lúcidos''.'
  rationale: As duas ligações são gramaticalmente possíveis. A escolha principal produz uma exortação natural, enquanto a nota preserva a ambiguidade genuína.
- issue: Valor de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto escatológico, Χριστός permanece audível como título, e não precisa ser tratado como parte fixa de um nome próprio.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas à comunidade. A metáfora antiga é interpretada no corpo do texto para garantir compreensão ampla, mas sua forma é preservada em nota. Evitou-se 'sóbrios' porque o contexto enfatiza prontidão e lucidez mental, não um contraste explícito com embriaguez.
source_grounding:
  english_pob_role: consult_only
