id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: pt
  text: Bendito seja o Deus e Pai de nosso Senhor Jesus, o Messias[a], que, segundo a sua grande misericórdia, nos fez nascer de novo[b] para uma esperança viva, por meio da ressurreição de Jesus, o Messias, dentre os mortos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jesus Cristo”. O título grego Χριστός é traduzido aqui por “Messias” para preservar seu sentido de título.
    reason: alternative_reading
  - marker: b
    text: Ou “nos deu novo nascimento”. O verbo grego mantém a imagem de ser gerado ou nascer de novo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Bendito seja
  rationale: O adjetivo predicativo introduz uma exclamação de louvor. “Bendito seja” é a forma doxológica natural em português e preserva a força reverente do grego.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: o Deus e Pai
  rationale: O único artigo rege os dois substantivos, formando uma expressão relacional unificada. A tradução mantém tanto a estrutura quanto a especificidade teológica.
- source_word: κυρίου
  choice: Senhor
  rationale: κύριος funciona aqui como título, adequadamente traduzido por “Senhor”.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva o sentido de título, “Messias”, e não é tratado apenas como elemento de um nome. A aposição com artigo é idiomática em português.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: segundo a sua grande misericórdia
  rationale: κατά com acusativo indica conformidade ou medida. A formulação expressa que a ação divina corresponde à grandeza de sua misericórdia sem reduzir a expressão a mera causalidade.
- source_word: ἀναγεννήσας
  choice: nos fez nascer de novo
  rationale: A expressão preserva a imagem de novo nascimento e apresenta Deus explicitamente como o agente, como faz o particípio grego.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: para uma esperança viva
  rationale: εἰς indica finalidade ou resultado; “para” é natural em português, e “esperança viva” mantém a metáfora de ζῶσαν.
- source_word: δι’ ἀναστάσεως
  choice: por meio da ressurreição
  rationale: διά com genitivo indica o meio pelo qual ocorre o novo nascimento para a esperança.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: A expressão portuguesa preserva a ideia de ressurreição a partir do âmbito dos mortos sem se tornar artificial.
theological_decisions:
- issue: Tradução de Χριστός como título cristológico
  choice: Messias
  alternative: Cristo
  rationale: “Messias” torna explícito o valor titular de Χριστός. “Cristo” permanece uma alternativa tradicional legítima, registrada em nota, sem se apagar a natureza do termo no texto-fonte.
- issue: Agência divina em ἀναγεννήσας
  choice: nos fez nascer de novo
  alternative: nos deu novo nascimento
  rationale: O grego apresenta Deus como sujeito agente do novo nascimento. A formulação escolhida mantém essa agência e a imagem do nascimento sem acrescentar um sistema doutrinário além do que o versículo afirma.
- issue: Relação expressa por κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: segundo a sua grande misericórdia
  alternative: por causa de sua grande misericórdia
  rationale: A opção principal conserva a noção de conformidade ou medida presente em κατά, sem excluir a relação motivacional sugerida pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as relações sintáticas do grego são preservadas quando naturais; vírgulas marcam a aposição “o Messias” e a oração relativa. A repetição de “Jesus, o Messias” reflete a repetição integral do nome e título no texto-fonte.
