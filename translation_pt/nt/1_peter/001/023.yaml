  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: pt
  text: pois vocês foram gerados de novo, não de semente perecível, mas imperecível, por meio da palavra viva e permanente de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da palavra do Deus vivo e permanente”. Em grego, “vivo” e “permanente” podem descrever tanto a “palavra” como “Deus”, embora o contexto favoreça a primeira opção.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: vocês foram gerados de novo
  rationale: O particípio perfeito passivo expressa uma ação recebida, já realizada e com resultado presente. “Foram gerados de novo” preserva melhor a metáfora da geração ligada a σπορά do que “nasceram de novo”; “pois” explicita de modo natural em português o valor circunstancial do particípio no contexto.
- source_word: σπορᾶς
  choice: semente
  rationale: No contraste metafórico entre o perecível e o imperecível, “semente” é natural, claro e mantém a imagem de geração.
- source_word: φθαρτῆς
  choice: perecível
  rationale: Equivalente moderno e direto que forma um contraste lexical claro com “imperecível”.
- source_word: ἀφθάρτου
  choice: imperecível
  rationale: Mantém em português a oposição explícita com φθαρτῆς sem introduzir a conotação moral que “corruptível” pode adquirir.
- source_word: διὰ
  choice: por meio de
  rationale: Com o genitivo, διά indica meio ou instrumento; “por meio de” torna essa relação inequívoca e natural.
- source_word: λόγου
  choice: palavra
  rationale: Preserva o sentido lexical e a ligação contextual com a citação e a referência à palavra no versículo 25; “mensagem” seria possível, mas mais interpretativo.
- source_word: ζῶντος
  choice: viva
  rationale: Tradução adjetival direta do particípio presente, entendendo-o como modificador de “palavra”.
- source_word: θεοῦ
  choice: de Deus
  rationale: Reproduz naturalmente o genitivo dependente de λόγου, sem decidir além do necessário se a relação envolve posse, origem ou ambas.
- source_word: μένοντος
  choice: permanente
  rationale: Comunica em linguagem atual a continuidade expressa pelo particípio presente e combina naturalmente com “palavra”; “que permanece” seria mais verbal, mas menos compacto.
theological_decisions:
- issue: 'Ligação sintática de ζῶντος e μένοντος: com “palavra” ou com “Deus”'
  choice: “a palavra viva e permanente de Deus”
  alternative: “a palavra do Deus vivo e permanente”
  rationale: Os dois particípios genitivos masculinos singulares podem concordar formalmente tanto com λόγου quanto com θεοῦ. O contexto imediato, especialmente o versículo 25, favorece a palavra que permanece; contudo, a outra ligação é gramaticalmente possível e foi preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Gerados de novo” mantém a voz passiva e reforça a relação entre novo nascimento e semente. A ordem “palavra viva e permanente de Deus” preserva a leitura contextual preferida, enquanto a nota registra a ambiguidade sintática genuína.
