  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: pt
  text: Portanto, tendo abandonado toda maldade, todo engano, todas as hipocrisias, todas as invejas e todas as maledicências,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda fala contra os outros”. O termo grego refere-se a falas depreciativas ou difamatórias dirigidas contra outras pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: tendo abandonado
  rationale: O particípio aoristo médio, ligado à exortação do versículo seguinte, apresenta o abandono desses vícios como preparação. A formulação conserva a relação sintática sem transformar o particípio em imperativo independente.
- source_word: οὖν
  choice: Portanto
  rationale: Sinaliza a inferência decorrente do contexto anterior, especialmente 1.22–25.
- source_word: πᾶσαν κακίαν
  choice: toda maldade
  rationale: κακία pode indicar maldade moral e má disposição contra outros. “Toda maldade” é clara e preserva uma amplitude que “malícia” poderia restringir em português corrente.
- source_word: πάντα δόλον
  choice: todo engano
  rationale: δόλος designa fraude, astúcia enganosa ou dolo. “Engano” é natural e abrangente no português moderno.
- source_word: ὑποκρίσεις
  choice: hipocrisias
  rationale: Mantém o plural explícito do grego, que pode apontar para manifestações ou atos variados de hipocrisia.
- source_word: φθόνους
  choice: invejas
  rationale: Conserva o plural grego e o paralelismo da lista de vícios.
- source_word: πάσας καταλαλιάς
  choice: toda forma de falar mal dos outros
  rationale: καταλαλιά refere-se amplamente à fala contra outras pessoas, incluindo difamação e detração. A expressão evita limitar indevidamente o sentido à definição jurídica moderna de “calúnia”.
theological_decisions:
- issue: Formulação e alcance moral da lista de vícios
  choice: Traduzir cada vício de modo concreto, preservando a amplitude da fala prejudicial contra outros.
  alternative: Empregar “malícia” para κακία e “todas as calúnias” para πάσας καταλαλιάς.
  rationale: O texto contém uma exortação ética, não uma formulação doutrinária técnica. A tradução mantém o alcance moral do grego sem acrescentar interpretação denominacional nem restringir καταλαλιά ao sentido jurídico de calúnia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura participial foi mantida porque o pensamento continua no versículo 2; a vírgula final do texto-fonte foi representada como continuidade sintática, não como frase completa isolada.
