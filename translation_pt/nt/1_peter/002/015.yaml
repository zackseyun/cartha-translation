id: 1PE.2.15
reference: 1 Peter 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: pt
  text: 'Pois esta é a vontade de Deus: que, fazendo o bem, vocês calem a ignorância de pessoas insensatas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amordacem a ignorância de pessoas insensatas”. O verbo significa literalmente “amordaçar” e é usado aqui de modo figurado para fazer cessar a fala hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da exortação anterior; “Pois” preserva de modo natural a relação causal.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: esta é a vontade de Deus
  rationale: Expressão idiomática em português que mantém a referência ao modo de agir descrito no contexto.
- source_word: ἀγαθοποιοῦντας
  choice: fazendo o bem
  rationale: O particípio indica o meio pelo qual se cala a ignorância; a construção é natural e preserva a relação instrumental sem torná-la excessivamente explícita.
- source_word: φιμοῦν
  choice: calem
  rationale: 'O verbo significa literalmente amordaçar, mas aqui é metafórico: impedir ou fazer cessar a fala hostil. “Calem” comunica essa força com clareza.'
- source_word: ἀγνωσίαν
  choice: ignorância
  rationale: Equivalente direto do substantivo grego, mantendo seu sentido de falta de entendimento.
- source_word: ἀφρόνων ἀνθρώπων
  choice: de pessoas insensatas
  rationale: “Pessoas” reflete o sentido humano genérico de ἀνθρώπων, e “insensatas” expressa a falta de discernimento indicada por ἀφρόνων.
theological_decisions:
- issue: Referência de gênero em ἀνθρώπων
  choice: pessoas
  alternative: homens
  rationale: O termo grego tem referência humana genérica neste contexto, não limitada ao sexo masculino.
- issue: Relação entre fazer o bem e calar a ignorância
  choice: que, fazendo o bem, vocês calem
  alternative: que vocês façam o bem e calem
  rationale: A formulação preserva a função participial de ἀγαθοποιοῦντας como meio ou modo, sem transformar os elementos em dois mandamentos coordenados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o sujeito implícito da construção grega e concorda naturalmente com o contexto.
