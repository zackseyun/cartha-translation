  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: pt
  text: ele, quando era insultado, não insultava em resposta; quando sofria, não fazia ameaças, mas continuava entregando-se àquele que julga com justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιδορούμενος
  choice: quando era insultado
  rationale: O particípio passivo indica abuso verbal; esta formulação é natural em português moderno e mantém o paralelismo temporal.
- source_word: οὐκ ἀντελοιδόρει
  choice: não insultava em resposta
  rationale: O imperfeito retrata a conduta habitual de não revidar verbalmente, e o prefixo ἀντί- é expresso por “em resposta”.
- source_word: πάσχων
  choice: quando sofria
  rationale: O particípio presente tem valor circunstancial temporal e forma um paralelo claro com a oração anterior.
- source_word: οὐκ ἠπείλει
  choice: não fazia ameaças
  rationale: A expressão idiomática comunica naturalmente o ato de ameaçar e permite ao imperfeito indicar conduta contínua ou característica.
- source_word: παρεδίδου
  choice: continuava entregando-se
  rationale: Preserva o aspecto imperfeito e o sentido contextual de confiar ou colocar a própria causa nas mãos de outro, sem explicitar um objeto reflexivo ausente no grego.
- source_word: τῷ κρίνοντι δικαίως
  choice: àquele que julga com justiça
  rationale: Mantém o particípio substantivado e o advérbio, descrevendo o juiz sem transformar a expressão em título.
- source_word: δὲ
  choice: mas
  rationale: Marca o contraste entre não retaliar e a resposta positiva de entregar-se ao justo juiz.
- source_word: ὃς
  choice: ele
  rationale: Embora seja pronome relativo no grego, o início com “ele” produz uma continuação natural em português quando o versículo é apresentado isoladamente; o referente permanece ligado ao contexto anterior.
theological_decisions:
- issue: Referente de “àquele que julga com justiça”
  choice: Manter a referência descritiva, com Deus implicitamente como referente.
  alternative: Explicitar “Deus” ou “o Pai”.
  rationale: O contexto aponta para Deus, mas o grego não traz título nem especificação pessoal; a tradução preserva essa forma e evita resolver além do texto.
- issue: Objeto implícito de παρεδίδου
  choice: “continuava entregando-se”, entendendo que Cristo colocava a si mesmo ou sua causa nas mãos do justo juiz.
  alternative: “continuava entregando sua causa” ou “continuava confiando-se”.
  rationale: O verbo grego não declara expressamente o objeto. A forma reflexiva reproduz a leitura contextual mais provável sem acrescentar “sua causa”, enquanto “entregando-se” conserva melhor a amplitude lexical de παραδίδωμι.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Os imperfeitos “insultava”, “fazia” e “continuava” preservam a ação característica ou reiterada. Não são necessárias notas nesta redação, pois as alternativas relevantes podem ser registradas nas decisões sem sobrecarregar o versículo.
