id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: pt
  text: Honrem a todos, amem a comunidade dos irmãos[b], temam a Deus e honrem o rei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o imperador”. A palavra grega significa literalmente “rei”, mas, no contexto romano de Pedro, provavelmente se refere ao imperador.
    reason: alternative_reading
  - marker: b
    text: “A comunidade dos irmãos” refere-se à comunidade dos que creem, isto é, aos irmãos e às irmãs na fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας
  choice: a todos
  rationale: O acusativo plural substantivado de πᾶς tem alcance universal. “A todos” é conciso, natural em português e, neste contexto, refere-se a todas as pessoas.
- source_word: τιμήσατε / τιμᾶτε
  choice: honrem
  rationale: Mantém a repetição de τιμάω no início e no fim do versículo, bem como sua força, mais intensa que simples consideração ou respeito. A diferença aspectual entre o imperativo aoristo e o presente não precisa ser explicitada nesta breve série de ordens.
- source_word: τὴν ἀδελφότητα
  choice: a comunidade dos irmãos
  rationale: ἀδελφότης designa coletivamente a fraternidade ou comunidade de irmãos na fé. A formulação preserva tanto o sentido comunitário quanto a imagem familiar do termo grego, evitando a possível associação de “irmandade” apenas com uma confraria ou organização específica.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Equivalente corrente e direto de ἀγαπάω. O imperativo presente pode sugerir continuidade, mas isso permanece implícito de modo natural em português.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: Objeto direto de φοβεῖσθε; tradução direta e idiomática em português.
- source_word: φοβεῖσθε
  choice: temam
  rationale: Preserva a força de φοβέομαι e a distinção deliberada entre temer a Deus e honrar o governante, sem suavizar o verbo para “reverenciem”.
- source_word: τὸν βασιλέα
  choice: o rei
  rationale: É o equivalente lexical direto de βασιλεύς. No contexto romano, o referente provável é o imperador, informação preservada em nota sem substituir a forma do texto grego.
theological_decisions:
- issue: Distinção entre a resposta devida a Deus e a devida ao governante civil
  choice: “temam a Deus” e “honrem o rei”
  alternative: “reverenciem a Deus” e “respeitem o rei”
  rationale: 'A tradução conserva a hierarquia verbal do texto: honra para todos e para o rei, amor para a comunidade dos irmãos e temor para Deus. Assim, não equipara a autoridade civil a Deus nem transforma o versículo em uma formulação política mais ampla.'
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com imperativos no plural. A coordenação final com “e” produz uma sequência natural sem apagar o paralelismo das quatro ordens. Os marcadores foram colocados junto às expressões que de fato explicam: [b] após “comunidade dos irmãos” e [a] após “rei”.'
