  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: pt
  text: vocês mesmos também, como pedras vivas[a], estão sendo edificados como uma casa espiritual[d], para serem um sacerdócio santo[b], a fim de oferecerem sacrifícios espirituais aceitáveis a Deus por meio de Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à semelhança de pedras vivas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para um sacerdócio santo” ou “até se tornarem um sacerdócio santo”. A preposição grega pode indicar meta ou resultado.'
    reason: alternative_reading
  - marker: c
    text: 'Grego: “Jesus Cristo”. Aqui, Χριστός é traduzido como o título “Messias”.'
    reason: lexical_alternative
  - marker: d
    text: 'A construção grega liga compactamente «casa espiritual» e «sacerdócio santo» à imagem de serem edificados; também pode ser traduzida: “edificados como uma casa espiritual, para um sacerdócio santo”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: vocês mesmos também
  rationale: Preserva tanto a ênfase do pronome αὐτοὶ quanto o valor aditivo de καί, ligando os leitores à pedra viva mencionada no contexto anterior.
- source_word: ὡς λίθοι ζῶντες
  choice: como pedras vivas
  rationale: Mantém a comparação e a imagem arquitetônica, além de conservar o eco de Cristo como pedra viva no versículo anterior.
- source_word: οἰκοδομεῖσθε
  choice: estão sendo edificados
  rationale: Reproduz o presente passivo como ação em curso, sem nomear um agente que o versículo não explicita.
- source_word: οἶκος πνευματικὸς
  choice: como casa espiritual
  rationale: Expressa em português natural o complemento resultativo da imagem de edificação, sem reduzir 'espiritual' a um sentido meramente figurado.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: para serem um sacerdócio santo
  rationale: Comunica a meta ou o resultado indicado por εἰς. 'Sacerdócio' designa aqui o corpo sacerdotal coletivo, não apenas a função ou sacerdotes isolados.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: a fim de oferecer sacrifícios espirituais
  rationale: Mantém a finalidade do infinitivo e a linguagem sacrificial, sem especificar em que consistem os sacrifícios.
- source_word: εὐπροσδέκτους θεῷ
  choice: aceitáveis a Deus
  rationale: Preserva a ideia cultual de sacrifícios recebidos favoravelmente por Deus e traduz de modo direto o dativo θεῷ.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: διά com genitivo indica meio ou mediação. Χριστός é traduzido como o título 'Messias', em formulação idiomática portuguesa.
theological_decisions:
- issue: Voz e agência em οἰκοδομεῖσθε
  choice: passiva — 'estão sendo edificados' — sem agente explícito
  alternative: '''edifiquem-se'' ou ''edificam a si mesmos'''
  rationale: A forma e o contexto favorecem a leitura passiva. Não se acrescenta 'por Deus', embora essa agência possa estar implícita teologicamente.
- issue: Relação sintática de εἰς ἱεράτευμα ἅγιον
  choice: 'finalidade ou resultado: ''para serem um sacerdócio santo'''
  alternative: '''em um sacerdócio santo'' ou ''para um sacerdócio santo'''
  rationale: A tradução principal é natural em português, mas a nota conserva a amplitude de εἰς entre meta e resultado, sem definir rigidamente a relação entre 'casa' e 'sacerdócio'.
- issue: Sentido de Χριστοῦ
  choice: 'título: ''o Messias'''
  alternative: '''Cristo'''
  rationale: Neste nome composto, Χριστός continua reconhecível como título messiânico; traduzi-lo torna esse valor transparente sem alterar a afirmação cristológica.
- issue: Natureza dos 'sacrifícios espirituais'
  choice: expressão mantida sem explicação no corpo do texto
  alternative: explicitar como louvor, obediência, serviço ou entrega pessoal
  rationale: O versículo não define os sacrifícios; especificá-los importaria uma interpretação de outros contextos e reduziria a abertura da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “vocês” para explicitar a segunda pessoa plural do contexto. “Edificados” preserva a metáfora arquitetônica e o registro bíblico sem soar arcaico. As notas mantêm as ambiguidades lexicais e sintáticas relevantes.
