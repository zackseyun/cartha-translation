  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: pt
  text: Escravos domésticos[a], sujeitem-se aos seus senhores com todo o respeito[b], não somente aos bons e gentis, mas também aos injustos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos domésticos”. O termo grego refere-se especificamente a escravos ou dependentes servis de uma casa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com todo o temor”; aqui, a expressão indica deferência respeitosa.
    reason: lexical_alternative
  - marker: c
    text: Ou “perversos” ou “severos”. A palavra grega significa literalmente “tortos” ou “retorcidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: servos domésticos
  rationale: O termo designa especificamente pessoas em condição servil dentro de uma casa. A expressão preserva o contexto doméstico, enquanto a nota explicita que se tratava também de escravos.
- source_word: ὑποτασσόμενοι
  choice: sujeitem-se
  rationale: O particípio tem força de exortação no contexto. O imperativo reflexivo é natural em português e comunica claramente a submissão requerida.
- source_word: ἐν παντὶ φόβῳ
  choice: com todo o respeito
  rationale: φόβος pode significar medo, temor reverente ou respeito. Neste contexto, a expressão indica uma atitude de deferência respeitosa; a nota conserva a forma mais literal.
- source_word: δεσπόταις
  choice: senhores
  rationale: δεσπότης designa quem exerce autoridade sobre servos ou escravos da casa. “Senhores” expressa essa relação social sem introduzir a linguagem moderna de emprego.
- source_word: ἀγαθοῖς
  choice: bons
  rationale: Mantém o sentido moral amplo e direto de ἀγαθός.
- source_word: ἐπιεικέσιν
  choice: gentis
  rationale: Comunica a brandura, moderação e consideração expressas por ἐπιεικής em linguagem corrente.
- source_word: σκολιοῖς
  choice: perversos
  rationale: O adjetivo significa literalmente “tortos” ou “retorcidos” e, aplicado a pessoas, descreve caráter moralmente desviado, injusto ou difícil. “Perversos” preserva a avaliação moral sem restringi-la apenas à severidade.
theological_decisions:
- issue: Como representar a condição social indicada por οἰκέται sem suavizá-la nem confundi-la com emprego doméstico moderno
  choice: “servos domésticos” no texto, com “escravos domésticos” na nota
  alternative: “escravos domésticos” diretamente no texto
  rationale: O termo se refere aos dependentes servis da casa e podia abranger pessoas escravizadas. A tradução mantém a especificidade doméstica, e a nota torna explícita a realidade social para impedir uma leitura anacrônica.
- issue: Se φόβος deve ser traduzido literalmente como medo ou contextualmente como respeito
  choice: “com todo o respeito”
  alternative: “com todo o temor”
  rationale: O contexto pede deferência diante da autoridade, mas o campo semântico de φόβος inclui temor. A tradução comunica o sentido contextual sem apagar a formulação literal, registrada em nota.
- issue: Como preservar a amplitude moral de σκολιοῖς
  choice: “perversos”
  alternative: “injustos”, “severos” ou, literalmente, “tortos”
  rationale: O original caracteriza os senhores como moralmente tortuosos, podendo implicar injustiça e dureza. “Perversos” evita reduzir o termo a apenas uma dessas manifestações, enquanto a nota preserva a metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O imperativo “sujeitem-se” torna explícita a força exortativa do particípio grego. As notas preservam a realidade da escravidão doméstica, a formulação literal de φόβος e a metáfora de σκολιός.
