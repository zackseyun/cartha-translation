source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: pt
  text: Pois vocês eram como ovelhas que andavam desgarradas[a], mas agora voltaram[b] ao Pastor e Supervisor[c] das almas de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “andavam errantes” ou “eram desencaminhadas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “se voltaram”; a forma grega também pode ser entendida com nuance passiva: “foram trazidos de volta”.'
    reason: alternative_reading
  - marker: c
    text: Ou “Guardião”; tradicionalmente, “Bispo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Pois vocês eram
  rationale: “Pois” preserva a função explicativa de γάρ, ligando o versículo à afirmação anterior; o imperfeito ἦτε descreve a condição passada dos leitores.
- source_word: ὡς πρόβατα
  choice: como ovelhas
  rationale: Mantém de modo natural a comparação introduzida por ὡς e a imagem pastoral.
- source_word: πλανώμενοι
  choice: que se desviavam
  rationale: Expressa o valor intransitivo de πλανάω no contexto da imagem de ovelhas, sem especificar uma causa ou agente; as nuances “andavam errantes” e “eram desencaminhadas” ficam registradas em nota.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: mas agora voltaram
  rationale: Reproduz o forte contraste de ἀλλά e comunica de forma idiomática a mudança concluída expressa pelo aoristo; a possível nuance passiva da forma verbal é preservada em nota.
- source_word: ἐπὶ τὸν ποιμένα
  choice: ao Pastor
  rationale: ποιμήν significa “pastor” no sentido de quem cuida de ovelhas. A maiúscula sinaliza seu emprego contextual como título de Cristo.
- source_word: καὶ ἐπίσκοπον
  choice: e Supervisor
  rationale: “Supervisor” comunica a ideia de alguém que vela e cuida, sem importar automaticamente o sentido posterior de um cargo eclesiástico; alternativas tradicionais e contextuais são indicadas em nota.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: da alma de vocês
  rationale: O singular coletivo natural em português evita a possível sugestão de que cada pessoa tenha várias almas e preserva ψυχή como “alma”, sem excluir sua amplitude semântica de vida ou pessoa.
theological_decisions:
- issue: ἐπίσκοπος como título cristológico
  choice: Supervisor
  alternative: Guardião; Bispo
  rationale: O texto aplica ποιμήν e ἐπίσκοπος a Cristo. “Supervisor” preserva a função de quem vela e cuida, evitando transformar necessariamente o termo em referência ao ofício eclesiástico posterior; a tradução tradicional “Bispo” e a contextual “Guardião” são mantidas em nota.
- issue: Nuance de voz de ἐπεστράφητε
  choice: voltaram
  alternative: foram reconduzidos
  rationale: Embora a forma seja passiva, ἐπιστρέφω pode ter sentido intransitivo ou médio, “voltar-se, retornar”. A tradução principal não resolve de modo excessivo a relação entre ação divina e resposta humana, e a nuance passiva é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” por corresponder ao plural ὑμῶν e evita linguagem denominacional. As maiúsculas em “Pastor” e “Supervisor” marcam títulos cristológicos no contexto.
