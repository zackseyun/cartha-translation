id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as slaves of God.
translation:
  language: pt
  text: como pessoas livres, e não como quem usa a liberdade como cobertura para o mal, mas como escravos de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos de Deus”. A palavra grega pode ter ambos os sentidos, mas “escravos” preserva o contraste mais forte com “pessoas livres”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: pessoas livres
  rationale: Expressa o sentido social e jurídico do adjetivo substantivado e inclui naturalmente todo o público, sem restringir a referência aos homens.
- source_word: ἐπικάλυμμα
  choice: cobertura
  rationale: Preserva a imagem concreta de algo que encobre ou dissimula a conduta má; é claro em português contemporâneo.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: usando a liberdade
  rationale: Transmite de modo idiomático a força instrumental da construção, literalmente 'tendo a liberdade como cobertura'.
- source_word: κακίας
  choice: mal
  rationale: Mantém o sentido moral amplo de κακία neste contexto, sem limitá-lo à malícia.
- source_word: θεοῦ δοῦλοι
  choice: escravos de Deus
  rationale: Preserva a ideia de pertencimento total a Deus e o forte paradoxo retórico entre liberdade e escravidão.
theological_decisions:
- issue: Tradução de δοῦλοι como identidade dos cristãos
  choice: escravos de Deus
  alternative: servos de Deus
  rationale: O contraste deliberado entre ἐλεύθεροι e δοῦλοι torna saliente o sentido forte de pertencimento. 'Servos' é uma alternativa lexical possível, mas suaviza a tensão presente no grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a estrutura exortativa ligada ao contexto e mantém o paradoxo entre liberdade e pertencimento a Deus.
