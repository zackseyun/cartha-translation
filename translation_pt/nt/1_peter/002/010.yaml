id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: pt
  text: vocês que antes não eram um povo[a], mas agora são povo de Deus; vocês que não haviam recebido misericórdia[b], mas agora receberam misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pedro retoma Oseias 1:9-10 e 2:23, aplicando aos seus leitores a linguagem da restauração de Israel e de sua identidade presente como povo de Deus.
    reason: cross_reference
  - marker: b
    text: 'Ou: “vocês que não haviam sido alvo de misericórdia, mas agora foram alvo de misericórdia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: vocês que
  rationale: O pronome relativo nominativo plural retoma os leitores mencionados no versículo anterior; “vocês que” explicita naturalmente essa ligação em português.
- source_word: ποτε
  choice: antes
  rationale: Marca a condição passada em contraste direto com νῦν, “agora”; “antes” é claro e idiomático.
- source_word: λαὸς
  choice: um povo / povo de Deus
  rationale: Preserva o sentido coletivo e pactual de λαός, bem como a distinção do grego entre “não eram um povo” e “povo de Deus”.
- source_word: θεοῦ
  choice: de Deus
  rationale: Expressa naturalmente o genitivo que identifica o povo como pertencente a Deus.
- source_word: οὐκ ἠλεημένοι
  choice: não haviam recebido misericórdia
  rationale: Comunica o estado anterior resultante do particípio perfeito passivo, em linguagem natural, sem ocultar que eram os destinatários da misericórdia.
- source_word: ἐλεηθέντες
  choice: receberam misericórdia
  rationale: Expressa a reversão produzida pela ação misericordiosa de Deus; o pretérito perfeito é natural em português e mantém o paralelismo lexical.
- source_word: δὲ
  choice: mas
  rationale: Sinaliza claramente o contraste nas duas reversões descritas no versículo.
- source_word: νῦν
  choice: agora
  rationale: Marca a condição presente dos leitores em oposição à anterior.
theological_decisions:
- issue: Alusão a Oseias e linguagem de identidade pactual
  choice: Manter a distinção entre “não eram um povo” e “agora são povo de Deus”.
  alternative: 'Explicitar “não eram povo de Deus” na primeira oração ou traduzir literalmente sem o artigo: “não povo”.'
  rationale: O grego não inclui θεοῦ na primeira oração, mas o inclui na segunda. A formulação preserva essa diferença e a reversão coletiva evocada de Oseias sem impor uma delimitação étnica ou denominacional.
- issue: Voz passiva dos termos ligados à misericórdia
  choice: Usar “receber misericórdia” no texto e registrar “ser alvo de misericórdia” como alternativa.
  alternative: 'Traduzir diretamente pela passiva: “não foram tratados com misericórdia... foram tratados com misericórdia”.'
  rationale: “Receber misericórdia” é natural e mantém Deus como agente implícito, sem acrescentá-lo ao texto; a nota conserva a possibilidade de representar mais explicitamente a voz passiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” mantém a referência explícita aos leitores; “povo de Deus” preserva a linguagem coletiva e pactual. Os marcadores [a] e [b] aparecem no texto principal.
