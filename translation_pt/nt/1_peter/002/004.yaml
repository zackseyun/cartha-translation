source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: pt
  text: Ao se aproximarem dele[a], a pedra viva, rejeitada pelas pessoas, mas escolhida e preciosa diante de Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Aproximando-se dele»; literalmente, «de quem, aproximando-se».'
    reason: alternativa_lexical
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: dele
  rationale: Com o verbo de movimento «aproximar-se», «dele» expressa naturalmente em português a direção para o referente masculino, sem inserir explicitamente o nome de Cristo.
- source_word: προσερχόμενοι
  choice: Ao se aproximarem
  rationale: O particípio presente indica ação em curso ligada aos destinatários. A construção temporal «Ao se aproximarem» é natural e preserva a conexão com o contexto.
- source_word: λίθον ζῶντα
  choice: a pedra viva
  rationale: «Pedra» mantém a imagem de material de construção desenvolvida no contexto, e «viva» preserva o paradoxo intencional da metáfora.
- source_word: ὑπὸ ἀνθρώπων
  choice: pelas pessoas
  rationale: ἄνθρωποι designa aqui seres humanos em contraste com Deus, não necessariamente apenas indivíduos do sexo masculino. «Pessoas» comunica essa abrangência com naturalidade no português atual.
- source_word: ἀποδεδοκιμασμένον
  choice: rejeitada
  rationale: O particípio perfeito passivo retrata a pedra como tendo sido avaliada e recusada; «rejeitada» transmite de modo claro o resultado duradouro.
- source_word: παρὰ δὲ θεῷ
  choice: mas ... diante de Deus
  rationale: παρά com o dativo expressa a condição da pedra na avaliação de Deus. «Diante de Deus» conserva essa perspectiva avaliativa sem a explicar em excesso.
- source_word: ἐκλεκτὸν
  choice: escolhida
  rationale: «Escolhida» é claro, atual e preserva a ideia de escolha divina sem recorrer ao termo teológico mais técnico «eleita».
- source_word: ἔντιμον
  choice: preciosa
  rationale: O adjetivo denota aquilo que é honrado ou muito valorizado. «Preciosa» se encaixa naturalmente na imagem da pedra e expressa seu alto valor para Deus.
theological_decisions:
- issue: Referente de «dele» e identidade da pedra viva
  choice: Manter o referente pronominal e apresentar a pedra viva como aposto.
  alternative: Explicitar «de Jesus Cristo» ou «do Senhor».
  rationale: O contexto identifica o referente como Cristo, especialmente em 2:3-8, mas o grego deste versículo usa um pronome. Preservar «dele» evita acrescentar ao texto uma identificação que aqui permanece implícita.
- issue: Sentido de ὑπὸ ἀνθρώπων
  choice: «pelas pessoas»
  alternative: «pelos homens» ou «pelos seres humanos»
  rationale: O contraste é entre a avaliação humana e a divina. «Pelas pessoas» expressa o referente humano abrangente de ἀνθρώπων e evita que «homens» seja entendido, no português contemporâneo, como exclusivamente masculino.
- issue: Valor de ἔντιμον
  choice: «preciosa»
  alternative: «honrada» ou «muito estimada»
  rationale: O termo pode salientar honra ou valor. «Preciosa» mantém ambos em tensão razoável e combina com a metáfora da pedra, sem decidir que a ênfase seja exclusivamente econômica ou honorífica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega-se «se aproximarem» em vez de uma construção participial rígida; «pessoas» evita ambiguidade masculina indevida. A vírgula final foi mantida porque o versículo continua sintaticamente em 2:5.
