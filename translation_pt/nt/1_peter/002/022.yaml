  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: pt
  text: Ele não cometeu pecado algum,[a] e nenhum engano foi encontrado em sua boca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta formulação faz eco a Isaías 53:9.
    reason: cross_reference
  - marker: b
    text: Ou «fraude» ou «ardil»; o termo grego pode indicar engano, fraude ou traição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ele
  rationale: O pronome relativo retoma Cristo no contexto anterior. Em português, iniciar com «ele» produz uma frase natural como unidade citada, sem acrescentar ênfase indevida.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: não cometeu pecado algum
  rationale: Com ἁμαρτίαν, ποιέω tem o sentido idiomático de cometer pecado. «Pecado algum» preserva o singular categorial e expressa claramente a negação.
- source_word: οὐδὲ
  choice: e nenhum
  rationale: Coordena a segunda oração negativa de modo corrente em português, mantendo sua força cumulativa.
- source_word: εὑρέθη
  choice: foi encontrado
  rationale: Mantém a voz passiva do aoristo de εὑρίσκω e a formulação que remete a Isaías 53:9.
- source_word: δόλος
  choice: engano
  rationale: Termo atual e amplo para falsidade deliberada, fraude ou ardil, sem o tom arcaico de algumas alternativas.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: em sua boca
  rationale: Preserva de perto a metáfora corporal do grego e a ressonância de Isaías, em vez de explicitar como «em suas palavras».
theological_decisions:
- issue: Eco de Isaías 53:9 na descrição da ausência de pecado e de engano em Cristo
  choice: Manter «não cometeu pecado algum» e «nenhum engano foi encontrado em sua boca»
  alternative: «Ele nunca pecou nem falou com falsidade»
  rationale: A formulação relativamente próxima do grego conserva a força da afirmação e a alusão profética sem transformar a segunda oração em paráfrase ativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores foi ajustada para que a nota da alusão siga a primeira oração e a nota lexical acompanhe «engano».
