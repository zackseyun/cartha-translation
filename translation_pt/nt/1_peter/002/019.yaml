  terminology: “Graça” preserva a escolha lexical deliberadamente não interpretativa para χάρις e é adequadamente esclarecida pela nota. “Consciência de Deus” mantém a possibilidade de consciência/atenção orientada para Deus, sem impor uma leitura doutrinária específica. “Aflições” é uma boa representação ampla de λύπας.
