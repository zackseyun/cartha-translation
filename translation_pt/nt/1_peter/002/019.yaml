  source_fidelity: 'A tradução reproduz adequadamente a estrutura e o sentido do grego: τοῦτο γὰρ como “Pois isto”, χάρις como “graça”, a condição com τις (“se alguém”), o motivo divino expresso por διὰ συνείδησιν θεοῦ, ὑποφέρει como “suporta”, e a circunstância πάσχων ἀδίκως como “sofrendo injustamente”. A colocação de “por ter consciência de Deus” junto de “suporta” deixa clara a relação causal presente no original.'
