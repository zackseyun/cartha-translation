id: 1PE.2.19
reference: 1 Peter 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: pt
  text: 'Pois isto é graça[a]: se alguém, por ter consciência de Deus[b], suporta aflições, sofrendo injustamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “graça” também pode ter o sentido de algo digno de aprovação ou favor.
    reason: lexical_alternative
  - marker: b
    text: Ou “por estar atento a Deus” ou “por causa da consciência diante de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Mantém o termo central do texto grego e sua ressonância no Novo Testamento. Neste contexto, tem valor avaliativo e pode indicar algo digno de aprovação ou favor, sem inserir no corpo do texto uma explicação que o grego não explicita.
- source_word: διὰ συνείδησιν θεοῦ
  choice: por ter consciência de Deus
  rationale: Preserva a formulação compacta e a amplitude de συνείδησις, que pode envolver tanto consciência atenta quanto consciência moral. A construção indica que a consideração de Deus motiva a perseverança; uma alternativa mais idiomática é registrada em nota.
- source_word: ὑποφέρει
  choice: suporta
  rationale: Expressa perseverança paciente sob uma situação penosa e é natural no português contemporâneo.
- source_word: λύπας
  choice: aflições
  rationale: Abrange sofrimento, pesar e angústia sem limitar o sentido a dor física ou mera tristeza emocional.
- source_word: πάσχων ἀδίκως
  choice: sofrendo injustamente
  rationale: Reproduz com clareza a circunstância em que a pessoa suporta as aflições.
- source_word: τις
  choice: alguém
  rationale: Representa de modo natural o pronome indefinido singular sem introduzir uma referência exclusivamente masculina.
- source_word: τοῦτο γὰρ
  choice: Pois isto
  rationale: Conserva tanto a conexão explicativa de γάρ quanto a referência de τοῦτο à situação descrita na oração condicional.
theological_decisions:
- issue: Sentido de χάρις no contexto
  choice: graça
  alternative: algo digno de aprovação; algo que alcança favor
  rationale: A tradução mantém a ligação lexical e teológica de χάρις sem acrescentar no corpo do versículo uma identificação explícita de quem concede aprovação ou favor.
- issue: Sentido de συνείδησις θεοῦ
  choice: consciência de Deus
  alternative: estar atento a Deus; consciência diante de Deus
  rationale: A expressão preserva a tensão entre percepção consciente de Deus e consciência moral orientada para Deus, evitando reduzir a frase a uma única interpretação.
- issue: Relação da frase causal com a oração
  choice: A expressão “por ter consciência de Deus” modifica “suporta”.
  alternative: Colocar a expressão no fim, onde poderia parecer modificar “sofrendo injustamente”.
  rationale: A posição escolhida acompanha a relação lógica indicada pela ordem grega e esclarece que a consciência de Deus é a razão para suportar as aflições, não a causa do tratamento injusto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase causal foi mantida próxima do verbo que ela qualifica para evitar ambiguidade. “Aflições” comunica a amplitude de λύπας com mais naturalidade que “tristezas” neste contexto.
