id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: pt
  text: Vocês, porém, são povo escolhido[a], sacerdócio real, nação santa, povo que lhe pertence, para que proclamem as excelências[b] daquele que os chamou das trevas para a sua maravilhosa luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “raça escolhida”. O termo grego pode indicar linhagem, descendência, raça ou povo; “povo” evita conotações étnico-raciais modernas enganosas e preserva o sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os louvores” ou “os feitos poderosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Vocês, porém
  rationale: O pronome explícito dá ênfase aos destinatários, e δὲ estabelece contraste com os que não creem mencionados antes. A formulação é natural em português e preserva ambos os efeitos.
- source_word: γένος ἐκλεκτόν
  choice: povo escolhido
  rationale: γένος pode designar linhagem, descendência, raça ou povo. “Povo escolhido” mantém o sentido coletivo e pactual sem sugerir indevidamente as categorias étnico-raciais modernas; a alternativa mais literal é registrada em nota.
- source_word: βασίλειον ἱεράτευμα
  choice: sacerdócio real
  rationale: A expressão compacta preserva tanto a dimensão régia quanto a sacerdotal e ecoa naturalmente Êxodo 19:6 na tradição grega.
- source_word: ἔθνος ἅγιον
  choice: nação santa
  rationale: Tradução direta que conserva o sentido de santidade e separação para Deus, bem como a linguagem coletiva da aliança.
- source_word: λαὸς εἰς περιποίησιν
  choice: povo que lhe pertence
  rationale: περιποίησις comunica aquisição ou posse especial. A relação com Deus, implícita no contexto, é expressa pelo pronome “lhe”, evitando a construção pouco natural “povo para posse”.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade da identidade coletiva descrita na primeira parte do versículo.
- source_word: τὰς ἀρετὰς
  choice: as excelências
  rationale: ἀρετή pode indicar excelência, qualidade digna de louvor ou manifestação poderosa. “Excelências” preserva a amplitude do termo sem limitá-lo apenas a atributos ou atos; alternativas contextualmente possíveis aparecem em nota.
- source_word: ἐξαγγείλητε
  choice: proclamem
  rationale: O verbo expressa anúncio público, e o subjuntivo após ὅπως é reproduzido naturalmente pela construção portuguesa “para que proclamem”.
- source_word: τοῦ ... καλέσαντος
  choice: daquele que os chamou
  rationale: Mantém a construção participial que identifica Deus por sua ação, sem inserir explicitamente um nome ausente do texto grego.
- source_word: ἐκ σκότους
  choice: das trevas
  rationale: Preserva a imagem de saída de um domínio ou condição, com formulação idiomática em português.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: para a sua maravilhosa luz
  rationale: “Maravilhosa” comunica o caráter admirável e extraordinário expresso por θαυμαστός, mantendo o tom elevado.
theological_decisions:
- issue: Títulos coletivos da aliança aplicados aos destinatários
  choice: Manter diretamente “povo escolhido”, “sacerdócio real” e “nação santa”.
  alternative: Parafrasear os títulos como meras comparações ou descrições abstratas.
  rationale: O versículo aplica deliberadamente aos destinatários linguagem pactual ligada ao Antigo Testamento. A tradução preserva essa força e sua tensão intertextual sem definir um sistema teológico além do que o texto afirma.
- issue: Possuidor implícito em λαὸς εἰς περιποίησιν
  choice: Explicitar contextualmente a relação com Deus em “povo que lhe pertence”.
  alternative: Traduzir de modo estritamente formal como “povo para posse”.
  rationale: Embora não haja pronome possessivo nessa expressão grega, o referente divino é claro pelo contexto. A explicitação produz português inteligível sem acrescentar uma afirmação doutrinária independente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” oferece endereço direto natural; “porém” preserva o contraste. Os substantivos coletivos mantêm a cadência solene e a linguagem pactual do original.
