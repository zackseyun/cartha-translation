id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: pt
  text: Amados, exorto vocês, como estrangeiros e residentes temporários[a], a se absterem dos desejos carnais[b], que guerreiam contra a alma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiros e peregrinos”. Os dois termos descrevem pessoas que vivem fora de sua terra ou sem residência permanente.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “desejos da carne”; “desejos pecaminosos” é uma formulação mais interpretativa.
    reason: lexical_alternative
  - marker: c
    text: Ou “contra a vida” ou “contra o próprio ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva a ligação lexical com o amor e mantém um tom digno e natural.
- source_word: παρακαλῶ
  choice: exorto vocês
  rationale: Neste contexto, o verbo expressa uma recomendação insistente. “Exorto” conserva sua força, e “vocês” explicita de modo natural em português o objeto implícito.
- source_word: ὡς
  choice: como
  rationale: Preserva a maneira ou condição em que os leitores são interpelados, sem acrescentar uma relação causal.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: estrangeiros e residentes temporários
  rationale: A expressão mantém os dois termos coordenados e comunica tanto a condição de quem vive fora de sua terra quanto a falta de residência permanente.
- source_word: ἀπέχεσθαι
  choice: a se absterem
  rationale: Expressa a ação contínua de manter-se afastado de algo e concorda naturalmente com o objeto plural de “exorto”.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: dos desejos carnais
  rationale: “Carnais” preserva a ligação com σάρξ e a conotação moral do contexto sem reduzir o sentido a desejos sexuais nem inserir a paráfrase doutrinária “natureza pecaminosa”.
- source_word: αἵτινες
  choice: que
  rationale: Introduz de maneira natural a oração explicativa que caracteriza esses desejos.
- source_word: στρατεύονται
  choice: guerreiam
  rationale: Mantém de forma concisa e vívida a metáfora militar de hostilidade ativa.
- source_word: κατὰ τῆς ψυχῆς
  choice: contra a alma
  rationale: Preserva o peso antropológico de ψυχή e a formulação do grego, sem acrescentar o possessivo “de vocês”.
theological_decisions:
- issue: Sentido moral de σαρκικῶν
  choice: carnais
  alternative: pecaminosos; da carne
  rationale: “Carnais” conserva a metáfora da carne e sua tensão teológica, sem transformar uma expressão figurada em uma definição doutrinária explícita.
- issue: Sentido de ψυχή
  choice: a alma
  alternative: a vida; o próprio ser
  rationale: “Alma” preserva a amplitude e o peso tradicional do termo no contexto, sem impor uma dicotomia técnica entre corpo e alma; as alternativas semânticas são registradas em nota.
- issue: Condição dos leitores descrita por παροίκους καὶ παρεπιδήμους
  choice: estrangeiros e residentes temporários
  alternative: forasteiros e peregrinos
  rationale: A tradução principal mantém o sentido social concreto dos termos e permite sua dimensão teológica, sem declarar além do texto que se trata exclusivamente de exílio espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O vocabulário conserva as metáforas da carne e da guerra e evita linguagem excessivamente técnica ou denominacional.
