id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: pt
  text: Pois que mérito há se, ao pecarem e serem espancados, vocês suportam? Mas, se, ao fazerem o bem e sofrerem, vocês suportam, isso é graça diante de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso encontra favor junto a Deus” ou “isso é digno de aprovação diante de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: mérito
  rationale: No contexto da pergunta retórica, indica crédito ou reconhecimento digno de louvor, não fama; “mérito” é claro e natural em português.
- source_word: ἁμαρτάνοντες
  choice: por estarem pecando
  rationale: Preserva a força moral explícita de ἁμαρτάνω e a relação circunstancial do particípio presente com o castigo.
- source_word: κολαφιζόμενοι
  choice: ser espancados
  rationale: Comunica de modo claro a agressão física expressa pelo verbo, que pode denotar golpes com o punho.
- source_word: ὑπομενεῖτε
  choice: suportam
  rationale: Expressa permanecer firme sob sofrimento e permite conservar a repetição verbal nas duas partes do versículo.
- source_word: ἀγαθοποιοῦντες
  choice: enquanto fazem o bem
  rationale: É uma tradução direta e idiomática do particípio, preservando sua ação contínua ou circunstancial.
- source_word: πάσχοντες
  choice: o sofrimento
  rationale: Mantém o sentido amplo de sofrer sem restringi-lo indevidamente a uma forma específica de maus-tratos.
- source_word: χάρις
  choice: graça
  rationale: Preserva a transparência lexical e a ressonância teológica, enquanto a nota registra o sentido contextual possível de favor ou aprovação.
- source_word: παρὰ θεῷ
  choice: diante de Deus
  rationale: Expressa a ideia de estar na presença ou na avaliação de Deus e soa natural no registro bíblico moderno.
theological_decisions:
- issue: Sentido de χάρις em τοῦτο χάρις παρὰ θεῷ
  choice: isso é graça diante de Deus
  alternative: isso encontra favor junto a Deus; isso é digno de aprovação diante de Deus
  rationale: A formulação principal preserva “graça” e a tensão lexical do grego; a nota esclarece o provável sentido contextual de favor ou aprovação divina sem substituir silenciosamente a expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reestruturada para naturalidade, mantendo o contraste entre sofrimento merecido e sofrimento por fazer o bem, bem como a repetição de “suportam”.
