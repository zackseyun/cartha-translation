  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: pt
  text: Como bebês recém-nascidos, desejem intensamente o leite puro e espiritual[a], para que, por meio dele, vocês cresçam rumo à salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “racional” ou “relativo à razão”. O adjetivo grego pode se referir ao que pertence à razão ou à vida interior; aqui, provavelmente descreve alimento espiritual, e não leite literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Como
  rationale: Introduz uma comparação e soa natural em português.
- source_word: ἀρτιγέννητα βρέφη
  choice: bebês recém-nascidos
  rationale: Preserva tanto a ideia de infância quanto a de nascimento muito recente, em linguagem corrente.
- source_word: τὸ λογικὸν
  choice: espiritual
  rationale: No contexto do leite metafórico, comunica alimento não literal ligado à vida interior. Como λογικός também pode significar “racional” ou “relativo à razão”, essa ambiguidade é preservada em nota.
- source_word: ἄδολον
  choice: puro
  rationale: Expressa leite sem mistura, não adulterado, e mantém possível eco da ideia de ausência de engano.
- source_word: γάλα
  choice: leite
  rationale: Mantém a metáfora central de nutrição.
- source_word: ἐπιποθήσατε
  choice: desejem intensamente
  rationale: Reproduz a força do imperativo e o sentido de anseio profundo sem recorrer a formulação excessivamente coloquial.
- source_word: ἐν αὐτῷ
  choice: por meio dele
  rationale: Retoma o leite e comunica de modo natural seu papel como meio de crescimento.
- source_word: αὐξηθῆτε
  choice: vocês cresçam
  rationale: Forma natural em português para o passivo grego, cujo foco é o crescimento proporcionado pelo leite.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Preserva a orientação para uma meta sem definir de forma denominacional a relação entre crescimento e salvação.
theological_decisions:
- issue: Sentido de λογικός na metáfora do leite
  choice: espiritual no texto principal
  alternative: racional; relativo à razão ou à vida interior
  rationale: “Espiritual” torna clara a natureza metafórica do alimento, enquanto a nota conserva o alcance lexical do grego e evita ocultar sua ambiguidade.
- issue: Força de εἰς σωτηρίαν
  choice: para a salvação
  alternative: rumo à salvação; até a salvação; na salvação
  rationale: A preposição indica direção ou resultado. A formulação escolhida mantém essa tensão sem transformar o texto numa afirmação doutrinária mais específica sobre a ordem da salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bebês” é mais corrente que “lactentes”; “desejem intensamente” preserva a força verbal sem soar informal. A construção “para a salvação” mantém a direção expressa no grego e sua tensão teológica.
