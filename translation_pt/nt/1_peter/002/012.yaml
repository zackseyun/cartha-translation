id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: pt
  text: Mantenham exemplar a conduta de vocês entre os gentios, para que, naquilo em que falam contra vocês como malfeitores, ao observarem as boas obras de vocês, glorifiquem a Deus no dia da visitação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: no dia da intervenção de Deus.'
    reason: Esclarece o alcance possível de ἐπισκοπή sem eliminar a formulação mais literal nem determinar se a intervenção traz salvação ou juízo.
lexical_decisions:
- source_word: ἀναστροφή
  choice: conduta
  rationale: Expressa o modo de viver e o comportamento habitual, de forma natural e digna em português.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre os gentios
  rationale: Preserva a designação do texto para os povos não judeus e a localização social dos destinatários.
- source_word: καλήν / καλῶν
  choice: exemplar / boas
  rationale: Em relação à conduta, “exemplar” comunica sua qualidade moral de modo idiomático; em relação às obras, “boas” mantém a formulação tradicional e direta.
- source_word: καταλαλοῦσιν
  choice: falam contra
  rationale: Abrange a ideia de difamar ou falar mal sem estreitar indevidamente o sentido a uma acusação formal.
- source_word: ἐποπτεύοντες
  choice: observem
  rationale: Indica ver atentamente ou testemunhar de perto as boas obras.
- source_word: ἐπισκοπῆς
  choice: visitação
  rationale: Mantém a amplitude do termo, que pode indicar a intervenção ou inspeção divina, sem decidir se o resultado é salvação ou juízo.
theological_decisions:
- issue: Sentido do dia da visitação
  choice: dia da visitação
  alternative: dia em que Deus os visitar
  rationale: A formulação preserva a ambiguidade teológica de ἐν ἡμέρᾳ ἐπισκοπῆς quanto à natureza e ao efeito da visita divina.
- issue: Relação entre a difamação e a glorificação futura
  choice: para que, naquilo em que falam contra vocês como se fossem malfeitores, eles observem... e glorifiquem
  alternative: para que, embora os acusem de fazer o mal, vejam... e glorifiquem
  rationale: Mantém a construção incomum ἐν ᾧ e sua ligação com o âmbito ou assunto em que os cristãos são difamados, sem convertê-la simplesmente em concessão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O plural “vocês” torna a exortação natural; “gentios” e “visitação” são mantidos por sua precisão bíblica e teológica.
