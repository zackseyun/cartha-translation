    issue: O particípio ἐποπτεύοντες foi vertido como verbo coordenado no subjuntivo.
    rationale: A construção grega é «ao observarem as boas obras de vocês, glorifiquem a Deus», tendo δοξάσωσι como verbo da finalidade. A revisão conserva essa relação.
