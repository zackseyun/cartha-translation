  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: pt
  text: ou aos governadores, como enviados por meio dele[a] para punir os que praticam o mal e louvar os que praticam o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão pode referir-se ao rei ou imperador mencionado no versículo anterior; alguns a entendem como referência a Deus, por meio de quem a autoridade é ordenada.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: ou
  rationale: Continua a estrutura alternativa iniciada no versículo anterior; “ou” é natural numa tradução que prossegue a frase.
- source_word: ἡγεμόσιν
  choice: aos governadores
  rationale: Designa autoridades governantes e, neste contexto civil, “governadores” é específico sem impor uma estrutura administrativa romana mais estreita que o grego.
- source_word: ὡς
  choice: como
  rationale: Introduz a caracterização dos governadores na condição de enviados, preservando de modo natural a relação sintática grega.
- source_word: δι’ αὐτοῦ
  choice: por ele
  rationale: Com o particípio passivo “enviados”, διά com genitivo expressa naturalmente a agência; o pronome retoma mais provavelmente o rei ou imperador do versículo anterior, embora exista outra compreensão possível, registrada em nota.
- source_word: πεμπομένοις
  choice: enviados
  rationale: Preserva de forma concisa a ideia de autoridades que recebem uma incumbência delegada, sem intensificá-la como “comissionados”.
- source_word: εἰς ἐκδίκησιν
  choice: para castigar
  rationale: No contexto da função governamental, expressa a finalidade judicial de impor punição; a formulação verbal é clara e corrente em português.
- source_word: κακοποιῶν
  choice: os que praticam o mal
  rationale: Mantém a ideia verbal de pessoas caracterizadas por fazer o mal e evita o tom potencialmente lexicalizado de “malfeitores”.
- source_word: ἔπαινον
  choice: elogiar
  rationale: Expressa a finalidade paralela de reconhecer publicamente a boa conduta; a forma verbal coordena-se naturalmente com “castigar”.
- source_word: ἀγαθοποιῶν
  choice: os que praticam o bem
  rationale: Preserva a correspondência verbal e antitética com “os que praticam o mal” em português claro e digno.
theological_decisions:
- issue: Referente de αὐτοῦ em δι’ αὐτοῦ
  choice: O rei ou imperador mencionado no versículo anterior
  alternative: Deus, entendido como aquele por meio de quem a autoridade é ordenada
  rationale: O antecedente imediato e sintaticamente mais natural é o rei do versículo 13, de quem os governadores seriam representantes delegados. A nota preserva a compreensão alternativa sem resolver além do que o contexto permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo “praticam o mal / praticam o bem” preserva a relação lexical dos particípios gregos; “castigar / elogiar” apresenta de modo natural as duas funções contrastantes da autoridade.
