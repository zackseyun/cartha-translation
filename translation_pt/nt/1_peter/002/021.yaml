id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: pt
  text: 'Pois foi para isto que vocês foram chamados: também o Messias sofreu por vocês, deixando-lhes um modelo[a], para que sigam os seus passos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exemplo a copiar”. A palavra grega pode indicar um modelo de escrita colocado diante de aprendizes para que o reproduzissem.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: para isto
  rationale: Expressão idiomática que retoma o contexto anterior de suportar sofrimento injusto e conserva a ideia de finalidade sem explicá-la além do texto.
- source_word: ἐκλήθητε
  choice: vocês foram chamados
  rationale: Preserva a voz passiva e a ressonância teológica do chamado divino, sem definir categorias doutrinárias mais específicas.
- source_word: ὅτι
  choice: ': também'
  rationale: Os dois-pontos introduzem em português a explicação ou fundamento do chamado de modo natural; a relação causal permanece clara no encadeamento da frase.
- source_word: Χριστὸς
  choice: o Messias
  rationale: Traduz o título grego pelo seu sentido, 'o Ungido', mantendo sua função cristológica neste contexto.
- source_word: ἔπαθεν
  choice: sofreu
  rationale: Equivalente direto que não acrescenta forma, objeto ou extensão do sofrimento não especificados neste versículo.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: Conserva a amplitude benefativa e representativa da expressão, inclusive sua possível ressonância substitutiva, sem impor aqui uma formulação mais estreita.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: deixando-lhes
  rationale: Expressa com naturalidade o particípio e o objeto indireto, indicando que o modelo foi deixado aos leitores.
- source_word: ὑπογραμμὸν
  choice: um modelo
  rationale: Comunica tanto a função exemplar quanto a imagem pedagógica de um padrão dado ao aprendiz para reprodução; a nota explicita a metáfora concreta.
- source_word: ἵνα
  choice: para que
  rationale: Marca de maneira natural a finalidade expressa pela construção grega.
- source_word: ἐπακολουθήσητε
  choice: sigam
  rationale: O presente do subjuntivo após 'para que' é a forma portuguesa natural para a finalidade; o verbo preserva a ideia de seguir o caminho de outro.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: os seus passos
  rationale: Mantém a metáfora de pegadas ou rastros em uma expressão corrente e digna em português.
theological_decisions:
- issue: Sentido de ὑπὲρ ὑμῶν em relação ao sofrimento do Messias
  choice: por vocês
  alternative: em favor de vocês; no lugar de vocês
  rationale: 'A formulação escolhida preserva a amplitude do grego: afirma que o sofrimento ocorreu em benefício dos leitores e permite ressonância representativa ou substitutiva, sem transformar este versículo isolado numa fórmula expiatória mais específica.'
- issue: Relação de ὅτι com o chamado precedente
  choice: explicação introduzida por dois-pontos
  alternative: porque
  rationale: O grego pode apresentar o sofrimento do Messias como fundamento ou explicação do chamado. Os dois-pontos conservam essa relação de modo idiomático, sem decidir rigidamente entre causa e conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A formulação conserva a metáfora dos passos e evita explicitar além do texto tanto a natureza do chamado quanto o modo preciso pelo qual o sofrimento do Messias foi “por” seus leitores.
