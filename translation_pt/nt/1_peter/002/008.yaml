  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: pt
  text: 'e: “pedra que faz tropeçar e rocha que leva à queda”. Eles tropeçam por desobedecerem à palavra; e para isso também foram destinados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Para isso” pode referir-se ao tropeço ou, de modo mais amplo, ao resultado descrito na frase; a construção grega não explicita que foram destinados a desobedecer.
    reason: Preserva a ambiguidade sintática e a tensão teológica de εἰς ὃ καὶ ἐτέθησαν sem impor uma interpretação denominacional.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: pedra que faz tropeçar
  rationale: Expressa em português natural a ideia de uma pedra que se torna causa de tropeço, sem depender da formulação menos corrente “pedra de tropeço”.
- source_word: πέτρα σκανδάλου
  choice: rocha que leva à queda
  rationale: Neste contexto, σκάνδαλον indica uma causa de queda, não meramente uma ofensa emocional ou um escândalo no sentido moderno.
- source_word: προσκόπτουσιν τῷ λόγῳ
  choice: tropeçam na palavra
  rationale: Mantém a relação direta indicada pelo dativo τῷ λόγῳ e conserva a metáfora do tropeço.
- source_word: ἀπειθοῦντες
  choice: pois lhe desobedecem
  rationale: O particípio descreve a desobediência à palavra e, no contexto, explica o tropeço; “lhe” retoma “a palavra”.
- source_word: ἐτέθησαν
  choice: foram destinados
  rationale: Comunica que foram postos ou designados para o referente de “isso”, mantendo a voz passiva e sem identificar explicitamente o agente.
theological_decisions:
- issue: Referente e alcance de εἰς ὃ καὶ ἐτέθησαν
  choice: e para isso também foram destinados
  alternative: e também foram destinados a desobedecer à palavra
  rationale: O pronome relativo neutro pode apontar para o tropeço ou para a situação descrita de forma mais ampla. A tradução com “isso” preserva essa ambiguidade e evita afirmar que a desobediência em si foi necessariamente o objeto da destinação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A citação conserva o paralelismo entre “pedra” e “rocha”; “leva à queda” evita o sentido moderno potencialmente enganoso de “escândalo”.
