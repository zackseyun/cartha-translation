  source_fidelity: 'A tradução preserva adequadamente as imagens de λίθος προσκόμματος e πέτρα σκανδάλου e mantém a ambiguidade deliberada de εἰς ὃ καὶ ἐτέθησαν. Contudo, «tropeçam na palavra» é menos preciso quanto à construção προσκόπτουσιν τῷ λόγῳ: no contexto, o dativo identifica aquilo contra/em que tropeçam, e a explicação participial é a desobediência à palavra. A revisão torna essa relação mais transparente sem resolver indevidamente o referente de «para isso».'
  naturalness: O registro é claro e contemporâneo. «Tropeçam por desobedecerem à palavra» é mais fluente e idiomático do que «tropeçam na palavra, pois lhe desobedecem», além de evitar que «na palavra» possa ser lido como simples localização ou meio.
  terminology: «Pedra que faz tropeçar», «rocha que leva à queda» e «foram destinados» são escolhas defensáveis e não introduzem linguagem doutrinariamente carregada. «Palavra» conserva o termo λόγος e a nota retém de modo apropriado a indeterminação do antecedente de εἰς ὃ.
