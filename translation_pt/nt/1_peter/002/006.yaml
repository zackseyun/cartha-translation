base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: pt
  text: 'Pois está escrito na Escritura: “Eis que ponho em Sião uma pedra angular, escolhida e honrada[a], e quem nele crê[b] jamais será envergonhado[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preciosa” ou “de grande valor”. O termo grego pode indicar tanto honra quanto alto valor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nela”, referindo-se à pedra. O contexto imediato aplica pessoalmente a imagem da pedra a Cristo.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “de modo nenhum será envergonhado”. A construção grega expressa uma negação enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Pois
  rationale: Introduz a fundamentação bíblica da afirmação anterior, com valor explicativo natural em português.
- source_word: περιέχει ἐν γραφῇ
  choice: está escrito na Escritura
  rationale: Reproduz de modo claro e digno a expressão grega incomum, cujo sentido idiomático é que a passagem se encontra registrada na Escritura.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva a chamada solene de atenção própria da citação profética.
- source_word: τίθημι ἐν Σιὼν
  choice: ponho em Sião
  rationale: Mantém o presente verbal e o sentido locativo da expressão grega.
- source_word: λίθον ἀκρογωνιαῖον
  choice: uma pedra angular
  rationale: É a designação portuguesa corrente para a pedra principal do ângulo de uma construção.
- source_word: ἐκλεκτὸν
  choice: escolhida
  rationale: Comunica diretamente a ideia de seleção sem recorrer a vocabulário teológico técnico.
- source_word: ἔντιμον
  choice: honrada
  rationale: Destaca o componente de honra do termo e preserva sua ligação temática com o contexto imediato; o sentido de alto valor continua possível.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: quem nele crê
  rationale: Expressa naturalmente o particípio substantivado e conserva a linguagem de crer; o pronome pessoal acompanha a aplicação cristológica feita por Pedro.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: jamais será envergonhado
  rationale: A combinação οὐ μή com o subjuntivo traz uma negação enfática, bem representada por 'jamais'; a voz passiva preserva a forma da expressão.
theological_decisions:
- issue: Referente de αὐτῷ na citação de Isaías conforme empregada por Pedro
  choice: nele
  alternative: nela, em referência à pedra
  rationale: Embora a imagem imediata seja a de uma pedra, o contexto de 1Pedro 2:4–8 identifica pessoalmente essa pedra com Cristo. 'Nele' preserva essa aplicação sem eliminar a metáfora.
- issue: Sentido de ἔντιμον
  choice: honrada
  alternative: preciosa ou valiosa
  rationale: O vocábulo pode indicar honra ou alto valor. 'Honrada' mantém a tensão lexical e se harmoniza com o tema da honra no versículo seguinte; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a solenidade da citação profética sem arcaísmos excessivos. Todos os marcadores de nota aparecem no texto principal.
