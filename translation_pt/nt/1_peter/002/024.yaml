id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: pt
  text: Ele mesmo levou os nossos pecados em seu corpo sobre o madeiro[a], para que, tendo morrido para os pecados, vivamos para a justiça. Pela ferida dele vocês foram curados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a árvore”; o grego diz literalmente “sobre o madeiro” ou “sobre a árvore”, provavelmente fazendo eco a Deuteronômio 21:23. A referência é à cruz.
    reason: alternative_reading
  - marker: b
    text: O singular “ferida” também pode ser entendido como “marca de golpe” ou “contusão” e faz eco a Isaías 53:5. A cura é expressa de modo amplo; neste contexto, está ligada aos pecados e à justiça, sem ser definida aqui como exclusivamente física ou espiritual.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: levou
  rationale: ἀναφέρω pode significar levar, carregar ou oferecer. Neste contexto, “levou os nossos pecados” preserva tanto a ideia de carregar pecados quanto a provável alusão a Isaías, sem impor uma formulação sacrificial mais técnica.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: em seu corpo
  rationale: Tradução direta e natural que mantém o caráter concreto e corporal do sofrimento.
- source_word: ἐπὶ τὸ ξύλον
  choice: sobre o madeiro
  rationale: ξύλον significa madeira, árvore ou objeto de madeira. “Madeiro” é compreensível no contexto da crucificação e conserva a distinção em relação ao termo grego específico para “cruz”, além da provável alusão a Deuteronômio 21:23.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: tendo morrido para os pecados
  rationale: ἀπογίνομαι expressa afastamento ou ruptura decisiva. A formulação comunica naturalmente essa ruptura e mantém o plural “pecados” do grego.
- source_word: τῇ δικαιοσύνῃ ζήσωμεν
  choice: vivamos para a justiça
  rationale: O dativo indica uma vida dirigida à δικαιοσύνη. “Justiça” é natural em português e, neste contexto ético, abrange a condição e a prática do que é justo.
- source_word: μώλωπι
  choice: ferida
  rationale: μώλωψ designa a marca ou ferida produzida por golpes. “Ferida” é corrente e preserva o singular que ecoa Isaías 53:5.
- source_word: ἰάθητε
  choice: vocês foram curados
  rationale: Mantém o aoristo passivo e a amplitude da imagem de cura, sem restringi-la explicitamente ao âmbito físico ou espiritual.
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Reproduz a força enfática do pronome intensivo grego.
theological_decisions:
- issue: Alcance da cura na oração final
  choice: Manter “vocês foram curados” sem definir a cura como exclusivamente física ou espiritual.
  alternative: Explicitar “curados do pecado” ou interpretar como cura física.
  rationale: O contexto liga a cura aos pecados, à justiça e ao sofrimento de Cristo, mas o texto conserva uma imagem ampla derivada de Isaías 53. A tradução não deve reduzir essa amplitude a uma fórmula doutrinária única.
- issue: Tradução de ξύλον
  choice: Usar “madeiro” no texto principal.
  alternative: “cruz” ou “árvore”.
  rationale: A referência é à crucificação, mas o grego emprega ξύλον, não σταυρός. “Madeiro” conserva o termo figurativo e a provável alusão bíblica sem obscurecer o referente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” como plural inclusivo. “Madeiro” preserva a imagem do original e a intertextualidade bíblica; embora seja um termo menos cotidiano, permanece reconhecível no registro bíblico. A ordem foi ajustada para fluidez em português sem perder a ênfase inicial em “Ele mesmo”.
