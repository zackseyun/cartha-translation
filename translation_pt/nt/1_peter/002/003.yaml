  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: pt
  text: se de fato vocês provaram que o Senhor é bom[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «visto que vocês provaram». O grego emprega uma forma condicional que pode pressupor que a condição seja verdadeira.'
    reason: alternative_reading
  - marker: b
    text: «Bom» também pode ser traduzido por «bondoso» ou «benigno». A expressão evoca o Salmo 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: se de fato
  rationale: Mantém a forma condicional grega e, com «de fato», sinaliza que a condição provavelmente pressupõe como verdadeira a experiência dos leitores, sem transformá-la diretamente em uma afirmação causal.
- source_word: ἐγεύσασθε
  choice: vocês provaram
  rationale: Preserva a imagem concreta de provar/saborear, coerente com a figura do alimento em 2:2–3 e com a alusão ao Salmo 34:8. O pretérito perfeito simples é a forma natural em português para o aoristo neste contexto.
- source_word: ὅτι
  choice: que
  rationale: 'Introduz diretamente o conteúdo da experiência: provaram «que o Senhor é bom», refletindo com naturalidade a sintaxe grega.'
- source_word: χρηστός
  choice: bom
  rationale: Expressa o sentido amplo de bondade e preserva a provável ressonância do Salmo 34:8; «bondoso» ou «benigno» tornariam o significado mais específico.
- source_word: κύριος
  choice: Senhor
  rationale: Conserva o título teológico e a ressonância intertextual com o Salmo, sem explicitar no texto se a referência é a Cristo.
theological_decisions:
- issue: Força da oração condicional com εἰ
  choice: «se de fato vocês provaram»
  alternative: «visto que vocês provaram» / «já que vocês provaram»
  rationale: Embora a construção provavelmente pressuponha que os leitores tiveram essa experiência, o grego mantém uma condição. A tradução conserva essa tensão retórica.
- issue: Referente de «o Senhor»
  choice: Manter apenas «o Senhor»
  alternative: «o Senhor, isto é, Cristo»
  rationale: O contexto relaciona estreitamente o título a Jesus, mas a formulação também evoca o Salmo 34:8. Não acrescentar uma identificação explícita preserva ambas as dimensões.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Vocês» evita regionalismo excessivo e comunica naturalmente o plural. A imagem de provar foi mantida por sua função no contexto imediato e por sua ligação com o Salmo.
