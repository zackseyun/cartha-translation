source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: pt
  text: 'Portanto, a honra é para vocês que creem[a]; mas para os que não creem[b]: “A pedra que os construtores rejeitaram, essa veio a ser a pedra que encabeça o canto[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a preciosidade é para vocês que creem”, isto é, a pedra é preciosa para os que creem.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os que desobedecem”; o verbo pode ter o sentido de recusar-se a crer e, assim, agir em desobediência.'
    reason: lexical_alternative
  - marker: c
    text: 'Tradicionalmente: “a pedra angular” ou “a principal pedra angular”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: honra
  rationale: O termo pode indicar honra, valor ou preciosidade. “Honra” preserva de modo conciso a afirmação de que ela pertence aos que creem, sem excluir a possível ligação contextual com o valor precioso da pedra.
- source_word: τοῖς πιστεύουσιν
  choice: vocês que creem
  rationale: Mantém tanto o tratamento direto no plural quanto o contraste explícito com os que não creem.
- source_word: ἀπιστοῦσιν
  choice: os que não creem
  rationale: No contraste imediato com πιστεύουσιν, a referência à falta de fé é a leitura mais clara. A possível nuance de desobediência é preservada em nota.
- source_word: λίθος
  choice: pedra
  rationale: É o equivalente natural no contexto da metáfora de construção e da citação do salmo.
- source_word: ἀπεδοκίμασαν
  choice: rejeitaram
  rationale: Expressa de forma corrente a rejeição após avaliação implícita no verbo grego.
- source_word: οἰκοδομοῦντες
  choice: construtores
  rationale: Traduz naturalmente o particípio substantivado e preserva a imagem arquitetônica.
- source_word: κεφαλὴν γωνίας
  choice: cabeça da esquina
  rationale: Mantém de maneira transparente a forma da expressão grega, sem restringi-la de imediato à interpretação arquitetônica tradicional “pedra angular”.
theological_decisions:
- issue: Sentido de ἡ τιμή em relação aos que creem e a Cristo como pedra
  choice: A honra pertence aos que creem.
  alternative: O valor precioso é para os que creem, referindo-se principalmente à preciosidade de Cristo para eles.
  rationale: A construção ὑμῖν ... ἡ τιμή indica mais diretamente que a honra é destinada aos que creem e se harmoniza com o contexto de não serem envergonhados. A relação possível com a preciosidade da pedra é mantida em nota.
- issue: Interpretação de κεφαλὴ γωνίας
  choice: Preservar no texto a metáfora literal “cabeça da esquina”.
  alternative: “Pedra angular” ou “principal pedra angular”.
  rationale: A formulação mantém a imagem cristologicamente significativa sem decidir qual função arquitetônica específica está em vista; as equivalências tradicionais aparecem em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da primeira oração foi ajustada para a fluência do português. O ponto e vírgula e os dois-pontos tornam claro o contraste e introduzem a citação, sem completar indevidamente a construção elíptica do grego.
