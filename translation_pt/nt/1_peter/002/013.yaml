  terminology: “Senhor” conserva o título κύριος sem especificar indevidamente o referente. “Instituição humana” é uma solução contextual sólida para κτίσις, e a nota registra alternativas relevantes. “Rei” mantém a amplitude lexical de βασιλεύς, sem reduzir o termo a “imperador”.
