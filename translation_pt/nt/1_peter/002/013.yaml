  source_fidelity: A tradução representa adequadamente Ὑποτάγητε como exortação reflexiva (“Sujeitem-se”), πάσῃ como distributivo (“a toda”), e ἀνθρωπίνῃ κτίσει no sentido contextual de estrutura cívica (“instituição humana”). “Por causa do Senhor” expressa corretamente o valor motivacional de διὰ τὸν κύριον. “Seja ao rei, como autoridade superior” preserva a construção aberta εἴτε e o sentido hierárquico de ὡς ὑπερέχοντι, cuja continuação ocorre no versículo seguinte.
