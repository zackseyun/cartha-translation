id: 1PE.2.13
reference: 1 Peter 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: pt
  text: Sujeitem-se a toda instituição humana[a] por causa do Senhor, seja ao rei, como autoridade superior[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a toda criação humana”; tradicionalmente, “a toda ordenança humana”. Aqui, a expressão se refere a instituições ou autoridades civis humanas, como mostram as referências seguintes ao rei e aos governadores.
    reason: lexical_alternative
  - marker: b
    text: Ou “como supremo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Sujeitem-se
  rationale: O imperativo aoristo passivo, com sentido reflexivo neste contexto, é expresso de modo natural e mantém a força da exortação.
- source_word: πάσῃ ἀνθρωπίνῃ κτίσει
  choice: a toda instituição humana
  rationale: πάσῃ tem valor distributivo, e o contexto imediato — rei e governadores — indica estruturas ou autoridades cívicas. “Instituição humana” comunica esse sentido sem apagar a alternativa literal de κτίσις, registrada em nota.
- source_word: διὰ τὸν κύριον
  choice: por causa do Senhor
  rationale: διά com acusativo indica motivo ou razão. A formulação é clara em português e mantém “Senhor” sem explicitar um referente que o grego não nomeia.
- source_word: εἴτε βασιλεῖ
  choice: seja ao rei
  rationale: εἴτε introduz o primeiro elemento de uma correlação continuada no versículo seguinte. βασιλεύς é traduzido diretamente por “rei”, sem restringi-lo a “imperador”.
- source_word: ὡς ὑπερέχοντι
  choice: como autoridade superior
  rationale: O particípio denota posição ou autoridade mais elevada. A expressão transmite a função política sem sugerir supremacia absoluta.
theological_decisions:
- issue: Sentido de κτίσει na relação com a autoridade civil
  choice: instituição humana
  alternative: criação humana; criatura humana; ordenança humana
  rationale: Os exemplos subsequentes de rei e governadores favorecem a referência à ordem ou às estruturas cívicas. A nota preserva a forma lexical incomum sem fazer o texto principal sugerir submissão indistinta a cada indivíduo.
- issue: Referente de κύριον
  choice: Senhor
  alternative: Jesus; Deus
  rationale: O grego traz apenas o título “Senhor”; não se explicita no texto traduzido aquilo que o versículo deixa implícito.
- issue: Alcance de ὑπερέχοντι
  choice: autoridade superior
  alternative: supremo
  rationale: A tradução expressa precedência hierárquica no âmbito civil sem atribuir ao rei uma supremacia irrestrita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sujeitem-se” preserva a força exortativa; “instituição humana” é natural no contexto cívico. A vírgula final mantém a continuidade sintática com 1Pedro 2:14.
