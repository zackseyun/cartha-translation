  to: Do mesmo modo, maridos, vivam com suas esposas com conhecimento[a], dando-lhes honra como a um vaso mais frágil, o feminino[b], e também como a coerdeiras da graça da vida[c], para que as orações de vocês não sejam impedidas.
  rationale: A revisão resolve a alternância pouco natural entre o singular «à mulher» e o plural «coerdeiras». «Dando-lhes honra» retoma claramente «suas esposas»; «como a um vaso mais frágil, o feminino» conserva a metáfora e o qualificativo de gênero do original; e «também como a coerdeiras» mantém o valor comparativo de ὡς καί, sem introduzir uma relação causal explícita.
