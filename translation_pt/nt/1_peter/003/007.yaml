id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: pt
  text: Do mesmo modo, maridos, vivam com suas esposas com conhecimento[a], dando-lhes honra como a um vaso mais frágil, o feminino[b], e também como a coerdeiras da graça da vida[c], para que as orações de vocês não sejam impedidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vivam com suas esposas de maneira compreensiva”.'
    reason: lexical_alternative
  - marker: b
    text: “Vaso mais frágil” é uma metáfora que pode indicar relativa fragilidade física ou vulnerabilidade social, não menor valor; a frase seguinte afirma que as esposas são coerdeiras da graça da vida.
    reason: cultural_note
  - marker: c
    text: A expressão “graça da vida” pode indicar a graça que consiste em vida ou a graça que concede vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: maridos
  rationale: No contexto das instruções dirigidas às esposas em 3:1, refere-se naturalmente aos maridos, não aos homens em geral.
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Mantém a ligação comparativa com as exortações anteriores.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: vivam com suas esposas com conhecimento
  rationale: Expressa a vida conjugal compartilhada e preserva a amplitude da construção κατὰ γνῶσιν; uma formulação portuguesa mais idiomática consta na nota.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: à mulher como ao vaso mais frágil
  rationale: Conserva tanto o comparativo quanto a metáfora do original, sem definir no texto principal a natureza dessa fragilidade.
- source_word: ἀπονέμοντες τιμήν
  choice: dando honra
  rationale: Formulação natural em português para conceder ou atribuir a honra devida.
- source_word: συγκληρονόμοις
  choice: coerdeiras
  rationale: Comunica de modo conciso a participação das esposas na mesma herança.
- source_word: χάριτος ζωῆς
  choice: da graça da vida
  rationale: Preserva a construção genitiva e sua possível amplitude sem decidir se a graça consiste em vida ou concede vida.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: para que as orações de vocês não sejam impedidas
  rationale: Mantém a finalidade e a voz passiva do grego em português claro.
theological_decisions:
- issue: Sentido de “vaso mais frágil”
  choice: Manter a descrição comparativa e a metáfora sem identificar fragilidade com menor valor.
  alternative: Explicitar no texto principal uma fragilidade física, social ou emocional.
  rationale: O original não especifica a natureza da fragilidade; o contexto ordena que a mulher seja honrada e afirma que ela compartilha a herança da graça da vida.
- issue: Relação expressa por ὡς καὶ συγκληρονόμοις
  choice: “e como a coerdeiras”
  alternative: “pois elas também são coerdeiras”
  rationale: A tradução escolhida preserva a construção comparativa ὡς καὶ e evita acrescentar uma relação causal mais explícita do que a do grego.
- issue: Natureza da herança compartilhada
  choice: “coerdeiras da graça da vida”
  alternative: Explicitar “coerdeiras da vida eterna” ou “do dom gracioso da vida”.
  rationale: A formulação mantém a afirmação de participação conjunta sem restringir o sentido de χάριτος ζωῆς além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O imperativo “vivam” reproduz em português a força exortativa do particípio grego. “Vaso” foi mantido por ser uma metáfora relevante do texto, esclarecida sem ser anulada pela nota.
