  terminology: “Justiça” é uma opção estabelecida e suficientemente ampla para δικαιοσύνη neste contexto, sem impor uma interpretação estreita. “Bem-aventurados” corresponde bem a μακάριοι em registro bíblico. “Temor” mantém coerência lexical com “não temam”.
