id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: pt
  text: Mas, ainda que venham a sofrer por causa da justiça, vocês são bem-aventurados. E não temam o temor deles[a], nem fiquem perturbados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o medo que eles causam” ou “aquilo que eles temem”. A expressão grega, literalmente “o temor deles”, ecoa Isaías 8:12 e admite mais de um sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Mas, ainda que venham a sofrer
  rationale: A construção concessiva com o optativo apresenta o sofrimento como possibilidade real, sem afirmar que necessariamente ocorrerá. “Ainda que venham a sofrer” comunica essa nuance em português natural.
- source_word: διὰ δικαιοσύνην
  choice: por causa da justiça
  rationale: διά com acusativo indica causa. “Justiça” preserva o termo teológico e ético δικαιοσύνη sem reduzi-lo apenas a boas ações nem restringi-lo à justiça social.
- source_word: μακάριοι
  choice: vocês são bem-aventurados
  rationale: O sujeito implícito foi explicitado para clareza. “Bem-aventurados” mantém a ressonância bíblica de μακάριοι e indica uma condição de favor que não depende de bem-estar emocional ou circunstancial.
- source_word: τὸν ... φόβον αὐτῶν
  choice: o temor deles[a]
  rationale: A formulação deliberadamente incomum preserva a ambiguidade do grego e a proximidade verbal com Isaías 8:12 na Septuaginta. As interpretações mais naturais são registradas em nota.
- source_word: μὴ φοβηθῆτε
  choice: não temam
  rationale: A proibição é expressa de modo direto e mantém, tanto quanto possível, a repetição entre φόβον e φοβηθῆτε.
- source_word: μηδὲ ταραχθῆτε
  choice: nem fiquem perturbados
  rationale: Expressa a agitação ou perturbação interior indicada por ταράσσω sem acrescentar uma causa não explícita.
- source_word: δὲ
  choice: E
  rationale: Aqui δέ faz a transição para a proibição seguinte; “E” dá continuidade ao pensamento sem introduzir um contraste excessivamente forte.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão; prática do que é certo
  rationale: “Justiça” conserva a amplitude moral e teológica do termo grego. “Retidão” seria possível no contexto de conduta íntegra, mas estreitaria a rede lexical de δικαιοσύνη.
- issue: Ambiguidade de τὸν φόβον αὐτῶν
  choice: o temor deles
  alternative: o medo que eles causam; aquilo que eles temem
  rationale: O genitivo αὐτῶν pode apontar para o temor inspirado por eles ou para aquilo que eles próprios temem. A tradução principal não decide silenciosamente entre essas leituras e preserva o eco de Isaías 8:12.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A expressão incomum “não temam o temor deles” é mantida de propósito para conservar a repetição lexical, a alusão a Isaías e a ambiguidade do original.
