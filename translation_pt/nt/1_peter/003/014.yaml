  source_fidelity: A tradução representa com precisão a concessão potencial de ἀλλ’ εἰ καὶ πάσχοιτε, a causa em διὰ δικαιοσύνην, a declaração μακάριοι e as duas proibições coordenadas. “O temor deles” preserva adequadamente a ambiguidade deliberada de τὸν φόβον αὐτῶν e seu eco de Isaías 8:12.
