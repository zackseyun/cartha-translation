  text: ao observarem a conduta pura de vocês, vivida em temor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: ao observarem
  rationale: Expressa naturalmente a ideia de ver ou testemunhar atentamente, com valor temporal ligado ao contexto da frase.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: conduta pura
  rationale: ἀναστροφή denota modo de viver ou comportamento, e ἁγνή indica pureza moral; a formulação é clara e digna em português atual.
- source_word: ἐν φόβῳ
  choice: vivida em temor
  rationale: Mantém a preposição e a ambiguidade genuína de φόβος, sem reduzi-lo explicitamente a respeito nem determinar neste versículo o objeto do temor. 'Vivida' esclarece que a locução caracteriza a conduta.
theological_decisions:
- issue: Sentido e objeto de ἐν φόβῳ
  choice: em temor
  alternative: com respeito; no temor de Deus
  rationale: O grego não explicita aqui o objeto do temor. A tradução preserva essa abertura e evita tanto enfraquecer φόβος para mero respeito quanto acrescentar 'de Deus' ao texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção evita a formulação pouco idiomática 'conduta pura em temor' por meio de 'vivida', sem resolver a ambiguidade teológica do original.
