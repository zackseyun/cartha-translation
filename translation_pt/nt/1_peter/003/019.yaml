translation:
  language: pt
  text: no qual[a] também foi e proclamou[b] aos espíritos na prisão[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em quem”; alternativamente, “por meio do qual”. A expressão grega pode ser entendida de mais de uma maneira em sua relação com a oração anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “pregou”. O verbo indica fazer uma proclamação, mas aqui o texto não especifica exatamente o conteúdo da mensagem.
    reason: lexical_alternative
  - marker: c
    text: A identidade dos “espíritos na prisão” é debatida; entre as possibilidades estão seres humanos falecidos e seres angelicais caídos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: no qual
  rationale: Mantém a ligação com a expressão anterior e não define de modo rígido se a relação é de esfera, referência pessoal ou meio. Em português, o masculino concorda naturalmente com “espírito” no contexto anterior, embora o pronome grego seja neutro.
- source_word: καὶ
  choice: também
  rationale: Expressa com clareza o valor aditivo da conjunção neste contexto.
- source_word: τοῖς ... πνεύμασιν
  choice: aos espíritos
  rationale: Traduz diretamente πνεύμασιν sem substituir o termo por “almas” nem identificar interpretativamente esses seres.
- source_word: ἐν φυλακῇ
  choice: em prisão
  rationale: φυλακή pode indicar um lugar de guarda ou confinamento; “em prisão” conserva a imagem sem explicar além do texto.
- source_word: πορευθεὶς
  choice: foi
  rationale: Converte o particípio aoristo em verbo finito para produzir português natural, preservando a ideia de deslocamento sem tornar excessivamente explícita a relação temporal.
- source_word: ἐκήρυξεν
  choice: proclamou
  rationale: κηρύσσω indica fazer uma proclamação. “Proclamou” evita pressupor que a mensagem tenha sido evangelística, judicial ou uma declaração de vitória.
theological_decisions:
- issue: Referente de ἐν ᾧ
  choice: “no qual”, mantendo aberta a relação com a referência anterior
  alternative: “em quem” ou “por meio do qual”
  rationale: A construção admite mais de uma compreensão sintática e teológica. A tradução principal preserva a conexão gramatical sem definir o modo exato da proclamação.
- issue: Identidade dos “espíritos em prisão”
  choice: deixada sem especificação
  alternative: seres humanos mortos, seres angelicais caídos ou uma classe mais ampla de espíritos aprisionados
  rationale: A expressão grega não identifica esses espíritos com precisão suficiente para resolver na tradução uma questão historicamente debatida.
- issue: Natureza da mensagem expressa por ἐκήρυξεν
  choice: “proclamou”
  alternative: “pregou”, anunciou juízo ou declarou vitória
  rationale: O verbo afirma uma proclamação, mas este versículo não explicita seu conteúdo; por isso, a tradução não o restringe a uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão do grego e suas ambiguidades genuínas, sem introduzir uma interpretação denominacional.
