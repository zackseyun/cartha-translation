  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: pt
  text: E quem fará mal a vocês, se vocês se tornarem zelosos pelo bem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “empenhados pelo bem”.'
    reason: Alternativa lexical para ζηλωταί, que pode destacar empenho ou ardor.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Conector neutro que preserva a continuidade com a exortação anterior.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: quem fará mal a vocês
  rationale: A construção com artigo e particípio futuro é substantiva e forma uma pergunta retórica. Esta formulação preserva o sentido futuro e a ideia ampla de causar dano ou maltratar.
- source_word: ἐὰν
  choice: se
  rationale: Introduz de modo natural a oração condicional com o subjuntivo.
- source_word: τοῦ ἀγαθοῦ
  choice: pelo que é bom
  rationale: Expressa naturalmente o adjetivo neutro substantivado como objeto do zelo, sem restringi-lo a uma ação específica.
- source_word: ζηλωταὶ
  choice: zelosos
  rationale: Mantém a intensidade de ζηλωτής, que indica pessoas ardorosamente empenhadas em favor de algo; a nota registra uma alternativa mais cotidiana.
- source_word: γένησθε
  choice: se tornarem
  rationale: Preserva o valor de γίνομαι e sua possível nuance ingressiva, em vez de reduzi-lo simplesmente a 'forem'.
theological_decisions:
- issue: Força da pergunta retórica diante do sofrimento por causa da justiça
  choice: Manter a pergunta como uma garantia retórica geral, sem transformá-la numa promessa absoluta de que os fiéis jamais sofrerão.
  alternative: Entender que ninguém pode causar qualquer dano real aos fiéis.
  rationale: O contexto imediato, sobretudo o versículo seguinte, admite a possibilidade de sofrer por fazer o bem. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural ὑμᾶς é explicitado por “vocês”. “Fará mal” é natural e suficientemente amplo para κακόω; “zelosos” conserva a força do original, acompanhado de alternativa em nota.
