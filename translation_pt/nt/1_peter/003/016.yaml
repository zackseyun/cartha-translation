id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: pt
  text: mas com mansidão e temor[a], tendo boa consciência, para que, naquilo em que vocês são caluniados[b], sejam envergonhados os que insultam a boa conduta de vocês no Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com mansidão e reverência” ou “com mansidão e respeito”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na questão em que falam contra vocês”.'
    reason: lexical_alternative
  - marker: c
    text: 'Grego: “no Messias”; tradicionalmente, “em Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: mansidão
  rationale: Expressa uma atitude humilde e não agressiva; é uma formulação clara e digna no contexto da exortação.
- source_word: φόβου
  choice: temor
  rationale: Preserva a amplitude do termo grego, que pode indicar medo, reverência ou respeito, sem explicitar um objeto que o texto não declara.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: tendo boa consciência
  rationale: Reproduz naturalmente a construção participial e mantém a ideia de uma condição contínua que acompanha a resposta dos leitores.
- source_word: ἐν ᾧ
  choice: naquilo em que
  rationale: Mantém aberta a referência compacta do grego à esfera ou matéria em que os leitores são atacados.
- source_word: καταλαλεῖσθε
  choice: vocês são caluniados
  rationale: Comunica a fala hostil e difamatória indicada pelo verbo, em português corrente.
- source_word: καταισχυνθῶσιν
  choice: sejam envergonhados
  rationale: Conserva a voz passiva e a nuance de propósito ou resultado do subjuntivo após ἵνα.
- source_word: ἐπηρεάζοντες
  choice: os que insultam
  rationale: Representa a ação hostil de ultrajar ou maltratar, ajustando-se à referência imediata a ataques contra a conduta dos leitores.
- source_word: ἀναστροφήν
  choice: conduta
  rationale: Traduz de modo conciso o modo de viver ou comportamento, preservando a ênfase ética.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Mantém o sentido titular de Χριστός neste contexto, em vez de apenas transliterá-lo.
- source_word: ἀγαθὴν
  choice: boa
  rationale: Preserva a simplicidade moral e a repetição lexical do adjetivo aplicado à consciência e à conduta.
theological_decisions:
- issue: Sentido de φόβου na expressão μετὰ πραΰτητος καὶ φόβου
  choice: temor, sem objeto explícito
  alternative: reverência; respeito; temor de Deus
  rationale: O contexto imediato não identifica expressamente o objeto do temor. A tradução mantém essa abertura interpretativa.
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O título continua semanticamente ativo na expressão ἐν Χριστῷ; a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. Emprega “vocês” para clareza, “mansidão” e “temor” em registro bíblico ainda corrente, e conserva a ambiguidade do original sem acrescentar o objeto do temor.
