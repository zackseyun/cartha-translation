  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: pt
  text: Não retribuam mal por mal nem insulto por insulto[a]. Pelo contrário[b], abençoem, pois vocês foram chamados para isso[c], a fim de herdarem uma bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofensa verbal por ofensa verbal”. O termo grego pode indicar linguagem abusiva ou insultuosa.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “mas, em vez disso”. A expressão grega assinala uma forte inversão: “pelo contrário”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, chamados por Deus a responder aos maus-tratos com bênção, em vez de retaliação. A expressão também pode abranger de modo mais amplo a vida cristã de não retaliação.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: retribuam
  rationale: O particípio presente com μή tem força exortativa no contexto. “Retribuam” conserva a ideia de responder na mesma moeda e soa natural em português.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: mal por mal
  rationale: Expressão ética clara e consagrada que preserva tanto o peso moral de κακόν quanto a reciprocidade indicada por ἀντί.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: insulto por insulto
  rationale: λοιδορία denota fala insultuosa ou abusiva. “Insulto” é atual, compreensível e mantém o paralelismo da retaliação.
- source_word: τοὐναντίον δὲ
  choice: Pelo contrário
  rationale: Marca uma reversão enfática da conduta anterior. A expressão portuguesa comunica esse contraste com clareza e naturalidade.
- source_word: εὐλογοῦντες
  choice: abençoem
  rationale: O particípio tem força exortativa paralela à proibição. A tradução não acrescenta objeto e preserva a possibilidade de falar bem ou invocar o favor de Deus.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão da exortação. “Pois” mantém a relação causal e dá fluidez à frase.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: vocês foram chamados para isso
  rationale: A construção passiva aponta para um chamado, com Deus como agente implícito, sem precisar explicitá-lo no texto. “Para isso” conserva a referência relativamente aberta do grego.
- source_word: ἵνα
  choice: a fim de
  rationale: Expressa propósito ou resultado pretendido com clareza, sem eliminar a possível sobreposição entre essas nuances.
- source_word: εὐλογίαν
  choice: uma bênção
  rationale: O substantivo sem artigo é vertido de modo idiomático em português e mantém o elo lexical com o verbo “abençoem”.
- source_word: κληρονομήσητε
  choice: herdarem
  rationale: Preserva a imagem familiar e pactual de receber algo como herança, em vez de reduzi-la ao simples ato de receber.
theological_decisions:
- issue: Referência de εἰς τοῦτο em “foram chamados para isso”
  choice: Manter “isso” ligado de modo mais imediato à conduta de abençoar em vez de retaliar, sem restringir explicitamente o referente.
  alternative: Entender o chamado de forma mais ampla como referente a toda a vida cristã de sofrimento e não retaliação, ou relacioná-lo mais diretamente à herança da bênção.
  rationale: O contexto imediato favorece a conduta recém-mencionada, mas a formulação grega permite uma referência mais ampla. A tradução preserva essa abertura em vez de resolver a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para legibilidade brasileira e internacional. Os particípios gregos de força exortativa foram vertidos como imperativos diretos. A repetição “mal por mal” e “insulto por insulto” preserva o paralelismo retórico; “abençoem” permanece sem objeto explícito, como no grego.
