  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: pt
  text: os quais, no passado, foram desobedientes, quando a paciência de Deus aguardava nos dias de Noé, enquanto a arca estava sendo preparada. Para dentro da qual poucas pessoas[a] — isto é, oito — foram levadas a salvo através da água.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “oito almas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foram salvas por meio da água”.'
    reason: interpretive_alternative
lexical_decisions:
- source_word: ἀπειθήσασίν ποτε
  choice: no passado, foram desobedientes
  rationale: Expressa a desobediência em um tempo anterior sem reduzir o termo à incredulidade intelectual.
- source_word: ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία
  choice: a paciência de Deus esperava
  rationale: Conserva a personificação e o aspecto contínuo do imperfeito; 'paciência' comunica de modo atual a demora contida do juízo.
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: enquanto a arca era preparada
  rationale: Mantém o sentido amplo de preparar ou deixar pronta, sem limitar o processo apenas à construção.
- source_word: εἰς ἣν
  choice: Nela
  rationale: Em português, 'nela' é natural no contexto e pode representar a entrada na arca sem a rigidez de 'para dentro da qual'.
- source_word: ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: poucas pessoas — isto é, oito
  rationale: ψυχαί designa aqui seres humanos contados; 'pessoas' evita sugerir uma afirmação técnica sobre a composição humana.
- source_word: διεσώθησαν δι’ ὕδατος
  choice: foram levadas em segurança através da água
  rationale: Preserva a ideia concreta de atravessar um perigo em segurança e mantém a possível relação instrumental ou espacial de διά aberta por meio de nota.
theological_decisions:
- issue: Possível carga soteriológica de διεσώθησαν
  choice: foram levadas em segurança através da água
  alternative: foram salvas por meio da água
  rationale: A formulação principal destaca a preservação concreta no dilúvio, sem eliminar a tradução tradicional e teologicamente relevante, registrada em nota.
- issue: Sentido de ψυχαί
  choice: pessoas
  alternative: almas
  rationale: O contexto conta os seres humanos na arca, sem formular uma antropologia técnica; a tradução mais literal é preservada em nota.
- issue: Valor de δι’ ὕδατος
  choice: através da água
  alternative: por meio da água
  rationale: A preposição com genitivo pode indicar meio, mas o contexto também evoca passagem através das águas. A tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluência sem apagar a conexão com o antecedente do versículo anterior. Os marcadores [a] e [b] aparecem no texto principal.
