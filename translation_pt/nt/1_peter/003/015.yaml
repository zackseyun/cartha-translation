id: 1PE.3.15
reference: 1 Peter 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: pt
  text: Mas, no coração de vocês, reconheçam como santo o Messias[a], o Senhor[b], estando sempre prontos para apresentar uma defesa a todo aquele que lhes pedir uma explicação a respeito da esperança que há em vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título grego Χριστός é traduzido aqui como “Messias”; também pode ser tradicionalmente vertido como “Cristo”.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “santifiquem o Messias como Senhor no coração de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: o Messias, o Senhor
  rationale: Mantém os dois títulos e a identificação cristológica expressa pelo grego. “Messias” traduz Χριστός como título, enquanto “Senhor” traduz κύριον.
- source_word: ἁγιάσατε
  choice: reconheçam como santo
  rationale: Comunica a ordem de tratar e honrar o Messias como santo, sem sugerir que os leitores o tornam santo. Uma nota preserva a formulação mais literal “santifiquem”.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: no coração de vocês
  rationale: Expressão natural em português para a esfera interior; o singular distributivo “coração” combina bem com “de vocês”.
- source_word: ἕτοιμοι ἀεὶ
  choice: estando sempre prontos
  rationale: Preserva tanto a prontidão contínua quanto a ligação participial com a ordem anterior.
- source_word: πρὸς ἀπολογίαν
  choice: para apresentar uma defesa
  rationale: Conserva a ideia de resposta fundamentada ou defesa presente em ἀπολογία, com formulação corrente em português.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: a todo aquele que lhes pedir
  rationale: Preserva o sentido distributivo e abrangente de παντί em linguagem clara.
- source_word: λόγον
  choice: uma explicação
  rationale: Neste contexto, λόγος designa uma exposição fundamentada ou razão apresentada em resposta a uma pergunta; “explicação” evita a possível ambiguidade de “razão” como estar certo.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: a respeito da esperança que há em vocês
  rationale: Reproduz de modo próximo e natural tanto a relação temática de περί quanto a expressão ἐν ὑμῖν.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Aqui Χριστός funciona claramente como título e aparece numa confissão ligada a κύριος; “Messias” torna explícito o valor titular sem acrescentar conteúdo denominacional.
- issue: Sentido de ἁγιάσατε tendo o Messias como objeto
  choice: reconheçam como santo
  alternative: santifiquem
  rationale: A escolha comunica reverência e reconhecimento da santidade, evitando a impressão indevida de que seres humanos conferem santidade ao Messias. A nota mantém acessível a forma mais literal e a tensão da expressão grega.
- issue: Relação sintática entre κύριον e τὸν Χριστόν
  choice: o Messias, o Senhor
  alternative: o Messias como Senhor
  rationale: A aposição portuguesa preserva a identificação entre os títulos e acompanha de perto a ordem conceitual do grego, sem excluir a leitura predicativa explicitada na nota literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A frase conserva a continuidade sintática do versículo e termina com vírgula porque o trecho fornecido prossegue no versículo completo.
