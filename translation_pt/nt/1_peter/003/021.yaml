  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: pt
  text: O batismo, que corresponde àquilo, agora também salva vocês — não como remoção da sujeira da carne, mas como apelo[a] a Deus por uma boa consciência — por meio da ressurreição de Jesus, o Messias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas como o compromisso de uma boa consciência para com Deus”. O termo grego traduzido como “apelo” (ἐπερώτημα) também pode ser entendido como “compromisso” ou “resposta”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: que corresponde àquilo
  rationale: Expressa a correspondência tipológica com a água e o acontecimento do dilúvio mencionados anteriormente, sem recorrer ao termo técnico e pouco acessível “antítipo” nem reduzir a relação a mero símbolo.
- source_word: σῴζει
  choice: salva
  rationale: Mantém de modo direto o presente do indicativo e não enfraquece a afirmação explícita do texto; as qualificações seguintes delimitam seu sentido.
- source_word: βάπτισμα
  choice: O batismo
  rationale: É a tradução corrente e adequada; o próprio versículo distingue o batismo de uma simples limpeza física.
- source_word: σαρκὸς
  choice: da carne
  rationale: Preserva o sentido concreto de σάρξ no contraste com a sujeira física, evitando substituir o termo por uma interpretação teológica.
- source_word: ἀπόθεσις ῥύπου
  choice: remoção da sujeira
  rationale: Formulação clara e atual para a eliminação de impureza física.
- source_word: συνειδήσεως ἀγαθῆς
  choice: por uma boa consciência
  rationale: Representa a relação genitiva comprimida como o objeto buscado no apelo a Deus. Como a construção admite outras relações semânticas, a nota registra a principal alternativa ligada a ἐπερώτημα.
- source_word: ἐπερώτημα
  choice: apelo
  rationale: “Apelo” se ajusta bem à direção indicada por εἰς θεόν e evita introduzir no texto principal uma teologia específica de voto batismal; a alternativa “compromisso” é preservada em nota.
- source_word: εἰς θεόν
  choice: a Deus
  rationale: Expressa naturalmente a direção do apelo.
- source_word: δι’ ἀναστάσεως
  choice: por meio da ressurreição
  rationale: Torna explícito o valor instrumental de διά com o genitivo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jesus, o Messias
  rationale: Trata Χριστός como título e o apresenta de forma idiomática em português.
theological_decisions:
- issue: Relação entre o batismo e a salvação
  choice: Conservar a afirmação direta de que o batismo “agora também salva vocês”, deixando que a própria ressalva de Pedro esclareça a afirmação.
  alternative: Parafrasear como “simboliza a salvação” ou ampliar o texto para impor uma doutrina sacramental denominacional específica.
  rationale: O grego atribui diretamente ao batismo uma função salvadora, mas imediatamente exclui a mera lavagem exterior e vincula a afirmação à consciência diante de Deus e à ressurreição de Jesus. A tradução preserva essa tensão sem enfraquecê-la nem explicá-la além do texto.
- issue: Sentido de ἐπερώτημα no contexto batismal
  choice: Usar “apelo” no texto principal.
  alternative: “Compromisso”, “resposta” ou “pedido”.
  rationale: O termo é genuinamente discutido. “Apelo” combina com εἰς θεόν, enquanto “compromisso” possui apoio lexical e contextual suficiente para ser registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi reorganizada para evitar uma abertura artificial como “correspondendo àquilo”, sem perder a ligação tipológica com o contexto anterior. “Carne” foi mantido por fidelidade lexical, e os travessões ajudam a tornar clara a ressalva parentética.
