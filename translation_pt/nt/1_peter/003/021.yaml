review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a afirmação direta de que o batismo salva, a distinção de uma limpeza meramente física e o meio da ressurreição de Jesus, o Messias. «Que corresponde àquilo» comunica de modo compreensível o valor tipológico de ἀντίτυπον no contexto precedente. «Apelo a Deus por uma boa consciência» é uma solução defensável para a construção debatida ἐπερώτημα εἰς θεόν.
  naturalness: O português é moderno e claro. Contudo, a vírgula imediatamente após o travessão de fechamento («—, por meio») é pontuação inadequada e interrompe desnecessariamente a construção.
  terminology: «Batismo», «carne», «consciência», «ressurreição» e «Jesus, o Messias» são escolhas fiéis e idiomáticas. A nota registra apropriadamente a alternativa interpretativa para ἐπερώτημα, mas sua âncora deve estar em «apelo», termo que a nota explica, e não em «consciência».
  issues:
  - severity: low
    issue: Pontuação após o travessão de fechamento
    rationale: Em português, não se emprega vírgula entre o travessão que encerra o inciso e «por meio da ressurreição». A remoção preserva a sintaxe e melhora a leitura.
  - severity: medium
    issue: Âncora da nota de alternativa lexical
    rationale: A nota explica ἐπερώτημα («apelo»), mas o marcador está ligado a «boa consciência». O marcador deve seguir «apelo», para identificar com precisão o termo cuja alternativa («compromisso»/«resposta») está sendo indicada.
