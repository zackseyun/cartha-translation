  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: pt
  text: Por fim, tenham todos o mesmo modo de pensar, sejam solidários, amem-se como irmãos[a], tenham coração compassivo e sejam humildes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tenham amor fraternal”. O grego emprega linguagem familiar de irmãos, em sentido inclusivo para toda a comunidade de fiéis.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “corteses” ou “afáveis” em vez de “humildes”.
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Por fim
  rationale: Funciona naturalmente em português como marcador discursivo que introduz o resumo conclusivo das exortações.
- source_word: πάντες
  choice: todos
  rationale: Explicita que a exortação se dirige à comunidade inteira.
- source_word: ὁμόφρονες
  choice: tenham o mesmo modo de pensar
  rationale: Preserva o elemento mental do composto e comunica uma disposição comum sem exigir identidade absoluta de opinião.
- source_word: συμπαθεῖς
  choice: sejam solidários
  rationale: Expressa a disposição de compartilhar os sentimentos e as experiências alheias em português atual, sem duplicar diretamente o sentido compassivo do termo seguinte.
- source_word: φιλάδελφοι
  choice: amem-se como irmãos
  rationale: Mantém a imagem familiar de afeto entre irmãos usada para a comunidade de fé; a abrangência inclusiva é esclarecida em nota.
- source_word: εὔσπλαγχνοι
  choice: tenham coração compassivo
  rationale: Comunica compaixão profunda e calorosa, preservando de forma idiomática a dimensão afetiva do termo.
- source_word: ταπεινόφρονες
  choice: sejam humildes
  rationale: Transmite em português natural a humildade de atitude ou disposição mental indicada pelo composto; a variante textual é registrada em nota.
theological_decisions:
- issue: Linguagem familiar de gênero em φιλάδελφοι
  choice: amem-se como irmãos
  alternative: tenham amor fraternal; amem-se como irmãos e irmãs
  rationale: A formulação conserva a metáfora de irmãos do grego, enquanto a nota esclarece que ela inclui toda a comunidade de fiéis.
- issue: Forma textual do adjetivo final
  choice: ταπεινόφρονες = sejam humildes
  alternative: φιλόφρονες = sejam corteses ou afáveis
  rationale: Segue-se o texto da SBLGNT, sem ocultar a variante manuscrita relevante.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência de adjetivos gregos foi convertida em exortações verbais naturais, preservando o paralelismo e evitando linguagem excessivamente técnica.
