source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: pt
  text: como Sara obedeceu a Abraão, chamando-o de senhor. Vocês se tornaram filhas dela[a] se fazem o bem e não têm medo de intimidação alguma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo os particípios de modo descritivo: “Vocês se tornaram filhas dela, fazendo o bem e não tendo medo...”'
    reason: Preserva a possibilidade de entender os particípios como descrição contínua, em vez de condição explícita, sem alterar o sentido de ἐγενήθητε.
  - marker: b
    text: 'Ou: “de terror algum” ou “de coisa alguma que cause medo”.'
    reason: Registra alternativas lexicais para πτόησις, que pode designar terror, alarme ou algo amedrontador.
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz Sara como exemplo correspondente à exortação anterior; “como” expressa naturalmente a comparação em português.
- source_word: ὑπήκουσεν
  choice: obedeceu
  rationale: É o sentido direto de ὑπακούω e preserva sem atenuação a relação expressa pelo verbo com Abraão como objeto indireto.
- source_word: κύριον αὐτὸν καλοῦσα
  choice: chamando-o de senhor
  rationale: Mantém a referência à maneira respeitosa como Sara se referiu a Abraão, sem tratar “senhor” como título divino.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: Vocês se tornaram filhas dela
  rationale: “Se tornaram” comunica a entrada em uma condição com relevância presente. Embora τέκνα seja literalmente “filhos/crianças”, “filhas” concorda naturalmente com as mulheres diretamente interpeladas, como mostram os particípios femininos plurais.
- source_word: ἀγαθοποιοῦσαι
  choice: se fazem o bem
  rationale: O particípio feminino plural descreve a conduta das destinatárias e, no contexto exortativo, admite força condicional; a alternativa descritiva é preservada em nota.
- source_word: μὴ φοβούμεναι
  choice: não têm medo
  rationale: Transforma o particípio coordenado em forma verbal natural em português, preservando a disposição contínua de não temer.
- source_word: μηδεμίαν πτόησιν
  choice: ameaça alguma
  rationale: πτόησις pode indicar terror, susto ou aquilo que amedronta. “Ameaça alguma” comunica de modo idiomático a possível pressão intimidatória, enquanto alternativas mais literais são registradas em nota.
theological_decisions:
- issue: A obediência exemplar de Sara em relação às esposas cristãs
  choice: Manter “obedeceu” como sentido direto do verbo, sem ampliar o versículo para uma doutrina abrangente do casamento.
  alternative: Atenuar para “se submeteu” ou “deu ouvidos”.
  rationale: A tradução não deve suavizar o verbo grego por razões culturais ou doutrinárias, nem acrescentar ao texto conclusões que pertencem à interpretação do contexto mais amplo.
- issue: Relação dos particípios ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι com a oração principal
  choice: Expressar a nuance prática e condicional com “se fazem o bem e não têm medo”.
  alternative: 'Entender os particípios descritivamente: “enquanto fazem o bem e não têm medo”.'
  rationale: A construção grega admite que os particípios descrevam como as leitoras demonstram ser filhas de Sara, com possível nuance condicional. A nota conserva essa tensão sem resolvê-la de forma rígida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Senhor” aparece em minúscula por ser uma forma respeitosa de referência a Abraão, não um título divino. “Filhas” torna explícito o gênero feminino das destinatárias indicado pelos particípios gregos.
