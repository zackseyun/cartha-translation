source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: pt
  text: o qual está à direita de Deus, tendo ido para o céu[a], e a quem anjos, autoridades e poderes foram submetidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para dentro do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς
  choice: o qual
  rationale: Retoma Jesus Cristo no versículo anterior e preserva a ligação sintática do pronome relativo grego.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: à direita de Deus
  rationale: Expressão portuguesa natural que conserva a imagem bíblica de posição exaltada e honra, sem reduzi-la a uma explicação interpretativa.
- source_word: πορευθεὶς
  choice: tendo ido
  rationale: Mantém o valor participial e apresenta a ida como anterior ao estado expresso pelo verbo principal.
- source_word: εἰς οὐρανόν
  choice: para o céu
  rationale: Forma corrente em português para expressar movimento em direção ao céu; a nota registra de modo cauteloso a força direcional de εἰς.
- source_word: ὑποταγέντων
  choice: sujeitos
  rationale: A construção com 'com' expressa o estado resultante da submissão e evita uma sequência pesada de gerúndios, preservando o sentido passivo.
- source_word: αὐτῷ
  choice: a ele
  rationale: O dativo indica aquele a quem os seres e poderes estão sujeitos.
- source_word: ἀγγέλων
  choice: anjos
  rationale: No contexto de exaltação e de poderes cósmicos, refere-se naturalmente a seres celestiais, não a mensageiros humanos.
- source_word: ἐξουσιῶν
  choice: autoridades
  rationale: Preserva uma designação distinta dentro da enumeração de seres ou poderes cósmicos.
- source_word: δυνάμεων
  choice: poderes
  rationale: Tradução concisa e tradicional que mantém a distinção em relação a 'autoridades'.
theological_decisions:
- issue: Natureza da exaltação de Cristo à direita de Deus
  choice: Conservar a expressão bíblica espacial e relacional 'à direita de Deus'.
  alternative: no lugar de maior honra junto de Deus
  rationale: A formulação original tem peso cristológico próprio; explicá-la apenas como honra resolveria interpretativamente uma imagem que o texto mantém.
- issue: Identidade de 'anjos, autoridades e poderes'
  choice: Manter as três categorias amplas sem classificá-las moralmente.
  alternative: seres angelicais bons; ou poderes espirituais hostis
  rationale: O grego não especifica se todos são bons, maus ou uma combinação; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para deixar clara, em português, a anterioridade da ida ao céu e evitar que o particípio pareça modificar 'Deus'.
