review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a localização à direita de Deus, a ida ao céu e a sujeição das três categorias a Cristo. Contudo, a ordem atual antecipa a ida ao céu, e «com ... sujeitos a ele» pode sugerir mera companhia, enfraquecendo a relação passiva de submissão expressa por ὑποταγέντων.
  naturalness: «O qual está à direita de Deus, tendo ido para o céu, e a quem anjos, autoridades e poderes foram submetidos» é claro, idiomático e mantém um registro bíblico moderno. A nota deve apresentar a alternativa como formulação mais literal, sem dizer impropriamente que o grego «também pode» ser traduzido dessa forma.
  terminology: «À direita de Deus», «anjos», «autoridades» e «poderes» são escolhas adequadas. «Foram submetidos a ele» torna explícita a voz passiva de ὑποταγέντων e preserva a abertura do texto quanto à natureza dessas categorias.
  issues:
  - severity: low
    issue: A oração inicial está em ordem diversa da progressão do grego.
    rationale: A antecipação de «tendo ido para o céu» não altera substancialmente o sentido, mas a ordem do original é facilmente preservável em português.
  - severity: medium
    issue: «Com anjos, autoridades e poderes sujeitos a ele» pode ser lido como acompanhamento, não como submissão efetuada.
    rationale: O particípio passivo ὑποταγέντων afirma que essas entidades foram submetidas a Cristo. Uma oração relativa com voz passiva torna essa relação inequívoca.
  - severity: low
    issue: A formulação da nota «também pode ser traduzido mais literalmente» é imprecisa.
    rationale: «Para dentro do céu» é uma representação mais literal da direção marcada por εἰς, não uma alternativa independente ao sentido de «para o céu».
  revised_text: o qual está à direita de Deus, tendo ido para o céu[a], e a quem anjos, autoridades e poderes foram submetidos.
  revised_footnotes:
