  source_fidelity: A tradução representa adequadamente a construção elíptica ἐν τῷ ἀφθάρτῳ, suprindo prudentemente “beleza” e explicando o suprimento em nota. “A pessoa escondida no coração” comunica o “ser humano/pessoa oculto do coração” sem introduzir especificidade masculina. “Espírito manso e sereno” transmite de modo fiel πραέως καὶ ἡσυχίου, e “muito precioso diante de Deus” reproduz bem πολυτελές ἐνώπιον τοῦ θεοῦ. A retomada por “Isso é” é uma solução portuguesa aceitável para o relativo neutro ὅ, cujo antecedente pode abranger a realidade interior recém-descrita.
  naturalness: O texto é claro, moderno e de registro digno. “Pessoa escondida no coração” conserva a imagem deliberadamente incomum do grego sem se tornar obscura. “Sereno” evita reduzir ἡσύχιος a silêncio e soa natural no português internacional. A divisão em duas frases é fluente e não altera a relação sintática ou argumentativa do original.
  terminology: As escolhas “pessoa”, “beleza imperecível”, “manso”, “sereno”, “espírito”, “diante de Deus” e “muito precioso” são consistentes com o léxico fonte, com o audit trail inglês e com o registro bíblico moderno em português. As notas esclarecem de forma suficiente tanto a elipse de ἀφθάρτῳ quanto a nuance de ἡσύχιος e a amplitude semântica de ἄνθρωπος.
