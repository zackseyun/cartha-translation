id: 1PE.3.4
reference: 1 Peter 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: pt
  text: mas a pessoa escondida no coração[a], na beleza imperecível[b] de um espírito manso e sereno[c]. Isso é muito precioso diante de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa oculta do coração”. O grego ἄνθρωπος pode significar “homem” ou, de modo mais geral, “pessoa”; aqui se refere ao eu interior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no imperecível de um espírito manso e sereno”. A palavra “beleza” foi suprida em razão do contraste com o adorno exterior no versículo anterior.
    reason: lexical_alternative
  - marker: c
    text: “Sereno” indica uma disposição calma e pacífica, não necessariamente silêncio.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: a pessoa escondida no coração
  rationale: Ἄνθρωπος designa aqui a pessoa, ou o eu interior, e não especificamente um homem. “Escondida no coração” conserva a imagem grega e soa clara em português atual.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: na beleza imperecível
  rationale: A expressão grega é elíptica, sem substantivo expresso. “Beleza” é suprido a partir do contraste com o adorno exterior no versículo anterior; “imperecível” traduz diretamente ἄφθαρτος.
- source_word: πραέως
  choice: manso
  rationale: “Manso” expressa uma atitude gentil e não agressiva, preservando o valor ético de πραΰς sem reduzi-lo a mera delicadeza social.
- source_word: ἡσυχίου
  choice: sereno
  rationale: “Sereno” comunica uma disposição calma e pacífica. Evita que “quieto” seja entendido apenas como ausência de fala.
- source_word: πνεύματος
  choice: espírito
  rationale: “Espírito” mantém a linguagem antropológica do texto; “disposição” seria mais explicativo, porém menos formalmente correspondente.
- source_word: ὅ ἐστιν
  choice: Isso é
  rationale: O pronome neutro retoma naturalmente a qualidade interior descrita na oração anterior. “Isso é” preserva a referência sem forçar concordância com um único substantivo português.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Equivalente direto e idiomático que expressa a avaliação divina.
- source_word: πολυτελές
  choice: muito precioso
  rationale: Πολυτελής indica algo de grande valor ou muito precioso; a formulação também sustenta o contraste contextual com adornos exteriores valiosos.
theological_decisions:
- issue: Expressão antropológica em contexto dirigido às mulheres
  choice: Traduzir ἄνθρωπος por “pessoa” em vez de “homem”.
  alternative: “o homem escondido do coração” ou “o homem interior”
  rationale: A palavra se refere ao eu interior, não ao sexo masculino. “Pessoa” evita introduzir uma especificidade masculina ausente do sentido contextual.
- issue: Substantivo implícito em ἐν τῷ ἀφθάρτῳ
  choice: 'Suprir “beleza”: “na beleza imperecível”.'
  alternative: “na qualidade imperecível” ou “no que é imperecível”
  rationale: O grego é deliberadamente compacto. O contraste com o adorno exterior no versículo 3 favorece “beleza”, mas a nota registra que o substantivo não está expresso no original.
- issue: Sentido de ἡσύχιος
  choice: Usar “sereno” para indicar uma disposição calma e pacífica.
  alternative: “quieto”
  rationale: O texto elogia uma qualidade interior, não impõe necessariamente silêncio verbal. “Sereno” comunica essa nuance sem resolver a expressão como passividade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pessoa escondida no coração” conserva a imagem incomum do original, enquanto “beleza” torna explícita a elipse exigida pelo contexto. “Manso e sereno” mantém o tom ético sem sugerir fraqueza nem silêncio obrigatório.
