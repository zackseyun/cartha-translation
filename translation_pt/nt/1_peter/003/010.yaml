  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: pt
  text: Pois quem quer amar a vida e ver dias bons refreie a língua, para que não fale o mal, e os lábios, para que não profiram engano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ardil” ou “traição”. O termo grego pode indicar engano, ardil ou traição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: quem quer
  rationale: Expressa de modo natural em português o particípio substantivado de sentido genérico, sem especificar gênero e sem perder a referência a qualquer pessoa.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a fundamentação bíblica da exortação anterior e preserva claramente o valor explicativo da conjunção.
- source_word: ζωὴν ἀγαπᾶν
  choice: amar a vida
  rationale: Reproduz diretamente a expressão grega, sem acrescentar um possessivo ausente no texto.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: ver dias bons
  rationale: Mantém a imagem concreta de 'ver' e a amplitude de ἀγαθός, sem restringir o sentido à prosperidade material.
- source_word: παυσάτω
  choice: refreie
  rationale: O imperativo exige que a pessoa faça cessar ou mantenha afastado o uso mau da fala; 'refreie' comunica essa injunção com naturalidade e preserva a imagem corporal.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: a língua do mal
  rationale: Mantém o substantivo concreto e a formulação ampla do grego. Em português, o artigo definido com partes do corpo é idiomático e dispensa possessivo.
- source_word: χείλη
  choice: os lábios
  rationale: Preserva a imagem concreta e o plural do original; o artigo definido é natural em português neste contexto.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: de falar engano
  rationale: Representa o infinitivo de prevenção ou afastamento ligado ao imperativo. 'Engano' é atual e compreensível, ao passo que 'dolo' pode ressaltar mais explicitamente a intenção ardilosa.
theological_decisions:
- issue: Singular genérico e representação de gênero
  choice: Usar 'quem quer' e artigos definidos em 'a língua' e 'os lábios'.
  alternative: 'Usar ''aquele que quer'' com possessivos: ''sua língua'' e ''seus lábios''.'
  rationale: A construção grega é singular e genérica. 'Quem quer' comunica essa universalidade sem introduzir referência especificamente masculina; o uso português do artigo com partes do corpo mantém a coerência sem precisar explicitar gênero.
- issue: Força do imperativo παυσάτω
  choice: Traduzir por 'refreie'.
  alternative: Traduzir por 'faça cessar' ou 'afaste'.
  rationale: O texto apresenta uma exortação moral, não uma promessa automática nem simples descrição. O subjuntivo de valor imperativo em português conserva essa força.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo poético entre 'língua' e 'lábios' e conserva a ligação explicativa introduzida por 'Pois'.
