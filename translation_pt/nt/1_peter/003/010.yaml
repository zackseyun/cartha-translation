  naturalness: «Refreie a língua do mal e os lábios de falar engano» soa pouco natural no português contemporâneo, sobretudo na coordenação de «refreie» com «os lábios de falar». A formulação revista mantém as imagens corporais e o paralelismo, com construção mais clara e fluente.
  terminology: «Engano» é uma boa opção atual para δόλος. A nota deve oferecer alternativas que funcionem naturalmente em português e não apresentar «dolo» como única nuance, pois esse termo pode ter associação jurídica e «falar com dolo» altera a construção nominal grega para uma expressão de modo.
