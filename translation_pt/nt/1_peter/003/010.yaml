- from: Pois quem quer amar a vida e ver dias bons refreie a língua do mal e os lábios de falar engano.[a]
  to: Pois quem quer amar a vida e ver dias bons refreie a língua, para que não fale o mal, e os lábios, para que não profiram engano.[a]
