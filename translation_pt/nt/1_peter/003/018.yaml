id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: pt
  text: Pois também o Messias sofreu uma vez pelos pecados[a], o justo pelos injustos, para conduzir vocês a Deus[b], tendo sido morto na carne, mas vivificado no espírito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “morreu” em vez de “sofreu”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “vivificado pelo Espírito”. O grego pode se referir tanto à esfera ou ao aspecto do espírito quanto à ação do Espírito Santo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: o Messias
  rationale: Preserva o sentido titular e messiânico de Χριστός, em conformidade com a orientação do projeto, em vez de tratá-lo apenas como nome próprio.
- source_word: ἅπαξ
  choice: uma vez
  rationale: Expressa diretamente o valor do advérbio sem acrescentar a ênfase interpretativa de “de uma vez por todas”.
- source_word: περὶ ἁμαρτιῶν
  choice: pelos pecados
  rationale: Em contexto redentor e sacrificial, περί com genitivo pode indicar aquilo em relação ao qual o sofrimento ocorre; “pelos pecados” é natural e conciso.
- source_word: ἔπαθεν
  choice: sofreu
  rationale: Traduz a leitura adotada pelo SBLGNT; a variante “morreu” é registrada em nota.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: o justo pelos injustos
  rationale: Mantém o contraste substantivado e o valor representativo ou substitutivo de ὑπέρ sem desenvolver uma teoria específica da expiação.
- source_word: προσαγάγῃ
  choice: conduzir
  rationale: O verbo comunica levar alguém à presença de outra pessoa ou dar-lhe acesso; “conduzir vocês a Deus” é claro e preserva essa dimensão.
- source_word: θανατωθεὶς
  choice: tendo sido morto
  rationale: Preserva a voz passiva e a relação participial, com formulação idiomática em português.
- source_word: σαρκὶ
  choice: na carne
  rationale: Mantém o termo concreto e o paralelismo com πνεύματι, sem reinterpretá-lo como “natureza pecaminosa”.
- source_word: ζῳοποιηθεὶς
  choice: vivificado
  rationale: Traduz com precisão o passivo “feito vivo” e mantém uma formulação digna e reconhecível em português bíblico moderno.
- source_word: πνεύματι
  choice: no espírito
  rationale: Preserva no texto principal a possibilidade de referência à esfera ou aspecto espiritual, sem excluir a leitura instrumental “pelo Espírito”, indicada em nota.
theological_decisions:
- issue: Sentido do contraste entre carne e espírito na oração final
  choice: “na carne, mas vivificado no espírito”
  alternative: “no corpo, mas vivificado pelo Espírito”
  rationale: Os dativos gregos são compactos e permitem mais de uma análise. A tradução principal conserva o paralelismo e a ambiguidade, enquanto a nota registra explicitamente a leitura que entende o Espírito Santo como agente.
- issue: Força de “o justo pelos injustos”
  choice: Manter a formulação representativa/substitutiva sem expansão
  alternative: “o inocente no lugar dos culpados”
  rationale: O texto apresenta o sofrimento do Messias em benefício dos injustos, mas não exige que a tradução incorpore uma formulação doutrinária mais desenvolvida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμᾶς. A redação mantém a concisão do grego e evita resolver suas ambiguidades teológicas legítimas.
