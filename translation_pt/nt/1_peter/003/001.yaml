id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: pt
  text: Do mesmo modo, esposas, estejam sujeitas a seus próprios maridos, para que, mesmo que alguns desobedeçam à palavra[a], sejam ganhos, sem palavra alguma, por meio da conduta de suas esposas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não obedecem à mensagem”; isto é, recusam a palavra do evangelho.
    reason: Preserva a alternativa lexical de ἀπειθοῦσιν e explicita o referente provável de «a palavra» sem substituir a formulação mais ambígua do texto principal.
lexical_decisions:
- source_word: Ὁμοίως
  choice: Do mesmo modo
  rationale: Mantém o conectivo que liga esta exortação às instruções domésticas anteriores, em português natural.
- source_word: γυναῖκες
  choice: esposas
  rationale: A referência imediata a seus próprios maridos exige aqui o sentido conjugal, e não o sentido genérico de mulheres.
- source_word: ὑποτασσόμεναι
  choice: estejam sujeitas
  rationale: Expressa a disposição relacional indicada por ὑποτάσσω sem acrescentar a ideia mais forte de obediência absoluta; também comunica naturalmente em português a força exortativa do particípio.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: a seus próprios maridos
  rationale: O contexto conjugal determina o sentido de ἀνήρ como marido, e próprios preserva a ênfase de ἰδίοις.
- source_word: ἵνα
  choice: para que
  rationale: Conserva a força de propósito ou resultado da oração grega.
- source_word: καὶ εἴ τινες
  choice: mesmo se alguns
  rationale: Reproduz a força concessiva de καὶ εἴ sem tornar a frase artificial.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: desobedecem à palavra
  rationale: Preserva tanto o valor de desobediência de ἀπειθέω quanto o idioma bíblico palavra, sem eliminar a possível dimensão de incredulidade.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: por meio da conduta de suas esposas
  rationale: ἀναστροφή designa a maneira de viver ou conduta; suas esposas explicita naturalmente a relação conjugal indicada pelo contexto.
- source_word: ἄνευ λόγου
  choice: sem palavra alguma
  rationale: Preserva o contraste retórico com à palavra e indica ausência de argumentação ou fala por parte das esposas.
- source_word: κερδηθήσονται
  choice: sejam ganhos
  rationale: Mantém a metáfora de κερδαίνω e a voz passiva, sem explicitar além do texto o resultado preciso de serem ganhos.
theological_decisions:
- issue: Sentido de ὑποτασσόμεναι na instrução doméstica
  choice: estejam sujeitas
  alternative: submetam-se; obedeçam
  rationale: A formulação conserva a ordem relacional expressa pelo verbo, mas não introduz inferioridade essencial nem a noção mais forte de obediência absoluta, que o versículo não afirma.
- issue: Relação entre incredulidade e desobediência em ἀπειθοῦσιν τῷ λόγῳ
  choice: desobedecem à palavra
  alternative: não creem na mensagem; recusam-se a obedecer ao evangelho
  rationale: O verbo pode abranger incredulidade e desobediência. O texto principal mantém a tensão lexical, enquanto a nota esclarece a referência provável à mensagem do evangelho.
- issue: Sentido evangelístico de κερδηθήσονται
  choice: sejam ganhos
  alternative: sejam conquistados; sejam levados à fé
  rationale: A metáfora é preservada sem definir explicitamente como conversão aquilo que o contexto sugere, mas que o verbo isoladamente não soletra.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “palavra” é intencional, pois reproduz o contraste entre τῷ λόγῳ e ἄνευ λόγου. O marcador [a] foi colocado junto à expressão que a nota efetivamente esclarece.
