  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: pt
  text: Pois era assim que, antigamente, também se adornavam as mulheres santas que esperavam em Deus[a], sujeitando-se a seus próprios maridos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que punham sua esperança em Deus”.'
