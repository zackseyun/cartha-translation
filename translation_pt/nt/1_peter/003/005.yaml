lexical_decisions:
- source_word: οὕτως
  choice: assim
  rationale: Retoma a maneira de proceder descrita no contexto anterior e preserva de modo natural a força demonstrativa do advérbio.
- source_word: γάρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação precedente.
- source_word: ποτε
  choice: antigamente
  rationale: Indica uma época anterior e comunica com clareza a referência às mulheres de gerações passadas.
- source_word: ἅγιαι γυναῖκες
  choice: as mulheres santas
  rationale: Mantém o adjetivo atributivo e o sentido usual de ἅγιος, sem enfraquecê-lo para apenas 'piedosas'.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: que esperavam em Deus
  rationale: Reproduz o particípio atributivo como característica dessas mulheres e mantém Deus como aquele em quem depositavam a esperança.
- source_word: ἐκόσμουν ἑαυτάς
  choice: se adornavam
  rationale: Preserva o vínculo lexical com o tema do adorno nos versículos anteriores e expressa naturalmente a ação reflexiva.
- source_word: ὑποτασσόμεναι
  choice: sujeitando-se
  rationale: Mantém a forma participial e apresenta a sujeição como a maneira relacionada ao modo como elas se adornavam.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: a seus próprios maridos
  rationale: No contexto doméstico, ἀνήρ significa 'marido'; 'próprios' preserva ἰδίοις e limita explicitamente a relação mencionada ao casamento.
theological_decisions:
- issue: A sujeição no âmbito matrimonial
  choice: sujeitando-se a seus próprios maridos
  alternative: sendo submissas a seus maridos
  rationale: A tradução conserva a construção participial e a limitação relacional expressa por 'próprios', sem ampliar a declaração para uma sujeição de todas as mulheres a todos os homens.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural em português sem perder as relações sintáticas do grego; 'mulheres santas' e 'se adornavam' preservam a conexão lexical e temática do texto.
