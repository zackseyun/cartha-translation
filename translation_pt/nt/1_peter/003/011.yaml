  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: pt
  text: Afaste-se do mal e faça o bem[a]; busque a paz e empenhe-se por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se afaste do mal e faça o bem; que busque a paz e se empenhe por ela”. O grego usa formas no singular com sentido representativo.'
    reason: alternativa gramatical e esclarecimento da força genérica
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: Afaste-se
  rationale: O imperativo aoristo ativo na terceira pessoa pede uma ação resoluta; “afastar-se” preserva a ideia direcional de desviar-se do mal e soa natural em português.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui δέ dá continuidade com leve contraste. Em português, no fluxo da citação iniciada no versículo anterior, uma conjunção como “mas” poderia soar artificial; a relação é preservada pela sequência exortativa.
- source_word: ἀπὸ κακοῦ
  choice: do mal
  rationale: κακόν tem sentido moral neste contraste com ἀγαθόν; “do mal” é conciso, natural e tradicional sem perder amplitude.
- source_word: ποιησάτω ἀγαθόν
  choice: faça o bem
  rationale: Expressão ética idiomática que mantém o caráter ativo do grego e o contraste direto entre mal e bem.
- source_word: ζητησάτω
  choice: busque
  rationale: “Buscar” distingue ζητέω do verbo mais intenso διώκω que vem em seguida, preservando a progressão retórica.
- source_word: εἰρήνην
  choice: a paz
  rationale: “Paz” conserva a amplitude bíblica de εἰρήνη sem restringi-la apenas a reconciliação ou bem-estar.
- source_word: διωξάτω αὐτήν
  choice: vá atrás dela
  rationale: A expressão comunica a busca ativa e persistente de διώκω, enquanto “dela” retoma claramente “a paz”; evita a possível rigidez de “persiga-a” no português corrente.
- source_word: imperativos na terceira pessoa do singular
  choice: imperativos com pronome reflexivo e sujeito genérico implícito
  rationale: “Afaste-se”, “faça” e “busque” mantêm o singular da citação. Em português, essas formas podem ter força representativa genérica sem exigir o masculino “ele”.
theological_decisions:
- issue: Força representativa do masculino singular na citação
  choice: Manter formas verbais no singular com sujeito genérico implícito
  alternative: “Que ele se afaste...”; “A pessoa deve se afastar...”
  rationale: O grego emprega imperativos na terceira pessoa do singular com força representativa. As formas portuguesas escolhidas preservam o singular e abrangem naturalmente qualquer pessoa, sem acrescentar ao texto um pronome masculino explícito.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação mantém o paralelismo da exortação e a progressão entre buscar a paz e ir ativamente atrás dela.
