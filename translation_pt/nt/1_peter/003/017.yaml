source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: pt
  text: Pois é melhor sofrer fazendo o bem[a], se a vontade de Deus assim o quiser[b], do que fazendo o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sofrer por fazer o bem [...] do que por fazer o mal”. Os particípios podem indicar causa (“por fazer”) ou, de modo mais geral, a circunstância (“fazendo”).'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, o grego diz: “se a vontade de Deus o quiser”, uma expressão enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: é melhor
  rationale: O comparativo predicativo impessoal é expresso de modo direto e natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a conexão explicativa com a exortação anterior.
- source_word: ἀγαθοποιοῦντας
  choice: fazendo o bem
  rationale: Preserva o valor circunstancial do particípio presente sem impor necessariamente uma relação causal.
- source_word: εἰ θέλοι
  choice: se assim quiser
  rationale: O imperfeito do subjuntivo em português exprime adequadamente a condição eventual ou potencial marcada pelo optativo grego.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: a vontade de Deus
  rationale: Reproduz de forma clara e solene a construção genitiva.
- source_word: πάσχειν
  choice: sofrer
  rationale: Equivalente direto e idiomático do infinitivo grego.
- source_word: ἢ
  choice: do que
  rationale: Forma comparativa natural depois de “é melhor”.
- source_word: κακοποιοῦντας
  choice: fazendo o mal
  rationale: Espelha o primeiro particípio e mantém o paralelismo antitético.
theological_decisions:
- issue: Relação entre o sofrimento e a vontade divina
  choice: A formulação afirma condicionalmente que sofrer fazendo o bem pode estar de acordo com a vontade de Deus, sem definir como Deus se relaciona causalmente com cada sofrimento.
  alternative: Entender que Deus determina positivamente cada sofrimento, ou que apenas o permite sem qualquer outro envolvimento.
  rationale: A expressão grega refere-se à vontade de Deus de forma condicional, mas não resolve o debate mais amplo entre decreto e permissão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semítica/helênica entre “vontade” e “quiser” foi mantida em forma natural; as notas preservam a ambiguidade dos particípios.
