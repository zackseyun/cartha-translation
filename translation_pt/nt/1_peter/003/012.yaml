id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: pt
  text: Pois os olhos do Senhor estão sobre os justos, e os seus ouvidos estão atentos à súplica deles; mas o rosto do Senhor está contra os que praticam o mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou fundamento da exortação precedente e conserva naturalmente a força causal em português.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: os olhos do Senhor estão sobre os justos
  rationale: Preserva a imagem antropomórfica e expressa a atenção favorável indicada por ἐπί com acusativo.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: os seus ouvidos atentos à súplica deles
  rationale: Supre com clareza a elipse grega, literalmente 'os seus ouvidos para a súplica deles'. 'Súplica' representa a nuance de δέησις e evita reduzir a expressão à oração em sentido genérico.
- source_word: πρόσωπον δὲ κυρίου
  choice: mas o rosto do Senhor
  rationale: Mantém a imagem concreta de πρόσωπον e traduz δέ com seu valor adversativo no paralelismo.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: está contra os que praticam o mal
  rationale: No contexto negativo, ἐπί indica oposição; a construção verbal conserva o aspecto ativo de ποιοῦντας κακά.
theological_decisions:
- issue: Linguagem antropomórfica sobre os olhos, ouvidos e rosto de Deus
  choice: Preservar diretamente as imagens
  alternative: Parafrasear como 'o Senhor cuida dos justos, escuta-os e se opõe aos maus'
  rationale: As imagens, herdadas da citação do Salmo, comunicam atenção favorável e oposição pessoal sem exigir que a tradução explique ou elimine sua tensão figurada.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A formulação mantém o paralelismo poético e as imagens do texto grego, com explicitação mínima da elipse na segunda oração.
