source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: pt
  text: Que o adorno de vocês não seja exterior — trançar os cabelos[a], usar joias de ouro ou vestir roupas —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo adorno não seja o exterior: trançar os cabelos, usar joias de ouro ou vestir roupas.” O contraste com o versículo seguinte pode indicar a prioridade do caráter interior sobre a aparência externa.'
    reason: Leitura alternativa de ὧν como «cujo» e esclarecimento contextual conciso. A nota preserva a possível leitura comparativa sem acrescentar que as roupas sejam elegantes nem converter a formulação grega em proibição absoluta.
lexical_decisions:
- source_word: ὧν
  choice: de vocês
  rationale: O pronome relativo genitivo plural retoma as mulheres ou esposas mencionadas no versículo anterior. Em português natural, a relação possessiva é expressa por “de vocês”.
- source_word: ἔστω οὐχ
  choice: não seja
  rationale: Preserva de modo natural a força exortativa do imperativo presente de εἰμί negado por οὐχ.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: o adorno ... exterior
  rationale: Neste contexto, κόσμος significa “adorno” ou “ornamentação”, não “mundo”; ἔξωθεν indica aquilo que é externo, em contraste com a pessoa interior do versículo seguinte.
- source_word: ἐμπλοκῆς τριχῶν
  choice: cabelos trançados
  rationale: Expressa em português corrente o penteado produzido pelo ato de trançar os cabelos, mantendo o primeiro item da lista de adornos externos.
- source_word: περιθέσεως χρυσίων
  choice: uso de joias de ouro
  rationale: περίθεσις designa o ato de colocar ao redor ou sobre si, e χρυσίων refere-se a objetos de ouro, provavelmente ornamentos ou joias.
- source_word: ἢ
  choice: ou
  rationale: Reproduz a disjunção simples entre os itens enumerados.
- source_word: ἐνδύσεως ἱματίων
  choice: vestes
  rationale: Condensa naturalmente em português o ato de vestir roupas, preservando o terceiro elemento da enumeração sem sugerir uma categoria específica de tecido ou luxo.
theological_decisions:
- issue: Se Pedro proíbe absolutamente os cuidados externos, as joias e as roupas, ou se subordina o adorno exterior ao caráter interior
  choice: Manter no texto a negação direta do grego e esclarecer em nota a possível força comparativa no contexto
  alternative: Inserir “meramente” ou “apenas” diretamente no texto principal
  rationale: A construção grega contém uma negação direta, mas o contraste com “a pessoa oculta do coração” no versículo seguinte favorece a prioridade do caráter interior, não uma proibição literal de toda aparência externa. Como “meramente” não está expresso no grego, a nota preserva a tensão sem impor a interpretação no texto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para leitura ampla no Brasil. O travessão conserva a enumeração explicativa e deixa a frase aberta para o contraste desenvolvido no versículo seguinte.
