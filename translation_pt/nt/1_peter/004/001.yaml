id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: pt
  text: Portanto, visto que o Messias[a] sofreu na carne, armem-se também vocês da mesma disposição, porque aquele que sofreu na carne[b] deixou de pecar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Cristo» (grego Christos). Aqui se mantém o sentido do título «Messias».
    reason: lexical_alternative
  - marker: b
    text: «Na carne» traduz literalmente o grego sarx e aqui se refere à existência humana corpórea, não necessariamente à «natureza pecaminosa».
    reason: lexical_alternative
  - marker: c
    text: A frase «aquele que sofreu na carne deixou de pecar» é discutida. Pode se referir especificamente ao Messias, aos fiéis que seguem seu padrão ou a um princípio geral segundo o qual o sofrimento marca uma ruptura decisiva com o pecado.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Mantém ativo o sentido titular de Χριστός; «Cristo» permanece como alternativa tradicional em nota.
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a inferência decorrente do contexto anterior.
- source_word: παθόντος
  choice: visto que ... sofreu
  rationale: Verte o particípio aoristo em construção causal-temporal natural, sem perder sua relação com Χριστοῦ.
- source_word: σαρκὶ
  choice: na carne
  rationale: Preserva a formulação concreta e sua repetição; aqui «carne» se refere à existência humana corpórea, não necessariamente à natureza pecaminosa.
- source_word: ἔννοιαν
  choice: disposição
  rationale: Comunica atitude mental, intenção ou resolução; combina naturalmente com a metáfora de armar-se.
- source_word: ὁπλίσασθε
  choice: armem-se
  rationale: Preserva a metáfora militar e a força reflexiva do imperativo médio.
- source_word: ὅτι
  choice: porque
  rationale: Apresenta a razão da exortação de maneira clara em português atual.
- source_word: ὁ παθὼν
  choice: aquele que sofreu
  rationale: Mantém a formulação substantivada sem definir se o referente é exclusivamente o Messias, os fiéis ou uma máxima geral.
- source_word: πέπαυται ἁμαρτίας
  choice: deixou de pecar
  rationale: Expressa em português natural o estado resultante indicado pelo perfeito e o afastamento do pecado indicado pelo genitivo, sem acrescentar uma explicação interpretativa.
theological_decisions:
- issue: Referente e alcance de «aquele que sofreu na carne deixou de pecar»
  choice: A afirmação foi mantida ampla, sem identificar explicitamente o referente.
  alternative: Entender a frase exclusivamente acerca do Messias; acerca dos fiéis que rompem com o domínio do pecado; ou como máxima geral sobre o sofrimento e a ruptura com a vida pecaminosa.
  rationale: A formulação grega é condensada e discutida. A tradução conserva a tensão teológica, e a nota apresenta as principais possibilidades sem decidir entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural «vocês» torna explícito o destinatário plural do imperativo. A metáfora militar foi preservada, assim como a repetição de «na carne».
