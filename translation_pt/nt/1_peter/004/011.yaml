id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: pt
  text: Se alguém fala, fale como quem comunica os pronunciamentos de Deus[a]; se alguém serve, sirva com a força que Deus fornece[b], para que, em tudo, Deus seja glorificado por meio de Jesus, o Messias, a quem pertencem a glória e o domínio para todo o sempre[c][d]. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como oráculos de Deus”. O termo grego λόγια designa pronunciamentos ou enunciados divinos.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “como a partir da força que Deus fornece”.'
    reason: lexical_alternative
  - marker: c
    text: “A quem” refere-se mais naturalmente a Jesus, o Messias, o antecedente mais próximo. Alguns, porém, entendem que a doxologia se refere a Deus Pai, à luz da oração anterior.
    reason: alternative_reading
  - marker: d
    text: 'Literalmente: “pelos séculos dos séculos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: fala
  rationale: Preserva o sentido amplo do presente na condição genérica, sem restringi-lo à pregação ou a um ministério formal.
- source_word: λόγια θεοῦ
  choice: declarações de Deus
  rationale: λόγια indica pronunciamentos ou oráculos divinos; “declarações” conserva o caráter solene e é mais acessível no português atual do que “oráculos”.
- source_word: διακονεῖ
  choice: serve
  rationale: Expressa serviço ou ministério em sentido amplo, sem sugerir necessariamente um cargo eclesiástico.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: com a força que Deus fornece
  rationale: Em português natural, “com a força” comunica o recurso mediante o qual se serve, enquanto a oração relativa deixa explícito que sua fonte é Deus. A alternativa mais formal, “a partir da força”, é registrada em nota.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: Mantém o alcance abrangente da expressão grega de modo conciso e corrente.
- source_word: δοξάζηται
  choice: seja glorificado
  rationale: Conserva a voz passiva e a força de propósito introduzida por ἵνα.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus, o Messias
  rationale: “Por meio de” expressa a mediação de διά com genitivo; Χριστός é apresentado como título, “o Messias”, em formulação idiomática portuguesa.
- source_word: κράτος
  choice: domínio
  rationale: No contexto de uma doxologia, denota poder soberano ou domínio, e não apenas capacidade ou força.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Equivalente idiomático e solene para a expressão grega de duração sem fim.
theological_decisions:
- issue: Referente de ᾧ na doxologia final
  choice: O texto principal liga “a quem” ao antecedente mais próximo, Jesus, o Messias.
  alternative: A doxologia pode ser entendida como dirigida a Deus Pai, mencionado como aquele que é glorificado na oração anterior; também é possível perceber uma referência condensada à glória de Deus por meio de Jesus, o Messias.
  rationale: A concordância do pronome relativo masculino singular e a proximidade de Ἰησοῦ Χριστοῦ favorecem a referência a Jesus, mas o foco imediato em Deus na oração de propósito torna legítima a outra leitura. A ambiguidade é preservada em nota.
- issue: Força de ὡς nas duas orações condicionais
  choice: Explicitar a exortação mediante “fale como quem transmite” e “sirva com”.
  alternative: 'Manter a elipse mais de perto: “Se alguém fala, como declarações de Deus; se alguém serve, como a partir da força...”'
  rationale: O grego é elíptico, mas o português requer uma estrutura verbal mais completa. A formulação escolhida comunica a força exortativa sem transformar as condições em afirmações de inspiração automática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” em nenhum ponto, preserva a formulação impessoal do original e evita linguagem eclesiástica excessivamente técnica. “Jesus, o Messias” mantém Χριστός como título; “para todo o sempre” conserva o tom doxológico natural.
