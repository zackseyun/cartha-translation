id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: pt
  text: Se vocês são insultados por causa do nome do Messias[a], são bem-aventurados, porque o Espírito da glória e de Deus[b] repousa sobre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Cristo”. “Messias” traduz o título grego Χριστός.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “o glorioso Espírito de Deus” ou “o Espírito da glória, isto é, o Espírito de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: são insultados
  rationale: O presente passivo descreve pessoas submetidas a insulto, censura ou desonra. “São insultados” é natural em português atual e conserva a dimensão de hostilidade verbal.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: por causa do nome do Messias
  rationale: Neste contexto, a expressão indica que os insultos são sofridos em razão da associação pública com o nome e a identidade do Messias. A formulação mantém “nome” e comunica naturalmente o valor causal.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Χριστός conserva aqui sua força de título, correspondente a “Messias”, e não precisa ser tratado apenas como nome próprio.
- source_word: μακάριοι
  choice: bem-aventurados
  rationale: A expressão preserva o peso teológico e o caráter de declaração divina próprios de μακάριοι, sem reduzi-lo a um estado emocional como “felizes”.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: o Espírito da glória e de Deus
  rationale: A tradução conserva os dois genitivos e evita decidir se são descrições coordenadas ou se “de Deus” esclarece “da glória”.
- source_word: ἀναπαύεται
  choice: repousa sobre
  rationale: O verbo expressa repousar ou permanecer assentado sobre alguém; a escolha também preserva a ressonância bíblica da linguagem sobre o Espírito.
theological_decisions:
- issue: Sentido titular de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste enunciado sobre sofrer por causa do nome, o título permanece semanticamente ativo. “Messias” torna essa função explícita, enquanto a nota registra a forma grega tradicionalmente vertida como “Cristo”.
- issue: Relação entre “da glória” e “de Deus”
  choice: o Espírito da glória e de Deus
  alternative: 'o glorioso Espírito de Deus; ou: o Espírito da glória, isto é, o Espírito de Deus'
  rationale: A construção grega é compacta e admite mais de uma análise. A redação principal mantém essa tensão em vez de impor uma relação adjetival ou explicativa.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. “Bem-aventurados” conserva o tom solene de uma declaração de bênção; “repousa sobre” mantém a imagem bíblica sem soar arcaico.
