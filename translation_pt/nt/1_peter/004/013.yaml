id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: pt
  text: Pelo contrário, na medida em que vocês participam dos sofrimentos do Messias[a], alegrem-se, para que, na revelação da glória dele[b], vocês também se alegrem, exultando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. O grego Χριστός é um título que significa “Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “quando a glória dele for revelada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Pelo contrário
  rationale: Expressa o contraste enfático com a orientação do versículo anterior de modo natural em português.
- source_word: καθὸ
  choice: na medida em que
  rationale: Preserva a força proporcional da expressão grega, sem reduzi-la a um simples valor temporal.
- source_word: κοινωνεῖτε
  choice: vocês participam
  rationale: Comunica participação efetiva nos sofrimentos, e não mera simpatia ou associação emocional.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: dos sofrimentos do Messias
  rationale: Reproduz de forma idiomática a relação genitiva e mantém aberta a natureza exata dessa participação.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Traduz o título grego e preserva sua dimensão messiânica, em vez de tratá-lo aqui apenas como nome próprio.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: Imperativo corrente e digno, que mantém a ligação lexical com χαρῆτε mais adiante.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a relação de finalidade ou resultado presente no grego.
- source_word: ἀποκαλύψει
  choice: revelação
  rationale: Mantém o substantivo formal do texto-fonte e indica a futura manifestação pública da glória.
- source_word: δόξης αὐτοῦ
  choice: da glória dele
  rationale: O pronome remete ao Messias; esta formulação é clara em português e evita a possível leitura de que a glória pertenceria aos leitores.
- source_word: χαρῆτε
  choice: vocês também se alegrem
  rationale: Preserva a repetição deliberada da raiz de alegria e a ligação entre a alegria presente e a futura.
- source_word: ἀγαλλιώμενοι
  choice: exultando
  rationale: Conserva a forma participial e intensifica a alegria sem acrescentar conteúdo ausente do original.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, o termo conserva seu valor titular. A escolha traduz o título e mantém o horizonte messiânico judaico do texto.
- issue: Natureza da participação nos sofrimentos do Messias
  choice: participam dos sofrimentos do Messias
  alternative: sofrem pelo Messias
  rationale: A formulação conserva a participação indicada por κοινωνεῖτε sem defini-la como repetição da obra expiatória nem restringi-la explicitamente a sofrimento causado por testemunho cristão.
- issue: Relação entre alegria presente e futura
  choice: alegrem-se... para que... também se alegrem
  alternative: continuem alegres até a revelação
  rationale: Preserva a construção de finalidade ou resultado com ἵνα e a tensão entre o imperativo presente e a alegria futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A repetição de “alegrem-se” é intencional e reflete a repetição lexical do grego. “Exultando” mantém a intensificação final sem recorrer a uma paráfrase excessiva.
source_grounding:
  english_pob_role: consult_only
