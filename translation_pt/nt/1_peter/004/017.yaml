id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: pt
  text: Pois é tempo de o julgamento começar pela casa de Deus[a]; e, se começa primeiro por nós, qual será o fim[b] dos que desobedecem[c] ao evangelho de Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «família de Deus». A palavra grega pode significar tanto «casa» como «família»; aqui, «por nós» indica que se refere ao povo de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou «desfecho» ou «resultado».
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida como «os que se recusam a crer», pois o verbo grego pode abranger tanto desobediência como incredulidade diante do evangelho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ligada ao contexto anterior; «pois» é causal, conciso e natural em português.
- source_word: ὁ καιρός
  choice: chegou o tempo
  rationale: καιρός indica o tempo oportuno ou determinado. A formulação idiomática «chegou o tempo» comunica que esse momento está presente, sem precisar explicitar «determinado».
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: de o julgamento começar
  rationale: Preserva a construção que apresenta o início do julgamento como conteúdo desse tempo, em português claro e digno.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: pela família de Deus
  rationale: οἶκος pode designar casa ou família. Aqui «por nós» identifica o referente como o povo de Deus; «pela» expressa naturalmente o ponto inicial, embora a nota preserve a imagem mais formal de «casa».
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: e, se começa primeiro por nós
  rationale: O verbo «começa» é retomado da oração anterior para clareza. «Por nós» mantém a ideia de ponto inicial expressa pela repetição de ἀπό.
- source_word: τέλος
  choice: fim
  rationale: «Fim» é a correspondência direta e natural, mantendo aberta a possibilidade semântica de desfecho ou resultado, esclarecida em nota.
- source_word: ἀπειθούντων
  choice: dos que desobedecem
  rationale: O particípio expressa uma resposta de desobediência ao evangelho e pode incluir recusa em crer; a tradução conserva a força verbal sem reduzir a ideia apenas à incredulidade.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: ao evangelho de Deus
  rationale: O dativo acompanha ἀπειθέω, e o genitivo pode indicar pertença ou origem. «Evangelho de Deus» preserva essa abertura e a solenidade da expressão.
theological_decisions:
- issue: Natureza de κρίμα em relação ao povo de Deus
  choice: julgamento
  alternative: condenação; disciplina
  rationale: «Julgamento» mantém a seriedade judicial sem afirmar que o povo de Deus é condenado nem reduzir o processo a mera disciplina. Assim se conserva a tensão do contraste com o fim dos que desobedecem ao evangelho.
- issue: Referente de οἶκος τοῦ θεοῦ
  choice: família de Deus
  alternative: casa de Deus; templo de Deus
  rationale: O segmento seguinte, «por nós», aponta para uma comunidade de pessoas, em harmonia com a imagem corporativa de 1Pedro. A nota conserva a metáfora literal possível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém tom solene sem arcaísmos. «Família de Deus» torna claro o referente comunitário; as notas preservam as alternativas lexicais e a ambiguidade genuína.
