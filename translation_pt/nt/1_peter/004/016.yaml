source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: pt
  text: Mas, se alguém sofre como cristão, não se envergonhe; pelo contrário, glorifique a Deus nesse nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nessa condição» ou «por esse nome». O grego diz mais literalmente «nesse nome», provavelmente referindo-se ao nome «cristão».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: Mas, se alguém sofre como cristão
  rationale: O verbo «sofrer» está elíptico no grego, mas é claramente retomado do contexto imediato (v. 15). Explicitá-lo produz uma condição completa e natural em português. «Cristão» é a designação lexicalizada correspondente a Χριστιανός.
- source_word: μὴ αἰσχυνέσθω
  choice: não se envergonhe
  rationale: Preserva de modo natural a força exortativa do imperativo presente médio na terceira pessoa.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: pelo contrário, glorifique a Deus
  rationale: «Pelo contrário» expressa nitidamente o contraste entre envergonhar-se e glorificar; «glorifique» mantém o sentido usual de δοξάζω quando Deus é o objeto.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: por esse nome
  rationale: Em português, «por esse nome» liga naturalmente a glorificação de Deus à designação «cristão», preservando ὄνομα e permitindo a nuance causal de ἐν sem a formulação pouco idiomática «nesse nome».
theological_decisions:
- issue: Referência e sentido de ἐν τῷ ὀνόματι τούτῳ
  choice: 'A expressão aponta para o nome ou designação «cristão»: a pessoa glorifica a Deus por levar esse nome.'
  alternative: «Nesse assunto» ou «nessa condição», isto é, na experiência de sofrer como cristão.
  rationale: Χριστιανός é o antecedente imediato, e ὄνομα denota naturalmente um nome ou uma designação. A nota preserva a possibilidade de um sentido mais circunstancial sem apagá-la.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção impessoal «se alguém» evita o masculino genérico isolado e explicita a elipse contextual de «sofrer».
