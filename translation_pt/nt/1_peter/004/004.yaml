  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: pt
  text: Nisso, eles estranham[a] que vocês não corram com eles para a mesma torrente de devassidão[b], difamando vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficam surpresos” ou “acham estranho”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para o mesmo derramamento de devassidão” ou “para o mesmo transbordamento de devassidão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “falam mal de vocês” ou “insultam vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Por isso
  rationale: A expressão retoma a mudança de conduta descrita anteriormente. Em português, “Por isso” explicita de modo natural a ligação contextual, embora “Nisso” seja uma alternativa mais formalmente próxima.
- source_word: ξενίζονται
  choice: eles estranham
  rationale: O verbo indica considerar algo estranho ou reagir com surpresa. “Estranham” preserva os dois matizes com concisão e naturalidade.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: que vocês não corram com eles
  rationale: A oração absoluta é vertida como oração integrante idiomática. “Corram com eles” conserva a metáfora de συντρέχω e a ideia de participação coletiva.
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: para a mesma enxurrada de devassidão
  rationale: “Enxurrada” mantém a imagem de derramamento ou transbordamento de ἀνάχυσις, enquanto “devassidão” expressa a vida moralmente desenfreada de ἀσωτία.
- source_word: βλασφημοῦντες
  choice: e os insultam
  rationale: Neste contexto, o particípio descreve fala hostil dirigida aos cristãos. “Insultam” é claro e evita o sentido mais restrito que “blasfemar” costuma ter em português. O pronome “os” explicita o alvo implícito.
theological_decisions:
- issue: Alvo e natureza de βλασφημοῦντες
  choice: 'fala abusiva dirigida aos cristãos: “e os insultam”'
  alternative: “blasfemando” ou “falando mal de vocês”
  rationale: O contexto imediato é a reação hostil dos antigos companheiros à nova conduta dos cristãos. Traduzir por “blasfemam” poderia sugerir indevidamente que o objeto direto é Deus; “insultam” preserva a hostilidade interpessoal sem excluir difamação verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A imagem de movimento e transbordamento do grego foi preservada sem tornar a frase excessivamente literal.
