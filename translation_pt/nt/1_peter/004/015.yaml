  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: pt
  text: Pois nenhum de vocês sofra como assassino, ladrão, malfeitor ou como alguém que se intromete na vida alheia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “intrometido”; mais literalmente, “quem supervisiona assuntos alheios”, isto é, quem interfere no que não lhe diz respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν ... πασχέτω
  choice: Pois nenhum de vocês sofra
  rationale: A construção com μὴ e o imperativo presente expressa proibição; γάρ mantém a ligação explicativa com o contexto. “Nenhum de vocês sofra” é natural em português e preserva a referência individual dentro da comunidade.
- source_word: ὡς φονεὺς
  choice: como assassino
  rationale: φονεύς designa especificamente quem comete homicídio doloso; “assassino” é mais preciso que o termo geral “matador”.
- source_word: κλέπτης
  choice: ladrão
  rationale: É o equivalente corrente e direto para aquele que furta ou rouba, sem impor uma distinção jurídica ausente do termo grego.
- source_word: κακοποιός
  choice: malfeitor
  rationale: Preserva o sentido amplo de quem pratica o mal e o tom de uma lista de condutas condenáveis, sem restringi-lo à categoria jurídica de “criminoso”.
- source_word: ἀλλοτριεπίσκοπος
  choice: alguém que se intromete na vida alheia
  rationale: O composto raro sugere alguém que indevidamente cuida ou supervisiona assuntos de outros. A formulação comunica em português atual a interferência intrusiva sem introduzir conotação de ofício eclesiástico.
theological_decisions:
- issue: Sentido do raro termo ἀλλοτριεπίσκοπος
  choice: alguém que se intromete na vida alheia
  alternative: intrometido; quem se ocupa dos assuntos alheios
  rationale: No contexto de comportamentos culpáveis, o termo provavelmente descreve interferência indevida nos assuntos de outras pessoas. Como sua extensão exata é discutida, a nota registra alternativas e a formação mais literal, sem associá-lo ao cargo de supervisor ou bispo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi tornada natural em português, sem repetir todos os artigos, e a nota conserva a dificuldade lexical do termo final.
