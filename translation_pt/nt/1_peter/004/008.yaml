source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: pt
  text: Acima de tudo, mantenham intenso o amor uns pelos outros, porque o amor cobre uma multidão de pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação remete a Provérbios 10:12. Aqui, “cobre” também pode ter o sentido de não expor ou não fomentar as ofensas.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Acima de tudo
  rationale: Expressa prioridade ou importância suprema de modo idiomático, sem sugerir apenas sequência temporal.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: o amor de uns pelos outros
  rationale: A construção reflexiva tem sentido recíproco no contexto comunitário; esta formulação comunica com clareza o amor mútuo.
- source_word: ἐκτενῆ
  choice: intenso
  rationale: Preserva a ideia de um amor estendido, dedicado e persistente, em linguagem atual e natural.
- source_word: ἔχοντες
  choice: mantenham
  rationale: O particípio presente dá continuidade às exortações do contexto. A forma finita transmite naturalmente em português seu valor exortativo e seu aspecto contínuo.
- source_word: ὅτι
  choice: porque
  rationale: Torna explícita a relação causal entre a exortação e a máxima que a fundamenta.
- source_word: καλύπτει
  choice: cobre
  rationale: Mantém a metáfora do verbo grego e a alusão proverbial, sem decidir se o sentido específico é perdoar, não expor ou não fomentar ofensas.
- source_word: πλῆθος ἁμαρτιῶν
  choice: uma multidão de pecados
  rationale: Conserva o substantivo coletivo e a força retórica da expressão grega.
theological_decisions:
- issue: Sentido de “o amor cobre uma multidão de pecados”
  choice: Conservar a metáfora “cobre” sem identificar de quem são os pecados nem definir o mecanismo dessa cobertura.
  alternative: “o amor releva muitas ofensas” ou “o amor traz perdão para muitos pecados”
  rationale: A formulação é proverbial e alusiva, e o grego não impõe uma única interpretação. Manter a metáfora preserva a tensão teológica e evita introduzir uma leitura meritória, sacramental ou meramente psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mantenham intenso o amor” preserva tanto a continuidade da ação quanto a força exortativa do contexto.
