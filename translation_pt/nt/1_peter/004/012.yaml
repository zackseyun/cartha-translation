id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: pt
  text: Amados, não estranhem a provação de fogo que está ocorrendo entre vocês para pô-los à prova, como se algo estranho estivesse acontecendo com vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva de modo natural a ligação lexical com o amor e o tom pastoral.
- source_word: μὴ ξενίζεσθε
  choice: não estranhem
  rationale: Expressa tanto a ideia de considerar algo estranho quanto a de surpreender-se, e mantém a ligação verbal com ξένου na oração final.
- source_word: τῇ ... πυρώσει
  choice: a provação de fogo
  rationale: Preserva a imagem concreta de ardor ou fogo e, no contexto, comunica uma experiência severa que prova os destinatários.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: A leitura corporativa se ajusta ao destinatário plural e ao sofrimento presente na comunidade, sem excluir a experiência individual.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: para pô-los à prova
  rationale: Neste contexto de sofrimento, πειρασμός indica prova ou teste, não prioritariamente incitação ao pecado; a formulação verbal é clara em português.
- source_word: γινομένῃ
  choice: que está ocorrendo
  rationale: Reproduz o aspecto presente do particípio e sua relação com a provação de fogo.
- source_word: ὡς ξένου
  choice: como se algo estranho
  rationale: Preserva a repetição conceitual com ξενίζεσθε e soa natural em português.
- source_word: συμβαίνοντος
  choice: estivesse acontecendo
  rationale: Comunica idiomaticamente um evento que sobrevém aos destinatários e se harmoniza com a construção comparativa.
theological_decisions:
- issue: Sentido de πειρασμός no contexto
  choice: prova/teste
  alternative: tentação
  rationale: O contexto imediato trata do sofrimento que põe a fé à prova, e não de sedução interior ao pecado. Ainda assim, a tradução evita explicar quem aplica a prova ou qual é exatamente seu mecanismo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A repetição entre “estranhem” e “estranho” foi mantida para refletir o jogo lexical grego. “Provação de fogo” conserva a metáfora sem acrescentar explicitamente a noção de refino, que o texto não formula.
