  source_fidelity: 'A tradução representa adequadamente todos os elementos centrais do grego: a saudação afetiva «Amados»; a exortação a não considerar a situação estranha; a imagem da πυρώσει como «provação de fogo»; o sentido corporativo possível de ἐν ὑμῖν em «entre vocês»; a finalidade de teste em «para pô-los à prova»; e a repetição expressiva entre «estranhem» e «estranho». O aspecto em curso de γινομένῃ também é bem expresso por «está ocorrendo».'
