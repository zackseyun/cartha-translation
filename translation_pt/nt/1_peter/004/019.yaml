id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: pt
  text: Portanto, também os que sofrem de acordo com a vontade de Deus confiem sua vida[a] ao fiel Criador, praticando o bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua alma” ou “a si mesmos”; a palavra grega pode se referir à alma, à vida ou à própria pessoa.
    reason: alternativa lexical
lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz uma conclusão inferida do argumento anterior e conserva com naturalidade a força lógica do grego.
- source_word: οἱ πάσχοντες
  choice: os que sofrem
  rationale: Traduz de modo idiomático o particípio presente substantivado, que designa as pessoas caracterizadas pelo sofrimento.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: de acordo com a vontade de Deus
  rationale: Preserva a ideia de conformidade expressa por κατά sem definir se a relação envolve permissão, determinação ou outro aspecto da vontade divina.
- source_word: πιστῷ κτίστῃ
  choice: ao fiel Criador
  rationale: “Fiel” comunica a confiabilidade de πιστός, e o artigo definido é natural em português para a referência inequívoca a Deus, sem transformar a ausência do artigo grego em indefinição.
- source_word: παρατιθέσθωσαν
  choice: confiem
  rationale: O imperativo médio descreve colocar algo sob os cuidados seguros de outra pessoa; “confiem” é claro, atual e adequado ao contexto.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: sua vida
  rationale: Neste contexto de sofrimento e entrega aos cuidados de Deus, ψυχή pode designar a vida ou a própria pessoa. “Sua vida” é natural em português, e a nota conserva as demais possibilidades lexicais.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: praticando o bem
  rationale: Expressa de modo natural a maneira ou circunstância concomitante em que a pessoa se confia ao Criador.
theological_decisions:
- issue: Relação entre o sofrimento e a vontade de Deus
  choice: de acordo com a vontade de Deus
  alternative: pela vontade de Deus
  rationale: A formulação mantém a relação afirmada pelo texto, mas não resolve se ela indica permissão, determinação ou aprovação divina.
- issue: Sentido de ψυχή no contexto
  choice: sua vida
  alternative: sua alma; a si mesmos
  rationale: “Vida” comunica naturalmente o ser entregue aos cuidados de Deus neste contexto, enquanto a nota registra a amplitude semântica do termo e evita excluir as leituras “alma” e “a si mesmos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ao fiel Criador” evita a possível impressão politeísta de “a um Criador fiel”; “praticando o bem” mantém a ação ética associada ao ato de confiar-se a Deus.
