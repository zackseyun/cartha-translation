source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: pt
  text: E, se o justo é salvo com dificuldade[a], onde aparecerá o ímpio e pecador?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mal é salvo” ou “é salvo a duras penas”. A expressão ressalta a dificuldade e as severas provações pelas quais o justo passa, sem necessariamente indicar que sua salvação final seja incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “onde será encontrado o ímpio e pecador?”'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: o justo
  rationale: Adjetivo substantivado, singular masculino, com sentido representativo. “O justo” preserva a forma proverbial e é natural no registro bíblico contemporâneo.
- source_word: μόλις
  choice: com dificuldade
  rationale: Expressa dificuldade ou estreiteza. Esta formulação é clara em português e preserva a tensão do texto sem sugerir por si só que o resultado da salvação seja incerto.
- source_word: σῴζεται
  choice: é salvo
  rationale: Preserva o presente passivo e a formulação proverbial de modo idiomático. “Está sendo salvo” destacaria o processo, mas seria menos natural neste contexto.
- source_word: ἀσεβής
  choice: ímpio
  rationale: Mantém o sentido moral e religioso de quem não demonstra reverência para com Deus.
- source_word: ἁμαρτωλός
  choice: pecador
  rationale: Equivalente corrente e preciso, mantido distinto de “ímpio” para conservar os dois qualificativos gregos.
- source_word: ποῦ
  choice: onde
  rationale: Tradução direta que conserva a força da pergunta retórica.
- source_word: φανεῖται
  choice: aparecerá
  rationale: Reproduz diretamente o futuro singular de φαίνω e preserva a formulação alusiva e retórica; “será encontrado” é uma alternativa interpretativa possível.
theological_decisions:
- issue: Sentido de μόλις σῴζεται
  choice: A salvação do justo ocorre com dificuldade, no contexto de provação, sofrimento e juízo.
  alternative: O justo mal consegue ser salvo, com resultado final incerto.
  rationale: O contexto imediato trata do sofrimento dos fiéis e do juízo que começa pela casa de Deus. A tradução mantém a tensão lexical sem introduzir uma afirmação sobre insegurança da salvação final.
- issue: Singular representativo e construção ὁ ἀσεβὴς καὶ ἁμαρτωλός
  choice: 'Manter o singular: “o ímpio e pecador”.'
  alternative: “os ímpios e pecadores” ou “o ímpio e o pecador”.
  rationale: O grego emprega um único artigo antes de dois qualificativos coordenados e o verbo no singular, favorecendo a descrição representativa de uma pessoa como ímpia e pecadora. A redação preserva esses dados sem expandi-los para o plural.
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial concisa. “Com dificuldade” é mais transparente internacionalmente do que o possível, mas ambíguo, “mal”. O singular foi preservado para acompanhar a construção e o verbo gregos.
