id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: pt
  text: para já não viver o tempo que lhe resta na carne[a] segundo os desejos humanos, mas segundo a vontade de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no corpo”. Aqui, a expressão grega “na carne” se refere à vida terrena e corporal, não necessariamente à “natureza pecaminosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: para
  rationale: A preposição com o infinitivo articular expressa propósito ou resultado em ligação com o versículo anterior; “para” preserva essa relação com naturalidade em português.
- source_word: μηκέτι
  choice: já não
  rationale: Expressa a cessação de um modo de vida anterior e soa natural no português contemporâneo.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: segundo os desejos humanos
  rationale: “Humanos” traduz o sentido genérico de ἀνθρώπων sem restringi-lo ao sexo masculino. “Desejos” mantém a amplitude de ἐπιθυμίαις, sem reduzi-la ao âmbito sexual; “segundo” explicita de modo idiomático a orientação da vida indicada pelo dativo.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: mas segundo a vontade de Deus
  rationale: Mantém o contraste forte e o paralelismo com “segundo os desejos humanos”, apresentando a vontade de Deus como norma ou orientação da vida.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: o tempo que lhe resta
  rationale: Reproduz o período restante da vida da pessoa mencionada no contexto anterior, em formulação clara e idiomática.
- source_word: ἐν σαρκὶ
  choice: na carne
  rationale: Preserva o termo concreto do grego e sua referência, neste contexto, à existência humana corporal e mortal, sem interpretá-lo automaticamente como “natureza pecaminosa”.
- source_word: βιῶσαι
  choice: viver
  rationale: Traduz diretamente o infinitivo que descreve como a pessoa deve passar ou conduzir o restante de sua vida.
theological_decisions:
- issue: Sentido de σάρξ em ἐν σαρκὶ
  choice: existência terrena e corporal (“na carne”)
  alternative: natureza pecaminosa
  rationale: O contexto fala do tempo restante da vida mortal. Embora os desejos pecaminosos estejam em contraste com a vontade de Deus, a expressão ἐν σαρκὶ em si não precisa designar uma natureza interior pecaminosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para a fluência do português, mantendo o contraste entre desejos humanos e vontade de Deus e preservando a ambiguidade legítima de “carne” por meio de nota.
