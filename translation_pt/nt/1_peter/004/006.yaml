id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: pt
  text: 'Pois foi para isso que o evangelho foi anunciado também aos mortos: para que, embora fossem julgados segundo os homens[a] na carne, vivessem segundo Deus no espírito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo as pessoas” ou “segundo critérios humanos”. O grego diz literalmente “segundo os homens”, usando um termo humano representativo em contraste com “segundo Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em espírito”. A expressão pode indicar a esfera da vida espiritual, em contraste com “na carne”; alguns a entendem mais especificamente como vida pelo Espírito.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: foi para isso
  rationale: Expressa de modo natural a finalidade ou razão introduzida pela locução grega, mantendo sua ligação explicativa com o contexto anterior.
- source_word: νεκροῖς
  choice: aos mortos
  rationale: O adjetivo dativo plural é usado como substantivo; a formulação preserva a referência sem determinar quem são os mortos nem quando ouviram o evangelho.
- source_word: εὐηγγελίσθη
  choice: o evangelho foi anunciado
  rationale: Reproduz o passivo de εὐαγγελίζω e explicita em português o conteúdo cognato implícito, em linguagem corrente e digna.
- source_word: ἵνα
  choice: para que
  rationale: Mantém a força de finalidade ou resultado da conjunção grega.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: embora fossem julgados ... vivessem
  rationale: A construção concessiva natural em português comunica o contraste μὲν...δὲ sem apagar o passivo de κριθῶσι nem o propósito ou resultado introduzido por ἵνα.
- source_word: κατὰ ἀνθρώπους
  choice: segundo os homens
  rationale: Preserva o paralelismo deliberado com κατὰ θεόν. O termo grego é masculino plural representativo e pode indicar pessoas em geral ou critérios humanos; a nota registra essa amplitude.
- source_word: σαρκὶ
  choice: na carne
  rationale: Mantém o contraste concreto com πνεύματι e aponta para a esfera da existência humana corporal, sem introduzir a ideia de 'natureza pecaminosa'.
- source_word: κατὰ θεὸν
  choice: segundo Deus
  rationale: Preserva de perto o paralelo antitético com 'segundo os homens' e não restringe a expressão à avaliação, vontade ou modo de vida de Deus.
- source_word: πνεύματι
  choice: no espírito
  rationale: O dativo é apresentado como esfera de vida, em paralelo com 'na carne'. A inicial minúscula evita identificar explicitamente o referente com o Espírito Santo quando o grego não o exige.
theological_decisions:
- issue: Identidade dos “mortos”
  choice: Mantida a expressão neutra “aos mortos”.
  alternative: Os que agora estão fisicamente mortos mas ouviram em vida; os espiritualmente mortos; ou os mortos relacionados à proclamação de 3:19.
  rationale: O texto não determina explicitamente qual dessas leituras é pretendida, e a tradução não deve impor uma solução doutrinária.
- issue: Relação entre julgamento na carne e vida no espírito
  choice: Mantido o contraste “embora fossem julgados ... vivessem”, sem definir a natureza exata do julgamento.
  alternative: Julgamento por critérios humanos durante a vida corporal; morte física comum à humanidade; ou julgamento divino experimentado na esfera carnal.
  rationale: A formulação grega admite leituras próximas, mas distintas. A tradução conserva o paralelismo e a tensão entre κατὰ ἀνθρώπους/κατὰ θεόν e σαρκί/πνεύματι.
- issue: Referente de πνεύματι
  choice: “no espírito”, com inicial minúscula.
  alternative: “pelo Espírito”, entendendo o Espírito Santo como agente.
  rationale: O paralelismo com σαρκί favorece uma expressão de esfera ou modo de vida, mas a nota reconhece a leitura pneumatológica possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva-se a estrutura antitética do grego e o vocabulário tradicional “carne/espírito”, enquanto as notas esclarecem alternativas legítimas sem resolver ambiguidades teológicas do texto.
