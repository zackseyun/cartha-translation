  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: pt
  text: Mas o fim de todas as coisas está próximo.[a] Portanto, tenham bom senso e mantenham-se sóbrios para as orações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se aproximou”. O perfeito grego indica que o fim se aproximou e agora está próximo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sejam sensatos e sóbrios para orar”. Os dois verbos destacam juízo equilibrado, lucidez e prontidão; aqui, “sóbrios” tem sentido figurado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων δὲ τὸ τέλος
  choice: Mas o fim de todas as coisas
  rationale: A expressão preserva o sentido escatológico direto de τέλος e explicita naturalmente em português o neutro plural implícito em Πάντων. “Mas” marca a transição introduzida por δέ sem exagerar o contraste.
- source_word: ἤγγικεν
  choice: está próximo
  rationale: O perfeito grego descreve o estado presente resultante de uma aproximação. “Está próximo” é natural em português e conserva a urgência da afirmação; a forma mais explícita “aproximou-se” é registrada em nota.
- source_word: σωφρονήσατε
  choice: tenham bom senso
  rationale: Expressa juízo equilibrado, sensatez e domínio racional, evitando reduzir o termo apenas ao autocontrole comportamental.
- source_word: οὖν
  choice: Portanto
  rationale: Sinaliza claramente que as exortações decorrem da proximidade do fim.
- source_word: νήψατε
  choice: mantenham-se vigilantes
  rationale: No uso figurado do Novo Testamento, o verbo comunica sobriedade mental e prontidão espiritual. “Mantenham-se vigilantes” transmite essa lucidez alerta sem sugerir exclusivamente abstinência de álcool.
- source_word: εἰς προσευχάς
  choice: para as orações
  rationale: Mantém tanto a ideia de finalidade expressa por εἰς como o plural προσευχάς, que pode apontar para atos repetidos de oração.
theological_decisions:
- issue: Força escatológica de “o fim de todas as coisas”
  choice: Mantida como declaração direta de que o fim está próximo.
  alternative: Entender τέλος principalmente como “propósito” ou “meta”, ou minimizar sua referência futura.
  rationale: O contexto sustenta a urgência escatológica e dela deriva a exortação ética, mas não define cronologia nem sistema escatológico específico.
- issue: Relação entre lucidez e oração
  choice: As duas exortações são apresentadas como disposições necessárias para as orações.
  alternative: Ligar a finalidade apenas ao segundo imperativo ou traduzir o plural como a abstração singular “oração”.
  rationale: A construção permite entender εἰς προσευχάς como finalidade conjunta dos dois imperativos; o plural foi preservado sem especificar formas particulares de oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural de tratamento foi vertido pela terceira pessoa (“tenham”, “mantenham-se”), natural no português contemporâneo. O plural “orações” foi conservado por corresponder ao texto grego.
