id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: pt
  text: Cada um, conforme recebeu um dom, use-o para servir uns aos outros[a], como bons administradores da variada graça de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre vocês” ou “para vocês mesmos”.
    reason: Alternativas que preservam mais literalmente a construção reflexiva εἰς ἑαυτούς e sua possível ênfase na comunidade como esfera ou beneficiária do serviço.
lexical_decisions:
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva o sentido distributivo, incluindo individualmente todos os membros da comunidade.
- source_word: καθὼς ἔλαβεν
  choice: conforme recebeu
  rationale: Expressa a correspondência entre o dom recebido e seu emprego no serviço, sem explicitar um doador que o verbo não nomeia.
- source_word: χάρισμα
  choice: dom
  rationale: Mantém a amplitude do termo grego como dádiva decorrente da graça, sem restringi-lo à expressão técnica “dom espiritual”.
- source_word: εἰς ἑαυτοὺς
  choice: uns aos outros
  rationale: Em português corrente, comunica com naturalidade que a própria comunidade é a beneficiária do serviço; a nota preserva uma formulação menos explicitamente recíproca.
- source_word: αὐτὸ διακονοῦντες
  choice: use-o para servir
  rationale: Torna natural em português a força exortativa do particípio e liga claramente o pronome ao dom, evitando conotações eclesiásticas indevidas de “ministrar”.
- source_word: καλοὶ οἰκονόμοι
  choice: bons administradores
  rationale: Comunica responsabilidade pelo que foi confiado por outro em linguagem moderna; “despenseiros” seria menos acessível hoje.
- source_word: ποικίλης χάριτος θεοῦ
  choice: da variada graça de Deus
  rationale: “Variada” expressa as múltiplas manifestações da graça divina de modo claro e atual, conservando o genitivo referente a Deus.
theological_decisions:
- issue: Se χάρισμα deve receber o sentido técnico de “dom espiritual”
  choice: dom
  alternative: dom espiritual; dom da graça
  rationale: O contexto envolve serviço capacitado pela graça, mas o substantivo não exige por si só a formulação técnica mais estreita.
- issue: Como representar a força comunitária de εἰς ἑαυτούς
  choice: uns aos outros
  alternative: entre vocês; para vocês mesmos
  rationale: A tradução principal comunica naturalmente os membros da comunidade como beneficiários recíprocos, enquanto a nota registra a possibilidade de entender a expressão mais amplamente como serviço no âmbito da própria comunidade.
- issue: Como exprimir a força exortativa de διακονοῦντες
  choice: use-o para servir
  alternative: servindo com ele
  rationale: Embora a forma grega seja participial, no contexto ela desenvolve a exortação e é mais clara em português como imperativo, sem alterar seu conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Administradores” evita o arcaísmo de “despenseiros”; “variada graça” conserva a imagem da graça divina manifestada de muitas formas sem recorrer ao menos corrente “multiforme”.
