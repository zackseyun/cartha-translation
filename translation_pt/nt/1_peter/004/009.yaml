- source_word: φιλόξενοι
  choice: Sejam hospitaleiros
  rationale: O adjetivo tem força de exortação no contexto. A forma verbal suprida em português preserva essa função e mantém a ideia de disposição para acolher hóspedes.
- source_word: εἰς ἀλλήλους
  choice: uns com os outros
  rationale: Expressa reciprocidade dentro da comunidade e soa natural em português contemporâneo.
- source_word: ἄνευ
  choice: sem
  rationale: Equivalente direto que indica ausência.
- source_word: γογγυσμοῦ
  choice: reclamar
  rationale: Comunica de modo corrente a queixa descontente associada ao exercício da hospitalidade; a forma verbal após «sem» é mais natural em português.
