  text: οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ⸂ἔχοντι κρῖναι⸃ ζῶντας καὶ νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: pt
  text: Eles prestarão contas àquele que está pronto para julgar os vivos e os mortos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se acha pronto para julgar”. A expressão grega descreve literalmente alguém que “tem prontidão para julgar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Eles
  rationale: O pronome relativo retoma as pessoas mencionadas no versículo anterior. Em português, iniciar uma nova frase com “Eles” torna a referência clara e natural.
- source_word: ἀποδώσουσιν λόγον
  choice: prestarão contas
  rationale: A expressão idiomática tem sentido judicial de responder pelos próprios atos. “Prestar contas” é corrente, clara e preserva essa nuance.
- source_word: τῷ
  choice: àquele que
  rationale: O artigo com o particípio tem função substantiva. “Àquele que” introduz naturalmente a descrição seguinte sem identificar o juiz além do que o grego explicita.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: está pronto para julgar
  rationale: A construção descreve alguém em estado de prontidão para julgar. Esta formulação é natural em português e mantém a prontidão presente expressa no grego.
- source_word: ζῶντας καὶ νεκρούς
  choice: os vivos e os mortos
  rationale: Formulação concisa, tradicional e exata para os objetos de “julgar”, preservando o alcance abrangente da expressão.
theological_decisions:
- issue: Identidade daquele que está pronto para julgar os vivos e os mortos
  choice: Mantida como “àquele que”, sem nomear explicitamente Deus ou Cristo.
  alternative: Deus; Cristo/Messias
  rationale: O texto grego não identifica nominalmente o juiz neste versículo. Embora outros contextos do Novo Testamento falem de Deus e também de Cristo como juiz, explicitar uma identidade aqui resolveria uma tensão que a redação do versículo preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prestar contas” preserva o caráter judicial sem soar excessivamente técnico; “está pronto” comunica a construção grega de modo natural.
