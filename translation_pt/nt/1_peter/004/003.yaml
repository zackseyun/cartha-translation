source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: pt
  text: Pois já basta o tempo passado para vocês terem feito a vontade dos gentios[a], vivendo em libertinagens[b], desejos, embriaguez, festanças, bebedeiras e idolatrias ilícitas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos pagãos”. Aqui, “gentios” se refere aos não judeus, especialmente quanto ao seu antigo modo de vida.
    reason: lexical_alternative
  - marker: b
    text: Ou “em excessos desenfreados”. O termo grego inclui condutas desavergonhadas e dissolutas, muitas vezes de caráter sexual.
    reason: lexical_alternative
  - marker: c
    text: Ou “idolatrias proibidas”; também se pode entender “idolatrias abomináveis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Pois já basta o tempo passado
  rationale: Preserva o valor explicativo de γάρ e o sentido de suficiência de ἀρκετός, em formulação natural em português.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: a vontade dos gentios
  rationale: βούλημα indica vontade, intenção ou propósito; no contexto, ἔθνη designa os não judeus, especialmente em seu modo de vida alheio a Deus.
- source_word: κατειργάσθαι
  choice: em que vocês fizeram
  rationale: Expressa a realização efetiva da conduta no período já transcorrido; a construção temporal torna idiomática em português a relação do infinitivo perfeito com o tempo passado.
- source_word: πεπορευμένους
  choice: vivendo
  rationale: No contexto moral, πορεύομαι descreve a maneira de viver. 'Vivendo' comunica naturalmente a metáfora ética sem linguagem artificial.
- source_word: ἐν ἀσελγείαις
  choice: em libertinagens
  rationale: ἀσέλγεια denota excessos desavergonhados, frequentemente sexuais; o plural sugere práticas repetidas ou variadas.
- source_word: ἐπιθυμίαις
  choice: desejos
  rationale: Mantém a amplitude lexical de ἐπιθυμία; a inclusão na lista de vícios deixa claro que se trata de desejos desordenados, sem restringi-los apenas ao campo sexual.
- source_word: οἰνοφλυγίαις
  choice: embriaguez
  rationale: O substantivo raro aponta para consumo excessivo de vinho e estados ou episódios de embriaguez. O singular coletivo é mais natural em português.
- source_word: κώμοις
  choice: orgias
  rationale: κῶμος designa festanças desenfreadas, normalmente ligadas a bebida e excesso; 'orgias' conserva o caráter dissoluto, não necessariamente apenas sexual.
- source_word: πότοις
  choice: bebedeiras
  rationale: πότος se refere a ocasiões ou sessões de consumo de bebida; 'bebedeiras' é corrente e distingue o termo da embriaguez propriamente dita.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: idolatrias proibidas
  rationale: ἀθέμιτος significa ilícito, proibido ou contrário ao que é permitido. 'Proibidas' preserva a força normativa sem intensificação emocional indevida.
theological_decisions:
- issue: Sentido de ἐθνῶν
  choice: gentios
  alternative: pagãos; nações
  rationale: '''Gentios'' é o termo bíblico tradicional e preciso para os não judeus neste contexto. ''Pagãos'' explicitaria a religião, enquanto ''nações'' poderia sugerir entidades políticas.'
- issue: Força moral de ἀθεμίτοις εἰδωλολατρίαις
  choice: idolatrias proibidas
  alternative: idolatrias abomináveis; idolatrias ilícitas
  rationale: A expressão caracteriza essas práticas como contrárias ao permitido. 'Proibidas' mantém a condenação objetiva do grego sem converter o adjetivo em uma reação principalmente emocional.
- issue: Referência implícita do particípio πεπορευμένους
  choice: vocês
  alternative: eles; construção impessoal
  rationale: O particípio acusativo plural retoma os destinatários subentendidos no infinitivo. Tornar 'vocês' explícito produz português claro sem alterar o referente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sintaxe foi ajustada para fluidez sem apagar a anterioridade da vida descrita. Mantiveram-se os plurais naturais em 'libertinagens', 'orgias', 'bebedeiras' e 'idolatrias', enquanto 'embriaguez' funciona idiomaticamente como nome coletivo.
