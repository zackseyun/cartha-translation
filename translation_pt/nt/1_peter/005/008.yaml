  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: pt
  text: Mantenham a mente lúcida[a] e fiquem atentos. O adversário de vocês, o diabo, anda ao redor[b] como um leão que ruge, procurando alguém para devorar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sejam sóbrios” ou “Tenham domínio próprio”. O verbo grego νήφω significa literalmente estar sóbrio, mas aqui é usado em sentido figurado, indicando lucidez e domínio de si diante do perigo espiritual, e não abstinência de bebida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ronda”. O verbo grego significa mais literalmente “anda ao redor” ou “circula”, mas a imagem do leão pode sugerir a ideia de rondar à procura da presa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Mantenham a mente lúcida
  rationale: O imperativo de νήφω tem aqui sentido figurado de lucidez e domínio de si diante de perigo espiritual. A formulação comunica esse valor em português atual e permanece distinta de γρηγορήσατε.
- source_word: γρηγορήσατε
  choice: fiquem atentos
  rationale: Expressa vigilância desperta e contínua, complementando a lucidez indicada pelo primeiro imperativo.
- source_word: ἀντίδικος
  choice: adversário
  rationale: Preserva o sentido amplo de oponente hostil sem limitar o termo à sua possível nuance jurídica.
- source_word: διάβολος
  choice: o diabo
  rationale: Neste contexto, o termo funciona como designação reconhecida do ser pessoal hostil aos fiéis, e não apenas como o substantivo comum 'caluniador'.
- source_word: ὡς λέων ὠρυόμενος
  choice: como um leão que ruge
  rationale: Mantém de modo vivo e natural a comparação explícita e a imagem ameaçadora do grego.
- source_word: περιπατεῖ
  choice: anda ao redor
  rationale: Reproduz com transparência o sentido básico de caminhar ou circular; a imagem do leão já comunica a ameaça.
- source_word: ζητῶν
  choice: procurando
  rationale: Expressa a busca ativa como ação simultânea e orientada para o objetivo indicado pelo infinitivo.
- source_word: τινα
  choice: alguém
  rationale: Preserva o caráter singular e indefinido do alvo procurado.
- source_word: καταπιεῖν
  choice: devorar
  rationale: No contexto da metáfora do leão, é o equivalente português mais natural para a ideia literal de engolir e conserva sua força violenta.
theological_decisions:
- issue: Se διάβολος deve ser traduzido como substantivo comum ('caluniador') ou como designação pessoal
  choice: o diabo
  alternative: o caluniador
  rationale: O contexto apresenta o referente como o adversário pessoal dos fiéis. 'O diabo' reflete esse uso neotestamentário sem acrescentar conteúdo doutrinário ao texto.
- issue: Quanta intensidade contextual atribuir a περιπατεῖ na imagem do leão
  choice: anda ao redor
  alternative: ronda
  rationale: A opção principal conserva o sentido comum do verbo grego e deixa que a comparação com o leão transmita a ameaça. A alternativa mais interpretativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural foi vertido com formas de terceira pessoa ('vocês'), evitando regionalismos. A coordenação dos dois imperativos preserva sua distinção sem soar artificial.
