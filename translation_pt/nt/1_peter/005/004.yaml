id: 1PE.5.4
reference: 1 Peter 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: pt
  text: E, quando o Supremo Pastor se manifestar[a], vocês receberão a coroa[b] de glória que não murcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aparecer”.'
    reason: alternative_reading
  - marker: b
    text: A palavra grega traduzida por “coroa” pode designar uma grinalda concedida como prêmio de honra ou vitória, e não especificamente uma coroa real.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: quando ... se manifestar
  rationale: O particípio aoristo passivo em genitivo absoluto tem sentido temporal. “Quando ... se manifestar” é natural em português, conserva a ideia de manifestação e não define além do grego como ela ocorrerá.
- source_word: ἀρχιποίμενος
  choice: Supremo Pastor
  rationale: O composto designa o pastor principal ou maior. “Supremo Pastor” é claro, digno e funciona naturalmente como título cristológico no contexto.
- source_word: κομιεῖσθε
  choice: vocês receberão
  rationale: O futuro médio indica receber ou obter aquilo que é concedido como recompensa. “Receberão” comunica isso de modo direto e corrente.
- source_word: ἀμαράντινον
  choice: que não murcha
  rationale: O adjetivo descreve algo que não perde o viço nem murcha. A expressão preserva a imagem concreta associada à coroa de folhas e evita ampliar o sentido para “imperecível” sem necessidade.
- source_word: τῆς δόξης
  choice: de glória
  rationale: Mantém o genitivo compacto do grego e sua força metafórica, sem reduzi-lo simplesmente ao adjetivo “gloriosa”.
- source_word: στέφανον
  choice: coroa
  rationale: É a equivalência tradicional e facilmente compreendida; uma nota esclarece que o termo pode designar a grinalda concedida como prêmio de honra ou vitória, não especificamente uma coroa real.
theological_decisions:
- issue: Identidade do “Supremo Pastor”
  choice: Título cristológico referente a Jesus, com iniciais maiúsculas
  alternative: pastor principal, em minúsculas
  rationale: No contexto imediato da exortação aos pastores e da manifestação futura, o título aponta para Jesus. A tradução não acrescenta seu nome nem desenvolve uma formulação doutrinária além do texto.
- issue: Linguagem da manifestação escatológica
  choice: se manifestar
  alternative: aparecer; for manifestado
  rationale: “Se manifestar” conserva o campo semântico de tornar-se manifesto e é idiomático em português. A nota registra “aparecer”, enquanto se evita especificar a natureza do acontecimento além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. “Que não murcha” mantém viva a imagem da grinalda sem recorrer a vocabulário erudito ou opaco.
