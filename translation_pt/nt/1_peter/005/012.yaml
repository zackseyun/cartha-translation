id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: pt
  text: Por meio de Silvano, que considero um irmão fiel, escrevi brevemente[a] a vocês, exortando-os e testemunhando que esta é a verdadeira graça de Deus. Permaneçam firmes nela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escrevi a vocês em poucas palavras”.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “na qual vocês estão”, em vez de “Permaneçam firmes nela”.
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Por meio de Silvano
  rationale: διά com o genitivo expressa aqui agência ou instrumentalidade. “Por meio de Silvano” preserva a possibilidade de ele ter sido portador da carta ou colaborador em sua redação, sem definir sua função com precisão indevida.
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: que considero um irmão fiel
  rationale: A formulação natural em português integra a avaliação pessoal de Pedro à descrição de Silvano. “Fiel” conserva o sentido de lealdade e confiabilidade de πιστός.
- source_word: δι’ ὀλίγων ἔγραψα
  choice: escrevi brevemente
  rationale: A expressão idiomática indica que a carta foi escrita de modo conciso. O aoristo epistolar pode ser vertido naturalmente pelo pretérito perfeito em português.
- source_word: παρακαλῶν
  choice: exortando-os
  rationale: No contexto pastoral e moral da carta, “exortar” comunica melhor o apelo sério de παρακαλέω, sem excluir sua dimensão de encorajamento.
- source_word: ἐπιμαρτυρῶν
  choice: testemunhando
  rationale: O verbo transmite confirmação solene ou testemunho enfático; “testemunhando” preserva essa força.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: que esta é a verdadeira graça de Deus
  rationale: A tradução conserva tanto o demonstrativo “esta”, cujo alcance permanece aberto no contexto, quanto a afirmação de que se trata da graça genuína de Deus.
- source_word: εἰς ἣν στῆτε
  choice: Permaneçam firmes nela
  rationale: O imperativo pede perseverança resoluta. “Nela” retoma “graça”, e “permaneçam firmes” expressa em português corrente a ideia de manter-se constante nesse âmbito.
theological_decisions:
- issue: Referência de “esta” em “esta é a verdadeira graça de Deus”
  choice: Manter o demonstrativo sem explicitar seu alcance.
  alternative: Restringir “esta” à mensagem da carta, à experiência dos leitores ou especificamente ao evangelho anunciado por Silvano.
  rationale: O contexto favorece uma referência ao conteúdo testemunhado por Pedro, mas não exige uma delimitação mais estreita; a tradução preserva essa abertura.
- issue: Valor de στῆτε no encerramento
  choice: 'Seguir o imperativo do SBLGNT: “Permaneçam firmes nela”.'
  alternative: 'Seguir a variante indicativa: “na qual vocês estão”.'
  rationale: O texto-fonte fornecido apresenta o imperativo, adequado à exortação final. A variante manuscrita é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “que considero um irmão fiel” evita a rigidez de uma reprodução palavra por palavra e mantém o tom pessoal da recomendação de Silvano. Os pronomes e a flexão verbal tratam os destinatários no plural sem regionalismos marcados.
