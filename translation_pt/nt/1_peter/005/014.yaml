id: 1PE.5.14
reference: 1 Peter 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: pt
  text: Saúdem uns aos outros com um beijo de amor. Paz a todos vocês que estão no Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “que estão em Cristo”.
    reason: Registra a formulação tradicional para a expressão τοῖς ἐν Χριστῷ, sem substituir no texto principal o valor de título de Χριστός.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo aoristo médio na segunda pessoa do plural. “Saúdem” expressa de modo natural e direto a exortação própria do encerramento da carta.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Pronome recíproco que indica uma ação mútua entre os membros da comunidade.
- source_word: ἐν φιλήματι ἀγάπης
  choice: com um beijo de amor
  rationale: O ἐν indica aqui o modo do cumprimento e é expresso naturalmente por “com”. A formulação conserva tanto φίλημα, “beijo”, quanto a relação explícita com ἀγάπη, “amor”.
- source_word: εἰρήνη
  choice: Paz
  rationale: Mantém a concisão da fórmula nominal de bênção, sem acrescentar um verbo ausente do grego.
- source_word: ὑμῖν πᾶσιν
  choice: a todos vocês
  rationale: Expressa claramente os destinatários da bênção e preserva seu alcance inclusivo em português moderno.
- source_word: τοῖς ἐν Χριστῷ
  choice: que estão no Messias
  rationale: O artigo com a expressão preposicional tem valor substantivado, literalmente “os que estão em”. “Messias” traduz Χριστός como título, enquanto “no” é a contração portuguesa natural de “em o”.
theological_decisions:
- issue: Tradução de Χριστῷ na expressão ἐν Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: Χριστός significa “Ungido” e funciona aqui como título; “Messias” torna esse valor transparente e preserva a linguagem teológica de estar “no Messias”. A forma tradicional “Cristo” é registrada em nota para não ocultar a alternativa consagrada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para a segunda pessoa do plural e mantém a forma concisa do encerramento epistolar.
