  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: pt
  text: Resistam a ele, firmes na fé, sabendo que os mesmos sofrimentos estão sendo enfrentados por sua irmandade em todo o mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Irmandade” refere-se a toda a comunidade dos que creem, mulheres e homens. A última oração também pode ser traduzida: “os mesmos sofrimentos estão se cumprindo em sua irmandade no mundo”.'
    reason: Nota cultural sobre o alcance inclusivo de ἀδελφότης e alternativa lexical mais formal para ἐπιτελεῖσθαι, sem acrescentar a ideia de que a comunidade está “espalhada”.
lexical_decisions:
- source_word: ᾧ
  choice: lhe
  rationale: O pronome relativo dativo retoma o diabo no versículo 8; o pronome oblíquo após “resistam” expressa esse referente com naturalidade.
- source_word: ἀντίστητε
  choice: Resistam
  rationale: O imperativo aoristo pede oposição decidida; “resistam” é direto, corrente e fiel.
- source_word: στερεοὶ τῇ πίστει
  choice: firmes na fé
  rationale: “Firmes” expressa estabilidade, e “na fé” preserva a possível referência tanto à confiança perseverante quanto à fé cristã compartilhada, sem resolver excessivamente a ambiguidade.
- source_word: εἰδότες
  choice: sabendo
  rationale: Mantém a construção participial e apresenta o conhecimento como circunstância ou fundamento da resistência.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: os mesmos sofrimentos
  rationale: Reproduz de modo conciso a ideia de sofrimentos correspondentes ou da mesma espécie, sem sugerir que os acontecimentos sejam literalmente idênticos.
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: pela comunidade de irmãos de vocês no mundo
  rationale: “Comunidade de irmãos” conserva a metáfora familiar coletiva de ἀδελφότης, enquanto a nota esclarece seu alcance inclusivo; “no mundo” segue diretamente a expressão locativa.
- source_word: ἐπιτελεῖσθαι
  choice: estão sendo suportados
  rationale: O infinitivo passivo pode indicar que os sofrimentos estão sendo cumpridos, levados a termo ou vividos. “Sendo suportados” é natural no contexto e preserva melhor que “experimentados” o aspecto de padecimento, com a alternativa formal registrada em nota.
theological_decisions:
- issue: Sentido de τῇ πίστει
  choice: na fé
  alternative: firmes por meio da fé; firmes na fé cristã
  rationale: A construção pode apontar para a confiança pessoal ou para a fé cristã professada. “Na fé” preserva essa tensão sem impor uma distinção doutrinária.
- issue: Alcance de ἀδελφότητι
  choice: comunidade de irmãos
  alternative: família dos que creem; irmandade
  rationale: O substantivo coletivo expressa parentesco espiritual e abrange toda a comunidade cristã, não apenas os homens. A formulação mantém a imagem familiar sem recorrer a uma paráfrase excessiva.
- issue: Sentido de ἐπιτελεῖσθαι
  choice: estão sendo suportados
  alternative: estão se cumprindo; estão sendo levados a termo
  rationale: O verbo admite a noção de cumprimento ou conclusão, mas, com “sofrimentos” e uma comunidade como participante, pode ser entendido idiomaticamente como padecimento vivido. A nota conserva a leitura mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural e mantém a metáfora familiar do grego, esclarecida em nota.
