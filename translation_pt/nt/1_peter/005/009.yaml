  verdict: revise
  source_fidelity: 'A estrutura principal é bem preservada: o imperativo plural, a firmeza na fé e o conhecimento dos sofrimentos compartilhados estão presentes. Contudo, “Resistam-lhe” é gramatical, mas soa marcadamente formal e pouco natural para a legibilidade brasileira pretendida. Além disso, “comunidade de irmãos de vocês no mundo” é uma expansão pesada de ἀδελφότητι e deixa menos clara a relação de “no mundo” com a comunidade. “Irmandade” transmite de modo mais direto o substantivo coletivo grego; “estão sendo enfrentados” comunica naturalmente, sem afirmar mais do que o texto, o sentido contextual do passivo ἐπιτελεῖσθαι.'
  naturalness: “Resistam a ele” é a construção corrente no português brasileiro e plenamente compreensível no uso internacional. “Sua irmandade em todo o mundo” é mais fluente que “pela comunidade de irmãos de vocês no mundo” e evita repetição desnecessária de termos familiares.
  terminology: “Fé” preserva adequadamente a amplitude de τῇ πίστει. “Irmandade” é um equivalente coletivo conciso para ἀδελφότης e a nota esclarece corretamente que inclui mulheres e homens. A nota alternativa mantém a possibilidade mais formal de entender ἐπιτελεῖσθαι como “cumprir-se”, sem a tornar a leitura principal.
  issues:
