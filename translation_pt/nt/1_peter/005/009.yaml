    issue: Construção pronominal excessivamente formal
    rationale: “Resistam-lhe” é correto, mas é pouco idiomático na variedade com legibilidade brasileira solicitada. “Resistam a ele” mantém sem perda o referente do relativo dativo ᾧ.
  - severity: low
    issue: Expansão e ordenação pouco naturais de ἀδελφότητι
    rationale: “Comunidade de irmãos de vocês no mundo” é mais perifrástico do que necessário e torna a ligação locativa menos transparente. “Sua irmandade em todo o mundo” é mais conciso e natural, preservando o coletivo grego.
  - severity: low
    issue: Alternativa da nota introduz “espalhada”
    rationale: “Espalhada” é plausível, mas não está explicitamente no grego. A alternativa deve limitar-se à leitura formal de ἐπιτελεῖσθαι e à localização da irmandade.
