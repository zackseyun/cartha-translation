  rationale: A revisão melhora a naturalidade para leitores brasileiros sem abandonar a fidelidade formal. Substitui-se o clítico pouco usual por uma construção corrente; usa-se “irmandade” como equivalente coletivo mais direto de ἀδελφότης; e a nota é restringida ao que o texto efetivamente permite, preservando a dificuldade semântico-sintática de ἐπιτελεῖσθαι.
