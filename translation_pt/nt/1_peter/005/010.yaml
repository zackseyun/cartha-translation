id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: pt
  text: E o Deus de toda graça, que chamou vocês para a sua glória eterna no Messias[a], depois de terem sofrido por pouco tempo, ele mesmo os restaurará[b], firmará, fortalecerá e fundamentará[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Cristo”. O título grego Χριστός pode ser traduzido por “Messias” ou, segundo a forma tradicional, por “Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou “completará” ou “aperfeiçoará”. O verbo inclui a ideia de restaurar algo à condição adequada.
    reason: lexical_alternative
  - marker: c
    text: Ou “estabelecerá sobre um fundamento firme”. O verbo grego emprega a imagem de um fundamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: de toda graça
  rationale: Preserva a construção abrangente do grego e soa natural em português, sem especificar indevidamente diferentes tipos de graça.
- source_word: καλέσας
  choice: que chamou
  rationale: O particípio aoristo é expresso naturalmente por uma oração relativa no passado, mantendo clara a relação com Deus.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: para a sua glória eterna
  rationale: Neste contexto, 'para' expressa de modo natural o movimento e o destino indicados por εἰς, sem excluir a participação dos chamados nessa glória.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός funciona como título; 'Messias' comunica seu significado em português. A formulação também preserva a expressão relacional ἐν Χριστῷ.
- source_word: ὀλίγον παθόντας
  choice: depois de terem sofrido por um pouco de tempo
  rationale: Toma ὀλίγον em sentido temporal e explicita com naturalidade a sequência entre o sofrimento limitado e a ação futura de Deus.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: 'Mantém a ênfase do pronome grego: é o próprio Deus quem realizará as ações seguintes.'
- source_word: καταρτίσει
  choice: restaurará
  rationale: Comunica a ideia de pôr em condição adequada ou reparar após o sofrimento, preservando também por nota as possibilidades de completar ou aperfeiçoar.
- source_word: στηρίξει
  choice: firmará
  rationale: Expressa estabilidade e firmeza de modo corrente e distingue razoavelmente este verbo dos verbos vizinhos.
- source_word: σθενώσει
  choice: fortalecerá
  rationale: É o equivalente direto e natural, preservando a ideia de tornar forte.
- source_word: θεμελιώσει
  choice: fundamentará
  rationale: Conserva de maneira concisa a imagem de lançar ou dar fundamento, sem fundi-la com a ideia mais geral de firmar.
theological_decisions:
- issue: Tradução de Χριστῷ
  choice: Messias
  alternative: Cristo
  rationale: O termo conserva aqui seu valor titular. 'Messias' torna explícito o significado do título, enquanto a alternativa tradicional é registrada em nota.
- issue: Relação temporal entre sofrimento e ação divina
  choice: depois de terem sofrido por um pouco de tempo
  alternative: tendo sofrido por um pouco de tempo
  rationale: A redação apresenta o sofrimento como limitado e anterior à ação restauradora prometida, sem construir uma doutrina adicional sobre a finalidade ou a necessidade desse sofrimento.
- issue: Destino expresso por εἰς
  choice: para a sua glória eterna
  alternative: à sua glória eterna / para dentro da sua glória eterna
  rationale: '''Para'' preserva a orientação em direção à glória e é idiomático em português, sem resolver além do texto a natureza exata da entrada ou participação nela.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural de segunda pessoa e futuros simples para refletir a série enfática de promessas. A sequência de quatro verbos foi mantida, evitando reduzi-los a sinônimos indistintos.
