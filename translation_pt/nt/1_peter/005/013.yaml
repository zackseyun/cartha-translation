reference: 1 Peter 5:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: pt
  text: Aquela que está na Babilônia[a][b], escolhida juntamente com vocês, manda saudações; e também Marcos, meu filho.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “A igreja que está na Babilônia, escolhida juntamente com vocês”. O grego emprega uma expressão no feminino singular com um substantivo implícito.'
    reason: alternative_reading
  - marker: b
    text: “Babilônia” pode ser uma referência simbólica a Roma no uso cristão antigo; o próprio texto diz “Babilônia”.
    reason: cultural_note
  - marker: c
    text: “Meu filho” provavelmente expressa uma relação espiritual, não biológica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: manda saudações
  rationale: Expressa de modo natural em português o sentido epistolar de saudar ou enviar saudações.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Aquela que está ... escolhida juntamente com vocês
  rationale: Mantém o feminino singular e o substantivo implícito do grego, sem inserir “igreja” no texto principal, preservando assim a ambiguidade do referente.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: Conserva o nome geográfico expresso no texto grego, sem substituí-lo pela interpretação possível de “Roma”.
- source_word: συνεκλεκτὴ
  choice: escolhida juntamente com vocês
  rationale: Comunica com clareza que ela participa da mesma eleição dos destinatários, evitando o pouco natural “coeleita”.
- source_word: Μᾶρκος
  choice: Marcos
  rationale: Forma tradicional e corrente do nome em português.
- source_word: ὁ υἱός μου
  choice: meu filho
  rationale: Preserva a linguagem familiar literal do grego sem explicitar no corpo do texto uma relação espiritual que, embora provável, não está marcada lexicalmente.
theological_decisions:
- issue: Identidade de ἡ ... συνεκλεκτὴ
  choice: 'Deixar implícito o referente feminino: “Aquela que está ... escolhida juntamente com vocês”.'
  alternative: “A igreja que está na Babilônia, escolhida juntamente com vocês” ou uma mulher cristã, talvez a esposa de Pedro.
  rationale: O grego apresenta artigo e adjetivo no feminino singular, mas nenhum substantivo expresso. A redação mantém essa ambiguidade genuína, enquanto a nota registra a interpretação eclesial comum.
- issue: Sentido de “Babilônia”
  choice: Manter “Babilônia” no texto principal.
  alternative: Entender o nome como referência simbólica a Roma ou como a Babilônia mesopotâmica.
  rationale: O texto grego diz explicitamente “Babilônia”; a identificação histórica ou simbólica permanece discutida e não deve ser resolvida dentro da tradução.
- issue: Sentido de “meu filho” aplicado a Marcos
  choice: Manter a expressão familiar literal “meu filho”.
  alternative: “Meu filho espiritual”.
  rationale: É provável que a expressão indique parentesco espiritual, mas o grego não explicita essa qualificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aquela” preserva o feminino singular sem suprir indevidamente “igreja”; “manda saudações” mantém o tom epistolar natural. O ponto e vírgula torna claro que Marcos também envia saudações.
