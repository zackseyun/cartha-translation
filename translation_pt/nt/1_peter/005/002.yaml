  naturalness: “Pastoreiem” e “o rebanho de Deus que está entre vocês” são claros e naturais. “Segundo Deus” conserva a concisão do grego, embora seja deliberadamente mais marcado em português; a nota torna a expressão compreensível sem eliminar sua amplitude. “Exercendo supervisão” comunica de modo mais explícito ἐπισκοποῦντες do que “zelando por ele”.
  terminology: “Pastoreiem” mantém a metáfora sem impor um título eclesiástico. “Exercendo supervisão” traduz a atividade de ἐπισκοποῦντες sem a transformar em designação de cargo. “Lucro vergonhoso” mantém a dimensão de ganho e sua censura moral.
