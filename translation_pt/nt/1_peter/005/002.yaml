id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: pt
  text: Pastoreiem o rebanho de Deus que está entre vocês, exercendo supervisão não por obrigação, mas de livre vontade, segundo Deus[a]; nem por lucro vergonhoso, mas com prontidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a vontade de Deus” ou “como Deus quer”.'
    reason: A expressão grega κατὰ θεόν é condensada e pode indicar conformidade com a vontade, o padrão ou o modo desejado por Deus.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Pastoreiem
  rationale: Preserva a metáfora do pastor e do rebanho no imperativo dirigido aos presbíteros, sem transformar o verbo em título de ofício.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: o rebanho de Deus que está entre vocês
  rationale: Mantém explicitamente que o rebanho pertence a Deus e entende ἐν ὑμῖν em sentido local e relacional, sem sugerir que os líderes sejam seus donos.
- source_word: ἐπισκοποῦντες
  choice: zelando por ele
  rationale: Expressa a ação de supervisionar e cuidar de modo natural em português, sem introduzir um título eclesiástico técnico.
- source_word: μὴ ἀναγκαστῶς
  choice: não por obrigação
  rationale: Comunica de forma corrente a ideia de agir constrangido ou sob compulsão e prepara o contraste com o serviço voluntário.
- source_word: ἀλλὰ ἑκουσίως
  choice: mas de livre vontade
  rationale: Preserva o contraste com a obrigação e soa natural e claro no português atual.
- source_word: κατὰ θεόν
  choice: segundo Deus
  rationale: Retém a formulação condensada e sua amplitude sem decidir se a expressão aponta especificamente para a vontade, o padrão ou a maneira de Deus; a nota oferece equivalentes interpretativos mais fluidos.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: nem por lucro vergonhoso
  rationale: Conserva tanto a motivação financeira quanto a avaliação moral negativa presente no advérbio.
- source_word: ἀλλὰ προθύμως
  choice: mas com dedicação
  rationale: Transmite prontidão e empenho, distinguindo este termo de ἑκουσίως, já traduzido como disposição voluntária.
theological_decisions:
- issue: Se ἐπισκοποῦντες deve ser traduzido como título técnico de ofício
  choice: Tradução descritiva, “zelando por ele”
  alternative: “exercendo a supervisão” ou “servindo como supervisores”
  rationale: O particípio descreve a atividade dos presbíteros no contexto. A formulação escolhida preserva a função de cuidado sem impor uma estrutura eclesiástica posterior.
- issue: Grau de explicitação de κατὰ θεόν
  choice: Manter “segundo Deus” no texto principal
  alternative: “segundo a vontade de Deus” ou “como Deus quer”
  rationale: A expressão grega é semanticamente condensada. A tradução principal preserva essa tensão, enquanto a nota apresenta leituras naturais sem elevar uma delas à condição de única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Pastoreiem” mantém a imagem central; “zelando por ele” evita linguagem burocrática e títulos denominacionais. A construção “segundo Deus” é deliberadamente mais formal para preservar a concisão e a ambiguidade do grego, esclarecidas em nota.
