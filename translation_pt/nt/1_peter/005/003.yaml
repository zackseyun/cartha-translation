lexical_decisions:
- source_word: μηδ’ ὡς
  choice: nem como quem
  rationale: Mantém a coordenação negativa com o contexto anterior e introduz a maneira de agir que é rejeitada.
- source_word: κατακυριεύοντες
  choice: domina sobre
  rationale: Expressa o exercício autoritário e opressivo de poder, sem sugerir que toda liderança seja proibida.
- source_word: τῶν κλήρων
  choice: os que foram confiados aos seus cuidados
  rationale: No contexto pastoral, os 'lotes' ou 'porções' são provavelmente as partes do rebanho de Deus confiadas aos respectivos presbíteros. A formulação comunica mordomia, não posse.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca de modo natural o contraste forte entre a conduta proibida e a conduta esperada.
- source_word: τύποι
  choice: exemplos
  rationale: Indica modelos de conduta dignos de imitação, em linguagem atual e clara.
- source_word: γινόμενοι
  choice: tornando-se
  rationale: Preserva o aspecto verbal e dinâmico do particípio, em vez de reduzi-lo ao estático 'sendo'.
- source_word: τοῦ ποιμνίου
  choice: o rebanho
  rationale: Mantém a metáfora pastoral convencional para a comunidade de fiéis.
theological_decisions:
- issue: Sentido de κλήρων em relação à liderança da igreja
  choice: Refere-se às pessoas ou porções do rebanho confiadas aos cuidados dos presbíteros, e não a bens que lhes pertençam.
  alternative: Traduzir literalmente como 'os lotes/as porções' ou entendê-lo como jurisdições dos presbíteros.
  rationale: O contexto trata de pastorear o rebanho de Deus. A tradução explicita a responsabilidade de cuidado sem transformar os fiéis em propriedade dos líderes; a imagem literal é preservada na nota.
- issue: Força de κατακυριεύοντες
  choice: Proíbe o uso dominador ou opressivo da autoridade.
  alternative: Entender que o texto proíbe qualquer exercício de liderança ou autoridade pelos presbíteros.
  rationale: O verbo censura o senhorio abusivo, e o contraste com servir de exemplo pressupõe liderança exercida de outra maneira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'nem como quem' conserva a ligação com o versículo anterior; a nota registra a metáfora ambígua de κλῆροι.
