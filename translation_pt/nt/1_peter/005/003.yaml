  source_fidelity: A tradução comunica adequadamente a coordenação negativa, a censura ao exercício dominador de autoridade e o contraste com o exemplo dado ao rebanho. Contudo, «os que foram confiados aos seus cuidados» torna o referente humano mais explícito do que o grego, que diz literalmente «os lotes/as porções» e pode aludir às partes do rebanho atribuídas ao cuidado dos presbíteros. Uma formulação que preserve «porções» no texto mantém melhor essa imagem e ambiguidade.
  naturalness: «Nem dominando as porções que lhes foram confiadas» é natural em português moderno no registro pastoral e evita a construção mais pesada «nem como quem domina sobre». «Mas tornando-se exemplos para o rebanho» é clara e idiomática.
