  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: pt
  text: Portanto, humilhem-se[a] sob a poderosa mão de Deus, para que ele os exalte no tempo certo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Sejam humilhados [...] para que ele os exalte no devido tempo». O imperativo grego tem forma passiva, embora aqui seja geralmente entendido com sentido reflexivo: «humilhem-se».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: humilhem-se
  rationale: Embora o imperativo aoristo esteja na forma passiva, neste contexto exortativo ele é naturalmente entendido com sentido reflexivo ou médio. «Humilhem-se» comunica com clareza a responsabilidade dos leitores, sem separar essa atitude da submissão a Deus expressa na frase seguinte.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a inferência lógica a partir da afirmação anterior de que Deus se opõe aos orgulhosos e concede graça aos humildes.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: sob a poderosa mão
  rationale: Preserva a metáfora bíblica tradicional da ação forte e soberana de Deus. «Poderosa mão» é natural e amplamente compreensível em português.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Genitivo direto que identifica Deus como aquele cuja mão poderosa está em vista.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo natural a relação de propósito ou resultado introduzida pela conjunção grega.
- source_word: ὑμᾶς ὑψώσῃ
  choice: ele os exalte
  rationale: O sujeito implícito é Deus. «Exalte» preserva a ideia de Deus elevar os humildes à honra ou vindicá-los, sem reduzir o sentido a um movimento físico.
- source_word: ἐν καιρῷ
  choice: no tempo certo
  rationale: καιρός indica o tempo apropriado ou oportuno, e não apenas tempo cronológico. «No tempo certo» é claro, atual e não especifica além do que o grego permite.
theological_decisions:
- issue: Voz e agência em Ταπεινώθητε
  choice: O imperativo é traduzido reflexivamente como «humilhem-se», mantendo «sob a poderosa mão de Deus» para mostrar que se trata de submissão ao poder divino.
  alternative: «Sejam humilhados»
  rationale: A escolha oferece português natural e preserva a responsabilidade humana de assumir uma posição humilde diante de Deus, sem ocultar por completo a forma passiva grega; a alternativa é registrada em nota. Deus permanece aquele que, depois, exalta.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A colocação pronominal «humilhem-se» é natural no registro escrito; «poderosa mão» preserva a metáfora bíblica, e «no tempo certo» comunica claramente a nuance de καιρός.
