  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: pt
  text: A ele seja o domínio para todo o sempre.[a] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “A ele seja o domínio pelos séculos dos séculos”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: αὐτῷ
  choice: A ele
  rationale: O dativo singular retoma Deus no contexto anterior. “A ele” preserva a forma de atribuição própria da doxologia.
- source_word: κράτος
  choice: domínio
  rationale: Neste contexto doxológico, o termo indica poder soberano e governante, não apenas força abstrata; “domínio” mantém essa nuance.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: Expressão idiomática portuguesa que comunica duração interminável e conserva a ênfase da fórmula grega.
- source_word: ἀμήν
  choice: Amém
  rationale: Transliteração tradicional em português, preservando a força litúrgica da afirmação conclusiva.
theological_decisions:
- issue: Predicado verbal implícito na doxologia
  choice: A ele seja o domínio
  alternative: A ele pertence o domínio; dele é o domínio
  rationale: O grego não apresenta verbo expresso. “Seja” preserva o tom doxológico e a forma de atribuição sem converter a frase em uma simples declaração de posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção doxológica tradicional foi mantida sem arcaísmo excessivo.
