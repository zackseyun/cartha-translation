source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: pt
  text: 'Portanto, exorto aos presbíteros entre vocês, eu, presbítero como eles e testemunha dos sofrimentos do Messias[a], e participante[b] da glória que está para ser revelada:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo”. O título grego Χριστός pode ser traduzido como “Messias” ou, na forma mais tradicional, “Cristo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “alguém que tem parte na glória que está para ser revelada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: os presbíteros
  rationale: Neste contexto comunitário, o termo designa líderes da igreja, não apenas homens idosos. “Presbíteros” é corrente no português bíblico e preserva a função sem a reduzir à idade.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a transição inferencial que liga esta exortação ao argumento anterior.
- source_word: ἐν ὑμῖν
  choice: que estão entre vocês
  rationale: Expressa de modo natural a presença desses líderes no meio da comunidade.
- source_word: παρακαλῶ
  choice: exorto
  rationale: Comunica um apelo pastoral sério e enfático, mais forte que um simples pedido.
- source_word: συμπρεσβύτερος
  choice: eu, que também sou presbítero
  rationale: Formulação natural em português que conserva a identificação solidária do autor com os demais presbíteros.
- source_word: μάρτυς
  choice: testemunha
  rationale: Preserva o sentido de alguém que testemunha a respeito dos sofrimentos, sem impor o sentido posterior de mártir.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: dos sofrimentos do Messias
  rationale: A construção é entendida naturalmente como referência aos sofrimentos padecidos pelo Messias.
- source_word: Χριστοῦ
  choice: Messias
  rationale: O termo mantém aqui seu valor de título, “o Ungido”; a forma tradicional “Cristo” é indicada em nota.
- source_word: κοινωνός
  choice: participante
  rationale: Indica alguém que tem parte em algo. “Participante” é claro e natural, sem os possíveis sentidos comerciais de “parceiro”.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: da glória que está para ser revelada
  rationale: Preserva tanto a voz passiva de “ser revelada” quanto a expectativa futura expressa por μέλλω.
theological_decisions:
- issue: Tradução de Χριστοῦ como título cristológico
  choice: Messias
  alternative: Cristo
  rationale: “Messias” torna explícito o sentido titular de Χριστός neste contexto, enquanto a forma tradicional permanece disponível em nota.
- issue: Força de μελλούσης ἀποκαλύπτεσθαι
  choice: que está para ser revelada
  alternative: que será revelada
  rationale: A opção escolhida conserva a nuance de expectativa do grego sem definir um calendário escatológico preciso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Presbíteros” preserva a referência à liderança comunitária; a sintaxe foi levemente explicitada para soar natural sem eliminar a relação colegiada expressa no grego.
