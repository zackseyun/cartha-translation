    rationale: Como a palavra anotada é o título Χριστός/Messias, a alternativa lexical direta em português é “Cristo”. “De Cristo” só seria uma alternativa completa se a nota reproduzisse toda a expressão “dos sofrimentos de Cristo”.
  - severity: low
    issue: “Eu, que também sou presbítero” comunica o sentido, mas dilui a força colegiada de συμπρεσβύτερος.
    rationale: “Presbítero como eles” explicita de maneira concisa que o autor se identifica como pertencente ao mesmo grupo de presbíteros.
