id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: pt
  text: Do mesmo modo, vocês, homens mais jovens,[a] sujeitem-se aos presbíteros. E todos vocês revistam-se de humildade no trato uns com os outros,[b] porque “Deus se opõe aos orgulhosos, mas concede graça aos humildes”.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês que são mais jovens”. O grego está no masculino plural (“homens mais jovens”), embora alguns entendam a expressão de maneira mais geral, referindo-se aos membros mais jovens da comunidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “amarrem a humildade em vocês”. O verbo grego evoca vestir ou prender uma peça de roupa, intensificando a imagem de assumir deliberadamente a humildade.'
    reason: lexical_alternative
  - marker: c
    text: Citação ou alusão a Provérbios 3.34 na Septuaginta, a antiga tradução grega do Antigo Testamento.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Do mesmo modo
  rationale: Mantém a ligação desta exortação com as instruções anteriores em linguagem portuguesa natural.
- source_word: νεώτεροι
  choice: vocês, homens mais jovens
  rationale: Preserva o vocativo masculino plural e o contraste com os presbíteros, sem excluir em nota a possível compreensão mais geral baseada na idade.
- source_word: ὑποτάγητε
  choice: sujeitem-se
  rationale: Expressa adequadamente a forma imperativa e reflexiva do verbo no contexto de uma submissão voluntária.
- source_word: πρεσβυτέροις
  choice: aos presbíteros
  rationale: O contexto imediato de 5.1–4 favorece os presbíteros da comunidade, e não apenas homens de idade mais avançada.
- source_word: πάντες δὲ ἀλλήλοις
  choice: E todos vocês ... no trato uns com os outros
  rationale: Deixa claro que a exortação passa dos homens mais jovens para toda a comunidade e conserva sua dimensão recíproca.
- source_word: ταπεινοφροσύνην ἐγκομβώσασθε
  choice: revistam-se de humildade
  rationale: Comunica de modo natural a metáfora de vestir ou prender uma peça de roupa e a ideia de assumir deliberadamente uma atitude humilde.
- source_word: ὑπερηφάνοις
  choice: aos orgulhosos
  rationale: Traduz o adjetivo substantivado com clareza atual, preservando o contraste com os humildes.
- source_word: ἀντιτάσσεται
  choice: se opõe
  rationale: Mantém a força do verbo, que descreve Deus colocando-se contra os orgulhosos.
- source_word: δίδωσιν χάριν
  choice: concede graça
  rationale: Preserva a linguagem teológica da graça e usa um verbo português corrente e digno.
theological_decisions:
- issue: Referente de πρεσβυτέροις
  choice: os presbíteros da comunidade cristã
  alternative: os homens mais velhos em geral
  rationale: Os versículos 1–4 tratam explicitamente dos presbíteros, tornando esse referente o mais provável aqui.
- issue: Alcance de νεώτεροι
  choice: homens mais jovens
  alternative: os membros mais jovens da comunidade, sem especificação de gênero
  rationale: A forma grega é masculina plural e contrasta com πρεσβυτέροις. A nota preserva a leitura alternativa sem neutralizar silenciosamente a forma do texto.
- issue: Força metafórica de ἐγκομβώσασθε
  choice: conservar a imagem de vestir-se
  alternative: sejam humildes
  rationale: A tradução mantém a metáfora concreta e a ideia de adotar intencionalmente a humildade, em vez de reduzi-la a uma afirmação abstrata.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. “Presbíteros” conserva o termo eclesial exigido pelo contexto; “revistam-se” mantém a metáfora sem recorrer ao mais arcaico “cinjam-se”. A pontuação da citação destaca a base escriturística da exortação.
