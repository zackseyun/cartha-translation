  text: lançando sobre ele[b][c] toda a ansiedade[a] de vocês, porque ele se importa com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preocupação” ou “cuidado”; aqui, o sentido é especificamente preocupação ansiosa ou aflição.'
