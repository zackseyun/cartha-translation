lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: toda a ansiedade de vocês
  rationale: A expressão preserva a força abrangente de πᾶσαν e entende μέριμνα, neste contexto, como preocupação angustiante, não como cuidado neutro. “De vocês” comunica naturalmente o genitivo plural.
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: lançando sobre ele
  rationale: “Lançando” mantém a forma participial e a imagem de transferir um peso para alguém; “sobre ele” expressa o movimento indicado por ἐπί com acusativo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz de modo claro e natural a razão para a exortação.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: ele se importa com vocês
  rationale: A formulação comunica de maneira corrente e relacional que Deus tem interesse e cuidado reais por eles, sem restringir o sentido à provisão material.
theological_decisions:
- issue: Referente de αὐτόν/αὐτῷ
  choice: “ele” refere-se a Deus
  alternative: “ele” poderia ser entendido mais genericamente como o Senhor, suprido pelo contexto
  rationale: O contexto imediato do versículo 6, “a poderosa mão de Deus”, torna Deus o referente mais natural. O pronome foi mantido no texto para não explicitar mais do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O particípio inicial preserva a ligação sintática com a exortação do versículo anterior.
