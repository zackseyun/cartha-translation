  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: pt
  text: Portanto, quem rejeita[a] isso não rejeita um ser humano, mas Deus, que também dá a vocês o seu Espírito Santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desconsidera” ou “deixa de lado”. O verbo pode indicar rejeitar, desconsiderar ou pôr de lado uma instrução com autoridade.
    reason: lexical_alternative
  - marker: b
    text: A preposição grega é literalmente “para dentro de”. Com o verbo “dar”, “a vocês” é natural em português; também se pode entender que Deus põe o seu Espírito Santo em vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Portanto
  rationale: Expressa a conclusão inferida da exortação anterior de modo claro, natural e digno em português.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: quem rejeita ... rejeita
  rationale: O particípio articulado tem sentido genérico. “Quem rejeita” inclui qualquer pessoa e preserva a repetição enfática do verbo, cujo campo semântico também admite “desconsiderar” e “deixar de lado”.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: não rejeita um ser humano, mas Deus
  rationale: “Um ser humano” comunica o sentido genérico de ἄνθρωπον sem sugerir referência exclusiva ao sexo masculino e mantém o contraste direto com Deus.
- source_word: τὸν καὶ διδόντα
  choice: que também dá
  rationale: A oração relativa traduz naturalmente o particípio presente que caracteriza Deus; “também” representa καί e “dá” conserva o aspecto não limitado a uma única ocasião.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: o seu Espírito Santo
  rationale: A expressão paulina designa aqui o Espírito Santo pertencente a Deus; “seu” retoma Deus com naturalidade.
- source_word: εἰς ὑμᾶς
  choice: a vocês
  rationale: Com o verbo “dar”, “a vocês” é a formulação idiomática em português. A preposição εἰς pode sugerir literalmente movimento para dentro, possibilidade preservada em nota.
theological_decisions:
- issue: Referente de τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: O Espírito Santo dado por Deus aos destinatários
  alternative: Um espírito santo entendido como dom ou disposição impessoal
  rationale: A construção definida e possessiva, em seu contexto paulino, aponta naturalmente para o Espírito Santo, sem exigir acréscimo doutrinário ao texto.
- issue: Força genérica de ὁ ἀθετῶν
  choice: quem rejeita
  alternative: aquele que rejeita
  rationale: O masculino singular grego é representativo e não restringe a afirmação aos homens; “quem” preserva sua aplicação universal.
- issue: Sentido de εἰς ὑμᾶς
  choice: dá a vocês
  alternative: dá para dentro de vocês / põe em vocês
  rationale: A tradução principal conserva a relação de doador e destinatários em português natural, enquanto a nota registra a imagem espacial potencial da preposição sem decidir além do que a construção exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismos associados a “vós”; “um ser humano” conserva o referente genérico sem linguagem masculina exclusiva. A repetição de “rejeita” reproduz a ênfase do grego.
