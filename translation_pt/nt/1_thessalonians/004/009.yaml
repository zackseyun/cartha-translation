  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: pt
  text: Quanto ao amor fraternal[a], vocês não precisam que lhes escrevam[b], pois vocês mesmos são ensinados por Deus a amar uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “amor pelos irmãos e irmãs na fé”; o termo grego traduzido como “amor fraternal” emprega linguagem de família para falar da comunidade cristã.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “vocês não têm necessidade de que se lhes escreva”; o sujeito de “escrever” está implícito no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz um novo tópico com leve continuidade em relação ao contexto anterior; a construção é natural em português sem acrescentar um advérbio temporal inexistente no grego.
- source_word: φιλαδελφίας
  choice: amor fraternal
  rationale: Preserva a imagem de família e distingue este substantivo específico do verbo mais geral ἀγαπᾶν no fim do versículo.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: vocês não precisam que lhes escrevam
  rationale: A construção impessoal em português mantém o sujeito do infinitivo sem especificação, como no grego, e comunica com naturalidade que eles não necessitam de instrução por escrito.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: pois vocês mesmos
  rationale: Reproduz a ênfase dos pronomes gregos sem tornar a frase artificial.
- source_word: θεοδίδακτοί
  choice: ensinados por Deus
  rationale: Expressa claramente o sentido do adjetivo raro e conserva Deus como agente do ensino.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: a amar uns aos outros
  rationale: Representa de maneira natural a construção que indica finalidade ou resultado e conserva a reciprocidade explícita.
theological_decisions:
- issue: Distinção entre φιλαδελφία e ἀγαπᾶν no mesmo versículo
  choice: Traduzir φιλαδελφία como “amor fraternal” e ἀγαπᾶν como “amar”.
  alternative: Usar apenas formas de “amor” sem preservar a imagem familiar específica do primeiro termo.
  rationale: A escolha mantém a variação lexical de Paulo e o movimento do afeto familiar entre os fiéis para o ato recíproco de amar.
- issue: Sujeito implícito de γράφειν
  choice: Empregar a construção não especificada “que lhes escrevam”.
  alternative: Explicitar “que nós lhes escrevamos” ou “que alguém lhes escreva”.
  rationale: Embora Paulo e seus cooperadores sejam provavelmente os autores implícitos no contexto, o texto grego não expressa o sujeito; a formulação escolhida preserva essa abertura sem prejudicar a clareza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura natural no Brasil. “Amor fraternal” conserva a imagem familiar tradicional, enquanto a nota esclarece seu sentido inclusivo na comunidade de fé. A construção “que lhes escrevam” evita tanto a rigidez literal quanto a especificação indevida do sujeito.
