source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: pt
  text: Depois, nós, os que estivermos vivos, os que ainda restarmos, seremos arrebatados[a] juntamente com eles nas nuvens, ao encontro do Senhor no ar[b]. E assim estaremos para sempre com o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seremos tomados de repente”. O verbo grego destaca uma ação súbita e vigorosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para um encontro com o Senhor no ar”. A expressão pode indicar sair ao encontro de alguém, mas o próprio versículo não especifica a sequência mais ampla além desse encontro.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Marca a etapa seguinte à ressurreição mencionada no versículo anterior e conserva com naturalidade a progressão temporal.
- source_word: οἱ ζῶντες
  choice: os que estivermos vivos
  rationale: Identifica os fiéis que ainda estarão vivos naquele momento; o futuro do subjuntivo é a forma natural em português para essa referência futura.
- source_word: οἱ περιλειπόμενοι
  choice: os que ainda restarmos
  rationale: Preserva a ideia dos que permanecerem até aquele momento, sem afirmar por que ou de que perigo teriam sobrevivido.
- source_word: ἅμα σὺν αὐτοῖς
  choice: juntamente com eles
  rationale: Expressa tanto a simultaneidade quanto a união com os fiéis ressuscitados.
- source_word: ἁρπαγησόμεθα
  choice: seremos arrebatados
  rationale: Reproduz o futuro passivo e a ideia de uma ação súbita e vigorosa, sem acrescentar um esquema escatológico ao texto.
- source_word: ἐν νεφέλαις
  choice: nas nuvens
  rationale: Mantém a imagem concreta das nuvens e sua possível ressonância teofânica.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ao encontro do Senhor
  rationale: É uma expressão portuguesa idiomática que conserva o movimento dirigido ao encontro, sem definir o que acontece depois dele.
- source_word: εἰς ἀέρα
  choice: no ar
  rationale: Depois de «ao encontro», o português expressa naturalmente como localização aquilo que o grego formula com εἰς.
- source_word: καὶ οὕτως
  choice: E assim
  rationale: Indica que a comunhão permanente com o Senhor resulta da sequência descrita.
- source_word: πάντοτε
  choice: para sempre
  rationale: Neste contexto futuro, expressa de modo natural em português a permanência contínua indicada pelo advérbio.
- source_word: σὺν κυρίῳ ἐσόμεθα
  choice: estaremos para sempre com o Senhor
  rationale: Conserva a promessa futura e dá destaque à comunhão duradoura com o Senhor.
theological_decisions:
- issue: Sentido de ἁρπαγησόμεθα em um texto central aos debates sobre o chamado «arrebatamento»
  choice: seremos arrebatados
  alternative: seremos tomados de repente
  rationale: A formulação traduz diretamente a ação súbita e vigorosa do verbo, mas não determina a ocasião do acontecimento nem o encaixa em um sistema escatológico específico.
- issue: Alcance de εἰς ἀπάντησιν τοῦ κυρίου
  choice: ao encontro do Senhor
  alternative: para um encontro com o Senhor
  rationale: A tradução declara o encontro e seu movimento direcional, deixando em aberto o itinerário posterior e a sequência escatológica mais ampla, que o versículo não especifica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém as duas descrições paralelas dos fiéis vivos, evita terminologia técnica além do vocábulo bíblico corrente «arrebatados» e não pressupõe uma cronologia escatológica denominacional.
