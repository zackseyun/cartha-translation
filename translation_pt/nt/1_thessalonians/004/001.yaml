source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: pt
  text: Quanto ao mais, irmãos[a], pedimos e exortamos vocês, no Senhor Jesus, que, assim como receberam de nós instruções sobre como devem andar e agradar a Deus — como também andam —, progridam ainda mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o termo grego diz literalmente “irmãos” e pode ser usado para se dirigir a um grupo formado por homens e mulheres.
    reason: Alternativa lexical e esclarecimento do alcance inclusivo do masculino plural grego.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Por fim, então
  rationale: Marca a transição para a seção final de exortações e preserva tanto a força de λοιπὸν quanto a inferência de οὖν.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; no contexto, ela se dirige à comunidade inteira, o que é esclarecido em nota.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: pedimos e exortamos vocês
  rationale: 'Reproduz os dois aspectos da expressão: um pedido pastoral e uma exortação enfática. O pronome explícito favorece a clareza em português internacional com legibilidade brasileira.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  rationale: Preserva a preposição e o título cristológico κύριος, permitindo a ideia de esfera, união e autoridade sem restringi-la a uma única nuance.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: assim como receberam de nós instruções sobre como devem andar
  rationale: O acréscimo contextual de “instruções” torna natural em português o objeto substantivado τὸ πῶς, enquanto “andar” conserva a metáfora paulina para a conduta.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: e agradar a Deus
  rationale: Tradução direta e idiomática do infinitivo coordenado.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: e é assim que vocês já andam
  rationale: Reconhece a conduta presente dos destinatários. “Já” comunica naturalmente a força contextual de καί sem produzir a formulação artificial “também andam”.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: façam isso cada vez mais
  rationale: Em português, retoma naturalmente o modo de viver descrito e expressa o progresso além da prática atual. Evita o pouco idiomático “abundem mais” aplicado sem complemento à conduta.
theological_decisions:
- issue: Gênero da forma de tratamento ἀδελφοί
  choice: irmãos, com nota inclusiva
  alternative: irmãos e irmãs
  rationale: A forma gramatical masculina é preservada no texto, enquanto a nota esclarece que, nesse uso comunitário, ela pode abranger homens e mulheres.
- issue: Sentido de ἐν κυρίῳ Ἰησοῦ
  choice: no Senhor Jesus
  alternative: pela autoridade do Senhor Jesus
  rationale: A tradução formal preserva a amplitude da expressão grega, que pode envolver tanto a esfera da união com Cristo quanto a autoridade sob a qual se faz a exortação.
- issue: Metáfora ética de περιπατεῖν
  choice: andar
  alternative: viver / comportar-se
  rationale: A metáfora paulina é inteligível em contexto e preserva a imagem bíblica, sem excluir o sentido de viver ou conduzir-se.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A oração longa do grego foi pontuada com dois-pontos e travessões para tornar claras a instrução recebida, a prática já existente e a exortação ao progresso.
