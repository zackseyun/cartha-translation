- from: 'Por fim, então, irmãos[a], pedimos e exortamos vocês no Senhor Jesus: assim como receberam de nós instruções sobre como devem andar e agradar a Deus — e é assim que vocês já andam —, façam isso cada vez mais.'
  to: Quanto ao mais, irmãos[a], pedimos e exortamos vocês, no Senhor Jesus, que, assim como receberam de nós instruções sobre como devem andar e agradar a Deus — como também andam —, progridam ainda mais.
  rationale: A revisão torna a transição inicial idiomática, remove uma nuance temporal não expressa e restitui no desfecho a ideia de progresso crescente contida em περισσεύητε μᾶλλον, sem impor uma interpretação doutrinária. Mantêm-se a metáfora ética de «andar», o título «Senhor» e a nota inclusiva ancorada em «irmãos».
