id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: pt
  text: Pois, se cremos que Jesus morreu e ressuscitou, assim também Deus trará com ele os que adormeceram[a] por meio de Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os que morreram; neste contexto, Paulo usa «adormecer» como metáfora da morte dos que creem.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão também pode ser entendida como «os que adormeceram em Jesus» ou ligada à ação de Deus: «Deus, por meio de Jesus, trará...». O grego permite mais de uma compreensão da relação sintática.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Expressa a função explicativa/inferencial de γάρ e mantém a condição introduzida por εἰ, ligando o versículo ao argumento anterior.
- source_word: πιστεύομεν
  choice: cremos
  rationale: Forma natural e concisa para a convicção cristã compartilhada acerca da morte e da ressurreição de Jesus.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O pretérito perfeito traduz naturalmente o aoristo na síntese confessional.
- source_word: ἀνέστη
  choice: ressuscitou
  rationale: Traduz o aoristo intransitivo de modo natural em português, sem introduzir a forma passiva «foi ressuscitado».
- source_word: οὕτως καὶ
  choice: assim também
  rationale: Preserva a correlação entre a morte e ressurreição de Jesus e a ação futura de Deus em favor dos que morreram.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta do sujeito.
- source_word: τοὺς κοιμηθέντας
  choice: os que adormeceram
  rationale: Conserva a metáfora paulina do sono para a morte, importante no contexto de esperança na ressurreição.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: por meio de Jesus
  rationale: Representa o sentido usual de διά com genitivo como meio ou agência, sem ocultar a dificuldade de ligação sintática, registrada em nota.
- source_word: ἄξει
  choice: trará
  rationale: Traduz diretamente o futuro de ἄγω e se ajusta ao contexto da vinda de Jesus.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Mantém a ideia de companhia expressa por σύν e o pronome grego, cujo referente natural no contexto é Jesus.
theological_decisions:
- issue: Metáfora de κοιμηθέντας para a morte
  choice: Manter «os que adormeceram» no texto principal.
  alternative: «os que morreram»
  rationale: A metáfora é deliberada e pastoralmente significativa neste contexto. Mantê-la preserva a tensão entre a realidade da morte e a esperança da ressurreição.
- issue: Sentido e ligação sintática de διὰ τοῦ Ἰησοῦ
  choice: Traduzir «por meio de Jesus» junto de «os que adormeceram» e registrar a ambiguidade em nota.
  alternative: '«os que adormeceram em Jesus»; ou ligar a expressão ao verbo: «Deus, por meio de Jesus, trará...»'
  rationale: διά com genitivo pode indicar meio ou agência, mas a posição da expressão permite discussão sobre sua ligação a «adormeceram» ou a «trará». A nota evita resolver silenciosamente essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Cremos», «ressuscitou» e «trará» são formas correntes; a metáfora «adormeceram» é preservada por sua relevância literária e teológica. A ordem mantém o paralelismo e não explicita além do grego o destino ou o mecanismo da ação futura de Deus.
