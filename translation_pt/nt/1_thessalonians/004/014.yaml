  verdict: approve
  source_fidelity: O texto preserva adequadamente a estrutura condicional-explicativa de εἰ γὰρ, a confissão da morte e ressurreição de Jesus, a correlação οὕτως καί e a ação futura de Deus. «Os que adormeceram» conserva a metáfora de κοιμηθέντας, e «com ele» mantém sem explicitação indevida o pronome αὐτῷ, cujo referente contextual é Jesus. «Por meio de Jesus» é uma tradução defensável de διὰ τοῦ Ἰησοῦ, com a ambiguidade sintática devidamente sinalizada.
  naturalness: O português é moderno, claro e digno. «Pois, se cremos», «ressuscitou», «assim também» e «trará com ele» soam naturais e mantêm um registro bíblico acessível. A sequência «os que adormeceram por meio de Jesus» é deliberadamente próxima da ordem e da ambiguidade gregas; a nota torna explícita a dificuldade sem prejudicar a leitura.
  terminology: 'A terminologia é consistente e apropriada: «cremos», «ressuscitou», «Deus», «adormeceram» e «por meio de Jesus» são escolhas adequadas. A nota lexical explica a metáfora sem a substituir no corpo do texto, e a nota de leitura alternativa evita fixar uma interpretação denominacional de διὰ τοῦ Ἰησοῦ.'
