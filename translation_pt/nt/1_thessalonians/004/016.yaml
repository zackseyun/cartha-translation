id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: pt
  text: Pois o próprio Senhor descerá do céu com uma ordem[a], com a voz de um arcanjo e com a trombeta de Deus; e os mortos no Messias[b] ressuscitarão primeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um grito de comando”. O grego κέλευσμα pode indicar uma convocação ou um brado de ordem.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “em Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: No contexto, introduz a explicação da afirmação anterior; “Pois” expressa naturalmente essa função explicativa.
- source_word: αὐτὸς ὁ κύριος
  choice: o próprio Senhor
  rationale: Preserva a ênfase do pronome intensivo αὐτός sobre o sujeito.
- source_word: ἐν κελεύσματι
  choice: com uma ordem
  rationale: κέλευσμα designa uma ordem ou convocação, muitas vezes proferida em voz alta; a alternativa mais explícita fica na nota.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: com voz de arcanjo
  rationale: Reproduz de modo conciso φωνή e o genitivo anartro ἀρχαγγέλου, sem determinar qual arcanjo ou atribuir necessariamente a voz ao Senhor.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: com a trombeta de Deus
  rationale: Mantém a imagem de σάλπιγξ e a relação genitiva com Deus em português natural.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: descerá do céu
  rationale: Tradução direta e digna de καταβαίνω com ἀπό.
- source_word: οἱ νεκροὶ
  choice: os mortos
  rationale: O adjetivo substantivado é expresso pelo equivalente idiomático normal em português.
- source_word: ἐν Χριστῷ
  choice: no Messias
  rationale: Χριστός conserva aqui seu valor titular; “Messias” comunica o sentido de “Ungido”, enquanto a forma tradicional é registrada em nota.
- source_word: ἀναστήσονται
  choice: ressuscitarão
  rationale: O futuro médio de ἀνίστημι refere-se aqui claramente à ressurreição; “ressuscitarão” é direto e não introduz uma forma passiva.
- source_word: πρῶτον
  choice: primeiro
  rationale: Marca a sequência em relação aos crentes vivos mencionados no versículo seguinte.
theological_decisions:
- issue: Tradução de Χριστῷ na expressão ἐν Χριστῷ
  choice: no Messias
  alternative: em Cristo
  rationale: O termo funciona como título e “Messias” torna explícito seu sentido; a tradução tradicional “em Cristo” é mantida em nota para reconhecimento e consulta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação do grego foi preservada sem rigidez, e o ponto e vírgula esclarece a transição para a ressurreição dos mortos.
