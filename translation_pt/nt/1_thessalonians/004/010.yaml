id: 1TH.4.10
reference: 1 Thessalonians 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: pt
  text: Pois, de fato, vocês fazem isso para com todos os irmãos em toda a Macedônia. Mas nós os exortamos, irmãos[a], a crescer ainda mais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” se refere a companheiros de fé e provavelmente inclui tanto homens quanto mulheres nas igrejas.
    reason: Esclarece o alcance contextual provável do masculino plural grego ἀδελφοί.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, de fato
  rationale: Preserva a função explicativa de γάρ e a ênfase de καί, ligando a afirmação ao elogio anterior.
- source_word: ποιεῖτε αὐτὸ
  choice: é isso que vocês fazem
  rationale: Expressa a prática contínua indicada pelo presente e mantém a referência retrospectiva de αὐτό ao amor fraternal.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: para com todos os irmãos
  rationale: “Para com” comunica naturalmente a direção relacional da ação expressa por εἰς.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: em toda a Macedônia
  rationale: Identifica de modo claro a extensão geográfica, sem acrescentar ao texto.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Mas nós os exortamos
  rationale: παρακαλέω tem aqui força de apelo ou exortação, enquanto δέ marca uma transição suave após o elogio.
- source_word: περισσεύειν μᾶλλον
  choice: a progredir ainda mais
  rationale: Comunica crescimento além da prática já reconhecida; em português, “progredir” soa natural neste contexto, embora atenue levemente a imagem literal de abundância.
theological_decisions:
- issue: Abrangência de ἀδελφοὺς / ἀδελφοί numa comunidade cristã de ambos os sexos
  choice: irmãos
  alternative: irmãos e irmãs; irmãos na fé
  rationale: Mantém no texto principal a forma masculina plural do grego, ao passo que a nota esclarece seu provável alcance representativo, incluindo homens e mulheres, sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém o elogio seguido da exortação e preserva a vírgula final porque o versículo continua no contexto imediato.
