lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz naturalmente a conclusão decorrente do ensino anterior sobre a vinda do Senhor e a ressurreição dos que morreram em Cristo.
- source_word: παρακαλεῖτε
  choice: encorajem
  rationale: O verbo pode expressar encorajamento, consolo ou exortação. Neste contexto de esperança e reencontro futuro, “encorajem” preserva sua amplitude pastoral, incluindo a ideia de consolar.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Expressa com clareza e naturalidade a reciprocidade ordenada pelo texto.
- source_word: ἐν
  choice: com
  rationale: Em português, “encorajar com estas palavras” comunica naturalmente o meio ou conteúdo do encorajamento.
- source_word: τοῖς λόγοις τούτοις
  choice: estas palavras
  rationale: Retoma de modo direto as afirmações imediatamente anteriores de Paulo, sem diluí-las em uma expressão mais vaga.
