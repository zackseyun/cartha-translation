source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: pt
  text: 'Pois esta é a vontade de Deus: a santificação de vocês[a] — que vocês se abstenham da imoralidade sexual[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a santidade de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Grego porneía, termo amplo para conduta sexual ilícita. Tradicionalmente, “fornicação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: vontade
  rationale: “Vontade” é a forma mais natural de expressar aqui a intenção desejada e autorizada de Deus, sem enfraquecê-la como mero desejo nem restringi-la à ideia de propósito decretado.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: a santificação de vocês
  rationale: “Santificação” preserva a amplitude de ἁγιασμός, que pode envolver tanto a condição de santidade quanto a vida consagrada. A construção “de vocês” é clara e natural no português brasileiro contemporâneo.
- source_word: ἀπέχεσθαι
  choice: que se abstenham
  rationale: O infinitivo explica concretamente o conteúdo da santificação. A oração com “que” comunica essa relação de modo natural em português.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: πορνεία é um termo amplo para conduta sexual ilícita. “Imoralidade sexual” mantém essa abrangência e evita a limitação e o tom antiquado que “fornicação” pode ter hoje.
- source_word: γάρ
  choice: Pois
  rationale: “Pois” preserva a ligação explicativa com a exortação anterior e introduz naturalmente a razão apresentada no versículo.
theological_decisions:
- issue: Sentido de ἁγιασμός na exortação ética
  choice: “Santificação”, cujo conteúdo ético é explicitado pela oração seguinte.
  alternative: “Santidade”, com ênfase maior no estado ou qualidade resultante.
  rationale: A tradução mantém a amplitude teológica do termo de Paulo sem decidir entre uma santificação exclusivamente posicional ou exclusivamente progressiva; neste contexto, ela se manifesta concretamente na conduta sexual.
- issue: Abrangência de πορνεία
  choice: “Imoralidade sexual”, em sentido amplo.
  alternative: “Fornicação”.
  rationale: O termo grego não se limita de forma inequívoca a uma única categoria de comportamento sexual ilícito. A escolha evita impor ao texto uma definição mais estreita.
translation_notes:
  register: Português moderno, digno e de leitura clara, com formulação natural para leitores brasileiros e inteligível internacionalmente. O travessão explicita a relação entre “santificação” e a oração seguinte sem eliminar a ambiguidade semântica do substantivo grego.
