id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: pt
  text: 'Pois isto lhes dizemos por palavra do Senhor[a]: nós, os que estivermos vivos, os que permanecermos até a vinda do Senhor[b], de modo nenhum precederemos os que adormeceram[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pela palavra do Senhor». O grego pode indicar tanto uma palavra procedente do Senhor Jesus quanto uma revelação comunicada com a autoridade dele.
    reason: alternative_reading
  - marker: b
    text: Ou «chegada» ou «presença» (grego παρουσία).
    reason: lexical_alternative
  - marker: c
    text: «Os que adormeceram» é uma metáfora para os fiéis que morreram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: por uma palavra do Senhor
  rationale: Preserva a ideia de que a declaração se apoia numa palavra dotada da autoridade do Senhor, sem decidir se Paulo cita uma palavra de Jesus já conhecida ou uma revelação recebida do Senhor.
- source_word: οἱ ζῶντες
  choice: os que estivermos vivos
  rationale: Expressa naturalmente em português a condição dos que ainda estarão vivos no momento mencionado, mantendo a inclusão de Paulo no grupo por meio de «nós».
- source_word: οἱ περιλειπόμενοι
  choice: os que permanecermos
  rationale: Traduz o sentido de continuar presente ou restar até o tempo indicado, sem introduzir a ideia mais interpretativa de sobreviver a uma calamidade.
- source_word: παρουσίαν
  choice: vinda
  rationale: No contexto escatológico, designa a futura chegada e presença do Senhor. «Vinda» é a forma mais clara e corrente em português, embora «presença» e «chegada» também pertençam ao campo semântico do termo.
- source_word: οὐ μὴ φθάσωμεν
  choice: de modo nenhum precederemos
  rationale: A forte negação οὐ μή exclui enfaticamente a possibilidade, e φθάνω significa aqui chegar ou ir antes de alguém. A formulação conserva tanto o sentido quanto a ênfase.
- source_word: τοὺς κοιμηθέντας
  choice: os que adormeceram
  rationale: Mantém a metáfora do sono empregada para os fiéis que morreram, preservando a linguagem do texto e sua relação com a esperança da ressurreição.
- source_word: κύριος / κυρίου
  choice: Senhor
  rationale: É a correspondência portuguesa estabelecida e adequada para κύριος; neste contexto, o título se refere a Jesus.
theological_decisions:
- issue: Natureza da «palavra do Senhor» invocada por Paulo
  choice: Formulação que afirma a autoridade do Senhor sem especificar o modo de transmissão
  alternative: Entender a expressão exclusivamente como citação de uma palavra histórica de Jesus ou exclusivamente como revelação profética recebida por Paulo
  rationale: A expressão grega ἐν λόγῳ κυρίου não determina por si só qual dessas formas de transmissão está em vista; a tradução conserva essa ambiguidade legítima.
- issue: Sentido de «os que adormeceram»
  choice: Manter a metáfora do sono para os fiéis falecidos
  alternative: Traduzir diretamente como «os mortos»
  rationale: A metáfora pertence à formulação de Paulo e evoca a morte sob a perspectiva da futura ressurreição, sem negar a realidade da morte física.
- issue: Inclusão de Paulo entre os que estiverem vivos na vinda do Senhor
  choice: Preservar o «nós» do texto sem afirmar que Paulo certamente permaneceria vivo até então
  alternative: Reformular em terceira pessoa ou apresentar a sobrevivência de Paulo até a vinda como certeza
  rationale: O texto inclui Paulo retoricamente entre «nós, os que estivermos vivos», mas o particípio e o contexto não exigem transformar essa inclusão numa previsão biográfica categórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «lhes» em vez de uma construção regional com «vocês» e conserva a repetição estrutural dos dois grupos participiais sem tornar a frase excessivamente rígida.
