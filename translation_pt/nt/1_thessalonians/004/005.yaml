  terminology: «Gentios» é apropriado para τὰ ἔθνη neste contexto paulino. «Desejo» evita estreitar ἐπιθυμία a cobiça ou impor uma única paráfrase interpretativa, enquanto o contexto imediato informa sua conotação sexual. «Deus» sem preposição é objeto direto natural e direto em português contemporâneo.
