lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: não dominado pela paixão do desejo
  rationale: A expressão continua a orientação do versículo anterior e descreve a maneira de agir. «Paixão do desejo» conserva os dois substantivos gregos; «dominado por» comunica em português natural a ideia de agir na esfera ou sob o poder dessa paixão, sem limitar ἐπιθυμία ao sentido neutro de desejo.
- source_word: καθάπερ καὶ
  choice: como também
  rationale: Mantém a força comparativa e o καί do texto grego em uma formulação portuguesa fluente.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: No uso paulino, refere-se normalmente aos povos não judeus. «Gentios» preserva essa categoria étnico-religiosa sem acrescentar a carga interpretativa de «pagãos».
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: que não conhecem a Deus
  rationale: O particípio atributivo descreve uma condição contínua. «Conhecer a Deus» reproduz de modo claro a construção grega e seu sentido relacional e religioso.
theological_decisions:
- issue: Sentido de τὰ ἔθνη no contraste moral e religioso
  choice: os gentios
  alternative: as nações; os pagãos
  rationale: «Gentios» é o equivalente paulino mais preciso e não transforma automaticamente todos os não judeus em uma categoria moral pejorativa. A nota preserva as alternativas lexical e interpretativa.
- issue: Força de πάθει ἐπιθυμίας
  choice: paixão do desejo
  alternative: paixão cheia de desejo; desejo ardente; paixão da cobiça
  rationale: A construção conserva a relação entre os dois substantivos e a intensidade negativa sugerida pelo contexto sexual, mas evita resolver em excesso se ἐπιθυμία deve ser entendida especificamente como luxúria, cobiça ou desejo desordenado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação foi mantida como continuação sintática de 4:4; por isso, conserva a vírgula final. «Não dominado por» torna natural em português a força modal de ἐν sem apagar a imagem de esfera ou influência. Todos os marcadores de nota aparecem no texto.
