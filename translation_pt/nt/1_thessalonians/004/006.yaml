source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: pt
  text: que ninguém ultrapasse os limites nem explore seu irmão[b] nessa questão[a], porque o Senhor é vingador de todas essas coisas, como já lhes dissemos e os advertimos solenemente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nesse assunto”. O grego também permite entender “defraude seu irmão nessa questão”. No contexto, a advertência provavelmente diz respeito à conduta sexual, embora as palavras em si possam ter aplicação mais ampla.'
    reason: lexical_alternative
  - marker: b
    text: “Seu irmão” traduz uma expressão grega no masculino singular. Provavelmente se refere a um irmão na fé, embora o princípio ético também possa aplicar-se mais amplamente à comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: que ninguém ultrapasse os limites
  rationale: O infinitivo articulado dá continuidade à exortação do versículo anterior. A expressão preserva a imagem de transpor um limite moral e explicita de modo natural o valor genérico da construção.
- source_word: πλεονεκτεῖν
  choice: explore
  rationale: O verbo indica obter vantagem indevida à custa de outra pessoa. “Explore” mantém o sentido moral amplo sem restringi-lo a fraude financeira.
- source_word: ἐν τῷ πράγματι
  choice: nessa questão
  rationale: A formulação permanece deliberadamente geral, mas remete naturalmente ao assunto tratado nos versículos anteriores, isto é, à conduta sexual e à santidade.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Reproduz o masculino singular do grego e, no contexto comunitário, provavelmente designa um irmão na fé.
- source_word: ἔκδικος κύριος
  choice: o Senhor é vingador
  rationale: 'Preserva de forma concisa a força judicial de ἔκδικος: o Senhor exige reparação e pune o mal praticado.'
- source_word: περὶ πάντων τούτων
  choice: de todas essas coisas
  rationale: Mantém amplo o alcance da expressão, abrangendo os pecados e abusos que estão sendo tratados.
- source_word: προείπαμεν
  choice: já lhes dissemos
  rationale: Comunica naturalmente que essa instrução havia sido dada antes, sem antecipar a intensidade do verbo seguinte.
- source_word: διεμαρτυράμεθα
  choice: os advertimos solenemente
  rationale: Expressa o caráter enfático e solene da advertência apostólica.
theological_decisions:
- issue: Referente de “nessa questão” e natureza da transgressão
  choice: A advertência continua a instrução sobre ética sexual dos versículos 3–5.
  alternative: A frase pode ser entendida como referência geral a fraude comercial ou abuso interpessoal.
  rationale: O contexto imediato trata de santificação, imoralidade sexual e domínio do próprio corpo. Como πλεονεκτεῖν também pode indicar fraude em sentido mais amplo, o texto principal usa “explore” e a nota registra a alternativa.
- issue: Tradução de ἀδελφός
  choice: seu irmão
  alternative: seu irmão ou sua irmã; outro crente
  rationale: O grego está no masculino singular. A tradução conserva essa forma, enquanto a nota esclarece o provável sentido comunitário e a aplicação mais ampla do princípio.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” é a tradução lexical e teologicamente estabelecida neste contexto de juízo exercido pelo Senhor ressuscitado.
- issue: Força de ἔκδικος
  choice: vingador
  alternative: aquele que faz justiça; aquele que pune
  rationale: “Vingador” conserva a ideia de retribuição judicial sem reduzir a expressão à simples aplicação impessoal de uma pena.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla compreensão no Brasil e em outros contextos lusófonos. “Ultrapasse os limites” conserva a metáfora moral; “explore” evita restringir o texto a fraude financeira. A ordem dos marcadores foi ajustada para que cada nota apareça junto à expressão que explica.
