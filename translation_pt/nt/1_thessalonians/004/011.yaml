  source_fidelity: 'A sequência de infinitivos, o sentido de ἡσυχάζειν como modo de vida tranquilo, πράσσειν τὰ ἴδια como ocupar-se dos próprios assuntos, o trabalho manual e a força de παρηγγείλαμεν estão bem refletidos. Contudo, «empenhar-se por viver» não expressa com precisão a construção φιλοτιμεῖσθαι + infinitivo: em português, «empenhar-se por» tende a significar advogar em favor de algo, não esforçar-se para fazer algo.'
  naturalness: O texto é claro e de registro apropriado. «Empenharem-se em viver tranquilamente» é a regência natural e torna explícita a relação entre a ambição/esforço e o infinitivo seguinte. «Suas próprias mãos» preserva de modo mais explícito o possessivo ὑμῶν.
  terminology: «Ordenamos» reproduz adequadamente o tom autoritativo de παρηγγείλαμεν sem impor interpretação doutrinária. «Assuntos» e «trabalharem» são escolhas modernas e amplamente compreensíveis.
