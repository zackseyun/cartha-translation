  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: pt
  text: e a se empenharem em viver tranquilamente[a], a cuidarem dos seus próprios assuntos[b] e a trabalharem com as suas próprias mãos, assim como lhes ordenamos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fazerem de viver tranquilamente a sua ambição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tratarem dos seus próprios negócios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: se empenharem
  rationale: O verbo expressa tomar algo como questão de honra ou ambição e, por isso, esforçar-se por alcançá-lo. “Empenhar-se” é natural em português e preserva a ideia de esforço intencional; a nuance mais literal de ambição aparece na nota.
- source_word: ἡσυχάζειν
  choice: viver tranquilamente
  rationale: Neste contexto de exortação, refere-se a levar uma vida sossegada e ordeira, não simplesmente a permanecer em silêncio.
- source_word: πράσσειν τὰ ἴδια
  choice: cuidarem dos seus próprios assuntos
  rationale: A expressão idiomática indica ocupar-se do que é de sua responsabilidade. Esta formulação evita o tom ríspido que “cuidar da própria vida” pode ter no uso moderno.
- source_word: ἐργάζεσθαι
  choice: trabalharem
  rationale: Reproduz de modo direto e natural o sentido amplo de trabalhar ou labutar.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: com as próprias mãos
  rationale: O dativo tem valor instrumental, e “próprias” conserva a ênfase do possessivo grego no trabalho pessoal.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz naturalmente a correspondência com a instrução apostólica anterior e mantém sua leve ênfase.
- source_word: παρηγγείλαμεν
  choice: ordenamos
  rationale: O verbo denota instrução investida de autoridade; “ordenamos” preserva a força da exortação apostólica.
theological_decisions:
- issue: Força ética da instrução apostólica
  choice: ordenamos
  alternative: instruímos
  rationale: A formulação mantém a autoridade real da orientação moral de Paulo sem acrescentar uma qualificação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de infinitivos com “a” conserva a ligação sintática com o contexto anterior, e a vírgula final sinaliza que a frase continua no versículo seguinte.
