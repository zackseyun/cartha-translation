    rationale: A preposição «por» altera ou enfraquece a ligação semântica de φιλοτιμεῖσθαι com ἡσυχάζειν. «Empenharem-se em viver tranquilamente» comunica diretamente o esforço/aspiração de viver de modo tranquilo.
  - severity: low
    issue: Nota a formula a alternativa de modo algo impreciso
    rationale: «Fazerem da vida tranquila a sua ambição» é compreensível, mas o grego tem como complemento o ato de viver/estar tranquilo. «Fazerem de viver tranquilamente a sua ambição» mantém melhor essa estrutura.
  - severity: low
    issue: Possessivo em «com as próprias mãos»
    rationale: A formulação é idiomática, mas «com as suas próprias mãos» torna visível o ὑμῶν («suas») presente no texto-fonte.
