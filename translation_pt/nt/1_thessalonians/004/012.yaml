  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: pt
  text: para que vocês vivam de maneira respeitável para com os de fora e não tenham necessidade de nada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não tenham necessidade de ninguém». A expressão pode enfatizar não depender dos outros.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado das exortações anteriores e preserva naturalmente a força final em português.
- source_word: περιπατῆτε
  choice: vocês vivam
  rationale: Embora o sentido literal seja «andem», aqui o verbo é uma metáfora paulina para a maneira de viver. «Vivam» comunica essa ideia com clareza no português atual.
- source_word: εὐσχημόνως
  choice: de maneira respeitável
  rationale: Expressa uma conduta apropriada e socialmente digna. A formulação evita tanto a possível estreiteza de «decentemente» quanto uma intensificação moral indevida.
- source_word: πρὸς τοὺς ἔξω
  choice: diante dos de fora
  rationale: Preserva a expressão comunitária «os de fora» e comunica a dimensão pública da conduta perante quem não pertence à comunidade cristã.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: não tenham necessidade de nada
  rationale: Reproduz de perto a construção grega e seu sentido mais natural de não carecer de coisa alguma, sem restringir a referência apenas a pessoas.
theological_decisions:
- issue: Sentido da oração final μηδενὸς χρείαν ἔχητε
  choice: «não tenham necessidade de nada», indicando ausência de carência ou dependência material
  alternative: «não dependam de ninguém» ou «não tenham necessidade de ninguém»
  rationale: No contexto do trabalho manual e da vida responsável, a independência econômica está em vista. Contudo, a construção grega admite que a ênfase recaia especificamente sobre não depender de outras pessoas; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» torna explícita a segunda pessoa do plural; «os de fora» preserva a formulação do texto sem substituí-la por um rótulo teológico mais específico.
