  source_fidelity: A primeira oração traduz adequadamente οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ. Na segunda, όμως, «para vivermos em santidade» torna explícita uma aplicação ética plausível, mas introduz o verbo «vivermos» e transforma a construção ἐν ἁγιασμῷ em uma finalidade infinitiva. Uma formulação mais direta preserva a oposição e a preposição da fonte.
  naturalness: «Pois Deus não nos chamou para a impureza, mas em santidade» é conciso, claro e mantém um registro bíblico moderno. Embora a elipse após «mas» seja mais formal, é natural e evita acrescentar conteúdo verbal não expresso.
  terminology: «Impureza» e «santidade» são equivalentes adequados de ἀκαθαρσία e ἁγιασμός neste contexto. A nota sobre «santificação» preserva corretamente a alternativa lexical sem impor uma leitura doutrinária.
