  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: pt
  text: Pois Deus não nos chamou para a impureza[a], mas em santidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impureza moral”. Neste contexto, o termo grego se refere especialmente à impureza sexual.
    reason: lexical_alternative
  - marker: b
    text: Ou “em santificação”. O termo grego pode indicar tanto a santidade como condição ou modo de vida quanto a santificação como processo de tornar-se santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e mantém clara a ligação argumentativa.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito. “Chamou” preserva a linguagem bíblica do chamado divino sem definir tecnicamente sua natureza.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: para a impureza
  rationale: Neste contexto, ἐπί com dativo indica finalidade ou orientação. “Impureza” comunica de modo atual a impureza moral, especialmente sexual, sugerida pelo contexto imediato.
- source_word: ἐν ἁγιασμῷ
  choice: para vivermos em santidade
  rationale: A formulação portuguesa torna natural o contraste entre a finalidade negada e a esfera positiva do chamado, preservando “em” para representar ἐν. “Santidade” expressa o estado ou modo de vida santo, sem excluir a ideia de santificação.
theological_decisions:
- issue: Natureza do chamado de Deus
  choice: Um chamado divino real que fundamenta a vida ética dos fiéis, sem especificar seu mecanismo em termos dogmáticos posteriores.
  alternative: Um convite geral ou, em sentido técnico, um chamado eficaz.
  rationale: O versículo relaciona inequivocamente o chamado de Deus à vida santa, mas não define aqui a mecânica desse chamado. Por isso, mantém-se o verbo “chamou” sem acréscimos interpretativos.
- issue: Sentido de ἁγιασμός
  choice: “Santidade”, entendida como esfera ou modo de vida correspondente ao chamado de Deus.
  alternative: “Santificação”, com possível ênfase no processo de ser tornado santo.
  rationale: O contraste imediato com ἀκαθαρσία favorece a santidade vivida, mas o substantivo grego também pode designar santificação; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “para vivermos em santidade” evita a construção pouco natural “chamou-nos... em santidade”, explicita apenas o sentido de vida ética já presente no contexto e conserva a preposição “em” diante de “santidade”.
