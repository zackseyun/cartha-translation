  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: pt
  text: Mas não queremos que vocês fiquem sem saber, irmãos[a], a respeito dos que dormem[b], para que não se entristeçam como os demais, que não têm esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” é uma forma de tratamento da congregação e provavelmente inclui tanto homens quanto mulheres.
    reason: cultural_note
  - marker: b
    text: Ou “dos que adormeceram”; aqui Paulo usa o sono como metáfora para os que morreram.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: Mas não queremos
  rationale: δέ marca uma transição levemente adversativa ou conectiva; “Mas” é natural em português e não exagera o contraste. A construção θέλομεν + infinitivo é vertida idiomaticamente por “queremos que” + subjuntivo.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: que vocês fiquem sem saber
  rationale: ἀγνοεῖν significa não saber ou não estar informado. “Fiquem sem saber” comunica isso em linguagem corrente e evita o tom depreciativo que “sejam ignorantes” pode ter hoje.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O substantivo grego está no masculino plural e funciona aqui como forma de tratamento da congregação. “Irmãos” preserva a forma do texto, enquanto a nota esclarece que o grupo provavelmente incluía homens e mulheres.
- source_word: περὶ τῶν κοιμωμένων
  choice: a respeito dos que dormem
  rationale: O particípio presente κοιμωμένων significa literalmente “os que dormem” e, neste contexto, usa o sono como metáfora para os mortos. A formulação conserva tanto a metáfora quanto o aspecto verbal, sem substituí-la diretamente por uma interpretação.
- source_word: ἵνα μὴ λυπῆσθε
  choice: para que não se entristeçam
  rationale: ἵνα com o subjuntivo expressa propósito ou resultado. A tradução conserva o propósito pastoral sem sugerir que toda tristeza seja absolutamente proibida.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: como os demais
  rationale: οἱ λοιποί designa os outros, em contraste com a comunidade destinatária. “Os demais” é conciso, digno e natural em português.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: que não têm esperança
  rationale: Tradução direta e idiomática da expressão participial, preservando o contraste escatológico estabelecido por Paulo.
theological_decisions:
- issue: Sentido de κοιμωμένων no contexto escatológico
  choice: Conservar no texto principal a metáfora “os que dormem”.
  alternative: “os que morreram” ou “os que adormeceram”
  rationale: Paulo emprega deliberadamente a imagem do sono para pessoas falecidas no contexto da esperança da ressurreição. Manter a metáfora preserva a textura teológica e a ambiguidade figurada do original; a nota esclarece o referente.
- issue: Abrangência de ἀδελφοί
  choice: Traduzir por “irmãos” e esclarecer em nota a provável inclusão de homens e mulheres.
  alternative: “irmãos e irmãs” ou “membros da família da fé”
  rationale: “Irmãos” corresponde à forma masculina plural do grego e à forma tradicional e ainda inteligível de tratamento coletivo em português. A nota evita que leitores entendam a palavra como dirigida exclusivamente aos homens.
- issue: Natureza da tristeza cristã
  choice: Traduzir ἵνα μὴ λυπῆσθε sem acrescentar uma qualificação interpretativa no texto.
  alternative: “para que vocês não se entristeçam do mesmo modo”
  rationale: A comparação subsequente indica que a tristeza sem esperança é o foco, mas o original liga diretamente a negação ao verbo “entristecer-se”. A tradução mantém essa tensão, em vez de inserir uma explicação no texto principal.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O tratamento por “vocês” evita regionalismo excessivo; “a respeito de” e “os demais” mantêm um tom digno sem arcaísmo. A metáfora do sono e a forma de tratamento “irmãos” foram preservadas e esclarecidas por notas.
