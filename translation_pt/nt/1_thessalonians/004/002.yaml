  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: pt
  text: Pois vocês sabem que instruções lhes demos por meio do Senhor Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela autoridade do Senhor Jesus”.'
    reason: Leitura alternativa legítima de διά com genitivo neste contexto.
lexical_decisions:
- source_word: οἴδατε
  choice: vocês sabem
  rationale: O perfeito οἶδα tem sentido presente no grego koiné; “vocês sabem” é a forma natural e clara em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a conexão discursiva.
- source_word: τίνας παραγγελίας
  choice: quais instruções
  rationale: τίνας determina o substantivo plural παραγγελίας; “quais instruções” conserva o número e expressa de modo natural a referência a orientações de caráter autorizado.
- source_word: ἐδώκαμεν ὑμῖν
  choice: lhes demos
  rationale: Reproduz de maneira idiomática o aoristo de δίδωμι e o objeto indireto plural ὑμῖν.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: por meio do Senhor Jesus
  rationale: διά com genitivo pode indicar mediação ou agência. “Por meio de” mantém essa formulação sem restringi-la apenas à ideia de autoridade.
- source_word: κυρίου
  choice: Senhor
  rationale: Equivalente tradicional, claro e adequado para κύριος neste título cristológico.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Emprega a forma portuguesa convencional do nome próprio.
theological_decisions:
- issue: Sentido de διὰ τοῦ κυρίου Ἰησοῦ
  choice: por meio do Senhor Jesus
  alternative: pela autoridade do Senhor Jesus
  rationale: A construção pode destacar mediação ou agência e, no contexto, também pode implicar autoridade. O texto principal preserva a expressão grega mais diretamente, enquanto a nota registra a interpretação legítima centrada na autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural e colocação pronominal natural em “lhes demos”. “Instruções” preserva tanto a legibilidade quanto o caráter diretivo de παραγγελίας.
