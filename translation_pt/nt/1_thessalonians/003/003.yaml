  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: pt
  text: para que ninguém fique abalado por essas aflições[a]. Pois vocês mesmos sabem que estamos destinados a isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fique perturbado” ou “fique desestabilizado”. O verbo grego é raro e, em outros contextos, também pode ter o sentido de “ser enganado” ou “ser conquistado por lisonjas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estamos designados para isso” ou “estamos postos para isso”.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: para que ninguém fique abalado
  rationale: O infinitivo articular ligado ao versículo anterior expressa propósito ou resultado. O raro verbo σαίνεσθαι, neste contexto, indica ser perturbado ou desestabilizado pelas aflições; “fique abalado” é natural, claro e preserva a imagem.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: por essas aflições
  rationale: Embora ἐν possa ser traduzido formalmente por “em”, com “ficar abalado” o português idiomático favorece “por”, apresentando as aflições como causa ou circunstância. “Aflições” conserva o peso de θλίψεις no uso paulino.
- source_word: αὐτοὶ γὰρ οἴδατε
  choice: Pois vocês mesmos sabem
  rationale: '“Vocês mesmos” mantém a ênfase de αὐτοί, γάρ introduz a explicação, e οἴδατε tem sentido presente: “sabem”.'
- source_word: εἰς τοῦτο κείμεθα
  choice: fomos destinados a isso
  rationale: κεῖμαι significa literalmente estar posto ou colocado e, nesta construção, comunica que algo foi estabelecido como destino ou condição. O perfeito passivo idiomático “fomos destinados” soa natural em português e “a isso” remete às aflições mencionadas.
theological_decisions:
- issue: Relação dos cristãos com o sofrimento em εἰς τοῦτο κείμεθα
  choice: fomos destinados a isso
  alternative: estamos designados para isso; estamos sujeitos a isso
  rationale: A formulação preserva a afirmação de que as aflições fazem parte da condição esperada dos seguidores de Cristo, sem definir o agente nem impor uma doutrina pormenorizada de predestinação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” traduz o plural de modo natural; “aflições” mantém o tom sério sem arcaísmo excessivo. As notas preservam a incerteza lexical de σαίνεσθαι e a amplitude de κεῖμαι.
