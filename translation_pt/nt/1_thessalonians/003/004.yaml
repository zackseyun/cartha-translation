    rationale: O grego diz simplesmente «quando estávamos com vocês»; καί em καὶ γάρ tem valor aditivo/enfático na conjunção, não introduz a noção temporal de «ainda». «Mesmo quando» reproduz melhor a ênfase sem acrescentar uma delimitação temporal.
