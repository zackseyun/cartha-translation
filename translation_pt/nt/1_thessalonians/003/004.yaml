source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: pt
  text: Pois, mesmo quando estávamos com vocês, nós lhes dizíamos repetidamente, de antemão, que íamos sofrer aflições[a], como também aconteceu, e vocês o sabem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seríamos afligidos» ou «sofreríamos tribulação». O verbo grego pode indicar experimentar pressão, angústia, sofrimento ou perseguição.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação do versículo anterior de modo natural em português; a ênfase de καί é suficientemente comunicada pelo contexto e por «quando ainda».
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: quando ainda estávamos com vocês
  rationale: Expressa de modo idiomático a presença de Paulo e seus companheiros entre os tessalonicenses; «ainda» ajuda a reproduzir a leve ênfase de καί.
- source_word: προελέγομεν ὑμῖν
  choice: já lhes dizíamos repetidamente
  rationale: «Já» transmite a ideia de falar de antemão, e «dizíamos repetidamente» preserva o aspecto durativo ou iterativo do imperfeito sem transformar o verbo em «advertir».
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: que passaríamos por aflições
  rationale: O futuro do pretérito expressa naturalmente a expectativa futura vista a partir daquele período; «passar por aflições» mantém o sentido amplo de pressão, sofrimento ou perseguição.
- source_word: καθὼς καὶ ἐγένετο
  choice: E foi exatamente isso que aconteceu
  rationale: Comunica a correspondência enfática entre o anúncio anterior e seu cumprimento; «exatamente» representa com naturalidade a força conjunta de καθώς καί.
- source_word: καὶ οἴδατε
  choice: como vocês sabem
  rationale: Torna explícita a relação com o acontecimento mencionado e produz uma conclusão corrente em português, embora formalmente transforme a coordenação grega em uma expressão parentética.
theological_decisions:
- issue: Natureza do sofrimento indicado por θλίβεσθαι
  choice: aflições em sentido geral, possivelmente incluindo perseguição
  alternative: perseguição especificamente ou «tribulação» em sentido técnico ou escatológico
  rationale: O contexto inclui oposição e sofrimento, mas o verbo grego não exige restringir a referência à perseguição nem atribuir-lhe aqui um sentido escatológico técnico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» e «lhes» de modo natural. A redação conserva a repetição implícita no imperfeito grego e evita que «tribulação» seja entendida obrigatoriamente como termo escatológico técnico.
