id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: pt
  text: Pois que agradecimento podemos retribuir a Deus por vocês,[a] por toda a alegria com que nos alegramos por causa de vocês diante do nosso Deus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Como poderíamos agradecer suficientemente a Deus por vocês...?” O grego diz mais literalmente: “Que agradecimento podemos retribuir a Deus por vocês...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: que ações de graças
  rationale: Mantém a forma interrogativa e o substantivo grego, transmitindo a insuficiência sentida por Paulo sem substituir de imediato a imagem por uma paráfrase.
- source_word: δυνάμεθα
  choice: podemos
  rationale: Equivalente natural do presente grego e adequado à força retórica da pergunta.
- source_word: ἀνταποδοῦναι
  choice: retribuir
  rationale: Preserva a ideia de dar em retorno. Em português, “retribuir ações de graças a Deus” conserva a metáfora sem sugerir tão fortemente uma dívida financeira quanto “pagar”.
- source_word: περὶ ὑμῶν
  choice: por vocês
  rationale: Neste contexto de ações de graças, é a formulação portuguesa mais natural; a nota registra uma opção mais formal que distingue esta expressão de δι’ ὑμᾶς.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: por toda a alegria
  rationale: Expressa a base ou ocasião das ações de graças e preserva a repetição enfática com o verbo alegrar-se.
- source_word: ᾗ χαίρομεν
  choice: com que nos alegramos
  rationale: Reproduz a relação cognata entre χαρά e χαίρομεν por meio de “alegria” e “nos alegramos”.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: Torna explícito o valor causal de διά com acusativo e evita confundi-lo com a expressão anterior.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: diante do nosso Deus
  rationale: Mantém de modo claro e digno a metáfora espacial que indica a presença de Deus.
theological_decisions:
- issue: Força retórica da linguagem de retribuição dirigida a Deus
  choice: Conservar “retribuir” dentro da pergunta retórica.
  alternative: “Como poderíamos agradecer suficientemente a Deus por vocês?”
  rationale: ἀνταποδοῦναι contém a noção explícita de dar em retorno. A pergunta comunica a incapacidade de oferecer gratidão à altura da alegria, não uma transação pela qual Deus ficaria devedor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “alegria... nos alegramos” foi mantida deliberadamente para refletir a ênfase do grego. A vírgula antes do marcador separa o primeiro fundamento da gratidão do desenvolvimento seguinte.
