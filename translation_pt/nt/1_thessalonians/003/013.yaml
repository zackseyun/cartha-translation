  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: pt
  text: para que ele fortaleça os corações de vocês, irrepreensíveis em santidade diante de nosso Deus e Pai, na vinda de nosso Senhor Jesus com todos os seus santos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com todos os que são santos”. A expressão grega pode se referir a pessoas santificadas, a anjos ou a ambos neste contexto.
    reason: Preserva a ambiguidade de πάντων τῶν ἁγίων αὐτοῦ, sem determinar se os «santos» são seres humanos, anjos ou ambos.
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: para que ele firme
  rationale: A construção com infinitivo articular expressa propósito ou resultado ligado ao versículo anterior. A oração finita preserva essa força e soa natural em português.
- source_word: τὰς καρδίας
  choice: o coração de vocês
  rationale: “Coração” conserva a imagem bíblica do ser interior. O singular coletivo é idiomático em português e evita a formulação pesada “os corações de vocês”.
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: tornando-o irrepreensível em santidade
  rationale: “Irrepreensível” comunica ausência de motivo legítimo de acusação, enquanto “em santidade” preserva a santidade como estado ou qualidade. “Tornando-o” explicita naturalmente o resultado sem eliminar a relação sintática com o coração.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: diante de nosso Deus e Pai
  rationale: “Diante de” expressa estar na presença e sob o olhar de Deus; “nosso Deus e Pai” mantém a coordenação do grego.
- source_word: ἐν τῇ παρουσίᾳ
  choice: na vinda
  rationale: Neste contexto escatológico, παρουσία designa a chegada ou vinda futura do Senhor. “Vinda” é clara, corrente e tradicional sem ser excessivamente técnica.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: de nosso Senhor Jesus
  rationale: Mantém o título cristológico κύριος como “Senhor” e segue a ordem natural em português.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: com todos os seus santos
  rationale: O substantivo adjetival ἅγιοι significa literalmente os santos ou santos seres. A formulação portuguesa é natural, enquanto a nota preserva a possível referência a pessoas santificadas, anjos ou ambos.
theological_decisions:
- issue: Referente de πάντων τῶν ἁγίων αὐτοῦ
  choice: todos os seus santos
  alternative: todos os seus anjos; todo o seu povo santo
  rationale: O grego não determina por si só se os santos são pessoas santificadas, anjos ou ambos. O texto principal mantém a expressão ampla, e a nota explicita a ambiguidade sem resolvê-la denominacionalmente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O singular coletivo “o coração de vocês” favorece a naturalidade sem reduzir o sentido comunitário do plural grego.
