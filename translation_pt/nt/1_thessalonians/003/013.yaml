  naturalness: O texto é claro e de registro apropriado. «Firmar os corações» é compreensível, mas «fortalecer os corações» é mais corrente no português moderno e comunica bem o sentido de στηρίξαι. A concordância plural também torna a frase mais fluente.
  terminology: «Irrepreensíveis», «santidade», «Deus e Pai», «vinda» e «Senhor Jesus» são escolhas adequadas. «Todos os seus santos», com nota explicativa, mantém uma formulação tradicional sem especificar indevidamente se os «santos» são humanos, anjos ou ambos.
