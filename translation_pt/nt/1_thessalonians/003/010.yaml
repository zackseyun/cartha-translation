translation:
  language: pt
  text: Noite e dia, oramos com extrema insistência para vê-los pessoalmente e suprir o que falta à fé de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que está faltando à fé de vocês”. O grego também pode ser entendido de maneira mais ampla como aquilo que ainda precisa ser fortalecido ou completado na fé de vocês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Noite e dia
  rationale: Reproduz de modo idiomático os genitivos adverbiais, indicando atividade contínua ou repetida.
- source_word: ὑπερεκπερισσοῦ
  choice: com a maior insistência
  rationale: Expressa a força intensiva e superlativa do advérbio raro em português natural, qualificando a oração.
- source_word: δεόμενοι
  choice: oramos
  rationale: O particípio denota súplica fervorosa; a intensidade é comunicada pela expressão adverbial. A forma finita também produz uma continuação natural do contexto sintático.
- source_word: εἰς τὸ ἰδεῖν
  choice: para ver
  rationale: A preposição com infinitivo articular indica propósito, naturalmente expresso por “para” mais infinitivo.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: vê-los pessoalmente
  rationale: A expressão literalmente menciona o rosto, mas funciona como idioma de presença e encontro pessoal. Esta formulação comunica esse sentido com clareza em português moderno.
- source_word: καταρτίσαι
  choice: suprir
  rationale: No contexto de algo que falta, o verbo indica prover o necessário, completar ou pôr em ordem; “suprir” preserva bem essa relação sem definir excessivamente a natureza da necessidade.
- source_word: τὰ ὑστερήματα
  choice: o que falta
  rationale: Traduz naturalmente o plural grego de carências ou deficiências por uma expressão coletiva, sem sugerir que não exista fé.
- source_word: τῆς πίστεως ὑμῶν
  choice: à fé de vocês
  rationale: Mantém πίστις como “fé” e representa o genitivo como complemento natural de “falta”, deixando aberta a extensão exata daquilo que necessita ser fortalecido ou completado.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade; confiança
  rationale: Neste contexto, refere-se mais naturalmente à fé ou confiança dos tessalonicenses que ainda precisa de fortalecimento, embora o campo lexical possa incluir fidelidade.
- issue: Natureza do que falta à fé
  choice: o que falta à fé de vocês
  alternative: o que ainda precisa ser fortalecido ou completado na fé de vocês
  rationale: 'A tradução preserva a tensão do original: Paulo reconhece a fé real dos leitores, mas afirma que há aspectos ainda carentes. A nota explicita a amplitude possível sem resolver indevidamente se se trata de conteúdo, maturidade ou fortalecimento.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” corresponde ao plural ὑμῶν. A expressão idiomática “vê-los pessoalmente” evita o artificial “ver o rosto de vocês”, preservando a ideia de presença face a face.
