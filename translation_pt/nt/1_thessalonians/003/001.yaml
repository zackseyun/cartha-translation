base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: pt
  text: Por isso, como não aguentávamos mais, achamos por bem ser deixados sozinhos em Atenas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando já não conseguíamos suportar mais».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferida do contexto anterior.
- source_word: μηκέτι στέγοντες
  choice: não podendo mais suportar a espera
  rationale: A combinação indica que chegaram ao limite da capacidade de suportar a incerteza e a preocupação; “a espera” explicita com naturalidade o objeto implícito no contexto.
- source_word: εὐδοκήσαμεν
  choice: achamos melhor
  rationale: Comunica a decisão favorável e deliberada expressa pelo verbo, sem sugerir que a separação lhes causava prazer.
- source_word: καταλειφθῆναι
  choice: ficar
  rationale: Em português, “ficar sozinhos” expressa naturalmente o resultado passivo de serem deixados, enquanto a nota preserva a forma mais literal.
- source_word: ἐν Ἀθήναις
  choice: em Atenas
  rationale: Equivalente locativo direto e convencional do topônimo grego.
- source_word: μόνοι
  choice: sozinhos
  rationale: Mantém o plural gramatical e indica que os autores permaneceriam sem o companheiro enviado.
theological_decisions:
- issue: Referente da primeira pessoa do plural e sua tensão com a reconstrução histórica
  choice: Manter “achamos” e “sozinhos” no plural, conforme o grego.
  alternative: 'Interpretar o plural como plural epistolar e traduzir no singular: “achei melhor ficar sozinho”.'
  rationale: O texto grego emprega formas plurais; a tradução não deve decidir se Paulo fala apenas de si mesmo nem harmonizar o versículo com uma reconstrução baseada em Atos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal privilegia naturalidade sem eliminar o plural do original; a nota registra mais diretamente as nuances volitiva e passiva.
