  yaml_path: translation/nt/1_thessalonians/003/008.yaml
  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: pt
  text: Pois[a] agora vivemos[b], se vocês permanecem firmes no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque agora vivemos, se vocês permanecem firmes no Senhor”. A conjunção inicial também pode ser entendida como “porque” ou ficar implícita na tradução.'
    reason: lexical_alternative
  - marker: b
    text: “Vivemos” provavelmente é uma expressão retórica de ânimo ou vitalidade renovados, e não apenas uma referência à sobrevivência física.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação causal do consolo mencionado no contexto anterior. “Pois” mantém essa ligação de modo natural e digno.
- source_word: νῦν
  choice: agora
  rationale: Preserva diretamente a ênfase temporal do advérbio grego.
- source_word: ζῶμεν
  choice: vivemos
  rationale: Reproduz a forma verbal simples e conserva, sem explicitá-la no texto principal, sua força retórica de ânimo e vitalidade renovados.
- source_word: ἐὰν
  choice: se
  rationale: Mantém de forma direta a construção condicional grega, sem transformá-la em uma afirmação absoluta.
- source_word: ὑμεῖς
  choice: vocês
  rationale: Expressa claramente o pronome plural explícito e é natural no português moderno, especialmente para leitores brasileiros.
- source_word: στήκετε
  choice: permanecem firmes
  rationale: Comunica a ideia de constância e firmeza contínuas presente em στήκω, com formulação natural em português.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a expressão paulina tradicional e sua amplitude relacional e teológica, sem reduzi-la a uma interpretação específica.
theological_decisions:
- issue: Força da afirmação “agora vivemos”
  choice: Manter a expressão literal como linguagem retórica de renovação do ânimo e da vitalidade.
  alternative: Explicitar “agora nos sentimos revigorados” ou entender a frase como dependência física literal.
  rationale: O contexto favorece uma expressão pastoral e enfática, mas o texto principal preserva a formulação grega e deixa sua intensidade retórica aberta.
- issue: Sentido de “no Senhor”
  choice: Preservar a expressão ampla “no Senhor”.
  alternative: Traduzir de modo explicativo como “unidos ao Senhor” ou “fiéis ao Senhor”.
  rationale: A expressão denota a esfera ou relação em que ocorre a perseverança, sem exigir uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” marca naturalmente o plural; “permanecem firmes” expressa constância sem impor uma leitura denominacional da perseverança.
