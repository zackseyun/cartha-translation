    rationale: Somente πίστις («fé») comporta aqui a alternativa «fidelidade»; ἀγάπη continua sendo «amor». A formulação atual pode sugerir indevidamente que toda a expressão, inclusive «amor», é uma alternativa de tradução.
  - severity: low
    issue: «Ele também nos contou» acrescenta uma nova oração principal e a ideia de «também».
    rationale: O grego apresenta os dois conteúdos como objetos do mesmo particípio εὐαγγελισαμένου («trouxe/anunciou boas notícias»). A alteração não muda substancialmente o sentido, mas pode ser evitada para refletir mais diretamente a construção fonte.
  revised_text: Mas agora, Timóteo acaba de chegar até nós, vindo de vocês, e nos trouxe boas notícias sobre a fé e o amor de vocês[a], contando-nos que vocês sempre guardam uma boa lembrança de nós e anseiam por nos ver, assim como nós também ansiamos por ver vocês,
