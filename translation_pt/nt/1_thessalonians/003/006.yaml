id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: pt
  text: Mas agora, Timóteo acaba de chegar até nós, vindo de vocês, e nos trouxe boas notícias sobre a fé e o amor de vocês[a], contando-nos que vocês sempre guardam uma boa lembrança de nós e anseiam por nos ver, assim como nós também ansiamos por ver vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fidelidade de vocês”. A palavra grega traduzida como “fé” também pode significar “fidelidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Mas agora ... acaba de
  rationale: Expressa tanto a transição contrastiva de δέ quanto o caráter recente de ἄρτι em português natural.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Timóteo acaba de chegar até nós, vindo de vocês
  rationale: Converte o genitivo absoluto numa oração finita idiomática e conserva a origem e o destino do movimento.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: nos trouxe as boas notícias
  rationale: No contexto, o verbo indica um relato favorável; a formulação mantém a ressonância de anunciar boas notícias sem sugerir que Timóteo evangelizou Paulo.
- source_word: τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν
  choice: sobre a fé e o amor de vocês
  rationale: Mantém os equivalentes usuais de πίστις e ἀγάπη e associa ambos aos tessalonicenses.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: guardam uma boa lembrança de nós
  rationale: Conserva a imagem de lembrança positiva com uma expressão clara e corrente em português.
- source_word: πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: sempre ... anseiam por nos ver
  rationale: Preserva a continuidade indicada por πάντοτε e a forte afeição de ἐπιποθέω.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: assim como nós também ansiamos por ver vocês
  rationale: Explicita o verbo elíptico em português e mantém a reciprocidade da comparação.
theological_decisions:
- issue: Sentido de πίστις neste contexto
  choice: fé
  alternative: fidelidade
  rationale: “Fé” é o sentido mais provável para a perseverança dos tessalonicenses na confiança em Deus e no evangelho, mas πίστις também pode realçar sua constância ou fidelidade; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O versículo conserva a vírgula final porque a frase continua no versículo seguinte. “Vocês” oferece clareza natural para o plural sem regionalismo excessivo.
