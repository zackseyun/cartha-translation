  to: Mas agora, Timóteo acaba de chegar até nós, vindo de vocês, e nos trouxe boas notícias sobre a fé e o amor de vocês[a], contando-nos que vocês sempre guardam uma boa lembrança de nós e anseiam por nos ver, assim como nós também ansiamos por ver vocês,
