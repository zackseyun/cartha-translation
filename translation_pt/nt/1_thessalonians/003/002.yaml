id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: pt
  text: e enviamos Timóteo, nosso irmão e cooperador de Deus[a] no evangelho do Messias[b], para fortalecê-los e encorajá-los quanto à fé que vocês têm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cooperador com Deus”. Alguns manuscritos trazem outras formas, entre elas “servo de Deus”.'
    reason: alternative_reading
  - marker: b
    text: 'Grego: “Cristo”; aqui traduzido por “Messias” porque o termo tem sentido de título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: enviamos
  rationale: O aoristo narrativo de πέμπω é expresso naturalmente pelo pretérito perfeito simples; “enviamos” é claro e corrente.
- source_word: Τιμόθεον
  choice: Timóteo
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀδελφὸν ἡμῶν
  choice: nosso irmão
  rationale: Preserva a metáfora familiar do grego e sua força relacional entre os fiéis.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: cooperador de Deus
  rationale: Mantém de modo natural a forte expressão genitiva do texto adotado, sem atenuá-la para “servo” nem explicá-la como “cooperador com Deus” no corpo do versículo.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: no evangelho do Messias
  rationale: “No” comunica a esfera de atuação de Timóteo; o genitivo é preservado sem decidir se o evangelho procede do Messias ou trata dele.
- source_word: Χριστοῦ
  choice: do Messias
  rationale: Neste contexto, Χριστός conserva força titular; “Messias” torna essa função explícita, enquanto a forma tradicional “Cristo” é registrada em nota.
- source_word: εἰς τὸ στηρίξαι
  choice: para fortalecê-los
  rationale: A construção com εἰς e infinitivo expressa propósito; “fortalecer” é atual, claro e pastoralmente adequado.
- source_word: παρακαλέσαι
  choice: encorajá-los
  rationale: No contexto de apoio à fé sob pressão, “encorajar” preserva a amplitude pastoral de παρακαλέω melhor que opções mais estreitas como “consolar” ou “exortar”.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: quanto à fé que vocês têm
  rationale: “Quanto a” preserva o sentido de referência ou interesse de ὑπέρ, e a expansão discreta evita em português a possível leitura de “sua fé” como a fé do próprio Timóteo.
- source_word: πίστεως
  choice: fé
  rationale: “Fé” é a equivalência normal neste contexto, que enfoca a confiança crente dos tessalonicenses, sem excluir sua perseverança.
theological_decisions:
- issue: Sentido e variante textual em συνεργὸν τοῦ θεοῦ
  choice: cooperador de Deus
  alternative: cooperador com Deus; em alguns manuscritos, servo de Deus
  rationale: O texto da SBLGNT apresenta συνεργὸν τοῦ θεοῦ, expressão teologicamente forte que deve ser preservada, não suavizada. A nota informa tanto uma tradução relacional possível quanto variantes manuscritas importantes.
- issue: Tradução de Χριστοῦ em εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: A construção favorece a percepção de Χριστός como título. “Messias” comunica o valor do termo, e “Cristo” permanece em nota como alternativa tradicional válida.
- issue: Relação expressa por τοῦ Χριστοῦ
  choice: evangelho do Messias
  alternative: evangelho a respeito do Messias; evangelho proveniente do Messias
  rationale: O genitivo grego admite mais de uma relação semântica. A formulação portuguesa mantém essa ambiguidade em vez de decidir entre conteúdo e origem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e pronomes oblíquos em colocação natural na escrita. As notas preservam a variante textual e a alternativa lexical sem sobrecarregar o texto principal.
