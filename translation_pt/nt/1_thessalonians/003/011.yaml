source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: pt
  text: Que o próprio Deus, nosso Pai, e o nosso Senhor Jesus[a] dirijam o nosso caminho[b] até vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, o verbo traduzido por «dirijam» está no singular, embora os sujeitos coordenados sejam «Deus, nosso Pai» e «o nosso Senhor Jesus».
    reason: cross_reference
  - marker: b
    text: 'Ou: «tornem reto o nosso caminho até vocês».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mesmo
  rationale: Emprego intensivo que destaca pessoalmente Deus como sujeito; em português, «o nosso Deus e Pai mesmo» conserva a ênfase sem acrescentar um pronome ausente.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ funciona como transição leve para uma oração-desejo. O fluxo em português dispensa um marcador explícito, evitando sugerir contraste ou temporalidade inexistentes.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: o nosso Deus e Pai
  rationale: Mantém os dois títulos unidos sob um só referente e segue de perto a estrutura grega com linguagem natural.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: o nosso Senhor Jesus
  rationale: Conserva o possessivo, o título κύριος como «Senhor» e o nome Jesus, sem acrescentar «Cristo».
- source_word: κατευθύναι
  choice: encaminhem
  rationale: O optativo aoristo expressa desejo ou oração. «Que ... encaminhem» comunica tanto a direção da viagem quanto a ideia de abrir ou tornar viável o caminho.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: o nosso caminho
  rationale: Preserva a imagem de ὁδός e permite entender tanto a rota concreta quanto o curso da viagem.
- source_word: πρὸς ὑμᾶς
  choice: até vocês
  rationale: Expressa naturalmente em português a direção e o destino da viagem rumo aos destinatários.
theological_decisions:
- issue: Verbo grego no singular com os sujeitos coordenados «o nosso Deus e Pai» e «o nosso Senhor Jesus»
  choice: 'Manter claramente ambos como sujeitos da mesma petição, usando no português o plural exigido pela concordância: «encaminhem».'
  alternative: Reestruturar a frase para aplicar a ação sobretudo a Deus Pai ou obscurecer a coordenação dos dois sujeitos.
  rationale: O grego reúne o Pai e Jesus como sujeitos de um único verbo no singular. Como reproduzir literalmente essa concordância seria agramatical em português e poderia parecer erro, a tradução mantém a unidade da petição e registra a peculiaridade grega em nota, sem resolver além do texto sua relevância teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A construção optativa foi vertida como oração-desejo («Que...»). «Encaminhem o nosso caminho» retém deliberadamente a imagem do original, embora tenha leve repetição lexical; a nota oferece a nuance de tornar reto ou desimpedir o caminho.
