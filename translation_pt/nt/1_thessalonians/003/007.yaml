id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: pt
  text: Por isso, irmãos[a], em meio a toda a nossa angústia e aflição, fomos consolados quanto a vocês por meio da fé de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” é a forma habitual de Paulo se dirigir à congregação e pode incluir toda a comunidade de fiéis.
    reason: cultural_note
  - marker: b
    text: Ou “fidelidade de vocês”. A palavra grega pístis pode significar fé, confiança ou fidelidade; aqui, provavelmente inclui a ideia de perseverança na fé.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a relação causal com as boas notícias mencionadas no contexto anterior.
- source_word: παρεκλήθημεν
  choice: fomos consolados
  rationale: O passivo de παρακαλέω indica aqui o consolo e o alívio recebidos em meio ao sofrimento, e não uma exortação.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego; no uso paulino, ela pode dirigir-se à comunidade cristã inteira, como esclarece a nota.
- source_word: ἐφ’ ὑμῖν
  choice: quanto a vocês
  rationale: Indica que os tessalonicenses eram o assunto em relação ao qual Paulo e seus companheiros foram consolados, sem sugerir que fossem a causa da aflição.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: em meio a toda a nossa angústia e aflição
  rationale: Apresenta as circunstâncias do consolo e conserva os dois substantivos de sofrimento, em linguagem atual e digna.
- source_word: ἀνάγκῃ
  choice: angústia
  rationale: Neste contexto, o termo descreve pressão ou situação angustiante; 'necessidade' seria literal, mas poderia sugerir apenas carência material.
- source_word: θλίψει
  choice: aflição
  rationale: Comunica sofrimento e pressão grave sem o possível tom técnico ou arcaizante de 'tribulação'.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: por meio da fé de vocês
  rationale: διά com genitivo apresenta a fé dos tessalonicenses como o meio pelo qual veio o consolo.
- source_word: πίστεως
  choice: fé
  rationale: É o sentido principal de πίστις aqui, embora a perseverança dos tessalonicenses permita também a nuance de fidelidade, preservada em nota.
theological_decisions:
- issue: Sentido de πίστις quando a perseverança dos tessalonicenses está em vista
  choice: fé
  alternative: fidelidade
  rationale: O contexto fala da confiança contínua dos tessalonicenses, a qual implica constância. O texto principal preserva o sentido comum 'fé', enquanto a nota registra a possível nuance de 'fidelidade' sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém tom digno, evita arcaísmos e posiciona “quanto a vocês” de modo a não associar os tessalonicenses à causa da angústia.
