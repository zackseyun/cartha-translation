id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: pt
  text: Por isso, também eu, quando já não pude suportar mais, mandei saber da fé de vocês[a], com receio de que, de algum modo, o tentador os tivesse tentado e o nosso trabalho árduo viesse a ser em vão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da fidelidade de vocês” ou “da confiança de vocês”. A palavra grega pode reunir sentidos parcialmente sobrepostos conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “acabasse não servindo para nada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a relação causal com a explicação anterior de Paulo.
- source_word: κἀγὼ
  choice: também eu
  rationale: Torna explícito o elemento καί da forma contraída, preservando a discreta ênfase no próprio Paulo.
- source_word: μηκέτι στέγων
  choice: quando já não pude suportar mais
  rationale: Reproduz em português corrente a ideia de chegar ao limite da capacidade de suportar.
- source_word: ἔπεμψα
  choice: mandei
  rationale: Mantém implícito o objeto, como no grego; o contexto identifica Timóteo, mas este versículo não o nomeia.
- source_word: εἰς τὸ γνῶναι
  choice: saber da
  rationale: Traduz naturalmente a construção de finalidade e conserva o sentido de procurar obter informação.
- source_word: τὴν πίστιν ὑμῶν
  choice: a fé de vocês
  rationale: ‘Fé’ é o equivalente principal de πίστις neste contexto paulino; possíveis nuances de confiança e fidelidade são registradas em nota.
- source_word: μή πως
  choice: com receio de que, de algum modo
  rationale: Comunica a apreensão expressa pela construção grega sem transformá-la numa afirmação categórica.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: o tentador os tivesse tentado
  rationale: Preserva a repetição deliberada entre o particípio e o verbo e representa adequadamente a tentação maligna sugerida pelo contexto.
- source_word: ὁ πειράζων
  choice: o tentador
  rationale: Mantém a designação descritiva do grego, sem substituir pelo nome próprio ‘Satanás’.
- source_word: ὁ κόπος ἡμῶν
  choice: o nosso trabalho árduo
  rationale: ‘Trabalho árduo’ comunica o esforço e desgaste inerentes a κόπος melhor do que o termo genérico ‘trabalho’ sozinho.
- source_word: εἰς κενὸν γένηται
  choice: viesse a ser em vão
  rationale: Conserva o caráter prospectivo do subjuntivo e traduz a expressão idiomática como esforço sem resultado.
theological_decisions:
- issue: Sentido de πίστις no contexto
  choice: fé
  alternative: fidelidade ou confiança
  rationale: O contexto aponta principalmente para a continuidade da resposta crente dos tessalonicenses, mas πίστις pode incluir nuances sobrepostas de confiança e fidelidade; a nota preserva essa amplitude.
- issue: Identidade de ὁ πειράζων
  choice: o tentador
  alternative: Satanás
  rationale: Embora o contexto permita reconhecer uma referência a Satanás, o texto grego emprega uma designação funcional, que deve permanecer no texto principal.
- issue: Relação temporal e modal de ἐπείρασεν e γένηται
  choice: os tivesse tentado ... viesse a ser
  alternative: os tentasse ... se tornasse
  rationale: A formulação escolhida mantém a apreensão de Paulo quanto a uma tentação possivelmente já ocorrida e quanto à consequência temida, sem afirmar que ela efetivamente prevaleceu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega ‘vocês’ em vez de ‘vós’, preserva a repetição ‘tentador... tentado’ e evita nomear explicitamente Satanás onde o grego usa apenas uma designação descritiva.
