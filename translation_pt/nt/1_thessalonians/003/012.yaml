  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: pt
  text: E que o Senhor faça vocês crescerem e transbordarem em amor uns pelos outros e por todos[a], assim como nós também transbordamos de amor por vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uns para com os outros e para com todos”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é elíptica no grego, literalmente: “assim como também nós por vocês”. O predicado foi completado em português a partir da frase anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ dá continuidade suave à oração-desejo, sem indicar contraste forte.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título κύριος sem explicitar seu referente além do que o próprio versículo afirma.
- source_word: πλεονάσαι
  choice: faça vocês crescerem
  rationale: O optativo expressa um desejo ou oração, e a construção causativa mantém o Senhor como agente do crescimento.
- source_word: περισσεύσαι
  choice: transbordarem
  rationale: Distingue este verbo de πλεονάσαι e comunica a ideia de abundância intensificada em português corrente.
- source_word: τῇ ἀγάπῃ
  choice: em amor
  rationale: Expressa naturalmente a esfera ou o aspecto em que devem crescer e transbordar.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: uns pelos outros e por todos
  rationale: É idiomático em português com “amor” e mantém πάντας amplo, sem restringi-lo a um grupo.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: assim como nós também por vocês
  rationale: Preserva na linha principal a elipse expressiva do grego; a nota esclarece o sentido subentendido.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter apenas “o Senhor”
  alternative: Explicitar “o Senhor Jesus” ou “Deus”
  rationale: O versículo usa κύριος sem identificar expressamente o referente; a tradução não deve resolver essa questão por acréscimo.
- issue: Alcance de πάντας
  choice: “todos”, sem complemento
  alternative: “todas as pessoas” ou “todos os irmãos”
  rationale: O grego mantém o alcance aberto; “todos” preserva essa amplitude e evita estreitamento interpretativo.
- issue: Elipse da oração final
  choice: Preservar a elipse no texto e explicá-la em nota
  alternative: Completar no texto como “assim como nós também transbordamos em amor por vocês”
  rationale: A forma concisa reproduz a tensão sintática do original sem deixar o leitor sem esclarecimento.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” torna explícito o plural de ὑμᾶς. A combinação “crescerem e transbordarem” mantém os dois verbos e sua intensificação retórica. Todas as notas estão marcadas no texto principal.
