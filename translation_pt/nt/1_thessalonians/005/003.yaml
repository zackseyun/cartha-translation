source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: pt
  text: 'Quando disserem: “Paz e segurança”, então a destruição virá de repente sobre eles, como as dores de parto sobre a mulher grávida, e de modo nenhum escaparão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega uma negação enfática: “de modo nenhum escaparão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Quando disserem
  rationale: Expressa naturalmente em português uma oração temporal indefinida voltada para o futuro, mantendo o sujeito plural não especificado.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Paz e segurança
  rationale: Preserva a combinação retórica; “segurança” representa bem o substantivo abstrato ἀσφάλεια no contexto de uma declaração pública.
- source_word: τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος
  choice: então a destruição virá de repente sobre eles
  rationale: Mantém a consequência marcada por τότε, a ideia de chegada sobre alguém em ἐφίσταται e a subitaneidade de αἰφνίδιος, com sintaxe natural em português.
- source_word: ὄλεθρος
  choice: destruição
  rationale: Comunica ruína ou devastação grave sem definir além do texto a natureza ou duração do juízo.
- source_word: ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ
  choice: como as dores de parto sobre a mulher grávida
  rationale: Reproduz de modo claro e corrente a comparação grega; o singular coletivo “dor de parto” é naturalmente expresso no plural em português.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: de modo nenhum escaparão
  rationale: Conserva a força da negação enfática οὐ μή e sua referência futura sem recorrer a formulação arcaica.
theological_decisions:
- issue: Natureza de ὄλεθρος na advertência escatológica
  choice: destruição
  alternative: ruína; perdição
  rationale: O termo anuncia juízo decisivo, mas não determina por si só o modo nem a duração desse juízo. “Destruição” preserva a gravidade e a tensão teológica sem impor um sistema escatológico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência natural, preservando a sequência lógica do grego e a ênfase final. O marcador de nota aparece no texto principal.
