id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: pt
  text: Mas nós, que somos do dia, sejamos sóbrios, tendo vestido a couraça da fé[a] e do amor e, como capacete, a esperança da salvação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. A palavra grega também pode significar “confiança” ou “fidelidade”; aqui, “fé” foi mantida no texto principal.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “e a esperança da salvação como capacete”.'
    reason: alternative_word_order
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mas nós
  rationale: δέ estabelece contraste com os que pertencem à noite no contexto anterior; “Mas nós” expressa esse contraste com clareza e sem acrescentar uma relação causal ausente da forma grega.
- source_word: ἡμέρας ὄντες
  choice: que somos do dia
  rationale: Preserva a metáfora e o sentido de pertencimento ou esfera expresso pelo genitivo, sem reduzi-lo a uma simples indicação temporal.
- source_word: νήφωμεν
  choice: sejamos sóbrios
  rationale: Mantém tanto a imagem de sobriedade quanto o sentido figurado de vigilância e autocontrole apropriado ao contexto de noite e dia.
- source_word: ἐνδυσάμενοι
  choice: tendo vestido
  rationale: Representa o particípio aoristo e conserva a imagem de vestir a armadura como circunstância associada à exortação.
- source_word: θώρακα
  choice: couraça
  rationale: É o termo militar direto e tradicional em português para a peça de armadura que protege o tronco.
- source_word: πίστεως
  choice: fé
  rationale: “Fé” é a tradução principal mais natural na tríade paulina de fé, amor e esperança; a possível nuance de fidelidade é preservada em nota.
- source_word: ἀγάπης
  choice: amor
  rationale: Tradução direta e corrente do termo no contexto das virtudes cristãs.
- source_word: περικεφαλαίαν
  choice: capacete
  rationale: Equivalente militar claro, atual e idiomático.
- source_word: ἐλπίδα σωτηρίας
  choice: a esperança da salvação
  rationale: Preserva a construção grega e a relação entre esperança e salvação sem especificar além do texto se o genitivo indica objeto ou caracterização.
theological_decisions:
- issue: Sentido de πίστις na metáfora da armadura
  choice: fé
  alternative: fidelidade; confiança
  rationale: A associação com amor e esperança favorece “fé” como nome da virtude, mas πίστις pode também apresentar a nuance de fidelidade; essa possibilidade não é eliminada e aparece em nota.
- issue: Força de ἡμέρας ὄντες
  choice: somos do dia
  alternative: pertencemos ao dia
  rationale: A formulação escolhida conserva literalmente a metáfora identitária e ética, sem acrescentar uma explicação doutrinária ao enunciado.
- issue: Relação sintática entre capacete e esperança da salvação
  choice: como capacete, a esperança da salvação
  alternative: a esperança da salvação como capacete
  rationale: A tradução principal mantém de perto a ordem e a aposição do grego; a alternativa mais linear em português é registrada em nota sem mudança de sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A linguagem militar e a metáfora de noite e dia foram preservadas, assim como a concisão da exortação.
