  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: pt
  text: Não apaguem o Espírito,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o espírito”. O termo grego pode designar o espírito em sentido mais geral, mas aqui provavelmente se refere ao Espírito Santo, sobretudo por causa da menção de profecias logo a seguir.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: Com o artigo e no contexto imediato das profecias e do discernimento (vv. 20–21), a expressão provavelmente se refere ao Espírito Santo. A inicial maiúscula indica esse referente provável, embora os manuscritos gregos antigos não façam essa distinção gráfica.
- source_word: μὴ
  choice: Não
  rationale: μή com o imperativo presente expressa aqui uma proibição, traduzida naturalmente em português por “não” seguido do verbo no presente do subjuntivo.
- source_word: σβέννυτε
  choice: apaguem
  rationale: σβέννυμι significa apagar ou extinguir, especialmente fogo. “Apaguem” é corrente, claro e preserva a metáfora de suprimir uma atuação comparável a uma chama.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: o Espírito Santo
  alternative: o espírito; o fervor ou dom espiritual
  rationale: A proximidade da advertência sobre não desprezar profecias favorece a referência à atuação do Espírito Santo na comunidade. Como πνεῦμα também pode ter sentido mais geral, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. “Não apaguem” conserva de modo natural a imagem do original.
