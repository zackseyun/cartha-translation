  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: pt
  text: Em tudo, deem graças[a], pois esta é, no Messias Jesus, a vontade de Deus para vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em todas as circunstâncias”. O grego diz literalmente “em tudo” e se refere às circunstâncias em que os fiéis devem dar graças, não necessariamente a dar graças pelo próprio mal.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “em Cristo Jesus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: em tudo
  rationale: Mantém a forma compacta do grego e indica a esfera ou circunstância em que se deve dar graças, sem transformar a expressão em “por tudo”.
- source_word: εὐχαριστεῖτε
  choice: deem graças
  rationale: Traduz diretamente o imperativo presente na segunda pessoa do plural. A continuidade da prática fica implícita, sem acrescentar um advérbio ausente do texto.
- source_word: τοῦτο
  choice: esta
  rationale: O demonstrativo retoma de modo mais imediato a exortação a dar graças; a formulação simples preserva a concisão do grego.
- source_word: γὰρ
  choice: pois
  rationale: Introduz naturalmente, em português, a razão que fundamenta a ordem anterior.
- source_word: θέλημα θεοῦ
  choice: a vontade de Deus
  rationale: É a expressão portuguesa direta e corrente para o genitivo grego.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Preserva tanto o sentido titular de Χριστός quanto a linguagem paulina de estar “em” Jesus, sem substituir a preposição por uma explicação interpretativa.
- source_word: εἰς ὑμᾶς
  choice: para vocês
  rationale: Expressa de maneira natural que a vontade de Deus se dirige aos leitores ou diz respeito a eles.
theological_decisions:
- issue: Se a ação de graças deve ser dada em toda circunstância ou por toda coisa, inclusive o mal
  choice: em tudo
  alternative: por tudo
  rationale: ἐν com o dativo indica mais naturalmente a esfera ou circunstância da ação. A tradução evita afirmar, além do texto, que o mal em si deva ser objeto de agradecimento.
- issue: Tradução de Χριστῷ como título ou forma tradicional
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Aqui Χριστός continua semanticamente reconhecível como título messiânico. A tradução principal explicita esse sentido, enquanto a forma tradicional é registrada em nota.
- issue: Relação sintática de “no Messias Jesus” e “para vocês”
  choice: a vontade de Deus para vocês no Messias Jesus
  alternative: a vontade de Deus no Messias Jesus para vocês
  rationale: A ordem escolhida é mais natural em português, mas conserva a linguagem de participação em Jesus e não desenvolve explicitamente qual elemento a locução modifica, preservando a concisão e alguma abertura sintática do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Deem” marca corretamente o plural dirigido à comunidade. A construção “Em tudo” conserva a brevidade enfática do original, e as notas registram as principais alternativas sem sobrecarregar o versículo.
