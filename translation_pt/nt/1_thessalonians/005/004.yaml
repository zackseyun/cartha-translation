id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: pt
  text: Mas vocês, irmãos[a], não estão em trevas, para que o dia[b] os surpreenda como um ladrão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido inclusivo, “irmãos e irmãs”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o dia do Senhor, conforme o contexto imediato.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Mas vocês
  rationale: δέ estabelece contraste com os que estão desprevenidos nos versículos anteriores, e o pronome explícito ὑμεῖς recebe a ênfase natural de “vocês” em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina do vocativo grego; no contexto, o termo provavelmente se dirige à comunidade inteira, o que é esclarecido em nota.
- source_word: ἐν σκότει
  choice: em trevas
  rationale: Mantém a imagem metafórica e sua ressonância moral e espiritual, sem reduzi-la a uma simples falta de informação.
- source_word: ἵνα
  choice: para que
  rationale: Reproduz a ligação sintática grega e conserva a possível tensão entre finalidade e resultado, sem defini-la indevidamente.
- source_word: ἡ ἡμέρα
  choice: o dia
  rationale: Mantém a expressão simples do grego; o contexto imediato identifica esse dia como o dia do Senhor.
- source_word: ὡς κλέπτης
  choice: como um ladrão
  rationale: Expressa de modo natural em português a comparação introduzida por ὡς.
- source_word: καταλάβῃ
  choice: surpreenda
  rationale: No contexto da chegada súbita de um ladrão, comunica o sentido de alcançar ou apanhar inesperadamente. “Alcance” seria mais formalmente próximo, mas menos claro quanto ao elemento contextual de surpresa.
theological_decisions:
- issue: Sentido inclusivo de ἀδελφοί ao dirigir-se à congregação
  choice: irmãos, com nota sobre o sentido inclusivo
  alternative: irmãos e irmãs
  rationale: A tradução principal conserva a forma masculina do original, enquanto a nota informa que o uso pode incluir toda a comunidade, sem apagar nem exagerar a forma grega.
- issue: Referência escatológica de ἡ ἡμέρα
  choice: o dia, com esclarecimento em nota
  alternative: o dia do Senhor
  rationale: O texto grego deste versículo diz apenas “o dia”; a identificação mais completa vem do contexto imediato e, por isso, é registrada em nota, não inserida no corpo do texto.
- issue: Nuance de ἵνα
  choice: para que
  alternative: de modo que
  rationale: “Para que” preserva a construção grega e sua ambiguidade possível entre finalidade e resultado; a alternativa tenderia a fixar mais claramente uma leitura resultativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “em trevas” preserva a imagem bíblica; a ordem e as relações sintáticas permanecem próximas do grego sem produzir uma frase artificial.
