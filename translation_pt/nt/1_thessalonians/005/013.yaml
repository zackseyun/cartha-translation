  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: pt
  text: e que os tenham em altíssima consideração, com amor, por causa do trabalho que realizam.[a] Vivam em paz entre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que os estimem extraordinariamente, com amor, por causa do trabalho deles”. O advérbio grego tem uma intensidade incomum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: ter em consideração
  rationale: 'Neste contexto, o verbo expressa uma avaliação: a comunidade deve reconhecer e estimar as pessoas mencionadas no versículo anterior. A expressão é clara e natural em português.'
- source_word: ὑπερεκπερισσοῦ
  choice: em altíssima consideração
  rationale: O advérbio raro e fortemente intensivo pede mais que simples respeito; «altíssima» comunica sua força enfática sem tornar a frase artificial.
- source_word: ἐν ἀγάπῃ
  choice: com amor
  rationale: Em português, «com amor» expressa naturalmente a maneira pela qual devem estimá-los e preserva explicitamente o termo central ἀγάπη.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: por causa do trabalho que realizam
  rationale: διά com acusativo indica a razão dessa consideração. A formulação mantém o substantivo «trabalho» e torna natural a referência possessiva.
- source_word: εἰρηνεύετε
  choice: Vivam em paz
  rationale: O imperativo presente exorta à prática contínua da paz; «vivam em paz» soa natural e comunica essa dimensão habitual.
- source_word: ἐν ἑαυτοῖς
  choice: entre vocês
  rationale: O reflexivo plural aponta para a paz dentro da própria comunidade. «Entre vocês» é a formulação moderna mais natural e amplamente compreensível.
- source_word: καὶ
  choice: e
  rationale: A conjunção liga esta exortação às instruções do versículo anterior.
- source_word: αὐτούς
  choice: os
  rationale: O pronome retoma as pessoas que trabalham, presidem e admoestam a comunidade no versículo anterior.
