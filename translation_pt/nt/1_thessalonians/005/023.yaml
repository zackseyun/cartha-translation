  naturalness: «O espírito, a alma e o corpo de vocês sejam conservados íntegros e irrepreensíveis» é natural em português moderno e torna explícita, sem sobreinterpretá-la, a inteireza indicada por ὁλόκληρον. A coordenação plural é a solução idiomática portuguesa para o sujeito composto.
