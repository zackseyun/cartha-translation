id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: pt
  text: E que o próprio Deus da paz os santifique por completo; e que o espírito, a alma e o corpo de vocês sejam conservados íntegros e irrepreensíveis na vinda de nosso Senhor Jesus, o Messias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, «na vinda de nosso Senhor Jesus Cristo».
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς
  choice: o próprio
  rationale: Preserva o uso intensivo de αὐτός, enfatizando que Deus pessoalmente realiza a ação.
- source_word: δὲ
  choice: E
  rationale: Marca com naturalidade a transição para o desejo-oração, sem introduzir contraste forte nem um advérbio temporal ausente do grego.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: o Deus da paz
  rationale: Mantém a expressão genitiva e o título paulino tradicional em português.
- source_word: ἁγιάσαι
  choice: santifique
  rationale: O optativo aoristo exprime desejo ou oração; o subjuntivo introduzido por «que» é sua forma natural em português e preserva a ligação lexical com santidade.
- source_word: ὑμᾶς
  choice: os
  rationale: Pronome plural referente coletivamente aos tessalonicenses; «os» oferece leitura internacional, enquanto a retomada explícita «de vocês» elimina possível ambiguidade adiante.
- source_word: ὁλοτελεῖς
  choice: por completo
  rationale: Transmite a totalidade da santificação de modo idiomático, sem confundir este termo com ὁλόκληρον.
- source_word: ὁλόκληρον
  choice: todo
  rationale: Expressa inteireza e abrange conjuntamente os três elementos enumerados.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Mantém o termo distinto de «alma» e «corpo», sem impor um sistema antropológico.
- source_word: ἡ ψυχὴ
  choice: a alma
  rationale: Nesta enumeração, «alma» preserva melhor a distinção lexical em relação a πνεῦμα e σῶμα.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Equivalente português direto e corrente de σῶμα.
- source_word: ἀμέμπτως
  choice: irrepreensíveis
  rationale: Em português, o adjetivo predicativo após «sejam conservados» comunica naturalmente a condição sem culpa ou censura. A concordância no plural toma os destinatários como referente semântico, embora a construção grega permita discussão sintática.
- source_word: ἐν τῇ παρουσίᾳ
  choice: na vinda
  rationale: No contexto escatológico paulino, παρουσία designa a chegada ou vinda de Jesus; «na vinda» é idiomático e preciso.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Traduz Χριστός como título, em português natural, em vez de apenas transliterá-lo; a forma tradicional «Cristo» consta em nota.
theological_decisions:
- issue: 'Tríade antropológica: espírito, alma e corpo'
  choice: Conservar os três termos explicitamente, sem transformá-los em uma doutrina técnica sobre três partes da natureza humana.
  alternative: Entender a enumeração retoricamente como referência abrangente à pessoa inteira.
  rationale: O grego nomeia espírito, alma e corpo, mas não resolve se a enumeração pretende definir formalmente a constituição humana. A tradução preserva tanto as palavras quanto a tensão interpretativa.
- issue: Referência de ἀμέμπτως e construção de τηρηθείη
  choice: Traduzir de modo natural como uma oração para que os destinatários, considerados em sua inteireza, sejam conservados irrepreensíveis.
  alternative: Relacionar mais estritamente «irrepreensivelmente» ao conjunto singular «todo o espírito, a alma e o corpo».
  rationale: A sintaxe grega reúne um sujeito composto sob a ideia singular de totalidade e usa o verbo no singular. O português exige ajustes de concordância; a nota preserva a particularidade e a possível ambiguidade da construção.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός é título no contexto. «O Messias» explicita seu sentido, enquanto a forma tradicional é oferecida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A combinação «os ... de vocês» evita regionalizar todo o versículo em torno de «vós» ou de formas exclusivamente brasileiras. A pontuação com ponto e vírgula conserva as duas petições estreitamente relacionadas. Todos os marcadores de nota aparecem no texto principal.
