  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: pt
  text: Pois os que dormem dormem de noite, e os que se embriagam se embriagam de noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação anterior e mantém de modo natural a força conectiva do grego.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: os que dormem dormem
  rationale: Traduz o particípio substantivado de maneira genérica e repete o verbo para preservar o paralelismo retórico e a imagem literal.
- source_word: νυκτός
  choice: de noite
  rationale: O genitivo tem função adverbial temporal; “de noite” é uma formulação corrente, concisa e natural em português.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: os que se embriagam se embriagam
  rationale: Preserva a correspondência verbal entre o particípio e o verbo finito, expressando a ação habitual de ficar embriagado sem reduzi-la apenas a um estado.
- source_word: καί
  choice: e
  rationale: Mantém a coordenação simples entre as duas orações paralelas.
theological_decisions:
- issue: Sentido literal ou metafórico do sono e da embriaguez na analogia explicativa
  choice: Manter as imagens literais “dormem” e “se embriagam” no texto principal
  alternative: Explicitar metaforicamente a insensibilidade espiritual e a dissipação moral
  rationale: No contexto imediato, Paulo recorre a comportamentos associados à noite para sustentar sua exortação espiritual. A formulação literal preserva a analogia e evita inserir sua interpretação no próprio texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada dos verbos reproduz o paralelismo enfático do original.
