review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz adequadamente διό, παρακαλεῖτε e ἀλλήλους. Porém, «edifiquem-se mutuamente» normalmente é reflexivo em português (‘edifiquem a si mesmos mutuamente’) e não expressa com clareza o objeto recíproco εἷς τὸν ἕνα. O grego requer que cada pessoa edifique a outra. «Como também estão fazendo» reproduz de modo direto καθὼς καὶ ποιεῖτε, incluindo a confirmação de uma prática presente.
  naturalness: «Por isso» e «encorajem uns aos outros» são naturais e adequados ao registro. A repetição de «uns aos outros» é aceitável aqui, pois torna explícita a reciprocidade repetida do grego e evita a ambiguidade reflexiva de «-se mutuamente».
  terminology: «Encorajem» comunica bem o sentido amplo de παρακαλεῖτε neste contexto; a alternativa «exortem» pode permanecer em nota. «Edifiquem» preserva a metáfora construtiva de οἰκοδομεῖτε e é terminologia compreensível em português bíblico contemporâneo.
  issues:
  - severity: medium
    issue: «edifiquem-se mutuamente» é reflexivo e pode indicar autoedificação coletiva, não a edificação de uns pelos outros.
    rationale: οἰκοδομεῖτε tem como objeto εἷς τὸν ἕνα (‘cada um ao outro’). A tradução deve explicitar a direção recíproca da ação.
  - severity: low
    issue: A nota alternativa repete a formulação ambígua «edifiquem cada um ao outro».
    rationale: Embora compreensível, «edifiquem uns aos outros» é a formulação portuguesa mais fluida e inequívoca para o objeto recíproco.
  revised_text: Por isso, encorajem uns aos outros[a] e edifiquem uns aos outros, como também estão fazendo.
