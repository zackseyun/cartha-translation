  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: pt
  text: Por isso, encorajem uns aos outros[a] e edifiquem uns aos outros, como também estão fazendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exortem uns aos outros”. O verbo grego traduzido por “encorajem” também pode ter o sentido de exortar ou incentivar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente do argumento anterior e mantém clara a conexão lógica.
- source_word: παρακαλεῖτε
  choice: encorajem
  rationale: Neste contexto de instrução e fortalecimento mútuo, abrange a ideia de animar e incentivar, sem restringi-la apenas a consolar nem dar-lhe necessariamente o tom mais forte de exortar.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente português natural para a reciprocidade da ação ordenada.
- source_word: οἰκοδομεῖτε
  choice: edifiquem-se
  rationale: Preserva a metáfora de construção do grego e é uma expressão corrente no contexto de fortalecimento da comunidade.
- source_word: εἷς τὸν ἕνα
  choice: mutuamente
  rationale: Traduz idiomaticamente a expressão distributiva e conserva a ênfase de que cada pessoa deve edificar a outra.
- source_word: καθὼς καὶ ποιεῖτε
  choice: como vocês já estão fazendo
  rationale: Mantém a comparação, a confirmação enfática e o aspecto de uma prática presente; «já» comunica naturalmente que a ação recomendada de fato está em curso.
