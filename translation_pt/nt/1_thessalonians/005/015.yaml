  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: pt
  text: Cuidem para que ninguém retribua o mal com o mal a quem quer que seja[a]; pelo contrário, procurem sempre fazer o bem uns aos outros e a todos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenham cuidado para que ninguém retribua o mal com o mal a quem quer que seja”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “uns aos outros e a todos” provavelmente passa dos irmãos na fé para todas as pessoas de modo mais amplo.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Cuidem para que
  rationale: O imperativo plural funciona idiomaticamente como uma exortação à vigilância e à responsabilidade comunitária, não como simples ato de ver.
- source_word: μή τις
  choice: ninguém
  rationale: Com ὁρᾶτε, introduz aquilo que a comunidade deve impedir; a construção «Cuidem para que ninguém» comunica naturalmente a força preventiva.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: o mal com o mal
  rationale: Preserva a repetição e a abrangência moral da fórmula de retaliação. Em português, «retribuir o mal com o mal» é mais idiomático do que reproduzir literalmente a preposição grega.
- source_word: τινι
  choice: a quem quer que seja
  rationale: Expressa o destinatário indefinido e ressalta, sem restringir, o alcance da proibição.
- source_word: ἀποδῷ
  choice: retribua
  rationale: Comunica a ideia de devolver em resposta ao que foi feito, apropriada ao contexto de retaliação.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente temporal direto e natural.
- source_word: τὸ ἀγαθὸν
  choice: o bem
  rationale: O artigo substantiva o adjetivo; «o bem» é corrente, digno e preserva a categoria moral do grego.
- source_word: διώκετε
  choice: busquem
  rationale: Transmite empenho ativo e contínuo em procurar o bem. «Persigam» seria formalmente próximo, mas pode sugerir hostilidade no português corrente.
- source_word: εἰς ἀλλήλους
  choice: uns dos outros
  rationale: No contexto de buscar o bem, a formulação genitiva é natural em português e expressa a orientação da ação dentro da comunidade.
- source_word: καὶ εἰς πάντας
  choice: e de todos
  rationale: Mantém o paralelismo com «uns dos outros» e o alcance abrangente de πάντας, sem acrescentar um substantivo ausente no grego.
theological_decisions:
- issue: Alcance da obrigação ética cristã
  choice: A sequência «uns dos outros e de todos» sugere um movimento da comunidade mútua para um círculo mais amplo.
  alternative: «Todos» poderia ser entendido como todos os membros da comunidade de fé.
  rationale: O contraste entre ἀλλήλους e πάντας favorece a ampliação do alcance, mas a tradução conserva a formulação do texto e deixa a nota indicar essa leitura provável, sem torná-la uma explicação inserida no versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Cuidem» conserva o caráter comunitário do imperativo plural; «pelo contrário» explicita naturalmente o contraste de ἀλλά. Todos os marcadores de nota aparecem no texto principal.
