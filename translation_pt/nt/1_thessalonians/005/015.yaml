review_pass:
  verdict: revise
  source_fidelity: A primeira exortação traduz adequadamente ὁρᾶτε μή τις... ἀποδῷ. Contudo, «busquem sempre o bem uns dos outros e de todos» emprega construções genitivas que, em português, tendem a significar «o bem que lhes pertence» ou «o bem em benefício deles», sem representar de modo claro a direção ética de εἰς ἀλλήλους καὶ εἰς πάντας. A revisão explicita naturalmente que o bem deve ser praticado em relação tanto aos outros membros quanto a todos.
  naturalness: «Procurem sempre fazer o bem uns aos outros e a todos» é moderno, claro e amplamente compreensível em português internacional, inclusive para leitores brasileiros. Mantém o vigor exortativo de διώκετε sem a ambiguidade ou a pouca naturalidade de «buscar o bem uns dos outros».
  terminology: «Mal» e «bem» preservam a repetição moral de κακόν/ἀγαθόν. «Fazer o bem» é uma explicitação idiomática segura de perseguir/procurar o bem em direção a pessoas, sem impor leitura doutrinária.
  issues:
