    issue: A construção «busquem sempre o bem uns dos outros e de todos» é ambígua e pouco idiomática para εἰς ἀλλήλους καὶ εἰς πάντας.
    rationale: «Uns dos outros» e «de todos» soam como complementos possessivos, não como os destinatários da ação. O grego orienta a busca do bem em favor/de direção a uns aos outros e a todos.
  revised_text: Cuidem para que ninguém retribua o mal com o mal a quem quer que seja[a]; pelo contrário, procurem sempre fazer o bem uns aos outros e a todos[b].
