  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: pt
  text: Fiel é aquele que chama vocês[a]; ele também fará isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Confiável é aquele que chama vocês; ele também realizará isso.”'
    reason: Alternativa lexical para πιστός e tradução possível de ποιήσει.
lexical_decisions:
- source_word: πιστὸς
  choice: Fiel
  rationale: Adjetivo predicativo que destaca a constância e a confiabilidade de Deus. “Fiel” é natural, tradicional e teologicamente expressivo em português, sem exceder o sentido do grego.
- source_word: ὁ καλῶν
  choice: aquele que chama
  rationale: O particípio presente com artigo funciona como substantivo e identifica Deus como aquele que chama. A formulação preserva a força participial em português natural.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Pronome de segunda pessoa do plural dirigido à comunidade. “Vocês” explicita o número e oferece ampla legibilidade brasileira.
- source_word: ὃς καὶ
  choice: ele também
  rationale: 'A retomada por pronome pessoal torna a frase natural em português, enquanto “também” preserva a continuidade enfática: aquele que chama é igualmente aquele que agirá.'
- source_word: ποιήσει
  choice: fará isso
  rationale: 'O futuro de ποιέω é amplo: fazer, realizar ou cumprir. “Fará isso” mantém a brevidade do original e aponta para a santificação e preservação pedidas no versículo anterior sem especificá-las além do texto.'
theological_decisions:
- issue: Objeto implícito de ποιήσει
  choice: fará isso
  alternative: realizará isso; levará isso a efeito
  rationale: O grego não expressa o objeto, que é recuperado do pedido do versículo 23. O demonstrativo “isso” permite uma frase portuguesa completa, preservando a referência contextual sem definir de modo excessivo como Deus realizará a obra.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. A inversão “Fiel é” conserva a ênfase inicial do grego; “vocês” torna explícito o plural comunitário.
