  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: pt
  text: Eu ponho vocês sob juramento diante do Senhor que esta carta seja lida a todos os irmãos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelo Senhor». A expressão grega pode indicar que Paulo os obriga solenemente, invocando o Senhor como autoridade.
    reason: lexical_alternative
  - marker: b
    text: Aqui, «irmãos» provavelmente se refere a toda a congregação, incluindo as mulheres; o termo grego ἀδελφοῖς está no masculino plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: ponho sob juramento
  rationale: O verbo expressa o ato de obrigar solenemente alguém mediante juramento. A formulação preserva essa força de modo claro e atual, evitando o menos comum «conjuro».
- source_word: τὸν κύριον
  choice: diante do Senhor
  rationale: Com ἐνορκίζω, o acusativo pode indicar aquele por quem se faz o juramento. «Diante do Senhor» comunica de forma idiomática que o Senhor é invocado como testemunha e autoridade; a alternativa «pelo Senhor» permanece em nota.
- source_word: ἀναγνωσθῆναι
  choice: façam com que ... seja lida
  rationale: O infinitivo aoristo passivo significa «ser lida». A construção causativa portuguesa conserva a voz passiva e expressa naturalmente a responsabilidade dos destinatários de providenciar a leitura, provavelmente pública.
- source_word: τὴν ἐπιστολήν
  choice: esta carta
  rationale: Refere-se ao próprio documento que está sendo enviado. «Esta carta» é natural e atual; «epístola» seria menos acessível.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: a todos os irmãos
  rationale: Mantém o masculino plural do grego. No uso paulino, o termo provavelmente abrange toda a congregação, inclusive as mulheres, informação preservada em nota sem substituir a forma do texto-fonte.
theological_decisions:
- issue: Sentido de τὸν κύριον na fórmula de juramento
  choice: diante do Senhor
  alternative: pelo Senhor
  rationale: A construção pode apresentar o Senhor como testemunha/autoridade diante de quem se faz a exigência ou como aquele por quem os destinatários são postos sob juramento. O texto principal adota a expressão portuguesa mais natural, e a nota preserva a alternativa genuína.
- issue: Abrangência de ἀδελφοῖς numa congregação provavelmente mista
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O grego emprega o masculino plural ἀδελφοῖς. Em Paulo, ele frequentemente inclui as mulheres da comunidade, mas o texto principal preserva a forma gramatical, deixando explícita em nota a provável abrangência inclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ponho sob juramento» conserva a solenidade sem recorrer ao arcaizante «conjuro». O imperativo «façam» explicita de maneira natural em português a obrigação ligada ao infinitivo passivo grego.
