  source_fidelity: A tradução preserva adequadamente a força solene de ἐνορκίζω, a referência ao Senhor e a leitura destinada a todos os irmãos. Contudo, «façam com que» transforma desnecessariamente o infinitivo passivo ἀναγνωσθῆναι em uma ordem causativa dirigida aos destinatários. Uma oração passiva finita em português reproduz com mais proximidade o sentido e evita especificar como eles devem cumprir a ordem.
  naturalness: «Eu os ponho sob juramento» é compreensível, mas «ponho vocês sob juramento» é mais natural e imediatamente claro para a legibilidade brasileira, sem perder aceitabilidade internacional. A estrutura com dois-pontos seguida de imperativo é menos fluida do que uma oração completiva passiva.
  terminology: «Senhor», «carta» e «irmãos» são adequados. A nota sobre «irmãos» preserva de modo apropriado a provável abrangência congregacional do masculino plural ἀδελφοῖς. A nota sobre «pelo Senhor» mantém a alternativa sintática legítima para τὸν κύριον.
  issues:
