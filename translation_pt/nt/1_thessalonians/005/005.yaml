  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: pt
  text: Pois todos vocês são filhos da luz e filhos do dia.[a] Não somos da noite nem das trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “filhos” é masculino. Nesta expressão idiomática, indica pessoas caracterizadas pela luz e pelo dia ou pertencentes a eles, incluindo homens e mulheres.
    reason: Esclarecer o caráter idiomático e o alcance inclusivo da metáfora masculina sem alterar o texto principal.
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Pois todos vocês
  rationale: Preserva o valor explicativo de γάρ e a ênfase inclusiva de πάντες junto de ὑμεῖς, em ordem natural no português moderno.
- source_word: υἱοὶ φωτός
  choice: filhos da luz
  rationale: Mantém o substantivo masculino υἱοί e a metáfora semítica de pertencimento ou caracterização, sem restringir sua aplicação aos homens.
- source_word: υἱοὶ ἡμέρας
  choice: filhos do dia
  rationale: Conserva o paralelismo com 'filhos da luz' e o contraste metafórico entre dia e noite.
- source_word: οὐκ ἐσμὲν
  choice: Não somos
  rationale: Preserva a mudança do tratamento na segunda pessoa do plural para a primeira pessoa do plural, incluindo o autor e seus companheiros.
- source_word: νυκτὸς οὐδὲ σκότους
  choice: da noite nem das trevas
  rationale: Expressa naturalmente em português os genitivos de pertencimento e mantém a distinção entre 'noite' e 'trevas'.
theological_decisions:
- issue: Metáfora familiar marcada por gênero em υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: filhos da luz e filhos do dia
  alternative: filhos e filhas da luz e filhos e filhas do dia; pessoas da luz e do dia
  rationale: O texto grego emprega literalmente 'filhos' numa expressão idiomática que abrange todos os destinatários e indica pertencimento ou caráter. A tradução conserva a imagem original, e a nota esclarece seu alcance inclusivo.
- issue: Mudança da segunda para a primeira pessoa do plural
  choice: todos vocês são... Não somos...
  alternative: todos vocês são... vocês não são...
  rationale: A mudança de pessoa consta do grego e provavelmente inclui Paulo e seus colaboradores com os tessalonicenses; não deve ser harmonizada.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. 'Pois' mantém a conexão explicativa com o contexto anterior. O artigo definido foi usado em 'da luz', 'do dia', 'da noite' e 'das trevas' por naturalidade idiomática em português.
