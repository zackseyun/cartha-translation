  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: pt
  text: Mas examinem tudo[a] e apeguem-se ao que é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as coisas”. No contexto, isso inclui especialmente a avaliação das declarações proféticas.
    reason: Alternativa lexical e esclarecimento contextual sem restringir o sentido amplo do texto.
lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O acusativo neutro plural tem sentido abrangente. “Tudo” é a forma natural e corrente em português, sem restringir o alcance do grego.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca uma transição levemente contrastiva em relação às instruções anteriores; “Mas” conserva essa nuance sem torná-la excessivamente forte.
- source_word: δοκιμάζετε
  choice: examinem
  rationale: O imperativo presente pede avaliação contínua para verificar autenticidade ou valor. “Examinem” expressa discernimento criterioso com naturalidade em português.
- source_word: τὸ καλὸν
  choice: o que é bom
  rationale: O adjetivo neutro substantivado refere-se àquilo que é bom. Esta formulação é clara e natural, sem a abstração filosófica de “o bem”.
- source_word: κατέχετε
  choice: apeguem-se
  rationale: O imperativo comunica retenção firme e adesão contínua após o exame. “Apeguem-se” preserva melhor essa força do que simplesmente “guardem” ou “mantenham”.
theological_decisions:
- issue: Alcance de πάντα no contexto de profecia e discernimento
  choice: “tudo”, mantendo o alcance abrangente do termo
  alternative: “todas as profecias” ou “tudo o que é dito”
  rationale: Embora o contexto imediato inclua as profecias (v. 20), o grego emprega πάντα sem substantivo que limite seu alcance. A tradução mantém essa amplitude, enquanto a nota indica a relevância contextual especial das declarações proféticas.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas à comunidade. “Examinem” evita a possível conotação laboratorial de “testem”, e “apeguem-se” comunica retenção firme em linguagem amplamente compreensível.
