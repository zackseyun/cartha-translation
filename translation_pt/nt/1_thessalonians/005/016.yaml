lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: O advérbio expressa constância ou ocorrência em todo tempo. “Sempre” é a forma mais natural e concisa em português e mantém a força abrangente do grego.
- source_word: χαίρετε
  choice: alegrem-se
  rationale: É a segunda pessoa do plural do imperativo presente ativo de χαίρω. “Alegrem-se” comunica de modo natural o sentido de experimentar e manifestar alegria, preservando tanto o valor imperativo quanto o aspecto reflexivo idiomático do verbo em português.
