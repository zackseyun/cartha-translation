source:
  edition: SBLGNT
  text: ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: pt
  text: Afastem-se de toda espécie de mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda forma de mal”; tradicionalmente, “toda aparência do mal”.
    reason: Alternativa lexical para εἴδους e transparência quanto à tradução tradicional.
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Afastem-se
  rationale: O imperativo presente, na segunda pessoa do plural, pede uma atitude contínua de manter distância. “Afastem-se” é natural, direto e conserva tanto a força imperativa quanto a ideia separativa reforçada por ἀπό.
- source_word: ἀπὸ
  choice: de
  rationale: Com ἀπέχεσθε, expressa separação ou afastamento; em português, integra-se naturalmente à construção “afastem-se de”.
- source_word: παντὸς
  choice: toda
  rationale: 'No singular genitivo com εἴδους, tem sentido distributivo: cada espécie ou tipo, expresso naturalmente por “toda espécie”.'
- source_word: εἴδους
  choice: espécie
  rationale: Neste contexto, significa mais provavelmente “espécie”, “tipo” ou “forma”, e não apenas aparência exterior. “Espécie” é clara e idiomática na expressão “toda espécie de mal”.
- source_word: πονηροῦ
  choice: mal
  rationale: O genitivo completa εἴδους, formando “espécie de mal”. “Mal” é a opção mais direta e abrangente em português.
theological_decisions:
- issue: Sentido de εἴδους na expressão ἀπὸ παντὸς εἴδους πονηροῦ
  choice: toda espécie de mal
  alternative: toda forma de mal; tradicionalmente, toda aparência do mal
  rationale: O contexto favorece o sentido de espécie, tipo ou forma de mal. A tradução tradicional por “aparência” pode ser entendida como uma ordem para evitar tudo o que apenas pareça mau, interpretação que provavelmente atribui a εἶδος uma especificidade que o contexto não exige. A nota preserva as alternativas relevantes.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “afastem-se” torna explícito o destinatário coletivo. A formulação evita o registro excessivamente técnico de “abstenham-se”, sem perder a força do mandamento.
