  text: ἀδιαλείπτως προσεύχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: pt
  text: Orem sem cessar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Orem continuamente” ou “Orem sem parar”.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: sem cessar
  rationale: A expressão preserva de modo natural e conciso a ideia de persistência contínua, sem exigir por si só uma atividade verbal ininterrupta a cada instante. Também corresponde bem à força adverbial do grego.
- source_word: προσεύχεσθε
  choice: Orem
  rationale: O imperativo está na segunda pessoa do plural. “Orem” transmite diretamente a exortação coletiva; a ideia de ação continuada já é comunicada por “sem cessar”.
theological_decisions:
- issue: Alcance prático da ordem
  choice: Exortação geral à oração persistente e contínua
  alternative: Exigência literal de oração verbal ininterrupta em cada momento
  rationale: O presente imperativo unido a ἀδιαλείπτως convoca à perseverança habitual na oração. A tradução mantém a força e a tensão da formulação grega sem impor uma interpretação ascética ou excessivamente literal.
translation_notes:
  register: Português atual, digno e amplamente compreensível. O plural “Orem” reflete a forma verbal grega, e “sem cessar” conserva a formulação enfática e tradicional sem soar arcaica.
