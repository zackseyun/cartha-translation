id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: pt
  text: Pedimos, porém, a vocês, irmãos[a], que reconheçam[b] os que trabalham arduamente entre vocês, que os lideram no Senhor[c] e que os admoestam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; o grego diz «irmãos», usado aqui como forma de tratamento da congregação.
    reason: lexical_alternative
  - marker: b
    text: Ou «respeitem» ou «deem o devido valor a».
    reason: lexical_alternative
  - marker: c
    text: Ou «que estão à frente de vocês no Senhor».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Pedimos
  rationale: Expressa um pedido pastoral, de modo direto e natural, sem elevar sua força à de uma ordem.
- source_word: δὲ
  choice: porém
  rationale: Marca a transição leve presente no grego. Em português, «porém» conserva a conexão discursiva sem exigir oposição forte.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do vocativo grego; no contexto, trata-se de uma forma de tratamento dirigida à congregação inteira, esclarecida em nota.
- source_word: εἰδέναι
  choice: reconheçam
  rationale: Neste contexto, o infinitivo tem o sentido idiomático de reconhecer ou dar o devido valor, não apenas conhecer intelectualmente.
- source_word: κοπιῶντας
  choice: os que trabalham arduamente
  rationale: Torna explícita a ideia de esforço intenso contida em κοπιάω, em linguagem moderna e natural.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica o trabalho realizado no meio da comunidade e oferece ampla legibilidade em português.
- source_word: προϊσταμένους ὑμῶν
  choice: que os lideram
  rationale: Comunica liderança e responsabilidade sem impor uma estrutura eclesiástica específica.
- source_word: ἐν κυρίῳ
  choice: no Senhor
  rationale: Preserva a expressão teologicamente significativa e relaciona o exercício da liderança ao Senhor.
- source_word: νουθετοῦντας
  choice: que os admoestam
  rationale: Conserva tanto o aspecto instrutivo quanto o corretivo do verbo, sem reduzi-lo apenas a advertir ou aconselhar.
theological_decisions:
- issue: Alcance de ἀδελφοί como tratamento congregacional
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma da fonte é masculina plural, mas seu uso congregacional provavelmente inclui mulheres. A tradução mantém a forma lexical e registra o alcance inclusivo em nota.
- issue: Sentido de εἰδέναι em relação aos trabalhadores da comunidade
  choice: reconheçam
  alternative: respeitem; deem valor; conheçam
  rationale: «Reconheçam» preserva a ideia relacional de identificar e valorizar o serviço deles, sem introduzir uma exigência explícita de obediência ou veneração.
- issue: Força de προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: que os lideram no Senhor
  alternative: que estão à frente de vocês no Senhor; que cuidam de vocês no Senhor
  rationale: O particípio pode envolver liderança, direção e cuidado. A opção adotada mantém a noção de autoridade responsável sem definir uma forma denominacional de governo eclesiástico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para legibilidade brasileira e internacional. A construção paralela «os que... que... e que...» preserva a referência dos três particípios ao mesmo grupo. As notas aparecem na ordem natural dos marcadores no texto.
