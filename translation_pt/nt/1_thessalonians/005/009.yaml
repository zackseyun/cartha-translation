source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: pt
  text: Pois Deus não nos designou para a ira, mas para a obtenção da salvação[a] por meio de nosso Senhor Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “a posse da salvação”, “a aquisição da salvação” ou, possivelmente, “a preservação para a salvação”; o substantivo grego περιποίησις tem sentido mais amplo do que “obtenção”.
    reason: lexical_alternative
  - marker: b
    text: 'Forma tradicional: “nosso Senhor Jesus Cristo”. Aqui, o título grego Χριστός é traduzido como “Messias” para preservar seu significado.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da exortação anterior e conserva de modo natural o valor causal do grego.
- source_word: ἔθετο
  choice: designou
  rationale: Expressa a ideia de colocar ou designar alguém com vistas a um resultado, sem acrescentar uma formulação mais forte e sistemática sobre predestinação.
- source_word: εἰς ὀργὴν
  choice: para a ira
  rationale: Mantém o sentido direto de ὀργή, que neste contexto paulino aponta para a ira divina, sem substituí-lo pelo termo interpretativo mais amplo 'juízo'.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: para alcançarmos a salvação
  rationale: Converte naturalmente a construção nominal grega em uma finalidade verbal em português. 'Alcançar' comunica obtenção sem ocultar, na nota, a amplitude semântica de περιποίησις.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: por meio de nosso Senhor Jesus, o Messias
  rationale: διά com genitivo indica meio ou agência. 'Messias' preserva o valor titular de Χριστός, e a vírgula com artigo torna a aposição idiomática em português.
theological_decisions:
- issue: Se ἔθετο deve receber uma formulação predestinacionista mais forte
  choice: não nos designou para a ira
  alternative: não nos destinou à ira
  rationale: O texto afirma a decisão e o propósito de Deus quanto ao resultado, mas não exige que a tradução resolva debates sistemáticos sobre predestinação.
- issue: Se Χριστοῦ deve ser traduzido como título ou mantido na forma tradicional
  choice: o Messias
  alternative: Cristo
  rationale: Após o nome Jesus, Χριστός ainda conserva significado titular. A tradução principal torna esse significado explícito, enquanto a forma tradicional aparece em nota.
- issue: Amplitude de περιποίησις
  choice: alcançarmos a salvação
  alternative: tomarmos posse da salvação; adquirirmos a salvação; sermos preservados para a salvação
  rationale: O contexto favorece a obtenção da salvação em contraste com a ira, mas o substantivo grego admite uma faixa semântica mais ampla, preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação preserva a relação causal com o contexto anterior, o contraste escatológico entre ira e salvação e a ambiguidade lexical relevante de περιποίησις.
