  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: pt
  text: Pois vocês mesmos sabem muito bem que o dia do Senhor vem como ladrão à noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: vocês mesmos
  rationale: O pronome intensivo enfatiza o sujeito já expresso na forma verbal; “vocês mesmos” conserva essa ênfase de modo natural em português.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação ou razão da afirmação anterior, função naturalmente expressa por “pois”.
- source_word: ἀκριβῶς
  choice: muito bem
  rationale: Com o verbo “saber”, comunica de forma idiomática um conhecimento preciso e seguro, sem a rigidez de “exatamente”.
- source_word: οἴδατε
  choice: sabem
  rationale: É a tradução direta e corrente do verbo no contexto.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que os destinatários sabem.
- source_word: ἡμέρα κυρίου
  choice: o dia do Senhor
  rationale: Preserva a expressão profética e escatológica consagrada, sem confundi-la com um dia semanal de culto.
- source_word: κυρίου
  choice: Senhor
  rationale: “Senhor” é a equivalência bíblica tradicional e contextualmente adequada para κύριος nesta expressão.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: como ladrão à noite
  rationale: Mantém a comparação e expressa em português natural a chegada inesperada associada à imagem.
- source_word: οὕτως
  choice: expresso pela construção comparativa
  rationale: O advérbio correlaciona o modo da vinda com a comparação precedente; em português, essa função já é transmitida naturalmente por “vem como”.
- source_word: ἔρχεται
  choice: vem
  rationale: Conserva o presente vívido do grego, que aponta para o acontecimento escatológico futuro.
theological_decisions:
- issue: Sentido escatológico de ἡμέρα κυρίου
  choice: o dia do Senhor
  alternative: o dia pertencente ao Senhor / o domingo
  rationale: O contexto trata da chegada súbita do dia de intervenção divina, e não de um dia litúrgico semanal.
- issue: Força da comparação com o ladrão
  choice: manter a imagem sem explicação adicional
  alternative: explicitar que a vinda será secreta ou inserir um esquema escatológico específico
  rationale: A comparação destaca a chegada inesperada; o texto não autoriza acrescentar detalhes sobre segredo, cronologias ou sistemas escatológicos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” evita regionalismo excessivo; “à noite” é natural e fiel ao valor temporal de ἐν νυκτί. Não são necessárias notas de rodapé neste versículo.
