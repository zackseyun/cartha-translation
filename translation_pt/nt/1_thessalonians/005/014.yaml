id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: pt
  text: 'E nós lhes pedimos, irmãos[a]: admoestem os que vivem de modo indisciplinado[b], animem os desalentados[c], amparem os fracos[d] e sejam pacientes com todos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «irmãos e irmãs»; Paulo se dirige à congregação como um todo.
    reason: alternative_reading
  - marker: b
    text: Ou «os ociosos», «os desordeiros» ou «os insubordinados».
    reason: lexical_alternative
  - marker: c
    text: Ou «consolem os desanimados».
    reason: lexical_alternative
  - marker: d
    text: Ou «deem apoio aos fracos».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: pedimos
  rationale: Neste contexto de exortação pastoral, comunica um apelo sério e cordial em português corrente; evita tanto a solenidade menos usual de «exortamos» quanto a suavidade de «encorajamos».
- source_word: δέ
  choice: E
  rationale: Marca continuação ou transição, não contraste forte.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do vocativo grego; no contexto, dirige-se à congregação inteira, sentido explicitado em nota.
- source_word: νουθετεῖτε
  choice: admoestem
  rationale: Expressa instrução corretiva destinada a levar à mudança, preservando as dimensões corretiva e pastoral.
- source_word: ἀτάκτους
  choice: os que vivem de modo indisciplinado
  rationale: Preserva a ideia ampla de estar fora da ordem ou da disciplina sem restringir o termo apenas à ociosidade.
- source_word: παραμυθεῖσθε
  choice: animem
  rationale: Transmite o ato de falar com bondade para consolar, fortalecer ou devolver ânimo.
- source_word: ὀλιγοψύχους
  choice: os desalentados
  rationale: Designa pessoas abatidas, desanimadas ou com pouca coragem; «desalentados» é natural e digno em português moderno.
- source_word: ἀντέχεσθε
  choice: amparem
  rationale: Com o genitivo, o verbo indica apegar-se a alguém para sustentá-lo ou ajudá-lo; «amparar» preserva a proximidade e o apoio ativo.
- source_word: τῶν ἀσθενῶν
  choice: os fracos
  rationale: Mantém a amplitude do termo, que pode indicar fraqueza física, moral ou social, sem especificar indevidamente.
- source_word: μακροθυμεῖτε
  choice: sejam pacientes
  rationale: Comunica claramente a perseverança paciente no trato com pessoas.
- source_word: πρὸς πάντας
  choice: com todos
  rationale: Forma idiomática em português que preserva o alcance universal da orientação.
theological_decisions:
- issue: Força inclusiva de ἀδελφοί no discurso à congregação
  choice: «irmãos» no texto principal, com nota sobre a inclusão de homens e mulheres
  alternative: «irmãos e irmãs»
  rationale: A forma do original é masculina plural, mas Paulo se dirige à comunidade inteira. A nota preserva simultaneamente a forma linguística e o alcance contextual.
- issue: Natureza da fraqueza em τῶν ἀσθενῶν
  choice: Não especificar o tipo de fraqueza
  alternative: Interpretar como enfermos, moralmente fracos ou socialmente vulneráveis
  rationale: O termo grego é amplo, e o versículo não determina se a fraqueza é física, espiritual, moral ou social.
- issue: Identidade dos ἀτάκτους
  choice: Manter a noção ampla de conduta indisciplinada
  alternative: «ociosos» ou «insubordinados»
  rationale: O contexto das cartas aos tessalonicenses permite relação com ociosidade, mas o adjetivo não exige que o sentido seja limitado a ela.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural verbal concorda com o tratamento congregacional «vocês», implícito em «lhes». As escolhas evitam regionalismos marcados e preservam as ambiguidades relativas aos indisciplinados e aos fracos.
