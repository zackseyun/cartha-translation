id: 1TH.5.6
reference: 1 Thessalonians 5:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: pt
  text: Portanto, não durmamos como os demais, mas fiquemos acordados[a] e sejamos sóbrios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejamos vigilantes”. O verbo grego pode enfatizar tanto estar acordado como manter-se vigilante.
    reason: lexical_alternative
  - marker: b
    text: Ou “tenhamos domínio próprio” ou “mantenhamos a mente lúcida”. O verbo grego expressa sobriedade e, por extensão, lucidez e moderação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Portanto
  rationale: As duas partículas introduzem uma conclusão enfática com base no contexto anterior. “Portanto” expressa naturalmente essa inferência em português sem tornar a frase pesada.
- source_word: μὴ καθεύδωμεν
  choice: não durmamos
  rationale: O subjuntivo presente com μή forma uma exortação coletiva. A tradução preserva a imagem do sono, usada aqui em sentido ético e espiritual.
- source_word: ὡς οἱ λοιποί
  choice: como os demais
  rationale: A expressão designa os outros em contraste com os destinatários. “Os demais” é claro, conciso e não acrescenta uma identificação ausente do texto.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca o contraste direto entre dormir e manter-se acordado; “mas” é o equivalente mais simples e natural.
- source_word: γρηγορῶμεν
  choice: fiquemos acordados
  rationale: O verbo pode indicar estar desperto ou manter vigilância. Esta escolha preserva o contraste verbal imediato com “não durmamos”, enquanto a nota registra a nuance de vigilância.
- source_word: νήφωμεν
  choice: sejamos sóbrios
  rationale: O verbo denota sobriedade e, por extensão, lucidez, domínio próprio e prontidão mental. “Sejamos sóbrios” conserva a imagem lexical e sua amplitude.
theological_decisions:
- issue: Força metafórica do sono e da vigília
  choice: Conservar no texto principal as imagens de dormir e ficar acordado como exortação ética e espiritual.
  alternative: Parafrasear como negligência moral em contraste com vigilância.
  rationale: O contexto contrapõe os filhos da luz aos associados à noite. Preservar a metáfora mantém a tensão e a linguagem teológica de Paulo sem explicá-las excessivamente.
- issue: Sentido de νήφω
  choice: Traduzir por “sejamos sóbrios”.
  alternative: “tenhamos domínio próprio” ou “mantenhamos a mente lúcida”.
  rationale: O termo pode reunir sobriedade literal, lucidez e autocontrole. A formulação escolhida conserva essa amplitude em vez de reduzi-la a uma única virtude abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção exortativa na primeira pessoa do plural acompanha o grego; as imagens centrais foram preservadas sem paráfrase denominacional.
