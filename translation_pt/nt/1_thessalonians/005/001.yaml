source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: pt
  text: Quanto aos tempos e às épocas[a], irmãos[b], vocês não precisam que nada lhes seja escrito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tempos e épocas” é uma expressão emparelhada que se refere a períodos e ocasiões determinadas, especialmente neste contexto sobre os acontecimentos futuros.
    reason: cultural_note
  - marker: b
    text: Ou “irmãos e irmãs”; o grego diz literalmente “irmãos” e provavelmente se dirige a toda a comunidade dos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Περί introduz o assunto, e δέ sinaliza uma transição discursiva. “Quanto a” é natural em português e marca a mudança de tema sem acrescentar um “agora” temporal nem enfatizar contraste.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: aos tempos e às épocas
  rationale: χρόνος pode indicar o tempo em sua extensão, enquanto καιρός frequentemente designa uma ocasião ou período determinado. “Tempos e épocas” preserva a expressão coordenada e alguma distinção lexical sem impor uma precisão ausente do texto.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo plural é formalmente masculino, mas neste contexto provavelmente se dirige a toda a comunidade cristã. “Irmãos” mantém a forma do grego; a abrangência comunitária é esclarecida em nota.
- source_word: οὐ χρείαν ἔχετε
  choice: vocês não precisam
  rationale: A expressão idiomática indica ausência de necessidade. Esta formulação é direta e corrente em português.
- source_word: ὑμῖν γράφεσθαι
  choice: que nada lhes seja escrito
  rationale: A construção conserva a voz passiva e deixa implícito quem escreveria, como no grego. “Nada” explicita naturalmente em português o conteúdo indefinido exigido pela construção negativa, sem identificar um autor.
theological_decisions:
- issue: Forma de tratamento dirigida à igreja
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução principal preserva o masculino plural ἀδελφοί, enquanto a nota registra que, no uso comunitário, o termo provavelmente abrange homens e mulheres.
- issue: Relação entre χρόνοι e καιροί no contexto escatológico
  choice: tempos e épocas
  alternative: tempos e momentos determinados
  rationale: A formulação mantém a expressão emparelhada e sua tensão sem definir de modo excessivo se καιροί são momentos divinamente designados, estações ou períodos oportunos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para a segunda pessoa plural e “lhes” como objeto indireto. A ordem da frase segue de perto o desenvolvimento do grego, mas evita rigidez sintática.
