  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: pt
  text: A graça de nosso Senhor Jesus Cristo esteja com vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Nas bênçãos finais paulinas, χάρις designa o favor divino como realidade teológica; “graça” é o equivalente português consagrado, preciso e natural.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o título cristológico e seu peso teológico na fórmula “nosso Senhor Jesus Cristo”.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: Χριστοῦ
  choice: Cristo
  rationale: Nesta fórmula cristológica fixa, “Jesus Cristo” é a expressão natural e amplamente reconhecida em português; “Messias” explicit aria o sentido titular, mas seria menos natural neste encerramento.
- source_word: μεθ’ ὑμῶν
  choice: esteja com vocês
  rationale: O grego traz literalmente “com vocês” numa fórmula nominal de bênção; “esteja” explicita em português o verbo elíptico sem acrescentar a modalidade mais livre de “que” ou “seja”.
theological_decisions:
- issue: Tradução de Χριστοῦ na fórmula paulina de encerramento
  choice: Cristo
  alternative: Messias
  rationale: Embora Χριστός tenha origem e sentido titular (“Messias”), na sequência Ἰησοῦ Χριστοῦ desta fórmula ele funciona de modo fortemente associado ao nome. “Jesus Cristo” preserva a forma cristológica reconhecida sem negar o sentido messiânico do termo.
- issue: Força da bênção verbalmente elíptica
  choice: esteja com vocês
  alternative: que esteja com vocês
  rationale: O original não contém verbo nem partícula optativa expressa. A tradução fornece apenas o verbo necessário para uma frase portuguesa natural, preservando a concisão da bênção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” representa naturalmente o plural ὑμῶν; “nosso Senhor” mantém a formulação litúrgica sem soar arcaica.
