  text: Brothers[a], pray for us.
translation:
  language: pt
  text: Irmãos[a], orem por nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Irmãos e irmãs”, pois esta forma de tratamento provavelmente inclui toda a congregação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Irmãos
  rationale: Vocativo plural de ἀδελφός. “Irmãos” preserva a forma masculina do grego e é uma maneira natural e digna de dirigir-se à comunidade; a provável inclusão de mulheres na referência é registrada em nota.
- source_word: προσεύχεσθε
  choice: orem
  rationale: Imperativo presente, segunda pessoa do plural, de προσεύχομαι. “Orem” expressa naturalmente o pedido em português. Embora o presente possa sugerir ação continuada, explicitar “continuem orando” daria aqui uma ênfase maior do que o texto exige.
- source_word: περὶ
  choice: por
  rationale: Com o genitivo ἡμῶν, περί introduz aqueles em favor de quem se pede oração. “Por nós” é a formulação idiomática em português.
- source_word: ἡμῶν
  choice: nós
  rationale: Pronome de primeira pessoa do plural, regido por περί. “Nós” mantém a referência a Paulo e seus colaboradores sem acrescentar identificação não expressa no versículo.
theological_decisions:
- issue: Forma masculina Ἀδελφοί dirigida provavelmente a uma congregação mista
  choice: Irmãos
  alternative: Irmãos e irmãs
  rationale: O texto principal conserva a forma gramatical masculina do grego, enquanto a nota registra que, no contexto, o chamado provavelmente abrange toda a congregação, incluindo homens e mulheres.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal brasileira de ampla compreensão. A frase breve e direta do original foi preservada.
