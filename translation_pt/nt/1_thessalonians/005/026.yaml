  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: pt
  text: Saúdem todos os irmãos com um beijo santo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os irmãos e irmãs”, pois “irmãos” pode se referir a toda a comunidade dos que creem.
    reason: lexical_alternative
  - marker: b
    text: O “beijo santo” era um sinal culturalmente reconhecido de comunhão e afeto entre os cristãos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saúdem
  rationale: Imperativo aoristo médio na segunda pessoa do plural, empregado como exortação direta. “Saúdem” é natural, conciso e preserva o sentido social de ἀσπάζομαι.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: O grego emprega o plural masculino de ἀδελφός. “Irmãos” conserva a forma do texto-fonte; uma nota registra que, no contexto da comunidade cristã, a referência pode abranger irmãos e irmãs.
- source_word: πάντας
  choice: todos
  rationale: Modifica “os irmãos” e enfatiza a totalidade do grupo, correspondendo diretamente a πάντας.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: com um beijo santo
  rationale: A preposição ἐν indica aqui meio ou modo e se expressa naturalmente por “com”. φίλημα significa “beijo”, e ἁγίῳ o caracteriza como santo no âmbito da comunhão cristã.
theological_decisions:
- issue: Alcance de ἀδελφοί em contexto congregacional
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, por isso o texto principal mantém “irmãos”. Como o referente pode ser toda a comunidade cristã, a possibilidade inclusiva é preservada em nota, sem eliminar a forma presente no original.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. A expressão tradicional “beijo santo” preserva a formulação concreta e cultural do original.
