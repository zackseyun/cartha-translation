base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: pt
  text: Não desprezem as profecias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declarações proféticas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: as profecias
  rationale: O acusativo plural refere-se a manifestações ou expressões de profecia. “As profecias” preserva o plural grego, é natural em português e evita restringir o termo a um mecanismo específico.
- source_word: μὴ
  choice: Não
  rationale: Com o imperativo presente, expressa uma proibição simples. “Não” transmite a força adequada sem intensificá-la indevidamente com “nunca”.
- source_word: ἐξουθενεῖτε
  choice: desprezem
  rationale: O verbo significa considerar sem valor, desdenhar ou tratar com desprezo. “Desprezem” é conciso, corrente e mantém uma força semântica mais ampla que apenas “rejeitem”.
theological_decisions:
- issue: Sentido de “profecias” no contexto da comunidade cristã primitiva
  choice: Manter o termo amplo “profecias”
  alternative: “declarações proféticas” ou “mensagens apresentadas como vindas de Deus”
  rationale: O grego não define aqui o mecanismo nem resolve debates doutrinários posteriores. A tradução direta preserva a amplitude do termo e a tensão teológica sem adotar uma posição denominacional.
translation_notes:
  register: Português moderno, claro e digno, com imperativo na segunda pessoa do plural expresso pela forma brasileira amplamente compreensível “não desprezem”. O artigo definido torna a frase natural em português sem alterar o referente plural do grego.
