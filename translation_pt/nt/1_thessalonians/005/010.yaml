id: 1TH.5.10
reference: 1 Thessalonians 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: pt
  text: que morreu por nós, para que, quer estejamos acordados, quer estejamos dormindo, vivamos juntamente com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quer estejamos vigilantes, quer estejamos dormindo”. A expressão pode retomar a exortação à vigilância no contexto imediato, embora aqui provavelmente se refira a crentes que estejam vivos ou que já tenham morrido.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: que morreu
  rationale: O particípio aoristo modifica o antecedente implícito do versículo anterior, o Senhor Jesus Cristo. A oração relativa é natural em português e mantém a relação sintática.
- source_word: περὶ ἡμῶν
  choice: por nós
  rationale: Neste contexto soteriológico, περί com o genitivo tem o sentido de benefício ou representação. “Por nós” é natural e não especifica além do texto a natureza exata da morte.
- source_word: ἵνα
  choice: para que
  rationale: Expressa propósito ou resultado pretendido de maneira clara e corrente.
- source_word: γρηγορῶμεν
  choice: estejamos acordados
  rationale: Preserva a imagem de vigília e permite tanto a leitura de estar vivo quanto a possível ressonância ética de permanecer vigilante.
- source_word: καθεύδωμεν
  choice: estejamos dormindo
  rationale: Mantém o paralelo metafórico com “acordados”. No contexto, provavelmente alude aos crentes que morreram, sem eliminar a ressonância da exortação à vigilância.
- source_word: ἅμα σὺν αὐτῷ
  choice: juntamente com ele
  rationale: Reproduz a ideia de associação compartilhada expressa por ἅμα e σύν sem soar desnecessariamente repetitivo.
- source_word: ζήσωμεν
  choice: vivamos
  rationale: O subjuntivo sob ἵνα é representado naturalmente pelo subjuntivo português e conserva a força de propósito ou resultado.
theological_decisions:
- issue: Sentido de “acordados” e “dormindo”
  choice: Manter as metáforas no texto, entendendo-as primariamente como referência a estar vivo ou ter morrido.
  alternative: Entendê-las como vigilância ética em contraste com negligência espiritual.
  rationale: A promessa de viver com Cristo, em conexão com 4.13–15, favorece a referência a crentes vivos e mortos. Contudo, a repetição do vocabulário de 5.6–7 mantém uma possível ressonância ética, que não deve ser apagada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A estrutura correlativa “quer... quer...” preserva o contraste grego; “juntamente com ele” mantém a ênfase da expressão ἅμα σὺν αὐτῷ.
