id: 1TH.2.18
reference: 1 Thessalonians 2:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: pt
  text: Pois quisemos ir até vocês — eu, Paulo, mais de uma vez[a] —, mas Satanás nos impediu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma vez e duas vezes”, expressão que significa “mais de uma vez”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Pois
  rationale: Introduz a razão ou explicação do que foi dito anteriormente. “Pois” preserva essa ligação explicativa de modo natural em português.
- source_word: ἠθελήσαμεν
  choice: quisemos
  rationale: O aoristo resume a vontade efetiva de Paulo e seus companheiros; “quisemos” expressa a volição sem acrescentar a ideia mais específica de planejamento.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: ir até vocês
  rationale: Em português, do ponto de vista de quem escreve estando distante dos destinatários, “ir até vocês” expressa naturalmente o movimento em direção a eles, sem acrescentar explicitamente “visitar” ou “voltar”.
- source_word: ἐγὼ μὲν Παῦλος
  choice: eu, Paulo
  rationale: Destaca Paulo dentro do “nós” sem criar em português uma construção artificial para μέν, que aqui não exige um contraste expresso correspondente.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: mais de uma vez
  rationale: A expressão idiomática, literalmente “uma vez e duas vezes”, indica tentativas em mais de uma ocasião. A formulação escolhida comunica o sentido com clareza, enquanto a forma literal é preservada em nota.
- source_word: ἐνέκοψεν
  choice: impediu
  rationale: O verbo descreve uma obstrução que interrompeu a realização da viagem. “Impediu” é corrente e expressa o resultado no contexto sem explicar de que modo ocorreu.
- source_word: ὁ Σατανᾶς
  choice: Satanás
  rationale: Mantém a designação pessoal tradicional e transparente no uso bíblico português.
theological_decisions:
- issue: A atuação de Satanás como obstáculo à viagem de Paulo
  choice: mas Satanás nos impediu
  alternative: mas o Adversário nos deteve
  rationale: O texto atribui explicitamente a Satanás a ação de obstruir a viagem. A tradução mantém essa agência pessoal sem convertê-la em mera circunstância impessoal nem explicar o meio ou o alcance teológico da ação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo no Brasil e compreensão internacional. Os travessões preservam a intervenção enfática de Paulo dentro da declaração no plural.
