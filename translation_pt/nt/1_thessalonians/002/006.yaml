  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: pt
  text: nem buscando glória da parte de pessoas[a], nem de vocês, nem de outros,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “honra” ou “elogio”, em vez de “glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: buscando
  rationale: O particípio presente indica uma ação contínua ligada ao sujeito implícito no contexto; “buscando” preserva esse aspecto sem atribuir uma motivação além do que o grego afirma.
- source_word: ἐξ ἀνθρώπων
  choice: da parte de pessoas
  rationale: ἄνθρωποι tem referência humana genérica, não especificamente masculina. “Da parte de pessoas” expressa naturalmente a origem da glória pretendida.
- source_word: δόξαν
  choice: glória
  rationale: Neste contexto, δόξα se refere à estima ou aclamação humana. “Glória” mantém a ligação lexical com o uso amplo do termo no Novo Testamento, enquanto a nota registra alternativas contextuais naturais.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: nem ... nem ... nem
  rationale: A repetição de “nem” reproduz com clareza e naturalidade a estrutura correlativa negativa do grego e conecta a oração ao contexto anterior.
- source_word: ἀφ’ ὑμῶν
  choice: de vocês
  rationale: Traduz diretamente a referência à segunda pessoa do plural e é natural no português moderno com ampla legibilidade brasileira.
- source_word: ἀπ’ ἄλλων
  choice: de outros
  rationale: Expressa de modo conciso as demais pessoas além dos tessalonicenses, sem acrescentar uma especificação ausente no texto.
theological_decisions:
- issue: Natureza da δόξα buscada
  choice: glória procedente de seres humanos
  alternative: honra ou elogio humano
  rationale: A expressão ἐξ ἀνθρώπων identifica claramente seres humanos como a fonte. A tradução não confunde essa aclamação com a glória de Deus e preserva o termo lexical mais amplo por meio de “glória”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” comunica naturalmente a segunda pessoa do plural; a vírgula final reflete que o fragmento continua sintaticamente no contexto.
