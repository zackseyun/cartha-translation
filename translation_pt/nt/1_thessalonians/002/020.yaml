  text: For you are our glory and joy[a].
translation:
  language: pt
  text: Pois vocês são a nossa glória e a nossa alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “honra” ou “motivo de orgulho”, em vez de “glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: vocês
  rationale: Pronome de segunda pessoa do plural expresso com valor enfático. “Vocês” é natural e amplamente compreensível, e sua posição preserva a ênfase sem acrescentar “mesmos”.
- source_word: γάρ
  choice: pois
  rationale: Introduz a explicação ou razão da afirmação anterior; “pois” mantém de modo conciso a ligação lógica.
- source_word: ἐστε
  choice: são
  rationale: Presente do indicativo do verbo “ser”, traduzido diretamente pela cópula portuguesa.
- source_word: ἡ δόξα ἡμῶν
  choice: a nossa glória
  rationale: Preserva o termo central δόξα, o possessivo plural e o artigo, mantendo a força retórica e a amplitude semântica do grego.
- source_word: χαρά
  choice: alegria
  rationale: Equivalente nominal direto e corrente para a alegria ou satisfação que os tessalonicenses representam para Paulo e seus companheiros.
theological_decisions:
- issue: Sentido de δόξα numa declaração interpessoal paulina
  choice: glória
  alternative: honra; motivo de orgulho
  rationale: “Glória” conserva a amplitude e a força do termo grego sem reduzir a declaração a autossatisfação. No contexto, os tessalonicenses são a honra ou o motivo de exultação dos missionários.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para a segunda pessoa do plural e repetição de “a nossa” para refletir a estrutura enfática do grego.
