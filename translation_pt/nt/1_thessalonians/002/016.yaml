reference: 1 Thessalonians 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: pt
  text: impedindo-nos de falar aos gentios para que sejam salvos, de modo que sempre completam a medida dos seus pecados. Mas a ira veio sobre eles por fim.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “completamente”, “plenamente” ou “até o fim”, em vez de “por fim” (grego: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: “Ira” provavelmente se refere ao juízo divino, mas Paulo não especifica aqui se tem em vista um juízo histórico presente, o juízo final ou ambos.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: impedindo-nos
  rationale: O particípio presente dá continuidade à descrição anterior e expressa uma ação persistente de obstrução, sem sugerir necessariamente uma proibição legal.
- source_word: τοῖς ἔθνεσιν
  choice: aos gentios
  rationale: Neste contexto paulino, refere-se aos não judeus, e não a nações como entidades políticas.
- source_word: λαλῆσαι
  choice: de falar
  rationale: Tradução direta do infinitivo dependente de κωλυόντων; o conteúdo evangelístico é fornecido pelo contexto e pela oração seguinte.
- source_word: ἵνα σωθῶσιν
  choice: para que sejam salvos
  rationale: Preserva tanto a finalidade da oração com ἵνα quanto a voz passiva e o peso teológico de σῴζω.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: de modo que ... completam
  rationale: Conserva a possível força consecutiva da construção sem afirmar que completar os pecados era a intenção consciente dos opositores.
- source_word: ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας
  choice: completam a medida dos seus pecados
  rationale: A expressão comunica a ideia de levar os pecados à plenitude; 'a medida' explicita em português a imagem idiomática implícita no verbo.
- source_word: πάντοτε
  choice: sempre
  rationale: Reproduz o advérbio de maneira direta e o liga ao padrão persistente de completar a medida dos pecados.
- source_word: ἔφθασεν ... ἐπ’ αὐτούς
  choice: veio sobre eles
  rationale: Expressa a chegada da ira sobre os referentes sem decidir entre os matizes de alcançar, chegar ou surpreender.
- source_word: ὀργή
  choice: ira
  rationale: Preserva a intensidade e a provável dimensão divina do termo sem substituí-lo pelo mais interpretativo 'juízo'.
- source_word: εἰς τέλος
  choice: por fim
  rationale: É uma formulação portuguesa natural para a leitura temporal ou culminante, enquanto a nota registra os sentidos possíveis de plenitude e completude.
theological_decisions:
- issue: Referente e alcance de 'ira'
  choice: Manter 'ira' sem especificar o evento ou o momento do juízo.
  alternative: Entender a expressão exclusivamente como um juízo histórico já ocorrido, exclusivamente como o juízo final, ou como uma antecipação que reúne ambos.
  rationale: Paulo não identifica aqui um acontecimento específico; a tradução preserva a tensão entre juízo presente, histórico e escatológico.
- issue: Força de εἰς τὸ ἀναπληρῶσαι
  choice: Expressar consequência mediante 'de modo que'.
  alternative: 'Traduzir como finalidade explícita: ''a fim de completarem''.'
  rationale: A formulação evita atribuir aos opositores a intenção consciente de completar seus pecados, sem eliminar a relação forte estabelecida pela construção grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Gentios' conserva o termo bíblico corrente; 'de modo que' mantém a relação lógica sem impor uma finalidade consciente. Os dois marcadores foram colocados após a frase final porque ambos esclarecem expressões dessa oração.
