id: 1TH.2.2
reference: 1 Thessalonians 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: pt
  text: Mas, depois de já termos sofrido e sido tratados de modo humilhante[a] em Filipos, como vocês sabem, tivemos ousadia em nosso Deus[b] para falar a vocês do evangelho de Deus em meio a grande luta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tratados com ultraje», «insultados» ou «maltratados». O verbo grego inclui a ideia de tratamento insolente e desonroso.
    reason: lexical_alternative
  - marker: b
    text: Ou «falamos com ousadia em nosso Deus». O verbo grego pode incluir em si o ato de falar com franqueza; no texto, «tivemos ousadia» foi separado de «falar» para refletir o infinitivo que vem em seguida.
    reason: lexical_alternative
  - marker: c
    text: Ou «em meio a grande conflito» ou «sob forte oposição».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com o pensamento anterior de maneira natural em português.
- source_word: προπαθόντες
  choice: depois de já termos sofrido
  rationale: O particípio aoristo indica sofrimento anterior à ação principal, e «já» comunica o valor de anterioridade do prefixo προ- sem tornar a frase artificial.
- source_word: ὑβρισθέντες
  choice: sido tratados de modo humilhante
  rationale: O verbo expressa tratamento insolente e ultrajante, associado à desonra, e não apenas insulto verbal.
- source_word: καθὼς οἴδατε
  choice: como vocês sabem
  rationale: Reproduz com clareza e naturalidade o apelo parentético ao conhecimento dos tessalonicenses.
- source_word: ἐν Φιλίπποις
  choice: em Filipos
  rationale: Emprega a forma portuguesa consagrada do topônimo.
- source_word: ἐπαρρησιασάμεθα
  choice: tivemos ousadia
  rationale: O verbo denota falar ou agir com franqueza e coragem; esta formulação evita duplicar o ato de falar, expresso pelo infinitivo seguinte.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: em nosso Deus
  rationale: Preserva a formulação relacional e a possível ideia de esfera ou fundamento, sem reduzi-la a um sentido meramente instrumental.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: para falar a vocês
  rationale: Mantém a simplicidade de λαλέω e a direção do discurso indicada por πρὸς ὑμᾶς.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: do evangelho de Deus
  rationale: Conserva a expressão paulina familiar e a ambiguidade própria do genitivo, que pode apontar para origem, pertencimento ou conteúdo relacionado a Deus.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: em meio a grande luta
  rationale: ἀγών pode designar luta, conflito, esforço intenso ou oposição; «grande luta» preserva essa amplitude melhor que uma especificação exclusiva de oposição externa.
theological_decisions:
- issue: Sentido de ἐν τῷ θεῷ ἡμῶν
  choice: em nosso Deus
  alternative: por nosso Deus; mediante nosso Deus; confiados em nosso Deus
  rationale: A expressão pode indicar esfera, fundamento ou relação. A tradução formal «em nosso Deus» conserva essa tensão e evita definir Deus apenas como causa instrumental da ousadia apostólica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A ordem de «em Filipos» foi mantida junto aos sofrimentos, enquanto «como vocês sabem» permanece como observação parentética. Conservou-se a expressão menos idiomática, mas teologicamente aberta, «em nosso Deus», esclarecida em nota.
