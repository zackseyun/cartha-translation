source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: pt
  text: Pois qual é a nossa esperança, ou alegria, ou coroa de que nos orgulhamos — não são vocês também? — diante de nosso Senhor Jesus, na sua vinda[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sua presença” ou “na sua chegada”. O termo grego παρουσία pode indicar presença ou chegada; neste contexto, refere-se à futura vinda do Senhor Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: qual
  rationale: Embora τίς possa significar “quem” ou “qual”, “qual é” concorda naturalmente com os substantivos abstratos “esperança”, “alegria” e “coroa”; a identificação posterior com “vocês” preserva o efeito da pergunta retórica.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a ligação explicativa com o contexto anterior sem a omitir.
- source_word: ἐλπίς
  choice: esperança
  rationale: É o equivalente português direto e preserva o sentido paulino de expectativa confiante.
- source_word: χαρά
  choice: alegria
  rationale: Tradução direta, natural e adequada à força afetiva do termo.
- source_word: στέφανος καυχήσεως
  choice: coroa de que nos orgulhamos
  rationale: στέφανος designa uma coroa ou grinalda honorífica, e καύχησις indica o orgulho ou a exultação associados a ela. A formulação evita a conotação predominantemente negativa que “coroa de orgulho” pode ter no português atual e conserva a imagem e a retórica de Paulo.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: não são também vocês?
  rationale: A pergunta espera resposta afirmativa; “também” representa καί, e a formulação plural concorda naturalmente com “vocês”.
- source_word: ἔμπροσθεν
  choice: diante de
  rationale: Expressa de modo conciso e natural a ideia de estar perante alguém.
- source_word: κυρίου
  choice: Senhor
  rationale: É a tradução cristológica padrão de κύριος neste contexto.
- source_word: παρουσίᾳ
  choice: vinda
  rationale: No contexto escatológico paulino, παρουσία se refere à futura vinda ou chegada de Jesus. A amplitude lexical do termo é preservada em nota.
theological_decisions:
- issue: Tradução de παρουσίᾳ em contexto escatológico
  choice: vinda
  alternative: presença ou chegada
  rationale: “Vinda” comunica com clareza a referência escatológica neste contexto, enquanto a nota preserva os sentidos lexicais de “presença” e “chegada” sem eliminar a tensão semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão preserva a pergunta parentética enfática do grego. “Vocês” oferece clareza e naturalidade internacional com forte legibilidade no Brasil.
