id: 1TH.2.10
reference: 1 Thessalonians 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: pt
  text: Vocês são testemunhas[a], e Deus também, de como nos comportamos de modo piedoso, justo e irrepreensível para com vocês que creem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase também pode ser traduzida: “Vocês e Deus são testemunhas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre vocês que creem”, em vez de “para com vocês que creem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Vocês são testemunhas, e Deus também
  rationale: A cópula implícita é explicitada em português, preservando a ênfase que primeiro apela aos tessalonicenses e depois a Deus.
- source_word: ὡς
  choice: de como
  rationale: Introduz a maneira da conduta dos missionários e se liga naturalmente, em português, ao apelo às testemunhas.
- source_word: ὁσίως
  choice: de modo piedoso
  rationale: Expressa uma conduta marcada pela devoção e pelo respeito a Deus; evita tanto o arcaísmo quanto uma possível leitura de santidade absoluta.
- source_word: δικαίως
  choice: justo
  rationale: No paralelismo adverbial, a construção «de modo piedoso, justo e irrepreensível» permite que os três adjetivos descrevam naturalmente a maneira da conduta.
- source_word: ἀμέμπτως
  choice: irrepreensível
  rationale: Indica conduta contra a qual não cabe acusação válida, sem necessariamente afirmar perfeição moral absoluta.
- source_word: ὑμῖν
  choice: para com vocês
  rationale: Preserva a orientação relacional do dativo; «entre vocês» também é possível no contexto.
- source_word: τοῖς πιστεύουσιν
  choice: os que creem
  rationale: Mantém a força verbal do particípio presente substantivado e identifica os destinatários como aqueles que creem.
- source_word: ἐγενήθημεν
  choice: nos comportamos
  rationale: Com os advérbios de maneira, γίνομαι descreve idiomaticamente como Paulo e seus companheiros agiram; esta formulação é clara e natural em português.
theological_decisions:
- issue: Descrições éticas da conduta apostólica
  choice: Os três termos descrevem a conduta efetiva dos missionários diante de Deus e dos que creem.
  alternative: Entender a linguagem como mera retórica defensiva ou como afirmação de perfeição moral absoluta.
  rationale: O texto faz um apelo solene a testemunhas humanas e divina quanto à integridade observável dos missionários, sem definir essa irrepreensibilidade como impecabilidade absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» corresponde ao plural explícito ὑμεῖς. A sequência coordenada preserva os três aspectos distintos da conduta, sem transformar «irrepreensível» em alegação de perfeição sem pecado.
