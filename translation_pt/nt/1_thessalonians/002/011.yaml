  text: Vocês sabem como tratávamos cada um de vocês, como um pai trata os próprios filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: assim como
  rationale: Introduz a comparação e apela ao conhecimento que os tessalonicenses tinham da conduta dos remetentes; «assim como» preserva essa força em português natural.
- source_word: οἴδατε
  choice: vocês sabem
  rationale: Embora οἶδα tenha forma de perfeito, normalmente expressa um estado presente de conhecimento; o presente é adequado em português.
- source_word: ὡς (primeira ocorrência)
  choice: como
  rationale: Introduz o conteúdo conhecido. Na formulação portuguesa, seu valor é expresso pela construção global «vocês sabem ... como» sem tornar a frase artificial.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: cada um de vocês
  rationale: Preserva a forte ideia distributiva e destaca a atenção individual dada aos destinatários.
- source_word: ὡς (segunda ocorrência)
  choice: como
  rationale: Marca a comparação entre a conduta dos remetentes e a de um pai.
- source_word: πατὴρ
  choice: um pai
  rationale: O substantivo sem artigo tem sentido qualitativo na comparação; «um pai» é a expressão natural em português.
- source_word: τέκνα
  choice: filhos
  rationale: τέκνα é um termo amplo para os filhos de uma família, sem restringir o sexo; no plural genérico, «filhos» é natural e inclusivo no português corrente.
- source_word: ἑαυτοῦ
  choice: seus próprios
  rationale: O reflexivo enfatiza que se trata dos próprios filhos do pai, nuance preservada por «próprios».
- source_word: '[ideia verbal elíptica suprida pelo contexto]'
  choice: tratamos ... como ... trata
  rationale: A oração grega é elíptica e depende da frase ao redor. «Tratamos» fornece em português uma ação ampla, sem reduzi-la indevidamente a apenas uma das ações pastorais especificadas no contexto.
theological_decisions:
- issue: Suprimento da ação verbal implícita numa oração elíptica
  choice: Empregar o verbo amplo «tratamos» e repetir «trata» na comparação.
  alternative: Manter uma formulação fragmentária, «assim como vocês sabem como cada um de vocês, como um pai seus próprios filhos», ou suprir uma ação mais específica, como «exortamos».
  rationale: O grego citado não constitui sozinho uma frase completa e recebe seu sentido verbal do contexto. A solução ampla produz português inteligível, conserva a imagem paterna e evita privilegiar uma única ação pastoral entre as várias mencionadas na frase maior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome «vocês» corresponde ao plural do original. A repetição «como um pai trata» explicita apenas a relação verbal exigida pelo português e mantém visível a elipse em nota.
