source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: pt
  text: 'E por isso nós também agradecemos continuamente a Deus, porque, quando receberam a palavra de Deus que ouviram de nós[a], vocês a acolheram não como palavra humana, mas como aquilo que ela verdadeiramente é: palavra de Deus[b], a qual[c] também atua em vocês que creem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mensagem de Deus que ouviram de nós”. A expressão grega é compacta e pode ser desdobrada de mais de uma forma natural em português.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não como palavra de seres humanos, mas, como verdadeiramente é, como palavra de Deus”.'
    reason: lexical_alternative
  - marker: c
    text: 'O pronome relativo também pode ser entendido como referência a Deus: “o qual também atua em vocês que creem”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Preserva a ligação causal com o contexto anterior de modo natural e conciso em português.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: agradecemos continuamente a Deus
  rationale: Mantém o aspecto presente e a ideia de ação reiterada, em linguagem atual e digna.
- source_word: παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: quando receberam de nós a palavra de Deus que ouviram
  rationale: Descompacta a construção genitiva grega em ordem natural no português, preservando tanto a recepção por meio dos apóstolos quanto a identificação da mensagem como palavra de Deus.
- source_word: ἐδέξασθε
  choice: vocês a acolheram
  rationale: Distingue a aceitação favorável expressa por δέχομαι da recepção inicial expressa por παραλαμβάνω.
- source_word: οὐ λόγον ἀνθρώπων
  choice: não como palavra humana
  rationale: Expressa o valor qualitativo do plural genérico sem recorrer ao masculino genérico potencialmente ambíguo em português moderno.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: 'mas como aquilo que ela verdadeiramente é: palavra de Deus'
  rationale: Conserva a afirmação enfática e o contraste retórico, usando os dois-pontos para tornar clara a aposição em português.
- source_word: ἐνεργεῖται
  choice: atua
  rationale: Comunica a atividade eficaz e contínua sem decidir indevidamente entre nuances média e passiva da forma grega.
- source_word: τοῖς πιστεύουσιν
  choice: em vocês que creem
  rationale: Reproduz naturalmente o particípio presente como característica contínua dos destinatários.
theological_decisions:
- issue: Referente do pronome relativo ὃς
  choice: 'A oração relativa se refere à palavra de Deus: “a qual também atua”.'
  alternative: 'O pronome pode ser entendido como referência a Deus: “o qual também atua”.'
  rationale: λόγον é o antecedente imediato, tem o mesmo gênero e número do pronome e se ajusta à ênfase na eficácia da palavra proclamada. Como θεοῦ também permite a referência a Deus, a alternativa é preservada em nota.
- issue: Sentido de λόγον θεοῦ na pregação apostólica
  choice: palavra de Deus
  alternative: mensagem de Deus
  rationale: A repetição de “palavra” preserva o contraste explícito entre palavra humana e palavra de Deus, sem ampliar a afirmação para além do que o versículo declara.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Emprega “vocês” para o plural dos destinatários, evita arcaísmos e preserva a dignidade do discurso. A distinção entre “receberam” e “acolheram” representa os dois verbos gregos; as notas mantêm a compressão sintática e a ambiguidade real do pronome relativo.
