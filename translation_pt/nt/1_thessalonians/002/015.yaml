id: 1TH.2.15
reference: 1 Thessalonians 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: pt
  text: os quais também mataram[a] o Senhor Jesus e os profetas, nos expulsaram[b], não agradam a Deus e são hostis a todas as pessoas[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram morrer”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, fizeram-nos sair ou nos expulsaram; o verbo é mais específico do que a ideia geral de perseguição.
    reason: lexical_alternative
  - marker: c
    text: Gramaticalmente, esta descrição continua a se referir ao grupo identificado no versículo anterior; não deve ser entendida como uma afirmação geral sobre todos os judeus de todas as épocas e lugares.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: mataram
  rationale: O particípio aoristo significa matar ou fazer morrer. “Mataram” é claro e natural, sem acrescentar a noção específica de assassinato premeditado.
- source_word: κύριον
  choice: Senhor
  rationale: Título cristológico consagrado e equivalente normal de κύριος neste contexto.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: προφήτας
  choice: os profetas
  rationale: Preserva o artigo e a referência à reconhecida sucessão dos profetas de Deus.
- source_word: ἐκδιωξάντων
  choice: nos expulsaram
  rationale: Mantém o sentido concreto de fazer sair ou expulsar, mais específico do que o sentido geral de perseguir.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: não agradam a Deus
  rationale: Expressa de modo natural em português o particípio presente e sua caracterização contínua.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: são hostis a todas as pessoas
  rationale: Comunica a ideia de oposição ou hostilidade e verte ἀνθρώποις de modo inclusivo e natural.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: os quais também mataram ... nos expulsaram ... não agradam ... e são hostis ...
  rationale: A oração relativa preserva a ligação gramatical com o grupo mencionado no versículo anterior e mantém a sequência retórica dos particípios.
- source_word: καὶ
  choice: também / e
  rationale: O primeiro καί indica acréscimo e é vertido por “também”; os demais são representados pela coordenação e pela pontuação natural do português.
theological_decisions:
- issue: Referência da descrição participial
  choice: A descrição continua a referência ao grupo identificado no versículo anterior.
  alternative: Entender a frase como condenação geral de todos os judeus de todas as épocas.
  rationale: A sintaxe grega liga diretamente os particípios ao antecedente de 2.14. “Os quais” conserva essa ligação sem universalizar a acusação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura relativa mantém a continuidade com 2.14; os tempos verbais distinguem as ações passadas das caracterizações presentes.
