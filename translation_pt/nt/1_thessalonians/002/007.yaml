  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: pt
  text: Embora, como apóstolos do Messias[a], pudéssemos ter sido um peso, tornamo-nos gentis entre vocês, como uma mãe que amamenta cuida com carinho dos próprios filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pudéssemos ter feito exigências” ou “pudéssemos ter exercido nossa autoridade”. O grego diz literalmente “pudéssemos ser/estar em peso” e pode referir-se ao peso de sua posição apostólica, sem se limitar necessariamente a encargo financeiro. Tradicionalmente: “apóstolos de Cristo”.'
    reason: Preserva a metáfora e a amplitude semântica de ἐν βάρει εἶναι, bem como a tradução tradicional de Χριστοῦ.
  - marker: b
    text: Ou “como uma ama” ou “como uma ama de leite”; a imagem é a do cuidado maternal e terno.
    reason: Registra alternativas para τροφός e esclarece a imagem evocada.
lexical_decisions:
- source_word: δυνάμενοι
  choice: Embora pudéssemos
  rationale: O particípio assume valor concessivo diante de ἀλλά; a construção é natural em português.
- source_word: ἐν βάρει εἶναι
  choice: ter feito valer nossa autoridade
  rationale: A expressão significa literalmente “ter peso” e, no contexto, provavelmente aponta para o exercício da posição ou autoridade apostólica, sem restringi-la necessariamente a sustento financeiro.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: como apóstolos do Messias
  rationale: Χριστοῦ funciona aqui como título; “Messias” preserva esse valor, e o genitivo é expresso naturalmente com “do”.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: nós nos tornamos
  rationale: Preserva a força verbal de γίνομαι e marca o contraste com a oração concessiva anterior.
- source_word: ἤπιοι
  choice: gentis
  rationale: Expressa a brandura e delicadeza indicadas pelo adjetivo.
- source_word: ἐν μέσῳ ὑμῶν
  choice: entre vocês
  rationale: Equivalente idiomático e claro em português moderno.
- source_word: ὡς ἐὰν τροφὸς
  choice: como uma mãe que amamenta
  rationale: τροφός designa uma mulher que amamenta e cuida; a formulação comunica claramente a imagem maternal sem sugerir uma profissional clínica.
- source_word: θάλπῃ
  choice: cuida com carinho
  rationale: O verbo parte da ideia de aquecer e, por extensão, descreve cuidado terno e afetuoso.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: dos próprios filhos
  rationale: “Filhos” traduz τέκνα com naturalidade, e “próprios” preserva a ênfase de ἑαυτῆς.
theological_decisions:
- issue: Tradução de Χριστοῦ
  choice: Messias
  alternative: Cristo
  rationale: Neste sintagma, o termo funciona como título; “Messias” torna esse valor explícito, enquanto a forma tradicional é registrada em nota.
- issue: Sentido de ἐν βάρει εἶναι
  choice: ter feito valer nossa autoridade
  alternative: ter sido um peso / ter feito exigências
  rationale: A tradução principal comunica o provável peso da condição apostólica, mas a nota preserva tanto a metáfora literal quanto outras nuances possíveis, inclusive a ideia de encargo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita o pouco natural “ser de peso” no texto principal, mas conserva em nota a metáfora grega e suas possíveis nuances. Os marcadores aparecem no texto em ordem [a], [b].
