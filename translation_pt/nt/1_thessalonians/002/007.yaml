  rationale: Substituí a interpretação mais específica «ter feito valer nossa autoridade» por «ter sido um peso», que reproduz de modo natural a metáfora de ἐν βάρει εἶναι e deixa sua aplicação contextual aberta. Reordenei «como apóstolos do Messias» para ligar a qualificação diretamente à possibilidade expressa no grego. A nota [a] foi corrigida para refletir εἶναι e para distinguir o sentido literal das paráfrases possíveis.
