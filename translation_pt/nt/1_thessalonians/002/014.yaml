source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: pt
  text: Pois vocês, irmãos, tornaram-se imitadores das igrejas de Deus que estão na Judeia e no Messias Jesus, porque também sofreram as mesmas coisas da parte de seus próprios compatriotas, assim como elas da parte dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos judeanos”. O termo grego pode designar os judeus ou, conforme o contexto, os habitantes da Judeia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: tornaram-se imitadores
  rationale: Preserva tanto a ideia explícita de imitação em μιμηταί quanto o aspecto de mudança expresso por ἐγενήθητε.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: É a forma vocativa direta e tradicional; no contexto epistolar, dirige-se representativamente à comunidade inteira.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: igrejas de Deus
  rationale: É a expressão eclesial mais natural e reconhecível em português para ἐκκλησίαι τοῦ θεοῦ.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: que estão na Judeia
  rationale: Expressa de modo natural a identificação geográfica feita pelo particípio grego.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu conteúdo semântico, e mantém a ordem do grego.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: também sofreram as mesmas coisas
  rationale: Mantém a comparação direta e o sentido de padecimento de πάσχω; 'também' representa καί.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: seus próprios compatriotas
  rationale: Comunica a identidade étnica ou cívica compartilhada indicada por συμφυλέται, enquanto 'próprios' preserva a ênfase de ἰδίων.
- source_word: τῶν Ἰουδαίων
  choice: os judeus
  rationale: Mantém o sentido etnorreligioso mais provável no contexto, sem ampliar o referente para todos os judeus indistintamente; a alternativa geográfica é registrada em nota.
theological_decisions:
- issue: Χριστῷ como título ou forma assimilada a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A formulação paulina é convencional, mas Χριστός ainda conserva conteúdo titular; 'Messias' torna esse conteúdo explícito sem resolver indevidamente qualquer questão cristológica.
- issue: Alcance do referente em τῶν Ἰουδαίων
  choice: os judeus
  alternative: os judeanos
  rationale: O texto identifica os agentes dos sofrimentos das igrejas da Judeia, não todo o povo judeu. A tradução retém a designação lexical sem inserir universalização, e a alternativa possível fica em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção foi levemente reorganizada por pontuação para clareza, sem eliminar a comparação entre os tessalonicenses e as igrejas da Judeia. O pronome 'elas' retoma explicitamente 'as igrejas' e evita ambiguidade no último membro.
