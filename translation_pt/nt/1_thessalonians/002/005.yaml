  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: pt
  text: Pois nunca nos apresentamos com discurso bajulador[a], como vocês sabem, nem com um pretexto que encobrisse a ganância[b] — Deus é testemunha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com lisonjas”; literalmente, “em palavra de bajulação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com uma capa para a ganância” ou “com a ganância encoberta por um pretexto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Pois nunca
  rationale: “Pois” mantém a ligação explicativa com o contexto anterior, enquanto οὔτε...ποτε é expresso naturalmente e com ênfase temporal por “nunca”.
- source_word: ἐν λόγῳ κολακείας
  choice: com palavras de bajulação
  rationale: λόγος se refere aqui ao discurso, e κολακεία à bajulação ou lisonja. A formulação conserva o valor circunstancial de ἐν e soa natural em português.
- source_word: ἐγενήθημεν
  choice: nos apresentamos
  rationale: No contexto, γίνομαι descreve como Paulo e seus companheiros se mostraram ou procederam entre os tessalonicenses; “nos apresentamos” evita o literal pouco natural “nos tornamos” sem limitar a frase apenas ao ato de chegar.
- source_word: καθὼς οἴδατε
  choice: como vocês sabem
  rationale: Preserva de modo direto o apelo ao conhecimento pessoal dos destinatários.
- source_word: ἐν προφάσει πλεονεξίας
  choice: com um pretexto para a ganância
  rationale: πρόφασις pode indicar pretexto, aparência ou cobertura; πλεονεξία designa desejo ganancioso de obter mais. A tradução mantém a ideia de um motivo ganancioso encoberto.
- source_word: θεὸς μάρτυς
  choice: Deus é testemunha
  rationale: Reproduz a fórmula solene e concisa do grego sem acrescentar o possessivo “nossa”, que não está explícito.
theological_decisions:
- issue: Alcance da negação de Paulo quanto ao método e aos motivos
  choice: O versículo nega tanto o uso de bajulação no falar quanto a ocultação da ganância sob um pretexto.
  alternative: Entender a frase como condenação de todo recurso retórico ou restringir a ganância exclusivamente à exploração financeira.
  rationale: O grego nomeia especificamente κολακεία e πλεονεξία. A tradução conserva essas acusações concretas sem ampliar a negação a toda retórica nem reduzir a ganância apenas a dinheiro.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para leitura ampla no Brasil. “Bajulação” é claro e atual; “lisonjas” aparece em nota como alternativa. O travessão preserva a força da invocação final.
