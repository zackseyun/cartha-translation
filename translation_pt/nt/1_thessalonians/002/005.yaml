  source_fidelity: A tradução transmite adequadamente as duas negações, a referência ao conhecimento dos destinatários e a invocação final de Deus. Contudo, “um pretexto para a ganância” pode sugerir um pretexto destinado a permitir ou promover a ganância, enquanto ἐν προφάσει πλεονεξίας descreve mais diretamente uma cobertura/pretexto que encobre um motivo ganancioso.
  naturalness: O português é moderno, claro e apropriado. “Com palavras de bajulação” é natural, embora o singular “discurso bajulador” reflita melhor λόγῳ sem tornar o texto menos fluente.
  terminology: “Bajulação”, “ganância” e “Deus é testemunha” são escolhas adequadas. A relação entre πρόφασις e πλεονεξία deve ser explicitada com cautela para não inverter o sentido do genitivo.
