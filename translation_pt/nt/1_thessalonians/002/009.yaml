id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: pt
  text: 'Pois vocês se lembram, irmãos[a], do nosso trabalho e fadiga: trabalhando noite e dia para não sobrecarregar nenhum de vocês, proclamamos a vocês o evangelho de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se inclusivamente a toda a congregação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: vocês se lembram
  rationale: O presente do indicativo na segunda pessoa do plural recorda aos tessalonicenses algo que eles sabem, não lhes dá uma ordem. A forma pronominal é natural em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a forma masculina plural do grego e o modo tradicional e digno de dirigir-se à comunidade; no contexto, pode incluir toda a congregação.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: do nosso trabalho e esforço
  rationale: A dupla comunica atividade árdua e empenho penoso. Os dois termos portugueses mantêm a distinção sem soar redundantes ou artificiais.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: trabalhando noite e dia
  rationale: Reproduz com naturalidade tanto o particípio circunstancial quanto a expressão idiomática de atividade contínua.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: para não sermos pesados a nenhum de vocês
  rationale: A construção expressa propósito. 'Ser pesado a alguém' conserva a imagem de impor encargo material ou prático e é inteligível em português amplo.
- source_word: ἐκηρύξαμεν
  choice: proclamamos
  rationale: Mantém a ideia de anúncio público de κηρύσσω sem limitar o verbo ao uso eclesiástico de 'pregar'.
- source_word: εἰς ὑμᾶς
  choice: a vocês
  rationale: Conserva o sentido direcional mais imediato da preposição, embora 'entre vocês' seja possível no contexto.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: o evangelho de Deus
  rationale: Preserva a expressão paulina reconhecível e deixa aberta a relação do genitivo, que pode envolver origem, pertença ou conteúdo.
theological_decisions:
- issue: Alcance inclusivo de ἀδελφοί
  choice: irmãos no texto principal
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural, mas pode dirigir-se inclusivamente a toda a congregação. O texto mantém a forma lexical, e a nota registra o alcance contextual possível.
- issue: Relação expressa por τοῦ θεοῦ
  choice: evangelho de Deus
  alternative: evangelho que vem de Deus
  rationale: O genitivo não deve ser reduzido apenas à ideia de origem; a tradução formalmente aberta preserva a possível relação de origem, pertença ou conteúdo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por 'vocês' para a segunda pessoa plural. A ordem da frase acompanha o argumento grego sem sacrificar a naturalidade. 'Sermos pesados' conserva a metáfora do original; 'trabalhando noite e dia' sugere o esforço sustentado sem afirmar literalmente trabalho ininterrupto.
