id: 1TH.2.12
reference: 1 Thessalonians 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: pt
  text: encorajando, consolando e exortando vocês a viver de modo digno de Deus,[a] que os chama para o seu próprio Reino e glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a andar de modo digno de Deus”. “Andar” é uma metáfora bíblica para a maneira de viver ou de se conduzir.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: encorajando
  rationale: O particípio descreve uma ação pastoral contínua; “encorajando” preserva o tom familiar do contexto sem excluir a nuance de exortação.
- source_word: παραμυθούμενοι
  choice: consolando
  rationale: Expressa fala que anima e conforta, mantendo alguma distinção em relação a παρακαλοῦντες.
- source_word: μαρτυρόμενοι
  choice: exortando
  rationale: Neste contexto, comunica um apelo solene e insistente de modo natural; “testemunhando” seria mais formalmente literal, mas menos claro em português.
- source_word: εἰς τὸ περιπατεῖν ὑμᾶς
  choice: a viver
  rationale: A construção indica propósito ou resultado. “Viver” transmite de forma clara a metáfora grega de andar como modo de conduta.
- source_word: ἀξίως τοῦ θεοῦ
  choice: de modo digno de Deus
  rationale: Reproduz naturalmente o advérbio e seu complemento genitivo, sem sugerir que alguém possa merecer Deus.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: que os chama
  rationale: O presente preserva o aspecto do particípio sem definir de maneira indevida o momento ou o mecanismo do chamado.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: para o seu próprio Reino e glória
  rationale: “Seu próprio” preserva a ênfase reflexiva de ἑαυτοῦ; Reino e glória permanecem coordenados sob uma só preposição.
theological_decisions:
- issue: Metáfora ética de περιπατεῖν
  choice: viver
  alternative: andar
  rationale: “Viver” torna imediatamente claro que se trata da conduta, enquanto a nota conserva a metáfora bíblica original.
- issue: Força temporal do chamado de Deus
  choice: que os chama
  alternative: que os chamou
  rationale: O presente traduz diretamente o particípio presente e evita impor uma posição doutrinária sobre quando ocorre o chamado.
- issue: Relação entre Reino e glória
  choice: seu próprio Reino e glória
  alternative: seu próprio Reino glorioso
  rationale: A coordenação de dois substantivos foi preservada, sem fundi-los interpretativamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tríade verbal conserva o tom pastoral e a variação semântica do grego. Emprega-se “vocês/os” como plural de segunda pessoa em registro corrente; “Reino” recebe maiúscula editorial por se referir ao Reino de Deus.
