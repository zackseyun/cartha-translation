  source_fidelity: A tradução preserva adequadamente a tríade de particípios (παρακαλοῦντες, παραμυθούμενοι, μαρτυρόμενοι), o propósito expresso por εἰς τό + infinitivo, o sentido ético de περιπατεῖν, o presente de τοῦ καλοῦντος e a ênfase reflexiva de ἑαυτοῦ. “A viver de modo digno de Deus” é uma explicitação idiomática fiel da metáfora de ‘andar’.
