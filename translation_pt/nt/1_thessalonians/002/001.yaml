source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: pt
  text: Pois vocês mesmos sabem, irmãos[a], que a nossa vinda até vocês não foi em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”. O grego diz “irmãos” e muitas vezes emprega a forma masculina para se dirigir a toda a comunidade crente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: vocês mesmos
  rationale: Preserva a força intensiva do pronome, destacando o conhecimento pessoal e direto dos tessalonicenses.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa e argumentativa com o pensamento anterior.
- source_word: οἴδατε
  choice: sabem
  rationale: Embora a forma grega seja formalmente perfeita, οἶδα tem sentido presente usual neste contexto.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Conserva a forma masculina do vocativo grego; no uso paulino, pode abranger toda a comunidade cristã, o que é esclarecido em nota.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: a nossa ida até vocês
  rationale: Expressa naturalmente o movimento e a chegada dos missionários aos tessalonicenses. 'Ida até vocês' evita o tom pouco natural de 'entrada' e não reduz o acontecimento a uma simples visita.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo daquilo que os destinatários sabem.
- source_word: οὐ κενὴ γέγονεν
  choice: não foi em vão
  rationale: Reproduz a expressão idiomática e seu sentido de que a ida não foi vazia, inútil ou sem resultado, sem especificar indevidamente apenas um desses aspectos.
theological_decisions:
- issue: Alcance de ἀδελφοί numa comunidade composta por homens e mulheres
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto principal conserva a forma masculina do grego, enquanto a nota informa que, neste uso, o termo frequentemente se dirige à comunidade crente inteira.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” corresponde ao plural de segunda pessoa sem regionalismo excessivo; “ida até vocês” mantém a direção indicada pelo grego em formulação natural.
