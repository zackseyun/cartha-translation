id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: pt
  text: Assim, ansiando por vocês[a], tínhamos prazer em compartilhar com vocês não só o evangelho de Deus, mas também nossas próprias vidas[b], porque vocês se tornaram queridos para nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo profunda afeição por vocês” ou “desejando muito vocês”; o particípio grego é raro e expressa forte afeto e anseio pessoal.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossas próprias almas” ou “a nós mesmos”; aqui, “vidas” expressa a entrega pessoal e sacrificial dos missionários.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Liga a disposição descrita neste versículo ao modo de cuidado apresentado no contexto anterior, preservando de forma natural a força adverbial.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: por termos tanta afeição por vocês
  rationale: O particípio raro expressa afeição intensa e anseio pessoal. A construção causal é natural em português e explicita sua relação com o verbo principal sem reduzir o conteúdo afetivo.
- source_word: εὐδοκοῦμεν
  choice: tivemos prazer
  rationale: Expressa satisfação voluntária e afetuosa, não mera concordância ou consentimento.
- source_word: μεταδοῦναι
  choice: compartilhar
  rationale: Indica dar a outros uma parte daquilo que é próprio e funciona naturalmente tanto com o evangelho quanto com a própria vida.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: o evangelho de Deus
  rationale: Preserva diretamente o genitivo grego e emprega vocabulário cristão estabelecido e amplamente compreensível.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: a nossa própria vida
  rationale: Neste contexto, ψυχή designa a vida ou o próprio ser entregue em cuidado sacrificial, não especificamente uma parte imaterial da pessoa. O singular coletivo é idiomático em português, e 'própria' conserva a ênfase de ἑαυτῶν.
- source_word: διότι
  choice: porque
  rationale: Introduz claramente a razão da entrega pessoal dos missionários.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: vocês se tornaram muito queridos para nós
  rationale: Conserva a ideia de que passaram a ocupar uma condição de especial afeição para os missionários; 'queridos para nós' é natural e relacional em português.
theological_decisions:
- issue: Sentido de ψυχάς na autodescrição apostólica
  choice: vida
  alternative: almas; nós mesmos
  rationale: O contexto trata da entrega pessoal e sacrificial dos missionários, não de uma distinção antropológica entre corpo e alma. 'Vida' comunica concretamente essa autodoação sem impor uma leitura dualista.
- issue: Força relacional de ἀγαπητοὶ
  choice: muito queridos para nós
  alternative: amados por nós
  rationale: A formulação escolhida preserva o calor afetivo e a relação pessoal sem acrescentar uma conotação técnica ou teológica que não está em primeiro plano.
- issue: Relação do particípio ὁμειρόμενοι com εὐδοκοῦμεν
  choice: 'valor causal: ''por termos tanta afeição'''
  alternative: 'valor modal ou circunstancial: ''tendo tanta afeição'' / ''ansiando por vocês'''
  rationale: O particípio pode ser entendido circunstancialmente, mas a leitura causal comunica de modo natural que a profunda afeição motivou a disposição de compartilhar tanto o evangelho quanto a própria vida; a nota preserva alternativas lexicais próximas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega 'vocês' para o plural e evita tanto arcaísmos quanto linguagem excessivamente coloquial. As notas preservam a amplitude semântica dos termos gregos raros ou potencialmente ambíguos.
