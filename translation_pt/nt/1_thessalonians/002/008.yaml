revisions:
- from: Assim, por termos tanta afeição por vocês[a], tivemos prazer em compartilhar com vocês não somente o evangelho de Deus, mas também a nossa própria vida[b], porque vocês se tornaram muito queridos para nós.
  to: Assim, ansiando por vocês[a], tínhamos prazer em compartilhar com vocês não só o evangelho de Deus, mas também nossas próprias vidas[b], porque vocês se tornaram queridos para nós.
  rationale: A revisão preserva a relação sintática aberta do particípio, representa melhor o aspecto verbal de εὐδοκοῦμεν, remove uma intensificação sem correspondente explícito no grego e conserva o plural de ψυχάς. As notas continuam a documentar alternativas lexicais relevantes sem impor uma leitura doutrinária.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:32:27Z'
review_pass:
  verdict: revise
  source_fidelity: A revisão é necessária para evitar que o particípio ὁμειρόμενοι seja fixado como explicitamente causal por “por termos”. Sua relação com o verbo principal é circunstancial/modal e pode ter matiz causal no contexto, mas o texto principal deve preservar essa abertura. “Ansiando por vocês” reproduz bem o anseio afetivo do termo raro. O imperfeito εὐδοκοῦμεν é melhor expresso por “tínhamos prazer”, e o plural de ψυχάς por “nossas próprias vidas”.
  naturalness: O texto revisto mantém português moderno e claro, com boa legibilidade brasileira. “Não só ... mas também” é ligeiramente mais corrente do que “não somente ... mas também”, sem perda de registro. “Vocês se tornaram queridos para nós” mantém a mudança de estado de ἐγενήθητε sem acrescentar intensidade.
  terminology: “Evangelho de Deus” é adequado. “Vidas” comunica ψυχάς neste contexto de autodoação sem impor uma antropologia dualista. A nota preserva “almas” e “a nós mesmos” como alternativas, e a nota sobre ὁμειρόμενοι agora inclui tanto o anseio quanto a afeição profunda.
  issues:
  - severity: medium
    issue: A construção “por termos tanta afeição por vocês” torna causal uma relação participial que o grego não especifica de modo inequívoco.
    rationale: Ὁμειρόμενοι é um particípio circunstancial ligado a εὐδοκοῦμεν. Embora uma leitura causal seja possível, a tradução principal não deve eliminar o valor modal/circunstancial nem o matiz de anseio.
  - severity: low
    issue: “Tivemos prazer” não reflete tão bem o aspecto imperfectivo de εὐδοκοῦμεν.
    rationale: “Tínhamos prazer em” apresenta a disposição continuada descrita pelo imperfeito grego.
  - severity: low
    issue: “Muito queridos” acrescenta uma intensificação não expressa por ἀγαπητοί.
    rationale: O adjetivo já comunica afeição; “queridos” é suficiente e conserva melhor o grau semântico do original.
  - severity: low
    issue: O singular “a nossa própria vida” não reproduz a forma plural τὰς ἑαυτῶν ψυχάς.
    rationale: “Nossas próprias vidas” é natural em português e mantém o plural do texto-fonte.
