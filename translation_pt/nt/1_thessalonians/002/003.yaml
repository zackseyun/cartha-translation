  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: pt
  text: Pois a nossa exortação não provém de erro nem de impureza nem é feita com engano,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράκλησις
  choice: exortação
  rationale: No contexto, designa o apelo insistente dirigido aos ouvintes. “Exortação” é natural em português e preserva melhor que “mensagem” a ideia de conclamar ou incentivar.
- source_word: πλάνης
  choice: erro
  rationale: 'Com ἐκ, indica a origem da exortação: ela não procede de falsidade ou engano. “Erro” preserva a possível distinção entre uma ideia falsa e o dolo deliberado expresso por δόλος.'
- source_word: ἀκαθαρσίας
  choice: impureza
  rationale: Mantém a amplitude moral do termo sem restringi-lo à impureza sexual, algo que o versículo não especifica.
- source_word: δόλῳ
  choice: engano
  rationale: Expressa fraude ou astúcia deliberada em linguagem moderna. A construção com ἐν descreve o modo como a exortação não é feita.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: não vem do ... nem da ... nem é feita com ...
  rationale: 'Distingue as preposições: ἐκ/ἐξ apontam para origem, enquanto ἐν indica modo ou esfera. A formulação explicita essa diferença em português natural.'
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga o versículo à afirmação anterior.
theological_decisions:
- issue: Amplitude de ἀκαθαρσία na negação de Paulo
  choice: Traduzir de modo amplo como “impureza”.
  alternative: “impureza sexual” ou “imundícia”
  rationale: Embora o termo possa ter conotação sexual em certos contextos paulinos, aqui não se especifica a forma de impureza. A opção ampla evita acrescentar uma acusação que o grego não delimita.
- issue: Relação entre πλάνη e δόλος
  choice: Distinguir “erro” de “engano”.
  alternative: Traduzir ambos com linguagem de engano ou fraude.
  rationale: A distinção conserva a tensão entre falsidade ou equívoco como origem e fraude deliberada como modo, sem excluir totalmente a possibilidade de πλάνη significar “engano”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Exortação” mantém o registro bíblico sem ser arcaico. A vírgula final foi preservada porque o texto fornecido integra uma frase que prossegue.
