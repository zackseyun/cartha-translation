  to: Nós, porém, irmãos[a], tendo sido separados[b] de vocês por pouco tempo — em pessoa, não no coração —, nos empenhamos ainda mais, com grande anseio, para ver o rosto de vocês.
  rationale: A revisão restaura “ver o rosto de vocês”, que preserva a expressão grega e sua ênfase no reencontro pessoal, e usa “grande anseio” para refletir mais precisamente o desejo intenso expresso por ἐπιθυμία. O marcador da nota lexical foi movido para “separados”, o elemento que ela explica. A voz passiva de “tendo sido separados” também reflete adequadamente o particípio passivo ἀπορφανισθέντες, sem impor uma causa específica para a separação.
