    issue: “para vê-los face a face” não traduz de perto τὸ πρόσωπον ὑμῶν ἰδεῖν.
    rationale: O grego diz literalmente “ver o rosto de vocês”. “Face a face” é uma locução portuguesa de sentido mais idiomático (“diretamente, em presença”) e altera a imagem lexical, além de tornar “vê-los” menos específico.
  - severity: low
    issue: “com grande saudade” estreita a nuance de ἐν πολλῇ ἐπιθυμίᾳ.
    rationale: No contexto, “saudade” é defensável, mas o substantivo grego expressa desejo ou anseio intenso. “Com grande anseio” é uma equivalência mais direta e continua natural em português.
  - severity: low
    issue: A nota lexical está ancorada ao fim da frase, embora explique “separados”.
    rationale: O marcador deve acompanhar o termo que a nota esclarece, para tornar sua referência inequívoca.
