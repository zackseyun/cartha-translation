  source_fidelity: A redação comunica bem o contraste, a brevidade da separação e o esforço intensificado. Contudo, “vê-los face a face” substitui a expressão específica τὸ πρόσωπον ὑμῶν ἰδεῖν (“ver o rosto de vocês”) por uma construção que normalmente significa encontro direto e não preserva o objeto lexical “rosto”. “Grande saudade” é possível no contexto, mas “grande anseio” corresponde mais diretamente a ἐν πολλῇ ἐπιθυμίᾳ.
  naturalness: O português é atual e fluente. “Em pessoa, não no coração” reproduz de modo claro a oposição paulina. A revisão mantém essa naturalidade e emprega “ver o rosto de vocês”, expressão inteiramente idiomática.
  terminology: “Irmãos” com nota inclusiva respeita a forma do vocativo grego e seu provável alcance comunitário. A nota sobre ἀπορφανισθέντες preserva a imagem de orfandade/perda sem forçar uma formulação literal pouco natural no texto principal.
  issues:
