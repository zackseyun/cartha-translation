source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: pt
  text: Nós, porém, irmãos[a], tendo sido separados[b] de vocês por pouco tempo — em pessoa, não no coração —, nos empenhamos ainda mais, com grande anseio, para ver o rosto de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmãos” provavelmente se refere a toda a comunidade de fiéis, incluindo as mulheres.
    reason: cultural_note
  - marker: b
    text: Mais literalmente, “tendo ficado órfãos de vocês”. O grego emprega uma imagem vívida de perda e privação para descrever a separação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Nós, porém
  rationale: Preserva o sujeito enfático Ἡμεῖς e o contraste ou a transição leve assinalada por δέ, em português natural.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina do vocativo grego e o modo de tratamento paulino; uma nota esclarece seu provável alcance comunitário inclusivo.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: separados de vocês
  rationale: Comunica com clareza a separação sofrida, sem a estranheza de uma tradução literal como “órfãos de vocês”; a vívida imagem de privação é registrada em nota.
- source_word: πρὸς καιρὸν ὥρας
  choice: por pouco tempo
  rationale: A expressão idiomática indica um período breve, não necessariamente uma hora literal.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: em pessoa, não no coração
  rationale: Reproduz o contraste entre ausência física e permanência do afeto de modo idiomático.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: nos empenhamos ainda mais
  rationale: Conserva tanto a intensidade comparativa de περισσοτέρως quanto a nuance de esforço diligente de σπουδάζω.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: para vê-los face a face
  rationale: Expressa naturalmente o encontro pessoal implícito no hebraísmo/idioma “ver o rosto”, mantendo a ligação lexical com πρόσωπον.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: com grande saudade
  rationale: No português moderno, “saudade” comunica de maneira concisa e afetiva o forte anseio produzido pela separação, sem a possível conotação negativa de “desejo”.
theological_decisions:
- issue: Alcance de gênero de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A tradução mantém a forma gramatical masculina e o tratamento histórico de Paulo, enquanto a nota informa que, no contexto, ele provavelmente se dirige a toda a comunidade cristã, inclusive às mulheres.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” adequado tanto à leitura brasileira quanto ao português internacional. “Saudade” oferece uma expressão portuguesa natural para o anseio afetivo. A ordem das notas foi ajustada para que cada marcador apareça junto ao elemento que explica.
