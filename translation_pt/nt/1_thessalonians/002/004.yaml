  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: pt
  text: Mas, assim como fomos aprovados por Deus para que nos fosse confiado o evangelho, assim falamos — não agradando a pessoas, mas a Deus[a], que examina nossos corações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais explícita: “não para agradar a pessoas, mas para agradar a Deus”. No grego, “agradar” aparece expressamente apenas na primeira parte do contraste e fica subentendido na segunda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: fomos aprovados
  rationale: O perfeito passivo indica uma avaliação já realizada cujo resultado permanece. “Fomos aprovados” expressa o resultado de δοκιμάζω sem acrescentar a ideia interpretativa de mérito.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: para que nos fosse confiado o evangelho
  rationale: O infinitivo passivo tem o sentido de receber o evangelho como encargo, não de crer nele. A formulação portuguesa mantém a finalidade ou resultado ligado à aprovação divina.
- source_word: τὸ εὐαγγέλιον
  choice: o evangelho
  rationale: “Evangelho” é natural e consolidado no contexto paulino, preservando a densidade teológica do termo.
- source_word: οὕτως λαλοῦμεν
  choice: assim falamos
  rationale: Conserva a correspondência entre a aprovação e incumbência concedidas por Deus e a maneira pela qual os apóstolos falam.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: não como quem procura agradar a pessoas
  rationale: A construção com “como quem” representa o particípio e soa natural em português. “Procura agradar” comunica orientação ou intenção, sem sugerir que alguém efetivamente consiga agradar.
- source_word: ἀλλὰ θεῷ
  choice: mas a Deus
  rationale: Mantém a elipse grega, na qual o verbo ou particípio correspondente a “agradar” fica implícito na segunda parte do contraste.
- source_word: τῷ δοκιμάζοντι
  choice: que examina
  rationale: O particípio presente aponta para a avaliação contínua de Deus. “Examina” é claro e idiomático para sua sondagem dos corações, embora torne menos explícita a repetição lexical de δοκιμάζω.
- source_word: τὰς καρδίας ἡμῶν
  choice: o nosso coração
  rationale: O singular distributivo é natural em português e preserva “coração” como termo bíblico para o centro interior da pessoa.
theological_decisions:
- issue: Contraste elíptico entre agradar a seres humanos e agradar a Deus
  choice: não como quem procura agradar a pessoas, mas a Deus
  alternative: não para agradar a pessoas, mas para agradar a Deus
  rationale: A redação principal conserva a compressão do grego, que explicita ἀρέσκοντες apenas na primeira metade e deixa a ação subentendida diante de θεῷ. A nota oferece a expansão idiomática sem transformar a interpretação em texto explícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Pelo contrário” retoma naturalmente o contraste introduzido por ἀλλά; “pessoas” evita o possível sentido exclusivamente masculino de “homens”. A elipse paulina foi preservada no contraste principal e esclarecida em nota.
