lexical_decisions:
- source_word: εἰδότες
  choice: pois sabemos
  rationale: O particípio retoma o fluxo explicativo da frase iniciada no versículo anterior. A forma finita é natural em português, e «pois» explicita essa relação sem alterar o sentido.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Conserva o plural masculino do grego e é a forma corrente de tratamento comunitário nas cartas paulinas; nesse uso, pode incluir toda a comunidade cristã.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: amados por Deus
  rationale: Preserva a voz passiva e comunica com naturalidade o estado resultante expresso pelo particípio perfeito.
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: que vocês foram escolhidos
  rationale: O substantivo ἐκλογή designa escolha ou eleição. A oração verbal é mais clara e natural para leitores comuns em português, sem especificar mecanismo, fundamento ou alcance além do que o texto afirma.
theological_decisions:
- issue: Tradução de ἐκλογή em um contexto doutrinariamente disputado
  choice: que vocês foram escolhidos
  alternative: a eleição de vocês
  rationale: A redação afirma a escolha dos destinatários sem decidir debates teológicos mais amplos. «Eleição» preservaria mais diretamente a forma nominal, mas pode soar técnica ou político-eleitoral no português corrente.
- issue: Alcance de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Mantém no texto principal a forma masculina plural do original. Uma nota esclarece que, no uso epistolar de Paulo, o vocativo frequentemente abrange toda a comunidade cristã.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação integra-se sintaticamente ao período iniciado no versículo anterior. «Vocês» evita a ambiguidade regional de «vós», enquanto «irmãos» conserva a forma do original; seu alcance comunitário inclusivo é reconhecido na decisão lexical.
