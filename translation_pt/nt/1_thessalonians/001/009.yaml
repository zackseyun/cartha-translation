source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: pt
  text: Pois eles mesmos relatam a nosso respeito como foi a nossa chegada até vocês[a] e como vocês se voltaram para Deus, deixando os ídolos, para servir ao Deus vivo e verdadeiro[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tipo de entrada tivemos junto de vocês”. A expressão grega se refere ao caráter e ao efeito da chegada de Paulo e de seus colaboradores entre eles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como vocês se converteram a Deus, deixando os ídolos”.'
    reason: alternative_reading
  - marker: c
    text: A expressão “Deus vivo e verdadeiro” contrasta Deus com os ídolos sem vida; compare Jeremias 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: 'Preserva a ênfase do pronome intensivo: são os próprios interlocutores de Paulo que divulgam o relato.'
- source_word: ἀπαγγέλλουσιν
  choice: contam
  rationale: Expressa em português corrente a comunicação contínua de notícias, sem formalidade excessiva.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: que acolhida tivemos entre vocês
  rationale: A expressão significa literalmente uma entrada ou chegada junto deles, mas no contexto abrange a maneira e o efeito dessa chegada; “acolhida” comunica naturalmente a dimensão relacional, enquanto a nota preserva a forma mais literal.
- source_word: πῶς ἐπεστρέψατε
  choice: como vocês se voltaram
  rationale: Mantém a metáfora de mudança de direção presente no verbo, sem substituí-la pelo termo doutrinário mais técnico “converteram-se”.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: dos ídolos para Deus
  rationale: A ordem portuguesa torna claros tanto o ponto de partida quanto o destino da mudança, preservando os dois movimentos expressos pelas preposições gregas.
- source_word: εἰδώλων
  choice: ídolos
  rationale: É a correspondência direta e tradicional para objetos ou divindades de culto falsos.
- source_word: δουλεύειν
  choice: servir
  rationale: No contexto de lealdade religiosa, comunica serviço dedicado sem intensificar indevidamente a imagem de escravidão.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: ao Deus vivo e verdadeiro
  rationale: Forma natural e fiel que contrasta Deus, vivo e genuíno, com os ídolos inanimados.
- source_word: γὰρ
  choice: Pois
  rationale: Conserva a ligação explicativa do versículo com a afirmação anterior.
theological_decisions:
- issue: Linguagem de conversão em ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: vocês se voltaram dos ídolos para Deus
  alternative: vocês se converteram dos ídolos a Deus
  rationale: A tradução principal preserva a metáfora ativa do verbo e o movimento em duas direções, sem impor uma formulação doutrinária mais técnica.
- issue: Sentido de δουλεύειν em relação a Deus
  choice: servir
  alternative: ser escravos de; prestar culto a
  rationale: “Servir” abrange a lealdade e o serviço religioso requeridos pelo contexto, sem reduzir o termo apenas ao culto nem exagerar sua associação lexical com escravidão.
- issue: Contraste em θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Deus vivo e verdadeiro
  alternative: um deus vivo e verdadeiro
  rationale: O contexto contrasta o único Deus a quem os tessalonicenses passaram a servir com os ídolos; a formulação definida é natural em português e preserva esse peso teológico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “acolhida” dá naturalidade à expressão idiomática, e a nota registra a imagem literal de entrada. A ordem dos marcadores [b][c] acompanha primeiro a alternativa relativa à conversão e depois a observação sobre “Deus vivo e verdadeiro”.
