id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: pt
  text: E vocês se tornaram imitadores nossos e do Senhor, ao receberem a palavra em meio a muita aflição, com a alegria do Espírito Santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com a alegria que vem do Espírito Santo”, isto é, alegria produzida pelo Espírito Santo.'
    reason: Alternativa lexical e esclarecimento da possível relação de origem no genitivo grego.
lexical_decisions:
- source_word: μιμηταὶ
  choice: imitadores
  rationale: Preserva a linguagem explícita de imitação usada por Paulo, com mais precisão que “seguidores”.
- source_word: ἐγενήθητε
  choice: se tornaram
  rationale: Expressa naturalmente a mudança de condição indicada pelo aoristo de γίνομαι.
- source_word: κυρίου
  choice: Senhor
  rationale: Mantém o título cristológico usual para κύριος neste contexto.
- source_word: δεξάμενοι
  choice: ao receberem
  rationale: Representa o particípio aoristo e liga naturalmente o recebimento da palavra ao fato de eles se tornarem imitadores, sem impor uma relação causal mais forte do que o grego exige.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Preserva a expressão paulina para a mensagem proclamada e suas ressonâncias, embora “a mensagem” também fosse possível.
- source_word: ἐν θλίψει πολλῇ
  choice: em meio a muita aflição
  rationale: Comunica sofrimento e pressão intensa em português corrente, evitando possíveis conotações escatológicas específicas de “tribulação”.
- source_word: μετὰ χαρᾶς πνεύματος ἁγίου
  choice: com a alegria do Espírito Santo
  rationale: Reflete de perto a construção genitiva e preserva sua ambiguidade quanto a origem, produção ou associação.
theological_decisions:
- issue: Relação do genitivo em χαρᾶς πνεύματος ἁγίου
  choice: a alegria do Espírito Santo
  alternative: a alegria que vem do Espírito Santo; a alegria produzida pelo Espírito Santo
  rationale: A formulação principal mantém a concisão e a ambiguidade do grego. A nota apresenta a provável ideia de origem ou produção sem transformá-la silenciosamente na única leitura possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” oferece naturalidade contemporânea; “ao receberem” evita o gerúndio ambíguo, e “em meio a muita aflição” mantém o peso da expressão sem soar arcaico.
