id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: pt
  text: Pois a palavra do Senhor tem ressoado a partir de vocês, não apenas na Macedônia e na Acaia, mas em todo lugar a fé de vocês em Deus se espalhou, de modo que não temos necessidade de dizer nada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήχηται
  choice: ressoou
  rationale: Preserva a forte imagem sonora do verbo e, no contexto, comunica o efeito ainda perceptível da ação expressa pelo perfeito grego.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: Mantém a expressão paulina tradicional e deixa o genitivo aberto à ideia de palavra procedente do Senhor ou a respeito dele.
- source_word: ἀφ’ ὑμῶν
  choice: partindo de vocês
  rationale: Expressa com clareza a origem indicada por ἀπό e combina naturalmente com a imagem de algo que ressoa.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Macedônia e Acaia
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes regionais.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: mas em todo lugar
  rationale: Conserva a força distributiva de παντί e o substantivo concreto τόπος sem reduzir a expressão a uma região específica.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: a fé que vocês têm em Deus
  rationale: Traduz πίστις por 'fé' e verte a relação expressa por πρὸς em português idiomático, sem sugerir que a fé seja uma qualidade possuída por Deus.
- source_word: ἐξελήλυθεν
  choice: se tornou conhecida
  rationale: No contexto, explicita o resultado comunicativo de a fé ter 'saído' para todo lugar; evita em português a formulação pouco natural 'a fé saiu'.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: de modo que não precisamos
  rationale: Reproduz naturalmente a oração consecutiva introduzida por ὥστε e identifica corretamente 'nós' como sujeito do infinitivo.
- source_word: λαλεῖν τι
  choice: dizer coisa alguma
  rationale: É uma formulação portuguesa natural que preserva o sentido amplo e enfático do indefinido sob negação.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade; confiança
  rationale: O contexto descreve a resposta dos tessalonicenses a Deus, favorecendo 'fé' em vez da qualidade de fidelidade; 'confiança' é possível como explicação semântica, mas é menos adequada como termo principal aqui.
- issue: Relação expressa por πρὸς τὸν θεόν
  choice: fé que vocês têm em Deus
  alternative: fé voltada para Deus; fé em Deus
  rationale: A formulação escolhida é idiomática e comunica a orientação da fé para Deus. A expressão mais literal 'voltada para Deus' preservaria melhor a imagem espacial, mas soaria marcada no português corrente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, preservando o paralelismo entre a palavra que ressoa e a fé que se torna conhecida. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
