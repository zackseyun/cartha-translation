source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: pt
  text: Sempre damos graças a Deus por todos vocês, fazendo menção de vocês em nossas orações, sem cessar[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “sem cessar” pode se referir especificamente a “fazendo menção de vocês em nossas orações” ou, de modo mais amplo, à ação de graças.
    reason: A posição de ἀδιαλείπτως no grego permite mais de uma ligação sintática plausível.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: damos graças
  rationale: O presente do indicativo na primeira pessoa do plural expressa a ação conjunta dos remetentes; “dar graças” é a formulação natural e consagrada em português para gratidão dirigida a Deus.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo identifica diretamente o destinatário das graças.
- source_word: πάντοτε
  choice: sempre
  rationale: Equivalente temporal claro e corrente, colocado junto ao verbo principal.
- source_word: περὶ πάντων ὑμῶν
  choice: por todos vocês
  rationale: “Por” expressa de modo idiomático a referência aos destinatários no contexto de ação de graças, enquanto “todos vocês” preserva a inclusão enfática de πάντων.
- source_word: μνείαν ποιούμενοι
  choice: fazendo menção de vocês
  rationale: Preserva de perto o idiomatismo grego de “fazer menção”, com o objeto contextual explicitado para clareza.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: em nossas orações
  rationale: Tradução idiomática da expressão preposicional, indicando o contexto em que a menção é feita.
- source_word: ἀδιαλείπτως
  choice: sem cessar
  rationale: Mantém a força de constância persistente e, em posição final, conserva tanto quanto possível a ambiguidade de ligação presente no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem final de “sem cessar” procura preservar a ambiguidade do original. A vírgula ao fim mantém a continuidade sintática com o versículo seguinte.
