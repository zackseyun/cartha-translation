reference: 1 Thessalonians 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: pt
  text: e esperar dos céus o seu Filho, a quem ele ressuscitou dentre os mortos — Jesus, que nos livra da ira que está por vir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da ira vindoura”.'
    reason: Alternativa de formulação para τῆς ἐρχομένης, com o mesmo sentido básico de uma ira que vem.
lexical_decisions:
- source_word: ἀναμένειν
  choice: esperar
  rationale: Expressa espera perseverante e cheia de expectativa em português natural, além de manter o infinitivo que continua a construção do versículo anterior.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: o seu Filho
  rationale: Preserva diretamente o título cristológico filial, sem explicação adicional.
- source_word: ἐκ τῶν οὐρανῶν
  choice: dos céus
  rationale: Mantém o plural do grego e soa natural no uso bíblico contemporâneo em português.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: a quem ele ressuscitou dentre os mortos
  rationale: Emprega a formulação portuguesa corrente para a ressurreição e preserva a ideia de sair do meio dos mortos.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Segue a forma tradicional e amplamente reconhecida do nome em português.
- source_word: τὸν ῥυόμενον
  choice: que nos livra
  rationale: A oração relativa é natural em português; o presente caracteriza Jesus como aquele que livra, sem transformar explicitamente a ação em futuro.
- source_word: ἐκ τῆς ὀργῆς
  choice: da ira
  rationale: “Ira” corresponde mais precisamente a ὀργή do que o termo mais amplo “juízo”; “da” traduz naturalmente a ideia de livramento para fora de seu alcance.
- source_word: τῆς ἐρχομένης
  choice: que está por vir
  rationale: Conserva a orientação futura do particípio e comunica com clareza que essa ira ainda vem, sem especificar seu quadro escatológico.
theological_decisions:
- issue: Natureza da “ira que está por vir”
  choice: Manter “ira que está por vir” sem identificar de modo mais estreito o acontecimento referido.
  alternative: Traduzir como “juízo futuro” ou especificar a tribulação do fim ou a condenação final.
  rationale: O versículo não define se a expressão aponta especificamente para a condenação final, para uma tribulação escatológica ou, de modo mais amplo, para a ira divina futura. A tradução preserva essa abertura.
- issue: Valor temporal do particípio ῥυόμενον
  choice: “que nos livra”
  alternative: “que nos livrará” ou “que está nos livrando”
  rationale: O particípio presente caracteriza Jesus por sua ação de livrar. Embora a ira seja futura, o grego não emprega aqui um futuro explícito; por isso, a tradução evita determinar mais do que o texto determina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dos céus” preserva o plural grego sem artificialidade; “dentre os mortos” mantém a expressão tradicional ainda clara. O travessão destaca naturalmente a aposição “Jesus”. O marcador foi colocado junto à expressão a que a nota se refere.
