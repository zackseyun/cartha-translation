id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: pt
  text: lembrando-nos de sua obra de fé[a], de seu esforço de amor e de sua constância de esperança em nosso Senhor Jesus, o Messias[b], diante de nosso Deus e Pai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fidelidade» ou «confiança», em vez de «fé».
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «Cristo»; aqui traduzido como «o Messias» porque Χριστός funciona como título.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: lembrando-nos
  rationale: O particípio presente continua a construção do versículo anterior e expressa recordação contínua; a forma pronominal com «de» é natural em português.
- source_word: ἔργου
  choice: obra
  rationale: Preserva o primeiro elemento da tríade retórica e o distingue de κόπος, que indica esforço mais intenso.
- source_word: πίστεως
  choice: fé
  rationale: É a tradução principal de πίστις e mantém aberta a relação do genitivo em «obra da fé», sem explicitar se a obra é produzida ou caracterizada pela fé.
- source_word: κόπου
  choice: esforço
  rationale: Comunica o trabalho árduo e fatigante indicado por κόπος, distinguindo-o de ἔργον.
- source_word: ἀγάπης
  choice: amor
  rationale: Equivalente direto e natural de ἀγάπη.
- source_word: ὑπομονῆς
  choice: constância
  rationale: Expressa firmeza e resistência continuada sob pressão, com linguagem corrente e digna.
- source_word: ἐλπίδος
  choice: esperança
  rationale: Equivalente direto que, no contexto paulino, denota expectativa confiante.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: em nosso Senhor Jesus, o Messias
  rationale: «Em» comunica naturalmente a esperança dirigida a Jesus; Χριστός é vertido como o título «Messias», enquanto «Cristo» é registrado em nota como forma tradicional.
- source_word: ἔμπροσθεν
  choice: diante de
  rationale: Conserva o sentido relacional de estar na presença de Deus.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: nosso Deus e Pai
  rationale: Reflete a estreita associação dos dois substantivos e a referência comum expressa pelo grego.
theological_decisions:
- issue: Sentido de πίστις em τῆς πίστεως
  choice: fé
  alternative: fidelidade; confiança
  rationale: «Fé» preserva a opção lexical principal e a tensão entre crença, confiança e fidelidade; as nuances plausíveis são mantidas em nota.
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Χριστός funciona como título e «Messias» torna explícito seu conteúdo; «Cristo», a forma tradicional transliterada, permanece em nota.
- issue: Relação dos genitivos na tríade
  choice: obra da fé, esforço do amor, constância da esperança
  alternative: obra produzida pela fé, esforço motivado pelo amor, constância sustentada pela esperança
  rationale: A formulação nominal conserva a concisão e a ambiguidade genuína dos genitivos gregos, evitando fixar silenciosamente uma única relação causal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A tríade nominal foi preservada para manter o paralelismo de Paulo e a ambiguidade dos genitivos. «Esforço» diferencia κόπος de ἔργον sem recorrer a vocabulário arcaico.
