id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: pt
  text: pois o nosso evangelho não chegou a vocês somente em palavras, mas também em poder, no Espírito Santo e com plena convicção[a], assim como vocês sabem que tipo de homens nos mostramos entre vocês, para o bem de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com plena certeza» ou «com grande segurança». O grego não declara explicitamente em quem reside essa convicção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por causa de vocês».'
    reason: source_ambiguity
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: evangelho
  rationale: É o termo consagrado e ainda natural em português para a mensagem apostólica, preservando seu sentido específico no uso paulino.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: chegou a vocês
  rationale: Expressa com naturalidade a chegada e atuação da mensagem entre os tessalonicenses, evitando o literalismo obscuro de «tornou-se para vocês».
- source_word: ἐν λόγῳ μόνον
  choice: somente em palavras
  rationale: Mantém o contraste entre a proclamação meramente verbal e sua manifestação eficaz, em português corrente.
- source_word: ἐν δυνάμει
  choice: em poder
  rationale: Preserva o paralelismo das expressões introduzidas por ἐν e a ênfase na eficácia da proclamação.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: No contexto paulino, a expressão designa o Espírito Santo; o artigo e as maiúsculas são naturais em português.
- source_word: πληροφορίᾳ πολλῇ
  choice: com plena convicção
  rationale: Comunica a ideia de certeza ou segurança em alto grau sem especificar indevidamente se a convicção pertence aos pregadores, aos ouvintes ou ao modo como o evangelho se manifestou.
- source_word: καθὼς οἴδατε
  choice: assim como vocês sabem
  rationale: Conserva a força comparativa e apela ao conhecimento pessoal dos destinatários.
- source_word: οἷοι ἐγενήθημεν
  choice: que tipo de homens nos mostramos
  rationale: Refere-se ao caráter demonstrado por Paulo e seus companheiros, um grupo masculino conhecido, e traduz γίνομαι de modo idiomático no contexto.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Indica a conduta dos missionários no convívio com os tessalonicenses.
- source_word: δι’ ὑμᾶς
  choice: para o bem de vocês
  rationale: Explicita de forma natural o sentido provável de benefício ou propósito, sem perder de vista a alternativa causal registrada em nota.
theological_decisions:
- issue: Referência de πνεύματι ἁγίῳ
  choice: Espírito Santo, entendido como o agente divino
  alternative: um espírito santo ou uma qualidade espiritual
  rationale: O uso paulino e o contraste com palavras apenas favorecem a referência ao Espírito Santo, sem reduzir a expressão a entusiasmo humano.
- issue: Sentido e referente de πληροφορίᾳ πολλῇ
  choice: plena convicção, deixando implícito quem a experimenta
  alternative: plena certeza; grande segurança
  rationale: O grego não identifica expressamente se a convicção está nos missionários, nos ouvintes ou no acontecimento da proclamação; a redação conserva essa abertura.
- issue: Identidade indicada por οἷοι
  choice: homens, em referência a Paulo e seus companheiros
  alternative: pessoas
  rationale: A expressão aponta para o grupo concreto de missionários do sexo masculino, e não para seres humanos em sentido genérico.
- issue: Valor de δι’ ὑμᾶς
  choice: 'benefício ou finalidade: para o bem de vocês'
  alternative: 'causa: por causa de vocês'
  rationale: O contexto pastoral favorece o benefício dos destinatários, mas a construção com διά e acusativo permite que a alternativa causal seja reconhecida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» para o plural. A frase conserva o encadeamento argumentativo do grego, enquanto «chegou a vocês» e «nos mostramos» evitam construções literais pouco naturais. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
