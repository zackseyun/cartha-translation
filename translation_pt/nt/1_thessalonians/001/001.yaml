id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: pt
  text: 'Paulo, Silvano e Timóteo, à igreja[a] dos tessalonicenses em Deus Pai e no Senhor Jesus, o Messias[b]: graça a vocês e paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assembleia”. O termo grego ἐκκλησία se refere à comunidade reunida.
    reason: lexical_alternative
  - marker: b
    text: Ou “Cristo”. Aqui, o título grego Χριστός é traduzido como “Messias” para explicitar seu significado; muitas traduções usam a forma tradicional “Cristo”.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma portuguesa tradicional e corrente do nome grego Παῦλος.
- source_word: Σιλουανὸς
  choice: Silvano
  rationale: Corresponde diretamente à forma grega Σιλουανός, sem substituí-la pela forma relacionada Silas.
- source_word: Τιμόθεος
  choice: Timóteo
  rationale: Forma portuguesa tradicional e corrente do nome grego Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: igreja
  rationale: É a forma natural em português para a comunidade reunida neste contexto epistolar; “assembleia” continua sendo uma alternativa lexical possível.
- source_word: Θεσσαλονικέων
  choice: dos tessalonicenses
  rationale: Reproduz de modo conciso o genitivo plural que identifica o povo de Tessalônica.
- source_word: ἐν
  choice: em / no
  rationale: Mantém a relação expressa por ἐν sem reduzi-la a “pertencente a”; a contração “no” diante de “Senhor” é exigida pelo português corrente.
- source_word: θεῷ πατρὶ
  choice: Deus Pai
  rationale: Preserva a aposição grega e não acrescenta o possessivo “nosso”, ausente do texto.
- source_word: κυρίῳ
  choice: Senhor
  rationale: Equivalente português tradicional e adequado de κύριος neste contexto cristológico.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa a construção apositiva idiomática em português.
- source_word: χάρις
  choice: graça
  rationale: Preserva o termo característico da saudação paulina e sua ressonância teológica.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente direto que conserva as ressonâncias grega e judaica da saudação.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: graça a vocês e paz
  rationale: Mantém ὑμῖν junto de χάρις e preserva a ordem do grego em português compreensível.
theological_decisions:
- issue: Tradução de Χριστός na saudação
  choice: Messias
  alternative: Cristo
  rationale: Aqui o sentido titular permanece reconhecível; “Messias” comunica o significado de Χριστός, enquanto “Cristo” é a transliteração tradicional indicada em nota.
- issue: Relação expressa por ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: a igreja é descrita como estando “em Deus Pai e no Senhor Jesus, o Messias”
  alternative: a igreja pertence a Deus Pai e ao Senhor Jesus, o Messias
  rationale: A tradução retém a preposição e a abertura teológica da formulação de Paulo, sem convertê-la numa paráfrase de posse ou de reunião.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação dos três remetentes foi simplificada para a forma natural “Paulo, Silvano e Timóteo”. A construção “em Deus Pai e no Senhor” conserva a preposição do original, repetida apenas conforme a gramática portuguesa. “A vocês” evita regionalismo excessivo e mantém clareza internacional.
source_grounding:
  english_pob_role: consult_only
