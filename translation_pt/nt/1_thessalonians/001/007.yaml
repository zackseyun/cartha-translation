  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: pt
  text: de modo que vocês se tornaram exemplo para todos os que creem na Macedônia e na Acaia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “modelo” ou “padrão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado da acolhida da palavra e da imitação mencionadas no versículo anterior, preservando de forma natural a força consecutiva.
- source_word: γενέσθαι
  choice: se tornaram
  rationale: O infinitivo aoristo médio, dependente de ὥστε, expressa resultado; a forma finita é natural em português e o verbo pronominal comunica adequadamente a mudança de condição.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa o sujeito semântico da construção infinitiva e usa uma forma corrente e amplamente compreensível em português.
- source_word: τύπον
  choice: exemplo
  rationale: Neste contexto, designa um padrão digno de ser seguido. “Exemplo” é claro e idiomático, enquanto “modelo” e “padrão” continuam sendo alternativas lexicais legítimas.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: para todos os que creem
  rationale: O particípio substantivado refere-se às pessoas que creem. Esta formulação preserva o valor verbal de πιστεύουσιν e o dativo indica aqueles para quem os tessalonicenses serviram de exemplo.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: na Macedônia
  rationale: Tradução locativa direta do nome da região/província romana.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: e na Acaia
  rationale: Coordena a segunda região e mantém a estrutura paralela do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para a segunda pessoa do plural. A opção “todos os que creem” mantém o aspecto verbal do particípio grego sem introduzir distinções teológicas ausentes do texto.
