  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: pt
  text: Saúda Prisca[a] e Áquila, bem como os da casa de Onesíforo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego diz “Prisca”; em outras passagens, ela também é chamada “Priscila” (por exemplo, Atos 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Saúda
  rationale: Imperativo aoristo médio de ἀσπάζομαι usado como ordem epistolar direta. “Saúda” preserva a força imperativa sem acrescentar uma intensidade afetiva não explicitada.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Translitera diretamente a forma nominal presente no texto grego, distinguindo-a da forma alternativa Priscila usada em outras passagens.
- source_word: Ἀκύλαν
  choice: Áquila
  rationale: Forma tradicional e clara em português para o nome próprio grego Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: a família de Onesíforo
  rationale: Neste contexto de saudação, οἶκος designa as pessoas ligadas à casa de Onesíforo, não o edifício. “Família” é natural em português e comunica o grupo doméstico, embora “casa” ou “os da casa” também sejam possíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com imperativo na forma tradicional “Saúda”. A construção “e também” torna natural a coordenação final sem alterar o conteúdo. O marcador da nota aparece imediatamente após “Áquila”, seguindo a camada inglesa fornecida.
