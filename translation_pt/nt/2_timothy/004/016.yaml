id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: pt
  text: Na minha primeira defesa[a], ninguém compareceu para me apoiar[b]; pelo contrário, todos me abandonaram. Que isso não lhes seja levado em conta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na minha primeira audiência” ou “na minha primeira defesa judicial”.'
    reason: lexical_alternative
  - marker: b
    text: 'Em grego, literalmente: “ninguém veio estar presente comigo”; no contexto, ninguém compareceu para apoiar Paulo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Que isso não seja contado contra eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: defesa
  rationale: No contexto judicial, refere-se à defesa formal de Paulo perante as autoridades. “Defesa” é natural em português e preserva o sentido forense.
- source_word: πρώτῃ
  choice: primeira
  rationale: Indica a primeira ocasião ou etapa da defesa de Paulo, sem especificar além do que o texto afirma.
- source_word: παρεγένετο
  choice: compareceu para me apoiar
  rationale: O verbo denota literalmente vir e estar presente; neste contexto, a presença seria em apoio a Paulo durante sua defesa. A formulação explicita esse sentido contextual sem perder a ideia de comparecimento.
- source_word: οὐδείς
  choice: ninguém
  rationale: Equivalente direto, claro e natural do pronome negativo grego.
- source_word: ἐγκατέλιπον
  choice: me abandonaram
  rationale: Expressa deixar alguém desamparado em uma situação difícil e mantém o peso relacional e circunstancial do verbo.
- source_word: λογισθείη
  choice: seja levado em conta
  rationale: Preserva a metáfora de contabilizar ou imputar algo e, com “que”, comunica naturalmente o desejo expresso pelo optativo.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Que isso não lhes seja levado em conta
  rationale: Traduz a construção como desejo ou oração em favor dos que abandonaram Paulo; “isso” torna explícito apenas o objeto implícito, isto é, o abandono mencionado.
theological_decisions:
- issue: Tom da frase final de Paulo a respeito dos que o abandonaram
  choice: 'Um desejo semelhante a uma oração: “Que isso não lhes seja levado em conta.”'
  alternative: 'Uma formulação permissiva mais branda: “Que isso não seja contado contra eles.”'
  rationale: O optativo aoristo passivo λογισθείη com μή expressa naturalmente um desejo. A tradução preserva a linguagem de não imputação sem acrescentar uma conclusão doutrinária que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Compareceu para me apoiar” conserva tanto a presença judicial quanto a solidariedade contextual; a frase final mantém o tom de desejo ou oração e a metáfora de imputação.
