id: 2TI.4.6
reference: 2 Timothy 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: pt
  text: Pois eu já estou sendo derramado como oferta de bebida[a], e chegou o tempo da minha partida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplesmente: “estou sendo derramado”. O verbo grego evoca a imagem de uma oferta líquida derramada em sacrifício.'
    reason: lexical_alternative
  - marker: b
    text: Ou “libertação” ou “dissolução”. Aqui, “partida” é uma forma natural de se referir à morte.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: estou sendo derramado como oferta de bebida
  rationale: O verbo evoca literalmente o derramamento de uma libação sacrificial. A formulação explicita a imagem para leitores modernos sem substituí-la pela interpretação direta de que Paulo está prestes a morrer.
- source_word: ἤδη
  choice: já
  rationale: Indica que a ação é vista como presente e em andamento, realçando a proximidade da morte de Paulo.
- source_word: καιρός
  choice: tempo
  rationale: Neste contexto, refere-se ao momento decisivo ou apropriado; “tempo” é natural e o restante da frase comunica que esse momento chegou.
- source_word: ἀναλύσεώς
  choice: partida
  rationale: O substantivo pode expressar partida, soltura ou dissolução. “Partida” funciona naturalmente como referência figurada à morte e preserva a metáfora sem a explicar em excesso.
- source_word: ἐφέστηκεν
  choice: chegou
  rationale: O perfeito apresenta o momento como tendo chegado e estando agora presente; “chegou” reproduz de modo claro essa força resultante.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com o contexto anterior de forma digna e corrente.
theological_decisions:
- issue: Descrição metafórica da morte de Paulo
  choice: Manter tanto a imagem sacrificial de ser derramado como oferta quanto o eufemismo “partida”.
  alternative: Traduzir diretamente como “estou prestes a morrer” ou entender a frase apenas como referência geral ao sofrimento.
  rationale: A combinação de σπένδομαι e ἀνάλυσις aponta fortemente para a morte iminente, mas o texto a apresenta por meio de duas imagens que devem ser preservadas, não achatadas em uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Oferta de bebida” torna compreensível a libação sem usar um termo técnico pouco conhecido; as notas preservam o sentido literal e as alternativas lexicais. Os marcadores seguem imediatamente as expressões a que se referem.
