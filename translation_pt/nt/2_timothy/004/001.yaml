revisions:
- from: 'Eu o encarrego solenemente, diante de Deus e do Messias Jesus, que está para julgar os vivos e os mortos[a], e por sua manifestação e por seu Reino[b]:'
  to: 'Eu lhe dou uma ordem solene, diante de Deus e do Messias Jesus, que está para julgar os vivos e os mortos[a], e por sua manifestação e seu Reino[b]:'
  rationale: A revisão substitui uma expressão que pode sugerir mera delegação de tarefa por uma formulação portuguesa natural que preserva a força de comissão ou ordem solene de διαμαρτύρομαι. Também simplifica a coordenação final sem alterar a leitura adotada nem eliminar a alternativa sintática preservada na nota.
