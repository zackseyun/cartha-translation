  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente os elementos centrais do grego: a solenidade de διαμαρτύρομαι, o cenário «diante de Deus e do Messias Jesus», o juízo dos vivos e dos mortos, a nuance futura/possivelmente iminente de μέλλων e a construção sintaticamente difícil relacionada à manifestação e ao Reino. Contudo, «Eu o encarrego solenemente» pode em português sugerir principalmente a atribuição de uma tarefa, enquanto o verbo, neste contexto de exortação apostólica, tem a força mais direta de uma ordem ou admoestação solene.'
  naturalness: «Eu lhe dou uma ordem solene» é mais idiomático em português moderno e transmite com clareza o ato de comissionar solenemente. «Por sua manifestação e por seu Reino» é compreensível, mas «por sua manifestação e seu Reino» é mais fluente e mantém uma única preposição explicitadora para a coordenação grega.
  terminology: «Messias Jesus» preserva apropriadamente o valor titular de Χριστός; «manifestação» é uma boa opção para ἐπιφάνεια; e «Reino» é adequado para βασιλεία neste contexto. Mantém-se a nota sobre a sintaxe da última coordenação, sem resolver além do necessário a ambiguidade grega.
