language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: pt
  text: 'Eu lhe dou uma ordem solene, diante de Deus e do Messias Jesus, que está para julgar os vivos e os mortos[a], e por sua manifestação e seu Reino[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que há de julgar os vivos e os mortos” ou “que julgará os vivos e os mortos”.'
    reason: A construção com μέλλω pode destacar iminência ou simplesmente indicar a ação futura.
  - marker: b
    text: 'Ou, mais literalmente: “e sua manifestação e seu Reino”, deixando implícita a relação dessas palavras com a ordem solene.'
    reason: A sintaxe grega permite conservar a coordenação sem explicitar a preposição “por”.
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Eu o encarrego solenemente
  rationale: No contexto de uma comissão apostólica, o verbo expressa uma incumbência solene, não apenas um testemunho. O pronome objeto, implícito no grego e identificado pelo contexto, é necessário para uma formulação natural em português.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa de modo conciso e natural a ideia de estar na presença e sob o olhar de Deus e do Messias Jesus.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  rationale: Mantém Χριστός como título messiânico, ainda ativo nesta declaração solene, em vez de tratá-lo apenas como parte de um nome próprio.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: que está para julgar
  rationale: Preserva tanto a orientação futura quanto a possível nuance de iminência de μέλλω, sem fixar um calendário escatológico.
- source_word: ζῶντας καὶ νεκρούς
  choice: os vivos e os mortos
  rationale: É a formulação portuguesa corrente e mantém o alcance universal e escatológico do juízo.
- source_word: ἐπιφάνειαν
  choice: manifestação
  rationale: Comunica a manifestação visível implicada por ἐπιφάνεια e evita reduzir o termo simplesmente a uma chegada.
- source_word: βασιλείαν
  choice: Reino
  rationale: É a equivalência tradicional e ampla, adequada à expressão escatológica paralela à manifestação. A inicial maiúscula assinala o Reino de Deus/do Messias como referente específico sem acrescentar conteúdo.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: e por sua manifestação e por seu Reino
  rationale: 'Entende os acusativos como extensão da fórmula solene de incumbência: a manifestação e o Reino são invocados como fundamento da exortação. A coordenação grega mais implícita permanece registrada em nota.'
theological_decisions:
- issue: Valor titular de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução conserva explicitamente o sentido do título messiânico no contexto judicial e escatológico, sem transformá-lo silenciosamente em elemento meramente nominal.
- issue: Força escatológica de μέλλω
  choice: está para julgar
  alternative: há de julgar / julgará
  rationale: A escolha mantém a tensão entre futuridade e possível iminência presente no grego, sem afirmar um prazo que o texto não determina.
- issue: Função sintática de καί antes de τὴν ἐπιφάνειαν
  choice: e por sua manifestação e por seu Reino
  alternative: e sua manifestação e seu Reino
  rationale: A leitura principal explicita a provável continuação da fórmula de encargo solene; a alternativa mais formal preserva a coordenação e deixa a relação sintática implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o tom judicial e solene da passagem; evita linguagem arcaica como “conjuro-te”, mas mantém a força do encargo. Os marcadores [a] e [b] aparecem no texto junto aos pontos exatos de ambiguidade.
