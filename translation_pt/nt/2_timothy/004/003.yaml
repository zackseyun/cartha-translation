id: 2TI.4.3
reference: 2 Timothy 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: pt
  text: Pois virá o tempo em que não suportarão o ensino saudável[a]; pelo contrário, seguindo os próprios desejos, acumularão para si mestres, com os ouvidos coçando[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a doutrina sadia».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «com a audição coçando»; a imagem retrata o desejo de ouvir aquilo que agrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: o tempo
  rationale: Neste contexto, καιρός indica um período ou ocasião futura; «o tempo» é natural em português e preserva a força da previsão.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: o ensino saudável
  rationale: ὑγιαίνω significa literalmente estar saudável e aqui qualifica metaforicamente o ensino como correto e benéfico. «Ensino saudável» preserva a imagem sem recorrer necessariamente ao termo mais técnico «doutrina».
- source_word: οὐκ ἀνέξονται
  choice: não suportarão
  rationale: ἀνέχομαι expressa suportar, tolerar ou aguentar. «Não suportarão» comunica de modo digno e corrente a recusa futura.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: seguindo os próprios desejos
  rationale: A preposição κατά indica conformidade ou orientação. A formulação mostra que os desejos pessoais governam a escolha dos mestres, sem restringir ἐπιθυμίαι a desejos sexuais.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: acumularão para si mestres
  rationale: «Acumularão» conserva a ideia de juntar em grande quantidade presente em ἐπισωρεύω, enquanto «para si» mantém a força reflexiva de ἑαυτοῖς.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: com os ouvidos coçando
  rationale: A expressão conserva a imagem vívida do grego e mantém aberta a relação circunstancial do particípio com a oração principal, sem transformá-la explicitamente em causa.
theological_decisions:
- issue: Sentido de διδασκαλία no contexto das cartas pastorais
  choice: ensino
  alternative: doutrina
  rationale: O termo pode referir-se ao conteúdo doutrinário, mas «ensino» traduz seu sentido sem impor uma terminologia eclesiástica mais técnica. A alternativa é registrada em nota.
- issue: Força do particípio κνηθόμενοι
  choice: com os ouvidos coçando
  alternative: porque sentem coceira nos ouvidos
  rationale: A construção escolhida preserva a forma circunstancial e a ambiguidade do particípio grego, evitando explicitar uma relação causal que o texto não marca de modo inequívoco.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a metáfora de saúde aplicada ao ensino, a ideia de acumulação excessiva de mestres e a imagem incomum dos ouvidos que coçam.
