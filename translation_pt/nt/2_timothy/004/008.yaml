  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: o valor temporal de λοιπὸν, o estado presente de ἀπόκειται, a construção genitiva em «a coroa da justiça», a entrega futura pelo Senhor «naquele dia», a aposição «o justo Juiz» e o perfeito de τοῖς ἠγαπηκόσι. «Está reservada» comunica adequadamente algo guardado para entrega futura, e «manifestação» é uma opção semanticamente defensável para ἐπιφάνεια.'
