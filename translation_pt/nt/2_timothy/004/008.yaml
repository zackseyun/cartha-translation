id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: pt
  text: Desde agora, está reservada para mim a coroa da justiça[a], que o Senhor, o justo Juiz, me concederá naquele dia; e não somente a mim, mas também a todos os que têm amado a sua manifestação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “a coroa da retidão” ou “a coroa da vindicação”. A construção grega não especifica exatamente como a coroa se relaciona com a justiça.
    reason: lexical_and_genitival_ambiguity
lexical_decisions:
- source_word: λοιπὸν
  choice: Desde agora
  rationale: No contexto da conclusão da corrida no versículo anterior, indica o que resta ou está adiante para Paulo, com valor temporal.
- source_word: ἀπόκειταί
  choice: está reservada
  rationale: Expressa algo posto à parte e guardado para entrega futura, preservando o estado presente indicado pelo verbo.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: a coroa da justiça
  rationale: Mantém a construção genitiva sem decidir se a coroa é concedida por causa da justiça, consiste em justiça ou está ligada à vindicação.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Em português, “justiça” abrange com naturalidade tanto a qualidade do que é justo quanto a ação justa ou vindicadora, sem exigir uma distinção lexical artificial.
- source_word: ἀποδώσει
  choice: concederá
  rationale: No quadro da coroa do vencedor, comunica a entrega devida pelo juiz sem a possível conotação exclusivamente retributiva de “retribuirá”.
- source_word: ὁ δίκαιος κριτής
  choice: o justo Juiz
  rationale: Preserva a aposição que caracteriza o Senhor por sua retidão ao julgar.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: a todos os que têm amado
  rationale: O perfeito participial descreve um amor estabelecido que se estende até o presente; a forma composta preserva essa nuance.
- source_word: ἐπιφάνειαν
  choice: manifestação
  rationale: Traduz diretamente a ideia de tornar-se visível ou aparecer de modo revelador, sem reduzi-la ao conceito mais amplo de “vinda”.
theological_decisions:
- issue: Sentido de “a coroa da justiça”
  choice: A construção genitiva foi mantida sem especificar a relação exata entre a coroa e a justiça.
  alternative: “a coroa concedida pela justiça”, “a coroa que consiste em justiça” ou “a coroa da vindicação”
  rationale: O grego permite essas nuances, e explicitá-las no texto resolveria uma ambiguidade que o original conserva.
- issue: Referente de “o Senhor”
  choice: O título foi mantido como “o Senhor”, sem paráfrase.
  alternative: “o Senhor Jesus” ou referência mais geral a Deus
  rationale: A menção de sua manifestação no contexto das Cartas Pastorais aponta fortemente para Cristo, mas a tradução preserva a formulação do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Manifestação” preserva o peso teológico de ἐπιφάνεια; “está reservada” soa mais natural em português atual do que uma reprodução literal de “está depositada”. O marcador [a] aparece imediatamente após a expressão comentada.
