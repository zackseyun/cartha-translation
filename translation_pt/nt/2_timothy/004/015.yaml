  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: pt
  text: Você também deve se precaver contra ele, pois ele se opôs fortemente às nossas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à nossa mensagem» ou «ao nosso ensino». O grego diz «às nossas palavras».
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: deve se precaver contra
  rationale: O imperativo presente médio pede cautela pessoal contínua. A formulação é natural em português e preserva a força da advertência.
- source_word: λίαν
  choice: fortemente
  rationale: O advérbio intensifica a oposição e combina de modo idiomático com «se opôs».
- source_word: ἀντέστη
  choice: se opôs
  rationale: Expressa com clareza o ato de colocar-se contra ou resistir, sem acrescentar um contexto jurídico ou doutrinário.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: às nossas palavras
  rationale: Mantém a formulação concreta e abrangente do grego, sem restringi-la a mensagem, ensino ou testemunho formal.
- source_word: ὃν
  choice: ele
  rationale: Retoma naturalmente Alexandre, mencionado no versículo anterior.
- source_word: καὶ σὺ
  choice: Você também
  rationale: Preserva a ênfase em Timóteo e sua ligação com a experiência anterior de Paulo.
theological_decisions:
- issue: Alcance de «nossas palavras»
  choice: Referência abrangente às palavras ditas por Paulo e seus companheiros, sem especificar uma categoria técnica.
  alternative: nosso testemunho de defesa; nossa mensagem; nosso ensino
  rationale: O texto não determina se a oposição ocorreu em tribunal, na pregação pública ou contra o ensino cristão em sentido mais amplo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Precaver-se contra» mantém o tom sério da advertência sem soar excessivamente coloquial; «nossas palavras» preserva a ambiguidade do original.
