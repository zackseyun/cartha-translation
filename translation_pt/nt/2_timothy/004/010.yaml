id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: pt
  text: Pois Demas me abandonou[a], por ter amado a era presente, e foi para Tessalônica; Crescente, para a Galácia; Tito, para a Dalmácia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «me desertou».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: abandonou
  rationale: Expressa que Demas deixou Paulo para trás de modo grave e censurável, sem afirmar além do texto que ele tenha apostatado definitivamente.
- source_word: ἀγαπήσας
  choice: por ter amado
  rationale: Preserva a forma participial e torna natural em português a provável relação causal entre o amor de Demas pela era presente e seu abandono de Paulo.
- source_word: τὸν νῦν αἰῶνα
  choice: a era presente
  rationale: Mantém o sentido temporal e ético de αἰών, evitando que «mundo» seja entendido primariamente como o cosmos físico.
- source_word: ἐπορεύθη
  choice: foi
  rationale: Verbo simples e natural para indicar o deslocamento até Tessalônica, sem especificar indevidamente o modo da viagem.
- source_word: Θεσσαλονίκην
  choice: Tessalônica
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: Κρήσκης
  choice: Crescente
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal.
- source_word: Γαλατίαν
  choice: Galácia
  rationale: Forma portuguesa consagrada do nome da região.
- source_word: Τίτος
  choice: Tito
  rationale: Forma portuguesa consagrada do nome pessoal.
- source_word: Δαλματίαν
  choice: Dalmácia
  rationale: Forma portuguesa consagrada do nome da região.
- source_word: γάρ
  choice: Pois
  rationale: Conserva a ligação explicativa com o pedido e a situação apresentados no contexto anterior.
theological_decisions:
- issue: Se a partida de Demas deve ser traduzida de modo a implicar apostasia ou apenas abandono de Paulo
  choice: «me abandonou», preservando a censura moral sem declarar apostasia definitiva
  alternative: Uma formulação mais forte que afirme abandono da fé, ou uma formulação neutra como «me deixou»
  rationale: O versículo associa a partida de Demas ao amor pela era presente, mas não declara explicitamente sua apostasia final. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse do verbo nas duas últimas orações reproduz com naturalidade a lista concisa do grego.
