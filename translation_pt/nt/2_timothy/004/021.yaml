source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: pt
  text: Faça todo o possível para vir antes do inverno. Êubulo manda saudações a você, assim como Pudente, Lino, Cláudia e todos os irmãos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os irmãos e irmãs»; o grego diz «irmãos», mas, neste contexto, o termo pode se referir ao grupo mais amplo dos que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Faça todo o possível
  rationale: O imperativo aoristo de σπουδάζω comunica empenho diligente e urgência. A expressão é natural em português e preserva ambos os aspectos.
- source_word: πρὸ χειμῶνος
  choice: antes do inverno
  rationale: πρό com o genitivo indica anterioridade temporal; esta é a formulação idiomática e direta em português.
- source_word: ἐλθεῖν
  choice: para vir
  rationale: O infinitivo completa Σπούδασον e descreve a ida de Timóteo até Paulo; «vir» preserva naturalmente a perspectiva do remetente.
- source_word: Ἀσπάζεταί σε
  choice: manda saudações a você
  rationale: No contexto epistolar, ἀσπάζομαι é expresso naturalmente como o envio de saudações. A construção evita a ambiguidade que «saúda você» poderia ter no português corrente.
- source_word: Εὔβουλος
  choice: Êubulo
  rationale: Transliteração portuguesa tradicional do nome próprio grego, com acento para representar claramente a pronúncia proparoxítona.
- source_word: Πούδης
  choice: Pudente
  rationale: Forma tradicional portuguesa do nome próprio latino representado pelo grego Πούδης.
- source_word: Λίνος
  choice: Lino
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: Κλαυδία
  choice: Cláudia
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: todos os irmãos
  rationale: Preserva a forma masculina plural do grego. No uso cristão antigo, ἀδελφοί também pode designar coletivamente homens e mulheres da comunidade, possibilidade indicada em nota.
theological_decisions:
- issue: Sentido de ἀδελφοί em um grupo cristão possivelmente misto
  choice: todos os irmãos
  alternative: todos os irmãos e irmãs; todos os que creem
  rationale: O texto-fonte emprega o masculino plural ἀδελφοί, preservado no texto principal sem decidir que o grupo era exclusivamente masculino. A nota registra o possível referente inclusivo do termo no contexto comunitário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «A você» evita a variação regional e a possível inconsistência de concordância associada a «tu». Os nomes seguem formas portuguesas convencionais.
