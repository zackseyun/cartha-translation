id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: pt
  text: Mas você, mantenha a mente lúcida em tudo, suporte as dificuldades, faça o trabalho de um evangelista e cumpra plenamente o seu ministério.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mas você
  rationale: O pronome expresso dá ênfase pessoal, e δέ estabelece contraste com as pessoas descritas nos versículos anteriores. “Mas você” conserva ambos com naturalidade em português.
- source_word: νῆφε
  choice: mantenha a mente lúcida
  rationale: Embora o verbo possa significar literalmente estar sóbrio, no Novo Testamento seu uso é figurado e indica lucidez, domínio de si e firmeza. A formulação comunica esse sentido sem sugerir principalmente abstinência de álcool.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: Preserva a abrangência da expressão grega e modifica naturalmente a ordem de manter a lucidez, sem decidir se a ênfase recai em circunstâncias, assuntos ou ocasiões.
- source_word: κακοπάθησον
  choice: suporte os sofrimentos
  rationale: O imperativo chama Timóteo a aceitar e perseverar nas dificuldades. “Suporte” expressa resistência firme, enquanto o plural “sofrimentos” é uma forma natural de representar a ideia coletiva do grego.
- source_word: ἔργον ποίησον
  choice: faça o trabalho
  rationale: Reproduz de modo direto e idiomático a combinação grega e mantém a força imperativa.
- source_word: εὐαγγελιστοῦ
  choice: de um evangelista
  rationale: Designa alguém que anuncia as boas-novas. “Evangelista” é um termo estabelecido e compreensível, sem acrescentar uma definição denominacional do ofício.
- source_word: τὴν διακονίαν σου
  choice: o seu ministério
  rationale: No contexto da incumbência pastoral e da proclamação do evangelho confiadas a Timóteo, “ministério” representa melhor o serviço específico em vista do que o termo genérico “serviço”.
- source_word: πληροφόρησον
  choice: cumpra plenamente
  rationale: O verbo expressa levar uma incumbência à plena realização. “Cumpra plenamente” conserva a ideia de completude de forma concisa e natural.
theological_decisions:
- issue: Natureza da incumbência de Timóteo em διακονία
  choice: o seu ministério
  alternative: o seu serviço
  rationale: O contexto trata da obra de proclamar a mensagem e da responsabilidade pastoral confiada a Timóteo. “Ministério” expressa esse serviço incumbido sem determinar uma estrutura eclesiástica denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A série de imperativos foi mantida direta e vigorosa. Não foram necessárias notas, pois as alternativas lexicais não alteram substancialmente o sentido e a tradução preserva a abrangência de ἐν πᾶσιν.
