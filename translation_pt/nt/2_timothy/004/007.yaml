  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: pt
  text: Combati o bom combate, terminei a corrida, guardei a fé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mantive a fé» ou «permaneci fiel». A expressão grega pode referir-se à fé cristã ou à fidelidade mantida.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: o bom combate
  rationale: ἀγών designa luta, combate ou competição; «bom combate» é natural, digno e preserva tanto a força da metáfora quanto a formulação tradicional em português.
- source_word: ἠγώνισμαι
  choice: combati
  rationale: O perfeito grego apresenta a ação como concluída e ainda relevante. O pretérito perfeito simples é a forma idiomática em português para expressá-la neste contexto.
- source_word: δρόμον
  choice: a corrida
  rationale: δρόμος pode indicar percurso ou corrida. «Corrida» mantém de modo claro a metáfora atlética.
- source_word: τετέλεκα
  choice: terminei
  rationale: O perfeito de τελέω indica que algo foi levado ao fim. «Terminei» é conciso e natural.
- source_word: πίστιν
  choice: a fé
  rationale: O artigo favorece «a fé», possivelmente a fé cristã preservada por Paulo, sem excluir completamente a ideia de fidelidade; a ambiguidade é registrada em nota.
- source_word: τετήρηκα
  choice: guardei
  rationale: τηρέω pode significar guardar, conservar ou observar. «Guardei» preserva a possibilidade de manutenção fiel e de proteção.
theological_decisions:
- issue: Sentido de τὴν πίστιν
  choice: a fé
  alternative: mantive a fé / permaneci fiel
  rationale: O artigo e o contexto sustentam a referência à fé cristã, mas πίστις também pode envolver fidelidade pessoal. A leitura principal permanece no texto e a alternativa é preservada em nota, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura tríplice e paralela do grego foi preservada; os pretéritos perfeitos simples soam mais naturais em português do que formas compostas.
