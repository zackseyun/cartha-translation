reference: 2 Timothy 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: pt
  text: e desviarão os ouvidos[a] da verdade, voltando-se para os mitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a audição”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fábulas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: a verdade
  rationale: O artigo definido grego é preservado, sem restringir o sentido a uma formulação interpretativa como “a sã doutrina” ou “o evangelho”.
- source_word: ἀκοὴν
  choice: os ouvidos
  rationale: Embora o substantivo grego signifique literalmente “audição”, a expressão portuguesa “desviar os ouvidos” comunica de modo natural a recusa deliberada de escutar e preserva a imagem do original.
- source_word: ἀποστρέψουσιν
  choice: desviarão
  rationale: Mantém o sentido ativo de afastar ou virar para longe, com “os ouvidos” como objeto.
- source_word: μύθους
  choice: mitos
  rationale: É o equivalente moderno mais direto para narrativas inventadas ou especulativas; “fábulas” permanece como alternativa lexical possível.
- source_word: ἐκτραπήσονται
  choice: voltando-se
  rationale: Expressa naturalmente o movimento em direção aos mitos e evita decidir de maneira excessiva entre a nuance média e a passiva da forma grega.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: da ... para os
  rationale: A oposição direcional entre afastar-se da verdade e voltar-se para os mitos fica clara em português, sem reproduzir de modo rígido a correlação μέν...δέ.
theological_decisions:
- issue: Natureza de “a verdade” no contexto
  choice: a verdade
  alternative: a sã doutrina; a verdade do evangelho
  rationale: O contexto relaciona a expressão ao ensino apostólico, mas o próprio versículo emprega o termo mais amplo “verdade”; a tradução preserva essa amplitude e não resolve a tensão por expansão interpretativa.
- issue: Agência em ἐκτραπήσονται
  choice: voltando-se
  alternative: serão desviados
  rationale: A forma pode admitir nuance média ou passiva. A construção escolhida é natural e mantém em aberto, tanto quanto possível, se a ênfase recai na inclinação das pessoas ou em uma influência que as desvia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Desviar os ouvidos” é idiomático e conserva a metáfora auditiva; “mitos” evita o tom potencialmente arcaico de “fábulas”. A coordenação com gerúndio torna natural em português o contraste direcional do grego.
