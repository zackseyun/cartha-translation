id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: pt
  text: O Senhor me livrará de toda ação maligna[a] e me levará a salvo para o seu Reino celestial.[b] A ele seja a glória para todo o sempre.[c] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de toda obra má”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “me salvará para dentro do seu Reino celestial”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “pelos séculos dos séculos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: me livrará
  rationale: O verbo ῥύομαι expressa resgate ou libertação diante de perigo. “Livrará” é natural em português, mantém o peso bíblico do termo e não promete especificamente que Paulo escaparia da morte física.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: de toda ação maligna
  rationale: ἔργον pode significar obra, feito ou ação, e πονηρός indica o que é mau ou maligno. “Toda ação maligna” é claro e preserva a formulação distributiva de παντός sem especificar quem pratica a ação.
- source_word: σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: me levará a salvo para o seu Reino celestial
  rationale: σῴζω conserva a ideia de salvar ou preservar, enquanto εἰς aponta para o Reino como destino. “Levará a salvo para” comunica em português corrente tanto a preservação quanto o movimento rumo ao Reino, sem a construção pouco idiomática “salvará para dentro de”.
- source_word: κύριος
  choice: Senhor
  rationale: “Senhor” é o equivalente português consagrado e adequado ao peso de autoridade e devoção presente no contexto.
- source_word: ᾧ ἡ δόξα
  choice: A ele seja a glória
  rationale: A formulação reproduz naturalmente a atribuição doxológica expressa pela oração nominal grega.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: para todo o sempre
  rationale: É uma expressão portuguesa natural para a duração ilimitada indicada pelo idioma grego, literalmente “pelos séculos dos séculos”.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a transliteração litúrgica tradicional e amplamente compreendida em português.
theological_decisions:
- issue: Relação entre o livramento presente e a salvação final
  choice: A tradução distingue o livramento de toda ação maligna da chegada a salvo ao Reino celestial, sem afirmar que Paulo escaparia da execução.
  alternative: Entender o primeiro verbo como promessa de livramento da morte física, ou restringi-lo exclusivamente a um livramento espiritual.
  rationale: A combinação de ῥύσεταί com σώσει e o destino expresso por “seu Reino celestial” permite manter a confiança no cuidado presente e na salvação final, sem resolver além do texto a forma concreta do livramento.
- issue: Força salvífica de σώσει
  choice: “me levará a salvo” preserva no contexto a ideia de salvação e proteção até a entrada no Reino.
  alternative: Traduzir de modo formal como “me salvará para dentro do seu Reino celestial”.
  rationale: A alternativa mais literal seria pouco natural em português. A redação escolhida não reduz σῴζω a mero transporte, pois “a salvo” mantém explicitamente a noção de preservação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Reino” recebe inicial maiúscula por referência definida ao Reino celestial do Senhor, sem acrescentar conteúdo interpretativo. A construção “levará a salvo” evita rigidez sintática e conserva a tensão entre preservação e salvação final.
