  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: pt
  text: Faça todo o possível para vir até mim depressa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Empenhe-se em vir até mim logo»; ou: «Faça o máximo para vir até mim depressa».'
    reason: Alternativas lexicais que preservam as nuances de diligência em σπουδάζω e de rapidez ou brevidade temporal em ταχέως.
lexical_decisions:
- source_word: Σπούδασον
  choice: Faça todo o possível
  rationale: O imperativo aoristo de σπουδάζω expressa empenho sério e diligente, não apenas rapidez. A formulação é natural em português e mantém esse elemento distinto de ταχέως.
- source_word: ἐλθεῖν
  choice: vir
  rationale: O infinitivo de ἔρχομαι, acompanhado de πρός με, indica movimento em direção ao falante; por isso, «vir» é a escolha dêitica natural.
- source_word: πρός με
  choice: até mim
  rationale: Com o acusativo, πρός indica movimento em direção a uma pessoa. «Até mim» comunica o destino com clareza e naturalidade.
- source_word: ταχέως
  choice: depressa
  rationale: O advérbio pode indicar rapidez ou brevidade temporal. «Depressa» preserva a urgência e evita fundi-lo com o empenho já expresso por Σπούδασον.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução distingue o empenho exigido pelo primeiro verbo da urgência expressa pelo advérbio.
