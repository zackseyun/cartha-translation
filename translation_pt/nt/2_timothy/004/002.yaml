id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: pt
  text: Proclame a palavra; esteja pronto, seja em ocasião favorável, seja desfavorável[a]; corrija, repreenda, exorte[b], com toda a paciência e instrução.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em tempo oportuno e inoportuno” ou “quer o momento seja conveniente, quer não”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “encoraje” ou “insista”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Proclame
  rationale: O imperativo de κηρύσσω indica proclamação pública. “Proclame” é claro, digno e mais amplamente compreensível em português internacional do que opções ligadas especificamente ao púlpito.
- source_word: τὸν λόγον
  choice: a palavra
  rationale: Mantém a expressão ampla e teologicamente significativa do grego sem restringi-la explicitamente ao evangelho ou às Escrituras.
- source_word: ἐπίστηθι
  choice: esteja pronto
  rationale: Expressa a ideia de estar presente e preparado para agir; no contexto, combina naturalmente com o par adverbial que se segue.
- source_word: εὐκαίρως ἀκαίρως
  choice: seja em ocasião favorável, seja desfavorável
  rationale: Comunica diretamente o contraste entre circunstâncias oportunas e inoportunas, preservando o paralelismo retórico.
- source_word: ἔλεγξον
  choice: corrija
  rationale: Transmite a ação de apontar o erro com finalidade corretiva em linguagem atual, sem reduzir o verbo a uma convicção meramente interior.
- source_word: ἐπιτίμησον
  choice: repreenda
  rationale: Preserva a força mais severa deste segundo imperativo corretivo e sua distinção em relação a “corrija”.
- source_word: παρακάλεσον
  choice: exorte
  rationale: Neste encargo ministerial, comunica uma convocação insistente à ação, sem excluir os matizes possíveis de encorajamento.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: com toda a paciência
  rationale: μακροθυμία denota paciência perseverante, sobretudo no trato com pessoas; a formulação é natural e retém a abrangência de πάσῃ.
- source_word: καὶ διδαχῇ
  choice: e instrução
  rationale: Indica que a correção e a exortação devem ser acompanhadas de ensino; “instrução” funciona naturalmente como substantivo coordenado a “paciência”.
theological_decisions:
- issue: Alcance de “a palavra”
  choice: a palavra
  alternative: a mensagem; o evangelho; as Escrituras
  rationale: Embora o contexto associe a proclamação à mensagem apostólica e às Escrituras, λόγος não é explicitamente restringido neste versículo. A tradução preserva essa amplitude.
- issue: Força de παρακάλεσον
  choice: exorte
  alternative: encoraje; anime; insista
  rationale: O verbo pode abranger encorajamento e apelo insistente. “Exorte” preserva essa tensão melhor no contexto dos imperativos de correção, e a nota registra alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A sequência curta de imperativos reproduz o ritmo enfático do grego. Evitou-se linguagem denominacional e manteve-se a ambiguidade legítima de λόγος e παρακαλέω.
