  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: pt
  text: O Senhor esteja com o seu espírito.[a] A graça esteja com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego passa do singular, em «seu espírito», para o plural, em «vocês».
    reason: Preservar e esclarecer a mudança gramatical de número, que indica a ampliação dos destinatários na bênção final.
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: É o equivalente português natural e tradicional de κύριος neste contexto de bênção epistolar, preservando o título sem explicitar além do grego quem é o referente.
- source_word: μετὰ
  choice: esteja com
  rationale: O grego não traz verbo expresso, mas a fórmula de bênção em português pede o subjuntivo desiderativo «esteja com», que comunica naturalmente o sentido implícito.
- source_word: πνεύματός
  choice: espírito
  rationale: A referência ao «seu espírito» indica o espírito humano de Timóteo; por isso, usa-se inicial minúscula, sem excluir a atuação do Espírito Santo implícita na bênção.
- source_word: σου
  choice: seu
  rationale: Mantém a referência singular a Timóteo. Embora «seu» possa ser formalmente ambíguo em português, o contexto e a nota esclarecem o contraste com o plural seguinte.
- source_word: χάρις
  choice: graça
  rationale: «Graça» é a equivalência corrente e teologicamente adequada para χάρις nas fórmulas finais paulinas; «favor» seria possível, mas menos natural neste contexto.
- source_word: ὑμῶν
  choice: vocês
  rationale: «Vocês» expressa claramente o plural em português moderno e preserva a mudança do singular dirigido a Timóteo para a bênção destinada ao grupo mais amplo. Não se acrescenta «todos», pois essa palavra não está expressa no grego.
theological_decisions:
- issue: Referente de «o Senhor»
  choice: Preservar o título «o Senhor», entendido naturalmente como referência ao Senhor Jesus na fórmula paulina.
  alternative: Entender a expressão como referência mais geral a Deus.
  rationale: O uso paulino em bênçãos finais favorece a referência a Jesus, mas a tradução não acrescenta «Jesus», preservando a formulação e a medida de explicitação do texto grego.
- issue: Mudança de número entre as duas orações
  choice: A primeira bênção dirige-se individualmente a Timóteo; a segunda se estende a um grupo plural.
  alternative: Tratar ambas as orações como dirigidas somente a Timóteo.
  rationale: O grego muda deliberadamente de σου, singular, para ὑμῶν, plural. A tradução conserva essa diferença por meio de «seu» e «vocês», e a nota a torna explícita.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. «Vocês» foi preferido a «vós» por ser amplamente compreensível e corrente; a construção concisa conserva o caráter de bênção final.
