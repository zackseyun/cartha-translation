base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: pt
  text: Erasto ficou em Corinto, mas deixei Trófimo doente em Mileto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Erasto
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio grego Ἔραστος.
- source_word: ἔμεινεν
  choice: ficou
  rationale: O aoristo de μένω indica que Erasto permaneceu naquele lugar; “ficou” é natural, claro e adequado a um relato de viagem.
- source_word: ἐν Κορίνθῳ
  choice: em Corinto
  rationale: Uso locativo normal de ἐν com nome de cidade.
- source_word: Τρόφιμον
  choice: Trófimo
  rationale: Forma portuguesa tradicional do nome próprio grego Τρόφιμος.
- source_word: δὲ
  choice: mas
  rationale: Expressa o contraste leve entre as duas notícias de viagem.
- source_word: ἀπέλιπον
  choice: deixei
  rationale: Primeira pessoa singular do aoristo de ἀπολείπω; “deixei” preserva o sentido básico sem explicitar desnecessariamente “para trás”.
- source_word: ἐν Μιλήτῳ
  choice: em Mileto
  rationale: Uso locativo normal de ἐν; “Mileto” é a forma portuguesa estabelecida do topônimo.
- source_word: ἀσθενοῦντα
  choice: doente
  rationale: O particípio presente modifica Trófimo e descreve sua condição quando Paulo o deixou; “doente” é conciso e contextualmente mais apropriado que o sentido geral “fraco”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes próprios. A ordem “deixei Trófimo doente em Mileto” acompanha de perto o grego e comunica naturalmente que Trófimo estava doente quando foi deixado.
