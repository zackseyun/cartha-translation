source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: pt
  text: Só Lucas está comigo. Pegue Marcos e traga-o com você, pois ele me é útil para o ministério.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o serviço”. O grego διακονία pode referir-se mais amplamente ao serviço, embora aqui provavelmente indique o trabalho ministerial.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lucas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal grego.
- source_word: μόνος
  choice: Só
  rationale: Expressa de modo natural e direto que Lucas é o único companheiro presente com Paulo.
- source_word: μετ’ ἐμοῦ
  choice: está comigo
  rationale: Preserva o sentido de companhia indicado por μετά com o genitivo.
- source_word: Μᾶρκον
  choice: Marcos
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal.
- source_word: ἀναλαβὼν
  choice: Pegue
  rationale: Representa a ação anterior de tomar Marcos consigo no contexto de uma viagem.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: traga-o com você
  rationale: Traduz a ordem de trazer Marcos na companhia de Timóteo, explicitando em português o objeto recuperado do contexto.
- source_word: γάρ μοι
  choice: pois ele me é
  rationale: Conserva tanto a explicação introduzida por γάρ quanto a referência pessoal expressa por μοι.
- source_word: εὔχρηστος
  choice: útil
  rationale: Equivalente claro e direto para aquilo que é proveitoso ou útil.
- source_word: εἰς διακονίαν
  choice: para o ministério
  rationale: No contexto do trabalho apostólico, 'ministério' comunica adequadamente o serviço em questão sem especificar um cargo formal; a amplitude lexical é preservada em nota.
theological_decisions:
- issue: Sentido de διακονία na utilidade de Marcos para Paulo
  choice: ministério
  alternative: serviço
  rationale: O contexto favorece o trabalho ministerial, mas o termo grego também pode designar serviço em sentido mais amplo; a nota preserva essa possibilidade sem transformar 'ministério' em ofício técnico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A construção 'me é útil' mantém concisão e registro literário moderado.
