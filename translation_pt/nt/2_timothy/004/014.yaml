source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: pt
  text: Alexandre, o trabalhador de metais[a], causou-me muitos males[b]; o Senhor lhe retribuirá conforme as suas obras.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Alexandre, o artesão em cobre».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «causou-me muito dano».'
    reason: lexical_alternative
  - marker: c
    text: 'Alguns manuscritos trazem: «Que o Senhor lhe retribua conforme as suas obras».'
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: trabalhador de metais
  rationale: O termo designa um artesão que trabalha com metal, frequentemente cobre ou bronze. A tradução ampla evita especificar um metal que o contexto não identifica com certeza.
- source_word: πολλά μοι κακὰ
  choice: muitos males contra mim
  rationale: Preserva a pluralidade e a força moral de κακά, enquanto «contra mim» expressa de modo natural a relação indicada por μοι.
- source_word: ἐνεδείξατο
  choice: praticou
  rationale: No contexto de uma conduta hostil dirigida contra Paulo, «praticou» comunica naturalmente a ideia de manifestar ou fazer males, sem reduzir κακά apenas ao resultado sofrido.
- source_word: ἀποδώσει
  choice: retribuirá
  rationale: O futuro do indicativo exprime aqui retribuição ou recompensa correspondente à conduta de Alexandre.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Mantém tanto o título κύριος quanto sua referência definida pelo artigo.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: conforme as obras dele
  rationale: Conserva a formulação de retribuição segundo as obras e deixa claro, em português corrente, que as obras são de Alexandre.
theological_decisions:
- issue: Se ἀποδώσει deve ser entendido como declaração futura ou como desejo/oração
  choice: o Senhor lhe retribuirá
  alternative: que o Senhor lhe retribua
  rationale: O texto do SBLGNT apresenta o futuro do indicativo ἀποδώσει, favorecendo uma declaração sobre a retribuição divina. A leitura optativa presente em alguns manuscritos é mantida em nota, sem apagar a diferença teológica entre afirmação e imprecação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Trabalhador de metais» evita a raridade de termos como «cobreiro» e a precisão indevida de «ferreiro»; «praticou muitos males contra mim» mantém o conteúdo moral do grego em uma construção portuguesa natural.
