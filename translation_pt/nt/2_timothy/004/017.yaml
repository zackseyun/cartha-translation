id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: pt
  text: Mas o Senhor esteve ao meu lado e me fortaleceu, para que, por meu intermédio, a proclamação fosse plenamente realizada e todos os gentios[a] ouvissem; e fui livrado da boca do leão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as nações”. O termo grego ἔθνη pode significar “gentios” ou “nações”; aqui provavelmente se refere aos povos não judeus que ouviriam o evangelho.
    reason: lexical_alternative
  - marker: b
    text: “Da boca do leão” pode ser uma expressão figurada para o livramento de um perigo mortal, e não necessariamente uma referência a um leão literal.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Mas o Senhor
  rationale: “Senhor” preserva a forma tradicional e não especifica além do texto o referente de κύριος; “mas” expressa o contraste introduzido por δέ com o abandono mencionado no versículo anterior.
- source_word: μοι παρέστη
  choice: esteve ao meu lado
  rationale: Expressa presença pessoal e solidária, não apenas proximidade espacial, em português natural.
- source_word: ἐνεδυνάμωσέν με
  choice: me fortaleceu
  rationale: Traduz de modo claro e corrente a ideia de conceder força ou capacitar.
- source_word: ἵνα δι’ ἐμοῦ
  choice: para que, por meu intermédio
  rationale: “Para que” conserva a força de propósito de ἵνα, e “por meu intermédio” comunica a agência indicada por διά com genitivo.
- source_word: τὸ κήρυγμα
  choice: a proclamação
  rationale: Mantém tanto a ação pública de proclamar quanto o conteúdo proclamado, sem reduzir o termo a uma forma específica de pregação.
- source_word: πληροφορηθῇ
  choice: fosse plenamente realizada
  rationale: Conserva a ideia de levar algo à plena execução ou realização, sem restringir o verbo apenas a “proclamar plenamente” ou a um cumprimento profético.
- source_word: ἀκούσωσιν
  choice: ouvissem
  rationale: Reproduz de maneira direta o subjuntivo dependente de ἵνα e deixa o objeto da audição implícito, como no grego.
- source_word: πάντα τὰ ἔθνη
  choice: todos os gentios
  rationale: No contexto da missão paulina, provavelmente designa os povos não judeus; a alternativa igualmente possível “todas as nações” é registrada em nota.
- source_word: ἐρρύσθην
  choice: fui livrado
  rationale: Comunica resgate de um perigo grave em registro bíblico digno e ainda corrente.
- source_word: ἐκ στόματος λέοντος
  choice: da boca do leão
  rationale: Preserva literalmente a imagem, sem decidir se ela se refere a perigo mortal, a uma pessoa, a um poder espiritual ou a um leão literal.
theological_decisions:
- issue: Referente de “o Senhor” (κύριος)
  choice: Mantido simplesmente como “o Senhor”.
  alternative: Identificar explicitamente Jesus ou Deus.
  rationale: O contexto pode levar muitos leitores a entender uma referência ao Senhor Jesus ressuscitado, mas o versículo não explicita essa identificação; a tradução conserva a formulação do texto.
- issue: Sentido de “da boca do leão”
  choice: A imagem foi mantida literalmente.
  alternative: Interpretá-la como Nero, Satanás, execução por animais ou perigo mortal em geral.
  rationale: O texto não resolve entre essas possibilidades históricas e figurativas; manter a imagem preserva sua ambiguidade e força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e preserva tanto a ambiguidade de ἔθνη quanto a imagem não interpretada da boca do leão. Os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
