  source_fidelity: 'A tradução acompanha com precisão a estrutura e o sentido do grego: δέ é adequadamente marcado por “Mas”; παρέστη exprime apoio pessoal em “esteve ao meu lado”; ἵνα preserva a finalidade; e o aoristo passivo ἐρρύσθην é bem vertido por “fui livrado”. “A proclamação fosse plenamente realizada” conserva de modo aceitável a amplitude de πληροφορηθῇ, sem reduzir o termo a mera pregação verbal ou a cumprimento profético.'
