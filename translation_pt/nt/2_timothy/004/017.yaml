  terminology: “Senhor”, “proclamação”, “gentios” e “livrado” são escolhas consistentes, compreensíveis e semanticamente defensáveis. A nota em “gentios” preserva corretamente a alternativa “nações”, e a nota sobre “a boca do leão” não impõe uma identificação interpretativa.
