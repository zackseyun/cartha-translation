  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: pt
  text: Quando você vier, traga a capa[b] que deixei em Trôade com Carpo, bem como os livros[a], especialmente os pergaminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os rolos”; o termo grego pode se referir a rolos escritos ou a materiais escritos semelhantes.
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes entendem “capa” como um estojo ou invólucro para livros, mas o sentido usual do termo grego é uma peça de roupa exterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: capa
  rationale: O termo designa mais naturalmente uma peça de roupa exterior, provavelmente ampla e apropriada para proteção. “Capa” é claro e corrente em português; a interpretação minoritária como estojo ou invólucro para livros fica registrada em nota.
- source_word: ἀπέλιπον
  choice: deixei
  rationale: O aoristo ativo na primeira pessoa indica de modo direto que Paulo deixou o objeto em Trôade; “deixei” é natural e suficiente.
- source_word: παρὰ Κάρπῳ
  choice: com Carpo
  rationale: παρά com dativo indica aqui que a capa ficou junto de Carpo, possivelmente em sua casa ou sob seus cuidados. “Com Carpo” preserva essa amplitude sem especificar além do texto.
- source_word: ἐρχόμενος
  choice: Quando você vier
  rationale: O particípio tem valor adverbial temporal em relação ao imperativo; esta formulação transmite isso de forma idiomática.
- source_word: φέρε
  choice: traga
  rationale: O imperativo de φέρω pede que Timóteo leve os objetos até Paulo; em português, a perspectiva do destinatário da ação exige naturalmente “traga”.
- source_word: τὰ βιβλία
  choice: os livros
  rationale: βιβλία pode designar livros, rolos ou outros documentos escritos. “Livros” é o equivalente amplo e convencional, enquanto a possível forma física em rolos é indicada em nota.
- source_word: καί
  choice: bem como
  rationale: A conjunção acrescenta os livros ao pedido da capa. “Bem como” evita uma sequência pesada de elementos coordenados e mantém o sentido aditivo.
- source_word: μάλιστα
  choice: especialmente
  rationale: O advérbio dá destaque particular aos pergaminhos sem necessariamente excluí-los da categoria anterior.
- source_word: τὰς μεμβράνας
  choice: os pergaminhos
  rationale: μεμβράνα refere-se a material de escrita feito de pele preparada e, por extensão, aos documentos nesse material. “Pergaminhos” é a forma portuguesa precisa e tradicional.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” torna explícito o destinatário singular sem recorrer ao registro regional de “tu”. A ordem foi mantida próxima à do grego, e as ambiguidades materiais de βιβλία e lexicais de φαιλόνην foram preservadas em notas. O marcador [a] foi colocado após “livros”, ao qual sua nota corresponde, e [b] ao fim do versículo para a alternativa referente a “capa”.
