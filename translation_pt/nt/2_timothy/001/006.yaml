  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: pt
  text: Por essa razão, lembro-lhe que reavive o dom de Deus que está em você por meio da imposição das minhas mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fazer arder novamente» ou «atiçar até voltar a flamejar». O verbo grego evoca a ação de fazer um fogo voltar a arder com força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Expressão causal idiomática que preserva a ligação com o contexto anterior em português natural.
- source_word: ἀναμιμνῄσκω
  choice: lembro
  rationale: O presente do indicativo expressa de modo direto o ato de recordar Timóteo de sua responsabilidade.
- source_word: σε ἀναζωπυρεῖν
  choice: você de reavivar
  rationale: O verbo evoca fazer o fogo ganhar vida e força outra vez; «reavivar» preserva tanto a renovação quanto a imagem do fogo sem tornar a frase pesada.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: o dom de Deus
  rationale: χάρισμα designa uma dádiva concedida por graça; «dom de Deus» é claro e evita especificar além do texto que se trata de um «dom espiritual».
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: que há em você
  rationale: Identifica o dom como presente em Timóteo, com formulação corrente e fiel ao sentido locativo do grego.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: por meio da imposição das minhas mãos
  rationale: Preserva a expressão reconhecida para o ato de impor as mãos e traduz διά com genitivo como meio ou instrumentalidade.
theological_decisions:
- issue: Relação entre o dom e a ação de Paulo
  choice: por meio da imposição das minhas mãos
  alternative: mediante a imposição das minhas mãos
  rationale: A formulação mantém a afirmação de que o dom está associado à imposição das mãos de Paulo e veio por esse meio, sem desenvolver uma teologia sacramental além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lembro você de» é natural no português brasileiro; «imposição das mãos» conserva a expressão bíblica reconhecida. A nota explicita a metáfora do fogo presente no verbo grego.
