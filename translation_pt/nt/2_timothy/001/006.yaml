    issue: A nota lexical propõe «manter aceso» como alternativa para ἀναζωπυρεῖν.
    rationale: «Manter aceso» descreve continuidade, ao passo que o verbo grego evoca reacender ou levar uma chama a arder novamente. A alternativa deve refletir a intensificação/renovação da imagem do fogo.
  - severity: low
    issue: «Lembro você de reavivar» tem alcance internacional limitado.
    rationale: Embora seja compreensível e usado no Brasil, «lembro-lhe que reavive» oferece uma construção mais amplamente aceita no português contemporâneo sem alterar o sentido do infinitivo grego.
