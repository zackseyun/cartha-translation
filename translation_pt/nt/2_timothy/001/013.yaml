source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: pt
  text: Mantenha o padrão das palavras sadias que você ouviu de mim, na fé e no amor que estão no Messias Jesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na fidelidade e no amor”. A palavra grega traduzida por “fé” também pode significar “fidelidade” ou “confiança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o padrão das palavras sadias que você ouviu de mim a respeito da fé e do amor no Messias Jesus”. A construção grega pode descrever tanto a maneira de Timóteo manter o padrão quanto o conteúdo das palavras.'
    reason: alternative_reading
  - marker: c
    text: 'Tradução tradicional: “Cristo Jesus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: modelo
  rationale: O substantivo indica um padrão, esboço ou modelo a ser seguido. “Modelo” é claro em português e conserva a ideia de uma forma normativa sem sugerir apenas um exemplo pessoal.
- source_word: ἔχε
  choice: Mantenha
  rationale: Embora o sentido básico seja “tenha”, o imperativo aqui pede que Timóteo conserve e siga o modelo recebido. “Mantenha” expressa essa continuidade com naturalidade.
- source_word: ὑγιαινόντων λόγων
  choice: palavras sadias
  rationale: Mantém tanto o substantivo λόγοι, “palavras”, quanto a metáfora de saúde em ὑγιαίνω, evitando a interpretação mais ampla “ensino correto”.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: que você ouviu de mim
  rationale: παρά com o genitivo indica a fonte; a oração relativa modifica naturalmente “palavras”.
- source_word: ἐν πίστει
  choice: na fé
  rationale: “Fé” preserva o sentido mais comum de πίστις; a possibilidade de “fidelidade” é registrada em nota.
- source_word: καὶ ἀγάπῃ
  choice: e no amor
  rationale: ἀγάπη corresponde diretamente a “amor”; a repetição da preposição produz uma coordenação natural em português.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: que estão no Messias Jesus
  rationale: A expressão preposicional qualifica conjuntamente a fé e o amor. O plural “estão” explicita essa relação sem eliminar a ambiguidade sintática mais ampla, que é indicada em nota.
- source_word: Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Χριστός conserva aqui valor titular; “Messias” comunica seu significado, enquanto a forma tradicional é preservada em nota.
theological_decisions:
- issue: Relação de ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ com o restante da frase
  choice: 'A expressão descreve a esfera ou maneira em que Timóteo deve manter o modelo: na fé e no amor que estão no Messias Jesus.'
  alternative: 'A expressão pode caracterizar o conteúdo das palavras sadias: palavras a respeito da fé e do amor no Messias Jesus.'
  rationale: O fluxo exortativo favorece a ligação com “mantenha”, mas a construção grega admite a outra relação; a nota conserva essa ambiguidade.
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: O termo funciona como título e “Messias” torna seu significado transparente, sem negar a tradução tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “Palavras sadias” preserva deliberadamente a metáfora do original; “você” torna a exortação direta e natural.
