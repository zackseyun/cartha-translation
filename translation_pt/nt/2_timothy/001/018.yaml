source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: pt
  text: Que o Senhor lhe conceda encontrar misericórdia da parte do Senhor naquele dia[a] — e você sabe melhor[b] o quanto ele serviu em Éfeso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Naquele dia» é uma forma comum no Novo Testamento de se referir ao futuro dia de juízo ou vindicação divina.
    reason: cross_reference
  - marker: b
    text: Literalmente, «você sabe melhor». O termo de comparação não é expresso no grego.
    reason: translation_clarity
  - marker: c
    text: Ou «todos os serviços que ele prestou» ou «todo o serviço que prestou». A expressão grega resume a extensão do serviço dele em Éfeso.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ
  choice: Que ... lhe conceda
  rationale: O optativo aoristo expressa um desejo ou uma oração. A construção portuguesa com «Que» e o presente do subjuntivo reproduz naturalmente essa força, e «lhe» representa o objeto dativo.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Tradução corrente de κύριος; a designação é mantida nas duas ocorrências sem identificar além do que o texto explicita.
- source_word: εὑρεῖν ἔλεος
  choice: encontrar misericórdia
  rationale: Preserva o idioma grego e seu tom bíblico, permanecendo inteligível em português moderno.
- source_word: παρὰ κυρίου
  choice: da parte do Senhor
  rationale: Com o genitivo, παρά pode indicar procedência. «Da parte do Senhor» comunica essa relação de modo natural e conserva a repetição de «Senhor».
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: naquele dia
  rationale: Equivalente temporal idiomático que mantém sem expansão a conhecida referência escatológica.
- source_word: ὅσα ... διηκόνησεν
  choice: quantos serviços ele prestou
  rationale: O neutro plural ὅσα resume a extensão dos atos de serviço. Esta formulação conserva o plural implícito e é mais natural do que uma reprodução literal como «quantas coisas ele serviu».
- source_word: ἐν Ἐφέσῳ
  choice: em Éfeso
  rationale: Tradução locativa direta e corrente.
- source_word: βέλτιον σὺ γινώσκεις
  choice: você sabe melhor do que eu
  rationale: βέλτιον é comparativo. O contexto sugere naturalmente a comparação com Paulo; a explicitação evita em português a leitura incompleta de «você sabe melhor», embora a base da comparação não esteja expressa no grego.
theological_decisions:
- issue: Referência das duas ocorrências de «Senhor»
  choice: As duas são traduzidas simplesmente por «o Senhor», sem distinguir as pessoas referidas.
  alternative: Entender a primeira como Cristo e a segunda como o Pai, ou ambas como referência a Cristo.
  rationale: O grego repete κύριος sem diferenciação explícita; a tradução preserva a ambiguidade teológica.
- issue: Sentido escatológico de «naquele dia»
  choice: Manter «naquele dia» sem explicação no corpo do versículo.
  alternative: Traduzir interpretativamente como «no dia do juízo» ou «no último dia».
  rationale: A expressão provavelmente aponta para o futuro dia de juízo ou vindicação divina, mas o texto não o nomeia dessa forma.
translation_notes:
  register: Português moderno, digno e acessível, com «você» para o singular σὺ. Preserva-se a repetição de «Senhor» e o idioma «encontrar misericórdia». A ordem foi levemente ajustada para fluência. Todos os marcadores de nota aparecem no texto principal.
