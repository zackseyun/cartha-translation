lexical_decisions:
- source_word: ἐπιποθῶν
  choice: ansiando
  rationale: O particípio presente expressa um desejo pessoal intenso. “Ansiando” preserva essa força afetiva em português atual e digno.
- source_word: σε ἰδεῖν
  choice: ver você
  rationale: O infinitivo completa naturalmente a ideia de ansiar; “ver você” é direto, claro e idiomático.
- source_word: μεμνημένος
  choice: lembrando-me
  rationale: O particípio perfeito indica um estado persistente de lembrança. A forma pronominal comunica com naturalidade que Paulo conserva na memória as lágrimas de Timóteo.
- source_word: σου τῶν δακρύων
  choice: das suas lágrimas
  rationale: A construção genitiva refere-se diretamente às lágrimas de Timóteo, sem interpretar além do que o texto afirma.
- source_word: ἵνα
  choice: para que
  rationale: Preserva a relação de propósito, sem excluir a nuance de resultado que a construção pode comportar.
- source_word: χαρᾶς
  choice: de alegria
  rationale: Com πληρωθῶ, o genitivo é expresso naturalmente em português pela locução “cheio de alegria”.
- source_word: πληρωθῶ
  choice: eu fique cheio
  rationale: O aoristo passivo do subjuntivo após ἵνα é vertido de modo idiomático, mantendo a ideia de vir a ser plenamente tomado pela alegria.
