  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: pt
  text: Por essa razão, também sofro estas coisas; mas não me envergonho, pois sei em quem tenho crido[a] e estou convencido de que ele é capaz de guardar o meu depósito[b] até aquele dia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em quem tenho confiado”. O verbo pode expressar tanto crer em alguém como depositar confiança nessa pessoa.'
    reason: lexical_alternative
  - marker: b
    text: “Meu depósito” traduz um termo usado para algo colocado sob os cuidados de alguém a fim de ser guardado. Pode referir-se ao que Paulo confiou a Deus ou ao que foi confiado a Paulo.
    reason: alternative_reading
  - marker: c
    text: Isto é, o futuro dia do juízo e da vindicação de Deus.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Expressão causal natural em português que mantém a ligação explícita com o contexto anterior.
- source_word: καὶ ταῦτα πάσχω
  choice: também sofro estas coisas
  rationale: Preserva tanto o valor aditivo de καί quanto o demonstrativo ταῦτα, sem especificar sofrimentos que o grego deixa implícitos.
- source_word: οὐκ ἐπαισχύνομαι
  choice: não me envergonho
  rationale: Equivalente corrente e direto para a atitude expressa pelo verbo no contexto.
- source_word: οἶδα γὰρ ᾧ πεπίστευκα
  choice: pois sei em quem tenho crido
  rationale: οἶδα tem força presente, e o perfeito πεπίστευκα indica uma fé estabelecida e contínua. A construção com 'em quem' é natural em português e mantém o referente pessoal sem identificá-lo além do grego.
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: 'Expressa com naturalidade o estado presente resultante do perfeito passivo: uma convicção firmada.'
- source_word: δυνατός ἐστιν
  choice: ele é capaz
  rationale: Mantém a afirmação explícita da capacidade do referente, sem expandir sua identidade.
- source_word: τὴν παραθήκην μου
  choice: o meu depósito
  rationale: Conserva a metáfora jurídica e fiduciária de algo deixado sob custódia e, sobretudo, não resolve a ambiguidade do genitivo quanto à direção da incumbência.
- source_word: φυλάξαι
  choice: guardar
  rationale: Adequa-se à imagem de custódia de um depósito e pode significar proteger, conservar ou manter em segurança.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: até aquele dia
  rationale: Representa de modo idiomático a orientação temporal e escatológica da expressão, sem acrescentar maiúscula interpretativa.
theological_decisions:
- issue: Referente de ᾧ e sujeito implícito de δυνατός ἐστιν
  choice: Manter o referente implícito por meio de 'em quem' e 'ele'.
  alternative: Identificá-lo expressamente como Deus ou como Cristo Jesus.
  rationale: Embora o contexto aponte para Deus conhecido em Cristo, esta oração não nomeia o referente; a tradução preserva o mesmo grau de especificidade do grego.
- issue: Sentido de παραθήκη μου
  choice: Traduzir por 'o meu depósito', mantendo a metáfora e a ambiguidade.
  alternative: Explicitar como aquilo que Paulo confiou a Deus ou como aquilo que foi confiado a Paulo, por exemplo o evangelho e seu ministério.
  rationale: A construção grega admite mais de uma relação entre Paulo e o depósito. Escolher uma paráfrase direcional no texto principal eliminaria uma tensão interpretativa genuína.
- issue: Sentido de 'aquele dia'
  choice: Manter a expressão alusiva no texto e explicá-la em nota.
  alternative: Inserir no texto principal 'o dia do juízo final' ou expressão semelhante.
  rationale: O grego usa uma referência escatológica reconhecível, mas não a desenvolve nesta oração; a nota esclarece sem sobrecarregar ou estreitar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A expressão técnica 'meu depósito' é mantida deliberadamente para preservar a metáfora e a ambiguidade do original, sendo esclarecida em nota. A referência divina permanece implícita como no grego.
