id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: pt
  text: Portanto, não se envergonhe do testemunho a respeito de nosso Senhor[a], nem de mim, prisioneiro dele. Pelo contrário, participe dos sofrimentos pelo evangelho[b], segundo o poder de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do testemunho de nosso Senhor”. O genitivo grego também permite entender que o testemunho procede do Senhor, embora neste contexto provavelmente se refira ao testemunho a respeito dele.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “sofra juntamente pelo evangelho”. O verbo grego contém a ideia de participar com outros no sofrimento e nas dificuldades.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pelo poder de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Portanto, não
  rationale: οὖν introduz uma inferência baseada na exortação anterior; “portanto” mantém essa conexão lógica, e μή com o subjuntivo aoristo expressa proibição.
- source_word: ἐπαισχυνθῇς
  choice: se envergonhe
  rationale: O verbo indica sentir vergonha ou recuar por causa da desonra; a construção reflexiva é natural em português e conserva a força social e moral do termo.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: o testemunho a respeito de nosso Senhor
  rationale: “Testemunho” preserva o substantivo μαρτύριον. O genitivo é provavelmente objetivo neste contexto, isto é, o testemunho acerca do Senhor, embora a nota mantenha a leitura alternativa genuína.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: nem de mim, prisioneiro dele
  rationale: μηδέ coordena aquilo de que Timóteo não deve se envergonhar. “Prisioneiro dele” conserva αὐτοῦ e sua ideia de pertencimento ou associação com o Senhor, sem reduzi-la apenas a causa.
- source_word: συγκακοπάθησον
  choice: participe dos sofrimentos
  rationale: O composto inclui a ideia de sofrer aflições juntamente com outros. A formulação comunica essa participação de modo natural, sem especificar um companheiro que o grego deixa implícito.
- source_word: τῷ εὐαγγελίῳ
  choice: pelo evangelho
  rationale: O dativo comprimido indica associação com o evangelho no sofrimento; em português, “pelo evangelho” expressa naturalmente o âmbito ou a causa, enquanto a nota registra uma alternativa mais formal.
- source_word: κατὰ δύναμιν θεοῦ
  choice: segundo o poder de Deus
  rationale: κατά com o acusativo pode indicar medida, norma ou conformidade. “Segundo” preserva essa amplitude melhor do que uma formulação puramente instrumental.
theological_decisions:
- issue: Relação entre “testemunho” e “nosso Senhor”
  choice: 'genitivo objetivo: “o testemunho a respeito de nosso Senhor”'
  alternative: 'genitivo subjetivo: “o testemunho de nosso Senhor”'
  rationale: O contexto trata do testemunho cristão centrado no Senhor e o põe em paralelo com Paulo, prisioneiro dele. A leitura objetiva é provavelmente a pretendida, mas a alternativa permanece gramaticalmente possível e é registrada em nota.
- issue: Sentido de “prisioneiro dele”
  choice: manter a relação possessiva ou associativa com o Senhor
  alternative: explicitar “prisioneiro por causa dele” ou “por amor a ele”
  rationale: O genitivo αὐτοῦ relaciona a prisão de Paulo ao Senhor, mas não define sozinho se a relação principal é pertencimento, representação ou causa. A tradução evita resolver além do que o texto afirma.
- issue: Relação do sofrimento com o evangelho
  choice: “participe dos sofrimentos pelo evangelho”
  alternative: “sofra juntamente com o evangelho”
  rationale: A expressão grega é compacta. A tradução escolhida comunica em português a participação no sofrimento associado ao evangelho, sem sugerir literalmente que uma mensagem impessoal sofre.
- issue: Força de κατὰ em relação ao poder de Deus
  choice: “segundo o poder de Deus”
  alternative: “pelo poder de Deus”
  rationale: “Segundo” mantém aberta a possibilidade de medida, conformidade ou base capacitadora, enquanto “pelo” explicitaria sobretudo o valor instrumental.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação divide a longa frase grega para maior clareza sem alterar sua progressão exortativa. “Evangelho” mantém o termo cristão amplamente reconhecido; “participe dos sofrimentos” expressa naturalmente a força conjunta do verbo composto.
