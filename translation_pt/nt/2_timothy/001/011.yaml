lexical_decisions:
- source_word: εἰς ὃ
  choice: para o qual
  rationale: Retoma o evangelho mencionado no contexto anterior e mantém a relação de finalidade ou referência sem explicitá-la além do grego.
- source_word: ἐτέθην
  choice: fui designado
  rationale: Neste contexto de funções ministeriais, o passivo de τίθημι indica nomeação ou comissão, não colocação física.
- source_word: ἐγὼ
  choice: fui
  rationale: O pronome de primeira pessoa está naturalmente expresso pela forma verbal em português; acrescentar “eu” produziria uma ênfase mais marcada do que a necessária.
- source_word: κῆρυξ
  choice: arauto
  rationale: Expressa um proclamador público oficialmente encarregado e preserva melhor essa ideia do que “pregador”, que pode sugerir uma função eclesiástica posterior.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Na autorreferência paulina, é o título reconhecido e estabelecido, embora o termo também possa ter o sentido geral de enviado.
- source_word: διδάσκαλος
  choice: mestre
  rationale: É uma tradução natural e digna para quem ensina, adequada à sequência de funções; evita a conotação mais técnica de “instrutor”.
theological_decisions:
- issue: Traduzir κῆρυξ pelo termo eclesiástico tradicional “pregador” ou pelo sentido lexical de proclamador oficial
  choice: arauto
  alternative: pregador
  rationale: “Arauto” destaca a proclamação pública por comissão e evita limitar o termo a uma função eclesiástica posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação concisa do grego foi preservada. Não se acrescentou nota, pois “arauto” comunica diretamente a nuance lexical pretendida.
