id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: pt
  text: Que o Senhor conceda misericórdia à casa de Onesíforo, pois ele muitas vezes me trouxe alívio e não se envergonhou da minha corrente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da minha prisão”; literalmente, “da minha corrente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Que ... conceda
  rationale: O optativo aoristo expressa um desejo ou oração; esta construção comunica isso de modo natural em português.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente corrente e adequado para o favor compassivo de Deus em uma fórmula de bênção.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Preserva o título divino sem identificar além do que o texto grego explicita.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: à família de Onesíforo
  rationale: Neste contexto, οἶκος designa provavelmente o grupo familiar ou doméstico, não apenas uma construção; “família” é claro e natural em português.
- source_word: ὅτι
  choice: pois
  rationale: Introduz naturalmente a razão do desejo expresso no início do versículo.
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Reproduz com clareza a ideia de ação repetida.
- source_word: ἀνέψυξεν
  choice: me reanimou
  rationale: Expressa o alívio e a renovação proporcionados a Paulo, mantendo a força metafórica do verbo.
- source_word: τὴν ἅλυσίν μου
  choice: minha corrente
  rationale: Mantém a imagem concreta e o singular do grego, embora a expressão possa representar metonimicamente o aprisionamento.
- source_word: οὐκ ἐπαισχύνθη
  choice: não se envergonhou
  rationale: Equivalente idiomático que preserva a dimensão moral e social do verbo.
theological_decisions:
- issue: Referente de “o Senhor” na bênção de Paulo
  choice: Manter “o Senhor” sem especificar o referente.
  alternative: Explicitar Deus Pai ou o Senhor Jesus.
  rationale: O grego traz apenas ὁ κύριος; a tradução preserva a ambiguidade sem impor uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Família” comunica naturalmente o sentido social de οἶκος; “corrente” preserva a imagem concreta do original, esclarecida em nota.
