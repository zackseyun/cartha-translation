- from: Que o Senhor conceda misericórdia à família de Onesíforo, pois muitas vezes ele me reanimou e não se envergonhou da minha corrente.[a]
  to: Que o Senhor conceda misericórdia à casa de Onesíforo, pois ele muitas vezes me trouxe alívio e não se envergonhou da minha corrente.[a]
