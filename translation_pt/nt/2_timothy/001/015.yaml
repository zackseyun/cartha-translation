id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: pt
  text: 'Você sabe disto: todos os que estão na Ásia[a] se afastaram de mim[b], entre eles Fígelo e Hermógenes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Ásia” se refere à província romana situada no oeste da Ásia Menor, não ao continente moderno.
    reason: cultural_note
  - marker: b
    text: Ou “me abandonaram”. Mais literalmente, o grego diz que eles “se afastaram de mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: Você sabe
  rationale: O verbo οἶδα tem aqui força presente e indica conhecimento já possuído; “você sabe” é direto e natural em português.
- source_word: τοῦτο ὅτι
  choice: 'disto:'
  rationale: O demonstrativo antecipa o conteúdo introduzido por ὅτι. Os dois-pontos reproduzem essa relação de modo idiomático e conciso.
- source_word: ἀπεστράφησάν με
  choice: se afastaram de mim
  rationale: A expressão conserva a imagem de voltar-se para longe de alguém e comunica rompimento de apoio ou lealdade sem definir além do que o grego afirma.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: todos os que estão na Ásia
  rationale: Mantém a abrangência de πάντες e a formulação locativa do grego, deixando que o contexto delimite o grupo referido.
- source_word: Ἀσίᾳ
  choice: Ásia
  rationale: Mantém o nome geográfico tradicional no texto; uma nota esclarece que se trata da província romana, não do continente moderno.
- source_word: ὧν ἐστιν
  choice: entre eles
  rationale: Expressa naturalmente em português que os dois homens nomeados pertencem ao grupo mencionado, preservando o sentido partitivo.
- source_word: Φύγελος
  choice: Fígelo
  rationale: Forma portuguesa tradicional e inteligível do nome grego.
- source_word: Ἑρμογένης
  choice: Hermógenes
  rationale: Forma portuguesa tradicional e inteligível do nome grego.
theological_decisions:
- issue: Alcance de “todos os que estão na Ásia”
  choice: Preservar “todos” sem acrescentar uma limitação explícita.
  alternative: Explicitar “todos os meus colaboradores na Ásia” ou entender a frase como cada cristão ou habitante da província, sem exceção.
  rationale: πάντες tem força abrangente, mas o grupo exato é delimitado pelo contexto. Acrescentar “colaboradores” resolveria uma ambiguidade que o texto não resolve; interpretar a expressão como todos os indivíduos da região ampliaria sua referência sem base explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Se afastaram de mim” preserva a imagem grega; “disto:” evita uma construção pesada com “que”. Os marcadores aparecem imediatamente após os termos a que se referem.
