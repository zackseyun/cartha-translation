id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: pt
  text: Pois Deus não nos deu espírito de covardia[a], mas de poder, de amor e de domínio próprio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “timidez” ou “temor covarde”; o termo grego indica covardia, não o medo em sentido geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “bom senso” ou “disciplina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois ... não
  rationale: γάρ introduz a explicação ligada à exortação anterior; “pois” mantém essa conexão, e “não” traduz diretamente οὐ.
- source_word: ἔδωκεν
  choice: deu
  rationale: O aoristo indicativo é expresso naturalmente pelo pretérito perfeito simples em português.
- source_word: ἡμῖν
  choice: nos
  rationale: 'O pronome átono comunica de modo natural o objeto indireto: Deus deu a nós.'
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Em português, o nome “Deus” normalmente dispensa artigo nesta construção.
- source_word: πνεῦμα
  choice: espírito
  rationale: A forma sem artigo preserva a abertura do grego entre uma disposição concedida por Deus e uma possível referência ao Espírito, sem impor uma identificação no texto.
- source_word: δειλίας
  choice: covardia
  rationale: O termo denota temor vergonhoso ou falta de coragem, sentido mais forte e específico que o medo comum.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca com clareza o forte contraste entre a covardia e as qualidades que se seguem.
- source_word: δυνάμεως
  choice: poder
  rationale: É a correspondência direta e corrente para a capacidade ou força expressa por δύναμις.
- source_word: ἀγάπης
  choice: amor
  rationale: Tradução moderna, direta e amplamente compreensível de ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: domínio próprio
  rationale: Expressa de modo claro a autodisciplina e o controle sensato implicados no termo, enquanto a nota registra suas outras nuances possíveis.
theological_decisions:
- issue: Referente de πνεῦμα
  choice: “espírito” em minúscula e sem artigo definido
  alternative: “o Espírito”, como referência direta ao Espírito Santo
  rationale: O substantivo anartro, qualificado pelos genitivos em contraste, pode descrever o espírito ou a disposição que Deus concede. A redação escolhida não exclui a atuação do Espírito Santo, mas evita especificar além do que a sintaxe imediata exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “de” na sequência conserva a estrutura equilibrada do grego. Os marcadores foram colocados junto aos termos a que suas notas se referem.
