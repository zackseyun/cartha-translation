source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: pt
  text: que nos salvou e nos chamou com um chamado santo[a], não segundo as nossas obras, mas segundo o seu próprio propósito e a sua graça, que nos foi dada no Messias Jesus[b] antes dos tempos eternos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um chamado santo” ou “por meio de um chamado santo”. O dativo grego pode ser entendido de mais de uma maneira.
    reason: lexical_alternative
  - marker: b
    text: Ou “em Cristo Jesus”. Aqui se usa “Messias Jesus” porque Χριστός é entendido como título.
    reason: alternative_reading
  - marker: c
    text: Ou “antes das eras eternas”, “antes do início dos tempos” ou, de modo mais idiomático, “antes do início do tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: salvou
  rationale: O particípio aoristo de σῴζω é vertido pelo termo soteriológico corrente em português, preservando seu peso no uso paulino.
- source_word: καλέσαντος
  choice: chamou
  rationale: Mantém o paralelismo com “salvou” e a ressonância teológica do chamado divino.
- source_word: κλήσει ἁγίᾳ
  choice: com um chamado santo
  rationale: Reproduz de modo natural a construção com dativo sem restringi-la decisivamente a meio, finalidade ou esfera.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: não segundo as nossas obras
  rationale: Preserva κατά como padrão ou fundamento e mantém “obras” como termo paulino relevante.
- source_word: ἰδίαν πρόθεσιν
  choice: seu próprio propósito
  rationale: Expressa a referência implícita a Deus e traduz πρόθεσις por um termo estabelecido e semanticamente adequado.
- source_word: χάριν
  choice: graça
  rationale: Emprega o termo teológico corrente para χάρις no contexto paulino.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: que nos foi dada
  rationale: O particípio feminino concorda com “graça”; a formulação conserva de modo claro a voz passiva.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Traduz Χριστός como título e mantém ἐν, sem reduzir a expressão a mera forma nominal.
- source_word: πρὸ χρόνων αἰωνίων
  choice: antes dos tempos eternos
  rationale: Mantém a formulação incomum do grego de maneira inteligível, sem substituí-la silenciosamente pela interpretação idiomática “antes do início do tempo”.
theological_decisions:
- issue: Força interpretativa de κλήσει ἁγίᾳ
  choice: com um chamado santo
  alternative: para um chamado santo; por meio de um chamado santo
  rationale: O dativo admite mais de uma relação sintática; a redação escolhida conserva essa abertura.
- issue: Χριστός como título ou forma semelhante a nome
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: O sentido titular continua presente na fórmula paulina, por isso o título é traduzido.
- issue: Alcance de πρὸ χρόνων αἰωνίων
  choice: antes dos tempos eternos
  alternative: antes das eras eternas; antes do início dos tempos; antes do início do tempo
  rationale: A expressão grega é incomum e permite versões mais formais ou idiomáticas; o texto principal preserva mais de perto sua forma e tensão conceitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva os paralelismos do grego e evita resolver ambiguidades genuínas.
