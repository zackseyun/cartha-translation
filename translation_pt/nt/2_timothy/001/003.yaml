source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: pt
  text: Dou graças a Deus, a quem sirvo, à maneira de meus antepassados,[a] com consciência limpa, ao me lembrar constantemente de você em minhas orações, noite e dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “desde meus antepassados”. A expressão grega pode indicar continuidade com o serviço e a fé dos antepassados.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego traduzido por “sirvo” também pode ser entendido como “adoro” ou “presto culto”. A expressão “em minhas orações” é mais especificamente “em minhas súplicas” no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Dou graças a Deus
  rationale: A expressão idiomática χάριν ἔχω com dativo comunica agradecimento dirigido a alguém. “Dou graças a Deus” é natural, digna e mantém explicitamente o sentido de gratidão.
- source_word: ᾧ λατρεύω
  choice: a quem sirvo
  rationale: λατρεύω designa serviço religioso prestado a Deus e pode também ser traduzido por “adoro”. “Sirvo” preserva a amplitude entre devoção e serviço contínuo.
- source_word: ἀπὸ προγόνων
  choice: seguindo meus antepassados
  rationale: A construção concisa sugere continuidade com a fé e o serviço dos antepassados. Esta formulação evita a pouco natural tradução literal “desde os antepassados” sem afirmar que a consciência deles seja o ponto de comparação.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: com a consciência limpa
  rationale: A locução expressa a maneira pela qual Paulo serve a Deus. “Consciência limpa” é corrente e preserva a imagem moral de καθαρός.
- source_word: ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: ao me lembrar constantemente de você
  rationale: A formulação reproduz em português natural a ideia de manter lembrança ou menção contínua de Timóteo. “Ao” conserva a relação circunstancial de ὡς sem impor de modo rígido um valor causal.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: em minhas orações
  rationale: Embora δεήσεις destaque súplicas ou pedidos, “orações” é a expressão mais natural no contexto e não exclui esse caráter petitionário.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: noite e dia
  rationale: Expressão portuguesa idiomática que mantém a ordem e a ideia de regularidade contínua do grego.
theological_decisions:
- issue: Relação de Paulo com a fé de seus antepassados em ἀπὸ προγόνων
  choice: A tradução apresenta o serviço de Paulo a Deus em continuidade com o de seus antepassados.
  alternative: “desde os meus antepassados” ou “como os meus antepassados”
  rationale: O grego é compacto e admite nuances de origem, tradição e continuidade. “Seguindo meus antepassados” comunica continuidade sem sugerir repúdio à herança de Israel nem acrescentar uma reivindicação doutrinária além do texto.
- issue: Alcance religioso de λατρεύω
  choice: sirvo
  alternative: adoro
  rationale: O verbo pode designar tanto adoração quanto serviço religioso. “Sirvo” conserva o alcance mais amplo; a alternativa legítima é registrada em nota.
- issue: Ligação de ἐν καθαρᾷ συνειδήσει
  choice: A expressão modifica o serviço de Paulo a Deus.
  alternative: Entender a consciência limpa em relação mais ampla com sua lembrança e suas orações
  rationale: A proximidade sintática favorece sua ligação com λατρεύω, embora a frase inteira descreva a postura de Paulo diante de Deus. A tradução mantém essa ligação sem expandi-la teologicamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmos; “você” oferece clareza contemporânea no singular. A frase mantém o fluxo de uma única declaração grega, com pontuação suficiente para facilitar a leitura.
