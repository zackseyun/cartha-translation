reference: 2 Timothy 1:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: pt
  text: Ao me lembrar da fé sincera que há em você, a qual primeiro habitou em sua avó Lóide e em sua mãe Eunice, estou convencido de que ela também habita em você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: ao recordar
  rationale: A expressão idiomática indica receber uma lembrança ou ser levado a lembrar. “Ao recordar” é natural em português e preserva a relação circunstancial com o contexto imediato.
- source_word: ἀνυποκρίτου πίστεως
  choice: fé sincera
  rationale: ἀνυπόκριτος significa literalmente não hipócrita, isto é, genuína e sem fingimento; “sincera” comunica isso de modo claro e digno.
- source_word: ἐν σοὶ
  choice: que há em você
  rationale: A preposição ἐν indica a fé presente em Timóteo; esta formulação evita a possível leitura instrumental de “fé em você”.
- source_word: ἐνῴκησεν
  choice: habitou
  rationale: O verbo significa morar ou habitar em alguém. “Habitou” conserva a metáfora do texto grego e sua continuidade na oração final.
- source_word: μάμμῃ
  choice: avó
  rationale: Termo familiar para avó; a forma portuguesa comum é adequada ao registro moderno.
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: O perfeito expressa uma convicção estabelecida e presente; “estou convencido” reproduz bem esse valor.
theological_decisions:
- issue: Natureza e continuidade da fé entre Lóide, Eunice e Timóteo
  choice: Preservar a linguagem de uma fé que habita em cada pessoa, sem afirmar transmissão hereditária.
  alternative: Traduzir de modo que sugira que a fé foi passada automaticamente de uma geração à seguinte.
  rationale: O texto declara a presença anterior da mesma fé na avó e na mãe e a convicção de Paulo quanto a Timóteo, mas não explica o mecanismo dessa continuidade.
- issue: Força da convicção de Paulo na oração final elíptica
  choice: “também habita em você”
  alternative: “também está em você”
  rationale: O grego omite o verbo na oração final, retomando naturalmente ἐνῴκησεν. Repetir “habita” torna a elipse clara e conserva a metáfora.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a metáfora de habitação do grego e usa “você” em consonância com a camada inglesa fornecida e com o uso brasileiro amplo.
