  terminology: «Espírito Santo» e «habita em nós» são adequados, naturais e fiéis ao vocabulário teológico do original. «Bom depósito» mantém de modo útil a terminologia metafórica de παραθήκη e corresponde ao trilho de auditoria em inglês.
