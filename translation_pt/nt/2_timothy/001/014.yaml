  source_fidelity: 'A tradução reproduz com precisão os elementos centrais do grego: o imperativo de guardar (φύλαξον), a expressão metafórica e não especificada «o bom depósito» (τὴν καλὴν παραθήκην), o meio/agência «por meio do Espírito Santo» (διὰ πνεύματος ἁγίου) e a oração que identifica o Espírito como aquele que habita em nós. Não resolve indevidamente o referente do depósito nem o alcance de «nós».'
