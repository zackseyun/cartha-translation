id: 2TI.1.14
reference: 2 Timothy 1:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: pt
  text: Guarde o bom depósito por meio do Espírito Santo, que habita em nós.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o nobre depósito” ou “aquilo que foi confiado a você”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo Espírito Santo, que vive em nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραθήκην
  choice: depósito
  rationale: Designa algo confiado a alguém para ser guardado. “Depósito” preserva de modo conciso a metáfora de um bem valioso entregue aos cuidados de alguém.
- source_word: καλὴν
  choice: bom
  rationale: Qualifica o depósito como intrinsecamente bom. É a opção mais natural e evita restringir a ideia ao aspecto estético (“belo”) ou ao valor (“precioso”).
- source_word: φύλαξον
  choice: Guarde
  rationale: O imperativo pede proteção ativa e vigilante daquilo que foi confiado. “Guarde” é natural em português e conserva tanto a ideia de custódia quanto a de proteção.
- source_word: διὰ πνεύματος ἁγίου
  choice: por meio do Espírito Santo
  rationale: διά com o genitivo expressa aqui meio ou agência. “Por meio de” torna explícito esse valor instrumental sem acrescentar uma interpretação além do texto.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: que habita em nós
  rationale: O particípio presente descreve a residência contínua do Espírito. “Habita em nós” é claro, digno e evita terminologia técnica.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: Mantém o sentido direto de presença interior e não restringe o pronome a Paulo e Timóteo nem o amplia explicitamente a todos os crentes.
theological_decisions:
- issue: Referente de “o bom depósito”
  choice: Manter a expressão geral e metafórica “o bom depósito”.
  alternative: Explicitar “o evangelho confiado a você” ou “seu ministério”.
  rationale: O contexto aponta para a mensagem apostólica confiada a Timóteo, mas a formulação grega não identifica expressamente o referente. A tradução preserva essa concisão e tensão.
- issue: Alcance de “nós”
  choice: Conservar simplesmente “em nós”.
  alternative: Interpretar como “em todos nós, os crentes” ou como referência específica a Paulo e Timóteo.
  rationale: O pronome grego permite que a referência imediata tenha implicação comunitária mais ampla. Não convém estreitar ou universalizar o alcance no texto principal.
- issue: Valor de διά com o genitivo
  choice: 'Traduzir como meio: “por meio do Espírito Santo”.'
  alternative: 'Traduzir como agência: “pelo Espírito Santo”.'
  rationale: As duas formulações são possíveis e teologicamente compatíveis; “por meio de” preserva com maior transparência o valor instrumental da construção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Guarde” conserva a força do imperativo sem soar arcaico; “depósito” mantém a metáfora do original, esclarecida pela nota. A vírgula antes da oração relativa favorece a leitura natural e identifica o Espírito Santo como aquele que habita em nós.
