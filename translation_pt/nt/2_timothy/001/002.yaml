source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: pt
  text: 'A Timóteo, filho amado: graça, misericórdia e paz da parte de Deus Pai e do Messias Jesus[a], nosso Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo Jesus”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu significado, em vez de empregar sua transliteração tradicional.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: amado
  rationale: Preserva o afeto e o peso de ἀγαπητός; em português, “filho amado” é natural e digno.
- source_word: τέκνῳ
  choice: filho
  rationale: Embora τέκνον possa significar genericamente “criança” ou “filho”, aqui designa metaforicamente a relação filial de Paulo com Timóteo; “filho” é natural em português e não acrescenta informação, pois Timóteo é homem.
- source_word: χάρις
  choice: graça
  rationale: Equivalente consagrado e preciso no uso paulino.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Preserva este elemento distinto da saudação, sem fundi-lo com graça.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente direto, com suas ressonâncias relacionais e pactuais.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: da parte de Deus Pai
  rationale: A construção expressa origem; “Deus Pai” respeita a ausência de ἡμῶν junto a πατρός e soa natural em português.
- source_word: Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  rationale: Traduz Χριστός como título (“Messias”) e translitera o nome Jesus, preservando a ordem grega.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: “Senhor” preserva a autoridade e a relevância cristológica de κύριος; o possessivo traduz ἡμῶν.
theological_decisions:
- issue: Tradução de Χριστοῦ Ἰησοῦ
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Χριστός ainda funciona como título nesta fórmula epistolar; “Messias” comunica seu sentido, enquanto a forma tradicional “Cristo Jesus” é registrada em nota.
- issue: Metáfora filial em τέκνῳ
  choice: filho
  alternative: criança
  rationale: No contexto, o termo descreve uma relação filial espiritual, não a idade de Timóteo. “Filho” comunica essa metáfora com naturalidade em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A saudação conserva a concisão do grego e evita acrescentar “meu”, ausente do texto-fonte.
