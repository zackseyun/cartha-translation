id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: pt
  text: mas agora foi revelada por meio da manifestação de nosso Salvador, Jesus, o Messias[a], que aboliu a morte e trouxe à luz a vida e a incorruptibilidade por meio do evangelho[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Jesus Cristo». O grego Χριστός pode funcionar como título («Messias») ou como designação semelhante a um nome («Cristo»).
    reason: alternative_reading
  - marker: b
    text: Ou «imortalidade». O termo grego enfatiza a condição imperecível ou livre de corrupção.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: foi revelada
  rationale: O particípio aoristo passivo retoma a graça de Deus no versículo anterior. A forma finita dá uma ligação natural em português e conserva a voz passiva.
- source_word: ἐπιφανείας
  choice: manifestação
  rationale: Expressa a aparição histórica e visível de Jesus com dignidade e naturalidade; evita o tecnicismo menos transparente «epifania».
- source_word: σωτῆρος
  choice: Salvador
  rationale: Equivalente corrente e preciso do título cristológico, preservando sua força salvífica.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Neste contexto, após «nosso Salvador», Χριστός mantém força titular. As vírgulas deixam claro que «o Messias» é uma designação de Jesus, não sobrenome.
- source_word: καταργήσαντος
  choice: aboliu
  rationale: Comunica a derrota decisiva da morte sem afirmar que ela já deixou absolutamente de existir na experiência presente.
- source_word: θάνατον
  choice: a morte
  rationale: Tradução lexical direta e natural em português.
- source_word: φωτίσαντος
  choice: trouxe à luz
  rationale: A expressão idiomática portuguesa preserva a ideia de tornar manifesto ou conhecido.
- source_word: ζωὴν
  choice: a vida
  rationale: Equivalente direto que mantém, sem expansão interpretativa, o peso salvífico e escatológico do termo.
- source_word: ἀφθαρσίαν
  choice: a incorruptibilidade
  rationale: Preserva a ênfase na condição livre de corrupção ou deterioração, com «imortalidade» registrada como alternativa.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: por meio do evangelho
  rationale: Conserva διά com genitivo como indicação de meio; «evangelho» é a forma estabelecida e acessível.
- source_word: μὲν ... δὲ
  choice: aboliu ... e trouxe
  rationale: A coordenação verbal natural em português mantém as duas ações complementares sem reproduzir mecanicamente uma construção correlativa rígida.
theological_decisions:
- issue: Sentido de Χριστοῦ na sequência Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A posição após o título «nosso Salvador» permite conservar a força messiânica de Χριστός. A alternativa tradicional permanece em nota para não ocultar a dupla função possível do termo.
- issue: Força de καταργήσαντος em relação à morte
  choice: aboliu a morte
  alternative: tornou a morte inoperante
  rationale: «Aboliu» preserva a afirmação forte da vitória decisiva de Jesus, sem resolver além do texto a tensão entre essa vitória e a presença atual da morte.
- issue: Sentido de ἀφθαρσίαν
  choice: incorruptibilidade
  alternative: imortalidade
  rationale: «Incorruptibilidade» representa mais diretamente a liberdade de corrupção ou deterioração; «imortalidade» é possível, mas pode estreitar o campo semântico à ausência de morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Manifestação» mantém o registro cristológico sem recorrer ao menos transparente «epifania». A pontuação vincula com clareza «o Messias» a Jesus. Todos os marcadores de nota aparecem no texto principal.
