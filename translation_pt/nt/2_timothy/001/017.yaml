  rationale: Conjunção adversativa que contrasta a conduta de Onesíforo com a vergonha mencionada no contexto anterior.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: quando esteve em Roma
  rationale: Expressa naturalmente a presença de Onesíforo em Roma sem impor que o particípio indique especificamente sua chegada; a nota preserva outras possibilidades idiomáticas.
- source_word: σπουδαίως
  choice: com empenho
  rationale: Comunica esforço sério e diligente em linguagem portuguesa atual e natural.
- source_word: ἐζήτησέν με
  choice: procurou por mim
  rationale: Retrata a busca intencional por uma pessoa e combina naturalmente com “com empenho”.
- source_word: καὶ εὗρεν
  choice: e me encontrou
  rationale: Completa de modo direto a ação da busca, recuperando naturalmente em português o objeto expresso na oração anterior.
