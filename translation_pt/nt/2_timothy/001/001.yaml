id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: pt
  text: Paulo, apóstolo do Messias Jesus[a] pela vontade de Deus, conforme a promessa da vida que está no Messias Jesus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cristo Jesus”, nas duas ocorrências de “Messias Jesus”.
    reason: Registra a tradução tradicional alternativa de Χριστός sem ocultar seu valor titular.
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Forma tradicional e plenamente natural do nome grego em português.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Preserva o sentido reconhecido do termo na autoidentificação paulina, sem reduzi-lo ao sentido mais geral de mensageiro ou delegado.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Messias Jesus
  rationale: Traduz Χριστός como título, preservando seu sentido de Messias, em vez de tratá-lo apenas como parte de um nome próprio. A forma tradicional “Cristo Jesus” é registrada em nota.
- source_word: διὰ θελήματος θεοῦ
  choice: pela vontade de Deus
  rationale: Expressão portuguesa natural que comunica a vontade divina como fundamento e autorização do apostolado de Paulo.
- source_word: κατ’ ἐπαγγελίαν
  choice: conforme a promessa
  rationale: Preserva a ideia de correspondência ou conformidade expressa por κατά com acusativo, com formulação corrente em português.
- source_word: ζωῆς
  choice: da vida
  rationale: Mantém a relação genitiva com “promessa” e a especificidade da vida caracterizada pela expressão seguinte.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: que está no Messias Jesus
  rationale: Explicita de modo claro a função atributiva do artigo com a locução preposicional e preserva a força relacional de ἐν.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός ainda pode ser entendido como título. “Messias” torna esse valor semântico transparente, enquanto “Cristo” é preservado em nota como a forma tradicional e mais lexicalizada em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a estrutura de uma saudação epistolar e a vírgula final, pois o versículo continua no seguinte. “Conforme” evita rigidez excessiva sem dissolver a relação sintática do grego.
