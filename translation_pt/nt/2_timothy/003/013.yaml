id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: pt
  text: Mas as pessoas más e os impostores[a] irão de mal a pior[b], enganando e sendo enganados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “charlatães” ou “enganadores”; o termo grego pode designar trapaceiros fraudulentos e, em alguns contextos, ter conotações de feitiçaria ou curandeirismo enganoso.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “avançarão para o pior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: más
  rationale: Expressa a corrupção moral indicada pelo adjetivo, e não apenas qualidade inferior.
- source_word: δὲ
  choice: Mas
  rationale: Marca naturalmente o contraste com o que foi dito antes acerca de Timóteo.
- source_word: ἄνθρωποι
  choice: pessoas
  rationale: O plural masculino grego tem sentido genérico neste contexto, sem restringir a referência aos homens.
- source_word: γόητες
  choice: impostores
  rationale: Comunica a ideia de fraudulentos e enganadores sem impor ao contexto uma referência específica à feitiçaria.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: irão de mal a pior
  rationale: Equivalente português natural que preserva ironicamente a ideia de avançar em direção ao que é pior.
- source_word: πλανῶντες
  choice: enganando
  rationale: Mantém o particípio ativo e descreve sua atividade contínua de enganar.
- source_word: πλανώμενοι
  choice: sendo enganados
  rationale: Preserva a voz passiva e a tensão de que os próprios enganadores também são vítimas do engano.
theological_decisions:
- issue: Alcance de ἄνθρωποι
  choice: pessoas
  alternative: homens
  rationale: A forma masculina plural é genérica no contexto; “pessoas” representa o referente humano sem sugerir indevidamente exclusividade masculina.
- issue: Nuance de γόητες
  choice: impostores
  alternative: feiticeiros; charlatães; enganadores
  rationale: O termo pode ter conotações de magia, charlatanismo ou fraude, mas o contexto destaca o engano. “Impostores” preserva essa fraude moral e religiosa sem tornar explícita uma prática ocultista não exigida pelo versículo.
- issue: Relação entre enganar e ser enganado
  choice: enganando e sendo enganados
  alternative: desviando e sendo desviados
  rationale: A formulação conserva a oposição entre os particípios ativo e passivo, sem resolver quem ou o que os engana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A expressão idiomática “de mal a pior” transmite com clareza o avanço irônico para uma condição pior; as notas preservam as nuances lexicais do grego.
