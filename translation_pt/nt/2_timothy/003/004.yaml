lexical_decisions:
- source_word: προδόται
  choice: traidores
  rationale: Expressa de modo natural e forte aqueles que traem ou agem com deslealdade, adequando-se ao estilo conciso da lista de vícios.
- source_word: προπετεῖς
  choice: precipitados
  rationale: Comunica a ideia de agir impulsivamente, sem a devida reflexão; preserva melhor o sentido de temeridade do termo grego do que uma caracterização meramente genérica como “imprudentes”.
- source_word: τετυφωμένοι
  choice: inchados de orgulho
  rationale: Preserva a imagem do particípio perfeito passivo grego e explicita, em português natural, que se trata de orgulho ou presunção.
- source_word: φιλήδονοι
  choice: amantes dos prazeres
  rationale: Reproduz o composto grego e prepara o contraste retórico direto com “amantes de Deus”.
- source_word: μᾶλλον ἢ
  choice: em vez de
  rationale: Expressa com clareza a preferência contrastiva indicada pela construção grega, sem exigir que o texto afirme ausência absoluta de amor a Deus.
- source_word: φιλόθεοι
  choice: amantes de Deus
  rationale: Mantém o paralelismo lexical e retórico com “amantes dos prazeres”.
theological_decisions:
- issue: Preservação do contraste moral entre o amor aos prazeres e o amor a Deus
  choice: “amantes dos prazeres em vez de amantes de Deus”
  alternative: “mais amigos dos prazeres do que amigos de Deus”
  rationale: A formulação escolhida conserva os dois compostos gregos em paralelo e apresenta uma preferência moral contrastiva sem acrescentar uma nuance doutrinária não expressa no texto.
- issue: Tratamento da metáfora de τετυφωμένοι
  choice: “inchados de orgulho”
  alternative: “presunçosos”
  rationale: A tradução mantém a imagem verbal do grego e, ao acrescentar “de orgulho”, torna seu sentido imediatamente compreensível ao leitor moderno.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração concisa preserva o ritmo da lista de vícios; o paralelismo “amantes dos prazeres... amantes de Deus” reflete a estrutura dos compostos gregos.
