  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: pt
  text: Toda a Escritura[a] é inspirada por Deus[b] e útil para o ensino, para a repreensão, para a correção e para a formação na justiça.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cada Escritura”. A expressão grega πᾶσα γραφή pode ser entendida distributivamente (“cada Escritura”) ou coletivamente (“toda a Escritura”).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Toda Escritura inspirada por Deus é também útil para o ensino, para a repreensão, para a correção e para a formação na justiça”.'
    reason: alternative_reading
  - marker: c
    text: Aqui, “justiça” tem o sentido de retidão moral, isto é, formação para uma vida correta.
    reason: lexical_clarification
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Toda a Escritura
  rationale: No contexto, γραφή se refere aos escritos sagrados (cf. vv. 15–17). A expressão grega sem artigo admite tanto sentido coletivo, “toda a Escritura”, quanto distributivo, “cada Escritura”; o primeiro é mais natural em português e o segundo fica registrado em nota.
- source_word: θεόπνευστος
  choice: soprada por Deus
  rationale: Reproduz de modo transparente a imagem do composto grego, sem acrescentar uma teoria posterior sobre a inspiração. “Inspirada por Deus” seria idiomático, mas menos explícito quanto à forma lexical.
- source_word: ὠφέλιμος
  choice: útil
  rationale: Expressa de maneira natural e atual aquilo que é proveitoso ou benéfico para as finalidades enumeradas.
- source_word: πρὸς διδασκαλίαν
  choice: para o ensino
  rationale: Abrange o ato e o conteúdo de ensinar, sem a possível restrição eclesiástica de “doutrina”.
- source_word: ἐλεγμόν
  choice: para a repreensão
  rationale: Comunica a exposição e censura do erro. Embora “convencimento” seja possível, “repreensão” se ajusta melhor à sequência corretiva.
- source_word: ἐπανόρθωσιν
  choice: para a correção
  rationale: Traduz de modo conciso a ideia de endireitar novamente ou restaurar ao estado correto.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: para a formação na justiça
  rationale: “Formação” comunica o processo abrangente de instrução, treinamento e disciplina envolvido em παιδεία. Aqui δικαιοσύνη aponta para a formação em uma vida reta; “justiça” preserva em português a amplitude moral do termo.
theological_decisions:
- issue: Relação sintática de θεόπνευστος e ὠφέλιμος com πᾶσα γραφή
  choice: 'Os dois adjetivos são entendidos como predicativos: “Toda a Escritura é soprada por Deus e útil”.'
  alternative: “Toda Escritura soprada por Deus também é útil”.
  rationale: A leitura predicativa trata os dois adjetivos em paralelo e se encaixa naturalmente no desenvolvimento até o v. 17. A construção atributiva é gramaticalmente possível e, por isso, é preservada em nota, sem resolver silenciosamente a ambiguidade.
- issue: Sentido distributivo ou coletivo de πᾶσα γραφή
  choice: 'Sentido coletivo: “Toda a Escritura”.'
  alternative: 'Sentido distributivo: “Cada Escritura”.'
  rationale: O contexto aponta para o conjunto dos escritos sagrados, e a formulação coletiva é mais idiomática em português. A possibilidade distributiva real da expressão grega é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Soprada por Deus” preserva a imagem lexical grega; “formação” soa mais abrangente e natural do que “treinamento” neste contexto. Os marcadores foram agrupados no fim da frase porque as notas tratam da construção do versículo como um todo e do sentido da expressão final.
