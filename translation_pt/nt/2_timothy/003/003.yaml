lexical_decisions:
- source_word: ἄστοργοι
  choice: sem afeição pela família
  rationale: O termo indica a ausência da afeição natural esperada sobretudo entre familiares. A formulação explicita esse âmbito sem reduzir o sentido ao genérico «sem amor».
- source_word: ἄσπονδοι
  choice: irreconciliáveis
  rationale: Descreve pessoas que não aceitam estabelecer ou manter a paz. «Irreconciliáveis» comunica essa resistência à reconciliação de modo claro e conciso.
- source_word: διάβολοι
  choice: caluniadores
  rationale: Neste catálogo de vícios, o plural descreve pessoas que fazem acusações difamatórias; não é uma referência ao Diabo nem a demônios.
- source_word: ἀκρατεῖς
  choice: sem domínio próprio
  rationale: Expressa a falta de controle sobre desejos e impulsos em linguagem atual e amplamente compreensível.
- source_word: ἀνήμεροι
  choice: brutais
  rationale: O adjetivo caracteriza pessoas indomadas, ferozes ou desumanamente violentas. «Brutais» preserva essa força em português natural.
- source_word: ἀφιλάγαθοι
  choice: sem amor ao bem
  rationale: Preserva a formação privativa do termo e sua orientação moral sem intensificá-lo necessariamente para ódio ativo ao que é bom.
theological_decisions:
- issue: Sentido de διάβολοι em um catálogo de vícios
  choice: substantivo comum «caluniadores», como descrição de conduta
  alternative: «diabólicos» ou «diabos»
  rationale: O plural, inserido entre outros qualificativos morais, descreve comportamento acusador ou difamatório. Traduzi-lo como «diabos» poderia sugerir indevidamente uma identificação ontológica com seres espirituais.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sequência concisa preserva o ritmo do catálogo grego. O marcador [a] foi colocado junto de «irreconciliáveis», termo ao qual a nota lexical efetivamente se refere.
