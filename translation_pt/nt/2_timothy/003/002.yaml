reference: 2 Timothy 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: pt
  text: Pois as pessoas serão amantes de si mesmas, amantes do dinheiro, presunçosas, arrogantes, caluniadoras[a], desobedientes aos pais, ingratas, irreverentes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “blasfemas” ou “insultadoras”. O termo grego pode referir-se à fala que desonra tanto pessoas quanto Deus.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἔσονται
  choice: serão
  rationale: Futuro do verbo εἰμί; “serão” expressa naturalmente o sentido copulativo e mantém a perspectiva futura.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e preserva a ligação argumentativa com o versículo precedente.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: O masculino plural grego tem referência humana genérica, não limitada aos homens; “as pessoas” comunica esse alcance em português corrente.
- source_word: φίλαυτοι
  choice: amantes de si mesmas
  rationale: Preserva a imagem do composto grego e explicita o amor egoísta dirigido ao próprio eu.
- source_word: φιλάργυροι
  choice: amantes do dinheiro
  rationale: Reflete o sentido literal de amor ao dinheiro e mantém o paralelismo com “amantes de si mesmas”.
- source_word: ἀλαζόνες
  choice: presunçosas
  rationale: Denota pessoas que se vangloriam e fazem grandes alegações sobre si; “presunçosas” distingue o termo da arrogância expressa em seguida.
- source_word: ὑπερήφανοι
  choice: arrogantes
  rationale: Comunica claramente o orgulho altivo e moralmente censurável do termo.
- source_word: βλάσφημοι
  choice: caluniadoras
  rationale: O adjetivo pode designar fala difamatória ou ofensiva contra seres humanos ou contra Deus. “Caluniadoras” se ajusta ao contexto relacional da lista, enquanto a nota preserva a amplitude semântica.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: desobedientes aos pais
  rationale: Equivalência portuguesa direta e idiomática para o adjetivo acompanhado do dativo plural.
- source_word: ἀχάριστοι
  choice: ingratas
  rationale: Expressa de modo claro e contemporâneo a ausência de gratidão.
- source_word: ἀνόσιοι
  choice: sem santidade
  rationale: Preserva a dimensão religioso-moral de falta de respeito pelo que é santo, sem confundir o termo simplesmente com descrença.
theological_decisions:
- issue: Referência genérica de οἱ ἄνθρωποι
  choice: as pessoas
  alternative: os homens; os seres humanos
  rationale: O contexto descreve pessoas em geral; a tradução evita impor uma restrição masculina ausente do sentido.
- issue: Amplitude semântica de βλάσφημοι
  choice: caluniadoras
  alternative: blasfemas; insultadoras
  rationale: O termo pode indicar fala que desonra tanto pessoas quanto Deus. O texto principal conserva a provável dimensão interpessoal da lista, e a nota mantém aberta a referência religiosa.
- issue: Força religiosa de ἀνόσιοι
  choice: sem santidade
  alternative: profanas; irreverentes; ímpias
  rationale: A formulação conserva a falta de relação adequada com o sagrado sem identificar o termo com uma categoria teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “amantes” conserva o paralelismo dos dois compostos gregos, e a sequência de adjetivos mantém o ritmo da lista de vícios.
