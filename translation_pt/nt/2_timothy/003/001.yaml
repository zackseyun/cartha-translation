  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: pt
  text: 'Mas saiba isto: nos últimos dias virão tempos difíceis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tempos perigosos” ou “tempos penosos”. O adjetivo grego pode descrever tempos difíceis, perigosos ou aflitivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: disto
  rationale: O demonstrativo neutro aponta para a oração de conteúdo introduzida por ὅτι; “saiba disto” é natural em português e prepara o leitor para a explicação seguinte.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste ou desenvolvimento moderado em relação ao contexto anterior; “Mas” preserva essa transição sem torná-la excessivamente forte.
- source_word: γίνωσκε
  choice: saiba
  rationale: Imperativo presente ativo na segunda pessoa do singular. “Saiba” transmite de modo direto e digno a exortação dirigida a Timóteo, sem acrescentar a ideia interpretativa de lembrança contínua.
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo que Timóteo deve saber. Em português, os dois-pontos depois de “saiba disto” expressam essa função com naturalidade.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Expressão escatológica estabelecida e formalmente próxima do grego, sem definir além do texto a extensão desse período.
- source_word: ἐνστήσονται
  choice: virão
  rationale: O futuro de ἐνίστημι indica que esses tempos se apresentarão ou chegarão. “Virão” é claro, conciso e idiomático com “tempos”.
- source_word: καιροὶ
  choice: tempos
  rationale: καιρός designa tempos, períodos ou ocasiões caracterizados de certo modo. “Tempos” é a equivalência mais natural neste contexto.
- source_word: χαλεποί
  choice: difíceis
  rationale: O adjetivo pode indicar algo difícil, penoso, perigoso ou severo. “Difíceis” preserva o sentido amplo em linguagem moderna; a nota registra nuances mais fortes.
theological_decisions:
- issue: Sentido de “os últimos dias”
  choice: Manter a expressão escatológica “os últimos dias” sem restringi-la apenas ao período imediatamente anterior à volta de Cristo.
  alternative: Interpretá-la explicitamente como o período final antes do fim ou como toda a era escatológica já iniciada.
  rationale: A expressão admite, no contexto do Novo Testamento, uma compreensão mais ampla ou uma concentração no tempo do fim. A tradução preserva a formulação e a tensão do texto sem impor um sistema escatológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém o contraste inicial, a exortação direta e a expressão escatológica tradicional.
