id: 2TI.3.17
reference: 2 Timothy 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: pt
  text: para que o homem de Deus[b] seja completo e esteja preparado[a] para toda boa obra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plenamente equipado”. O particípio grego transmite a ideia de alguém que foi inteiramente preparado ou provido do necessário.
    reason: lexical_alternative
  - marker: b
    text: “O homem de Deus” é uma expressão masculina singular no grego e provavelmente uma designação bíblica reconhecida. Pode referir-se especificamente ao ministro de Deus, embora também possa ter aplicação mais ampla à pessoa moldada pelas Escrituras.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente em português a oração de finalidade decorrente do versículo anterior.
- source_word: ἄρτιος
  choice: completo
  rationale: Expressa a ideia de alguém plenamente apto ou qualificado, sem sugerir perfeição moral ou ausência de pecado.
- source_word: ᾖ
  choice: seja
  rationale: O presente do subjuntivo depois de ἵνα é representado naturalmente pelo subjuntivo português após “para que”.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: o homem de Deus
  rationale: Preserva a expressão masculina singular do grego e sua forma reconhecível no uso bíblico.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: para toda boa obra
  rationale: Mantém a orientação para a finalidade, a força distributiva de πᾶν e a formulação bíblica corrente em português.
- source_word: ἐξηρτισμένος
  choice: esteja preparado
  rationale: Comunica em português natural o estado resultante de ter sido provido de tudo o que é necessário; a alternativa mais explícita é registrada em nota.
theological_decisions:
- issue: Expressão marcada por gênero em ὁ τοῦ θεοῦ ἄνθρωπος
  choice: o homem de Deus
  alternative: a pessoa de Deus
  rationale: O grego emprega uma expressão masculina singular que provavelmente retoma uma designação bíblica reconhecida. A forma é preservada sem limitar silenciosamente sua possível aplicação mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação “seja completo e esteja preparado” torna natural em português a relação entre o adjetivo predicativo ἄρτιος e o particípio perfeito passivo ἐξηρτισμένος, sem apagar a distinção entre eles.
