id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: pt
  text: Pois entre eles estão os que se infiltram nas casas e fazem prisioneiras mulheres vulneráveis[a], carregadas de pecados[b] e levadas por vários desejos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega um diminutivo depreciativo, literalmente “mulherzinhas”, referindo-se neste contexto a mulheres vulneráveis ou suscetíveis.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobrecarregadas de pecados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: entre eles
  rationale: Expressa de modo natural que esses indivíduos pertencem ao grupo descrito anteriormente.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: se infiltram nas casas
  rationale: Preserva a ideia de entrada furtiva e insidiosa; o plural concreto «casas» mantém o referente do grego sem excluir o ambiente doméstico.
- source_word: αἰχμαλωτίζοντες
  choice: fazem prisioneiras
  rationale: Conserva a imagem forte de captura e sujeição presente no verbo, sem reduzi-la a mera persuasão.
- source_word: γυναικάρια
  choice: mulheres vulneráveis
  rationale: Comunica o caráter depreciativo do diminutivo no contexto, dirigido a um grupo suscetível, sem sugerir baixa estatura nem fazer uma afirmação geral sobre as mulheres.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: carregadas de pecados
  rationale: Reproduz a imagem de acúmulo e peso resultante indicada pelo particípio perfeito passivo.
- source_word: ἀγόμενα
  choice: levadas
  rationale: Mantém a forma passiva e a ideia de estarem sob a influência condutora dos desejos.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: por vários desejos
  rationale: Tradução ampla e acessível que preserva a diversidade indicada por ποικίλαις e a conotação moral negativa fornecida pelo contexto.
theological_decisions:
- issue: Força depreciativa de γυναικάρια
  choice: mulheres vulneráveis
  alternative: mulherzinhas; mulheres fracas; mulheres ingênuas
  rationale: A opção identifica a suscetibilidade do grupo visado sem transformar a censura contextual numa declaração universal sobre as mulheres. A nota registra o diminutivo depreciativo do original.
- issue: Imagem de cativeiro em αἰχμαλωτίζοντες
  choice: fazem prisioneiras
  alternative: capturam; levam cativas
  rationale: A redação preserva explicitamente a metáfora de conquista e domínio, importante para a severidade da denúncia.
- issue: Referente doméstico de οἰκίας
  choice: casas
  alternative: lares; famílias
  rationale: «Casas» corresponde diretamente ao substantivo grego, enquanto o contexto deixa claro que se trata da entrada no ambiente doméstico e do acesso às pessoas que nele vivem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A tradução mantém o tom severo da passagem, a metáfora do cativeiro e a vulnerabilidade contextual do grupo mencionado, evitando tanto linguagem arcaica quanto uma generalização depreciativa sobre as mulheres.
