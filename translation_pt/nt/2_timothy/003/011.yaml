id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: pt
  text: as perseguições, os sofrimentos, como os que me sobrevieram em Antioquia, em Icônio e em Listra — que perseguições suportei! E de todas elas o Senhor me livrou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Senhor” provavelmente se refere ao Senhor Jesus, embora o texto grego diga apenas “o Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: perseguições
  rationale: O substantivo designa perseguição ou opressão hostil; “perseguições” é a equivalência portuguesa natural e consagrada neste contexto.
- source_word: παθήμασιν
  choice: sofrimentos
  rationale: Preserva a amplitude do termo grego, que abrange experiências de sofrimento sem limitá-las a uma forma específica de aflição.
- source_word: οἷά μοι ἐγένετο
  choice: como os que me sobrevieram
  rationale: Retoma os sofrimentos e as perseguições como exemplos e expressa de modo natural que tais experiências atingiram Paulo.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: em Antioquia, em Icônio e em Listra
  rationale: Emprega as formas portuguesas correntes dos topônimos e conserva a repetição de “em”, com a conjunção final exigida pela fluência do português.
- source_word: οἵους διωγμοὺς
  choice: que perseguições
  rationale: A construção qualitativa e exclamativa é preservada por “que perseguições”, sem explicar em excesso a intensidade implícita.
- source_word: ὑπήνεγκα
  choice: suportei
  rationale: Expressa resistir sob pressão ou sofrimento e é uma formulação concisa e idiomática em português.
- source_word: ἐκ πάντων
  choice: de todas elas
  rationale: Retoma naturalmente as perseguições e experiências mencionadas, preservando a ideia de livramento de todas elas.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: “Livrou” comunica resgate diante do perigo e corresponde ao uso bíblico natural em português, sem reduzir o verbo à salvação espiritual.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Traduz o título sem acrescentar um referente nominal que não aparece no texto grego.
theological_decisions:
- issue: Referente de “o Senhor”
  choice: Manter apenas “o Senhor” no texto.
  alternative: “o Senhor Jesus”
  rationale: Embora o contexto paulino possa apontar para Jesus, o grego traz somente ὁ κύριος; a tradução preserva essa formulação e sua possível tensão referencial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O travessão e a exclamação reproduzem a retomada enfática de οἵους διωγμούς; a coordenação final evita uma frase excessivamente literal.
