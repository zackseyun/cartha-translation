source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: pt
  text: E, de fato, todos os que querem viver de modo piedoso no Messias Jesus[a] serão perseguidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Cristo Jesus”.'
    reason: Registra a forma tradicional e igualmente possível de representar o título Χριστός.
lexical_decisions:
- source_word: καὶ … δὲ
  choice: E, de fato
  rationale: Expressa a ligação com o contexto anterior e a força confirmativa suave da combinação, sem criar um contraste forte.
- source_word: πάντες οἱ θέλοντες
  choice: todos os que querem
  rationale: Preserva tanto o alcance universal de πάντες quanto o sentido volitivo e contínuo do particípio θέλοντες, em português corrente.
- source_word: ζῆν εὐσεβῶς
  choice: viver de modo piedoso
  rationale: Traduz o infinitivo e o advérbio de maneira natural, mantendo o sentido de uma vida caracterizada por devoção e reverência a Deus.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: Mantém a construção de esfera ou união indicada por ἐν e traduz Χριστός como título, sem tratar o termo apenas como parte de um nome próprio.
- source_word: διωχθήσονται
  choice: serão perseguidos
  rationale: Reproduz diretamente o futuro passivo e o sentido hostil de διώκω.
theological_decisions:
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: Neste contexto paulino, Χριστός conserva força titular reconhecível. A alternativa tradicional permanece legítima e é registrada em nota.
- issue: Sentido de ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  alternative: em relação ao Messias Jesus
  rationale: A tradução literal preserva a amplitude da expressão, que pode indicar esfera, união e relação, sem reduzir a construção a uma única explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “De modo piedoso” evita tanto o caráter potencialmente arcaico de “piamente” quanto uma formulação pouco natural como “viver piedosamente”.
