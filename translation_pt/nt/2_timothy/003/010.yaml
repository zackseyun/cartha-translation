id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: pt
  text: Você, porém, seguiu de perto meu ensino, minha conduta, meu propósito, minha fé[a], minha paciência, meu amor e minha perseverança,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fidelidade”. Neste contexto, a palavra grega pode significar tanto fé quanto fidelidade.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Você, porém
  rationale: Preserva tanto a ênfase do pronome explícito Σὺ quanto o contraste introduzido por δέ com as pessoas descritas anteriormente.
- source_word: παρηκολούθησάς
  choice: acompanhou de perto
  rationale: Expressa a atenção continuada e a familiaridade de Timóteo com o ensino e a vida de Paulo, podendo incluir observação e adesão.
- source_word: μου
  choice: meu / minha
  rationale: 'O genitivo liga-se naturalmente aos substantivos seguintes como possessivo: ensino, conduta, propósito e demais qualidades de Paulo.'
- source_word: διδασκαλίᾳ
  choice: ensino
  rationale: Equivalente moderno, claro e natural, sem a carga técnica que 'doutrina' pode adquirir.
- source_word: ἀγωγῇ
  choice: conduta
  rationale: Denota a maneira de viver ou o comportamento; 'conduta' é conciso e digno.
- source_word: προθέσει
  choice: propósito
  rationale: Comunica o objetivo ou desígnio firme de Paulo de maneira idiomática.
- source_word: πίστει
  choice: fé
  rationale: Mantém o sentido usual de πίστις, sem eliminar a possibilidade contextual de 'fidelidade', registrada em nota.
- source_word: μακροθυμίᾳ
  choice: paciência
  rationale: Indica disposição paciente, especialmente diante de pessoas ou provocações, em linguagem acessível.
- source_word: ἀγάπῃ
  choice: amor
  rationale: É o equivalente português direto, atual e amplamente compreensível de ἀγάπη.
- source_word: ὑπομονῇ
  choice: perseverança
  rationale: Ressalta a constância sob provações e distingue o termo de μακροθυμία, aqui traduzido por 'paciência'.
theological_decisions:
- issue: Sentido de πίστις numa lista de qualidades paulinas
  choice: fé
  alternative: fidelidade
  rationale: O contexto permite tanto a confiança crente quanto a qualidade de ser fiel. O texto principal mantém 'fé', enquanto a nota preserva a ambiguidade real sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de artigos e possessivos reproduz a enumeração enfática do grego sem soar excessivamente rígida; a conjunção 'e' antes do último item torna a lista natural em português.
