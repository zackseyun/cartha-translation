  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: pt
  text: e que, desde a primeira infância, você conhece os escritos sagrados[a], que podem torná-lo sábio para a salvação por meio da fé no Messias Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as santas Escrituras”. O grego diz literalmente “os escritos sagrados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: desde a primeira infância
  rationale: βρέφος designa uma criança muito pequena, até mesmo um bebê. “Desde a primeira infância” conserva essa força melhor que o mais amplo “desde a infância” e soa natural em português.
- source_word: ἱερὰ γράμματα
  choice: os escritos sagrados
  rationale: Reproduz de perto o sentido literal de “escritos/letras sagrados”, sem transformar silenciosamente a expressão numa designação técnica posterior, embora o contexto se refira às Escrituras conhecidas por Timóteo.
- source_word: οἶδας
  choice: você conhece
  rationale: Embora οἶδα tenha forma perfeita, possui sentido presente. Com “desde a primeira infância”, o presente português expressa naturalmente um conhecimento adquirido no passado e ainda possuído.
- source_word: τὰ δυνάμενά
  choice: que podem
  rationale: O particípio atributivo modifica “os escritos sagrados”; “que podem” é claro, conciso e natural.
- source_word: σε σοφίσαι
  choice: torná-lo sábio
  rationale: σοφίζω aqui significa tornar sábio ou comunicar sabedoria. A formulação mantém o objeto pessoal e o sentido causativo.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: εἰς indica finalidade ou resultado; “para a salvação” preserva essa orientação sem explicá-la em excesso.
- source_word: διὰ πίστεως
  choice: por meio da fé
  rationale: διά com o genitivo indica o meio, e πίστις tem aqui, mais naturalmente, o sentido de fé.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: no Messias Jesus
  rationale: A preposição ἐν, após “fé”, é expressa idiomaticamente por “em/no”, enquanto Χριστός é traduzido como o título “Messias” e Ἰησοῦ como o nome “Jesus”.
theological_decisions:
- issue: Χριστός como título ou como elemento semelhante a nome próprio
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: A tradução preserva o valor titular de Χριστός em vez de apenas transliterá-lo. “Cristo Jesus” é tradicional e natural, mas torna menos transparente o significado do título.
- issue: Sentido de πίστεως em διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: por meio da fé no Messias Jesus
  alternative: por meio da fidelidade do Messias Jesus
  rationale: A construção com ἐν favorece mais naturalmente a fé cujo objeto ou esfera é o Messias Jesus. A leitura referente à fidelidade do Messias é menos provável neste contexto, mas é registrada para não ocultar a tensão lexical possível em πίστις.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o singular de segunda pessoa sem recorrer ao regional “tu”. A ordem da frase acompanha de perto o grego, mas usa construções idiomáticas em português.
