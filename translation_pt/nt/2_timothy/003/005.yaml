  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: pt
  text: tendo uma forma de devoção a Deus[a], mas tendo negado o poder dessa devoção. Afaste-se dessas pessoas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma aparência de devoção a Deus”. O termo grego pode indicar forma, configuração ou manifestação exterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “Evite essas pessoas” ou “Mantenha-se longe delas”. O verbo traz a ideia de afastar-se de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: tendo
  rationale: Mantém o particípio que caracteriza as pessoas descritas no contexto anterior e reproduz de modo natural a ligação sintática do grego.
- source_word: μόρφωσιν
  choice: uma forma
  rationale: Preserva o contraste entre a configuração exterior da devoção e seu poder efetivo, sem concluir que se trata apenas de fingimento consciente.
- source_word: εὐσεβείας
  choice: de devoção a Deus
  rationale: Expressa em português atual a vida reverente orientada para Deus; evita que “piedade” seja entendida principalmente como compaixão.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: mas o poder dessa devoção
  rationale: Explicita corretamente que o pronome feminino αὐτῆς retoma εὐσέβεια e mantém amplo o sentido de δύναμις como eficácia ou realidade operante.
- source_word: ἠρνημένοι
  choice: negando
  rationale: Comunica uma postura de rejeição que caracteriza essas pessoas. Embora o particípio perfeito indique uma negação estabelecida, a forma progressiva evita a construção pesada “tendo negado” e funciona naturalmente em paralelo com “tendo”.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Afaste-se também dessas pessoas
  rationale: O imperativo pronominal transmite a ideia de voltar-se para longe e manter distância; “dessas pessoas” torna explícito o referente humano plural.
theological_decisions:
- issue: Contraste entre devoção exterior e realidade eficaz
  choice: “uma forma de devoção a Deus, mas negando o poder dessa devoção”
  alternative: “uma aparência de piedade, mas tendo negado seu poder”
  rationale: A redação conserva o contraste de Paulo sem limitar “poder” a milagres, transformação moral ou uma atuação específica do Espírito. Também não afirma além do grego que toda a devoção seja mera encenação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Devoção a Deus” foi preferido a “piedade” para evitar ambiguidade no uso contemporâneo; a estrutura participial conserva a ligação com o contexto anterior.
