id: 2TI.3.14
reference: 2 Timothy 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: pt
  text: Quanto a você, porém, permaneça naquilo que aprendeu e de que ficou convencido[a], sabendo de quem[b] o aprendeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de que recebeu plena certeza».'
    reason: lexical_alternative
  - marker: b
    text: O texto grego adotado traz aqui uma forma plural, isto é, «de quais pessoas». Alguns manuscritos trazem o singular, frequentemente entendido como referência a Paulo.
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: Quanto a você, porém
  rationale: O pronome explícito é enfático e contrasta Timóteo com as pessoas descritas anteriormente; esta formulação preserva o contraste em português natural.
- source_word: μένε ἐν οἷς
  choice: permaneça naquilo que
  rationale: O imperativo presente pede perseverança contínua, e «naquilo que» conserva a imagem de permanecer no âmbito do ensino recebido.
- source_word: ἔμαθες
  choice: aprendeu
  rationale: O aoristo remete à instrução recebida anteriormente; o pretérito perfeito é a forma corrente em português.
- source_word: ἐπιστώθης
  choice: ficou convencido
  rationale: O passivo indica que Timóteo chegou a ter certeza quanto ao que aprendeu. A tradução evita a leitura menos provável de que isso lhe foi confiado como encargo.
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio mantém aberta a relação circunstancial, que pode incluir fundamento ou causa sem explicitá-la.
- source_word: παρὰ τίνων
  choice: de quem
  rationale: παρά com o genitivo indica a fonte do aprendizado. «De quem» é idiomático e não identifica pessoas que o versículo deixa sem nome; uma nota registra que o texto grego adotado tem forma plural.
- source_word: ἔμαθες
  choice: o aprendeu
  rationale: O pronome «o» retoma naturalmente o conteúdo aprendido e torna clara a repetição do verbo em português.
theological_decisions:
- issue: Referente de παρὰ τίνων
  choice: Não identificar os mestres no texto principal e registrar em nota que a leitura adotada é plural.
  alternative: Entender a variante singular como referência específica a Paulo, ou entender o plural como abrangendo Paulo e familiares de Timóteo.
  rationale: O versículo não nomeia os mestres. A edição SBLGNT adota a forma plural, mas a tradução não deve impor uma identificação que permanece implícita.
translation_notes:
  register: Português moderno, claro e digno, com «você» e formas verbais correspondentes para ampla legibilidade brasileira. A redação preserva o contraste enfático, a metáfora de permanência e a referência não especificada aos mestres.
