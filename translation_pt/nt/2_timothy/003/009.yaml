id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: pt
  text: Mas eles não irão mais longe[a], pois a insensatez deles ficará evidente a todos, como também aconteceu com a daqueles homens.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não farão mais progresso».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a insensatez de Janes e Jambres, mencionados no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: irão mais longe
  rationale: No contexto, προκόπτω descreve avanço ou progresso. A expressão natural «não irão mais longe» preserva a ideia de que o avanço dos opositores será detido, sem sugerir progresso positivo.
- source_word: ἐπὶ πλεῖον
  choice: mais longe
  rationale: A locução significa «mais adiante» ou «em maior medida» e, junto da negação, é traduzida idiomaticamente por «não irão mais longe».
- source_word: ἄνοια
  choice: insensatez
  rationale: Expressa falta de entendimento, desatino ou tolice. «Insensatez» conserva o sentido intelectual e moral em registro digno e corrente.
- source_word: ἔκδηλος
  choice: evidente
  rationale: Significa manifesto ou claramente reconhecível; «evidente» é direto e natural em português.
- source_word: πᾶσιν
  choice: a todos
  rationale: Reproduz de modo conciso o alcance universal do dativo plural, sem especificar além do texto.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: como também aconteceu com a daqueles homens
  rationale: 'A construção é elíptica: o artigo ἡ retoma «insensatez», e ἐκείνων aponta para pessoas já mencionadas. A tradução mantém essa retomada e conserva o καί em «também».'
theological_decisions:
- issue: Referente de ἐκείνων
  choice: «daqueles homens» remete a Janes e Jambres, mencionados no versículo anterior
  alternative: referência geral a opositores anteriores
  rationale: O antecedente imediato em 3:8 é Janes e Jambres. O texto principal mantém a referência anafórica sem inserir os nomes, enquanto a nota explicita a ligação contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Ir mais longe» é idiomático; «insensatez» evita tanto o tom excessivamente coloquial de «tolice» quanto o caráter arcaizante de algumas alternativas. A segunda nota foi colocada após a oração comparativa, onde seu referente fica mais claro.
