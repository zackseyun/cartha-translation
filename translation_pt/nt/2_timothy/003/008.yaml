id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: pt
  text: Assim como Janes e Jambres se opuseram a Moisés[a], também estes homens se opõem à verdade — homens de mente corrompida, reprovados quanto à fé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resistiram a Moisés” — e, mais adiante, “resistem à verdade”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “a fé” provavelmente se refere à fé cristã ou à mensagem apostólica, e não apenas à crença pessoal.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Assim como
  rationale: Introduz de modo natural a comparação correlativa; δέ marca uma leve progressão discursiva e não exige aqui um conectivo português separado.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Janes e Jambres
  rationale: Formas tradicionalmente consagradas em português para estes nomes.
- source_word: ἀντέστησαν Μωϋσεῖ
  choice: se opuseram a Moisés
  rationale: Expressa oposição ativa e preserva o paralelismo lexical com o verbo no presente da oração seguinte.
- source_word: οὕτως καὶ οὗτοι
  choice: também estes homens
  rationale: Retoma a comparação e explicita naturalmente o referente masculino plural no contexto.
- source_word: ἀνθίστανται τῇ ἀληθείᾳ
  choice: se opõem à verdade
  rationale: O presente comunica oposição em curso; 'a verdade' mantém a amplitude da expressão grega.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: homens de mente corrompida
  rationale: Preserva o referente masculino contextual e o estado resultante expresso pelo particípio perfeito, em português corrente e digno.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: reprovados quanto à fé
  rationale: '''Reprovados'' conserva a ideia de não passar pela avaliação ou não ser aprovado; ''quanto à fé'' mantém a relação de referência sem definir no texto se πίστις é o conteúdo da fé ou a confiança pessoal.'
theological_decisions:
- issue: Referência de 'a verdade' e 'a fé'
  choice: Manter as expressões amplas no texto principal; 'a fé' recebe nota sobre sua provável referência contextual.
  alternative: '''Verdade'' em sentido moral geral e ''fé'' como confiança pessoal subjetiva.'
  rationale: O contexto favorece a verdade do evangelho e a fé cristã ou mensagem apostólica, mas a tradução não deve eliminar a amplitude lexical do grego.
- issue: Gênero de ἄνθρωποι
  choice: homens
  alternative: pessoas
  rationale: O contexto aponta para os falsos mestres masculinos já em vista, de modo que 'homens' representa adequadamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção comparativa é fluente, os termos teológicos permanecem deliberadamente amplos e os dois marcadores de nota aparecem no texto principal.
