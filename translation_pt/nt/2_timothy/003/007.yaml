  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: pt
  text: sempre aprendendo e nunca capazes de chegar ao conhecimento da verdade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao pleno conhecimento da verdade”. A palavra grega pode transmitir a ideia de um conhecimento mais pleno ou completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sempre
  rationale: Preserva de modo conciso a ideia de ação contínua ou repetida e sustenta o contraste retórico com μηδέποτε.
- source_word: μανθάνοντα
  choice: aprendendo
  rationale: O particípio presente indica aquisição contínua de instrução; “aprendendo” é natural e não especifica indevidamente como ocorre esse aprendizado.
- source_word: καὶ μηδέποτε
  choice: mas nunca
  rationale: Embora καί normalmente signifique “e”, aqui a oposição entre “sempre” e “nunca” é expressa naturalmente em português por “mas”; “nunca” mantém a força de μηδέποτε.
- source_word: εἰς ἐπίγνωσιν
  choice: ao conhecimento
  rationale: A construção expressa movimento até a obtenção do conhecimento. “Chegar ao conhecimento” conserva a metáfora de chegada e soa idiomático em português.
- source_word: ἀληθείας
  choice: da verdade
  rationale: O genitivo depende de ἐπίγνωσιν. “Da verdade” é a formulação natural no uso paulino e aponta para a verdade reconhecida como tal, sem exigir que o artigo esteja explícito no grego.
- source_word: ἐλθεῖν
  choice: chegar
  rationale: Neste contexto, “chegar” traduz naturalmente a ideia de alcançar um ponto de chegada, sem introduzir a noção mais forte de conquista presente em “alcançar”.
- source_word: δυνάμενα
  choice: capazes
  rationale: O particípio expressa capacidade e concorda, no contexto anterior, com as mulheres mencionadas em 3:6. “Capazes” preserva essa concordância e se encaixa naturalmente na frase.
theological_decisions:
- issue: Nuance de ἐπίγνωσις no uso paulino
  choice: conhecimento
  alternative: pleno conhecimento
  rationale: ἐπίγνωσις pode sugerir conhecimento mais pleno ou completo, mas o ponto central aqui é a incapacidade de chegar ao conhecimento genuíno da verdade apesar do aprendizado contínuo. A tradução principal evita transformar essa nuance possível numa distinção técnica, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O fragmento mantém a dependência sintática do versículo anterior e conserva o contraste enfático entre aprendizado contínuo e incapacidade permanente de chegar ao conhecimento da verdade.
