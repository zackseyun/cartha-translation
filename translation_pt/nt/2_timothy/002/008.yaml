id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: pt
  text: Lembre-se de Jesus, o Messias[a], ressuscitado dentre os mortos, descendente de Davi[b], conforme o meu evangelho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O título grego Χριστός pode ser traduzido por “Cristo” ou “Messias”; aqui se usa “Messias” para tornar explícito o sentido do título, especialmente em ligação com a descendência de Davi.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “da semente de Davi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Lembre-se
  rationale: O imperativo presente de μνημονεύω exprime uma exortação contínua a manter Jesus na lembrança. “Lembre-se” é natural em português e preserva diretamente a força imperativa.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, o Messias
  rationale: Χριστός funciona aqui como título, realçado pela referência à descendência davídica. “Jesus, o Messias” comunica o sentido do título em português natural, sem tratá-lo como mero sobrenome.
- source_word: ἐγηγερμένον
  choice: ressuscitado
  rationale: O particípio perfeito passivo de ἐγείρω apresenta Jesus como aquele que foi ressuscitado e permanece vivo. “Ressuscitado” conserva a voz passiva e é conciso e idiomático.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: A expressão indica que Jesus foi levantado do meio dos mortos. “Dentre os mortos” preserva essa nuance de ἐκ e corresponde ao uso corrente em contextos de ressurreição.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: descendente de Davi
  rationale: Embora σπέρμα signifique literalmente “semente”, neste contexto genealógico a expressão indica linhagem. “Descendente de Davi” comunica isso com clareza e naturalidade.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: conforme o meu evangelho
  rationale: κατά exprime conformidade ou correspondência. A tradução mantém literalmente o possessivo “meu”, como na expressão paulina, sem sugerir que se trate de um evangelho diferente.
theological_decisions:
- issue: Tradução de Χριστός
  choice: Messias
  alternative: Cristo
  rationale: A ressurreição e a descendência de Davi tornam proeminente o sentido titular de Χριστός. “Messias” explicita esse sentido; a alternativa tradicional “Cristo” é registrada em nota.
- issue: Força do perfeito passivo ἐγηγερμένον
  choice: ressuscitado
  alternative: que ressuscitou
  rationale: A forma passiva grega apresenta a ressurreição como ação realizada sobre Jesus, enquanto “que ressuscitou” poderia soar intransitivo e apagar essa nuance. O particípio também preserva de modo conciso o estado resultante.
- issue: Sentido de “meu evangelho”
  choice: meu evangelho
  alternative: o evangelho que proclamo
  rationale: O possessivo deve ser preservado sem ser interpretado como reivindicação de uma mensagem distinta. A formulação mantém a tensão e a concisão do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura breve e solene do grego foi preservada, evitando explicações interpretativas no corpo do versículo.
