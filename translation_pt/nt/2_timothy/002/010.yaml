id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: pt
  text: Por isso, suporto tudo por causa dos eleitos[a], para que eles também obtenham a salvação que está no Messias Jesus[b], com glória eterna.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolhidos”. O termo grego é ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: 'Forma tradicional: “Cristo Jesus”.'
    reason: alternative_reading
  - marker: c
    text: 'O grego também pode ser vertido sem a vírgula: “a salvação que está no Messias Jesus com glória eterna”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação causal com o contexto anterior.
- source_word: πάντα ὑπομένω
  choice: suporto tudo
  rationale: Preserva o sentido abrangente de πάντα e a ideia de permanecer firme sob sofrimento presente em ὑπομένω.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: por causa dos eleitos
  rationale: διά com acusativo indica aqui que Paulo suporta as aflições em consideração e benefício dos eleitos. A formulação mantém o vocabulário explícito de eleição sem o explicar por um sistema teológico.
- source_word: ἵνα καὶ αὐτοὶ
  choice: para que eles também
  rationale: Mantém a finalidade introduzida por ἵνα e o valor aditivo de καί; o pronome explícito comunica adequadamente a ênfase de αὐτοί.
- source_word: σωτηρίας τύχωσιν
  choice: obtenham a salvação
  rationale: τυγχάνω com genitivo pode significar obter ou alcançar. “Obtenham” é claro, atual e conserva a força do subjuntivo na oração de finalidade.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: que está no Messias Jesus
  rationale: A expressão preposicional articulada especifica a salvação. “No” preserva a linguagem paulina de localização ou união sem a expandir interpretativamente.
- source_word: Χριστῷ
  choice: Messias
  rationale: Traduz o valor titular de Χριστός em vez de apenas transliterá-lo; “Cristo” permanece registrado como forma tradicional alternativa.
- source_word: μετὰ δόξης αἰωνίου
  choice: com glória eterna
  rationale: Mantém o sentido de acompanhamento de μετά com genitivo e a qualidade duradoura expressa por αἰωνίου, sem decidir além do que a sintaxe exige.
theological_decisions:
- issue: Sentido de ἐκλεκτούς
  choice: eleitos
  alternative: escolhidos
  rationale: “Eleitos” corresponde diretamente ao termo grego e preserva sua tensão teológica, sem definir quem são nem como ocorre a eleição.
- issue: Χριστός como título ou forma tradicional
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: O título grego continua semanticamente ativo e é traduzido como “Messias”; a forma tradicional é indicada em nota para transparência.
- issue: Relação de μετὰ δόξης αἰωνίου com a salvação
  choice: com glória eterna
  alternative: juntamente com a glória eterna
  rationale: A expressão indica que a glória eterna acompanha a salvação. A vírgula favorece a clareza, mas a nota reconhece que o grego não contém pontuação que determine visualmente a ligação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Suporto tudo” e “obtenham” são correntes sem perder a densidade do texto. A tradução conserva os termos teologicamente relevantes e registra alternativas legítimas em notas.
