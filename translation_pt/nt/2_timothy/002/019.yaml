id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: pt
  text: 'Contudo, o firme fundamento de Deus permanece de pé, trazendo este selo[a]: “O Senhor conhece os que lhe pertencem” e: “Afaste-se da injustiça todo aquele que professa o nome do Senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trazendo esta inscrição”. A palavra traduzida como “selo” pode referir-se à marca identificadora ou à inscrição gravada num selo.
    reason: lexical_alternative
  - marker: b
    text: Ou “invoca o nome do Senhor”. Literalmente, o grego diz “nomeia o nome do Senhor”, expressão que pode indicar invocação ou declaração de lealdade a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Contudo
  rationale: Marca com clareza a forte transição adversativa em relação ao avanço do falso ensino mencionado anteriormente, mantendo o peso retórico sem soar arcaico.
- source_word: στερεὸς θεμέλιος
  choice: o firme fundamento
  rationale: Preserva a metáfora da base estável e duradoura em português natural.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a relação genitiva sem decidir se a ênfase recai em posse, origem ou caracterização.
- source_word: ἕστηκεν
  choice: permanece de pé
  rationale: Expressa o estado resultante e contínuo do perfeito grego, realçando estabilidade e permanência.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: trazendo este selo
  rationale: Conserva a imagem de uma marca que identifica ou autentica o fundamento; a possível ideia de inscrição é indicada em nota.
- source_word: Ἔγνω
  choice: conhece
  rationale: Embora a forma grega seja aorista, a citação exprime o conhecimento divino como realidade vigente; o presente é idiomático em português.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: os que lhe pertencem
  rationale: Comunica claramente a relação de pertencimento expressa pela construção participial grega.
- source_word: Ἀποστήτω
  choice: Afaste-se
  rationale: Transmite a ordem de separação decisiva expressa pelo imperativo aoristo, em linguagem corrente e digna.
- source_word: ἀπὸ ἀδικίας
  choice: da injustiça
  rationale: Preserva o amplo campo moral de ἀδικία, que abrange injustiça, iniquidade e conduta contrária ao que é reto.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: todo aquele que professa o nome do Senhor
  rationale: Evita em português a repetição pouco natural de 'nomeia o nome' e comunica o sentido de reconhecer publicamente ou declarar lealdade ao Senhor, sem excluir a nuance de invocação, registrada em nota.
theological_decisions:
- issue: Referente de “Senhor” nas duas declarações do selo
  choice: Manter “Senhor” nas duas ocorrências sem identificar explicitamente o referente como o Pai ou Cristo.
  alternative: Interpretar ambas as ocorrências como referência exclusiva a Deus Pai, ambas como referência exclusiva a Cristo, ou distinguir os referentes entre as duas declarações.
  rationale: O texto grego emprega κύριος sem esclarecimento explícito. A linguagem vem das Escrituras e é aplicada em contexto cristão; a tradução preserva essa densidade e possível sobreposição referencial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Contudo” e “permanece de pé” preservam a força retórica e a imagem de estabilidade; “professa o nome” comunica o idioma grego sem reproduzir uma repetição artificial em português.
