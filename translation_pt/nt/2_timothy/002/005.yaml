  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: pt
  text: Além disso, se alguém competir como atleta, não é coroado se não competir de acordo com as regras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de maneira legítima”. O advérbio grego pode significar “de modo legal” ou “de modo legítimo”; neste contexto, provavelmente se refere a competir segundo as regras da prova.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: compete como atleta / competir
  rationale: O verbo ἀθλέω evoca uma competição atlética. A primeira formulação explicita a imagem, e a segunda mantém a ligação lexical sem tornar o português pesado.
- source_word: τις
  choice: alguém
  rationale: O pronome indefinido tem sentido genérico; “alguém” o expressa naturalmente sem introduzir marcação de gênero desnecessária.
- source_word: στεφανοῦται
  choice: recebe a coroa
  rationale: O passivo se refere à coroação do vencedor. “Recebe a coroa” conserva a metáfora atlética e soa mais natural em português do que “é coroado” neste contexto.
- source_word: νομίμως
  choice: de acordo com as regras
  rationale: No contexto da competição, o advérbio indica competir de maneira legítima ou regulamentar. A expressão comunica com clareza essa ideia ao leitor moderno.
- source_word: καὶ
  choice: também
  rationale: Marca a adição desta analogia às anteriores.
- source_word: δὲ
  choice: E
  rationale: Indica uma transição leve para outro exemplo; “E” mantém a continuidade do argumento.
theological_decisions:
- issue: Natureza da imagem da coroa
  choice: Manter a metáfora atlética de receber a coroa, sem identificar especificamente a recompensa.
  alternative: Explicitar a coroa como recompensa escatológica ou aprovação ministerial.
  rationale: O texto apresenta uma analogia atlética e não define aqui o referente teológico exato da coroa; especificá-lo resolveria uma abertura que o grego preserva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do verbo competir preserva a coesão da imagem atlética; “recebe a coroa” evita linguagem arcaica e não explica além do texto.
