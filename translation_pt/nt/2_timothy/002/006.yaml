reference: 2 Timothy 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: pt
  text: O agricultor que trabalha arduamente deve ser o primeiro a receber uma parte da colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O agricultor que labuta deve ser o primeiro a participar dos frutos.”'
    reason: 'Alternativa lexical mais formal: «participar dos frutos» traduz mais de perto μεταλαμβάνειν com τῶν καρπῶν; o texto principal torna claro o sentido de receber uma parte do produto da lavoura.'
lexical_decisions:
- source_word: κοπιῶντα
  choice: que trabalha arduamente
  rationale: O particípio de κοπιάω expressa trabalho intenso e penoso. A expressão preserva a ênfase no esforço e soa natural em português moderno.
- source_word: γεωργὸν
  choice: lavrador
  rationale: γεωργός designa quem cultiva a terra. “Lavrador” é claro, digno e combina naturalmente com “frutos”, sem restringir indevidamente o referente.
- source_word: δεῖ
  choice: deve
  rationale: δεῖ indica necessidade ou obrigação. “Deve” conserva essa força de maneira idiomática.
- source_word: πρῶτον
  choice: o primeiro
  rationale: A posição e a sintaxe ligam mais naturalmente πρῶτον à participação nos frutos, indicando prioridade, e não ao momento em que o lavrador começa a trabalhar.
- source_word: τῶν καρπῶν
  choice: dos frutos
  rationale: καρποί refere-se aqui ao produto da lavoura. “Frutos” preserva de perto a imagem agrícola do grego e é compreensível no contexto.
- source_word: μεταλαμβάνειν
  choice: a participar
  rationale: μεταλαμβάνω significa participar ou tomar parte em algo. Com o genitivo partitivo, “participar dos frutos” mantém a construção e o sentido sem explicitar além do necessário a ideia de uma porção.
theological_decisions:
- issue: Sentido da afirmação proverbial
  choice: Aquele que trabalha na lavoura deve ter prioridade na participação nos resultados do seu trabalho.
  alternative: O lavrador precisa primeiro trabalhar para depois participar dos frutos.
  rationale: A sintaxe grega relaciona mais naturalmente πρῶτον com μεταλαμβάνειν, de modo que a ênfase recai sobre a prioridade do lavrador em participar dos frutos, embora a outra associação seja possível como leitura menos provável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Trabalha arduamente” comunica o esforço de κοπιάω sem arcaísmo; “lavrador” mantém a imagem agrícola; a nota registra uma formulação mais explícita.
