  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: pt
  text: Mas evite discussões insensatas e sem instrução[a], sabendo que elas geram brigas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “questões” ou “debates”; o substantivo grego pode designar perguntas ou investigações, mas aqui provavelmente se refere a disputas controversas. “Sem instrução” também pode ser traduzido por “ignorantes”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dão à luz” ou “geram”; a expressão é uma metáfora para causar ou produzir brigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: insensatas
  rationale: Expressa falta de bom senso sem recorrer a uma formulação excessivamente coloquial ou insultuosa.
- source_word: ἀπαιδεύτους
  choice: ignorantes
  rationale: Indica aquilo que carece de instrução ou formação; em português corrente, “ignorantes” é conciso e natural, embora a nota preserve a nuance de falta de instrução.
- source_word: ζητήσεις
  choice: discussões
  rationale: O substantivo pode designar questões ou investigações, mas neste contexto se refere a debates controversos que resultam em conflito.
- source_word: παραιτοῦ
  choice: evite
  rationale: O imperativo médio manda recusar envolvimento ou manter distância; “evite” comunica esse sentido de modo direto e natural.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Preserva a forma participial e apresenta o conhecimento de Timóteo como fundamento para a ordem.
- source_word: γεννῶσι
  choice: geram
  rationale: Conserva em português uma metáfora natural de produzir ou dar origem a algo.
- source_word: μάχας
  choice: brigas
  rationale: No contexto de discussões verbais e relacionais, “brigas” transmite conflitos e desavenças sem sugerir necessariamente combate físico.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste com a exortação anterior de maneira clara.
