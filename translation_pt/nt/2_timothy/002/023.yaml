translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Discussões” evita a possível impressão de que toda pergunta sincera deva ser rejeitada, enquanto a nota conserva a amplitude lexical do original. A ordem e a relação causal do grego foram mantidas.
