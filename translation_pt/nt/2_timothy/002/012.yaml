reference: 2 Timothy 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: pt
  text: Se perseverarmos, também reinaremos com ele; se o negarmos,[a] ele também nos negará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se o renegarmos, ele também nos renegará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: perseverarmos
  rationale: Neste contexto, ὑπομένω expressa constância em meio a provações ou sofrimento. “Perseverarmos” é natural em português e comunica melhor essa continuidade firme do que o possível, mas mais genérico, “suportarmos”.
- source_word: συμβασιλεύσομεν
  choice: reinaremos com ele
  rationale: O verbo composto significa “reinar juntamente com”. “Reinaremos” preserva a imagem régia, e “com ele” explicita em português o participante conjunto indicado pelo verbo e pelo contexto.
- source_word: ἀρνησόμεθα
  choice: o negarmos
  rationale: ἀρνέομαι pode significar negar, repudiar ou renegar alguém. “O negarmos” é idiomático, mantém o objeto masculino inferido do contexto e permite repetir o mesmo verbo na oração seguinte.
- source_word: κἀκεῖνος
  choice: ele também
  rationale: A crase de καὶ ἐκεῖνος assinala correspondência recíproca. “Ele também” preserva de modo natural o paralelismo entre a ação humana e a resposta dele.
- source_word: ἀρνήσεται ἡμᾶς
  choice: nos negará
  rationale: A repetição de “negar” reproduz a repetição deliberada de ἀρνέομαι e conserva a força retórica e a reciprocidade da advertência.
theological_decisions:
- issue: Natureza da advertência na segunda oração condicional
  choice: 'Traduzir diretamente como advertência real: “se o negarmos, ele também nos negará”.'
  alternative: Entender a negação apenas como perda de recompensa, ou tratar a condição como hipótese sem força existencial.
  rationale: O grego apresenta uma condição equilibrada e severa, em paralelo com tradições de advertência atribuídas a Jesus. A tradução não deve decidir debates sobre apostasia, perseverança ou recompensa além do que o próprio texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados sem rigidez artificial. O pronome “ele” permanece em minúscula segundo o uso editorial corrente.
