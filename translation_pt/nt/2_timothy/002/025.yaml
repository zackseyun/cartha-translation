  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: pt
  text: corrigindo com mansidão os que se opõem, para ver se Deus lhes concede arrependimento que os leve ao pleno conhecimento da verdade,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “talvez Deus lhes conceda arrependimento que os leve ao pleno conhecimento da verdade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: com mansidão
  rationale: A expressão indica a maneira de corrigir. “Mansidão” é corrente no registro bíblico em português e comunica brandura sob domínio, não fraqueza.
- source_word: παιδεύοντα
  choice: corrigindo
  rationale: Neste contexto, παιδεύω se refere a instrução corretiva dirigida aos opositores, não principalmente a castigo ou disciplina punitiva.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: os que se opõem
  rationale: O particípio designa os que assumem uma posição contrária. O grego não explicita o objeto da oposição, por isso a tradução preserva essa abertura sem acrescentar “a ele”.
- source_word: μήποτε δώῃ αὐτοῖς ὁ θεὸς
  choice: na esperança de que Deus lhes conceda
  rationale: μήποτε com o subjuntivo expressa aqui uma possibilidade cautelosa ligada à correção. Esta formulação é natural em português, preserva a contingência e mantém Deus como agente explícito.
- source_word: μετάνοιαν
  choice: arrependimento
  rationale: É o equivalente estabelecido e adequado neste contexto, abrangendo mudança interior e reorientação, sem reduzir o termo a mera alteração intelectual.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: que leve ao pleno conhecimento da verdade
  rationale: εἰς indica meta ou resultado, e ἐπίγνωσις sugere reconhecimento ou conhecimento pleno. A oração relativa expressa naturalmente essa direção em português.
theological_decisions:
- issue: Ação divina e arrependimento humano
  choice: Deus é apresentado como aquele que pode conceder o arrependimento, enquanto a formulação permanece contingente.
  alternative: Enfatizar uma determinação divina absoluta ou, no sentido oposto, minimizar a ação de Deus no arrependimento.
  rationale: O texto atribui explicitamente a Deus a concessão do arrependimento, mas não explica sistematicamente a relação entre ação divina e resposta humana. A tradução preserva essa tensão.
- issue: Força de μήποτε
  choice: “na esperança de que” no texto, com a alternativa mais literal registrada em nota
  alternative: “talvez Deus lhes conceda” ou “para ver se Deus lhes concede”
  rationale: A expressão escolhida liga naturalmente a correção paciente à possibilidade desejada, sem transformar a concessão em certeza. A nota preserva de modo transparente a nuance modal alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita inserir um objeto não expresso em “os que se opõem” e conserva tanto a ação divina quanto a contingência indicada pelo subjuntivo.
