id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: pt
  text: Continue a lembrar-lhes estas coisas e, diante do Senhor[a], advirta-os solenemente a não se envolverem em disputas de palavras, que não trazem proveito algum[b] e levam à ruína os que as ouvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto diz “o Senhor”, sem especificar aqui se a referência é particularmente ao Senhor Jesus ou, de modo mais amplo, a Deus.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “que não servem para nada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma os ensinamentos anteriores; “essas coisas” preserva de modo natural essa referência anafórica.
- source_word: ὑπομίμνῃσκε
  choice: Continue lembrando
  rationale: O imperativo presente sugere ação contínua ou repetida. A formulação comunica esse aspecto com clareza em português.
- source_word: διαμαρτυρόμενος
  choice: exorte-os solenemente
  rationale: O particípio expressa uma exortação enfática e solene. O pronome “os” é suprido pelo contexto e se refere às pessoas que Timóteo deve continuar lembrando.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: diante do Senhor
  rationale: A expressão retrata o Senhor como testemunha da exortação e preserva o título κύριος sem especificar além do que o texto diz.
- source_word: μὴ λογομαχεῖν
  choice: a não discutir por causa de palavras
  rationale: O verbo denota envolver-se em contendas ou disputas verbais. Esta formulação é atual e mantém o tom negativo sem sugerir que toda discussão sobre o sentido das palavras seja condenada.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: Isso não serve para nada
  rationale: A frase declara a completa falta de benefício dessas disputas; “isso” retoma naturalmente a ação proibida.
- source_word: ἐπὶ καταστροφῇ
  choice: e leva à ruína
  rationale: A construção indica o resultado destrutivo das disputas e mantém a força severa de καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: os que ouvem
  rationale: O particípio substantivado designa as pessoas expostas à disputa; a tradução conserva sua forma ampla e corrente.
theological_decisions:
- issue: Referente de κύριος
  choice: Senhor
  alternative: Deus; o Senhor Jesus
  rationale: O grego diz apenas “o Senhor”. Embora κύριος possa referir-se especificamente a Jesus, o contexto imediato não exige que o referente seja explicitado; por isso, a tradução preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Exorte-os solenemente” conserva a força pastoral da ordem; “discutir por causa de palavras” evita o arcaísmo e mantém o sentido pejorativo da contenda verbal.
