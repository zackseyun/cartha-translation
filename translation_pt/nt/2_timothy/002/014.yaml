  - severity: medium
    issue: “Exorte-os solenemente” não representa com precisão plena διαμαρτυρόμενος.
    rationale: O particípio tem força de advertência, insistência ou ordem solene, ligada especificamente à proibição seguinte. “Advertindo-os solenemente” conserva melhor essa força sem impor interpretação doutrinária.
  - severity: low
    issue: “Discutir por causa de palavras” pode soar excessivamente amplo e neutro.
    rationale: λογομαχεῖν designa contendas verbais ou disputas de palavras. “Envolver-se em disputas de palavras” comunica mais claramente o sentido negativo.
