id: 2TI.2.11
reference: 2 Timothy 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: pt
  text: Esta declaração é digna de confiança:[a] pois, se morremos com ele,[b] também viveremos com ele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Esta palavra é fiel” ou “Esta afirmação é confiável”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “morremos juntamente com”; o verbo composto grego indica uma morte compartilhada com Cristo.
    reason: lexical_alternative
  - marker: c
    text: O futuro “viveremos com ele” pode se referir à vida da ressurreição com Cristo, à participação presente na vida dele, ou a ambas.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: digna de confiança
  rationale: Como adjetivo predicativo de ὁ λόγος, expressa que a declaração é confiável e merece ser aceita. A formulação é natural em português atual e evita sugerir, de modo indevido, a fidelidade pessoal de alguém.
- source_word: ὁ λόγος
  choice: esta declaração
  rationale: Neste uso formular das Cartas Pastorais, λόγος introduz uma afirmação breve e memorável. “Esta declaração” comunica esse sentido com clareza; o demonstrativo é idiomático em português na apresentação da fórmula.
- source_word: εἰ γὰρ
  choice: pois, se
  rationale: “Se” preserva a condição introduzida por εἰ, e “pois” conserva a força explicativa de γάρ, ligando a fórmula à declaração que se segue.
- source_word: συναπεθάνομεν
  choice: morremos com ele
  rationale: O aoristo de συναποθνῄσκω indica morrer juntamente com alguém. “Com ele” explicita em português o participante implícito, identificado pelo contexto como Cristo, sem impor uma interpretação temporal mais específica.
- source_word: καὶ
  choice: também
  rationale: 'Aqui καί estabelece correspondência entre as duas orações: morrer com Cristo e também viver com ele.'
- source_word: συζήσομεν
  choice: viveremos com ele
  rationale: O futuro de συζάω expressa vida compartilhada com Cristo. A tradução mantém o futuro e não restringe a referência à ressurreição futura nem à participação presente na vida de Cristo.
theological_decisions:
- issue: Referente implícito dos verbos compostos com συν-
  choice: Explicitar “com ele” nos dois verbos, tendo Cristo como referente.
  alternative: 'Deixar a participação implícita: “se morremos, também viveremos”.'
  rationale: Embora o grego não traga um complemento separado, o prefixo συν- em ambos os verbos indica participação conjunta. O contexto cristocêntrico identifica naturalmente Cristo como referente; explicitá-lo comunica o sentido exigido pelos compostos gregos.
- issue: Alcance temporal e teológico de viver com Cristo
  choice: Traduzir de forma ampla como “também viveremos com ele”.
  alternative: Restringir o sentido à vida da ressurreição futura ou à participação espiritual presente na vida de Cristo.
  rationale: O futuro συζήσομεν aponta naturalmente para vida futura com Cristo, mas a expressão pode evocar uma participação mais ampla em sua vida. A tradução preserva essa abertura sem resolver a tensão em favor de uma leitura doutrinária estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Declaração” transmite o uso formular de λόγος sem soar excessivamente técnico; a ordem “pois, se” preserva a relação lógica do grego.
