id: 2TI.2.7
reference: 2 Timothy 2:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: pt
  text: Reflita sobre o que digo[a], pois o Senhor[b] lhe dará entendimento em tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pense no que digo”; o verbo também pode ter o sentido de “entenda”.'
    reason: lexical_alternative
  - marker: b
    text: O grego não especifica melhor quem é “o Senhor”; há diferentes entendimentos sobre se a referência é especificamente ao Senhor Jesus ou, de modo mais geral, a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Reflita
  rationale: O imperativo presente de νοέω convoca Timóteo a ponderar ativamente. “Reflita” expressa essa exortação com naturalidade e não antecipa o entendimento que, na oração seguinte, o Senhor dará.
- source_word: ὃ
  choice: o que
  rationale: O pronome relativo neutro singular refere-se idiomaticamente ao conteúdo das palavras de Paulo; “o que” é a forma portuguesa mais natural.
- source_word: λέγω
  choice: digo
  rationale: O presente λέγω aponta para a instrução que Paulo está dando no contexto. O presente simples “digo” é corrente e conciso em português.
- source_word: δώσει
  choice: dará
  rationale: O futuro de δίδωμι expressa diretamente a promessa de que o Senhor concederá entendimento.
- source_word: γάρ
  choice: pois
  rationale: γάρ apresenta o fundamento da exortação anterior. “Pois” preserva essa relação explicativa de modo natural e digno.
- source_word: σοι
  choice: lhe
  rationale: O dativo singular marca Timóteo como destinatário da dádiva. “Lhe dará” acompanha naturalmente o tratamento expresso pelo imperativo “reflita”.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: A tradução mantém a designação grega sem especificar se a referência é particularmente a Jesus ou, de modo mais geral, a Deus.
- source_word: σύνεσιν
  choice: entendimento
  rationale: σύνεσις denota compreensão ou capacidade de apreender o sentido. “Entendimento” é claro, abrangente e adequado ao contexto.
- source_word: ἐν πᾶσιν
  choice: em tudo
  rationale: A expressão preserva de maneira natural a abrangência de ἐν πᾶσιν sem restringi-la explicitamente a assuntos doutrinários.
theological_decisions:
- issue: Referente de “o Senhor” (ὁ κύριος)
  choice: Manter “o Senhor” sem identificação adicional.
  alternative: “o Senhor Jesus” ou “Deus”
  rationale: O grego não especifica o referente além de ὁ κύριος. Embora o uso paulino possa favorecer uma referência a Jesus, explicitar isso no texto resolveria uma ambiguidade que o versículo preserva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Reflita sobre” comunica ponderação ativa; “lhe dará” mantém coerência com o imperativo de terceira pessoa, e “em tudo” evita formalidade desnecessária sem reduzir o alcance do grego.
