source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: pt
  text: Mas o servo[a] do Senhor não deve brigar; pelo contrário, deve ser gentil com todos, apto para ensinar e paciente quando for ofendido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escravo”. A palavra grega doulos pode significar “servo” ou “escravo”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον (δοῦλος)
  choice: servo
  rationale: Em português, “servo” comunica naturalmente a relação de serviço e lealdade ao Senhor neste contexto de instrução ministerial. “Escravo” continua sendo uma possibilidade lexical real e é preservada em nota.
- source_word: κυρίου (κύριος)
  choice: do Senhor
  rationale: Reproduz diretamente o genitivo grego e mantém “Senhor” como a designação cristológica normal de κύριος.
- source_word: οὐ δεῖ
  choice: não deve
  rationale: Expressa de modo claro e natural a obrigação negativa indicada pela construção impessoal δεῖ.
- source_word: μάχεσθαι (μάχομαι)
  choice: brigar
  rationale: Neste contexto, o verbo se refere sobretudo a envolver-se em confrontos e disputas, sem excluir por completo a ideia mais ampla de combate. “Brigar” é corrente e preserva essa amplitude.
- source_word: ἤπιον (ἤπιος)
  choice: gentil
  rationale: Comunica a atitude branda e não agressiva que contrasta com brigar.
- source_word: πρὸς πάντας
  choice: com todos
  rationale: Forma idiomática em português para expressar a atitude relacional dirigida a todas as pessoas.
- source_word: διδακτικόν (διδακτικός)
  choice: apto para ensinar
  rationale: Indica capacidade ou qualificação para ensinar, e não a qualidade de ser ensinável.
- source_word: ἀνεξίκακον (ἀνεξίκακος)
  choice: paciente quando for ofendido
  rationale: 'Explicita o sentido raro do termo: suportar o mal ou os maus-tratos sem reagir com ressentimento ou retaliação.'
theological_decisions:
- issue: Sentido de δοῦλος na descrição de quem pertence e serve ao Senhor
  choice: servo
  alternative: escravo
  rationale: O foco imediato está na conduta exigida de quem serve ao Senhor. “Servo” soa natural nesse contexto ministerial, enquanto a nota conserva “escravo”, que ressalta mais fortemente a condição de pertença e submissão.
- issue: Referente e tradução de κύριος
  choice: Senhor
  alternative: senhor ou mestre
  rationale: “Senhor” preserva a designação cristã normal sem reduzir o termo a uma simples relação humana de trabalho ou propriedade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sequência de qualidades foi mantida compacta; “pelo contrário” torna explícito o contraste de ἀλλά sem acrescentar conteúdo teológico.
