  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: pt
  text: Participe dos sofrimentos como bom soldado do Messias Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Suporte comigo as dificuldades como bom soldado de Cristo Jesus”.'
    reason: Alternativa lexical que explicita a companhia sugerida pelo prefixo συν- e emprega uma formulação portuguesa mais tradicional.
  - marker: b
    text: 'Grego: “Cristo Jesus”; aqui, “Messias Jesus”, porque Χριστός funciona como título.'
    reason: Esclarece a tradução do título cristológico e registra a forma tradicional alternativa.
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Participe dos sofrimentos
  rationale: O imperativo aoristo na segunda pessoa do singular exige uma exortação direta. O prefixo συν- comunica participação conjunta no sofrimento; esta formulação preserva essa dimensão sem acrescentar explicitamente “comigo”, que não aparece como complemento no texto grego.
- source_word: ὡς
  choice: como
  rationale: Introduz a comparação que descreve a maneira em que Timóteo deve participar dos sofrimentos.
- source_word: καλὸς
  choice: bom
  rationale: No sintagma com “soldado”, expressa qualidade digna de aprovação ou aptidão. “Bom” é natural, claro e não intensifica indevidamente o sentido.
- source_word: στρατιώτης
  choice: soldado
  rationale: É o equivalente corrente do termo grego e preserva claramente a metáfora militar.
- source_word: Χριστοῦ
  choice: Messias
  rationale: Χριστός funciona aqui como título. “Messias” traduz seu conteúdo titular, em vez de tratá-lo apenas como nome próprio.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa tradicional e corrente do nome pessoal Ἰησοῦς.
theological_decisions:
- issue: Tradução de Χριστοῦ Ἰησοῦ
  choice: do Messias Jesus
  alternative: de Cristo Jesus
  rationale: A opção escolhida conserva a ordem do grego e torna explícito que Χριστός é um título. A alternativa é mais tradicional e idiomática no português bíblico, mas pode ser percebida como um nome composto e obscurecer o valor titular.
- issue: Referente implícito na participação no sofrimento
  choice: Não explicitar “comigo” no texto principal
  alternative: “Suporte comigo as dificuldades”
  rationale: O prefixo συν- indica sofrimento compartilhado, mas a forma verbal não traz um complemento expresso. A tradução principal mantém essa abertura, enquanto a nota registra a leitura contextual plausível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Participe dos sofrimentos” conserva o aspecto comunitário do verbo sem inserir um participante não expresso. “Messias Jesus” é menos convencional que “Cristo Jesus”, mas mantém de modo transparente a relação entre título e nome.
