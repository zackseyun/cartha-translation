reference: 2 Timothy 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: pt
  text: Ninguém que serve como soldado se envolve nos assuntos da vida comum[a], a fim de agradar àquele que o alistou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas atividades civis”. O grego contrasta o serviço militar com as ocupações ou os assuntos da vida comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ninguém
  rationale: Preserva de modo natural e inclusivo a força universal do pronome negativo.
- source_word: στρατευόμενος
  choice: que serve como soldado
  rationale: Expressa a participação contínua no serviço militar e mantém viva a metáfora.
- source_word: ἐμπλέκεται
  choice: se deixa envolver
  rationale: Comunica envolvimento que prende ou impede a liberdade de ação, sem sugerir que toda participação na vida comum seja proibida.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: nos assuntos da vida comum
  rationale: Representa πραγματείαις como ocupações ou assuntos e βίος como a vida cotidiana, preservando o contraste implícito com o serviço militar.
- source_word: ἵνα
  choice: a fim de
  rationale: Marca com clareza a finalidade expressa pela oração grega.
- source_word: τῷ στρατολογήσαντι
  choice: àquele que o alistou
  rationale: Traduz o particípio substantivado sem introduzir uma patente militar ausente no texto.
- source_word: ἀρέσῃ
  choice: agradar
  rationale: Mantém o propósito da dedicação do soldado de maneira natural em português.
theological_decisions:
- issue: Alcance da metáfora militar
  choice: Manter a imagem do soldado que evita envolver-se nos assuntos da vida comum para agradar a quem o alistou.
  alternative: Explicitar diretamente uma aplicação ao ministério ou traduzir como “atividades civis”.
  rationale: O texto apresenta uma metáfora militar, mas não declara neste versículo uma aplicação pormenorizada. A tradução preserva a imagem e sua tensão sem inserir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Vida comum” evita o tom excessivamente técnico de “vida civil”, enquanto a nota registra essa alternativa e esclarece o contraste militar.
