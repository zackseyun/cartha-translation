  source_fidelity: 'A tradução reproduz bem a estrutura e o sentido geral do grego: a negação universal, a imagem do serviço militar, o contraste com os assuntos da vida cotidiana e a finalidade de agradar a quem alistou o soldado. Contudo, “se deixa envolver” introduz uma nuance permissiva/volitiva (“permite que o envolvam”) que não é expressa por ἐμπλέκεται e enfraquece a imagem de envolvimento que impede a dedicação militar.'
