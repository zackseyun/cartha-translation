id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: pt
  text: Numa casa grande, não há somente vasos de ouro e de prata, mas também de madeira e de barro[a]; alguns são para honra, e outros, para desonra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, vasos feitos de argila ou cerâmica.
    reason: cultural_note
  - marker: b
    text: 'Ou: “alguns para uso honroso, e outros para uso desonroso”. O grego diz mais literalmente “para honra ... para desonra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν μεγάλῃ δὲ οἰκίᾳ
  choice: Numa casa grande
  rationale: A expressão preserva a imagem de uma residência ampla ou importante em português natural. O δέ funciona aqui como ligação discursiva leve; não foi explicitado para evitar atribuir ao trecho uma oposição mais forte do que o grego exige.
- source_word: σκεύη
  choice: vasos
  rationale: O termo grego é amplo e designa objetos ou recipientes destinados a algum uso. “Vasos” mantém a imagem doméstica, a amplitude metafórica e a ligação com o versículo seguinte.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: de ouro e de prata
  rationale: Os adjetivos indicam o material de que os vasos são feitos; a construção com “de” é idiomática e clara em português.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: de madeira e de barro
  rationale: ὀστράκινος designa algo feito de argila ou cerâmica. “De barro” é preciso, corrente e forma um paralelo natural com “de madeira”.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: alguns ... e outros ...
  rationale: A correlação μέν...δέ divide os vasos em dois grupos contrastantes. A formulação escolhida comunica o contraste com naturalidade, sem acrescentar uma adversativa desnecessariamente forte.
- source_word: εἰς τιμήν
  choice: para honra
  rationale: Mantém o substantivo abstrato τιμή e evita reduzir antecipadamente a imagem ao sentido funcional de “uso honroso”.
- source_word: εἰς ἀτιμίαν
  choice: para desonra
  rationale: Preserva o contraste lexical direto com “honra” e a tensão retórica do texto grego.
theological_decisions:
- issue: Se τιμή/ἀτιμία deve ser interpretado funcionalmente como tipos de uso ou mantido como linguagem de honra e desonra
  choice: para honra ... para desonra
  alternative: para uso honroso ... para uso desonroso
  rationale: O contexto doméstico permite entender a expressão em termos de uso, mas Paulo emprega os substantivos abstratos “honra” e “desonra”. A tradução principal preserva essa formulação e sua possível dimensão moral ou de status, enquanto a nota registra a leitura funcional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Numa” é uma contração corrente de “em uma”; “vasos” conserva a metáfora do original sem recorrer a linguagem excessivamente técnica.
