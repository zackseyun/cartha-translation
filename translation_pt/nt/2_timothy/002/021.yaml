id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: pt
  text: Portanto, se alguém se purificar dessas coisas, será um vaso para honra[a], santificado[b], útil ao Mestre[c] e preparado para toda boa obra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destinado a uso honroso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tornado santo” ou “separado”.
    reason: lexical_alternative
  - marker: c
    text: Ou “dono”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva tanto a inferência marcada por οὖν quanto a condição introduzida por ἐάν, em ordem natural no português.
- source_word: τις
  choice: alguém
  rationale: Expressa de modo natural o caráter indefinido e genérico do pronome, sem restringi-lo ao sexo masculino.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: se purificar
  rationale: O verbo indica remover impurezas de si mesmo. A construção reflexiva portuguesa conserva o sentido sem exigir um pronome de gênero.
- source_word: ἀπὸ τούτων
  choice: dessas coisas
  rationale: Mantém a referência demonstrativa ao contexto anterior sem decidir se Paulo se refere exclusivamente a pessoas, ensinos ou práticas.
- source_word: σκεῦος
  choice: vaso
  rationale: Conserva a metáfora dos objetos de uma grande casa no versículo anterior. Embora 'utensílio' seja mais corrente, 'vaso' mantém melhor a imagem de recipiente e é compreensível no registro bíblico.
- source_word: εἰς τιμήν
  choice: para honra
  rationale: Preserva a formulação concisa e o contraste com ἀτιμία no versículo anterior, sem incorporar ao texto principal a interpretação 'para uso honroso'.
- source_word: ἡγιασμένον
  choice: santificado
  rationale: Reproduz o estado resultante expresso pelo particípio perfeito passivo e mantém a relação lexical com santidade, sem decidir no texto entre 'tornado santo' e 'separado'.
- source_word: εὔχρηστον
  choice: útil
  rationale: É o equivalente moderno e direto para aquilo que está apto e é proveitoso para o serviço.
- source_word: τῷ δεσπότῃ
  choice: ao Mestre
  rationale: Mantém a relação de autoridade no quadro doméstico e permite reconhecer a provável referência divina sem substituir a metáfora por uma explicação.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: preparado para toda boa obra
  rationale: Conserva a abrangência de πᾶν e a expressão paulina ἔργον ἀγαθόν em português claro e tradicional.
theological_decisions:
- issue: Força genérica das formas singulares
  choice: se alguém se purificar ... será
  alternative: se uma pessoa purificar a si mesma ... ela será
  rationale: O português permite conservar naturalmente o singular genérico e a reflexividade sem introduzir gênero gramatical referente à pessoa.
- issue: Sentido de εἰς τιμήν
  choice: para honra
  alternative: para uso honroso
  rationale: A leitura literal sustenta o contraste com os vasos 'para desonra' do versículo anterior; a alternativa explicita a função do vaso, mas é interpretativa e por isso fica em nota.
- issue: Sentido de ἡγιασμένον
  choice: santificado
  alternative: tornado santo; separado
  rationale: ‘Santificado’ retém tanto o registro teológico quanto a ideia de consagração, sem reduzir o termo apenas à transformação moral ou apenas à separação para uma função.
- issue: Identidade e título de δεσπότης
  choice: Mestre
  alternative: dono; senhor
  rationale: O termo designa quem possui autoridade sobre a casa. A inicial maiúscula sinaliza a provável referência a Deus ou ao Senhor, enquanto 'Mestre' preserva a imagem sem definir mais precisamente o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a metáfora doméstica de 2Timóteo 2:20. 'Vaso' e 'para honra' mantêm deliberadamente a imagem e a tensão do grego; as paráfrases mais funcionais aparecem nas notas. Todos os marcadores de nota estão posicionados junto às expressões correspondentes.
