  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: pt
  text: e voltem a si, escapando da armadilha do diabo, tendo sido capturados vivos[a] por ele para fazer a vontade dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode ser traduzido de modo mais geral por “feitos prisioneiros”, mas indica mais especificamente que foram capturados com vida.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, quanto ao referente de “dele”: “para fazer a vontade de Deus”. Alguns entendem que o pronome grego se refere não ao diabo, mas a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: voltem a si
  rationale: O verbo significa literalmente voltar à sobriedade e, em sentido figurado, recuperar a lucidez. “Voltem a si” comunica de modo natural a recuperação do discernimento após o engano.
- source_word: παγίδος
  choice: armadilha
  rationale: “Armadilha” expressa de forma clara e atual a imagem de captura contida em παγίς, sem exigir o termo menos corrente “laço”.
- source_word: διαβόλου
  choice: do diabo
  rationale: Neste contexto, διάβολος funciona como título pessoal; “diabo” é a forma portuguesa natural e reconhecível.
- source_word: ἐζωγρημένοι
  choice: depois de terem sido capturados vivos
  rationale: ζωγρέω denota especificamente capturar com vida. A construção também procura refletir o particípio perfeito passivo, que descreve o estado resultante de uma captura anterior.
- source_word: ὑπ’ αὐτοῦ
  choice: por ele
  rationale: O referente imediato mais natural é “o diabo”. O pronome evita repetição desnecessária.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: para fazer a vontade dele
  rationale: A formulação torna inteligível em português a finalidade ou destinação expressa por εἰς, sem ocultar na nota a ambiguidade do referente de ἐκείνου.
theological_decisions:
- issue: Referente de ἐκείνου em εἰς τὸ ἐκείνου θέλημα
  choice: 'O pronome é entendido no texto principal como referência ao diabo: “para fazer a vontade dele”.'
  alternative: O pronome pode referir-se a Deus, de modo que os cativos seriam libertados para fazer a vontade de Deus.
  rationale: “O diabo” é o antecedente expresso mais próximo e a leitura mantém a continuidade da imagem de cativeiro. Como o referente é historicamente discutido e o grego não elimina por completo a outra leitura, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Voltem a si” preserva a metáfora da recuperação da sobriedade mental; “escapando” explicita naturalmente a ideia de sair da armadilha expressa pela preposição ἐκ. A redação principal é fluente, enquanto as notas conservam a precisão lexical e a ambiguidade teológica do grego.
