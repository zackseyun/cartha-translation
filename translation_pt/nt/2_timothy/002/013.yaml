id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: pt
  text: Se somos infiéis[a], ele permanece fiel[b], pois não pode negar a si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Se não cremos” ou “Se somos descrentes”. O verbo grego pode indicar descrença ou infidelidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “digno de confiança”. Mantém-se “fiel” para preservar o contraste com “somos infiéis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: somos infiéis
  rationale: O verbo ἀπιστέω pode expressar tanto descrença quanto infidelidade. “Somos infiéis” preserva o contraste com πιστός e mantém aberta a amplitude semântica do grego.
- source_word: πιστὸς
  choice: fiel
  rationale: “Fiel” preserva a ligação lexical e retórica com “infiéis”, além de comunicar a constância daquele de quem se fala. “Digno de confiança” também é possível, mas enfraquece o contraste.
- source_word: μένει
  choice: permanece
  rationale: Expressa de modo natural e direto a continuidade da fidelidade.
- source_word: ἀρνήσασθαι
  choice: negar
  rationale: É o equivalente mais direto e preserva a força relacional e moral do verbo.
- source_word: ἑαυτὸν
  choice: a si mesmo
  rationale: Reproduz claramente o pronome reflexivo que remete ao sujeito “ele”.
- source_word: οὐ δύναται
  choice: não pode
  rationale: Expressa de forma concisa uma impossibilidade, não apenas falta de disposição.
theological_decisions:
- issue: Sentido da fidelidade divina diante da infidelidade humana
  choice: O texto afirma que ele continua fiel porque não pode negar a si mesmo, sem definir se essa fidelidade se manifesta especificamente em salvar, cumprir promessas ou executar juízo.
  alternative: Entender a fidelidade aqui exclusivamente como preservação salvadora ou, no extremo oposto, exclusivamente como fidelidade às advertências de juízo.
  rationale: O grego afirma a constância daquele de quem se fala, fundamentada em seu próprio caráter, mas não resolve explicitamente a implicação pastoral e teológica debatida. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A formulação concisa preserva o paralelismo e o contraste do dito grego sem explicitar uma conclusão doutrinária que o versículo não formula.
