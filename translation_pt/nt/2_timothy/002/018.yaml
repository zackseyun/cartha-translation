  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: pt
  text: os quais se desviaram da verdade[a], dizendo que a ressurreição já aconteceu[b], e estão abalando a fé de alguns[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “erraram o alvo quanto à verdade” ou “se afastaram da verdade”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, afirmavam que a ressurreição esperada para o futuro já havia ocorrido.
    reason: cross_reference
  - marker: c
    text: 'Ou: “estão derrubando” ou “estão subvertendo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: os quais
  rationale: Retoma as pessoas mencionadas anteriormente e introduz a oração relativa; a formulação mantém a ligação sintática sem ampliar indevidamente a nuance qualitativa.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: se desviaram da verdade
  rationale: Expressa em português corrente o sentido idiomático de errar o alvo com respeito à verdade, isto é, afastar-se dela.
- source_word: λέγοντες
  choice: dizendo
  rationale: Preserva a relação participial e apresenta o conteúdo pelo qual o desvio se manifesta, sem fixar mais precisamente se o particípio indica meio ou simples explicação.
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: que a ressurreição já aconteceu
  rationale: A ressurreição é definida pelo contexto doutrinário, e o perfeito γεγονέναι descreve um acontecimento alegadamente consumado com relevância presente.
- source_word: ἀνατρέπουσιν
  choice: estão transtornando
  rationale: Comunica o efeito contínuo de abalar ou desestabilizar a fé, preservando a força do verbo sem afirmar necessariamente destruição total.
- source_word: τήν τινων πίστιν
  choice: a fé de alguns
  rationale: Mantém 'fé' como correspondência não sectária de πίστις e reproduz naturalmente a referência indefinida de τινων.
theological_decisions:
- issue: Sentido da afirmação de que a ressurreição já aconteceu
  choice: Relatar a afirmação falsa sobre a ressurreição sem explicar o sistema doutrinário subjacente.
  alternative: Explicitar que se tratava de uma ressurreição apenas espiritual ou de uma negação da futura ressurreição corporal.
  rationale: O versículo informa o conteúdo básico do ensino, mas não define seus mecanismos; uma explicação mais específica resolveria uma ambiguidade que o texto preserva.
- issue: Tradução de πίστις
  choice: fé
  alternative: confiança
  rationale: '''Fé'' é natural no contexto e mantém a amplitude teológica do termo sem reduzi-lo a uma interpretação particular.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva uma única oração relativa governando os dois predicados. 'Transtornando' retém a imagem de desestabilização sem impor a ideia de apostasia completa.
