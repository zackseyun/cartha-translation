id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: pt
  text: pelo qual sofro dificuldades[a], a ponto de estar acorrentado como um criminoso[b]. Mas a palavra de Deus não está acorrentada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no qual” ou “por causa do qual”; o grego provavelmente retoma o evangelho mencionado no versículo anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “como um malfeitor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: pelo qual
  rationale: O pronome relativo provavelmente retoma o evangelho mencionado no versículo anterior e, neste contexto, a preposição pode indicar causa ou esfera. “Pelo qual” expressa de modo natural que Paulo sofre por causa do evangelho, sem eliminar as outras possibilidades, registradas em nota.
- source_word: κακοπαθῶ
  choice: sofro dificuldades
  rationale: O verbo indica sofrer aflição ou passar por dificuldades. A forma presente comunica uma experiência contínua, e a expressão escolhida é clara e corrente.
- source_word: μέχρι δεσμῶν
  choice: a ponto de estar acorrentado
  rationale: μέχρι indica o grau ou limite alcançado pelo sofrimento, enquanto δεσμά evoca concretamente correntes e, por extensão, prisão. A formulação mantém a imagem e soa natural em português.
- source_word: ὡς κακοῦργος
  choice: como um criminoso
  rationale: κακοῦργος designa quem pratica o mal e, em contexto judicial e prisional, pode significar criminoso. A escolha comunica com clareza que Paulo é tratado como infrator.
- source_word: ἀλλὰ
  choice: Mas
  rationale: A conjunção introduz o forte contraste entre Paulo estar acorrentado e a palavra de Deus não estar.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: A tradução tradicional e ampla preserva a possibilidade de referência à mensagem proclamada, especialmente ao evangelho, sem restringi-la explicitamente às Escrituras ou a outra categoria.
- source_word: οὐ δέδεται
  choice: não está acorrentada
  rationale: O perfeito passivo descreve o estado de não estar presa. “Acorrentada” retoma deliberadamente a imagem das correntes de Paulo e preserva a força do contraste.
theological_decisions:
- issue: Natureza da “palavra de Deus”
  choice: a palavra de Deus
  alternative: a mensagem do evangelho; as Escrituras
  rationale: O contexto imediato favorece a mensagem do evangelho proclamado, mas a expressão grega é mais ampla. A tradução mantém essa amplitude e não resolve além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Estar acorrentado” preserva a imagem concreta e cria correspondência verbal com “não está acorrentada”, destacando o contraste retórico do original.
