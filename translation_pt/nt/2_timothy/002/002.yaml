  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: pt
  text: E o que você ouviu de mim na presença de muitas testemunhas[a], confie essas coisas a homens fiéis[b], que serão capazes de ensinar também outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «diante de muitas testemunhas». A expressão grega também pode significar «por meio de muitas testemunhas», embora seja mais provável que indique que o ensino foi dado publicamente, com muitas testemunhas presentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: «homens fiéis». A forma masculina pode ser usada de modo representativo; também seria possível traduzir «pessoas fiéis» ou «pessoas de confiança».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: o que
  rationale: O pronome relativo neutro plural retoma o conteúdo do ensino recebido; «o que» é natural em português e preserva o sentido coletivo.
- source_word: ἤκουσας
  choice: você ouviu
  rationale: O aoristo indica aqui a recepção anterior do ensino de Paulo; o pretérito perfeito simples é claro e idiomático.
- source_word: παρ’ ἐμοῦ
  choice: de mim
  rationale: Com ἀκούω, παρά com genitivo indica naturalmente a fonte daquilo que foi ouvido.
- source_word: διὰ πολλῶν μαρτύρων
  choice: na presença de muitas testemunhas
  rationale: διά com genitivo pode indicar mediação ou circunstância concomitante. Neste contexto, a leitura mais provável é que o ensino foi dado publicamente diante de muitas testemunhas; a nota preserva a ambiguidade genuína.
- source_word: ταῦτα
  choice: isso
  rationale: O demonstrativo retoma o conjunto do ensino mencionado. O singular coletivo «isso» evita a rigidez de «essas coisas» sem perder a referência.
- source_word: παράθου
  choice: confie
  rationale: O imperativo de παρατίθημι comunica a entrega de algo aos cuidados de alguém; «confie» expressa em português corrente a ideia de incumbência responsável.
- source_word: πιστοῖς
  choice: fiéis
  rationale: πιστός pode significar fiel, confiável ou digno de confiança. «Fiéis» preserva tanto a confiabilidade necessária à transmissão quanto a possível ressonância religiosa.
- source_word: ἀνθρώποις
  choice: homens
  rationale: Embora ἄνθρωπος possa ter uso genérico, a forma está no masculino plural. «Homens» preserva essa forma, enquanto a nota registra a possível abrangência representativa.
- source_word: οἵτινες
  choice: que
  rationale: O relativo qualitativo identifica o tipo de homens pretendido; em português, «que» transmite naturalmente a relação, e a qualificação vem do predicado seguinte.
- source_word: ἱκανοὶ
  choice: capazes
  rationale: ἱκανός denota aptidão ou suficiência. «Capazes» é natural, claro e não acrescenta a noção institucional que «qualificados» poderia sugerir.
- source_word: ἔσονται
  choice: serão
  rationale: Preserva o futuro do grego e aponta para a capacidade desses homens em cumprir a tarefa confiada.
- source_word: ἑτέρους
  choice: outros
  rationale: Tradução direta e idiomática do objeto plural, sem especificar além do texto.
theological_decisions:
- issue: Abrangência de πιστοῖς ἀνθρώποις
  choice: homens fiéis
  alternative: pessoas fiéis / pessoas de confiança
  rationale: A expressão grega está no masculino plural, embora ἄνθρωπος possa ser usado de modo representativo. O texto principal conserva a forma masculina, e a nota explicita a possível abrangência sem decidir silenciosamente a questão.
- issue: Relação expressa por διὰ πολλῶν μαρτύρων
  choice: na presença de muitas testemunhas
  alternative: por meio de muitas testemunhas / diante de muitas testemunhas
  rationale: A interpretação circunstancial se ajusta melhor ao contexto de ensino público, mas διά com genitivo também pode expressar mediação. A alternativa é mantida em nota para preservar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação «também serão capazes de ensinar a outros» segue a ordem e o alcance mais naturais do grego. Evitaram-se termos excessivamente técnicos como «competentes» e formulações rígidas como «essas coisas», sem apagar as ambiguidades relevantes.
