  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: pt
  text: Mas evite as conversas profanas e vazias[a], pois os que falam assim avançarão cada vez mais na impiedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os falatórios profanos e vazios”, “os falatórios ímpios” ou “fala oca e profana”.
    reason: Alternativas lexicais para βεβήλους κενοφωνίας que preservam, em diferentes formulações, as ideias de irreverência e falta de conteúdo.
lexical_decisions:
- source_word: βεβήλους
  choice: profanas
  rationale: Preserva o contraste com o que é sagrado e a força religiosa e moral do termo, sem reduzi-lo a algo meramente mundano.
- source_word: κενοφωνίας
  choice: conversas vazias
  rationale: Expressa de modo natural a ideia de fala oca, sem substância ou valor; o plural acompanha o grego.
- source_word: περιΐστασο
  choice: evite
  rationale: O imperativo médio exorta Timóteo a manter-se afastado desse tipo de fala; “evite” é claro, atual e direto.
- source_word: ἐπὶ πλεῖον
  choice: cada vez mais
  rationale: Comunica a progressão crescente indicada pela expressão, em ligação natural com “na impiedade”.
- source_word: προκόψουσιν
  choice: avançarão
  rationale: Mantém a metáfora de progresso, aqui usada ironicamente para um desenvolvimento moral negativo.
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Designa falta de reverência para com Deus e preserva o peso religioso e moral do original.
- source_word: δὲ
  choice: Mas
  rationale: Marca adequadamente o contraste com a exortação anterior.
theological_decisions:
- issue: Se a advertência trata apenas de fala inútil ou também de fala moral e religiosamente corrupta
  choice: “conversas profanas e vazias” preserva tanto a falta de conteúdo quanto o caráter irreverente da fala.
  alternative: “conversas ímpias”, “falatórios vãos” ou “fala oca”
  rationale: 'βεβήλους e κενοφωνίας apresentam dois aspectos complementares: irreverência e vazio. A progressão para ἀσέβεια confirma que não se trata apenas de conversa inútil.'
- issue: Referente implícito do plural προκόψουσιν
  choice: Explicitar como “os que se entregam a elas”.
  alternative: “elas levarão cada vez mais à impiedade” ou simplesmente “avançarão”
  rationale: O verbo está no plural e provavelmente tem como sujeito implícito as pessoas envolvidas nessas falas. A explicitação evita em português a impressão de que “conversas” sejam o sujeito, sem identificar um grupo mais específico do que o texto permite.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Conversas” é mais corrente que “falatórios”, enquanto “profanas” e “impiedade” preservam o peso religioso do texto. A construção explicita discretamente o sujeito humano implícito do verbo plural.
