id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: pt
  text: Você, portanto, meu filho, seja fortalecido[b] na graça que há no Messias[a] Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cristo Jesus”. O título grego Χριστός é traduzido aqui como “Messias” para preservar seu significado; muitas traduções usam a forma tradicional “Cristo”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seja forte”. A forma “seja fortalecido” reflete melhor o provável sentido de receber força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ
  choice: Você
  rationale: O pronome está explícito e tem força enfática ou contrastiva. “Você” preserva essa ênfase com leitura natural no português brasileiro contemporâneo.
- source_word: οὖν
  choice: portanto
  rationale: Mantém a conexão inferencial com o contexto anterior em registro claro e digno.
- source_word: τέκνον μου
  choice: meu filho
  rationale: Embora τέκνον signifique literalmente “criança” ou “filho”, aqui designa afetuosamente Timóteo como filho espiritual; “meu filho” é a expressão portuguesa natural nesse contexto.
- source_word: ἐνδυναμοῦ
  choice: seja fortalecido
  rationale: A forma imperativa média/passiva sugere força recebida, não apenas esforço autônomo. A formulação também conserva o aspecto de uma ação contínua sem tornar a frase artificial.
- source_word: ἐν τῇ χάριτι
  choice: na graça
  rationale: Preserva a amplitude de ἐν, que pode indicar a esfera em que ocorre o fortalecimento e, ao mesmo tempo, seu meio.
- source_word: χάριτι
  choice: graça
  rationale: É o equivalente português estabelecido para χάρις e comunica adequadamente o favor e a ação capacitadora de Deus no uso paulino.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: que há no Messias Jesus
  rationale: A oração relativa reproduz naturalmente em português a expressão atributiva grega e mantém a graça vinculada ou situada no Messias Jesus.
- source_word: Χριστῷ
  choice: Messias
  rationale: Traduz o sentido do título Χριστός, em vez de apenas transliterá-lo, preservando sua força titular.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa estabelecida do nome próprio grego.
theological_decisions:
- issue: Voz e agência em ἐνδυναμοῦ
  choice: seja fortalecido
  alternative: seja forte
  rationale: A leitura escolhida conserva a provável nuance receptiva da forma média/passiva e se harmoniza com o fortalecimento que ocorre “na graça”, sem afirmar mais precisamente quem realiza a ação do que o próprio texto.
- issue: Tradução de Χριστός
  choice: Messias Jesus
  alternative: Cristo Jesus
  rationale: “Messias” torna explícito o significado do título grego. A alternativa tradicional permanece registrada em nota por ser amplamente conhecida e idiomática.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” explicita a ênfase de Σὺ; “meu filho” comunica naturalmente a relação espiritual afetuosa. A ordem da frase permanece próxima do grego sem sacrificar a fluidez.
