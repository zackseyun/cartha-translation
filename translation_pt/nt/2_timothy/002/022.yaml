source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: pt
  text: Mas fuja dos desejos próprios da juventude[a] e busque a retidão[b], a fé[c], o amor e a paz, junto com os que invocam o Senhor de coração puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «paixões próprias da juventude». A expressão grega abrange desejos característicos da juventude e não se limita necessariamente ao desejo sexual.
    reason: lexical_alternative
  - marker: b
    text: Ou «justiça». O termo grego pode incluir tanto a integridade moral quanto a conduta justa nos relacionamentos.
    reason: alternative_reading
  - marker: c
    text: Ou «fidelidade». O termo grego pode significar fé, confiança ou fidelidade, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: desejos próprios da juventude
  rationale: A expressão abrange desejos característicos da juventude sem restringi-los ao âmbito sexual; a formulação é clara e natural em português.
- source_word: φεῦγε
  choice: fuja
  rationale: Preserva a força da imagem e o caráter contínuo da exortação, em contraste com «busque».
- source_word: δίωκε
  choice: busque
  rationale: Comunica empenho ativo e constante na procura dessas virtudes, com naturalidade no português contemporâneo.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: «Justiça» expressa de modo natural a retidão moral e relacional de δικαιοσύνη neste catálogo de virtudes; «retidão» permanece uma alternativa legítima.
- source_word: πίστιν
  choice: fé
  rationale: É a correspondência mais direta e tradicional de πίστις, sem excluir a possível nuance ética de fidelidade.
- source_word: ἀγάπην
  choice: amor
  rationale: Equivalente direto, natural e coerente com o uso neotestamentário de ἀγάπη.
- source_word: εἰρήνην
  choice: paz
  rationale: Equivalente direto e adequado no contexto de uma lista de virtudes.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: junto com os que invocam o Senhor
  rationale: Mantém a ideia de associação expressa por μετά e apresenta a busca das virtudes como vivida em comunhão com outros.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: de coração puro
  rationale: Expressão idiomática que conserva a ideia de origem interior e sinceridade indicada por ἐκ.
theological_decisions:
- issue: Alcance de «νεωτερικὰς ἐπιθυμίας»
  choice: Desejos característicos da juventude em sentido amplo
  alternative: Paixões predominantemente sexuais
  rationale: O grego não limita a expressão ao desejo sexual; o contexto de caráter e conduta favorece uma referência ética mais ampla.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O termo pode envolver tanto integridade moral quanto relações justas. A alternativa é registrada para preservar essa amplitude sem sobrecarregar o texto principal.
- issue: Sentido de πίστις na lista de virtudes
  choice: fé
  alternative: fidelidade
  rationale: «Fé» preserva a correspondência lexical usual, enquanto «fidelidade» é uma nuance ética plausível neste contexto e por isso aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos «fuja» e «busque» conservam o contraste retórico do grego. A ordem das notas segue a ocorrência dos termos no texto.
