id: 2TI.2.15
reference: 2 Timothy 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: pt
  text: Empenhe-se para se apresentar aprovado diante de Deus, como trabalhador que não tem de que se envergonhar e que maneja corretamente a palavra da verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ensina corretamente”; mais literalmente, “corta em linha reta” a palavra da verdade.
    reason: Alternativa lexical para o verbo raro ὀρθοτομέω, preservando a imagem literal e uma interpretação contextual possível.
lexical_decisions:
- source_word: σπούδασον
  choice: Empenhe-se
  rationale: O imperativo comunica esforço sério e intencional. “Empenhe-se” é natural em português moderno e tem mais força que “faça o seu melhor”.
- source_word: σεαυτὸν ... παραστῆσαι
  choice: para se apresentar
  rationale: Preserva o pronome reflexivo e a construção de propósito ligada ao imperativo.
- source_word: δόκιμον
  choice: aprovado
  rationale: Expressa alguém que, tendo sido posto à prova, é considerado digno de aprovação; o contexto destaca a avaliação diante de Deus.
- source_word: τῷ θεῷ
  choice: diante de Deus
  rationale: Embora o dativo possa ser vertido formalmente como “a Deus”, “diante de Deus” comunica com naturalidade a ideia de apresentar-se perante ele para aprovação, sem mudar o referente.
- source_word: ἐργάτην
  choice: como trabalhador
  rationale: Mantém a metáfora ocupacional em linguagem atual e inclusiva no uso comum.
- source_word: ἀνεπαίσχυντον
  choice: que não tem de que se envergonhar
  rationale: Comunica não apenas ausência subjetiva de vergonha, mas ausência de motivo legítimo para passar vergonha.
- source_word: ὀρθοτομοῦντα
  choice: que maneja corretamente
  rationale: A expressão abrange o tratamento fiel e exato da mensagem sem restringir o sentido apenas ao ensino; a imagem literal do verbo raro é preservada em nota.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: a palavra da verdade
  rationale: Preserva a construção genitiva e a ressonância paulina, permanecendo compreensível em português contemporâneo.
theological_decisions:
- issue: Sentido de ὀρθοτομοῦντα no contexto do ministério
  choice: maneja corretamente a palavra da verdade
  alternative: ensina corretamente a palavra da verdade; literalmente, corta em linha reta a palavra da verdade
  rationale: O particípio provavelmente descreve o tratamento correto e fiel da mensagem, sem especificar exclusivamente o ato de ensinar. A tradução principal mantém essa amplitude, e a nota conserva tanto a interpretação pedagógica quanto a imagem literal incomum.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A colocação “Empenhe-se” evita uma formulação coloquial ou enfraquecida; “maneja corretamente” conserva a amplitude e a tensão interpretativa do grego.
