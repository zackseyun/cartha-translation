base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: pt
  text: e a fala deles se espalhará como uma gangrena.[a] Entre eles estão Himeneu e Fileto,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra deles” ou “a mensagem deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “terá pastagem”; o sentido é que se espalhará destrutivamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: conversa
  rationale: No contexto da fala irreverente e do falso ensino (vv. 16, 18), refere-se ao que eles dizem e difundem. “Conversa” é natural e conserva o caráter discursivo, sem restringir o termo a uma única palavra.
- source_word: αὐτῶν
  choice: deles
  rationale: Genitivo possessivo que modifica λόγος.
- source_word: ὡς γάγγραινα
  choice: como gangrena
  rationale: Equivalente direto da imagem médica de uma doença destrutiva que avança pelo tecido.
- source_word: νομὴν ἕξει
  choice: se espalhará
  rationale: A expressão idiomática, literalmente relacionada a “ter curso” ou “encontrar pastagem”, indica aqui o avanço destrutivo da gangrena; “se espalhará” comunica seu sentido contextual com clareza.
- source_word: ὧν ἐστιν
  choice: Entre eles estão
  rationale: Expressa naturalmente o valor partitivo da construção relativa, apresentando integrantes do grupo mencionado.
- source_word: Ὑμέναιος
  choice: Himeneu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Φίλητος
  choice: Fileto
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Força metafórica da imagem da doença
  choice: O ensino corruptor é apresentado como algo que se espalha destrutivamente.
  alternative: Manter a expressão mais literal “terá curso”, sem explicitar na tradução o avanço indicado pela metáfora.
  rationale: “Se espalhará” preserva a advertência teológica e a imagem da gangrena sem acrescentar uma interpretação doutrinária além do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora médica foi preservada; a locução idiomática foi vertida pelo seu sentido contextual.
