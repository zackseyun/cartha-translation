  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: pt
  text: Todo aquele que permanece nele não peca[a]; todo aquele que peca não o viu nem o conheceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As formas gregas no presente também podem descrever ação contínua ou característica; nesse caso: “não continua pecando... aquele que continua pecando”.'
    reason: Registra uma alternativa aspectual relevante sem resolver no texto principal a ambiguidade genuína das formas verbais.
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Todo aquele que
  rationale: A construção articular tem sentido genérico e universal. “Todo aquele que” é natural em português e preserva essa abrangência.
- source_word: ἐν αὐτῷ μένων
  choice: permanece nele
  rationale: “Permanecer” conserva o importante vocabulário joanino de continuidade relacional, enquanto “nele” mantém sem explicação adicional a linguagem do texto grego.
- source_word: οὐχ ἁμαρτάνει
  choice: não peca
  rationale: A forma no presente é traduzida diretamente. Em português, o presente também pode expressar conduta habitual ou característica; a nota registra essa possibilidade sem inseri-la de modo exclusivo no texto.
- source_word: ὁ ἁμαρτάνων
  choice: aquele que peca
  rationale: Mantém o paralelismo com “não peca” e permite tanto a formulação direta quanto a leitura de ação contínua ou característica indicada pelo contexto e pelo aspecto verbal.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: não o viu
  rationale: O perfeito grego descreve uma condição presente decorrente de não tê-lo visto. A formulação portuguesa é concisa e idiomática, sem acrescentar “jamais”, que não está expresso lexicalmente.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: nem o conheceu
  rationale: “Conhecer” preserva a possível dimensão relacional de γινώσκω, e “nem” reproduz a ligação negativa de οὐδέ com a oração anterior.
- source_word: αὐτῷ / αὐτόν
  choice: nele / o
  rationale: Os pronomes são mantidos sem identificar explicitamente o referente como Deus, o Filho ou Cristo, preservando a forma e a ambiguidade contextual do original.
theological_decisions:
- issue: Se o versículo ensina impecabilidade absoluta dos que permanecem nele
  choice: Manter no texto a formulação direta “não peca... aquele que peca”, com nota sobre o possível sentido contínuo ou característico do presente grego.
  alternative: Traduzir interpretativamente como “não continua pecando... continua pecando”.
  rationale: A opção conserva a força categórica e a tensão ética do grego, sem impor uma leitura de perfeição sem pecado nem resolver no corpo do texto a relação com 1 João 1:8–2:2. A nota informa a relevante possibilidade aspectual.
- issue: Referente de “nele/o”
  choice: Preservar os pronomes sem explicitar o referente.
  alternative: Substituí-los por “Deus”, “o Filho” ou “Cristo”.
  rationale: O versículo emprega pronomes, e o contexto joanino envolve linguagem sobre o Pai e o Filho. Explicitar um referente iria além da formulação desta frase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação mantém o paralelismo conciso do grego e evita vocabulário denominacional ou explicações teológicas dentro do versículo.
