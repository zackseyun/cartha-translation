  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: pt
  text: E tudo o que pedimos recebemos dele, porque guardamos os seus mandamentos e fazemos o que é agradável diante dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos olhos dele”.'
    reason: Alternativa lexical para ἐνώπιον αὐτοῦ, que pode ser traduzido tanto por “diante dele” como por “aos olhos dele”.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: tudo o que
  rationale: A construção relativa indefinida significa “qualquer coisa que” ou “tudo o que”; esta última forma é natural e clara em português.
- source_word: αἰτῶμεν
  choice: pedimos
  rationale: αἰτέω denota pedir ou solicitar, especialmente em contexto de oração; “pedimos” é a opção corrente.
- source_word: λαμβάνομεν
  choice: recebemos
  rationale: O presente expressa aqui uma realidade geral; “recebemos” reproduz o sentido sem acrescentar aspecto progressivo.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: ἀπό com genitivo indica a fonte. “Dele” é conciso, natural e mantém a referência pronominal.
- source_word: ὅτι
  choice: porque
  rationale: A conjunção introduz a razão declarada para receber o que se pede, e seu valor causal deve ser preservado.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: os seus mandamentos
  rationale: “Mandamentos” preserva o vocabulário ético e teológico característico dos escritos joaninos.
- source_word: τηροῦμεν
  choice: guardamos
  rationale: τηρέω pode significar guardar, observar ou cumprir. “Guardamos” conserva a imagem lexical e o uso bíblico joanino, sem reduzir o termo apenas a obediência exterior.
- source_word: τὰ ἀρεστὰ
  choice: o que é agradável
  rationale: O adjetivo neutro plural substantivado designa aquilo que agrada; a formulação portuguesa é natural e mantém a amplitude ética.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: ἐνώπιον significa literalmente “diante de” e também pode denotar “aos olhos de”. “Diante dele” é dignificado, transparente e natural em português.
- source_word: ποιοῦμεν
  choice: fazemos
  rationale: ποιέω é o verbo comum para fazer; esta tradução evita acrescentar a ideia mais específica de prática habitual.
theological_decisions:
- issue: Relação entre a oração atendida e a obediência
  choice: 'Manter a relação causal explícita: recebemos dele porque guardamos seus mandamentos e fazemos o que lhe é agradável.'
  alternative: Atenuar a frase como mera associação entre oração e obediência, ou expandi-la como uma fórmula mecânica de oração atendida.
  rationale: O grego emprega ὅτι com valor causal. A tradução preserva a tensão teológica da afirmação sem enfraquecê-la nem explicar além do texto.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A construção “tudo o que pedimos” é idiomática; “guardamos os seus mandamentos” mantém a continuidade do vocabulário joanino. O marcador foi colocado após a expressão a que a nota se refere.
