source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: pt
  text: Filhinhos, que ninguém os engane.[a] Quem pratica a justiça[c] é justo, assim como aquele[b] é justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ninguém os desencaminhe”.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “aquele”; provavelmente uma referência a Cristo, embora alguns entendam que se refere a Deus.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “retidão”; aqui, o sentido é a conduta correta coerente com ser justo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Filhinhos
  rationale: O diminutivo vocativo expressa a relação familiar e o afeto do autor; “Filhinhos” preserva esses dois aspectos de modo natural no português bíblico atual.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: que ninguém os engane
  rationale: A construção expressa uma proibição. “Engane” comunica com clareza a ideia de induzir ao erro, enquanto “desencaminhe” continua sendo uma alternativa legítima.
- source_word: ὁ ποιῶν
  choice: Quem pratica
  rationale: O particípio presente substantivado sugere conduta característica ou contínua, não apenas um ato isolado; “pratica” torna esse aspecto perceptível em português.
- source_word: τὴν δικαιοσύνην
  choice: a justiça
  rationale: “Justiça” é o equivalente português natural de δικαιοσύνη e mantém a relação lexical com “justo”; neste contexto, designa uma conduta moralmente reta.
- source_word: δίκαιός ἐστιν
  choice: é justo
  rationale: A expressão descreve a pessoa como justa e preserva a ligação verbal com “justiça” no mesmo enunciado.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz de maneira clara e idiomática o padrão de comparação.
- source_word: ἐκεῖνος
  choice: aquele
  rationale: Mantém o demonstrativo grego e evita substituir no texto principal o referente por “Cristo” ou “Deus”, preservando a abertura presente na formulação.
theological_decisions:
- issue: Referente de ἐκεῖνος
  choice: Manter “aquele” no texto principal; o referente mais provável é Cristo.
  alternative: Entender o referente como Deus, o Pai, ou como uma referência divina reverente deliberadamente aberta.
  rationale: O uso joanino e o contexto de imitação ética favorecem Cristo, mas o demonstrativo não nomeia explicitamente o referente. A tradução, portanto, conserva a tensão sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Filhinhos” conserva o tom pastoral e afetuoso; “que ninguém os engane” evita arcaísmo excessivo; “aquele” preserva a ambiguidade referencial do original.
