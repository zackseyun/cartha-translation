  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: pt
  text: Amados, se o nosso coração não nos condena, temos confiança diante de Deus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva a ligação lexical com o tema do amor em 1 João e mantém um tom digno e natural.
- source_word: ἐὰν
  choice: se
  rationale: Introduz uma oração condicional com o subjuntivo; “se” é a correspondência portuguesa direta e idiomática.
- source_word: ἡ καρδία
  choice: o nosso coração
  rationale: Preserva a metáfora do original para o ser interior e sua avaliação moral, sem reduzi-la no texto principal ao conceito mais específico de consciência.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: não nos condena
  rationale: Expressa o sentido de pronunciar-se contra, censurar ou condenar, conservando a nuance moral e quase judicial presente no contexto.
- source_word: παρρησίαν
  choice: confiança
  rationale: Neste contexto, comunica franqueza, segurança e liberdade na relação com Deus sem sugerir insolência.
- source_word: πρὸς τὸν θεόν
  choice: diante de Deus
  rationale: Expressa de modo idiomático a posição relacional perante Deus indicada por πρός com o acusativo neste contexto.
theological_decisions:
- issue: A faculdade interior designada por καρδία
  choice: coração
  alternative: consciência
  rationale: “Coração” conserva a linguagem joanina e a amplitude da metáfora; “consciência” explicitaria uma função contextual, mas estreitaria o campo semântico.
- issue: A nuance de παρρησία na relação com Deus
  choice: confiança diante de Deus
  alternative: ousadia perante Deus; plena segurança diante de Deus
  rationale: “Confiança” mantém a ideia de acesso franco e sem vergonha à presença de Deus, sem exagerar a certeza subjetiva nem enfraquecer a reverência.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Amados” mantém o tom pastoral e elevado; a ordem da frase segue de perto o grego sem soar artificial. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto seguinte.
