id: 1JN.3.14
reference: 1 John 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: pt
  text: Sabemos que passamos da morte para a vida, porque amamos os irmãos.[a] Quem não ama permanece na morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irmãos e as irmãs”; o grego diz “os irmãos” e, neste contexto, provavelmente se refere em geral aos demais crentes.
    reason: alternativa lexical
lexical_decisions:
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Embora tenha forma de perfeito, οἶδα funciona como verbo estativo no presente no grego koiné; “sabemos” é o equivalente natural em português.
- source_word: μεταβεβήκαμεν
  choice: passamos
  rationale: O perfeito indica uma transição concluída cujo resultado permanece. O pretérito perfeito português, em combinação com o contexto, expressa naturalmente a passagem realizada e a condição presente.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: da morte para a vida
  rationale: A construção ἐκ...εἰς descreve movimento para fora de uma esfera e em direção a outra. “Da morte para a vida” preserva o contraste e soa natural em português.
- source_word: ἀγαπῶμεν
  choice: amamos
  rationale: O presente indica uma atitude ou prática característica e contínua; “amamos” é claro e preserva o vocabulário do amor.
- source_word: τοὺς ἀδελφούς
  choice: os irmãos
  rationale: Mantém a forma masculina plural do grego. No contexto, provavelmente designa de modo coletivo os demais crentes, inclusive mulheres; isso é esclarecido em nota.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Quem não ama
  rationale: O particípio presente substantivado descreve genericamente a pessoa caracterizada pela ausência de amor. “Quem não ama” é idiomático, conciso e mantém a força geral.
- source_word: μένει
  choice: permanece
  rationale: Preserva a ideia de estado continuado e a recorrência joanina de μένω, sem recorrer ao menos corrente “habita” ou “permanece habitando”.
- source_word: ἐν τῷ θανάτῳ
  choice: na morte
  rationale: Mantém a metáfora compacta de existência na esfera da morte, sem acrescentar uma interpretação explicativa.
theological_decisions:
- issue: Referente e força de gênero de ἀδελφοί
  choice: “os irmãos” no texto principal, com nota indicando o provável sentido inclusivo
  alternative: “os irmãos e as irmãs”
  rationale: O grego apresenta um plural gramaticalmente masculino, mas o uso comunitário provavelmente abrange os demais crentes de ambos os sexos. A tradução conserva a forma da fonte e registra a abrangência contextual na nota.
- issue: Natureza de “morte” e “vida”
  choice: Manter “morte” e “vida” sem expansão interpretativa
  alternative: “morte espiritual” e “vida eterna”, ou “domínio da morte” e “domínio da vida”
  rationale: A linguagem descreve uma transição teológica profunda, mas o versículo a formula por meio de termos metafóricos compactos. Expandi-los resolveria uma especificidade que o texto não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos e preserva a concisão e a tensão metafórica do original.
