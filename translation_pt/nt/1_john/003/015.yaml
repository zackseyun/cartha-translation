id: 1JN.3.15
reference: 1 John 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: pt
  text: Todo aquele que odeia seu irmão[a] é homicida, e vocês sabem que nenhum homicida tem a vida eterna permanecendo nele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “irmão” provavelmente se refere a outro membro da comunidade de fé; o grego está no masculino singular.
    reason: cultural_note
  - marker: b
    text: 'Ou: “habitando nele”. O verbo grego μένω é um termo importante nos escritos de João e pode significar “permanecer”, “continuar” ou “habitar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Todo aquele que odeia
  rationale: O particípio presente substantivado descreve uma classe geral e pode sugerir uma atitude característica ou contínua; esta formulação preserva isso em português natural.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Mantém o masculino singular do grego e deixa que o contexto determine seu alcance comunitário, sem substituí-lo por uma paráfrase interpretativa.
- source_word: ἀνθρωποκτόνος
  choice: homicida
  rationale: Equivalente português corrente para quem mata uma pessoa, preservando a forte identificação moral feita pelo autor.
- source_word: οἴδατε
  choice: vocês sabem
  rationale: Explicita naturalmente a segunda pessoa do plural em português de ampla legibilidade, sobretudo no uso brasileiro.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: nenhum homicida tem
  rationale: A negação de toda a classe é expressa de modo idiomático e inequívoco em português, sem alterar o sentido do grego.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: Expressão consagrada e clara na literatura joanina, que preserva tanto a duração quanto a dimensão teológica dessa vida.
- source_word: ἐν αὐτῷ μένουσαν
  choice: permanecendo nele
  rationale: Mantém a construção participial e o sentido durativo de μένω, termo recorrente em João, sem recorrer a linguagem excessivamente tradicional.
theological_decisions:
- issue: Alcance de ἀδελφός
  choice: Manter “seu irmão” no texto principal.
  alternative: “seu irmão ou sua irmã” ou “outro crente”
  rationale: O contexto provavelmente aponta para um membro da comunidade de fé, mas o grego traz o masculino singular. A tradução preserva a forma e registra o provável alcance contextual em nota.
- issue: Relação entre ódio e homicídio
  choice: Traduzir diretamente “é homicida”.
  alternative: “é como um homicida”
  rationale: O texto grego faz uma afirmação direta, não uma comparação explícita; acrescentar “como” atenuaria a tensão moral e teológica do enunciado.
- issue: Valor joanino de μένω
  choice: Usar “permanecendo nele”.
  alternative: “habitando nele”
  rationale: “Permanecer” conserva a ideia de continuidade característica do vocabulário joanino. A alternativa é possível, mas pode enfatizar morada mais do que continuidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural do verbo grego; “homicida” preserva a força moral do original sem coloquialismo. A sintaxe final mantém deliberadamente a relação de “permanecendo nele” com “vida eterna”.
