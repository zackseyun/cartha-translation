  source_fidelity: 'O texto reproduz com fidelidade os elementos do grego: «Por meio disso» mantém o valor demonstrativo-instrumental de ἐν τούτῳ; «saberemos» corresponde ao futuro γνωσόμεθα; «somos da verdade» preserva, sem explicação doutrinária indevida, a relação expressa por ἐκ τῆς ἀληθείας; e «diante dele» traduz adequadamente ἔμπροσθεν αὐτοῦ. «Tranquilizaremos o nosso coração» representa de modo contextual e legítimo πείσομεν τὴν καρδίαν ἡμῶν, cujo uso neste contexto trata da segurança interior diante de Deus. O singular «coração» acompanha o grego e é natural como singular coletivo em português.'
