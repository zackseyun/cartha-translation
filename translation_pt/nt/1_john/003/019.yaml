  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: pt
  text: Por meio disso saberemos que somos da verdade[a] e, diante dele, tranquilizaremos o nosso coração[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “procedemos da verdade” ou “pertencemos à verdade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “convenceremos o nosso coração” ou “daremos segurança ao nosso coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Por meio disso
  rationale: Expressa de modo natural o valor instrumental da locução e conserva sua força demonstrativa, sem definir aqui se ela aponta para o que precede ou para o que segue.
- source_word: γνωσόμεθα
  choice: saberemos
  rationale: Reproduz diretamente o futuro de γινώσκω, sem acrescentar necessariamente a nuance ingressiva de 'chegaremos a saber'.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: somos da verdade
  rationale: A construção portuguesa conserva de forma concisa a relação indicada por ἐκ, que pode envolver origem, procedência ou pertença, sem resolvê-la em paráfrase doutrinária.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: diante dele
  rationale: Equivalente corrente e digno para a ideia espacial e relacional de estar perante ele ou em sua presença.
- source_word: πείσομεν
  choice: tranquilizaremos
  rationale: Com 'coração' como objeto e no contexto imediato de segurança diante de Deus, πείθω pode indicar aquietar ou dar segurança interior. A nota preserva a tradução lexicalmente mais direta, 'convenceremos'.
- source_word: τὴν καρδίαν ἡμῶν
  choice: o nosso coração
  rationale: Mantém o singular coletivo do grego, natural em português e adequado ao uso bíblico de 'coração' como centro da vida interior.
theological_decisions:
- issue: Sentido de ἐκ τῆς ἀληθείας na teologia joanina
  choice: somos da verdade
  alternative: pertencemos à verdade; procedemos da verdade
  rationale: A formulação retém a categoria joanina de 'verdade' e a abertura semântica de ἐκ, sem ampliá-la para uma afirmação explícita sobre pertencer a Deus.
- issue: Sentido de πείσομεν com 'coração'
  choice: tranquilizaremos o nosso coração
  alternative: convenceremos o nosso coração
  rationale: O contexto favorece a ideia de aquietar interiormente o coração diante de Deus, mas a nota mantém visível a possibilidade formal de 'convencer', evitando ocultar a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no v. 20. O singular coletivo 'o nosso coração' segue de perto o grego e soa natural em português.
