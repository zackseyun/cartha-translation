  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: pt
  text: 'Pois esta é a mensagem que vocês ouviram desde o princípio: que amemos uns aos outros.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que amemos uns aos outros” ou “amemos uns aos outros”.'
    reason: Preserva as possíveis nuances final e exortativa de ἵνα com o subjuntivo.
lexical_decisions:
- source_word: Ὅτι
  choice: Pois
  rationale: Introduz uma explicação do contexto anterior; “Pois” conserva essa ligação explicativa de modo natural e digno.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: esta é a mensagem
  rationale: Reproduz diretamente o demonstrativo, a cópula e o substantivo; “mensagem” é corrente e adequado ao uso joanino.
- source_word: ἣν ἠκούσατε
  choice: que vocês ouviram
  rationale: O aoristo indica a recepção passada da mensagem. Em português, o pretérito perfeito simples é natural, sem necessidade de explicitar um aspecto resultativo.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Expressão tradicional e inteligível que preserva a ressonância característica dos escritos joaninos.
- source_word: ἵνα ἀγαπῶμεν
  choice: que amemos
  rationale: O subjuntivo presente comunica aqui o conteúdo com força ética e exortativa, sem obrigar a interpretação exclusivamente final de ἵνα.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: É a expressão recíproca mais natural no português contemporâneo e mantém a dimensão comunitária.
theological_decisions:
- issue: Força de ἵνα ἀγαπῶμεν ἀλλήλους
  choice: “que amemos uns aos outros”, como conteúdo da mensagem com força exortativa
  alternative: “para que amemos uns aos outros” ou “amemos uns aos outros”
  rationale: No contexto, a oração apresenta sobretudo o teor ético da mensagem recebida desde o princípio. A formulação escolhida preserva o subjuntivo e a obrigação moral sem excluir totalmente a nuance de finalidade que ἵνα pode carregar; essa possibilidade é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” oferece clareza contemporânea; “desde o princípio” mantém o registro bíblico digno sem soar arcaico.
