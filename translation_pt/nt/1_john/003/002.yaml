id: 1JN.3.2
reference: 1 John 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: pt
  text: Amados, agora somos filhos de Deus, e ainda não foi manifestado o que seremos. Sabemos que, se ele for manifestado[a][b], seremos semelhantes a ele, porque o veremos tal como ele é.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se isso for manifestado”, referindo-se ao que seremos; o sujeito grego está implícito. O contexto favorece “ele”, referindo-se a Cristo.'
    reason: alternative_reading
  - marker: b
    text: Muitas traduções trazem “quando ele se manifestar”. Mais literalmente, o grego diz “se ele for manifestado” e emprega o mesmo verbo usado anteriormente no versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva a ligação lexical com o amor e mantém um tom digno e natural.
- source_word: νῦν
  choice: agora
  rationale: Marca a condição presente dos fiéis em contraste com aquilo que ainda será revelado.
- source_word: τέκνα θεοῦ
  choice: filhos de Deus
  rationale: Expressa relação filial sem sugerir idade; em português, o plural não marcado inclui os filhos e as filhas de Deus.
- source_word: οὔπω ἐφανερώθη
  choice: ainda não foi manifestado
  rationale: Preserva a voz passiva e o sentido de tornar visível ou manifesto, além da repetição lexical com φανερωθῇ.
- source_word: τί ἐσόμεθα
  choice: o que seremos
  rationale: Reproduz diretamente a referência à futura condição ou natureza dos fiéis.
- source_word: οἴδαμεν
  choice: Sabemos
  rationale: Tradução direta do perfeito grego com sentido presente.
- source_word: ἐὰν φανερωθῇ
  choice: se ele for manifestado
  rationale: Mantém a construção condicional, a voz passiva e a ligação verbal com a oração anterior, deixando a ambiguidade do sujeito registrada em nota.
- source_word: ὅμοιοι αὐτῷ
  choice: semelhantes a ele
  rationale: Comunica semelhança real, não identidade, com clareza e dignidade.
- source_word: ὀψόμεθα αὐτὸν
  choice: o veremos
  rationale: Forma futura natural em português que conserva Cristo como objeto direto da visão.
- source_word: καθώς ἐστιν
  choice: tal como ele é
  rationale: Expressa a comparação de modo e enfatiza vê-lo em sua realidade, sem acrescentar interpretação.
theological_decisions:
- issue: Referente do sujeito implícito em ἐὰν φανερωθῇ
  choice: 'O texto principal entende o sujeito como Cristo: “se ele for manifestado”.'
  alternative: “se isso for manifestado”, referindo-se ao que seremos; ou, de modo mais interpretativo, “quando ele se manifestar”.
  rationale: O contexto imediato — ser semelhantes a ele e vê-lo como ele é — favorece Cristo como referente. A nota preserva a ambiguidade gramatical genuína, e a redação principal conserva a voz passiva e a condição expressa no grego.
- issue: Natureza da futura semelhança dos fiéis
  choice: “seremos semelhantes a ele” afirma verdadeira semelhança com Cristo sem sugerir identidade.
  alternative: Paráfrases mais fortes, como “seremos como ele é”.
  rationale: ὅμοιοι indica semelhança, não igualdade ou identidade de essência; a tradução mantém a força da promessa sem ultrapassar o texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Amados” mantém o calor pastoral; “foi manifestado/for manifestado” preserva a repetição do verbo grego e sua voz passiva. As duas notas aparecem junto à expressão a que de fato se referem.
