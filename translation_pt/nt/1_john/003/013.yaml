source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: pt
  text: Não se surpreendam, irmãos[a], se o mundo odeia vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” traduz a forma masculina plural e, aqui, provavelmente se dirige a toda a comunidade de fiéis, incluindo as mulheres.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Não se surpreendam
  rationale: O imperativo presente com μή expressa proibição. “Não se surpreendam” comunica naturalmente o sentido contextual de θαυμάζω, sem o tom mais literário de “não se admirem”.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo masculino plural é preservado por “irmãos”, forma corrente de tratamento comunitário que, neste contexto, provavelmente abrange homens e mulheres; essa abrangência é explicitada em nota.
- source_word: εἰ
  choice: se
  rationale: Mantém o valor condicional da partícula grega sem convertê-la interpretativamente em “quando” ou “porque”.
- source_word: μισεῖ
  choice: odeia
  rationale: O presente do indicativo descreve uma realidade geral ou contínua; o presente simples em português é natural e fiel.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Preserva a amplitude da expressão joanina, que no contexto pode designar a humanidade em oposição a Deus, sem inserir essa explicação diretamente no texto.
theological_decisions:
- issue: Forma masculina representativa em ἀδελφοί
  choice: Manter “irmãos” no texto principal, com nota explicativa
  alternative: “irmãos e irmãs” ou “comunidade”
  rationale: “Irmãos” corresponde à forma masculina plural do grego e também pode funcionar em português como tratamento coletivo. A nota esclarece a provável inclusão das mulheres sem ampliar silenciosamente a forma do texto-fonte.
- issue: Sentido joanino de κόσμος
  choice: Traduzir por “o mundo” sem expansão interpretativa
  alternative: “a sociedade contrária a Deus” ou “o sistema do mundo”
  rationale: A expressão possui densidade teológica em 1 João, mas “o mundo” conserva sua amplitude e permite que o contexto indique sua oposição a Deus.
- issue: Força condicional de εἰ
  choice: Preservar “se”
  alternative: “quando”
  rationale: Embora a hostilidade do mundo seja apresentada como uma realidade plausível e esperada, a forma condicional do original deve permanecer sem ser transformada numa afirmação temporal mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega-se “vocês” para reproduzir naturalmente o plural ὑμᾶς e evita-se tanto linguagem arcaica quanto paráfrase teológica.
