source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: pt
  text: Não sejamos como Caim[a], que procedia do Maligno e assassinou[b] seu irmão. E por que o assassinou? Porque suas obras eram más, mas as de seu irmão eram justas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do mal”. A expressão grega também pode ser entendida de modo abstrato, embora no uso de João costume designar o Maligno como pessoa.'
    reason: alternative_reading
  - marker: b
    text: O verbo grego é particularmente vívido e pode ter o sentido de “abater” ou “matar violentamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Não sejamos como Caim
  rationale: A expressão depende da exortação do versículo anterior. A inclusão de “sejamos” torna essa relação natural em português sem alterar a força da comparação negativa.
- source_word: ἐκ τοῦ πονηροῦ
  choice: era do Maligno
  rationale: Em 1 João, a expressão articulada costuma designar pessoalmente o Maligno. “Era do” conserva de modo idiomático a ideia de origem ou pertencimento expressa por ἐκ.
- source_word: ἔσφαξεν
  choice: assassinou
  rationale: O verbo descreve uma morte violenta e intencional. “Assassinou” é mais forte que “matou” e soa natural em português; uma nota preserva a imagem ainda mais vívida do grego.
- source_word: χάριν τίνος
  choice: por que
  rationale: Equivalente causal interrogativo claro e idiomático em português moderno.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: suas obras eram más
  rationale: “Obras” mantém a terminologia ética joanina e o adjetivo “más” expressa a qualidade moral sem confundi-la com a referência pessoal ao Maligno.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: mas as de seu irmão eram justas
  rationale: O pronome “as” conserva naturalmente a elipse de “obras” no segundo membro, e “justas” mantém o contraste ético com “más”.
theological_decisions:
- issue: Se τοῦ πονηροῦ designa uma pessoa (“o Maligno”) ou o mal em sentido abstrato
  choice: 'Leitura pessoal: “do Maligno”'
  alternative: 'Leitura abstrata: “do mal”'
  rationale: O uso joanino do adjetivo com artigo frequentemente aponta para o agente pessoal do mal. A alternativa semanticamente possível é preservada em nota, evitando ocultar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Maligno” recebe inicial maiúscula para sinalizar a leitura pessoal, enquanto a alternativa abstrata é mantida em nota. A repetição de “assassinou” reproduz a repetição enfática do verbo grego.
