source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: pt
  text: E todo aquele que tem esta esperança nele[a] purifica a si mesmo, assim como ele[b] é puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tem esta esperança posta nele». A expressão grega pode indicar a pessoa em quem a esperança é colocada ou sobre quem ela repousa.'
    reason: lexical_alternative
  - marker: b
    text: «Ele» provavelmente se refere ao Filho, isto é, a Cristo, no contexto; o grego, porém, deixa o referente na forma de pronome.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: todo aquele que deposita
  rationale: A construção com particípio articulado tem sentido genérico. Em ligação com ἐπ’ αὐτῷ, «deposita» expressa em português corrente que a esperança é posta em alguém, sem reduzir ἐλπίς a mero desejo.
- source_word: τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ
  choice: deposita nele esta esperança
  rationale: 'A formulação mantém «esta esperança», que retoma o contexto anterior, e torna clara a relação expressa por ἐπί com dativo: a esperança repousa nele. A alternativa «tem esta esperança nele» também é possível e fica registrada em nota.'
- source_word: ἁγνίζει ἑαυτὸν
  choice: purifica a si mesmo
  rationale: «Purifica» conserva a ligação lexical com ἁγνός («puro»). «A si mesmo» reflete o reflexivo masculino singular da construção grega e evita a leitura de que a pessoa purifica outra.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz de modo natural e claro a comparação presente no grego.
- source_word: ἐκεῖνος
  choice: ele
  rationale: Embora ἐκεῖνος tenha força demonstrativa, «aquele» soaria excessivamente deítico e pouco natural neste contexto em português. «Ele» mantém o referente pronominal sem inserir «Cristo» ou «o Filho» no texto.
- source_word: ἁγνός
  choice: puro
  rationale: É o equivalente adequado no contexto ético e preserva a relação verbal entre «purifica» e «puro».
theological_decisions:
- issue: Referente de αὐτῷ e ἐκεῖνος
  choice: 'Manter os referentes como pronomes: «nele» e «ele».'
  alternative: Explicitar «Cristo» ou «o Filho»; ou entender αὐτῷ como referência a Deus Pai.
  rationale: O contexto imediato favorece a referência a Cristo/o Filho, mas o grego não nomeia expressamente o referente. A tradução conserva essa margem de ambiguidade em vez de resolvê-la no corpo do texto.
- issue: Masculino genérico em ἑαυτὸν
  choice: «a si mesmo»
  alternative: «a si própria» ou uma reformulação plural neutra
  rationale: A forma masculina singular concorda com a construção representativa «todo aquele». O alcance universal permanece claro por meio de «todo».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem «deposita nele esta esperança» soa natural e explicita a direção da esperança sem acrescentar um referente nominal. A repetição «purifica/puro» preserva o vínculo lexical do original.
