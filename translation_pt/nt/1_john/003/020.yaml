id: 1JN.3.20
reference: 1 John 3:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: pt
  text: pois, se o nosso coração nos condena[a], Deus é maior do que o nosso coração[b] e conhece todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos censura”, “nos acusa” ou “acha culpa em nós”.
    reason: lexical_alternative
  - marker: b
    text: “Deus é maior do que o nosso coração” pode indicar que ele conhece mais plenamente a verdade a nosso respeito e, por implicação, que sua autoridade está acima da nossa autocondenação.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: O primeiro ὅτι introduz a explicação ou fundamento da afirmação anterior; “pois” preserva essa relação de modo natural em português.
- source_word: ἐὰν
  choice: se
  rationale: Com o presente do subjuntivo καταγινώσκῃ, introduz uma situação condicional; “se” é a correspondência mais direta.
- source_word: καταγινώσκῃ
  choice: condena
  rationale: O verbo pode significar condenar, censurar ou achar culpa. “Condena” comunica bem o tom judicial da avaliação interior sem substituir “coração” por “consciência”.
- source_word: ἡ καρδία ἡμῶν
  choice: o nosso coração
  rationale: Preserva a imagem de καρδία como centro da vida interior, sem a restringir interpretativamente a “consciência”.
- source_word: ὅτι
  choice: não expresso separadamente
  rationale: O segundo ὅτι introduz o conteúdo ou fundamento da segurança. Em português natural, sua força é preservada pela sequência da frase sem repetir uma conjunção.
- source_word: μείζων
  choice: maior
  rationale: Mantém amplo o sentido comparativo, sem limitá-lo apenas ao conhecimento, à autoridade ou à misericórdia.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente português padrão de θεός.
- source_word: τῆς καρδίας ἡμῶν
  choice: do que o nosso coração
  rationale: O genitivo após o comparativo é naturalmente expresso com “do que”, e a repetição deixa clara a comparação.
- source_word: γινώσκει πάντα
  choice: conhece todas as coisas
  rationale: Preserva o alcance abrangente de πάντα e o modo solene, porém compreensível, da expressão joanina.
theological_decisions:
- issue: Como entender que Deus é “maior do que o nosso coração”
  choice: Manter a afirmação ampla, sem restringi-la somente à misericórdia, à autoridade ou à onisciência.
  alternative: Explicitar que Deus é mais misericordioso que a consciência, que seu veredito supera a autocondenação, ou que ele conhece a verdade completa sobre nós.
  rationale: A frase grega afirma de maneira ampla a grandeza de Deus em relação ao coração e acrescenta que ele conhece todas as coisas. A segunda oração destaca o conhecimento, mas não esgota necessariamente a força do comparativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva “coração” e a amplitude teológica de “maior”, usando “todas as coisas” para refletir o alcance de πάντα.
