  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: pt
  text: 'E quem guarda os seus mandamentos permanece nele, e ele permanece nessa pessoa. Nisto sabemos que ele permanece em nós: pelo Espírito que nos deu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a partir do Espírito que nos deu”. A preposição grega pode destacar tanto a origem quanto o meio ou fundamento desse conhecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: guarda
  rationale: '“Guardar” conserva a amplitude de τηρέω: obedecer, observar e manter fielmente, além de preservar a linguagem característica dos escritos joaninos.'
- source_word: ἐντολάς
  choice: mandamentos
  rationale: É a equivalência corrente de ἐντολή no contexto joanino e mantém a força moral e relacional do termo.
- source_word: μένει
  choice: permanece
  rationale: O verbo ocorre três vezes, e a repetição foi mantida. “Permanece” expressa com naturalidade a continuidade relacional de μένω, sem o tom menos corrente de “habita” ou a superficialidade possível de “fica”.
- source_word: ἐν αὐτῷ … αὐτὸς ἐν αὐτῷ
  choice: nele, e ele permanece nessa pessoa
  rationale: “Nele” preserva o pronome grego; na segunda ocorrência, “nessa pessoa” torna inteligível em português a reciprocidade da permanência sem substituir explicitamente o referente por “Deus”.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: E assim sabemos
  rationale: A formulação portuguesa comunica naturalmente o sinal ou fundamento pelo qual esse conhecimento é reconhecido.
- source_word: ἐκ τοῦ πνεύματος
  choice: pelo Espírito
  rationale: “Pelo” apresenta o Espírito como meio ou fundamento do conhecimento, ao passo que a nota registra o possível destaque da origem indicado por ἐκ.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: que nos deu
  rationale: Reproduz o aoristo ἔδωκεν sem acrescentar aspecto perfeito e evita impor, por meio do pronome relativo português, uma discussão gramatical sobre gênero que não precisa aparecer no texto.
theological_decisions:
- issue: Referente dos pronomes em αὐτῷ / αὐτός e do sujeito de μένει ἐν ἡμῖν
  choice: Manter os pronomes, com referência contextual a Deus
  alternative: Explicitar “Deus” ou entender a permanência final em sentido diretamente cristológico
  rationale: O contexto imediato aponta para Deus, mas o grego emprega pronomes. A tradução não substitui esses pronomes por um nome e, assim, preserva a formulação e a tensão relacional do texto.
- issue: Identidade de πνεῦμα
  choice: Espírito, com inicial maiúscula
  alternative: espírito, com inicial minúscula
  rationale: O Espírito é apresentado como aquele que Deus deu aos fiéis; o contexto joanino indica o Espírito divino, sem necessidade de acrescentar “Santo” ou “seu” ao texto.
- issue: Reciprocidade da permanência
  choice: Expressar tanto a permanência da pessoa em Deus quanto a de Deus nela
  alternative: Reduzir a segunda oração a uma mera consequência ou paráfrase da primeira
  rationale: A construção grega apresenta de modo enfático os dois lados da permanência mútua, que devem ser conservados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a repetição de “permanece”, central no vocabulário joanino, enquanto “nessa pessoa” evita a sequência ambígua e pouco natural “ele nele” sem explicitar além do grego a identidade do referente.
