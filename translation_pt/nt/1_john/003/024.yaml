  terminology: “Guarda”, “mandamentos”, “permanece” e “Espírito” são escolhas consistentes com o vocabulário joanino e com o contexto. “Pelo Espírito” é uma tradução possível de ἐκ τοῦ πνεύματος; a nota registra apropriadamente a nuance de origem/base.
