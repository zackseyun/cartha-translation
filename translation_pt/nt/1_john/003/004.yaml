  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: pt
  text: Todo aquele que pratica o pecado também pratica a transgressão da lei[a], e o pecado é a transgressão da lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “iniquidade”. O termo grego refere-se a uma conduta contrária à lei; o texto não especifica aqui qual lei está em vista.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Todo aquele que pratica
  rationale: O particípio presente substantivado tem sentido genérico e, no contexto, pode indicar conduta contínua ou característica. “Pratica” expressa isso em português natural sem transformar o presente grego num tempo habitual técnico.
- source_word: τὴν ἁμαρτίαν
  choice: o pecado
  rationale: Em português, o artigo definido soa natural com “pecado” empregado como categoria abstrata nesta construção.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: também pratica a transgressão da lei
  rationale: A repetição de “pratica” conserva o paralelismo de ποιῶν/ποιεῖ. “Transgressão da lei” comunica de modo claro a relação de ἀνομία com νόμος, embora “iniquidade” seja uma alternativa mais compacta.
- source_word: ἀνομία
  choice: transgressão da lei
  rationale: A expressão é compreensível ao leitor moderno e preserva a ideia lexical de oposição ou violação da lei sem especificar indevidamente qual código legal está em vista.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: pois o pecado é a transgressão da lei
  rationale: “Pois” torna explícita a função explicativa do segundo καί, uso possível nesse contexto. A formulação mantém a identificação categórica feita pelo texto.
theological_decisions:
- issue: Se os verbos no presente descrevem um ato pontual ou uma conduta característica
  choice: 'conduta característica: “pratica”'
  alternative: “comete” ou, mais literalmente, “faz”
  rationale: No contexto imediato de 1 João 3, as formas presentes podem retratar conduta contínua ou característica. “Pratica” preserva essa força sem afirmar que o grego exclua por si só todo ato pontual.
- issue: Sentido de ἀνομία na definição do pecado
  choice: “transgressão da lei”
  alternative: “iniquidade” ou “desrespeito à lei”
  rationale: A tradução mantém a ligação lexical com “lei” e a tensão teológica da definição, sem identificar a lei especificamente com a Lei mosaica, a lei civil ou uma formulação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Todo aquele que” mantém o caráter genérico do grego. Preferiu-se “transgressão da lei” a “ilegalidade”, que em português tende a sugerir sobretudo infração civil, e a “anomia”, que é técnica e pouco acessível.
