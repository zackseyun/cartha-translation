id: 1JN.3.5
reference: 1 John 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: pt
  text: E vocês sabem que ele se manifestou[a] para tirar os pecados[b], e nele não há pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apareceu”.
    reason: lexical_alternative
  - marker: b
    text: Ou “levar embora os pecados”. O verbo grego pode significar tirar, remover ou levar/carregar embora.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: vocês sabem
  rationale: Embora οἶδα tenha forma de perfeito, normalmente tem sentido presente no grego koiné. “Vocês sabem” é natural e preserva a referência plural.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O pronome enfático retoma Jesus Cristo no contexto. “Ele” é idiomático em português e evita a expressão pouco natural “aquele” sem acrescentar o nome ao texto.
- source_word: ἐφανερώθη
  choice: se manifestou
  rationale: O aoristo passivo de φανερόω descreve a manifestação histórica de Cristo. A forma pronominal portuguesa é natural, digna e mantém a ideia de tornar-se visível ou conhecido.
- source_word: ἵνα
  choice: para
  rationale: A preposição com infinitivo expressa de modo claro e corrente a finalidade marcada por ἵνα.
- source_word: τὰς ἁμαρτίας
  choice: os pecados
  rationale: Mantém o plural concreto e o artigo do grego, sem reduzir a expressão ao singular abstrato.
- source_word: ἄρῃ
  choice: tirar
  rationale: αἴρω pode significar levantar, levar ou remover. “Tirar” comunica aqui a remoção dos pecados sem definir um mecanismo expiatório específico; a alternativa “levar embora” é registrada em nota.
- source_word: ἁμαρτία
  choice: pecado
  rationale: O singular sem artigo exprime pecado de modo absoluto; “pecado” preserva diretamente a afirmação da ausência de pecado nele.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Equivalente natural de ἐν αὐτῷ, preservando a formulação joanina e sua ressonância teológica.
theological_decisions:
- issue: Referente de ἐκεῖνος
  choice: Pronome “ele”, referindo-se a Jesus Cristo
  alternative: “Aquele” ou explicitação como “Jesus Cristo”
  rationale: O contexto identifica o referente como Cristo. “Ele” mantém a referência clara sem inserir no versículo um nome que o grego não explicita.
- issue: Sentido de αἴρω aplicado aos pecados
  choice: “tirar os pecados”
  alternative: “levar embora os pecados” ou “carregar os pecados”
  rationale: A tradução principal destaca a remoção dos pecados, sentido bem sustentado no contexto, sem restringir o texto a um modelo particular de expiação. A nota preserva a amplitude lexical de αἴρω.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O uso de “vocês” explicita o plural; “se manifestou” conserva o tom joanino sem soar arcaico. A redação é direta, digna e mantém a repetição de “pecados/pecado” do original.
