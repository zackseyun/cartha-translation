source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: pt
  text: 'E este é o seu mandamento: que creiamos no nome de seu Filho, Jesus, o Messias, e amemos uns aos outros, assim como ele nos deu um mandamento.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim como ele nos ordenou”.'
    reason: A expressão grega usa literalmente o substantivo “mandamento” com o verbo “dar”; a formulação verbal é uma alternativa idiomática em português.
lexical_decisions:
- source_word: ἐντολή
  choice: mandamento
  rationale: Mantém a força normativa do substantivo e sua repetição nas duas ocorrências; em português bíblico atual, é natural e claro.
- source_word: ἵνα πιστεύσωμεν
  choice: que creiamos
  rationale: Após “este é o seu mandamento”, a oração com ἵνα expressa o conteúdo do mandamento; o subjuntivo português preserva adequadamente essa força.
- source_word: πιστεύω τῷ ὀνόματι
  choice: crer no nome
  rationale: Expressa fé dirigida à pessoa revelada e representada pelo nome, preservando a formulação joanina sem explicá-la em excesso.
- source_word: υἱοῦ
  choice: Filho
  rationale: A inicial maiúscula sinaliza a referência cristológica no contexto, sem alterar o sentido lexical.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός tem aqui força titular; “o Messias” comunica esse valor de modo idiomático em português, enquanto as vírgulas funcionam como aposição explicativa.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: amemos uns aos outros
  rationale: Tradução natural do verbo e da reciprocidade comunitária, mantendo o paralelismo com “creiamos”.
- source_word: καθὼς
  choice: assim como
  rationale: Marca com clareza a correspondência com o mandamento anteriormente dado.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: ele nos deu mandamento
  rationale: Preserva a construção nominal e a repetição de ἐντολή. A ausência de artigo mantém uma possível referência qualitativa ou já contextualizada, embora “nos deu um mandamento” também seja possível.
theological_decisions:
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, Χριστός identifica o Filho por seu título messiânico. A tradução mantém explícito o caráter de título, sem tratar “Cristo” simplesmente como sobrenome.
- issue: Força de πιστεύω τῷ ὀνόματι
  choice: crer no nome
  alternative: confiar no nome
  rationale: “Crer no nome” preserva a dicção joanina e indica fé na pessoa conforme revelada em seu nome; “confiar” é uma nuance possível, mas seria mais interpretativa.
- issue: Artigo na segunda ocorrência de ἐντολή
  choice: deu mandamento
  alternative: deu um mandamento
  rationale: A construção sem artigo conserva a forma enxuta e a repetição lexical do grego. Como o grego não determina sozinho a indefinição, a alternativa com artigo indefinido permanece legítima e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a repetição de “mandamento”, o paralelismo dos subjuntivos e a formulação teologicamente densa “crer no nome”. A pontuação apresenta “o Messias” como título em aposição a Jesus.
