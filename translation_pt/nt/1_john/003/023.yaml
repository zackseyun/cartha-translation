    text: 'Ou: “assim como ele nos ordenou”.'
    reason: A expressão grega usa literalmente o substantivo “mandamento” com o verbo “dar”; a formulação verbal é uma alternativa idiomática em português.
  revision_rationale: Foi inserido o artigo indefinido na segunda ocorrência de «mandamento» para corrigir uma elipse não idiomática em português, mantendo a repetição lexical do grego e sem resolver além do necessário a referência contextual da expressão. A nota foi simplificada para registrar a alternativa verbal natural, sem apresentar como alternativa principal uma forma portuguesa deficiente.
