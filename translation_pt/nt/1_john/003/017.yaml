  source_fidelity: A tradução transmite adequadamente os bens materiais, a percepção da necessidade do irmão, a recusa de compaixão e a pergunta retórica sobre a permanência do amor de Deus. A ambiguidade de «o amor de Deus» foi corretamente preservada.
  naturalness: «Fecha o coração para ele» soa menos idiomático em português e deixa menos claro que a recusa é dirigida ao irmão necessitado. «Fecha o coração ao seu irmão» é uma formulação natural e conserva a imagem de negar compaixão. A troca do segundo «mas» por «porém» evita repetição pesada sem alterar o contraste.
  terminology: «Bens deste mundo», «irmão», «passando necessidade», «coração», «amor de Deus» e «permanece» são escolhas apropriadas, modernas e fiéis ao registro joanino. A nota sobre σπλάγχνα deve explicar que a expressão literal se refere às entranhas/partes interiores e à compaixão profunda, sem apresentar «para ele» como se fosse a direção literal inequívoca.
