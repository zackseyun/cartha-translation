  to: Mas quem possui os bens deste mundo e vê seu irmão passando necessidade[a], porém fecha o coração ao seu irmão[b], como permanece nele o amor de Deus?[c]
  rationale: A revisão limita-se a tornar idiomática a expressão de recusa de compaixão e a ajustar a explicação literal da nota correspondente. Mantêm-se a estrutura interrogativa de πῶς, o masculino singular «irmão» e a ambiguidade do genitivo em «o amor de Deus».
