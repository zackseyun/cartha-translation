id: 1JN.3.17
reference: 1 John 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: pt
  text: Mas quem possui os bens deste mundo e vê seu irmão passando necessidade[a], porém fecha o coração ao seu irmão[b], como permanece nele o amor de Deus?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu irmão ou sua irmã»; o grego diz «irmão», termo que pode representar outro membro da comunidade de fé.
    reason: lexical_alternative
  - marker: b
    text: Ou «recusa-lhe a compaixão»; literalmente, «fecha suas entranhas para longe dele», expressão idiomática para reter ou negar compaixão profunda.
    reason: lexical_alternative
  - marker: c
    text: «O amor de Deus» pode significar o amor de Deus presente nele ou o amor dele por Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: os bens deste mundo
  rationale: βίος aqui indica recursos materiais ou meios de sustento. A expressão comunica com naturalidade as posses disponíveis para atender à necessidade do irmão.
- source_word: θεωρῇ
  choice: vê
  rationale: Expressa percepção direta e consciente, sem o tom excessivamente formal de «observa».
- source_word: ἀδελφὸν
  choice: irmão
  rationale: Preserva o masculino singular do grego; no uso joanino, pode representar um companheiro na fé, inclusive uma irmã, o que é esclarecido em nota.
- source_word: χρείαν ἔχοντα
  choice: passando necessidade
  rationale: Tradução portuguesa natural da expressão «tendo necessidade», indicando carência concreta.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: fecha o coração para ele
  rationale: σπλάγχνα, literalmente as partes interiores, é uma expressão idiomática para compaixão profunda. A formulação mantém a imagem de recusa deliberada de compaixão.
- source_word: πῶς
  choice: como
  rationale: Mantém a forma da pergunta retórica grega sem acrescentar explicitamente a modalidade de impossibilidade presente em «como pode».
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  rationale: Preserva a ambiguidade do genitivo, que pode indicar o amor procedente de Deus ou o amor da pessoa por Deus.
- source_word: μένει ἐν αὐτῷ
  choice: permanece nele
  rationale: «Permanece» é acessível e conserva o sentido durativo de μένω, termo importante em 1 João.
theological_decisions:
- issue: Sentido de «o amor de Deus»
  choice: Manter a expressão literal «o amor de Deus» sem resolver o genitivo.
  alternative: «o amor que Deus lhe dá» ou «seu amor por Deus»
  rationale: O grego admite tanto o amor de Deus presente na pessoa quanto o amor da pessoa por Deus; a redação conserva essa tensão teológica.
- issue: Gênero de ἀδελφὸν
  choice: irmão
  alternative: «irmão ou irmã» ou «companheiro na fé»
  rationale: O texto grego emprega o masculino singular. A possível aplicação representativa é indicada em nota, sem substituir a forma lexical no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Passando necessidade» e «fecha o coração» são expressões naturais, enquanto «permanece» conserva o vocabulário característico de João. Os marcadores foram posicionados junto às expressões que explicam.
