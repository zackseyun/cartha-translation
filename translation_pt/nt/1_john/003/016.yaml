  naturalness: «Nisto conhecemos o amor» e «dar a vida» são formulações naturais, claras e dignas em português moderno. A inclusão de «sua» e «nossa» mantém plena naturalidade e aumenta a clareza.
  terminology: «Amor», «vida», «devemos» e «irmãos» são escolhas adequadas. A nota explica de maneira apropriada o provável alcance comunitário inclusivo de «irmãos», sem substituir a forma masculina do texto.
