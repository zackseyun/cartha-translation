source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: pt
  text: 'Nisto conhecemos o amor: ele deu a sua vida por nós, e nós também devemos dar a nossa vida pelos irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “os irmãos”; neste contexto, a expressão provavelmente se refere aos demais fiéis em geral, incluindo as irmãs.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: Introduz a base ou o meio pelo qual o amor é reconhecido. “Nisto” é natural em português e mantém a concisão e a possível nuance de “por meio disto”.
- source_word: ἐγνώκαμεν
  choice: conhecemos
  rationale: O perfeito grego aponta para um conhecimento adquirido cujos efeitos permanecem. No contexto, o pretérito perfeito português expressa de modo natural esse reconhecimento estabelecido, sem a estranheza de “temos vindo a conhecer”.
- source_word: τὴν ἀγάπην
  choice: o amor
  rationale: O artigo definido é natural em português nesta construção e apresenta o amor como a realidade identificada pelo ato de Cristo.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O pronome enfático remete a Jesus no contexto joanino. “Ele” preserva a referência contextual sem inserir explicitamente um nome ausente do grego.
- source_word: ὑπὲρ ἡμῶν
  choice: por nós
  rationale: Expressa benefício e entrega em favor de outros, preservando o peso teológico sem definir uma teoria específica da expiação.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: deu a vida
  rationale: A expressão idiomática joanina significa entregar voluntariamente a própria vida. “Deu a vida” é corrente, clara e digna em português; evita o literalismo inadequado de “pôs a sua alma”.
- source_word: ὀφείλομεν
  choice: devemos
  rationale: Comunica diretamente a obrigação moral expressa pelo verbo grego, em linguagem moderna e natural.
- source_word: ὑπὲρ τῶν ἀδελφῶν
  choice: pelos irmãos
  rationale: Mantém o substantivo masculino plural do grego. No contexto comunitário, ele provavelmente abrange os demais fiéis, inclusive mulheres, o que é esclarecido em nota.
- source_word: τὰς ψυχὰς θεῖναι
  choice: dar a vida
  rationale: Repete o mesmo idioma da oração anterior. Embora o grego use o plural “as vidas”, o português idiomático emprega “dar a vida” distributivamente quando o sujeito é plural.
theological_decisions:
- issue: Referente de ἐκεῖνος
  choice: “Ele”, entendido no contexto como Jesus Cristo
  alternative: “Aquele”, deixando a referência mais marcada e menos explícita
  rationale: O contexto da carta e o idioma joanino de dar a vida identificam Jesus como referente. A tradução conserva o pronome, permitindo que o contexto faça essa identificação.
- issue: Alcance de τῶν ἀδελφῶν
  choice: “os irmãos” no texto, com nota sobre o sentido comunitário inclusivo
  alternative: “os irmãos e as irmãs”
  rationale: A forma grega é masculina plural, mas no contexto provavelmente designa os fiéis em geral. A nota preserva tanto a forma do original quanto seu provável alcance.
- issue: Sentido de ὑπέρ
  choice: “por”, sem especificar além da entrega em favor de outros
  alternative: “em lugar de”, com sentido substitutivo explicitado
  rationale: A preposição admite forte sentido de benefício e pode comportar uma dimensão representativa ou substitutiva, mas o versículo não exige que a tradução resolva essa nuance por uma formulação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo entre a entrega de Cristo e a obrigação dos fiéis. “Nisto” conserva a concisão e a ambiguidade legítima de ἐν τούτῳ; “deu/dar a vida” comunica naturalmente o idioma grego.
