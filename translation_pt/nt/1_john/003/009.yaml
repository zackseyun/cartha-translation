id: 1JN.3.9
reference: 1 John 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: pt
  text: Todo aquele que nasceu de Deus não pratica o pecado[a], porque a semente de Deus permanece nele[b]; e não pode continuar pecando[c], porque nasceu de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “não faz pecado” ou “não comete pecado”. A expressão grega provavelmente se refere à prática contínua do pecado, e não a um único ato.
    reason: lexical_alternative
  - marker: b
    text: Ou “habita nele”.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “não pode pecar”. Neste contexto, o infinitivo presente grego provavelmente tem o sentido de “continuar pecando” ou “persistir no pecado”.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Todo aquele que nasceu
  rationale: A expressão apresenta uma afirmação genérica e universal. Esta formulação é natural em português e conserva tanto a abrangência de πᾶς quanto o estado resultante indicado pelo particípio perfeito.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Deus
  rationale: Com γεννάω, ἐκ indica origem. “Nascer de Deus” é uma formulação clara e corrente no vocabulário joanino.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: não pratica o pecado
  rationale: A construção com ποιεῖ, no presente e em paralelo com ἁμαρτάνειν, aponta naturalmente para conduta contínua ou característica. “Pratica o pecado” comunica esse padrão sem transformar a frase em negação de todo ato isolado.
- source_word: σπέρμα αὐτοῦ
  choice: a semente de Deus
  rationale: Mantém-se a metáfora concreta de σπέρμα sem definir seu referente como palavra, vida ou natureza. A repetição de “Deus” esclarece em português que αὐτοῦ se refere a Deus, enquanto o “nele” seguinte se refere à pessoa nascida de Deus.
- source_word: ἐν αὐτῷ μένει
  choice: permanece nele
  rationale: “Permanece” é atual e natural, preserva a duração expressa por μένω e mantém um termo importante no vocabulário de João.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: não pode continuar pecando
  rationale: O infinitivo presente ἁμαρτάνειν, neste contexto, favorece a ideia de ação contínua. A formulação expressa a incompatibilidade com a persistência no pecado, enquanto a tradução mais formal é registrada em nota.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: nasceu de Deus
  rationale: O perfeito apresenta o nascimento de Deus como acontecimento com resultado vigente. Em português corrente, “nasceu de Deus” comunica naturalmente esse novo estado.
theological_decisions:
- issue: Se o versículo ensina impecabilidade absoluta ou a incompatibilidade do novo nascimento com a prática contínua do pecado
  choice: O texto principal exclui a prática persistente do pecado, não necessariamente todo ato isolado.
  alternative: “Não comete pecado” e “não pode pecar”, entendidos como incapacidade absoluta de cometer qualquer pecado.
  rationale: Os presentes ποιεῖ e ἁμαρτάνειν favorecem, no contexto, uma ação contínua ou característica. Essa tradução também conserva a tensão com 1 João 1:8—2:1 sem impor uma harmonização doutrinária; a forma mais literal permanece disponível nas notas.
- issue: O significado de “semente de Deus”
  choice: A metáfora é preservada sem identificar seu referente.
  alternative: Interpretá-la como a palavra de Deus, a vida de Deus ou a natureza de Deus.
  rationale: O próprio versículo não especifica o referente de σπέρμα. Interpretá-lo no texto principal acrescentaria uma conclusão teológica que o grego deixa em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “todo o que”, menos natural para muitos leitores, e preferiu-se “todo aquele que”. A repetição de “Deus” resolve a possível confusão entre os dois pronomes gregos sem interpretar a metáfora. Os marcadores [a], [b] e [c] aparecem no texto na ordem correspondente às notas.
