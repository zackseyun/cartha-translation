  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: pt
  text: Filhinhos, não amemos de palavra nem com a língua[a], mas com ações e em verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nem pela fala”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em ação e verdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Filhinhos
  rationale: Vocativo plural afetivo de τεκνίον. “Filhinhos” preserva o vínculo familiar e a ternura do diminutivo, sendo corrente e compreensível em português.
- source_word: μὴ ἀγαπῶμεν
  choice: não amemos
  rationale: O subjuntivo presente com μή expressa uma exortação negativa na primeira pessoa do plural; “não amemos” reproduz essa força de modo direto.
- source_word: λόγῳ
  choice: de palavra
  rationale: Aqui λόγος se refere à expressão verbal. A locução portuguesa “amar de palavra” é natural no contraste com a prática, sem acrescentar conteúdo ao grego.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: nem de língua
  rationale: Mantém a imagem concreta de γλῶσσα (“língua”) e o paralelismo retórico com “de palavra”; a nota registra o sentido metonímico de fala.
- source_word: ἀλλὰ
  choice: mas
  rationale: Conjunção adversativa que marca o contraste forte entre amor apenas verbal e amor concretamente praticado.
- source_word: ἐν ἔργῳ
  choice: com ações
  rationale: ἔργον designa obra, ato ou ação. “Com ações” comunica em português atual o meio ou modo concreto pelo qual o amor deve manifestar-se, evitando a possível ambiguidade de “em obra”.
- source_word: καὶ ἀληθείᾳ
  choice: e em verdade
  rationale: Preserva o valor lexical de ἀλήθεια e sua ressonância joanina, sem reduzi-lo interpretativamente a mera sinceridade ou autenticidade.
theological_decisions:
- issue: Sentido de ἀληθείᾳ na expressão final
  choice: em verdade
  alternative: com sinceridade; de modo genuíno
  rationale: '“Verdade” conserva a possível dupla força do texto: amor autêntico e amor coerente com a verdade de Deus. As alternativas restringiriam o sentido à disposição subjetiva.'
- issue: Relação entre ação e verdade
  choice: 'manter os dois elementos coordenados: “com ações e em verdade”'
  alternative: parafrasear como “com ações verdadeiras” ou “com ações sinceras”
  rationale: A coordenação grega ἐν ἔργῳ καὶ ἀληθείᾳ permite proximidade sem identificar totalmente os termos. A tradução preserva essa tensão em vez de fazer “verdade” apenas qualificar “ações”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Filhinhos” conserva o tom pastoral e afetivo; “com ações” evita formulação arcaica, enquanto “em verdade” mantém a densidade teológica e a ambiguidade legítima do original.
