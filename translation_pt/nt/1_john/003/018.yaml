review_pass:
  verdict: revise
  source_fidelity: 'A estrutura exortativa e o contraste do grego são bem preservados: «não amemos» reflete adequadamente o subjuntivo exortativo μὴ ἀγαπῶμεν, e «mas com ações e em verdade» mantém a oposição entre expressão meramente verbal e amor concretamente praticado. «Filhinhos» transmite de modo apropriado o vocativo afetivo Τεκνία. Contudo, «nem de língua» não é uma realização idiomática suficientemente natural da expressão grega τῇ γλώσσῃ; «nem com a língua» preserva a imagem e o paralelismo sem perda de clareza.'
  naturalness: A redação é clara e de registro apropriado. A substituição de «nem de língua» por «nem com a língua» elimina uma formulação pouco idiomática em português e corresponde à construção explícita do grego. «Com ações e em verdade» é compreensível e conserva a coordenação sem reduzir «verdade» a «sinceridade».
  terminology: «Filhinhos», «palavra», «língua», «ações» e «verdade» são escolhas adequadas. «Verdade» deve ser mantida, pois preserva a amplitude semântica e a ressonância joanina de ἀληθείᾳ. A nota da primeira ocorrência deve ser ajustada porque, após a revisão, a tradução literal «com a língua» passa a constar no próprio texto.
  issues:
  - severity: low
    issue: «nem de língua» é pouco idiomático
    rationale: Embora tente preservar literalmente γλῶσσα, a preposição «de» não reproduz naturalmente a construção instrumental/metonímica. «Nem com a língua» é simultaneamente literal, claro e natural.
  - severity: low
    issue: A nota a descreve como literal uma formulação que passa a estar no texto revisado
    rationale: Com «nem com a língua» no texto, a nota deve oferecer apenas a alternativa interpretativa «nem pela fala», sem reapresentar a própria redação textual como alternativa literal.
  revised_text: Filhinhos, não amemos de palavra nem com a língua[a], mas com ações e em verdade[b].
  revised_footnotes:
