source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: pt
  text: 'Nisto[a] ficam evidentes os filhos de Deus e os filhos do diabo: todo aquele que não pratica a justiça[b] não é de Deus, nem aquele que não ama seu irmão[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Com isto» ou «Por isto». A expressão grega pode indicar o critério ou a base pela qual essa distinção é reconhecida.
    reason: lexical_alternative
  - marker: b
    text: Ou «a retidão». A palavra grega pode designar justiça ou conduta reta; aqui o contexto destaca o modo correto de viver.
    reason: lexical_alternative
  - marker: c
    text: Ou «seu irmão ou sua irmã», isto é, outro irmão na fé. O grego traz «seu irmão» no masculino singular.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: Preserva a expressão demonstrativa grega e sua ambiguidade entre o critério e a base pelos quais a distinção se torna evidente, em formulação natural no contexto joanino.
- source_word: φανερά ἐστιν
  choice: ficam evidentes
  rationale: Comunica que os dois grupos podem ser claramente reconhecidos, sem recorrer ao pouco corrente «são manifestos».
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: os filhos de Deus e os filhos do diabo
  rationale: Mantém a linguagem familiar explícita e o contraste teológico do texto grego.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: todo aquele que não pratica a justiça
  rationale: O particípio presente caracteriza uma conduta habitual; «pratica» expressa esse padrão, e «justiça» conserva o termo tradicional sem restringi-lo à justiça social.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: não é de Deus
  rationale: Preserva de forma concisa a ideia de origem ou pertencimento expressa por ἐκ, sem impor uma explicação doutrinária.
- source_word: καὶ ὁ μὴ ἀγαπῶν
  choice: nem aquele que não ama
  rationale: «Nem» explicita naturalmente em português a continuação da negação e mantém o paralelismo da segunda construção participial.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Reproduz o masculino singular do grego; o possível alcance representativo mais amplo é indicado em nota.
theological_decisions:
- issue: Linguagem familiar para identidade moral e espiritual
  choice: filhos de Deus e filhos do diabo
  alternative: os que pertencem a Deus e os que pertencem ao diabo
  rationale: O original usa τέκνα, linguagem de filiação central para a argumentação de 1 João; substituí-la por uma categoria genérica enfraqueceria a imagem.
- issue: Sentido ético de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» é a correspondência lexical estabelecida e pode abranger a conduta correta diante de Deus; a nota preserva «retidão» como esclarecimento possível do sentido ético neste contexto.
- issue: Alcance de ἀδελφός
  choice: seu irmão
  alternative: seu irmão ou sua irmã; outro irmão na fé
  rationale: O texto apresenta um substantivo masculino singular. A tradução principal conserva essa forma, enquanto a nota registra seu possível uso representativo para outro membro da comunidade de fé.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a força contrastiva do grego, evitando linguagem arcaica e explicitações confessionais.
