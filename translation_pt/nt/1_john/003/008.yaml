source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: pt
  text: 'Quem pratica o pecado[a] vem do Diabo[b], porque o Diabo vem pecando desde o princípio. Foi para isto que o Filho de Deus foi revelado[c]: para destruir as obras do Diabo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quem comete pecado” ou “Quem faz o pecado”. O grego emprega um particípio presente, que neste contexto sugere prática contínua ou característica, e não necessariamente um único ato isolado.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “é do Diabo”. O grego usa literalmente “de, desde” (ἐκ), indicando fonte, procedência ou alinhamento moral e espiritual.
    reason: alternative_reading
  - marker: c
    text: Ou “manifestou-se” ou “apareceu”. O verbo grego ressalta manifestação ou revelação.
    reason: lexical_alternative
  - marker: d
    text: Ou “desfazer as obras do Diabo”. O verbo grego significa literalmente “soltar” e, por extensão, desfazer, desmantelar ou destruir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Quem pratica o pecado
  rationale: O particípio presente ποιῶν sugere ação contínua ou característica. “Pratica o pecado” comunica esse aspecto sem transformar a frase numa afirmação sobre um único ato isolado.
- source_word: ἐκ τοῦ διαβόλου
  choice: vem do Diabo
  rationale: ἐκ indica fonte ou origem em sentido moral e espiritual. “Vem do Diabo” conserva a metáfora de procedência sem afirmar geração ontológica.
- source_word: διάβολος
  choice: Diabo
  rationale: Neste contexto, διάβολος funciona como designação pessoal estabelecida, e não simplesmente como o substantivo comum “caluniador”.
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: porque ... desde o princípio
  rationale: ὅτι introduz a razão da afirmação anterior, enquanto ἀπ’ ἀρχῆς mantém deliberadamente aberta a referência exata do “princípio”.
- source_word: ἁμαρτάνει
  choice: vem pecando
  rationale: Com “desde o princípio”, o presente grego descreve atividade característica iniciada no passado e ainda vigente; a locução portuguesa expressa bem essa duração.
- source_word: εἰς τοῦτο
  choice: Foi para isto que
  rationale: A expressão aponta para a oração final seguinte e introduz com naturalidade o propósito da manifestação do Filho.
- source_word: ἐφανερώθη
  choice: se manifestou
  rationale: A forma comunica aparecimento e revelação pública de identidade e missão. “Se manifestou” é natural em português e preserva a linguagem joanina de manifestação.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Tradução direta e consagrada do título cristológico, preservando explicitamente a relação filial.
- source_word: ἵνα λύσῃ
  choice: para destruir
  rationale: A construção com ἵνα expressa propósito. Embora λύω signifique literalmente soltar ou desfazer, com “obras do Diabo” denota desmantelamento ou destruição decisiva.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: as obras do Diabo
  rationale: Preserva o plural e a relação genitiva, com amplitude suficiente para abranger tanto a atividade pecaminosa do Diabo quanto seus efeitos.
theological_decisions:
- issue: Força da linguagem de pecado no presente na ética joanina
  choice: Ação habitual ou característica, expressa por “pratica o pecado” e “vem pecando”
  alternative: Afirmação absoluta a respeito de qualquer ato isolado de pecado
  rationale: O aspecto contínuo da formulação e o contexto mais amplo de 1 João favorecem um padrão característico. Essa tradução conserva a tensão com 1Jo 1:8–2:2, onde se reconhece que os fiéis podem pecar, sem harmonização indevida.
- issue: Sentido de “vem do Diabo”
  choice: Fonte ou alinhamento moral e espiritual
  alternative: Derivação ou geração ontológica pelo Diabo
  rationale: O uso joanino de ἐκ descreve procedência e pertencimento ético-espiritual. A tradução mantém a metáfora sem ensinar que seres humanos sejam literalmente gerados pelo Diabo.
- issue: Propósito da manifestação do Filho
  choice: O Filho de Deus manifestou-se para destruir as obras do Diabo
  alternative: O Filho apenas expôs ou tornou visíveis as obras do Diabo
  rationale: A oração com ἵνα é final, e λύσῃ indica desmantelamento efetivo, não mera exposição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A repetição de “Diabo” e a expressão “desde o princípio” preservam a dicção e a ambiguidade temporal do original. “Foi para isto que” torna explícita, sem ampliar, a relação de propósito indicada pelo grego.
