id: 1JN.3.1
reference: 1 John 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: pt
  text: Vejam que tipo de amor o Pai nos deu, para que sejamos chamados filhos de Deus — e somos[b]. Por isso, o mundo não nos conhece[c], porque não o conheceu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Alguns manuscritos omitem “e somos”.
    reason: textual_variant
  - marker: c
    text: Ou “não nos reconhece”.
    reason: lexical_alternative
  - marker: d
    text: “O” refere-se mais naturalmente ao Pai neste versículo; alguns entendem que se refere a Cristo no contexto joanino.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Vejam
  rationale: Imperativo plural que chama diretamente a atenção; é natural no português moderno e evita o tom arcaico de “Eis”.
- source_word: ποταπὴν ἀγάπην
  choice: que tipo de amor
  rationale: Preserva a ênfase qualitativa e admirativa da expressão grega, em vez de reduzi-la apenas à intensidade (“quão grande”).
- source_word: δέδωκεν ἡμῖν
  choice: nos deu
  rationale: Expressa de modo natural a dádiva do Pai. Embora o perfeito grego destaque um resultado duradouro, “nos deu” é mais idiomático em português e o contexto mantém o efeito presente.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: Título definido de Deus no contexto joanino; a inicial maiúscula sinaliza o referente divino sem acrescentar conteúdo.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: sermos chamados filhos de Deus
  rationale: A construção com infinitivo pessoal comunica naturalmente o conteúdo ou resultado do amor dado. “Filhos” é genérico e inclusivo no português corrente, sem especificar apenas pessoas do sexo masculino.
- source_word: καὶ ἐσμέν
  choice: e somos
  rationale: 'Mantém a afirmação breve e enfática do texto crítico: não apenas recebemos esse nome, mas de fato somos filhos de Deus.'
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Conector causal/inferencial claro, conciso e natural.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Conserva o termo joanino sem interpretar no texto principal seu sentido como ordem humana afastada de Deus.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: não nos conhece
  rationale: Mantém o paralelo verbal com “não o conheceu”; o sentido possível de reconhecimento é registrado em nota.
- source_word: οὐκ ἔγνω αὐτόν
  choice: não o conheceu
  rationale: Preserva o aoristo e a ambiguidade formal do pronome masculino, cujo antecedente mais próximo é o Pai.
theological_decisions:
- issue: Referente de αὐτόν
  choice: “o” refere-se mais naturalmente ao Pai
  alternative: “o” pode ser entendido como referência a Cristo no contexto joanino mais amplo
  rationale: O Pai é o antecedente explícito mais próximo e se ajusta à lógica imediata do versículo. Como o pronome grego permite discussão no contexto teológico mais amplo, a alternativa é mantida em nota.
- issue: Inclusão de καὶ ἐσμέν
  choice: incluir “e somos” no texto principal
  alternative: omitir a expressão conforme alguns manuscritos
  rationale: A SBLGNT inclui a frase, que enfatiza a realidade presente da filiação divina; a variante é indicada em nota.
- issue: Valor de τέκνα θεοῦ
  choice: “filhos de Deus” em sentido inclusivo
  alternative: “crianças de Deus” ou “filhos e filhas de Deus”
  rationale: “Filhos de Deus” é a formulação natural e estabelecida em português para pessoas de ambos os sexos. “Crianças” sugeriria idade, e “filhos e filhas” explicitaria uma distinção que o termo grego neutro plural não formula.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural “vejam” dirige a exortação à comunidade. A pontuação explicita com naturalidade a relação entre a dádiva do amor e a designação como filhos de Deus, sem eliminar a força afirmativa de “e somos”.
