  naturalness: A redação é moderna e clara em geral. A troca dos dois-pontos por uma oração com «para que sejamos chamados» torna explícita e idiomática a relação expressa por ἵνα. A nota sobre o pronome deve empregar «o», em minúscula, pois se trata da forma pronominal citada, não de um título.
  terminology: «Pai», «filhos de Deus», «mundo» e «conhece» são escolhas adequadas e consistentes com o registro joanino. «Filhos» é aceitável como expressão inclusiva estabelecida em português religioso contemporâneo.
