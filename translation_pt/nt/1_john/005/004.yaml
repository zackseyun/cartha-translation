id: 1JN.5.4
reference: 1 John 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: pt
  text: 'Pois todo aquele que nasceu de Deus vence o mundo.[a] E esta é a vitória que venceu o mundo: a nossa fé.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que nasceu de Deus”. A expressão grega está no neutro singular e abrange coletivamente os que nasceram de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a nossa fidelidade”. A palavra grega pode significar “fé”, “confiança” ou “fidelidade”, conforme o contexto; aqui, o texto principal traz “fé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da afirmação anterior e conserva a força causal com naturalidade em português.
- source_word: πᾶν τὸ γεγεννημένον
  choice: todo aquele que nasceu
  rationale: Embora a expressão grega esteja no neutro singular, ela designa coletivamente pessoas nascidas de Deus. A formulação escolhida comunica esse referente pessoal em português corrente, enquanto a forma mais literal é preservada em nota.
- source_word: γεγεννημένον
  choice: nasceu
  rationale: Expressa de modo natural o nascimento proveniente de Deus. O particípio perfeito grego apresenta esse nascimento como ocorrido e ainda relevante, sentido que o contexto transmite em português sem exigir uma construção artificial.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Deus
  rationale: Indica origem divina e corresponde ao modo idiomático de falar do novo nascimento em português.
- source_word: νικᾷ
  choice: vence
  rationale: Equivalente natural que mantém a ligação lexical com νίκη e νικήσασα por meio de “vitória” e “venceu”.
- source_word: τὸν κόσμον
  choice: o mundo
  rationale: Preserva a expressão joanina sem explicitar no texto principal se ela denota a humanidade, o sistema contrário a Deus ou outra nuance contextual.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: esta é a vitória
  rationale: Mantém a ênfase demonstrativa e a relação entre o substantivo “vitória” e o verbo “vence”.
- source_word: ἡ νικήσασα
  choice: que venceu
  rationale: Reproduz o particípio aoristo com uma oração relativa natural e conserva o aspecto de vitória realizada, sem transformá-lo em mera possibilidade.
- source_word: ἡ πίστις ἡμῶν
  choice: a nossa fé
  rationale: “Fé” é o sentido mais provável de πίστις neste contexto e a expressão identifica diretamente a vitória mencionada; a alternativa lexical “fidelidade” é registrada em nota.
theological_decisions:
- issue: Referência de πᾶν τὸ γεγεννημένον
  choice: 'Referência pessoal e coletiva: “todo aquele que nasceu de Deus”'
  alternative: “tudo o que nasceu de Deus”
  rationale: O neutro singular grego permite uma tradução formalmente impessoal, mas o contexto se refere aos que nasceram de Deus. A tradução pessoal comunica o referente provável, e a nota conserva a forma e a amplitude da construção original.
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade
  rationale: No contexto, “a nossa fé” é a leitura mais natural para aquilo que vence o mundo. Como πίστις também pode significar “fidelidade” em certos contextos, essa possibilidade é preservada sem decidir a questão por formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” preserva a ligação argumentativa; “nasceu de Deus” evita o arcaísmo de “é nascido de Deus”; e a repetição “vence/vitória/venceu” mantém o jogo lexical deliberado do grego.
