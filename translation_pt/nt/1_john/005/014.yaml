id: 1JN.5.14
reference: 1 John 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: pt
  text: 'E esta é a confiança que temos diante dele: se pedirmos alguma coisa de acordo com a sua vontade, ele nos ouve.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele nos escuta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: confiança
  rationale: No uso joanino e neste contexto de oração, indica abertura confiante diante de Deus; “confiança” é natural e preserva esse sentido.
- source_word: πρὸς αὐτόν
  choice: diante dele
  rationale: Expressa de modo idiomático a orientação relacional e a presença perante Deus, sem o literalismo pouco natural de “para ele”.
- source_word: ὅτι
  choice: ':'
  rationale: Introduz o conteúdo da confiança; os dois-pontos comunicam essa relação explicativa com clareza em português.
- source_word: ἐάν τι αἰτώμεθα
  choice: se pedirmos alguma coisa
  rationale: Preserva a condição geral expressa por ἐάν com o subjuntivo e o alcance aberto de τι.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: de acordo com a sua vontade
  rationale: Representa a conformidade ou norma indicada por κατά e mantém o peso teológico de θέλημα.
- source_word: ἀκούει ἡμῶν
  choice: ele nos ouve
  rationale: É a formulação portuguesa natural no contexto da oração e não acrescenta a ideia mais forte de concessão imediata do pedido.
theological_decisions:
- issue: Sentido de Deus ouvir a oração
  choice: ele nos ouve
  alternative: ele nos atende; ele concede o que pedimos
  rationale: O texto afirma que Deus ouve os pedidos feitos segundo a sua vontade, mas não identifica explicitamente, neste versículo, ouvir com conceder de imediato; a formulação preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Diante dele” conserva a dimensão relacional da aproximação a Deus; “pedirmos” e “nos ouve” são naturais no registro bíblico contemporâneo.
