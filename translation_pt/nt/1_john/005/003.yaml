id: 1JN.5.3
reference: 1 John 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: pt
  text: 'Pois o amor a Deus[a] consiste nisto: em guardarmos os seus mandamentos, e os seus mandamentos não são pesados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o amor de Deus». A expressão grega pode indicar tanto o amor dirigido a Deus como o amor que procede de Deus, embora o contexto imediato favoreça «amor a Deus».'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: nisto
  rationale: O demonstrativo aponta para a oração explicativa seguinte; a construção portuguesa «consiste nisto» expressa essa relação com naturalidade.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a função explicativa e fundamentadora em relação ao versículo anterior.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: amor a Deus
  rationale: O contexto imediato define o amor dos fiéis dirigido a Deus por meio da obediência. A nota registra a ambiguidade real do genitivo grego.
- source_word: ἵνα
  choice: em
  rationale: Neste contexto, introduz o conteúdo ou a explicação daquilo em que consiste o amor a Deus, e não simplesmente uma finalidade.
- source_word: ἐντολάς
  choice: mandamentos
  rationale: Preserva o peso do termo e seu uso joanino recorrente, em linguagem portuguesa clara e tradicional.
- source_word: τηρῶμεν
  choice: guardarmos
  rationale: Expressa observar e cumprir os mandamentos, além de manter uma correspondência lexical próxima ao uso joanino de τηρέω.
- source_word: βαρεῖαι
  choice: pesados
  rationale: Conserva a metáfora de peso do grego e comunica de modo natural que os mandamentos não são opressivos nem difíceis de suportar.
theological_decisions:
- issue: Sentido do genitivo em ἡ ἀγάπη τοῦ θεοῦ
  choice: 'Genitivo objetivo: o amor dos fiéis dirigido a Deus'
  alternative: 'Genitivo subjetivo: o amor procedente de Deus; ou ambiguidade que abrange ambos os sentidos'
  rationale: O versículo anterior associa amar a Deus ao cumprimento de seus mandamentos, e este versículo define esse amor da mesma maneira. Por isso, «amor a Deus» é a leitura contextual mais provável, sem ocultar na nota a ambiguidade gramatical do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Consiste nisto» evita uma formulação rígida, enquanto «guardarmos» e «mandamentos» preservam o vocabulário joanino reconhecível. O marcador da nota foi colocado após a frase completa porque a nota esclarece a expressão central que ela define.
