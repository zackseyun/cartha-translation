id: 1JN.5.9
reference: 1 John 5:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: pt
  text: 'Se aceitamos o testemunho humano[a], o testemunho de Deus é maior, pois este é o testemunho de Deus: que ele deu testemunho a respeito de seu Filho.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o testemunho dos seres humanos”; também pode ser traduzido como “o testemunho das pessoas” ou “dos homens”.
    reason: lexical_alternative
  - marker: b
    text: 'A última oração também pode ser entendida causalmente: “porque ele deu testemunho a respeito de seu Filho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: testemunho
  rationale: Preserva a repetição enfática do grego e expressa naturalmente o sentido probatório no contexto.
- source_word: τῶν ἀνθρώπων
  choice: humano
  rationale: O plural ἀνθρώπων tem sentido genérico e contrasta o testemunho de seres humanos com o de Deus; “testemunho humano” comunica isso de modo claro e inclusivo em português.
- source_word: λαμβάνομεν
  choice: aceitamos
  rationale: No contexto de acolher um testemunho como válido, “aceitamos” é mais natural em português do que o literal “recebemos”, sem ampliar indevidamente o sentido.
- source_word: μείζων
  choice: maior
  rationale: Equivalente direto do comparativo, indicando que o testemunho de Deus supera o humano.
- source_word: ὅτι (primeira ocorrência)
  choice: pois
  rationale: Introduz a justificativa da afirmação anterior com fluidez e dignidade em português moderno.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: este é o testemunho de Deus
  rationale: Mantém a estrutura e a repetição retórica do original.
- source_word: ὅτι (segunda ocorrência)
  choice: que
  rationale: É entendida no texto principal como introdutora do conteúdo do testemunho, embora a leitura causal também seja possível.
- source_word: μεμαρτύρηκεν
  choice: deu testemunho
  rationale: Expressa idiomaticamente o perfeito grego como ato realizado com relevância presente e conserva a ligação lexical com “testemunho”.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: a respeito de seu Filho
  rationale: Traduz com precisão περί com genitivo e mantém o referente filial explícito.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπων
  choice: testemunho humano
  alternative: testemunho dos homens / testemunho das pessoas
  rationale: O contraste é entre testemunho humano e divino, não especificamente entre homens do sexo masculino e Deus. A formulação escolhida é precisa e natural em português.
- issue: Função do segundo ὅτι
  choice: 'oração de conteúdo: “que ele deu testemunho...”'
  alternative: 'oração causal: “porque ele deu testemunho...”'
  rationale: A leitura de conteúdo explica mais naturalmente em que consiste o testemunho de Deus. A ambiguidade sintática genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “testemunho” foi mantida por sua importância retórica. “Testemunho humano” evita uma leitura exclusivamente masculina sem apagar o contraste presente no grego.
