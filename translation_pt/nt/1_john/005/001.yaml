id: 1JN.5.1
reference: 1 John 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: pt
  text: Todo aquele que crê que Jesus é o Messias[a] nasceu de Deus; e todo aquele que ama aquele que o gerou ama também aquele que nasceu dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego Χριστός significa “Ungido” e corresponde a “Messias”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, procurando reproduzir o mesmo verbo grego ao longo do versículo: “foi gerado por Deus [...] aquele que o gerou [...] aquele que foi gerado por ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Todo aquele que crê
  rationale: O particípio presente substantivado tem sentido genérico. A formulação é natural em português e mantém o foco em toda pessoa caracterizada pela fé.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: que Jesus é o Messias
  rationale: Χριστός funciona como título e identifica Jesus como o ungido prometido; “Messias” comunica esse valor titular de modo claro.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: nasceu de Deus
  rationale: O perfeito passivo apresenta um nascimento já ocorrido com resultado permanente. “Nasceu de Deus” conserva a linguagem joanina de novo nascimento e a origem indicada por ἐκ.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: todo aquele que ama
  rationale: Reproduz de modo claro e paralelo o valor genérico do particípio presente substantivado.
- source_word: τὸν γεννήσαντα
  choice: aquele que o gerou
  rationale: O particípio aoristo ativo apresenta Deus como aquele que gera. O pronome exigido pela expressão portuguesa torna explícita a relação subentendida no contexto, sem substituir a forma verbal por “Pai”.
- source_word: ἀγαπᾷ καὶ
  choice: ama também
  rationale: “Também” expressa naturalmente a força aditiva de καί, ligando o amor por aquele que gera ao amor por aquele que dele nasce.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: aquele que nasceu dele
  rationale: Mantém a imagem de nascimento, a referência pessoal e a origem expressa por ἐξ αὐτοῦ, em português corrente.
theological_decisions:
- issue: Linguagem de γεννάω para geração e novo nascimento
  choice: Empregar “nasceu de Deus”, “aquele que o gerou” e “aquele que nasceu dele”.
  alternative: Empregar consistentemente “foi gerado”, “gerou” e “foi gerado por ele”.
  rationale: A escolha principal preserva a linguagem joanina reconhecível de nascimento e, ao mesmo tempo, deixa visível a relação entre quem gera e quem nasce. A nota registra que o grego usa formas do mesmo verbo, sem impor uma conclusão sobre a ordem da regeneração.
- issue: Título messiânico de Jesus
  choice: Traduzir ὁ χριστός como “o Messias”.
  alternative: “o Cristo”
  rationale: 'A expressão é titular e confessional: Jesus é identificado como o ungido prometido. A alternativa tradicional é preservada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “aquele” conserva o paralelismo do original; o ponto e vírgula deixa clara a ligação entre as duas afirmações sem desfazer sua tensão teológica.
