id: 1JN.5.11
reference: 1 John 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: pt
  text: 'E este é o testemunho[a]: Deus nos deu[b] a vida eterna, e esta vida está em seu Filho[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Testemunho” refere-se aqui ao conteúdo daquilo que é atestado.
    reason: lexical_clarification
  - marker: b
    text: O grego emprega uma forma verbal que apresenta a dádiva como ato realizado; o contexto ressalta seu resultado presente.
    reason: verbal_aspect
  - marker: c
    text: Literalmente, “em seu Filho”; a expressão compacta foi mantida sem substituí-la por “por meio de seu Filho” ou “com seu Filho”.
    reason: theological_ambiguity
lexical_decisions:
- source_word: μαρτυρία
  choice: testemunho
  rationale: É o equivalente natural e consagrado em português para o sentido jurídico e declarativo do termo no contexto joanino, referindo-se ao conteúdo do que é atestado.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural em português o conteúdo do testemunho, expresso em grego por ὅτι, sem acrescentar explicação interpretativa.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: Expressão corrente e fiel ao uso joanino, preservando tanto a duração quanto a qualidade da vida procedente de Deus.
- source_word: ἔδωκεν
  choice: deu
  rationale: O pretérito perfeito simples é a forma portuguesa natural para o aoristo grego e apresenta a dádiva como ato realizado; o contexto deixa claro seu resultado presente.
- source_word: ὁ θεὸς ἡμῖν
  choice: Deus nos
  rationale: Reproduz diretamente o sujeito e o objeto indireto, sem restringir nem ampliar o grupo representado por 'nos'.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: este ... esta vida
  rationale: Mantém a repetição do demonstrativo, que liga enfaticamente o testemunho à vida recém-mencionada.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: em seu Filho
  rationale: Preserva a preposição ἐν e a formulação joanina compacta, sem reduzi-la a 'por meio de' nem enfraquecê-la como mera associação.
theological_decisions:
- issue: Força do aoristo ἔδωκεν e a relevância presente da dádiva
  choice: Deus nos deu a vida eterna
  alternative: Deus tem nos dado a vida eterna
  rationale: O pretérito perfeito simples exprime adequadamente em português o ato concluído. A alternativa com 'tem dado' poderia sugerir uma ação repetida ou progressiva, nuance ausente do grego; o resultado presente decorre do contexto.
- issue: A vida estar ἐν τῷ υἱῷ αὐτοῦ
  choice: esta vida está em seu Filho
  alternative: esta vida vem por meio de seu Filho
  rationale: A tradução mantém a rica formulação locativa e relacional do texto, sem decidir se ela deve ser explicada principalmente em termos de fonte, esfera, união ou mediação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das orações e a repetição de “esta” acompanham a coesão do grego; “está em seu Filho” conserva o idioma joanino sem explicação denominacional.
