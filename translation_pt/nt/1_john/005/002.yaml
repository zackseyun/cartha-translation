  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: pt
  text: 'Nisto sabemos que amamos os filhos de Deus: quando amamos a Deus e cumprimos os seus mandamentos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praticamos os seus mandamentos”, “guardamos os seus mandamentos” ou “obedecemos aos seus mandamentos”. O verbo grego empregado aqui significa literalmente “fazer” (ποιῶμεν), e não o verbo τηρέω, mais habitualmente traduzido por “guardar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: Expressão joanina que introduz o critério ou sinal pelo qual algo é conhecido; “nisto” preserva de modo natural a força demonstrativa.
- source_word: γινώσκομεν
  choice: sabemos
  rationale: O presente grego indica conhecimento ou reconhecimento atual e contínuo; “sabemos” é claro e natural.
- source_word: ἀγαπῶμεν
  choice: amamos
  rationale: Mantém o verbo “amar” nas duas ocorrências e representa naturalmente o presente grego.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: os filhos de Deus
  rationale: τέκνα designa os que pertencem à família de Deus e inclui ambos os sexos; “filhos de Deus” é uma expressão corrente e inclusiva neste contexto.
- source_word: ὅταν
  choice: quando
  rationale: Com o subjuntivo presente, pode significar “quando” ou “sempre que”; “quando” preserva a relação condicional-temporal sem torná-la excessivamente explícita.
- source_word: τὸν θεὸν ἀγαπῶμεν
  choice: amamos a Deus
  rationale: A construção é idiomática em português e mantém Deus como objeto explícito do amor.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: praticamos os seus mandamentos
  rationale: “Praticar” comunica de modo natural a execução efetiva dos mandamentos e reflete ποιέω (“fazer”), sem substituí-lo silenciosamente pelo verbo grego mais habitual para “guardar”.
theological_decisions:
- issue: Relação entre o amor pelos filhos de Deus, o amor a Deus e a prática dos mandamentos
  choice: O amor pelos filhos de Deus é reconhecido quando amamos a Deus e praticamos os seus mandamentos.
  alternative: Entender a frase exclusivamente como prova, causa ou definição do amor aos demais crentes.
  rationale: O texto apresenta um critério joanino conciso, mas não especifica se a relação é estritamente evidencial, causal ou definicional; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nisto sabemos” preserva a concisão joanina; “praticamos os seus mandamentos” evita a expressão pouco natural “fazemos os seus mandamentos”, ao mesmo tempo que mantém a nuance lexical de ποιέω.
