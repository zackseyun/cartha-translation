id: 1JN.5.10
reference: 1 John 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: pt
  text: Quem crê no Filho de Deus tem o testemunho em si mesmo[a]; quem não dá crédito a Deus fez dele um mentiroso[b], porque não creu no testemunho que Deus deu a respeito de seu Filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem “nele” em vez de “em si mesmo”, leitura que também pode ser entendida como referência ao Filho.
    reason: textual_variant
  - marker: b
    text: 'Ou: “o trata como mentiroso”. O grego diz mais literalmente “fez dele um mentiroso”, isto é, rejeitar o testemunho de Deus equivale a considerá-lo falso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Quem crê
  rationale: O particípio presente substantivado tem sentido genérico. “Quem crê” preserva esse valor de modo natural e digno em português atual.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: no Filho de Deus
  rationale: Com πιστεύω, εἰς indica fé ou confiança dirigida a uma pessoa; “crê no Filho de Deus” é a formulação idiomática correspondente.
- source_word: τὴν μαρτυρίαν
  choice: o testemunho
  rationale: “Testemunho” conserva tanto o conteúdo atestado quanto a nuance forense característica do vocabulário joanino.
- source_word: ἐν αὑτῷ
  choice: em si mesmo
  rationale: O pronome reflexivo remete naturalmente à pessoa que crê e indica que ela possui o testemunho interiormente.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: quem não dá crédito a Deus
  rationale: O dativo com πιστεύω indica não aceitar como verdadeiro o que Deus declara. “Não dá crédito a Deus” evita que a frase seja entendida apenas como negação da existência de Deus.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: faz dele um mentiroso
  rationale: A expressão indica que rejeitar o testemunho divino equivale a tratar Deus como mentiroso. O presente em português exprime naturalmente esse resultado vigente do perfeito grego.
- source_word: οὐ πεπίστευκεν
  choice: não creu
  rationale: O perfeito grego descreve uma recusa de fé com relevância presente. “Não creu” é conciso e natural, sem acrescentar uma recusa deliberada que o verbo, sozinho, não explicita.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: que Deus deu
  rationale: Com “testemunho” já expresso, “o testemunho que Deus deu” é a combinação natural em português para a construção cognata grega, ainda que não reproduza sua repetição lexical.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: a respeito de seu Filho
  rationale: περί com genitivo significa “a respeito de” ou “acerca de”; a opção escolhida é clara e mantém a referência ao Filho de Deus.
theological_decisions:
- issue: Referente de “o testemunho em si mesmo”
  choice: O testemunho está na própria pessoa que crê.
  alternative: O testemunho está nele, possivelmente no Filho, conforme uma variante textual.
  rationale: O texto apresentado lê ἐν αὑτῷ, forma reflexiva que remete mais naturalmente à pessoa que crê. A tradução preserva essa leitura sem explicar além do que o versículo afirma.
- issue: Sentido de “não crer em Deus”
  choice: Não aceitar como verdadeiro o testemunho dado por Deus.
  alternative: Descrença geral na existência de Deus ou ausência genérica de fé nele.
  rationale: A oração introduzida por ὅτι especifica que o problema é não crer no testemunho de Deus acerca de seu Filho. “Não dá crédito a Deus” preserva essa relação direta sem reduzir a frase a uma afirmação sobre a existência de Deus.
- issue: Força de “faz dele um mentiroso”
  choice: A rejeição do testemunho trata Deus como mentiroso.
  alternative: A pessoa literalmente transforma Deus em mentiroso.
  rationale: A expressão é mantida com sua força retórica, enquanto a nota esclarece seu sentido pragmático sem atenuar a acusação do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom digno e direto, evita linguagem arcaica e conserva a contundência e a ambiguidade real do original.
