  to: Quem crê no Filho de Deus tem o testemunho em si mesmo[a]; quem não dá crédito a Deus fez dele um mentiroso[b], porque não creu no testemunho que Deus deu a respeito de seu Filho.
  rationale: A única alteração é «faz» para «fez», a fim de refletir de modo mais fiel o perfeito πεποίηκεν. Mantêm-se a formulação idiomática portuguesa, a distinção contextual entre dar crédito a Deus e crer no Filho, a ambiguidade da variante textual e os respectivos pontos de ancoragem das notas.
