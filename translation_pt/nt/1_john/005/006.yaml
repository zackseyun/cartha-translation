source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: pt
  text: Este é aquele que veio por meio de água e sangue[a] — Jesus, o Messias —; não somente pela água, mas pela água e pelo sangue. E o Espírito é quem dá testemunho, porque o Espírito é a verdade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “água e sangue” é discutida. Pode se referir ao batismo e à morte de Jesus, ao seu nascimento e à sua morte ou a imagens sacramentais. O texto mantém a expressão grega sem escolher entre essas interpretações.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “E o Espírito é quem dá testemunho de que o Espírito é a verdade”. A conjunção grega pode indicar a causa (“porque”) ou introduzir o conteúdo do testemunho (“de que”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Este é aquele que veio
  rationale: Preserva a força identificadora e enfática do demonstrativo e traduz naturalmente o particípio aoristo substantivado como referência à vinda histórica de Jesus.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: por meio de água e sangue
  rationale: διά com genitivo pode indicar meio ou circunstância concomitante. A expressão mantém os dois elementos sem decidir seu referente interpretativo.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  rationale: A aposição identifica Jesus por seu título messiânico; a vírgula e o artigo tornam essa função natural e clara em português.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: não somente pela água, mas pela água e pelo sangue
  rationale: A repetição das expressões preposicionais conserva o contraste e a ênfase do grego. 'Pela' é idiomático neste contexto e se harmoniza com a ideia de meio expressa anteriormente.
- source_word: τὸ πνεῦμά
  choice: o Espírito
  rationale: O contexto de testemunho divino e o uso joanino apontam para o Espírito Santo; a inicial maiúscula sinaliza o referente sem ampliar o texto.
- source_word: τὸ μαρτυροῦν
  choice: quem dá testemunho
  rationale: Expressão corrente e digna em português, conservando a força verbal e contínua do particípio presente.
- source_word: ὅτι
  choice: porque
  rationale: A leitura causal fornece a razão da confiabilidade do testemunho do Espírito e se ajusta bem ao fluxo do contexto, embora a leitura completiva seja possível.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: 'Mantém o artigo e a identificação enfática do predicado: o Espírito é ''a verdade'', não apenas verdadeiro.'
theological_decisions:
- issue: Referente de 'o Espírito'
  choice: Espírito Santo
  alternative: um espírito genérico
  rationale: O contexto imediato do testemunho divino e o uso joanino favorecem fortemente o Espírito Santo como referente.
- issue: Sentido de 'água e sangue'
  choice: Manter a expressão sem explicação interpretativa no texto principal
  alternative: batismo e morte de Jesus; nascimento e morte; imagem sacramental
  rationale: O grego nomeia os elementos sem explicar seu simbolismo. A tradução preserva a ambiguidade e a tensão teológica genuínas.
- issue: Tradução de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Na aposição, Χριστός conserva clara força titular; 'o Messias' comunica essa função em português moderno.
- issue: Valor de ὅτι
  choice: 'causal: ''porque'''
  alternative: 'completivo: ''que'''
  rationale: 'A leitura causal produz uma sequência coerente: o Espírito testemunha porque é a verdade. A alternativa permanece possível e é registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'dar testemunho', expressão bíblica corrente sem arcaísmo excessivo. A pontuação destaca a aposição 'Jesus, o Messias' e mantém a progressão enfática do original.
