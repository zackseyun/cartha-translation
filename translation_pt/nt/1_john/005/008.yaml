  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: pt
  text: o Espírito, a água e o sangue; e os três estão de acordo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “e os três são para um só”. No contexto, a expressão grega provavelmente indica que o testemunho dos três converge.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: o Espírito
  rationale: O contexto imediato apresenta o Espírito como testemunha, tornando mais provável a referência definida ao Espírito Santo; a inicial maiúscula explicita essa leitura contextual sem acrescentar um título ao texto.
- source_word: τὸ ὕδωρ
  choice: a água
  rationale: Preserva o artigo e a imagem concreta do grego, sem definir no próprio versículo a que a água se refere.
- source_word: τὸ αἷμα
  choice: o sangue
  rationale: Mantém o artigo e o substantivo concreto, deixando que o contexto determine o referente.
- source_word: οἱ τρεῖς
  choice: os três
  rationale: Reproduz diretamente a expressão substantivada que retoma o Espírito, a água e o sangue.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: estão de acordo
  rationale: No contexto de três testemunhas, comunica naturalmente em português a convergência de seu testemunho. Uma nota preserva a forma mais literal e a ambiguidade da expressão grega.
theological_decisions:
- issue: Se εἰς τὸ ἕν εἰσιν expressa unidade ontológica ou concordância testemunhal
  choice: 'concordância testemunhal: “os três estão de acordo”'
  alternative: “os três são para um só” ou, tradicionalmente, “os três são um”
  rationale: O contexto imediato trata do ato de testemunhar, favorecendo a ideia de convergência. A formulação evita sugerir uma afirmação metafísica que o versículo não exige, enquanto a nota registra a estrutura mais literal e não elimina sua tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O ponto e vírgula separa com clareza a enumeração da afirmação sobre os três.
