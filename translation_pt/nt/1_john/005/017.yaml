  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: pt
  text: Toda injustiça[a] é pecado, e há pecado que não leva à morte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda iniquidade é pecado” ou “Toda prática errada é pecado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “há pecado que não resulta em morte”; mais literalmente, “há pecado não para a morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: Toda injustiça
  rationale: O singular sem artigo com πᾶσα tem sentido abrangente. “Toda injustiça” é natural em português e preserva o alcance moral amplo; a nota registra alternativas lexicais plausíveis.
- source_word: ἁμαρτία
  choice: pecado
  rationale: É a tradução corrente e contextualmente precisa nas duas ocorrências.
- source_word: καὶ
  choice: mas
  rationale: Embora καί seja normalmente aditivo, aqui a segunda oração introduz uma qualificação contrastiva da afirmação geral. “Mas” expressa naturalmente essa relação em português sem alterar o conteúdo proposicional.
- source_word: οὐ πρὸς θάνατον
  choice: não leva à morte
  rationale: A expressão indica direção ou resultado, em continuidade com o versículo anterior. Esta formulação é clara e atual, sem definir a natureza da morte.
- source_word: θάνατον
  choice: morte
  rationale: Tradução direta que mantém em aberto se a referência é à morte física, espiritual ou escatológica.
theological_decisions:
- issue: Natureza da “morte” na expressão “pecado que não leva à morte”
  choice: Manter apenas “morte”, sem qualificação interpretativa
  alternative: morte física; morte espiritual; condenação escatológica
  rationale: O grego não especifica a natureza da morte. A tradução preserva deliberadamente essa ambiguidade teológica.
- issue: Sentido de ἀδικία
  choice: injustiça
  alternative: iniquidade; prática errada
  rationale: “Injustiça” é uma equivalência direta, digna e compreensível para ἀδικία. Como em português pode parecer limitada ao âmbito social ou jurídico, a nota oferece alternativas que tornam explícito o alcance moral mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa como o grego; as notas preservam alternativas lexicais e a formulação mais literal.
