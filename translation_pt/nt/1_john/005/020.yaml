id: 1JN.5.20
reference: 1 John 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: pt
  text: E sabemos que o Filho de Deus veio e nos deu entendimento para conhecermos o Verdadeiro; e estamos no Verdadeiro, em seu Filho, Jesus, o Messias. Este[a] é o verdadeiro Deus e a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Este” pode referir-se especificamente a Jesus, o Messias, embora alguns entendam que se refere ao “Verdadeiro” (o Pai), mencionado na oração anterior.
    reason: Preservar a ambiguidade sintática e teológica quanto ao antecedente de οὗτός.
lexical_decisions:
- source_word: οἴδαμεν
  choice: sabemos
  rationale: O perfeito οἶδα tem valor presente e estativo, indicando conhecimento estabelecido.
- source_word: ἥκει
  choice: veio
  rationale: Expressa a vinda já realizada do Filho, com resultado presente; o perfeito composto português seria menos natural aqui.
- source_word: δέδωκεν
  choice: nos deu
  rationale: Comunica de modo natural a dádiva concedida e ainda eficaz, sem forçar no português a forma composta do perfeito grego.
- source_word: διάνοιαν
  choice: entendimento
  rationale: Refere-se à capacidade concedida para reconhecer a verdade, não apenas à mente como faculdade abstrata.
- source_word: ἵνα γινώσκωμεν
  choice: para conhecermos
  rationale: Preserva claramente a finalidade expressa por ἵνα com o subjuntivo.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: o Verdadeiro / no Verdadeiro
  rationale: Mantém o adjetivo substantivado e a repetição joanina; a inicial maiúscula sinaliza o referente divino sem acrescentar uma identificação explícita.
- source_word: ἐσμὲν ἐν
  choice: estamos em
  rationale: Traduz diretamente a linguagem relacional do texto sem introduzir ideias como permanecer ou estar unido.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: em seu Filho
  rationale: Forma portuguesa natural que preserva tanto a preposição quanto a relação possessiva.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui força titular; a construção com artigo é idiomática e clara em português.
- source_word: οὗτός
  choice: Este
  rationale: Preserva a força demonstrativa do grego e deixa perceptível a questão de seu antecedente.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: o verdadeiro Deus
  rationale: Equivalência consagrada e precisa para o predicativo grego.
- source_word: ζωὴ αἰώνιος
  choice: a vida eterna
  rationale: Expressão corrente na literatura joanina, capaz de abranger a duração e a qualidade dessa vida.
theological_decisions:
- issue: Antecedente de οὗτός em οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος
  choice: Manter o demonstrativo “Este” no texto principal, permitindo que o antecedente mais próximo, Jesus, o Messias, seja a leitura natural.
  alternative: Entender “Este” como referência ao Verdadeiro, isto é, ao Pai, mencionado na oração anterior.
  rationale: O antecedente pessoal mais próximo favorece a referência a Jesus, o Messias, mas a construção admite discussão. O texto e a nota preservam essa tensão sem impor uma resolução denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “Verdadeiro” foi preservada por ser estruturalmente importante no grego; as vírgulas em “Jesus, o Messias” deixam claro o valor titular de Messias.
