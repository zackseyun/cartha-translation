id: 1JN.5.12
reference: 1 John 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: pt
  text: Quem tem o Filho tem a vida[a]; quem não tem o Filho de Deus não tem a vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vida eterna”; no uso de João, “a vida” aqui se refere à vida encontrada no Filho.
    reason: alternativa lexical
lexical_decisions:
- source_word: ὁ ἔχων
  choice: quem tem
  rationale: O artigo com o particípio presente funciona de modo substantivado e genérico. “Quem tem” é natural em português moderno e expressa essa referência geral sem introduzir gênero.
- source_word: τὸν υἱόν
  choice: o Filho
  rationale: A primeira oração traz apenas “o Filho”; a forma breve preserva a variação do grego e, no contexto, identifica claramente o referente.
- source_word: ἔχει
  choice: tem
  rationale: É a tradução direta e idiomática de ἔχω, preservando sem explicação adicional a ideia joanina de ter o Filho e a vida.
- source_word: τὴν ζωήν
  choice: a vida
  rationale: O artigo definido é natural em português nesta construção e preserva a formulação enfática do grego. O contexto joanino fornece o sentido pleno dessa vida.
- source_word: ὁ μὴ ἔχων
  choice: quem não tem
  rationale: μή nega o particípio substantivado. A tradução mantém o paralelismo e a antítese da primeira oração em linguagem corrente.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva integralmente o título cristológico explícito e a relação genitiva do texto grego.
- source_word: οὐκ ἔχει
  choice: não tem
  rationale: Tradução direta da negação do verbo finito, repetindo de modo claro e vigoroso a linguagem da primeira oração.
theological_decisions:
- issue: Sentido de ζωή no contexto joanino
  choice: Traduzir como “a vida” no texto principal.
  alternative: “a vida eterna”
  rationale: Embora ζωή tenha aqui, no contexto de 1 João 5, o sentido da vida eterna encontrada no Filho, o versículo usa simplesmente ζωή. A tradução preserva essa forma e deixa a explicitação para a nota.
- issue: Participíos substantivados masculinos com referência genérica
  choice: Usar “quem...”
  alternative: “aquele que...”
  rationale: A forma grega é masculina singular em termos gramaticais, mas tem referência humana genérica. “Quem” comunica naturalmente essa abrangência em português sem restringir o sentido nem pluralizar a declaração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “tem” e “a vida” conserva o paralelismo enfático do original; “quem” evita uma formulação marcada por gênero sem perder o singular genérico.
