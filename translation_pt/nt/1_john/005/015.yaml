id: 1JN.5.15
reference: 1 John 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: pt
  text: E, se sabemos que ele nos ouve em tudo o que pedimos[a], sabemos que temos os pedidos que lhe fizemos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em qualquer coisa que peçamos”. A construção grega tem sentido abrangente e indefinido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: ele nos ouve
  rationale: Mantém o sentido de ouvir uma oração ou apelo sem antecipar a ideia interpretativa de responder favoravelmente.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: em tudo o que pedimos
  rationale: A construção relativa indefinida expressa abrangência — “tudo o que” — e a preposição torna natural a ligação com “nos ouve” em português.
- source_word: αἰτώμεθα
  choice: pedimos
  rationale: “Pedir” é direto, natural no contexto de oração e preserva a ligação lexical com “pedidos”.
- source_word: ἔχομεν
  choice: temos
  rationale: Traduz diretamente o presente grego, sem substituí-lo por “recebemos”, que acrescentaria uma interpretação.
- source_word: τὰ αἰτήματα
  choice: os pedidos
  rationale: Designa aquilo que foi pedido e mantém em português a relação lexical com o verbo “pedir”.
- source_word: ἃ ᾐτήκαμεν
  choice: que lhe fizemos
  rationale: O pretérito perfeito português apresenta os pedidos como já feitos e, com “temos”, conserva sua relevância presente; “fazer pedidos a alguém” é construção natural.
- source_word: ἀπ’ αὐτοῦ
  choice: lhe
  rationale: O pronome dativo em “pedidos que lhe fizemos” expressa naturalmente em português a pessoa a quem os pedidos foram dirigidos, preservando a referência a Deus.
- source_word: οἴδαμεν
  choice: sabemos
  rationale: Preserva a repetição enfática do verbo joanino de conhecimento e certeza.
theological_decisions:
- issue: Se ἀκούει deve indicar apenas que Deus ouve ou já significar que ele responde favoravelmente.
  choice: ele nos ouve
  alternative: ele nos atende
  rationale: “Ouve” conserva a lógica do texto e sua tensão teológica; “atende” fundiria o ouvir com a concessão dos pedidos e afirmaria mais do que o verbo grego explicita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem e a repetição de “sabemos” acompanham a estrutura argumentativa do grego; “pedidos que lhe fizemos” evita a formulação pouco natural “pedidos que pedimos” sem perder a ligação lexical principal entre pedir e pedidos.
