  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: pt
  text: Escrevi estas coisas a vocês que creem no nome do Filho de Deus,[a] para que saibam que têm a vida eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto a ordem do grego, embora de forma menos natural: «Escrevi estas coisas a vocês para que saibam que têm a vida eterna, a vocês que creem no nome do Filho de Deus».'
    reason: alternativa sintática
lexical_decisions:
- source_word: Ταῦτα
  choice: estas coisas
  rationale: O demonstrativo neutro plural remete naturalmente ao conteúdo escrito da carta ou à exposição anterior e preserva o plural grego.
- source_word: ἔγραψα
  choice: Escrevi
  rationale: O aoristo epistolar apresenta a ação de escrever como realizada; o pretérito perfeito simples é natural em português.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Representa diretamente o objeto indireto dativo e oferece leitura amplamente compreensível em português moderno.
- source_word: ἵνα εἰδῆτε
  choice: para que saibam
  rationale: A construção expressa propósito, e o presente do subjuntivo é a forma portuguesa natural depois de «para que».
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: Expressão bíblica corrente que preserva tanto a duração quanto a qualidade da vida relacionada com Deus.
- source_word: ἔχετε
  choice: têm
  rationale: O presente do indicativo afirma posse atual, aspecto importante para a certeza comunicada pelo versículo.
- source_word: τοῖς πιστεύουσιν
  choice: a vocês que creem
  rationale: A locução participial dativa é entendida como aposição a ὑμῖν, identificando os destinatários, sem eliminar na nota a possibilidade sugerida pela ordem grega.
- source_word: πιστεύουσιν εἰς
  choice: creem no
  rationale: «Crer em» conserva o idioma joanino de confiança dirigida a uma pessoa e é natural no registro bíblico português.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Mantém o idioma bíblico que aponta para a pessoa revelada e sua autoridade, sem o reduzir a uma paráfrase interpretativa.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: do Filho de Deus
  rationale: Tradução direta do título cristológico e da construção genitiva grega.
theological_decisions:
- issue: Relação sintática e posição de τοῖς πιστεύουσιν
  choice: 'Ligado a ὑμῖν: «a vocês que creem no nome do Filho de Deus»'
  alternative: 'Ligado de modo retomador à afirmação anterior: «para que saibam que têm a vida eterna — vocês que creem no nome do Filho de Deus»'
  rationale: A primeira leitura comunica com naturalidade que os destinatários são os que creem e corresponde ao provável sentido. Contudo, a ordem grega coloca a expressão depois da afirmação sobre a vida eterna; por isso, a alternativa formal é preservada em nota, sem lhe atribuir uma diferença doutrinária indevida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega «vocês» para o plural e preserva expressões joaninas centrais, como «crer no nome» e «vida eterna».
