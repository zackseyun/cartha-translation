  text: Little children[a], guard yourselves from idols.
translation:
  language: pt
  text: Filhinhos[a], guardem-se dos ídolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Filhos” ou “Queridos filhos”. O termo grego é um diminutivo afetuoso usado por João ao dirigir-se diretamente aos seus leitores.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Filhinhos
  rationale: Vocativo plural diminutivo de τεκνίον, empregado por João como forma afetuosa de tratamento pastoral. “Filhinhos” preserva tanto a imagem familiar quanto a ternura do diminutivo.
- source_word: φυλάξατε
  choice: guardem-se
  rationale: Imperativo aoristo ativo na segunda pessoa do plural, expressando uma exortação direta à vigilância. Em combinação com o pronome reflexivo e ἀπό, “guardem-se” é natural em português e mantém a ideia de proteção vigilante.
- source_word: ἑαυτὰ
  choice: -se
  rationale: Pronome reflexivo que funciona como objeto do imperativo. O pronome “se” preserva naturalmente em português a referência reflexiva a quem recebe a exortação.
- source_word: ἀπὸ
  choice: de + os
  rationale: A preposição indica separação ou afastamento. Na construção portuguesa “guardar-se de”, ela é vertida naturalmente por “de”, contraído com o artigo em “dos”.
- source_word: εἰδώλων
  choice: ídolos
  rationale: εἴδωλον designa normalmente um ídolo ou imagem cultual e, por extensão, aquilo que recebe adoração falsa. “Ídolos” é a correspondência direta e clara, sem ampliar interpretativamente o sentido.
theological_decisions:
- issue: Alcance de “ídolos”
  choice: Traduzir concretamente como “ídolos”, sem expandir a expressão.
  alternative: “Tudo o que toma o lugar de Deus” ou “a falsa adoração em geral”.
  rationale: O grego menciona diretamente os ídolos. Embora a advertência possa ter implicações mais amplas, a tradução não deve inserir no texto uma generalização que a forma lexical não explicita.
translation_notes:
  register: Português moderno, claro e pastoral, com ampla legibilidade brasileira. “Filhinhos” conserva o tom afetuoso e familiar de João; “guardem-se dos ídolos” é conciso, digno e idiomático.
