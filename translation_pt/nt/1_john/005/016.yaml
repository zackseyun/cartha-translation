source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: pt
  text: Se alguém vir seu irmão[a] cometendo um pecado que não leva à morte[b], peça, e Deus[c] lhe dará vida — aos que cometem pecados que não levam à morte. Há pecado que leva à morte; não digo que peça a respeito desse pecado.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmão” está no singular masculino no grego e provavelmente se refere a outro crente; no contexto, o termo pode abranger de modo mais amplo um membro da comunidade cristã.
    reason: cultural_note
  - marker: b
    text: O grego não especifica se “morte” significa morte física, morte espiritual ou condenação final.
    reason: theological_ambiguity
  - marker: c
    text: O grego diz literalmente “e lhe dará vida”, sem nomear o sujeito. “Deus” foi explicitado porque, no contexto do pedido, ele é naturalmente entendido como aquele que dá a vida.
    reason: lexical_alternative
  - marker: d
    text: 'A frase grega também pode ser vertida: “não digo que ore a respeito desse pecado”. A formulação não equivale necessariamente a uma proibição expressa de orar.'
    reason: translation_nuance
lexical_decisions:
- source_word: ἀδελφὸν
  choice: irmão
  rationale: Mantém o singular masculino do grego e o uso joanino para um membro da comunidade de fé; o possível alcance mais amplo é esclarecido em nota.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: cometendo um pecado
  rationale: Expressa em português natural o particípio com acusativo cognato, preservando a referência a um ato concreto de pecado.
- source_word: μὴ πρὸς θάνατον
  choice: que não leva à morte
  rationale: Comunica a ideia de direção ou resultado de πρός sem definir que tipo de morte está em vista.
- source_word: αἰτήσει
  choice: peça
  rationale: Entende o futuro indicativo, neste contexto, com força de orientação ou exortação; o subjuntivo exortativo é natural em português.
- source_word: δώσει αὐτῷ ζωήν
  choice: Deus lhe dará vida
  rationale: Torna explícito o sujeito implícito, entendido no contexto da oração como Deus, e conserva ζωήν simplesmente como 'vida'.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: aos que cometem pecados que não levam à morte
  rationale: Preserva a mudança do singular para o plural e mantém a frase em posição explicativa após o travessão, sem eliminar sua dificuldade sintática.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Há pecado que leva à morte
  rationale: Conserva a formulação grega sem artigo e evita decidir se se trata de um ato específico ou de uma categoria de pecado.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: não digo que peça a respeito desse pecado
  rationale: Mantém a linguagem de pedido e traduz περὶ ἐκείνης de modo explícito e natural, sem transformar a afirmação numa proibição absoluta.
theological_decisions:
- issue: Sentido de 'morte' em 'pecado que leva à morte'
  choice: Manter apenas 'morte', sem qualificá-la.
  alternative: Interpretar como morte física, morte espiritual, condenação final ou escatológica.
  rationale: O versículo não define a natureza da morte; especificá-la resolveria indevidamente uma ambiguidade teológica genuína.
- issue: Identidade de quem dá vida
  choice: Explicitar Deus como sujeito, com nota textual.
  alternative: Deixar o referente pronominal ambíguo ou entender que a pessoa que pede dá vida.
  rationale: O contexto de pedido dirigido a Deus favorece fortemente Deus como aquele que concede vida, mas a nota reconhece que o sujeito não aparece expresso no grego.
- issue: Força da declaração final sobre pedir
  choice: Traduzir 'não digo que peça', sem formulá-la como proibição direta.
  alternative: Traduzir 'não deve pedir' ou 'não ore por esse pecado'.
  rationale: A construção nega que o autor esteja dizendo para fazer o pedido; ela não declara de forma inequívoca uma proibição.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. Empregou-se “seu irmão” em vez de uma expansão inclusiva no texto principal para preservar a forma grega, explicada em nota. O travessão conserva a relação explicativa e a dificuldade da passagem do referente singular para o plural.
