source:
  edition: SBLGNT
  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: pt
  text: Sabemos que somos de Deus, e que o mundo inteiro está sob o poder do Maligno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais formalmente, “o mundo inteiro jaz no Maligno”. “O Maligno” também pode ser entendido como “o mal”, mas, no uso de João, o sentido pessoal é mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Sabemos
  rationale: Expressa conhecimento seguro e preserva o tom de certeza da carta de modo natural em português.
- source_word: ἐκ τοῦ θεοῦ
  choice: somos de Deus
  rationale: Comunica origem ou pertencimento sem acrescentar a ideia mais específica de novo nascimento, que não está explícita nesta oração.
- source_word: ὁ κόσμος ὅλος
  choice: o mundo inteiro
  rationale: Reproduz a abrangência de ὅλος e é a formulação corrente e clara em português.
- source_word: ἐν τῷ πονηρῷ
  choice: sob o poder do Maligno
  rationale: Torna inteligível o estado de sujeição sugerido pela expressão grega; no uso joanino, o referente pessoal é mais provável.
- source_word: κεῖται
  choice: está
  rationale: Neste contexto, o verbo indica uma condição ou situação contínua; combinado com 'sob o poder', evita uma formulação artificial em português.
theological_decisions:
- issue: Se τῷ πονηρῷ designa o mal abstrato ou um agente pessoal
  choice: 'referente pessoal: “o Maligno”'
  alternative: 'referente abstrato: “o mal”'
  rationale: O uso joanino de ὁ πονηρός favorece a referência pessoal, como em 1 João 2:13–14; 3:12; 5:18. A possibilidade abstrata permanece registrada em nota.
- issue: Como representar a força de ἐν τῷ πονηρῷ
  choice: “sob o poder do Maligno”
  alternative: mais formalmente, “jaz no Maligno”
  rationale: A tradução principal comunica com clareza a sujeição do mundo sem identificar essa sujeição com posse absoluta; a nota preserva a forma mais próxima da metáfora grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “somos de Deus” preserva a concisão; “sob o poder do Maligno” esclarece a expressão idiomática, enquanto a nota conserva a formulação mais literal e a ambiguidade lexical.
