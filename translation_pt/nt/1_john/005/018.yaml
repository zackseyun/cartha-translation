id: 1JN.5.18
reference: 1 John 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: pt
  text: Sabemos que todo aquele que nasceu de Deus não peca[a]; pelo contrário, aquele que nasceu de Deus o guarda[b], e o Maligno não toca nele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Não peca” traduz o presente grego, que neste contexto pode referir-se ao pecado contínuo ou habitual, sem necessariamente afirmar que os crentes nunca cometem pecado; compare 1 João 1:8–10; 2:1.
    reason: cross_reference
  - marker: b
    text: 'Ou: “guarda a si mesmo”. Muitos intérpretes, porém, entendem que “aquele que nasceu de Deus” se refere a Jesus, o Filho, que guarda o crente.'
    reason: alternative_reading
  - marker: c
    text: “Tocar” pode ter aqui o sentido de agarrar ou atingir alguém para lhe causar dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Sabemos
  rationale: Embora οἶδα tenha forma de perfeito, funciona idiomaticamente como verbo estativo no presente; “sabemos” é natural e exato em português.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: todo aquele que nasceu de Deus
  rationale: A construção πᾶς ὁ com particípio é distributiva. O perfeito passivo indica nascimento de Deus com efeito permanente; a formulação escolhida mantém o conhecido modo de falar joanino em português atual.
- source_word: οὐχ ἁμαρτάνει
  choice: não continua pecando
  rationale: O presente grego tem aqui provável valor imperfectivo, indicando prática contínua ou habitual. A expressão evita afirmar impecabilidade absoluta e se harmoniza com 1 João 1:8–10 e 2:1.
- source_word: ἀλλ’
  choice: pelo contrário
  rationale: Marca um contraste corretivo mais forte do que uma simples continuação adversativa.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: aquele que nasceu de Deus
  rationale: A formulação não identifica explicitamente o referente, que pode ser entendido como o próprio crente ou como Jesus, o Filho. Assim, preserva-se a ambiguidade do grego.
- source_word: τηρεῖ αὐτόν
  choice: o guarda
  rationale: τηρέω pode significar guardar, preservar ou proteger. “O guarda” permanece próximo da forma grega e conserva a nuance protetora sem eliminar a ambiguidade do pronome αὐτόν.
- source_word: ὁ πονηρὸς
  choice: o Maligno
  rationale: O adjetivo substantivado com artigo, de acordo com o uso joanino, refere-se mais naturalmente a um agente pessoal, Satanás, e não ao mal abstrato.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: não toca nele
  rationale: ἅπτομαι significa literalmente tocar, mas pode sugerir agarrar ou atingir para causar dano. A tradução mantém a imagem original, e a nota explicita sua possível força contextual.
theological_decisions:
- issue: Sentido da afirmação no presente οὐχ ἁμαρτάνει
  choice: A frase nega a continuidade ou prática habitual do pecado.
  alternative: O nascido de Deus não comete pecado algum.
  rationale: O aspecto imperfectivo do presente favorece a ideia de conduta contínua. Essa leitura também preserva a coerência com 1 João 1:8–10 e 2:1, sem apagar a força da afirmação ética do versículo.
- issue: Referente de ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: O texto principal mantém “aquele que nasceu de Deus” sem identificar expressamente o referente.
  alternative: A expressão pode referir-se ao crente nascido de Deus ou especificamente a Jesus, o Filho de Deus.
  rationale: A sintaxe grega admite ambas as interpretações. Identificar o sujeito no texto principal resolveria uma ambiguidade real que o original não resolve explicitamente.
- issue: Relação de αὐτόν e αὐτοῦ com os participantes da frase
  choice: 'Os pronomes são entendidos como referentes ao crente: “o” e “nele”.'
  alternative: 'Se o sujeito de “guarda” for o próprio crente, αὐτόν pode ser compreendido em sentido reflexivo: “guarda a si mesmo”.'
  rationale: A forma do texto-fonte é αὐτόν, não um pronome reflexivo. “O guarda” reproduz essa forma, enquanto a nota registra a interpretação reflexiva possível sem impô-la.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com naturalidade brasileira. “Maligno” recebe inicial maiúscula por funcionar como designação pessoal. A repetição de “nasceu de Deus” foi mantida para refletir a repetição e a possível distinção de referentes no grego. As notas foram posicionadas junto às expressões que explicam.
