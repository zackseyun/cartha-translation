  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: pt
  text: E quem é que vence o mundo, senão aquele que crê que Jesus é o Filho de Deus?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «o que vence... o que crê». O grego usa particípios masculinos no singular com valor representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: quem
  rationale: Introduz uma pergunta retórica; «quem» é direto e natural em português.
- source_word: δέ
  choice: E
  rationale: Faz uma ligação leve com a afirmação anterior, sem exigir um contraste forte.
- source_word: ὁ νικῶν
  choice: aquele que vence
  rationale: Preserva o particípio substantivado e seu sentido característico ou contínuo, com valor representativo.
- source_word: τὸν κόσμον
  choice: o mundo
  rationale: Mantém a expressão do texto sem explicitar interpretativamente «sistema do mundo».
- source_word: εἰ μὴ
  choice: senão
  rationale: Expressa de modo idiomático a exceção exclusiva nessa pergunta retórica.
- source_word: ὁ πιστεύων
  choice: aquele que crê
  rationale: Preserva a força verbal do particípio substantivado e o sentido de fé ou confiança contínua.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo da fé, não uma oração causal.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva diretamente o título cristológico definido e seu peso confessional.
theological_decisions:
- issue: Valor genérico dos particípios masculinos singulares ὁ νικῶν e ὁ πιστεύων
  choice: aquele que vence / aquele que crê
  alternative: a pessoa que vence / a pessoa que crê
  rationale: «Aquele que» reproduz naturalmente em português a construção representativa no singular sem restringi-la aos homens; a nota registra a forma gramatical do grego.
- issue: Confissão cristológica em ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  alternative: 'o Filho de Deus (sem artigo antes de «Filho» em formulação possessiva alternativa: «Filho de Deus»)'
  rationale: A tradução mantém o título de identidade atribuído a Jesus sem ampliá-lo nem reduzir seu conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Crê» conserva o tom bíblico sem soar arcaico; «senão» dá naturalidade à pergunta retórica.
