id: 1JN.1.8
reference: 1 John 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: pt
  text: Se dissermos que não temos pecado[a], enganamos a nós mesmos, e a verdade não está em nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “pecaminosidade”; o grego diz literalmente “pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: A construção com ἐὰν e o aoristo do subjuntivo introduz uma condição; em português, “Se dissermos” é natural e preserva adequadamente essa força.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: não temos pecado
  rationale: Mantém o singular sem artigo como nome de massa e a construção grega de posse, referindo-se à presença do pecado, não especificamente a um ato isolado.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: enganamos a nós mesmos
  rationale: O pronome reflexivo enfático deixa claro que se trata de autoengano. A formulação é corrente e compreensível em português internacional, com boa legibilidade brasileira.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Preserva o artigo e a expressão joanina sem restringi-la apenas à sinceridade subjetiva ou apenas à verdade revelada por Deus.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: não está em nós
  rationale: Reproduz de modo natural a construção existencial com ἐν e conserva sua dimensão interior e pessoal.
theological_decisions:
- issue: Sentido de “pecado” na afirmação “não temos pecado”
  choice: “pecado” no singular, em sentido não contável, indicando a presença do pecado
  alternative: “não cometemos pecado” ou “não temos pecaminosidade”
  rationale: A expressão grega é literalmente “ter pecado” e contrasta com a linguagem sobre ter pecado no versículo 10. “Pecaminosidade” explicaria além do texto, enquanto “cometemos pecado” apagaria essa distinção.
- issue: Sentido joanino de “a verdade não está em nós”
  choice: Manter a formulação compacta “a verdade não está em nós”
  alternative: “a verdade de Deus não está em nós” ou “não vivemos na verdade”
  rationale: A redação preserva a possível ressonância tanto da verdade objetiva quanto da veracidade pessoal, sem resolver uma tensão que o grego mantém.
translation_notes:
  register: Português moderno, digno e direto, de alcance internacional e leitura natural no Brasil. A sintaxe permanece próxima do grego sem soar arcaica; evita-se ampliar ou harmonizar teologicamente as expressões concisas do texto.
