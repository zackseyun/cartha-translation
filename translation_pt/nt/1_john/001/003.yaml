id: 1JN.1.3
reference: 1 John 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: pt
  text: Aquilo que vimos e ouvimos, também anunciamos a vocês, para que vocês também tenham comunhão[a] conosco. E, de fato, a nossa comunhão é com o Pai e com seu Filho, Jesus, o Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Comunhão” também pode ser traduzida como “participação”, “compartilhamento” ou “vida em comum”; o termo destaca uma relação e uma vida compartilhadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “Jesus Cristo”. O título grego Χριστός pode ser vertido como “Cristo” ou traduzido como “Messias”; aqui, “Messias” explicita seu sentido como título.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὃ
  choice: Aquilo que
  rationale: Mantém a referência neutra e abrangente ao que foi visto e ouvido, sem transformá-la indevidamente em referência pessoal.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: vimos e ouvimos
  rationale: O pretérito perfeito é a forma natural em português para testemunhos de acontecimentos passados ainda relevantes; evita o sentido iterativo que “temos visto e ouvido” pode sugerir.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: também anunciamos a vocês
  rationale: “Anunciamos” expressa a comunicação declarativa do testemunho, e “também” representa o καὶ textualmente presente.
- source_word: ἵνα καὶ ὑμεῖς
  choice: para que vocês também
  rationale: Expressa com clareza a finalidade introduzida por ἵνα e preserva a ênfase inclusiva de καὶ ὑμεῖς.
- source_word: κοινωνίαν
  choice: comunhão
  rationale: Comunica participação compartilhada, vínculo e vida em comum, tanto com as testemunhas quanto com o Pai e o Filho, sem reduzir o termo a mera convivência social.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: E, de fato, a nossa comunhão
  rationale: “De fato” transmite a força explicativa e enfática de δέ nesta construção, enquanto “a nossa comunhão” verte naturalmente a expressão possessiva.
- source_word: τοῦ πατρὸς
  choice: o Pai
  rationale: A forma definida e titular corresponde ao uso joanino para Deus como Pai.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: seu Filho
  rationale: Preserva de modo idiomático a relação filial expressa pelo genitivo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Verte Χριστός como título e usa uma aposição idiomática em português, deixando explícito que Jesus é o Messias.
theological_decisions:
- issue: Sentido de κοινωνία
  choice: comunhão
  alternative: participação; compartilhamento; vida em comum
  rationale: “Comunhão” preserva simultaneamente as dimensões relacional e participativa do termo, sem decidir se a ênfase é apenas comunitária, espiritual ou sacramental.
- issue: Tradução de Χριστοῦ
  choice: o Messias
  alternative: Cristo
  rationale: Neste sintagma, Χριστός conserva valor titular; “o Messias” torna esse sentido transparente em português, enquanto a nota registra a forma tradicional alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “A vocês” evita regionalizar o plural de segunda pessoa; “Aquilo que” preserva a referência neutra do grego. A pontuação divide a longa frase grega em duas orações sem alterar sua relação lógica.
