  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: pt
  text: Se dissermos que temos comunhão com ele, mas andarmos nas trevas[a], estamos mentindo e não praticamos a verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na escuridão”. O grego traz uma expressão com artigo definido, que no uso joanino pode destacar a esfera moral e espiritual oposta a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não fazemos a verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: Preserva de modo natural a condição expressa por ἐάν com o subjuntivo, sem acrescentar a nuance potencialmente interpretativa de “afirmarmos”.
- source_word: κοινωνίαν ἔχομεν
  choice: temos comunhão
  rationale: Mantém a construção e o sentido relacional de κοινωνία em português bíblico atual e compreensível.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Traduz diretamente a associação indicada por μετά com o genitivo e preserva o pronome do grego, sem explicitar seu referente.
- source_word: ἐν τῷ σκότει
  choice: nas trevas
  rationale: “Trevas” é a expressão portuguesa consagrada e natural para a esfera moral e espiritual evocada pelo termo joanino; o artigo definido mantém essa força temática.
- source_word: περιπατῶμεν
  choice: andarmos
  rationale: Conserva a metáfora bíblica de caminhar como modo de viver, sem reduzi-la a uma explicação.
- source_word: ψευδόμεθα
  choice: estamos mentindo
  rationale: Expressa naturalmente a ação presente e realça a incoerência contínua entre o que se diz e como se vive.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: não praticamos a verdade
  rationale: Verte de forma idiomática a expressão joanina literalmente equivalente a “não fazemos a verdade”, preservando seu caráter concreto e ético.
theological_decisions:
- issue: Metáfora moral e espiritual das trevas
  choice: nas trevas
  alternative: em pecado; na escuridão
  rationale: Preserva a categoria joanina carregada de sentido moral, espiritual e relacional, sem limitá-la por meio de uma paráfrase doutrinária.
- issue: Fazer a verdade
  choice: não praticamos a verdade
  alternative: não fazemos a verdade; não vivemos de acordo com a verdade
  rationale: “Praticamos” mantém a dimensão ativa da expressão grega sem soar artificial, enquanto evita explicar a verdade apenas como conformidade a um conjunto de proposições.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A metáfora “andar nas trevas” e o termo “comunhão” foram mantidos por serem naturais no registro bíblico e importantes para a linguagem temática de João.
