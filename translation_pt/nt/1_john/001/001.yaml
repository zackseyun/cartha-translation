id: 1JN.1.1
reference: 1 John 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: pt
  text: O que era desde o princípio,[a] o que ouvimos, o que vimos com os nossos olhos, o que contemplamos e as nossas mãos tocaram, a respeito da palavra da vida[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquilo que era desde o princípio”. O grego usa um pronome relativo neutro, que pode apontar de modo amplo para o testemunho apostólico a respeito do Filho, em vez de identificá-lo diretamente como “aquele”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a Palavra da vida”. A expressão pode referir-se pessoalmente ao Filho, em deliberada ressonância com João 1.1, ou à mensagem que dá vida e fala a respeito dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: O que
  rationale: Os pronomes relativos neutros repetidos abrangem aquilo de que se dá testemunho, sem transformar explicitamente o referente em um pronome pessoal masculino.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: era desde o princípio
  rationale: Reproduz de modo natural o imperfeito ἦν e a expressão temporal joanina, preservando sua profundidade sem acrescentar uma nuance aspectual indevida.
- source_word: ἀκηκόαμεν
  choice: ouvimos
  rationale: Em português, o pretérito perfeito simples é a forma idiomática para o perfeito grego neste testemunho de uma experiência passada com relevância presente; «temos ouvido» sugeriria repetição ou continuidade não exigida.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: vimos com os nossos olhos
  rationale: Mantém a concretude e a ênfase explícita do testemunho ocular; o pretérito perfeito simples é natural em português.
- source_word: ἐθεασάμεθα
  choice: contemplamos
  rationale: Expressa uma observação atenta, mais deliberada que simplesmente «vimos», em linguagem atual e digna.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: as nossas mãos tocaram
  rationale: Preserva de modo claro a fisicalidade do testemunho. «Apalparam» seria possível, mas pode soar estranho ou inadequado no português corrente.
- source_word: περὶ
  choice: a respeito de
  rationale: Introduz naturalmente o assunto do testemunho, mantendo registro digno sem a rigidez de «concernente a».
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: a palavra da vida
  rationale: Mantém a amplitude de λόγος entre palavra, mensagem e possível referência pessoal, sem resolver pela capitalização uma ambiguidade que o grego não marca.
theological_decisions:
- issue: Referente das orações relativas neutras e de λόγος
  choice: Empregar «O que» e «a palavra da vida» em minúscula no texto principal.
  alternative: Traduzir pessoalmente como «Aquele que era desde o princípio» ou usar «a Palavra da vida» com inicial maiúscula.
  rationale: O contexto é cristológico, mas o grego emprega pronomes relativos neutros e não indica capitalização. A tradução conserva a forma textual e deixa em aberto tanto a referência ao Filho quanto ao testemunho e à mensagem a seu respeito.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A cadeia anafórica «o que» e o travessão final preservam a estrutura suspensa do prólogo, que continua no versículo seguinte.
