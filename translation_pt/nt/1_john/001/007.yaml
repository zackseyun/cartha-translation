id: 1JN.1.7
reference: 1 John 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: pt
  text: Mas, se andarmos na luz, como ele mesmo está na luz, temos comunhão uns com os outros[a], e o sangue de Jesus, seu Filho, nos purifica de todo pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre si”. Alguns intérpretes entendem “uns com os outros” como a comunhão entre os fiéis e Deus, mas a expressão recíproca grega se refere mais naturalmente à comunhão mútua entre os fiéis.
    reason: alternative_reading
  - marker: b
    text: Ou “de todos os pecados”. O grego pode ser entendido distributivamente (“todo pecado”) ou coletivamente (“todo o pecado”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mas, se
  rationale: δέ contrasta esta condição com a afirmação do versículo anterior sobre andar nas trevas; “Mas, se” expressa essa força adversativa de modo natural.
- source_word: ἐν τῷ φωτὶ
  choice: na luz
  rationale: Preserva a imagem joanina e sua formulação temática, sem explicar além do que o texto diz.
- source_word: περιπατῶμεν
  choice: andarmos
  rationale: Mantém a metáfora ética de “andar”, em vez de interpretá-la simplesmente como “viver”; o presente do subjuntivo comunica uma conduta contínua ou habitual no contexto.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: como ele mesmo está na luz
  rationale: “Ele mesmo” reflete a presença enfática de αὐτός, e “como” conserva a comparação sem impor uma equivalência mais estrita do que o grego exige.
- source_word: κοινωνίαν ἔχομεν
  choice: temos comunhão
  rationale: “Comunhão” expressa participação compartilhada e vínculo relacional, sendo natural no contexto, sem tornar a expressão especificamente sacramental.
- source_word: μετ’ ἀλλήλων
  choice: uns com os outros
  rationale: É uma tradução portuguesa natural da expressão recíproca e preserva sua ideia de mutualidade.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: o sangue de Jesus
  rationale: Mantém “sangue” como sujeito destacado da oração e preserva o peso teológico da formulação.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: seu Filho
  rationale: Traduz naturalmente o genitivo e identifica Jesus em sua relação com Deus, sem acrescentar conteúdo ao original.
- source_word: καθαρίζει
  choice: purifica
  rationale: “Purifica” comunica a remoção da impureza moral e preserva possíveis ressonâncias cultuais. O presente simples pode indicar ação contínua ou característica sem a expansão interpretativa “continua purificando”.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de todo pecado
  rationale: A expressão é idiomática em português e pode comunicar a abrangência completa; a possível leitura distributiva ou coletiva é registrada em nota.
theological_decisions:
- issue: Referente de μετ’ ἀλλήλων (“uns com os outros”)
  choice: comunhão mútua entre os fiéis
  alternative: comunhão entre os fiéis e Deus
  rationale: O pronome recíproco ἀλλήλων indica mais naturalmente mutualidade entre pessoas. O contexto mais amplo inclui comunhão com Deus, mas esta expressão não deve ser reformulada para resolver a questão de maneira teologicamente interpretativa.
- issue: Força do presente καθαρίζει
  choice: ação contínua ou característica expressa pelo presente simples “purifica”
  alternative: purificação pontual ou formulação explicitamente progressiva, como “continua purificando”
  rationale: O presente grego favorece uma ação em curso ou característica neste contexto, mas o presente simples em português preserva essa possibilidade sem exagerar a explicitação aspectual.
- issue: Valor de πάσης ἁμαρτίας
  choice: “todo pecado”, mantendo aberta a abrangência distributiva ou coletiva
  alternative: “todos os pecados” ou “todo o pecado”
  rationale: O singular com πάσης admite compreensão distributiva (“cada/todo pecado”) ou coletiva (“todo o pecado”). A tradução principal é natural e a nota preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “andar na luz” e a linguagem teológica de “comunhão”, “sangue” e “purifica” foram preservadas sem paráfrase explicativa. Os marcadores de nota foram posicionados junto às expressões efetivamente comentadas.
