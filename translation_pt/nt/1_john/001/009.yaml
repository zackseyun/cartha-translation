  source_fidelity: A estrutura condicional, a confissão dos pecados, a dupla caracterização divina e os dois efeitos — perdão e purificação — são transmitidos com fidelidade. Convém, porém, explicitar também na segunda ocorrência que os pecados são «nossos», como no grego (ἡμῖν τὰς ἁμαρτίας), sem depender de uma inferência contextual.
  naturalness: «Para nos perdoar os nossos pecados» é construção moderna, clara e natural para leitores brasileiros e internacionais. «De toda injustiça» é uma opção portuguesa defensável para ἀδικία e mantém sua amplitude moral.
  terminology: «Fiel e justo» traduz adequadamente πιστός καὶ δίκαιος. A nota «Ou “reto”» preserva uma alternativa lexical legítima sem impor uma leitura teológica. «Purificar» expressa bem καθαρίσῃ no contexto de impureza moral.
