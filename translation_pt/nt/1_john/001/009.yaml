  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: pt
  text: Se confessarmos os nossos pecados, ele é fiel e justo[a] para nos perdoar os nossos pecados e nos purificar de toda injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição eventual; “se” preserva naturalmente a força condicional sem acrescentar a ideia de repetição.
- source_word: ὁμολογῶμεν
  choice: confessarmos
  rationale: No contexto de pecados, expressa reconhecê-los ou admiti-los abertamente; “confessar” é preciso, claro e corrente.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: os nossos pecados
  rationale: Reproduz de modo idiomático o objeto direto e a relação possessiva do grego.
- source_word: πιστός
  choice: fiel
  rationale: Expressa a confiabilidade de Deus e sua constância; é o equivalente português natural neste contexto.
- source_word: δίκαιος
  choice: justo
  rationale: Em português, “justo” pode expressar tanto retidão moral quanto justiça, preservando melhor a amplitude do termo grego.
- source_word: ἵνα
  choice: para
  rationale: Com os subjuntivos seguintes, introduz finalidade ou resultado contemplado; “para” produz uma construção portuguesa natural sem eliminar essa relação.
- source_word: ἀφῇ ἡμῖν τὰς ἁμαρτίας
  choice: nos perdoar os pecados
  rationale: Mantém explicitamente o beneficiário no dativo e traduz ἀφίημι pelo sentido normal de “perdoar” no contexto do pecado.
- source_word: καθαρίσῃ
  choice: purificar
  rationale: Preserva a imagem da remoção da impureza moral e forma um paralelo claro com o perdão.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: de toda injustiça
  rationale: Conserva a amplitude moral e teológica de ἀδικία, que pode abranger injustiça, iniquidade e tudo o que é contrário à retidão.
theological_decisions:
- issue: Sentido de δίκαιος em relação ao perdão divino
  choice: justo
  alternative: reto
  rationale: O versículo fundamenta o perdão e a purificação no caráter de Deus. “Justo” preserva em português tanto sua retidão moral quanto a dimensão de justiça, sem restringir a frase a uma interpretação exclusivamente forense; “reto” explicita a dimensão moral e é registrado como alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A repetição de “pecados” foi mantida por corresponder ao texto grego, e “nos perdoar os pecados” conserva explicitamente o pronome dativo.
