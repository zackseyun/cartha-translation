  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: pt
  text: 'E esta é a mensagem que ouvimos dele e anunciamos[a] a vocês: Deus é luz, e nele não há escuridão alguma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proclamamos a vocês”.
    reason: Alternativa lexical para ἀναγγέλλομεν.
lexical_decisions:
- source_word: ἀγγελία
  choice: mensagem
  rationale: “Mensagem” é a forma mais natural no português atual e expressa adequadamente o conteúdo comunicado; “anúncio” preservaria a relação lexical com o verbo, mas seria menos fluente neste contexto epistolar.
- source_word: ἀκηκόαμεν
  choice: ouvimos
  rationale: O perfeito grego indica uma audição passada cujo conteúdo continua válido. Em português, “ouvimos” é mais natural aqui do que “temos ouvido”, que poderia sugerir repetição ou continuidade da ação.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: Mantém o pronome do grego sem explicitar interpretativamente “Jesus” ou “o Filho”.
- source_word: ἀναγγέλλομεν
  choice: anunciamos
  rationale: Expressa a transmissão pública da mensagem recebida e preserva, na medida possível, a relação com ἀγγελία. “Proclamamos” é uma alternativa válida, registrada em nota.
- source_word: ὅτι
  choice: ':'
  rationale: Em português, os dois-pontos introduzem de maneira natural o conteúdo da mensagem, sem precisar acrescentar “isto é” ou conservar um “que” pouco fluente após a oração inicial.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Deus é luz
  rationale: Preserva diretamente a metáfora qualitativa do grego, sem acrescentar artigo ou qualificadores interpretativos.
- source_word: σκοτία
  choice: escuridão
  rationale: “Escuridão” preserva tanto o sentido imagético quanto a ressonância moral e espiritual característica do contexto joanino.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: É a forma portuguesa natural e mantém a força metafórica da expressão sem explicá-la em excesso.
- source_word: οὐδεμία
  choice: alguma
  rationale: Na construção negativa “não há escuridão alguma”, reforça de maneira idiomática e enfática a ausência absoluta de escuridão.
theological_decisions:
- issue: Predicado metafórico “Deus é luz”
  choice: Manter a metáfora diretamente, sem expansão explicativa.
  alternative: “Deus é luz pura” ou “Deus é luz santa”.
  rationale: O grego apresenta a metáfora sem qualificadores. Acrescentar “pura” ou “santa” restringiria interpretativamente sua amplitude teológica e literária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a pontuação foram ajustadas à fluência portuguesa, mantendo a concisão, a ênfase e a metáfora do original.
