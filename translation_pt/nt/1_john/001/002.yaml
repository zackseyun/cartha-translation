  terminology: «Vida», «vida eterna», «Pai», «dar testemunho» e «proclamar» são escolhas adequadas e consistentes com o registro joanino. A nota explicativa deve associar a expressão ao Filho sem transformar uma inferência contextual em identificação textual direta dos «apóstolos».
