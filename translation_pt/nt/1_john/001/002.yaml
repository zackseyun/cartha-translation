  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: pt
  text: e a vida se manifestou[a], e nós a vimos, damos testemunho e proclamamos a vocês a vida eterna[b], que estava com o Pai e se manifestou a nós—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «apareceu» / «foi revelada», para «se manifestou» (ἐφανερώθη).
    reason: lexical_alternative
  - marker: b
    text: Embora a expressão «a vida eterna» seja gramaticalmente impessoal, no contexto ela é associada ao Filho, que estava com o Pai e se manifestou a nós.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: a vida
  rationale: Mantém o substantivo definido e sua repetição, apresentando a vida como realidade específica vinculada pessoalmente ao Filho, sem substituir a expressão por um pronome pessoal.
- source_word: ἐφανερώθη
  choice: se manifestou
  rationale: Expressa de modo natural em português o aoristo passivo, comunicando que aquilo que não estava visível se tornou manifesto. A alternativa «foi revelada» também é possível, mas pode sugerir mais a transmissão de informação do que uma aparição histórica perceptível.
- source_word: ἑωράκαμεν
  choice: nós a vimos
  rationale: O pretérito perfeito é a forma portuguesa mais natural para a experiência concluída das testemunhas. O pronome «a» retoma «a vida» e evita a possível leitura de «vimos» como forma do verbo «vir».
- source_word: μαρτυροῦμεν
  choice: damos testemunho
  rationale: Preserva o sentido de testemunho baseado no que foi visto e soa natural e digno em português contemporâneo.
- source_word: ἀπαγγέλλομεν
  choice: proclamamos
  rationale: Distingue a proclamação dirigida aos leitores do ato de dar testemunho e conserva a força declarativa pública do verbo.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Representa explicitamente o objeto indireto plural em português amplamente compreensível, com boa legibilidade brasileira.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: a vida eterna
  rationale: Mantém a definitude da expressão grega e identifica a vida mencionada como a vida eterna, sem acrescentar uma explicação pessoal ao texto principal.
- source_word: ἥτις
  choice: que
  rationale: Retoma gramaticalmente «a vida eterna». Embora o referente seja pessoal no contexto, «que» preserva a formulação do autor sem substituí-la por «quem» ou «ele».
- source_word: ἦν πρὸς τὸν πατέρα
  choice: estava com o Pai
  rationale: É a formulação idiomática que preserva a relação e proximidade expressas por πρὸς, em continuidade com a linguagem joanina, sem paráfrase doutrinária.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: A inicial maiúscula sinaliza o uso de «Pai» como título divino neste contexto.
- source_word: ἡμῖν
  choice: a nós
  rationale: Mantém explícito o objeto indireto e reforça a dimensão do testemunho apostólico.
theological_decisions:
- issue: Se a «vida» repetida deve ser traduzida de modo impessoal ou explicitamente pessoal
  choice: Manter «a vida» e «a vida eterna» no texto principal, permitindo que o referente pessoal emerja do contexto.
  alternative: Substituir por «ele» ou acrescentar diretamente «o Filho».
  rationale: O grego emprega o substantivo ζωὴ, não um pronome pessoal masculino nem o nome «Filho». A formulação nominal conserva a riqueza e a tensão teológica joaninas sem introduzir uma explicação no corpo do texto.
- issue: Até que ponto explicitar a preexistência em πρὸς τὸν πατέρα
  choice: estava com o Pai
  alternative: estava na presença do Pai
  rationale: A tradução afirma a relação anterior com o Pai e preserva a linguagem da fonte, sem ampliar a frase com uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. «A vocês» evita regionalismo excessivo; «damos testemunho» conserva o tom solene sem arcaísmo. A coordenação repetida por «e» acompanha o ritmo enfático do grego, e o travessão final preserva a continuidade sintática com os versículos ao redor.
