  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: pt
  text: E nós escrevemos estas coisas para que a nossa alegria seja completa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos trazem «a alegria de vocês» em vez de «a nossa alegria».
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que liga naturalmente esta declaração ao testemunho dos versículos anteriores.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o plural neutro e remete ao conteúdo que está sendo escrito.
- source_word: γράφομεν ἡμεῖς
  choice: escrevemos
  rationale: O presente epistolar soa natural em português como presente simples; a primeira pessoa do plural já está expressa na forma verbal. O pronome grego explícito acrescenta ênfase, mas vertê-lo como «nós escrevemos» tornaria a frase mais marcada do que o necessário neste contexto.
- source_word: ἵνα
  choice: para que
  rationale: Expressa de modo natural a finalidade, sem excluir a nuance de resultado.
- source_word: ἡ χαρά
  choice: a alegria
  rationale: Equivalente corrente e apropriado ao uso joanino.
- source_word: ἡμῶν
  choice: nossa
  rationale: Traduz diretamente a leitura do SBLGNT, na primeira pessoa do plural.
- source_word: ᾖ πεπληρωμένη
  choice: seja completa
  rationale: Comunica o estado resultante de plenitude expresso pela construção perifrástica com particípio perfeito passivo.
theological_decisions:
- issue: Pronome em ἡ χαρὰ ἡμῶν
  choice: a nossa alegria
  alternative: a alegria de vocês
  rationale: O texto grego fornecido lê ἡμῶν, «nossa». A variante «de vocês» é significativa e, por isso, é registrada em nota sem substituir a leitura do texto-base.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Mantém o encadeamento joanino por meio de «E» e preserva «estas coisas» em vez de comprimir o demonstrativo plural.
