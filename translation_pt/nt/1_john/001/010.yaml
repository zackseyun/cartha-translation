id: 1JN.1.10
reference: 1 John 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: pt
  text: Se dissermos que não pecamos[a], fazemos dele um mentiroso, e a palavra dele[b] não está em nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa um verbo no perfeito, indicando uma ação passada com relevância presente. Em português, “não pecamos” expressa esse sentido conforme o contexto.
    reason: grammatical_explanation
  - marker: b
    text: “A palavra dele” também pode ser traduzida como “a mensagem dele”. O termo grego λόγος admite ambos os sentidos; “palavra” foi mantido para preservar a linguagem característica de João.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Se dissermos
  rationale: A construção ἐὰν com o subjuntivo aoristo introduz uma condição; “Se dissermos” é natural em português e não acrescenta a nuance interpretativa de “Se afirmarmos”.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: não temos pecado
  rationale: O perfeito grego apresenta o pecado passado com relevância presente. A locução portuguesa conserva melhor esse aspecto do que o simples “não pecamos”, sem ampliar o sentido para “nunca pecamos”.
- source_word: ψεύστην
  choice: um mentiroso
  rationale: ψεύστης é um substantivo e deve conservar sua força direta e pessoal, sem ser atenuado por “falso” ou “enganador”.
- source_word: ποιοῦμεν αὐτὸν
  choice: fazemos dele
  rationale: A formulação expressa idiomaticamente em português o sentido de considerar ou declarar alguém como algo, evitando a possível leitura causal pouco natural de “fazemos a ele”.
- source_word: ὁ λόγος αὐτοῦ
  choice: a palavra dele
  rationale: λόγος pode designar “palavra” ou “mensagem”. “Palavra” preserva a linguagem joanina e sua amplitude sem deixar obscuro, em português, o referente do possessivo.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: não está em nós
  rationale: A tradução direta conserva o sentido interior e relacional da expressão joanina, sem acrescentar a imagem interpretativa de habitação.
theological_decisions:
- issue: Referente de αὐτόν / αὐτοῦ
  choice: Manter o pronome em “dele”, tendo Deus como referente contextual.
  alternative: Explicitar “Deus” no texto principal.
  rationale: O contexto imediato aponta para Deus, mas o grego emprega pronome. A tradução preserva essa forma e permite que o contexto identifique o referente, sem resolver além do texto.
- issue: Alcance da negação de ter pecado
  choice: “não temos pecado”
  alternative: “nunca pecamos”
  rationale: “Nunca pecamos” tornaria explícita uma abrangência temporal que o perfeito grego, embora compatível com uma negação geral no contexto, não formula por si só.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fazemos dele um mentiroso” é idiomático e conserva a força acusatória do original. A colocação “a palavra dele” evita a ambiguidade referencial que “sua palavra” poderia produzir no português brasileiro.
