source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: pt
  text: E agora, filhinhos, permaneçam nele, para que, se ele for manifestado[a], tenhamos confiança e não nos afastemos dele envergonhados[b] na sua vinda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “se ele aparecer”. O verbo grego está na voz passiva: “for manifestado” ou “for revelado”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “não sejamos envergonhados diante dele”. A expressão também pode ser entendida, de modo mais literal, como vergonha em sua presença, sem destacar a ideia de afastamento.
    reason: alternative_reading
  - marker: c
    text: Ou “na sua presença”. Neste contexto, “vinda” expressa o sentido escatológico do termo grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: filhinhos
  rationale: Vocativo afetivo e diminutivo. “Filhinhos” preserva a linguagem familiar e pastoral joanina de modo natural em português.
- source_word: μένετε
  choice: permaneçam
  rationale: Preserva o sentido durativo e relacional do termo-chave joanino μένω, em linguagem atual e digna.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Mantém de forma concisa a metáfora relacional “nele”, sem explicá-la além do que o grego afirma.
- source_word: ἐὰν φανερωθῇ
  choice: se ele for manifestado
  rationale: Conserva tanto a condição expressa por ἐάν quanto a voz passiva de φανερωθῇ. “Quando ele se manifestar” seria mais idiomático, mas eliminaria a forma condicional; “se ele aparecer” suavizaria a passiva.
- source_word: σχῶμεν παρρησίαν
  choice: tenhamos confiança
  rationale: Expressa a abertura confiante diante de Deus característica do uso joanino de παρρησία, sem a possível conotação confrontadora de “ousadia”.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: não nos afastemos dele envergonhados
  rationale: Reproduz a vergonha indicada pelo verbo e a noção de afastamento sugerida por ἀπό, sem converter a frase em condenação judicial.
- source_word: παρουσίᾳ
  choice: vinda
  rationale: No contexto escatológico, “vinda” comunica com clareza o sentido estabelecido de παρουσία, enquanto “presença” preserva uma possibilidade mais literal registrada em nota.
theological_decisions:
- issue: Referente dos pronomes e manifestação escatológica
  choice: Os pronomes são entendidos contextualmente como referentes ao Filho, Jesus Cristo, e παρουσία é traduzida como sua futura “vinda”.
  alternative: Entender o referente de modo mais geral como Deus, sem especificar o Filho.
  rationale: O contexto imediato trata de permanecer no Filho e de sua manifestação. A tradução não acrescenta o nome “Cristo” ao versículo, preservando a forma pronominal do original.
- issue: Força condicional de ἐὰν φανερωθῇ
  choice: “se ele for manifestado”
  alternative: “quando ele se manifestar” ou “se ele aparecer”
  rationale: A formulação mantém a partícula condicional e a voz passiva, sem sugerir dúvida teológica sobre a futura vinda; trata-se de fidelidade à construção grega e à sua ambiguidade formal.
- issue: Nuance da vergonha na vinda de Cristo
  choice: “não nos afastemos dele envergonhados”
  alternative: “não sejamos envergonhados diante dele”
  rationale: A combinação de αἰσχυνθῶμεν com ἀπ’ αὐτοῦ pode sugerir recuo ou afastamento por vergonha. A alternativa mais estática permanece em nota, sem interpretar a advertência como condenação final.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. “Filhinhos” retém o tom pastoral afetivo; “permaneçam” preserva o vocabulário joanino. A sintaxe mantém deliberadamente a condição “se” e a passiva “for manifestado”, enquanto notas oferecem opções idiomáticas e literais. Todos os marcadores de nota aparecem no texto principal.
