  text: Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/026.yaml
  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: pt
  text: Escrevi estas coisas a vocês a respeito dos que os estão desviando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que os enganam” ou “dos que os induzem ao erro”. O particípio grego descreve pessoas que exercem essa ação contra os destinatários, sem especificar se ela teve êxito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: estas coisas
  rationale: O demonstrativo neutro plural retoma naturalmente o conteúdo escrito anteriormente.
- source_word: ἔγραψα
  choice: Escrevi
  rationale: O aoristo indica o ato de escrever como concluído; o pretérito perfeito é natural em português epistolar.
- source_word: ὑμῖν
  choice: a vocês
  rationale: O dativo identifica os destinatários. A forma é clara e amplamente compreensível em português moderno.
- source_word: περὶ
  choice: a respeito de
  rationale: Introduz o assunto sobre o qual o autor escreveu, mantendo um registro digno e corrente.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: dos que procuram desviá-los
  rationale: Preserva a ideia de fazer alguém afastar-se do caminho ou da verdade e, com “procuram”, não afirma que a tentativa já tenha alcançado êxito.
theological_decisions:
- issue: Se πλανώντων descreve engano bem-sucedido ou atividade dirigida a desviar os leitores
  choice: dos que procuram desviá-los
  alternative: dos que os estão desviando; dos que os enganam
  rationale: O particípio identifica essas pessoas por sua atuação contra os leitores, sem exigir que tenham conseguido enganá-los. A formulação preserva essa tensão sem afirmar o resultado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “A vocês” evita regionalismo excessivo, e “desviá-los” conserva a imagem direcional de πλανάω.
