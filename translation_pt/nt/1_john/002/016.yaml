id: 1JN.2.16
reference: 1 John 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: pt
  text: Pois tudo o que há no mundo — o desejo da carne[a], o desejo dos olhos e a arrogância da vida[b] — não vem do Pai, mas vem do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cobiça da carne”. A palavra grega pode significar desejo intenso, cobiça ou paixão; “desejo” evita restringir o sentido ao desejo sexual. “Carne” também pode referir-se, metaforicamente, à condição humana inclinada ao pecado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a ostentação da vida”, “a pretensão do modo de viver”. A expressão pode incluir arrogância quanto à posição, aos bens ou ao modo de vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão explicativa da exortação anterior, preservando de modo natural o valor causal.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: tudo o que há no mundo
  rationale: A construção neutra singular tem sentido coletivo; esta formulação preserva sua abrangência em português natural.
- source_word: κόσμῳ / κόσμου
  choice: mundo
  rationale: Mantém o termo amplo e o contraste joanino com o Pai, sem inserir no texto uma explicação como “sistema mundano”.
- source_word: ἐπιθυμία
  choice: desejo
  rationale: O termo pode indicar desejo intenso, cobiça ou paixão. “Desejo” conserva a amplitude sem limitar o sentido ao campo sexual.
- source_word: τῆς σαρκὸς
  choice: da carne
  rationale: Preserva a imagem e a tensão teológica de σάρξ, evitando explicá-la como “natureza pecaminosa” no próprio texto.
- source_word: τῶν ὀφθαλμῶν
  choice: dos olhos
  rationale: Tradução direta do genitivo plural, clara e idiomática em português.
- source_word: ἡ ἀλαζονεία τοῦ βίου
  choice: a arrogância da vida
  rationale: ἀλαζονεία denota arrogância, ostentação ou pretensão; βίος pode abranger modo de viver, recursos e posição. A formulação concisa preserva a ambiguidade da expressão.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: não vem do Pai
  rationale: Comunica com clareza a ideia de fonte ou origem expressa por ἐκ.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: mas vem do mundo
  rationale: Mantém o paralelismo e o contraste de origem entre o Pai e o mundo.
theological_decisions:
- issue: Sentido de σάρξ numa lista moral
  choice: carne
  alternative: natureza pecaminosa
  rationale: “Carne” conserva a metáfora original e não impõe uma antropologia específica; a possível leitura metafórica é indicada em nota.
- issue: Sentido de κόσμος
  choice: mundo
  alternative: sistema mundano
  rationale: O contexto indica uma ordem contrária ao Pai, mas explicitar isso na tradução estreitaria a polissemia do termo grego.
- issue: Alcance de ἀλαζονεία τοῦ βίου
  choice: arrogância da vida
  alternative: ostentação dos bens / orgulho do modo de viver
  rationale: A expressão pode envolver orgulho, pretensão ou ostentação ligados ao modo de viver, aos recursos ou à posição; a tradução principal não seleciona apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “vem do Pai / vem do mundo” torna explícito em português o contraste paralelo de origem presente no grego. Os travessões delimitam naturalmente a enumeração explicativa.
