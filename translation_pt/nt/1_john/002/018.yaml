reference: 1 John 2:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: pt
  text: Filhinhos, é a última hora. Assim como vocês ouviram que o anticristo[a] vem, já surgiram muitos anticristos[b]. Por isso sabemos que é a última hora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um anticristo vem”. O substantivo grego não tem artigo, mas, em português, “o anticristo” pode indicar naturalmente a figura esperada que os leitores já conheciam pelo ensino recebido.
    reason: alternative_reading
  - marker: b
    text: Ou “apareceram” ou “vieram a existir”. O verbo grego está no perfeito e ressalta que muitos anticristos surgiram e agora estão presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Filhinhos
  rationale: Vocativo pastoral e familiar característico da carta. “Filhinhos” é natural no uso joanino em português e comunica afeto sem acrescentar um qualificativo como “queridos”.
- source_word: ἐσχάτη ὥρα
  choice: a última hora
  rationale: Preserva de modo transparente a metáfora temporal e seu peso escatológico, sem convertê-la numa cronologia literal nem explicá-la no corpo do texto.
- source_word: καθὼς ἠκούσατε
  choice: Assim como vocês ouviram
  rationale: Expressa a correspondência com o ensino anteriormente recebido e emprega uma forma de tratamento amplamente compreensível no português moderno.
- source_word: ἀντίχριστος
  choice: o anticristo
  rationale: Embora o substantivo grego esteja sem artigo, o português normalmente requer artigo ao falar de uma figura esperada e reconhecida. A nota preserva a questão da ausência do artigo no grego.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente tem orientação futura no contexto; “vem” mantém a concisão e a expectativa de chegada.
- source_word: καὶ νῦν
  choice: agora mesmo
  rationale: Torna perceptível a ênfase na realidade presente, em contraste com aquilo que os leitores ouviram sobre a vinda do anticristo.
- source_word: ἀντίχριστοι πολλοὶ
  choice: muitos anticristos
  rationale: Mantém a ligação lexical deliberada entre o singular e o plural, sem substituir o termo por uma interpretação explicativa.
- source_word: γεγόνασιν
  choice: têm surgido
  rationale: Comunica o surgimento dessas figuras e sua relevância presente, refletindo o aspecto resultativo do perfeito grego.
- source_word: ὅθεν γινώσκομεν
  choice: Por isso sabemos
  rationale: Apresenta a inferência extraída do surgimento de muitos anticristos em linguagem portuguesa natural.
theological_decisions:
- issue: Sentido de “a última hora”
  choice: Manter a expressão escatológica “a última hora” sem especificar sua duração.
  alternative: Explicá-la como um instante cronológico estritamente iminente ou apenas como uma crise retórica.
  rationale: O contexto confere significado escatológico à expressão, mas não define aqui uma duração literal nem autoriza reduzir a frase a uma simples figura de crise.
- issue: Relação entre “o anticristo” e “muitos anticristos”
  choice: Preservar a figura singular esperada e a pluralidade já presente.
  alternative: Tratar o singular apenas como categoria genérica ou explicitá-lo como um indivíduo plenamente definido.
  rationale: A justaposição é intencional no texto e deve permanecer sem harmonização com um esquema escatológico específico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Vocês” evita regionalismo excessivo na segunda pessoa plural; “Filhinhos” conserva o tom pastoral joanino. A pontuação divide o período grego longo em frases naturais sem alterar sua progressão lógica.
