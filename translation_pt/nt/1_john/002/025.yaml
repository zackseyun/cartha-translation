  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: pt
  text: 'E esta é a promessa que ele mesmo[a] nos fez: a vida eterna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não declara aqui de modo explícito se «ele mesmo» se refere ao Pai ou ao Filho.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὕτη ἐστὶν
  choice: E esta é
  rationale: Mantém a ligação com o contexto anterior e reproduz de modo direto a construção demonstrativa do grego.
- source_word: ἡ ἐπαγγελία
  choice: a promessa
  rationale: O substantivo designa uma promessa ou dádiva prometida; «a promessa» é a tradução mais direta e natural em português.
- source_word: αὐτός
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome grego sem identificar explicitamente seu referente.
- source_word: ἐπηγγείλατο ἡμῖν
  choice: nos fez
  rationale: Na expressão portuguesa «fez uma promessa», esta formulação evita a repetição pouco natural de «promessa que prometeu», ao mesmo tempo que comunica com clareza o ato de prometer e o objeto indireto.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: a vida eterna
  rationale: A expressão está em aposição e identifica o conteúdo da promessa. O artigo definido é natural em português e corresponde ao grego.
theological_decisions:
- issue: Referente de «ele mesmo» (αὐτός)
  choice: Mantido como «ele mesmo», sem identificar o referente.
  alternative: Explicitar «o Pai» ou «o Filho».
  rationale: O versículo não repete expressamente o antecedente, e o contexto admite discussão sobre o referente. A tradução conserva a abertura do texto em vez de decidir a questão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Nos fez» completa naturalmente «a promessa» e evita uma repetição pesada, sem alterar o sentido. A ênfase de αὐτός foi preservada em «ele mesmo».
