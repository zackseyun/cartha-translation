base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: pt
  text: Escrevo a vocês[a], filhinhos, porque[b] os seus pecados foram perdoados por causa do nome dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estou escrevendo a vocês”. O presente grego pode ser traduzido como presente simples ou como forma progressiva em contexto epistolar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que”, entendendo a conjunção como introdução ao conteúdo do que João escreve. Aqui, “porque” provavelmente indica a razão de ele escrever.'
    reason: alternative_reading
  - marker: c
    text: O contexto pode levar à compreensão de que “dele” se refere a Deus ou a Jesus; o grego não identifica expressamente o referente neste versículo.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω ὑμῖν
  choice: Escrevo a vocês
  rationale: O presente grego pode ser simples ou progressivo em contexto epistolar. “Escrevo a vocês” é a forma mais natural em português e representa o ato de escrever sem acrescentar uma nuance ausente do texto.
- source_word: τεκνία
  choice: filhinhos
  rationale: O diminutivo vocativo expressa vínculo familiar e afeto, não necessariamente pouca idade. “Filhinhos” conserva essa ternura de modo conciso.
- source_word: ὅτι
  choice: porque
  rationale: No contexto, a conjunção provavelmente introduz a razão pela qual João escreve. A possibilidade de introduzir o conteúdo da escrita é preservada em nota.
- source_word: ἀφέωνται
  choice: foram perdoados
  rationale: O perfeito passivo indica um ato concluído cujos efeitos permanecem. Em português corrente, “foram perdoados” comunica naturalmente o ato passivo consumado; o contexto sustenta sua validade presente.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: os seus pecados
  rationale: A construção grega associa os pecados aos destinatários por meio do dativo. O possessivo é a expressão idiomática correspondente em português.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: por causa do nome dele
  rationale: διά com acusativo expressa causa ou fundamento. A formulação mantém “nome” e sua relevância pessoal e teológica, sem reduzi-lo a mera reputação.
- source_word: ὄνομα
  choice: nome
  rationale: “Nome” preserva a linguagem bíblica e sua amplitude pessoal e teológica.
theological_decisions:
- issue: Referente de αὐτοῦ em “nome dele”
  choice: Mantido como “dele”, sem identificar expressamente o referente
  alternative: “de Deus” ou “de Jesus”
  rationale: O versículo não nomeia de modo explícito o referente, e o contexto mais amplo admite discussão. Manter o pronome preserva a ambiguidade do texto sem impor uma resolução teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “A vocês” evita um tratamento regionalmente restrito; “filhinhos” conserva o tom afetuoso; “dele” mantém a referência masculina sem resolver sua identidade.
