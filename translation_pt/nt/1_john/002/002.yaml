source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: pt
  text: E ele mesmo é o sacrifício de expiação pelos nossos pecados[a], e não somente pelos nossos pecados, mas também pelos pecados do mundo inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sacrifício propiciatório por nossos pecados”. O termo grego pode abranger as ideias de expiação e propiciação.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Reproduz o uso intensivo de αὐτός e destaca o papel pessoal de Jesus, sem acrescentar a ideia de exclusividade.
- source_word: ἱλασμός
  choice: sacrifício de expiação
  rationale: Expressa de modo compreensível o caráter sacrificial e expiatório do termo, sem decidir de forma estreita entre as dimensões tradicionalmente descritas como propiciação e expiação.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: pelos nossos pecados
  rationale: É a formulação portuguesa natural para a relação indicada por περί neste contexto de expiação.
- source_word: τῶν ἡμετέρων
  choice: pelos nossos
  rationale: Mantém a elipse do grego; “pecados” fica claramente subentendido pela oração anterior.
- source_word: ὅλου τοῦ κόσμου
  choice: do mundo inteiro
  rationale: Preserva a abrangência de ὅλου e κόσμου sem restringi-la por uma interpretação teológica posterior.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Reproduz com naturalidade a estrutura correlativa e enfática do grego.
theological_decisions:
- issue: Alcance de “o mundo inteiro”
  choice: Manter a expressão abrangente “o mundo inteiro” sem limitação interpretativa.
  alternative: “pessoas do mundo inteiro” ou “os eleitos espalhados pelo mundo”
  rationale: O grego não explicita tais limitações; a tradução preserva a amplitude e a tensão teológica do enunciado.
- issue: Sentido de ἱλασμός
  choice: Usar “sacrifício de expiação” no texto principal.
  alternative: “propiciação” ou “sacrifício propiciatório”
  rationale: A escolha é acessível e mantém o núcleo sacrificial do termo, enquanto a nota registra a alternativa teologicamente relevante sem resolver indevidamente a discussão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a ênfase de “ele mesmo”, a elipse de “pelos nossos” e a abrangência não restringida de “mundo inteiro”.
