source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: pt
  text: 'E nisto sabemos que chegamos a conhecê-lo: se guardarmos os seus mandamentos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que o temos conhecido”; o perfeito grego provavelmente comunica a ideia de “chegamos a conhecê-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: nisto
  rationale: Expressão joanina idiomática que introduz a base ou evidência pela qual algo é reconhecido; “nisto” preserva de modo natural a força demonstrativa.
- source_word: γινώσκομεν
  choice: sabemos
  rationale: O presente do indicativo exprime reconhecimento ou certeza atual; “sabemos” é a formulação portuguesa direta e natural.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: que chegamos a conhecê-lo
  rationale: O perfeito grego sugere o ato de chegar a conhecer com resultado duradouro. A formulação preserva essa nuance melhor que o simples “que o conhecemos”.
- source_word: αὐτόν
  choice: -lo
  rationale: Mantém o pronome masculino do grego sem especificar se o referente é Deus ou Cristo, preservando a ambiguidade contextual.
- source_word: ἐὰν
  choice: se
  rationale: Marcador condicional direto, que introduz a evidência ou prova apresentada na oração seguinte.
- source_word: ἐντολάς
  choice: mandamentos
  rationale: Preserva o peso moral e pactual do termo no uso joanino e mantém um registro bíblico claro, sem arcaísmo.
- source_word: τηρῶμεν
  choice: guardamos
  rationale: “Guardar” conserva a amplitude de τηρέω — observar, cumprir e manter — e também a linguagem característica dos escritos joaninos.
theological_decisions:
- issue: Referente de αὐτόν (“-lo”)
  choice: Manter o pronome sem identificar explicitamente o referente.
  alternative: Traduzir como “Deus” ou “Jesus/Cristo”.
  rationale: O texto grego emprega um pronome, e o contexto de 1 João mantém estreitamente relacionados o conhecimento de Deus e a relação com o Filho. Especificar o referente resolveria uma tensão que o versículo não resolve.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nisto”, “mandamentos” e “guardamos” preservam o estilo joanino e o registro bíblico sem recorrer a construções arcaicas.
