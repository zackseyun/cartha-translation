source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: pt
  text: Quanto a vocês, que aquilo que ouviram desde o princípio permaneça em vocês.[a] Se aquilo que ouviram desde o princípio permanecer em vocês, vocês também permanecerão no Filho e no Pai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, a mensagem apostólica original a respeito do Filho; o grego diz apenas «aquilo que ouviram».
    reason: lexical_alternative
  - marker: b
    text: «Permanecer» traduz o mesmo verbo grego nas três ocorrências deste versículo; também pode ser traduzido por «habitar».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Quanto a vocês
  rationale: O pronome anteposto é enfático e marca o tópico, em contraste com os que abandonaram a verdade; esta formulação expressa isso naturalmente em português.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: aquilo que ouviram desde o princípio
  rationale: Mantém a amplitude do pronome relativo neutro sem explicitar no texto principal «mensagem», «evangelho» ou «ensino apostólico».
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Preserva a expressão joanina e sua ligação com a proclamação recebida originalmente.
- source_word: ἐν ὑμῖν μενέτω
  choice: permaneça em vocês
  rationale: O imperativo presente pede continuidade. «Permanecer» é atual, claro e permite conservar a repetição deliberada de μένω.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Se ... permanecer em vocês
  rationale: Reproduz a condição introduzida por ἐάν e mantém a correspondência lexical com as demais formas de μένω no versículo.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: Conserva tanto o valor aditivo de καί quanto a ênfase do pronome explícito.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: no Filho e no Pai
  rationale: A repetição conceitual da preposição é preservada pelas contrações «no ... no», mantendo o paralelismo relacional.
- source_word: μενεῖτε
  choice: permanecerão
  rationale: Traduz diretamente o futuro do indicativo e conserva o vínculo verbal com as duas ocorrências anteriores de μένω.
theological_decisions:
- issue: Natureza da afirmação condicional na oração final
  choice: «vocês também permanecerão no Filho e no Pai»
  alternative: Entender a oração como mera exortação ou explicá-la segundo uma doutrina sistemática específica da perseverança.
  rationale: O grego apresenta uma afirmação futura condicionada à permanência do que foi ouvido. A tradução mantém essa tensão sem acrescentar conclusões confessionais.
- issue: Referente de «aquilo que ouviram desde o princípio»
  choice: Manter a expressão geral no texto principal.
  alternative: «o evangelho», «a mensagem» ou «o ensino apostólico que ouviram desde o princípio».
  rationale: O contexto aponta para a proclamação original a respeito do Filho, mas o texto grego usa um pronome relativo neutro e não nomeia explicitamente seu referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» como plural internacionalmente reconhecível e conserva a repetição joanina de «permanecer», evitando tanto o arcaísmo «permanecerdes» quanto paráfrases teologicamente mais estreitas.
