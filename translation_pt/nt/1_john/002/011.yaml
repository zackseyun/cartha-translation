id: 1JN.2.11
reference: 1 John 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: pt
  text: Mas quem odeia seu irmão está nas trevas e anda nas trevas[a], e não sabe para onde vai, porque as trevas cegaram seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmão ou irmã”; o grego diz “irmão” e provavelmente se refere a alguém da mesma comunidade de fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: quem odeia
  rationale: O particípio presente substantivado descreve de modo natural uma postura característica; “quem odeia” preserva o aspecto sem tornar o português artificial.
- source_word: ἀδελφὸν
  choice: seu irmão
  rationale: Mantém o singular masculino do grego e o provável sentido comunitário joanino; a possível referência abrangente a irmão ou irmã é indicada em nota.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nas trevas
  rationale: A formulação consagrada e natural em português preserva nas duas ocorrências a repetição e a imagem moral e teológica de João.
- source_word: περιπατεῖ
  choice: anda
  rationale: Preserva a metáfora bíblica do caminhar como modo de viver, sem substituí-la por uma explicação interpretativa.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: não sabe para onde vai
  rationale: Expressão portuguesa corrente que mantém a imagem de movimento presente no grego.
- source_word: ἐτύφλωσεν
  choice: cegaram
  rationale: O pretérito perfeito traduz diretamente o aoristo e, no contexto, a cegueira resultante permanece evidente.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: seus olhos
  rationale: Construção possessiva natural em português que conserva a imagem concreta dos olhos.
theological_decisions:
- issue: Sentido moral e espiritual de σκοτία no dualismo joanino
  choice: Traduzir literalmente pela imagem “trevas”
  alternative: “mal” ou “trevas do pecado”
  rationale: A metáfora mantém sua amplitude teológica e o contraste joanino com a luz, sem inserir no texto uma explicação doutrinária mais estreita.
- issue: Referente de ἀδελφός
  choice: Manter “irmão” no texto principal
  alternative: “irmão ou irmã” ou “companheiro na fé”
  rationale: O grego emprega o masculino singular, provavelmente com força representativa para um membro da comunidade cristã. A nota esclarece o alcance provável sem neutralizar a forma da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “nas trevas” e a metáfora “anda” foram mantidas por sua importância literária e teológica.
