source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: pt
  text: Não escrevi a vocês porque não conhecem a verdade, mas porque a conhecem e porque nenhuma mentira procede da verdade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: Não escrevi
  rationale: O aoristo é vertido naturalmente pelo pretérito perfeito em português. No contexto epistolar, também se poderia dizer “Não lhes escrevo”, mas o passado preserva mais diretamente a forma grega.
- source_word: οἴδατε
  choice: conhecem / a conhecem
  rationale: O verbo indica conhecimento estabelecido. A repetição contrastiva é mantida sem acrescentar um recurso enfático ausente e desnecessário em português.
- source_word: ἀλήθεια / τῆς ἀληθείας
  choice: a verdade / da verdade
  rationale: Mantém-se o artigo e a formulação ampla de João, sem restringir “verdade” a uma paráfrase doutrinária específica.
- source_word: αὐτήν
  choice: a
  rationale: O pronome retoma “a verdade”; o pronome oblíquo feminino é idiomático e preserva a referência explícita.
- source_word: πᾶν ψεῦδος
  choice: nenhuma mentira
  rationale: 'A construção grega com πᾶν e negação é expressa naturalmente em português como uma negação universal: “nenhuma mentira”.'
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: não procede da verdade
  rationale: ἐκ assinala fonte ou origem. “Procede da” comunica essa relação com naturalidade e dignidade, sem ampliar o sentido.
theological_decisions:
- issue: Natureza de “a verdade” no uso joanino
  choice: a verdade
  alternative: a mensagem verdadeira; a verdade do evangelho
  rationale: A expressão é mantida sem explicitação doutrinária, preservando a amplitude e a densidade teológica do texto.
- issue: Relação da mentira com a verdade
  choice: nenhuma mentira procede da verdade
  alternative: nenhuma mentira é da verdade
  rationale: A tradução apresenta a relação como origem ou fonte, conforme o valor de ἐκ, sem convertê-la numa afirmação metafísica mais abrangente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “A vocês” evita regionalismo excessivo; “procede da verdade” mantém o contraste solene e a ideia de origem.
