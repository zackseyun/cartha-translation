  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: pt
  text: Mas vocês têm uma unção que vem do Santo, e todos vocês sabem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura textual traz: “vocês sabem todas as coisas”. A leitura do SBLGNT sustenta: “todos vocês sabem”.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Mas
  rationale: Embora καί normalmente seja aditivo, aqui introduz um contraste com os anticristos mencionados no versículo anterior; “Mas” expressa naturalmente essa relação discursiva.
- source_word: ὑμεῖς
  choice: vocês
  rationale: O pronome explícito é enfático e, em português, “vocês” mantém ampla legibilidade brasileira; sua posição após “Mas” comunica adequadamente o contraste.
- source_word: χρῖσμα
  choice: uma unção
  rationale: Preserva a metáfora do grego e sua ressonância teológica sem identificar interpretativamente a unção com o Espírito Santo.
- source_word: ἔχετε
  choice: têm
  rationale: Equivalente presente, direto e natural do verbo grego.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: que vem do Santo
  rationale: Expressa com naturalidade a origem indicada por ἀπό e conserva o título “o Santo” sem determinar se o referente é o Pai ou o Filho.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples, ligando a posse da unção ao conhecimento dos destinatários.
- source_word: οἴδατε
  choice: sabem
  rationale: Equivalente idiomático de οἴδατε neste contexto de conhecimento ou discernimento.
- source_word: πάντες
  choice: todos
  rationale: 'O nominativo plural qualifica o sujeito: todos os destinatários sabem. A redação segue o texto do SBLGNT, em contraste com a variante “todas as coisas”.'
theological_decisions:
- issue: Referente de “o Santo”
  choice: Mantido como “o Santo”, sem especificar o referente.
  alternative: “Deus, o Santo” ou “Cristo, o Santo”
  rationale: A expressão grega não identifica explicitamente o referente, e especificá-lo resolveria uma ambiguidade genuína do texto.
- issue: Sentido de χρῖσμα
  choice: Mantida a metáfora “uma unção”.
  alternative: “o Espírito Santo” ou “a unção do Espírito”
  rationale: Embora a unção possa ser entendida como o Espírito ou sua atuação, o texto emprega χρῖσμα; a tradução não substitui a metáfora por uma interpretação.
- issue: Objeto de οἴδατε
  choice: “todos sabem”, tomando πάντες como sujeito distributivo.
  alternative: “vocês sabem todas as coisas”
  rationale: A escolha segue a leitura πάντες do SBLGNT e evita importar o objeto neutro πάντα da variante textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “unção” conserva a linguagem bíblica ainda corrente. A formulação “que vem do Santo” é mais natural em português do que a reprodução rígida “da parte do Santo”.
