id: 1JN.2.4
reference: 1 John 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: pt
  text: 'Aquele que diz: “Eu o conheço” e não guarda os seus mandamentos é mentiroso, e a verdade não está nele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λέγων
  choice: Aquele que diz
  rationale: O particípio presente articulado tem força substantiva e genérica; esta formulação conserva o singular e soa natural em português.
- source_word: ὅτι
  choice: dois-pontos e discurso direto
  rationale: Depois de λέγων, ὅτι introduz o conteúdo da fala; em português, dois-pontos e aspas comunicam isso com naturalidade.
- source_word: Ἔγνωκα
  choice: Eu o conheço
  rationale: Embora o perfeito indique um estado presente resultante de ter chegado a conhecer, o presente português expressa naturalmente esse estado duradouro. Uma forma como “tenho chegado a conhecê-lo” seria artificial, e “vim a conhecê-lo” poderia deslocar a ênfase para o evento passado.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma o referente divino do contexto sem especificar além do grego se é Deus de modo geral ou, mais especificamente, Cristo.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: os seus mandamentos
  rationale: “Mandamentos” preserva o peso e as ressonâncias bíblicas de ἐντολή; “seus” mantém a referência pronominal do original.
- source_word: μὴ τηρῶν
  choice: mas não guarda
  rationale: O particípio presente descreve uma prática ou conduta contínua. “Guardar” preserva a nuance joanina de observar e manter, enquanto “mas” torna explícito em português o contraste já inerente à construção com καί.
- source_word: ψεύστης
  choice: mentiroso
  rationale: O substantivo predicativo caracteriza diretamente a pessoa, sem enfraquecê-lo para uma descrição meramente circunstancial.
- source_word: ἐν τούτῳ
  choice: nele
  rationale: O demonstrativo dativo retoma naturalmente a pessoa descrita; “nele” é claro e idiomático em português.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: a verdade não está
  rationale: Conserva a formulação simples e a densidade moral e teológica de “a verdade”, sem reduzi-la apenas a sinceridade ou correção factual.
theological_decisions:
- issue: Referente de αὐτόν / αὐτοῦ
  choice: 'Manter a referência pronominal: “o” / “seus”'
  alternative: Explicitar “Deus” ou “Cristo”
  rationale: O contexto imediato favorece Deus como referente, mas a estreita relação joanina entre o Pai e o Filho aconselha não resolver no texto aquilo que o original deixa pronominal.
- issue: Força do perfeito Ἔγνωκα na linguagem joanina de conhecimento
  choice: “Eu o conheço”
  alternative: “Eu vim a conhecê-lo” ou “Eu tenho chegado a conhecê-lo”
  rationale: O presente português comunica de modo natural o estado relacional vigente produzido por conhecimento anterior. As alternativas tornam a frase menos natural ou enfatizam excessivamente o processo passado.
- issue: Valor de καί antes de τὰς ἐντολὰς
  choice: 'Traduzir com valor adversativo: “mas”'
  alternative: “e”
  rationale: No encadeamento, a afirmação de conhecer contrasta com não guardar os mandamentos. O português idiomático explicita esse contraste com “mas”, sem alterar a lógica do original.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção conserva o tom direto e moralmente incisivo do original. Não se acrescenta nota, pois “Eu o conheço” é a representação portuguesa mais natural do perfeito grego neste contexto, e “nele” reproduz adequadamente a retomada anafórica.
