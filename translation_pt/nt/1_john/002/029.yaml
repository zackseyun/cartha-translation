  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: pt
  text: Se vocês sabem que ele é justo[a], sabem que todo aquele que pratica a justiça nasceu dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “ele” pode se referir a Deus, o Pai, ou ao Filho; o grego não identifica expressamente o referente aqui.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “nasceu a partir dele”. A expressão grega ressalta a origem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Se vocês sabem
  rationale: A construção introduz uma condição; em português corrente, “se vocês sabem” preserva diretamente seu valor e o sentido de οἶδα.
- source_word: δίκαιός
  choice: justo
  rationale: “Justo” expressa naturalmente o sentido moral e teológico do adjetivo e mantém a ligação lexical com “justiça”.
- source_word: γινώσκετε
  choice: sabem também
  rationale: A forma é entendida como indicativo, não como imperativo. “Também” torna natural a progressão sem apagar a diferença entre os dois verbos gregos de conhecimento.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: todo aquele que pratica a justiça
  rationale: “Pratica” comunica a ação característica ou contínua sugerida pelo particípio presente, enquanto “a justiça” conserva a relação com “justo”.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: nasceu dele
  rationale: O perfeito passivo descreve nascimento já ocorrido com resultado presente. “Nasceu dele” é claro e natural, preservando a imagem de origem ou filiação.
theological_decisions:
- issue: Referente de αὐτός em “ele é justo” e “dele”
  choice: Manter os pronomes sem identificar expressamente o referente
  alternative: Explicitar “Deus, o Pai” ou “o Filho”
  rationale: O grego não nomeia o referente neste versículo, e o contexto admite discussão entre o Pai e o Filho. A tradução preserva essa ambiguidade teológica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” explicita o destinatário plural sem formalismo arcaico; “todo aquele” mantém o caráter abrangente e proverbial da afirmação.
