reference: 1 John 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: pt
  text: 'Meus filhinhos, escrevo-lhes estas coisas para que vocês não pequem. Mas, se alguém pecar, temos junto ao Pai um defensor[a]: Jesus, o Messias[b], o Justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego παράκλητος também pode ser entendido, de modo mais amplo, como “advogado”, “auxiliador”, “conselheiro” ou “consolador”.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: “Jesus Cristo”. O título grego Χριστός pode significar “Messias” ou funcionar de modo semelhante a um nome, “Cristo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Meus filhinhos
  rationale: Preserva a metáfora familiar e o tom afetuoso do diminutivo τεκνία; é uma forma natural e pastoral em português.
- source_word: ταῦτα γράφω ὑμῖν
  choice: escrevo-lhes estas coisas
  rationale: Corresponde ao presente γράφω e mantém ταῦτα sem especificar além do texto; a colocação é clara em português moderno.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: para que vocês não pequem
  rationale: Expressa naturalmente a finalidade da construção com ἵνα e subjuntivo, sem transformar o propósito pastoral em uma afirmação de impecabilidade já alcançada.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Mas, se alguém pecar
  rationale: O contexto dá a καί uma força adversativa suave; o futuro do subjuntivo português apresenta com naturalidade a eventualidade expressa por ἐάν com subjuntivo aoristo.
- source_word: παράκλητον
  choice: um defensor
  rationale: No contexto de comparecimento junto ao Pai, 'defensor' comunica bem a função representativa e intercessória, sem limitar por completo a amplitude semântica do termo.
- source_word: πρὸς τὸν πατέρα
  choice: junto ao Pai
  rationale: Preserva a ideia de presença e orientação relacional de πρός, evitando que 'diante do Pai' torne a imagem exclusivamente forense.
- source_word: Ἰησοῦν Χριστὸν
  choice: Jesus, o Messias
  rationale: Χριστός é entendido aqui como título; a forma com artigo é idiomática em português, e a vírgula explicita a aposição sem alterar o referente.
- source_word: δίκαιον
  choice: o Justo
  rationale: A forma substantivada reproduz a força descritiva e cristológica do adjetivo em aposição a Jesus, de maneira digna e concisa.
theological_decisions:
- issue: Sentido de παράκλητος aplicado a Jesus
  choice: defensor
  alternative: advogado, auxiliador, conselheiro ou consolador
  rationale: A situação de Jesus junto ao Pai favorece o sentido representativo/intercessório, mas a nota preserva a amplitude lexical do termo grego.
- issue: Tradução de Χριστός como título cristológico
  choice: Messias
  alternative: Cristo
  rationale: A construção admite naturalmente a leitura titular; 'Cristo', tradicional e possivelmente mais nomeado, é preservado em nota.
- issue: Possível ideia de perfeição sem pecado em ἵνα μὴ ἁμάρτητε
  choice: manter a finalidade 'para que vocês não pequem' em tensão com 'se alguém pecar'
  alternative: formular a primeira oração como garantia de impecabilidade absoluta
  rationale: O texto apresenta ao mesmo tempo o propósito de não pecar e a possibilidade real de alguém pecar; a tradução não resolve essa tensão doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' por clareza internacional com forte naturalidade no Brasil; 'escrevo-lhes' evita repetição pesada de 'a vocês'. O tratamento afetuoso 'meus filhinhos' conserva o tom pastoral. Todos os marcadores de nota aparecem no texto principal.
