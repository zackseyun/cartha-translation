id: 1JN.2.8
reference: 1 John 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: pt
  text: Novamente, escrevo a vocês um novo mandamento. Isso é verdadeiro nele[a] e em vocês, porque as trevas estão passando, e a verdadeira luz já brilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nisso e em vocês”, entendendo o pronome como referência ao mandamento ou à ideia anterior, e não pessoalmente a Cristo.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Novamente
  rationale: Mantém o marcador discursivo compacto, indicando que João apresenta o mandamento sob outro aspecto, sem explicitar além do necessário a relação de contraste com o versículo anterior.
- source_word: ἐντολὴν καινὴν
  choice: um novo mandamento
  rationale: É a formulação natural e consagrada em português; καινός aponta para novidade de caráter ou qualidade, não apenas para algo recente.
- source_word: γράφω
  choice: escrevo
  rationale: O presente português expressa de modo natural o ato epistolar em curso e acompanha diretamente o presente grego.
- source_word: ὅ ἐστιν ἀληθές
  choice: Isso é verdadeiro
  rationale: O pronome relativo neutro retoma a ideia anterior como um todo. Uma nova frase com “Isso” oferece clareza em português sem determinar de forma indevida uma concordância nominal específica.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: O pronome é entendido, de modo mais provável no contexto joanino, como referência pessoal a Cristo. A alternativa de referência ao mandamento é preservada em nota.
- source_word: ἐν ὑμῖν
  choice: em vocês
  rationale: Conserva o paralelismo com “nele” e a ideia de que essa verdade se realiza nos próprios destinatários; “vocês” oferece ampla legibilidade brasileira.
- source_word: ὅτι
  choice: porque
  rationale: Explicita naturalmente a relação causal pela qual o avanço da luz fundamenta a afirmação anterior.
- source_word: ἡ σκοτία
  choice: as trevas
  rationale: “Trevas” é uma expressão portuguesa natural e digna para a realidade moral e espiritual personificada no contraste joanino com a luz.
- source_word: παράγεται
  choice: estão passando
  rationale: Reproduz o processo ainda em andamento expresso pelo presente grego, sem sugerir que as trevas já desapareceram por completo.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: a verdadeira luz
  rationale: Preserva a expressão joanina e seu contraste teológico e literário com as trevas.
- source_word: ἤδη φαίνει
  choice: já brilha
  rationale: 'Expressa de forma concisa a ação presente e já iniciada: a luz está brilhando agora, embora as trevas ainda estejam passando.'
theological_decisions:
- issue: Referente de αὐτῷ
  choice: “nele”, com referência pessoal a Cristo
  alternative: “nisso”, entendendo a expressão como referência ao mandamento ou à ideia anterior
  rationale: A forma pronominal e o contexto joanino favorecem a referência pessoal a Cristo, em quem o mandamento se mostra verdadeiro. Como a construção permite discussão sobre a referência conceitual ao mandamento, a alternativa permanece visível em nota, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade especialmente natural no Brasil e compreensão internacional ampla. A divisão em duas frases evita uma oração relativa pesada, preserva o conteúdo do grego e mantém o contraste escatológico entre trevas ainda em retirada e luz que já brilha.
