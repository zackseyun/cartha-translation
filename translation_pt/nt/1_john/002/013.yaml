id: 1JN.2.13
reference: 1 John 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: pt
  text: Eu lhes escrevo, pais, porque vocês conhecem aquele que é desde o princípio; eu lhes escrevo, jovens homens, porque vocês venceram o Maligno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o perverso”. A expressão grega se refere mais naturalmente a um adversário pessoal, embora também possa ser entendida como “o mal”.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: eu lhes escrevo
  rationale: O presente do indicativo tem uso epistolar e, em português, o presente simples é natural e direto, preservando a repetição do grego.
- source_word: πατέρες
  choice: pais
  rationale: Mantém o sentido literal do vocativo masculino plural sem interpretá-lo no corpo do texto como 'homens mais velhos' ou 'maduros'.
- source_word: ἐγνώκατε
  choice: vocês conhecem
  rationale: O perfeito grego expressa conhecimento adquirido que permanece. O presente português comunica naturalmente esse estado resultante; 'têm conhecido' seria pouco idiomático e poderia sugerir ação reiterada.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: aquele que é desde o princípio
  rationale: Preserva a expressão substantivada, seu caráter pessoal e a referência não explicitada, além de conservar a dicção joanina ligada ao princípio.
- source_word: νεανίσκοι
  choice: jovens
  rationale: Em português, 'jovens' pode designar naturalmente jovens do sexo masculino no vocativo. Evita o sentido conjugal possível de 'homens jovens' sem neutralizar deliberadamente a forma masculina grega.
- source_word: νενικήκατε
  choice: vocês venceram
  rationale: O perfeito apresenta uma vitória já alcançada e ainda relevante. O pretérito perfeito português expressa com clareza a realização, enquanto o contexto sustenta seu efeito presente.
- source_word: τὸν πονηρόν
  choice: o Maligno
  rationale: O artigo masculino singular com o adjetivo substantivado favorece um adversário pessoal. 'O Maligno' é claro e tradicional sem acrescentar o nome 'Satanás'.
theological_decisions:
- issue: Referente de 'aquele que é desde o princípio'
  choice: Manter o referente implícito no texto
  alternative: Identificá-lo explicitamente como o Filho, ou entendê-lo mais amplamente como Deus
  rationale: O contexto joanino provavelmente aponta para o Filho, mas a expressão grega não o nomeia neste versículo. A tradução preserva essa abertura textual.
- issue: Sentido de 'o Maligno'
  choice: Adversário maligno pessoal
  alternative: O mal em sentido abstrato
  rationale: A construção masculina singular e substantivada favorece fortemente um referente pessoal, sem justificar inserir no texto o nome próprio 'Satanás'.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “vocês”, amplamente inteligível no Brasil e internacionalmente. A repetição de “eu lhes escrevo” e o paralelismo do original foram preservados.
