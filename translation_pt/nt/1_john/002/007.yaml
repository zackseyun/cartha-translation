  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: pt
  text: Amados, não escrevo a vocês um mandamento novo, mas um mandamento antigo, que vocês têm desde o princípio. O mandamento antigo é a mensagem[a] que vocês ouviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “palavra”: “O mandamento antigo é a palavra que vocês ouviram”.'
    reason: Alternativa lexical para λόγος, que pode significar tanto a palavra comunicada quanto a mensagem que ela transmite.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Mantém a forma de tratamento afetuosa e a ligação lexical com o campo de ἀγαπάω/ἀγάπη, preservando o tom pastoral de João.
- source_word: ἐντολήν
  choice: mandamento
  rationale: Preserva o peso teológico recorrente de ἐντολή nos escritos joaninos e sua ressonância intertextual.
- source_word: καινήν
  choice: novo
  rationale: Expressa diretamente o contraste com παλαιός, sem acrescentar a nuance interpretativa de algo apenas renovado ou recente.
- source_word: γράφω
  choice: escrevo
  rationale: O presente do indicativo descreve naturalmente o ato epistolar em curso; em português, o presente simples é a forma idiomática.
- source_word: παλαιάν / παλαιά
  choice: antigo
  rationale: Forma um contraste natural com “novo” e indica que o mandamento já era conhecido pelos leitores, sem sugerir que estivesse ultrapassado.
- source_word: εἴχετε
  choice: vocês têm
  rationale: Embora o grego use o imperfeito, o contexto apresenta uma posse iniciada no passado e ainda pertinente. Em português, “têm desde o princípio” comunica com naturalidade essa continuidade.
- source_word: ἀπ’ ἀρχῆς
  choice: desde o princípio
  rationale: Conserva a formulação joanina e sua possível amplitude, sem especificar de qual princípio se trata.
- source_word: λόγος
  choice: mensagem
  rationale: No contexto, λόγος designa o conteúdo comunicado e ouvido. “Mensagem” é claro em português moderno; a alternativa mais formal “palavra” é registrada em nota.
- source_word: ἠκούσατε
  choice: vocês ouviram
  rationale: Reproduz de modo direto o aoristo, apontando para a ocasião em que os destinatários receberam o ensino proclamado.
theological_decisions:
- issue: Referente de “desde o princípio”
  choice: A expressão é mantida sem explicitação adicional.
  alternative: “desde o início da vida cristã de vocês” ou “desde o início da proclamação do evangelho”
  rationale: O contexto favorece o início da instrução recebida pelos leitores, mas o texto não define expressamente esse ponto; a tradução preserva a amplitude da expressão joanina.
- issue: Identificação do “mandamento antigo” com a “mensagem” ou “palavra” ouvida
  choice: A equivalência é traduzida diretamente, sem explicação ou harmonização.
  alternative: Expandir a frase para identificar o conteúdo do mandamento com base nos versículos próximos.
  rationale: O grego equipara o mandamento antigo ao λόγος ouvido pelos destinatários. Acrescentar seu conteúdo específico resolveria uma relação que este versículo deixa sem desenvolvimento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” evita a regionalidade de “vós”; “não escrevo a vocês” mantém a construção natural sem perder a relação explícita com os destinatários. “Amados” conserva o tom pastoral e a ligação verbal com o tema joanino do amor.
