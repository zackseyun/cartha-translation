  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: pt
  text: Quem diz estar na luz e odeia seu irmão está nas trevas até agora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu irmão ou sua irmã”. O grego traz o masculino singular “irmão”, que pode ter sentido representativo neste contexto ético.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Quem diz
  rationale: O artigo com o particípio presente funciona como substantivo e descreve uma pessoa representativa. “Quem diz” é natural em português e preserva o caráter geral da afirmação.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: estar na luz
  rationale: A construção com infinitivo completa o verbo “diz”. “Na luz” mantém a imagem joanina de uma esfera moral e espiritual.
- source_word: καὶ
  choice: mas
  rationale: Embora καί normalmente signifique “e”, aqui a relação entre a alegação de estar na luz e o ódio ao irmão é claramente contrastiva; “mas” torna essa relação natural e explícita em português sem alterar o sentido.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Preserva o masculino singular de ἀδελφός e a relação expressa por αὐτοῦ. No contexto ético, o termo pode ter função representativa, possibilidade registrada em nota.
- source_word: μισῶν
  choice: odeia
  rationale: O particípio presente indica uma atitude vigente ou característica. O presente simples comunica isso de modo idiomático.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nas trevas
  rationale: “Trevas” é a forma portuguesa consagrada e natural para a metáfora joanina, mantendo o contraste direto com “luz”.
- source_word: ἕως ἄρτι
  choice: até agora
  rationale: Reproduz diretamente a ideia de continuidade até o momento presente, sem reduzi-la apenas a “ainda”.
theological_decisions:
- issue: Alcance representativo de ἀδελφός no singular masculino
  choice: irmão
  alternative: irmão ou irmã; irmão na fé
  rationale: “Irmão” preserva a forma lexical e gramatical do grego. Como o masculino singular pode representar homens e mulheres neste contexto ético, a alternativa inclusiva é informada em nota. “Irmão na fé” explicitaria uma delimitação contextual que o versículo não formula diretamente.
- issue: Força temporal de ἕως ἄρτι
  choice: até agora
  alternative: ainda
  rationale: '“Até agora” conserva a ênfase temporal: apesar de sua alegação, a pessoa permanece nas trevas até o presente. A tradução não decide se a expressão sugere ou não uma possível mudança futura.'
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Nas trevas” soa mais natural que o singular “na escuridão” e preserva a linguagem bíblica joanina sem arcaísmo excessivo. O marcador [a] aparece no texto principal.
