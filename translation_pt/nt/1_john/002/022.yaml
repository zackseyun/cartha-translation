id: 1JN.2.22
reference: 1 John 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: pt
  text: Quem é o mentiroso, senão aquele que nega que Jesus é o Messias?[a] Esse é o anticristo:[b] aquele que nega o Pai e o Filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Cristo”. O título grego é ὁ χριστός; aqui foi traduzido como “o Messias” porque funciona como título, não como nome.'
    reason: alternative_reading
  - marker: b
    text: 'Ou simplesmente: “anticristo”. O grego traz o artigo: “o anticristo”. Nas cartas de João, o termo pode designar o tipo de opositor caracterizado por negar o Pai e o Filho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: o mentiroso
  rationale: O artigo grego torna o substantivo definido e, no contexto polêmico, caracteriza de modo paradigmático quem profere essa negação.
- source_word: ἀρνούμενος
  choice: aquele que nega
  rationale: O particípio presente substantivado descreve a pessoa por sua negação característica; esta formulação preserva esse valor e é natural em português.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: que Jesus é o Messias
  rationale: Depois de um verbo de negação, o grego expressa o conteúdo negado com uma oração internamente negativa; em português idiomático, 'nega que Jesus é o Messias' comunica corretamente que a afirmação rejeitada é 'Jesus é o Messias', sem produzir uma dupla negação ambígua.
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Χριστός funciona aqui como título; 'Messias' comunica seu sentido e mantém o contexto da reivindicação messiânica.
- source_word: ἀντίχριστος
  choice: o anticristo
  rationale: O artigo grego favorece a forma definida. 'Anticristo' é o termo corrente em português, enquanto a redação não limita por si só o referente a um único indivíduo futuro.
- source_word: πατέρα
  choice: Pai
  rationale: A inicial maiúscula indica a referência específica a Deus na relação joanina entre o Pai e o Filho.
- source_word: υἱόν
  choice: Filho
  rationale: A inicial maiúscula indica o título relacional específico do Filho em relação ao Pai.
- source_word: οὗτός ἐστιν
  choice: Esse é
  rationale: O demonstrativo retoma naturalmente, em português, a pessoa que acaba de ser descrita e preserva a identificação enfática.
theological_decisions:
- issue: Tradução de Χριστός na fórmula cristológica de confissão ou negação
  choice: Messias
  alternative: Cristo
  rationale: Como o termo funciona claramente como título, 'Messias' explicita a afirmação messiânica em jogo, sem tratá-lo como parte do nome de Jesus.
- issue: Referência de ἀντίχριστος
  choice: o anticristo
  alternative: um anticristo; anticristo
  rationale: O artigo foi preservado, mas a tradução não acrescenta qualificações escatológicas nem decide se o termo designa exclusivamente um indivíduo ou também um tipo de opositor.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação 'nega que Jesus é o Messias' evita a dupla negação pouco natural que resultaria de uma reprodução mecânica da sintaxe grega. Todos os marcadores de nota aparecem no texto.
