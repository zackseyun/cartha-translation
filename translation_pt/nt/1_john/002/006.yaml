id: 1JN.2.6
reference: 1 John 2:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: pt
  text: Quem diz que permanece nele deve também andar como aquele andou.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanece unido a ele”. O verbo grego μένω é um termo importante nos escritos de João e pode indicar continuar, permanecer ou manter-se numa relação.'
    reason: lexical_alternative
  - marker: b
    text: “Aquele” se refere a Jesus e preserva a força demonstrativa do grego; muitas traduções dizem simplesmente “ele”.
    reason: alternative_reading
  - marker: c
    text: “Andar” é uma metáfora bíblica para a maneira de viver; isto é, a pessoa deve viver como Jesus viveu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Quem diz
  rationale: O particípio articular tem força substantiva e genérica. “Quem diz” é uma forma natural em português e preserva o singular representativo.
- source_word: ἐν αὐτῷ μένειν
  choice: que permanece nele
  rationale: O infinitivo exprime o conteúdo da afirmação. “Permanecer” conserva um termo joanino central e pode comunicar tanto continuidade quanto relação duradoura.
- source_word: ὀφείλει
  choice: deve
  rationale: Neste contexto, o verbo exprime obrigação moral. “Deve” é claro, digno e natural, sem tornar a formulação excessivamente jurídica.
- source_word: καθὼς
  choice: como
  rationale: Marca correspondência de modo entre a conduta de quem faz a afirmação e a conduta de Jesus. “Como” expressa essa comparação naturalmente.
- source_word: ἐκεῖνος
  choice: aquele
  rationale: Preserva a força demonstrativa do grego, em vez de reduzi-la a um simples pronome pessoal. No contexto, o referente é Jesus.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: andou ... andar
  rationale: Mantém a metáfora bíblica de caminhar como modo de viver e conserva a repetição lexical do original.
- source_word: καὶ αὐτὸς
  choice: também
  rationale: 'Comunica a força aditiva e correlativa: a própria pessoa que afirma permanecer nele deve corresponder ao exemplo dado.'
theological_decisions:
- issue: Referente de αὐτῷ e ἐκεῖνος
  choice: Traduzir por “nele” e “aquele”, entendendo pelo contexto que o referente é Jesus, sem empregar maiúsculas devocionais.
  alternative: Explicitar “em Jesus” e “Jesus”, ou usar “Nele” e “Aquele”.
  rationale: O contexto identifica Jesus como referente, mas o grego usa pronomes e não marca maiúsculas reverenciais. A tradução conserva a forma pronominal e evita acrescentar uma convenção interpretativa.
- issue: Força ética de ὀφείλει
  choice: “deve”
  alternative: “é obrigado a” ou “tem de”
  rationale: O texto afirma uma obrigação moral real decorrente da alegação de permanecer em Cristo. “Deve” mantém essa exigência sem lhe dar um tom jurídico estranho ao contexto.
- issue: Metáfora de περιπατέω
  choice: Conservar “andar” como metáfora para a maneira de viver.
  alternative: Explicitar no texto “viver”.
  rationale: A metáfora é bíblica, significativa e compreensível, além de preservar a correspondência verbal enfática entre o andar de Jesus e o do discípulo. A nota esclarece o sentido.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação é concisa e digna, conserva o singular genérico, o termo joanino “permanecer”, a força demonstrativa de “aquele” e a metáfora ética de “andar”.
