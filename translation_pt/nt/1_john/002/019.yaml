source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: pt
  text: Eles saíram do nosso meio, mas não eram dos nossos; pois, se fossem dos nossos, teriam permanecido conosco[a]. Mas isso aconteceu para que ficasse evidente[b] que nem todos são dos nossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teriam continuado conosco”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “para que eles fossem revelados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: do nosso meio / dos nossos
  rationale: Na primeira ocorrência, a expressão indica o meio do qual eles saíram; nas demais, expressa vínculo ou pertencimento. A variação preserva os dois sentidos contextuais da mesma expressão grega em português natural.
- source_word: ἐξῆλθαν
  choice: saíram
  rationale: Traduz diretamente o aoristo de ἐξέρχομαι e mantém a imagem concreta de saída, sem inserir no verbo uma interpretação teológica como “apostataram”.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: não eram dos nossos
  rationale: A formulação idiomática comunica vínculo e identidade comunitária sem expandir interpretativamente para “não eram verdadeiros crentes”.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: pois, se fossem dos nossos
  rationale: O imperfeito do subjuntivo em português introduz naturalmente a condição contrária aos fatos, mantendo a linguagem relacional.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: teriam permanecido conosco
  rationale: O futuro do pretérito composto expressa o resultado irreal da condição. “Permanecido” conserva a ressonância joanina de μένω melhor que uma simples formulação como “teriam ficado”.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Mas isso aconteceu para que ficasse evidente
  rationale: A formulação explicita de modo natural em português o acontecimento subentendido depois de ἀλλά e comunica a ideia passiva de revelação ou manifestação sem tornar a frase obscura.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: que nem todos são dos nossos
  rationale: Mantém a posição e o alcance mais imediato da negação grega, sem transformar a afirmação em uma categoria teológica posterior.
theological_decisions:
- issue: Se “dos nossos” deve ser ampliado de modo a definir a condição espiritual dos que saíram
  choice: Manter a expressão comunitária e relacional “dos nossos”.
  alternative: “nunca foram verdadeiros crentes” ou “nunca pertenceram realmente à igreja”
  rationale: O texto distingue a saída do pertencimento genuíno, mas não emprega diretamente categorias sistemático-teológicas posteriores. A tradução preserva essa tensão.
- issue: Como representar a construção de propósito com φανερωθῶσιν
  choice: Expressar o resultado como “para que ficasse evidente”.
  alternative: “para que eles fossem manifestos”
  rationale: A alternativa reproduz mais diretamente o plural passivo grego, mas soa pouco natural e ambígua em português. O texto principal comunica que a saída tornou evidente a realidade descrita na oração seguinte, e a nota preserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Do nosso meio” descreve a saída concreta; “dos nossos” preserva a dimensão relacional das ocorrências seguintes. Evitaram-se termos confessionais ou sistemáticos não presentes no grego.
