  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: pt
  text: Quem ama seu irmão permanece na luz, e nele não há causa de tropeço.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ele não há pedra de tropeço”. A expressão grega pode descrever tanto o que não está nele como o que não se apresenta diante dele para fazê-lo tropeçar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Quem ama
  rationale: O particípio presente substantivado expressa uma realidade genérica e contínua. “Quem ama” é natural em português moderno e evita o peso de “aquele que ama”.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Preserva o masculino singular do grego e a linguagem familiar da comunidade joanina, sem inserir no texto principal uma explicação interpretativa como “irmão na fé”.
- source_word: ἐν τῷ φωτὶ
  choice: na luz
  rationale: Mantém a imagem metafórica central do texto e corresponde de modo natural à expressão grega.
- source_word: μένει
  choice: permanece
  rationale: Traduz o verbo joanino μένω com linguagem atual e digna, preservando seu aspecto durativo.
- source_word: σκάνδαλον
  choice: motivo de tropeço
  rationale: Conserva a metáfora de tropeçar e comunica a ideia de causa ou ocasião, sem reduzi-la a uma ofensa meramente emocional.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: É a correspondência mais direta da preposição e do pronome masculino singular, provavelmente referentes à pessoa que ama; a possível leitura “para ele” é registrada em nota.
- source_word: οὐκ ἔστιν
  choice: não há
  rationale: A construção existencial é idiomática em português e reproduz com clareza a afirmação negativa grega.
theological_decisions:
- issue: Sentido de καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: nele não há motivo de tropeço
  alternative: para ele não há pedra de tropeço
  rationale: A formulação principal mantém o sentido interno e não especifica indevidamente se o tropeço afeta a própria pessoa ou outras. Como ἐν αὐτῷ também pode ser entendido com o sentido de “para ele”, a nota preserva essa ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem da segunda oração foi ajustada ao uso natural do português, sem eliminar a ambiguidade do original.
