  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: pt
  text: E o mundo está passando, junto com o seu desejo[a], mas quem faz a vontade de Deus permanece para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua cobiça”. O termo grego pode indicar desejo forte ou cobiça; aqui abrange os desejos desordenados que caracterizam o mundo.
    reason: lexical_alternative
  - marker: b
    text: “Permanece” traduz um verbo frequente nos escritos de João, que também pode ser vertido como “continua” ou “perdura”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: o mundo
  rationale: Mantém o termo amplo de João; o contexto imediato (1Jo 2:15–16) mostra que aqui ele inclui a ordem humana orientada contra Deus, sem reduzir o sentido à criação física.
- source_word: παράγεται
  choice: está passando
  rationale: A forma presente comunica um processo em curso e destaca o caráter transitório do mundo.
- source_word: ἐπιθυμία αὐτοῦ
  choice: o seu desejo
  rationale: O singular grego foi preservado. “Desejo” abrange a inclinação desordenada do mundo sem restringir o sentido à cobiça sexual; “seu” retoma “mundo”.
- source_word: ὁ δὲ ποιῶν
  choice: mas quem faz
  rationale: Expressa de modo natural o particípio substantivado, que caracteriza qualquer pessoa pela prática contínua da vontade de Deus.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: a vontade de Deus
  rationale: Formulação direta e tradicional que conserva o peso ético e teológico de θέλημα.
- source_word: μένει
  choice: permanece
  rationale: Preserva um verbo central no vocabulário joanino e comunica continuidade duradoura em português atual.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa natural para a duração indefinida e permanente indicada pelo idioma grego neste contexto.
theological_decisions:
- issue: Sentido de κόσμος no contexto joanino
  choice: Manter “o mundo” no texto, entendido contextualmente como a ordem humana transitória e contrária a Deus.
  alternative: Explicitar “o sistema deste mundo” ou entender apenas a criação física.
  rationale: Os versículos 15–16 definem o mundo por seus desejos e sua arrogância. A tradução ampla preserva a linguagem de João sem inserir no texto uma paráfrase interpretativa.
- issue: Alcance de μένει εἰς τὸν αἰῶνα
  choice: “permanece para sempre”, afirmando a permanência daquele que faz a vontade de Deus.
  alternative: Explicitar “terá a vida eterna”.
  rationale: Embora a frase se relacione à vida eterna na teologia joanina, o grego deste versículo fala de permanência e não explicita essa formulação doutrinária.
- issue: Relação entre obediência e permanência
  choice: Conservar a afirmação direta de que quem faz a vontade de Deus permanece para sempre.
  alternative: Acrescentar uma explicação sobre mérito, causa ou evidência da salvação.
  rationale: O versículo não define aqui a relação causal; acrescentá-la resolveria uma tensão teológica que o texto deixa sem explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura contrastiva do grego foi mantida, e “quem faz” evita tanto o arcaísmo quanto uma formulação marcada por gênero.
