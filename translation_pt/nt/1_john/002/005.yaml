id: 1JN.2.5
reference: 1 John 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: pt
  text: 'Mas quem guarda a sua palavra, nessa pessoa o amor de Deus verdadeiramente foi levado à plenitude.[a][b] Nisto sabemos que estamos nele:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “neste” ou “nisso”. A expressão grega pode apontar para a pessoa que guarda a palavra ou para esse fato como evidência.
    reason: alternative_reading
  - marker: b
    text: “O amor de Deus” pode significar tanto o amor de Deus nessa pessoa como o amor dessa pessoa por Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Mas quem
  rationale: A combinação do relativo com ἄν expressa uma condição geral e indefinida; “quem” comunica naturalmente “todo aquele que”. “Mas” preserva o contraste leve de δέ com o versículo anterior.
- source_word: τηρῇ
  choice: guarda
  rationale: τηρέω pode significar guardar, observar ou obedecer. “Guarda” mantém a formulação joanina e abrange tanto acolher como obedecer à palavra, sem reduzi-la ao cumprimento externo.
- source_word: αὐτοῦ τὸν λόγον
  choice: a sua palavra
  rationale: λόγος está no singular e designa amplamente a palavra comunicada por Deus ou Cristo. “Palavra” conserva a dicção e a ressonância joaninas; o pronome permanece sem explicitação interpretativa do referente.
- source_word: ἀληθῶς
  choice: verdadeiramente
  rationale: O advérbio intensifica a afirmação. “Verdadeiramente” é digno, claro e semanticamente próximo do grego.
- source_word: ἐν τούτῳ
  choice: nessa pessoa
  rationale: O demonstrativo pode apontar para a pessoa que guarda a palavra ou, de modo mais abstrato, para esse fato. “Nessa pessoa” apresenta com clareza a leitura pessoal mais provável, enquanto a nota preserva a ambiguidade.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  rationale: A construção genitiva pode indicar o amor proveniente de Deus ou o amor dirigido a Deus. A formulação “o amor de Deus” preserva essa ambiguidade genuína.
- source_word: τετελείωται
  choice: chegou à plenitude
  rationale: O perfeito expressa um estado resultante, e τελειόω envolve completar, aperfeiçoar ou levar ao objetivo. “Chegou à plenitude” comunica conclusão e maturidade de modo natural, sem sugerir ausência abstrata de defeitos.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Nisto sabemos
  rationale: A fórmula joanina apresenta a base ou evidência do conhecimento. “Nisto sabemos” conserva de perto o demonstrativo e é corrente em português.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: que estamos nele
  rationale: “Nele” preserva a expressão relacional joanina sem expandi-la interpretativamente como “em união com ele”.
theological_decisions:
- issue: Sentido do genitivo em ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  alternative: o amor de Deus por nós; o nosso amor por Deus
  rationale: O genitivo grego admite tanto uma leitura subjetiva como objetiva. A redação principal mantém deliberadamente a tensão, e a nota explicita as duas possibilidades.
- issue: Referente do primeiro ἐν τούτῳ
  choice: nessa pessoa
  alternative: nisso; neste
  rationale: O demonstrativo pode retomar a pessoa que guarda a palavra ou apontar para o fato de guardá-la. A leitura pessoal produz português claro, mas a possibilidade mais abstrata é preservada em nota.
- issue: Força de τετελείωται
  choice: chegou à plenitude
  alternative: foi aperfeiçoado; foi levado à plenitude
  rationale: A escolha comunica que o amor alcançou seu objetivo ou plena expressão, sem impor uma noção sistemática de perfeição moral absoluta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantiveram-se a concisão e as expressões características de João. “Nessa pessoa” evita o masculino genérico de “nesse”, enquanto “chegou à plenitude” expressa naturalmente o aspecto resultante do perfeito grego.
