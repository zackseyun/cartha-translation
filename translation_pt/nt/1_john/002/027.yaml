id: 1JN.2.27
reference: 1 John 2:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: pt
  text: Quanto a vocês, a unção que receberam dele permanece[b] em vocês, e vocês não precisam que alguém os ensine. Mas, como a unção dele os ensina a respeito de todas as coisas, é verdadeira e não é mentira, assim como ela os ensinou, permaneçam nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo alguns manuscritos: “e, assim como ela os ensinou, vocês permanecem nele”.'
    reason: textual_variant
  - marker: b
    text: Também se pode traduzir por “habita em vocês” e “habitem nele”; o mesmo verbo grego é usado ao longo deste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: unção
  rationale: Preserva a metáfora joanina sem identificar explicitamente a unção com o Espírito Santo ou com sua atuação, embora essa identificação seja provável no contexto.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: Mantém o pronome do texto grego e deixa que o contexto determine seu referente, sem substituí-lo por “do Santo”, “de Deus” ou outra explicitação.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: permanece em vocês / permaneçam nele
  rationale: “Permanecer” é atual, claro e conserva a repetição do verbo joanino μένω. A forma final é entendida como imperativo no texto adotado.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: vocês não precisam que alguém os ensine
  rationale: Reproduz a força da afirmação sem transformá-la em explicação doutrinária nem restringi-la por paráfrase.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: ensine / ensina / ensinou
  rationale: Mantém a repetição lexical e a progressão verbal do original.
- source_word: περὶ πάντων
  choice: a respeito de todas as coisas
  rationale: Conserva a amplitude da expressão grega sem limitar interpretativamente seu alcance.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: é verdadeira e não é mentira
  rationale: Preserva a antítese direta entre verdade e mentira; o feminino concorda naturalmente com “unção” em português.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: assim como ela os ensinou
  rationale: Retém a comparação e explicita apenas a concordância exigida pelo português, retomando “a unção” por “ela”.
- source_word: καὶ ὑμεῖς
  choice: Quanto a vocês
  rationale: Expressa de modo natural a topicalização enfática e o contraste presentes no grego.
theological_decisions:
- issue: Referente de “a unção” (χρῖσμα)
  choice: Manter “unção” sem identificar explicitamente o referente no texto principal.
  alternative: “o Espírito Santo” ou “a mensagem/o evangelho recebido”
  rationale: O contexto provavelmente aponta para a presença e a atuação docente do Espírito, mas o autor emprega a metáfora “unção”; preservá-la evita impor uma identificação além do que o versículo diz expressamente.
- issue: Sentido de “vocês não precisam que alguém os ensine”
  choice: Conservar a afirmação sem atenuá-la nem absolutizá-la.
  alternative: Explicá-la como rejeição de todo ensino humano ou restringi-la aos mestres separatistas.
  rationale: A tradução deve manter a tensão da formulação grega e permitir que o contexto delimite seu alcance.
- issue: Forma final μένετε
  choice: 'Imperativo: “permaneçam nele”.'
  alternative: 'Indicativo: “vocês permanecem nele”.'
  rationale: No texto impresso do SBLGNT, a forma é naturalmente lida como exortação; a leitura indicativa apoiada por parte da tradição manuscrita é registrada em nota.
- issue: Referente do pronome final αὐτῷ
  choice: “nele”, com referente pessoal deixado ao contexto.
  alternative: “nela”, referindo-se à unção.
  rationale: O pronome grego é masculino e provavelmente retoma uma pessoa mencionada no contexto. Traduzir “nele” preserva essa indicação sem nomear explicitamente o referente.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Emprega “vocês” para o plural de segunda pessoa e evita tanto arcaísmos como explicitações confessionais. Os marcadores foram posicionados junto às expressões efetivamente esclarecidas pelas notas.
