  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: pt
  text: Eu escrevi a vocês[a], filhos, porque vocês conheceram o Pai. Eu escrevi a vocês, pais, porque vocês conheceram aquele que é desde o princípio.[b] Eu escrevi a vocês, jovens, porque vocês são fortes, a palavra de Deus permanece em vocês[c], e vocês venceram o Maligno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O aoristo grego também pode referir-se ao que o autor acaba de escrever; em português, o pretérito perfeito simples é a forma mais natural neste contexto epistolar.
    reason: lexical_alternative
  - marker: b
    text: “Aquele que é desde o princípio” provavelmente se refere ao Filho preexistente no uso joanino, embora o texto não identifique explicitamente o referente.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “habita em vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Eu escrevi
  rationale: O aoristo indica o ato concluído de escrever. Em português, o pretérito perfeito simples é a forma epistolar mais natural; a nota preserva a possibilidade contextual de entender a escrita como o conteúdo que o autor acaba de registrar.
- source_word: παιδία
  choice: filhos
  rationale: Como vocativo pastoral, “filhos” comunica com naturalidade a metáfora familiar joanina em português, sem acrescentar “queridos” nem sugerir necessariamente crianças pequenas.
- source_word: ἐγνώκατε
  choice: vocês conheceram
  rationale: O perfeito grego apresenta conhecimento adquirido e ainda válido. O pretérito perfeito português expressa naturalmente o ingresso nessa relação, enquanto o contexto sustenta seu efeito presente.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: No uso joanino, trata-se do título divino; a inicial maiúscula torna essa referência clara.
- source_word: πατέρες
  choice: pais
  rationale: Preserva o vocábulo e a tríade retórica, sem reduzi-lo interpretativamente a “homens mais velhos”.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: aquele que existe desde o princípio
  rationale: A formulação conserva o referente pessoal implícito e o sentido presente da expressão, sem identificá-lo explicitamente como Cristo.
- source_word: νεανίσκοι
  choice: jovens
  rationale: Em português, “jovens” é um vocativo masculino plural natural no contexto e mantém o contraste com “pais”, sem a rigidez estilística de “homens jovens”.
- source_word: ἰσχυροί
  choice: fortes
  rationale: Equivalente direto e natural no contexto de vigor espiritual.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: a palavra de Deus
  rationale: Mantém a expressão bíblica conhecida e não restringe indevidamente seu sentido à mensagem proclamada ou ao evangelho.
- source_word: μένει
  choice: permanece
  rationale: Verbo moderno e claro que preserva a duração e o importante motivo joanino de μένω.
- source_word: νενικήκατε
  choice: vocês venceram
  rationale: O pretérito perfeito português comunica uma vitória realizada com relevância atual, em formulação mais natural que “têm vencido”.
- source_word: τὸν πονηρόν
  choice: o Maligno
  rationale: O artigo e a forma masculina favorecem uma referência pessoal. “O Maligno” é claro e tradicional em português, sem transformar a expressão no mal abstrato.
theological_decisions:
- issue: Referente de “aquele que existe desde o princípio”
  choice: Manter o referente implícito, sem nomeá-lo.
  alternative: Explicitar “Cristo” ou “o Filho”; ou entender a expressão genericamente como referência a Deus.
  rationale: O uso joanino provavelmente aponta para o Filho preexistente, mas o grego não o nomeia neste versículo. A tradução preserva essa tensão.
- issue: Identidade do Maligno
  choice: 'Traduzir τὸν πονηρόν como referente pessoal: “o Maligno”.'
  alternative: Traduzir como o conceito abstrato “o mal”.
  rationale: A construção articular masculina e o contexto de vitória favorecem a referência pessoal, normalmente entendida como Satanás, sem que a tradução acrescente esse nome.
- issue: Grupos designados na tríade
  choice: Usar “filhos”, “pais” e “jovens”, preservando as imagens e formas do texto.
  alternative: Generalizar todos os grupos como estágios de maturidade espiritual ou torná-los explicitamente inclusivos.
  rationale: O texto mistura um termo filial amplo com vocativos masculinos. A tradução não resolve se são faixas etárias literais, níveis de maturidade ou grupos representativos da comunidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “vocês” para a segunda pessoa plural. A repetição “Eu escrevi a vocês” conserva a estrutura retórica. “Filhos” funciona como tratamento pastoral; “jovens” é masculino plural no contexto da tríade. Todos os marcadores de nota aparecem no texto e seguem a ordem alfabética.
