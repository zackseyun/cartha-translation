reference: 1 John 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: pt
  text: Não amem o mundo, nem as coisas que há no mundo. Se alguém ama o mundo, o amor do Pai não está nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O amor do Pai” pode significar “o amor pelo Pai”; também pode ser entendido como “o amor que vem do Pai”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: Não amem
  rationale: O presente imperativo com μή pode expressar uma proibição geral ou a interrupção de uma ação em curso. A forma simples em português preserva a força sem definir excessivamente o aspecto verbal.
- source_word: κόσμον
  choice: o mundo
  rationale: Mantém a amplitude de κόσμος e permite que o contexto indique o sentido da ordem humana oposta a Deus, sem confundi-lo explicitamente com a criação física nem estreitá-lo para “sistema mundano”.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: nem as coisas que há no mundo
  rationale: Reproduz a coordenação negativa e amplia a proibição do mundo para aquilo que nele se encontra, em linguagem portuguesa natural e próxima da estrutura grega.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Se alguém ama
  rationale: “Alguém” expressa naturalmente o pronome indefinido τις e conserva o alcance genérico da condição.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: o amor do Pai
  rationale: 'Preserva a construção genitiva grega e sua ambiguidade: no contexto, pode indicar sobretudo amor pelo Pai, mas gramaticalmente também pode ser entendido como o amor que procede do Pai.'
- source_word: πατρὸς
  choice: Pai
  rationale: Conserva o título relacional característico do contexto joanino, com inicial maiúscula por se referir a Deus.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Segue o masculino singular de αὐτῷ e retoma de modo natural o indefinido “alguém”; em português, o masculino também funciona genericamente nesta construção.
theological_decisions:
- issue: Sentido de “o mundo” na ética joanina
  choice: Manter “o mundo” sem expansão interpretativa no texto principal.
  alternative: “o sistema do mundo” ou “a ordem mundana”
  rationale: A exortação diz respeito ao mundo enquanto ordem oposta a Deus, não a uma rejeição da criação ou das pessoas. A formulação ampla permite que o contexto estabeleça esse sentido e evita resolver a tensão no próprio texto.
- issue: Sentido do genitivo em “ἡ ἀγάπη τοῦ πατρὸς”
  choice: Manter “o amor do Pai” no texto principal.
  alternative: “o amor pelo Pai” ou “o amor que vem do Pai”
  rationale: O contraste com amar o mundo favorece o sentido de amor dirigido ao Pai, mas a forma grega admite também o amor procedente do Pai. A tradução conserva deliberadamente essa ambiguidade teológica e gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “Não amem” dirige a exortação à comunidade. “Nem” reflete μηδέ de maneira mais exata que “ou”. A nota é colocada após a oração a que se refere, e seu marcador aparece no texto principal.
