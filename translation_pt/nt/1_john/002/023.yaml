source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: pt
  text: Todo aquele que nega o Filho também não tem o Pai; quem confessa o Filho também tem o Pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos omitem: “quem confessa o Filho também tem o Pai”.'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Todo aquele que nega
  rationale: O particípio presente com artigo tem função substantiva e sentido genérico. A formulação é natural em português e conserva tanto o alcance universal quanto a ideia de uma postura característica.
- source_word: ἀρνούμενος
  choice: nega
  rationale: Em contexto confessional, ἀρνέομαι indica negar ou repudiar. “Nega” preserva o uso joanino sem acrescentar nuances interpretativas como rejeição social ou abandono.
- source_word: τὸν υἱὸν
  choice: o Filho
  rationale: O grego traz simplesmente o título definido “o Filho”. Acrescentar “de Deus” explicitaria algo verdadeiro no contexto, mas ausente desta oração.
- source_word: οὐδὲ
  choice: também não
  rationale: Aqui οὐδὲ estende a negação ao Pai. “Também não” expressa essa correlação de modo claro e idiomático em português.
- source_word: τὸν πατέρα ἔχει
  choice: tem o Pai
  rationale: A tradução mantém o verbo ἔχω de forma direta. Embora a expressão tenha forte dimensão relacional em João, não se explicita no texto principal uma interpretação mais restrita, como “tem comunhão com”.
- source_word: ὁ ὁμολογῶν
  choice: quem confessa
  rationale: O particípio presente substantivado tem valor genérico. “Quem confessa” é idiomático e conserva a ideia de reconhecimento declarado, mais forte que um simples reconhecimento mental.
- source_word: καὶ
  choice: também
  rationale: Na construção antitética e paralela, “também” evidencia que aquele que confessa o Filho tem igualmente o Pai e corresponde naturalmente ao “também não” da primeira oração.
theological_decisions:
- issue: Segunda oração marcada no texto grego como variante textual
  choice: 'Incluir no texto principal: “quem confessa o Filho também tem o Pai”'
  alternative: Omitir a segunda oração, ausente em alguns manuscritos
  rationale: A edição SBLGNT inclui a oração, embora a marque como textualmente disputada. Por isso, ela é traduzida no texto principal, e a variação manuscrita é registrada em nota.
- issue: Força relacional de “tem o Pai”
  choice: Manter a expressão literal “tem o Pai”
  alternative: Explicitar como “tem comunhão com o Pai” ou “pertence ao Pai”
  rationale: A formulação joanina afirma a inseparabilidade entre confessar o Filho e ter o Pai. Manter o idioma do texto preserva sua amplitude e tensão teológica sem reduzi-lo a uma única categoria relacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo “também não... também” preserva a estrutura antitética do grego. A nota foi colocada após a oração variante, e seu marcador aparece no texto principal.
