  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: pt
  text: Eles são do mundo[a]; por isso, falam do ponto de vista do mundo, e o mundo os escuta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertencem ao mundo”. O grego usa repetidamente a expressão “do mundo”, indicando fonte, origem ou pertencimento.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “mundo” se refere à ordem humana oposta a Deus, não ao universo criado como tal.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Eles
  rationale: Retoma os falsos profetas do contexto e preserva naturalmente o contraste com “nós” no versículo seguinte, sem tornar explícita em excesso a ênfase do pronome grego.
- source_word: ἐκ τοῦ κόσμου
  choice: do mundo / a partir do mundo
  rationale: A preposição ἐκ indica fonte ou origem. “São do mundo” é idiomático em português; “falam a partir do mundo” torna mais clara a mesma ideia de origem na segunda ocorrência, sem eliminar a repetição de “mundo”.
- source_word: κόσμος
  choice: mundo
  rationale: Mantém o termo joanino tradicional e sua ressonância teológica, sem inserir no texto principal uma paráfrase interpretativa como “sistema do mundo”.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa com clareza e concisão a relação causal entre a origem deles e aquilo que falam.
- source_word: λαλοῦσιν
  choice: falam
  rationale: O presente tem valor geral ou habitual; “falam” é natural, digno e direto.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: o mundo os escuta
  rationale: ἀκούω, neste contexto, sugere recepção favorável, e “escuta” comunica melhor esse sentido do que a mera percepção auditiva de “ouve”.
theological_decisions:
- issue: Sentido de κόσμος na teologia joanina
  choice: A ordem humana afastada de Deus
  alternative: O universo criado ou a humanidade em sentido neutro
  rationale: O contexto contrapõe os que são de Deus aos que são do mundo. O texto principal conserva “mundo”, enquanto a nota esclarece o sentido ético e espiritual sem transformar a explicação em tradução.
- issue: Força de αὐτοὶ
  choice: Sem intensificador explícito no texto principal
  alternative: “Eles mesmos”
  rationale: Embora o pronome tenha força contrastiva, “eles mesmos” poderia soar excessivo em português; o simples “eles” preserva o contraste discursivo de modo natural.
- issue: Repetição de ἐκ τοῦ κόσμου
  choice: Preservar a ideia de origem nas duas ocorrências com formulações idiomáticas distintas
  alternative: 'Repetir literalmente “do mundo” nas duas ocorrências: “falam do mundo”'
  rationale: Em português, “falam do mundo” tende a significar que o mundo é o assunto da fala, enquanto o grego aponta primariamente para sua fonte ou origem. “A partir do mundo” conserva essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém “mundo” como termo teológico joanino e usa “a partir do mundo” para evitar que “falam do mundo” seja entendido como simples referência ao assunto de que falam.
