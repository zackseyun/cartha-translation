  terminology: «Amados», «espírito(s)», «procedem de Deus» e «falsos profetas» são escolhas consistentes, teologicamente não impositivas e fiéis ao vocabulário do original. A nota b esclarece a relação contextual entre espíritos e profetas sem substituir um pelo outro no texto.
