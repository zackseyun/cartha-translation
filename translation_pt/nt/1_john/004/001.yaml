id: 1JN.4.1
reference: 1 John 4:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: pt
  text: Amados[a], não acreditem em todo espírito, mas ponham os espíritos à prova para ver se procedem de Deus[b], pois muitos falsos profetas têm saído para o mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Queridos”. O termo grego de tratamento significa literalmente “amados”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, examinem a fonte espiritual por trás das alegações proféticas; a oração seguinte apresenta os “falsos profetas” como seus agentes humanos.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva a ligação lexical com o amor, característica do estilo de João; em português bíblico atual, continua claro e digno.
- source_word: παντὶ πνεύματι
  choice: em todo espírito
  rationale: Mantém a formulação genérica e a linguagem espiritual do original, sem reduzi-la a mestres humanos ou a declarações proféticas.
- source_word: πιστεύετε
  choice: acreditem
  rationale: Expressa a aceitação de uma alegação como verdadeira e se combina naturalmente com a proibição geral introduzida por μή.
- source_word: δοκιμάζετε
  choice: ponham ... à prova
  rationale: Comunica o exame destinado a verificar autenticidade, com naturalidade e força avaliativa em português contemporâneo.
- source_word: τὰ πνεύματα
  choice: os espíritos
  rationale: Preserva o plural e o enquadramento sobrenatural do texto, sem negar que esses espíritos sejam avaliados por meio de agentes humanos.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: para ver se procedem de Deus
  rationale: A locução torna natural em português a finalidade do teste; o plural retoma distributivamente 'os espíritos', apesar da forma verbal singular no texto grego impresso.
- source_word: ἐκ τοῦ θεοῦ
  choice: procedem de Deus
  rationale: ἐκ indica fonte ou origem; 'procedem de Deus' exprime essa relação com clareza e evita o português menos preciso 'são de Deus' neste contexto.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: muitos falsos profetas
  rationale: Correspondência direta, clara e tradicional para a expressão grega.
- source_word: ἐξεληλύθασιν
  choice: têm saído
  rationale: O perfeito apresenta uma ação ocorrida com relevância presente. A forma composta conserva a imagem de sair e sugere sua atuação continuada.
- source_word: εἰς τὸν κόσμον
  choice: pelo mundo
  rationale: Em português, 'sair pelo mundo' comunica de modo natural que os falsos profetas passaram a atuar no âmbito humano; evita o sentido espacial pouco natural de 'para dentro do mundo'.
theological_decisions:
- issue: Referente de 'espíritos'
  choice: Espíritos ou fontes espirituais reais por trás de alegações proféticas, discernidos por meio de profetas humanos
  alternative: Apenas mestres humanos ou declarações proféticas consideradas abstratamente
  rationale: O versículo distingue 'os espíritos' dos 'falsos profetas'. A tradução conserva essa tensão e a linguagem sobrenatural, enquanto a nota esclarece o modo prático pelo qual o teste ocorre.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O tom é afetuoso, solene e direto. 'Amados' mantém a densidade lexical joanina; 'ponham à prova' é corrente e inequívoco. Os marcadores [a] e [b] aparecem no texto.
