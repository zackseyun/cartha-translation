id: 1JN.4.3
reference: 1 John 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: pt
  text: e todo espírito que não confessa Jesus não procede de Deus.[a] Esse é o espírito do anticristo,[b] a respeito do qual vocês ouviram dizer que está vindo e que agora já está no mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “não confessa que Jesus Cristo veio em carne”.'
    reason: textual_variant
  - marker: b
    text: O grego é elíptico; literalmente, “isso é o que é do anticristo”, com “espírito” subentendido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: todo espírito
  rationale: A expressão é distributiva e, no contexto, se refere a influências ou declarações espirituais submetidas a prova, não ao Espírito Santo; por isso, usa-se inicial minúscula.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: confessa Jesus
  rationale: Mantém a leitura breve do SBLGNT e preserva o sentido de declaração aberta e compromisso de ὁμολογέω, sem inserir no texto principal a expansão de alguns manuscritos.
- source_word: ἐκ τοῦ θεοῦ
  choice: procede de Deus
  rationale: ἐκ indica fonte ou origem. 'Procede de Deus' expressa essa relação com clareza e naturalidade em português.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Esse é o espírito do anticristo
  rationale: Embora o grego seja elíptico e não repita πνεῦμα, o substantivo está claramente subentendido pela oração anterior. Supri-lo produz português natural sem acrescentar um conceito estranho ao contexto; a elipse literal é registrada em nota.
- source_word: ἀντιχρίστου
  choice: do anticristo
  rationale: O artigo grego aponta para a expectativa conhecida do anticristo no contexto joanino; a forma definida em português preserva essa especificidade.
- source_word: ὃ ἀκηκόατε ὅτι ἔρχεται
  choice: do qual vocês ouviram que vem
  rationale: O pronome relativo grego é neutro e retoma a expressão anterior, não exigindo uma referência masculina pessoal. A formulação portuguesa mantém aberta essa relação, embora o gênero gramatical de 'espírito' seja masculino.
- source_word: ἐν τῷ κόσμῳ
  choice: no mundo
  rationale: É a correspondência natural e consagrada para a expressão joanina, sem definir além do texto o alcance teológico de κόσμος.
- source_word: ἤδη
  choice: já
  rationale: Marca de modo conciso a presença atual e antecipada da realidade mencionada.
theological_decisions:
- issue: Forma textual da confissão negada
  choice: 'Seguir no texto principal a leitura breve do SBLGNT: ''não confessa Jesus''.'
  alternative: '''não confessa que Jesus Cristo veio em carne'' e outras formas variantes posteriores'
  rationale: A tradução parte do texto crítico fornecido. O conteúdo cristológico mais desenvolvido aparece no versículo anterior, enquanto a forma mais longa deste versículo deve ser preservada como variante textual, não incorporada silenciosamente.
- issue: Explicitação da elipse em τὸ τοῦ ἀντιχρίστου
  choice: 'Suprir ''espírito'' no texto principal: ''o espírito do anticristo''.'
  alternative: 'Manter a elipse de forma mais literal: ''aquilo que é do anticristo''.'
  rationale: O referente implícito é πνεῦμα, presente na primeira oração. Explicitá-lo evita uma construção artificial em português e segue equivalência ótima, enquanto a nota preserva a informação formal sobre a elipse grega.
- issue: Referente de ὃ ... ἔρχεται
  choice: Não converter o relativo em uma referência pessoal explícita ao anticristo.
  alternative: '''vocês ouviram que ele vem'''
  rationale: O relativo grego é neutro e pode retomar o espírito ou aquilo que pertence ao anticristo. A tradução evita resolver essa tensão como se o texto empregasse uma forma masculina.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Vocês' oferece clareza ampla no plural; 'procede de Deus' ressalta origem sem recorrer à formulação menos natural 'é de Deus'. A ordem foi ajustada minimamente para fluidez, preservando a repetição enfática de 'já' e 'agora' no encerramento.
