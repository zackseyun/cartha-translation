  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: pt
  text: 'É assim que vocês reconhecem[d] o Espírito de Deus: todo espírito que confessa que Jesus, o Messias,[a] veio na carne[b][c] é de Deus,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O grego Χριστός significa “Messias” e, aqui, funciona como título.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tendo vindo na carne”. O grego emprega um particípio perfeito, que apresenta a vinda de Jesus na carne como fato consumado de significado permanente.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “confessa Jesus, o Messias, como aquele que veio na carne”.'
    reason: syntactic_alternative
  - marker: d
    text: 'Ou: “reconheçam”. A forma grega pode ser lida como indicativo ou imperativo; o contexto favorece o indicativo no texto principal.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: É assim que
  rationale: Introduz de modo natural em português o critério pelo qual se reconhece o Espírito, preservando o valor instrumental da expressão.
- source_word: γινώσκετε
  choice: vocês reconhecem
  rationale: O presente, entendido como indicativo no contexto, descreve o discernimento ou reconhecimento; “reconhecem” comunica melhor essa ideia do que o simples “sabem”.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: o Espírito de Deus
  rationale: O singular articulado, em contraste com “todo espírito”, aponta naturalmente para o Espírito que pertence a Deus; a inicial maiúscula segue a convenção portuguesa.
- source_word: πᾶν πνεῦμα
  choice: todo espírito
  rationale: Mantém a expressão distributiva e a distinção entre o Espírito de Deus e cada espírito submetido a exame.
- source_word: ὁμολογεῖ
  choice: confessa
  rationale: Preserva o sentido de reconhecer e declarar abertamente, característico de ὁμολογέω neste contexto joanino.
- source_word: Ἰησοῦν Χριστόν
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui seu valor de título; “o Messias” expressa seu significado de forma clara e idiomática em português.
- source_word: ἐν σαρκὶ
  choice: na carne
  rationale: Formulação natural e tradicional que preserva σάρξ e afirma a vinda corporal real sem inserir terminologia teológica posterior.
- source_word: ἐληλυθότα
  choice: veio
  rationale: A oração finita é a maneira mais natural de representar em português o particípio perfeito ligado ao objeto de “confessa”; uma nota registra sua força duradoura.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: é de Deus
  rationale: Expressa de modo conciso e idiomático a origem indicada por ἐκ, sem sugerir mera posse.
theological_decisions:
- issue: Se τὸ πνεῦμα τοῦ θεοῦ designa especificamente o Espírito de Deus ou genericamente um espírito procedente de Deus
  choice: o Espírito de Deus
  alternative: o espírito que vem de Deus
  rationale: O singular articulado e o contraste imediato com “todo espírito” favorecem a referência ao próprio Espírito de Deus, sem precisar acrescentar “Santo” ao texto.
- issue: Força cristológica de ἐν σαρκὶ ἐληλυθότα
  choice: veio na carne
  alternative: veio como ser humano
  rationale: A tradução mantém a linguagem concreta do grego e afirma a realidade da encarnação sem substituir “carne” por uma interpretação explicativa.
- issue: Relação sintática entre ὁμολογεῖ e Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα
  choice: confessa que Jesus, o Messias, veio na carne
  alternative: confessa Jesus, o Messias, como aquele que veio na carne
  rationale: A oração com “que” é clara e natural em português, enquanto a alternativa explicita mais diretamente a construção de acusativo com particípio; ambas preservam a mesma afirmação central.
translation_notes:
  register: Português atual, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. “É assim que” evita rigidez excessiva, enquanto “confessa”, “Messias” e “na carne” preservam o vocabulário teológico e a textura do original.
