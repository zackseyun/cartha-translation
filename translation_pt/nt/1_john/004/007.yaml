source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: pt
  text: Amados[a], amemos uns aos outros, porque o amor vem de Deus, e todo aquele que ama nasceu de Deus e conhece a Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Queridos”. O termo grego de tratamento significa literalmente “amados” e retoma a mesma família de palavras traduzida por “amemos”, “amor” e “ama” neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que preserva a ligação lexical e retórica com ἀγαπῶμεν, ἀγάπη e ἀγαπῶν ao longo do versículo.
- source_word: ἀγαπῶμεν
  choice: amemos
  rationale: O presente do subjuntivo tem função exortativa. “Amemos” é natural e não explicita indevidamente uma continuidade apenas implícita no aspecto verbal.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco corrente e claro em português.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão da exortação, preservando com clareza sua força causal.
- source_word: ἡ ἀγάπη
  choice: o amor
  rationale: O artigo grego apresenta o amor de modo genérico; em português, “o amor” é a formulação natural.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: vem de Deus
  rationale: ἐκ indica fonte ou origem. “Vem de Deus” exprime isso em português natural, sem sugerir mera posse.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: todo aquele que ama
  rationale: O particípio substantivado com πᾶς designa de maneira geral cada pessoa caracterizada por amar.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: nasceu de Deus
  rationale: O perfeito passivo descreve um nascimento proveniente de Deus com resultado presente. O pretérito perfeito português é idiomático e, no contexto, mantém a ligação com o estado atual expresso por “conhece”.
- source_word: γινώσκει τὸν θεόν
  choice: conhece a Deus
  rationale: O presente comunica conhecimento vigente. A construção “conhecer a Deus” é corrente e evita acrescentar uma nuance ingressiva como “chegou a conhecer”.
theological_decisions:
- issue: Relação entre amor, novo nascimento e conhecimento de Deus
  choice: Manter diretamente a afirmação de que quem ama nasceu de Deus e conhece a Deus.
  alternative: Interpretar a frase como prova técnica de uma ordem específica da salvação, ou reduzi-la a uma declaração puramente ética.
  rationale: O texto liga as três realidades sem formular uma ordem sistemática detalhada. A tradução preserva essa ligação e sua tensão teológica sem ampliação denominacional.
- issue: Repetição do grupo lexical ἀγαπ-
  choice: Usar “Amados”, “amemos”, “amor” e “ama” para tornar perceptível a repetição.
  alternative: Empregar “Queridos amigos” no vocativo, enfraquecendo a conexão lexical.
  rationale: A repetição é parte central da forma literária e do argumento do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “Amados” conserva a repetição retórica do original; a nota registra uma alternativa mais coloquial.
