id: 1JN.4.4
reference: 1 John 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: pt
  text: Vocês, filhinhos, são de Deus e os venceram[a], porque aquele que está em vocês é maior do que aquele que está no mundo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os adversários mencionados pouco antes, especialmente os falsos profetas.
    reason: cross_reference
  - marker: b
    text: O grego deixa implícita a identidade de ambos. O contexto sugere Deus ou seu Espírito para o primeiro e o Maligno que atua por trás do mundo para o segundo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito tem valor enfático. Sua posição inicial preserva o contraste e se ajusta ao português moderno de ampla compreensão.
- source_word: ἐκ τοῦ θεοῦ
  choice: são de Deus
  rationale: A expressão indica origem e pertencimento derivados de Deus. “São de Deus” é natural em português e preserva a formulação joanina sem explicá-la em excesso.
- source_word: τεκνία
  choice: filhinhos
  rationale: O diminutivo é uma forma afetuosa de tratamento. “Filhinhos” conserva o tom familiar e terno do autor.
- source_word: νενικήκατε
  choice: venceram
  rationale: O perfeito grego descreve uma vitória já alcançada cujos efeitos permanecem. No contexto, “venceram” comunica isso de modo claro e natural.
- source_word: αὐτούς
  choice: os
  rationale: O pronome retoma os adversários mencionados no contexto imediato. Mantê-lo pronominal evita identificar além do que o texto deste versículo explicita.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual os destinatários venceram; “porque” expressa claramente essa relação causal.
- source_word: μείζων
  choice: maior
  rationale: O comparativo tem sentido amplo. “Maior” evita reduzi-lo apenas a força ou poder militar.
- source_word: ὁ ἐν ὑμῖν
  choice: aquele que está em vocês
  rationale: A construção substantivada é pessoal, mas deixa a identidade implícita. A tradução preserva essa forma e o contraste retórico.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: aquele que está no mundo
  rationale: A formulação paralela mantém implícito o referente e reproduz o contraste com aquele que está nos destinatários.
- source_word: κόσμῳ
  choice: mundo
  rationale: “Mundo” é o equivalente básico e preserva a amplitude do uso joanino, sem inserir no texto principal a explicação interpretativa “sistema do mundo”.
theological_decisions:
- issue: Identidade de “aquele que está em vocês” e “aquele que está no mundo”
  choice: As duas identidades permanecem implícitas no texto principal.
  alternative: Identificar explicitamente o primeiro como Deus ou o Espírito Santo e o segundo como Satanás ou o Maligno.
  rationale: O contexto aponta fortemente para Deus ou seu Espírito no primeiro caso e para o Maligno por trás do mundo no segundo; contudo, o grego não nomeia nenhum deles aqui. A tradução preserva essa tensão e evita transformar uma inferência contextual em formulação explícita do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Vocês” oferece clareza ampla; “filhinhos” conserva o afeto pastoral. A ordem “Vocês, filhinhos, são de Deus” mantém a ênfase do pronome grego sem soar artificial.
