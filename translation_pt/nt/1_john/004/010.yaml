  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: pt
  text: 'Nisto consiste o amor: não em que nós tenhamos amado a Deus, mas em que ele nos amou e enviou seu Filho como sacrifício de expiação[a] pelos nossos pecados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício propiciatório”; também se pode traduzir “sacrifício que faz expiação”. O termo grego refere-se à ação sacrificial do Filho para tratar dos pecados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Nisto consiste o amor
  rationale: Expressa naturalmente em português a fórmula joanina que aponta para o que segue como a manifestação definidora do amor, sem reduzir a frase a uma mera relação causal.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: não em que ... mas em que
  rationale: Preserva a construção contrastiva e sua função de definir em que consiste o amor.
- source_word: ἠγαπήκαμεν
  choice: tenhamos amado
  rationale: O pretérito perfeito composto do subjuntivo, exigido naturalmente pela construção 'não em que', mantém a perspectiva de uma ação anterior com relevância presente.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: ele nos amou
  rationale: Mantém o contraste enfático entre a iniciativa humana negada e a iniciativa divina afirmada; o pronome explícito 'ele' comunica adequadamente a ênfase de αὐτός.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: enviou seu Filho
  rationale: Tradução direta, natural e cristologicamente precisa da linguagem joanina de envio.
- source_word: ἱλασμὸν
  choice: sacrifício de expiação
  rationale: Comunica de modo acessível o caráter sacrificial e a ação eficaz do Filho em relação aos pecados, sem restringir o termo grego exclusivamente à remoção da culpa ou à propiciação.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: pelos nossos pecados
  rationale: Em contexto sacrificial, 'pelos nossos pecados' é a formulação portuguesa mais natural para a relação expressa por περί.
theological_decisions:
- issue: Sentido de ἱλασμός no contexto da obra do Filho
  choice: sacrifício de expiação
  alternative: sacrifício propiciatório; sacrifício que faz expiação
  rationale: A tradução principal conserva a referência sacrificial e ao tratamento eficaz dos pecados, mas a nota registra a alternativa 'propiciatório' para não resolver silenciosamente a discussão sobre se o termo enfatiza a remoção do pecado, a propiciação ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação 'Nisto consiste o amor' é idiomática e preserva a função definidora da construção grega. O marcador [a] aparece no texto junto à expressão explicada.
