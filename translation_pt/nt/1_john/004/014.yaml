id: 1JN.4.14
reference: 1 John 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: pt
  text: E nós vimos e testemunhamos que o Pai enviou o Filho como Salvador do mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “o Pai enviou o Filho, Salvador do mundo”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: τεθεάμεθα
  choice: vimos
  rationale: O perfeito grego indica uma experiência concluída cujos efeitos permanecem. Em português, “vimos”, coordenado com o testemunho presente, expressa naturalmente a experiência de testemunhas oculares sem recorrer ao menos corrente “temos contemplado”.
- source_word: μαρτυροῦμεν
  choice: testemunhamos
  rationale: O presente indica testemunho contínuo. “Testemunhamos” é atual, claro e mantém a força formal de dar testemunho.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do testemunho, não uma oração causal.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: Mantém o título relacional joanino referente a Deus, com maiúscula segundo o uso português para o título divino.
- source_word: ἀπέσταλκεν
  choice: enviou
  rationale: O perfeito descreve um envio realizado com relevância contínua. O pretérito perfeito simples é a forma natural em português para esse ato concluído; o contexto conserva sua consequência presente.
- source_word: τὸν υἱόν
  choice: o Filho
  rationale: Preserva o artigo e o título relacional do grego, sem acrescentar o possessivo “seu”.
- source_word: σωτῆρα
  choice: Salvador
  rationale: É o equivalente português tradicional, claro e lexicalmente exato para aquele que salva, sem restringir o modo da salvação.
- source_word: τοῦ κόσμου
  choice: do mundo
  rationale: Reproduz naturalmente o genitivo dependente de “Salvador” e mantém o alcance amplo da expressão joanina.
- source_word: καὶ ἡμεῖς
  choice: E nós
  rationale: Conserva tanto a conexão com o contexto quanto a leve ênfase do pronome explícito.
- source_word: σωτῆρα τοῦ κόσμου
  choice: como Salvador do mundo
  rationale: Torna idiomática em português a aposição acusativa ligada a “enviou o Filho”, entendendo-a como a função na qual o Filho foi enviado, sem ocultar em nota a construção mais literal.
theological_decisions:
- issue: Alcance de “Salvador do mundo”
  choice: Mantida a expressão ampla “Salvador do mundo”.
  alternative: Restringir a expressão a um grupo específico ou qualificá-la como salvação apenas potencial.
  rationale: O texto grego apresenta diretamente esse título e seu alcance, sem explicar aqui uma teoria específica da expiação ou limitar os beneficiários.
- issue: Linguagem da relação Pai–Filho
  choice: Traduzidos os títulos como “o Pai” e “o Filho”.
  alternative: Expandir para “Deus Pai” e “Jesus Cristo”.
  rationale: A formulação conserva os títulos relacionais empregados no versículo e não introduz nomes ou títulos ausentes do texto grego.
- issue: Valor de σωτῆρα após “enviou o Filho”
  choice: “como Salvador do mundo” no texto principal.
  alternative: “enviou o Filho, Salvador do mundo”.
  rationale: A primeira opção comunica de modo natural a função ou qualidade predicativa da aposição; a nota preserva a forma estruturalmente mais literal e sua possível leitura simples como título em aposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e os tempos verbais evitam artificialidade; as maiúsculas em “Pai”, “Filho” e “Salvador” assinalam títulos pessoais no contexto, sem acrescentar conteúdo doutrinário.
