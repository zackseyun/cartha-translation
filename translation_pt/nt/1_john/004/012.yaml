  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: pt
  text: Ninguém jamais viu Deus. Se amarmos uns aos outros, Deus permanece em nós e o seu amor[a] é aperfeiçoado[b] em nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nosso amor por Deus”. A expressão grega “o seu amor” pode indicar tanto o amor de Deus por nós quanto o nosso amor dirigido a Deus; o contexto favorece o amor de Deus.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “alcançou sua plenitude em nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: viu
  rationale: Com πώποτε e a negação, o perfeito expressa que jamais houve alguém que visse Deus. “Viu” comunica isso com naturalidade, sem o tom arcaico de “contemplou”.“
- source_word: πώποτε
  choice: jamais
  rationale: Em combinação com οὐδείς, intensifica a afirmação universal e corresponde de modo idiomático a “ninguém jamais”.“
- source_word: ἐὰν ἀγαπῶμεν
  choice: se amarmos
  rationale: Preserva a condição expressa por ἐάν com o subjuntivo presente, em português natural.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco corrente, claro e apropriado ao registro da carta.
- source_word: μένει
  choice: permanece
  rationale: Mantém o sentido durativo e relacional de μένω, termo importante em 1 João, com linguagem acessível.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: o seu amor
  rationale: Preserva a forma genitiva ambígua do grego, enquanto o contexto imediato favorece entendê-la como o amor procedente de Deus.
- source_word: τετελειωμένη ἐστιν
  choice: está aperfeiçoado
  rationale: A construção perifrástica perfeita descreve um estado resultante. “Está aperfeiçoado” preserva tanto esse estado quanto a ligação lexical com τελειόω.
- source_word: ἐν ἡμῖν
  choice: em nós
  rationale: A repetição é mantida de modo consistente. O tema da permanência divina favorece “em nós”, embora “entre nós” seja possível.
theological_decisions:
- issue: Sentido de ἡ ἀγάπη αὐτοῦ (“o seu amor”)
  choice: O amor de Deus é aperfeiçoado em nós
  alternative: Nosso amor por Deus é aperfeiçoado em nós
  rationale: O contexto imediato destaca o amor de Deus como anterior e atuante (vv. 10–11), favorecendo o genitivo subjetivo ou possessivo. A nota preserva a outra leitura gramaticalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Permanece” conserva o vocabulário joanino sem arcaísmo. Os marcadores foram colocados junto às expressões às quais as notas efetivamente se referem.
