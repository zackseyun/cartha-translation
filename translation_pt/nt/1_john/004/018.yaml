id: 1JN.4.18
reference: 1 John 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: pt
  text: No amor não há medo; pelo contrário, o amor perfeito[a] expulsa o medo, porque o medo traz consigo castigo.[b] Mas quem tem medo não foi aperfeiçoado no amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Perfeito” também pode ser entendido como “completo” ou “maduro”: o amor levado à plenitude que lhe é própria.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o medo tem castigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: medo / quem tem medo
  rationale: “Medo” é a correspondência portuguesa mais natural e mantém a repetição lexical ao longo do versículo; neste contexto, refere-se ao temor relacionado ao castigo.
- source_word: ἀγάπῃ / ἀγάπη
  choice: amor
  rationale: É a tradução corrente de ἀγάπη e preserva de modo consistente o termo-chave do texto.
- source_word: τελεία
  choice: perfeito
  rationale: Mantém a ligação lexical com τετελείωται (“foi aperfeiçoado”) e expressa o amor levado à plenitude, sem reduzir a ideia a mera maturidade emocional.
- source_word: ἔξω βάλλει
  choice: expulsa
  rationale: Comunica de modo natural e vigoroso a imagem de lançar algo para fora.
- source_word: κόλασιν ἔχει
  choice: traz consigo castigo
  rationale: A expressão grega é literalmente “tem castigo”. A formulação escolhida é idiomática em português, conserva a relação estreita entre medo e castigo e evita explicitar além do texto se o medo antecipa, envolve ou resulta do castigo.
- source_word: ὁ δὲ φοβούμενος
  choice: Mas quem tem medo
  rationale: Representa naturalmente o particípio substantivado, sem introduzir marcação de gênero.
- source_word: οὐ τετελείωται
  choice: não foi aperfeiçoado
  rationale: Preserva a voz passiva, o estado resultante indicado pelo perfeito e a conexão verbal com “perfeito”.
- source_word: ἐν τῇ ἀγάπῃ
  choice: no amor
  rationale: Tradução simples e natural da expressão preposicional, preservando sua possível noção de esfera ou âmbito.
theological_decisions:
- issue: Sentido de “amor perfeito” e “não foi aperfeiçoado”
  choice: “amor perfeito” / “não foi aperfeiçoado”
  alternative: “amor completo” / “não alcançou a maturidade no amor”
  rationale: A escolha conserva a relação entre τελεία e τετελείωται e a tensão entre a plenitude do amor e a formação ainda incompleta da pessoa nele, sem importar a doutrina de perfeição sem pecado.
- issue: Relação entre medo e castigo
  choice: “o medo traz consigo castigo”
  alternative: “o medo implica castigo” ou, literalmente, “o medo tem castigo”
  rationale: 'A tradução mantém a afirmação compacta e sua ambiguidade: o texto vincula medo e castigo, mas não define de forma explícita toda a natureza causal ou psicológica dessa relação.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “medo” e a ligação entre “perfeito” e “aperfeiçoado” foram mantidas deliberadamente. “Expulsa” preserva a força da metáfora sem soar arcaico.
