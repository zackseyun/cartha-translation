reference: 1 John 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: pt
  text: Nós somos de Deus. Quem conhece a Deus nos escuta[a]; quem não é de Deus não nos escuta[a]. Por meio disso, reconhecemos o Espírito da verdade[b][c] e o espírito do erro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nos ouve», nas duas ocorrências; o verbo grego pode indicar simplesmente ouvir, mas aqui provavelmente tem o sentido de acolher com atenção o testemunho apostólico.
    reason: lexical_alternative
  - marker: b
    text: Ou «o espírito da verdade». A expressão pode ser entendida de maneira mais geral, embora no uso joanino costume referir-se ao Espírito Santo.
    reason: alternative_reading
  - marker: c
    text: A expressão «Espírito da verdade» também aparece em João 14:17; 15:26; 16:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: de Deus
  rationale: Em português, «ser de Deus» expressa naturalmente procedência ou pertencimento e preserva o contraste joanino entre quem tem sua origem em Deus e quem não a tem.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: Quem conhece a Deus
  rationale: A construção genérica representa o particípio substantivado presente e descreve uma característica contínua, sem tornar a frase artificial em português.
- source_word: ἀκούει ἡμῶν
  choice: nos escuta
  rationale: No contexto, ἀκούω envolve acolher com atenção o testemunho apostólico. «Escuta» comunica essa receptividade sem intensificar o sentido para «obedece».
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: quem não é de Deus
  rationale: A formulação genérica é natural e mantém tanto a estrutura contrastiva quanto a noção de origem expressa por ἐκ.
- source_word: ἐκ τούτου
  choice: Por meio disso
  rationale: A expressão indica que a reação ao testemunho apresentado anteriormente serve de critério para o reconhecimento que se segue.
- source_word: γινώσκομεν
  choice: reconhecemos
  rationale: Embora o sentido básico seja «conhecemos», neste contexto o verbo descreve identificação ou discernimento. «Reconhecemos» torna essa função clara sem explicá-la em excesso.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: o Espírito da verdade
  rationale: No uso joanino, a expressão costuma designar o Espírito Santo. A inicial maiúscula indica esse referente provável, enquanto uma nota preserva a leitura mais geral possível.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: o espírito do erro
  rationale: πλάνη pode denotar erro, engano ou desvio. «Erro» mantém de modo conciso a antítese direta com «verdade» e permite referência a uma influência espiritual enganadora.
theological_decisions:
- issue: Se o primeiro πνεῦμα designa especificamente o Espírito Santo
  choice: o Espírito da verdade
  alternative: o espírito da verdade
  rationale: O contexto de provar os espíritos e o uso da mesma expressão em João favorecem uma referência ao Espírito Santo. A capitalização comunica essa leitura provável, sem eliminar a alternativa, registrada em nota.
- issue: Se ἀκούει ἡμῶν indica mera audição ou acolhimento do testemunho apostólico
  choice: nos escuta
  alternative: nos ouve
  rationale: A reação ao ensino dos autores funciona como critério no versículo. «Escuta» sugere atenção receptiva, mas evita acrescentar a ideia mais forte de obediência.
translation_notes:
  register: Português moderno, claro e digno, com construções de ampla compreensão no Brasil e em outros contextos lusófonos. «Nos escuta» é corrente e preserva a força contextual; «Por meio disso» explicita com naturalidade a relação inferencial. A capitalização diferenciada de «Espírito» e «espírito» reflete os referentes mais prováveis sem apagar a ambiguidade do primeiro termo.
