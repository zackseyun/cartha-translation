  text: The one who does not love has not known God[a], because God is love.
translation:
  language: pt
  text: Quem não ama não chegou a conhecer Deus[a], porque Deus é amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Quem não ama não conhece Deus». O aoristo grego também pode ser traduzido mais simplesmente pelo presente; «não chegou a conhecer» ressalta que essa pessoa não veio a conhecer Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Quem não ama
  rationale: O artigo com o particípio presente funciona substantivamente e descreve genericamente a pessoa caracterizada por não amar. Em português, «quem não ama» é natural e preserva o sentido contínuo ou habitual.
- source_word: ἀγαπῶν / ἀγάπη
  choice: ama / amor
  rationale: A escolha mantém visível a ligação lexical entre o verbo e o substantivo no mesmo versículo.
- source_word: οὐκ ἔγνω
  choice: não chegou a conhecer
  rationale: O aoristo pode apontar para não ter vindo a conhecer Deus, com uma condição presente resultante. Esta formulação preserva essa nuance melhor que o simples «não conhece», sem tornar a frase artificial.
- source_word: τὸν θεόν / ὁ θεὸς
  choice: a Deus / Deus
  rationale: Tradução direta do objeto e do sujeito, com a regência corrente de «conhecer» e sem artigo diante da designação divina.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão da afirmação anterior; «porque» expressa claramente a relação causal.
- source_word: ἐστίν
  choice: é
  rationale: Equivalente direto e natural da cópula no presente.
theological_decisions:
- issue: Força de «Deus é amor»
  choice: Deus é amor
  alternative: Deus é amoroso; O amor é Deus
  rationale: A construção grega apresenta Deus como sujeito e amor como predicativo. A tradução conserva o peso da afirmação sobre o caráter ou a natureza de Deus, sem inverter os termos nem reduzi-la ao adjetivo «amoroso».
- issue: Aspecto de conhecer Deus
  choice: não chegou a conhecer a Deus
  alternative: não conhece a Deus; não compreendeu a Deus
  rationale: A formulação preserva a possível força do aoristo como não ter vindo a conhecer e mantém o sentido relacional de γινώσκω no contexto joanino, sem o reduzir à compreensão intelectual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Quem não ama» evita rigidez, enquanto «não chegou a conhecer» comunica naturalmente a nuance aspectual. A locução «conhecer a Deus» é corrente e mantém a leitura relacional.
