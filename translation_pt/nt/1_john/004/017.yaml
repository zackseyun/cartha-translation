source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: pt
  text: Nisto[a], o amor foi levado à plenitude entre nós, para que tenhamos confiança[b] no dia do juízo, porque, assim como ele[c] é, nós também somos neste mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio disso” ou “Dessa maneira”. A expressão grega também pode indicar a esfera ou o modo em que o amor é levado à plenitude.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “ousadia” ou “plena segurança”.
    reason: lexical_alternative
  - marker: c
    text: “Ele” provavelmente se refere a Jesus; alguns entendem a referência de modo mais geral, como sendo a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Por meio disso
  rationale: Expressa naturalmente em português o possível valor instrumental ou explicativo da locução e prepara a relação com a oração causal posterior, sem identificar de modo rígido o referente de «disso».
- source_word: τετελείωται
  choice: chegou à plenitude
  rationale: Comunica o perfeito passivo como ação completada com resultado presente e evita sugerir que o amor antes tivesse uma falha moral.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: o amor ... entre nós
  rationale: «Entre nós» é português natural e preserva a ideia relacional ou comunitária de μετά com genitivo, sem decidir se se trata exclusivamente do amor de Deus por nós ou do nosso amor.
- source_word: ἵνα παρρησίαν ἔχωμεν
  choice: para que tenhamos confiança
  rationale: Mantém a força de propósito ou resultado de ἵνα e traduz παρρησία como segurança franca e destemida diante do juízo.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: no dia do juízo
  rationale: É uma formulação escatológica clara, digna e corrente em português.
- source_word: ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: porque, assim como ele é, nós também somos
  rationale: Preserva a relação causal, o paralelismo comparativo e o presente verbal do grego.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: neste mundo
  rationale: É a equivalência portuguesa direta e natural para a esfera presente da existência humana.
theological_decisions:
- issue: Referente de ἐκεῖνος («ele»)
  choice: Manter o pronome, com provável referência a Jesus Cristo
  alternative: Entender o pronome como referência mais geral a Deus
  rationale: O uso joanino favorece Cristo como referente, mas o texto grego não nomeia explicitamente o antecedente; por isso, a tradução conserva o pronome e registra a alternativa em nota.
- issue: Sentido do amor levado à plenitude
  choice: O amor chega ao seu propósito em relação à comunidade dos fiéis
  alternative: Restringir a expressão somente ao nosso amor por Deus ou somente ao amor de Deus por nós
  rationale: A formulação grega não exige uma única direção para o amor. A tradução preserva essa abertura e não introduz uma doutrina de perfeição moral absoluta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Chegou à plenitude» soa mais natural que «foi aperfeiçoado» e conserva a noção de cumprimento ou completude. Todas as ambiguidades relevantes são mantidas no texto ou registradas em notas.
