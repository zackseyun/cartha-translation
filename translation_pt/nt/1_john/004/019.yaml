  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: pt
  text: Nós amamos porque ele nos amou primeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Nós o amamos porque ele nos amou primeiro”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Nós
  rationale: O pronome explícito dá certa ênfase ou contraste; “Nós” o preserva de modo natural em português.
- source_word: ἀγαπῶμεν
  choice: amamos
  rationale: O presente do indicativo é vertido pelo presente simples, mantendo a ligação lexical com o tema do amor no contexto e sem acrescentar um objeto ausente no texto adotado.
- source_word: ὅτι
  choice: porque
  rationale: 'A conjunção é entendida em sentido causal: o amor de Deus é a razão e o fundamento do nosso amor.'
- source_word: αὐτὸς
  choice: ele
  rationale: No contexto, o pronome se refere a Deus; “ele” comunica isso naturalmente, sem intensificação desnecessária.
- source_word: πρῶτος
  choice: primeiro
  rationale: Expressa a prioridade temporal do amor de Deus. A posição final em “nos amou primeiro” é idiomática em português.
- source_word: ἠγάπησεν
  choice: amou
  rationale: O aoristo indica o ato anterior e decisivo de Deus, expresso naturalmente pelo pretérito perfeito.
- source_word: ἡμᾶς
  choice: nos
  rationale: É o objeto direto de ἠγάπησεν; o pronome átono “nos” é a forma natural em português.
theological_decisions:
- issue: Se deve ser acrescentado um objeto a “amamos”
  choice: 'Manter o objeto não expresso: “Nós amamos”'
  alternative: “Nós o amamos” ou “Nós amamos a Deus”
  rationale: O texto do SBLGNT não traz objeto depois de ἀγαπῶμεν. Acrescentá-lo eliminaria a amplitude genuína da frase e seguiria outra tradição textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa preserva a repetição de “amar” e a ambiguidade quanto ao objeto do amor dos fiéis.
