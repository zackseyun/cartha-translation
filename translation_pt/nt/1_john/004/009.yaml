id: 1JN.4.9
reference: 1 John 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: pt
  text: 'Nisto se manifestou o amor de Deus entre nós: Deus enviou ao mundo o seu Filho único, para que vivamos por meio dele.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em nós». A expressão grega pode indicar uma manifestação no interior dos que creem ou no meio da comunidade.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: «seu Filho unigênito». O termo grego μονογενής enfatiza a singularidade do Filho; «unigênito» preserva a formulação histórica da igreja.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: Preserva a fórmula demonstrativa joanina e permite que a oração seguinte explique de que modo o amor foi manifestado.
- source_word: ἐφανερώθη
  choice: se manifestou
  rationale: Expressa naturalmente em português o passivo de φανερόω, isto é, tornar-se visível ou conhecido.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: o amor de Deus
  rationale: Mantém a construção genitiva e comunica, no contexto, o amor que procede de Deus e é demonstrado por ele.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: Comunica bem a manifestação do amor no meio da comunidade ou em relação a ela, sem eliminar a alternativa literal «em nós».
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem em português, de modo natural, a explicação concreta de como o amor de Deus se manifestou.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: o seu Filho único
  rationale: «Único» expressa a singularidade de μονογενής com clareza atual, sem incorporar à glosa lexical uma formulação doutrinária posterior.
- source_word: ἀπέσταλκεν
  choice: enviou
  rationale: O pretérito perfeito português apresenta naturalmente o envio como ação concluída; a relevância contínua é clara pelo propósito expresso na oração seguinte.
- source_word: εἰς τὸν κόσμον
  choice: ao mundo
  rationale: Equivalente idiomático de movimento em português para o envio do Filho ao mundo humano.
- source_word: ἵνα ζήσωμεν
  choice: para que vivamos
  rationale: Preserva a finalidade expressa por ἵνα com o subjuntivo, usando a construção portuguesa corrente.
- source_word: δι’ αὐτοῦ
  choice: por meio dele
  rationale: Torna explícita a ideia de meio ou agência de διά com genitivo.
theological_decisions:
- issue: Sentido de μονογενής em referência ao Filho
  choice: Filho único
  alternative: Filho unigênito; Filho singular
  rationale: A tradução principal ressalta a relação filial incomparável e exclusiva sem fazer o termo grego afirmar, por si só, o modo de geração. A formulação histórica é preservada em nota.
- issue: Força de ἐν ἡμῖν
  choice: entre nós
  alternative: em nós
  rationale: A opção principal preserva o possível sentido comunitário da manifestação do amor, enquanto a nota mantém transparente a leitura interior igualmente possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura concisa acompanha o grego sem soar artificial; «Filho» recebe inicial maiúscula por seu uso cristológico titular.
