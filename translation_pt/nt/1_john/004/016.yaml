source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: pt
  text: E nós chegamos a conhecer e a crer no amor que Deus tem em nós[b][a]. Deus é amor, e aquele que permanece no amor permanece em Deus, e Deus permanece nele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois verbos gregos estão no perfeito e descrevem conhecimento e fé adquiridos que continuam no presente. A formulação «chegamos a conhecer e a crer» procura expressar esse resultado presente em português.
    reason: aspectual_alternative
  - marker: b
    text: 'Ou: “entre nós”. A expressão grega pode indicar o amor presente no interior dos fiéis ou manifestado no meio da comunidade.'
    reason: alternative_reading
  - marker: c
    text: “Nele” retoma “aquele que permanece no amor” e tem sentido representativo, abrangendo qualquer pessoa assim descrita.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: chegamos a conhecer
  rationale: O perfeito de γινώσκω aponta para um conhecimento adquirido que permanece no presente; “chegamos a conhecer” comunica esse desenvolvimento e seu resultado.
- source_word: πεπιστεύκαμεν
  choice: cremos nele
  rationale: O presente “cremos” expressa naturalmente em português a confiança estabelecida que resulta do perfeito grego. A retomada por “nele” evita uma coordenação pouco natural entre “conhecer o amor” e “crer no amor”.
- source_word: τὴν ἀγάπην
  choice: o amor
  rationale: Mantém o termo central ἀγάπη e o referente definido no contexto.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: que Deus tem em nós
  rationale: Preserva o valor locativo de ἐν e a ambiguidade entre presença interior nos fiéis e manifestação no meio da comunidade, sem substituí-lo pela interpretação benefativa “por nós”.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Deus é amor
  rationale: Reprodução direta e natural da construção com predicativo, sem expansão interpretativa.
- source_word: ὁ μένων
  choice: aquele que permanece
  rationale: “Permanece” é atual e natural, além de conservar a recorrência do verbo joanino μένω.
- source_word: ἐν τῇ ἀγάπῃ
  choice: no amor
  rationale: Expressa o amor como esfera de permanência e mantém a formulação concisa do grego.
- source_word: ἐν τῷ θεῷ μένει
  choice: permanece em Deus
  rationale: Conserva a linguagem de permanência e a reciprocidade da habitação relacional.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: Deus permanece nele
  rationale: Mantém o masculino singular representativo de αὐτῷ e repete “permanece” para corresponder a μένει.
theological_decisions:
- issue: Sentido de ἐν ἡμῖν na primeira frase
  choice: “em nós”, preservando a leitura locativa
  alternative: “entre nós” como manifestação comunitária; “por nós” como leitura benefativa contextual
  rationale: A preposição ἐν indica primariamente localização. “Em nós” permite tanto a presença interior do amor nos fiéis quanto sua manifestação comunitária, enquanto “por nós” resolveria a tensão de modo mais interpretativo do que o texto exige.
- issue: Aspecto dos dois verbos no perfeito
  choice: “chegamos a conhecer ... e cremos nele”
  alternative: “temos conhecido ... e temos crido nele”
  rationale: A formulação escolhida comunica conhecimento adquirido e fé estabelecida com naturalidade, sem a possível ideia de ação repetida ou meramente contínua que “temos conhecido/temos crido” pode sugerir em português.
- issue: Força representativa de αὐτῷ
  choice: “nele”
  alternative: “nessa pessoa”
  rationale: “Nele” corresponde à forma masculina singular do grego e retoma “aquele”, sem limitar a afirmação aos homens; a nota esclarece sua força representativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da primeira frase foi levemente ajustada para respeitar a regência natural de “conhecer” e “crer”, sem alterar o objeto compartilhado no grego. A repetição de “permanece” conserva o vocabulário e a estrutura recíproca do texto joanino.
