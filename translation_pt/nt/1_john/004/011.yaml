id: 1JN.4.11
reference: 1 John 4:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: pt
  text: Amados, se[a] Deus nos amou assim, nós também devemos amar uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “visto que Deus nos amou dessa maneira”. O grego emprega uma forma condicional (“se”) que, neste contexto, provavelmente pressupõe a condição como verdadeira.'
    reason: Leitura alternativa que esclarece a força contextual da condição sem substituir a forma do texto principal.
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural que preserva a ligação lexical e temática com ἀγαπάω, repetido no versículo, além do tom afetuoso de João.
- source_word: εἰ
  choice: se
  rationale: Mantém a forma condicional grega, embora no contexto a condição seja apresentada como verdadeira.
- source_word: οὕτως
  choice: assim
  rationale: Expressão natural em português que pode apontar tanto para a maneira como para a intensidade do amor de Deus descrito no contexto.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta do sujeito; o artigo grego não precisa ser representado separadamente em português.
- source_word: ἠγάπησεν
  choice: amou
  rationale: Traduz o aoristo de ἀγαπάω de modo natural e preserva o vocabulário central do amor.
- source_word: ἡμᾶς
  choice: nos
  rationale: Representa naturalmente o pronome de primeira pessoa do plural como objeto direto.
- source_word: καὶ ἡμεῖς
  choice: nós também
  rationale: O pronome expresso no grego recebe ênfase; “nós também” preserva essa ênfase e a relação estabelecida por καί.
- source_word: ὀφείλομεν
  choice: devemos
  rationale: Comunica obrigação moral de maneira clara e digna, sem recorrer a uma formulação excessivamente jurídica.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco corrente e claro em português.
- source_word: ἀγαπᾶν
  choice: amar
  rationale: Infinitivo complementar natural depois de “devemos”, preservando a repetição deliberada da raiz ligada ao amor.
theological_decisions:
- issue: Força da oração condicional εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Manter “se Deus nos amou assim”.
  alternative: “visto que Deus nos amou dessa maneira” ou “já que Deus nos amou assim”.
  rationale: A verdade do amor de Deus é pressuposta no contexto, mas o grego apresenta o raciocínio em forma condicional. Manter “se” preserva a estrutura retórica e evita transformar implicitamente a condição em uma oração causal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Amados” conserva o tom pastoral e a cadeia lexical do amor; “devemos” expressa obrigação moral em linguagem corrente. O marcador foi colocado junto de “se”, elemento ao qual a nota se refere diretamente.
