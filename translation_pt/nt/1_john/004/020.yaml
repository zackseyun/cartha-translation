    issue: Os perfeitos ἑώρακεν e οὐχ ἑώρακεν foram vertidos por presentes («vê» e «não vê»).
    rationale: Embora o contraste entre o visível e o invisível seja contextual, o grego formula a razão com referência à experiência de ter visto ou não ter visto. «Já viu ... não viu» preserva essa referência sem usar o pouco idiomático «tem visto».
