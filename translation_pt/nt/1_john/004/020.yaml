source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: pt
  text: 'Se alguém disser[a]: “Eu amo a Deus”, mas odiar seu irmão, é mentiroso; pois quem não ama seu irmão, a quem já viu, não pode amar a Deus, a quem não viu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu irmão ou sua irmã”. O grego diz “seu irmão” (ἀδελφόν), forma masculina singular que, neste contexto, pode ter sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Se alguém disser
  rationale: ἐάν com o subjuntivo aoristo introduz uma condição geral; “Se alguém disser” é natural e preserva a força indefinida de τις.
- source_word: Ἀγαπῶ τὸν θεόν
  choice: Eu amo a Deus
  rationale: Mantém o presente e a repetição de ἀγαπάω ao longo do versículo; em português, o objeto pessoal definido admite naturalmente a preposição “a”.
- source_word: καὶ ... μισῇ
  choice: mas odiar
  rationale: Embora καί costume significar “e”, aqui a relação é adversativa entre a afirmação de amar a Deus e o ódio ao irmão; “mas” explicita naturalmente esse contraste sem alterar o argumento.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Preserva o masculino singular de ἀδελφός e evita interpretar diretamente a expressão como “irmão na fé” no texto principal.
- source_word: ψεύστης ἐστίν
  choice: é mentiroso
  rationale: ψεύστης é substantivo predicativo e expressa um juízo categórico, bem preservado por “é mentiroso”.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: pois quem não ama
  rationale: O particípio substantivado é expresso de modo claro por “quem não ama”, enquanto “pois” preserva a função explicativa de γάρ.
- source_word: ὃν ἑώρακεν ... ὃν οὐχ ἑώρακεν
  choice: a quem vê ... a quem não vê
  rationale: O perfeito grego pode indicar a experiência de ter visto com relevância presente; o presente idiomático em português realça o contraste contínuo entre o irmão visível e Deus invisível, sem acrescentar conteúdo.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: não pode amar
  rationale: Preserva a forte linguagem de incapacidade ou impossibilidade expressa por δύναται.
theological_decisions:
- issue: Sentido contextual de ἀδελφός
  choice: irmão
  alternative: irmão ou irmã; irmão na fé
  rationale: O texto grego usa o masculino singular. “Irmão” mantém a forma da fonte, enquanto a possível função representativa é registrada em nota sem restringir indevidamente o referente.
- issue: Força de οὐ δύναται ἀγαπᾶν
  choice: não pode amar a Deus
  alternative: não é capaz de amar a Deus
  rationale: “Não pode amar” conserva a afirmação forte de João como impossibilidade moral e espiritual, sem explicá-la além do texto.
- issue: Aspecto de ἑώρακεν
  choice: vê / não vê
  alternative: tem visto / não tem visto; viu / não viu
  rationale: A forma perfeita admite destaque à experiência de visão com efeito presente. Em português, o presente produz o contraste natural entre o irmão visível e Deus invisível, sem decidir se a ênfase é exclusivamente temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e mantém a repetição de “amar”, o contraste entre ver e não ver e a força categórica de “mentiroso”.
