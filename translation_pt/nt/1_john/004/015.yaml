  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: pt
  text: Todo aquele que confessa que Jesus é o Filho de Deus, Deus permanece nele, e ele em Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus habita nele, e ele em Deus”. O verbo grego ménō, termo importante nos escritos de João, também pode ser traduzido por “habitar” ou “continuar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Todo aquele que
  rationale: A construção relativa indefinida tem sentido geral, equivalente a “quem quer que” ou “qualquer pessoa que”. “Todo aquele que” é natural, digna e clara em português.
- source_word: ὁμολογήσῃ
  choice: confessa
  rationale: No contexto joanino, o verbo indica reconhecer ou declarar abertamente uma verdade sobre Jesus. “Confessa” conserva tanto a dimensão pública quanto o peso teológico; o presente exprime naturalmente a condição geral em português.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Jesus é o Filho de Deus
  rationale: Mantém sem paráfrase a afirmação cristológica e o título explícito do texto grego.
- source_word: ἐν αὐτῷ μένει
  choice: permanece nele
  rationale: “Permanece” é uma tradução atual e clara de μένω, preservando seu sentido duradouro e relacional e sua importância temática nos escritos joaninos.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: e ele em Deus
  rationale: Preserva a elipse verbal e o equilíbrio retórico do grego; “permanece” é naturalmente subentendido a partir da oração anterior.
theological_decisions:
- issue: Permanência recíproca entre Deus e a pessoa
  choice: Deus permanece nele, e ele em Deus
  alternative: Deus habita nele, e ele habita em Deus
  rationale: A formulação recíproca é mantida sem explicar, reduzir ou sistematizar a linguagem de união relacional presente no texto.
- issue: Título cristológico
  choice: o Filho de Deus
  alternative: o Filho de Deus (sem alternativa necessária no texto principal)
  rationale: Reproduz diretamente o título grego e preserva a afirmação cristológica explícita sem acréscimos confessionais externos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva um tom digno, a terminologia joanina e a elipse da última oração.
