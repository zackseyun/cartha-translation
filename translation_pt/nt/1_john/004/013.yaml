base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: pt
  text: 'Por isto[a] sabemos que permanecemos[b] nele, e ele em nós: porque nos deu do seu Espírito[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nisto sabemos...”. A expressão grega também pode ser traduzida mais formalmente dessa maneira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “continuamos nele”. O verbo grego μένω é um termo importante nos escritos joaninos e indica continuidade numa relação de união com Deus.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “do seu Espírito”. A construção grega pode ressaltar procedência ou participação; em português, “do seu Espírito” também pode ter sentido partitivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Por isto
  rationale: A expressão joanina apresenta a evidência ou o fundamento pelo qual se reconhece o que segue. “Por isto” é natural em português e preserva essa função, sem excluir a alternativa mais formal “Nisto”.
- source_word: γινώσκομεν
  choice: sabemos
  rationale: O presente do indicativo expressa conhecimento ou certeza vigente; “sabemos” é a forma direta e natural no contexto.
- source_word: ἐν αὐτῷ μένομεν
  choice: permanecemos nele
  rationale: “Permanecemos” conserva o sentido durativo e relacional de μένω, termo importante nos escritos joaninos, sem recorrer a linguagem arcaica.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: e ele em nós
  rationale: Mantém a elipse do verbo presente no grego e o paralelismo compacto; em português, entende-se naturalmente que “permanece” está subentendido.
- source_word: ὅτι
  choice: porque
  rationale: O segundo ὅτι introduz a razão ou evidência do conhecimento declarado; “porque” comunica claramente essa força explicativa.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: do seu Espírito
  rationale: A contração “do” permite conservar de modo idiomático a ideia de procedência ou participação expressa por ἐκ. A nota registra de forma explícita o valor de origem.
- source_word: δέδωκεν ἡμῖν
  choice: nos deu
  rationale: A construção é idiomática e concisa. No contexto, o perfeito grego aponta para uma dádiva realizada cujos efeitos permanecem; o pretérito perfeito português é a maneira mais natural de expressá-la.
theological_decisions:
- issue: Referente de “seu” e identidade do Espírito
  choice: “Seu Espírito” se refere a Deus, e “Espírito” recebe inicial maiúscula como referência ao Espírito Santo.
  alternative: “espírito” com inicial minúscula, entendido como disposição ou dom espiritual genérico.
  rationale: No contexto imediato, a permanência recíproca entre Deus e os fiéis é conhecida pela dádiva do Espírito. A maiúscula sinaliza esse referente contextual sem acrescentar uma formulação doutrinária ao texto.
- issue: Linguagem joanina de permanência recíproca
  choice: “permanecemos nele, e ele em nós”, sem repetir o verbo na segunda oração.
  alternative: “permanecemos nele, e ele permanece em nós”.
  rationale: A formulação preserva a reciprocidade teológica e a elipse do original, mantendo sua concisão e sua tensão relacional.
- issue: Nuance de ἐκ diante de “Espírito”
  choice: Conservar a expressão partitiva/de procedência “do seu Espírito”.
  alternative: “o seu Espírito”, que apresentaria de modo mais simples o Espírito como a dádiva inteira.
  rationale: O grego diz literalmente que Deus deu “de/a partir de seu Espírito”. A tradução não deve apagar essa nuance nem definir de forma indevida se ela é prioritariamente partitiva ou indica origem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção elíptica “e ele em nós” conserva o paralelismo do grego sem soar obscura; as notas registram as ambiguidades lexicais relevantes.
