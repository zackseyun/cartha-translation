  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: pt
  text: 'E temos dele este mandamento: quem ama a Deus ame também seu irmão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu irmão ou sua irmã”; o grego diz “seu irmão”, no masculino singular, forma que pode representar outro membro da comunidade de fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: mandamento
  rationale: Preserva a força moral e normativa do termo no uso joanino e é natural no registro bíblico português.
- source_word: ἀπ’ αὐτοῦ
  choice: dele
  rationale: Mantém o pronome do grego, cujo referente natural no contexto imediato é Deus, sem repeti-lo explicitamente.
- source_word: ἵνα
  choice: ':'
  rationale: Os dois-pontos introduzem de modo idiomático o conteúdo do mandamento; a forma verbal seguinte expressa aquilo que ele ordena.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: quem ama a Deus
  rationale: Representa naturalmente o particípio substantivado e sua referência geral, sem recorrer a uma formulação arcaica.
- source_word: ἀγαπᾷ
  choice: ame
  rationale: O presente do subjuntivo, no conteúdo do mandamento, é vertido pelo subjuntivo português com valor injuntivo, preservando a obrigação sem acrescentar um verbo modal.
- source_word: ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Conserva o masculino singular do texto grego; o sentido representativo no âmbito da comunidade de fé é esclarecido em nota.
- source_word: καὶ
  choice: também
  rationale: 'Explicita a força aditiva: o amor a Deus deve incluir igualmente o amor ao irmão.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: amar / ama / ame
  rationale: Mantém coerência lexical para o mesmo grupo verbal, importante na argumentação joanina.
theological_decisions:
- issue: Referência masculina singular em ἀδελφὸν αὐτοῦ
  choice: Manter “seu irmão” no texto principal e explicar em nota seu possível uso representativo.
  alternative: “seu irmão ou sua irmã” ou “outro crente”
  rationale: O grego traz um substantivo masculino singular que, no contexto, pode representar outro membro da comunidade de fé. A tradução conserva a forma da fonte sem restringir silenciosamente seu alcance.
- issue: Força normativa de ἵνα ... ἀγαπᾷ
  choice: Usar o subjuntivo injuntivo “ame”.
  alternative: “deve amar” ou “também ama”
  rationale: A oração apresenta o conteúdo do mandamento, não mera constatação nem finalidade destacada. “Ame” comunica diretamente a injunção e preserva sua força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “E dele temos” preserva a ordem e a ligação discursiva do grego; os dois-pontos tornam natural a introdução do conteúdo do mandamento.
