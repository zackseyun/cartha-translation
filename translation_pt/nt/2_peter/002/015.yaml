id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: pt
  text: Abandonando o caminho reto, desviaram-se, seguindo o caminho de Balaão, filho de Bosor,[a] que amou o pagamento da injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosor é a forma encontrada no texto grego; no Antigo Testamento, Balaão é normalmente chamado filho de Beor.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπόντες
  choice: Abandonando
  rationale: Expressa uma ação anterior ou associada ao verbo principal e comunica uma partida deliberada, com naturalidade em português.
- source_word: εὐθεῖαν ὁδὸν
  choice: o caminho reto
  rationale: Preserva literalmente a imagem moral do caminho e evita substituí-la por uma explicação interpretativa.
- source_word: ἐπλανήθησαν
  choice: desviaram-se
  rationale: Comunica de modo natural o sentido moral e religioso de sair do caminho, sem introduzir um agente externo.
- source_word: ἐξακολουθήσαντες
  choice: seguindo
  rationale: Mantém a relação participial com o verbo principal sem decidir rigidamente se a ação é temporal, circunstancial ou instrumental.
- source_word: τῇ ὁδῷ
  choice: o caminho
  rationale: Mantém a repetição de ὁδός e a metáfora presente no texto grego.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: de Balaão, filho de Bosor
  rationale: Usa a forma portuguesa tradicional de Balaão, representa a filiação implícita na construção genitiva e conserva Bosor conforme o texto grego.
- source_word: μισθὸν ἀδικίας
  choice: o pagamento da injustiça
  rationale: Pagamento transmite a ideia de remuneração ou ganho; da injustiça conserva a força moral de ἀδικία e a ambiguidade da relação genitiva.
- source_word: ἠγάπησεν
  choice: amou
  rationale: Correspondência direta e digna ao aoristo de ἀγαπάω.
theological_decisions:
- issue: Imagem moral de εὐθεῖαν ὁδὸν / τῇ ὁδῷ
  choice: 'Conservar a linguagem de caminho: “caminho reto” e “caminho”.'
  alternative: “caminho certo” ou uma paráfrase como “conduta correta”.
  rationale: A repetição da metáfora é significativa no grego e deve permanecer sem explicação doutrinária adicional.
- issue: Identificação de Βοσόρ
  choice: Bosor no texto principal, com Beor em nota.
  alternative: Beor no texto principal.
  rationale: Bosor é a forma da fonte grega fornecida; a nota informa com transparência a forma habitual no Antigo Testamento.
- issue: Relação sintática de ἐξακολουθήσαντες com ἐπλανήθησαν
  choice: “desviaram-se, seguindo”
  alternative: “desviaram-se por seguirem” ou “depois de seguirem”.
  rationale: A construção escolhida preserva a abertura do particípio grego e não fixa indevidamente uma relação exclusivamente instrumental ou temporal.
- issue: Sentido do genitivo em μισθὸν ἀδικίας
  choice: “pagamento da injustiça”
  alternative: “pagamento pela injustiça” ou “salário da injustiça”.
  rationale: A forma mais próxima conserva a tensão entre pagamento obtido pela prática injusta e pagamento moralmente injusto, sem resolver o genitivo de modo excessivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a metáfora bíblica do caminho, a forma grega Bosor e a ambiguidade sintática do particípio. Todos os marcadores de nota aparecem no texto principal.
