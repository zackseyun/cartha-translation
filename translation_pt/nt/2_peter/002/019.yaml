  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are slaves of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: pt
  text: Prometem-lhes liberdade, enquanto eles próprios são escravos da corrupção[a]; pois quem foi vencido por algo também está escravizado por isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ruína”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “pois, por aquilo que alguém foi vencido, por isso também foi escravizado”.'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: liberdade
  rationale: É o equivalente corrente e natural para a condição oposta à escravidão, preservando o contraste central do versículo.
- source_word: ἐπαγγελλόμενοι
  choice: Prometem-lhes
  rationale: O particípio expressa o ato de fazer uma promessa; a forma verbal finita produz português natural no contexto.
- source_word: δοῦλοι
  choice: escravos
  rationale: Mantém a força da sujeição e a ironia entre a liberdade prometida e a escravidão real.
- source_word: ὑπάρχοντες
  choice: embora eles próprios sejam
  rationale: Explicita de modo idiomático o contraste entre o que prometem e sua verdadeira condição, sem alterar a simultaneidade das ações.
- source_word: φθορᾶς
  choice: corrupção
  rationale: Preserva a amplitude moral e destrutiva do termo, que pode envolver tanto degradação quanto ruína.
- source_word: ᾧ γάρ τις ἥττηται
  choice: pois uma pessoa ... por aquilo que a vence
  rationale: Comunica a máxima geral e conserva a ideia passiva de ser vencido ou dominado, em sintaxe portuguesa clara.
- source_word: τούτῳ καὶ δεδούλωται
  choice: fica escravizada por aquilo
  rationale: Expressa o estado resultante indicado pelo perfeito passivo e mantém a ligação lexical com 'escravos'.
theological_decisions:
- issue: Contraste entre a falsa promessa de liberdade e a sujeição à corrupção
  choice: Traduzir δοῦλοι e δεδούλωται por 'escravos' e 'fica escravizada'.
  alternative: servos; fica sob domínio
  rationale: A linguagem explícita de escravidão é essencial ao argumento e não deve ser suavizada.
- issue: Alcance de φθορά
  choice: Usar 'corrupção' no texto e registrar 'ruína' em nota.
  alternative: ruína; destruição; degradação
  rationale: O contexto admite dimensões moral e destrutiva; 'corrupção' preserva essa tensão sem restringir o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição lexical entre 'escravos' e 'escravizada' preserva a coesão do grego; a segunda oração foi reordenada para soar natural sem eliminar a relação entre derrota e escravidão.
