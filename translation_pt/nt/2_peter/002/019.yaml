  source_fidelity: A primeira oração transmite adequadamente a promessa de liberdade e a condição real de escravidão à corrupção. Na segunda, porém, «aquilo que a vence» usa presente e atenua os dois perfeitos passivos gregos (ἥττηται; δεδούλωται), que apresentam a derrota e a escravização como realidades já efetivadas, com estado resultante. A revisão conserva a máxima geral, o paralelismo «por ... por isso» e o vínculo de escravidão.
  naturalness: O texto é claro e de registro apropriado. «Enquanto eles próprios são» é mais neutro e próximo do particípio circunstancial do que «embora», sem apagar o contraste retórico. «Quem foi vencido por algo também está escravizado por isso» é natural em português moderno e reproduz melhor o aspecto verbal do original.
  terminology: «Liberdade», «escravos», «corrupção» e «escravizado» são escolhas corretas. A repetição de «escravos/escravizado» preserva a força deliberada de δοῦλοι/δεδούλωται. A nota sobre «ruína» é uma alternativa lexical defensável para φθορά.
