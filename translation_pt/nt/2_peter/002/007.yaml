  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: pt
  text: e resgatou o justo Ló, que era afligido[a] pela conduta[b] libertina[c] dos sem lei—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “era oprimido” ou “era atormentado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “modo de viver” ou “comportamento”.
    reason: lexical_alternative
  - marker: c
    text: “Libertina” traduz um termo que também pode ser vertido como “depravada” ou “desenfreada” e ressalta o excesso moral praticado sem vergonha.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Conjunção simples que dá continuidade à sequência do versículo anterior.
- source_word: δίκαιον Λὼτ
  choice: o justo Ló
  rationale: Preserva diretamente a avaliação moral expressa pelo adjetivo grego e emprega a forma tradicional do nome em português.
- source_word: καταπονούμενον
  choice: era afligido
  rationale: O particípio presente passivo indica sofrimento contínuo causado pela conduta alheia; “era afligido” conserva a voz passiva e permite registrar em nota alternativas de intensidade.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: pela conduta
  rationale: A preposição indica causa ou agente, e ἀναστροφή designa comportamento ou modo de viver; “conduta” reproduz de modo claro e conciso a estrutura grega.
- source_word: τῶν ἀθέσμων
  choice: dos que desprezavam a lei
  rationale: Expressa pessoas que desconsideram aquilo que é estabelecido como lei ou norma. A formulação verbal é mais natural e inteligível que o substantivo pouco corrente “iníquos”, sem reduzir o termo simplesmente a “maus”.
- source_word: ἐν ἀσελγείᾳ
  choice: libertina
  rationale: Qualifica a conduta como marcada por excesso moral descarado e desenfreado. “Libertina” é atual, compreensível e não limita necessariamente o sentido apenas ao campo sexual.
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: O aoristo de ῥύομαι comunica livramento de perigo; “resgatou” é claro, vigoroso e adequado ao contexto.
theological_decisions:
- issue: Avaliação moral de Ló diante da narrativa de Gênesis
  choice: Manter explicitamente “o justo Ló”.
  alternative: Suavizar ou omitir a qualificação por causa das ações problemáticas de Ló em Gênesis.
  rationale: O texto grego chama Ló inequivocamente de δίκαιος. A tradução preserva essa afirmação sem tentar resolver a tensão com a narrativa de Gênesis.
- issue: Nuance moral e legal de ἀθέσμων
  choice: “os que desprezavam a lei”
  alternative: “os perversos” ou “os ímpios”
  rationale: A escolha conserva a ideia de desconsideração pelo que é estabelecido ou correto, evitando transformar o termo numa caracterização teológica mais ampla do que a palavra exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem “o justo Ló” é natural no registro bíblico sem ser arcaica. O travessão final preserva a continuidade sintática com o contexto.
