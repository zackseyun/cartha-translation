  to: pois, pelo que via e ouvia, aquele justo, vivendo no meio deles, atormentava dia após dia sua alma justa com as obras deles contrárias à lei—
  rationale: A revisão substitui 'obras perversas' por 'obras ... contrárias à lei', preservando o sentido de ἀνόμοις sem especificar indevidamente qual código legal está em vista. Também ajusta 'esse' para 'aquele' como retomada narrativa mais idiomática. Mantêm-se a ordem enfática inicial, o particípio circunstancial, o imperfeito ativo, a repetição de 'justo/justa' e o travessão de continuação.
