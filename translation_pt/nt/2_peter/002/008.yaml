    rationale: ἀνόμοις qualifica as obras como sem lei ou contrárias à lei; 'perversas' comunica maldade, mas omite o traço legal/moral expresso no grego.
  - severity: low
    issue: ‘Esse justo’ é uma retomada menos fluida no contexto narrativo.
    rationale: ‘Aquele justo’ reproduz com maior naturalidade a referência anafórica a Ló no versículo anterior, sem alterar o sentido.
  revised_text: pois, pelo que via e ouvia, aquele justo, vivendo no meio deles, atormentava dia após dia sua alma justa com as obras deles contrárias à lei—
