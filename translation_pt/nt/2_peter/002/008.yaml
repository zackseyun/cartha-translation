source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: pt
  text: pois, pelo que via e ouvia, aquele justo, vivendo no meio deles, atormentava dia após dia sua alma justa com as obras deles contrárias à lei—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: por aquilo que via e ouvia
  rationale: Os dativos indicam percepção visual e auditiva, provavelmente como meio ou causa do tormento. A formulação é natural em português e mantém o par grego.
- source_word: ὁ δίκαιος
  choice: esse justo
  rationale: O adjetivo substantivado retoma Ló, mencionado no versículo anterior. “Esse justo” preserva a referência anafórica e a repetição temática de δίκαιος.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: vivendo no meio deles
  rationale: O particípio descreve residência contínua entre aquelas pessoas. A expressão conserva a estrutura circunstancial e é corrente em português.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: dia após dia
  rationale: O idioma grego indica ação repetida e contínua; “dia após dia” comunica bem esse caráter cumulativo.
- source_word: ψυχὴν δικαίαν
  choice: sua alma justa
  rationale: “Alma” traduz diretamente ψυχή aqui como vida interior ou pessoa íntima, sem impor uma antropologia técnica. O possessivo é exigido naturalmente pelo português e vem do contexto.
- source_word: ἀνόμοις ἔργοις
  choice: com as obras perversas deles
  rationale: O dativo pode indicar meio ou causa. “Obras perversas” expressa atos contrários à lei e à ordem moral; “deles” explicita o referente contextual sem alterar o sentido.
- source_word: ἐβασάνιζεν
  choice: atormentava
  rationale: O imperfeito ativo descreve uma ação contínua no passado. “Atormentava” preserva tanto a intensidade do verbo quanto sua voz ativa, em vez de suavizá-lo para “afligia-se”.
theological_decisions:
- issue: Sentido de ψυχή e sua relação com a antropologia
  choice: “alma” como referência não técnica à vida interior de Ló
  alternative: “íntimo”, “ser interior” ou “a si mesmo”
  rationale: O texto descreve a angústia moral interior de Ló, não formula uma doutrina detalhada da composição humana. “Alma” preserva o equivalente bíblico tradicional sem resolver além do texto.
- issue: Voz ativa de ἐβασάνιζεν
  choice: manter “atormentava sua alma justa”
  alternative: “afligia sua alma” ou “sentia-se atormentado”
  rationale: A construção reflexiva em sentido é incomum, mas o grego emprega voz ativa e faz de ψυχή o objeto. A tradução mantém essa tensão, sem transformá-la silenciosamente em passiva ou em mero estado emocional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “por aquilo que via e ouvia” acompanha a ênfase do grego. Conservou-se a repetição de “justo/justa” e a força ativa de “atormentava”. O travessão final sinaliza a continuidade sintática com o contexto.
