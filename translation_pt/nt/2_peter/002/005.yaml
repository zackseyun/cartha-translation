source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: pt
  text: e não poupou o mundo antigo, mas preservou Noé, o oitavo[a], proclamador da justiça[b], ao trazer o dilúvio sobre um mundo de ímpios,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Noé, um dos oito”. A expressão grega é concisa e pode indicar que Noé foi preservado com outras sete pessoas.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir δικαιοσύνη por “retidão” e κῆρυξ por “pregador”. O termo κῆρυξ designa alguém que faz uma proclamação pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: o mundo antigo
  rationale: Expressa naturalmente o mundo de tempos passados, neste contexto o mundo anterior ao dilúvio.
- source_word: οὐκ ἐφείσατο
  choice: não poupou
  rationale: Mantém a força judicial de φείδομαι e corresponde ao uso comum em contextos de juízo.
- source_word: ὄγδοον Νῶε
  choice: Noé, o oitavo
  rationale: Preserva a forma ordinal comprimida do grego sem explicitar no corpo do texto uma relação que o original deixa implícita; a nota esclarece o sentido provável.
- source_word: δικαιοσύνης κήρυκα
  choice: proclamador da justiça
  rationale: ‘Proclamador’ comunica a função pública de κῆρυξ em português atual; ‘justiça’ cobre aqui a qualidade ou ordem moral expressa por δικαιοσύνη, sem restringi-la a uma terminologia eclesiástica.
- source_word: ἐφύλαξεν
  choice: preservou
  rationale: No contexto de livramento em meio ao juízo, indica que Deus manteve Noé a salvo.
- source_word: κατακλυσμὸν
  choice: o dilúvio
  rationale: Embora sem artigo em grego, o referente é o conhecido dilúvio dos dias de Noé; em português, o artigo definido é idiomático e não altera a identificação do evento.
- source_word: κόσμῳ ἀσεβῶν
  choice: sobre um mundo de ímpios
  rationale: Conserva a estrutura descritiva do grego e caracteriza esse mundo por seus habitantes ímpios.
- source_word: ἐπάξας
  choice: ao trazer
  rationale: Reproduz de modo conciso a relação circunstancial do particípio aoristo com o verbo principal.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: ‘Justiça’ é uma tradução ampla e corrente de δικαιοσύνη; ‘retidão’ pode salientar mais diretamente a conduta moral proclamada por Noé e é registrada como alternativa.
- issue: Interpretação de ὄγδοον Νῶε
  choice: Noé, o oitavo
  alternative: Noé, um dos oito
  rationale: A tradução principal conserva a expressão ordinal e sua concisão; a alternativa explicita a interpretação provável de que Noé foi preservado com outras sete pessoas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém a continuidade sintática do período iniciado nos versículos anteriores. As notas preservam a ambiguidade da expressão ordinal e a amplitude lexical de δικαιοσύνη e κῆρυξ.
