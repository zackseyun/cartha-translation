base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: pt
  text: sofrendo como paga pela injustiça[a]. Consideram um prazer entregar-se ao luxo em pleno dia. São manchas e defeitos; entregam-se aos seus enganos[b] enquanto se banqueteiam com vocês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebendo a recompensa do mal que praticaram”.'
