  - marker: b
    text: 'Alguns manuscritos trazem “festas de fraternidade” em vez de “enganos”: “entregam-se às suas festas de fraternidade enquanto se banqueteiam com vocês”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: sofrendo
  rationale: O particípio passivo significa literalmente sofrer dano ou injustiça. No contexto, aponta para a consequência que recai sobre essas pessoas; “sofrendo” mantém a forma passiva sem explicitar além do texto quem aplica a retribuição.
- source_word: μισθὸν ἀδικίας
  choice: como paga por sua injustiça
  rationale: “Paga” comunica o valor retributivo de μισθός, e “injustiça” preserva a força moral abrangente de ἀδικία. A preposição “por” torna natural em português a relação entre a conduta injusta e sua consequência.
- source_word: ἡδονὴν ἡγούμενοι
  choice: Consideram um prazer
  rationale: Reproduz de modo claro a construção em que ἡγέομαι significa considerar ou julgar algo como sendo determinada coisa, enquanto ἡδονή é “prazer”.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: entregar-se ao luxo em pleno dia
  rationale: τρυφή descreve luxo indulgente e prazer excessivo. “Em pleno dia” preserva a ênfase temporal e sugere, sem acrescentar uma explicação, a falta de vergonha dessa conduta.
- source_word: σπίλοι καὶ μῶμοι
  choice: manchas e defeitos
  rationale: Mantém as duas imagens de impureza e desonra. “Defeitos” é acessível e preserva a possível ressonância da linguagem de algo impróprio ou sem integridade.
- source_word: ἐντρυφῶντες
  choice: entregam-se
  rationale: O verbo descreve deleite indulgente. “Entregam-se” soa natural em português e mantém a ideia de participação voluntária e excessiva, retomando o campo semântico de τρυφή.
- source_word: ἀπάταις αὐτῶν
  choice: aos seus enganos
  rationale: Traduz a leitura ἀπάταις do SBLGNT como práticas ou artifícios enganosos, sem decidir se os enganos são dirigidos a si mesmos ou a outras pessoas.
- source_word: συνευωχούμενοι ὑμῖν
  choice: enquanto participam de banquetes com vocês
  rationale: Expressa tanto a ação simultânea do particípio quanto o sentido associativo do verbo, isto é, banquetear-se em companhia de outros. “Participam de banquetes” evita determinar que se trate necessariamente de uma refeição litúrgica específica.
theological_decisions:
- issue: Relação entre ἀδικούμενοι e μισθὸν ἀδικίας
  choice: “sofrendo como paga por sua injustiça”
  alternative: “recebendo a recompensa do mal que praticaram”
  rationale: A tradução principal preserva o passivo incomum ἀδικούμενοι e a tensão retórica de sofrer uma consequência ligada à própria injustiça. A alternativa explicita o sentido contextual de retribuição, mas se afasta mais diretamente da forma lexical do particípio.
- issue: Variante textual ἀπάταις / ἀγάπαις
  choice: ἀπάταις, traduzido por “seus enganos” no texto principal
  alternative: ἀγάπαις, “suas festas de fraternidade”
  rationale: O texto fornecido do SBLGNT adota ἀπάταις, leitura coerente com o tema do engano praticado pelos falsos mestres. A leitura ἀγάπαις é interpretativamente relevante e, por isso, é registrada em nota sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. “Em pleno dia” comunica a ênfase ostensiva do comportamento; “festas de fraternidade” torna inteligível a possível referência às ἀγάπαι sem impor terminologia eclesiástica denominacional.
