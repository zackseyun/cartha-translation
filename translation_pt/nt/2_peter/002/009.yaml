id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: pt
  text: o Senhor sabe livrar da provação os piedosos[a] e manter os injustos sob castigo até o dia do juízo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da tentação». A palavra grega pode significar tentação ou provação; aqui, o contexto favorece o livramento de uma provação.
    reason: lexical_alternative
  - marker: b
    text: Ou «guardar os injustos para serem castigados no dia do juízo». O particípio grego pode descrever um castigo em curso ou um castigo ligado ao juízo futuro.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: sabe
  rationale: Com os infinitivos, expressa conhecimento ou capacidade prática. Em português, «sabe livrar... e manter...» comunica naturalmente esse valor sem exigir «sabe como».
- source_word: κύριος
  choice: o Senhor
  rationale: Forma consagrada, natural e definida pelo contexto.
- source_word: εὐσεβεῖς
  choice: os piedosos
  rationale: O adjetivo substantivado designa pessoas caracterizadas por reverência e devoção a Deus; «piedosos» preserva esse sentido religioso e moral.
- source_word: ἐκ πειρασμοῦ
  choice: da provação
  rationale: πειρασμός admite «tentação» ou «provação». O contexto de Noé e Ló favorece uma situação de prova ou aflição da qual Deus livra.
- source_word: ῥύεσθαι
  choice: livrar
  rationale: ῥύομαι indica retirar alguém do perigo. «Livrar» é corrente, digno e adequado ao contexto bíblico em português.
- source_word: ἀδίκους
  choice: os injustos
  rationale: Preserva a dimensão moral e judicial de ἄδικος sem reduzir o termo apenas a atos específicos.
- source_word: κολαζομένους
  choice: sob castigo
  rationale: Representa o particípio presente como estado ou processo em curso, preservando sua relação sintática ambígua com o ato de manter.
- source_word: εἰς ἡμέραν κρίσεως
  choice: até o dia do juízo
  rationale: Com τηρεῖν, εἰς pode indicar o ponto futuro até o qual ou para o qual os injustos são mantidos. «Até» exprime bem a orientação temporal no contexto, sem eliminar a leitura alternativa registrada em nota.
- source_word: τηρεῖν
  choice: manter
  rationale: τηρέω pode significar guardar, conservar ou reservar. «Manter» combina naturalmente com «sob castigo» e conserva o paralelismo com «livrar».
theological_decisions:
- issue: Sentido de πειρασμός
  choice: provação
  alternative: tentação
  rationale: Os exemplos anteriores tratam de livramento em meio a circunstâncias adversas e juízo. «Provação» se ajusta melhor ao contexto, enquanto a nota preserva a amplitude lexical.
- issue: Força de κολαζομένους e sua relação com εἰς ἡμέραν κρίσεως
  choice: os injustos são mantidos sob castigo até o dia do juízo
  alternative: os injustos são guardados para serem castigados no dia do juízo
  rationale: O particípio presente pode descrever castigo em curso, mas a construção também admite associar o castigo ao juízo futuro. O texto principal representa o aspecto presente, e a nota conserva a alternativa sem impor um esquema doutrinário além do grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada à fluência portuguesa, mantendo o paralelismo entre livrar os piedosos e manter os injustos. As duas ambiguidades relevantes do grego são preservadas em notas.
