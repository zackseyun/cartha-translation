  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: pt
  text: 'Aconteceu com eles o que diz o provérbio verdadeiro: “O cão volta ao seu próprio vômito” e “A porca lavada volta a se revolver na lama”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A primeira frase retoma Provérbios 26:11. Mais literalmente: “Um cão, tendo voltado ao seu próprio vômito... e uma porca lavada, ao ato de se revolver na lama”.'
    reason: cross_reference_and_literal_alternative
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: Aconteceu com eles
  rationale: O perfeito indica uma situação presente resultante do que ocorreu; a formulação é natural em português e mantém a aplicação do provérbio a essas pessoas.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: o que diz o provérbio verdadeiro
  rationale: A construção grega é elíptica. Esta formulação torna claro que o conteúdo do provérbio se cumpriu no caso deles sem resolver além do necessário a elipse original.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: O cão volta ao seu próprio vômito
  rationale: Reproduz em português corrente a força proverbial genérica e preserva ἴδιον, além da ligação com Provérbios 26:11.
- source_word: Ὗς λουσαμένη
  choice: A porca lavada
  rationale: “Porca” preserva o gênero feminino de Ὗς, e “lavada” expressa de modo conciso o particípio sem decidir se ela foi lavada por alguém ou se lavou.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: volta a se revolver na lama
  rationale: “Revolver-se na lama” comunica de modo vívido e natural a ideia de rolar ou chafurdar expressa por κυλισμός e βόρβορος; “volta” explicita o verbo elíptico exigido pelo paralelismo proverbial.
theological_decisions:
- issue: Força da citação proverbial elíptica
  choice: O conteúdo do provérbio aconteceu no caso deles, retratando a recaída sem acrescentar uma explicação doutrinária.
  alternative: “A palavra do provérbio verdadeiro lhes aconteceu” ou “o provérbio verdadeiro se aplica a eles”.
  rationale: A redação mantém a advertência e sua tensão figurativa, sem definir questões sobre o estado espiritual anterior das pessoas retratadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe elíptica do grego foi completada no corpo do texto para produzir dois ditos proverbiais naturais; a forma mais literal foi preservada em nota.
