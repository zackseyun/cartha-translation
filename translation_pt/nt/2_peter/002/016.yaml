id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: pt
  text: 'Mas ele recebeu uma repreensão por sua própria transgressão: um animal de carga mudo[a], falando com voz humana[b], conteve a loucura do profeta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um animal de carga”; a referência é à jumenta de Balaão (Nm 22.28–30).
    reason: cross_reference
  - marker: b
    text: Ou “com voz de homem”. O grego provavelmente significa “com voz humana”, em contraste com a fala de um animal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: uma repreensão
  rationale: ἔλεγξις indica censura ou correção. “Repreensão” é natural em português e se ajusta ao contexto em que Balaão é corrigido.
- source_word: ἰδίας παρανομίας
  choice: sua própria transgressão
  rationale: παρανομία designa uma conduta contrária à lei, não um simples engano. “Própria” preserva a ênfase de ἰδίας na responsabilidade pessoal.
- source_word: ὑποζύγιον
  choice: animal de carga
  rationale: O termo designa genericamente um animal submetido ao jugo ou usado para levar cargas. Embora o contexto de Números identifique a jumenta de Balaão, a tradução mantém a expressão mais ampla do grego.
- source_word: ἄφωνον
  choice: mudo
  rationale: ἄφωνος significa sem voz ou fala. “Mudo” é conciso e conserva a ironia do animal que passa a falar.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: com voz humana
  rationale: A expressão indica o modo da fala e contrasta a voz humana com a condição do animal, sem destacar o sexo masculino.
- source_word: φθεγξάμενον
  choice: falando
  rationale: O particípio descreve uma emissão articulada de fala; “falando” é a forma mais clara e natural em português.
- source_word: ἐκώλυσεν
  choice: conteve
  rationale: κωλύω pode significar impedir, refrear ou deter. “Conteve” comunica que a intervenção refreou a conduta irracional do profeta sem acrescentar uma precisão ausente do texto.
- source_word: παραφρονίαν
  choice: loucura
  rationale: παραφρονία expressa irracionalidade ou desvario forte. “Loucura” preserva melhor essa intensidade do que opções mais brandas como “insensatez”.
- source_word: τοῦ προφήτου
  choice: do profeta
  rationale: O genitivo liga a loucura ao profeta. A designação reproduz o texto grego sem aprovar sua conduta.
theological_decisions:
- issue: Se ὑποζύγιον deve ser especificado como “jumenta” com base no relato de Balaão
  choice: Manter “animal de carga” no texto principal
  alternative: jumenta
  rationale: A alusão a Números 22 é clara, mas o grego de 2Pedro emprega o termo genérico ὑποζύγιον. A tradução preserva essa escolha lexical e esclarece a identificação na nota.
- issue: Como traduzir ἀνθρώπου em ἐν ἀνθρώπου φωνῇ
  choice: humana
  alternative: de homem
  rationale: Aqui ἄνθρωπος contrasta a fala humana com a mudez do animal, e não a voz masculina com a feminina. “Humana” transmite adequadamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura retém o contraste enfático entre o animal mudo e sua fala humana, bem como a força de “loucura”.
