id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: pt
  text: ao passo que os anjos, embora sejam maiores em força e poder, não pronunciam contra eles um juízo insultuoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um juízo blasfemo”, “injurioso” ou “difamatório”. O adjetivo grego pode designar linguagem abusiva, insultuosa ou caluniosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ao passo que
  rationale: Neste contexto, introduz o contraste com a conduta descrita no versículo anterior, mais que uma localização literal.
- source_word: ἄγγελοι
  choice: os anjos
  rationale: O contexto aponta para seres celestiais, não mensageiros humanos.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: em força e poder
  rationale: Preserva os dois substantivos próximos e indica o aspecto em que os anjos são maiores.
- source_word: μείζονες ὄντες
  choice: embora sejam maiores
  rationale: 'Expressa naturalmente o valor concessivo do particípio no contraste: apesar de sua superioridade, eles não agem assim.'
- source_word: οὐ φέρουσιν
  choice: não pronunciam
  rationale: Com κρίσιν, φέρω tem o sentido de apresentar ou proferir um juízo; 'pronunciam' é idiomático em português no âmbito judicial.
- source_word: κατ’ αὐτῶν
  choice: contra eles
  rationale: Mantém a referência pronominal sem identificar de modo mais específico o antecedente.
- source_word: βλάσφημον
  choice: insultuoso
  rationale: Comunica fala injuriosa ou difamatória sem restringir o termo português a uma ofensa dirigida especificamente contra Deus.
- source_word: κρίσιν
  choice: juízo
  rationale: Conserva o sentido amplo de avaliação, sentença ou condenação judicial, qualificado pelo adjetivo.
theological_decisions:
- issue: Referente de αὐτῶν em relação aos 'seres gloriosos' do versículo anterior
  choice: Manter 'eles' sem explicitar o referente no texto principal.
  alternative: Identificar o referente como anjos caídos, dignitários humanos ou seres celestiais gloriosos em geral.
  rationale: O grego deixa o antecedente implícito. A forma pronominal preserva a ambiguidade e evita impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Ao passo que' explicita o contraste; 'juízo insultuoso' preserva o caráter judicial e verbal da expressão grega.
