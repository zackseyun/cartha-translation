  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: pt
  text: E muitos seguirão as práticas libertinas deles[a]; por causa deles, o caminho da verdade será blasfemado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a libertinagem”, “a devassidão” ou “a conduta indecente”. O termo grego indica conduta desavergonhada e desenfreada, muitas vezes com conotações sexuais.
    reason: lexical_alternative
  - marker: b
    text: Ou “será insultado”, “será caluniado” ou “será alvo de blasfêmia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto, natural e suficientemente enfático em português.
- source_word: ἐξακολουθήσουσιν
  choice: seguirão
  rationale: Preserva o futuro e a ideia de acompanhar ou adotar o caminho e a conduta dos falsos mestres.
- source_word: αὐτῶν
  choice: deles
  rationale: Retoma os falsos mestres no contexto e liga naturalmente a eles as práticas mencionadas.
- source_word: ταῖς ἀσελγείαις
  choice: as práticas libertinas
  rationale: Expressa conduta desavergonhada e desenfreada, muitas vezes de caráter sexual, sem restringir o termo apenas à sexualidade; o plural reflete o grego.
- source_word: δι’ οὓς
  choice: por causa deles
  rationale: διά com acusativo indica causa; a formulação mantém a possível referência gramatical aos muitos que os seguem, sem explicá-la além do texto.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: o caminho da verdade
  rationale: Preserva a metáfora e a construção genitiva em português natural, provavelmente designando a fé e o modo de vida cristãos.
- source_word: βλασφημηθήσεται
  choice: será difamado
  rationale: No contexto de um caminho ou fé como objeto, comunica com naturalidade que será desacreditado e alvo de fala injuriosa; uma nota registra alternativas mais formais.
theological_decisions:
- issue: Sentido de “o caminho da verdade”
  choice: Manter a designação metafórica “o caminho da verdade”.
  alternative: Parafrasear como “a verdadeira fé” ou “o verdadeiro caminho”.
  rationale: A expressão provavelmente abrange a mensagem cristã e o modo de vida correspondente, mas a tradução não deve reduzir essa amplitude nem resolver a metáfora.
- issue: Alcance moral de ἀσέλγεια
  choice: “práticas libertinas”
  alternative: “devassidão”, “libertinagem” ou “conduta indecente”
  rationale: A escolha inclui desregramento moral e possíveis conotações sexuais sem limitar o termo a um único tipo de pecado.
- issue: Referente de δι’ οὓς
  choice: Preservar o pronome plural como “deles”.
  alternative: Explicitar “por causa dos que os seguem” ou “por causa dos falsos mestres”.
  rationale: A forma masculina plural pode referir-se mais naturalmente aos muitos seguidores, embora o contexto também mantenha os falsos mestres em vista; a tradução conserva a ambiguidade referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Práticas libertinas” evita tanto um arcaísmo quanto uma redução exclusivamente sexual. “Difamado” soa natural com “caminho da verdade”, enquanto a nota conserva a força mais grave de βλασφημέω.
