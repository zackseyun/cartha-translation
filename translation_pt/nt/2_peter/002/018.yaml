  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: pt
  text: Pois, proferindo palavras pomposas e vazias[a], eles seduzem por meio dos desejos da carne[b] e da sensualidade os que mal estão escapando[c] daqueles que vivem no erro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “proferindo palavras arrogantes e vazias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio de desejos carnais”. O grego usa “carne” em sentido metafórico moral.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os que só agora estão escapando”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: palavras arrogantes e vazias
  rationale: ὑπέρογκα indica fala excessiva, pomposa ou arrogante; ματαιότητος caracteriza seu conteúdo como vazio ou sem substância. A formulação é natural em português e mantém as duas ideias.
- source_word: φθεγγόμενοι
  choice: proferindo
  rationale: Expressa o ato de falar ou pronunciar e se ajusta ao tom elevado da passagem sem soar arcaico.
- source_word: δελεάζουσιν
  choice: seduzem
  rationale: O verbo descreve atrair como por uma isca; “seduzem” conserva a força moral e enganadora no contexto.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: por meio dos desejos da carne
  rationale: ἐν tem valor de meio; “desejos da carne” preserva a metáfora de σάρξ sem interpretá-la como uma categoria doutrinária mais específica.
- source_word: ἀσελγείαις
  choice: sensualidade
  rationale: Designa conduta sensual desenfreada ou libertinagem. O substantivo abstrato singular é idiomático em português, embora o grego esteja no plural.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: os que mal estão escapando
  rationale: Preserva tanto a precariedade indicada por ὀλίγως quanto o aspecto processual do particípio presente ἀποφεύγοντας.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: daqueles que vivem no erro
  rationale: ἀναστρεφομένους descreve modo de viver ou conduta habitual, e πλάνη denota erro ou engano.
theological_decisions:
- issue: Sentido moral de σάρξ
  choice: desejos da carne
  alternative: desejos carnais; desejos da natureza pecaminosa
  rationale: A tradução conserva a metáfora grega e sua tensão moral, sem substituir σάρξ por uma formulação doutrinária interpretativa.
- issue: Situação dos que são seduzidos
  choice: os que mal estão escapando daqueles que vivem no erro
  alternative: os que só agora estão escapando daqueles que vivem no erro
  rationale: A redação mantém a fuga como processo precário e não determina se ela já foi completa nem qual é seu estatuto teológico.
- issue: Relação de ἀσελγείαις com ἐπιθυμίαις σαρκὸς
  choice: desejos da carne e sensualidade
  alternative: desejos da carne, manifestos em atos de sensualidade
  rationale: A coordenação preserva a ambiguidade sintática entre meios relacionados e uma possível explicação mais específica, sem impor uma relação exegética única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação evita separar o objeto direto de “seduzem”; as notas registram alternativas lexicais e textuais relevantes sem sobrecarregar o versículo.
