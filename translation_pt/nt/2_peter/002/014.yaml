source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: pt
  text: tendo olhos cheios de uma adúltera[a], incapazes de cessar de pecar[b], aliciando almas instáveis, tendo o coração treinado na ganância — filhos de maldição,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “cheios de adultério” ou “cheios de desejo adúltero”. O grego diz literalmente “cheios de uma adúltera”, uma imagem vívida.
    reason: lexical_alternative
  - marker: b
    text: Ou “que não cessam de pecar”; segundo outra compreensão, “insaciáveis de pecado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: cheios de uma adúltera
  rationale: Preserva a imagem concreta e incomum do genitivo singular grego, em vez de substituí-la silenciosamente pela interpretação abstrata “cheios de adultério”.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: que não param de pecar
  rationale: Expressa de modo natural a ideia de não cessar do pecado, mantendo a personificação dos “olhos” presente na construção grega.
- source_word: δελεάζοντες
  choice: seduzindo
  rationale: Comunica o ato de atrair enganosamente, preservando a força predatória do verbo no contexto.
- source_word: ψυχὰς ἀστηρίκτους
  choice: almas instáveis
  rationale: Mantém ψυχαί e traduz ἀστήρικτος como falta de firmeza ou estabilidade.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: tendo o coração treinado na ganância
  rationale: “Treinado” conserva a metáfora de exercício de γεγυμνασμένην; “ganância” é atual e transmite claramente πλεονεξία.
- source_word: κατάρας τέκνα
  choice: filhos de maldição
  rationale: Preserva a construção genitiva forte e concisa, sem reduzi-la ao adjetivo interpretativo “amaldiçoados”.
- source_word: ἔχοντες ... ἔχοντες
  choice: tendo ... tendo
  rationale: Mantém a repetição dos particípios e o efeito cumulativo da denúncia.
theological_decisions:
- issue: Se a imagem sexual de μοιχαλίδος deve ser suavizada
  choice: Manter “uma adúltera” no texto principal
  alternative: Traduzir interpretativamente como “adultério” ou “desejo adúltero”
  rationale: A forma concreta singular é genuína no grego e sua força retórica não deve ser apagada; a leitura abstrata é registrada em nota.
- issue: Como entender ἀκαταπαύστους ἁμαρτίας
  choice: “que não param de pecar”
  alternative: “insaciáveis de pecado”
  rationale: A escolha principal reflete mais diretamente a ideia de não cessar, sem eliminar a alternativa que entende a expressão como apetite insaciável pelo pecado.
- issue: Como representar κατάρας τέκνα
  choice: “filhos de maldição”
  alternative: “filhos amaldiçoados” ou “filhos sob maldição”
  rationale: A formulação conserva a tensão da expressão grega, que pode indicar pessoas caracterizadas pela maldição ou destinadas a ela, sem decidir além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura fragmentária e cumulativa foi mantida porque o versículo continua a denúncia do contexto. O travessão destaca a expressão final sem convertê-la em uma oração independente.
