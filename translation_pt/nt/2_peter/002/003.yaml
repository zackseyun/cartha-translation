  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: pt
  text: Por ganância, eles explorarão vocês com palavras fabricadas.[a] O julgamento contra eles, estabelecido há muito tempo, não fica sem agir, e a destruição deles não dorme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farão de vocês objeto de comércio” — o grego emprega uma metáfora comercial para indicar que lucrarão explorando pessoas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Por ganância
  rationale: Expressa de modo natural o motivo ou impulso da atuação dos falsos mestres, preservando a força moral de πλεονεξία.
- source_word: πλαστοῖς λόγοις
  choice: com palavras fabricadas
  rationale: Preserva a ideia de discurso moldado, inventado ou produzido artificialmente, e não apenas de afirmações genericamente falsas.
- source_word: ἐμπορεύσονται
  choice: explorarão vocês
  rationale: 'Comunica claramente o uso figurado do verbo comercial: tratar pessoas como meio de obter lucro. A metáfora comercial mais explícita fica registrada na nota.'
- source_word: κρίμα
  choice: julgamento
  rationale: Mantém o sentido judicial amplo de veredito ou punição sem especificar além do que o contexto afirma.
- source_word: ἔκπαλαι
  choice: desde muito tempo
  rationale: Conserva a força temporal de algo estabelecido ou em vigor há muito tempo.
- source_word: οὐκ ἀργεῖ
  choice: não está inativo
  rationale: Preserva a personificação e a noção de que o julgamento não permanece ocioso nem deixa de agir.
- source_word: ἀπώλεια
  choice: destruição
  rationale: É um equivalente moderno e claro para ruína ou perdição, adequado ao paralelismo com o julgamento.
- source_word: οὐ νυστάζει
  choice: não dorme
  rationale: Mantém a personificação vívida da destruição, que não cochila nem deixa de chegar.
theological_decisions:
- issue: Natureza da punição anunciada
  choice: Traduzir diretamente como julgamento e destruição certos, sem definir a natureza ou a duração final da punição.
  alternative: Interpretar “destruição” especificamente como aniquilação ou apenas como ruína sem juízo final.
  rationale: O versículo anuncia com clareza o julgamento dos falsos mestres, mas não explica por si só os mecanismos nem a duração dessa punição; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” representa naturalmente o plural ὑμᾶς. As personificações do julgamento inativo e da destruição que não dorme foram preservadas.
