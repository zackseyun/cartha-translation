  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: pt
  text: Pois teria sido melhor para eles não terem conhecido o caminho da justiça[a] do que, depois de o conhecerem, voltarem atrás, afastando-se do santo mandamento que lhes foi transmitido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o caminho da retidão”. Neste contexto, “justiça” se refere àquilo que é reto diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “que lhes foi entregue” ou “transmitido a eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: Pois teria sido melhor para eles
  rationale: Preserva a relação explicativa de γάρ e expressa de modo natural em português o valor comparativo e contrafactual da construção com κρεῖττον e ἦν.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: terem conhecido / depois de o conhecerem
  rationale: Mantém a repetição lexical de ἐπιγινώσκω sem exagerar o composto como se significasse necessariamente conhecimento pleno; o pronome retoma naturalmente 'o caminho da justiça'.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: o caminho da justiça
  rationale: ὁδός designa metaforicamente um modo de vida ou curso de conduta. 'Caminho da justiça' é natural e preserva a expressão sem a reduzir a uma paráfrase interpretativa.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Em português, 'justiça' é o equivalente corrente e abrangente de δικαιοσύνη, incluindo aqui a ideia ética de viver retamente diante de Deus; 'retidão' permanece uma alternativa contextual válida.
- source_word: ὑποστρέψαι ἐκ
  choice: voltar atrás, afastando-se de
  rationale: A formulação conserva tanto o movimento de reversão expresso por ὑποστρέφω quanto a separação marcada por ἐκ. Apenas 'voltar de' seria pouco idiomático em português moderno.
- source_word: παραδοθείσης αὐτοῖς
  choice: que lhes foi transmitido
  rationale: Traduz o particípio passivo de παραδίδωμι como algo comunicado ou passado a eles, sem acrescentar a ideia específica de custódia sugerida por 'confiado'.
- source_word: ἁγίας ἐντολῆς
  choice: do santo mandamento
  rationale: Mantém o singular e o peso religioso e moral de ἁγίας, em formulação digna e corrente.
theological_decisions:
- issue: Se a tradução deve resolver a questão entre apostasia real e mera profissão superficial
  choice: Descrever conhecimento e posterior afastamento sem definir a condição salvífica anterior dessas pessoas.
  alternative: Intensificar o texto para afirmar perda da salvação, ou enfraquecê-lo para sugerir apenas contato superficial com a fé.
  rationale: O grego afirma que conheceram o caminho da justiça e depois voltaram atrás, afastando-se do mandamento. Não especifica, neste versículo, uma conclusão sistemática sobre sua condição salvífica; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'voltar atrás, afastando-se de' evita o pouco natural 'voltar do mandamento' e explicita somente a relação já presente entre ὑποστρέψαι e ἐκ. Todos os marcadores de nota aparecem no texto principal.
