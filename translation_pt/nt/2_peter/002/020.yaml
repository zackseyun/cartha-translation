id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: pt
  text: Pois, se, depois de terem escapado das contaminações do mundo por meio do conhecimento do Senhor e Salvador Jesus, o Messias[a], ficam novamente enredados nessas coisas e são vencidos, seu estado final se tornou pior do que o inicial.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Jesus Cristo”. O termo grego Christós significa “Messias” e também é tradicionalmente transliterado como “Cristo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: depois de terem escapado
  rationale: O particípio aoristo indica ação anterior ao novo enredamento; a formulação torna clara essa relação temporal em português natural.
- source_word: μιάσματα
  choice: contaminações
  rationale: Preserva a ideia de poluição ou impureza moral sem soar excessivamente física ou ritual.
- source_word: κόσμου
  choice: do mundo
  rationale: Reproduz naturalmente o genitivo e mantém o mundo como esfera de corrupção moral, sem expansão interpretativa.
- source_word: ἐν ἐπιγνώσει
  choice: por meio do conhecimento
  rationale: Neste contexto, ἐν pode indicar meio; 'conhecimento' evita decidir se o termo implica conhecimento salvífico pleno.
- source_word: κυρίου καὶ σωτῆρος
  choice: Senhor e Salvador
  rationale: Verte de modo corrente e digno os dois títulos aplicados a Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Χριστός conserva aqui força titular; o aposto com artigo é idiomático em português.
- source_word: τούτοις
  choice: por essas coisas
  rationale: O pronome retoma as contaminações mencionadas; com 'enredar', a preposição 'por' expressa naturalmente aquilo que os prende.
- source_word: πάλιν ἐμπλακέντες
  choice: se deixam novamente enredar
  rationale: Mantém a imagem de voltar a ficar preso; a construção pronominal é natural em português e não elimina a sequência com o verbo passivo seguinte.
- source_word: ἡττῶνται
  choice: são vencidos
  rationale: Expressa ser derrotado ou dominado, preservando o sentido moral e espiritual sem explicar além do texto.
- source_word: γέγονεν αὐτοῖς
  choice: seu estado final se tornou
  rationale: O perfeito apresenta uma condição resultante; a formulação portuguesa liga naturalmente a expressão ao comparativo.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: seu estado final se tornou pior do que o inicial
  rationale: Traduz idiomaticamente o contraste entre a condição posterior e a anterior, sem impor referência escatológica específica.
theological_decisions:
- issue: Natureza do 'conhecimento' em relação à apostasia
  choice: conhecimento
  alternative: pleno conhecimento; conhecimento salvífico; mero conhecimento exterior
  rationale: ἐπίγνωσις não resolve por si só se as pessoas haviam sido regeneradas. A tradução preserva a tensão teológica e não incorpora uma leitura denominacional.
- issue: Valor de Χριστός
  choice: o Messias
  alternative: Cristo
  rationale: Neste contexto, o termo permanece audível como título. 'Jesus, o Messias' comunica essa função em português natural.
- issue: Identidade e condição espiritual dos sujeitos
  choice: eles
  alternative: os falsos mestres; verdadeiros crentes apóstatas; pessoas apenas exteriormente convertidas
  rationale: O versículo não deve receber no corpo da tradução uma identificação doutrinária mais específica do que o contexto e a gramática estabelecem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a longa construção condicional do grego, mas organiza os complementos de modo natural. O marcador [a] aparece no texto principal.
