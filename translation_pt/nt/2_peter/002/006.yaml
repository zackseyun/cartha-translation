  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: pt
  text: e, reduzindo a cinzas as cidades de Sodoma e Gomorra, condenou-as à destruição[a], tornando-as exemplo para os que viessem a ser ímpios[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “transformando-as em cinzas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornando-as exemplo para os ímpios do futuro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: reduzindo a cinzas
  rationale: O particípio aoristo indica transformar em cinzas; a expressão preserva tanto a ação quanto seu resultado.
- source_word: καταστροφῇ
  choice: à destruição
  rationale: O dativo ligado a κατέκρινεν expressa o resultado ou conteúdo da condenação, em formulação natural em português.
- source_word: κατέκρινεν
  choice: condenou-as
  rationale: Mantém o sentido judicial do verbo e retoma de modo claro as cidades.
- source_word: ὑπόδειγμα
  choice: exemplo
  rationale: Reproduz o sentido básico de exemplo; o contexto de juízo comunica sua função de advertência.
- source_word: μελλόντων ἀσεβέσιν
  choice: para os que viessem a viver de modo ímpio
  rationale: Expressa a futuridade relativa de μελλόντων e o caráter pessoal e ético-religioso de ἀσεβέσιν sem restringir o referente a um grupo já rotulado.
- source_word: τεθεικώς
  choice: deixando-as como
  rationale: Comunica idiomaticamente o ato de estabelecê-las em condição duradoura como exemplo, coerente com o particípio perfeito.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: as cidades de Sodoma e Gomorra
  rationale: Preserva o plural πόλεις e verte naturalmente a construção genitiva.
theological_decisions:
- issue: Sujeito implícito no contexto
  choice: sujeito verbal não expresso
  alternative: Deus / o Senhor / ele
  rationale: O português permite conservar o sujeito implícito, como no grego, sem introduzir nesta oração um nome ou título ausente.
- issue: Força de ἀσεβέσιν
  choice: os que viessem a viver de modo ímpio
  alternative: os ímpios / pessoas ímpias
  rationale: A formulação preserva a referência pessoal e torna inteligível a dimensão moral-religiosa do termo, mantendo sua relação com a futuridade expressa por μελλόντων.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece ligada à sequência condicional do contexto por meio de “e”. Os marcadores [a] e [b] aparecem no texto principal.
