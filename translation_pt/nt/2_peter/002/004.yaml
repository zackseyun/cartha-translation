source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: pt
  text: Pois, se Deus não poupou os anjos quando pecaram, mas os lançou no Tártaro[a] e os entregou a correntes de trevas[b], para serem guardados para o juízo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os lançou no inferno”. O verbo grego significa especificamente lançar ou confinar no Tártaro; por isso, o texto principal preserva esse termo mais preciso.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos trazem “abismos de trevas” em vez de “correntes de trevas”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: não poupou
  rationale: Expressão portuguesa natural em contexto de punição, preservando a ideia de que Deus não os livrou do castigo.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: os anjos quando pecaram
  rationale: A oração temporal comunica com naturalidade o valor circunstancial e eventivo do particípio aoristo.
- source_word: ταρταρώσας
  choice: os lançou no Tártaro
  rationale: O verbo raro ταρταρόω designa especificamente o ato de lançar ou confinar no Tártaro; manter esse nome preserva a imagem própria do texto sem generalizá-la como 'inferno'.
- source_word: σειραῖς ζόφου
  choice: a correntes de densas trevas
  rationale: Mantém 'correntes' para σειραί e expressa o caráter sombrio e opressivo de ζόφος. 'Densas trevas' soa natural e conserva mais força do que simples 'escuridão'.
- source_word: παρέδωκεν
  choice: os entregou
  rationale: Em contexto judicial, o verbo indica entrega à custódia; a formulação mantém a ligação com as correntes e com o juízo futuro.
- source_word: εἰς κρίσιν
  choice: até o juízo
  rationale: No contexto de custódia, 'até o juízo' indica com clareza o acontecimento futuro aguardado, sem restringir κρίσις a uma sentença condenatória.
- source_word: τηρουμένους
  choice: para serem mantidos
  rationale: Preserva a voz passiva e apresenta a custódia contínua dos anjos em vista do juízo.
theological_decisions:
- issue: Tradução de ταρταρώσας sem importar uma concepção posterior mais ampla de inferno
  choice: os lançou no Tártaro
  alternative: os lançou no inferno
  rationale: O grego emprega o verbo específico ταρταρόω. 'Tártaro' conserva a referência e a imagem do texto, enquanto 'inferno' poderia fundi-la com conceitos teológicos mais gerais.
- issue: Relação sintática entre o lançamento no Tártaro, as correntes e a custódia até o juízo
  choice: os lançou no Tártaro e os entregou a correntes de densas trevas, para serem mantidos até o juízo
  alternative: lançou-os no Tártaro, em correntes de densas trevas, onde estão guardados para o juízo
  rationale: A formulação conserva os elementos da construção grega e sua imagem comprimida sem definir além do texto se as correntes são instrumento, condição ou descrição locativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a sequência lógica e a tensão sintática do grego. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
