  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: pt
  text: sobretudo os que seguem a carne com desejo de contaminação[a] e desprezam o domínio[b]. Atrevidos e obstinados, não tremem ao insultar seres gloriosos[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «movidos pela cobiça da impureza».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «desprezam o senhorio» ou «desprezam a autoridade».'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «glórias». Provavelmente se refere a seres celestiais gloriosos; possivelmente, a anjos.
    reason: alternative_reading
  - marker: d
    text: 'Ou: «não tremem enquanto insultam seres gloriosos».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: sobretudo
  rationale: Marca a ênfase especial dentro da afirmação de juízo iniciada no versículo anterior e soa natural em português.
- source_word: ὀπίσω σαρκὸς
  choice: seguem a carne
  rationale: Conserva a imagem de ir atrás da carne e o termo teologicamente significativo σάρξ, sem explicá-lo como «natureza pecaminosa».
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: dominados pelo desejo de contaminação
  rationale: Expressa de modo natural a circunstância moralmente negativa do particípio. «Contaminação» preserva a ideia de impureza ou profanação própria de μιασμός.
- source_word: πορευομένους
  choice: os que seguem
  rationale: Em combinação com ὀπίσω, «seguem» comunica conduta orientada pela carne sem recorrer ao pouco natural «vão atrás».
- source_word: κυριότητος
  choice: domínio
  rationale: Preserva melhor que «autoridade» a amplitude de κυριότης — domínio, senhorio ou poder governante — e deixa seu referente em aberto.
- source_word: καταφρονοῦντας
  choice: desprezam
  rationale: Comunica claramente o forte sentido de tratar com desdém.
- source_word: Τολμηταί
  choice: Atrevidos
  rationale: Mantém a caracterização breve e incisiva e, no contexto, transmite ousadia censurável.
- source_word: αὐθάδεις
  choice: obstinados
  rationale: Expressa a determinação arrogante de agir segundo a própria vontade, sem reduzir o termo à ideia genérica de orgulho.
- source_word: δόξας
  choice: seres gloriosos
  rationale: A forma plural provavelmente designa seres celestiais revestidos de glória. A expressão é compreensível em português, enquanto a nota preserva a possibilidade mais literal «glórias».
- source_word: οὐ τρέμουσιν
  choice: não tremem
  rationale: Conserva a imagem vívida de ausência de temor ou reverência.
- source_word: βλασφημοῦντες
  choice: ao insultar
  rationale: Neste contexto, βλασφημέω significa falar de modo injurioso contra seres exaltados. «Insultar» evita sugerir indevidamente que o objeto seja necessariamente Deus, e «ao» relaciona naturalmente o particípio à ausência de temor.
theological_decisions:
- issue: Referente de κυριότητος
  choice: domínio, sem especificar o referente
  alternative: o senhorio do Senhor, autoridade humana ou domínio angelical
  rationale: O substantivo pode indicar senhorio ou poder governante, mas o versículo não identifica inequivocamente de quem é esse domínio. O texto principal mantém essa tensão.
- issue: Referente de δόξας
  choice: seres gloriosos celestiais, sem identificá-los mais precisamente
  alternative: anjos, majestades celestiais ou glórias/dignidades em sentido menos pessoal
  rationale: A menção a anjos no versículo seguinte favorece um referente celestial e pessoal, mas δόξας é menos específico que «anjos». Por isso, o texto não os nomeia como tais.
- issue: Força de βλασφημοῦντες
  choice: falar de forma injuriosa contra os seres gloriosos
  alternative: blasfemar em sentido especificamente religioso
  rationale: O verbo pode significar blasfemar, difamar ou insultar. Como o objeto não é explicitamente Deus, «insultar» preserva o sentido sem estreitá-lo de modo indevido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ligação com o versículo anterior, o ritmo acusatório da segunda oração e a vírgula final, pois a frase prossegue no versículo seguinte. Evitaram-se tanto arcaísmos quanto explicações doutrinárias no corpo do texto.
