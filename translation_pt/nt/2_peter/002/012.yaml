  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: pt
  text: Mas estes, como animais irracionais — criaturas guiadas pelo instinto, nascidas para captura e destruição —, proferindo blasfêmias sobre o que não entendem[a], também serão destruídos na sua própria destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “difamando ou insultando sobre assuntos que desconhecem”.'
    reason: lexical_alternative
  - marker: b
    text: O grego repete palavras da mesma raiz para “destruição” e “serão destruídos”, criando um jogo verbal entre ruína e perecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: animais irracionais
  rationale: Expressa animais desprovidos de razão e preserva o contraste moral implícito, em linguagem portuguesa clara e corrente.
- source_word: γεγεννημένα φυσικὰ
  choice: criaturas guiadas pelo instinto, nascidas
  rationale: A formulação explicita φυσικά como sujeição ao impulso natural e mantém em “nascidas” a imagem de γεγεννημένα, evitando o português pouco natural “nascidas naturais”.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: para captura e destruição
  rationale: Mantém a construção de finalidade ou resultado marcada por εἰς e traduz ἅλωσις e φθορά de modo direto.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: acerca do que não entendem
  rationale: O relativo neutro plural aponta para assuntos ou realidades; “não entendem” comunica adequadamente a ignorância censurada.
- source_word: βλασφημοῦντες
  choice: blasfemando
  rationale: Preserva a força religiosa e injuriosa do verbo grego sem especificar indevidamente o objeto da fala.
- source_word: ἐν τῇ φθορᾷ αὐτῶν
  choice: na própria destruição
  rationale: Conserva a linguagem de destruição do contexto; “própria” representa naturalmente αὐτῶν sem decidir de modo rígido se a expressão indica esfera, meio ou destino correspondente.
- source_word: καὶ φθαρήσονται
  choice: também serão destruídos
  rationale: Traduz o futuro passivo e reflete καί, além de preservar a repetição etimológica entre φθορά e φθαρήσονται.
theological_decisions:
- issue: Sentido de βλασφημοῦντες no contexto
  choice: blasfemando
  alternative: difamando; insultando
  rationale: “Blasfemando” mantém a gravidade da expressão grega e deixa aberto o objeto preciso, sem reduzir a fala a mero insulto.
- issue: Sentido de φθορά / φθαρήσονται
  choice: destruição / serão destruídos
  alternative: corrupção / serão corrompidos; ruína / perecerão
  rationale: A imagem imediata de animais destinados à captura e destruição favorece o sentido de ruína ou juízo, e a repetição preserva o jogo verbal do original.
- issue: Força de ἐν em ἐν τῇ φθορᾷ αὐτῶν
  choice: na própria destruição
  alternative: por sua corrupção; na destruição deles
  rationale: A tradução mantém a ambiguidade sem determinar se ἐν indica estritamente esfera ou meio, nem se αὐτῶν se refere de modo possessivo ao destino dos próprios falsos mestres ou à destruição associada aos animais comparados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões preservam a comparação desenvolvida sem tornar o período excessivamente fragmentado. Foram mantidas a dureza da acusação e a repetição deliberada do vocabulário de destruição.
