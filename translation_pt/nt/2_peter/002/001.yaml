id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: pt
  text: Mas também surgiram falsos profetas no meio do povo, assim como haverá falsos mestres entre vocês, os quais introduzirão às escondidas heresias que levam à destruição[a], negando até o Soberano que os comprou[b] e trazendo sobre si mesmos uma rápida destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «facções destrutivas». A palavra grega pode designar partidos ou seitas, mas aqui provavelmente se refere a ensinos ou movimentos que levam à destruição.
    reason: lexical_alternative
  - marker: b
    text: Ou «o Senhor que os redimiu». O grego diz literalmente «o Soberano que os comprou», preservando uma metáfora de compra sem resolver debates teológicos mais amplos sobre seu alcance.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: surgiram
  rationale: Expressa de modo natural o aparecimento histórico dos falsos profetas no meio da comunidade.
- source_word: ψευδοπροφῆται
  choice: falsos profetas
  rationale: Equivalente direto, claro e consagrado do substantivo composto grego.
- source_word: ἐν τῷ λαῷ
  choice: no meio do povo
  rationale: Preserva a referência ao povo da antiga aliança sem explicitar «Israel» além do que o texto diz.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: assim como haverá falsos mestres entre vocês
  rationale: Mantém a comparação entre o passado do povo e o futuro entre os destinatários, em ordem natural no português.
- source_word: ψευδοδιδάσκαλοι
  choice: falsos mestres
  rationale: Tradução direta que conserva o paralelismo com «falsos profetas».
- source_word: παρεισάξουσιν
  choice: introduzirão às escondidas
  rationale: Reproduz tanto a introdução de algo no grupo quanto a nuance de dissimulação ou clandestinidade.
- source_word: αἱρέσεις ἀπωλείας
  choice: heresias que levam à destruição
  rationale: Interpreta o genitivo como caracterização ou resultado, comunicando com clareza que essas heresias conduzem à ruína, sem apagar a alternativa lexical «facções».
- source_word: τὸν ... δεσπότην
  choice: o Soberano
  rationale: Comunica autoridade absoluta e evita traduzir δεσπότης por «Mestre», que em português sugeriria principalmente um professor e confundiria o paralelo com os falsos mestres.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: que os comprou
  rationale: Conserva a metáfora explícita de compra de ἀγοράζω, sem substituí-la pela interpretação teológica mais específica «redimiu».
- source_word: ἀρνούμενοι
  choice: chegarão até a negar
  rationale: Mantém a força de negação e expressa o valor enfático de καί de maneira idiomática.
- source_word: ἐπάγοντες ἑαυτοῖς
  choice: trazendo sobre si mesmos
  rationale: Preserva a construção participial e a força reflexiva, apresentando a destruição como consequência que eles atraem sobre si.
- source_word: ταχινὴν ἀπώλειαν
  choice: uma rápida destruição
  rationale: Mantém a noção de rapidez presente no adjetivo sem substituí-la indevidamente por «eterna» ou por outra qualificação teológica.
theological_decisions:
- issue: Sentido de αἱρέσεις neste contexto
  choice: heresias que levam à destruição
  alternative: facções destrutivas; seitas que levam à destruição
  rationale: A introdução clandestina e a negação do Soberano destacam o conteúdo doutrinariamente desviado, mas a nota preserva a possibilidade de o termo também designar grupos ou partidos.
- issue: Força de τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: o Soberano que os comprou
  alternative: o Senhor que os redimiu; o Dono que os comprou
  rationale: A redação conserva tanto a metáfora de compra quanto a afirmação de que ela se aplica aos falsos mestres, sem resolver debates sobre a natureza ou o alcance dessa compra.
- issue: Distinção entre δεσπότης e κύριος
  choice: Soberano
  alternative: Senhor; Dono; Senhor absoluto
  rationale: «Soberano» preserva a ênfase na autoridade de δεσπότης e evita confundi-lo automaticamente com κύριος; também evita o sentido pedagógico que «Mestre» normalmente teria em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A divisão em duas frases melhora a legibilidade sem alterar a relação lógica do período grego. «Soberano» evita o possível equívoco de «Mestre» como professor e mantém a distinção lexical em relação a κύριος.
