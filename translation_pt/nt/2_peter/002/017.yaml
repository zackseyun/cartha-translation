  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: pt
  text: Esses são fontes sem água e névoas impelidas por uma tempestade[a]; para eles está reservada a negrura das trevas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nuvens impelidas por uma tempestade”. A palavra grega significa mais precisamente “névoas” ou “nevoeiros”, embora algumas traduções adotem o termo mais amplo “nuvens”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a escuridão das trevas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: fontes sem água
  rationale: πηγή designa normalmente uma fonte ou nascente, não um poço escavado; a expressão preserva a ironia de algo que deveria fornecer água, mas não fornece.
- source_word: ὁμίχλαι
  choice: névoas
  rationale: ὁμίχλη denota névoa ou nevoeiro. “Névoas” mantém a imagem de fenômenos atmosféricos transitórios e corresponde mais precisamente ao grego do que “nuvens”.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: impelidas por uma tempestade
  rationale: λαῖλαψ indica uma tempestade violenta, e ἐλαύνω, conduzir ou impelir. A formulação mantém a força passiva do particípio e é natural em português.
- source_word: οἷς
  choice: para eles
  rationale: O pronome relativo retoma as pessoas representadas pelas metáforas. “Para eles” explicita naturalmente em português o referente pessoal masculino plural.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: a escuridão tenebrosa
  rationale: ζόφος comunica trevas densas e sinistras, enquanto σκότος significa escuridão. A formulação reproduz a intensificação da expressão grega sem recorrer a linguagem arcaica.
- source_word: τετήρηται
  choice: está reservada
  rationale: O perfeito passivo de τηρέω expressa que algo foi guardado ou reservado e permanece assim. “Está reservada” comunica com naturalidade esse estado resultante no contexto de juízo.
theological_decisions:
- issue: Natureza da oração final como linguagem de juízo
  choice: Manter a declaração passiva de juízo reservado sem identificar o agente.
  alternative: Acrescentar explicitamente “por Deus”.
  rationale: O grego afirma que a escuridão está reservada para eles, sugerindo juízo divino, mas não nomeia o agente. A tradução não acrescenta uma identificação ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fontes sem água” preserva a imagem concreta; “impelidas” conserva o movimento passivo sem soar excessivamente técnico. A ordem da última oração foi ajustada à naturalidade do português, mantendo o agente implícito.
