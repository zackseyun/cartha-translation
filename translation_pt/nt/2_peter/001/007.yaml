id: 2PE.1.7
reference: 2 Peter 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: pt
  text: e, na devoção, a afeição fraternal[a]; e, na afeição fraternal, o amor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amor fraternal”. O termo grego refere-se ao afeto entre irmãos, especialmente entre os que creem.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: devoção
  rationale: εὐσέβεια indica reverência a Deus manifestada na vida e na conduta. “Devoção” preserva essa dimensão religiosa e prática em português atual, sem a possível conotação excessivamente ritual de “piedade”.
- source_word: φιλαδελφίαν
  choice: afeição fraternal
  rationale: φιλαδελφία designa o afeto próprio de irmãos e, no uso cristão, especialmente o afeto entre os que creem. “Afeição fraternal” mantém a distinção em relação ao ἀγάπη que vem a seguir.
- source_word: ἀγάπην
  choice: amor
  rationale: “Amor” é o equivalente português direto e amplo de ἀγάπη. Aqui, encerra a sequência sem limitar o alcance do termo por meio de uma explicação interpretativa.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: e, na ..., a ...
  rationale: A formulação conserva a repetição e a estrutura cumulativa do grego, apresentando cada virtude como a esfera em que a seguinte deve estar presente.
- source_word: δέ
  choice: e
  rationale: Neste catálogo cumulativo, δέ funciona como conectivo leve, não como contraste; por isso, “e” é a opção natural.
theological_decisions:
- issue: Distinção entre φιλαδελφία e ἀγάπη na sequência de virtudes
  choice: Traduzir φιλαδελφία por “afeição fraternal” e ἀγάπη por “amor”
  alternative: Traduzir φιλαδελφία por “amor fraternal” e ἀγάπη por “amor”
  rationale: O grego emprega dois termos relacionados, mas distintos, em sequência. “Afeição fraternal” evita apagar essa diferença e preserva a progressão retórica até o termo mais amplo, “amor”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição foi mantida para refletir a estrutura retórica da lista grega; “fraternal” funciona de modo inclusivo para a comunidade de fé.
