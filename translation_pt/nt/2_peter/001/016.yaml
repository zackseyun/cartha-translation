  naturalness: O português é moderno, claro e apropriado ao registro. “Por nos termos tornado testemunhas oculares” preserva melhor a relação sintática de meio/fundamento e continua natural. “Sua majestade” é mais fluente do que “a majestade dele” neste contexto.
  terminology: “Senhor”, “o Messias”, “poder”, “vinda”, “mitos engenhosamente inventados” e “testemunhas oculares” são escolhas adequadas. A nota de “vinda” preserva de modo suficiente as alternativas lexicais de παρουσία.
