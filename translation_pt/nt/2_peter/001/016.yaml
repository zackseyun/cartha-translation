id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: pt
  text: Pois não foi seguindo mitos engenhosamente inventados que lhes demos a conhecer o poder e a vinda[a] de nosso Senhor Jesus, o Messias, mas por nos termos tornado testemunhas oculares de sua majestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presença” (ou “chegada”) de nosso Senhor Jesus, o Messias. O termo grego παρουσία pode indicar presença, chegada ou, em muitos contextos do Novo Testamento, a vinda do Messias.
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: mitos engenhosamente inventados
  rationale: Expressa tanto a fabricação deliberada quanto o caráter habilmente elaborado dos mitos, sem recorrer a linguagem arcaica.
- source_word: ἐξακολουθήσαντες
  choice: seguindo
  rationale: 'O gerúndio integra com naturalidade a construção instrumental portuguesa: não foi seguindo mitos que a mensagem foi comunicada.'
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: lhes demos a conhecer
  rationale: Preserva o sentido causativo de γνωρίζω, 'tornar conhecido', e representa o dativo ὑμῖν em português corrente e digno.
- source_word: δύναμιν
  choice: poder
  rationale: É o equivalente direto e natural de δύναμις neste contexto.
- source_word: παρουσίαν
  choice: vinda
  rationale: No contexto cristológico do Novo Testamento, παρουσία frequentemente indica a vinda do Messias; a amplitude lexical de 'presença' ou 'chegada' é preservada em nota.
- source_word: κυρίου
  choice: Senhor
  rationale: Corresponde ao uso titular regular de κύριος para Jesus.
- source_word: Χριστοῦ
  choice: o Messias
  rationale: Χριστός funciona como título; 'o Messias' comunica seu significado em português idiomático, em aposição a Jesus.
- source_word: ἐπόπται
  choice: testemunhas oculares
  rationale: Salienta que os autores viram pessoalmente aquilo de que falam, reforçando o contraste probatório com os mitos inventados.
- source_word: γενηθέντες
  choice: depois de termos sido
  rationale: Representa o particípio aoristo com anterioridade natural em português e evita a expressão menos idiomática 'tornando-nos testemunhas oculares'.
- source_word: μεγαλειότητος
  choice: majestade
  rationale: Mantém o tom elevado e o sentido de grandeza ou magnificência de μεγαλειότης.
- source_word: ἐκείνου
  choice: dele
  rationale: Retoma de modo natural e inequívoco 'nosso Senhor Jesus, o Messias'.
theological_decisions:
- issue: Sentido de παρουσία no contexto cristológico
  choice: vinda
  alternative: presença ou chegada
  rationale: O uso neotestamentário frequentemente confere ao termo sentido escatológico quando se refere a Jesus, mas sua amplitude lexical genuína é registrada em nota, sem eliminar a ambiguidade.
- issue: Χριστός como título ou forma semelhante a nome próprio
  choice: o Messias
  alternative: Cristo
  rationale: Neste sintagma, Χριστός permanece inteligível como título de Jesus; 'o Messias' torna esse valor explícito sem acrescentar conteúdo denominacional.
- issue: Relação dos particípios com o verbo principal
  choice: contraste entre 'seguindo' e 'depois de termos sido testemunhas oculares'
  alternative: não porque seguimos... mas porque nos tornamos testemunhas oculares
  rationale: A formulação preserva o contraste do grego e apresenta a experiência ocular como fundamento da comunicação, sem afirmar mais do que a sintaxe permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar que 'seguindo mitos' pareça modificar apenas 'a vinda'. O título 'o Messias' foi mantido em aposição idiomática. Todos os marcadores de nota presentes no texto correspondem às notas fornecidas.
