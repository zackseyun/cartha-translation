  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: pt
  text: sabendo que em breve deixarei minha tenda[a][b], assim como nosso Senhor Jesus, o Messias, me deixou claro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, Pedro fala de sua morte próxima por meio da imagem de deixar uma morada temporária. Ou: «a remoção de minha tenda».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a partida de minha tenda está próxima».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Mantém a forma participial e sua ligação com o versículo anterior, sem tornar explicitamente causal uma relação que o grego deixa implícita.
- source_word: ταχινή
  choice: em breve
  rationale: Expressa de modo natural a proximidade temporal do acontecimento; a alternativa «está próxima» é registrada em nota.
- source_word: ἀπόθεσις
  choice: deixarei
  rationale: Converte a construção nominal grega em uma forma verbal portuguesa clara, preservando a imagem da tenda sem substituir a metáfora diretamente por «morrerei».
- source_word: σκηνώματός
  choice: esta minha tenda
  rationale: «Tenda» conserva a imagem de uma morada corporal temporária. O demonstrativo «esta» dá naturalidade à referência ao corpo presente, sem explicitar o referente no texto.
- source_word: καθὼς καὶ
  choice: assim como
  rationale: Introduz com naturalidade a comparação ou confirmação indicada pela expressão grega.
- source_word: κύριος
  choice: Senhor
  rationale: É o título português consagrado e adequado ao contexto cristológico.
- source_word: Ἰησοῦς Χριστὸς
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título, e não como sobrenome; o artigo e as vírgulas tornam essa função titular idiomática em português.
- source_word: ἐδήλωσέν
  choice: me deixou claro
  rationale: Comunica o sentido de tornar algo claro ou conhecido sem impor a ideia mais específica de uma revelação formal.
- source_word: μοι
  choice: me
  rationale: Representa naturalmente em português o dativo de objeto indireto.
theological_decisions:
- issue: Metáfora da morte iminente de Pedro
  choice: em breve deixarei esta minha tenda
  alternative: em breve morrerei
  rationale: A tradução conserva a metáfora corporal da tenda temporária e permite que o contexto comunique a referência à morte, sem dissolver a imagem.
- issue: Valor temporal de ταχινή
  choice: em breve
  alternative: está próxima
  rationale: O adjetivo pode destacar que o acontecimento ocorrerá logo ou que já está próximo. O texto principal adota uma formulação temporal natural, e a nota preserva a alternativa.
- issue: Função de Χριστός em Ἰησοῦς Χριστός
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A formulação trata Χριστός como título significativo e o apresenta em português idiomático, sem negar que «Jesus Cristo» seja a forma tradicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem participial foi mantida para preservar a ligação com o contexto anterior; a construção nominal grega foi verbalizada para evitar uma expressão artificial em português.
