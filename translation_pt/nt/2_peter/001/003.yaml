id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: pt
  text: Visto que o seu poder divino nos concedeu tudo o que diz respeito à vida e à devoção a Deus, por meio do conhecimento daquele que nos chamou por sua própria glória e excelência[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para sua própria glória e excelência”. A expressão grega no dativo pode ser entendida de maneiras diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Visto que
  rationale: Introduz a base para o que vem a seguir. Em português, «visto que» comunica naturalmente a força circunstancial ou causal do grego sem separar o versículo da continuação.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: tudo o que diz respeito à vida e à devoção a Deus
  rationale: A construção τὰ πρὸς indica aquilo que diz respeito a algo. A formulação evita acrescentar explicitamente «necessário», ideia plausível, mas não expressa no texto.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: o seu poder divino
  rationale: Reproduz de modo natural a relação possessiva e mantém θεῖος como «divino».
- source_word: δεδωρημένης
  choice: nos concedeu
  rationale: Expressa a dádiva graciosa e a ação já realizada do particípio perfeito, cujo resultado permanece.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: por meio do conhecimento
  rationale: Torna explícita a ideia de meio em διά com o genitivo, sem exagerar ἐπίγνωσις como termo técnico para um conhecimento necessariamente pleno.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: daquele que nos chamou
  rationale: Conserva a referência pessoal e a força verbal do particípio substantivado.
- source_word: ἰδίᾳ
  choice: sua própria
  rationale: Mantém a ênfase de posse ou pertencimento presente em ἴδιος.
- source_word: δόξῃ
  choice: glória
  rationale: É o equivalente consagrado e adequado para a majestade ou esplendor divino neste contexto.
- source_word: ἀρετῇ
  choice: excelência
  rationale: Abrange a qualidade superior expressa por ἀρετή sem restringi-la apenas à virtude moral humana.
- source_word: ζωὴν
  choice: vida
  rationale: Preserva a amplitude do termo grego, permitindo suas dimensões presente e escatológica sem expansão interpretativa.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Comunica em linguagem corrente a orientação reverente e ética para com Deus. É mais transparente ao leitor moderno do que «piedade», que também pode sugerir compaixão.
theological_decisions:
- issue: Valor do dativo em ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: por sua própria glória e excelência
  alternative: para sua própria glória e excelência
  rationale: Com a forma dativa do texto da SBLGNT, a expressão pode ser entendida como instrumental, indicando por que meio se realiza o chamado. A leitura final ou teleológica também é conhecida e fica registrada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Devoção a Deus» evita a possível ambiguidade moderna de «piedade». A vírgula final foi mantida porque o versículo introduz a continuação sintática.
