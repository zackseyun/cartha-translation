source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: pt
  text: E também farei todo o possível para que, depois da minha partida[a], vocês possam, a qualquer momento, recordar estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “depois da minha morte”. O grego diz “depois da minha partida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: farei todo o possível
  rationale: Expressa o esforço intenso e deliberado do futuro de σπουδάζω em português natural.
- source_word: δὲ καὶ
  choice: E também
  rationale: Marca continuação e acrescenta esta iniciativa à diligência mencionada no contexto anterior, sem introduzir contraste forte.
- source_word: ἑκάστοτε
  choice: a qualquer momento
  rationale: Comunica a ideia de cada ocasião ou sempre que houver necessidade.
- source_word: ἔχειν ὑμᾶς
  choice: vocês possam
  rationale: Neste contexto, ἔχειν com o infinitivo exprime capacidade ou possibilidade; a formulação é clara e idiomática.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: depois da minha partida
  rationale: Preserva a metáfora de ἔξοδος para a morte iminente de Pedro sem a explicitar indevidamente no texto principal.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: recordar estas coisas
  rationale: Traduz naturalmente a expressão idiomática que significa trazer algo à memória.
- source_word: τούτων
  choice: estas coisas
  rationale: Mantém a referência ampla e direta às verdades destacadas no contexto imediato.
theological_decisions:
- issue: Sentido de ἔξοδος em referência ao fim iminente de Pedro
  choice: partida
  alternative: morte
  rationale: “Partida” conserva a metáfora respeitosa do grego e sua possível ressonância, enquanto a nota esclarece que ela se refere à morte.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para ampla legibilidade brasileira. A ordem foi ajustada para fluidez, mantendo a finalidade, a referência temporal e a metáfora do original.
