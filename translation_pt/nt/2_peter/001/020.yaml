source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: pt
  text: 'Antes de tudo, saibam isto: nenhuma profecia da Escritura resulta de interpretação própria.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não surge de explicação própria”. A expressão grega não esclarece se a interpretação é a do profeta, a do leitor ou uma explicação de iniciativa particular.'
    reason: Registra as ambiguidades lexical e referencial de ἐπίλυσις e ἰδίας sem resolvê-las no texto principal.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Antes de tudo, saibam isto
  rationale: Expressa com naturalidade a prioridade enfática de πρῶτον e mantém o valor participial como exortação contextual.
- source_word: πᾶσα προφητεία γραφῆς
  choice: nenhuma profecia da Escritura
  rationale: A construção πᾶσα ... οὐ é vertida idiomaticamente em português como negação universal; 'da Escritura' preserva o genitivo sem decidir além do necessário se ele caracteriza a profecia como escriturística.
- source_word: ἰδίας ἐπιλύσεως
  choice: interpretação própria
  rationale: Mantém a ambiguidade de ἰδίας quanto a quem pertence a interpretação, sem acrescentar 'do profeta' ou 'do leitor'.
- source_word: οὐ γίνεται
  choice: resulta de
  rationale: No contexto, γίνεται com genitivo de origem pode indicar procedência ou surgimento; 'resulta de' é corrente e evita reduzir o sentido apenas ao ato posterior de interpretar.
theological_decisions:
- issue: Referente de 'interpretação própria'
  choice: Não identificar o possuidor da interpretação
  alternative: “interpretação do próprio profeta” ou “interpretação pessoal do leitor”
  rationale: O grego não explicita o referente de ἰδίας; especificá-lo resolveria indevidamente uma ambiguidade com implicações exegéticas.
- issue: Escopo da negação em πᾶσα ... οὐ
  choice: “nenhuma profecia”
  alternative: “toda profecia ... não”
  rationale: A negação universal é a formulação portuguesa natural e comunica que profecia alguma constitui exceção, sem alterar a força proposicional.
- issue: Sentido de γίνεται
  choice: Origem/surgimento, expresso por “resulta de”
  alternative: “é de interpretação própria”
  rationale: A redação preserva a ligação provável com a origem da profecia, reforçada pelo versículo seguinte, mas evita paráfrase doutrinária extensa.
translation_notes:
  register: Português moderno, claro e digno, com imperativo inclusivo de uso corrente no Brasil. A sintaxe evita literalismo pouco natural e conserva a tensão interpretativa central do grego.
