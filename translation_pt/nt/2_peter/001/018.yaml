  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: pt
  text: E nós mesmos ouvimos esta voz, trazida do céu, quando estávamos com ele no monte santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levada do céu”.'
    reason: Alternativa lexical para ἐνεχθεῖσαν, preservando mais diretamente a imagem de algo conduzido ou transportado.
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: esta voz
  rationale: φωνή se refere à declaração divina do versículo anterior; “voz” é mais preciso do que o sentido mais amplo de “som”.
- source_word: ἡμεῖς
  choice: nós mesmos
  rationale: O pronome explícito é enfático no grego e ressalta o testemunho pessoal dos autores.
- source_word: ἠκούσαμεν
  choice: ouvimos
  rationale: O aoristo indica o acontecimento de ouvir a voz, não uma ação contínua de escutar.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Expressão idiomática natural que preserva a ideia de origem.
- source_word: ἐνεχθεῖσαν
  choice: trazida
  rationale: O particípio passivo de φέρω caracteriza a voz como vinda ou conduzida do céu, preservando a forma passiva do original.
- source_word: σὺν αὐτῷ ὄντες
  choice: quando estávamos com ele
  rationale: A construção participial tem valor temporal no contexto e é expressa naturalmente em português.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: no monte santo
  rationale: “No monte” é idiomático em português, e “santo” preserva a caracterização bíblica do lugar como consagrado.
theological_decisions:
- issue: Referência de “o monte santo”
  choice: Referência descritiva ao monte da transfiguração de Jesus, sem identificar um monte específico.
  alternative: Identificá-lo explicitamente como monte Tabor ou monte Hermom.
  rationale: O texto grego chama o lugar de “monte santo”, mas não lhe dá nome; a tradução evita importar uma identificação tradicional ou conjectural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem mantém em destaque o testemunho enfático “nós mesmos” e conserva a passiva “trazida” sem esclarecer além do texto quem a trouxe.
