id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: pt
  text: Por isso, estarei sempre pronto para lembrar vocês destas coisas, embora já as conheçam e estejam firmados na verdade presente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na verdade que vocês agora têm».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Por isso
  rationale: Marca de modo natural a conclusão extraída do argumento anterior.
- source_word: μελλήσω
  choice: estarei pronto
  rationale: Neste contexto, o futuro de μέλλω com infinitivo expressa disposição ou propósito continuado, não apenas iminência.
- source_word: ἀεὶ
  choice: sempre
  rationale: Preserva diretamente a ideia de ação constante ou repetida.
- source_word: ὑπομιμνῄσκειν
  choice: lembrar
  rationale: Expressa fazer alguém recordar; a continuidade já é indicada por «sempre».
- source_word: περὶ τούτων
  choice: destas coisas
  rationale: Forma portuguesa clara e idiomática para o assunto mencionado anteriormente.
- source_word: καίπερ
  choice: embora
  rationale: Mantém a relação concessiva com concisão e naturalidade.
- source_word: εἰδότας
  choice: já as conheçam
  rationale: O pronome retoma «estas coisas», e «já» torna natural em português o estado de conhecimento pressuposto, sem alterar o sentido.
- source_word: ἐστηριγμένους
  choice: estejam firmados
  rationale: Conserva a voz passiva e o estado duradouro resultante expresso pelo particípio perfeito.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: na verdade presente
  rationale: Segue de perto a expressão grega incomum e preserva sua ambiguidade, sem transformá-la em termo doutrinário técnico.
theological_decisions:
- issue: Sentido de «a verdade presente»
  choice: na verdade presente
  alternative: na verdade que vocês agora têm; na verdade presente entre vocês
  rationale: O grego pode indicar a verdade atualmente disponível aos leitores ou presente entre eles. A formulação principal preserva essa abertura e evita impor uma leitura dispensacional ou histórica específica.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para leitura amplamente natural no Brasil. A construção mantém a relação lógica, a concessão e a expressão deliberadamente incomum «verdade presente».
