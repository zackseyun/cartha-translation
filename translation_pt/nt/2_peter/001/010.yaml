id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: pt
  text: Por isso, irmãos[a], empenhem-se ainda mais em confirmar o chamado e a eleição de vocês, pois, fazendo essas coisas, vocês jamais tropeçarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”; o grego diz “irmãos” e pode dirigir-se de modo inclusivo a toda a comunidade de fiéis.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Marca a conclusão prática decorrente da exortação anterior e preserva com naturalidade a ligação lógica.
- source_word: μᾶλλον
  choice: ainda mais
  rationale: Intensifica o imperativo e reproduz de modo idiomático a força comparativa.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma masculina plural do grego; no uso epistolar, pode abranger toda a comunidade cristã, o que é esclarecido em nota.
- source_word: σπουδάσατε
  choice: empenhem-se
  rationale: Expressa esforço diligente e decidido em linguagem portuguesa atual.
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: confirmar
  rationale: Comunica tornar firme, comprovado ou seguro, sem sugerir necessariamente que o chamado e a eleição tenham origem no esforço humano.
- source_word: κλῆσιν
  choice: chamado
  rationale: Equivalente corrente para a convocação divina, preservando a continuidade lexical e teológica.
- source_word: ἐκλογὴν
  choice: eleição
  rationale: Termo preciso e consagrado para o ato de escolher, sem impor ao versículo um sistema denominacional específico.
- source_word: ταῦτα ... ποιοῦντες
  choice: fazendo essas coisas
  rationale: Mantém a construção participial e remete naturalmente às qualidades e práticas mencionadas no contexto anterior.
- source_word: οὐ μὴ ... ποτε
  choice: jamais
  rationale: Reproduz a forte negação enfática de maneira concisa e natural em português.
- source_word: πταίσητέ
  choice: tropeçarão
  rationale: Preserva a metáfora do tropeço e evita especificar indevidamente pecado absoluto ou apostasia final.
theological_decisions:
- issue: Sentido de confirmar o chamado e a eleição
  choice: Exortação para tornar firmes ou comprovados na vida o chamado e a eleição de Deus, mediante perseverança nas virtudes mencionadas.
  alternative: Entender que o esforço humano produz ou determina originalmente o chamado e a eleição de Deus.
  rationale: A combinação de βεβαίαν com ποιεῖσθαι permite a ideia de firmar ou confirmar. A tradução mantém a tensão do texto sem decidir entre sistemas teológicos posteriores.
- issue: Alcance de “jamais tropeçarão”
  choice: Manter a metáfora ampla de não tropeçar ao perseverar nessas práticas.
  alternative: Definir a expressão como promessa de impecabilidade absoluta ou, exclusivamente, como garantia contra a apostasia final.
  rationale: πταίω designa tropeçar ou falhar; o contexto exortativo não exige que a tradução resolva a imagem em uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Empenhem-se” evita rigidez excessiva; “confirmar” é mais natural do que “tornar seguro” e conserva a ideia de firmar ou comprovar. A colocação pronominal e o uso de “vocês” favorecem clareza internacional com naturalidade no Brasil.
