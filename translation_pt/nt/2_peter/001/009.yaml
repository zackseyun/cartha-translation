  - severity: low
    issue: “Cego e enxerga apenas o que está perto” coordena uma oração finita com o predicativo, em vez de refletir a função participial de μυωπάζων.
    rationale: Não altera substancialmente o sentido, mas “cego, vendo apenas o que está perto” preserva melhor a qualificação participial e a tensão retórica do original.
  revised_text: Pois quem não tem essas coisas é cego, vendo apenas o que está perto,[a] tendo se esquecido da purificação de seus pecados de outrora.
