source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: pt
  text: Pois quem não tem essas coisas é cego, vendo apenas o que está perto,[a] tendo se esquecido da purificação de seus pecados de outrora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sendo míope”, “de vista curta” ou “vendo apenas o que está perto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: Pois quem não tem essas coisas
  rationale: A construção indica genericamente a pessoa em quem não estão presentes as virtudes mencionadas anteriormente. “Não tem” é natural e mantém “essas coisas” sem explicitar no texto principal “qualidades”.
- source_word: τυφλός
  choice: cego
  rationale: Preserva diretamente a metáfora do predicativo grego.
- source_word: μυωπάζων
  choice: enxerga apenas o que está perto
  rationale: Expressa o sentido verbal raro do particípio e conserva a imagem de visão limitada; evita o possível sentido médico excessivamente estreito de “míope”.
- source_word: λήθην λαβὼν
  choice: tendo se esquecido
  rationale: Tradução idiomática da expressão literalmente associada a ‘receber/tomar esquecimento’, preservando a anterioridade do particípio.
- source_word: καθαρισμοῦ
  choice: purificação
  rationale: Termo claro e digno para a remoção de impureza moral ou espiritual, sem explicar além do texto.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: de seus pecados de outrora
  rationale: Mantém a referência singular genérica de αὐτοῦ e o valor temporal de πάλαι, isto é, pecados pertencentes ao passado.
theological_decisions:
- issue: Relação entre ‘cego’ e μυωπάζων
  choice: cego e enxerga apenas o que está perto
  alternative: cego, sendo míope
  rationale: 'O grego reúne imagens que podem parecer tensas: cegueira e visão curta. A tradução mantém ambas, sem harmonizá-las ou eliminar uma delas.'
- issue: Referência singular genérica de αὐτοῦ
  choice: seus pecados
  alternative: os pecados dessas pessoas
  rationale: “Seus” pode retomar naturalmente o singular genérico “quem” em português, sem restringir a referência ao sexo masculino nem pluralizar a construção.
translation_notes:
  register: Português moderno, corrente e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluidez, preservando o nexo causal introduzido por γάρ e a tensão metafórica entre cegueira e visão limitada.
