source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: pt
  text: 'Pois, quando ele recebeu de Deus Pai honra e glória, uma voz como esta lhe foi dirigida pela Glória Majestosa: “Este é o meu Filho, o meu Amado[a], em quem me agrado[b]” —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o meu Filho amado”. O grego diz mais literalmente: “Este é o meu Filho, o meu Amado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de quem me agrado” ou “em quem tive prazer”. O grego emprega literalmente εἰς (“para/dentro de”) com o verbo “agradar-se” e ecoa as declarações dos Evangelhos no batismo e na transfiguração de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: Pois ele recebeu de Deus Pai
  rationale: O particípio aoristo é integrado à oração temporal seguinte de modo natural em português; παρά com genitivo indica a fonte, preservada por “de Deus Pai”.
- source_word: τιμὴν καὶ δόξαν
  choice: honra e glória
  rationale: Mantém distintos os dois substantivos e corresponde ao uso bíblico corrente em português.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: lhe foi dirigida uma voz
  rationale: Preserva a construção passiva e o destinatário expresso por αὐτῷ, evitando o pouco natural “uma voz lhe foi levada”.
- source_word: τοιᾶσδε
  choice: como esta
  rationale: Aponta naturalmente para as palavras citadas a seguir.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: da Glória Majestosa
  rationale: “Da” exprime com naturalidade a procedência da voz; a capitalização preserva o provável uso reverencial da expressão como referência à presença divina.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Este é o meu Filho, o meu Amado
  rationale: Conserva a estrutura apositiva e a repetição de μου, sem reduzi-la à formulação tradicional “meu Filho amado”.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: em quem me agrado
  rationale: Mantém a imagem preposicional de εἰς e comunica em português corrente o sentido idiomático de aprovação e deleite; o presente exprime adequadamente a declaração vigente.
theological_decisions:
- issue: A expressão reverencial τῆς μεγαλοπρεποῦς δόξης
  choice: a Glória Majestosa
  alternative: a glória magnífica; a majestade divina
  rationale: A formulação mantém a provável circunlocução referente a Deus sem substituir a expressão por uma identificação interpretativa explícita.
- issue: A declaração do Pai acerca do Filho
  choice: Este é o meu Filho, o meu Amado, em quem me agrado
  alternative: Este é o meu Filho amado, de quem me agrado
  rationale: A opção preserva a aposição enfática do grego e sua tensão lexical, sem acrescentar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para clareza, mas a passiva referente à voz, a aposição “o meu Amado” e a circunlocução divina foram preservadas. O travessão final mantém a continuidade sintática com o versículo seguinte.
