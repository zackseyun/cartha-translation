revisions:
- from: 'Pois ele recebeu de Deus Pai honra e glória, quando da Glória Majestosa lhe foi dirigida uma voz como esta: “Este é o meu Filho, o meu Amado[a], em quem me agrado[b]” —'
  to: 'Pois, quando ele recebeu de Deus Pai honra e glória, uma voz como esta lhe foi dirigida pela Glória Majestosa: “Este é o meu Filho, o meu Amado[a], em quem me agrado[b]” —'
  rationale: A revisão ajusta a sintaxe para refletir mais de perto a relação entre o particípio «ao receber» e a voz que lhe foi dirigida, e torna a nota lexical mais precisa e idiomática. «Pela Glória Majestosa» reproduz diretamente o valor agentivo de ὑπό, sem eliminar a possível função reverencial da expressão. O travessão final é mantido, pois a construção continua no versículo seguinte.
