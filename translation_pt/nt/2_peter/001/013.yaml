source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: pt
  text: Mas considero correto, enquanto estou nesta tenda[a], despertá-los por meio de uma lembrança,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morada” ou “corpo”. O grego diz “tenda”, uma metáfora para a vida mortal atual de Pedro em seu corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: justo
  rationale: Com ἡγοῦμαι, indica aquilo que se julga correto ou apropriado. “Justo” é natural em português e conserva a dimensão moral do termo.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste leve ou avanço em relação ao versículo anterior; “Mas” expressa bem essa transição.
- source_word: ἡγοῦμαι
  choice: considero
  rationale: Comunica uma avaliação refletida, não uma impressão passageira.
- source_word: ἐφ’ ὅσον
  choice: enquanto
  rationale: Na construção temporal com εἰμί, significa “durante o tempo em que”; “enquanto” é claro e idiomático.
- source_word: σκηνώματι
  choice: tenda
  rationale: Preserva a metáfora grega da habitação provisória e prepara a imagem do versículo seguinte, sem substituí-la interpretativamente por “corpo”.
- source_word: διεγείρειν
  choice: despertar
  rationale: O verbo significa acordar ou estimular. “Despertar vocês” mantém a imagem verbal e comunica o propósito de incitar atenção espiritual.
- source_word: ἐν ὑπομνήσει
  choice: por meio de uma lembrança
  rationale: 'A expressão indica meio ou maneira: Pedro procura despertá-los ao fazê-los lembrar do que já sabem.'
theological_decisions:
- issue: Referência metafórica de “esta tenda”
  choice: Manter “esta tenda” no texto principal
  alternative: Interpretar como “este corpo” ou suavizar como “esta morada”
  rationale: O grego apresenta diretamente a metáfora da tenda para a vida mortal no corpo. Preservá-la mantém sua força e sua ligação com o versículo seguinte, sem resolver a imagem por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens essenciais do grego foram preservadas, evitando tanto arcaísmos como “tabernáculo” quanto explicitação interpretativa no texto principal.
