source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: pt
  text: Por meio das quais ele nos concedeu as preciosas e muito grandes promessas, para que, por meio delas, vocês se tornem participantes da natureza divina[a], tendo escapado da corrupção que há no mundo por causa do desejo pecaminoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “partícipes da natureza divina”. A expressão fala de participação na natureza divina, sem afirmar que os seres humanos se tornam divinos em essência.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa do desejo” ou “pela cobiça”. O termo grego pode significar “desejo” em sentido geral, mas neste contexto tem sentido moral negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Por meio das quais
  rationale: διά com o genitivo indica meio ou mediação. A formulação mantém a ligação relativa com as realidades mencionadas no versículo anterior sem definir o antecedente além do que o texto permite.
- source_word: τίμια καὶ μέγιστα
  choice: preciosas e grandiosas
  rationale: “Preciosas” expressa o valor indicado por τίμια; “grandiosas” comunica de modo natural e enfático a força superlativa de μέγιστα em português atual.
- source_word: ἡμῖν ... δεδώρηται
  choice: ele nos concedeu
  rationale: O pronome oblíquo expressa naturalmente o dativo ἡμῖν. “Concedeu” preserva a ideia de dádiva generosa, e o perfeito grego apresenta essa concessão como realizada e ainda eficaz. O sujeito implícito é recuperado do contexto.
- source_word: ἐπαγγέλματα
  choice: promessas
  rationale: É o equivalente claro e corrente para os compromissos divinos designados pelo substantivo grego.
- source_word: ἵνα διὰ τούτων
  choice: para que, por meio delas
  rationale: “Para que” preserva a força de propósito ou resultado de ἵνα; “por meio delas” mantém o valor instrumental de διά e retoma naturalmente as promessas.
- source_word: γένησθε
  choice: vocês se tornem
  rationale: A forma de γίνομαι indica vir a ser, e não apenas permanecer em determinado estado. “Vocês” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: θείας κοινωνοὶ φύσεως
  choice: participantes da natureza divina
  rationale: κοινωνοί designa pessoas que compartilham ou participam de algo. A tradução conserva integralmente a linguagem forte e teologicamente densa do grego sem explicá-la dentro do texto.
- source_word: ἀποφυγόντες
  choice: tendo escapado
  rationale: A construção participial preserva a relação entre o escape já efetuado e o tornar-se participante, sem impor uma relação temporal mais precisa do que a forma grega exige.
- source_word: τῆς ἐν τῷ κόσμῳ ... φθορᾶς
  choice: da corrupção que há no mundo
  rationale: “Corrupção” expressa aqui a ruína moral e espiritual, enquanto a oração relativa deixa claro que “no mundo” modifica “corrupção”.
- source_word: ἐν ἐπιθυμίᾳ
  choice: por causa do desejo pecaminoso
  rationale: ἐν pode descrever aqui a esfera ou o fator associado à corrupção. Embora ἐπιθυμία possa significar desejo em sentido geral, o contexto lhe confere valor moral negativo; “pecaminoso” torna essa força contextual explícita sem limitar o termo ao desejo sexual.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως e a participação na natureza divina
  choice: participantes da natureza divina
  alternative: coparticipantes da natureza divina
  rationale: A formulação preserva a afirmação forte de participação sem a reduzir a mera recepção de benefícios e sem introduzir a ideia de que seres humanos se tornam divinos em essência.
- issue: Força moral de ἐπιθυμία
  choice: desejo pecaminoso
  alternative: desejo; cobiça
  rationale: O substantivo não é inerentemente negativo em todos os contextos, mas aqui está ligado à corrupção do mundo. A tradução explicita essa força contextual e evita que “cobiça” seja entendida apenas como ganância material.
- issue: Relação circunstancial de ἀποφυγόντες
  choice: tendo escapado
  alternative: depois de escaparem; ao escaparem
  rationale: O particípio pode ser entendido como ação antecedente ou circunstância associada. A tradução mantém essa abertura e não transforma a frase em uma sequência doutrinária rígida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” foi preferido por naturalidade ampla. A sintaxe conserva as duas expressões instrumentais e a construção participial do grego, evitando tanto arcaísmo quanto explicações doutrinárias inseridas no corpo do versículo.
