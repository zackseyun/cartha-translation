id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: pt
  text: Pois, se essas coisas estão presentes em vocês e aumentam[a], elas não deixam que vocês sejam inativos nem infrutíferos no conhecimento[b] de nosso Senhor Jesus, o Messias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são abundantes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pleno conhecimento”.'
    reason: lexical_alternative
  - marker: c
    text: Em grego, “Jesus Cristo”; aqui, “Jesus, o Messias”, para preservar o sentido do título.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Retoma de modo direto as virtudes enumeradas nos versículos 5–7, sem substituir o demonstrativo pela interpretação mais explícita “essas qualidades”.
- source_word: ὑμῖν ὑπάρχοντα
  choice: estão presentes em vocês
  rationale: A combinação do dativo com ὑπάρχω indica que essas coisas existem entre os leitores, pertencem a eles ou estão neles. A formulação escolhida preserva a ideia de presença sem reduzi-la apenas à posse.
- source_word: πλεονάζοντα
  choice: aumentam
  rationale: Expressa crescimento contínuo no contexto do desenvolvimento das virtudes; a nota registra a possível nuance de abundância.
- source_word: ἀργούς
  choice: inativos
  rationale: Preserva o sentido básico de ausência de atividade ou produtividade e faz par natural com “infrutíferos”, sem restringir o termo à preguiça moral.
- source_word: ἀκάρπους
  choice: infrutíferos
  rationale: Mantém a metáfora bíblica de não produzir fruto.
- source_word: καθίστησιν
  choice: não deixam que vocês sejam
  rationale: 'Reproduz em português corrente o valor resultativo do verbo combinado com οὐκ... οὐδέ: a presença e o crescimento dessas virtudes impedem o resultado negativo.'
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: no conhecimento
  rationale: Expressa de forma natural a esfera ou relação em que os leitores não serão inativos nem infrutíferos.
- source_word: ἐπίγνωσιν
  choice: conhecimento
  rationale: É a tradução portuguesa mais natural; a possível nuance intensiva de conhecimento pleno é mantida em nota.
- source_word: κυρίου
  choice: Senhor
  rationale: Conserva o título cristológico estabelecido e corrente para κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como título e usa o artigo exigido pelo português idiomático para explicitar seu sentido, em vez de tratá-lo apenas como parte de um nome próprio.
theological_decisions:
- issue: Força circunstancial dos particípios ὑπάρχοντα e πλεονάζοντα
  choice: se essas coisas estão presentes em vocês e aumentam
  alternative: essas coisas, estando presentes em vocês e aumentando
  rationale: Embora não haja uma conjunção condicional explícita no grego, os particípios podem ter força circunstancial condicional. “Se” comunica com clareza essa relação provável, sem transformar a presença das virtudes numa afirmação automática sobre todos os leitores.
- issue: Tradução de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: A escolha preserva o conteúdo titular de Χριστός (“Ungido/Messias”) em português natural, sem acrescentar uma distinção cristológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Vocês” evita regionalismos marcados; “inativos nem infrutíferos” mantém tanto a oposição prática quanto a metáfora do original.
