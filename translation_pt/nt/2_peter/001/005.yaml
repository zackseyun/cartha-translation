  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: pt
  text: Por isso mesmo, com todo o empenho, acrescentem à sua fé[a][d] a virtude[b] e, à virtude, o conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fidelidade» ou «confiança», para «fé» (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Ou «excelência moral», para «virtude» (ἀρετή).
    reason: lexical_alternative
  - marker: d
    text: Mais de perto da estrutura grega, «forneçam na sua fé a virtude»; a construção também pode indicar que uma qualidade é acrescentada à outra.
    reason: source_structure
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Por isso mesmo
  rationale: Expressa de modo natural a transição enfática e sua ligação causal com o que foi dito anteriormente.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: com todo o empenho
  rationale: Conserva a ideia de dedicação plena ligada à ordem principal, evitando uma construção participial pouco natural em português.
- source_word: ἐπιχορηγήσατε
  choice: acrescentem
  rationale: No encadeamento de qualidades, comunica com clareza que cada uma deve acompanhar a anterior. A nuance de prover ou fornecer generosamente é registrada em nota.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: à fé que vocês têm
  rationale: Torna idiomática em português a relação expressa por ἐν com dativo, sem ocultar em nota a formulação mais literal, «em sua fé».
- source_word: πίστει
  choice: fé
  rationale: Mantém o sentido lexical mais direto neste contexto; «fidelidade» e «confiança» permanecem alternativas possíveis.
- source_word: ἀρετήν
  choice: virtude
  rationale: Termo conciso e compreensível para excelência de caráter, sem acrescentar uma interpretação mais específica do que o grego exige.
- source_word: γνῶσιν
  choice: conhecimento
  rationale: Preserva o núcleo semântico de γνῶσις e se ajusta à progressão das qualidades.
theological_decisions:
- issue: Sentido de πίστις numa lista de qualidades
  choice: fé
  alternative: fidelidade ou confiança
  rationale: «Fé» é a leitura mais direta, mas o campo semântico de πίστις permite as alternativas indicadas; a nota preserva essa amplitude sem decidir além do contexto.
- issue: Relação entre as qualidades marcada por ἐν
  choice: acrescentar uma qualidade à anterior
  alternative: fornecer a qualidade na anterior
  rationale: A tradução principal apresenta naturalmente a progressão da lista em português, enquanto a nota conserva a construção grega e sua possível nuance de uma qualidade operando no âmbito da outra.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural sobretudo no uso brasileiro. «Vocês» explicita o plural de ὑμῶν e do imperativo. A pontuação destaca o encadeamento retórico entre fé, virtude e conhecimento.
