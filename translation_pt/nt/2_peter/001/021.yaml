id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: pt
  text: Pois jamais uma profecia teve origem na vontade humana[a]; pelo contrário, seres humanos falaram da parte de Deus enquanto eram conduzidos pelo Espírito Santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “foi trazida” ou “foi produzida”. O verbo grego está na voz passiva e é o mesmo usado, em forma participial, na expressão traduzida como “eram conduzidos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto eram impelidos pelo Espírito Santo”. A expressão grega retrata a ação orientadora do Espírito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: na vontade humana
  rationale: Expressa naturalmente em português o meio ou a esfera de origem negada pelo dativo grego, sem sugerir que a profecia resultasse da iniciativa humana.
- source_word: ἠνέχθη
  choice: teve origem
  rationale: Comunica no contexto a ideia de surgimento ou procedência da profecia. A nota registra a forma passiva mais literal e sua ligação verbal com φερόμενοι.
- source_word: προφητεία
  choice: profecia
  rationale: É o equivalente corrente e suficientemente amplo para a revelação ou declaração profética em vista.
- source_word: οὐ ... ποτέ
  choice: jamais
  rationale: Reproduz com naturalidade e ênfase a negação temporal absoluta.
- source_word: ἀπὸ θεοῦ
  choice: da parte de Deus
  rationale: Preserva a noção de fonte ou procedência marcada por ἀπό e a distingue da agência do Espírito indicada por ὑπό.
- source_word: ἄνθρωποι
  choice: seres humanos
  rationale: Representa o plural ἄνθρωποι em sentido humano e genérico, mantendo o contraste entre os falantes humanos e Deus sem introduzir exclusão de gênero.
- source_word: ἐλάλησαν
  choice: falaram
  rationale: Tradução direta e natural de λαλέω, sem elevar desnecessariamente o registro.
- source_word: ὑπὸ πνεύματος ἁγίου φερόμενοι
  choice: enquanto eram conduzidos pelo Espírito Santo
  rationale: Mantém a agência expressa por ὑπό e apresenta a ação contínua do particípio como orientação ativa do Espírito, sem reduzi-la a mera influência abstrata.
theological_decisions:
- issue: Relação entre a ação divina e a ação humana na profecia
  choice: A profecia não se origina na vontade humana; seres humanos realmente falaram da parte de Deus enquanto o Espírito Santo os conduzia.
  alternative: Entender o texto como ditado mecânico ou, no extremo oposto, como iniciativa humana apenas auxiliada por influência divina.
  rationale: O grego mantém juntas a fala humana real, a procedência divina e a ação orientadora decisiva do Espírito. A tradução conserva essa tensão sem especificar um mecanismo de inspiração.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Teve origem” evita a estranheza de “foi trazida” no corpo do texto, enquanto a nota preserva a imagem e a correspondência verbal do grego. “Seres humanos” mantém o valor representativo de ἄνθρωποι sem a possível leitura masculina exclusiva de “homens” no português contemporâneo.
