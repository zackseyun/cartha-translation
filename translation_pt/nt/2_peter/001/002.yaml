  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: pt
  text: Que a graça e a paz lhes sejam multiplicadas no conhecimento de Deus e de Jesus, nosso Senhor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio do conhecimento de Deus e de Jesus, nosso Senhor». A preposição grega pode indicar esfera («no») ou meio («por meio de»).'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «pleno conhecimento». O termo grego ἐπίγνωσις pode transmitir a ideia de um conhecimento mais pleno ou completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Preserva tanto a fórmula de saudação epistolar quanto o sentido teológico do favor divino.
- source_word: εἰρήνη
  choice: paz
  rationale: É a tradução convencional e teologicamente rica, preservando também a provável ressonância semítica de bem-estar integral.
- source_word: πληθυνθείη
  choice: sejam multiplicadas
  rationale: O optativo passivo aoristo expressa um desejo ou uma bênção; a formulação mantém o sentido passivo e concorda naturalmente com «a graça e a paz».
- source_word: ἐν
  choice: 'no'
  rationale: Representa diretamente a preposição grega e mantém aberta a possibilidade de indicar esfera, sem excluir completamente uma nuance instrumental.
- source_word: ἐπιγνώσει
  choice: conhecimento
  rationale: É a tradução portuguesa mais natural no contexto; o possível sentido intensificado de conhecimento pleno é registrado em nota.
- source_word: θεοῦ
  choice: Deus
  rationale: Genitivo que identifica o objeto do conhecimento.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: κυρίου
  choice: Senhor
  rationale: Preserva o peso cristológico do título e o uso convencional no Novo Testamento.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: de Deus e de Jesus, nosso Senhor
  rationale: A repetição portuguesa de «de» esclarece que Deus e Jesus são ambos objetos de «conhecimento»; a vírgula apresenta «nosso Senhor» como título de Jesus.
theological_decisions:
- issue: Nuance de ἐπίγνωσις em contexto espiritualmente significativo
  choice: conhecimento
  alternative: pleno conhecimento
  rationale: A tradução simples evita impor ao termo um sentido técnico ou intensificado, enquanto a nota preserva essa possibilidade lexical.
- issue: Força de ἐν com ἐπιγνώσει
  choice: no conhecimento de Deus e de Jesus, nosso Senhor
  alternative: por meio do conhecimento de Deus e de Jesus, nosso Senhor
  rationale: O grego permite compreender a preposição como esfera ou como meio. O texto principal conserva a formulação mais direta, e a nota registra a leitura instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «Que... sejam multiplicadas» reproduz naturalmente a fórmula de desejo ou bênção; «lhes» evita regionalizar o texto com «vos» e mantém o plural do grego.
