id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a slave and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: pt
  text: 'Simeão Pedro, escravo e apóstolo de Jesus, o Messias, aos que receberam uma fé de igual valor à nossa, na justiça do nosso Deus e Salvador, Jesus, o Messias[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego indica mais naturalmente um único referente: Jesus é chamado “nosso Deus e Salvador”. Uma leitura menos provável entende a expressão como referência a duas pessoas: “nosso Deus” e “o Salvador Jesus, o Messias”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simeão Pedro
  rationale: “Simeão” reflete diretamente a forma Συμεών do texto-fonte, enquanto “Pedro” é a forma portuguesa consagrada de Πέτρος.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a ideia de pertencimento pleno e submissão implicada por δοῦλος, mais forte que “servo”, especialmente na autodesignação apostólica.
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Termo português estabelecido para o ofício de alguém comissionado e enviado.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός como o título “Messias”, mantendo-o semanticamente perceptível em português natural.
- source_word: τοῖς ... λαχοῦσιν
  choice: aos que receberam
  rationale: Comunica que a fé lhes coube ou foi concedida, sem sugerir que a conquistaram nem impor literalmente a imagem de sorteio.
- source_word: ἰσότιμον ... πίστιν
  choice: uma fé de igual valor à nossa
  rationale: ἰσότιμος expressa igualdade de valor, honra ou privilégio; a formulação preserva essa paridade sem reduzir o sentido apenas a preciosidade subjetiva.
- source_word: πίστιν
  choice: fé
  rationale: Neste contexto, refere-se à fé compartilhada pelos destinatários e pelos apóstolos; “fé” é a tradução natural e estabelecida.
- source_word: ἐν δικαιοσύνῃ
  choice: na justiça
  rationale: Mantém aberta a possível nuance de esfera ou meio da preposição ἐν, sem decidir indevidamente entre “na” e “por meio da”.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Em português corrente, “justiça” comunica de modo natural δικαιοσύνη e evita o termo menos acessível “retidão”, embora este também seja possível conforme a nuance.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: do nosso Deus e Salvador, Jesus, o Messias
  rationale: 'O único artigo que rege os dois substantivos pessoais unidos por καί favorece fortemente um só referente: Jesus é chamado Deus e Salvador.'
theological_decisions:
- issue: Se “nosso Deus e Salvador, Jesus, o Messias” designa uma pessoa ou duas
  choice: 'Uma pessoa: Jesus é chamado “nosso Deus e Salvador”.'
  alternative: 'Duas pessoas: “nosso Deus” e “o Salvador Jesus, o Messias”.'
  rationale: A construção grega tem um só artigo para dois substantivos pessoais singulares ligados por καί, o que favorece fortemente um único referente. A alternativa, embora gramaticalmente menos provável, é registrada por sua relevância teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Escravo” preserva a força de δοῦλος; “Simeão” segue a forma específica do texto grego; “de igual valor” mantém a amplitude de ἰσότιμος. A pontuação em “Jesus, o Messias” apresenta “o Messias” como título em aposição.
