id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: pt
  text: E temos a palavra profética mais segura[a], à qual vocês fazem bem em prestar atenção, como a uma lâmpada que brilha em lugar escuro, até que o dia amanheça e a estrela da manhã[b] surja nos corações de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E temos a palavra profética mais confirmada”. O grego pode ser entendido tanto como indicando que a palavra profética é confirmada pelo testemunho apostólico quanto como destacando seu caráter mais seguro.'
    reason: alternative_reading
  - marker: b
    text: “Estrela da manhã” pode evocar uma imagem messiânica; compare Apocalipse 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: mais confirmada
  rationale: Mantém a força comparativa do adjetivo e admite, sem impor, que o testemunho apostólico precedente confirma a palavra profética. A alternativa «mais segura» também é possível.
- source_word: τὸν προφητικὸν λόγον
  choice: a palavra profética
  rationale: Reproduz de modo natural e relativamente formal tanto o substantivo λόγος como o adjetivo προφητικός.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: à qual vocês fazem bem em prestar atenção
  rationale: Expressa o sentido de atenção cuidadosa e preserva a avaliação positiva de καλῶς ποιεῖτε em português corrente.
- source_word: λύχνῳ φαίνοντι
  choice: uma lâmpada que brilha
  rationale: Conserva a comparação e o caráter contínuo da imagem participial em formulação natural.
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: em lugar escuro
  rationale: «Escuro» se ajusta à imagem da lâmpada e comunica com clareza o sentido de um lugar sombrio ou lúgubre.
- source_word: ἡμέρα διαυγάσῃ
  choice: o dia amanheça
  rationale: Equivalente idiomático que preserva a metáfora do surgimento da luz.
- source_word: φωσφόρος
  choice: a estrela da manhã
  rationale: Designa naturalmente o astro matutino neste contexto e mantém aberta sua possível ressonância messiânica.
- source_word: ἀνατείλῃ
  choice: surja
  rationale: Verbo natural para o aparecimento de um astro, sem exigir uma localização astronômica literal diante da expressão «no coração».
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: no coração de vocês
  rationale: Forma idiomática em português; o singular coletivo evita sugerir que «coração» se limita às emoções.
theological_decisions:
- issue: Relação de βεβαιότερον com o testemunho apostólico e a palavra profética
  choice: «a palavra profética mais confirmada»
  alternative: «a palavra profética mais segura» ou «temos como mais segura a palavra profética»
  rationale: O comparativo grego permite entender que a experiência apostólica confirma a palavra profética ou que se destaca o caráter seguro dessa palavra. O texto principal conserva a leitura de confirmação, e a nota registra a ambiguidade.
- issue: Referente de φωσφόρος
  choice: Manter a imagem como «a estrela da manhã», sem identificação explícita
  alternative: Explicitar uma referência ao Messias/Cristo ou à iluminação escatológica
  rationale: A imagem pode ter ressonância messiânica, mas o versículo não identifica expressamente seu referente. A tradução preserva a tensão e remete apenas a uma comparação bíblica na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural de segunda pessoa e evita linguagem excessivamente arcaica. Os marcadores foram colocados junto às expressões a que suas notas se referem.
