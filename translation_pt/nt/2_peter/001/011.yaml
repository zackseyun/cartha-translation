id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: pt
  text: Pois, desse modo, a entrada[a] no reino eterno de nosso Senhor e Salvador Jesus, o Messias,[b] lhes será concedida abundantemente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o ingresso». O grego εἴσοδος pode indicar tanto a entrada quanto o ato de ingressar.
    reason: lexical_alternative
  - marker: b
    text: 'Tradução tradicional: «Jesus Cristo». Aqui, o título grego Χριστός é traduzido por seu sentido: «Messias».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: desse modo
  rationale: Retoma a maneira de viver descrita no contexto anterior e preserva a força demonstrativa do termo grego em português natural.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a ligação explicativa com a afirmação precedente.
- source_word: πλουσίως
  choice: abundantemente
  rationale: Expressa a ideia de provisão ampla e generosa sem transformar o advérbio em adjetivo de «entrada».
- source_word: ἐπιχορηγηθήσεται
  choice: será concedida
  rationale: Preserva o futuro passivo e comunica com naturalidade a ideia de algo provido ou outorgado.
- source_word: ὑμῖν
  choice: lhes
  rationale: Representa o dativo de vantagem e concorda com o tratamento plural de leitura ampla no português internacional.
- source_word: ἡ εἴσοδος
  choice: a entrada
  rationale: Pode designar tanto o ato de entrar quanto o acesso; «entrada» é claro e direto neste contexto.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: no reino eterno
  rationale: Em português, «entrada no reino» traduz de modo idiomático o movimento expresso por εἰς, enquanto «eterno» preserva o valor escatológico de αἰώνιος.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: de nosso Senhor e Salvador
  rationale: Reproduz os dois títulos, cuja construção grega aponta para um único referente.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  rationale: Traduz Χριστός pelo sentido do título, «Messias», e usa a forma portuguesa idiomática com artigo e aposição.
theological_decisions:
- issue: Referência de «nosso Senhor e Salvador»
  choice: Os dois títulos se referem à mesma pessoa, Jesus, o Messias.
  alternative: Ler os títulos como referências distintas ou mais frouxamente relacionadas.
  rationale: Um único artigo rege dois substantivos pessoais singulares ligados por καί, seguidos pelo nome Ἰησοῦ Χριστοῦ; a sintaxe grega favorece fortemente um só referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração conserva o sujeito grego («a entrada») e o futuro passivo, sem produzir uma construção excessivamente rígida. «Lhes» evita regionalizar o plural como «vos» e mantém concisão.
