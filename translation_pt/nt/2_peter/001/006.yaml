  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: pt
  text: e ao conhecimento, o domínio próprio; e ao domínio próprio, a perseverança[a]; e à perseverança, a devoção a Deus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “constância”, “resistência” ou “perseverança paciente”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega uma construção elíptica que continua a cadeia de virtudes do versículo anterior: a cada qualidade, acrescenta-se a seguinte.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: conhecimento
  rationale: É o equivalente direto e natural de γνῶσις neste catálogo de virtudes, mantendo a ligação com o versículo anterior.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: domínio próprio
  rationale: Expressa o controle sobre desejos e impulsos em linguagem atual e digna; evita o sentido mais restrito que “temperança” pode ter.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: perseverança
  rationale: Comunica constância sob dificuldade e não reduz o termo à espera passiva; é corrente no português moderno.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Torna claro o sentido de reverência e dedicação religiosa vividas diante de Deus, evitando a possível leitura de “piedade” apenas como compaixão.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: e ao ..., o ...
  rationale: Preserva a construção elíptica e encadeada do grego, cuja ideia verbal vem do versículo anterior, sem inserir uma paráfrase completa.
- source_word: δέ
  choice: e
  rationale: Neste contexto, liga cumulativamente os elementos da sequência, sem contraste forte.
theological_decisions:
- issue: Construção elíptica da cadeia de virtudes
  choice: Manter a forma condensada “ao conhecimento, o domínio próprio...”
  alternative: Expandir como “acrescentem ao conhecimento o domínio próprio...”
  rationale: O verbo é recuperado do versículo anterior. A forma condensada conserva a estrutura e a tensão sintática do original sem acrescentar explicação ao texto principal.
- issue: Sentido de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A escolha explicita a orientação reverente para Deus inerente ao termo neste contexto, sem introduzir uma virtude denominacional específica; “piedade” no uso comum pode ser entendida como dó ou compaixão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo e a concisão do grego foram mantidos; “domínio próprio”, “perseverança” e “devoção a Deus” são claros para leitores comuns sem perder o tom digno.
