id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: pt
  text: 'Pois eles deliberadamente ignoram isto: que, há muito tempo, existiam os céus, e a terra foi formada da água e por meio da água pela palavra de Deus[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela ordem de Deus”. Mais literalmente, “pela palavra de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Pois eles deliberadamente ignoram isto
  rationale: A expressão reúne desconhecimento ou falta de percepção com disposição voluntária. “Deliberadamente ignoram” comunica em português natural que não se trata de mero descuido involuntário.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: há muito tempo, existiam os céus
  rationale: Preserva o plural de οὐρανοί e o sentido temporal de ἔκπαλαι em linguagem moderna.
- source_word: γῆ
  choice: a terra
  rationale: Embora o grego não tenha artigo, o português exige aqui uma formulação natural; “a terra” identifica o mundo criado sem atribuir ao artigo uma força ausente no original.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: da água e por meio da água
  rationale: Distingue ἐκ, origem ou procedência, de διά, meio ou agência, conservando o paralelismo.
- source_word: συνεστῶσα
  choice: foi formada
  rationale: No contexto da criação, exprime de modo claro a constituição ou formação da terra, sem optar pelas leituras mais específicas “consistia” ou “era sustentada”.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: pela palavra de Deus
  rationale: Representa o dativo instrumental e mantém λόγος como “palavra”, sem reduzi-lo necessariamente a “ordem” nem transformá-lo explicitamente em título pessoal.
theological_decisions:
- issue: Se λόγῳ deve ser traduzido de modo a indicar explicitamente o Logos pessoal
  choice: pela palavra de Deus
  alternative: pela ordem de Deus
  rationale: Neste contexto, a expressão aponta para a palavra eficaz de Deus na criação, mas o versículo não identifica explicitamente λόγος como título cristológico. A formulação conserva essa abertura.
- issue: Sentido cosmológico de ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: da água e por meio da água
  alternative: da água e pela água
  rationale: A tradução mantém as duas relações preposicionais sem impor uma reconstrução cosmológica mais precisa do que o texto oferece.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem da frase foi ajustada à sintaxe portuguesa, preservando o plural “os céus”, a distinção entre origem e meio nas duas expressões com “água” e a ambiguidade teológica de λόγος.
