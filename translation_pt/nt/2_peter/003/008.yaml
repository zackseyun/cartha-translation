reference: 2 Peter 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: pt
  text: 'Mas não deixem que esta única coisa lhes passe despercebida, amados: para o Senhor, um dia é como mil anos,[a][b] e mil anos, como um dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Comparar com Salmo 90:4.
    reason: cross_reference
  - marker: b
    text: O termo «como» indica uma comparação, não uma equivalência literal entre um dia e mil anos.
    reason: cultural_note
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Mas ... isto
  rationale: O demonstrativo τοῦτο aponta para o fato específico que será declarado. Em português, a construção natural com «isto» mantém o foco, enquanto «uma coisa» seria possível, mas mais pesada neste contexto. δέ é representado por «Mas», marcando a transição contrastiva.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: não deixem que isto lhes passe despercebido
  rationale: λανθάνω expressa aquilo que escapa à percepção ou permanece ignorado. A formulação conserva a força imperativa e a relação com ὑμᾶς, em português atual e natural.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Mantém o tom afetuoso e comunitário do vocativo sem torná-lo informal.
- source_word: παρὰ κυρίῳ
  choice: para o Senhor
  rationale: παρά com dativo pode indicar perspectiva ou avaliação. «Para o Senhor» comunica de modo natural como o tempo se apresenta em relação a ele, sem restringir o sentido a mera localização.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: um dia é como mil anos
  rationale: ὡς introduz comparação, não identidade. «É como» explicita a analogia em português moderno.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: e mil anos, como um dia
  rationale: A elipse do verbo na segunda oração preserva o paralelismo conciso do grego; a vírgula ajuda a leitura em português.
- source_word: χίλια ἔτη
  choice: mil anos
  rationale: É a expressão cardinal direta e idiomática em português; o artigo indefinido é desnecessário antes de «mil».
theological_decisions:
- issue: Natureza da comparação temporal
  choice: Traduzir a declaração como uma analogia sobre a relação do Senhor com o tempo.
  alternative: Entender um dia como literalmente equivalente a mil anos ou como fórmula de cálculo profético.
  rationale: A repetição de ὡς («como») marca uma comparação, não uma equação matemática. A tradução preserva a linguagem analógica sem introduzir um esquema cronológico doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em «lhes passe despercebido» é natural no registro escrito contemporâneo. «Amados» preserva o tom pastoral do vocativo.
