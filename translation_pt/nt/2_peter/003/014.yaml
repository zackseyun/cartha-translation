id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: pt
  text: Por isso, amados, enquanto aguardam essas coisas, empenhem-se para serem encontrados por ele sem mancha, irrepreensíveis e em paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serem encontrados diante dele sem mancha, irrepreensíveis e em paz”. O dativo grego pode indicar agência (“por ele”) ou referência/presença (“diante dele”).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Por isso
  rationale: Conjunção inferencial que tira uma conclusão da promessa anterior dos novos céus e da nova terra; é natural e clara em português.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Vocativo plural afetuoso que preserva o tom pastoral e epistolar sem acrescentar uma relação não explicitada, como em “queridos irmãos”.
- source_word: ταῦτα προσδοκῶντες
  choice: enquanto aguardam essas coisas
  rationale: Mantém a expectativa contínua do particípio presente e sua ligação circunstancial com a exortação, sem especificar além do texto o referente de “essas coisas”.
- source_word: σπουδάσατε
  choice: empenhem-se
  rationale: Imperativo que comunica dedicação séria e esforço ativo em português corrente e digno.
- source_word: ἄσπιλοι
  choice: sem mancha
  rationale: Preserva a imagem de pureza moral e distingue o termo de ἀμώμητοι.
- source_word: ἀμώμητοι
  choice: irrepreensíveis
  rationale: Expressa a ideia de não dar motivo legítimo para censura e forma um par natural com “sem mancha”.
- source_word: αὐτῷ εὑρεθῆναι
  choice: ser encontrados por ele
  rationale: A construção pode indicar o agente da constatação; a ambiguidade legítima com o sentido de presença ou referência é registrada em nota.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Reproduz de modo conciso o estado no qual os leitores devem ser encontrados e não define indevidamente se a paz é interior, relacional ou comunitária.
theological_decisions:
- issue: Função e referente de αὐτῷ no cenário escatológico
  choice: “por ele”, mantendo implícita a identidade do referente
  alternative: “diante dele”
  rationale: O contexto aponta para a figura divina ligada ao dia que virá, mas o versículo usa apenas o pronome. A tradução não acrescenta “Deus” ou “o Senhor”, e a nota preserva a possível leitura relacional ou de presença do dativo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é pastoral e digno. A vírgula antes de “em paz” ajuda a ligar a expressão ao estado geral em que os destinatários devem ser encontrados, sem fazê-la modificar apenas “irrepreensíveis”.
