id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: pt
  text: Mas, segundo a promessa dele, esperamos novos céus e uma nova terra, nos quais habita a justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: novos céus e uma nova terra
  rationale: Preserva a linguagem cósmica e as ressonâncias de Isaías 65:17; 66:22. «Novos» mantém a ideia de novidade de qualidade sem explicitar, além do adjetivo, se se trata de renovação ou substituição.
- source_word: δὲ
  choice: Mas
  rationale: Expressa o contraste moderado com a destruição descrita no contexto anterior.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: segundo a promessa dele
  rationale: κατά com o acusativo indica conformidade; a formulação comunica que a expectativa se fundamenta na promessa feita por Deus.
- source_word: προσδοκῶμεν
  choice: esperamos
  rationale: O presente indica expectativa contínua. Em português, «esperamos» é natural e pode significar tanto aguardar como esperar com confiança.
- source_word: ἐν οἷς
  choice: nos quais
  rationale: Mantém o pronome relativo no plural do grego e permite que a referência abranja conjuntamente os novos céus e a nova terra.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, «justiça» abrange tanto a retidão moral diante de Deus como aquilo que é justo; «retidão» poderia estreitar o alcance ou soar menos natural neste contexto.
- source_word: κατοικεῖ
  choice: habita
  rationale: Reproduz de modo conciso a imagem de residência estável e permanente expressa por κατοικέω.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto escatológico
  choice: justiça
  alternative: retidão
  rationale: «Justiça» é a correspondência portuguesa normal de δικαιοσύνη e preserva a amplitude moral, relacional e forense do termo. «Retidão» explicita mais a qualidade moral, mas pode reduzir a dimensão do que é justo na nova criação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue de perto o grego sem sacrificar a naturalidade. «Dele» evita a possível ambiguidade referencial de «sua»; o referente é Deus no contexto.
