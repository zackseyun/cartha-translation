id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: pt
  text: como também faz em todas as suas cartas, ao falar nelas sobre essas coisas. Nessas cartas há algumas coisas difíceis de entender, que os ignorantes[b] e instáveis distorcem[c], assim como fazem com as demais Escrituras[a], para a própria destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as outras Escrituras”. O grego pode significar “as demais” ou “as outras”; “as demais Escrituras” expressa melhor a comparação no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que não receberam instrução”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “torcem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: cartas
  rationale: “Cartas” é o termo corrente em português para correspondência escrita e comunica o sentido sem recorrer ao tradicionalismo menos comum “epístolas”.
- source_word: λαλῶν
  choice: ao falar
  rationale: Preserva o sentido básico de “falar”, embora a comunicação ocorra por meio de cartas, sem transformar explicitamente o verbo em “escrever”.
- source_word: περὶ τούτων
  choice: sobre essas coisas
  rationale: Mantém a referência demonstrativa aos assuntos mencionados no contexto anterior.
- source_word: δυσνόητά τινα
  choice: algumas coisas difíceis de entender
  rationale: Expressa tanto a indefinição de τινα quanto a dificuldade indicada por δυσνόητα, em linguagem clara e natural.
- source_word: ἀμαθεῖς
  choice: ignorantes
  rationale: Indica pessoas sem conhecimento ou instrução adequada, sem limitar o sentido à falta de alfabetização.
- source_word: ἀστήρικτοι
  choice: instáveis
  rationale: Comunica a falta de firmeza ou de fundamento sugerida pelo termo no contexto moral e doutrinário.
- source_word: στρεβλοῦσιν
  choice: distorcem
  rationale: Expressa de modo natural em português a imagem de deformar ou forçar algo para lhe dar outro sentido; “torcem” continua possível e é registrado em nota.
- source_word: τὰς λοιπὰς γραφὰς
  choice: as demais Escrituras
  rationale: “Escrituras” preserva o uso neotestamentário de γραφαί para escritos sagrados, e “demais” traduz λοιπάς de modo a manter a comparação com as cartas de Paulo.
- source_word: ἀπώλειαν
  choice: destruição
  rationale: Termo claro e grave que preserva o sentido de ruína final sem introduzir uma formulação teológica mais técnica do que o grego.
theological_decisions:
- issue: Implicação do estatuto escriturístico em τὰς λοιπὰς γραφὰς
  choice: as demais Escrituras
  alternative: as outras Escrituras; os demais escritos
  rationale: No Novo Testamento, γραφαί normalmente designa as Escrituras sagradas, e λοιπάς naturalmente apresenta os outros escritos dessa categoria. A tradução preserva a provável inclusão comparativa das cartas de Paulo entre as Escrituras sem acrescentar uma afirmação doutrinária além da formulação grega.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “cartas” torna explícito o referente do pronome grego e evita ambiguidade pouco natural em português. Os marcadores de nota foram colocados junto às palavras a que de fato correspondem.
