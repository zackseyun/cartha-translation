id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: pt
  text: enquanto esperam e apressam a vinda do dia de Deus[a], por causa do qual os céus, incendiados, serão desfeitos, e os elementos, em chamas[b], se derreterão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aguardam ansiosamente a vinda do dia de Deus”. O verbo grego pode significar tanto “apressar” quanto “aguardar com ardente expectativa”.'
    reason: alternative_reading
  - marker: b
    text: “Elementos” pode se referir aos componentes fundamentais do mundo ou, possivelmente, aos corpos celestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: esperam
  rationale: O particípio presente expressa expectativa contínua e retoma a exortação do versículo anterior; “esperam” é natural e preserva a ideia de aguardar com expectativa.
- source_word: σπεύδοντας
  choice: apressam
  rationale: Com “a vinda” como objeto, “apressam” preserva a leitura gramatical direta; a possível acepção de aguardar ansiosamente é registrada em nota.
- source_word: παρουσίαν
  choice: vinda
  rationale: No contexto escatológico, “vinda” comunica de modo claro a chegada ou presença esperada.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: do dia de Deus
  rationale: Mantém a expressão grega incomum e não a substitui pela fórmula mais frequente “dia do Senhor”.
- source_word: δι’ ἣν
  choice: por causa do qual
  rationale: διά com acusativo exprime naturalmente causa; o antecedente é “dia”, e os acontecimentos cósmicos ocorrem por causa dele.
- source_word: οὐρανοὶ
  choice: os céus
  rationale: Preserva o plural explícito e seu sentido cósmico no contexto.
- source_word: πυρούμενοι
  choice: incendiados
  rationale: 'Expressa de maneira concisa a nuance passiva do particípio: os céus são postos em fogo.'
- source_word: λυθήσονται
  choice: serão desfeitos
  rationale: Comunica desagregação ou dissolução sem impor a ideia metafísica de aniquilação.
- source_word: στοιχεῖα
  choice: os elementos
  rationale: É a opção ampla que melhor preserva a ambiguidade entre componentes fundamentais do mundo e corpos celestes.
- source_word: καυσούμενα
  choice: em chamas
  rationale: Expressa de modo natural o efeito do calor ou fogo sobre os elementos.
- source_word: τήκεται
  choice: se derreterão
  rationale: O verbo denota derreter-se sob calor; o futuro em português harmoniza naturalmente com os futuros que estruturam a oração, sem alterar o sentido prospectivo.
theological_decisions:
- issue: Sentido de σπεύδοντας τὴν παρουσίαν
  choice: apressam a vinda
  alternative: aguardam ansiosamente a vinda
  rationale: O grego admite tanto a ideia de apressar a chegada quanto a de desejá-la ou aguardá-la com ardor. A leitura com objeto direto fica no texto, e a alternativa teologicamente relevante permanece na nota.
- issue: Referente de στοιχεῖα
  choice: os elementos
  alternative: os corpos celestes
  rationale: O referente é discutido. A formulação ampla evita impor ao texto um esquema cosmológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a tensão interpretativa de “apressam” e a ambiguidade de “elementos”; “serão desfeitos” evita a rigidez técnica de “serão dissolvidos” sem enfraquecer a imagem cósmica.
