source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: pt
  text: 'e dizendo: “Onde está a promessa da sua vinda[a]? Pois, desde que os antepassados adormeceram[b], tudo permanece assim desde o princípio da criação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presença” ou “chegada”. Neste contexto, a palavra grega παρουσία se refere à esperada vinda futura de Cristo.
    reason: lexical_alternative
  - marker: b
    text: “Adormeceram” é um eufemismo grego para “morreram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: e dizendo
  rationale: Mantém o particípio presente coordenado com a descrição anterior dos zombadores e preserva o fluxo sintático do grego.
- source_word: ἐπαγγελία
  choice: promessa
  rationale: É a tradução direta e natural; refere-se à promessa da vinda, sem explicitar além do texto quem a fez.
- source_word: παρουσίας
  choice: vinda
  rationale: No contexto escatológico, indica a chegada ou presença futura esperada de Cristo; “vinda” é clara e corrente em português.
- source_word: ἀφ’ ἧς
  choice: desde que
  rationale: Expressa naturalmente o tempo transcorrido a partir do acontecimento mencionado.
- source_word: οἱ πατέρες
  choice: os pais
  rationale: Preserva o substantivo e o artigo do grego, sem acrescentar um possessivo ausente; no contexto, pode designar os antepassados ou uma geração anterior.
- source_word: ἐκοιμήθησαν
  choice: adormeceram
  rationale: Conserva o eufemismo metafórico grego para a morte.
- source_word: πάντα
  choice: tudo
  rationale: Reproduz de modo natural em português o sentido abrangente do neutro plural.
- source_word: οὕτως διαμένει
  choice: continua como
  rationale: Comunica a alegação de permanência no mesmo estado e preserva a relação comparativa com o princípio da criação.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: desde o princípio da criação
  rationale: É uma formulação clara e próxima da construção grega, indicando o ponto inicial alegado pelos zombadores.
theological_decisions:
- issue: Sentido escatológico de παρουσία
  choice: sua vinda
  alternative: sua presença; sua chegada
  rationale: O contexto trata da esperada manifestação futura de Cristo. “Vinda” transmite esse sentido sem definir detalhes do acontecimento.
- issue: Metáfora de ἐκοιμήθησαν para a morte
  choice: adormeceram
  alternative: morreram
  rationale: A tradução conserva a imagem usada pelo texto, enquanto a nota esclarece seu valor eufemístico sem lhe impor uma conclusão doutrinária.
- issue: Referente de οἱ πατέρες
  choice: os pais
  alternative: os antepassados
  rationale: 'A forma mais literal preserva uma possível amplitude referencial: pode apontar para gerações anteriores em geral, sem decidir silenciosamente uma identificação específica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o encadeamento participial, a metáfora do sono e a relativa ambiguidade de “os pais”; as notas esclarecem alternativas lexicais essenciais.
