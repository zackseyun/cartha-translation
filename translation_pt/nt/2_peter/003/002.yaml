  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: pt
  text: para se lembrarem das palavras ditas de antemão pelos santos profetas[b] e do mandamento do Senhor e Salvador, transmitido pelos apóstolos de vocês[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do mandamento dos apóstolos de vocês, da parte do Senhor e Salvador”. A sequência de genitivos no grego pode ser expressa naturalmente de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “das palavras anteriormente proferidas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: para se lembrarem
  rationale: O infinitivo aoristo passivo de μιμνῄσκομαι tem sentido ativo e, no contexto, expressa a finalidade iniciada no versículo anterior. “Lembrar-se” é natural e mantém a ligação sintática.
- source_word: προειρημένων ῥημάτων
  choice: das palavras ditas de antemão
  rationale: A expressão indica palavras proferidas anteriormente, sem restringi-las necessariamente a predições. “Ditas de antemão” preserva tanto a anterioridade quanto o caráter verbal de ῥήματα.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: pelos santos profetas
  rationale: Reproduz naturalmente o agente da forma passiva e conserva a qualificação dos profetas como santos.
- source_word: ἐντολῆς
  choice: do mandamento
  rationale: Mantém o singular e a força de uma ordem dotada de autoridade; “mandamento” também preserva a ressonância bíblica do termo.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: dos apóstolos de vocês
  rationale: A ordem das palavras favorece a ligação de ὑμῶν com ἀποστόλων. “De vocês” indica os apóstolos ligados aos destinatários sem recorrer a linguagem arcaica.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: da parte do Senhor e Salvador
  rationale: A locução expressa a origem do mandamento no Senhor e Salvador, sem acrescentar “nosso”, ausente do grego, e sem apagar a ambiguidade sintática, registrada em nota.
theological_decisions:
- issue: Relação de ὑμῶν em τῶν ἀποστόλων ὑμῶν
  choice: “de vocês” modifica “apóstolos”
  alternative: “o mandamento dado a vocês pelos apóstolos”
  rationale: A proximidade e a ordem grega favorecem “os apóstolos de vocês”, isto é, associados aos destinatários ou enviados a eles.
- issue: Relação sintática de τοῦ κυρίου καὶ σωτῆρος
  choice: O mandamento procede do Senhor e Salvador e está associado aos apóstolos dos leitores
  alternative: “o mandamento do Senhor e Salvador, transmitido pelos apóstolos de vocês”
  rationale: A sequência dos genitivos permite mais de uma representação natural. O texto principal conserva a ordem apostólica seguida da origem no Senhor; a nota apresenta a formulação que explicita a mediação apostólica.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e compreensão internacional. “De vocês” evita o arcaísmo de “vossos”; “da parte do” comunica origem com naturalidade. A vírgula final foi mantida porque o trecho fornecido continua sintaticamente no contexto do versículo.
