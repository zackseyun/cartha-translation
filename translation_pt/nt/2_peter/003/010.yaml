id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: pt
  text: Mas o dia do Senhor virá como um ladrão; nesse dia, os céus passarão com grande estrondo, os elementos[a], em chamas, se dissolverão, e a terra e as obras que nela existem serão encontradas[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os corpos celestes”; neste contexto, στοιχεῖα também pode designar mais especificamente os componentes do cosmos.
    reason: lexical_alternative
  - marker: b
    text: Alguns entendem “serão encontradas” no sentido de “serão postas a descoberto” ou “serão expostas”.
    reason: alternative_reading
  - marker: c
    text: Muitos manuscritos trazem “serão queimadas” em vez de “serão encontradas”.
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: virá
  rationale: O futuro de ἥκω expressa chegada; “virá” é natural e preserva a formulação escatológica.
- source_word: ἡμέρα κυρίου
  choice: o dia do Senhor
  rationale: Mantém a expressão profética e apostólica tradicional e evita confusão com um dia semanal de culto.
- source_word: κλέπτης
  choice: um ladrão
  rationale: Preserva a comparação bíblica e a ênfase numa chegada inesperada.
- source_word: ἐν ᾗ
  choice: Nesse dia
  rationale: Retoma de modo claro e natural o antecedente “dia do Senhor”, sem alterar a relação temporal do grego.
- source_word: οἱ οὐρανοὶ
  choice: os céus
  rationale: Conserva o plural e o alcance cósmico do contexto.
- source_word: ῥοιζηδόν
  choice: com grande estrondo
  rationale: Comunica de forma vívida o ruído impetuoso ou retumbante indicado pelo advérbio.
- source_word: παρελεύσονται
  choice: passarão
  rationale: Reproduz o sentido escatológico de deixar de existir ou passar, sem explicitação excessiva.
- source_word: στοιχεῖα
  choice: os elementos
  rationale: É a opção mais contida e deixa aberta a possibilidade de componentes do cosmos ou corpos celestes.
- source_word: καυσούμενα
  choice: consumidos pelo fogo
  rationale: Expressa o processo passivo de queima associado à desintegração, sem nomear um agente.
- source_word: λυθήσεται
  choice: se desfarão
  rationale: Comunica em português corrente a ideia de dissolução ou desintegração presente em λύω.
- source_word: γῆ
  choice: a terra
  rationale: O contexto cósmico favorece “terra”, não a acepção localizada de “território”.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: as obras que nela existem
  rationale: Mantém ἔργα como “obras” e torna idiomática a relação expressa por ἐν αὐτῇ, sem restringi-la apenas a ações humanas.
- source_word: εὑρεθήσεται
  choice: serão encontradas
  rationale: Preserva a leitura difícil do texto grego fornecido e a concordância pelo sentido com o sujeito composto.
theological_decisions:
- issue: Sentido da oração final καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: Manter “a terra e as obras que nela existem serão encontradas” no texto principal.
  alternative: “serão expostas” ou, segundo uma variante textual, “serão queimadas”.
  rationale: εὑρεθήσεται significa mais diretamente “será encontrado”. Como a frase é textual e interpretativamente difícil, a tradução não impõe uma solução teológica mais fluente.
- issue: Referente de στοιχεῖα
  choice: Traduzir como “os elementos”.
  alternative: “os corpos celestes” ou “os componentes básicos do universo”.
  rationale: O termo admite mais de um referente no contexto; a forma ampla preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi levemente ajustada para clareza, mas as ambiguidades lexical e textual do original foram mantidas no texto e nas notas.
