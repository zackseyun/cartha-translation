id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: pt
  text: E considerem a paciência de nosso Senhor como salvação[a], assim como também nosso amado irmão Paulo escreveu a vocês, segundo a sabedoria que lhe foi dada[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tolerância»; o sentido é que a demora do Senhor visa à salvação, não é indiferença.
    reason: lexical_alternative
  - marker: b
    text: A expressão «a sabedoria que lhe foi dada» provavelmente indica sabedoria dada por Deus, embora o grego não declare quem a deu.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Expressa a contenção paciente e a demora do juízo. «Paciência» é natural no português atual e se ajusta ao contexto da aparente demora da vinda do Senhor.
- source_word: σωτηρίαν
  choice: salvação
  rationale: Conserva o peso teológico do termo e a afirmação direta de que a paciência do Senhor tem finalidade salvadora.
- source_word: ἡγεῖσθε
  choice: considerem ... como
  rationale: O imperativo pede aos leitores que avaliem ou entendam algo de determinada maneira; esta construção comunica claramente a relação predicativa.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título cristológico natural no contexto e seu peso teológico.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: amado irmão
  rationale: Mantém tanto o afeto da expressão quanto sua forma fraterna, em linguagem digna e compreensível.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: segundo a sabedoria que lhe foi dada
  rationale: «Segundo» expressa conformidade, e a voz passiva mantém não declarado o agente que concedeu a sabedoria.
- source_word: ἔγραψεν ὑμῖν
  choice: escreveu a vocês
  rationale: O passado simples corresponde naturalmente ao aoristo e «a vocês» oferece ampla legibilidade, especialmente brasileira.
- source_word: καθὼς καὶ
  choice: assim como também
  rationale: Preserva tanto a comparação quanto a nuance aditiva da expressão grega.
theological_decisions:
- issue: Agente da sabedoria dada a Paulo
  choice: Manter «que lhe foi dada» sem acrescentar o agente.
  alternative: «que Deus lhe deu»
  rationale: Embora a agência divina seja provável, o grego não identifica explicitamente quem deu a sabedoria; a tradução conserva essa abertura.
- issue: Sentido da demora do Senhor
  choice: «paciência ... como salvação»
  alternative: «tolerância ... como oportunidade de salvação»
  rationale: A formulação preserva a predicação concisa do grego e sua tensão teológica, sem expandi-la para uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente naturalizada sem eliminar a relação direta entre a paciência do Senhor e a salvação. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
