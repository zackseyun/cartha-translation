source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: pt
  text: O Senhor não demora a cumprir a promessa, como alguns entendem que há demora[a], mas é paciente para com vocês[b][c], não querendo que ninguém pereça, mas que todos cheguem ao arrependimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como alguns consideram demora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “é paciente com vocês”.'
    reason: lexical_alternative
  - marker: c
    text: O alcance de “ninguém” e “todos” fica como está expresso no grego. Há divergência entre os intérpretes sobre se Pedro se refere especificamente aos seus leitores ou, de modo mais amplo, à humanidade.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: o Senhor
  rationale: Mantém o título divino, com o artigo exigido pelo português natural.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: não tarda quanto à promessa
  rationale: Expressa de modo conciso a ideia de demora em relação à promessa, sem acrescentar explicitamente “em cumpri-la”, embora isso esteja implícito no contexto.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: como alguns julgam haver demora
  rationale: Traduz ἡγέομαι como avaliação ou juízo e conserva a noção de demora de βραδύτης em português natural.
- source_word: μακροθυμεῖ
  choice: é paciente
  rationale: Comunica a ideia de paciência prolongada e contenção, evitando termos arcaicos como “longânimo” no corpo do texto.
- source_word: εἰς ὑμᾶς
  choice: para com vocês
  rationale: Preserva a direção da paciência do Senhor em relação aos destinatários e é compreensível em português internacional com boa legibilidade brasileira.
- source_word: μὴ βουλόμενός
  choice: não querendo
  rationale: Mantém o sentido volitivo do particípio sem transformá-lo em categoria técnica sobre decreto, intenção ou tipos de vontade divina.
- source_word: τινας ἀπολέσθαι
  choice: que ninguém pereça
  rationale: “Pereça” preserva o peso de ἀπόλλυμι em uso intransitivo; “ninguém” é a forma idiomática portuguesa de τινας sob negação.
- source_word: πάντας
  choice: todos
  rationale: Conserva a antítese concisa entre τινας e πάντας sem restringir nem ampliar explicitamente o referente.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: que todos cheguem ao arrependimento
  rationale: χωρέω indica aqui chegar ou avançar a um estado; “arrependimento” é a tradução corrente e semanticamente adequada de μετάνοια.
theological_decisions:
- issue: Alcance de “vocês”, “ninguém” e “todos” em relação à paciência divina e à salvação
  choice: 'Manter os referentes sem delimitação adicional: “para com vocês ... não querendo que ninguém pereça, mas que todos cheguem ao arrependimento”.'
  alternative: Restringir “ninguém” e “todos” aos destinatários crentes/eleitos, ou explicitar que se referem universalmente a toda a humanidade.
  rationale: O grego não torna explícita uma delimitação doutrinária do alcance. A tradução conserva a formulação e a tensão do texto, enquanto a nota registra a divergência interpretativa.
- issue: Força de βουλόμενος em relação à vontade de Deus
  choice: não querendo
  alternative: “não decretando”, “não pretendendo” ou o mais tradicional “não querendo que nenhum pereça”.
  rationale: A escolha expressa vontade ou desejo sem importar distinções sistemático-teológicas que o versículo não formula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “para com” mantém uma leve formalidade adequada ao registro bíblico. A formulação evita tanto expansões doutrinárias quanto arcaísmos desnecessários.
