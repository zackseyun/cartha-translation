id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: pt
  text: Visto que todas essas coisas estão sendo desfeitas[a] dessa maneira, que tipo de pessoas vocês devem ser, com conduta santa e devoção a Deus[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dissolvidas” ou “desintegradas”; o grego fala literalmente de coisas que são soltas ou desfeitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “piedade”. No grego, tanto “conduta” como “devoção” aparecem no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: todas essas coisas
  rationale: A expressão genitiva retoma as realidades criadas mencionadas no contexto. “Coisas” explicita naturalmente em português o referente implícito.
- source_word: οὕτως
  choice: dessa maneira
  rationale: Preserva o valor adverbial de modo e liga a declaração à descrição precedente.
- source_word: λυομένων
  choice: estão sendo desfeitas
  rationale: O particípio presente passivo de λύω descreve o desfazer ou a desintegração da ordem atual. “Desfeitas” conserva a imagem lexical sem impor a interpretação mais forte de destruição total.
- source_word: ποταποὺς
  choice: que tipo de pessoas
  rationale: Na pergunta retórica, ποταπός indaga a natureza ou qualidade moral das pessoas; esta formulação é clara e idiomática.
- source_word: δεῖ
  choice: devem
  rationale: Comunica a necessidade moral expressa por δεῖ de modo direto e natural no contexto exortativo.
- source_word: ὑπάρχειν
  choice: ser
  rationale: Com δεῖ e ὑμᾶς, o verbo tem o sentido idiomático de “ser”, não meramente “existir”.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: com conduta santa
  rationale: ἀναστροφή designa conduta ou modo de vida. O singular coletivo é mais natural em português, sem perder a ênfase ética do plural grego.
- source_word: εὐσεβείαις
  choice: devoção a Deus
  rationale: εὐσέβεια denota reverência e devoção manifestadas na vida. A explicitação “a Deus” torna o sentido claro ao leitor moderno e evita possíveis conotações estreitas de “piedade”.
theological_decisions:
- issue: Descrição escatológica do destino da ordem criada
  choice: estão sendo desfeitas
  alternative: estão sendo destruídas; serão desfeitas
  rationale: O particípio grego fala literalmente de soltura, desagregação ou dissolução. A tradução mantém essa imagem e o aspecto progressivo, sem intensificá-la para “destruição” nem converter o presente em futuro.
- issue: Natureza da resposta ética à expectativa escatológica
  choice: conduta santa e devoção a Deus
  alternative: santas condutas e atos de piedade
  rationale: A formulação conserva conjuntamente as dimensões ética e devocional do grego, sem reduzi-las a observâncias de uma tradição específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pergunta retórica recebe ponto de exclamação para comunicar sua força exortativa; a ordem da frase e a relação com o contexto foram preservadas.
