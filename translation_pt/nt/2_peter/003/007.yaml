source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: pt
  text: Mas os céus e a terra atuais estão reservados pela mesma palavra e são guardados para o fogo até o dia do juízo e da destruição dos seres humanos ímpios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos homens ímpios»; o termo grego pode representar os seres humanos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Mas os céus e a terra de agora
  rationale: δέ marca o contraste com o mundo anterior mencionado no contexto; νῦν caracteriza a ordem criada atual. Mantém-se o plural «céus» e o singular «terra».
- source_word: τῷ αὐτῷ λόγῳ
  choice: pela mesma palavra
  rationale: O dativo é entendido instrumentalmente, e «mesma» preserva a referência à palavra eficaz de Deus no contexto precedente.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: estão armazenados
  rationale: A construção perifrástica no perfeito descreve um estado presente resultante de uma ação anterior. «Estão armazenados» também evita confundir este verbo com τηρούμενοι.
- source_word: πυρὶ τηρούμενοι
  choice: são guardados para o fogo
  rationale: τηρέω indica conservar ou reservar, e o dativo πυρί expressa aqui a finalidade ou destino. O paralelismo verbal foi expresso por uma oração coordenada natural em português.
- source_word: εἰς ἡμέραν κρίσεως
  choice: até o dia do juízo
  rationale: εἰς tem força temporal e aponta para o momento final até o qual os céus e a terra são guardados.
- source_word: καὶ ἀπωλείας
  choice: e da destruição
  rationale: ἀπώλεια significa destruição ou ruína; «destruição» é claro e não introduz uma definição técnica além do texto.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: dos seres humanos ímpios
  rationale: ἄνθρωποι pode designar seres humanos de modo geral. «Seres humanos» comunica explicitamente a abrangência representativa, enquanto «ímpios» preserva o sentido de irreverência e oposição a Deus.
theological_decisions:
- issue: Natureza do futuro juízo pelo fogo
  choice: O versículo afirma que os céus e a terra atuais são guardados para o fogo e que os seres humanos ímpios sofrerão destruição.
  alternative: Aniquilação completa do cosmos ou transformação purificadora da criação.
  rationale: O texto identifica explicitamente os seres humanos ímpios como objeto da «destruição», mas não define neste versículo se o efeito do fogo sobre a criação é aniquilação ou renovação. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a estrutura e a ambiguidade teológica do grego sem recorrer a vocabulário denominacional.
