id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: pt
  text: Mas cresçam na graça e no conhecimento de nosso Senhor e Salvador Jesus, o Messias.[a] A ele seja dada a glória, tanto agora como até o dia da eternidade.[b] Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme o uso tradicional em português, “Jesus Cristo”.
    reason: alternative_reading
  - marker: b
    text: Ou “agora e para sempre”. Mais literalmente, o grego diz “agora e até o dia da eternidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: cresçam
  rationale: Imperativo presente ativo na segunda pessoa do plural. “Cresçam” é natural em português e, no contexto exortativo, comporta o sentido de desenvolvimento contínuo sem explicitação excessiva.
- source_word: δὲ
  choice: Mas
  rationale: Marca contraste moderado com as advertências anteriores; “Mas” preserva essa transição adversativa.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: na graça e no conhecimento
  rationale: A preposição ἐν rege os dois substantivos. A construção com artigos é idiomática em português e conserva a ideia de esfera na qual deve ocorrer o crescimento.
- source_word: χάριτι
  choice: graça
  rationale: Termo corrente e adequado para o sentido neotestamentário, sem reduzir o conceito a mero favor humano.
- source_word: γνώσει
  choice: conhecimento
  rationale: Preserva o valor de γνῶσις como conhecimento de Cristo, sem substituí-lo por uma paráfrase mais interpretativa, como “entendimento”.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: de nosso Senhor e Salvador, Jesus, o Messias
  rationale: O único artigo grego associa “Senhor” e “Salvador” à mesma pessoa. “Messias” traduz o título Χριστός; as vírgulas tornam natural em português a aposição “Jesus, o Messias”.
- source_word: αὐτῷ ἡ δόξα
  choice: A ele seja dada a glória
  rationale: Expressa naturalmente em português a atribuição doxológica indicada pela frase nominal grega com verbo subentendido.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: tanto agora como até o dia da eternidade
  rationale: “Tanto... como...” representa a correlação καὶ... καὶ; “até o dia da eternidade” conserva a formulação incomum do grego e evita achatá-la silenciosamente em “para sempre”.
- source_word: ἀμήν
  choice: Amém
  rationale: Transliteração consagrada em português nos contextos litúrgicos e doxológicos.
theological_decisions:
- issue: Tradução de Χριστοῦ em Ἰησοῦ Χριστοῦ
  choice: Jesus, o Messias
  alternative: Jesus Cristo
  rationale: Χριστός conserva força titular e é traduzido por “Messias”. “Jesus Cristo” é a forma tradicional e consta em nota como alternativa reconhecida.
- issue: Referente de “nosso Senhor e Salvador”
  choice: Os dois títulos se referem à única pessoa de Jesus, o Messias
  alternative: Uma formulação menos explícita poderia deixar a relação sintática menos clara
  rationale: O único artigo que rege κύριος e σωτήρ aponta naturalmente para um só referente; a tradução acompanha a gramática sem acrescentar formulação doutrinária.
- issue: Sentido da doxologia temporal
  choice: Conservar “até o dia da eternidade”
  alternative: agora e para sempre
  rationale: A expressão grega é incomum e inclui explicitamente ἡμέραν, “dia”. A tradução principal preserva essa tensão; a forma idiomática mais interpretativa aparece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a segunda pessoa do plural por meio de “cresçam”, evita construções excessivamente arcaicas e preserva na tradução principal a expressão deliberadamente incomum “dia da eternidade”.
