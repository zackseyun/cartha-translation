base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: pt
  text: sabendo antes de tudo que, nos últimos dias, virão zombadores com zombaria[a], vivendo segundo os seus próprios desejos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “virão zombadores, zombando”. O grego emprega palavras da mesma raiz para dar ênfase: “zombadores” e “zombaria”.'
    reason: lexical_alternative
  - marker: b
    text: “Desejos” também pode ser traduzido por “paixões” ou “cobiças”; o termo grego designa desejos intensos em sentido amplo, não apenas de natureza sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: sabendo antes de tudo que
  rationale: Mantém a construção participial e expressa πρῶτον de modo natural em português, sem transformá-la explicitamente em imperativo.
- source_word: ἐλεύσονται
  choice: virão
  rationale: Equivalente direto e idiomático do futuro de ἔρχομαι.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: nos últimos dias
  rationale: Expressão escatológica convencional que preserva a referência temporal sem impor um sistema específico sobre o fim dos tempos.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: zombadores com zombaria
  rationale: Conserva a repetição enfática de termos cognatos no grego, embora ela seja incomum em português; a nota oferece uma alternativa mais fluente.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: segundo os seus próprios desejos
  rationale: Preserva o sentido amplo de ἐπιθυμίαι e a ênfase possessiva de ἰδίας αὐτῶν, sem restringir o termo a desejos sexuais.
- source_word: πορευόμενοι
  choice: vivendo
  rationale: No contexto, o particípio descreve modo de vida ou conduta. “Vivendo” comunica esse valor idiomaticamente em português; “andando” preservaria a metáfora, mas poderia soar menos natural aqui.
theological_decisions:
- issue: Expressão escatológica ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: nos últimos dias
  alternative: no fim dos dias
  rationale: A formulação convencional mantém aberta a extensão temporal da expressão e não a vincula a uma cronologia escatológica denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece ligada ao contexto anterior por meio do particípio inicial e da vírgula final. A repetição marcada do original é preservada no texto e esclarecida em nota.
