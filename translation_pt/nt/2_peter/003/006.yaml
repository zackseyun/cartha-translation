  text: δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/006.yaml
  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: pt
  text: Por meio dessas coisas[a], o mundo de então, inundado pela água, pereceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por meio dos quais». O pronome grego está no plural e se refere de modo não especificado aos meios ou elementos mencionados no versículo anterior.
    reason: Preserva a ambiguidade do referente de δι’ ὧν e registra uma alternativa de tradução.
lexical_decisions:
- source_word: δι’ ὧν
  choice: por meio das quais
  rationale: διά com o genitivo expressa meio ou instrumento. O pronome relativo plural preserva a referência aberta aos elementos mencionados no versículo anterior, sem especificar além do grego.
- source_word: ὁ τότε κόσμος
  choice: o mundo daquele tempo
  rationale: A expressão mantém o contraste temporal com o mundo presente no contexto e pode abranger o mundo humano e sua ordem então existente, não apenas o planeta físico.
- source_word: ὕδατι
  choice: pela água
  rationale: O dativo indica o meio pelo qual ocorreu a inundação. A formulação é natural em português e conserva o valor instrumental.
- source_word: κατακλυσθεὶς
  choice: inundado
  rationale: O particípio aoristo passivo indica que o mundo foi submerso ou assolado por uma inundação. O particípio português mantém de modo conciso sua relação com o verbo principal.
- source_word: ἀπώλετο
  choice: pereceu
  rationale: O verbo, aqui com sentido intransitivo, indica perecer ou ser destruído. “Pereceu” preserva a gravidade do juízo sem impor a ideia de aniquilação absoluta.
theological_decisions:
- issue: Natureza do juízo do dilúvio
  choice: pereceu
  alternative: foi destruído
  rationale: O texto descreve o juízo catastrófico sobre o mundo daquele tempo, mas o verbo grego não exige uma afirmação metafísica de aniquilação. “Pereceu” mantém tanto a severidade quanto a amplitude semântica.
- issue: Referente de δι’ ὧν
  choice: por meio das quais
  alternative: por meio dos quais
  rationale: O plural relativo retoma meios ou realidades do versículo anterior, mas sua referência exata permanece discutível. A tradução não deve explicitar no corpo do versículo uma identificação que o grego deixa aberta; a forma feminina concorda naturalmente em português com as realidades ou coisas anteriormente mencionadas.
translation_notes:
  register: Português moderno, claro e digno, com equivalência ótima. A estrutura permanece próxima do grego, mas é natural para leitores brasileiros e amplamente compreensível no espaço lusófono.
