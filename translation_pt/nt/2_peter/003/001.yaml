source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: pt
  text: Amados, esta é agora a segunda carta que escrevo a vocês; em ambas[a], desperto a mente sincera de vocês por meio de uma lembrança[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nelas”; o grego está no plural e se refere mais naturalmente às duas cartas.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a mente pura de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Amados
  rationale: Vocativo plural afetuoso que conserva o peso epistolar e teológico do termo, sendo natural e compreensível em português bíblico atual.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: esta é a segunda carta que agora escrevo
  rationale: Reorganiza a ordem grega para um português natural, preservando a identificação desta carta como a segunda e representando ἤδη por «agora».
- source_word: γράφω
  choice: escrevo
  rationale: O presente epistolar é expresso naturalmente pelo presente simples em português.
- source_word: ἐν αἷς
  choice: Em ambas
  rationale: O pronome relativo está no plural feminino e remete mais naturalmente às duas cartas; «ambas» torna essa referência clara e concisa.
- source_word: διεγείρω
  choice: procuro despertar
  rationale: O verbo descreve o ato de acordar ou estimular a atenção. «Despertar» preserva a metáfora, enquanto «procuro» produz uma formulação idiomática sem alterar a intenção do autor.
- source_word: ἐν ὑπομνήσει
  choice: por meio de uma lembrança
  rationale: Expressa o meio pelo qual o autor desperta a mente dos leitores, em linguagem corrente e digna.
- source_word: εἰλικρινῆ διάνοιαν
  choice: a mente sincera
  rationale: «Mente» representa διάνοια, e «sincera» conserva o sentido de integridade ou pureza de εἰλικρινής sem resolver indevidamente sua nuance lexical.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Forma possessiva clara e amplamente compreensível no português moderno, adequada à leitura brasileira e internacional.
theological_decisions:
- issue: Referência do pronome relativo plural ἐν αἷς
  choice: Refere-se às duas cartas escritas aos destinatários.
  alternative: Entender o plural como uso pouco preciso que se refere somente à carta presente.
  rationale: A concordância no feminino plural aponta de modo mais natural para as duas cartas. A tradução explicita essa leitura gramatical, mantendo em nota a possibilidade de uma formulação menos explícita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» para o plural de segunda pessoa. A estrutura foi levemente reorganizada para fluência. As notas preservam a alternativa formal para ἐν αἷς e a amplitude semântica de εἰλικρινής.
