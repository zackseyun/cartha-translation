id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: pt
  text: Portanto, vocês, amados, sabendo disso de antemão, guardem-se para que não caiam[a] de sua própria firmeza[b], levados juntamente pelo erro dos que desprezam a lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cair de” também pode ser traduzido como “afastar-se de”, mas esta formulação evita tornar a advertência teologicamente mais específica do que o grego exige.
    reason: alternative_reading
  - marker: b
    text: Ou “sua própria constância”. O termo grego στηριγμός pode indicar firmeza, estabilidade ou constância.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Vocês, portanto
  rationale: Mantém o pronome explícito e enfático e apresenta οὖν como transição inferencial, em uma ordem natural e solene em português.
- source_word: ἀγαπητοί
  choice: amados
  rationale: Preserva o vocativo afetuoso e o tom epistolar sem acrescentar uma relação mais específica, como “amigos” ou “irmãos”.
- source_word: προγινώσκοντες
  choice: já que sabem disso de antemão
  rationale: Expressa a circunstância pressuposta pelo particípio e conserva a noção de conhecimento prévio; “disso” é recuperado naturalmente do contexto.
- source_word: φυλάσσεσθε
  choice: guardem-se
  rationale: Reproduz a força imperativa presente e reflexiva do verbo médio, comunicando vigilância contínua.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Conserva a relação de propósito e advertência em português atual.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: pelo erro dos que desprezam a lei
  rationale: “Erro” traduz o sentido de desvio ou engano de πλάνη; a expressão “os que desprezam a lei” comunica a falta de respeito por normas implicada em ἀθέσμων sem depender do termo menos transparente “iníquos”.
- source_word: συναπαχθέντες
  choice: arrastados
  rationale: Preserva a voz passiva e a imagem de ser levado junto ou desviado por uma influência.
- source_word: ἐκπέσητε
  choice: não caiam de
  rationale: Mantém a metáfora de cair para fora de uma posição sem especificar perda de salvação ou apostasia.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: de sua própria firmeza
  rationale: “Firmeza” expressa a estabilidade ou constância denotada por στηριγμός, e “própria” conserva a ênfase possessiva de ἰδίου.
theological_decisions:
- issue: Se ἐκπέσητε indica necessariamente apostasia ou perda da salvação
  choice: não caiam de sua própria firmeza
  alternative: não se afastem de sua perseverança; não percam sua posição segura na fé
  rationale: O grego adverte sobre cair de uma condição de firmeza, mas não define por si só todas as consequências teológicas dessa queda. A tradução mantém a seriedade da advertência sem decidir uma controvérsia doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o pronome enfático, o afeto do vocativo e a metáfora final, sem resolver a ambiguidade teológica do aviso.
