review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente o mais-que-perfeito («tinham dado»), as autoridades sacerdotais e os fariseus, a condição e a finalidade da ordem. «Prender» é contextual e aceitável para πιάσωσιν, embora «capturar»/«apoderar-se» mantenha uma gama lexical um pouco mais ampla.
  naturalness: A frase é compreensível, mas «informasse» sem complemento fica levemente elíptico em português. «Desse essa informação» explicita naturalmente o conteúdo de μηνύσῃ sem acrescentar um destinatário que o grego não nomeia. «Pudessem prendê-lo» também torna mais clara a referência aos que executariam a ação.
  terminology: «Principais sacerdotes», «fariseus», «ordens» e «prender» são adequados ao registro e ao uso bíblico moderno. A nota lexical deve estar ancorada diretamente no verbo a que se refere.
  issues:
