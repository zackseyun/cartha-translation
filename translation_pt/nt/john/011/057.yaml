  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: pt
  text: Os principais sacerdotes e os fariseus tinham dado ordens para que, se alguém soubesse onde ele estava, desse essa informação, a fim de que pudessem prendê-lo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a fim de que pudessem capturá-lo»; o verbo grego também pode significar «agarrar» ou «apoderar-se dele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: tinham dado
  rationale: O mais-que-perfeito grego indica uma ação anterior já concluída em relação ao momento narrado; a forma composta é natural no português atual.
- source_word: δὲ
  choice: sem tradução explícita
  rationale: Aqui δέ apenas dá continuidade à narrativa. O português não exige um conectivo, e inserir «ora» ou «então» daria destaque indevido.
- source_word: ἀρχιερεῖς
  choice: principais sacerdotes
  rationale: No uso joanino, o plural designa as autoridades sacerdotais dirigentes, não vários sumos sacerdotes em exercício.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma portuguesa consagrada para o nome desse grupo judaico.
- source_word: ἐντολὰς
  choice: ordens
  rationale: Expressa adequadamente determinações oficiais e obrigatórias dadas pelas autoridades.
- source_word: ἵνα ἐάν τις γνῷ
  choice: para que, se alguém soubesse
  rationale: Preserva tanto o conteúdo das ordens quanto o elemento condicional da construção grega, em sintaxe portuguesa natural.
- source_word: ποῦ ἐστιν
  choice: onde ele estava
  rationale: Embora o grego use o presente, o português normalmente ajusta o tempo no discurso indireto subordinado a uma ação passada, sem alterar o referente temporal.
- source_word: μηνύσῃ
  choice: informasse
  rationale: O verbo significa dar a conhecer ou comunicar uma informação, especialmente às autoridades. O destinatário fica implícito, como no grego.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: a fim de que o prendessem
  rationale: A locução mantém a finalidade explícita; «prender» comunica naturalmente, neste contexto, o ato de capturar Jesus pelas autoridades.
