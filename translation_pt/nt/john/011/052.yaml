  source_fidelity: 'O texto reproduz adequadamente a continuação da declaração sobre a morte de Jesus: «pela nação» traduz ὑπὲρ τοῦ ἔθνους no contexto, a contraposição «não somente... mas também» preserva μόνον ... ἀλλά, e «para reunir em um só» expressa a finalidade de ἵνα ... συναγάγῃ εἰς ἕν sem acrescentar um referente como «corpo». «Filhos de Deus» corresponde de modo aceitável a τέκνα τοῦ θεοῦ, e «que estão dispersos» comunica o estado expresso pelo particípio perfeito passivo διεσκορπισμένα.'
