id: JHN.11.52
reference: John 11:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: pt
  text: e não somente pela nação[a], mas também para reunir em um só os filhos de Deus que estão dispersos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “a nação” refere-se à nação judaica.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: nação
  rationale: No contexto imediato, refere-se à nação judaica. “Nação” preserva o sentido corporativo singular sem ampliar o referente.
- source_word: ἵνα
  choice: para
  rationale: Introduz a finalidade da morte mencionada no versículo anterior; a formulação é natural em português e mantém a força final.
- source_word: τέκνα τοῦ θεοῦ
  choice: filhos de Deus
  rationale: Em português, “filhos” pode abranger ambos os sexos e é a expressão bíblica corrente para τέκνα, sem restringi-la a homens.
- source_word: τὰ διεσκορπισμένα
  choice: que estão dispersos
  rationale: Expressa o estado resultante indicado pelo particípio perfeito passivo, com linguagem clara e atual.
- source_word: συναγάγῃ
  choice: reunir
  rationale: Preserva a ideia de ajuntar presente no verbo e se encaixa naturalmente na oração de finalidade.
- source_word: εἰς ἕν
  choice: em um só
  rationale: Mantém a concisão e a abertura do grego, sem acrescentar “corpo” ou definir de modo mais específico a unidade.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: e não somente pela nação, mas também
  rationale: Continua a declaração anterior sobre morrer em favor de outros. “Pela” comunica adequadamente ὑπέρ neste contexto e preserva a estrutura contrastiva.
theological_decisions:
- issue: Identidade dos “filhos de Deus”
  choice: Manter a referência ampla aos filhos de Deus dispersos, para além da nação judaica, sem delimitar mais precisamente o grupo.
  alternative: Entender a expressão apenas como judeus da diáspora ou defini-la explicitamente como os eleitos dentre judeus e gentios.
  rationale: O texto contrasta “a nação” com um grupo mais amplo e disperso, mas não explicita aqui todos os contornos de sua identidade. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém a ligação com o versículo anterior. Não foi criada nota para a simples variante de colocação de “somente”, pois ela não altera materialmente o sentido em português.
