    issue: A expressão principal acrescenta “proporcionado” e muda o foco de “sono” para “descanso”.
    rationale: O grego repete/qualifica o campo semântico de dormir/sono; não afirma que o sono proporciona descanso. A expansão não é necessária para a legibilidade.
  - severity: low
    issue: A âncora da nota está após “morte de Lázaro”, embora a nota trate da expressão relativa ao sono.
    rationale: A âncora deve seguir o termo explicado, para que a relação entre texto e nota seja inequívoca.
  revised_text: Jesus tinha falado da morte de Lázaro, mas eles pensaram que ele se referia ao sono.[a]
