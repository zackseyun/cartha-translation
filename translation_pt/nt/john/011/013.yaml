  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: pt
  text: Jesus tinha falado da morte de Lázaro, mas eles pensaram que ele se referia ao sono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “do sono do sono”; isto é, do sono literal, e não da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: tinha falado
  rationale: O mais-que-perfeito grego situa a fala de Jesus antes da interpretação equivocada dos discípulos; a forma composta é natural no português atual.
- source_word: δὲ ... δὲ
  choice: Ø ... mas
  rationale: O primeiro δέ funciona como transição leve e não exige palavra explícita em português; o segundo introduz contraste e é traduzido por “mas”.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: da morte de Lázaro
  rationale: περί com genitivo significa “a respeito de”. O referente de αὐτοῦ no contexto é Lázaro; explicitar o nome evita que “sua morte” seja entendido como a morte de Jesus.
- source_word: ἐκεῖνοι
  choice: eles
  rationale: O demonstrativo retoma os discípulos já mencionados; o pronome é a forma corrente em português.
- source_word: ἔδοξαν
  choice: pensaram
  rationale: No contexto, δοκέω descreve a compreensão equivocada dos discípulos; “pensaram” comunica isso com clareza.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: do descanso proporcionado pelo sono
  rationale: A expressão distingue o sono literal da metáfora da morte. A formulação portuguesa preserva os dois elementos da construção grega sem recorrer ao pouco natural “sono do sono” no texto principal.
- source_word: λέγει
  choice: estivesse falando
  rationale: O presente histórico grego aparece subordinado ao verbo passado ἔδοξαν. O imperfeito do subjuntivo é idiomático após “pensaram que” e expressa o conteúdo atribuído à fala de Jesus.
theological_decisions:
- issue: Se a referência à morte deve sugerir alguma doutrina sobre o estado dos mortos
  choice: Apresentar “morte” como o sentido figurado pretendido por Jesus e “sono” como a interpretação literal dos discípulos, sem ampliação doutrinária.
  alternative: Empregar linguagem que defina a condição da pessoa entre a morte e a ressurreição.
  rationale: O versículo explica um mal-entendido narrativo entre morte e sono literal; não formula uma doutrina do estado intermediário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O nome “Lázaro” é explicitado para impedir uma ambiguidade referencial enganosa em português. A construção grega incomum sobre o sono é vertida de modo natural no texto e representada mais literalmente na nota.
