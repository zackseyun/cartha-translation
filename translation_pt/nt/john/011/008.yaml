id: JHN.11.8
reference: John 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: pt
  text: 'Os discípulos lhe disseram: “Rabi, ainda há pouco os judeus[a] tentavam apedrejá-lo, e vai para lá outra vez?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia” ou, conforme o contexto, “as autoridades judaicas”. João muitas vezes usa “os judeus” para se referir aos adversários de Jesus na Judeia, não ao povo judeu como um todo.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: disseram
  rationale: O presente histórico grego é traduzido naturalmente pelo pretérito perfeito na narrativa em português.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Preserva o título semítico transliterado e a forma de tratamento usada pelos discípulos, sem reduzi-lo a “Mestre”.
- source_word: νῦν
  choice: ainda há pouco
  rationale: No contexto, indica que a tentativa de apedrejamento havia ocorrido recentemente; esta expressão comunica essa proximidade temporal com naturalidade.
- source_word: ἐζήτουν
  choice: tentavam
  rationale: O imperfeito retrata uma ação continuada ou intentada no passado. “Tentavam” é idiomático e adequado diante do infinitivo que expressa o ato pretendido.
- source_word: λιθάσαι
  choice: apedrejá-lo
  rationale: Traduz diretamente o ato de atacar mediante pedras, sem acrescentar “até a morte”, resultado possível, mas não explicitado no grego.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É o equivalente lexical direto. Como em João o termo pode designar mais especificamente judeus da Judeia ou autoridades judaicas hostis, essas possibilidades são registradas em nota sem estreitar o texto principal.
- source_word: πάλιν
  choice: outra vez
  rationale: Equivalente natural de repetição neste contexto interrogativo.
- source_word: ὑπάγεις
  choice: vai
  rationale: Com o advérbio locativo “lá”, o verbo indica ir ao lugar mencionado; “vai” é claro e idiomático em português.
- source_word: ἐκεῖ
  choice: para lá
  rationale: Retoma a Judeia, o lugar de perigo mencionado no contexto.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os judeus da Judeia; as autoridades judaicas
  rationale: Mantém-se no texto a acepção lexical direta, sem transformar uma possível referência contextual a opositores da Judeia em identificação explícita com líderes. A nota evita que a expressão seja entendida necessariamente como referência ao povo judeu inteiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “O senhor vai” torna natural a mudança do vocativo “Rabi” para a pergunta dirigida a Jesus, evitando o pouco corrente “tu vais” e a ambiguidade potencial de “você”. A colocação “apedrejá-lo” segue o padrão formal corrente.
