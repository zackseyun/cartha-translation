  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: pt
  text: Mas, mesmo agora, sei que tudo o que você pedir a Deus, Deus lhe dará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E agora, sei que tudo o que você pedir a Deus, Deus lhe dará.” A conjunção grega pode ser traduzida simplesmente por “e”, embora, neste contexto, também introduza uma ideia de contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Mas, mesmo agora
  rationale: No contexto, καί introduz uma virada concessiva após a menção da morte de Lázaro, enquanto νῦν mantém a força temporal. A formulação é natural em português e preserva ambas.
- source_word: οἶδα
  choice: sei
  rationale: A forma perfeita tem sentido presente e é expressa de modo direto e transparente por “sei”.
- source_word: ὅσα ἂν
  choice: tudo o que
  rationale: A construção relativa com ἄν comunica generalidade indefinida. “Tudo o que” é corrente em português e preserva o alcance aberto.
- source_word: αἰτήσῃ τὸν θεόν
  choice: você pedir a ele
  rationale: αἰτέω traz θεόν como objeto direto, mas, neste contexto, o português idiomático diz “pedir a Deus” ou, evitando repetição pesada, “pedir a ele”. O referente divino permanece inequívoco.
- source_word: δώσει σοι ὁ θεός
  choice: Deus lhe dará
  rationale: Mantém o futuro, o sujeito explícito “Deus” e o sentido direto de δίδωμι. A anteposição do sujeito produz uma frase portuguesa fluente sem alterar a relação sintática essencial.
theological_decisions:
- issue: A fala de Marta distingue Jesus daquele a quem ele pede e poderia ser expandida ou suavizada por razões doutrinárias.
  choice: Preservar a afirmação tal como aparece na fala de Marta, sem explicação cristológica adicional.
  alternative: Substituir “Deus” por “o Pai” ou reformular para evitar uma aparente subordinação.
  rationale: O versículo relata a fala de Marta e mantém uma tensão narrativa própria do Evangelho. A tradução não deve inserir “o Pai”, ausente do texto, nem resolver teologicamente a relação expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” representa o singular dirigido a Jesus; “lhe” e “a ele” mantêm clareza sem recorrer a construções excessivamente solenes.
