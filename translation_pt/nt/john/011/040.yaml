  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: pt
  text: 'Jesus lhe disse: “Eu não lhe disse que, se você crer, verá a glória de Deus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa em português; «lhe» expressa o objeto indireto feminino indicado por αὐτῇ.
- source_word: Οὐκ εἶπόν σοι
  choice: Eu não lhe disse
  rationale: Preserva a pergunta retórica que espera resposta afirmativa. O pronome «Eu» torna natural a ênfase interrogativa, e «lhe disse» corresponde diretamente ao aoristo e ao objeto pessoal.
- source_word: ἐὰν πιστεύσῃς
  choice: se você crer
  rationale: «Crer» mantém a terminologia joanina tradicional e a condição expressa por ἐάν com o subjuntivo, sem acrescentar uma interpretação específica do conteúdo ou da natureza da fé.
- source_word: ὄψῃ
  choice: verá
  rationale: O futuro de ὁράω é expresso de modo direto e idiomático pelo futuro simples em português.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: a glória de Deus
  rationale: «Glória» preserva o sentido teológico e a linguagem consolidada para δόξα; «de Deus» mantém a forma genitiva solene e natural.
theological_decisions:
- issue: Relação entre crer e ver a glória de Deus
  choice: Manter a declaração como promessa condicional dirigida a Marta
  alternative: Explicá-la como princípio geral sobre fé e milagres, ou restringi-la explicitamente à ressurreição de Lázaro
  rationale: O texto formula diretamente uma condição e uma promessa, sem definir aqui seu alcance teológico. A tradução conserva essa tensão e não acrescenta explicações interpretativas.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» para o singular e «lhe» como objeto indireto, evitando tanto arcaísmo quanto coloquialismo excessivo.
