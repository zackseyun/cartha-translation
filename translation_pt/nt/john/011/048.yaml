id: JHN.11.48
reference: John 11:48
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: pt
  text: Se o deixarmos continuar assim, todos crerão nele, e os romanos virão e tirarão tanto o nosso lugar[a] como a nossa nação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso templo”; o grego diz “nosso lugar”, expressão que pode se referir especificamente ao templo ou, de modo mais amplo, ao seu lugar ou à sua posição.
    reason: alternative_reading
  - marker: b
    text: Ou “nosso povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: o deixarmos continuar assim
  rationale: ἀφίημι tem aqui sentido permissivo, “deixar” ou “permitir”. “Continuar assim” expressa em português natural a situação em curso indicada por οὕτως, sem acrescentar uma ação específica.
- source_word: πάντες
  choice: todos
  rationale: O masculino plural tem sentido geral e abrangente; “todos” é a forma natural e direta em português.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: crerão nele
  rationale: A construção joanina πιστεύω εἰς com acusativo indica crer ou depositar fé em alguém. “Crerão nele” preserva essa construção consagrada e seu caráter relacional.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: os romanos virão
  rationale: Tradução direta do futuro de ἔρχομαι com o sujeito explícito οἱ Ῥωμαῖοι.
- source_word: ἀροῦσιν
  choice: tirarão
  rationale: αἴρω significa aqui tirar, remover ou levar embora. “Tirarão” preserva o núcleo lexical sem explicitar “destruirão”, interpretação mais forte que o próprio verbo.
- source_word: τόπον
  choice: lugar
  rationale: τόπος significa literalmente “lugar”. No contexto, pode indicar o templo, o território ou a posição institucional dos líderes; “lugar” conserva essa abertura sem decidir o referente.
- source_word: ἔθνος
  choice: nação
  rationale: ἔθνος pode designar uma nação ou um povo. “Nação” se ajusta ao temor de intervenção romana, enquanto “povo” permanece uma alternativa legítima indicada em nota.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: tanto o nosso lugar como a nossa nação
  rationale: O possessivo é aplicado naturalmente aos dois substantivos, e a construção “tanto... como...” reproduz em português a força correlativa dos dois καί.
theological_decisions:
- issue: Referente de τόπον (“nosso lugar”)
  choice: Manter “lugar” no texto principal
  alternative: “templo” ou “posição”
  rationale: Embora o templo provavelmente esteja incluído no temor dos líderes, o termo grego é mais amplo e pode também envolver seu território ou sua posição institucional. A tradução não resolve uma ambiguidade que o texto preserva.
- issue: Sentido coletivo de ἔθνος
  choice: “nação” no texto principal
  alternative: “povo”
  rationale: O contexto político favorece “nação”, mas o termo também pode se referir ao povo judeu como coletividade; essa alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se o deixarmos continuar assim” é idiomático sem perder a relação entre ἀφῶμεν e οὕτως. Os marcadores foram colocados junto às palavras a que as notas efetivamente se referem.
