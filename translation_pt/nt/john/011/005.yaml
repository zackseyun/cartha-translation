base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: pt
  text: Jesus amava Marta, a irmã dela e Lázaro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: amava
  rationale: O imperfeito de ἀγαπάω descreve naturalmente uma disposição contínua no passado. Em português, “amava” preserva esse aspecto de modo claro e idiomático.
- source_word: δὲ
  choice: não expresso separadamente
  rationale: δέ funciona aqui como conectivo discursivo leve. O português não exige um marcador como “ora” ou “mas”, que poderia sugerir uma força temporal ou adversativa excessiva; a continuidade é suficientemente indicada pelo contexto.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: a irmã dela
  rationale: Reproduz a referência possessiva sem inserir o nome de Maria, que não aparece neste versículo. “Dela” evita a possível ambiguidade de “sua” em português.
- source_word: Μάρθαν
  choice: Marta
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Λάζαρον
  choice: Lázaro
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: καὶ ... καὶ
  choice: vírgula ... e
  rationale: Na enumeração portuguesa, a coordenação natural dos três objetos é expressa por vírgula entre os dois primeiros e “e” antes do último, sem alterar o conteúdo nem a relação entre eles.
theological_decisions:
- issue: Força do imperfeito ἠγάπα quanto ao amor de Jesus
  choice: Declaração simples do amor contínuo de Jesus por Marta, pela irmã dela e por Lázaro
  alternative: Nuance ingressiva (“passou a amar”) ou progressiva enfática (“estava amando”)
  rationale: O imperfeito apresenta mais naturalmente um estado contínuo no passado. “Amava” conserva essa força sem acrescentar afirmações emocionais ou doutrinárias não expressas no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a identidade da irmã implícita, como no grego, e evita um conectivo inicial artificial.
