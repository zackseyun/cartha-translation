source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: pt
  text: 'Então Tomé, chamado Dídimo[a], disse aos outros discípulos: “Vamos também, para morrermos com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dídimo é uma palavra grega que significa “Gêmeo”; o nome Tomé também significa “Gêmeo”.
    reason: Esclarece o significado do cognome grego e o jogo explicativo entre os dois nomes.
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a relação com a fala anterior de Jesus, de modo natural em português.
- source_word: Θωμᾶς
  choice: Tomé
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: chamado Dídimo
  rationale: Translitera o cognome grego e preserva sua forma no texto, explicando seu significado na nota.
- source_word: τοῖς συμμαθηταῖς
  choice: aos outros discípulos
  rationale: Expressa naturalmente que Tomé falou aos demais membros do mesmo grupo de discípulos.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: Vamos também
  rationale: Reproduz a exortação na primeira pessoa do plural e a inclusão enfática de Tomé e dos demais.
- source_word: ἵνα ἀποθάνωμεν
  choice: para morrermos
  rationale: Conserva a relação de finalidade ou resultado pretendido sem acrescentar uma interpretação do tom de Tomé.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: Mantém a expressão simples de associação, cujo referente contextual é Jesus.
theological_decisions:
- issue: Tom e intenção da declaração de Tomé
  choice: Apresentar a exortação de forma direta, sem qualificá-la.
  alternative: Interpretá-la explicitamente como lealdade corajosa, resignação fatalista ou pessimismo irônico.
  rationale: O grego não determina de maneira explícita a atitude psicológica de Tomé; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vamos também” é mais natural na fala direta do que “Vamos nós também”, sem perder a inclusão expressa por καὶ ἡμεῖς.
