id: JHN.11.45
reference: John 11:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: pt
  text: Portanto, muitos dos judeus que tinham ido visitar Maria e viram o que Jesus havia feito creram nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dentre os judeus»; em alguns contextos do Evangelho de João, Ἰουδαῖοι também pode ser traduzido por «judeus da Judeia».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: Portanto, muitos
  rationale: Preserva tanto a quantidade indefinida, mas significativa, quanto a ligação consequencial com a ressurreição de Lázaro narrada anteriormente.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Expressão portuguesa natural que mantém o sentido partitivo de que muitos dentre esse grupo creram; a alternativa «judeus da Judeia» é possível em certos contextos joaninos.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: que tinham ido visitar Maria
  rationale: O particípio atributivo identifica o grupo. «Tinham ido» expressa a anterioridade em relação ao verbo principal, e «visitar» torna natural no contexto o movimento em direção a Maria, sem acrescentar um propósito mais específico.
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: e viram o que Jesus havia feito
  rationale: «Viram» comunica a percepção direta do acontecimento, enquanto «havia feito» preserva sua anterioridade. O nome «Jesus», explícito pelo contexto, evita em português uma sequência potencialmente ambígua de pronomes masculinos.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: creram nele
  rationale: É a forma corrente e concisa de expressar em português a fé pessoal dirigida a Jesus no uso joanino, sem ampliar interpretativamente para «depositaram sua fé».
theological_decisions:
- issue: Sentido de πιστεύω εἰς em contexto joanino
  choice: creram nele
  alternative: confiaram nele
  rationale: «Creram nele» conserva a formulação joanina tradicional e natural em português, sem reduzir a expressão à mera aceitação de uma afirmação nem acrescentar uma definição doutrinária de fé.
- issue: Referente de Ἰουδαῖοι
  choice: judeus
  alternative: judeus da Judeia
  rationale: O contexto imediato descreve pessoas que tinham ido até Maria, sem exigir que a designação seja entendida apenas em sentido geográfico. A nota preserva a alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A explicitação de «Jesus» evita ambiguidade pronominal sem alterar o referente contextual. A nota registra o valor partitivo e a alternativa geográfica de Ἰουδαῖοι.
