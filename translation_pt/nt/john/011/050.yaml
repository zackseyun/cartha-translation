  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: pt
  text: Não consideram que é melhor para vocês que um só homem morra pelo povo[a], e que a nação inteira não pereça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor do povo”; a expressão também pode ter o sentido de “no lugar do povo”.
    reason: alternativa lexical
lexical_decisions:
- source_word: οὐδὲ
  choice: nem
  rationale: Dá continuidade à repreensão negativa do versículo anterior de modo natural em português.
- source_word: λογίζεσθε
  choice: consideram
  rationale: Expressa o ato de ponderar ou calcular, adequado ao contexto de deliberação política e religiosa.
- source_word: συμφέρει ὑμῖν
  choice: é melhor para vocês
  rationale: Comunica com clareza a vantagem pragmática e interessada indicada pelo verbo e pelo dativo.
- source_word: εἷς ἄνθρωπος ἀποθάνῃ
  choice: um só homem morra
  rationale: Preserva a singularidade enfática e o gênero masculino do grego, com construção idiomática em português.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: pelo povo
  rationale: Mantém uma formulação ampla, capaz de abranger benefício, representação e possível sentido substitutivo sem decidir entre eles no texto principal.
- source_word: ὅλον τὸ ἔθνος
  choice: a nação inteira
  rationale: Refere-se ao conjunto nacional e político; a formulação é clara e natural em português.
- source_word: ἀπόληται
  choice: perecer
  rationale: Preserva a gravidade da ruína ou destruição sem especificar além do que o grego afirma.
theological_decisions:
- issue: Sentido de ὑπέρ em relação à morte de Jesus
  choice: pelo povo
  alternative: em favor do povo; no lugar do povo
  rationale: Caifás fala de conveniência política, enquanto o evangelista apresentará suas palavras como profecia involuntária. A tradução ampla conserva tanto o sentido imediato quanto a ressonância sacrificial e possivelmente substitutiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O início em minúscula pressupõe continuidade sintática com o versículo anterior; “vocês” torna explícito o plural de ὑμῖν.
