  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: pt
  text: 'Depois de dizer essas coisas, ele lhes disse: “Nosso amigo Lázaro adormeceu, mas vou para acordá-lo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Depois de dizer essas coisas
  rationale: Reproduz a referência plural ao discurso anterior e a sequência temporal em português natural, sem repetir de modo pesado “e, depois disso”.
- source_word: λέγει αὐτοῖς
  choice: ele lhes disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa; “lhes” preserva o objeto indireto.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Nosso amigo Lázaro
  rationale: Ordem idiomática em português que mantém tanto a relação afetiva quanto o nome próprio.
- source_word: κεκοίμηται
  choice: adormeceu
  rationale: Preserva a metáfora intencional do sono para a morte e permite que o mal-entendido posterior dos discípulos permaneça narrativamente eficaz. O perfeito grego apresenta o estado resultante de ter adormecido; em português, “adormeceu” é natural neste contexto.
- source_word: ἀλλὰ πορεύομαι
  choice: mas vou até lá
  rationale: “Mas” mantém o contraste. “Vou até lá” expressa o movimento intencional rumo ao lugar onde Lázaro está e soa mais natural que o simples “vou” em português.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: para acordá-lo
  rationale: O infinitivo introduzido por “para” comunica com clareza a finalidade de ἵνα com o subjuntivo, e “acordá-lo” mantém a imagem do sono.
theological_decisions:
- issue: Se κεκοίμηται deve ser traduzido interpretativamente como “morreu” ou metaforicamente como “adormeceu”
  choice: Preservar “adormeceu” no texto principal
  alternative: “morreu”
  rationale: Jesus emprega deliberadamente a imagem do sono, que os discípulos entendem literalmente nos versículos seguintes. Traduzir desde já por “morreu” eliminaria a ambiguidade e enfraqueceria a progressão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita literalismo rígido sem apagar a metáfora central. Não se inclui nota no marcador indicado pela camada inglesa, pois ali o marcador parece estar ligado por engano a “essas coisas”; se fosse necessária uma nota explicativa, ela deveria acompanhar “adormeceu”.
