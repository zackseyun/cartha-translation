id: JHN.11.10
reference: John 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: pt
  text: Mas, se alguém anda de noite, tropeça, porque a luz não está nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a luz não está com ele”. O grego diz literalmente “nele”, o que pode sugerir mais do que a ausência de luz externa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: Mas, se alguém
  rationale: Preserva o contraste introduzido por δέ, a condição de ἐάν e o sentido genérico de τις em português natural.
- source_word: περιπατῇ
  choice: anda
  rationale: Mantém a imagem concreta de caminhar e permite sua ressonância metafórica sem explicitá-la indevidamente.
- source_word: ἐν τῇ νυκτί
  choice: de noite
  rationale: Expressão corrente em português para o período noturno; conserva a imagem da noite sem substituí-la interpretativamente por “trevas”.
- source_word: προσκόπτει
  choice: tropeça
  rationale: Equivalente natural que preserva tanto o sentido físico quanto a possível dimensão figurada.
- source_word: ὅτι τὸ φῶς
  choice: porque a luz
  rationale: “Porque” expressa claramente a relação causal, e o artigo definido mantém a referência determinada de τὸ φῶς.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: não está nele
  rationale: Traduz diretamente ἐν αὐτῷ e preserva a possível profundidade joanina da luz interior, sem reduzir a frase à mera ausência de iluminação externa.
theological_decisions:
- issue: Referência e força de “a luz não está nele”
  choice: Manter a formulação interior “não está nele”.
  alternative: “a luz não está com ele”, entendida apenas como falta de iluminação externa.
  rationale: A preposição grega ἐν significa naturalmente “em”. A formulação conserva a tensão entre a imagem concreta de caminhar à noite e uma possível dimensão espiritual, sem decidir por apenas uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De noite” soa mais natural do que “na noite”, enquanto “não está nele” preserva deliberadamente a formulação e a ambiguidade do grego.
