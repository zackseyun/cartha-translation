id: JHN.11.32
reference: John 11:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: pt
  text: 'Então, quando Maria chegou ao lugar onde Jesus estava e o viu, prostrou-se aos pés dele, dizendo: “Senhor,[a] se estivesses aqui, meu irmão não teria morrido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ter esse sentido, embora “Senhor” também preserve a importância que o título assume na apresentação de Jesus neste Evangelho.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa a partir do contexto anterior; “Então” é natural em português e mantém a força conectiva.
- source_word: ὡς ἦλθεν
  choice: quando chegou
  rationale: A conjunção temporal ὡς com o aoristo introduz a circunstância da chegada de Maria; “quando chegou” é claro e idiomático.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: ao lugar onde Jesus estava
  rationale: Explicita naturalmente em português o destino implicado pelo verbo de movimento, sem alterar o sentido locativo.
- source_word: ἰδοῦσα αὐτόν
  choice: e o viu
  rationale: O particípio circunstancial é vertido por verbo finito coordenado, preservando a sequência e produzindo português natural.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: prostrou-se aos pés dele
  rationale: A expressão descreve cair diante de alguém, aos seus pés. “Prostrou-se” comunica com naturalidade o gesto, sem exigir que se determine se foi adoração, súplica ou colapso emocional.
- source_word: λέγουσα αὐτῷ
  choice: dizendo
  rationale: O particípio presente introduz a fala de Maria; o destinatário já está claro pelo contexto, de modo que “dizendo” evita repetição desnecessária.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” preserva tanto a forma respeitosa de tratamento quanto a possível densidade cristológica do vocábulo no Evangelho de João.
- source_word: εἰ ἦς ὧδε
  choice: se estivesses aqui
  rationale: O imperfeito na condição contrária ao fato passado é expresso idiomaticamente em português pelo imperfeito do subjuntivo.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: não teria morrido
  rationale: A combinação de ἄν com o aoristo exprime o resultado irreal no passado, adequadamente representado pelo futuro do pretérito composto.
- source_word: μου ὁ ἀδελφός
  choice: meu irmão
  rationale: O genitivo μου é possessivo e corresponde naturalmente a “meu irmão”.
theological_decisions:
- issue: Sentido de Κύριε na fala de Maria dirigida a Jesus
  choice: Senhor
  alternative: Senhor, como forma respeitosa equivalente a “senhor” ou “mestre”
  rationale: A tradução “Senhor” conserva a ambiguidade entre tratamento respeitoso e reconhecimento de maior peso teológico, sem reduzir a fala à mera cortesia nem afirmar além do que o termo isoladamente exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da narrativa foi preservada sem rigidez sintática; “prostrou-se aos pés dele” comunica o gesto grego com naturalidade, e a nota mantém aberta a nuance de Κύριε.
