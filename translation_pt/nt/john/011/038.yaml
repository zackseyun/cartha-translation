  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: pt
  text: Então, Jesus, novamente, profundamente comovido em seu íntimo[a], foi até o túmulo. Era uma gruta, e uma pedra estava colocada contra a entrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “indignado em seu íntimo” ou “profundamente perturbado em seu íntimo”; o verbo grego é excepcionalmente forte e pode indicar mais do que apenas tristeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão narrativa e a ligação com a cena anterior de modo natural em português.
- source_word: πάλιν
  choice: novamente
  rationale: Assinala a repetição da intensa reação emocional de Jesus já mencionada no contexto.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: profundamente comovido em seu íntimo
  rationale: Preserva a intensidade e a interioridade da reação sem determinar se a emoção é apenas tristeza, perturbação ou indignação; as nuances mais fortes ficam registradas na nota.
- source_word: ἔρχεται
  choice: foi
  rationale: Converte o presente histórico grego em passado narrativo natural em português; com 'até o túmulo', expressa claramente o movimento indicado pelo verbo e pela preposição.
- source_word: μνημεῖον
  choice: túmulo
  rationale: Designa um lugar de sepultamento e corresponde à descrição subsequente de uma gruta fechada por uma pedra.
- source_word: σπήλαιον
  choice: gruta
  rationale: '''Gruta'' descreve naturalmente em português um sepulcro escavado ou situado numa cavidade rochosa.'
- source_word: λίθος
  choice: pedra
  rationale: É o equivalente corrente e adequado para a pedra que fechava o sepulcro.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: estava colocada contra a entrada
  rationale: Explicita o referente prático da posição da pedra numa gruta. 'Contra' preserva a ideia de que ela bloqueava a abertura, sem sugerir necessariamente uma superfície horizontal.
theological_decisions:
- issue: Força emocional de ἐμβριμώμενος aplicada a Jesus
  choice: Jesus é apresentado como profundamente comovido em seu íntimo, sem especificar uma única emoção.
  alternative: Jesus estava indignado em seu íntimo; ou estava profundamente perturbado em seu íntimo.
  rationale: O verbo grego é excepcionalmente forte e pode incluir indignação ou intensa perturbação. A formulação principal mantém a tensão interpretativa, enquanto a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência narrativa, e 'entrada' foi explicitado para comunicar naturalmente a configuração da gruta em português.
