id: JHN.11.25
reference: John 11:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: pt
  text: 'Jesus lhe disse: “Eu sou a ressurreição e a vida. Quem crê em mim, ainda que morra, viverá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: lhe disse
  rationale: Expressa naturalmente em português o verbo de fala e o objeto indireto feminino, cujo referente contextual é Marta.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Preserva o pronome explícito e enfático com a cópula, sem diluir o possível peso revelatório da formulação joanina.
- source_word: ἡ ἀνάστασις
  choice: a ressurreição
  rationale: Neste contexto, refere-se à ressurreição dentre os mortos; o artigo e a identificação predicativa direta são mantidos.
- source_word: ἡ ζωή
  choice: a vida
  rationale: Mantém o artigo e o paralelismo enfático com “a ressurreição”.
- source_word: ὁ πιστεύων
  choice: Quem crê
  rationale: Construção portuguesa natural e inclusiva que comunica o valor genérico do particípio substantivado singular sem transformar a expressão em plural.
- source_word: εἰς ἐμέ
  choice: em mim
  rationale: É a formulação idiomática portuguesa para πιστεύω com εἰς e preserva o sentido relacional de confiança.
- source_word: κἂν ἀποθάνῃ
  choice: ainda que morra
  rationale: Traduz de modo conciso a condição concessiva e conserva o singular genérico, sem acrescentar um pronome marcado por gênero.
- source_word: ζήσεται
  choice: viverá
  rationale: Preserva a amplitude da promessa futura sem explicitar “de novo” ou “voltará à vida”, elementos não expressos diretamente no grego.
theological_decisions:
- issue: Masculino singular representativo em ὁ πιστεύων e nas formas verbais seguintes
  choice: Quem crê em mim, ainda que morra, viverá
  alternative: Aquele que crê em mim, mesmo que morra, viverá
  rationale: “Quem” preserva o referente singular genérico e sua abrangência sem impor em português um masculino lexical desnecessário; as formas verbais singulares mantêm a estrutura do grego.
- issue: Alcance da autoidentificação Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Eu sou a ressurreição e a vida
  alternative: Eu dou a ressurreição e a vida
  rationale: Mantém a afirmação predicativa direta e sua força cristológica, sem reduzi-la a uma paráfrase funcional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhe disse” é natural e fiel ao dativo feminino no contexto; “ainda que morra” conserva a concessão em registro bíblico atual, sem soar arcaico.
