  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: pt
  text: 'Depois disso, ele diz aos discípulos: “Vamos novamente para a Judeia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: Depois disso
  rationale: As duas expressões marcam a sequência temporal. Em português, “Depois disso” comunica naturalmente essa progressão sem a redundância pouco idiomática de “Então, depois disso”.
- source_word: λέγει
  choice: ele diz
  rationale: Preserva o presente histórico característico da narrativa de João e sua vivacidade, em vez de uniformizá-lo como passado.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: Traduz diretamente o objeto indireto, sem acrescentar “seus”, que está implícito no contexto, mas não aparece no grego.
- source_word: Ἄγωμεν
  choice: Vamos
  rationale: Reproduz de modo natural o subjuntivo exortativo da primeira pessoa do plural, pelo qual Jesus convida o grupo a partir com ele.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: para a Judeia
  rationale: Em português, “ir para a Judeia” é a construção direcional natural e pode expressar movimento ao destino; “entrar na Judeia” seria explícito demais.
- source_word: πάλιν
  choice: novamente
  rationale: Indica o retorno a uma região visitada antes e mantém posição natural junto ao complemento direcional.
theological_decisions:
- issue: Presente histórico na narrativa joanina
  choice: Manter “ele diz”
  alternative: 'Regularizar para o passado: “ele disse”'
  rationale: A manutenção do presente reflete o estilo narrativo grego de João sem introduzir interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A aparente duplicação temporal de ἔπειτα μετὰ τοῦτο foi condensada idiomaticamente em “Depois disso”, preservando a sequência narrativa.
