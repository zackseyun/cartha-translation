  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: pt
  text: Mas alguns deles foram até os fariseus e lhes contaram o que Jesus tinha feito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhes relataram o que Jesus fez”. O grego não declara explicitamente qual era a intenção dos que foram até os fariseus.'
    reason: Alternativa lexical e preservação da ambiguidade narrativa.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mas alguns deles
  rationale: Expressa naturalmente o contraste com os que creram no versículo anterior e identifica um subconjunto do grupo, sem acrescentar uma caracterização de suas intenções.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: foram até os fariseus
  rationale: Traduz o movimento em direção aos fariseus em português corrente; o contexto já torna desnecessário explicitar separadamente a ideia de afastamento contida no verbo.
- source_word: εἶπαν αὐτοῖς
  choice: lhes contaram
  rationale: No contexto narrativo, comunica de modo idiomático que transmitiram uma informação aos fariseus, sem atribuir denúncia, acusação ou hostilidade.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: o que Jesus tinha feito
  rationale: A expressão relativa é vertida naturalmente por “o que”; o mais-que-perfeito composto deixa clara a anterioridade da ação de Jesus em relação ao relato.
theological_decisions:
- issue: Intenção dos que procuraram os fariseus
  choice: 'Linguagem neutra de comunicação: “lhes contaram”'
  alternative: “denunciaram Jesus” ou “informaram contra Jesus”
  rationale: O grego informa a ida e o relato, mas não declara explicitamente o motivo dessas pessoas. A tradução preserva essa abertura narrativa, embora o contexto subsequente possa sugerir consequências hostis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fariseus” permanece em minúscula, conforme o uso corrente para grupos religiosos; “lhes contaram” evita tanto rigidez excessiva quanto interpretação indevida do motivo.
