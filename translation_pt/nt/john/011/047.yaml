  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: pt
  text: 'Por isso, os chefes dos sacerdotes e os fariseus reuniram um conselho[a] e diziam: “O que estamos fazendo? Pois este homem realiza muitos sinais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Sinédrio”, o conselho governante judaico.'
    reason: Registra a designação técnica tradicional do órgão provavelmente referido por συνέδριον, sem a impor no texto principal.
lexical_decisions:
- source_word: συνήγαγον
  choice: convocaram
  rationale: O aoristo ativo indica a ação de reunir formalmente o conselho; “convocaram” é natural em português e adequado ao contexto institucional.
- source_word: οὖν
  choice: Por isso
  rationale: Expressa a consequência narrativa e lógica dos acontecimentos anteriores sem tornar a inferência excessivamente formal.
- source_word: ἀρχιερεῖς
  choice: chefes dos sacerdotes
  rationale: Designa as principais autoridades sacerdotais, não vários sumos sacerdotes simultaneamente; a expressão é clara e corrente.
- source_word: Φαρισαῖοι
  choice: fariseus
  rationale: Forma tradicional e amplamente reconhecida em português para o grupo judaico.
- source_word: συνέδριον
  choice: o Conselho
  rationale: No contexto, refere-se provavelmente ao conselho governante judaico. “Conselho” traduz o sentido institucional, enquanto a nota preserva a designação tradicional “Sinédrio”.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito preserva a ação discursiva em andamento ou reiterada, em vez de reduzi-la necessariamente a uma única fala pontual.
- source_word: Τί ποιοῦμεν
  choice: O que estamos fazendo?
  rationale: Mantém o presente indicativo do grego e transmite a inquietação dos participantes diante da própria inação ou insuficiência.
- source_word: ὅτι
  choice: Este homem realiza muitos sinais
  rationale: A relação causal é clara em português pela justaposição após a pergunta; omitir um “porque” inicial evita uma construção menos natural sem perder o vínculo argumentativo.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: Este homem
  rationale: Preserva a referência masculina e o possível tom distanciado ou depreciativo dos falantes.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: realiza muitos sinais
  rationale: “Realiza” é idiomático para obras extraordinárias, e “sinais” conserva a terminologia teologicamente significativa de João sem explicá-la como “milagres”.
theological_decisions:
- issue: Tradução de σημεῖα no contexto joanino
  choice: sinais
  alternative: milagres; sinais milagrosos
  rationale: Em João, os feitos de Jesus apontam para sua identidade e missão. “Sinais” preserva essa função reveladora sem acrescentar interpretação ao texto.
- issue: Identificação de συνέδριον
  choice: o Conselho
  alternative: um conselho; o Sinédrio
  rationale: O contexto favorece o conselho governante judaico específico. O texto principal traduz o termo de modo compreensível, e a nota registra o nome técnico tradicional sem encerrar toda possível nuance lexical.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem e o aspecto verbal do grego foram preservados quando naturais; a terminologia joanina “sinais” foi mantida.
