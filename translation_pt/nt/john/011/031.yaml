  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: pt
  text: Então, os judeus[a] que estavam com ela na casa e a consolavam, ao verem que Maria se levantou depressa e saiu, seguiram-na, pensando que ela ia ao túmulo para chorar ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeanos”. Em João, Ἰουδαῖοι pode às vezes referir-se mais especificamente aos habitantes da Judeia ou às autoridades judaicas; aqui, porém, designa o grupo que acompanhava Maria no luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Então, ... os judeus
  rationale: οὖν marca a progressão narrativa e é vertido naturalmente por “Então”. Ἰουδαῖοι designa aqui o grupo de judeus que acompanhava Maria no luto; a possível nuance geográfica é preservada em nota.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: que estavam com ela em casa
  rationale: A oração identifica o grupo em questão; “em casa” é uma forma natural e fiel de expressar ἐν τῇ οἰκίᾳ neste contexto.
- source_word: παραμυθούμενοι αὐτήν
  choice: consolando-a
  rationale: O verbo denota oferecer consolo, especialmente apropriado ao contexto de luto. “Consolando-a” é corrente, claro e digno.
- source_word: ἰδόντες
  choice: quando ... viram
  rationale: O particípio aoristo é expresso como oração temporal, preservando de modo natural a sequência dos acontecimentos.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: se levantou depressa e saiu
  rationale: ἀνέστη indica aqui levantar-se, não ressurreição; “depressa” comunica diretamente ταχέως, e “saiu” corresponde a ἐξῆλθεν.
- source_word: ἠκολούθησαν αὐτῇ
  choice: seguiram-na
  rationale: Refere-se ao ato físico de seguir Maria, sem exigir neste contexto a nuance de discipulado.
- source_word: δόξαντες
  choice: pensando
  rationale: O particípio expressa a suposição ou inferência feita pelo grupo; “pensando” é natural sem acrescentar certeza ao texto.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: ela ia ao túmulo
  rationale: O presente grego no discurso indireto é vertido naturalmente pelo imperfeito português “ia”; μνημεῖον é “túmulo” no contexto funerário joanino.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: para chorar ali
  rationale: A construção com ἵνα expressa propósito, comunicado com clareza pela oração infinitiva portuguesa.
theological_decisions:
- issue: Sentido de Ἰουδαῖοι na narrativa joanina
  choice: judeus
  alternative: judeanos
  rationale: O termo é sensível ao contexto em João. Neste versículo, refere-se especificamente às pessoas que estavam na casa consolando Maria, não ao povo judeu de modo abrangente nem necessariamente às autoridades. A tradução direta “judeus” fica no texto, enquanto “judeanos” é preservado como alternativa lexical em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A estrutura foi ajustada para evitar ambiguidade quanto ao sujeito de “viram”, mantendo a ordem narrativa e todas as relações do grego.
