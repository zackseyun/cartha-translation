id: JHN.11.27
reference: John 11:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: pt
  text: 'Ela lhe disse: “Sim, Senhor; eu creio que tu és o Messias, o Filho de Deus, aquele que vem ao mundo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Ela lhe disse
  rationale: O presente histórico grego é expresso pelo passado, forma natural na narrativa em português; o sujeito feminino é recuperado do contexto, referindo-se a Marta.
- source_word: Ναί
  choice: Sim
  rationale: Equivalente afirmativo direto e natural no diálogo.
- source_word: κύριε
  choice: Senhor
  rationale: Preserva a forma de tratamento reverente e sua possível força teológica no contexto da confissão de Marta.
- source_word: πεπίστευκα
  choice: tenho crido
  rationale: 'O pretérito perfeito composto procura conservar o valor resultativo do perfeito grego: uma fé já assumida que permanece no presente.'
- source_word: ὁ χριστός
  choice: o Messias
  rationale: Traduz o sentido do título grego, em vez de apenas transliterá-lo, e preserva seu contexto judaico.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Reproduz de modo direto e tradicional o título cristológico definido.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: aquele que vem ao mundo
  rationale: Expressa naturalmente em português o particípio presente substantivado e mantém sua caracterização de Jesus como o esperado que vem ao mundo.
- source_word: κόσμον
  choice: mundo
  rationale: É o equivalente natural de κόσμος neste contexto joanino.
theological_decisions:
- issue: Tradução de Χριστός como título confessional
  choice: Messias
  alternative: Cristo
  rationale: Aqui a palavra funciona claramente como título e identifica Jesus como o esperado; “Messias” torna esse sentido perceptível sem acrescentar uma interpretação denominacional.
- issue: Força de κύριε na fala de Marta
  choice: Senhor
  alternative: senhor, no sentido de tratamento respeitoso
  rationale: O contexto confessional favorece a forma reverente “Senhor”, embora o vocativo grego também possa funcionar como tratamento respeitoso; a tradução não explicita além do texto qual nuance predomina.
- issue: Valor aspectual de πεπίστευκα
  choice: tenho crido
  alternative: creio; passei a crer
  rationale: A escolha procura preservar a convicção estabelecida anteriormente e ainda vigente, sem reduzir o perfeito a um simples presente nem impor explicitamente o início do ato de crer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “tu” para refletir a segunda pessoa singular enfática de σὺ e evita notas desnecessárias, pois as alternativas relevantes são registradas nas decisões editoriais.
