id: JHN.11.2
reference: John 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: pt
  text: Era Maria quem tinha ungido o Senhor com perfume[a] e enxugado os pés dele com os próprios cabelos. O irmão dela, Lázaro, estava doente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com unguento perfumado» ou «com óleo aromático»; o termo grego se refere a óleo ou unguento perfumado.
    reason: Alternativa lexical para μύρον, cujo campo semântico inclui perfume, óleo aromático e unguento perfumado.
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Era Maria
  rationale: A construção identifica Maria e a conecta ao contexto; em português, «Era Maria» preserva naturalmente essa força sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἡ ἀλείψασα
  choice: quem tinha ungido
  rationale: O artigo com o particípio aoristo descreve e identifica Maria. A forma «tinha ungido» apresenta o ato como anterior à enfermidade mencionada na oração principal e soa natural em português.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Preserva o título narrativo e teológico aplicado a Jesus, sem reduzi-lo ao sentido meramente social de «mestre» ou «senhor».
- source_word: μύρῳ
  choice: com perfume
  rationale: O termo designa óleo ou unguento perfumado. «Perfume» é claro e corrente; a nota registra alternativas que explicitam a natureza oleosa da substância.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: e enxugado os pés dele
  rationale: ἐκμάσσω indica enxugar ou secar. «Enxugado» expressa com precisão a ação nesse contexto.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: com os próprios cabelos
  rationale: O dativo é instrumental. «Os próprios cabelos» deixa claro, de maneira idiomática, que eram os cabelos de Maria.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: O irmão dela, Lázaro
  rationale: A relação genitiva é mantida em uma nova frase para evitar uma oração relativa longa e ambígua em português, sem alterar a referência a Maria.
- source_word: ἠσθένει
  choice: estava doente
  rationale: Neste contexto, ἀσθενέω se refere a enfermidade física; «estava doente» é preciso e natural.
theological_decisions:
- issue: Tradução de κύριος aplicado a Jesus
  choice: o Senhor
  alternative: o mestre
  rationale: «Senhor» conserva o peso honorífico, narrativo e teológico do termo no Evangelho de João, sem impor uma leitura meramente social.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A divisão em duas frases evita que uma oração relativa extensa pareça modificar «cabelos» ou «pés». «Os próprios cabelos» é natural e reforça corretamente a referência reflexiva, sem acrescentar conteúdo substantivo.
