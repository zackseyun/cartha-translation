  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: pt
  text: 'Jesus lhe diz: “Seu irmão ressuscitará[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se levantará”. O verbo grego pode significar simplesmente “levantar-se”; neste contexto, refere-se a levantar-se dentre os mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico da narrativa joanina, que é natural em português e preserva a vivacidade do grego.
- source_word: αὐτῇ
  choice: lhe
  rationale: O pronome dativo é representado de modo idiomático como objeto indireto de “diz”.
- source_word: Ἀναστήσεται
  choice: ressuscitará
  rationale: Neste contexto, o futuro de ἀνίστημι se refere a levantar-se dentre os mortos. “Ressuscitará” comunica isso com clareza sem transformar a forma em passiva nem explicitar um agente não mencionado.
- source_word: ὁ ἀδελφός σου
  choice: seu irmão
  rationale: Tradução portuguesa corrente da construção possessiva; no contexto, refere-se ao irmão de Marta, Lázaro.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: O nome próprio é vertido em sua forma portuguesa convencional; o artigo grego não precisa ser reproduzido.
theological_decisions:
- issue: Formulação da ressurreição
  choice: ressuscitará
  alternative: se levantará; será ressuscitado
  rationale: “Ressuscitará” expressa o sentido contextual sem determinar se Jesus se refere aqui à restauração imediata de Lázaro ou à ressurreição futura. Evita-se “será ressuscitado”, que tornaria explícita uma voz passiva e destacaria uma agência que a forma grega não apresenta dessa maneira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico foi preservado. A colocação pronominal “lhe diz” é corrente e evita explicitar novamente Marta, já identificada pelo contexto.
