id: JHN.11.4
reference: John 11:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: pt
  text: 'Mas, ao ouvir isso, Jesus disse: “Esta enfermidade não tem a morte como fim[a], mas visa à glória de Deus, para que, por meio dela, o Filho de Deus seja glorificado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conduz à morte”. A expressão grega pode indicar que a morte não é o desfecho definitivo nem o propósito da enfermidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Mas, ao ouvir isso, Jesus
  rationale: O particípio aoristo apresenta a circunstância anterior à fala; “ao ouvir isso” é natural em português e explicita pelo contexto que Jesus ouviu a notícia. δέ marca uma transição com leve contraste, adequadamente representada por “Mas”.
- source_word: ἀσθένεια
  choice: enfermidade
  rationale: Termo corrente e digno para a condição de Lázaro, sem especificar uma doença concreta nem soar excessivamente clínico.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: não tem a morte como fim
  rationale: 'πρός com o acusativo pode indicar fim ou resultado. A formulação preserva a tensão narrativa: Lázaro morre, mas a morte não é o desfecho definitivo nem o propósito último da enfermidade.'
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: visa à glória de Deus
  rationale: Neste contexto, ὑπέρ expressa finalidade ou benefício. “Visa à” comunica essa orientação de modo natural, sem confundi-la com a expressão anterior sobre o fim da enfermidade.
- source_word: ἵνα δοξασθῇ
  choice: para que ... seja glorificado
  rationale: Mantém a oração de finalidade introduzida por ἵνα e a voz passiva de δοξασθῇ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Tradução consagrada, precisa e clara do título cristológico.
- source_word: δι’ αὐτῆς
  choice: por meio dela
  rationale: διά com genitivo indica meio; o pronome feminino retoma claramente “enfermidade”.
theological_decisions:
- issue: Sentido de “οὐκ ἔστιν πρὸς θάνατον” diante da morte posterior de Lázaro
  choice: A morte não é o fim ou desfecho definitivo da enfermidade.
  alternative: Uma previsão absoluta de que Lázaro não morreria, ou apenas a afirmação clínica de que a doença não era fatal.
  rationale: O contexto posterior afirma que Lázaro morreu. A tradução conserva o valor final/resultativo de πρός e a tensão do relato sem negar a morte nem explicar antecipadamente toda a narrativa.
- issue: Relação entre a glória de Deus e a glorificação do Filho de Deus
  choice: 'Manter distintas as duas afirmações: a enfermidade visa à glória de Deus e, por meio dela, o Filho é glorificado.'
  alternative: Fundir ambas em uma declaração geral sobre a glória divina.
  rationale: O grego apresenta as duas formulações em relação de finalidade. Preservá-las mantém a ênfase cristológica do texto sem acrescentar uma elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Enfermidade” permite a retomada feminina em “por meio dela”; “não tem a morte como fim” preserva a ambiguidade teleológica relevante sem recorrer ao pouco natural “não é para a morte”.
