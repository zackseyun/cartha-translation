lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: chorou
  rationale: Aoristo ativo do indicativo, terceira pessoa do singular, de δακρύω, verbo que denota derramar lágrimas. “Chorou” é a forma mais natural, concisa e digna em português, sem impor valor ingressivo ao aoristo nem sugerir, por si só, lamentação ruidosa.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Nome próprio articulado que funciona como sujeito. Em português, o nome aparece naturalmente sem artigo neste contexto narrativo.
theological_decisions:
- issue: Descrição da emoção de Jesus
  choice: Jesus chorou
  alternative: Jesus derramou lágrimas
  rationale: A tradução expressa diretamente a emoção humana genuína de Jesus, sem minimizá-la nem ampliá-la para um pranto ruidoso. A formulação preserva a simplicidade e a tensão do relato sem acrescentar explicação doutrinária ao texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A frase mantém a concisão marcante do original grego; a nota registra a precisão lexical sem tornar o texto principal artificial.
