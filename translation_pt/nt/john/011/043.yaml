  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: pt
  text: 'E, depois de dizer essas coisas, ele gritou em alta voz: “Lázaro, venha para fora!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “Lázaro, venha aqui para fora!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural é mantido de modo explícito, embora em português também fosse natural condensá-lo como “isso”.
- source_word: εἰπὼν
  choice: depois de dizer
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a formulação expressa essa sequência com naturalidade.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressa idiomaticamente o dativo de modo e conserva a ênfase no volume da voz.
- source_word: ἐκραύγασεν
  choice: gritou
  rationale: O verbo denota um brado forte; “gritou” é direto, atual e adequado ao contexto, sem duplicação desnecessária de “clamou em alta voz”.
- source_word: Λάζαρε
  choice: Lázaro
  rationale: Emprega a forma portuguesa convencional do nome próprio no vocativo.
- source_word: δεῦρο ἔξω
  choice: venha para fora
  rationale: δεῦρο funciona como chamado imperativo, e ἔξω indica movimento para fora. A expressão escolhida é clara e natural no português moderno.
theological_decisions:
- issue: Formulação da ordem que acompanha o milagre
  choice: venha para fora
  alternative: venha aqui para fora
  rationale: A forma principal comunica diretamente a ordem sem arcaísmo nem ampliação teológica. A alternativa mais literal explicita o valor dêitico de δεῦρο.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ele” torna explícito o sujeito já presente no contexto, e a ordem usa o imperativo de terceira pessoa, corrente no português brasileiro.
