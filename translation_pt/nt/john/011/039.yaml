  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: pt
  text: 'Jesus disse: “Tirem a pedra.” Marta, irmã daquele que havia morrido[a], disse-lhe: “Senhor, a esta altura ele já cheira mal[b], pois está morto há quatro dias[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do falecido”.
    reason: lexical_alternative
  - marker: b
    text: Ou “já fede”; o verbo grego significa emitir odor e, neste contexto, indica mau cheiro.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pois ele é de quatro dias”, isto é, já se passaram quatro dias desde sua morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: Tirem a pedra
  rationale: O imperativo aoristo plural ordena às pessoas presentes que removam a pedra. “Tirem a pedra” é direto, natural e mantém o número plural do verbo grego.
- source_word: τοῦ τετελευτηκότος
  choice: daquele que havia morrido
  rationale: O particípio perfeito de τελευτάω apresenta a pessoa que morreu e permanece nesse estado. A formulação é natural em português e preserva o valor verbal do grego.
- source_word: Κύριε
  choice: Senhor
  rationale: “Senhor” conserva tanto o tratamento respeitoso quanto o possível peso cristológico de κύριε no Evangelho de João, sem decidir além do que o contexto afirma.
- source_word: ἤδη ὄζει
  choice: a esta altura ele já cheira mal
  rationale: ἤδη indica que a condição já existe naquele momento, e ὄζει significa emitir odor; no contexto de um morto há quatro dias, trata-se claramente de mau cheiro.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: pois está morto há quatro dias
  rationale: A expressão adjetival grega é literalmente algo como “pois ele é de quatro dias”. A tradução explicita de modo idiomático que se contam quatro dias desde a morte, preservando a função explicativa de γάρ.
theological_decisions:
- issue: Sentido de κύριε na fala de Marta
  choice: Senhor
  alternative: senhor, como mero tratamento respeitoso
  rationale: A mesma forma grega pode funcionar como tratamento cortês ou como título de maior peso. “Senhor” preserva essa amplitude em português e se harmoniza com o uso joanino sem impor uma interpretação confessional específica neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural “Tirem” reproduz o destinatário coletivo do imperativo grego. “A esta altura” comunica naturalmente a força temporal de ἤδη, e “cheira mal” evita tanto o eufemismo excessivo quanto a coloquialidade mais forte de “fede”.
