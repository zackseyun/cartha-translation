  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: pt
  text: 'Marta lhe disse: “Eu sei que ele ressuscitará na ressurreição, no último dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito perfeito é a forma mais natural de introduzir uma fala na narrativa em português moderno.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo indica o destinatário da fala; “lhe disse” é uma formulação natural e concisa.
- source_word: ἡ Μάρθα
  choice: Marta
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Οἶδα
  choice: Eu sei
  rationale: Expressa diretamente o conhecimento seguro afirmado por Marta, sem intensificar o sentido para “tenho certeza”.
- source_word: ἀναστήσεται
  choice: ressuscitará
  rationale: No contexto de alguém morto que voltará à vida, “ressuscitará” reproduz naturalmente o futuro com sentido intransitivo, sem convertê-lo em passivo.
- source_word: ἐν τῇ ἀναστάσει
  choice: na ressurreição
  rationale: Preserva a construção grega e sua possível nuance temporal ou de âmbito, além de manter a repetição de linguagem ligada à ressurreição.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: no último dia
  rationale: É a expressão temporal idiomática em português e corresponde de modo claro à referência escatológica.
theological_decisions:
- issue: Referência à ressurreição escatológica
  choice: Marta se refere à futura ressurreição “no último dia”.
  alternative: Uma esperança genérica de vida depois da morte.
  rationale: A combinação de ἀναστήσεται, ἀνάστασις e “último dia” aponta especificamente para a ressurreição futura, sem exigir que a tradução acrescente pormenores doutrinários ausentes do versículo.
- issue: Relação sintática entre “ressurreição” e “último dia”
  choice: “na ressurreição, no último dia”
  alternative: “na ressurreição do último dia” ou “quando houver a ressurreição no último dia”
  rationale: A formulação conserva as duas expressões preposicionais sucessivas do grego e evita explicitar além do texto se “no último dia” qualifica diretamente a ressurreição ou funciona como indicação temporal mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição “ressuscitará na ressurreição” foi mantida por refletir deliberadamente o texto grego e sua ênfase.
