  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: pt
  text: 'Então procuravam Jesus e, enquanto estavam de pé no recinto do templo[a], diziam uns aos outros: “O que vocês acham? Ele certamente não virá para a festa?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἱερόν se refere ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Ele de modo algum virá para a festa?” O grego emprega uma negação enfática (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: procuravam
  rationale: O imperfeito indica uma ação contínua ou repetida; “procuravam” é natural e mantém esse aspecto.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com o contexto anterior sem tornar a relação excessivamente lógica.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: diziam uns aos outros
  rationale: Preserva tanto o aspecto durativo do imperfeito quanto a reciprocidade da conversa.
- source_word: ἐν τῷ ἱερῷ
  choice: nos pátios do templo
  rationale: ἱερόν designa o complexo ou recinto do templo, e não especificamente o santuário interior; “pátios” comunica essa distinção de modo acessível.
- source_word: ἑστηκότες
  choice: enquanto estavam
  rationale: O particípio perfeito descreve o estado de estarem parados naquele local; a formulação portuguesa evita a redundância pouco natural de “estavam em pé nos pátios” sem perder a cena.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: O que vocês acham?
  rationale: Expressão corrente e amplamente compreensível para uma pergunta de opinião.
- source_word: ὅτι οὐ μὴ ἔλθῃ
  choice: Será que ele de modo algum virá
  rationale: A pergunta preserva a ambiguidade pragmática da construção, enquanto “de modo algum” representa a negação enfática οὐ μή sem convertê-la silenciosamente numa simples negação.
- source_word: εἰς τὴν ἑορτήν
  choice: para a festa
  rationale: No contexto imediato, refere-se à festa judaica mencionada; “festa” é conciso, digno e inteligível.
