    issue: O detalhe de estarem de pé não é expresso.
    rationale: Ἑστηκότες é um particípio perfeito que descreve as pessoas como estando de pé; «enquanto estavam» apenas indica presença ou permanência.
  - severity: low
    issue: «Será que» atenua a formulação interrogativa associada à negação enfática.
    rationale: Embora não seja uma tradução impossível, a construção pode sugerir maior dúvida do que «O que vocês acham? Ele certamente não virá...?», que preserva melhor a pergunta e a força de οὐ μή.
