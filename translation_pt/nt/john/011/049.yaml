  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: pt
  text: 'Mas um deles, Caifás, que era o sumo sacerdote naquele ano, disse-lhes: “Vocês não sabem absolutamente nada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Mas um deles
  rationale: A combinação εἷς ... τις apresenta idiomaticamente um indivíduo pertencente ao grupo. “Um deles” é natural em português, e “mas” representa a transição levemente contrastiva de δέ.
- source_word: Καϊάφας
  choice: Caifás
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: É a designação portuguesa consagrada para o titular singular desse ofício e evita confundi-lo com o grupo mais amplo dos principais sacerdotes.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: que era o sumo sacerdote naquele ano
  rationale: A oração relativa reproduz naturalmente o particípio ὢν, e “naquele ano” expressa de modo idiomático a referência temporal sem acrescentar explicação histórica.
- source_word: εἶπεν αὐτοῖς
  choice: disse-lhes
  rationale: Representa de forma direta o verbo λέγω com o objeto indireto, em registro atual e digno.
- source_word: Ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito é preservado. “Vocês” oferece ampla legibilidade brasileira e deixa a ênfase ser comunicada pelo conjunto da repreensão.
- source_word: οὐκ οἴδατε οὐδέν
  choice: não sabem absolutamente nada
  rationale: A construção negativa enfática é reproduzida em português natural com “absolutamente nada”, mantendo a força da censura sem tratar as duas negativas como cancelamento lógico.
theological_decisions:
- issue: Nota temporal de João sobre o ofício de Caifás
  choice: que era o sumo sacerdote naquele ano
  alternative: sendo sumo sacerdote naquele ano
  rationale: A formulação funciona como descrição histórica direta e não introduz explicações sobre a duração do ofício, a providência divina ou a ironia narrativa; essas implicações permanecem abertas ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala de Caifás conserva tom contundente por meio de “absolutamente nada”. Não se acrescentou nota, pois a ênfase do grego pode ser expressa diretamente no texto sem sobrecarregar a edição.
