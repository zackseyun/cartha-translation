id: JHN.11.54
reference: John 11:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: pt
  text: Por isso, Jesus já não andava abertamente entre os judeus[a], mas saiu dali e foi para a região próxima do deserto, para uma cidade chamada Efraim. E ficou ali com os discípulos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os judeus da Judeia” ou “entre os judeanos”. Em João, “os judeus” pode, conforme o contexto, referir-se mais especificamente aos habitantes da Judeia ou às autoridades judaicas.'
    reason: Preserva a amplitude semântica e a possível nuance regional de Ἰουδαῖοι no contexto joanino.
lexical_decisions:
- source_word: οὖν
  choice: Por isso
  rationale: Expressa a consequência narrativa da decisão anterior de matar Jesus, preservando a força inferencial em português natural.
- source_word: οὐκέτι
  choice: já não
  rationale: Indica de modo idiomático a interrupção de uma prática anterior.
- source_word: παρρησίᾳ
  choice: abertamente
  rationale: Neste contexto, refere-se à visibilidade pública dos deslocamentos de Jesus, e não primariamente à coragem.
- source_word: περιεπάτει
  choice: andava
  rationale: Preserva a imagem verbal do grego e, com 'abertamente', comunica que Jesus circulava em público.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: entre os judeus
  rationale: Mantém a designação tradicional e ampla, sem restringi-la silenciosamente às autoridades; a possível nuance regional é indicada em nota.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: saiu dali
  rationale: Forma atual, clara e concisa de expressar o movimento para longe do lugar anterior.
- source_word: χώραν
  choice: região
  rationale: Designa uma área ou território, não um Estado nacional moderno.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: próxima do deserto
  rationale: '''Deserto'' é a forma bíblica corrente e inteligível para uma área erma ou pouco habitada, sem exigir que fosse inteiramente arenosa.'
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: para uma cidade chamada Efraim
  rationale: Reproduz diretamente a designação geográfica do texto; πόλις pode abranger uma cidade ou povoado.
- source_word: κἀκεῖ ἔμεινεν
  choice: E ficou ali
  rationale: Em contexto de viagem, 'ficou' é a equivalência idiomática de μένω e mantém clara a permanência naquele lugar.
- source_word: μετὰ τῶν μαθητῶν
  choice: com os discípulos
  rationale: Segue a ausência de possessivo explícito no grego; o referente é claro pelo contexto.
theological_decisions:
- issue: Referente de Ἰουδαῖοι no Evangelho de João
  choice: entre os judeus
  alternative: entre os judeus da Judeia; entre os judeanos
  rationale: O termo pode ter sentido étnico, regional ou, em certos contextos, referir-se especialmente às autoridades. Aqui a declaração descreve onde Jesus deixou de circular publicamente; a tradução principal conserva a formulação ampla, enquanto a nota preserva a possível nuance regional e evita generalizações indevidas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar um período pesado, sem alterar a sequência narrativa. O topônimo segue a forma portuguesa tradicional 'Efraim'.
