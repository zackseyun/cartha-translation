base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: pt
  text: Assim, desde aquele dia, decidiram matá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: desde aquele dia
  rationale: A preposição ἀπό com a expressão temporal no genitivo indica o ponto inicial de uma ação ou disposição que prossegue. “Desde aquele dia” expressa isso de modo natural em português.
- source_word: οὖν
  choice: Assim
  rationale: οὖν apresenta a decisão como consequência da reunião narrada anteriormente. “Assim” preserva essa conexão narrativa sem excessiva formalidade.
- source_word: ἐβουλεύσαντο
  choice: decidiram
  rationale: Nesse contexto, o verbo indica deliberação que resulta numa decisão firme. “Decidiram” comunica de forma clara esse desfecho, enquanto o complemento “matá-lo” mantém explícita a natureza hostil da decisão.
- source_word: ἵνα ἀποκτείνωσιν
  choice: matá-lo
  rationale: A construção com ἵνα indica o conteúdo ou propósito da deliberação. Em português, o infinitivo após “decidiram” é idiomático, e “matar” reproduz diretamente o sentido de ἀποκτείνω sem sugerir um processo judicial não explicitado.
- source_word: αὐτόν
  choice: -lo
  rationale: O pronome retoma Jesus no contexto imediato. O pronome oblíquo ligado ao infinitivo é natural em português e evita substituir por um nome que o grego não repete.
theological_decisions:
- issue: Natureza da intenção dos líderes contra Jesus
  choice: Apresentar uma decisão firme de matar Jesus, sem atenuá-la como mera discussão ou possibilidade.
  alternative: “começaram a planejar como matá-lo” ou “consideraram matá-lo”
  rationale: O aoristo ἐβουλεύσαντο, seguido da construção com ἵνα, assinala aqui uma deliberação que chega a uma resolução concreta. A tradução preserva a gravidade da intenção sem acrescentar uma interpretação jurídica ou doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação é concisa e mantém a ligação lógica com o contexto anterior.
