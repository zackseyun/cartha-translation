id: JHN.11.51
reference: John 11:51
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: pt
  text: Ele não disse isso por si mesmo[a]; mas, sendo o sumo sacerdote naquele ano, profetizou que Jesus haveria de morrer pela nação[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por iniciativa própria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ia morrer”; também pode indicar que “estava destinado a morrer”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “em favor da nação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: Ele não disse isso...; mas
  rationale: O pronome demonstrativo é traduzido por “isso”, e o valor discursivo leve de δέ é deixado ao fluxo da frase, sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἀφ’ ἑαυτοῦ
  choice: por si mesmo
  rationale: Expressa de modo natural em português que a declaração não teve nele próprio sua origem ou iniciativa, sem determinar quanto ele compreendia do alcance profético de suas palavras.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: mas, sendo o sumo sacerdote naquele ano
  rationale: Mantém a construção participial e seu sentido circunstancial, preservando a relação entre o ofício de Caifás e a profecia sem explicitar uma causalidade além do texto.
- source_word: ἐπροφήτευσεν
  choice: profetizou
  rationale: Conserva a afirmação explícita de João de que as palavras de Caifás tinham caráter profético.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: haveria de morrer
  rationale: Transmite a perspectiva futura e o acontecimento que se aproximava sem exigir a ideia de morte imediatamente iminente nem impor fatalismo.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: pela nação
  rationale: “Pela” é idiomático e preserva a amplitude benefativa ou representativa de ὑπέρ; “nação” mantém o singular e a referência contextual à nação judaica.
theological_decisions:
- issue: O caráter profético da declaração de Caifás
  choice: Afirmar que Caifás profetizou em conexão com seu ofício de sumo sacerdote, sem definir seu grau de consciência ou uma teoria completa da inspiração.
  alternative: Entender que Caifás profetizou conscientemente sob inspiração divina, ou que João fala apenas com ironia e não de uma profecia real.
  rationale: O verbo grego afirma diretamente que ele profetizou, mas o versículo não declara que Caifás compreendia plenamente suas palavras nem aprova seu caráter ou suas intenções.
- issue: O sentido de ὑπέρ na morte de Jesus
  choice: Traduzir de modo amplo como “pela nação”.
  alternative: “Em favor da nação” ou uma formulação explicitamente substitutiva, como “em lugar da nação”.
  rationale: A preposição admite valor benefativo e representativo neste contexto. A tradução conserva o peso teológico sem restringi-lo a uma formulação técnica de expiação que o versículo, isoladamente, não explicita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção próxima do grego sem rigidez artificial. “Sumo sacerdote” e “profetizou” preservam o vocabulário bíblico corrente; “haveria de morrer” mantém a orientação futura de μέλλω de forma natural.
