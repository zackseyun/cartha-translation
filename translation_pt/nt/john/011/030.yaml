id: JHN.11.30
reference: John 11:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: pt
  text: Jesus ainda não tinha entrado no povoado, mas continuava no lugar onde Marta o havia encontrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: “onde Marta tinha ido ao encontro dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ainda não
  rationale: Expressa naturalmente que a ação não havia ocorrido até aquele momento.
- source_word: δὲ
  choice: sem representação separada
  rationale: Aqui, δέ funciona como transição narrativa leve; em português, o fluxo é mais natural sem um marcador inicial como “ora”, e o contraste seguinte já é expresso por “mas”.
- source_word: ἐληλύθει
  choice: tinha entrado
  rationale: O mais-que-perfeito indica uma situação anterior ao ponto narrativo. Neste contexto, com εἰς τὴν κώμην, “entrado” comunica de modo natural a chegada ao interior do povoado.
- source_word: κώμην
  choice: povoado
  rationale: Designa uma localidade pequena; “povoado” é claro, corrente e evita sugerir uma cidade de maior porte.
- source_word: ἀλλ’
  choice: mas
  rationale: Marca o contraste entre Jesus ainda não ter entrado no povoado e permanecer no mesmo lugar.
- source_word: ἔτι
  choice: continuava
  rationale: Com o verbo de estado ἦν, indica permanência. “Continuava” produz uma frase portuguesa natural sem perder essa ideia.
- source_word: τόπῳ
  choice: lugar
  rationale: Equivalente simples e direto do termo geral para uma localização.
- source_word: ὅπου
  choice: onde
  rationale: Introduz de modo natural a oração relativa de lugar.
- source_word: ὑπήντησεν
  choice: havia encontrado
  rationale: Identifica de forma concisa o lugar do encontro. O possível sentido mais explícito de sair ou ir ao encontro de alguém é preservado em nota.
- source_word: αὐτῷ
  choice: o
  rationale: O dativo regido pelo verbo é expresso naturalmente em português pelo pronome objeto em “o havia encontrado”.
- source_word: Μάρθα
  choice: Marta
  rationale: Forma tradicional e corrente do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase preserva o contraste do grego; evitou-se um marcador narrativo inicial artificial. O marcador da nota foi colocado junto à expressão que ela esclarece.
