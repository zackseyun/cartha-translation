id: JHN.11.55
reference: John 11:55
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: pt
  text: A Páscoa dos judeus estava próxima[a], e muitos subiram do interior para Jerusalém antes da Páscoa, a fim de se purificarem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Páscoa judaica”. O grego diz mais literalmente “a Páscoa dos judeus”, expressão recorrente em João.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, para passarem pela purificação ritual em preparação para a Páscoa.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: estava
  rationale: δέ é um conectivo leve; em português, a continuidade narrativa pode permanecer implícita sem acrescentar um marcador temporal inexistente no grego.
- source_word: ἐγγὺς
  choice: próxima
  rationale: Expressa com clareza a proximidade temporal da festa.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: a Páscoa dos judeus
  rationale: Preserva a construção genitiva recorrente em João, em vez de reduzi-la a uma forma adjetival.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Mantém a maneira convencional e geográfica de descrever a viagem de peregrinação a Jerusalém.
- source_word: πολλοὶ
  choice: muitos
  rationale: O adjetivo substantivado pode ser traduzido naturalmente sem acrescentar 'pessoas'.
- source_word: εἰς Ἱεροσόλυμα
  choice: para Jerusalém
  rationale: Forma direcional natural em português.
- source_word: ἐκ τῆς χώρας
  choice: do interior
  rationale: Comunica de modo natural as áreas fora de Jerusalém, sem restringir o sentido exclusivamente à zona rural.
- source_word: πρὸ τοῦ πάσχα
  choice: antes da Páscoa
  rationale: Tradução temporal direta e clara.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: a fim de se purificarem
  rationale: Expressa a finalidade e preserva a linguagem de purificação sem inserir a explicação ritual no corpo do versículo.
theological_decisions:
- issue: Natureza da purificação antes da Páscoa
  choice: se purificarem
  alternative: se purificarem ritualmente; se consagrarem
  rationale: O contexto indica preparação ritual judaica para a Páscoa, mas a tradução principal mantém a formulação ampla do grego e deixa a explicação histórica para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que [a] acompanhe “Páscoa dos judeus” e [b], “se purificarem”.
