review_pass:
  verdict: revise
  source_fidelity: A formulação «foi chamar» condensa ἀπῆλθεν («foi-se/se afastou») e ἐφώνησεν («chamou»), mas não expressa com suficiente clareza os dois atos narrativos distintos. A revisão os mantém separados. «Em particular» reproduz adequadamente λάθρᾳ, e «O Mestre» é uma forma portuguesa estabelecida e semanticamente aceitável para Ὁ διδάσκαλος neste contexto.
  naturalness: A redação revisada é natural, clara e digna em português moderno de ampla compreensão. «Maria, sua irmã» evita a leitura inicialmente menos fluida de «sua irmã Maria» depois de «chamar».
  terminology: «O Mestre» funciona como título respeitoso para Jesus e conserva o campo semântico docente de διδάσκαλος sem impor formulação doutrinária. A nota anterior sobre esse termo era imprecisa, pois apresentava «O Mestre» como se fosse a forma grega, quando o grego é literalmente «O Professor/Instrutor» ou «O que ensina». Não é necessária nota para a tradução adotada.
  issues:
  - severity: medium
    issue: «ela foi chamar» funde «ela se afastou/foi-se» e «ela chamou».
    rationale: O texto grego coordena ἀπῆλθεν e ἐφώνησεν como ações sucessivas. Embora a construção portuguesa possa sugerir deslocamento, a separação explícita preserva melhor a progressão narrativa.
  - severity: low
    issue: A nota [a] identifica inadequadamente a forma grega como «O Mestre».
    rationale: διδάσκαλος designa literalmente um professor, mestre ou instrutor; «Mestre» é uma boa tradução contextual, mas não deve ser apresentada como a palavra grega. A nota pode ser removida sem perda necessária de informação.
  revised_text: 'Depois de dizer isso, ela se afastou e chamou Maria, sua irmã, em particular, dizendo: “O Mestre está aqui e está chamando você.”'
  revised_footnotes:
  - marker: a
    text: Ou “chama você”. O presente grego também pode ser traduzido de modo simples; no contexto, indica que ele pede a presença dela.
    reason: lexical_alternative
