id: JHN.11.28
reference: John 11:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: pt
  text: 'Depois de dizer isso, ela se afastou e chamou Maria, sua irmã, em particular, dizendo: “O Mestre está aqui e está chamando você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Depois de dizer isso
  rationale: Expressa naturalmente em português a anterioridade do particípio aoristo e preserva a sequência narrativa.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: No contexto, indica que Marta se afastou para chamar Maria; a formulação evita a rigidez de 'retirou-se'.
- source_word: ἐφώνησεν Μαριὰμ
  choice: chamar sua irmã Maria
  rationale: φωνέω significa aqui chamar ou convocar alguém; a integração com o aposto produz português natural.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: sua irmã Maria
  rationale: Identifica Maria como irmã de Marta de modo claro e idiomático.
- source_word: λάθρᾳ
  choice: em particular
  rationale: Indica comunicação fora da audição pública sem necessariamente sugerir clandestinidade ou engano.
- source_word: εἰποῦσα
  choice: dizendo
  rationale: Introduz diretamente as palavras de Marta e mantém de modo fluente a construção participial grega.
- source_word: Ὁ διδάσκαλος
  choice: O Mestre
  rationale: Embora διδάσκαλος denote literalmente quem ensina, 'Mestre' é a designação respeitosa e corrente em português para Jesus, conservando também sua função docente.
- source_word: πάρεστιν
  choice: está aqui
  rationale: Equivalente claro e idiomático para a ideia de estar presente.
- source_word: φωνεῖ σε
  choice: está chamando você
  rationale: Preserva o presente grego e comunica naturalmente que Jesus solicita a presença de Maria.
theological_decisions:
- issue: Tradução do título διδάσκαλος
  choice: O Mestre
  alternative: O Professor / Aquele que ensina
  rationale: '''Mestre'' é o título respeitoso consagrado e amplamente compreensível em português, sem acrescentar uma afirmação cristológica que o termo grego não contenha; uma nota registra o sentido lexical de ''aquele que ensina''.'
- issue: Nuance de λάθρᾳ
  choice: em particular
  alternative: secretamente
  rationale: A expressão descreve uma comunicação discreta, provavelmente fora da audição dos presentes, mas não afirma o motivo nem exige a ideia de clandestinidade.
- issue: Aspecto de φωνεῖ σε
  choice: está chamando você
  alternative: chama você
  rationale: A forma progressiva é natural em português para a ação presente e, no contexto, transmite o pedido pela presença de Maria sem especificar além do grego como o chamado foi feito.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem alterar a sequência dos acontecimentos. 'Em particular' preserva a discrição de λάθρᾳ sem atribuir a Marta uma intenção não declarada.
