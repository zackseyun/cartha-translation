  to: 'Depois de dizer isso, ela se afastou e chamou Maria, sua irmã, em particular, dizendo: “O Mestre está aqui e está chamando você.”'
  rationale: A revisão distingue explicitamente a partida de Marta do ato de chamar Maria, preservando a sequência de ἀπῆλθεν καὶ ἐφώνησεν. Mantém «em particular» para a comunicação discreta e «O Mestre» como título idiomático. A nota sobre o título foi retirada por ser lexicalmente imprecisa; a nota sobre o presente de φωνεῖ foi preservada e recebeu o marcador correspondente.
