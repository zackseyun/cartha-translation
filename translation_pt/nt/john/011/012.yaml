base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: pt
  text: 'Então os discípulos lhe disseram: “Senhor, se ele adormeceu[a], vai se recuperar[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “foi dormir”. Jesus havia falado figuradamente da morte de Lázaro como sono, mas os discípulos entenderam que se tratava de sono comum.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego também pode ser traduzido por “será salvo”; aqui, porém, refere-se à recuperação de uma enfermidade: “vai se recuperar” ou “vai ficar bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a inferência dos discípulos a partir da fala anterior de Jesus e mantém o fluxo narrativo natural em português.
- source_word: οἱ μαθηταὶ
  choice: os discípulos
  rationale: Reproduz o substantivo articulado sem acrescentar um possessivo que não está expresso no grego.
- source_word: αὐτῷ
  choice: lhe
  rationale: Retoma Jesus por pronome, como no texto grego, de modo claro e idiomático.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto a forma respeitosa de tratamento quanto a possível ressonância cristológica do termo em João.
- source_word: εἰ
  choice: se
  rationale: Expressa diretamente a condição formulada pelos discípulos.
- source_word: κεκοίμηται
  choice: adormeceu
  rationale: A forma perfeita apresenta o estado resultante de ter adormecido. Neste ponto, os discípulos entendem literalmente a linguagem de Jesus, embora ela também aluda à morte.
- source_word: σωθήσεται
  choice: vai se recuperar
  rationale: Neste contexto de enfermidade, σῴζω indica restabelecimento físico. A formulação evita introduzir no texto principal um sentido soteriológico que não corresponde à compreensão dos discípulos.
theological_decisions:
- issue: Sentido de κύριος no tratamento dirigido a Jesus
  choice: Senhor
  alternative: Mestre; senhor (como simples tratamento respeitoso)
  rationale: “Senhor” conserva a forma normal de tratamento e deixa aberta a ressonância cristológica característica do Evangelho, sem defini-la além do que o versículo permite.
- issue: Duplo sentido de κεκοίμηται como sono e morte
  choice: Linguagem de sono no texto principal, com explicação em nota
  alternative: Traduzir com uma expressão deliberadamente vaga como “foi descansar”
  rationale: O diálogo depende de os discípulos entenderem como sono comum a figura usada por Jesus para a morte. A tradução mantém essa tensão narrativa e a nota explicita o jogo de sentidos.
- issue: Amplitude semântica de σωθήσεται
  choice: vai se recuperar
  alternative: será salvo
  rationale: Embora o verbo possa significar “ser salvo”, o contexto imediato é a recuperação de uma enfermidade. A nota conserva a alternativa lexical sem impor aqui um sentido teológico estranho ao raciocínio dos discípulos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Vai se recuperar” é coloquial sem ser informal demais; “lhe disseram” conserva concisão narrativa.
