  source_fidelity: A tradução acompanha adequadamente a sequência e os elementos principais do grego. Contudo, a construção atual repete “viu” de modo pouco fluente, e “perturbou a si mesmo” é excessivamente literal e soa artificial em português; “perturbou-se” conserva a reflexividade expressa por ἑαυτόν sem sugerir uma ação deliberada contra si mesmo.
  naturalness: “Assim” é apropriado para οὖν. A redação pode ser mais idiomática ao coordenar os dois grupos vistos por Jesus sem a repetição desajeitada de “viu”. “Perturbou-se” é português moderno e claro, mantendo o efeito reflexivo.
  terminology: “Os judeus” é uma tradução lexical possível de Ἰουδαίους, mas requer nota contextual, como no registro de auditoria em inglês, para evitar que seja entendido como referência ao povo judeu em geral. “Comoveu-se profundamente” mantém prudentemente a ambiguidade de ἐνεβριμήσατο; a nota deve registrar as alternativas de indignação/agitação forte.
  issues:
  - severity: medium
    issue: Falta uma nota contextual para “os judeus”.
    rationale: Em João, Ἰουδαῖοι pode ter alcance contextual variável. Neste versículo designa os presentes que vieram com Maria, não o povo judeu como um todo. A nota da trilha de auditoria inglesa deve ser preservada em português.
  - severity: low
    issue: “Perturbou a si mesmo” é pouco natural em português contemporâneo.
    rationale: Embora tente reproduzir ἐτάραξεν ἑαυτόν, a formulação pode sugerir que Jesus causou deliberadamente perturbação a si próprio. “Perturbou-se” preserva a reflexividade de modo natural.
  - severity: low
    issue: A repetição de “viu” torna a frase mais pesada do que o necessário.
    rationale: O grego emprega um único εἶδεν que abrange Maria e os judeus. Uma construção portuguesa com um só verbo reflete melhor essa estrutura.
  revised_text: Assim, quando Jesus a viu chorando e os judeus que tinham vindo com ela também chorando[a], comoveu-se profundamente em seu espírito[b] e perturbou-se.
