source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: pt
  text: Assim, quando Jesus a viu chorando e os judeus que tinham vindo com ela também chorando[a], comoveu-se profundamente em seu espírito[b] e perturbou-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos”. Aqui o termo se refere aos judeus que estavam presentes e tinham vindo com Maria, não ao povo judeu como um todo.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “comoveu-se profundamente” também pode ter o sentido de “indignou-se” ou “agitou-se profundamente”; expressa forte agitação interior.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Marca a continuação e a consequência narrativa de modo claro e natural em português, sem reduzir a conexão a uma simples indicação temporal.
- source_word: ὡς εἶδεν
  choice: quando ... viu
  rationale: ὡς com o aoristo tem aqui valor temporal; a formulação mantém a sequência da cena em português corrente.
- source_word: κλαίουσαν / κλαίοντας
  choice: chorando
  rationale: κλαίω indica choro perceptível, possivelmente audível. “Chorando” é natural, solene o bastante e não impõe a ideia mais específica de lamentação ritual.
- source_word: συνελθόντας αὐτῇ
  choice: que tinham vindo com ela
  rationale: Expressa com clareza a ação anterior do particípio e a associação dos presentes com Maria.
- source_word: Ἰουδαίους
  choice: os judeus
  rationale: É a correspondência lexical direta neste contexto, em que o termo designa especificamente os judeus presentes que acompanhavam Maria, e não o povo judeu em sua totalidade.
- source_word: ἐνεβριμήσατο
  choice: comoveu-se profundamente
  rationale: Preserva a intensidade da forte agitação interior sem decidir se a emoção era sobretudo indignação, ira ou pesar; alternativas mais incisivas são registradas em nota.
- source_word: τῷ πνεύματι
  choice: em seu espírito
  rationale: Mantém a referência à esfera interior em que se dá a agitação e reproduz de modo natural a construção grega.
- source_word: ἐτάραξεν ἑαυτόν
  choice: perturbou a si mesmo
  rationale: Conserva deliberadamente a reflexividade explícita de ἑαυτόν, em vez de nivelá-la para “ficou perturbado”.
theological_decisions:
- issue: A emoção de Jesus expressa por ἐνεβριμήσατο
  choice: Traduzir como “comoveu-se profundamente”, preservando forte agitação sem definir sua natureza exata.
  alternative: “indignou-se”, “agitou-se profundamente” ou “irou-se”
  rationale: O verbo pode incluir indignação ou severa agitação, mas o texto não declara explicitamente o alvo ou a natureza precisa da emoção. A tradução principal mantém essa tensão interpretativa, e a nota registra as nuances mais fortes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “chorando” reflete a repetição grega. “Perturbou a si mesmo” é um pouco marcada, mas preserva a forma reflexiva enfática do original. O marcador [a] aparece imediatamente após a expressão a que a nota se refere.
