id: JHN.11.34
reference: John 11:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: pt
  text: 'E ele disse: “Onde vocês o colocaram?” Eles lhe disseram: “Senhor[a], venha e veja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “senhor”, como forma respeitosa de tratamento. O grego κύριε pode ser apenas uma maneira cortês de se dirigir a alguém, embora “Senhor” também preserve a possível ressonância teológica do título.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: Mantém o verbo comum de fala λέγω. Embora a fala introduza uma pergunta, “disse” preserva a forma do grego sem a interpretar como “perguntou”.
- source_word: Ποῦ
  choice: Onde
  rationale: Traduz diretamente o advérbio interrogativo de lugar.
- source_word: τεθείκατε
  choice: vocês o colocaram
  rationale: O perfeito ativo de τίθημι indica o ato já realizado de pôr o corpo de Lázaro em um lugar. Em português, o pretérito perfeito simples é a forma narrativa natural; “colocaram” é claro e adequado ao contexto.
- source_word: αὐτόν
  choice: o
  rationale: Pronome masculino singular que retoma Lázaro.
- source_word: λέγουσιν
  choice: disseram
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto a forma respeitosa de tratamento quanto a possível ressonância cristológica do termo dirigido a Jesus.
- source_word: ἔρχου
  choice: venha
  rationale: Imperativo direto de ἔρχομαι, expresso de modo natural no tratamento respeitoso em português.
- source_word: ἴδε
  choice: veja
  rationale: Imperativo de ὁράω; “venha e veja” reproduz com naturalidade a sequência dos dois imperativos.
theological_decisions:
- issue: Tradução de κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: senhor, como simples forma respeitosa de tratamento
  rationale: A forma “Senhor” conserva a possível força cristológica sem excluir o uso social respeitoso que κύριε também pode ter neste contexto. A nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “vocês” torna explícito o plural de τεθείκατε. A ordem e os verbos de fala do grego foram preservados, evitando transformar interpretativamente “disse” em “perguntou”.
