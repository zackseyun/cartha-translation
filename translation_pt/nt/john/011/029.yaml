  text: Quando ela ouviu isso, levantou-se depressa e foi até ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: ela
  rationale: O demonstrativo retoma Maria no contexto imediato; em português corrente, o pronome «ela» é mais natural do que «aquela».
- source_word: δὲ
  choice: não expresso separadamente
  rationale: Aqui δέ é um conectivo narrativo leve. A sequência é fluente em português sem uma conjunção explícita, evitando sugerir contraste indevido.
- source_word: ὡς
  choice: quando
  rationale: Na construção temporal, indica o momento em que ocorreu a ação, sem exigir o sentido mais forte de «assim que».
- source_word: ἤκουσεν
  choice: ouviu isso
  rationale: O verbo significa «ouvir»; «isso» explicita naturalmente em português a mensagem comunicada no versículo anterior sem alterar seu conteúdo.
- source_word: ἠγέρθη
  choice: levantou-se
  rationale: 'Embora a forma grega seja passiva, o verbo tem aqui sentido intransitivo: Maria se pôs de pé. «Levantou-se» é natural e evita sugerir um agente externo.'
- source_word: ταχὺ
  choice: depressa
  rationale: Expressa a rapidez ou prontidão da ação em linguagem corrente.
- source_word: ἤρχετο
  choice: foi
  rationale: O imperfeito apresenta o movimento em curso, mas «foi» transmite com naturalidade a progressão narrativa em português.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. «Até ele» é idiomático neste contexto e apresenta Jesus como destino do movimento.
