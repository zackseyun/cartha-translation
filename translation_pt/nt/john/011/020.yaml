source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: pt
  text: Então, quando Marta ouviu que Jesus estava chegando[a], foi ao encontro dele; Maria, porém, estava sentada em casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Jesus está chegando». O grego emprega o verbo no presente na oração de discurso indireto, o que pode ser traduzido mais formalmente como um presente vívido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a consequência do contexto anterior de modo natural em português.
- source_word: ὡς
  choice: quando
  rationale: Introduz aqui uma oração temporal; evita intensificar a ideia com «assim que».
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Traduz diretamente o aoristo de ἀκούω sem substituir a percepção auditiva por «soube».
- source_word: ἔρχεται
  choice: estava chegando
  rationale: Expressa a ação em curso no discurso indireto dentro de uma narrativa passada; a nota preserva a possibilidade formal do presente vívido.
- source_word: ὑπήντησεν
  choice: foi ao encontro dele
  rationale: Preserva a nuance direcional de ὑπαντάω, em vez do mais genérico «encontrou-o».
- source_word: δὲ
  choice: porém
  rationale: Assinala o contraste moderado entre a ação de Marta e a situação de Maria.
- source_word: ἐν τῷ οἴκῳ
  choice: em casa
  rationale: É a expressão portuguesa corrente para a localização indicada, sem alterar o sentido contextual.
- source_word: ἐκαθέζετο
  choice: estava sentada
  rationale: Reproduz o aspecto contínuo do imperfeito sem acrescentar a ideia interpretativa de que Maria decidiu permanecer ali.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Marta / Maria / Jesus
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português.
