- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: perto de Jerusalém
  rationale: Expressa de modo natural a proximidade espacial indicada pelo grego.
- source_word: ὡς
  choice: cerca de
  rationale: Diante de uma medida, indica aproximação, não uma distância exata.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: a cerca de quinze estádios de distância
  rationale: Mantém a unidade antiga do texto-fonte e torna explícita, em português natural, a relação espacial indicada por ἀπό.
