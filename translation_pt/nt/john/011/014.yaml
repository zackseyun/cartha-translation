  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: pt
  text: 'Então Jesus lhes disse claramente[a]: “Lázaro morreu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abertamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε οὖν
  choice: Então
  rationale: A combinação marca a progressão do relato e a transição decorrente da incompreensão anterior. Em português, “então” exprime naturalmente esse movimento sem uma duplicação pesada.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: É a correspondência natural e direta de “disse a eles”, mantendo o ato de fala sem acrescentar conteúdo.
- source_word: παρρησίᾳ
  choice: claramente
  rationale: No contexto, contrasta com a referência anterior ao sono e indica que Jesus passou a falar de modo explícito e inequívoco. “Claramente” é corrente e preserva esse sentido.
- source_word: Λάζαρος
  choice: Lázaro
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo apresenta diretamente o acontecimento da morte. O pretérito perfeito é idiomático em português e, no contexto, já comunica sua relevância presente.
theological_decisions:
- issue: Natureza da declaração de Jesus sobre a condição de Lázaro
  choice: Uma declaração direta da morte física de Lázaro, esclarecendo a linguagem anterior sobre o sono.
  alternative: Manter aqui a imagem do sono ou traduzir como mera condição de inconsciência.
  rationale: O próprio versículo abandona a figura anterior e usa explicitamente ἀπέθανεν, “morreu”; por isso, a tradução deve ser inequívoca neste ponto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” evita a formulação menos natural “Então, portanto”; “claramente” explicita o contraste contextual sem recorrer a linguagem técnica.
