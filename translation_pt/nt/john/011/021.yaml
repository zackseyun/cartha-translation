source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: pt
  text: 'Então Marta disse a Jesus: “Senhor[a], se estivesses aqui, meu irmão não teria morrido.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhor”, como forma respeitosa de tratamento; o grego κύριε pode ter esse uso, embora “Senhor” também preserve a possível dimensão teológica do termo no Evangelho de João.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação ou consequência narrativa de modo natural em português, sem tornar a ligação excessivamente formal.
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: disse a Jesus
  rationale: Expressa de maneira direta e idiomática tanto o verbo de fala quanto seu destinatário.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o uso respeitoso como a possível ressonância cristológica do vocativo no Evangelho de João.
- source_word: εἰ ἦς ὧδε
  choice: se estivesses aqui
  rationale: O imperfeito em uma condição irreal passada é expresso naturalmente pelo imperfeito do subjuntivo em português; “aqui” traduz ὧδε de forma idiomática.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: não teria morrido
  rationale: O futuro do pretérito composto comunica com precisão o resultado passado contrário aos fatos.
- source_word: ὁ ἀδελφός μου
  choice: meu irmão
  rationale: Refere-se diretamente ao irmão de Marta, Lázaro, e esta é a formulação natural em português.
theological_decisions:
- issue: Sentido de κύριος na forma de tratamento dirigida por Marta a Jesus
  choice: Senhor
  alternative: Senhor, no sentido respeitoso de “senhor”
  rationale: '“Senhor” mantém aberta a amplitude do grego: pode funcionar como tratamento respeitoso e também carregar peso cristológico no contexto de João, sem decidir além do que o versículo explicita.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a construção condicional são naturais, mas conservam a relação lógica e a ambiguidade teológica do grego.
