  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: pt
  text: 'Então as irmãs mandaram dizer a Jesus: “Senhor, eis que aquele a quem amas está doente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: mandaram dizer a Jesus
  rationale: Expressa naturalmente em português o envio de uma mensagem, tornando explícito pelo contexto imediato que o destinatário é Jesus, sem sugerir que as irmãs foram pessoalmente.
- source_word: ἴδε
  choice: '[não expresso separadamente]'
  rationale: Aqui funciona como partícula que chama a atenção para a notícia; em português natural, o vocativo “Senhor” e a declaração seguinte já cumprem essa função. “Olha” poderia soar como ordem para observar fisicamente o enfermo ausente.
- source_word: ὃν φιλεῖς
  choice: aquele a quem amas
  rationale: Mantém a formulação indireta e afetiva do grego. “Amar” é idiomático e digno neste contexto, sem exigir uma distinção rígida entre φιλέω e ἀγαπάω.
- source_word: ἀσθενεῖ
  choice: está doente
  rationale: Equivalente direto e corrente para a condição presente indicada pelo verbo.
theological_decisions:
- issue: Nuance de φιλέω no amor de Jesus por Lázaro
  choice: amas
  alternative: tens afeição
  rationale: O contexto comunica amor pessoal e afetuoso, mas não sustenta a importação de uma distinção teológica técnica entre diferentes verbos gregos para amar.
- issue: Referente do pronome αὐτόν
  choice: Jesus
  alternative: ele
  rationale: O referente é inequívoco no contexto; explicitar o nome evita ambiguidade em português sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A mensagem é formulada de modo natural, sem reproduzir mecanicamente o particípio grego nem transformar ἴδε em uma ordem literal inadequada ao contexto.
