  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: pt
  text: 'Então os judeus[a] diziam: “Vejam como ele o amava!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeus da Judeia”, se a expressão for entendida como uma referência regional mais específica aos observadores judeus presentes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito indica fala em andamento ou repetida na cena; “diziam” preserva naturalmente esse aspecto em português.
- source_word: οὖν
  choice: Então
  rationale: Expressa a continuação narrativa e a reação ao choro de Jesus no versículo anterior, em linguagem natural.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação joanina do texto grego. Neste contexto imediato, refere-se aos judeus presentes como observadores e enlutados, não ao povo judeu de modo indiscriminado.
- source_word: Ἴδε
  choice: Vejam
  rationale: Imperativo que chama a atenção dos presentes; o plural explicita naturalmente em português que a fala se dirige ao grupo.
- source_word: πῶς
  choice: como
  rationale: Preserva a possível nuance de modo ou intensidade sem especificá-la além do grego.
- source_word: ἐφίλει
  choice: amava
  rationale: φιλέω expressa aqui afeição pessoal; “amava” é direto, digno e natural, sem enfraquecer o sentido.
- source_word: αὐτόν
  choice: o
  rationale: Pronome objeto masculino singular que retoma Lázaro.
theological_decisions:
- issue: Tradução de οἱ Ἰουδαῖοι em João
  choice: os judeus
  alternative: os judeus da Judeia
  rationale: A tradução principal conserva a formulação do grego. A nota registra uma leitura regional possível e esclarece que, nesta cena, o referente imediato são as pessoas judias presentes, evitando uma generalização indevida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Então” e “diziam” mantêm a progressão narrativa e o aspecto verbal; “Vejam” soa natural na fala dirigida a várias pessoas.
