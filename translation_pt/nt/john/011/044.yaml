  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: pt
  text: 'O homem que havia morrido saiu, com os pés e as mãos atados com faixas, e o rosto envolto em um pano. Jesus lhes diz: “Desatem-no e deixem-no ir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: o homem que havia morrido
  rationale: Expressa naturalmente o particípio perfeito substantivado, preservando o estado decorrente de sua morte sem recorrer ao termo mais substantivado “o morto”.
- source_word: κειρίαις
  choice: faixas
  rationale: Designa tiras ou faixas de tecido usadas no sepultamento; o contexto torna desnecessário acrescentar “funerárias”.
- source_word: ἡ ὄψις
  choice: o rosto
  rationale: Neste contexto, refere-se à face, e não à visão ou aparência em sentido abstrato.
- source_word: σουδαρίῳ
  choice: um pano
  rationale: Termo amplo para um pedaço de tecido, aqui envolvendo o rosto; evita especificar de modo indevido seu formato ou função.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico do grego e a vivacidade narrativa.
- source_word: Λύσατε
  choice: Desatem-no
  rationale: Transmite a ordem de soltar as faixas que o prendiam.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: deixem-no ir
  rationale: Reproduz de modo direto a construção permissiva, sem decidir além do texto se significa apenas permitir que caminhe ou também libertá-lo plenamente.
theological_decisions:
- issue: Descrição de Lázaro após sair do túmulo
  choice: o homem que havia morrido
  alternative: o morto
  rationale: A formulação preserva a referência à morte real e ao estado anterior sem sugerir que ele ainda permanecia morto ao sair.
- issue: Presente histórico na fala de Jesus
  choice: Jesus lhes diz
  alternative: Jesus lhes disse
  rationale: Segue o tempo verbal do texto grego; a mudança para o passado seria idiomática, mas reduziria uma característica narrativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos membros segue de perto o grego, mas com sintaxe natural. “Faixas” e “pano” evitam detalhes funerários não explicitados lexicalmente, embora claramente sugeridos pelo contexto.
