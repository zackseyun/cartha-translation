id: JHN.11.1
reference: John 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: pt
  text: Havia um homem doente[a], chamado Lázaro, de Betânia, do povoado de Maria e de sua irmã Marta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Certo homem, Lázaro de Betânia, do povoado de Maria e de sua irmã Marta, estava doente.”'
    reason: Alternativa sintática que conserva mais diretamente a construção participial e a aposição do grego.
lexical_decisions:
- source_word: Ἦν δέ
  choice: Havia
  rationale: O imperfeito Ἦν introduz a situação narrativa, e δέ funciona como conexão leve. Em português, “Havia” inicia a cena naturalmente sem acrescentar um marcador temporal explícito nem enfatizar contraste.
- source_word: τις
  choice: um homem
  rationale: O pronome indefinido apresenta uma pessoa específica ainda não identificada; como o referente é Lázaro, “um homem” comunica o sentido com naturalidade.
- source_word: ἀσθενῶν
  choice: doente
  rationale: Neste contexto, o particípio descreve enfermidade, não mera fraqueza. A construção “Havia um homem doente” preserva o valor circunstancial e soa natural em português.
- source_word: Λάζαρος
  choice: chamado Lázaro
  rationale: O nome é transliterado segundo a forma portuguesa consagrada. “Chamado” explicita com naturalidade a aposição grega, sem alterar a identificação do homem.
- source_word: ἀπὸ Βηθανίας
  choice: de Betânia
  rationale: ἀπό indica procedência ou associação de origem; “de Betânia” é a formulação portuguesa direta e idiomática.
- source_word: ἐκ τῆς κώμης
  choice: do povoado
  rationale: κώμη designa uma povoação menor, e “povoado” evita sugerir uma cidade de maior porte. A preposição ἐκ é adequadamente expressa por “de”.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: de Maria e de sua irmã Marta
  rationale: Os genitivos associam o povoado a Maria e Marta, enquanto a aposição identifica Marta como irmã de Maria. A ordem escolhida torna essa relação clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a repetição geográfica de Betânia e do povoado, presente no original, e usa “sua irmã Marta” para indicar sem ambiguidade que Marta é irmã de Maria.
