review_pass:
  verdict: revise
  source_fidelity: A explicitação “pela morte” acrescenta ao texto grego uma informação que o versículo não exprime. Embora a morte de Lázaro seja inequívoca no contexto, περί τοῦ ἀδελφοῦ significa “a respeito do irmão [delas]” e deve permanecer assim na tradução do versículo.
  naturalness: “Tinham vindo até Marta e Maria” é uma forma moderna, clara e natural que reproduz melhor o valor do mais-que-perfeito do que “tinham ido até”. “Para consolá-las a respeito do irmão delas” é idiomático no contexto de luto e não introduz conteúdo não expresso.
  terminology: “Judeus” é apropriado no texto principal. A nota preserva de modo adequado a alternativa contextual “judeanos”, sem restringir indevidamente o referente a autoridades.
  issues:
  - severity: medium
    issue: A tradução acrescenta “pela morte”.
    rationale: O grego traz apenas περὶ τοῦ ἀδελφοῦ, “a respeito do irmão”. O contexto permite inferir que a consolação se relaciona à morte, mas a tradução não deve transformar essa inferência contextual em conteúdo explícito do versículo.
  - severity: low
    issue: “Tinham ido” enfraquece a orientação de ἐληλύθεισαν (“tinham vindo”).
    rationale: O verbo ἔρχομαι é “vir”, e a visita é apresentada do ponto de vista de Marta e Maria. “Tinham vindo até” é igualmente natural em português e mais próximo do original.
  revised_text: Muitos dentre os judeus tinham vindo até Marta e Maria para consolá-las a respeito do irmão delas.[a]
