  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: pt
  text: Muitos dentre os judeus tinham vindo até Marta e Maria para consolá-las a respeito do irmão delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitos dentre os judeanos tinham vindo até Marta e Maria”. O termo grego pode designar os judeus em geral ou, em alguns contextos de João, mais especificamente os judeanos.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Muitos
  rationale: πολλοί significa “muitos”. δέ é um conectivo leve; aqui, a continuidade do discurso fica natural em português sem a introdução de “ora”, “então” ou “mas”, que poderiam acrescentar uma nuance indevida.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: dentre os judeus
  rationale: A construção é partitiva, literalmente “muitos dentre os judeus”. Neste contexto, refere-se naturalmente a pessoas judias que foram consolar as irmãs, não especificamente a autoridades hostis.
- source_word: ἐληλύθεισαν
  choice: tinham ido
  rationale: O mais-que-perfeito de ἔρχομαι indica uma ação anterior ao ponto narrativo. Em português, “tinham ido até” expressa naturalmente a visita às duas irmãs.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: até Marta e Maria
  rationale: πρός com acusativo indica movimento em direção a pessoas. “Marta” e “Maria” são as formas portuguesas tradicionais e correntes desses nomes.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: para consolá-las
  rationale: ἵνα com o subjuntivo expressa finalidade. παραμυθέομαι, no contexto de luto, significa consolar ou confortar; “consolá-las” é claro e idiomático.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: pela morte do irmão delas
  rationale: A expressão grega diz literalmente “a respeito do irmão”, mas, no contexto de condolências fúnebres, refere-se à morte dele. A explicitação produz português natural, enquanto “delas” deixa claro que era irmão de ambas.
theological_decisions:
- issue: Sentido de Ἰουδαίων no contexto joanino
  choice: judeus
  alternative: judeanos
  rationale: O versículo descreve pessoas que visitavam uma família enlutada, sem identificá-las especificamente como autoridades ou adversários. “Judeus” é o sentido étnico-religioso mais natural aqui; “judeanos” permanece na nota como possibilidade lexical genuína no Evangelho de João.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação evita um marcador discursivo inicial desnecessário. “Consolá-las” preserva o contexto de luto, e a nota mantém visível a ambiguidade de Ἰουδαίων.
