  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: pt
  text: 'Mas alguns deles disseram[a]: “Este homem, que abriu os olhos do cego, não poderia também ter impedido que este homem morresse?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não poderia ele ter impedido que este homem morresse?”'
    reason: Alternativa de formulação para a pergunta retórica, correspondente à nota lexical do audit trail inglês.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mas alguns deles
  rationale: Expressa naturalmente o sentido partitivo de ἐξ αὐτῶν, enquanto δέ marca o contraste com a reação anterior.
- source_word: εἶπαν
  choice: disseram
  rationale: O aoristo indicativo, em narrativa, é adequadamente vertido pelo pretérito perfeito simples.
- source_word: Οὐκ ἐδύνατο
  choice: não poderia
  rationale: Preserva a pergunta retórica sobre a capacidade de Jesus no contexto passado, em português corrente.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: Este homem, que abriu os olhos do cego
  rationale: Mantém o demonstrativo enfático e verte o particípio atributivo por uma oração relativa natural; 'o cego' remete ao homem conhecido da narrativa de João 9.
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  choice: também ter impedido que este homem morresse
  rationale: 'Comunica de modo idiomático o resultado causativo: fazer com que Lázaro não morresse. ''Também'' representa καί, e a repetição de ''este homem'' preserva o segundo οὗτος.'
theological_decisions:
- issue: Tom da pergunta dos presentes
  choice: Pergunta retórica com crítica implícita à aparente falta de intervenção de Jesus
  alternative: Pergunta neutra sobre sua capacidade
  rationale: A formulação grega com Οὐκ ἐδύνατο normalmente pressupõe que ele poderia ter agido; a tradução conserva essa tensão sem acrescentar uma acusação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação 'ter impedido que... morresse' é mais natural em português do que reproduzir literalmente ποιῆσαι ἵνα como 'ter feito com que... não morresse', sem alterar o sentido.
