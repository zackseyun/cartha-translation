  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: pt
  text: 'Então retiraram a pedra. Jesus ergueu os olhos para o alto e disse: “Pai, eu te agradeço porque me ouviste.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν
  choice: retiraram
  rationale: No contexto da entrada do túmulo, αἴρω indica que a pedra foi removida; “retiraram” é natural e evita sugerir apenas que a levantaram.
- source_word: οὖν
  choice: Então
  rationale: Expressa a consequência narrativa da ordem anterior de Jesus de modo claro e corrente.
- source_word: λίθον
  choice: pedra
  rationale: É o termo português normal para o objeto que fechava o túmulo.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jesus
  rationale: O δέ marca uma transição narrativa suave. Em português, a mudança de sujeito já cumpre essa função, sem necessidade de um conectivo artificial.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: ergueu os olhos
  rationale: Preserva a imagem concreta de dirigir o olhar para o alto, enquanto evita a redundância pouco natural de “ergueu os olhos para cima”.
- source_word: Πάτερ
  choice: Pai
  rationale: Reproduz diretamente o vocativo da oração, com intimidade e dignidade, sem acréscimo litúrgico.
- source_word: εὐχαριστῶ σοι
  choice: eu te agradeço
  rationale: Formulação portuguesa natural e semanticamente completa para a expressão de gratidão no presente.
- source_word: ὅτι ἤκουσάς μου
  choice: porque me ouviste
  rationale: O perfeito simples português traduz com naturalidade o aoristo grego e mantém a referência a uma ação já realizada. “Ouvir” também pode implicar acolhimento favorável no contexto da oração sem explicitá-lo além do texto.
theological_decisions:
- issue: Forma de Jesus dirigir-se a Deus em oração
  choice: Pai
  alternative: Ó Pai
  rationale: O vocativo simples conserva a relação expressa no grego sem introduzir solenidade arcaizante ou elaboração doutrinária.
- issue: Sentido temporal e teológico de ἤκουσάς μου
  choice: me ouviste
  alternative: tens me ouvido
  rationale: A forma escolhida preserva a ação passada apresentada pelo aoristo e não amplia a frase para uma afirmação geral sobre a oração ou sobre as relações intratrinitárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a imagem do olhar erguido e usa sintaxe natural, sem explicitar “para cima”, já inerente a “ergueu os olhos” neste contexto.
