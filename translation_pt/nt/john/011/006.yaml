    issue: «ainda dois dias» introduz possível noção de duração adicional.
    rationale: Embora o contexto possa levar leitores a entender uma demora, δύο ἡμέρας exprime diretamente a duração de dois dias. «Ainda» tende a comunicar «mais dois dias», nuance que o texto grego deste versículo não formula explicitamente. «Então» corresponde melhor a τότε, preservando a sequência narrativa sem acrescentar essa implicação.
