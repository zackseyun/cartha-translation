  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: pt
  text: Assim, quando ouviu que Lázaro estava doente[a], permaneceu então dois dias no lugar onde estava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que Lázaro está doente». O grego emprega o presente depois de «ouviu», mas em português é natural usar o imperfeito neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Assim, quando
  rationale: Expressa de modo natural tanto a progressão/inferência narrativa de οὖν quanto o valor temporal de ὡς.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Mantém o sentido comum e direto do aoristo de ἀκούω, sem acrescentar que foi informado.
- source_word: ὅτι ἀσθενεῖ
  choice: que Lázaro estava doente
  rationale: ἀσθενέω indica enfermidade física neste contexto. O nome explícito evita em português a ambiguidade pronominal sobre quem estava doente; o imperfeito é a sequência temporal mais natural após «ouviu».
- source_word: τότε μὲν
  choice: ainda
  rationale: No contexto, a combinação introduz a permanência que antecede a partida posterior. «Ainda» comunica naturalmente a continuidade e o contraste leve de μέν, sem a formulação pesada «então, de fato».
- source_word: ἔμεινεν
  choice: permaneceu
  rationale: Traduz μένω como continuação no mesmo lugar e preserva um registro digno e corrente.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: no lugar onde estava
  rationale: Conserva a ênfase locativa e a leve redundância do grego, sem paráfrase excessiva.
- source_word: δύο ἡμέρας
  choice: dois dias
  rationale: Representa diretamente o acusativo de duração.
theological_decisions:
- issue: Implicação narrativa de Jesus permanecer no local após saber da doença de Lázaro
  choice: Declarar sem atenuação que ele permaneceu ainda dois dias
  alternative: Explicar no texto que a demora fazia parte de uma estratégia compassiva ou suavizar a tensão
  rationale: O versículo apresenta deliberadamente a tensão entre Jesus ouvir sobre a enfermidade e permanecer no local. A tradução não deve resolver essa tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome «Lázaro» explicita o referente do sujeito de ἀσθενεῖ, que o contexto grego torna claro. Mantém-se a construção locativa do original e a tensão narrativa, evitando uma explicação teológica dentro do texto.
