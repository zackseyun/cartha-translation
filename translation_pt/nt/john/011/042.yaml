  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: pt
  text: Mas eu sabia que sempre me ouves. Contudo, falei isso por causa da multidão que está ao redor, para que creiam que tu[a] me enviaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego dá ênfase a “tu”: “que tu me enviaste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδειν
  choice: eu sabia
  rationale: O mais-que-perfeito grego de οἶδα funciona com sentido passado; “eu sabia” é natural em português e não impõe valor de anterioridade que o contexto não exige.
- source_word: πάντοτέ μου ἀκούεις
  choice: sempre me ouves
  rationale: Preserva o valor habitual de πάντοτε e o sentido de ἀκούω com genitivo no contexto de oração, sem explicitar além do texto a ideia de atender ao pedido.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Contudo, falei isso por causa da multidão
  rationale: “Contudo” mantém o contraste de ἀλλά; “por causa de” traduz diretamente διά com acusativo, enquanto a finalidade em favor da multidão é esclarecida pela oração seguinte.
- source_word: τὸν περιεστῶτα
  choice: que está ao redor
  rationale: 'Expressa de modo natural o estado espacial indicado pelo particípio perfeito: a multidão se encontra em torno de Jesus.'
- source_word: εἶπον
  choice: falei isso
  rationale: O demonstrativo “isso” é uma explicitação contextual mínima e natural, remetendo às palavras pronunciadas publicamente por Jesus.
- source_word: ἵνα πιστεύσωσιν
  choice: para que creiam
  rationale: Mantém claramente a finalidade da oração com ἵνα e subjuntivo, em registro digno e corrente.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: que tu me enviaste
  rationale: Conserva o aoristo como passado simples e reproduz a presença enfática do pronome σύ mediante o pronome explícito “tu”.
theological_decisions:
- issue: Força da afirmação de que o Pai ouve Jesus
  choice: O Pai sempre ouve Jesus, e Jesus pronunciou essas palavras publicamente em benefício da multidão.
  alternative: Entender a frase sobretudo como uma afirmação geral sobre oração atendida.
  rationale: A tradução preserva tanto a comunhão expressa entre Jesus e o Pai quanto o propósito público declarado, sem acrescentar uma formulação doutrinária posterior.
- issue: Finalidade da oração pública
  choice: Levar a multidão presente a crer que o Pai enviou Jesus.
  alternative: Restringir a finalidade à autenticação deste milagre específico.
  rationale: A oração final explicita como objeto da fé o envio de Jesus; a tradução não estreita nem amplia essa afirmação.
- issue: Ênfase do pronome σύ
  choice: Manter “tu” explicitamente e registrar sua ênfase em nota.
  alternative: Traduzir apenas “que me enviaste”, deixando a pessoa indicada somente pela flexão verbal.
  rationale: O grego traz σύ de forma explícita e enfática; em português, “tu me enviaste” preserva essa forma sem recorrer a uma construção excessivamente marcada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “tu” por corresponder naturalmente ao pronome enfático grego e ao registro de oração, mantendo concordância padrão (“ouves”, “enviaste”).
