base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: pt
  text: E todo aquele que vive e crê em mim jamais morrerá.[a] Você crê nisso?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa uma negação enfática, reforçada por uma expressão com o sentido de “para sempre”; a ideia é: “de modo nenhum morrerá, jamais”.'
    reason: Esclarece a força de οὐ μή e εἰς τὸν αἰῶνα sem a ambiguidade de “não morrerá para sempre” em português.
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: todo aquele que vive e crê em mim
  rationale: Preserva os particípios presentes e a relação coordenada entre viver e crer; em português, “crer em mim” expressa naturalmente a confiança dirigida a Jesus.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: jamais morrerá
  rationale: A construção οὐ μή com o subjuntivo é uma negação futura enfática; “jamais morrerá” comunica essa força sem tornar a frase artificial.
- source_word: εἰς τὸν αἰῶνα
  choice: jamais
  rationale: Neste contexto, a expressão idiomática reforça a negação com o sentido de “nunca, para sempre”; sua força foi integrada a “jamais”, em vez de acrescentar o pouco natural “morrerá para sempre”.
- source_word: πιστεύεις τοῦτο;
  choice: Você crê nisso?
  rationale: Reproduz a pergunta direta no singular, em linguagem moderna, digna e amplamente compreensível.
theological_decisions:
- issue: A afirmação de que quem crê jamais morrerá diante da realidade da morte física
  choice: Manter a formulação absoluta “jamais morrerá”, sem explicar no corpo do versículo qual aspecto da morte está em vista
  alternative: Explicitar “jamais morrerá espiritualmente” ou “viverá para sempre”
  rationale: O grego formula uma negação enfática da morte, e o contexto imediato mantém uma tensão deliberada entre morte física, ressurreição e vida. Acrescentar “espiritualmente” ou substituir a afirmação por uma paráfrase resolveria uma tensão que o texto não resolve explicitamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o singular da pergunta e evita regionalismos; “crê” conserva o vocabulário bíblico corrente sem soar arcaico.
