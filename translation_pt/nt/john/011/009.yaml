id: JHN.11.9
reference: John 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: pt
  text: 'Jesus respondeu: “Não há doze horas no dia?[a] Se alguém anda de dia, não tropeça, porque vê a luz deste mundo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não são doze as horas do dia?”'
    reason: lexical_alternative
  - marker: b
    text: A expressão “a luz deste mundo” também pode evocar o tema mais amplo da luz divina no Evangelho de João; o texto, porém, mantém a imagem sem explicá-la.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: É o equivalente narrativo usual e natural, sem acrescentar uma nuance ausente do grego.
- source_word: Οὐχὶ
  choice: Não há
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; esta formulação conserva essa força em português corrente.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: há doze horas no dia
  rationale: Expressa de modo idiomático a divisão convencional do período diurno em doze horas, preservando a alternativa mais formal em nota.
- source_word: ἐάν τις περιπατῇ
  choice: Se alguém anda
  rationale: Mantém a condição e o referente humano genérico no singular, de maneira natural em português.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: de dia
  rationale: É a expressão portuguesa corrente para andar durante o período de luz e mantém o contraste contextual com a noite.
- source_word: προσκόπτει
  choice: tropeça
  rationale: Preserva tanto a imagem literal quanto sua possível dimensão figurada; “esbarra” seria mais estreito.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Conserva o sentido lexical básico e permite a ressonância temática joanina sem explicitá-la indevidamente.
- source_word: τοῦ κόσμου τούτου
  choice: deste mundo
  rationale: Reproduz naturalmente o genitivo e a força do demonstrativo τούτου.
- source_word: βλέπει
  choice: vê
  rationale: Traduz diretamente o presente do indicativo, sem acrescentar a ideia modal de capacidade presente em “pode ver”.
theological_decisions:
- issue: Possível força simbólica de “luz” no contexto joanino
  choice: Manter no texto principal a imagem comum da luz, sem identificar explicitamente a luz com Jesus ou com a orientação divina
  alternative: Explicitar “luz” como referência a Jesus ou à iluminação divina
  rationale: Embora “luz” tenha forte ressonância teológica em João, a formulação imediata funciona como observação proverbial. A tradução deixa aberta a profundidade simbólica sem resolver a tensão interpretativa.
- issue: Referência humana genérica em τις
  choice: Usar “alguém” e omitir um pronome subsequente desnecessário
  alternative: Usar “qualquer pessoa” ou inserir “ele”
  rationale: O grego emprega um referente singular indefinido, e o português preserva esse número naturalmente por meio de “alguém” e dos verbos no singular, sem precisar introduzir marca de gênero inexistente nas formas verbais gregas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “De dia” é preferido a “durante o dia” por concisão e naturalidade; “tropeça” preserva a abertura entre sentido literal e figurado.
