  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: pt
  text: Assim, quando Jesus chegou, constatou que Lázaro já estava no túmulo havia quatro dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: quando Jesus chegou
  rationale: O particípio aoristo expressa uma ação temporalmente anterior ao verbo principal; esta formulação é natural em português narrativo e preserva a relação temporal.
- source_word: οὖν
  choice: Assim
  rationale: Aqui funciona como conectivo narrativo ligado ao contexto anterior, sem exigir uma conclusão lógica forte.
- source_word: εὗρεν
  choice: constatou
  rationale: Neste contexto, εὑρίσκω indica tomar conhecimento ou verificar uma situação, não encontrar fisicamente Lázaro; “constatou” comunica esse sentido com clareza.
- source_word: αὐτὸν
  choice: Lázaro
  rationale: O pronome retoma Lázaro no contexto imediato. Explicitar o referente evita ambiguidade em português sem acrescentar informação nova.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: já estava no túmulo havia quatro dias
  rationale: A construção idiomática grega indica duração decorrida. “Havia quatro dias” é uma expressão portuguesa natural, e “já” preserva ἤδη.
- source_word: μνημείῳ
  choice: túmulo
  rationale: μνημεῖον designa aqui o local de sepultamento; “túmulo” é preciso, corrente e adequado ao contexto joanino.
theological_decisions:
- issue: Explicitação do referente de αὐτόν
  choice: Nomear Lázaro explicitamente
  alternative: Manter o pronome “ele”
  rationale: O referente está claro no contexto grego, mas o nome torna a frase portuguesa imediatamente compreensível sem resolver qualquer questão doutrinária.
- issue: Sentido de εὗρεν na chegada de Jesus
  choice: Traduzir por “constatou”
  alternative: Traduzir literalmente por “encontrou”
  rationale: A frase descreve Jesus tomando conhecimento da duração do sepultamento. “Constatou” evita a impressão inadequada de que ele encontrou Lázaro em pessoa fora da situação indicada pelo túmulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando o conectivo narrativo, a anterioridade da chegada e a duração de quatro dias.
