id: JHN.11.15
reference: John 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: pt
  text: E, para o bem de vocês, alegro-me por não ter estado lá, para que creiam.[a] Mas vamos até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “venham a crer”. O aoristo do subjuntivo grego pode enfatizar a chegada à fé, embora “creiam” seja mantido no texto como tradução mais ampla e menos interpretativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: alegro-me
  rationale: Preserva o sentido positivo do presente indicativo e mantém um tom digno e natural; “regozijo-me” seria mais solene e menos corrente.
- source_word: δι’ ὑμᾶς
  choice: por causa de vocês
  rationale: Expressa a relação da alegria de Jesus com os discípulos. No contexto, a frase aponta para o benefício deles, explicitado por “para que creiam”, sem acrescentar uma formulação ausente do grego.
- source_word: ἵνα πιστεύσητε
  choice: para que creiam
  rationale: Mantém a construção de finalidade com ἵνα e traduz πιστεύω pelo verbo joanino usual “crer”. O possível valor ingressivo do aoristo é registrado em nota, sem ser imposto ao texto principal.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: por não ter estado lá
  rationale: Em português, a construção com “alegrar-se por” comunica naturalmente o conteúdo da alegria. “Não ter estado lá” representa o imperfeito de εἰμί com ἐκεῖ sem acrescentar a ideia de presença física como termo explícito.
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca com clareza o contraste e a transição da explicação para a ação.
- source_word: ἄγωμεν
  choice: vamos
  rationale: O presente do subjuntivo na primeira pessoa do plural tem força exortativa; “vamos” é sua expressão mais natural em português atual.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Expressa o movimento em direção à pessoa mencionada. “Até ele” é idiomático e preserva a referência pessoal de αὐτόν.
theological_decisions:
- issue: Força de πιστεύσητε no contexto joanino
  choice: creiam
  alternative: venham a crer
  rationale: O aoristo do subjuntivo pode sugerir a entrada ou o crescimento na fé, mas não exige afirmar que os discípulos antes não criam. “Creiam” preserva a amplitude e a tensão teológica do texto; a possibilidade ingressiva fica indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A colocação pronominal em “alegro-me” mantém naturalidade sem excessiva informalidade; “vocês” explicita o plural de ὑμᾶς.
