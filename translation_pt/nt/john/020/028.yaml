  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: pt
  text: 'Tomé respondeu e lhe disse[a]: “Meu Senhor e meu Deus!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “Tomé respondeu e disse: ‘Meu Senhor e meu Deus!’”, entendendo as palavras como uma exclamação; contudo, o grego diz que ele falou “a ele”, o que sustenta que se dirigiu diretamente a Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Verbo narrativo comum com o sentido de responder; mantém de modo natural a construção grega.
- source_word: Θωμᾶς
  choice: Tomé
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἶπεν αὐτῷ
  choice: lhe disse
  rationale: Preserva o pronome dativo explícito αὐτῷ e indica que as palavras foram dirigidas a ele, sem substituir o pronome por “Jesus”.
- source_word: Ὁ κύριός μου
  choice: Meu Senhor
  rationale: “Senhor” conserva tanto a reverência quanto o peso cristológico de κύριος; o possessivo μου é expresso por “meu”.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação direta entre os dois títulos.
- source_word: ὁ θεός μου
  choice: meu Deus
  rationale: Traduz diretamente θεός e preserva a confissão pessoal expressa por μου.
theological_decisions:
- issue: Se as palavras de Tomé são uma confissão dirigida diretamente a Jesus ou uma exclamação não dirigida a ele
  choice: 'Confissão direta a Jesus: “Meu Senhor e meu Deus!”'
  alternative: Exclamação dirigida a Deus sem identificar diretamente Jesus como Senhor e Deus
  rationale: O grego declara explicitamente que Tomé “lhe disse” (αὐτῷ); além disso, as formas nominativas com artigo podem funcionar como vocativos no grego koiné. A tradução conserva essa força sem atenuar nem ampliar a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lhe disse” mantém o destinatário pronominal explícito do grego; a exclamação preserva a intensidade da confissão.
