reference: John 20:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: pt
  text: 'Então Jesus lhes disse novamente: “Paz a vocês.[a] Assim como o Pai me enviou, eu também envio vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais tradicional: “A paz esteja com vocês.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a ligação com a cena anterior de modo natural em português, sem tornar a inferência mais forte do que o contexto exige.
- source_word: πάλιν
  choice: novamente
  rationale: Indica claramente que Jesus repete a saudação do versículo anterior; é corrente e digno no registro pretendido.
- source_word: Εἰρήνη ὑμῖν
  choice: Paz a vocês
  rationale: Preserva a concisão da expressão nominal grega e o caráter semítico da saudação, em linguagem compreensível no português moderno.
- source_word: καθὼς
  choice: Assim como
  rationale: Introduz com clareza a correspondência entre o envio de Jesus pelo Pai e o envio dos discípulos por Jesus.
- source_word: ἀπέσταλκέν
  choice: me enviou
  rationale: O perfeito grego apresenta o envio realizado e ainda relevante. Em português, o pretérito perfeito simples é a forma mais natural e pode comunicar essa relevância no contexto, evitando o valor iterativo que o pretérito perfeito composto frequentemente possui.
- source_word: ὁ πατήρ
  choice: o Pai
  rationale: Mantém o artigo e a designação joanina sem acrescentar o possessivo “meu”, ausente no grego.
- source_word: κἀγὼ
  choice: eu também
  rationale: Expressa a combinação de καί e ἐγώ, preservando tanto a coordenação quanto a ênfase no sujeito dentro da comparação.
- source_word: πέμπω
  choice: envio
  rationale: Reproduz naturalmente o presente grego e permite entender a comissão como ato presente, sem exigir uma forma progressiva pouco necessária em português.
theological_decisions:
- issue: Relação entre o envio de Jesus pelo Pai e o envio dos discípulos por Jesus
  choice: “Assim como o Pai me enviou, eu também envio vocês.”
  alternative: “Do mesmo modo como o Pai me enviou, assim também estou enviando vocês.”
  rationale: A formulação mantém a analogia missionária afirmada pelo texto, mas não a expande para declarar identidade absoluta de autoridade, modo ou ofício. Preserva, assim, o peso e a tensão teológicos da comparação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” oferece naturalidade no plural sem regionalismo excessivo. A ordem e a pontuação mantêm a progressão concisa da fala de Jesus; a nota registra a saudação tradicional sem substituir no texto principal a forma nominal mais próxima do grego.
