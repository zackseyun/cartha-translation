review_pass:
  verdict: revise
  source_fidelity: A redação preserva adequadamente a relação explicativa de γάρ, o singular de γραφή, a necessidade expressa por δεῖ e a voz ativa de ἀναστῆναι. Contudo, ᾔδεισαν (forma de mais-que-perfeito de οἶδα, com valor passado/imperfeito de ‘saber, compreender’) é mais bem vertido aqui por um imperfeito em português do que por ‘tinham compreendido’.
  naturalness: ‘Ainda não compreendiam’ é mais idiomático e expressa melhor a compreensão que ainda lhes faltava naquele ponto da narrativa. A introdução explícita de ‘que’ após os dois-pontos torna clara a oração de conteúdo introduzida por ὅτι.
  terminology: ‘Escritura’, ‘era necessário’, ‘ressuscitasse’ e ‘dentre os mortos’ são adequados, dignos e compreensíveis. ‘Ressuscitasse’ conserva a formulação ativa do grego sem impor uma explicação doutrinária sobre agência.
  issues:
  - severity: low
    issue: Tempo/aspecto de ‘tinham compreendido’
    rationale: Embora seja compreensível, o mais-que-perfeito português sugere mais fortemente uma compreensão pontual não realizada antes de outro evento passado. No contexto, ᾔδεισαν funciona naturalmente como estado continuado de não compreender; ‘não compreendiam’ comunica isso com maior fluência.
  - severity: low
    issue: Omissão de conectivo explícito para ὅτι
    rationale: Os dois-pontos podem introduzir conteúdo em português, mas incluir ‘que’ após eles representa de modo mais transparente a oração de conteúdo do grego e melhora a leitura.
