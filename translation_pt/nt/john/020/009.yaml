  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: pt
  text: 'Pois ainda não compreendiam a Escritura: que era necessário que ele ressuscitasse dentre os mortos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: ainda não
  rationale: Expressa naturalmente em português que, até aquele momento, a compreensão ainda não havia ocorrido.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a relação explicativa com a afirmação anterior e o fluxo do discurso.
- source_word: ᾔδεισαν
  choice: tinham compreendido
  rationale: Embora o verbo tenha o sentido básico de saber ou conhecer, neste contexto indica captar o sentido da Escritura; o mais-que-perfeito composto se ajusta ao quadro narrativo passado.
- source_word: τὴν γραφὴν
  choice: a Escritura
  rationale: Preserva o singular grego e a referência à escrita sagrada autorizada, sem decidir se está em vista uma passagem específica ou o testemunho bíblico de modo geral.
- source_word: ὅτι
  choice: ':'
  rationale: Os dois-pontos introduzem de modo natural em português o conteúdo da Escritura ainda não compreendido, sem alterar a relação explicativa da oração.
- source_word: δεῖ
  choice: era necessário
  rationale: Comunica a força de necessidade, inclusive sua possível dimensão divina, e se integra naturalmente à perspectiva passada da narrativa.
- source_word: αὐτὸν
  choice: ele
  rationale: Em português natural, funciona como sujeito da oração introduzida por 'que'.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Expressa a ideia de sair do meio dos mortos e conserva o plural substantivado do grego de maneira idiomática na linguagem bíblica portuguesa.
- source_word: ἀναστῆναι
  choice: ressuscitasse
  rationale: Preserva a forma ativa do infinitivo grego e comunica claramente a ressurreição no contexto.
theological_decisions:
- issue: Expressão da ressurreição e agência
  choice: que ele ressuscitasse dentre os mortos
  alternative: que ele fosse ressuscitado dentre os mortos
  rationale: O grego emprega o infinitivo ativo ἀναστῆναι. A redação principal mantém essa voz, sem harmonizá-la com formulações passivas encontradas em outros textos nem determinar além do que esta frase diz a agência da ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Pois' conserva a ligação explicativa; 'era necessário que' soa natural e mantém a necessidade expressa por δεῖ. Não se acrescentou nota, pois a forma ativa é representada diretamente no texto e a alternativa passiva não constitui variante textual.
