  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: pt
  text: Então os discípulos voltaram para casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «para si mesmos» ou «para o seu próprio lugar». A expressão grega pode referir-se ao lugar onde estavam hospedados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: voltaram
  rationale: O aoristo de ἀπέρχομαι indica que deixaram o local; em combinação com πάλιν e o destino expresso por πρὸς αὑτούς, «voltaram» comunica naturalmente o movimento de retorno.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação ou consequência narrativa, e «Então» preserva essa ligação em português corrente.
- source_word: πάλιν
  choice: voltaram
  rationale: O sentido de retorno de πάλιν foi integrado ao verbo «voltaram», evitando a formulação pouco natural «foram embora novamente» sem perder a ideia de volta.
- source_word: πρὸς αὑτούς
  choice: para onde estavam hospedados
  rationale: A expressão literalmente reflexiva («para si mesmos») provavelmente designa o lugar ao qual pertenciam ou onde estavam alojados. A tradução contextual evita afirmar especificamente que eram suas casas, algo que o grego não explicita.
- source_word: οἱ μαθηταί
  choice: os discípulos
  rationale: É a designação narrativa habitual dos seguidores de Jesus e corresponde ao uso consagrado e claro em português.
theological_decisions: []
