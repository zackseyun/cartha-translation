source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: pt
  text: 'E eles lhe perguntaram: “Mulher, por que você está chorando?” Ela lhes respondeu: “Levaram o meu Senhor[a], e não sei onde o colocaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu mestre”. O termo grego também pode funcionar como título respeitoso, embora seja normalmente traduzido por “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Mulher
  rationale: O vocativo é uma forma direta e respeitosa de tratamento no contexto joanino. “Mulher” preserva a forma do grego sem acrescentar afeto ou formalidade não expressos.
- source_word: τί κλαίεις
  choice: por que você está chorando?
  rationale: Embora τί seja literalmente “o que”, nesta construção interrogativa pergunta pela razão do choro. “Por que você está chorando?” é natural em português e mantém o aspecto contínuo do presente κλαίεις.
- source_word: Ἦραν
  choice: Levaram
  rationale: O aoristo apresenta a retirada como ação concluída. O pretérito perfeito simples é idiomático em português e, no contexto do túmulo, “levaram” comunica naturalmente que o corpo foi retirado.
- source_word: τὸν κύριόν μου
  choice: o meu Senhor
  rationale: “Senhor” preserva tanto o uso respeitoso quanto a possível ressonância cristológica de κύριος, sem decidir entre esses sentidos.
- source_word: οὐκ οἶδα
  choice: não sei
  rationale: Embora οἶδα tenha forma perfeita, funciona como verbo de estado presente; “não sei” é a equivalência portuguesa natural.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: onde o colocaram
  rationale: τίθημι significa aqui pôr ou colocar. “Onde o colocaram” é claro e digno, além de evitar sugerir especificamente o ato de sepultar.
- source_word: ἐκεῖνοι / αὐτοῖς
  choice: eles / lhes
  rationale: Os pronomes retomam os dois anjos mencionados no contexto. Em português, a referência permanece clara sem explicitar novamente “os anjos”.
theological_decisions:
- issue: Sentido de κύριος na fala de Maria
  choice: meu Senhor
  alternative: meu mestre
  rationale: κύριος pode funcionar como título respeitoso e também carregar peso cristológico no Evangelho de João. “Senhor” conserva essa abertura sem reduzir o termo a uma relação meramente social.
- issue: Tom do vocativo Γύναι
  choice: Mulher
  alternative: Senhora / Minha senhora
  rationale: O termo grego não é rude neste contexto, mas também não contém por si só uma expressão afetiva. A tradução direta preserva o tom e a consistência joanina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O uso de “você” evita a ambiguidade regional de “tu” e soa natural na pergunta direta; “lhe/lhes” mantém fluidez narrativa. A tradução preserva a concisão e a tensão semântica do original.
