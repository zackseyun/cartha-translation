  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: pt
  text: E, inclinando-se para olhar lá dentro[a], ele vê os panos de linho ali estendidos, mas não entrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inclinando-se, vê os panos de linho estendidos”; o particípio grego κείμενα pode ser ligado mais diretamente a “panos de linho”, sem que se explicite “ali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: inclinando-se para olhar lá dentro
  rationale: O particípio aoristo descreve tanto o movimento físico de se inclinar à entrada do túmulo quanto o ato de olhar para dentro.
- source_word: βλέπει
  choice: ele vê
  rationale: Mantém o presente histórico do grego e a vivacidade característica da narrativa joanina.
- source_word: κείμενα
  choice: no chão
  rationale: No contexto do túmulo, traduz de modo natural o estado dos panos, que estavam ali estendidos ou depositados; a nota preserva a possibilidade de uma formulação mais estritamente literal.
- source_word: τὰ ὀθόνια
  choice: os panos de linho
  rationale: É uma tradução direta do termo para os panos de linho usados no sepultamento, sem acrescentar ao texto principal uma explicação já indicada pelo contexto.
- source_word: οὐ μέντοι
  choice: mas não
  rationale: Expressa com naturalidade o contraste moderado entre ver os panos e não entrar.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo é traduzido no pretérito perfeito, em contraste natural com o presente histórico de βλέπει.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. Preserva-se o presente histórico em “vê”, enquanto “entrou” representa naturalmente o aoristo; a nota registra a ambiguidade sintática e evita tornar explícito no texto algo que o grego deixa implícito.
