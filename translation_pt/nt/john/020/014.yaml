  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: pt
  text: Depois de dizer essas coisas, ela se virou e viu Jesus em pé, e não sabia que era Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não reconheceu que era Jesus”. Literalmente, o grego diz: “não sabia que é Jesus”, indicando que ela não conhecia a identidade dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo grego e retoma naturalmente as palavras anteriores no fluxo narrativo.
- source_word: εἰποῦσα
  choice: Depois de dizer
  rationale: Expressa em português natural a anterioridade do particípio aoristo em relação à ação principal.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: ela se virou
  rationale: Equivalente idiomático moderno para o movimento de voltar-se para o que estava atrás dela.
- source_word: θεωρεῖ
  choice: viu
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, usual na narrativa portuguesa; o verbo comunica percepção visual sem intensificação indevida.
- source_word: ἑστῶτα
  choice: em pé
  rationale: Reproduz o estado ou postura indicado pelo particípio perfeito de ἵστημι, sem acrescentar uma localização que não está expressa.
- source_word: οὐκ ᾔδει
  choice: não sabia
  rationale: Mantém o sentido básico de οἶδα e evita inserir no texto principal a interpretação mais específica de falta de reconhecimento.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: que era Jesus
  rationale: Forma natural de expressar em português a identificação cuja realidade Maria desconhecia; o pretérito harmoniza com a narração sem negar o presente do grego.
theological_decisions:
- issue: Identificação narrativa de Jesus ressuscitado
  choice: não sabia que era Jesus
  alternative: não reconheceu que era Jesus
  rationale: O texto afirma que Maria desconhecia a identidade de quem via, mas não explica a causa. A formulação principal preserva essa abertura, enquanto a alternativa explicita a noção contextual de reconhecimento.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez natural para leitores brasileiros e compreensão internacional. A conjunção “mas” comunica o contraste contextual expresso por καί sem tornar a frase artificial; o marcador de nota foi colocado junto à afirmação que esclarece.
