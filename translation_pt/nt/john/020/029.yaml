id: JHN.20.29
reference: John 20:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Porque você me viu, creu?[a] Bem-aventurados os que não viram e creram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque você me viu, creu.” O grego pode ser entendido como pergunta ou como declaração.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Jesus lhe disse
  rationale: O presente histórico grego é traduzido naturalmente pelo pretérito perfeito em português; o pronome indireto preserva a referência a Tomé.
- source_word: Ὅτι
  choice: Porque
  rationale: Introduz de modo natural a causa associada à fé de Tomé, sem eliminar a possibilidade de a oração ser interrogativa ou declarativa.
- source_word: ἑώρακάς με
  choice: você me viu
  rationale: O pretérito perfeito composto seria pouco natural aqui no português brasileiro moderno; o pretérito perfeito simples comunica com clareza o ato concluído e relevante no contexto.
- source_word: πεπίστευκας
  choice: creu
  rationale: O pretérito perfeito simples é idiomático e conserva a relação entre o fato de ver e o ato de crer, sem introduzir uma distinção aspectual artificial em português.
- source_word: μακάριοι
  choice: Felizes
  rationale: Em uma bem-aventurança, 'felizes' expressa a condição favorecida declarada por Jesus em linguagem atual e amplamente compreensível; não se limita a uma emoção passageira no contexto.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: os que não viram e creram
  rationale: Reproduz de maneira concisa os particípios substantivados e mantém a conjunção simples καί, sem acrescentar 'mesmo assim' ou 'contudo'.
theological_decisions:
- issue: Força da primeira declaração de Jesus
  choice: 'Pergunta: “Porque você me viu, creu?”'
  alternative: 'Declaração: “Porque você me viu, creu.”'
  rationale: A leitura interrogativa é contextualmente plausível e aparece na pontuação editorial, sugerindo contraste ou censura branda; como os manuscritos antigos não traziam a pontuação moderna, a leitura declarativa permanece possível e é registrada em nota.
- issue: Relação entre não ver e crer
  choice: “não viram e creram”
  alternative: “não viram, mas creram”
  rationale: Mantém o καί grego como 'e', preservando o contraste implícito sem explicitá-lo por meio de uma conjunção adversativa ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O uso de “você” torna explícito o singular presente nas formas verbais gregas; a formulação evita construções excessivamente literais e conserva a ambiguidade de pontuação por meio da nota.
