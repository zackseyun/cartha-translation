  source_fidelity: A tradução reproduz corretamente a relação causal introduzida por ὅτι, a referência singular a Tomé e o contraste entre ver e crer. A leitura interrogativa é defensável, e a nota preserva adequadamente a alternativa declarativa, já que a pontuação não é indicada pelos manuscritos antigos. A coordenação simples por “e” reflete καί sem explicitar indevidamente a contrariedade.
  naturalness: “Jesus lhe disse” e “Porque você me viu, creu?” são naturais em português moderno de ampla compreensão, inclusive no Brasil. “Os que não viram e creram” é conciso e idiomático. A alteração proposta mantém esse registro.
  terminology: “Felizes” pode traduzir μακάριοι em certos contextos, mas nesta formulação de bem-aventurança perde a ressonância e o valor declarativo tradicionalmente associados ao termo. “Bem-aventurados” é o equivalente mais preciso e estabelecido para μακάριοι, sem impor uma leitura doutrinária particular.
