  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: pt
  text: Tomé, um dos Doze, chamado Dídimo[a], não estava com eles quando Jesus veio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dídimo” significa “Gêmeo” em grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: sem conectivo explícito
  rationale: Aqui δέ assinala uma transição narrativa leve. Em português, a mudança de foco para Tomé flui naturalmente sem introduzir um contraste forte nem um advérbio temporal ausente do grego.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: um dos Doze
  rationale: Expressão idiomática que identifica Tomé como integrante do grupo reconhecido dos Doze; a inicial maiúscula preserva esse valor de designação.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: chamado Dídimo[a]
  rationale: Dídimo é a forma tradicional portuguesa do nome grego, cujo significado lexical, «Gêmeo», é esclarecido em nota para manter transparência sem tornar o epíteto estranho no texto corrido.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: não estava com eles
  rationale: Reprodução direta e natural do imperfeito de εἰμί com μετά e genitivo, indicando a ausência de Tomé naquele momento.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: quando Jesus veio
  rationale: Tradução direta de ἔρχομαι no aoristo; «veio» é natural e evita explicitar mais do que o texto diz.
theological_decisions:
- issue: Forma de Δίδυμος
  choice: Dídimo no texto, com o significado «Gêmeo» em nota
  alternative: traduzir diretamente como «Gêmeo»
  rationale: A opção preserva a forma pela qual o personagem é tradicionalmente identificado em português e, pela nota, comunica o significado do grego sem introduzir qualquer interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção é concisa e acompanha de perto a ordem e o conteúdo do grego.
