  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: pt
  text: Se vocês perdoarem os pecados de alguém, esses pecados estão perdoados para essa pessoa; se os retiverem, estão retidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir de modo mais simples: “Se vocês perdoarem os pecados de alguém, eles serão perdoados; se os retiverem, serão retidos”. Em ambas as orações, o grego emprega o perfeito passivo, que pode destacar uma ação concluída cujo resultado permanece.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Se ... de alguém
  rationale: A construção com ἄν e o subjuntivo introduz uma condição indefinida. “Se ... de alguém” preserva tanto a força condicional quanto a referência indeterminada.
- source_word: ἀφῆτε
  choice: vocês perdoarem
  rationale: No contexto de pecados, ἀφίημι significa naturalmente “perdoar”. A forma com “vocês” é clara e amplamente compreensível em português moderno.
- source_word: τὰς ἁμαρτίας
  choice: os pecados
  rationale: Mantém o objeto explícito e o artigo do grego de maneira natural em português.
- source_word: ἀφέωνται
  choice: terão sido perdoados
  rationale: O futuro composto em português, dentro desta construção condicional, representa o perfeito passivo grego como ação já realizada com resultado vigente, sem explicitar o agente.
- source_word: αὐτοῖς
  choice: lhe
  rationale: O pronome dativo retoma a pessoa indefinida expressa por “alguém”; “lhe” comunica de modo conciso que os pecados foram perdoados àquela pessoa.
- source_word: κρατῆτε
  choice: os retiverem
  rationale: κρατέω contrasta aqui com perdoar e significa reter os pecados. O pronome “os” retoma claramente “os pecados”.
- source_word: κεκράτηνται
  choice: terão sido retidos
  rationale: Preserva o paralelismo com a primeira oração e representa o perfeito passivo sem acrescentar um agente ou uma interpretação doutrinária.
theological_decisions:
- issue: Se a formulação deve indicar que os discípulos produzem independentemente o perdão ou que sua ação corresponde a uma realidade divina anterior.
  choice: 'Manter as formas passivas e resultativas: “terão sido perdoados” e “terão sido retidos”.'
  alternative: Traduzir “são perdoados/são retidos” ou explicitar “Deus os terá perdoado/retido”.
  rationale: O grego não identifica expressamente o agente das passivas. A tradução conserva essa abertura e a tensão entre a ação dos discípulos e a ação divina, sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A repetição foi moderada por meio de pronomes, preservando-se o paralelismo e as passivas do original.
