source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: pt
  text: 'Então ela corre e vai até Simão Pedro e o outro discípulo[a], a quem Jesus amava, e lhes diz: “Tiraram o Senhor do túmulo, e não sabemos onde o colocaram.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “o outro discípulo, a quem Jesus amava”. O verbo usado aqui é φιλέω, que pode realçar afeição; outra tradução possível é “de quem Jesus gostava muito”.'
    reason: lexical_alternative
  - marker: b
    text: Maria diz “não sabemos”, preservando a primeira pessoa do plural no grego. Alguns entendem que ela inclui outras mulheres que estavam com ela, mas o texto não explica aqui a razão do plural.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Então ela corre e vai
  rationale: Mantém os presentes históricos e a vivacidade narrativa. “Então” expressa a consequência narrativa de οὖν; “vai até” é natural em português para o movimento em direção a Pedro.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: até Simão Pedro e o outro discípulo
  rationale: “Discípulo” é o equivalente corrente de μαθητής nos Evangelhos. A repetição de πρός não precisa ser reproduzida para que o português preserve claramente os dois destinatários.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: a quem Jesus amava
  rationale: φιλέω denota aqui amor ou afeição. “Amava” é natural, digno e preserva o aspecto durativo do imperfeito sem impor uma distinção rígida entre φιλέω e ἀγαπάω.
- source_word: λέγει αὐτοῖς
  choice: lhes diz
  rationale: Conserva o presente histórico e traduz de modo conciso o pronome plural αὐτοῖς.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: Tiraram o Senhor do túmulo
  rationale: O pretérito perfeito é a forma natural em português para a ação concluída e ainda relevante. “Tiraram ... do túmulo” comunica diretamente ἦραν ... ἐκ, enquanto “Senhor” preserva o título κύριος.
- source_word: οὐκ οἴδαμεν
  choice: não sabemos
  rationale: Mantém rigorosamente a primeira pessoa do plural do grego, sem harmonizá-la com o fato de Maria ser a única mulher mencionada no contexto imediato.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: onde o colocaram
  rationale: “Colocaram” traduz τίθημι de modo claro e idiomático, sem acrescentar que o corpo teria sido sepultado novamente; o pronome “o” retoma o Senhor.
theological_decisions:
- issue: Tradução de κύριος como título de Jesus
  choice: o Senhor
  alternative: o Mestre
  rationale: “Senhor” é o título cristológico normal neste contexto e preserva a força reverencial do grego sem reduzi-lo a uma simples forma de tratamento.
- issue: Plural οἴδαμεν na fala de Maria
  choice: não sabemos
  alternative: não sei
  rationale: O plural explícito é preservado. A tradução não decide se Maria inclui outras mulheres ou outras pessoas, pois o próprio versículo não explica a referência.
- issue: Relação entre φιλέω e outras palavras gregas para amar
  choice: a quem Jesus amava
  alternative: de quem Jesus gostava muito
  rationale: “Amava” preserva adequadamente o afeto expresso por φιλέω sem enfraquecê-lo nem construir uma distinção teológica obrigatória entre verbos gregos de amor.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os presentes históricos foram mantidos para conservar a vivacidade do relato. A colocação dos pronomes segue uso brasileiro natural sem perder formalidade; evitou-se linguagem arcaica e também excessivamente coloquial.
