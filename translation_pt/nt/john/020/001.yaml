  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: pt
  text: No primeiro dia da semana[a], Maria Madalena vai cedo ao túmulo, quando ainda estava escuro, e vê que a pedra havia sido retirada do túmulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em um dos sábados”; expressão idiomática que significa “no primeiro dia da semana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: No primeiro dia da semana
  rationale: A expressão é um idiomatismo grego para o primeiro dia da semana. O δέ funciona como conector narrativo leve e não exige uma palavra específica em português neste contexto.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Forma tradicional, natural e amplamente reconhecida em português para o nome e o gentílico.
- source_word: ἔρχεται
  choice: vai
  rationale: O presente histórico é preservado. Em português, “vai ao túmulo” expressa naturalmente o movimento da personagem até o local; “vem” sugeriria indevidamente movimento em direção ao narrador ou ao leitor.
- source_word: πρωῒ
  choice: cedo
  rationale: Indica uma hora matutina inicial sem especificar que já havia amanhecido, o que se harmoniza com a informação seguinte de que ainda estava escuro.
- source_word: σκοτίας ἔτι οὔσης
  choice: quando ainda estava escuro
  rationale: Transforma o genitivo absoluto em uma oração temporal natural, preservando a circunstância contínua.
- source_word: εἰς τὸ μνημεῖον
  choice: ao túmulo
  rationale: Neste contexto, μνημεῖον designa claramente o lugar de sepultamento.
- source_word: βλέπει
  choice: vê
  rationale: Mantém o presente histórico e a vivacidade narrativa do original.
- source_word: τὸν λίθον ἠρμένον
  choice: que a pedra havia sido retirada
  rationale: O particípio perfeito passivo indica uma ação já concluída cujo resultado permanecia visível quando Maria chegou.
- source_word: ἐκ τοῦ μνημείου
  choice: do túmulo
  rationale: Expressa a remoção para fora do túmulo sem acrescentar “entrada”, termo implícito no cenário, mas não explícito no grego.
theological_decisions:
- issue: Tempo narrativo no relato da ressurreição
  choice: Preservar os presentes históricos em “vai” e “vê”
  alternative: 'Converter os verbos para o pretérito: “foi” e “viu”'
  rationale: Os presentes históricos são uma característica significativa da narração grega e permanecem claros e naturais em português, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem dos acontecimentos e a vivacidade dos presentes históricos foram preservadas, evitando explicitações não presentes no texto grego.
