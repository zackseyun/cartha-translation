id: JHN.20.8
reference: John 20:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: pt
  text: Então, entrou também o outro discípulo, que havia chegado primeiro ao túmulo; ele viu e creu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz apenas “creu”, sem declarar explicitamente em que ele creu. Pode significar que creu na ressurreição, na evidência diante dele ou no relato anterior.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Então
  rationale: Marca a progressão narrativa com leve valor conclusivo; “Então” expressa ambos de modo natural, sem tornar a inferência mais forte do que no grego.
- source_word: εἰσῆλθεν καὶ ὁ ἄλλος μαθητής
  choice: entrou também o outro discípulo
  rationale: “Entrou” traduz diretamente o movimento para dentro do túmulo, e “também” comunica que esse discípulo fez o que Pedro acabara de fazer.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: que havia chegado primeiro ao túmulo
  rationale: A forma verbal composta indica com naturalidade que essa chegada ocorreu antes da entrada narrada; “túmulo” designa com precisão o lugar do sepultamento.
- source_word: καὶ εἶδεν
  choice: ele viu
  rationale: O pronome explícito torna claro o sujeito em português, enquanto “viu” preserva o sentido direto do verbo grego.
- source_word: ἐπίστευσεν
  choice: creu
  rationale: “Creu” mantém o verbo sem objeto expresso, como no grego, preservando a concisão e a ambiguidade quanto ao conteúdo da crença.
theological_decisions:
- issue: O conteúdo daquilo em que o discípulo creu
  choice: 'Manter o verbo de forma absoluta: “creu”.'
  alternative: “creu que Jesus havia ressuscitado”, “acreditou no relato de Maria” ou “passou a ter fé”.
  rationale: O grego não declara em que ou no que ele creu. Especificar o conteúdo resolveria uma questão interpretativa que o texto deixa em aberto, especialmente diante do versículo seguinte.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A ordem “entrou também o outro discípulo” acompanha de perto o movimento do grego sem soar artificial; o ponto e vírgula preserva a sequência estreita entre entrar, ver e crer.
