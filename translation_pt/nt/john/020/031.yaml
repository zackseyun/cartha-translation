id: JHN.20.31
reference: John 20:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: pt
  text: Mas estas coisas foram escritas para que vocês creiam[a] que Jesus é o Messias[b], o Filho de Deus, e para que, crendo, tenham vida em seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem «passem a crer»; outros trazem «continuem crendo». O texto principal traduz a expressão de modo abrangente: «creiam».'
    reason: textual_variant
  - marker: b
    text: Ou «o Cristo». O título grego Christós é traduzido aqui como «Messias» para expressar seu sentido como título.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: estas coisas
  rationale: Retoma os sinais e o conteúdo escrito mencionados no contexto; a forma explícita é natural e clara em português.
- source_word: δὲ
  choice: Mas
  rationale: Marca uma transição com leve contraste em relação ao versículo anterior.
- source_word: γέγραπται
  choice: foram escritas
  rationale: Expressa de modo natural o perfeito passivo grego, referindo-se ao ato de registrar por escrito; o resultado permanece no texto disponível ao leitor.
- source_word: ἵνα πιστεύητε
  choice: para que vocês creiam
  rationale: Mantém a finalidade da oração e evita definir excessivamente o aspecto verbal, relevante também por causa da variante textual.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: que Jesus é o Messias
  rationale: Apresenta diretamente o conteúdo da fé e traduz Χριστός como título messiânico, em vez de tratá-lo como nome próprio.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: o Filho de Deus
  rationale: Preserva com precisão o título cristológico e sua formulação tradicional e inteligível.
- source_word: καὶ ἵνα
  choice: e para que
  rationale: Mantém explícita a segunda oração coordenada de finalidade.
- source_word: πιστεύοντες
  choice: crendo
  rationale: O gerúndio reproduz de maneira concisa a relação adverbial do particípio com 'tenham', sem impor uma classificação rígida entre meio e circunstância concomitante.
- source_word: ζωὴν ἔχητε
  choice: tenham vida
  rationale: Traduz o substantivo sem acrescentar 'eterna', adjetivo ausente neste versículo.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: em seu nome
  rationale: Preserva a expressão joanina e sua densidade teológica sem paráfrase explicativa.
theological_decisions:
- issue: Tradução de Χριστός como título
  choice: Messias
  alternative: Cristo
  rationale: Χριστός funciona como título e corresponde ao conceito de 'Messias'; essa tradução torna seu sentido acessível sem apagar o contexto judaico.
- issue: Variação textual e aspecto de πιστεύητε
  choice: creiam
  alternative: passem a crer / continuem crendo
  rationale: O texto impresso do SBLGNT traz o presente do subjuntivo πιστεύητε, enquanto a variante aorista πιστεύσητε tem apoio manuscrito. 'Creiam' preserva a finalidade sem resolver indevidamente se o enfoque é começar ou continuar a crer.
- issue: Sentido de ζωή
  choice: vida
  alternative: vida eterna
  rationale: Embora 'vida' tenha forte conteúdo teológico em João, o adjetivo 'eterna' não aparece no grego deste versículo e não deve ser acrescentado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural de segunda pessoa e preserva o paralelismo das duas orações de finalidade. A única nota é colocada junto a «Messias» por ser o ponto mais próximo, dentro da oração, do verbo afetado; seu conteúdo identifica claramente a questão verbal.
