source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: pt
  text: Jesus fez muitos outros sinais diante dos discípulos[a], que não estão escritos neste livro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «milagres»; o grego diz «sinais», destacando atos que apontam para além de si mesmos, para quem Jesus é.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: muitos outros
  rationale: A expressão introduz uma conclusão e prepara o contraste com o versículo 31. Em português, «muitos outros» comunica naturalmente o conteúdo, sem representar de modo artificial cada partícula grega.
- source_word: σημεῖα
  choice: sinais
  rationale: Em João, o termo designa atos milagrosos que apontam para a identidade e a missão de Jesus; «sinais» preserva essa função teológica.
- source_word: ἐποίησεν
  choice: fez
  rationale: Tradução direta e idiomática do aoristo de ποιέω neste contexto; «realizou» seria possível, mas um pouco mais formal.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: diante dos discípulos
  rationale: Expressa de modo natural que os discípulos estavam presentes como testemunhas, sem acrescentar ao texto grego o possessivo «seus».
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: que não estão escritos
  rationale: Preserva a construção passiva e o estado resultante expresso pela perífrase perfeita grega. O plural concorda com «sinais».
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: neste livro
  rationale: «Livro» é a forma moderna e natural de designar aqui a obra escrita, sem a especificidade potencialmente distrativa de «rolo».
theological_decisions:
- issue: Uso joanino de σημεῖα
  choice: sinais
  alternative: milagres
  rationale: «Sinais» conserva a ênfase de João em atos que revelam quem Jesus é, sem reduzi-los apenas a manifestações de poder.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Diante dos discípulos» é mais conciso e natural do que «na presença dos discípulos», mantendo o sentido testemunhal do original.
