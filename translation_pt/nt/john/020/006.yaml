review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a progressão narrativa, o valor aditivo de καί, a entrada no túmulo e os panos de linho. O pretérito para os dois presentes históricos é uma opção idiomática legítima em português, devidamente explicada em nota. Contudo, «que o seguia» cria uma construção menos precisa, pois pode momentaneamente parecer uma oração relativa explicativa ligada a Simão Pedro, e o particípio grego expressa a circunstância de ele seguir o outro discípulo.
  naturalness: «Então Simão Pedro também chegou, seguindo-o, entrou no túmulo e viu os panos de linho ali» é mais claro e natural, sem perder a sequência concisa do grego. «Ali» comunica de forma econômica a localização indicada por κείμενα; não é necessário introduzir «estendidos», que é mais específico do que o particípio exige.
  terminology: «Simão Pedro», «túmulo» e «panos de linho» são escolhas adequadas e transparentes. A nota deve evitar propor «estendidos» como alternativa, pois κείμενα significa que os panos estavam postos/jaziam no local, sem necessariamente descrever que estavam estendidos.
  issues:
  - severity: medium
    issue: A expressão «que o seguia» é sintaticamente menos clara para ἀκολουθῶν αὐτῷ.
    rationale: Como oração relativa, ela pode soar como informação acessória sobre Pedro e torna menos direta a relação circunstancial do particípio com sua ação de chegar. «seguindo-o» reproduz essa relação de modo mais imediato.
  - severity: low
    issue: A alternativa da nota, «panos de linho estendidos ali», é excessivamente específica.
    rationale: κείμενα descreve os panos como estando/jazendo no local; não determina que estivessem estendidos.
  revised_text: Então Simão Pedro também chegou, seguindo-o, entrou no túmulo e viu os panos de linho ali[a].
  revised_footnotes:
  - marker: a
    text: O grego usa o presente histórico em «chega» e «vê»; aqui ambos são traduzidos no passado para dar fluidez à narrativa em português.
    reason: lexical_alternative
  revision_rationale: A revisão torna explícita e natural a função circunstancial de «seguindo-o» e remove uma alternativa de nota que acrescentava uma nuance não exigida pelo grego. Mantém-se o pretérito narrativo para os presentes históricos, bem como a terminologia do rascunho.
