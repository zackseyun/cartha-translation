- from: Então chegou também Simão Pedro, que o seguia, entrou no túmulo e viu os panos de linho ali[a].
  to: Então Simão Pedro também chegou, seguindo-o, entrou no túmulo e viu os panos de linho ali[a].
  rationale: A revisão torna explícita e natural a função circunstancial de «seguindo-o» e remove uma alternativa de nota que acrescentava uma nuance não exigida pelo grego. Mantém-se o pretérito narrativo para os presentes históricos, bem como a terminologia do rascunho.
