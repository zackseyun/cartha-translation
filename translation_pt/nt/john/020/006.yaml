  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: pt
  text: Então Simão Pedro também chegou, seguindo-o, entrou no túmulo e viu os panos de linho ali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa o presente histórico em «chega» e «vê»; aqui ambos são traduzidos no passado para dar fluidez à narrativa em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: chegou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma mais natural na narrativa portuguesa, sem alterar a sequência dos acontecimentos.
- source_word: οὖν
  choice: Então
  rationale: Marca a progressão da narrativa e a ligação com a chegada do outro discípulo no versículo anterior.
- source_word: καὶ Σίμων Πέτρος
  choice: também Simão Pedro
  rationale: 'Neste contexto, καί tem força aditiva: Pedro também chega ao túmulo.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: que o seguia
  rationale: Expressa de modo natural a ação simultânea do particípio e preserva o referente masculino singular de αὐτῷ.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: entrou no túmulo
  rationale: Reproduz de maneira idiomática tanto o movimento para dentro quanto o sentido funerário de μνημεῖον.
- source_word: θεωρεῖ
  choice: viu
  rationale: Embora o grego use o presente histórico, o pretérito mantém em português uma narrativa fluente e coerente. O verbo θεωρέω sugere visão atenta, mas o contexto não exige explicitar isso com um verbo mais marcado.
- source_word: τὰ ὀθόνια
  choice: os panos de linho
  rationale: Tradução lexical transparente para os tecidos de linho usados no sepultamento, sem acrescentar ao substantivo uma função apenas inferida do contexto.
- source_word: κείμενα
  choice: ali
  rationale: Com 'viu os panos de linho ali', o português comunica de modo conciso que os panos estavam no local; a nota registra a expressão mais formal que explicita sua posição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e ampla legibilidade brasileira. A tradução evita a construção menos idiomática “entrou para dentro” e mantém “panos de linho” em vez de explicitar interpretativamente “panos funerários”.
