id: JHN.20.19
reference: John 20:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: pt
  text: 'Então, ao anoitecer daquele dia, o primeiro dia da semana, os discípulos estavam em um lugar com as portas trancadas por medo dos judeus[a]. Jesus veio, pôs-se no meio deles e lhes disse: “Paz seja com vocês.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Conforme o contexto, a expressão também pode se referir aos líderes judeus ou aos judeus da Judeia.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “A paz esteja com vocês”. Literalmente: “Paz a vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: ao anoitecer
  rationale: O genitivo absoluto estabelece o momento da cena. “Ao anoitecer” é uma forma natural e concisa em português, sem perder o valor temporal.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuidade da narrativa e uma leve conexão com os acontecimentos anteriores; “Então” preserva essa função sem sugerir uma conclusão lógica forte.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: daquele dia, o primeiro da semana
  rationale: Mantém a referência ao mesmo dia mencionado anteriormente e traduz a expressão idiomática grega como o primeiro dia da semana.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: as portas ... encontravam-se trancadas
  rationale: O particípio perfeito passivo descreve o estado resultante das portas. “Trancadas” comunica melhor o contexto de proteção motivada pelo medo do que apenas “fechadas”.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: do lugar onde os discípulos estavam
  rationale: Expressa naturalmente a localização indicada no grego, sem acrescentar que estavam reunidos ou hospedados.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: por medo dos judeus
  rationale: διά com acusativo indica causa. A formulação conserva o referente lexical sem especificá-lo além do que o texto grego permite.
- source_word: ἔστη εἰς τὸ μέσον
  choice: pôs-se no meio deles
  rationale: Reproduz de modo idiomático a imagem espacial de Jesus assumindo uma posição no centro do grupo.
- source_word: λέγει αὐτοῖς
  choice: lhes disse
  rationale: O presente histórico grego é vertido no passado, forma mais natural na narrativa portuguesa.
- source_word: Εἰρήνη ὑμῖν
  choice: Paz seja com vocês
  rationale: Expressa como saudação natural em português a fórmula elíptica grega, cujo sentido literal é “Paz a vocês”.
theological_decisions:
- issue: Referente de τῶν Ἰουδαίων no Evangelho de João
  choice: “os judeus” no texto principal, com alternativas contextuais em nota
  alternative: “os líderes judeus” ou “os judeus da Judeia”
  rationale: O grego não especifica “líderes”, embora o contexto em Jerusalém possa apontar especialmente para autoridades e opositores. A tradução principal preserva a amplitude lexical, e a nota evita que a expressão seja entendida indevidamente como acusação indiscriminada contra todo o povo judeu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita rigidez excessiva, preserva a sequência narrativa e mantém em nota as ambiguidades relevantes do grego.
