source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: pt
  text: Maria Madalena foi aos discípulos, anunciando que tinha visto o Senhor e que ele lhe havia dito essas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Maria Madalena foi aos discípulos e disse: ‘Vi o Senhor’; e ele lhe disse essas coisas.” A oração final pode ser entendida como parte do relato de Maria ou como um comentário do narrador.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: foi
  rationale: O presente grego é histórico. Em português, o pretérito perfeito comunica naturalmente o acontecimento narrativo; “foi aos discípulos” expressa o movimento até eles sem sugerir que o narrador estivesse junto deles.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Madalena
  rationale: Forma tradicional, clara e amplamente reconhecida em português.
- source_word: ἀγγέλλουσα
  choice: anunciando
  rationale: Preserva a força verbal do particípio e apresenta a comunicação da mensagem como simultânea à chegada de Maria.
- source_word: τοῖς μαθηταῖς
  choice: aos discípulos
  rationale: “Discípulos” é a tradução corrente e exata; não se acrescenta um possessivo ausente do grego.
- source_word: ὅτι
  choice: introdução de discurso direto por dois-pontos e aspas
  rationale: Neste contexto, ὅτι introduz o conteúdo anunciado; a pontuação portuguesa apresenta naturalmente as palavras de Maria.
- source_word: Ἑώρακα
  choice: Eu vi
  rationale: Embora seja perfeito no grego, o pretérito perfeito simples é a maneira mais natural em português de relatar a experiência concluída e ainda relevante; “tenho visto” sugeriria repetição ou continuidade.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Mantém o título cristológico usual de Jesus e o peso de κύριος no contexto da ressurreição.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: e que ele lhe havia dito essas coisas
  rationale: Trata a oração como continuação do conteúdo anunciado por Maria. O mais-que-perfeito composto deixa claro que a fala do Senhor precedeu o anúncio dela, enquanto “essas coisas” preserva ταῦτα.
theological_decisions:
- issue: Tradução de κύριος no contexto da ressurreição
  choice: o Senhor
  alternative: o mestre
  rationale: “Senhor” conserva o título reconhecido de Jesus e sua relevância cristológica sem reduzir seu sentido.
- issue: Relação de καὶ ταῦτα εἶπεν αὐτῇ com o anúncio de Maria
  choice: 'A oração continua o conteúdo anunciado: “e que ele lhe havia dito essas coisas”'
  alternative: 'Comentário separado do narrador: “e ele lhe disse essas coisas”'
  rationale: Embora não haja um segundo ὅτι expresso, a oração pode continuar naturalmente o conteúdo de ἀγγέλλουσα. A ambiguidade sintática genuína é registrada em nota, sem excluir a leitura narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção conserva de modo deliberado a sequência participial do grego, enquanto a nota registra a ambiguidade da oração final.
