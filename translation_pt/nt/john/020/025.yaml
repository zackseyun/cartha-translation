  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: pt
  text: 'Por isso, os outros discípulos lhe diziam: “Vimos o Senhor!” Mas ele lhes disse: “Se eu não vir nas mãos dele a marca dos pregos, não puser o meu dedo na marca dos pregos e não puser a minha mão no lado dele, de modo nenhum acreditarei[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nunca acreditarei”. O grego emprega uma negação enfática.'
    reason: Registra uma alternativa legítima para a forte negação οὐ μή sem substituir, no texto principal, a recusa condicional por uma afirmação potencialmente mais absoluta.
lexical_decisions:
- source_word: ἔλεγον
  choice: continuavam dizendo
  rationale: O imperfeito indica ação passada contínua ou repetida; esta formulação conserva essa força de modo natural em português.
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a conexão narrativa e inferencial com a informação anterior sobre a ausência de Tomé.
- source_word: Ἑωράκαμεν
  choice: Vimos
  rationale: Embora seja perfeito, o português idiomático normalmente usa o pretérito perfeito neste anúncio; o contexto preserva a relevância presente do que foi visto.
- source_word: κύριον
  choice: o Senhor
  rationale: Conserva o título cristológico de κύριος no contexto da ressurreição.
- source_word: Ἐὰν μὴ ἴδω
  choice: Se eu não vir
  rationale: Expressa diretamente a condição negativa em português natural, sem alterar seu sentido.
- source_word: τύπον τῶν ἥλων
  choice: a marca dos pregos
  rationale: τύπος designa aqui a impressão ou marca visível deixada pelos pregos; 'marca' é claro e atual.
- source_word: βάλω ... εἰς
  choice: puser ... na
  rationale: Em português, 'pôr o dedo na marca' e 'pôr a mão no lado' exprimem naturalmente o movimento e o contato indicados por βάλω e εἰς, sem a estranheza de uma reprodução excessivamente literal.
- source_word: πλευράν
  choice: lado
  rationale: Neste contexto corporal, 'lado' é a tradução simples e não interpretativa de πλευρά, evitando especificar 'ferida' quando o substantivo não aparece no grego.
- source_word: οὐ μὴ πιστεύσω
  choice: de modo nenhum acreditarei
  rationale: A dupla negação com o subjuntivo aoristo comunica uma recusa enfática; a formulação mantém a força sem transformá-la necessariamente numa declaração absoluta e atemporal.
theological_decisions:
- issue: Força da recusa de Tomé em οὐ μὴ πιστεύσω
  choice: de modo nenhum acreditarei
  alternative: nunca acreditarei
  rationale: A construção grega é enfaticamente negativa, mas ocorre dentro de uma condição ligada à evidência exigida. 'De modo nenhum acreditarei' conserva a intensidade sem impor a ideia de uma incredulidade definitiva e atemporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “marca dos pregos” foi mantida por refletir a repetição enfática do original. A fala de Tomé conserva sua vivacidade e sua forte recusa condicional.
