  source_fidelity: A tradução preserva com precisão a sequência do particípio aoristo («Depois de dizer isso»), a ação de mostrar, os objetos «as mãos e o lado», o destinatário («lhes») e a reação dos discípulos. «Ao ver o Senhor» reproduz adequadamente a relação circunstancial expressa por ἰδόντες, sem impor uma nuance mais específica do que o grego exige.
  naturalness: O texto é claro, fluente e digno em português moderno de ampla compreensão. «Lhes mostrou» e o uso de artigos definidos para partes do corpo são naturais neste contexto; o referente de «as mãos e o lado» permanece inequivocamente Jesus.
  terminology: «Discípulos» é a equivalência estabelecida e apropriada para μαθηταί. «O Senhor» traduz κύριον com fidelidade ao uso joanino neste contexto de aparição após a ressurreição, sem acrescentar explicação doutrinária. «Lado» é uma tradução direta e idiomática de πλευρά.
