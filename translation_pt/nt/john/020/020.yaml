id: JHN.20.20
reference: John 20:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: pt
  text: Depois de dizer isso, ele lhes mostrou as mãos e o lado. Então os discípulos se alegraram ao ver o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Depois de dizer isso
  rationale: O particípio aoristo indica aqui uma ação anterior à do verbo principal. A formulação é natural em português e preserva claramente a sequência temporal.
- source_word: ἔδειξεν ... αὐτοῖς
  choice: lhes mostrou
  rationale: δείκνυμι significa apresentar algo à vista; o dativo αὐτοῖς é expresso naturalmente pelo pronome indireto «lhes».
- source_word: τὰς χεῖρας
  choice: as mãos
  rationale: O artigo grego pode ser mantido com naturalidade em português, pois a referência às próprias mãos de Jesus é inequívoca no contexto.
- source_word: τὴν πλευράν
  choice: o lado
  rationale: πλευρά significa «lado» nesta passagem e evoca, sem explicitação adicional, o ferimento mencionado anteriormente.
- source_word: ἐχάρησαν
  choice: se alegraram
  rationale: χαίρω expressa alegria. «Se alegraram» preserva a força verbal e soa atual e digna em português.
- source_word: οὖν
  choice: Então
  rationale: A partícula introduz a progressão e o resultado narrativo; «Então» transmite essa relação com fluidez.
- source_word: οἱ μαθηταί
  choice: os discípulos
  rationale: É a designação corrente e precisa dos seguidores de Jesus nos Evangelhos.
- source_word: ἰδόντες
  choice: ao ver
  rationale: O particípio aoristo indica a ocasião ou causa da alegria. «Ao ver» conserva a concisão e a relação circunstancial sem resolver além do necessário se a nuance é sobretudo temporal ou causal.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: κύριος funciona no contexto da aparição após a ressurreição como designação de Jesus com peso cristológico; «Senhor» preserva o uso joanino tradicional e lexicalmente adequado.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o mestre
  rationale: No contexto da aparição de Jesus ressuscitado, o termo vai além de uma forma comum de tratamento e conserva sua força como título cristológico. «O Senhor» mantém essa dimensão sem acrescentar interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe segue de perto a progressão do grego, mas evita construções participiais pouco naturais. Não são necessárias notas de rodapé neste versículo.
