id: JHN.20.7
reference: John 20:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: pt
  text: e o pano que estivera sobre a cabeça dele não estava deitado junto com os panos de linho, mas enrolado[a] à parte, em um lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “envolvido” ou “dobrado”.
    reason: O termo grego ἐντετυλιγμένον admite essas nuances e não determina com precisão se o pano estava enrolado, envolvido ou dobrado.
lexical_decisions:
- source_word: σουδάριον
  choice: pano
  rationale: No contexto funerário, designa o pano associado à cabeça ou ao rosto de Jesus. A oração explicativa esclarece sua função sem exigir um termo técnico pouco comum.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sobre a cabeça dele
  rationale: Reproduz de modo natural a relação espacial do grego sem especificar se o pano estava ao redor ou cobrindo inteiramente a cabeça.
- source_word: ὀθονίων
  choice: panos de linho
  rationale: Mantém o plural e explicita o material, sem acrescentar uma reconstrução específica das faixas funerárias.
- source_word: κείμενον
  choice: estava junto
  rationale: No contexto, expressa o estado e a localização do pano; a ideia de estar posto ou deitado fica naturalmente subordinada ao contraste espacial com os demais panos.
- source_word: χωρὶς
  choice: à parte
  rationale: Indica claramente que o pano estava separado dos panos de linho.
- source_word: ἐντετυλιγμένον
  choice: enrolado
  rationale: O particípio perfeito indica o pano em estado de ter sido enrolado ou envolvido. 'Enrolado' é natural em português e evita afirmar com excessiva precisão que estava cuidadosamente dobrado.
- source_word: εἰς ἕνα τόπον
  choice: em um lugar
  rationale: Tradução próxima da expressão grega, indicando uma localização distinta sem introduzir a interpretação 'em seu próprio lugar'.
- source_word: καὶ
  choice: e
  rationale: Preserva a conexão simples com a descrição do versículo anterior.
theological_decisions:
- issue: Se a disposição dos panos funerários implica uma afirmação teológica além da descrição narrativa
  choice: Apresentar apenas a localização separada e o estado do pano.
  alternative: Interpretar o pano como símbolo de ordem intencional ou como prova de uma reconstrução específica da ressurreição.
  rationale: O texto grego registra uma observação física, mas não declara seu significado simbólico ou apologético; a tradução não deve acrescentá-lo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a descrição concreta e a ambiguidade lexical do estado do pano.
