source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: pt
  text: Maria, porém, estava de pé, do lado de fora, junto ao túmulo, chorando. Enquanto chorava, inclinou-se para olhar dentro do túmulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «abaixou-se e olhou para dentro do túmulo». O verbo grego inclui a ideia de inclinar-se para olhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: porém
  rationale: Marca uma transição com leve contraste em relação à saída dos discípulos no contexto anterior, sem tornar a oposição forte demais.
- source_word: εἱστήκει
  choice: estava
  rationale: O mais-que-perfeito grego descreve o estado contínuo de Maria naquele lugar; em português natural, a posição espacial já fica clara com «estava do lado de fora, junto ao túmulo».
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: do lado de fora, junto ao túmulo
  rationale: Preserva tanto a proximidade de Maria ao túmulo quanto sua localização exterior, evitando a possível leitura de que ela estivesse simplesmente fora da área do túmulo.
- source_word: μνημεῖον
  choice: túmulo
  rationale: É o termo corrente e preciso para o local de sepultamento neste contexto.
- source_word: κλαίουσα / ἔκλαιεν
  choice: chorando / chorava
  rationale: A construção participial e o imperfeito apresentam o choro como ação contínua; a repetição é mantida de modo natural em português.
- source_word: ὡς οὖν
  choice: Enquanto
  rationale: Expressa aqui a simultaneidade entre o choro contínuo e a ação seguinte. O valor narrativo de οὖν pode ficar implícito em português sem sugerir uma conclusão lógica forte.
- source_word: παρέκυψεν
  choice: inclinou-se para olhar
  rationale: Comunica o movimento de curvar-se com a finalidade de olhar para o interior, sentido contextual do verbo.
- source_word: εἰς τὸ μνημεῖον
  choice: dentro do túmulo
  rationale: Expressa de modo idiomático a direção do olhar para o interior do túmulo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem «do lado de fora, junto ao túmulo» preserva os dois elementos espaciais do grego. O marcador [a] aparece após a oração à qual se aplica.
