  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: pt
  text: Então Pedro e o outro discípulo saíram e iam para o túmulo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram para o túmulo”. O verbo grego está no imperfeito, e “iam” torna mais explícita a ação em andamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saíram
  rationale: O aoristo de ἐξέρχομαι indica que Pedro e o outro discípulo deixaram o lugar onde estavam. O plural é exigido naturalmente em português pelo sujeito composto, embora o grego use o verbo no singular junto ao primeiro elemento.
- source_word: οὖν
  choice: Então
  rationale: A partícula assinala a consequência narrativa do relato anterior. “Então” mantém essa ligação de modo natural, sem a formalidade ou a força lógica maior de “portanto”.
- source_word: ὁ Πέτρος
  choice: Pedro
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ὁ ἄλλος μαθητής
  choice: o outro discípulo
  rationale: “Discípulo” é o equivalente usual de μαθητής no contexto dos Evangelhos, e “o outro” identifica a figura já mencionada em contraste com Pedro.
- source_word: ἤρχοντο
  choice: iam
  rationale: O imperfeito de ἔρχομαι apresenta o deslocamento em andamento. “Iam” expressa esse aspecto progressivo de forma concisa e natural em português.
- source_word: εἰς τὸ μνημεῖον
  choice: para o túmulo
  rationale: Neste contexto, μνημεῖον é o sepulcro de Jesus. Com o verbo de movimento, εἰς indica direção ao destino; “para o túmulo” não sugere prematuramente que eles tenham entrado nele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Então” conserva a progressão narrativa, e “iam” preserva o aspecto verbal grego sem tornar a frase artificial.
