id: JHN.20.12
reference: John 20:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: pt
  text: e ela vê dois anjos de branco[a], sentados, um à cabeceira e outro aos pés, onde o corpo de Jesus tinha estado deitado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestidos de branco” ou “com roupas brancas”. O grego diz literalmente “em branco”.
    reason: lexical_alternative
  - marker: b
    text: Ou “onde o corpo de Jesus estava deitado”. O imperfeito grego admite essa tradução mais simples; “tinha estado deitado” esclarece, no contexto, que se trata de uma situação anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: ela vê
  rationale: O presente histórico preserva a vivacidade da narrativa. O pronome explicita em português o sujeito feminino indicado pelo contexto, Maria Madalena.
- source_word: ἀγγέλους
  choice: anjos
  rationale: Embora o termo possa significar genericamente “mensageiros”, neste contexto do túmulo vazio designa seres celestiais.
- source_word: ἐν λευκοῖς
  choice: de branco
  rationale: Expressão concisa e natural que preserva a formulação grega, literalmente “em branco”, sem especificar além do necessário que se trata de vestes.
- source_word: καθεζομένους
  choice: sentados
  rationale: Expressa diretamente a postura dos dois anjos, sem acrescentar um advérbio de lugar ausente do grego.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: um à cabeceira e outro aos pés
  rationale: Traduz idiomaticamente as posições correspondentes à cabeça e aos pés do lugar em que o corpo estivera deitado.
- source_word: ὅπου
  choice: onde
  rationale: Equivalente direto e natural do advérbio relativo grego.
- source_word: ἔκειτο
  choice: tinha estado deitado
  rationale: O mais-que-perfeito composto deixa clara a situação anterior do corpo em relação ao momento em que Maria vê os anjos, preservando o valor contextual do imperfeito.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: o corpo de Jesus
  rationale: Formulação reverente, clara e lexicalmente direta.
theological_decisions:
- issue: Natureza de ἀγγέλους no contexto da ressurreição
  choice: anjos celestiais
  alternative: mensageiros humanos
  rationale: O túmulo vazio e a descrição “de branco” indicam seres angelicais; a escolha decorre do contexto lexical e narrativo, não de uma particularidade denominacional.
- issue: Valor temporal de ἔκειτο
  choice: estado anterior expresso por “tinha estado deitado”
  alternative: “estava deitado”
  rationale: A forma escolhida esclarece que o corpo já não se encontrava ali, sem transformar essa implicação contextual em uma afirmação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o presente histórico e evita-se acrescentar “ali”, que não aparece explicitamente no grego.
