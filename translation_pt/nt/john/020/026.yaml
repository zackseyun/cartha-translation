review_pass:
  verdict: revise
  source_fidelity: A expressão «dentro da casa» explicita um local que o grego não nomeia; ἔσω significa apenas «dentro/no interior». A formulação «Paz seja com vocês!» também transforma a saudação nominal Εἰρήνη ὑμῖν numa oração optativa. A revisão mantém a circunstância das portas trancadas sem explicar o modo da entrada.
  naturalness: O texto revisto permanece fluente em português moderno e evita tanto a explicitação de «casa» quanto uma construção excessivamente literal.
  terminology: «Tomé», «Jesus», «discípulos» e «Paz a vocês» são adequados. «Paz a vocês» reproduz de modo simples a saudação plural, sem acrescentar um verbo.
  issues:
  - severity: medium
    issue: «dentro da casa» acrescenta «casa» ao texto
    rationale: O original diz somente que os discípulos estavam ἔσω («dentro»); o contexto pode sugerir uma casa, mas o versículo não a especifica.
  - severity: low
    issue: «Paz seja com vocês!» introduz uma forma verbal não expressa
    rationale: Εἰρήνη ὑμῖν é literalmente uma saudação nominal, «Paz a vocês». A forma «seja» é interpretativa e desnecessária.
  - severity: low
    issue: «embora» torna explicitamente concessiva uma construção circunstancial
    rationale: O genitivo absoluto τῶν θυρῶν κεκλεισμένων informa que as portas estavam trancadas, sem marcar por si só uma relação concessiva. «Com as portas trancadas» preserva melhor essa abertura.
  revised_text: 'Oito dias depois, os discípulos estavam novamente dentro, e Tomé estava com eles. Jesus veio, com as portas trancadas, pôs-se no meio deles e disse: “Paz a vocês.”'
