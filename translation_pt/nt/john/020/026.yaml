source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: pt
  text: 'Oito dias depois, os discípulos estavam novamente dentro, e Tomé estava com eles. Jesus veio, com as portas trancadas, pôs-se no meio deles e disse: “Paz a vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Oito dias depois
  rationale: Expressa de modo natural a contagem inclusiva antiga indicada literalmente por “depois de oito dias”, sem acrescentar uma explicação desnecessária ao versículo.
- source_word: ἔσω
  choice: dentro da casa
  rationale: “Dentro” é o sentido básico; “da casa” torna natural em português o local subentendido pelo contexto imediato, sem especificar além disso.
- source_word: ἔρχεται
  choice: chegou
  rationale: O presente histórico grego é vertido pelo pretérito, forma narrativa mais natural em português e coerente com os verbos seguintes.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: embora as portas estivessem trancadas
  rationale: Preserva a construção circunstancial e o estado resultante do particípio perfeito; “trancadas” comunica melhor que as portas não estavam apenas fechadas.
- source_word: Εἰρήνη ὑμῖν
  choice: Paz seja com vocês!
  rationale: Reproduz a saudação semítica de paz em português atual e amplamente compreensível; “vocês” representa claramente o plural.
theological_decisions:
- issue: Relação entre a chegada de Jesus e as portas trancadas
  choice: embora as portas estivessem trancadas
  alternative: estando trancadas as portas
  rationale: A tradução conserva a circunstância extraordinária destacada pelo texto, mas não explica como Jesus entrou nem impõe uma teoria sobre a natureza de seu corpo ressuscitado.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. Mantém a progressão narrativa e a solenidade simples da saudação de Jesus.
