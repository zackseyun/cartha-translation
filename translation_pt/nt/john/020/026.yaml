revisions:
- from: 'Oito dias depois, os discípulos estavam novamente dentro da casa, e Tomé estava com eles. Jesus chegou, embora as portas estivessem trancadas, pôs-se no meio deles e disse: “Paz seja com vocês!”'
  to: 'Oito dias depois, os discípulos estavam novamente dentro, e Tomé estava com eles. Jesus veio, com as portas trancadas, pôs-se no meio deles e disse: “Paz a vocês.”'
