source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: pt
  text: 'Jesus lhe diz: “Maria!” Voltando-se, ela lhe diz em hebraico[a]: “Raboni!” (que significa “Mestre”).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em aramaico”. A expressão de João traduzida como “em hebraico” pode referir-se de modo mais amplo à língua semítica falada na Judeia.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico de João e a vivacidade da narrativa.
- source_word: αὐτῇ / αὐτῷ
  choice: lhe
  rationale: O pronome dativo é expresso de modo natural e conciso em português.
- source_word: Μαριάμ
  choice: Maria
  rationale: Forma tradicional e plenamente natural do nome em português.
- source_word: στραφεῖσα ἐκείνη
  choice: Ela se volta
  rationale: Expressa naturalmente a ação do particípio aoristo e mantém a sequência narrativa sem rigidez.
- source_word: Ἑβραϊστί
  choice: em hebraico
  rationale: Segue diretamente o termo grego, deixando em nota a possibilidade contextual de referência ao aramaico.
- source_word: Ραββουνι
  choice: Rabôni
  rationale: Mantém o título semítico transliterado, cuja explicação é dada pelo próprio evangelista; o acento orienta a pronúncia em português.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: que significa “Mestre”
  rationale: Formulação corrente para introduzir a explicação; “Mestre” comunica o sentido usual do vocativo Διδάσκαλε.
theological_decisions:
- issue: Sentido de Ἑβραϊστί na narrativa joanina
  choice: em hebraico
  alternative: em aramaico
  rationale: O texto principal acompanha a forma explícita do grego, enquanto a nota preserva a possibilidade de que João empregue o termo de modo mais amplo para a língua semítica falada na Judeia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O presente histórico foi preservado. A pontuação realça o reconhecimento emocional sem acrescentar conteúdo ao original.
