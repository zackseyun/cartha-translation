source:
  edition: SBLGNT
  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: pt
  text: Os dois corriam juntos, e o outro discípulo correu mais depressa que Pedro e chegou primeiro ao túmulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: corriam
  rationale: O imperfeito indica uma ação em andamento no passado; o imperfeito português preserva naturalmente esse aspecto.
- source_word: δὲ
  choice: e
  rationale: A partícula faz aqui uma ligação narrativa leve. «E» acompanha a sequência sem introduzir um contraste mais forte do que o texto exige.
- source_word: οἱ δύο
  choice: os dois
  rationale: Reproduz de modo direto e natural a expressão nominal grega.
- source_word: ὁμοῦ
  choice: juntos
  rationale: Expressa de forma concisa que ambos participavam simultaneamente da corrida.
- source_word: ὁ ἄλλος μαθητής
  choice: o outro discípulo
  rationale: «Discípulo» é o termo corrente no contexto dos Evangelhos, e «outro» o distingue de Pedro.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: correu mais depressa que Pedro
  rationale: O verbo composto indica avançar correndo, enquanto a expressão comparativa especifica maior rapidez. Em português, a construção escolhida comunica naturalmente que o discípulo ultrapassou Pedro, evitando a redundância de «correu à frente mais depressa».
- source_word: ἦλθεν πρῶτος
  choice: chegou primeiro
  rationale: No contexto de uma corrida até determinado destino, «chegou primeiro» é a forma portuguesa mais natural e precisa.
- source_word: εἰς τὸ μνημεῖον
  choice: ao túmulo
  rationale: O substantivo designa o lugar onde Jesus foi sepultado. «Ao», e não «para dentro do», respeita a sequência narrativa, pois o discípulo ainda não entra no túmulo neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. A formulação evita uma tradução mecanicamente redundante do comparativo grego sem perder a informação de que o outro discípulo correu mais rápido e chegou antes.
