  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: pt
  text: 'Jesus lhe disse: “Não se agarre a mim,[a] pois ainda não subi para o Pai. Mas vá até meus irmãos[b] e diga-lhes: ‘Estou subindo para meu Pai e Pai de vocês, para meu Deus e Deus de vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não me toque” ou “Não continue me segurando”. O grego provavelmente se refere a agarrar-se a ele ou continuar segurando-o, e não apenas a encostar nele.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” traduz o termo grego no plural masculino. Aqui ele se refere aos discípulos de Jesus e pode incluir um grupo representativo mais amplo.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Não se agarre a mim
  rationale: O imperativo presente com μή favorece a ideia de interromper ou não continuar uma ação. “Não se agarre a mim” comunica uma ação física prolongada melhor do que o simples “não me toque”, sem exceder o que o contexto permite.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: pois ainda não subi
  rationale: Preserva o valor do perfeito grego e a linguagem joanina de subir para o Pai. Em português, “ainda não subi” é mais natural do que “ainda não ascendi”, mantendo o vínculo verbal com “estou subindo” adiante.
- source_word: πρὸς τὸν πατέρα
  choice: para o Pai
  rationale: O grego traz o artigo, sem o possessivo μου. A tradução conserva essa diferença antes da formulação explícita “meu Pai e Pai de vocês”.
- source_word: πορεύου
  choice: vá
  rationale: Imperativo natural e direto de movimento no contexto.
- source_word: τοὺς ἀδελφούς μου
  choice: meus irmãos
  rationale: Mantém o plural masculino do grego e a relação que Jesus declara, sem substituir no texto a designação original por uma interpretação contextual.
- source_word: εἰπὲ αὐτοῖς
  choice: diga-lhes
  rationale: Forma idiomática e digna em português, que preserva o comando e o referente plural.
- source_word: Ἀναβαίνω
  choice: Estou subindo
  rationale: O presente pode expressar ação iminente ou em curso. “Estou subindo” preserva a vivacidade e a continuidade com o verbo anterior.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: meu Pai e Pai de vocês
  rationale: Conserva o paralelismo deliberado e a distinção entre a relação de Jesus com o Pai e a dos discípulos, sem acrescentar o segundo possessivo onde o grego não repete o substantivo com artigo.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: meu Deus e Deus de vocês
  rationale: Tradução direta que mantém o paralelismo e não suaviza a expressão teologicamente significativa “meu Deus”.
theological_decisions:
- issue: Sentido de Μή μου ἅπτου
  choice: Proibição de continuar agarrando-se a Jesus
  alternative: Não me toque
  rationale: O aspecto do imperativo presente favorece uma ação continuada, embora “tocar” continue sendo lexicalmente possível. A nota preserva a alternativa sem fazer do contato físico em si o ponto inequívoco do texto.
- issue: Forma de πατέρα na primeira oração
  choice: o Pai
  alternative: meu Pai
  rationale: O texto-fonte não contém μου nessa primeira ocorrência; a relação possessiva é explicitada somente na fala que segue.
- issue: Força cristológica de “meu Deus e Deus de vocês”
  choice: Manter a formulação diretamente
  alternative: Paráfrase que atenue “meu Deus”
  rationale: A tradução deve preservar toda a tensão teológica da declaração, sem reformulá-la para antecipar uma harmonização doutrinária.
- issue: Referência de ἀδελφούς
  choice: irmãos no texto, com esclarecimento em nota
  alternative: irmãos e irmãs ou discípulos
  rationale: “Irmãos” representa formalmente o masculino plural grego. A nota registra que, no contexto, a designação se refere aos discípulos de Jesus e pode ter alcance representativo mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Vocês” evita formas regionais marcadas; “diga-lhes” mantém um tom bíblico natural sem arcaísmo excessivo. A repetição “meu Pai e Pai de vocês, meu Deus e Deus de vocês” conserva o paralelismo conciso do grego.
