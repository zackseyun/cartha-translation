  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: pt
  text: 'E, depois de dizer isso, soprou sobre eles[a] e lhes disse: “Recebam o Espírito Santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “soprou neles”. O verbo também evoca as imagens da criação e da nova criação em Gênesis 2:7 e Ezequiel 37.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: depois de dizer isso
  rationale: O particípio aoristo indica uma ação anterior à ação principal; a formulação é natural em português e mantém a sequência temporal.
- source_word: ἐνεφύσησεν
  choice: soprou sobre eles
  rationale: O verbo pode indicar soprar sobre ou em alguém e evoca a linguagem de criação e nova criação da Septuaginta. A tradução principal preserva a imagem sem definir em excesso a direção do sopro.
- source_word: λέγει αὐτοῖς
  choice: lhes disse
  rationale: Embora o grego use o presente histórico, o passado é mais natural na narrativa portuguesa e não altera o sentido.
- source_word: Λάβετε
  choice: Recebam
  rationale: Neste contexto, o imperativo de λαμβάνω expressa a recepção do Espírito; “recebam” é claro e idiomático, sem sugerir apropriação autônoma.
- source_word: πνεῦμα ἅγιον
  choice: o Espírito Santo
  rationale: No contexto joanino, a expressão designa o Espírito divino. O artigo é natural e necessário no português corrente, embora a expressão grega seja anartrosa.
theological_decisions:
- issue: Se πνεῦμα ἅγιον designa o Espírito Santo divino ou um espírito santo indefinido
  choice: o Espírito Santo
  alternative: um espírito santo / espírito santo
  rationale: O contexto do Evangelho de João favorece claramente a referência ao Espírito divino. A capitalização e o artigo seguem o uso português sem acrescentar conteúdo estranho ao grego.
- issue: Direção e alcance de ἐνεφύσησεν
  choice: soprou sobre eles, com nota sobre a alternativa “soprou neles”
  alternative: soprou neles
  rationale: A forma verbal e sua ressonância com Gênesis 2:7 permitem que se perceba a ideia de soprar em alguém, enquanto “sobre eles” evita resolver no texto principal uma nuance lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. O plural “recebam” deixa explícito que Jesus se dirige ao grupo.
