id: JHN.20.27
reference: John 20:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: pt
  text: 'Então ele disse a Tomé: “Traga o seu dedo aqui e veja as minhas mãos. Traga também a sua mão e coloque-a no meu lado. Não seja incrédulo, mas crente[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seja infiel, mas fiel”. Os adjetivos gregos podem ter os dois sentidos, mas, neste contexto, o contraste se concentra na fé de Tomé em Jesus ressuscitado.'
    reason: Leitura alternativa que preserva a amplitude semântica de ἄπιστος e πιστός.
lexical_decisions:
- source_word: εἶτα
  choice: Então
  rationale: Marca a sequência narrativa de modo natural no português contemporâneo.
- source_word: λέγει
  choice: ele disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma normal da narrativa em português; o pronome explicita o sujeito já identificado pelo contexto.
- source_word: Φέρε … φέρε
  choice: Traga … Traga também
  rationale: Preserva a repetição dos dois imperativos e o movimento do dedo e da mão em direção a Jesus; “também” torna natural a coordenação em português sem alterar o sentido.
- source_word: δάκτυλόν σου ὧδε
  choice: o seu dedo aqui
  rationale: Mantém diretamente o objeto e a força dêitica de ὧδε.
- source_word: ἴδε τὰς χεῖράς μου
  choice: veja as minhas mãos
  rationale: Tradução clara e atual do imperativo ἴδε, conservando o plural de χεῖρας.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: coloque-a no meu lado
  rationale: “Coloque” comunica o imperativo βάλε; “no meu lado” é natural em português e, neste contexto, permite o movimento em direção à abertura da ferida expresso por εἰς sem recorrer a uma formulação gráfica ou artificial.
- source_word: μὴ γίνου
  choice: Não seja
  rationale: Embora γίνομαι possa realçar processo ou estado resultante, “não se torne” soaria pouco natural neste contexto, pois Tomé já demonstrou incredulidade. “Não seja” transmite a exortação sem impor a leitura aspectual mais forte de “deixe de ser”.
- source_word: ἄπιστος … πιστός
  choice: incrédulo … crente
  rationale: No contexto imediato, o contraste diz respeito à recusa ou disposição de crer que Jesus ressuscitou. A nota preserva o sentido lexical alternativo de infidelidade/fidelidade.
theological_decisions:
- issue: O contraste entre ἄπιστος e πιστός na exortação dirigida a Tomé
  choice: incrédulo / crente
  alternative: infiel / fiel
  rationale: A narrativa imediata trata da recusa de Tomé em crer no testemunho da ressurreição. A tradução principal mantém esse foco, enquanto a nota conserva a possível dimensão de fidelidade sem resolver silenciosamente a amplitude dos adjetivos gregos.
- issue: A nuance de μὴ γίνου
  choice: Não seja
  alternative: Não se torne; deixe de ser
  rationale: “Não seja” é idiomático e não força uma decisão entre ingresso num estado e cessação de um estado. “Não se torne” preservaria mais formalmente γίνομαι, mas seria contextualmente estranho; “deixe de ser” explicitaria uma nuance que a forma grega não exige por si só.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega tratamento implícito de “você” nas formas “traga”, “veja” e “coloque”, evitando tanto arcaísmos como coloquialismo excessivo. A repetição dos imperativos gregos é mantida.
