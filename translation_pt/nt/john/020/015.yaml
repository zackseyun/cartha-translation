source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Mulher, por que você está chorando? A quem você procura?” Pensando que ele fosse o jardineiro, ela lhe disse: “Senhor[a], se foi você quem o levou, diga-me onde o colocou, e eu o levarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Senhor” provavelmente é uma forma respeitosa de tratamento, pois Maria pensa estar falando com o jardineiro. A mesma palavra grega também pode designar “Senhor” como título.
    reason: Esclarecer o provável sentido contextual de κύριε e, ao mesmo tempo, preservar sua ambiguidade lexical e ressonância teológica.
lexical_decisions:
- source_word: Γύναι
  choice: Mulher
  rationale: Preserva a forma direta e respeitosa de tratamento no grego e a repetição joanina, sem acrescentar a nuance afetiva não explícita de “querida mulher”.
- source_word: τί κλαίεις
  choice: por que você está chorando
  rationale: κλαίω designa chorar ou prantear; “está chorando” é natural no português atual e mantém o tom solene pelo contexto.
- source_word: τίνα ζητεῖς
  choice: A quem você procura
  rationale: ζητέω significa procurar ou buscar; a formulação preserva o objeto pessoal e soa natural e digna em português.
- source_word: δοκοῦσα
  choice: Pensando
  rationale: Expressa a inferência equivocada de Maria sem tornar a narração excessivamente formal.
- source_word: ὁ κηπουρός
  choice: o jardineiro
  rationale: Equivalente direto de κηπουρός, adequado ao cenário do jardim.
- source_word: Κύριε
  choice: Senhor
  rationale: Em português, “senhor” pode funcionar tanto como tratamento respeitoso quanto como título, preservando melhor que uma opção mais específica a ambiguidade lexical de κύριε no contexto.
- source_word: ἐβάστασας αὐτόν
  choice: o levou
  rationale: βαστάζω pode indicar carregar ou levar; “levou” é natural para a remoção de um corpo e evita uma formulação pesada.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: onde o colocou
  rationale: τίθημι significa pôr, colocar ou depositar; “colocou” é claro, atual e ligeiramente mais digno que “pôs” neste contexto.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: e eu o levarei
  rationale: αἴρω pode significar levantar, carregar ou retirar. “Eu o levarei” comunica a intenção de Maria de buscar o corpo e preserva o futuro.
theological_decisions:
- issue: Sentido de κύριε na fala de Maria antes de reconhecer Jesus ressuscitado
  choice: Senhor
  alternative: Meu senhor / tratamento meramente cortês
  rationale: Maria pensa falar com o jardineiro, de modo que o uso é provavelmente cortês, não uma confissão cristológica. Contudo, “Senhor” em português preserva a forma tradicional e parte da tensão lexical; a nota esclarece o provável valor contextual sem apagar a possível ressonância narrativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “você” na fala direta para clareza contemporânea, com tom digno. O presente histórico grego foi vertido pelo passado narrativo natural em português. A construção enfática εἰ σύ foi representada por “se foi você quem”.
