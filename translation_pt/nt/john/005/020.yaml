id: JHN.5.20
reference: John 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: pt
  text: Pois o Pai ama o Filho e lhe mostra tudo o que ele próprio faz; e lhe mostrará obras maiores do que estas, para que vocês se maravilhem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo que vocês se maravilhem”. A construção grega pode expressar propósito e, neste contexto, também pode sugerir como resultado o assombro dos ouvintes de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ama
  rationale: “Ama” comunica de modo natural a relação afetiva entre o Pai e o Filho sem enfraquecer φιλέω nem impor uma distinção rígida em relação a ἀγαπάω no uso joanino.
- source_word: δείκνυσιν / δείξει
  choice: mostra / mostrará
  rationale: Mantém o sentido direto e a correspondência lexical entre o presente e o futuro dos dois verbos gregos.
- source_word: πάντα
  choice: tudo
  rationale: Equivalente abrangente, claro e idiomático em português.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: o que ele próprio faz
  rationale: “Ele próprio” preserva a ênfase de αὐτός no Pai; o presente simples é natural em português e pode expressar ação habitual ou contínua sem restringir indevidamente o aspecto.
- source_word: μείζονα τούτων ... ἔργα
  choice: obras maiores do que estas
  rationale: “Obras” preserva o vocabulário teologicamente significativo de João, e a construção comparativa é clara e natural.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: para que vocês fiquem maravilhados
  rationale: “Para que” preserva a construção com ἵνα, enquanto “fiquem maravilhados” exprime de modo atual e digno a reação indicada por θαυμάζω; “vocês” deixa claro o plural de ὑμεῖς.
theological_decisions:
- issue: A natureza do amor do Pai pelo Filho expressa por φιλέω
  choice: Traduzir simplesmente por “ama”, sem sugerir amor inferior ou meramente humano.
  alternative: “tem afeição pelo”
  rationale: Em João, φιλέω pode sobrepor-se semanticamente a ἀγαπάω. “Ama” preserva a força relacional sem introduzir uma distinção teológica não exigida pelo texto.
- issue: Força de ἵνα ὑμεῖς θαυμάζητε
  choice: “para que vocês fiquem maravilhados”
  alternative: “de modo que vocês ficarão maravilhados”
  rationale: A formulação mantém aberta a nuance de propósito, sem negar que o contexto também possa implicar o resultado de assombro entre os ouvintes de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para tornar explícito o plural do grego e conserva “obras”, termo importante no vocabulário joanino.
