    issue: A nota inclui “para julgar” como se fosse parte da alternativa assinalada.
    rationale: A nota inglesa de referência limita a leitura alternativa à oração causal e a υἱὸς ἀνθρώπου (“porque ele é um filho de homem”). A alternativa verbal não é necessária e mistura duas questões distintas.
  - severity: low
    issue: O marcador [a] está após “julgamento”, embora a nota trate de “Filho do Homem”.
    rationale: A posição atual obscurece o escopo da nota. Colocá-lo após “Homem” torna a referência textual precisa.
  - severity: low
    issue: “Executar o julgamento” é uma formulação algo pesada em português.
    rationale: “Julgar” comunica naturalmente κρίσιν ποιεῖν no contexto judicial e não reduz a autoridade concedida.
  revised_text: E deu-lhe autoridade para julgar, porque ele é o Filho do Homem[a].
  revised_footnotes:
