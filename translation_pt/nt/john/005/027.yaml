id: JHN.5.27
reference: John 5:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: pt
  text: E deu-lhe autoridade para julgar, porque ele é o Filho do Homem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ele é um filho de homem”, isto é, porque participa da natureza humana. O texto principal preserva o provável uso da expressão como título no Evangelho de João.'
    reason: Leitura alternativa que preserva a possível força genérica da expressão grega sem apagar seu provável uso como título no contexto.
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa autoridade delegada ou jurisdição legítima, adequada ao contexto em que o Pai confere ao Filho a prerrogativa judicial.
- source_word: ἔδωκεν αὐτῷ
  choice: deu-lhe
  rationale: Reproduz de modo direto o aoristo de δίδωμι e o pronome dativo, em formulação natural e digna em português.
- source_word: κρίσιν ποιεῖν
  choice: executar o julgamento
  rationale: Conserva o caráter judicial da expressão grega, que significa levar a efeito ou exercer o julgamento, em vez de apenas formular um juízo.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual a autoridade foi dada, tendo aqui valor causal.
- source_word: υἱὸς ἀνθρώπου
  choice: o Filho do Homem
  rationale: Embora não haja artigo diante de υἱός no grego, a expressão funciona no contexto joanino como título reconhecido de Jesus e evoca sua ressonância apocalíptica e messiânica.
- source_word: ἐστίν
  choice: é
  rationale: Traduz diretamente a cópula no presente, sem expansão desnecessária.
theological_decisions:
- issue: Se υἱὸς ἀνθρώπου deve ser entendido como título cristológico ou como expressão genérica da humanidade
  choice: o Filho do Homem
  alternative: um filho de homem; um ser humano
  rationale: No Evangelho de João, a expressão é uma designação estabelecida de Jesus e provavelmente ecoa Daniel 7, especialmente neste contexto de autoridade judicial. A ausência do artigo permite que a dimensão humana seja percebida, mas não exige abandonar o uso titular; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Deu-lhe” mantém concisão formal sem soar arcaico; “executar o julgamento” preserva a linguagem judicial e a ambiguidade legítima é registrada em nota.
