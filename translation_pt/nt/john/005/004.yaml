source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: pt
  text: Pois, de tempos em tempos, um anjo descia ao tanque e agitava a água. Então, o primeiro que entrava depois que a água era agitada ficava curado de qualquer doença que o afligisse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo, juntamente com a segunda metade do versículo 3, não aparece nos papiros gregos mais antigos, como os papiros 66 e 75, do século III, nem em importantes manuscritos do século IV, como o Sinaítico e o Vaticano. Ele está presente na tradição majoritária bizantina, bem como em antigas traduções latinas e siríacas. Muitos estudiosos o consideram um acréscimo antigo feito por um copista para explicar por que os enfermos se reuniam junto ao tanque.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: de tempos em tempos
  rationale: Expressa de modo natural uma ocorrência ocasional ou periódica, sem impor uma estação fixa.
- source_word: κατέβαινεν
  choice: descia
  rationale: O imperfeito indica ação habitual ou repetida no passado; em português, o imperfeito simples comunica naturalmente esse aspecto.
- source_word: ἐτάρασσεν / ταραχή
  choice: agitava / era agitada
  rationale: Mantém a ligação lexical entre a ação do anjo e a alteração da água, em linguagem clara e corrente.
- source_word: ὑγιὴς ἐγίνετο
  choice: ficava curado
  rationale: Comunica o resultado de recuperar a saúde e preserva, pelo imperfeito, o caráter habitual da afirmação.
- source_word: κατείχετο νοσήματι
  choice: doença que o afligisse
  rationale: Verte idiomaticamente a ideia passiva de estar dominado ou acometido por uma enfermidade, preservando a construção indefinida de ᾧ δήποτε.
