source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: pt
  text: Não posso fazer nada de mim mesmo.[a] Assim como ouço, julgo; e o meu julgamento é justo, porque não procuro a minha própria vontade, mas a vontade daquele que me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por mim mesmo” ou “por conta própria”. A expressão grega enfatiza que sua ação não procede de uma fonte ou iniciativa independente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Não posso
  rationale: Expressa de modo natural a capacidade negada por δύναμαι, preservando a ênfase contextual do pronome grego sem produzir uma construção artificial em português.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: fazer nada por mim mesmo
  rationale: A construção negativa é idiomática em português, e “por mim mesmo” comunica aqui ação de iniciativa ou origem independente, não mera atuação solitária.
- source_word: καθὼς ἀκούω
  choice: Assim como ouço
  rationale: Preserva a correspondência expressa por καθὼς e o presente geral de ἀκούω.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: julgo / o meu julgamento
  rationale: Mantém a continuidade lexical e o sentido judicial dos dois termos.
- source_word: δικαία
  choice: justo
  rationale: No contexto de julgamento, “justo” expressa adequadamente correção e equidade.
- source_word: οὐ ζητῶ
  choice: não procuro
  rationale: “Procurar” transmite naturalmente a orientação ou finalidade volitiva de ζητέω sem explicar além do texto.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: a minha própria vontade
  rationale: “Própria” representa a ênfase do possessivo grego.
- source_word: τοῦ πέμψαντός με
  choice: daquele que me enviou
  rationale: Traduz naturalmente a expressão participial sem substituir a descrição relacional explícita por “Pai”.
theological_decisions:
- issue: Relação da ação do Filho com aquele que o enviou em ἀπ’ ἐμαυτοῦ
  choice: por mim mesmo
  alternative: de mim mesmo
  rationale: A formulação comunica que Jesus não age com origem ou iniciativa independente daquele que o enviou. A nota registra a alternativa mais formal para preservar a nuance de fonte sem resolver além do texto a tensão entre capacidade e dependência.
- issue: Sentido de δικαία com κρίσις
  choice: justo
  alternative: reto
  rationale: “Justo” é a combinação portuguesa mais natural no contexto judicial e não limita o termo a uma abstração moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição judicial do grego foram preservadas, evitando tanto linguagem excessivamente literal quanto explicações doutrinárias inseridas no texto.
