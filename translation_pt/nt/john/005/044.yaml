source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: pt
  text: Como vocês podem crer[b], recebendo glória[a] uns dos outros e não buscando a glória que vem do único Deus[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “honra”, nas duas ocorrências de “glória” (grego δόξα).
    reason: lexical_alternative
  - marker: b
    text: Ou “Como vocês são capazes de crer...?”
    reason: lexical_alternative
  - marker: c
    text: Ou “de Deus, o único”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Como vocês podem crer
  rationale: Expressa naturalmente em português a pergunta retórica sobre capacidade ou possibilidade, sem explicar a causa além do que o contexto declara.
- source_word: ὑμεῖς
  choice: vocês
  rationale: Torna explícito o pronome presente no grego e mantém boa legibilidade no português moderno de alcance amplo.
- source_word: δόξαν ... τὴν δόξαν
  choice: glória ... glória
  rationale: Mantém a repetição lexical e o contraste deliberado entre a glória recebida de seres humanos e a que procede de Deus; “honra” continua sendo uma alternativa contextual legítima.
- source_word: παρ’ ἀλλήλων
  choice: uns dos outros
  rationale: Comunica com clareza a reciprocidade e a origem humana da glória.
- source_word: λαμβάνοντες
  choice: recebendo
  rationale: Preserva a forma participial e o sentido amplo de receber, sem acrescentar a nuance mais volitiva de “aceitando”.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: e não buscando
  rationale: A coordenação em português acompanha de perto o fluxo da oração grega e liga os dois comportamentos à pergunta principal.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: a glória que vem do único Deus
  rationale: A oração relativa é natural em português e explicita corretamente a ideia de origem presente na construção grega.
- source_word: μόνου θεοῦ
  choice: único Deus
  rationale: Preserva de forma concisa a exclusividade expressa por μόνος, sem ampliação doutrinária.
theological_decisions:
- issue: Sentido de πιστεῦσαι no contexto joanino
  choice: crer
  alternative: confiar
  rationale: “Crer” é amplo, tradicional e natural no contexto, preservando o campo semântico do verbo sem restringi-lo a uma formulação doutrinária específica.
- issue: Tradução uniforme de δόξα nas duas orações
  choice: glória
  alternative: honra
  rationale: A repetição de “glória” conserva o paralelismo e a tensão entre o reconhecimento de origem humana e o de origem divina.
- issue: Exclusividade em τοῦ μόνου θεοῦ
  choice: do único Deus
  alternative: de Deus, o único
  rationale: A formulação afirma diretamente a singularidade de Deus no quadro monoteísta do texto, sem importar inferências cristológicas ou anticristológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção participial foi preservada para não definir de modo excessivo a relação lógica entre receber glória humana e não buscar a glória divina.
