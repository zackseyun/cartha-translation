  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: pt
  text: E imediatamente o homem ficou curado, pegou a sua esteira[a] e começou a andar[b]. Ora, aquele dia era sábado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu leito”. O termo grego se refere a uma esteira, enxerga ou colchão simples e portátil, não necessariamente a uma cama como peça de mobiliário.
    reason: lexical_alternative
  - marker: b
    text: Ou “andava”. O imperfeito grego pode destacar uma ação continuada; neste contexto, também pode ser entendido como o início do andar depois da cura.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “Naquele dia era dia de sábado”. Literalmente, o grego diz: “era sábado naquele dia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa com clareza o caráter instantâneo da cura e mantém o tom narrativo solene do texto.
- source_word: ἐγένετο ὑγιὴς
  choice: ficou curado
  rationale: Comunica naturalmente em português a passagem do homem para um estado de saúde, sem introduzir no verbo uma voz passiva que não está explícita no grego.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: Corresponde ao substantivo masculino singular e ao homem específico mencionado no contexto.
- source_word: ἦρε
  choice: pegou
  rationale: Neste contexto, αἴρω indica levantar e levar consigo um objeto portátil; “pegou” é claro e natural em português moderno.
- source_word: κράβαττον
  choice: esteira
  rationale: Designa uma esteira, enxerga ou leito simples e portátil, não necessariamente uma cama como peça de mobiliário.
- source_word: περιεπάτει
  choice: começou a andar
  rationale: O imperfeito pode apresentar a ação em curso ou destacar seu início; no contexto da cura, esta formulação comunica naturalmente que o homem passou a andar, mantendo em nota a alternativa aspectual.
- source_word: Ἦν δὲ
  choice: Ora, ... era
  rationale: δέ introduz aqui uma observação narrativa que prepara o conflito seguinte, sem exigir uma oposição forte.
- source_word: σάββατον
  choice: sábado
  rationale: Em português, a construção idiomática para identificar o dia é “era sábado”; ela preserva a referência ao dia judaico de descanso sem exigir artigo.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: aquele dia
  rationale: Reproduz de modo natural a referência temporal enfática do grego.
theological_decisions:
- issue: Valor narrativo de σάββατον
  choice: aquele dia era sábado
  alternative: naquele dia era dia de sábado
  rationale: A forma escolhida é a expressão portuguesa mais natural para identificar o dia e prepara a controvérsia subsequente, sem acrescentar uma interpretação confessional.
- issue: Aspecto de περιεπάτει após a cura
  choice: começou a andar
  alternative: andava
  rationale: A leitura ingressiva se ajusta ao contexto imediato da recuperação, mas o imperfeito também pode apresentar ação continuada; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Esteira” evita a imagem anacrônica de uma cama pesada; “Ora” marca a transição narrativa; “sábado” permanece em minúscula conforme o uso ortográfico corrente em português.
