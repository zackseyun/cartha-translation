    rationale: O recuo temporal é possível em discurso indireto português, mas não é necessário. «É» preserva a forma e a força identificadora do presente grego, sem prejudicar a naturalidade.
  - severity: low
    issue: «Havia deixado curado» é menos direto para ὁ ποιήσας αὐτὸν ὑγιῆ.
    rationale: A expressão é compreensível, mas pode sugerir principalmente o estado em que ele foi deixado. «O curou» comunica de maneira idiomática e precisa o resultado de ποιέω com ὑγιής neste contexto de cura.
