  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: pt
  text: O homem foi embora e informou aos judeus que Jesus é quem o curou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos líderes judeus” ou “aos judeanos”, dependendo de como se entende, neste contexto, o uso que João faz da expressão “os judeus”.
    reason: Leitura alternativa do referente de τοῖς Ἰουδαίοις.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: O aoristo de ἀπέρχομαι indica que o homem deixou o local. “Foi embora” é natural no português atual sem a formalidade de “partiu”.
- source_word: ὁ ἄνθρωπος
  choice: O homem
  rationale: O substantivo masculino singular retoma o homem curado no contexto.
- source_word: ἀνήγγειλεν
  choice: informou
  rationale: ἀναγγέλλω significa comunicar, relatar ou dar a conhecer. “Informou” expressa a transmissão da informação sem sugerir necessariamente um anúncio público.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: A tradução mantém a forma lexical do grego sem restringir no texto principal o referente a líderes judeus ou a judeanos; a possível nuance contextual é indicada em nota.
- source_word: ὅτι
  choice: que
  rationale: Conjunção declarativa que introduz o conteúdo da informação.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ἐστιν
  choice: era
  rationale: Embora o grego empregue o presente, o português natural admite a correlação com o verbo passado de comunicação. A identidade de Jesus não é negada; trata-se de ajuste idiomático no discurso indireto.
- source_word: ὁ ποιήσας
  choice: quem ... havia deixado
  rationale: O particípio aoristo substantivado identifica Jesus como agente de uma ação anterior à informação dada pelo homem. A construção com “havia” explicita essa anterioridade de modo natural.
- source_word: αὐτὸν ὑγιῆ
  choice: o ... curado
  rationale: ὑγιής descreve a condição de saúde restaurada. “Deixado curado” preserva a construção causativa de ποιέω com adjetivo e soa mais natural em português do que “feito saudável”.
theological_decisions:
- issue: Referente de τοῖς Ἰουδαίοις no Evangelho de João
  choice: Manter “aos judeus” no texto principal e registrar em nota as possibilidades contextuais “aos líderes judeus” e “aos judeanos”.
  alternative: Traduzir diretamente “aos líderes judeus” ou “aos judeanos”.
  rationale: O termo grego não resolve sozinho qual grupo específico está em vista. Manter a expressão lexical preserva a ambiguidade genuína e evita estreitamento interpretativo; a nota esclarece as leituras contextuais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita arcaísmos e conserva no texto principal a ambiguidade contextual de “os judeus”.
