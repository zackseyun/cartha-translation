  source_fidelity: A tradução preserva corretamente a sequência narrativa, o referente masculino e a ambiguidade de τοῖς Ἰουδαίοις. Contudo, «era» recua desnecessariamente o presente ἐστιν, e «havia deixado curado» é uma paráfrase causativa menos direta do que o sentido de Jesus como agente da cura.
  naturalness: «Foi embora» e «aos judeus» são naturais e adequados ao registro. «Jesus é quem o curou» é uma formulação moderna, clara e idiomática, mais direta do que «era quem o havia deixado curado».
  terminology: «Judeus» deve permanecer no texto principal, pois reproduz a designação grega sem impor que se trate exclusivamente de autoridades ou de habitantes da Judeia. A nota mantém de modo apropriado as alternativas contextuais.
  issues:
