id: JHN.5.26
reference: John 5:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: pt
  text: Pois, assim como o Pai tem vida em si mesmo[a], também concedeu ao Filho ter vida em si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «vida em si mesmo» pode indicar vida inerente ao próprio ser. A tradução mantém a formulação grega em vez de empregar o termo teológico «vida autoexistente».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de γάρ quanto a comparação introduzida por ὥσπερ, com formulação natural em português.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: Título definido de Deus no uso joanino; a inicial maiúscula sinaliza a referência titular.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: tem vida em si mesmo
  rationale: Traduz diretamente a afirmação no presente e mantém explícita a expressão preposicional, sem substituí-la pelo termo teológico interpretativo «vida autoexistente».
- source_word: οὕτως καὶ
  choice: também
  rationale: Em correlação com «assim como», comunica que o mesmo predicado é atribuído ao Filho; evita uma repetição pouco natural de «assim também» sem perder a relação comparativa.
- source_word: τῷ υἱῷ
  choice: ao Filho
  rationale: Representa o objeto indireto no dativo após ἔδωκεν; a inicial maiúscula reflete o título cristológico no contexto.
- source_word: ἔδωκεν
  choice: concedeu
  rationale: O aoristo é vertido pelo pretérito perfeito. «Concedeu» conserva a ideia de algo dado ou outorgado e se ajusta naturalmente à construção com infinitivo em português.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: ter vida em si mesmo
  rationale: Mantém a construção infinitiva e repete a mesma expressão usada a respeito do Pai, preservando o paralelismo do grego.
theological_decisions:
- issue: Se a expressão deve ser explicitada como «vida autoexistente» ou «asseidade»
  choice: Manter «vida em si mesmo».
  alternative: «vida autoexistente»; «asseidade»
  rationale: A formulação preserva ἐν ἑαυτῷ e seu peso teológico sem trocar as palavras do texto por terminologia doutrinária posterior.
- issue: Como representar ἔδωκεν na relação entre o Pai e o Filho
  choice: Traduzir por «concedeu», mantendo a linguagem de dádiva ou outorga.
  alternative: «deu»
  rationale: O texto afirma que o Pai deu ao Filho ter vida em si mesmo. A tradução conserva essa tensão sem enfraquecê-la nem acrescentar ao versículo uma explicação sobre a relação intratrinitária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre Pai e Filho foi preservado, e evitou-se terminologia teológica técnica no texto principal.
