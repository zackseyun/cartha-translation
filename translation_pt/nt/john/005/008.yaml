  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: pt
  text: 'Jesus lhe diz: “Levante-se, pegue a sua esteira e ande.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico grego, recurso narrativo característico de João, e soa natural em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: Expressa de modo conciso e natural o objeto indireto no dativo, sem explicitação desnecessária.
- source_word: Ἔγειρε
  choice: Levante-se
  rationale: Imperativo direto e corrente que comunica o ato imediato de se erguer; é mais natural no registro moderno do que “Erga-se”.
- source_word: ἆρον
  choice: pegue
  rationale: Comunica naturalmente a ação de levantar e tomar consigo o objeto; no contexto, a portabilidade da esteira torna o sentido claro.
- source_word: κράβαττόν
  choice: esteira
  rationale: Designa adequadamente uma superfície simples e portátil usada para dormir, evitando a imagem moderna de uma cama como móvel pesado.
- source_word: περιπάτει
  choice: ande
  rationale: Traduz diretamente o imperativo de caminhar fisicamente, sem acrescentar uma duração não explicitada.
theological_decisions:
- issue: Natureza da ordem de Jesus no contexto da cura
  choice: Traduzir os três imperativos como ordens físicas diretas, sem acrescentar linguagem explícita de cura ou milagre.
  alternative: “Levante-se curado” ou outra formulação que explicite a cura.
  rationale: O texto grego ordena que o homem se levante, pegue a esteira e ande. A cura está implícita no contexto, mas não é lexicalmente declarada neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O presente histórico foi mantido. “Esteira” favorece a imagem de um leito simples e portátil; não se acrescentou nota porque a opção é suficientemente clara no corpo do texto.
