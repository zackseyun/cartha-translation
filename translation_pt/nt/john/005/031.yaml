base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: pt
  text: Se eu testemunho a respeito de mim mesmo, meu testemunho não é verdadeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu testemunho não é válido”, tendo em vista o contexto jurídico de depoimentos de testemunhas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Se
  rationale: Introduz uma oração condicional; “Se” expressa de modo direto a lógica do argumento, sem acrescentar sentido iterativo.
- source_word: ἐγὼ
  choice: eu
  rationale: O pronome grego é explícito e confere leve ênfase ao próprio Jesus; em português, sua presença preserva essa ênfase.
- source_word: μαρτυρῶ
  choice: testemunho
  rationale: Mantém o sentido de prestar testemunho e a dimensão probatória do contexto, em linguagem natural e atual.
- source_word: περὶ ἐμαυτοῦ
  choice: a respeito de mim mesmo
  rationale: Traduz diretamente περί com genitivo como “a respeito de”; evita restringir a expressão ao sentido interpretativo de “em meu próprio favor”.
- source_word: ἡ μαρτυρία μου
  choice: meu testemunho
  rationale: Preserva a relação lexical com o verbo “testemunho” e o caráter de depoimento ou evidência.
- source_word: οὐκ ἔστιν ἀληθής
  choice: não é verdadeiro
  rationale: Reproduz o sentido direto de ἀληθής e conserva a tensão interpretativa do texto, sem reduzi-lo no corpo do versículo à ideia jurídica de validade.
theological_decisions:
- issue: Sentido da afirmação de Jesus de que seu testemunho “não é verdadeiro”
  choice: não é verdadeiro
  alternative: não é válido
  rationale: A tradução principal conserva o valor lexical direto de ἀληθής e não elimina a tensão com João 8:14. O contexto de testemunhas permite entender a frase em termos de validade probatória, mas essa leitura é apresentada como alternativa em nota, e não imposta ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a repetição cognata ligada ao testemunho e a ambiguidade entre veracidade e validade probatória.
