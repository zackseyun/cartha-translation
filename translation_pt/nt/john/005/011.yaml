source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Aquele que me curou, esse me disse: ‘Pegue a sua esteira e ande.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: É a forma narrativa direta e natural em português para introduzir a resposta do homem.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Aquele que me curou
  rationale: No contexto de uma cura física, esta formulação comunica naturalmente a ideia causativa de ‘tornar saudável’, sem sugerir implicações além do texto.
- source_word: ἐκεῖνός
  choice: esse
  rationale: Conserva a ênfase do pronome grego, retomando de modo explícito ‘Aquele que me curou’.
- source_word: Ἆρον
  choice: Pegue
  rationale: Imperativo concreto e corrente em português para levantar e levar o objeto; evita o tom menos natural de ‘toma’ para muitos leitores atuais.
- source_word: κράβαττόν
  choice: esteira
  rationale: Designa com clareza uma esteira simples usada para dormir, sem sugerir uma cama como móvel.
- source_word: περιπάτει
  choice: ande
  rationale: Expressa de forma idiomática a ordem no contexto da cura; explicitar duração ou continuidade não é necessário aqui.
- source_word: δὲ
  choice: Mas
  rationale: Marca adequadamente o contraste entre a acusação anterior e a resposta do homem.
theological_decisions:
- issue: Alcance da descrição da cura
  choice: me curou
  alternative: me tornou são / me fez ficar bem
  rationale: O contexto trata de cura física. ‘Me curou’ é natural e não acrescenta a possível conotação espiritual de ‘me tornou inteiro’.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura ‘Aquele que me curou, esse me disse’ preserva deliberadamente a ênfase do grego, ainda que seja mais marcada que a fala coloquial comum.
