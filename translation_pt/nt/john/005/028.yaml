id: JHN.5.28
reference: John 5:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: pt
  text: Não fiquem admirados com isso, pois vem a hora em que todos os que estão nos túmulos[a] ouvirão a voz dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sepulturas». O grego μνημεῖα pode designar lugares de sepultamento em geral; «túmulos» conserva a imagem concreta.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Não fiquem admirados
  rationale: O imperativo presente com μή expressa proibição. A formulação é natural no português moderno e conserva a ideia de espanto de θαυμάζω.
- source_word: τοῦτο
  choice: com isso
  rationale: Retoma de modo direto a afirmação anterior; a regência natural de «ficar admirado» em português pede «com».
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão da proibição. «Pois» preserva claramente o valor causal e mantém o fluxo digno da frase.
- source_word: ἔρχεται ὥρα
  choice: vem a hora
  rationale: Mantém «hora», termo de relevância no vocabulário joanino, sem o generalizar como «tempo». Embora ὥρα seja anartro no grego, «vem a hora» é a formulação mais natural em português e não exige que a hora já tenha sido identificada.
- source_word: ἐν ᾗ
  choice: em que
  rationale: Representa com clareza e naturalidade a construção relativa grega.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: todos os que estão nos túmulos
  rationale: πάντες οἱ funciona substantivamente, «todos os que». μνημεῖον designa aqui lugares de sepultamento; «túmulos» conserva a imagem concreta.
- source_word: ἀκούσουσιν
  choice: ouvirão
  rationale: Traduz diretamente o futuro ativo do verbo ἀκούω.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: a voz dele
  rationale: φωνή significa naturalmente «voz» neste contexto. «Dele» evita possível leitura de «sua» como referência a outro antecedente.
theological_decisions:
- issue: A ressurreição implícita na referência aos que estão nos túmulos ouvindo a voz dele
  choice: Conservar a imagem concreta de «túmulos» sem acrescentar uma explicação doutrinária ao versículo.
  alternative: Usar «sepulturas» ou explicitar que se trata dos mortos.
  rationale: O texto aponta para a ressurreição, mas a tradução deve manter sua própria formulação, sem tornar explícito além dela quem são os que estão nos túmulos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Não fiquem admirados» é corrente sem ser coloquial; «vem a hora» preserva a dicção característica de João.
