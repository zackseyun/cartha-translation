id: JHN.5.35
reference: John 5:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: pt
  text: Ele era a lâmpada que ardia e brilhava, e vocês quiseram se alegrar por algum tempo[a] à luz dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por uma hora”. A expressão indica um período limitado, não necessariamente uma hora literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Ele
  rationale: O pronome retoma enfaticamente João Batista no contexto, sem exigir em português a forma menos natural “aquele homem”.
- source_word: λύχνος
  choice: lâmpada
  rationale: O termo designa uma lâmpada, não a luz em sentido abstrato. A escolha mantém a distinção joanina entre João, que ilumina como testemunha, e Jesus, apresentado como a luz.
- source_word: καιόμενος
  choice: ardia
  rationale: O particípio presente descreve a lâmpada em atividade contínua; “ardia” é natural e conserva a imagem do fogo aceso.
- source_word: φαίνων
  choice: brilhava
  rationale: No contexto, o verbo indica emissão de luz. “Brilhava” forma um par claro e idiomático com “ardia”.
- source_word: ἠθελήσατε
  choice: vocês quiseram
  rationale: Expressa a disposição ou vontade manifestada pelos ouvintes, sem transformar essa reação em compromisso duradouro.
- source_word: ἀγαλλιαθῆναι
  choice: se alegrar
  rationale: Comunica alegria intensa em linguagem atual e acessível, sem o tom menos comum de “exultar”.
- source_word: πρὸς ὥραν
  choice: por algum tempo
  rationale: A expressão indica duração limitada e não requer a interpretação literal de sessenta minutos.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: à luz dele
  rationale: É uma formulação portuguesa natural que preserva a metáfora de alegrar-se sob a iluminação associada ao testemunho de João.
theological_decisions:
- issue: Distinção metafórica entre João e Jesus na linguagem joanina da luz
  choice: João é chamado de “a lâmpada”, não de “a luz”.
  alternative: “Ele era a luz.”
  rationale: O grego emprega λύχνος, e não φῶς. A tradução conserva João como testemunha que ilumina, sem identificá-lo com a luz definitiva apresentada no Evangelho.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” representa naturalmente o plural ὑμεῖς; “à luz dele” evita ambiguidade de posse sem tornar a frase pesada.
