  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do grego: João é identificado como «a lâmpada» (λύχνος), caracterizada como ardente e brilhante; a reação dos interlocutores é volitiva («quiseram»); e πρὸς ὥραν é adequadamente entendido como um período limitado, não uma hora necessariamente literal. «À luz dele» é uma formulação idiomática que mantém a imagem de iluminação associada a João.'
