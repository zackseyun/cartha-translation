id: JHN.5.23
reference: John 5:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: pt
  text: para que todos honrem o Filho assim como honram o Pai. Quem não honra o Filho não honra o Pai que o enviou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade ou o resultado da declaração anterior; “para que” preserva naturalmente essa força em português.
- source_word: πάντες
  choice: todos
  rationale: Reproduz de modo direto e conciso o sentido abrangente do plural grego.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: honrem / honra
  rationale: “Honrar” expressa estima e reconhecimento devidos e permite conservar a repetição enfática do mesmo verbo ao longo do versículo.
- source_word: τὸν υἱὸν
  choice: o Filho
  rationale: No contexto joanino, trata-se de um título cristológico; a inicial maiúscula torna isso claro segundo a convenção portuguesa.
- source_word: καθὼς
  choice: assim como
  rationale: Marca uma correspondência forte entre a honra dada ao Filho e a honra dada ao Pai, sem ampliar nem enfraquecer a comparação.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: É uma designação pessoal de Deus no contexto; a inicial maiúscula segue a convenção editorial corrente.
- source_word: ὁ μὴ τιμῶν
  choice: Quem não honra
  rationale: Expressa de maneira idiomática o particípio substantivado com sentido genérico, sem perder sua força universal.
- source_word: τὸν πέμψαντα αὐτόν
  choice: que o enviou
  rationale: A oração relativa modifica “o Pai”; “enviou” traduz diretamente πέμπω, enquanto o pronome “o” retoma naturalmente o Filho.
theological_decisions:
- issue: Força da comparação entre honrar o Filho e honrar o Pai
  choice: “assim como”
  alternative: “como”
  rationale: A formulação preserva a forte correspondência expressa por καθὼς sem introduzir terminologia teológica posterior nem reduzir a tensão cristológica do texto.
- issue: Uso de maiúsculas em “Filho” e “Pai”
  choice: Maiúsculas como títulos pessoais no contexto
  alternative: “filho” e “pai” em minúsculas
  rationale: Embora o grego antigo não determine esta capitalização editorial, o contexto identifica claramente Jesus e Deus como os referentes; a convenção auxilia a leitura sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “honra” foi mantida deliberadamente para reproduzir o paralelismo e a ênfase do grego. Não são necessárias notas de rodapé neste versículo.
