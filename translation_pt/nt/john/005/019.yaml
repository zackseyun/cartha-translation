source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: pt
  text: 'Então Jesus lhes respondeu: “Em verdade, em verdade lhes digo: o Filho não pode fazer coisa alguma por si mesmo, a não ser que veja o Pai fazendo algo[a]; pois tudo o que o Pai faz[b], o Filho também faz da mesma maneira.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “o Filho não pode fazer nada por si mesmo, a não ser o que vê o Pai fazer”.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão enfatiza a correspondência: tudo o que o Pai faz, o Filho também faz da mesma maneira.'
    reason: cross_reference
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Então Jesus lhes respondeu
  rationale: “Então” mantém a conexão discursiva de οὖν sem lhe atribuir força lógica excessiva. Em português, “respondeu” expressa naturalmente a combinação semítica “respondeu e dizia”, evitando uma formulação artificial.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Em verdade, em verdade lhes digo
  rationale: Conserva a repetição solene e enfática, em linguagem clara e digna. “Lhes” representa o plural ὑμῖν.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: o Filho não pode fazer coisa alguma por si mesmo
  rationale: Preserva a linguagem de capacidade de οὐ δύναται e a negação abrangente de οὐδέν. “Por si mesmo” comunica com naturalidade a origem independente negada por ἀφ’ ἑαυτοῦ.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: a não ser que veja o Pai fazendo algo
  rationale: Mantém a construção condicional-exceptiva e representa o indefinido τι por “algo”, sem restringir antecipadamente o objeto da ação.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: pois tudo o que o Pai faz
  rationale: A construção relativa com ἄν e subjuntivo tem sentido geral, expresso por “tudo o que”. Repetir “o Pai” identifica com clareza o referente de ἐκεῖνος, pois “aquele” seria pouco natural e potencialmente distanciador em português.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: o Filho também faz da mesma maneira
  rationale: Conserva tanto a correspondência das obras quanto o advérbio ὁμοίως, sem reduzir a afirmação apenas a “faz o mesmo”.
theological_decisions:
- issue: A incapacidade do Filho de agir ἀφ’ ἑαυτοῦ
  choice: não pode fazer coisa alguma por si mesmo
  alternative: não faz coisa alguma por iniciativa própria
  rationale: O texto fala explicitamente de capacidade, não apenas de escolha ou iniciativa. A tradução mantém a tensão entre dependência e perfeita correspondência de ação, sem definir além do texto a natureza dessa relação.
- issue: Identificação de υἱός e πατήρ como títulos relacionais
  choice: o Filho / o Pai
  alternative: o filho / o pai
  rationale: As maiúsculas indicam que, no contexto, os termos designam especificamente Jesus e Deus em sua relação recíproca; não acrescentam um título ausente do sentido do texto.
- issue: Força de ὁμοίως na ação do Filho
  choice: também faz da mesma maneira
  alternative: também faz o mesmo
  rationale: “Da mesma maneira” retém a afirmação explícita de ὁμοίως e deixa intacto o alcance teológico da correspondência, sem explicá-lo como mera imitação nem como ação independente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi naturalizada onde a reprodução do aspecto imperfeito de ἔλεγεν resultaria artificial, mas a repetição enfática “Em verdade, em verdade” e a tensão entre incapacidade independente e correspondência plena de ação foram preservadas.
