id: JHN.5.14
reference: John 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: pt
  text: 'Depois dessas coisas, Jesus o encontrou no templo e lhe disse: “Veja, você ficou curado.[a] Não peque mais, para que não lhe aconteça algo pior.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego pode ser traduzido mais literalmente por “você se tornou são”, destacando a condição restaurada como resultado do que aconteceu.
    reason: lexical_alternative
  - marker: b
    text: A advertência não declara explicitamente que a enfermidade anterior tenha sido causada por um pecado específico, nem esclarece se o que seria “pior” é sofrimento nesta vida, juízo final ou ambos.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva o demonstrativo plural e a sequência narrativa característica de João, sem deixar de soar natural em português.
- source_word: εὑρίσκει
  choice: encontrou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma mais natural na narrativa portuguesa, sem alterar a sequência do acontecimento.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Ἱερόν designa o complexo do templo, não especificamente o santuário interior; “templo” é a forma concisa e usual em português.
- source_word: Ἴδε
  choice: Veja
  rationale: Mantém a função de chamar a atenção, em linguagem atual e digna, sem o tom arcaico de “Eis”.
- source_word: ὑγιὴς γέγονας
  choice: você ficou curado
  rationale: Expressa tanto a mudança ocorrida quanto o estado presente resultante, de modo mais natural em português do que uma reprodução rígida de “tornou-se são”.
- source_word: μηκέτι ἁμάρτανε
  choice: Não peque mais
  rationale: Comunica a ordem de cessar o pecado a partir de agora, sem inferir indevidamente que o aspecto verbal descreve necessariamente uma prática contínua.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: para que não lhe aconteça algo pior
  rationale: Reproduz com clareza a finalidade ou o resultado visado, preservando a indefinição de τι e a natureza não especificada do que seria “pior”.
theological_decisions:
- issue: Relação entre pecado e sofrimento na advertência de Jesus
  choice: Traduzir diretamente a advertência, sem afirmar que a enfermidade anterior foi causada por um pecado específico e sem definir a natureza do resultado pior.
  alternative: Entender a enfermidade anterior como punição direta por um pecado específico, ou restringir o resultado pior ao sofrimento temporal ou ao juízo final.
  rationale: O grego associa a advertência contra o pecado à possibilidade de algo pior, mas não explicita a causa da enfermidade anterior nem determina se o resultado pior é sofrimento temporal, juízo final ou ambos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural para brasileiros. “Você” favorece clareza e acessibilidade; a sintaxe permanece digna e próxima da estrutura do texto grego, sem arcaísmos.
