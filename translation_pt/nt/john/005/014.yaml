  source_fidelity: A tradução preserva adequadamente a sequência de μετὰ ταῦτα, o sentido narrativo de εὑρίσκει, a referência ao complexo do templo (ἱερόν), a chamada de atenção Ἴδε, a condição restaurada expressa por ὑγιὴς γέγονας e a advertência final sem especificar a natureza de «algo pior». «Você ficou curado» comunica de modo idiomático tanto a mudança ocorrida quanto seu estado resultante, sem introduzir uma causa além do que o contexto permite.
  naturalness: O português é moderno, claro e adequado a leitores brasileiros sem depender de regionalismos marcados. «Depois dessas coisas» é um pouco mais formal que «depois disso», mas é natural e justifica-se por refletir o plural do grego. A fala direta mantém registro digno e acessível.
