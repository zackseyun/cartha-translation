  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: pt
  text: 'Mas ele lhes respondeu: “Meu Pai continua trabalhando até agora, e eu também trabalho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve com a acusação anterior e introduz naturalmente a resposta de Jesus.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: ele lhes respondeu
  rationale: Equivalente idiomático e conciso do verbo deponente com objeto indireto no dativo.
- source_word: Ὁ πατήρ μου
  choice: Meu Pai
  rationale: Preserva a referência pessoal e a força teológica da expressão usada por Jesus.
- source_word: ἕως ἄρτι
  choice: até agora
  rationale: Indica continuidade que chega ao momento presente; é a formulação portuguesa mais direta e natural.
- source_word: ἐργάζεται
  choice: continua trabalhando
  rationale: Explicita de modo natural em português a atividade contínua do Pai até o presente, sugerida pela combinação do presente com ἕως ἄρτι.
- source_word: κἀγὼ
  choice: e eu também
  rationale: Preserva o valor aditivo da crase κἀγώ e coloca a atividade de Jesus em paralelo com a do Pai.
- source_word: ἐργάζομαι
  choice: trabalho
  rationale: O presente português é natural depois de “também” e mantém o paralelo verbal sem exigir uma perífrase repetitiva.
theological_decisions:
- issue: Relação entre a obra de Jesus e a obra do Pai no sábado
  choice: 'Manter a afirmação direta e o paralelo: “Meu Pai continua trabalhando até agora, e eu também trabalho.”'
  alternative: “Meu Pai trabalha até agora, e eu também trabalho.”
  rationale: O grego põe deliberadamente a atividade do Pai e a de Jesus em paralelo. A tradução conserva essa força e a tensão teológica sem acrescentar explicações sobre o sábado, prerrogativa divina ou igualdade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Continua trabalhando” comunica a duração até o presente, enquanto “eu também trabalho” evita uma repetição pesada e preserva a correspondência entre as duas ações.
