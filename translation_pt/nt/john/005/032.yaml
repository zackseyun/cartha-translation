id: JHN.5.32
reference: John 5:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: pt
  text: Há outro que testemunha a meu respeito[a], e eu sei que é verdadeiro o testemunho que ele dá a meu respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: dá testemunho a meu respeito.'
    reason: Alternativa lexical que explicita a expressão idiomática correspondente a “testemunha”.
lexical_decisions:
- source_word: ἄλλος
  choice: outro
  rationale: Traduz diretamente a ideia de outra pessoa, em contraste com o próprio Jesus, sem identificar quem ela é.
- source_word: ὁ μαρτυρῶν
  choice: que testemunha
  rationale: O particípio presente substantivado descreve aquele que dá testemunho; esta formulação é natural em português e mantém o sentido verbal contínuo.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: περί com genitivo indica o assunto ou referente do testemunho. A expressão é clara, corrente e digna em português.
- source_word: οἶδα
  choice: eu sei
  rationale: Equivalente direto e natural do verbo grego de conhecimento; o pronome explícito preserva a ênfase do sujeito.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Predica que o testemunho corresponde à verdade, sem acrescentar as noções mais interpretativas de validade jurídica ou confiabilidade.
- source_word: ἡ μαρτυρία
  choice: o testemunho
  rationale: Mantém o caráter testemunhal e potencialmente jurídico da passagem.
- source_word: ἣν μαρτυρεῖ
  choice: que ele dá
  rationale: Em português, “dar testemunho” é a colocação idiomática. A relativa “que” preserva a estrutura de ἣν, enquanto se evita a construção pouco natural “o testemunho que ele testemunha”.
theological_decisions:
- issue: Identidade de “outro” (ἄλλος)
  choice: Manter a referência genérica como “outro”, sem identificar a pessoa.
  alternative: Explicitar João Batista, o Pai ou outra testemunha em sentido jurídico.
  rationale: O versículo não identifica expressamente o referente. A tradução preserva essa abertura e não resolve no texto uma questão interpretativa dependente do contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o tom digno e a linguagem de testemunho do contexto, com repetição moderada de “testemunho/testemunha” e sem explicitar a identidade da outra testemunha.
