review_pass:
  verdict: revise
  source_fidelity: A expressão «mensageiros» não está no texto grego. Embora o contexto joanino indique que foram enviados representantes a João, ἀπεστάλκατε ocorre sem objeto expresso; a tradução não deve especificar que eram «mensageiros». O restante transmite adequadamente «deu testemunho da verdade».
  naturalness: «Vocês enviaram a João» preserva de modo econômico a elipse do grego e é aceitável no registro bíblico moderno. «Deu testemunho da verdade» é claro, natural e mantém o tom solene sem arcaísmo.
  terminology: «João» corresponde ao nome grego sem acrescentar «Batista». «A verdade» é preservada em «da verdade», construção portuguesa idiomática após «dar testemunho». A nota alternativa deve evitar «a favor da verdade», que pode sugerir apoio ou defesa, em vez do sentido básico de testemunho referente à verdade.
  issues:
  - severity: medium
    issue: «mensageiros» explicita indevidamente o objeto de «enviaram».
    rationale: O grego diz literalmente que os interlocutores «enviaram a João», sem nomear os enviados. O contexto pode permitir inferir representantes, mas «mensageiros» é uma especificação não exigida pelo versículo.
  - severity: low
    issue: A alternativa da nota, «testemunhou a favor da verdade», é menos precisa.
    rationale: Com μαρτυρέω e dativo, o sentido é naturalmente «dar testemunho da verdade» ou «testemunhar sobre/acerca da verdade»; «a favor de» pode introduzir uma nuance de defesa não necessária.
  revised_text: Vocês enviaram a João, e ele deu testemunho da verdade.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “testemunhou acerca da verdade”.'
    reason: lexical_alternative
