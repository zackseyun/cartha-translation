  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: pt
  text: Vocês enviaram a João, e ele deu testemunho da verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “testemunhou acerca da verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vocês
  rationale: O pronome explícito preserva a referência enfática aos interlocutores e evita a ambiguidade da forma verbal portuguesa na terceira pessoa do plural, sem intensificar para “vocês mesmos”.
- source_word: ἀπεστάλκατε πρὸς Ἰωάννην
  choice: enviaram mensageiros a João
  rationale: O perfeito grego aponta para uma ação passada relevante no contexto. Em português, “enviaram” é a forma natural; “têm enviado” sugeriria repetição. “Mensageiros” explicita com naturalidade o objeto humano subentendido, sem acrescentar o propósito da missão.
- source_word: μεμαρτύρηκε
  choice: deu testemunho
  rationale: Preserva o campo semântico forense de testemunhar e, no pretérito perfeito português, apresenta o testemunho dado por João como fato concluído e ainda pertinente.
- source_word: τῇ ἀληθείᾳ
  choice: da verdade
  rationale: É a construção portuguesa natural depois de “dar testemunho” e conserva o artigo e a ressonância joanina de ἀλήθεια.
theological_decisions:
- issue: O uso joanino de “a verdade”
  choice: da verdade
  alternative: acerca da verdade
  rationale: A tradução mantém o artigo grego e a possível densidade teológica da expressão, sem identificar de modo mais específico o que a “verdade” significa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mensageiros” torna explícito o complemento humano implícito em “enviaram a João”; evita-se “têm enviado”, que em português normalmente indicaria ação repetida.
