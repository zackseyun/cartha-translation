id: JHN.5.24
reference: John 5:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: quem ouve a minha palavra e crê naquele que me enviou tem a vida eterna e não vem a juízo[a], mas passou da morte para a vida[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não vem à condenação”. O termo grego κρίσις pode significar “juízo” em sentido geral ou, neste contexto, um juízo adverso.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego está no perfeito e indica uma transição concluída cujo resultado permanece: “passou” ou “atravessou” da morte para a vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula de Jesus em português claro e corrente, sem deixar “amém” opaco como fórmula introdutória.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa diretamente a fórmula de fala e representa o plural ὑμῖν de modo natural em português amplamente compreensível.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: quem ouve ... e crê
  rationale: Comunica o sentido genérico dos particípios substantivados, sem introduzir marcação masculina desnecessária.
- source_word: τὸν λόγον μου
  choice: a minha palavra
  rationale: Mantém a ressonância joanina de λόγος e, no contexto, é compreensível como a mensagem pronunciada por Jesus.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: crê naquele que me enviou
  rationale: Reflete πιστεύω com dativo como crer ou confiar em alguém, preservando a linguagem de fé característica de João sem expandi-la interpretativamente.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: tem a vida eterna
  rationale: O presente ἔχει indica posse atual; “vida eterna” é a expressão portuguesa estabelecida e contextualmente adequada.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: não vem a juízo
  rationale: Mantém a imagem verbal de ἔρχεται e traduz κρίσις pelo termo mais amplo “juízo”, sem decidir silenciosamente que o substantivo significa apenas condenação.
- source_word: μεταβέβηκεν
  choice: passou
  rationale: O perfeito grego descreve uma transição já realizada cujos efeitos permanecem; o pretérito perfeito português, esclarecido em nota, comunica naturalmente o acontecimento concluído.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: da morte para a vida
  rationale: Preserva o contraste joanino e a direção da passagem de um domínio para o outro em português idiomático.
theological_decisions:
- issue: Sentido de κρίσις no contexto da salvação
  choice: juízo
  alternative: condenação
  rationale: Embora o contexto possa apontar para um juízo adverso, κρίσις é lexicalmente mais amplo. “Juízo” conserva essa amplitude e a tensão teológica do texto; a alternativa é registrada em nota.
- issue: Força dos verbos presente ἔχει e perfeito μεταβέβηκεν
  choice: posse presente da vida eterna e passagem já realizada com resultado permanente
  alternative: posse somente futura da vida e absolvição apenas futura
  rationale: A tradução mantém “tem” no presente e “passou” como transição concluída, sem encaixar esses dados gramaticais em um sistema denominacional específico.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A fórmula repetida “Em verdade, em verdade” conserva a solenidade do original; “lhes digo” evita regionalismos de segunda pessoa. A ordem e os contrastes centrais do grego foram preservados sem rigidez sintática.
