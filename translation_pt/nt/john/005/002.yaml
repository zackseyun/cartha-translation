id: JHN.5.2
reference: John 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: pt
  text: Em Jerusalém, junto à Porta das Ovelhas[a], há um tanque chamado, em hebraico[b], Betesda[c], com cinco pórticos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “junto à das ovelhas”; “Porta” está subentendido, provavelmente em referência à área da Porta das Ovelhas (compare Neemias 3:1; 12:39).
    reason: lexical_alternative
  - marker: b
    text: Ou “em aramaico”. A expressão de João traduzida como “em hebraico” muitas vezes se refere à língua semítica local da Judeia, e não necessariamente ao hebraico clássico em sentido estrito.
    reason: lexical_alternative
  - marker: c
    text: Alguns manuscritos trazem “Betzata” ou “Betsaida” em vez de “Betesda”.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: há
  rationale: Mantém o presente de ἔστιν em uma construção existencial natural em português. O δέ funciona como conexão discursiva leve e não exige uma conjunção explícita neste versículo.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Emprega a forma portuguesa consagrada do topônimo, apesar da forma grega morfologicamente plural.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: junto à Porta das Ovelhas
  rationale: A expressão grega é elíptica e provavelmente indica a Porta das Ovelhas ou sua área. Como o substantivo correspondente a “porta” não está expresso, a elipse é indicada em nota.
- source_word: κολυμβήθρα
  choice: tanque
  rationale: No contexto de Jerusalém, “tanque” comunica com clareza uma estrutura construída para acumular água e soa mais adequado que “piscina”.
- source_word: ἡ ἐπιλεγομένη
  choice: chamado
  rationale: Traduz de modo conciso e natural o particípio que introduz o nome do tanque.
- source_word: Ἑβραϊστὶ
  choice: em hebraico
  rationale: Preserva a designação explícita do texto grego. Uma nota informa que o termo joanino pode abranger o aramaico local.
- source_word: Βηθεσδά
  choice: Betesda
  rationale: Segue a forma Βηθεσδά do SBLGNT e a transliteração tradicional e reconhecível em português; variantes manuscritas são registradas em nota.
- source_word: πέντε στοὰς ἔχουσα
  choice: com cinco pórticos
  rationale: Expressa naturalmente a posse indicada pelo particípio ἔχουσα. “Pórticos” representa στοά, uma passagem coberta sustentada por colunas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi ajustada para uma construção existencial natural, sem acrescentar um marcador temporal ou discursivo. “Tanque” evita a conotação recreativa moderna de “piscina”, e “pórticos” preserva o caráter arquitetônico de στοαί.
