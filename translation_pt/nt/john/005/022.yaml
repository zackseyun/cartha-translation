  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: pt
  text: Pois o Pai não julga ninguém, mas entregou todo o julgamento ao Filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Pois ... não
  rationale: «Pois» expressa a função explicativa de γάρ no contexto, enquanto a negação é incorporada naturalmente à oração em português, sem reproduzir οὐδέ de modo artificial.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: No contexto joanino, trata-se do título divino em relação ao Filho; a inicial maiúscula sinaliza esse uso titular.
- source_word: κρίνει
  choice: julga
  rationale: O presente indica uma realidade geral. «Julga» mantém a ligação lexical com κρίσιν e não restringe o sentido a condenar.
- source_word: οὐδένα
  choice: ninguém
  rationale: É a forma portuguesa mais natural e direta para a negação abrangente.
- source_word: ἀλλὰ
  choice: mas
  rationale: Marca claramente o forte contraste entre o Pai não julgar ninguém e entregar o julgamento ao Filho.
- source_word: τὴν κρίσιν πᾶσαν
  choice: todo o julgamento
  rationale: Preserva o substantivo κρίσις e a abrangência de πᾶσαν sem acrescentar explicitamente «autoridade», embora essa noção esteja relacionada no contexto.
- source_word: δέδωκεν
  choice: entregou
  rationale: O perfeito grego descreve um ato realizado com resultado vigente. «Entregou» comunica de modo natural a transferência da função de julgar; o contexto deixa claro seu efeito contínuo.
- source_word: τῷ υἱῷ
  choice: ao Filho
  rationale: Mantém o artigo e o título cristológico do grego, sem acrescentar o possessivo «seu».
theological_decisions:
- issue: Relação entre o julgamento do Pai e o julgamento do Filho
  choice: 'Manter a afirmação direta: o Pai não julga ninguém, mas entregou todo o julgamento ao Filho.'
  alternative: Acrescentar que o Pai não julga ninguém independentemente do Filho, ou limitar a declaração apenas ao julgamento final.
  rationale: O grego não contém essas qualificações. A tradução preserva a tensão teológica da declaração sem harmonização interpretativa.
- issue: Título cristológico «o Filho»
  choice: Conservar «o Filho» como título.
  alternative: Traduzir «seu filho».
  rationale: O texto grego não traz pronome possessivo, e o uso titular é importante para a relação entre Pai e Filho no contexto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa naturalidade para leitores brasileiros. A redação mantém a concisão e o paralelismo do original.
