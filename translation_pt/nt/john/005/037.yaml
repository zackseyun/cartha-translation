  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: pt
  text: E o Pai que me enviou — ele mesmo deu testemunho a meu respeito.[a] Vocês nunca ouviram a voz dele, nem viram a sua forma,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi ele quem deu testemunho a meu respeito”. O demonstrativo grego ἐκεῖνος enfatiza o Pai que enviou Jesus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sua aparência”. O termo grego εἶδος pode indicar forma visível ou aparência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: o Pai que me enviou
  rationale: O particípio aoristo articular tem função atributiva e é expresso naturalmente em português por uma oração relativa.
- source_word: ἐκεῖνος
  choice: ele mesmo
  rationale: Retém a ênfase do demonstrativo que retoma o Pai, sem a rigidez pouco natural de «aquele» neste contexto.
- source_word: μεμαρτύρηκεν
  choice: deu testemunho
  rationale: Preserva o campo semântico testemunhal de μαρτυρέω; no contexto, o perfeito indica um testemunho prestado cuja validade permanece.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Equivalente português natural para περί com genitivo, sem ampliar o sentido.
- source_word: οὔτε ... οὔτε
  choice: nunca ... nem
  rationale: Em português corrente, a primeira negação com «nunca» seguida de «nem» transmite com clareza a correlação negativa, incorporando também a força de πώποτε.
- source_word: φωνὴν αὐτοῦ
  choice: a voz dele
  rationale: «Voz» é o sentido direto de φωνή neste contexto auditivo; «dele» evita possível ambiguidade de «sua».
- source_word: πώποτε ἀκηκόατε
  choice: nunca ouviram
  rationale: A combinação de πώποτε com a negação significa «jamais, em tempo algum»; o pretérito perfeito é idiomático em português e descreve a ausência dessa experiência até o presente.
- source_word: εἶδος αὐτοῦ
  choice: a sua forma
  rationale: «Forma» conserva a amplitude de εἶδος e evita decidir se se trata especificamente de aparência, figura ou manifestação visível.
- source_word: ἑωράκατε
  choice: viram
  rationale: O pretérito perfeito é a forma portuguesa natural para a experiência negada, sem perder sua relevância presente.
theological_decisions:
- issue: A ênfase de ἐκεῖνος ao retomar o Pai
  choice: ele mesmo deu testemunho a meu respeito
  alternative: aquele deu testemunho a meu respeito
  rationale: «Ele mesmo» comunica naturalmente que o Pai é a testemunha enfatizada, sem acrescentar uma afirmação doutrinária além do texto.
- issue: O alcance de εἶδος αὐτοῦ
  choice: a sua forma
  alternative: a sua aparência
  rationale: «Forma» preserva a possível tensão entre forma visível, aparência e percepção revelatória, em vez de resolver a expressão de modo interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» oferece tratamento plural claro; «ele mesmo» preserva a ênfase sem artificialidade. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto.
