  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: pt
  text: Mas, se vocês não creem nos escritos dele[a], como crerão nas minhas palavras?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nas cartas dele». O termo grego pode designar cartas ou escritos; aqui se refere ao que Moisés escreveu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Preserva tanto a condição expressa por εἰ quanto a transição contrastiva de δέ, em português natural.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: no que ele escreveu
  rationale: No contexto, refere-se aos escritos de Moisés. A formulação é clara e idiomática, evita sugerir correspondência pessoal e não explicita no texto principal mais do que o grego.
- source_word: οὐ πιστεύετε
  choice: vocês não creem
  rationale: O presente de πιστεύω indica não aceitar como verdadeiro ou digno de crédito; «creem» conserva o vocabulário de crença e o paralelismo com a segunda ocorrência.
- source_word: πῶς
  choice: como
  rationale: Mantém a pergunta retórica sobre de que modo a fé nas palavras de Jesus poderia ocorrer diante da incredulidade nos escritos de Moisés.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: nas minhas palavras
  rationale: ῥήματα designa aqui palavras ou declarações proferidas; «palavras» é natural e preserva o contraste com aquilo que Moisés escreveu.
- source_word: πιστεύσετε
  choice: crerão
  rationale: Reproduz o futuro indicativo e mantém consistência lexical com «creem» na primeira oração.
theological_decisions:
- issue: Referente de ἐκείνου («ele»).
  choice: Manter «ele» no texto principal, referindo-se a Moisés pelo contexto imediato.
  alternative: Repetir explicitamente «Moisés».
  rationale: João 5:45–46 identifica claramente Moisés como antecedente. O pronome preserva a coesão e o grau de explicitação do grego.
- issue: Sentido de πιστεύω.
  choice: Traduzir de modo consistente por «crer».
  alternative: Traduzir por «confiar».
  rationale: O contexto enfatiza aceitar como verdadeiro o testemunho dos escritos de Moisés e as palavras de Jesus; «crer» serve naturalmente às duas ocorrências e mantém o paralelismo retórico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para tornar explícito o plural do grego e «crer» para manter o paralelismo lexical e retórico.
