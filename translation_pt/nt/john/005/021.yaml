source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: pt
  text: Pois, assim como o Pai ressuscita os mortos e lhes dá vida, assim também o Filho dá vida a quem quer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem deseja”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto o valor explicativo de γάρ quanto a comparação introduzida por ὥσπερ, em português natural.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: Título divino no contexto joanino, em paralelo com “o Filho”.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: ressuscita os mortos
  rationale: “Ressuscita” expressa com clareza o sentido do verbo no contexto de devolver os mortos à vida.
- source_word: ζῳοποιεῖ
  choice: lhes dá vida / dá vida
  rationale: A primeira forma retoma naturalmente “os mortos” pelo pronome; a segunda mantém o mesmo sentido e acomoda o objeto relativo “a quem quer”.
- source_word: οὕτως καὶ
  choice: assim também
  rationale: Mantém a correspondência enfática entre a ação do Pai e a do Filho.
- source_word: ὁ υἱὸς
  choice: o Filho
  rationale: Título cristológico no contexto, correspondendo diretamente a “o Pai”.
- source_word: οὓς θέλει
  choice: a quem quer
  rationale: Forma idiomática e digna em português moderno que preserva a volição do Filho; o plural grego não precisa ser marcado no pronome português invariável “quem”.
theological_decisions:
- issue: Paralelo entre o Pai e o Filho ao dar vida
  choice: Preservar a estrutura comparativa explícita e atribuir ao Filho a mesma ação de dar vida.
  alternative: Atenuar a comparação por meio de uma paráfrase menos direta.
  rationale: O grego estabelece deliberadamente o paralelo sem explicar sua extensão ontológica; a tradução mantém a força cristológica e a tensão do texto sem acrescentar interpretação.
- issue: A vontade do Filho em οὓς θέλει
  choice: a quem quer
  alternative: a quem deseja / a quem é de sua vontade
  rationale: “Quer” comunica de modo atual e direto a decisão volitiva do Filho, sem a informalidade excessiva de outras formulações nem a solenidade artificial de construções arcaizantes.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “dá vida” preserva o paralelismo lexical do grego; “lhes” torna explícita apenas a retomada natural de “os mortos” na primeira oração.
