  source_fidelity: A tradução preserva adequadamente o homem curado, seu desconhecimento da identidade de Jesus e a retirada de Jesus em contexto de multidão. Contudo, a sequência «pois ... porque» é estilisticamente pesada e torna desnecessariamente rígida a relação entre as duas orações explicativas. O genitivo absoluto ὄχλου ὄντος indica a circunstância da presença da multidão e pode ter matiz causal; «com uma multidão naquele lugar» a preserva sem duplicar conectivos causais.
  naturalness: «Mas o homem que tinha sido curado» e «não sabia quem ele era» são naturais e claros. A construção «pois Jesus havia se retirado discretamente, porque havia...» é compreensível, mas pouco fluente em português moderno. Uma formulação com «com uma multidão naquele lugar» é mais limpa e mantém a ligação contextual.
  terminology: «Curado» corresponde bem a ἰαθεὶς. «Retirado discretamente» comunica de modo apropriado a nuance de ἐξένευσεν, isto é, afastar-se sem chamar atenção. A nota registra alternativas lexicais sem impor uma interpretação além do texto.
