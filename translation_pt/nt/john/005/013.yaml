  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: pt
  text: Mas o homem que tinha sido curado não sabia quem ele era, pois Jesus havia se retirado discretamente[a], com uma multidão naquele lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tinha se afastado» ou «tinha saído sem ser notado». O verbo grego sugere que Jesus se retirou de modo discreto.
    reason: alternativa_lexical
lexical_decisions:
- source_word: ἰαθεὶς
  choice: o homem que tinha sido curado
  rationale: O particípio aoristo passivo substantivado indica aquele que recebeu a cura. A formulação explicita naturalmente o referente masculino e preserva tanto a voz passiva quanto a anterioridade da cura.
- source_word: οὐκ ᾔδει
  choice: não sabia
  rationale: Equivalente corrente e direto de οὐκ ᾔδει no contexto.
- source_word: τίς ἐστιν
  choice: quem ele era
  rationale: Em discurso indireto, esta é uma formulação natural em português e mantém a referência pessoal a Jesus.
- source_word: ἐξένευσεν
  choice: havia se retirado discretamente
  rationale: O verbo ἐκνεύω sugere afastar-se ou sair sem chamar atenção. A expressão conserva essa nuance, enquanto o mais-que-perfeito composto deixa clara a anterioridade em relação ao desconhecimento do homem.
- source_word: ὄχλου ὄντος
  choice: porque havia uma multidão
  rationale: O genitivo absoluto pode indicar circunstância ou causa. A tradução com «porque» expressa de modo natural a força explicativa mais provável no contexto.
- source_word: ἐν τῷ τόπῳ
  choice: naquele lugar
  rationale: Preserva a expressão locativa explícita do grego em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Retirado discretamente» evita a informalidade de «escapulido» e comunica a saída sem chamar atenção sugerida pelo verbo grego.
