  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: pt
  text: 'Quando Jesus viu esse homem deitado ali e soube que ele já estava assim havia muito tempo[a], disse-lhe: “Você quer ficar curado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele já estava ali havia muito tempo.”'
    reason: A construção grega é elíptica; no contexto, a duração pode referir-se à condição do homem ou, alternativamente, à sua permanência naquele lugar.
lexical_decisions:
- source_word: τοῦτον
  choice: aquele homem
  rationale: O demonstrativo identifica o homem específico apresentado no contexto; “aquele homem” é natural em português e explicita o referente.
- source_word: ἰδὼν
  choice: quando Jesus viu
  rationale: O particípio aoristo é expresso naturalmente por uma oração temporal, preservando a sequência narrativa.
- source_word: κατακείμενον
  choice: deitado ali
  rationale: Descreve a postura do homem e, no contexto da piscina, sua presença naquele lugar.
- source_word: γνοὺς
  choice: soube
  rationale: Comunica o conhecimento de Jesus sem indicar como ele o obteve, algo que o texto não especifica.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: ele já estava assim havia muito tempo
  rationale: A expressão é elíptica no grego. “Estava assim” remete naturalmente à condição do homem e evita afirmar, sem necessidade, que ele permanecera junto à piscina durante todo esse período.
- source_word: λέγει αὐτῷ
  choice: perguntou-lhe
  rationale: O presente histórico é vertido no passado, de modo natural na narrativa portuguesa; “perguntou” incorpora a força interrogativa da fala seguinte.
- source_word: Θέλεις
  choice: você quer
  rationale: Expressa de forma direta e corrente o desejo ou a disposição indicada por θέλω.
- source_word: ὑγιὴς γενέσθαι
  choice: ficar curado
  rationale: “Ficar” preserva a passagem a um novo estado expressa por γενέσθαι, enquanto “curado” comunica com clareza o sentido contextual de ὑγιής.
theological_decisions:
- issue: Natureza do conhecimento de Jesus em γνοὺς
  choice: Apresentar simplesmente que Jesus soube, sem explicar o meio desse conhecimento.
  alternative: Especificar que Jesus soube sobrenaturalmente ou que ficou sabendo por observação ou relato.
  rationale: O texto afirma o conhecimento de Jesus, mas não informa como ele o adquiriu; a tradução preserva essa abertura.
- issue: Duração expressa por πολὺν ἤδη χρόνον ἔχει
  choice: 'Relacionar a duração à situação ou condição do homem: “estava assim havia muito tempo”.'
  alternative: 'Relacioná-la especificamente à permanência naquele lugar: “estava ali havia muito tempo”.'
  rationale: A construção grega é elíptica. No contexto mais amplo, a longa duração da enfermidade é explícita, enquanto não se afirma claramente que todo esse tempo tenha sido passado junto à piscina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” mantém a pergunta direta e natural; “perguntou-lhe” preserva um tom narrativo cuidado sem soar arcaico.
