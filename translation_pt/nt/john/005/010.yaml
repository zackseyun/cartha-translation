id: JHN.5.10
reference: John 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: pt
  text: 'Por isso, os judeus[a] diziam ao homem que havia sido curado: “É sábado, e não lhe é permitido carregar[b] a sua esteira[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os líderes judeus” ou “os judeanos”, conforme o sentido da expressão neste contexto do Evangelho de João.
    reason: alternative_reading
  - marker: b
    text: Ou “levantar” ou “pegar”. Aqui, o contexto inclui a ideia de transportar a esteira.
    reason: lexical_alternative
  - marker: c
    text: A palavra traduzida por “esteira” se refere a um leito simples e portátil, como uma esteira ou um colchonete, e não necessariamente a uma cama completa.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito apresenta a fala em curso ou repetida no passado; “diziam” preserva esse aspecto de modo natural em português.
- source_word: οὖν
  choice: Por isso
  rationale: Mantém a ligação narrativa e inferencial com o que ocorreu anteriormente, sem a formalidade maior de “portanto”.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Reproduz a expressão grega sem restringi-la, no texto principal, a líderes ou a habitantes da Judeia, sentidos contextualmente possíveis no Evangelho de João.
- source_word: τῷ τεθεραπευμένῳ
  choice: ao homem que havia sido curado
  rationale: O particípio perfeito passivo indica uma cura já realizada cujos efeitos permanecem. “Homem” explicita de modo idiomático o referente masculino conhecido pelo contexto.
- source_word: Σάββατόν ἐστιν
  choice: É sábado
  rationale: Forma temporal natural em português; o grego sem artigo não exige aqui o sentido indefinido de “um sábado”.
- source_word: οὐκ ἔξεστίν σοι
  choice: não lhe é permitido
  rationale: Expressa proibição ou falta de autorização e preserva o teor normativo da controvérsia sobre o sábado, em linguagem corrente.
- source_word: ἆραι
  choice: carregar
  rationale: Embora o verbo possa significar “levantar” ou “pegar”, neste contexto a objeção recai sobre transportar a esteira.
- source_word: κράβαττον
  choice: esteira
  rationale: Designa um leito simples e portátil, não necessariamente uma cama com estrutura; “esteira” comunica essa simplicidade e portabilidade.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: os judeus
  alternative: os líderes judeus; os judeanos
  rationale: O versículo não identifica explicitamente os falantes como autoridades nem exige um sentido geográfico. A tradução principal conserva a amplitude do grego, enquanto a nota registra as possibilidades contextuais sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O imperfeito “diziam” conserva o aspecto verbal; as notas preservam a ambiguidade de οἱ Ἰουδαῖοι e as alternativas lexicais sem sobrecarregar o texto principal.
