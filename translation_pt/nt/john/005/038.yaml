  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do grego: a negação de ter a palavra dele em permanência nos destinatários e a razão causal, sua falta de fé naquele que ele enviou. “Naquele que ele enviou” expressa adequadamente o dativo de πιστεύετε e preserva a referência contextual ao enviado.'
