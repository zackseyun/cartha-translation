id: JHN.5.38
reference: John 5:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: pt
  text: E vocês não têm a palavra dele permanecendo em vocês[a], porque não creem naquele que ele enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanecendo entre vocês”.'
    reason: A expressão grega ἐν ὑμῖν pode ser entendida de modo distributivo, “em vocês”, ou corporativo, “entre vocês”.
lexical_decisions:
- source_word: λόγον
  choice: palavra
  rationale: “Palavra” expressa a revelação ou mensagem de Deus e preserva a dicção característica de João, sem reduzir o termo a uma mensagem genérica.
- source_word: ἔχετε
  choice: têm
  rationale: O presente de ἔχω é traduzido diretamente e indica a condição atual dos ouvintes.
- source_word: ἐν ὑμῖν μένοντα
  choice: permanecendo em vocês
  rationale: O particípio modifica “palavra” e comunica presença contínua. “Permanecendo” é natural em português e preserva o tema joanino de μένω.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão pela qual a palavra de Deus não permanece neles.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος ... τούτῳ
  choice: naquele que ele enviou
  rationale: A formulação identifica naturalmente Jesus como o enviado e mantém o Pai como sujeito de “enviou”; “naquele” também expressa adequadamente o objeto dativo de πιστεύετε.
- source_word: πιστεύετε
  choice: creem
  rationale: “Crer em alguém” é a construção portuguesa direta e tradicionalmente reconhecível para πιστεύω com referência pessoal neste contexto.
theological_decisions:
- issue: Relação entre a permanência da palavra de Deus nos ouvintes e a incredulidade deles diante do enviado
  choice: A falta de fé no enviado é apresentada como razão ou evidência de que a palavra do Pai não permanece neles.
  alternative: Entender a declaração especificamente como falta de retenção interior das Escrituras ou como afirmação técnica sobre regeneração e habitação divina.
  rationale: A tradução conserva a relação causal do texto e sua tensão teológica sem impor uma doutrina específica de regeneração, iluminação ou perseverança.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” evita regionalismos marcados; “permanecendo” conserva a linguagem temática de João.
