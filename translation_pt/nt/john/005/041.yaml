  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: pt
  text: Não recebo glória das pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “honra”, “louvor” ou “reconhecimento” em vez de “glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: glória
  rationale: Preserva a ligação lexical com o tema joanino da glória, embora aqui o termo também possa ter o sentido de honra, louvor ou reconhecimento.
- source_word: παρὰ ἀνθρώπων
  choice: das pessoas
  rationale: παρά com o genitivo indica a fonte. O plural ἀνθρώπων é genérico neste contexto; “das pessoas” é natural, abrangente e mantém o contraste entre reconhecimento humano e divino.
- source_word: οὐ λαμβάνω
  choice: não recebo
  rationale: Tradução direta do presente de λαμβάνω, sem acrescentar a ideia interpretativa de “buscar” ou “depender de”.
theological_decisions:
- issue: Natureza da declaração de Jesus sobre o reconhecimento humano
  choice: Manter a afirmação direta de que Jesus não recebe glória das pessoas
  alternative: Explicitar que Jesus não busca nem depende da aprovação humana
  rationale: O contexto favorece a ideia de que sua missão e identidade não são validadas pelo reconhecimento humano, mas a tradução não deve inserir no texto verbos como “buscar” nem transformar a frase numa negação absoluta de toda honra prestada por seres humanos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Das pessoas” comunica naturalmente o sentido genérico de ἀνθρώπων; “glória” mantém a importante conexão temática no Evangelho de João.
