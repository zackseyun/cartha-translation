  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: pt
  text: Depois disso, havia uma festa dos judeus[a], e Jesus subiu a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “dos judeus” identifica a festa como uma celebração do povo judeu. Em outros contextos de João, o termo grego também pode significar “judeanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente em português a transição narrativa, mantendo a referência ao que aconteceu antes; o demonstrativo neutro plural grego pode ser traduzido idiomaticamente pelo singular coletivo “disso”.
- source_word: ἦν
  choice: havia
  rationale: Introduz de modo natural a existência ou ocorrência da festa e corresponde ao valor contextual do imperfeito de εἰμί.
- source_word: ἑορτὴ
  choice: festa
  rationale: Designa uma celebração religiosa. “Festa” é corrente, clara e preserva o caráter festivo do termo sem sugerir necessariamente um banquete.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: O genitivo identifica a festa como uma celebração do povo judeu. Neste contexto, a referência é religiosa e coletiva, não especificamente regional.
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva a linguagem convencional de subida a Jerusalém, apropriada tanto à geografia quanto ao deslocamento de peregrinação.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
theological_decisions:
- issue: Sentido de Ἰουδαίων no uso joanino
  choice: judeus
  alternative: judeanos
  rationale: Embora Ἰουδαῖοι possa significar “judeanos” em certos contextos de João, aqui o termo identifica uma celebração judaica; “judeus” comunica melhor esse sentido sem restringi-lo aos habitantes da Judeia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Depois disso” evita rigidez desnecessária, enquanto “subiu a Jerusalém” conserva a expressão de viagem do original.
