id: JHN.5.36
reference: John 5:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: pt
  text: Eu, porém, tenho um testemunho maior que o de João,[a] pois as obras que o Pai me deu para que eu as complete — essas mesmas obras que faço — testemunham a meu respeito que o Pai me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um testemunho mais importante que o de João”.'
    reason: Alternativa de nuance para o comparativo μείζω; mantém «testemunho» como referente de μαρτυρία e preserva a elipse do genitivo «de João».
lexical_decisions:
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: “Testemunho” é natural com “tenho” e preserva o sentido probatório característico do contexto joanino, sem restringi-lo a uma pessoa que testemunha.
- source_word: μείζω τοῦ Ἰωάννου
  choice: maior que o de João
  rationale: 'A construção comparativa é elíptica: o testemunho de Jesus é maior que o testemunho de João. A expressão portuguesa explicita apenas o elemento necessário para evitar a impressão de que Jesus compara o testemunho com a pessoa de João.'
- source_word: ἔργα
  choice: obras
  rationale: “Obras” conserva a amplitude teológica do termo em João, que pode abranger os sinais e toda a atividade confiada pelo Pai, sem reduzi-lo apenas a milagres.
- source_word: δέδωκέν μοι
  choice: me deu
  rationale: O pretérito perfeito é a forma mais natural em português para a ação concluída de confiar as obras, cujo resultado permanece no contexto.
- source_word: ἵνα τελειώσω αὐτά
  choice: para realizar
  rationale: A expressão comunica propósito e, neste contexto, o cumprimento integral da tarefa confiada. “Realizar” soa natural em relação a “obras” e não sugere apenas interromper ou encerrar uma atividade.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: estas mesmas obras que faço
  rationale: “Estas mesmas” preserva a ênfase do grego, e “que faço” verte de modo claro o presente da atividade de Jesus.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: testemunham a meu respeito
  rationale: O plural exigido em português concorda com “obras”; a expressão mantém o campo semântico jurídico e probatório de testemunhar acerca de Jesus.
- source_word: ἀπέσταλκεν
  choice: me enviou
  rationale: Em português, o pretérito perfeito expressa naturalmente o envio já realizado e ainda relevante, sem tornar a frase artificial.
theological_decisions:
- issue: Natureza do testemunho que confirma a missão de Jesus
  choice: As obras confiadas pelo Pai testemunham que ele enviou Jesus.
  alternative: Entender “obras” exclusivamente como milagres que comprovam autoridade.
  rationale: O texto atribui força testemunhal às obras dadas pelo Pai, mas não limita ἔργα aos milagres. A tradução mantém a amplitude da atividade divinamente comissionada de Jesus.
- issue: Designação ὁ πατήρ
  choice: o Pai
  alternative: Deus; meu Pai
  rationale: O grego traz o título definido “o Pai”, sem o substantivo “Deus” nem possessivo explícito. A tradução preserva essa formulação e sua tensão cristológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a repetição enfática do original foram preservadas sem sacrificar a naturalidade. Os travessões destacam a retomada explicativa “estas mesmas obras que faço”.
