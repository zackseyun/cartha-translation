  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: pt
  text: E por causa disso os judeus perseguiam Jesus[a], porque ele fazia essas coisas no sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os judeanos» ou, conforme o contexto, «os líderes judeus». Em João, esta expressão muitas vezes se refere a um grupo específico que se opunha a Jesus, e não a todos os judeus sem distinção.
    reason: Leitura alternativa e esclarecimento contextual do referente de οἱ Ἰουδαῖοι.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: por causa disso
  rationale: Retoma o acontecimento anterior como causa da perseguição e preserva de modo claro a força causal da expressão grega.
- source_word: ἐδίωκον
  choice: perseguiam
  rationale: O imperfeito indica ação contínua ou repetida; o verbo comunica oposição hostil sem antecipar a intenção explícita de matar mencionada no versículo 18.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a correspondência lexical direta e não restringe no texto principal o referente a líderes, algo que depende do contexto. A nota esclarece que a expressão não abrange indistintamente todo judeu.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural do demonstrativo e remete naturalmente às ações narradas anteriormente.
- source_word: ἐποίει
  choice: fazia
  rationale: O pretérito imperfeito português expressa adequadamente uma ação em curso ou habitual, de acordo com o aspecto do imperfeito grego.
- source_word: ἐν σαββάτῳ
  choice: no sábado
  rationale: É a forma idiomática e clara de indicar o tempo sabático no contexto narrativo.
theological_decisions:
- issue: Referente e tradução de οἱ Ἰουδαῖοι em João
  choice: os judeus
  alternative: os judeus da Judeia; os líderes judeus
  rationale: O texto principal conserva a designação grega sem resolver interpretativamente seu alcance. A nota registra possibilidades contextuais e evita uma leitura generalizante contra todo o povo judeu.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O pretérito imperfeito preserva a continuidade das ações gregas; a nota mantém a ambiguidade contextual sem sobrecarregar o texto principal.
