  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: pt
  text: 'e sairão: os que fizeram o bem, para a ressurreição da vida; mas os que praticaram o mal, para a ressurreição do juízo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ressurreição da condenação”. O grego diz “juízo”, termo mais amplo; “condenação” é uma interpretação mais restrita adotada em algumas traduções.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: sairão
  rationale: No contexto dos mortos que saem dos túmulos (v. 28–29), “sairão” é direto, natural e fiel ao movimento expresso pelo verbo.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: os que fizeram o bem
  rationale: A expressão substantivada τὰ ἀγαθὰ funciona como objeto de ποιήσαντες. “Fizeram o bem” é idiomático e preserva a formulação moral abrangente.
- source_word: ἀνάστασιν ζωῆς
  choice: a ressurreição da vida
  rationale: Mantém o genitivo grego e o paralelismo com “ressurreição do juízo”, sem explicitar além do texto se se trata de origem, caráter ou resultado.
- source_word: τὰ φαῦλα πράξαντες
  choice: os que praticaram o mal
  rationale: “Praticaram o mal” preserva de modo natural a distinção lexical entre πράσσω e ποιέω; φαῦλα tem aqui sentido moral negativo, adequadamente expresso por “o mal”.
- source_word: ἀνάστασιν κρίσεως
  choice: a ressurreição do juízo
  rationale: κρίσις significa primariamente “juízo” ou “julgamento”. “Juízo” preserva a amplitude do termo e evita restringi-lo interpretativamente a “condenação”.
- source_word: δὲ
  choice: mas
  rationale: A conjunção marca o contraste entre os dois grupos e seus respectivos destinos.
theological_decisions:
- issue: Se κρίσεως deve ser traduzido de modo mais restrito como “condenação” ou mais amplo como “juízo”
  choice: juízo
  alternative: condenação
  rationale: O contraste do versículo é solene, mas κρίσις não exige por si só a leitura mais estreita “condenação”. “Juízo” preserva a tensão e a amplitude sem importar uma conclusão além do termo grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo foi preservado; “praticaram” mantém a variação verbal do grego sem soar artificial. O marcador [a] foi colocado após “juízo”, expressão à qual a nota se refere.
