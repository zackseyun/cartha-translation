id: JHN.5.43
reference: John 5:43
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: pt
  text: Eu vim em nome de meu Pai[a], e vocês não me recebem. Se outro vier em seu próprio nome[b], vocês o receberão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com a autoridade de meu Pai». A expressão grega «em nome de» pode indicar representação ou autoridade, além do nome em si.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por sua própria autoridade». A expressão «em seu próprio nome» contrasta diretamente com a vinda de Jesus «em nome de meu Pai».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: vim
  rationale: O perfeito grego descreve uma vinda realizada com resultado presente. Em português atual, «vim» é a forma mais natural neste contexto; «tenho vindo» sugeriria ação repetida ou contínua.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: em nome de meu Pai
  rationale: Mantém o idioma grego e sua possível referência tanto à representação quanto à autoridade, além de preservar o paralelo com «em seu próprio nome».
- source_word: οὐ λαμβάνετέ με
  choice: vocês não me recebem
  rationale: Aqui λαμβάνω significa receber ou aceitar Jesus, não tomá-lo fisicamente. «Recebem» preserva a dicção joanina e a repetição retórica do verbo.
- source_word: ἄλλος
  choice: outro
  rationale: Tradução direta que mantém o contraste com Jesus sem identificar ou caracterizar indevidamente essa outra pessoa.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: em seu próprio nome
  rationale: Preserva a estrutura paralela e o forte contraste entre a missão recebida do Pai e a apresentação em nome próprio.
- source_word: ἐκεῖνον λήμψεσθε
  choice: vocês o receberão
  rationale: O futuro é traduzido naturalmente e a repetição de «receber» conserva o contraste retórico com a rejeição de Jesus.
- source_word: πατρός μου
  choice: meu Pai
  rationale: A inicial maiúscula sinaliza, conforme o contexto joanino, que Jesus se refere a Deus, sem acrescentar uma explicação ao texto.
theological_decisions:
- issue: Explicitar que «meu Pai» se refere a Deus
  choice: Usar «Pai» com inicial maiúscula, sem ampliar a expressão no texto.
  alternative: Usar «pai» com inicial minúscula ou escrever «Deus, meu Pai».
  rationale: O contexto identifica claramente o referente divino. A maiúscula auxilia o leitor sem inserir palavras ausentes do grego.
- issue: Interpretar «em nome» diretamente como linguagem de autoridade
  choice: Conservar «em nome» nas duas orações.
  alternative: Traduzir «com a autoridade de meu Pai» e «por sua própria autoridade».
  rationale: O idioma pode envolver autoridade e representação, mas a explicitação no texto reduziria sua amplitude semântica. A formulação escolhida também preserva o paralelismo deliberado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A colocação «não me recebem» e «vocês o receberão» é natural para leitores brasileiros e permanece clara internacionalmente. O paralelismo do original foi mantido.
