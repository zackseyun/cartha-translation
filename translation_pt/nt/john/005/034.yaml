id: JHN.5.34
reference: John 5:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: pt
  text: Eu, porém, não recebo testemunho da parte de um ser humano; mas digo estas coisas para que vocês sejam salvos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: da parte de um ser humano
  rationale: παρά com o genitivo indica origem ou procedência. A expressão preserva o singular grego e comunica que se trata de testemunho humano, sem sugerir que Jesus esteja falando exclusivamente de um homem específico.
- source_word: μαρτυρίαν
  choice: testemunho
  rationale: O termo designa o conteúdo testemunhal e conserva a nuance probatória presente no contexto.
- source_word: λαμβάνω
  choice: recebo
  rationale: Reproduz diretamente o presente grego e mantém a formulação do texto, sem tornar explícita a possível nuance de aceitar ou depender do testemunho.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo neutro plural, referindo-se ao que Jesus está dizendo no contexto.
- source_word: λέγω
  choice: digo
  rationale: O presente simples é natural em português e corresponde ao presente indicativo grego.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: para que vocês sejam salvos
  rationale: Expressa a finalidade introduzida por ἵνα e conserva a voz passiva e a abertura teológica de σωθῆτε.
- source_word: δὲ ... ἀλλὰ
  choice: porém ... mas
  rationale: 'Preserva os dois movimentos contrastivos: a negação de receber testemunho humano e a afirmação da finalidade de suas palavras.'
theological_decisions:
- issue: Sentido de «sejam salvos» no contexto
  choice: Manter a formulação salvífica ampla, «sejam salvos».
  alternative: «sejam libertos» ou «alcancem a salvação»
  rationale: A tradução conserva o peso teológico de σῴζω sem restringi-lo a livramento físico nem especificar um modelo doutrinário de salvação.
- issue: Relação de Jesus com o testemunho humano
  choice: Traduzir literalmente que ele não «recebe testemunho da parte de um ser humano».
  alternative: Explicitar como «não dependo de testemunho humano» ou «não aceito testemunho humano».
  rationale: As paráfrases podem esclarecer uma implicação contextual, mas resolveriam a nuance de λαμβάνω além do que o texto afirma diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural ὑμεῖς. «Da parte de um ser humano» evita o caráter potencialmente excludente ou arcaizante de «do homem» e preserva o singular genérico do grego. A ordem «Eu, porém» mantém a ênfase explícita de ἐγώ.
