  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: pt
  text: 'Então lhe perguntaram: “Quem é o homem que lhe disse: ‘Pegue-a e ande’?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, apenas “Pegue e ande”. O objeto está implícito pelo contexto anterior e se refere à esteira em que o homem estava deitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: perguntaram
  rationale: O aoristo de ἐρωτάω descreve de modo direto o ato de perguntar; “perguntaram” é natural e não acrescenta uma hostilidade que o verbo, por si só, não exige.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação narrativa e a consequência do que foi dito no versículo anterior; “então” expressa esse fluxo com naturalidade.
- source_word: αὐτόν
  choice: lhe
  rationale: Retoma o homem curado como destinatário da pergunta. A construção portuguesa “lhe perguntaram” é natural e corresponde ao sentido contextual.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Quem é o homem
  rationale: Preserva a pergunta direta e a referência a um indivíduo masculino específico.
- source_word: ὁ εἰπών σοι
  choice: que lhe disse
  rationale: Reproduz naturalmente o particípio atributivo e o pronome dativo, identificando o homem pelo que disse ao curado.
- source_word: Ἆρον
  choice: Pegue-a
  rationale: Imperativo de αἴρω. O objeto está elíptico no grego, mas é recuperável do contexto anterior como a esteira do homem; o pronome feminino concorda com “esteira”.
- source_word: καὶ περιπάτει
  choice: e ande
  rationale: Traduz o imperativo presente sem ampliar indevidamente seu aspecto; “ande” é claro e idiomático no contexto da cura.
