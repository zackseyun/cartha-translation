id: JHN.5.25
reference: John 5:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: pt
  text: 'Em verdade[a], em verdade lhes digo: vem uma hora[b], e ela já está presente, em que os mortos[c] ouvirão a voz do Filho de Deus, e os que a ouvirem[d] viverão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Amém, amém, lhes digo”.'
    reason: lexical_alternative
  - marker: b
    text: “Hora” também pode ser entendida de modo mais amplo como “tempo”, mas o grego diz especificamente “hora”.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “os mortos” pode incluir um sentido espiritual presente, por causa de “já está presente”, e ao mesmo tempo antecipar a ressurreição corporal mencionada no contexto próximo.
    reason: cross_reference
  - marker: d
    text: 'Ou: “os que tiverem ouvido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Mantém a repetição solene e enfática de Jesus em português claro e tradicional. “Amém, amém” seria mais formalmente transparente, mas menos imediatamente compreensível neste uso introdutório.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Preserva a declaração direta e o endereço plural de ὑμῖν, com cadência natural em português.
- source_word: ἔρχεται ὥρα
  choice: vem uma hora
  rationale: Conserva tanto a ausência de artigo no grego quanto o termo joanino significativo “hora”, sem generalizá-lo para “tempo”.
- source_word: καὶ νῦν ἐστιν
  choice: e ela já está presente
  rationale: Expressa em português natural a formulação grega comprimida, mantendo a tensão entre a hora futura que vem e sua realidade presente.
- source_word: οἱ νεκροὶ
  choice: os mortos
  rationale: É a tradução direta e natural, sem restringir a expressão exclusivamente à morte física ou à condição espiritual.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: ouvirão a voz
  rationale: “Voz” é apropriado ao contexto pessoal, e “ouvir” traduz o verbo sem acrescentar a ideia mais forte de obedecer ou atender.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: do Filho de Deus
  rationale: Preserva integralmente o título cristológico e a estrutura transparente do grego.
- source_word: οἱ ἀκούσαντες
  choice: os que a ouvirem
  rationale: O futuro do subjuntivo é natural em português para uma ação anterior ou condicionante dentro deste enunciado orientado ao futuro. O pronome “a” retoma claramente “a voz”.
- source_word: ζήσουσιν
  choice: viverão
  rationale: Traduz diretamente ζάω sem tornar explícita apenas a ideia de ressurreição, preservando a amplitude possível do verbo neste contexto.
theological_decisions:
- issue: Referente de “os mortos” no contexto joanino
  choice: Manter simplesmente “os mortos” no texto principal.
  alternative: “os espiritualmente mortos” ou “os mortos fisicamente”
  rationale: A expressão “já está presente” sugere uma dimensão atual, enquanto o contexto próximo também aponta para a futura ressurreição corporal. A tradução não deve eliminar essa tensão.
- issue: Título cristológico “o Filho de Deus”
  choice: Conservar “o Filho de Deus” sem expansão interpretativa.
  alternative: “o Filho que pertence a Deus” ou uma paráfrase explicativa
  rationale: A formulação corresponde diretamente ao grego e mantém o peso cristológico do título sem acrescentar conteúdo doutrinário ao versículo.
- issue: Relação entre ouvir e viver
  choice: Traduzir “os que a ouvirem viverão”.
  alternative: “os que tiverem ouvido viverão”
  rationale: A construção portuguesa comunica naturalmente a sequência entre ouvir a voz do Filho e viver, sem definir além do texto se esse ouvir implica apenas percepção, acolhimento responsivo ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação favorece a clareza sem desfazer a cadência solene do dito. “Já está presente” evita o português pouco natural de uma reprodução literal como “e agora é”, preservando porém a tensão temporal do original.
