  naturalness: O texto é claro e de registro apropriado. «Vocês colocaram sua esperança» é mais natural e mais idiomático do que «vocês têm colocado a sua esperança» neste contexto.
  terminology: «Acusar», «Pai» e «Moisés» são escolhas corretas e consistentes. A nota b deve manter a interlocução em segunda pessoa e evitar apresentar como explicação do versículo uma elaboração interpretativa sobre Moisés como «mediador e testemunha da Lei».
