base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: pt
  text: 'Não pensem que eu os acusarei diante do Pai[a]; há quem os acusa: Moisés[b], em quem vocês colocaram sua esperança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não suponham que eu apresentarei uma acusação contra vocês diante do Pai”.'
    reason: lexical_alternative
  - marker: b
    text: No contexto, a referência a Moisés inclui seus escritos (vv. 46–47); aquele em quem vocês colocaram sua esperança é apresentado como acusador.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Não pensem
  rationale: Expressa naturalmente a proibição com μή e o imperativo presente, preservando o tom direto da advertência.
- source_word: κατηγορήσω
  choice: eu os acusarei
  rationale: Mantém o sentido forense de κατηγορέω sem ampliá-lo indevidamente para “condenar”.
- source_word: πρὸς τὸν πατέρα
  choice: diante do Pai
  rationale: Em contexto de acusação, “diante do Pai” comunica de modo idiomático a cena forense e preserva o título joanino.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Quem os acusa é
  rationale: Formulação natural em português que conserva o contraste enfático e o valor presente do particípio.
- source_word: Μωϋσῆς
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: εἰς ὃν
  choice: em quem
  rationale: Preserva o referente pessoal explícito do grego, sem substituir Moisés por sua Lei ou por seus escritos.
- source_word: ἠλπίκατε
  choice: vocês têm colocado a sua esperança
  rationale: O pretérito perfeito composto comunica uma postura iniciada anteriormente e ainda mantida, refletindo a força resultativa do perfeito grego.
theological_decisions:
- issue: Força forense da declaração de Jesus
  choice: “acusarei” e “acusa”
  alternative: “condenarei” e “condena”
  rationale: κατηγορέω designa acusar ou apresentar uma acusação, não pronunciar a condenação final; a tradução evita acrescentar uma afirmação judicial mais forte.
- issue: Objeto da esperança depositada em Moisés
  choice: “em quem vocês têm colocado a sua esperança”
  alternative: “na Lei de Moisés” ou “nos escritos de Moisés”
  rationale: Embora o contexto posterior destaque os escritos de Moisés, o grego se refere diretamente à pessoa de Moisés; a tradução mantém essa formulação e sua tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “vocês” torna explícito o plural de ὑμεῖς/ὑμῶν; “diante do Pai” preserva a imagem forense sem soar artificial. Todos os marcadores de nota aparecem no texto principal.
