  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: pt
  text: Pois, se vocês cressem em Moisés, creriam em mim, porque foi a meu respeito que ele escreveu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Pois, se
  rationale: Mantém a ligação explicativa de γάρ com o argumento anterior e expressa naturalmente a condição introduzida por εἰ.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: vocês cressem em Moisés
  rationale: O imperfeito integra uma condição contrária aos fatos. Em português, «crer em alguém» é a construção idiomática para aceitar como verdadeiro ou digno de crédito o que essa pessoa diz; a mesma raiz verbal é preservada nas duas orações.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: creriam em mim
  rationale: O imperfeito com ἄν forma a consequência da condição contrária aos fatos. «Creriam em mim» é natural em português e mantém o paralelismo com Moisés, sem introduzir aqui uma distinção lexical inexistente no grego.
- source_word: περὶ γὰρ ἐμοῦ
  choice: porque foi a meu respeito que
  rationale: περί com genitivo significa «a respeito de» ou «acerca de». A construção focalizadora comunica de modo natural a proeminência de ἐμοῦ sem ampliar a afirmação.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O demonstrativo retoma enfaticamente Moisés; «ele», dentro da construção focalizadora, é claro e idiomático em português.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo é adequadamente expresso pelo pretérito perfeito simples.
theological_decisions:
- issue: Natureza do testemunho de Moisés a respeito de Jesus
  choice: foi a meu respeito que ele escreveu
  alternative: ele escreveu a meu respeito
  rationale: A tradução preserva a afirmação de que os escritos de Moisés dizem respeito a Jesus, sem identificar um texto específico nem impor uma explicação cristológica mais ampla do que o grego declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Usa «vocês» para o plural de segunda pessoa e mantém o paralelismo retórico entre crer em Moisés e crer em Jesus.
