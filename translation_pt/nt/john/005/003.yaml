  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: pt
  text: 'Neles jazia uma multidão de enfermos: cegos, mancos e pessoas com membros atrofiados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ressequidos” ou “atrofiados”; o termo grego provavelmente se refere a pessoas com membros ressequidos, encolhidos ou sem função.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Neles
  rationale: O demonstrativo feminino plural retoma as estruturas mencionadas no versículo anterior. Em português, o pronome masculino plural concorda naturalmente com «pórticos», antecedente contextual, sem repetir um substantivo ausente deste versículo.
- source_word: κατέκειτο
  choice: jazia
  rationale: O imperfeito de κατάκειμαι descreve pessoas deitadas ou prostradas. «Jazia» preserva o aspecto durativo e concorda com o sujeito coletivo singular «uma multidão», em registro narrativo digno.
- source_word: πλῆθος
  choice: uma multidão
  rationale: Mantém o sentido coletivo de grande número e reproduz a construção singular do grego.
- source_word: τῶν ἀσθενούντων
  choice: de enfermos
  rationale: O particípio designa pessoas doentes ou debilitadas fisicamente. «Enfermos» é claro, conciso e adequado ao registro bíblico moderno.
- source_word: τυφλῶν
  choice: cegos
  rationale: Equivalente direto e natural para a primeira categoria da enumeração.
- source_word: χωλῶν
  choice: mancos
  rationale: Expressa pessoas com dificuldade ou incapacidade para caminhar, sem ampliar o termo para toda forma de deficiência.
- source_word: ξηρῶν
  choice: pessoas com membros atrofiados
  rationale: ξηρός significa literalmente «seco» ou «ressequido» e, aplicado a pessoas, provavelmente aponta para membros ressequidos, encolhidos ou sem função. A formulação comunica o sentido corporal provável sem reduzir necessariamente a condição à paralisia.
