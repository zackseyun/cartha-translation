  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: pt
  text: Havia ali um homem que estava doente havia trinta e oito anos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em sua fraqueza» ou «em sua enfermidade». A palavra grega pode se referir de modo amplo a fraqueza física, enfermidade ou doença.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: Havia
  rationale: δέ é um conectivo leve que dá continuidade à narrativa, sem exigir contraste forte. Em português, «Havia» introduz naturalmente a personagem sem acrescentar um marcador temporal ausente no grego.
- source_word: τις ἄνθρωπος
  choice: um homem
  rationale: A expressão introduz um indivíduo indefinido; «um homem» é natural e preserva a referência masculina singular.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio situa o homem no lugar mencionado no contexto anterior; «ali» é a forma idiomática em português.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: trinta e oito anos
  rationale: É a forma padrão e clara de expressar o numeral em português.
- source_word: ἔχων
  choice: estava ... havia
  rationale: O particípio presente, junto da expressão de duração, descreve uma condição contínua até aquele momento. «Estava doente havia...» comunica essa duração de maneira natural.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: doente
  rationale: ἀσθένεια pode indicar fraqueza, enfermidade ou doença. No contexto, «doente» expressa naturalmente a condição física sem especificar sua natureza exata; a nota preserva a amplitude lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «estava doente havia trinta e oito anos» preserva a duração da condição e evita tanto um literalismo pouco natural quanto a inferência mais específica de que o homem era paralítico.
