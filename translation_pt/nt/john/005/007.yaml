source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: pt
  text: 'O homem doente lhe respondeu: “Senhor, não tenho ninguém que me ponha no tanque quando a água é agitada; enquanto estou indo, outro desce antes de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: o homem doente
  rationale: Expressa naturalmente o particípio substantivado e deixa claro que se trata do enfermo mencionado no contexto.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva a forma normal de tratamento do grego e sua possível ressonância cristológica, sem reduzir antecipadamente o termo a mero 'senhor' ou 'senhor meu'.
- source_word: κολυμβήθραν
  choice: tanque
  rationale: Designa com clareza o reservatório de água; é uma opção corrente e adequada ao contexto de Betesda.
- source_word: ταραχθῇ
  choice: é agitada
  rationale: Mantém a ideia passiva de a água ser posta em movimento, sem explicar sua causa.
- source_word: βάλῃ με
  choice: me ponha
  rationale: Em português, comunica de modo natural a ação de colocar o homem dentro do tanque, sem a conotação desnecessariamente brusca de 'me lançar'.
- source_word: καταβαίνει
  choice: desce
  rationale: Conserva a imagem espacial do original, segundo a qual outra pessoa entra descendo ao tanque.
theological_decisions:
- issue: Sentido de Κύριε como forma de tratamento
  choice: Senhor
  alternative: senhor / meu senhor
  rationale: A tradução mantém a ambiguidade entre tratamento respeitoso e título de maior peso cristológico, sem decidir quanto o homem compreendia sobre Jesus naquele momento.
- issue: Causa da agitação da água
  choice: não especificada
  alternative: explicá-la por ação angelical
  rationale: O versículo na forma textual fornecida apenas menciona que a água é agitada; não se introduz uma explicação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com fluência natural para leitores brasileiros e ampla inteligibilidade internacional. A estrutura temporal e o contraste do grego foram preservados sem rigidez excessiva.
