reference: John 5:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: pt
  text: Vocês examinam as Escrituras porque pensam ter nelas a vida eterna[a]; e são elas que dão testemunho a meu respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Examinem as Escrituras”, entendendo Ἐραυνᾶτε como imperativo, e não como indicativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Vocês examinam
  rationale: A forma grega pode ser indicativa ou imperativa. O indicativo se encaixa naturalmente no contexto, em que Jesus descreve e critica a prática dos seus interlocutores; a alternativa imperativa é preservada em nota.
- source_word: τὰς γραφάς
  choice: as Escrituras
  rationale: No uso joanino, a expressão se refere aos escritos sagrados de Israel; “as Escrituras” é a equivalência portuguesa consagrada e clara.
- source_word: ὅτι
  choice: porque
  rationale: A conjunção é entendida em sentido causal, introduzindo a razão pela qual eles examinam as Escrituras.
- source_word: δοκεῖτε
  choice: pensam
  rationale: Expressa a convicção ou suposição dos interlocutores, com leve tom crítico, sem intensificá-lo indevidamente.
- source_word: ἐν αὐταῖς
  choice: nelas
  rationale: Mantém o sentido locativo de ἐν e retoma naturalmente “as Escrituras”.
- source_word: ζωὴν αἰώνιον
  choice: a vida eterna
  rationale: É a expressão joanina usual, traduzida de modo claro e consistente.
- source_word: ἐκεῖναί
  choice: são elas
  rationale: O pronome enfático retoma “as Escrituras”; a construção portuguesa “são elas que” preserva essa ênfase.
- source_word: αἱ μαρτυροῦσαι
  choice: que dão testemunho
  rationale: Preserva a importante linguagem joanina de testemunho e soa natural em português digno e corrente.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Traduz com naturalidade περί com genitivo, em registro claro e digno.
theological_decisions:
- issue: Modo verbal de Ἐραυνᾶτε
  choice: 'Indicativo: “Vocês examinam as Escrituras”'
  alternative: 'Imperativo: “Examinem as Escrituras”'
  rationale: A forma grega admite ambos os modos. O contexto imediato favorece o indicativo, pois Jesus descreve a prática dos seus interlocutores e mostra que, apesar de examinarem as Escrituras, não reconhecem aquele de quem elas testemunham. A alternativa imperativa permanece na nota para conservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Vocês” comunica com clareza o plural de ὑμεῖς. A formulação mantém tom digno, linguagem bíblica reconhecível e a ambiguidade verbal relevante por meio de nota.
