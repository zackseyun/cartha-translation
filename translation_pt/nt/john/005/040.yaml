id: JHN.5.40
reference: John 5:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: pt
  text: No entanto, vocês não querem vir a mim para terem vida[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vocês não querem vir a mim para terem vida.” A conjunção grega também pode ser traduzida simplesmente por “e”.'
    reason: lexical_alternative
  - marker: b
    text: Em João, “vida” muitas vezes tem o sentido mais amplo de vida procedente de Deus, isto é, vida eterna, embora a palavra “eterna” não apareça aqui.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: No entanto
  rationale: Embora καί normalmente signifique “e”, aqui a sequência do argumento lhe confere valor contrastivo. “No entanto” expressa esse contraste com naturalidade sem o tornar absoluto.
- source_word: οὐ θέλετε
  choice: vocês não querem
  rationale: θέλω pode indicar querer, desejar ou estar disposto. “Não querem” é direto e natural, preserva o caráter volitivo e evita a intensificação interpretativa de “vocês se recusam”.
- source_word: ἐλθεῖν πρός με
  choice: vir a mim
  rationale: A construção significa idiomaticamente “vir a” alguém. Mantém-se a imagem concreta usada por João, sem substituí-la pela interpretação “crer em mim”.
- source_word: ἵνα
  choice: para
  rationale: Introduz aqui propósito. Em português, “para terem” comunica esse sentido de maneira clara e corrente.
- source_word: ζωὴν
  choice: vida
  rationale: ζωή significa “vida”. Em João, o termo frequentemente se refere à vida procedente de Deus, mas o adjetivo “eterna” não aparece neste versículo.
- source_word: ἔχητε
  choice: terem
  rationale: O presente do subjuntivo após ἵνα é expresso naturalmente pela construção portuguesa “para terem”, preservando a relação de propósito.
theological_decisions:
- issue: Traduzir ζωὴν como “vida” ou explicitar “vida eterna”
  choice: vida
  alternative: vida eterna
  rationale: O uso joanino confere ao termo profundidade salvífica, mas αἰώνιος (“eterna”) não está no texto. A tradução conserva o que é lexicalmente expresso e deixa o contexto comunicar o sentido mais amplo.
- issue: Interpretar “vir a mim” no texto principal como uma referência explícita à fé
  choice: vir a mim
  alternative: crer em mim
  rationale: Em João, vir a Jesus está intimamente relacionado com crer, mas o original mantém a imagem do movimento. Preservá-la evita substituir a formulação do texto por sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O tratamento plural “vocês” é natural no português brasileiro; a construção evita regionalismos marcados. “No entanto” explicita com moderação o contraste contextual, enquanto a nota registra a tradução mais literal da conjunção.
