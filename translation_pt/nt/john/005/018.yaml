source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: pt
  text: Por isso, os judeus[a] procuravam ainda mais matar Jesus, pois ele não apenas violava o sábado, mas também dizia que Deus era seu próprio Pai, fazendo-se igual a Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em João, a expressão «os judeus» muitas vezes se refere, conforme o contexto, mais especificamente aos opositores de Jesus na Judeia ou a certas autoridades judaicas, e não indistintamente a todo o povo judeu.
    reason: cultural_note
  - marker: b
    text: 'Literalmente: «fazendo a si mesmo igual a Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Por isso
  rationale: Expressa naturalmente em português a conexão conclusiva cumulativa das partículas, sem a redundância pouco idiomática de «por esta razão, portanto».
- source_word: μᾶλλον
  choice: ainda mais
  rationale: Preserva a intensificação comparativa da intenção já mencionada no contexto.
- source_word: ἐζήτουν αὐτὸν ... ἀποκτεῖναι
  choice: procuravam ainda mais matar Jesus
  rationale: O imperfeito indica ação contínua ou reiterada. O nome «Jesus» evita uma sequência pronominal pouco clara em português, sem alterar o referente.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a forma lexical do grego; a provável referência contextual a opositores judeus ou autoridades da Judeia é esclarecida em nota, sem estreitar o texto principal.
- source_word: ἔλυε τὸ σάββατον
  choice: violava o sábado
  rationale: Neste contexto, λύω significa transgredir ou deixar de observar a norma sabática; «violava» é claro e natural, preservando a caracterização apresentada no relato.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: dizia que Deus era seu próprio Pai
  rationale: Preserva o valor verbal de ἔλεγε e a ênfase de ἴδιον na relação filial própria reivindicada por Jesus.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: fazendo-se igual a Deus
  rationale: Reproduz de perto a construção participial e mantém integralmente sua força cristológica e acusatória.
theological_decisions:
- issue: Força cristológica da igualdade com Deus
  choice: fazendo-se igual a Deus
  alternative: afirmando ser igual a Deus
  rationale: A opção conserva a construção participial do original e não reduz a afirmação de igualdade, nem acrescenta terminologia doutrinária posterior.
- issue: Referente de «os judeus» no Evangelho de João
  choice: os judeus no texto principal, com esclarecimento contextual em nota
  alternative: os líderes judeus / os judeus da Judeia
  rationale: O grego traz οἱ Ἰουδαῖοι. A nota previne uma generalização indevida sem substituir o termo por uma identificação contextual mais estreita do que o original explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita redundância nas partículas iniciais, conserva a continuidade verbal do imperfeito e mantém a ambiguidade contextual de οἱ Ἰουδαῖοι mediante nota.
