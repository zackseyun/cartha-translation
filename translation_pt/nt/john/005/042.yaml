  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: pt
  text: 'Mas eu conheço vocês: vocês não têm o amor de Deus em si mesmos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “vocês não têm amor por Deus em si mesmos”. O grego também pode ser entendido como “o amor que vem de Deus” ou “o amor do próprio Deus”.
    reason: Leitura alternativa do genitivo grego τοῦ θεοῦ.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com o contexto anterior de modo natural e conciso.
- source_word: ἔγνωκα
  choice: eu conheço
  rationale: O perfeito comunica um conhecimento estabelecido; o presente em português expressa naturalmente esse valor resultativo.
- source_word: ὑμᾶς
  choice: vocês
  rationale: É o objeto direto plural; “vocês” oferece leitura clara e amplamente compreensível.
- source_word: ὅτι
  choice: ': vocês não têm'
  rationale: Introduz o conteúdo do que Jesus sabe a respeito deles; os dois-pontos reproduzem essa relação com naturalidade, sem tornar a frase rígida.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: o amor de Deus
  rationale: Mantém a construção genitiva e sua ambiguidade genuína entre amor dirigido a Deus e amor proveniente de Deus ou pertencente a ele.
- source_word: οὐκ ἔχετε
  choice: vocês não têm
  rationale: Expressa diretamente o estado presente indicado pelo verbo negado.
- source_word: ἐν ἑαυτοῖς
  choice: em si mesmos
  rationale: Preserva o sentido reflexivo e interior da expressão grega, concordando com o referente plural.
theological_decisions:
- issue: Sentido do genitivo em “o amor de Deus”
  choice: Manter “o amor de Deus” no texto principal, sem definir a direção do amor.
  alternative: “amor por Deus” ou “amor que vem de Deus”
  rationale: O genitivo τοῦ θεοῦ admite mais de uma relação semântica. O contexto favorece fortemente a falta de amor por Deus, mas a forma grega não exclui uma compreensão mais ampla; por isso, a ambiguidade é preservada e explicada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” explicita naturalmente o plural; “em si mesmos” preserva o valor reflexivo. A nota mantém a ambiguidade teológica presente no grego.
