  text: ἐγείρεται ἐκ τοῦ δείπνου καὶ τίθησιν τὰ ἱμάτια καὶ λαβὼν λέντιον διέζωσεν ἑαυτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: pt
  text: Levanta-se da ceia, tira as vestes exteriores e, pegando uma toalha, amarra-a à cintura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cinge-se com ela».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: Levanta-se
  rationale: Preserva o presente histórico vívido do grego e expressa de modo natural o ato de se levantar.
- source_word: ἐκ τοῦ δείπνου
  choice: da ceia
  rationale: δεῖπνον designa a refeição; «ceia» é natural no contexto joanino e mantém a referência tradicional sem impor uma hora moderna específica.
- source_word: τίθησιν τὰ ἱμάτια
  choice: tira as vestes exteriores
  rationale: Neste contexto, τίθημι indica pôr de lado, e ἱμάτια se refere às peças exteriores; a formulação evita sugerir que ele tenha ficado completamente despido.
- source_word: λαβὼν λέντιον
  choice: pegando uma toalha
  rationale: Traduz com naturalidade o particípio aoristo e o objeto λέντιον, um pano ou toalha usado no serviço.
- source_word: διέζωσεν ἑαυτόν
  choice: amarra-a à cintura
  rationale: Comunica em português atual o ato de cingir-se com a toalha; o pronome retoma explicitamente «toalha».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. O presente histórico foi mantido. A nota preserva a formulação mais literal de διαζώννυμι sem usar «cingir» no texto principal.
