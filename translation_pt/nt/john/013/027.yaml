  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: pt
  text: 'E, depois do pedaço de pão[a], Satanás entrou nele. Então Jesus lhe disse: “O que você está fazendo, faça mais depressa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bocado”. O grego se refere a um pequeno pedaço de alimento, aqui provavelmente o pão mergulhado dado durante a refeição.
    reason: lexical_alternative
  - marker: b
    text: Ou “faça depressa”. A palavra grega está na forma comparativa, literalmente “mais depressa”, embora possa ser entendida de modo idiomático como “depressa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: pedaço de pão
  rationale: Designa um pequeno pedaço de alimento; no contexto, trata-se provavelmente do pão molhado dado durante a refeição. “Pedaço de pão” é claro e concreto em português atual.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: entrou nele
  rationale: Reproduz diretamente a construção de entrada pessoal e hostil, sem reduzi-la a metáfora nem ampliá-la com explicações.
- source_word: ὁ Σατανᾶς
  choice: Satanás
  rationale: É a forma própria tradicional e plenamente compreensível em português para o nome ou título grego.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Por isso, Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo passado narrativo natural em português; οὖν indica uma conexão inferencial ou consequencial com o que precede.
- source_word: Ὃ ποιεῖς
  choice: O que você está fazendo
  rationale: Preserva o aspecto presente da expressão, evitando a interpretação mais específica “o que você está prestes a fazer”.
- source_word: ποίησον
  choice: faça
  rationale: O imperativo simples conserva a brevidade e a força decisiva do grego.
- source_word: τάχιον
  choice: mais depressa
  rationale: Preserva o valor comparativo da forma grega, em vez de nivelá-la simplesmente para “depressa”.
theological_decisions:
- issue: Natureza da ação de Satanás em relação a Judas
  choice: Manter a formulação direta “Satanás entrou nele”
  alternative: “Satanás tomou o controle dele” ou “Judas se entregou a Satanás”
  rationale: O texto afirma uma entrada pessoal de Satanás, mas não explica seu mecanismo nem define toda a relação entre ação satânica e responsabilidade humana. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O tratamento “você” comunica naturalmente o singular no português brasileiro; a sintaxe mantém a sequência enfática do original sem soar excessivamente artificial.
