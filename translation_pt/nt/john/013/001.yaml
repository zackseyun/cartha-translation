  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: pt
  text: Antes da festa da Páscoa, Jesus, sabendo que sua hora havia chegado para partir deste mundo para o Pai, tendo amado os seus que estavam no mundo, amou-os até o fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por completo” ou “plenamente”. A expressão grega pode indicar tanto um amor que persevera até o momento final quanto um amor demonstrado em toda a sua plenitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Antes da Festa da Páscoa
  rationale: Πρό com o genitivo indica anterioridade temporal; δέ funciona como conexão discursiva leve e não exige uma palavra específica em português. A formulação preserva a referência explícita à festa.
- source_word: εἰδὼς ὁ Ἰησοῦς
  choice: Jesus sabia
  rationale: O particípio expressa a consciência de Jesus naquele momento. A oração finita é mais natural em português e mantém a relação circunstancial com a ação principal.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: havia chegado a sua hora
  rationale: Preserva o idioma joanino da 'hora' decisiva de Jesus, usando o mais-que-perfeito composto para indicar que ela já havia chegado.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: de passar deste mundo para o Pai
  rationale: μεταβαίνω descreve a passagem de uma esfera a outra. 'Passar deste mundo para o Pai' conserva o movimento e a solenidade sem explicitar apenas morte ou exaltação.
- source_word: ἀγαπήσας
  choice: Tendo amado
  rationale: Mantém a forma participial antecedente ou resumitiva, apresentando o amor anterior de Jesus como pano de fundo da afirmação culminante.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: os seus que estavam no mundo
  rationale: '''Os seus'' conserva a expressão relacional ampla sem restringi-la explicitamente aos discípulos; a oração relativa mantém sua localização no mundo.'
- source_word: εἰς τέλος
  choice: até o fim
  rationale: É uma tradução direta que preserva tanto a possível dimensão temporal quanto, por ressonância, a ideia de amor completo; a ambiguidade é esclarecida em nota.
- source_word: ἠγάπησεν αὐτούς
  choice: amou-os
  rationale: Traduz diretamente o verbo ἀγαπάω e seu objeto, mantendo a repetição deliberada do campo lexical do amor.
theological_decisions:
- issue: Sentido de εἰς τέλος na declaração culminante sobre o amor de Jesus
  choice: até o fim
  alternative: por completo; plenamente
  rationale: A expressão grega admite um sentido temporal, de amor perseverante até o momento final, e um sentido qualitativo, de amor em sua medida plena. O texto principal conserva a formulação aberta, e a nota registra a amplitude sem escolher apenas uma leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A frase grega longa foi dividida em duas para clareza, sem alterar sua progressão lógica. 'Festa da Páscoa', 'sua hora', 'os seus' e 'até o fim' preservam o vocabulário e as ressonâncias joaninas.
