  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: pt
  text: 'Então, ele chega a Simão Pedro. Este lhe diz: “Senhor, o senhor está lavando os meus pés?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: chega
  rationale: Mantém o presente histórico de João e expressa naturalmente o movimento de Jesus até Simão Pedro.
- source_word: οὖν
  choice: Então
  rationale: Assinala a progressão narrativa de modo natural, sem impor uma conclusão lógica mais forte que o contexto.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: a Simão Pedro
  rationale: Traduz de modo idiomático o movimento em direção a uma pessoa.
- source_word: λέγει αὐτῷ
  choice: Este lhe pergunta
  rationale: O presente histórico é preservado; “pergunta” é exigido pela forma interrogativa da fala, e “Este” identifica Simão Pedro como sujeito, evitando a ambiguidade que “ele” produziria em português.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto a possível ressonância cristológica própria do Evangelho de João.
- source_word: σύ
  choice: você
  rationale: O pronome explícito e enfático é representado pelo “você” expresso; a ordem e o contexto comunicam a surpresa de Pedro.
- source_word: μου
  choice: meus
  rationale: O genitivo possessivo é vertido pela forma possessiva natural em português.
- source_word: νίπτεις
  choice: vai lavar
  rationale: No contexto, a ação chegou a Pedro, mas sua lavagem ainda é questionada; a construção perifrástica portuguesa comunica naturalmente a ação iminente, sem confundir νίπτω, lavar uma parte do corpo, com banhar o corpo inteiro.
- source_word: τοὺς πόδας
  choice: os meus pés
  rationale: A construção portuguesa com artigo e possessivo é natural e reflete a relação possessiva indicada por μου.
theological_decisions:
- issue: Sentido de κύριε no tratamento dirigido a Jesus
  choice: Senhor
  alternative: senhor, como simples tratamento respeitoso
  rationale: “Senhor” mantém aberta tanto a leitura de tratamento respeitoso quanto a ressonância cristológica, sem decidir silenciosamente entre elas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O presente histórico foi mantido. “Você” evita a solenidade regional de “tu” e torna audível o pronome enfático grego; “Senhor” conserva a ambiguidade relevante do tratamento.
