    rationale: O verbo grego está no presente e, no contexto da lavagem já em curso, é melhor representado em português por um presente simples ou progressivo. A perífrase com “vai” acrescenta uma nuance aspectual não explicitada pelo texto.
  - severity: low
    issue: A nota apresenta “pergunta” como alternativa a “diz”, embora “pergunta” esteja no próprio texto e a forma grega seja λέγει.
    rationale: A fala interrogativa permite traduzir pragmaticamente por “pergunta”, mas “diz” reflete mais diretamente o verbo grego; a nota atual evidencia uma divergência evitável.
  revised_text: 'Então, ele chega a Simão Pedro. Este lhe diz: “Senhor, o senhor está lavando os meus pés?”'
