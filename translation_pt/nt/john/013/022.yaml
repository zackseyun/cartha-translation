lexical_decisions:
- source_word: ἔβλεπον
  choice: olhavam
  rationale: O imperfeito retrata uma ação em andamento ou repetida; “olhavam” preserva naturalmente esse aspecto na narrativa.
- source_word: εἰς ἀλλήλους
  choice: uns para os outros
  rationale: A expressão indica reciprocidade entre os discípulos e é idiomática em português.
- source_word: οἱ μαθηταὶ
  choice: Os discípulos
  rationale: O artigo identifica o grupo já conhecido pelo contexto, sem necessidade de acrescentar “seus”.
- source_word: ἀπορούμενοι
  choice: sem saber
  rationale: O particípio expressa dúvida ou perplexidade; “sem saber” comunica com clareza a incerteza diante da pergunta indireta, sem identificar a simples falta de informação como única nuance possível.
- source_word: περὶ τίνος
  choice: de quem
  rationale: Com o verbo “falar”, “de quem” é a forma natural e precisa de indicar a pessoa a respeito da qual Jesus falava.
- source_word: λέγει
  choice: ele estava falando
  rationale: Embora o grego use o presente, o imperfeito progressivo é natural no discurso indireto inserido numa narrativa passada e preserva o sentido verbal, sem interpretá-lo como “queria dizer”.
