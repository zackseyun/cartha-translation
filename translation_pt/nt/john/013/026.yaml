source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: pt
  text: 'Jesus responde: “É aquele a quem eu der o pedaço de pão depois de mergulhá-lo.” Então, depois de mergulhar o pedaço de pão, ele o dá a Judas, filho de Simão Iscariotes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Judas Iscariotes, filho de Simão”. A construção grega pode ser entendida das duas maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: responde
  rationale: O presente histórico grego é preservado por um presente narrativo natural em português.
- source_word: Ἐκεῖνός ἐστιν
  choice: É aquele
  rationale: Identifica uma pessoa de modo idiomático e mantém a força do demonstrativo substantivado.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: a quem eu der o pedaço de pão depois de mergulhá-lo
  rationale: A formulação portuguesa expressa os dois futuros gregos dentro de uma oração relativa identificadora e deixa claro que o pão é mergulhado antes de ser entregue.
- source_word: ψωμίον
  choice: pedaço de pão
  rationale: Expressão clara e corrente para um pequeno pedaço de pão ou alimento, sem o tom menos comum de “bocado” ou “morsel”.
- source_word: βάψας οὖν
  choice: Então, depois de mergulhar
  rationale: Representa a ação anterior do particípio aoristo e a progressão narrativa marcada por οὖν.
- source_word: δίδωσιν
  choice: ele o dá
  rationale: Mantém o presente histórico e explicita com o pronome “o” que o objeto entregue é o pedaço de pão.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: a Judas, filho de Simão Iscariotes
  rationale: Segue a ligação sintática mais imediata dos genitivos, enquanto a possível ligação tradicional de “Iscariotes” a Judas é preservada em nota.
theological_decisions:
- issue: Identificação de Judas na frase final
  choice: Judas, filho de Simão Iscariotes
  alternative: Judas Iscariotes, filho de Simão
  rationale: A sequência grega Σίμωνος Ἰσκαριώτου permite entender “Iscariotes” como qualificando Simão, mas também admite a identificação tradicional de Judas; a tradução principal segue a construção imediata e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com presente narrativo e sintaxe natural. A repetição de “pedaço de pão” conserva a coesão explícita do grego; a ambiguidade da identificação final é documentada em nota.
