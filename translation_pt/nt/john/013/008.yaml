  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: pt
  text: 'Pedro lhe disse: “Você jamais lavará os meus pés!” Jesus lhe respondeu: “Se eu não lavar você, você não terá parte comigo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você não terá participação comigo”.'
    reason: Alternativa lexical para μέρος, que pode indicar parte, participação ou porção.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  choice: jamais lavará
  rationale: A combinação da negação enfática οὐ μή com εἰς τὸν αἰῶνα expressa uma recusa absoluta. “Jamais lavará” transmite essa força de modo natural e enfático em português.
- source_word: μου τοὺς πόδας
  choice: os meus pés
  rationale: Reproduz diretamente o objeto e o possessivo explícitos no grego, sem acrescentar explicações.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Jesus lhe respondeu
  rationale: Mantém o verbo narrativo comum “responder” e representa o pronome dativo de forma idiomática.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Se eu não lavar você
  rationale: Preserva a estrutura condicional e, de modo importante, a passagem de “lavar os pés” para “lavar você”, sem limitar o segundo verbo aos pés.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: você não terá parte comigo
  rationale: “Ter parte com” conserva a metáfora ampla de μέρος e a associação indicada por μετά, sem introduzir a linguagem distinta de estar “em” Jesus.
theological_decisions:
- issue: Sentido de ter μέρος com Jesus
  choice: “ter parte comigo”, deixando aberta a natureza exata dessa participação
  alternative: Explicitar como salvação, purificação sacramental ou comunhão no serviço humilde
  rationale: A declaração torna a lavagem feita por Jesus necessária para Pedro ter parte com ele, mas o texto não define aqui o mecanismo teológico. A formulação preserva essa tensão e evita impor uma interpretação denominacional.
- issue: Alcance de νίψω σε na resposta de Jesus
  choice: “lavar você”
  alternative: “lavar os seus pés”
  rationale: O grego muda do objeto específico “meus pés”, na fala de Pedro, para o pronome “você”, na resposta de Jesus. Manter essa mudança preserva a possível ampliação simbólica sem explicá-la indevidamente.
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira. “O senhor” expressa o tratamento direto respeitoso sem recorrer ao mais regional “tu”. “Jamais” mantém a forte recusa de Pedro, e “ter parte comigo” conserva deliberadamente a densidade metafórica do original.
