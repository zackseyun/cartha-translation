id: JHN.13.15
reference: John 13:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: pt
  text: Pois eu lhes dei um exemplo[a], para que, assim como eu fiz a vocês[b], vocês também façam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um padrão” ou “um modelo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por vocês”. O dativo grego pode ser entendido como indicando aqueles a quem a ação foi feita ou aqueles em cujo benefício ela foi realizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: um exemplo
  rationale: O substantivo designa algo apresentado para ser imitado — exemplo, padrão ou modelo. “Um exemplo” é claro e natural em português e mantém a função exemplar da ação de Jesus.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da instrução anterior, preservando de modo conciso a ligação argumentativa.
- source_word: ἔδωκα
  choice: dei
  rationale: O pretérito perfeito traduz naturalmente o aoristo grego e aponta para a ação que Jesus acabara de realizar.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a finalidade da ação de Jesus.
- source_word: καθὼς
  choice: assim como
  rationale: Marca a correspondência entre o que Jesus fez e o que os discípulos devem fazer.
- source_word: ἐποίησα ὑμῖν
  choice: eu fiz a vocês
  rationale: Mantém o verbo amplo “fazer” e representa o dativo ὑμῖν sem decidir além do texto se a ênfase recai na ação dirigida aos discípulos ou no benefício recebido por eles.
- source_word: καὶ ὑμεῖς ποιῆτε
  choice: vocês também façam
  rationale: “Também” preserva a inclusão enfática dos discípulos, e o presente do subjuntivo após “para que” comunica naturalmente a ação esperada.
theological_decisions:
- issue: Alcance da imitação da ação de Jesus
  choice: Apresentar a ação de Jesus como exemplo que os discípulos devem imitar, sem definir se o versículo institui um rito universal ou enuncia um padrão mais amplo de serviço.
  alternative: Interpretar explicitamente a frase como uma ordenança permanente de lava-pés, ou apenas como um símbolo sem imitação concreta.
  rationale: O texto exige ação correspondente por parte dos discípulos, mas este versículo, isoladamente, não especifica o alcance ritual ou eclesial dessa imitação.
- issue: Sentido do dativo ὑμῖν
  choice: “a vocês”, conservando a direção da ação e a abertura semântica do dativo.
  alternative: “por vocês”, destacando explicitamente o benefício da ação.
  rationale: No contexto, a ação beneficia os discípulos, mas traduzir “por vocês” poderia tornar explícita uma nuance que a construção grega deixa aberta.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A repetição de “vocês” conserva a ênfase do pronome grego; “lhes” evita uma construção inicial pesada. A formulação mantém a ambiguidade contextual do dativo sem impor uma conclusão denominacional.
