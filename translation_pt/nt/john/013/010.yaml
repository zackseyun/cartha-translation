base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: pt
  text: 'Jesus lhe disse: “Quem já se banhou[a] não precisa lavar nada além dos pés, mas está inteiramente limpo. E vocês estão limpos, mas nem todos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega dois verbos diferentes: λούω, “banhar-se”, normalmente referente à lavagem do corpo inteiro, e νίπτω, “lavar”, frequentemente usado para uma parte do corpo, como os pés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma natural na narrativa portuguesa; «lhe» retoma o interlocutor singular.
- source_word: Ὁ λελουμένος
  choice: Quem já se banhou
  rationale: O perfeito de λούω descreve alguém que tomou banho e permanece no estado resultante; «já se banhou» comunica tanto a ação concluída quanto sua relevância presente.
- source_word: οὐκ ἔχει χρείαν
  choice: não precisa
  rationale: Equivalente corrente e claro da expressão idiomática grega, sem perda de sentido.
- source_word: εἰ μὴ
  choice: senão
  rationale: Introduz a única exceção à afirmação precedente e conserva de modo conciso a construção do texto grego.
- source_word: τοὺς πόδας νίψασθαι
  choice: lavar senão os pés
  rationale: νίπτω indica aqui a lavagem de uma parte do corpo; a referência aos pés explicita o objeto, enquanto a construção portuguesa não precisa acrescentar um possessivo.
- source_word: καθαρὸς ὅλος
  choice: inteiramente limpo
  rationale: Preserva a ênfase de ὅλος na totalidade e mantém «limpo», que funciona nos níveis literal e simbólico.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: E vocês estão limpos
  rationale: «Vocês» expressa claramente o plural e tem ampla legibilidade brasileira; a repetição de «limpos» conserva a ligação temática com a frase anterior.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: mas nem todos
  rationale: Reproduz a exceção dentro do grupo sem identificar ou interpretar antecipadamente quem não está limpo.
theological_decisions:
- issue: Imagem de lavagem literal e pureza simbólica/espiritual
  choice: Manter «se banhou», «lavar os pés» e «limpo» sem explicitar o simbolismo no texto principal.
  alternative: Acrescentar «espiritualmente limpo» ou traduzir λούω e νίπτω pelo mesmo verbo.
  rationale: A fala opera simultaneamente no plano físico e no simbólico. A distinção lexical e a repetição de «limpo» preservam essa tensão sem impor uma interpretação doutrinária.
- issue: Particípio singular masculino com sentido genérico
  choice: Traduzir por «Quem já se banhou».
  alternative: «O homem que já se banhou» ou «Aquele que já se banhou».
  rationale: «Quem» mantém o referente singular e genérico de modo natural em português, sem transformar o gênero gramatical grego em limitação masculina de sentido.
- issue: Variante textual sobre a lavagem dos pés
  choice: Incluir «senão os pés» no texto principal.
  alternative: 'Seguir a leitura mais curta: «Quem já se banhou não precisa lavar-se».'
  rationale: O texto SBLGNT fornecido inclui εἰ μὴ τοὺς πόδας νίψασθαι, embora o aparato tipográfico assinale variação. A tradução segue integralmente a edição-fonte solicitada.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Vocês» comunica naturalmente o plural; «inteiramente limpo» conserva a ênfase do original. O marcador foi colocado após a frase completa, e a nota explica a distinção lexical sem introduzir uma interpretação teológica específica.
