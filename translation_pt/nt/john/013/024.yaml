  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: pt
  text: Então Simão Pedro fez um sinal a este discípulo para que perguntasse quem seria aquele de quem ele estava falando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Então Simão Pedro fez um sinal a este para que procurasse saber quem seria aquele acerca de quem ele falava.”'
    reason: Alternativa mais formal que preserva de perto o demonstrativo e a estrutura sintática do grego.
lexical_decisions:
- source_word: νεύει
  choice: fez um sinal
  rationale: O verbo indica comunicação por gesto ou sinal, sem especificar que tenha sido apenas um aceno de cabeça.
- source_word: οὖν
  choice: Então
  rationale: Marca a continuação e a consequência narrativa de modo natural em português.
- source_word: τούτῳ
  choice: àquele discípulo
  rationale: O demonstrativo retoma o discípulo mencionado no contexto; a explicitação de “discípulo” torna a referência clara sem identificar além do que o texto permite.
- source_word: πυθέσθαι
  choice: para que perguntasse
  rationale: 'Expressa o propósito do sinal de Pedro: levar o discípulo a perguntar ou procurar saber.'
- source_word: τίς ἂν εἴη
  choice: quem seria
  rationale: O futuro do pretérito comunica de modo idiomático a indefinição ou cautela da construção grega com ἄν e optativo.
- source_word: περὶ οὗ λέγει
  choice: aquele de quem ele estava falando
  rationale: Preserva a relação “acerca de quem” e verte o presente histórico grego com uma forma narrativa natural, sem explicitar no texto principal o sujeito pronominal como Jesus.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A tradução mantém a indefinição de τίς ἂν εἴη e evita tornar explícito o sujeito de λέγει, que permanece pronominal como no fluxo do original.
