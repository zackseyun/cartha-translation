  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: pt
  text: Mas nenhum dos que estavam reclinados à mesa entendeu com que propósito ele lhe disse isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que ele lhe disse isso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma o que Jesus acabara de dizer; em português, “isso” é a referência retrospectiva mais natural neste contexto.
- source_word: δὲ
  choice: Mas
  rationale: Marca um contraste leve com o versículo anterior, introduzindo a observação de que os demais não compreenderam a fala de Jesus.
- source_word: οὐδεὶς
  choice: nenhum
  rationale: Com a expressão partitiva “dos que...”, “nenhum” comunica de modo natural a negação total.
- source_word: ἔγνω
  choice: entendeu
  rationale: Neste contexto, γινώσκω indica apreender o propósito da fala, não simplesmente possuir uma informação; “entendeu” expressa esse sentido sem acrescentar uma explicação.
- source_word: τῶν ἀνακειμένων
  choice: dos que estavam reclinados à mesa
  rationale: ἀνάκειμαι descreve a postura habitual dos participantes de uma refeição. “À mesa” explicita naturalmente o contexto para o leitor moderno.
- source_word: πρὸς τί
  choice: com que propósito
  rationale: A expressão pergunta pela finalidade ou intenção. Esta formulação preserva essa nuance mais precisamente do que o português genérico “por que”.
- source_word: εἶπεν αὐτῷ
  choice: ele lhe disse isso
  rationale: “Lhe” representa o objeto indireto αὐτῷ, e a retomada de “isso” produz uma frase portuguesa clara, correspondendo ao demonstrativo antecipado τοῦτο.
