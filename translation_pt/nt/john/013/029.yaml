  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: pt
  text: 'Pois alguns pensavam que, como Judas tinha a caixa de dinheiro[a], Jesus lhe dizia: “Compre o que precisamos para a festa[b]”, ou que ele desse alguma coisa aos pobres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bolsa de dinheiro”. O termo grego se refere ao recipiente em que eram guardados os recursos do grupo.
    reason: lexical_alternative
  - marker: b
    text: Neste trecho, “a festa” se refere à celebração da Páscoa.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: alguns
  rationale: Indefinido plural que se refere a alguns dos presentes; a forma concisa preserva a referência implícita.
- source_word: ἐδόκουν
  choice: pensavam
  rationale: O imperfeito descreve o entendimento que alguns tinham naquele momento; “pensavam” é natural na narrativa.
- source_word: ἐπεὶ
  choice: como
  rationale: 'Introduz a razão da suposição: Judas tinha consigo a caixa de dinheiro. “Como” expressa esse valor causal com fluidez em português.'
- source_word: γλωσσόκομον
  choice: caixa de dinheiro
  rationale: Designa o recipiente em que eram guardados os recursos do grupo, sem especificar além do que o termo grego permite.
- source_word: εἶχεν
  choice: tinha
  rationale: Mantém o sentido básico de posse ou custódia; o contexto deixa claro que Judas cuidava do recipiente.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jesus lhe dizia
  rationale: O presente histórico grego é vertido pelo imperfeito narrativo, adequado à suposição dos discípulos sobre o que Jesus estava dizendo.
- source_word: Ἀγόρασον
  choice: Compre
  rationale: Imperativo direto e corrente, equivalente natural do aoristo imperativo.
- source_word: ὧν χρείαν ἔχομεν
  choice: o que precisamos
  rationale: Reproduz de modo idiomático a construção relativa grega sem perda de conteúdo.
- source_word: εἰς τὴν ἑορτήν
  choice: para a festa
  rationale: Mantém o termo geral para a celebração religiosa sem inserir “Páscoa” no corpo do versículo, onde não aparece explicitamente.
- source_word: τοῖς πτωχοῖς
  choice: aos pobres
  rationale: Traduz diretamente o adjetivo substantivado e se liga naturalmente ao verbo “dar”.
- source_word: ἵνα τι δῷ
  choice: que desse alguma coisa
  rationale: Preserva a ação pretendida tal como entendida pelos presentes e mantém a coordenação com a primeira interpretação.
theological_decisions:
- issue: Identificação de ἑορτήν
  choice: Manter “a festa” no texto
  alternative: Explicitar “a Páscoa”
  rationale: O contexto é pascal, mas o versículo usa apenas o termo geral “festa”; a tradução conserva essa formulação e esclarece o contexto em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase segue de perto a lógica do grego, mas evita construções excessivamente literais. “Caixa de dinheiro” mantém a imagem do recipiente, e “festa” preserva a generalidade lexical do original.
