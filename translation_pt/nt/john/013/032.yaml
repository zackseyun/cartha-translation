id: JHN.13.32
reference: John 13:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: pt
  text: Se Deus foi glorificado nele[a], Deus também o glorificará em si mesmo[b] e o glorificará imediatamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Visto que Deus foi glorificado nele». O grego usa εἰ («se»), embora, neste contexto, a condição provavelmente seja tida como verdadeira.'
    reason: alternative_reading
  - marker: b
    text: A expressão «em si mesmo» também pode ser entendida como «consigo mesmo» ou «por si mesmo»; a formulação grega é compacta e teologicamente densa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Preserva a partícula condicional grega sem converter explicitamente a condição, provavelmente tida como verdadeira no contexto, em causa.
- source_word: ἐδοξάσθη
  choice: foi glorificado
  rationale: Mantém a voz passiva e expressa naturalmente em português o aoristo indicativo.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Reproduz de modo conciso a preposição ἐν e preserva o idioma joanino, sem substituí-lo pela interpretação mais explícita «por meio dele».
- source_word: δοξάσει
  choice: glorificará
  rationale: Mantém a continuidade lexical e teológica de δοξάζω nas três ocorrências do versículo.
- source_word: ἐν αὑτῷ
  choice: em si mesmo
  rationale: O pronome reflexivo remete a Deus; esta formulação conserva a expressão compacta e teologicamente densa do grego.
- source_word: εὐθύς
  choice: imediatamente
  rationale: Comunica com clareza e naturalidade a ideia de ação sem demora.
theological_decisions:
- issue: Força condicional de εἰ num contexto em que a condição provavelmente é tida como verdadeira
  choice: Se Deus foi glorificado nele
  alternative: Visto que Deus foi glorificado nele
  rationale: «Se» reflete diretamente a forma grega e preserva a tensão sintática; a leitura causal contextual é apresentada em nota.
- issue: Sentido da expressão reflexiva ἐν αὑτῷ
  choice: em si mesmo
  alternative: consigo mesmo; por si mesmo
  rationale: A tradução principal preserva a construção reflexiva e evita decidir entre possíveis nuances de associação, esfera ou agência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem das orações e a repetição de «glorificar» preservam a estrutura e a coesão lexical do grego.
