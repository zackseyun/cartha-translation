id: JHN.13.33
reference: John 13:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: pt
  text: 'Filhinhos, ainda estou com vocês só por pouco tempo. Vocês me procurarão e, assim como eu disse aos judeus[a]: “Para onde eu vou, vocês não podem ir[b]”, agora também digo a vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em João, “os judeus” pode, conforme o contexto, referir-se mais especificamente às autoridades judaicas.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “vocês não são capazes de ir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Filhinhos
  rationale: O diminutivo vocativo expressa afeto e preserva a imagem familiar. “Filhinhos” é natural em português e comunica melhor essa ternura do que o simples “filhos”.
- source_word: ἔτι μικρόν
  choice: apenas mais um pouco
  rationale: A expressão indica o curto tempo restante. A formulação é idiomática e mantém tanto a brevidade quanto a ideia de continuação.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: estarei com vocês
  rationale: Embora o grego use o presente, a expressão temporal aponta para o breve período ainda restante; o futuro soa natural em português nesse contexto sem alterar o sentido da presença atual de Jesus.
- source_word: ζητήσετέ με
  choice: Vocês me procurarão
  rationale: ζητέω pode significar buscar ou procurar. “Procurar” expressa com clareza a tentativa futura de encontrá-lo e é corrente em português.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: assim como eu disse aos judeus
  rationale: Mantém a comparação introduzida por καθώς e traduz Ἰουδαίοις sem restringir no texto principal o referente a dirigentes específicos.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Para onde eu vou
  rationale: ὑπάγω indica ir ou partir. “Para onde eu vou” é direto, natural e preserva a referência ao destino sem explicá-lo além do texto.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem ir
  rationale: Em português, “não podem ir” expressa naturalmente a impossibilidade indicada por δύνασθε, evitando a possível impressão de falta de competência pessoal produzida por “não são capazes de ir”.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: agora também digo isso a vocês
  rationale: “Agora” traduz ἄρτι, e “também” explicita a aplicação paralela aos discípulos do que já havia sido dito aos judeus. “Isso” retoma de modo natural a declaração citada.
theological_decisions:
- issue: Referente de Ἰουδαίοις no contexto joanino
  choice: aos judeus
  alternative: aos líderes judeus
  rationale: O termo grego significa literalmente “judeus”. Embora em João possa designar, conforme o contexto, autoridades judaicas ou judeanas, este versículo não exige que o referente seja restringido. A tradução principal conserva a amplitude do original, e a nota registra a possibilidade contextual.
- issue: Natureza da impossibilidade em οὐ δύνασθε ἐλθεῖν
  choice: vocês não podem ir
  alternative: vocês não são capazes de ir
  rationale: A fala afirma impossibilidade, mas não explica aqui sua natureza ou duração. A tradução evita acrescentar uma causa teológica não expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Filhinhos” conserva o tom afetuoso; o uso de “vocês” evita regionalismo excessivo. A pontuação destaca a citação sem tornar a frase artificialmente solene.
