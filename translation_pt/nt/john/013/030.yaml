  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: pt
  text: Assim, depois de pegar o pedaço de pão[a], ele[b] saiu imediatamente. E era noite.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o bocado». O grego se refere a um pequeno pedaço de pão ou de alimento servido durante a refeição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «aquele»; a expressão grega é mais enfática do que um simples «ele» e chama a atenção para Judas.
    reason: lexical_alternative
  - marker: c
    text: A afirmação de que «era noite» indica literalmente a hora e pode também evocar o tema da luz e das trevas no Evangelho de João.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: depois de receber
  rationale: O particípio aoristo indica uma ação anterior à saída. Como o pedaço foi dado a Judas no contexto imediato, «receber» comunica naturalmente o sentido contextual de λαμβάνω sem perder a sequência.
- source_word: οὖν
  choice: Assim
  rationale: Marca a progressão e a consequência narrativa, com fluidez em português contemporâneo.
- source_word: τὸ ψωμίον
  choice: o pedaço de pão
  rationale: ψωμίον designa um pequeno pedaço de pão ou alimento; esta forma é clara, concreta e atual.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O português normalmente retoma Judas com pronome pessoal. A ênfase do demonstrativo grego é registrada em nota, evitando a forma pouco natural «aquele» isolada.
- source_word: ἐξῆλθεν εὐθύς
  choice: saiu imediatamente
  rationale: Preserva tanto o sentido espacial de ἐξέρχομαι quanto a prontidão expressa por εὐθύς.
- source_word: ἦν δὲ νύξ
  choice: E era noite
  rationale: Reproduz a declaração temporal simples e sua força literária, sem explicitar no texto principal um possível simbolismo.
theological_decisions:
- issue: Possível valor simbólico de «noite» no Evangelho de João
  choice: Manter a declaração literal «E era noite».
  alternative: Explicitar no texto principal a ideia de escuridão espiritual.
  rationale: A frase grega declara diretamente a circunstância temporal. O possível eco do tema joanino de luz e trevas permanece disponível ao leitor e é indicado em nota, sem resolver a tensão interpretativa.
- issue: Força de ἐκεῖνος ao retomar Judas
  choice: Usar «ele» no texto e registrar em nota a forma enfática do grego.
  alternative: Traduzir «aquele» ou «aquele homem».
  rationale: O demonstrativo é mais marcado do que um pronome simples, mas «aquele» pode soar artificial ou introduzir distanciamento excessivamente interpretativo em português. A nota preserva a informação retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue o movimento narrativo do grego; as notas preservam a nuance lexical e a possível ressonância literária sem sobrecarregar o texto principal.
