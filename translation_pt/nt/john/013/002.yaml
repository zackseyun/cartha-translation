  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: pt
  text: Durante a ceia[a], o diabo já havia posto no coração[b] de Judas Iscariotes[d], filho de Simão, que ele traísse Jesus[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto a ceia acontecia”. O grego não diz que a ceia já havia terminado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “já havia incutido”. Literalmente: “já havia posto no coração”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que entregasse Jesus”. Neste contexto, “traísse” expressa a força da ação.'
    reason: alternative_reading
  - marker: d
    text: A ordem grega também pode ser entendida como “Judas, filho de Simão Iscariotes”. A identificação de Judas como Iscariotes é a leitura tradicional e é confirmada por outras passagens de João.
    reason: source_ambiguity
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: durante a ceia
  rationale: 'A construção genitiva absoluta indica uma circunstância contemporânea: a ceia estava acontecendo, não havia terminado. A formulação é concisa, natural e fiel ao aspecto de γινομένου.'
- source_word: διάβολος
  choice: o diabo
  rationale: No contexto narrativo de João, o termo designa o ser maligno pessoal; o título tradicional comunica o referente com clareza.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: já havia posto no coração
  rationale: Preserva a metáfora grega de implantar uma intenção e expressa a anterioridade de βεβληκότος em relação à cena narrada.
- source_word: καρδίαν
  choice: coração
  rationale: Mantém a metáfora antropológica bíblica, na qual o coração inclui vontade, pensamento e intenção, não apenas emoção.
- source_word: ἵνα παραδοῖ
  choice: que traísse
  rationale: A oração com ἵνα expressa o conteúdo ou propósito da intenção implantada. No contexto de Judas, 'trair' comunica a força contextual de παραδίδωμι, enquanto a nota preserva o sentido mais literal de entregar.
- source_word: αὐτόν
  choice: Jesus
  rationale: O pronome se refere a Jesus. Repetir o nome em português evita a possível leitura de que Judas deveria trair Simão, o nome imediatamente anterior.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Judas, filho de Simão Iscariotes
  rationale: Os dois genitivos favorecem a leitura de Ἰσκαριώτου como qualificativo de Simão. Uma nota registra a forma alternativa tradicional, que associa 'Iscariotes' diretamente a Judas.
theological_decisions:
- issue: Agência na traição de Judas
  choice: O diabo implanta a intenção, mas Judas continua sendo apresentado como aquele que trairia Jesus.
  alternative: O diabo apenas sugeriu a ação a Judas; ou o diabo agiu por meio de Judas de modo a eliminar sua agência.
  rationale: O grego atribui influência ao diabo sem explicar a relação entre essa influência e a responsabilidade de Judas. A tradução conserva essa tensão.
- issue: Identificação pelo nome Iscariotes
  choice: Iscariotes qualifica Simão na linha principal.
  alternative: Judas Iscariotes, filho de Simão.
  rationale: A concordância genitiva de Ἰσκαριώτου com Σίμωνος favorece a primeira análise, mas a identificação tradicional de Judas como Iscariotes torna a alternativa relevante; por isso ela é registrada sem ocultar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada ao português natural sem apagar a metáfora do coração. O nome “Jesus” substitui o pronome na oração final para impedir ambiguidade referencial. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
