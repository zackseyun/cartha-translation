id: JHN.13.35
reference: John 13:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: pt
  text: Nisto[a] todos saberão que vocês são meus discípulos, se tiverem amor uns pelos outros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio disto todos saberão” ou “É assim que todos saberão”.'
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “se tiverem amor entre vocês”; isto é, demonstrem amor mútuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Nisto
  rationale: A expressão aponta para o amor mútuo como o sinal ou meio pelo qual os discípulos serão reconhecidos. “Nisto” preserva a forma demonstrativa do grego e é natural em português, embora “Por meio disto” torne explícito o valor instrumental.
- source_word: γνώσονται
  choice: saberão
  rationale: O futuro de γινώσκω indica que todos saberão ou reconhecerão esse fato. “Saberão” é direto, natural e mantém a amplitude do verbo.
- source_word: πάντες
  choice: todos
  rationale: O plural masculino grego é genérico e inclui todas as pessoas; “todos” expressa naturalmente esse alcance em português.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: vocês são meus discípulos
  rationale: O dativo ἐμοί expressa aqui relação ou pertencimento. Esta formulação idiomática preserva o termo estabelecido “discípulos” para μαθηταί.
- source_word: ἐὰν
  choice: se
  rationale: Mantém de modo direto a condição introduzida por ἐάν com o subjuntivo.
- source_word: ἀγάπην ἔχητε
  choice: tiverem amor
  rationale: Reproduz a construção “ter amor” e, com “se”, emprega naturalmente o futuro do subjuntivo em português.
- source_word: ἐν ἀλλήλοις
  choice: uns pelos outros
  rationale: Expressa com clareza a reciprocidade da frase grega no português atual; a forma mais literal “entre vocês” pode soar menos claramente direcionada de cada um aos demais.
theological_decisions:
- issue: Valor da condição introduzida por ἐὰν
  choice: se tiverem amor uns pelos outros
  alternative: quando tiverem amor uns pelos outros
  rationale: “Se” preserva a forma condicional do grego e apresenta o amor mútuo como sinal identificador dos discípulos, sem transformar a frase numa afirmação de mérito ou causa de discipulado.
- issue: Alcance de πάντες
  choice: todos
  alternative: todas as pessoas
  rationale: O masculino plural é genérico no grego. “Todos” mantém o sentido universal sem restringir a referência aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo na segunda pessoa plural. O texto conserva a ordem enfática inicial de ἐν τούτῳ e usa dois-pontos para explicitar que a oração condicional identifica em que consiste o sinal mencionado.
