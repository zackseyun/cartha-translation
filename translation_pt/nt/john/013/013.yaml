source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: pt
  text: Vocês me chamam de Mestre e Senhor[a], e dizem bem, pois eu sou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Mestre». O grego kýrios pode indicar autoridade ou senhorio; aqui foi mantido «Senhor» como tradução principal do título.
    reason: Alternativa lexical para κύριος.
lexical_decisions:
- source_word: φωνεῖτέ
  choice: chamam
  rationale: Neste uso com títulos predicativos, «chamar alguém de» é a construção mais natural em português e conserva a referência direta a Jesus.
- source_word: Ὁ διδάσκαλος
  choice: Mestre
  rationale: «Mestre» expressa com naturalidade o título de quem ensina e é a forma consagrada em português neste contexto.
- source_word: Ὁ κύριος
  choice: Senhor
  rationale: «Senhor» preserva tanto a ideia de autoridade quanto o peso do título aplicado a Jesus, sem explicitar além do que o versículo afirma.
- source_word: καλῶς λέγετε
  choice: dizem bem
  rationale: A expressão portuguesa «dizem bem» reproduz de modo conciso o juízo positivo de καλῶς sobre o que os discípulos dizem, sem transformar a frase em mera concordância abstrata.
- source_word: εἰμὶ γάρ
  choice: pois eu sou
  rationale: A formulação breve segue de perto o grego e preserva a afirmação enfática de Jesus sem acrescentar um complemento interpretativo.
theological_decisions:
- issue: Tradução de κύριος como título de Jesus
  choice: Senhor
  alternative: Mestre
  rationale: «Senhor» mantém a distinção entre διδάσκαλος e κύριος e conserva a dimensão de autoridade e senhorio do segundo título. «Mestre» é lexicalmente possível em certos contextos, mas aqui confundiria os dois títulos coordenados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» evita regionalismo excessivo. A concisão e a tensão da afirmação final «pois eu sou» foram preservadas.
