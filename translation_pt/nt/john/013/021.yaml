id: JHN.13.21
reference: John 13:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: pt
  text: 'Depois de dizer essas coisas, Jesus ficou perturbado no espírito e deu testemunho, dizendo: “Em verdade, em verdade lhes digo: um de vocês me trairá[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “me entregará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Depois de dizer essas coisas
  rationale: Expressa naturalmente em português o particípio aoristo com valor temporal e mantém a sequência do relato.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: ficou perturbado no espírito
  rationale: Comunica a agitação interior de Jesus sem acrescentar uma intensidade ausente do grego; “no espírito” preserva a formulação do texto sem explicá-la em excesso.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: deu testemunho, dizendo
  rationale: Mantém o vocabulário joanino de testemunho e apresenta em português corrente a combinação grega de testemunhar e dizer.
- source_word: Ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene característica das declarações de Jesus em João.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: É uma formulação direta, digna e natural em português, adequada à expressão solene que a introduz.
- source_word: εἷς ἐξ ὑμῶν
  choice: um de vocês
  rationale: Reproduz naturalmente a expressão partitiva e conserva o impacto de que o traidor pertence ao próprio grupo.
- source_word: παραδώσει με
  choice: me trairá
  rationale: No contexto imediato, παραδίδωμι descreve a entrega traiçoeira de Jesus por um discípulo; “trairá” comunica com clareza essa força contextual, enquanto a alternativa mais literal é mantida em nota.
theological_decisions:
- issue: A perturbação interior de Jesus
  choice: ficou perturbado no espírito
  alternative: ficou perturbado em seu espírito
  rationale: A tradução deixa intacto o retrato da perturbação genuína de Jesus e evita inserir uma explicação doutrinária ou uma intensidade não expressa no texto.
- issue: O sentido de παραδίδωμι na predição
  choice: me trairá
  alternative: me entregará
  rationale: “Trairá” expressa a natureza desleal do ato no contexto, mas a nota conserva o sentido concreto de entregar alguém, importante na narrativa da paixão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula “Em verdade, em verdade” conserva a solenidade e a repetição do original; “deu testemunho, dizendo” mantém o motivo joanino do testemunho sem tornar a frase excessivamente rígida.
