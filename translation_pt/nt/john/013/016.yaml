id: JHN.13.16
reference: John 13:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a slave is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: o escravo[a] não é maior do que seu senhor[b], nem o enviado[c] é maior do que aquele que o enviou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”; o grego indica alguém sujeito à autoridade de um senhor, e “escravo” preserva aqui a relação social mais forte.
    reason: lexical_alternative
  - marker: b
    text: Ou “mestre”. Aqui, “senhor” descreve a posição de autoridade na relação com o escravo.
    reason: lexical_alternative
  - marker: c
    text: Ou “apóstolo” ou “mensageiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene e enfática característica de João em português natural e digno.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa diretamente a fórmula de fala no presente; o pronome plural corresponde a ὑμῖν.
- source_word: δοῦλος
  choice: escravo
  rationale: Mantém a relação social forte de sujeição a um senhor, salientada pela comparação do contexto.
- source_word: μείζων
  choice: maior
  rationale: Conserva a amplitude do comparativo, que aqui indica superioridade de posição ou autoridade.
- source_word: κύριος
  choice: senhor
  rationale: No par escravo/senhor, representa naturalmente a relação social indicada pelo grego sem exigir aqui um título cristológico direto.
- source_word: ἀπόστολος
  choice: enviado
  rationale: Neste contexto, o sentido funcional de uma pessoa comissionada harmoniza-se com a expressão paralela 'aquele que o enviou' e evita restringir indevidamente o termo ao ofício técnico de apóstolo.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: aquele que o enviou
  rationale: Reproduz com naturalidade a construção participial e deixa clara a relação entre enviado e remetente.
theological_decisions:
- issue: Sentido de κύριος na comparação
  choice: senhor
  alternative: Senhor, como título cristológico explícito
  rationale: A formulação imediata apresenta a relação social entre escravo e senhor. A tradução preserva essa analogia sem negar que, no contexto narrativo, Jesus seja o Senhor.
- issue: Sentido de ἀπόστολος
  choice: enviado
  alternative: apóstolo
  rationale: O paralelismo com 'aquele que o enviou' favorece o sentido amplo de representante ou mensageiro comissionado. A alternativa lexical é registrada para preservar a possível ressonância técnica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A abertura mantém a solenidade joanina; a sintaxe é clara e preserva o paralelismo entre escravo/senhor e enviado/remetente.
