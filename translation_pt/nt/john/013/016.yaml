review_pass:
  verdict: approve
  source_fidelity: A tradução preserva com precisão a dupla fórmula solene ἀμὴν ἀμὴν, o destinatário plural, as duas comparações de superioridade e o paralelismo entre escravo/senhor e enviado/remetente. “Enviado” é uma tradução contextual legítima de ἀπόστολος, especialmente em paralelo com “aquele que o enviou”, sem excluir a ressonância de “apóstolo”, devidamente anotada.
  naturalness: O português é moderno, claro e natural para leitores brasileiros e internacionais. “Em verdade, em verdade lhes digo” mantém um registro solene apropriado a João, e “não é maior do que” reproduz o comparativo sem tornar a frase artificial.
  terminology: “Escravo” representa adequadamente δοῦλος e conserva a relação social forte do enunciado. “Senhor” é natural e exato no par social “escravo/senhor”; não impõe aqui um uso titular cristológico. A nota de “mestre” esclarece a alternativa. “Enviado” para ἀπόστολος é contextualmente defensável, e a nota registra tanto “apóstolo” como “mensageiro”.
