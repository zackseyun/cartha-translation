  naturalness: «Estava reclinado junto ao peito de Jesus» soa artificial e pode sugerir uma postura corporal diferente da disposição à mesa. «Estava reclinado ao lado de Jesus» é claro, natural e comunica adequadamente a proximidade espacial no contexto do banquete.
  terminology: «Discípulos», «Jesus», «amava» e «reclinado» são escolhas fiéis e adequadas ao registro. A expressão literal «no seio de Jesus» é melhor mantida na nota explicativa, onde pode ser contextualizada sem criar uma imagem enganosa no texto principal.
