  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: pt
  text: Um dos seus discípulos, aquele a quem Jesus amava, estava reclinado ao lado de Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «no seio de Jesus»; a expressão descreve a posição de quem estava reclinado imediatamente ao lado de outra pessoa durante uma refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: estava reclinado
  rationale: O particípio descreve a postura adotada à mesa no mundo mediterrâneo antigo. «Estava reclinado» preserva essa realidade histórica e continua claro em português.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Um dos seus discípulos
  rationale: Reproduz de modo natural e direto a expressão partitiva grega.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: junto ao peito de Jesus
  rationale: Mantém a imagem concreta de κόλπος sem sugerir, como «no colo», uma postura inadequada à cena. No contexto de uma refeição em que os participantes se reclinavam, indica que o discípulo estava imediatamente ao lado de Jesus.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: aquele a quem Jesus amava
  rationale: Traduz diretamente ἀγαπάω por «amar» e preserva a oração relativa, com formulação natural e digna.
theological_decisions:
- issue: A posição do discípulo amado em relação a Jesus
  choice: junto ao peito de Jesus
  alternative: bem perto de Jesus; no seio de Jesus
  rationale: A expressão descreve concretamente a disposição dos participantes à mesa, mas também conserva uma imagem relevante no vocabulário joanino. A tradução escolhida retém a proximidade física e a imagem do peito sem impor uma interpretação de união mística nem produzir a possível leitura equivocada de «no colo».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Reclinado» conserva o cenário histórico; «junto ao peito» esclarece a disposição à mesa e preserva a imagem do original.
