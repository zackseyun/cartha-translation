id: JHN.13.14
reference: John 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: pt
  text: Se, portanto, eu, o Senhor e o Mestre, lavei os pés de vocês, vocês também devem lavar os pés uns dos outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Portanto, se
  rationale: Preserva tanto a condição expressa por εἰ quanto a força conclusiva de οὖν, em uma ordem natural em português.
- source_word: ἐγὼ
  choice: eu
  rationale: Mantém o pronome explícito e sua ênfase, contrastando o que Jesus fez com o dever dos discípulos.
- source_word: ἔνιψα
  choice: lavei
  rationale: O aoristo aponta para o ato concluído que Jesus acabara de realizar; o pretérito perfeito é a forma natural em português.
- source_word: ὑμῶν τοὺς πόδας
  choice: os pés de vocês
  rationale: Expressa de modo idiomático a relação possessiva e deixa claro que Jesus lavou os pés dos discípulos.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Conserva o sentido titular usual de κύριος e o contraste entre a posição elevada de Jesus e seu ato humilde.
- source_word: ὁ διδάσκαλος
  choice: o Mestre
  rationale: Traduz o título de quem ensina em linguagem corrente e digna, adequado ao modo como os discípulos se dirigem a Jesus no contexto.
- source_word: καὶ ὑμεῖς
  choice: vocês também
  rationale: 'Mantém a conjunção e a ênfase do pronome: os discípulos devem agir de modo correspondente ao de Jesus.'
- source_word: ὀφείλετε
  choice: devem
  rationale: Comunica obrigação moral com naturalidade, sem transformar desnecessariamente o indicativo de obrigação em uma ordem mais áspera.
- source_word: ἀλλήλων
  choice: uns dos outros
  rationale: É a forma recíproca natural em português neste contexto.
- source_word: νίπτειν τοὺς πόδας
  choice: lavar os pés
  rationale: Preserva o ato concreto de lavar uma parte do corpo, sem reduzi-lo no texto principal a uma paráfrase sobre serviço humilde.
theological_decisions:
- issue: Sentido de κύριος como título cristológico
  choice: o Senhor
  alternative: o Dono
  rationale: “Senhor” preserva o título tradicional e contextual aplicado a Jesus, mantendo a tensão entre sua autoridade e seu serviço humilde.
- issue: Natureza da obrigação de lavar os pés
  choice: 'Manter o ato concreto: “lavar os pés uns dos outros”'
  alternative: servir uns aos outros com humildade
  rationale: O grego nomeia explicitamente a lavagem dos pés. Seu significado exemplar pode ser desenvolvido pelo contexto, mas não deve substituir o ato concreto na tradução deste versículo.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com legibilidade brasileira. “Vocês” evita ambiguidades regionais de conjugação; “Mestre” mantém dignidade e naturalidade. A ordem “Portanto, se” conserva a lógica do argumento sem soar artificial.
