id: JHN.13.36
reference: John 13:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: pt
  text: 'Simão Pedro lhe diz: “Senhor, para onde o senhor vai?” Jesus respondeu: “Para onde eu vou, você não é capaz de me seguir agora[a], mas me seguirá mais tarde[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “você não pode me seguir agora”. O grego emprega explicitamente um verbo que expressa capacidade.
    reason: lexical_alternative
  - marker: b
    text: “Me seguirá mais tarde” pode aludir ao futuro seguimento de Jesus por Pedro no sofrimento ou na morte; a formulação em si não especifica de que modo.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: diz
  rationale: Mantém o presente histórico do grego, frequente na narrativa joanina, sem perder naturalidade em português.
- source_word: Κύριε
  choice: Senhor
  rationale: Preserva tanto o tratamento respeitoso quanto a ressonância titular de κύριος.
- source_word: ποῦ ὑπάγεις
  choice: para onde o senhor vai
  rationale: Expressão natural em português que conserva a ideia de movimento e destino sem especificar indevidamente qual é esse destino.
- source_word: ἀπεκρίθη
  choice: respondeu
  rationale: Equivalente narrativo corrente e idiomático para ἀποκρίνομαι.
- source_word: Ὅπου ὑπάγω
  choice: Para onde eu vou
  rationale: Retoma verbalmente a pergunta de Pedro e preserva o presente grego.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: você não é capaz de me seguir agora
  rationale: Explicita, como o grego δύναμαι, a noção de capacidade, mantendo também o sentido discipular potencial de ‘seguir’.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: mas me seguirá mais tarde
  rationale: Conserva o futuro, o contraste expresso por δέ e a referência temporal aberta de ὕστερον.
theological_decisions:
- issue: Sentido do futuro seguimento de Pedro
  choice: Não especificar no texto principal de que modo Pedro seguirá Jesus mais tarde.
  alternative: Entender a frase especificamente como referência ao martírio de Pedro, à sua restauração e discipulado posterior ou ao seguimento escatológico.
  rationale: O grego afirma apenas que Pedro não pode seguir Jesus agora, mas o seguirá depois. A formulação preserva essa abertura narrativa e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se “o senhor” na pergunta dirigida a Jesus para evitar a combinação menos natural de “Senhor” com “você”, enquanto “você” mantém clareza contemporânea na resposta. Os marcadores [a] e [b] aparecem no texto principal.
