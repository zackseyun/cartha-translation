source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: pt
  text: 'Jesus respondeu: “Você dará a sua vida[a] por mim? Em verdade, em verdade, digo a você: o galo certamente não cantará até que você me negue três vezes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «alma». O grego psychē pode significar «alma» ou «vida»; aqui, o sentido é entregar a própria vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: respondeu
  rationale: O presente histórico grego introduz a resposta de Jesus; o pretérito é natural na narrativa em português.
- source_word: Τὴν ψυχήν σου
  choice: a sua vida
  rationale: Na expressão com τίθημι, ψυχή designa a vida que alguém se dispõe a entregar, não especificamente a alma imaterial.
- source_word: ὑπὲρ ἐμοῦ
  choice: por mim
  rationale: Expressa benefício ou representação e é a formulação portuguesa mais direta.
- source_word: θήσεις
  choice: dará
  rationale: Em português, “dar a vida” comunica naturalmente a expressão idiomática grega “pôr/depor a vida”, sem obscurecer seu sentido sacrificial.
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição solene característica das declarações de Jesus em João.
- source_word: οὐ μὴ
  choice: certamente não
  rationale: Mantém a forte negação da construção grega sem recorrer a uma formulação arcaica.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: o galo ... cantará
  rationale: “O galo cantar” é o equivalente idiomático corrente em português.
- source_word: ἕως οὗ
  choice: até que
  rationale: Reproduz diretamente o limite temporal expresso no grego.
- source_word: ἀρνήσῃ με
  choice: você me negue
  rationale: “Negar” traduz diretamente a rejeição ou desassociação indicada por ἀρνέομαι; o subjuntivo é exigido naturalmente depois de “até que”.
- source_word: τρίς
  choice: três vezes
  rationale: Formulação moderna e direta.
theological_decisions:
- issue: Sentido de ψυχή no contexto de entrega pessoal
  choice: vida
  alternative: alma
  rationale: O contexto trata da disposição de Pedro para morrer por Jesus. “Vida” preserva o sentido concreto de autossacrifício sem impor uma concepção antropológica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A construção mantém a pergunta retórica, a dupla fórmula solene e a negação enfática do original.
