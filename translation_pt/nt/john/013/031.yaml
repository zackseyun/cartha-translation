id: JHN.13.31
reference: John 13:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: pt
  text: 'Então, depois que ele saiu, Jesus disse: “Agora o Filho do Homem foi glorificado, e Deus foi glorificado nele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio dele”. A expressão grega pode indicar que Deus foi glorificado no Filho ou por meio dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Assim, quando
  rationale: Ὅτε introduz a oração temporal, e οὖν dá continuidade narrativa e lógica. “Assim, quando” preserva as duas funções em português natural.
- source_word: ἐξῆλθεν
  choice: ele saiu
  rationale: O aoristo de ἐξέρχομαι se refere à saída de Judas no contexto anterior. “Saiu” conserva a ideia espacial e soa mais natural em português do que uma forma composta.
- source_word: λέγει
  choice: disse
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, forma normal da narrativa em português.
- source_word: Νῦν
  choice: Agora
  rationale: Preserva o valor temporal e discursivo, indicando o momento inaugurado pela saída de Judas.
- source_word: ἐδοξάσθη
  choice: foi glorificado
  rationale: O pretérito perfeito passivo expressa naturalmente em português o aoristo passivo e mantém a declaração como fato consumado, sem restringir sua referência à cruz, à ressurreição ou à exaltação isoladamente.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: o Filho do Homem
  rationale: Mantém a designação estabelecida de Jesus e suas ressonâncias intertextuais, especialmente com Daniel 7.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta e idiomática de θεός neste contexto.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: É a correspondência mais direta para ἐν com o dativo e preserva o sentido relacional, sem excluir a possível nuance instrumental.
theological_decisions:
- issue: Alcance da glorificação do Filho do Homem
  choice: A formulação não especifica se a glorificação se refere sobretudo à cruz, à ressurreição, à exaltação ou ao conjunto desses acontecimentos.
  alternative: Restringir a declaração apenas à crucificação ou apenas à ressurreição e exaltação.
  rationale: O texto declara a glorificação sem delimitar explicitamente seu alcance; a tradução conserva essa amplitude e tensão teológica.
- issue: Sentido de ἐν αὐτῷ
  choice: nele
  alternative: por meio dele
  rationale: A expressão grega admite leitura relacional ou instrumental. O texto principal mantém a correspondência mais direta, e a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pretérito perfeito simples evita uma construção composta pouco natural neste contexto. O marcador [a] foi colocado após “nele”, que é o trecho ao qual a nota efetivamente se refere.
