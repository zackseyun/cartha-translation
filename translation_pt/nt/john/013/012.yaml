base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: pt
  text: 'Assim, depois de lhes lavar os pés e de pegar suas vestes, ele voltou a reclinar-se à mesa[a] e lhes disse: “Vocês entendem o que eu fiz por vocês[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “sentou-se novamente”; o verbo grego, em contexto de refeição, refere-se a reclinar-se à mesa.
    reason: lexical_alternative
  - marker: b
    text: Ou “a vocês”; o dativo grego pode ser entendido das duas maneiras, embora “por vocês” combine melhor com o contexto de serviço.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Assim, depois de
  rationale: A construção preserva a progressão narrativa de οὖν e apresenta naturalmente em português a relação temporal introduzida por ὅτε.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: lavar os pés deles
  rationale: Tradução direta e idiomática; o infinitivo após “depois de” expressa a ação concluída antes dos acontecimentos seguintes.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: pegar suas vestes
  rationale: “Vestes” traduz ἱμάτια sem restringi-lo explicitamente a roupas exteriores; “pegar” mantém o valor lexical de λαμβάνω, deixando que o contexto indique que ele voltou a vesti-las.
- source_word: ἀνέπεσεν
  choice: voltar a reclinar-se à mesa
  rationale: Em contexto de refeição, o verbo designa reclinar-se à mesa. “Voltar a” incorpora naturalmente a ideia de πάλιν e evita a imagem historicamente menos precisa de simplesmente sentar-se.
- source_word: εἶπεν αὐτοῖς
  choice: ele lhes disse
  rationale: Forma portuguesa direta e natural para o verbo de fala com objeto indireto.
- source_word: Γινώσκετε
  choice: Vocês entendem
  rationale: Neste contexto, a pergunta diz respeito à compreensão do significado do gesto, não apenas ao conhecimento factual.
- source_word: τί πεποίηκα ὑμῖν
  choice: o que eu fiz por vocês
  rationale: O perfeito grego apresenta um ato concluído com relevância presente; o pretérito perfeito simples é a forma natural em português. “Por vocês” expressa bem o possível valor benefactivo do dativo, sem ocultar a alternativa “a vocês”.
theological_decisions:
- issue: Postura de Jesus ao retomar seu lugar à mesa
  choice: voltar a reclinar-se à mesa
  alternative: sentar-se novamente; voltar a ocupar seu lugar à mesa
  rationale: A escolha conserva o cenário histórico sugerido por ἀναπίπτω em contexto de refeição, sem acrescentar interpretação doutrinária.
- issue: Valor do dativo ὑμῖν na pergunta de Jesus
  choice: por vocês
  alternative: a vocês
  rationale: O contexto de serviço favorece o sentido benefactivo, mas o dativo também admite uma relação mais neutra; a nota preserva essa ambiguidade legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A ordem foi ajustada para fluência narrativa, mantendo a sequência das ações e as ambiguidades relevantes do grego.
