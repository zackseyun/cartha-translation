  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: pt
  text: 'Simão Pedro lhe diz: “Senhor,[a] não somente os meus pés, mas também as mãos e a cabeça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mestre”. Em grego, kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: diz
  rationale: Preserva o presente histórico grego, natural na narrativa em português e coerente com a vivacidade joanina.
- source_word: αὐτῷ
  choice: lhe
  rationale: Traduz diretamente o pronome dativo sem substituir seu referente contextual pelo nome “Jesus”.
- source_word: Σίμων Πέτρος
  choice: Simão Pedro
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: Κύριε
  choice: Senhor
  rationale: É a correspondência habitual de κύριος como forma de tratamento e conserva sua possível ressonância teológica em João.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: não somente... mas também
  rationale: Reproduz claramente a construção grega de extensão contrastiva em português corrente.
- source_word: τοὺς πόδας μου
  choice: os meus pés
  rationale: Traduz o objeto acusativo e o possessivo de maneira direta e natural.
- source_word: τὰς χεῖρας
  choice: as mãos
  rationale: O possessivo continua implícito pela coordenação com “os meus pés”, como no grego, e é inequívoco em português.
- source_word: τὴν κεφαλήν
  choice: a cabeça
  rationale: Mantém o sentido lexical comum e o possessivo implícito na série coordenada.
theological_decisions:
- issue: Tradução de κύριος como forma de tratamento dirigida a Jesus
  choice: Senhor
  alternative: Mestre
  rationale: “Senhor” conserva tanto a forma respeitosa de tratamento quanto a ressonância cristológica possível, sem determinar além do que o contexto exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O presente histórico foi mantido. A exclamação comunica a resposta enfática de Pedro, sugerida pela expansão “não somente... mas também”, sem acrescentar conteúdo lexical.
