  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: pt
  text: 'Então ele[a], inclinando-se assim para trás sobre o peito de Jesus, pergunta-lhe: “Senhor, quem é?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reclinado sobre o peito de Jesus”. O grego reflete a postura de se reclinar à mesa durante a refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: inclinando-se para trás
  rationale: No contexto de uma refeição em que as pessoas estavam reclinadas, o particípio descreve o movimento do discípulo para trás em direção a Jesus; a expressão comunica tanto o movimento quanto a postura.
- source_word: ἐκεῖνος
  choice: ele
  rationale: O pronome retoma naturalmente o discípulo mencionado no contexto anterior, sem acrescentar ao texto a identificação explícita “aquele discípulo”.
- source_word: οὕτως
  choice: assim
  rationale: Preserva a referência ao modo ou à posição descrita no contexto imediato.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: junto ao peito de Jesus
  rationale: “Peito” é a equivalência moderna e natural de στῆθος; “junto ao” representa a proximidade ou contato envolvido na postura sem sugerir inadequadamente que ele estava deitado sobre Jesus.
- source_word: λέγει αὐτῷ
  choice: pergunta
  rationale: O presente histórico grego é preservado no presente português, e “pergunta” comunica naturalmente o ato de dizer uma frase interrogativa; o objeto indireto fica implícito de maneira clara no contexto.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém tanto a forma respeitosa de tratamento quanto a possível ressonância cristológica do termo no Evangelho de João.
- source_word: τίς ἐστιν;
  choice: quem é?
  rationale: Reproduz de modo conciso a pergunta grega, cujo referente é recuperável pelo contexto.
theological_decisions:
- issue: Sentido de κύριος ao dirigir-se a Jesus
  choice: Senhor
  alternative: senhor; Mestre
  rationale: “Senhor” preserva a abertura entre tratamento respeitoso e título de maior peso cristológico, sem decidir em favor de apenas um desses matizes.
translation_notes:
  register: Português moderno, digno e de leitura natural, com presente narrativo para refletir λέγει. A formulação evita explicitar “discípulo”, ausente neste versículo, e mantém a descrição da postura compreensível para leitores atuais.
