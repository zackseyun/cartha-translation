id: JHN.13.5
reference: John 13:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: pt
  text: Depois, derramou água na bacia[a] e começou a lavar os pés dos discípulos e a enxugá-los com a toalha que havia amarrado à cintura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na bacia de lavar”. O termo grego designa um recipiente usado para lavagem.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com a qual estava cingido”. A expressão indica que a toalha estava presa ao redor da cintura para o serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Depois
  rationale: Marca com naturalidade a sequência das ações na narrativa.
- source_word: βάλλει
  choice: derramou
  rationale: Embora o verbo tenha o sentido amplo de pôr ou lançar, com água e uma bacia o equivalente idiomático em português é “derramar”. O passado também é a forma narrativa natural em português.
- source_word: νιπτῆρα
  choice: bacia
  rationale: Designa um recipiente usado para lavagem; “bacia” é claro, corrente e adequado ao contexto.
- source_word: ἤρξατο νίπτειν
  choice: começou a lavar
  rationale: Preserva o aspecto incoativo de ἤρξατο seguido de infinitivo.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: os pés dos discípulos
  rationale: Reproduz de modo natural e direto a relação genitiva.
- source_word: ἐκμάσσειν
  choice: a enxugá-los
  rationale: No contexto, o verbo indica remover a água dos pés com a toalha; “enxugar” expressa isso naturalmente, e o pronome retoma “os pés”.
- source_word: τῷ λεντίῳ
  choice: com a toalha
  rationale: “Toalha” é o equivalente contextual claro para o pano usado para enxugar.
- source_word: ᾧ ἦν διεζωσμένος
  choice: que havia amarrado à cintura
  rationale: Expressa em português corrente o sentido de estar cingido com a toalha, sem recorrer ao pouco usual “cingido”.
