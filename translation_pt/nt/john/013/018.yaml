id: JHN.13.18
reference: John 13:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: pt
  text: 'Não estou falando de todos vocês[a]. Eu sei quem escolhi. Mas isso é para que se cumpra a Escritura: “Aquele que come o meu pão levantou contra mim o seu calcanhar.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Não falo a respeito de todos vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Citação ou alusão ao Salmo 41:9 (41:10 em algumas numerações).
    reason: cross_reference
  - marker: c
    text: 'Ou: “ergueu contra mim o seu calcanhar”. A expressão é uma imagem de hostilidade e traição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Não estou falando de todos vocês
  rationale: 'Formulação natural em português que preserva o sentido de περὶ, “a respeito de”, e o alcance da negação: a declaração não se aplica a todos os presentes.'
- source_word: ἐγὼ οἶδα
  choice: Eu sei
  rationale: Embora οἶδα tenha forma de perfeito, em grego koiné possui sentido presente. O pronome explícito conserva a ênfase de ἐγώ.
- source_word: τίνας ἐξελεξάμην
  choice: quem escolhi
  rationale: Mantém indefinida a identidade dos escolhidos neste ponto e traduz diretamente o aoristo médio de ἐκλέγομαι, sem acrescentar uma categoria teológica específica.
- source_word: ἀλλ’ ἵνα
  choice: Mas isso é para que
  rationale: Explicita de modo moderado a ligação sintática necessária em português e conserva a ideia de propósito ou resultado sem ampliar a causalidade.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: se cumpra a Escritura
  rationale: Emprega a formulação bíblica corrente e natural em português, preservando o subjuntivo passivo e o sentido de γραφή como Escritura sagrada.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Aquele que come o meu pão
  rationale: Reproduz o particípio substantivado com linguagem clara e preserva o possessivo ligado a “pão”.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: levantou contra mim o seu calcanhar
  rationale: Conserva a metáfora concreta da citação do salmo. A nota esclarece seu valor idiomático de hostilidade e traição sem substituir a imagem no texto.
theological_decisions:
- issue: Relação entre a escolha feita por Jesus e o traidor
  choice: Traduzir ἐξελεξάμην simplesmente como “escolhi”, sem definir a natureza dessa escolha.
  alternative: Especificar “escolhi para a salvação” ou “escolhi como apóstolos”.
  rationale: O versículo não determina explicitamente a categoria teológica da escolha. A tradução preserva a tensão do contexto sem resolver debates sobre eleição, apostolado ou apostasia.
- issue: Valor de ἀλλ’ ἵνα na relação entre a traição e a Escritura
  choice: “Mas isso é para que se cumpra a Escritura”.
  alternative: “Mas isso aconteceu porque era necessário que a Escritura se cumprisse”.
  rationale: A opção mantém a linguagem de cumprimento e a possível nuance de propósito ou resultado, sem acrescentar uma explicação determinista que o grego não formula aqui.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe do discurso é natural, enquanto a imagem incomum do calcanhar é mantida por pertencer à citação bíblica e recebe esclarecimento em nota.
