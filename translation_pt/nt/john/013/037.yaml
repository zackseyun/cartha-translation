id: JHN.13.37
reference: John 13:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: pt
  text: 'Pedro lhe disse: “Senhor, por que não posso seguir-te agora? Darei a minha vida[a] por ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “a minha alma”; neste modo de dizer, o sentido é “a minha vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πέτρος
  choice: Pedro lhe disse
  rationale: O presente histórico grego é vertido pelo passado, mais natural na narrativa em português; o pronome “lhe” preserva o objeto indireto.
- source_word: Κύριε
  choice: Senhor
  rationale: Forma natural de tratamento que preserva tanto o respeito quanto o possível peso teológico do termo no contexto joanino.
- source_word: διὰ τί οὐ δύναμαί
  choice: por que não posso
  rationale: Expressa de modo direto e natural a pergunta sobre incapacidade, sem acrescentar uma causa não declarada.
- source_word: σοι ἀκολουθῆσαι
  choice: seguir-te
  rationale: “Seguir” preserva simultaneamente o sentido de acompanhar Jesus e a ressonância de discipulado.
- source_word: ἄρτι
  choice: agora
  rationale: Equivalente temporal claro e idiomático, adequado ao contraste contextual entre o presente e o que acontecerá depois.
- source_word: τὴν ψυχήν μου
  choice: a minha vida
  rationale: Na expressão com τίθημι, ψυχή se refere à vida entregue na morte; “alma” poderia sugerir aqui um contraste metafísico que o contexto não exige.
- source_word: ὑπὲρ σοῦ
  choice: por ti
  rationale: Mantém aberta a amplitude de ὑπέρ, que pode indicar benefício, causa ou entrega em favor de alguém, sem definir além do texto.
- source_word: θήσω
  choice: darei
  rationale: Com “vida”, traduz naturalmente o idioma grego de dispor ou entregar a própria vida, conservando a força voluntária da declaração de Pedro.
theological_decisions:
- issue: Sentido de ψυχή na declaração de Pedro
  choice: “vida”
  alternative: “alma”
  rationale: O contexto trata da disposição de Pedro de morrer por Jesus. “Vida” comunica esse sentido idiomático, enquanto a nota registra a forma mais literal.
- issue: Amplitude de ἀκολουθέω
  choice: “seguir”
  alternative: “acompanhar” ou “ir contigo”
  rationale: “Seguir” conserva tanto o movimento para onde Jesus vai quanto a dimensão do discipulado, sem resolver a tensão entre esses sentidos.
- issue: Nuance de ὑπέρ
  choice: “por ti”
  alternative: “em teu favor” ou “em teu lugar”
  rationale: A formulação concisa não impõe à fala de Pedro uma interpretação estritamente substitutiva nem elimina a ideia de entrega em favor de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural em registro bíblico moderado. A fala de Pedro permanece direta e enfática, sem arcaísmos desnecessários.
