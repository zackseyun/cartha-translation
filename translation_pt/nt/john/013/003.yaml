  - severity: low
    issue: «Havia entregado todas as coisas em suas mãos» é uma combinação menos natural em português.
    rationale: Embora compreensível, «colocado todas as coisas em suas mãos» é uma expressão portuguesa mais fluente e preserva a metáfora concreta de εἰς τὰς χεῖρας.
