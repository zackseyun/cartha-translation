  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: pt
  text: Jesus, sabendo que o Pai havia colocado todas as coisas em suas mãos, e que tinha vindo de Deus[a] e estava indo para Deus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saíra de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: Também se pode entender “estava voltando para Deus”; o grego diz simplesmente “estava indo para Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: O particípio introduz a circunstância que fundamenta a ação do versículo seguinte. “Sabendo” preserva a ligação sintática e é natural em português.
- source_word: πάντα
  choice: todas as coisas
  rationale: Expressa de modo explícito o alcance abrangente do neutro plural grego, sem restringi-lo.
- source_word: ἔδωκεν
  choice: havia entregado
  rationale: O mais-que-perfeito composto indica naturalmente, em português, uma ação anterior à cena narrada; “entregado” também conserva a ideia de algo confiado à autoridade de Jesus.
- source_word: εἰς τὰς χεῖρας
  choice: em suas mãos
  rationale: Mantém a metáfora concreta grega, inteligível em português como expressão de autoridade e domínio.
- source_word: ὁ πατὴρ
  choice: o Pai
  rationale: Preserva o título definido empregado no grego, sem acrescentar o possessivo “seu”.
- source_word: ἀπὸ θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente a origem indicada pelo texto, sem substituir “Deus” por “Pai” nem acrescentar “da presença de”.
- source_word: ἐξῆλθεν
  choice: viera
  rationale: Comunica de modo conciso e idiomático a origem e a vinda anteriores de Jesus. Evita tanto o literalismo pouco natural “saíra” quanto uma explicitação doutrinária.
- source_word: πρὸς τὸν θεὸν
  choice: para Deus
  rationale: Representa diretamente o movimento em direção a Deus, deixando aberta a nuance relacional da preposição.
- source_word: ὑπάγει
  choice: estava indo
  rationale: O imperfeito perifrástico português expressa o movimento em curso ou iminente, sem acrescentar explicitamente a ideia de retorno.
theological_decisions:
- issue: Linguagem cristológica de origem em ἀπὸ θεοῦ ἐξῆλθεν
  choice: viera de Deus
  alternative: saíra de Deus
  rationale: A formulação preserva a afirmação joanina da origem e missão de Jesus, mas não impõe uma formulação doutrinária posterior nem torna a expressão artificial em português.
- issue: Destino de Jesus em πρὸς τὸν θεὸν ὑπάγει
  choice: estava indo para Deus
  alternative: estava voltando para Deus
  rationale: “Voltando” é coerente com o contexto joanino, mas explicita uma noção que esta oração não enuncia lexicalmente. A tradução mantém a tensão e a simplicidade do grego.
- issue: Sujeito implícito do particípio εἰδὼς
  choice: Jesus
  alternative: ele
  rationale: O sujeito é recuperado do contexto imediato. Repetir “Jesus” torna o fragmento compreensível como versículo isolado sem alterar sua referência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura participial e a vírgula final foram mantidas porque a frase continua no versículo seguinte.
