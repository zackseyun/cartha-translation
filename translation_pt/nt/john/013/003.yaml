  naturalness: «Jesus, sabendo que o Pai havia colocado todas as coisas em suas mãos» é claro, natural e mantém a imagem de autoridade/entrega. «Tinha vindo de Deus» é mais corrente e amplamente compreensível do que «viera», sem perda de sentido.
  terminology: «o Pai» e «Deus» preservam corretamente os termos distintos e definidos do grego. «Todas as coisas», «em suas mãos», «tinha vindo de Deus» e «estava indo para Deus» mantêm o registro solene e natural, sem introduzir a inferência de que ele estivesse necessariamente «voltando».
