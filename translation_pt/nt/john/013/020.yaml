id: JHN.13.20
reference: John 13:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: quem recebe qualquer pessoa que eu enviar recebe a mim; e quem recebe a mim recebe aquele que me enviou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto do Evangelho de João, “aquele que me enviou” é o Pai.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e o caráter solene da fórmula introdutória de Jesus em linguagem bíblica clara e amplamente compreensível.
- source_word: λέγω ὑμῖν
  choice: lhes digo
  rationale: Expressa diretamente o verbo no presente e o pronome plural, mantendo a dignidade da fórmula sem tornar a frase pesada.
- source_word: ὁ λαμβάνων
  choice: quem recebe
  rationale: O particípio substantivado tem sentido genérico; “quem recebe” é natural em português e não restringe indevidamente a referência a homens.
- source_word: ἄν τινα πέμψω
  choice: qualquer pessoa que eu enviar
  rationale: A combinação de ἄν, τινα e o subjuntivo πέμψω indica referência aberta e indefinida a qualquer pessoa que Jesus venha a enviar.
- source_word: λαμβάνει
  choice: recebe
  rationale: Mantém a repetição lexical que estrutura a cadeia de recepção e representação no versículo; “acolhe” seria possível, mas estreitaria o sentido.
- source_word: ἐμέ
  choice: a mim
  rationale: A forma tônica conserva a ênfase do pronome grego e torna clara a progressão entre o enviado, Jesus e aquele que o enviou.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: e quem recebe a mim
  rationale: Aqui δέ funciona como conexão leve na progressão paralela, mais bem representada por “e” do que por uma oposição forte como “mas”.
- source_word: τὸν πέμψαντά με
  choice: aquele que me enviou
  rationale: Preserva a descrição relacional do texto sem inserir no corpo do versículo o título “Pai”, embora o contexto joanino identifique assim o remetente.
theological_decisions:
- issue: Identidade de “aquele que me enviou”
  choice: aquele que me enviou
  alternative: o Pai, que me enviou
  rationale: No contexto do Evangelho de João, a expressão se refere ao Pai; contudo, o versículo usa uma descrição relacional, não o título explícito. A tradução mantém essa formulação e esclarece a identificação em nota.
- issue: Alcance dos particípios masculinos genéricos
  choice: quem recebe
  alternative: aquele que recebe
  rationale: As formas masculinas singulares são genéricas e representativas, não limitadas ao sexo masculino. “Quem” comunica esse alcance com naturalidade e precisão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “recebe” e a sequência representativa entre o enviado, Jesus e aquele que o enviou foram preservadas. “Em verdade, em verdade” mantém a solenidade da fórmula joanina.
