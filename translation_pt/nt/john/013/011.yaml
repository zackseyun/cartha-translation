  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: pt
  text: 'Pois ele sabia quem o estava traindo[a]; por isso disse: “Nem todos vocês estão limpos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “quem o estava entregando”. No contexto, isso se refere à traição de Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: sabia
  rationale: O mais-que-perfeito grego de οἶδα tem aqui sentido de estado presente no ponto da narrativa; o imperfeito português “sabia” expressa naturalmente o conhecimento já existente de Jesus.
- source_word: γὰρ
  choice: Pois
  rationale: Introduz a explicação da declaração anterior e preserva de modo conciso a ligação argumentativa.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: quem o estava traindo
  rationale: No contexto da paixão em João, παραδίδωμι designa a ação traiçoeira de Judas. A construção progressiva conserva o aspecto do particípio presente sem transformá-lo explicitamente em futuro.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Expressa de forma natural e explícita a relação causal entre o conhecimento de Jesus e sua declaração.
- source_word: εἶπεν ὅτι
  choice: 'disse:'
  rationale: Os dois-pontos e a citação direta representam naturalmente o ὅτι introdutor de discurso.
- source_word: Οὐχὶ πάντες
  choice: Nem todos vocês
  rationale: A formulação portuguesa comunica a negação enfática sem sugerir que nenhum deles estivesse limpo; “vocês” explicita o destinatário plural.
- source_word: καθαροί ἐστε
  choice: estão limpos
  rationale: “Limpos” preserva tanto a imagem concreta da lavagem dos pés quanto a dimensão moral ou espiritual, sem resolver a tensão do contexto.
theological_decisions:
- issue: Sentido de παραδιδόντα em relação a Judas
  choice: estava traindo
  alternative: estava entregando
  rationale: “Traindo” comunica a força contextual da entrega deliberada de Jesus por Judas, enquanto a nota preserva o sentido lexical mais literal.
- issue: Sentido de καθαροί no discurso do lava-pés
  choice: limpos
  alternative: puros
  rationale: “Limpos” mantém simultaneamente a imagem da lavagem e a condição espiritual; “puros” restringiria o sentido à esfera moral ou religiosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Pois” mantém o vínculo explicativo; “por isso” evita formalidade desnecessária. A formulação conserva a ambiguidade intencional de “limpos”.
