id: JHN.13.7
reference: John 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “O que estou fazendo você não sabe agora[a], mas compreenderá depois destas coisas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui um verbo que significa normalmente “saber” e, na frase seguinte, outro que pode significar “vir a saber” ou “compreender”.
    reason: lexical_alternative
  - marker: b
    text: “Depois destas coisas” pode se referir ao que ainda acontece neste episódio ou, de modo mais amplo, a acontecimentos posteriores que esclareceriam o ato de Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: Em português natural, «respondeu» já introduz a fala; reproduzir literalmente «respondeu e disse» seria possível, mas soaria redundante e menos corrente.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: O que estou fazendo
  rationale: O presente tem valor progressivo no contexto da ação em curso, e o pronome ἐγώ recebe expressão natural em «estou fazendo».
- source_word: σὺ οὐκ οἶδας ἄρτι
  choice: você não sabe agora
  rationale: Preserva o sentido básico de οἶδα e a ênfase temporal de ἄρτι, além de manter a distinção lexical em relação a γινώσκω.
- source_word: γνώσῃ
  choice: compreenderá
  rationale: No contexto, indica chegar posteriormente à compreensão do significado do ato; a escolha também sinaliza que o grego emprega um verbo diferente de οἶδα.
- source_word: δὲ μετὰ ταῦτα
  choice: mas compreenderá depois destas coisas
  rationale: «Mas» explicita o contraste, enquanto «depois destas coisas» conserva a formulação aberta de μετὰ ταῦτα sem definir quais acontecimentos produzirão a compreensão.
theological_decisions:
- issue: Alcance temporal da futura compreensão
  choice: Manter «depois destas coisas» sem identificar um acontecimento específico
  alternative: Explicitar «depois», «quando eu terminar», «depois da ressurreição» ou «por meio do Espírito»
  rationale: O texto pode apontar para a explicação posterior do lava-pés ou, de modo mais amplo, para acontecimentos futuros. A tradução não resolve essa abertura teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Você» corresponde ao singular dirigido a Pedro no contexto. A construção evita a redundância pouco natural de «respondeu e disse», mas conserva todas as relações semânticas relevantes.
