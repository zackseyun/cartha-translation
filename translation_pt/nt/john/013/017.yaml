id: JHN.13.17
reference: John 13:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: pt
  text: Se vocês sabem estas coisas, são bem-aventurados[a] se as praticarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “felizes” ou “afortunados”. A palavra grega descreve uma condição favorecida ou plena, não apenas o sentimento de felicidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Se
  rationale: Introduz diretamente a primeira oração condicional, preservando a estrutura grega.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o demonstrativo neutro plural, que retoma o exemplo e o ensino anteriores de Jesus.
- source_word: οἴδατε
  choice: vocês sabem
  rationale: Expressa conhecimento ou consciência; evita ampliar o sentido para 'compreendem' sem necessidade lexical.
- source_word: μακάριοί
  choice: bem-aventurados
  rationale: Preserva o sentido bíblico de uma condição favorecida e plena, sem reduzi-lo a um sentimento subjetivo de felicidade.
- source_word: ἐστε
  choice: são
  rationale: Tradução direta do presente do verbo 'ser', concordando naturalmente com 'vocês'.
- source_word: ἐὰν
  choice: se
  rationale: Marca a condição contingente ligada à ação subsequente.
- source_word: ποιῆτε
  choice: praticarem
  rationale: No contexto, indica pôr em ação aquilo que Jesus ensinou; 'praticar' é natural em português e explicita a aplicação sem acrescentar conteúdo.
- source_word: αὐτά
  choice: as
  rationale: Pronome que retoma 'estas coisas'; a forma átona evita repetição e produz português natural.
theological_decisions:
- issue: Tradução de μακάριοι no contexto do discipulado
  choice: bem-aventurados
  alternative: felizes; afortunados
  rationale: '''Bem-aventurados'' conserva a força bíblico-teológica de uma condição favorecida e plena, possivelmente sob o favor de Deus, sem limitar a afirmação a uma emoção nem explicitar além do grego o agente da bênção.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de 'vocês' para o plural. 'Bem-aventurados' mantém a ressonância bíblica; a nota esclarece seu sentido. A construção condicional dupla do grego foi preservada.
