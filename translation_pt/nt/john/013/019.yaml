source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: pt
  text: A partir de agora, digo a vocês, antes que isso aconteça, para que, quando acontecer, vocês creiam que eu sou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que sou eu” ou “que eu sou ele”. A expressão grega diz literalmente “que eu sou” e pode também evocar a autoidentificação divina em Isaías e em outras passagens de João.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Desde agora
  rationale: Expressão temporal natural em português que marca o momento presente em diante.
- source_word: λέγω ὑμῖν
  choice: digo a vocês
  rationale: Mantém o presente e a referência explícita aos discípulos em linguagem corrente e digna.
- source_word: πρὸ τοῦ γενέσθαι
  choice: antes que isso aconteça
  rationale: Reproduz a relação temporal de anterioridade e deixa o acontecimento sem especificação adicional, como no grego.
- source_word: ἵνα
  choice: para que
  rationale: Preserva claramente a força de propósito.
- source_word: πιστεύσητε
  choice: vocês creiam
  rationale: Mantém o vocabulário joanino de crer e a forma subjuntiva exigida pela oração de finalidade.
- source_word: ὅταν γένηται
  choice: quando acontecer
  rationale: Expressa de modo natural a contingência futura, sem acrescentar ênfase ausente do texto.
- source_word: ὅτι ἐγώ εἰμι
  choice: que Eu Sou
  rationale: Preserva a construção absoluta sem fornecer um predicativo ausente no grego e permite que permaneça perceptível sua possível ressonância de autoidentificação divina.
theological_decisions:
- issue: A expressão absoluta ἐγώ εἰμι no contexto joanino pode ser simples autoidentificação e também evocar linguagem divina.
  choice: que Eu Sou
  alternative: que sou eu; que eu sou ele
  rationale: A tradução literal mantém a ambiguidade e o peso teológico potencial da expressão sem impor um predicativo que não aparece no grego. A nota registra alternativas portuguesas mais idiomáticas.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com legibilidade brasileira. A capitalização de “Eu Sou” sinaliza a possível ressonância bíblica sem explicá-la no corpo do versículo; a nota preserva as demais leituras possíveis.
