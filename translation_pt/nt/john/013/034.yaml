id: JHN.13.34
reference: John 13:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: pt
  text: 'Eu lhes dou um novo mandamento: que vocês amem uns aos outros. Assim como eu amei vocês, vocês também devem amar uns aos outros[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que vocês também amem uns aos outros”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: um novo mandamento
  rationale: “Mandamento” preserva a força ética e formal de ἐντολή no uso joanino; “novo” mantém a ambiguidade de καινός sem explicar em que sentido o mandamento é novo.
- source_word: δίδωμι ὑμῖν
  choice: Eu lhes dou
  rationale: O presente simples comunica naturalmente o ato solene de dar, e “lhes” preserva o dativo de destinatário.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: que vocês amem uns aos outros
  rationale: Depois de “dou um mandamento”, a oração com ἵνα expressa naturalmente o conteúdo do mandamento, mantendo sua força exortativa.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Assim como eu amei vocês
  rationale: “Assim como” apresenta o amor de Jesus como padrão, e o pretérito perfeito simples corresponde adequadamente ao aoristo ἠγάπησα.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: vocês também devem amar uns aos outros
  rationale: A formulação traz à tona a força exortativa e a ênfase de καὶ ὑμεῖς, enquanto a nota registra a construção alternativa mais próxima da forma grega.
theological_decisions:
- issue: Natureza do “novo mandamento”
  choice: Manter simplesmente “um novo mandamento”
  alternative: Explicar que é novo no tempo, na qualidade ou em sua realização em Jesus
  rationale: O versículo não especifica em que consiste a novidade; não se deve resolver no texto uma tensão que o grego preserva.
- issue: Função da segunda oração com ἵνα
  choice: Expressar sua força exortativa com “devem amar”
  alternative: Traduzir “para que vocês também amem” ou “que vocês também amem”
  rationale: A sintaxe admite relação de conteúdo ou resultado/finalidade. O texto principal comunica a exortação no português corrente, e a nota preserva a alternativa sem fixar uma interpretação exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita regionalismo excessivo; “uns aos outros” preserva a reciprocidade e a repetição enfática do original.
