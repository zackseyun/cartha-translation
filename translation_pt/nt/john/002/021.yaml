  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: pt
  text: Mas ele estava falando do templo do seu corpo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «santuário do seu corpo». A palavra grega usada aqui, naós, muitas vezes se refere mais especificamente ao santuário interior, e não a todo o complexo do templo.
    reason: Alternativa lexical que explicita o alcance mais específico de ναός.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ele
  rationale: No contexto, o demonstrativo retoma Jesus; em português natural, o pronome «ele» comunica a referência sem ênfase artificial.
- source_word: δὲ
  choice: Mas
  rationale: Marca o contraste leve entre o entendimento dos interlocutores no versículo anterior e a explicação do evangelista.
- source_word: ἔλεγεν
  choice: estava falando
  rationale: Preserva o aspecto descritivo do imperfeito e evita a paráfrase interpretativa «queria dizer».
- source_word: περὶ
  choice: do
  rationale: Na construção portuguesa «falar de», expressa naturalmente o sentido de «acerca de» com o genitivo.
- source_word: ναοῦ
  choice: templo
  rationale: É a forma corrente e reconhecível, enquanto a nuance de ναός como santuário interior é registrada em nota.
- source_word: σώματος
  choice: corpo
  rationale: Traduz diretamente o termo e conserva a metáfora teologicamente significativa.
- source_word: αὐτοῦ
  choice: seu
  rationale: Indica que o corpo é do próprio Jesus; no contexto imediato, a referência é clara.
theological_decisions:
- issue: Identificação metafórica do corpo de Jesus com o templo
  choice: templo do seu corpo
  alternative: seu corpo como templo; santuário do seu corpo
  rationale: Mantém diretamente a construção metafórica e a tensão do texto, sem explicá-la por meio de uma paráfrase doutrinária.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A estrutura concisa acompanha o comentário explicativo do evangelista.
