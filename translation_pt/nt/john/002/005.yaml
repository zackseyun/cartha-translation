  source_fidelity: O texto traduz com precisão λέγει ἡ μήτηρ αὐτοῦ como “A mãe dele disse” e mantém o sujeito implícito de λέγῃ como “ele”, cujo referente contextual é Jesus. “Aos que serviam” comunica adequadamente διακόνοις no cenário de um banquete, sem importar o sentido posterior de ofício eclesiástico. “Façam tudo o que ele lhes disser” reproduz a construção indefinida ὅ τι ἂν e o imperativo plural ποιήσατε.
  naturalness: A redação é fluente, clara e apropriada ao português moderno com boa legibilidade brasileira. “A mãe dele” e “aos que serviam” soam naturais no contexto narrativo, e o futuro do subjuntivo em “disser” expressa bem a eventualidade da construção grega.
