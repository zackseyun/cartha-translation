  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: pt
  text: 'A mãe dele disse aos que serviam: “Façam tudo o que ele lhes disser.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: a mãe dele
  rationale: Forma natural em português para a construção genitiva, preservando a identificação familiar sem introduzir o nome de Maria.
- source_word: διακόνοις
  choice: aos que serviam
  rationale: No contexto da festa de casamento, refere-se às pessoas encarregadas do serviço, não ao ofício eclesiástico posterior de diácono. A formulação verbal é clara e evita sugerir necessariamente uma condição social específica.
- source_word: Ὅ τι ἂν
  choice: tudo o que
  rationale: Expressa de modo idiomático e abrangente a construção relativa indefinida com ἄν.
- source_word: λέγῃ ὑμῖν
  choice: ele lhes disser
  rationale: O futuro do subjuntivo português transmite naturalmente a contingência futura e indefinida do presente do subjuntivo grego com ἄν.
- source_word: ποιήσατε
  choice: Façam
  rationale: O imperativo plural comunica a ordem direta; o objeto já está expresso por “tudo o que”, dispensando “façam isso”.
theological_decisions:
- issue: Referente do sujeito implícito em λέγῃ
  choice: “ele”, referindo-se a Jesus
  alternative: “Jesus” explicitamente
  rationale: O grego deixa o sujeito implícito, embora o contexto identifique claramente Jesus. “Ele” preserva a concisão do original sem expansão interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Aos que serviam” é natural no contexto narrativo e evita tanto o tecnicismo eclesiástico “diáconos” quanto a ambiguidade social de “servos”. Não há marcador de nota porque nenhuma nota é necessária para preservar uma alternativa relevante do texto-fonte.
