  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: pt
  text: Quando o encarregado do banquete[a] provou a água que havia se tornado vinho e não sabia de onde ela vinha — embora os serventes que haviam tirado a água soubessem —, ele chama[b] o noivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mestre do banquete”. O termo grego designa a pessoa que supervisionava o banquete.
    reason: lexical_alternative
  - marker: b
    text: 'João emprega aqui o presente histórico: “chama”. Em português, também se poderia traduzir “chamou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: encarregado do banquete
  rationale: Designa a pessoa responsável por supervisionar o banquete. A expressão é clara em português internacional e evita restringir a função à de um simples garçom.
- source_word: ἐγεύσατο
  choice: provou
  rationale: Verbo direto e natural para o ato de experimentar a bebida.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: a água que havia se tornado vinho
  rationale: O particípio perfeito expressa uma mudança de estado já concluída e com resultado vigente; a formulação preserva a afirmação explícita da transformação.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: não sabia de onde ela vinha
  rationale: Comunica naturalmente a ideia de origem expressa por πόθεν, mantendo a água como referente explícito.
- source_word: διάκονοι
  choice: serventes
  rationale: Neste contexto narrativo, refere-se aos que serviam no banquete, não ao ofício eclesiástico posterior.
- source_word: ἠντληκότες
  choice: haviam tirado
  rationale: No contexto, descreve tirar a água; a forma composta deixa clara a anterioridade dessa ação.
- source_word: φωνεῖ
  choice: chama
  rationale: Mantém o presente histórico empregado por João, apesar dos verbos anteriores no passado.
- source_word: νυμφίον
  choice: noivo
  rationale: É o equivalente moderno, natural e preciso no contexto de um casamento.
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz naturalmente a nova etapa da narrativa sem acrescentar um marcador temporal inexistente como 'agora' nem forçar uma oposição forte.
theological_decisions:
- issue: Descrição narrativa do milagre
  choice: a água que havia se tornado vinho
  alternative: a água transformada em vinho
  rationale: O grego afirma diretamente uma mudança real de estado. A tradução conserva essa afirmação sem acrescentar explicações doutrinárias nem reduzi-la a aparência ou percepção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição final do sujeito grego foi representada pelo pronome “ele” para dar clareza ao período. Os travessões delimitam a observação parentética sem alterar sua relação lógica com a oração principal.
