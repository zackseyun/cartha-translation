id: JHN.2.4
reference: John 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: pt
  text: 'Jesus lhe disse: “O que isso tem a ver comigo e com você[a], mulher[b]? A minha hora ainda não chegou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Que há para mim e para você nisso?”. É uma expressão idiomática que indica distância de interesse ou perspectiva, não necessariamente hostilidade.'
    reason: lexical_alternative
  - marker: b
    text: Naquele contexto, “mulher” era uma forma normal e respeitosa de tratamento, embora possa soar abrupta em português atual.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico, o pretérito é mais natural na narrativa em português e preserva a função discursiva.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: O que isso tem a ver comigo e com você
  rationale: A expressão idiomática assinala distância de interesse ou perspectiva e pode conter uma repreensão branda. A formulação conserva a referência explícita a ambas as pessoas sem transformar a fala em hostilidade aberta.
- source_word: γύναι
  choice: mulher
  rationale: O vocativo significa literalmente “mulher” e, naquele contexto, podia ser uma forma respeitosa de tratamento. Opções como “querida” acrescentariam uma afeição não expressa no grego, enquanto “senhora” deslocaria culturalmente o registro.
- source_word: οὔπω
  choice: ainda não
  rationale: Expressa que o momento em questão não havia chegado até então; “ainda não” é a correspondência direta e natural em português.
- source_word: ἥκει
  choice: chegou
  rationale: O verbo denota chegada ou presença. “Chegou” combina naturalmente com “hora” e mantém a formulação característica de João.
- source_word: ἡ ὥρα μου
  choice: a minha hora
  rationale: A tradução literal preserva o motivo joanino da “hora” determinada para a missão, morte e glorificação de Jesus, sem restringi-lo no texto principal ao momento deste sinal.
theological_decisions:
- issue: Tom e força da resposta de Jesus à sua mãe
  choice: Uma resposta respeitosa, mas que estabelece distância
  alternative: Uma repreensão áspera ou, no extremo oposto, um tratamento explicitamente afetuoso
  rationale: O idioma Τί ἐμοὶ καὶ σοί marca diferença de interesse ou perspectiva, enquanto γύναι não era necessariamente ofensivo. O texto e as notas preservam essa tensão sem tornar a resposta rude nem sentimental.
- issue: Sentido de “a minha hora” na teologia joanina
  choice: A hora divinamente determinada de Jesus, com ressonância mais ampla em sua missão
  alternative: Somente o momento de realizar este sinal, ou uma referência genérica ao tempo
  rationale: Em João, “hora” adquire peso temático ligado à manifestação, morte e glorificação de Jesus. Manter “hora” permite essa ressonância sem impor no versículo uma explicação mais específica do que o grego oferece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lhe disse” mantém a referência pronominal do grego sem repetir “sua mãe”. A construção principal é idiomática, enquanto as notas esclarecem tanto a forma mais literal da expressão quanto o valor cultural do vocativo.
