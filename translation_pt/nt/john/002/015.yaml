id: JHN.2.15
reference: John 2:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: pt
  text: Depois de fazer um chicote de cordas, expulsou todos do complexo do templo[a], tanto as ovelhas como os bois[b][c]; derramou as moedas dos cambistas e virou as mesas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: cultural_note
  - marker: b
    text: 'Ou: “tanto as ovelhas como o gado”.'
    reason: lexical_alternative
  - marker: c
    text: O grego diz “expulsou todos” e depois especifica “tanto as ovelhas como os bois”; não afirma explicitamente que o chicote foi usado em pessoas.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: depois de fazer
  rationale: O particípio aoristo apresenta uma ação anterior à do verbo principal; a formulação comunica essa sequência com clareza em português atual.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: um chicote de cordas
  rationale: “Chicote” é o termo corrente para o instrumento, e “de cordas” preserva a indicação do material sem sugerir um tipo técnico específico.
- source_word: πάντας ἐξέβαλεν
  choice: expulsou todos
  rationale: Mantém a força abrangente do masculino plural πάντας e o sentido enérgico de ἐκβάλλω, sem definir antecipadamente se o referente inclui pessoas.
- source_word: τοῦ ἱεροῦ
  choice: do complexo do templo
  rationale: Ἱερόν designa o conjunto ou recinto do templo, e não especificamente o santuário interior; “complexo do templo” torna essa distinção compreensível.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: tanto as ovelhas como os bois
  rationale: Reproduz a estrutura correlativa grega e usa “bois”, termo concreto e tradicionalmente compreensível para βόας neste contexto.
- source_word: κολλυβιστῶν
  choice: cambistas
  rationale: É o termo português corrente para pessoas que trocam moedas, adequado à atividade exercida no templo.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: derramou as moedas
  rationale: Preserva a imagem concreta de ἐκχέω, “derramar”, aplicada às pequenas moedas, em vez de substituí-la pela interpretação “espalhou”.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: virou as mesas
  rationale: Expressa naturalmente o ato de tombar ou virar as mesas, com a força contextual de ἀναστρέφω.
theological_decisions:
- issue: Alcance da expulsão e uso do chicote
  choice: Conservar “expulsou todos”, seguido da especificação “tanto as ovelhas como os bois”, sem afirmar que Jesus bateu em pessoas com o chicote.
  alternative: Explicitar que expulsou todas as pessoas e todos os animais, ou restringir a expulsão somente aos animais.
  rationale: A sintaxe grega deixa certa tensão quanto ao referente exato de πάντας. O texto menciona o chicote, mas não declara explicitamente em quem ele foi usado; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o movimento do grego sem rigidez excessiva; as notas preservam a distinção entre ἱερόν e o santuário interior e a ambiguidade sobre o alcance da ação.
