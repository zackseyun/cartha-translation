id: JHN.2.22
reference: John 2:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: pt
  text: Portanto, quando ele foi ressuscitado dentre os mortos[a], seus discípulos se lembraram de que ele havia dito isso[b] e creram na Escritura e na palavra que Jesus havia falado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ressuscitou dentre os mortos”. O verbo grego está na voz passiva, preservada no texto principal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vinha dizendo isso” ou “dizia isso”. O imperfeito grego pode apresentar a fala anterior como contínua ou repetida.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “declaração”. O termo grego pode se referir a uma palavra, declaração ou mensagem falada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Portanto, quando
  rationale: ὅτε introduz a oração temporal, e οὖν dá continuidade inferencial à narrativa. A formulação preserva ambas as funções em português natural.
- source_word: ἠγέρθη
  choice: foi ressuscitado
  rationale: Preserva a voz passiva do aoristo e expressa com clareza o sentido de ἐγείρω no contexto da ressurreição.
- source_word: ἐκ νεκρῶν
  choice: dentre os mortos
  rationale: Reproduz naturalmente a construção grega no plural e conserva a ideia de sair do meio dos mortos.
- source_word: ἐμνήσθησαν
  choice: se lembraram
  rationale: Expressa de modo idiomático o ato de trazer à memória algo dito anteriormente.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: É a forma portuguesa natural da construção possessiva grega.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: de que ele havia dito isso
  rationale: O mais-que-perfeito composto situa a fala antes da lembrança dos discípulos. No contexto, o imperfeito remete à declaração anterior sem exigir a ideia de repetição.
- source_word: ἐπίστευσαν
  choice: creram
  rationale: É a tradução direta e não expansiva de πιστεύω com os objetos no dativo.
- source_word: τῇ γραφῇ
  choice: na Escritura
  rationale: Mantém o singular de γραφή e seu sentido de escrito sagrado dotado de autoridade.
- source_word: τῷ λόγῳ
  choice: na palavra
  rationale: Refere-se à declaração oral de Jesus e preserva a amplitude lexical e a ressonância joanina de λόγος.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: que Jesus havia falado
  rationale: A oração relativa modifica 'palavra'; o mais-que-perfeito composto marca naturalmente a anterioridade da fala em relação à crença posterior.
theological_decisions:
- issue: Voz do verbo da ressurreição
  choice: foi ressuscitado dentre os mortos
  alternative: ressuscitou dentre os mortos
  rationale: A forma grega é passiva. Preservá-la acompanha a gramática do texto sem negar outras formulações bíblicas sobre a ressurreição de Jesus.
- issue: Sentido de πιστεύω com objetos no dativo
  choice: creram na Escritura e na palavra
  alternative: confiaram na Escritura e na palavra
  rationale: '''Creram'' preserva a formulação do texto sem acrescentar uma nuance interpretativa mais específica de confiança.'
- issue: Aspecto do imperfeito ἔλεγεν
  choice: havia dito isso
  alternative: vinha dizendo isso
  rationale: O contexto aponta para a declaração anterior de Jesus. A tradução principal evita afirmar repetição ou continuidade que o contexto não exige, enquanto a nota registra a possibilidade aspectual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'dentre os mortos' para refletir o plural grego, 'Escritura' no singular e 'palavra' para conservar a dicção joanina sem soar artificial.
