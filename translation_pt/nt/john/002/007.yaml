base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: pt
  text: 'Jesus lhes disse: “Encham as talhas de água.” E eles as encheram até a borda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até em cima”.'
    reason: Alternativa mais literal para ἕως ἄνω, expressão que indica que as talhas foram cheias completamente, até a parte superior.
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego use o presente histórico, o pretérito é mais natural na narrativa em português e preserva o sentido.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome no dativo plural indica os destinatários das palavras de Jesus; “lhes disse” é natural e conciso.
- source_word: Γεμίσατε
  choice: Encham
  rationale: O imperativo aoristo ativo plural expressa uma ordem direta dirigida a várias pessoas.
- source_word: τὰς ὑδρίας
  choice: as talhas
  rationale: ὑδρία designa um recipiente usado para água. “Talhas” é claro no contexto e mantém a referência aos recipientes já mencionados, sem repetir aqui que eram de pedra.
- source_word: ὕδατος
  choice: de água
  rationale: O genitivo indica o conteúdo com que as talhas deveriam ser enchidas; “encher de água” é a construção idiomática em português.
- source_word: ἐγέμισαν αὐτάς
  choice: eles as encheram
  rationale: O aoristo narra a execução completa da ordem, e o pronome feminino retoma naturalmente “as talhas”.
- source_word: ἕως ἄνω
  choice: até em cima
  rationale: A expressão indica que os recipientes foram enchidos até a parte superior. Esta tradução permanece próxima do grego sem pressupor um formato específico do recipiente.
