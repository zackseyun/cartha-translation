id: JHN.2.19
reference: John 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: pt
  text: 'Jesus lhes respondeu: “Destruam este templo, e em três dias eu o levantarei.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Derrubem este templo... eu o reerguerei.” O verbo grego traduzido como “levantarei” pode evocar, neste contexto, a ressurreição; mais adiante, João explica que Jesus falava do templo do seu corpo (2:21).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jesus lhes respondeu
  rationale: A construção grega literalmente combina ‘respondeu’ e ‘disse’, mas em português atual ‘lhes respondeu’ transmite de modo natural todo o valor da fórmula narrativa sem redundância artificial.
- source_word: Λύσατε
  choice: Destruam
  rationale: Neste contexto, λύω indica destruir ou demolir o templo; ‘destruam’ preserva a força do imperativo aoristo plural e permite tanto a leitura arquitetônica imediata quanto o referente corporal explicado depois.
- source_word: τὸν ναὸν τοῦτον
  choice: este templo
  rationale: ‘Templo’ é a forma comum e inteligível de traduzir ναός aqui. O demonstrativo ‘este’ mantém a imediatez e a ambiguidade deliberada da declaração.
- source_word: ἐν τρισὶν ἡμέραις
  choice: em três dias
  rationale: Expressão temporal direta e tradicional, sem impor uma precisão cronológica maior que a do grego.
- source_word: ἐγερῶ αὐτόν
  choice: eu o levantarei
  rationale: ‘Levantarei’ preserva o sentido de ἐγείρω e sua ressonância com a ressurreição, ao passo que ‘reconstruirei’ restringiria o verbo à imagem arquitetônica. O pronome ‘o’ concorda naturalmente com ‘templo’ em português.
theological_decisions:
- issue: Identificar explicitamente o templo como o corpo de Jesus
  choice: Manter ‘este templo’ sem explicação dentro do texto principal.
  alternative: ‘Destruam este templo — isto é, o meu corpo.’
  rationale: O próprio relato conserva a fala enigmática e só em João 2:21 explica o referente. Antecipar essa explicação eliminaria a tensão narrativa intencional.
- issue: Traduzir ἐγερῶ em sentido arquitetônico ou com ressonância de ressurreição
  choice: ‘eu o levantarei’
  alternative: ‘eu o reconstruirei’
  rationale: A escolha mantém possível a leitura arquitetônica ouvida pelos interlocutores e, ao mesmo tempo, a ressonância de ressurreição esclarecida pelo narrador.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula grega redundante ‘respondeu e disse’ foi vertida naturalmente por ‘respondeu’. A ambiguidade entre a demolição/reconstrução do templo e a morte/ressurreição de Jesus foi preservada.
