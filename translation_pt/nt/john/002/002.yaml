  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: pt
  text: Jesus também foi convidado para o casamento, juntamente com seus discípulos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Jesus também foi convidado, e seus discípulos, para o casamento.”'
    reason: alternativa sintática mais próxima da coordenação do grego
lexical_decisions:
- source_word: ἐκλήθη
  choice: foi convidado
  rationale: O passivo de καλέω, no contexto de participação em uma celebração social, significa naturalmente “foi convidado”, não apenas “foi chamado”.
- source_word: δὲ καὶ
  choice: também
  rationale: A combinação introduz Jesus como mais um dos convidados mencionados no contexto; “também” transmite essa adição de modo natural em português.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Forma tradicional e corrente do nome em português.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: juntamente com seus discípulos
  rationale: A expressão coordena Jesus e seus discípulos como convidados. “Juntamente com” é idiomático, enquanto “discípulos” preserva a relação de aprendizagem e a identidade do grupo ligado a Jesus.
- source_word: εἰς τὸν γάμον
  choice: para o casamento
  rationale: Neste contexto, γάμος designa o casamento ou sua celebração. “Casamento” é claro e não acrescenta explicitamente a ideia de banquete.
