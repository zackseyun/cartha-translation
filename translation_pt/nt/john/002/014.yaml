  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: pt
  text: E encontrou no templo[a] os que vendiam bois, ovelhas e pombas, e os cambistas sentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, a palavra grega traduzida como “templo” refere-se ao complexo ou recinto do templo, não especificamente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: encontrou
  rationale: Mantém o sentido direto do aoristo de εὑρίσκω, descrevendo aquilo que Jesus encontrou no local.
- source_word: ἱερῷ
  choice: templo
  rationale: É a forma corrente e natural em português; aqui ἱερόν designa o complexo ou recinto do templo, nuance esclarecida em nota.
- source_word: πωλοῦντας
  choice: os que vendiam
  rationale: Reproduz de modo natural o particípio substantivado e sua atividade em andamento.
- source_word: βόας
  choice: bois
  rationale: Equivalente claro de βοῦς no contexto de animais destinados aos sacrifícios, sem restringir o termo a touros.
- source_word: πρόβατα
  choice: ovelhas
  rationale: É o equivalente português normal e mais claro neste contexto.
- source_word: περιστερὰς
  choice: pombas
  rationale: περιστερά pode designar pomba ou pombo; “pombas” é a forma bíblica corrente em português no contexto sacrificial.
- source_word: κερματιστὰς
  choice: cambistas
  rationale: Termo português estabelecido para pessoas que trocam moedas.
- source_word: καθημένους
  choice: sentados
  rationale: Preserva de maneira concisa a postura e a presença estabelecida dos cambistas no recinto.
theological_decisions:
- issue: Alcance de ἱερόν em relação ao templo de Jerusalém
  choice: templo no texto principal, entendido como o complexo ou recinto do templo
  alternative: pátios do templo; recinto do templo; santuário
  rationale: O termo grego designa o complexo do templo, não especificamente o santuário interior. “Templo” mantém a leitura natural, enquanto a nota preserva a precisão espacial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação e a ordem dos elementos acompanham de perto o grego sem produzir uma frase artificial.
