  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: pt
  text: 'E disse aos que vendiam as pombas: “Tirem estas coisas daqui! Não façam da casa de meu Pai uma casa de comércio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιστερὰς
  choice: pombas
  rationale: Designa as aves vendidas para sacrifício; “pombas” é a forma natural e tradicional em português neste contexto.
- source_word: πωλοῦσιν
  choice: aos que vendiam
  rationale: Preserva o particípio presente que identifica o grupo por sua atividade comercial em curso.
- source_word: Ἄρατε ταῦτα ἐντεῦθεν
  choice: Tirem estas coisas daqui
  rationale: Expressa de modo natural e firme a ordem de retirar dali os objetos associados à venda, sem especificá-los além do grego.
- source_word: μὴ ποιεῖτε
  choice: Não façam
  rationale: Reproduz diretamente a proibição no presente, sem impor a interpretação mais específica de “parem de fazer”.
- source_word: οἶκον τοῦ πατρός μου
  choice: a casa de meu Pai
  rationale: Mantém explicitamente a relação filial singular afirmada por Jesus e a referência ao templo.
- source_word: οἶκον ἐμπορίου
  choice: uma casa de comércio
  rationale: Preserva a repetição retórica de οἶκον (“casa”) e traduz ἐμπορίου como atividade comercial.
theological_decisions:
- issue: A designação do templo por Jesus como “a casa de meu Pai”
  choice: 'Manter a afirmação filial explícita: “a casa de meu Pai”.'
  alternative: “a casa de nosso Pai” ou “a casa de Deus”
  rationale: O grego traz o possessivo singular μου com πατρός; substituí-lo diluiria a relação singular que Jesus expressa e alteraria o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo plural “Tirem” dirige-se naturalmente aos vendedores; a repetição “casa... casa” conserva o contraste retórico do original.
