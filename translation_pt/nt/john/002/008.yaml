base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: pt
  text: 'E ele lhes disse: “Tirem um pouco agora e levem-no ao encarregado da festa[a].” Então eles o levaram[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao chefe dos garçons” ou “ao administrador do banquete”. O termo grego se refere à pessoa encarregada da festa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E eles o trouxeram”. O verbo grego pode ser traduzido por “levar” ou “trazer”, conforme a perspectiva adotada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O presente grego funciona como presente histórico na narrativa; o pretérito perfeito é a forma mais natural em português.
- source_word: Ἀντλήσατε
  choice: Tirem um pouco
  rationale: O imperativo se refere a retirar líquido; “um pouco” explicita com naturalidade o objeto implícito no contexto, sem identificar antecipadamente o líquido como vinho.
- source_word: νῦν
  choice: agora
  rationale: Preserva de forma direta a imediaticidade da ordem.
- source_word: φέρετε
  choice: levem
  rationale: Do ponto de vista dos serventes, “levar” expressa naturalmente o transporte do líquido até o encarregado da festa.
- source_word: ἀρχιτρικλίνῳ
  choice: ao encarregado da festa
  rationale: O termo designa a pessoa responsável pela organização e condução do banquete; esta formulação é clara, atual e não atribui ao cargo funções mais específicas do que o texto permite.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Então eles o levaram
  rationale: δέ tem aqui valor conectivo leve, bem expresso por “então”; ἤνεγκαν indica que cumpriram a ordem. O pronome “o” retoma naturalmente o líquido retirado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução mantém implícita a natureza do líquido neste ponto da narrativa e usa uma designação funcional, não técnica, para o responsável pelo banquete.
