  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: pt
  text: 'E, quando o vinho acabou[a], a mãe de Jesus lhe diz[b]: “Eles não têm vinho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “quando faltou vinho”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega o presente histórico: “diz”. Algumas traduções usam “disse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: quando o vinho acabou
  rationale: O genitivo absoluto com particípio aoristo apresenta a falta do vinho como circunstância anterior à fala. “Quando o vinho acabou” é idiomático em português e comunica claramente que o suprimento se esgotou.
- source_word: λέγει
  choice: diz
  rationale: Mantém o presente histórico empregado na narrativa grega e conserva a vivacidade do relato de João.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: a mãe de Jesus
  rationale: Segue de perto a formulação grega e preserva a maneira característica pela qual João se refere a ela neste contexto.
- source_word: πρὸς αὐτόν
  choice: lhe
  rationale: Com o verbo “diz”, o pronome “lhe” expressa de modo natural em português o destinatário da fala.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Eles não têm vinho
  rationale: Conserva o sujeito plural não especificado do grego sem identificar indevidamente os anfitriões ou outro grupo.
- source_word: οἶνος
  choice: vinho
  rationale: É o sentido comum do termo grego no contexto, sem motivo textual para enfraquecê-lo ou parafraseá-lo.
theological_decisions:
- issue: Presente histórico na narrativa joanina
  choice: Preservar o presente em “diz”
  alternative: 'Empregar o passado: “disse”'
  rationale: A escolha conserva a textura discursiva e a vivacidade do grego sem produzir estranheza indevida em português.
- issue: Referente do sujeito plural implícito em “não têm vinho”
  choice: Usar “eles” sem especificar o referente
  alternative: Explicitar “os anfitriões” ou “os convidados”
  rationale: O texto grego não identifica expressamente o grupo; manter “eles” preserva essa abertura contextual e evita acrescentar informação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O presente histórico foi mantido, e a ambiguidade do sujeito plural não foi resolvida por explicitação.
