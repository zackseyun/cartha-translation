base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: pt
  text: Havia ali seis talhas de pedra para água, postas para os ritos de purificação dos judeus, cada uma com capacidade para duas ou três medidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma “medida” (grego metrētēs) era uma antiga unidade para líquidos, equivalente aproximadamente a 35–40 litros. Assim, cada talha comportava cerca de 70 a 120 litros.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: Havia ali
  rationale: Expressa naturalmente a existência e a localização; δέ funciona como conexão narrativa leve e não exige uma palavra introdutória explícita.
- source_word: λίθιναι ὑδρίαι
  choice: talhas de pedra para água
  rationale: “Talhas” designa recipientes grandes e é natural em português; “de pedra” preserva o material, e “para água” explicita a função indicada por ὑδρίαι.
- source_word: ἓξ
  choice: seis
  rationale: Correspondência direta do numeral cardinal.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: destinadas à purificação dos judeus
  rationale: No contexto, κατά relaciona as talhas à prática de purificação. A formulação conserva a referência religiosa e cultural sem detalhar além do grego.
- source_word: κείμεναι
  choice: ali / destinadas
  rationale: O particípio indica que os recipientes estavam colocados no local. Em português, essa informação fica naturalmente integrada em “Havia ali”; a construção também acomoda sua finalidade contextual sem a expressão pouco idiomática “estavam postas”.
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: cada uma com capacidade para duas ou três medidas
  rationale: χωροῦσαι indica capacidade, e ἀνά tem força distributiva, representada por “cada uma”. Mantém-se a antiga unidade no texto e explica-se seu valor aproximado em nota.
theological_decisions:
- issue: Sentido de τῶν Ἰουδαίων na narrativa joanina
  choice: dos judeus
  alternative: dos judeus da Judeia / judaica
  rationale: Aqui a expressão identifica uma prática religiosa e cultural de purificação, não primariamente uma origem regional; “dos judeus” preserva o referente sem introduzir tom polêmico.
- issue: Relação expressa por κατὰ com a purificação
  choice: destinadas à purificação
  alternative: segundo o costume de purificação
  rationale: A construção pode indicar correspondência com o costume ou finalidade prática. No contexto das talhas de água, “destinadas à” comunica sua relação funcional sem definir minuciosamente o rito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Talhas” mantém o caráter de recipientes grandes sem recorrer ao arcaísmo “cântaros”; a nota conserva a unidade antiga e oferece uma aproximação moderna.
