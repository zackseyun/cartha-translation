id: JHN.2.25
reference: John 2:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: pt
  text: e porque não precisava que alguém desse testemunho a respeito do ser humano[a], pois ele próprio sabia o que havia no ser humano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito de uma pessoa” / “o que havia numa pessoa”. O grego emprega o singular de forma genérica, referindo-se ao ser humano ou à humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: precisava
  rationale: A expressão idiomática significa “ter necessidade”. Na forma negativa, “não precisava” é natural em português atual e preserva o sentido sem rigidez desnecessária.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: que alguém desse testemunho
  rationale: Preserva o valor testemunhal de μαρτυρέω e traduz de modo idiomático a oração com ἵνα depois da expressão de necessidade.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: a respeito do ser humano
  rationale: ἄνθρωπος está no singular com valor genérico. “O ser humano” mantém o singular representativo e evita que “homem” seja entendido apenas como masculino.
- source_word: αὐτὸς γὰρ
  choice: pois ele próprio
  rationale: “Ele próprio” conserva a ênfase de αὐτός, destacando que Jesus possuía esse conhecimento diretamente; “pois” introduz a explicação de γάρ.
- source_word: ἐγίνωσκεν
  choice: sabia
  rationale: Embora o imperfeito possa indicar conhecimento contínuo ou característico, o verbo estativo é expresso naturalmente pelo pretérito imperfeito “sabia” em português.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: o que havia no ser humano
  rationale: Mantém a expressão ampla e interior do grego, bem como a repetição de ἄνθρωπος, sem especificar se a referência principal é à natureza humana em geral ou ao interior de cada pessoa.
theological_decisions:
- issue: Alcance do conhecimento de Jesus acerca da humanidade
  choice: Apresentar diretamente que Jesus sabia o que havia no ser humano, mantendo a formulação ampla.
  alternative: Explicitar “o que havia dentro de cada pessoa” ou “a natureza humana”.
  rationale: O singular genérico ἀνθρώπου/ἀνθρώπῳ pode abranger tanto pessoas individualmente quanto a humanidade de modo representativo. A tradução não restringe o texto a discernimento social nem acrescenta uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “ser humano” reproduz a coesão lexical do original; “ele próprio” conserva a ênfase, e “desse testemunho” retém a linguagem característica do campo semântico de testemunhar em João.
