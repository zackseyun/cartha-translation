id: JHN.2.23
reference: John 2:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: pt
  text: Quando ele estava em Jerusalém, por ocasião da Páscoa, durante a festa, muitos creram no seu nome[a], ao verem os sinais[b] que ele fazia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “creram nele”. Literalmente, “creram no seu nome”, expressão joanina que enfatiza a confiança dirigida à identidade revelada de Jesus.'
    reason: lexical_alternative
  - marker: b
    text: “Sinais” é o termo característico de João para obras que apontam além de si mesmas para quem Jesus é; algumas traduções dizem “sinais milagrosos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quando
  rationale: Introduz a nova cena com valor temporal e leve continuidade narrativa, sem acrescentar um advérbio equivalente a “agora”, ausente do grego.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: ele estava em Jerusalém
  rationale: Expressão locativa direta e natural em português; o sujeito masculino é recuperado do contexto.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: por ocasião da Páscoa, durante a festa
  rationale: Mantém tanto a referência à Páscoa quanto sua caracterização como festa, evitando uma repetição pouco natural de “em”.
- source_word: πολλοὶ
  choice: muitos
  rationale: Reproduz de modo conciso o termo quantitativo, sem necessidade de explicitar “muitas pessoas”.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: creram no seu nome
  rationale: Preserva a formulação joanina com “nome”, que dirige a confiança à identidade revelada de Jesus, em vez de reduzi-la simplesmente a “creram nele”.
- source_word: θεωροῦντες
  choice: ao verem
  rationale: Expressa a ação concomitante de observar os sinais em português corrente; no contexto, também deixa perceptível a relação entre vê-los e crer.
- source_word: τὰ σημεῖα
  choice: os sinais
  rationale: Conserva o vocabulário característico de João para obras que apontam além de si mesmas, sem inserir no texto a explicação “milagrosos”.
- source_word: ἃ ἐποίει
  choice: que ele fazia
  rationale: O imperfeito grego descreve atividade em curso ou repetida no passado; “fazia” preserva esse aspecto com naturalidade.
theological_decisions:
- issue: Natureza da fé descrita por ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ no contexto joanino
  choice: Traduzir diretamente como “muitos creram no seu nome”, sem enfraquecer a afirmação neste versículo.
  alternative: “muitos demonstraram uma fé inicial ou superficial nele” ou “muitos professaram crer por causa dos milagres”
  rationale: O grego afirma que muitos creram no nome dele. O versículo seguinte qualificará narrativamente essa fé; antecipar essa avaliação aqui eliminaria a tensão intencional do texto.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase preserva o cenário festivo antes da ação principal. Os marcadores de nota foram ligados às expressões efetivamente explicadas: “nome” [a] e “sinais” [b].'
