  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: pt
  text: 'Seus discípulos se lembraram de que está escrito: “O zelo pela tua casa me consumirá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se lembraram
  rationale: O aoristo de μιμνῄσκομαι indica que os discípulos se recordaram; “se lembraram” é natural e direto no português atual.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: “Discípulos” é o equivalente neotestamentário estabelecido para μαθηταί, e o possessivo expressa αὐτοῦ com naturalidade.
- source_word: γεγραμμένον ἐστίν
  choice: está escrito
  rationale: Fórmula corrente para introduzir uma citação das Escrituras, preservando o valor resultante do perfeito sem rigidez artificial.
- source_word: ζῆλος
  choice: zelo
  rationale: Expressa dedicação intensa e preserva a ressonância tradicional da citação do Salmo 69:9.
- source_word: τοῦ οἴκου σου
  choice: pela tua casa
  rationale: “Casa” preserva a formulação da citação e sua alusão veterotestamentária; no contexto, refere-se ao templo. A preposição “por” com artigo, contraída em “pela”, comunica o objeto do zelo.
- source_word: καταφάγεταί
  choice: consumirá
  rationale: Mantém o futuro do grego de João e comunica de modo digno e idiomático a força figurada de “devorar/consumir”.
- source_word: με
  choice: me
  rationale: Reproduz diretamente o pronome objeto da fala citada.
theological_decisions:
- issue: Tempo futuro do verbo na citação do Salmo aplicada a Jesus
  choice: me consumirá
  alternative: me consumiu / tem me consumido
  rationale: O texto grego de João traz καταφάγεταί, forma futura. A tradução segue João sem harmonizá-lo com tradições textuais do Salmo 69:9 que apresentam sentido passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a formulação bíblica reconhecível “está escrito” e o paralelismo conciso da citação, sem arcaísmos desnecessários.
