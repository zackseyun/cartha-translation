  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: pt
  text: E, no terceiro dia, houve um casamento[a] em Caná da Galileia, e a mãe de Jesus estava ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festa de casamento”. O termo grego pode designar tanto o casamento quanto a celebração das núpcias.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva o conectivo que dá continuidade ao fluxo narrativo de João, sem acrescentar nuance interpretativa.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: no terceiro dia
  rationale: Expressa de modo natural em português o dativo temporal e mantém a referência cronológica específica do grego.
- source_word: γάμος
  choice: casamento
  rationale: É a forma corrente e abrangente em português; no contexto, pode designar tanto as núpcias quanto a celebração correspondente, ambiguidade registrada em nota.
- source_word: ἐγένετο
  choice: houve
  rationale: Introduz naturalmente a ocorrência do evento em português, preservando a simplicidade narrativa.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: em Caná da Galileia
  rationale: Mantém o topônimo e reflete de perto a construção genitiva grega, com formulação natural e tradicional em português.
- source_word: ἦν
  choice: estava
  rationale: O imperfeito fornece informação de fundo; “estava” é a forma locativa natural em português neste contexto.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: a mãe de Jesus
  rationale: Reproduz diretamente a relação genitiva e mantém o modo característico pelo qual a personagem é identificada no relato.
- source_word: ἐκεῖ
  choice: ali
  rationale: Traduz diretamente o advérbio locativo, apontando para o lugar recém-mencionado.
theological_decisions:
- issue: A expressão temporal “no terceiro dia”
  choice: Mantida como indicação cronológica, sem explicação teológica no texto.
  alternative: Explicitar uma possível alusão simbólica à ressurreição.
  rationale: Embora a expressão possa adquirir ressonâncias temáticas para alguns leitores, neste versículo ela funciona diretamente como marca temporal. A tradução preserva a formulação sem decidir sua eventual dimensão simbólica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade. Não se reproduziu uma nota inglesa redundante sobre “a mãe de Jesus”, pois o texto grego transmitido não apresenta aqui uma alternativa lexical ou textual que a justifique.
