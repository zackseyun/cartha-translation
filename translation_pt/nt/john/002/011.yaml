  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: pt
  text: Jesus fez isto como o início dos seus sinais, em Caná da Galileia, e revelou a sua glória; e os seus discípulos creram nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este foi o primeiro dos seus sinais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: fez isso
  rationale: Mantém o demonstrativo e o verbo amplo do grego sem acrescentar “milagre” ou antecipar “sinal” no lugar do pronome.
- source_word: ἀρχὴν τῶν σημείων
  choice: o início dos seus sinais
  rationale: Conserva o sentido literal de ἀρχή como “início” e indica, pelo contexto, que se trata dos sinais realizados por Jesus. A leitura ordinal permanece na nota.
- source_word: σημείων
  choice: sinais
  rationale: Preserva o vocabulário característico de João e a função reveladora desses atos, em vez de reduzi-los apenas a “milagres”.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: em Caná da Galileia
  rationale: Forma geográfica natural em português e próxima da construção grega.
- source_word: ἐφανέρωσεν
  choice: revelou
  rationale: Expressa de modo claro e atual a ideia de tornar visível ou conhecido.
- source_word: τὴν δόξαν αὐτοῦ
  choice: a sua glória
  rationale: Mantém “glória”, termo teologicamente importante no Evangelho de João.
- source_word: ἐπίστευσαν εἰς αὐτὸν
  choice: creram nele
  rationale: É a formulação portuguesa natural para a confiança dirigida pessoalmente a Jesus.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: os seus discípulos
  rationale: Tradução direta e idiomática do sintagma grego.
theological_decisions:
- issue: Terminologia joanina de σημεῖον
  choice: sinais
  alternative: milagres
  rationale: Em João, os atos apontam para a identidade e a glória de Jesus; “sinais” preserva essa dimensão reveladora sem interpretação excessiva.
- issue: Sentido de ἀρχὴν τῶν σημείων
  choice: o início dos seus sinais
  alternative: o primeiro dos seus sinais
  rationale: “Início” reflete diretamente ἀρχή e mantém o caráter inaugural do acontecimento; a formulação ordinal é legítima e foi preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A divisão em duas frases evita uma sequência coordenada pesada; “Assim” explicita apenas a relação narrativa natural entre o sinal realizado e a revelação da glória.
