  source_fidelity: 'O sentido básico está preservado: a transição temporal, a descida a Cafarnaum, os acompanhantes e a breve permanência correspondem ao grego. Contudo, a mudança de sujeito em «; e ficaram ali» fica elíptica e menos clara em português do que no original, cujo verbo plural distingue explicitamente o grupo de Jesus.'
  naturalness: «Não muitos dias» é um decalque pouco idiomático em português moderno. «Não ficaram ali muitos dias» preserva a formulação negativa do grego e soa natural. A repetição explícita de «eles» também torna clara a referência do plural.
  terminology: «Cafarnaum», «mãe», «irmãos», «discípulos» e «ficaram» são adequados. A nota sobre «irmãos» preserva corretamente a possibilidade lexical mais ampla sem decidir uma questão doutrinária.
  issues:
