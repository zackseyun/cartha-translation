    rationale: Após o verbo singular «desceu», o plural «ficaram» exige que o leitor recupere o grupo listado. O ponto e vírgula antes de «e» também não favorece uma leitura fluente. «Eles não ficaram» explicita o sujeito plural indicado por ἔμειναν.
  - severity: medium
    issue: «Não muitos dias» é pouco natural em português contemporâneo.
    rationale: Embora reflita formalmente οὐ πολλὰς ἡμέρας, a ordem idiomática em português é «não ficaram ali muitos dias», que mantém a negação e o sentido sem paráfrase excessiva.
