source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: pt
  text: Depois disso, ele desceu para Cafarnaum com sua mãe, seus irmãos[a] e seus discípulos. Eles não ficaram ali muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes” ou “seus familiares”; a palavra grega pode designar irmãos em sentido estrito ou, em alguns contextos, uma relação familiar mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal e preserva a força singular do demonstrativo.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva o sentido de movimento descendente, adequado ao deslocamento geográfico de Caná para Cafarnaum.
- source_word: εἰς Καφαρναοὺμ
  choice: para Cafarnaum
  rationale: É a construção idiomática em português para indicar uma cidade como destino.
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ
  choice: ele ... junto com sua mãe
  rationale: Mantém explícito o pronome grego e apresenta naturalmente o grupo que o acompanhava, sem acrescentar o nome de Maria, ausente do versículo.
- source_word: οἱ ἀδελφοὶ
  choice: seus irmãos
  rationale: O masculino plural ἀδελφοί significa mais diretamente irmãos do sexo masculino; a possibilidade contextual de parentesco mais amplo é preservada em nota.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seus discípulos
  rationale: Discípulos é o termo corrente e preserva a terminologia central do Evangelho para aprendizes e seguidores de Jesus.
- source_word: ἐκεῖ ἔμειναν
  choice: ficaram ali
  rationale: Forma natural em português para a permanência temporária do grupo; o plural do verbo grego é preservado.
- source_word: οὐ πολλὰς ἡμέρας
  choice: não muitos dias
  rationale: Reproduz de perto a expressão negativa do grego, em vez de convertê-la na paráfrase afirmativa 'apenas alguns dias'.
theological_decisions:
- issue: Relação familiar indicada por ἀδελφοί
  choice: irmãos
  alternative: parentes ou membros do mesmo grupo familiar
  rationale: O sentido lexical mais direto do masculino plural é 'irmãos'. Como o termo pode, em certos contextos, ter alcance familiar mais amplo e está ligado a debates teológicos posteriores, o texto principal mantém a forma mais direta e a nota registra a alternativa sem resolver a questão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação foi levemente ajustada com “junto com” e ponto e vírgula para evitar uma sequência pesada, sem alterar os participantes nem a progressão do original.
