  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: pt
  text: Mas o próprio Jesus não se entregava a eles[a], porque conhecia a todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega o mesmo verbo do versículo anterior: muitos “creram” em Jesus, mas Jesus não “se entregava” a eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Mas o próprio Jesus
  rationale: O pronome αὐτός é enfático e sustenta o contraste com os que creram nele no versículo anterior; δέ introduz a mudança adversativa.
- source_word: οὐκ ἐπίστευεν
  choice: não se confiava
  rationale: Com o pronome reflexivo e o dativo, πιστεύω tem aqui o sentido idiomático de confiar ou entregar a própria pessoa a alguém. O imperfeito é expresso naturalmente em português por “não se confiava”, preservando o aspecto contínuo ou habitual.
- source_word: αὑτὸν αὐτοῖς
  choice: se [...] a eles
  rationale: A construção reflexiva indica que Jesus não entregava nem confiava a si mesmo àquelas pessoas.
- source_word: διὰ τὸ
  choice: porque
  rationale: διά seguido de infinitivo articular expressa causa; “porque” é a forma causal mais natural no contexto.
- source_word: αὐτὸν γινώσκειν
  choice: conhecia
  rationale: A oração infinitiva é vertida de modo idiomático como oração finita. O verbo indica conhecimento ou compreensão das pessoas.
- source_word: πάντας
  choice: a todos
  rationale: O plural masculino substantivado refere-se genericamente a todas as pessoas. “A todos” é conciso, natural e mantém a abrangência do grego.
theological_decisions:
- issue: Relação lexical de πιστεύω entre João 2.23 e 2.24
  choice: Traduzir aqui como “não se confiava”, explicando em nota que o grego emprega o mesmo verbo traduzido por “crer” no versículo anterior.
  alternative: Repetir “crer” de forma literal ou usar apenas “não confiava neles”.
  rationale: A construção exige em português o sentido de confiar a si mesmo, mas a nota preserva o jogo verbal deliberado sem tornar o texto principal artificial.
- issue: Alcance de πάντας
  choice: “a todos”, com referência geral às pessoas.
  alternative: “todos os homens” ou “todas as pessoas”.
  rationale: A expressão mantém o alcance abrangente do texto sem restringi-lo a um grupo nem acrescentar uma formulação doutrinária mais forte que o original.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “O próprio Jesus” preserva a ênfase; “não se confiava” mantém o aspecto imperfeito e o sentido reflexivo, embora seja uma formulação ligeiramente menos comum.
