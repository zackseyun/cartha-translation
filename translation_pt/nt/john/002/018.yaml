  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: pt
  text: 'Então os judeus lhe responderam[a]: “Que sinal você nos mostra para fazer essas coisas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os líderes judeus” ou “os judeanos”. Em João, “os judeus” pode referir-se mais especificamente a um grupo representativo, sobretudo às autoridades da Judeia, conforme o contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν ... καὶ εἶπαν αὐτῷ
  choice: Então ... lhe perguntaram
  rationale: A construção semítica com dois verbos de fala introduz uma resposta em forma de pergunta. A formulação portuguesa evita o pouco natural “responderam e disseram”, sem perder a continuidade narrativa nem o destinatário.
- source_word: οὖν
  choice: Então
  rationale: Indica a continuação e a consequência narrativa da ação de Jesus no templo; “então” é claro e natural em português.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Mantém a designação explícita do grego sem restringi-la no texto principal a líderes ou habitantes da Judeia; a possível delimitação contextual é registrada em nota.
- source_word: Τί σημεῖον
  choice: Que sinal
  rationale: “Sinal” preserva a terminologia característica de João para uma obra que autentica e aponta para uma realidade além de si mesma.
- source_word: δεικνύεις ἡμῖν
  choice: você nos mostra
  rationale: Representa diretamente o presente de δείκνυμι e o dativo ἡμῖν em linguagem portuguesa corrente.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: para justificar que faça essas coisas
  rationale: No contexto, ὅτι liga a exigência de um sinal à autoridade implícita de Jesus para agir assim. A formulação explicita em português a função comprobatória do sinal, preservando “essas coisas” para o plural ταῦτα e o presente subjuntivo após “que”.
theological_decisions:
- issue: Referente de οἱ Ἰουδαῖοι no Evangelho de João
  choice: Manter “os judeus” no texto principal
  alternative: “os líderes judeus” ou “os judeanos”
  rationale: O contexto pode indicar um grupo representativo, especialmente autoridades da Judeia, mas o versículo não o especifica lexicalmente. A tradução conserva a abrangência formal e apresenta a possível delimitação em nota.
- issue: Natureza da exigência por um sinal
  choice: Expressar o sinal como justificação da autoridade para essas ações
  alternative: “já que você faz essas coisas” ou “para fazer essas coisas”
  rationale: A pergunta desafia Jesus a apresentar um sinal autenticador de sua autoridade. “Para justificar” torna essa relação inteligível sem transformar σημεῖον simplesmente em “prova” ou “milagre”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea e evita a duplicação pouco idiomática “responderam e disseram”.
