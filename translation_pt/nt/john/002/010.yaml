id: JHN.2.10
reference: John 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: pt
  text: 'E ele lhe disse: “Todos[a] servem primeiro o vinho bom e, quando já estão embriagados[b], o de qualidade inferior. Você, porém, guardou o vinho bom até agora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma expressão singular genérica, literalmente “toda pessoa” ou, tradicionalmente, “todo homem”; ela se refere às pessoas em geral, não somente aos homens.
    reason: cultural_note
  - marker: b
    text: Ou “quando ficam bêbados”. O verbo grego normalmente significa “embriagar-se”; algumas traduções suavizam a expressão como “quando já beberam bastante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: ele lhe disse
  rationale: O presente grego é um presente histórico; o pretérito é a forma narrativa mais natural em português, sem alterar a força da fala direta.
- source_word: Πᾶς ἄνθρωπος
  choice: Todos
  rationale: A expressão singular genérica refere-se às pessoas em geral. “Todos” comunica esse sentido de modo natural e inclusivo em português.
- source_word: πρῶτον
  choice: primeiro
  rationale: Expressa diretamente a sequência em que os vinhos são apresentados.
- source_word: τὸν καλὸν οἶνον
  choice: o vinho bom
  rationale: καλός indica aqui boa qualidade e contrasta com o vinho de qualidade inferior.
- source_word: τίθησιν
  choice: servem
  rationale: Embora o verbo signifique literalmente “pôr” ou “colocar”, no contexto de um banquete “servir” expressa naturalmente a apresentação do vinho aos convidados.
- source_word: ὅταν μεθυσθῶσιν
  choice: quando já estão embriagados
  rationale: Preserva o sentido comum de μεθύω, que indica embriaguez, e evita suavizar a afirmação para mero consumo abundante.
- source_word: τὸν ἐλάσσω
  choice: o de qualidade inferior
  rationale: O comparativo indica vinho inferior em qualidade; “vinho” permanece elíptico em português, como no grego, mas seu sentido é claro.
- source_word: τετήρηκας
  choice: guardou
  rationale: Expressa a ação concluída cujo resultado permanece até o momento da fala.
- source_word: ἕως ἄρτι
  choice: até agora
  rationale: É a forma portuguesa natural e precisa para o ponto presente da narrativa.
theological_decisions:
- issue: Sentido de μεθυσθῶσιν no contexto do milagre que envolve vinho
  choice: quando já estão embriagados
  alternative: quando já beberam bastante
  rationale: O verbo grego normalmente denota embriaguez. A tradução mantém a afirmação realista do mestre-sala sem transformá-la em aprovação moral da embriaguez nem atenuá-la por razões doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” preserva a referência singular direta de σύ e soa natural em português contemporâneo; o contraste é marcado por “porém”. Os marcadores de nota foram colocados junto às expressões que explicam.
