  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: pt
  text: A Páscoa dos judeus estava próxima[a], e Jesus subiu para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Páscoa dos judeanos”. Em João, Ἰουδαῖοι pode, em alguns contextos, significar “judeanos” em vez de “judeus”; aqui, porém, a expressão mais naturalmente identifica a festa judaica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: estava próxima
  rationale: Neste contexto, o advérbio indica proximidade temporal. A formulação é natural em português atual e concorda com «Páscoa».
- source_word: πάσχα
  choice: Páscoa
  rationale: É a designação portuguesa consagrada para a festa judaica referida no texto.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Aqui a expressão identifica a Páscoa como festa judaica; «dos judeus» é a leitura mais natural, sem eliminar em nota a alternativa lexical «dos judeanos».
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva tanto o movimento em direção à altitude de Jerusalém quanto a linguagem convencional de peregrinação à cidade.
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: Καὶ
  choice: e
  rationale: O primeiro καί funciona como ligação narrativa e pode permanecer implícito em português para evitar um início artificial; o segundo é vertido por «e», conectando naturalmente as orações.
theological_decisions:
- issue: Tradução de Ἰουδαῖοι em João
  choice: dos judeus
  alternative: dos judeanos
  rationale: Neste versículo, o termo caracteriza a Páscoa como festa judaica, e não parece designar especificamente um grupo regional ou polêmico. A alternativa é mantida em nota por causa da amplitude contextual do termo no Evangelho de João.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e o verbo «subiu» acompanham de perto o grego sem produzir linguagem artificial.
