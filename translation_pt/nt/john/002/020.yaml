id: JHN.2.20
reference: John 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: pt
  text: 'Então os judeus disseram[a]: “Este templo foi construído em quarenta e seis anos, e você vai erguê-lo[b] em três dias?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos”. O grego diz “os judeus”, expressão que João emprega de maneiras variadas conforme o contexto.
    reason: alternative_reading
  - marker: b
    text: Ou “vai reconstruí-lo”. Os interlocutores podem entender o verbo grego no sentido de construção, mas “erguê-lo” preserva a formulação que João relaciona depois à ressurreição de Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Então
  rationale: Marca a consequência da declaração anterior de Jesus de modo natural em português, sem tornar a ligação mais formal ou estritamente lógica do que o contexto exige.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Reproduz a expressão grega sem restringir seus referentes a líderes ou autoridades, especificidade que o versículo não explicita. A possível leitura geográfica é registrada em nota.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: em quarenta e seis anos
  rationale: Expressa o período no qual a construção ocorreu e preserva de perto o dativo temporal grego.
- source_word: οἰκοδομήθη
  choice: foi construído
  rationale: Representa diretamente o aoristo passivo como uma afirmação resumida sobre a construção, sem introduzir a ideia não explícita de que a obra ainda continuava.
- source_word: ὁ ναὸς οὗτος
  choice: este templo
  rationale: Embora ναός possa designar mais precisamente o santuário, “templo” é claro, natural e adequado ao contexto para leitores comuns.
- source_word: καὶ σὺ
  choice: e você vai
  rationale: O pronome grego é enfático. A formulação portuguesa, no contexto da pergunta retórica, comunica naturalmente a incredulidade dirigida a Jesus.
- source_word: ἐν τρισὶν ἡμέραις
  choice: em três dias
  rationale: É a expressão temporal portuguesa mais natural e mantém a formulação que prepara a explicação sobre a ressurreição nos versículos seguintes.
- source_word: ἐγερεῖς
  choice: vai erguê-lo
  rationale: “Erguer” pode ser entendido no sentido de levantar uma construção e também conserva a linguagem de levantar, importante para a ironia e a associação posterior com a ressurreição. “Reconstruir” resolveria cedo demais o sentido conforme a compreensão dos interlocutores.
- source_word: αὐτόν
  choice: -lo
  rationale: O pronome retoma “templo” de maneira idiomática em português.
theological_decisions:
- issue: Possível generalização antijudaica de οἱ Ἰουδαῖοι no Evangelho de João
  choice: Manter “os judeus” no texto principal, com nota explicativa
  alternative: “os judeanos” ou “os líderes judeus”
  rationale: A tradução preserva a expressão do texto grego e evita identificar o grupo com todos os judeus ou restringi-lo a líderes sem indicação explícita neste versículo.
- issue: Relação de ἐγερεῖς com a linguagem da ressurreição
  choice: Traduzir por “vai erguê-lo”
  alternative: “vai reconstruí-lo”
  rationale: A escolha mantém a tensão entre a compreensão dos interlocutores, voltada ao edifício, e a explicação posterior do evangelista, voltada ao corpo e à ressurreição de Jesus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a pergunta incrédula dos interlocutores e evita vocabulário técnico. As aspas marcam a fala direta; todos os marcadores de nota aparecem no texto principal junto ao trecho pertinente.
