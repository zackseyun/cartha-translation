  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: pt
  text: Se vocês me amam, guardarão os meus mandamentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedecerão aos meus mandamentos”. O verbo pode significar guardar, observar, conservar ou obedecer; “guardarão” preserva o sentido mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Se
  rationale: Introduz uma condição; “se” é a forma natural em português e não acrescenta a ideia iterativa de “sempre que”.
- source_word: ἀγαπᾶτέ
  choice: vocês me amam
  rationale: O presente do subjuntivo depois de ἐάν é expresso naturalmente pela construção condicional “se vocês me amam”; “vocês” torna explícito o plural sem recorrer a uma forma regional.
- source_word: με
  choice: me
  rationale: Pronome objeto direto referente a Jesus.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: os meus mandamentos
  rationale: Preserva o peso de ἐντολάς e expressa de modo natural a construção possessiva enfática; a ordem “os meus” mantém uma ênfase discreta na pertença a Jesus.
- source_word: τηρήσετε
  choice: guardarão
  rationale: Mantém o futuro do indicativo e o campo semântico amplo de τηρέω, que pode envolver guardar, observar, conservar e obedecer.
theological_decisions:
- issue: Se τηρήσετε deve ser traduzido como ordem ou como declaração futura
  choice: 'declaração futura: “guardarão”'
  alternative: 'sentido imperativo: “guardem os meus mandamentos”'
  rationale: A forma grega é futuro do indicativo, não imperativo. A tradução preserva a tensão entre condição, resultado e compromisso, sem transformar a frase numa ordem direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” evita regionalismo; “mandamentos” mantém o peso e a linguagem joanina reconhecível.
