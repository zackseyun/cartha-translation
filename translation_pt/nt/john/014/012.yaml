source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: pt
  text: 'Em verdade, em verdade lhes digo: quem crê em mim também fará as obras que eu faço e fará obras maiores do que estas,[a] porque eu vou para o Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “maiores do que estas”; o substantivo é elíptico. “Obras” é retomado da oração anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Em verdade, em verdade
  rationale: Preserva a repetição enfática e solene da fórmula de Jesus em português natural e transparente.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: quem crê em mim
  rationale: Expressa naturalmente o particípio substantivado de sentido genérico, sem restringi-lo ao gênero gramatical masculino.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Mantém o vocabulário joanino e sua ligação com os atos e sinais de Jesus ao longo do Evangelho.
- source_word: ἃ ἐγὼ ποιῶ
  choice: que eu faço
  rationale: O presente simples reproduz de modo idiomático o presente grego, sem acentuar indevidamente o aspecto progressivo.
- source_word: κἀκεῖνος ποιήσει
  choice: também fará
  rationale: Transmite tanto a referência ao crente mencionado quanto a força aditiva de κἀκεῖνος.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: e fará obras maiores do que estas
  rationale: Repõe em português o substantivo 'obras', elíptico no grego mas recuperável da oração anterior, produzindo uma comparação clara sem definir em que sentido são maiores.
- source_word: ὅτι
  choice: porque
  rationale: Explicita adequadamente a relação causal apresentada pelo grego.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: eu vou para o Pai
  rationale: Representa o presente com sentido de futuro próximo e conserva 'o Pai', sem acrescentar o possessivo ausente no texto grego.
theological_decisions:
- issue: Sentido de “obras maiores”
  choice: 'A formulação permanece ampla: quem crê fará obras maiores do que as mencionadas, em conexão causal com a ida de Jesus para o Pai.'
  alternative: Interpretar explicitamente “maiores” como maior alcance missionário, maior importância histórico-redentora ou atuação da igreja capacitada pelo Espírito.
  rationale: O versículo não especifica em que aspecto as obras serão maiores. A tradução preserva essa tensão e não introduz uma explicação doutrinária particular.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Lhes digo” conserva o plural de ὑμῖν; “quem crê” comunica naturalmente a referência genérica do masculino singular grego.
