id: JHN.14.2
reference: John 14:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: pt
  text: Na casa de meu Pai há muitos lugares para morar.[a] Se não fosse assim, eu teria dito a vocês que vou preparar um lugar para vocês?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muitas moradas” ou “muitos quartos”. A palavra grega indica lugares onde se fica ou mora e se relaciona com o tema de permanecer neste capítulo.'
    reason: lexical_alternative
  - marker: b
    text: 'Também é possível pontuar como uma declaração: “Se não fosse assim, eu teria dito a vocês, pois vou preparar um lugar para vocês.” A construção grega admite mais de uma divisão e pontuação das orações.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: casa
  rationale: “Casa” preserva a imagem concreta e a expressão joanina natural “casa de meu Pai”, sem interpretar o termo como “família” ou “casa paterna”.
- source_word: πατρός μου
  choice: meu Pai
  rationale: A construção “de meu Pai” reproduz de modo idiomático o genitivo grego e identifica Deus como o Pai na fala de Jesus.
- source_word: μοναὶ πολλαί
  choice: muitos lugares para morar
  rationale: μονή designa lugar de permanência ou morada. A formulação é clara em português moderno, não restringe indevidamente o sentido a cômodos e mantém a ideia de habitar ou permanecer.
- source_word: εἰ δὲ μή
  choice: Se não fosse assim
  rationale: Explicita de maneira natural a condição implícita no idioma grego.
- source_word: εἶπον ἂν ὑμῖν
  choice: eu teria dito a vocês?
  rationale: O aoristo com ἄν é expresso naturalmente pelo condicional composto; a pontuação interrogativa adota a leitura retórica sem ocultar a alternativa em nota.
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo do que Jesus teria dito. A possibilidade de valor causal está ligada à leitura alternativa da pontuação, registrada em nota.
- source_word: πορεύομαι
  choice: vou
  rationale: O presente grego tem força imediata e prospectiva no contexto; “vou” é natural e conciso em português.
- source_word: ἑτοιμάσαι
  choice: preparar
  rationale: O infinitivo indica propósito, adequadamente expresso por “preparar”.
- source_word: τόπον
  choice: um lugar
  rationale: Mantém a amplitude de τόπος e evita estreitá-lo a “quarto” ou “cômodo”.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa o dativo de benefício e torna explícito, em português de ampla compreensão, que o pronome está no plural.
theological_decisions:
- issue: Tradução de μονή e a imagem escatológica
  choice: muitos lugares para morar
  alternative: muitas moradas; muitos quartos
  rationale: “Lugares para morar” comunica o sentido de permanência sem importar a noção moderna de mansões nem afirmar uma disposição arquitetônica específica. “Moradas” é possível e conserva melhor a repetição lexical com João 14:23, mas soa menos corrente para parte do público.
- issue: Pontuação e força da segunda oração
  choice: 'pergunta retórica: “Se não fosse assim, eu teria dito a vocês que vou preparar um lugar para vocês?”'
  alternative: 'declaração: “Se não fosse assim, eu teria dito a vocês, pois vou preparar um lugar para vocês.”'
  rationale: O texto grego antigo não traz a pontuação original, e a sintaxe admite ambas as construções. A pergunta retórica se encaixa bem no fluxo, enquanto a leitura declarativa é preservada em nota para não eliminar a ambiguidade real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A vocês” explicita o plural; “lugares para morar” privilegia clareza corrente sem restringir a imagem a quartos nem recorrer ao tradicional “mansões”.
