id: JHN.14.31
reference: John 14:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: pt
  text: Mas, para que o mundo saiba que amo o Pai, faço exatamente como o Pai me ordenou.[a] Levantem-se; vamos sair daqui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim como o Pai me ordenou, assim faço.”'
    reason: Preserva como alternativa a estrutura correlativa explícita de καθὼς ... οὕτως.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mas
  rationale: Preserva a força adversativa que liga a declaração ao contexto anterior e soa natural em português.
- source_word: ἵνα γνῷ
  choice: para que ... saiba
  rationale: Expressa de modo claro a finalidade indicada por ἵνα com o subjuntivo aoristo.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Mantém a dicção característica de João e o sentido coletivo da humanidade, sem explicitação interpretativa.
- source_word: ἀγαπῶ
  choice: amo
  rationale: O presente simples comunica naturalmente a ação contínua ou característica no contexto.
- source_word: τὸν πατέρα
  choice: o Pai
  rationale: Conserva o título com artigo e não acrescenta o possessivo ausente no grego.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: faço exatamente como o Pai me ordenou
  rationale: Reproduz em português natural a correspondência enfática de καθὼς ... οὕτως e preserva a força de ordem de ἐντέλλομαι.
- source_word: Ἐγείρεσθε
  choice: Levantem-se
  rationale: Imperativo plural claro e atual, apropriado ao chamado dirigido aos discípulos.
- source_word: ἄγωμεν
  choice: vamos sair
  rationale: Traduz naturalmente o subjuntivo exortativo na primeira pessoa do plural; em combinação com ἐντεῦθεν, indica partida.
- source_word: ἐντεῦθεν
  choice: daqui
  rationale: Indica diretamente a saída do lugar presente.
theological_decisions:
- issue: Título relacional πατήρ na cristologia joanina
  choice: o Pai
  alternative: meu Pai
  rationale: Mantém a formulação grega sem inserir um possessivo, preservando a relação entre Jesus e o Pai conforme expressa no texto.
- issue: Força de ἐντέλλομαι na relação entre o Pai e o Filho
  choice: me ordenou
  alternative: me instruiu
  rationale: Preserva a força lexical de ordem ou incumbência e a ênfase textual na obediência de Jesus, sem suavização motivada por pressupostos doutrinários.
- issue: Relação sintática entre a finalidade e a obediência de Jesus
  choice: A ação obediente de Jesus é apresentada como o meio pelo qual o mundo saberá que ele ama o Pai
  alternative: 'A oração pode ser mantida em estrutura coordenada: “e, assim como o Pai me ordenou, assim faço”'
  rationale: A redação principal comunica com naturalidade a ligação contextual entre amor e obediência; a nota conserva a estrutura mais formal e a possível tensão sintática do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Levantem-se” deixa claro o plural; “vamos sair daqui” é mais idiomático do que uma reprodução rígida de “vamos daqui”.
