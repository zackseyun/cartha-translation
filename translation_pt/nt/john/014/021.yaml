  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: pt
  text: Aquele que tem os meus mandamentos e os guarda, esse é o que me ama.[a] E aquele que me ama será amado por meu Pai; eu também o amarei e me revelarei a ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem tem os meus mandamentos e os guarda, esse é quem me ama”. O grego emprega formas masculinas no singular com sentido representativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me mostrarei a ele”. O verbo grego pode indicar tornar-se conhecido ou visível; neste contexto, provavelmente ressalta a revelação pessoal de Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Aquele que tem
  rationale: O artigo com o particípio presente funciona de modo substantivado e descreve um indivíduo representativo. A formulação conserva a estrutura e a força genérica do grego em português natural.
- source_word: ἐντολάς
  choice: mandamentos
  rationale: Mantém a força autoritativa de ἐντολή e corresponde bem ao uso joanino.
- source_word: τηρῶν
  choice: guarda
  rationale: Em João, τηρέω abrange guardar, observar e manter-se fiel. “Guarda” preserva essa amplitude melhor que uma formulação exclusivamente centrada em executar ordens.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: esse é o que me ama
  rationale: O demonstrativo ἐκεῖνος dá ênfase à identificação. “Esse é” conserva essa força sem tornar a frase artificial.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: ama / será amado / amarei
  rationale: A repetição da mesma família lexical reproduz a repetição intencional de ἀγαπάω e preserva seu peso teológico.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: E aquele que me ama
  rationale: δέ tem aqui valor levemente conectivo, e não fortemente adversativo; “E” expressa naturalmente a progressão.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: será amado por meu Pai
  rationale: Traduz diretamente o futuro passivo e conserva a linguagem filial central ao contexto.
- source_word: κἀγὼ
  choice: eu também
  rationale: 'κἀγώ equivale a καὶ ἐγώ. “Eu também” torna explícita a força aditiva: à ação do Pai corresponde a ação de Jesus.'
- source_word: ἐμφανίσω
  choice: me revelarei
  rationale: ἐμφανίζω pode significar tornar visível, manifestar ou dar-se a conhecer. “Me revelarei” comunica autodesvelamento pessoal sem restringir a referência a uma aparição física.
- source_word: ἐμαυτόν
  choice: me
  rationale: Na construção reflexiva portuguesa “me revelarei”, o pronome indica que é o próprio Jesus quem se dá a conhecer.
- source_word: αὐτὸν / αὐτῷ
  choice: o / a ele
  rationale: Os pronomes retomam o indivíduo representativo expresso no masculino singular. A forma portuguesa preserva essa concordância, enquanto a nota esclarece o alcance genérico.
theological_decisions:
- issue: Relação entre amor e obediência
  choice: A sintaxe identifica quem ama Jesus como aquele que tem e guarda seus mandamentos, sem acrescentar linguagem causal ou meritória.
  alternative: A obediência prova o amor; a obediência conquista o amor divino.
  rationale: O grego apresenta uma identificação e depois afirma o amor do Pai e de Jesus por essa pessoa. A tradução mantém a ligação estreita entre amor e observância, sem definir que o amor divino seja merecido.
- issue: Natureza da autorrevelação de Jesus
  choice: me revelarei a ele
  alternative: me mostrarei a ele
  rationale: O contexto admite autocomunicação ou manifestação pessoal, não necessariamente apenas visão física. “Revelarei” preserva essa amplitude sem eliminar a possibilidade de manifestação.
- issue: Masculino singular representativo
  choice: aquele / o / a ele, com esclarecimento em nota
  alternative: quem / essa pessoa
  rationale: A tradução principal conserva o masculino singular gramatical do grego, enquanto a nota explicita que sua referência é representativa e não limitada aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Guarda” mantém a ressonância joanina tradicional sem soar arcaico; o ponto e vírgula evita uma sequência excessiva de coordenações. Todos os marcadores de nota aparecem no texto principal.
