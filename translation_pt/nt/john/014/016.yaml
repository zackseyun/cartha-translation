id: JHN.14.16
reference: John 14:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: pt
  text: E eu pedirei ao Pai, e ele dará a vocês outro Defensor[a], para que ele esteja com vocês para sempre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Auxiliador”, “Conselheiro” ou, tradicionalmente, “Consolador”; o termo grego παράκλητος pode transmitir esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: E eu
  rationale: A crase de καί + ἐγώ liga a frase ao contexto e dá leve ênfase ao sujeito, sem exigir uma ampliação como “eu mesmo”.
- source_word: ἐρωτήσω
  choice: pedirei
  rationale: O futuro de ἐρωτάω expressa aqui um pedido dirigido ao Pai. “Pedirei” é natural e evita o tom arcaico ou potencialmente técnico de “rogarei”.
- source_word: τὸν πατέρα
  choice: ao Pai
  rationale: Mantém o artigo e o uso joanino sem acrescentar o possessivo “meu”, ausente no grego.
- source_word: ἄλλον
  choice: outro
  rationale: Preserva o sentido simples de ἄλλος, distinguindo o prometido de alguém já presente, sem explicitar no texto uma relação interpretativa adicional.
- source_word: παράκλητον
  choice: Defensor
  rationale: O termo é semanticamente amplo. “Defensor” conserva sua dimensão pessoal, representativa e forense no uso joanino, enquanto outras possibilidades são registradas em nota.
- source_word: δώσει ὑμῖν
  choice: ele dará a vocês
  rationale: Representa de modo claro o futuro ativo e o objeto indireto, em português moderno de ampla compreensão.
- source_word: ἵνα ᾖ
  choice: para que esteja
  rationale: A construção com ἵνα e subjuntivo comunica finalidade ou resultado; “para que esteja” preserva essa nuance naturalmente.
- source_word: μεθ’ ὑμῶν
  choice: com vocês
  rationale: Μετά com genitivo significa “com”. “Com vocês” é direto e amplamente compreensível em português, com boa legibilidade brasileira.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Traduz idiomaticamente a expressão de duração permanente no contexto joanino, evitando o literalismo pouco natural de “para a era”.
theological_decisions:
- issue: Tradução de παράκλητος em contexto trinitário
  choice: Defensor
  alternative: Auxiliador, Conselheiro ou, tradicionalmente, Consolador
  rationale: “Defensor” mantém a pessoa e a atuação representativa daquele que Jesus promete como “outro”, sem reduzir sua função a simples ajuda nem definir além do que o termo permite. Como nenhuma palavra portuguesa abrange todo o campo semântico, as alternativas relevantes ficam na nota.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. Emprega “vocês” como plural claro e corrente. A vírgula final foi mantida porque o versículo integra uma frase que continua no contexto imediato.
