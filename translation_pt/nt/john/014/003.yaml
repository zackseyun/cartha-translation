reference: John 14:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: pt
  text: E, se eu for e preparar um lugar para vocês, venho outra vez[a][b] e os levarei para junto de mim, para que, onde eu estou, vocês também estejam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “virei outra vez”. O grego emprega um verbo na forma presente (“venho”) com sentido futuro.'
    reason: lexical_alternative
  - marker: b
    text: Há diferentes interpretações sobre se “venho outra vez” se refere especificamente à volta final de Jesus, às suas aparições depois da ressurreição, à vinda do Espírito ou a uma promessa com mais de um nível de cumprimento.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: se eu for
  rationale: A construção com ἐάν e o aoristo do subjuntivo introduz uma condição futura. “Se eu for” é direta, natural e não acrescenta ao verbo a ideia interpretativa de partida definitiva.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: preparar um lugar para vocês
  rationale: Mantém os sentidos comuns de ἑτοιμάζω (“preparar”) e τόπος (“lugar”), sem definir além do texto a natureza desse lugar.
- source_word: πάλιν ἔρχομαι
  choice: venho outra vez
  rationale: Preserva a forma verbal presente do grego e sua vivacidade, embora o contexto lhe dê referência futura. “Outra vez” expressa πάλιν de modo claro e corrente.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: os levarei para junto de mim
  rationale: Comunica tanto o ato futuro de tomar os discípulos consigo quanto a força relacional e direcional de πρὸς ἐμαυτόν. O pronome “os” retoma naturalmente “vocês” no português brasileiro corrente.
- source_word: ἵνα
  choice: para que
  rationale: Introduz naturalmente a finalidade expressa por ἵνα e combina com o subjuntivo português.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: onde eu estou
  rationale: Traduz de modo direto a cláusula, mantendo o pronome explícito “eu”, que reflete a presença enfática de ἐγώ sem recorrer a uma formulação artificial.
- source_word: καὶ ὑμεῖς ἦτε
  choice: vocês também estejam
  rationale: O subjuntivo “estejam” corresponde à oração final introduzida por ἵνα; “também” representa καί e mantém o paralelo entre a presença de Jesus e a dos discípulos.
theological_decisions:
- issue: Natureza da vinda prometida por Jesus em πάλιν ἔρχομαι
  choice: A promessa é apresentada com orientação futura — “venho outra vez” — sem especificar seu modo ou momento exato.
  alternative: Entendê-la especificamente como as aparições após a ressurreição, a vinda do Espírito, a volta final de Jesus ou uma promessa com mais de um nível de cumprimento.
  rationale: O versículo promete a renovação da presença de Jesus e que ele levará os discípulos para junto de si, mas não identifica explicitamente nesta frase uma única modalidade de vinda. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” oferece clareza internacional razoável e naturalidade no Brasil; a colocação “os levarei” evita a forma regional “levarei vocês” sem recorrer ao pouco corrente “vos levarei”. A ordem das orações acompanha de perto o grego, mas permanece idiomática.
