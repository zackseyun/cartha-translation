id: JHN.14.24
reference: John 14:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: pt
  text: Quem não me ama não guarda as minhas palavras. E a palavra que vocês ouvem não é minha, mas pertence ao Pai que me enviou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Quem não me ama
  rationale: O particípio presente substantivado tem sentido genérico. “Quem não me ama” é natural em português e preserva a caracterização contínua, sem tornar a frase pesada.
- source_word: τοὺς λόγους μου
  choice: as minhas palavras
  rationale: Mantém o plural do grego e a ligação com os ensinamentos proferidos por Jesus. “Aquilo que digo” seria mais interpretativo.
- source_word: τηρεῖ
  choice: guarda
  rationale: No uso joanino, τηρέω abrange observar, obedecer e conservar fielmente. “Guarda” preserva essa amplitude melhor que a opção mais estreita “obedece”.
- source_word: ὁ λόγος
  choice: a palavra
  rationale: Mantém o singular e a dicção característica de João, podendo designar o ensino ou mensagem como um todo sem eliminar a ressonância lexical de λόγος.
- source_word: ὃν ἀκούετε
  choice: que vocês ouvem
  rationale: Reproduz naturalmente o presente grego e não acrescenta “de mim”, que está implícito no contexto, mas não expresso na oração relativa.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: não é minha
  rationale: É a correspondência direta e natural do predicativo ἐμός, preservando a formulação de origem ou pertencimento que a continuação esclarece.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: mas pertence ao Pai que me enviou
  rationale: Explicita de modo natural o valor possessivo ou de origem do genitivo grego e permite que “que me enviou” modifique claramente “Pai”.
- source_word: πέμψαντός
  choice: que me enviou
  rationale: O aoristo participial é adequadamente expresso pelo pretérito perfeito simples e preserva a fórmula joanina sobre o Pai que enviou Jesus.
theological_decisions:
- issue: Relação entre a palavra de Jesus e a do Pai
  choice: “não é minha, mas pertence ao Pai que me enviou”
  alternative: “não vem de mim, mas do Pai que me enviou”
  rationale: A redação conserva a distinção entre Jesus e o Pai e, ao mesmo tempo, a unidade da mensagem. Não explica além do texto em que sentido a palavra não é “minha”, preservando a tensão entre pertencimento, origem e missão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação evita literalismo artificial, mas conserva “palavras”, “guarda” e “palavra” para manter as relações lexicais do texto joanino.
