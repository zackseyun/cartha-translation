id: JHN.14.27
reference: John 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: pt
  text: Deixo com vocês a paz; a minha paz lhes dou. Não a dou como o mundo dá. Que o coração de vocês não fique perturbado, nem perca a coragem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nem fique com medo” ou “nem se amedronte”. O verbo grego transmite a ideia de tornar-se medroso ou perder a coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: a paz
  rationale: “Paz” é o equivalente corrente e preserva a amplitude do termo, que neste contexto pode incluir mais que ausência de conflito sem restringi-lo a uma única nuance.
- source_word: ἀφίημι
  choice: Deixo
  rationale: O presente indicativo com “paz” como objeto é expresso naturalmente por “deixo”; evita a interpretação mais específica de “deixo como herança”.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: a minha paz
  rationale: A ordem com artigo e possessivo dá destaque à paz que pertence a Jesus; “a minha paz” reproduz essa ênfase de modo natural em português.
- source_word: δίδωμι
  choice: dou
  rationale: O presente simples mantém a repetição verbal e o contraste entre o modo de Jesus dar e o modo do mundo.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: Não a dou como o mundo dá
  rationale: A formulação conserva a comparação explícita e usa o pronome “a” para retomar naturalmente “a minha paz”, sem alterar o sentido.
- source_word: κόσμος
  choice: o mundo
  rationale: É a tradução tradicional e abrangente, preservando as ressonâncias joaninas sem limitar o termo a “sociedade humana” ou “ordem mundial”.
- source_word: μὴ ταρασσέσθω
  choice: não fique perturbado
  rationale: Expressa o imperativo passivo e mantém o vocabulário em harmonia com João 14:1, em linguagem portuguesa corrente.
- source_word: ὑμῶν ἡ καρδία
  choice: o coração de vocês
  rationale: Preserva o singular coletivo grego, ao mesmo tempo que deixa claro que Jesus se dirige a várias pessoas.
- source_word: μηδὲ δειλιάτω
  choice: nem perca a coragem
  rationale: O verbo δειλιάω indica tornar-se medroso ou ceder ao medo. “Perca a coragem” distingue esta ideia de “ficar perturbado” e evita a carga moral excessiva de “ser covarde”.
theological_decisions:
- issue: Natureza da paz dada por Jesus
  choice: Manter simplesmente “a paz” e “a minha paz”.
  alternative: Explicitar como tranquilidade interior, plenitude escatológica ou reconciliação com Deus.
  rationale: O versículo não define a paz de modo estreito. A formulação ampla preserva sua riqueza teológica e evita impor uma interpretação exclusiva.
- issue: Sentido de δειλιάω
  choice: Traduzir por “perca a coragem”, com alternativas em nota.
  alternative: “Fique com medo”, “se amedronte” ou “seja covarde”.
  rationale: A escolha comunica o efeito do medo sem transformar a ordem em acusação moral; a nota preserva as demais possibilidades lexicais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês/lhes” evita regionalismo excessivo; a ordem das frases conserva o paralelismo e a solenidade do original sem soar artificial.
