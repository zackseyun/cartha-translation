id: JHN.14.7
reference: John 14:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: pt
  text: Se vocês tivessem me conhecido, também teriam conhecido meu Pai. De agora em diante, vocês o conhecem e o viram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: tivessem conhecido / conhecem
  rationale: Mantém a repetição lexical do verbo grego γινώσκω e expressa naturalmente, em português, o período condicional e a afirmação presente.
- source_word: ᾔδειτε
  choice: teriam conhecido
  rationale: Embora venha de οἶδα, neste contexto é semanticamente próximo de γινώσκω; a repetição de 'conhecido' preserva a ligação retórica entre conhecer Jesus e conhecer o Pai.
- source_word: ἑωράκατε
  choice: têm visto
  rationale: O perfeito grego indica uma experiência de visão com relevância presente; 'têm visto' conserva esse aspecto sem explicar além do texto.
- source_word: ἀπ’ ἄρτι
  choice: Desde agora
  rationale: Reproduz a referência temporal prospectiva e enfática da expressão grega de modo claro e digno.
theological_decisions:
- issue: Relação entre conhecer e ver Jesus e conhecer e ver o Pai
  choice: Preservar literalmente a afirmação de que os discípulos conhecem e têm visto o Pai
  alternative: Explicitar que conhecem ou veem o Pai por meio de Jesus
  rationale: O versículo não explicita aqui o mecanismo; a tradução mantém a tensão cristológica e deixa que o contexto imediato a desenvolva.
- issue: Força afirmativa de γινώσκετε
  choice: vocês o conhecem
  alternative: vocês passarão a conhecê-lo
  rationale: A forma grega é presente do indicativo e a tradição textual adotada pelo SBLGNT sustenta a afirmação presente, não um futuro.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para o plural e 'meu Pai' para conservar a formulação relacional do original. A construção 'Se vocês tivessem... teriam...' é idiomática e mantém o valor contrafactual provável da frase.
