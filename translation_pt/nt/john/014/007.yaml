  source_fidelity: A oração condicional e a afirmação presente estão bem refletidas. Contudo, «o têm visto» não é uma forma natural nem adequada para o perfeito grego ἑωράκατε neste contexto; em português, «o viram» expressa a visão já ocorrida com seu efeito presente, sem introduzir uma perífrase aspectual artificial.
  naturalness: «Desde agora» é compreensível, mas «De agora em diante» é a formulação moderna mais idiomática para ἀπ’ ἄρτι. «Vocês o viram» é natural em português brasileiro e amplamente compreensível internacionalmente.
  terminology: «meu Pai» preserva corretamente a relação expressa por τὸν πατέρα μου. «Conhecer» mantém a ligação retórica entre ἐγνώκειτε/γινώσκετε e é apropriado também para ᾔδειτε no paralelismo.
