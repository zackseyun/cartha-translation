source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: pt
  text: 'Creiam em mim: eu estou no Pai, e o Pai está em mim. Se não, creiam por causa das próprias obras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Se não, creiam por causa das obras em si». O último «creiam» não tem objeto explícito no grego; as próprias obras são apresentadas como fundamento suficiente para crer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Creiam em mim
  rationale: O imperativo de πιστεύω com o dativo μοι significa naturalmente crer em quem fala ou no que ele diz. Em português, «creiam em mim» é direto e idiomático, sem ampliar para «confiem» nem explicitar «no que digo».
- source_word: ὅτι
  choice: ':'
  rationale: Aqui ὅτι introduz o conteúdo a ser crido. Em português, os dois-pontos apresentam esse conteúdo com mais naturalidade do que a construção potencialmente ambígua «creiam em mim que...».
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: eu estou no Pai, e o Pai está em mim
  rationale: Mantém a linguagem joanina de habitação mútua e a repetição de «em», sem substituí-la por uma paráfrase doutrinária como «somos um».
- source_word: εἰ δὲ μή
  choice: Se não
  rationale: 'Preserva de modo conciso a alternativa condicional: caso o apelo anterior não seja aceito. A elipse e sua amplitude permanecem visíveis.'
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: por causa das próprias obras
  rationale: διά com acusativo indica fundamento ou razão, e αὐτά dá ênfase às obras. «As próprias obras» preserva essa força sem acrescentar a ideia mais exclusiva de «somente».
- source_word: πιστεύετε
  choice: creiam
  rationale: O segundo imperativo não tem objeto expresso. A tradução também o deixa absoluto, evitando acrescentar «em mim» ou «nisso».
theological_decisions:
- issue: Habitação mútua do Filho e do Pai
  choice: Preservar «eu estou no Pai, e o Pai está em mim».
  alternative: «Eu e o Pai somos um» ou «estou unido ao Pai».
  rationale: A formulação literal conserva tanto a profunda unidade relacional quanto a linguagem específica do texto, sem trocar a afirmação por uma síntese doutrinária.
- issue: Fundamento da fé nas obras
  choice: Deixar o segundo «creiam» sem objeto explícito e apresentar as obras como fundamento.
  alternative: «Creiam em mim por causa das obras» ou «creiam nisso por causa das obras».
  rationale: O grego não explicita o objeto do segundo πιστεύετε. Manter essa abertura preserva a concisão e a ambiguidade genuína da frase.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. «Creiam» conserva o plural dirigido aos discípulos; os dois-pontos evitam uma construção pouco natural com «que». O marcador [a] aparece no texto principal.
