  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: pt
  text: Não deixarei vocês como órfãos[a]; estou vindo até vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não deixarei vocês órfãos». A imagem grega é a de filhos deixados sem o cuidado dos pais.'
    reason: lexical_alternative
  - marker: b
    text: «Estou vindo até vocês» pode se referir à vinda de Jesus depois da ressurreição, à sua vinda por meio do Espírito Santo ou à sua vinda futura; a expressão grega, por si só, não determina uma única referência.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: deixarei
  rationale: O futuro de ἀφίημι tem aqui o sentido de deixar alguém para trás; «deixarei» é natural e mantém a ligação direta com «como órfãos».
- source_word: ὀρφανούς
  choice: como órfãos
  rationale: Preserva a imagem concreta de filhos privados do cuidado dos pais, sem reduzi-la a mero abandono emocional.
- source_word: ἔρχομαι
  choice: estou voltando
  rationale: O presente grego tem força iminente ou vívida. No contexto de uma despedida, «estou voltando» expressa naturalmente a vinda de Jesus para junto dos discípulos, embora «estou vindo» seja uma tradução mais estritamente formal.
- source_word: πρὸς ὑμᾶς
  choice: para vocês
  rationale: πρός com acusativo indica movimento em direção a pessoas; «para vocês» é corrente e claro em português.
- source_word: Οὐκ
  choice: não
  rationale: Negação simples do verbo no futuro, expressa naturalmente por «não deixarei».
theological_decisions:
- issue: Referente e momento de «estou voltando para vocês»
  choice: Manter a declaração sem identificar uma ocasião específica
  alternative: Entendê-la exclusivamente como as aparições após a ressurreição, a vinda por meio do Espírito Santo ou a volta futura de Jesus
  rationale: O contexto permite ressonâncias com mais de uma dessas vindas, e a formulação grega não obriga a escolher somente uma.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural. «Como órfãos» conserva a metáfora familiar; «estou voltando» soa natural no contexto da partida anunciada e mantém aberta a referência da vinda.
