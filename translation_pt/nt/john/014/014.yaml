  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: pt
  text: Se vocês me pedirem alguma coisa em meu nome[a], eu a farei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Se vocês pedirem alguma coisa em meu nome, eu a farei”, omitindo “me”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Se
  rationale: Introduz uma oração condicional; “se” é a forma direta e natural em português.
- source_word: τι
  choice: alguma coisa
  rationale: O pronome indefinido tem sentido aberto no contexto da condição. “Alguma coisa” é natural após “se” e evita a possível estranheza de “qualquer coisa” nesta construção.
- source_word: αἰτήσητέ
  choice: vocês me pedirem
  rationale: O aoristo do subjuntivo, regido por ἐάν, é naturalmente expresso pelo futuro do subjuntivo em português. “Pedir” preserva o sentido de fazer um pedido, e “vocês” torna explícita a segunda pessoa do plural de modo amplamente compreensível.
- source_word: με
  choice: me
  rationale: O pronome objeto consta no texto do SBLGNT e é traduzido explicitamente, indicando que o pedido é dirigido a Jesus.
- source_word: ἐν τῷ ὀνόματί μου
  choice: em meu nome
  rationale: Expressão joanina tradicional, exata e natural, que preserva sua amplitude sem explicá-la excessivamente no texto principal.
- source_word: ἐγὼ
  choice: eu
  rationale: Preserva o pronome grego explícito e seu leve destaque sem acrescentar uma ênfase artificial como “eu mesmo”.
- source_word: ποιήσω
  choice: a farei
  rationale: O futuro é vertido diretamente. O pronome “a” retoma “alguma coisa” e produz uma frase clara e natural.
theological_decisions:
- issue: Presença de με (“me”) e a indicação de que o pedido é dirigido diretamente a Jesus
  choice: Manter “me pedirem” no texto principal
  alternative: “Se vocês pedirem alguma coisa em meu nome, eu a farei”
  rationale: O SBLGNT inclui με, portanto o texto principal o traduz. Como a variante sem o pronome afeta se Jesus é explicitamente o destinatário do pedido, ela é registrada em nota sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” comunica de modo natural o destinatário plural; “em meu nome” conserva a formulação tradicional e a ambiguidade interpretativa legítima.
