id: JHN.14.6
reference: John 14:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: pt
  text: 'Jesus lhe disse[a]: “Eu sou o caminho, a verdade e a vida. Ninguém vem ao Pai senão por mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Jesus lhe diz”. O grego emprega aqui o presente histórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: Embora o grego empregue o presente histórico (“diz”), o pretérito é a forma narrativa mais natural em português atual; a nota preserva a forma do original.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome no dativo indica o destinatário da fala. “Lhe disse” é natural e mantém a referência masculina implícita no contexto.
- source_word: Ἐγώ εἰμι
  choice: Eu sou
  rationale: Tradução direta da expressão enfática, preservando o pronome explícito e a força da autodeclaração.
- source_word: ἡ ὁδός
  choice: o caminho
  rationale: “Caminho” abrange os sentidos concreto e metafórico de ὁδός e expressa naturalmente o acesso ao Pai.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Corresponde ao sentido lexical central de ἀλήθεια e preserva sua amplitude no uso joanino sem paráfrase interpretativa.
- source_word: ἡ ζωή
  choice: a vida
  rationale: Mantém a formulação simples do grego e deixa intacta a amplitude teológica de ζωή no Evangelho de João.
- source_word: οὐδεὶς
  choice: Ninguém
  rationale: Equivalente português direto e natural do pronome negativo universal.
- source_word: ἔρχεται
  choice: vem
  rationale: O presente expressa uma realidade geral; “vem” é o equivalente idiomático e preserva o aspecto não progressivo.
- source_word: πρὸς τὸν πατέρα
  choice: ao Pai
  rationale: A contração “ao” expressa o movimento em direção ao Pai; a maiúscula sinaliza o uso de “Pai” como designação pessoal de Deus neste contexto.
- source_word: εἰ μὴ
  choice: senão
  rationale: Neste contexto, εἰ μή introduz uma exceção. “Senão” é conciso, natural e preserva a força exclusiva da construção.
- source_word: δι’ ἐμοῦ
  choice: por mim
  rationale: διά com genitivo indica meio ou mediação. “Por mim” é idiomático em português e conserva a ideia de acesso mediante Jesus; “através de mim” seria possível, mas menos elegante aqui.
theological_decisions:
- issue: Exclusividade do acesso ao Pai por meio de Jesus
  choice: “Ninguém vem ao Pai senão por mim”
  alternative: “Ninguém vem ao Pai a não ser por meio de mim”
  rationale: A formulação mantém sem atenuação a exclusividade expressa por οὐδεὶς e εἰ μὴ, sem acrescentar conclusões além das palavras do versículo.
- issue: Sequência joanina dos três predicados
  choice: “o caminho, a verdade e a vida”
  alternative: “o caminho, e a verdade, e a vida”
  rationale: O artigo definido é mantido diante de cada substantivo, preservando a distinção dos três predicados. A coordenação portuguesa natural evita a repetição pesada de “e”, sem apagar a estrutura triádica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a concisão, a solenidade e a força exclusiva do grego sem impor terminologia denominacional.
