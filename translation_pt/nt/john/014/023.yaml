source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: pt
  text: 'Jesus lhe respondeu: “Se alguém me ama, guardará a minha palavra[a]. Meu Pai o amará, e nós viremos a ele e faremos nossa morada com ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu ensino” ou “aquilo que eu digo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “faremos com ele nossa habitação” ou “faremos com ele nosso lar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jesus lhe respondeu
  rationale: A fórmula grega literalmente combina ‘respondeu’ e ‘disse a ele’. Em português atual, ‘lhe respondeu’ transmite naturalmente tanto a resposta quanto o destinatário, sem redundância artificial.
- source_word: Ἐάν τις
  choice: Se alguém
  rationale: Preserva a condição indefinida e o alcance geral da expressão grega.
- source_word: ἀγαπᾷ με
  choice: me ama
  rationale: Tradução direta e natural de ἀγαπάω, mantendo a linguagem relacional do contexto.
- source_word: τὸν λόγον μου
  choice: a minha palavra
  rationale: Conserva a dicção joanina e a amplitude de λόγος, que aqui pode abranger a mensagem, o ensino ou aquilo que Jesus diz.
- source_word: τηρήσει
  choice: guardará
  rationale: τηρέω inclui observar, conservar e obedecer. ‘Guardará’ preserva essa amplitude melhor do que uma redução exclusiva a ‘obedecerá’.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Meu Pai o amará
  rationale: Mantém a designação joanina ‘meu Pai’, o futuro e a referência singular do original.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: nós viremos a ele
  rationale: Explicita o sujeito plural já indicado pela forma verbal e preserva o movimento relacional em direção à pessoa.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: faremos nossa morada com ele
  rationale: ‘Morada’ expressa um lugar de permanência, e ‘com ele’ preserva o valor relacional de παρά com o dativo sem impor exclusivamente a ideia espacial de interioridade.
theological_decisions:
- issue: Sujeito divino plural em ‘viremos’ e ‘faremos’
  choice: Preservar explicitamente ‘nós’, referindo-se conjuntamente a Jesus e ao Pai.
  alternative: Suprimir o pronome ou reformular no singular de modo a atenuar a pluralidade.
  rationale: Os dois verbos gregos estão na primeira pessoa do plural e apresentam Jesus e o Pai agindo conjuntamente. A tradução conserva essa forma sem acrescentar uma explicação doutrinária.
- issue: Referência humana genérica no singular
  choice: Usar ‘alguém’ e depois os pronomes singulares masculinos ‘o/ele’.
  alternative: Repetir ‘essa pessoa’ ou reformular toda a frase para evitar pronomes de gênero.
  rationale: O grego começa com o indefinido genérico τις e prossegue com αὐτόν/αὐτῷ no masculino singular. A redação escolhida mantém o número e a progressão gramatical do texto, sendo idiomática em português.
- issue: Localização da morada divina
  choice: Traduzir παρ’ αὐτῷ por ‘com ele’.
  alternative: Traduzir por ‘nele’, enfatizando interioridade, ou ‘junto dele’, enfatizando proximidade.
  rationale: παρά com dativo expressa presença junto de ou na companhia de alguém. ‘Com ele’ mantém a relação de presença e evita resolver além do necessário a natureza espacial ou interior dessa habitação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. ‘Guardará a minha palavra’ e ‘faremos nossa morada’ preservam a linguagem característica de João sem recorrer a vocabulário arcaico. Os marcadores foram colocados junto às expressões às quais as notas realmente se referem.
