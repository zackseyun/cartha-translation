id: JHN.14.10
reference: John 14:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: pt
  text: Você não crê que eu estou no Pai e que o Pai está em mim? As palavras que eu digo a vocês, não as falo por mim mesmo[a]; mas o Pai, que permanece[b] em mim, realiza as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por minha própria iniciativa” ou “por minha própria autoridade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “habita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: crê
  rationale: Preserva o verbo recorrente πιστεύω em João e é natural no contexto da pergunta dirigida a Filipe.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: no Pai ... em mim
  rationale: Mantém literalmente a linguagem joanina de habitação mútua, sem substituí-la por uma paráfrase interpretativa como “em união com”.
- source_word: τὰ ῥήματα
  choice: as palavras
  rationale: É a correspondência direta e natural para ῥήματα neste contexto.
- source_word: λέγω ... λαλῶ
  choice: digo ... falo
  rationale: Conserva, de maneira idiomática em português, a variação entre os dois verbos gregos.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: por mim mesmo
  rationale: Expressão portuguesa natural que preserva a ideia ampla de origem, iniciativa ou autoridade própria, sem fixar apenas uma dessas nuances.
- source_word: μένων
  choice: que permanece
  rationale: Comunica a força durativa de μένω em português atual; “habita” é uma alternativa possível, porém mais interpretativa.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: realiza as suas obras
  rationale: “Realiza” forma uma combinação natural com “obras” e evita a construção menos fluida “faz as suas obras”, preservando o possessivo expresso no texto grego.
theological_decisions:
- issue: Habitação mútua do Pai e do Filho
  choice: “eu estou no Pai e ... o Pai está em mim”
  alternative: “eu e o Pai estamos unidos”
  rationale: A formulação literal preserva a linguagem relacional e cristológica própria deste versículo sem harmonizá-la com outras fórmulas joaninas nem introduzir terminologia dogmática posterior.
- issue: Origem e agência nas palavras e obras de Jesus
  choice: “não as falo por mim mesmo ... o Pai ... realiza as suas obras”
  alternative: “não falo por minha própria autoridade ... o Pai faz as obras por meu intermédio”
  rationale: Preserva tanto a distinção entre Pai e Filho quanto a unidade expressa pela habitação mútua, sem reduzir Jesus a um agente meramente criado nem explicitar além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural ὑμῖν, “crê” para preservar o vocabulário joanino tradicional e corrente, e mantém a repetição teologicamente significativa de “no Pai/em mim”.
