id: JHN.14.4
reference: John 14:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: SBLGNT
  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: pt
  text: E vocês conhecem o caminho para onde eu vou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “E vocês sabem para onde eu vou e conhecem o caminho.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção simples que dá continuidade à fala, sem acrescentar ênfase.
- source_word: ὅπου
  choice: para onde
  rationale: Embora ὅπου seja literalmente “onde”, o verbo de movimento ὑπάγω indica destino; em português corrente, “para onde” expressa naturalmente essa relação.
- source_word: ἐγὼ
  choice: eu
  rationale: Mantém o pronome explícito do grego e identifica com clareza Jesus como sujeito.
- source_word: ὑπάγω
  choice: vou
  rationale: Forma natural em português para o presente de um verbo de movimento, preservando o sentido de ida iminente sem explicitar indevidamente a ideia de partida.
- source_word: οἴδατε
  choice: vocês conhecem
  rationale: οἶδα tem valor presente. Com “o caminho”, “conhecem” é idiomático em português e preserva a ideia de saber qual é o caminho.
- source_word: τὴν ὁδόν
  choice: o caminho
  rationale: “Caminho” abrange tanto o sentido concreto quanto o figurado de ὁδός e se ajusta ao desenvolvimento imediato do discurso.
theological_decisions:
- issue: Relação sintática entre o destino de Jesus e “o caminho”
  choice: E vocês conhecem o caminho para onde eu vou.
  alternative: E, onde eu vou, vocês conhecem o caminho.
  rationale: A formulação escolhida comunica em português natural que os discípulos conhecem o caminho relacionado ao destino de Jesus. “Para” explicita apenas a direção já inerente ao verbo de movimento, sem definir a natureza do destino nem antecipar João 14:6.
- issue: Variante textual que menciona separadamente o destino e o caminho
  choice: Manter no texto principal a forma do SBLGNT, na qual οἴδατε rege “o caminho”.
  alternative: E vocês sabem para onde eu vou e conhecem o caminho.
  rationale: A alternativa representa uma forma textual encontrada em alguns manuscritos e, por isso, é registrada em nota, não incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” torna explícito o referente plural de οἴδατε. A nota preserva a variante textual sem sobrecarregar o versículo.
