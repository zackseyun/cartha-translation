source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: pt
  text: 'Jesus lhe disse: “Há tanto tempo[a] estou com vocês, e você ainda não me conhece, Filipe? Quem me viu, viu o Pai. Como você pode dizer: ‘Mostre-nos o Pai’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Já faz tanto tempo que estou com vocês”.'
    reason: Alternativa idiomática para a expressão de duração Τοσούτῳ χρόνῳ em combinação com “estou com vocês”, preservando a ideia de presença contínua até o presente.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: Há tanto tempo
  rationale: A expressão no dativo indica duração. “Há tanto tempo” é natural em português e mantém a força de surpresa e repreensão da pergunta.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: estou com vocês
  rationale: O presente grego descreve a presença contínua de Jesus até aquele momento. Com “há tanto tempo”, o presente do português expressa naturalmente essa duração.
- source_word: οὐκ ἔγνωκάς με
  choice: você ainda não me conhece
  rationale: O perfeito grego aponta para a falta de conhecimento apesar da convivência anterior, com resultado no presente. “Ainda não me conhece” comunica esse estado e a força de repreensão sem tornar a frase artificial.
- source_word: Φίλιππε
  choice: Filipe
  rationale: Forma portuguesa tradicional e atual do nome próprio no vocativo.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Quem me viu
  rationale: O particípio perfeito substantivado é expresso de modo inclusivo e natural por “quem”. O perfeito indica uma experiência de visão com relevância presente.
- source_word: ἑώρακεν τὸν πατέρα
  choice: viu o Pai
  rationale: Mantém “o Pai”, como no grego, e preserva de forma direta a afirmação cristológica. A repetição de “viu” produz em português uma formulação clara e enfática.
- source_word: πῶς σὺ λέγεις
  choice: Como você pode dizer
  rationale: Aqui πῶς introduz uma pergunta retórica de incredulidade. “Como você pode dizer” transmite essa força em português corrente.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Mostre-nos o Pai
  rationale: O imperativo aoristo de δείκνυμι pede uma ação direta. “Mostre-nos” retoma com precisão o pedido de Filipe no versículo anterior.
theological_decisions:
- issue: Relação entre ver Jesus e ver o Pai
  choice: “Quem me viu, viu o Pai”
  alternative: “Quem me viu, viu como o Pai é” ou uma paráfrase ontológica ampliada
  rationale: A tradução conserva a forte afirmação cristológica do texto sem reduzi-la a mera semelhança representativa e sem acrescentar categorias doutrinárias que não aparecem explicitamente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural ὑμῶν e “você” para o singular dirigido a Filipe. A colocação inicial de “Há tanto tempo” destaca a duração e mantém a força retórica do grego.
