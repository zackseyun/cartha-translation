  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: pt
  text: 'Vocês ouviram que eu lhes disse: “Vou embora e venho até vocês”. Se vocês me amassem, teriam se alegrado[a] por eu ir para o Pai, porque o Pai é maior do que eu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “vocês se alegrariam por eu ir para o Pai”. A forma grega admite uma expressão mais geral, mas “teriam se alegrado” se ajusta melhor à condição contrária à realidade neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: A afirmação “o Pai é maior do que eu” foi traduzida como está escrita, sem acrescentar uma qualificação interpretativa, como “em função” ou “em posição”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Vocês ouviram
  rationale: O aoristo indica que os discípulos já ouviram a declaração anterior de Jesus; o pretérito perfeito é natural em português.
- source_word: ὅτι
  choice: que / por / porque
  rationale: 'As ocorrências exercem funções contextuais distintas: introdução do conteúdo ouvido, motivo da alegria e fundamento da afirmação final.'
- source_word: Ὑπάγω
  choice: Vou embora
  rationale: Expressa de modo natural o movimento de afastamento indicado pelo verbo, com força iminente no contexto.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: venho para vocês
  rationale: Preserva o verbo de movimento em direção aos discípulos e sua forma vívida no presente, sem explicitar como ou quando essa vinda ocorrerá.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Se vocês me amassem
  rationale: O imperfeito integra uma condição apresentada como contrária à realidade; o pretérito imperfeito do subjuntivo comunica isso naturalmente em português.
- source_word: ἐχάρητε ἄν
  choice: teriam se alegrado
  rationale: O aoristo com ἄν, na consequência de uma condição irreal, aponta para a alegria que teria ocorrido.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: eu ir para o Pai
  rationale: Mantém a ideia de deslocamento e o destino relacional, tratando “o Pai” como título, conforme o artigo grego.
- source_word: πατέρα / πατὴρ
  choice: o Pai
  rationale: O grego traz o artigo, sem possessivo explícito; “o Pai” preserva essa formulação e o uso titular joanino.
- source_word: μείζων
  choice: maior
  rationale: É o equivalente comparativo direto, sem acrescentar uma esfera de superioridade que o texto não especifica.
- source_word: μού
  choice: do que eu
  rationale: Forma comparativa clara e gramatical em português, mantendo a referência de primeira pessoa.
theological_decisions:
- issue: Sentido de “o Pai é maior do que eu” em relação à cristologia
  choice: Manter a comparação literal “o Pai é maior do que eu”, sem qualificação interpretativa no texto principal.
  alternative: “o Pai é maior do que eu em função ou posição” ou “o Pai é maior do que eu quanto ao meu estado encarnado”
  rationale: O grego enuncia a comparação sem indicar em que sentido ela se aplica. A tradução preserva a tensão teológica e não insere no versículo uma solução confessional ou antinicena.
- issue: Referência de “venho para vocês”
  choice: Não identificar no texto principal a vinda com a ressurreição, o Espírito ou a parusia.
  alternative: Traduzir ou explicar a frase de modo que especifique um desses acontecimentos.
  rationale: A formulação grega não resolve explicitamente a referência; a tradução deve conservar essa abertura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Vocês” oferece clareza internacional com boa legibilidade brasileira. A construção “vou embora e venho para vocês” conserva o paralelismo e a tensão temporal do grego, evitando substituir interpretativamente “venho” por “volto” ou explicitar o acontecimento referido.
